chaosx_nr25_reconfigure_signals_station_effect: "The outpost gains intelligence and signal capacity, with a higher Exposure Risk."
chaosx_nr25_reconfigure_fortified_camp_effect: "The outpost gains security and readiness, with a heavier field commitment."
chaosx_nr25_reconfigure_mobile_traverse_effect: "The expedition gains movement and progress, at the cost of security and exposure control."
