l_english:

# Event 025 core and settlement
chaosx.nr25.1.t: "A Light Under the Ice"
chaosx_super_event.109.t: "A LIGHT OVER THE ICE"
chaosx_super_event.109.q: "To follow knowledge, like a sinking star, / Beyond the utmost bound of human thought."
chaosx_super_event.109.a: "Terra incognita."
chaosx_super_event.109.d: "A chain of impossible readings beneath the Antarctic ice has drawn the world's attention. Expeditions will cross the southern ocean, establish their own footholds, and decide whether the evidence becomes knowledge, inheritance, or a danger no government can contain."
chaosx.nr25.2.t: "The Wreck Beneath the Ice"
chaosx.nr25.2.d: "A survey flight has found a buried structure in Antarctica. Its surfaces and instruments resist immediate classification, and the ice gives off an intermittent thermal trace. Every government that can reach the southern waters must decide whether to join a controlled expedition."
chaosx.nr25.2.a: "Send an expedition."
chaosx.nr25.2.b: "Leave the ice undisturbed."
chaosx.nr25.2.c: "Request a route estimate."
chaosx.nr25.3.t: "A Route Through the Southern Ocean"
chaosx.nr25.3.d: "The route office has compared the available shipping lanes with the expedition's fuel, support, and civilian commitments. [This.GetChaosxNr25EntryEstimate] The choice will be recorded as an expedition route, not as a claim on the Antarctic interior."
chaosx.nr25.3.a: "Authorize the expedition."
chaosx.nr25.3.b: "Stand down."
chaosx_nr25_route_estimate_direct: "A direct coastal departure is available, but it will leave a visible shipping trail."
chaosx_nr25_route_estimate_chartered: "A chartered or inland approach is required, with extra coordination before the southern crossing."
chaosx.nr25.4.t: "The Expedition Roster Is Sealed"
chaosx.nr25.5.t: "Southbound Orders"
chaosx.nr25.5.d: "The entry window is closed. Crews, instruments, and supply ships are now committed to a race governed by weather, evidence, and the limits of the unfamiliar systems beneath the ice."
chaosx.nr25.5.a: "Open the board."
chaosx.nr25.70.t: "Choose the Outpost's Emphasis"
chaosx.nr25.70.d: "The first camp can become a logistics depot, survey station, signals station, fortified camp, or mobile traverse camp. This public role shapes what the expedition can protect and measure; it does not reveal the buried core's location."
chaosx.nr25.70.a: "Build a logistics depot."
chaosx.nr25.70.b: "Build a survey station."
chaosx.nr25.70.c: "Build a signals station."
chaosx.nr25.70.d: "Build a fortified camp."
chaosx.nr25.70.e: "Build a mobile traverse camp."
chaosx.nr25.84.t: "The Race Is Decided"
chaosx.nr25.81.t: "A Light Recovered"
chaosx.nr25.81.d: "Our expedition reached the confirmed recovery site first. The recovered system is neither a weapon nor a relic of any known state. It is an alien-derived machine whose operating principles can be studied, if we can keep it from becoming the master of its handlers."
chaosx.nr25.81.a: "Secure the alien-derived system."
chaosx.nr25.82.t: "The Ice Keeps Its Secrets"
chaosx.nr25.82.d: "Another expedition has secured the primary recovery site. Our teams return with only the evidence they verified: survey notes, broken fragments, and a clearer account of the alien-derived systems beneath the ice."
chaosx.nr25.82.a: "Preserve what we verified."
chaosx.nr25.83.t: "The Antarctic Dossier"
chaosx.nr25.83.d: "The expedition has become a permanent entry in our scientific and diplomatic record. Its public account can be shared, sealed, or used to shape the next decision about alien-derived systems."
chaosx.nr25.83.a: "File the dossier."
chaosx.nr25.280.t: "Antarctic Expedition Pulse"
chaosx.nr25.299.t: "No Expedition Crosses the Ice"
chaosx.nr25.299.d: "The entry window closed without a valid expedition. The buried alien-derived system remains beyond any claimant's reach."
chaosx.nr25.299.a: "Close the file."

# Independently enabled evolution openings
chaosx.nr25.100.t: "Active Signal"
chaosx.nr25.100.d: "A buried transmitter has begun to answer the field instruments. The signal is patterned, patient, and not addressed in any human language. It adds danger to the crossing, but it does not make recovery impossible."
chaosx.nr25.100.a: "Record the signal and continue."
chaosx.nr25.130.t: "Something Survived"
chaosx.nr25.130.d: "A movement has been observed beyond the wreck's outer shell. It may be a surviving mechanism, a biological response, or an echo in the snow. The crews must account for it without abandoning the recovery race."
chaosx.nr25.130.a: "Keep the crews together."
chaosx.nr25.160.t: "Militarised Antarctica"
chaosx.nr25.160.d: "The expedition flags have been joined by armed patrols and emergency claims. Antarctica is becoming a theatre of rivalry, but no world war is required: the crisis can still be contained through rescue, interception, or a demilitarised compact."
chaosx.nr25.160.a: "Hold the line without widening the war."
chaosx.nr25.190.t: "The Wreck Is Breaking Apart"
chaosx.nr25.190.d: "The alien-derived wreck is shedding hot fragments into six distinct sectors. Each piece is evidence and hazard at once. A careful team can recover the fragments without losing the primary race."
chaosx.nr25.190.a: "Map every field of debris."
chaosx.nr25.220.t: "The Technology Changes Its Users"
chaosx.nr25.220.d: "The recovered system is beginning to anticipate its operators. Dependence is measurable, recoverable, and dangerous. The expedition may contain, destroy, transfer, conceal, or integrate the alien-derived system."
chaosx.nr25.220.a: "Keep human judgment at the centre."

# Decision categories
chaosx_nr25_expedition_category: "Antarctic Expedition Board"
chaosx_nr25_expedition_category_desc: "Manage the alien-derived recovery race through six Antarctic sectors. The board displays only Expedition Progress, Logistics Readiness, and Exposure Risk as its main values."
chaosx_nr25_evolution_category: "Antarctic Hazards"
chaosx_nr25_evolution_category_desc: "Respond to the active hazard without losing sight of the baseline recovery race."
chaosx_nr25_countermeasure_category: "Expedition Countermeasures"
chaosx_nr25_countermeasure_category_desc: "Repair a verified rival action and keep the expedition moving."
chaosx_nr25_analysis_category: "Alien Systems Analysis"
chaosx_nr25_analysis_category_desc: "Settle the diplomatic, scientific, and security consequences of verified alien-derived systems."

# Primary expedition actions
chaosx_nr25_authorize_expedition: "Authorize the Southern Expedition"
chaosx_nr25_authorize_expedition_desc: "Commit civilian industry, fuel, support equipment, and shipping to a direct scientific expedition."
chaosx_nr25_authorize_effect: "The expedition gains access, crew capacity, progress, and a civilian commitment while Exposure Risk rises."
chaosx_nr25_charter_neutral_shipping: "Charter Neutral Shipping"
chaosx_nr25_charter_neutral_shipping_desc: "Use neutral shipping to reach the southern waters when a direct route is not available."
chaosx_nr25_charter_effect: "The expedition gains a chartered route and access with modest progress and Exposure Risk."
chaosx_nr25_secure_scientific_exchange: "Secure a Scientific Exchange"
chaosx_nr25_secure_scientific_exchange_desc: "Trade instruments and methods with a research partner before departure."
chaosx_nr25_secure_scientific_exchange_effect: "Scientific capacity, intelligence, progress, and readiness improve."
chaosx_nr25_conceal_departure: "Conceal the Departure"
chaosx_nr25_conceal_departure_desc: "Commit civilian industry to a quiet departure, keeping the expedition's route and instruments out of hostile reports."
chaosx_nr25_conceal_departure_effect: "Intelligence, progress, and readiness improve while Exposure Risk falls. Civilian industry remains committed to the expedition."
chaosx_nr25_stockpile_forward_depot: "Stockpile a Forward Depot"
chaosx_nr25_stockpile_forward_depot_desc: "Build a forward cache for fuel and support equipment before the crossing."
chaosx_nr25_stockpile_forward_depot_effect: "The expedition gains progress and Logistics Readiness."
chaosx_nr25_aerial_route_survey: "Survey the Aerial Route"
chaosx_nr25_aerial_route_survey_desc: "Use aircraft and ground instruments to identify a safer approach to the ice."
chaosx_nr25_aerial_route_survey_effect: "Intelligence, progress, and readiness improve while the crossing becomes more exposed."
chaosx_nr25_establish_radio_net: "Establish a Radio Net"
chaosx_nr25_establish_radio_net_desc: "Link the expedition to distant weather stations and scientific observers."
chaosx_nr25_establish_radio_net_effect: "Intelligence and readiness improve; the network creates a small signal signature."
chaosx_nr25_recruit_polar_crew: "Recruit a Polar Crew"
chaosx_nr25_recruit_polar_crew_desc: "Bring experienced polar personnel into the expedition before the weather closes the route."
chaosx_nr25_recruit_polar_crew_effect: "Crew capacity, progress, and readiness improve."
chaosx_nr25_south_america_gateway: "Open the South American Gateway"
chaosx_nr25_south_america_gateway_desc: "Move the expedition through South American ports and establish the first southern supply line."
chaosx_nr25_south_america_gateway_effect: "Access, progress, and readiness improve as the expedition begins its crossing."
chaosx_nr25_southern_africa_gateway: "Open the Southern African Gateway"
chaosx_nr25_southern_africa_gateway_desc: "Use southern African ports to create a longer but resilient approach to the ice."
chaosx_nr25_southern_africa_gateway_effect: "Access, progress, and readiness improve through an alternate crossing route."
chaosx_nr25_tasmania_gateway: "Open the Tasman Gateway"
chaosx_nr25_tasmania_gateway_desc: "Use the Tasman route to approach Antarctica with a compact support chain."
chaosx_nr25_tasmania_gateway_effect: "Access, progress, and readiness improve through the Tasman route."
chaosx_nr25_establish_outpost: "Establish the Antarctic Outpost"
chaosx_nr25_establish_outpost_desc: "Build a functioning outpost from which survey parties can work across the ice."
chaosx_nr25_establish_outpost_effect: "Outpost security, progress, and readiness improve while Exposure Risk rises."
chaosx_nr25_reinforce_outpost: "Reinforce the Outpost"
chaosx_nr25_reinforce_outpost_desc: "Add shelter and reserve stores before the field teams move toward the wreck."
chaosx_nr25_reinforce_outpost_effect: "Outpost security, progress, and readiness improve."
chaosx_nr25_rotate_polar_crew: "Rotate the Polar Crew"
chaosx_nr25_rotate_polar_crew_desc: "Replace exhausted personnel and preserve the expedition's ability to operate in the cold."
chaosx_nr25_rotate_polar_crew_effect: "Crew, progress, and readiness improve while the rotation leaves a visible trace."
chaosx_nr25_emergency_shelter: "Raise Emergency Shelter"
chaosx_nr25_emergency_shelter_desc: "Protect the field party from a weather emergency without abandoning the outpost."
chaosx_nr25_emergency_shelter_effect: "Readiness improves and Exposure Risk falls, but the shelter consumes reserve personnel and stores."
chaosx_nr25_shelter_effect: "Readiness improves and Exposure Risk falls, but the shelter consumes reserve personnel and stores."
chaosx_nr25_prepare_alternate_landing: "Prepare an Alternate Landing"
chaosx_nr25_prepare_alternate_landing_desc: "Chart an improvised landing site after weather, route failure, or a compromised outpost makes the planned approach unsafe."
chaosx_nr25_prepare_alternate_landing_effect: "The expedition gains a fallback route and access while Exposure Risk falls."
chaosx_nr25_escort_supply_convoys: "Escort Supply Convoys"
chaosx_nr25_escort_supply_convoys_desc: "Protect the next Antarctic supply movement after a convoy incident or an escalation in the recovery race."
chaosx_nr25_escort_supply_convoys_effect: "Readiness improves and the convoy incident is cleared, at the cost of fuel, shipping, support, and personnel."
chaosx_nr25_aerial_grid: "Fly the Aerial Grid"
chaosx_nr25_aerial_grid_desc: "Sweep the first Antarctic sector for thermal and magnetic evidence."
chaosx_nr25_aerial_grid_effect: "The expedition records one verified survey result and advances toward the wreck."
chaosx_nr25_ground_transect: "Run a Ground Transect"
chaosx_nr25_ground_transect_desc: "Cross the selected sector with instruments that can distinguish ice pressure from alien-derived material."
chaosx_nr25_ground_transect_effect: "The expedition records one verified survey result and improves its approach."
chaosx_nr25_signal_triangulation: "Triangulate the Signal"
chaosx_nr25_signal_triangulation_desc: "Compare three field instruments to isolate a repeatable alien-derived signature."
chaosx_nr25_signal_triangulation_effect: "The expedition gains stronger evidence and intelligence."
chaosx_nr25_reconnoitre_rival: "Reconnoitre a Rival Expedition"
chaosx_nr25_reconnoitre_rival_desc: "Use permitted observation to learn which rival routes are real and which are only reported."
chaosx_nr25_reconnoitre_rival_effect: "The expedition gains limited intelligence without revealing private rival records."
chaosx_nr25_recover_verified_fragment: "Recover a Verified Fragment"
chaosx_nr25_recover_verified_fragment_desc: "Remove one documented fragment from the selected sector and record its exclusive owner."
chaosx_nr25_recover_verified_fragment_effect: "A single fragment slot is assigned to this country if its ownership is still open."
chaosx_nr25_analyze_recovered_fragment: "Analyze the Recovered Fragment"
chaosx_nr25_analyze_recovered_fragment_desc: "Use civilian laboratories to compare a recovered fragment with the six-sector survey record without surrendering its exclusive ownership."
chaosx_nr25_analyze_recovered_fragment_effect: "The fragment record yields intelligence and additional verified evidence while civilian industry remains committed."
chaosx_nr25_controlled_recovery: "Attempt Controlled Recovery"
chaosx_nr25_controlled_recovery_desc: "Use the outpost and verified survey record to begin a careful recovery of the primary alien-derived system."
chaosx_nr25_controlled_recovery_effect: "The country submits a valid final-recovery candidate with the strongest stability profile."
chaosx_nr25_rapid_extraction: "Attempt Rapid Extraction"
chaosx_nr25_rapid_extraction_desc: "Trade readiness for speed before another expedition closes on the site."
chaosx_nr25_rapid_extraction_effect: "The country submits a faster but more exposed final-recovery candidate."
chaosx_nr25_remote_recovery_rig: "Deploy a Remote Recovery Rig"
chaosx_nr25_remote_recovery_rig_desc: "Use a remote rig to keep personnel away from the hottest part of the wreck."
chaosx_nr25_remote_recovery_rig_effect: "The country submits a lower-exposure final-recovery candidate with slower progress."
chaosx_nr25_armed_retrieval: "Attempt Armed Retrieval"
chaosx_nr25_armed_retrieval_desc: "Commit personnel and equipment to seize the primary system under hostile conditions."
chaosx_nr25_armed_retrieval_effect: "The country submits a forceful final-recovery candidate with high Exposure Risk."
chaosx_nr25_distributed_salvage: "Begin Distributed Salvage"
chaosx_nr25_distributed_salvage_desc: "Divide the recovery across several teams so one accident cannot destroy every verified result."
chaosx_nr25_distributed_salvage_effect: "The country submits a resilient final-recovery candidate with broad evidence."
chaosx_nr25_sabotage_rival_expedition: "Sabotage a Rival Expedition"
chaosx_nr25_sabotage_rival_expedition_desc: "Attempt a costly intelligence operation against one selected, active participant."
chaosx_nr25_sabotage_rival_expedition_effect: "The selected rival suffers a partial or full operational setback if the target is valid."
chaosx_nr25_steal_survey_data: "Steal Survey Data"
chaosx_nr25_steal_survey_data_desc: "Take one selected rival's survey records and risk attribution in the process."
chaosx_nr25_steal_survey_data_effect: "The selected rival loses verified survey evidence while the infiltrator gains limited intelligence."
chaosx_nr25_feed_false_coordinates: "Feed False Coordinates"
chaosx_nr25_feed_false_coordinates_desc: "Send one selected rival toward a false Antarctic field marker."
chaosx_nr25_feed_false_coordinates_effect: "The selected rival receives a temporary false-site state that can be exposed by counterintelligence."
chaosx_nr25_compromise_stores: "Compromise Stores"
chaosx_nr25_compromise_stores_desc: "Disrupt one selected rival's depots before the next supply pulse."
chaosx_nr25_compromise_stores_effect: "The selected rival loses readiness, with a stronger setback when its stores are already strained."
chaosx_nr25_intercept_convoy: "Intercept a Convoy"
chaosx_nr25_intercept_convoy_desc: "Intercept one selected rival's Antarctic convoy while the route remains reachable."
chaosx_nr25_intercept_convoy_effect: "The selected rival loses convoy readiness and the operation leaves a more visible diplomatic trace."
chaosx_nr25_prepare_countermeasure: "Prepare a Countermeasure"
chaosx_nr25_prepare_countermeasure_desc: "Use verified evidence to blunt the next hostile operation against this expedition."
chaosx_nr25_prepare_countermeasure_effect: "The next valid sabotage is intercepted or its damage is reduced."

