chaosx.nr25.86.t: "The Ice Rejects the Recovery"
chaosx.nr25.86.d: "The final recovery attempt has failed without erasing the expedition's verified evidence. The crews have lost time, stores, and confidence, but a later attempt remains possible after the operation's cooldown."
chaosx.nr25.86.a: "Rebuild the approach."
chaosx.nr25.298.t: "The Last Expedition Withdraws"
chaosx.nr25.298.d: "No active expedition remains in the Antarctic record. Verified survey notes and exclusive fragment ownership remain preserved, while the primary recovery passes out of immediate reach."
chaosx.nr25.298.a: "Close the Antarctic file."

