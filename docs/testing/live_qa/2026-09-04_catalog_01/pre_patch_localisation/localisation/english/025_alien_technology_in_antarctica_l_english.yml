# Event Details and log wording
chaosx_nr25_event_log_title: "Alien Technology in Antarctica"
chaosx_nr25_event_log_type: "Calm World Major"
chaosx_nr25_event_log_evolution_type: "Alien Technology Evolutions"
chaosx_nr25_event_log_opening_stage: "Impossible readings beneath the Antarctic ice open a controlled expedition race."
chaosx_nr25_event_log_opening_body: "Governments with direct expedition authority receive the first invitation. Other capable powers enter only after the initial responses define the race."
chaosx_nr25_event_log_settlement_stage: "The primary recovery is resolved."
chaosx_nr25_event_log_settlement_body: "The winning country receives one non-duplicate result derived from the recovered systems. Losing countries retain only verified survey or exclusive fragment evidence."
chaosx_nr25_event_log_detail: "The Antarctic recovery record follows a race across six field sectors, with private expedition records, verified survey evidence, exclusive fragments, and five independent hazards. One expedition secures the primary alien-derived result. Every other expedition keeps only what it verified."
chaosx_nr25_event_log_evolution_summary: "Five independently enabled Antarctic hazards can change the race without replacing its baseline recovery condition."
chaosx_nr25_event_log_evolution_active_signal: "Active Signal"
chaosx_nr25_event_log_evolution_something_survived: "Something Survived"
chaosx_nr25_event_log_evolution_militarised_antarctica: "Militarised Antarctica"
chaosx_nr25_event_log_evolution_wreck_breaking_apart: "The Wreck Is Breaking Apart"
chaosx_nr25_event_log_evolution_technology_changes_users: "The Technology Changes Its Users"
chaosx.nr25.evolution.active_signal.title: "Active Signal"
chaosx.nr25.evolution.active_signal.body: "The buried transmitter answers field instruments in a patient, non-human pattern. The signal increases the hazard of the race without removing the possibility of recovery."
chaosx.nr25.evolution.active_signal.summary: "A signal is active beneath the ice."
chaosx.nr25.evolution.something_survived.title: "Something Survived"
chaosx.nr25.evolution.something_survived.body: "Movement has been observed beyond the wreck's outer shell. It may be a mechanism, a biological response, or an echo in the snow, but the field teams must account for it while the recovery race continues."
chaosx.nr25.evolution.something_survived.summary: "A surviving trace alters the field operation."
chaosx.nr25.evolution.militarised_antarctica.title: "Militarised Antarctica"
chaosx.nr25.evolution.militarised_antarctica.body: "Armed patrols and emergency claims are joining the expedition flags. The local crisis can still be contained through rescue, interception, or a demilitarised compact without forcing a global war."
chaosx.nr25.evolution.militarised_antarctica.summary: "The Antarctic contest has acquired armed pressure."
chaosx.nr25.evolution.wreck_breaking_apart.title: "The Wreck Is Breaking Apart"
chaosx.nr25.evolution.wreck_breaking_apart.body: "The alien-derived wreck is shedding hot fragments into six distinct sectors. Each field is evidence and hazard at once, and careful recovery can preserve the primary race."
chaosx.nr25.evolution.wreck_breaking_apart.summary: "Fragment fields are spreading across the ice."
chaosx.nr25.evolution.technology_changes_users.title: "The Technology Changes Its Users"
chaosx.nr25.evolution.technology_changes_users.body: "The recovered system is beginning to anticipate its operators. Dependence remains measurable and recoverable, but each custody decision changes the relationship between human judgment and the alien-derived interface."
chaosx.nr25.evolution.technology_changes_users.summary: "The recovered system is shaping its custodians."
