chaosx_nr25_reach_gateway_mission: "Reach the Gateway"
chaosx_nr25_reach_gateway_mission_desc: "Carry the expedition through its selected southern route and keep access open."
chaosx_nr25_establish_antarctic_outpost_mission: "Establish the Antarctic Outpost"
chaosx_nr25_establish_antarctic_outpost_mission_desc: "Turn a temporary landing into a functioning, supplied Antarctic foothold."
chaosx_nr25_triangulate_crash_zone_mission: "Triangulate the Crash Zone"
chaosx_nr25_triangulate_crash_zone_mission_desc: "Reconcile the signal, terrain, and flight evidence around the buried site."
chaosx_nr25_protect_supply_route_mission: "Protect the Supply Route"
chaosx_nr25_protect_supply_route_mission_desc: "Keep stores and crew rotations moving through the southern weather window."
chaosx_nr25_confirm_primary_site_mission: "Confirm the Primary Site"
chaosx_nr25_confirm_primary_site_mission_desc: "Convert survey evidence into a reliable recovery coordinate."
chaosx_nr25_evacuate_expedition_mission: "Evacuate the Expedition"
chaosx_nr25_evacuate_expedition_mission_desc: "Bring the crew and verified records home while the ice still permits a withdrawal."
chaosx_nr25_stabilize_wreck_mission: "Stabilize the Wreck"
chaosx_nr25_stabilize_wreck_mission_desc: "Hold the alien-derived wreck together long enough to preserve its fragment fields."
chaosx_nr25_contain_alien_systems_mission: "Contain Alien Systems"
chaosx_nr25_contain_alien_systems_mission_desc: "Build a reversible containment protocol around the recovered alien-derived systems."
chaosx_nr25_organize_mission_success_tt: "The departure plan is ready and the expedition gains a small reserve of operational momentum."
chaosx_nr25_organize_mission_timeout_tt: "The departure plan loses stores and readiness; an emergency resupply route is available."
chaosx_nr25_gateway_mission_success_tt: "The southern gateway is secured and the route burden is reduced."
chaosx_nr25_gateway_mission_timeout_tt: "The gateway window closes before the route is fully secured; access must be renegotiated."
chaosx_nr25_outpost_mission_success_tt: "The Antarctic outpost becomes a functioning base for survey work."
chaosx_nr25_outpost_mission_timeout_tt: "The outpost is damaged before it can be fully supplied, but the expedition remains in the race."
chaosx_nr25_triangulate_mission_success_tt: "The crash zone is triangulated from independent evidence."
chaosx_nr25_triangulate_mission_timeout_tt: "The crash zone remains uncertain and the false-map sector becomes suspect."
chaosx_nr25_supply_route_mission_success_tt: "The next supply movement is protected from a routine route setback."
chaosx_nr25_supply_route_mission_timeout_tt: "A route incident drains readiness and leaves a convoy report in the record."
chaosx_nr25_confirm_site_mission_success_tt: "The primary recovery coordinate is confirmed from the expedition's verified evidence."
chaosx_nr25_confirm_site_mission_timeout_tt: "The primary coordinate remains exposed and the expedition loses some progress."
chaosx_nr25_evacuation_mission_success_tt: "The expedition reaches safety with its verified survey and fragment records intact."
chaosx_nr25_evacuation_mission_timeout_tt: "The evacuation window collapses; the remaining crew and records are recovered at a higher cost."
chaosx_nr25_stabilize_wreck_mission_success_tt: "The wreck remains coherent and its fragment fields stay recoverable."
chaosx_nr25_stabilize_wreck_mission_timeout_tt: "The wreck loses integrity before the stabilization can hold."
chaosx_nr25_contain_systems_mission_success_tt: "The recovered alien-derived systems enter a safe containment state."
chaosx_nr25_contain_systems_mission_timeout_tt: "Containment fails to settle the systems; Dependence and accident risk remain active."
