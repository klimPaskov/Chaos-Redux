chaosx_nr25_exchange_weather_data: "Exchange Weather Data"
chaosx_nr25_exchange_weather_data_desc: "Share a verified route note with one different expedition before the primary recovery is resolved."
chaosx_nr25_exchange_weather_data_effect: "The selected partner receives a limited survey report, while both expeditions improve their approach."
chaosx_nr25_exchange_weather_data_cost: "£pol_power 5  £support_equipment_text_icon 25"

# Evolution actions
chaosx_nr25_signal_remote: "Listen from a Distance"
chaosx_nr25_signal_remote_desc: "Use passive instruments to observe the active signal without answering it."
chaosx_nr25_signal_remote_effect: "Intelligence improves while the signal remains unprovoked."
chaosx_nr25_signal_follow: "Follow the Carrier Wave"
chaosx_nr25_signal_follow_desc: "Track the signal across the ice to improve access to the wreck."
chaosx_nr25_signal_follow_effect: "Progress and wreck access improve, with increased Exposure Risk."
chaosx_nr25_signal_shield: "Shield the Instruments"
chaosx_nr25_signal_shield_desc: "Protect field instruments from the signal's strongest pulses."
chaosx_nr25_signal_shield_effect: "Logistics Readiness improves and the signal's exposure pressure falls."
chaosx_nr25_signal_jam: "Jam the Signal"
chaosx_nr25_signal_jam_desc: "Break the repeating transmission before it can coordinate with the wreck."
chaosx_nr25_signal_jam_effect: "The signal is disrupted, but the expedition becomes more exposed."
chaosx_nr25_signal_broadcast: "Broadcast a Controlled Reply"
chaosx_nr25_signal_broadcast_desc: "Send a deliberate reply and accept the consequences of being heard."
chaosx_nr25_signal_broadcast_effect: "Intelligence and evidence improve, while the signal hazard becomes more active."
chaosx_nr25_survivor_avoid: "Avoid Contact"
chaosx_nr25_survivor_avoid_desc: "Route around the moving trace and preserve the baseline recovery timetable."
chaosx_nr25_survivor_avoid_effect: "Exposure Risk falls without creating a direct personnel contact."
chaosx_nr25_survivor_guard: "Guard the Survey Team"
chaosx_nr25_survivor_guard_desc: "Place ordinary expedition security around the field team without forming a military escort."
chaosx_nr25_survivor_guard_effect: "Readiness improves while the survivor trace is watched."
chaosx_nr25_survivor_capture: "Capture the Surviving Trace"
chaosx_nr25_survivor_capture_desc: "Commit personnel to a direct attempt to contain the surviving mechanism or presence."
chaosx_nr25_survivor_capture_effect: "Progress and intelligence improve, but personnel and Exposure Risk are spent."
chaosx_nr25_survivor_path: "Map Its Path"
chaosx_nr25_survivor_path_desc: "Study movement patterns without closing the distance."
chaosx_nr25_survivor_path_effect: "Wreck access improves with a measured exposure increase."
chaosx_nr25_survivor_turn: "Turn the Trace Away"
chaosx_nr25_survivor_turn_desc: "Use a controlled diversion to move the trace away from the main outpost."
chaosx_nr25_survivor_turn_effect: "Intelligence improves and Exposure Risk falls."
chaosx_nr25_militarisation_blockade: "Blockade the Approach"
chaosx_nr25_militarisation_blockade_desc: "Use a local security cordon to protect the outpost without declaring a global war."
chaosx_nr25_militarisation_blockade_effect: "Progress improves, but the local crisis becomes more visible."
chaosx_nr25_militarisation_seize: "Seize the Landing Zone"
chaosx_nr25_militarisation_seize_desc: "Commit personnel to take control of a disputed approach."
chaosx_nr25_militarisation_seize_effect: "Progress improves sharply while Exposure Risk and personnel losses rise."
chaosx_nr25_militarisation_rescue: "Rescue a Rival Crew"
chaosx_nr25_militarisation_rescue_desc: "Recover a rival team from a real personnel-loss crisis before it is lost in the ice."
chaosx_nr25_militarisation_rescue_effect: "Crew capacity and progress improve through a valid rescue."
chaosx_nr25_militarisation_intercept: "Intercept a Military Patrol"
chaosx_nr25_militarisation_intercept_desc: "Observe or divert an armed patrol that threatens the field operation."
chaosx_nr25_militarisation_intercept_effect: "Intelligence improves and the patrol is recorded as a diplomatic incident."
chaosx_nr25_militarisation_demilitarized: "Offer a Demilitarised Compact"
chaosx_nr25_militarisation_demilitarized_desc: "Trade political capital for a local compact that keeps the Antarctic crisis from widening."
chaosx_nr25_militarisation_demilitarized_effect: "Readiness improves and Exposure Risk falls without forcing a world war."
chaosx_nr25_wreck_stabilize: "Stabilise the Wreck"
chaosx_nr25_wreck_stabilize_desc: "Use support equipment to keep the primary alien-derived structure intact."
chaosx_nr25_wreck_stabilize_effect: "Wreck access and progress improve while fragment pressure is reduced."
chaosx_nr25_wreck_cut: "Cut Loose a Fragment"
chaosx_nr25_wreck_cut_desc: "Separate one dangerous fragment before the wreck sheds it into the field."
chaosx_nr25_wreck_cut_effect: "Progress and fragment evidence improve at a higher Exposure Risk."
chaosx_nr25_wreck_map: "Map the Debris Fields"
chaosx_nr25_wreck_map_desc: "Record each fragment field and its relationship to the primary system."
chaosx_nr25_wreck_map_effect: "Intelligence and verified survey evidence improve."
chaosx_nr25_wreck_distribute: "Distribute Fragment Custody"
chaosx_nr25_wreck_distribute_desc: "Place fragments with separate verified custodians so a single accident cannot erase the record."
chaosx_nr25_wreck_distribute_effect: "Survey evidence and readiness improve."
chaosx_nr25_wreck_leave: "Leave the Unstable Core"
chaosx_nr25_wreck_leave_desc: "Preserve the primary race by leaving the most unstable fragment field untouched."
chaosx_nr25_wreck_leave_effect: "The expedition advances cautiously and lowers Exposure Risk."
chaosx_nr25_dependence_contain: "Contain Alien Dependence"
chaosx_nr25_dependence_contain_desc: "Retain the recovered alien-derived system behind human safeguards and a reversible custody plan."
chaosx_nr25_dependence_contain_effect: "Dependence becomes recoverable, Exposure Risk falls, and the system remains retained."
chaosx_nr25_dependence_destroy: "Destroy the Interface"
chaosx_nr25_dependence_destroy_desc: "Burn out the interface before it can deepen its influence over its users."
chaosx_nr25_dependence_destroy_effect: "Dependence falls, but the operation becomes highly exposed and the retained reward is reduced."
chaosx_nr25_dependence_transfer: "Transfer Custody"
chaosx_nr25_dependence_transfer_desc: "Move the alien-derived system to a separate scientific custodian under a witnessed handover."
chaosx_nr25_dependence_transfer_effect: "Dependence and intelligence shift while the transfer remains recorded."
chaosx_nr25_dependence_conceal: "Conceal the System"
chaosx_nr25_dependence_conceal_desc: "Hide the alien-derived system and its custody trail from public scrutiny."
chaosx_nr25_dependence_conceal_effect: "Exposure Risk and Dependence fall, but diplomatic knowledge is narrowed."
chaosx_nr25_dependence_integrate: "Integrate the System"
chaosx_nr25_dependence_integrate_desc: "Place the alien-derived interface inside national research and command systems."
chaosx_nr25_dependence_integrate_effect: "Dependence rises sharply alongside progress and Exposure Risk."

