chaosx_nr25_reconfigure_survey_station_desc: "Shift the public outpost emphasis toward field measurements and evidence."
chaosx_nr25_reconfigure_signals_station: "Reconfigure the Outpost as a Signals Station"
chaosx_nr25_reconfigure_signals_station_desc: "Shift the public outpost emphasis toward radio and signal analysis."
chaosx_nr25_reconfigure_fortified_camp: "Reconfigure the Outpost as a Fortified Camp"
chaosx_nr25_reconfigure_fortified_camp_desc: "Shift the public outpost emphasis toward protection and hardened stores."
chaosx_nr25_reconfigure_mobile_traverse: "Reconfigure the Outpost as a Mobile Traverse Camp"
chaosx_nr25_reconfigure_mobile_traverse_desc: "Shift the public outpost emphasis toward movement between candidate sectors."
