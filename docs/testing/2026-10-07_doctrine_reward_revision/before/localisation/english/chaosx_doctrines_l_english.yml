l_english:
GRAND_DOCTRINE_CHAOS_WARFARE: "Chaos Warfare"
GRAND_DOCTRINE_CHAOS_WARFARE_DESC: "Protected formations, controlled payload stores, and an Army Headquarters give commanders the means to plan CBRN operations. Adoption establishes national command and opens assault, armored delivery, fire support, and integrated command tracks. Each chemical or biological release still needs policy authority, payload, and a paid operation."
tactic_gas_mask_defense: "Gas-Mask Defence"
tactic_chemical_shelling: "Chemical Shelling"
tactic_chemical_barrage: "Prepared Chemical Barrage"

SUBDOCTRINE_EXTERMINATION_COLUMNS: "Hazard Assault Formations"
SUBDOCTRINE_EXTERMINATION_COLUMNS_DESC: "Protected infantry and assault battalions train to cross contaminated ground. CBRN Protection Companies mark safe lanes and support attacks through defended terrain."

extermination_columns_contagion_assault_drills: "Mask Discipline and Assault Drills"
extermination_columns_contagion_assault_drills_desc: "Fit checks, filter discipline, and movement drills make CBRN protection more reliable and help divisions hold together under attack."
extermination_columns_sacrificial_march_columns: "Contaminated Terrain Movement"
extermination_columns_sacrificial_march_columns_desc: "Protected crews mark contaminated lanes and collect casualties while engineer teams support the advance. The training improves CBRN Protection Companies in fortified and urban terrain."
extermination_columns_unlock_chaos_battalion: "Chaos Assault Battalion"
extermination_columns_unlock_chaos_battalion_desc: "Protected special forces train to breach fortified and contaminated approaches. Theater Exploitation completes their preparation for deployment."
extermination_columns_ruinwave_battlecells: "Shock Exploitation"
extermination_columns_ruinwave_battlecells_desc: "Protected assault groups use marked routes and prepared fire plans to break through defended lines."
extermination_columns_terminal_contagion_offensive: "Terminal Hazard Offensive"
extermination_columns_terminal_contagion_offensive_desc: "Improved assault equipment and rehearsed corridor handoffs strengthen the Chaos Assault Battalion."
extermination_columns_chaos_battalion_unlocked_tt: "Unlocks §YChaos Assault Battalion§! once §YTheater Exploitation§! is established."
extermination_columns_terminal_contagion_unlocked_tt: "Unlocks §YImproved Chaos Assault Equipment§! once §YTheater Exploitation§! and the base battalion technology are present."

SUBDOCTRINE_CHEMICAL_SUPPRESSION: "Toxic Armored Warfare"
SUBDOCTRINE_CHEMICAL_SUPPRESSION_DESC: "Sealed tank crews and armored delivery detachments support chemical attacks through defended terrain. Deeper mastery improves protected logistics and nerve-agent methods in camps."

chemical_suppression_adamsite_emission_cells: "Sealed Crew Compartments"
chemical_suppression_adamsite_emission_cells_desc: "Improved seals, overpressure drills, and crew decontamination strengthen chemical tank support. Improved gas masks complete the crew protection needed for Sealed Tank Crews training."
chemical_suppression_armored_chemical_support_liaison: "Armored Agent Delivery"
chemical_suppression_armored_chemical_support_liaison_desc: "Armored delivery detachments coordinate with protected infantry during chemical operations."
chemical_suppression_zyklon_b_saturation_drills: "Gas-Chamber Saturation Drills"
chemical_suppression_zyklon_b_saturation_drills_desc: "Extermination staffs standardize sealed chambers, timed saturation, and cylinder handling. A researched nerve agent and stocked cylinders allow camps to adopt methods that kill more people with less agent and leave less evidence."
chemical_suppression_sealed_pressure_logistics: "Protected Breakthrough Logistics"
chemical_suppression_sealed_pressure_logistics_desc: "Sealed transfer points and mobile washdown teams ease the supply burden of chemical tank support."
chemical_suppression_catastrophic_shock_breakthrough: "Catastrophic Shock Breakthrough"
chemical_suppression_catastrophic_shock_breakthrough_desc: "Armored CBRN command links coordinate protected formations during a prepared breakthrough."
chemical_suppression_nerve_operations_unlocked_tt: "§YNerve-Agent Camp Methods§! becomes available after a nerve agent has been researched and sufficient cylinders are stocked."
chemical_suppression_camp_nerve_methods_unlocked_tt: "§YNerve-Agent Camp Methods§! becomes available after a nerve agent has been researched and sufficient cylinders are stocked. The method increases killing efficiency and reduces cylinder use and forensic exposure."

SUBDOCTRINE_CONTAMINANT_FIREBASES: "Contaminant Fire Support"
SUBDOCTRINE_CONTAMINANT_FIREBASES_DESC: "Projector batteries and chemical ammunition trains prepare larger contamination attacks. Fire plans still need a target, payload, and an authorized delivery."

contaminant_firebases_livens_fire_control_cells: "Projector Fire-Control Cells"
contaminant_firebases_livens_fire_control_cells_desc: "Surveyed firing tables and protected line crews improve the reliability of chemical projector batteries."
contaminant_firebases_counterbattery_gas_synchronization: "Counterbattery Chemical Synchronization"
contaminant_firebases_counterbattery_gas_synchronization_desc: "Counterbattery staffs coordinate conventional fire and chemical support, improving army coordination."
contaminant_firebases_raid_targeting_teams: "Chemical Shell Logistics"
contaminant_firebases_raid_targeting_teams_desc: "Dedicated shell accounting and protected ammunition trains support Chemical Artillery Shells and the Chemical Ammunition Train."
contaminant_firebases_persistent_agent_distribution: "Persistent-Agent Shell Filling"
contaminant_firebases_persistent_agent_distribution_desc: "Improved filling procedures make chemical shells more reliable and prepare crews to handle Mustard Gas or Lewisite."
contaminant_firebases_deep_contamination_fireplans: "Deep Contamination Fireplans"
contaminant_firebases_deep_contamination_fireplans_desc: "Theater staffs prepare deeper contamination fire plans. An eligible target and paid payload are still required to execute them."
contaminant_firebases_raid_targeting_teams_tt: "Unlocks §YChemical Artillery Shells§! and the §YChemical Ammunition Train§!. Accepted chemical releases become more potent."
contaminant_firebases_persistent_agent_distribution_tt: "Unlocks §YPersistent-Agent Shell Filling§! when Mustard Gas or Lewisite is available. Accepted chemical releases cause more contamination."
contaminant_firebases_deep_contamination_fireplans_tt: "Accepted chemical releases become more potent and leave more contamination. Each release still needs its normal payload."

SUBDOCTRINE_INTEGRATED_CHEMICAL_OPERATIONS: "Integrated CBRN Command"
SUBDOCTRINE_INTEGRATED_CHEMICAL_OPERATIONS_DESC: "Operations and Intelligence, Protection and Decontamination, and Medical and Biosecurity sections coordinate theater CBRN operations. Mastery improves release planning, protective support, and medical response while reducing the Condemnation impact of authorized deployments."

integrated_chemical_operations_operational_recon_grids: "Operational Reconnaissance Grids"
integrated_chemical_operations_operational_recon_grids_desc: "Forecasting and route reconnaissance improve army intelligence and reduce the Condemnation impact of authorized CBRN deployments."
integrated_chemical_operations_signal_intelligence_fusion: "Signal-Intelligence Fusion"
integrated_chemical_operations_signal_intelligence_fusion_desc: "Signals and liaison teams improve reinforcement and intelligence. Mastery adds the CBRN Protection and Decontamination Section and strengthens accepted chemical and biological deployments."
integrated_chemical_operations_countercontamination_routing: "Counter-Contamination Routing"
integrated_chemical_operations_countercontamination_routing_desc: "Dedicated movement corridors ease Headquarters supply demands and improve national decontamination capacity. The same training prepares mobile columns for contaminated routes."
integrated_chemical_operations_air_surface_chemical_link: "Air-Surface CBRN Link"
integrated_chemical_operations_air_surface_chemical_link_desc: "Air and ground staffs share target, weather, protection, and medical reports. Accepted chemical and biological deployments become more potent, and chemical air raids gain an additional exact-state effect."
integrated_chemical_operations_theater_intelligence_overmatch: "Theater Intelligence Overmatch"
integrated_chemical_operations_theater_intelligence_overmatch_desc: "The three Headquarters sections coordinate chemical and biological deployments across the theater. Mastery improves their potency and persistence while further reducing Condemnation impact."
integrated_chemical_operations_operational_recon_grids_tt: "Improves Army Headquarters reconnaissance and reduces the Condemnation impact of authorized CBRN deployments."
integrated_chemical_operations_signal_intelligence_fusion_tt: "Unlocks the §YCBRN Protection and Decontamination Section§! for Army Headquarters. Improves reinforcement, intelligence, and the potency and persistence of accepted CBRN deployments."
integrated_chemical_operations_air_surface_chemical_link_tt: "Unlocks the §YCBRN Medical and Biosecurity Section§! for Army Headquarters and §YChemical Air Interdiction§! once its requirements are met. Accepted CBRN deployments become more potent, and chemical air raids gain an additional exact-state effect."
integrated_chemical_operations_theater_intelligence_overmatch_tt: "Unlocks §YTheater CBRN Headquarters§! once Terminal Command is established. Improves the potency and persistence of accepted CBRN deployments and further reduces their Condemnation impact."
