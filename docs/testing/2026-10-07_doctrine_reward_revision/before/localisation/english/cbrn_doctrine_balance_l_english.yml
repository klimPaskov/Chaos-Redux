CBRN_BALANCED_CHAOS_WARFARE_DESC: "Protected formations, payload stores and a CBRN Headquarters support four tracks: assault, armored delivery, fire support and integrated command. Chemical release requires policy authority, available payloads and a prepared operation. Unprotected troops and civilians bear the consequences."
CBRN_BALANCED_HAZARD_ASSAULT_DESC: "Protection Companies and assault battalions train for contaminated approaches. Their field exercises consume protective equipment and Army Experience, while dedicated assault formations gain the strongest breakthrough benefits. Conventional infantry retain their established doctrine training."
CBRN_BALANCED_TOXIC_ARMOR_DESC: "Sealed crews and armored delivery detachments carry protected formations through hazardous approaches. Specialized vehicles demand equipment and supply, while their mastery improves seals, movement, and delivery coordination. Release still requires the appropriate stock, policy, and operation."
CBRN_BALANCED_CONTAMINANT_FIRE_DESC: "Projector batteries and chemical ammunition trains coordinate protected fire plans. Conventional artillery receives a limited fire-control benefit. Larger gains require dedicated CBRN equipment, maintained payload stores, and an authorized operation."
CBRN_BALANCED_INTEGRATED_COMMAND_DESC: "Operations and Intelligence, Protection and Decontamination, and Medical and Biosecurity sections coordinate reconnaissance, protection, cleanup, and battlefield care. Mastery improves planning and reinforcement and prepares fielded CBRN Headquarters for exact-state support."
