l_english:
cbrn_occupation_measures_category: "Occupation CBRN Measures"
cbrn_occupation_measures_category_desc: "Organize protective occupation administration, supply civilians in exposed territory, and answer for chemical attacks through disclosure or inspection."

cbrn_authorize_coercive_security: "Authorize CBRN Coercive Security"
cbrn_authorize_coercive_security_desc: "Permit CBRN Coercive Security where armored delivery doctrine, a completed nerve-agent program, and advanced protection support the occupation command."
cbrn_authorize_coercive_security_requirements_tt: "Requires §YMobile Nerve Suppression§!, §YArmored Agent Delivery§!, a completed nerve-agent special project, and advanced military CBRN protection."
cbrn_authorize_coercive_security_effect_tt: "Unlocks §YCBRN Coercive Security§! in the occupation-law interface."

cbrn_adopt_protected_occupation: "Authorize Protected Occupation Administration"
cbrn_adopt_protected_occupation_desc: "Establish a defensive occupation framework for contaminated territory. Protected administrations equip garrisons and local services, reduce resistance damage, and improve compliance."
cbrn_adopt_protected_occupation_requirements_tt: "Requires §YBasic Service Respirators§! and advanced military CBRN protection."
cbrn_adopt_protected_occupation_effect_tt: "Unlocks §YProtected Occupation Administration§! in the occupation-law interface."

cbrn_deploy_protective_aid: "Protective Aid: [FROM.GetName]"
cbrn_deploy_protective_aid_desc: "Send respirator crates from [ROOT.GetNameDef]'s reserve to civilians in [FROM.GetName], despite foreign occupation. Population, infrastructure, occupation conditions, fitting quality, filter condition, and the supplier's civil-defence institutions determine the shipment required and protection delivered."
cbrn_external_aid_mask_reservation_quote: "[?cbrn_mask_reservation_quote|.0]"
cbrn_external_aid_pp_quote: "[?black_friday_cbrn_external_aid_pp_cost|.0]"
cbrn_external_aid_mask_model_quote_tooltip: "£GFX_gas_mask_equipment_reconditioned_medium [?cbrn_external_aid_mask_quote_reconditioned|.0]  £GFX_gas_mask_equipment_1_medium [?cbrn_external_aid_mask_quote_basic|.0]  £GFX_gas_mask_equipment_2_medium [?cbrn_external_aid_mask_quote_improved|.0]  £GFX_gas_mask_equipment_3_medium [?cbrn_external_aid_mask_quote_advanced|.0]  £GFX_gas_mask_equipment_4_medium [?cbrn_external_aid_mask_quote_sealed|.0]"
cbrn_deploy_protective_aid_cost: "£pol_power §Y[This.GetCbrnExternalAidPoliticalPowerQuote]§!  £GFX_archetype_gas_mask_equipment_medium §Y[This.GetCbrnExternalAidMaskReservationQuote]§!  £civ_factory §Y[This.GetCbrnOccupationValueOccupationDecisionCostProtectiveAidFactories]§!"
cbrn_deploy_protective_aid_cost_blocked: "£pol_power §R[This.GetCbrnExternalAidPoliticalPowerQuote]§!  £GFX_archetype_gas_mask_equipment_medium §R[This.GetCbrnExternalAidMaskReservationQuote]§!  £civ_factory §R[This.GetCbrnOccupationValueOccupationDecisionCostProtectiveAidFactories]§!"
cbrn_deploy_protective_aid_cost_tooltip: "Political Power is charged when selected; Black Friday reduces only this fee. The respirator shipment keeps its full calculated volume: [This.GetCbrnExternalAidMaskModelBreakdown]. Civilian factories remain assigned during delivery. Unused model crates return to the supplier if delivery is canceled or the state can no longer receive aid."
cbrn_deploy_protective_aid_begin_tt: "Begins a [This.GetCbrnOccupationValueOccupationTimingProtectiveAidDays]-day delivery using crates reserved from [ROOT.GetNameDef]'s stock."
cbrn_deploy_protective_aid_complete_tt: "Delivers reserved crates toward [This.GetCbrnOccupationValueProtectionProgramEffectOccupiedDistributionTargetPercent]% effective civilian coverage in [FROM.GetName]. Any crates no longer needed return to the supplier."

cbrn_seal_state: "Seal [FROM.GetName]"
cbrn_seal_state_desc: "Close roads, hospitals, archives, and contaminated districts to outside observation. A seal can suppress short-term evidence spread. It also disrupts production, raises Resistance, and creates hidden Coverup Condemnation that inspection or liberation can expose."
cbrn_seal_state_cost: "£pol_power §Y[This.GetCbrnOccupationSealStatePpQuote]§!"
cbrn_seal_state_cost_blocked: "£pol_power §R[This.GetCbrnOccupationSealStatePpQuote]§!"
cbrn_seal_state_cost_tooltip: "Political effort rises with Condemnation. No payment is kept if the state cannot be sealed."
cbrn_seal_state_requirements_tt: "Requires control of [FROM.GetName], responsibility for the recorded nerve-suppression attack there, and no prior concealment, admission, inspection, or liberation discovery."
cbrn_seal_state_effect_tt: "Reduces evidence of the nerve-suppression attack by up to [This.GetCbrnOccupationValueOccupationCoverupSealEvidenceSuppression] and raises Resistance by [This.GetCbrnOccupationValueOccupationCoverupCoverupPressureSeal]. For [This.GetCbrnOccupationValueOccupationTimingSealedStateDays] days, local factories change by [This.GetCbrnOccupationValueOccupationStateModifierSealedLocalFactories] and resources by [This.GetCbrnOccupationValueOccupationStateModifierSealedLocalResources]. The concealment and hidden Coverup Condemnation remain discoverable."

cbrn_destroy_contaminated_records: "Destroy the Contaminated Records of [FROM.GetName]"
cbrn_destroy_contaminated_records_desc: "Burn orders, hospital lists, transport manifests, and samples from the nerve-suppression attack. The immediate evidence reduction is larger than a seal, and destroyed records raise Resistance and create major hidden Coverup Condemnation."
cbrn_destroy_contaminated_records_cost: "£pol_power §Y[This.GetCbrnOccupationDestroyRecordsPpQuote]§!"
cbrn_destroy_contaminated_records_cost_blocked: "£pol_power §R[This.GetCbrnOccupationDestroyRecordsPpQuote]§!"
cbrn_destroy_contaminated_records_cost_tooltip: "Political effort rises with Condemnation. No payment is kept if the records cannot be destroyed."
cbrn_destroy_contaminated_records_requirements_tt: "Requires control of [FROM.GetName], responsibility for the recorded nerve-suppression attack there, and no prior concealment, admission, inspection, or liberation discovery."
cbrn_destroy_contaminated_records_effect_tt: "Reduces evidence of the nerve-suppression attack by up to [This.GetCbrnOccupationValueOccupationCoverupDestroyRecordsEvidenceSuppression], raises Resistance by [This.GetCbrnOccupationValueOccupationCoverupCoverupPressureDestroyRecords], and creates major hidden Coverup Condemnation. Later inspection or liberation can expose it and strengthen evidence of that attack. Deaths, contamination, trauma, attribution, and use history are never removed."

cbrn_admit_accidental_release: "Admit an Accidental Release in [FROM.GetName]"
cbrn_admit_accidental_release_desc: "Publicly acknowledge the toxic release, describe the action as an accident, and open medical access. Admission confirms responsibility without converting deliberate-use history into non-use or erasing the state's casualties and contamination."
cbrn_admit_accidental_release_requirements_tt: "Requires responsibility for an undisclosed nerve-suppression attack in [FROM.GetName]. Admission remains possible after an attempted seal or record destruction, unless inspection or liberation has already resolved the record."
cbrn_admit_accidental_release_effect_tt: "Confirms responsibility for the chemical attack and exposes its hidden chemical Condemnation. It adds [This.GetCbrnOccupationValueOccupationCondemnationAdmissionChemicalContextGain] public chemical Condemnation before doctrine mitigation, exposes any self-disclosed coverup, ends an active seal, and clears coverup pressure. The nerve-suppression attack may also add atrocity Condemnation. Evidence, deaths, contamination, trauma, and use history remain."

cbrn_permit_inspection: "Permit Inspection in [FROM.GetName]"
cbrn_permit_inspection_desc: "Allow inspectors and medical teams to examine [FROM.GetName], its casualties, samples, treatment records, and contaminated sites. Credible inspection can reduce long-term suspicion, strengthen evidence of the attack, and expose concealment and stockpile restrictions."
cbrn_permit_inspection_requirements_tt: "Requires control of [FROM.GetName], responsibility for the recorded nerve-suppression attack there, and no completed inspection or liberation discovery."
cbrn_permit_inspection_effect_tt: "Adds [This.GetCbrnOccupationValueOccupationCoverupInspectionEvidenceGain] evidence of the chemical attack and exposes discoverable Coverup Condemnation. Inspection ends an active seal, opens national inspections, and clears coverup pressure. If attribution is confirmed, the nerve-suppression attack may also add atrocity Condemnation. Earlier deaths, contamination, and responsibility remain recorded."

cbrn_nerve_suppression_active_state: "Active Nerve Suppression"
cbrn_nerve_suppression_active_state_desc: "Toxic barriers, sealed patrols, and protected detachments have broken resistance activity for a short period. Garrison manpower and immediate damage fall, and local output, movement, and supply suffer."
cbrn_nerve_suppression_trauma_state: "Nerve-Suppression Trauma"
cbrn_nerve_suppression_trauma_state_desc: "Deaths, contamination, fear, and remembered coercion sustain resistance growth, obstruct compliance, and strengthen future discovery and liberation reactions. The memory decays slowly and is never removed by doctrine."
cbrn_occupation_backlash_state: "Organized Occupation Backlash"
cbrn_occupation_backlash_state_desc: "Resistance networks have reorganized after the initial toxic shock. Sabotage, recruitment, garrison losses, and local disruption rise, with severe actions capable of spreading pressure into a neighboring occupied state."
cbrn_occupation_state_sealed_modifier: "Sealed Contaminated Districts"
cbrn_occupation_state_sealed_modifier_desc: "Roadblocks, quarantined hospitals, closed archives, and restricted industrial movement suppress observation at the cost of local output and rising resistance organization."

condemnation.context.nerve_suppression: "Nerve Suppression in Occupied Territory"

