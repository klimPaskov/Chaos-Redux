# Codex MCP configuration template for the Chaos Redux 3D pipeline.
# Copy the selected server tables into either:
#   %USERPROFILE%\.codex\config.toml
# or the trusted project file:
#   <repo>\.codex\config.toml
# Replace all C:\path placeholders. Do not place MESHY_API_KEY in this file.

[mcp_servers.meshy]
enabled = true
required = false
command = "cmd"
args = [
  "/c",
  'C:\path\to\chaos_redux\.tools\3d_pipeline\wrappers\run_meshy_mcp.cmd'
]
env_vars = ["MESHY_API_KEY", "MESHY_MCP_VERSION"]
startup_timeout_sec = 30.0
tool_timeout_sec = 1800.0
default_tools_approval_mode = "prompt"
enabled_tools = [
  "meshy_check_balance",
  "meshy_image_to_3d",
  "meshy_get_task_status",
  "meshy_list_tasks",
  "meshy_cancel_task",
  "meshy_download_model",
  "meshy_remesh",
  "meshy_retexture",
  "meshy_rig",
  "meshy_animate",
  "meshy_convert",
  "meshy_uv_unwrap",
  "meshy_resize"
]

# This server is a proposed narrow adapter and stays disabled until its
# package, allowlist, path policy, and clean-profile tests are implemented.
[mcp_servers.blender_hoi4]
enabled = false
required = false
command = "cmd"
args = [
  "/c",
  'C:\path\to\chaos_redux\.tools\3d_pipeline\wrappers\run_blender_hoi4_adapter.cmd',
  "--config",
  'C:\path\to\chaos_redux\.tools\3d_pipeline\config\blender_hoi4_adapter.json'
]
startup_timeout_sec = 60.0
tool_timeout_sec = 1800.0
default_tools_approval_mode = "writes"
enabled_tools = [
  "blender_hoi4_health",
  "blender_hoi4_create_scene",
  "blender_hoi4_inspect_scene",
  "blender_hoi4_import_candidate",
  "blender_hoi4_import_reference",
  "blender_hoi4_duplicate_working_mesh",
  "blender_hoi4_audit_geometry",
  "blender_hoi4_apply_geometry_repairs",
  "blender_hoi4_normalize_transform",
  "blender_hoi4_configure_materials",
  "blender_hoi4_export_texture_preview",
  "blender_hoi4_import_provider_rig",
  "blender_hoi4_create_rig_from_recipe",
  "blender_hoi4_map_skeleton",
  "blender_hoi4_bind_weights",
  "blender_hoi4_audit_weights",
  "blender_hoi4_create_test_poses",
  "blender_hoi4_import_action",
  "blender_hoi4_retarget_action",
  "blender_hoi4_author_action_from_recipe",
  "blender_hoi4_audit_action",
  "blender_hoi4_render_action_preview",
  "blender_hoi4_prepare_export_collection",
  "blender_hoi4_export_mesh",
  "blender_hoi4_export_animation",
  "blender_hoi4_reimport_export",
  "blender_hoi4_save_checkpoint",
  "blender_hoi4_package_evidence"
]

[mcp_servers.blender_hoi4.env]
CHAOS_REDUX_MOD_ROOT = 'C:\path\to\chaos_redux'
CHAOS_REDUX_3D_JOB_ROOT = 'C:\path\to\chaos_redux\docs\assets'

# Development-only profile. Keep it disabled in production because a general
# Blender Python bridge is outside the production allowlist contract.
[mcp_servers.blender_lab_dev]
enabled = false
required = false
command = "cmd"
args = [
  "/c",
  'C:\path\to\chaos_redux\.tools\3d_pipeline\wrappers\run_blender_lab_mcp.cmd.example'
]
startup_timeout_sec = 60.0
tool_timeout_sec = 1800.0
default_tools_approval_mode = "prompt"
