<svg xmlns="http://www.w3.org/2000/svg" width="1990" height="474" viewBox="0 0 1990 474">
  <title>Event 020 Black Plague category visibility and capacity reference</title>
  <desc>Scoped correction reference based on the supplied 2026-09-20 category screenshot and accepted Event020 UI direction. The category remains hidden before established outbreak evidence and after full recovery when no relevant response remains. Once shown, the existing category picture stays in the category header exactly once and is not repeated inside the attached window. The attached window retains its accepted composition and uses a neutral unorganized-capacity label for zero over zero.</desc>
  <defs>
    <linearGradient id="meter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fba82"/>
      <stop offset="1" stop-color="#456449"/>
    </linearGradient>
  </defs>
  <rect width="1940" height="474" fill="#141a20"/>
  <text x="24" y="32" fill="#efe9d1" font-family="Arial" font-size="22" font-weight="700">EVENT 020 · BLACK PLAGUE RESPONSE CATEGORY</text>
  <text x="24" y="58" fill="#b7c0c2" font-family="Arial" font-size="15">One category picture remains in the native category header. The attached read-only board contains no second copy.</text>

  <g transform="translate(20 80)">
    <text x="0" y="0" fill="#b7c0c2" font-family="Arial" font-size="15" font-weight="700">HIDDEN · PRE-OUTBREAK / RECOVERED</text>
    <rect x="0" y="14" width="300" height="282" rx="5" fill="#1b1f22" stroke="#596365" stroke-width="2"/>
    <rect x="16" y="32" width="268" height="246" fill="#16191b" stroke="#343b3d"/>
    <text x="150" y="124" text-anchor="middle" fill="#e0d9c6" font-family="Arial" font-size="17" font-weight="700">No Black Plague</text>
    <text x="150" y="149" text-anchor="middle" fill="#e0d9c6" font-family="Arial" font-size="17" font-weight="700">response category</text>
    <text x="150" y="190" text-anchor="middle" fill="#97a2a4" font-family="Arial" font-size="13">No established local case</text>
    <text x="150" y="210" text-anchor="middle" fill="#97a2a4" font-family="Arial" font-size="13">or active national response</text>
  </g>

  <g transform="translate(350 80)">
    <text x="0" y="0" fill="#b7c0c2" font-family="Arial" font-size="15" font-weight="700">ACTIVE · 0% · CAPACITY 0/0</text>
    <rect x="0" y="14" width="520" height="282" rx="5" fill="#111315" stroke="#7c8585" stroke-width="2"/>
    <text x="20" y="50" fill="#f0f0d0" font-family="Arial" font-size="20" font-weight="700">NATIONAL PLAGUE RESPONSE</text>
    <text x="20" y="77" fill="#e8e8d0" font-family="Arial" font-size="16">Cure programme: Active research programme</text>
    <text x="20" y="113" fill="#e8e8d0" font-family="Arial" font-size="16">Countermeasure Progress</text>
    <text x="500" y="113" text-anchor="end" fill="#8fd06d" font-family="Arial" font-size="18" font-weight="700">0%</text>
    <rect x="20" y="126" width="480" height="27" rx="10" fill="#0b0d0e" stroke="#4f5b5c"/>
    <rect x="20" y="169" width="480" height="70" fill="#1b1e20" stroke="#4f5b5c"/>
    <line x1="260" y1="169" x2="260" y2="239" stroke="#4f5b5c"/>
    <text x="140" y="209" text-anchor="middle" fill="#e05b55" font-family="Arial" font-size="16">National Deaths 0</text>
    <text x="380" y="209" text-anchor="middle" fill="#e8dd4d" font-family="Arial" font-size="16">Capacity not organized</text>
    <text x="260" y="266" text-anchor="middle" fill="#97a2a4" font-family="Arial" font-size="13">Empty meter · no exhaustion warning</text>
  </g>

  <g transform="translate(890 80)">
    <text x="0" y="0" fill="#b7c0c2" font-family="Arial" font-size="15" font-weight="700">ACTIVE · 40% · CAPACITY 2/4</text>
    <rect x="0" y="14" width="520" height="282" rx="5" fill="#111315" stroke="#7c8585" stroke-width="2"/>
    <text x="20" y="50" fill="#f0f0d0" font-family="Arial" font-size="20" font-weight="700">NATIONAL PLAGUE RESPONSE</text>
    <text x="20" y="77" fill="#e8e8d0" font-family="Arial" font-size="16">Cure programme: Active research programme</text>
    <text x="20" y="113" fill="#e8e8d0" font-family="Arial" font-size="16">Countermeasure Progress</text>
    <text x="500" y="113" text-anchor="end" fill="#8fd06d" font-family="Arial" font-size="18" font-weight="700">40%</text>
    <rect x="20" y="126" width="480" height="27" rx="10" fill="#0b0d0e" stroke="#4f5b5c"/>
    <rect x="20" y="126" width="192" height="27" rx="10" fill="url(#meter)" stroke="#90a48a"/>
    <rect x="20" y="169" width="480" height="70" fill="#1b1e20" stroke="#4f5b5c"/>
    <line x1="260" y1="169" x2="260" y2="239" stroke="#4f5b5c"/>
    <text x="140" y="209" text-anchor="middle" fill="#e05b55" font-family="Arial" font-size="16">National Deaths 120</text>
    <text x="380" y="209" text-anchor="middle" fill="#e8dd4d" font-family="Arial" font-size="16">Response Capacity 2 / 4</text>
    <text x="260" y="266" text-anchor="middle" fill="#97a2a4" font-family="Arial" font-size="13">Organized capacity remains available</text>
  </g>

  <g transform="translate(1450 80)">
    <text x="0" y="0" fill="#b7c0c2" font-family="Arial" font-size="15" font-weight="700">EXHAUSTED · 40% · CAPACITY 0/4</text>
    <rect x="0" y="14" width="520" height="282" rx="5" fill="#111315" stroke="#7c8585" stroke-width="2"/>
    <text x="20" y="50" fill="#f0f0d0" font-family="Arial" font-size="20" font-weight="700">NATIONAL PLAGUE RESPONSE</text>
    <text x="20" y="77" fill="#e8e8d0" font-family="Arial" font-size="16">Cure programme: Active research programme</text>
    <text x="20" y="113" fill="#e8e8d0" font-family="Arial" font-size="16">Countermeasure Progress</text>
    <text x="500" y="113" text-anchor="end" fill="#8fd06d" font-family="Arial" font-size="18" font-weight="700">40%</text>
    <rect x="20" y="126" width="480" height="27" rx="10" fill="#0b0d0e" stroke="#4f5b5c"/>
    <rect x="20" y="126" width="192" height="27" rx="10" fill="url(#meter)" stroke="#90a48a"/>
    <rect x="20" y="169" width="480" height="70" fill="#1b1e20" stroke="#4f5b5c"/>
    <line x1="260" y1="169" x2="260" y2="239" stroke="#4f5b5c"/>
    <text x="140" y="209" text-anchor="middle" fill="#e05b55" font-family="Arial" font-size="16">National Deaths 120</text>
    <text x="380" y="209" text-anchor="middle" fill="#e8dd4d" font-family="Arial" font-size="16">Response Capacity 0 / 4</text>
    <text x="260" y="268" text-anchor="middle" fill="#ec6a60" font-family="Arial" font-size="13" font-weight="700">Response capacity exhausted</text>
  </g>
  <text x="24" y="420" fill="#aeb8bb" font-family="Arial" font-size="13">The category is shown only for an established local outbreak or a country with an active national response after outbreak establishment. Full recovery with no active local case or response closes the category.</text>
</svg>
