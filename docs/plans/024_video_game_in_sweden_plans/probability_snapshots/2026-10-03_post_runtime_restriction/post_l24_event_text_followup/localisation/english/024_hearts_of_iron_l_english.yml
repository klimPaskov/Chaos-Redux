video_game_trust_model_cost_tooltip: "Cost: £command_power [?constant:video_game_in_sweden_cost.trust_model_command_power|0]  £pol_power [?constant:video_game_in_sweden_cost.trust_model_political_power|0]  £stability_texticon [?constant:video_game_in_sweden_cost.trust_model_stability_loss_display|0]%  £war_support_icon [?constant:video_game_in_sweden_cost.trust_model_war_support_loss_display|0]%. The cabinet receives one final authority for one term, and must be reassessed."

# Missions
video_game_field_validation_mission_requirements_tt: "Keep [?constant:video_game_in_sweden_event.reality_audit_min_divisions_display|0] Swedish divisions in §Y$STATE_138$§!, §Y$STATE_141$§!, or §Y$STATE_666$§! for [?constant:video_game_in_sweden_timing.field_validation_proof_days|0] days. Own and control Stockholm, retain positive train, support-equipment, and fuel reserves, and complete either the rail-table or independent staff review. A recorded interruption prevents full success even after conditions recover."
video_game_field_validation_mission: "Field Validation"
video_game_field_validation_mission_desc: "$video_game_field_validation_mission_requirements_tt$"
video_game_reality_audit_mission: "Reality Audit"
video_game_reality_audit_mission_desc: "[GetVideoGameAuditProofRequirements]"
video_game_reality_audit_regions_tt: "[GetVideoGameAuditProofRequirements]"
video_game_full_audit_proof_requirements: "Keep [?constant:video_game_in_sweden_event.reality_audit_min_divisions_display|0] Swedish divisions in each of §Y$STATE_138$§!, §Y$STATE_141$§!, and §Y$STATE_666$§! under full Swedish control for [?constant:video_game_in_sweden_timing.reality_audit_proof_days|0] days. Own and control Stockholm, retain positive train, support-equipment, and fuel reserves, and file both staff reviews. A recorded loss of reserves, transport, or regional presence prevents full success even after conditions recover."
video_game_narrow_audit_proof_requirements: "Keep [?constant:video_game_in_sweden_event.reality_audit_min_divisions_display|0] Swedish divisions in §Y$STATE_138$§!, §Y$STATE_141$§!, or §Y$STATE_666$§! for [?constant:video_game_in_sweden_timing.narrow_reality_audit_proof_days|0] days. Own and control Stockholm and retain positive train, support-equipment, and fuel reserves. Both staff reviews are needed for a full finding. This shorter reassessment does not erase the earlier report."
video_game_dual_track_mission_requirements_tt: "Keep Stockholm and the second ledger in operation for the proof period."
video_game_restriction_mission_requirements_tt: "Complete the league closures, policy exclusions, and withdrawal of public playing rooms over [?constant:video_game_in_sweden_timing.restriction_proof_days|0] days. Enforcement requires no further payment."
video_game_dual_track_verification: "Second Ledger Verification"
video_game_dual_track_verification_desc: "The comparison office must hold Stockholm for the proof period. It must maintain the cabinet and the actual ledger together."
video_game_restriction_enforcement: "Restriction Enforcement"
video_game_restriction_enforcement_desc: "The Ministry first closes its officer leagues, then requires policy papers to cite field reports, and finally returns the public rooms to their municipal custodians. Each department files its receipt with the restriction office. No further payment is required."
video_game_in_sweden_restriction_backlash: "Resentment over the Closing Notices"
video_game_in_sweden_restriction_backlash_desc: "The official leagues have closed and the municipal rooms have been returned. Their former committees continue to dispute the Ministry's account of the proceedings."

