video_game_incident_workplace_clause: "Factories are losing skilled hours to a tournament that the production office never authorised."
video_game_incident_party_clause: "Party committees are claiming the board as evidence for a policy that the staff offices did not issue."
video_game_incident_unknown_clause: "A field report has arrived from a place where the Swedish cabinet has met a fact outside its tables."
