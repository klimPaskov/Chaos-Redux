video_game_foreign_outcome_copy: "Its officials have copied the packet and begun adapting its tables to their own files."
video_game_foreign_outcome_study: "Its staff has retained the packet for a military study, with no authority granted to the machine itself."
video_game_foreign_outcome_ban: "Its authorities have banned the packet and placed the papers beyond ordinary circulation."
