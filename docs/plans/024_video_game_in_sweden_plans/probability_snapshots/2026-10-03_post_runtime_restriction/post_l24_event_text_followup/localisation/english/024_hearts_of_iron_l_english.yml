video_game_separate_policy_cost_tooltip: "Opening charges: £pol_power [?constant:video_game_in_sweden_cost.separate_policy_political_power|0]  £stability_texticon [?constant:video_game_in_sweden_cost.separate_policy_stability_cost_display|0]%. The Stability payment reflects the public reaction to ending circulation."

video_game_begin_reality_audit: "Begin the Reality Audit"
video_game_begin_reality_audit_desc: "Send divisions, stores, and staff officers to test the cabinet against real fronts, roads, and supply work. Opening a full audit lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.reality_audit_full|0]§!. The report must answer to all three Swedish field regions."
video_game_reality_audit_cost: "£army_experience [?constant:video_game_in_sweden_cost.reality_audit_army_experience|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.reality_audit_support_equipment|0]  £fuel_texticon [?constant:video_game_in_sweden_cost.reality_audit_fuel|0]"
video_game_reality_audit_cost_blocked: "£army_experience §R[?constant:video_game_in_sweden_cost.reality_audit_army_experience|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.reality_audit_support_equipment|0]§!  £fuel_texticon §R[?constant:video_game_in_sweden_cost.reality_audit_fuel|0]§!"
video_game_reality_audit_cost_tooltip: "Payment: £army_experience [?constant:video_game_in_sweden_cost.reality_audit_army_experience|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.reality_audit_support_equipment|0]  £fuel_texticon [?constant:video_game_in_sweden_cost.reality_audit_fuel|0]  £train_texticon [?constant:video_game_in_sweden_cost.reality_audit_trains|0]. Keep some trains, support equipment, and fuel in stock during the three-region proof. A disrupted audit produces a partial or failed report."
video_game_narrow_reality_audit: "Conduct a Narrow Reassessment"
video_game_narrow_reality_audit_desc: "After a poor report, send a smaller party to the front with a shorter ledger. Opening it lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_award.narrow_reality_audit_loss|0]§! and can restore useful practice. The filed report remains part of the record."
video_game_narrow_reality_audit_cost: "£army_experience [?constant:video_game_in_sweden_cost.narrow_reality_audit_army_experience|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.narrow_reality_audit_support_equipment|0]  £fuel_texticon [?constant:video_game_in_sweden_cost.narrow_reality_audit_fuel|0]"
video_game_narrow_reality_audit_cost_blocked: "£army_experience §R[?constant:video_game_in_sweden_cost.narrow_reality_audit_army_experience|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.narrow_reality_audit_support_equipment|0]§!  £fuel_texticon §R[?constant:video_game_in_sweden_cost.narrow_reality_audit_fuel|0]§!"
video_game_narrow_reality_audit_cost_tooltip: "Payment: £army_experience [?constant:video_game_in_sweden_cost.narrow_reality_audit_army_experience|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.narrow_reality_audit_support_equipment|0]  £fuel_texticon [?constant:video_game_in_sweden_cost.narrow_reality_audit_fuel|0]  £train_texticon [?constant:video_game_in_sweden_cost.narrow_reality_audit_trains|0]. Keep some trains, support equipment, and fuel in stock during the shorter proof. This recovery attempt does not erase the earlier finding."
video_game_dual_track: "Maintain a Second Ledger"
video_game_dual_track_desc: "Require the simulation staff to compare its forecasts with a second ledger of roads, stores, weather, and field reports. Simulation Reliance returns to §YDoctrine§!, and temporary planning support continues during verification."
video_game_dual_track_cost: "£army_experience [?constant:video_game_in_sweden_cost.dual_track_army_experience|0]  £command_power [?constant:video_game_in_sweden_cost.dual_track_command_power|0]  £civ_factory [?constant:video_game_in_sweden_cost.dual_track_civilian_factory|0]"
