video_game_restrict_use_cost_blocked: "£pol_power §R[GetVideoGameRestrictionPoliticalPowerCost]§!  £stability_texticon §R[GetVideoGameRestrictionStabilityCost]§!"
video_game_restrict_use_cost_tooltip: "Payment: £pol_power [GetVideoGameRestrictionPoliticalPowerCost]  £stability_texticon [GetVideoGameRestrictionStabilityCost]  £war_support_icon [GetVideoGameRestrictionWarSupportCost]. The closing office draws each charge from the reserve still at hand, so the order can be issued with exhausted reserves. After enforcement, resentment reduces £stability_texticon Stability by [?constant:video_game_in_sweden_cost.backlash_stability_display|0] percentage points for [?constant:video_game_in_sweden_timing.backlash_days|0] days."
