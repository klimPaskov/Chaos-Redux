video_game_trust_model: "Trust the Model"
video_game_trust_model_desc: "Let the cabinet's forecasts direct military planning for up to [?constant:video_game_in_sweden_timing.trust_model_days|0] days. Simulation Reliance rises to §R[?constant:video_game_in_sweden_value.maximum|0]§!, strengthening planning at the cost of supply, recovery, and political attention. The government must reassess the programme when the term ends or a campaign crisis intervenes."
