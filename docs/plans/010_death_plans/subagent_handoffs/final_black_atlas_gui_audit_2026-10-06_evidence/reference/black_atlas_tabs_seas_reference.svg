<svg xmlns="http://www.w3.org/2000/svg" width="520" height="236" viewBox="0 0 520 236" role="img" aria-labelledby="title desc">
<title id="title">Black Atlas default Seas tab reference</title>
<desc id="desc">Reference for the default Seas tab. The fourth tab position has no control while the existing forbidden visibility trigger is false. This is a source-based layout reference, not a production GUI render.</desc>
<style>
  .title { font: bold 18px Arial, sans-serif; fill: #f0e3c2; }
  .tab { font: bold 13px Arial, sans-serif; fill: #eee1c5; }
  .label { font: 15px Arial, sans-serif; fill: #e3d7bf; }
  .value { font: bold 15px Arial, sans-serif; fill: #f0d98d; }
  .footer { font: 13px Arial, sans-serif; fill: #d0c7b2; }
</style>
