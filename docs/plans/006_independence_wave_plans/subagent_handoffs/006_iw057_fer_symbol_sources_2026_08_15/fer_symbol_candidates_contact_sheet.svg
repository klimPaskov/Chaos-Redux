<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <rect width="1200" height="780" fill="#20252b"/>
  <style>
    .panel { fill: #30363d; stroke: #69727c; stroke-width: 2; }
    .label { fill: #f0f3f6; font-family: Arial, sans-serif; font-size: 18px; }
    .note { fill: #c9d1d9; font-family: Arial, sans-serif; font-size: 14px; }
  </style>
  <text x="30" y="32" class="label">IW-057 FER symbol research — source comparison only; not runtime art</text>

  <rect x="25" y="55" width="370" height="320" class="panel"/>
  <image href="flag_of_far_eastern_republic_cc_by_sa_3.svg" x="45" y="82" width="330" height="220" preserveAspectRatio="xMidYMid meet"/>
  <text x="42" y="332" class="label">Historical flag, Commons CC BY-SA 3.0</text>
  <text x="42" y="354" class="note">1920 resolution / 1921 constitutional family · 900×600</text>

  <rect x="415" y="55" width="370" height="320" class="panel"/>
  <image href="flag_constitutional_option_public_domain.svg" x="435" y="82" width="330" height="220" preserveAspectRatio="xMidYMid meet"/>
  <text x="432" y="332" class="label">Constitutional option, Commons PD</text>
  <text x="432" y="354" class="note">Art. 181 reconstruction · 512×341</text>

  <rect x="805" y="55" width="370" height="320" class="panel"/>
  <image href="coat_of_arms_constitutional_public_domain.svg" x="900" y="80" width="180" height="250" preserveAspectRatio="xMidYMid meet"/>
  <text x="822" y="332" class="label">Constitutional state emblem, Commons PD</text>
  <text x="822" y="354" class="note">Art. 180 reconstruction · 512×712</text>

  <rect x="25" y="405" width="370" height="320" class="panel"/>
  <image href="heraldicum_dvr_constitutional_reconstruction.gif" x="80" y="430" width="110" height="260" preserveAspectRatio="xMidYMid meet"/>
  <image href="heraldicum_dvr_banknote_emblem.gif" x="215" y="460" width="145" height="200" preserveAspectRatio="xMidYMid meet"/>
  <text x="42" y="695" class="label">Heraldicum reconstructions</text>
  <text x="42" y="715" class="note">Constitutional emblem + banknote motif · rights unclear</text>

  <rect x="415" y="405" width="370" height="320" class="panel"/>
  <image href="heraldicum_dwr_museum_banner_photo.jpg" x="435" y="445" width="330" height="235" preserveAspectRatio="xMidYMid meet"/>
  <text x="432" y="700" class="label">Museum banner photograph</text>
  <text x="432" y="720" class="note">Khabarovsk Regional Museum credit · rights/date unclear</text>

  <rect x="805" y="405" width="370" height="320" class="panel"/>
  <image href="flag_far_eastern_republic_pd_2006.svg" x="825" y="440" width="330" height="220" preserveAspectRatio="xMidYMid meet"/>
  <text x="822" y="695" class="label">2006 public-domain redraw</text>
  <text x="822" y="715" class="note">No historical source recorded · reject as sole attestation</text>
</svg>
