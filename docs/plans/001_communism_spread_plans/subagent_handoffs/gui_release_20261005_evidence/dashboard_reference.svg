<rect x="24" y="170" width="454" height="22" fill="none" stroke="#f4d35e" stroke-width="2" stroke-dasharray="5 3"/>
<rect x="96" y="198" width="310" height="40" fill="none" stroke="#8bd450" stroke-width="2" stroke-dasharray="5 3"/>
