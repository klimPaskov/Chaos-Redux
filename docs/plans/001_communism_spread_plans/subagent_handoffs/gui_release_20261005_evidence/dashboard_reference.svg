<text x="540" y="95" fill="#4cc9f0" font-family="Arial,sans-serif" font-size="14" font-weight="700">Primary value</text>
<text x="540" y="116" fill="#f0e9d7" font-family="Arial,sans-serif" font-size="13">Keep the authoritative threat score and current</text>
<text x="540" y="134" fill="#f0e9d7" font-family="Arial,sans-serif" font-size="13">qualitative stage beside the meter.</text>
<text x="540" y="160" fill="#f4d35e" font-family="Arial,sans-serif" font-size="14" font-weight="700">Response row</text>
<text x="540" y="181" fill="#f0e9d7" font-family="Arial,sans-serif" font-size="13">Replace total and daily drift figures with:</text>
<text x="540" y="199" fill="#f0e9d7" font-family="Arial,sans-serif" font-size="13">“Select a marked state to intervene.”</text>
<text x="540" y="225" fill="#8bd450" font-family="Arial,sans-serif" font-size="14" font-weight="700">Tier distribution</text>
<text x="540" y="244" fill="#f0e9d7" font-family="Arial,sans-serif" font-size="13">Keep the three count icons and center the full</text>
<text x="540" y="262" fill="#f0e9d7" font-family="Arial,sans-serif" font-size="13">310px group at x=80, 186, and 292 in the</text>
<text x="540" y="280" fill="#f0e9d7" font-family="Arial,sans-serif" font-size="13">470px container.</text>
<text x="18" y="286" fill="#aeb9c5" font-family="Arial,sans-serif" font-size="12">The target keeps four visible numeric values: threat plus one count for each control level. No buttons or costs are inside this panel.</text>
