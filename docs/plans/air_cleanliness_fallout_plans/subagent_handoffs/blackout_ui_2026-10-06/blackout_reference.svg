<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Fallout blackout window repair reference</title>
  <desc id="desc">A scoped annotated reference for the accepted full-screen opaque black Fallout transition overlay, with its existing centered dynamic message and a pointer-only no-op blocker covering the same viewport.</desc>
  <rect width="1600" height="1000" fill="#e9e9e9"/>
  <text x="64" y="62" fill="#151515" font-family="Arial, sans-serif" font-size="28" font-weight="700">FALLOUT BLACKOUT - SCOPED REPAIR REFERENCE</text>
  <text x="64" y="100" fill="#404040" font-family="Arial, sans-serif" font-size="17">Accepted design: opaque black across the viewport, one existing centered message, pointer clicks absorbed without gameplay effects.</text>

  <rect x="64" y="150" width="1260" height="708.75" fill="#000000" stroke="#737373" stroke-width="2"/>
  <rect x="66" y="152" width="1256" height="704.75" fill="none" stroke="#74d2ff" stroke-width="2" stroke-dasharray="12 8"/>
  <text x="694" y="493" fill="#ffffff" font-family="Arial, sans-serif" font-size="30" text-anchor="middle" dominant-baseline="middle">existing centered dynamic message</text>
  <text x="694" y="533" fill="#b9b9b9" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" dominant-baseline="middle">fallout_world_end_blackout_text / fallout_world_end_blackout_display</text>

  <path d="M 1340 220 L 1460 220 L 1460 300" fill="none" stroke="#176b8b" stroke-width="3"/>
  <circle cx="1340" cy="220" r="6" fill="#176b8b"/>
  <text x="1360" y="335" fill="#151515" font-family="Arial, sans-serif" font-size="18" font-weight="700">OPAQUE LAYER</text>
  <text x="1360" y="365" fill="#333333" font-family="Arial, sans-serif" font-size="15">GFX_fallout_blackout_tile</text>
  <text x="1360" y="389" fill="#333333" font-family="Arial, sans-serif" font-size="15">10 x 10 opaque black pixels</text>
  <text x="1360" y="413" fill="#333333" font-family="Arial, sans-serif" font-size="15">registered by parent-owned GFX</text>

  <path d="M 1340 788 L 1460 788 L 1460 730" fill="none" stroke="#176b8b" stroke-width="3"/>
  <circle cx="1340" cy="788" r="6" fill="#176b8b"/>
  <text x="1360" y="632" fill="#151515" font-family="Arial, sans-serif" font-size="18" font-weight="700">POINTER BLOCKER</text>
  <text x="1360" y="662" fill="#333333" font-family="Arial, sans-serif" font-size="15">fallout_world_end_click_blocker</text>
  <text x="1360" y="686" fill="#333333" font-family="Arial, sans-serif" font-size="15">one intentional empty click effect</text>
  <text x="1360" y="710" fill="#333333" font-family="Arial, sans-serif" font-size="15">no transition advance or world mutation</text>

  <line x1="64" y1="900" x2="1536" y2="900" stroke="#b5b5b5" stroke-width="1"/>
  <text x="64" y="936" fill="#333333" font-family="Arial, sans-serif" font-size="16">Scenario: human player | fallout_transition_active = yes | 1920 x 1080 | UI scale 1</text>
  <text x="64" y="966" fill="#555555" font-family="Arial, sans-serif" font-size="15">Keyboard capture and exclusive-input behavior remain engine-unproven and are intentionally outside this reference.</text>
</svg>
