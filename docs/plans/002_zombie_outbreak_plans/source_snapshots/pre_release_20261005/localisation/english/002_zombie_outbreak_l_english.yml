weaponized_zombie_archetype_summary_rabid_horde: "This horde favours raw violence over subtlety. It spreads quickly, strikes hard, and behaves like an intensified outbreak."
weaponized_zombie_archetype_summary_necrotic_siege: "This horde moves slowly and is brutally hard to stop, grinding through assaults and leaving persistent territorial collapse behind it."
weaponized_zombie_archetype_summary_parasitic_directed: "This horde retains selective behaviour that can steer the outbreak toward chosen enemies for a time."
weaponized_zombie_archetype_summary_controlled_loyalty: "This infected horde shows unusual obedience, allowing temporary creator-side control and selective hostility."
weaponized_zombie_archetype_summary_purifier: "This horde spares many humans and focuses its aggression on other infected populations."
weaponized_zombie_archetype_summary_semi_sapient: "This horde retains disturbing traces of intelligence and acts with more independence than ordinary zombies."
weaponized_zombie_archetype_summary_creator_betrayer: "This horde appears selectively obedient, allowing creator-side control and selective hostility in the field."
weaponized_zombie_archetype_summary_canonical_convergence: "This horde is converging on the classic undead pattern and reinforcing the wider zombie apocalypse."
weaponized_zombie_archetype_summary_wendigo: "This is a predatory convergence of mutation, undeath, and extreme aggression that is approaching an apocalypse of its own."
weaponized_zombie_archetype_summary_unknown: "Its behaviour remains unclassified, and every field report marks it as hostile."

chaosx_super_event.6.t: "Wendigo"
chaosx_super_event.6.d: "The thing that escaped the laboratories of [GetWendigoSuperEventOriginName] moves with predatory speed, impossible endurance, and ravenous hunger. Its mutations have made familiar containment doctrine useless.\n\nSomething born at the edge of hunger has entered the war, and every route away from it is growing shorter."
chaosx_super_event.6.a: "We are the dead"
chaosx_super_event.6.q: "Energy and persistence conquer all things. \n §Y-Benjamin Franklin-§!"
wendigo_super_event_origin_name: "[wendigo_super_event_creator.GetNameDef]"
wendigo_super_event_origin_name_unknown: "an unknown power"

chaosx.nr2.10.t: "An Evacuation Across the Sea"
chaosx.nr2.10.d: "[FROM.GetNameDefCap] has asked us to receive civilians evacuated from territory threatened by the zombie outbreak. Their ships can leave before the remaining ports collapse. Accepting them will concentrate thousands of frightened people in our island capital and bind our government to their survival."
chaosx.nr2.10.a: "Open our ports"
chaosx.nr2.10.a.tt: "Approve the evacuation. The refugees will be moved out of [FROM.GetNameDef]'s currently controlled states and concentrated in our island capital."
chaosx.nr2.10.b: "We cannot take them"
chaosx.nr2.10.b.tt: "[FROM.GetNameDefCap] will have to fend for itself"
