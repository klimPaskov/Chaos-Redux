chaosx.nr2.1.t: "Zombie Outbreak"
chaosx.nr2.1.a: "Let the horde rise."

chaosx.nr2.2.t: "The Cure Takes Effect"
chaosx.nr2.2.d: "The cure has entered circulation. Medical teams are treating the first infected and measuring how quickly the horde's advance begins to slow."
chaosx.nr2.2.a: "Begin treatment."

chaosx.nr2.7.t: "The Anti-Zombie League Forms"
chaosx.nr2.7.d: "Major powers have formed the Anti-Zombie League, a military alliance dedicated to stopping the undead. Its members are pooling laboratories, rail networks, and armies to contain the outbreak and distribute protective measures.\n\n[From.GetAdjective] representatives have invited us to join. Membership brings shared cure research, outbreak protocols, and coordinated military support.\n\nThe zombie forces currently field approximately [?total_zombie_divisions|0] divisions across their territories."
chaosx.nr2.7.a: "Join the Anti-Zombie League."
chaosx.nr2.7.b: "We need time to consider this."
chaosx.nr2.7.c: "We will face the horde alone."

# Custom effect tooltips for the Anti Zombie League event
azl_zombie_overwhelming_force_tt: "The horde has grown strong enough that the League needs every available army."
azl_can_join_later_tt: "League membership remains available if the outbreak reaches our borders."
azl_refused_to_join_tt: "Our country will face the outbreak without League protection."

chaosx.news.3.t: "Zombie Outbreak in [outbreak_state.GetName]"
chaosx.news.3.d: "A massive zombie outbreak has erupted in [outbreak_state.GetName]. Infected travellers and hidden carriers can carry the plague far beyond the first streets, turning every road and port into a possible route for the horde."
chaosx.news.3.a: "Close the borders."

chaosx.news.81.t: "Weaponized Zombie Deployment in [weaponized_zombie_target_state.GetName]"
chaosx.news.81.d: "[FROM.GetNameDef] has deployed a weaponized zombie outbreak in [weaponized_zombie_target_state.GetName]. The released horde is identified as [weaponized_zombie_new_country.GetWeaponizedZombieTypeName], derived from [weaponized_zombie_new_country.GetWeaponizedZombieNatureSummary]. Witnesses describe infected that appear [weaponized_zombie_new_country.GetWeaponizedZombieLifeStateSummary]. The outbreak bears the marks of deliberate engineering."
chaosx.news.81.a: "The war has changed."

chaosx_cbw_doom.1.t: "Doomsday Release in [From.GetNameDef]!"
chaosx_cbw_doom.1.d: "In a desperate act, [From.GetNameDef] has released its chemical stockpiles across controlled areas. Contamination is spreading through military positions and civilian districts, leaving casualties in its wake.\n\nThe agents will remain after the order has passed, poisoning ground and water far beyond the first strikes."
chaosx_cbw_doom.1.a: "This will stain the world."

chaosx_cbw_doom.2.t: "Doomsday Release in [From.GetNameDef]!"
chaosx_cbw_doom.2.d: "In a final act of biological warfare, [From.GetNameDef] has publicly emptied its pathogen arsenal across controlled territory and enemy-held border zones. Anthrax, plague, tularemia, and smallpox are expected to emerge on separate incubation schedules, overwhelming medical systems as evidence fixes responsibility on the releasing state.\n\nNo frontier offers safety. The outbreaks can spread back through [From.GetNameDef], across enemy-held border states, and into allied populations long after the order itself has passed."
chaosx_cbw_doom.2.a: "A plague of war."

chaosx_super_event.1.t: "Undead?"
chaosx_super_event.1.d: "The dead have risen in [outbreak_state.GetName] spreading terror and chaos.\nWitnesses describe scenes of horror as reanimated corpses or \"zombies\" began to terrorize cities and rural areas alike. The outbreak's cause appears to be unknown.\nAuthorities are urging the public to remain vigilant and avoid contact with anyone exhibiting unusual behavior."
chaosx_super_event.1.a: "Do you like to take a yo-yo for a ride?"
chaosx_super_event.1.q: "This, then, is how you should pray: 'Our Father in heaven, hallowed be your name.' \n §Y-Matthew 6:9-§!"

chaosx_super_event.2.t: "The Anti-Zombie League"
chaosx_super_event.2.d: "The old wars must wait. Under [azl_faction_leader.GetName]'s leadership, the Anti-Zombie League binds armies, laboratories, rail networks, and border commands into a single emergency front against the dead.\n\nIts members bring different flags and grudges to the same line. The horde has grown large enough to threaten every government that stands apart."
chaosx_super_event.2.a: "What does a zombie vegetarian eat? Graaaaains!"
chaosx_super_event.2.q: "Believe in the light while you have the light, so that you may become children of light. \n §Y-John 12:36-§!"

chaosx_super_event.3.t: "Zombie Apocalypse"
chaosx_super_event.3.d: "The Anti-Zombie League has lost the last connected front. Cities burn, roads belong to the infected, and the horde now governs by hunger wherever it reaches. Survivors hide in sealed rooms and abandoned tunnels while the remaining radio stations fall silent. Human governments no longer control the world."
chaosx_super_event.3.a: "We are the dead"
chaosx_super_event.3.q: "Energy and persistence conquer all things. \n §Y-Benjamin Franklin-§!"

chaosx_super_event.5.t: "The Dead Are Buried"
chaosx_super_event.5.d: "The last organized zombie strongholds have been erased. After the collapse of the main horde, remaining nests were isolated, burned out, and cleared until no infected war-state remained capable of holding territory.\n\nFor the first time since the outbreak began, humanity can count the dead without expecting them to rise again."
chaosx_super_event.5.a: "Count them, bury them, rebuild."
chaosx_super_event.5.q: "Be not ye afraid of them. \n §Y-Nehemiah 4:14-§!"

chaosx.nr2.12.t: "The Survivor Compact"
chaosx.nr2.12.d: "The zombie wars have ended. Governments that stood in the line of death are binding laboratories, rail networks, and industrial ministries into a permanent survivor compact. Shared engineering, construction, and biowarfare research will continue across borders under strict sanitary oversight.\n\nRecorded zombie war dead: [?global.zombie_campaign_zombie_dead|0]\nRecorded civilian dead under zombie occupation: [?global.zombie_campaign_civilian_dead|0]\nRecorded dead in the survivor ledger: [?global.zombie_campaign_total_dead|0]"
chaosx.nr2.12.a: "The dead will be remembered"

chaosx.nr2.13.t: "Day of the Buried"
chaosx.nr2.13.d: "Today marks the anniversary of the zombie war's end. Bells ring in public squares, and the names of the lost are spoken again. The graves remain part of every city that survived the horde.\n\nRecorded zombie war dead: [?global.zombie_campaign_zombie_dead|0]\nRecorded civilian dead under zombie occupation: [?global.zombie_campaign_civilian_dead|0]\nRecorded dead in the survivor ledger: [?global.zombie_campaign_total_dead|0]"
chaosx.nr2.13.a: "Honor them all"

chaosx.nr2.14.t: "The Distant Front"
chaosx.nr2.14.d: "The zombie war no longer touches our borders. The Anti-Zombie League still exists. Its armies are fighting far away, and its wartime obligations are straining every government that remains inside it.\n\nWe can keep our place in the League or leave the distant front to those still exposed."
chaosx.nr2.14.a: "Withdraw from the League"
chaosx.nr2.14.b: "Remain in the League"

chaosx.nr2.15.t: "A New Zombie Front"
chaosx.nr2.15.d: "The main zombie outbreak has opened a fresh continental front against Anti-Zombie League territory. The new theater is spreading toward governments that left the alliance, and its armies are asking for coordinated resistance before the horde reaches another population centre."
chaosx.nr2.15.a: "Stay out for now"
chaosx.nr2.15.b: "Rejoin the League"

chaosx.events_log.window.evolution_details.zombie.title.stage_1: "Zombie Evolution I"
chaosx.events_log.window.evolution_details.zombie.title.stage_2: "Zombie Evolution II"
chaosx.events_log.window.evolution_details.zombie.title.stage_3: "Zombie Evolution III"


chaosx.weaponized_zombies.1.t: "Weaponize the Zombies: Final Conclusions"
chaosx.weaponized_zombies.1.d: "The laboratory has classified the zombie as [GetWeaponizedZombieNatureSummary], and the infected appear to be [GetWeaponizedZombieLifeStateSummary]. The resulting outbreak type is [GetWeaponizedZombieTypeName].\n\nStrength: [?weaponized_zombie_strength|.0]\nInfectiousness: [?weaponized_zombie_infectiousness|.0]\nSpeed: [?weaponized_zombie_speed|.0]\nDurability: [?weaponized_zombie_durability|.0]\nCure Resistance: [?weaponized_zombie_cure_resistance|.0]\nObedience Profile: [?weaponized_zombie_friendliness|.0]\n\n[GetWeaponizedZombieArchetypeSummary]"
chaosx.weaponized_zombies.1.a: "Begin production"
chaosx.weaponized_zombies.9.t: "[FROM.GetName]: Outbreak Profile"
chaosx.weaponized_zombies.9.d: "Field observations classify this outbreak as [FROM.GetWeaponizedZombieNatureSummary], and the infected appear to be [FROM.GetWeaponizedZombieLifeStateSummary]. The resulting outbreak type is [FROM.GetWeaponizedZombieTypeName].\n\nStrength: [?FROM.weaponized_zombie_strength|.0]\nInfectiousness: [?FROM.weaponized_zombie_infectiousness|.0]\nSpeed: [?FROM.weaponized_zombie_speed|.0]\nDurability: [?FROM.weaponized_zombie_durability|.0]\nCure Resistance: [?FROM.weaponized_zombie_cure_resistance|.0]\nObedience Profile: [?FROM.weaponized_zombie_friendliness|.0]\n\n[FROM.GetWeaponizedZombieArchetypeSummary]"
chaosx.weaponized_zombies.9.a: "File the report"

chaosx.weaponized_zombies.2.t: "Weaponized Zombie Field Test"
chaosx.weaponized_zombies.2.d: "The field trial in [weaponized_zombie_target_state.GetName] has concluded. The zombies can be delivered outside laboratory conditions, giving the army practical data for doctrine and production. The test remained contained. The security perimeter came close to breaking."
chaosx.weaponized_zombies.2.a: "Catalog every result"

chaosx.weaponized_zombies.3.t: "Domestic Test, Controlled Outcome"
chaosx.weaponized_zombies.3.d: "The domestic field trial in [weaponized_zombie_target_state.GetName] stopped short of a full containment failure. Researchers gathered practical data, and the exercise left the staff shaken by how close the zombies came to breaking free."
chaosx.weaponized_zombies.3.a: "Keep the data, tighten security"

chaosx.weaponized_zombies.4.t: "Domestic Test Outbreak"
chaosx.weaponized_zombies.4.d: "The controlled domestic test in [weaponized_zombie_target_state.GetName] has failed. Infected assets escaped the trial environment and seeded a real outbreak on our own territory. The program has produced field data at the cost of exposing its own population."
chaosx.weaponized_zombies.4.a: "Contain what we unleashed"

chaosx.weaponized_zombies.5.t: "Laboratory Containment Failure"
chaosx.weaponized_zombies.5.d: "A containment failure has occurred in our biowarfare complex in [weaponized_zombie_target_state.GetName]. Tailored zombies have escaped the laboratory and seeded a live outbreak. Equipment is lost, the surrounding area is collapsing, and the program has created the catastrophe its critics feared."
chaosx.weaponized_zombies.5.a: "Seal the site and pray"

chaosx.weaponized_zombies.6.t: "Creator Betrayal Resolution"

chaosx.weaponized_zombies.7.t: "Field Control Failure"
chaosx.weaponized_zombies.7.d: "One of our deployed weaponized outbreaks has lost all handling control. Contact teams are missing, command assumptions have failed, and our own forces can no longer rely on prior exemptions."
chaosx.weaponized_zombies.7.a: "Treat it as hostile"

chaosx.weaponized_zombies.8.t: "Weaponize the Zombies"
chaosx.weaponized_zombies.8.d: "The biowarfare complex in [weaponized_zombie_target_state.GetName] has suffered a terminal containment collapse. The infected crossed beyond the program's design limits, and the resulting horde cannot be directed or recalled. What escaped is death."
chaosx.weaponized_zombies.8.a: "The world will pay for this failure."

