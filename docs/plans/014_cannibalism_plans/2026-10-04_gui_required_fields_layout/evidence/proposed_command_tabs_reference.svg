<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520">
  <title>Event 014 command-window tab layout proposal</title>
  <desc>Two event-owned command windows shown in their record tabs over the existing painted backgrounds. Cyan dashed boxes are annotations for native controls and dynamic lists, not final artwork.</desc>
  <rect width="1040" height="520" fill="#17120e"/>
  <text x="24" y="27" fill="#f0e5d4" font-size="18" font-family="Arial">WARLORD COMMAND — “STATES” TAB · 470×340</text>
  <text x="538" y="27" fill="#f0e5d4" font-size="18" font-family="Arial">REVEALED COMMAND — “LOYALTY” TAB · 470×380</text>
  <image href="../../2026-10-03_gui_required_fields_layout/evidence/reference_inputs/warlord_command_background.png" x="24" y="48" width="470" height="340"/>
  <image href="../../2026-10-03_gui_required_fields_layout/evidence/reference_inputs/revealed_command_background.png" x="538" y="48" width="470" height="380"/>
  <image href="../../2026-10-03_gui_required_fields_layout/evidence/reference_inputs/controlled_state_card.png" x="44" y="130" width="278" height="72"/>
  <image href="../../2026-10-03_gui_required_fields_layout/evidence/reference_inputs/controlled_state_card.png" x="44" y="202" width="278" height="72"/>
  <g fill="none" stroke="#6fe5ff" stroke-width="2" stroke-dasharray="7 4">
    <rect x="42" y="96" width="100" height="29"/>
    <rect x="150" y="96" width="100" height="29"/>
    <rect x="42" y="130" width="296" height="146"/>
    <rect x="44" y="280" width="278" height="72"/>
    <rect x="556" y="316" width="82" height="24"/>
    <rect x="642" y="316" width="82" height="24"/>
    <rect x="722" y="102" width="278" height="18"/>
    <rect x="722" y="122" width="278" height="72"/>
    <rect x="722" y="198" width="278" height="18"/>
    <rect x="722" y="218" width="278" height="58"/>
    <rect x="732" y="328" width="278" height="20"/>
    <rect x="722" y="352" width="278" height="72"/>
  </g>
  <g fill="none" stroke="#edc47b" stroke-width="1.5" stroke-dasharray="4 4">
    <rect x="42" y="130" width="278" height="72"/>
    <rect x="42" y="202" width="278" height="72"/>
  </g>
  <image href="../../2026-10-03_gui_required_fields_layout/evidence/reference_inputs/controlled_state_card.png" x="44" y="280" width="278" height="72"/>
  <image href="../../2026-10-03_gui_required_fields_layout/evidence/reference_inputs/continental_target_card.png" x="722" y="352" width="278" height="72"/>
  <g fill="#f2e7d5" font-family="Arial">
    <text x="50" y="115" font-size="12">Overview</text>
    <text x="158" y="115" font-size="12">States</text>
    <text x="49" y="322" font-size="12">No raid target assigned</text>
    <text x="562" y="333" font-size="11">Overview</text>
    <text x="648" y="333" font-size="11">Loyalty</text>
    <text x="730" y="117" font-size="12">Integrated history</text>
    <text x="730" y="159" font-size="12">history row · name / origin / region / disposition</text>
    <text x="730" y="213" font-size="12">Surviving warlords</text>
    <text x="730" y="245" font-size="12">live row · name / relationship / pending response</text>
    <text x="740" y="343" font-size="12">Last campaign</text>
    <text x="730" y="382" font-size="12">Real target/date, or explicit “none”</text>
  </g>
  <g fill="#d8e3d1" font-family="Arial" font-size="12">
    <text x="24" y="414">Overview retains current values; States shows actual controlled records and the raid owner’s true target state.</text>
    <text x="24" y="432">Revealed Overview retains the portrait and values; Loyalty shows separate history/live lists and one committed campaign card.</text>
    <text x="24" y="470">Dashed bounds map to native buttonType and dynamic-list elements; they are annotations, not painted controls.</text>
    <text x="24" y="488">All existing event art and animation families remain the assets used by the current windows.</text>
  </g>
</svg>
