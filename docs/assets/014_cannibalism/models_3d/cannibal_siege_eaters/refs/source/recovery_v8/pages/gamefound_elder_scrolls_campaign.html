    <script>
        (function (){
            const localStorageValue = JSON.parse(localStorage.getItem('store.webTheme'));
            if (localStorageValue && localStorageValue.theme) {
                document.documentElement.setAttribute('data-theme', localStorageValue.theme);
            }
            else {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.setAttribute('data-theme', 'dark');
                }
                else {
                    document.documentElement.setAttribute('data-theme', 'bright');
                }
            }
        })();
    </script>

<script>
    window.__INITIAL_STATE__ = {"userAdditionalInfo":{"backedProjectsIDs":null,"followedProjectsIDs":null,"followedUsersIDs":null,"guestOrderToken":null,"userPreferredLocation":{"locationName":"Estonia","systemLocationID":11,"systemSubLocationID":null}},"projectState":{"endgameState":null,"statistics":{"backersCount":14982,"backersCountOvertime":null,"campaignDay":1245,"campaignOutcome":1,"currentStretchGoalID":null,"fundedAt":"2023-03-28T15:02:29.377Z","fundsGathered":4683007.54,"fundsGatheredOvertime":null,"totalBackersCount":20407,"totalFundsGathered":7164507.56},"stretchGoals":[{"imageThumbUrl":"https://imgcdn.gamefound.com/stretchgoalimagethumb/projects/2295/d14293ce-fb79-40d3-8f09-6896756e25fd.jpg","imageUrl":"https://imgcdn.gamefound.com/productimage/projects/2295/d14293ce-fb79-40d3-8f09-6896756e25fd.jpg","abstract":"This unlocks the FINAL 20 cards of the Thieves Trove! These items and relics are all 4 types of items (5 of each type to be exact). So Drink, Cast, Eat and Dress up!","description":"\u003Cdiv\u003E\u003Cb style=\u0022background-color: inherit\u0022\u003EWHAT IS THE THIEVES TROVE?! \u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003EGood question! The Thieves Trove is a special set of items and relics that function in very unique ways. This expansion has already been in development over the last year and was slated as an add-on we had planned to roll out during a future reprint campaign.\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EHowever, this campaign has blown up beyond our expectations (yes, we were very cautious about expectations based on other campaigns with similar IPs), stretch goals are flying off the shelf, and \u003Cspan style=\u0022color: rgba(53, 50, 69, 1); background-color: inherit\u0022\u003Ewe have hit some significant milestones (here\u0027s looking at you, $2.5 million). So, when we \u003C/span\u003Enoticed a fair number of people commenting on the amount of items and relics offered in the game, we got o e for the base game, some for the Valenwood expansion), but this Thieves Trove expansion will also grow in size at key funding levels!  \u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EThe main difference is this add-on will not be part of the base game after the campaign. Rather, it will be a purchasable add-on we will sell going forward at an estimated $15-25 depending on how full the trove gets! We\u0027re not exactly sure how this will be handled in terms of price in the Pledge Manager just yet; for now, we are only promising it will be free during the campaign portion. \u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Ci\u003E\u003Cb style=\u0022background-color: inherit\u0022\u003EAnd if you cannot be a part of this campaign, do not fear! Unlike a campaign exclusive product that threatens to go away forever afterward, or is slated as a limited edition add-on, this will be offered as a normal purchasable add-on just like Valenwood -- so all you would be missing out on are the savings. \u003C/b\u003E\u003C/i\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022background-color: inherit\u0022\u003EOK, SO HOW DOES THIS GOAL WORK? \u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003EStarting at $3 million, we will be unlocking the first group of items (Potions) that will be included in the Thieves Trove. Then, hopefully soon after, you\u0027ll unlock Enchantments. And then... who\u0027s to say!? Each of these item groups will be larger unlocks that will include a significant amount of items and relics. \u003Cspan style=\u0022color: rgba(53, 50, 69, 1); background-color: inherit\u0022\u003EAgain, this add-on will be FREE for backers of any of our four reward levels and will be added to your order \u003C/span\u003E\u003Cb\u003E\u003Ci style=\u0022background-color: inherit\u0022\u003Eautomagickally. \u003C/i\u003E\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022background-color: inherit\u0022\u003EIS THIS A CRAFTING EXPANSION? \u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003ENot exactly. You will see a hint of crafting in how these items and relics are categorized, as well as how they function in comparison to items already in the base game.  \u003C/div\u003E","isAutomatic":true,"isFeatured":true,"isPublished":true,"isReadOnly":false,"isSecret":false,"isUnlocked":true,"name":"Thieves Trove: Enchantments (20 Items \u0026 Relics)","productQuantity":0,"progress":1.4409252307692308,"projectID":2295,"projectStretchGoalID":3012,"publishedAt":"2023-04-06T20:27:44.497Z","targetDescription":null,"targetType":1,"targetTypeName":"Backed funds","targetValue":3250000,"unlockedAt":"2023-04-15T15:50:45.527Z","value":4683007},{"imageThumbUrl":"https://imgcdn.gamefound.com/stretchgoalimagethumb/projects/2295/cf7e483b-3bbe-4542-891a-6acc61594cb1.jpg","imageUrl":"https://imgcdn.gamefound.com/productimage/projects/2295/cf7e483b-3bbe-4542-891a-6acc61594cb1.jpg","abstract":"This new class allows you to reroll or mitigate large enemy attacks and escape when you get into a jam.","description":"","isAutomatic":true,"isFeatured":true,"isPublished":true,"isReadOnly":false,"isSecret":false,"isUnlocked":true,"name":"New Class: Rogue","productQuantity":0,"progress":1.4634396875,"projectID":2295,"projectStretchGoalID":3017,"publishedAt":"2023-04-11T15:21:52.79Z","targetDescription":null,"targetType":1,"targetTypeName":"Backed funds","targetValue":3200000,"unlockedAt":"2023-04-14T19:32:16.147Z","value":4683007},{"imageThumbUrl":"https://imgcdn.gamefound.com/stretchgoalimagethumb/projects/2295/fb3591cf-f39e-45cf-87a1-c9617ec6f6bd.jpg","imageUrl":"https://imgcdn.gamefound.com/productimage/projects/2295/fb3591cf-f39e-45cf-87a1-c9617ec6f6bd.jpg","abstract":"You like bugs? Add these two disgusting insect enemies to your Valenwood expansion!","description":"\n","isAutomatic":true,"isFeatured":false,"isPublished":t differ from what is presented on this Gamefound project page.\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022background-color: inherit; font-family: inherit\u0022\u003EREFUND TERMS:\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003EAn order can be canceled and fully refunded before the end of the campaign by clicking on the applicable button found on Gamefound.\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022background-color: inherit\u0022\u003ERegarding payments made through Gamefound:\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u2022 Within 14 days after the end of the campaign, you can get a full refund without any conditions.\u003C/div\u003E\u003Cdiv\u003E\u2022 From the 15th day after campaign end to the day order fulfillment lists are submitted to our partners, you can get a refund minus fees (Gamefound \u0026amp; credit card processing fees - typically 8%) by contacting CTG.\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cb style=\u0022background-color: inherit; font-family: inherit\u0022\u003ERegarding payments made through the Pledge Manager:\u003C/b\u003E\u003C/div\u003E\u003Cdiv\u003E\u2022 You can get a full refund without any conditions within 14 days after the payment, not 14 days after the Pledge Manager closes.\u003C/div\u003E\u003Cdiv\u003E\u2022 You can get a refund minus fees from the 15th day after the payment to the day order fulfillment lists are submitted to our partners.\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003EThe refunds are made by default in USD through the Pledge Manager.\u003C/div\u003E","originalHeader":"Refunds and cancellation","descriptionInfo":{"type":0,"header":"Stable Pledge","content":"This project is a part of the Stable Pledge program. The creator guarantees a full refund to backers if the change in any price estimates after the campaign\u0027s end is bigger than 10%. Backers will be granted a 100% refund upon request made within 14 days after the change announcement. Gamefound will pay back its provision to the creator, who is solely responsible for refunds. \u003Ca href=\u0022https://help.gamefound.com/article/250-what-is-stable-pledge\u0022 target=\u0022_blank\u0022 rel=\u0022noopener noreferrer\u0022\u003ELearn more\u003C/a\u003E."},"type":9,"children":[]},{"projectDescriptionSectionID":21237,"header":"Risks and challenges","content":"\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(53, 50, 69, 1); font-family: Arial; font-size: 12pt\u0022\u003EThis is our 16th crowdfunding campaign, so we know what we\u0027re doing. However, over the last few years, COVID-19 and related factors have provided their own set of unique challenges to the board game production, manufacturing and shipping process. We\u0027re still committed to the same level of service we have offered pre-pandemic, but ongoing shipping problems could result in slowdowns to production or fulfillment.\u003C/span\u003E\u0026nbsp;\u003C/div\u003E\u003Cdiv\u003E\u003Cbr\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan style=\u0022color: rgba(53, 50, 69, 1); font-family: Arial; font-size: 12pt\u0022\u003EWith that said, we have a great reputation for industry-best communication and transparency with our backers. We are also a very healthy company and have plenty of staying power even if we all were to encounter more tough months ahead. We\u0027ll be here. When you back a Chip Theory campaign, we guarantee you\u2019ll receive a high quality product at the conclusion of the project and know exactly where things stand every step of the way. \u003C/span\u003E\u003C/div\u003E","originalHeader":"Risks and challenges","descriptionInfo":null,"type":0,"children":[]},{"projectDescriptionSectionID":21236,"header":"Shipping Information","content":"\u003Cdiv\u003E\u003Cdiv class=\u0022gfu-embed\u0022 style=\u0022padding-top: 287%;\u0022\u003E\u003Cimg src=\u0022https://imgcdn.gamefound.co
