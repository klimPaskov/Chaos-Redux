<svg xmlns="http://www.w3.org/2000/svg" width="500" height="86" viewBox="0 0 500 86">
  <title>Air panel toggle alignment reference</title>
  <desc>User-requested layout: the Air System Active checkbox starts at the same second-column edge as Clean air. The label remains 36 pixels to the right of the checkbox, and the existing row heights remain unchanged.</desc>
  <rect width="500" height="86" fill="#252525"/>
  <text x="20" y="25" fill="#eeeeee" font-family="Arial" font-size="16">Global Air Cleanliness</text>
  <rect x="260" y="8" width="24" height="20" rx="2" fill="#111111" stroke="#888888"/>
  <path d="M265 18l5 5 10-11" fill="none" stroke="#d0b674" stroke-width="2"/>
  <text x="296" y="25" fill="#eeeeee" font-family="Arial" font-size="16">Air System Active</text>
  <text x="20" y="55" fill="#eeeeee" font-family="Arial" font-size="16">Contamination: 0.00%</text>
  <text x="260" y="55" fill="#eeeeee" font-family="Arial" font-size="16">Clean air: 100.00%</text>
</svg>
