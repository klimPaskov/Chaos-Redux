chaosx.fallout.775.t: "The Ghost Convoy"
chaosx.fallout.775.opening.d: "Three nights after the Captain's Articles were closed, a line of unmarked hulls appears beyond the ash-colored breakers. Their lamps follow the old sea road that once carried grain south, yet no harbor register names the crews. The port council must decide how the West African Port Confederacies will meet a convoy that has chosen silence."
chaosx.fallout.775.a: "Approach with a search skiff"
chaosx.fallout.775.a.tt: "Spend Food 2, Medicine 1, and Recognition 4 to send a named crew toward the lead hull and ask for its route."
chaosx.fallout.775.b: "Shadow the convoy"
chaosx.fallout.775.b.tt: "Spend Scrap 3, Power 2, and Recognition 2 to follow the ships from the old lighthouse without opening the harbor channel."
chaosx.fallout.775.c: "Avoid the sea road"
chaosx.fallout.775.c.tt: "Spend Fuel 3 and Recognition 3, then accept a Cohesion cost, to extinguish the harbor lights and keep the convoy beyond the reef."
chaosx.fallout.775.d: "Signal from the mast"
chaosx.fallout.775.d.tt: "Spend Food 2, Medicine 2, Fuel 3, and Recognition 3 to publish the port's names, berth rules, and distress signal across the old route."
chaosx.fallout.776.t: "The Ghost Convoy"
chaosx.fallout.777.t: "Names on the Old Sea Road"
chaosx.fallout.777.approach.success.d: "The search skiff reached the lead hull before dawn. Its crew carried salt, water filters, and a hand-drawn chart of settlements beyond the reef. The port now has names to call when the next boat appears."
chaosx.fallout.777.approach.partial.d: "The search skiff exchanged a crate of medicine for a route marker and returned with two frightened pilots. The convoy kept its cargo hold closed, but the port can read the next signal."
chaosx.fallout.777.approach.failure.d: "The lead hull turned through the reef and the search skiff came back with a torn mast. The council spent medicine and fuel without learning whether the convoy carried families, raiders, or wreck survivors."
chaosx.fallout.777.shadow.success.d: "The lighthouse watch followed the convoy for a week and mapped every light change. The ships carried repair steel and seed grain toward three inland anchorages. The port can trade with them on a measured route."
chaosx.fallout.777.shadow.partial.d: "The shadow crew charted the convoy's turns and found one damaged freighter. Its escorts refused a landing, yet their wake marks reveal a safe passage through the shoals."
chaosx.fallout.777.shadow.failure.d: "The lighthouse watch lost the convoy in a rain of ash. The port burned power on empty bearings, and rumors of hidden guns now travel faster than the ships."
chaosx.fallout.777.avoid.success.d: "The harbor lights went dark and the convoy passed without a shot. The council kept its stores intact and marked the old sea road as a route for another season."
chaosx.fallout.777.avoid.partial.d: "The port closed its channel and saved fuel, but two families left in small boats to follow the convoy. The council must answer for the missing berth records."
chaosx.fallout.777.avoid.failure.d: "The reef lights went dark while a damaged hull searched for them. A grounding scattered cargo across the shoals and turned the closed channel into a public grievance."
chaosx.fallout.777.signal_publicly.success.d: "The signal mast broadcast the port's names, berth rules, and distress code. A reply came from a convoy tender with clean water and a list of settlements that still answer radio calls."
chaosx.fallout.777.signal_publicly.partial.d: "The signal reached one escort and a fishing village beyond the reef. The convoy stayed silent, but the port's public route code now travels with every outgoing boat."
chaosx.fallout.777.signal_publicly.failure.d: "The mast broadcast through a broken amplifier and drew three different replies. The council spent medicine on callers it could not identify, while the real convoy vanished into cloud and spray."
chaosx.fallout.777.a: "Close the convoy record"
chaosx.fallout.777.a.tt: "Apply the delayed convoy outcome, record its route memory, and release the reserved harbor and partner rows."
chaosx.fallout.779.t: "The Convoy Returns"
chaosx.fallout.779.success.d: "The old sea road has a working signal again. The port can identify a convoy by its names, its berth request, and the water it carries."
chaosx.fallout.779.partial.d: "The route memory survived, but the convoy keeps one harbor ledger of its own. The council can trade with it while the signal code is revised."
chaosx.fallout.779.failure.d: "The delayed review found an empty route and three contradictory charts. Patrol crews are tired, the harbor stores are thin, and no one can say who owns the next light."
chaosx.fallout.779.a: "Close the route record"
chaosx.fallout.779.a.tt: "Apply the delayed convoy review, write the final route memory, and release the reserved harbor and partner rows."
fallout.event_log.ghost_convoy.name: "The Ghost Convoy"
fallout.event_log.ghost_convoy.detail: "[GetFalloutEvent775EventLogDetail]"
fallout.event_log.ghost_convoy.detail.choice_approach: "The port sent a named search skiff toward the unidentified convoy."
fallout.event_log.ghost_convoy.detail.choice_shadow: "The lighthouse watch followed the convoy from the old sea road."
fallout.event_log.ghost_convoy.detail.choice_avoid: "The port extinguished its lights and kept the convoy beyond the reef."
fallout.event_log.ghost_convoy.detail.choice_signal_publicly: "The signal mast broadcast the port's names and distress code."
fallout.event_log.ghost_convoy.detail.approach_success: "The search skiff returned with pilots, a chart, and a named route."
fallout.event_log.ghost_convoy.detail.approach_partial: "The search skiff traded medicine for a route marker and two pilots."
fallout.event_log.ghost_convoy.detail.approach_failure: "The search skiff returned damaged without identifying the convoy's cargo."
fallout.event_log.ghost_convoy.detail.shadow_success: "The lighthouse watch mapped the convoy and found repair steel and seed grain."
fallout.event_log.ghost_convoy.detail.shadow_partial: "The shadow crew found a damaged freighter and a safe shoal passage."
fallout.event_log.ghost_convoy.detail.shadow_failure: "The lighthouse lost the convoy and left the port with costly rumors."
fallout.event_log.ghost_convoy.detail.avoid_success: "The convoy passed a dark harbor and the port preserved its stores."
fallout.event_log.ghost_convoy.detail.avoid_partial: "The port closed its channel while two families followed the convoy."
fallout.event_log.ghost_convoy.detail.avoid_failure: "A damaged hull grounded after the port lights went dark."
fallout.event_log.ghost_convoy.detail.signal_publicly_success: "The signal mast received clean water and a list of settlements that still answer."
fallout.event_log.ghost_convoy.detail.signal_publicly_partial: "The public route code reached one escort and a fishing village."
fallout.event_log.ghost_convoy.detail.signal_publicly_failure: "The broken amplifier drew false replies while the convoy disappeared."
fallout.event_log.ghost_convoy.detail.callback_success: "The old sea road kept one route code, berth record, and water signal."
fallout.event_log.ghost_convoy.detail.callback_partial: "The route memory survived while the convoy kept a separate harbor ledger."
fallout.event_log.ghost_convoy.detail.callback_failure: "The review found empty charts, tired patrols, and no trusted next light."
fallout.event_log.ghost_convoy.detail.cancelled: "The convoy record was cancelled after its state, partner, owner, controller, or generation changed."
