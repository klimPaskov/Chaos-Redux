# Analysis settlement
chaosx_nr25_archive_analysis: "Archive the Alien Systems Record"
chaosx_nr25_archive_analysis_desc: "Preserve the verified survey, custody trail, and recovery outcome in a restricted national archive."
chaosx_nr25_archive_analysis_effect: "The verified record is retained for future scientific and diplomatic decisions."
chaosx_nr25_share_verified_evidence: "Share Verified Evidence"
chaosx_nr25_share_verified_evidence_desc: "Share one verified survey or fragment result with a different active participant."
chaosx_nr25_share_verified_evidence_effect: "The selected partner receives a documented evidence note and the diplomatic record is updated."
chaosx_nr25_contain_recovered_systems: "Contain Recovered Systems"
chaosx_nr25_contain_recovered_systems_desc: "Place the recovered alien-derived system under a reversible containment protocol."
chaosx_nr25_contain_recovered_systems_effect: "Containment reduces the chance of a dependence incident without erasing the recovered technology."
chaosx_nr25_seal_analysis_archive: "Seal the Analysis Archive"
chaosx_nr25_seal_analysis_archive_desc: "Restrict the public record while preserving verified facts for future custodians."
chaosx_nr25_seal_analysis_archive_effect: "The archive is sealed. Verified survey and recovery records are retained."
