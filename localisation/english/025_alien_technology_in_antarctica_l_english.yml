chaosx_nr25_organize_chartered_expedition_mission: "Organize the Chartered Expedition"
chaosx_nr25_organize_chartered_expedition_mission_desc: "Book neutral holds, stores, and crews into a departure plan that does not depend on our own ships. It runs for [?chaosx_nr25_phase_mission_duration|0] days while the expedition keeps working. It fails if, when it is due, the expedition faces emergency weather, has an exhausted crew, or has Logistics Readiness below 10."
chaosx_nr25_reach_chartered_gateway_mission: "Reach the Gateway on Chartered Ships"
chaosx_nr25_reach_chartered_gateway_mission_desc: "Move the expedition through the southern gateway on neutral shipping schedules. It runs for [?chaosx_nr25_phase_mission_duration|0] days while the expedition keeps working. It fails if, when it is due, the expedition faces emergency weather, has an exhausted crew, or has Logistics Readiness below 10."
