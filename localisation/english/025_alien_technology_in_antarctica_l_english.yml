# Event Details and log wording
chaosx_nr25_event_log_title: "Alien Technology in Antarctica"
chaosx_nr25_event_log_type: "Calm World Major"
chaosx_nr25_event_log_evolution_type: "Alien Technology Evolutions"
chaosx_nr25_event_log_opening_stage: "Impossible readings beneath the Antarctic ice open a controlled expedition race."
chaosx_nr25_event_log_opening_body: "Governments with direct expedition authority receive the first invitation. Other capable powers enter only after the initial responses define the race."
chaosx_nr25_event_log_settlement_stage: "The primary recovery is resolved."
chaosx_nr25_event_log_settlement_body: "The winning country receives one non-duplicate result derived from the recovered systems. Losing countries retain only verified survey or exclusive fragment evidence."
chaosx_nr25_event_log_detail: "The Antarctic recovery record follows a race across six field sectors, with private expedition records, verified survey evidence, exclusive fragments, and five independent hazards. One expedition secures the primary alien-derived result. Every other expedition keeps only what it verified."
chaosx_nr25_event_details_unfired: "Impossible readings beneath the Antarctic ice draw governments into a race across six field sectors. Each expedition keeps a private record of its route, camp, survey evidence and fragments, while five independent hazards can change the race. One expedition secures the primary alien-derived result; every other expedition keeps only what it verified.\n\n§YThe race has not begun in this campaign.§!"
chaosx_nr25_event_details_active: "Impossible readings beneath the Antarctic ice draw governments into a race across six field sectors. Each expedition keeps a private record of its route, camp, survey evidence and fragments, while five independent hazards can change the race. One expedition secures the primary alien-derived result; every other expedition keeps only what it verified.\n\n§YThe race is under way.§! No expedition has secured the primary site yet."
chaosx_nr25_event_details_resolved: "Impossible readings beneath the Antarctic ice draw governments into a race across six field sectors. Each expedition keeps a private record of its route, camp, survey evidence and fragments, while five independent hazards can change the race. One expedition secures the primary alien-derived result; every other expedition keeps only what it verified.\n\n§YThe race is decided.§! [chaosx_alien_recovery_event025_owner.GetNameDefCap] secured the primary recovery."
chaosx_nr25_event_details_closed: "Impossible readings beneath the Antarctic ice draw governments into a race across six field sectors. Each expedition keeps a private record of its route, camp, survey evidence and fragments, while five independent hazards can change the race. One expedition secures the primary alien-derived result; every other expedition keeps only what it verified.\n\n§YThe race closed without a winner.§! The primary recovery passed out of reach."
chaosx_nr25_event_log_evolution_summary: "Five independently enabled Antarctic hazards can change the race without replacing its baseline recovery condition."
chaosx_nr25_event_log_evolution_active_signal: "Active Signal"
chaosx_nr25_event_log_evolution_something_survived: "Something Survived"
chaosx_nr25_event_log_evolution_militarised_antarctica: "Militarised Antarctica"
chaosx_nr25_event_log_evolution_wreck_breaking_apart: "The Wreck Is Breaking Apart"
chaosx_nr25_event_log_evolution_technology_changes_users: "The Technology Changes Its Users"
chaosx.nr25.evolution.active_signal.title: "Active Signal"
chaosx.nr25.evolution.active_signal.body: "The buried transmitter answers field instruments in a patient, non-human pattern. The signal increases the hazard of the race without removing the possibility of recovery."
chaosx.nr25.evolution.active_signal.summary: "A signal is active beneath the ice."
chaosx.nr25.evolution.something_survived.title: "Something Survived"
chaosx.nr25.evolution.something_survived.body: "Movement has been observed beyond the wreck's outer shell. It may be a mechanism, a biological response, or an echo in the snow, but the field teams must account for it while the recovery race continues."
chaosx.nr25.evolution.something_survived.summary: "A surviving trace alters the field operation."
chaosx.nr25.evolution.militarised_antarctica.title: "Militarised Antarctica"
chaosx.nr25.evolution.militarised_antarctica.body: "Armed patrols and emergency claims are joining the expedition flags. The local crisis can still be contained through rescue, interception, or a demilitarised compact without forcing a global war."
chaosx.nr25.evolution.militarised_antarctica.summary: "The Antarctic contest has acquired armed pressure."
chaosx.nr25.evolution.wreck_breaking_apart.title: "The Wreck Is Breaking Apart"
chaosx.nr25.evolution.wreck_breaking_apart.body: "The alien-derived wreck is shedding hot fragments into six distinct sectors. Each field is evidence and hazard at once, and careful recovery can preserve the primary race."
chaosx.nr25.evolution.wreck_breaking_apart.summary: "Fragment fields are spreading across the ice."
chaosx.nr25.evolution.technology_changes_users.title: "The Technology Changes Its Users"
chaosx.nr25.evolution.technology_changes_users.body: "The recovered system is beginning to anticipate its operators. Dependence remains measurable and recoverable, but each custody decision changes the relationship between human judgment and the alien-derived interface."
chaosx.nr25.evolution.technology_changes_users.summary: "The recovered system is shaping its custodians."
chaosx_nr25_event_log_casualties: "Expedition casualties: [?chaosx_nr25_casualties|0]"
chaosx_nr25_event_log_verified_survey: "Verified survey evidence retained."
chaosx_nr25_event_log_verified_fragment: "Exclusive alien-derived fragment ownership retained."
chaosx_nr25_event_log_reward_base: "A missing alien-derived system family was made operational."
chaosx_nr25_event_log_reward_upgrade: "A compatible alien-derived system family was upgraded."
chaosx_nr25_event_log_reward_integration: "Alien Systems Integration was completed."
chaosx_nr25_event_log_reward_overlap: "An exact overlap with an earlier recovery was converted into a different valid result."
chaosx_nr25_evolution_disabled: "This evolution is disabled in the current settings and leaves the baseline race unchanged."

# Achievement names and descriptions
chaosx_nr25_achievement_eligible_tooltip: "Available to a human expedition in a campaign that was not started in debug mode or by forcing the event."
025_alien_technology_antarctic_vanguard_NAME: "Antarctic Vanguard"
025_alien_technology_antarctic_vanguard_DESC: "Win the primary recovery and receive the alien-derived operational reward."
025_alien_technology_antarctic_vanguard_tooltip: "Complete the primary recovery and apply the alien-derived operational reward."
025_alien_technology_long_way_south_NAME: "The Long Way South"
025_alien_technology_long_way_south_DESC: "Win after entering without direct coastal access and using an improvised or chartered route."
025_alien_technology_long_way_south_tooltip: "Enter without direct coastal access, use a chartered, sponsored, or improvised route, and win the primary recovery."
025_alien_technology_white_science_NAME: "White Science"
025_alien_technology_white_science_DESC: "Win without carrying out a hostile expedition action."
025_alien_technology_white_science_tooltip: "Win without sabotage, military pressure, or armed retrieval."
025_alien_technology_nobody_left_on_ice_NAME: "Nobody Gets Left on the Ice"
025_alien_technology_nobody_left_on_ice_DESC: "Rescue a rival expedition from a valid personnel-loss crisis, then win the primary recovery."
025_alien_technology_nobody_left_on_ice_tooltip: "Complete a valid rival rescue before winning the primary recovery."
025_alien_technology_false_map_NAME: "The False Map"
025_alien_technology_false_map_DESC: "Recover from a successful false-coordinate operation and still win."
025_alien_technology_false_map_tooltip: "Survive a successful false-coordinate operation and win the recovery."
025_alien_technology_without_escort_NAME: "Without an Escort"
025_alien_technology_without_escort_DESC: "Win after Something Survived or Militarised Antarctica without committing a military escort."
025_alien_technology_without_escort_tooltip: "Win after Something Survived or Militarised Antarctica without guarding the survey team, blockading an approach, seizing a landing zone, or intercepting a patrol."
025_alien_technology_reclaim_the_station_NAME: "Reclaim the Station"
025_alien_technology_reclaim_the_station_DESC: "Lose and restore the Antarctic outpost, then win the primary recovery."
025_alien_technology_reclaim_the_station_tooltip: "Restore a lost outpost and later win the primary recovery."
025_alien_technology_fragments_of_a_losing_cause_NAME: "Fragments of a Losing Cause"
025_alien_technology_fragments_of_a_losing_cause_DESC: "Lose the primary race while finishing with the highest non-winner fragment tier."
025_alien_technology_fragments_of_a_losing_cause_tooltip: "Lose the primary recovery race with the highest fragment tier available to a losing expedition."
025_alien_technology_six_fields_of_debris_NAME: "Six Fields of Debris"
025_alien_technology_six_fields_of_debris_DESC: "Recover all six authorized fragment categories during Wreck Breaking Apart."
025_alien_technology_six_fields_of_debris_tooltip: "Recover one exclusive fragment from each of the six debris fields."
025_alien_technology_listen_without_answering_NAME: "Listen Without Answering"
025_alien_technology_listen_without_answering_DESC: "Win after Active Signal using passive remote analysis without provoking the signal."
025_alien_technology_listen_without_answering_tooltip: "Win after Active Signal using remote listening alone."
025_alien_technology_human_factors_NAME: "Human Factors"
025_alien_technology_human_factors_DESC: "Contain Alien Dependence, retain the recovered technology, and pass one full year without a dependence accident."
025_alien_technology_human_factors_tooltip: "Win the primary recovery, retain the technology, contain Alien Dependence, and complete one full year below the containment threshold without a dependence accident."
025_alien_technology_system_prefers_us_NAME: "The System Prefers Us"
025_alien_technology_system_prefers_us_DESC: "Integrate the alien-derived system, reach stable high Dependence, and remain in control for two years."
025_alien_technology_system_prefers_us_tooltip: "Win the primary recovery, integrate the system, and maintain high Alien Dependence for two years without destroying the interface or transferring custody."
025_alien_technology_two_crashes_one_answer_NAME: "Two Crashes, One Answer"
025_alien_technology_two_crashes_one_answer_DESC: "Win the Antarctic recovery and receive a different operational result when it overlaps with another alien recovery."
025_alien_technology_two_crashes_one_answer_tooltip: "Receive an actual non-duplicate result when two recoveries overlap."
025_alien_technology_first_among_equals_NAME: "First Among Equals"
025_alien_technology_first_among_equals_DESC: "Win after at least five expeditions establish outposts and you share data with two different rivals."
025_alien_technology_first_among_equals_tooltip: "Win the primary recovery after at least five expeditions establish outposts. Share data with two different rivals before the winner is decided."

