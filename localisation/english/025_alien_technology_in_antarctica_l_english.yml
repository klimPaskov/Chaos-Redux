# Runtime effect summaries and final-recovery mission text
chaosx_nr25_science_exchange_effect: "Scientific capacity, intelligence, progress, and Logistics Readiness improve."
chaosx_nr25_depot_effect: "The expedition gains progress and Logistics Readiness."
chaosx_nr25_aerial_effect: "Intelligence, progress, and Logistics Readiness improve while Exposure Risk rises."
chaosx_nr25_radio_effect: "Intelligence and Logistics Readiness improve while the expedition's signal signature grows."
chaosx_nr25_crew_effect: "Crew capacity, progress, and Logistics Readiness improve."
chaosx_nr25_rotate_effect: "Crew capacity, progress, and Logistics Readiness improve while Exposure Risk rises."
chaosx_nr25_rival_recon_effect: "The expedition gains limited intelligence from verified public or observed evidence."
chaosx_nr25_fragment_effect: "One unclaimed fragment record is assigned exclusively to this expedition."
chaosx_nr25_remote_recovery_effect: "The country begins a slower, lower-exposure final recovery attempt."
chaosx_nr25_sabotage_effect: "The selected rival suffers a partial or full operational setback if the target remains valid."
chaosx_nr25_countermeasure_effect: "The next valid sabotage is intercepted or its damage is reduced."
chaosx_nr25_analysis_archive_effect: "The verified record is retained for future scientific and diplomatic decisions."
chaosx_nr25_analysis_exchange_effect: "The selected partner receives a documented evidence note and the diplomatic record is updated."
chaosx_nr25_analysis_containment_effect: "Containment reduces the chance of a dependence incident without erasing the recovered technology."
chaosx_nr25_analysis_seal_effect: "The archive is sealed. Verified survey and recovery records are retained."
chaosx_nr25_final_mission_success_tt: "The recovery result is submitted for today's arbitration. It needs Expedition Progress of 100, Logistics Readiness of 60, a functioning outpost, and no emergency weather or exhausted crew on the due date."
chaosx_nr25_final_mission_timeout_tt: "If the expedition is not ready on the due date, the recovery fails partially and can be attempted again after its cooldown."
chaosx_nr25_organize_southern_expedition_mission: "Organize the Southern Expedition"
chaosx_nr25_organize_southern_expedition_mission_desc: "Move the first stores, crews, and instruments into a viable Antarctic departure plan. It runs for [?chaosx_nr25_phase_mission_duration|0] days while the expedition keeps working. It fails if, when it is due, the expedition faces emergency weather, has an exhausted crew, or has Logistics Readiness below 10."
chaosx_nr25_reach_gateway_mission: "Reach the Gateway"
chaosx_nr25_reach_gateway_mission_desc: "Carry the expedition through its selected southern route and keep access open. It runs for [?chaosx_nr25_phase_mission_duration|0] days while the expedition keeps working. It fails if, when it is due, the expedition faces emergency weather, has an exhausted crew, or has Logistics Readiness below 10."
chaosx_nr25_establish_antarctic_outpost_mission: "Establish the Antarctic Outpost"
chaosx_nr25_establish_antarctic_outpost_mission_desc: "Turn a temporary landing into a functioning, supplied Antarctic foothold. It runs for [?chaosx_nr25_phase_mission_duration|0] days while the expedition keeps working. It fails if, when it is due, the expedition faces emergency weather, has an exhausted crew, or has Logistics Readiness below 10."
chaosx_nr25_triangulate_crash_zone_mission: "Triangulate the Crash Zone"
chaosx_nr25_triangulate_crash_zone_mission_desc: "Reconcile the signal, terrain, and flight evidence around the buried site. It runs for [?chaosx_nr25_phase_mission_duration|0] days while the expedition keeps working. It fails if, when it is due, the expedition faces emergency weather, has an exhausted crew, or has Logistics Readiness below 10."
chaosx_nr25_protect_supply_route_mission: "Protect the Supply Route"
chaosx_nr25_protect_supply_route_mission_desc: "Keep stores and crew rotations moving through the southern weather window. It runs for [?chaosx_nr25_phase_mission_duration|0] days while the expedition keeps working. It fails if, when it is due, the expedition faces emergency weather, has an exhausted crew, or has Logistics Readiness below 10."
chaosx_nr25_confirm_primary_site_mission: "Confirm the Primary Site"
chaosx_nr25_confirm_primary_site_mission_desc: "Convert survey evidence into a reliable recovery coordinate. Only a survey that found the probable site can confirm it. It runs for [?chaosx_nr25_phase_mission_duration|0] days while the expedition keeps working. It fails if, when it is due, the expedition faces emergency weather, has an exhausted crew, or has Logistics Readiness below 10."
chaosx_nr25_evacuate_expedition_mission: "Evacuate the Expedition"
chaosx_nr25_evacuate_expedition_mission_desc: "Bring the crew and verified records home while the ice still permits a withdrawal. It runs for [?chaosx_nr25_phase_mission_duration|0] days while the expedition keeps working. It fails if the expedition faces emergency weather when it is due."
chaosx_nr25_stabilize_wreck_mission: "Stabilize the Wreck"
chaosx_nr25_stabilize_wreck_mission_desc: "Hold the alien-derived wreck together long enough to preserve its fragment fields. It runs for [?chaosx_nr25_phase_mission_duration|0] days while the expedition keeps working."
chaosx_nr25_contain_alien_systems_mission: "Contain Alien Systems"
chaosx_nr25_contain_alien_systems_mission_desc: "Build a reversible containment protocol around the recovered alien-derived systems. It runs for [?chaosx_nr25_phase_mission_duration|0] days while the expedition keeps working."
chaosx_nr25_organize_mission_success_tt: "The departure plan is ready and the expedition can begin its crossing. With Logistics Readiness of 20 or more, Expedition Progress rises; otherwise the plan leaves with fewer stores and readiness falls."
chaosx_nr25_organize_mission_timeout_tt: "The departure plan loses stores and readiness, but the expedition still begins its crossing."
chaosx_nr25_gateway_mission_success_tt: "The expedition reaches Antarctica and can build its outpost. A secured gateway improves readiness; an incomplete one raises Exposure Risk."
chaosx_nr25_gateway_mission_timeout_tt: "The gateway window closes before the route is fully secured. The expedition lands by an improvised inland route and begins outpost work."
chaosx_nr25_outpost_mission_success_tt: "The Antarctic outpost becomes a functioning base and the survey of the six sectors can begin."
chaosx_nr25_outpost_mission_timeout_tt: "The outpost is damaged before it can be fully supplied. Once its security is restored, the survey can begin."
chaosx_nr25_triangulate_mission_success_tt: "The crash zone is triangulated from independent evidence."
chaosx_nr25_triangulate_mission_timeout_tt: "The crash zone remains uncertain and the false-map sector becomes suspect."
chaosx_nr25_supply_route_mission_success_tt: "The next supply movement is protected from a routine route setback."
chaosx_nr25_supply_route_mission_timeout_tt: "A route incident drains readiness and leaves a convoy report in the record."
chaosx_nr25_confirm_site_mission_success_tt: "If a survey found the probable site, the primary recovery coordinate is confirmed and final recovery opens. Otherwise Exposure Risk rises and the confirmation can be attempted again."
chaosx_nr25_confirm_site_mission_timeout_tt: "The primary coordinate remains unconfirmed and the expedition loses some progress. Further surveys can attempt the confirmation again."
chaosx_nr25_evacuation_mission_success_tt: "The expedition reaches safety with its verified survey and fragment records intact."
chaosx_nr25_evacuation_mission_timeout_tt: "The evacuation window collapses; the remaining crew and records are recovered at a higher cost."
chaosx_nr25_stabilize_wreck_mission_success_tt: "The wreck remains coherent and its fragment fields stay recoverable."
chaosx_nr25_stabilize_wreck_mission_timeout_tt: "The wreck loses integrity before the stabilization can hold."
chaosx_nr25_contain_systems_mission_success_tt: "The recovered alien-derived systems enter a safe containment state."
chaosx_nr25_contain_systems_mission_timeout_tt: "Containment fails to settle the systems; Dependence and accident risk remain active."
chaosx_nr25_withdraw_expedition: "Withdraw the Expedition"
chaosx_nr25_withdraw_expedition_desc: "End this country's expedition and preserve only the verified evidence it has secured."
chaosx_nr25_withdraw_expedition_cost: "[This.GetChaosxNr25EvacuationCost]"
chaosx_nr25_withdraw_expedition_effect: "The expedition withdraws; verified survey and fragment records remain persistent."
chaosx_nr25_public_blockade: "Antarctic blockade"
chaosx_nr25_public_seizure: "Antarctic landing seizure"
chaosx_nr25_public_intercept: "Antarctic patrol incident"

chaosx_nr25_secure_recovery_core_mission: "Secure the Recovery Core"
chaosx_nr25_secure_recovery_core_mission_desc: "Hold the recovery site steady until the primary alien-derived system can be confirmed."
chaosx_nr25_rapid_extraction_mission: "Rapid Extraction"
chaosx_nr25_rapid_extraction_mission_desc: "Complete the accelerated recovery before the exposed approach collapses."
chaosx_nr25_remote_recovery_mission: "Remote Recovery"
chaosx_nr25_remote_recovery_mission_desc: "Bring the system in through a remote rig while keeping personnel clear of the site."
chaosx_nr25_armed_retrieval_mission: "Armed Retrieval"
chaosx_nr25_armed_retrieval_mission_desc: "Secure the recovery site through a forceful retrieval operation."
chaosx_nr25_distributed_salvage_mission: "Distributed Salvage"
chaosx_nr25_distributed_salvage_mission_desc: "Coordinate several recovery teams until the distributed result is confirmed."

chaosx.nr25.85.t: "The Recovery Window Opens"
chaosx.nr25.87.t: "An Expedition Objective Falls Due"
chaosx.nr25.86.t: "The Ice Rejects the Recovery"
chaosx.nr25.86.d: "The final recovery attempt has failed without erasing the expedition's verified evidence. The crews have lost time, stores, and confidence, but a later attempt remains possible after the operation's cooldown."
chaosx.nr25.86.a: "Rebuild the approach."
chaosx.nr25.298.t: "The Last Expedition Withdraws"
chaosx.nr25.298.d: "No active expedition remains in the Antarctic record. Verified survey notes and exclusive fragment ownership remain preserved, while the primary recovery passes out of immediate reach."
chaosx.nr25.298.a: "Close the Antarctic file."

