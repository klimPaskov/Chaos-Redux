 chaosx.event_name.656: "The Second Dust Bowl"
 chaosx.event_name.657: "The Second Dust Bowl: Field Assessment"
 chaosx.event_name.658: "The Second Dust Bowl: Field Settlement"
 chaosx.event_name.659: "The Second Dust Bowl: Field Settlement Assessment"
 chaosx.event_name.660: "The Second Dust Bowl: Planting Season"
 chaosx.event_name.661: "The Second Dust Bowl: Planting Season Assessment"
 chaosx.event_name.662: "The Second Dust Bowl: Ledger Closure"
 chaosx.fallout.656.t: "The Open Plains Are Losing Their Soil"
 chaosx.fallout.656.d: "Cold wind is lifting the topsoil across [?fallout_event_dispatch_issued_target.GetName]. Covered rows are tearing loose, livestock shelter is thin, and the next planting cannot be treated as a normal season. The country can build field shelter, move its farms into protected parcels within the same state, seed cold crops, or close the exposed fields and shelter the households that remain."
 chaosx.fallout.656.a: "Shelter the fields"
 chaosx.fallout.656.a.tt: "Spend §Y[?constant:fallout_event_656_cost.shelter_scrap|0]§! Scrap, §Y[?constant:fallout_event_656_cost.shelter_fuel|0]§! Fuel, and §Y[?constant:fallout_event_656_cost.shelter_capacity|0]§! Shelter Capacity in [?fallout_event_dispatch_issued_target.GetName]. The result arrives after §Y[?constant:fallout_event_656_timing.result_delay_days|0] days§! and may protect topsoil or leave the outer fields exposed."
 chaosx.fallout.656.b: "Move the farms"
 chaosx.fallout.656.b.tt: "Spend §Y[?constant:fallout_event_656_cost.move_fuel|0]§! Fuel, §Y[?constant:fallout_event_656_cost.move_food|0]§! Food, and §Y[?constant:fallout_event_656_cost.move_capacity|0]§! Shelter Capacity. Farm households consolidate inside [?fallout_event_dispatch_issued_target.GetName] without a population transfer. Equipment can be stranded if the move fails. The result arrives after §Y[?constant:fallout_event_656_timing.result_delay_days|0] days§!."
 chaosx.fallout.656.c: "Seed cold crops"
 chaosx.fallout.656.c.tt: "Spend §Y[?constant:fallout_event_656_cost.seed_food|0]§! Food, §Y[?constant:fallout_event_656_cost.seed_scrap|0]§! Scrap, and §Y[?constant:fallout_event_656_cost.seed_power|0]§! Power in [?fallout_event_dispatch_issued_target.GetName]. Dust can consume the reserve before it roots. The result arrives after §Y[?constant:fallout_event_656_timing.result_delay_days|0] days§! and returns for a planting review."
 chaosx.fallout.656.d_option: "Abandon the open plains"
 chaosx.fallout.656.d.tt: "Spend §Y[?constant:fallout_event_656_cost.abandon_fuel|0]§! Fuel, §Y[?constant:fallout_event_656_cost.abandon_capacity|0]§! Shelter Capacity, and §Y[?constant:fallout_event_656_cost.abandon_medicine|0]§! Medicine. The most exposed fields close while households shelter inside [?fallout_event_dispatch_issued_target.GetName]. Food output falls if the withdrawal succeeds. The result arrives after §Y[?constant:fallout_event_656_timing.result_delay_days|0] days§! and can still leave a disordered retreat."
 chaosx.fallout.658.t: "The Field Decision Has Settled"
 chaosx.fallout.658.shelter.success.d: "Windbreak crews in [?fallout_event_656_target_state_id.GetName] kept the covered rows anchored through the first cold gusts. Topsoil retention and adaptation improved, and the country can carry a smaller field shelter into the planting review."
 chaosx.fallout.658.shelter.partial.d: "The inner plots in [?fallout_event_656_target_state_id.GetName] held their cover, but the outer rows lost soil before the crews reached them. The settlement kept a usable shelter plan with a visible dust load."
 chaosx.fallout.658.shelter.failure.d: "The field shelter in [?fallout_event_656_target_state_id.GetName] broke before the wind eased. Food and infrastructure were lost, disease pressure rose around the exposed households, and a bounded population loss was recorded."
 chaosx.fallout.658.move.success.d: "Farm households in [?fallout_event_656_target_state_id.GetName] consolidated into protected parcels without leaving the same state. Equipment reached the new rows, supply access improved, and the mobility ledger now describes a repeatable move."
 chaosx.fallout.658.move.partial.d: "The most exposed plots in [?fallout_event_656_target_state_id.GetName] reached protected ground, but the remaining equipment could not follow. The farm mobility ledger is useful, although food and shelter officers still disagree over the outer rows."
 chaosx.fallout.658.move.failure.d: "The move in [?fallout_event_656_target_state_id.GetName] stranded equipment between the open plots and the protected parcels. Food and supply access fell, displacement pressure rose, and the crews returned with fewer tools than they carried out."
 chaosx.fallout.658.seed.success.d: "Cold-crop seed in [?fallout_event_656_target_state_id.GetName] survived the first dust-laden frost. The reserve is recorded by the settlement rather than hidden in one storehouse, and later food planning can use a crop that belongs to this place."
 chaosx.fallout.658.seed.partial.d: "The seed allocation in [?fallout_event_656_target_state_id.GetName] saved a reserve, but the first planting remained thin. Cold-crop adoption rose without erasing the dust load that still sits over the outer rows."
 chaosx.fallout.658.seed.failure.d: "The cold-crop reserve in [?fallout_event_656_target_state_id.GetName] was consumed before a viable planting took root. Food fell, the dust load grew, and the settlement has no honest seed promise for the next review."
 chaosx.fallout.658.abandon.success.d: "The country closed the most exposed fields in [?fallout_event_656_target_state_id.GetName] and sheltered the households that remained within the same state. Exposure and disease pressure eased, while the abandoned acreage is now a reclamation debt."
 chaosx.fallout.658.abandon.partial.d: "Only the outer plots in [?fallout_event_656_target_state_id.GetName] were closed before the wind returned. Households found shelter, but food and reclamation fell across a field boundary that no longer looks temporary."
 chaosx.fallout.658.abandon.failure.d: "The withdrawal from [?fallout_event_656_target_state_id.GetName] lost its order at the last open rows. Food and reclamation fell, displacement pressure rose, and a bounded population loss was recorded."
 chaosx.fallout.658.a: "Read the field ledger"
 chaosx.fallout.658.a.tt: "Record the settled field result and schedule the planting-season callback for §Y[?constant:fallout_event_656_timing.callback_delay_days|0] days§!."
 chaosx.fallout.660.t: "The Planting Season Has Arrived"
 chaosx.fallout.660.success.d: "The planting review in [?fallout_event_656_target_state_id.GetName] found protected soil, a workable supply route, and enough trust to name the next crop. The country has carried the field decision into a durable season memory."
 chaosx.fallout.660.partial.d: "The planting review in [?fallout_event_656_target_state_id.GetName] found some protected rows and a thinner reserve than the officers promised. The settlement can plant again, though the outer plots still answer to the dust load."
 chaosx.fallout.660.failure.d: "The planting review in [?fallout_event_656_target_state_id.GetName] found a soil reserve too thin for the promised acreage. Exposure and disease pressure rose again, a bounded population loss was recorded, and the country must keep the failed field memory visible."
 chaosx.fallout.660.a: "Close the planting review"
 chaosx.fallout.660.a.tt: "Apply the delayed field result and close the Second Dust Bowl transaction."
