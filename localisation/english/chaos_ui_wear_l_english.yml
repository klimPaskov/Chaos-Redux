chaosx.miscellaneous.chaos_ui_wear.tt: "§YChaos Cracks§!
Cracks spread along the top bar, the side panels and the minimap frame with each Chaos tier, and turn purple once a world-end scenario begins. They never cover text and never block clicks.
Untick to keep the interface clean."
