chaosx.miscellaneous.chaos_ui_wear.label: "Chaos Cracks"
chaosx.miscellaneous.chaos_ui_wear.desc: "Cracks spread across the interface as Chaos rises."
chaosx.miscellaneous.chaos_ui_wear.tt: "§YChaos Cracks§!\nFine cracks and chips spread along the edges of the top bar, side panels, and minimap frame with each Chaos tier above Calm World, growing larger, more visible and redder. A world-end scenario leaves more cracks along these borders. They never cover text or block clicks.\nUntick to keep the interface clean."
