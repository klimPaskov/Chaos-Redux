chaosx.miscellaneous.chaos_ui_wear.label: "Chaos Cracks"
chaosx.miscellaneous.chaos_ui_wear.desc: "Cracks spread across the interface as Chaos rises."
chaosx.miscellaneous.chaos_ui_wear.tt: "§YChaos Cracks§!\nFine cracks and chips spread along the edges of the top bar, side panels, and minimap frame with each Chaos tier above Calm World and turn purple once a world-end scenario begins. They never cover text or block clicks.\nUntick to keep the interface clean."
