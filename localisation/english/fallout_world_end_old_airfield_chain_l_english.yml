l_english:
  chaosx.fallout.586.t: "The Old Airfield"
  chaosx.fallout.586.desc: "A patched runway has survived in the wet highlands where the old airport road climbs into the cloud. Mechanics keep one weathered transport aircraft moving between medicine crates, food stores, and villages that no longer trust a distant capital. The radio mast is new, the concrete is not, and every landing will decide who receives the next safe cargo."
  chaosx.fallout.586.a: "Open a civil air service"
  chaosx.fallout.586.a.tt: "Spend [?constant:fallout_event_586_cost.civil_fuel|0] Fuel, [?constant:fallout_event_586_cost.civil_scrap|0] Scrap, [?constant:fallout_event_586_cost.civil_power|0] Power, and [?constant:fallout_event_586_cost.civil_recognition|0] Recognition. Public cargo, medicine, and food gain priority while the runway becomes a shared service."
  chaosx.fallout.586.b: "Put the runway under air command"
  chaosx.fallout.586.b.tt: "Spend [?constant:fallout_event_586_cost.military_fuel|0] Fuel, [?constant:fallout_event_586_cost.military_power|0] Power, and [?constant:fallout_event_586_cost.military_command_power|0] Command Power. Reconnaissance and emergency lift gain reach while the garrison claims the timetable."
  chaosx.fallout.586.c: "License private couriers"
  chaosx.fallout.586.c.tt: "Spend [?constant:fallout_event_586_cost.courier_fuel|0] Fuel, [?constant:fallout_event_586_cost.courier_scrap|0] Scrap, and [?constant:fallout_event_586_cost.courier_recognition|0] Recognition. Cheap courier flights reconnect trade and intelligence, but smuggling pressure rises with every uninspected crate."
  chaosx.fallout.586.d: "Invite an international consortium"
  chaosx.fallout.586.d.tt: "Spend [?constant:fallout_event_586_cost.consortium_fuel|0] Fuel, [?constant:fallout_event_586_cost.consortium_scrap|0] Scrap, [?constant:fallout_event_586_cost.consortium_power|0] Power, and [?constant:fallout_event_586_cost.consortium_recognition|0] Recognition. Outside standards and capital improve the route while dependency enters the ledger."
  chaosx.fallout.588.t: "The Airfield Ledger"
  chaosx.fallout.588.invalid.d: "The runway changed hands before its first ledger could close. The old landing schedule is void, and the mechanics have carried the radio books into the hills."
  chaosx.fallout.588.civil.success.d: "The civil service made the old airfield useful to more than one valley. Medicine, grain, and spare parts now move on a public timetable, and the radio mast answers to a board that names every landing."
  chaosx.fallout.588.civil.partial.d: "The civil service opened the runway, but the public timetable still bends around guarded cargo. A few clinics receive medicine while nearby villages count the flights that never arrive."
  chaosx.fallout.588.civil.failure.d: "The civil service spent its stores before it could keep the aircraft safe. The runway remains under guard, the public queue has broken apart, and a damaged hangar will not shelter the next storm."
  chaosx.fallout.588.military.success.d: "Air command secured the highland strip and made emergency lift a reliable instrument. Reconnaissance now reaches the valleys beyond the ash haze, while the garrison records every crate and flight."
  chaosx.fallout.588.military.partial.d: "Air command held the main runway, but two valley flights were cancelled under fire and weather. The strip remains open, though the officers and mechanics no longer share one ledger."
  chaosx.fallout.588.military.failure.d: "Air command took the strip and lost the crew that knew its broken concrete. A damaged air base and empty fuel drums now stand between the garrison and the villages it promised to reach."
  chaosx.fallout.588.courier.success.d: "Licensed couriers made the old airfield quick and quiet. Trade notices, clinic packets, and intelligence cross the mountains on schedules that the public board cannot see, and the route begins to earn its own trust."
  chaosx.fallout.588.courier.partial.d: "Private couriers keep the aircraft moving, but the route is uneven. A medicine crate reaches the far valley while a fuel manifest disappears into a market that does not answer to the radio mast."
  chaosx.fallout.588.courier.failure.d: "The courier license became a cover for uncounted cargo. Trade has thinned, intelligence has gone stale, and the old airfield carries more suspicion than supplies."
  chaosx.fallout.588.consortium.success.d: "The consortium brought gauges, spare parts, and a hard landing standard that the highland crews could actually use. Outside capital did not erase local authority, and the airfield now serves a written regional compact."
  chaosx.fallout.588.consortium.partial.d: "The consortium supplied a second set of engines and a foreign schedule, but its inspectors now decide which valleys are worth the fuel. The runway works while dependency grows beside the radio mast."
  chaosx.fallout.588.consortium.failure.d: "The consortium withdrew after the first disputed landing. Its crates are still stacked beside the hangar, its invoices are not, and the old airfield has lost both local confidence and outside credit."
  chaosx.fallout.588.a: "Record the airfield result"
  chaosx.fallout.588.a.tt: "Confirm the first airfield ledger and begin the delayed route review. The review will reauthenticate the country, target state, branch, and Fallout generation before it applies its result."
  chaosx.fallout.590.t: "The Route Review"
  chaosx.fallout.590.invalid.d: "The old airfield changed hands before the route review. The surviving crew has sealed the flight books, and no later authority may claim the old schedule."
  chaosx.fallout.590.success.d: "The route review found a living service in the highlands. Flights have a remembered purpose, the crews know which valleys are waiting, and the old airfield can carry its obligations into the next season."
  chaosx.fallout.590.partial.d: "The route review found a working strip with a narrow margin. The aircraft flies when fuel, weather, and local permission meet, but every missed landing remains in the community ledger."
  chaosx.fallout.590.failure.d: "The route review found a runway that could not keep its promise. The radio mast still transmits, yet the aircraft is grounded, the safe route is closed, and the next repair will begin under suspicion."
  chaosx.fallout.590.a: "Close the route review"
  chaosx.fallout.590.a.tt: "Close the old airfield review and preserve its branch memory for later Fallout events."
  fallout.event_log.old_airfield_chain.name: "The Old Airfield"
  fallout.event_log.old_airfield_chain.detail: "[GetFalloutEvent586EventLogDetail]"
  fallout.event_log.old_airfield_chain.detail.choice_civil: "The country opened the old airfield to a public civil service."
  fallout.event_log.old_airfield_chain.detail.choice_military: "The country placed the old airfield under air command."
  fallout.event_log.old_airfield_chain.detail.choice_courier: "The country licensed private couriers at the old airfield."
  fallout.event_log.old_airfield_chain.detail.choice_consortium: "The country invited an international consortium to the old airfield."
  fallout.event_log.old_airfield_chain.detail.civil_success: "The civil air service made the highland runway a public cargo route."
  fallout.event_log.old_airfield_chain.detail.civil_partial: "The civil air service opened a contested public timetable."
  fallout.event_log.old_airfield_chain.detail.civil_failure: "The civil air service failed and left the runway under guarded scarcity."
  fallout.event_log.old_airfield_chain.detail.military_success: "Air command secured a reliable emergency lift and reconnaissance strip."
  fallout.event_log.old_airfield_chain.detail.military_partial: "Air command held the runway while the flight ledger split."
  fallout.event_log.old_airfield_chain.detail.military_failure: "Air command lost its crew and left a damaged airfield behind."
  fallout.event_log.old_airfield_chain.detail.courier_success: "Licensed couriers made the old airfield a quick trade and intelligence route."
  fallout.event_log.old_airfield_chain.detail.courier_partial: "Private couriers kept flights moving through an uneven market."
  fallout.event_log.old_airfield_chain.detail.courier_failure: "The courier license became a route for uncounted cargo and lost trust."
  fallout.event_log.old_airfield_chain.detail.consortium_success: "The consortium established a durable regional aviation compact."
  fallout.event_log.old_airfield_chain.detail.consortium_partial: "The consortium kept the runway open while dependency deepened."
  fallout.event_log.old_airfield_chain.detail.consortium_failure: "The consortium withdrew and left the old airfield without credit or confidence."
  fallout.event_log.old_airfield_chain.detail.callback_success: "The route review established a remembered air service for the next season."
  fallout.event_log.old_airfield_chain.detail.callback_partial: "The route review preserved a narrow service that still misses landings."
  fallout.event_log.old_airfield_chain.detail.callback_failure: "The route review closed the grounded air service."
  fallout.event_log.old_airfield_chain.detail.cancelled: "The Old Airfield record could not be confirmed after its target or authority changed."
  fallout_old_airfield_civil_corridor: "Civil air service corridor"
  fallout_old_airfield_civil_corridor_desc: "A public air service links the repaired runway to clinics, food stores, and highland villages."
  fallout_old_airfield_military_corridor: "Air command corridor"
  fallout_old_airfield_military_corridor_desc: "A guarded air command controls emergency lift, reconnaissance, and the runway timetable."
  fallout_old_airfield_courier_corridor: "Private courier corridor"
  fallout_old_airfield_courier_corridor_desc: "Licensed couriers move trade and intelligence through the old airfield while inspectors struggle to follow every crate."
  fallout_old_airfield_consortium_corridor: "Consortium air corridor"
  fallout_old_airfield_consortium_corridor_desc: "Foreign standards and capital keep the runway operating while outside dependency grows."
  fallout_old_airfield_result_success: "Old airfield ledger secured"
  fallout_old_airfield_result_success_desc: "The first airfield result improved supply access and recovery around the repaired runway."
  fallout_old_airfield_result_partial: "Old airfield ledger contested"
  fallout_old_airfield_result_partial_desc: "The first airfield result kept a reduced route alive while local claims remained unsettled."
  fallout_old_airfield_result_failed: "Old airfield ledger failed"
  fallout_old_airfield_result_failed_desc: "The first airfield result damaged the route and left the surviving air base short of safe traffic."
  fallout_old_airfield_callback_success: "Old airfield route established"
  fallout_old_airfield_callback_success_desc: "The delayed route review turned the airfield branch into a durable memory for later Fallout decisions."
  fallout_old_airfield_callback_partial: "Old airfield route uneven"
  fallout_old_airfield_callback_partial_desc: "The delayed route review preserved a narrow service with unreliable landings and local conditions."
  fallout_old_airfield_callback_failed: "Old airfield route grounded"
  fallout_old_airfield_callback_failed_desc: "The delayed route review closed the air service after it failed to carry its obligations."
