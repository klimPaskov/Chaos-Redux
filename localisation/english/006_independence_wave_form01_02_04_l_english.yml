independence_wave_form0124_membership_category: "The Founding Ballot"
independence_wave_form0124_membership_category_desc: "A founding invitation names one carrier and one charter proposal. Full integration places the certified national compact under that carrier. Sovereign membership preserves the country, its national institutions, and its government while establishing reciprocal guarantees and military access."
independence_wave_form01_congress_category: "The Congress Secretariat"
independence_wave_form01_congress_category_desc: "Congress Cohesion: §Y[?independence_wave_form01_congress_cohesion|0]§! / [?constant:independence_wave_form0124_value.maximum|0]\nCommon Defence: §Y[?independence_wave_form01_common_defence|0]§! / [?constant:independence_wave_form0124_value.maximum|0]\nRotating Sessions Held: §Y[?independence_wave_form01_rotating_sessions|0]§! / [?constant:independence_wave_form0124_progress.first_stage_sessions|0]\n\nThe Congress joins national councils while each people retains its own nationhood. Both public values must reach §Y[?constant:independence_wave_form0124_value.integrated|0]§!, three capitals must host sessions, and the language and defence settlements must be completed before the first compact can be ratified."
independence_wave_form02_union_category: "The Maritime Board"
independence_wave_form02_union_category_desc: "Shipping Integration: §Y[?independence_wave_form02_shipping_integration|0]§! / [?constant:independence_wave_form0124_value.maximum|0]\nCollective Security: §Y[?independence_wave_form02_collective_security|0]§! / [?constant:independence_wave_form0124_value.maximum|0]\n\nThe Union lives along convoy lanes rather than a continuous frontier. Both values must reach §Y[?constant:independence_wave_form0124_value.integrated|0]§!, and the port-signal and air-warning settlements must be completed before the first maritime board can be ratified."
independence_wave_form04_league_category: "The Public Peace Directorate"
independence_wave_form04_league_category_desc: "Corridor Governance: §Y[?independence_wave_form04_corridor_governance|0]§! / [?constant:independence_wave_form0124_value.maximum|0]\nMember Confidence: §Y[?independence_wave_form04_member_confidence|0]§! / [?constant:independence_wave_form0124_value.maximum|0]\n\nThe League is a negotiated river compact between the Rhineland and Saar authorities. Both values must reach §Y[?constant:independence_wave_form0124_value.integrated|0]§!, and the customs and public-peace settlements must be completed before the Koblenz charter can be ratified."

independence_wave_form0124_authorize_full_integration: "Entrust the Whole Compact"
independence_wave_form0124_authorize_full_integration_desc: "Accept the recorded proposal from §Y[?independence_wave_formable_inviting_carrier.GetNameDef]§! and authorize the congress to transfer our certified compact territory and its administration if the founding vote succeeds. No territory outside the compact is included."
independence_wave_form0124_authorize_full_integration_effect_tt: "We consent to §Yfull integration§! in [GetIndependenceWaveSelectedFormableName]. Only the certified compact states controlled at commitment may transfer."
independence_wave_form0124_authorize_autonomous_membership: "Sign as a Sovereign Council"
independence_wave_form0124_authorize_autonomous_membership_desc: "Accept the recorded proposal from §Y[?independence_wave_formable_inviting_carrier.GetNameDef]§! without dissolving our state. We will keep our government, territory, institutions, and leaders while accepting reciprocal guarantees, access, and congress obligations."
independence_wave_form0124_authorize_autonomous_membership_effect_tt: "We consent as an §Yautonomous sovereign member§! of [GetIndependenceWaveSelectedFormableName]."
independence_wave_form0124_withhold_membership: "Keep the Chair Empty"
independence_wave_form0124_withhold_membership_desc: "Decline the recorded proposal from §Y[?independence_wave_formable_inviting_carrier.GetNameDef]§!. The congress may proceed only if its own founding minimum remains satisfied without us."
independence_wave_form0124_withhold_membership_effect_tt: "Our delegation records formal opposition to the current founding proposal."
independence_wave_form0124_administrative_diplomatic_cost: "Requires and consumes §Y20 Command Power§!, §Y5,000 Manpower§!, and §Y10 Convoys§! or §Y10 Trains§!. Requires [?constant:independence_wave_decision_cost.civilian_factory_light|0] spare civilian factory."
independence_wave_form0124_administrative_diplomatic_cost_tooltip: "Requires and consumes §Y20 Command Power§!, §Y5,000 Manpower§!, and §Y10 Convoys§! or §Y10 Trains§!. Requires [?constant:independence_wave_decision_cost.civilian_factory_light|0] spare civilian factory."
independence_wave_form0124_administrative_diplomatic_cost_blocked: "Unavailable: requires and consumes §Y20 Command Power§!, §Y5,000 Manpower§!, and §Y10 Convoys§! or §Y10 Trains§!, and requires [?constant:independence_wave_decision_cost.civilian_factory_light|0] spare civilian factory."

independence_wave_form01_complete_first_integration_session: "Deadline: Seat the First Congress"
independence_wave_form01_complete_first_integration_session_desc: "The founding councils have two years to establish language guarantees, a common maritime defence, and three genuinely rotating sessions. Missing the deadline will damage both the Congress and the carrier's statehood ledger."
independence_wave_form01_rotate_congress_session: "Carry the Congress to Another Capital"
independence_wave_form01_rotate_congress_session_desc: "Move the secretariat, translation staff, guards, and archives to another member capital. A rotating session costs administrative and shipping capacity while keeping the Congress shared among its members."
independence_wave_form01_enact_language_guarantees: "Enact the National-Language Guarantees"
independence_wave_form01_enact_language_guarantees_desc: "Protect each member council's public language, schools, and correspondence while funding a multilingual congress service. The arrangement gains legitimacy at the cost of a larger civil administration."
independence_wave_form01_coordinate_maritime_defence: "Coordinate the Western Approaches"
independence_wave_form01_coordinate_maritime_defence_desc: "Commit trained personnel, rifles, support equipment, and coastal staff to a shared warning and convoy-defence plan. Each member remains in command of its own armed forces."
independence_wave_form01_ratify_celtic_compact: "Seal the First Congress Compact"
independence_wave_form01_ratify_celtic_compact_desc: "Ratify the language, defence, and rotating-session settlements as the Congress's first binding compact. Every first-stage obligation must already be complete before formation can be ratified."
independence_wave_form01_reconvene_integration_session: "Reconvene the Dispersed Delegations"
independence_wave_form01_reconvene_integration_session_desc: "Spend political credibility, shipping capacity, and war readiness to reopen a failed integration session for another two-year term."

independence_wave_form02_complete_first_maritime_board: "Deadline: Commission the Maritime Board"
independence_wave_form02_complete_first_maritime_board_desc: "The Union has two years to chart its convoy network, standardize port signals, and establish an air-warning chain. Missing the deadline will expose the distance between its members."
independence_wave_form02_chart_convoy_routes: "Chart the Western Lifeline"
independence_wave_form02_chart_convoy_routes_desc: "Dispatch surveyors and convoy officers across the member ports. The resulting schedules must serve both the western Atlantic member and the eastern island network."
independence_wave_form02_standardize_port_signals: "Publish the Common Port Book"
independence_wave_form02_standardize_port_signals_desc: "Unify pilotage marks, distress codes, manifests, and repair priorities without replacing the member port authorities that must enforce them."
independence_wave_form02_build_air_warning_chain: "Link the Ocean Air Posts"
independence_wave_form02_build_air_warning_chain_desc: "Commit trained crews and equipment to a shared reporting chain over the sea lanes. Its value lies in continuous coverage, while aircraft and units remain committed to their owners."
independence_wave_form02_ratify_maritime_board: "Ratify the First Maritime Board"
independence_wave_form02_ratify_maritime_board_desc: "Convert the provisional shipping schedules and defence posts into a permanent board answerable to every participating government."
independence_wave_form02_reconvene_maritime_board: "Recall the Port Delegations"
independence_wave_form02_reconvene_maritime_board_desc: "Accept another political and logistical commitment to reopen a failed maritime-board term for two more years."

independence_wave_form04_complete_first_league_session: "Deadline: Establish the Public Peace"
independence_wave_form04_complete_first_league_session_desc: "The founders have two years to clear internal tolls, establish a public-peace court, and coordinate corridor security. Missing the deadline will revive fears that the League is only another imposed Rhine project."
independence_wave_form04_clear_internal_tolls: "Clear the Internal Toll Books"
independence_wave_form04_clear_internal_tolls_desc: "Reconcile customs staff, railway accounts, and river dues between the Rhineland and Moselland. No uncertified Rhine territory enters the settlement."
independence_wave_form04_establish_public_peace_court: "Establish the Public Peace Court"
independence_wave_form04_establish_public_peace_court_desc: "Give a joint civilian court authority over member disputes and the protection of the corridor. Its legitimacy depends on consent rather than the memory of any one separatist movement."
independence_wave_form04_coordinate_corridor_security: "Coordinate the River Watch"
independence_wave_form04_coordinate_corridor_security_desc: "Commit personnel, rifles, support equipment, and command experience to defend the two certified founder states without manufacturing claims on Hesse, Westphalia, Alsace-Lorraine, or the Palatinate."
independence_wave_form04_ratify_rhenish_charter: "Ratify the Koblenz Charter"
independence_wave_form04_ratify_rhenish_charter_desc: "Bind the customs, court, and security settlements into the League's first public charter. The charter draws on a tradition of negotiated public peace and establishes a modern League."
independence_wave_form04_reconvene_league_session: "Recall the River Delegates"
independence_wave_form04_reconvene_league_session_desc: "Spend political credibility, rail and convoy capacity, and war readiness to reopen the failed charter term."

independence_wave_form01_provisional_congress: "An Unseated Congress"
independence_wave_form01_provisional_congress_desc: "The national councils have accepted a common name, but the archives, language service, and defence obligations still follow separate rules."
independence_wave_form01_coordinated_congress: "The Rotating Congress"
independence_wave_form01_coordinated_congress_desc: "Delegations and defence staffs can work across member capitals without turning the Congress into a unitary state."
independence_wave_form01_integrated_congress: "The Congress Compact"
independence_wave_form01_integrated_congress_desc: "Language guarantees, rotating sessions, and maritime defence have become durable institutions shared by the consenting councils."
independence_wave_form02_provisional_union: "An Uncharted Union"
independence_wave_form02_provisional_union_desc: "The member ports share a flag, but schedules, warnings, and repair priorities still break at every sea crossing."
independence_wave_form02_coordinated_union: "The Maritime Coordination Board"
independence_wave_form02_coordinated_union_desc: "Common manifests and warning reports allow the scattered members to behave as one maritime system."
independence_wave_form02_integrated_union: "The Oceanic Defence Union"
independence_wave_form02_integrated_union_desc: "The western lifeline and eastern island network now share stable civilian and defensive institutions."
independence_wave_form04_provisional_league: "A Provisional River League"
independence_wave_form04_provisional_league_desc: "The founders have revived a league name, but tolls, courts, and guards still answer to separate authorities."
independence_wave_form04_coordinated_league: "The Public Peace Administration"
independence_wave_form04_coordinated_league_desc: "Joint civil rules and corridor works are beginning to displace customs rivalry and improvised security."
independence_wave_form04_integrated_league: "The Rhenish Public Peace"
independence_wave_form04_integrated_league_desc: "The certified Rhine corridor is governed through a ratified civil compact and defended without automatic claims beyond its founders."
independence_wave_form01_autonomous_congress_member: "Sovereign Congress Council"
independence_wave_form01_autonomous_congress_member_desc: "This country retained its state and national institutions while accepting the Congress's language and defence obligations."
independence_wave_form02_autonomous_union_member: "Sovereign Maritime Member"
independence_wave_form02_autonomous_union_member_desc: "This country retained its government while joining the Union's convoy, access, and mutual-guarantee network."
independence_wave_form04_autonomous_league_member: "Sovereign League Member"
independence_wave_form04_autonomous_league_member_desc: "This founder retained its state while accepting the League's public-peace, access, and mutual-guarantee compact."

chaosx.nr6.320.t: "The Congress Has No Permanent Door"
chaosx.nr6.320.d: "The first delegates arrive with their own clerks, guards, languages, and instructions. No city can claim the Congress as a possession: its authority will travel with the councils that sustain it. The opening calendar must nevertheless decide whether civil procedure or common defence receives the first scarce staff."
chaosx.nr6.320.a: "Open with the rotating civil session."
chaosx.nr6.320.b: "Open with the maritime defence committee."
chaosx.nr6.321.t: "A Compact Carried Between Capitals"
chaosx.nr6.321.d: "The archives have crossed the sea and the border more than once. Language guarantees survive each move, and the defence offices can now pass warnings without asking which capital is hosting the next session. The Congress has become an institution because no single member owns it."
chaosx.nr6.321.a: "Seal the common book."
chaosx.nr6.321.a.tt: "The Celtic Congress has completed every first-stage integration obligation."
chaosx.nr6.322.t: "The Delegations Drift Apart"
chaosx.nr6.322.d: "The first term ends without a complete compact. Untranslated files accumulate, defence schedules diverge, and member capitals accuse the secretariat of favoring whichever shore held the last meeting. Recalling the councils will require a visible sacrifice."
chaosx.nr6.322.a: "Spend stability to restore the civil calendar."
chaosx.nr6.322.b: "Spend war support to restore the defence calendar."

chaosx.nr6.330.t: "An Ocean Between Every Signature"
chaosx.nr6.330.d: "The Union's founding paper crosses more water than land. A delayed convoy can silence a ministry. A broken radio chain can leave an entire member outside the common warning picture. The first board must choose whether to chart civilian movement or defensive reporting before attempting both."
chaosx.nr6.330.a: "Chart the western lifeline first."
chaosx.nr6.330.b: "Link the warning posts first."
chaosx.nr6.331.t: "The Maritime Board Reports as One"
chaosx.nr6.331.d: "Pilots read the same port book, convoy officers exchange the same schedules, and the air posts recognize one another's warnings. Distance remains the Union's defining fact, but it is no longer an excuse for administrative silence."
chaosx.nr6.331.a: "Enter the board in every harbor ledger."
chaosx.nr6.331.a.tt: "The North Atlantic Union has completed every first-stage integration obligation."
chaosx.nr6.332.t: "The Sea Lanes Outrun the Board"
chaosx.nr6.332.d: "The first term expires with gaps in the route book and the warning chain. Members begin keeping private schedules again. A second board can recover the network, but only if the carrier admits that distance cannot be governed by proclamation."
chaosx.nr6.332.a: "Spend stability on the civilian route book."
chaosx.nr6.332.b: "Spend war support on the defence net."

chaosx.nr6.340.t: "Public Peace on a Contested River"
chaosx.nr6.340.d: "The League inherits no uncontested constitutional line. Medieval city alliances, modern separatism, foreign pressure, and local resistance all cast different shadows over its name. The founders can answer only through present consent: clear rules for commerce, courts, and defence across the two certified states."
chaosx.nr6.340.a: "Begin with the corridor administration."
chaosx.nr6.340.b: "Begin with equal founder guarantees."
chaosx.nr6.341.t: "The Koblenz Charter"
chaosx.nr6.341.d: "The toll books close on the same accounting day. The public-peace court hears claims from both founders, and the river watch answers to a civil charter under public law. The League has earned continuity through procedure and shared administration."
chaosx.nr6.341.a: "Publish the charter along the river."
chaosx.nr6.341.a.tt: "The Rhenish League has completed every first-stage integration obligation."
chaosx.nr6.342.t: "The River Keeps Separate Books"
chaosx.nr6.342.d: "The first charter term expires before customs, courts, and security can be reconciled. Every delay revives suspicion that one founder means to dominate the other, or that Germany still writes the real rules beyond the checkpoints. A renewed session will demand an open sacrifice."
chaosx.nr6.342.a: "Spend stability to repair the civil settlement."
chaosx.nr6.342.b: "Spend war support to repair founder confidence."
