chaosx.nr6.73.t: "No Banner Rises"
chaosx.nr6.73.waiting.d: "The previous independence wave is still awaiting replies from the new governments and their neighbors. Another wave must wait until those talks have ended."
chaosx.nr6.73.incomplete.d: "Several territories have changed hands, but the proposed governments could not all take office. Their borders and administrations remain unsettled."
chaosx.nr6.73.d: "The proposed territories could not form a complete group of independent governments. The wave has been called off, and their existing authorities retain control."
chaosx.nr6.73.a: "The declarations must wait."
