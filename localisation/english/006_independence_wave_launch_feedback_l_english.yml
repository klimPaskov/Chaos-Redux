chaosx.nr6.73.t: "No Banner Rises"
chaosx.nr6.73.waiting.d: "The previous independence wave is still awaiting replies from the new governments and their neighbours. Another wave must wait until those talks have ended."
chaosx.nr6.73.incomplete.d: "The declarations could not all be carried through. Some changes remain unfinished, and no new wave has been confirmed. The governments concerned must settle their position before another attempt."
chaosx.nr6.73.d: "No group of territories could establish the proposed governments under the present conditions. No independence wave has been confirmed. The territories remain under their present authorities."
chaosx.nr6.73.a: "The declarations must wait."
