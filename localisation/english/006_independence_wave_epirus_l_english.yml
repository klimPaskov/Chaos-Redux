BBX_independence_wave_epirus_council: "Georgios Christakis-Zografos"
BBX_independence_wave_epirus_council_desc: "Georgios Christakis-Zografos was a Greek politician who headed the Autonomous Republic of Northern Epirus in 1914. In Epirus's provisional assembly, his office coordinates municipal delegates, mountain communities, and border defence."
BBX_independence_wave_spyros_spyromilios: "Spyros Spyromilios"
BBX_independence_wave_spyros_spyromilios_desc: "Spyros Spyromilios was a Greek Gendarmerie officer and guerrilla fighter who served in the Macedonian Struggle and the Balkan Wars. In 1914 he proclaimed the autonomy of Himarë and joined the Northern Epirus autonomist struggle."
