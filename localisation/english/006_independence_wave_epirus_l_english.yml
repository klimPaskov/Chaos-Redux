bbx_divided_epirus_authority: "Divided Epirus Authority"
bbx_divided_epirus_authority_desc: "Municipal delegates, veteran networks, and inherited offices still dispute who may speak for Epirus. Supplies and mountain defence suffer while the compact remains unsettled."
bbx_epirus_compact: "Epirus Compact"
bbx_epirus_compact_desc: "A negotiated civic compact joins the Epirus municipalities to screened mountain formations and gives the new state a durable administrative centre."
bbx_municipal_charter: "Municipal Charter"
bbx_municipal_charter_desc: "A published charter gives municipalities a share of taxation, recognition, and public-service authority while the central government builds capacity."
bbx_mountain_workers_council: "Mountain Workers' Council"
bbx_mountain_workers_council_desc: "Workshops, miners, and railway crews coordinate production and transport through a council answerable to Epirus's municipalities."
bbx_community_autonomy_compact: "Community Autonomy Compact"
bbx_community_autonomy_compact_desc: "Community councils keep local obligations and food routes visible to the central government, improving stability and recruiting power."
bbx_mountain_defence_commission: "Mountain Defence Commission"
bbx_mountain_defence_commission_desc: "A central commission screens armed formations and concentrates scarce equipment on the Epirus approaches."
bbx_patron_pass_compact: "Pass Patron Compact"
bbx_patron_pass_compact_desc: "A negotiated patron relationship opens Ionian port access, rail supplies, and recognition while imposing obligations on the new government."

independence_wave_bbx_epirus_council_category: "Epirus Civic Council"
independence_wave_bbx_epirus_council_category_desc: "The council coordinates municipal rights, veteran networks, mountain defence, and negotiations with [GetIndependenceWaveFormerHostNameDef] while the compact remains fragile.\n\nCivic Mandate: §Y[?independence_wave_bbx_civic_mandate|0]§! / §Y[?constant:independence_wave_epirus_pressure.stable|0]§!\nMountain Defence: §Y[?independence_wave_bbx_mountain_defence|0]§! / §Y[?constant:independence_wave_epirus_pressure.stable|0]§!"
independence_wave_bbx_hold_epirus_council_together: "Hold the Epirus Council Together"
independence_wave_bbx_hold_epirus_council_together_desc: "The first council must keep municipal delegates, railway officials, and mountain veterans inside one provisional authority. Resolve the crisis by installing a government and raising both Civic Mandate and Mountain Defence to §Y[?constant:independence_wave_epirus_pressure.stable|0]§!.\n\nCivic Mandate: §Y[?independence_wave_bbx_civic_mandate|0]§!\nMountain Defence: §Y[?independence_wave_bbx_mountain_defence|0]§!"
independence_wave_bbx_reopen_epirus_depots: "Reopen the Epirus Depots"
independence_wave_bbx_reopen_epirus_depots_desc: "Recover stores along the roads through Ioannina and place them under a common register. Administrative capacity and a civilian-factory commitment are required."
independence_wave_bbx_screen_veteran_networks: "Screen the Veteran Networks"
independence_wave_bbx_screen_veteran_networks_desc: "Vetted veterans can strengthen the opening force, but every formation must accept the defence commission before receiving the compact's supplies."
independence_wave_bbx_convene_community_council: "Convene the Community Council"
independence_wave_bbx_convene_community_council_desc: "Bring the region's communities into one council with explicit rights and a shared rail and tax register."
independence_wave_bbx_settle_hellenic_ledgers: "Settle Relations with [GetIndependenceWaveFormerHostNameDef]"
independence_wave_bbx_settle_hellenic_ledgers_desc: "Negotiate borders, property claims, population obligations, and recognition with [GetIndependenceWaveFormerHostNameDef]. The talks cannot continue if war begins."
independence_wave_bbx_ratify_municipal_charter: "Ratify the Municipal Charter"
independence_wave_bbx_ratify_municipal_charter_desc: "Give the municipalities a constitutional voice and make the central government responsible to the Epirus compact."
independence_wave_bbx_convene_mountain_workers: "Convene the Mountain Workers' Council"
independence_wave_bbx_convene_mountain_workers_desc: "Place workshops and railway crews under a council that can meet the army's material demands without dissolving local authority."
independence_wave_bbx_restore_community_autonomy: "Restore Community Autonomy"
independence_wave_bbx_restore_community_autonomy_desc: "Renew local compacts that protect food routes and keep mountain communities supplied through a traditional settlement."
independence_wave_bbx_establish_mountain_commission: "Establish the Mountain Commission"
independence_wave_bbx_establish_mountain_commission_desc: "Put the emergency chain of command above factional units and prepare the compact for a hard border war."
independence_wave_bbx_accept_pass_patron_compact: "Accept the Epirus Pass Compact"
independence_wave_bbx_accept_pass_patron_compact_desc: "Trade a measure of sovereignty for Ionian port access, rail supplies, recognition, and a foreign guarantor's obligations."
independence_wave_bbx_codify_epirus_settlement: "Codify the Epirus Settlement"
independence_wave_bbx_codify_epirus_settlement_desc: "A stable authority, a recognised border, and an integrated mountain force can turn the liberation into a durable state."
independence_wave_bbx_open_ionian_network: "Open the Ionian Network"
independence_wave_bbx_open_ionian_network_desc: "Use the league's channels to exchange supplies, officers, and recognition with other states that survived the wave."

