independence_wave_bbx_emergency_route_effect_tt: "The Mountain Defence Commission takes office. Civic Mandate changes by §R[?constant:independence_wave_epirus_pressure.minor_loss|0]§! and Mountain Defence rises by §G[?constant:independence_wave_epirus_pressure.decisive_gain|0]§!."
