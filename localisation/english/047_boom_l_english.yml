l_english:
chaosx.nr47.1.t: "BOOM!"

chaosx.nr47.2.t: "BOOM!"
chaosx.nr47.2.d: "Our country is reeling after a bombing with the force of an atomic weapon. The blast has destroyed buildings and killed civilians, while investigators search for whoever built the device."
chaosx.nr47.2.a: "Assess the damage."

chaosx.news.50.t: "The Great BOOM!"
chaosx.news.50.d: "[From.GetName] is reeling after a massive explosion destroyed infrastructure and killed civilians. Investigators are searching the ruins for evidence of the device's origin."
chaosx.news.50.a: "The next target is unknown."
