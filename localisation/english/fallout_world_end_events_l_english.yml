air_winter_government_official_democratic: "the emergency minister"
air_winter_government_official_communism: "the district commissar"
air_winter_government_official_fascism: "the appointed prefect"
air_winter_government_official_neutrality: "the emergency commissioner"

chaosx.fallout.1.t: "The Rivers Keep Their Ice"
chaosx.fallout.1.d: "Survey crews in [air_winter_event_state.GetName] have found river ice holding through hours that once brought open water. Rail points seize before dawn, timber cracks in storage yards, and school boilers consume their weekly coal in days. [ROOT.GetAirWinterGovernmentAuthority] must decide whether public timetables will follow the thermometers or the demands of production."
chaosx.fallout.1.a: "Let the thermometers govern the shifts."
chaosx.fallout.1.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§! and §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. A report arrives after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. The thermometer schedule succeeds only if §YAdaptation§! is at least §Y[?constant:air_winter_event_phase_1_return.thermometer_adaptation_minimum|0]§! and §YExposure§! is no higher than §Y[?constant:air_winter_event_phase_1_return.thermometer_exposure_ceiling|0]§!."
chaosx.fallout.1.b: "Keep every production line on schedule."
chaosx.fallout.1.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_minor|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_moderate|%1]§!. A report arrives after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. The full-shift schedule succeeds only if an operational Civilian Factory or Military Factory remains, §YAdaptation§! is at least §Y[?constant:air_winter_event_phase_1_return.full_shift_adaptation_minimum|0]§!, §YExposure§! is no higher than §Y[?constant:air_winter_event_phase_1_return.full_shift_exposure_ceiling|0]§!, §YDisease Pressure§! is no higher than §Y[?constant:air_winter_event_phase_1_return.full_shift_disease_ceiling|0]§!, and §YBuilding Damage Pressure§! is no higher than §Y[?constant:air_winter_event_phase_1_return.full_shift_pressure_ceiling|0]§!."

chaosx.fallout.2.t: "Cold Rain in the Storehouses"
chaosx.fallout.2.d: "Cold rain has crossed the quays of [air_winter_event_state.GetName] for twelve days, soaking grain sacks and bedding without ever turning to clean snow. Dockworkers have begun sleeping beside cargo heaters while families queue beneath warehouse awnings. [ROOT.GetAirWinterGovernmentOfficial] asks whether the dry buildings should shelter people or preserve the port economy."
chaosx.fallout.2.a: "Open the dry warehouses to families."
chaosx.fallout.2.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_moderate|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!, and §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. A report arrives after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. The warehouse rooms succeed only if §YShelter Capacity§! is at least §Y[?constant:air_winter_event_phase_1_return.warehouse_shelter_minimum|0]§! and §YDisease Pressure§! is no higher than §Y[?constant:air_winter_event_phase_1_return.warehouse_disease_ceiling|0]§!."
chaosx.fallout.2.b: "Reserve the coal for the shipyards."
chaosx.fallout.2.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_minor|0]§! and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_moderate|%1]§!. A report arrives after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. The harbor priority succeeds only if an operational Dockyard or Naval Base remains, §YReclamation§! is at least §Y[?constant:air_winter_event_phase_1_return.shipyard_reclamation_minimum|0]§!, and §YExposure§! is no higher than §Y[?constant:air_winter_event_phase_1_return.shipyard_exposure_ceiling|0]§!."

chaosx.fallout.3.t: "Frost Beneath the Cistern Lids"
chaosx.fallout.3.d: "In [air_winter_event_state.GetName], night frost has reached buried pipes that were laid for heat rather than cold. Stone cistern lids split after sunset, and morning queues form around the few mains that still run. [ROOT.GetAirWinterGovernmentAuthority] must choose between early rationing and the public calm kept by open fountains."
chaosx.fallout.3.a: "Ration every cistern before the pipes fail."
chaosx.fallout.3.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_major|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, and §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. A report arrives after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. Cistern rationing succeeds only if §YWater Security§! is at least §Y[?constant:air_winter_event_phase_1_return.cistern_water_minimum|0]§! and §YDisease Pressure§! is no higher than §Y[?constant:air_winter_event_phase_1_return.cistern_disease_ceiling|0]§!."
chaosx.fallout.3.b: "Keep the fountains and markets open."
chaosx.fallout.3.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! falls by §R[?constant:air_winter_event_ledger.water_moderate|0]§! and §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_moderate|%1]§!. A report arrives after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. The public fountain circuit succeeds only if §YWater Security§! is at least §Y[?constant:air_winter_event_phase_1_return.fountain_water_minimum|0]§! and §YDisease Pressure§! is no higher than §Y[?constant:air_winter_event_phase_1_return.fountain_disease_ceiling|0]§!."

chaosx.fallout.4.t: "Rain That Chills the Rice"
chaosx.fallout.4.d: "Rain still falls over [air_winter_event_state.GetName], yet the flooded fields no longer hold warmth after sunset. Seedlings yellow in standing water while woven walls stay wet for days, sending families toward schools with concrete floors. [ROOT.GetAirWinterGovernmentOfficial] can direct labor to the drains or turn public buildings into crowded dry rooms."
chaosx.fallout.4.a: "Cut drainage channels through the fields."
chaosx.fallout.4.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_moderate|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. We lose §R[?constant:air_winter_event_country.manpower_moderate|0]§! available Manpower. A report arrives after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. Field drainage succeeds only if §YFood Reserve§! is at least §Y[?constant:air_winter_event_phase_1_return.drainage_food_minimum|0]§! and §YBuilding Damage Pressure§! is no higher than §Y[?constant:air_winter_event_phase_1_return.drainage_pressure_ceiling|0]§!."
chaosx.fallout.4.b: "Move families into the schools."
chaosx.fallout.4.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_major|0]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!, and §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_minor|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!. A report arrives after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. The school shelters succeed only if §YShelter Capacity§! is at least §Y[?constant:air_winter_event_phase_1_return.school_shelter_minimum|0]§! and §YDisease Pressure§! is no higher than §Y[?constant:air_winter_event_phase_1_return.school_disease_ceiling|0]§!."

chaosx.fallout.5.t: "White Markers Above the Pass"
chaosx.fallout.5.d: "Snow has erased the road edges above [air_winter_event_state.GetName], where drifts hide culverts and old ice carries ash from distant fires. Road crews ask for poles, rope, and guarded fuel so they can keep a marked corridor open. [ROOT.GetAirWinterGovernmentAuthority] may sustain that exposed line or recall the crews to heat the settlements below."
chaosx.fallout.5.a: "Mark and guard the corridor."
chaosx.fallout.5.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!, and §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_minor|0]§!. We spend §R[?constant:air_winter_event_country.command_power_minor|0]§! Command Power. A report arrives after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. The marked corridor succeeds only if an operational Infrastructure route or Railway remains, §YAdaptation§! is at least §Y[?constant:air_winter_event_phase_1_return.marker_adaptation_minimum|0]§!, §YReclamation§! is at least §Y[?constant:air_winter_event_phase_1_return.marker_reclamation_minimum|0]§!, and §YExposure§! is no higher than §Y[?constant:air_winter_event_phase_1_return.marker_exposure_ceiling|0]§!."
chaosx.fallout.5.b: "Recall the crews before the next storm."
chaosx.fallout.5.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_moderate|0]§!, §YAdaptation§! falls by §R[?constant:air_winter_event_ledger.adaptation_minor|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!. A report arrives after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. The recalled crews succeed only if §YShelter Capacity§! is at least §Y[?constant:air_winter_event_phase_1_return.recall_shelter_minimum|0]§!, §YAdaptation§! is at least §Y[?constant:air_winter_event_phase_1_return.recall_adaptation_minimum|0]§!, and §YBuilding Damage Pressure§! is no higher than §Y[?constant:air_winter_event_phase_1_return.recall_pressure_ceiling|0]§!."

chaosx.fallout.6.thermometer_success.t: "The Mercury Sets the Bell"
chaosx.fallout.6.thermometer_success.d: "Weather stations across [air_winter_event_state.GetName] now relay one pre-dawn reading to depot yards, school boilers, and shift halls. Workers reach heated entrances after the bells move with the temperature, and exposed queues no longer gather in the dark. The synchronized station schedule is presented to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.thermometer_success.a: "Keep the station bells on this schedule."
chaosx.fallout.6.thermometer_success.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§! and §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_minor|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark the thermometer schedule as a success."
chaosx.fallout.6.thermometer_failure.t: "The Timetable Froze at Dawn"
chaosx.fallout.6.thermometer_failure.d: "Weather stations across [air_winter_event_state.GetName] issued conflicting readings as frost shifted between the depots and outlying settlements. Late bells left work queues standing in the cold, and several shift halls opened after workers had already turned home. The exposed-worker rolls and contradictory station times are submitted to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.thermometer_failure.a: "Count the missed shifts and exposed queues."
chaosx.fallout.6.thermometer_failure.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! falls by §R[?constant:air_winter_event_ledger.adaptation_minor|0]§! and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark the thermometer schedule as a failure."

chaosx.fallout.6.full_shift_success.t: "Warm Steel Before Dawn"
chaosx.fallout.6.full_shift_success.d: "Maintenance foremen in [air_winter_event_state.GetName] kept bearings warm and divided the night shift between production and repair benches. The machine halls turned out belts, couplings, and pump fittings that local crews used to keep damaged services working. The spare-parts account for the reclamation crews is presented to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.full_shift_success.a: "Send the spare parts to the repair crews."
chaosx.fallout.6.full_shift_success.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§! and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_minor|%1]§!. The state and national winter records mark the full-shift schedule as a success."
chaosx.fallout.6.full_shift_failure.t: "The Night Shift Breaks"
chaosx.fallout.6.full_shift_failure.d: "Unheated machine halls in [air_winter_event_state.GetName] iced over around the night shift, seizing cranes and throwing workers into cold aisles. Factory infirmaries filled with exposure and fever cases, and the production gates closed after the casualty teams arrived. After [ROOT.GetAirWinterGovernmentOfficial] delivers the casualty roll, [ROOT.GetAirWinterGovernmentAuthority] orders the halls closed until access can be made safe."
chaosx.fallout.6.full_shift_failure.a: "Close the halls and count the dead."
chaosx.fallout.6.full_shift_failure.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_major|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.phase_1_minor_failure_percent|%3]§! of the current state civilian population and enter the Deaths ledger. Local factory access receives a §R[?constant:air_winter_event_phase_1_return.factory_access_penalty|%0]§! penalty for §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark the full-shift schedule as a failure with casualties."

chaosx.fallout.6.warehouse_success.t: "Dry Rooms Behind the Quays"
chaosx.fallout.6.warehouse_success.d: "Warehouse wardens in [air_winter_event_state.GetName] partitioned the dry upper floors, raised sleeping platforms, and opened washing points beside the quays. Displaced families have left the dripping awnings for rooms where bedding and food stores can be kept apart. The new shelter register is submitted to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.warehouse_success.a: "Keep the upper floors under shelter rules."
chaosx.fallout.6.warehouse_success.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_minor|0]§!, and §YRefugee Pressure§! falls by §G[?constant:air_winter_event_ledger.refugees_minor|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark the warehouse rooms as a success."
chaosx.fallout.6.warehouse_failure.t: "Bedding Beneath the Drip"
chaosx.fallout.6.warehouse_failure.d: "Condensation ran down the warehouse walls in [air_winter_event_state.GetName], soaking the bedding laid beneath cargo rafters and fouling the shared washing tubs. Warehouse wardens emptied the rooms as cough and fever spread, sending families back toward the crowded waterfront shelters. The failed occupancy count is brought to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.warehouse_failure.a: "Clear the wet rooms and move the families."
chaosx.fallout.6.warehouse_failure.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark the warehouse rooms as a failure."

chaosx.fallout.6.shipyard_success.t: "Coal Fires Along the Quays"
chaosx.fallout.6.shipyard_success.d: "Harbor crews in [air_winter_event_state.GetName] kept pumps, cranes, and repair sheds working through the cold coal allotment. Repaired fishing boats and coastal freight craft returned with food while naval workshops supplied fittings for damaged local services. The reopening of the harbor circuit is reported to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.shipyard_success.a: "Keep the harbor repair fires lit."
chaosx.fallout.6.shipyard_success.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_minor|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_minor|%1]§!. The state and national winter records mark the harbor priority as a success."
chaosx.fallout.6.shipyard_failure.t: "Cold Iron in the Harbor"
chaosx.fallout.6.shipyard_failure.d: "The coal allotment in [air_winter_event_state.GetName] could not keep harbor pumps and cargo gear working through the cold. Dock laborers remained exposed beside stalled loads, small craft stayed at their berths, and the casualty crews closed the most dangerous piers. The lost-cargo and casualty rolls are delivered to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.shipyard_failure.a: "Close the cold piers and count the missing cargo."
chaosx.fallout.6.shipyard_failure.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_major|0]§! and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.phase_1_minor_failure_percent|%3]§! of the current state civilian population and enter the Deaths ledger. Local supply receives a §R[?constant:air_winter_event_phase_1_return.supply_penalty|%0]§! penalty for §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. National War Support falls by §R[?constant:air_winter_event_country.war_support_minor|%1]§!. The state and national winter records mark the harbor priority as a failure with casualties."

chaosx.fallout.6.cistern_success.t: "The Cistern Keys Hold"
chaosx.fallout.6.cistern_success.d: "Water boards in [air_winter_event_state.GetName] rotated the cistern keys by district while masonry crews sealed frost cracks under canvas and charcoal braziers. Clean stores lasted through the queue, and repaired valves returned part of the local water circuit to use. The water board's certified levels are carried to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.cistern_success.a: "Keep the keys with the water boards."
chaosx.fallout.6.cistern_success.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_minor|0]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_minor|0]§!, and §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark cistern rationing as a success."
chaosx.fallout.6.cistern_failure.t: "The Cistern Queue Breaks"
chaosx.fallout.6.cistern_failure.d: "The district key schedule in [air_winter_event_state.GetName] broke down after cracked cisterns leaked into dusty courtyards and several stores were found fouled. Families crowded the remaining mains until water boards abandoned the rotation and opened emergency collection points. The failed ration order is brought to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.cistern_failure.a: "Seal the fouled stores and disperse the queue."
chaosx.fallout.6.cistern_failure.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! falls by §R[?constant:air_winter_event_ledger.water_minor|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark cistern rationing as a failure."

chaosx.fallout.6.fountain_success.t: "Water Under the Market Lamps"
chaosx.fallout.6.fountain_success.d: "Plumbers in [air_winter_event_state.GetName] preserved a narrow public-water circuit through the market fountains and kept the queues under lamp-lit ward patrols. Working valves restored water to the stalls and nearby workshops, while medical stations continued to watch the contained wards. The working circuit is confirmed to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.fountain_success.a: "Keep the public circuit under watch."
chaosx.fallout.6.fountain_success.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_minor|0]§! and §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark the public fountain circuit as a success."
chaosx.fallout.6.fountain_failure.t: "Ice in the Public Fountains"
chaosx.fallout.6.fountain_failure.d: "Burst mains beneath the market streets of [air_winter_event_state.GetName] fed dirty water into fountain basins that froze around the queues. Shoppers and stallkeepers carried sickness into crowded shelters, while exposed repair crews searched for stop valves under the ice. The casualty roll and closure order are presented to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.fountain_failure.a: "Shut the mains and clear the market streets."
chaosx.fallout.6.fountain_failure.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! falls by §R[?constant:air_winter_event_ledger.water_moderate|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_major|0]§!, and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.phase_1_minor_failure_percent|%3]§! of the current state civilian population and enter the Deaths ledger. Local supply receives a §R[?constant:air_winter_event_phase_1_return.supply_penalty|%0]§! penalty for §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!. The state and national winter records mark the public fountain circuit as a failure with casualties."

chaosx.fallout.6.drainage_success.t: "Channels Through the Flooded Fields"
chaosx.fallout.6.drainage_success.d: "Field councils in [air_winter_event_state.GetName] reopened shallow ditches and shored the culverts that carry cold rain away from the planting beds. Seedlings survived on the higher rows, and cart paths stayed firm enough for food and repair crews to cross. The restored acreage is presented to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.drainage_success.a: "Protect the open channels through the planting."
chaosx.fallout.6.drainage_success.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_minor|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark field drainage as a success."
chaosx.fallout.6.drainage_failure.t: "The Cold Rain Stays in the Fields"
chaosx.fallout.6.drainage_failure.d: "Drainage cuts in [air_winter_event_state.GetName] slumped shut under cold rain, leaving water across the planting beds and access tracks. Seedlings rotted in the flooded soil, blocked carts left tools and seed beyond reach, and fever spread among the field crews. The casualty and crop-loss count is delivered to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.drainage_failure.a: "Recover what seed and tools remain."
chaosx.fallout.6.drainage_failure.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_moderate|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.phase_1_minor_failure_percent|%3]§! of the current state civilian population and enter the Deaths ledger. Local supply receives a §R[?constant:air_winter_event_phase_1_return.supply_penalty|%0]§! penalty for §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark field drainage as a failure with casualties."

chaosx.fallout.6.school_success.t: "Dry Floors Behind the School Doors"
chaosx.fallout.6.school_success.d: "School boards in [air_winter_event_state.GetName] raised sleeping decks above the wet floors and separated dry kitchens from screened sick bays. Families settled into classrooms without crowding the corridors, and teachers kept the shelter rota moving between meals and lessons. The school wards are certified to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.school_success.a: "Keep the school shelters under board control."
chaosx.fallout.6.school_success.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, and §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_minor|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark the school shelters as a success."
chaosx.fallout.6.school_failure.t: "Fever in the Classrooms"
chaosx.fallout.6.school_failure.d: "Wet floors and crowded classrooms in [air_winter_event_state.GetName] turned the school shelters into fever wards within days. School boards evacuated the buildings as bedding soured, sick families filled the corridors, and the remaining dry rooms lost their separation. The casualty and closure count is submitted to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.school_failure.a: "Empty the classrooms and open cleaner wards."
chaosx.fallout.6.school_failure.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_major|0]§!, and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.phase_1_minor_failure_percent|%3]§! of the current state civilian population and enter the Deaths ledger. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark the school shelters as a failure with casualties."

chaosx.fallout.6.marker_success.t: "White Poles Through the Pass"
chaosx.fallout.6.marker_success.d: "Road wardens in [air_winter_event_state.GetName] planted tall white poles above the drifts and stocked fuel, rope, and lamps at each dangerous bend. Signed waybills show supply convoys crossing the pass without losing the marked line, giving repair crews a dependable route into isolated settlements. The convoy record is presented to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.marker_success.a: "Keep the poles, caches, and convoy books in service."
chaosx.fallout.6.marker_success.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!, and §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_minor|0]§!. Local supply receives a §G[?constant:air_winter_event_phase_1_return.supply_bonus|%0]§! benefit for §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_minor|%1]§!. The state and national winter records mark the corridor as a success."
chaosx.fallout.6.marker_failure.t: "Beyond the Last White Marker"
chaosx.fallout.6.marker_failure.d: "Fog and fresh snow in [air_winter_event_state.GetName] erased the road beyond the last white pole, where a hidden culvert pulled a convoy away from the marked line. Rescue parties found scattered cargo and exposed survivors, while displaced households descended toward already crowded settlements. The severe casualty roll is brought to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.marker_failure.a: "Search beyond the last marker."
chaosx.fallout.6.marker_failure.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_severe|0]§!, §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!, and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.phase_1_severe_failure_percent|%3]§! of the current state civilian population and enter the Deaths ledger. Local supply receives a §R[?constant:air_winter_event_phase_1_return.supply_penalty|%0]§! penalty for §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. National War Support falls by §R[?constant:air_winter_event_country.war_support_minor|%1]§!. The state and national winter records mark the corridor as a failure with casualties."

chaosx.fallout.6.recall_success.t: "Warm Rooms Below the Pass"
chaosx.fallout.6.recall_success.d: "Road crews recalled to the lower settlements of [air_winter_event_state.GetName] used their rope, fuel, and timber to weatherproof roofs and warm communal rooms. Repair teams cleared cracked gutters and reinforced the weakest shelter walls, leaving fewer families exposed to the next cold night. The completed shelter list is presented to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.recall_success.a: "Keep the crews in the lower settlements."
chaosx.fallout.6.recall_success.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_minor|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark the recalled crews as a success."
chaosx.fallout.6.recall_failure.t: "The Crews Came Down Too Soon"
chaosx.fallout.6.recall_failure.d: "With the road crews withdrawn, outlying households in [air_winter_event_state.GetName] reached the unmarked pass without fuel caches or guides. Families arrived soaked and exposed at the lower settlements, overwhelming the smaller shelter network and forcing many into unheated store rooms. The casualty and displacement count is delivered to [ROOT.GetAirWinterGovernmentAuthority] by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.6.recall_failure.a: "Open every remaining room to the arrivals."
chaosx.fallout.6.recall_failure.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!, and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.phase_1_minor_failure_percent|%3]§! of the current state civilian population and enter the Deaths ledger. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. The state and national winter records mark the recalled crews as a failure with casualties."

chaosx.fallout.10.t: "The Seed Ledger"
chaosx.fallout.10.d: "Threshing returns from [air_winter_event_state.GetName] show grain with hollow kernels and roots killed close to the surface. Village councils have opened the seed ledgers and found enough stock for one careful spring, one winter of bread, or neither if the cold deepens. The decision over what the sealed bins will preserve belongs to [ROOT.GetAirWinterGovernmentAuthority]."
chaosx.fallout.10.a: "Open guarded seed vaults for measured planting."
chaosx.fallout.10.a.tt: "We lose §R[?constant:air_winter_event_country.manpower_major|0]§! available Manpower. In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_severe|0]§! and §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!. Local factory availability receives a §R[?constant:air_winter_event_outcome.seed_vault_factory_penalty|%0]§! penalty through the spring review. A report arrives after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§!. The trial plots flourish only if Reclamation is above §Y[?constant:air_winter_event_outcome.seed_vault_reclamation_threshold|0]§! and Exposure is below §Y[?constant:air_winter_event_outcome.seed_vault_exposure_ceiling|0]§!."
chaosx.fallout.10.b: "Slaughter the herds while fodder remains."
chaosx.fallout.10.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_emergency|0]§! and §YAdaptation§! falls by §R[?constant:air_winter_event_ledger.adaptation_moderate|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_minor|%1]§!. After §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§!, the depleted herds lower Food Reserve by §R[?constant:air_winter_event_ledger.food_major|0]§! and Reclamation by §R[?constant:air_winter_event_ledger.reclamation_minor|0]§!, while Disease Pressure rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!."
chaosx.fallout.10.c: "Protect breeding stock and endure the ration."
chaosx.fallout.10.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_moderate|0]§! and §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_major|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!. A report arrives after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§!. The breeding herds survive only if Food Reserve is above §Y[?constant:air_winter_event_outcome.breeding_food_threshold|0]§! and Shelter Capacity is above §Y[?constant:air_winter_event_outcome.breeding_shelter_threshold|0]§!."

chaosx.fallout.18.t: "The Spring Ledger"
chaosx.fallout.18.vault_success.d: "The guarded plots in [air_winter_event_state.GetName] have broken the frost in narrow green rows. Agronomists marked each viable bed before village delegates received measured sacks from the sealed bins. The planting register gives [ROOT.GetAirWinterGovernmentOfficial] a reserve that can carry viable seed beyond one season."
chaosx.fallout.18.vault_failure.d: "The guarded plots in [air_winter_event_state.GetName] opened with grey shoots and soft roots. Cold soil killed one variety after another, while damp entered two storage rooms through cracked masonry. Orders from [ROOT.GetAirWinterGovernmentOfficial] send the failed beds to the fire and every surviving bin back to the scales."
chaosx.fallout.18.herds.d: "The slaughter stores in [air_winter_event_state.GetName] are issuing their last salted carcasses. Empty byres serve as fever wards, hides rot faster than the workshops can cure them, and there will be no spring herd to feed the outer settlements. The shortage postponed by the winter ration rests with [ROOT.GetAirWinterGovernmentAuthority]."
chaosx.fallout.18.breeding_success.d: "Calves and lambs are standing in patched sheds across [air_winter_event_state.GetName]. Fodder teams kept the weakest stock alive, veterinarians separated sick pens, and village committees have agreed on a guarded pasture rota. The spring food plan drafted by [ROOT.GetAirWinterGovernmentOfficial] can treat the registered herds as dependable."
chaosx.fallout.18.breeding_failure.d: "The protected herds in [air_winter_event_state.GetName] entered spring too thin to recover. Pneumonia moved through crowded sheds, feed stores emptied, and several village committees concealed their losses until inspectors opened the pens. Closing the breeding ledger and redirecting the remaining fodder falls to [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.18.a: "Issue seed by plot and keep the reserve sealed."
chaosx.fallout.18.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_major|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, and §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!. The planting register remains part of this state's winter record."
chaosx.fallout.18.b: "Burn the failed beds and seal the dry bins."
chaosx.fallout.18.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_moderate|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_minor|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. The failed plots remain part of this state's winter record."
chaosx.fallout.18.c: "Close the slaughter ledger and ration the last meat."
chaosx.fallout.18.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_major|0]§!, §YReclamation§! falls by §R[?constant:air_winter_event_ledger.reclamation_minor|0]§!, and §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!. The empty herds remain part of this state's winter record."
chaosx.fallout.18.d: "Register the surviving herds for spring pasture."
chaosx.fallout.18.d.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_major|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, and §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!. The registered herds remain part of this state's winter record."
chaosx.fallout.18.e: "Open the empty pens to food crews."
chaosx.fallout.18.e.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_moderate|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YReclamation§! falls by §R[?constant:air_winter_event_ledger.reclamation_minor|0]§!. The failed breeding season remains part of this state's winter record."

chaosx.fallout.11.t: "Ration Books by Ward"
chaosx.fallout.11.d: "The bakeries of [air_winter_event_state.GetName] receive flour on alternating mornings, and queues now cross ward boundaries before the ovens are lit. Household registers are incomplete because displaced families sleep in stations, workshops, and relatives' kitchens. [ROOT.GetAirWinterGovernmentOfficial] needs a ration rule that people can understand and the authorities can enforce."
chaosx.fallout.11.a: "Issue household books and accept the disputes."
chaosx.fallout.11.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_moderate|0]§! and §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!."
chaosx.fallout.11.b: "Feed each ward through staffed kitchens."
chaosx.fallout.11.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_moderate|0]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_moderate|0]§!, and §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§!. We lose §R[?constant:air_winter_event_country.manpower_minor|0]§! available Manpower."
chaosx.fallout.11.c: "Guard the depots and ration by work detail."
chaosx.fallout.11.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_major|0]§! and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§! and War Support rises by §G[?constant:air_winter_event_country.war_support_minor|%1]§!."

chaosx.fallout.12.t: "Boats Under a Leaden Sky"
chaosx.fallout.12.d: "Nearshore catches in [air_winter_event_state.GetName] have collapsed as cold currents push familiar shoals away from the beaches. Small crews can work the sheltered coves with little fuel, while experienced captains insist that food remains beyond the dark water. [ROOT.GetAirWinterGovernmentAuthority] must choose how far the boats may range."
chaosx.fallout.12.a: "Keep the boats within sight of shore."
chaosx.fallout.12.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_moderate|0]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. We lose §R[?constant:air_winter_event_country.manpower_minor|0]§! available Manpower."
chaosx.fallout.12.b: "Send an escorted patrol into deep water."
chaosx.fallout.12.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_severe|0]§!. The patrol reports after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!. Its fate depends on local Adaptation and Exposure."

chaosx.fallout.13.t: "Ice in the District Pumps"
chaosx.fallout.13.desert_city.t: "The Frozen Main and the Ward Cisterns"
chaosx.fallout.13.arid.d: "Cold dust has entered the district pumps of [air_winter_event_state.GetName], where covered wells serve settlements divided by frozen roads. Cistern guards can ration the remaining water, or transport officers can send tank convoys between the isolated pump houses. [ROOT.GetAirWinterGovernmentOfficial] must decide which route receives the working engines."
chaosx.fallout.13.mediterranean.d: "Cold rain runs from the hill reservoirs above [air_winter_event_state.GetName], then freezes where cracked masonry channels enter the station tanks. Covered cisterns can support a strict neighborhood ration, while tank convoys could connect the surviving reservoirs before the roads glaze again. [ROOT.GetAirWinterGovernmentOfficial] must assign the water service."
chaosx.fallout.13.desert_city.d: "A frost-split main has emptied into the service streets of [air_winter_event_state.GetName]. Ward cisterns are falling below their ration marks while railhead tanks and municipal trucks wait for orders beside the broken conduit. [ROOT.GetAirWinterGovernmentAuthority] can place the pipe workshops under a water board, reserve a railway tanker service, or send motor columns to the outer wards."
chaosx.fallout.13.a: "Seal and ration the municipal cisterns."
chaosx.fallout.13.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_major|0]§! and §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!."
chaosx.fallout.13.b: "Assign tank convoys to the frozen mains."
chaosx.fallout.13.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_moderate|0]§!, §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!, and §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!. We spend §R[?constant:air_winter_event_country.command_power_moderate|0]§! Command Power."
chaosx.fallout.13.c: "Place the pipe workshops under a municipal water board."
chaosx.fallout.13.c.tt: "National Stability falls by §R[?constant:air_winter_event_desert_city.municipal_stability_cost|%1]§!. In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_major|0]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. Local factory availability is reduced by §R[?constant:air_winter_event_desert_city.municipal_factory_penalty_magnitude|%0]§! for §Y[?constant:air_winter_event_desert_city.municipal_factory_days|0] days§!. The water ledger returns after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!. Full success requires Water Security of at least §Y[?constant:air_winter_event_desert_city.success_water_minimum|0]§!, Adaptation of at least §Y[?constant:air_winter_event_desert_city.success_adaptation_minimum|0]§!, and Building Damage Pressure no higher than §Y[?constant:air_winter_event_desert_city.success_pressure_ceiling|0]§!."
chaosx.fallout.13.d: "Reserve the railway tankers for a ward water service."
chaosx.fallout.13.d.tt: "This requires an operational Railway in §Y[air_winter_event_state.GetName]§!. We spend §R[?constant:air_winter_event_desert_city.rail_manpower_cost|0]§! Manpower, §R[?constant:air_winter_event_desert_city.rail_train_cost|0]§! Trains, and §R[?constant:air_winter_event_desert_city.rail_fuel_cost|0]§! Fuel. §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_moderate|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_minor|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. The tanker timetable reports after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!. Full success requires a working Railway, Water Security of at least §Y[?constant:air_winter_event_desert_city.success_water_minimum|0]§!, Adaptation of at least §Y[?constant:air_winter_event_desert_city.success_adaptation_minimum|0]§!, and Exposure no higher than §Y[?constant:air_winter_event_desert_city.success_exposure_ceiling|0]§!."
chaosx.fallout.13.e: "Send motor water columns to the outer wards."
chaosx.fallout.13.e.tt: "This requires operational Infrastructure in §Y[air_winter_event_state.GetName]§!. We spend §R[?constant:air_winter_event_desert_city.motor_manpower_cost|0]§! Manpower, §R[?constant:air_winter_event_desert_city.motor_equipment_cost|0]§! Motorized Equipment, §R[?constant:air_winter_event_desert_city.motor_fuel_cost|0]§! Fuel, and §R[?constant:air_winter_event_desert_city.motor_command_cost|0]§! Command Power. §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_moderate|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. The columns report after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!. Full success requires working Infrastructure, Water Security of at least §Y[?constant:air_winter_event_desert_city.success_water_minimum|0]§!, Reclamation of at least §Y[?constant:air_winter_event_desert_city.success_reclamation_minimum|0]§!, and Exposure no higher than §Y[?constant:air_winter_event_desert_city.success_exposure_ceiling|0]§!."

chaosx.fallout.49.municipal_success.t: "The Cistern Wards Hold"
chaosx.fallout.49.municipal_partial.t: "Water by the Bell"
chaosx.fallout.49.municipal_failure.t: "The Main Gives Way"
chaosx.fallout.49.rail_success.t: "Tankers at the Railhead"
chaosx.fallout.49.rail_partial.t: "A Timetable of Thirst"
chaosx.fallout.49.rail_failure.t: "The Sidings Run Dry"
chaosx.fallout.49.motor_success.t: "Columns Through the Cold Dust"
chaosx.fallout.49.motor_partial.t: "Engines at Half Strength"
chaosx.fallout.49.motor_failure.t: "The Road Convoy Breaks"
chaosx.fallout.49.municipal_success.d: "Pipe crews in [air_winter_event_state.GetName] isolated the split mains before dirty runoff reached the ward tanks. Bell schedules now keep covered cisterns open through the coldest hours, and the repaired galleries give municipal crews a route for the next break. [ROOT.GetAirWinterGovernmentOfficial] has signed the cistern rota."
chaosx.fallout.49.municipal_partial.d: "Central cisterns in [air_winter_event_state.GetName] keep their ration hours, but broken feeder pipes have left the outer wards dependent on hand carts and long queues. Several residents and pipe workers died during the coldest deliveries. The water board can preserve the surviving schedule, but it cannot restore every district main."
chaosx.fallout.49.municipal_failure.d: "A second rupture in [air_winter_event_state.GetName] drained the service reservoirs into frozen streets. Crowds pressed against contaminated cisterns while repair workshops lost power and access. [ROOT.GetAirWinterGovernmentAuthority] must close the broken galleries, publish the losses, and ration what remains."
chaosx.fallout.49.rail_success.d: "Heated point crews kept a narrow timetable open from the upland wells into [air_winter_event_state.GetName]. Tank wagons now feed the station reservoirs before each ward queue forms, and repaired hoses let the same trains carry water without wasting a loading turn. [ROOT.GetAirWinterGovernmentOfficial] has approved the winter tanker timetable."
chaosx.fallout.49.rail_partial.d: "Tank wagons reached the central railhead of [air_winter_event_state.GetName], but frozen points and cracked hoses stranded alternate departures. District queues lengthen whenever a train misses its slot, and workers died clearing stalled wagons in the cold. The surviving point crews can still keep one line open."
chaosx.fallout.49.rail_failure.d: "A damaged approach trapped the tanker rake beyond [air_winter_event_state.GetName]. Families left the station queues for uncertain wells as empty reservoirs exposed the rail district, and several households began moving toward the last working pumps. [ROOT.GetAirWinterGovernmentAuthority] must clear the dry sidings and count the missing crews."
chaosx.fallout.49.motor_success.d: "Road crews marked sheltered lanes between the well fields and ward tanks of [air_winter_event_state.GetName]. Tanker relays arrive before exposed pipes can freeze between runs, and depot mechanics have learned which engines can survive the cold dust. The route sheet now serves every outer ward."
chaosx.fallout.49.motor_partial.d: "Stalled tankers divided the [air_winter_event_state.GetName] convoy into short relays. Inner districts receive irregular deliveries while families from the outer wards move closer to working depots. Drivers and residents died along the exposed route, but the surviving columns can consolidate around the sound engines."
chaosx.fallout.49.motor_failure.d: "Cold rain cut the marked road into [air_winter_event_state.GetName] and disabled tankers blocked the remaining lane. Uncovered loads fouled in roadside runoff while displaced families crowded the last municipal taps. [ROOT.GetAirWinterGovernmentOfficial] must recover the engines, close the route, and enter the dead in the city ledger."
chaosx.fallout.49.a: "Keep the cistern rota and retain the pipe crews."
chaosx.fallout.49.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_moderate|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!, §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_moderate|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. Local supply rises by §G[?constant:air_winter_event_desert_city.supply_bonus|%0]§! for §Y[?constant:air_winter_event_desert_city.supply_days|0] days§!."
chaosx.fallout.49.b: "Extend the hand-cart rota to the outer wards."
chaosx.fallout.49.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_minor|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_minor|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.desert_city_municipal_partial_percent|%3]§! of the remaining state population and enter the Deaths ledger."
chaosx.fallout.49.c: "Close the broken galleries and ration the sound tanks."
chaosx.fallout.49.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! falls by §R[?constant:air_winter_event_ledger.water_moderate|0]§!, while §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_severe|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_major|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.desert_city_municipal_failure_percent|%3]§! of the remaining state population and enter the Deaths ledger. Operational Infrastructure or a Supply Hub takes §R[?constant:air_winter_event_desert_city.building_damage|2]§! repairable damage. Local supply is reduced by §R[?constant:air_winter_event_desert_city.supply_penalty_magnitude|%0]§! for §Y[?constant:air_winter_event_desert_city.supply_days|0] days§!, and national Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!."
chaosx.fallout.49.d: "Keep the tanker timetable through the next freeze."
chaosx.fallout.49.d.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_major|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!, §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_major|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. Local supply rises by §G[?constant:air_winter_event_desert_city.supply_bonus|%0]§! for §Y[?constant:air_winter_event_desert_city.supply_days|0] days§!."
chaosx.fallout.49.e: "Heat the remaining points and publish the reduced schedule."
chaosx.fallout.49.e.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_minor|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.desert_city_rail_partial_percent|%3]§! of the remaining state population and enter the Deaths ledger."
chaosx.fallout.49.f: "Clear the dry sidings and move the queues to working wells."
chaosx.fallout.49.f.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! falls by §R[?constant:air_winter_event_ledger.water_moderate|0]§!, while §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_severe|0]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_major|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.desert_city_rail_failure_percent|%3]§! of the remaining state population and enter the Deaths ledger. An operational Railway or Infrastructure level takes §R[?constant:air_winter_event_desert_city.building_damage|2]§! repairable damage. Local supply is reduced by §R[?constant:air_winter_event_desert_city.supply_penalty_magnitude|%0]§! for §Y[?constant:air_winter_event_desert_city.supply_days|0] days§!, and national War Support falls by §R[?constant:air_winter_event_country.war_support_moderate|%1]§!."
chaosx.fallout.49.g: "Make the sheltered relay lanes permanent."
chaosx.fallout.49.g.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_major|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!, and §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_major|0]§!. Local supply rises by §G[?constant:air_winter_event_desert_city.supply_bonus|%0]§! for §Y[?constant:air_winter_event_desert_city.supply_days|0] days§!."
chaosx.fallout.49.h: "Consolidate the sound engines around the working depots."
chaosx.fallout.49.h.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_minor|0]§!, while §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_moderate|0]§! and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.desert_city_motor_partial_percent|%3]§! of the remaining state population and enter the Deaths ledger."
chaosx.fallout.49.i: "Recover the disabled tankers and close the cut road."
chaosx.fallout.49.i.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! falls by §R[?constant:air_winter_event_ledger.water_moderate|0]§!, while §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_extreme|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_severe|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_major|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.desert_city_motor_failure_percent|%3]§! of the remaining state population and enter the Deaths ledger. Operational Infrastructure or a Supply Hub takes §R[?constant:air_winter_event_desert_city.building_damage|2]§! repairable damage. Local supply is reduced by §R[?constant:air_winter_event_desert_city.supply_penalty_magnitude|%0]§! for §Y[?constant:air_winter_event_desert_city.supply_days|0] days§!, and national Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!."

chaosx.fallout.14.t: "The Herds Leave the Ridge"
chaosx.fallout.14.d: "Pastures above [air_winter_event_state.GetName] have hardened beneath crusted snow, breaking hooves and hiding the last grass. Herders can drive their animals into crowded lower valleys, or road units can hold the passes open at the cost of fuel and exposed patrols. [ROOT.GetAirWinterGovernmentAuthority] must settle the route before the next snowfall."
chaosx.fallout.14.a: "Bring the herds into the lower valleys."
chaosx.fallout.14.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_major|0]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_moderate|0]§!, and §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!."
chaosx.fallout.14.b: "Hold the passes for winter traffic."
chaosx.fallout.14.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!, and §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!. We spend §R[?constant:air_winter_event_country.command_power_moderate|0]§! Command Power."

chaosx.fallout.15.t: "The Deep-Water Boats Return"
chaosx.fallout.15.success.d: "The escorted patrol from [air_winter_event_state.GetName] followed temperature readings and old current charts until it found a feeding ground beyond the cold coastal band. Every boat returned with iced rigging and full holds, giving local crews a route they can repeat under guard."
chaosx.fallout.15.failure.d: "The escorted patrol from [air_winter_event_state.GetName] met freezing spray beyond the coastal lights. Several boats limped home with injured crews, while others left only broken radio calls and empty berths for the harbor office to record."
chaosx.fallout.15.a: "Mark the coordinates and ration the catch."
chaosx.fallout.15.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_moderate|0]§! and §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!. The successful patrol becomes lasting state memory."
chaosx.fallout.15.b: "Read the names at the harbor office."
chaosx.fallout.15.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§! and §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.failed_patrol_percent|%2]§! of the remaining state population and enter the Deaths ledger. National War Support falls by §R[?constant:air_winter_event_country.war_support_minor|%1]§!."

chaosx.fallout.16.t: "Classes Beneath the Capital"
chaosx.fallout.16.d: "Rail service galleries below [air_winter_event_state.GetName] still hold heat after the surface schools close. Teachers have begun carrying slates and soup kettles past cable crews, machine shops, and emergency stores. The galleries can shelter whole districts, but every classroom takes floor space and power from the workshops that keep the mountain routes open. [ROOT.GetAirWinterGovernmentAuthority] must decide how the tunnels will be shared."
chaosx.fallout.16.a: "Convert the lower galleries into civic school wards."
chaosx.fallout.16.a.tt: "We spend §R[?constant:air_winter_event_country.manpower_moderate|0]§! Manpower and §R[?constant:air_winter_event_country.support_equipment_engineer_cost|0]§! Support Equipment. In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_major|0]§!, §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_minor|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. Local factory availability receives a §R[?constant:air_winter_event_outcome.tunnel_civic_factory_penalty|%0]§! penalty until the report in §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!. The conversion holds only if Building Damage Pressure is no more than §Y[?constant:air_winter_event_outcome.tunnel_civic_pressure_ceiling|0]§! and Disease Pressure is no more than §Y[?constant:air_winter_event_outcome.tunnel_civic_disease_ceiling|0]§!."
chaosx.fallout.16.b: "Alternate the workshops and classrooms by shift."
chaosx.fallout.16.b.tt: "We spend §R[?constant:air_winter_event_country.manpower_minor|0]§! Manpower and §R[?constant:air_winter_event_country.support_equipment_crew_cost|0]§! Support Equipment. In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_moderate|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. Local factory availability receives a §R[?constant:air_winter_event_outcome.tunnel_shifts_factory_penalty|%0]§! penalty until the shared schedule settles in §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.16.c: "Keep the main tunnels for repair shops and disperse the schools."
chaosx.fallout.16.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_major|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_minor|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!. The cellar network holds after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§! only if Adaptation is at least §Y[?constant:air_winter_event_outcome.tunnel_cellars_adaptation_threshold|0]§! and Exposure is no more than §Y[?constant:air_winter_event_outcome.tunnel_cellars_exposure_ceiling|0]§!."

chaosx.fallout.17.t: "The Tunnel Bell"
chaosx.fallout.17.civic_success.d: "The lower galleries in [air_winter_event_state.GetName] now open before dawn with a school bell sounded beside the ventilation board. Engineers have separated kitchens from cable runs, teachers keep sickness registers by ward, and workshop foremen report that the remaining floor space can carry the winter repair schedule. Families who once crossed exposed streets now sleep near the classrooms."
chaosx.fallout.17.civic_failure.d: "Warm galleries drew more families into the lower tunnels of [air_winter_event_state.GetName] than the ventilation plan could carry. Condensation runs over electrical cabinets, coughing spreads between dormitories, and repair crews lose hours clearing passages before every shift. The school wards must contract before a workshop fire or disease closure decides the matter."
chaosx.fallout.17.shifts.d: "The tunnel clocks in [air_winter_event_state.GetName] now govern two working days at once. Children leave the galleries as machinists arrive, cooks clean their stoves before welding begins, and each workshop keeps a classroom warden on its shift board. The arrangement is crowded, but it has preserved both instruction and essential repairs."
chaosx.fallout.17.cellars_success.d: "Ward inspectors in [air_winter_event_state.GetName] have linked hundreds of cellar classrooms by runner, telephone, and ration cart. Small rooms close when their air turns bad, children move through covered routes, and the main tunnels remain free for pumps and machine shops. The scattered network has become a dependable layer of winter shelter."
chaosx.fallout.17.cellars_failure.d: "The cellar lists from [air_winter_event_state.GetName] conceal rooms with blocked flues, wet walls, and no protected route to a clinic. Several ward schools have closed after sickness and cold swept through them. Repair shops remain open below the capital, but families now crowd the few inspected shelters that are left."
chaosx.fallout.17.a: "Keep the school wards on the tunnel plan."
chaosx.fallout.17.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_moderate|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. Future monthly Air Winter civilian losses use §G[?constant:air_winter_deaths.tunnel_school_protection_multiplier|%0]§! of their normal rate in this state."
chaosx.fallout.17.b: "Move the children out before the next shift."
chaosx.fallout.17.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_minor|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!."
chaosx.fallout.17.c: "Keep the bell and shift board synchronized."
chaosx.fallout.17.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. Future monthly Air Winter civilian losses use §G[?constant:air_winter_deaths.tunnel_school_protection_multiplier|%0]§! of their normal rate in this state."
chaosx.fallout.17.d: "Register each cellar and its winter warden."
chaosx.fallout.17.d.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_minor|0]§!, and §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_minor|0]§!. Future monthly Air Winter civilian losses use §G[?constant:air_winter_deaths.tunnel_school_protection_multiplier|%0]§! of their normal rate in this state."
chaosx.fallout.17.e: "Close the unsafe rooms and reopen the ward lists."
chaosx.fallout.17.e.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!, and §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!."

chaosx.fallout.20.t: "The Frozen Junction"
chaosx.fallout.20.d: "At the main junction in [air_winter_event_state.GetName], points have frozen beneath compacted ash and locomotives arrive with brake lines split by ice. Road crews can divert the cargo, railway brigades can fight for the line, or [ROOT.GetAirWinterGovernmentOfficial] can order the outer yards closed before more workers are stranded."
chaosx.fallout.20.a: "Clear the railway through every shift."
chaosx.fallout.20.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§! and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. We lose §R[?constant:air_winter_event_country.manpower_moderate|0]§! available Manpower, and the route reports after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.20.b: "Move priority cargo onto guarded roads."
chaosx.fallout.20.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!, and §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!. We spend §R[?constant:air_winter_event_country.command_power_minor|0]§! Command Power, and the route reports after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.20.c: "Close the outer junctions and bring people inward."
chaosx.fallout.20.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_major|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_major|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!, and the route reports after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."

chaosx.fallout.21.t: "Thirty Days on the Route"
chaosx.fallout.21.rail_success.d: "The cleared railway through [air_winter_event_state.GetName] has survived a month of refreezing. Crews learned to heat points before dusk and keep ash away from the drainage beds, allowing guarded supply trains to pass without losing another locomotive."
chaosx.fallout.21.rail_failure.d: "The railway effort in [air_winter_event_state.GetName] ended when a thawed point froze beneath a loaded train. Wagons blocked the junction, the relief crane lost pressure in the cold, and traffic officers have written the line off until heavier repairs become possible."
chaosx.fallout.21.roads.d: "Guarded road columns now carry the most urgent loads across [air_winter_event_state.GetName]. Drivers have mapped wind cuts and refueling barns, yet every journey exposes engines and crews to abrasive ice that the old maintenance tables never anticipated."
chaosx.fallout.21.abandoned.d: "The outer junctions of [air_winter_event_state.GetName] stand silent behind drifts and locked signal cabins. Their workers have crowded into the inner settlements, where empty yards reduce repair demands while adding more names to shelter and ration lists."
chaosx.fallout.21.a: "Keep the protected railway roster."
chaosx.fallout.21.a.tt: "In §Y[air_winter_event_state.GetName]§!, railway protection lasts §Y[?constant:air_winter_event_runtime.rail_protection_months|0] months§! and §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!. The successful clearance becomes lasting state memory."
chaosx.fallout.21.b: "Record the wreck and close the line."
chaosx.fallout.21.b.tt: "The railway in §Y[air_winter_event_state.GetName]§! takes §R[?constant:air_winter_event_outcome.rail_damage|1]§! damage and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!. National War Support falls by §R[?constant:air_winter_event_country.war_support_minor|%1]§!."
chaosx.fallout.21.c: "Issue the road maps to every convoy."
chaosx.fallout.21.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!, and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_minor|0]§!."
chaosx.fallout.21.e: "Fold the displaced crews into the inner wards."
chaosx.fallout.21.e.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_moderate|0]§!, and §YReclamation§! falls by §R[?constant:air_winter_event_ledger.reclamation_minor|0]§!."

chaosx.fallout.23.t: "Heat for the Wards"
chaosx.fallout.23.d: "Fuel deliveries into [air_winter_event_state.GetName] can keep either the hospitals, the barracks, or a rotating list of apartment blocks warm through the coming nights. Respiratory wards already share oxygen bottles, while exhausted soldiers sleep in coats beside cold radiators. [ROOT.GetAirWinterGovernmentAuthority] must publish the heat order before the next load is unloaded."
chaosx.fallout.23.a: "Heat the hospitals first."
chaosx.fallout.23.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_severe|0]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, and §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!, and the fuel ledger closes after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!."
chaosx.fallout.23.b: "Heat the barracks and transport depots."
chaosx.fallout.23.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_major|0]§! and §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_moderate|%1]§!, and the fuel ledger closes after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!."
chaosx.fallout.23.c: "Rotate heat by a household census."
chaosx.fallout.23.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§! and §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!, and the fuel ledger closes after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!."

chaosx.fallout.24.t: "The Coal Ledger Closes"
chaosx.fallout.24.hospitals.d: "Hospital boilers in [air_winter_event_state.GetName] remained hot long enough for the respiratory wards to clear their corridors. The staff used the stable heat to dry bedding and establish warm recovery rooms, though every sack of coal had to be guarded from the door to the furnace."
chaosx.fallout.24.barracks.d: "The heated barracks of [air_winter_event_state.GetName] kept transport crews on duty through the hardest nights. Civil clinics received fewer deliveries as a result, and their registers show the cost of placing operational readiness above public warmth."
chaosx.fallout.24.census.d: "The heat census in [air_winter_event_state.GetName] became a nightly map of occupied rooms, broken mains, and vulnerable residents. Inspectors learned which blocks could share boilers and which stairwells needed independent stoves before the rotation could continue."
chaosx.fallout.24.a: "Keep the ward heating roster."
chaosx.fallout.24.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§! and §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!."
chaosx.fallout.24.b: "Keep the transport crews ready."
chaosx.fallout.24.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§! and §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!."
chaosx.fallout.24.c: "Preserve the census and boiler map."
chaosx.fallout.24.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§! and §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!."

chaosx.fallout.22.t: "Ice at the Spillway"
chaosx.fallout.22.d: "Ice has sealed intake screens and driven fractured timber against the gates in [air_winter_event_state.GetName]. The reservoir still feeds homes, pumps, and workshops downstream, but every vibration reaches a structure already carrying winter strain. [ROOT.GetAirWinterGovernmentAuthority] must decide whether engineers protect the works, lower the water, or keep every turbine turning."
chaosx.fallout.22.a: "Send protected crews onto the gates and intakes."
chaosx.fallout.22.a.tt: "We spend §R[?constant:air_winter_event_country.manpower_moderate|0]§! Manpower, §R[?constant:air_winter_event_country.command_power_minor|0]§! Command Power, and §R[?constant:air_winter_event_country.support_equipment_crew_cost|0]§! Support Equipment. In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!, §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!, and §YWater Security§! falls by §R[?constant:air_winter_event_ledger.water_minor|0]§!. The crew reports after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!. The work succeeds only if Water Security is at least §Y[?constant:air_winter_event_outcome.dam_ice_water_threshold|0]§! and Reclamation is at least §Y[?constant:air_winter_event_outcome.dam_ice_reclamation_threshold|0]§!."
chaosx.fallout.22.b: "Lower the reservoir before the next hard freeze."
chaosx.fallout.22.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! falls by §R[?constant:air_winter_event_ledger.water_major|0]§!, §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!, and §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!, and the reservoir office reports after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.22.c: "Keep every turbine feeding the emergency grid."
chaosx.fallout.22.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_moderate|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_minor|%1]§!. Full-head operation holds after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§! only if Adaptation is at least §Y[?constant:air_winter_event_outcome.dam_full_head_adaptation_threshold|0]§! and Building Damage Pressure is no more than §Y[?constant:air_winter_event_outcome.dam_full_head_pressure_ceiling|0]§!."

chaosx.fallout.25.t: "The Reservoir Ledger"
chaosx.fallout.25.ice_success.d: "The protected crews in [air_winter_event_state.GetName] cut the final ice from the intake screens and braced the gate machinery before the next freeze. Downstream pumps have returned to a regular schedule, and the maintenance teams have marked the weak joints that must be watched through spring."
chaosx.fallout.25.ice_failure.d: "A gate mechanism in [air_winter_event_state.GetName] failed while crews were clearing the intake. Ice and broken timber entered the works, forcing downstream pumps onto a reduced schedule while injured workers were carried through service tunnels slick with frozen spray."
chaosx.fallout.25.drawdown.d: "The lowered reservoir in [air_winter_event_state.GetName] exposed mud, abandoned landings, and old stonework to the cold. Water offices are rationing the diminished head, but the gates and spillway have passed the freeze without taking new damage."
chaosx.fallout.25.full_head_success.d: "The turbines in [air_winter_event_state.GetName] held at full head. Heated wards and pumping stations stayed lit, while plant crews learned which bearings and gate motors can carry a winter load without forcing an immediate shutdown."
chaosx.fallout.25.full_head_failure.d: "Full-head operation drove a weakened section of the dam works in [air_winter_event_state.GetName] past its limit. Power fell without warning, water offices closed intake valves, and exposed districts lost heat while repair teams searched the frozen galleries."
chaosx.fallout.25.a: "Keep the intake crews on a winter rotation."
chaosx.fallout.25.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_major|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!."
chaosx.fallout.25.b: "Close the damaged gallery and ration downstream water."
chaosx.fallout.25.b.tt: "One remaining installed Dam and local Infrastructure can take immediate damage in §Y[air_winter_event_state.GetName]§!. §YWater Security§! falls by §R[?constant:air_winter_event_ledger.water_moderate|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!, and §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!."
chaosx.fallout.25.c: "Keep the reservoir below the winter mark."
chaosx.fallout.25.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_minor|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!."
chaosx.fallout.25.d: "Retain full-head operation under engineering limits."
chaosx.fallout.25.d.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_moderate|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!."
chaosx.fallout.25.e: "Isolate the broken works and restore water by district."
chaosx.fallout.25.e.tt: "One remaining installed Dam and local Infrastructure can take immediate damage in §Y[air_winter_event_state.GetName]§!. §YWater Security§! falls by §R[?constant:air_winter_event_ledger.water_moderate|0]§!, §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_major|0]§!, and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!. National War Support falls by §R[?constant:air_winter_event_country.war_support_minor|%1]§!."

chaosx.fallout.26.t: "Black Snow at the Cracking Towers"
chaosx.fallout.26.d: "Black snow is packed around valves, loading racks, and pipe bridges in [air_winter_event_state.GetName]. Oil handling has slowed, and a warm line beneath the ash can become a fire before a lookout reaches the nearest telephone. [ROOT.GetAirWinterGovernmentAuthority] can close the exposed works, protect military deliveries, or send process heat into nearby shelters."
chaosx.fallout.26.a: "Shut the exposed lines and ration every tank."
chaosx.fallout.26.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§! and §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!. Any Natural Oil Output falls by §R[?constant:air_winter_event_outcome.refinery_oil_output_loss|%0]§! for up to §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. An operational Synthetic Refinery takes §R[?constant:air_winter_event_outcome.refinery_output_damage|%0]§! repairable damage when present. The works report after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!."
chaosx.fallout.26.b: "Keep military fuel moving through guarded lines."
chaosx.fallout.26.b.tt: "We spend §R[?constant:air_winter_event_country.fuel_moderate|0]§! Fuel. In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_major|0]§!, and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!. Any Natural Oil Output falls by §R[?constant:air_winter_event_outcome.refinery_oil_output_loss|%0]§! for up to §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. An operational Synthetic Refinery takes §R[?constant:air_winter_event_outcome.refinery_output_damage|%0]§! repairable damage when present. National War Support rises by §G[?constant:air_winter_event_country.war_support_moderate|%1]§!. The guarded lines hold only if Adaptation is at least §Y[?constant:air_winter_event_outcome.refinery_adaptation_threshold|0]§! and Building Damage Pressure is no more than §Y[?constant:air_winter_event_outcome.refinery_pressure_ceiling|0]§!."
chaosx.fallout.26.c: "Pipe process heat into the nearest shelter districts."
chaosx.fallout.26.c.tt: "We spend §R[?constant:air_winter_event_country.fuel_minor|0]§! Fuel. In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_major|0]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. Any Natural Oil Output falls by §R[?constant:air_winter_event_outcome.refinery_oil_output_loss|%0]§! for up to §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!. An operational Synthetic Refinery takes §R[?constant:air_winter_event_outcome.refinery_output_damage|%0]§! repairable damage when present. The shelter wardens report after §Y[?constant:air_winter_event_runtime.delayed_short_days|0] days§!."

chaosx.fallout.27.t: "The Fuel Works after Three Weeks"
chaosx.fallout.27.shutdown.d: "The exposed lines in [air_winter_event_state.GetName] stayed closed until crews could chip ash from the valves and test each section under low pressure. Fuel remains rationed, but the night watch no longer reports hot patches beneath the black snow."
chaosx.fallout.27.military_success.d: "Guarded loading crews in [air_winter_event_state.GetName] kept military deliveries moving without losing the main works. Their protected pipe bridges, repair stores, and watch posts now form a defensible fuel complex that later authorities may choose to fortify."
chaosx.fallout.27.military_failure.d: "A hot line beneath the black snow in [air_winter_event_state.GetName] ignited before the guarded crews could isolate it. Fire crossed a loading rack, damaged storage and refinery equipment, and reached nearby quarters through smoke-filled service roads."
chaosx.fallout.27.district_heat.d: "Process heat from the works in [air_winter_event_state.GetName] reached the shelter districts through insulated pipe laid across frozen streets. The arrangement wastes fuel and strains the plant, but clinic wards are warmer and fewer families sleep beside improvised burners."
chaosx.fallout.27.a: "Reopen only the lines that pass a cold test."
chaosx.fallout.27.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§! and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. The temporary natural-oil output penalty ends."
chaosx.fallout.27.b: "Preserve the guarded fuel complex."
chaosx.fallout.27.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§! and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. We recover §G[?constant:air_winter_event_country.fuel_minor|0]§! Fuel. The temporary natural-oil output penalty ends. The protected works remain a defensible fuel complex that a later survival authority may fortify."
chaosx.fallout.27.c: "Seal the fire ground and account for every casualty."
chaosx.fallout.27.c.tt: "An operational Synthetic Refinery, Fuel Silo, and local Infrastructure can take immediate damage in §Y[air_winter_event_state.GetName]§!. §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_major|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_minor|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_major|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.refinery_fire_percent|%3]§! of the remaining state population and enter the Deaths ledger. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!, and the temporary natural-oil output penalty ends."
chaosx.fallout.27.d: "Keep the shelter mains under civilian wardens."
chaosx.fallout.27.d.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_moderate|0]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!. The temporary natural-oil output penalty ends."

chaosx.fallout.28.t: "The Cooling Pond Freezes"
chaosx.fallout.28.d: "Ice has narrowed the cooling intake in [air_winter_event_state.GetName], while drifting ash clogs screens that plant crews cleared only hours ago. The reactor can be shut down under emergency pumping, held at reduced output, or placed under a plant council with authority over water and labor. [ROOT.GetAirWinterGovernmentAuthority] must choose before another night freeze reaches the pond."
chaosx.fallout.28.a: "Scram the reactor and flood the cooling circuit."
chaosx.fallout.28.a.tt: "We spend §R[?constant:air_winter_event_country.manpower_moderate|0]§! Manpower, §R[?constant:air_winter_event_country.command_power_moderate|0]§! Command Power, and §R[?constant:air_winter_event_country.support_equipment_engineer_cost|0]§! Support Equipment. In §Y[air_winter_event_state.GetName]§!, §YWater Security§! falls by §R[?constant:air_winter_event_ledger.water_major|0]§!, §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!, and §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!. Local Factory Energy Consumption rises by §R[?constant:air_winter_event_outcome.reactor_power_demand|%0]§! until the report, with a §Y[?constant:air_winter_event_outcome.reactor_power_demand_days|0]-day§! safety limit. The scram succeeds after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§! only if Water Security is at least §Y[?constant:air_winter_event_outcome.reactor_scram_water_threshold|0]§! and national Energy Fulfilment remains above §Y[?constant:air_winter_event_outcome.reactor_scram_energy_threshold|%0]§!."
chaosx.fallout.28.b: "Hold the plant at reduced output."
chaosx.fallout.28.b.tt: "We spend §R[?constant:air_winter_event_country.command_power_minor|0]§! Command Power. In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_moderate|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!, and §YWater Security§! falls by §R[?constant:air_winter_event_ledger.water_moderate|0]§!. Reduced output holds after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§! only if Adaptation is at least §Y[?constant:air_winter_event_outcome.reactor_reduced_adaptation_threshold|0]§! and Building Damage Pressure is no more than §Y[?constant:air_winter_event_outcome.reactor_pressure_ceiling|0]§!."
chaosx.fallout.28.c: "Give the plant council emergency authority."
chaosx.fallout.28.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_major|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!, §YWater Security§! falls by §R[?constant:air_winter_event_ledger.water_moderate|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. The council succeeds after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§! only if Adaptation is at least §Y[?constant:air_winter_event_outcome.reactor_council_adaptation_threshold|0]§! and Water Security is at least §Y[?constant:air_winter_event_outcome.reactor_council_water_threshold|0]§!."

chaosx.fallout.29.t: "The Plant Report"
chaosx.fallout.29.scram_success.d: "Emergency pumps in [air_winter_event_state.GetName] kept water moving after the reactor shut down. Crews have cleared the intake, isolated frozen lines, and returned the cooling circuit to a stable low-temperature condition without releasing contamination beyond the plant boundary."
chaosx.fallout.29.scram_failure.d: "The emergency pumps in [air_winter_event_state.GetName] lost cooling water and power before the reactor reached a safe condition. Plant buildings were damaged, contaminated steam crossed the service ground, and nearby wards have begun measuring fallout on roofs and water tanks."
chaosx.fallout.29.reduced_success.d: "The reactor in [air_winter_event_state.GetName] held at reduced output while crews rotated through the intake house and control rooms. Power remained available to pumps and shelters, and the plant now has a tested winter schedule for water, repairs, and shift relief."
chaosx.fallout.29.reduced_failure.d: "Reduced output concealed a growing cooling fault in [air_winter_event_state.GetName]. A damaged circuit forced an abrupt shutdown, leaving plant buildings broken and the surrounding service district under a new radioactive-fallout order."
chaosx.fallout.29.council_success.d: "The plant council in [air_winter_event_state.GetName] joined operators, water officials, and repair crews under one emergency roster. The intake is clear, the cooling schedule is stable, and every district office knows which demand must be cut before the plant approaches another unsafe condition."
chaosx.fallout.29.council_failure.d: "The plant council in [air_winter_event_state.GetName] could not reconcile water rationing with the demands of the control room. Pumps lost priority at the wrong hour, a cooling circuit failed, and contaminated steam left the plant before local offices agreed who could order an evacuation."
chaosx.fallout.29.a: "Keep the reactor shut until the pond is fully clear."
chaosx.fallout.29.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_major|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!, and §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_minor|0]§!. Emergency cooling power demand ends."
chaosx.fallout.29.b: "Seal the plant boundary and issue fallout water orders."
chaosx.fallout.29.b.tt: "One remaining installed Reactor and local Infrastructure can take immediate damage in §Y[air_winter_event_state.GetName]§!. Radioactive Fallout intensity rises by up to §R[?constant:air_winter_event_outcome.reactor_failure_fallout_intensity|2]§!, and Fallout remains for at least §Y[?constant:air_winter_event_outcome.reactor_failure_fallout_days|0] days§!. §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_major|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_major|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!, and emergency cooling power demand ends."
chaosx.fallout.29.c: "Keep the reduced-output winter schedule."
chaosx.fallout.29.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_moderate|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_minor|%1]§!."
chaosx.fallout.29.d: "Shut the damaged circuit and cordon the service district."
chaosx.fallout.29.d.tt: "One remaining installed Reactor and local Infrastructure can take immediate damage in §Y[air_winter_event_state.GetName]§!. Radioactive Fallout intensity rises by up to §R[?constant:air_winter_event_outcome.reactor_failure_fallout_intensity|2]§!, and Fallout remains for at least §Y[?constant:air_winter_event_outcome.reactor_failure_fallout_days|0] days§!. §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_major|0]§! and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_major|0]§!. National War Support falls by §R[?constant:air_winter_event_country.war_support_minor|%1]§!."
chaosx.fallout.29.e: "Confirm the plant council's emergency charter."
chaosx.fallout.29.e.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_major|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!."
chaosx.fallout.29.f: "Replace the council and evacuate the plant wards."
chaosx.fallout.29.f.tt: "One remaining installed Reactor and local Infrastructure can take immediate damage in §Y[air_winter_event_state.GetName]§!. Radioactive Fallout intensity rises by up to §R[?constant:air_winter_event_outcome.reactor_failure_fallout_intensity|2]§!, and Fallout remains for at least §Y[?constant:air_winter_event_outcome.reactor_failure_fallout_days|0] days§!. §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_major|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!."

chaosx.fallout.30.t: "Names for the Warm Rooms"
chaosx.fallout.30.d: "The shelter register for [air_winter_event_state.GetName] contains more names than the heated rooms can hold. Physicians ask priority for children, older residents, and the chronically ill, while repair directors argue that skilled crews preserve heat for everyone. [ROOT.GetAirWinterGovernmentOfficial] can also order a public lottery whose fairness may leave vital workers outside."
chaosx.fallout.30.a: "Give the warm rooms to those least able to endure cold."
chaosx.fallout.30.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_major|0]§! and §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_moderate|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_moderate|%1]§!, War Support falls by §R[?constant:air_winter_event_country.war_support_minor|%1]§!, and the register is reviewed after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.30.b: "Reserve beds for indispensable crews."
chaosx.fallout.30.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_major|0]§! and §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!, and the register is reviewed after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.30.c: "Draw the beds by a witnessed lottery."
chaosx.fallout.30.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§! and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!. We spend §R[?constant:air_winter_event_country.command_power_minor|0]§! Command Power, and the register is reviewed after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."

chaosx.fallout.31.t: "The Shelter Register Bears Weight"
chaosx.fallout.31.care.d: "The care-first register in [air_winter_event_state.GetName] placed the frailest residents near boilers and clinics. Neighborhood volunteers learned to carry meals between rooms and watch for fever, giving the policy practical strength beyond its original list of names."
chaosx.fallout.31.workers.d: "Repair crews housed near their depots have kept more furnaces and pumps working in [air_winter_event_state.GetName]. Families excluded from those rooms continue to arrive at improvised shelters, where the benefits of reliable maintenance are measured against a crowded floor."
chaosx.fallout.31.lottery.d: "The witnessed lottery in [air_winter_event_state.GetName] ended most accusations of secret privilege, though it placed some critical workers far from their tools. Ward officials have adapted by pairing winners with households that can share heat and duties."
chaosx.fallout.31.a: "Continue the care wards."
chaosx.fallout.31.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§! and §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!."
chaosx.fallout.31.b: "Hold the repair dormitories to their duty."
chaosx.fallout.31.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§! and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!."
chaosx.fallout.31.c: "Publish the household pairing lists."
chaosx.fallout.31.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§! and §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!. National War Support falls by §R[?constant:air_winter_event_country.war_support_minor|%1]§!."

chaosx.fallout.33.t: "The Black Harvest"
chaosx.fallout.33.d: "The harvest from [air_winter_event_state.GetName] has arrived blackened by frost and ash, with damp stalks that spoil inside the barns. Villages can burn the ruined crop for heat, preserve the least damaged straw for seed and roofing, or demand fuel from nearby towns. [ROOT.GetAirWinterGovernmentAuthority] must choose before mold takes the entire stack."
chaosx.fallout.33.a: "Burn the dead stalks for heat."
chaosx.fallout.33.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_major|0]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_severe|0]§!, and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!. The threshing floors report after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.33.b: "Preserve clean straw, seed, and roofing fiber."
chaosx.fallout.33.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_moderate|0]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, and §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!. We lose §R[?constant:air_winter_event_country.manpower_moderate|0]§! available Manpower, and the threshing floors report after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.33.c: "Requisition town fuel for the villages."
chaosx.fallout.33.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_major|0]§! and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_moderate|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!, and the threshing floors report after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."

chaosx.fallout.32.t: "What the Threshing Floors Gave"
chaosx.fallout.32.burned.d: "Smoke from burned stalks hung low over [air_winter_event_state.GetName], warming houses while filling clinics with coughing patients. The emergency fuel lasted, yet the land lost material that would have protected roofs and soil through the next cold season."
chaosx.fallout.32.preserved.d: "Careful sorting in [air_winter_event_state.GetName] saved seed, dry straw, and enough fiber to patch village roofs. The work consumed labor that could have cleared roads, but local stores now contain material suited to another planting and another winter."
chaosx.fallout.32.requisitioned.d: "Fuel columns reached the villages of [air_winter_event_state.GetName] under armed escort. Town districts surrendered coal and oil, sending displaced families toward the countryside even as farm kitchens gained the heat needed to preserve food."
chaosx.fallout.32.a: "Record the smoke sickness and saved homes."
chaosx.fallout.32.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, and §YReclamation§! falls by §R[?constant:air_winter_event_ledger.reclamation_minor|0]§!."
chaosx.fallout.32.b: "Distribute the saved seed and straw."
chaosx.fallout.32.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§! and §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_minor|0]§!."
chaosx.fallout.32.c: "Absorb the families that followed the fuel."
chaosx.fallout.32.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_moderate|0]§! and §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_minor|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_minor|%1]§!."

chaosx.fallout.34.t: "The Last Heated Tram"
chaosx.fallout.34.d: "One tram loop in [air_winter_event_state.GetName] still carries heat, food, and medical staff between districts. Closing exposed wards would concentrate fuel and patients, while keeping the loop running would preserve a wider city at growing mechanical cost. [ROOT.GetAirWinterGovernmentOfficial] can also place the route under military courier control."
chaosx.fallout.34.a: "Close the exposed districts and move residents inward."
chaosx.fallout.34.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_major|0]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_major|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!, and the city reports after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.34.b: "Keep the heated tram loop running."
chaosx.fallout.34.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_major|0]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_moderate|0]§!, and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!. We spend §R[?constant:air_winter_event_country.command_power_moderate|0]§! Command Power, and the city reports after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.34.c: "Turn the loop over to military couriers."
chaosx.fallout.34.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§! and §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!. We spend §R[?constant:air_winter_event_country.command_power_major|0]§! Command Power, National War Support rises by §G[?constant:air_winter_event_country.war_support_moderate|%1]§!, and the city reports after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."

chaosx.fallout.35.t: "A City Drawn Around Heat"
chaosx.fallout.35.closed.d: "Residents moved from the outer districts of [air_winter_event_state.GetName] into a smaller heated core. Clinics can reach patients more reliably, though every stairwell and station platform now carries the noise and illness of a city compressed into fewer blocks."
chaosx.fallout.35.trams.d: "The heated tram loop in [air_winter_event_state.GetName] remains operational after a month of improvised repairs. Its workshops consume scarce parts, yet the route keeps food, patients, and repair crews moving across districts that would otherwise stand apart."
chaosx.fallout.35.couriers.d: "Military couriers have imposed a reliable timetable on [air_winter_event_state.GetName]. Their guarded cars move orders and medicine through the cold, while civilian riders learn which uniforms will open a door and which will send them back into the street."
chaosx.fallout.35.a: "Strengthen the heated core."
chaosx.fallout.35.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!."
chaosx.fallout.35.b: "Keep parts flowing to the tram workshops."
chaosx.fallout.35.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§! and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!."
chaosx.fallout.35.c: "Retain the courier timetable."
chaosx.fallout.35.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§! and §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_minor|0]§!."

chaosx.fallout.36.t: "The Furnace Shift"
chaosx.fallout.36.coal.d: "The coal screens beneath the headframes of [air_winter_event_state.GetName] have frozen into ridges of ash and ice, stopping loaded tubs at the coke-oven yards. Colliery foremen ask for full shifts to clear the conveyors and hold production, while mechanics warn that brittle ropes, frozen brakes, and cracked oven doors will maim exposed crews. [ROOT.GetAirWinterGovernmentAuthority] must decide whether the workings stay open or close for inspection."
chaosx.fallout.36.industry.d: "Frost has locked the crane rails inside the foundry halls of [air_winter_event_state.GetName], and ash is choking the furnace draughts. Works managers want full shifts to keep the machine halls and ovens hot, while maintenance crews report cracked cooling lines, brittle roof trusses, and lifting gear that may fail under load. [ROOT.GetAirWinterGovernmentAuthority] must decide whether the exposed works remain open or every furnace is banked for inspection."
chaosx.fallout.36.a: "Keep every exposed works on full shifts."
chaosx.fallout.36.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.furnace_full_shift_percent|%3]§! of the remaining state population and enter the Deaths ledger. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!. After §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!, the works hold only if §YAdaptation§! is at least §Y[?constant:air_winter_event_outcome.furnace_adaptation_threshold|0]§! and §YBuilding Damage Pressure§! is no more than §Y[?constant:air_winter_event_outcome.furnace_pressure_ceiling|0]§!."
chaosx.fallout.36.b: "Close the exposed works and bank every furnace."
chaosx.fallout.36.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_major|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. Until the works inspector reports after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!, local factory availability receives a §R[?constant:air_winter_event_outcome.furnace_factory_penalty|%0]§! penalty where operational factories remain, and coal output receives a §R[?constant:air_winter_event_outcome.furnace_coal_output_penalty|%0]§! penalty where coal is present. Both penalties expire automatically after §Y[?constant:air_winter_event_outcome.furnace_shutdown_days|0] days§! if the report cannot be delivered."

chaosx.fallout.37.t: "The Works Inspector's Ledger"
chaosx.fallout.37.full_success.d: "The exposed works of [air_winter_event_state.GetName] still answer the shift whistles after thirty days. At each site, crews cleared frozen screens and loading gear or thawed furnace lines and crane rails before the next shift entered. [ROOT.GetAirWinterGovernmentOfficial] has received an inspector's ledger that calls for binding winter shift rules across every operating works."
chaosx.fallout.37.full_failure.d: "The full-shift order in [air_winter_event_state.GetName] outlasted the soundest conveyor housing, crane rail, or furnace wall. Workers were caught beneath damaged steel and masonry as surviving headframes and foundry halls closed around the unsafe sites. [ROOT.GetAirWinterGovernmentOfficial] must seal the damaged works and release the casualty roll to the waiting families."
chaosx.fallout.37.shutdown.d: "Thirty days of shutdown left the exposed works of [air_winter_event_state.GetName] cold enough for a complete inspection. Crews examined coal screens, headframe gear, and loading yards at the workings, or furnace flues and crane rails inside the foundry halls, then marked unsafe equipment for continued closure. [ROOT.GetAirWinterGovernmentAuthority] can permit a limited restart under the signed inspection list."
chaosx.fallout.37.a: "Issue the winter shift rules."
chaosx.fallout.37.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!."
chaosx.fallout.37.b: "Seal the damaged works and publish the casualty roll."
chaosx.fallout.37.b.tt: "Repairable damage of §R[?constant:air_winter_event_outcome.furnace_damage|2]§! strikes one operational Military Factory in §Y[air_winter_event_state.GetName]§!, otherwise one operational Civilian Factory, otherwise local Infrastructure if a damageable level remains. §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§! and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_major|0]§!. Further civilian losses equal §R[?constant:air_winter_event_deaths.furnace_failure_percent|%3]§! of the remaining state population and enter the Deaths ledger. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!."
chaosx.fallout.37.c: "Reopen only inspected furnaces and loading yards."
chaosx.fallout.37.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!, §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_minor|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. Any remaining factory and coal-workings shutdown penalties are removed."

chaosx.fallout.38.t: "Boats Beneath the Shore Lights"
chaosx.fallout.38.harbor.d: "Patrol craft outside the harbor of the naval base at [air_winter_event_state.GetName] have found civilian boats from [air_winter_refugee_source_state.GetName] in [air_winter_refugee_source_country.GetNameDef] beating through cold rain and winter surf. Several hulls are taking water beside the outer mole, and rescue launches can still bring them through the harbor entrance. The quarantine sheds can screen families who land, drawing guards and rations from food stores already measured against crowded island households. [ROOT.GetAirWinterGovernmentAuthority] must decide which boats may follow the shore lights."
chaosx.fallout.38.anchorage.d: "Patrol craft off [air_winter_event_state.GetName] have found civilian boats from [air_winter_refugee_source_state.GetName] in [air_winter_refugee_source_country.GetNameDef] beating through cold rain and winter surf. With no naval harbor, rescue launches are towing disabled craft toward an improvised anchorage marked by fishing lamps. Quarantine sheds would have to be raised beside the landing water, drawing guards and rations from food stores already measured against crowded island households. [ROOT.GetAirWinterGovernmentAuthority] must decide where the patrol line will open."
chaosx.fallout.38.a: "Rescue every boat that can still make shore."
chaosx.fallout.38.a.tt: "Requires at least §Y[?constant:air_winter_event_country.manpower_moderate|0]§! available Manpower and §Y[?constant:air_winter_event_country.island_refugee_convoy_cost|0]§! Convoys. We spend §R[?constant:air_winter_event_country.manpower_moderate|0]§! available Manpower and §R[?constant:air_winter_event_country.island_refugee_convoy_cost|0]§! Convoys. Rescue launches and shore crews land a number equal to §Y[?constant:air_winter_event_island_refugee.rescue_population_share|%0]§! of the current population of §Y[air_winter_event_state.GetName]§!, up to §Y[?constant:air_winter_event_island_refugee.rescue_population_ceiling|0]§! people. §Y[air_winter_refugee_source_state.GetName]§! loses exactly the number received by §Y[air_winter_event_state.GetName]§!, subject to a protected remainder of §Y[?constant:air_winter_event_island_refugee.protected_source_remainder|0]§! people. In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_major|0]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_major|0]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_major|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!. Refugee Pressure in §Y[air_winter_refugee_source_state.GetName]§! falls by §G[?constant:air_winter_event_ledger.refugees_major|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_major|%1]§!. The state records voluntary open-shore admission, the receiving country keeps an open-shore record, and [air_winter_refugee_source_country.GetNameDef] records an organized departure. A harbor report arrives after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!. The rescue harbor succeeds only if Food Reserve is at least §Y[?constant:air_winter_event_outcome.island_refugee_rescue_food_minimum|0]§!, Shelter Capacity is at least §Y[?constant:air_winter_event_outcome.island_refugee_rescue_shelter_minimum|0]§!, Disease Pressure is no more than §Y[?constant:air_winter_event_outcome.island_refugee_rescue_disease_ceiling|0]§!, and Refugee Pressure is no more than §Y[?constant:air_winter_event_outcome.island_refugee_rescue_pressure_ceiling|0]§!."
chaosx.fallout.38.b: "Establish quarantine inside the landing cordon."
chaosx.fallout.38.b.tt: "Requires at least §Y[?constant:air_winter_event_country.manpower_minor|0]§! available Manpower and §Y[?constant:air_winter_event_country.support_equipment_crew_cost|0]§! Support Equipment. We spend §R[?constant:air_winter_event_country.manpower_minor|0]§! available Manpower and §R[?constant:air_winter_event_country.support_equipment_crew_cost|0]§! Support Equipment. Screened passengers enter guarded landing camps in a number equal to §Y[?constant:air_winter_event_island_refugee.quarantine_population_share|%0]§! of the current population of §Y[air_winter_event_state.GetName]§!, up to §Y[?constant:air_winter_event_island_refugee.quarantine_population_ceiling|0]§! people. §Y[air_winter_refugee_source_state.GetName]§! loses exactly the number received by §Y[air_winter_event_state.GetName]§!, subject to a protected remainder of §Y[?constant:air_winter_event_island_refugee.protected_source_remainder|0]§! people. In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_moderate|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_minor|0]§!, §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!, and §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!. Refugee Pressure in §Y[air_winter_refugee_source_state.GetName]§! falls by §G[?constant:air_winter_event_ledger.refugees_moderate|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!. The state records voluntary controlled admission under shore quarantine, the receiving country keeps a quarantine-station record, and [air_winter_refugee_source_country.GetNameDef] records a screened departure. A quarantine report arrives after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!. The cordon succeeds only if Water Security is at least §Y[?constant:air_winter_event_outcome.island_refugee_quarantine_water_minimum|0]§!, Disease Pressure is no more than §Y[?constant:air_winter_event_outcome.island_refugee_quarantine_disease_ceiling|0]§!, Building Damage Pressure is no more than §Y[?constant:air_winter_event_outcome.island_refugee_quarantine_damage_ceiling|0]§!, and Refugee Pressure is no more than §Y[?constant:air_winter_event_outcome.island_refugee_quarantine_pressure_ceiling|0]§!."
chaosx.fallout.38.c: "Enforce naval exclusion beyond the shore lights."
chaosx.fallout.38.c.tt: "Most boats are refused, and people already ashore and passengers from disabled craft are landed because they cannot safely be returned to sea. These forced landings equal §Y[?constant:air_winter_event_island_refugee.exclusion_population_share|%2]§! of the current population of §Y[air_winter_event_state.GetName]§!, up to §Y[?constant:air_winter_event_island_refugee.exclusion_population_ceiling|0]§! people. §Y[air_winter_refugee_source_state.GetName]§! loses exactly the number received by §Y[air_winter_event_state.GetName]§!, subject to a protected remainder of §Y[?constant:air_winter_event_island_refugee.protected_source_remainder|0]§! people. In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!, and §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!. Refugee Pressure in §Y[air_winter_refugee_source_state.GetName]§! falls by §G[?constant:air_winter_event_ledger.refugees_minor|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!. The state records the forced landing, the receiving country keeps a closed-waters record, and [air_winter_refugee_source_country.GetNameDef] records that most of the fleet was refused. A patrol report arrives after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!. The exclusion line holds only if Adaptation is at least §Y[?constant:air_winter_event_outcome.island_refugee_exclusion_adaptation_minimum|0]§!, Exposure is no more than §Y[?constant:air_winter_event_outcome.island_refugee_exclusion_exposure_ceiling|0]§!, and Refugee Pressure is no more than §Y[?constant:air_winter_event_outcome.island_refugee_exclusion_pressure_ceiling|0]§!."

chaosx.fallout.39.t: "Thirty Days at the Island Shore"
chaosx.fallout.39.rescue_success.d: "Thirty days after the boats from [air_winter_refugee_source_state.GetName] in [air_winter_refugee_source_country.GetNameDef] entered [air_winter_event_state.GetName], patrol launches still guide smaller craft between the shore lights and the landing steps. Families have left the quarantine sheds for heated rooms and island households, the food stores retain a workable reserve, and clinics have contained infections brought through the crowded harbor. [ROOT.GetAirWinterGovernmentOfficial] has signed the open-harbor register into the island's winter record."
chaosx.fallout.39.rescue_failure.d: "The boats from [air_winter_refugee_source_state.GetName] in [air_winter_refugee_source_country.GetNameDef] filled every quarantine shed and cargo loft around [air_winter_event_state.GetName]. Wet bedding covers the landing floors, the food stores cannot meet the enlarged household ration, and fever has moved through rooms packed beyond their shelter lists. Residents and rescue crews who carried families out of the winter surf are among the dead. [ROOT.GetAirWinterGovernmentAuthority] must open reserve rooms and issue a reduced ration."
chaosx.fallout.39.quarantine_success.d: "Each passenger from [air_winter_refugee_source_state.GetName] in [air_winter_refugee_source_country.GetNameDef] holds a landing number tied to a bunk, clinic examination, and household sponsor in [air_winter_event_state.GetName]. Drainage around the quarantine sheds has been cleared, contaminated bedding is burned in separate pits, and patrol craft deliver food without crossing the island ration queue. [ROOT.GetAirWinterGovernmentOfficial] has completed the controlled-admission register."
chaosx.fallout.39.quarantine_failure.d: "Cold rain has passed through patched quarantine roofs in [air_winter_event_state.GetName], soaking the bunks assigned to arrivals from [air_winter_refugee_source_state.GetName] in [air_winter_refugee_source_country.GetNameDef]. Fever has crossed the landing cordon, damaged sheds are closing one ward after another, and food queues have pressed against the guard line. Patients, guards, and dock workers have died inside the flooded perimeter. [ROOT.GetAirWinterGovernmentAuthority] must divide the failed cordon into treatment wards."
chaosx.fallout.39.exclusion_success.d: "Patrol craft off [air_winter_event_state.GetName] have held the line beyond the shore lights for thirty days. Boats able to sail from [air_winter_refugee_source_state.GetName] in [air_winter_refugee_source_country.GetNameDef] were directed away from the landing water. Passengers from disabled craft and people already ashore remain in guarded island shelters, and the reduced landing can be fed without opening another household camp. [ROOT.GetAirWinterGovernmentAuthority] has kept the closed-waters order in force."
chaosx.fallout.39.exclusion_failure.d: "Winter surf has scattered the patrol line off [air_winter_event_state.GetName], where damaged boats from [air_winter_refugee_source_state.GetName] in [air_winter_refugee_source_country.GetNameDef] drift among the shore craft and patrol launches. The forced arrivals already ashore have spread beyond guarded rooms as food stores empty, and several patrol crews are missing after night searches among the reefs. [ROOT.GetAirWinterGovernmentOfficial] must bring the surviving craft inside the landing water and count the losses."
chaosx.fallout.39.a: "Enter the open harbor in the winter register."
chaosx.fallout.39.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!, and §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§!. The state and country retain a successful open-harbor record."
chaosx.fallout.39.b: "Open reserve rooms for the overwhelmed sheds."
chaosx.fallout.39.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_moderate|0]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_moderate|0]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_major|0]§!, and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_minor|0]§!. Losses among local residents and rescue crews equal §R[?constant:air_winter_event_deaths.island_refugee_failure_percent|%3]§! of the remaining state population and enter the Deaths ledger. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!. The state and country retain an overwhelmed rescue-shed record."
chaosx.fallout.39.c: "Keep the quarantine register and shore rota."
chaosx.fallout.39.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. The state and country retain an orderly quarantine record."
chaosx.fallout.39.d: "Divide the failed cordon into treatment wards."
chaosx.fallout.39.d.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_major|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. Losses among local patients, guards, and dock workers equal §R[?constant:air_winter_event_deaths.island_refugee_failure_percent|%3]§! of the remaining state population and enter the Deaths ledger. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!. The state and country retain a failed quarantine-cordon record."
chaosx.fallout.39.e: "Keep the exclusion patrol on station."
chaosx.fallout.39.e.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_minor|0]§!, and §YRefugee Pressure§! falls by §G[?constant:air_winter_event_ledger.refugees_minor|0]§!. The state and country retain a maintained exclusion-line record."
chaosx.fallout.39.f: "Bring the patrols inside the landing water."
chaosx.fallout.39.f.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!, and §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_minor|0]§!. Local patrol and harbor losses equal §R[?constant:air_winter_event_deaths.island_refugee_failure_percent|%3]§! of the remaining state population and enter the Deaths ledger. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!. The state and country retain a broken exclusion-line record."

chaosx.fallout.40.t: "Ash on the Courtyard"
chaosx.fallout.40.d: "Ash settles inside the courtyards of [air_winter_event_state.GetName] despite sealed windows and covered vents. Protected work crews could keep pumps, kitchens, and roofs functioning, while a ration command could direct supplies by decree. [ROOT.GetAirWinterGovernmentAuthority] may instead withdraw residents into hardened buildings and leave entire streets to the cold."
chaosx.fallout.40.a: "Protect crews who keep the city working."
chaosx.fallout.40.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_major|0]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_moderate|0]§!, and §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_moderate|0]§!. We lose §R[?constant:air_winter_event_country.manpower_major|0]§! available Manpower, and the city reports after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§!."
chaosx.fallout.40.b: "Place every ration under a single command."
chaosx.fallout.40.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_severe|0]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_major|%1]§!, War Support rises by §G[?constant:air_winter_event_country.war_support_moderate|%1]§!, and the city reports after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§!."
chaosx.fallout.40.c: "Withdraw into the hardened buildings."
chaosx.fallout.40.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_emergency|0]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_extreme|0]§!, and §YReclamation§! falls by §R[?constant:air_winter_event_ledger.reclamation_moderate|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!, and the city reports after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§!."

chaosx.fallout.44.t: "Forty-Five Days Behind the Doors"
chaosx.fallout.44.crews.d: "Protected crews in [air_winter_event_state.GetName] learned to cross ash-filled streets in paired shifts, carrying filter cloth, repair kits, and sealed food tins. Their routes now connect pumps and kitchens that had once depended on separate offices and uncertain deliveries."
chaosx.fallout.44.command.d: "The ration command in [air_winter_event_state.GetName] has imposed a predictable food schedule at the cost of constant inspections. Households understand which depot serves them, while displaced residents accumulate around district boundaries where their papers carry less weight."
chaosx.fallout.44.hardened.d: "The hardened sites of [air_winter_event_state.GetName] remain warm, crowded, and difficult to leave. Streets outside have lost repair crews and familiar shops, while illness circulates through rooms whose doors stay closed against ash and cold."
chaosx.fallout.44.a: "Make the paired routes permanent."
chaosx.fallout.44.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§! and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!."
chaosx.fallout.44.b: "Keep the district ration schedule."
chaosx.fallout.44.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_minor|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!."
chaosx.fallout.44.c: "Maintain discipline inside the hardened sites."
chaosx.fallout.44.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YReclamation§! falls by §R[?constant:air_winter_event_ledger.reclamation_minor|0]§!."

chaosx.fallout.41.t: "The Withdrawal Council"
chaosx.fallout.41.d: "Shelter officers in [air_winter_event_state.GetName] can no longer place every household before nightfall. Local commanders want to hold the outer settlements, transport officials request authority for a controlled withdrawal, and engineers insist that a final round of fortification could keep part of the district alive. [ROOT.GetAirWinterGovernmentAuthority] must decide which promise it can honor."
chaosx.fallout.41.a: "Hold the outer settlements."
chaosx.fallout.41.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_moderate|0]§!, and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_major|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_moderate|%1]§!."
chaosx.fallout.41.b: "Map the routes for a controlled withdrawal."
chaosx.fallout.41.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!, and §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. No one leaves until a full evacuation order names a reception state."
chaosx.fallout.41.c: "Fortify the remaining local shelters."
chaosx.fallout.41.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_major|0]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_major|0]§!, and §YReclamation§! falls by §R[?constant:air_winter_event_ledger.reclamation_minor|0]§!. We spend §R[?constant:air_winter_event_country.command_power_major|0]§! Command Power."

chaosx.fallout.42.t: "The Archive Convoy"
chaosx.fallout.42.d: "A convoy can carry one working archive out of [air_winter_event_state.GetName] before the storage hall loses heat. Agronomists demand seed catalogs and soil records, physicians want case files and medical stores, and engineers ask for survey books and repair drawings. [ROOT.GetAirWinterGovernmentOfficial] must choose what future workers will inherit."
chaosx.fallout.42.a: "Load the seed catalogs and soil records."
chaosx.fallout.42.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_extreme|0]§! and §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!. We spend §R[?constant:air_winter_event_country.command_power_moderate|0]§! Command Power, and the convoy reports after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§!."
chaosx.fallout.42.b: "Load the case files and medical stores."
chaosx.fallout.42.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_severe|0]§! and §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!. We lose §R[?constant:air_winter_event_country.manpower_moderate|0]§! available Manpower, and the convoy reports after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§!."
chaosx.fallout.42.c: "Load the surveys and repair drawings."
chaosx.fallout.42.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_major|0]§!, §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!, and §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!. The convoy reports after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§!."

chaosx.fallout.45.t: "What Reached the Vault"
chaosx.fallout.45.agronomy.d: "The agronomy convoy from [air_winter_event_state.GetName] reached heated storage with its seed catalogs dry and legible. Field crews have begun matching surviving stock to soil that can still be worked, turning a rescued archive into instructions for the next planting."
chaosx.fallout.45.medical.d: "The medical convoy from [air_winter_event_state.GetName] delivered case files, medicines, and staff who understand the local pattern of cold injury. Clinics can now trace vulnerable households and recognize infections before crowded shelters spread them further."
chaosx.fallout.45.engineers.d: "The engineering convoy from [air_winter_event_state.GetName] brought survey books and annotated repair drawings into the vault. Crews have marked weak bridges, buried mains, and buildings that can be reopened with the fewest scarce parts."
chaosx.fallout.45.a: "Issue the planting instructions."
chaosx.fallout.45.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_moderate|0]§! and §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!."
chaosx.fallout.45.b: "Send the case lists to every clinic."
chaosx.fallout.45.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§! and §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!."
chaosx.fallout.45.c: "Publish the repair priorities."
chaosx.fallout.45.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§! and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_minor|0]§!."

chaosx.fallout.47.t: "Lamps Beneath the Empty Blocks"
chaosx.fallout.47.d: "Frost and ash fill the service streets beneath [air_winter_event_state.GetName], where collapsed facades rest on tram conduits, utility galleries, and depot roofs. Municipal engineers have marked one route that could be braced and surveyed. Military quartermasters demand immediate entry to buried stores, while fire, rail, and utility crews ask for district salvage licenses. [ROOT.GetAirWinterGovernmentAuthority] must decide who carries the lamps below."
chaosx.fallout.47.a: "Brace one route and map every chamber."
chaosx.fallout.47.a.tt: "We spend §R[?constant:air_winter_event_dead_city.survey_manpower_cost|0]§! Manpower, §R[?constant:air_winter_event_dead_city.survey_support_cost|0]§! Support Equipment, and §R[?constant:air_winter_event_dead_city.survey_motorized_cost|0]§! Motorized Equipment. In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_minor|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. The crews report after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.47.b: "Open the military depots under guard."
chaosx.fallout.47.b.tt: "We spend §R[?constant:air_winter_event_dead_city.military_manpower_cost|0]§! Manpower, §R[?constant:air_winter_event_dead_city.military_infantry_cost|0]§! Infantry Equipment, §R[?constant:air_winter_event_dead_city.military_motorized_cost|0]§! Motorized Equipment, and §R[?constant:air_winter_event_dead_city.military_fuel_cost|0]§! Fuel. In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_major|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. The crews report after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.47.c: "License district crews to strip the works."
chaosx.fallout.47.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. The crews report after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."

chaosx.fallout.48.t: "What Came Up from the Service Streets"
chaosx.fallout.48.survey_success.d: "The braced route beneath [air_winter_event_state.GetName] now carries numbered lamps from the tram conduit to three dry store rooms. Engineers recovered support kits, serviceable trucks, and three repair trains without losing the marked path. Their survey also identifies walls that can be relieved before another roof settles."
chaosx.fallout.48.survey_partial.d: "Survey crews beneath [air_winter_event_state.GetName] reached two store rooms before cracked columns closed the lower gallery. They brought out support kits and serviceable trucks, but the casualty clerks recorded workers lost during the retreat. The surviving map ends at a red line beneath an unstable block."
chaosx.fallout.48.survey_disaster.d: "A service roof beneath [air_winter_event_state.GetName] folded across the surveyed path while both lamp teams were below. Rescue crews reached the first brace line, then the street above began sinking into the conduit. The recovered bodies, lost tools, and damaged infrastructure have been entered in the district ledger."
chaosx.fallout.48.military_success.d: "Quartermasters in [air_winter_event_state.GetName] opened the buried depots behind a cordon and counted rifles, support kits, and trucks by lamp light. Several guards and laborers died clearing a blocked loading bay, but the sealed racks remained dry enough for issue. The depot inventory now bears [ROOT.GetAirWinterGovernmentOfficial]'s seal."
chaosx.fallout.48.military_partial.d: "The guarded crews in [air_winter_event_state.GetName] emptied the accessible depot racks before heat warped the lower doors. Infantry equipment, support kits, and trucks reached the surface, while the casualty roll and unstable loading bay show the price of the hurried entry."
chaosx.fallout.48.military_disaster.d: "The depot entry in [air_winter_event_state.GetName] struck a buried fuel pocket and drove fire through the loading galleries. Guards sealed the street after the military factory or nearest service road took further damage. Families are receiving names from a casualty list that contains few recovered bodies."
chaosx.fallout.48.licensed_success.d: "Licensed fire, rail, and utility crews in [air_winter_event_state.GetName] divided the service streets into marked districts and honored the boundary boards. They returned support kits, trucks, and repair trains through separate issue halls. The casualty ledger is short, and local foremen have supplied usable maps for the next reclamation survey."
chaosx.fallout.48.licensed_partial.d: "District crews in [air_winter_event_state.GetName] returned with support kits and a handful of running trucks, but several teams crossed into unbraced rooms before the boundary boards were posted. The dead are listed by union and ward, while surviving foremen surrender their incomplete maps to the central archive."
chaosx.fallout.48.licensed_disaster.d: "Competing crews beneath [air_winter_event_state.GetName] tore down one another's boundary boards and converged on the same store hall. A floor collapse trapped workers and damaged the nearest civilian works, military factory, or service road that still operated. The licenses are revoked beside a casualty register signed by every district."
chaosx.fallout.48.altered_return.d: "The last lamps rose from beneath [air_winter_event_state.GetName] in a formation no dispatcher ordered. Several survivors answer to shared names, recognize sealed rooms they never entered, and bear the same pale ridges across their hands. Physicians record nuclear residue, chemical contamination, and active disease agents in the surrounding blocks, yet none offers an ordinary explanation for what returned. The crews carried a few support kits and trucks to the cordon before the casualty clerks closed the street."
chaosx.fallout.48.a: "File the survey and issue the recovered machines."
chaosx.fallout.48.a.tt: "We gain §G[?constant:air_winter_event_dead_city.survey_success_support|0]§! Support Equipment, §G[?constant:air_winter_event_dead_city.survey_success_motorized|0]§! Motorized Equipment, and §G[?constant:air_winter_event_dead_city.survey_success_trains|0]§! Trains. In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§! and §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. The site is exhausted."
chaosx.fallout.48.b: "Seal the red line and honor the survey dead."
chaosx.fallout.48.b.tt: "We gain §G[?constant:air_winter_event_dead_city.survey_partial_support|0]§! Support Equipment and §G[?constant:air_winter_event_dead_city.survey_partial_motorized|0]§! Motorized Equipment. Civilian losses equal §R[?constant:air_winter_event_deaths.dead_city_survey_partial_percent|%3]§! of the remaining state population and enter the Deaths ledger. §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_minor|0]§!. The site is exhausted."
chaosx.fallout.48.c: "Close the conduit beneath the sunken street."
chaosx.fallout.48.c.tt: "Civilian losses equal §R[?constant:air_winter_event_deaths.dead_city_survey_disaster_percent|%3]§! of the remaining state population and enter the Deaths ledger. In §Y[air_winter_event_state.GetName]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_major|0]§! and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. Operational Infrastructure takes §R[?constant:air_winter_event_dead_city.building_damage|2]§! repairable damage when one level remains. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!. The site is exhausted."
chaosx.fallout.48.d: "Stamp the depot inventory for immediate issue."
chaosx.fallout.48.d.tt: "We gain §G[?constant:air_winter_event_dead_city.military_success_infantry|0]§! Infantry Equipment, §G[?constant:air_winter_event_dead_city.military_success_support|0]§! Support Equipment, and §G[?constant:air_winter_event_dead_city.military_success_motorized|0]§! Motorized Equipment. Civilian losses equal §R[?constant:air_winter_event_deaths.dead_city_military_success_percent|%3]§! of the remaining state population and enter the Deaths ledger. §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_minor|0]§!. The site is exhausted."
chaosx.fallout.48.e: "Issue the sound stores and wall off the loading bay."
chaosx.fallout.48.e.tt: "We gain §G[?constant:air_winter_event_dead_city.military_partial_infantry|0]§! Infantry Equipment, §G[?constant:air_winter_event_dead_city.military_partial_support|0]§! Support Equipment, and §G[?constant:air_winter_event_dead_city.military_partial_motorized|0]§! Motorized Equipment. Civilian losses equal §R[?constant:air_winter_event_deaths.dead_city_military_partial_percent|%3]§! of the remaining state population and enter the Deaths ledger. §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§! and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. The site is exhausted."
chaosx.fallout.48.f: "Publish the casualty list and seal the depot."
chaosx.fallout.48.f.tt: "Civilian losses equal §R[?constant:air_winter_event_deaths.dead_city_military_disaster_percent|%3]§! of the remaining state population and enter the Deaths ledger. In §Y[air_winter_event_state.GetName]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_severe|0]§! and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_major|0]§!. An operational Military Factory takes §R[?constant:air_winter_event_dead_city.building_damage|2]§! repairable damage, otherwise operational Infrastructure takes that damage. National Stability falls by §R[?constant:air_winter_event_country.stability_major|%1]§!. The site is exhausted."
chaosx.fallout.48.g: "Register the district shares and preserve the maps."
chaosx.fallout.48.g.tt: "We gain §G[?constant:air_winter_event_dead_city.licensed_success_support|0]§! Support Equipment, §G[?constant:air_winter_event_dead_city.licensed_success_motorized|0]§! Motorized Equipment, and §G[?constant:air_winter_event_dead_city.licensed_success_trains|0]§! Trains. Civilian losses equal §R[?constant:air_winter_event_deaths.dead_city_licensed_success_percent|%3]§! of the remaining state population and enter the Deaths ledger. §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!. The site is exhausted."
chaosx.fallout.48.h: "Accept the incomplete maps and close the licenses."
chaosx.fallout.48.h.tt: "We gain §G[?constant:air_winter_event_dead_city.licensed_partial_support|0]§! Support Equipment and §G[?constant:air_winter_event_dead_city.licensed_partial_motorized|0]§! Motorized Equipment. Civilian losses equal §R[?constant:air_winter_event_deaths.dead_city_licensed_partial_percent|%3]§! of the remaining state population and enter the Deaths ledger. §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!. The site is exhausted."
chaosx.fallout.48.i: "Revoke every license and mark the collapsed hall."
chaosx.fallout.48.i.tt: "Civilian losses equal §R[?constant:air_winter_event_deaths.dead_city_licensed_disaster_percent|%3]§! of the remaining state population and enter the Deaths ledger. In §Y[air_winter_event_state.GetName]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_severe|0]§! and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_moderate|0]§!. An operational Civilian Factory, Military Factory, or Infrastructure level takes §R[?constant:air_winter_event_dead_city.building_damage|2]§! repairable damage in that order. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!. The site is exhausted."
chaosx.fallout.48.j: "Quarantine the return and preserve every account."
chaosx.fallout.48.j.tt: "We gain §G[?constant:air_winter_event_dead_city.altered_return_support|0]§! Support Equipment and §G[?constant:air_winter_event_dead_city.altered_return_motorized|0]§! Motorized Equipment. Civilian losses equal §R[?constant:air_winter_event_deaths.dead_city_altered_return_percent|%3]§! of the remaining state population and enter the Deaths ledger. In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_extreme|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_major|0]§!, and §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_major|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_major|%1]§!. The site is exhausted."

chaosx.fallout.43.t: "Government Beneath the Frost"
chaosx.fallout.43.d: "In [air_winter_event_state.GetName], offices operate beside their own water barrels and sleeping rooms because travel between districts can no longer be assumed. [ROOT.GetAirWinterGovernmentAuthority] may remain publicly present through the losses, distribute authority among local committees, or place continuity under military control. The order will determine how commands survive beyond the heated center."
chaosx.fallout.43.a: "Keep the civil government visible and present."
chaosx.fallout.43.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_major|0]§! and §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_moderate|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.terminal_order_percent|%3]§! of the remaining state population and enter the Deaths ledger. National Stability rises by §G[?constant:air_winter_event_country.stability_major|%1]§!, and the order is reviewed after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§!."
chaosx.fallout.43.b: "Distribute authority among local committees."
chaosx.fallout.43.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_extreme|0]§! and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_extreme|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_moderate|%1]§!, and the order is reviewed after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§!."
chaosx.fallout.43.c: "Place continuity under military command."
chaosx.fallout.43.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_major|0]§! and §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_major|%1]§!, Stability falls by §R[?constant:air_winter_event_country.stability_major|%1]§!, and the order is reviewed after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§!."

chaosx.fallout.46.t: "The Orders That Remained"
chaosx.fallout.46.public.d: "Civil offices in [air_winter_event_state.GetName] remained open long enough to coordinate clinics, kitchens, and burial details under one visible authority. The cost appears in empty desks and family notices, yet residents still know where an appeal can be carried."
chaosx.fallout.46.decentralized.d: "Local committees across [air_winter_event_state.GetName] now issue orders suited to streets that central officials cannot reach. Their records differ and their borders move with shelter capacity, but repair work continues wherever a committee can gather tools and residents."
chaosx.fallout.46.military.d: "Military command in [air_winter_event_state.GetName] has kept couriers, guards, and fuel details moving through the cold. Civil offices work within that chain of command, gaining reliable shelter while surrendering much of their discretion."
chaosx.fallout.46.a: "Keep the civil desks open."
chaosx.fallout.46.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§! and §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!."
chaosx.fallout.46.b: "Recognize the local committees."
chaosx.fallout.46.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§! and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_minor|0]§!."
chaosx.fallout.46.c: "Retain the continuity command."
chaosx.fallout.46.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§! and §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_minor|%1]§!."

chaosx.fallout.50.t: "Water Under the Ice"
chaosx.fallout.50.d: "Dark water has appeared beneath broken ice in [air_winter_event_state.GetName], and afternoon roofs shed melt before refreezing at dusk. Farmers want a cautious return to the fields, transport officers want roads reopened at once, and physicians warn that thaw water carries waste from frozen pipes. [ROOT.GetAirWinterGovernmentAuthority] must choose the first use of warmer hours."
chaosx.fallout.50.a: "Work the fields in measured shifts."
chaosx.fallout.50.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_major|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_major|0]§!, and §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_major|0]§!. The ground answers after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.50.b: "Open the roads before the mud deepens."
chaosx.fallout.50.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_extreme|0]§!, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_moderate|0]§!, and §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_minor|0]§!. We spend §R[?constant:air_winter_event_country.command_power_moderate|0]§! Command Power, and the ground answers after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."
chaosx.fallout.50.c: "Inspect wells and mains before any reopening."
chaosx.fallout.50.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YWater Security§! rises by §G[?constant:air_winter_event_ledger.water_major|0]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_severe|0]§!, and §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!. The ground answers after §Y[?constant:air_winter_event_runtime.delayed_standard_days|0] days§!."

chaosx.fallout.51.t: "The Ground Answers"
chaosx.fallout.51.durable.d: "The thaw in [air_winter_event_state.GetName] has held through a full month without sealing the roads and fields beneath fresh ice. Water drains into cleared channels, repair crews can reach exposed structures, and residents have begun moving work out of the shelter corridors."
chaosx.fallout.51.false.d: "Warm afternoons in [air_winter_event_state.GetName] ended beneath a renewed night freeze. Melt water split roadbeds and entered damaged mains before turning to ice, leaving repair crews with broken surfaces, contaminated wells, and promises that arrived too early."
chaosx.fallout.51.a: "Build the recovery calendar around this thaw."
chaosx.fallout.51.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, and §YDisease Pressure§! falls by §G[?constant:air_winter_event_ledger.disease_moderate|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!."
chaosx.fallout.51.b: "Repair the roads and disinfect the wells."
chaosx.fallout.51.b.tt: "Infrastructure in §Y[air_winter_event_state.GetName]§! takes §R[?constant:air_winter_event_outcome.infrastructure_damage|1]§! damage, §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_major|0]§!, and §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!."

chaosx.fallout.60.t: "The Second Winter in [air_winter_event_state.GetName]"
chaosx.fallout.60.boreal.d: "A second severe winter has locked the timber sidings and forest roads of [air_winter_event_state.GetName]. Cellar stocks are smaller than last year, and repaired boilers have begun failing under longer firing hours. [ROOT.GetAirWinterGovernmentAuthority] must decide which settlements remain connected to heat and bread."
chaosx.fallout.60.maritime.d: "Cold rain has returned to [air_winter_event_state.GetName], and harbor ice now holds around quays that stayed open during the previous winter. Wet grain is moving inland through half-heated warehouses, and coastal households have filled every dry upper floor. [ROOT.GetAirWinterGovernmentAuthority] must assign the remaining fuel routes."
chaosx.fallout.60.mediterranean.d: "Night frost has split terrace channels and roof cisterns across [air_winter_event_state.GetName] for a second winter. The surviving groves need guarded water, and crowded hill towns need fuel that cannot reach both. [ROOT.GetAirWinterGovernmentAuthority] must choose where the transport columns will stop."
chaosx.fallout.60.arid.d: "The second winter in [air_winter_event_state.GetName] brings hard night freezes after days of ash-laden wind. Pump housings crack after sunset, road crews lose their markers under drifting dust, and isolated wells draw longer queues. [ROOT.GetAirWinterGovernmentAuthority] must concentrate heat for the next cold night."
chaosx.fallout.60.tropical.d: "Cold seasonal rain has returned to [air_winter_event_state.GetName], soaking field stores and shelter walls that never dried after the first winter. River roads are soft, clinic bedding is damp, and food convoys lose cargo to mold. [ROOT.GetAirWinterGovernmentAuthority] must choose a smaller network that can still be supplied."
chaosx.fallout.60.equatorial.d: "A second season of cold rain has settled over the river landings of [air_winter_event_state.GetName]. Raised floors remain wet, ferry engines consume scarce fuel, and inland shelters send sick families toward the crowded ports. [ROOT.GetAirWinterGovernmentAuthority] must decide which routes receive heat and guards."
chaosx.fallout.60.highland.d: "The passes above [air_winter_event_state.GetName] have closed again under crusted snow and ash. Pack routes are losing animals, bridge timbers split each night, and lower settlements have no room for every household descending from the heights. [ROOT.GetAirWinterGovernmentAuthority] must issue the winter movement order."
chaosx.fallout.60.oceanic.d: "A second run of cold squalls has cut the island harbors of [air_winter_event_state.GetName] from one another. Salt water reaches low storehouses, small craft cannot cross the rough channels, and the largest heated settlement is already rationing bunks. [ROOT.GetAirWinterGovernmentAuthority] must decide how the islands will share fuel and shelter."
chaosx.fallout.60.polar.d: "The returning winter has sealed the coastal approaches of [air_winter_event_state.GetName] beneath thicker ice. Whiteouts erase marked tracks, generator crews are cannibalizing last year's repairs, and remote stations have missed two supply runs. [ROOT.GetAirWinterGovernmentAuthority] must decide which line can survive another season."
chaosx.fallout.60.a: "Reopen the ration corridors and move heat with the food."
chaosx.fallout.60.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_major|0]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_moderate|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, and §YCategory Damage§! rises by §R[?constant:air_winter_event_ledger.category_damage_moderate|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.second_winter_ration_percent|%3]§! of the remaining state population and enter the Deaths ledger. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!. The corridors hold after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§! only if both §YShelter Capacity§! and §YFood Reserve§! remain above §Y[?constant:air_winter_event_outcome.second_winter_ledger_threshold|0]§!."
chaosx.fallout.60.b: "Withdraw exposed households to the strongest settlements."
chaosx.fallout.60.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_major|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_major|0]§!, §YExposure§! falls by §G[?constant:air_winter_event_ledger.exposure_major|0]§!, and §YCategory Damage§! rises by §R[?constant:air_winter_event_ledger.category_damage_major|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.second_winter_withdrawal_percent|%3]§! of the remaining state population and enter the Deaths ledger. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!. The receiving settlements stabilize after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§! only if both §YReclamation§! and §YShelter Capacity§! remain above §Y[?constant:air_winter_event_outcome.second_winter_ledger_threshold|0]§!."
chaosx.fallout.60.c: "Keep every depot and junction under military heating orders."
chaosx.fallout.60.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_major|0]§!, §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_major|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§!, and §YCategory Damage§! rises by §R[?constant:air_winter_event_ledger.category_damage_severe|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.second_winter_military_percent|%3]§! of the remaining state population and enter the Deaths ledger. We spend §R[?constant:air_winter_event_country.command_power_major|0]§! Command Power, and National War Support rises by §G[?constant:air_winter_event_country.war_support_moderate|%1]§!. The junction network holds after §Y[?constant:air_winter_event_runtime.delayed_long_days|0] days§! only if §YBuilding Damage Pressure§! remains below §Y[?constant:air_winter_event_outcome.second_winter_building_pressure_ceiling|0]§! and §YShelter Capacity§! remains above §Y[?constant:air_winter_event_outcome.second_winter_ledger_threshold|0]§!."

chaosx.fallout.61.t: "What Survived the Returning Cold"
chaosx.fallout.61.rations_held.d: "The ration corridors through [air_winter_event_state.GetName] kept heated kitchens within reach of the marked settlements. Drivers learned which bridges held after night frost, and local stores can now trade reserve food without losing an entire load to a closed road."
chaosx.fallout.61.rations_failed.d: "Several ration corridors in [air_winter_event_state.GetName] failed when food stores and heated rooms emptied together. Families remained along roads that no longer carried regular trucks, and clinic teams now move between burial rooms and improvised kitchens."
chaosx.fallout.61.withdrawal_settled.d: "The receiving settlements of [air_winter_event_state.GetName] placed withdrawn households in repaired rooms and assigned them to water, kitchen, and road crews. Separated families are finding one another through local registers, and the abandoned outer routes no longer consume daily patrols."
chaosx.fallout.61.withdrawal_scattered.d: "The withdrawal from exposed parts of [air_winter_event_state.GetName] broke into columns that reached different settlements with little food. Unregistered households occupy sheds, stations, and damaged schools, and search parties still follow abandoned route markers after each storm."
chaosx.fallout.61.military_held.d: "Military heating orders kept the main depots and junctions of [air_winter_event_state.GetName] operating through the coldest weeks. Repair crews can now take over protected boiler rooms and guarded stores that no longer require a full field command."
chaosx.fallout.61.military_fractured.d: "The heated junction system in [air_winter_event_state.GetName] fractured under damaged rails, sick crews, and fuel demands from too many sites. Several depots lost heat in the same week, leaving broken roofs and crowded platforms around stores that could no longer be moved."
chaosx.fallout.61.a: "Keep the corridor schedule through the next cold cycle."
chaosx.fallout.61.a.tt: "In §Y[air_winter_event_state.GetName]§!, §YFood Reserve§! rises by §G[?constant:air_winter_event_ledger.food_minor|0]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_moderate|0]§!, and §YCategory Damage§! falls by §G[?constant:air_winter_event_ledger.category_damage_recovery|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!."
chaosx.fallout.61.b: "Open burial rooms and clinic stores along the failed routes."
chaosx.fallout.61.b.tt: "In §Y[air_winter_event_state.GetName]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_event_ledger.disease_moderate|0]§! and §YCategory Damage§! rises by §R[?constant:air_winter_event_ledger.category_damage_moderate|0]§!. Further civilian losses equal §R[?constant:air_winter_event_deaths.second_winter_failure_percent|%3]§! of the remaining state population and enter the Deaths ledger."
chaosx.fallout.61.c: "Register the receiving settlements and reunite separated households."
chaosx.fallout.61.c.tt: "In §Y[air_winter_event_state.GetName]§!, §YRefugee Pressure§! falls by §G[?constant:air_winter_event_ledger.refugees_moderate|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!, and §YCategory Damage§! falls by §G[?constant:air_winter_event_ledger.category_damage_recovery|0]§!."
chaosx.fallout.61.d: "Send kitchens and search parties after the scattered columns."
chaosx.fallout.61.d.tt: "In §Y[air_winter_event_state.GetName]§!, §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_major|0]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_minor|0]§!, and §YCategory Damage§! rises by §R[?constant:air_winter_event_ledger.category_damage_moderate|0]§!. Further civilian losses equal §R[?constant:air_winter_event_deaths.second_winter_failure_percent|%3]§! of the remaining state population and enter the Deaths ledger."
chaosx.fallout.61.e: "Return depot heat to civilian repair crews."
chaosx.fallout.61.e.tt: "In §Y[air_winter_event_state.GetName]§!, §YBuilding Damage Pressure§! falls by §G[?constant:air_winter_event_ledger.building_pressure_major|0]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_minor|0]§!, and §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_minor|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_minor|%1]§!."
chaosx.fallout.61.f: "Rebuild the broken junctions under civil authority."
chaosx.fallout.61.f.tt: "In §Y[air_winter_event_state.GetName]§!, §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_event_ledger.building_pressure_major|0]§! and §YCategory Damage§! rises by §R[?constant:air_winter_event_ledger.category_damage_major|0]§!. An exposed building may take immediate damage. Further civilian losses equal §R[?constant:air_winter_event_deaths.second_winter_failure_percent|%3]§! of the remaining state population and enter the Deaths ledger. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!."

chaosx.fallout.201.t: "The Abandonment Vote"
chaosx.fallout.201.d: "Delegates from [air_winter_response_state.GetName] have counted the heated rooms, guarded stores, open roads and occupied wards. The surviving councils agree that the state cannot remain divided between a national promise and local withdrawal. [ROOT.GetAirWinterGovernmentAuthority] must either keep the state within the national emergency system or recognize the shelter councils as the authority responsible for those who remain."
chaosx.fallout.201.a: "Keep the state under national authority."
chaosx.fallout.201.a.tt: "In §Y[air_winter_response_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_extreme|0]§!, §YShelter Capacity§! rises by §G[?constant:air_winter_event_ledger.shelter_major|0]§!, §YFood Reserve§! falls by §R[?constant:air_winter_event_ledger.food_major|0]§!, and §YExposure§! rises by §R[?constant:air_winter_event_ledger.exposure_major|0]§!. National War Support rises by §G[?constant:air_winter_event_country.war_support_major|%1]§!."
chaosx.fallout.201.b: "Recognize the shelter councils."
chaosx.fallout.201.b.tt: "In §Y[air_winter_response_state.GetName]§!, §YAdaptation§! rises by §G[?constant:air_winter_event_ledger.adaptation_major|0]§!, §YReclamation§! rises by §G[?constant:air_winter_event_ledger.reclamation_moderate|0]§!, §YShelter Capacity§! falls by §R[?constant:air_winter_event_ledger.shelter_moderate|0]§!, and §YRefugee Pressure§! rises by §R[?constant:air_winter_event_ledger.refugees_major|0]§!. National Stability rises by §G[?constant:air_winter_event_country.stability_minor|%1]§!."

chaosx.fallout.202.t: "The Decontamination Crews Return"
chaosx.fallout.202.d: "Protected crews in [air_winter_response_state.GetName] have opened the sealed wash stations and returned from the first cleared district. Their instruments, water accounts and casualty sheets show whether the state can support a clean corridor or whether the attempt spread contaminated water through already weakened shelters."
chaosx.fallout.202.a: "The clean corridor holds."
chaosx.fallout.202.a.tt: "In §Y[air_winter_response_state.GetName]§!, §YExposure§! falls by §G[?constant:air_winter_response_result.decontamination_exposure_reduction|0]§!, §YDisease Pressure§! falls by §G[?constant:air_winter_response_result.decontamination_disease_reduction|0]§!, §YWater Security§! falls by §R[?constant:air_winter_response_result.decontamination_water_cost|0]§!, and §YReclamation§! rises by §G[?constant:air_winter_response_result.decontamination_reclamation_gain|0]§!."
chaosx.fallout.202.b: "The wash stations are sealed."
chaosx.fallout.202.b.tt: "In §Y[air_winter_response_state.GetName]§!, §YExposure§! rises by §R[?constant:air_winter_response_result.decontamination_failure_exposure|0]§!, §YDisease Pressure§! rises by §R[?constant:air_winter_response_result.decontamination_failure_disease|0]§!, §YBuilding Damage Pressure§! rises by §R[?constant:air_winter_response_result.decontamination_failure_building_pressure|0]§!, and §YWater Security§! falls by §R[?constant:air_winter_response_result.decontamination_water_cost|0]§!. Civilian losses equal §R[?constant:air_winter_event_deaths.decontamination_failure_percent|%3]§! of the remaining state population and enter the Deaths ledger. National Stability falls by §R[?constant:air_winter_event_country.stability_minor|%1]§!."

chaosx.fallout.203.t: "Conditions Overtook the Winter Order"
chaosx.fallout.203.d: "Winter conditions have overtaken the order. The named state may have changed hands, the source shore may no longer hold enough people for a safe transfer, or the crews and stores pledged to the measure may no longer be available. Nothing is moved, unused transports and stores remain with their current commands, and the invalid field order is struck from the winter ledger."
chaosx.fallout.203.a: "Withdraw the invalid order."
chaosx.fallout.203.a.tt: "No population, stores, transport, or state ledger changes are applied."
