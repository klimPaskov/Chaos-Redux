# Rat sub-units and locked templates.
rat_swarm: "Swarm Columns"
rat_swarm_desc: "Dense bodies that overwhelm urban streets, forests, marshes, and ruined districts through numbers."
rat_brutes: "Mutated Brutes"
rat_brutes_desc: "Slow shock bodies built to break fortifications and hold under concentrated fire."
rat_burrowers: "Burrowers"
rat_burrowers_desc: "Tunnel fighters that move through difficult ground and open unexpected routes."
rat_carrion_guard: "Carrion Guard"
rat_carrion_guard_desc: "Defensive bodies that anchor capitals and established burrow nodes."
rat_dock_stowaways: "Dock Stowaways"
rat_dock_stowaways_desc: "Coastal bodies that hide in cargo and support scripted overseas seeding."
rat_tunnelers: "Tunnelers"
rat_tunnelers_desc: "A support brood that opens passages beneath defended ground."
black_plague_rat_template_swarm: "Rat Brood"
black_plague_rat_template_shock: "Rat Shock Brood"
black_plague_rat_template_burrow: "Rat Burrow Column"
black_plague_rat_template_guard: "Rat Carrion Guard"
black_plague_rat_template_dock: "Rat Dock Stowaways"

# Rat Nation spirit lifecycle. Dedicated icon assets are required for runtime
# presentation and are intentionally left as an explicit asset blocker.
black_plague_rat_brood_instinct: "Uncounted Brood"
black_plague_rat_brood_instinct_desc: "The swarm has no human reserve pool. It grows through brood pulses and remains outside normal recruitment."
black_plague_rat_no_civilian_economy: "No Civilian Rations"
black_plague_rat_no_civilian_economy_desc: "The brood has no civilian economy to sustain. Its strength comes from plague territory, burrows, and captured stores."
black_plague_rat_dominion: "Born of Pestilence"
black_plague_rat_dominion_desc: "Infected ground sustains the brood and weakens the strain of movement through the plague corridor."
black_plague_rat_king_dominion: "Crowned Brood"
black_plague_rat_king_dominion_desc: "The crowned swarm directs its plague dominion through a single royal command."
