l_english:
 chaosx.fallout.217.t: "Filters Fail at Night"
 chaosx.fallout.217.d: "The lower shelter at [?fallout_event_217_filters_state_id.GetName] still has a working airlock, but the filter ledger has fallen below the safe band. [ROOT.GetAirWinterGovernmentAuthority] must choose how [ROOT.GetAirWinterGovernmentOfficial] will keep the clinic, food rooms, and night crews breathing through the next fortnight."
 chaosx.fallout.217.a: "Seal the lower levels"
 chaosx.fallout.217.a.tt: "Spend §Y[?constant:fallout_event_217_cost.seal_filters|0]§! Filters and §Y[?constant:fallout_event_217_cost.seal_medicine|0]§! Medicine. The sealed levels will be reviewed after §Y[?constant:fallout_event_217_timing.result_delay_days|0] days§!."
 chaosx.fallout.217.b: "Rotate the surface teams"
 chaosx.fallout.217.b.tt: "Spend §Y[?constant:fallout_event_217_cost.rotate_filters|0]§! Filters and §Y[?constant:fallout_event_217_cost.rotate_food|0]§! Food. Shorter shifts will be reviewed after §Y[?constant:fallout_event_217_timing.result_delay_days|0] days§!."
 chaosx.fallout.217.c: "Open emergency vents"
 chaosx.fallout.217.c.tt: "Spend §Y[?constant:fallout_event_217_cost.vent_scrap|0]§! Scrap and §Y[?constant:fallout_event_217_cost.vent_recognition|0]§! Recognition. The vent plan will be reviewed after §Y[?constant:fallout_event_217_timing.result_delay_days|0] days§!."
 chaosx.fallout.217.e: "Ration filters by household"
 chaosx.fallout.217.e.tt: "Spend §Y[?constant:fallout_event_217_cost.household_filters|0]§! Filters and §Y[?constant:fallout_event_217_cost.household_recognition|0]§! Recognition. The household ledger will be reviewed after §Y[?constant:fallout_event_217_timing.result_delay_days|0] days§!."

 chaosx.fallout.219.t: "The Sealed Levels Report"
 chaosx.fallout.219.success.d: "The clinic in [?fallout_event_217_filters_state_id.GetName] kept the lower levels closed while [ROOT.GetAirWinterGovernmentOfficial] moved medicine and clean filters through one guarded hatch. Night crews now work inside a measured air column, and [ROOT.GetAirWinterGovernmentAuthority] has a rule the shelter can inspect."
 chaosx.fallout.219.partial.d: "The seal around [?fallout_event_217_filters_state_id.GetName] held in the clinic and food rooms, but a service shaft stayed open during the coldest shifts. The lower levels remain usable with a narrower ration and a visible debt to the filter stores."
 chaosx.fallout.219.failure.d: "A cracked hatch broke the seal at [?fallout_event_217_filters_state_id.GetName]. The Deaths register carries the night crew losses, while [ROOT.GetAirWinterGovernmentAuthority] must answer for an airlock that failed under the shelter's own watch."
 chaosx.fallout.219.a: "Send the seal ledger to the clinic"
 chaosx.fallout.219.a.tt: "Resolve the sealed-level report and schedule a filter audit in §Y[?constant:fallout_event_217_timing.callback_delay_days|0] days§!."

 chaosx.fallout.220.t: "The Rotating Team Report"
 chaosx.fallout.220.success.d: "The surface crews at [?fallout_event_217_filters_state_id.GetName] changed shifts before the frost reached the intake tower. Food stores covered the handover, adaptation rose among the workers, and [ROOT.GetAirWinterGovernmentOfficial] can keep one reclamation route open without exhausting a single crew."
 chaosx.fallout.220.partial.d: "The rotation at [?fallout_event_217_filters_state_id.GetName] saved the strongest crews, but the food ledger could not cover every handover. The night route remains open with slower work and a memory of who was left outside the warm room."
 chaosx.fallout.220.failure.d: "A late rotation left the intake tower at [?fallout_event_217_filters_state_id.GetName] exposed through the dark hours. The Deaths register records the crews who did not return, and [ROOT.GetAirWinterGovernmentAuthority] faces a shelter that can no longer promise equal relief."
 chaosx.fallout.220.a: "Send the shift roster to the depot"
 chaosx.fallout.220.a.tt: "Resolve the rotating-team report and schedule a route review in §Y[?constant:fallout_event_217_timing.callback_delay_days|0] days§!."

 chaosx.fallout.221.t: "The Emergency Vent Report"
 chaosx.fallout.221.success.d: "Scrap crews opened controlled vents around the ash-choked rooms at [?fallout_event_217_filters_state_id.GetName]. The shelter traded some warmth for clean circulation, and the recognition ledger now names the haulers who made the vent plan possible."
 chaosx.fallout.221.partial.d: "The vents at [?fallout_event_217_filters_state_id.GetName] cleared the clinic but left the sleeping rooms in a cold draft. Reclamation gained a narrow route, while [ROOT.GetAirWinterGovernmentOfficial] must ration warmth until the next inspection."
 chaosx.fallout.221.failure.d: "The emergency vent at [?fallout_event_217_filters_state_id.GetName] opened into a pocket of ash. The Deaths register records the first crews at the grate, and the shelter now treats every open duct as a possible breach."
 chaosx.fallout.221.a: "Send the vent map to the watch"
 chaosx.fallout.221.a.tt: "Resolve the emergency-vent report and schedule a duct inspection in §Y[?constant:fallout_event_217_timing.callback_delay_days|0] days§!."

 chaosx.fallout.222.t: "The Household Ledger Report"
 chaosx.fallout.222.success.d: "The household ledger at [?fallout_event_217_filters_state_id.GetName] assigned filters by room, age, and night duty. Recognition rose because the counts were read aloud, and [ROOT.GetAirWinterGovernmentAuthority] can defend the ration rule before every shelter district."
 chaosx.fallout.222.partial.d: "The household ledger at [?fallout_event_217_filters_state_id.GetName] covered the clinic and the first family rooms, but the outer bunks received thinner filters. The rule remains legible, although the shelter has marked the families who paid the largest share."
 chaosx.fallout.222.failure.d: "The household counts at [?fallout_event_217_filters_state_id.GetName] broke down when the last filters were divided. The Deaths register carries the rooms left without cover, and [ROOT.GetAirWinterGovernmentOfficial] must face the households that saw the ration fail."
 chaosx.fallout.222.a: "Send the household count to the council"
 chaosx.fallout.222.a.tt: "Resolve the household-ledger report and schedule a public filter review in §Y[?constant:fallout_event_217_timing.callback_delay_days|0] days§!."

 chaosx.fallout.227.t: "The Filter Audit"
 chaosx.fallout.227.success.d: "The delayed audit returned to [?fallout_event_217_filters_state_id.GetName] with clean counts and a working airlock. The shelter has enough filters and medicine to train another night crew, while [ROOT.GetAirWinterGovernmentAuthority] turns the chosen policy into a standing rule."
 chaosx.fallout.227.partial.d: "The delayed audit at [?fallout_event_217_filters_state_id.GetName] found a usable reserve, but the policy still depends on careful rationing. The clinic can train a smaller crew and the household districts have kept their own record of the missing margin."
 chaosx.fallout.227.failure.d: "The delayed audit at [?fallout_event_217_filters_state_id.GetName] found another breach behind the first repair. Filters and medicine have fallen below a safe reserve, the Deaths register remains open, and [ROOT.GetAirWinterGovernmentAuthority] must carry the failure into the next shelter season."
 chaosx.fallout.227.a: "Seal the audit record"
 chaosx.fallout.227.a.tt: "Resolve the filter audit, preserve the policy memory, and release both delayed cleanup receipts."

