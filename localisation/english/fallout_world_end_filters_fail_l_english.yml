 fallout.event_log.filters_fail.detail.rotate_success: "Rotating surface teams kept the intake route open and raised worker adaptation."
 fallout.event_log.filters_fail.detail.rotate_partial: "The rotation saved the strongest crews while food limits narrowed the route."
 fallout.event_log.filters_fail.detail.rotate_failure: "A late rotation exposed the intake tower and cost crews to the night."
 fallout.event_log.filters_fail.detail.vent_success: "Controlled vents cleared the ash-choked rooms and opened a reclamation route."
 fallout.event_log.filters_fail.detail.vent_partial: "The vents cleared the clinic but left sleeping rooms in a cold draft."
 fallout.event_log.filters_fail.detail.vent_failure: "An emergency vent opened into ash and turned every duct into a possible breach."
 fallout.event_log.filters_fail.detail.household_success: "The household ledger made filter rations legible across the shelter districts."
 fallout.event_log.filters_fail.detail.household_partial: "The household ledger covered the inner rooms while outer bunks received less cover."
 fallout.event_log.filters_fail.detail.household_failure: "The household count failed when the last filters were divided."
 fallout.event_log.filters_fail.detail.callback_success: "The delayed audit certified a working airlock and a standing shelter policy."
 fallout.event_log.filters_fail.detail.callback_partial: "The delayed audit found a usable reserve under a narrower ration."
 fallout.event_log.filters_fail.detail.callback_failure: "The delayed audit found another breach and kept the Deaths register open."
