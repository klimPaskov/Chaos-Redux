 fallout.event_log.filters_fail.detail: "[GetFalloutEvent217EventLogDetail]"
 fallout.event_log.filters_fail.detail.seal_success: "The sealed levels held a measured air column for the clinic and night crews."
 fallout.event_log.filters_fail.detail.seal_partial: "The sealed levels held around the clinic, but a service shaft weakened the ration."
