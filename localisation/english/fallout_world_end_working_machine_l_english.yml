 chaosx.fallout.352.t: "The Working Machine"
 chaosx.fallout.352.d: "Behind the ash fence, an automated plant keeps moving without a supervisor. Its conveyor lights mark a route through the frost, and a relay voice repeats yesterday's production order in the dialect of the old capital. The machine can still serve the settlement, but no one can say whether its safety rules survived the fire."
 chaosx.fallout.352.a: "Integrate the machine into the civil command"
 chaosx.fallout.352.b: "Dismantle it for parts"
 chaosx.fallout.352.c: "Let the protocol council interpret it"
 chaosx.fallout.352.d_option: "Isolate the plant and observe"
 chaosx.fallout.352.a.tt: "Spend 10 Power, 6 Scrap, and 5 Recognition. The plant will be placed under a human maintenance roster."
 chaosx.fallout.352.b.tt: "Spend 5 Scrap, 6 Shelter, and 3 Filters. The crew will strip useful parts before the relay logic can spread."
 chaosx.fallout.352.c.tt: "Spend 4 Medicine, 8 Recognition, and 6 Cohesion. A protocol council will give the machine a place in the settlement's law."
 chaosx.fallout.352.d_option.tt: "Spend 7 Power, 5 Filters, and 4 Medicine. The plant will be sealed while technicians record every instruction."
 chaosx.fallout.354.t: "The Machine Makes a Choice"
 chaosx.fallout.354.integrate.success.d: "The maintenance roster takes control of the relay schedule. The plant begins producing useful parts for the cold districts, and every command is signed by a living supervisor before the conveyors move."
 chaosx.fallout.354.integrate.partial.d: "The civil roster can hold the machine to a narrow schedule. It provides some parts, but one relay still repeats orders from the vanished capital."
 chaosx.fallout.354.integrate.failure.d: "The roster misses a hidden maintenance rule. A conveyor tears through the workshop, and the machine sends a false evacuation order to the frostbound ward."
 chaosx.fallout.354.dismantle.success.d: "The crew strips the drive units without opening the sealed logic cabinet. The recovered motors keep the water pumps running, while the silent plant becomes a source of measured salvage."
 chaosx.fallout.354.dismantle.partial.d: "The crew takes the obvious motors and leaves the deep cabinets untouched. The settlement gains parts, but the remaining relays continue to blink through the dark."
 chaosx.fallout.354.dismantle.failure.d: "A cutting torch reaches a pressurized line. The crew escapes with little salvage, and the damaged plant begins releasing hot ash into the service yard."
 chaosx.fallout.354.venerate.success.d: "The protocol council gives the machine a place in the settlement's law. Its forecasts are read beside the weather board, and the first machine keepers learn to challenge an order without silencing the plant."
 chaosx.fallout.354.venerate.partial.d: "The council records the machine's instructions as a civic text, but several families refuse its authority. The plant continues on a reduced cycle while the argument spreads through the shelters."
 chaosx.fallout.354.venerate.failure.d: "The council mistakes a diagnostic loop for a command. The plant locks its doors, and the settlement must decide whether a machine that speaks in the old capital's voice still deserves a hearing."
 chaosx.fallout.354.isolate.success.d: "The outer doors hold and the observation crew maps each relay without touching the controls. The plant becomes a quiet reserve, available when the settlement can afford to test another instruction."
 chaosx.fallout.354.isolate.partial.d: "The seal protects the control room, but cold air enters through the loading bay. The observation crew keeps one circuit alive and records a warning for the next thaw."
 chaosx.fallout.354.isolate.failure.d: "The isolation shutters fail before the crew finishes its record. The plant goes dark, and a burst of contaminated dust forces the nearest ward to move uphill."
 chaosx.fallout.354.a: "Record the protocol and prepare the next inspection"
 chaosx.fallout.354.a.tt: "Resolve the machine outcome and schedule its delayed inspection."
 chaosx.fallout.356.t: "The Next Instruction"
 chaosx.fallout.356.success.d: "The inspection finds a machine that can be questioned. Its next instruction is copied into the settlement archive, and the plant's place in the cold districts is understood."
 chaosx.fallout.356.partial.d: "The inspection preserves one useful circuit, but the plant still demands more filters than the stores can spare. The crew marks a safer test for another season."
 chaosx.fallout.356.failure.d: "The inspection finds a silent relay and ash inside the service cabinets. The plant is closed, and the settlement loses people while the contaminated ward is cleared."
 chaosx.fallout.356.a: "Close the machine record"
 chaosx.fallout.356.a.tt: "Resolve the delayed inspection and release the chain's cleanup receipt."
 fallout.event_log.working_machine.name: "The Working Machine"
 fallout.event_log.working_machine.detail: "An automated facility was claimed after the technical manual memory closed. The settlement recorded its policy, its delayed inspection, and the machine's place in local law."
 fallout.event_log.working_machine.integrate_success: "A human maintenance roster integrated the plant and kept its commands supervised."
 fallout.event_log.working_machine.integrate_partial: "The plant accepted a narrow civil schedule while one old relay kept repeating."
 fallout.event_log.working_machine.integrate_failure: "A missed maintenance rule damaged the workshop and sent a false evacuation order."
 fallout.event_log.working_machine.dismantle_success: "The crew recovered drive units and left the sealed logic cabinet untouched."
 fallout.event_log.working_machine.dismantle_partial: "The crew recovered the obvious motors while the deep cabinets continued to blink."
 fallout.event_log.working_machine.dismantle_failure: "A cutting torch opened a pressurized line and pushed hot ash into the service yard."
 fallout.event_log.working_machine.venerate_success: "A protocol council gave the machine a place in settlement law and learned to question it."
 fallout.event_log.working_machine.venerate_partial: "The council recorded the machine as civic text while families argued over its authority."
 fallout.event_log.working_machine.venerate_failure: "A diagnostic loop was mistaken for a command and the plant locked its doors."
 fallout.event_log.working_machine.isolate_success: "The sealed plant was mapped and kept as a quiet reserve for a safer test."
 fallout.event_log.working_machine.isolate_partial: "The control room was protected while cold air entered through the loading bay."
 fallout.event_log.working_machine.isolate_failure: "The shutters failed and contaminated dust forced the nearest ward uphill."
 fallout.event_log.working_machine.callback_success: "The inspection found a machine that could be questioned and kept in local service."
 fallout.event_log.working_machine.callback_partial: "The inspection preserved one useful circuit while filters remained scarce."
 fallout.event_log.working_machine.callback_failure: "The inspection found ash in the service cabinets and closed the plant."
