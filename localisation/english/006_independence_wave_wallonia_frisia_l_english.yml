# Package variables
independence_wave_afx_industrial_continuity: "Industrial Continuity"
independence_wave_agx_waterline_integrity: "Waterline Integrity"
independence_wave_agx_coastal_security: "Coastal Security"

# National spirits
afx_disrupted_industrial_belt: "Disrupted Industrial Belt"
afx_disrupted_industrial_belt_desc: "The mines, steelworks, rail depots, and workers' districts of the Sambre and Meuse were built as one system. Independence has divided its ledgers and command posts, leaving furnaces short of coal and factories unsure who can authorize a train."
afx_sambre_meuse_industrial_covenant: "Sambre-Meuse Industrial Covenant"
afx_sambre_meuse_industrial_covenant_desc: "Municipal officials, labor delegates, engineers, and factory administrators have bound the industrial belt to a common schedule. Coal, steel, rail capacity, and public order reinforce one another again."
afx_constitutional_compact: "Walloon Constitutional Compact"
afx_constitutional_compact_desc: "The provisional institutions answer to an elected compact that balances municipalities, labor, and industrial districts."
afx_workers_industrial_charter: "Workers' Industrial Charter"
afx_workers_industrial_charter_desc: "Mine, rail, and steel councils coordinate production through a common workers' charter and claim a direct voice in the state."
afx_emergency_works_command: "Emergency Works Command"
afx_emergency_works_command_desc: "Civil defense, rail security, and factory guards answer to a single command built around keeping the industrial belt operational under threat."
afx_patron_industrial_mandate: "Patron Industrial Mandate"
afx_patron_industrial_mandate_desc: "External guarantees and contracts sustain industrial recovery, but the authority that signs them must continually defend its freedom of action."
agx_exposed_waterline: "Exposed Waterline"
agx_exposed_waterline_desc: "Dikes, pump stations, harbor approaches, and evacuation roads have lost their unified authority. A breach or a seized port could cut the young state apart before its ministries can react."
agx_dike_and_coast_authority: "Dike and Coast Authority"
agx_dike_and_coast_authority_desc: "Municipal boards, harbor officials, engineers, and the coastal constabulary now share schedules, stores, and alarms across the Frisian waterline."
agx_constitutional_water_board: "Constitutional Water Board"
agx_constitutional_water_board_desc: "The old practice of shared water management has become the constitutional foundation of a representative Frisian state."
agx_coastal_labor_councils: "Coastal Labor Councils"
agx_coastal_labor_councils_desc: "Harbor crews, transport workers, and dike laborers govern the coast through linked councils with responsibility for both production and defense."
agx_patron_harbor_mandate: "Patron Harbor Mandate"
agx_patron_harbor_mandate_desc: "A foreign-backed harbor mandate provides access to contracts and protection while narrowing the coast authority's diplomatic room."

# Decision categories
independence_wave_afx_industrial_category: "The Sambre-Meuse Settlement"
independence_wave_afx_industrial_category_desc: "Industrial Continuity: [?independence_wave_afx_industrial_continuity|0]\n\nThe Walloon state survives only if mines, furnaces, rail junctions, and factory guards work as one system. Projects consume real administrative or military resources. Interrupted work weakens continuity and the wider founding settlement."
independence_wave_agx_waterline_category: "The Frisian Waterline"
independence_wave_agx_waterline_category_desc: "Waterline Integrity: [?independence_wave_agx_waterline_integrity|0]\nCoastal Security: [?independence_wave_agx_coastal_security|0]\n\nThe coast needs both functioning dikes and defended ports. Projects consume real administrative, transport, or military resources. Interrupted work leaves the state more exposed."

# Wallonia decisions
independence_wave_afx_prevent_industrial_stoppage: "Prevent an Industrial Stoppage"
independence_wave_afx_prevent_industrial_stoppage_desc: "Coal stocks, wage ledgers, rail schedules, and guard rosters are drifting apart. Secure enough industrial continuity before the emergency deadline. Losing the capital or allowing the deadline to expire will deepen the founding crisis."
independence_wave_afx_keep_mine_pumps_running: "Keep the Mine Pumps Running"
independence_wave_afx_keep_mine_pumps_running_desc: "Commit administrators, reserve labor, and public funds to the pumps and power feeds that keep the coal districts usable. If the capital falls before the work is finished, the effort is lost and industrial continuity declines."
independence_wave_afx_secure_sambre_meuse_rail_junctions: "Secure the Sambre-Meuse Rail Junctions"
independence_wave_afx_secure_sambre_meuse_rail_junctions_desc: "Place vetted guards, signals crews, and emergency stores at the junctions linking coal, steel, and the principal towns. If the capital falls during the operation, the disrupted schedules will worsen the crisis."
independence_wave_afx_settle_industrial_ledgers: "Settle the Industrial Ledgers"
independence_wave_afx_settle_industrial_ledgers_desc: "Negotiate ownership records, rolling-stock claims, and outstanding contracts with our former host. War or the loss of the capital will end the talks. A settlement reduces bilateral disputes and restores part of the industrial circuit."
independence_wave_afx_unify_factory_guards: "Unify the Factory Guards"
independence_wave_afx_unify_factory_guards_desc: "Turn scattered works guards and reserve detachments into a disciplined security service under civilian warrants and professional officers. A breakdown during the program will damage both security and industrial confidence."
independence_wave_afx_form_constitutional_compact: "Form the Constitutional Compact"
independence_wave_afx_form_constitutional_compact_desc: "Bind municipalities, labor delegates, and industrial districts into a permanent compact, with the Provisional Assembly answerable to elections."
independence_wave_afx_ratify_workers_industrial_charter: "Ratify the Workers' Industrial Charter"
independence_wave_afx_ratify_workers_industrial_charter_desc: "Join the mine, rail, and steel councils under a common charter, with the Provisional Assembly serving as their national authority."
independence_wave_afx_establish_emergency_works_command: "Establish the Emergency Works Command"
independence_wave_afx_establish_emergency_works_command_desc: "Bring rail security, industrial defense, and reserve mobilization under a unified command led by Louis Hubert baron Ruquoy, a retired Hainaut-born general recalled to the Walloon reserve."
independence_wave_afx_install_patron_industrial_mandate: "Install the Patron Industrial Mandate"
independence_wave_afx_install_patron_industrial_mandate_desc: "Vest a protected mandate with authority to sign industrial contracts, accept external guarantees, and direct Wallonia's recovery."
independence_wave_afx_convene_meuse_industrial_conference: "Convene the Meuse Industrial Conference"
independence_wave_afx_convene_meuse_industrial_conference_desc: "Invite neighboring authorities to coordinate river traffic, industrial standards, and a negotiated Low Countries settlement. The conference requires a stable industrial system, recognition, an independent place in the new-state network, and a mandate from the basin government."

# Frisia decisions
independence_wave_agx_hold_the_waterline: "Hold the Waterline"
independence_wave_agx_hold_the_waterline_desc: "The dikes and ports cannot remain divided between improvised offices. Secure both waterline integrity and coastal security before the emergency deadline. Losing the capital or allowing the deadline to expire will deepen the founding crisis."
independence_wave_agx_inspect_pump_stations: "Inspect the Pump Stations"
independence_wave_agx_inspect_pump_stations_desc: "Commit engineers, municipal records, and reserve labor to every critical pump station. If the capital falls before the survey is complete, the interrupted maintenance will weaken the waterline."
independence_wave_agx_organize_harbor_watch: "Organize the Harbor Watch"
independence_wave_agx_organize_harbor_watch_desc: "Combine port officials, pilots, and coastal constables into a harbor watch able to report suspicious traffic and protect emergency stores. A breakdown during the operation will reduce coastal security."
independence_wave_agx_secure_inland_rail_link: "Secure the Inland Rail Link"
independence_wave_agx_secure_inland_rail_link_desc: "Reserve trains and command attention for the inland corridor that brings fuel, food, and reinforcement to the coast. The project improves both waterline repair and coastal defense if it reaches completion."
independence_wave_agx_train_dike_guards: "Train the Dike Guards"
independence_wave_agx_train_dike_guards_desc: "Equip a guard force trained to defend sluices, pumping works, evacuation roads, and harbor approaches without abandoning routine water management."
independence_wave_agx_reconcile_water_board_records: "Reconcile the Water Board Records"
independence_wave_agx_reconcile_water_board_records_desc: "Negotiate archives, maintenance obligations, and rolling-stock claims with our former host. War or the loss of the capital will end the talks. A settlement reduces bilateral disputes and strengthens both branches of coastal administration."
independence_wave_agx_form_constitutional_water_board: "Form the Constitutional Water Board"
independence_wave_agx_form_constitutional_water_board_desc: "Build a representative state around accountable municipalities and water-board institutions."
independence_wave_agx_ratify_coastal_labor_councils: "Ratify the Coastal Labor Councils"
independence_wave_agx_ratify_coastal_labor_councils_desc: "Join harbor, transport, and dike labor councils under a national authority responsible for production and defense."
independence_wave_agx_install_patron_harbor_mandate: "Install the Patron Harbor Mandate"
independence_wave_agx_install_patron_harbor_mandate_desc: "Entrust national authority to a harbor mandate backed by external contracts and guarantees."
independence_wave_agx_convene_north_sea_coastal_conference: "Convene the North Sea Coastal Conference"
independence_wave_agx_convene_north_sea_coastal_conference_desc: "Invite neighboring coastal authorities to coordinate dike engineering, emergency shipping, and a negotiated Low Countries settlement. The conference requires a secure waterline, recognition, and an independent place in the new-state network."

# Effect summaries
independence_wave_afx_industrial_project_effect_tt: "Industrial continuity will improve. State capacity or security will rise, and founding instability will fall."
independence_wave_afx_host_settlement_effect_tt: "Industrial continuity will improve. Property, obligation, border, and hostility disputes with the former host will move toward settlement."
independence_wave_afx_route_government_effect_tt: "The chosen settlement will establish Wallonia's government and enduring institutions."
independence_wave_afx_conference_effect_tt: "Wallonia will gain standing in the independence network and advance its Meuse and Low Countries ambitions."
independence_wave_agx_waterline_project_effect_tt: "Waterline integrity or coastal security will improve. State capacity or security will rise, and founding instability will fall."
independence_wave_agx_host_settlement_effect_tt: "Waterline integrity and coastal security will improve. Property, obligation, border, and hostility disputes with the former host will move toward settlement."
independence_wave_agx_route_government_effect_tt: "The chosen settlement will establish Frisia's government and enduring institutions."
independence_wave_agx_conference_effect_tt: "Frisia will gain standing in the independence network and advance its North Sea and Low Countries ambitions."
independence_wave_nwe_project_failure_effect_tt: "Interrupted work will worsen the founding emergency, weaken state authority, and increase instability."

# Wallonia Level 2 focuses
independence_wave_afx_charter_sambre_meuse_authority_focus: "Charter the Sambre-Meuse Authority"
independence_wave_afx_charter_sambre_meuse_authority_focus_desc: "Mine pumps, furnace banks, rail dispatchers, and municipal warrants cannot remain separate commands. A basin authority will publish one emergency schedule while keeping every office answerable for the obligations it carries."
independence_wave_afx_charter_sambre_meuse_authority_tt: "Industrial Continuity rises by 10. Legitimacy, Capacity, and Security rise by 5. Instability falls by 5."
independence_wave_afx_bind_mines_rails_furnaces_focus: "Bind Mines, Rails, and Furnaces"
independence_wave_afx_bind_mines_rails_furnaces_focus_desc: "Coal reaches the furnaces only when pumping stations, marshalling yards, and steel orders share the same ledger. Engineers and dispatchers will connect the basin through a common transport and production schedule."
independence_wave_afx_bind_mines_rails_furnaces_tt: "Industrial Continuity rises by 15. Legitimacy and Security rise by 5. Capacity rises by 10. Instability falls by 5. The anchor state gains one Infrastructure and one 50 percent Industry research bonus."
independence_wave_afx_codify_basin_government_focus: "Codify the Basin Government"
independence_wave_afx_codify_basin_government_focus_desc: "The route settlement has placed a government above the industrial authority. Its statute must define who approves production schedules, hears appeals, commands guards, and answers when contracts cross the frontier."
independence_wave_afx_codify_basin_government_tt: "The selected government receives a route-specific settlement. Constitutional government gains 10 Industrial Continuity and loses 5 percent War Support. Popular Council government gains 15 Industrial Continuity and loses 5 percent War Support. Emergency Military government gains 20 Industrial Continuity and loses 5 percent Stability. Patron-Client government gains 15 Industrial Continuity and loses 5 percent Stability. Constitutional and Popular Council settlements raise Legitimacy and Security by 5, Capacity by 10, and lower Instability by 5. The Emergency Military settlement raises Legitimacy and Capacity by 5, Security by 10, and lowers Instability by 5. The Patron-Client settlement raises Legitimacy and Capacity by 5, Recognition by 10, and lowers Instability by 5."
independence_wave_afx_integrate_industrial_reserve_focus: "Integrate the Industrial Reserve"
independence_wave_afx_integrate_industrial_reserve_focus_desc: "Works guards know the bridges, substations, mine entrances, and rail cuts better than any improvised general staff. Civil warrants and a professional reserve command will turn them into a disciplined defense without raising another field formation."
independence_wave_afx_integrate_industrial_reserve_tt: "Industrial Continuity rises by 15. Legitimacy and Capacity rise by 5. Security rises by 10. Instability falls by 5. Gain 15 Army Experience and 15 Command Power."
independence_wave_afx_settle_industrial_succession_focus: "Settle the Industrial Succession"
independence_wave_afx_settle_industrial_succession_focus_desc: "Rolling stock, pensions, property deeds, and supply contracts survived the frontier that divided them. If the former host remains, the ledger settlement must establish reciprocal offices first. If it has vanished, the basin authority must adjudicate the orphaned obligations itself."
independence_wave_afx_settle_industrial_succession_tt: "Industrial Continuity rises by 10. A living former host requires the Industrial Ledgers project to be complete. Ratifying that settlement lowers War Support by 5 percent, raises Legitimacy by 10, raises Recognition and Capacity by 5, and lowers Instability by 10. If the former host no longer survives, Legitimacy and Security rise by 5, Capacity rises by 10, and Instability falls by 5."
independence_wave_afx_open_meuse_network_office_focus: "Open the Meuse Network Office"
independence_wave_afx_open_meuse_network_office_focus_desc: "River pilots, railway boards, and industrial inspectors need permanent counterparts beyond the basin. A network office will exchange schedules and arbitration files while preparing a wider settlement along the Meuse."
independence_wave_afx_open_meuse_network_office_tt: "Industrial Continuity and Network Standing rise by 10. Legitimacy and Capacity rise by 5. Recognition rises by 10. Instability falls by 5. League Cohesion, Common Cause, Shared Reserve, and Member Confidence each rise by 5 when the league ledger is active."
independence_wave_afx_mandate_meuse_conference_focus: "Mandate the Meuse Conference"
independence_wave_afx_mandate_meuse_conference_focus_desc: "The basin government will authorize a conference on river traffic, industrial standards, sovereign guarantees, and the terms of cooperation across the Low Countries. The delegates receive a mandate, not permission to annex their neighbors."
independence_wave_afx_mandate_meuse_conference_tt: "Authorizes the Meuse Industrial Conference project. Legitimacy and Capacity rise by 5. Recognition rises by 10. Instability falls by 5. The conference still requires its full strategic cost and duration."
independence_wave_afx_prepare_low_countries_dossier_focus: "Prepare the Low Countries Dossier"
independence_wave_afx_prepare_low_countries_dossier_focus_desc: "The conference record will become a working dossier for a confederal Low Countries settlement. Wallonia may open formal talks, but a confederation still demands an accepted constitutional or Development Compact route, consenting partners, and a ratified founding agreement."
independence_wave_afx_prepare_low_countries_dossier_tt: "Industrial Continuity and Network Standing rise by 10. Legitimacy rises by 10. Recognition, Capacity, and Security rise by 5. Instability rises by 5. League Cohesion, Common Cause, Shared Reserve, and Member Confidence each rise by 5 when the league ledger is active. Opens discovery of the Low Countries Confederation without replacing its consent and ratification requirements."

# Frisia Level 2 focuses
independence_wave_agx_chart_waterline_authority_focus: "Chart the Frisian Waterline Authority"
independence_wave_agx_chart_waterline_authority_focus_desc: "Dike boards, pump engineers, harbor officials, and evacuation planners still answer to separate ledgers. A national waterline authority will publish one emergency schedule while preserving the municipalities' responsibility for the works they maintain."
independence_wave_agx_chart_waterline_authority_tt: "Waterline Integrity and Coastal Security rise by 10. Legitimacy, Capacity, and Security rise by 5. Instability falls by 5."
independence_wave_agx_bind_dikes_pumps_harbors_focus: "Bind Dikes, Pumps, and Harbors"
independence_wave_agx_bind_dikes_pumps_harbors_focus_desc: "A pump station cannot protect a coast if inland rail, harbor stores, and sluice schedules drift apart. Engineers and dispatchers will connect the waterline through one maintenance and emergency-shipping ledger."
independence_wave_agx_bind_dikes_pumps_harbors_tt: "Waterline Integrity rises by 15 and Coastal Security rises by 10. The anchor state gains one Infrastructure. Legitimacy, Capacity, and Security rise by 5, 10, and 5 respectively, and Instability falls by 5."
independence_wave_agx_integrate_coastal_guard_focus: "Integrate the Coastal Guard"
independence_wave_agx_integrate_coastal_guard_focus_desc: "Dike guards know the sluices, pumping works, evacuation roads, and harbor approaches better than any improvised field command. Civil warrants and a professional coastal reserve will turn that knowledge into a disciplined security service."
independence_wave_agx_integrate_coastal_guard_tt: "Waterline Integrity rises by 10 and Coastal Security rises by 15. Legitimacy and Capacity rise by 5, Security rises by 10, and Instability falls by 5. Gain 15 Army Experience and 15 Command Power."
independence_wave_agx_codify_water_board_government_focus: "Codify the Water Board Government"
independence_wave_agx_codify_water_board_government_focus_desc: "The route settlement has placed a government above the waterline authority. Its statute must define who approves maintenance schedules, hears municipal appeals, commands guards, and answers when contracts cross the frontier."
independence_wave_agx_codify_water_board_government_tt: "The selected government receives a route-specific settlement. Constitutional government gains 10 Waterline Integrity and 10 Coastal Security and loses 5 percent War Support. Popular Council government gains 15 in both measures and loses 5 percent War Support. Patron-Client government gains 15 in both measures and loses 5 percent Stability. Administrative, security, or diplomatic state values rise according to the chosen route, and founding Instability falls by 5."
independence_wave_agx_settle_water_board_succession_focus: "Settle the Water Board Succession"
independence_wave_agx_settle_water_board_succession_focus_desc: "Maintenance deeds, rolling stock, pensions, and harbor contracts survived the frontier that divided them. If the former host remains, the water-board settlement must establish reciprocal offices first. If it has vanished, the coastal authority must adjudicate the orphaned obligations itself."
independence_wave_agx_settle_water_board_succession_tt: "Waterline Integrity and Coastal Security rise by 10. A living former host requires the Water Board Records project to be complete. Ratifying that settlement lowers War Support by 5 percent, raises Legitimacy by 10, Recognition and Capacity by 5, and lowers Instability by 10. If the former host no longer survives, Legitimacy rises by 5, Capacity rises by 10, Security rises by 5, and Instability falls by 5."
independence_wave_agx_open_north_sea_network_office_focus: "Open the North Sea Network Office"
independence_wave_agx_open_north_sea_network_office_focus_desc: "Harbor pilots, railway boards, and water engineers need permanent counterparts beyond the coast. A North Sea office will exchange schedules and arbitration files while preparing a wider Low Countries settlement."
independence_wave_agx_open_north_sea_network_office_tt: "Waterline Integrity and Coastal Security rise by 10. Network Standing rises by 10. Legitimacy and Capacity rise by 5, Recognition rises by 10, and Instability falls by 5. League Cohesion, Common Cause, Shared Reserve, and Member Confidence each rise by 5 when the league ledger is active."
independence_wave_agx_mandate_north_sea_coastal_conference_focus: "Mandate the North Sea Coastal Conference"
independence_wave_agx_mandate_north_sea_coastal_conference_focus_desc: "The water-board government will authorize a conference on dike engineering, emergency shipping, sovereign guarantees, and cooperation across the Low Countries. The delegates receive a mandate, not permission to reclaim a neighbor's coast."
independence_wave_agx_mandate_north_sea_coastal_conference_tt: "Authorizes the North Sea Coastal Conference project. Legitimacy and Capacity rise by 5, Recognition rises by 10, and Instability falls by 5. The conference still requires its full strategic cost and duration."
independence_wave_agx_prepare_low_countries_dossier_focus: "Prepare the Low Countries Dossier"
independence_wave_agx_prepare_low_countries_dossier_focus_desc: "The conference record will become a working dossier for a confederal Low Countries settlement. Frisia may open formal talks, but a federation still demands an accepted constitutional or Development Compact route, consenting partners, and a ratified founding agreement."
independence_wave_agx_prepare_low_countries_dossier_tt: "Waterline Integrity, Coastal Security, and Network Standing rise by 10. Legitimacy rises by 10, while Recognition, Capacity, and Security rise by 5. Instability rises by 5. League Cohesion, Common Cause, Shared Reserve, and Member Confidence each rise by 5 when the league ledger is active. Opens discovery of the Low Countries Federation without replacing its consent and ratification requirements."

# Wallonia country incidents
chaosx.nr6.18.t: "Who Commands the Basin?"
chaosx.nr6.18.d: "At Charleroi, mine engineers demand binding pump schedules while municipal delegates arrive with seals, wage ledgers, and contradictory warrants. The furnaces cannot wait for every council to reconcile its books. A central authority that seizes the warrants, however, may look like a new master before Wallonia has written its first charter."
chaosx.nr6.18.a: "Keep the warrants under municipal review."
chaosx.nr6.18.a.tt: "Industrial Continuity and Legitimacy rise by 10. Recognition and Capacity rise by 5. Security and Instability fall by 5."
chaosx.nr6.18.b: "Give the authority binding dispatch power."
chaosx.nr6.18.b.tt: "Industrial Continuity rises by 15. Capacity and Security rise by 10. Legitimacy and Recognition fall by 5. Instability rises by 5."
chaosx.nr6.19.t: "The Government Enters the Works"
chaosx.nr6.19.d: "The chosen settlement has named a government, but the industrial authority still controls schedules, inspectors, and emergency warrants. Ministers want enough power to prevent another stoppage. Municipal delegates and labor representatives insist that quotas and appeals must remain public before emergency practice hardens into permanent rule."
chaosx.nr6.19.a: "Publish every quota, appeal, and inspection."
chaosx.nr6.19.a.tt: "Industrial Continuity falls by 10. Legitimacy and Recognition rise by 10. Capacity rises by 5. Security and Instability fall by 5."
chaosx.nr6.19.b: "Let the government command the quotas."
chaosx.nr6.19.b.tt: "Industrial Continuity rises by 15. Capacity and Security rise by 10. Legitimacy and Recognition fall by 5. Instability rises by 5."
chaosx.nr6.20.t: "The Mandate at the Meuse Table"
chaosx.nr6.20.d: "The Meuse conference has agreed on river schedules and common industrial standards, but not on what a future Low Countries delegation may bind. Municipal representatives favor a confederal mandate with protected appeals. Production directors argue that a union unable to command rail priorities and emergency stocks would preserve the old divisions behind a new title."
chaosx.nr6.20.a: "Carry a confederal mandate to the Low Countries."
chaosx.nr6.20.a.tt: "Industrial Continuity, Legitimacy, and Recognition rise by 10. Capacity rises by 5. Security and Instability fall by 5."
chaosx.nr6.20.b: "Demand a directorate with binding industrial powers."
chaosx.nr6.20.b.tt: "Industrial Continuity rises by 15. Recognition rises by 5. Capacity and Security rise by 10. Legitimacy falls by 5. Instability rises by 5."
