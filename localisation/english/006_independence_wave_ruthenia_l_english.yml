rut_fragmented_mountain_mandate: "Fragmented Mountain Mandate"
rut_fragmented_mountain_mandate_desc: "Village councils, railway officials, church communities, and border guards recognize the provisional state without yet accepting a common settlement."
rut_carpathian_state_compact: "Carpathian State Compact"
rut_carpathian_state_compact_desc: "Written community guarantees and a common mountain defence bind Ruthenia's valleys, towns, and guarded passes to one civil authority."
rut_constitutional_autonomy_charter: "Constitutional Autonomy Charter"
rut_constitutional_autonomy_charter_desc: "An elected assembly protects Ruthenian self-government while keeping the civil service and mountain communities represented."
rut_socialist_rail_councils: "Socialist Rail Councils"
rut_socialist_rail_councils_desc: "Railway workers, forestry crews, and town committees coordinate production and transport through a common workers' council."
rut_agrarian_village_compact: "Agrarian Village Compact"
rut_agrarian_village_compact_desc: "Village delegates, cooperatives, and parish communities share responsibility for food, recruitment, and local administration."
rut_mountain_emergency_command: "Mountain Emergency Command"
rut_mountain_emergency_command_desc: "A unified territorial staff directs the border guards and mountain reserves while civil councils preserve local supply and relief."

independence_wave_rut_mountain_compact_category: "Ruthenian Mountain Compact"
independence_wave_rut_mountain_compact_category_desc: "Civic Concord: §Y[?independence_wave_rut_civic_concord|0]§! / [?constant:independence_wave_ruthenia_pressure.maximum|0]\nMountain Security: §Y[?independence_wave_rut_mountain_security|0]§! / [?constant:independence_wave_ruthenia_pressure.maximum|0]\nReach [?constant:independence_wave_ruthenia_pressure.stable|0] in both values to stabilize the compact."
independence_wave_rut_hold_mountain_compact_together: "Hold the Mountain Compact Together"
independence_wave_rut_hold_mountain_compact_together_desc: "Within [?constant:independence_wave_ruthenia_duration.founding_crisis|0] days, install a government, raise both compact values to [?constant:independence_wave_ruthenia_pressure.stable|0], and secure ownership and control of Carpathian Ruthenia."
independence_wave_rut_secure_mountain_depots: "Secure the Mountain Depots"
independence_wave_rut_secure_mountain_depots_desc: "Place the upland stores, road registers, and railway depots under a civil authority able to supply the entire compact."
independence_wave_rut_integrate_border_guards: "Integrate the Border Guards"
independence_wave_rut_integrate_border_guards_desc: "Unify the local detachments under a mountain defence staff while preserving the community guarantees that sustain them."
independence_wave_rut_register_community_compacts: "Register the Community Compacts"
independence_wave_rut_register_community_compacts_desc: "Record the rights, obligations, and representation of every valley, town, parish, and recognized community."
independence_wave_rut_settle_former_host_ledgers: "Settle the Former Host Ledgers"
independence_wave_rut_settle_former_host_ledgers_desc: "Close the property, border, population, and recognition claims inherited from the former administration. If talks fail, the mountain compact will settle them locally."
independence_wave_rut_ratify_constitutional_autonomy: "Ratify Constitutional Autonomy"
independence_wave_rut_ratify_constitutional_autonomy_desc: "Give the provisional assembly a binding charter of self-government and explicit protections for the mountain communities."
independence_wave_rut_adopt_agrarian_compact: "Adopt the Agrarian Compact"
independence_wave_rut_adopt_agrarian_compact_desc: "Entrust village delegates, cooperatives, and parish communities with food, recruitment, and local administration."
independence_wave_rut_convene_socialist_councils: "Convene the Socialist Councils"
independence_wave_rut_convene_socialist_councils_desc: "Place the railway, forestry districts, workshops, and municipal services under a common workers' council."
independence_wave_rut_establish_mountain_emergency_command: "Establish the Mountain Emergency Command"
independence_wave_rut_establish_mountain_emergency_command_desc: "Put the border guards under one emergency staff and secure the passes before neighboring armies test the compact."
independence_wave_rut_codify_durable_sovereignty: "Codify Durable Sovereignty"
independence_wave_rut_codify_durable_sovereignty_desc: "A resolved founding crisis, stable ledgers, and a functioning government can turn liberation into a durable Ruthenian state."
independence_wave_rut_open_carpathian_network_corridor: "Open the Carpathian Network Corridor"
independence_wave_rut_open_carpathian_network_corridor_desc: "After the founding settlement, exchange supplies, officers, and diplomatic access with the other states that survived the wave."

independence_wave_rut_project_failure_effect_tt: "Civic Concord and Mountain Security each change by [?constant:independence_wave_ruthenia_pressure.standard_loss|0].\nLegitimacy [?constant:independence_wave_decision_effect.value_standard_loss|0], Recognition [?constant:independence_wave_decision_effect.value_minor_loss|0], State Capacity [?constant:independence_wave_decision_effect.value_standard_loss|0], Security [?constant:independence_wave_decision_effect.value_standard_loss|0], Instability §R+[?constant:independence_wave_decision_effect.value_major|0]§!."
independence_wave_rut_depots_effect_tt: "Civic Concord §G+[?constant:independence_wave_ruthenia_pressure.major_gain|0]§! and Mountain Security §G+[?constant:independence_wave_ruthenia_pressure.minor_gain|0]§!.\nLegitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability [?constant:independence_wave_value.minor_loss|0]."
independence_wave_rut_guards_effect_tt: "Civic Concord §G+[?constant:independence_wave_ruthenia_pressure.minor_gain|0]§! and Mountain Security §G+[?constant:independence_wave_ruthenia_pressure.major_gain|0]§!.\nLegitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Security §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability [?constant:independence_wave_value.minor_loss|0]."
independence_wave_rut_communities_effect_tt: "Civic Concord §G+[?constant:independence_wave_ruthenia_pressure.major_gain|0]§! and Mountain Security §G+[?constant:independence_wave_ruthenia_pressure.standard_gain|0]§!.\nLegitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability [?constant:independence_wave_value.standard_loss|0]."
independence_wave_rut_host_ledgers_effect_tt: "Civic Concord and Mountain Security each gain §G+[?constant:independence_wave_ruthenia_pressure.standard_gain|0]§!.\nThe settlement changes Host Claim by [?constant:independence_wave_decision_effect.bilateral_minor_loss|0], Hostility and Host Obligations by [?constant:independence_wave_decision_effect.bilateral_standard_loss|0], Property Claims by [?constant:independence_wave_decision_effect.bilateral_major_loss|0], Border Settlement by §G+[?constant:independence_wave_decision_effect.bilateral_standard|0]§!, and Host Pressure and Reconquest Fear by [?constant:independence_wave_decision_effect.bilateral_minor_loss|0].\nThe accompanying negotiations change Host Claim, Hostility, Property Claims, and Reconquest Fear by [?constant:independence_wave_value.standard_loss|0]. They change Host Obligations, Population Pressure, and Host Pressure by [?constant:independence_wave_value.minor_loss|0], while Border Settlement gains §G+[?constant:independence_wave_value.major_gain|0]§!."
independence_wave_rut_host_loss_effect_tt: "The former host ledger closes locally. Civic Concord and Mountain Security each gain §G+[?constant:independence_wave_ruthenia_pressure.standard_gain|0]§!. No bilateral host values change."
independence_wave_rut_constitutional_route_effect_tt: "The Ruthenian Civic Assembly takes office under Augustin Voloshyn and adopts the civic standard. Civic Concord gains §G+[?constant:independence_wave_ruthenia_pressure.major_gain|0]§! and Mountain Security gains §G+[?constant:independence_wave_ruthenia_pressure.minor_gain|0]§!.\nLegitimacy and Security §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, State Capacity §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, Instability [?constant:independence_wave_decision_effect.value_minor_loss|0]."
independence_wave_rut_agrarian_route_effect_tt: "The Ruthenian Village Compact takes office under Andriy Brodiy and adopts the agrarian standard. Civic Concord gains §G+[?constant:independence_wave_ruthenia_pressure.major_gain|0]§! and Mountain Security gains §G+[?constant:independence_wave_ruthenia_pressure.standard_gain|0]§!.\nLegitimacy and State Capacity §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Recognition §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, Instability [?constant:independence_wave_decision_effect.value_minor_loss|0]."
independence_wave_rut_socialist_route_effect_tt: "The Carpathian Workers' Council takes office under Ivan Mondok and adopts the socialist standard. Civic Concord gains §G+[?constant:independence_wave_ruthenia_pressure.minor_gain|0]§! and Mountain Security gains §G+[?constant:independence_wave_ruthenia_pressure.major_gain|0]§!.\nLegitimacy and Security §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, State Capacity §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, Instability [?constant:independence_wave_decision_effect.value_minor_loss|0]."
independence_wave_rut_emergency_route_effect_tt: "The Mountain Defence Directorate takes office under Dmytro Klympush and adopts the emergency standard. Civic Concord changes by [?constant:independence_wave_ruthenia_pressure.minor_loss|0] and Mountain Security gains §G+[?constant:independence_wave_ruthenia_pressure.decisive_gain|0]§!.\nLegitimacy and State Capacity §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Security §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, Instability [?constant:independence_wave_decision_effect.value_minor_loss|0]."
independence_wave_rut_sovereignty_effect_tt: "Legitimacy, Recognition, and State Capacity each gain §G+[?constant:independence_wave_decision_effect.value_standard|0]§!. Security gains §G+[?constant:independence_wave_decision_effect.value_minor|0]§! and Instability changes by [?constant:independence_wave_decision_effect.value_standard_loss|0]."
independence_wave_rut_network_effect_tt: "Civic Concord and Mountain Security each gain §G+[?constant:independence_wave_ruthenia_pressure.standard_gain|0]§!.\nNetwork cooperation: Network Standing §G+[?constant:independence_wave_network.aid_gain|0]§!. League Cohesion, Common Cause, Shared Reserve, and Member Confidence each gain §G+[?constant:independence_wave_value.minor_gain|0]§!.\nDomestic settlement: Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!. Recognition, State Capacity, Security, and Instability each gain §G+[?constant:independence_wave_value.minor_gain|0]§!.\nCorridor ratification: Legitimacy, Recognition, and State Capacity §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, Security §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Instability [?constant:independence_wave_decision_effect.value_standard_loss|0], and Network Standing §G+[?constant:independence_wave_decision_effect.network_standard|0]§!. League Cohesion, Common Cause, Shared Reserve, and Member Confidence each gain §G+[?constant:independence_wave_value.minor_gain|0]§!."

