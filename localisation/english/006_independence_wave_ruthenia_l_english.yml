RUT_independence_wave_andriy_brodiy: "Andriy Brodiy"
RUT_independence_wave_andriy_brodiy_desc: "A Ruthenian autonomist and agrarian politician, Brodiy argues that village institutions and local self-government must anchor the new compact."
RUT_independence_wave_ivan_mondok: "Ivan Mondok"
RUT_independence_wave_ivan_mondok_desc: "A Carpatho-Ruthenian communist organizer and former parliamentary deputy, Mondok links railway workers, forestry crews, and town committees."
RUT_independence_wave_dmytro_klympush: "Dmytro Klympush"
RUT_independence_wave_dmytro_klympush_desc: "A Ruthenian military organizer, Klympush brings the border detachments and mountain reserves under a disciplined territorial command."
