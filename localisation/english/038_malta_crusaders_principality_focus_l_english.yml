l_english:
mpf_survive_the_first_year: "Survive the First Year"
mpf_survive_the_first_year_desc: "A charter on parchment is not a government. The first year is spent finding clerks, paying garrisons and learning which of the prince's neighbours will honour the seal of the Order."
mpf_survive_the_first_year_tt: "Political power and stability rise slightly."
mpf_the_mission_of_the_land: "The Mission of the Land"
mpf_the_mission_of_the_land_desc: "Every principality was chartered for a reason. The council writes that reason in one sentence and the court is asked to live up to it."
mpf_the_mission_of_the_land_tt: "The regional mission of this principality opens."
mpf_guard_of_the_sepulchre: "Guard of the Sepulchre"
mpf_guard_of_the_sepulchre_desc: "The canons of the Holy Sepulchre ask for a standing guard that is neither the Order nor the town watch. The prince raises it from the city's own families."
mpf_guard_of_the_sepulchre_tt: "Two Holy Land Guard divisions appear in the capital and stability rises."
mpf_the_pilgrim_kingdom: "The Pilgrim Kingdom"
mpf_the_pilgrim_kingdom_desc: "Pilgrims from every Christian country come through the gates. The prince decides that safe roads are the only product he can sell to all of them."
mpf_the_pilgrim_kingdom_tt: "Political power and stability rise, and the realm gains Sacred Legitimacy."
mpf_walls_of_the_north: "Walls of the North"
mpf_walls_of_the_north_desc: "The old walls of Antioch run along the mountain ridge. Engineers of the Order and masons of the town agree on one thing: the wall must be shortened and manned."
mpf_walls_of_the_north_tt: "A fortress commandery and a siege host appear in the capital."
mpf_the_frontier_charter: "The Frontier Charter"
mpf_the_frontier_charter_desc: "Armenians, Greeks, Syriacs and Franks each have a bishop and a grievance. The prince signs one charter that lets each of them keep both."
mpf_the_frontier_charter_tt: "Manpower and stability rise."
mpf_the_harbour_board: "The Harbour Board"
mpf_the_harbour_board_desc: "The island's quays are full of Maltese hulls, Greek caiques and Syrian traders. A board of harbour masters is named to decide who unloads first."
mpf_the_harbour_board_tt: "The capital gains a dockyard and convoys arrive."
mpf_the_sea_princes_seat: "The Sea Princes' Seat"
mpf_the_sea_princes_seat_desc: "Cyprus asks for a seat among the sea princes beside Malta and the Aegean. The council grants it and expects escorts in return."
mpf_the_sea_princes_seat_tt: "Convoys and political power rise, and the realm gains Sacred Legitimacy."
mpf_the_cedar_road: "The Cedar Road"
mpf_the_cedar_road_desc: "A road from the cedar mountains to the harbour of Tripoli is repaired by the county itself, so that timber and travellers reach the coast."
mpf_the_cedar_road_tt: "The capital gains infrastructure and political power rises."
mpf_regency_for_the_coast: "Regency for the Coast"
mpf_regency_for_the_coast_desc: "The county is small enough to be governed by a council of three. The regents promise to meet every month and to publish what they spend."
mpf_regency_for_the_coast_tt: "Stability and political power rise."
mpf_league_of_the_islands: "League of the Islands"
mpf_league_of_the_islands_desc: "Every island sends one captain to the harbour of Rhodes. The captains share a signal book, a supply table and a quarrel over who pays for the lanterns."
mpf_league_of_the_islands_tt: "Convoys arrive and a fortress commandery appears in the capital."
mpf_council_of_admirals: "Council of Admirals"
mpf_council_of_admirals_desc: "The islands are held by their galleys. A council of admirals is given the budget of the league and the right to refuse the prince."
mpf_council_of_admirals_tt: "Army experience and political power rise."
mpf_passes_of_the_taurus: "Passes of the Taurus"
mpf_passes_of_the_taurus_desc: "The few roads over the Taurus mountains are held by towers and chains. The komtur decides which of them are worth a garrison."
mpf_passes_of_the_taurus_tt: "Two fortress commanderies appear in the capital."
mpf_the_komturs_march: "The Komtur's March"
mpf_the_komturs_march_desc: "The knights of the march ride in heavy armour on the plains below the passes. Their drills draw farmers from three valleys."
mpf_the_komturs_march_tt: "An armored knight banner appears in the capital and army experience rises."
mpf_wells_and_ports: "Wells and Ports"
mpf_wells_and_ports_desc: "The march lives on a few wells and three ports. Surveyors map every cistern between the coast and the first dunes."
mpf_wells_and_ports_tt: "Fuel and convoys arrive."
mpf_mounted_columns: "Mounted Columns"
mpf_mounted_columns_desc: "Camels, trucks and mounted knights patrol the coast in columns of fifty. They carry water for three days and the hope of finding more."
mpf_mounted_columns_tt: "Two mounted columns appear in the capital."
mpf_read_the_charter_aloud: "Read the Charter Aloud"
mpf_read_the_charter_aloud_desc: "The charter is read in every market square in the language of the town. The notary stands on a barrel and answers questions until the light fails."
mpf_read_the_charter_aloud_tt: "Loyalty rises and political power rises."
mpf_the_princes_court: "The Prince's Court"
mpf_the_princes_court_desc: "A court of seven officials is named: chancellor, constable, treasurer, marshal, bishop's clerk, harbour master and judge. Each is told to keep a ledger."
mpf_the_princes_court_tt: "Stability rises and command power rises."
mpf_estates_of_the_land: "Estates of the Land"
mpf_estates_of_the_land_desc: "Nobles, clergy and townsmen sit as three estates. They may refuse a tax once, and nobody has yet found the courage to try."
mpf_estates_of_the_land_tt: "Manpower rises and loyalty rises."
mpf_laws_of_succession: "Laws of Succession"
mpf_laws_of_succession_desc: "The chancellor writes down who may succeed a prince and who must confirm him. The clerks bind the book in red leather and hide the key."
mpf_laws_of_succession_tt: "The next succession dispute is pushed back by nine months."
mpf_the_loyal_crown: "The Loyal Crown"
mpf_the_loyal_crown_desc: "The prince swears to keep the charter as long as the Order keeps its half. The oath is repeated each year on the first day of Lent."
mpf_the_loyal_crown_tt: "Loyalty rises greatly and the realm gains Sacred Legitimacy."
mpf_seat_in_the_federation: "Seat in the Federation"
mpf_seat_in_the_federation_desc: "The principality takes its chair in the common council of the princes, beside the Grand Master and the other chartered lands."
mpf_seat_in_the_federation_tt: "Loyalty rises and stability rises."
mpf_seat_in_the_federation_avail_tt: "The realm must have formed the federation of the principalities."
mpf_the_claim_of_independence: "The Claim of Independence"
mpf_the_claim_of_independence_desc: "The court draws up a list of the realm's broken promises and a second list of its own debts. The prince holds the lists in one hand and the sword in the other."
mpf_the_claim_of_independence_tt: "The principality leaves the charter."
mpf_the_claim_of_independence_avail_tt: "The principality must be below Cooperative."
mpf_muster_the_garrisons: "Muster the Garrisons"
mpf_muster_the_garrisons_desc: "The prince calls every man who owes service and asks the knights of the Order to teach them to stand in a line. The drills are loud and short."
mpf_muster_the_garrisons_tt: "A Holy Land Guard division appears in the capital and manpower rises."
mpf_wardens_of_the_castles: "Wardens of the Castles"
mpf_wardens_of_the_castles_desc: "Every castle receives a warden with a seal, a roll of men and a list of the stores he is not allowed to sell."
mpf_wardens_of_the_castles_tt: "The capital gains infrastructure and rifles arrive."
mpf_mobile_reserve: "Mobile Reserve"
mpf_mobile_reserve_desc: "A reserve of horse and carts is kept at the capital to ride to any threatened castle. The horses are the principality's best asset."
mpf_mobile_reserve_tt: "An armored knight banner appears in the capital."
mpf_the_arsenal: "The Arsenal"
mpf_the_arsenal_desc: "A forge, a powder mill and a rifle shop are put under one roof in the capital. A fire breaks out in the second week and the workers laugh about it."
mpf_the_arsenal_tt: "The capital gains a military factory and rifles arrive."
mpf_the_war_council: "The War Council"
mpf_the_war_council_desc: "The prince, the marshal and the chaplain meet weekly to decide where the banners will stand when the Order calls. Their minutes are copied to Malta."
mpf_the_war_council_tt: "Army experience rises and a support division appears in the capital."
mpf_repair_the_roads: "Repair the Roads"
mpf_repair_the_roads_desc: "The road crews have not been paid since the last war. The prince pays them in grain and stamps each milestone with the arms of the principality."
mpf_repair_the_roads_tt: "The capital gains infrastructure."
mpf_harbour_works: "Harbour Works"
mpf_harbour_works_desc: "A breakwater, a crane and a customs house are the three things every harbour master asks for. The prince buys the crane first."
mpf_harbour_works_tt: "A dockyard is built in the capital where there is a coast and convoys arrive."
mpf_granaries: "Granaries"
mpf_granaries_desc: "Stone granaries are built beside the garrisons, with a lock whose keys are held by three different officers."
mpf_granaries_tt: "Fuel and support equipment arrive."
mpf_pilgrim_roads: "Pilgrim Roads"
mpf_pilgrim_roads_desc: "Inns, wells and watch towers line the roads that pilgrims take. The prince charges a small toll and makes it a point of honour not to raise it."
mpf_pilgrim_roads_tt: "Stability rises for a year and political power rises."
mpf_the_common_market: "The Common Market"
mpf_the_common_market_desc: "A weekly market of the principality, the Order and the visiting merchants is opened under a single set of weights. Prices fall by a farthing and nobody complains."
mpf_the_common_market_tt: "The capital gains a civilian factory and political power rises."
mpf_envoy_to_malta: "Envoy to Malta"
mpf_envoy_to_malta_desc: "The prince sends a chancellor to Valletta with a list of requests, a list of promises and a gift of wine for the Grand Master."
mpf_envoy_to_malta_tt: "Loyalty rises and command power rises."
mpf_pay_the_duty_in_soldiers: "Pay the Duty in Soldiers"
mpf_pay_the_duty_in_soldiers_desc: "The prince proposes that the duty of the charter be paid in men for the garrisons. The Order has more rifles than recruits and accepts at once."
mpf_pay_the_duty_in_soldiers_tt: "The charter now owes soldiers."
mpf_pay_the_duty_in_silver: "Pay the Duty in Silver"
mpf_pay_the_duty_in_silver_desc: "The prince proposes that the duty be paid in coin. The treasurer of the Order asks whether it will come in coin or in promises."
mpf_pay_the_duty_in_silver_tt: "The charter now owes taxes."
mpf_appeal_to_rome: "Appeal to Rome"
mpf_appeal_to_rome_desc: "The prince asks the Holy See to name a vicar for the principality. A bishop arrives with a seal, a cross and a very long list of exemptions."
mpf_appeal_to_rome_tt: "The principality becomes a Papal vicariate and the realm gains Sacred Legitimacy."
mpf_appeal_to_rome_avail_tt: "The Holy See must have its seat in the realm."
mpf_invite_a_patron_order: "Invite a Patron Order"
mpf_invite_a_patron_order_desc: "One of the military orders is invited to garrison the castles and sit in the prince's council. The knights arrive with their own cooks and their own priest."
mpf_invite_a_patron_order_tt: "The principality becomes an order state and army experience rises."
mpf_a_council_of_notables: "A Council of Notables"
mpf_a_council_of_notables_desc: "The prince invites the bishops, the guild masters and the heads of three large families to run the principality. They agree on the budget and on little else."
mpf_a_council_of_notables_tt: "The principality becomes a local Christian council and stability rises."
