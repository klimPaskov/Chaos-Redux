mengele_event016_biological_weapons_deployment: "Deploy Biological Forces"
mengele_event016_biological_weapons_deployment_desc: "Build the command and containment capacity to coordinate authorized pathogen forces."
mengele_event016_biological_weapons_deployment_requirements_tt: "Biological Weapons Prototype is required. Individual raids still require an unlocked agent and real delivery stock."
mengele_event016_biological_weapons_deployment_effect_tt: "Field coordinated biological forces. Each raid still reserves and spends its actual pathogen equipment through the raid system."
