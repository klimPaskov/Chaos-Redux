mengele_event016_biological_weapons_prototype: "Prove Biological Delivery"
mengele_event016_biological_weapons_prototype_desc: "Test containment and delivery using an authorized pathogen programme."
mengele_event016_biological_weapons_prototype_requirements_tt: "Biological Weapons Theory is required. A pathogen project takes precedence when it can be undertaken."
mengele_event016_biological_weapons_prototype_effect_tt: "Establish the biological delivery prototype. No pathogen equipment is granted; production remains with ordinary industry."
mengele_event016_biological_weapons_prototype_costs_tt: "Commit [GetMengeleBiologicalPrototypeFactoryCost] until the work is finished."
