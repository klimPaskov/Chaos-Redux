l_english:
mengele_event016_biological_started_tt: "The listed stores are spent, and civilian factories are committed for the life of the work."
mengele_event016_biological_cancel_trigger_tt: "Mengele's programme can no longer sustain this work."
mengele_event016_biological_cancelled_tt: "Unfinished work ends. Recorded direct payments return, and committed factories are released."

mengele_event016_biological_weapons_theory: "Chart the Pathogen Arsenal"
mengele_event016_biological_weapons_theory_desc: "Coordinate containment research and choose the agents that can be developed for delivery."
mengele_event016_biological_weapons_theory_requirements_tt: "Mengele's registered programme must be active."
mengele_event016_biological_weapons_theory_effect_tt: "Establish biological research doctrine. Pathogen projects and delivery technologies determine which agents can be fielded."
mengele_event016_biological_weapons_theory_costs_tt: "Commit [GetMengeleBiologicalTheoryFactoryCost] until the work is finished."
