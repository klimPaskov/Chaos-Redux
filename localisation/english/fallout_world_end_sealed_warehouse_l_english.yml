 chaosx.fallout.331.t: "The Sealed Warehouse"
 chaosx.fallout.331.d: "A freight warehouse behind the settlement's repair yard has survived with its doors locked and its roof bowed under ash. The old inventory boards mention medical crates, machine parts, and sealed drums, but no one can tell which mark means clean stock and which mark means a warning. The country must choose what kind of risk it is willing to make public."
 chaosx.fallout.331.a: "Open it at once"
 chaosx.fallout.331.a.tt: "Send a salvage crew through the doors immediately. Costs Scrap and Food. A strong result brings equipment into public hands, but a weak seal can spread contamination through the yard."
 chaosx.fallout.331.b: "Inspect under quarantine"
 chaosx.fallout.331.b.tt: "Spend Medicine, Filters, and Power to isolate the warehouse before opening it. A strong result recovers medical stores while cutting the contamination burden and building a trusted safety record."
 chaosx.fallout.331.c: "Sell the coordinates"
 chaosx.fallout.331.c.tt: "License a carrier guild to buy the warehouse location. Costs Scrap and Recognition. A strong result funds the country and formalizes salvage law, while a bad deal can turn the yard into a remembered betrayal."
 chaosx.fallout.331.d_option: "Leave the doors sealed"
 chaosx.fallout.331.d_option.tt: "Spend Shelter Capacity, Filters, and Scrap to fence the site and keep its contents unknown. A strong result protects the town and preserves a future claim, while a weak watch leaves the seal to thieves and weather."
 chaosx.fallout.333.t: "The Inventory Behind the Door"
 chaosx.fallout.333.open.success.d: "The first doors opened onto machine parts, sealed dressings, and a row of containers whose warning paint had not yet blistered. Clerks marked each crate before it moved, the repair yard gained useful hands, and the public learned which risks had been accepted in its name."
 chaosx.fallout.333.open.partial.d: "The crew cleared the front bay and stopped when the rear floor began to sweat through its ash. Some parts reached the repair yard, but a second ledger now records which families handled the first crates and which rooms must wait for cleaner tools."
 chaosx.fallout.333.open.failure.d: "A rotten pallet collapsed before the inventory was complete. Powder crossed the loading floor, the medic on watch lost a week to coughing, and the country must count the cost of opening a door faster than it could read the marks."
 chaosx.fallout.333.inspect.success.d: "The quarantine team built a clean corridor from the gate to the inner racks. Medical crates were recovered without a public exposure, the drums were isolated for later study, and the warehouse became proof that caution can still produce a usable store."
 chaosx.fallout.333.inspect.partial.d: "The quarantine line reached the inner racks but ran out of filters before the last room. The country recovered dressings and tools under supervision, while the sealed drum row remains a quiet source of arguments about who should pay for another inspection."
 chaosx.fallout.333.inspect.failure.d: "The inspection crew trusted a faded inventory mark and opened the wrong cage. Medicine was lost to the cleanup, the filter tally broke, and the warehouse now carries a contamination memory that no public notice can make disappear."
 chaosx.fallout.333.sell.success.d: "Licensed carriers paid for the coordinates, then arrived with their own seals and a public contract. The country gained scrap and medicine without claiming every crate, while the first salvage law gave scavengers a reason to bring disputes to a clerk instead of a gun."
 chaosx.fallout.333.sell.partial.d: "The carrier guild reached the warehouse and paid for the front racks. Outer crates remain unclaimed, and the town has learned that a licensed map can create order at the gate while leaving the far wall to whoever arrives first."
 chaosx.fallout.333.sell.failure.d: "The coordinates were sold twice and the first guild came with altered seals. A few crates vanished before the guard could close the yard, Recognition fell with the missing inventory, and every future contract now begins with a question about this warehouse."
 chaosx.fallout.333.leave.success.d: "The doors stayed shut behind a new fence and a watch rota that names the people allowed to approach. Filters were spent on the sentries, the shelter ledger funded the lock, and the town kept a clean reserve without pretending the warehouse was harmless."
 chaosx.fallout.333.leave.partial.d: "The fence holds around the main door, but the rear wall still opens onto a drifted service lane. The country has preserved a claim and reduced casual exposure, though every scavenger who sees the gap now knows where the next dispute will begin."
 chaosx.fallout.333.leave.failure.d: "The watch left the rear lane uncounted and a storm buried the warning boards. No one entered the main door, yet the seal is no longer trusted, the filters are gone, and the town must decide whether an unopened warehouse can still poison its politics."
 chaosx.fallout.333.a: "Accept the inventory report"
 chaosx.fallout.333.a.tt: "Record the warehouse policy, apply its delayed salvage result, and begin the 180-day site memory follow-up."
 chaosx.fallout.335.t: "The Warehouse Claim"
 chaosx.fallout.335.success.d: "One hundred eighty days have passed since the warehouse decision. Its crates, fence, or contract have survived another hard season, and the country can describe the site without relying on rumor. Salvage law now has a memory longer than the first opening day."
 chaosx.fallout.335.partial.d: "The warehouse remains a usable claim, though its back rooms and warning boards still invite argument. The country has kept enough of the policy to guide the next crew, but no one mistakes a partial record for a clean victory."
 chaosx.fallout.335.failure.d: "The follow-up found a broken seal, an unpaid carrier, or an empty watch post. The warehouse has returned to the edge of the map, and the country carries a contamination and trust cost that will shape its next salvage decision."
 chaosx.fallout.335.a: "Close the warehouse report"
 chaosx.fallout.335.a.tt: "Apply the long-term site result, record the warehouse memory, and release the delayed receipts."
