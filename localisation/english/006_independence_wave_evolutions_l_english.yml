independence_wave.evolution.type: "Sovereignty Cascades"
independence_wave.evolution.1.title: "The Manuals Cross the Border"
independence_wave.evolution.1.body: "Founding charters, civil-service manuals, recognition protocols, and trusted couriers now pass from one young state to the next. New governments enter the world with stronger institutions, earlier diplomatic contacts, and a network prepared to sponsor their survival."
independence_wave.evolution.2.title: "Old Nations Wake"
independence_wave.evolution.2.body: "Dormant national projects and half-remembered unions return to political life. Regional and signature independence movements can surface sooner, while the states already born from the wave gain the confidence and institutions needed to rediscover larger identities."
independence_wave.evolution.3.title: "Flags Rise Behind the Barracks"
independence_wave.evolution.3.body: "The next declarations arrive with officers, guarded depots, and plans for immediate defense. Breakaway governments gain stronger military budgets and better prepared forces, but every rifle issued sharpens instability, former-host hostility, and the fear of reconquest."
independence_wave.evolution.4.title: "The Sovereigns Take Their Seats"
independence_wave.evolution.4.body: "The informal network becomes a congress of delegates, observers, and rejected clients. Recognition missions, arbitration, rescue commitments, and a shared reserve draw the independent states toward collective leadership without deciding the charter they must ultimately choose."
independence_wave.evolution.5.title: "No Border Is Final"
independence_wave.evolution.5.body: "World collapse strips old borders of their final authority. New sovereignty projects enter the struggle for independence, while existing breakaways gain the freedom and pressure to pursue dangerous routes."
independence_wave.evolution.summary: "A stage of the worldwide sovereignty cascade has taken hold, reshaping which states may emerge and what institutions, forces, and ambitions they carry into independence."
