camp_administration_civil_action_one_tt: "[This.GetCampAdministrationCivilAuthorityText]\n\nEach funded month costs §Y[?camp_admin_civil_policy_support_cost|0]§! £support_equipment_text_icon and §Y[?camp_admin_civil_policy_pp_cost|0]§! £pol_power within the national spending ceiling. Site maintenance takes precedence. Admissions stop during any unfunded month."
camp_administration_civil_action_two_tt: "[This.GetCampAdministrationCivilReviewText]"
camp_admin_civil_uk_authority_text: "Authorize wartime internment at controlled domestic locations. Detainees remain under civilian custody and tribunal review. Domestic internment does not authorize colonial labor demands."
camp_admin_civil_raj_authority_text: "Authorize political detention under the colonial government and administer labor commitments for local works. Detention and labor burdens strengthen demands for Indian self-government. British authority must remain in force."
camp_admin_civil_usa_authority_text: "Authorize wartime incarceration at controlled domestic locations. Removal from ordinary life disrupts homes and livelihoods and increases pressure for court review. Detainees provide no industrial workforce under civilian custody."
camp_admin_civil_vichy_authority_text: "Administer Vichy detention and forced labor at controlled locations. North African labor sites remain distinct from refugee internment in France. Collaboration records retain the authorities responsible for persecution."
camp_admin_civil_france_authority_text: "Administer the refugee sites under French control. Internment interrupts civilian life. Release and assistance allow families to leave custody and rebuild their livelihoods."
camp_admin_civil_italy_authority_text: "Administer wartime detention and occupation labor where Italian authorities retain control. Colonial claims remain after a site closes. German control ends Italian authority over that location."
camp_admin_civil_congo_authority_text: "Administer concession labor and transport commitments in the Congo. Extraction depends on surviving workers, transport and continuing support. Labor burdens increase unrest and demands for negotiated reform."
camp_admin_civil_no_authority_text: "The government has no eligible detention authority."
camp_admin_civil_review_text: "Release surviving detainees, end further admissions and begin civilian employment at existing sites. Built infrastructure remains. Review requires §Y[?camp_admin_civil_review_months|0] funded months§!. Each month costs §Y[?camp_admin_civil_review_support_cost|0]§! £support_equipment_text_icon and §Y[?camp_admin_civil_review_pp_cost|0]§! £pol_power. Civilian replacement has separate maintenance and development costs."
camp_admin_civil_raj_review_text: "Release surviving political detainees and replace labor commitments with civilian employment. Complete §Y[?camp_admin_civil_review_months|0] funded months§! of negotiation to reduce the colonial labor burden and increase Indian autonomy. Each month costs §Y[?camp_admin_civil_review_support_cost|0]§! £support_equipment_text_icon and §Y[?camp_admin_civil_review_pp_cost|0]§! £pol_power. Existing infrastructure remains."
camp_admin_civil_usa_claims_text: "Adjudicate outstanding property claims from wartime incarceration. The commission requires §Y[?camp_admin_civil_claims_months|0] funded months§!. Each month costs §Y[?camp_admin_civil_claims_support_cost|0]§! £support_equipment_text_icon and §Y[?camp_admin_civil_claims_pp_cost|0]§! £pol_power. Completion resolves the property-claims burden."
camp_admin_civil_congo_review_text: "Open labor negotiations, release surviving detainees and replace concession labor with civilian employment. Complete §Y[?camp_admin_civil_review_months|0] funded months§! to settle the concession labor dispute. Each month costs §Y[?camp_admin_civil_review_support_cost|0]§! £support_equipment_text_icon and §Y[?camp_admin_civil_review_pp_cost|0]§! £pol_power. Transport infrastructure remains."
camp_admin_civil_autonomy_settlement: "Indian detention and labor settlement"
camp_admin_civil_status: "[This.GetCampAdministrationCivilAuthorityText]\nReview: [?camp_admin_civil_review_progress|0]/[?camp_admin_civil_review_months|0] funded months. Property claims: [?camp_admin_civil_claims_progress|0]/[?camp_admin_civil_claims_months|0] funded months."
camp_admin_civil_british_custody: "Domestic Wartime Internment"
camp_admin_civil_british_custody_desc: "Civilians are held under emergency wartime authority. Their detention separates families, restricts livelihoods and demands continuing tribunal scrutiny."
camp_admin_civil_british_review: "Internment Tribunal Review"
camp_admin_civil_british_review_desc: "Tribunals are reviewing detention and arranging releases. Surviving internees leave custody as civilian employment is restored."
camp_admin_civil_congo_strike: "Concession Labor Dispute"
camp_admin_civil_congo_strike_desc: "Concession labor burdens have brought work stoppages and demands for improved conditions. A funded settlement and civilian employment can resolve the dispute."
camp_admin_civil_autonomy_pressure: "Opposition to colonial detention and labor burdens"
