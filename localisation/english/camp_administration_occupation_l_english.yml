# 1944 German deportation demand on Hungary (events/camp_occ_partner_events.txt, common/decisions/camp_occ_partner_decisions.txt)
camp_occ_partner.1.t: "The German Deportation Demand"
camp_occ_partner.1.d: "German officials in Budapest demand that our gendarmerie gather the Jewish communities of our provinces and put them on trains to the camps in occupied Poland. The first trains have already left.\n\nSome of our officials will obey without question. Others can be told to delay. Only the government can stop the trains altogether, and Berlin will not forgive it."
camp_occ_partner.1.a: "Let the trains run"
camp_occ_partner.1.a.tt: "The deportations continue until the German order lapses on 9 July."
camp_occ_partner.1.b: "Tell our officials to delay"
camp_occ_partner.1.b.tt: "Each month only §Y[?constant:camp_occ_partner.obstructed_wave_share|%0]§! of the trains Germany could fill leave our provinces.\nGermany resents the delay."
camp_occ_partner.1.c: "Halt the deportations"
camp_occ_partner.1.e: "The trains have already stopped"
camp_occ_partner.1.e.tt: "Our government has already halted the deportations."
camp_occ_partner_halt_release_tt: "Within a month, everyone in our provinces still waiting for the trains is released at home. The deportations never resume."
camp_occ_partner.2.t: "Hungary Halts the Deportations"
camp_occ_partner.2.d: "The Hungarian government has ordered its gendarmerie to stop the deportation trains. The people still waiting in Hungary's provinces are beyond our orders.\n\nOur envoys report that the Hungarian leadership no longer trusts our assurances."
camp_occ_partner.2.a: "Budapest will answer for this"
camp_occ_partner.2.a.tt: "No more deportation trains leave Hungary."
camp_occ_hun_halt_deportations: "Halt the Deportations"
camp_occ_hun_halt_deportations_desc: "German deportation trains are leaving our provinces for the camps in occupied Poland. We can order the gendarmerie to stop them, at the cost of an open break with Berlin."
camp_occ_hun_halt_deportations_transports_tt: "German deportation trains are still running from our provinces"
camp_occ_hungary_halt_autonomy: "Defied the German deportation order"
camp_occ_hungary_obstructed_deportations: "Delayed the Deportations"
camp_occ_hungary_halted_deportations: "Halted the Deportations"
