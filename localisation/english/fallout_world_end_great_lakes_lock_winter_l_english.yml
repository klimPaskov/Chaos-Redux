l_english:
 chaosx.fallout.663.t: "The Great Lakes Lock"
 chaosx.fallout.663.d: "Ice has sealed the native port in [?fallout_event_dispatch_issued_target.GetName] while the [This.GetFalloutOrientationArchetypeName] tries to keep food, fuel, and winter crews moving. The lake route is not a decorative map feature. It is a working supply line whose lock, customs desk, and shoreline shelters now depend on one decision. A joint authority can publish one ice schedule. A unilateral opening can send a convoy through before rival councils agree. A seasonal closure can protect the shoreline and the households behind it. A rival lock sabotage can turn the frozen route into a bargaining weapon."
 chaosx.fallout.663.a: "Publish a joint ice authority"
 chaosx.fallout.663.b: "Open the route under our flag"
 chaosx.fallout.663.c: "Close the route for the season"
 chaosx.fallout.663.d_option: "Sabotage the rival lock"
 chaosx.fallout.663.a.tt: "Spend Food 3, Fuel 3, Scrap 2, and Recognition 2. After 35 days, the joint authority is judged by the native port, infrastructure, supply access, winter adaptation, food reserve, exposure, disease pressure, and lock trust in [?fallout_event_dispatch_issued_target.GetName]. A later thaw inspection will return after 270 days."
 chaosx.fallout.663.b.tt: "Spend Food 2, Fuel 5, and Command Power 8. A unilateral convoy gains short-term throughput while customs and border trust suffer if the native port cannot carry the opening. The result arrives after 35 days."
 chaosx.fallout.663.c.tt: "Spend Food 2, Fuel 1, Shelter Capacity 3, and Medicine 1. Seasonal closure protects shoreline households and lowers exposure, but the frozen route loses throughput until the thaw review."
 chaosx.fallout.663.d_option.tt: "Spend Fuel 4, Scrap 3, and Support Equipment 2. The sabotage risks native naval-base and infrastructure damage, a bounded Deaths-system loss, and a lasting customs dispute if the lock does not hold."
 chaosx.fallout.665.t: "The Lock Decision Returns"
 chaosx.fallout.665.joint.success.d: "The joint ice authority held the winter register together in [?fallout_event_dispatch_issued_target.GetName]. Port crews shared a single opening schedule, food reached the shoreline shelters, and the [This.GetFalloutOrientationArchetypeName] gained lock trust without hiding the councils that signed the order."
 chaosx.fallout.665.joint.partial.d: "The joint authority opened the inner route in [?fallout_event_dispatch_issued_target.GetName], but the outer shoreline could not keep every convoy slot. Supply access improved unevenly, and the next thaw inspection will decide whether the councils can keep sharing the lock."
 chaosx.fallout.665.joint.failure.d: "The joint schedule broke at [?fallout_event_dispatch_issued_target.GetName]. The native port and infrastructure lost working capacity, shoreline stores were missed, and the Deaths ledger recorded a bounded winter loss rather than an uncounted disappearance."
 chaosx.fallout.665.open.success.d: "The unilateral opening pushed a convoy through [?fallout_event_dispatch_issued_target.GetName] before the rival councils could close the channel. Fuel reached the storehouses and supply access rose, but the [This.GetFalloutOrientationArchetypeName] now owns the customs dispute that the thaw review must settle."
 chaosx.fallout.665.open.partial.d: "The convoy crossed the first lock in [?fallout_event_dispatch_issued_target.GetName], then met an ice field and a second customs claim. The port remains usable, though border trust and shoreline adaptation now depend on the next review."
 chaosx.fallout.665.open.failure.d: "The unilateral opening failed in [?fallout_event_dispatch_issued_target.GetName]. The native port and infrastructure were damaged as the convoy turned back, and the winter register records the loss against the [This.GetFalloutOrientationArchetypeName]."
 chaosx.fallout.665.closure.success.d: "The seasonal closure secured the shoreline rooms in [?fallout_event_dispatch_issued_target.GetName]. Shelters stayed heated, disease pressure fell, and the [This.GetFalloutOrientationArchetypeName] kept a documented route for the first thaw instead of pretending the lake was open."
 chaosx.fallout.665.closure.partial.d: "The seasonal closure protected the inner shoreline in [?fallout_event_dispatch_issued_target.GetName], but the outer lock still leaked cold and disease through its service rooms. Adaptation improved while throughput remained thin."
 chaosx.fallout.665.closure.failure.d: "The closure order failed in [?fallout_event_dispatch_issued_target.GetName]. The port and infrastructure lost capacity, food stores were consumed without a secure schedule, and winter households paid the recorded Deaths-system cost."
 chaosx.fallout.665.sabotage.success.d: "The rival lock in [?fallout_event_dispatch_issued_target.GetName] froze under a controlled break. The [This.GetFalloutOrientationArchetypeName] gained security and bargaining power, while the damaged route remains a named memory that future diplomacy must answer."
 chaosx.fallout.665.sabotage.partial.d: "The sabotage reached the rival lock near [?fallout_event_dispatch_issued_target.GetName], but the break did not last. Security improved for the moment, while customs pressure and disease risk followed the crews home."
 chaosx.fallout.665.sabotage.failure.d: "The sabotage failed at [?fallout_event_dispatch_issued_target.GetName]. A native port and infrastructure level were damaged in the retreat, the shoreline register lost households, and the rival councils now know which lock was targeted."
 chaosx.fallout.665.a: "Record the winter decision"
 chaosx.fallout.665.a.tt: "Resolve the delayed Great Lakes Lock Winter result and schedule the first thaw inspection."
 chaosx.fallout.667.t: "The First Thaw Inspection"
 chaosx.fallout.667.success.d: "The first thaw inspection found a working route in [?fallout_event_dispatch_issued_target.GetName]. Ice crews reopened the service rooms, shoreline adaptation held, and the [This.GetFalloutOrientationArchetypeName] can carry the lock memory into its next bilateral order."
 chaosx.fallout.667.partial.d: "The first thaw inspection found the inner route in [?fallout_event_dispatch_issued_target.GetName], but the outer service rooms still need crews and food. The lake can move a reduced schedule while trust and adaptation recover."
 chaosx.fallout.667.failure.d: "The first thaw inspection failed in [?fallout_event_dispatch_issued_target.GetName]. The port and infrastructure were damaged again, disease pressure returned, and the Deaths ledger recorded a small bounded loss under the existing winter memory."
 chaosx.fallout.667.a: "Seal the thaw report"
 chaosx.fallout.667.a.tt: "Close the Great Lakes Lock Winter record after the thaw inspection and preserve its durable memory."
