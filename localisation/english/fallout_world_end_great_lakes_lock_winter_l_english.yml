 fallout.event_log.great_lakes_lock_winter.name: "The Great Lakes Lock Winter"
 fallout.event_log.great_lakes_lock_winter.detail: "[GetFalloutEvent663EventLogDetail]"
 fallout.event_log.great_lakes_lock_winter.detail.choice_joint: "The country chose a joint ice authority for the selected Great Lakes port."
 fallout.event_log.great_lakes_lock_winter.detail.choice_open: "The country opened the selected Great Lakes port under its own flag."
 fallout.event_log.great_lakes_lock_winter.detail.choice_closure: "The country closed the selected Great Lakes route for the winter season."
 fallout.event_log.great_lakes_lock_winter.detail.choice_sabotage: "The country chose to sabotage a rival lock near the selected Great Lakes port."
 fallout.event_log.great_lakes_lock_winter.detail.joint_success: "A joint ice authority held the port schedule and improved shoreline supply access."
 fallout.event_log.great_lakes_lock_winter.detail.joint_partial: "The joint ice authority opened only the inner route and left an uneven thaw obligation."
 fallout.event_log.great_lakes_lock_winter.detail.joint_failure: "The joint schedule failed, damaged native port capacity, and recorded a bounded winter loss."
 fallout.event_log.great_lakes_lock_winter.detail.open_success: "A unilateral convoy crossed the port and improved throughput before the rival councils could close it."
 fallout.event_log.great_lakes_lock_winter.detail.open_partial: "The unilateral convoy crossed the first lock but left a second customs claim unresolved."
 fallout.event_log.great_lakes_lock_winter.detail.open_failure: "The unilateral opening failed and damaged the native port and infrastructure."
 fallout.event_log.great_lakes_lock_winter.detail.closure_success: "Seasonal closure protected the shoreline shelters and lowered disease pressure."
 fallout.event_log.great_lakes_lock_winter.detail.closure_partial: "Seasonal closure protected the inner shoreline while the outer service rooms remained exposed."
 fallout.event_log.great_lakes_lock_winter.detail.closure_failure: "The closure order failed and the winter register recorded a bounded Deaths-system loss."
 fallout.event_log.great_lakes_lock_winter.detail.sabotage_success: "A controlled break froze the rival lock and raised security for the winter route."
 fallout.event_log.great_lakes_lock_winter.detail.sabotage_partial: "The rival lock was damaged briefly, but customs pressure and disease risk remained."
 fallout.event_log.great_lakes_lock_winter.detail.sabotage_failure: "The sabotage failed, damaged the retreat route, and exposed the targeting order."
 fallout.event_log.great_lakes_lock_winter.detail.callback_success: "The first thaw inspection reopened the service rooms and preserved the durable lock memory."
 fallout.event_log.great_lakes_lock_winter.detail.callback_partial: "The first thaw inspection reopened only the inner route and left a reduced schedule."
 fallout.event_log.great_lakes_lock_winter.detail.callback_failure: "The first thaw inspection failed, returned disease pressure, and recorded a bounded loss."
 fallout.event_log.great_lakes_lock_winter.detail.cancelled: "The Great Lakes Lock Winter record was cancelled after the authenticated port or owner changed."
 fallout.event_log.great_lakes_lock_winter.detail.unknown: "The Great Lakes Lock Winter record has no recognized port outcome."
