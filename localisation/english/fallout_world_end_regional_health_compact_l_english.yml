chaosx.fallout.754.t: "Regional Health Compact"
chaosx.fallout.754.opening.d: "The North Gate Health Corridor has become a road with two authorities and one winter clinic ledger. Ash Ward doctors will not send patients through another checkpoint without a promise that records, medicine, and responsibility cross together. The Quarantine council can turn the Health Without Borders register into a compact, but the neighboring state will remember which part of the promise it receives."
chaosx.fallout.754.a: "Share the clinic registers"
chaosx.fallout.754.a.tt: "Spend Food 3, Medicine 1, and Recognition 3 to give the North Gate and Ash Ward one patient register."
chaosx.fallout.754.b: "Exchange clinic teams"
chaosx.fallout.754.b.tt: "Spend Scrap 2, Power 3, and Recognition 3 to send named clinic teams across the corridor."
chaosx.fallout.754.c: "Grant corridor authority"
chaosx.fallout.754.c.tt: "Spend Fuel 4 and Recognition 2, then accept a Cohesion cost, so the quarantine council can issue relief-road permits."
chaosx.fallout.754.d: "Enforce a border quarantine"
chaosx.fallout.754.d.tt: "Spend Food 2, Medicine 3, Fuel 2, and Recognition 2 to place the crossing under a recorded quarantine order."
chaosx.fallout.755.t: "Regional Health Compact"
chaosx.fallout.756.t: "The Corridor Answers"
chaosx.fallout.756.shared_register.success.d: "The North Gate and Ash Ward now read the same patient ledger. A clinic can request medicine without asking which council owns the road, and the Quarantine government has accepted a duty that reaches beyond its state line."
chaosx.fallout.756.shared_register.partial.d: "The shared register reached the North Gate and one Ash Ward clinic. The outer wards still keep their own pages, so the compact exists where clerks can carry the seal and nowhere else."
chaosx.fallout.756.shared_register.failure.d: "The councils disputed who could correct a patient's record. The shared register was sealed before it reached the Ash Ward, leaving medicine behind local locks and turning the corridor into another argument over custody."
chaosx.fallout.756.clinic_exchange.success.d: "Named clinic teams crossed the relief road in both directions. They returned with matching case notes, empty transport crates, and a practical trust that no council could have created by inspection alone."
chaosx.fallout.756.clinic_exchange.partial.d: "One Ash Ward team reached the North Gate and one North Gate team reached the outer clinic. The exchange proved the road can carry care, but the third ward still waits for a roster it can trust."
chaosx.fallout.756.clinic_exchange.failure.d: "The exchange broke down at the frost checkpoint. The teams carried different patient lists, the medicine crates stayed under guard, and the neighboring council now treats the corridor as a test of Quarantine authority rather than a route to care."
chaosx.fallout.756.corridor_authority.success.d: "The quarantine council issued one relief-road seal with named clinics, named escorts, and a public appeal route. Ash Ward patients can cross without surrendering their records, while the North Gate keeps a clear answer for every closure."
chaosx.fallout.756.corridor_authority.partial.d: "The new corridor authority covers the North Gate and the Ash Ward hospital. Farm clinics may request passage, but each request still waits for a council clerk who knows the road by sight."
chaosx.fallout.756.corridor_authority.failure.d: "The council gave the checkpoint more authority than the clinics. Relief permits became a second ration, the farm road narrowed to military hours, and the Ash Ward stopped treating the compact as a health promise."
chaosx.fallout.756.border_quarantine.success.d: "The quarantine order is narrow, named, and reviewable. The crossing slows, but the Ash Ward receives a clean list of permitted patients and the North Gate can reopen the road without pretending the danger has vanished."
chaosx.fallout.756.border_quarantine.partial.d: "The border order stopped the worst crossings and protected the North Gate stores. The Ash Ward accepts the delay because the council published a review date, though the outer clinics still count every closed day."
chaosx.fallout.756.border_quarantine.failure.d: "The quarantine order arrived after the clinic road had already fractured. Guards stopped patients without a working register, medicine spoiled behind the gate, and the neighboring council withdrew its last corridor liaison."
chaosx.fallout.756.a: "Record the corridor decision"
chaosx.fallout.756.a.tt: "Apply the authenticated Regional Health Compact result and schedule the delayed bilateral review."
chaosx.fallout.758.t: "The Compact Comes Due"
chaosx.fallout.758.success.d: "The delayed review finds a corridor that can explain its closures, move medicine, and answer to both councils. The North Gate remains a border, but the Ash Ward can now plan a clinic week without guessing which seal will be honored."
chaosx.fallout.758.partial.d: "The delayed review keeps the corridor alive, though patient lists and fuel permits still move more slowly than the winter weather. Both councils keep a seat, and neither has yet decided to leave the compact."
chaosx.fallout.758.failure.d: "The delayed review finds a corridor of closed ledgers and exhausted escorts. The Quarantine government keeps the checkpoint, while Ash Ward clinics rebuild their schedules around the routes that no longer ask permission."
chaosx.fallout.758.a: "Close the compact record"
chaosx.fallout.758.a.tt: "Apply the authenticated bilateral review, record its memory, and release the reserved state and neighbor rows."
