fallout.event_log.regional_health_compact.name: "Regional Health Compact"
fallout.event_log.regional_health_compact.detail: "[GetFalloutEvent754EventLogDetail]"
fallout.event_log.regional_health_compact.detail.choice_shared_register: "The North Gate and Ash Ward councils shared one clinic register."
fallout.event_log.regional_health_compact.detail.choice_clinic_exchange: "The councils sent named clinic teams across the relief road."
fallout.event_log.regional_health_compact.detail.choice_corridor_authority: "The Quarantine council issued a public relief-corridor seal."
fallout.event_log.regional_health_compact.detail.choice_border_quarantine: "The councils placed the crossing under a recorded border quarantine."
fallout.event_log.regional_health_compact.detail.shared_register_success: "The shared register reached the North Gate and Ash Ward clinics."
fallout.event_log.regional_health_compact.detail.shared_register_partial: "The shared register covered the corridor but not the outer wards."
fallout.event_log.regional_health_compact.detail.shared_register_failure: "The councils sealed the register after disputing record custody."
fallout.event_log.regional_health_compact.detail.clinic_exchange_success: "Clinic teams crossed in both directions with matching case notes."
fallout.event_log.regional_health_compact.detail.clinic_exchange_partial: "Two clinics exchanged teams while a third remained outside the compact."
fallout.event_log.regional_health_compact.detail.clinic_exchange_failure: "The clinic teams reached the frost checkpoint but did not exchange care."
fallout.event_log.regional_health_compact.detail.corridor_authority_success: "The relief-road authority named clinics, escorts, and an appeal route."
fallout.event_log.regional_health_compact.detail.corridor_authority_partial: "The corridor seal covered the hospital while farm clinics waited."
fallout.event_log.regional_health_compact.detail.corridor_authority_failure: "The corridor authority turned permits into another barrier to care."
fallout.event_log.regional_health_compact.detail.border_quarantine_success: "A narrow quarantine order slowed the crossing without erasing its review date."
fallout.event_log.regional_health_compact.detail.border_quarantine_partial: "The quarantine order protected stores while the outer clinics counted closed days."
fallout.event_log.regional_health_compact.detail.border_quarantine_failure: "The quarantine order arrived after the clinic road had fractured."
fallout.event_log.regional_health_compact.detail.callback_success: "The delayed review kept both councils inside a working corridor."
fallout.event_log.regional_health_compact.detail.callback_partial: "The delayed review kept the compact alive while permits and patient lists lagged."
fallout.event_log.regional_health_compact.detail.callback_failure: "The delayed review left the councils with closed ledgers and separate routes."
fallout.event_log.regional_health_compact.detail.cancelled: "The regional compact was cancelled after its state, neighbor, owner, or generation changed."
