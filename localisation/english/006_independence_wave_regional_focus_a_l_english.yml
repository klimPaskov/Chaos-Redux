independence_wave_mys_focus_secure_bhadravati_and_canal_transit_desc: "The former-host policy protects supply and transit for Bhadravati's works and the KRS canals, or Mysore settles those accounts domestically after a host collapse."
independence_wave_mys_focus_secure_bhadravati_and_canal_transit_tt: "When the program ends, pay [?constant:independence_wave_decision_cost.command_power_standard|0] command power and either [?constant:independence_wave_decision_cost.convoy_standard|0] convoys or [?constant:independence_wave_decision_cost.train_standard|0] trains. Reinforce the selected host policy and add [?constant:independence_wave_decision_effect.value_standard|0] Capacity and [?constant:independence_wave_decision_effect.value_minor|0] Recognition. Without a living host, add [?constant:independence_wave_decision_effect.value_standard|0] Capacity and [?constant:independence_wave_decision_effect.value_minor|0] Security."
independence_wave_mys_focus_prepare_regional_integration_authority: "Convene the Plateau Works Congress"
independence_wave_mys_focus_prepare_regional_integration_authority_desc: "Mysore places its works and irrigation network before a congress on regional trade and border policy."
