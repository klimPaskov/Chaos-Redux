l_english:
 fallout.event_log.orientation.name: "Ash Week Orientation"
 fallout.event_log.orientation.detail: "[GetFalloutOrientationEventLogDetail]"
 fallout.event_log.orientation.detail.national_household_success: "Household work crews kept food, clean water, and filters moving through the first shelter census, giving local councils a usable ration promise."
 fallout.event_log.orientation.detail.national_household_partial: "Household work crews reached the central shelters, but outer wards received uneven measures and began keeping their own ration counts."
 fallout.event_log.orientation.detail.national_household_failure: "Household work crews could not hold the ration line, and the first national orientation record carries deaths, missing filters, and a broken promise to the wards."
 fallout.event_log.orientation.detail.national_district_success: "District settlements pooled shelter, scrap, and food under one winter ledger, preserving a route from neighborhood stores to the state reserve."
 fallout.event_log.orientation.detail.national_district_partial: "District settlements opened two routes and lost a third, leaving local councils with a workable shelter plan and a lasting dispute over scrap."
 fallout.event_log.orientation.detail.national_district_failure: "District settlements divided their stores before a common guard could form, and the state reserve lost both food and recognition."
 fallout.event_log.orientation.detail.national_command_success: "Emergency command kept fuel, filters, and repair scrap under one authority, allowing the national staff to direct scarce convoys without reopening the old ministries."
 fallout.event_log.orientation.detail.national_command_partial: "Emergency command secured the fuel yards and one filter depot, while remote districts kept their own ledgers and questioned the order."
 fallout.event_log.orientation.detail.national_command_failure: "Emergency command spent its last reserve without restoring a trusted chain, leaving the country with lower cohesion and a recorded winter loss."
 fallout.event_log.orientation.detail.capital_seal_success: "Civic crews sealed the heated capital core, protecting the archive rooms and giving the government a defensible place to issue its next order."
 fallout.event_log.orientation.detail.capital_seal_partial: "Civic crews sealed the archive wing but could not hold every heated corridor, so the capital remained usable with a narrower public shelter."
 fallout.event_log.orientation.detail.capital_seal_failure: "The capital seal failed at the heat junction, exposing the central wards and leaving deaths in the state ledger before the next convoy arrived."
 fallout.event_log.orientation.detail.capital_disperse_success: "Officials dispersed stores and offices into guarded district rooms, keeping the capital's food and power records available after the central halls closed."
 fallout.event_log.orientation.detail.capital_disperse_partial: "Officials moved the marked stores and some offices, but the outer registry escaped the order and districts began making independent claims."
 fallout.event_log.orientation.detail.capital_disperse_failure: "The dispersal order arrived after the stores had moved, leaving the capital without a shared count and adding a documented grievance to the government memory."
 fallout.event_log.orientation.detail.capital_evacuation_success: "The poisoned core was evacuated into prepared receiving shelters, and the migration route moved families without exceeding the receiving state's capacity."
 fallout.event_log.orientation.detail.capital_evacuation_partial: "The evacuation moved the first wards into receiving shelters, but capacity limits left a visible queue and a narrower capital government."
 fallout.event_log.orientation.detail.capital_evacuation_failure: "The evacuation met a blocked route and overloaded shelters, costing lives while the poisoned core remained outside reliable administration."
 fallout.event_log.orientation.detail.resource_ration_success: "The ration office tied food, water, and medicine to one inspected measure, keeping the most exposed wards supplied through the first resource crisis."
 fallout.event_log.orientation.detail.resource_ration_partial: "The ration office protected clinics and central kitchens, but weak filters and late deliveries made access depend on district connections."
 fallout.event_log.orientation.detail.resource_ration_failure: "The ration office ran out of usable stock before the review closed, and the crisis record carries a medicine loss beside the empty food ledger."
 fallout.event_log.orientation.detail.resource_requisition_success: "Guarded requisition secured the marked depots and restored a short supply route, while the government accepted the recognition cost of taking stores by order."
 fallout.event_log.orientation.detail.resource_requisition_partial: "Guarded requisition secured one depot and missed another, keeping the army supplied while districts prepared their own claims against the ministry."
 fallout.event_log.orientation.detail.resource_requisition_failure: "The requisition column reached empty warehouses, and the failed order consumed recognition without restoring food, fuel, or trust."
 fallout.event_log.orientation.detail.resource_tailored_success: "A tailored reserve plan matched the country's weakest resource to its strongest repair route, returning scrap and support to the wards that could use them."
 fallout.event_log.orientation.detail.resource_tailored_partial: "A tailored reserve plan repaired the priority route, but the weakest resource still divided the capital kitchens from the outlying shelters."
 fallout.event_log.orientation.detail.resource_tailored_failure: "A tailored reserve plan chose a route the state could not supply, leaving the crisis ledger with a visible shortfall and no credible second measure."
 fallout.event_log.orientation.detail.government_consolidate_success: "The consolidation compact gave one authority responsibility for food, shelter, and recognition, stabilizing the state while its first winter offices took shape."
 fallout.event_log.orientation.detail.government_consolidate_partial: "The consolidation compact held in the capital and two districts, but contested offices kept the authority from speaking for every shelter."
 fallout.event_log.orientation.detail.government_consolidate_failure: "The consolidation compact collapsed under a legitimacy dispute, and the government entered the next crisis with lower cohesion and a public claim against its authority."
 fallout.event_log.orientation.detail.government_division_success: "The divided government assigned separate relief and security offices, then recorded a working institutional compact between them."
 fallout.event_log.orientation.detail.government_division_partial: "The divided government kept both offices open, but disputed jurisdiction left relief queues and security patrols answering to different ledgers."
 fallout.event_log.orientation.detail.government_division_failure: "The divided government could not reconcile its offices, and the dispute ticket became a standing claim against the state's shelter and recognition reserves."
 fallout.event_log.orientation.detail.government_rival_success: "A rival authority entered the government under a written settlement, preserving its local reach while returning a share of recognition to the national ledger."
 fallout.event_log.orientation.detail.government_rival_partial: "A rival authority accepted autonomous status and kept its own ward offices, leaving the national government with a narrower but workable compact."
 fallout.event_log.orientation.detail.government_rival_failure: "The rival authority broke the settlement and carried its patrols beyond the state office, turning a government dispute into an open rupture."
 fallout.event_log.orientation.detail.character_relief_success: "The relief administrator took charge of the medicine route, restored a recovery promise, and gave the shelters a recognized name for the work ahead."
 fallout.event_log.orientation.detail.character_relief_partial: "The relief administrator reached the clinics and a portion of the shelters, but limited capacity left the recovery promise dependent on the next convoy."
 fallout.event_log.orientation.detail.character_relief_failure: "The relief administrator lost the medicine route, and the refusal entered the national memory beside a lower recognition reserve."
 fallout.event_log.orientation.detail.character_security_success: "The security coordinator protected the fuel and scrap corridors, raising confidence in the patrols without erasing the civilian relief office."
 fallout.event_log.orientation.detail.character_security_partial: "The security coordinator held the central corridor while outer routes remained contested, leaving patrol authority useful but openly conditional."
 fallout.event_log.orientation.detail.character_security_failure: "The security extraction failed, the shelters lost confidence in the patrols, and deaths were recorded before the corridor could be reopened."
 fallout.event_log.orientation.detail.character_institution_success: "The regional institution took responsibility for reclamation, turning a candidate roster into a named public office with a credible first repair program."
 fallout.event_log.orientation.detail.character_institution_partial: "The regional institution opened a reclamation office and a partial work roster, while unresolved shelter claims kept its authority local."
 fallout.event_log.orientation.detail.character_institution_failure: "The regional institution collapsed before it could staff the reclamation route, leaving the shelters with less capacity and no shared work calendar."
 fallout.event_log.orientation.detail.invalid: "The orientation history row has no matching branch receipt, so the Ash-week ledger remains closed to an unverified result."
