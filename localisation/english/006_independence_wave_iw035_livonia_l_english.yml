l_english:
  independence_wave_iw035_livonia_category: "Livonian Baltic Settlement"
  independence_wave_iw035_livonia_category_desc: "Rail coordination: §Y[?independence_wave_iw035_livonia_rail_coordination|0]§! / [?constant:independence_wave_iw035_livonia_value.maximum|0]\nCivic legitimacy: §Y[?independence_wave_iw035_livonia_civic_legitimacy|0]§! / [?constant:independence_wave_iw035_livonia_value.maximum|0]\nCoastal security: §Y[?independence_wave_iw035_livonia_coastal_security|0]§! / [?constant:independence_wave_iw035_livonia_value.maximum|0]\nLivonian watch: §Y[?independence_wave_iw035_livonia_watch_hold_days|0]§! / [?constant:independence_wave_iw035_livonia_value.watch_required|0] days\n\nThe Livonian route is a Lithuanian-led Baltic project with old rail lines, coastal depots, and competing municipal memories. A common authority must make the corridor defensible without pretending that a cosmetic identity has erased the existing Lithuanian state."

  independence_wave_iw035_compile_baltic_rail_ledgers: "Compile the Baltic Rail Ledgers"
  independence_wave_iw035_compile_baltic_rail_ledgers_desc: "Reconcile rail allocations, Baltic depots, coastal warehouses, and customs manifests. The ledger makes the Livonian corridor legible, but it spends clerks, railway stock, and a deliberate call on the population."
  independence_wave_iw035_depot_cost: "£command_power §Y[?constant:independence_wave_iw035_livonia_cost.depot_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw035_livonia_cost.depot_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw035_livonia_cost.depot_trains|0]§!"
  independence_wave_iw035_compile_baltic_rail_ledgers_effect_tt: "Gain §G+[?constant:independence_wave_iw035_livonia_value.depot_survey_gain|0]§! Rail Coordination, §G+[?constant:independence_wave_iw035_livonia_value.depot_survey_legitimacy_gain|0]§! Civic Legitimacy, and §G+[?constant:independence_wave_iw035_livonia_value.depot_survey_security_gain|0]§! Coastal Security."

  independence_wave_iw035_establish_baltic_coastal_watch: "Establish the Baltic Coastal Watch"
  independence_wave_iw035_establish_baltic_coastal_watch_desc: "Place coastal signal stations, harbour patrols, and Baltic defence stores under a common watch bill. The watch protects the route without changing Lithuania's state ownership."
  independence_wave_iw035_coastal_watch_cost: "£command_power §Y[?constant:independence_wave_iw035_livonia_cost.coastal_watch_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw035_livonia_cost.coastal_watch_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw035_livonia_cost.coastal_watch_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw035_livonia_cost.coastal_watch_support_equipment|0]§!"
  independence_wave_iw035_establish_baltic_coastal_watch_effect_tt: "Gain §G+[?constant:independence_wave_iw035_livonia_value.coastal_watch_coordination_gain|0]§! Rail Coordination and §G+[?constant:independence_wave_iw035_livonia_value.coastal_watch_security_gain|0]§! Coastal Security, but lose §R[?constant:independence_wave_iw035_livonia_value.coastal_watch_legitimacy_loss|0]§! Civic Legitimacy."

  independence_wave_iw035_hold_livonian_corridor_watch: "Hold the Livonian Corridor Watch"
  independence_wave_iw035_hold_livonian_corridor_watch_desc: "Keep one Baltic anchor supplied while the garrison patrols rail junctions and coastal approaches. The watch succeeds only when an anchor state remains controlled and a division holds it."
  independence_wave_iw035_hold_livonian_corridor_watch_success_effect_tt: "The Livonian corridor holds. Gain §G+[?constant:independence_wave_iw035_livonia_value.depot_survey_gain|0]§! Rail Coordination, §G+[?constant:independence_wave_iw035_livonia_value.depot_survey_legitimacy_gain|0]§! Civic Legitimacy, and §G+[?constant:independence_wave_iw035_livonia_value.coastal_watch_security_gain|0]§! Coastal Security."
  independence_wave_iw035_hold_livonian_corridor_watch_failure_effect_tt: "The Livonian corridor watch breaks. Civic confidence and logistics suffer."

  independence_wave_iw035_charter_baltic_municipalities: "Charter the Baltic Municipalities"
  independence_wave_iw035_charter_baltic_municipalities_desc: "Give Baltic councils a common charter for language, schools, land, and municipal defence. The charter raises legitimacy while requiring railway and administrative resources."
  independence_wave_iw035_charter_cost: "£command_power §Y[?constant:independence_wave_iw035_livonia_cost.charter_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw035_livonia_cost.charter_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw035_livonia_cost.charter_trains|0]§!"
  independence_wave_iw035_charter_baltic_municipalities_effect_tt: "Adopt the Baltic Municipal Charter: gain §G+[?constant:independence_wave_iw035_livonia_value.municipal_charter_coordination_gain|0]§! Rail Coordination and §G+[?constant:independence_wave_iw035_livonia_value.municipal_charter_legitimacy_gain|0]§! Civic Legitimacy, but lose §R[?constant:independence_wave_iw035_livonia_value.municipal_charter_security_loss|0]§! Coastal Security."

  independence_wave_iw035_establish_federal_coastal_compact: "Establish the Federal Coastal Compact"
  independence_wave_iw035_establish_federal_coastal_compact_desc: "Bind Baltic rail districts, coastal officers, and municipal councils to a federal compact. It sacrifices short-term coordination for a durable settlement and stronger coastal security."
  independence_wave_iw035_federal_compact_cost: "£manpower_texticon §Y[?constant:independence_wave_iw035_livonia_cost.federal_compact_manpower|0]§!  £army_experience §Y[?constant:independence_wave_iw035_livonia_cost.federal_compact_army_experience|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw035_livonia_cost.federal_compact_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw035_livonia_cost.federal_compact_support_equipment|0]§!"
  independence_wave_iw035_establish_federal_coastal_compact_effect_tt: "Adopt the Federal Coastal Compact: lose §R[?constant:independence_wave_iw035_livonia_value.federal_compact_coordination_loss|0]§! Rail Coordination and gain §G+[?constant:independence_wave_iw035_livonia_value.federal_compact_security_gain|0]§! Coastal Security and §G+[?constant:independence_wave_iw035_livonia_value.federal_compact_legitimacy_gain|0]§! Civic Legitimacy."

  independence_wave_iw035_livonia_contested_baltic_administration: "Contested Baltic Administration"
  independence_wave_iw035_livonia_contested_baltic_administration_desc: "Rail offices, coastal commands, and municipal councils still answer to different ledgers."
  independence_wave_iw035_livonia_coordinated_rail_authority: "Coordinated Rail Authority"
  independence_wave_iw035_livonia_coordinated_rail_authority_desc: "A common rail authority keeps the Baltic corridor supplied while the settlement is negotiated."
  independence_wave_iw035_livonia_municipal_baltic_charter: "Municipal Baltic Charter"
  independence_wave_iw035_livonia_municipal_baltic_charter_desc: "Municipal guarantees give the Livonian settlement a civic foundation."
  independence_wave_iw035_livonia_federal_coastal_compact: "Federal Coastal Compact"
  independence_wave_iw035_livonia_federal_coastal_compact_desc: "A federal compact joins Baltic districts and coastal defence."
