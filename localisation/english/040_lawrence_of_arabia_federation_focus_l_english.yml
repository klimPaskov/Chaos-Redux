l_english:
# ---------------------------------------------------------------------------
# Federation focus tree
# ---------------------------------------------------------------------------
lawrence_fed_navigation_charter: "Charter"
lawrence_fed_navigation_economy: "Economy and Oil"
lawrence_fed_navigation_army: "Army"
lawrence_fed_navigation_air_coast: "Air and Coast"
lawrence_fed_navigation_centre: "Federal Centre"
lawrence_fed_navigation_diplomacy: "Diplomacy"
lawrence_fed_navigation_integration: "Integration"
lawrence_fed_provisional_government: "The Provisional Federal Government"
lawrence_fed_provisional_government_desc: "The congress has signed a charter and the capital has not yet finished moving its ministries. The first weeks decide whether the charter is a government or a document. Delegates sit in the temporary capital, clerks copy the members' laws side by side and the first revenue ledger has three different currencies in it."
lawrence_fed_provisional_government_tt: "The charter takes effect. Federal Authority rises by §Y[?constant:lawrence_focus.authority_medium|0]§!, the cabinet receives §Y[?constant:lawrence_focus.political_power|0]§! political power and §Y[?constant:lawrence_focus.command_power|0]§! command power and the first federal decisions are open."
lawrence_fed_customs_line: "Federal Customs Line"
lawrence_fed_customs_line_desc: "Every member taxes the same caravan, the same railway wagon and the same ship. One customs office on each border, one tariff schedule and one revenue ledger turn thirty collections into a single account the members can read."
lawrence_fed_customs_line_tt: "Counts as one step towards replacing §YUneven Administration§!, the cabinet receives §Y[?constant:lawrence_focus.political_power|0]§! political power from the first unified revenue and Federal Authority rises by §Y[?constant:lawrence_focus.authority_small|0]§!."
lawrence_fed_member_railways: "Connect the Member Railways"
lawrence_fed_member_railways_desc: "The member lines were built by different companies for different masters and many end at a border for lack of a bridge or a matching gauge. Federal engineers survey the gaps and close the ones the founding states need first."
lawrence_fed_member_railways_tt: "One level of infrastructure is built in up to §Y[?constant:lawrence_focus.program_states|0]§! founding states."
lawrence_fed_port_plan: "Red Sea and Gulf Port Plan"
lawrence_fed_port_plan_desc: "Hodeidah, Jeddah, Aqaba, Basra and the smaller harbours serve different members and compete for the same cargoes. A common plan decides which ports get cranes, which get a quay and which stay fishing harbours."
lawrence_fed_port_plan_tt: "A dockyard is built in up to §Y[?constant:lawrence_focus.program_states|0]§! coastal founding states and the navy receives §Y[?constant:lawrence_focus.convoys|0]§! convoys."
lawrence_fed_oil_settlement: "Oil Revenue Settlement"
lawrence_fed_oil_settlement_desc: "The wells and pipelines sit in some states and the refineries and customers in others. The settlement writes down who pays whom for every barrel, which ends the first quarrel between members and gives the treasury a share it can plan with."
lawrence_fed_oil_settlement_tt: "The treasury receives §Y[?constant:lawrence_focus.fuel|0]§! fuel, Federal Authority rises by §Y[?constant:lawrence_focus.authority_medium|0]§! and gains a permanent monthly baseline."
lawrence_fed_federal_depots: "Federal Supply Depots"
lawrence_fed_federal_depots_desc: "A depot is cheap beside a lost army. The federal staff chooses sites on the railway junctions and the oasis towns, stocks them from the members' warehouses and gives every member the right to draw from all of them."
lawrence_fed_federal_depots_tt: "A supply hub is built in up to §Y[?constant:lawrence_focus.program_states|0]§! founding states."
lawrence_fed_industrial_projects: "Industrial Projects Outside the Core"
lawrence_fed_industrial_projects_desc: "The federation's money should not all go to the capital's district. The council funds workshops, mills and power stations in the founding states that were left out of every earlier plan, on the condition that members supply the labour."
lawrence_fed_industrial_projects_tt: "A civilian factory is built in up to §Y[?constant:lawrence_focus.program_states|0]§! founding states."
lawrence_fed_repair_standards: "Common Equipment Repair Standards"
lawrence_fed_repair_standards_desc: "An axle, a gun mount or a radio set that fits in one member's army must fit in all of them. Federal workshops publish one set of drawings and one set of gauges and repair work stops depending on who sold the original."
lawrence_fed_repair_standards_tt: "Counts as one step towards resolving §YRival Commands§!. The army receives §Y[?constant:lawrence_focus.motorized_equipment|0]§! trucks, and §Y[?constant:lawrence_focus.infantry_equipment|0]§! infantry equipment and §Y[?constant:lawrence_focus.support_equipment|0]§! support equipment are redistributed."
lawrence_fed_register_member_armies: "Register the Member Armies"
lawrence_fed_register_member_armies_desc: "Every member says it can field a division and few can say where its rifles are. Federal clerks count units, depots and officers in each member's army and pool the spare rifles into one federal reserve."
lawrence_fed_register_member_armies_tt: "The federal reserve receives §Y[?constant:lawrence_focus.infantry_equipment|0]§! infantry equipment and §Y[?constant:lawrence_focus.support_equipment|0]§! support equipment and the army receives §Y[?constant:lawrence_focus.army_experience|0]§! army experience."
lawrence_fed_officer_seniority: "Resolve Officer Seniority"
lawrence_fed_officer_seniority_desc: "A British-trained major, a captain of the revolt and a regular colonel from a member army all claim the same command. The staff publishes one seniority list, with credit for every earlier service, and tells officers that appeals go to the council."
lawrence_fed_officer_seniority_tt: "Counts as one step towards resolving §YRival Commands§! and grants §Y[?constant:lawrence_focus.command_power|0]§! command power."
lawrence_fed_integrate_irregulars: "Integrate the Irregulars"
lawrence_fed_integrate_irregulars_desc: "The tribal riders and revolt bands who fought in the desert will not report to a barracks. A federal template gives them their own regiments under their own leaders, with pay, rations and a place in the order of battle."
lawrence_fed_integrate_irregulars_tt: "Unlocks the division template §YArab Irregular Division§! and grants §Y[?constant:lawrence_focus.army_experience|0]§! army experience."
lawrence_fed_reconnaissance_schools: "Desert Reconnaissance Schools"
lawrence_fed_reconnaissance_schools_desc: "Men who know the wells and the wadis teach staff officers to read them. The schools turn guides and camel scouts into instructors, and a map of water, tracks and cover that no member had alone is drawn in one place."
lawrence_fed_reconnaissance_schools_tt: "The next reconnaissance technology is researched with a large bonus."
lawrence_fed_artillery_standards: "Common Artillery and Support Standards"
lawrence_fed_artillery_standards_desc: "The members bought guns from three countries. The staff picks the calibres and the fuzes that the federation will keep and the signal, medical and supply companies that will serve every division."
lawrence_fed_artillery_standards_tt: "The next artillery technology is researched with a large bonus."
lawrence_fed_federal_general_staff: "A Federal General Staff"
lawrence_fed_federal_general_staff_desc: "One staff in one building plans for every member. Officers from every member army serve in it and the members accept its plans for the common defence in exchange for a vote on the chief of staff."
lawrence_fed_federal_general_staff_tt: "Counts as one step towards resolving §YRival Commands§!, grants §Y[?constant:lawrence_focus.command_power|0]§! command power and fixes the resolved form as §YUnified Arab General Staff§!."
lawrence_fed_member_war_council: "A Member War Council"
lawrence_fed_member_war_council_desc: "Each member keeps its own chief and sends him to a standing council. The council settles plans by vote, the members keep their regional commands and the federation answers an invasion with the speed of its slowest member."
lawrence_fed_member_war_council_tt: "Counts as one step towards resolving §YRival Commands§!, grants §Y[?constant:lawrence_focus.army_experience|0]§! army experience and fixes the resolved form as §YFederal War Council§!."
lawrence_fed_mobile_supply_columns: "Mobile Supply Columns"
lawrence_fed_mobile_supply_columns_desc: "Water, fuel and shells travel with the army in trucks and camel trains under federal control, so that a battalion on the far frontier is fed without depending on a member's road."
lawrence_fed_mobile_supply_columns_tt: "Counts as one step towards resolving §YRival Commands§! and the army receives §Y[?constant:lawrence_focus.motorized_equipment|0]§! trucks."
lawrence_fed_defend_the_long_frontier: "Defend the Long Frontier"
lawrence_fed_defend_the_long_frontier_desc: "The frontier runs for a thousand miles and no member can hold all of it. The federation assigns each stretch to the nearest garrison, builds a signal line behind it and puts a reserve at every junction."
lawrence_fed_defend_the_long_frontier_tt: "Radar stations are built in up to §Y[?constant:lawrence_focus.program_states|0]§! founding states and the federation receives §Y[?constant:lawrence_focus.manpower|0]§! manpower."
lawrence_fed_desert_airfields: "Desert Airfields"
lawrence_fed_desert_airfields_desc: "A landing strip needs level ground, fuel and a well. The federation builds airfields along the oasis chain so that the distance between two capitals becomes an afternoon's flight."
lawrence_fed_desert_airfields_tt: "An air base is built in up to §Y[?constant:lawrence_focus.program_states|0]§! founding states and the air force receives §Y[?constant:lawrence_focus.air_experience|0]§! air experience."
lawrence_fed_coastal_observation: "Coastal Observation Service"
lawrence_fed_coastal_observation_desc: "Fishermen and coastguards already watch the water. The service gives them a radio, a chart and a number to call and links every watch post to a federal plot of the Red Sea and the Gulf."
lawrence_fed_coastal_observation_tt: "A radar station is built in up to §Y[?constant:lawrence_focus.program_states|0]§! coastal founding states."
lawrence_fed_federal_transport_command: "Federal Transport Command"
lawrence_fed_federal_transport_command_desc: "Railways, trucks and ships all answer to different ministries. One command schedules them against a single timetable, which is the first time the federation can say how long it takes to move a division from one end to the other."
lawrence_fed_federal_transport_command_tt: "The railways receive §Y[?constant:lawrence_focus.trains|0]§! trains and the army receives §Y[?constant:lawrence_focus.motorized_equipment|0]§! trucks."
lawrence_fed_convoy_and_port_defence: "Convoy and Port Defence"
lawrence_fed_convoy_and_port_defence_desc: "A convoy needs escorts and a harbour needs guns. The federal navy pools the members' patrol craft, trains shared crews and posts anti-aircraft guns where the convoys wait."
lawrence_fed_convoy_and_port_defence_tt: "Anti-air batteries are built in up to §Y[?constant:lawrence_focus.program_states|0]§! coastal founding states and the navy receives §Y[?constant:lawrence_focus.convoys|0]§! convoys."
lawrence_fed_long_range_communications: "Long-Range Communications"
lawrence_fed_long_range_communications_desc: "A telegraph line follows the railway and a wireless set follows the caravan. When the capital can hear every garrison within the hour, the council can govern in days and not seasons."
lawrence_fed_long_range_communications_tt: "The next communications technology is researched with a large bonus."
lawrence_fed_air_liaison_schools: "Air Liaison Schools"
lawrence_fed_air_liaison_schools_desc: "Ground officers learn what the air force can and cannot do, and pilots learn to read the ground. The school trains the liaison teams that the federation will need in its first war."
lawrence_fed_air_liaison_schools_tt: "The air force receives §Y[?constant:lawrence_focus.air_experience|0]§! air experience and the next air technology is researched with a large bonus."
lawrence_fed_ratify_the_imperial_compact: "Ratify the Imperial Compact"
lawrence_fed_ratify_the_imperial_compact_desc: "The compact sets out what Britain will lend, what the federation will pay and which British officers may sit in federal offices. Ministers sign it knowing that it buys security with deference."
lawrence_fed_ratify_the_imperial_compact_tt: "Britain lends §Y[?constant:lawrence_focus.infantry_equipment|0]§! infantry equipment and §Y[?constant:lawrence_focus.support_equipment|0]§! support equipment and Federal Authority rises by §Y[?constant:lawrence_focus.authority_medium|0]§!."
lawrence_fed_dominion_status: "Define Dominion Status"
lawrence_fed_dominion_status_desc: "The federation will govern itself and Britain will keep the crown, the fleet and the foreign office. The members receive wide autonomy and the dominion is written into the compact."
lawrence_fed_dominion_status_tt: "The member governments gain autonomy and Federal Authority rises by §Y[?constant:lawrence_focus.authority_small|0]§!."
lawrence_fed_protectorate_status: "Accept Protectorate Status"
lawrence_fed_protectorate_status_desc: "A protectorate keeps British residents in the capital, British officers in the staff and the commissioner's signature on the budget. In return the garrison is paid for and the treasury is audited by experts."
lawrence_fed_protectorate_status_tt: "The member governments lose autonomy, Federal Authority rises by §Y[?constant:lawrence_focus.authority_large|0]§! and the army receives §Y[?constant:lawrence_focus.army_experience|0]§! army experience."
lawrence_fed_british_military_mission: "British Military Mission"
lawrence_fed_british_military_mission_desc: "British officers move into the staff college, the depots and the signal schools. They bring manuals, lessons from the last war and a habit of reporting to London."
lawrence_fed_british_military_mission_tt: "Counts as one step towards resolving §YRival Commands§! as §YBritish Arabian Command§! and the next infantry weapons technology is researched with a large bonus."
lawrence_fed_oil_and_transport_convention: "Oil and Transport Convention"
lawrence_fed_oil_and_transport_convention_desc: "British companies receive port rights, pipeline concessions and a say in the rail timetable. The federation receives a fixed share of every barrel and a guarantee of delivery in war."
lawrence_fed_oil_and_transport_convention_tt: "The treasury receives §Y[?constant:lawrence_focus.fuel|0]§! fuel and the railways receive §Y[?constant:lawrence_focus.trains|0]§! trains."
lawrence_fed_federal_voice_in_the_empire: "A Federal Voice in the Empire"
lawrence_fed_federal_voice_in_the_empire_desc: "The federation sends a minister to London with a seat at the imperial conference. Promises that were a debt become a standing commitment that both sides can read."
lawrence_fed_federal_voice_in_the_empire_tt: "Replaces §YPromise Debt§! with §YImperial Compact§! and Federal Authority rises by §Y[?constant:lawrence_focus.authority_large|0]§!."
lawrence_fed_demand_equal_partnership: "Demand Equal Partnership"
lawrence_fed_demand_equal_partnership_desc: "The federation asks for equal status, a seat at the peace table and a say in who commands British troops on its soil. London reads the demand as a warning."
lawrence_fed_demand_equal_partnership_tt: "Replaces §YPromise Debt§! with §YEqual Partnership§!, the member governments gain autonomy and Britain's opinion of the federation falls."
lawrence_fed_pillar_of_british_strategy: "The Pillar of British Strategy"
lawrence_fed_pillar_of_british_strategy_desc: "Britain's air routes, bunkers and fuel depots in the region are run under federal flags. The federation has become what the empire needed: a partner that holds the ground and asks fewer questions than a colony."
lawrence_fed_pillar_of_british_strategy_tt: "Replaces the political spirit with §YPillar of British Strategy§! and Federal Authority rises by §Y[?constant:lawrence_focus.authority_large|0]§!."
lawrence_fed_break_with_london: "Break with London"
lawrence_fed_break_with_london_desc: "The council votes to end the dominion and publishes the correspondence. London recalls its commissioner, the fleet stays in port and the federation is a sovereign state with a British debt to settle."
lawrence_fed_break_with_london_tt: "The federation is released from British overlordship and the political spirit becomes §YSovereign Arab Order§!."
lawrence_fed_convene_the_constituent_congress: "Convene the Constituent Congress"
lawrence_fed_convene_the_constituent_congress_desc: "Every member sends delegates to write the constitution in public. The sessions run for weeks, the minutes are printed and the charter that comes out of them is longer than the one signed in the first week."
lawrence_fed_convene_the_constituent_congress_tt: "Counts as one step towards replacing §YUneven Administration§! and Federal Authority rises by §Y[?constant:lawrence_focus.authority_medium|0]§!."
lawrence_fed_ratify_member_guarantees: "Ratify Member Guarantees"
lawrence_fed_ratify_member_guarantees_desc: "Every member receives a written guarantee of its laws, its courts and its dynasty or assembly. The guarantee costs the centre power and buys the members' signatures."
lawrence_fed_ratify_member_guarantees_tt: "Counts as one step towards replacing §YUneven Administration§!, the member governments gain autonomy and Federal Authority rises by §Y[?constant:lawrence_focus.authority_small|0]§!."
lawrence_fed_a_federal_cabinet: "A Federal Cabinet"
lawrence_fed_a_federal_cabinet_desc: "Ministers from several members sit in one cabinet with portfolios that cannot be traded for votes. The cabinet meets weekly and its decisions are written down, which makes it the first institution that members cannot blame on each other."
lawrence_fed_a_federal_cabinet_tt: "Federal Authority rises by §Y[?constant:lawrence_focus.authority_medium|0]§! and Federal Authority gains a permanent monthly baseline."
lawrence_fed_independent_foreign_service: "An Independent Foreign Service"
lawrence_fed_independent_foreign_service_desc: "Embassies open in the capitals of the region under one flag and one ambassador list. The federation answers diplomatic notes in its own name and receives replies in the same way."
lawrence_fed_independent_foreign_service_tt: "Every independent government of the region receives a federal embassy and thinks better of the federation."
lawrence_fed_the_common_defence_charter: "The Common Defence Charter"
lawrence_fed_the_common_defence_charter_desc: "The charter binds every member to answer an attack on any other, sets the shares of men and money and names the officers who will command the combined forces."
lawrence_fed_the_common_defence_charter_tt: "Counts as one step towards resolving §YRival Commands§!, Federal Authority rises by §Y[?constant:lawrence_focus.authority_medium|0]§! and the army receives §Y[?constant:lawrence_focus.army_experience|0]§! army experience."
lawrence_fed_recognition_beyond_the_region: "Recognition Beyond the Region"
lawrence_fed_recognition_beyond_the_region_desc: "Foreign ministries receive the federation's credentials. A treaty with Britain, a trade mission to Paris and a seat at the League tell the members that their federation is a state others deal with."
lawrence_fed_recognition_beyond_the_region_tt: "Replaces §YFederal Mistrust§! with §YCharter Trust§! and Federal Authority rises by §Y[?constant:lawrence_focus.authority_large|0]§!."
lawrence_fed_the_sovereign_arab_order: "The Sovereign Arab Order"
lawrence_fed_the_sovereign_arab_order_desc: "The federation sits at the head of a recognised order of Arab states. Its decisions are made by members who could have left and stayed."
lawrence_fed_the_sovereign_arab_order_tt: "Replaces the political spirit with §YSovereign Arab Order§! and Federal Authority rises by §Y[?constant:lawrence_focus.authority_large|0]§!."
lawrence_fed_the_personal_oath: "The Personal Oath"
lawrence_fed_the_personal_oath_desc: "Delegates, officers and headmen swear a plain oath to the charter and to the man who chairs the council. Lawrence signs beside the founding houses and not above them, and says in public that the oath binds him first."
lawrence_fed_the_personal_oath_tt: "Federal Authority rises by §Y[?constant:lawrence_focus.authority_medium|0]§! and the cabinet receives §Y[?constant:lawrence_focus.political_power|0]§! political power."
lawrence_fed_council_of_the_founding_houses: "Council of the Founding Houses"
lawrence_fed_council_of_the_founding_houses_desc: "The dynasties and assemblies that joined the union keep their seats on a council that must approve every law. It slows the chairman and it gives the houses a reason to keep the union."
lawrence_fed_council_of_the_founding_houses_tt: "Counts as one step towards replacing §YUneven Administration§! and Federal Authority gains a permanent monthly baseline."
lawrence_fed_lawrence_field_government: "The Field Government"
lawrence_fed_lawrence_field_government_desc: "The council meets in a tent when the army moves and in the capital when it rests. Lawrence keeps a small staff of liaison officers and signal men who carry orders between the commands."
lawrence_fed_lawrence_field_government_tt: "Counts as one step towards resolving §YRival Commands§! as §YLawrence's Field Household§! and grants §Y[?constant:lawrence_focus.command_power|0]§! command power."
lawrence_fed_a_crown_bound_by_charter: "A Crown Bound by Charter"
lawrence_fed_a_crown_bound_by_charter_desc: "The union writes down what its head may do and what he may not. Courts hear complaints against the chairman and the houses may remove him by vote."
lawrence_fed_a_crown_bound_by_charter_tt: "The union is governed by its charter, stability rises and Federal Authority rises by §Y[?constant:lawrence_focus.authority_medium|0]§!."
lawrence_fed_the_commanders_state: "The Commander's State"
lawrence_fed_the_commanders_state_desc: "The union keeps one commander at its head and every officer takes the oath to him. The army is loyal and quick, the houses grumble and the union depends on a man who will not live forever."
lawrence_fed_the_commanders_state_tt: "The army receives §Y[?constant:lawrence_focus.army_experience|0]§! army experience and §Y[?constant:lawrence_focus.command_power|0]§! command power and Federal Authority rises by §Y[?constant:lawrence_focus.authority_large|0]§!."
lawrence_fed_secure_a_succession: "Secure a Succession"
lawrence_fed_secure_a_succession_desc: "The council names who follows the chairman and writes the rule in the charter. Lawrence signs it first and sends it to every house."
lawrence_fed_secure_a_succession_tt: "Replaces §YPersonal Settlement§! with §YSuccession Settlement§! and Federal Authority rises by §Y[?constant:lawrence_focus.authority_large|0]§!."
lawrence_fed_separate_the_state_from_the_man: "Separate the State from the Man"
lawrence_fed_separate_the_state_from_the_man_desc: "The union outlives its founder when the council holds the office and Lawrence returns to the field. The office passes to a council of the founding houses and the union becomes an institution."
lawrence_fed_separate_the_state_from_the_man_tt: "The Council of the Founding Houses becomes head of state, Lawrence keeps his field command and the political spirit becomes §YThe Union After Lawrence§!."
lawrence_fed_federal_census_and_revenue: "Federal Census and Revenue Agreement"
lawrence_fed_federal_census_and_revenue_desc: "A census counts every household, every flock and every well. The revenue agreement divides the proceeds in public, and the first honest ledger in the region appears."
lawrence_fed_federal_census_and_revenue_tt: "Counts as one step towards replacing §YUneven Administration§! and Federal Authority rises by §Y[?constant:lawrence_focus.authority_medium|0]§!."
lawrence_fed_central_federal_state: "The Central Federal State"
lawrence_fed_central_federal_state_desc: "Ministries answer to the centre, courts apply one code and tax collectors report to the capital. The members lose their veto and the centre gains the means to carry a decision out."
lawrence_fed_central_federal_state_tt: "The member governments lose autonomy, Federal Authority rises by §Y[?constant:lawrence_focus.authority_large|0]§! and the administration will settle as §YCentral Federal Administration§!."
lawrence_fed_charter_federation: "The Charter Federation"
lawrence_fed_charter_federation_desc: "Members keep their own courts, their own revenue offices and their own regional commands and the centre keeps the charter, the foreign service and a share of the customs. The federation moves slowly and nobody leaves it."
lawrence_fed_charter_federation_tt: "The member governments gain autonomy, Federal Authority rises by §Y[?constant:lawrence_focus.authority_medium|0]§! and the administration will settle as §YCharter Administration§!."
lawrence_fed_regional_administrative_offices: "Regional Administrative Offices"
lawrence_fed_regional_administrative_offices_desc: "A federal office in each founding state hears appeals, keeps the register of land and water and trains local clerks. The offices are built where the members' own buildings were too few."
lawrence_fed_regional_administrative_offices_tt: "Counts as one step towards replacing §YUneven Administration§! and every founding state gains an additional shared building slot."
lawrence_fed_a_reformed_federation: "A Reformed Federation"
lawrence_fed_a_reformed_federation_desc: "Years of practice have taught the members what the centre can do and what it must leave alone. A reform commission rewrites the charter and ends the temporary arrangements."
lawrence_fed_a_reformed_federation_tt: "The administration is settled at once and Federal Authority rises by §Y[?constant:lawrence_focus.authority_large|0]§!."
lawrence_fed_a_federation_of_members: "A Federation of Members"
lawrence_fed_a_federation_of_members_desc: "The reform keeps the members whole. They send delegates to a standing assembly, hold their own armies in reserve and share a treasury, a foreign service and a charter."
lawrence_fed_a_federation_of_members_tt: "The administration spirit becomes §YFederation of Members§! and the member governments gain autonomy."
lawrence_fed_one_federal_state: "One Federal State"
lawrence_fed_one_federal_state_desc: "The members give up their separate governments. Their ministries, armies and treasuries merge into the federation and their territory becomes core territory of one state, over the objection of the members' own politicians."
lawrence_fed_one_federal_state_tt: "The administration spirit becomes §YOne Federal State§! and every AI member government is absorbed with its territory and troops."
lawrence_fed_recognition_missions: "Recognition Missions"
lawrence_fed_recognition_missions_desc: "Envoys carry the charter to the neighbouring capitals, with a map of the new borders and a promise that none of them will change by force."
lawrence_fed_recognition_missions_tt: "Every neighbouring independent government receives a federal embassy and Federal Authority rises by §Y[?constant:lawrence_focus.authority_small|0]§!."
lawrence_fed_settle_relations_with_britain: "Settle Relations with Britain"
lawrence_fed_settle_relations_with_britain_desc: "The federation sends a minister to London with a list of what it owes, what it expects and what it will not discuss. A treaty or an understanding follows, and Britain's ministers are no longer guessing."
lawrence_fed_settle_relations_with_britain_tt: "Britain thinks better of the federation and, for a federation that is not a British subject, guarantees its independence."
lawrence_fed_negotiate_with_the_regional_powers: "Negotiate with France and the Other Powers"
lawrence_fed_negotiate_with_the_regional_powers_desc: "France holds Syria and Lebanon, Italy watches the Red Sea and Persia and Turkey keep their own ambitions. The federation asks each for a written statement of what it will and will not do."
lawrence_fed_negotiate_with_the_regional_powers_tt: "Every major power receives a federal embassy and thinks better of the federation."
lawrence_fed_invite_new_members: "Invite New Members"
lawrence_fed_invite_new_members_desc: "The charter has an open article. A government that wants to join receives a seat in the assembly and a negotiated autonomy, and the federation sends the first invitation at once."
lawrence_fed_invite_new_members_tt: "One willing independent government receives an invitation to join as an autonomous dominion and Federal Authority rises by §Y[?constant:lawrence_focus.authority_small|0]§!."
lawrence_fed_guarantee_the_charter_states: "Guarantee the Charter States"
lawrence_fed_guarantee_the_charter_states_desc: "The federation guarantees the borders of the independent governments that signed the counter-bloc compact. Each guarantee is a promise to fight for a neighbour and a reason for the neighbour to trust the centre."
lawrence_fed_guarantee_the_charter_states_tt: "The federation guarantees every independent partner of the Lawrence mission."
lawrence_fed_an_arab_league: "An Arab League"
lawrence_fed_an_arab_league_desc: "A federation of one kind can still lead a league of another. The league needs rules for members, exits, wars and a chair, and the federation writes them."
lawrence_fed_an_arab_league_tt: "The federation founds a league and its subject members join it."
lawrence_fed_regional_arbitration: "Regional Arbitration"
lawrence_fed_regional_arbitration_desc: "Border disputes, water rights and tariff quarrels go to a federal court of arbitration whose rulings both sides have agreed to accept. The court rules slowly and its rulings stand."
lawrence_fed_regional_arbitration_tt: "Federal Authority rises by §Y[?constant:lawrence_focus.authority_large|0]§! and gains a permanent monthly baseline."
lawrence_fed_voluntary_accession: "Voluntary Accession"
lawrence_fed_voluntary_accession_desc: "The federation answers every request for membership within a season. A government that accepts the charter enters as a dominion with its own army, its own courts and a place in the assembly."
lawrence_fed_voluntary_accession_tt: "One willing independent government receives an invitation to join and Federal Authority rises by §Y[?constant:lawrence_focus.authority_small|0]§!."
lawrence_fed_integration_commission: "The Integration Commission"
lawrence_fed_integration_commission_desc: "A commission of members and federal officers lists the land, the water rights and the public buildings of every acceding member and draws the lines that the charter will recognise."
lawrence_fed_integration_commission_tt: "The federation claims the states of its subject members."
lawrence_fed_associated_state_charter: "The Associated State Charter"
lawrence_fed_associated_state_charter_desc: "A member that is not ready to merge may keep its seat in an associated status. Its people vote on each stage of integration and its laws are changed only with its own assembly's consent."
lawrence_fed_associated_state_charter_tt: "Subject members share the benefits of the league for a year."
lawrence_fed_staged_cores: "Staged Cores"
lawrence_fed_staged_cores_desc: "After two years of joint administration, the states of an acceding member become core territory of the federation, one district at a time and only with the consent of the member's assembly."
lawrence_fed_staged_cores_tt: "The states of subject members become core territory of the federation."
