l_english:
brilliant_scientist_foreign_operations_category: "The International Contest"
brilliant_scientist_foreign_operations_category_desc: "Doctor Warren Kruger's work in [brilliant_scientist_current_host.GetNameDef] has become a matter of foreign policy. Our current interest is [?brilliant_scientist_foreign_interest|0]. Diplomacy, intelligence access, ideology, relations, project maturity, host security, and the memory of earlier operations shape every approach."

brilliant_scientist_foreign_observe_program: "Observe the Kruger Programme"
brilliant_scientist_foreign_observe_program_desc: "Map the institutions, visitors, facility traffic, and public claims surrounding Doctor Kruger's programme in [FROM.GetNameDef]. A sound dossier can improve later operations, but an exposed survey will alert the host."
brilliant_scientist_foreign_send_formal_invitation: "Send a Formal Invitation"
brilliant_scientist_foreign_send_formal_invitation_desc: "Invite Doctor Kruger to visit our laboratories under official protection. [FROM.GetNameDef] may refuse, permit limited talks, or allow him to decide whether the invitation should become a permanent departure."
brilliant_scientist_foreign_recruit_assistant: "Recruit a Kruger Assistant"
brilliant_scientist_foreign_recruit_assistant_desc: "Approach a senior assistant connected to the most advanced active project in [FROM.GetNameDef]. Success brings one family of Theory knowledge and weakens the host programme."
brilliant_scientist_foreign_steal_archive: "Steal a Project Archive"
brilliant_scientist_foreign_steal_archive_desc: "Penetrate the archive of [FROM.GetNameDef]'s most advanced active project. A complete theft yields only that family's Theory knowledge and marks the source archive as stolen."
brilliant_scientist_foreign_sabotage_project: "Sabotage a Kruger Project"
brilliant_scientist_foreign_sabotage_project_desc: "Strike the most advanced undamaged project in [FROM.GetNameDef]. A successful operation damages that family without erasing its accumulated stage."
brilliant_scientist_foreign_encourage_defection: "Encourage Kruger's Defection"
brilliant_scientist_foreign_encourage_defection_desc: "Use existing contact and Doctor Kruger's dissatisfaction to arrange a voluntary departure from [FROM.GetNameDef]. His private reach favors defection, while dependence and host security work against it."
brilliant_scientist_foreign_extract_kruger: "Extract Doctor Kruger"
brilliant_scientist_foreign_extract_kruger_desc: "Prepare a coercive extraction from [FROM.GetNameDef]. Intelligence capability, access, and prior penetration improve the route. Host security and Kruger's independent network make a clean kidnapping harder."
brilliant_scientist_foreign_offer_protection: "Offer a Protection Compact"
brilliant_scientist_foreign_offer_protection_desc: "Offer [FROM.GetNameDef] a security detachment and counterintelligence support in exchange for access and influence over the Kruger programme. Only one full protection framework can govern the programme."
brilliant_scientist_foreign_attempt_assassination: "Attempt to Assassinate Kruger"
brilliant_scientist_foreign_attempt_assassination_desc: "Authorize an exceptional attempt against Doctor Kruger. This requires a strategic project threat, a capable service, access, and severe hostility. Clone, machine, temporal, and extraterrestrial evidence can make a confirmed death impossible."
brilliant_scientist_foreign_public_challenge: "Publicly Challenge the Programme"
brilliant_scientist_foreign_public_challenge_desc: "Use authenticated observation, exposed research, or stolen evidence to demand a public answer from [FROM.GetNameDef]. The challenge can force a demonstration, inspection, publication, or a diplomatic confrontation."
brilliant_scientist_foreign_build_counter_program: "Build a Counter-Kruger Programme"
brilliant_scientist_foreign_build_counter_program_desc: "Use captured evidence and a dedicated research service to build a family-specific countermeasure against [FROM.GetNameDef]'s most advanced project. The programme consumes support equipment and occupies the service for four months."

brilliant_scientist_foreign_observe_requirements_tt: "The International Contest must be active. Our interest must support observation, the target must remain the current host, and neither side may already be handling an incompatible operation. This survey can be attempted only once against each host."
brilliant_scientist_foreign_invitation_requirements_tt: "Requires diplomatic access, peace with the current host, sufficient foreign interest, and an open operation slot. The invitation can be sent only once to each host."
brilliant_scientist_foreign_recruitment_requirements_tt: "Requires an active Kruger project plus diplomatic or intelligence access. The host's most advanced active project family becomes the recruitment target."
brilliant_scientist_foreign_theft_requirements_tt: "Requires intelligence access, sufficient interest, an active project family, and no shared faction with the host. The archive of the host's most advanced active family becomes the target."
brilliant_scientist_foreign_sabotage_requirements_tt: "Requires intelligence access, a hostile motive, a valid undamaged project target, and no shared faction with the host."
brilliant_scientist_foreign_defection_requirements_tt: "Requires diplomatic access, a valid transfer recipient, and either prior contact or serious dissatisfaction from Doctor Kruger. He cannot leave while assigned to an active special project."
brilliant_scientist_foreign_extraction_requirements_tt: "Requires high interest, intelligence access, a valid recipient, and no shared faction with the host. Doctor Kruger cannot be extracted while assigned to an active special project."
brilliant_scientist_foreign_protection_requirements_tt: "Requires diplomatic access, peace, enough support equipment for the offered detachment, and a host that has never accepted a full protection framework."
brilliant_scientist_foreign_assassination_requirements_tt: "Requires a strategic Deployment or Weaponization threat, a strong intelligence service, access, severe hostility, and no shared faction with the host. This attempt is available only once against each host."
brilliant_scientist_foreign_public_challenge_requirements_tt: "Requires foreign interest at the public-challenge threshold and evidence from observation, exposure, detected operations, or a strategic project. The actor needs diplomatic or intelligence access and can challenge each host only once."
brilliant_scientist_foreign_counter_program_requirements_tt: "Requires foreign interest at the counter-program threshold, intelligence access, an active host project, one prior evidence receipt, and 250 support equipment. Each actor can build one countermeasure programme against a host."

brilliant_scientist_foreign_observe_effect_tt: "The survey lasts 30 days. Intelligence strength, relations, host Exposure, and Directorate security determine the dossier and whether the observers are identified."
brilliant_scientist_foreign_invitation_effect_tt: "The host receives the invitation immediately and chooses how much authority Doctor Kruger has over the answer."
brilliant_scientist_foreign_recruitment_effect_tt: "The courtship lasts 45 days. Success grants Theory knowledge from the selected family and reduces the host's Project Capacity. Detection raises host security alert and diplomatic risk."
brilliant_scientist_foreign_theft_effect_tt: "The archive operation lasts 60 days. Success grants one selected family at Theory level and records that archive as stolen. It never transfers Doctor Kruger or the wider Event 16 package."
brilliant_scientist_foreign_sabotage_effect_tt: "The sabotage operation lasts 75 days. Success damages the exact selected family. Partial success causes a capacity loss and exposure without deleting project progress."
brilliant_scientist_foreign_defection_effect_tt: "The defection channel lasts 60 days. Kruger's host, custody, and freedom to travel are checked again at the final rendezvous. A compromised route can yield only a partial result."
brilliant_scientist_foreign_extraction_effect_tt: "The extraction operation lasts 75 days. Kruger's host, custody, and freedom to travel are checked again at the final rendezvous. A partial result may recover an assistant and one family's Theory knowledge instead."
brilliant_scientist_foreign_offer_protection_effect_tt: "The host chooses between a full compact, a limited liaison, and refusal. A full compact transfers 100 support equipment and lowers later hostile-operation success."
brilliant_scientist_foreign_assassination_effect_tt: "The attempt lasts 90 days. A genuine death is possible only before clone, machine, temporal, or extraterrestrial continuity. Other outcomes include injury, a false target, exposed failure, and a sovereignty crisis."
brilliant_scientist_foreign_public_challenge_effect_tt: "The challenge is public and immediate. The host chooses a safe demonstration, denial, selected publication, a sabotage explanation, neutral observers, or a threat against the accuser. Every answer changes the host's Exposure and diplomatic memory."
brilliant_scientist_foreign_counter_program_effect_tt: "The counter-Kruger programme lasts 120 days and consumes 60 Political Power plus 250 support equipment. Success records the exact project family and improves later operations against this host without granting its project stage or Doctor Kruger's identity."

