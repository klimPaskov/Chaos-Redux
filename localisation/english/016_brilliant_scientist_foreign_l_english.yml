chaosx_nr16_100_title: "An Invitation for Doctor Kruger"
chaosx_nr16_100_desc: "[brilliant_scientist_foreign_operation_actor.GetNameDef] has invited Doctor Warren Kruger to inspect its laboratories and discuss a permanent scientific appointment. The proposal is official enough to demand an answer, but broad enough to conceal whether the true object is cooperation, defection, or access to the programme. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_100_a: "Decline without opening the laboratory files."
chaosx_nr16_100_b: "Permit a limited visit under our rules."
chaosx_nr16_100_c: "Let Kruger decide whether he will leave."
chaosx_nr16_101_title: "The Invitation Answered"
chaosx_nr16_101_desc_success: "Doctor Kruger has accepted the invitation and the host permitted his departure. The transfer is complete: he and the records of his work have entered our custody. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_101_desc_partial: "The host has allowed a controlled scientific visit, but no permanent transfer. The resulting contact may support later diplomacy or intelligence work. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_101_desc_failure: "The host refused the invitation and closed the official channel. Any later approach will require a different method. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_101_a: "Record the answer in the scientific file."

chaosx_nr16_110_title: "A Foreign Protection Compact"
chaosx_nr16_110_desc: "[brilliant_scientist_foreign_operation_actor.GetNameDef] offers counterintelligence officers, secure transport, and a detachment of support equipment for the Kruger programme. In return it asks for access, consultation rights, and influence over any extraction route. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_110_a: "Accept the full security compact."
chaosx_nr16_110_b: "Admit a limited liaison team."
chaosx_nr16_110_c: "Keep foreign officers outside the laboratories."
chaosx_nr16_111_title: "The Protection Offer Answered"
chaosx_nr16_111_desc_success: "The host accepted a full protection compact. Our equipment and officers now strengthen the programme's defenses, while our access gives us a lasting voice in its security. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_111_desc_partial: "The host accepted a limited liaison. We gained observation access, but not the authority or deterrent effect of a full compact. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_111_desc_failure: "The host rejected foreign protection and retained sole authority over the programme's defenses. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_111_a: "Set the limits of our commitment in writing."

chaosx_nr16_detected_secure_a: "Seal the laboratories and rotate every clearance."
chaosx_nr16_detected_protest_b: "Attribute the operation and confront its sponsor."

chaosx_nr16_120_title: "Foreign Eyes around the Programme"
chaosx_nr16_120_desc: "Security officers have identified an observation effort tied to [brilliant_scientist_foreign_operation_actor.GetNameDef]. Visitors, traffic counts, and public records were assembled into a picture of the Kruger programme. The depth of that picture remains uncertain. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_121_title: "Survey of the Kruger Programme"
chaosx_nr16_121_desc_success: "The observers reconstructed the programme's institutional shape and established a durable dossier. Later operations will benefit from this knowledge. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_121_desc_partial: "The survey produced fragments and useful contacts, but no complete map of the programme. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_121_desc_failure: "The observers failed to establish a reliable picture. If they were identified, the host has also tightened its guard. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_121_a: "Archive the dossier with its attribution risk."

chaosx_nr16_130_title: "An Assistant Is Being Courted"
chaosx_nr16_130_desc: "A senior assistant connected to [brilliant_scientist_foreign_operation_actor.GetBrilliantScientistForeignProjectName] has been approached by [brilliant_scientist_foreign_operation_actor.GetNameDef]. The offer combines professional access, asylum, and private pressure. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_131_title: "Assistant Recruitment Report"
chaosx_nr16_131_desc_success: "The assistant crossed the border with enough working knowledge to establish the Theory foundation of [This.GetBrilliantScientistForeignProjectName]. The host programme lost capacity and gained a reason to distrust its own staff. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_131_desc_partial: "The assistant refused to leave but preserved a contact channel. The approach exposed part of the laboratory's personnel network. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_131_desc_failure: "The courtship failed. The assistant either remained loyal or reported the approach before useful knowledge changed hands. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_131_a: "Separate the testimony from the speculation."

chaosx_nr16_140_title: "A Project Archive Has Been Penetrated"
chaosx_nr16_140_desc: "The archive holding [brilliant_scientist_foreign_operation_actor.GetBrilliantScientistForeignProjectName] records shows signs of a foreign penetration linked to [brilliant_scientist_foreign_operation_actor.GetNameDef]. Investigators must assume that some material may already be abroad. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_141_title: "Archive Operation Report"
chaosx_nr16_141_desc_success: "The archive team recovered enough coherent material to establish the Theory foundation of [This.GetBrilliantScientistForeignProjectName]. Nothing in the haul grants the rest of Doctor Kruger's programme. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_141_desc_partial: "The team recovered an incomplete archive. It identifies [This.GetBrilliantScientistForeignProjectName] as a serious line of work, but cannot reproduce a full Theory foundation. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_141_desc_failure: "The archive operation failed before a coherent body of research could be removed. Attribution may still impose diplomatic costs. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_141_a: "Quarantine the papers before research begins."

chaosx_nr16_150_title: "Sabotage inside the Kruger Programme"
chaosx_nr16_150_desc: "A foreign operation linked to [brilliant_scientist_foreign_operation_actor.GetNameDef] struck the [brilliant_scientist_foreign_operation_actor.GetBrilliantScientistForeignProjectName] project. The attack sought to damage its physical work while leaving the accumulated science intact. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_151_title: "Project Sabotage Report"
chaosx_nr16_151_desc_success: "The sabotage team damaged the [This.GetBrilliantScientistForeignProjectName] project and reduced the host's capacity to exploit it. The project stage remains in the ledger and can be repaired. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_151_desc_partial: "The team disrupted work on [This.GetBrilliantScientistForeignProjectName] without destroying the project apparatus. The host suffered a smaller capacity loss and wider exposure. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_151_desc_failure: "The sabotage failed. Doctor Kruger now has another grievance and the host may know who authorized the attempt. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_151_a: "Measure the damage against the political cost."

chaosx_nr16_160_title: "A Defection Channel Has Been Found"
chaosx_nr16_160_desc: "Security officers have uncovered contact between Doctor Kruger's circle and [brilliant_scientist_foreign_operation_actor.GetNameDef]. The channel appears designed for a voluntary departure, with assistants and project knowledge available as lesser prizes if Kruger refuses. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_161_title: "Defection Operation Report"
chaosx_nr16_161_desc_success: "Doctor Kruger defected across the prepared route. The former host retained only scientific work its institutions had independently reproduced, while Kruger's personal records and carried portfolio entered our custody. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_161_desc_partial: "Doctor Kruger remained, but an assistant departed with the Theory foundation of [This.GetBrilliantScientistForeignProjectName]. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_161_desc_failure: "Doctor Kruger rejected the channel. The approach increased his grievance toward the host without bringing him to us. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_161_desc_race: "The route opened after Kruger's custody or host had already changed. Our network recovered only a partial result before the rendezvous collapsed. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_161_a: "Close the channel before another service finds it."

chaosx_nr16_170_title: "An Extraction Route Exposed"
chaosx_nr16_170_desc: "A coercive route aimed at Doctor Kruger has been traced to [brilliant_scientist_foreign_operation_actor.GetNameDef]. The plan joined intelligence access, transport, and inside contacts around the [brilliant_scientist_foreign_operation_actor.GetBrilliantScientistForeignProjectName] project. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_171_title: "Extraction Operation Report"
chaosx_nr16_171_desc_success: "Doctor Kruger was removed from the laboratory perimeter and reached our custody with his personal archive and scientific portfolio intact. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_171_desc_partial: "The extraction failed to secure Doctor Kruger, but an assistant and the Theory foundation of [This.GetBrilliantScientistForeignProjectName] reached our custody. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_171_desc_failure: "The extraction route collapsed. The host and Doctor Kruger emerged more hostile, and any attribution will be difficult to contain. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_171_desc_race: "The extraction reached its transfer point after Kruger's custody or host had changed. The team abandoned the rendezvous and returned with only a partial recovery. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_171_a: "Account for every person who crossed the border."

chaosx_nr16_180_title: "The Attempt on Doctor Kruger"
chaosx_nr16_180_desc_death: "The attack killed the ordinary human Doctor Kruger before a continuity system could preserve him. His offices have gone silent, while the surviving archives remain a national problem. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_180_desc_continuity: "The attack struck an iteration that held only part of Doctor Kruger's continuity. Clone, machine, temporal, or extraterrestrial evidence has turned a planned death into a sovereignty crisis. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_180_desc_injury: "Doctor Kruger survived with serious injuries. His security network is expanding and his grievance against the state that failed to protect him is severe. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_180_desc_failure: "The attack failed before reaching Doctor Kruger. Evidence of the attempt has exposed the programme and intensified his independent preparations. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_180_a: "Secure every surviving laboratory and identity record."
chaosx_nr16_180_b: "Name the sponsor and accept the confrontation."
chaosx_nr16_181_title: "Assassination Operation Report"
chaosx_nr16_181_desc_death: "The target was the ordinary human Doctor Kruger. His death is confirmed, his files have been closed, and the former host retains only its independent scientific legacy. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_181_desc_continuity: "The operation destroyed a body or identity without ending Doctor Kruger's continuity. The surviving clone, machine memory, temporal record, or extraterrestrial ambiguity has accelerated his preparations. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_181_desc_injury: "Doctor Kruger survived the attack with serious injuries. The operation achieved no final removal and created a more hostile, more independent opponent. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_181_desc_failure: "The attempt failed. The exposed programme and Doctor Kruger's grievance are now greater threats than before the operation began. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_181_a: "Seal the file as an irreversible operation."

chaosx_nr16_190_title: "A Public Challenge to the Kruger Programme"
chaosx_nr16_190_desc: "[brilliant_scientist_foreign_operation_actor.GetNameDef] has placed authenticated evidence before the world and demanded an answer from our Directorate. The challenge can be answered with a controlled demonstration, a denial, selected publication, a sabotage explanation, neutral observers, or a direct threat against the accuser. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_190_a: "Demonstrate a safe result under our rules."
chaosx_nr16_190_b: "Deny access and defend the programme's sovereignty."
chaosx_nr16_190_c: "Publish selected work before they publish it for us."
chaosx_nr16_190_d: "Blame the dangerous evidence on foreign sabotage."
chaosx_nr16_190_e: "Invite neutral observers to inspect the safe facilities."
chaosx_nr16_190_f: "Threaten the accuser and close the door."
chaosx_nr16_191_title: "Public Challenge Report"
chaosx_nr16_191_desc_success: "The public challenge produced a controlled answer. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_191_desc_partial: "The public challenge exposed the programme without producing a clean settlement. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_191_desc_failure: "The public challenge hardened the confrontation and left the programme more visible than before. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_191_a: "Record the public answer and prepare for the next question."

chaosx_nr16_193_title: "A Counter-Kruger Programme Is Exposed"
chaosx_nr16_193_desc: "Security officers have identified a foreign research service studying the [brilliant_scientist_foreign_operation_actor.GetBrilliantScientistForeignProjectName] project. The service used evidence gathered from our programme to design a countermeasure. [This.GetBrilliantScientistHostFlavorClause]"
chaosx_nr16_193_a: "Seal the laboratories and rotate the project clearances."
chaosx_nr16_193_b: "Name the foreign service and confront its government."
chaosx_nr16_194_title: "Counter-Kruger Programme Report"
chaosx_nr16_194_desc_success: "The countermeasure service completed a working response to [This.GetBrilliantScientistForeignProjectName]. Its files remain specific to this host and family, but later operations can use the recovered weaknesses. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_194_desc_partial: "The countermeasure service recovered partial evidence about [This.GetBrilliantScientistForeignProjectName]. It can guide future work, and the response remains incomplete. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_194_desc_failure: "The countermeasure service failed to turn its evidence into a reliable response to [This.GetBrilliantScientistForeignProjectName]. The support equipment and time are lost, while the host may still know who was studying it. [This.GetBrilliantScientistForeignHostFlavorClause]"
chaosx_nr16_194_a: "File the family-specific countermeasure."
