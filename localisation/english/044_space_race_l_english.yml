l_english:
chaosx.nr44.1.t: "Space Race"

chaosx.nr44.2.t: "Space Race"
chaosx.nr44.2.d: "Nations are building rockets and observatories to explore the cosmos. Each government hopes to reach orbit first and turn new discoveries into scientific and military advantages."
chaosx.nr44.2.a: "So it begins"

chaosx.nr44.3.t: "A Beautiful Sight"
chaosx.nr44.3.d: ""
chaosx.nr44.3.a: "Universe, show us the way!"

chaosx.news.48.t: "Race into space finally over!"
chaosx.news.48.d: "[From.GetName] has won the space race and revealed new discoveries from beyond the atmosphere. Its rockets and observatories now lead the world's research effort."
chaosx.news.48.a: "The race is over."
