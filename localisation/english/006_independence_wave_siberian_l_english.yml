  # SOURCE: 006_independence_wave_altai_l_english.yml
  ALT_independence_wave_constitutional_party: "Altai Civic Assembly"
  ALT_independence_wave_constitutional_party_long: "Constitutional Assembly of the Altai Mountain Compact"
  ALT_independence_wave_socialist_party: "Altai Mountain Workers' Council"
  ALT_independence_wave_socialist_party_long: "Workers' Council of the Altai Mountain Compact"
  ALT_independence_wave_traditional_party: "Altai Land Compact"
  ALT_independence_wave_traditional_party_long: "Traditional Land Compact of the Altai Communities"
  ALT_independence_wave_emergency_party: "Mountain Emergency Command"
  ALT_independence_wave_emergency_party_long: "Mountain Emergency Command Directorate"

  alt_fragmented_mountain_mandate: "Fragmented Mountain Mandate"
  alt_fragmented_mountain_mandate_desc: "Oyrot councils, mountain villages, depot keepers, and local guards recognize the provisional authority, but they have not accepted one binding settlement."
  alt_altai_frontier_compact: "Altai Frontier Compact"
  alt_altai_frontier_compact_desc: "A common charter binds the Oyrot councils and mountain guards to one civil authority while preserving local control of land and supplies."
  alt_oyrot_council: "Oyrot Communities Council"
  alt_oyrot_council_desc: "Local delegates register community rights, coordinate supplies, and give the mountain districts a voice in the provisional state."
  alt_mountain_council_charter: "Mountain Council Charter"
  alt_mountain_council_charter_desc: "The council establishes elected civic administration and guarantees representation for Altai's mountain communities."
  alt_land_rights_compact: "Altai Land Rights Compact"
  alt_land_rights_compact_desc: "Village delegates and local councils protect grazing land, food supplies, recruitment, and community administration."
  alt_mountain_workers_council: "Altai Mountain Workers' Council"
  alt_mountain_workers_council_desc: "Transport crews, workshops, and municipal committees coordinate production and supply through a common council."
  alt_mountain_emergency_command: "Mountain Emergency Command"
  alt_mountain_emergency_command_desc: "A unified staff directs the mountain guards and depot reserves while emergency rule restricts the authority of the civil councils."

  independence_wave_altai_mountain_compact_category: "Altai Mountain Compact"
  independence_wave_altai_mountain_compact_category_desc: "Council Cohesion: §Y[?independence_wave_altai_council_cohesion|0]§! / [?constant:independence_wave_altai_pressure.maximum|0]\nMountain Guard Readiness: §Y[?independence_wave_altai_mountain_guard_readiness|0]§! / [?constant:independence_wave_altai_pressure.maximum|0]\nRaise both values to [?constant:independence_wave_altai_pressure.stable|0] to stabilize the compact."
  independence_wave_altai_hold_mountain_council: "Hold the Altai Mountain Council Together"
  independence_wave_altai_hold_mountain_council_desc: "Within [?constant:independence_wave_altai_duration.founding_crisis|0] days, install a government, raise both compact values to [?constant:independence_wave_altai_pressure.stable|0], and keep Oyrot Region owned and controlled."
  independence_wave_altai_integrate_mountain_guards: "Integrate the Mountain Guards"
  independence_wave_altai_integrate_mountain_guards_desc: "Unify mounted detachments and local guards under a mountain staff while preserving the community guarantees that sustain them."
  independence_wave_altai_settle_former_host_ledgers: "Settle the Former Host Ledgers"
  independence_wave_altai_settle_former_host_ledgers_desc: "Close the property, border, population, and recognition claims inherited from the former administration. If talks fail, Altai will settle them locally."
  independence_wave_altai_ratify_constitutional_autonomy: "Ratify Constitutional Autonomy"
  independence_wave_altai_ratify_constitutional_autonomy_desc: "Give the provisional council a binding charter of self-government and protections for mountain communities."
  independence_wave_altai_adopt_traditional_compact: "Adopt the Traditional Compact"
  independence_wave_altai_adopt_traditional_compact_desc: "Entrust village delegates and cooperatives with food, remounts, recruitment, and local administration."
  independence_wave_altai_convene_socialist_councils: "Convene the Socialist Councils"
  independence_wave_altai_convene_socialist_councils_desc: "Place the workshops, transport routes, and municipal services under a common workers' council."
  independence_wave_altai_codify_durable_sovereignty: "Codify Durable Sovereignty"
  independence_wave_altai_codify_durable_sovereignty_desc: "A resolved founding crisis, stable ledgers, and a functioning government can turn liberation into a durable Altai state."
  independence_wave_altai_secure_oyrot_depots: "Secure the Oyrot Depots"
  independence_wave_altai_secure_oyrot_depots_desc: "Place the Oyrot stores, transport registers, and depot guards under a civil authority able to supply the compact."
  independence_wave_altai_register_communities: "Register the Altai Communities"
  independence_wave_altai_register_communities_desc: "Record the rights, obligations, and representation of every district, village, transport town, and recognized community."
  independence_wave_altai_establish_emergency_command: "Establish the Mountain Emergency Command"
  independence_wave_altai_establish_emergency_command_desc: "Put the mountain guards under one emergency staff and secure the passes before neighboring armies test the compact."
  independence_wave_altai_open_frontier_network: "Open the Altai Frontier Network"
  independence_wave_altai_open_frontier_network_desc: "After the founding settlement, exchange supplies, officers, and diplomatic access along the Altai frontier network with the other states that survived the wave."

  independence_wave_altai_depots_effect_tt: "Council Cohesion and Mountain Guard Readiness improve, while Legitimacy and State Capacity rise."
  independence_wave_altai_guards_effect_tt: "Mountain Guard Readiness improves sharply and the security administration gains Legitimacy and Security."
  independence_wave_altai_communities_effect_tt: "Council Cohesion improves sharply. Recognition and State Capacity rise, while Instability also increases."
  independence_wave_altai_host_ledgers_effect_tt: "Council Cohesion and Mountain Guard Readiness improve. Former-host property, border, population, and recognition ledgers are settled through negotiation."
  independence_wave_altai_host_loss_effect_tt: "The former-host ledger closes locally. Council Cohesion and Mountain Guard Readiness improve, and no bilateral host values change."
  independence_wave_altai_constitutional_route_effect_tt: "The Altai Civic Assembly takes office. Council Cohesion and Mountain Guard Readiness improve, together with Legitimacy and State Capacity."
  independence_wave_altai_traditional_route_effect_tt: "The Altai Land Compact takes office. Council Cohesion and Mountain Guard Readiness improve, together with Legitimacy and Recognition."
  independence_wave_altai_socialist_route_effect_tt: "The Altai Mountain Workers' Council takes office. Mountain Guard Readiness improves sharply while transport and workshop administration are reorganized."
  independence_wave_altai_emergency_route_effect_tt: "The Mountain Emergency Command takes office. Mountain Guard Readiness rises sharply, while Council Cohesion falls under emergency rule."
  independence_wave_altai_sovereignty_effect_tt: "Legitimacy, Recognition, and State Capacity rise, and the compact gains Security."
  independence_wave_altai_network_effect_tt: "Council Cohesion and Mountain Guard Readiness improve. Network Standing, League Cohesion, Common Cause, Shared Reserve, and Member Confidence rise."
  independence_wave_altai_project_failure_effect_tt: "Council Cohesion and Mountain Guard Readiness: §R[?constant:independence_wave_altai_pressure.standard_loss|0]§! each. Legitimacy, Recognition, State Capacity, and Security fall. Instability rises."

