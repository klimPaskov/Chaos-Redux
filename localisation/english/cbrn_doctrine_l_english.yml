l_english:
cbrn_operations_category: "CBRN Command and Doctrine"
cbrn_operations_category_desc: "Establish the national CBRN institution, prove cross-track readiness, set release policy, train protected formations, and commission doctrine-dependent technology."

cbrn_convene_institutional_review: "Convene CBRN Institutional Review"
cbrn_convene_institutional_review_desc: "Order the general staff to reconcile existing Chaos Warfare doctrine records with current Headquarters, protection, mastery, and release-policy requirements. The review does not invent reserves, formations, completed orders, or operational effects."
cbrn_convene_institutional_review_effect_tt: "Records verified native doctrine and mastery state, clears obsolete occupation-law authority, initializes the national CBRN administration, and begins the bounded establishment review. Cross-track institutions still require their exact proof."

cbrn_chaos_warfare_establishment_mission: "Establish Chaos Warfare"
cbrn_chaos_warfare_establishment_mission_desc: "Within §Y[?constant:cbrn_doctrine_timing.establishment_mission_days|.0] days§!, field an Operations Section and a protected regimental formation and retain §Y[?constant:cbrn_doctrine_establishment.mask_reserve|.0] gas masks§!, §Y[?constant:cbrn_doctrine_establishment.decontamination_reserve|.0] decontamination sets§!, and §Y[?constant:cbrn_doctrine_establishment.support_equipment_reserve|.0] support equipment§!. Failure closes offensive authority and reduces Chemical Readiness until the institution is remediated."
cbrn_chaos_warfare_establishment_success_tt: "The CBRN institution passes its establishment review. Offensive policy may be considered, Chemical Readiness rises to at least §Y[?constant:cbrn_doctrine_readiness.establishment_success_minimum|.0]§!, and decontamination capacity rises to at least §Y[?constant:cbrn_doctrine_capacity.establishment_decontamination_minimum|.0]§!."
cbrn_chaos_warfare_establishment_failure_tt: "The establishment review fails. Offensive authority is closed, use policy returns to §YDefensive Preparation§!, and Chemical Readiness is reduced to no more than §Y[?constant:cbrn_doctrine_readiness.establishment_failure_maximum|.0]§! until remediation succeeds."

cbrn_complete_delayed_establishment: "Complete Delayed Establishment"
cbrn_complete_delayed_establishment_desc: "Repeat the failed institutional review after assembling the required Headquarters, protected formation, and reserve stocks. Political Power and Command Power are committed when work begins and are not refunded if the required proof lapses."
cbrn_complete_delayed_establishment_requirements_tt: "Requires the full establishment stock, a fielded §YCBRN Operations Section§!, a fielded §YGas-Mask and Decontamination Detachment§!, and §Y[?constant:cbrn_doctrine_establishment.remediation_command_power_cost|.0] Command Power§!."
cbrn_complete_delayed_establishment_complete_tt: "Completes the Chaos Warfare establishment review and restores institutional authority."

cbrn_begin_hazard_assault_training: "Begin Hazard Assault Training"
cbrn_begin_hazard_assault_training_desc: "Run a §Y[?constant:cbrn_doctrine_timing.hazard_assault_training_days|.0]-day§! protected-field exercise for the Hazard Assault track. Training consumes real respirators and Army Experience before filtered daily mastery begins."
cbrn_begin_hazard_assault_training_requirements_tt: "Requires an active §YHazard Assault Formations§! track, a fielded protected regimental formation, §Y[?constant:cbrn_doctrine_training.hazard_assault_mask_cost|.0] gas masks§!, §Y[?constant:cbrn_doctrine_training.hazard_assault_army_xp_cost|.0] Army Experience§!, and no active Hazard Assault exercise."
cbrn_begin_hazard_assault_training_effect_tt: "Consumes §Y[?constant:cbrn_doctrine_training.hazard_assault_mask_cost|.0] gas masks§! and §Y[?constant:cbrn_doctrine_training.hazard_assault_army_xp_cost|.0] Army Experience§!, activates a §Y[?constant:cbrn_doctrine_timing.hazard_assault_training_days|.0]-day§! mission, and grants §Y[?constant:cbrn_doctrine_training.hazard_assault_daily_mastery|.2] Hazard Assault mastery per day§! for its duration."
cbrn_hazard_assault_training_mission: "Hazard Assault Exercise"
cbrn_hazard_assault_training_mission_desc: "Protected formations rehearse fit checks, contaminated-lane movement, casualty collection, and decontamination handoffs. The equipment and training cost has already been paid."
cbrn_hazard_assault_training_complete_tt: "The Hazard Assault exercise is complete."
cbrn_hazard_assault_training_mastery_source: "Hazard Assault Training"

cbrn_assign_decontamination_corridor: "Assign Decontamination Corridor"
cbrn_assign_decontamination_corridor_desc: "Direct one active Mobile Decontamination Column toward an exact controlled state for the current operational period. The assignment consumes command power, political power, decontamination equipment, masks, support equipment, motorized equipment, and fuel before cleanup begins."
cbrn_assign_decontamination_corridor_requirements_tt: "Requires §YTheater Exploitation§!, an active §YDecontamination Corridor§! Headquarters ability, the listed assignment stock and command costs, no other national state assignment during the current §Y[?constant:cbrn_doctrine_timing.theater_cleanup_assignment_days|.0]-day§! period, and chemical contamination in this controlled state."
cbrn_assign_decontamination_corridor_cost: "Assignment cost: §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.political_power]§! Political Power, §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.command_power]§! Command Power, §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.decontamination_equipment]§! Decontamination Equipment, §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.gas_masks]§! Gas Masks, §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.support_equipment]§! Support Equipment, §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.motorized_equipment]§! Motorized Equipment, and §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.fuel]§! Fuel."
cbrn_assign_decontamination_corridor_effect_tt: "Removes §Y[?constant:cbrn_doctrine_cleanup.trace_or_local_points|.0]§! contamination points from Trace or Local contamination, §Y[?constant:cbrn_doctrine_cleanup.serious_points|.0]§! from Serious, §Y[?constant:cbrn_doctrine_cleanup.severe_points|.0]§! from Severe, or §Y[?constant:cbrn_doctrine_cleanup.catastrophic_points|.0]§! from Catastrophic contamination. §YTheater Contamination Doctrine§! multiplies the exact removal by §G[?constant:cbrn_doctrine_spirit.theater_contamination.cleanup_output_mult|.2]§!. No evidence, attribution, death, medical-saturation, confirmed-use, or Condemnation record is erased."

cbrn_claim_protective_foundation: "Certify Protective Foundation"
cbrn_claim_protective_foundation_desc: "Prove that the doctrine rests on sustained mask production, national reserve depth, and a fielded theater command element."
cbrn_claim_protective_foundation_requirements_tt: "Requires a completed establishment review, gas-mask production after doctrine adoption, at least §Y[?constant:cbrn_doctrine_institution.protective_mask_reserve|.0] gas masks§! in reserve, and a fielded §YCBRN Operations Section§!."
cbrn_claim_protective_foundation_complete_tt: "Certifies §YProtective Foundation§!, raises the Chemical Readiness cap to §Y[?constant:cbrn_doctrine_readiness.protective_foundation_cap|.0]§!, sets minimum readiness to §Y[?constant:cbrn_doctrine_readiness.protective_foundation_minimum|.0]§! and decontamination capacity to §Y[?constant:cbrn_doctrine_capacity.protective_foundation_decontamination_minimum|.0]§!, and unlocks the Intelligence and Weather Cell."

cbrn_claim_delivery_integration: "Certify Delivery Integration"
cbrn_claim_delivery_integration_desc: "Link a mature delivery track, an operational payload reserve, and a proven protected Headquarters order into one accountable release chain."
cbrn_claim_delivery_integration_requirements_tt: "Requires §YProtective Foundation§!, Mastery 2 in Hazard Assault, Toxic Armored Warfare, or Contaminant Fire Support, at least §Y[?constant:cbrn_doctrine_institution.delivery_payload_reserve|.0] units§! of one eligible chemical payload, and one completed protective Headquarters order."
cbrn_claim_delivery_integration_complete_tt: "Certifies §YDelivery Integration§!, raises the Chemical Readiness cap to §Y[?constant:cbrn_doctrine_readiness.delivery_integration_cap|.0]§!, and sets minimum readiness to §Y[?constant:cbrn_doctrine_readiness.delivery_integration_minimum|.0]§!."

cbrn_claim_theater_exploitation: "Certify Theater Exploitation"
cbrn_claim_theater_exploitation_desc: "Demonstrate mature cross-track practice, a functioning intelligence cell, and enough decontamination capacity to sustain theater operations."
cbrn_claim_theater_exploitation_requirements_tt: "Requires §YDelivery Integration§!, Mastery 3 in any two Chaos Warfare tracks, at least §Y[?constant:cbrn_doctrine_institution.theater_decontamination_capacity|.0] Decontamination Capacity§!, and a fielded §YIntelligence and Weather Cell§!."
cbrn_claim_theater_exploitation_complete_tt: "Certifies §YTheater Exploitation§!, raises the Chemical Readiness cap to §Y[?constant:cbrn_doctrine_readiness.theater_exploitation_cap|.0]§!, and sets minimum readiness to §Y[?constant:cbrn_doctrine_readiness.theater_exploitation_minimum|.0]§!."

cbrn_claim_terminal_command: "Certify Terminal Command"
cbrn_claim_terminal_command_desc: "Complete the four-track institution, maintain advanced protection, and accept an explicit battlefield-or-higher release policy."
cbrn_claim_terminal_command_requirements_tt: "Requires §YTheater Exploitation§!, all four Chaos Warfare tracks active, Mastery 5 in at least one track, §YLimited Battlefield Authority§! or higher, and advanced protective capability."
cbrn_claim_terminal_command_complete_tt: "Certifies §YTerminal Command§!, raises the Chemical Readiness cap to §Y[?constant:cbrn_doctrine_readiness.terminal_command_cap|.0]§!, and sets minimum readiness to §Y[?constant:cbrn_doctrine_readiness.terminal_command_minimum|.0]§!."

cbrn_set_defensive_preparation_policy: "Adopt Defensive Preparation"
cbrn_set_defensive_preparation_policy_desc: "Restrict the CBRN institution to protection, detection, treatment, containment, and consequence response."
cbrn_set_defensive_preparation_policy_requirements_tt: "Requires Chaos Warfare and no policy change during the last §Y[?constant:cbrn_doctrine_timing.policy_reassessment_days|.0] days§!."
cbrn_set_defensive_preparation_policy_effect_tt: "Sets §YDefensive Preparation§! and begins a §Y[?constant:cbrn_doctrine_timing.policy_reassessment_days|.0]-day§! policy reassessment period."

cbrn_set_retaliation_authority_policy: "Authorize Retaliation"
cbrn_set_retaliation_authority_policy_desc: "Permit chemical or biological retaliation only against the exact confirmed first user during the active response window and retain a prohibition on discretionary first use."
cbrn_set_retaliation_authority_policy_requirements_tt: "Requires at least §Y[?constant:cbrn_doctrine_policy_readiness.retaliation_authority|.0] Chemical Readiness§!, §Y[?constant:cbrn_doctrine_policy_command_power_cost.retaliation_authority|.0] Command Power§!, and no policy change during the last §Y[?constant:cbrn_doctrine_timing.policy_reassessment_days|.0] days§!."
cbrn_set_retaliation_authority_policy_effect_tt: "Consumes §Y[?constant:cbrn_doctrine_policy_command_power_cost.retaliation_authority|.0] Command Power§!, sets §YRetaliation Authority§!, and begins a §Y[?constant:cbrn_doctrine_timing.policy_reassessment_days|.0]-day§! policy reassessment period. A response still requires a live §Y[?constant:cbrn_diplomacy_duration.retaliation_window_days|.0]-day§! bilateral record against the selected target."

cbrn_set_limited_battlefield_policy: "Authorize Limited Battlefield Use"
cbrn_set_limited_battlefield_policy_desc: "Permit prepared tactical release against eligible battlefield targets. Every use still requires payload debit, resolved protection and conditions, and the shared consequence pipeline."
cbrn_set_limited_battlefield_policy_requirements_tt: "Requires §YDelivery Integration§!, at least §Y[?constant:cbrn_doctrine_policy_readiness.limited_battlefield_authority|.0] Chemical Readiness§!, §Y[?constant:cbrn_doctrine_policy_command_power_cost.limited_battlefield_authority|.0] Command Power§!, at least §Y[?constant:cbrn_doctrine_policy_payload_reserve.limited_battlefield_authority|.0] units§! of one eligible payload, and no policy change during the last §Y[?constant:cbrn_doctrine_timing.policy_reassessment_days|.0] days§!."
cbrn_set_limited_battlefield_policy_effect_tt: "Consumes §Y[?constant:cbrn_doctrine_policy_command_power_cost.limited_battlefield_authority|.0] Command Power§!, sets §YLimited Battlefield Authority§!, and begins a §Y[?constant:cbrn_doctrine_timing.policy_reassessment_days|.0]-day§! policy reassessment period."

cbrn_set_strategic_release_policy: "Authorize Strategic Release"
cbrn_set_strategic_release_policy_desc: "Permit selected-state strategic chemical raids through verified raid execution hooks. This does not authorize passive or estimated air-region contamination."
cbrn_set_strategic_release_policy_requirements_tt: "Requires §YTheater Exploitation§!, at least §Y[?constant:cbrn_doctrine_policy_readiness.strategic_release_authority|.0] Chemical Readiness§!, §Y[?constant:cbrn_doctrine_policy_command_power_cost.strategic_release_authority|.0] Command Power§!, at least §Y[?constant:cbrn_doctrine_policy_payload_reserve.strategic_release_authority|.0] units§! of one eligible payload, and no policy change during the last §Y[?constant:cbrn_doctrine_timing.policy_reassessment_days|.0] days§!."
cbrn_set_strategic_release_policy_effect_tt: "Consumes §Y[?constant:cbrn_doctrine_policy_command_power_cost.strategic_release_authority|.0] Command Power§!, sets §YStrategic Release Authority§!, and begins a §Y[?constant:cbrn_doctrine_timing.policy_reassessment_days|.0]-day§! policy reassessment period."

cbrn_set_unrestricted_policy: "Authorize Unrestricted Chaos Warfare"
cbrn_set_unrestricted_policy_desc: "Permit the institution's most severe prepared operations. Public-harm floors, evidence, attribution, deaths, contamination, medical saturation, and confirmed-use history remain mandatory."
cbrn_set_unrestricted_policy_requirements_tt: "Requires §YTerminal Command§!, at least §Y[?constant:cbrn_doctrine_policy_readiness.unrestricted_chaos_warfare|.0] Chemical Readiness§!, §Y[?constant:cbrn_doctrine_policy_command_power_cost.unrestricted_chaos_warfare|.0] Command Power§!, at least §Y[?constant:cbrn_doctrine_policy_payload_reserve.unrestricted_chaos_warfare|.0] units§! of one eligible payload, and no policy change during the last §Y[?constant:cbrn_doctrine_timing.policy_reassessment_days|.0] days§!."
cbrn_set_unrestricted_policy_effect_tt: "Consumes §Y[?constant:cbrn_doctrine_policy_command_power_cost.unrestricted_chaos_warfare|.0] Command Power§!, sets §YUnrestricted Chaos Warfare§!, and begins a §Y[?constant:cbrn_doctrine_timing.policy_reassessment_days|.0]-day§! policy reassessment period."

cbrn_commission_sealed_tank_crews: "Commission Sealed Tank Crews"
cbrn_commission_sealed_tank_crews_desc: "Translate sealed-compartment doctrine into a field-ready crew technology."
cbrn_commission_sealed_tank_crews_requirements_tt: "Requires Toxic Armored Warfare Mastery 1, §YImproved Gas Masks§!, and §Y[?constant:cbrn_doctrine_technology_commission.command_power_cost|.0] Command Power§!."
cbrn_commission_sealed_tank_crews_complete_tt: "Grants §YSealed Tank Crews§!."

cbrn_commission_persistent_shell_filling: "Commission Persistent-Agent Shell Filling"
cbrn_commission_persistent_shell_filling_desc: "Establish protected filling and inspection standards for persistent chemical artillery ammunition."
cbrn_commission_persistent_shell_filling_requirements_tt: "Requires Contaminant Fire Support Mastery 4, §YChemical Artillery Shells§!, Mustard Gas or Lewisite, and §Y[?constant:cbrn_doctrine_technology_commission.command_power_cost|.0] Command Power§!."
cbrn_commission_persistent_shell_filling_complete_tt: "Grants §YPersistent-Agent Shell Filling§!."

cbrn_commission_nerve_suppression: "Commission Nerve Suppression Formation"
cbrn_commission_nerve_suppression_desc: "Create a narrowly authorized occupation formation whose use consumes equipment and produces deaths, contamination, resistance trauma, evidence, and severe diplomatic consequences."
cbrn_commission_nerve_suppression_requirements_tt: "Requires Toxic Armored Warfare Mastery 3, §YArmored Agent Delivery§!, a completed Sarin or Soman project, advanced protection, explicit §YCBRN Coercive Security§! occupation-policy authorization, and §Y[?constant:cbrn_doctrine_technology_commission.command_power_cost|.0] Command Power§!."
cbrn_commission_nerve_suppression_complete_tt: "Grants §YNerve-Agent Suppression Formation§!. Deployment remains separately costed and consequential."

cbrn_commission_biological_security_assault: "Commission Biological Security Assault Formation"
cbrn_commission_biological_security_assault_desc: "Organize protected containment troops for biological-security operations without merging them with weaponized-zombie formations."
cbrn_commission_biological_security_assault_requirements_tt: "Requires Integrated CBRN Command Mastery 4, §YField Epidemiology Teams§!, §YSealed Containment Laboratories§!, and §Y[?constant:cbrn_doctrine_technology_commission.command_power_cost|.0] Command Power§!."
cbrn_commission_biological_security_assault_complete_tt: "Grants §YBiological Security Assault Formation§!."
cbrn_technology_commission_commitment_tt: "Consumes §Y[?constant:cbrn_doctrine_technology_commission.command_power_cost|.0] Command Power§! when the §Y[?constant:cbrn_doctrine_timing.technology_commission_days|.0]-day§! commission begins. If its prerequisite disappears and the commission is cancelled, this commitment is not refunded."

cbrn_theater_contamination_doctrine_spirit: "Theater Contamination Doctrine"
cbrn_theater_contamination_doctrine_spirit_desc: "Theater staffs accept a larger supply burden to accelerate prepared release, coordinate denser delivery, sustain wider contamination, and drive assigned mobile columns through the aftermath."
cbrn_theater_contamination_doctrine_spirit_tt: "§YPrepared chemical delivery dose multiplier§!: §G[?constant:cbrn_doctrine_spirit.theater_contamination.delivery_dose_mult|.2]§!\n§YChemical contamination-points multiplier§!: §G[?constant:cbrn_doctrine_spirit.theater_contamination.contamination_points_mult|.2]§!\n§YChemical contamination-duration multiplier§!: §G[?constant:cbrn_doctrine_spirit.theater_contamination.contamination_duration_mult|.2]§!\n§YBiological seed-potency multiplier§!: §G[?constant:bio_lifecycle_doctrine.theater_contamination.seed_potency_mult|.2]§!\n§YBiological growth multiplier§!: §R[?constant:bio_lifecycle_doctrine.theater_contamination.growth_mult|.2]§!\n§YBiological spread multiplier§!: §R[?constant:bio_lifecycle_doctrine.theater_contamination.spread_mult|.2]§!\n§YBiological death multiplier§!: §R[?constant:bio_lifecycle_doctrine.theater_contamination.death_mult|.2]§!\n§YBiological duration multiplier§!: §R[?constant:bio_lifecycle_doctrine.theater_contamination.duration_mult|.2]§!\n§YBiological medical-pressure multiplier§!: §R[?constant:bio_lifecycle_doctrine.theater_contamination.medical_mult|.2]§!\n§YCommand Power refunded after a resolved strategic biological raid§!: §G[?constant:bio_strategic_raid_command.theater_refund_share|%0]§!\n§YOffensive CBRN Headquarters preparation time§!: §G[?constant:cbrn_doctrine_spirit.theater_contamination.offensive_preparation_time_mult|.2]§!\n§YAssigned Decontamination Corridor cleanup multiplier§!: §G[?constant:cbrn_doctrine_spirit.theater_contamination.cleanup_output_mult|.2]§!\n§YAttrition modifier§!: §G[?constant:cbrn_doctrine_spirit.theater_contamination.attrition|%0]§!\n§YSupply-consumption modifier§!: §R[?constant:cbrn_doctrine_spirit.theater_contamination.supply_consumption_factor|%0]§!"
cbrn_terminal_hazard_doctrine_spirit: "Terminal Hazard Doctrine"
cbrn_terminal_hazard_doctrine_spirit_desc: "The institution prioritizes maximum battlefield effect, accelerates prepared release, and organizes a disciplined political defense focused on Condemnation."
cbrn_terminal_hazard_doctrine_spirit_tt: "§YPrepared chemical operational-effect multiplier§!: §G[?constant:cbrn_doctrine_spirit.terminal_hazard.operational_effect_mult|.2]§!\n§YResulting military and civilian death multiplier§!: §R[?constant:cbrn_doctrine_spirit.terminal_hazard.casualty_mult|.2]§!\n§YChemical contamination-points multiplier§!: §G[?constant:cbrn_doctrine_spirit.terminal_hazard.contamination_points_mult|.2]§!\n§YChemical contamination-duration multiplier§!: §G[?constant:cbrn_doctrine_spirit.terminal_hazard.contamination_duration_mult|.2]§!\n§YMedical-saturation multiplier§!: §R[?constant:cbrn_doctrine_spirit.terminal_hazard.medical_saturation_mult|.2]§!\n§YBiological seed-potency multiplier§!: §G[?constant:bio_lifecycle_doctrine.terminal_hazard.seed_potency_mult|.2]§!\n§YBiological growth multiplier§!: §R[?constant:bio_lifecycle_doctrine.terminal_hazard.growth_mult|.2]§!\n§YBiological spread multiplier§!: §R[?constant:bio_lifecycle_doctrine.terminal_hazard.spread_mult|.2]§!\n§YBiological death multiplier§!: §R[?constant:bio_lifecycle_doctrine.terminal_hazard.death_mult|.2]§!\n§YBiological duration multiplier§!: §R[?constant:bio_lifecycle_doctrine.terminal_hazard.duration_mult|.2]§!\n§YBiological medical-pressure multiplier§!: §R[?constant:bio_lifecycle_doctrine.terminal_hazard.medical_mult|.2]§!\n§YCommand Power refunded after a resolved strategic biological raid§!: §G[?constant:bio_strategic_raid_command.terminal_refund_share|%0]§!\n§YOffensive CBRN Headquarters preparation time§!: §G[?constant:cbrn_doctrine_spirit.terminal_hazard.offensive_preparation_time_mult|.2]§!\n§YExisting camp-network death multiplier under Unrestricted Chaos Warfare§!: §R[?constant:cbrn_doctrine_spirit.terminal_hazard.camp_killing_efficiency_mult|.2]§!\n§YCondemnation-impact multiplier§!: §G[?constant:cbrn_doctrine_spirit.terminal_hazard.condemnation_mult|.2]§!\nOnly Condemnation impact is reduced. Payload debit, evidence, attribution, deaths and death history, contamination and contamination history, medical saturation and medical history, biological-use counters, confirmed-use history, domestic war-support penalties, accident records, resistance trauma, and public-harm floors remain unchanged. This doctrine does not create or unlock camp infrastructure."
cbrn_mask_discipline_spirit: "Mask Discipline"
cbrn_mask_discipline_spirit_desc: "Fit checks, filter accounting, and movement discipline preserve organisation and slow the exhaustion of issued protection."
cbrn_mask_discipline_spirit_tt: "§YMilitary mask and filter consumption§!: §G[?constant:cbrn_doctrine_spirit.mask_discipline.military_mask_consumption_mult|%0] of baseline§!"
cbrn_hazard_assault_cadres_spirit: "Hazard Assault Cadres"
cbrn_hazard_assault_cadres_spirit_desc: "Experienced protected cadres improve Hazard Pioneer and Chaos Assault Battalion performance without granting either formation a payload."
cbrn_hazard_assault_cadres_spirit_tt: "§YHazard Pioneer Detachment and Chaos Assault Battalion§!: §G[?constant:cbrn_doctrine_spirit.hazard_assault_cadres.unit_attack_factor|%0] Attack bonus§! and §G[?constant:cbrn_doctrine_spirit.hazard_assault_cadres.unit_defence_factor|%0] Defence bonus§!"
cbrn_controlled_retaliation_spirit_requirements_tt: "Requires §YProtective Foundation§!."
cbrn_theater_contamination_spirit_requirements_tt: "Requires §YTheater Exploitation§!."
cbrn_terminal_hazard_spirit_requirements_tt: "Requires §YTerminal Command§! and §YUnrestricted Chaos Warfare§! policy."
cbrn_mask_discipline_spirit_requirements_tt: "Requires Hazard Assault Formations Mastery 1."
cbrn_hazard_assault_cadres_spirit_requirements_tt: "Requires Hazard Assault Formations Mastery 3 and §YChaos Assault Battalion§! technology."
cbrn_contaminant_fire_coordination_spirit_requirements_tt: "Requires Contaminant Fire Support Mastery 2."

cbrn_operations_director: "CBRN Operations Director"
cbrn_operations_director_desc: "An institutional command office coordinating Headquarters preparation, forecasting, and release-chain accountability. No historical individual is implied."
cbrn_civil_defence_coordinator: "Civil Defence Coordinator"
cbrn_civil_defence_coordinator_desc: "An institutional office aligning military warning, mask distribution, sheltering, and public continuity. No historical individual is implied."
cbrn_chemical_logistics_inspector: "Chemical Logistics Inspector"
cbrn_chemical_logistics_inspector_desc: "An institutional inspection office for protected payload storage, transfer, and decontamination supply. No historical individual is implied."
cbrn_biological_security_director: "Biological Security Director"
cbrn_biological_security_director_desc: "An institutional security office overseeing containment, surveillance, and protected response. It remains distinct from weaponized-zombie command. No historical individual is implied."
cbrn_operations_director_requirements_tt: "Requires §YProtective Foundation§! and a fielded §YCBRN Operations Section§!."
cbrn_civil_defence_coordinator_requirements_tt: "Requires §YProtective Foundation§! and a fielded protected regimental formation."
cbrn_chemical_logistics_inspector_requirements_tt: "Requires §YDelivery Integration§! and Contaminant Fire Support Mastery 2."
cbrn_biological_security_director_requirements_tt: "Requires Integrated CBRN Command Mastery 4 and §YField Epidemiology Teams§!."
cbrn_operations_director_trait: "CBRN Operations Director"
cbrn_civil_defence_coordinator_trait: "Civil Defence Coordinator"
cbrn_chemical_logistics_inspector_trait: "Chemical Logistics Inspector"
cbrn_biological_security_director_trait: "Biological Security Director"

mobile_decontamination_columns: "Mobile Decontamination Columns"
mobile_decontamination_columns_desc: "Doctrine-qualified wash columns combine protected crews, decontamination equipment, trucks, fuel, route marking, and exact-state tasking. The technology unlocks the Army Headquarters Mobile Decontamination Column. Cleanup still requires a paid Headquarters ability and a selected contaminated state."
chemical_air_interdiction: "Chemical Air Interdiction"
chemical_air_interdiction_desc: "Air and ground staffs may plan an explicit chemical interdiction operation against a selected state. The technology grants no passive air-region effect: the later operation must verify execution, debit payload, resolve protection and conditions, and dispatch the shared exposure record. Idle chemical-capable aircraft never contaminate a region."
