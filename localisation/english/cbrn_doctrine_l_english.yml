l_english:
cbrn_operations_category: "CBRN Command and Doctrine"
cbrn_operations_category_desc: "Set national CBRN release policy and assign decontamination columns to contaminated states."

cbrn_assign_decontamination_corridor: "Assign Decontamination Corridor"
cbrn_assign_decontamination_corridor_desc: "Send one active Mobile Decontamination Column to a controlled, contaminated state for the current operational period. Pay the listed resources before cleanup begins."
cbrn_assign_decontamination_corridor_requirements_tt: "Requires §YTheater Exploitation§!, an active §YDecontamination Corridor§! Headquarters ability, contamination in this controlled state, the listed resources, and no other national assignment during the §Y[?constant:cbrn_doctrine_timing.theater_cleanup_assignment_days|.0]-day§! period."
cbrn_assign_decontamination_corridor_cost: "Assignment cost: §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.political_power]§! Political Power, §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.command_power]§! Command Power, §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.decontamination_equipment]§! Decontamination Equipment, §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.gas_masks]§! Gas Masks, §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.support_equipment]§! Support Equipment, §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.motorized_equipment]§! Motorized Equipment, and §Y[?constant:cbrn_doctrine_cleanup_assignment_cost.fuel]§! Fuel."
cbrn_assign_decontamination_corridor_effect_tt: "Removes §Y[?constant:cbrn_doctrine_cleanup.trace_or_local_points|.0]§! contamination points from Trace or Local contamination, §Y[?constant:cbrn_doctrine_cleanup.serious_points|.0]§! from Serious, §Y[?constant:cbrn_doctrine_cleanup.severe_points|.0]§! from Severe, or §Y[?constant:cbrn_doctrine_cleanup.catastrophic_points|.0]§! from Catastrophic contamination. §YTheater Contamination Doctrine§! multiplies the exact removal by §G[?constant:cbrn_doctrine_spirit.theater_contamination.cleanup_output_mult|.2]§!. No evidence, attribution, death, medical-saturation, confirmed-use, or Condemnation record is erased."

cbrn_theater_contamination_doctrine_spirit: "Theater Contamination Doctrine"
cbrn_theater_contamination_doctrine_spirit_desc: "Theater staffs deliver stronger chemical and biological releases and keep contaminated ground hazardous longer. Mobile columns clear affected states faster, but the army uses more supplies."
cbrn_theater_contamination_doctrine_spirit_tt: "§YChemical releases§! deliver §R[?constant:cbrn_doctrine_spirit.theater_contamination.delivery_dose_mult|%0]§! of normal dose and leave more contamination for longer.\n§YBiological outbreaks§! grow and spread faster, cause §R[?constant:bio_lifecycle_doctrine.theater_contamination.death_mult|%0]§! of normal deaths, last longer, and strain hospitals more.\n§YStrategic biological raids§! refund §G[?constant:bio_strategic_raid_command.theater_refund_share|%0]§! of Command Power after resolution.\n§YAssigned Decontamination Corridors§! clear §G[?constant:cbrn_doctrine_spirit.theater_contamination.cleanup_output_mult|%0]§! of normal contamination. Army attrition falls, but supply use rises."
cbrn_terminal_hazard_doctrine_spirit: "Terminal Hazard Doctrine"
cbrn_terminal_hazard_doctrine_spirit_desc: "Chemical and biological releases cause more deaths, longer hazards, and greater medical strain. Staffs limit Condemnation even as the attacks grow more destructive."
cbrn_terminal_hazard_doctrine_spirit_tt: "§YChemical releases§! cause §R[?constant:cbrn_doctrine_spirit.terminal_hazard.casualty_mult|%0]§! of normal military and civilian deaths, with stronger exposure, longer contamination, and more medical saturation.\n§YBiological outbreaks§! grow and spread faster, cause §R[?constant:bio_lifecycle_doctrine.terminal_hazard.death_mult|%0]§! of normal deaths, last longer, and strain hospitals more.\n§YStrategic biological raids§! refund §G[?constant:bio_strategic_raid_command.terminal_refund_share|%0]§! of Command Power after resolution.\n§YExisting camp networks under Unrestricted Authorization§! cause deaths at §R[?constant:cbrn_doctrine_spirit.terminal_hazard.camp_killing_efficiency_mult|%0]§! of the normal rate.\n§YCondemnation from attributed CBRN use§! falls to §G[?constant:cbrn_doctrine_spirit.terminal_hazard.condemnation_mult|%0]§! of normal despite the greater harm."
cbrn_mask_discipline_spirit: "Mask Discipline"
cbrn_mask_discipline_spirit_desc: "Fit checks, filter accounting, and movement discipline preserve organisation and slow the exhaustion of issued protection."
cbrn_mask_discipline_spirit_tt: "§YMilitary mask and filter consumption§!: §G[?constant:cbrn_doctrine_spirit.mask_discipline.military_mask_consumption_mult|%0] of baseline§!"
cbrn_hazard_assault_cadres_spirit: "Hazard Assault Cadres"
cbrn_hazard_assault_cadres_spirit_desc: "Protected cadres train Hazard Pioneer and Chaos Assault formations for fighting on contaminated ground."
cbrn_hazard_assault_cadres_spirit_tt: "§YHazard Pioneer Detachment and Chaos Assault Battalion§!: §G[?constant:cbrn_doctrine_spirit.hazard_assault_cadres.unit_attack_factor|%0] Attack bonus§! and §G[?constant:cbrn_doctrine_spirit.hazard_assault_cadres.unit_defence_factor|%0] Defence bonus§!"
cbrn_controlled_retaliation_spirit_requirements_tt: "Requires the §YChaos Warfare§! doctrine and §YProtective Foundation§!."
cbrn_theater_contamination_spirit_requirements_tt: "Requires §YTheater Exploitation§!."
cbrn_terminal_hazard_spirit_requirements_tt: "Requires §YTerminal CBRN Command§! and §YUnrestricted Authorization§! policy."
cbrn_mask_discipline_spirit_requirements_tt: "Requires Hazard Assault Formations Mastery 1."
cbrn_hazard_assault_cadres_spirit_requirements_tt: "Requires Hazard Assault Formations Mastery 3 and §YChaos Assault Battalion§! technology."
cbrn_contaminant_fire_coordination_spirit_requirements_tt: "Requires Contaminant Fire Support Mastery 2."

cbrn_civil_defence_coordinator: "Civil Defence Coordinator"
cbrn_civil_defence_coordinator_desc: "An institutional office aligning military warning, mask distribution, sheltering, and public continuity."
cbrn_chemical_logistics_inspector: "Chemical Logistics Inspector"
cbrn_chemical_logistics_inspector_desc: "An institutional inspection office for protected payload storage, transfer, and decontamination supply."
cbrn_biological_security_director: "Biological Security Director"
cbrn_biological_security_director_desc: "An institutional security office overseeing containment, surveillance, and protected response."
cbrn_civil_defence_coordinator_requirements_tt: "Requires §YProtective Foundation§! and a fielded protected regimental formation."
cbrn_chemical_logistics_inspector_requirements_tt: "Requires §YDelivery Integration§! and Contaminant Fire Support Mastery 2."
cbrn_biological_security_director_requirements_tt: "Requires Integrated CBRN Command Mastery 4 and §YField Epidemiology Teams§!."
cbrn_civil_defence_coordinator_trait: "Civil Defence Coordinator"
cbrn_chemical_logistics_inspector_trait: "Chemical Logistics Inspector"
cbrn_biological_security_director_trait: "Biological Security Director"

mobile_decontamination_columns: "Mobile Decontamination Columns"
mobile_decontamination_columns_desc: "Doctrine-qualified wash columns combine protected crews, decontamination equipment, trucks, fuel, route marking, and exact-state tasking. The technology unlocks the Army Headquarters Mobile Decontamination Column. Cleanup still requires a paid Headquarters ability and a selected contaminated state."
chemical_air_interdiction: "Chemical Air Interdiction"
chemical_air_interdiction_desc: "Air and ground staffs may plan an explicit chemical interdiction operation against a selected state. The technology grants no passive air-region effect: the later operation must verify execution, debit payload, resolve protection and conditions, and dispatch the shared exposure record. Idle chemical-capable aircraft never contaminate a region."
