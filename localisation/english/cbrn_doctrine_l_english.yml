l_english:
cbrn_operations_category: "CBRN Command and Doctrine"
cbrn_operations_category_desc: "Set national CBRN release policy and assign decontamination columns to contaminated states."

cbrn_assign_decontamination_corridor: "Deploy Decon Corridor"
cbrn_assign_decontamination_corridor_desc: "Send an active decontamination column into a controlled, contaminated state. One national assignment can operate during each service period."
cbrn_assign_decontamination_corridor_requirements_tt: "[GetCbrnDeconAssignmentRequirementsValue]"
cbrn_assign_decontamination_corridor_cost: "£command_power [This.GetCbrnCleanupCommandCost]  £GFX_decontamination_equipment_1_medium [This.GetCbrnCleanupEquipmentCost]  £GFX_fuel_texticon [This.GetCbrnCleanupFuelCost]"
cbrn_assign_decontamination_corridor_cost_blocked: "$cbrn_assign_decontamination_corridor_cost$"
cbrn_assign_decontamination_corridor_cost_tooltip: "Deploying the column spends the listed Command Power, decontamination equipment, and fuel."
cbrn_cleanup_command_cost_short: "§R[?cbrn_cleanup_command_cost_quote|0]§!"
cbrn_cleanup_command_cost_ready: "§Y[?cbrn_cleanup_command_cost_quote|0]§!"
cbrn_cleanup_equipment_cost_short: "§R[?cbrn_cleanup_equipment_cost_quote|0]§!"
cbrn_cleanup_equipment_cost_ready: "§Y[?cbrn_cleanup_equipment_cost_quote|0]§!"
cbrn_cleanup_fuel_cost_short: "§R[?cbrn_cleanup_fuel_cost_quote|0]§!"
cbrn_cleanup_fuel_cost_ready: "§Y[?cbrn_cleanup_fuel_cost_quote|0]§!"
cbrn_assign_decontamination_corridor_effect_tt: "[GetCbrnDeconAssignmentEffectValue]"

cbrn_theater_contamination_doctrine_spirit: "Theater Contamination Doctrine"
cbrn_theater_contamination_doctrine_spirit_desc: "Theater staffs deliver stronger chemical and biological releases and keep contaminated ground hazardous longer. Mobile columns clear affected states faster, but the army uses more supplies."
cbrn_theater_contamination_doctrine_spirit_tt: "[GetCbrnTheaterContaminationSpiritValue]"
cbrn_terminal_hazard_doctrine_spirit: "Terminal Hazard Doctrine"
cbrn_terminal_hazard_doctrine_spirit_desc: "Chemical and biological releases cause more deaths, longer hazards, and greater medical strain. Staffs limit Condemnation even as the attacks grow more destructive."
cbrn_terminal_hazard_doctrine_spirit_tt: "[GetCbrnTerminalHazardSpiritValue]"
cbrn_mask_discipline_spirit: "Mask Discipline"
cbrn_mask_discipline_spirit_desc: "Fit checks, filter accounting, and movement discipline preserve organisation and slow the exhaustion of issued protection."
cbrn_mask_discipline_spirit_tt: "[GetCbrnMaskDisciplineSpiritValue]"
cbrn_hazard_assault_cadres_spirit: "Hazard Assault Cadres"
cbrn_hazard_assault_cadres_spirit_desc: "Protected cadres train Protection Companies and Chaos Assault formations for fighting on contaminated ground."
cbrn_hazard_assault_cadres_spirit_tt: "[GetCbrnHazardAssaultCadresSpiritValue]"
cbrn_assign_decontamination_corridor_requirements_value: "Requires §YTheater Exploitation§!, an active §YDecontamination Corridor§! Headquarters ability, contamination in this controlled state, and no other national assignment during the §Y[?cbrn_loc_decon_assignment_days|0]-day§! service period. Keep §Y[?cbrn_loc_decon_required_masks|0]§! mask crates, §Y[?cbrn_loc_decon_required_support|0]§! support equipment, and §Y[?cbrn_loc_decon_required_trucks|0]§! trucks in stock to sustain the column; these stores are not spent by deployment."
cbrn_assign_decontamination_corridor_effect_value: "Clears §Y[?cbrn_loc_decon_trace_clearance|0]§! contamination points in Trace or Local states, §Y[?cbrn_loc_decon_serious_clearance|0]§! in Serious states, §Y[?cbrn_loc_decon_severe_clearance|0]§! in Severe states, and §Y[?cbrn_loc_decon_catastrophic_clearance|0]§! in Catastrophic states. §YTheater Contamination Doctrine§! raises clearance to §G[?cbrn_loc_decon_theater_mult|%0]§! of normal."
cbrn_theater_contamination_doctrine_spirit_value: "§YChemical releases§! deliver §R[?cbrn_loc_theater_delivery_dose|%0]§! of normal dose and leave more contamination for longer.\n§YBiological outbreaks§! grow and spread faster, cause §R[?cbrn_loc_theater_bio_death|%0]§! of normal deaths, last longer, and strain hospitals more.\n§YStrategic biological raids§! refund §G[?cbrn_loc_theater_raid_refund|%0]§! of Command Power after resolution.\n§YAssigned Decontamination Corridors§! clear §G[?cbrn_loc_theater_cleanup|%0]§! of normal contamination. Army attrition falls, but supply use rises."
cbrn_terminal_hazard_doctrine_spirit_value: "§YChemical releases§! cause §R[?cbrn_loc_terminal_chemical_death|%0]§! of normal military and civilian deaths, with stronger exposure, longer contamination, and more medical saturation.\n§YBiological outbreaks§! grow and spread faster, cause §R[?cbrn_loc_terminal_bio_death|%0]§! of normal deaths, last longer, and strain hospitals more.\n§YStrategic biological raids§! refund §G[?cbrn_loc_terminal_raid_refund|%0]§! of Command Power after resolution.\n§YExisting camp networks under Unrestricted Authorization§! cause deaths at §R[?cbrn_loc_terminal_camp_death|%0]§! of the normal rate.\n§YCondemnation from attributed CBRN use§! falls to §G[?cbrn_loc_terminal_condemnation|%0]§! of normal despite the greater harm."
cbrn_mask_discipline_spirit_value: "§YMilitary mask and filter consumption§!: §G[?cbrn_loc_mask_consumption|%0] of baseline§!"
cbrn_hazard_assault_cadres_spirit_value: "§YProtection Company and Chaos Assault Battalion§!: §G[?cbrn_loc_hazard_attack|%0] Attack bonus§! and §G[?cbrn_loc_hazard_defence|%0] Defence bonus§!"
cbrn_controlled_retaliation_spirit_requirements_tt: "Requires the §YChaos Warfare§! doctrine and §YProtective Foundation§!."
cbrn_theater_contamination_spirit_requirements_tt: "Requires §YTheater Exploitation§!."
cbrn_terminal_hazard_spirit_requirements_tt: "Requires §YTerminal CBRN Command§! and §YUnrestricted Authorization§! policy."
cbrn_mask_discipline_spirit_requirements_tt: "Requires Hazard Assault Formations Mastery 1."
cbrn_hazard_assault_cadres_spirit_requirements_tt: "Requires Hazard Assault Formations Mastery 3 and §YChaos Assault Battalion§! technology."
cbrn_contaminant_fire_coordination_spirit_requirements_tt: "Requires Contaminant Fire Support Mastery 2."

cbrn_civil_defence_coordinator: "Civil Defence Coordinator"
cbrn_civil_defence_coordinator_desc: "An institutional office aligning military warning, mask distribution, sheltering, and public continuity."
cbrn_chemical_logistics_inspector: "Chemical Logistics Inspector"
cbrn_chemical_logistics_inspector_desc: "An institutional inspection office for protected payload storage, transfer, and decontamination supply."
cbrn_biological_security_director: "Biological Security Director"
cbrn_biological_security_director_desc: "An institutional security office overseeing containment, surveillance, and protected response."
cbrn_civil_defence_coordinator_requirements_tt: "Requires §YProtective Foundation§! and a fielded protected regimental formation."
cbrn_chemical_logistics_inspector_requirements_tt: "Requires §YDelivery Integration§! and Contaminant Fire Support Mastery 2."
cbrn_biological_security_director_requirements_tt: "Requires Integrated CBRN Command Mastery 4 and §YField Epidemiology Teams§!."
cbrn_civil_defence_coordinator_trait: "Civil Defence Coordinator"
cbrn_chemical_logistics_inspector_trait: "Chemical Logistics Inspector"
cbrn_biological_security_director_trait: "Biological Security Director"

mobile_decontamination_columns: "Mobile Decontamination Columns"
mobile_decontamination_columns_desc: "Doctrine-qualified wash columns combine protected crews, decontamination equipment, trucks, fuel, route marking, and exact-state tasking. The technology unlocks the Army Headquarters Mobile Decontamination Column. Cleanup still requires a paid Headquarters ability and a selected contaminated state."
chemical_air_interdiction: "Chemical Air Interdiction"
chemical_air_interdiction_desc: "Air and ground staffs may plan an explicit chemical interdiction operation against a selected state. The technology grants no passive air-region effect: the later operation must verify execution, debit payload, resolve protection and conditions, and dispatch the shared exposure record. Idle chemical-capable aircraft never contaminate a region."
