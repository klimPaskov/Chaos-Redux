chaosx.fallout.289.t: "The School in the Vent Room"
chaosx.fallout.289.d: "The first children born after the shelters sealed their doors now ask what the world was before the ash. A retired teacher has cleared a room beside the ventilation stack, but every lesson will spend food, power, paper, or medicine. [ROOT.GetAirWinterGovernmentAuthority] must decide whether the room teaches a trade, preserves old history, builds civic habits, or keeps a faith classroom alive."
chaosx.fallout.289.a: "Teach the machines and the grid"
chaosx.fallout.289.b: "Teach the history we still carry"
chaosx.fallout.289.c: "Teach the duties of a citizen"
chaosx.fallout.289.d_option: "Let the elders keep a faith classroom"
chaosx.fallout.289.a.tt: "Spend [?constant:fallout_event_289_cost.technical_food|0] Food, [?constant:fallout_event_289_cost.technical_power|0] Power, and [?constant:fallout_event_289_cost.technical_scrap|0] Scrap. The delayed result measures shelter, food, Cohesion, and the education ledger."
chaosx.fallout.289.b.tt: "Spend [?constant:fallout_event_289_cost.history_food|0] Food, [?constant:fallout_event_289_cost.history_scrap|0] Scrap, and [?constant:fallout_event_289_cost.history_recognition|0] Recognition. The archive class can strengthen memory while exposing old claims."
chaosx.fallout.289.c.tt: "Spend [?constant:fallout_event_289_cost.civic_food|0] Food, [?constant:fallout_event_289_cost.civic_medicine|0] Medicine, and [?constant:fallout_event_289_cost.civic_recognition|0] Recognition. The civic class can bind a new cohort to shared duties."
chaosx.fallout.289.d_option.tt: "Spend [?constant:fallout_event_289_cost.faith_food|0] Food, [?constant:fallout_event_289_cost.faith_medicine|0] Medicine, and [?constant:fallout_event_289_cost.faith_recognition|0] Recognition. The faith classroom can keep a family calendar beside the shelter ledger."

chaosx.fallout.291.t: "Lessons Beside the Vent"
chaosx.fallout.291.technical.success.d: "The teacher turned broken meters, hand tools, and a salvaged circuit board into a practical course. Children now know why the grid fails, how to read a pressure gauge, and which questions to ask before opening a sealed panel."
chaosx.fallout.291.technical.partial.d: "The technical class kept the vent room busy, but power and scrap arrived unevenly. The children can copy a wiring diagram, while the older crews still hold the dangerous repairs close."
chaosx.fallout.291.technical.failure.d: "The class tried to teach the grid before the room had a safe lamp. A damaged panel and a frightened parent turned the lesson into a warning about who may touch the country's machines."
chaosx.fallout.291.history.success.d: "The archive class placed the old maps beside the new shelter register. Children learned the names that survived the fire and the names that must not be used to reopen an old border."
chaosx.fallout.291.history.partial.d: "The history class saved several stories, but recognition tickets could not cover every witness. The children learned a careful version of the old world and began asking whose memory was missing."
chaosx.fallout.291.history.failure.d: "The archive class became a contest over which old government deserved to be remembered. The room kept the papers, yet the children left with a sharper quarrel than the one they entered."
chaosx.fallout.291.civic.success.d: "The civic class wrote duties on the vent-room wall. Children now carry water rosters, clinic notices, and repair requests between shelters, giving a new cohort a place in public work."
chaosx.fallout.291.civic.partial.d: "The civic class reached the central shelter and two outer rooms. It taught a useful roster, but medicine and recognition could not make every household feel represented."
chaosx.fallout.291.civic.failure.d: "The civic lesson promised equal duties before the food line was equal. Parents pulled children from the room, and the country learned that a roster can become another ration dispute."
chaosx.fallout.291.faith.success.d: "The elders made the vent room a classroom without closing it to other families. A shared calendar, a quiet rite, and a promise to teach the living gave the new cohort a language for carrying grief."
chaosx.fallout.291.faith.partial.d: "The faith classroom kept its calendar and its witnesses, but medicine limited the hours. Children learned the rite beside a shorter list of families who could attend."
chaosx.fallout.291.faith.failure.d: "The classroom became a boundary between families before it became a shelter for them. The rite survived, while the vent room lost the trust needed for a common lesson."
chaosx.fallout.291.a: "Open the cohort ledger"
chaosx.fallout.291.a.tt: "Apply the selected curriculum result, write one Event Log memory, and schedule the cohort callback after [?constant:fallout_event_289_timing.callback_delay_days|0] days. Failure uses the Deaths contract."

chaosx.fallout.293.t: "The First Cohort Answers"
chaosx.fallout.293.success.d: "The children returned with questions the shelter can answer. The vent room has a teacher, a schedule, and a place in the country's work. The first cohort will not inherit only the silence of the sealed doors."
chaosx.fallout.293.partial.d: "The cohort returned to a room that still teaches, although the outer shelters cannot attend every week. The education ledger is real, but its reach remains a privilege that the country must repair."
chaosx.fallout.293.failure.d: "The callback found the vent room without a stable teacher or supply route. The children remember the lessons, yet the shelter has lost another shared institution to scarcity and suspicion."
chaosx.fallout.293.a: "Close the first cohort record"
chaosx.fallout.293.a.tt: "Apply the cohort callback, record durable curriculum memory, and release both delayed Fallout receipts. Failure uses the callback Deaths contract."

fallout.event_log.school_vent_room.name: "The School in the Vent Room"
fallout.event_log.school_vent_room.detail: "[GetFalloutEvent289EventLogDetail]"
fallout.event_log.school_vent_room.detail.technical_success: "A practical grid class gave the first cohort a place in repair work and a language for safe machines."
fallout.event_log.school_vent_room.detail.technical_partial: "The grid class survived on uneven power and scrap, leaving the children with diagrams but few safe repairs."
fallout.event_log.school_vent_room.detail.technical_failure: "A rushed grid class became a warning about unsafe panels and the cost of teaching before the lamp was secure."
fallout.event_log.school_vent_room.detail.history_success: "An archive class placed old maps beside the shelter register and taught the next cohort which memories must not become claims."
fallout.event_log.school_vent_room.detail.history_partial: "The archive class saved stories while recognition limits left several families outside the witness list."
fallout.event_log.school_vent_room.detail.history_failure: "The archive class became a quarrel over which old government deserved to be remembered."
fallout.event_log.school_vent_room.detail.civic_success: "A civic class turned water rosters, clinic notices, and repair requests into a new cohort's public work."
fallout.event_log.school_vent_room.detail.civic_partial: "The civic class reached several shelters but could not make every household feel represented."
fallout.event_log.school_vent_room.detail.civic_failure: "The civic class became another ration dispute when equal duties arrived before equal food."
fallout.event_log.school_vent_room.detail.faith_success: "A shared faith calendar gave the new cohort a language for grief without closing the room to other families."
fallout.event_log.school_vent_room.detail.faith_partial: "The faith classroom kept its calendar while medicine limited the families who could attend."
fallout.event_log.school_vent_room.detail.faith_failure: "The faith classroom became a boundary before it became a shelter for a common lesson."
fallout.event_log.school_vent_room.detail.callback_success: "The first cohort returned to a staffed vent room with a durable place in the country's work."
fallout.event_log.school_vent_room.detail.callback_partial: "The cohort kept a real school in the central shelter while outer attendance remained uneven."
fallout.event_log.school_vent_room.detail.callback_failure: "The cohort callback found the vent room without a stable teacher or supply route."

fallout_school_vent_room_technical: "Vent Room Technical Class"
fallout_school_vent_room_technical_desc: "A practical grid course gives the first cohort tools for safe repair and power work."
fallout_school_vent_room_history: "Vent Room Archive Class"
fallout_school_vent_room_history_desc: "An archive course preserves old maps and teaches the next cohort how memory differs from a claim."
fallout_school_vent_room_civic: "Vent Room Civic Roster"
fallout_school_vent_room_civic_desc: "A civic course turns shelter notices and repair rosters into a shared public habit."
fallout_school_vent_room_faith: "Vent Room Faith Classroom"
fallout_school_vent_room_faith_desc: "A shared rite keeps a family calendar and a language for grief beside the shelter ledger."
fallout_school_vent_room_maintained: "Maintained Cohort School"
fallout_school_vent_room_maintained_desc: "A maintained school gives the first cohort a staffed room and a durable place in public work."
fallout_school_vent_room_failed: "Cohort School Strain"
fallout_school_vent_room_failed_desc: "A strained school leaves children, teachers, and shelter supplies exposed to another institutional failure."
