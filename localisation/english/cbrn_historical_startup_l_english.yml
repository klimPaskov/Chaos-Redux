l_english:
# Dedicated localisation for the historical scientist roster and bookmark
# profiles. Existing character name and description keys remain in
# chaosx_characters_l_english.yml so portrait and advisor consumers keep their
# established keys without duplicate definitions.
cbrn_historical_scientist_roster_title: "Historical CBRN scientists"
cbrn_historical_scientist_roster_desc: "Established historical scientists begin with the scenario, while later wartime identities join on their documented dates. Expertise and trade traits remain separate from dated offensive appointments."

cbrn_startup_history_1936_title: "1936 CBRN readiness profiles"
cbrn_startup_history_1936_major_military_desc: "Established major military programmes begin with a 75% issue target and a 25% replacement reserve."
cbrn_startup_history_1936_italy_active_war_desc: "Italy's active war in Ethiopia supports a 100% military issue target and an operational chemical logistics reserve."
cbrn_startup_history_1936_japan_limited_desc: "Japan begins with a limited 50% military protection profile while its historical biological programme remains reachable through doctrine and policy."
cbrn_startup_history_1936_smaller_defensive_desc: "Smaller defensive programmes begin with a 25% military issue target and can expand through research, imports, and industry."
cbrn_startup_history_1936_reserve_desc: "Every 1936 profile keeps a 25% replacement reserve distinct from issued protection."

cbrn_startup_history_1939_uk_title: "British 1939 civilian respirator issue"
cbrn_startup_history_1939_uk_desc: "Britain's 1939 setup records the mass civilian respirator issue reported to Parliament and gives the protection system a historical distribution profile."
cbrn_startup_history_1939_uk_industry_desc: "Civilian respirator production and local fitting are treated as an established 1939 civil-defence programme."

cbrn_historical_advisor_fildes_date_desc: "Paul Fildes' biological programme appointment opens with the wartime Porton Down department."
cbrn_historical_advisor_schrader_date_desc: "Gerhard Schrader's chemical appointment opens after his late-1936 tabun discovery; no January 1936 nerve stockpile is implied."
cbrn_historical_advisor_blome_date_desc: "Kurt Blome's biological programme-director appointment opens with the later wartime programme."
cbrn_historical_advisor_kitano_date_desc: "Masaji Kitano's Unit 731 command appointment opens in the 1942-45 period."
cbrn_historical_advisor_witaszek_date_desc: "Franciszek Witaszek's clandestine CBW appointment opens after the German occupation of Poland."
cbrn_historical_advisor_mairanovsky_date_desc: "Grigory Mairanovsky's secret-police toxicology appointment opens in the later 1930s."
cbrn_historical_advisor_olson_date_desc: "Frank Olson's Camp Detrick appointment opens after the wartime laboratory is established."
cbrn_historical_advisor_baldwin_date_desc: "Ira Baldwin's biological programme appointment opens after his late-1942 Chemical Warfare Service assignment."
