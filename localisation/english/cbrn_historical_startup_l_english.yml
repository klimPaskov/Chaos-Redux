l_english:
# Dedicated localisation for the historical scientist roster and bookmark
# profiles. Existing character name and description keys remain in
# chaosx_characters_l_english.yml so portrait and advisor consumers keep their
# established keys without duplicate definitions.
cbrn_historical_scientist_roster_title: "Historical CBRN scientists"
cbrn_historical_scientist_roster_desc: "Established scientists start with the scenario, and later wartime scientists join on their documented dates. Expertise and trade traits are separate from dated offensive appointments."

cbrn_startup_history_1936_title: "1936 CBRN readiness profiles"
cbrn_startup_history_1936_major_military_desc: "Established major military programs begin with a 75% issue target and a 25% replacement reserve."
cbrn_startup_history_1936_italy_active_war_desc: "Italy's active war in Ethiopia supports a 100% military issue target and an operational chemical logistics reserve."
cbrn_startup_history_1936_japan_limited_desc: "Japan begins with a limited 50% military protection profile. Its historical biological program can develop through doctrine and policy."
cbrn_startup_history_1936_smaller_defensive_desc: "Smaller defensive programs begin with a 25% military issue target and can expand through research, imports, and industry."
cbrn_startup_history_1936_reserve_desc: "Every 1936 profile holds a 25% replacement reserve separate from issued protection."

cbrn_startup_history_1939_uk_title: "British 1939 civilian respirator issue"
cbrn_startup_history_1939_uk_desc: "Britain has issued respirators on a mass scale to its civilian population, as reported to Parliament."
cbrn_startup_history_1939_uk_industry_desc: "Civilian respirator production and local fitting are an established 1939 civil-defense program."

cbrn_historical_advisor_fildes_date_desc: "Paul Fildes' biological program appointment opens with the wartime Porton Down department."
cbrn_historical_advisor_schrader_date_desc: "Gerhard Schrader's chemical appointment opens after his late-1936 tabun discovery, so no nerve stockpile exists in January 1936."
cbrn_historical_advisor_blome_date_desc: "Kurt Blome's biological program director appointment opens with the later wartime program."
cbrn_historical_advisor_kitano_date_desc: "Masaji Kitano's Unit 731 command appointment opens in the 1942-45 period."
cbrn_historical_advisor_witaszek_date_desc: "Franciszek Witaszek's clandestine CBW appointment opens after the German occupation of Poland."
cbrn_historical_advisor_mairanovsky_date_desc: "Grigory Mairanovsky's secret-police toxicology appointment opens in the later 1930s."
cbrn_historical_advisor_olson_date_desc: "Frank Olson's Camp Detrick appointment opens after the wartime laboratory is established."
cbrn_historical_advisor_baldwin_date_desc: "Ira Baldwin's biological program appointment opens after his late-1942 Chemical Warfare Service assignment."
