l_english:
mengele_event016_singularity_costs_tt: "Have the displayed direct payments and the £civ_factory reservation available."
mengele_event016_singularity_stage_started_tt: "The direct payments shown for this stage are spent at the start. The shown £civ_factory amount remains reserved until the stage ends."
mengele_event016_singularity_stage_cancelled_tt: "The unfinished stage is cancelled. Its recorded direct payments are refunded and the £civ_factory reservation is released."
mengele_event016_singularity_cancel_trigger_tt: "The programme has lost its authority, the Strategic Singularity has fired, or the stage order is no longer valid. During Deployment and Weaponization, losing the required facilities also cancels the stage."

mengele_event016_singularity_theory: "Develop Singularity Theory"
mengele_event016_singularity_theory_desc: "Establish the theoretical basis for Mengele's Strategic Singularity programme."
mengele_event016_singularity_theory_effect_tt: "Completes Singularity Theory. The Prototype is then built from six component special projects, or through the paid Prototype stage where those projects cannot be run."
mengele_event016_singularity_theory_requirements_tt: "Mengele's registered programme must be active, with no Singularity stage already underway or completed. This is the first project stage."
mengele_event016_singularity_theory_cost: "§Y[?constant:brilliant_scientist_project_stage_cost.singularity_theory_political_power|0]§! £pol_power  §Y[?constant:brilliant_scientist_project_stage_cost.singularity_theory_support_equipment|0]§! £support_equipment_text_icon"
mengele_event016_singularity_theory_cost_blocked: "§R[?constant:brilliant_scientist_project_stage_cost.singularity_theory_political_power|0] £pol_power§!  §R[?constant:brilliant_scientist_project_stage_cost.singularity_theory_support_equipment|0] £support_equipment_text_icon§!"
mengele_event016_singularity_theory_cost_tooltip: "Spends [?constant:brilliant_scientist_project_stage_cost.singularity_theory_political_power|0] £pol_power and [?constant:brilliant_scientist_project_stage_cost.singularity_theory_support_equipment|0] £support_equipment_text_icon. Reserves [?constant:brilliant_scientist_project_stage_cost.singularity_theory_civilian_factories|0] £civ_factory for [?constant:brilliant_scientist_project_duration.singularity_theory|0] days."

mengele_event016_singularity_prototype: "Build the Singularity Prototype"
mengele_event016_singularity_prototype_desc: "Advance the Strategic Singularity project from theory to a working prototype."
mengele_event016_singularity_prototype_effect_tt: "Completes Singularity Prototype and unlocks Deployment."
mengele_event016_singularity_prototype_requirements_tt: "Complete Singularity Theory. No other Singularity stage may be underway. This paid Prototype stage is used only where the six component special projects cannot be run."
mengele_event016_singularity_prototype_cost: "§Y[?constant:brilliant_scientist_project_fallback_prototype.singularity_political_power|0]§! £pol_power  §Y[?constant:brilliant_scientist_project_fallback_prototype.singularity_support_equipment|0]§! £support_equipment_text_icon  §Y[?constant:brilliant_scientist_project_fallback_prototype.singularity_fuel|0]§! £GFX_fuel_texticon"
mengele_event016_singularity_prototype_cost_blocked: "§R[?constant:brilliant_scientist_project_fallback_prototype.singularity_political_power|0] £pol_power§!  §R[?constant:brilliant_scientist_project_fallback_prototype.singularity_support_equipment|0] £support_equipment_text_icon§!  §R[?constant:brilliant_scientist_project_fallback_prototype.singularity_fuel|0] £GFX_fuel_texticon§!"
mengele_event016_singularity_prototype_cost_tooltip: "Spends [?constant:brilliant_scientist_project_fallback_prototype.singularity_political_power|0] £pol_power, [?constant:brilliant_scientist_project_fallback_prototype.singularity_support_equipment|0] £support_equipment_text_icon and [?constant:brilliant_scientist_project_fallback_prototype.singularity_fuel|0] £GFX_fuel_texticon. Reserves [?constant:brilliant_scientist_project_fallback_prototype.singularity_civilian_factories|0] £civ_factory for [?constant:brilliant_scientist_project_duration.singularity_prototype|0] days."

mengele_event016_singularity_deployment: "Deploy the Singularity Network"
mengele_event016_singularity_deployment_desc: "Put the Strategic Singularity programme into operational deployment."
mengele_event016_singularity_deployment_effect_tt: "Completes Singularity Deployment and unlocks Weaponization."
mengele_event016_singularity_deployment_requirements_tt: "Complete Singularity Prototype. Mengele's registered programme must remain active, and you must own and control at least [?constant:brilliant_scientist_singularity.minimum_facilities|0] qualifying facilities throughout the work."
mengele_event016_singularity_deployment_cost: "§Y[?constant:brilliant_scientist_project_stage_cost.singularity_deployment_political_power|0]§! £pol_power  §Y[?constant:brilliant_scientist_project_stage_cost.singularity_deployment_support_equipment|0]§! £support_equipment_text_icon  §Y[?constant:brilliant_scientist_project_stage_cost.singularity_deployment_fuel|0]§! £GFX_fuel_texticon"
mengele_event016_singularity_deployment_cost_blocked: "§R[?constant:brilliant_scientist_project_stage_cost.singularity_deployment_political_power|0] £pol_power§!  §R[?constant:brilliant_scientist_project_stage_cost.singularity_deployment_support_equipment|0] £support_equipment_text_icon§!  §R[?constant:brilliant_scientist_project_stage_cost.singularity_deployment_fuel|0] £GFX_fuel_texticon§!"
mengele_event016_singularity_deployment_cost_tooltip: "Spends [?constant:brilliant_scientist_project_stage_cost.singularity_deployment_political_power|0] £pol_power, [?constant:brilliant_scientist_project_stage_cost.singularity_deployment_support_equipment|0] £support_equipment_text_icon and [?constant:brilliant_scientist_project_stage_cost.singularity_deployment_fuel|0] £GFX_fuel_texticon. Reserves [?constant:brilliant_scientist_project_stage_cost.singularity_deployment_civilian_factories|0] £civ_factory for [?constant:brilliant_scientist_project_duration.singularity_deployment|0] days."

mengele_event016_singularity_weaponization: "Authorize Singularity Weaponization"
mengele_event016_singularity_weaponization_desc: "Authorize the final Strategic Singularity project stage."
mengele_event016_singularity_weaponization_effect_tt: "Completes the final project stage. Arming still requires the live facility and terminal checks."
mengele_event016_singularity_weaponization_requirements_tt: "Complete Singularity Deployment. Mengele's registered programme must remain active, and you must own and control at least [?constant:brilliant_scientist_singularity.minimum_facilities|0] qualifying facilities throughout the work."
mengele_event016_singularity_weaponization_cost: "§Y[?constant:brilliant_scientist_project_stage_cost.singularity_weaponization_political_power|0]§! £pol_power  §Y[?constant:brilliant_scientist_project_stage_cost.singularity_weaponization_support_equipment|0]§! £support_equipment_text_icon  §Y[?constant:brilliant_scientist_project_stage_cost.singularity_weaponization_fuel|0]§! £GFX_fuel_texticon"
mengele_event016_singularity_weaponization_cost_blocked: "§R[?constant:brilliant_scientist_project_stage_cost.singularity_weaponization_political_power|0] £pol_power§!  §R[?constant:brilliant_scientist_project_stage_cost.singularity_weaponization_support_equipment|0] £support_equipment_text_icon§!  §R[?constant:brilliant_scientist_project_stage_cost.singularity_weaponization_fuel|0] £GFX_fuel_texticon§!"
mengele_event016_singularity_weaponization_cost_tooltip: "Spends [?constant:brilliant_scientist_project_stage_cost.singularity_weaponization_political_power|0] £pol_power, [?constant:brilliant_scientist_project_stage_cost.singularity_weaponization_support_equipment|0] £support_equipment_text_icon and [?constant:brilliant_scientist_project_stage_cost.singularity_weaponization_fuel|0] £GFX_fuel_texticon. Reserves [?constant:brilliant_scientist_project_stage_cost.singularity_weaponization_civilian_factories|0] £civ_factory for [?constant:brilliant_scientist_project_duration.singularity_weaponization|0] days."
