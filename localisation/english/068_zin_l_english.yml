l_english:
chaosx.nr68.1.t: "Alien colony"

chaosx.nr68.2.t: "An alien colony?"
chaosx.nr68.2.d: "A medieval alien colony has appeared on our soil, and our people have little idea what the settlers want or can do. A military assault could bring heavy losses, while diplomatic contact may reveal a way to coexist."
chaosx.nr68.2.a: "The risk is too high."
chaosx.nr68.2.b: "Obliterate them, leaving only ashes"

chaosx.nr68.3.t: "The reckless wrath"
chaosx.nr68.3.d: "Our attack on the alien ZIN has brought their gods into the war. They are striking our territory until we yield, and we must choose between surrendering land or fighting toward their capital."
chaosx.nr68.3.a: "It was a mistake"
chaosx.nr68.3.b: "Who are they!?"

chaosx.news.60.t: "An alien colony?"
chaosx.news.60.d: "A mysterious alien colony known as ZIN has settled within the borders of [FROM.GetName]. The society appears to follow a medieval order, and officials are seeking a way to communicate with its settlers."
chaosx.news.60.a: "Mysterious"
