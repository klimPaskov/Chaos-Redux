l_english:
chaosx.nr22.1.t: "Massacre of the Jews"

chaosx.nr22.2.t: "Spain offers to murder all Jews"
chaosx.nr22.2.d: ""
chaosx.nr22.2.a: "Reject the proposal."

chaosx.nr22.3.t: "Spain wants to murder Jews across the world"
chaosx.nr22.3.d: ""
chaosx.nr22.3.a: "Invite them to our faction!"
chaosx.nr22.3.b: "Reject the proposal."

chaosx.nr22.4.t: "1391"
chaosx.nr22.4.d: "We must restore our former glory and proclaim racial superiority over the Jews we have marked as less than human."
chaosx.nr22.4.a: "Let the massacre begin!"
chaosx.nr22.4.b: "Stand aside"

chaosx.news.22.t: "Spain declares war on Jews"
chaosx.news.22.d: "A wave of anti-Jewish riots has erupted in several Spanish cities and towns, leaving thousands of Jews dead, injured, or forcibly converted to Christianity. The violence began in Seville in June and spread through Castile, Aragon, Valencia, and Catalonia amid religious fanaticism, social unrest, and economic grievances.\n\nSpain is extending the killing into other countries and expects help from governments that share its hatred."
chaosx.news.22.a: "The old hatred has returned."
