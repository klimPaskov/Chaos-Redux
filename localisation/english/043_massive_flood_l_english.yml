chaosx.nr43.1.t: "Massive Flood"

chaosx.nr43.2.t: "Massive Flood!"
chaosx.nr43.2.d: "Massive flooding has covered our coastline. Coastal communities are underwater, roads and ports are damaged, and emergency crews are moving survivors to higher ground."
chaosx.nr43.2.a: "Move to higher ground."
