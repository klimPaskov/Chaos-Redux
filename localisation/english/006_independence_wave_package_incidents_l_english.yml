l_english:
# Event 006 package incidents
chaosx.nr6.101.t: "The Clyde Shipyard Accounts"
chaosx.nr6.101.d: "The Clyde yards still hold hulls ordered by the Admiralty in London. Workers want their wages, London wants its ships, and every yard manager is waiting to see whose orders the new government will honour."
chaosx.nr6.101.a: "Honour the Admiralty contracts"
chaosx.nr6.101.a.tt: "Shipping Authority §G+[?constant:independence_wave_scotland_wales_pressure.minor_gain|0]§!. Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!. Hostility with the former host falls."
chaosx.nr6.101.b: "Requisition the yards for Scotland"
chaosx.nr6.101.b.tt: "Shipping Authority §G+[?constant:independence_wave_scotland_wales_pressure.standard_gain|0]§!. Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, Security §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!. Hostility with the former host rises."
chaosx.nr6.102.t: "Raids on the Highland Estates"
chaosx.nr6.102.d: "Crofters in the north have occupied deer forests and sporting estates, invoking the land leagues of the last century. The owners demand that Edinburgh restore their property."
chaosx.nr6.102.a: "Pass a Crofters' Charter"
chaosx.nr6.102.a.tt: "Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.102.b: "Restore order on the estates"
chaosx.nr6.102.b.tt: "Shipping Authority §G+[?constant:independence_wave_scotland_wales_pressure.minor_gain|0]§!. Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Security §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.103.t: "Coal for Whom?"
chaosx.nr6.103.d: "Cardiff's shippers ask whether Welsh coal still sails under London's export contracts. Northern councils want the same coal kept for a railway that finally joins Wales north to south."
chaosx.nr6.103.a: "Keep the export contracts"
chaosx.nr6.103.a.tt: "North-South Integration §G+[?constant:independence_wave_scotland_wales_pressure.minor_gain|0]§!. Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!. Hostility with the former host falls."
chaosx.nr6.103.b: "Reserve coal for the Welsh railways"
chaosx.nr6.103.b.tt: "North-South Integration §G+[?constant:independence_wave_scotland_wales_pressure.standard_gain|0]§!. Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.104.t: "The Language of the Courts"
chaosx.nr6.104.d: "Magistrates in Gwynedd now refuse to hear cases in English alone, while councils in Glamorgan object that their clerks cannot work in Welsh."
chaosx.nr6.104.a: "Bilingual courts in every county"
chaosx.nr6.104.a.tt: "North-South Integration §R[?constant:independence_wave_scotland_wales_pressure.minor_loss|0]§!, Bilingual Service §G+[?constant:independence_wave_scotland_wales_pressure.standard_gain|0]§!. Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.104.b: "Let each county decide"
chaosx.nr6.104.b.tt: "North-South Integration §G+[?constant:independence_wave_scotland_wales_pressure.minor_gain|0]§!, Bilingual Service §R[?constant:independence_wave_scotland_wales_pressure.minor_loss|0]§!. Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.105.t: "The Fleet at Brest"
chaosx.nr6.105.d: "The Breton fishing fleet will not sail while French naval officers still hold the harbour offices at Brest. The officers say they answer only to Paris."
chaosx.nr6.105.a: "Hand the harbour to Breton crews"
chaosx.nr6.105.a.tt: "Coastal Command §G+[?constant:independence_wave_brittany_pressure.standard_gain|0]§!. Recognition §R[?constant:independence_wave_value.minor_loss|0]§!. Hostility with the former host rises."
chaosx.nr6.105.b: "Share Brest with the French officers"
chaosx.nr6.105.b.tt: "Coastal Command §R[?constant:independence_wave_brittany_pressure.minor_loss|0]§!. Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Recognition §G+[?constant:independence_wave_value.standard_gain|0]§!. Hostility with the former host falls."
chaosx.nr6.106.t: "Breton in the Schools"
chaosx.nr6.106.d: "Teachers trained in French resist the new Breton curriculum, and parents in the towns fear their children will lose French altogether."
chaosx.nr6.106.a: "Fund Breton teacher colleges"
chaosx.nr6.106.a.tt: "Language Compact §G+[?constant:independence_wave_brittany_pressure.standard_gain|0]§!. State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.106.b: "Teach both languages"
chaosx.nr6.106.b.tt: "Language Compact §G+[?constant:independence_wave_brittany_pressure.minor_gain|0]§!. Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.107.t: "The Barcelona Collectives"
chaosx.nr6.107.d: "Workers' committees run many of Barcelona's factories, and the owners have petitioned the Generalitat to have them returned."
chaosx.nr6.107.a: "Recognize the workers' committees"
chaosx.nr6.107.a.tt: "Industrial Cohesion §G+[?constant:independence_wave_catalonia_pressure.minor_gain|0]§!, Assembly Legitimacy §G+[?constant:independence_wave_catalonia_pressure.minor_gain|0]§!. Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.107.b: "Return the factories to their owners"
chaosx.nr6.107.b.tt: "Industrial Cohesion §R[?constant:independence_wave_catalonia_pressure.minor_loss|0]§!. Recognition §G+[?constant:independence_wave_value.standard_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.108.t: "The Ebro Water Board"
chaosx.nr6.108.d: "Lleida's farmers and Barcelona's hydroelectric companies both claim the waters of the Ebro canals, and the Parliament must choose who comes first."
chaosx.nr6.108.a: "Favour the irrigators"
chaosx.nr6.108.a.tt: "Industrial Cohesion §R[?constant:independence_wave_catalonia_pressure.minor_loss|0]§!, Assembly Legitimacy §G+[?constant:independence_wave_catalonia_pressure.standard_gain|0]§!."
chaosx.nr6.108.b: "Favour the power stations"
chaosx.nr6.108.b.tt: "Industrial Cohesion §G+[?constant:independence_wave_catalonia_pressure.standard_gain|0]§!, Assembly Legitimacy §R[?constant:independence_wave_catalonia_pressure.minor_loss|0]§!. State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.109.t: "The University of Cluj"
chaosx.nr6.109.d: "Romanian and Hungarian professors both claim the university at Cluj, and students of each language have barricaded their own lecture halls."
chaosx.nr6.109.a: "Divide it into two faculties"
chaosx.nr6.109.a.tt: "Federal Legitimacy §G+[?constant:independence_wave_transylvania_pressure.standard_gain|0]§!. Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.109.b: "One university under the state"
chaosx.nr6.109.b.tt: "Frontier Cohesion §G+[?constant:independence_wave_transylvania_pressure.minor_gain|0]§!, Federal Legitimacy §R[?constant:independence_wave_transylvania_pressure.minor_loss|0]§!. State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.110.t: "The Saxon Town Charters"
chaosx.nr6.110.d: "The Saxon councils of Sibiu and Brasov ask for their old town privileges back, citing charters older than any state that has ruled them."
chaosx.nr6.110.a: "Restore limited town charters"
chaosx.nr6.110.a.tt: "Frontier Cohesion §R[?constant:independence_wave_transylvania_pressure.minor_loss|0]§!, Federal Legitimacy §G+[?constant:independence_wave_transylvania_pressure.minor_gain|0]§!. Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.110.b: "One law for every town"
chaosx.nr6.110.b.tt: "Frontier Cohesion §G+[?constant:independence_wave_transylvania_pressure.standard_gain|0]§!, Federal Legitimacy §R[?constant:independence_wave_transylvania_pressure.minor_loss|0]§!. Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.111.t: "The Bands in the Hills"
chaosx.nr6.111.d: "Armed bands that fought under the old revolutionary organization offer to defend the new state, but only under their own commanders."
chaosx.nr6.111.a: "Enlist the bands"
chaosx.nr6.111.a.tt: "Mountain Defence §G+[?constant:independence_wave_macedonia_pressure.standard_gain|0]§!. Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.111.b: "Disarm them"
chaosx.nr6.111.b.tt: "Civic Mandate §G+[?constant:independence_wave_macedonia_pressure.standard_gain|0]§!, Mountain Defence §R[?constant:independence_wave_macedonia_pressure.minor_loss|0]§!. Security §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.112.t: "The Tobacco Harvest"
chaosx.nr6.112.d: "The Vardar tobacco crop has no buyer since the old state monopoly collapsed, and the growers are close to ruin."
chaosx.nr6.112.a: "Buy the harvest for the state"
chaosx.nr6.112.a.tt: "Civic Mandate §G+[?constant:independence_wave_macedonia_pressure.standard_gain|0]§!. State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.112.b: "Sell it to foreign merchants"
chaosx.nr6.112.b.tt: "Civic Mandate §R[?constant:independence_wave_macedonia_pressure.minor_loss|0]§!. Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.113.t: "The Endowment Lands"
chaosx.nr6.113.d: "Sarajevo's religious endowments demand back the lands the old government seized, while the treasury counts on their rents."
chaosx.nr6.113.a: "Return the endowment lands"
chaosx.nr6.113.a.tt: "Civic Mandate §G+[?constant:independence_wave_bosnia_pressure.standard_gain|0]§!. Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.113.b: "Keep them for the treasury"
chaosx.nr6.113.b.tt: "Civic Mandate §R[?constant:independence_wave_bosnia_pressure.minor_loss|0]§!. State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.114.t: "The Drina Ferries"
chaosx.nr6.114.d: "Smugglers and refugees cross the Drina at night, and the ferrymen answer to no one but whoever pays them."
chaosx.nr6.114.a: "Garrison the crossings"
chaosx.nr6.114.a.tt: "Mountain Defence §G+[?constant:independence_wave_bosnia_pressure.standard_gain|0]§!. Security §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.114.b: "License the ferrymen"
chaosx.nr6.114.b.tt: "Civic Mandate §G+[?constant:independence_wave_bosnia_pressure.minor_gain|0]§!. State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!, Security §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.115.t: "Timber for Leningrad"
chaosx.nr6.115.d: "The sawmills of Petrozavodsk hold timber contracted to the Leningrad trusts. The trusts want delivery, and the mill towns want winter wages."
chaosx.nr6.115.a: "Deliver the timber"
chaosx.nr6.115.a.tt: "Forest Supply §R[?constant:independence_wave_karelia_crimea_pressure.minor_loss|0]§!. Recognition §G+[?constant:independence_wave_value.standard_gain|0]§!. Hostility with the former host falls."
chaosx.nr6.115.b: "Keep the timber in Karelia"
chaosx.nr6.115.b.tt: "Forest Supply §G+[?constant:independence_wave_karelia_crimea_pressure.standard_gain|0]§!. Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!. Hostility with the former host rises."
chaosx.nr6.116.t: "Volunteers from Finland"
chaosx.nr6.116.d: "Volunteers from across the Finnish border offer to guard the border villages through the winter."
chaosx.nr6.116.a: "Accept the volunteers"
chaosx.nr6.116.a.tt: "Civic Mandate §R[?constant:independence_wave_karelia_crimea_pressure.minor_loss|0]§!. Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, Security §G+[?constant:independence_wave_value.standard_gain|0]§!. Hostility with the former host rises."
chaosx.nr6.116.b: "Raise a Karelian militia instead"
chaosx.nr6.116.b.tt: "Civic Mandate §G+[?constant:independence_wave_karelia_crimea_pressure.minor_gain|0]§!. Security §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.117.t: "Returning Families at Simferopol"
chaosx.nr6.117.d: "Crimean Tatar families are coming home from exile and asking for the lands their villages once held. Many of those fields are now worked by other tenants."
chaosx.nr6.117.a: "Open the return registers"
chaosx.nr6.117.a.tt: "Return Capacity §G+[?constant:independence_wave_karelia_crimea_pressure.standard_gain|0]§!, Land Settlement §R[?constant:independence_wave_karelia_crimea_pressure.minor_loss|0]§!. Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.117.b: "Settle the current tenants first"
chaosx.nr6.117.b.tt: "Return Capacity §R[?constant:independence_wave_karelia_crimea_pressure.minor_loss|0]§!, Land Settlement §G+[?constant:independence_wave_karelia_crimea_pressure.standard_gain|0]§!. Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.118.t: "The Sevastopol Dockyards"
chaosx.nr6.118.d: "The naval yards at Sevastopol stand idle while the fleet's former crews wait for pay that no one has promised."
chaosx.nr6.118.a: "Pay the crews from the treasury"
chaosx.nr6.118.a.tt: "Security §G+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.118.b: "Lease the docks to merchants"
chaosx.nr6.118.b.tt: "Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!, Security §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.119.t: "The Language of the State"
chaosx.nr6.119.d: "Rusyn, Ukrainian and Hungarian activists all claim the new state speaks their language, and the first government circulars have been printed in none of them."
chaosx.nr6.119.a: "Three official languages"
chaosx.nr6.119.a.tt: "Civic Concord §G+[?constant:independence_wave_ruthenia_pressure.standard_gain|0]§!. State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.119.b: "Ukrainian as the state language"
chaosx.nr6.119.b.tt: "Civic Concord §R[?constant:independence_wave_ruthenia_pressure.minor_loss|0]§!. Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.120.t: "The Carpathian Sich"
chaosx.nr6.120.d: "The Carpathian Sich drills in the villages, armed and loyal to its own commanders rather than to the government."
chaosx.nr6.120.a: "Absorb the Sich into the army"
chaosx.nr6.120.a.tt: "Civic Concord §R[?constant:independence_wave_ruthenia_pressure.minor_loss|0]§!, Mountain Security §G+[?constant:independence_wave_ruthenia_pressure.standard_gain|0]§!."
chaosx.nr6.120.b: "Disband the Sich"
chaosx.nr6.120.b.tt: "Civic Concord §G+[?constant:independence_wave_ruthenia_pressure.standard_gain|0]§!. Security §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.121.t: "Stanitsa Allotments"
chaosx.nr6.121.d: "Cossack stanitsas and newcomer peasant families claim the same fields, and both bring old surveys to prove it."
chaosx.nr6.121.a: "Equal allotments for newcomers"
chaosx.nr6.121.a.tt: "Civic Concord §G+[?constant:independence_wave_kuban_pressure.standard_gain|0]§!, Mounted Readiness §R[?constant:independence_wave_kuban_pressure.minor_loss|0]§!."
chaosx.nr6.121.b: "Keep the Cossack land rights"
chaosx.nr6.121.b.tt: "Civic Concord §R[?constant:independence_wave_kuban_pressure.minor_loss|0]§!, Mounted Readiness §G+[?constant:independence_wave_kuban_pressure.standard_gain|0]§!. Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.122.t: "The Grain Arrears"
chaosx.nr6.122.d: "The Krasnodar elevators still hold grain requisitioned by the old state. The villages want it back; the treasury wants to sell it."
chaosx.nr6.122.a: "Return the grain to the villages"
chaosx.nr6.122.a.tt: "Civic Concord §G+[?constant:independence_wave_kuban_pressure.standard_gain|0]§!. State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.122.b: "Sell it through Novorossiysk"
chaosx.nr6.122.b.tt: "Civic Concord §R[?constant:independence_wave_kuban_pressure.minor_loss|0]§!. Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.123.t: "The Kazan Madrasas"
chaosx.nr6.123.d: "Kazan's madrasas ask to reopen the schools closed in the last decade, and the teachers who ran them are still in the city."
chaosx.nr6.123.a: "Reopen the madrasas"
chaosx.nr6.123.a.tt: "Civic Concord §G+[?constant:independence_wave_tatarstan_pressure.standard_gain|0]§!. Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Recognition §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.123.b: "State schools only"
chaosx.nr6.123.b.tt: "Civic Concord §R[?constant:independence_wave_tatarstan_pressure.minor_loss|0]§!. Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.124.t: "The Volga Barge Strike"
chaosx.nr6.124.d: "The Volga bargemen have stopped work over unpaid wages, and grain and fuel are piling up on the Kazan wharves."
chaosx.nr6.124.a: "Raise the bargemen's pay"
chaosx.nr6.124.a.tt: "Civic Concord §G+[?constant:independence_wave_tatarstan_pressure.minor_gain|0]§!, River Security §G+[?constant:independence_wave_tatarstan_pressure.minor_gain|0]§!."
chaosx.nr6.124.b: "Put the river under martial law"
chaosx.nr6.124.b.tt: "Civic Concord §R[?constant:independence_wave_tatarstan_pressure.standard_loss|0]§!, River Security §G+[?constant:independence_wave_tatarstan_pressure.standard_gain|0]§!. Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.125.t: "The Ishimbay Oil Wells"
chaosx.nr6.125.d: "The new Ishimbay oilfield is run by engineers sent from Moscow, who say they will stay only on their old contracts."
chaosx.nr6.125.a: "Keep the engineers on contract"
chaosx.nr6.125.a.tt: "Congress Cohesion §R[?constant:independence_wave_bashkiria_pressure.minor_loss|0]§!. Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!. Hostility with the former host falls."
chaosx.nr6.125.b: "Nationalize the wells"
chaosx.nr6.125.b.tt: "Congress Cohesion §G+[?constant:independence_wave_bashkiria_pressure.standard_gain|0]§!. State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!. Hostility with the former host rises."
chaosx.nr6.126.t: "The Kurultai Elections"
chaosx.nr6.126.d: "The Kurultai demands elections before any new taxes are raised, and the frontier command wants the taxes first."
chaosx.nr6.126.a: "Call the elections"
chaosx.nr6.126.a.tt: "Congress Cohesion §G+[?constant:independence_wave_bashkiria_pressure.standard_gain|0]§!. Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.126.b: "Taxes first, elections later"
chaosx.nr6.126.b.tt: "Congress Cohesion §R[?constant:independence_wave_bashkiria_pressure.minor_loss|0]§!, Frontier Readiness §G+[?constant:independence_wave_bashkiria_pressure.minor_gain|0]§!. State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.127.t: "The Refugee Quarters"
chaosx.nr6.127.d: "Refugees from the deportations still live in tents at the edge of Yerevan, and the city council wants them housed before winter."
chaosx.nr6.127.a: "Build permanent quarters"
chaosx.nr6.127.a.tt: "Mountain Supply §R[?constant:independence_wave_transcaucasus_value.action_minor_loss|0]§!, Civic Legitimacy §G+[?constant:independence_wave_transcaucasus_value.action_major_gain|0]§!."
chaosx.nr6.127.b: "Settle them in the border villages"
chaosx.nr6.127.b.tt: "Mountain Supply §G+[?constant:independence_wave_transcaucasus_value.action_minor_gain|0]§!, Civic Legitimacy §R[?constant:independence_wave_transcaucasus_value.action_minor_loss|0]§!. Security §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.128.t: "The Party Committees"
chaosx.nr6.128.d: "The old party committees ask for commands in the new army, offering their veterans in return."
chaosx.nr6.128.a: "Give them commands"
chaosx.nr6.128.a.tt: "Mountain Supply §G+[?constant:independence_wave_transcaucasus_value.action_minor_gain|0]§!. Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Security §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.128.b: "Keep parties out of the army"
chaosx.nr6.128.b.tt: "Civic Legitimacy §G+[?constant:independence_wave_transcaucasus_value.action_minor_gain|0]§!. Security §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.129.t: "The Batumi Port Dues"
chaosx.nr6.129.d: "Turkish and Soviet shippers dispute the dues charged at Batumi, and each threatens to take its cargoes elsewhere."
chaosx.nr6.129.a: "Lower the dues"
chaosx.nr6.129.a.tt: "Corridor Access §G+[?constant:independence_wave_transcaucasus_value.action_standard_gain|0]§!. Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.129.b: "Keep the dues for the treasury"
chaosx.nr6.129.b.tt: "Corridor Access §R[?constant:independence_wave_transcaucasus_value.action_minor_loss|0]§!. State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.130.t: "The Autonomy Statutes"
chaosx.nr6.130.d: "Abkhaz and Ossetian councils ask for autonomy statutes before they will send delegates to Tbilisi."
chaosx.nr6.130.a: "Grant the autonomy statutes"
chaosx.nr6.130.a.tt: "Federal Mediation §G+[?constant:independence_wave_transcaucasus_value.action_standard_gain|0]§!. Security §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.130.b: "One undivided republic"
chaosx.nr6.130.b.tt: "Federal Mediation §R[?constant:independence_wave_transcaucasus_value.action_minor_loss|0]§!. Security §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.131.t: "The Baku Oil Workers"
chaosx.nr6.131.d: "The Baku oil workers' unions demand a share of the export revenue before they will work the night shifts."
chaosx.nr6.131.a: "Share the revenue"
chaosx.nr6.131.a.tt: "Oil Security §G+[?constant:independence_wave_transcaucasus_value.action_minor_gain|0]§!. State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.131.b: "Break the strike"
chaosx.nr6.131.b.tt: "Oil Security §G+[?constant:independence_wave_transcaucasus_value.action_standard_gain|0]§!. Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.132.t: "Foreign Oil Concessions"
chaosx.nr6.132.d: "British and French firms bid for drilling concessions on the Absheron peninsula, offering money the treasury badly needs."
chaosx.nr6.132.a: "Grant the concessions"
chaosx.nr6.132.a.tt: "Oil Security §R[?constant:independence_wave_transcaucasus_value.action_minor_loss|0]§!, Export Legitimacy §G+[?constant:independence_wave_transcaucasus_value.action_standard_gain|0]§!. Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.132.b: "Keep the fields national"
chaosx.nr6.132.b.tt: "Oil Security §G+[?constant:independence_wave_transcaucasus_value.action_minor_gain|0]§!, Export Legitimacy §R[?constant:independence_wave_transcaucasus_value.action_minor_loss|0]§!. Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.133.t: "The Plantation Strike"
chaosx.nr6.133.d: "Sugar workers at Hilo have walked out, and the planters ask the new government to send the territorial guard."
chaosx.nr6.133.a: "Recognize the unions"
chaosx.nr6.133.a.tt: "Shipping Security §R[?constant:independence_wave_pacific_pressure.minor_loss|0]§!. Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.133.b: "Back the planters"
chaosx.nr6.133.b.tt: "Shipping Security §G+[?constant:independence_wave_pacific_pressure.standard_gain|0]§!. Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.134.t: "The Pearl Harbor Yards"
chaosx.nr6.134.d: "The naval yards at Pearl Harbor stand half empty, and foreign shipping lines have asked to lease the berths."
chaosx.nr6.134.a: "Lease the berths"
chaosx.nr6.134.a.tt: "Shipping Security §G+[?constant:independence_wave_pacific_pressure.minor_gain|0]§!. Recognition §G+[?constant:independence_wave_value.standard_gain|0]§!, Security §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.134.b: "Keep the yards for the island guard"
chaosx.nr6.134.b.tt: "Shipping Security §G+[?constant:independence_wave_pacific_pressure.minor_gain|0]§!. Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, Security §G+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.135.t: "The Central Valley Water"
chaosx.nr6.135.d: "Central Valley farmers and the coastal cities both claim the new water projects, and the shipyards need power as much as the orchards need water."
chaosx.nr6.135.a: "Water for the farms"
chaosx.nr6.135.a.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.135.b: "Water for the cities and shipyards"
chaosx.nr6.135.b.tt: "Coastal Command §G+[?constant:independence_wave_pacific_pressure.standard_gain|0]§!. State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.136.t: "The Studios Abroad"
chaosx.nr6.136.d: "The film studios keep their head offices and bank accounts in the East, beyond the reach of California's new treasury."
chaosx.nr6.136.a: "Court the studios"
chaosx.nr6.136.a.tt: "Recognition §G+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.136.b: "Tax the studios"
chaosx.nr6.136.b.tt: "Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.137.t: "The Bilbao Foundries"
chaosx.nr6.137.d: "The Bilbao foundries want orders that only Madrid has ever placed, and their owners hint that they will follow the orders."
chaosx.nr6.137.a: "Accept Madrid's orders"
chaosx.nr6.137.a.tt: "Fueros Legitimacy §R[?constant:independence_wave_iberian_pressure.minor_loss|0]§!, Industrial Capacity §G+[?constant:independence_wave_iberian_pressure.standard_gain|0]§!. Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!. Hostility with the former host falls."
chaosx.nr6.137.b: "Seek buyers abroad"
chaosx.nr6.137.b.tt: "Fueros Legitimacy §G+[?constant:independence_wave_iberian_pressure.minor_gain|0]§!, Industrial Capacity §G+[?constant:independence_wave_iberian_pressure.minor_gain|0]§!. State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.138.t: "The Provincial Treasuries"
chaosx.nr6.138.d: "The old fiscal pact let each province collect its own taxes. Gipuzkoa and Bizkaia want it back; the government wants one treasury."
chaosx.nr6.138.a: "Restore the provincial treasuries"
chaosx.nr6.138.a.tt: "Fueros Legitimacy §G+[?constant:independence_wave_iberian_pressure.standard_gain|0]§!. State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.138.b: "One Basque treasury"
chaosx.nr6.138.b.tt: "Fueros Legitimacy §R[?constant:independence_wave_iberian_pressure.minor_loss|0]§!. State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.139.t: "The Vigo Canneries"
chaosx.nr6.139.d: "The canneries of Vigo have fish but no tinplate, and only foreign suppliers can sell it to them."
chaosx.nr6.139.a: "Buy tinplate abroad"
chaosx.nr6.139.a.tt: "Port Capacity §G+[?constant:independence_wave_iberian_pressure.standard_gain|0]§!."
chaosx.nr6.139.b: "Ration the canneries"
chaosx.nr6.139.b.tt: "Port Capacity §R[?constant:independence_wave_iberian_pressure.minor_loss|0]§!. State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.140.t: "The Foros Rents"
chaosx.nr6.140.d: "Galician peasants refuse to pay the old foros rents to absentee landlords, some of whom live in Madrid."
chaosx.nr6.140.a: "Abolish the foros"
chaosx.nr6.140.a.tt: "Council Legitimacy §G+[?constant:independence_wave_iberian_pressure.standard_gain|0]§!. Recognition §R[?constant:independence_wave_value.minor_loss|0]§!. Hostility with the former host rises."
chaosx.nr6.140.b: "Buy out the landlords"
chaosx.nr6.140.b.tt: "Council Legitimacy §G+[?constant:independence_wave_iberian_pressure.minor_gain|0]§!. State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.141.t: "The Novocherkassk Regalia"
chaosx.nr6.141.d: "Old officers have brought the regalia of the Don Host out of hiding and want the elected charter replaced by an ataman."
chaosx.nr6.141.a: "Restore the ataman's office"
chaosx.nr6.141.a.tt: "Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.141.b: "Keep the elected charter"
chaosx.nr6.141.b.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Security §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.142.t: "The Millerovo Railwaymen"
chaosx.nr6.142.d: "Railway workers at Millerovo demand protection from reprisals by the former host's agents before they keep the trains running."
chaosx.nr6.142.a: "Station guards at the yards"
chaosx.nr6.142.a.tt: "Security §G+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.142.b: "Negotiate safe passage"
chaosx.nr6.142.b.tt: "Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, Security §R[?constant:independence_wave_value.minor_loss|0]§!. Hostility with the former host falls."

independence_wave_incident_reply_pending_tt: "The government still awaits its reply to this question."
