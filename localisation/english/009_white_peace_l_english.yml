l_english:
chaosx.nr9.1.t: "White Peace"
chaosx.nr9.2.t: "A Note Without Demands"
chaosx.nr9.2.d: "A neutral channel has delivered the same paper to both governments. It names no victor, no indemnity, and no border to be redrawn. [white_peace_primary.GetName] and [white_peace_partner.GetName] are ordered to stop where they stand."
chaosx.nr9.3.t: "Tables in Several Rooms"
chaosx.nr9.3.d: "One settlement becomes a habit. Delegates move from railway rooms to municipal halls, copying the same dry language from one file to the next until several small wars close without victory parades."
chaosx.nr9.4.t: "A Major Power Steps Back"
chaosx.nr9.4.d: "A larger flag appears at the table and nobody cheers. The signatures are stiff, the cameras are kept outside, and the armies are ordered to stop where they stand."
chaosx.nr9.5.t: "The Armistice Circular"
chaosx.nr9.5.d: "A neutral circular passes from capital to capital with blank spaces for names, borders, and dates. By the time the last clerk stamps it, several wars have simply run out of official permission to continue."
chaosx.nr9.2.a: "Let the guns fall silent."
chaosx.nr9.3.a: "No one claims victory."
chaosx.nr9.4.a: "The order has already been given."
chaosx.nr9.5.a: "The line goes quiet."
chaosx.nr9.2.tt: "A safe minor war will end without conquest, indemnity, or a declared victor."
chaosx.nr9.3.tt: "Several safe minor wars will close under the same no-gain formula."
chaosx.nr9.4.tt: "A rare safe war involving a major country will end without spoils or surrender."
chaosx.nr9.5.tt: "Several safe conflicts will go quiet under one armistice circular."
white_peace_status_quo_settlement: "Status Quo Settlement"
