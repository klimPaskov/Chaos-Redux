l_english:
chaosx.nr9.1.t: "White Peace"
chaosx.nr9.2.t: "A Note Without Demands"
chaosx.nr9.2.d: "[white_peace_report_primary.GetName] and [white_peace_report_partner.GetName] have accepted the same armistice. Their armies return behind the lines they held before the war, and neither country gains land or demands payment."
chaosx.nr9.3.t: "Tables in Several Rooms"
chaosx.nr9.3.d: "One settlement sets a pattern. Delegates move from railway rooms to municipal halls, carrying the same dry language from one file to the next until several small wars close without victory parades."
chaosx.nr9.4.t: "A Major Power Steps Back"
chaosx.nr9.4.d: "A major government has ordered its armies to stand down after an armistice restores the old borders. Neither country receives payment."
chaosx.nr9.5.t: "The Armistice Circular"
chaosx.nr9.5.d: "A neutral circular passes from capital to capital with blank spaces for names, borders, and dates. By the time the last clerk stamps it, several wars have no order left to continue."
chaosx.nr9.2.a: "Let the guns fall silent."
chaosx.nr9.3.a: "No one claims victory."
chaosx.nr9.4.a: "The order has already been given."
chaosx.nr9.5.a: "The line goes quiet."
chaosx.nr9.2.tt: "The two countries have returned to their prewar borders. Neither pays an indemnity."
chaosx.nr9.3.tt: "Several separate minor wars have ended without territorial gains or indemnities."
chaosx.nr9.4.tt: "The major war has ended on its prewar borders. Neither side pays an indemnity."
chaosx.nr9.5.tt: "Several separate minor wars have ended on their prewar borders, without indemnities."
chaosx.nr9.6.t: "No Terms Can Be Sent"
chaosx.nr9.6.d: "[GetWhitePeaceInvalidEntryReason] No peace has been imposed and no border has changed."
chaosx.nr9.6.a: "Understood."
chaosx.nr9.6.tt: "No country has been forced to make peace."
chaosx.nr9.7.t: "A War Ends Without a Victor"
chaosx.nr9.7.d: "[white_peace_report_primary.GetName] and [white_peace_report_partner.GetName] have returned to their prewar borders. Their armies have stopped fighting, and neither country gains land or pays an indemnity."
chaosx.nr9.7.a: "The guns have fallen silent."
chaosx.nr9.8.t: "Several Minor Wars End"
chaosx.nr9.8.d: "Across several frontiers, soldiers leave their posts and return behind the old borders. These wars have ended without a transfer of land or an indemnity."
chaosx.nr9.8.a: "The front lines grow still."
chaosx.nr9.9.t: "A Major Front Falls Silent"
chaosx.nr9.9.d: "[white_peace_report_primary.GetName] and [white_peace_report_partner.GetName] have ended their war on the borders they held before the fighting. The major army is returning to its own territory, and neither side receives payment."
chaosx.nr9.9.a: "The war is over."
chaosx.nr9.10.t: "Armistices Across Several Fronts"
chaosx.nr9.10.d: "Several separate minor wars have ended at once. The armies return behind their former lines, and no country gains territory or an indemnity."
chaosx.nr9.10.a: "The fighting has ended on these fronts."
chaosx.nr9.6.reason.no_active_war: "No country is at war, so there is no front on which to offer terms."
chaosx.nr9.6.reason.no_safe_pair: "The active wars have no isolated two-country front with both capitals still secure."
chaosx.nr9.6.reason.major_locked: "The great powers have not accepted these terms. Their wars cannot yet be settled through this armistice."
chaosx.nr9.6.reason.protected_conflicts: "These wars involve governments excluded from the proposed talks."
chaosx.nr9.6.reason.recent_memory: "These countries have already accepted a recent armistice and cannot be asked to sign another yet."
white_peace_status_quo_settlement: "Status Quo Settlement"
