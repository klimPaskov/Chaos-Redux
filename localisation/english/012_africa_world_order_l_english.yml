africa_middle_east_world_focus_tree: "The Middle Eastern Crossroads"
africa_middle_east_world_focus_tree_desc: "Arab, Persian, Anatolian, Kurdish, Levantine, minority, municipal, religious, and labour institutions negotiate a plural crossroads with water, food, energy, sovereignty, and lawful withdrawal."
africa_middle_east_convene_crossroads_balance: "Convene the Crossroads Balance"
africa_middle_east_convene_crossroads_balance_desc: "Bring Arab, Persian, Anatolian, Kurdish, Levantine, minority, municipal, religious, and labour delegations into a public congress. No single people or capital begins with ownership of the settlement."
africa_middle_east_end_foreign_mandates: "End the Foreign Mandates"
africa_middle_east_end_foreign_mandates_desc: "Replace mandate privileges with sovereign treaties and publish a withdrawal schedule for foreign administrations."
africa_middle_east_water_and_food_security: "Water and Food Security"
africa_middle_east_water_and_food_security_desc: "Coordinate river basins, wells, grain reserves, and drought relief before political union asks communities to depend on a common authority."
africa_middle_east_pipeline_sovereignty: "Pipeline Sovereignty"
africa_middle_east_pipeline_sovereignty_desc: "Renegotiate concessions, protect production corridors, and keep oil revenue answerable to the constitutional settlement."
africa_middle_east_holy_cities_compact: "The Holy Cities Compact"
africa_middle_east_holy_cities_compact_desc: "Guarantee access, custodianship, municipal rights, and non-interference through a compact that no route may discard."
africa_middle_east_arab_federal_pact: "The Arab Federal Pact"
africa_middle_east_arab_federal_pact_desc: "Build a federal Arab center whose authority is limited by public guarantees for the other peoples and institutions of the crossroads."
africa_middle_east_plural_crossroads_federation: "A Plural Crossroads Federation"
africa_middle_east_plural_crossroads_federation_desc: "Distribute representation among regions, cities, communities, and economic councils instead of naming one national center as the owner of the whole."
africa_middle_east_royal_concert: "A Royal Concert"
africa_middle_east_royal_concert_desc: "Bind surviving courts and imperial institutions to a common council, budget, and holy-site settlement while preserving local succession law."
africa_middle_east_socialist_republics: "Union of Socialist Republics"
africa_middle_east_socialist_republics_desc: "Place pipelines, ports, and major estates under a congress of republics, workers, cultivators, and municipal councils."
africa_middle_east_desert_covenant: "The Desert Covenant"
africa_middle_east_desert_covenant_desc: "Negotiate with explicitly nonhuman desert actors under reviewed covenant law. Human identities are neither transformed into creatures nor assigned supernatural traits."
africa_middle_east_federal_chamber: "The Federal Chamber"
africa_middle_east_federal_chamber_desc: "Give member republics a protected chamber and require federal law to survive both population and regional votes."
africa_middle_east_protected_communities_clause: "Protected Communities Clause"
africa_middle_east_protected_communities_clause_desc: "Make language, worship, municipal administration, and political organisation enforceable constitutional rights."
africa_middle_east_council_of_courts: "Council of Courts"
africa_middle_east_council_of_courts_desc: "Turn royal and imperial houses into a bounded council whose budgets, commands, and treaty powers remain subject to the settlement."
africa_middle_east_republics_coordination: "Coordinate the Republics"
africa_middle_east_republics_coordination_desc: "Balance worker and rural representation across republics and prevent the largest industrial centers from monopolising the union."
africa_middle_east_nonhuman_covenant_terms: "Publish the Covenant Terms"
africa_middle_east_nonhuman_covenant_terms_desc: "Define territory, ecological obligations, containment rules, and the right of human communities to refuse supernatural jurisdiction."
africa_middle_east_desert_and_mountain_command: "Desert and Mountain Command"
africa_middle_east_desert_and_mountain_command_desc: "Create forces for desert supply, mountain defence, and corridor protection under a command answerable to the chosen constitution."
africa_middle_east_red_sea_and_nile_treaty: "Red Sea and Nile Treaty"
africa_middle_east_red_sea_and_nile_treaty_desc: "Open an equal treaty with Africa over shipping, water security, Suez, the Horn, and Indian Ocean access."
africa_middle_east_withdrawal_and_guarantees_law: "Withdrawal and Guarantees Law"
africa_middle_east_withdrawal_and_guarantees_law_desc: "Allow members to challenge federal acts, negotiate autonomy, and leave through a defined congress while preserving minority and corridor obligations."
africa_middle_east_crossroads_settlement_congress: "Crossroads Settlement Congress"
africa_middle_east_crossroads_settlement_congress_desc: "Reconcile representation, resources, command, holy sites, and withdrawal law in one final constitutional record."
africa_middle_east_sovereign_settlement: "A Sovereign Middle Eastern Settlement"
africa_middle_east_sovereign_settlement_desc: "Complete a route-specific continental identity with its own public name, governing compact, Africa relationship, military rule, and post-settlement choices."

africa_world_middle_east_founding_problem: "A Crossroads Without a Settlement"
africa_world_middle_east_founding_problem_desc: "Foreign mandates, concessionary oil, water insecurity, rival centers, and contested holy-site authority prevent the nominated government from claiming a legitimate regional order."
africa_world_middle_east_federal_compact: "The Arab Federal Compact"
africa_world_middle_east_federal_compact_desc: "An Arab federal center governs through protected regional and community guarantees."
africa_world_middle_east_plural_compact: "The Plural Crossroads Compact"
africa_world_middle_east_plural_compact_desc: "Cities, regions, communities, and economic councils share representation without a single national owner."
africa_world_middle_east_royal_concert: "The Middle Eastern Concert"
africa_world_middle_east_royal_concert_desc: "Courts and imperial institutions coordinate through a bounded common council."
africa_world_middle_east_socialist_republics: "Union of Middle Eastern Republics"
africa_world_middle_east_socialist_republics_desc: "Republics and producer councils coordinate strategic resources and common defence."
africa_world_middle_east_desert_covenant: "The Reviewed Desert Covenant"
africa_world_middle_east_desert_covenant_desc: "Explicitly nonhuman desert actors are bound by published territorial, ecological, and containment clauses."

africa_world_europe_founding_problem: "A Continent Without a Settlement"
africa_world_europe_founding_problem_desc: "War memory, border disputes, ideological blocs, colonial debts, and uneven industry obstruct a legitimate continental order."
africa_world_europe_federation: "European Federal Settlement"
africa_world_europe_federation_desc: "A democratic federation shares law, reconstruction, and defence through representative institutions."
africa_world_europe_socialist_union: "European Socialist Settlement"
africa_world_europe_socialist_union_desc: "Socialist republics coordinate industry and reconstruction through a continental congress."
africa_world_europe_royal_concert: "European Royal Concert"
africa_world_europe_royal_concert_desc: "Restored courts accept common borders, budgets, and security guarantees."
africa_world_europe_continental_command: "European Continental Command"
africa_world_europe_continental_command_desc: "A central command integrates army and air defence at a visible constitutional cost."
africa_world_europe_confederation: "European Confederation"
africa_world_europe_confederation_desc: "Sovereign members retain broad autonomy while sharing rail, trade, and crisis institutions."
africa_world_europe_mythic_compact: "European Mythic Compact"
africa_world_europe_mythic_compact_desc: "Reviewed nonhuman and supernatural actors enter a bounded compact without standing in for human peoples."

africa_world_asia_founding_problem: "A Continent of Unequal Centers"
africa_world_asia_founding_problem_desc: "Regional congresses, river systems, population, industry, steppe routes, and maritime access remain politically disconnected."
africa_world_asia_federation: "Asian Federal Settlement"
africa_world_asia_federation_desc: "Several regional centers share representation, corridors, and defence without one nation owning the continent."
africa_world_asia_revolutionary_union: "Asian Revolutionary Settlement"
africa_world_asia_revolutionary_union_desc: "Revolutionary republics coordinate production and defence through distributed continental institutions."
africa_world_asia_imperial_congress: "Asian Imperial Congress"
africa_world_asia_imperial_congress_desc: "Imperial institutions accept a common congress, regional guarantees, and bounded command."
africa_world_asia_anti_colonial_front: "Asian Anti-Colonial Common Front"
africa_world_asia_anti_colonial_front_desc: "Regional actors preserve autonomy while coordinating liberation, sea lanes, and external defence."
africa_world_asia_celestial_covenant: "Asian Celestial Covenant"
africa_world_asia_celestial_covenant_desc: "Reviewed nonhuman forces are contained by regional law and never substitute for human Asian identities."

africa_world_north_america_founding_problem: "An Unequal Continental Bargain"
africa_world_north_america_founding_problem_desc: "Industrial concentration, federal power, migration, Caribbean exclusion, indigenous rights, and military command remain unsettled."
africa_world_north_america_republics: "Republic of Republics Settlement"
africa_world_north_america_republics_desc: "National and regional republics share representation through a continental convention."
africa_world_north_america_commonwealth: "North American Commonwealth Settlement"
africa_world_north_america_commonwealth_desc: "A commonwealth coordinates infrastructure and defence while protecting national sovereignty."
africa_world_north_america_command: "North American Command Settlement"
africa_world_north_america_command_desc: "A military hemisphere command accepts public limits and regional representation."
africa_world_north_america_socialist_union: "North American Socialist Settlement"
africa_world_north_america_socialist_union_desc: "Workers, republics, and regional councils coordinate industry through a continental union."
africa_world_north_america_storm_compact: "North American Storm Compact"
africa_world_north_america_storm_compact_desc: "Reviewed nonhuman storm actors enter a bounded emergency compact with regional refusal rights."

africa_world_south_america_founding_problem: "Andes, Amazon, and Plata Divided"
africa_world_south_america_founding_problem_desc: "Regional leadership, river access, mountain supply, foreign debt, resources, and indigenous representation remain unsettled."
africa_world_south_america_republics: "South American Republican Settlement"
africa_world_south_america_republics_desc: "A congress of republics balances continental authority with national representation."
africa_world_south_america_federation: "South American Federal Settlement"
africa_world_south_america_federation_desc: "Andean, Amazonian, Atlantic, and Plata institutions share resources and infrastructure through federal law."
africa_world_south_america_socialist_union: "South American Socialist Settlement"
africa_world_south_america_socialist_union_desc: "Producer councils and republics coordinate resource sovereignty and social development."
africa_world_south_america_command: "South American Command Settlement"
africa_world_south_america_command_desc: "A military continental state integrates mountain, river, and coastal defence under public obligations."
africa_world_south_america_royal_concert: "South American Royal Concert"
africa_world_south_america_royal_concert_desc: "A rare concert of restored courts accepts regional balance and constitutional limits."
africa_world_south_america_sun_covenant: "South American Sun Covenant"
africa_world_south_america_sun_covenant_desc: "Reviewed nonhuman forces enter ecological and territorial covenants without caricaturing human communities."

africa_world_oceania_founding_problem: "An Ocean Without a Common Network"
africa_world_oceania_founding_problem_desc: "Convoy reach, island representation, indigenous and settler politics, air routes, and dispersed industry remain disconnected."
africa_world_oceania_federation: "Oceanian Federal Settlement"
africa_world_oceania_federation_desc: "Island congresses share maritime defence and infrastructure through representative federal law."
africa_world_oceania_dominion: "Oceanian Dominion Settlement"
africa_world_oceania_dominion_desc: "A dominion route accepts island representation and limits on central naval power."
africa_world_oceania_peoples_union: "Oceanian Peoples' Settlement"
africa_world_oceania_peoples_union_desc: "Indigenous-led island institutions direct maritime development, land law, and common defence."
africa_world_oceania_maritime_commonwealth: "Oceanian Maritime Commonwealth"
africa_world_oceania_maritime_commonwealth_desc: "A socialist maritime commonwealth coordinates dockyards, convoys, evacuation, and island development."
africa_world_oceania_deep_sea_covenant: "Oceanian Deep-Sea Covenant"
africa_world_oceania_deep_sea_covenant_desc: "Reviewed nonhuman ocean actors accept containment, ecological obligations, and island refusal rights."

africa_europe_world_focus_tree: "The European Continental Settlement"
africa_europe_world_focus_tree_desc: "Governments, parties, unions, courts, border communities, and reconstruction authorities across Europe negotiate a settlement with settled borders, public institutions, and lawful withdrawal."
africa_europe_convene_continental_settlement: "Convene the Continental Settlement"
africa_europe_convene_continental_settlement_desc: "Bring governments, parties, unions, courts, border communities, and reconstruction authorities together before any European actor claims continental rule."
africa_europe_border_and_sovereignty_guarantees: "Border and Sovereignty Guarantees"
africa_europe_border_and_sovereignty_guarantees_desc: "Freeze unilateral border revision and protect member sovereignty while the settlement congress hears claims and security concerns."
africa_europe_industrial_and_rail_reconstruction: "Industrial and Rail Reconstruction"
africa_europe_industrial_and_rail_reconstruction_desc: "Reconnect rail corridors, power grids, and industrial regions through a reconstruction authority accountable to the settlement."
africa_europe_colonial_reckoning: "The Colonial Reckoning"
africa_europe_colonial_reckoning_desc: "Record colonial debts, recognise African sovereignty, and negotiate restitution, migration, trade, and remaining base questions."
africa_europe_democratic_federation: "A Democratic Federation"
africa_europe_democratic_federation_desc: "Create representative federal institutions with enforceable regional and national guarantees."
africa_europe_socialist_union: "A Socialist Union"
africa_europe_socialist_union_desc: "Coordinate reconstruction and strategic industry through a congress of socialist republics and producer organisations."
africa_europe_royal_concert: "A Restored Royal Concert"
africa_europe_royal_concert_desc: "Bind restored courts to common borders, budgets, and security law without granting one dynasty continental ownership."
africa_europe_continental_command: "A Continental Command"
africa_europe_continental_command_desc: "Centralise military planning under an emergency command whose powers and succession must be written into public law."
africa_europe_neutral_confederation: "A Neutral Confederation"
africa_europe_neutral_confederation_desc: "Preserve broad national sovereignty while coordinating trade, rail, mediation, and defensive crisis rules."
africa_europe_mythic_compact: "The Mythic Compact"
africa_europe_mythic_compact_desc: "Admit reviewed nonhuman actors through explicit territorial and containment clauses. They do not represent or replace any human European people."
africa_europe_federal_chamber: "The Federal Chamber"
africa_europe_federal_chamber_desc: "Balance population representation with protected national and regional votes."
africa_europe_congress_of_republics: "Congress of Republics"
africa_europe_congress_of_republics_desc: "Give each republic a voice over continental plans, budgets, and industrial transfers."
africa_europe_council_of_crowns: "Council of Crowns"
africa_europe_council_of_crowns_desc: "Limit dynastic authority through a common council and enforceable member guarantees."
africa_europe_emergency_command_statute: "Emergency Command Statute"
africa_europe_emergency_command_statute_desc: "Define the command's duration, civilian oversight, regional obligations, and post-crisis review."
africa_europe_sovereignties_council: "Council of Sovereignties"
africa_europe_sovereignties_council_desc: "Require confederal consent for war, border changes, and permanent transfers of authority."
africa_europe_nonhuman_compact_law: "Publish the Compact Law"
africa_europe_nonhuman_compact_law_desc: "Set the territory, obligations, containment limits, and refusal rights governing explicitly nonhuman participants."
africa_europe_common_army_and_air_defence: "Common Army and Air Defence"
africa_europe_common_army_and_air_defence_desc: "Create joint commands for continental defence while preserving the route's representation and oversight rules."
africa_europe_withdrawal_and_crisis_law: "Withdrawal and Crisis Law"
africa_europe_withdrawal_and_crisis_law_desc: "Let members challenge emergency acts, renegotiate obligations, and leave through a defined constitutional procedure."
africa_europe_post_colonial_treaty: "The Post-Colonial Treaty"
africa_europe_post_colonial_treaty_desc: "Settle recognition, restitution, migration, resource agreements, and military access with Africa through a treaty of public obligations."
africa_europe_ratify_continental_settlement: "Ratify the Continental Settlement"
africa_europe_ratify_continental_settlement_desc: "Complete a route-specific European identity with settled borders, representation, industry, command, withdrawal, colonial obligations, and post-unification rule."

africa_asia_world_focus_tree: "The Centers of Asia Settlement"
africa_asia_world_focus_tree_desc: "East, South, inland, steppe, and archipelago institutions across Asia negotiate as regional centers, balancing food, corridors, defence, autonomy, and a treaty with Africa."
africa_asia_convene_regional_congresses: "Convene the Regional Congresses"
africa_asia_convene_regional_congresses_desc: "Create a continental process in which East, South, inland, steppe, and archipelago institutions negotiate as centers rather than subjects of one capital."
africa_asia_eastern_and_coastal_centre: "Eastern and Coastal Centre"
africa_asia_eastern_and_coastal_centre_desc: "Coordinate major eastern industrial regions and coastal routes while protecting the votes of smaller maritime members."
africa_asia_southern_river_centre: "Southern River Centre"
africa_asia_southern_river_centre_desc: "Give South Asian population centers and river systems a permanent institution for food, water, industry, and representation."
africa_asia_inland_and_steppe_centre: "Inland and Steppe Centre"
africa_asia_inland_and_steppe_centre_desc: "Represent inland republics, mountain corridors, and steppe routes in continental budgets and defence."
africa_asia_archipelago_centre: "Archipelago Centre"
africa_asia_archipelago_centre_desc: "Protect island and Southeast Asian representation through a maritime center with authority over sea lanes and disaster access."
africa_asia_plural_federation: "A Plural Asian Federation"
africa_asia_plural_federation_desc: "Build a federation whose regional centers share authority and whose distributed institutions prevent one nation from owning Asia."
africa_asia_revolutionary_union: "A Revolutionary Continental Union"
africa_asia_revolutionary_union_desc: "Coordinate revolutionary republics through regional congresses, shared production, and protected local administration."
africa_asia_imperial_congress: "An Imperial Congress"
africa_asia_imperial_congress_desc: "Place imperial institutions inside a continental congress with bounded command and regional guarantees."
africa_asia_anti_colonial_common_front: "The Anti-Colonial Common Front"
africa_asia_anti_colonial_common_front_desc: "Preserve regional sovereignty while coordinating liberation, external defence, and maritime access."
africa_asia_celestial_covenant: "The Celestial Covenant"
africa_asia_celestial_covenant_desc: "Admit reviewed nonhuman actors under explicit territorial, ecological, and containment law. They never represent a human Asian identity."
africa_asia_federal_centres_chamber: "Chamber of Federal Centres"
africa_asia_federal_centres_chamber_desc: "Balance population votes with protected representation for every regional center."
africa_asia_congress_of_revolutionary_republics: "Congress of Revolutionary Republics"
africa_asia_congress_of_revolutionary_republics_desc: "Give each republic authority over continental plans, transfers, and emergency powers."
africa_asia_regional_imperial_chambers: "Regional Imperial Chambers"
africa_asia_regional_imperial_chambers_desc: "Require imperial courts and administrations to share budgets and command through regional chambers."
africa_asia_liberation_council: "The Liberation Council"
africa_asia_liberation_council_desc: "Coordinate anti-colonial aid and defence without subordinating liberated governments to a permanent center."
africa_asia_publish_celestial_covenant_law: "Publish the Celestial Covenant Law"
africa_asia_publish_celestial_covenant_law_desc: "Define territory, obligations, containment, and the right of human communities to refuse nonhuman jurisdiction."
africa_asia_food_river_and_monsoon_board: "Food, River, and Monsoon Board"
africa_asia_food_river_and_monsoon_board_desc: "Coordinate grain, river basins, flood response, and monsoon logistics through a board answerable to the regional congresses."
africa_asia_rail_and_maritime_corridors: "Rail and Maritime Corridors"
africa_asia_rail_and_maritime_corridors_desc: "Connect inland routes, ports, and archipelagos without converting corridor investment into central political ownership."
africa_asia_common_defence_and_autonomy_law: "Common Defence and Autonomy Law"
africa_asia_common_defence_and_autonomy_law_desc: "Define joint defence, regional commands, crisis review, autonomy, and a lawful withdrawal procedure."
africa_asia_indian_ocean_partnership: "The Indian Ocean Partnership"
africa_asia_indian_ocean_partnership_desc: "Negotiate an equal African-Asian treaty over shipping, decolonisation, ports, and Indian Ocean security."
africa_asia_ratify_centres_settlement: "Ratify the Centers of Asia Settlement"
africa_asia_ratify_centres_settlement_desc: "Complete a route-specific Asian identity with distributed institutions, resources, command, autonomy, Africa relations, and post-unification rule."

africa_north_america_world_focus_tree: "The North American Continental Bargain"
africa_north_america_world_focus_tree_desc: "The United States, Canada, Mexico, Central American governments, Caribbean states, northern islands, indigenous nations, and regional authorities negotiate a plural continental bargain."
africa_north_america_convene_continental_bargain: "Convene the Continental Bargain"
africa_north_america_convene_continental_bargain_desc: "Call the United States, Canada, Mexico, Central American governments, Caribbean states, northern islands, indigenous nations, and regional authorities into one public convention before any capital claims North America."
africa_north_america_industrial_grid_and_transport: "Industrial Grid and Transport"
africa_north_america_industrial_grid_and_transport_desc: "Link rail, power, ports, and production through a continental authority that invests outside the largest industrial centers and cannot convert infrastructure into political ownership."
africa_north_america_caribbean_and_central_membership: "Caribbean and Central Membership"
africa_north_america_caribbean_and_central_membership_desc: "Guarantee Caribbean and Central American governments protected votes, access to shared budgets, and authority over the sea lanes and projects that affect them."
africa_north_america_indigenous_and_regional_settlement: "Indigenous and Regional Settlement"
africa_north_america_indigenous_and_regional_settlement_desc: "Recognise indigenous nations and regional polities as negotiating parties with land review, representation, development consent, and the right to refuse unwanted jurisdiction."
africa_north_america_citizenship_and_mobility_compact: "Citizenship and Mobility Compact"
africa_north_america_citizenship_and_mobility_compact_desc: "Protect equal citizenship, lawful movement, family connections, and voluntary return. No authority may compel relocation or describe forced movement as return."
africa_north_america_republic_of_republics: "A Republic of Republics"
africa_north_america_republic_of_republics_desc: "Build a plural union of national and regional republics in which population votes are balanced by protected member and indigenous representation."
africa_north_america_continental_commonwealth: "A Continental Commonwealth"
africa_north_america_continental_commonwealth_desc: "Coordinate the industrial grid, migration, and common defence through treaties among sovereign governments and regional councils."
africa_north_america_hemisphere_command: "A Hemisphere Command"
africa_north_america_hemisphere_command_desc: "Centralise Atlantic and Pacific defence under a continental command whose emergency authority, civilian oversight, regional obligations, and withdrawal law must remain public."
africa_north_america_socialist_continental_union: "A Socialist Continental Union"
africa_north_america_socialist_continental_union_desc: "Place industry and transport under a congress of workers, republics, indigenous nations, and regional councils with equal Caribbean and Central American membership."
africa_north_america_storm_frontier_compact: "The Storm Frontier Compact"
africa_north_america_storm_frontier_compact_desc: "Admit reviewed nonhuman storm actors under bounded territorial, ecological, and containment law. They never represent or replace a human North American identity."
africa_north_america_bicameral_congress: "The Bicameral Continental Congress"
africa_north_america_bicameral_congress_desc: "Balance population representation with a protected chamber for member republics, indigenous nations, island states, and regional governments."
africa_north_america_council_of_governments: "Council of Governments"
africa_north_america_council_of_governments_desc: "Require national, Caribbean, Central American, indigenous, and regional governments to approve transfers, budgets, and common obligations through treaty law."
africa_north_america_civilian_command_statute: "Civilian Command Statute"
africa_north_america_civilian_command_statute_desc: "Set election, oversight, succession, regional command, emergency review, and refusal rules before the hemisphere command receives further authority."
africa_north_america_congress_of_workers_and_republics: "Congress of Workers and Republics"
africa_north_america_congress_of_workers_and_republics_desc: "Give workers, republics, indigenous nations, islands, and regional councils authority over production plans, transfers, and emergency powers."
africa_north_america_publish_storm_containment_law: "Publish the Storm Containment Law"
africa_north_america_publish_storm_containment_law_desc: "Define the territory, obligations, ecological limits, containment powers, and human refusal rights governing explicitly nonhuman storm actors."
africa_north_america_resources_and_withdrawal_law: "Resources and Withdrawal Law"
africa_north_america_resources_and_withdrawal_law_desc: "Set constitution-specific rules for industrial transfers, resources, public budgets, renegotiation, lawful withdrawal, and the settlement of shared liabilities."
africa_north_america_atlantic_and_pacific_defence: "Atlantic and Pacific Defence"
africa_north_america_atlantic_and_pacific_defence_desc: "Create route-specific commands for two-ocean defence while preserving civilian oversight, island consent, regional obligations, and the constitutional balance."
africa_north_america_caribbean_and_atlantic_islands_settlement: "Caribbean and Atlantic Islands Settlement"
africa_north_america_caribbean_and_atlantic_islands_settlement_desc: "Resolve votes, bases, shipping, investment, migration, and ecological obligations with Caribbean and Atlantic island governments through consent rather than continental presumption."
africa_north_america_africa_diaspora_citizenship_treaty: "The Africa Diaspora Citizenship Treaty"
africa_north_america_africa_diaspora_citizenship_treaty_desc: "Negotiate citizenship, skills exchange, investment, Atlantic convoys, and locally accepted development with Africa. Return remains voluntary and every receiving community retains the right to accept, negotiate, or refuse a project."
africa_north_america_ratify_continental_bargain: "Ratify the Continental Bargain"
africa_north_america_ratify_continental_bargain_desc: "Complete a route-specific North American identity with settled representation, executive power, resources, command, withdrawal, island obligations, diaspora citizenship, and post-unification rule."
africa_north_america_continental_bargain_is_balanced_tt: "Every Continental Bargain value must stand above Low.\nIndustrial balance: [?africa_north_america_industrial_balance|0]\nFederal representation: [?africa_north_america_federal_representation|0]\nNational sovereignty: [?africa_north_america_national_sovereignty|0]\nCaribbean and Central inclusion: [?africa_north_america_caribbean_inclusion|0]\nIndigenous settlement: [?africa_north_america_indigenous_settlement|0]\nMigration compact: [?africa_north_america_migration_compact|0]\nCommand integration: [?africa_north_america_command_integration|0]"

africa_south_america_world_focus_tree: "The Andes, Amazon, and Plata Balance"
africa_south_america_world_focus_tree_desc: "Andean, Amazonian, La Plata, Atlantic, Pacific, indigenous, and regional institutions balance transport, rivers, resources, debt, defence, and a treaty with Africa."
africa_south_america_convene_three_regions_balance: "Convene the Three Regions Balance"
africa_south_america_convene_three_regions_balance_desc: "Bring Andean, Amazonian, La Plata, Atlantic, Pacific, Caribbean-facing, indigenous, and regional institutions into one public congress before any capital claims South America."
africa_south_america_andean_transport_and_mountain_supply: "Andean Transport and Mountain Supply"
africa_south_america_andean_transport_and_mountain_supply_desc: "Build rail, road, and mountain supply through an Andean authority that gives affected indigenous nations and regional governments control over routes and obligations."
africa_south_america_amazon_river_and_forest_compact: "Amazon River and Forest Compact"
africa_south_america_amazon_river_and_forest_compact_desc: "Protect river access, forest communities, indigenous consent, disaster response, and navigation without treating the Amazon as an empty resource frontier."
africa_south_america_plata_ports_and_two_ocean_system: "La Plata Ports and Two-Ocean System"
africa_south_america_plata_ports_and_two_ocean_system_desc: "Coordinate Atlantic ports, Pacific access, southern sea lanes, and river exports through public budgets and balanced regional votes."
africa_south_america_resource_concessions_and_debt_audit: "Resource Concessions and Debt Audit"
africa_south_america_resource_concessions_and_debt_audit_desc: "Publish foreign concessions, debts, ownership claims, labour obligations, and revenue transfers before the continental settlement inherits them."
africa_south_america_congress_of_republics: "A Congress of Republics"
africa_south_america_congress_of_republics_desc: "Build a continental republic through national and regional chambers rather than a single leader cult or one capital's historical claim."
africa_south_america_plural_federation: "A Plural Federation"
africa_south_america_plural_federation_desc: "Balance the Andes, Amazon, and La Plata through federal institutions with protected indigenous, river, island, and regional representation."
africa_south_america_socialist_continental_union: "A Socialist Continental Union"
africa_south_america_socialist_continental_union_desc: "Coordinate resources, ports, land, and industry through a congress of workers, republics, communes, indigenous nations, and regional councils."
africa_south_america_continental_command: "A Continental Command"
africa_south_america_continental_command_desc: "Centralise mountain, river, and naval defence under a command whose civilian oversight, concession law, regional duties, and withdrawal procedure remain public."
africa_south_america_restored_concert: "A Restored Continental Concert"
africa_south_america_restored_concert_desc: "Place restored courts and traditional institutions inside a continental balance with public budgets, bounded command, regional consent, and no single dynastic owner."
africa_south_america_sun_covenant: "The Sun Covenant"
africa_south_america_sun_covenant_desc: "Admit reviewed nonhuman sun, forest, or mountain actors through explicit territorial, ecological, and containment law. They never represent or replace a human South American identity."
africa_south_america_republican_chamber: "The Republican Regional Chamber"
africa_south_america_republican_chamber_desc: "Balance population votes with protected seats for regions, indigenous nations, river authorities, and smaller republics."
africa_south_america_council_of_three_regions: "Council of the Three Regions"
africa_south_america_council_of_three_regions_desc: "Give Andean, Amazonian, and La Plata institutions equal standing over federal transfers, security, and constitutional amendment."
africa_south_america_congress_of_workers_and_communes: "Congress of Workers and Communes"
africa_south_america_congress_of_workers_and_communes_desc: "Give workers, communes, republics, indigenous nations, and regional councils authority over production plans and resource transfers."
africa_south_america_civilian_command_statute: "Civilian Command Statute"
africa_south_america_civilian_command_statute_desc: "Define civilian appointment, regional commands, concession review, emergency duration, succession, and the right to challenge military orders."
africa_south_america_council_of_realms: "Council of Realms and Regions"
africa_south_america_council_of_realms_desc: "Bind courts and traditional authorities to a regional council that controls budgets, military levies, debt settlements, and public guarantees."
africa_south_america_publish_sun_covenant_law: "Publish the Sun Covenant Law"
africa_south_america_publish_sun_covenant_law_desc: "Define territory, ecological obligations, containment powers, and human refusal rights for explicitly nonhuman participants."
africa_south_america_resource_and_debt_sovereignty_law: "Resource and Debt Sovereignty Law"
africa_south_america_resource_and_debt_sovereignty_law_desc: "Set route-specific rules for concessions, debt, revenue, public ownership, renegotiation, lawful withdrawal, and the settlement of shared liabilities."
africa_south_america_continental_defence_and_corridors: "Continental Defence and Corridors"
africa_south_america_continental_defence_and_corridors_desc: "Connect mountain supply, river access, Atlantic ports, and Pacific routes through constitutional commands that remain answerable to regional institutions."
africa_south_america_south_atlantic_partnership: "The South Atlantic Partnership"
africa_south_america_south_atlantic_partnership_desc: "Negotiate shipping, cultural links, voluntary diaspora ties, resource cooperation, and Atlantic security with Africa. Every cultural or development project requires local acceptance."
africa_south_america_ratify_three_regions_settlement: "Ratify the Three Regions Settlement"
africa_south_america_ratify_three_regions_settlement_desc: "Complete a route-specific South American identity with settled regional representation, resources, debt, command, withdrawal, Africa relations, and post-unification rule."
africa_south_america_three_regions_balance_is_settled_tt: "Every Andes, Amazon, and Plata Balance value must stand above Low.\nAndean voice: [?africa_south_america_andean_voice|0]\nAmazon voice: [?africa_south_america_amazon_voice|0]\nLa Plata voice: [?africa_south_america_plata_voice|0]\nIndigenous representation: [?africa_south_america_indigenous_representation|0]\nResource sovereignty: [?africa_south_america_resource_sovereignty|0]\nDebt freedom: [?africa_south_america_debt_freedom|0]"
africa_oceania_world_focus_tree: "The Ocean Network"
africa_oceania_world_focus_tree_desc: "Australia, New Zealand, Melanesia, Micronesia, Polynesia, and the island governments build a consent-based ocean network for shipping, defence, development, and disaster response."
africa_oceania_convene_ocean_network: "Convene the Ocean Network"
africa_oceania_convene_ocean_network_desc: "Australia, New Zealand, Melanesia, Micronesia, Polynesia, and the island governments will meet as negotiating partners linked by the sea. No mainland government may speak for an island without its consent."
africa_oceania_island_congress_and_sovereignty: "Island Congress and Sovereignty"
africa_oceania_island_congress_and_sovereignty_desc: "Guarantee votes for island governments, protect refusal rights, and place indigenous and local institutions inside the founding congress."
africa_oceania_convoy_and_shipping_network: "Convoy and Shipping Network"
africa_oceania_convoy_and_shipping_network_desc: "Coordinate merchant shipping, protected anchorages, repair yards, and shared convoy schedules without turning island ports into unaccountable military possessions."
africa_oceania_air_routes_and_dispersed_industry: "Air Routes and Dispersed Industry"
africa_oceania_air_routes_and_dispersed_industry_desc: "Connect remote communities by air and distribute workshops, fuel stores, and repair capacity so that one lost port cannot sever the whole ocean."
africa_oceania_island_development_and_evacuation: "Island Development and Voluntary Evacuation"
africa_oceania_island_development_and_evacuation_desc: "Fund locally accepted housing, water, medicine, and storm shelters. Evacuation remains voluntary, with return, land, and political rights guaranteed by the receiving and home communities."
africa_oceania_anti_colonial_liberation_and_land_settlement: "Liberation and Land Settlement"
africa_oceania_anti_colonial_liberation_and_land_settlement_desc: "Recognise anti-colonial governments and negotiate land, restitution, customary authority, and refusal clauses before any shared constitution can claim legitimacy."
africa_oceania_maritime_federation: "The Maritime Federation"
africa_oceania_maritime_federation_desc: "Create a federal ocean settlement in which Australia and New Zealand share the chamber with sovereign island governments instead of absorbing them."
africa_oceania_treaty_dominion: "The Treaty Dominion"
africa_oceania_treaty_dominion_desc: "Bind Australia, New Zealand, and the island governments through negotiated crown and defence treaties. Dominion authority is limited by island consent, indigenous land law, and a lawful withdrawal process."
africa_oceania_indigenous_led_ocean_union: "The Indigenous-Led Ocean Union"
africa_oceania_indigenous_led_ocean_union_desc: "Place indigenous nations and island governments at the constitutional centre, with Australia and New Zealand joining through negotiated obligations rather than inherited imperial rank."
africa_oceania_socialist_maritime_commonwealth: "The Socialist Maritime Commonwealth"
africa_oceania_socialist_maritime_commonwealth_desc: "Unite ports, unions, cooperatives, and island republics through a congress that socialises strategic shipping while preserving local government and refusal rights."
africa_oceania_deep_sea_covenant: "The Deep-Sea Covenant"
africa_oceania_deep_sea_covenant_desc: "Negotiate bounded ecological and containment terms with explicitly nonhuman actors from the deep ocean. Human communities keep their own identities, territories, and unrestricted right to refuse."
africa_oceania_federal_island_chamber: "The Federal Island Chamber"
africa_oceania_federal_island_chamber_desc: "Balance population representation with protected island votes, indigenous seats, regional aviation guarantees, and an enforceable right to leave."
africa_oceania_dominion_island_council: "The Dominion Island Council"
africa_oceania_dominion_island_council_desc: "Subject dominion budgets, naval deployments, land agreements, and base leases to a council in which affected island governments can negotiate or refuse."
africa_oceania_peoples_ocean_congress: "The Peoples' Ocean Congress"
africa_oceania_peoples_ocean_congress_desc: "Give indigenous nations and island governments the decisive voice over land, development, representation, and the obligations accepted by Australia and New Zealand."
africa_oceania_workers_and_ports_congress: "The Workers' and Ports Congress"
africa_oceania_workers_and_ports_congress_desc: "Place shipping, port investment, labour standards, and island representation under a congress of unions, cooperatives, republics, and local governments."
africa_oceania_publish_deep_sea_containment_law: "Publish Deep-Sea Containment Law"
africa_oceania_publish_deep_sea_containment_law_desc: "Define nonhuman territory, ecological obligations, disaster warnings, containment powers, and the unconditional refusal rights of every human community."
africa_oceania_ocean_constitution_and_withdrawal_law: "Ocean Constitution and Withdrawal Law"
africa_oceania_ocean_constitution_and_withdrawal_law_desc: "Set route-specific rules for representation, executive authority, resources, command, base leases, crisis government, and lawful withdrawal."
africa_oceania_pacific_defence_and_disaster_reserve: "Pacific Defence and Disaster Reserve"
africa_oceania_pacific_defence_and_disaster_reserve_desc: "Build constitutional rescue commands, convoy protection, air relays, medical reserves, and disaster stores. Each route assigns military authority differently."
africa_oceania_indian_ocean_and_southern_sea_treaty: "Indian Ocean and Southern Sea Treaty"
africa_oceania_indian_ocean_and_southern_sea_treaty_desc: "Negotiate convoy protection, island obligations, and sea access with Africa. Every base requires treaty consent, and rivalry over the Indian Ocean is managed without integration."
africa_oceania_ratify_ocean_network: "Ratify the Ocean Network"
africa_oceania_ratify_ocean_network_desc: "Complete a route-specific Oceanian identity with settled island representation, command, land rights, withdrawal, disaster law, Africa relations, and post-unification rule."
africa_oceania_ocean_network_is_connected_tt: "Every Ocean Network value must stand above Low.\nConvoy reach: [?africa_oceania_convoy_reach|0]\nIsland representation: [?africa_oceania_island_representation|0]\nNaval protection: [?africa_oceania_naval_protection|0]\nIndigenous settlement: [?africa_oceania_indigenous_settlement|0]\nAir network: [?africa_oceania_air_network|0]\nDispersed industry: [?africa_oceania_dispersed_industry|0]"

# Constituent Agency and Package Ratification Protocol
africa_world_package.1.t: "A Continental Invitation"
africa_world_package.1.d: "The continental package has named our government as a constituent. The invitation does not presume consent. We can enter the compact, answer with safeguards, or refuse and leave the refusal in the public ledger."
africa_world_package.1.a: "Enter the compact voluntarily"
africa_world_package.1.a.tt: "Records a voluntary constituent answer, strengthens the package's authority, and clears this invitation from the pending ledger."
africa_world_package.1.b: "Return counterterms"
africa_world_package.1.b.tt: "Keeps the invitation open while the package considers a local command, resource, language, or basing safeguard."
africa_world_package.1.c: "Refuse the invitation"
africa_world_package.1.c.tt: "Records a public refusal, closes this invitation, and leaves coercion unavailable until a real refusal has been recorded."
africa_world_package.2.t: "Consent Recorded"
africa_world_package.2.d: "The constituent government has answered for itself. Its voluntary consent is now part of the package ledger, with no transfer of sovereignty or territory."
africa_world_package.2.a: "File the consent"
africa_world_package.3.t: "Counterterms at the Package Table"
africa_world_package.3.d: "The constituent has returned counterterms instead of delegating the decision to the package actor. The package can fund safeguards, revise the offer, or close the invitation as a refusal."
africa_world_package.3.a: "Accept the local-command safeguard"
africa_world_package.3.a.tt: "Spends the displayed Political Power, records the safeguard, and records the constituent's final voluntary consent."
africa_world_package.3.b: "Revise the offer"
africa_world_package.3.b.tt: "Return the final answer to the constituent government. It can accept or refuse the revised terms."
africa_world_package.3.c: "Close the table as a refusal"
africa_world_package.3.c.tt: "Records a refusal after counterterms fail. Coercion can be considered only after this public refusal exists."
africa_world_package.4.t: "Refusal Filed in the Ledger"
africa_world_package.4.d: "The constituent has refused the invitation or the revised counterterms. Its government remains sovereign, while the package carries the legitimacy, authority, and grievance consequences of that answer."
africa_world_package.4.a: "Acknowledge the refusal"
africa_world_package.5.t: "Final Counterterm Answer"
africa_world_package.5.d: "The revised package terms have returned to the constituent government. Its answer will determine whether the relationship is voluntary or remains outside the compact."
africa_world_package.5.a: "Accept the revised compact"
africa_world_package.5.a.tt: "Records voluntary consent under the revised terms and clears the counterterm response."
africa_world_package.5.b: "Refuse the revised compact"
africa_world_package.5.b.tt: "Records the constituent's refusal and leaves the government sovereign outside the compact."
africa_world_package.6.t: "A Constituent Withdrawal Notice"
africa_world_package.6.d: "A member government has opened a lawful withdrawal notice. The package actor can accept an orderly exit, offer enforceable safeguards, or contest the notice and expose a constituent-owned coercion branch."
africa_world_package.6.a: "Accept an orderly exit"
africa_world_package.6.a.tt: "Spends the displayed Political Power and sends the notice back to the constituent for final confirmation."
africa_world_package.6.b: "Offer safeguards instead"
africa_world_package.6.b.tt: "Spends the displayed Political Power and offers a local-command safeguard. The constituent owns the answer."
africa_world_package.6.c: "Contest the withdrawal"
africa_world_package.6.c.tt: "Spends the displayed Political Power, records an authority loss, and opens the constituent's contested-exit review."
africa_world_package.7.t: "Orderly Exit Confirmation"
africa_world_package.7.d: "The package has accepted the withdrawal notice. Confirming the notice closes this government's membership without transferring territory or rewriting its sovereignty."
africa_world_package.7.a: "Confirm the orderly exit"
africa_world_package.8.t: "Safeguards Offered"
africa_world_package.8.d: "The package has offered a local-command safeguard instead of accepting the withdrawal notice outright. The constituent government must accept or reject the settlement itself."
africa_world_package.8.a: "Accept the safeguard"
africa_world_package.8.a.tt: "Retains membership under a recorded local-command veto and closes the withdrawal notice."
africa_world_package.8.b: "Reject the safeguard"
africa_world_package.8.b.tt: "Rejects the offer and opens a contested exit. Coercion remains a separate, visible decision."
africa_world_package.9.t: "Contested Exit Review"
africa_world_package.9.d: "The package has contested the withdrawal. The constituent government still owns the answer: accept the safeguard and remain, or reject the settlement and expose the grievance."
africa_world_package.9.a: "Accept the safeguard and remain"
africa_world_package.9.a.tt: "Keeps the government sovereign and inside the compact under the recorded safeguard."
africa_world_package.9.b: "Reject the contested settlement"
africa_world_package.9.b.tt: "Closes the withdrawal notice as a public contested grievance. Coercion becomes available only after this answer."
africa_world_package.10.t: "Safeguard Accepted"
africa_world_package.10.d: "The constituent government has accepted the safeguard and withdrawn its notice. Membership continues under a recorded local-command veto."
africa_world_package.10.a: "File the safeguard"
africa_world_package.11.t: "Safeguard Rejected"
africa_world_package.11.d: "The constituent government has rejected the contested settlement. Its grievance is public, and the package may now consider the separate coercion decision without calling refusal consent."
africa_world_package.11.a: "Acknowledge the grievance"
africa_world_package.12.t: "Withdrawal Notice Expired"
africa_world_package.12.d: "The withdrawal window has expired. An independent, peaceful, uncontested notice becomes an orderly exit. War, subordination, or a contested notice remains open for a separate settlement."
africa_world_package.12.a: "Close the notice"
