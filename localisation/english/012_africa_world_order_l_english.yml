l_english:
africa_world_order.1.t: "Africa Demands an Answer"
africa_world_order.1.d: "The government of [africa_host.GetNameDef] has proclaimed a continental settlement and demanded that foreign capitals state their intentions. Its Charter League claims the right to defend African states, negotiate the removal of foreign bases, and admit willing governments under public constitutional clauses. Old colonial relationships, ideological disputes, resource-nationalisation claims, rival continental projects, and South African Allied obligations now shape every answer. Recognition would acknowledge that settlement. Sanctions or an ultimatum would test whether it can survive the old powers acting together."
africa_world_order.1.a: "Recognise the continental settlement"
africa_world_order.1.a.tt: "We formally recognise the African continental settlement and leave the intervention coalition."
africa_world_order.1.b: "Offer recognition with negotiated conditions"
africa_world_order.1.b.tt: "We open negotiations over recognition, trade, security guarantees, and remaining obligations."
africa_world_order.1.c: "Impose sanctions"
africa_world_order.1.c.tt: "We join the sanctions coalition and increase pressure on the African settlement."
africa_world_order.1.e: "Issue an ultimatum"
africa_world_order.1.e.tt: "We demand concessions and begin preparing an expedition if the ultimatum is rejected."

africa_world_order.2.t: "The Scramble Responds"
africa_world_order.2.d: "The proclamation has reached every major capital with interests in Africa. Governments are preparing ambassadorial exchanges, trade guarantees, minority protections, and demands concerning former treaty rights. Colonial ministries are assembling sanctions lists, and military staffs are examining ports and sea lanes. The Charter League must turn continental unity into recognised standing without surrendering the clauses that made unity possible."
africa_world_order.2.a: "Open the recognition campaign"

africa_world_order.3.t: "The First Ultimatum"
africa_world_order.3.d: "A foreign government has placed demands before the Charter League and tied them to a deadline. It seeks privileges over bases, resources, or treaty enforcement that the continental settlement cannot accept unchanged. The League can answer through diplomacy, anti-sanctions preparation, defence mobilisation, or efforts to divide the powers now gathering behind the ultimatum."
africa_world_order.3.a: "Put the ultimatum before the courts"
africa_world_order.3.a.tt: "Scramble actions can answer the issuer, prepare sanctions relief, or strengthen continental defence."

africa_world_order.4.t: "The Intervention Coalition"
africa_world_order.4.d: "Governments that rejected recognition are coordinating sanctions, access to bases, and expedition planning. Their coalition is not united. Commercial interests fear a long blockade, parliaments question the cost of war, and colonial administrations disagree over which concessions matter most. The Charter League can exploit those divisions, but every delay gives military planners more time."
africa_world_order.4.a: "Contest every clause and every port"
africa_world_order.4.a.tt: "The coalition phase remains open until the League advances it or its deadline expires."

africa_world_order.5.t: "Intervention or Settlement"
africa_world_order.5.d: "The crisis has reached its decisive stage. Recognition agreements and withdrawn demands can still produce a settlement. Unanswered ultimatums may instead bring an expedition against the African order. The League must protect its coasts, preserve member consent, and keep a military emergency from becoming permanent constitutional rule."
africa_world_order.5.a: "Prepare the continent and keep negotiation open"
africa_world_order.5.a.tt: "A settlement requires recognition, resolved sanctions and ultimatums, and an end to active intervention war."

africa_world_order.6.t: "After the Scramble"
africa_world_order.6.d: "The immediate intervention threat has receded. The Charter League must account for emergency powers, destroyed infrastructure, member sacrifices, foreign bases, and the obligations created by new alliances. Other continents are beginning to debate their own political settlements. Africa can sponsor those projects, but sponsorship will carry material duties and may create future rivals."
africa_world_order.6.a: "Write the aftermath into public law"
africa_world_order.6.a.tt: "The aftermath remains open while six documented continent packages are installed and the Scramble settlement is complete."

africa_world_order.7.t: "A Recognised Continental Order"
africa_world_order.7.d: "The aftermath settlement has been ratified. Africa enters the new world as a continental actor whose authority rests on its constitution, its member bargains, and the outcome of the Scramble response. Six other continent projects now possess their own institutions and choices. The World-Order Court can pursue treaties among equals, a balance of continental powers, or a rare terminal campaign when all safeguards are met."
africa_world_order.7.a: "Convene the World-Order Court"
africa_world_order.7.a.tt: "World-order routes and continent interactions are available."
africa_world_order.8.t: "The Expedition Coalition Acts"
africa_world_order.8.d: "The Scramble response roster has produced [?africa_scramble_expedition_actor_count|0] expedition leaders. Their governments describe the campaign as treaty enforcement and the defence of bases, resources, and old obligations. The Charter League must answer a coalition whose members can now negotiate, withdraw, or continue the war as their material commitments permit."
africa_world_order.8.a: "The coalition crosses the line"
africa_world_order.8.a.tt: "Coalition members receive expedition matériel and enter the intervention war against the African settlement."

africa_world_order.60.t: "The Continental Defence Breaks"
africa_world_order.60.d: "The intervention coalition has broken the organised defence of [ROOT.GetNameDef]. The original host government survives as the legal center of a constitutional crisis, but its emergency command can no longer claim an undisputed continental mandate. Member settlements, occupied corridors, and foreign demands must be reviewed through a postwar congress."
africa_world_order.60.a: "The constitutional review begins"
africa_world_order.60.a.tt: "The original host is preserved. A fragmentation crisis replaces the defeated continental command until a settlement is reached."

africa_world_order.100.t: "Africa Proclaims a Continental Settlement"
africa_world_order.100.d: "[africa_host.GetNameDef] has announced that Africa will act through a continental settlement built from the Charter League and its negotiated member clauses. Foreign governments are choosing between recognition, conditional treaties, sanctions, and ultimatums."
africa_world_order.100.a: "The old Scramble faces an answer"

africa_world_order.101.t: "An Expedition Sails for Africa"
africa_world_order.101.d: "An intervention coalition has begun military operations against the African continental settlement. Its leaders describe the expedition as treaty enforcement. The Charter League calls it an attempt to restore foreign privilege by force."
africa_world_order.101.a: "The crisis becomes war"

africa_world_order.102.t: "War Between Continental Orders"
africa_world_order.102.d: "Africa and another continent-scale power have entered open war after their congresses failed to produce a settlement. Existing unions and sponsorship debts shape the belligerents, while neutral continental governments decide whether to mediate, align, or prepare for a wider conflict."
africa_world_order.102.a: "The continental balance breaks"
africa_world_order.110.t: "The External Roster Remains Open"
africa_world_order.110.d: "The Scramble settlement has closed without forcing a single continental order onto governments that have not joined it. Recognised governments, unresolved applications, and declared absences remain before the Charter Court for a later diplomatic session."
africa_world_order.110.a: "Publish the roster and continue"

africa_scramble_advance_from_diplomatic_shock: "Advance to Coalition Negotiations"
africa_scramble_advance_from_diplomatic_shock_desc: "Close the first recognition docket and confront the sanctions and ultimatum coalition."
africa_scramble_advance_from_coalition: "Enter the Intervention Settlement"
africa_scramble_advance_from_coalition_desc: "Move from diplomatic coalition building to the final choice between intervention and settlement."
africa_scramble_enter_aftermath: "Convene the Aftermath Congress"
africa_scramble_enter_aftermath_desc: "Record the military and diplomatic outcome and open negotiations over emergency powers, sacrifices, bases, and world standing."
africa_scramble_ratify_aftermath_settlement: "Ratify the Scramble Settlement"
africa_scramble_ratify_aftermath_settlement_desc: "Ratify the completed response and open the World-Order Court after all six continent packages are installed."
africa_scramble_close_continental_docket: "Close the Continental Docket"
africa_scramble_close_continental_docket_desc: "Ratify the recognition, sanctions, ultimatum, expedition, and reconstruction clauses while leaving external continental governments outside the Charter League."
africa_scramble_close_continental_docket_tt: "The Scramble response will be settled. Africa will retain its continental institutions without opening external continent-package or world-order powers."
africa_select_scramble_participant_target: "Open the Dossier on [FROM.GetNameDef]"
africa_select_scramble_participant_target_desc: "Make [FROM.GetNameDef] the active Scramble counterpart. This selection changes no treaty, recognition, or territorial status."
africa_select_scramble_coalition_member_target: "Open a Coalition Dossier on [FROM.GetNameDef]"
africa_select_scramble_coalition_member_target_desc: "Make [FROM.GetNameDef] the active coalition counterpart. The next coalition action can bargain with, sanction, or remove this member from the intervention coalition."

africa_scramble_recognition_window: "Recognition Campaign Deadline"
africa_scramble_recognition_window_desc: "Foreign governments are recording their responses. Secure enough recognition before the docket advances under deadline pressure."
africa_scramble_coalition_window: "Intervention Coalition Deadline"
africa_scramble_coalition_window_desc: "The sanctions and ultimatum coalition is coordinating its demands. Divide it or prepare to meet it in the next phase."
africa_scramble_intervention_window: "Intervention or Settlement Deadline"
africa_scramble_intervention_window_desc: "Resolve sanctions, ultimatums, and expedition preparations before the coalition acts."
africa_scramble_aftermath_window: "Aftermath Congress Deadline"
africa_scramble_aftermath_window_desc: "Complete the settlement and install every required continent package. Unresolved clauses prolong negotiations and increase pressure."

africa_world_choose_charter_of_continents: "A Charter of Continents"
africa_world_choose_charter_of_continents_desc: "Build a voluntary world order from sovereign continental actors, negotiated obligations, withdrawal law, and treaties of equals."
africa_world_choose_balance_of_continents: "A Balance of Continents"
africa_world_choose_balance_of_continents_desc: "Preserve separate continental powers through limited alliances, rivalry rules, crisis congresses, and a managed balance."
africa_world_choose_terminal_continental_campaign: "The Terminal Continental Campaign"
africa_world_choose_terminal_continental_campaign_desc: "Prepare sequential wars against unresolved continent-scale rivals. This rare route can reach The World only after every package is resolved and the complete final presentation is ready."

africa_world_fulfil_sponsorship_obligation: "Fulfil Sponsorship for [FROM.GetNameDef]"
africa_world_fulfil_sponsorship_obligation_desc: "Deliver the equipment, support equipment, convoys, and political commitment promised when [FROM.GetNameDef] accepted African sponsorship."
africa_world_sponsorship_obligation: "Sponsorship Due to [FROM.GetNameDef]"
africa_world_sponsorship_obligation_desc: "Africa promised continuing material support. Default will weaken the sponsored settlement and turn influence into resentment."
africa_world_launch_prepared_war: "Launch the Prepared Continental War"
africa_world_launch_prepared_war_desc: "Begin the planned war against the selected unresolved continental rival. Existing treaty partners and unions are excluded from this war."
africa_world_polity_actions_category: "The Continental Constituent Ledger"
africa_world_polity_actions_category_desc: "Invite frozen constituents, review lawful withdrawal notices, and resolve only the responses that sovereign governments have actually chosen."
africa_world_invite_constituent_to_compact: "Invite [FROM.GetNameDef] to the Compact"
africa_world_invite_constituent_to_compact_desc: "Send [FROM.GetNameDef] a formal invitation. Its government owns the answer: consent, counterterms, or refusal."
africa_world_submit_constituent_withdrawal_notice: "Submit a Withdrawal Notice to [FROM.GetNameDef]"
africa_world_submit_constituent_withdrawal_notice_desc: "Open a [?constant:africa_world_package_protocol.withdrawal_window_days|0]-day lawful withdrawal window and ask [FROM.GetNameDef] to answer with an orderly exit, safeguards, or a contested settlement."
africa_world_coerce_constituent_compact: "Enforce the Compact on [FROM.GetNameDef]"
africa_world_coerce_constituent_compact_desc: "Use coercion only after [FROM.GetNameDef] has refused the invitation or rejected a contested withdrawal settlement. The public ledger records the grievance and authority cost."
africa_world_invitation_cost: "Requires and spends [?constant:africa_world_package_protocol.invitation_pp_cost|0] Political Power."
africa_world_withdrawal_notice_cost: "Requires and spends [?constant:africa_world_package_protocol.withdrawal_notice_pp_cost|0] Political Power."
africa_world_commit_package_successor: "Recognise the Successor of [FROM.GetNameDef]"
africa_world_commit_package_successor_desc: "Record [FROM.GetNameDef] as the reviewed successor path for the package's original actor."
africa_world_certify_package_exile: "Certify the Government-in-Exile Path"
africa_world_certify_package_exile_desc: "Preserve the package through an explicit exile resolution after the original heartland was lost."
africa_world_certify_package_breakup: "Certify the Package Breakup"
africa_world_certify_package_breakup_desc: "Close the package as terminally resolved after its heartland and successor review failed."
africa_select_world_package_candidate_target: "Review the [FROM.GetAdjective] Continental Proposal"
africa_select_world_package_candidate_target_desc: "Make [FROM.GetNameDef] the active sponsorship candidate. Installation still depends on the quoted action, its outcome, and continuing obligations."
africa_select_world_package_actor_target: "Open Continental Talks with [FROM.GetNameDef]"
africa_select_world_package_actor_target_desc: "Make [FROM.GetNameDef] the active continental counterpart for mediation, rivalry, settlement, or post-World administration."

africa_world_order_terminal_presentation_not_ready_tt: "The final proclamation and its public ceremony are not yet ready. The World cannot be declared until every continental negotiation is settled and the closing rites can be presented together."

