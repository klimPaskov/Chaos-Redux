chaosx.nr20.1.t: "Black Plague"

chaosx.news.21.t: "Black Death"
chaosx.news.21.d: "A new outbreak of the bubonic plague, the disease that caused the \"Black Death\" in the Middle Ages, has been reported across the mainland. Health authorities have identified the first known basin and the roads, ports, and railways that may carry the disease onward."
chaosx.news.21.a: "Open the disease board."
