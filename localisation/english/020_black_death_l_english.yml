chaosx.nr20.1.t: "Black Plague"

chaosx.news.21.t: "Black Death"
chaosx.news.21.d: "A new outbreak of the bubonic plague, the disease that caused the \"Black Death\" in the Middle Ages, has been reported across the mainland. The shared disease board records one weighted origin and the routes that may carry it onward."
chaosx.news.21.a: "Open the disease board."
