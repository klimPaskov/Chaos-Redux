# Event Log and Event Details
video_game_in_sweden.evolution.type: "Swedish Campaign Cabinet"
video_game_in_sweden.evolution.1.title: "The Staff College Takes the Board"
video_game_in_sweden.evolution.1.body: "Swedish officers have made the cabinet part of professional culture, with rankings, repeated scenarios, and a growing dispute over what the tables truly measure."
video_game_in_sweden.evolution.2.title: "The Nation Takes Its Turn"
video_game_in_sweden.evolution.2.body: "Clubs, schools, newspapers, and workplaces have turned the Swedish cabinet into a public institution. Evening leagues alter factory shifts, teachers use its campaigns to discuss geography, and political organisers cite its simplified alignments in municipal halls."
video_game_in_sweden.evolution.3.title: "When the Board Directs the Cabinet"
video_game_in_sweden.evolution.3.body: "Senior offices are applying the cabinet's categories to transport, weather, production, diplomacy, and real operations."
video_game_in_sweden.evolution.summary: "Sweden's campaign cabinet moved from a useful instrument toward an authority that sent staff officers, schoolrooms, factory schedules, and diplomatic reports through its categories."
chaosx.event_details.24: "Sweden created an advanced campaign simulation from relay cabinets, projected maps, and printed scenario sheets. The military can use it for training and analysis. If its circulation widens, its categories may pass from staff officers into schoolrooms, factory schedules, and diplomatic files, where a tidy forecast can become an order."
chaosx.events_log.events.na_reason.video_game_in_sweden_host: "N/A: no eligible Swedish government is available to host the campaign cabinet."

# Achievements
024_video_game_in_sweden_reality_check: "Reality Check"
024_video_game_in_sweden_reality_check_desc: "Complete a full Reality Audit in Sweden. Keep Simulation Reliance below Doctrine for [?constant:video_game_in_sweden_event.achievement_reliance_days|0] consecutive days and hold Stockholm."
024_video_game_in_sweden_reality_check_tooltip: "Reach Official authority in Sweden, then complete the full Reality Audit. Keep Simulation Reliance below Doctrine for [?constant:video_game_in_sweden_event.achievement_reliance_days|0] consecutive days after the full report and retain Swedish control of Stockholm. Closing the programme, a partial or failed audit, or a return to Doctrine ends the qualification."
024_video_game_in_sweden_according_to_plan: "According to Plan"
024_video_game_in_sweden_according_to_plan_desc: "Trust the Model, carry its tables into a meaningful war, win before reassessment, hold Stockholm, and complete the mandatory review."
024_video_game_in_sweden_according_to_plan_tooltip: "Use Trust the Model against a major opponent or enter a war against an enemy with more factories and military industry than Sweden before reassessment. Win or force peace before the reassessment deadline, hold Stockholm throughout the surge, and complete the mandatory review. A second term, an opponent that fails the opening test, or a lost capital ends the qualification."

video_game_opening_war: "The country is already at war, and officers want an answer before the next train."
video_game_opening_peace: "The country is at peace, so the Ministry can argue before a real defeat asks for an explanation."
video_game_opening_subject: "The government must consider a superior authority before it can decide the cabinet's use."
video_game_opening_independent: "The government may decide the cabinet's use without a foreign signature."
video_game_opening_stockholm_secure: "Stockholm is held, giving the experiment an administrative centre."
video_game_opening_stockholm_threatened: "Stockholm is not secure, and the cabinet's audience may soon lose its capital."
video_game_opening_world_tension: "World tension stands at [?global.current_world_tension|0] percent, making every office curious about the machine."
video_game_opening_world_tension_unavailable: "The world-tension register is not part of the hearing."
video_game_reassessment_scheduled: "[?video_game_in_sweden_trust_model_reassessment_deadline.GetDateStringNoHour]"
video_game_reassessment_unavailable: "N/A"
video_game_foreign_host_name_resolved: "[video_game_in_sweden_host.GetNameDef]"
video_game_foreign_host_name_fallback: "Sweden"
video_game_foreign_partner_name_resolved: "[video_game_in_sweden_last_partner.GetNameDef]"
video_game_foreign_partner_name_fallback: "the foreign office"
video_game_foreign_outcome_copy: "Its officials have copied the packet and begun adapting its tables to their own files."
video_game_foreign_outcome_study: "Its staff has retained the packet for a military study, with no authority granted to the machine itself."
video_game_foreign_outcome_ban: "Its authorities have banned the packet and placed the papers beyond ordinary circulation."
video_game_foreign_outcome_ridicule: "Its newspapers have ridiculed the packet, which is at least an honest assessment of several diagrams. The editors may regret it if Sweden wins its next war."
video_game_foreign_outcome_no_action: "Its offices have acknowledged the packet and taken no further action."
video_game_foreign_outcome_unknown: "Its offices have returned a reply that the Swedish clerks have not yet classified."
video_game_incident_terrain_clause: "The terrain survey reports that the printed map ignores the actual ground."
video_game_incident_supply_clause: "The quartermasters report that the cabinet has scheduled a movement for trains and stores that do not exist."
video_game_incident_logistics_table_clause: "The quartermasters have checked the cabinet's clean offensive timetable against real train capacity, weather and regional supply, and it collapses in the first week."
video_game_incident_enemy_clause: "An opposing staff has altered its plan after reading the expected Swedish movement."
video_game_incident_enemy_exercise_clause: "The exercise umpires report that the opposing side won by refusing the one scenario every Swedish team has rehearsed."
video_game_incident_template_clause: "Approved formations are appearing in places where commanders need a different arrangement."
video_game_incident_diplomatic_clause: "A foreign office has answered the cabinet's circular with a demand for terms the tables did not record."
video_game_incident_workplace_clause: "Factories are losing skilled hours to a tournament that the production office never authorised."
video_game_incident_party_clause: "Party committees are claiming the board as evidence for a policy that the staff offices did not issue."
video_game_incident_casualties_clause: "A ministry has postponed the reform of the replacement depots because the cabinet returns every lost counter to the box by the next turn."
video_game_incident_counterplan_clause: "A junior officer has beaten a respected staff team at the cabinet by exploiting an assumption that the official scenario treated as fixed."
video_game_incident_bootleg_clause: "An unofficial copy of the Swedish scenario sheets is circulating in a foreign capital before any licence has been issued, complete with errors the staff corrected months ago."
video_game_incident_production_clause: "A cabinet plan has moved production between factories overnight without a single wagon, lorry or dock to carry the parts."
video_game_incident_offensive_clause: "An offensive planned for dry ground, fixed enemy positions and uninterrupted preparation has met wet roads and an opponent who moved."
video_game_incident_unknown_clause: "A field report has arrived from a place where the Swedish cabinet has met a fact outside its tables."
