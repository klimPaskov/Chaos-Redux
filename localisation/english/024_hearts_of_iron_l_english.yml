video_game_foreign_outcome_copy: "Its officials have copied the packet and begun adapting its tables to their own files."
video_game_foreign_outcome_study: "Its staff has retained the packet for a military study, with no authority granted to the machine itself."
video_game_foreign_outcome_ban: "Its authorities have banned the packet and placed the papers beyond ordinary circulation."
video_game_foreign_outcome_ridicule: "Its newspapers have ridiculed the packet, which is at least an honest assessment of several diagrams."
video_game_foreign_outcome_no_action: "Its offices have acknowledged the packet and taken no further action."
video_game_foreign_outcome_unknown: "Its offices have returned a reply that the Swedish clerks have not yet classified."
video_game_incident_terrain_clause: "The terrain survey reports that the printed map ignores the actual ground."
video_game_incident_supply_clause: "The quartermasters report that the cabinet has scheduled a movement for trains and stores that do not exist."
video_game_incident_enemy_clause: "An opposing staff has altered its plan after reading the expected Swedish movement."
video_game_incident_template_clause: "Approved formations are appearing in places where commanders need a different arrangement."
video_game_incident_diplomatic_clause: "A foreign office has answered the cabinet's circular with a demand for terms the tables did not record."
video_game_incident_workplace_clause: "Factories are losing skilled hours to a tournament that the production office never authorised."
video_game_incident_party_clause: "Party committees are claiming the board as evidence for a policy that the staff offices did not issue."
video_game_incident_unknown_clause: "A field report has arrived from a place where the Swedish cabinet has met a fact outside its tables."
