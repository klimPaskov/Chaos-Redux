video_game_route_controlled: "Controlled staff trial"
video_game_route_commercial: "Civilian circulation"
video_game_route_officer: "Competitive officer league"
video_game_route_unavailable: "N/A"
video_game_mission_none: "No active mission"
video_game_mission_field_validation: "Field validation in progress"
video_game_mission_reality_audit: "Reality audit in progress"
video_game_mission_dual_track: "Dual-track verification in progress"
video_game_mission_restriction: "Restriction enforcement in progress"
video_game_logistics_capacity_tt: "A civilian office must be available for the rail-table review."
video_game_field_validation_resources_tt: "The field party needs an army and one supplied training region in §Y$STATE_138$§!, §Y$STATE_141$§!, or §Y$STATE_666$§!, or an active front. $video_game_supplied_region_rule$ At war, the field army must not be short of trains, lorries, or fuel, whichever proof is used. Sweden must own and control Stockholm, with positive train, support-equipment, and fuel reserves after payment."
video_game_supplied_region_rule: "A training region counts while Sweden fully controls it, keeps [?constant:video_game_in_sweden_event.reality_audit_min_divisions_display|0] Swedish divisions there with at least one above [?constant:video_game_in_sweden_supply_proxy.minimum_organization|%0] organisation, and keeps a railway to Stockholm. At war, a Swedish-held state facing enemy ground with an organised Swedish division counts as an active front instead, while Sweden fields more than [?constant:video_game_in_sweden_event.active_front_min_divisions|0] divisions, surrender progress stays below [?constant:video_game_in_sweden_supply_proxy.active_front_surrender_limit|%0], no core state has been lost in the last [?constant:video_game_in_sweden_timing.crisis_memory_days|0] days and the field army is supplied."
video_game_foreign_partner_tt: "An eligible government must be available, at peace with Sweden, and below the [?constant:video_game_in_sweden_event.maximum_foreign_responses|0]-response limit. Only one packet may await a reply at a time. A subject with little autonomy may send packets only to its overlord or faction partners, and packets beyond Sweden's land frontier need a Swedish coast and sea lanes that enemy navies do not command."
video_game_foreign_supply_tt: "The Swedish field army must meet its train, lorry, and fuel needs before a foreign packet can be sent."
video_game_national_league_requirements_tt: "A public league season requires Stability above [?constant:video_game_in_sweden_effect.stable_program_stability|%0]."
video_game_reality_audit_requirements_tt: "To begin, Sweden needs an army and one supplied training region in §Y$STATE_138$§!, §Y$STATE_141$§!, or §Y$STATE_666$§!, or an active front. $video_game_supplied_region_rule$ At war, the field army must not be short of trains, lorries, or fuel, whichever proof is used. Sweden must own and control Stockholm, keep positive train, support-equipment, and fuel reserves after payment, and have Stability above [?constant:video_game_in_sweden_effect.minimum_audit_stability|%0]. A full report also needs all three training regions supplied, or an active front with the Stockholm region supplied, and both the rail-table and independent staff reviews, which can be filed while the audit runs."
video_game_narrow_reality_audit_requirements_tt: "A narrow reassessment requires a failed or partial report and an active Swedish host. After paying the listed costs, keep some trains, support equipment, and fuel in reserve, with Stability above [?constant:video_game_in_sweden_effect.minimum_audit_stability|%0]."
video_game_dual_track_requirements_tt: "No other field or reassessment mission can be active when the dual-track staff opens."
video_game_restrict_use_requirements_tt: "Issue the order during the official-authority phase when no review mission is active."
video_game_trust_model_requirements_tt: "Trust the Model requires Stability above [?constant:video_game_in_sweden_effect.stable_program_stability|%0] during war or [?constant:video_game_in_sweden_effect.public_program_stability|%0] during peace, with surrender progress below [?constant:video_game_in_sweden_effect.maximum_risk_surrender_progress|%0]. A severe campaign crisis blocks the order, as do a wartime shortage of trains, lorries, or fuel, and an earlier review that found the cabinet wanting."

# Baseline and evolution decisions
video_game_controlled_exercise: "Conduct a Controlled Staff Exercise"
video_game_controlled_exercise_desc: "Referees compare the cabinet's timetable with field reports and examine each discrepancy in the debrief. Simulation Reliance falls by §G[GetVideoGameExerciseDebriefLoss]§!, and for [?constant:video_game_in_sweden_timing.exercise_benefit_days|0] days the staff gains up to §G+[?constant:video_game_in_sweden_package.exercise_planning|%0]§! planning speed and §G[?constant:video_game_in_sweden_package.exercise_training|%0]§! faster army training. Repeating the exercise under the same war conditions teaches half as much each time, down to a quarter, until Sweden enters or leaves a war."
video_game_exercise_debrief_loss_value: "[?video_game_exercise_debrief_loss|0]"
video_game_controlled_exercise_cost: "£army_experience [?constant:video_game_in_sweden_cost.controlled_exercise_army_experience|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.controlled_exercise_support_equipment|0]  £fuel_texticon [?constant:video_game_in_sweden_cost.controlled_exercise_fuel|0]"
video_game_controlled_exercise_cost_blocked: "£army_experience §R[?constant:video_game_in_sweden_cost.controlled_exercise_army_experience|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.controlled_exercise_support_equipment|0]§!  £fuel_texticon §R[?constant:video_game_in_sweden_cost.controlled_exercise_fuel|0]§!"
video_game_controlled_exercise_cost_tooltip: "Repeated scenarios provide fewer fresh lessons. Referees require a debrief after every session and keep the exercise within its review interval."
video_game_logistics_module: "Audit the Rail Table"
video_game_logistics_module_desc: "Reserve a civilian office to compare the cabinet's transport assumptions with trains, lorries, and support stores. For [?constant:video_game_in_sweden_timing.logistics_benefit_days|0] days, supply consumption §G[?constant:video_game_in_sweden_package.logistics_supply|%0]§!. Staff routes treat the review as an admission of earlier simplifications and lower Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.logistics_review_loss|0]§!, while publishers sell it as proof of realism and raise it by §R+[?constant:video_game_in_sweden_reliance.logistics_marketing_gain|0]§!."
video_game_logistics_module_cost: "£train_texticon [?constant:video_game_in_sweden_cost.logistics_module_trains|0]  £motorized_equipment_text_icon [?constant:video_game_in_sweden_cost.logistics_module_trucks|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.logistics_module_support_equipment|0]"
video_game_logistics_module_cost_blocked: "£train_texticon §R[?constant:video_game_in_sweden_cost.logistics_module_trains|0]§!  £motorized_equipment_text_icon §R[?constant:video_game_in_sweden_cost.logistics_module_trucks|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.logistics_module_support_equipment|0]§!"
video_game_logistics_module_cost_tooltip: "Cost: £train_texticon [?constant:video_game_in_sweden_cost.logistics_module_trains|0]  £motorized_equipment_text_icon [?constant:video_game_in_sweden_cost.logistics_module_trucks|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.logistics_module_support_equipment|0]  £civ_factory [?constant:video_game_in_sweden_cost.logistics_module_civilian_factory|0] for [?constant:video_game_in_sweden_timing.baseline_repeat_cooldown_days|0] days. The office compares the rail tables with actual lorries and stores."
video_game_expand_access: "Widen the Cabinet's Circle"
video_game_expand_access_desc: "[GetVideoGameExpandAccessDesc]"
video_game_expand_access_civilian_desc: "Send the cabinet beyond the staff room through schools, clubs, and public lectures. The public reach this creates is what a national craze grows from, and Simulation Reliance rises by §R+[?constant:video_game_in_sweden_reliance.expand_access_gain|0]§!."
video_game_expand_access_officer_desc: "Formalise the officers' contest as an army league with official rankings, without opening it to the public. While the programme runs, commanders gain §G+[?constant:video_game_in_sweden_package.league_planning|%0]§! planning speed and §G+[?constant:video_game_in_sweden_package.league_army_xp|%0]§! army experience gain, one serving commander has a [?constant:video_game_in_sweden_award.commander_chance_officer_league|0]% chance to become a §YRulebook Commander§!, and Simulation Reliance rises by §R+[?constant:video_game_in_sweden_reliance.expand_access_gain|0]§!."
video_game_expand_access_press_desc: "Publish the officer league tables in the newspapers. Clubs and schools take up the rankings, giving the cabinet the public reach a national craze grows from, and Simulation Reliance rises by §R+[?constant:video_game_in_sweden_reliance.expand_access_gain|0]§!."
video_game_expand_access_cost: "£pol_power [?constant:video_game_in_sweden_cost.expand_access_political_power|0]  £army_experience [?constant:video_game_in_sweden_cost.expand_access_army_experience|0]"
video_game_expand_access_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.expand_access_political_power|0]§!  £army_experience §R[?constant:video_game_in_sweden_cost.expand_access_army_experience|0]§!"
video_game_expand_access_cost_tooltip: "Each widening raises Simulation Reliance. The officer route formalises its league before it publishes the tables, while the other routes go straight to public circulation."
video_game_conclude_trial: "Conclude the Trial"
video_game_conclude_trial_desc: "Close the trial after its review and leave the useful papers with the officers, publishers, or clubs that ran it."

video_game_rules_revision: "Revise the Referee's Book"
video_game_rules_revision_desc: "Rewrite the assumptions that reward narrow behaviour. Each revision adds §G+[?constant:video_game_in_sweden_package.rules_planning|%0]§! maximum planning and §R[?constant:video_game_in_sweden_package.rules_adaptability|%0]§! terrain adaptation, for up to [?constant:video_game_in_sweden_package.rules_max_stack|0] revisions. Simulation Reliance rises by §R+[?constant:video_game_in_sweden_reliance.rules_revision_gain|0]§!, or by §R+[?constant:video_game_in_sweden_reliance.rules_revision_validated_gain|0]§! once a field validation or an independent red team has tested the rules, which also halves the adaptation cost. An official auxiliary doctrine halves the Reliance gain. Each revision requires a larger staff levy."
video_game_rules_revision_cost: "£army_experience [?video_game_in_sweden_rules_revision_army_experience|0]  £command_power [?video_game_in_sweden_rules_revision_command_power|0]"
video_game_rules_revision_cost_blocked: "£army_experience §R[?video_game_in_sweden_rules_revision_army_experience|0]§!  £command_power §R[?video_game_in_sweden_rules_revision_command_power|0]§!"
video_game_rules_revision_cost_tooltip: "Each revision raises Simulation Reliance and increases the staff levy for the next revision."
video_game_field_validation: "Send a Field Validation Party"
video_game_field_validation_desc: "Commit a staffed field party to compare the cabinet with real terrain, transport, and formations. Opening the party lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.field_validation_loss|0]§!. A full report lowers it again and shortens army training by §G[?constant:video_game_in_sweden_package.field_training|%0]§! for [?constant:video_game_in_sweden_timing.field_training_days|0] days, while terrain mismatches and mismatch reports in general become rarer. The report may validate the method, limit it, or close the exercise."
video_game_field_validation_cost: "£fuel_texticon [?constant:video_game_in_sweden_cost.field_validation_fuel|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.field_validation_support_equipment|0]  £train_texticon [?constant:video_game_in_sweden_cost.field_validation_trains|0]"
video_game_field_validation_cost_blocked: "£fuel_texticon §R[?constant:video_game_in_sweden_cost.field_validation_fuel|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.field_validation_support_equipment|0]§!  £train_texticon §R[?constant:video_game_in_sweden_cost.field_validation_trains|0]§!"
video_game_field_validation_cost_tooltip: "Payment: £fuel_texticon [?constant:video_game_in_sweden_cost.field_validation_fuel|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.field_validation_support_equipment|0]  £train_texticon [?constant:video_game_in_sweden_cost.field_validation_trains|0]  £army_experience [?constant:video_game_in_sweden_cost.field_validation_army_experience|0]. Keep some trains, support equipment, and fuel in stock during the proof period. A failed report does not return the payment."
video_game_targeted_followup: "Hold a Targeted Follow-Up Review"
video_game_targeted_followup_desc: "A smaller field party re-tests the findings of the last field validation for [?constant:video_game_in_sweden_timing.followup_review_days|0] days. If a supplied training region or an active front, Stockholm, and supply still hold at the end, a partial report becomes a full validation and Simulation Reliance falls by §G-[?constant:video_game_in_sweden_reliance.followup_partial_loss|0]§!, or a failed report becomes partial and Simulation Reliance falls by §G-[?constant:video_game_in_sweden_reliance.followup_failed_loss|0]§!. Either way, Unresolved Field Findings are cleared."
video_game_targeted_followup_cost: "£army_experience [?constant:video_game_in_sweden_cost.followup_army_experience|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.followup_support_equipment|0]"
video_game_targeted_followup_cost_blocked: "£army_experience §R[?constant:video_game_in_sweden_cost.followup_army_experience|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.followup_support_equipment|0]§!"
video_game_targeted_followup_cost_tooltip: "The re-test draws on fresh staff time and support stores. A failed re-test does not return the payment."
video_game_targeted_followup_region_tt: "A supplied training region or an active front is ready for the re-test."
video_game_red_team: "Commission an Independent Red Team"
video_game_red_team_desc: "Give a separate staff the task of finding cases where the cabinet rewards the wrong behaviour. Their objections lower Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.red_team_loss|0]§! and make the opposing side less predictable: §G+[?constant:video_game_in_sweden_package.red_team_adaptability|%0]§! terrain adaptation and §R-[?constant:video_game_in_sweden_package.red_team_planning_cost|%0]§! planning speed while the programme runs. Reports of opponents leaving the cabinet's script stop arriving, and other mismatch reports arrive less often."
video_game_red_team_cost: "£pol_power [?constant:video_game_in_sweden_cost.red_team_political_power|0]  £army_experience [?constant:video_game_in_sweden_cost.red_team_army_experience|0]"
video_game_red_team_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.red_team_political_power|0]§!  £army_experience §R[?constant:video_game_in_sweden_cost.red_team_army_experience|0]§!"
video_game_red_team_cost_tooltip: "A separate staff may object without owning the original table."
video_game_officer_league: "Hold an Officer League"
video_game_officer_league_desc: "Turn repeated scenarios into a professional contest. While the programme runs, commanders gain §G+[?constant:video_game_in_sweden_package.league_planning|%0]§! planning speed and §G+[?constant:video_game_in_sweden_package.league_army_xp|%0]§! army experience gain, and one serving commander may emerge as a Rulebook Commander. The rankings raise Simulation Reliance by §R+[?constant:video_game_in_sweden_reliance.officer_league_gain|0]§! and make the cabinet harder to question, so mismatch reports arrive more often."
video_game_officer_league_cost: "£command_power [?constant:video_game_in_sweden_cost.officer_league_command_power|0]  £army_experience [?constant:video_game_in_sweden_cost.officer_league_army_experience|0]"
video_game_officer_league_cost_blocked: "£command_power §R[?constant:video_game_in_sweden_cost.officer_league_command_power|0]§!  £army_experience §R[?constant:video_game_in_sweden_cost.officer_league_army_experience|0]§!"
video_game_officer_league_cost_tooltip: "The league makes its rankings part of professional standing."

video_game_national_league: "Open a National League Season"
video_game_national_league_desc: "Give public clubs a regular season with newspapers, halls, and a national table. The first season raises Simulation Reliance by §R+[?constant:video_game_in_sweden_reliance.national_league_gain|0]§!, later seasons by §R+[?constant:video_game_in_sweden_reliance.national_league_repeat_gain|0]§!. Each season adds §R-[?constant:video_game_in_sweden_package.public_season_output_cost|%1]§! factory output to the public costs while the craze lasts, for up to [?constant:video_game_in_sweden_package.public_season_stack_max|0] seasons, and occupies a civilian office for its stated term."
video_game_national_league_cost: "£pol_power [?constant:video_game_in_sweden_cost.national_league_political_power|0]  £civ_factory [?constant:video_game_in_sweden_cost.national_league_civilian_factory|0]"
video_game_national_league_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.national_league_political_power|0]§!  £civ_factory §R[?constant:video_game_in_sweden_cost.national_league_civilian_factory|0]§!"
video_game_national_league_cost_tooltip: "One civilian office is reserved for [?video_game_in_sweden_national_league_native_days|0] days. Each completed reservation lengthens the next season's administrative work, up to [?constant:video_game_in_sweden_timing.national_league_max_burden_days|0] days."
video_game_protect_shifts: "Protect the Factory Shifts"
video_game_protect_shifts_desc: "Move public lessons away from working hours. The arrangement cuts the factory output cost of the craze by §G[?constant:video_game_in_sweden_package.protect_shifts_output_cut|%0]§!, lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.protect_shifts_loss|0]§!, and carries a temporary civilian cost."
video_game_protect_shifts_cost: "£pol_power [?constant:video_game_in_sweden_cost.protect_shifts_political_power|0]  £civ_factory [?constant:video_game_in_sweden_cost.protect_shifts_civilian_factory|0]"
video_game_protect_shifts_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.protect_shifts_political_power|0]§!  £civ_factory §R[?constant:video_game_in_sweden_cost.protect_shifts_civilian_factory|0]§!"
video_game_protect_shifts_cost_tooltip: "One civilian office is reserved for [?constant:video_game_in_sweden_timing.protect_shifts_burden_days|0] days to move league meetings outside working hours."
video_game_preparedness_clubs: "Give the Clubs a Preparedness Charter"
video_game_preparedness_clubs_desc: "Give local clubs a bounded civic task in first aid, maps, and preparedness. While the programme runs, recruitable population rises by §G+[?constant:video_game_in_sweden_package.preparedness_recruitable|%0]§! and the factory output cost of the craze falls by §G[?constant:video_game_in_sweden_package.preparedness_output_cut|%0]§!. Their work raises Simulation Reliance by §R+[?constant:video_game_in_sweden_reliance.preparedness_clubs_gain|0]§!."
video_game_preparedness_clubs_cost: "£pol_power [?constant:video_game_in_sweden_cost.preparedness_clubs_political_power|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.preparedness_clubs_support_equipment|0]"
video_game_preparedness_clubs_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.preparedness_clubs_political_power|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.preparedness_clubs_support_equipment|0]§!"
video_game_preparedness_clubs_cost_tooltip: "The charter leaves the clubs useful when the campaign map is put away."
video_game_foreign_licenses: "Offer a Foreign Licence"
video_game_foreign_licenses_desc: "Send a limited Swedish packet to one eligible foreign government. Licence fees and press attention give Swedish trade §G+[?constant:video_game_in_sweden_package.licence_trade_opinion|%0]§! trade opinion for [?constant:video_game_in_sweden_timing.licence_benefit_days|0] days. The Foreign Office may approach only [?constant:video_game_in_sweden_event.maximum_foreign_responses|0] governments, one at a time, and retain [?constant:video_game_in_sweden_event.maximum_visible_foreign_reports|0] replies in its file. A foreign office may copy, study, ban, ridicule, or ignore the packet. Sweden's cabinet remains under its own staff."
video_game_foreign_licenses_cost: "£convoy_texticon [?constant:video_game_in_sweden_cost.foreign_licenses_convoys|0]  £pol_power [?constant:video_game_in_sweden_cost.foreign_licenses_political_power|0]  £civ_factory [?constant:video_game_in_sweden_cost.foreign_licenses_civilian_factory|0]"
video_game_foreign_licenses_cost_blocked: "£convoy_texticon §R[?constant:video_game_in_sweden_cost.foreign_licenses_convoys|0]§!  £pol_power §R[?constant:video_game_in_sweden_cost.foreign_licenses_political_power|0]§!  £civ_factory §R[?constant:video_game_in_sweden_cost.foreign_licenses_civilian_factory|0]§!"
video_game_foreign_licenses_cost_tooltip: "One civilian office is reserved for [?constant:video_game_in_sweden_timing.foreign_license_burden_days|0] days. Each recipient can be approached once, and another packet must wait until the current reply is filed."
video_game_separate_policy: "Separate the Public Policy"
video_game_separate_policy_desc: "Draw a firm line between public instruction and military orders. Clubs keep playing, but ministries and senior commands may no longer cite their results. The decision lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.separate_policy_loss|0]§!, cuts the political-attention cost of the craze by §G[?constant:video_game_in_sweden_package.separate_policy_attention_cut|%0]§!, holds the next stage back by [?constant:video_game_in_sweden_timing.separate_policy_evolution_delay_days|0] days, and draws political opposition."
video_game_separate_policy_cost: "£pol_power [?constant:video_game_in_sweden_cost.separate_policy_political_power|0]  £stability_texticon [?constant:video_game_in_sweden_cost.separate_policy_stability_cost_display|0]%"
video_game_separate_policy_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.separate_policy_political_power|0]§!  £stability_texticon §R[?constant:video_game_in_sweden_cost.separate_policy_stability_cost_display|0]%§!"
video_game_separate_policy_cost_tooltip: "Opening charges: £pol_power [?constant:video_game_in_sweden_cost.separate_policy_political_power|0]  £stability_texticon [?constant:video_game_in_sweden_cost.separate_policy_stability_cost_display|0]%. The Stability payment reflects the public reaction to the new boundary."

video_game_begin_reality_audit: "Begin the Reality Audit"
video_game_begin_reality_audit_desc: "Send divisions, stores, and staff officers to test the cabinet against real fronts, roads, and supply work. Opening a full audit lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.reality_audit_full|0]§!. The report must answer to all three Swedish field regions, or to an active front and the Stockholm region, and its rail-table and adjudicator reviews can be filed while the parties are in the field."
video_game_reality_audit_cost: "£army_experience [?constant:video_game_in_sweden_cost.reality_audit_army_experience|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.reality_audit_support_equipment|0]  £fuel_texticon [?constant:video_game_in_sweden_cost.reality_audit_fuel|0]"
video_game_reality_audit_cost_blocked: "£army_experience §R[?constant:video_game_in_sweden_cost.reality_audit_army_experience|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.reality_audit_support_equipment|0]§!  £fuel_texticon §R[?constant:video_game_in_sweden_cost.reality_audit_fuel|0]§!"
video_game_reality_audit_cost_tooltip: "Payment: £army_experience [?constant:video_game_in_sweden_cost.reality_audit_army_experience|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.reality_audit_support_equipment|0]  £fuel_texticon [?constant:video_game_in_sweden_cost.reality_audit_fuel|0]  £train_texticon [?constant:video_game_in_sweden_cost.reality_audit_trains|0]. Keep some trains, support equipment, and fuel in stock during the field proof. A disrupted audit produces a partial or failed report."
video_game_narrow_reality_audit: "Conduct a Narrow Reassessment"
video_game_narrow_reality_audit_desc: "After a poor report, send a smaller party to the front with a shorter list of questions. Opening it lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_award.narrow_reality_audit_loss|0]§! and can restore useful practice. The filed report remains part of the record."
video_game_narrow_reality_audit_cost: "£army_experience [?constant:video_game_in_sweden_cost.narrow_reality_audit_army_experience|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.narrow_reality_audit_support_equipment|0]  £fuel_texticon [?constant:video_game_in_sweden_cost.narrow_reality_audit_fuel|0]"
video_game_narrow_reality_audit_cost_blocked: "£army_experience §R[?constant:video_game_in_sweden_cost.narrow_reality_audit_army_experience|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.narrow_reality_audit_support_equipment|0]§!  £fuel_texticon §R[?constant:video_game_in_sweden_cost.narrow_reality_audit_fuel|0]§!"
video_game_narrow_reality_audit_cost_tooltip: "Payment: £army_experience [?constant:video_game_in_sweden_cost.narrow_reality_audit_army_experience|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.narrow_reality_audit_support_equipment|0]  £fuel_texticon [?constant:video_game_in_sweden_cost.narrow_reality_audit_fuel|0]  £train_texticon [?constant:video_game_in_sweden_cost.narrow_reality_audit_trains|0]. Keep some trains, support equipment, and fuel in stock during the shorter proof. This recovery attempt does not erase the earlier finding."
video_game_advanced_logistics_review: "Review the Audit's Rail Movements"
video_game_advanced_logistics_review_desc: "Engineers set the audit's actual train and lorry movements beside the cabinet's transport tables, depot by depot. The review files the rail-table proof a full report needs and lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.logistics_review_loss|0]§!."
video_game_advanced_logistics_review_cost: "£train_texticon [?constant:video_game_in_sweden_cost.advanced_logistics_trains|0]  £motorized_equipment_text_icon [?constant:video_game_in_sweden_cost.advanced_logistics_trucks|0]  £civ_factory [?constant:video_game_in_sweden_cost.advanced_logistics_civilian_factory|0]"
video_game_advanced_logistics_review_cost_blocked: "£train_texticon §R[?constant:video_game_in_sweden_cost.advanced_logistics_trains|0]§!  £motorized_equipment_text_icon §R[?constant:video_game_in_sweden_cost.advanced_logistics_trucks|0]§!  £civ_factory §R[?constant:video_game_in_sweden_cost.advanced_logistics_civilian_factory|0]§!"
video_game_advanced_logistics_review_cost_tooltip: "Cost: £train_texticon [?constant:video_game_in_sweden_cost.advanced_logistics_trains|0]  £motorized_equipment_text_icon [?constant:video_game_in_sweden_cost.advanced_logistics_trucks|0]. One civilian office is reserved for [?constant:video_game_in_sweden_timing.advanced_logistics_burden_days|0] days."
video_game_independent_adjudicators: "Seat Independent Adjudicators"
video_game_independent_adjudicators_desc: "Officers from outside the cabinet's staff take the opposing side in every audit scenario and may overrule the printed tables. Their findings file the independent review a full report needs and lower Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.red_team_loss|0]§!."
video_game_independent_adjudicators_cost: "£pol_power [?constant:video_game_in_sweden_cost.adjudicators_political_power|0]  £army_experience [?constant:video_game_in_sweden_cost.adjudicators_army_experience|0]"
video_game_independent_adjudicators_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.adjudicators_political_power|0]§!  £army_experience §R[?constant:video_game_in_sweden_cost.adjudicators_army_experience|0]§!"
video_game_independent_adjudicators_cost_tooltip: "The adjudicators answer to the audit office, not to the staff that built the scenarios."
video_game_dual_track: "Establish a Dual-Track Staff"
video_game_dual_track_desc: "Require every simulated plan to have an independent staff plan built from roads, stores, weather, and field reports. Simulation Reliance falls to at most §Y[?constant:video_game_in_sweden_reliance.doctrine_max|0]§! (Doctrine), and temporary planning support continues during verification. The comparison staff must then draw up its own plans and resolve their differences with the cabinet."
video_game_dual_track_cost: "£army_experience [?constant:video_game_in_sweden_cost.dual_track_army_experience|0]  £command_power [?constant:video_game_in_sweden_cost.dual_track_command_power|0]  £civ_factory [?constant:video_game_in_sweden_cost.dual_track_civilian_factory|0]"
video_game_dual_track_cost_blocked: "£army_experience §R[?constant:video_game_in_sweden_cost.dual_track_army_experience|0]§!  £command_power §R[?constant:video_game_in_sweden_cost.dual_track_command_power|0]§!  £civ_factory §R[?constant:video_game_in_sweden_cost.dual_track_civilian_factory|0]§!"
video_game_dual_track_cost_tooltip: "One civilian office is reserved for [?constant:video_game_in_sweden_timing.dual_track_burden_days|0] days to establish the independent comparison staff. Verification continues after that reservation ends."
video_game_dual_track_independent_plans: "Commission Independent Staff Plans"
video_game_dual_track_independent_plans_desc: "The conventional staff draws up its own plan for the same operations from field reports, without access to the cabinet. Verification cannot pass until both plans exist."
video_game_dual_track_independent_plans_cost: "£army_experience [?constant:video_game_in_sweden_cost.dual_track_plans_army_experience|0]  £command_power [?constant:video_game_in_sweden_cost.dual_track_plans_command_power|0]"
video_game_dual_track_independent_plans_cost_blocked: "£army_experience §R[?constant:video_game_in_sweden_cost.dual_track_plans_army_experience|0]§!  £command_power §R[?constant:video_game_in_sweden_cost.dual_track_plans_command_power|0]§!"
video_game_dual_track_independent_plans_cost_tooltip: "The conventional staff needs its own officers and senior command attention to plan without the cabinet."
video_game_dual_track_resolve_differences: "Resolve the Differences Between the Plans"
video_game_dual_track_resolve_differences_desc: "The two staffs set their plans side by side, list every assumption on which they differ, and settle each one against roads, stores, weather, and field reports. Simulation Reliance falls by §G-[?constant:video_game_in_sweden_reliance.dual_track_resolve_loss|0]§!. Verification cannot pass until the differences are resolved."
video_game_dual_track_resolve_differences_cost: "£pol_power [?constant:video_game_in_sweden_cost.dual_track_resolve_political_power|0]  £army_experience [?constant:video_game_in_sweden_cost.dual_track_resolve_army_experience|0]"
video_game_dual_track_resolve_differences_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.dual_track_resolve_political_power|0]§!  £army_experience §R[?constant:video_game_in_sweden_cost.dual_track_resolve_army_experience|0]§!"
video_game_dual_track_resolve_differences_cost_tooltip: "Settling each difference takes ministerial attention and staff time."
video_game_restrict_use: "Issue an Official Restriction"
video_game_restrict_use_desc: "Restrict the cabinet to instruction and historical study. Opening the restriction lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.restriction_loss|0]§!. Operational orders must name their real roads, stores, weather, and human responsibilities."
video_game_restrict_use_cost: "£pol_power [GetVideoGameRestrictionPoliticalPowerCost]  £stability_texticon [GetVideoGameRestrictionStabilityCost]"
video_game_restrict_use_cost_blocked: "£pol_power §R[GetVideoGameRestrictionPoliticalPowerCost]§!  £stability_texticon §R[GetVideoGameRestrictionStabilityCost]§!"
video_game_restrict_use_cost_tooltip: "Payment: £pol_power [GetVideoGameRestrictionPoliticalPowerCost]  £stability_texticon [GetVideoGameRestrictionStabilityCost]  £war_support_icon [GetVideoGameRestrictionWarSupportCost]. The closing office draws each charge from the reserve still at hand, so the order can be issued with exhausted reserves. After enforcement, resentment reduces £stability_texticon Stability by [?constant:video_game_in_sweden_cost.backlash_stability_display|0] percentage points for [?constant:video_game_in_sweden_timing.backlash_days|0] days. After a failed field validation, Reality Audit, or dual-track verification, every charge is cut to [?constant:video_game_in_sweden_effect.restriction_failure_fee_factor|%0] of its usual size."
video_game_restriction_political_power_quote_whole: "[?video_game_in_sweden_restriction_political_power_quote|0]"
video_game_restriction_political_power_quote_value: "[?video_game_in_sweden_restriction_political_power_quote|5]"
video_game_restriction_stability_quote_value: "[?video_game_in_sweden_restriction_stability_quote|%3]"
video_game_restriction_war_support_quote_value: "[?video_game_in_sweden_restriction_war_support_quote|%3]"
video_game_trust_model: "Trust the Model"
video_game_trust_model_desc: "Let the cabinet's forecasts direct military planning for up to [?constant:video_game_in_sweden_timing.trust_model_days|0] days. Simulation Reliance rises to §R[?constant:video_game_in_sweden_value.maximum|0]§!, strengthening planning, army experience, and war support (§G+[?constant:video_game_in_sweden_effect.trust_war_support|%0]§!) at the cost of supply, recovery, and political attention. The government must reassess the programme when the term ends or a campaign crisis intervenes. A victory over the chosen opponent before the deadline lowers Simulation Reliance by a further §G-[?constant:video_game_in_sweden_reliance.trust_victory_relief|0]§! when the reassessment opens."
video_game_trust_model_cost: "£command_power [?constant:video_game_in_sweden_cost.trust_model_command_power|0]  £pol_power [?constant:video_game_in_sweden_cost.trust_model_political_power|0]  £stability_texticon [?constant:video_game_in_sweden_cost.trust_model_stability_loss_display|0]%"
video_game_trust_model_cost_blocked: "£command_power §R[?constant:video_game_in_sweden_cost.trust_model_command_power|0]§!  £pol_power §R[?constant:video_game_in_sweden_cost.trust_model_political_power|0]§!  £stability_texticon §R[?constant:video_game_in_sweden_cost.trust_model_stability_loss_display|0]%§!"
video_game_trust_model_cost_tooltip: "Cost: £command_power [?constant:video_game_in_sweden_cost.trust_model_command_power|0]  £pol_power [?constant:video_game_in_sweden_cost.trust_model_political_power|0]  £stability_texticon [?constant:video_game_in_sweden_cost.trust_model_stability_loss_display|0]%  £war_support_icon [?constant:video_game_in_sweden_cost.trust_model_war_support_loss_display|0]%. The cabinet receives one final authority for one term, and must be reassessed."

# Missions
video_game_field_validation_mission_requirements_tt: "Keep one supplied training region in §Y$STATE_138$§!, §Y$STATE_141$§!, or §Y$STATE_666$§!, or an active front, for [?constant:video_game_in_sweden_timing.field_validation_proof_days|0] days. $video_game_supplied_region_rule$ Own and control Stockholm, retain positive train, support-equipment, and fuel reserves, and complete either the rail-table or independent staff review. A recorded interruption or a Swedish core state lost during the exercise limits the report to a partial finding. Losing Stockholm or [?constant:video_game_in_sweden_event.several_core_losses|0] core states ends the exercise in failure."
video_game_field_validation_mission: "Field Validation"
video_game_field_validation_mission_desc: "$video_game_field_validation_mission_requirements_tt$"
video_game_reality_audit_mission: "Reality Audit"
video_game_reality_audit_mission_desc: "[GetVideoGameAuditProofRequirements]"
video_game_reality_audit_regions_tt: "[GetVideoGameAuditProofRequirements]"
video_game_full_audit_proof_requirements: "Keep all three training regions, §Y$STATE_138$§!, §Y$STATE_141$§!, and §Y$STATE_666$§!, supplied, or an active front with §Y$STATE_141$§! supplied, for [?constant:video_game_in_sweden_timing.reality_audit_proof_days|0] days. $video_game_supplied_region_rule$ Own and control Stockholm, retain positive train, support-equipment, and fuel reserves, and file both staff reviews. A recorded loss of reserves, transport, or regional presence, a missing review, or one Swedish core state lost during the audit limits the report to a partial finding. Losing Stockholm or [?constant:video_game_in_sweden_event.several_core_losses|0] core states ends the audit in failure."
video_game_narrow_audit_proof_requirements: "Keep one supplied training region in §Y$STATE_138$§!, §Y$STATE_141$§!, or §Y$STATE_666$§!, or an active front, for [?constant:video_game_in_sweden_timing.narrow_reality_audit_proof_days|0] days. $video_game_supplied_region_rule$ Own and control Stockholm, retain positive train, support-equipment, and fuel reserves, and file both staff reviews for a full finding. Losing Stockholm or [?constant:video_game_in_sweden_event.several_core_losses|0] core states ends the reassessment in failure. This shorter reassessment does not erase the earlier report."
video_game_dual_track_mission_requirements_tt: "Hold Stockholm and keep the field army supplied for [?constant:video_game_in_sweden_timing.dual_track_proof_days|0] days, commission independent staff plans, and resolve their differences with the cabinet. Without both comparisons, verification fails when its time runs out and leaves the choice between a Reality Audit and an official restriction."
video_game_restriction_mission_requirements_tt: "Complete the league closures, policy exclusions, and withdrawal of public playing rooms over [?constant:video_game_in_sweden_timing.restriction_proof_days|0] days. Enforcement requires no further payment."
video_game_mission_lost_ground_tt: "Stockholm or [?constant:video_game_in_sweden_event.several_core_losses|0] Swedish core states have been lost since this work began"
video_game_program_ended_tt: "Sweden no longer runs the campaign cabinet, this stage of the trial has been switched off in the event settings, or the world has ended"
video_game_host_lost_tt: "Sweden no longer runs the campaign cabinet"
video_game_dual_track_verification: "Dual-Track Verification"
video_game_dual_track_verification_desc: "$video_game_dual_track_mission_requirements_tt$"
video_game_restriction_enforcement: "Restriction Enforcement"
video_game_restriction_enforcement_desc: "The Ministry first closes its officer leagues, then requires policy papers to cite field reports, and finally returns the public rooms to their municipal custodians. Each department reports to the restriction office when its part is done. No further payment is required."
video_game_in_sweden_restriction_backlash: "Resentment over the Closing Notices"
video_game_in_sweden_restriction_backlash_desc: "The official leagues have closed and the municipal rooms have been returned. Their former committees continue to dispute the Ministry's account of the proceedings."

