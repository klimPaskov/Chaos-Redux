video_game_experimental_war_game: "Experimental War Game"
video_game_experimental_war_game_desc: "Relay cabinets and punched cards turn campaign reports into a disciplined Swedish experiment."
video_game_gamified_staff_culture: "Competitive Staff Culture"
video_game_gamified_staff_culture_desc: "Staff colleges measure professional prestige by the result of a printed campaign."
video_game_national_strategy_craze: "National Strategy Craze"
video_game_national_strategy_craze_desc: "Public halls, newspapers, and clubs have made strategic play a national institution."
video_game_simulation_orthodoxy: "Simulation Orthodoxy"
video_game_simulation_orthodoxy_desc: "Senior offices consult the cabinet as though its categories were the country itself."
video_game_validated_wargaming_methods: "Validated Wargaming Methods"
video_game_validated_wargaming_methods_desc: "A finite recovery office keeps the useful method and requires every table to answer to the field."
video_game_in_sweden_rulebook_commander: "Rulebook Commander"
video_game_in_sweden_rulebook_commander_desc: "This commander has mastered the cabinet's printed assumptions and is eager to apply them."

