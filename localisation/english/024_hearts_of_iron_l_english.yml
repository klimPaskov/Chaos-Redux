l_english:
chaosx.nr24.1.t: "Video Game in Sweden"

chaosx.nr24.2.t: "The Cabinet for Campaigns"
chaosx.nr24.2.d: "A Swedish workshop has built a remarkable war game from relay cabinets, punched cards, and a projected map. [GetVideoGameOpeningWarStatus] [GetVideoGameOpeningGovernmentStatus] [GetVideoGameOpeningStockholmStatus] [GetVideoGameOpeningWorldTension] The apparatus arranges geography, factories, supply columns, armies, and political alignments with unsettling confidence. The engineers request a hearing before the Ministry assigns it to staff officers, schools, or an officers' contest."
chaosx.nr24.2.a: "Place it under staff supervision."
chaosx.nr24.2.b: "Issue it through schools and publishers."
chaosx.nr24.2.c: "Let the officers compete."
video_game_opening_controlled_tt: "Simulation Reliance starts at §Y[?constant:video_game_in_sweden_reliance.controlled_start|0]§! (Instrument). The army gains £army_experience [?constant:video_game_in_sweden_award.controlled_opening_army_experience|0] experience, and while the programme runs, army training is §G[?constant:video_game_in_sweden_package.route_controlled_training|%0]§! faster."
video_game_opening_commercial_tt: "Simulation Reliance starts at §Y[?constant:video_game_in_sweden_reliance.commercial_start|0]§! (Habit). Sweden gains £pol_power §G[?constant:video_game_in_sweden_award.commercial_opening_political_power|0]§! political power and §G+[?constant:video_game_in_sweden_effect.commercial_stability|%0]§! stability, and while the programme runs, factory efficiency grows §G[?constant:video_game_in_sweden_package.route_commercial_efficiency|%0]§! faster.[GetVideoGameCommercialOpeningNote]"
video_game_opening_officer_tt: "Simulation Reliance starts at §Y[?constant:video_game_in_sweden_reliance.officer_start|0]§! (Doctrine). The army gains £army_experience [?constant:video_game_in_sweden_award.officer_opening_army_experience|0] experience and £command_power [?constant:video_game_in_sweden_award.officer_opening_command_power|0] command power, and while the programme runs, army experience gain rises by §G[?constant:video_game_in_sweden_package.route_officer_army_xp|%0]§!. One serving commander has a [?constant:video_game_in_sweden_award.commander_chance_officer_opening|0]% chance to become a §YRulebook Commander§!.[GetVideoGameOfficerOpeningNote]"
video_game_opening_commercial_high_chaos: " At this level of Chaos the release reaches the whole public at once: Reliance starts at §Y[?constant:video_game_in_sweden_reliance.doctrine_min|0]§! and the National Strategy Craze begins."
video_game_opening_officer_high_chaos: " At this level of Chaos the staff colleges take up the board at once and the staff-culture stage begins."
video_game_opening_note_none: ""

chaosx.nr24.11.t: "The Staff College Takes the Board"
chaosx.nr24.11.d: "Swedish staff colleges now rank officers by their results at the cabinet. Junior officers rehearse the same campaigns, and commanders cite printed scores in disputes over real depots and marches. The Ministry must decide how the contests will be judged against field conditions."
chaosx.nr24.11.a: "Make the auxiliary doctrine official."
chaosx.nr24.11.b: "Let the officers contest the command."
chaosx.nr24.11.c: "Set an independent red team loose."
video_game_evolution_i_auxiliary_tt: "Simulation Reliance falls to at most §Y[?constant:video_game_in_sweden_reliance.auxiliary_reliance_cap|0]§!, and while the staff culture lasts, debriefed sessions keep it from rising past that level. While the programme runs, the staff gains §G+[?constant:video_game_in_sweden_package.auxiliary_planning|%0]§! planning speed and §G+[?constant:video_game_in_sweden_package.auxiliary_adaptability|%0]§! terrain adaptation. Mismatch reports arrive less often."
video_game_evolution_i_competitive_tt: "Simulation Reliance rises by §R+[?constant:video_game_in_sweden_reliance.officer_league_gain|0]§!. While the programme runs, commanders gain §G+[?constant:video_game_in_sweden_package.competitive_planning|%0]§! planning speed and §G+[?constant:video_game_in_sweden_package.competitive_army_xp|%0]§! army experience gain. Mismatch reports arrive more often, especially of opponents leaving the cabinet's script."
video_game_evolution_i_red_team_tt: "Simulation Reliance falls by §G-[?constant:video_game_in_sweden_reliance.red_team_loss|0]§!. While the programme runs, the opposing side is less predictable: §G+[?constant:video_game_in_sweden_package.red_team_adaptability|%0]§! terrain adaptation and §R-[?constant:video_game_in_sweden_package.red_team_planning_cost|%0]§! planning speed. Reports of opponents leaving the cabinet's script stop arriving, and other mismatch reports arrive less often."

chaosx.nr24.12.t: "The Nation Takes Its Turn"
chaosx.nr24.12.d: "Clubs, teachers, newspapers, and municipal halls have taken up the Swedish cabinet. Public exhibitions draw families and workers, while evening leagues pull workers from factory shifts. The government must decide whether to extend the leagues, protect working hours, or give the clubs a civic task."
chaosx.nr24.12.a: "Open a season of public exhibitions."
chaosx.nr24.12.b: "Protect the shifts from the tournament."
chaosx.nr24.12.c: "Give the clubs a civic mandate."
video_game_evolution_ii_exhibitions_tt: "Simulation Reliance rises by §R+[?constant:video_game_in_sweden_reliance.exhibition_gain|0]§!. While the craze lasts, exhibitions add §G+[?constant:video_game_in_sweden_package.exhibition_war_support|%0]§! war support, and its factory output and political costs grow to [?constant:video_game_in_sweden_package.public_exhibition_factor|2] times their usual size."
video_game_evolution_ii_protect_tt: "Simulation Reliance falls by §G-[?constant:video_game_in_sweden_reliance.protect_shifts_loss|0]§!. Public reach narrows, and the factory output cost of the craze falls by §G[?constant:video_game_in_sweden_package.protect_shifts_output_cut|%0]§!."
video_game_evolution_ii_civic_tt: "Simulation Reliance rises by §R+[?constant:video_game_in_sweden_reliance.preparedness_clubs_gain|0]§!. A voluntary civic network keeps the factory output and political costs of the craze at [?constant:video_game_in_sweden_package.public_civic_factor|2] times their usual size."

chaosx.nr24.13.t: "When the Board Directs the Cabinet"
chaosx.nr24.13.d: "Senior offices now compare real reports with the Swedish cabinet's forecasts. A transport shortage is treated as a clerical inconvenience, a change in weather as an unlisted category, and an opponent's improvisation as bad manners. The cabinet may remain an instrument, be checked by an independent staff, or be placed under an order that leaves no room for ceremonial confidence."
chaosx.nr24.13.a: "Call the senior offices together."
video_game_evolution_iii_paths_tt: "The Reality Audit, a dual-track staff, an official restriction, and Trust the Model are now open in the campaign cabinet category. Choosing one closes the others."

chaosx.nr24.20.t: "The Trial Has a Filing Number"
chaosx.nr24.20.d: "The Swedish board has completed its allotted trial. The useful tables can be filed with the staff papers, left in the public rooms, or returned to the officers who made a sport of command. The cabinet will be dismantled after the chosen disposition has been recorded."
chaosx.nr24.20.officer_culture_d: "The staff colleges have finished their season of contests. Rankings have been set beside field reports, the useful drills written into the training manuals, and the printed scores returned to the archive. The officers' league is retired with thanks and a short memorandum on the difference between a referee and an enemy."
chaosx.nr24.20.craze_d: "The national craze has settled into the ordinary life of clubs and study circles. Factory rosters are protected, ministries no longer quote tournament tables, and the municipal halls keep their evening boards for anyone who wishes to argue about railways in a civil manner."
chaosx.nr24.20.a: "Keep the useful method in the staff manuals."
chaosx.nr24.20.b: "Keep the public schoolrooms open."
chaosx.nr24.20.c: "Give the officers their league."
chaosx.nr24.20.f: "Write the useful drills into the manuals."
chaosx.nr24.20.g: "Leave the boards with the study circles."
video_game_conclusion_methods_tt: "The programme closes. §YValidated Wargaming Methods§! guides Swedish training for [?constant:video_game_in_sweden_timing.ordinary_aftermath_days|0] days."
video_game_conclusion_clubs_tt: "The programme closes. §YMunicipal Campaign Clubs§! add §G+[?constant:video_game_in_sweden_effect.commercial_aftermath_recruitable|%0]§! recruitable population for [?constant:video_game_in_sweden_timing.ordinary_aftermath_days|0] days."
video_game_conclusion_commander_tt: "Any §YRulebook Commander§! returns to ordinary staff habits."

chaosx.nr24.21.t: "The Public Rooms Receive a Circular"
chaosx.nr24.21.d: "The commercial release has left behind a modest civic institution. Municipal halls have kept their evening tables, publishers have discovered the limits of a national syllabus, and the Ministry has issued a circular reminding every organiser that a projected map is not a road, a depot, or a competent clerk."
chaosx.nr24.21.a: "File the circular with the other safeguards."
chaosx.nr24.22.t: "A Review of the Campaign Cabinet"
chaosx.nr24.22.d: "The cabinet trial has run past its allotted year, and its tables now carry more authority in the staff rooms than any trial was meant to have. The Ministry has ordered a review: debrief the officers and close the trial, or keep the cabinet running while the referees cut back its standing."
chaosx.nr24.22.a: "Debrief the staff and close the trial."
chaosx.nr24.22.b: "Keep it running under closer review."
video_game_containment_debrief_tt: "Simulation Reliance falls to at most §Y[?constant:video_game_in_sweden_reliance.habit_max|0]§!, and the trial closes with its ordinary conclusion."
video_game_containment_continue_tt: "Simulation Reliance falls by §G-[?constant:video_game_in_sweden_reliance.containment_continue_loss|0]§!. The trial continues under closer review for another [?constant:video_game_in_sweden_timing.containment_review_days|0] days, and the Ministry will not extend it again."

chaosx.nr24.30.t: "A Real Country Interrupts"
chaosx.nr24.30.d: "[GetVideoGameIncidentClause] The Ministry must decide whether to correct the cabinet's assumptions or keep following its tables."
chaosx.nr24.30.terrain_a: "Refile the map for the actual ground."
chaosx.nr24.30.terrain_b: "Trust the printed terrain table."
chaosx.nr24.30.supply_a: "Count the wagons before the next move."
chaosx.nr24.30.supply_b: "Issue the order and hope the railways agree."
chaosx.nr24.30.enemy_a: "Invite an opposing referee."
chaosx.nr24.30.enemy_b: "Assume the opponent will repeat the diagram."
chaosx.nr24.30.template_a: "Restrict the pattern to approved staff work."
chaosx.nr24.30.template_b: "Let the pattern set the training timetable."
chaosx.nr24.30.diplomatic_a: "Close the foreign correspondence."
chaosx.nr24.30.diplomatic_b: "Answer with another circular."
chaosx.nr24.30.workplace_a: "Protect the shift roster."
chaosx.nr24.30.workplace_b: "Move the lesson into working hours."
chaosx.nr24.30.party_a: "Separate the exercise from party business."
chaosx.nr24.30.party_b: "Let the committees take the board."
chaosx.nr24.30.casualties_a: "Count the replacements by name and depot."
chaosx.nr24.30.casualties_b: "Leave the replacement pool on the board."
chaosx.nr24.30.counterplan_a: "Reward the junior officer's insight."
chaosx.nr24.30.counterplan_b: "Dismiss it as gamesmanship."
chaosx.nr24.30.bootleg_a: "Observe how the foreigners play it."
chaosx.nr24.30.bootleg_b: "Protest the copy as proof of Swedish ingenuity."
chaosx.nr24.30.production_a: "Send the plan back for transport figures."
chaosx.nr24.30.production_b: "Let the factories find their own wagons."
chaosx.nr24.30.offensive_a: "Halt the offensive for a field review."
chaosx.nr24.30.offensive_b: "Press on as the tables direct."
