l_english:
chaosx.nr24.1.t: "Video Game in Sweden"

chaosx.nr24.2.t: "The Cabinet for Campaigns"
chaosx.nr24.2.d: "A Swedish workshop has built a remarkable war game from relay cabinets, punched cards, and a projected map. [GetVideoGameOpeningWarStatus] [GetVideoGameOpeningGovernmentStatus] [GetVideoGameOpeningStockholmStatus] [GetVideoGameOpeningWorldTension] The apparatus arranges geography, factories, supply columns, armies, and political alignments with unsettling confidence. The engineers request a hearing before the Ministry assigns it to staff officers, schools, or an officers' contest."
chaosx.nr24.2.a: "Place it under staff supervision."
chaosx.nr24.2.b: "Issue it through schools and publishers."
chaosx.nr24.2.c: "Let the officers compete."

chaosx.nr24.11.t: "The Staff College Takes the Board"
chaosx.nr24.11.d: "The Swedish staff colleges have adopted the cabinet with professional earnestness. Referees record rankings, junior officers rehearse the same campaigns, and commanders have begun to cite the printed result when arguing over a real depot or march. The Ministry must decide whether the contest will teach judgment or merely reward the officer who has memorised the table."
chaosx.nr24.11.a: "Make the auxiliary doctrine official."
chaosx.nr24.11.b: "Let the officers contest the command."
chaosx.nr24.11.c: "Set an independent red team loose."

chaosx.nr24.12.t: "The Nation Takes Its Turn"
chaosx.nr24.12.d: "Clubs, teachers, newspapers, and municipal halls have taken up the Swedish cabinet. Public exhibitions draw families and workers. Employers discover that a respectable evening league can still empty a factory floor by supper. The government may widen the movement, restrain its reach, or give the clubs a civic duty before enthusiasm becomes an administrative fact."
chaosx.nr24.12.a: "Open a season of public exhibitions."
chaosx.nr24.12.b: "Protect the shifts from the tournament."
chaosx.nr24.12.c: "Give the clubs a civic mandate."

chaosx.nr24.13.t: "When the Board Directs the Cabinet"
chaosx.nr24.13.d: "Senior offices now compare real reports with the Swedish cabinet's forecasts. A transport shortage is treated as a clerical inconvenience, a change in weather as an unlisted category, and an opponent's improvisation as bad manners. The cabinet may remain an instrument, acquire a second ledger for comparison, or be placed under an order that leaves no room for ceremonial confidence."
chaosx.nr24.13.a: "Call the senior offices together."

chaosx.nr24.20.t: "The Trial Has a Filing Number"
chaosx.nr24.20.d: "The Swedish board has completed its allotted trial. The useful tables can be filed with the staff papers, left in the public rooms, or returned to the officers who made a sport of command. The cabinet will be dismantled after the chosen disposition has been recorded."
chaosx.nr24.20.a: "Keep the useful method in the staff ledger."
chaosx.nr24.20.b: "Keep the public schoolrooms open."
chaosx.nr24.20.c: "Give the officers their league."

chaosx.nr24.21.t: "The Public Rooms Receive a Circular"
chaosx.nr24.21.d: "The commercial release has left behind a modest civic institution. Municipal halls have kept their evening tables, publishers have discovered the limits of a national syllabus, and the Ministry has issued a circular reminding every organiser that a projected map is not a road, a depot, or a competent clerk."
chaosx.nr24.21.a: "File the circular with the other safeguards."

chaosx.nr24.30.t: "A Real Country Interrupts"
chaosx.nr24.30.d: "[GetVideoGameIncidentClause] The board has produced a neat answer. The Ministry must decide which part of the neatness deserves to survive contact with a map."
chaosx.nr24.30.terrain_a: "Refile the map for the actual ground."
chaosx.nr24.30.terrain_b: "Trust the printed terrain table."
chaosx.nr24.30.supply_a: "Count the wagons before the next move."
chaosx.nr24.30.supply_b: "Issue the order and hope the railways agree."
chaosx.nr24.30.enemy_a: "Invite an opposing referee."
chaosx.nr24.30.enemy_b: "Assume the opponent will repeat the diagram."
chaosx.nr24.30.template_a: "Restrict the pattern to approved staff work."
chaosx.nr24.30.template_b: "Let the pattern set the public timetable."
chaosx.nr24.30.diplomatic_a: "Close the foreign correspondence."
chaosx.nr24.30.diplomatic_b: "Answer with another circular."
chaosx.nr24.30.workplace_a: "Protect the shift roster."
chaosx.nr24.30.workplace_b: "Move the lesson into working hours."
chaosx.nr24.30.party_a: "Separate the exercise from party business."
chaosx.nr24.30.party_b: "Let the committees take the board."

chaosx.nr24.31.t: "Field Validation Report"
chaosx.nr24.31.d: "The field party has returned with a report that separates the cabinet's useful observations from its tidy assumptions. Its pages divide the findings in three: some can be retained, some require a narrower office, and some should not be allowed near a marching order."
chaosx.nr24.31.a: "The field report is accepted."
chaosx.nr24.31.b: "File the errors for correction."
chaosx.nr24.31.c: "Close the exercise as inconclusive."

chaosx.nr24.32.t: "Reality Audit Report"
chaosx.nr24.32.d: "The senior audit has compared the Swedish cabinet with roads, depots, weather reports, and the decisions of actual officers. The verdict is severe enough to be useful. Sweden must decide whether to keep the corrected method, retain only a narrow office, or lock the cabinet before another forecast becomes an order."
chaosx.nr24.32.a: "The survey has earned its place."
chaosx.nr24.32.b: "Keep the useful pages and discard the rest."
chaosx.nr24.32.c: "Lock the cabinet."

chaosx.nr24.33.t: "The Second Ledger"
chaosx.nr24.33.d: "The comparison office has maintained two ledgers: one for the cabinet's forecast and one for the country that supplied the forecast. The arrangement has either taught the clerks to ask better questions or demonstrated that two neat tables can still agree on the wrong road."
chaosx.nr24.33.a: "Keep the two ledgers together."
chaosx.nr24.33.b: "Return the cabinet to the depot."

chaosx.nr24.34.t: "Order of Restriction"
chaosx.nr24.34.d: "The cabinet has been placed under a formal restriction. Its maps may remain available for limited instruction. Operational orders must once again name the road, the weather, the depot, and the people expected to carry them out. The enforcement office reports whether the order has held."
chaosx.nr24.34.a: "Seal the cabinets and publish the order."
chaosx.nr24.34.b: "The restriction has failed."

chaosx.nr24.40.t: "[ROOT.GetNameDef] Considers the Cabinet from [GetVideoGameForeignHostName]"
chaosx.nr24.40.d: "[ROOT.GetNameDef] has received papers from [GetVideoGameForeignHostName] describing a relay cabinet that arranges campaigns, depots, and political alignments on a projected map. Its officials must decide whether the apparatus is a useful training instrument, an intelligence curiosity, a distraction, or an opportunity for a little press confidence."
chaosx.nr24.40.a: "Grant a limited copy."
chaosx.nr24.40.b: "Permit a military study."
chaosx.nr24.40.c: "Ban the circulation."
chaosx.nr24.40.ridicule: "Let the newspapers laugh."
chaosx.nr24.40.e: "Give no answer."

chaosx.nr24.41.t: "A Foreign Reply to the Cabinet"
chaosx.nr24.41.d: "The foreign office of [GetVideoGameForeignPartnerName] has settled its account with the Swedish packet. [GetVideoGameForeignOutcome] The report is entered in the Swedish correspondence file, where it will be consulted whenever an official proposes to describe a foreign government as a predictable diagram."
chaosx.nr24.41.a: "Enter the reply in the correspondence file."

chaosx.nr24.50.t: "The Senior Reassessment"
chaosx.nr24.50.d: "The Swedish cabinet has reached the point at which confidence must be examined in public. A field audit, a second ledger, and a formal restriction are available according to the stores, offices, and conditions now at hand. Each choice records an answer to the same question: who is permitted to overrule the map?"
chaosx.nr24.50.a: "Send the cabinet into a reality audit."
chaosx.nr24.50.b: "Keep a second ledger beside it."
chaosx.nr24.50.c: "Restrict official use."

chaosx.news.24.t: "Video Game in Sweden"
chaosx.news.24.d: "Sweden has displayed a relay cabinet that arranges campaigns, supply columns, and political alignments on a projected map. Staff officers praise its orderly forecasts. Engineers and publishers dispute how many offices should be allowed to consult the machine."
chaosx.news.24.a: "The apparatus is remarkable."

# Decision category and public ledger
video_game_in_sweden_program_category: "The Swedish Campaign Cabinet"
video_game_in_sweden_program_category_desc: "The Swedish campaign cabinet is maintained by officers, engineers, and public institutions. Its tables can assist a real command when they are checked against roads, stores, weather, and human judgment.\n\n§YSimulation Reliance:§! §Y[?simulation_reliance|0]§! / §Y[?constant:video_game_in_sweden_value.maximum|0]§!\n§YStage:§! [GetVideoGameRelianceState]\n§YNext stage:§! [GetVideoGameNextRelianceThreshold]\n§YPhase:§! [GetVideoGamePhase]\n§YAdministration:§! [GetVideoGameProgramStatus]\n§YCurrent work:§! [GetVideoGameActiveMission]\n§YNext review:§! [GetVideoGameReassessment]\n§YMethod:§! [GetVideoGameRoute]\n\nOnly one principal inquiry is kept open at a time. Field work requires Stockholm in Swedish hands, and the cabinet must remain under Swedish administration."
