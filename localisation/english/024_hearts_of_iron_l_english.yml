video_game_incident_template_dismiss_tt: "Simulation Reliance rises by §R+[?constant:video_game_in_sweden_reliance.national_league_gain|0]§!. Such reports become more common. For [?video_game_in_sweden_mm_dismiss_days|0] days, army training time §G-[?video_game_in_sweden_mm_dismiss_1|%1]§! and terrain adaptation §R-[?video_game_in_sweden_mm_dismiss_2|%1]§!."
video_game_incident_diplomatic_admit_tt: "Simulation Reliance falls by §G-[?constant:video_game_in_sweden_reliance.separate_policy_loss|0]§!. The Foreign Office sends no further licence packets. For [?video_game_in_sweden_mm_admit_days|0] days, political power gain §R-[?video_game_in_sweden_mm_admit_1|%1]§! and monthly opinion gain §R-[?video_game_in_sweden_mm_admit_2|%1]§!."
video_game_incident_diplomatic_dismiss_tt: "Simulation Reliance rises by §R+[?constant:video_game_in_sweden_award.incident_diplomatic_overconfidence|0]§!. Such replies become more common. For [?video_game_in_sweden_mm_dismiss_days|0] days, political power gain §R-[?video_game_in_sweden_mm_dismiss_1|%1]§! and monthly opinion gain §R-[?video_game_in_sweden_mm_dismiss_2|%1]§!."
video_game_incident_workplace_admit_tt: "Simulation Reliance falls by §G-[?constant:video_game_in_sweden_reliance.protect_shifts_loss|0]§!. Factory shifts are protected, cutting the factory output cost of the craze by §G[?constant:video_game_in_sweden_package.protect_shifts_output_cut|%0]§!. For [?video_game_in_sweden_mm_admit_days|0] days, factory output §R-[?video_game_in_sweden_mm_admit_1|%1]§!."
video_game_incident_workplace_dismiss_tt: "Simulation Reliance rises by §R+[?constant:video_game_in_sweden_reliance.national_league_gain|0]§!. For [?video_game_in_sweden_mm_dismiss_days|0] days, factory output §R-[?video_game_in_sweden_mm_dismiss_1|%1]§!."
video_game_incident_party_admit_tt: "Simulation Reliance falls by §G-[?constant:video_game_in_sweden_reliance.separate_policy_loss|0]§!. Play is separated from policy, halving the political cost of the craze and holding the next stage back. For [?video_game_in_sweden_mm_admit_days|0] days, stability §R-[?video_game_in_sweden_mm_admit_1|%1]§! and political power gain §R-[?video_game_in_sweden_mm_admit_2|%1]§!."
video_game_incident_party_dismiss_tt: "Simulation Reliance rises by §R+[?constant:video_game_in_sweden_reliance.national_league_gain|0]§!. Such claims become more common. For [?video_game_in_sweden_mm_dismiss_days|0] days, stability §R-[?video_game_in_sweden_mm_dismiss_1|%1]§! and political power gain §R-[?video_game_in_sweden_mm_dismiss_2|%1]§!."
video_game_incident_casualties_admit_tt: "Simulation Reliance falls by §G-[?constant:video_game_in_sweden_award.incident_casualties_admit_loss|0]§!. For [?video_game_in_sweden_mm_admit_days|0] days, war support §R-[?video_game_in_sweden_mm_admit_1|%1]§! and recruitable population §R-[?video_game_in_sweden_mm_admit_2|%1]§!."
video_game_incident_casualties_dismiss_tt: "Simulation Reliance rises by §R+[?constant:video_game_in_sweden_award.incident_casualties_dismiss_gain|0]§!. For [?video_game_in_sweden_mm_dismiss_days|0] days, war support §R-[?video_game_in_sweden_mm_dismiss_1|%1]§! and recruitable population §R-[?video_game_in_sweden_mm_dismiss_2|%1]§!."
video_game_incident_counterplan_admit_tt: "Simulation Reliance falls by §G-[?constant:video_game_in_sweden_award.incident_counterplan_admit_loss|0]§!. For [?video_game_in_sweden_mm_admit_days|0] days, planning speed §R-[?video_game_in_sweden_mm_admit_1|%1]§!."
video_game_incident_counterplan_dismiss_tt: "Simulation Reliance rises by §R+[?constant:video_game_in_sweden_award.incident_counterplan_dismiss_gain|0]§!. For [?video_game_in_sweden_mm_dismiss_days|0] days, planning speed §R-[?video_game_in_sweden_mm_dismiss_1|%1]§!."
