video_game_incident_supply_admit_tt: "Simulation Reliance falls by §G-[?constant:video_game_in_sweden_reliance.logistics_review_loss|0]§!. The rail-table review is filed.[GetVideoGameTrustAdmission] For [?video_game_in_sweden_mm_admit_days|0] days, supply consumption §R+[?video_game_in_sweden_mm_admit_1|%1]§! and organisation recovery §R-[?video_game_in_sweden_mm_admit_2|%1]§!."
