video_game_logistics_capacity_tt: "A civilian office must be available for the rail-table review."
video_game_field_validation_resources_tt: "The field party requires an active Swedish front, [?constant:video_game_in_sweden_event.reality_audit_min_divisions_display|0] Swedish divisions in one field region, Stockholm under Swedish control, and the required trains, support equipment, and fuel."
video_game_foreign_partner_tt: "An eligible government must be available, at peace with Sweden, and below the [?constant:video_game_in_sweden_event.maximum_foreign_responses|0]-response limit. Only one packet may await a reply at a time."
video_game_reality_audit_requirements_tt: "A full audit requires a completed rail-table review and independent staff finding, a field party under way, Stockholm under Swedish control, the required stores, and stability above [?constant:video_game_in_sweden_effect.minimum_audit_stability|%0]."
video_game_narrow_reality_audit_requirements_tt: "A narrow reassessment requires a failed or partial report, a Swedish administration still in office, the required rail, support, and fuel stores, and stability above [?constant:video_game_in_sweden_effect.minimum_audit_stability|%0]."
video_game_dual_track_requirements_tt: "The second ledger requires Swedish control, [?constant:video_game_in_sweden_cost.dual_track_army_experience|0] Army Experience, and one available civilian office."
video_game_restrict_use_requirements_tt: "The official restriction requires [?constant:video_game_in_sweden_cost.restriction_political_power|0] Political Power. The order also draws [?constant:video_game_in_sweden_cost.restriction_stability_loss_display|0]% Stability and [?constant:video_game_in_sweden_cost.restriction_war_support_loss_display|0]% War Support when each reserve is above [?constant:video_game_in_sweden_cost.restriction_stability_gate_display|0]%."
video_game_trust_model_requirements_tt: "Trust the Model requires stability above [?constant:video_game_in_sweden_effect.trust_stability_gate|%0] and surrender progress below [?constant:video_game_in_sweden_effect.maximum_risk_surrender_progress|%0]. A meaningful war must already be under way or begin before the scheduled reassessment against a major power or an enemy with more factories and military industry than Sweden."

# Baseline and evolution decisions
video_game_controlled_exercise: "Conduct a Controlled Staff Exercise"
video_game_controlled_exercise_desc: "Use the cabinet under a referee's hand. The exercise grants a modest staff lesson. The first exercise raises Simulation Reliance by §R+[?constant:video_game_in_sweden_reliance.controlled_exercise_gain|0]§!, and later sessions raise it by only §R+[?constant:video_game_in_sweden_reliance.controlled_exercise_repeat_gain|0]§!."
video_game_controlled_exercise_cost: "£army_experience [?constant:video_game_in_sweden_cost.controlled_exercise_army_experience|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.controlled_exercise_support_equipment|0]  £GFX_fuel_texticon [?constant:video_game_in_sweden_cost.controlled_exercise_fuel|0]"
video_game_controlled_exercise_cost_blocked: "£army_experience §R[?constant:video_game_in_sweden_cost.controlled_exercise_army_experience|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.controlled_exercise_support_equipment|0]§!  £GFX_fuel_texticon §R[?constant:video_game_in_sweden_cost.controlled_exercise_fuel|0]§!"
video_game_controlled_exercise_cost_tooltip: "The first exercise teaches more than later sessions. Each exercise remains subject to its review interval."
video_game_logistics_module: "Audit the Rail Table"
video_game_logistics_module_desc: "Reserve a civilian office to compare the cabinet's transport assumptions with trains, lorries, and support stores. The review lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.logistics_review_loss|0]§! and returns a small quantity of support material."
video_game_logistics_module_cost: "£GFX_train_texticon [?constant:video_game_in_sweden_cost.logistics_module_trains|0]  £GFX_motorized_equipment_text_icon [?constant:video_game_in_sweden_cost.logistics_module_trucks|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.logistics_module_support_equipment|0]  £civ_factory [?constant:video_game_in_sweden_cost.logistics_module_civilian_factory|0]"
video_game_logistics_module_cost_blocked: "£GFX_train_texticon §R[?constant:video_game_in_sweden_cost.logistics_module_trains|0]§!  £GFX_motorized_equipment_text_icon §R[?constant:video_game_in_sweden_cost.logistics_module_trucks|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.logistics_module_support_equipment|0]§!  £civ_factory §R[?constant:video_game_in_sweden_cost.logistics_module_civilian_factory|0]§!"
video_game_logistics_module_cost_tooltip: "Reserve the office for a careful comparison of rails, lorries, and stores."
video_game_expand_access: "Extend Civilian Circulation"
video_game_expand_access_desc: "Send the cabinet beyond the staff room through schools, clubs, and public lectures. Access widens and Simulation Reliance rises by §R+[?constant:video_game_in_sweden_reliance.expand_access_gain|0]§!."
video_game_expand_access_cost: "£pol_power [?constant:video_game_in_sweden_cost.expand_access_political_power|0]  £army_experience [?constant:video_game_in_sweden_cost.expand_access_army_experience|0]"
video_game_expand_access_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.expand_access_political_power|0]§!  £army_experience §R[?constant:video_game_in_sweden_cost.expand_access_army_experience|0]§!"
video_game_expand_access_cost_tooltip: "Wider access raises Simulation Reliance and permits civilian circulation. Civilian circulation has no more than [?constant:video_game_in_sweden_value.three|0] access stages."
video_game_conclude_trial: "Close the Trial's Ledger"
video_game_conclude_trial_desc: "End the baseline trial after its review period. The chosen Swedish opening determines which office keeps the useful papers."

video_game_rules_revision: "Revise the Referee's Book"
video_game_rules_revision_desc: "Rewrite the assumptions that reward narrow behaviour. A revised book improves the staff method and raises Simulation Reliance by §R+[?constant:video_game_in_sweden_reliance.rules_revision_gain|0]§!. Each revision requires a larger staff levy."
video_game_rules_revision_cost: "£army_experience [?video_game_in_sweden_rules_revision_army_experience|0]  £command_power [?video_game_in_sweden_rules_revision_command_power|0]"
video_game_rules_revision_cost_blocked: "£army_experience §R[?video_game_in_sweden_rules_revision_army_experience|0]§!  £command_power §R[?video_game_in_sweden_rules_revision_command_power|0]§!"
video_game_rules_revision_cost_tooltip: "Each revision raises Simulation Reliance and increases the staff levy for the next revision."
video_game_field_validation: "Send a Field Validation Party"
video_game_field_validation_desc: "Commit a staffed field party to compare the cabinet with real terrain, transport, and formations. Opening the party lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.field_validation_loss|0]§!. The report may validate the method, limit it, or close the exercise."
video_game_field_validation_cost: "£GFX_fuel_texticon [?constant:video_game_in_sweden_cost.field_validation_fuel|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.field_validation_support_equipment|0]  £GFX_train_texticon [?constant:video_game_in_sweden_cost.field_validation_trains|0]  £army_experience [?constant:video_game_in_sweden_cost.field_validation_army_experience|0]"
video_game_field_validation_cost_blocked: "£GFX_fuel_texticon §R[?constant:video_game_in_sweden_cost.field_validation_fuel|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.field_validation_support_equipment|0]§!  £GFX_train_texticon §R[?constant:video_game_in_sweden_cost.field_validation_trains|0]§!  £army_experience §R[?constant:video_game_in_sweden_cost.field_validation_army_experience|0]§!"
video_game_field_validation_cost_tooltip: "The stores remain committed during the proof period. A failed report leaves the field record and opens correction work."
video_game_red_team: "Commission an Independent Red Team"
video_game_red_team_desc: "Give a separate staff the task of finding cases where the cabinet rewards the wrong behaviour. Their objections lower Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.red_team_loss|0]§! and improve the next field exercise."
video_game_red_team_cost: "£pol_power [?constant:video_game_in_sweden_cost.red_team_political_power|0]  £army_experience [?constant:video_game_in_sweden_cost.red_team_army_experience|0]"
video_game_red_team_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.red_team_political_power|0]§!  £army_experience §R[?constant:video_game_in_sweden_cost.red_team_army_experience|0]§!"
video_game_red_team_cost_tooltip: "A separate staff may object without owning the original table."
video_game_officer_league: "Hold an Officer League"
video_game_officer_league_desc: "Turn repeated scenarios into a professional contest. Commanders gain a sharper common language. The rankings raise Simulation Reliance by §R+[?constant:video_game_in_sweden_reliance.officer_league_gain|0]§! and make the cabinet harder to question."
video_game_officer_league_cost: "£command_power [?constant:video_game_in_sweden_cost.officer_league_command_power|0]  £army_experience [?constant:video_game_in_sweden_cost.officer_league_army_experience|0]"
video_game_officer_league_cost_blocked: "£command_power §R[?constant:video_game_in_sweden_cost.officer_league_command_power|0]§!  £army_experience §R[?constant:video_game_in_sweden_cost.officer_league_army_experience|0]§!"
video_game_officer_league_cost_tooltip: "The league makes its rankings part of professional standing."

video_game_national_league: "Open a National League Season"
video_game_national_league_desc: "Give public clubs a regular season with newspapers, halls, and a national table. The first season raises Simulation Reliance by §R+[?constant:video_game_in_sweden_reliance.national_league_gain|0]§!, later seasons by §R+[?constant:video_game_in_sweden_reliance.national_league_repeat_gain|0]§!, and each season occupies a civilian office for its stated term."
video_game_national_league_cost: "£pol_power [?constant:video_game_in_sweden_cost.national_league_political_power|0]  £civ_factory [?constant:video_game_in_sweden_cost.national_league_civilian_factory|0]"
video_game_national_league_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.national_league_political_power|0]§!  £civ_factory §R[?constant:video_game_in_sweden_cost.national_league_civilian_factory|0]§!"
video_game_national_league_cost_tooltip: "The season takes a civilian office away from other work."
video_game_protect_shifts: "Protect the Factory Shifts"
video_game_protect_shifts_desc: "Move public lessons away from working hours. The arrangement lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.protect_shifts_loss|0]§! and carries a temporary civilian cost."
video_game_protect_shifts_cost: "£pol_power [?constant:video_game_in_sweden_cost.protect_shifts_political_power|0]  £civ_factory [?constant:video_game_in_sweden_cost.protect_shifts_civilian_factory|0]"
video_game_protect_shifts_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.protect_shifts_political_power|0]§!  £civ_factory §R[?constant:video_game_in_sweden_cost.protect_shifts_civilian_factory|0]§!"
video_game_protect_shifts_cost_tooltip: "The arrangement gives production its hours back."
video_game_preparedness_clubs: "Give the Clubs a Preparedness Charter"
video_game_preparedness_clubs_desc: "Give local clubs a bounded civic task in first aid, maps, and preparedness. Their work raises Simulation Reliance by §R+[?constant:video_game_in_sweden_reliance.preparedness_clubs_gain|0]§! and preserves an institutional purpose."
video_game_preparedness_clubs_cost: "£pol_power [?constant:video_game_in_sweden_cost.preparedness_clubs_political_power|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.preparedness_clubs_support_equipment|0]"
video_game_preparedness_clubs_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.preparedness_clubs_political_power|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.preparedness_clubs_support_equipment|0]§!"
video_game_preparedness_clubs_cost_tooltip: "The charter leaves the clubs useful when the campaign map is put away."
video_game_foreign_licenses: "Offer a Foreign Licence"
video_game_foreign_licenses_desc: "Send a limited Swedish packet to one eligible foreign government. The Foreign Office may approach only [?constant:video_game_in_sweden_event.maximum_foreign_responses|0] governments, one at a time, and retain [?constant:video_game_in_sweden_event.maximum_visible_foreign_reports|0] replies in its file. A foreign office may copy, study, ban, ridicule, or ignore the packet. Sweden's cabinet remains under its own staff."
video_game_foreign_licenses_cost: "£convoy_texticon [?constant:video_game_in_sweden_cost.foreign_licenses_convoys|0]  £pol_power [?constant:video_game_in_sweden_cost.foreign_licenses_political_power|0]  £civ_factory [?constant:video_game_in_sweden_cost.foreign_licenses_civilian_factory|0]"
video_game_foreign_licenses_cost_blocked: "£convoy_texticon §R[?constant:video_game_in_sweden_cost.foreign_licenses_convoys|0]§!  £pol_power §R[?constant:video_game_in_sweden_cost.foreign_licenses_political_power|0]§!  £civ_factory §R[?constant:video_game_in_sweden_cost.foreign_licenses_civilian_factory|0]§!"
video_game_foreign_licenses_cost_tooltip: "One packet occupies the foreign channel until its reply is filed, and each recipient can be approached only once."
video_game_separate_policy: "Separate the Public Policy"
video_game_separate_policy_desc: "Draw a firm line between public instruction and military orders. The decision lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.separate_policy_loss|0]§! and accepts a short political backlash."
video_game_separate_policy_cost: "£pol_power [?constant:video_game_in_sweden_cost.separate_policy_political_power|0]"
video_game_separate_policy_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.separate_policy_political_power|0]§!"
video_game_separate_policy_cost_tooltip: "The separation lowers Simulation Reliance and ends public circulation."

video_game_begin_reality_audit: "Begin the Reality Audit"
video_game_begin_reality_audit_desc: "Send divisions, stores, and staff officers to test the cabinet against real fronts, roads, and supply work. Opening a full audit lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.reality_audit_full|0]§!. The report must answer to all three Swedish field regions."
video_game_reality_audit_cost: "£army_experience [?constant:video_game_in_sweden_cost.reality_audit_army_experience|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.reality_audit_support_equipment|0]  £GFX_fuel_texticon [?constant:video_game_in_sweden_cost.reality_audit_fuel|0]  £GFX_train_texticon [?constant:video_game_in_sweden_cost.reality_audit_trains|0]"
video_game_reality_audit_cost_blocked: "£army_experience §R[?constant:video_game_in_sweden_cost.reality_audit_army_experience|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.reality_audit_support_equipment|0]§!  £GFX_fuel_texticon §R[?constant:video_game_in_sweden_cost.reality_audit_fuel|0]§!  £GFX_train_texticon §R[?constant:video_game_in_sweden_cost.reality_audit_trains|0]§!"
video_game_reality_audit_cost_tooltip: "The full audit commits the field stores while it tests all three regions. A disrupted audit produces a partial or failed report."
video_game_narrow_reality_audit: "Conduct a Narrow Reassessment"
video_game_narrow_reality_audit_desc: "After a poor report, send a smaller party to the front with a shorter ledger. Opening it lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_award.narrow_reality_audit_loss|0]§! and can restore useful practice. The filed report remains part of the record."
video_game_narrow_reality_audit_cost: "£army_experience [?constant:video_game_in_sweden_cost.narrow_reality_audit_army_experience|0]  £support_equipment_text_icon [?constant:video_game_in_sweden_cost.narrow_reality_audit_support_equipment|0]  £GFX_fuel_texticon [?constant:video_game_in_sweden_cost.narrow_reality_audit_fuel|0]  £GFX_train_texticon [?constant:video_game_in_sweden_cost.narrow_reality_audit_trains|0]"
video_game_narrow_reality_audit_cost_blocked: "£army_experience §R[?constant:video_game_in_sweden_cost.narrow_reality_audit_army_experience|0]§!  £support_equipment_text_icon §R[?constant:video_game_in_sweden_cost.narrow_reality_audit_support_equipment|0]§!  £GFX_fuel_texticon §R[?constant:video_game_in_sweden_cost.narrow_reality_audit_fuel|0]§!  £GFX_train_texticon §R[?constant:video_game_in_sweden_cost.narrow_reality_audit_trains|0]§!"
video_game_narrow_reality_audit_cost_tooltip: "The narrow audit is a single recovery attempt after a poor report and does not erase the earlier finding."
video_game_dual_track: "Maintain a Second Ledger"
video_game_dual_track_desc: "Keep the cabinet beside a second ledger of actual roads, stores, weather, and reports. Opening the two-track method returns Simulation Reliance to the §YDoctrine§! state and preserves a finite military benefit below Worldview until the verification is filed."
video_game_dual_track_cost: "£army_experience [?constant:video_game_in_sweden_cost.dual_track_army_experience|0]  £command_power [?constant:video_game_in_sweden_cost.dual_track_command_power|0]  £civ_factory [?constant:video_game_in_sweden_cost.dual_track_civilian_factory|0]"
video_game_dual_track_cost_blocked: "£army_experience §R[?constant:video_game_in_sweden_cost.dual_track_army_experience|0]§!  £command_power §R[?constant:video_game_in_sweden_cost.dual_track_command_power|0]§!  £civ_factory §R[?constant:video_game_in_sweden_cost.dual_track_civilian_factory|0]§!"
video_game_dual_track_cost_tooltip: "The second ledger occupies one civilian office and grants a temporary allowance for comparing orders with roads, stores, weather, and reports until verification is filed."
video_game_restrict_use: "Issue an Official Restriction"
video_game_restrict_use_desc: "Restrict the cabinet to instruction and historical study. Opening the restriction lowers Simulation Reliance by §G-[?constant:video_game_in_sweden_reliance.restriction_loss|0]§!. Operational orders must name their real roads, stores, weather, and human responsibilities."
video_game_restrict_use_cost: "£pol_power [?constant:video_game_in_sweden_cost.restriction_political_power|0]  £stability_texticon [?constant:video_game_in_sweden_cost.restriction_stability_loss_display|0]%  £GFX_war_support_icon [?constant:video_game_in_sweden_cost.restriction_war_support_loss_display|0]%"
video_game_restrict_use_cost_blocked: "£pol_power §R[?constant:video_game_in_sweden_cost.restriction_political_power|0]§!  £stability_texticon §R[?constant:video_game_in_sweden_cost.restriction_stability_loss_display|0]%§!  £GFX_war_support_icon §R[?constant:video_game_in_sweden_cost.restriction_war_support_loss_display|0]%§!"
video_game_restrict_use_cost_tooltip: "The restriction lowers Reliance and begins a finite enforcement period. The Stability and War Support charges are paid on opening."
video_game_trust_model: "Trust the Model"
video_game_trust_model_desc: "Give the cabinet a single final authority for a limited term. It may begin in a meaningful war or before one, but a qualifying campaign must be found before the reassessment. Opening the arrangement sets Simulation Reliance to §R[?constant:video_game_in_sweden_value.maximum|0]§!, brings a strong temporary surge, and creates a mandatory reassessment at [GetVideoGameReassessment] or when the war ends."
video_game_trust_model_cost: "£command_power [?constant:video_game_in_sweden_cost.trust_model_command_power|0]  £pol_power [?constant:video_game_in_sweden_cost.trust_model_political_power|0]  £stability_texticon [?constant:video_game_in_sweden_cost.trust_model_stability_loss_display|0]%  £GFX_war_support_icon [?constant:video_game_in_sweden_cost.trust_model_war_support_loss_display|0]%"
video_game_trust_model_cost_blocked: "£command_power §R[?constant:video_game_in_sweden_cost.trust_model_command_power|0]§!  £pol_power §R[?constant:video_game_in_sweden_cost.trust_model_political_power|0]§!  £stability_texticon §R[?constant:video_game_in_sweden_cost.trust_model_stability_loss_display|0]%§!  £GFX_war_support_icon §R[?constant:video_game_in_sweden_cost.trust_model_war_support_loss_display|0]%§!"
video_game_trust_model_cost_tooltip: "The cabinet receives one final authority for one term. The Stability and War Support charges are paid on opening, and the cabinet must be reassessed."

# Missions
video_game_field_validation_mission_requirements_tt: "Keep [?constant:video_game_in_sweden_event.reality_audit_min_divisions_display|0] Swedish divisions in one field region, keep Stockholm, retain the field stores, and complete either the logistics or red-team review for the proof period."
video_game_field_validation_mission: "Field Validation"
video_game_field_validation_mission_desc: "The field party must keep [?constant:video_game_in_sweden_event.reality_audit_min_divisions_display|0] Swedish divisions in one of §Y$STATE_138$§!, §Y$STATE_141$§!, or §Y$STATE_666$§!, hold Stockholm, retain the required trains, support stores, and fuel, and complete either the logistics or red-team review before the report is filed."
video_game_reality_audit_mission: "Reality Audit"
video_game_reality_audit_mission_desc: "The full audit must keep Swedish forces in the field, hold Stockholm, retain the required trains, support stores, and fuel, and place [?constant:video_game_in_sweden_event.reality_audit_min_divisions_display|0] divisions in each of §Y$STATE_138$§!, §Y$STATE_141$§!, and §Y$STATE_666$§! under Swedish control. A narrow reassessment uses the shorter front test and the shorter proof period."
video_game_reality_audit_regions_tt: "The full audit requires [?constant:video_game_in_sweden_event.reality_audit_min_divisions_display|0] divisions in §Y$STATE_138$§!, §Y$STATE_141$§!, and §Y$STATE_666$§! under full Swedish control for the proof period. The report is downgraded when the field party loses its stores, fuel, or supply line."
video_game_dual_track_mission_requirements_tt: "Keep Stockholm and the second ledger in operation for the proof period."
video_game_restriction_mission_requirements_tt: "Keep Stockholm and the restriction office in operation for the proof period."
video_game_dual_track_verification: "Second Ledger Verification"
video_game_dual_track_verification_desc: "The comparison office must hold Stockholm for the proof period. It must maintain the cabinet and the actual ledger together."
video_game_restriction_enforcement: "Restriction Enforcement"
video_game_restriction_enforcement_desc: "The restriction office must keep the cabinet out of operational orders for the proof period until the new filing practice is accepted."

