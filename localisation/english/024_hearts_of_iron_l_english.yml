chaosx.nr24.31.t: "Field Validation Report"
chaosx.nr24.31.d: "The field party has returned with a report that separates the cabinet's useful observations from its tidy assumptions. Its pages divide the findings in three: some can be retained, some require a narrower office, and some should not be allowed near a marching order."
chaosx.nr24.31.a: "The field report is accepted."
chaosx.nr24.31.b: "File the errors for correction."
chaosx.nr24.31.c: "Close the exercise as inconclusive."
video_game_field_report_full_tt: "Simulation Reliance has fallen by §G-[?constant:video_game_in_sweden_reliance.field_validation_loss|0]§!. Army training is §G[?constant:video_game_in_sweden_package.field_training|%0]§! faster for [?constant:video_game_in_sweden_timing.field_training_days|0] days, the field-tested supply and enemy assumptions no longer produce mismatch reports, and any §YRulebook Commander§! has been corrected."
video_game_field_report_partial_tt: "Simulation Reliance has fallen by §G-[?constant:video_game_in_sweden_award.partial_field_validation_loss|0]§!. Reviewed findings quiet the matching mismatch reports, and a targeted follow-up review is available."
video_game_field_report_failed_tt: "Simulation Reliance has fallen by §G-[?constant:video_game_in_sweden_award.failed_field_validation_gain|0]§!. §YUnresolved Field Findings§! slow planning and reinforcement for [?constant:video_game_in_sweden_timing.field_validation_failure_penalty_days|0] days. A targeted follow-up review is available, and a later official restriction costs [?constant:video_game_in_sweden_effect.restriction_failure_fee_factor|%0] of its usual price."

chaosx.nr24.32.t: "Reality Audit Report"
chaosx.nr24.32.d: "The audit could not hold its field package together long enough to answer the cabinet. Its parties have been recalled from their regions, and the senior offices have gone back to the old tables with a long list of findings that nobody was able to test."
chaosx.nr24.32.full_d: "The audit parties have returned from the southern plains, the garrisons around Stockholm and the northern forests with every figure checked against roads, depots and weather. Red pencil marks now cover each place where the cabinet assumed a railway that was not there, and the staff colleges will teach the corrected method as one instrument among several."
chaosx.nr24.32.partial_d: "The audit parties have returned with most of their comparisons complete. Gaps remain where a region slipped out of the field package, a store ran short or an independent review was never filed, so the Ministry will keep a provisional comparison staff beside the cabinet until a narrower reassessment finishes the work."
chaosx.nr24.32.a: "Teach the corrected method."
chaosx.nr24.32.b: "Keep the comparison staff in place."
chaosx.nr24.32.c: "Record the untested findings."
video_game_audit_full_result_tt: "Simulation Reliance has fallen to at most §Y[?constant:video_game_in_sweden_reliance.habit_max|0]§!. Any §YRulebook Commander§! has been corrected, and §YValidated Wargaming Methods§! guides Swedish training for [?constant:video_game_in_sweden_timing.validated_methods_days|0] days before the programme closes."
video_game_audit_partial_result_tt: "Simulation Reliance has fallen to at most §Y[?constant:video_game_in_sweden_reliance.doctrine_max|0]§!. §YIndependent Staff Comparison§! continues for [?constant:video_game_in_sweden_timing.provisional_dual_track_days|0] days, and a narrow reassessment or an official restriction can settle the programme."
video_game_audit_failed_result_tt: "§YSimulation Orthodoxy§! returns to the senior offices, while the Reliance shed at the start of the audit stays shed. §YUnresolved Field Findings§! weigh on planning and reinforcement for [?constant:video_game_in_sweden_timing.reality_audit_failure_penalty_days|0] days. A narrow reassessment or an official restriction remains available."

chaosx.nr24.33.t: "The Dual-Track Report"
chaosx.nr24.33.d: "The comparison office has kept two sets of plans: the cabinet's forecast and the conventional staff's plan for the same country. The arrangement has either taught the clerks to ask better questions or demonstrated that two neat tables can still agree on the wrong road."
chaosx.nr24.33.a: "Keep the two staffs together."
chaosx.nr24.33.b: "Return the cabinet to the depot."
video_game_dual_report_success_tt: "Simulation Reliance has fallen to at most §Y[?constant:video_game_in_sweden_reliance.doctrine_max|0]§!. §YValidated Wargaming Methods§! guides Swedish training for [?constant:video_game_in_sweden_timing.validated_methods_days|0] days before the programme closes."
video_game_dual_report_failed_tt: "The dual-track staff has been dissolved. The Reality Audit and an official restriction at [?constant:video_game_in_sweden_effect.restriction_failure_fee_factor|%0] of its usual price remain available."

chaosx.nr24.34.t: "Order of Restriction"
chaosx.nr24.34.d: "The Ministry has closed the officer leagues, removed tournament scores from policy papers, and returned the public playing rooms to municipal custody. All three departments have reported their work complete, and the restriction office has closed the programme."
chaosx.nr24.34.failure_d: "The restriction office could not complete its work before the programme was closed. Its incomplete files have been returned to the Ministry."
chaosx.nr24.34.a: "File the three departmental reports."
chaosx.nr24.34.b: "Retain the incomplete departmental files."
video_game_restriction_report_success_tt: "Simulation Reliance has fallen to at most §Y[?constant:video_game_in_sweden_reliance.instrument_max|0]§!, and the programme is closed. Resentment over the closing notices changes stability by §R[?constant:video_game_in_sweden_effect.backlash_stability|%0]§! for [?constant:video_game_in_sweden_timing.backlash_days|0] days."
video_game_restriction_report_failed_tt: "The programme is closed without further effect."
chaosx.nr24.35.t: "The National Final"
chaosx.nr24.35.favourite_d: "The national final at the Stockholm exhibition hall has gone to the favourite, a staff-college team that played the approved plan move for move. Newspapers print the winning diagram on their front pages, and several ministries have asked for copies."
chaosx.nr24.35.upset_d: "The national final has gone to a study circle from a small northern town, whose captain ignored the approved plan and won by marching around it. The favourites have lodged a protest about the rules, and several staff officers have quietly asked for the captain's notes."
chaosx.nr24.35.a: "Award the cup with ministerial ceremony."
chaosx.nr24.35.b: "Print the winning plan beside the official one."
chaosx.nr24.36.t: "The Ministry Closes the File"
chaosx.nr24.36.d: "The cabinet's reviews have gone round the senior offices for months without a settled answer. The Ministry will no longer keep the question open: the cabinet either stays as a supervised comparison instrument for a fixed term or is restricted by order."
chaosx.nr24.36.a: "Keep it as a supervised instrument for a fixed term."
chaosx.nr24.36.b: "Restrict it by order."
video_game_final_review_settle_tt: "Simulation Reliance falls to at most §Y[?constant:video_game_in_sweden_reliance.doctrine_max|0]§!. The programme closes, and §YIndependent Staff Comparison§! continues for [?constant:video_game_in_sweden_timing.provisional_settlement_days|0] days."
video_game_final_review_restrict_tt: "Pay the restriction charges: £pol_power [GetVideoGameRestrictionPoliticalPowerCost]  £stability_texticon [GetVideoGameRestrictionStabilityCost]  £war_support_icon [GetVideoGameRestrictionWarSupportCost]. Simulation Reliance falls by §G-[?constant:video_game_in_sweden_reliance.restriction_loss|0]§!, enforcement begins, and the programme closes when it is complete."
chaosx.nr24.37.t: "The Follow-Up Review"
chaosx.nr24.37.passed_d: "The smaller field party has returned with the figures the first report lacked. Its officers walked the same roads with fewer wagons and a sharper pencil, and the staff now holds a finding it can defend."
chaosx.nr24.37.inconclusive_d: "The smaller field party could not hold its test together long enough to settle anything. The earlier finding stands, together with a short note on the difficulty of checking a forecast without the ground to check it on."
chaosx.nr24.37.a: "File the corrected finding."
chaosx.nr24.37.b: "Let the earlier finding stand."
video_game_followup_passed_tt: "The field finding has been upgraded, and Unresolved Field Findings no longer weigh on planning and reinforcement."
video_game_followup_inconclusive_tt: "The earlier field finding stands unchanged."
video_game_national_final_favourite_tt: "Simulation Reliance rises by §R+[?constant:video_game_in_sweden_award.national_final_favourite_gain|0]§!. The approved plan gains public authority."
video_game_national_final_upset_tt: "Simulation Reliance falls by §G-[?constant:video_game_in_sweden_award.national_final_upset_loss|0]§!. The upset reminds the staff that an opponent need not follow the tables."

chaosx.nr24.40.t: "[ROOT.GetNameDef] Considers the Cabinet from [GetVideoGameForeignHostName]"
chaosx.nr24.40.d: "[ROOT.GetNameDef] has received papers from [GetVideoGameForeignHostName] describing a relay cabinet that arranges campaigns, depots, and political alignments on a projected map. Its officials must decide whether the apparatus is a useful training instrument, an intelligence curiosity, a distraction, or an opportunity for a little press confidence."
chaosx.nr24.40.a: "Grant a limited copy."
chaosx.nr24.40.b: "Permit a military study."
chaosx.nr24.40.c: "Ban the circulation."
chaosx.nr24.40.ridicule: "Let the newspapers laugh."
chaosx.nr24.40.e: "Give no answer."
video_game_foreign_copy_tt: "§YSwedish Training Tables§!: planning speed §G+[?constant:video_game_in_sweden_effect.foreign_copy_planning|%0]§! and army experience gain §G+[?constant:video_game_in_sweden_effect.foreign_copy_xp|%0]§! for [?constant:video_game_in_sweden_timing.foreign_copy_days|0] days. Relations with [GetVideoGameForeignHostName] improve, fading over time."
video_game_foreign_study_tt: "§YStudy of Swedish Campaign Tables§!: army experience gain §G+[?constant:video_game_in_sweden_effect.foreign_study_xp|%1]§! for [?constant:video_game_in_sweden_timing.foreign_study_days|0] days. Relations with [GetVideoGameForeignHostName] improve slightly, fading over time."
video_game_foreign_ban_tt: "§YRestrictions on Swedish Campaign Tables§!: stability §R[?constant:video_game_in_sweden_effect.foreign_ban_stability|%0]§! for [?constant:video_game_in_sweden_timing.foreign_ban_days|0] days. Relations with [GetVideoGameForeignHostName] cool, recovering over time."
video_game_foreign_ridicule_tt: "§YDispute over Swedish Campaign Tables§!: stability §R[?constant:video_game_in_sweden_effect.foreign_ridicule_stability|%0]§! for [?constant:video_game_in_sweden_timing.foreign_ridicule_days|0] days. Relations with [GetVideoGameForeignHostName] sour, recovering over time, and the newspapers may regret it if Sweden wins its next war."
video_game_foreign_no_action_tt: "The packet is filed without further action."

chaosx.nr24.41.t: "A Foreign Reply to the Cabinet"
chaosx.nr24.41.d: "The foreign office of [GetVideoGameForeignPartnerName] has replied to Sweden's packet. [GetVideoGameForeignOutcome]"
chaosx.nr24.41.a: "Enter the reply in the correspondence file."
video_game_foreign_report_effect_tt: "[GetVideoGameForeignOutcomeEffect]"
video_game_foreign_effect_copy: "Simulation Reliance has risen by §R+[?constant:video_game_in_sweden_reliance.foreign_license_gain|0]§!."
video_game_foreign_effect_study: "Sweden has gained £pol_power §G[?constant:video_game_in_sweden_award.foreign_study_political_power|0]§! political power."
video_game_foreign_effect_ban: "Simulation Reliance has fallen by §G-[?constant:video_game_in_sweden_reliance.separate_policy_loss|0]§!."
video_game_foreign_effect_ridicule: "Sweden has gained £pol_power §G[?constant:video_game_in_sweden_award.foreign_ridicule_political_power|0]§! political power from the attention."
video_game_foreign_effect_none: "The reply has no further effect."

chaosx.nr24.50.t: "The Senior Reassessment"
chaosx.nr24.50.d: "Swedish officers have issued orders from the cabinet's forecasts despite reports of missing stores and impassable roads. The government can test the tables in the field, set an independent staff beside the cabinet, or restrict the cabinet to instruction.[GetVideoGameReassessmentVictory]"
chaosx.nr24.50.a: "Send the cabinet into a reality audit."
chaosx.nr24.50.b: "Set an independent staff beside it."
chaosx.nr24.50.c: "Restrict official use."
video_game_reassessment_victory_line: " The victory over the chosen opponent has given the reviewers a stronger hand: Simulation Reliance has already fallen by §G-[?constant:video_game_in_sweden_reliance.trust_victory_relief|0]§!, though a path must still be chosen."
video_game_reassessment_victory_none: ""
video_game_reassessment_audit_tt: "Pay the Reality Audit costs: $video_game_reality_audit_cost$  £train_texticon [?constant:video_game_in_sweden_cost.reality_audit_trains|0]. Simulation Reliance falls by §G-[?constant:video_game_in_sweden_reliance.reality_audit_full|0]§!, Simulation Orthodoxy is suspended, and the audit mission begins."
video_game_reassessment_dual_tt: "Pay the dual-track costs: $video_game_dual_track_cost$. Simulation Reliance falls to at most §Y[?constant:video_game_in_sweden_reliance.doctrine_max|0]§!, and the verification mission begins."
video_game_reassessment_restrict_tt: "Pay the restriction charges: £pol_power [GetVideoGameRestrictionPoliticalPowerCost]  £stability_texticon [GetVideoGameRestrictionStabilityCost]  £war_support_icon [GetVideoGameRestrictionWarSupportCost]. Simulation Reliance falls by §G-[?constant:video_game_in_sweden_reliance.restriction_loss|0]§!, and enforcement begins."

# Decision category and public register
video_game_in_sweden_program_category: "The Swedish Campaign Cabinet"
video_game_in_sweden_program_category_desc: "The campaign cabinet helps Swedish officers test plans against roads, stores, weather, and field reports. Its forecasts gain authority as Simulation Reliance rises.\n\n§YSimulation Reliance:§! §Y[?simulation_reliance|0]§! / [?constant:video_game_in_sweden_value.maximum|0] ([GetVideoGameRelianceState], next: [GetVideoGameNextRelianceThreshold])\n§YPhase:§! [GetVideoGamePhase]\n§YCurrent work:§! [GetVideoGameActiveMission]\n§YNext review:§! [GetVideoGameReassessment][GetVideoGamePublicCosts]"
