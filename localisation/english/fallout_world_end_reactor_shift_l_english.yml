fallout.event_log.reactor_shift.detail.choice_negotiate_safe_roster: "The East Asian technate negotiated a safe roster with its turbine operators."
fallout.event_log.reactor_shift.detail.choice_compel_duty_roster: "The East Asian technate compelled its turbine operators back to duty."
fallout.event_log.reactor_shift.detail.choice_cooldown_shutdown: "The reactor keep cooled its core before accepting an unsafe shift."
fallout.event_log.reactor_shift.detail.choice_recruit_foreign_team: "The reactor keep recruited a foreign repair team through the ash checkpoints."
fallout.event_log.reactor_shift.detail.negotiate_safe_roster_success: "The safe roster held and the safety board became a public technate record."
fallout.event_log.reactor_shift.detail.negotiate_safe_roster_partial: "The day roster held while the night crew kept one refusal clause outside the ledger."
fallout.event_log.reactor_shift.detail.negotiate_safe_roster_failure: "The roster conference broke during a redline alarm and the operators left the board."
fallout.event_log.reactor_shift.detail.compel_duty_roster_success: "The compelled roster restored output but left the operator trust ledger broken."
fallout.event_log.reactor_shift.detail.compel_duty_roster_partial: "Half the roster returned under command order while two operators hid their keys."
fallout.event_log.reactor_shift.detail.compel_duty_roster_failure: "A forced start damaged cooling controls and left no trusted hands behind the command seal."
fallout.event_log.reactor_shift.detail.cooldown_shutdown_success: "The core was cooled before the unsafe shift and shelter disease pressure eased."
fallout.event_log.reactor_shift.detail.cooldown_shutdown_partial: "A controlled low state held after one coolant pump jammed."
fallout.event_log.reactor_shift.detail.cooldown_shutdown_failure: "The shutdown began too late and the keep faced a dangerous restart or a long blackout."
fallout.event_log.reactor_shift.detail.recruit_foreign_team_success: "A foreign team restored capacity under a durable inspection and power compact."
fallout.event_log.reactor_shift.detail.recruit_foreign_team_partial: "A partial foreign team repaired turbine controls while local crews guarded the pumps."
fallout.event_log.reactor_shift.detail.recruit_foreign_team_failure: "The foreign team turned back at the ash checkpoint and the neighbor lost trust."
fallout.event_log.reactor_shift.detail.callback_success: "The first-winter review found rested operators and a legible safety record."
fallout.event_log.reactor_shift.detail.callback_partial: "The reactor survived winter, but its night crew and foreign inspection seat remained contested."
fallout.event_log.reactor_shift.detail.callback_failure: "The review found a spent reserve and an unresolved redline across the reactor board."
fallout.event_log.reactor_shift.detail.cancelled: "The reactor record was cancelled after its district, neighbor, owner, controller, or generation changed."
