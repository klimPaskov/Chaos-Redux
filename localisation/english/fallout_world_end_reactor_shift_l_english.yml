chaosx.fallout.810.t: "The Reactor Shift in the East Asian Keep"
chaosx.fallout.810.opening.d: "The Manchurian Reactor Keeps has reached the season after Load Shedding. A turbine crew is being asked to take an unsafe roster while the East Asian ash front closes the rail approaches. The operators have written four demands on the safety board. The technate can bargain for a safe rotation, compel the duty roster, cool the reactor and shut it down, or bring in a foreign team that will expect a place at the command table."
chaosx.fallout.810.a: "Negotiate a safe roster"
chaosx.fallout.810.a.tt: "Spend Food 2, Medicine 3, and Recognition 2 to publish a safe rotation. The operators gain trust, but the reactor keeps less power during each handover. A result arrives in 35 days and a first-winter review follows."
chaosx.fallout.810.b: "Compel the duty roster"
chaosx.fallout.810.b.tt: "Spend Fuel 3, Recognition 1, and Cohesion 4 to order the operators back to the board. The keep keeps more output if the order holds, but fatigue and public resentment rise. A result arrives in 35 days and a first-winter review follows."
chaosx.fallout.810.c: "Cool the reactor and shut down"
chaosx.fallout.810.c.tt: "Spend Scrap 2, Power 4, and Medicine 2 to cool the core before the unsafe shift. The keep loses output while the reactor is cold, but exposure and disease pressure can fall. A result arrives in 35 days and a first-winter review follows."
chaosx.fallout.810.d: "Recruit a foreign team"
chaosx.fallout.810.d.tt: "Spend Food 2, Fuel 4, and Recognition 3 to invite an outside repair team through the ash checkpoints. The team can restore capacity, but the neighbor will expect access and a durable share of the keep's power. A result arrives in 35 days and a first-winter review follows."
chaosx.fallout.811.t: "The Reactor Shift in the East Asian Keep"
chaosx.fallout.812.t: "The Reactor Shift Result"
chaosx.fallout.812.negotiate_safe_roster.success.d: "The operators accepted a safe rotation after the Manchurian Reactor Keeps published every handover and gave the night crew a veto over a redline shift. The turbine ran below peak output, but the safety board became a living record that the technate could not quietly rewrite."
chaosx.fallout.812.negotiate_safe_roster.partial.d: "The operators signed a safe rotation for the day watch, while the night crew kept one refusal clause outside the public ledger. The reactor stayed online with a narrow reserve, and the East Asian rail shelters now expect the next shift to be negotiated in daylight."
chaosx.fallout.812.negotiate_safe_roster.failure.d: "The roster conference broke when a redline alarm arrived during the vote. The operators left the board, the sterilizer circuit lost its reserve, and a toxic shift was ordered by a clerk who had no crew left to carry it."
chaosx.fallout.812.compel_duty_roster.success.d: "The command board compelled the duty roster and the operators returned under guard. Output rose long enough to refill the eastern water tanks, yet the order erased the crew's trust and made every future alarm a question of whether the next watch will obey."
chaosx.fallout.812.compel_duty_roster.partial.d: "The command order put half the roster back at the turbines. The keep gained a few hours of power, while two operators hid their keys and the public ration clerks began counting every forced shift as a debt against the technate."
chaosx.fallout.812.compel_duty_roster.failure.d: "The compelled roster reached the turbine hall and stopped at the first redline. A forced start damaged the cooling controls, consumed the last spare fuel, and left the keep with a working command seal but no trusted hands behind it."
chaosx.fallout.812.cooldown_shutdown.success.d: "The reactor was cooled before the unsafe shift and its heat was carried into sealed water stores. The Manchurian keep lost output for a week, but disease pressure eased in the shelter ring and the operators returned to a board that had chosen their lives over another bright night of production."
chaosx.fallout.812.cooldown_shutdown.partial.d: "The reactor reached a controlled low state after one coolant pump jammed. The East Asian rail spine received less power than promised, yet the crew kept the core stable and marked the failed pump for a reclamation team."
chaosx.fallout.812.cooldown_shutdown.failure.d: "The shutdown started after the unsafe shift had already begun. Coolant pressure fell through the old maintenance corridor, the reactor lost its reserve, and the keep must now choose between a dangerous restart and a long blackout across its shelters."
chaosx.fallout.812.recruit_foreign_team.success.d: "A foreign repair team crossed the ash checkpoint with sealed tools and a written access compact. The team restored operator capacity and a stable turbine rhythm, while the neighboring state received a durable inspection seat and a claim on the keep's spare power."
chaosx.fallout.812.recruit_foreign_team.partial.d: "The foreign team reached the reactor keep with only half its instruments. It repaired the turbine controls and left the cooling pumps under local supervision, creating a useful partnership that still depends on a neighbor's next convoy."
chaosx.fallout.812.recruit_foreign_team.failure.d: "The foreign team turned back when the rail checkpoint could not guarantee food or a safe return route. The keep paid for an empty journey, the operators lost another week of rest, and the neighbor now treats the reactor board as a promise that cannot be trusted."
chaosx.fallout.812.a: "Record the reactor settlement"
chaosx.fallout.812.a.tt: "Apply the delayed Reactor Shift result, update Air Winter and Supply Access, write the operator memory, record the bilateral opinion, and schedule the first-winter callback."
chaosx.fallout.814.t: "The First-Winter Reactor Review"
chaosx.fallout.814.success.d: "The first-winter review found a reactor board with a rested operator pool, a legible safety record, and enough reserve to answer a redline without opening the command vault. The Manchurian Reactor Keeps has not made the unsafe season safe, but its technate now knows who must be heard before the turbines turn."
chaosx.fallout.814.partial.d: "The first-winter review found a functioning reactor with a tired night crew and a safety record that still depends on one foreign inspection seat. The keep can meet the next ash front, though the operator trust ledger remains contested."
chaosx.fallout.814.failure.d: "The first-winter review found a reactor board that had spent its reserve and carried an unresolved redline. The operators are scattered between the shelter ring and the rail checkpoints, and the technate must rebuild a safe roster before another start can be defended."
chaosx.fallout.814.a: "Close the first-winter review"
chaosx.fallout.814.a.tt: "Apply the delayed review, update the operator ledgers and state receipts, record the final Reactor Shift memory, release the reserved district and neighbor rows, and clear the chain receipts."
