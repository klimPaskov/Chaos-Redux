chaosx.nr27.4.d: "Choices remaining: [?doctrine_research_batch_remaining_choices^doctrine_research_active_batch_index|0]. [GetDoctrineResearchDomainName] has no active Grand Doctrine. Choose one eligible doctrine to establish without spending experience. This uses one curriculum choice and does not advance a subdoctrine."
