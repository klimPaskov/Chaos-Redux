chaosx.nr27.1.t: "Master of War"

chaosx.nr27.2.t: "Master of War"
chaosx.nr27.2.d: "[ROOT.GetName] must choose the doctrine that will guide its armies. Mobile warfare, concentrated firepower, prepared battle plans, and mass assault each demand a different army."
chaosx.nr27.2.a: "Mobile Warfare"
chaosx.nr27.2.b: "Superior Firepower"
chaosx.nr27.2.c: "Grand Battleplan"
chaosx.nr27.2.e: "Mass Assault"

chaosx.news.28.t: "Master of War"
chaosx.news.28.d: "[FROM.GetName] has completed a new military doctrine and reorganized its forces around it. Other governments are studying the country's balance of fortifications, offensive power, and operational planning."
chaosx.news.28.a: "We must learn their tactics"
