chaosx.nr27.3.special_forces: "£GFX_special_forces_doctrine_medium Special Forces: [GetDoctrineResearchSpecialForcesGrandDoctrineName] ([?doctrine_research_domain_special_forces_track_count|0] tracks, [GetDoctrineResearchSpecialForcesNextAction])"
