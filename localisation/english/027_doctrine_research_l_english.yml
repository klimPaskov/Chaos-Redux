chaosx.events_log.evolution.type.doctrine_research: "Doctrine Research"
chaosx.events_log.window.event_details.doctrine_research: "Military academies across the world periodically receive a shared curriculum. Each curriculum grants one choice at first and as many as five in later stages. A choice can establish a Grand Doctrine or advance one eligible subdoctrine by one mastery step."
chaosx.events_log.window.event_details.doctrine_research.history.1: "The Foundational curriculum granted every participating country one doctrine choice."
chaosx.events_log.window.event_details.doctrine_research.history.2: "The Expanded curriculum granted every participating country two doctrine choices."
chaosx.events_log.window.event_details.doctrine_research.history.3: "The Advanced curriculum granted every participating country three doctrine choices."
chaosx.events_log.window.event_details.doctrine_research.history.4: "The Joint-Service curriculum granted every participating country four doctrine choices."
chaosx.events_log.window.event_details.doctrine_research.history.5: "The Comprehensive curriculum granted every participating country five doctrine choices."
