chaosx.nr27.10.t: "Doctrine Curriculum Complete"
chaosx.nr27.10.d: "The [GetDoctrineResearchStageName] curriculum is complete after [?doctrine_research_active_batch_size|0] choices. The staff established [?doctrine_research_active_batch_successful_adoptions|0] Grand Doctrines and achieved [?doctrine_research_active_batch_successful_mastery|0] mastery steps across [?doctrine_research_summary_distinct_domains|0] domains and [?doctrine_research_summary_distinct_tracks|0] tracks. Staff effort was [GetDoctrineResearchConcentrationStatus]. Grand Doctrine Milestone reached: [GetDoctrineResearchMilestoneStatus]."
