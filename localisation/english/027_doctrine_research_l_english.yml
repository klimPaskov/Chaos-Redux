chaosx.nr27.1.t: "Doctrine Research"
chaosx.nr27.2.t: "Doctrine Research"
chaosx.nr27.2.d: "[ROOT.GetName] has received a [GetDoctrineResearchStageName] curriculum with [?doctrine_research_active_batch_size|0] doctrine choices. Officers are comparing field experience and testing revised methods in service schools. Choices remaining: [?doctrine_research_batch_remaining_choices^doctrine_research_active_batch_index|0]. Each choice establishes one eligible Grand Doctrine without granting mastery, or advances one eligible subdoctrine by one mastery level. Later choices can deepen the same branch or develop other tracks."
chaosx.nr27.2.a: "£doctrine_mod Review the curriculum"
chaosx.nr27.2.a.tt: "Choose a doctrine domain without spending a curriculum choice."
chaosx.nr27.3.t: "Choose a Doctrine Domain"
chaosx.nr27.3.d: "The curriculum has [?doctrine_research_batch_remaining_choices^doctrine_research_active_batch_index|0] choices remaining. Choose one eligible doctrine domain. If the domain has no Grand Doctrine, you may establish one. Otherwise, you may advance one of its unfinished tracks."
