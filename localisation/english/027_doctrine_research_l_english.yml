chaosx.events_log.window.evolution_details.doctrine_research.title.stage_2: "Doctrine Research II: Advanced Curriculum"
chaosx.events_log.window.evolution_details.doctrine_research.title.stage_3: "Doctrine Research III: Joint-Service Curriculum"
chaosx.events_log.window.evolution_details.doctrine_research.title.stage_4: "Doctrine Research IV: Comprehensive Curriculum"
chaosx.events_log.window.evolution_details.doctrine_research.body.stage_1: "Each participating country receives two doctrine choices. A choice can establish one eligible Grand Doctrine or advance one eligible subdoctrine by one mastery step."
chaosx.events_log.window.evolution_details.doctrine_research.body.stage_2: "Each participating country receives three doctrine choices. These choices can deepen one branch or develop several eligible tracks."
chaosx.events_log.window.evolution_details.doctrine_research.body.stage_3: "Each participating country receives four doctrine choices. Countries with established Grand Doctrines can divide those choices among several eligible tracks."
chaosx.events_log.window.evolution_details.doctrine_research.body.stage_4: "Each participating country receives five doctrine choices. A country can complete one branch or spread its mastery across several eligible tracks."
