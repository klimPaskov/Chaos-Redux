# Evolutions, Event Details and achievements
# ---------------------------------------------------------------------------
industrial_boom.evolution.type: "Industrial Boom"
industrial_boom.evolution.1.title: "Speculative Mania"
industrial_boom.evolution.1.body: "Credit and confidence carry the boom past what the factories can deliver. Firms announce works before the materials exist, speculative projects are offered to the government, and restraining the banks costs stability."
industrial_boom.evolution.1.summary: "Credit and confidence make the boom stronger and harder to restrain."
industrial_boom.evolution.2.title: "The Industrial Miracle"
industrial_boom.evolution.2.body: "Chosen regions develop faster than their materials allow. Halls and railways are finished ahead of every schedule, and the works that grow this way leave greater gains behind, if they survive the pressure."
industrial_boom.evolution.2.summary: "Chosen regions develop faster than material limits allow."
industrial_boom.evolution.3.title: "Runaway Industrialization"
industrial_boom.evolution.3.body: "Industry spreads from its centres into neighbouring districts faster than any administration can follow. The government can direct the spread, let it run or contain it, and a collapse now drags the whole world economy down."
industrial_boom.evolution.3.summary: "Industry spreads into neighbouring states and becomes volatile."
chaosx.events_log.window.event_details.industrial_boom: "A major power or a player government experiences an industrial acceleration far beyond what its factories, railways and workers should allow. The extra output arrives at once. Keeping it from breaking the economy is the hard part, and a boom that is pushed too far ends in a depression."
chaosx.events_log.events.na_reason.industrial_boom_target: "\n§RUnavailable: no major power or player government can start a new industrial boom.§!"

industrial_boom_achievement_eligible_tooltip: "Available to a player country."
chaos_redux_034_the_long_fall_tooltip: "Survive the collapse of an Evolution III Industrial Boom, rescue an inherited industrial region, and recover without abandoning a Depression Center or losing the country."
chaos_redux_034_the_long_fall_NAME: "The Long Fall"
chaos_redux_034_the_long_fall_DESC: "Survive the full reversal from an Evolution III Industrial Boom into a severe Great Depression and rescue an inherited industrial region."
chaos_redux_034_managed_expansion_tooltip: "In one Industrial Boom, run the economy hot at least twice, reach the Strained band, then complete a controlled landing in the Sustainable band with at least two secured projects, or one if you have a single region."
chaos_redux_034_managed_expansion_NAME: "Managed Expansion"
chaos_redux_034_managed_expansion_DESC: "Push an Industrial Boom hard, then bring it down gently with lasting projects to show for it."
chaos_redux_034_miracle_holds_tooltip: "Under The Industrial Miracle or Runaway Industrialization, declare every one of at least two Industrial Regions a Miracle Region, secure every one, lose none, and complete a controlled landing without letting industry run unchecked."
chaos_redux_034_miracle_holds_NAME: "The Miracle Holds"
chaos_redux_034_miracle_holds_DESC: "Bring an impossible boom to a soft landing without losing a single Miracle Region."
chaos_redux_034_redline_nation_tooltip: "Spend at least 120 days in the Dangerous or Critical bands of one Industrial Boom, with 30 of those days in Critical. Never collapse, and complete a controlled or rough landing with at least one secured project."
chaos_redux_034_redline_nation_NAME: "Redline Nation"
chaos_redux_034_redline_nation_DESC: "Run an Industrial Boom at the edge of collapse for months and still land it."
chaos_redux_034_built_to_last_tooltip: "Complete two controlled landings in separate Industrial Booms with no collapse between them, each with at least one secured project, using two different project types across the two."
chaos_redux_034_built_to_last_NAME: "Built to Last"
chaos_redux_034_built_to_last_DESC: "Turn two separate booms into lasting industry."
