l_english:
chaosx.nr34.1.t: "Industrial Boom"

chaosx.nr34.2.t: "Industrial BOOM!"
chaosx.nr34.2.d: "Factories across our nation are expanding, hiring workers, and turning out goods at a rapid pace. New investment is strengthening transport, construction, and trade."
chaosx.nr34.2.a: "The factories are expanding."

chaosx.nr34.3.t: "Industrial Boom Landing"

chaosx.events_log.window.event_details.industrial_boom: "The expansion records its overheating, reserves, projects, supplier ties, regions, and reach. A hard landing turns those strengths and liabilities into the opening conditions of Great Depression 2.0."

chaosx.news.39.t: "Industrial Boom!"
chaosx.news.39.d: "[From.GetName] has expanded its factories, raised exports, and created new jobs across the country. The surge is making [From.GetName] a stronger industrial power."
chaosx.news.39.a: "The expansion is welcome."

industrial_boom_achievement_eligible_tooltip: "Available to a player country that carries an Industrial Boom through its full reversal and recovery."
chaos_redux_034_the_long_fall_tooltip: "Survive the collapse of an Evolution III Industrial Boom, rescue an inherited industrial region, and recover without abandoning a Depression Center or losing the country."
chaos_redux_034_the_long_fall_NAME: "The Long Fall"
chaos_redux_034_the_long_fall_DESC: "Survive the full reversal from an Evolution III Industrial Boom into a severe Great Depression and rescue an inherited industrial region."
