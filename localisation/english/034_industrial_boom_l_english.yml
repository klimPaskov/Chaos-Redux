l_english:
# ---------------------------------------------------------------------------
# Events
# ---------------------------------------------------------------------------
chaosx.nr34.1.t: "Industrial Boom"
chaosx.nr34.2.t: "The Order Books Clear"
chaosx.nr34.2.d: "Order books that were meant to last until the end of the decade are being cleared in a single season. Yards in [ROOT.industrial_boom_opening_region.GetName] run three shifts, rail sidings fill faster than the dispatchers can empty them, and new streets of workers' housing go up beside the older works. Ministries and firms are already arguing over who gets the next trainload of steel.\n\nThe extra output is ours to use. The factories, the railways and the people who run them can only carry it so far."
chaosx.nr34.2.d_speculative: "Every firm in the country seems to be announcing a new works. Banks lend against factories that exist only as drawings, and contracts are signed before the steel for them has been ordered. In [ROOT.industrial_boom_opening_region.GetName] the cranes never stop, and the newspapers print the share prices on the front page.\n\nOutput is rising faster than anyone planned, and so are the promises made on its behalf."
chaosx.nr34.2.d_miracle: "Engineers sent to inspect the works in [ROOT.industrial_boom_opening_region.GetName] report halls finished months ahead of schedule and machines installed before their delivery papers arrive. The figures check out, and nobody can explain how.\n\nThe factories are producing more than ever. Some of the people who run them would like to know where the materials came from."
chaosx.nr34.2.d_runaway: "Industry is no longer staying where it was planned. Around [ROOT.industrial_boom_opening_region.GetName], workshops and sidings appear in districts that have no permit for them, and local officials learn of new plants when the first trains arrive.\n\nThe country is producing at a pace it has never managed before, and the planners are already a step behind."
chaosx.nr34.2.a: "Put the new shifts to work."
chaosx.nr34.2.a_tt: "Factory output, efficiency growth and construction rise sharply while the boom holds.\nOverheating starts at §Y[?industrial_boom_overheating|0]§! ([GetIndustrialBoomBand]). The §YIndustrial Boom§! decisions manage it."
chaosx.nr34.3.t: "Industrial Boom Collapse"

chaosx.nr34.6.t: "Delays on Every Line"
chaosx.nr34.6.d: "Foremen in the works report missing parts, double shifts that run into a third, and families sleeping in the corridors of new housing blocks. Deliveries promised for Monday arrive on Thursday, and the managers of different plants now bid against each other for the same wagons."
chaosx.nr34.6.a: "Keep the lines moving."
chaosx.nr34.6.a_tt: "The boom is §YStrained§!. Part of the extra output is lost, serious incidents become possible and running the economy hot costs more."
chaosx.nr34.7.t: "The Works Begin to Fail"
chaosx.nr34.7.d: "A press line stopped this week when its frame cracked under a load it was never built for. Elsewhere, boiler inspections are being signed without anyone looking at the boilers, and two rail yards had to close after wagons were stacked on sidings that could not hold them. The men on the floor know the machines are being run past their limits."
chaosx.nr34.7.a: "We cannot let it go on like this."
chaosx.nr34.7.a_tt: "The boom is §RDangerous§!. Most of the extra output is lost, construction slows, new projects and running hot are locked, and the Emergency Production Halt is available."
chaosx.nr34.8.t: "On the Edge of Collapse"
chaosx.nr34.8.d: "Suppliers are refusing new orders, banks are calling in loans, and whole districts are waiting for parts that will not come. If the pressure keeps rising, the boom will break and take the economy with it."
chaosx.nr34.8.a: "Bring it down, whatever it costs."
chaosx.nr34.8.a_tt: "The boom is §RCritical§!. The §YPrevent the Crash§! mission starts: bring Overheating below §Y80§! within §Y60§! days or the economy collapses."

chaosx.nr34.9.t: "A Controlled Landing"
chaosx.nr34.9.d: "Shifts are cut back in stages and the emergency contracts run out one by one. The extraordinary output is over, but the works that were finished in time stay in service, and the rail yards empty at a pace the dispatchers can manage again."
chaosx.nr34.9.d_contract: "Shifts are cut back in stages as the emergency contracts run out. Orders from abroad keep the yards busy while the home market cools, so the plants that would have stood idle hand their capacity to foreign buyers instead. The boom ends without the layoffs everyone expected."
chaosx.nr34.9.a: "The boom has done its work."
chaosx.nr34.9.a_tt: "§Y[?industrial_boom_report_legacy|0]§! projects leave a lasting legacy. Output returns to normal over the next half year."
chaosx.nr34.10.t: "A Rough Landing"
chaosx.nr34.10.d: "The orders stop faster than the plants can adjust. Half-finished halls stand open to the weather, idle shifts gather at the gates, and suppliers chase payments for materials that will never be used."
chaosx.nr34.10.a: "We will rebuild from what is left."
chaosx.nr34.10.a_tt: "Only completed projects leave a legacy, at reduced strength. Industrial exhaustion slows output and construction for a year, and a later depression is more likely to start here."
chaosx.nr34.11.t: "Production Halted"
chaosx.nr34.11.d: "By government order the boom is stopped at once. Furnaces are banked, emergency contracts are torn up and every unfinished project is abandoned where it stands. The economy has been spared a collapse, and the factories will take a long time to start again."
chaosx.nr34.11.a: "It had to be done."
chaosx.nr34.11.a_tt: "No project leaves a legacy. Industrial exhaustion slows output and construction for two years, and a later depression is more likely to start here."

chaosx.nr34.12.t: "Orders from Abroad"
chaosx.nr34.12.d: "A government struggling with its own depression has placed a large contract with our firms. The plants will have more work than they can comfortably carry, and the foreign orders will keep them busy after our own demand begins to fall."
chaosx.nr34.12.a: "Fill the orders."
chaosx.nr34.12.a_tt: "Overheating rises now. Export orders raise factory output for §Y120§! days, and a rough landing during the contract becomes a controlled one."

chaosx.nr34.13.t: "Speculative Mania"
chaosx.nr34.13.d: "Confidence has turned into something else. Companies announce new works before they have land to build on, banks treat next year's capacity as this year's wealth, and every attempt to slow the orders is attacked in the papers as a betrayal of national progress."
chaosx.nr34.13.a: "Who are we to stand in the way?"
chaosx.nr34.13.a_tt: "The boom produces more and overheats faster. Speculative projects will be offered, and cooling the economy now means imposing credit restraint at a cost in stability."
chaosx.nr34.14.t: "The Industrial Miracle"
chaosx.nr34.14.d: "Inspectors in [industrial_boom_abnormal_region.GetName] have found a rolling mill working at full capacity that, according to every record, was still a foundation pit a month ago. The workers say they simply kept building, and the delivery ledgers show materials that no supplier remembers sending."
chaosx.nr34.14.a: "Put the inspectors' report away."
chaosx.nr34.14.a_tt: "Industrial Regions with a project can be declared Miracle Regions: their projects advance twice as fast and leave a greater legacy, and they turn fragile once Overheating reaches §Y70§!."
chaosx.nr34.15.t: "Runaway Industrialization"
chaosx.nr34.15.d: "New works are rising in the districts around our Industrial Regions without anyone having approved them. Rail spurs run into fields, sheds become factories, and local officials ask the capital whether they should register the new plants or tear them down."
chaosx.nr34.15.a: "Direct the spread."
chaosx.nr34.15.a_tt: "One neighbouring state per region may expand. Spread states can be integrated and keep their new rail and roads after a controlled landing."
chaosx.nr34.15.b: "Let it run."
chaosx.nr34.15.b_tt: "Every valid neighbouring state expands, even near the front. Output is highest and pressure rises fastest, and spread states keep nothing after the boom."
chaosx.nr34.15.c: "Contain it."
chaosx.nr34.15.c_tt: "Nothing spreads. Output and stability fall for a while, and the landing outlook is best."

chaosx.nr34.16.t: "An Industrial Project"
chaosx.nr34.16.d: "The ministry has drawn up three plans for [industrial_boom_designate_target.GetName]. Each will tie up civilian factories until the first works are built, and each leaves something different behind if the boom lands well."
chaosx.nr34.16.cancel: "Not yet."
chaosx.nr34.16.a: "Production Practices"
chaosx.nr34.16.a_tt: "Costs £support_equipment_text_icon §Y[?industrial_boom_cost_project_support|0]§! and £civ_factory §Y[?industrial_boom_cost_project_civilian|0]§! while building.\nFaster efficiency growth and lower finance pressure. Legacy: lasting efficiency and line-conversion gains."
chaosx.nr34.16.b: "Rail and Supply Integration"
chaosx.nr34.16.b_tt: "Costs £GFX_train_texticon §Y[?industrial_boom_cost_project_trains|0]§! and £civ_factory §Y[?industrial_boom_cost_project_civilian|0]§! while building.\nLower supply pressure. Legacy: infrastructure and a railway to the capital, and less lost output from resource shortages."
chaosx.nr34.16.c: "Factory Conversion"
chaosx.nr34.16.c_tt: "Costs £support_equipment_text_icon §Y[?industrial_boom_cost_project_support|0]§! and £civ_factory §Y[?industrial_boom_cost_project_civilian|0]§! while building.\nFaster construction. Legacy: a building slot and a factory in the region, while the country's legacy budget lasts."
chaosx.nr34.17.t: "Declare a Miracle Region"
chaosx.nr34.17.d: "The works in some of our regions are running ahead of anything the engineers can account for. We can treat one of them as a Miracle Region and build as if the schedule were real."
chaosx.nr34.17.cancel: "Not yet."
chaosx.nr34.17.a: "[industrial_boom_miracle_choice_1.GetName]"
chaosx.nr34.17.a_tt: "The project in [industrial_boom_miracle_choice_1.GetName] advances twice as fast, strains the region twice as hard and leaves a greater legacy."
chaosx.nr34.17.b: "[industrial_boom_miracle_choice_2.GetName]"
chaosx.nr34.17.b_tt: "The project in [industrial_boom_miracle_choice_2.GetName] advances twice as fast, strains the region twice as hard and leaves a greater legacy."
chaosx.nr34.17.c: "[industrial_boom_miracle_choice_3.GetName]"
chaosx.nr34.17.c_tt: "The project in [industrial_boom_miracle_choice_3.GetName] advances twice as fast, strains the region twice as hard and leaves a greater legacy."

chaosx.nr34.20.t: "Rail Congestion"
chaosx.nr34.20.d: "Freight for [industrial_boom_incident_region.GetName] is backed up for miles. Loaded wagons wait on the main line while empty ones cannot get back to the yards, and the project there is losing days."
chaosx.nr34.20.a: "Send more trains."
chaosx.nr34.20.a_tt: "Costs £GFX_train_texticon §Y[?industrial_boom_cost_incident_trains|0]§!. Overheating falls."
chaosx.nr34.20.b: "Let the backlog clear."
chaosx.nr34.20.b_tt: "The project in [industrial_boom_incident_region.GetName] loses two weeks."
chaosx.nr34.21.t: "Material Shortfall"
chaosx.nr34.21.d: "Steel, copper and rubber are running short. Some works have stopped taking deliveries because there is nothing left to deliver, and the purchasing offices are trying to buy abroad at any price."
chaosx.nr34.21.a: "Run emergency convoys."
chaosx.nr34.21.a_tt: "Costs £convoy_texticon §Y[?industrial_boom_cost_convoys|0]§!. Overheating falls."
chaosx.nr34.21.b: "Burn the fuel to bring it in."
chaosx.nr34.21.b_tt: "Costs £GFX_fuel_texticon §Y[?industrial_boom_cost_fuel|0]§!. Overheating falls."
chaosx.nr34.21.c: "Let a project stall."
chaosx.nr34.21.c_tt: "A project loses three weeks and Overheating rises slightly."
chaosx.nr34.22.t: "Plant Accident"
chaosx.nr34.22.d: "A crane collapsed at a works in [industrial_boom_incident_region.GetName] during a night shift. Several men were hurt, and the line beneath it is wrecked. The management wants to clear the debris and carry on."
chaosx.nr34.22.a: "Repair it and compensate the families."
chaosx.nr34.22.a_tt: "Costs £support_equipment_text_icon §Y[?industrial_boom_cost_incident_support|0]§!. Overheating falls."
chaosx.nr34.22.b: "Keep the line running."
chaosx.nr34.22.b_tt: "Overheating rises sharply."
chaosx.nr34.23.t: "Labour Dispute"
chaosx.nr34.23.d: "Workers in several plants have stopped work over the hours and the housing. They say they will go back when the third shift is dropped and the barracks are heated."
chaosx.nr34.23.a: "Meet their demands."
chaosx.nr34.23.a_tt: "Factory output falls for §Y30§! days. Overheating falls."
chaosx.nr34.23.b: "Order them back to work."
chaosx.nr34.23.b_tt: "Costs £pol_power §Y[?industrial_boom_cost_political_power|0]§! and some stability. Overheating rises slightly."
chaosx.nr34.24.t: "Maintenance Failure"
chaosx.nr34.24.d: "Engineers in [industrial_boom_incident_region.GetName] report that the main shafts and bearings have not been serviced since the boom began. One of them will fail soon. Shutting the plant now will cost the project time."
chaosx.nr34.24.a: "Shut it down for repairs."
chaosx.nr34.24.a_tt: "The project in [industrial_boom_incident_region.GetName] falls back a stage. Overheating falls."
chaosx.nr34.24.b: "Keep it running."
chaosx.nr34.24.b_tt: "In about two months the failure will hit hard, unless a held reserve absorbs it."
chaosx.nr34.25.t: "Order-Book Frenzy"
chaosx.nr34.25.d: "Every ministry, every firm and every foreign buyer insists its orders come first. The plants are accepting all of them, and nothing is being finished on time."
chaosx.nr34.25.a: "Set priorities and enforce them."
chaosx.nr34.25.a_tt: "Factory output falls for §Y30§! days. Overheating falls."
chaosx.nr34.25.b: "Let the delays pile up."
chaosx.nr34.25.b_tt: "Overheating rises sharply."
chaosx.nr34.26.t: "The Profitable Shell"
chaosx.nr34.26.d: "An auditor has found that the speculative works in [industrial_boom_incident_region.GetName] are mostly paper. Its shares are trading well, but the halls behind them are half empty."
chaosx.nr34.26.a: "Expose it."
chaosx.nr34.26.a_tt: "The speculative project in [industrial_boom_incident_region.GetName] is cancelled and its progress is lost."
chaosx.nr34.26.b: "Keep backing it."
chaosx.nr34.26.b_tt: "Nothing happens now. The truth will come out within a few months, and it will cost us."
chaosx.nr34.27.t: "Restraint Backlash"
chaosx.nr34.27.d: "Credit restraint has made enemies quickly. Industrialists denounce it in the press, and deputies demand that the banks be allowed to lend again."
chaosx.nr34.27.a: "Hold the line."
chaosx.nr34.27.a_tt: "Stability falls. Overheating falls."
chaosx.nr34.27.b: "Loosen the restraint."
chaosx.nr34.27.b_tt: "Credit restraint ends early and Overheating rises."
chaosx.nr34.28.t: "The Railway Completed Overnight"
chaosx.nr34.28.d: "The new line serving [industrial_boom_incident_region.GetName] is finished. Yesterday the survey crews were still marking the route. The rails are laid, the ballast is packed, and nobody can say who did the work."
chaosx.nr34.28.a: "Inspect every mile before it is used."
chaosx.nr34.28.a_tt: "The project in [industrial_boom_incident_region.GetName] loses two weeks. Overheating falls slightly."
chaosx.nr34.28.b: "Put it into service."
chaosx.nr34.28.b_tt: "The project advances by a month, and the region stays fragile for three months."
chaosx.nr34.29.t: "Materials That Should Not Exist"
chaosx.nr34.29.d: "The stores at [industrial_boom_incident_region.GetName] hold crates of finished components that no supplier invoiced and no ship or train delivered. They are of excellent quality."
chaosx.nr34.29.a: "Use them."
chaosx.nr34.29.a_tt: "The project advances by a month. Overheating rises slightly."
chaosx.nr34.29.b: "Lock the stores and keep them out of the works."
chaosx.nr34.29.b_tt: "The project loses three weeks. Overheating falls slightly."
chaosx.nr34.30.t: "The Impossible Schedule"
chaosx.nr34.30.d: "The works in [industrial_boom_incident_region.GetName] are meeting a schedule that the engineers who wrote it never expected to be met. Output reports arrive daily, each higher than the last."
chaosx.nr34.30.a: "Push it as far as it will go."
chaosx.nr34.30.a_tt: "The project advances by a month. Overheating rises sharply."
chaosx.nr34.30.b: "Hold the region to its rated capacity."
chaosx.nr34.30.b_tt: "Overheating falls slightly."
chaosx.nr34.31.t: "The Unplanned Works"
chaosx.nr34.31.d: "Officials in [industrial_boom_incident_region.GetName] have found a new plant on the edge of the town. It has a workforce, a siding and a full order book, and no record of anyone having approved it."
chaosx.nr34.31.a: "Recognise the works."
chaosx.nr34.31.a_tt: "The spread in [industrial_boom_incident_region.GetName] advances by a month. Overheating rises."
chaosx.nr34.31.b: "Dismantle them."
chaosx.nr34.31.b_tt: "[industrial_boom_incident_region.GetName] stops spreading. Overheating falls."
chaosx.nr34.32.t: "The Railway That Keeps Growing"
chaosx.nr34.32.d: "A branch line into [industrial_boom_incident_region.GetName] has been extended three times without orders. Each new section connects another workshop that nobody planned."
chaosx.nr34.32.a: "Integrate the line properly."
chaosx.nr34.32.a_tt: "Costs £GFX_train_texticon §Y[?industrial_boom_cost_incident_trains|0]§!. [industrial_boom_incident_region.GetName] is integrated at once."
chaosx.nr34.32.b: "Leave it as it is."
chaosx.nr34.32.b_tt: "Overheating rises."
chaosx.nr34.33.t: "Network Cascade"
chaosx.nr34.33.d: "A breakdown in one of the new districts is spreading along the lines that connect it to the rest. Power, freight and parts fail one after another as each works pulls on the next."
chaosx.nr34.33.a: "Spend the reserve to contain it."
chaosx.nr34.33.a_tt: "The Industrial Reserve is spent and the cascade stops."
chaosx.nr34.33.b: "Let it run its course."
chaosx.nr34.33.b_tt: "Overheating rises sharply."

chaosx.news.39.t: "Factories Run Day and Night in [From.GetName]"
chaosx.news.39.d: "Visitors to [From.GetName] describe rail yards full to the horizon, new workers' districts rising beside the old works and factories that no longer close at night. Foreign buyers who waited years for delivery are being told their orders will ship this season.\n\nNeighbouring governments are watching the figures closely, and some of their industrialists are asking how long such a pace can last."
chaosx.news.39.a: "Remarkable."

