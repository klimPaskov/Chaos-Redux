industrial_boom_outlook_controlled: "Landing outlook: §Ga controlled landing§!. Keeping Overheating below §Y40§! would hold it."
industrial_boom_outlook_contract: "Landing outlook: §Ga controlled landing§!. Foreign orders would absorb the slack."
industrial_boom_outlook_secure_project: "Landing outlook: §Ya rough landing§!. Securing a project would improve it."
industrial_boom_outlook_designate: "Landing outlook: §Ya rough landing§!. Designating an industrial project would improve it."
industrial_boom_outlook_cool: "Landing outlook: §Ya rough landing§!. Bringing Overheating below §Y40§! would improve it."

# ---------------------------------------------------------------------------
# Decisions
# ---------------------------------------------------------------------------
industrial_boom_run_hot: "Run the Economy Hot"
industrial_boom_run_hot_desc: "Firms, ministries and procurement offices accept every order and put off maintenance. The real price is risk."
industrial_boom_run_hot_tt: "For §Y60§! days factory output, efficiency growth and project progress rise strongly.\nOverheating rises now and faster for the whole period. It costs more in the §YStrained§! band."
industrial_boom_run_hot_band_tt: "Overheating is below §Y70§!, the boom is not landing and the economy is not cooling or recovering from a crash scare"
industrial_boom_stabilize_supply: "Stabilize Supply Chains"
industrial_boom_stabilize_supply_desc: "Transport and procurement authorities commit scarce movement capacity to the worst links."
industrial_boom_stabilize_supply_tt: "Overheating falls, by much more when supply is the main pressure. Supply pressure eases for §Y60§! days.\nFrom the §ODangerous§! band upward it costs more, relieves more and shields against the next supply shock for §Y30§! days. A heavy blockade halves the relief."
industrial_boom_build_reserve: "Build an Industrial Reserve"
industrial_boom_build_reserve_desc: "Machine time, spare parts and repair stores are deliberately left unused."
industrial_boom_build_reserve_tt: "For §Y90§! days factory output falls and £civ_factory §Y[?industrial_boom_cost_reserve_civilian|0]§! civilian factories are committed. Overheating falls slightly.\nAfterwards the reserve is held: it absorbs most of the next severe shock, improves a controlled landing and softens a depression."
industrial_boom_build_reserve_done_tt: "The Industrial Reserve is held."
industrial_boom_cool_expansion: "Cool the Expansion"
industrial_boom_cool_expansion_desc: "The government restrains credit, delays contracts and reduces shifts."
industrial_boom_cool_expansion_tt: "Overheating falls sharply. For §Y60§! days most of the extra output is suppressed, projects slow and pressure builds more slowly."
industrial_boom_credit_restraint: "Impose Credit Restraint"
industrial_boom_credit_restraint_desc: "The banks are ordered to stop lending against factories that do not yet exist. Nobody will thank us for it."
industrial_boom_credit_restraint_tt: "Stability falls. Overheating falls sharply. For §Y60§! days most of the extra output is suppressed, projects slow and speculation stops adding pressure."
industrial_boom_prepare_landing: "Prepare a Controlled Landing"
industrial_boom_prepare_landing_desc: "Contracts are wound down in stages so the works can return to normal without breaking."
industrial_boom_prepare_landing_tt: "Starts the landing. Running hot, new projects and speculative offers close until it ends."
industrial_boom_controlled_landing_mission: "Controlled Landing"
industrial_boom_controlled_landing_mission_desc: "Keep Overheating below §Y70§!, keep the project regions under our control, and finish or abandon the projects still under way. Below §Y40§! with a secured project the landing is controlled. Otherwise it is rough."
industrial_boom_landing_cancelled_tt: "The landing fails and the boom runs on. A new landing can be prepared after §Y60§! days."
industrial_boom_landing_mission_timeout_tt: "The boom ends. The outcome depends on Overheating and the projects secured by then."
industrial_boom_prevent_crash_mission: "Prevent the Crash"
industrial_boom_prevent_crash_mission_desc: "Bring Overheating below §Y80§! before the economy breaks."
industrial_boom_prevent_crash_success_tt: "The boom survives. The economy cannot run hot for §Y90§! days."
industrial_boom_prevent_crash_failure_tt: "The boom collapses into a depression."
industrial_boom_emergency_halt: "Emergency Production Halt"
industrial_boom_emergency_halt_desc: "Stop the boom at once by government order. [GetIndustrialBoomHaltOutlook]"
industrial_boom_halt_reserve: "§GThe held reserve will carry the halt.§!"
industrial_boom_halt_protected: "§GA protected region will carry the halt while Overheating stays below 90.§!"
industrial_boom_halt_fails: "§RWithout a held reserve, or a protected region below 90, the halt will fail and the economy will crash.§!"
industrial_boom_emergency_halt_success_tt: "The boom ends at once. Every project is cancelled without legacy and industrial exhaustion lasts two years."
industrial_boom_emergency_halt_failure_tt: "The halt fails and the boom collapses into a depression."
industrial_boom_speculative_expansion: "Approve a Speculative Expansion"
industrial_boom_speculative_expansion_desc: "A consortium offers to build [GetIndustrialBoomOfferName] in [ROOT.industrial_boom_speculative_offer_state.GetName] at once, financed against the profits it will make."
industrial_boom_speculative_expansion_tt: "The project starts already integrating and leaves a greater legacy. Until it is secured or abandoned it adds heavy finance pressure, and abandoning it brings large relief."
industrial_boom_offer_district: "a new factory district"
