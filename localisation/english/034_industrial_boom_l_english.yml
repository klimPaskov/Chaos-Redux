l_english:
chaosx.nr34.1.t: "Industrial Boom"

chaosx.nr34.2.t: "Industrial BOOM!"
chaosx.nr34.2.d: "Factories across our nation are expanding, hiring workers, and turning out goods at a rapid pace. New investment is strengthening transport, construction, and trade."
chaosx.nr34.2.a: "The factories are expanding."

chaosx.news.39.t: "Industrial Boom!"
chaosx.news.39.d: "[From.GetName] has expanded its factories, raised exports, and created new jobs across the country. The surge is making [From.GetName] a stronger industrial power."
chaosx.news.39.a: "The expansion is welcome."
