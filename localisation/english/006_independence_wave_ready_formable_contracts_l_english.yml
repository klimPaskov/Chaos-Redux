independence_wave_ready_formable_routes_category: "Regional Federation Proposals"
independence_wave_ready_formable_routes_category_desc: "Convene a regional federation once its governments hold their founding capitals and can reach the congress."
independence_wave_ready_formable_convene_north_caucasian_congress: "Convene the North Caucasian Congress"
independence_wave_ready_formable_convene_north_caucasian_congress_desc: "Bring Circassia, Chechnya, and Dagestan to a defensive congress. The proposed charter joins mountain defense with strong local authority and keeps every member government sovereign."
independence_wave_ready_formable_form17_requirements_tt: "Circassia, Chechnya, and Dagestan must each control their founding capital, remain at peace with the convener, and have a diplomatic or direct connection to the congress."
independence_wave_ready_formable_open_indus_federal_conference: "Open the Indus Federal Conference"
independence_wave_ready_formable_open_indus_federal_conference_desc: "Invite Punjab, Sindh, Balochistan, and Pashtunistan to settle water shares, rail corridors, language administration, and federal army command. Each member retains its territory and institutions unless it later agrees to a different settlement."
independence_wave_ready_formable_form32_requirements_tt: "Punjab must hold West Punjab or East Punjab; Sindh must hold Sind; Balochistan must hold Kalat; and Pashtunistan must hold Peshawar. Each member must be connected to the convener."
independence_wave_ready_formable_convene_maritime_congress: "Convene the Maritime Congress"
independence_wave_ready_formable_convene_maritime_congress_desc: "Bring Aceh, the Bugis state, and Bali together to settle shipping schedules, customs, naval command, and island autonomy. Every member remains sovereign unless it chooses to join the charter."
independence_wave_ready_formable_form36_requirements_tt: "Aceh, the Bugis state, and Bali must each control their founding port capital. The convener must hold convoy reserves, and each member must be connected and at peace."
independence_wave_ready_formable_open_mainland_federal_conference: "Open the Mainland Federal Conference"
independence_wave_ready_formable_open_mainland_federal_conference_desc: "Invite Mon State, the Shan federation, and Kachin State to agree on strong member autonomy, transport coordination, and a joint command charter. The convener must follow a federal route while the members hold their own capitals."
independence_wave_ready_formable_form37_requirements_tt: "Mon State, the Shan federation, and Kachin State must each control their founding capital, remain at peace with the convener, and be connected to the federal conference. Their former administrations must no longer control those capitals."
independence_wave_ready_formable_route_registered_tt: "The federation can begin its founding congress. Every member keeps its government, territory and armed forces."
independence_wave_ready_formable_abandon_unopened_contract: "Withdraw Unopened Federation Plan"
independence_wave_ready_formable_abandon_unopened_contract_desc: "Withdraw our proposal before the founding congress opens, leaving us free to seek another agreement."
independence_wave_ready_formable_abandon_unopened_contract_tt: "Withdraw our proposed federation. Every member keeps its government and territory."
independence_wave_ready_formable_abandon_unopened_requirements_tt: "We may withdraw before opening the founding congress or inviting its governments."

chaosx.nr6.8617.t: "A Federation Charter Arrives"
chaosx.nr6.8617.desc: "[?independence_wave_ready_formable_popup_carrier.GetNameDefCap] invites us to join a regional federation. We would share defence duties while keeping our government, territory and armed forces. If we do not answer within thirteen days, the invitation is refused."
chaosx.nr6.8617.stale.tt: "This invitation has ended. Closing it gives no reply to another proposal."
chaosx.nr6.8617.a: "Decline the invitation"
chaosx.nr6.8617.a.tt: "The government refuses the founding proposal and remains outside the federation. No state or country changes hands."
chaosx.nr6.8617.b: "Join as a sovereign member"
chaosx.nr6.8617.b.tt: "The government consents to sovereign membership. Its national identity, territory, armed forces, and institutions remain under its own authority."

independence_wave_form17_charter: "Mountain Defense and Autonomy Charter"
independence_wave_form17_charter_desc: "The North Caucasian Federation coordinates mountain defense while preserving the authority of its constituent governments. The founding settlement supports a unified defense command, shared stability, and local autonomy."
independence_wave_form17_autonomous_member: "North Caucasian Sovereign Member"
independence_wave_form17_autonomous_member_desc: "This country has accepted the federation as a sovereign member. Its government, territory, armed forces, and focus content remain its own; reciprocal access and guarantees support the common defense."
independence_wave_form32_charter: "Indus Water, Rail, Language, and Army Settlement"
independence_wave_form32_charter_desc: "The Indus Federation coordinates river shares, rail corridors, language administration, and federal army command. The settlement keeps constituent governments in control of their own territory."
independence_wave_form32_autonomous_member: "Indus Sovereign Member Compact"
independence_wave_form32_autonomous_member_desc: "This country has accepted the Indus Federation as a sovereign member. Water, transport, language, and defense questions are settled through the compact while local authority remains intact."
independence_wave_form36_charter: "Maritime Shipping and Customs Charter"
independence_wave_form36_charter_desc: "The Maritime Federation coordinates shipping, customs, and naval command across its ports while preserving island autonomy. Its charter depends on member access and a maintained convoy reserve."
independence_wave_form36_autonomous_member: "Maritime Autonomous Member"
independence_wave_form36_autonomous_member_desc: "This country has joined the Maritime Federation as a sovereign island member. Its territory and institutions remain local while shipping schedules, customs access, and defense are coordinated by consent."
independence_wave_form37_charter: "Mainland Autonomy and Transport Charter"
independence_wave_form37_charter_desc: "The Mainland Southeast Asian Federation links its members through transport coordination and a joint command while reserving broad authority to each constituent government."
independence_wave_form37_autonomous_member: "Mainland Federal Autonomous Member"
independence_wave_form37_autonomous_member_desc: "This country has joined the Mainland Southeast Asian Federation as a sovereign member. It keeps its government, territory, armed forces, and institutions while sharing transport coordination and command through the charter."

independence_wave_ready_formable_integration_category: "Federation Integration Projects"
independence_wave_ready_formable_integration_category_desc: "Fund the two sovereignty-preserving integration projects after a federation is formed."
independence_wave_ready_formable_integration_stage_resolved_tt: "The project succeeds while our government and members hold their founding capitals and keep their agreed connections. Resources already spent are not returned if those terms fail."

independence_wave_ready_formable_form17_stage1_mountain_defense: "Coordinate Mountain Defense"
independence_wave_ready_formable_form17_stage1_mountain_defense_desc: "Fund a common defense plan for the Caucasus passes and mountain approaches. The project strengthens the federal government and the sovereign members whose councils are already part of the compact."
independence_wave_ready_formable_form17_stage1_requirements_tt: "Our government must hold its founding capital. Circassia, Chechnya and Dagestan must hold theirs and remain connected to the federation."
independence_wave_ready_formable_form17_stage2_autonomy_charter: "Ratify Mountain Autonomy Guarantees"
independence_wave_ready_formable_form17_stage2_autonomy_charter_desc: "With every member government consenting, ratify local jurisdiction, protected mountain transit, and a shared defense command that leaves each member sovereign."
independence_wave_ready_formable_form17_stage2_requirements_tt: "The first defense project must be complete, all three member governments must have consented, and all founding capitals must remain under member control and connected to our government."

independence_wave_ready_formable_form32_stage1_water_and_rail_board: "Seat the Indus Water and Rail Board"
independence_wave_ready_formable_form32_stage1_water_and_rail_board_desc: "Fund a common board to settle water shares and coordinate through-rail schedules. Punjab, Sindh, Balochistan and Pashtunistan must hold their founding capitals and keep their connections open."
independence_wave_ready_formable_form32_stage1_requirements_tt: "Our government must retain its agreed political settlement. Punjab, Sindh, Balochistan and Pashtunistan must hold their founding capitals and remain connected."
independence_wave_ready_formable_form32_stage2_language_and_army_settlement: "Settle Language and Army Rules"
independence_wave_ready_formable_form32_stage2_language_and_army_settlement_desc: "With all four governments consenting, ratify language administration, water arbitration, and the command rules for forces that remain under their own national authorities."
independence_wave_ready_formable_form32_stage2_requirements_tt: "The water and rail board must be seated, all four member governments must have consented, and all founding capitals must remain connected and under member control."

independence_wave_ready_formable_form36_stage1_archipelago_shipping_schedule: "Adopt Archipelago Shipping Schedule"
independence_wave_ready_formable_form36_stage1_archipelago_shipping_schedule_desc: "Commit convoy capacity and diplomatic command to a shared schedule linking Aceh, the Bugis state, and Bali while each government retains its own port and authority."
independence_wave_ready_formable_form36_stage1_requirements_tt: "Aceh, the Bugis state, and Bali must keep their founding port capitals and naval bases. Our government must hold convoy reserves and every member must remain connected and at peace."
independence_wave_ready_formable_form36_stage2_customs_and_island_autonomy: "Ratify Customs and Island Autonomy"
independence_wave_ready_formable_form36_stage2_customs_and_island_autonomy_desc: "With all three governments consenting, coordinate customs procedures and naval command while protecting each island member's local jurisdiction."
independence_wave_ready_formable_form36_stage2_requirements_tt: "The shipping schedule must be adopted, all three member governments must have consented, and the connected port capitals and naval bases must remain under member control."

independence_wave_ready_formable_form37_stage1_mainland_transport_authority: "Found the Mainland Transport Board"
independence_wave_ready_formable_form37_stage1_mainland_transport_authority_desc: "Fund a cross-border transport authority to coordinate the mainland's rail, road, and river corridors without transferring a member's territory or administration."
independence_wave_ready_formable_form37_stage1_requirements_tt: "Our government must retain its federal settlement. Mon State, the Shan federation and Kachin State must hold their founding capitals and remain connected."
independence_wave_ready_formable_form37_stage2_joint_command_and_autonomy: "Ratify Joint Command and Autonomy"
independence_wave_ready_formable_form37_stage2_joint_command_and_autonomy_desc: "With every member government consenting, coordinate defense command while guaranteeing each member authority over its institutions, forces, and local administration."
independence_wave_ready_formable_form37_stage2_requirements_tt: "The transport authority must be established, all three member governments must have consented, and the founding capitals must remain connected and under member control."

independence_wave_form17_charter_stage1: "Mountain Defense Coordination"
independence_wave_form17_charter_stage1_desc: "A paid defense project links the federation's mountain approaches while preserving member sovereignty."
independence_wave_form17_charter_stage2: "Mountain Autonomy and Defense Compact"
independence_wave_form17_charter_stage2_desc: "Every member government has ratified local jurisdiction, protected transit, and shared mountain defense."
independence_wave_form17_autonomous_member_stage1: "North Caucasian Defense Member"
independence_wave_form17_autonomous_member_stage1_desc: "This sovereign member participates in the funded mountain defense plan while retaining its government and territory."
independence_wave_form17_autonomous_member_stage2: "North Caucasian Autonomy Member"
independence_wave_form17_autonomous_member_stage2_desc: "This sovereign member has ratified local jurisdiction and protected transit within the common defense compact."

independence_wave_form32_charter_stage1: "Indus Water and Rail Coordination"
independence_wave_form32_charter_stage1_desc: "A paid board coordinates river shares and rail schedules across the federation."
independence_wave_form32_charter_stage2: "Indus Language and Army Settlement"
independence_wave_form32_charter_stage2_desc: "All admitted governments have ratified language administration, water arbitration, and a command compact that preserves their forces."
independence_wave_form32_autonomous_member_stage1: "Indus Water and Rail Member"
independence_wave_form32_autonomous_member_stage1_desc: "This sovereign member participates in the funded water and rail board while retaining its territory and administration."
independence_wave_form32_autonomous_member_stage2: "Indus Language and Army Member"
independence_wave_form32_autonomous_member_stage2_desc: "This sovereign member has ratified the federation's language and army rules while preserving local command."

independence_wave_form36_charter_stage1: "Archipelago Shipping Coordination"
independence_wave_form36_charter_stage1_desc: "A paid shipping schedule links the federation's ports while keeping every island government sovereign."
independence_wave_form36_charter_stage2: "Maritime Customs and Autonomy Charter"
independence_wave_form36_charter_stage2_desc: "All admitted governments have ratified customs procedures and naval coordination while preserving island jurisdiction."
independence_wave_form36_autonomous_member_stage1: "Maritime Shipping Member"
independence_wave_form36_autonomous_member_stage1_desc: "This sovereign island member participates in the funded archipelago shipping schedule."
independence_wave_form36_autonomous_member_stage2: "Maritime Customs Member"
independence_wave_form36_autonomous_member_stage2_desc: "This sovereign island member has ratified customs coordination and local jurisdiction within the maritime compact."

independence_wave_form37_charter_stage1: "Mainland Transport Coordination"
independence_wave_form37_charter_stage1_desc: "A paid authority coordinates transport links among the federation's sovereign mainland members."
independence_wave_form37_charter_stage2: "Mainland Joint Command and Autonomy"
independence_wave_form37_charter_stage2_desc: "All admitted governments have ratified joint command while protecting their institutions, armed forces, and local authority."
independence_wave_form37_autonomous_member_stage1: "Mainland Transport Member"
independence_wave_form37_autonomous_member_stage1_desc: "This sovereign member participates in the funded mainland transport authority."
independence_wave_form37_autonomous_member_stage2: "Mainland Command and Autonomy Member"
independence_wave_form37_autonomous_member_stage2_desc: "This sovereign member has ratified the joint command and strong autonomy charter."

