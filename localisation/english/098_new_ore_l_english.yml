l_english:
chaosx.nr98.1.t: "New ore"

chaosx.nr98.2.t: "New ore found!"
chaosx.nr98.2.d: "Our country has found an ore stronger than steel. Engineers are testing it for tank armor and other military uses."
chaosx.nr98.2.a: "Our tanks impenetrable"

chaosx.news.77.t: "New ore found"
chaosx.news.77.d: "[FROM.GetName] has found an ore stronger than steel in [?global.ore_state_container.GetName]. Neighboring governments are seeking control of the deposit as engineers study its use in tank armor."
chaosx.news.77.a: "The good Lord made us all out of iron"
