 chaosx.fallout.719.t: "The Clean Certificate"
 chaosx.fallout.719.d: "At the North Gate office, the quarantine register has become legible again. Ash Ward clinic workers can vouch for most travelers, yet every seal still carries the memory of the fever that returned. The civil council must decide what a certificate is allowed to promise."
 chaosx.fallout.719.a: "Make the certificate a public service"
 chaosx.fallout.719.a.tt: "Spend Food, Medicine, and Recognition to staff the North Gate desk for every ward. The result arrives after thirty days and the host state will be checked again."
 chaosx.fallout.719.b: "Charge for a verified inspection"
 chaosx.fallout.719.b.tt: "Spend Scrap, Power, and Recognition to build a paid inspection route. The result arrives after thirty days and the host state will be checked again."
 chaosx.fallout.719.c: "Use the seal against rivals"
 chaosx.fallout.719.c.tt: "Spend Fuel, Recognition, and Cohesion to make the certificate a political test. The result arrives after thirty days and the host state will be checked again."
 chaosx.fallout.719.e: "Set one regional standard"
 chaosx.fallout.719.d.tt: "Spend Food, Medicine, Fuel, and Recognition to publish one shared seal. The result arrives after thirty days and the host state will be checked again."
 chaosx.fallout.720.t: "The Clean Certificate"
 chaosx.fallout.721.t: "The North Gate Register Speaks"
 chaosx.fallout.721.public.success.d: "The public desk at North Gate opens before dawn. Ash Ward nurses compare names with the clinic ledger, and no traveler is asked to barter for a seal. The certificate has become a visible promise from the Quarantine State."
 chaosx.fallout.721.public.partial.d: "The public desk works on market days, but the eastern checkpoint still sends families back for missing pages. The certificate is trusted in the wards and doubted on the road."
 chaosx.fallout.721.public.failure.d: "The public desk consumes its paper and medicine before the register can be reconciled. The North Gate queues lengthen, and the first clean certificate is remembered as a promise the council could not keep."
 chaosx.fallout.721.paid.success.d: "The paid route keeps its stamps, lamps, and inspectors supplied. A worker from the eastern checkpoint can now prove a certificate without opening the entire ward register, and the route earns its first quiet profit."
 chaosx.fallout.721.paid.partial.d: "The paid route moves freight faster than it moves people. Traders accept the seal, while families without Scrap wait beside the rope line and ask whether clean air has become a commodity."
 chaosx.fallout.721.paid.failure.d: "The paid inspection desk loses power during the first rush. Two seals carry different numbers, and the North Gate council must suspend the route before a forged certificate reaches Ash Ward."
 chaosx.fallout.721.political.success.d: "The council uses the seal to expose a rival ward that has been skipping medical checks. The victory is narrow and public. The Quarantine State gains leverage, though every checkpoint now expects a political answer."
 chaosx.fallout.721.political.partial.d: "The certificate becomes a badge for council loyalists, but the eastern checkpoint keeps its own list. The political weapon works in the capital and weakens trust beyond the last lamp."
 chaosx.fallout.721.political.failure.d: "The council tries to deny certificates to its opponents and loses the clinic workers instead. The register is still open, yet every refusal is copied into a grievance book."
 chaosx.fallout.721.standard.success.d: "The Ash Ward seal and the North Gate seal are finally the same mark. Three checkpoints accept one inspection record, and a traveler can cross the eastern road without telling the story of the fever again."
 chaosx.fallout.721.standard.partial.d: "The regional standard reaches two checkpoints before the third rejects the paper stock. The road has a common language, but not yet a common promise."
 chaosx.fallout.721.standard.failure.d: "The shared seal arrives before the ledgers agree. The eastern road closes for a week, the clinic loses its final reserve of paper, and the certificate is treated as another name for delay."
 chaosx.fallout.721.a: "Keep the register open"
 chaosx.fallout.721.a.tt: "The certification result is recorded and a public review will arrive after one hundred eighty days."
 chaosx.fallout.723.t: "A Season Under Seal"
 chaosx.fallout.723.success.d: "One season later, the North Gate register still matches the Ash Ward ledger. The certificate has acquired a place in school satchels, freight manifests, and the eastern checkpoint book. The office can remain open without pretending that every road is safe."
 chaosx.fallout.723.partial.d: "The certificate survives, but each checkpoint keeps a local exception page. The council can maintain the seal if it accepts that a regional rule must leave room for a ward that has lost its clinic."
 chaosx.fallout.723.failure.d: "The certificate review finds three incompatible registers and no trustworthy way to correct them. The North Gate office closes its public window while the council decides whether the seal can be repaired at all."
 chaosx.fallout.723.a: "Archive the season's seal"
 chaosx.fallout.723.a.tt: "The certification review is recorded and the chain will close through its authenticated cleanup receipt."
