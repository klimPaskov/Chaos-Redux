l_english:
africa_elephant_operations_category: "Elephant Operations"
africa_elephant_operations_category_desc: "Train elephant formations across distinct terrain, sustain their logistics, and send them to defend protected African partners."
africa_elephant_register_terrain_band: "Chart an Elephant March Band"
africa_elephant_register_terrain_band_desc: "Bind an elephant formation to a controlled African state and chart its terrain. Each terrain band must be distinct, and the formation must remain in the selected state while the survey is made."
africa_elephant_register_terrain_band_requirements_tt: "Requires a controlled African state containing an elephant formation and a terrain band not already recorded."
africa_elephant_register_terrain_band_effect_tt: "Adds the selected state's terrain band to the elephant formation's campaign record."
africa_elephant_open_logistics_contract: "Open the Elephant Logistics Contract"
africa_elephant_open_logistics_contract_desc: "Commit elephant equipment, trucks, a train, fuel, and command authority to hold an elephant formation in one selected state for the full logistics window."
africa_elephant_open_logistics_contract_requirements_tt: "Requires the marked elephant formation in a controlled African state with a supply node and the full material commitment."
africa_elephant_open_logistics_contract_cost: "Requires [?constant:africa_elephant_operation.logistics_elephant_equipment_commitment|0] elephant equipment, [?constant:africa_elephant_operation.logistics_truck_commitment|0] trucks, [?constant:africa_elephant_operation.logistics_train_commitment|0] train, and [?constant:africa_elephant_operation.logistics_fuel_commitment|0] fuel."
africa_elephant_open_logistics_contract_effect_tt: "The committed material is removed from stockpiles and the timed logistics mission begins."
africa_elephant_logistics_mission: "Maintain the Elephant Logistics Contract"
africa_elephant_logistics_mission_desc: "Keep the selected depot under control and its elephant formation supplied until the logistics contract ends."
africa_elephant_logistics_mission_requirements_tt: "The mission completes if the selected elephant formation, its controlled depot, and the committed supplies remain intact through the full logistics window."
africa_elephant_open_protection_expedition: "Dispatch the Elephant Protection Expedition"
africa_elephant_open_protection_expedition_desc: "Dispatch the selected elephant formation to a protected African partner's capital during a defensive war. The expedition succeeds only if that war ends without the partner capitulating."
africa_elephant_open_protection_expedition_requirements_tt: "Requires a completed logistics contract, the selected elephant formation in the protected partner's controlled capital state, and a defensive war already in progress."
africa_elephant_open_protection_expedition_effect_tt: "Begins the protection expedition for the partner's current defensive war."
africa_elephant_protection_mission: "Settle the Elephant Protection Expedition"
africa_elephant_protection_mission_desc: "Keep the selected elephant formation in the protected African partner's capital until its defensive war ends. Capitulation or the loss of the protection agreement ends the expedition without disqualifying its achievement."
africa_elephant_protection_mission_requirements_tt: "The mission completes if the protected war ends while the selected elephant formation remains in the partner's controlled capital and the partner has not capitulated."
