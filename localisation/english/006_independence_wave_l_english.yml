independence_wave_force_template_coastal_maritime: "Coastal Defense Brigade"
independence_wave_force_template_mounted_mobile: "Mobile Regional Brigade"
independence_wave_force_template_desert_nomadic: "Desert Mobile Brigade"
independence_wave_force_template_river_jungle: "River and Forest Brigade"
independence_wave_force_template_foreign_volunteers: "International Volunteer Brigade"
chaosx.nr6.35.t: "The First Congress of New States"
chaosx.nr6.35.d: "Delegates from the newly independent states have taken their seats for the first league congress. Their charter must decide whether recognition, mutual defense, shared reserves, and regional claims will be coordinated—or whether the new states will remain a collection of temporary sovereignties."
chaosx.nr6.35.a: "Let the delegates speak."
