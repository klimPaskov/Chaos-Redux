# Source: 006_independence_wave_join_l_english.yml
chaosx.nr6.36.t: "The Independence Wave Reaches Us"
chaosx.nr6.36.d: "We have lost at least half our former states, and every state we retain belongs to the homeland claimed by [independence_wave_join_target.GetNameDef]. We can dissolve the old state and continue as that country."
chaosx.nr6.36.a: "Continue as [independence_wave_join_target.GetNameDef]"
chaosx.nr6.36.b: "Retain the present government"
chaosx.nr6.36.b.tt: "No further voluntary transition will be considered for [?constant:independence_wave_join.cooldown_days|0] days."
chaosx.nr6.39.t: "The Independence Wave Falters"
chaosx.nr6.39.d: "The proposed transfer of authority could not be completed. The old government remains responsible for the territory still under its control."
chaosx.nr6.39.a: "The transition is suspended"
independence_wave.history.join.offer: "[?events_log_history_selected_actor.GetNameDefCap] considered a voluntary transition to [?events_log_history_selected_secondary_actor.GetNameDef]."
independence_wave.history.join.accepted: "[?events_log_history_selected_actor.GetNameDefCap] dissolved its former government and transferred authority to [?events_log_history_selected_secondary_actor.GetNameDef]."
independence_wave.history.join.declined: "[?events_log_history_selected_actor.GetNameDefCap] declined the transition to [?events_log_history_selected_secondary_actor.GetNameDef] and retained its existing government."
independence_wave.history.join.failed: "[?events_log_history_selected_actor.GetNameDefCap] attempted a voluntary transition to [?events_log_history_selected_secondary_actor.GetNameDef], but the transfer of authority could not be completed."

# Source: 006_independence_wave_super_event_l_english.yml
chaosx_super_event.23.t: "The League of New States"
chaosx_super_event.23.d: "Delegates from the newest states have ratified a common charter and chosen the league's leadership. The signatories promise arbitration, mutual aid, and collective resistance to any former host or foreign patron that attempts to extinguish a member.\n\nThe league can speak for its members, bargain in their name, and coordinate shared aid or mobilization."
chaosx_super_event.23.a: "Small states, one covenant."
chaosx_super_event.23.q: "\"A general association of nations must be formed under specific covenants...\"\n §Y-Woodrow Wilson, Fourteen Points, Point XIV, 8 January 1918-§!"
chaosx_super_event.24.t: "Every Border a Casus Belli"
chaosx_super_event.24.d: "New-state governments coordinate claims, ultimatums, arms shipments, and mobilization schedules across several regions. Their border commands follow shared timetables, and governments pledge arms or troops to support one another's territorial demands.\n\nFormer hosts reinforce several fronts as they prepare for wars that may begin on the same day."
chaosx_super_event.24.a: "They have sown the wind."
chaosx_super_event.24.q: "\"For they have sown the wind, and they shall reap the whirlwind...\"\n §Y-Hosea 8:7, King James Version-§!"

independence_wave.history.danger_milestone.title: "Every Border a Casus Belli"
independence_wave.history.danger_milestone.description: "New-state governments have turned sudden sovereignty into coordinated pressure. Claims, military timetables, breakaway sponsorships, and common support now threaten several former hosts at once."
independence_wave.history.crisis.title: "Release Record"
independence_wave.history.crisis.description: "The public record opens only after new governments take control of their territory. [GetIndependenceWaveCrisisHistoryCause]"
independence_wave.history.crisis.cause.occupation: "The former host no longer controlled the affected territory when the declarations were recorded."
independence_wave.history.crisis.cause.stability: "The former host's institutions had broken down when the declarations were recorded."
independence_wave.history.crisis.cause.combined: "Occupation and institutional collapse had ended effective host rule before the declarations were recorded."
independence_wave.history.crisis.cause.requester_lost: "The former host had ceased to exist when the release record was completed."
independence_wave.history.crisis.cause.unknown: "The former host no longer governed the affected territory when the declarations were recorded."
independence_wave.history.crisis.outcome.title: "Territorial Result"
independence_wave.history.crisis.outcome.description: "[GetIndependenceWaveCrisisResolution]"
independence_wave.history.crisis.outcome.queued: "No public release was recorded."
independence_wave.history.crisis.outcome.blocked: "No public release was recorded, and no territory changed hands."
independence_wave.history.crisis.outcome.cancelled: "No public release was recorded, and no territory changed hands."
independence_wave.history.crisis.outcome.committed: "The declarations were recorded after the selected states changed hands. The former host retained part of its territory."
independence_wave.history.crisis.outcome.requester_lost: "The former host ceased to exist before any territorial transfer could be recorded."
independence_wave.history.crisis.outcome.unknown: "No territorial transfer was recorded."

# Event 006 achievement localisation registry (merged from 006_independence_wave_achievements_l_english.yml)
independence_wave_achievement_eligible_tooltip: "Available to a country whose founding, chosen route, and record satisfy the listed conditions."

chaosx_006_one_state_to_statehood_NAME: "Seal of a Sovereign Decade"
chaosx_006_one_state_to_statehood_DESC: "Make a durable state out of one precarious capital."
independence_wave_achievement_one_state_to_statehood_tooltip: "Begin with only an anchor state and never accept subject status. Reach §YFoundational Legitimacy§!, §YInternationally Entrenched Recognition§!, and §YMature Capacity§!, then remain sovereign for §Y10 years§!."

chaosx_006_no_master_NAME: "Sovereignty Without Strings"
chaosx_006_no_master_DESC: "Build recognition and arms without surrendering the state behind them."
independence_wave_achievement_no_master_tooltip: "As an independent breakaway that has never been a subject, reach §YInternationally Entrenched Recognition§! and §YFormidable Security§! without entering a client route or allowing patron dominance to reach the warning threshold."

chaosx_006_peace_with_host_NAME: "Five Quiet Years"
chaosx_006_peace_with_host_DESC: "Turn a line of secession into an ordinary border."
independence_wave_achievement_peace_with_host_tooltip: "Secure recognized separation from a living former host, settle both property and citizenship, and remain at peace with that host for §Y5 years§!. A host war or forced military settlement invalidates the attempt."

chaosx_006_break_reconquest_NAME: "The Tower Never Fell"
chaosx_006_break_reconquest_DESC: "Let the old capital become the rock on which reconquest breaks."
independence_wave_achievement_break_reconquest_tooltip: "Be attacked by the former host in a reconquest war and reach peace while independent, outside a client route, and still owning and controlling the original anchor state. Losing that state for §Y30 days§! invalidates the defense."

chaosx_006_found_league_NAME: "Five Signatures at the Table"
chaosx_006_found_league_DESC: "Give the newly free a congress built by their own hands."
independence_wave_achievement_found_league_tooltip: "As a natural founding country, proclaim a formal league with at least §Y5 members§! and adopt all five charter pillars: sovereign equality, mutual defense, anti-puppetry, arbitration, and common development. A congress formed before the new states gathered does not qualify."

chaosx_006_cross_regional_league_NAME: "Four Regions, One Charter"
chaosx_006_cross_regional_league_DESC: "Keep distant small states inside one disciplined compact."
independence_wave_achievement_cross_regional_league_tooltip: "Remain a member of a non-radical, naturally formed league with at least §Y10 members§! drawn from §Y4 regional overlays§! and at least §Y70 Cohesion§! for §Y2 continuous years§!."

chaosx_006_rescue_member_NAME: "The Smallest Capital Saved"
chaosx_006_rescue_member_DESC: "Prove that the league's shield reaches its weakest member."
independence_wave_achievement_rescue_member_tooltip: "Answer a threatened league member's rescue call, then keep that country active, independent, and uncapitulated for §Y1 year§!. The rescued state must not voluntarily rejoin its former host."

chaosx_006_regional_formable_NAME: "A Union Beyond Proclamation"
chaosx_006_regional_formable_DESC: "Make the second founding real in rails, offices, and law."
independence_wave_achievement_regional_formable_tooltip: "Commit a regional union and complete its first-stage integration together with every required initial integration objective. A proclamation without integration does not qualify."

chaosx_006_volga_bulgaria_NAME: "Bolgar's Modern Heirs"
chaosx_006_volga_bulgaria_DESC: "Restore a Volga state from the congress that secured its freedom."
independence_wave_achievement_volga_bulgaria_tooltip: "As the Volga republic born from the Middle Volga Congress, complete either the constitutional restoration or federal route and keep both required Volga centers under your ownership and control."

chaosx_006_assyria_survives_NAME: "The Council Between Two Rivers"
chaosx_006_assyria_survives_DESC: "Keep a vulnerable people, settlement, and state alive together."
independence_wave_achievement_assyria_survives_tooltip: "As the Assyrian council established in Mosul, reach entrenched recognition, protect the anchor population, complete the Mesopotamian settlement, survive the host conflict, and keep the anchor under your ownership and control without entering a client relationship."

chaosx_006_small_to_major_NAME: "Institutions Before Empire"
chaosx_006_small_to_major_DESC: "Make one state's ministries carry the weight of a major power."
independence_wave_achievement_small_to_major_tooltip: "From a one-state opening, become a major through your own institutions before activating a regional formable, field a professional army, and lead at least one successful league goal."

chaosx_006_radical_bloc_NAME: "The Open-Border Reckoning"
chaosx_006_radical_bloc_DESC: "Survive the world that answers a revisionist league."
independence_wave_achievement_radical_bloc_tooltip: "On the Radical Sovereignty route, qualify the dangerous milestone through a radical offensive league, draw an external containment war, and remain sovereign for §Y1 year§! after that war begins. A milestone granted without your league's action does not count."

chaosx_006_every_flag_survival_NAME: "The Long Roll Call"
chaosx_006_every_flag_survival_DESC: "Return to the congress five years later and still find the flags flying."
independence_wave_achievement_every_flag_survival_tooltip: "Launch a §YLow Intensity§! release with any type except Common Congress. After §Y5 years§!, at least §Y85%§! of the countries released by that release must remain active and independent."

chaosx_006_balanced_patrons_NAME: "Three Patrons, No Master"
chaosx_006_balanced_patrons_DESC: "Take help from rival capitals without giving any one the key."
independence_wave_achievement_balanced_patrons_tooltip: "Receive major aid from at least §Y3 different patrons§!, never cross the dependency threshold, never enter a client route, and buy out every active concession."

chaosx_006_league_arbitrator_NAME: "Five Lines, No Shots"
chaosx_006_league_arbitrator_DESC: "Make borders quieter by judgment instead of force."
independence_wave_achievement_league_arbitrator_tooltip: "During one uninterrupted term as league leader, resolve §Y5 member border disputes§! through arbitration. No member war, coercive border ultimatum, or expulsion may occur during the term."

chaosx_006_host_remnant_NAME: "One Capital, Ten Years"
chaosx_006_host_remnant_DESC: "Teach the state that remained to live without reconquest."
independence_wave_achievement_host_remnant_tooltip: "As a former host left with exactly §Y1 state§!, negotiate settlements with every breakaway born from your old provinces and remain independent, at peace, and non-revanchist for §Y10 years§!. Hold the capital, reach §Y60% Stability§!, operate §Y2 civilian factories§!, and rebuild the capital to §Y2 Infrastructure§!."

# Event 006 IW-095 Dahomey first-footprint package.
independence_wave_iw095_first_footprint_category: "Dahomey First Footprint"
independence_wave_iw095_first_footprint_category_desc: "Abomey, Porto-Novo, and the coastal towns must share one founding authority before Dahomey's independence can endure.\n\nCouncil Cohesion: §Y[?independence_wave_dah_council_cohesion|0]§! / [?constant:independence_wave_dahomey_pressure.maximum|0]\nCoastal Revenue: §Y[?independence_wave_dah_coastal_revenue|0]§! / [?constant:independence_wave_dahomey_pressure.maximum|0]\n\nRaise both ledgers to [?constant:independence_wave_dahomey_pressure.stable|0], install a route government, and keep the capital secure."
independence_wave_iw095_reconcile_abomey_and_porto_novo: "Reconcile Abomey and Porto-Novo"
independence_wave_iw095_reconcile_abomey_and_porto_novo_desc: "Build one provisional authority from the Abomey court, Porto-Novo administration, coastal customs, and civic delegates before the founding compact expires."
independence_wave_iw095_compact_resolved_effect_tt: "The Dahomey compact is stable: the state retains its capital, its route government, and both founding ledgers."
independence_wave_iw095_project_failure_effect_tt: "The unresolved compact loses §R[?constant:independence_wave_dahomey_pressure.standard_loss|0]§! from both founding ledgers. Legitimacy, Recognition, State Capacity, and Security fall while Instability rises."

iw095_convene_abomey_council: "Convene the Abomey Council"
iw095_convene_abomey_council_desc: "Bring Abomey traditional authorities and Porto-Novo civic delegates into one provisional council."
iw095_convene_abomey_council_effect_tt: "Council cohesion rises by §G[?constant:independence_wave_dahomey_pressure.major_gain|0]§! and coastal revenue by §G[?constant:independence_wave_dahomey_pressure.minor_gain|0]§!. The Abomey Council Charter becomes active."

iw095_reopen_coastal_customs: "Reopen the Coastal Customs Service"
iw095_reopen_coastal_customs_desc: "Restore an accountable customs office so the new state can collect port revenue without surrendering local authority."
iw095_reopen_coastal_customs_effect_tt: "Council cohesion rises by §G[?constant:independence_wave_dahomey_pressure.standard_gain|0]§! and coastal revenue by §G[?constant:independence_wave_dahomey_pressure.major_gain|0]§!. The Coastal Customs Service becomes active."

iw095_register_palm_and_market_revenue: "Register Palm and Market Revenue"
iw095_register_palm_and_market_revenue_desc: "Record palm, market, and inland toll receipts under a single public ledger shared by the coastal towns and Abomey."
iw095_register_palm_and_market_revenue_effect_tt: "Council cohesion rises by §G[?constant:independence_wave_dahomey_pressure.major_gain|0]§! and coastal revenue by §G[?constant:independence_wave_dahomey_pressure.standard_gain|0]§!. The Palm and Market Register becomes active."

iw095_organize_civic_guard: "Organize the Civic Guard Compact"
iw095_organize_civic_guard_desc: "Place palace guards, veterans, and local volunteers under a single territorial command."
iw095_organize_civic_guard_effect_tt: "Council cohesion rises by §G[?constant:independence_wave_dahomey_pressure.standard_gain|0]§! and coastal revenue by §G[?constant:independence_wave_dahomey_pressure.major_gain|0]§!. The Civic Guard Compact becomes active."

iw095_settle_former_host_ledgers: "Settle the Former Host's Ledgers"
iw095_settle_former_host_ledgers_desc: "Negotiate property, border, and security obligations with the former French host while the compact remains at peace."
iw095_settle_former_host_ledgers_effect_tt: "The former host's claims and obligations are settled; Council cohesion rises by §G[?constant:independence_wave_dahomey_pressure.standard_gain|0]§! and coastal revenue by §G[?constant:independence_wave_dahomey_pressure.minor_gain|0]§!."

iw095_ratify_civic_compact: "Ratify a Civic Compact"
iw095_ratify_civic_compact_desc: "Entrust the provisional state to an elected civic cabinet with Abomey and Porto-Novo representation."
iw095_ratify_civic_compact_effect_tt: "The constitutional route becomes the Dahomey government and restores a civic cabinet."

iw095_restore_council_authority: "Restore Council Authority"
iw095_restore_council_authority_desc: "Return executive authority to a traditional council that binds Abomey legitimacy to a modern state administration."
iw095_restore_council_authority_effect_tt: "The traditional route becomes the Dahomey government and restores council authority."

iw095_authorize_emergency_directorate: "Authorize an Emergency Directorate"
iw095_authorize_emergency_directorate_desc: "Concentrate authority in a temporary directorate while the civic guard secures the compact."
iw095_authorize_emergency_directorate_effect_tt: "The emergency route becomes the Dahomey government and places the civic guard under a directorate."

iw095_open_west_african_trade_mission: "Open a West African Trade Mission"
iw095_open_west_african_trade_mission_desc: "Use the stabilized compact and league membership to open a trade mission across the Gulf of Guinea."
iw095_open_west_african_trade_mission_effect_tt: "Dahomey opens a West African trade mission, improving network standing and coastal revenue."

