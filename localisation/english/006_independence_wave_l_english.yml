dah_fragmented_coastal_mandate: "Fragmented Coastal Mandate"
dah_fragmented_coastal_mandate_desc: "Abomey, Porto-Novo, and the coastal towns still share no settled fiscal or command authority."
dah_dahomey_compact: "Dahomey Founding Compact"
dah_dahomey_compact_desc: "A stable compact binds the Abomey court, Porto-Novo administration, and coastal revenue into one state."
dah_abomey_council_charter: "Abomey Council Charter"
dah_abomey_council_charter_desc: "A provisional council gives traditional authorities and civic delegates a common administrative forum."
dah_coastal_customs_service: "Coastal Customs Service"
dah_coastal_customs_service_desc: "Port customs are collected under a public service that protects local revenue."
dah_palm_market_register: "Palm and Market Register"
dah_palm_market_register_desc: "Palm, market, and inland toll receipts are recorded in a shared public ledger."
dah_civic_guard_compact: "Civic Guard Compact"
dah_civic_guard_compact_desc: "Palace guards, veterans, and local volunteers answer to a territorial command."
dah_emergency_directorate: "Emergency Directorate"
dah_emergency_directorate_desc: "A temporary directorate concentrates authority while the compact is under threat."
dah_council_land_compact: "Council Land Compact"
dah_council_land_compact_desc: "A restored council binds land, customary authority, and state administration."
dah_west_african_trade_mission: "West African Trade Mission"
dah_west_african_trade_mission_desc: "A stabilized Dahomey maintains a trade mission across the Gulf of Guinea network."
