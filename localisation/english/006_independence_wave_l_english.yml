l_english:
chaosx.nr6.2.t: "Declarations Before Dawn"
chaosx.nr6.2.d: "The first messages seemed unrelated: a provincial radio station refusing orders, a colonial office finding its seal rejected, a garrison saluting a flag that had not existed the night before. By noon, §Y[?global.independence_wave_presentation_country_count|0]§! governments [GetIndependenceWavePresentationRegionText] had taken capitals, ministries, and borders into their own hands. [GetIndependenceWavePresentationArmedText] [GetIndependenceWavePresentationHostText]\n\nRecognition, administration, defense, and the terms of separation remain unsettled. Each new state must build security after its declaration. [GetIndependenceWavePresentationNetworkText] The wave has redrawn authority faster than any conference or negotiated transfer could have done."
chaosx.nr6.2.a: "Let each government defend its declaration."
chaosx.nr6.35.t: "The First Congress of New States"
chaosx.nr6.35.d: "Delegates from the newly independent states have taken their seats for the first league congress. Their charter will determine how they coordinate recognition, mutual defense, shared reserves, and regional claims. Without agreement, the new states will remain a collection of temporary sovereignties."
chaosx.nr6.35.a: "Let the delegates speak."
chaosx.nr6.311.t: "The Provisional Capital Is Lost"
chaosx.nr6.311.d: "The first administrative center can no longer be held. The provisional government must either move its seat to another secure state or continue from a dispersed emergency office while the army and provincial authorities recover."
chaosx.nr6.311.a: "Move the provisional seat"
chaosx.nr6.311.b: "Continue from dispersed offices"
independence_wave_presentation_armed_present: "§Y[?global.independence_wave_presentation_armed_count|0]§! of the new governments emerged with organized formations already under local command."
independence_wave_presentation_armed_absent: "None can yet rely on a settled national command."
independence_wave_presentation_region_single: "within one broad region"
independence_wave_presentation_region_multiple: "across §Y[?global.independence_wave_presentation_region_count|0]§! broad regions"
independence_wave_presentation_host_concentrated: "At least one former ruler has suffered more than one break at once."
independence_wave_presentation_host_distributed: "The ruptures struck separate governments in the same few hours."
independence_wave_presentation_network_returned: "Earlier wave states are already among the first governments able to answer them."
independence_wave_presentation_network_first: "No common institution yet speaks for the newly independent governments. Each declaration must make its own case."
