chaosx.fallout.621.t: "The Rail Spine Vote"
chaosx.fallout.621.opening.d: "Across the Eurasian interior, a surviving rail junction has become the only reliable way to move fuel, food, and repair crews between winter settlements. Depot keepers, convoy merchants, soldiers, and district delegates have brought separate ledgers to the same signal room. The line can carry a new compact, but only one authority can write its first timetable."
chaosx.fallout.621.a: "Open the central rail board"
chaosx.fallout.621.a.tt: "Spend Food 5, Scrap 3, and Recognition 3. After 35 days, the board will be graded against the junction's railway, infrastructure, shelter, and public trust."
chaosx.fallout.621.b: "Grant the depots regional shares"
chaosx.fallout.621.b.tt: "Spend Food 4, Fuel 3, Scrap 2, and Recognition 2. After 35 days, depot autonomy and fuel reserves will decide whether the route can keep its schedule."
chaosx.fallout.621.c: "Put the line under military guard"
chaosx.fallout.621.c.tt: "Spend Food 4, Fuel 2, Support Equipment 3, and Command Power 12. After 35 days, war conditions, Cohesion, and security control will decide whether the guards protect the route or close it."
chaosx.fallout.621.d: "Lease the line to merchant convoys"
chaosx.fallout.621.d.tt: "Spend Food 5, Fuel 3, Scrap 3, and Recognition 1. After 35 days, scrap reserves, merchant access, and faction pressure will decide whether the convoys share the line."
chaosx.fallout.623.t: "The Junction's First Timetable"
chaosx.fallout.623.central.success.d: "The central rail board has published a timetable that names every depot and inspection crew. Trains leave the ash covered junction under a shared register, and the line now carries more than the strongest station can claim alone."
chaosx.fallout.623.central.partial.d: "The central rail board has a timetable, but two depots still keep private fuel counts. The first trains move under watch while delegates argue over which delays belong in the public record."
chaosx.fallout.623.central.failure.d: "The central rail board failed to reconcile the depot ledgers. The junction signal remains lit, but no crew trusts the next handoff and a damaged rail section has taken the first route out of service."
chaosx.fallout.623.depot.success.d: "The depots have accepted regional shares and a common fuel reserve. Local keepers still control their sidings, yet the junction can call a repair crew without reopening the old dispute over ownership."
chaosx.fallout.623.depot.partial.d: "The depot shares keep a reduced timetable alive. Fuel moves between two stations while a third withholds its reserve until the winter roads and the rail watch agree on protection."
chaosx.fallout.623.depot.failure.d: "The depot shares collapsed into competing counts. Fuel remains behind locked storehouses, the line loses its schedule, and the junction sends a warning that the next convoy will travel without a reliable return path."
chaosx.fallout.623.military.success.d: "The guard units secured the junction without replacing the civilian ledger. Trains now move with escorts and inspection rights, and the line can serve the front without turning every depot into a barracks."
chaosx.fallout.623.military.partial.d: "The guards restored one route through the junction and accepted a narrow inspection schedule. The line moves again, but the depots have surrendered part of their voice to the men holding the signal room."
chaosx.fallout.623.military.failure.d: "The guard command seized the junction before the regional ledger could be signed. Rail damage and lost stores have halted the timetable, while the first dead are carried away from a platform that was meant to remain neutral."
chaosx.fallout.623.merchant.success.d: "Merchant convoys have leased the line under a public timetable. Salvage crews, fuel carts, and winter caravans share the junction, giving the interior a route that is commercial without becoming private property."
chaosx.fallout.623.merchant.partial.d: "The merchant lease moves cargo on the main track, but the smaller depots demand separate fees. The route is useful and tense, with every convoy measuring the cost of the next repair against the promise of the next market."
chaosx.fallout.623.merchant.failure.d: "The merchant lease broke over fuel claims and faction pressure. Convoys have turned back from the junction, leaving the line short of crews and the settlements beyond it short of the supplies they had already promised."
chaosx.fallout.623.a: "Review the first timetable"
chaosx.fallout.623.a.tt: "Apply the authenticated 35-day route result and continue the Rail Spine Vote toward its delayed review."
chaosx.fallout.625.t: "The Rail Spine Review"
chaosx.fallout.625.success.d: "Three hundred days later, the Eurasian route still has a timetable that survives changes in weather, government, and guard duty. Its ledgers are not identical, but the junction has become a place where settlements can ask for a train and expect an answer."
chaosx.fallout.625.partial.d: "The review finds a working route with a contested authority. Depots, guards, and merchants all keep part of the line alive, yet every new delay reveals how little of the original compact was written for the next winter."
chaosx.fallout.625.failure.d: "The review finds broken schedules and private stores along the rail spine. The junction still stands, but no shared institution can promise the next departure, and the damaged route will need a new settlement before it can carry the interior again."
chaosx.fallout.625.a: "Record the route review"
chaosx.fallout.625.a.tt: "Apply the authenticated callback outcome and close the Rail Spine Vote transaction without creating a new country tag or recurring decision."
