fallout.event_log.rail_spine_vote.name: "The Rail Spine Vote"
fallout.event_log.rail_spine_vote.detail: "A Eurasian interior rail junction has recorded a route policy, its delayed timetable, and the review that followed."
fallout.event_log.rail_spine_vote.choice_central: "The country opened a central rail board at the Eurasian junction."
fallout.event_log.rail_spine_vote.choice_depot: "The country granted the depots regional shares in the rail reserve."
fallout.event_log.rail_spine_vote.choice_military: "The country placed the rail spine under military guard with inspection rights."
fallout.event_log.rail_spine_vote.choice_merchant: "The country leased the rail spine to merchant convoys under a public timetable."
fallout.event_log.rail_spine_vote.central_success: "The central board published a shared timetable and reopened the route."
fallout.event_log.rail_spine_vote.central_partial: "The central board kept a reduced timetable alive while depots withheld parts of their ledgers."
fallout.event_log.rail_spine_vote.central_failure: "The central board failed to reconcile the depot ledgers and the route broke down."
fallout.event_log.rail_spine_vote.depot_success: "The depots accepted regional shares and a common fuel reserve."
fallout.event_log.rail_spine_vote.depot_partial: "The depot shares kept two stations moving while a third withheld its reserve."
fallout.event_log.rail_spine_vote.depot_failure: "The depot shares collapsed into competing counts and locked stores."
fallout.event_log.rail_spine_vote.military_success: "The guards secured the junction while a civilian ledger retained inspection rights."
fallout.event_log.rail_spine_vote.military_partial: "The guards restored one route and narrowed the depots' authority."
fallout.event_log.rail_spine_vote.military_failure: "The guard command seized the junction and halted the timetable."
fallout.event_log.rail_spine_vote.merchant_success: "Merchant convoys shared a public timetable and reopened the interior route."
fallout.event_log.rail_spine_vote.merchant_partial: "The merchant lease moved cargo while smaller depots demanded separate fees."
fallout.event_log.rail_spine_vote.merchant_failure: "The merchant lease broke over fuel claims and faction pressure."
fallout.event_log.rail_spine_vote.callback_success: "The route review found a timetable and institution that still answered the interior's calls."
fallout.event_log.rail_spine_vote.callback_partial: "The route review preserved service while leaving authority contested."
fallout.event_log.rail_spine_vote.callback_failure: "The route review found broken schedules and no shared institution for the next departure."
fallout.event_log.rail_spine_vote.cancelled: "The rail transaction was cancelled after its host, owner, or generation changed."
