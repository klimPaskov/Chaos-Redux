l_english:
 migration_effect_vulnerable_priority_tt: "Prepared transports carry half the standard group size and reserve more places for people who need care."
 migration_effect_industrial_priority_tt: "Industrial workers and transport specialists preserve skilled labor. Their departure lowers factory output in the origin country, while arrivals raise output at their destination in proportion to the affected states' industry. Local construction and factory repair also shift with the cohort's workforce share. Vulnerable evacuees receive fewer places."
 migration_state_industrial_recovery: "Industrial Recovery"
 migration_state_industrial_recovery_desc: "Construction and factory repair reflect the signed workforce contribution of industrial-priority cohorts in this state."
 migration_effect_administration_priority_tt: "This transport is reserved for civil administrators and local service staff. The same destination-capacity and route-safety rules apply."
 migration_evacuate_administration: "Evacuate Civil Administrators: [FROM.GetName]"
 migration_evacuate_administration_desc: "Reserve a standard prepared transport for civil officials and local service staff from [FROM.GetName]. The group travels under administrative priority; reception capacity and route safety remain decisive."
 migration_cost_evacuate_administration: "[GetHumanitarianCostTrain5Cost]  [GetMigrationTransportStandardFuelCost]  [GetMigrationTransportStandardConvoysCost]"
 migration_cost_evacuate_administration_blocked: "$migration_cost_evacuate_administration$"
 migration_cost_evacuate_administration_tooltip: "$migration_cost_evacuate_administration$"
 migration_country_industrial_workforce: "Industrial Workforce Shift"
 migration_country_industrial_workforce_desc: "Factory and dockyard output reflect industrial-priority cohorts leaving or arriving across your states. Their contribution follows each cohort through transit and return."
