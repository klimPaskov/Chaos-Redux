l_english:
utopia_manifesto.evolution.type: "The Commonwealth Manuscript"
utopia_manifesto.evolution.1.title: "Glosses in the Margin"
utopia_manifesto.evolution.1.locked_title: "Unread Marginalia"
utopia_manifesto.evolution.1.body: "Everyone has started writing in the manifesto's margins. Workers, parishes, councils, families, and exiles bring their own copies and their own answers. The movement's future may belong to whoever keeps the right to edit the book."
utopia_manifesto.evolution.2.title: "Necessary Shores"
utopia_manifesto.evolution.2.locked_title: "A Shore Not Yet Measured"
utopia_manifesto.evolution.2.body: "Migration, blockades, crowded homes, and thin supplies push the common store to its limits. Surveyors search for harbors, corridors, settlements, and leases that can meet real needs without turning the commonwealth into a hungry neighbor."
utopia_manifesto.evolution.3.title: "Cities of One Measure"
utopia_manifesto.evolution.3.locked_title: "Plans Without Streets"
utopia_manifesto.evolution.3.body: "The plan has escaped the capital. Towns and rebuilt districts are opening gardens, clinics, workshops, stores, and transport links of their own. Local votes and local shortages shape each version, and arguments over work reveal who really gets to change the plan."
utopia_manifesto.evolution.4.title: "Nowhere Made Law"
utopia_manifesto.evolution.4.locked_title: "A Name Without Standing"
utopia_manifesto.evolution.4.body: "The manifesto now has a place in regional politics. Governments quote it when they ask for aid, defend local charters, refuse threats, or seek association. Small states must decide whether the commonwealth looks like a refuge, a useful partner, or an ambitious neighbor."
utopia_manifesto.evolution.5.title: "The Perfect Island"
utopia_manifesto.evolution.5.locked_title: "The Unfinished Refuge"
utopia_manifesto.evolution.5.body: "The world around the commonwealth is coming apart. Reserve trains, guarded harbors, refugee districts, fortifications, and member councils all compete for the same supplies. One path closes the gates and demands service from everyone inside. The other shares refuge among willing towns and spreads the burden across the league."
utopia_manifesto.evolution.locked_body: "The manuscript still contains a chapter whose consequences have not entered public history. Its title and record will become visible when the commonwealth reaches that stage."
utopia_manifesto.evolution.summary: "Readers carry the manifesto out of the book and into towns, borders, alliances, and daily life. Every chapter changes what the commonwealth means in practice."
