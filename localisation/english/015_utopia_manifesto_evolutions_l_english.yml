l_english:
utopia_manifesto.evolution.type: "The Commonwealth Manuscript"
utopia_manifesto.evolution.1.title: "Glosses in the Margin"
utopia_manifesto.evolution.1.locked_title: "Unread Marginalia"
utopia_manifesto.evolution.1.body: "The recovered manuscript no longer speaks with one voice. Rival translations, household annotations, and public commentaries have become organized schools of interpretation. Delegates arrive carrying copies marked by workshops, parishes, councils, and exiles. The argument over the book has become an institution of its own, and the eventual commonwealth will be shaped by whoever keeps the right to write in its margins."
utopia_manifesto.evolution.2.title: "Necessary Shores"
utopia_manifesto.evolution.2.locked_title: "A Shore Not Yet Measured"
utopia_manifesto.evolution.2.body: "Migration, blockade, crowded housing, and uncertain supply have pushed the common store against the limits of the map. Surveyors now distinguish want from ambition before they mark a harbor, corridor, settlement, or lease as necessary ground. Domestic works remain possible, and every foreign offer leaves a record. The experiment must decide whether need can cross a border without turning into appetite."
utopia_manifesto.evolution.3.title: "Cities of One Measure"
utopia_manifesto.evolution.3.locked_title: "Plans Without Streets"
utopia_manifesto.evolution.3.body: "The settlement plan has escaped the capital. Cooperative municipalities, associated towns, and rebuilt districts repeat its gardens, clinics, workshops, stores, and transport links in different soil. Each place adapts the design to local votes and local shortages. Their growing network makes the manifesto visible in ordinary streets, while disputes over assignment reveal who is allowed to alter the plan."
utopia_manifesto.evolution.4.title: "Nowhere Made Law"
utopia_manifesto.evolution.4.locked_title: "A Name Without Standing"
utopia_manifesto.evolution.4.body: "The manifesto has become a regional legal identity. Governments and movements invoke it when they negotiate association, refuse an ultimatum, request aid, or defend local charters. Sponsors offer protection with conditions, rivals describe every storehouse as a disguised frontier, and small states judge whether the commonwealth is refuge, partner, or threat. An imagined country has become a claim that diplomacy must answer."
utopia_manifesto.evolution.5.title: "The Perfect Island"
utopia_manifesto.evolution.5.locked_title: "The Unfinished Refuge"
utopia_manifesto.evolution.5.body: "Ordinary regional order is breaking around a society trying to make one bounded place endure. Reserve trains, guarded harbors, refugee districts, fortification works, and member councils all pull against one another. A closed regime can harden the boundary into compulsory service. A voluntary commonwealth can distribute refuge among willing towns. Neither answer escapes the cost of keeping stores open while the roads beyond them fail."
utopia_manifesto.evolution.locked_body: "The manuscript still contains a chapter whose consequences have not entered public history. Its title and record will become visible when the commonwealth reaches that stage."
utopia_manifesto.evolution.summary: "The recovered manifesto changes as readers, settlements, territorial cases, and associated governments carry it beyond the first book. Each recorded chapter follows a public change in how the commonwealth is interpreted, built, defended, or recognized."
