l_english:
raid_target_name_japan_chemical_state: "China theater chemical raid in $LOCATION$"
raid_target_name_japan_biological_state: "China theater biological raid in $LOCATION$"
raid_japan_chemical_target_tt: "Choose an enemy-held Chinese homeland state bordering Japanese-held territory. A recently struck state cannot be targeted."
raid_japan_chemical_available_tt: "Japan needs war with a Chinese country, operational CBRN readiness, authority for this target, and the listed agent stock. The stock is committed when preparations begin."
raid_japan_chemical_launch_tt: "The war, target control, readiness, and authority for this target must still hold when the raid launches."
raid_japan_chemical_failure_actor_tt: "The raid fails before a chemical release. The reserved agent payload is lost."
raid_japan_chemical_failure_target_tt: "The selected state avoids a chemical release."
raid_japan_chemical_limited_actor_tt: "The raiders attempt a reduced cylinder release. Changed control or authority may halt it; protection and doctrine shape any resulting harm."
raid_japan_chemical_limited_target_tt: "A reduced chemical release is attempted in the selected state."
raid_japan_chemical_success_actor_tt: "The raiders attempt the prepared cylinder release. Changed control or authority may halt it; protection and conditions shape any resulting contamination, casualties, evidence, and Condemnation."
raid_japan_chemical_success_target_tt: "A chemical release is attempted in the selected state."
raid_japan_chemical_critical_actor_tt: "The raiders attempt a powerful cylinder release. Changed control or authority may halt it; protection and conditions shape any resulting harm."
raid_japan_chemical_critical_target_tt: "A severe chemical release is attempted in the selected state."
raid_japan_bio_anthrax_target_tt: "Select an enemy-controlled Chinese core state beside Japanese or Japanese-subject territory with a supply, industrial, infrastructure, port, or military target and no active Anthrax episode."
raid_japan_bio_plague_target_tt: "Select an enemy-controlled Chinese core state beside Japanese or Japanese-subject territory with an urban, capital, port, or large-population target and no active Plague episode."
raid_japan_bio_available_tt: "The Pingfang and Ishii authority route, completed agent project, operational CBRN readiness, authority for this target, and listed bomb and support stock are required. The stock is committed when preparations begin."
raid_japan_bio_launch_tt: "The China war, Pingfang and Ishii route, policy, readiness, project, target control, and campaign cooldown must remain valid at launch."
raid_japan_bio_failure_actor_tt: "The raid fails before a viable release. Reserved bomb and support equipment are lost; recovered evidence can still expose the program."
raid_japan_bio_failure_target_tt: "The selected state avoids a viable biological release, though the failed attempt may leave evidence."
raid_japan_bio_limited_actor_tt: "The raiders attempt a reduced biological release. Changed control, policy, or campaign conditions may halt it; incubation, spread, detection, medical pressure, and Condemnation may follow."
raid_japan_bio_limited_target_tt: "A limited biological release is attempted in the selected state."
raid_japan_bio_success_actor_tt: "The raiders attempt the prepared biological release. Changed control, policy, or campaign conditions may halt it; disease-specific harm and forensic consequences may follow."
raid_japan_bio_success_target_tt: "A biological release is attempted in the selected state."
raid_japan_bio_critical_actor_tt: "The raiders attempt a severe biological release. Changed control, policy, or campaign conditions may halt it; any outbreak reflects the disease's potency."
raid_japan_bio_critical_target_tt: "A severe biological release is attempted in the selected state."
