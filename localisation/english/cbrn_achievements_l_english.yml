l_english:
chaos_warfare_achievement_eligible_tooltip: "Available to eligible human countries that build their CBRN record through campaign actions and consequences."
chaos_warfare_masks_before_guns_NAME: "Masks Before Guns"
chaos_warfare_masks_before_guns_DESC: "Prepare every core state and the national reserve before the first enemy chemical attack."
chaos_warfare_masks_before_guns_tooltip: "Before any confirmed enemy chemical use, prepare high civilian coverage in every core state and maintain the required national mask reserve."
chaos_warfare_prepared_army_NAME: "The Prepared Army"
chaos_warfare_prepared_army_DESC: "Equip three Army Headquarters for chemical operations, repel an attack, and keep military losses below one percent."
chaos_warfare_prepared_army_tooltip: "Commit three qualifying Army Headquarters, prepare a chemical offensive, repel a chemical attack with high protection, and keep recorded chemical military losses below one percent."
chaos_warfare_poisoned_victory_NAME: "A Poisoned Victory"
chaos_warfare_poisoned_victory_DESC: "Win a major war after using at least three CBRN delivery forms while the world answers with serious condemnation."
chaos_warfare_poisoned_victory_tooltip: "Win a major war after accepted CBRN operations across at least three delivery types, with a high Condemnation record and active sanctions or serious contamination."
chaos_warfare_clean_hands_dirty_work_NAME: "Clean Hands, Dirty Work"
chaos_warfare_clean_hands_dirty_work_DESC: "Keep three covert biological operations hidden for two years without resorting to strategic civilian release."
chaos_warfare_clean_hands_dirty_work_tooltip: "Complete at least three covert biological operations, remain undiscovered for two years, avoid a cover-up, and avoid strategic civilian or doomsday release."
chaos_warfare_evidence_survives_NAME: "The Evidence Survives"
chaos_warfare_evidence_survives_DESC: "Capture a biological facility, preserve its records, and carry responsibility into an inspection or international finding."
chaos_warfare_evidence_survives_tooltip: "Preserve evidence and confirm responsibility after capturing a biological facility, then accept inspections, retain credible inspection records, or reach high Condemnation."
chaos_warfare_quarantine_without_collapse_NAME: "Quarantine Without Collapse"
chaos_warfare_quarantine_without_collapse_DESC: "Contain a catastrophic biological outbreak without foreign spread, political collapse, or a second active episode."
chaos_warfare_quarantine_without_collapse_tooltip: "Contain a catastrophic outbreak, clear every owned state of ordinary episodes, prevent foreign spread, and retain the required stability, medical capacity, and supply-vehicle readiness."
chaos_warfare_arsenal_dismantled_NAME: "The Arsenal Dismantled"
chaos_warfare_arsenal_dismantled_DESC: "Accept inspection and destroy the offensive stockpile until the country returns below Formal Censure, without changing regime after the campaign begins or capitulating."
chaos_warfare_arsenal_dismantled_tooltip: "Accept credible inspections, destroy the offensive chemical or biological stockpile, reach at least Arms Embargo in the historic record, and return below Formal Censure with no offensive stockpile, without changing regime after the campaign begins or capitulating."
chaos_warfare_terminal_contagion_NAME: "Terminal Contagion"
chaos_warfare_terminal_contagion_DESC: "Commit the terminal doctrine to a fully equipped capstone formation and keep its contaminated victory alive for ninety days, still at war, with a recorded active-sanctions history and either serious Chemical Contamination or a catastrophic biological episode."
chaos_warfare_terminal_contagion_tooltip: "Use the terminal Chaos Warfare doctrine, research the 1942 Chaos Battalion, commit the capstone formation, survive ninety days and still be at war, have a recorded active-sanctions history, and have either serious Chemical Contamination or a catastrophic biological episode."
chaos_warfare_mask_for_every_door_NAME: "A Mask for Every Door"
chaos_warfare_mask_for_every_door_DESC: "Build near-total civilian protection, maintain replacement reserves, and send masks to three allied recipients before the first attack."
chaos_warfare_mask_for_every_door_tooltip: "As a mass civil-defence network or Britain, reach near-total civilian coverage, maintain replacement reserves, provide qualifying mask aid to three allied countries, and suffer no confirmed enemy chemical use."
chaos_warfare_weapon_turns_home_NAME: "The Weapon Turns Home"
chaos_warfare_weapon_turns_home_DESC: "Contain a major domestic biological accident, reform its safety system, and dismantle the program that caused it."
chaos_warfare_weapon_turns_home_tooltip: "Suffer a major ordinary domestic biological accident, contain it, reform safety to the required level, and complete the program-dismantling record without a doomsday release."
chaos_warfare_first_user_pays_NAME: "The First User Pays"
chaos_warfare_first_user_pays_DESC: "Hold to retaliation authority, defeat the first chemical user, and win without becoming the first user yourself."
chaos_warfare_first_user_pays_tooltip: "Keep retaliation-only policy history, defeat a recorded first chemical user in a major war, and avoid offensive first use, strategic civilian release, and doomsday release."
