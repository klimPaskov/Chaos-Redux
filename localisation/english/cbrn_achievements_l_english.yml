l_english:
chaos_warfare_achievement_eligible_tooltip: "Available to the human country selected at campaign start, provided it has not capitulated."
chaos_warfare_masks_before_guns_NAME: "Masks Before Guns"
chaos_warfare_masks_before_guns_DESC: "Prepare every core state and the national reserve before the first enemy chemical attack."
chaos_warfare_masks_before_guns_tooltip: "Before any confirmed enemy chemical use, prepare high civilian coverage in every core state and maintain replacement masks for the army."
chaos_warfare_prepared_army_NAME: "The Prepared Army"
chaos_warfare_prepared_army_DESC: "Put three generals on CBRN headquarters duty, strike with chemical weapons while your chemical staff is in the field, turn back a chemical attack, and keep chemical losses among your own troops below one percent."
chaos_warfare_prepared_army_tooltip: "Three different generals must each commit a CBRN headquarters package. The country must then carry out a confirmed chemical land raid at a time when at least one of its armies has an Operations Section in the field, turn back a chemical attack while military respiratory protection is at least [GetCBRNAchievementHighMilitaryProtectionQuote]%, and keep chemical deaths among its own troops below one percent of its forces. These conditions apply to the country as a whole."
chaos_warfare_poisoned_victory_NAME: "A Poisoned Victory"
chaos_warfare_poisoned_victory_DESC: "Win a major war after using at least three CBRN delivery forms while the world answers with serious condemnation."
chaos_warfare_poisoned_victory_tooltip: "Win a major war after CBRN attacks using at least three delivery types, with high Condemnation and sanctions or serious contamination."
chaos_warfare_clean_hands_dirty_work_NAME: "Clean Hands, Dirty Work"
chaos_warfare_clean_hands_dirty_work_DESC: "Keep three covert biological operations hidden for two years without resorting to strategic civilian release."
chaos_warfare_clean_hands_dirty_work_tooltip: "Complete at least three covert biological operations, remain undiscovered for two years, avoid a cover-up, and avoid strategic civilian or doomsday release."
chaos_warfare_evidence_survives_NAME: "The Evidence Survives"
chaos_warfare_evidence_survives_DESC: "Capture a biological facility, preserve its documents, and establish responsibility through inspections or international condemnation."
chaos_warfare_evidence_survives_tooltip: "Preserve evidence and confirm responsibility after capturing a biological facility, then accept inspections, complete credible inspections, or reach high Condemnation."
chaos_warfare_quarantine_without_collapse_NAME: "Quarantine Without Collapse"
chaos_warfare_quarantine_without_collapse_DESC: "Contain a catastrophic biological outbreak without foreign spread or political collapse."
chaos_warfare_quarantine_without_collapse_tooltip: "Contain a catastrophic outbreak, clear every owned state of active biological outbreaks, prevent foreign spread, and retain the required stability, medical capacity, and supply-vehicle readiness."
chaos_warfare_arsenal_dismantled_NAME: "The Arsenal Dismantled"
chaos_warfare_arsenal_dismantled_DESC: "Accept inspection and destroy the offensive stockpile until the country returns below Formal Censure, without changing regime after the campaign begins or capitulating."
chaos_warfare_arsenal_dismantled_tooltip: "Accept credible inspections, destroy the offensive chemical or biological stockpile, have reached at least Arms Embargo, and return below Formal Censure with no offensive stockpile, without changing regime after the campaign begins or capitulating."
chaos_warfare_terminal_contagion_NAME: "Terminal Contagion"
chaos_warfare_terminal_contagion_DESC: "Field a complete three-section CBRN Headquarters under terminal doctrine during a chemical land strike. Survive ninety days, remain at war, have faced sanctions, and have experienced either serious Chemical Contamination or a catastrophic biological outbreak."
chaos_warfare_terminal_contagion_tooltip: "Use terminal Chaos Warfare doctrine and research the 1942 Chaos Battalion. Carry out a chemical land strike while a deployed CBRN Headquarters has all three sections, then survive ninety days and remain at war. You must have faced sanctions and experienced either serious Chemical Contamination or a catastrophic biological outbreak."
chaos_warfare_mask_for_every_door_NAME: "A Mask for Every Door"
chaos_warfare_mask_for_every_door_DESC: "Build near-total civilian protection, maintain replacement reserves, and send masks to three allied recipients before the first attack."
chaos_warfare_mask_for_every_door_tooltip: "As a mass civil-defense network or Britain, reach near-total civilian coverage, maintain replacement reserves, provide qualifying mask aid to three allied countries, and suffer no confirmed enemy chemical use."
chaos_warfare_weapon_turns_home_NAME: "The Weapon Turns Home"
chaos_warfare_weapon_turns_home_DESC: "Contain a major domestic biological accident, reform its safety system, and dismantle the program that caused it."
chaos_warfare_weapon_turns_home_tooltip: "Suffer a major ordinary domestic biological accident, contain it, reform safety to the required level, and dismantle the program without a doomsday release."
chaos_warfare_first_user_pays_NAME: "The First User Pays"
chaos_warfare_first_user_pays_DESC: "Keep Retaliation Only authorization, defeat the first chemical user, and win without using chemical weapons first."
chaos_warfare_first_user_pays_tooltip: "Keep Retaliation Only authorization, defeat a country that used chemical weapons first in a major war, and avoid offensive first use, strategic civilian release, and doomsday release."
chaos_warfare_air_still_breathable_NAME: "The Air Is Still Breathable"
chaos_warfare_air_still_breathable_DESC: "Survive a major war after an enemy chemical attack with a protected army and little chemical pollution of your own."
chaos_warfare_air_still_breathable_tooltip: "After a confirmed enemy chemical attack during a war against a major power, remain standing when that major capitulates. Keep military respiratory protection at least [GetCBRNAchievementHighMilitaryProtectionQuote]% throughout that chemical war and when you qualify, produce less than [GetCBRNAchievementStrictAirContributionPointsQuote] contamination points through your own chemical attacks, and never use chemical weapons first, release them against civilians, or authorize doomsday use."
chaos_warfare_antidote_arrived_NAME: "The Antidote Arrived"
chaos_warfare_antidote_arrived_DESC: "Contain a severe nerve-agent attack with advanced masks, medical aid, and decontamination."
chaos_warfare_antidote_arrived_tooltip: "Contain Severe or Catastrophic nerve-agent contamination in a state you continue to control. Advanced masks must be researched and issued to soldiers and civilians, and both groups must have at least [GetCBRNAchievementHighMilitaryProtectionQuote]% effective protection when the attack lands. Maintain that protection for every nerve-agent attack until the state is clean. Provide medical care through protected hospitals or Mass Antidote Response and decontamination through field coverage or a cleanup. Remove all chemical contamination with fewer than [GetCBRNAchievementLowNerveCivilianDeathsQuote] civilian deaths and less than [GetCBRNAchievementLowNerveMilitaryLossFractionQuote] cumulative military loss in that state."

