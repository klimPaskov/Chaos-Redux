l_english:
biological_raid_available_tooltip: "You need an authorized biological or anti-zombie operation to use this raid category. Each raid lists its own preparation and payload requirements."
weaponized_zombie_raid_authorization_tt: "Choose Unrestricted Authorization, or Retaliation Only with a current retaliation right against the selected enemy. The selected state must suit our strain, and our program must permit deployment."
weaponized_zombie_raid_minor_outcome_tt: "If the selected enemy state, strain, and biological authorization are still valid when the raid resolves, a minor weaponized zombie outbreak begins in the selected state and the deployment consequences apply."
weaponized_zombie_raid_full_outcome_tt: "If the selected enemy state, strain, and biological authorization are still valid when the raid resolves, a weaponized zombie outbreak begins in the selected state and the deployment consequences apply."
raid_category_biological_raids: "Biological Raids"
raid_category_header_biological_raids: "Biological Raids"
tooltip_raid_category_biological_raids: "§YBiological Raids§!\nArmy and air operations deliver epidemic weapons, strike supply chains, recover contaminated facilities, and contain zombie outbreaks. Each agent has its own payload and outbreak profile."

brilliant_scientist_portal_raid_available_tooltip: "Weaponized Transit Doctrine and one Portal Raider formation are required to open these raids."
brilliant_scientist_portal_containment_category: "Portal Containment"
brilliant_scientist_portal_containment_category_desc: "Enemy transit corridors remain open behind our lines. Recapture the breach province, then seal its terminal to prevent further use."
brilliant_scientist_seal_recaptured_portal_breach: "Seal the Recaptured Portal Breach"
brilliant_scientist_seal_recaptured_portal_breach_desc: "Commit engineers and command staff to isolate the hostile transit terminal in [From.GetName]. We must hold the breach province for the full twenty-one days."
brilliant_scientist_seal_recaptured_portal_breach_requirements_tt: "We are the original defender and control the breach province. The enemy corridor remains active, and no sealing operation is underway. Requires [ROOT.GetBrilliantScientistPortalSealingCost]."
brilliant_scientist_seal_recaptured_portal_breach_cost: "[ROOT.GetBrilliantScientistPortalSealingCost]"
brilliant_scientist_seal_recaptured_portal_breach_complete_tt: "Seal the hostile transit corridor. Captured factories and facilities remain where they were taken."
brilliant_scientist_seal_recaptured_portal_breach_cancel_tt: "Sealing stops. The breach remains open while its participants are still at war."
raid_category_brilliant_scientist_raids: "Portal Warfare Raids"
raid_category_header_brilliant_scientist_raids: "Portal Warfare Operations"
tooltip_raid_category_brilliant_scientist_raids: "§YPortal Warfare Operations§!\nA formation with at least six Portal Raider battalions can breach a hostile province after seven days of preparation. Each raid reserves §Y60§! Teleportation Equipment and costs £command_power §Y10§!. A successful transit rematerializes the standard six-battalion formation."
raid_type_brilliant_scientist_portal_facility_raid: "Portal Installation Raid"
raid_type_brilliant_scientist_portal_facility_raid_desc: "Portal Raiders try to materialize in a hostile province, seize a beachhead, and attack immediately. Success transfers one factory, reactor, or rocket site to the raiding country, and a critical breach can take two installations from the state."
raid_target_name_brilliant_scientist_portal_state: "Factory or State Installation"
brilliant_scientist_portal_raid_target_available_tt: "The selected hostile state contains a factory, reactor, or rocket site that can be transferred into an eligible owned state."
raid_type_brilliant_scientist_portal_special_project_facility_raid: "Portal Facility Extraction"
raid_type_brilliant_scientist_portal_special_project_facility_raid_desc: "Portal Raiders try to breach one hostile special-project facility, materialize beside it, and seize the province. Success transfers that facility to an eligible owned state, and a critical breach can also take one factory, reactor, or rocket site from the surrounding state."
raid_target_name_brilliant_scientist_portal_facility: "Special-Project Facility"
brilliant_scientist_portal_facility_raid_target_available_tt: "The selected hostile special-project facility can be transferred into an eligible owned state."
brilliant_scientist_portal_raid_preparation_available_tt: "Weaponized Transit Doctrine, a formation with at least six Portal Raider battalions, and §Y60§! Teleportation Equipment are required to prepare the landing. The raid also costs £command_power §Y10§!. A successful transit rematerializes the standard six-battalion formation."
brilliant_scientist_portal_raid_launch_available_tt: "The hostile installation remains transferable, the Portal Raider formation and reserved Teleportation Equipment remain available, and the countries are at war."
brilliant_scientist_portal_raid_failure_actor_tt: "The portal insertion failed before securing a beachhead. The raiding formation suffered damage and gained limited field experience."
brilliant_scientist_portal_raid_failure_target_tt: "The target province resisted the portal insertion. Its strategic installations remain intact."
brilliant_scientist_portal_raid_limited_success_actor_tt: "The portal insertion reached the target without securing a beachhead. The raiding formation suffered damage and gained field experience."
brilliant_scientist_portal_raid_limited_success_target_tt: "A limited portal breach damaged one surviving strategic facility without transferring the province."
brilliant_scientist_portal_raid_success_actor_tt: "The assigned Portal Raider formation rematerialized in the target province as an under-strength cadre, seized control, and transferred one factory or strategic installation. It can attack from the beachhead immediately and refills through normal reinforcement."
brilliant_scientist_portal_raid_success_target_tt: "Portal Raiders seized the target province, established an active beachhead, transferred one factory or strategic installation, and damaged what remained."
brilliant_scientist_portal_raid_critical_success_actor_tt: "The assigned Portal Raider formation achieved a deep landing, rematerialized in the target province as an under-strength cadre, and transferred up to two factories or strategic installations. It can attack from the beachhead immediately and refills through normal reinforcement."
brilliant_scientist_portal_raid_critical_success_target_tt: "A deep portal landing seized the target province, established an active beachhead, transferred up to two factories or strategic installations, and damaged what remained."

raid_type_anthrax_strike: "Anthrax Strike"
raid_type_anthrax_strike_desc: "A bomber formation tries to release moderately potent weaponized anthrax over the selected state. The delivery can fail, expose the staging complex, leave hidden lasting contamination, or cause a detectable biological incident."
raid_anthrax_strike_tt: "The anthrax operation has resolved over the selected state. Any release that took place enters incubation. Detection, local protection, and medical response decide whether the contamination becomes an outbreak."

raid_type_plague_strike: "Plague Strike"
raid_type_plague_strike_desc: "A bomber formation tries to seed serious weaponized plague in the selected state. Incubation, surveillance, local conditions, containment, and treatment determine whether the release develops into a wider regional outbreak."
raid_plague_strike_tt: "The plague operation has resolved over the selected state. Any release that took place enters incubation. Spread is uncertain, and surveillance, containment, and treatment shape the outcome."

raid_type_tularemia_strike: "Tularemia Strike"
raid_type_tularemia_strike_desc: "A bomber formation tries to disperse low-potency weaponized tularemia over the selected state. It is the least potent ordinary agent, but a release can still cause major military sickness and medical disruption."
raid_tularemia_strike_tt: "The tularemia operation has resolved over the selected state. Any release that took place enters incubation. Detection, the exposed population, and the defender's countermeasures decide the disruption."

raid_type_smallpox_strike: "Smallpox Strike"
raid_type_smallpox_strike_desc: "A bomber formation tries to release severe weaponized smallpox over the selected state. It is the most potent ordinary agent, but even a successful delivery must pass through incubation before surveillance, vaccination, containment, and treatment determine the scale of the outbreak."
raid_smallpox_strike_tt: "The smallpox operation has resolved over the selected state. Any release that took place enters incubation, so an outbreak is not immediate or certain. Surveillance, vaccination, containment, treatment, and later spread determine the result."
raid_type_zombie_cure_strike: "Anti-Zombie Bomb Strike"
raid_type_zombie_cure_strike_desc: "Aircraft will deliver one stockpiled anti-zombie cure payload to a threatened state. The payload is committed when the raid is prepared, and a successful delivery treats the state while a cure remains active."
raid_zombie_cure_strike_tt: "A cure-saturation payload has drenched the target state with anti-zombie decontaminants. While any country still maintains an active cure, zombie-held control of the treated state becomes far less useful for movement, local supply, and manpower extraction."
raid_zombie_cure_strike_no_effect_tt: "The cure payload had no effect because the cure expired or the target state no longer required treatment."
zombie_cure_raid_available_tooltip: "An active zombie cure is required before anti-zombie bomb strikes can be launched."
raid_type_weaponized_zombie_strike_low: "Weaponized Zombie Strike"
raid_type_weaponized_zombie_strike_low_desc: "A limited field package tries to seed the selected state with a tailored zombie strain. The lighter preparation reduces the expected outbreak scale, but containment failure and attribution remain possible."
raid_type_weaponized_zombie_strike_medium: "Weaponized Zombie Strike"
raid_type_weaponized_zombie_strike_medium_desc: "A full field package tries to seed the selected state with a tailored zombie strain. Surviving delivery aircraft may create a smaller outbreak, while a successful strike can establish a weaponized zombie state."
raid_type_weaponized_zombie_strike_high: "Weaponized Zombie Strike"
raid_type_weaponized_zombie_strike_high_desc: "A concentrated field package tries to establish a large tailored zombie outbreak in the selected state. The deployment commits more aircraft and command resources to the same hazardous release."
raid_type_weaponized_zombie_strike_low_friendly: "Weaponized Zombie Strike"
raid_type_weaponized_zombie_strike_low_friendly_desc: "A limited human-tolerant zombie package is released over the selected state. The strain is meant to spare ordinary humans, but it remains a weaponized outbreak."
raid_type_weaponized_zombie_strike_medium_friendly: "Weaponized Zombie Strike"
raid_type_weaponized_zombie_strike_medium_friendly_desc: "A full human-tolerant zombie package is released over the selected state. The strain's preference for infected targets lowers the direct danger to ordinary humans without making the deployment safe."
raid_type_weaponized_zombie_strike_high_friendly: "Weaponized Zombie Strike"
raid_type_weaponized_zombie_strike_high_friendly_desc: "A concentrated human-tolerant zombie package is released over the selected state. The strain is meant to attack hostile infected populations, but a large engineered outbreak still carries containment and attribution risks."
raid_weaponized_zombie_strike_low_tt: "A tailored zombie-strain payload has been dispersed over the target area. Surviving delivery aircraft may seed a smaller outbreak, while successful strikes can create a full weaponized zombie state."
raid_weaponized_zombie_strike_medium_tt: "$raid_weaponized_zombie_strike_low_tt$"
raid_weaponized_zombie_strike_high_tt: "$raid_weaponized_zombie_strike_low_tt$"
raid_weaponized_zombie_strike_low_friendly_tt: "$raid_weaponized_zombie_strike_low_tt$"
raid_weaponized_zombie_strike_medium_friendly_tt: "$raid_weaponized_zombie_strike_low_tt$"
raid_weaponized_zombie_strike_high_friendly_tt: "$raid_weaponized_zombie_strike_low_tt$"
chaosx_raid_aborted_tt: "The raid was aborted before its intended payload could be delivered."

chemical_raid_available_tooltip: "You must have an unlocked chemical raid payload available to use chemical raids."
raid_category_chemical_raids: "Chemical Raids"
raid_category_header_chemical_raids: "Chemical Raids"
tooltip_raid_category_chemical_raids: "§YChemical Raids§!\nArmy and air operations deliver chemical agents against a selected state. Each route requires release authority, suitable formations or aircraft, and prepared payload. Failed attacks may leave evidence. Confirmed releases bring Condemnation."

raid_type_chemical_sarin_strike: "Sarin Strike"
raid_type_chemical_sarin_strike_desc: "Aircraft attempt to release sarin over the selected state. A partial delivery can cause limited exposure. A full release brings severe but short-lived contamination and medical pressure."
raid_type_chemical_sarin_rocket_strike: "Sarin Rocket Strike"
raid_type_chemical_sarin_rocket_strike_desc: "A strategic rocket attempts to release sarin over the selected state. A partial delivery can cause limited exposure. A full release brings severe but short-lived contamination and medical pressure."
raid_type_chemical_soman_strike: "Soman Strike"
raid_type_chemical_soman_strike_desc: "Aircraft attempt to release persistent soman over the selected state. Protection, air defense, and the raid result shape the consequences."
raid_type_chemical_soman_rocket_strike: "Soman Rocket Strike"
raid_type_chemical_soman_rocket_strike_desc: "A strategic rocket attempts to release persistent soman over the selected state. The result shapes exposure, contamination, medical pressure, and international reaction."
raid_type_chemical_malodor_strike: "Malodor Strike"
raid_type_chemical_malodor_strike_desc: "Aircraft attempt to disperse an incapacitating aerosol over the selected state. It can force evacuation and disrupt military operations, but it still leaves evidence and political consequences."
raid_type_chemical_aphrodisiac_strike: "Behavioral-Agent Strike"
raid_type_chemical_aphrodisiac_strike_desc: "An experimental behavioral-agent raid attempts an incapacitating release over the selected state. Its military effect is uncertain, and the operation still leaves evidence and political consequences."
raid_type_chemical_chlorine_strike: "Chlorine Air Strike"
raid_type_chemical_chlorine_strike_desc: "Aircraft attempt to release chlorine over the selected state. A viable release can choke exposed troops and civilians, while masks, air defense, and decontamination limit the harm."
raid_type_chemical_phosgene_strike: "Phosgene Air Strike"
raid_type_chemical_phosgene_strike_desc: "Aircraft attempt to release phosgene, a stronger choking agent than chlorine, over the selected state. The result shapes military disruption, deaths, contamination, and medical pressure."
raid_type_chemical_mustard_strike: "Mustard Air Strike"
raid_type_chemical_mustard_strike_desc: "Aircraft attempt to release persistent mustard, a blister agent, over the selected state. Contamination lingers, and protection, cleanup, evidence, and international reaction shape the consequences."
raid_type_chemical_lewisite_strike: "Lewisite Air Strike"
raid_type_chemical_lewisite_strike_desc: "Aircraft attempt to release lewisite, a rapid blister agent, over the selected state. Contamination and medical pressure continue after the raid ends."
raid_type_chemical_tabun_strike: "Tabun Air Strike"
raid_type_chemical_tabun_strike_desc: "Aircraft attempt to release tabun, a nerve agent, over the selected state. Protection, medical response, evidence, attribution, and international reaction shape the outcome."

raid_target_name_chemical_state: "Selected State"
raid_chemical_air_raid_preparation_requirements_tt: "Requires Chemical Air Interdiction, strong field protection (mask issue, filters, decontamination, and training), release authority or a verified retaliation right, the strike system, an agent rack where needed, a selected state, and the listed payload reserve."
raid_chemical_air_chlorine_tt: "If chlorine reaches the selected state, exposed troops and civilians may suffer choking injuries. Protection and delivery conditions limit the harm. The attempt can still leave evidence."
raid_chemical_air_phosgene_tt: "If phosgene reaches the selected state, delayed choking injuries can increase casualties and medical pressure. Protection limits the harm. The attempt can still leave evidence."
raid_chemical_air_mustard_tt: "A viable mustard release can blister exposed troops and civilians and leave persistent contamination. Cleanup and medical care strain the state. The attempt can still leave evidence."
raid_chemical_air_lewisite_tt: "A viable lewisite release can cause rapid blister injuries and persistent contamination. Medical care and cleanup strain the state. The attempt can still leave evidence."
raid_chemical_air_tabun_tt: "A viable tabun release can cause nerve-agent casualties and medical pressure. Protection limits exposure. Evidence can identify the attacker and bring Condemnation."
raid_chemical_air_sarin_tt: "A viable sarin release can cause nerve-agent casualties, short-lived contamination, and medical pressure. Evidence can identify the attacker and bring Condemnation."
raid_chemical_air_soman_tt: "A viable soman release can expose troops and civilians to a persistent nerve agent and strain medical care. Evidence can identify the attacker and bring Condemnation."
raid_chemical_air_malodor_tt: "A viable malodor release can force evacuation and disrupt military operations. Evidence can identify the attacker and bring Condemnation."
raid_chemical_air_behavioral_tt: "A viable behavioral-agent release can disrupt command and coordination, though its effect is uncertain. Evidence can identify the attacker and bring Condemnation."
raid_chemical_air_sarin_rocket_tt: "A strategic sarin rocket was launched against the selected state. A viable release can cause nerve-agent casualties, contamination, and medical pressure. A failed release can still leave evidence."
raid_chemical_air_soman_rocket_tt: "A strategic soman rocket was launched against the selected state. A viable release can cause persistent nerve-agent exposure and medical pressure. A failed release can still leave evidence."

raid_chemical_nerve_sarin_tt: "A sarin (GB) payload has been released over the target area, causing immediate damage to units in the struck province plus severe but short-lived contamination and panic. This chemical strike increases Condemnation."
raid_chemical_nerve_soman_tt: "A soman (GD) payload has been released over the target area, causing immediate damage to units in the struck province plus very strong but short-lived contamination and panic. This chemical strike increases Condemnation."
raid_chemical_malodor_tt: "A concentrated malodorant payload drenches the selected area. Units lose cohesion immediately, and evacuation, entrenchment, movement, occupation control, and sortie preparation are disrupted. The low lethality still leaves evidence and can bring Condemnation."
raid_chemical_aphrodisiac_tt: "An experimental aerosol behavioral-agent payload has been released over the selected area. Command discipline, coordination, resilience, and preparation break down unpredictably. The uncertain military effect still leaves evidence and can bring Condemnation."
