l_english:
biological_raid_available_tooltip: "You must have an unlocked biological or anti-zombie raid payload available to use this raid category."
weaponized_zombie_raid_available_tooltip: "At least 125 Weaponized Zombie Payloads are required before this strike can be prepared."
raid_category_biological_raids: "Biological Raids"
raid_category_header_biological_raids: "Biological Raids"
tooltip_raid_category_biological_raids: "§YBiological Raids§!\nStrategic raids for biological payloads, including epidemic weapons and anti-zombie containment bombs. Ordinary agents share one operational delivery profile, while their strength and outbreak behavior differ after release."

raid_type_anthrax_strike: "Anthrax Strike"
raid_type_anthrax_strike_desc: "A bomber formation will attempt a controlled release of moderately potent weaponized anthrax over the selected state. Delivery may fail, expose the staging complex, leave a concealed persistent contamination seed, or produce a detectable biological incident."
raid_anthrax_strike_tt: "The anthrax operation has resolved over the selected state. Any real release enters incubation, while detection, local protection, and medical response determine whether contamination becomes an outbreak."

raid_type_plague_strike: "Plague Strike"
raid_type_plague_strike_desc: "A bomber formation will attempt to seed serious weaponized plague in the selected state. Incubation, surveillance, local conditions, containment, and treatment determine whether the release develops into a wider regional outbreak."
raid_plague_strike_tt: "The plague operation has resolved over the selected state. Any real release enters incubation, while spread remains uncertain and surveillance, containment, and treatment shape the outcome."

raid_type_tularemia_strike: "Tularemia Strike"
raid_type_tularemia_strike_desc: "A bomber formation will attempt to disperse low-potency weaponized tularemia over the selected state. It is the least potent ordinary agent overall, but a release can still impose major military sickness and medical disruption."
raid_tularemia_strike_tt: "The tularemia operation has resolved over the selected state. Any real release enters incubation, with disruption governed by detection, exposed population, and the defender's countermeasures."

raid_type_smallpox_strike: "Smallpox Strike"
raid_type_smallpox_strike_desc: "A bomber formation will attempt to release severe weaponized smallpox over the selected state. It is the most potent ordinary agent, but even a successful delivery must pass through incubation before surveillance, vaccination, containment, and treatment determine the scale of the outbreak."
raid_smallpox_strike_tt: "The smallpox operation has resolved over the selected state. Any real release enters incubation. An outbreak is not immediate or guaranteed, and surveillance, vaccination, containment, treatment, and later spread determine the result."
raid_type_zombie_cure_strike: "Anti-Zombie Bomb Strike"
raid_type_zombie_cure_strike_desc: "Aircraft will saturate the selected state with anti-zombie decontaminants. This is a cure-delivery operation and remains separate from ordinary pathogen warfare."
raid_zombie_cure_strike_tt: "A cure-saturation payload has drenched the target state with anti-zombie decontaminants. While any country still maintains an active cure, zombie-held control of the treated state becomes far less useful for movement, local supply, and manpower extraction."
zombie_cure_raid_available_tooltip: "An active zombie cure is required before anti-zombie bomb strikes can be launched."
raid_type_weaponized_zombie_strike_low: "Weaponized Zombie Strike"
raid_type_weaponized_zombie_strike_low_desc: "A limited field package will attempt to seed the selected state with a tailored zombie strain. The lighter preparation reduces the expected outbreak scale, but containment failure and attribution remain possible."
raid_type_weaponized_zombie_strike_medium: "Weaponized Zombie Strike"
raid_type_weaponized_zombie_strike_medium_desc: "A full field package will attempt to seed the selected state with a tailored zombie strain. Surviving delivery aircraft may create a smaller outbreak, while a successful strike can establish a weaponized zombie state."
raid_type_weaponized_zombie_strike_high: "Weaponized Zombie Strike"
raid_type_weaponized_zombie_strike_high_desc: "A concentrated field package will attempt to establish a large tailored zombie outbreak in the selected state. The deployment commits more aircraft and command resources to the same hazardous release."
raid_type_weaponized_zombie_strike_low_friendly: "Weaponized Zombie Strike"
raid_type_weaponized_zombie_strike_low_friendly_desc: "A limited human-tolerant zombie package will be released over the selected state. The strain is intended to spare ordinary humans, and its behavior remains a weaponized outbreak."
raid_type_weaponized_zombie_strike_medium_friendly: "Weaponized Zombie Strike"
raid_type_weaponized_zombie_strike_medium_friendly_desc: "A full human-tolerant zombie package will be released over the selected state. The intended target preference lowers direct danger to ordinary humans without making the deployment safe."
raid_type_weaponized_zombie_strike_high_friendly: "Weaponized Zombie Strike"
raid_type_weaponized_zombie_strike_high_friendly_desc: "A concentrated human-tolerant zombie package will be released over the selected state. The strain is intended to attack hostile infected populations, but a large engineered outbreak still carries containment and attribution risks."
raid_weaponized_zombie_strike_low_tt: "A tailored zombie-strain payload has been dispersed over the target area. Surviving delivery aircraft may seed a smaller outbreak, while successful strikes can create a full weaponized zombie state."
raid_weaponized_zombie_strike_medium_tt: "$raid_weaponized_zombie_strike_low_tt$"
raid_weaponized_zombie_strike_high_tt: "$raid_weaponized_zombie_strike_low_tt$"
raid_weaponized_zombie_strike_low_friendly_tt: "$raid_weaponized_zombie_strike_low_tt$"
raid_weaponized_zombie_strike_medium_friendly_tt: "$raid_weaponized_zombie_strike_low_tt$"
raid_weaponized_zombie_strike_high_friendly_tt: "$raid_weaponized_zombie_strike_low_tt$"
chaosx_raid_aborted_tt: "The raid was aborted before its intended payload could be delivered."

chemical_raid_available_tooltip: "You must have an unlocked chemical raid payload available to use chemical raids."
raid_category_chemical_raids: "Chemical Raids"
raid_category_header_chemical_raids: "Chemical Raids"
tooltip_raid_category_chemical_raids: "§YChemical Raids§!\nSelected-state operations require release authority, eligible strike aircraft, a matching agent profile, and prepared air payload. Every attempted chemical operation risks evidence, and every confirmed release brings international condemnation."

raid_type_chemical_sarin_strike: "Sarin Strike"
raid_type_chemical_sarin_strike_desc: "A chemical aircraft raid will attempt a nerve-agent release over the selected state. The result determines whether payload is lost, exposure is partial, or the state receives the full operation profile."
raid_type_chemical_sarin_rocket_strike: "Sarin Rocket Strike"
raid_type_chemical_sarin_rocket_strike_desc: "A strategic nerve-agent rocket raid will attempt a release over the selected state. The result determines whether payload is lost, exposure is partial, or the state receives the full operation profile."
raid_type_chemical_soman_strike: "Soman Strike"
raid_type_chemical_soman_strike_desc: "A chemical aircraft raid will attempt a persistent nerve-agent release over the selected state. Protection, air defence, and the raid result shape the consequences."
raid_type_chemical_soman_rocket_strike: "Soman Rocket Strike"
raid_type_chemical_soman_rocket_strike_desc: "A strategic persistent nerve-agent rocket raid will attempt a release over the selected state. The result shapes exposure, contamination, medical pressure, and international reaction."
raid_type_chemical_malodor_strike: "Malodor Strike"
raid_type_chemical_malodor_strike_desc: "An incapacitating aerosol raid will attempt to disrupt the selected state. It can cause evacuation and military disruption while still creating evidence and political consequences."
raid_type_chemical_aphrodisiac_strike: "Behavioral-Agent Strike"
raid_type_chemical_aphrodisiac_strike_desc: "An experimental behavioral-agent raid will attempt an incapacitating release over the selected state. Its military effect is uncertain, and the operation remains subject to evidence and political consequences."
raid_type_chemical_chlorine_strike: "Chlorine Air Strike"
raid_type_chemical_chlorine_strike_desc: "A chemical aircraft raid will attempt a choking-agent release over the selected state. Protection, air defence, payload handling, and the native raid result shape the consequences."
raid_type_chemical_phosgene_strike: "Phosgene Air Strike"
raid_type_chemical_phosgene_strike_desc: "A chemical aircraft raid will attempt a stronger choking-agent release over the selected state. The selected result shapes military disruption, deaths, contamination, and medical pressure."
raid_type_chemical_mustard_strike: "Mustard Air Strike"
raid_type_chemical_mustard_strike_desc: "A chemical aircraft raid will attempt a persistent blister-agent release over the selected state. Contamination, protection, cleanup, evidence, and international reaction remain consequential."
raid_type_chemical_lewisite_strike: "Lewisite Air Strike"
raid_type_chemical_lewisite_strike_desc: "A chemical aircraft raid will attempt a rapid blister-agent release over the selected state. Persistent contamination and medical pressure continue after the raid result."
raid_type_chemical_tabun_strike: "Tabun Air Strike"
raid_type_chemical_tabun_strike_desc: "A chemical aircraft raid will attempt a late-route nerve-agent release over the selected state. Protection, medical response, evidence, attribution, and international reaction shape the outcome."

raid_target_name_chemical_state: "Selected State"
raid_chemical_air_raid_preparation_requirements_tt: "Requires Chemical Air Interdiction, integrated Chemical Readiness, release authority or a verified retaliation right, the required strike system, an eligible agent rack where applicable, the selected-state target, and the exact class payload reserve."
raid_chemical_air_chlorine_tt: "A chlorine operation has resolved over the selected state. The result determines whether exposure occurs, while protection, delivery conditions, military disruption, civilian deaths, contamination, medical pressure, evidence, attribution, and Condemnation are recorded."
raid_chemical_air_phosgene_tt: "A phosgene operation has resolved over the selected state. Its stronger choking profile increases exposure consequences when a release occurs, while protection, evidence, attribution, and Condemnation remain recorded."
raid_chemical_air_mustard_tt: "A mustard operation has resolved over the selected state. When a release occurs, persistent blister contamination increases cleanup and medical pressure alongside military, civilian, evidence, and political consequences."
raid_chemical_air_lewisite_tt: "A lewisite operation has resolved over the selected state. When a release occurs, rapid blister effects and persistent contamination increase medical and cleanup pressure alongside the operation's evidence and political consequences."
raid_chemical_air_tabun_tt: "A tabun operation has resolved over the selected state. Late-route authority, protection, medical response, evidence, attribution, and Condemnation shape the consequences when a release occurs."
raid_chemical_air_sarin_tt: "A sarin operation has resolved over the selected state. When a release occurs, nerve-agent casualties, contamination, medical pressure, evidence, attribution, and Condemnation are recorded."
raid_chemical_air_soman_tt: "A soman operation has resolved over the selected state. Its persistent nerve-agent burden shapes military and civilian exposure, medical pressure, evidence, attribution, and Condemnation when a release occurs."
raid_chemical_air_malodor_tt: "A malodor operation has resolved over the selected state. When a release occurs, evacuation and military disruption are recorded alongside evidence, attribution, and international Condemnation."
raid_chemical_air_behavioral_tt: "An experimental behavioral-agent operation has resolved over the selected state. Its uncertain incapacitating effect remains subject to protection, evidence, attribution, and Condemnation when a release occurs."
raid_chemical_air_sarin_rocket_tt: "A strategic sarin rocket operation has resolved over the selected state. Its exact payload debit and result determine whether the state receives nerve-agent exposure or only the consequences of a failed attempt."
raid_chemical_air_soman_rocket_tt: "A strategic soman rocket operation has resolved over the selected state. Its exact payload debit and result determine whether the state receives persistent nerve-agent exposure or only the consequences of a failed attempt."

raid_chemical_nerve_sarin_tt: "A sarin (GB) payload has been released over the target area, causing immediate damage to units in the struck province plus severe but short-lived contamination and panic. This chemical strike increases international condemnation."
raid_chemical_nerve_soman_tt: "A soman (GD) payload has been released over the target area, causing immediate damage to units in the struck province plus very strong but short-lived contamination and panic. This chemical strike increases international condemnation."
raid_chemical_malodor_tt: "A concentrated malodorant payload has drenched the selected area. Units suffer immediate cohesion loss while evacuation, entrenchment, movement, occupation control, and sortie preparation are disrupted. Low direct lethality does not eliminate evidence or international condemnation."
raid_chemical_aphrodisiac_tt: "An experimental aerosol behavioral-agent payload has been released over the selected area. Command discipline, coordination, resilience, and preparation break down unpredictably. The uncertain military effect does not eliminate evidence or international condemnation."
