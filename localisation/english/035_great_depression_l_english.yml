chaosx.news.40.t: "Great Depression 2.0"
chaosx.news.40.d: "A deepening economic crisis is spreading through [From.GetName]. Stock markets are falling, factories are idle, and families are losing work as the Great Depression takes hold."
chaosx.news.40.a: "The downturn is spreading."
chaosx.news.95.t: "The Second Great Depression"
chaosx.news.95.d: "Credit, orders, and trade are contracting across several industrial economies. Markets are freezing, construction is slowing, and governments are searching for a way to keep the international system from breaking apart."
chaosx.news.95.a: "The world economy is entering a new crisis."

great_depression_choose_emergency_public_works: "Choose Emergency Public Works"
great_depression_choose_emergency_public_works_desc: "Adopt a relief coalition that accepts immediate public employment and durable infrastructure commitments."
great_depression_choose_rescue_strategic_industry: "Choose Rescue Strategic Industry"
great_depression_choose_rescue_strategic_industry_desc: "Keep strategic plants operating through guaranteed demand, orders, and controlled consolidation."
great_depression_choose_stabilize_finance_and_trade: "Choose Stabilize Finance and Trade"
great_depression_choose_stabilize_finance_and_trade_desc: "Make bank solvency, credit, and clearing agreements the first line of recovery."
great_depression_choose_austerity_and_retrenchment: "Choose Austerity and Retrenchment"
great_depression_choose_austerity_and_retrenchment_desc: "Protect the treasury through balanced emergency budgets, obligation restructuring, and disciplined relief."
great_depression_choose_direct_state_planning: "Choose Direct State Planning"
great_depression_choose_direct_state_planning_desc: "Place production, inputs, and reconstruction under a coordinated national plan."
great_depression_choose_let_the_market_clear: "Choose Let the Market Clear"
great_depression_choose_let_the_market_clear_desc: "Withdraw exceptional support and allow failed assets to be reorganized under ordinary market pressure."
great_depression_cabinet_review: "Cabinet Review"
great_depression_cabinet_review_desc: "Reconsider the recovery doctrine before another policy commitment is made."
great_depression_emergency_policy_review: "Emergency Policy Review"
great_depression_emergency_policy_review_desc: "Review the cabinet's course under pressure, accepting short-term whiplash for a chance to reset direction."
great_depression_emergency_relief_allocation: "Emergency Relief Allocation"
great_depression_emergency_relief_allocation_desc: "Direct reserves, workers, and transport toward the households and regions most exposed to the contraction."
great_depression_request_foreign_support: "Request Foreign Support"
great_depression_request_foreign_support_desc: "Ask an established partner for aid that can protect recovery capacity while creating a diplomatic obligation."
great_depression_select_depression_center: "Select Depression Center"
great_depression_select_depression_center_desc: "Choose an industrial center for the next state intervention."
great_depression_protect_depression_center: "Protect Depression Center"
great_depression_protect_depression_center_desc: "Shield the selected center with guards, freight, and emergency support so its productive core remains available."
great_depression_reopen_idled_plants: "Reopen Idled Plants"
great_depression_reopen_idled_plants_desc: "Return an idled center to service before temporary stoppage becomes permanent loss."
great_depression_rebuild_shuttered_center: "Rebuild Shuttered Center"
great_depression_rebuild_shuttered_center_desc: "Rebuild a shuttered center and restore its industrial capacity through a long reconstruction effort."
great_depression_restructure_or_consolidate_center: "Restructure or Consolidate Center"
great_depression_restructure_or_consolidate_center_desc: "Reorganize a failing center so its remaining capacity supports the wider recovery."
great_depression_abandon_depression_center: "Abandon Depression Center"
great_depression_abandon_depression_center_desc: "Liquidate a selected center deliberately, accepting a permanent industrial scar to protect the rest of the economy."
great_depression_launch_regional_works_program: "Launch Regional Works Program"
great_depression_launch_regional_works_program_desc: "Fund a regional works program that relieves unemployment and lowers the pressure on the national crisis."
great_depression_start_national_employment_guarantee: "Start National Employment Guarantee"
great_depression_start_national_employment_guarantee_desc: "Guarantee work through a national program, trading reserves and capacity for a stronger recovery floor."
great_depression_convert_works_into_lasting_capacity: "Convert Works into Lasting Capacity"
great_depression_convert_works_into_lasting_capacity_desc: "Turn emergency works into durable transport, construction, and industrial capacity."
great_depression_designate_strategic_plant_network: "Designate Strategic Plant Network"
great_depression_designate_strategic_plant_network_desc: "Mark essential plants as a connected network so orders and scarce inputs reach them first."
great_depression_guarantee_essential_orders: "Guarantee Essential Orders"
great_depression_guarantee_essential_orders_desc: "Guarantee demand for essential output and keep strategic production from falling into a destructive spiral."
great_depression_consolidate_failing_industry: "Consolidate Failing Industry"
great_depression_consolidate_failing_industry_desc: "Merge or trustee weak firms so surviving production can operate with fewer duplicative losses."
great_depression_end_rescue_dependence: "End Rescue Dependence"
great_depression_end_rescue_dependence_desc: "Withdraw the emergency orders that keep the protected plants running. They return to ordinary contracts, which eases the budget but takes the guarantee away from the protected regions."
great_depression_retain_bounded_arsenal_institution: "Retain a Bounded Arsenal Institution"
great_depression_retain_bounded_arsenal_institution_desc: "Keep the designated plant network as a standing arsenal with guaranteed orders. The rest of the economy returns to ordinary rules, while the arsenal carries a lasting cost."
great_depression_restore_local_credit_and_trade_connection: "Restore Local Credit and Trade Connection"
great_depression_restore_local_credit_and_trade_connection_desc: "Reopen the audited lenders, merchant credit and trade links of the selected center so its plants can buy inputs and sell their output again."
great_depression_end_rescue_dependence_tt: "Essential orders end, and the budget carries less lasting pressure. This completes the Rescue Strategic Industry recovery measure that §YPrevent a Relapse§! requires."
great_depression_retain_bounded_arsenal_institution_tt: "Essential orders continue as a standing institution. The arsenal adds lasting budget pressure but eases supply strain while at war. This completes the Rescue Strategic Industry recovery measure that §YPrevent a Relapse§! requires."
great_depression_keep_essential_freight_moving_center_tt: "If the selected Depression Center is Distressed, Idled or Shuttered and no center project is running, §YTransport Integration§! work begins there. If a project is already running there, it moves several weeks closer to completion, once per project."
great_depression_coordinated_reconstruction_center_tt: "If the selected Depression Center is Distressed, Idled, Shuttered or Abandoned and no center project is running, §YInternational Reconstruction§! work begins there."
great_depression_severity_change_tt: "Depression Severity: [?great_depression_action_delta|=-0]"
great_depression_abandon_distressed_market_tt: "We stop carrying the debts and unpaid orders of [FROM.GetNameDef]. For the next §Y[?great_depression_tt_relief_days|0]§! days of this depression, each Severity update is up to §G[?great_depression_tt_relief|0]§! lower, and our crisis no longer spreads to [FROM.GetNameDef] through this link.\n[FROM.GetNameDef] takes the loss. If it is in its own depression, its Depression Severity rises by §R[?great_depression_tt_partner_shock|0]§!. If it is not, its exposure to our crisis deepens by one stage, and an economy that was untouched becomes dependent on our failing market. It will remember who walked away."
great_depression_withdraw_from_distressed_market_tt: "We wind down trade with [FROM.GetNameDef] without breaking contracts. For the next §Y[?great_depression_tt_relief_days|0]§! days of this depression, each Severity update is up to §G[?great_depression_tt_relief|0]§! lower.\nIf [FROM.GetNameDef] is in its own depression, its Depression Severity rises by §R[?great_depression_tt_partner_shock|0]§!. A quiet exit leaves no lasting resentment."
great_depression_exploit_supply_gap_tt: "Our plants buy up the inputs [FROM.GetNameDef] can no longer deliver. For the next §Y[?great_depression_tt_relief_days|0]§! days of this depression, each Severity update is up to §G[?great_depression_tt_relief|0]§! lower. While Social Collapse is active, workers call it profiteering and the backlash takes back §R[?great_depression_tt_backlash|0]§! of that relief.\nThe Depression Severity of [FROM.GetNameDef] rises by §R[?great_depression_tt_partner_shock|0]§!, and it will resent us for it."
great_depression_competitive_devaluation_or_currency_break_tt: "Our exports become cheaper abroad and the budget gains room. For the next §Y[?great_depression_tt_relief_days|0]§! days of this depression, each Severity update is up to §G[?great_depression_tt_relief|0]§! lower.\nUp to §Y[?great_depression_tt_partner_cap|0]§! trading partners lose sales to us for §Y[?great_depression_tt_partner_days|0]§! days, which pushes them deeper into the worldwide contraction.\nThe worldwide recovery must hold §R[?great_depression_tt_drag_days|0]§! days longer before international reconstruction can begin, up to §R[?great_depression_tt_drag_maximum|0]§! days for all such measures together.\nThis can be done once in each worldwide depression."
great_depression_withdraw_from_international_commitments_tt: "We leave the worldwide recovery effort for the rest of this worldwide depression. Our recorded contributions and their industrial weight leave the common effort, and our contribution decisions close until it ends.\nThe capacity we had committed abroad comes home, and for the next §Y[?great_depression_tt_relief_days|0]§! days of this depression each Severity update is up to §G[?great_depression_tt_relief|0]§! lower as the budget sheds its foreign obligations."
great_depression_global_commitments_are_open_tt: "Has not withdrawn from international commitments during this worldwide depression"
great_depression_devaluation_is_unused_tt: "Has not devalued during this worldwide depression"
great_depression_market_abandoned: "Abandoned our market in the depression"
great_depression_supply_gap_exploited: "Profited from our broken supply in the depression"
great_depression_finance_restoration_needs_audit_tt: "The bank audit has been completed"
great_depression_strategic_closer_phase_is_open_tt: "The economy has reached Stabilization or Recovery"
great_depression_strategic_rescue_is_running_tt: "A strategic plant network or essential orders are in place"
great_depression_strategic_center_is_completed_tt: "A strategic plant network is designated, and one of its centers has completed its rescue"
great_depression_declare_temporary_bank_holiday_and_audit: "Declare Temporary Bank Holiday and Audit"
great_depression_declare_temporary_bank_holiday_and_audit_desc: "Pause withdrawals long enough to audit institutions and separate viable credit from panic."
great_depression_recapitalize_viable_institutions: "Recapitalize Viable Institutions"
great_depression_recapitalize_viable_institutions_desc: "Use public credit to restore institutions that can still carry payments and productive lending."
great_depression_negotiate_clearing_and_import_agreements: "Negotiate Clearing and Import Agreements"
great_depression_negotiate_clearing_and_import_agreements_desc: "Secure clearing terms and imports that keep essential trade moving while markets are impaired."
great_depression_establish_durable_credit_guarantee: "Establish Durable Credit Guarantee"
great_depression_establish_durable_credit_guarantee_desc: "Guarantee viable credit beyond the immediate panic so recovery investment can resume."
great_depression_balance_emergency_budget: "Balance Emergency Budget"
great_depression_balance_emergency_budget_desc: "Bring emergency spending and receipts into a credible balance before confidence breaks further."
great_depression_restructure_public_obligations: "Restructure Public Obligations"
great_depression_restructure_public_obligations_desc: "Reschedule public obligations to preserve the state's ability to fund recovery."
great_depression_retrench_relief_administration: "Retrench Relief Administration"
great_depression_retrench_relief_administration_desc: "Narrow relief to the most urgent cases, reducing fiscal pressure while exposing more households to hardship."
great_depression_restore_ordinary_budget_rules: "Restore Ordinary Budget Rules"
great_depression_restore_ordinary_budget_rules_desc: "Return the treasury to ordinary rules and prove that emergency finance can stand down."
great_depression_establish_emergency_production_board: "Establish Emergency Production Board"
great_depression_establish_emergency_production_board_desc: "Coordinate national production, orders, and bottlenecks through a single emergency board."
great_depression_nationalize_failing_industry: "Nationalize Failing Industry"
great_depression_nationalize_failing_industry_desc: "Take failing strategic firms into trusteeship so their assets remain available to the national plan."
great_depression_ration_strategic_inputs: "Ration Strategic Inputs"
great_depression_ration_strategic_inputs_desc: "Concentrate scarce inputs on essential production and accept pressure in less critical sectors."
great_depression_start_national_recovery_plan: "Start National Recovery Plan"
great_depression_start_national_recovery_plan_desc: "Commit ministries, transport, and industry to a complete national recovery plan."
great_depression_withdraw_emergency_support: "Withdraw Emergency Support"
great_depression_withdraw_emergency_support_desc: "End exceptional support and make the remaining economy confront its weakest assets."
great_depression_auction_or_reorganize_failed_assets: "Auction or Reorganize Failed Assets"
great_depression_auction_or_reorganize_failed_assets_desc: "Clear failed assets through auction or reorganization, accepting short-term disruption for a cleaner recovery."
great_depression_remove_emergency_controls: "Remove Emergency Controls"
great_depression_remove_emergency_controls_desc: "Lift controls that have outlived their purpose and test whether ordinary exchange can resume."
great_depression_begin_cleared_economy_certification: "Begin Cleared Economy Certification"
great_depression_begin_cleared_economy_certification_desc: "Begin the evidence review needed to certify that the economy can leave emergency management."
great_depression_ring_fence_domestic_finance: "Ring Fence Domestic Finance"
great_depression_ring_fence_domestic_finance_desc: "Protect domestic finance from an established foreign exposure while preserving a route for essential trade."
great_depression_extend_emergency_credit: "Extend Emergency Credit"
great_depression_extend_emergency_credit_desc: "Extend emergency credit to a partner or institution before a local liquidity problem becomes contagion."
great_depression_shift_import_and_contract_dependence: "Shift Import and Contract Dependence"
great_depression_shift_import_and_contract_dependence_desc: "Redirect imports and contracts away from an exposed partner and pay the transition cost."
great_depression_abandon_distressed_market: "Abandon Distressed Market"
great_depression_abandon_distressed_market_desc: "Cut our ties to a failing market at once to protect national reserves, leaving the partner to absorb the loss and remember it."
great_depression_acquire_distressed_assets: "Acquire Distressed Assets"
great_depression_acquire_distressed_assets_desc: "Acquire selected distressed assets from an established partner and bind their recovery to your own capacity."
great_depression_coordinate_international_rescue: "Coordinate International Rescue"
great_depression_coordinate_international_rescue_desc: "Coordinate a partner rescue package that combines aid, freight, and financial guarantees."
great_depression_request_emergency_credit: "Request Emergency Credit"
great_depression_request_emergency_credit_desc: "Request emergency credit from an established partner and accept the political conditions attached to it."
great_depression_offer_debt_standstill: "Offer Debt Standstill"
great_depression_offer_debt_standstill_desc: "Offer a partner a temporary debt standstill to keep its economy trading and its obligations recoverable."
great_depression_sell_distressed_assets: "Sell Distressed Assets"
great_depression_sell_distressed_assets_desc: "Sell distressed assets to raise liquidity, reducing domestic exposure at the price of future influence."
great_depression_establish_clearing_bloc: "Establish Clearing Bloc"
great_depression_establish_clearing_bloc_desc: "Build a clearing bloc that replaces broken settlement routes with a smaller, more reliable network."
great_depression_accept_external_supervision: "Accept External Supervision"
great_depression_accept_external_supervision_desc: "Accept outside supervision over recovery finance in exchange for credible access to support."
great_depression_restrict_capital_outflows: "Restrict Capital Outflows"
great_depression_restrict_capital_outflows_desc: "Restrict capital flight long enough to keep domestic banks and productive credit intact."
great_depression_prioritize_domestic_recovery: "Prioritize Domestic Recovery"
great_depression_prioritize_domestic_recovery_desc: "Put domestic recovery ahead of external commitments and accept the resulting strain on partners."
great_depression_offer_boom_supply_contract: "Offer Boom Supply Contract"
great_depression_offer_boom_supply_contract_desc: "Use a surviving Industrial Boom supplier relationship to keep essential deliveries moving under pressure."
great_depression_support_contagion_source: "Support Contagion Source"
great_depression_support_contagion_source_desc: "Send targeted aid to the identified source of financial contagion before the exposure becomes irreversible."
great_depression_withdraw_from_distressed_market: "Withdraw from Distressed Market"
great_depression_withdraw_from_distressed_market_desc: "Withdraw from a distressed partner market before its losses can become a domestic obligation."
great_depression_exploit_supply_gap: "Exploit Supply Gap"
great_depression_exploit_supply_gap_desc: "Buy the industrial inputs a depressed partner can no longer use or deliver, deepening its crisis and risking anger at home and abroad."
great_depression_negotiate_with_strike_committees: "Negotiate with Strike Committees"
great_depression_negotiate_with_strike_committees_desc: "Negotiate a settlement with organized strike committees before the incident becomes a general strike."
great_depression_national_employment_compact: "National Employment Compact"
great_depression_national_employment_compact_desc: "Bind government, employers, and labor to a national employment compact that lowers social pressure."
great_depression_deploy_security_forces: "Deploy Security Forces"
great_depression_deploy_security_forces_desc: "Protect essential services without allowing unrest to escalate into armed conflict."
great_depression_break_the_occupations: "Break the Occupations"
great_depression_break_the_occupations_desc: "Restore access to occupied workplaces and centers without turning every grievance into a wider conflict."
great_depression_recognize_workplace_or_regional_councils: "Recognize Workplace or Regional Councils"
great_depression_recognize_workplace_or_regional_councils_desc: "Give organized local actors a lawful channel into recovery administration and reduce the pressure to escalate."
great_depression_form_an_emergency_government: "Form an Emergency Government"
great_depression_form_an_emergency_government_desc: "Form a guarded emergency government with a concrete mandate to keep essential administration operating."
great_depression_nationalize_or_socialize_occupied_industry: "Nationalize or Socialize Occupied Industry"
great_depression_nationalize_or_socialize_occupied_industry_desc: "Place occupied industry under a recognized public structure so production and labor can resume."
great_depression_guarantee_property_and_credit: "Guarantee Property and Credit"
great_depression_guarantee_property_and_credit_desc: "Guarantee property and credit rights to separate social stabilization from a panic-driven seizure cycle."
great_depression_regional_clearing_agreement: "Regional Clearing Agreement"
great_depression_regional_clearing_agreement_desc: "Create a regional clearing agreement that protects trade while the global contraction remains active."
great_depression_coordinated_public_works_and_reconstruction: "Coordinated Public Works and Reconstruction"
great_depression_coordinated_public_works_and_reconstruction_desc: "Coordinate public works across borders so recovery capacity compounds instead of competing for the same inputs."
great_depression_international_debt_conference: "International Debt Conference"
great_depression_international_debt_conference_desc: "Convene creditors and debtors to replace unilateral default risk with a shared recovery schedule."
great_depression_protectionist_bloc: "Protectionist Bloc"
great_depression_protectionist_bloc_desc: "Build a protectionist bloc around domestic demand and accept weaker world trade in return for a clearer home market."
great_depression_competitive_devaluation_or_currency_break: "Competitive Devaluation or Currency Break"
great_depression_competitive_devaluation_or_currency_break_desc: "Cut the value of the national currency to win back export orders and ease the budget, knowing that trading partners will lose those orders and the worldwide recovery will take longer."
great_depression_reconstruction_supplier_compact: "Reconstruction Supplier Compact"
great_depression_reconstruction_supplier_compact_desc: "Guarantee a supplier compact for reconstruction goods and make the global recovery depend on reliable delivery."
great_depression_global_recovery_conference: "Global Recovery Conference"
great_depression_global_recovery_conference_desc: "Turn national contributions into a shared recovery conference capable of closing the worldwide episode."
great_depression_emergency_trade_clearing: "Emergency Trade Clearing"
great_depression_emergency_trade_clearing_desc: "Keep emergency trade clearing open so the global contraction does not become a total supply freeze."
great_depression_reconstruction_and_employment_fund: "Reconstruction and Employment Fund"
great_depression_reconstruction_and_employment_fund_desc: "Pool funds for reconstruction and employment, lowering pressure across participating economies."
great_depression_protect_domestic_market: "Protect Domestic Market"
great_depression_protect_domestic_market_desc: "Protect domestic demand from the global shock while preserving enough trade to avoid supplier failure."
great_depression_coordinate_industrial_demand: "Coordinate Industrial Demand"
great_depression_coordinate_industrial_demand_desc: "Coordinate industrial demand across participating countries so factories reopen in a usable sequence."
great_depression_withdraw_from_international_commitments: "Withdraw from International Commitments"
great_depression_withdraw_from_international_commitments_desc: "Withdraw from costly international commitments and accept a smaller role in global recovery."
great_depression_halt_the_panic: "Halt the Panic"
great_depression_halt_the_panic_desc: "Hold the financial panic below the next escalation threshold while preserving a functioning payment system."
great_depression_keep_essential_freight_moving: "Keep Essential Freight Moving"
great_depression_keep_essential_freight_moving_desc: "Keep essential freight, fuel, and rail movement available through the opening contraction."
great_depression_reopen_depression_center: "Reopen Depression Center"
great_depression_reopen_depression_center_desc: "Reopen the selected depression center before idling becomes sustained industrial loss."
great_depression_prevent_a_relapse: "Prevent a Relapse"
great_depression_prevent_a_relapse_desc: "Complete recovery with a guarded reserve and no return to the relapse threshold."
great_depression_maximum_severity_emergency: "Maximum-Severity Emergency"
great_depression_maximum_severity_emergency_desc: "Answer economic paralysis with a final emergency response before the crisis closes every remaining option."
great_depression_prevent_national_breakdown: "Prevent National Breakdown"
great_depression_prevent_national_breakdown_desc: "Keep a baseline crisis below national breakdown while the warning window remains open."
great_depression_contain_financial_contagion: "Contain Financial Contagion"
great_depression_contain_financial_contagion_desc: "Contain an external exposure before the partner relationship converts into a second depression."
great_depression_prevent_general_strike: "Prevent General Strike"
great_depression_prevent_general_strike_desc: "Settle organized unrest before it becomes a general strike."
great_depression_international_reconstruction: "International Reconstruction"
great_depression_international_reconstruction_desc: "Contribute enough reconstruction capacity to restore trade and bring the worldwide contraction to an end."
great_depression_national_employment_guarantee: "National Employment Guarantee"
great_depression_national_employment_guarantee_desc: "Sustain a national employment guarantee long enough to lower pressure through the opening phase."
great_depression_complete_national_recovery_plan: "Complete National Recovery Plan"
great_depression_complete_national_recovery_plan_desc: "Complete the recovery plan and keep its core commitments intact through stabilization."
great_depression_certify_cleared_economy: "Certify Cleared Economy"
great_depression_certify_cleared_economy_desc: "Certify that ordinary budget, credit, and industrial rules can resume without immediate relapse."
great_depression_coordinate_international_rescue_mission: "Coordinate International Rescue Mission"
great_depression_coordinate_international_rescue_mission_desc: "Coordinate international rescue across a partner network and keep the contagion line closed."
great_depression_restore_essential_production: "Restore Essential Production"
great_depression_restore_essential_production_desc: "Restore essential production and freight before social pressure becomes a general strike."
great_depression_emergency_government_mandate: "Emergency Government Mandate"
great_depression_emergency_government_mandate_desc: "Give the emergency government a recovery mandate and prevent national breakdown."

great_depression_achievement_eligible_tooltip: "Available to a player country that enters Great Depression 2.0 and completes a recovery."
035_great_depression_back_to_work_NAME: "Back to Work"
035_great_depression_back_to_work_DESC: "Recover from a severe independent Great Depression while preserving every original Depression Center and losing no factories to the crisis."
035_great_depression_back_to_work_tooltip: "Complete a severe independent recovery with every original Depression Center preserved and no factories lost to the depression."
035_great_depression_every_center_reopened_NAME: "Every Center Reopened"
035_great_depression_every_center_reopened_DESC: "Reach Economic Paralysis, survive the maximum emergency, and recover every Depression Center without abandoning one."
035_great_depression_every_center_reopened_tooltip: "Reach Severity 100, answer the maximum emergency, and recover every Depression Center without liquidation."
035_great_depression_containment_line_NAME: "Containment Line"
035_great_depression_containment_line_DESC: "Contain Financial Contagion and recover without allowing the crisis to create a new depression abroad."
035_great_depression_containment_line_tooltip: "Contain an established foreign exposure, complete a contagion response, and prevent every exposed partner from falling into depression before recovery."
035_great_depression_social_peace_NAME: "The Social Peace"
035_great_depression_social_peace_DESC: "Recover from near-maximum Social Collapse after a major incident without a coup, civil conflict, emergency government, or emergency mandate."
035_great_depression_social_peace_tooltip: "Survive Social Collapse after Severity 90 or higher, settle a major incident, keep stability above 35%, and recover without a coup, civil conflict, emergency government, or emergency mandate."
035_great_depression_lean_but_standing_NAME: "Lean but Standing"
035_great_depression_lean_but_standing_DESC: "Liquidate part of the industrial base, keep the country viable, and recover without political collapse."
035_great_depression_lean_but_standing_tooltip: "Complete a liquidation-led recovery after losing factories to the depression while the country remains viable and independent."
035_great_depression_recovery_of_nations_NAME: "Recovery of Nations"
035_great_depression_recovery_of_nations_DESC: "Lead international reconstruction during The Second Great Depression and help bring the worldwide crisis to recovery."
035_great_depression_recovery_of_nations_tooltip: "Complete three validated aid or reconstruction contributions, improve a major recipient, keep stability above 35%, and help the world reach Recovery without a supplier collapse."

chaosx_super_event.105.t: "THE SECOND GREAT DEPRESSION"
chaosx_super_event.105.q: "\"The means of exchange are frozen in the currents of trade.\" - Franklin D. Roosevelt, First Inaugural Address, 1933"
chaosx_super_event.105.a: "A bad attack of economic pessimism."
chaosx_super_event.105.d: "The contraction has crossed every border that once contained it. Markets seize, suppliers fail, and governments must choose between protecting their own recovery and keeping the wider system alive. International reconstruction remains possible, but only if promises become deliveries and stronger economies carry part of their neighbors' burden."
