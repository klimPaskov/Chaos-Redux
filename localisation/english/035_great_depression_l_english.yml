chaosx.events_log.window.event_details.great_depression: "Great Depression 2.0 follows a national economy from panic and contraction through depression, stabilization, and recovery. Depression Severity measures the public crisis while distressed industrial centers, foreign exposure, social peace, and the government's recovery doctrine shape the road out."

great_depression.evolution.type: "Great Depression 2.0"
great_depression.evolution.1.title: "Financial Contagion"
great_depression.evolution.1.body: "Trade, credit, and supplier ties carry the panic across borders. Exposed partners can send aid, redirect supply, protect domestic finance, or withdraw before foreign strain becomes a depression of its own."
great_depression.evolution.1.summary: "Financial Contagion carries the panic through trade, credit, and supplier ties."
great_depression.evolution.2.title: "Social Collapse"
great_depression.evolution.2.body: "Organized movements turn prolonged hardship into strikes, emergency mandates, and regional demands. Political collapse or armed conflict follows only when the government loses control of the actors and institutions that could still contain them."
great_depression.evolution.2.summary: "Social Collapse turns prolonged hardship into organized strikes, mandates, and regional demands."
great_depression.evolution.3.title: "The Second Great Depression"
great_depression.evolution.3.body: "A worldwide contraction links national recoveries through failing demand, vulnerable suppliers, and scarce credit. Countries can protect themselves, support exposed partners, or assemble an international reconstruction effort strong enough to restore trade."
great_depression.evolution.3.summary: "The Second Great Depression binds national recoveries to a worldwide struggle over demand, supply, credit, and reconstruction."

