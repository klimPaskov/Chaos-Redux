great_depression_active: "Great Depression"
great_depression_active_desc: "A national economic crisis is constraining production, credit, employment, and public confidence."
great_depression_economic_contagion: "Economic Contagion"
great_depression_economic_contagion_desc: "An established foreign financial relationship is transmitting additional pressure into the national recovery."
great_depression_global_contraction: "Worldwide Contraction"
great_depression_global_contraction_desc: "The Second Great Depression is applying lighter pressure through international trade, demand, and supplier relationships."
great_depression_global_contraction_light: "Worldwide Contraction: Light Exposure"
great_depression_global_contraction_light_desc: "Fewer orders from abroad and slower payments from trading partners are holding production back. The economy feels the worldwide contraction at its edges, while its own banks and markets keep working."
great_depression_global_contraction_severe: "Worldwide Contraction: Heavy Exposure"
great_depression_global_contraction_severe_desc: "This economy depends on partners caught in the worldwide contraction. Cancelled orders, scarce credit, and idle supplier plants are cutting deep into production, although its own banks and markets still stand."
great_depression_post_recovery: "Post-Depression Recovery"
great_depression_post_recovery_desc: "The depression is over, and public confidence holds while the recovery proves it can last. The safeguard fades after a few calm months or when a new depression begins."
great_depression_legacy_public_works: "Public Works Legacy"
great_depression_legacy_public_works_desc: "Emergency works left roads, rail spurs, and housing that keep construction crews ready and soften the fall in demand when the next downturn comes. Maintaining them ties up civilian industry, and their upkeep becomes a heavy charge whenever a new depression turns deep."
great_depression_legacy_strategic_industry: "Strategic Industry Legacy"
great_depression_legacy_strategic_industry_desc: "The recovery preserved a coordinated network of essential plants that holds its output through a new crisis. The civilian builders it passed over are slow to expand, and in peacetime the protected plants lean on orders the country cannot always supply."
great_depression_legacy_finance_and_trade: "Finance and Trade Legacy"
great_depression_legacy_finance_and_trade_desc: "Clearing agreements and restored credit keep trade moving and steady the banks when the next panic comes. Foreign partners keep a claim on our exports, and our trade suffers whenever financial contagion or a worldwide contraction reaches them."
great_depression_legacy_austerity: "Austerity Legacy"
great_depression_legacy_austerity_desc: "Retrenchment left a leaner budget that eases the strain of a new crisis on public finances. The relief offices it cut remain thinly staffed, so closed plants turn more quickly into social unrest."
great_depression_legacy_direct_state_planning: "Direct State Planning Legacy"
great_depression_legacy_direct_state_planning_desc: "The planning authority coordinates freight and essential production, which keeps goods moving through a new crisis. Its controls slow every change of production line, and its administration weighs on the budget once a crisis begins to ease."
great_depression_legacy_market_clear: "Market-Clearing Legacy"
great_depression_legacy_market_clear_desc: "Liquidation left fewer but sturdier firms that recover quickly when the country is calm. The skilled workers who left the closed towns are slow to return, so new production lines start less efficiently and closed plants deepen the slump in demand."
great_depression_scar_hollow_recovery: "Hollow Recovery Scar"
great_depression_scar_hollow_recovery_desc: "A depression center was permanently hollowed during the crisis, reducing the strength of the recovery."
great_depression_scar_debt_overhang: "Debt Overhang"
great_depression_scar_debt_overhang_desc: "Emergency credit taken during the depression was never restructured, and servicing it keeps part of the economy working for creditors. A strong recovery under austerity or a finance and trade program would clear it."
great_depression_scar_foreign_credit_dependence: "Foreign Credit Dependence"
great_depression_scar_foreign_credit_dependence_desc: "Foreign supervisors and lenders who carried us through the depression still claim a share of our exports. A strong recovery under a finance and trade program or direct state planning would end the dependence."
great_depression_scar_emergency_controls: "Emergency Controls"
great_depression_scar_emergency_controls_desc: "Rationing boards and capital controls set up during the depression were never dismantled, and every factory still answers to their permits. A strong recovery that removes them or lets the market clear would retire them."
great_depression_scar_labor_bitterness: "Labor Bitterness"
great_depression_scar_labor_bitterness_desc: "Workers remember the police and soldiers sent against their strikes and occupations. A strong recovery built on public works or a negotiated social compact would ease the bitterness."
great_depression_scar_policy_fatigue: "Policy Fatigue"
great_depression_scar_policy_fatigue_desc: "Repeated changes of recovery doctrine left ministries exhausted and the public unwilling to trust the next program. A strong recovery under one unchanged doctrine would restore that trust."
great_depression_emergency_government: "Emergency Government"
great_depression_emergency_government_desc: "An emergency government rules by decree while its mandate lasts. Railways, relief offices, and factories answer to its commissioners, and ordinary cabinet business waits on their orders."
great_depression_aftermath_social_compact: "Social Compact"
great_depression_aftermath_social_compact_desc: "The settlement that ended the strikes still binds employers, unions, and the state. Wages and relief are negotiated rather than imposed, which keeps the peace and keeps part of industry working for the home market."
great_depression_aftermath_emergency_rule: "Emergency Rule"
great_depression_aftermath_emergency_rule_desc: "The emergency government that settled the crisis left its decrees and commissioners in place. Order holds, and ministries still wait on approvals that once needed only a signature."
great_depression_aftermath_planning_settlement: "Planning Settlement"
great_depression_aftermath_planning_settlement_desc: "The occupied plants passed into public hands under worker councils and state managers. Output is steady and directed, and improvements on the factory floor come slowly through committees."
great_depression_aftermath_corporate_rescue_order: "Corporate Rescue Order"
great_depression_aftermath_corporate_rescue_order_desc: "The state guaranteed the property and credit of the great firms to end the crisis. The rescued companies run efficiently, and the workers who paid for the rescue have not forgotten it."
great_depression_aftermath_regional_autonomy: "Regional Autonomy"
great_depression_aftermath_regional_autonomy_desc: "The councils recognized during the crisis still govern relief and local industry in their regions. They keep their districts calm, and national projects need their consent."
great_depression_aftermath_labor_scar: "Labor Scar"
great_depression_aftermath_labor_scar_desc: "Strikes broken by police and soldiers left a bitterness in the factories that outlived the depression. Workers give no more than they must, and every new hardship finds an angry audience."
chaosx_cxt_extension_event035_great_depression: "Great Depression Test Extension"
chaosx_cxt_extension_event035_great_depression_desc: "Makes Great Depression 2.0 systems available to the test country."
great_depression_civilian_commitment: "Emergency Civilian Commitment"
great_depression_civilian_commitment_desc: "Temporary civilian capacity is reserved for the active depression response."
great_depression_civilian_commitment_major: "Major Emergency Civilian Commitment"
great_depression_civilian_commitment_major_desc: "Temporary civilian capacity is reserved at major-country scale for the active depression response."
great_depression_national_panic: "National Panic"
great_depression_national_panic_desc: "The opening contraction is damaging confidence, demand, and industrial throughput."
great_depression_national_depression: "National Depression"
great_depression_national_depression_desc: "Sustained economic contraction is suppressing production, credit, resources, and public confidence."
great_depression_national_deep: "Deep Depression"
great_depression_national_deep_desc: "The depression has become a deep national contraction with severe industrial and social effects."
great_depression_national_systemic: "Systemic Breakdown"
great_depression_national_systemic_desc: "The national economy is approaching systemic failure across production, finance, and public order."
great_depression_national_paralysis: "Economic Paralysis"
great_depression_national_paralysis_desc: "The economy has reached total paralysis and can sustain only one final emergency response."
great_depression_national_stabilizing: "Stabilizing Economy"
great_depression_national_stabilizing_desc: "The response is holding the contraction below its former peak while recovery remains incomplete."
great_depression_national_recovery: "Recovering Economy"
great_depression_national_recovery_desc: "The crisis is receding, but the country must still prove that recovery can hold."
great_depression_opening_shock: "Opening Economic Shock"
great_depression_opening_shock_desc: "The initial shock is still working through the economy and its industrial centers."
great_depression_policy_whiplash: "Policy Whiplash"
great_depression_policy_whiplash_desc: "A rapid change of recovery doctrine has disrupted confidence and administrative momentum."
great_depression_financial_contagion: "Financial Contagion Pressure"
great_depression_financial_contagion_desc: "An established foreign exposure is tightening credit and trade conditions at home."
great_depression_social_collapse_pressure: "Social Collapse Pressure"
great_depression_social_collapse_pressure_desc: "Organized unrest is adding pressure to the economy and the government's ability to maintain order."
great_depression_center_distressed: "Distressed Depression Center"
great_depression_center_distressed_desc: "This industrial center is operating under severe local pressure and declining capacity."
great_depression_center_idled: "Idled Depression Center"
great_depression_center_idled_desc: "This industrial center has stopped ordinary production while its recovery is negotiated."
great_depression_center_shuttered: "Shuttered Depression Center"
great_depression_center_shuttered_desc: "This industrial center has been closed after sustained failure."
great_depression_center_abandoned: "Abandoned Depression Center"
great_depression_center_abandoned_desc: "This industrial center has been deliberately liquidated or abandoned."
great_depression_center_protected: "Protected Depression Center"
great_depression_center_protected_desc: "Emergency guards, freight, and support are protecting this center for a bounded response period."
great_depression_center_public_works: "Public Works at Depression Center"
great_depression_center_public_works_desc: "Emergency works are keeping this center supplied while creating durable recovery capacity."
great_depression_center_reopened: "Reopened Depression Center"
great_depression_center_reopened_desc: "This depression center has returned to service after a successful reopening."
great_depression_center_hollowed: "Hollowed Depression Center"
great_depression_center_hollowed_desc: "This center has suffered permanent industrial loss and can no longer return at its former strength."
great_depression_state_recovered_district: "Recovered Industrial District"
great_depression_state_recovered_district_desc: "A recovery project rebuilt this district's industry after the depression, and its workers and suppliers came back with it."
great_depression_state_scarred_district: "Scarred Industrial District"
great_depression_state_scarred_district_desc: "The depression closed or destroyed industry here that was never rebuilt, and the district still carries the unemployment and empty works it left behind."

