l_english:
chaosx.nr35.1.t: "Great Depression 2.0"

chaosx.nr35.2.t: "Depression in [ROOT.GetName]"
chaosx.nr35.2.d: "[This.GetGreatDepressionOpeningDescription]"
chaosx.nr35.2.d.base: "Cancelled orders and frozen credit have closed plants across [ROOT.GetName]. Depression Severity is [?great_depression_depression_severity|0] / 100 ([ROOT.GetGreatDepressionSeverityBand]). The chief pressures are [ROOT.GetGreatDepressionCauseOne][ROOT.GetGreatDepressionCauseTwo][ROOT.GetGreatDepressionCauseThree]."
chaosx.nr35.2.d.inherited: "The recent industrial expansion has ended in cancelled projects and unpaid suppliers across [ROOT.GetName]. Depression Severity is [?great_depression_depression_severity|0] / 100 ([ROOT.GetGreatDepressionSeverityBand]). The chief pressures are [ROOT.GetGreatDepressionCauseOne][ROOT.GetGreatDepressionCauseTwo][ROOT.GetGreatDepressionCauseThree]."
chaosx.nr35.2.d.contagion: "Banks and exporters in [ROOT.GetName] are losing orders and payments from foreign markets. The contraction has reached domestic industry. Depression Severity is [?great_depression_depression_severity|0] / 100 ([ROOT.GetGreatDepressionSeverityBand]). The chief pressures are [ROOT.GetGreatDepressionCauseOne][ROOT.GetGreatDepressionCauseTwo][ROOT.GetGreatDepressionCauseThree]."
chaosx.nr35.2.d.social: "Strikes and workplace occupations have spread across [ROOT.GetName]. Unpaid wages and empty relief offices have turned the depression into a struggle over who controls essential services. Depression Severity is [?great_depression_depression_severity|0] / 100 ([ROOT.GetGreatDepressionSeverityBand]). The chief pressures are [ROOT.GetGreatDepressionCauseOne][ROOT.GetGreatDepressionCauseTwo][ROOT.GetGreatDepressionCauseThree]."
chaosx.nr35.2.d.worldwide: "The worldwide contraction has reached [ROOT.GetName]. Foreign orders have fallen and factories are dismissing workers as banks refuse further loans. Depression Severity is [?great_depression_depression_severity|0] / 100 ([ROOT.GetGreatDepressionSeverityBand]). The chief pressures are [ROOT.GetGreatDepressionCauseOne][ROOT.GetGreatDepressionCauseTwo][ROOT.GetGreatDepressionCauseThree]."
chaosx.nr35.2.d.relapse: "Factories in [ROOT.GetName] are closing again after a brief recovery. Earlier relief measures have failed to withstand falling orders and renewed credit losses. Depression Severity is [?great_depression_depression_severity|0] / 100 ([ROOT.GetGreatDepressionSeverityBand]). The chief pressures are [ROOT.GetGreatDepressionCauseOne][ROOT.GetGreatDepressionCauseTwo][ROOT.GetGreatDepressionCauseThree]."
chaosx.nr35.2.a: "Survey the closures and choose a recovery course."
chaosx.nr35.3.t: "National Breakdown Warning"
chaosx.nr35.4.t: "The Emergency Mandate"
chaosx.nr35.4.d: "Strike committees and regional councils still control essential workplaces after the government's response failed. An emergency government may keep railways, relief offices, and factories operating, but ordinary cabinet rule will remain suspended until its mandate ends."
chaosx.nr35.4.a: "Entrust the state to an emergency government"
chaosx.nr35.4.b: "Stand down and negotiate a settlement"
chaosx.nr35.5.t: "Regional Councils Demand Recognition"
chaosx.nr35.5.d: "Regional councils now control workplaces and relief offices across their districts. Recognition can bring them into a negotiated recovery settlement. Forced integration retains direct rule at a deeper political cost."
chaosx.nr35.5.a: "Recognize the regional councils"
chaosx.nr35.5.b: "Enforce national integration"
chaosx.nr35.6.t: "National Breakdown"
chaosx.nr35.6.d: "The last emergency program has failed. Ministries are losing control of relief, transport, and industrial administration. The government can negotiate an emergency settlement or replace the cabinet and restore civilian authority. Open conflict is possible only where an armed opposition already holds territory and resources."
chaosx.nr35.6.a: "Conclude an emergency settlement"
chaosx.nr35.6.b: "Replace the cabinet and restore civilian authority"
chaosx.nr35.6.c: "The state will be decided by force"
chaosx.nr35.11.t: "[This.GetGreatDepressionRecoveryTitle]"
chaosx.nr35.11.d: "[This.GetGreatDepressionRecoveryDescription]"
chaosx.nr35.11.d.strong: "Orders are reaching the mills and assembly halls of [This.GetName] again, and the queues outside the labor exchanges have thinned to their ordinary length. The depression ends with [?great_depression_last_completed_final_reopened_count|0] industrial centers reopened, [?great_depression_last_completed_final_restructured_count|0] restructured onto new work, and none liquidated, after Depression Severity peaked at [?great_depression_last_completed_episode_peak_severity|0]. [This.GetGreatDepressionRecoveryInstitution] [This.GetGreatDepressionRecoveryLoss] [This.GetGreatDepressionRecoveryDistricts]"
chaosx.nr35.11.d.uneven: "Work has returned to most of [This.GetName], and in the districts it has not reached, families still depend on relief offices and the occasional day of casual labor. The depression ends with [?great_depression_last_completed_final_reopened_count|0] industrial centers reopened, [?great_depression_last_completed_final_restructured_count|0] restructured onto new work, and [?great_depression_last_completed_final_liquidated_count|0] liquidated, after Depression Severity peaked at [?great_depression_last_completed_episode_peak_severity|0]. [This.GetGreatDepressionRecoveryInstitution] [This.GetGreatDepressionRecoveryLoss] [This.GetGreatDepressionRecoveryDistricts]"
chaosx.nr35.11.d.hollow: "The crisis has passed for most of [This.GetName], and the districts where the depression did its worst damage are left with chained gates, empty company housing, and workers leaving for other provinces. The depression ends with [?great_depression_last_completed_final_reopened_count|0] industrial centers reopened, [?great_depression_last_completed_final_restructured_count|0] restructured onto new work, [?great_depression_last_completed_final_liquidated_count|0] liquidated, and [?great_depression_last_completed_final_abandoned_count|0] abandoned, after Depression Severity peaked at [?great_depression_last_completed_episode_peak_severity|0]. [This.GetGreatDepressionRecoveryInstitution] [This.GetGreatDepressionRecoveryLoss] [This.GetGreatDepressionRecoveryDistricts]"
chaosx.nr35.11.a: "[This.GetGreatDepressionRecoveryOption]"
chaosx.nr35.11.a.strong: "Keep the institutions that carried us through."
chaosx.nr35.11.a.uneven: "Turn to the districts still waiting for work."
chaosx.nr35.11.a.hollow: "Count what this recovery has cost."
great_depression.recovery_report.title.strong: "A Strong Recovery"
great_depression.recovery_report.title.uneven: "An Uneven Recovery"
great_depression.recovery_report.title.hollow: "A Hollow Recovery"
great_depression.recovery_report.institution.public_works: "The public works administration stays in place to maintain the roads, rail spurs, and housing its crews built, and their upkeep remains on the budget."
great_depression.recovery_report.institution.strategic_industry: "The industrial board that decided which plants would survive keeps its hold on essential production, and the civilian firms it passed over are slow to recover."
great_depression.recovery_report.institution.finance_and_trade: "The credit guarantees and clearing agreements that reopened the banks stay in force, and foreign partners keep a voice in how they are honored."
great_depression.recovery_report.institution.austerity: "The Treasury keeps the lean budget it imposed during the crisis, and the relief offices it cut remain thinly staffed."
great_depression.recovery_report.institution.direct_state_planning: "The planning authority keeps its role in directing production and freight, and private firms still wait on its approvals."
great_depression.recovery_report.institution.market_clear: "The firms that survived liquidation now own a larger share of industry, and the towns built around closed plants have fewer employers to turn to."
great_depression.recovery_report.institution.none: "No single recovery program outlasts the crisis."
great_depression.recovery_report.loss.factories: "The depression destroyed [?great_depression_last_completed_civilian_factory_levels_lost|0] civilian and [?great_depression_last_completed_military_factory_levels_lost|0] military factory levels."
great_depression.recovery_report.loss.idle_districts: "No factory was demolished, and the abandoned works still stand idle with their machinery inside."
great_depression.recovery_report.loss.none: "No factory was lost to the depression."
great_depression.recovery_report.districts.both: "In [?great_depression_last_completed_recovered_district.GetName], the recovery project left plants and works that will outlast the crisis. In [?great_depression_last_completed_scarred_district.GetName], the closed works and the unemployment they caused will remain for years."
great_depression.recovery_report.districts.two_recovered: "In [?great_depression_last_completed_recovered_district.GetName] and [?great_depression_last_completed_second_recovered_district.GetName], the recovery projects left plants and works that will outlast the crisis."
great_depression.recovery_report.districts.recovered: "In [?great_depression_last_completed_recovered_district.GetName], the recovery project left plants and works that will outlast the crisis."
great_depression.recovery_report.districts.scarred: "In [?great_depression_last_completed_scarred_district.GetName], the closed works and the unemployment they caused will remain for years."
great_depression.recovery_report.districts.none: ""
chaosx.nr35.12.t: "Contagion in the Credit Markets"
chaosx.nr35.12.d: "Foreign banks are calling in their credit lines to [ROOT.GetName], and shipping agents abroad ask for cash before they will load our cargo. Contracts signed in better years are being renegotiated or quietly abandoned as creditors try to limit what our crisis can cost them. [ROOT.GetGreatDepressionContagionReportPartners] The ministries can work through these links abroad by extending or seeking emergency credit, clearing trade, or writing off the markets that can no longer pay."
chaosx.nr35.12.a: "Keep the creditors at the table."
great_depression.contagion_report.partners.none: "No foreign economy is yet tied closely enough to our banks and order books to share the shock."
great_depression.contagion_report.partners.one: "[?great_depression_contagion_report_partner.GetName] is tied most closely to our banks and order books, and its exporters are already counting unpaid invoices."
great_depression.contagion_report.partners.many: "[?great_depression_contagion_report_partner.GetName] is the most exposed of the [?great_depression_contagion_report_partner_count|0] partner economies tied to our banks and order books."
chaosx.nr35.13.t: "The Movement Takes Shape"
chaosx.nr35.13.d: "Strike committees, unemployed councils, and relief delegations across [ROOT.GetName] have stopped acting alone. [ROOT.GetGreatDepressionMovementFamily] Workplaces and relief offices are beginning to choose whom to obey, and every closed plant and unpaid wage brings the movement new recruits."
chaosx.nr35.13.a: "We must answer them before they fill the streets."
great_depression.movement.trade_union_coalition: "The trade unions and their allies in parliament have joined in one coalition that speaks for the unemployed and for every worker on short time."
great_depression.movement.communist_council: "Communist councils are organizing the factories and the jobless into a movement that answers to its own committees."
great_depression.movement.syndicalist_occupation: "Syndicalist organizers are leading workers into the idle plants and urging them to run the machines without their owners."
great_depression.movement.nationalist_mass: "A nationalist mass movement blames foreign creditors and the established parties for the closures and recruits openly among the unemployed."
great_depression.movement.military_emergency: "Officers and veterans' leagues are organizing around a demand for emergency rule and the protection of the arms industry."
great_depression.movement.traditional_authority: "Notables, clergy, and partisans of the old order are rallying the small towns behind a call for restored authority."
great_depression.movement.regional_autonomy: "Councils in the depressed regions are demanding control over their own relief, credit, and industry."
great_depression.movement.business_creditor: "Industrialists and creditors have formed an emergency coalition that demands protection for property and repayment of their loans."
great_depression.movement.rural_protest: "Farmers and rural laborers are marching against falling prices, foreclosures, and the hunger spreading through the villages."
chaosx.nr35.14.t: "Pressure from [?great_depression_exposure_report_origin.GetName]"
chaosx.nr35.14.d: "[ROOT.GetGreatDepressionExposureSummary] Our banks are refusing to renew loans to firms that trade with [?great_depression_exposure_report_origin.GetName], where the depression has closed plants and frozen credit. [ROOT.GetGreatDepressionExposureRelationship] Exporters wait on unpaid invoices, importers search for other suppliers, and depositors ask how much of their savings sits in foreign paper. We can restrict the flight of capital, support [?great_depression_exposure_report_origin.GetName] through its crisis, or put our own recovery first."
chaosx.nr35.14.a: "Protect our banks and exporters."
great_depression.exposure_report.relationship.neighbor: "Trade across our shared border carries their contraction straight into our markets."
great_depression.exposure_report.relationship.allied: "Our alliance has tied the credit of our banks to theirs."
great_depression.exposure_report.relationship.faction: "Membership in the same faction binds our banks and war contracts to theirs."
great_depression.exposure_report.relationship.subject_market: "The bond between overlord and subject runs through the same banks and the same order books."
great_depression.exposure_report.relationship.event_agreement: "The emergency agreements signed with them during their crisis carry its losses to us."
great_depression.exposure_report.relationship.supplier_contract: "Their supply contracts with us are going unpaid as their orders collapse."
chaosx.nr35.15.t: "Depression Spreads to [FROM.GetName]"
chaosx.nr35.15.d: "Banks in [FROM.GetName] have closed their doors to depositors after months of unpaid loans and cancelled orders from [?FROM.great_depression_first_spread_origin.GetName]. The collapse that began in [?FROM.great_depression_first_spread_origin.GetName] has become a full depression beyond its borders, and merchants in every port are asking which economy will follow."
chaosx.nr35.15.a: "Another economy has fallen."
chaosx.nr35.16.t: "The World Begins to Rebuild"
chaosx.nr35.16.d: "[ROOT.GetGreatDepressionReconstructionNews]"
chaosx.nr35.16.d.origin: "Ministers and bankers from the economies that carried the world through the Second Great Depression have agreed to keep their reconstruction funds, clearing arrangements, and supply guarantees running. Cargo is moving again through ports that stood idle after the collapse spread outward from [?global.great_depression_news_origin.GetName], and governments are coordinating the recovery across their borders."
chaosx.nr35.16.d.plain: "Ministers and bankers from the economies that carried the world through the Second Great Depression have agreed to keep their reconstruction funds, clearing arrangements, and supply guarantees running. Cargo is moving again through ports that stood idle at the worst of the collapse, and governments are coordinating the recovery across their borders."
chaosx.nr35.16.a: "Keep the funds flowing."
chaosx.nr35.17.t: "The Second Great Depression Ends"
chaosx.nr35.17.d: "[ROOT.GetGreatDepressionWorldRecoveryNews]"
chaosx.nr35.17.d.origin: "The last emergency clearing arrangements of the Second Great Depression have been wound down, and trade between the major economies runs on ordinary terms again. The depression that spread outward from [?global.great_depression_news_origin.GetName] now belongs to the statistics offices and the histories. The countries that lost the most still carry closed districts and debts that will take years to clear."
chaosx.nr35.17.d.plain: "The last emergency clearing arrangements of the Second Great Depression have been wound down, and trade between the major economies runs on ordinary terms again. The worldwide depression now belongs to the statistics offices and the histories. The countries that lost the most still carry closed districts and debts that will take years to clear."
chaosx.nr35.17.a: "May we never see another."
chaosx.nr35.18.t: "Supplier Collapse in [?global.great_depression_supplier_news_country.GetName]"
chaosx.nr35.18.d: "The boom that made [?global.great_depression_supplier_news_country.GetName] a supplier to the wider world has broken. Its factories are cancelling deliveries that other economies had counted on for their own recovery, and buyers abroad are scrambling for substitutes as the international recovery effort loses one of its pillars."
chaosx.nr35.18.a: "Find other suppliers."
chaosx.nr35.19.t: "Recovery Conference Collapses"
chaosx.nr35.19.d: "The recovery conference called by [?global.great_depression_conference_convener.GetNameDef] has broken up without agreement. Too few governments came to the table, and those that did could not settle who would extend the credits, lower the tariffs, or carry the cost of new orders. Delegates left blaming one another, and the recovery that markets had begun to price in has been set back."
chaosx.nr35.19.a: "Every nation for itself, then."

