l_english:
chaosx.nr35.1.t: "Great Depression"

chaosx.nr35.2.t: "Great Depression"
chaosx.nr35.2.d: "The Great Depression has reached our nation. Markets are collapsing, unemployment is spreading, and families are cutting back as businesses close their doors."
chaosx.nr35.2.a: "The crisis has arrived."

chaosx.news.40.t: "Great Depression"
chaosx.news.40.d: "A deepening economic crisis is spreading through [From.GetName]. Stock markets are falling, factories are idle, and families are losing work as the Great Depression takes hold."
chaosx.news.40.a: "The downturn is spreading."
