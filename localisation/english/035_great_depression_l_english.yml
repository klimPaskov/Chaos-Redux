chaosx.news.40.t: "Depression Strikes [FROM.GetName]"
chaosx.news.40.d: "A deepening economic crisis is spreading through [From.GetName]. Stock markets are falling, factories are idle, and families are losing work as the Great Depression takes hold."
chaosx.news.40.a: "The downturn is spreading."
chaosx.news.95.t: "The Second Great Depression"
chaosx.news.95.d: "Credit, orders, and trade are contracting across several industrial economies. Markets are freezing, construction is slowing, and governments are searching for a way to keep the international system from breaking apart."
chaosx.news.95.a: "The world economy is entering a new crisis."

great_depression_choose_emergency_public_works: "Choose Emergency Public Works"
great_depression_choose_emergency_public_works_desc: "Adopt a relief coalition that accepts immediate public employment and durable infrastructure commitments."
great_depression_choose_rescue_strategic_industry: "Choose Rescue Strategic Industry"
great_depression_choose_rescue_strategic_industry_desc: "Keep strategic plants operating through guaranteed demand, orders, and controlled consolidation."
great_depression_choose_stabilize_finance_and_trade: "Choose Stabilize Finance and Trade"
great_depression_choose_stabilize_finance_and_trade_desc: "Make bank solvency, credit, and clearing agreements the first line of recovery."
great_depression_choose_austerity_and_retrenchment: "Choose Austerity and Retrenchment"
great_depression_choose_austerity_and_retrenchment_desc: "Protect the treasury through balanced emergency budgets, obligation restructuring, and disciplined relief."
great_depression_choose_direct_state_planning: "Choose Direct State Planning"
great_depression_choose_direct_state_planning_desc: "Place production, inputs, and reconstruction under a coordinated national plan."
great_depression_choose_let_the_market_clear: "Choose Let the Market Clear"
great_depression_choose_let_the_market_clear_desc: "Withdraw exceptional support and allow failed assets to be reorganized under ordinary market pressure."
great_depression_cabinet_review: "Cabinet Review"
great_depression_cabinet_review_desc: "Reconsider the recovery doctrine before another policy commitment is made."
great_depression_emergency_policy_review: "Emergency Policy Review"
great_depression_emergency_policy_review_desc: "Review the cabinet's course under pressure, accepting short-term whiplash for a chance to reset direction."
great_depression_emergency_relief_allocation: "Emergency Relief Allocation"
great_depression_emergency_relief_allocation_desc: "Direct reserves, workers, and transport toward the households and regions most exposed to the contraction."
great_depression_request_foreign_support: "Request Foreign Support"
great_depression_request_foreign_support_desc: "Ask an established partner for aid that can protect recovery capacity while creating a diplomatic obligation."
great_depression_select_depression_center: "Select Depression Center"
great_depression_select_depression_center_desc: "Choose an industrial center for the next state intervention."
great_depression_protect_depression_center: "Protect Depression Center"
great_depression_protect_depression_center_desc: "Shield the selected center with guards, freight, and emergency support so its productive core remains available."
great_depression_reopen_idled_plants: "Reopen Idled Plants"
great_depression_reopen_idled_plants_desc: "Return an idled center to service before temporary stoppage becomes permanent loss."
great_depression_rebuild_shuttered_center: "Rebuild Shuttered Center"
great_depression_rebuild_shuttered_center_desc: "Rebuild a shuttered center and restore its industrial capacity through a long reconstruction effort."
great_depression_restructure_or_consolidate_center: "Restructure or Consolidate Center"
great_depression_restructure_or_consolidate_center_desc: "Reorganize a failing center so its remaining capacity supports the wider recovery."
great_depression_abandon_depression_center: "Abandon Depression Center"
great_depression_abandon_depression_center_desc: "Liquidate a selected center deliberately, accepting a permanent industrial scar to protect the rest of the economy."
great_depression_launch_regional_works_program: "Launch Regional Works Program"
great_depression_launch_regional_works_program_desc: "Fund a regional works program that relieves unemployment and lowers the pressure on the national crisis."
great_depression_start_national_employment_guarantee: "Start National Employment Guarantee"
great_depression_start_national_employment_guarantee_desc: "Guarantee work through a national program, trading reserves and capacity for a stronger recovery floor."
great_depression_convert_works_into_lasting_capacity: "Convert Works into Lasting Capacity"
great_depression_convert_works_into_lasting_capacity_desc: "Turn emergency works into durable transport, construction, and industrial capacity."
great_depression_designate_strategic_plant_network: "Designate Strategic Plant Network"
great_depression_designate_strategic_plant_network_desc: "Mark essential plants as a connected network so orders and scarce inputs reach them first."
great_depression_guarantee_essential_orders: "Guarantee Essential Orders"
great_depression_guarantee_essential_orders_desc: "Guarantee demand for essential output and keep strategic production from falling into a destructive spiral."
great_depression_consolidate_failing_industry: "Consolidate Failing Industry"
great_depression_consolidate_failing_industry_desc: "Merge or trustee weak firms so surviving production can operate with fewer duplicative losses."
great_depression_end_rescue_dependence: "End Rescue Dependence"
great_depression_end_rescue_dependence_desc: "Withdraw the emergency orders that keep the protected plants running. They return to ordinary contracts, which eases the budget but takes the guarantee away from the protected regions."
great_depression_retain_bounded_arsenal_institution: "Retain a Bounded Arsenal Institution"
great_depression_retain_bounded_arsenal_institution_desc: "Keep the designated plant network as a standing arsenal with guaranteed orders. The rest of the economy returns to ordinary rules, while the arsenal carries a lasting cost."
great_depression_restore_local_credit_and_trade_connection: "Restore Local Credit and Trade Connection"
great_depression_restore_local_credit_and_trade_connection_desc: "Reopen the audited lenders, merchant credit and trade links of the selected center so its plants can buy inputs and sell their output again."
great_depression_end_rescue_dependence_tt: "Essential orders end, and the budget carries less lasting pressure. This completes the Rescue Strategic Industry recovery measure that §YPrevent a Relapse§! requires."
great_depression_retain_bounded_arsenal_institution_tt: "Essential orders continue as a standing institution. The arsenal adds lasting budget pressure but eases supply strain while at war. This completes the Rescue Strategic Industry recovery measure that §YPrevent a Relapse§! requires."
great_depression_keep_essential_freight_moving_center_tt: "If the selected Depression Center is Distressed, Idled or Shuttered and no center project is running, §YTransport Integration§! work begins there. If a project is already running there, it moves several weeks closer to completion, once per project."
great_depression_coordinated_reconstruction_center_tt: "If the selected Depression Center is Distressed, Idled, Shuttered or Abandoned and no center project is running, §YInternational Reconstruction§! work begins there."
great_depression_severity_change_tt: "Depression Severity: [?great_depression_action_delta|=-0]"
great_depression_abandon_distressed_market_tt: "We stop carrying the debts and unpaid orders of [FROM.GetNameDef]. For the next §Y[?great_depression_tt_relief_days|0]§! days of this depression, each Severity update is up to §G[?great_depression_tt_relief|0]§! lower, and our crisis no longer spreads to [FROM.GetNameDef] through this link.\n[FROM.GetNameDef] takes the loss. If it is in its own depression, its Depression Severity rises by §R[?great_depression_tt_partner_shock|0]§!. If it is exposed and has not contained the pressure, its exposure deepens by one stage. An economy that was untouched becomes dependent on our failing market. It will remember who walked away."
great_depression_withdraw_from_distressed_market_tt: "We wind down trade with [FROM.GetNameDef] without breaking contracts. For the next §Y[?great_depression_tt_relief_days|0]§! days of this depression, each Severity update is up to §G[?great_depression_tt_relief|0]§! lower.\nIf [FROM.GetNameDef] is in its own depression, its Depression Severity rises by §R[?great_depression_tt_partner_shock|0]§!. An untouched partner faces pressure from the lost trade. A quiet exit leaves no lasting resentment."
great_depression_exploit_supply_gap_tt: "Our plants buy up the inputs [FROM.GetNameDef] can no longer deliver. For the next §Y[?great_depression_tt_relief_days|0]§! days of this depression, each Severity update is up to §G[?great_depression_tt_relief|0]§! lower. While Social Collapse is active, workers call it profiteering and the backlash takes back §R[?great_depression_tt_backlash|0]§! of that relief.\nThe Depression Severity of [FROM.GetNameDef] rises by §R[?great_depression_tt_partner_shock|0]§!, and it will resent us for it."
great_depression_competitive_devaluation_or_currency_break_tt: "Our exports become cheaper abroad and the budget gains room. For the next §Y[?great_depression_tt_relief_days|0]§! days of this depression, each Severity update is up to §G[?great_depression_tt_relief|0]§! lower.\nUp to §Y[?great_depression_tt_partner_cap|0]§! trading partners lose sales to us for §Y[?great_depression_tt_partner_days|0]§! days, which pushes them deeper into the worldwide contraction.\nThe worldwide recovery must hold §R[?great_depression_tt_drag_days|0]§! days longer before international reconstruction can begin, up to §R[?great_depression_tt_drag_maximum|0]§! days for all such measures together.\nThis can be done once in each worldwide depression."
great_depression_withdraw_from_international_commitments_tt: "We leave the worldwide recovery effort for the rest of this worldwide depression. Our aid and reconstruction commitments leave the common effort. We cannot pledge further support until it ends.\nThe capacity we had committed abroad comes home, and for the next §Y[?great_depression_tt_relief_days|0]§! days of this depression each Severity update is up to §G[?great_depression_tt_relief|0]§! lower as the budget sheds its foreign obligations."
great_depression_global_recovery_conference_tt: "We call the economies of the world to a recovery conference that sits for §Y[?great_depression_tt_conference_days|0]§! days. Countries in their own depression or exposed to one, Industrial Boom suppliers, and countries that contributed to the worldwide recovery can take a seat by paying their share.\nIt succeeds if at least §Y[?great_depression_tt_conference_participants|0]§! countries take part, §Y[?great_depression_tt_conference_majors|0]§! of them major powers, with a combined industrial weight of at least §Y[?great_depression_tt_conference_weight|0]§! (civilian factories count double). Success brings the end of the worldwide depression §G[?great_depression_tt_conference_advance|0]§! days closer, lowers the Depression Severity of every participant in a depression by §G[?great_depression_tt_conference_relief|0]§!, and gives the other participants a trade dividend for §Y[?great_depression_tt_conference_dividend_days|0]§! days.\nIf it fails during Fragmented Recovery, the world falls back into the Worldwide Depression stage and its recovery must prove itself again; during International Reconstruction, the end of the crisis is put off."
great_depression_join_global_recovery_conference_tt: "We take a seat at the recovery conference called by [?global.great_depression_conference_convener.GetNameDef], where §Y[?global.great_depression_conference_participants^num|0]§! countries sit so far. It needs at least §Y[?great_depression_tt_conference_participants|0]§! countries, §Y[?great_depression_tt_conference_majors|0]§! of them major powers, and a combined industrial weight of §Y[?great_depression_tt_conference_weight|0]§! when it closes.\nIf it succeeds while we are in a depression, our Depression Severity falls by §G[?great_depression_tt_conference_relief|0]§!; otherwise we gain a trade dividend for §Y[?great_depression_tt_conference_dividend_days|0]§! days."
great_depression_protectionist_bloc_can_take_member_tt: "We or the partner are not yet in the protectionist bloc, and it has room for every new member"
great_depression_clearing_bloc_can_take_pair_tt: "We and the partner are both clearing bloc members, or the clearing bloc has room for every new member"
great_depression_clearing_bloc_membership: "Clearing Bloc"
great_depression_clearing_bloc_membership_desc: "Our trade with the other members of the clearing bloc is settled through a common account, so payments keep moving while credit is scarce."
great_depression_protectionist_bloc_membership: "Protectionist Bloc"
great_depression_protectionist_bloc_membership_desc: "Tariffs and quotas shared with the other members of the protectionist bloc keep falling world prices out of our market. Our own plants keep their customers, while outside traders turn elsewhere."
chaosx.nr35.20.t: "A Clearing Bloc Forms"
chaosx.nr35.20.d: "Following an agreement reached by [?global.great_depression_clearing_bloc_news_country.GetNameDef], [?global.great_depression_clearing_bloc_news_member_count|0] governments now settle their trade through a common clearing account. Exporters are paid in credits against their own purchases rather than in scarce gold, and goods are moving again between the members. Outside the bloc, traders wonder whether they will be left with the debts of a shrinking world market."
chaosx.nr35.20.a: "Trade without gold, then."
chaosx.nr35.21.t: "A Protectionist Bloc Forms"
chaosx.nr35.21.d: "Led by [?global.great_depression_protectionist_bloc_news_country.GetNameDef], [?global.great_depression_protectionist_bloc_news_member_count|0] governments have raised a common wall of tariffs and quotas against the rest of the world. Their factories keep the home market, and their farmers are spared the collapse in world prices. Exporters outside the bloc have lost customers overnight, and the economists who hoped for a coordinated recovery now expect a longer one."
chaosx.nr35.21.a: "Every market behind its own wall."
great_depression_doctrine_choice_tt: "While this doctrine holds, each Severity update starts from [?great_depression_tt_doctrine_drift|=-0] instead of [?ROOT.great_depression_tt_base_drift|=-0], or [?ROOT.great_depression_tt_panic_drift|=-0] during Panic and Contraction. A chosen doctrine opens our national response decisions, and the doctrine in force when the depression ends shapes the legacy it leaves."
great_depression_choose_emergency_public_works_tt: "Under this doctrine the §YNational Employment Guarantee§! mission can begin."
great_depression_cabinet_review_tt: "The current doctrine is set aside so that a new one can be chosen, and Severity updates return to their ordinary drift until then. Every change of doctrine is remembered: §Y[?ROOT.great_depression_tt_fatigue_switches|0]§! or more in one depression can leave the lasting §YPolicy Fatigue§! scar after the recovery."
great_depression_emergency_policy_review_tt: "The current doctrine is set aside at once. For §Y[?ROOT.great_depression_tt_whiplash_days|0]§! days the policy whiplash unsettles credit and the budget, and each Severity update is up to §R[?ROOT.great_depression_tt_whiplash_pressure|0]§! higher."
great_depression_emergency_relief_allocation_tt: "Relief reaches the hardest-hit households and regions, which meets the relief requirement of §YHalt the Panic§! and §YMaximum-Severity Emergency§!. The earmarked reserves steady the budget: each Severity update is up to §G[?ROOT.great_depression_tt_reserves_relief|0]§! lower for the rest of this depression."
great_depression_request_foreign_support_tt: "[FROM.GetNameDef] sends aid, freight and supply contracts. Restored freight makes each Severity update up to §G[?ROOT.great_depression_tt_freight_relief|0]§! lower for the rest of this depression and meets the freight requirement of §YHalt the Panic§! and §YKeep Essential Freight Moving§!. The aid also meets the foreign support requirement of §YMaximum-Severity Emergency§!.\nThe help leaves a claim on us, and the recovery can leave the lasting §YForeign Credit Dependence§! scar. No country can ask [FROM.GetNameDef] for support again for §Y[?ROOT.great_depression_tt_foreign_support_cooldown|0]§! days."
great_depression_select_depression_center_tt: "[FROM.GetName] becomes our selected Depression Center, the place our center decisions act on."
great_depression_protect_depression_center_tt: "Guards, freight and emergency support hold [FROM.GetName] for §Y[?ROOT.great_depression_tt_protection_days|0]§! days. While one of our centers is protected, each Severity update is §G[?ROOT.great_depression_tt_protected_relief|0]§! lower, and the protection meets the center requirement of §YHalt the Panic§!, §YKeep Essential Freight Moving§! and §YMaximum-Severity Emergency§!."
great_depression_reopen_idled_plants_tt: "Reopening work begins at [FROM.GetName]. After §Y[?ROOT.great_depression_tt_project_days|0]§! days of work the center returns to service, eases demand and industry, and counts toward the recovery. If none of its Civilian Factories remain, one is rebuilt. If the work fails, Depression Severity rises by §R[?ROOT.great_depression_tt_project_failure|0]§!."
great_depression_rebuild_shuttered_center_tt: "Reconstruction begins at [FROM.GetName]. After §Y[?ROOT.great_depression_tt_project_days|0]§! days of work the center returns to service, eases demand and industry, and counts toward the recovery. If none of its Civilian Factories remain, one is rebuilt. If the work fails, Depression Severity rises by §R[?ROOT.great_depression_tt_project_failure|0]§!."
great_depression_restructure_or_consolidate_center_tt: "Restructuring begins at [FROM.GetName]. After §Y[?ROOT.great_depression_tt_project_days|0]§! days of work the center reopens under new arrangements with lasting protection and counts as a resolved center for the recovery. If the work fails, Depression Severity rises by §R[?ROOT.great_depression_tt_project_failure|0]§!."
great_depression_consolidate_failing_industry_tt: "The weak firms of [FROM.GetName] are merged under trustees. After §Y[?ROOT.great_depression_tt_project_days|0]§! days of work the center reopens with lasting protection and counts as a resolved center for the recovery. If the work fails, Depression Severity rises by §R[?ROOT.great_depression_tt_project_failure|0]§!."
great_depression_nationalize_failing_industry_tt: "[FROM.GetName] passes into state trusteeship. After §Y[?ROOT.great_depression_tt_project_days|0]§! days of work it reopens as an essential public plant with lasting protection and counts as a resolved center for the recovery. If the work fails, Depression Severity rises by §R[?ROOT.great_depression_tt_project_failure|0]§!."
great_depression_restore_local_credit_and_trade_connection_tt: "The lenders and merchants of [FROM.GetName] reopen their books. After §Y[?ROOT.great_depression_tt_project_days|0]§! days of work the center reopens with lasting protection and counts as a resolved center for the recovery. If the work fails, Depression Severity rises by §R[?ROOT.great_depression_tt_project_failure|0]§!."
great_depression_designate_strategic_plant_network_tt: "[FROM.GetName] joins a strategic plant network that receives orders and scarce inputs first. For the rest of this depression each Severity update is up to §G[?ROOT.great_depression_tt_industrial_relief|0]§! lower. After §Y[?ROOT.great_depression_tt_project_days|0]§! days of work the center reopens as a protected strategic plant and counts as a resolved center. If the work fails, Depression Severity rises by §R[?ROOT.great_depression_tt_project_failure|0]§!.\nOnce the economy stabilizes, the network lets us end the rescue or keep it as a standing arsenal."
great_depression_launch_regional_works_program_tt: "Public works begin at [FROM.GetName]. While they run, each Severity update is up to §G[?ROOT.great_depression_tt_demand_relief|0]§! lower. After §Y[?ROOT.great_depression_tt_project_days|0]§! days of work the center keeps a works program that holds up local demand for the rest of this depression. If the work fails, Depression Severity rises by §R[?ROOT.great_depression_tt_project_failure|0]§!."
great_depression_convert_works_into_lasting_capacity_tt: "Work begins at [FROM.GetName] to turn its emergency works into lasting capacity. After §Y[?ROOT.great_depression_tt_project_days|0]§! days the capacity counts as a recovery measure for §YPrevent a Relapse§!. If the work fails, Depression Severity rises by §R[?ROOT.great_depression_tt_project_failure|0]§!."
great_depression_abandon_depression_center_tt: "[FROM.GetName] is written off as an Abandoned, Hollowed center. Instead of the full weight of a failed center, it leaves a residual drag: each Severity update is up to §R[?ROOT.great_depression_tt_liquidated_drag|0]§! higher while it stays closed. In a deep depression §Y[?ROOT.great_depression_tt_liquidation_levels|0]§! Civilian Factory there is torn down, and the recovery then carries the §YHollow Recovery Scar§!."
great_depression_auction_or_reorganize_failed_assets_tt: "The failed works of [FROM.GetName] are auctioned off or wound up, and the center is written off as Abandoned and Hollowed. Instead of the full weight of a failed center, it leaves a residual drag: each Severity update is up to §R[?ROOT.great_depression_tt_liquidated_drag|0]§! higher while it stays closed. In a deep depression §Y[?ROOT.great_depression_tt_liquidation_levels|0]§! Civilian Factory there is torn down, and the recovery then carries the §YHollow Recovery Scar§!."
great_depression_sell_distressed_assets_tt: "Distressed holdings in [FROM.GetName] are sold to raise cash."
great_depression_start_national_employment_guarantee_tt: "Every worker who needs a job is offered one. While the guarantee runs, each Severity update is up to §G[?ROOT.great_depression_tt_demand_relief|0]§! lower. Under Emergency Public Works, the §YNational Employment Guarantee§! mission measures whether it holds."
great_depression_guarantee_essential_orders_tt: "Essential output has guaranteed buyers and the freight to reach them. For the rest of this depression each Severity update is up to §G[?ROOT.great_depression_tt_freight_relief|0]§! lower. The guarantee meets the main requirement of §YRestore Essential Production§! and the freight requirement of §YHalt the Panic§! and §YKeep Essential Freight Moving§!."
great_depression_declare_temporary_bank_holiday_and_audit_tt: "Withdrawals stop while the banks are audited. Once the audit stands, credit steadies and each Severity update is up to §G[?ROOT.great_depression_tt_credit_relief|0]§! lower for the rest of this depression. The audit meets a requirement of §YHalt the Panic§! and lets us restore local credit in a Depression Center."
great_depression_recapitalize_viable_institutions_tt: "Viable banks receive new public capital. Credit steadies and each Severity update is up to §G[?ROOT.great_depression_tt_credit_relief|0]§! lower for the rest of this depression. A bank audit or a credit guarantee gives the same relief, and they do not add up."
great_depression_establish_durable_credit_guarantee_tt: "Viable credit is guaranteed beyond the panic. Credit steadies and each Severity update is up to §G[?ROOT.great_depression_tt_credit_relief|0]§! lower for the rest of this depression; a bank audit or recapitalization gives the same relief, and they do not add up. The guarantee counts as a recovery measure for §YPrevent a Relapse§!."
great_depression_negotiate_clearing_and_import_agreements_tt: "Clearing terms with [FROM.GetNameDef] keep essential imports and freight moving. For the rest of this depression each Severity update is up to §G[?ROOT.great_depression_tt_clearing_freight_relief|0]§! lower. The agreement meets the freight requirement of §YHalt the Panic§! and §YKeep Essential Freight Moving§! and counts as a containment action against Financial Contagion."
great_depression_balance_emergency_budget_tt: "The budget steadies, and each Severity update is up to §G[?ROOT.great_depression_tt_fiscal_relief|0]§! lower for the rest of this depression. Restructured obligations, ordinary budget rules or the end of rescue dependence give the same relief, and they do not add up."
great_depression_restructure_public_obligations_tt: "The budget steadies, and each Severity update is up to §G[?ROOT.great_depression_tt_fiscal_relief|0]§! lower for the rest of this depression; a balanced budget or ordinary budget rules give the same relief. Emergency credit taken in this depression no longer leaves the §YDebt Overhang§! scar."
great_depression_retrench_relief_administration_late_tt: "Temporary relief programs close. The Civilian Factories our depression measures hold are released until the next paid measure, and the leaner budget makes each Severity update up to §G[?ROOT.great_depression_tt_retrenchment_relief|0]§! lower for the rest of this depression. The economy is stable enough to absorb the cuts."
great_depression_retrench_relief_administration_early_tt: "Temporary relief programs close. The Civilian Factories our depression measures hold are released until the next paid measure, and the leaner budget makes each Severity update up to §G[?ROOT.great_depression_tt_retrenchment_relief|0]§! lower for the rest of this depression.\nBefore Stabilization the cuts throw households onto the street: the unrest makes each Severity update up to §R[?ROOT.great_depression_tt_retrenchment_social|0]§! higher for the rest of this depression."
great_depression_restore_ordinary_budget_rules_tt: "The treasury returns to ordinary rules. The budget steadies, and each Severity update is up to §G[?ROOT.great_depression_tt_fiscal_relief|0]§! lower for the rest of this depression; a balanced budget or restructured obligations give the same relief. The rules count as a recovery measure for §YPrevent a Relapse§!."
great_depression_establish_emergency_production_board_tt: "Production orders and bottlenecks pass through one national board. Unless emergency controls are removed before the recovery, it can leave the lasting §YEmergency Controls§! scar."
great_depression_ration_strategic_inputs_tt: "Fuel, freight and materials go to essential production first. For the rest of this depression each Severity update is up to §G[?ROOT.great_depression_tt_rationing_relief|0]§! lower from steadier industry and up to §R[?ROOT.great_depression_tt_rationing_pressure|0]§! higher from the trade it squeezes. Unless emergency controls are removed before the recovery, rationing can leave the lasting §YEmergency Controls§! scar."
great_depression_start_national_recovery_plan_tt: "Ministries, transport and industry work to one national plan. It counts as a recovery measure for §YPrevent a Relapse§!, is what §YComplete National Recovery Plan§! measures, and supports the mandate of an emergency government."
great_depression_withdraw_emergency_support_tt: "Subsidies and guarantees end. For the rest of this depression the lighter budget makes each Severity update up to §G[?ROOT.great_depression_tt_withdrawal_relief|0]§! lower, while weak firms close sooner and the lost demand makes each update up to §R[?ROOT.great_depression_tt_withdrawal_pressure|0]§! higher."
great_depression_remove_emergency_controls_tt: "Rationing boards and capital controls are dismantled, and an emergency government in power stands down. This counts as a recovery measure for §YPrevent a Relapse§!, and the controls of this depression leave no §YEmergency Controls§! scar."
great_depression_begin_cleared_economy_certification_tt: "The review of failed firms and closed plants begins. It counts as a recovery measure for §YPrevent a Relapse§! and is what §YCertify Cleared Economy§! measures."
great_depression_ring_fence_domestic_finance_tt: "Our banks are closed to the contagion, and every partner our crisis reaches that has not yet fallen into its own depression is shielded from it. This counts as a containment action against Financial Contagion."
great_depression_ring_fence_domestic_finance_exposed_tt: "Our banks are closed to the foreign crisis. Our exposure ends, and the capacity it held is released."
great_depression_restrict_capital_outflows_tt: "Capital controls keep money at home and count as a containment action against Financial Contagion. Unless emergency controls are removed before the recovery, they can leave the lasting §YEmergency Controls§! scar."
great_depression_restrict_capital_outflows_exposed_tt: "Capital controls keep money at home, and our exposure to the foreign crisis falls by one stage."
great_depression_prioritize_domestic_recovery_tt: "Domestic recovery comes before foreign commitments. This counts as a containment action against Financial Contagion."
great_depression_prioritize_domestic_recovery_exposed_tt: "Domestic recovery comes before foreign commitments. Our exposure to the foreign crisis ends, and the capacity it held is released."
great_depression_extend_emergency_credit_tt: "Our credit keeps [FROM.GetNameDef] paying its bills before its troubles reach our banks."
great_depression_shift_import_and_contract_dependence_tt: "Our imports and contracts move away from [FROM.GetNameDef] for §Y[?ROOT.great_depression_tt_import_shift_days|0]§! days. If it is in its own depression, each of its Severity updates is up to §R[?ROOT.great_depression_tt_import_shift_pressure|0]§! higher while that lasts."
great_depression_acquire_distressed_assets_tt: "We buy distressed assets from [FROM.GetNameDef], which ties their fate to our recovery."
great_depression_coordinate_international_rescue_tt: "A rescue package of aid, freight and guarantees goes to [FROM.GetNameDef]. It meets the objective of §YCoordinate International Rescue Mission§! and counts as a containment action against Financial Contagion."
great_depression_request_emergency_credit_tt: "[FROM.GetNameDef] lends us emergency credit, and the loan can still fail later in this depression. Unless we restructure our public obligations or hold an International Debt Conference, the recovery can leave the lasting §YDebt Overhang§! scar."
great_depression_offer_debt_standstill_tt: "[FROM.GetNameDef] may suspend its payments to us, so it keeps trading and its debts stay recoverable."
great_depression_establish_clearing_bloc_tt: "We and [FROM.GetNameDef] settle our trade through the clearing bloc for §Y[?ROOT.great_depression_tt_clearing_term|0]§! days; members who are already in it renew their term. While a member is in its own depression, each of its Severity updates is up to §G[?ROOT.great_depression_tt_clearing_relief|0]§! lower, and a member under the worldwide contraction feels it less. Members trade more readily with others while they belong.\nMembership ends when the term runs out or when a new depression begins in the member."
great_depression_accept_external_supervision_tt: "[FROM.GetNameDef] supervises our recovery finance, and the recovery can leave the lasting §YForeign Credit Dependence§! scar."
great_depression_offer_boom_supply_contract_tt: "If [FROM.GetNameDef] accepts, its plants supply us under contract and our Depression Severity falls by §G[?ROOT.great_depression_tt_strong_relief|0]§!. Secured freight makes each Severity update up to §G[?ROOT.great_depression_tt_freight_relief|0]§! lower for the rest of this depression and meets the freight requirement of §YHalt the Panic§! and §YKeep Essential Freight Moving§!. If it refuses, nothing is paid."
great_depression_support_contagion_source_tt: "Our aid reaches [FROM.GetNameDef], where the contagion began. Our exposure to its crisis ends, the capacity it held is released, and the aid counts toward containing its crisis."
great_depression_negotiate_with_strike_committees_tt: "The strikes end in a negotiated settlement. Social peace makes each Severity update up to §G[?ROOT.great_depression_tt_social_relief|0]§! lower for the rest of this depression, and the recovery can leave the §YSocial Compact§! settlement."
great_depression_national_employment_compact_tt: "Government, employers and unions sign a compact that ends the unrest and holds up demand: each Severity update is up to §G[?ROOT.great_depression_tt_demand_relief|0]§! lower for the rest of this depression. The recovery can leave the §YSocial Compact§! settlement."
great_depression_deploy_security_forces_tt: "Police and soldiers end the unrest. The workers will remember it: the recovery can leave the §YLabor Scar§! settlement or the §YLabor Bitterness§! scar."
great_depression_break_the_occupations_tt: "The occupation of [FROM.GetName] is broken and the unrest ends. The workers will remember it: the recovery can leave the §YLabor Scar§! settlement or the §YLabor Bitterness§! scar."
great_depression_recognize_workplace_or_regional_councils_tt: "Councils take a lawful share of relief and local industry, and the unrest ends. Social peace makes each Severity update up to §G[?ROOT.great_depression_tt_social_relief|0]§! lower for the rest of this depression, and the recovery can leave the §YRegional Autonomy§! settlement."
great_depression_form_an_emergency_government_tt: "An emergency government rules by decree for §Y[?ROOT.great_depression_tt_mandate_days|0]§! days. §YEmergency Government Mandate§! judges whether it settles the crisis, and a settled mandate can leave the §YEmergency Rule§! settlement after the recovery."
great_depression_nationalize_or_socialize_occupied_industry_tt: "The occupied plants of [FROM.GetName] pass into public hands under councils and state managers. The occupation ends, the center becomes an essential public plant that counts as resolved for the recovery, and the recovery can leave the §YPlanning Settlement§!."
great_depression_guarantee_property_and_credit_tt: "The state guarantees the property and credit of the great firms, and the unrest ends. The recovery can leave the §YCorporate Rescue Order§! settlement."
great_depression_regional_clearing_agreement_tt: "We and [FROM.GetNameDef] settle our trade through the clearing bloc for §Y[?ROOT.great_depression_tt_clearing_term|0]§! days; members who are already in it renew their term. While a member is in its own depression, each of its Severity updates is up to §G[?ROOT.great_depression_tt_clearing_relief|0]§! lower, and a member under the worldwide contraction feels it less. Members trade more readily with others while they belong.\nMembership ends when the term runs out or when a new depression begins in the member."
great_depression_coordinated_public_works_and_reconstruction_tt: "Our works programs join a common reconstruction effort with other countries."
great_depression_international_debt_conference_tt: "Creditors and debtors meet to reschedule what cannot be paid. Emergency credit taken in this depression no longer leaves the §YDebt Overhang§! scar."
great_depression_protectionist_bloc_tt: "We and [FROM.GetNameDef] join the protectionist bloc for the rest of this worldwide depression. A member in its own depression feels less of the worldwide contraction on each Severity update, and a member under the worldwide contraction falls into a lighter tier of it.\nOutside traders turn away from every member and protected goods cost more. Each member makes the worldwide recovery hold §R[?ROOT.great_depression_tt_protectionist_drag|0]§! days longer before international reconstruction can begin, up to §R[?ROOT.great_depression_tt_protectionist_drag_maximum|0]§! days for the whole bloc.\nMembership ends with the worldwide depression or when a new depression begins in the member."
great_depression_reconstruction_supplier_compact_tt: "[FROM.GetNameDef] joins our reconstruction supply compact. If it is in its own depression and we can supply it, its Depression Severity falls as shown."
great_depression_emergency_trade_clearing_tt: "Emergency clearing keeps payments between depressed economies moving."
great_depression_reconstruction_and_employment_fund_tt: "A common fund pays for reconstruction work. While we are in a depression, the jobs it creates make each Severity update up to §G[?ROOT.great_depression_tt_demand_relief|0]§! lower."
great_depression_protect_domestic_market_tt: "Tariffs and quotas protect our home market from the worldwide collapse in prices."
great_depression_coordinate_industrial_demand_tt: "Our orders are coordinated with other economies, so plants abroad and at home keep working."
great_depression_global_contribution_tt: "Counts as our contribution to the worldwide recovery."
great_depression_partner_link_opened_tt: "The agreement ties [FROM.GetNameDef] to our crisis, which can now reach it through Financial Contagion."
great_depression_mission_success_tt: "This counts as a successful response: the more of them in this depression, the more slowly a rising Severity climbs. This mission does not return in this depression."
great_depression_mission_failure_tt: "This mission does not return in this depression."
great_depression_mission_cancel_tt: "The mission is withdrawn without a penalty and can return while its conditions hold."
great_depression_keep_essential_freight_moving_complete_tt: "Freight runs again: each Severity update is up to §G[?ROOT.great_depression_tt_freight_relief|0]§! lower for the rest of this depression."
great_depression_prevent_a_relapse_complete_tt: "The relapse ends and no longer counts against the recovery."
great_depression_prevent_national_breakdown_complete_tt: "The threat of a national breakdown passes."
great_depression_contain_financial_contagion_complete_tt: "Our exposure to foreign contagion closes: Severity updates lose their extra §R[?ROOT.great_depression_tt_contagion_pressure|0]§! from it, and other crises stop passing their pressure to us."
great_depression_national_employment_guarantee_complete_tt: "The guarantee completes its term and ends, and its relief on Severity updates ends with it."
great_depression_restore_essential_production_complete_tt: "Essential production is restored. For the rest of this depression each Severity update is up to §G[?ROOT.great_depression_tt_industrial_relief|0]§! lower, and supply strain eases while we are at war."
great_depression_emergency_government_mandate_complete_tt: "The emergency government hands back power with the crisis settled. Social peace makes each Severity update up to §G[?ROOT.great_depression_tt_social_relief|0]§! lower for the rest of this depression, and the recovery can leave the §YEmergency Rule§! settlement."
great_depression_maximum_severity_emergency_timeout_tt: "If an unprotected Depression Center is failing, it shuts down. If Social Collapse is active, the failure feeds the unrest and each Severity update is up to §R[?ROOT.great_depression_tt_social_failure|0]§! higher for the rest of this depression; otherwise the country is warned of a coming national breakdown."
great_depression_social_response_failure_tt: "The failed response feeds the unrest: each Severity update is up to §R[?ROOT.great_depression_tt_social_failure|0]§! higher for the rest of this depression."
great_depression_national_employment_guarantee_timeout_tt: "If the guarantee is still running with Civilian Factory capacity to spare and fewer than §Y[?ROOT.great_depression_tt_guarantee_failure_limit|0]§! failed center projects, it ends as a partial success and Severity falls instead. Either way the guarantee ends."
great_depression_national_employment_guarantee_cancel_tt: "The employment guarantee ends."
great_depression_emergency_government_mandate_cancel_tt: "The emergency government gives up its decree powers."
great_depression_withdrawal_fund_ends_tt: "We stop paying into the §YReconstruction and Employment Fund§!, and the jobs it paid for end."
great_depression_withdrawal_conference_seat_tt: "Our delegation leaves the Global Recovery Conference, and our industrial weight no longer counts toward its success."
great_depression_withdrawal_reconstruction_mission_tt: "The §YInternational Reconstruction§! mission ends without a penalty."
great_depression_conference_economy_is_improving_tt: "Our economy is in Stabilization or Recovery, or its Depression Severity is falling"
great_depression_conference_not_yet_held_tt: "No Global Recovery Conference has met during this worldwide depression"
great_depression_conference_stage_is_ready_tt: "The worldwide depression has reached Fragmented Recovery or International Reconstruction"
great_depression_recovery_conference_is_open_tt: "A Global Recovery Conference is in session"
great_depression_recovery_conference_has_room_tt: "The Global Recovery Conference has a free seat"
great_depression_join_global_recovery_conference: "Join the Global Recovery Conference"
great_depression_join_global_recovery_conference_desc: "Send a delegation to the recovery conference and commit our share of credit, freight, and orders to a common settlement."
great_depression_recovery_conference_dividend: "Recovery Conference Dividend"
great_depression_recovery_conference_dividend_desc: "The settlement reached at the Global Recovery Conference has reopened credit lines and export orders abroad."
great_depression_global_commitments_are_open_tt: "Has not withdrawn from international commitments during this worldwide depression"
great_depression_devaluation_is_unused_tt: "Has not devalued during this worldwide depression"
great_depression_market_abandoned: "Abandoned our market in the depression"
great_depression_supply_gap_exploited: "Profited from our broken supply in the depression"
great_depression_finance_restoration_needs_audit_tt: "The bank audit has been completed"
great_depression_strategic_closer_phase_is_open_tt: "The economy has reached Stabilization or Recovery"
great_depression_strategic_rescue_is_running_tt: "A strategic plant network or essential orders are in place"
great_depression_strategic_center_is_completed_tt: "A strategic plant network is designated, and one of its centers has completed its rescue"
great_depression_declare_temporary_bank_holiday_and_audit: "Declare Temporary Bank Holiday and Audit"
great_depression_declare_temporary_bank_holiday_and_audit_desc: "Pause withdrawals long enough to audit institutions and separate viable credit from panic."
great_depression_recapitalize_viable_institutions: "Recapitalize Viable Institutions"
great_depression_recapitalize_viable_institutions_desc: "Use public credit to restore institutions that can still carry payments and productive lending."
great_depression_negotiate_clearing_and_import_agreements: "Negotiate Clearing and Import Agreements"
great_depression_negotiate_clearing_and_import_agreements_desc: "Secure clearing terms and imports that keep essential trade moving while markets are impaired."
great_depression_establish_durable_credit_guarantee: "Establish Durable Credit Guarantee"
great_depression_establish_durable_credit_guarantee_desc: "Guarantee viable credit beyond the immediate panic so recovery investment can resume."
great_depression_balance_emergency_budget: "Balance Emergency Budget"
great_depression_balance_emergency_budget_desc: "Bring emergency spending and revenue into a credible balance before confidence breaks further."
great_depression_restructure_public_obligations: "Restructure Public Obligations"
great_depression_restructure_public_obligations_desc: "Reschedule public obligations to preserve the state's ability to fund recovery."
great_depression_retrench_relief_administration: "Retrench Relief Administration"
great_depression_retrench_relief_administration_desc: "Narrow relief to the most urgent cases, reducing fiscal pressure while exposing more households to hardship."
great_depression_restore_ordinary_budget_rules: "Restore Ordinary Budget Rules"
great_depression_restore_ordinary_budget_rules_desc: "Return the treasury to ordinary rules and prove that emergency finance can stand down."
great_depression_establish_emergency_production_board: "Establish Emergency Production Board"
great_depression_establish_emergency_production_board_desc: "Coordinate national production, orders, and bottlenecks through a single emergency board."
great_depression_nationalize_failing_industry: "Nationalize Failing Industry"
great_depression_nationalize_failing_industry_desc: "Take failing strategic firms into trusteeship so their assets remain available to the national plan."
great_depression_ration_strategic_inputs: "Ration Strategic Inputs"
great_depression_ration_strategic_inputs_desc: "Concentrate scarce inputs on essential production and accept pressure in less critical sectors."
great_depression_start_national_recovery_plan: "Start National Recovery Plan"
great_depression_start_national_recovery_plan_desc: "Commit ministries, transport, and industry to a complete national recovery plan."
great_depression_withdraw_emergency_support: "Withdraw Emergency Support"
great_depression_withdraw_emergency_support_desc: "End exceptional support and make the remaining economy confront its weakest assets."
great_depression_auction_or_reorganize_failed_assets: "Auction or Reorganize Failed Assets"
great_depression_auction_or_reorganize_failed_assets_desc: "Clear failed assets through auction or reorganization, accepting short-term disruption for a cleaner recovery."
great_depression_remove_emergency_controls: "Remove Emergency Controls"
great_depression_remove_emergency_controls_desc: "Lift controls that have outlived their purpose and test whether ordinary exchange can resume."
great_depression_begin_cleared_economy_certification: "Begin Cleared Economy Certification"
great_depression_begin_cleared_economy_certification_desc: "Begin the evidence review needed to certify that the economy can leave emergency management."
great_depression_ring_fence_domestic_finance: "Ring Fence Domestic Finance"
great_depression_ring_fence_domestic_finance_desc: "Protect domestic finance from an established foreign exposure while preserving a route for essential trade."
great_depression_extend_emergency_credit: "Extend Emergency Credit"
great_depression_extend_emergency_credit_desc: "Extend emergency credit to a partner or institution before a local liquidity problem becomes contagion."
great_depression_shift_import_and_contract_dependence: "Shift Import and Contract Dependence"
great_depression_shift_import_and_contract_dependence_desc: "Redirect imports and contracts away from an exposed partner and pay the transition cost."
great_depression_abandon_distressed_market: "Abandon Distressed Market"
great_depression_abandon_distressed_market_desc: "Cut our ties to a failing market at once to protect national reserves, leaving the partner to absorb the loss and remember it."
great_depression_acquire_distressed_assets: "Acquire Distressed Assets"
great_depression_acquire_distressed_assets_desc: "Acquire selected distressed assets from an established partner and bind their recovery to your own capacity."
great_depression_coordinate_international_rescue: "Coordinate International Rescue"
great_depression_coordinate_international_rescue_desc: "Coordinate a partner rescue package that combines aid, freight, and financial guarantees."
great_depression_request_emergency_credit: "Request Emergency Credit"
great_depression_request_emergency_credit_desc: "Request emergency credit from an established partner and accept the political conditions attached to it."
great_depression_offer_debt_standstill: "Offer Debt Standstill"
great_depression_offer_debt_standstill_desc: "Offer a partner a temporary debt standstill to keep its economy trading and its obligations recoverable."
great_depression_sell_distressed_assets: "Sell Distressed Assets"
great_depression_sell_distressed_assets_desc: "Sell distressed assets to raise liquidity, reducing domestic exposure at the price of future influence."
great_depression_establish_clearing_bloc: "Establish Clearing Bloc"
great_depression_establish_clearing_bloc_desc: "Build a clearing bloc that replaces broken settlement routes with a smaller, more reliable network."
great_depression_accept_external_supervision: "Accept External Supervision"
great_depression_accept_external_supervision_desc: "Accept outside supervision over recovery finance in exchange for credible access to support."
great_depression_restrict_capital_outflows: "Restrict Capital Outflows"
great_depression_restrict_capital_outflows_desc: "Restrict capital flight long enough to keep domestic banks and productive credit intact."
great_depression_prioritize_domestic_recovery: "Prioritize Domestic Recovery"
great_depression_prioritize_domestic_recovery_desc: "Put domestic recovery ahead of external commitments and accept the resulting strain on partners."
great_depression_offer_boom_supply_contract: "Offer Boom Supply Contract"
great_depression_offer_boom_supply_contract_desc: "Use a surviving Industrial Boom supplier relationship to keep essential deliveries moving under pressure."
great_depression_support_contagion_source: "Support Contagion Source"
great_depression_support_contagion_source_desc: "Send targeted aid to the identified source of financial contagion before the exposure becomes irreversible."
great_depression_withdraw_from_distressed_market: "Withdraw from Distressed Market"
great_depression_withdraw_from_distressed_market_desc: "Withdraw from a distressed partner market before its losses can become a domestic obligation."
great_depression_exploit_supply_gap: "Exploit Supply Gap"
great_depression_exploit_supply_gap_desc: "Buy the industrial inputs a depressed partner can no longer use or deliver, deepening its crisis and risking anger at home and abroad."
great_depression_negotiate_with_strike_committees: "Negotiate with Strike Committees"
great_depression_negotiate_with_strike_committees_desc: "Negotiate a settlement with organized strike committees before the incident becomes a general strike."
great_depression_national_employment_compact: "National Employment Compact"
great_depression_national_employment_compact_desc: "Bind government, employers, and labor to a national employment compact that lowers social pressure."
great_depression_deploy_security_forces: "Deploy Security Forces"
great_depression_deploy_security_forces_desc: "Protect essential services without allowing unrest to escalate into armed conflict."
great_depression_break_the_occupations: "Break the Occupations"
great_depression_break_the_occupations_desc: "Restore access to occupied workplaces and centers without turning every grievance into a wider conflict."
great_depression_recognize_workplace_or_regional_councils: "Recognize Workplace or Regional Councils"
great_depression_recognize_workplace_or_regional_councils_desc: "Give organized local actors a lawful channel into recovery administration and reduce the pressure to escalate."
great_depression_form_an_emergency_government: "Form an Emergency Government"
great_depression_form_an_emergency_government_desc: "Form a guarded emergency government with a concrete mandate to keep essential administration operating."
great_depression_nationalize_or_socialize_occupied_industry: "Nationalize or Socialize Occupied Industry"
great_depression_nationalize_or_socialize_occupied_industry_desc: "Place occupied industry under a recognized public structure so production and labor can resume."
great_depression_guarantee_property_and_credit: "Guarantee Property and Credit"
great_depression_guarantee_property_and_credit_desc: "Guarantee property and credit rights to separate social stabilization from a panic-driven seizure cycle."
great_depression_regional_clearing_agreement: "Regional Clearing Agreement"
great_depression_regional_clearing_agreement_desc: "Create a regional clearing agreement that protects trade while the global contraction remains active."
great_depression_coordinated_public_works_and_reconstruction: "Coordinated Public Works and Reconstruction"
great_depression_coordinated_public_works_and_reconstruction_desc: "Coordinate public works across borders so recovery capacity compounds instead of competing for the same inputs."
great_depression_international_debt_conference: "International Debt Conference"
great_depression_international_debt_conference_desc: "Convene creditors and debtors to replace unilateral default risk with a shared recovery schedule."
great_depression_protectionist_bloc: "Protectionist Bloc"
great_depression_protectionist_bloc_desc: "Build a protectionist bloc around domestic demand and accept weaker world trade in return for a clearer home market."
great_depression_competitive_devaluation_or_currency_break: "Competitive Devaluation or Currency Break"
great_depression_competitive_devaluation_or_currency_break_desc: "Cut the value of the national currency to win back export orders and ease the budget, knowing that trading partners will lose those orders and the worldwide recovery will take longer."
great_depression_reconstruction_supplier_compact: "Reconstruction Supplier Compact"
great_depression_reconstruction_supplier_compact_desc: "Guarantee a supplier compact for reconstruction goods and make the global recovery depend on reliable delivery."
great_depression_global_recovery_conference: "Global Recovery Conference"
great_depression_global_recovery_conference_desc: "Call the major economies to a conference that can turn separate recoveries into a common settlement, or show how little they still agree on."
great_depression_emergency_trade_clearing: "Emergency Trade Clearing"
great_depression_emergency_trade_clearing_desc: "Keep emergency trade clearing open so the global contraction does not become a total supply freeze."
great_depression_reconstruction_and_employment_fund: "Reconstruction and Employment Fund"
great_depression_reconstruction_and_employment_fund_desc: "Pool funds for reconstruction and employment, lowering pressure across participating economies."
great_depression_protect_domestic_market: "Protect Domestic Market"
great_depression_protect_domestic_market_desc: "Protect domestic demand from the global shock while preserving enough trade to avoid supplier failure."
great_depression_coordinate_industrial_demand: "Coordinate Industrial Demand"
great_depression_coordinate_industrial_demand_desc: "Coordinate industrial demand across participating countries so factories reopen in a usable sequence."
great_depression_withdraw_from_international_commitments: "Withdraw from International Commitments"
great_depression_withdraw_from_international_commitments_desc: "Withdraw from costly international commitments and accept a smaller role in global recovery."
great_depression_halt_the_panic: "Halt the Panic"
great_depression_halt_the_panic_desc: "Hold the financial panic below the next escalation threshold while preserving a functioning payment system."
great_depression_keep_essential_freight_moving: "Keep Essential Freight Moving"
great_depression_keep_essential_freight_moving_desc: "Keep essential freight, fuel, and rail movement available through the opening contraction."
great_depression_reopen_depression_center: "Reopen Depression Center"
great_depression_reopen_depression_center_desc: "Reopen the selected depression center before idling becomes sustained industrial loss."
great_depression_prevent_a_relapse: "Prevent a Relapse"
great_depression_prevent_a_relapse_desc: "Complete recovery with a guarded reserve and no return to the relapse threshold."
great_depression_maximum_severity_emergency: "Maximum-Severity Emergency"
great_depression_maximum_severity_emergency_desc: "Answer economic paralysis with a final emergency response before the crisis closes every remaining option."
great_depression_prevent_national_breakdown: "Prevent National Breakdown"
great_depression_prevent_national_breakdown_desc: "Keep a baseline crisis below national breakdown while the warning window remains open."
great_depression_contain_financial_contagion: "Contain Financial Contagion"
great_depression_contain_financial_contagion_desc: "Contain an external exposure before the partner relationship converts into a second depression."
great_depression_prevent_general_strike: "Prevent General Strike"
great_depression_prevent_general_strike_desc: "Settle organized unrest before it becomes a general strike."
great_depression_international_reconstruction: "International Reconstruction"
great_depression_international_reconstruction_desc: "Contribute enough reconstruction capacity to restore trade and bring the worldwide contraction to an end."
great_depression_national_employment_guarantee: "National Employment Guarantee"
great_depression_national_employment_guarantee_desc: "Sustain a national employment guarantee long enough to lower pressure through the opening phase."
great_depression_complete_national_recovery_plan: "Complete National Recovery Plan"
great_depression_complete_national_recovery_plan_desc: "Complete the recovery plan and keep its core commitments intact through stabilization."
great_depression_certify_cleared_economy: "Certify Cleared Economy"
great_depression_certify_cleared_economy_desc: "Certify that ordinary budget, credit, and industrial rules can resume without immediate relapse."
great_depression_coordinate_international_rescue_mission: "Coordinate International Rescue Mission"
great_depression_coordinate_international_rescue_mission_desc: "Coordinate international rescue across a partner network and keep the contagion line closed."
great_depression_restore_essential_production: "Restore Essential Production"
great_depression_restore_essential_production_desc: "Restore essential production and freight before social pressure becomes a general strike."
great_depression_emergency_government_mandate: "Emergency Government Mandate"
great_depression_emergency_government_mandate_desc: "Give the emergency government a recovery mandate and prevent national breakdown."

great_depression_achievement_eligible_tooltip: "Available to a player country that enters Great Depression 2.0 and completes a recovery."
035_great_depression_back_to_work_NAME: "Back to Work"
035_great_depression_back_to_work_DESC: "Recover from a severe independent Great Depression while preserving every original Depression Center and losing no factories to the crisis."
035_great_depression_back_to_work_tooltip: "Complete a severe independent recovery with every original Depression Center preserved and no factories lost to the depression."
035_great_depression_every_center_reopened_NAME: "Every Center Reopened"
035_great_depression_every_center_reopened_DESC: "Reach Economic Paralysis, survive the maximum emergency, and recover every Depression Center without abandoning one."
035_great_depression_every_center_reopened_tooltip: "Reach Severity 100, answer the maximum emergency, and recover every Depression Center without liquidation."
035_great_depression_containment_line_NAME: "Containment Line"
035_great_depression_containment_line_DESC: "Contain Financial Contagion and recover without allowing the crisis to create a new depression abroad."
035_great_depression_containment_line_tooltip: "Contain an established foreign exposure, complete a contagion response, and prevent every exposed partner from falling into depression before recovery."
035_great_depression_social_peace_NAME: "The Social Peace"
035_great_depression_social_peace_DESC: "Recover from near-maximum Social Collapse after a major incident without a coup, civil conflict, emergency government, or emergency mandate."
035_great_depression_social_peace_tooltip: "Survive Social Collapse after Severity 90 or higher, settle a major incident, keep stability above 35%, and recover without a coup, civil conflict, emergency government, or emergency mandate."
035_great_depression_lean_but_standing_NAME: "Lean but Standing"
035_great_depression_lean_but_standing_DESC: "Liquidate part of the industrial base, keep the country viable, and recover without political collapse."
035_great_depression_lean_but_standing_tooltip: "Complete a liquidation-led recovery after losing factories to the depression while the country remains viable and independent."
035_great_depression_recovery_of_nations_NAME: "Recovery of Nations"
035_great_depression_recovery_of_nations_DESC: "Lead international reconstruction during The Second Great Depression and help bring the worldwide crisis to recovery."
035_great_depression_recovery_of_nations_tooltip: "Complete three validated aid or reconstruction contributions, improve a major recipient, keep stability above 35%, and help the world reach Recovery without a supplier collapse."

chaosx_super_event.105.t: "THE SECOND GREAT DEPRESSION"
chaosx_super_event.105.q: "\"The means of exchange are frozen in the currents of trade.\" - Franklin D. Roosevelt, First Inaugural Address, 1933"
chaosx_super_event.105.a: "A bad attack of economic pessimism."
chaosx_super_event.105.d: "The contraction has crossed every border that once contained it. Markets seize, suppliers fail, and governments must choose between protecting their own recovery and keeping the wider system alive. International reconstruction remains possible, but only if promises become deliveries and stronger economies carry part of their neighbors' burden."
