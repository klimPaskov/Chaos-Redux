chaosx.nr35.1.t: "Great Depression 2.0"

chaosx.nr35.2.t: "Great Depression 2.0"
chaosx.nr35.2.d: "[This.GetGreatDepressionOpeningDescription]"
chaosx.nr35.2.d.base: "Cancelled orders, closed plants, and frozen credit are working through [This.GetName]. Depression Severity stands at §Y[?great_depression_depression_severity|0]§! / 100 ([This.GetGreatDepressionSeverityBand], [This.GetGreatDepressionSeverityTrend]). The next threshold is [This.GetGreatDepressionNextThreshold]. We are in the [This.GetGreatDepressionPhase] phase. Causes: [This.GetGreatDepressionCauseOne], [This.GetGreatDepressionCauseTwo], [This.GetGreatDepressionCauseThree]. Relapse state: [This.GetGreatDepressionRelapseState]. Worldwide stage: [This.GetGreatDepressionGlobalStage]."
chaosx.nr35.2.d.inherited: "The expansion has broken into a hard landing in [This.GetName]. Reserves, projects, and industrial commitments are being unwound as the collapse settles across the economy. Depression Severity stands at §Y[?great_depression_depression_severity|0]§! / 100 ([This.GetGreatDepressionSeverityBand], [This.GetGreatDepressionSeverityTrend]). The next threshold is [This.GetGreatDepressionNextThreshold]. We are in the [This.GetGreatDepressionPhase] phase. Causes: [This.GetGreatDepressionCauseOne], [This.GetGreatDepressionCauseTwo], [This.GetGreatDepressionCauseThree]. Relapse state: [This.GetGreatDepressionRelapseState]. Worldwide stage: [This.GetGreatDepressionGlobalStage]."
chaosx.nr35.2.d.contagion: "A financial shock has crossed established credit and trade links into [This.GetName]. Foreign exposure is now becoming domestic contraction. Depression Severity stands at §Y[?great_depression_depression_severity|0]§! / 100 ([This.GetGreatDepressionSeverityBand], [This.GetGreatDepressionSeverityTrend]). The next threshold is [This.GetGreatDepressionNextThreshold]. We are in the [This.GetGreatDepressionPhase] phase. Causes: [This.GetGreatDepressionCauseOne], [This.GetGreatDepressionCauseTwo], [This.GetGreatDepressionCauseThree]. Relapse state: [This.GetGreatDepressionRelapseState]. Worldwide stage: [This.GetGreatDepressionGlobalStage]."
chaosx.nr35.2.d.social: "Strikes, councils, and emergency committees are turning economic hardship into a political crisis in [This.GetName]. The government's room to negotiate is narrowing as workplaces and relief offices choose whom to obey. Depression Severity stands at §Y[?great_depression_depression_severity|0]§! / 100 ([This.GetGreatDepressionSeverityBand], [This.GetGreatDepressionSeverityTrend]). The next threshold is [This.GetGreatDepressionNextThreshold]. We are in the [This.GetGreatDepressionPhase] phase. Causes: [This.GetGreatDepressionCauseOne], [This.GetGreatDepressionCauseTwo], [This.GetGreatDepressionCauseThree]. Relapse state: [This.GetGreatDepressionRelapseState]. Worldwide stage: [This.GetGreatDepressionGlobalStage]."
chaosx.nr35.2.d.worldwide: "The worldwide contraction has reached [This.GetName]. Suppliers, markets, and governments are absorbing a shock that no single border can contain. Depression Severity stands at §Y[?great_depression_depression_severity|0]§! / 100 ([This.GetGreatDepressionSeverityBand], [This.GetGreatDepressionSeverityTrend]). The next threshold is [This.GetGreatDepressionNextThreshold]. We are in the [This.GetGreatDepressionPhase] phase. Causes: [This.GetGreatDepressionCauseOne], [This.GetGreatDepressionCauseTwo], [This.GetGreatDepressionCauseThree]. Relapse state: [This.GetGreatDepressionRelapseState]. Worldwide stage: [This.GetGreatDepressionGlobalStage]."
chaosx.nr35.2.d.relapse: "A new shock has pulled [This.GetName] back from recovery. The earlier settlement remains in the record, but its protections are being tested again. Depression Severity stands at §Y[?great_depression_depression_severity|0]§! / 100 ([This.GetGreatDepressionSeverityBand], [This.GetGreatDepressionSeverityTrend]). The next threshold is [This.GetGreatDepressionNextThreshold]. We are in the [This.GetGreatDepressionPhase] phase. Causes: [This.GetGreatDepressionCauseOne], [This.GetGreatDepressionCauseTwo], [This.GetGreatDepressionCauseThree]. Relapse state: [This.GetGreatDepressionRelapseState]. Worldwide stage: [This.GetGreatDepressionGlobalStage]."
chaosx.nr35.2.a: "Survey the closures and choose a recovery course."
chaosx.nr35.3.t: "National Breakdown Warning"
chaosx.nr35.4.t: "The Emergency Mandate"
chaosx.nr35.4.d: "Strike committees and regional councils still control essential workplaces after the government's response failed. An emergency government may keep railways, relief offices, and factories operating, but ordinary cabinet rule will remain suspended until its mandate ends."
chaosx.nr35.4.a: "Entrust the state to an emergency government"
chaosx.nr35.4.b: "Stand down and negotiate a settlement"
chaosx.nr35.5.t: "Regional Councils Demand Recognition"
chaosx.nr35.5.d: "Regional councils now control workplaces and relief offices across their districts. Recognition can bring them into a negotiated recovery settlement. Forced integration retains direct rule at a deeper political cost."
chaosx.nr35.5.a: "Recognize the regional councils"
chaosx.nr35.5.b: "Enforce national integration"
chaosx.nr35.6.t: "National Breakdown"
chaosx.nr35.6.d: "The last emergency program has failed. Ministries are losing control of relief, transport, and industrial administration. The government can negotiate an emergency settlement or replace the cabinet and restore civilian authority. Open conflict is possible only where an armed opposition already holds territory and resources."
chaosx.nr35.6.a: "Conclude an emergency settlement"
chaosx.nr35.6.b: "Replace the cabinet and restore civilian authority"
chaosx.nr35.6.c: "The state will be decided by force"

