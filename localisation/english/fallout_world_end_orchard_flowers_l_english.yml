l_english:
  chaosx.fallout.408.t: "The Orchard Flowers Once"
  chaosx.fallout.408.d: "The orchard survived the cold years behind a windbreak of scrap and stone. Its first blossoms are small, pale, and real. The harvest cannot feed every settlement, so the council must decide whether to take fruit now, protect the seed, invite the valley to witness the bloom, or place the rows under a closed scientific program."
  chaosx.fallout.408.a: "Take the early harvest"
  chaosx.fallout.408.a.tt: "Spend Food and Medicine to gather fruit before the next frost."
  chaosx.fallout.408.b: "Guard the seed"
  chaosx.fallout.408.b.tt: "Spend Food and Medicine to preserve the orchard line for future planting."
  chaosx.fallout.408.c: "Open the orchard to the valley"
  chaosx.fallout.408.c.tt: "Spend supplies to make the first bloom a public recovery rite."
chaosx.fallout.408.e: "Put the rows under science control"
  chaosx.fallout.408.d.tt: "Spend Food and Medicine to test the trees under sealed observation."
  chaosx.fallout.410.t: "The First Fruit"
  chaosx.fallout.410.harvest_early.success.d: "The early harvest fills the ration tables without killing the trees. Workers record the frost line and save enough pits for the next season."
  chaosx.fallout.410.harvest_early.partial.d: "The fruit is edible, but the haste costs part of the orchard. The state gains a meal and loses a season of certainty."
  chaosx.fallout.410.harvest_early.failure.d: "The trees flowered ahead of their roots. A late frost and a tainted irrigation ditch leave the orchard quiet again."
  chaosx.fallout.410.preserve_seed.success.d: "The council leaves the fruit on the branch and stores the best pits in dry ash. The orchard becomes a living reserve rather than a single lucky meal."
  chaosx.fallout.410.preserve_seed.partial.d: "The seed keepers save a workable line, although several rows fail under the cold night. The reserve is smaller than promised."
  chaosx.fallout.410.preserve_seed.failure.d: "The sealed crates trapped moisture. The saved pits rot before the next planting window and the growers must admit the loss."
  chaosx.fallout.410.open_festival.success.d: "Families arrive under guard and share the first fruit by district. The festival gives the valley a common memory without emptying the storehouse."
  chaosx.fallout.410.open_festival.partial.d: "The gathering holds, but the crowd damages two terraces and leaves a sharp argument over who received the sweetest baskets."
  chaosx.fallout.410.open_festival.failure.d: "The road brings more people than the orchard can shelter. The bloom becomes a quarrel over access and the last clean water barrel."
  chaosx.fallout.410.scientist_control.success.d: "The sealed plots reveal a hardy local cultivar. The researchers publish the frost notes and let the growers choose where the first cuttings go."
  chaosx.fallout.410.scientist_control.partial.d: "The experiment produces useful data and little food. The state keeps a viable cutting, yet the closed gates leave the valley suspicious."
  chaosx.fallout.410.scientist_control.failure.d: "The instruments fail during a cold snap. The orchard is fenced off after the irrigation test, and no one can agree whether the soil or the method was at fault."
  chaosx.fallout.410.a: "Record the orchard decision"
  chaosx.fallout.410.a.tt: "Resolve the delayed orchard result and schedule the first harvest review."
  chaosx.fallout.412.t: "The Next Bloom"
  chaosx.fallout.412.success.d: "A year later, the orchard opens a second flowering row. The seed ledger, the growers, and the state granary now share one harvest date."
  chaosx.fallout.412.partial.d: "The second bloom is uneven, but enough trees carry fruit to keep the orchard from becoming a single-season story."
  chaosx.fallout.412.failure.d: "The next bloom fails. The growers keep the ledger and bury the dead roots, while the state prepares for another hungry winter."
  chaosx.fallout.412.a: "Close the orchard record"
  chaosx.fallout.412.a.tt: "Record the first harvest review and release the recovery chain."
  fallout.event_log.orchard_flowers.name: "The Orchard Flowers Once"
  fallout.event_log.orchard_flowers.detail: "The orchard policy and first harvest review changed food, adaptation, reclamation, and local memory."
  fallout.event_log.orchard_flowers.harvest_early_success: "An early harvest fed the valley and preserved a workable orchard line."
  fallout.event_log.orchard_flowers.harvest_early_partial: "An early harvest fed the valley but cost part of the orchard."
  fallout.event_log.orchard_flowers.harvest_early_failure: "An early harvest failed after frost and irrigation damage."
  fallout.event_log.orchard_flowers.preserve_seed_success: "Seed keepers preserved a hardy orchard line for future planting."
  fallout.event_log.orchard_flowers.preserve_seed_partial: "Seed keepers preserved a smaller orchard line than planned."
  fallout.event_log.orchard_flowers.preserve_seed_failure: "The seed reserve rotted before the next planting window."
  fallout.event_log.orchard_flowers.open_festival_success: "A public orchard festival built a shared recovery memory."
  fallout.event_log.orchard_flowers.open_festival_partial: "The orchard festival held, but damaged terraces and trust."
  fallout.event_log.orchard_flowers.open_festival_failure: "The orchard opening became a conflict over food and clean water."
  fallout.event_log.orchard_flowers.scientist_control_success: "A sealed orchard trial produced a hardy local cultivar."
  fallout.event_log.orchard_flowers.scientist_control_partial: "A sealed orchard trial produced data and little food."
  fallout.event_log.orchard_flowers.scientist_control_failure: "A failed orchard trial left the soil and method in dispute."
  fallout.event_log.orchard_flowers.callback_success: "The orchard returned for a strong second bloom."
  fallout.event_log.orchard_flowers.callback_partial: "The orchard returned with an uneven second bloom."
  fallout.event_log.orchard_flowers.callback_failure: "The second orchard bloom failed and the state prepared for another winter."
