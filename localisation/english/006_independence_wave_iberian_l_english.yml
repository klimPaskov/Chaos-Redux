l_english:
CHAOSX_COLLECTION_CHAOSX_COUNTRY_INDEPENDENCE_WAVE_IBERIAN: "Chaos Redux Independence Wave: Iberian Carriers"
independence_wave_nav_iberian_category: "The Basque Founding Compact"
independence_wave_nav_iberian_category_desc: "The Basque government must bind its local fueros, workshops, and mountain supply lines into a stable state. The compact stabilizes when both measures reach §Y[?constant:independence_wave_iberian_pressure.stable|0]§! or higher.\n\nFueros Legitimacy: §Y[?independence_wave_nav_fueros_legitimacy|0]§!\nIndustrial Capacity: §Y[?independence_wave_nav_industrial_capacity|0]§!"
independence_wave_nav_hold_fueros_together: "Hold the Fueros Together"
independence_wave_nav_hold_fueros_together_desc: "Raise Fueros Legitimacy and Industrial Capacity to §Y[?constant:independence_wave_iberian_pressure.stable|0]§! before the founding settlement expires. Losing control of the capital will also break the compact."
independence_wave_nav_secure_mountain_depots: "Secure the Mountain Depots"
independence_wave_nav_secure_mountain_depots_desc: "Inventory the mountain stores, repair the roadheads, and pay the engineers who keep the compact supplied."
independence_wave_nav_integrate_factory_guards: "Integrate Factory Guards"
independence_wave_nav_integrate_factory_guards_desc: "Bring the armed works committees into one command without stripping the municipalities of their authority."
independence_wave_nav_reconcile_fueros_and_assembly: "Reconcile Fueros and Assembly"
independence_wave_nav_reconcile_fueros_and_assembly_desc: "Settle the boundary between historic local privileges and a common Basque administration."
independence_wave_nav_settle_former_host_ledgers: "Settle Relations with [independence_wave_former_host.GetNameDef]"
independence_wave_nav_settle_former_host_ledgers_desc: "Negotiate borders, property claims, and recognition with [independence_wave_former_host.GetNameDef]. The talks cannot continue if war begins."
independence_wave_nav_ratify_fueros_charter: "Ratify the Fueros Charter"
independence_wave_nav_ratify_fueros_charter_desc: "Write a constitutional compact that protects local government while creating a credible foreign office."
independence_wave_nav_convene_workers_board: "Convene the Workers' Board"
independence_wave_nav_convene_workers_board_desc: "Give the workshops and rail crews a public mandate to coordinate production and defense."
independence_wave_nav_confirm_municipal_compact: "Confirm the Municipal Compact"
independence_wave_nav_confirm_municipal_compact_desc: "Make the valley councils responsible for taxation, recruitment, and the hard compromises of independence."
independence_wave_nav_establish_pyrenean_command: "Establish the Pyrenean Command"
independence_wave_nav_establish_pyrenean_command_desc: "Concentrate the frontier command around mountain logistics before a stronger neighbour tests the new border."
independence_wave_nav_accept_protected_customs_mandate: "Accept a Protected Customs Mandate"
independence_wave_nav_accept_protected_customs_mandate_desc: "A patron can open markets and arms shipments, but the mandate will bind future choices."
independence_wave_nav_codify_sovereignty: "Codify Durable Sovereignty"
independence_wave_nav_codify_sovereignty_desc: "Turn a surviving emergency into a state whose institutions can outlast its founders."
independence_wave_nav_open_iberian_network: "Open the Iberian Network"
independence_wave_nav_open_iberian_network_desc: "Link the Basque compact to Iberian partners through shared depots, recognition, and a common league reserve."
independence_wave_nav_depots_effect_tt: "Fueros Legitimacy rises by §Y5§! and Industrial Capacity rises by §Y10§!. The mountain transport and economic programs also advance."
independence_wave_nav_factory_guards_effect_tt: "Fueros Legitimacy rises by §Y5§! and Industrial Capacity rises by §Y15§!. The integrated military program also advances."
independence_wave_nav_assembly_effect_tt: "Fueros Legitimacy rises by §Y15§! and Industrial Capacity rises by §Y5§!. The public settlement also advances."
independence_wave_nav_host_ledgers_effect_tt: "Fueros Legitimacy rises by §Y5§! and Industrial Capacity rises by §Y10§!. [independence_wave_former_host.GetNameDefCap] reduces its claims, hostility, and outstanding demands while accepting firmer borders."
independence_wave_nav_route_effect_tt: "The selected government takes office, replaces the founding national spirit, and shifts Fueros Legitimacy and Industrial Capacity according to its program."
independence_wave_nav_patron_route_effect_tt: "The protected customs government takes office and accepts limits on Basque diplomatic and commercial freedom. Fueros Legitimacy and Industrial Capacity each rise by §Y5§!."
independence_wave_nav_network_effect_tt: "The Basque government opens an Iberian corridor, advances its federation ambitions, strengthens the Independence Network, and raises League cohesion, reserves, and member confidence."

independence_wave_glc_iberian_category: "The Galician Founding Council"
independence_wave_glc_iberian_category_desc: "Galicia must reconcile its ports, inland councils, and territorial defenses before the founding settlement fails. The compact stabilizes when both measures reach §Y[?constant:independence_wave_iberian_pressure.stable|0]§! or higher.\n\nCouncil Legitimacy: §Y[?independence_wave_glc_council_legitimacy|0]§!\nPort Capacity: §Y[?independence_wave_glc_port_capacity|0]§!"
independence_wave_glc_hold_council_together: "Hold the Atlantic Council Together"
independence_wave_glc_hold_council_together_desc: "Raise Council Legitimacy and Port Capacity to §Y[?constant:independence_wave_iberian_pressure.stable|0]§! before the founding settlement expires. Losing control of the capital will also break the council."
independence_wave_glc_secure_inland_depots: "Secure the Inland Depots"
independence_wave_glc_secure_inland_depots_desc: "Move grain, tools, and ammunition from the coast to the interior before the new country is isolated."
independence_wave_glc_integrate_coastal_guards: "Integrate the Coastal Guards"
independence_wave_glc_integrate_coastal_guards_desc: "Bring harbour patrols and local defense companies into a territorial command with a single supply plan."
independence_wave_glc_reconcile_council_and_port: "Reconcile Council and Port"
independence_wave_glc_reconcile_council_and_port_desc: "Settle who controls customs revenue, dock labor, and the councils that answer to the interior."
independence_wave_glc_settle_former_host_ledgers: "Settle Relations with [independence_wave_former_host.GetNameDef]"
independence_wave_glc_settle_former_host_ledgers_desc: "Negotiate borders, property claims, and recognition with [independence_wave_former_host.GetNameDef]. The talks cannot continue if war begins."
independence_wave_glc_ratify_atlantic_charter: "Ratify the Atlantic Charter"
independence_wave_glc_ratify_atlantic_charter_desc: "Give the country a constitutional administration with a port policy that can survive pressure from abroad."
independence_wave_glc_convene_workers_port_council: "Convene the Workers' Port Council"
independence_wave_glc_convene_workers_port_council_desc: "Place dock labor, shipwrights, and the inland rail crews inside a common production authority."
independence_wave_glc_confirm_municipal_covenant: "Confirm the Municipal Covenant"
independence_wave_glc_confirm_municipal_covenant_desc: "Let the parish and municipal councils carry the cost of defense in exchange for a durable voice in the state."
independence_wave_glc_establish_coastal_command: "Establish the Coastal Command"
independence_wave_glc_establish_coastal_command_desc: "Concentrate scarce officers around the ports and the road to Santiago before an outside power exploits the coastline."
independence_wave_glc_accept_protected_customs_mandate: "Accept a Protected Customs Mandate"
independence_wave_glc_accept_protected_customs_mandate_desc: "A patron can keep the port open, but the compact will owe concessions in return."
independence_wave_glc_codify_sovereignty: "Codify Durable Sovereignty"
independence_wave_glc_codify_sovereignty_desc: "Make the Atlantic compact a state with institutions that can survive beyond the emergency council."
independence_wave_glc_open_iberian_network: "Open the Iberian Network"
independence_wave_glc_open_iberian_network_desc: "Connect Galicia to Iberian partners through port access, recognition, and a shared League reserve."
independence_wave_glc_depots_effect_tt: "Council Legitimacy rises by §Y5§! and Port Capacity rises by §Y10§!. The inland transport and economic programs also advance."
independence_wave_glc_coastal_guards_effect_tt: "Council Legitimacy rises by §Y5§! and Port Capacity rises by §Y15§!. The integrated military program also advances."
independence_wave_glc_council_effect_tt: "Council Legitimacy rises by §Y15§! and Port Capacity rises by §Y5§!. The public settlement also advances."
independence_wave_glc_host_ledgers_effect_tt: "Council Legitimacy rises by §Y5§! and Port Capacity rises by §Y10§!. [independence_wave_former_host.GetNameDefCap] reduces its claims, hostility, and outstanding demands while accepting firmer borders."
independence_wave_glc_route_effect_tt: "The selected government takes office, replaces the founding national spirit, and shifts Council Legitimacy and Port Capacity according to its program."
independence_wave_glc_patron_route_effect_tt: "The protected customs government takes office and accepts limits on Galician diplomatic and commercial freedom. Council Legitimacy and Port Capacity each rise by §Y5§!."
independence_wave_glc_network_effect_tt: "The Galician government opens an Iberian corridor, advances its federation ambitions, strengthens the Independence Network, and raises League cohesion, reserves, and member confidence."

independence_wave_iberian_project_failure_effect_tt: "Failure reduces Legitimacy, Recognition, Capacity, and Security, raises Instability, and weakens the regional compact."

