nav_contested_fueros: "Contested Fueros"
nav_contested_fueros_desc: "Local privileges and a common administration are still being contested."
nav_mountain_industrial_compact: "Mountain Industrial Compact"
nav_mountain_industrial_compact_desc: "Basque workshops and mountain councils are operating under one survival compact."
nav_constitutional_fueros: "Constitutional Fueros"
nav_constitutional_fueros_desc: "A constitutional charter protects local government while supporting a common foreign policy."
nav_workers_arsenal_council: "Workers' Arsenal Council"
nav_workers_arsenal_council_desc: "Industrial and rail committees coordinate production for the defense of the compact."
nav_municipal_fueros: "Municipal Fueros"
nav_municipal_fueros_desc: "Municipal councils carry the state through a negotiated traditional settlement."
nav_frontier_command: "Frontier Command"
nav_frontier_command_desc: "A mountain command concentrates scarce officers and supplies on the Pyrenean frontier."
nav_protected_pyrenean_compact: "Protected Pyrenean Compact"
nav_protected_pyrenean_compact_desc: "A patron mandate keeps trade open while narrowing the compact's diplomatic freedom."

glc_contested_council: "Contested Atlantic Council"
glc_contested_council_desc: "The port, countryside, and municipal councils have not yet found a stable balance."
glc_atlantic_compact: "Atlantic Compact"
glc_atlantic_compact_desc: "Port authorities, inland councils, and municipal delegates share revenue, supply, and defense duties."
glc_constitutional_charter: "Atlantic Constitutional Charter"
glc_constitutional_charter_desc: "A constitutional administration protects Galician municipalities and the port."
glc_workers_port_council: "Workers' Port Council"
glc_workers_port_council_desc: "Dock labor and inland rail crews coordinate production and defense."
glc_municipal_atlantic_covenant: "Municipal Atlantic Covenant"
glc_municipal_atlantic_covenant_desc: "Parish and municipal councils carry the cost of sovereignty."
glc_coastal_security_command: "Coastal Security Command"
glc_coastal_security_command_desc: "A concentrated coastal command protects the ports and the road to Santiago."
glc_protected_customs_mandate: "Protected Customs Mandate"
glc_protected_customs_mandate_desc: "A patron keeps the port open in exchange for diplomatic and commercial concessions."
