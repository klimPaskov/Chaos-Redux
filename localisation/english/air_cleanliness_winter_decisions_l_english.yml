air_winter_hold_abandonment_vote_cost_tooltip: "£command_power §Y[?constant:air_winter_response_cost.abandonment_command|0]§!  £stability_texticon §Y[?constant:air_winter_response_cost.abandonment_stability|%0]§!"
air_winter_hold_abandonment_vote_requirements_tt: "Select an owned and controlled state that has remained in Air Winter phase 5 for at least [?constant:air_winter_response_result.terminal_action_minimum_months|0] months. It must not have completed an abandonment vote. No other emergency measure may be underway and its response teams must be ready."
air_winter_hold_abandonment_vote_effect_tt: "[FROM.GetName] records the abandonment vote. Its surviving authorities face the final choice over whether the state can still be held."

air_winter_seal_bunker_doors: "Seal the Bunker Doors"
air_winter_seal_bunker_doors_desc: "Concentrate remaining stores inside fortified shelters and close them against the ash outside."
air_winter_seal_bunker_doors_cost: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.bunker_support|0]§!  £infantry_equipment_text_icon §Y[?constant:air_winter_response_cost.bunker_infantry|0]§!  £stability_texticon §Y[?constant:air_winter_response_cost.bunker_stability|%0]§!"
