air_winter_final_evacuation_effect_tt: "Moves §Y[?air_winter_final_evacuation_population_transfer_people|0]§! people from [FROM.GetName] to [?air_winter_evacuation_cache_receiver_state.GetName]. Source Refugee Pressure falls by §G[?air_winter_final_evacuation_source_pressure_relief|1]§!. Receiver Refugee Pressure rises by §R[?air_winter_final_evacuation_receiver_pressure_gain|1]§! to [?air_winter_final_evacuation_receiver_pressure_after|1]. The paid quote remains fixed through the [?constant:air_winter_response_timing.final_evacuation_days|0] day movement."

