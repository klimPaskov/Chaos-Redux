l_english:
air_winter_response_category: "Air Winter Emergency Response"
air_winter_response_category_desc: "As ash thickens and daylight fails, each state must choose what it can still protect and what it must leave behind."

air_winter_designate_response_priority: "Set the Emergency Priority"
air_winter_designate_response_priority_desc: "Concentrate the national response on one threatened state. Other states remain exposed until the priority is moved."
air_winter_designate_response_priority_requirements_tt: "Select an owned and controlled state already affected by Air Winter. No state response project may be underway."
air_winter_designate_response_priority_effect_tt: "[FROM.GetName] becomes the sole emergency priority. Its available response measures and evacuation quote are shown in this category."
air_winter_response_priority_summary: "Priority State: [FROM.GetName]"
air_winter_response_priority_summary_desc: "[FROM.GetName] is in Air Winter phase [?FROM.air_winter_phase|0] with [?FROM.air_winter_survival_value|1] Survival, [?FROM.air_winter_exposure|1] Exposure and [?FROM.air_winter_refugee_pressure|1] Refugee Pressure."
air_winter_response_priority_summary_locked_tt: "This row records the current emergency priority. Choose another state through Set the Emergency Priority."

air_winter_designate_reception_state: "Designate a Reception State"
air_winter_designate_reception_state_desc: "Name the one state that will receive organized evacuations if conditions become unlivable elsewhere."
air_winter_designate_reception_state_cost: "£command_power §Y[?constant:air_winter_response_cost.designate_reception_command|0]§!"
air_winter_designate_reception_state_cost_blocked: "£command_power §R[?constant:air_winter_response_cost.designate_reception_command|0]§!"
air_winter_designate_reception_state_cost_tooltip: "£command_power §Y[?constant:air_winter_response_cost.designate_reception_command|0]§!"
air_winter_designate_reception_state_requirements_tt: "Select an owned and controlled Air Winter state with phase at most [?constant:air_winter_response_result.reception_maximum_phase|0], at least [?constant:air_winter_response_result.reception_minimum_survival|0] Survival and [?constant:air_winter_response_result.reception_minimum_shelter|0] Shelter Capacity. No other emergency measure may be underway there and its response teams must be ready."
air_winter_designate_reception_state_effect_tt: "[FROM.GetName] becomes the sole reception state. Any earlier designation is removed."
air_winter_reception_state_summary: "Reception State: [FROM.GetName]"
air_winter_reception_state_summary_desc: "[FROM.GetName] holds [?FROM.state_population_k|0]K people and [?FROM.air_winter_refugee_pressure|1] Refugee Pressure. Evacuation pressure may not exceed [?constant:air_winter_response_evacuation.receiver_pressure_ceiling|0]."
air_winter_reception_state_summary_locked_tt: "This row records the current reception state. A reception state must remain under our ownership and control and must retain sufficient shelter and survival capacity."

air_winter_distribute_respirator_kits: "Distribute Respirator Kits"
air_winter_distribute_respirator_kits_desc: "Issue sealed masks and replacement filters before the ash reaches lethal density."
air_winter_distribute_respirator_kits_cost: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.mask_support|0]§!  £infantry_equipment_text_icon §Y[?constant:air_winter_response_cost.mask_infantry|0]§!  £stability_texticon §Y[?constant:air_winter_response_cost.mask_stability|%0]§!"
air_winter_distribute_respirator_kits_cost_blocked: "£support_equipment_text_icon §R[?constant:air_winter_response_cost.mask_support|0]§!  £infantry_equipment_text_icon §R[?constant:air_winter_response_cost.mask_infantry|0]§!  £stability_texticon §R[?constant:air_winter_response_cost.mask_stability|%0]§!"
air_winter_distribute_respirator_kits_cost_tooltip: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.mask_support|0]§!  £infantry_equipment_text_icon §Y[?constant:air_winter_response_cost.mask_infantry|0]§!  £stability_texticon §Y[?constant:air_winter_response_cost.mask_stability|%0]§!"
air_winter_distribute_respirator_kits_requirements_tt: "Select an owned and controlled state in Air Winter phase 1 or 2. Respirator kits must not have been distributed there. No other emergency measure may be underway and its response teams must be ready."
air_winter_distribute_respirator_kits_effect_tt: "[FROM.GetName] loses [?constant:air_winter_response_result.mask_exposure_reduction|0] Exposure and [?constant:air_winter_response_result.mask_disease_reduction|0] Disease Pressure, then gains [?constant:air_winter_response_result.mask_adaptation_gain|0] Adaptation. Its emergency teams cannot begin another measure for [?constant:air_winter_response_timing.early_state_cooldown_months|0] months."

air_winter_convert_respiratory_clinics: "Convert Respiratory Clinics"
air_winter_convert_respiratory_clinics_desc: "Turn urban wards into sealed respiratory clinics with filtered intake rooms and protected staff."
air_winter_convert_respiratory_clinics_cost: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.clinic_support|0]§!  £manpower_texticon §Y[?constant:air_winter_response_cost.clinic_manpower|0]§!  £civ_factory §Y[?constant:air_winter_response_cost.clinic_civilian_factories|0]§!"
air_winter_convert_respiratory_clinics_cost_blocked: "£support_equipment_text_icon §R[?constant:air_winter_response_cost.clinic_support|0]§!  £manpower_texticon §R[?constant:air_winter_response_cost.clinic_manpower|0]§!  £civ_factory §R[?constant:air_winter_response_cost.clinic_civilian_factories|0]§!"
air_winter_convert_respiratory_clinics_cost_tooltip: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.clinic_support|0]§!  £manpower_texticon §Y[?constant:air_winter_response_cost.clinic_manpower|0]§!  £civ_factory §Y[?constant:air_winter_response_cost.clinic_civilian_factories|0]§! reserved while conversion is underway"
air_winter_convert_respiratory_clinics_requirements_tt: "Select an owned and controlled city state in Air Winter phase 1 or 2. It must not already have a respiratory clinic. No other emergency measure may be underway and its response teams must be ready."
air_winter_convert_respiratory_clinics_effect_tt: "[FROM.GetName] loses [?constant:air_winter_response_result.clinic_disease_reduction|0] Disease Pressure, then gains [?constant:air_winter_response_result.clinic_shelter_gain|0] Shelter Capacity and [?constant:air_winter_response_result.clinic_recovery_gain|0] Recovery. Its emergency teams cannot begin another measure for [?constant:air_winter_response_timing.early_state_cooldown_months|0] months."

air_winter_station_roof_samplers: "Station Roof Samplers"
air_winter_station_roof_samplers_desc: "Deploy mobile teams to measure ash load, toxic drift and the brief gaps when outdoor work remains possible."
air_winter_station_roof_samplers_cost: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.sampling_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?constant:air_winter_response_cost.sampling_motorized|0]§!  £command_power §Y[?constant:air_winter_response_cost.sampling_command|0]§!"
air_winter_station_roof_samplers_cost_blocked: "£support_equipment_text_icon §R[?constant:air_winter_response_cost.sampling_support|0]§!  £GFX_motorized_equipment_text_icon §R[?constant:air_winter_response_cost.sampling_motorized|0]§!  £command_power §R[?constant:air_winter_response_cost.sampling_command|0]§!"
air_winter_station_roof_samplers_cost_tooltip: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.sampling_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?constant:air_winter_response_cost.sampling_motorized|0]§!  £command_power §Y[?constant:air_winter_response_cost.sampling_command|0]§!"
air_winter_station_roof_samplers_requirements_tt: "Select an owned and controlled state in Air Winter phase 1 or 2. It must not already have roof sampling stations. No other emergency measure may be underway and its response teams must be ready."
air_winter_station_roof_samplers_effect_tt: "[FROM.GetName] gains [?constant:air_winter_response_result.sampling_adaptation_gain|0] Adaptation and [?constant:air_winter_response_result.sampling_reclamation_gain|0] Reclamation. Sampling reduces recurring Air Winter pressure by [?constant:air_winter_response_result.sampling_pressure_reduction|0]. Its emergency teams cannot begin another measure for [?constant:air_winter_response_timing.early_state_cooldown_months|0] months."

air_winter_protect_crop_trials: "Protect Crop Trials"
air_winter_protect_crop_trials_desc: "Shield cold-resistant seed beds and ration irrigation to preserve a harvest beneath the dim sky."
air_winter_protect_crop_trials_cost: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.crop_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?constant:air_winter_response_cost.crop_motorized|0]§!  £GFX_fuel_texticon §Y[?constant:air_winter_response_cost.crop_fuel|0]§!  £civ_factory §Y[?constant:air_winter_response_cost.crop_civilian_factories|0]§!"
air_winter_protect_crop_trials_cost_blocked: "£support_equipment_text_icon §R[?constant:air_winter_response_cost.crop_support|0]§!  £GFX_motorized_equipment_text_icon §R[?constant:air_winter_response_cost.crop_motorized|0]§!  £GFX_fuel_texticon §R[?constant:air_winter_response_cost.crop_fuel|0]§!  £civ_factory §R[?constant:air_winter_response_cost.crop_civilian_factories|0]§!"
air_winter_protect_crop_trials_cost_tooltip: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.crop_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?constant:air_winter_response_cost.crop_motorized|0]§!  £GFX_fuel_texticon §Y[?constant:air_winter_response_cost.crop_fuel|0]§!  £civ_factory §Y[?constant:air_winter_response_cost.crop_civilian_factories|0]§! reserved while trials are protected"
air_winter_protect_crop_trials_requirements_tt: "Select an owned and controlled food-producing state in Air Winter phase 1 or 2. It must not already have protected crop trials. No other emergency measure may be underway and its response teams must be ready."
air_winter_protect_crop_trials_effect_tt: "[FROM.GetName] gains [?constant:air_winter_response_result.crop_food_gain|0] Food Reserve and [?constant:air_winter_response_result.crop_adaptation_gain|0] Adaptation, while losing [?constant:air_winter_response_result.crop_water_cost|0] Water Security. Its emergency teams cannot begin another measure for [?constant:air_winter_response_timing.early_state_cooldown_months|0] months."

air_winter_clear_ash_routes: "Clear Ash Routes"
air_winter_clear_ash_routes_desc: "Send crews into the ash to keep the roads between depots, shelters and hospitals passable."
air_winter_clear_ash_routes_cost: "£GFX_motorized_equipment_text_icon §Y[?constant:air_winter_response_cost.ash_motorized|0]§!  £manpower_texticon §Y[?constant:air_winter_response_cost.ash_manpower|0]§!  £command_power §Y[?constant:air_winter_response_cost.ash_command|0]§!"
air_winter_clear_ash_routes_cost_blocked: "£GFX_motorized_equipment_text_icon §R[?constant:air_winter_response_cost.ash_motorized|0]§!  £manpower_texticon §R[?constant:air_winter_response_cost.ash_manpower|0]§!  £command_power §R[?constant:air_winter_response_cost.ash_command|0]§!"
air_winter_clear_ash_routes_cost_tooltip: "£GFX_motorized_equipment_text_icon §Y[?constant:air_winter_response_cost.ash_motorized|0]§!  £manpower_texticon §Y[?constant:air_winter_response_cost.ash_manpower|0]§!  £command_power §Y[?constant:air_winter_response_cost.ash_command|0]§!"
air_winter_clear_ash_routes_requirements_tt: "Select an owned and controlled transport state in Air Winter phase 3. Its ash routes must not have been cleared before. No other emergency measure may be underway and its response teams must be ready."
air_winter_clear_ash_routes_effect_tt: "[FROM.GetName] loses [?constant:air_winter_response_result.ash_building_pressure_reduction|0] Building Damage Pressure and [?constant:air_winter_response_result.ash_category_damage_reduction|0] Category Damage, then gains [?constant:air_winter_response_result.ash_reclamation_gain|0] Reclamation. Exposed workers gain [?constant:air_winter_response_result.ash_worker_risk_exposure|0] Exposure. Its emergency teams cannot begin another measure for [?constant:air_winter_response_timing.infrastructure_state_cooldown_months|0] months."

air_winter_protect_rail_corridors: "Protect Rail and Supply Corridors"
air_winter_protect_rail_corridors_desc: "Assign trains, repair crews and guarded stores to the corridors that still connect the state to national supply."
air_winter_protect_rail_corridors_cost: "£GFX_train_texticon §Y[?constant:air_winter_response_cost.rail_trains|0]§!  £support_equipment_text_icon §Y[?constant:air_winter_response_cost.rail_support|0]§!  £manpower_texticon §Y[?constant:air_winter_response_cost.rail_manpower|0]§!"
air_winter_protect_rail_corridors_cost_blocked: "£GFX_train_texticon §R[?constant:air_winter_response_cost.rail_trains|0]§!  £support_equipment_text_icon §R[?constant:air_winter_response_cost.rail_support|0]§!  £manpower_texticon §R[?constant:air_winter_response_cost.rail_manpower|0]§!"
air_winter_protect_rail_corridors_cost_tooltip: "£GFX_train_texticon §Y[?constant:air_winter_response_cost.rail_trains|0]§!  £support_equipment_text_icon §Y[?constant:air_winter_response_cost.rail_support|0]§!  £manpower_texticon §Y[?constant:air_winter_response_cost.rail_manpower|0]§!"
air_winter_protect_rail_corridors_requirements_tt: "Select an owned and controlled state in Air Winter phase 3 with a railway or supply node. Its corridors must not have received this protection before. No other emergency measure may be underway and its response teams must be ready."
air_winter_protect_rail_corridors_effect_tt: "[FROM.GetName] loses [?constant:air_winter_response_result.rail_building_pressure_reduction|0] Building Damage Pressure and gains [?constant:air_winter_response_result.rail_reclamation_gain|0] Reclamation. For [?constant:air_winter_response_timing.rail_protection_months|0] months it gains [?constant:air_winter_response_result.rail_local_supply_bonus|%0] Local Supplies and [?constant:air_winter_response_result.rail_repair_bonus|%0] Railway and Infrastructure Repair Speed. Its emergency teams cannot begin another measure for [?constant:air_winter_response_timing.infrastructure_state_cooldown_months|0] months."

air_winter_close_exposed_airfields: "Close Exposed Airfields"
air_winter_close_exposed_airfields_desc: "Ground exposed operations, drain vulnerable stores and render the runways unusable until the ash load eases."
air_winter_close_exposed_airfields_cost: "£GFX_fuel_texticon §Y[?constant:air_winter_response_cost.airbase_fuel|0]§!  £command_power §Y[?constant:air_winter_response_cost.airbase_command|0]§!  £GFX_war_support_icon §Y[?constant:air_winter_response_cost.airbase_war_support|%0]§!"
air_winter_close_exposed_airfields_cost_blocked: "£GFX_fuel_texticon §R[?constant:air_winter_response_cost.airbase_fuel|0]§!  £command_power §R[?constant:air_winter_response_cost.airbase_command|0]§!  £GFX_war_support_icon §R[?constant:air_winter_response_cost.airbase_war_support|%0]§!"
air_winter_close_exposed_airfields_cost_tooltip: "£GFX_fuel_texticon §Y[?constant:air_winter_response_cost.airbase_fuel|0]§!  £command_power §Y[?constant:air_winter_response_cost.airbase_command|0]§!  £GFX_war_support_icon §Y[?constant:air_winter_response_cost.airbase_war_support|%0]§!"
air_winter_close_exposed_airfields_requirements_tt: "Select an owned and controlled state in Air Winter phase 3 with at least one Air Base level. Its airfields must not have been closed before. No other emergency measure may be underway and its response teams must be ready."
air_winter_close_exposed_airfields_effect_tt: "Every current Air Base level in [FROM.GetName] is fully damaged. Air Base construction and repair are halted for [?constant:air_winter_response_timing.airbase_closure_months|0] months. The state loses [?constant:air_winter_response_result.airbase_exposure_reduction|0] Exposure and [?constant:air_winter_response_result.airbase_building_pressure_reduction|0] Building Damage Pressure. Its emergency teams cannot begin another measure for [?constant:air_winter_response_timing.infrastructure_state_cooldown_months|0] months."

air_winter_prepare_evacuation_ledger: "Prepare an Evacuation Ledger"
air_winter_prepare_evacuation_ledger_desc: "Register households, transport needs and assembly points before departure becomes a race through frozen ash."
air_winter_prepare_evacuation_ledger_cost: "£GFX_train_texticon §Y[?constant:air_winter_response_cost.planning_trains|0]§!  £support_equipment_text_icon §Y[?constant:air_winter_response_cost.planning_support|0]§!  £command_power §Y[?constant:air_winter_response_cost.planning_command|0]§!"
air_winter_prepare_evacuation_ledger_cost_blocked: "£GFX_train_texticon §R[?constant:air_winter_response_cost.planning_trains|0]§!  £support_equipment_text_icon §R[?constant:air_winter_response_cost.planning_support|0]§!  £command_power §R[?constant:air_winter_response_cost.planning_command|0]§!"
air_winter_prepare_evacuation_ledger_cost_tooltip: "£GFX_train_texticon §Y[?constant:air_winter_response_cost.planning_trains|0]§!  £support_equipment_text_icon §Y[?constant:air_winter_response_cost.planning_support|0]§!  £command_power §Y[?constant:air_winter_response_cost.planning_command|0]§!"
air_winter_prepare_evacuation_ledger_requirements_tt: "Select an owned and controlled state in Air Winter phase 3. It must not already have a completed evacuation ledger. No other emergency measure may be underway and its response teams must be ready."
air_winter_prepare_evacuation_ledger_effect_tt: "[FROM.GetName] gains [?constant:air_winter_response_result.planning_adaptation_gain|0] Adaptation and [?constant:air_winter_response_result.planning_shelter_gain|0] Shelter Capacity. Controlled evacuation becomes possible if the state reaches phase 4. Its emergency teams cannot begin another measure for [?constant:air_winter_response_timing.infrastructure_state_cooldown_months|0] months."

air_winter_enact_emergency_shelter_law: "Enact an Emergency Shelter Law"
air_winter_enact_emergency_shelter_law_desc: "Requisition protected basements, tunnels and public halls for civilians driven out of unsafe housing."
air_winter_enact_emergency_shelter_law_cost: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.shelter_support|0]§!  £manpower_texticon §Y[?constant:air_winter_response_cost.shelter_manpower|0]§!  £stability_texticon §Y[?constant:air_winter_response_cost.shelter_stability|%0]§!"
air_winter_enact_emergency_shelter_law_cost_blocked: "£support_equipment_text_icon §R[?constant:air_winter_response_cost.shelter_support|0]§!  £manpower_texticon §R[?constant:air_winter_response_cost.shelter_manpower|0]§!  £stability_texticon §R[?constant:air_winter_response_cost.shelter_stability|%0]§!"
air_winter_enact_emergency_shelter_law_cost_tooltip: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.shelter_support|0]§!  £manpower_texticon §Y[?constant:air_winter_response_cost.shelter_manpower|0]§!  £stability_texticon §Y[?constant:air_winter_response_cost.shelter_stability|%0]§!"
air_winter_enact_emergency_shelter_law_requirements_tt: "Select an owned and controlled state in Air Winter phase 4. It must not already enforce the emergency shelter law. No other emergency measure may be underway and its response teams must be ready."
air_winter_enact_emergency_shelter_law_effect_tt: "[FROM.GetName] gains [?constant:air_winter_response_result.shelter_capacity_gain|0] Shelter Capacity and [?constant:air_winter_response_result.shelter_adaptation_gain|0] Adaptation. Refugee Pressure rises by [?constant:air_winter_response_result.shelter_refugee_pressure_gain|0]. Its emergency teams cannot begin another measure for [?constant:air_winter_response_timing.severe_state_cooldown_months|0] months."

air_winter_convert_greenhouse_refuge: "Convert a Greenhouse Refuge"
air_winter_convert_greenhouse_refuge_desc: "Seal urban growing halls and redirect heat, light and water to a protected food refuge."
air_winter_convert_greenhouse_refuge_cost: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.greenhouse_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?constant:air_winter_response_cost.greenhouse_motorized|0]§!  £GFX_fuel_texticon §Y[?constant:air_winter_response_cost.greenhouse_fuel|0]§!  £civ_factory §Y[?constant:air_winter_response_cost.greenhouse_civilian_factories|0]§!"
air_winter_convert_greenhouse_refuge_cost_blocked: "£support_equipment_text_icon §R[?constant:air_winter_response_cost.greenhouse_support|0]§!  £GFX_motorized_equipment_text_icon §R[?constant:air_winter_response_cost.greenhouse_motorized|0]§!  £GFX_fuel_texticon §R[?constant:air_winter_response_cost.greenhouse_fuel|0]§!  £civ_factory §R[?constant:air_winter_response_cost.greenhouse_civilian_factories|0]§!"
air_winter_convert_greenhouse_refuge_cost_tooltip: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.greenhouse_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?constant:air_winter_response_cost.greenhouse_motorized|0]§!  £GFX_fuel_texticon §Y[?constant:air_winter_response_cost.greenhouse_fuel|0]§!  £civ_factory §Y[?constant:air_winter_response_cost.greenhouse_civilian_factories|0]§! reserved while conversion is underway"
air_winter_convert_greenhouse_refuge_requirements_tt: "Select an owned and controlled city state in Air Winter phase 4. It must not already have a greenhouse refuge. No other emergency measure may be underway and its response teams must be ready."
air_winter_convert_greenhouse_refuge_effect_tt: "[FROM.GetName] gains [?constant:air_winter_response_result.greenhouse_food_gain|0] Food Reserve and [?constant:air_winter_response_result.greenhouse_reclamation_gain|0] Reclamation, while losing [?constant:air_winter_response_result.greenhouse_water_cost|0] Water Security. Its emergency teams cannot begin another measure for [?constant:air_winter_response_timing.severe_state_cooldown_months|0] months."

air_winter_controlled_evacuation: "Conduct a Controlled Evacuation"
air_winter_controlled_evacuation_desc: "Move registered residents while rail and convoy routes can still deliver them to the reception state."
air_winter_controlled_evacuation_cost: "£GFX_train_texticon §Y[?air_winter_controlled_evacuation_train_cost|0]§!  £convoy_texticon §Y[?air_winter_controlled_evacuation_convoy_cost|0]§!  £manpower_texticon §Y[?air_winter_controlled_evacuation_manpower_cost|0]§!  £stability_texticon §Y[?air_winter_controlled_evacuation_stability_cost|%1]§!"
air_winter_controlled_evacuation_cost_blocked: "£GFX_train_texticon §R[?air_winter_controlled_evacuation_train_cost|0]§!  £convoy_texticon §R[?air_winter_controlled_evacuation_convoy_cost|0]§!  £manpower_texticon §R[?air_winter_controlled_evacuation_manpower_cost|0]§!  £stability_texticon §R[?air_winter_controlled_evacuation_stability_cost|%1]§!"
air_winter_controlled_evacuation_cost_tooltip: "The current quote costs £GFX_train_texticon §Y[?air_winter_controlled_evacuation_train_cost|0]§!, £convoy_texticon §Y[?air_winter_controlled_evacuation_convoy_cost|0]§!, £manpower_texticon §Y[?air_winter_controlled_evacuation_manpower_cost|0]§! and £stability_texticon §Y[?air_winter_controlled_evacuation_stability_cost|%1]§!."
air_winter_controlled_evacuation_requirements_tt: "Select the priority state in Air Winter phase 4 with a completed evacuation ledger and at least [?constant:air_winter_response_result.minimum_source_population_k|0]K population. A different eligible reception state must be designated. The resulting Refugee Pressure there cannot exceed [?constant:air_winter_response_evacuation.receiver_pressure_ceiling|0]. No other emergency measure may be underway."
air_winter_controlled_evacuation_effect_tt: "Moves §Y[?air_winter_controlled_evacuation_population_transfer_people|0]§! people from [FROM.GetName] to [?air_winter_evacuation_cache_receiver_state.GetName]. Source Refugee Pressure falls by §G[?air_winter_controlled_evacuation_source_pressure_relief|1]§!. Receiver Refugee Pressure rises by §R[?air_winter_controlled_evacuation_receiver_pressure_gain|1]§! to [?air_winter_controlled_evacuation_receiver_pressure_after|1]. The paid quote remains fixed through the [?constant:air_winter_response_timing.controlled_evacuation_days|0] day movement."

air_winter_state_medical_triage: "Impose State Medical Triage"
air_winter_state_medical_triage_desc: "Concentrate medicine and staff on patients who can survive exposure, cold and respiratory collapse."
air_winter_state_medical_triage_cost: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.triage_support|0]§!  £manpower_texticon §Y[?constant:air_winter_response_cost.triage_manpower|0]§!  £command_power §Y[?constant:air_winter_response_cost.triage_command|0]§!"
air_winter_state_medical_triage_cost_blocked: "£support_equipment_text_icon §R[?constant:air_winter_response_cost.triage_support|0]§!  £manpower_texticon §R[?constant:air_winter_response_cost.triage_manpower|0]§!  £command_power §R[?constant:air_winter_response_cost.triage_command|0]§!"
air_winter_state_medical_triage_cost_tooltip: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.triage_support|0]§!  £manpower_texticon §Y[?constant:air_winter_response_cost.triage_manpower|0]§!  £command_power §Y[?constant:air_winter_response_cost.triage_command|0]§!"
air_winter_state_medical_triage_requirements_tt: "Select an owned and controlled city state in Air Winter phase 4. State medical triage must not have been imposed there before. No other emergency measure may be underway and its response teams must be ready."
air_winter_state_medical_triage_effect_tt: "[FROM.GetName] loses [?constant:air_winter_response_result.triage_disease_reduction|0] Disease Pressure and gains [?constant:air_winter_response_result.triage_recovery_gain|0] Recovery, while losing [?constant:air_winter_response_result.triage_food_cost|0] Food Reserve. Its emergency teams cannot begin another measure for [?constant:air_winter_response_timing.severe_state_cooldown_months|0] months."

air_winter_hold_abandonment_vote: "Hold an Abandonment Vote"
air_winter_hold_abandonment_vote_desc: "Let the surviving authorities decide whether the state can still be held or must be written off."
air_winter_hold_abandonment_vote_cost: "£command_power §Y[?constant:air_winter_response_cost.abandonment_command|0]§!  £stability_texticon §Y[?constant:air_winter_response_cost.abandonment_stability|%0]§!"
