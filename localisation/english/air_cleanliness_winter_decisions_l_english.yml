air_winter_seal_bunker_doors_cost_tooltip: "£support_equipment_text_icon §Y[?constant:air_winter_response_cost.bunker_support|0]§!  £infantry_equipment_text_icon §Y[?constant:air_winter_response_cost.bunker_infantry|0]§!  £stability_texticon §Y[?constant:air_winter_response_cost.bunker_stability|%0]§!"
air_winter_seal_bunker_doors_requirements_tt: "Select an owned and controlled state in Air Winter phase 5 with at least one fort. Its bunker doors must not have been sealed before. No other emergency measure may be underway and its response teams must be ready."
