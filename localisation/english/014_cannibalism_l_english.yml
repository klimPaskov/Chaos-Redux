cannibalism.gui.warlord_loyalty: "Integrated warlords: [?cannibalism_integrated_warlord_count|0]"
cannibalism.gui.warlord_loyalty.tt: "Submission, resistance, absorption, and character outcomes determine how much of the old warlord structure survives. Autonomous warlords: [?cannibalism_autonomous_warlord_count|0]."
