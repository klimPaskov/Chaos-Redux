cannibalism_commune_focus_tree: "Cannibal Commune"
cbl_first_table: "The First Table"
cbl_first_table_desc: "The commune stops pretending to be a district in rebellion and organizes itself as a state."
cbl_seal_the_origin_state: "Seal the Origin State"
cbl_seal_the_origin_state_desc: "Barricades, bunkers, and ration law bind the first seized territory into a defensible core."
cbl_night_larder_columns: "Night Larder Columns"
cbl_night_larder_columns_desc: "Small columns gather bodies, equipment, and recruits from the dark roads around the front."
cbl_black_kitchens: "Black Kitchens"
cbl_black_kitchens_desc: "Industry bends toward hidden kitchens, armed depots, and the accounting of hunger."
cbl_council_of_knives: "Council of Knives"
cbl_council_of_knives_desc: "The Table Council centralizes every ration mark, punishment order, and armed kitchen under one obedient command."
cbl_warlord_kitchen: "Warlord Kitchen"
cbl_warlord_kitchen_desc: "Field commanders are allowed to rule their kitchens like battle staffs, trading stability for rapid violence."
cbl_hannibal_discipline: "Hannibal Discipline"
cbl_hannibal_discipline_desc: "The commune reshapes itself for the unifier named in the courier letters."
cbl_captured_depot_inventory: "Captured Depot Inventory"
cbl_captured_depot_inventory_desc: "Search every seized depot, prison store, and abandoned quartermaster shed for weapons and usable lists."
cbl_field_kitchen_conversions: "Field Kitchen Conversions"
cbl_field_kitchen_conversions_desc: "Convert ordinary supply points into guarded workshops that can move with the commune."
cbl_prisoner_ledger_administration: "Prisoner Ledger Administration"
cbl_prisoner_ledger_administration_desc: "The commune writes its manpower, prisoners, and victims into one administrative book."
cbl_hunger_column_organization: "Hunger Column Organization"
cbl_hunger_column_organization_desc: "Raiders, guards, and scavenger detachments receive an order of march instead of merely following appetite."
cbl_commune_ration_codes: "Commune Ration Codes"
cbl_commune_ration_codes_desc: "The council writes a common ration code so every table knows who is protected and who is counted."
cbl_scavenger_party_mobility: "Scavenger Party Mobility"
cbl_scavenger_party_mobility_desc: "Small parties learn to move quickly through stripped towns and broken rail yards."
cbl_butcher_pack_shock_doctrine: "Butcher Pack Shock Doctrine"
cbl_butcher_pack_shock_doctrine_desc: "Assault packs turn controlled terror into the first minutes of a battle."
cbl_prison_processions: "Prison Processions"
cbl_prison_processions_desc: "Long guarded columns move prisoners, laborers, and terrified recruits through commune roads."
cbl_hannibal_cadres: "Hannibal Cadres"
cbl_hannibal_cadres_desc: "The strongest detachments are trained to answer the wider name when the signal arrives."
cbl_silent_anchorages: "Silent Anchorages"
cbl_silent_anchorages_desc: "Island communes fortify docks and anchorages so no shore party reaches them casually."
cbl_convoy_ambush_plans: "Convoy Ambush Plans"
cbl_convoy_ambush_plans_desc: "The commune studies evacuation lanes and ration ships as future feeding lines."
cbl_coastal_port_lists: "Coastal Port Lists"
cbl_coastal_port_lists_desc: "Every nearby harbor, coal pier, and prisoner embarkation point receives a ration mark."
cbl_prison_road_route: "Prison Road Route"
cbl_prison_road_route_desc: "Inland communes turn prison roads and labor marches into their supply projection."
cbl_rail_corridor_hunts: "Rail Corridor Hunts"
cbl_rail_corridor_hunts_desc: "Rail lines become maps for raids, claims, and quick withdrawals."
cbl_mainland_hunting_corridors: "Mainland Hunting Corridors"
cbl_mainland_hunting_corridors_desc: "The commune links ports, rails, and border states into repeatable hunting corridors."
cbl_no_public_feasts: "No Public Feasts"
cbl_no_public_feasts_desc: "The commune restrains spectacle in favor of survival, secrecy, and discipline."
cbl_hunting_ground_doctrine: "Hunting Ground Doctrine"
cbl_hunting_ground_doctrine_desc: "The commune treats occupied territory as a managed larder and war as the only honest harvest."
cbl_restrained_consumption_registers: "Restrained Consumption Registers"
cbl_restrained_consumption_registers_desc: "The restrained route records and limits its own appetite so the army can keep marching."
cbl_runaway_consumption_accounts: "Runaway Consumption Accounts"
cbl_runaway_consumption_accounts_desc: "The hunting-ground route writes every excess into future claims rather than discipline."
cbl_couriers_between_tables: "Couriers Between Tables"
cbl_couriers_between_tables_desc: "The commune establishes couriers, symbols, and transfer marks with other cells."
cbl_cannibal_pact_compact: "Cannibal Pact Compact"
cbl_cannibal_pact_compact_desc: "The commune accepts a compact with other tables and opens regular courier missions."
cbl_refuse_the_wider_pact: "Refuse the Wider Pact"
cbl_refuse_the_wider_pact_desc: "The commune refuses any patron who would turn its table into a subordinate chair."
cbl_listen_for_hannibal: "Listen for Hannibal"
cbl_listen_for_hannibal_desc: "The commune follows the name appearing in courier letters and waits for a unifier."
cbl_last_table_preparations: "Last Table Preparations"
cbl_last_table_preparations_desc: "The solitary route stocks trains, convoys, fuel, and district lists for one final claim."
cbl_map_the_final_larder: "Map the Final Larder"
cbl_map_the_final_larder_desc: "Unlock the timed Last Table map mission. The commune must control at least four states, keep coast or rail projection, and complete at least one hunting-ground project before it can proclaim anything larger."
cbl_proclaim_the_last_table: "Proclaim the Last Table"
cbl_proclaim_the_last_table_desc: "With the map validated, the commune claims authority over every surviving table that will not kneel to Hannibal."
cbl_controlled_region_projects: "Controlled Region Projects"
cbl_controlled_region_projects_desc: "The Last Table begins repeatable regional projects that consume territory, manpower, supplies, and discipline."
cbl_empty_larder_war_discipline: "Empty Larder War Discipline"
cbl_empty_larder_war_discipline_desc: "After a major enemy has capitulated, the restrained route turns appetite into hard military discipline instead of public terror."
cbl_world_as_larder_gate: "The World as Larder"
cbl_world_as_larder_gate_desc: "Only maximum chaos and Hannibal or an accepted unifier can open the terminal route."

chaosx_super_event.141.t: "The Silent Islands"
chaosx_super_event.141.q: "\"Hell is empty, and all the devils are here.\""
chaosx_super_event.141.a: "Suspend all shore leave."
chaosx_super_event.141.d: "The first island stopped answering except by code. Then another garrison went silent, and then a barricaded commune repeated the same ration marks inland.\n\nThe outbreak has learned to hold territory. Every harbor, camp, and prison transfer now carries the risk of a table that does not intend to rejoin the living world."
chaosx_super_event.142.t: "Hannibal Ad Portas"
chaosx_super_event.142.q: "\"...cannot be satisfied, but gathereth unto him all nations, and heapeth unto him all people.\""
chaosx_super_event.142.a: "The orders were real."
chaosx_super_event.142.d: "The couriers were not improvising. The same name has crossed kitchens, islands, communes, and secret military files: Hannibal at the gates.\n\nWhether the unifier is a person, a doctrine, or a codebook, the global table now has something to answer."
chaosx_super_event.143.t: "The World as Larder"
chaosx_super_event.143.q: "\"There are three things that are never satisfied, yea, four things say not, It is enough:\""
chaosx_super_event.143.a: "Nothing is enough."
chaosx_super_event.143.d: "Chaos has opened the road and the tables have found their master. The network speaks of ports, capitals, refugee columns, and continents as ration categories.\n\nCivilization has heard worse threats. It has rarely heard one so practical."
chaosx_super_event.144.t: "The Burned Ledgers"
chaosx_super_event.144.q: "\"Only take heed to thyself, and keep thy soul diligently, lest thou forget the things which thine eyes have seen...\""
chaosx_super_event.144.a: "Seal the archives."
chaosx_super_event.144.d: "The last kitchens are cold. The last ledgers are burned or locked away, and every country that survived its own outbreak knows how close the habit came to becoming law.\n\nNo victory parade follows this work. Only inventories, graves, and orders never to let the lists be written again."

chaosx.events_log.evolution.type.cannibalism: "Cannibalism"
chaosx.events_log.window.evolution_details.cannibalism.title.stage_1: "Ritual Hunger"
chaosx.events_log.window.evolution_details.cannibalism.title.stage_2: "Silent Islands"
chaosx.events_log.window.evolution_details.cannibalism.title.stage_3: "The Table Without Borders"
chaosx.events_log.window.evolution_details.cannibalism.title.event_detail: "Frontline Hunger"
chaosx.events_log.window.evolution_details.cannibalism.body.stage_1: "The outbreak becomes a ritual ideology inside armies, depots, prisons, and field hospitals. It is still fought country by country, but containment now requires breaking doctrine as well as supply collapse."
chaosx.events_log.window.evolution_details.cannibalism.body.stage_2: "Organized cults learn to hold isolated territory. Silent islands, barricaded communes, and possible Cannibal Commune declarations become the central risk."
chaosx.events_log.window.evolution_details.cannibalism.body.stage_3: "The tables begin operating as a global network. Hannibal or another accepted unifier can turn the network into a world-end route once chaos is high enough."
chaosx.events_log.window.evolution_details.cannibalism.body.event_detail: "The first ledgers point to field kitchens, prisoner transfers, hospital trains, and ration offices hiding the same practice. The initial outbreak can still be contained locally, but every spread country must keep supply, discipline, territory, and transport intact long enough to stop hunger from becoming doctrine."
chaosx.events_log.window.event_details.cannibalism: "A frontline cannibalism outbreak begins where war has broken discipline and supply. Early containment can defeat it locally, but delay lets ritual cells, silent garrisons, communes, and courier networks turn the practice into a wider threat. At the highest chaos, Hannibal or another accepted unifier can gather the tables into a terminal crisis."

