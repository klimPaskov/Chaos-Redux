chaosx.nr14.2.t: "The Missing Burial Detail"
chaosx.nr14.2.d: "A recovery platoon assigned near [cannibalism_initial_state.GetName] has failed to return. The search party found opened graves, ration tins filled after the livestock convoy stopped, and bodies cut with field knives. The dead were [ROOT.GetAdjective], as were the men who handled them. Frightened soldiers now refuse transfer into the position. Surviving officers insist that the ledger discrepancy is a clerical matter."
chaosx.nr14.2.a: "Declare a ration and discipline emergency."
chaosx.nr14.2.b: "Seal the reports and isolate the formation."
chaosx.nr14.2.c: "Turn their appetite against the enemy."
cannibalism_open_emergency_effect_tt: "The government acknowledges the crisis. Field Hunger falls and Command Integrity rises, while an emergency logistics burden and open containment program begin."
cannibalism_concealment_effect_tt: "The evidence is sealed. Immediate panic is limited, but Command Integrity falls and surviving cells gain room to hide inside transfers and altered records."
cannibalism_exploitation_effect_tt: "Compromised soldiers enter a state terror program. Command Integrity collapses, cells gain official access, and the clean containment route is abandoned."

chaosx.nr14.20.t: "The Oaths Beneath the Ration Line"
chaosx.nr14.20.d: "Investigators have recovered the tags of the missing burial party from a locked ration store. The same cuts, pledges, and promotion marks now appear in formations that never served together. The evidence shows a doctrine of membership passed from veteran to replacement and guarded by officers who decide who may eat."
chaosx.nr14.20.a: "Remove the officers and open the ranks to prosecutors."
chaosx.nr14.20.b: "Map every oath before the arrests begin."
chaosx.nr14.20.c: "A discipline this fierce can serve the state."
cannibalism_ritual_purge_effect_tt: "Organizer officers are removed under recorded military law. Command Integrity rises. Cult Cohesion and Cell Strength fall, and public prosecution decisions open."
cannibalism_ritual_investigation_effect_tt: "Protected witnesses and infiltrators map the oath groups. Command Integrity rises modestly, Cult Cohesion falls, and infiltration decisions open."
cannibalism_ritual_appropriation_effect_tt: "The oath groups receive institutional protection. Command Integrity falls, Cult Cohesion rises, terror operations expand, and the clean route is disqualified."

chaosx.nr14.21.t: "The Same Ledger in Three Ports"
chaosx.nr14.21.d: "Intercepted manifests from three ports record the same false ration weights, prisoner categories, and transfer intervals. A kitchen officer abroad carried a map copied from one seized in [ROOT.GetNameDef]. Remote garrisons answer at matching hours, yet no captured courier can identify a common headquarters. Whether these cells imitate one another or exchange orders through hidden routes, they now operate as a network."
chaosx.nr14.21.a: "Publish the files and assemble a joint command."
chaosx.nr14.21.b: "Seal the routes and break each link in isolation."
chaosx.nr14.21.c: "Send our orders through their channels."
cannibalism_network_disclosure_effect_tt: "Foreign governments receive the evidence. Command Integrity rises, Network Alignment falls, and international tracking and joint suppression open."
cannibalism_network_cordon_effect_tt: "Transport and convoy routes enter a targeted cordon. Cell Strength and Network Alignment fall. Route interdiction and convoy searches open."
cannibalism_network_exploitation_effect_tt: "The state attempts to direct the hidden routes. Command Integrity falls, Network Alignment rises, and network manipulation opens at the cost of clean containment."

cannibalism_containment_category: "The Missing Ranks"
cannibalism_containment_category_desc: "[This.GetCannibalismContainmentStatus]"
cannibalism_containment_status_baseline: "§RField Hunger§!: [?cannibalism_field_hunger|0] / [?constant:cannibalism_meter.max|0]\n§BCommand Integrity§!: [?cannibalism_command_integrity|0] / [?constant:cannibalism_meter.max|0]\n§YEvidence§!: [?cannibalism_evidence|0] / [?constant:cannibalism_decision_result.evidence_max|0]\n§WCompromised theater§!: [?cannibalism_primary_theater_state.GetName]"
cannibalism_containment_status_ritual: "§RField Hunger§!: [?cannibalism_field_hunger|0] / [?constant:cannibalism_meter.max|0]\n§BCommand Integrity§!: [?cannibalism_command_integrity|0] / [?constant:cannibalism_meter.max|0]\n§0Cult Cohesion§!: [?cannibalism_cult_cohesion|0] / [?constant:cannibalism_meter.max|0]\n§YEvidence§!: [?cannibalism_evidence|0] / [?constant:cannibalism_decision_result.evidence_max|0]\n§WCompromised theater§!: [?cannibalism_primary_theater_state.GetName]"
cannibalism_containment_status_network: "§RField Hunger§!: [?cannibalism_field_hunger|0] / [?constant:cannibalism_meter.max|0]\n§BCommand Integrity§!: [?cannibalism_command_integrity|0] / [?constant:cannibalism_meter.max|0]\n§0Cult Cohesion§!: [?cannibalism_cult_cohesion|0] / [?constant:cannibalism_meter.max|0]\n§RNetwork Reach§!: [?global.cannibalism_network_reach|0] / [?constant:cannibalism_network.max|0]\n§YEvidence§!: [?cannibalism_evidence|0] / [?constant:cannibalism_decision_result.evidence_max|0]\n§WCompromised theater§!: [?cannibalism_primary_theater_state.GetName]"

cannibalism_emergency_ration_audit: "Audit the Emergency Ration Chain"
cannibalism_emergency_ration_audit_desc: "Compare deliveries, kitchen weights, burial records, livestock manifests, and officer signatures serving [?cannibalism_primary_theater_state.GetName]. Concealment and broken command make the records easier to destroy."
cannibalism_ration_audit_requirements_tt: "Requires assigned personnel, support equipment, command capacity, and the appropriate train or convoy transport for the compromised theater."
cannibalism_ration_audit_cost_text: "[This.GetCannibalismRationAuditCost]"
cannibalism_ration_audit_cost_land: "£command_power §Y[?cannibalism_ration_audit_command_cost|0]§!  £manpower_texticon §Y[?cannibalism_ration_audit_manpower_cost|0]§!  £support_equipment_text_icon §Y[?cannibalism_ration_audit_support_cost|0]§!  £GFX_train_texticon §Y[?cannibalism_ration_audit_train_cost|0]§!"
cannibalism_ration_audit_cost_island: "£command_power §Y[?cannibalism_ration_audit_command_cost|0]§!  £manpower_texticon §Y[?cannibalism_ration_audit_manpower_cost|0]§!  £support_equipment_text_icon §Y[?cannibalism_ration_audit_support_cost|0]§!  £convoy_texticon §Y[?cannibalism_ration_audit_convoy_cost|0]§!"
cannibalism_ration_audit_effect_tt: "The audit can recover evidence and reduce Field Hunger, or lose records and strengthen the hidden cell. Open emergency policy improves the result, while concealment weakens it."

cannibalism_restore_supply_corridor: "Restore the Compromised Supply Corridor"
cannibalism_restore_supply_corridor_desc: "Commit transport and field administration to [?cannibalism_primary_theater_state.GetName]. The route must remain controlled, equipped, and occupied by a replacement formation for a duration determined by isolation, infrastructure, hunger, and policy."
cannibalism_restore_supply_corridor_requirements_tt: "Requires personnel, support equipment, trucks, command capacity, and trains or convoys appropriate to the theater."
cannibalism_restore_supply_corridor_cost_text: "[This.GetCannibalismLogisticsCost]"
cannibalism_logistics_cost_land: "£command_power §Y[?cannibalism_logistics_command_cost|0]§!  £manpower_texticon §Y[?cannibalism_logistics_manpower_cost|0]§!  £support_equipment_text_icon §Y[?cannibalism_logistics_support_cost|0]§!  £GFX_motorized_equipment_text_icon §Y[?cannibalism_logistics_truck_cost|0]§!  £GFX_train_texticon §Y[?cannibalism_logistics_train_cost|0]§!"
cannibalism_logistics_cost_island: "£command_power §Y[?cannibalism_logistics_command_cost|0]§!  £manpower_texticon §Y[?cannibalism_logistics_manpower_cost|0]§!  £support_equipment_text_icon §Y[?cannibalism_logistics_support_cost|0]§!  £GFX_motorized_equipment_text_icon §Y[?cannibalism_logistics_truck_cost|0]§!  £convoy_texticon §Y[?cannibalism_logistics_convoy_cost|0]§!"
cannibalism_restore_supply_corridor_effect_tt: "Pays the full mobilization cost immediately and begins a maintained logistics objective. Active famine, disease, isolation, and disaster pressure lengthen the operation. Civilian factories and military supply remain burdened until it resolves."
cannibalism_restore_supply_corridor_mission: "Hold the Ration Corridor to [?cannibalism_primary_theater_state.GetName]"
cannibalism_restore_supply_corridor_mission_desc: "Keep control of the theater, retain its train or convoy reserve, maintain trucks, and station a formation there. Any failed pulse resets held progress to zero. A timed-out operation that held the route for part of the mission still secures limited relief."
cannibalism_supply_corridor_objective_tt: "Maintain the complete corridor for [?cannibalism_logistics_required_hold_days|0] days. Current uninterrupted progress: [?cannibalism_logistics_hold_days|0] days."
cannibalism_supply_corridor_success_tt: "Field Hunger falls sharply, Command Integrity rises, and the active state cell loses strength. In a theater under famine or disaster pressure, the same convoys and engineers also advance relief and recovery."
cannibalism_supply_corridor_partial_tt: "The route carried limited relief before the deadline. Field Hunger falls modestly, Command Integrity improves, and the theater's cell loses some access to diverted supplies."
cannibalism_supply_corridor_failure_tt: "Field Hunger and Cell Strength rise, and the theater's cell gains new access to diverted supplies."

cannibalism_rotate_compromised_formations: "Rotate the Compromised Formations"
cannibalism_rotate_compromised_formations_desc: "Withdraw the suspect chain from the fighting, screen replacements, and keep enough cleared divisions in [?cannibalism_primary_theater_state.GetName] while the transfer is examined."
cannibalism_rotate_formations_requirements_tt: "Requires replacement manpower, infantry and support equipment, Army Experience, and continued control of the theater."
cannibalism_rotate_formations_cost_text: "£army_experience §Y[?cannibalism_rotation_army_experience_cost|0]§!  £manpower_texticon §Y[?cannibalism_rotation_manpower_cost|0]§!  £infantry_equipment_text_icon §Y[?cannibalism_rotation_infantry_cost|0]§!  £support_equipment_text_icon §Y[?cannibalism_rotation_support_cost|0]§!"
cannibalism_rotate_formations_effect_tt: "Pays the replacement cost immediately and begins a maintained unit objective. Screening temporarily slows training, reinforcement, and organization."
cannibalism_rotate_compromised_formations_mission: "Screen the Replacement Formations"
cannibalism_rotate_compromised_formations_mission_desc: "Keep the required cleared divisions in [?cannibalism_primary_theater_state.GetName] with a support-equipment reserve. Losing control or withdrawing the replacements resets progress. A partial screen at the deadline still removes some compromised personnel."
cannibalism_rotation_objective_tt: "Maintain the formation screen for [?cannibalism_rotation_required_hold_days|0] days. Current uninterrupted progress: [?cannibalism_rotation_hold_days|0] days."
cannibalism_rotation_success_tt: "Command Integrity rises and the cell loses transferred personnel and officer cover."
cannibalism_rotation_partial_tt: "Some formations complete screening before the deadline. Command Integrity improves and the cell loses part of its personnel network."
cannibalism_rotation_failure_tt: "Deserters vanish during transit. Command Integrity falls and Cell Strength rises."

cannibalism_forensic_recovery_teams: "Deploy Forensic Recovery Teams"
cannibalism_forensic_recovery_teams_desc: "Secure bodies, utensils, tags, and ration sites before the evidence is moved. Partial recovery is common, and concealment makes a compromised team more likely."
cannibalism_forensics_requirements_tt: "Requires assigned personnel, support equipment, and command capacity."
cannibalism_forensics_cost_text: "£command_power §Y[?cannibalism_forensics_command_cost|0]§!  £manpower_texticon §Y[?cannibalism_forensics_manpower_cost|0]§!  £support_equipment_text_icon §Y[?cannibalism_forensics_support_cost|0]§!"
cannibalism_forensics_effect_tt: "Produces a full, partial, or failed recovery. Evidence and Cell Strength change according to the result. Investigators can also expose feeding programs tied to active detention sites."
cannibalism_search_missing_burial_party: "Search for the Missing Burial Party"
cannibalism_search_missing_burial_party_desc: "Search this active cell state for the missing recovery detail, its records, and the site it was sent to inspect."
cannibalism_search_burial_party_effect_tt: "A full search recovers substantial evidence and suppresses the state cell. Partial traces give a smaller gain, while an ambush strengthens it. Searches at compromised detention sites can expose the feeding program."

cannibalism_protect_burial_and_medical_details: "Protect Burial and Medical Details"
cannibalism_protect_burial_and_medical_details_desc: "Assign guards, identification staff, and sealed casualty records to the wounded and the dead. This denies isolated victims without treating frightened soldiers as organizers."
cannibalism_burial_protection_requirements_tt: "Requires assigned personnel, support equipment, and command capacity."
cannibalism_burial_protection_cost_text: "£command_power §Y[?cannibalism_burial_command_cost|0]§!  £manpower_texticon §Y[?cannibalism_burial_manpower_cost|0]§!  £support_equipment_text_icon §Y[?cannibalism_burial_support_cost|0]§!"
cannibalism_burial_protection_effect_tt: "Field Hunger and Cell Strength fall as Command Integrity and Evidence rise. Prisoners at compromised detention sites enter protected custody, and medical teams can also relieve an active disaster disease chain. Reliable casualty records become available to later prosecutions."

cannibalism_public_court_martial: "Convene a Public Court-Martial"
cannibalism_public_court_martial_desc: "Use documented evidence to remove protected organizers under recorded military law. An open proceeding restores discipline without scattering the accused through a quiet disbandment."
cannibalism_trial_requirements_tt: "Requires at least [?cannibalism_trial_command_cost|0] Command Power and a substantial evidence file."
cannibalism_trial_cost_text: "£command_power §Y[?cannibalism_trial_command_cost|0]§!  §YEvidence file§!"
cannibalism_trial_effect_tt: "Consumes part of the evidence file, raises Command Integrity, and reduces Cell Strength and Cult Cohesion."
cannibalism_conditional_amnesty: "Offer a Conditional Amnesty"
cannibalism_conditional_amnesty_desc: "Give coerced followers a guarded surrender route and testimony agreement while organizers remain subject to prosecution. Terror exploitation makes this impossible."
cannibalism_amnesty_requirements_tt: "Requires evidence of organized ritual ranks, personnel, support equipment, and no active state terror program."
cannibalism_amnesty_cost_text: "£manpower_texticon §Y[?cannibalism_amnesty_manpower_cost|0]§!  £support_equipment_text_icon §Y[?cannibalism_amnesty_support_cost|0]§!  §YEvidence file§!"
cannibalism_amnesty_effect_tt: "Sharply reduces Cell Strength and Cult Cohesion, raises Command Integrity, and consumes part of the evidence file."

cannibalism_seal_transfer_records: "Seal the Transfer Records"
cannibalism_seal_transfer_records_desc: "Remove the compromised formation from public rolls and reroute witnesses through a closed military channel. The scandal quiets briefly while the surviving cell gains another protected route."
cannibalism_concealment_action_requirements_tt: "Requires trains and command capacity under the concealment policy."
cannibalism_concealment_action_cost_text: "£command_power §Y[?cannibalism_concealment_command_cost|0]§!  £GFX_train_texticon §Y[?cannibalism_concealment_train_cost|0]§!"
cannibalism_concealment_action_effect_tt: "Stability rises briefly, but Command Integrity falls, Cell Strength rises, and global chaos increases."
cannibalism_authorize_terror_battalion: "Authorize a Terror Battalion"
cannibalism_authorize_terror_battalion_desc: "Concentrate compromised soldiers for a short, violent offensive. Their battlefield effect is real, along with their appetite, independence, access to prisoners, and contempt for the officer chain."
cannibalism_terror_battalion_requirements_tt: "Requires personnel, infantry and support equipment, and command capacity on an exploitation route."
cannibalism_terror_battalion_cost_text: "£command_power §Y[?cannibalism_terror_command_cost|0]§!  £manpower_texticon §Y[?cannibalism_terror_manpower_cost|0]§!  £infantry_equipment_text_icon §Y[?cannibalism_terror_infantry_cost|0]§!  £support_equipment_text_icon §Y[?cannibalism_terror_support_cost|0]§!"
cannibalism_terror_battalion_effect_tt: "For [?constant:cannibalism_decision_timing.terror_battalion_days|0] days the army gains attack, breakthrough, and speed. Command Integrity collapses, Cell Strength and Cult Cohesion rise, supply demand worsens, and global chaos increases. Active cells inside prison and detention systems are connected to the program and leave discoverable evidence."
cannibalism_feed_selected_prisoners: "Feed Selected Prisoners"
cannibalism_feed_selected_prisoners_desc: "A compromised detention command has offered a fixed group of prisoners to the field network. The order will permanently remove real population from the state and bind the prison administration to the cell."
cannibalism_feed_selected_prisoners_requirements_tt: "Requires an exploitable active cell in a controlled prison or detention state with at least [?constant:cannibalism_integration.prisoner_feeding_minimum_population_k|0]K remaining population."
cannibalism_feed_selected_prisoners_cost_text: "£command_power §Y[?cannibalism_prisoner_feeding_command_cost|0]§!  £support_equipment_text_icon §Y[?cannibalism_prisoner_feeding_support_cost|0]§!  £manpower_texticon §R[?cannibalism_prisoner_feeding_population_cost|0]§! state population"
cannibalism_feed_selected_prisoners_effect_tt: "Consumes up to [?constant:cannibalism_integration.prisoner_feeding_people|0] people from the selected state through the Deaths ledger. Civilian prisoners and captured military personnel are recorded separately. Larder Stores, Cell Strength, Cult Cohesion, Evidence, and global chaos rise."

cannibalism_frontline_crisis: "Breakdown in the Ranks"
cannibalism_frontline_crisis_desc: "Hunger, disappearances, falsified rolls, and protected predation are degrading military supply, organization, planning, political authority, and recruitment according to the live crisis meters."
cannibalism_emergency_logistics_burden: "Emergency Ration and Discipline Command"
cannibalism_emergency_logistics_burden_desc: "Factories, trucks, stores, and supply officers have been diverted to keep one compromised theater fed and recorded."
cannibalism_formation_screening_burden: "Formation Screening and Rotation"
cannibalism_formation_screening_burden_desc: "Replacement units are being screened away from the front, slowing training, reinforcement, and organization."
cannibalism_terror_battalion_deployed: "State Terror Battalion"
cannibalism_terror_battalion_deployed_desc: "A compromised formation has been given prisoners, transport, and operational freedom. It attacks with exceptional violence while consuming supply and the state's remaining discipline."
cannibalism_suspected_predation_state: "Unaccounted Dead"
cannibalism_suspected_predation_state_desc: "Casualty records, burial sites, and ration deliveries no longer agree. Local supply and production suffer while investigators establish the scale of the crime."
cannibalism_compromised_garrison_state: "Compromised Garrison"
cannibalism_compromised_garrison_state_desc: "Officers and soldiers inside the garrison are protecting organized predation and obstructing ordinary control."
cannibalism_hunting_ground_state: "Predation Zone"
cannibalism_hunting_ground_state_desc: "Armed cells choose victims, strip settlements, and use military access to evade relief and investigation."
cannibalism_feeding_state: "Population Consumption"
cannibalism_feeding_state_desc: "The local network is systematically consuming inhabitants and converting the loss into stores and armed strength."
cannibalism_silent_larder_state: "Silent Larder"
cannibalism_silent_larder_state_desc: "Administration and settlement life have collapsed behind falsified reports. The remaining population is being consumed through an organized territorial system."
cannibalism_liberated_emergency_state: "Liberated Feeding State"
cannibalism_liberated_emergency_state_desc: "Liberation has ended organized consumption, but food, security, records, and family tracing remain in emergency condition."
cannibalism_identification_recovery_state: "Identification and Burial Emergency"
cannibalism_identification_recovery_state_desc: "Recovery teams are matching remains, records, and surviving families while maintaining protected burial work."
cannibalism_institutional_recovery_state: "Institutional Recovery"
cannibalism_institutional_recovery_state_desc: "Courts, supply offices, local administration, and protected services are being rebuilt under continuing scrutiny."
cannibalism_long_trauma_state: "Long Civilian Trauma"
cannibalism_long_trauma_state_desc: "Organized predation has ended, but population loss, mistrust, displacement, and missing-person cases will shape the state for years."

chaosx.events_log.window.event_details.cannibalism.pre_reveal: "Burial parties vanish from an army at war. Ration books are quietly changed, bodies are cut apart, and frightened soldiers whisper that officers are protecting the people responsible.\n\nThe army must feed its units, protect witnesses, and hunt organized killers without turning the whole front into a panic. Covering up the crimes keeps order briefly and gives the predators room to recruit."
chaosx.events_log.window.event_details.cannibalism.revealed: "What began in hungry armies has spread through ritual cells, prison gangs, communes, islands, and armed host states. Hannibal Lecter now stands at the center of the network.\n\nFeeding territories, couriers, and regional armies follow one campaign. Surviving governments must free consumed districts, cut the routes between them, and choose which local resistance leaders can be trusted."
