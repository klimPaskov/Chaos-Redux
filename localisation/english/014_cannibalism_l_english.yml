ZZZ_wendigo_join_the_larder_routes_bonus: "Joined Larder Industry"
ZZZ_wendigo_mark_the_irreversible_road_bonus: "Anchor Support Engineering"
ZZZ_wendigo_hunt_every_remaining_capital_bonus: "Terminal Hunt Doctrine"
cannibalism_unified_command_burden: "A World Host Assembles"
cannibalism_unified_command_burden_desc: "Hannibal has inherited armies, feeding states, islands, couriers, and mutually suspicious warlords. Their first unified offensives are formidable, but normal muster rolls remain sealed. Every additional formation must be paid through population, equipment, and Larder contracts while distant stores strain the new command."
cannibalism_reveal_world_tension: "Hannibal Lecter Reveals the Last Table"
cannibalism_wendigo_reveal_world_tension: "Hannibal Lecter Reveals the Winter Host"

