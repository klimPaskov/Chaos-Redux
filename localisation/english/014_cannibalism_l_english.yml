cannibalism_warlord_name_unknown: "Rafe Kestrel"
cannibalism_warlord_map_name_island: "The [?cannibalism_warlord_origin_state.GetName] Host"
cannibalism_warlord_map_name_siege: "The [?cannibalism_warlord_origin_state.GetName] Commune"
cannibalism_warlord_map_name_march: "The [?cannibalism_warlord_origin_state.GetName] March"
cannibalism_warlord_map_name_dormant: "Dormant Host"
cannibalism_warlord_map_adjective: "[?cannibalism_warlord_origin_state.GetName]"
cannibalism_warlord_map_adjective_dormant: "Dormant"
cannibalism_warlord_island_reaver: "Island Reaver"
cannibalism_warlord_island_reaver_desc: "He learned command through concealed anchorages, convoy ambushes, and sudden landings across narrow water."
cannibalism_warlord_siege_butcher: "Siege Butcher"
cannibalism_warlord_siege_butcher_desc: "He turns barricades, tunnels, ruined workshops, and relief routes into one defended killing ground."
cannibalism_warlord_march_predator: "March Predator"
cannibalism_warlord_march_predator_desc: "He keeps the Host moving between depots and broken fronts before hunger or encirclement can halt it."
chaosx.nr14.30.t: "A Host Breaks the Line"
chaosx.nr14.30.d: "Reports from the lost districts no longer describe scattered murders or an undisciplined mutiny. [cannibalism_warlord_new_country.GetName] has seized depots, records, and defensible ground under a single field command. Its patrols distribute captured stores according to rank, its guards have closed the roads behind them, and its detachments are already moving against the authorities that once held the area. The officers who escaped insist that this is a country in everything but law. Ordinary relief columns will be treated as supply."
chaosx.nr14.30.a: "Hold the lawful line."
chaosx.nr14.30.b: "Take command of the Host."
cannibalism_warlord_emergence_remain_tt: "We remain in control of our current country and prepare to destroy [cannibalism_warlord_new_country.GetName]."
cannibalism_warlord_emergence_switch_tt: "Player control transfers to [cannibalism_warlord_new_country.GetName]. Our former country continues under AI control."
cannibalism_closed_muster_rolls: "Closed Muster Rolls"
cannibalism_closed_muster_rolls_desc: "No ordinary levy may be raised from these districts. Every recruit must be accounted for through a controlled-state action, an equipment issue, and a recorded population loss. Every ordinary government recognizes the Host as a predatory military threat."
cannibalism_warlord_operating_order: "Host Operating Order"
cannibalism_warlord_operating_order_desc: "The Host's hierarchy, Larder policy, military discipline, and network posture have been reduced to one enforceable order. Its strengths and liabilities reflect every completed route without concealing the continuing population and supply costs."
cannibalism_archipelago_hunt: "Archipelago Hunt"
cannibalism_archipelago_hunt_desc: "Hidden anchorages, raider flotillas, and landing cadres connect the Host's islands into a single hunting ground that can survive blockade and strike across open water."
cannibalism_city_that_eats: "The City That Eats"
cannibalism_city_that_eats_desc: "Tunnels, workshops, barricades, hospitals, and prison yards have become one fortified feeding system. Relief columns must assault the city faster than the city can consume them."
cannibalism_moving_front: "The Moving Front"
cannibalism_moving_front_desc: "Depots and exhausted territory are abandoned before they can become burdens. The Host's capital, workshops, and assault columns advance together behind a screen of wrecked railways."
cannibalism_warlord_command_category: "Command the Host"
cannibalism_warlord_command_category_desc: "[This.GetCannibalismWarlordCommandStatus]"
cannibalism_warlord_command_status_local: "§OLarder Stores§!: [?cannibalism_larder|0] / [?constant:cannibalism_consumption.larder_max|0]\n§RFrenzy§!: [?cannibalism_frenzy|0] / [?constant:cannibalism_consumption.frenzy_max|0]\n§WConsumed Population§!: [?cannibalism_consumed_population_k|0]K\n\nClosed Muster Rolls forbid ordinary recruitment. Every formation below is attached to an eligible controlled state and accounted through a real population loss."
cannibalism_warlord_command_status_network: "§OLarder Stores§!: [?cannibalism_larder|0] / [?constant:cannibalism_consumption.larder_max|0]\n§RFrenzy§!: [?cannibalism_frenzy|0] / [?constant:cannibalism_consumption.frenzy_max|0]\n§YNetwork Alignment§!: [?cannibalism_network_alignment|0] / [?constant:cannibalism_consumption.alignment_max|0]\n§WConsumed Population§!: [?cannibalism_consumed_population_k|0]K\n\nClosed Muster Rolls forbid ordinary recruitment. Every formation below is attached to an eligible controlled state and accounted through a real population loss."

cannibalism_consume_controlled_state: "Consume a Controlled State"
cannibalism_consume_controlled_state_desc: "Open another feeding action in a controlled Host state. The usable population, prior consumption, contamination, and minimum surviving population determine the exact loss and Larder yield."
cannibalism_consume_controlled_state_cost_text: "§RReal state population§!"
cannibalism_consume_controlled_state_effect_tt: "Removes an exact civilian population amount through the Deaths ledger, records the state action, and adds Larder only from the population actually lost. Completed Larder and hierarchy focuses may change the bounded yield, Frenzy, Alignment, node strength, or exhaustion consequence. Unusable and recently consumed states remain blocked."

cannibalism_raise_scavenger_warband: "Raise a Scavenger Warband"
cannibalism_raise_scavenger_warband_desc: "Select one usable controlled state, record a recruitment loss, and organize a lightly armed irregular formation around equipment already held in our stockpiles."
cannibalism_raise_scavenger_warband_cost_text: "§O[?constant:cannibalism_unit_cost.scavenger_larder|0] Larder§! · §R[?constant:cannibalism_unit_cost.scavenger_population_k|0]K population§! · §Y[?constant:cannibalism_unit_cost.scavenger_infantry|0] infantry equipment held§!"
cannibalism_raise_scavenger_warband_effect_tt: "Consumes the listed state population through the Deaths ledger and opens one empty-cadre Scavenger Warband. The consumed population enters our manpower pool at the recruitment conversion rate, while the unit draws equipment from existing stores. Training focuses improve experience or state recovery. Workshop recovery is a separate bounded stockpile receipt."

cannibalism_raise_feast_cohort: "Organize a Feast Cohort"
cannibalism_raise_feast_cohort_desc: "Turn a larger initiation cohort into disciplined infantry. Its engineers and reconnaissance elements make it more capable than a warband and more expensive to replace."
cannibalism_raise_feast_cohort_cost_text: "§O[?constant:cannibalism_unit_cost.feast_larder|0] Larder§! · §R[?constant:cannibalism_unit_cost.feast_population_k|0]K population§! · §Y[?constant:cannibalism_unit_cost.feast_infantry|0] infantry / [?constant:cannibalism_unit_cost.feast_support|0] support equipment held§!"
cannibalism_raise_feast_cohort_effect_tt: "Consumes the listed population and opens one empty-cadre Feast Cohort. No unit manpower or equipment is created outside the recorded population conversion and existing stockpiles. Training focuses improve experience or state recovery. Workshop recovery is a separate bounded receipt."

cannibalism_raise_origin_specialist: "Raise an Origin Specialist"
cannibalism_raise_origin_specialist_desc: "Organize Island Reavers, Siege Eaters, or a March Predation Column according to this Host's formation origin."
cannibalism_raise_origin_specialist_cost_text: "§O[?constant:cannibalism_unit_cost.origin_specialist_larder|0] Larder§! · §R[?constant:cannibalism_unit_cost.origin_specialist_population_k|0]K population§! · origin equipment held"
cannibalism_raise_origin_specialist_effect_tt: "Consumes the listed population and opens one specialist formation within our Host origin's formation limit. Island, siege, and march formations require their captured transport or support stores. Training and column-doctrine focuses can improve starting experience."

cannibalism_raise_bone_guard: "Recruit the Bone Guard"
cannibalism_raise_bone_guard_desc: "Select the strongest initiates and guard them with the Host's best infantry, support, and artillery equipment. The small formation cap prevents the title from becoming a common levy."
cannibalism_raise_bone_guard_cost_text: "§O[?constant:cannibalism_unit_cost.bone_guard_larder|0] Larder§! · §R[?constant:cannibalism_unit_cost.bone_guard_population_k|0]K population§! · §Y[?constant:cannibalism_unit_cost.bone_guard_infantry|0] infantry / [?constant:cannibalism_unit_cost.bone_guard_support|0] support / [?constant:cannibalism_unit_cost.bone_guard_artillery|0] artillery held§!"
cannibalism_raise_bone_guard_effect_tt: "Consumes the listed population and opens one empty-cadre Bone Guard within the formation limit. Existing stockpiles must equip it. Personal-guard and leader-protection focuses improve its starting experience without bypassing the population, Larder, equipment, or formation-limit requirements."

cannibalism_raise_network_cadre: "Train a Network Cadre"
cannibalism_raise_network_cadre_desc: "A small organizer formation carries ranks, courier practice, and recruitment discipline between cells. It supports foreign seeding and coordination, and its cadres remain unsuited to direct battle."
cannibalism_raise_network_cadre_cost_text: "§O[?constant:cannibalism_unit_cost.network_cadre_larder|0] Larder§! · §R[?constant:cannibalism_unit_cost.network_cadre_population_k|0]K population§! · §Y[?constant:cannibalism_unit_cost.network_cadre_infantry|0] infantry / [?constant:cannibalism_unit_cost.network_cadre_support|0] support equipment held§!"
cannibalism_raise_network_cadre_effect_tt: "Consumes the listed population and opens one empty-cadre Network Cadre within the formation limit using existing stores. Completed training contracts improve experience or the selected state's recovery without making recruitment free."

cannibalism_emergency_reinforcement: "Emergency Reinforcement Draft"
cannibalism_emergency_reinforcement_desc: "Convert one controlled state's population into replacement manpower for depleted formations. The action creates no new division and requires a real equipment reserve for the replacements it feeds."
cannibalism_emergency_reinforcement_cost_text: "§O[?constant:cannibalism_unit_cost.emergency_reinforcement_larder|0] Larder§! · §R[?constant:cannibalism_unit_cost.emergency_reinforcement_population_k|0]K population§! · §Y[?constant:cannibalism_unit_cost.emergency_reinforcement_infantry|0] infantry / [?constant:cannibalism_unit_cost.emergency_reinforcement_support|0] support equipment held§!"
cannibalism_emergency_reinforcement_effect_tt: "Consumes the listed population through the Deaths ledger and converts only the configured share into the manpower pool. No unit or equipment is generated. The survival order also reduces Frenzy and restores Command Integrity after a successful payment."

cannibalism_network_alerts_category: "Foreign Route Alert"
cannibalism_network_alerts_category_desc: "A verified formation, transfer, convoy, occupation, or survivor route is carrying the same practices toward one of our controlled states. Screening must be organized before the route completes."
cannibalism_spread_source_inbound: "[?cannibalism_inbound_spread_source_country.GetNameDef]"
cannibalism_spread_source_external: "[?cannibalism_external_infection_source.GetNameDef]"
cannibalism_spread_route_retreat: "Retreat Transfer"
cannibalism_spread_route_prisoner_transfer: "Prison Transfer"
cannibalism_spread_route_convoy: "Convoy Route"
cannibalism_spread_route_volunteer_return: "Volunteer Return"
cannibalism_spread_route_occupation_turnover: "Occupation Turnover"
cannibalism_spread_route_deliberate_seed: "Deliberate Seeding"
cannibalism_spread_route_conquest: "Warlord Conquest"
cannibalism_spread_route_survivor: "Refugee or Survivor Route"
cannibalism_humane_route_screening: "Receive, Separate, and Screen"
cannibalism_humane_route_screening_desc: "Build a guarded reception system in the selected state: feed arrivals, separate formations and prisoners, protect witnesses, inspect manifests, and isolate organizers without treating every refugee or returning soldier as guilty."
cannibalism_humane_route_screening_cost_text: "§R[?constant:cannibalism_spread.humane_screening_manpower|0] manpower§! · §Y[?constant:cannibalism_spread.humane_screening_support|0] support equipment§! · §C[?constant:cannibalism_spread.humane_screening_command|0] command power§!"
cannibalism_humane_route_screening_effect_tt: "The selected inbound route will be contained on arrival. The state keeps a protected reception process, and the responding command gains integrity and prevents a new cell from forming."
cannibalism_seal_inbound_route: "Seal the Inbound Route"
cannibalism_seal_inbound_route_desc: "Close the selected transfer route, detain arrivals, seize manifests, and place the receiving district under military cordon. This uses fewer resources but damages lawful command and public trust."
cannibalism_seal_inbound_route_cost_text: "§R[?constant:cannibalism_spread.hard_screening_manpower|0] manpower§! · §Y[?constant:cannibalism_spread.hard_screening_support|0] support equipment§! · §C[?constant:cannibalism_spread.hard_screening_command|0] command power§!"
cannibalism_seal_inbound_route_effect_tt: "The selected inbound route will be contained on arrival. Stability and Command Integrity suffer from the coercive cordon."
cannibalism_foreign_route_unanswered_tt: "The route remains in transit. Its target state can still organize a response through the Foreign Route Alert decisions before arrival."

cannibalism_seed_foreign_formation: "Seed a Foreign Formation"
cannibalism_seed_foreign_formation_desc: "Send trained organizers through a real shared border, rail connection, or coastal route to the selected foreign state. The receiving command will receive warning and may spend resources to screen the route before it arrives."
cannibalism_seed_foreign_formation_cost_text: "§O[?constant:cannibalism_spread.seed_larder_cost|0] Larder§! · §Y[?constant:cannibalism_spread.seed_support_cost|0] support equipment§! · §C[?constant:cannibalism_spread.seed_command_cost|0] command power§! · §Y[?constant:cannibalism_spread.seed_convoy_cost|0] convoys§! on an overseas route"
cannibalism_seed_foreign_formation_effect_tt: "Sends one protected courier route toward the selected state. A successful arrival creates or strengthens a cell. Completed routing, manipulation, diverted-courier, and officer-corruption focuses apply their bounded Reach, Larder, or target-stability results when the route is actually paid into the ledger."

cannibalism_intensify_feeding_district: "Intensify the Feeding District"
cannibalism_intensify_feeding_district_desc: "Send guarded collection columns deeper into a controlled district whose population has not yet been exhausted. The order forces another accounted loss through the district and turns only the confirmed dead into Larder."
cannibalism_intensify_feeding_district_cost_text: "§C[?constant:cannibalism_warlord_decision.intensification_command_gate|0] command power§! · §Rreal state population§!"
cannibalism_intensify_feeding_district_effect_tt: "Attempts one additional silent-Larder consumption in the selected usable state. Command Power is spent immediately, and Larder is added only if the Deaths ledger records a real population loss. Feeding District, council, and Larder contracts then apply their state-specific consequences."

cannibalism_abandon_exhausted_state: "Abandon an Exhausted State"
cannibalism_abandon_exhausted_state_desc: "Withdraw the Host from a non-capital district that can no longer sustain consumption. The former government receives the territory and a prolonged recovery burden while our remaining states carry the retreat."
cannibalism_abandon_exhausted_state_cost_text: "§C[?constant:cannibalism_warlord_decision.abandon_command_gate|0] command power§!"
cannibalism_abandon_exhausted_state_effect_tt: "Retires the selected live node, removes our core and Host administration, returns the state to its recorded former owner, and begins the full liberated-state recovery sequence."

cannibalism_align_local_ranks: "Align the Local Ranks"
cannibalism_align_local_ranks_desc: "Rewrite the Host's ranks against the shared courier books. Local captains surrender part of their autonomy, Frenzy recedes, and the wider network gains a firmer claim over the command."
cannibalism_align_local_ranks_cost_text: "§O[?constant:cannibalism_warlord_decision.align_larder_cost|0] Larder§! · §C[?constant:cannibalism_warlord_decision.align_command_gate|0] command power§!"
cannibalism_align_local_ranks_effect_tt: "Raises Network Alignment by at least [?constant:cannibalism_warlord_decision.align_alignment_gain|0] and reduces Frenzy after paying the full Larder and command cost. Courier routes and submission preparation add their own Alignment only after payment succeeds."

cannibalism_synchronize_warlord_attack: "Synchronize a Warlord Attack"
cannibalism_synchronize_warlord_attack_desc: "Choose another active Host whose stores and command staff can support the same operation. Both warlords will pay for a [?constant:cannibalism_warlord_decision.synchronized_operation_days|0]-day attack window built around shared timings, relief routes, and reserve signals."
cannibalism_synchronize_warlord_attack_cost_text: "§O[?constant:cannibalism_warlord_decision.synchronized_larder_cost|0] Larder§! and §C[?constant:cannibalism_warlord_decision.synchronized_command_gate|0] command power§! from §Yeach Host§!"
cannibalism_synchronize_warlord_attack_effect_tt: "Both warlords pay the complete cost, gain Network Alignment, and receive Synchronized Warlord Attack for at least [?constant:cannibalism_warlord_decision.synchronized_operation_days|0] days. Courier, commune, road, and convergence contracts can extend the paid operation. A partner without the required stores cannot be selected."

cannibalism_island_ambush_convoys: "Ambush the Convoys"
cannibalism_island_ambush_convoys_desc: "Hidden anchorages and copied escort schedules allow small boats to strike relief shipping, withdraw under darkness, and feed the island's next operation from contested sea lanes."
cannibalism_island_ambush_convoys_cost_text: "§O[?constant:cannibalism_warlord_decision.island_operation_larder_cost|0] Larder§! · §C[?constant:cannibalism_warlord_decision.island_operation_command_gate|0] command power§!"
cannibalism_island_ambush_convoys_effect_tt: "Grants Island Convoy Ambush Operation for at least [?constant:cannibalism_warlord_decision.island_operation_days|0] days, improving convoy raiding and naval speed while increasing supply use. Completed Island, raid, road, escort, and supply contracts extend the operation or recover bounded stores."

cannibalism_siege_ambush_relief_column: "Ambush a Relief Column"
cannibalism_siege_ambush_relief_column_desc: "Tunnel exits, barricade watches, and captured relief schedules will draw an approaching column into streets already measured for crossfire and retreat."
cannibalism_siege_ambush_relief_column_cost_text: "§O[?constant:cannibalism_warlord_decision.siege_operation_larder_cost|0] Larder§! · §C[?constant:cannibalism_warlord_decision.siege_operation_command_gate|0] command power§!"
cannibalism_siege_ambush_relief_column_effect_tt: "Grants Siege Relief Ambush Operation for at least [?constant:cannibalism_warlord_decision.siege_operation_days|0] days, improving defense and entrenchment while increasing supply use. Tunnel, relief, city, raid, road, and supply contracts extend it or recover bounded stores."

cannibalism_march_raid_supply_depot: "Raid a Supply Depot"
cannibalism_march_raid_supply_depot_desc: "Send the fastest columns around the active front, strike a depot before its guard can assemble, and keep the Host moving before the enemy can close the road behind it."
cannibalism_march_raid_supply_depot_cost_text: "§O[?constant:cannibalism_warlord_decision.march_operation_larder_cost|0] Larder§! · §C[?constant:cannibalism_warlord_decision.march_operation_command_gate|0] command power§!"
cannibalism_march_raid_supply_depot_effect_tt: "Grants March Supply Raid Operation for at least [?constant:cannibalism_warlord_decision.march_operation_days|0] days, improving speed and planning while reducing out-of-supply losses at the cost of fuel. Depot, rail, corridor, road, escort, and endgame contracts extend it or recover bounded transport."


cannibalism_synchronized_warlord_attack: "Synchronized Warlord Attack"
cannibalism_synchronized_warlord_attack_desc: "Shared timings, reserve signals, and relief routes bind two Hosts to one offensive window."
cannibalism_island_convoy_ambush_operation: "Island Convoy Ambush Operation"
cannibalism_island_convoy_ambush_operation_desc: "Hidden boats and copied escort schedules turn the surrounding sea lanes into a temporary hunting ground."
cannibalism_siege_relief_ambush_operation: "Siege Relief Ambush Operation"
cannibalism_siege_relief_ambush_operation_desc: "Mapped streets and tunnel exits prepare the commune to break a relief column inside its own cordon."
cannibalism_march_supply_raid_operation: "March Supply Raid Operation"
cannibalism_march_supply_raid_operation_desc: "Mobile columns carry captured depot maps and a strict withdrawal schedule for the next advance."

chaosx.nr14.60.t: "A Route Carries the Pattern"
chaosx.nr14.60.d: "Separate reports now point toward [cannibalism_spread_target_state.GetName]. Manifests identify §Y[cannibalism_spread_target_state.GetCannibalismSpreadSourceName]§! as the origin and §Y[cannibalism_spread_target_state.GetCannibalismSpreadRouteLabel]§! as the route. Names vanish from transfer lists, returning soldiers refuse ordinary inspection, and the records disagree about who boarded and who arrived. The route has not yet delivered an organized cell. A guarded reception can separate frightened travelers from organizers, while a military seal can stop everyone at the cost of trust and lawful command."
chaosx.nr14.60.a: "Receive them under guard and protect the witnesses."
chaosx.nr14.60.b: "Seal the route and detain every arrival."
chaosx.nr14.60.c: "We cannot commit the resources yet."

chaosx.nr14.61.t: "The Pattern Crosses the Frontier"
chaosx.nr14.61.d: "An organized group has entered the local command in [cannibalism_spread_target_state.GetName]. Manifests identify §Y[ROOT.GetCannibalismSpreadSourceName]§! as the origin and §Y[ROOT.GetCannibalismSpreadRouteLabel]§! as the route into the state. The arrivals brought copied ranks, prisoner rules, and supply practices already seen elsewhere, and the cell has recruited locally. Closing the route behind it cannot remove the organizers already inside."
chaosx.nr14.61.reinfection.d: "[cannibalism_spread_target_state.GetName] had completed its recovery, rebuilt its records, and placed the last local cases under control. Manifests identify §Y[ROOT.GetCannibalismSpreadSourceName]§! as the new origin and §Y[ROOT.GetCannibalismSpreadRouteLabel]§! as the route through those defenses. The country faces an external reinfection and must choose how openly to confront it."
chaosx.nr14.61.a: "Open the records and protect those who testify."
chaosx.nr14.61.b: "Keep the command intact by keeping this quiet."
chaosx.nr14.61.c: "Turn the cell against our enemies."

chaosx.nr14.62.t: "Another Cell Arrives"
chaosx.nr14.62.d: "The inbound route to [cannibalism_spread_target_state.GetName] has completed. Manifests identify §Y[ROOT.GetCannibalismSpreadSourceName]§! as the origin and §Y[ROOT.GetCannibalismSpreadRouteLabel]§! as the route into the state. Its organizers reached units, stores, or detention records before the receiving command could separate them. Existing cells now possess another set of couriers and a second path across the frontier."
chaosx.nr14.62.a: "Map the route before it moves again."
cannibalism_external_spread_arrival_tt: "The selected state becomes an external route node originating in §Y[ROOT.GetCannibalismSpreadSourceName]§! through §Y[ROOT.GetCannibalismSpreadRouteLabel]§!. Field Hunger and cell pressure rise, and the network gains another live country connection until the node is contained."

chaosx.nr14.70.t: "Hannibal Lecter Steps Into the Light"
chaosx.nr14.70.d: "The converging columns entered [ROOT.Capital.GetName] under copied ranks, common ration marks, and a single campaign timetable. At their center stood a bald, scarred commander whose orders the warlords already knew. He gave his name as Hannibal Lecter and claimed every feeding state, hidden anchorage, prison ledger, and marching Host as one country: [ROOT.GetNameDef]. Warlords crossed the floor, bargained for their armies, or prepared to fight."
chaosx.nr14.70.a: "Write the name across every command ledger."
cannibalism_public_reveal_effect_tt: "Hannibal Lecter becomes the public leader of [ROOT.GetNameDef]. The chosen Host retains its command, technology, troops, route history, population losses, and Larder as the new country forms. Every surviving warlord receives an explicit submission or resistance choice."

chaosx.nr14.71.t: "The Last Table Demands an Answer"
chaosx.nr14.71.desc: "Couriers from [CBL.GetNameDef] carry no invitation. Hannibal recognizes our origin, stores, and surviving command, then lists the forms in which they may continue beneath him. We can enter with our warlord retained as a commander, surrender the warband and accept a lesser fate, bargain for temporary autonomy, or fight the unified Host. A sufficiently powerful tyrant can issue a direct challenge, but even victory over a local army will not erase the revealed command behind it."
chaosx.nr14.71.a: "Submit, but retain our warlord's command."
chaosx.nr14.71.b: "Surrender the warband and enter as servants."
chaosx.nr14.71.c: "Bargain for an autonomous Host."
chaosx.nr14.71.d: "Reject the claim and prepare the defenses."
chaosx.nr14.71.e: "Challenge Hannibal Lecter before every Host."
cannibalism_submit_retain_command_effect_tt: "Our country, troops, technology, origin formations, and part of our Larder pass to [CBL.GetNameDef]. Control follows the transfer, and our named warlord survives as an integrated commander with his origin trait."
cannibalism_submit_surrender_warband_effect_tt: "Our country and troops pass to [CBL.GetNameDef]. Our warlord is recorded as a disposable servant, and only the surviving share of local Larder reaches the unified stores."
cannibalism_bargain_autonomy_effect_tt: "We remain on the map as an autonomous subordinate Host, keep player control and our local army, and pay an immediate share of Larder to [CBL.GetNameDef]. Hannibal may later integrate or punish this settlement."
cannibalism_resist_unification_effect_tt: "We remain independent, receive temporary anti-absorption mobilization, and enter immediate war against [CBL.GetNameDef]. Ordinary countries can support this resistance."
cannibalism_challenge_unification_effect_tt: "We issue a direct challenge, receive stronger temporary succession-war mobilization, and fight [CBL.GetNameDef]. Hannibal remains the revealed supreme leader even if our Host becomes the stronger military core."

chaosx.nr14.72.t: "Hannibal Lecter Claims the Winter Host"
chaosx.nr14.72.d: "The converging Hosts entered the surviving Wendigo country's ranks, surrendered their ledgers, and bound their feeding routes to the original Pack. At the center of the joined command stands a transformed Hannibal Lecter. Blood has frozen across his altered skin, yet the warlords recognize the same orders and the same voice. The country retains its units, training, technologies, ideas, and identity, then adds every cannibal inheritance that survived convergence. Its transformation anchors are visible, powerful, and still vulnerable."
chaosx.nr14.72.a: "Let every Host learn what now commands the winter."
cannibalism_wendigo_public_reveal_effect_tt: "Hannibal Lecter becomes the public leader of the existing Wendigo country. Player control, the original Wendigo Pack, technology, ideas, paid recruitment contracts, cannibal formations, officers, cells, and finite Larder are preserved. The transformed portrait, Winter Host identity, focus overlay, anchors, and pre-lock counterwar become public."

chaosx.nr14.73.t: "A Transformation Anchor Breaks"
chaosx.nr14.73.d: "Assault teams have reached a confirmed transformation anchor before the final lock. Frozen feeding stores burn beside shattered relay equipment while prisoners and residents are pulled from the perimeter. The loss tears strength from the anchor chain, delays the transformation, and leaves a devastated state that will need years of relief and reconstruction."
chaosx.nr14.73.a: "Keep the breach open and record every survivor."
cannibalism_wendigo_anchor_broken_effect_tt: "The destroyed anchor is removed from the live chain, the transformation loses progress, and the state enters long recovery. If no active anchors remain during the countdown, the terminal transformation is broken permanently."

chaosx.nr14.74.t: "The Winter Network Rises"
chaosx.nr14.74.d: "The remaining anchors now exchange supply reports, route orders, and hunting schedules as one network. Wendigo Packs move along frozen corridors while retained cannibal formations guard the Larder roads behind them. The joined command has become stronger in cold, faster to recover, and harder to starve. Enemy forces can still break the network by identifying and destroying its anchors."
chaosx.nr14.74.a: "Bind every frozen road to the hunt."
cannibalism_wendigo_winter_network_effect_tt: "The Conjoined Hunger is replaced by the Winter Feeding Network. Hannibal gains his winter-command trait, live anchors are strengthened, and additional paid Wendigo training remains available through valid anchor states."

chaosx.nr14.75.t: "The Transformation Countdown Begins"
chaosx.nr14.75.d: "The Winter Host has met every public threshold for the irreversible transformation. Its anchors, controlled territory, consumed population, Network Reach, winter victories, authority, Larder, and global Chaos now feed a visible countdown. Hannibal can accelerate or stabilize it through costly anchor operations. Every enemy still has time to identify the chain, break its logistics, destroy recruitment sites, and shatter the anchors before the lock."
chaosx.nr14.75.a: "Guard the chain until the last measure closes."
cannibalism_wendigo_countdown_effect_tt: "The pre-lock transformation countdown is active and visible. Progress rises from the live anchor chain and completed route requirements, but broken anchors reduce it. Destroying every active anchor before completion permanently closes the terminal route."

chaosx.nr14.76.t: "The Winter Lock Is Broken"
chaosx.nr14.76.d: "The final active anchor has failed before the transformation could lock. Frozen stores spill into ruined roads, relay signals vanish, and the joined command can no longer force the Winter Host into its terminal form. Hannibal and the surviving packs remain a formidable war power, but the irreversible route is closed. Recruitment sites fall silent while liberated states begin the long work of identification, relief, and recovery."
chaosx.nr14.76.a: "The world has gained a brief reprieve, with the danger still present."
cannibalism_wendigo_transformation_broken_effect_tt: "The terminal transformation is permanently defeated. The countdown, terminal hunt, and additional Wendigo Pack recruitment close. The merged country remains powerful and keeps its surviving Wendigo and cannibal inheritances, but it can no longer reach the locked world-end form."

chaosx.nr14.77.t: "The Anchor Perimeter Falls"
chaosx.nr14.77.d: "Our screened assault has breached the selected anchor perimeter. Engineers destroy its frozen stores and relay machinery while medical and identification teams clear the compound. The operation weakens the Winter Host's chain and records our country as a decisive contributor. If this was the final live anchor, the terminal transformation will fail."
chaosx.nr14.77.a: "Secure the survivors and demolish the last chambers."
cannibalism_wendigo_anchor_assault_success_effect_tt: "The selected reachable anchor was damaged or destroyed through a paid counterwar operation. A destroyed anchor leaves long recovery and reduces the transformation chain. The country receives defeat-contributor credit."

cannibalism_warlord_resistance_to_unification: "Resistance to the Last Table"
cannibalism_warlord_resistance_to_unification_desc: "Local stores, dispersed ranks, and fear of absorption hold the Host together for one desperate counterwar."
cannibalism_warlord_challenge_to_unification: "Challenge Before Every Host"
cannibalism_warlord_challenge_to_unification_desc: "The warlord has staked his command, warband, and reputation on breaking Hannibal's chosen military core in open battle."

chaosx.news.90.t: "Hannibal Lecter Unifies the Cannibal Network"
chaosx.news.90.d: "Identical orders have appeared across several fronts as cannibal warlords and hidden formations converge on [CBL.Capital.GetName]. Their new state, [CBL.GetNameDef], is led by the previously concealed Hannibal Lecter. Captured records show that the unified command possesses population-fed stores, foreign cells, regional armies, and routes that survived earlier containment. Resistant warlords are already fighting the new state, while others have submitted or bargained for autonomy."
chaosx.news.90.a: "The scattered horrors have become a country."
chaosx.news.91.t: "Hannibal Lecter's Winter Host Revealed"
chaosx.news.91.d: "The surviving Wendigo country has absorbed the converging cannibal Hosts without surrendering its original formations, training, technology, or identity. Its transformed leader is Hannibal Lecter. Captured reports describe visible transformation anchors, frozen supply corridors, retained warlord commands, and new Wendigo Pack musters tied to real population and guarded stores. The anchors remain vulnerable, but every day they survive carries the joined command closer to an irreversible winter transformation."
chaosx.news.91.a: "The winter has found a command."

cannibalism_warlord_survive_the_first_encirclement: "Survive the First Encirclement"
cannibalism_warlord_survive_the_first_encirclement_desc: "The authorities will try to close every road before the Host learns how to hold ground. Watches, reserve paths, and an order of retreat must exist before the first lawful assault arrives."
cannibalism_warlord_survive_the_first_encirclement_tt: "Preserves closed, state-accounted recruitment, improves the experience of paid formations, and lets later emergency reinforcement restore Command Integrity while reducing Frenzy."
cannibalism_warlord_hold_the_origin_ground: "Hold the Origin Ground"
cannibalism_warlord_hold_the_origin_ground_desc: "The first captured district is the only place where every guard, storekeeper, and captain knows the same roads. Losing it would scatter the Host before its command has hardened."
cannibalism_warlord_hold_the_origin_ground_tt: "Fortifies the capital and improves the starting experience of every state-accounted formation."
cannibalism_warlord_repair_the_broken_routes: "Repair the Broken Routes"
cannibalism_warlord_repair_the_broken_routes_desc: "Wrecked bridges and torn rail beds deny food to pursuers, but they also divide the Host from its own stores. Selected corridors must carry patrols and guarded columns again."
cannibalism_warlord_repair_the_broken_routes_tt: "Improves capital infrastructure and shortens the cooldown imposed on a state after it supplies a formation."
cannibalism_warlord_secure_the_first_larder: "Secure the First Larder"
cannibalism_warlord_secure_the_first_larder_desc: "Captured stores are only an inventory until guards, records, and feeding shares bind them to territory. The first Larder must be counted with its human cost recorded."
cannibalism_warlord_secure_the_first_larder_tt: "Opens controlled-state consumption. A successful, Deaths-recorded transaction recovers an additional [?constant:cannibalism_warlord_contract.larder_inventory_gain|0] Larder from the inventoried stores."
cannibalism_warlord_name_the_first_lieutenants: "Name the First Lieutenants"
cannibalism_warlord_name_the_first_lieutenants_desc: "A warlord cannot inspect every checkpoint and depot. Captains who can transmit orders without inventing new ones must be named, watched, and made answerable."
cannibalism_warlord_name_the_first_lieutenants_tt: "Improves the starting experience of state-accounted formations and moves Network Alignment toward common ranks."
cannibalism_warlord_the_host_endures: "The Host Endures"
cannibalism_warlord_the_host_endures_desc: "The first cordon failed to erase the Host. Its ledgers, ranks, and territorial stores can sustain competing forms of command, provided every new formation is still paid for in equipment, Larder, and population."
cannibalism_warlord_the_host_endures_tt: "Opens the three hierarchy routes, basic state-accounted recruitment, and emergency reinforcement, while shortening each paid recruitment state's recovery."

cannibalism_warlord_seize_the_knives: "Seize the Knives"
cannibalism_warlord_seize_the_knives_desc: "No captain may retain an armed following that answers to a private ration book. Their knives, guards, and prisoners will pass into one personal command."
cannibalism_warlord_seize_the_knives_tt: "Commits the Host to Personal Tyranny and lowers Network Alignment. Raising a Bone Guard through a valid state also strengthens coercive control and raises Frenzy."
cannibalism_warlord_break_the_captains: "Break the Captains"
cannibalism_warlord_break_the_captains_desc: "The old captains know where stores are hidden and which guards can be bought. Public submission, selective killings, and hostage commands will make their knowledge serve one mouth."
cannibalism_warlord_break_the_captains_tt: "Raises Frenzy as rival commands are destroyed and gives every later Bone Guard a large experience advantage."
cannibalism_warlord_bind_the_guard_to_one_mouth: "Bind the Guard to One Mouth"
cannibalism_warlord_bind_the_guard_to_one_mouth_desc: "The warlord's survival becomes a military objective. A selected guard will hold the command body, ration route, and succession room against enemies inside and outside the Host."
cannibalism_warlord_bind_the_guard_to_one_mouth_tt: "Opens costed Bone Guard recruitment and further improves the experience of the guard assigned to protect the command body."
cannibalism_warlord_personal_dominion: "Personal Dominion"
cannibalism_warlord_personal_dominion_desc: "Every district, formation, and store now answers through the warlord's household. Orders move with terrifying speed, while one death could still tear the structure apart."
cannibalism_warlord_personal_dominion_tt: "Replaces the survival burden with a Personal Dominion operating order, raises the Bone Guard cap, and restores Command Integrity after successful state consumption."
cannibalism_warlord_divide_the_first_table: "Divide the First Table"
cannibalism_warlord_divide_the_first_table_desc: "Captains will retain commands, but shares, districts, and obligations must be argued in one room. A common table can turn rival appetites into enforceable votes."
cannibalism_warlord_divide_the_first_table_tt: "Commits the Host to a Feast Council. Successful Feeding District intensification reduces Frenzy and raises Network Alignment through a recorded council vote."
cannibalism_warlord_recognize_the_captains: "Recognize the Captains"
cannibalism_warlord_recognize_the_captains_desc: "Authority that cannot be recorded cannot be limited. Recognized captains receive defined formations and duties, making both training and punishment possible."
cannibalism_warlord_recognize_the_captains_tt: "Substantially improves formation starting experience and raises Network Alignment through recognized ranks."
cannibalism_warlord_assign_feeding_districts: "Assign Feeding Districts"
cannibalism_warlord_assign_feeding_districts_desc: "The council will divide controlled territory into guarded districts with named obligations. The arrangement limits private raids only by making predation administrative."
cannibalism_warlord_assign_feeding_districts_tt: "Opens controlled-state intensification. Every successful transaction strengthens the selected network node."
cannibalism_warlord_council_of_hosts: "Council of Hosts"
cannibalism_warlord_council_of_hosts_desc: "A recorded council can direct several columns, and each household keeps its own identity. Its bargains are ugly, but they can survive the disgrace or death of a single captain."
cannibalism_warlord_council_of_hosts_tt: "Replaces the survival burden with a Council of Hosts operating order and extends synchronized attacks that include another warlord."
cannibalism_warlord_free_the_captains: "Free the Captains"
cannibalism_warlord_free_the_captains_desc: "No central table will be permitted to count every weapon or captive. Independent captains will cooperate by season, road mark, and reciprocal rescue."
cannibalism_warlord_free_the_captains_tt: "Commits the Host to a Pack Confederacy and reduces the state cooldown after every paid recruitment transaction by [?constant:cannibalism_warlord_contract.recruitment_cooldown_reduction_medium|0] days."
cannibalism_warlord_mark_the_hunting_grounds: "Mark the Hunting Grounds"
cannibalism_warlord_mark_the_hunting_grounds_desc: "Each captain must know where another band's claim ends. Marks on roads and storehouses will prevent waste inside the confederacy while directing violence outward."
cannibalism_warlord_mark_the_hunting_grounds_tt: "Opens controlled-state consumption and improves costed origin raids with longer pressure and a small Larder recovery."
cannibalism_warlord_share_the_captured_roads: "Share the Captured Roads"
cannibalism_warlord_share_the_captured_roads_desc: "A road held by one band must carry the others when relief columns close in. Shared routes will be repaired under armed guarantees rather than central ownership."
cannibalism_warlord_share_the_captured_roads_tt: "Improves capital infrastructure and extends both origin operations and synchronized attacks along the shared roads."
cannibalism_warlord_no_single_mouth: "No Single Mouth"
cannibalism_warlord_no_single_mouth_desc: "The Host will have no headquarters whose destruction ends the war. Captains disperse stores, successors, and orders until decapitation becomes almost meaningless."
cannibalism_warlord_no_single_mouth_tt: "Replaces the survival burden with a Pack Confederacy operating order. If the country falls, the dispersed command extracts its warlord before prosecution."

cannibalism_warlord_inventory_the_captured_stores: "Inventory the Captured Stores"
cannibalism_warlord_inventory_the_captured_stores_desc: "Ammunition, food, medicine, prisoners, and civilians cannot remain one undifferentiated prize. The Host will record what each state can still yield and what has already been taken."
cannibalism_warlord_inventory_the_captured_stores_tt: "Opens controlled-state consumption and adds [?constant:cannibalism_warlord_contract.larder_inventory_gain|0] Larder to every successful, Deaths-recorded transaction."
cannibalism_warlord_secure_the_prisoner_ledger: "Secure the Prisoner Ledger"
cannibalism_warlord_secure_the_prisoner_ledger_desc: "Transfer lists reveal who was moved, who vanished, and which institutions can still hide the difference. The ledger will be guarded as tightly as any depot."
cannibalism_warlord_secure_the_prisoner_ledger_tt: "Opens controlled-state intensification. Every successful state-consumption transaction also raises Network Alignment through the guarded ledger."
cannibalism_warlord_restore_the_taken_workshops: "Restore the Taken Workshops"
cannibalism_warlord_restore_the_taken_workshops_desc: "Captured shops can repair weapons and vehicles if their workers, power, and tools are kept in one place. The Host will turn the capital into a guarded military workshop."
cannibalism_warlord_restore_the_taken_workshops_tt: "Adds a military factory and building slot in the capital. Successful paid recruitment recovers [?constant:cannibalism_warlord_contract.workshop_recovery_infantry|0] infantry equipment and shortens the selected state's cooldown."
cannibalism_warlord_organize_battlefield_recovery: "Organize Battlefield Recovery"
cannibalism_warlord_organize_battlefield_recovery_desc: "Abandoned positions contain equipment, records, and bodies before any government can recover them. Dedicated parties will follow the assault and account for what they take."
cannibalism_warlord_organize_battlefield_recovery_tt: "Every distinct enemy country capitulated by this Host yields one receipt of [?constant:cannibalism_warlord_contract.major_victory_larder_gain|0] Larder, [?constant:cannibalism_warlord_contract.major_victory_infantry_recovery|0] infantry equipment, and [?constant:cannibalism_warlord_contract.major_victory_support_recovery|0] support equipment. The defeated country cannot be harvested twice by the same living command."
cannibalism_warlord_establish_larder_accounting: "Establish Larder Accounting"
cannibalism_warlord_establish_larder_accounting_desc: "A reserve that cannot distinguish yield from waste cannot sustain an army. Every controlled-state transaction will use a common measure and remain tied to the Deaths ledger."
cannibalism_warlord_establish_larder_accounting_tt: "Establishes the baseline state-consumption yield and adds [?constant:cannibalism_warlord_contract.larder_accounting_gain|0] Larder to each successful, Deaths-recorded transaction."
cannibalism_warlord_rapid_consumption: "Rapid Consumption"
cannibalism_warlord_rapid_consumption_desc: "The next offensive matters more than the next year. Districts will be stripped quickly, accepting exhaustion, disorder, and rising Frenzy in exchange for immediate yield."
cannibalism_warlord_rapid_consumption_tt: "Commits to Rapid Consumption, raises state-consumption yield to [?constant:cannibalism_warlord_contract.consumption_yield_rapid|%0], and adds further Frenzy after every successful draw."
cannibalism_warlord_short_horizon_larder: "The Short-Horizon Larder"
cannibalism_warlord_short_horizon_larder_desc: "The Larder exists to feed the campaign already under way. Faster mobilization and violent recovery come at the cost of supply waste, stability, and exhausted states."
cannibalism_warlord_short_horizon_larder_tt: "Completes the Rapid Consumption contribution to the Host Operating Order. Every successful draw adds another consumption action to that exact state, accelerating exhaustion and recovery damage."
cannibalism_warlord_managed_herds: "Managed Herds"
cannibalism_warlord_managed_herds_desc: "The Host will preserve transport, labor, and production by slowing each territorial draw. The arithmetic lasts longer only because occupied people are made part of it."
cannibalism_warlord_managed_herds_tt: "Commits to Managed Herds, lowers immediate yield to [?constant:cannibalism_warlord_contract.consumption_yield_managed|%0], reduces Frenzy after each successful draw, and strengthens the selected network node."
cannibalism_warlord_long_larder: "The Long Larder"
cannibalism_warlord_long_larder_desc: "Quotas, guarded work, and staggered removals keep factories and roads alive beneath occupation. The resulting reserve is efficient, durable, and built on prolonged coercion."
cannibalism_warlord_long_larder_tt: "Completes the Managed Herds contribution to the Host Operating Order and opens another costed intensification of eligible controlled states."
cannibalism_warlord_mobile_larder: "Mobile Larder"
cannibalism_warlord_mobile_larder_desc: "Stores and captives will move with the army, leaving exhausted capitals behind. Every convoy and column becomes both lifeline and target."
cannibalism_warlord_mobile_larder_tt: "Commits to the Mobile Larder. Successful draws restore Command Integrity, while guarded escorts extend costed origin operations."
cannibalism_warlord_moving_larder: "The Moving Larder"
cannibalism_warlord_moving_larder_desc: "A moving reserve lets the Host abandon territory before it becomes useless. Speed and supply resilience improve, while fuel use and route exposure remain severe."
cannibalism_warlord_moving_larder_tt: "Completes the Mobile Larder contribution to the Host Operating Order, improves capital infrastructure, and opens raids."

cannibalism_warlord_discipline_the_warbands: "Discipline the Warbands"
cannibalism_warlord_discipline_the_warbands_desc: "Violence without timing consumes stores and ruins assaults. Captains will learn to hold their bands in place until an order, target, and recovery route exist."
cannibalism_warlord_discipline_the_warbands_tt: "Substantially improves formation starting experience and reduces Frenzy."
cannibalism_warlord_captains_as_officers: "Captains as Officers"
cannibalism_warlord_captains_as_officers_desc: "A captain who can read a road and keep a ration line alive is more useful than one who merely inspires fear. Field commands will be recorded and trained."
cannibalism_warlord_captains_as_officers_tt: "Combines lieutenant assignments with officer training for a large cumulative increase to the starting experience of paid formations."
cannibalism_warlord_form_the_feast_cohorts: "Form the Feast Cohorts"
cannibalism_warlord_form_the_feast_cohorts_desc: "Selected warbands will be rebuilt as larger assault cohorts with fixed weapons and a counted replacement obligation. They remain dependent on real stores and population."
cannibalism_warlord_form_the_feast_cohorts_tt: "Opens costed Feast Cohort formation through eligible controlled states."
cannibalism_warlord_train_the_origin_specialists: "Train the Origin Specialists"
cannibalism_warlord_train_the_origin_specialists_desc: "Each Host began with a different geography and institution. Its best fighters will formalize the landing, siege, or march methods that made survival possible."
cannibalism_warlord_train_the_origin_specialists_tt: "Opens the origin-specific formation for this Host."
cannibalism_warlord_raise_the_bone_guard: "Raise the Bone Guard"
cannibalism_warlord_raise_the_bone_guard_desc: "A heavily equipped guard will protect command rooms, Larder transfers, and the warlord's body. Its limited places make every loss expensive."
cannibalism_warlord_raise_the_bone_guard_tt: "Opens costed Bone Guard recruitment through eligible controlled states."
cannibalism_warlord_battlefield_harvest: "Battlefield Harvest"
cannibalism_warlord_battlefield_harvest_desc: "Recovery parties will move behind the assault before fire, exposure, and enemy burial details erase the field. Their yield is bounded by what actually remains."
cannibalism_warlord_battlefield_harvest_tt: "Improves the existing one-receipt enemy-capitulation harvest by [?constant:cannibalism_warlord_contract.major_victory_larder_bonus|0] Larder, [?constant:cannibalism_warlord_contract.major_victory_infantry_bonus|0] infantry equipment, and [?constant:cannibalism_warlord_contract.major_victory_support_bonus|0] support equipment, while adding Larder and support-equipment recovery to every paid origin operation."
cannibalism_warlord_protect_the_command_body: "Protect the Command Body"
cannibalism_warlord_protect_the_command_body_desc: "Command cannot survive inside an unguarded depot. Fortified rooms, alternate exits, and a larger Bone Guard will make a sudden lawful strike harder."
cannibalism_warlord_protect_the_command_body_tt: "Fortifies the capital, raises the Bone Guard cap, and further improves the starting experience of every paid Bone Guard."
cannibalism_warlord_disciplined_feeding_army: "A Disciplined Feeding Army"
cannibalism_warlord_disciplined_feeding_army_desc: "Warbands now march, wait, and concentrate as an army while retaining their predatory supply system. This discipline makes them stronger without making recruitment free."
cannibalism_warlord_disciplined_feeding_army_tt: "Adds the military-discipline contribution to the Host Operating Order and expands emergency reinforcement."
cannibalism_warlord_war_doctrine_of_the_host: "War Doctrine of the Host"
cannibalism_warlord_war_doctrine_of_the_host_desc: "Hierarchy and Larder policy have become battlefield doctrine. Personal guards, council commands, or independent packs will pursue the war according to the order already chosen."
cannibalism_warlord_war_doctrine_of_the_host_tt: "Completes the hierarchy-specific Host Operating Order. Tyranny trains experienced recruits, the Council mixes experience with faster recovery, and the Confederacy sharply shortens state recruitment cooldowns."

cannibalism_warlord_island_repair_the_ports: "Repair the Hidden Ports"
cannibalism_warlord_island_repair_the_ports_desc: "Island survival depends on jetties the blockade does not watch and workshops that can keep small craft moving. The capital harbor will be rebuilt for concealment and capacity."
cannibalism_warlord_island_repair_the_ports_tt: "Adds naval-base and dockyard capacity in the capital and opens Island Host operations."
cannibalism_warlord_island_ambush_the_convoys: "Ambush the Convoys"
cannibalism_warlord_island_ambush_the_convoys_desc: "A convoy that approaches under guard still reveals its route, escort rhythm, and weak night. Hidden anchorages will turn relief shipping into contested stores."
cannibalism_warlord_island_ambush_the_convoys_tt: "Opens the costed convoy ambush. Raid organization and hidden anchorages extend its duration and recover a small Larder reserve."
cannibalism_warlord_island_train_landing_cadres: "Train Landing Cadres"
cannibalism_warlord_island_train_landing_cadres_desc: "Raiding boats are not enough to seize a defended shore. Cadres will practice landings, beach command, and the rapid removal of stores before a counterattack."
cannibalism_warlord_island_train_landing_cadres_tt: "Raises the origin-specialist cap and extends each costed Island Host operation with trained landing cadres."
cannibalism_warlord_island_archipelago_hunt: "The Archipelago Hunt"
cannibalism_warlord_island_archipelago_hunt_desc: "Separated harbors, islands, and landing cadres will operate as one hunting ground. A blockade can isolate a port without isolating the Host."
cannibalism_warlord_island_archipelago_hunt_tt: "Upgrades Island Host identity to Archipelago Hunt, greatly extends convoy ambushes, and recovers two convoys after a successful operation."
cannibalism_warlord_siege_fortify_feeding_districts: "Fortify the Feeding Districts"
cannibalism_warlord_siege_fortify_feeding_districts_desc: "Barricades and internal checkpoints will separate the defended city into districts that can survive bombardment even as relief and escape become harder."
cannibalism_warlord_siege_fortify_feeding_districts_tt: "Fortifies the capital, opens the costed Siege Commune ambush, and lets successful Feeding District intensification strengthen the selected node."
cannibalism_warlord_siege_open_the_tunnels: "Open the Tunnels"
cannibalism_warlord_siege_open_the_tunnels_desc: "Service passages, drains, and old shelters cross beneath the lawful cordon. Mapped exits will carry scouts and ambush parties where artillery cannot see them."
cannibalism_warlord_siege_open_the_tunnels_tt: "Mapped tunnels and relief-column plans greatly extend the costed Siege Commune ambush and recover Larder from a successful operation."
cannibalism_warlord_siege_take_the_workshops: "Take the Workshops"
cannibalism_warlord_siege_take_the_workshops_desc: "A siege is won by the side that can still repair weapons and barriers. The city's surviving shops will be forced into one guarded production district."
cannibalism_warlord_siege_take_the_workshops_tt: "Adds a military factory and building slot in the capital, opens origin specialists, and applies workshop recovery to successful paid recruitment."
cannibalism_warlord_siege_city_that_eats: "The City That Eats"
cannibalism_warlord_siege_city_that_eats_desc: "Tunnels, workshops, barricades, hospitals, and prison yards become one fortified system. Relief columns must break it faster than the city can consume them."
cannibalism_warlord_siege_city_that_eats_tt: "Upgrades Siege Commune identity to The City That Eats, greatly extends relief ambushes, and recovers support equipment after success."
cannibalism_warlord_march_seize_wheels_and_mounts: "Seize Wheels and Mounts"
cannibalism_warlord_march_seize_wheels_and_mounts_desc: "A March Host that stops moving becomes a siege without walls. Vehicles, draft animals, fuel, and road crews will be assigned before any static store."
cannibalism_warlord_march_seize_wheels_and_mounts_tt: "Opens March Host operations and mobile-Larder access."
cannibalism_warlord_march_raid_the_depots: "Raid the Depots"
cannibalism_warlord_march_raid_the_depots_desc: "The Host will strike the rear before the front can turn. Depot records and transfer schedules matter as much as the supplies taken from them."
cannibalism_warlord_march_raid_the_depots_tt: "Improves the costed March Host raid with longer pressure, recovered Larder, and [?constant:cannibalism_warlord_contract.march_truck_recovery|0] captured trucks."
cannibalism_warlord_march_sabotage_the_rails: "Sabotage the Rails"
cannibalism_warlord_march_sabotage_the_rails_desc: "Rails carry relief forces toward yesterday's battlefield. Broken junctions and false signals will keep pursuers behind the Host while opening new predatory corridors."
cannibalism_warlord_march_sabotage_the_rails_tt: "Rail sabotage and predatory corridors greatly extend the costed March Host operation and recover one train."
cannibalism_warlord_march_moving_front: "The Moving Front"
cannibalism_warlord_march_moving_front_desc: "The capital, workshops, and assault columns will advance together. Exhausted ground is abandoned before it can pin the Host to a losing defense."
cannibalism_warlord_march_moving_front_tt: "Upgrades March Host identity to The Moving Front, opens exhausted-state relocation, and greatly extends the costed mobile operation."

cannibalism_warlord_raid_the_neighboring_states: "Raid the Neighboring States"
cannibalism_warlord_raid_the_neighboring_states_desc: "The first expansion begins before a formal front exists. Border stores, police posts, and isolated road columns offer targets that can be reached and withdrawn from quickly."
cannibalism_warlord_raid_the_neighboring_states_tt: "Improves every costed origin operation with longer pressure, recovered Larder, and [?constant:cannibalism_warlord_contract.operation_infantry_recovery|0] infantry equipment."
cannibalism_warlord_mark_the_supply_hubs: "Mark the Supply Hubs"
cannibalism_warlord_mark_the_supply_hubs_desc: "Every offensive depends on a small number of rail junctions, ports, and depots. Scouts will mark which targets can paralyze a defense without trapping the Host."
cannibalism_warlord_mark_the_supply_hubs_tt: "Extends every costed origin operation and recovers additional Larder by targeting its supply hubs."
cannibalism_warlord_seize_prisons_and_depots: "Seize Prisons and Depots"
cannibalism_warlord_seize_prisons_and_depots_desc: "A captured depot feeds the next week, while a captured prison supplies records, routes, and guarded bodies. Joint attacks will pursue both in one operation."
cannibalism_warlord_seize_prisons_and_depots_tt: "Opens controlled-state consumption. Costed origin and transfer operations recover additional Larder and infantry equipment from marked prisons and depots."
cannibalism_warlord_open_the_predatory_corridors: "Open the Predatory Corridors"
cannibalism_warlord_open_the_predatory_corridors_desc: "Connected raids require roads the Host can repair, poison, and abandon on command. The corridor is a line of movement, not a promise to hold every state."
cannibalism_warlord_open_the_predatory_corridors_tt: "Improves capital infrastructure, opens the Mobile Larder, and substantially extends costed origin operations along the predatory corridors."
cannibalism_warlord_shelter_foreign_cells: "Shelter Foreign Cells"
cannibalism_warlord_shelter_foreign_cells_desc: "Couriers and defectors need a place where uniforms, records, and names can be changed before they return across the frontier."
cannibalism_warlord_shelter_foreign_cells_tt: "Opens deliberate foreign-cell operations."
cannibalism_warlord_train_network_cadres: "Train Network Cadres"
cannibalism_warlord_train_network_cadres_desc: "A cadre must enter a foreign formation without behaving like a raiding band. Language, paperwork, and patient command become weapons."
cannibalism_warlord_train_network_cadres_tt: "Opens Network Cadre recruitment and raises its formation cap."
cannibalism_warlord_corrupt_the_enemy_officers: "Corrupt the Enemy Officers"
cannibalism_warlord_corrupt_the_enemy_officers_desc: "An officer who changes one transfer list or opens one depot can achieve more than a failed assault. The Host will trade stores and protection for access."
cannibalism_warlord_corrupt_the_enemy_officers_tt: "Opens foreign seeding. A successful paid seed or prisoner transfer also reduces stability in the actual target country."
cannibalism_warlord_synchronized_sabotage: "Synchronized Sabotage"
cannibalism_warlord_synchronized_sabotage_desc: "Separate cells will strike rail, records, communications, and relief columns at the same hour. Coordination increases both reach and dependence on the wider network."
cannibalism_warlord_synchronized_sabotage_tt: "Opens costed synchronized attacks and improves supporting origin raids. Each participating Host pays its own Larder and Command Power."

cannibalism_warlord_read_the_common_signs: "Read the Common Signs"
cannibalism_warlord_read_the_common_signs_desc: "Marks found in distant depots and transfer records repeat the Host's own ranks and timings. The pattern can be joined, exploited, or rejected, but it can no longer be ignored."
cannibalism_warlord_read_the_common_signs_tt: "Opens three network routes based on common symbols, stolen corridors, and divided local command."
cannibalism_warlord_accept_the_common_symbols: "Accept the Common Symbols"
cannibalism_warlord_accept_the_common_symbols_desc: "Shared ranks and route signs can let separate Hosts act as one army without a public central command. This Host will accept the common discipline."
cannibalism_warlord_accept_the_common_symbols_tt: "Commits to Network Alignment and raises Network Alignment."
cannibalism_warlord_open_the_courier_routes: "Open the Courier Routes"
cannibalism_warlord_open_the_courier_routes_desc: "Couriers will receive protected stages, replacement papers, and synchronized departure times. Their routes can carry both cadres and attack orders."
cannibalism_warlord_open_the_courier_routes_tt: "Opens Network Cadres and synchronized attacks. Courier routes improve Alignment gained from both paid alignment and synchronized operations."
cannibalism_warlord_regional_common_table: "The Regional Common Table"
cannibalism_warlord_regional_common_table_desc: "Ranks, routes, and operational timings now bind the Host to aligned neighbors. Submission becomes thinkable because common command already exists below the name."
cannibalism_warlord_regional_common_table_tt: "Adds the Alignment contribution to the Host Operating Order, improves the paid alignment action, and preserves more Larder when the Host submits while retaining command."
cannibalism_warlord_copy_the_shared_doctrine: "Copy the Shared Doctrine"
cannibalism_warlord_copy_the_shared_doctrine_desc: "The common doctrine is useful without being obeyed. Its orders, route symbols, and training tables will be copied while the Host keeps its own command hidden."
cannibalism_warlord_copy_the_shared_doctrine_tt: "Commits to Network Manipulation. Every successful foreign seed diverts a bounded Larder share back to this Host."
cannibalism_warlord_divert_the_courier_routes: "Divert the Courier Routes"
cannibalism_warlord_divert_the_courier_routes_desc: "Copied signals will send couriers through Host-controlled stages where records, stores, and intentions can be taken before the message continues."
cannibalism_warlord_divert_the_courier_routes_tt: "Opens foreign seeding and supporting raids. Every successful seed diverts a further [?constant:cannibalism_warlord_contract.diverted_courier_larder_gain|0] Larder from the courier route."
cannibalism_warlord_regional_stolen_routes: "Regional Stolen Routes"
cannibalism_warlord_regional_stolen_routes_desc: "The Host draws intelligence and stores from the wider network while concealing its real strength. Every borrowed route becomes leverage against its owner."
cannibalism_warlord_regional_stolen_routes_tt: "Adds the Manipulation contribution to the Host Operating Order, grants major convergence-host leverage, extends synchronized attacks, and reduces tribute if autonomy is negotiated."
cannibalism_warlord_execute_the_couriers: "Execute the Couriers"
cannibalism_warlord_execute_the_couriers_desc: "Outside orders will be burned and the messengers killed where their bodies cannot prove the route. The Host chooses open independence from network command."
cannibalism_warlord_execute_the_couriers_tt: "Commits to Network Defiance, opens anti-absorption measures, and lowers Network Alignment."
cannibalism_warlord_fortify_independent_ground: "Fortify Independent Ground"
cannibalism_warlord_fortify_independent_ground_desc: "Defiance is meaningless if the first coordinated assault can take the capital. Stores, exits, and firing positions will be prepared against ordinary armies and rival Hosts alike."
cannibalism_warlord_fortify_independent_ground_tt: "Fortifies the capital and constructs two more land-fort levels there if the Host resists unification."
cannibalism_warlord_independent_regional_host: "The Independent Regional Host"
cannibalism_warlord_independent_regional_host_desc: "No courier, council, or distant command will absorb this territory without war. The Host prepares to dominate its region alone, regardless of the enemies that choice creates."
cannibalism_warlord_independent_regional_host_tt: "Adds the Defiance contribution to the Host Operating Order, improves supporting raids, weighs the AI toward resistance, and adds another capital fort when resistance begins."

# ---------------------------------------------------------------------------
# Post-reveal unified CBL route ideas
# ---------------------------------------------------------------------------
cannibalism_retained_lieutenants: "Retained Lieutenants"
cannibalism_retained_lieutenants_desc: "Hannibal preserves the regional captains who know their soldiers, roads, and local stores. Their command depth improves planning and recovery while disputes between lieutenants slow the central court."
cannibalism_council_of_retained_hosts: "Council of Retained Hosts"
cannibalism_council_of_retained_hosts_desc: "The surviving warlords sit as a permanent command council beneath Hannibal. Regional experience reaches the front quickly, although every continental order must pass through men guarding their own prestige."
cannibalism_warlords_broken: "The Warlords Broken"
cannibalism_warlords_broken_desc: "The old captains lose their commands, hoards, and armed followings. Direct authority grows amid rebellion, damaged stability, and a thinning officer corps."
cannibalism_authority_without_rivals: "Authority Without Rivals"
cannibalism_authority_without_rivals_desc: "No regional warlord can contest Hannibal's orders. The resulting concentration of command strengthens attack and state power while occupied districts organize against purges and replacement officers remain costly."
cannibalism_rivals_in_chains: "Rivals in Chains"
cannibalism_rivals_in_chains_desc: "Captured heirs and hostage governors turn local administration into tribute. Occupied territory yields more under watched rulers, but resistance and constant supervision consume political attention."
cannibalism_dominion_of_chains: "Dominion of Chains"
cannibalism_dominion_of_chains_desc: "A continent of hostage households supplies labor, material, and obedience to the Host. The system extracts more from occupied lands while sharpening resistance and burdening the court with endless loyalty crises."
cannibalism_one_command: "One Command"
cannibalism_one_command_desc: "Standard ranks carry one plan from Hannibal to every Host. Reinforcement and organization improve while long supply lines and centralized political review strain the system."
cannibalism_single_operational_will: "The Single Operational Will"
cannibalism_single_operational_will_desc: "Every theater follows one timetable, one reserve table, and one command voice. Armies prepare and reinforce with exceptional speed while distant supply and political control demand ever greater effort."
cannibalism_many_jaws: "Many Jaws"
cannibalism_many_jaws_desc: "Regional Hosts retain their schools, officers, and methods beneath a shared strategy. The army gains experience and command depth while central planning and political action move slowly."
cannibalism_confederation_under_one_name: "Confederation Under One Name"
cannibalism_confederation_under_one_name_desc: "The origin Hosts remain distinct armies inside a single state. Their accumulated experience and broad command reserve sustain the front, although votes and regional bargaining delay common plans."
cannibalism_ritual_administration: "Ritual Administration"
cannibalism_ritual_administration_desc: "Feeding law, prison ranks, and punishment tables give the cult state a durable civil order. Compliance grows under specialized officials while bureaucracy and organized resistance claim more of the economy."
cannibalism_state_of_the_last_table: "The State of the Last Table"
cannibalism_state_of_the_last_table_desc: "The Last Table governs districts, prisons, and occupied peoples through one ritual code. Its institutions suppress disorder over time while supporting a larger bureaucracy and provoking disciplined resistance."
cannibalism_rapid_continental_larder: "Rapid Continental Larder"
cannibalism_rapid_continental_larder_desc: "Nearby states are consumed to feed a fast cycle of training and reinforcement. Armies recover quickly while supply demand and industrial exhaustion shorten the campaign's horizon."
cannibalism_short_horizon_continent: "A Short-Horizon Continent"
cannibalism_short_horizon_continent_desc: "Every accessible district is judged by what it can provide to the next offensive. Training, reinforcement, recovery, and attack accelerate while supply consumption and factory exhaustion deepen."
cannibalism_managed_continental_larder: "Managed Continental Larder"
cannibalism_managed_continental_larder_desc: "Feeding districts rotate under quotas that preserve transport, workshops, and useful extraction. The system supports a longer war while civilian administration and political supervision remain expensive."
cannibalism_managed_continental_reserve: "Managed Continental Reserve"
cannibalism_managed_continental_reserve_desc: "A continental reserve links guarded populations, workshops, and supply routes into a durable war economy. Efficiency and endurance improve while administration occupies more civilian capacity and command attention."
cannibalism_mobile_continental_larder: "Mobile Continental Larder"
cannibalism_mobile_continental_larder_desc: "Prisoner trains, road columns, and hulks carry the Larder behind advancing armies. Operational reach expands while fuel demand and transport work reduce useful dockyard output."
cannibalism_larder_that_moves: "The Larder That Moves"
cannibalism_larder_that_moves_desc: "The Host can shift its reserves across roads, rails, and oceans without pausing the offensive. Greater speed and reach impose severe fuel demand and keep dockyards occupied with transport work."
cannibalism_battlefield_continental_larder: "Battlefield Continental Larder"
cannibalism_battlefield_continental_larder_desc: "Recovery battalions account for captured equipment and usable battlefield remains after real victories. Offensive tempo improves while the army accepts greater defensive risk and every harvest is limited by what a real battlefield yields."
cannibalism_harvest_follows_victory: "Harvest Follows Victory"
cannibalism_harvest_follows_victory_desc: "Marked battlefields feed a disciplined chain of recovery teams, hospital seizures, and equipment collection. Victorious armies recover and reinforce rapidly while defensive caution gives way to relentless pursuit."

# ---------------------------------------------------------------------------
# Unified CBL focus tree: opening, disposition, and hierarchy
# ---------------------------------------------------------------------------
CBL_reveal_the_command: "Reveal the Command"
CBL_reveal_the_command_desc: "Hannibal steps before the assembled Hosts and gives the network a public chain of command. Couriers, feeding states, and warlord armies receive one seal and one operational calendar."
CBL_reveal_the_command_tt: "Establishes Unified Authority and World Hostility, begins the four-part Last Table readiness process, and opens warlord submission decisions."
CBL_summon_the_warlords: "Summon the Warlords"
CBL_summon_the_warlords_desc: "Every surviving warlord is ordered to appear, answer through a trusted lieutenant, or prepare for war. Their origins, armies, and loyalties enter the central register."
CBL_summon_the_warlords_tt: "Opens warlord response resolution and the lieutenant registry."
CBL_choose_the_first_command_capital: "Choose the First Command Capital"
CBL_choose_the_first_command_capital_desc: "The first continental capital must hold the command staff, guarded stores, and roads needed to direct several Hosts at once. Its approaches are rebuilt and fortified."
CBL_choose_the_first_command_capital_tt: "Opens capital projects and adds one Infrastructure level and one Land Fort level in the owned and controlled capital."
CBL_audit_the_submitted_hosts: "Audit the Submitted Hosts"
CBL_audit_the_submitted_hosts_desc: "Submitted warlords bring altered rosters, concealed stores, and captains whose loyalty survived several masters. Hannibal's auditors will trace each command before granting it a place."
CBL_audit_the_submitted_hosts_tt: "Opens warlord audits and hidden-hoard investigations."
CBL_bind_the_network_territories: "Bind the Network Territories"
CBL_bind_the_network_territories_desc: "Couriers and road crews connect islands, communes, and conquered districts to the revealed command. Disconnected regions receive governors who can survive interrupted contact."
CBL_bind_the_network_territories_tt: "Opens territorial integration and disconnected-region management, then adds one Infrastructure level in an owned and controlled route state."
CBL_settle_the_host_question: "Settle the Host Question"
CBL_settle_the_host_question_desc: "The warlords must learn whether they will serve as officers, vanish beneath purges, or govern under chains. The settlement will define every later command relationship."
CBL_settle_the_host_question_tt: "Opens the three mutually exclusive warlord-disposition routes and the unified warlord-settlement category."
CBL_open_the_continental_ledger: "Open the Continental Ledger"
CBL_open_the_continental_ledger_desc: "One ledger will record feeding districts, moving stores, submitted armies, and the obligations of every region. A central workshop supports the clerks and guards who keep it current."
CBL_open_the_continental_ledger_tt: "Opens the unified Larder category and state ledger, then adds one shared building slot and one Civilian Factory in the owned and controlled capital."
CBL_establish_the_first_continental_command: "Establish the First Continental Command"
CBL_establish_the_first_continental_command_desc: "The provisional Host becomes a continental command with recognized offices, theater records, and a visible hierarchy. The strain of initial unification gives way to permanent institutions."
CBL_establish_the_first_continental_command_tt: "Opens the unified command category and global mechanic, removes A World Host Assembles, and raises Unified Authority."
CBL_keep_the_lieutenants: "Keep the Lieutenants"
CBL_keep_the_lieutenants_desc: "Regional warlords retain command under Hannibal and answer for their soldiers, roads, and stores. Their experience remains useful, along with their rivalries."
CBL_keep_the_lieutenants_tt: "Commits to Keep the Lieutenants, adds Retained Lieutenants, and opens lieutenant-governance decisions."
CBL_seat_the_regional_governors: "Seat the Regional Governors"
CBL_seat_the_regional_governors_desc: "Each retained lieutenant receives a territory whose tribute and order determine his standing. Governors who fail their quotas will face rivals already waiting for the chair."
CBL_seat_the_regional_governors_tt: "Opens regional-governor assignments and governor-loyalty missions."
CBL_preserve_the_origin_commands: "Preserve the Origin Commands"
CBL_preserve_the_origin_commands_desc: "Island raiders, siege cadres, and march columns keep the methods that made them dangerous. The central register will recruit each specialist through its own regional chain."
CBL_preserve_the_origin_commands_tt: "Preserves every learned origin command for later independent recruitment. Each formation still requires Larder, equipment, eligible population, state control, its own cap, and a recorded Deaths transaction."
CBL_arbitrate_the_captains: "Arbitrate the Captains"
CBL_arbitrate_the_captains_desc: "Retained warlords will compete for routes, prisoners, and battlefield honors. Hannibal's council turns those disputes into missions whose outcomes can reward loyalty or expose rebellion."
CBL_arbitrate_the_captains_tt: "Opens captain-arbitration decisions and lieutenant-rivalry missions."
CBL_council_of_retained_hosts: "Council of Retained Hosts"
CBL_council_of_retained_hosts_desc: "The regional Hosts receive a permanent council beneath Hannibal's chair. Their commanders can coordinate continental war while defending the privileges that keep them useful."
CBL_council_of_retained_hosts_tt: "Upgrades Retained Lieutenants to Council of Retained Hosts and raises Unified Authority."
CBL_break_the_warlords: "Break the Warlords"
CBL_break_the_warlords_desc: "Local crowns, private guards, and personal shares will disappear beneath a direct command. The purge begins before the captains can combine their armies."
CBL_break_the_warlords_tt: "Commits to Break the Warlords, adds The Warlords Broken, and opens rival-purge decisions."
CBL_seize_the_hidden_hoards: "Seize the Hidden Hoards"
CBL_seize_the_hidden_hoards_desc: "Every warlord concealed stores against the day of betrayal. Investigators will locate those caches under armed guard, knowing that a failed seizure can ignite resistance."
CBL_seize_the_hidden_hoards_tt: "Opens guarded-hoard seizure missions and activates purge-resistance risk."
CBL_dissolve_the_regional_commands: "Dissolve the Regional Commands"
CBL_dissolve_the_regional_commands_desc: "Origin staffs are stripped of independent authority and folded into central offices. Orders will no longer stop at a regional captain's table."
CBL_dissolve_the_regional_commands_tt: "Opens regional-command dissolution and raises Unified Authority."
CBL_appoint_the_bone_officers: "Appoint the Bone Officers"
CBL_appoint_the_bone_officers_desc: "Officers raised by the central Bone Guard take posts once held by warlords and their relatives. Their advancement depends on obedience to Hannibal alone."
CBL_appoint_the_bone_officers_tt: "Opens Bone Officer assignments and loyal-officer training."
CBL_authority_without_rivals: "Authority Without Rivals"
CBL_authority_without_rivals_desc: "The last independent commands are gone, leaving one source of rank, punishment, and campaign direction. Rebellious districts and a thinner officer corps become the price of absolute authority."
CBL_authority_without_rivals_tt: "Upgrades The Warlords Broken to Authority Without Rivals and sharply raises Unified Authority."
CBL_chain_the_rivals: "Chain the Rivals"
CBL_chain_the_rivals_desc: "Warlords who cannot be trusted can still govern through watched households and hostage heirs. Tribute and fear will bind their provinces to the center."
CBL_chain_the_rivals_tt: "Commits to Chain the Rivals, adds Rivals in Chains, and opens hostage-governance decisions."
CBL_take_their_heirs: "Take Their Heirs"
CBL_take_their_heirs_desc: "The heirs of regional rulers will live under central guard and learn that every local defection has a personal cost. Their conduct will decide whether they accept the role or search for an escape."
CBL_take_their_heirs_tt: "Opens hostage-heir missions and activates hostage-defection risk."
CBL_levy_hostage_tribute: "Levy Hostage Tribute"
CBL_levy_hostage_tribute_desc: "Governors receive quotas for stores, transport, and captives under seals tied to their families. Missed deliveries become public tests of loyalty."
CBL_levy_hostage_tribute_tt: "Opens hostage-tribute decisions and tribute-failure missions."
CBL_rotate_the_hostage_governors: "Rotate the Hostage Governors"
CBL_rotate_the_hostage_governors_desc: "No governor will remain long enough to build a private kingdom. Rotations spread local knowledge through the Host while creating a constant burden of supervision."
CBL_rotate_the_hostage_governors_tt: "Opens hostage-governor rotation and distant-governor management."
CBL_dominion_of_chains: "Dominion of Chains"
CBL_dominion_of_chains_desc: "A hierarchy of watched households governs distant districts through tribute, fear, and exchange. Hannibal can move governors between campaigns without granting them secure local power."
CBL_dominion_of_chains_tt: "Upgrades Rivals in Chains to Dominion of Chains and raises Unified Authority."
CBL_supreme_hierarchy_routes_ready_tt: "Requires one completed hierarchy route: Council of Retained Hosts, Authority Without Rivals, or Dominion of Chains."
CBL_warlord_disposition_routes_ready_tt: "Requires one warband disposition: Keep the Lieutenants, Break the Warlords, or Chain the Rivals."
CBL_global_courier_routes_ready_tt: "Requires Bind the Network Territories and one completed hierarchy route before the courier network can open."
CBL_continental_larder_routes_ready_tt: "Requires the storage network and captured industry, plus one completed hierarchy route, before the continental larder doctrine can open."
CBL_continental_supply_routes_ready_tt: "Requires one supply method: a short continental horizon, a managed continental reserve, a mobile larder, or harvests that follow victory."
CBL_continental_weakness_routes_ready_tt: "Requires standardized captured calibers before the continental weakness can be read."
CBL_final_mobilization_routes_ready_tt: "Requires the abolished supply ceiling, the endless army, and borderless host theaters before final mobilization can begin."
CBL_one_command: "One Command"
CBL_one_command_desc: "Every Host will use one rank table, one campaign plan, and one reserve schedule. The resulting discipline reaches the front through an increasingly burdened central staff."
CBL_one_command_tt: "Commits to One Command, adds One Command, and opens central-command decisions."
CBL_standardize_host_ranks: "Standardize Host Ranks"
CBL_standardize_host_ranks_desc: "Captains from different origins will recognize the same insignia, duties, and penalties. Training cadres can move between armies without renegotiating authority."
CBL_standardize_host_ranks_tt: "Opens rank-standardization and common-training missions."
CBL_centralize_the_larder_quota: "Centralize the Larder Quota"
CBL_centralize_the_larder_quota_desc: "Regional shares are replaced by quotas calculated from the continental ledger. The center decides which front receives guarded stores and which governor answers for a shortage."
CBL_centralize_the_larder_quota_tt: "Opens central Larder-quota decisions and raises Unified Authority."
CBL_command_without_distance: "Command Without Distance"
CBL_command_without_distance_desc: "Courier stages, radio schedules, and theater priorities carry central orders across continents. Remote fronts gain clear direction while their supply and reporting burdens grow."
CBL_command_without_distance_tt: "Opens remote-command missions and distant-theater priorities."
CBL_the_single_operational_will: "The Single Operational Will"
CBL_the_single_operational_will_desc: "Every theater is synchronized to Hannibal's timetable, from first reconnaissance to the arrival of reserve columns. The army moves as one system despite the distance between its fronts."
CBL_the_single_operational_will_tt: "Upgrades One Command to The Single Operational Will and raises Unified Authority."
CBL_many_jaws: "Many Jaws"
CBL_many_jaws_desc: "Regional Hosts keep their officers, armies, and inherited methods under a common strategic name. Their diversity creates depth and slows the decisions that must bind them together."
CBL_many_jaws_tt: "Commits to Many Jaws, adds Many Jaws, and opens regional-host votes."
CBL_charter_the_regional_hosts: "Charter the Regional Hosts"
CBL_charter_the_regional_hosts_desc: "Each origin Host receives a charter defining its armies, routes, tribute, and obligations to the whole. The charters turn surviving local identity into usable command structure."
CBL_charter_the_regional_hosts_tt: "Opens regional Host charters and regional-army compacts."
CBL_divide_the_campaign_theaters: "Divide the Campaign Theaters"
CBL_divide_the_campaign_theaters_desc: "Continental fronts are assigned to regional commands that understand their terrain and inherited units. Theater boundaries can shift when a Host proves unable to carry its share."
CBL_divide_the_campaign_theaters_tt: "Opens regional-theater missions and theater-command assignments."
CBL_covenant_of_mutual_predation: "Covenant of Mutual Predation"
CBL_covenant_of_mutual_predation_desc: "The Hosts bind themselves to reinforce threatened routes and share the burdens of continental campaigns. Votes over those duties will expose rivalries before they reach the battlefield."
CBL_covenant_of_mutual_predation_tt: "Opens mutual-predation votes and Host-conflict missions."
CBL_confederation_under_one_name: "Confederation Under One Name"
CBL_confederation_under_one_name_desc: "Several armies, traditions, and regional commands act beneath one public identity. Hannibal directs their common war while the Hosts retain the command depth that made them worth preserving."
CBL_confederation_under_one_name_tt: "Upgrades Many Jaws to Confederation Under One Name and raises Unified Authority."
CBL_ritual_administration: "Ritual Administration"
CBL_ritual_administration_desc: "The cult's ranks become offices governing prisoners, districts, punishments, and feeding schedules. Ritual authority gives the state continuity beyond any local warlord."
CBL_ritual_administration_tt: "Commits to Ritual Administration, adds Ritual Administration, and opens ritual-state decisions."
CBL_codify_the_feeding_law: "Codify the Feeding Law"
CBL_codify_the_feeding_law_desc: "Written law defines who may select victims, move captives, claim shares, and punish theft from the Larder. Officials will enforce the code across every controlled district."
CBL_codify_the_feeding_law_tt: "Opens feeding-law decisions and law-enforcement missions."
CBL_ordain_the_punishment_tables: "Ordain the Punishment Tables"
CBL_ordain_the_punishment_tables_desc: "Rank violations, hidden consumption, desertion, and resistance receive fixed punishments witnessed by appointed officers. Public ritual gives the command another instrument of control."
CBL_ordain_the_punishment_tables_tt: "Opens punishment-table decisions and raises Unified Authority."
CBL_census_of_mouths_and_chains: "Census of Mouths and Chains"
CBL_census_of_mouths_and_chains_desc: "Officials count guarded populations, prisoners, recruits, and chains of responsibility across the state. The census connects prison administration to the continental ledger."
CBL_census_of_mouths_and_chains_tt: "Opens the ritual census and prison-administration projects."
CBL_the_state_of_the_last_table: "The State of the Last Table"
CBL_the_state_of_the_last_table_desc: "The Last Table becomes a complete state whose laws govern feeding, command, labor, and punishment. Its durable institutions can control distant populations while drawing organized resistance."
CBL_the_state_of_the_last_table_tt: "Upgrades Ritual Administration to The State of the Last Table and sharply raises Unified Authority."

# ---------------------------------------------------------------------------
# Unified CBL focus tree: Continental Larder and Army
# ---------------------------------------------------------------------------
CBL_central_accounting: "Central Accounting"
CBL_central_accounting_desc: "Storemasters will report every guarded population, moving column, battlefield receipt, and authorized withdrawal through one set of books. Contradictions become targets for an armed audit."
CBL_central_accounting_tt: "Opens central Larder accounting and Larder-audit missions."
CBL_classify_the_consumption_states: "Classify the Consumption States"
CBL_classify_the_consumption_states_desc: "Controlled states are divided by population, damage, resistance, and prior loss. Each stage receives distinct rules for guarding, consuming, rotating, and abandoning the district."
CBL_classify_the_consumption_states_tt: "Opens state classification and staged consumption decisions. Every consumption action still requires control, eligible population, caps, cooldowns, and a recorded Deaths transaction."
CBL_build_the_storage_network: "Build the Storage Network"
CBL_build_the_storage_network_desc: "Guarded depots and repaired roads will hold the reserves moving between feeding districts and fronts. Route projects must keep each store connected to usable transport."
CBL_build_the_storage_network_tt: "Opens storage and Larder-route projects, then adds one Infrastructure level in an owned and controlled route state."
CBL_boards_of_captured_industry: "Boards of Captured Industry"
CBL_boards_of_captured_industry_desc: "Captured engineers and Host overseers will convert workshops for ammunition, repairs, and guarded transport. Production remains tied to controlled factories and seized machinery."
CBL_boards_of_captured_industry_tt: "Opens captured-industry and workshop-conversion projects, then adds one shared building slot and one Military Factory in the owned and controlled capital."
CBL_continental_larder_doctrine: "Continental Larder Doctrine"
CBL_continental_larder_doctrine_desc: "The command must choose how a continent will sustain war: rapid exhaustion, managed reserves, moving columns, or receipts taken after victory. Each method creates a different burden."
CBL_continental_larder_doctrine_tt: "Opens the four mutually exclusive Continental Larder methods and their tradeoff missions."
CBL_burn_through_the_near_states: "Burn Through the Near States"
CBL_burn_through_the_near_states_desc: "Nearby districts will be consumed at the pace demanded by the legions. The resulting surge shortens training and weakens every state left behind."
CBL_burn_through_the_near_states_tt: "Commits to Rapid Consumption, adds Rapid Continental Larder, opens rapid-consumption decisions, and activates state-exhaustion risk."
CBL_feed_the_legion_surge: "Feed the Legion Surge"
CBL_feed_the_legion_surge_desc: "The center will schedule short recruitment surges against districts already marked for rapid consumption. Frenzy rises with the tempo, along with the cost of each additional formation."
CBL_feed_the_legion_surge_tt: "Opens legion-surge decisions, activates escalating recruitment costs, and raises Frenzy. Each surge still requires Larder, equipment, eligible population, state control, caps, and recorded Deaths transactions."
CBL_exhaust_the_frontier: "Exhaust the Frontier"
CBL_exhaust_the_frontier_desc: "A frontier that cannot support another offensive will be stripped, recorded, and abandoned before it traps the army. The policy gives foreign enemies more reason to unite."
CBL_exhaust_the_frontier_tt: "Opens frontier-exhaustion missions and exhausted-state abandonment, then raises World Hostility."
CBL_short_horizon_continent: "A Short-Horizon Continent"
CBL_short_horizon_continent_desc: "The command accepts that districts, workshops, and transport will be consumed faster than they can recover. Victory must arrive before the continental base collapses."
CBL_short_horizon_continent_tt: "Upgrades Rapid Continental Larder to A Short-Horizon Continent and marks the rapid campaign horizon."
CBL_preserve_the_working_herds: "Preserve the Working Herds"
CBL_preserve_the_working_herds_desc: "Guarded populations will rotate between labor, production, and controlled feeding, limiting each surge of consumption. The longer system gives resistance time to organize."
CBL_preserve_the_working_herds_tt: "Commits to Managed Reserves, adds Managed Continental Larder, opens managed-district decisions, and activates organized-resistance risk."
CBL_rotate_the_feeding_districts: "Rotate the Feeding Districts"
CBL_rotate_the_feeding_districts_desc: "Quotas shift between districts so workshops, farms, and transport crews remain usable across a long campaign. Recovery periods become planned parts of the Larder calendar."
CBL_rotate_the_feeding_districts_tt: "Opens feeding-district rotation and district-recovery missions."
CBL_police_the_long_harvest: "Police the Long Harvest"
CBL_police_the_long_harvest_desc: "A slow reserve requires guards, inspectors, and rapid punishment when districts hide people or attack the quota offices. Revolt becomes a permanent cost of preservation."
CBL_police_the_long_harvest_tt: "Opens long-harvest policing and herd-revolt missions, then raises World Hostility."
CBL_managed_continental_reserve: "Managed Continental Reserve"
CBL_managed_continental_reserve_desc: "The feeding districts, workshops, and route guards operate as a continental reserve intended to outlast several campaign seasons. Administration consumes resources that a rapid Host would spend at once."
CBL_managed_continental_reserve_tt: "Upgrades Managed Continental Larder to Managed Continental Reserve and marks the long campaign horizon."
CBL_prisoner_trains: "Prisoner Trains"
CBL_prisoner_trains_desc: "Guarded trains will move captives and stores between fronts before local districts are exhausted. Every route needs escorts, fuel, rolling stock, and a controlled destination."
CBL_prisoner_trains_tt: "Commits to Mobile Routes, adds Mobile Continental Larder, opens prisoner-train decisions, and activates the transport-escort burden."
CBL_escort_the_larder_columns: "Escort the Larder Columns"
CBL_escort_the_larder_columns_desc: "Dedicated guards will protect road and rail columns against raids, escapes, and sabotage. Enemy interdiction can still turn a delayed convoy into a lost reserve."
CBL_escort_the_larder_columns_tt: "Opens Larder-column escort and route-interdiction missions."
CBL_oceanic_hulk_routes: "Oceanic Hulk Routes"
CBL_oceanic_hulk_routes_desc: "Prison hulks and captured transports extend the moving Larder across open water. A coastal yard must repair the vessels while convoys and fuel sustain every voyage."
CBL_oceanic_hulk_routes_tt: "Opens oceanic-hulk and prison-transport actions, then adds one shared building slot and one Dockyard in an owned and controlled coastal state. All voyages remain costed in convoys, fuel, escorts, and valid routes."
CBL_the_larder_that_moves: "The Larder That Moves"
CBL_the_larder_that_moves_desc: "Road columns, prisoner trains, and hulks become one mobile reserve that follows armies between continents. Its reach depends on constant transport work and protected routes."
CBL_the_larder_that_moves_tt: "Upgrades Mobile Continental Larder to The Larder That Moves and opens mobile global routes."
CBL_mark_the_battlefield_yields: "Mark the Battlefield Yields"
CBL_mark_the_battlefield_yields_desc: "Officers will mark battles whose verified losses and captured equipment justify recovery action. Receipts and cooldowns prevent one engagement from being counted repeatedly."
CBL_mark_the_battlefield_yields_tt: "Commits to Battlefield Receipts, adds Battlefield Continental Larder, opens battlefield-yield decisions, and requires harvest caps."
CBL_recovery_battalions: "Recovery Battalions"
CBL_recovery_battalions_desc: "Special battalions follow major victories to secure equipment, prisoners, and usable remains under recorded orders. They deploy only where real battle receipts exist."
CBL_recovery_battalions_tt: "Opens recovery-battalion missions and major-victory receipts."
CBL_convert_the_captured_hospitals: "Convert the Captured Hospitals"
CBL_convert_the_captured_hospitals_desc: "Captured hospitals contain wounded personnel, records, transport, and stores that the Host can process after taking control. Conversion requires a valid site and a paid operation."
CBL_convert_the_captured_hospitals_tt: "Opens captured-hospital conversion and battlefield-processing projects. Each action still requires a controlled site, eligible receipts, population accounting, caps, and its full logistical cost."
CBL_harvest_follows_victory: "Harvest Follows Victory"
CBL_harvest_follows_victory_desc: "Every major victory can trigger a disciplined recovery chain before the front moves on. The army receives more from proven battlefield results without escaping receipt limits."
CBL_harvest_follows_victory_tt: "Upgrades Battlefield Continental Larder to Harvest Follows Victory and opens victory harvests bounded by verified receipts and cooldowns."
CBL_continents_as_supply_regions: "Continents as Supply Regions"
CBL_continents_as_supply_regions_desc: "Roads, guarded stores, and captured capitals will be organized as continental supply regions. Each region needs a working anchor before it can support distant campaigns."
CBL_continents_as_supply_regions_tt: "Opens continental supply regions and network-anchor capitals, then adds one Infrastructure level in an owned and controlled route state."
CBL_abolish_the_old_supply_ceiling: "Abolish the Old Supply Ceiling"
CBL_abolish_the_old_supply_ceiling_desc: "The mature Larder system prepares to replace ordinary supply limits with continental routes, guarded populations, and battlefield receipts. Its full reach also depends on the Army, Expansion, and Counterwar preparations."
CBL_abolish_the_old_supply_ceiling_tt: "Completes the Larder doctrine, but the Last Table preparation activates only after [?constant:cannibalism_unified_operation.larder_package_actions|0] successful paid Larder operations."
CBL_integrate_the_warbands: "Integrate the Warbands"
CBL_integrate_the_warbands_desc: "Submitted warbands must enter a common order of battle without erasing the specialists that made them useful. Conversion teams will inspect each formation before reassignment."
CBL_integrate_the_warbands_tt: "Opens warband integration and template-conversion missions."
CBL_map_the_origin_templates: "Map the Origin Templates"
CBL_map_the_origin_templates_desc: "The command records Island Reavers, Siege Eaters, and March columns as distinct formation families. Their recruitment remains tied to origin capacity and real costs."
CBL_map_the_origin_templates_tt: "Opens separate paid recruitment for each learned Island Reaver, Siege Eater, and March Predation template. Every formation remains bound to its own cap, stockpile gate, eligible population, state control, and recorded Deaths transaction."
CBL_standardize_captured_calibers: "Standardize Captured Calibers"
CBL_standardize_captured_calibers_desc: "Captured weapons will be sorted into serviceable calibers and issued through central workshops. Conversion projects must use equipment already seized or held."
CBL_standardize_captured_calibers_tt: "Opens caliber-standardization and captured-equipment conversion, then adds one shared building slot and one Military Factory in the owned and controlled capital."
CBL_raise_the_cannibal_legions: "Raise the Cannibal Legions"
CBL_raise_the_cannibal_legions_desc: "The main army will be organized as disciplined legions drawn from controlled districts and equipped through the common tables. Formation caps prevent the decree from creating an army without material."
CBL_raise_the_cannibal_legions_tt: "Opens costed Cannibal Legion recruitment and activates the initial legion cap. Every legion requires Larder, equipment, eligible population, state control, and recorded Deaths transactions."
CBL_legion_reinforcement_tables: "Legion Reinforcement Tables"
CBL_legion_reinforcement_tables_desc: "Reinforcement officers will tie every replacement cohort to a controlled district, equipment issue, and recorded population loss. The legions can recover quickly only when those requirements are met."
CBL_legion_reinforcement_tables_tt: "Opens legion reinforcement and requires every replacement cohort to pass through the recorded Deaths ledger."
CBL_legions_of_the_continents: "Legions of the Continents"
CBL_legions_of_the_continents_desc: "Continental theaters receive their own legion cadres and reserve schedules. Expansion of the formation cap follows command capacity rather than an unaccounted manpower grant."
CBL_legions_of_the_continents_tt: "Opens continental legion theaters and upgrades the legion cap. Recruitment remains fully costed."
CBL_bone_guard_command: "Bone Guard Command"
CBL_bone_guard_command_desc: "The Bone Guard becomes a limited elite command for Hannibal and the most difficult assaults. Its equipment and Larder demands keep the formation rare."
CBL_bone_guard_command_tt: "Opens costed Bone Guard recruitment and activates the initial Bone Guard cap. Every formation requires Larder, equipment, eligible population, state control, and recorded Deaths transactions."
CBL_shield_the_supreme_body: "Shield the Supreme Body"
CBL_shield_the_supreme_body_desc: "Guard detachments secure the command capital, leader movements, and succession routes against raids or revolt. A fortified seat gives the elite formations a defensible center."
CBL_shield_the_supreme_body_tt: "Opens leader-protection missions, upgrades the Bone Guard cap, and adds one Land Fort level in the owned and controlled capital."
CBL_breach_the_enemy_capitals: "Breach the Enemy Capitals"
CBL_breach_the_enemy_capitals_desc: "Bone Guard assault plans concentrate engineers, shock troops, and captured intelligence against enemy capitals. The strongest breach remains tied to fully supplied operations."
CBL_breach_the_enemy_capitals_tt: "Opens capital-assault missions and prepares the Bone Guard breach formations for the final army doctrine."
CBL_enemy_collapse_doctrine: "Enemy Collapse Doctrine"
CBL_enemy_collapse_doctrine_desc: "The Host will coordinate fear, cell action, broken supply, and concentrated assault to make organized fronts fail together. Officers will track which enemies are close to collapse."
CBL_enemy_collapse_doctrine_tt: "Opens enemy-collapse decisions and fear-pressure tracking."
CBL_harvest_the_rout: "Harvest the Rout"
CBL_harvest_the_rout_desc: "Retreating armies leave prisoners, equipment, and exposed routes behind them. Recovery missions will act only on verified routs and remain subject to harvest caps."
CBL_harvest_the_rout_tt: "Opens rout-harvest missions and requires receipt caps and cooldowns for every harvest."
CBL_break_the_retreating_fronts: "Break the Retreating Fronts"
CBL_break_the_retreating_fronts_desc: "Pursuit columns and hidden cells will strike retreat routes before a new line can form. A successful break can cascade into neighboring sectors."
CBL_break_the_retreating_fronts_tt: "Opens retreat-disruption and front-cascade missions."
CBL_coordinate_the_three_armies: "Coordinate the Three Armies"
CBL_coordinate_the_three_armies_desc: "Legions, Bone Guard, and collapse formations receive a shared operational calendar. Joint actions combine their roles without merging their caps or costs."
CBL_coordinate_the_three_armies_tt: "Opens three-army coordination and joint-army operations."
CBL_the_army_that_does_not_end: "The Army That Does Not End"
CBL_the_army_that_does_not_end_desc: "The mature army combines rapid reinforcement, relentless pursuit, and Larder-backed recovery. Its final doctrine also depends on the Larder, Expansion, and Counterwar preparations."
CBL_the_army_that_does_not_end_tt: "Completes the Army doctrine, but the Last Table preparation activates only after raising [?constant:cannibalism_unified_operation.army_package_legions|0] Cannibal Legions, [?constant:cannibalism_unified_operation.army_package_bone_guards|0] Bone Guard, and completing [?constant:cannibalism_unified_operation.army_package_operations|0] paid army operations."

# ---------------------------------------------------------------------------
# Unified CBL focus tree: Navy, Air, Cells, Expansion, and World End
# ---------------------------------------------------------------------------
CBL_captured_shipyards: "Captured Shipyards"
CBL_captured_shipyards_desc: "Controlled coastal yards will sort usable hulls, engines, and crews under Host guards. Conversion begins only where a real yard and captured material exist."
CBL_captured_shipyards_tt: "Opens shipyard projects and captured-hull conversion, then adds one shared building slot and one Dockyard in an owned and controlled coastal state."
CBL_raider_flotillas: "Raider Flotillas"
CBL_raider_flotillas_desc: "Small flotillas will hunt weak shipping, screen moving Larders, and scout landing routes. Construction remains limited by hulls, dockyards, fuel, convoys, and trained crews."
CBL_raider_flotillas_tt: "Opens costed raider-flotilla decisions and requires full construction costs for every flotilla."
CBL_prison_hulks: "Prison Hulks"
CBL_prison_hulks_desc: "Captured ships can become guarded transport and holding vessels for ocean routes. Escapes, interception, and escort failure threaten every voyage."
CBL_prison_hulks_tt: "Opens prison-hulk decisions and hulk-escort missions. Each conversion remains costed in valid hulls, convoys, fuel, guards, and controlled ports."
CBL_convoy_hunt_tables: "Convoy Hunt Tables"
CBL_convoy_hunt_tables_desc: "Naval officers will record routes, escorts, losses, and recoverable cargo before authorizing a hunt. One convoy battle cannot supply repeated harvests."
CBL_convoy_hunt_tables_tt: "Opens convoy-hunt missions and requires receipt caps and cooldowns for convoy harvests."
CBL_amphibious_feeding_columns: "Amphibious Feeding Columns"
CBL_amphibious_feeding_columns_desc: "Landing columns combine Island Host methods with continental command. Their assaults need transports, fuel, escorts, equipment, and a viable coastal corridor."
CBL_amphibious_feeding_columns_tt: "Opens costed amphibious-column decisions and landing-corridor missions."
CBL_silent_anchorages: "Silent Anchorages"
CBL_silent_anchorages_desc: "Remote coves and captured ports will shelter raiders, hulks, and courier craft between operations. Every anchorage risks discovery when its traffic grows."
CBL_silent_anchorages_tt: "Opens silent-anchorage projects and activates anchorage-discovery risk."
CBL_island_command_network: "Island Command Network"
CBL_island_command_network_desc: "Island governors, ports, and hidden anchorages receive one reporting chain. The network can integrate scattered territory when its sea routes remain usable."
CBL_island_command_network_tt: "Opens island integration and archipelago-command missions."
CBL_every_ocean_a_corridor: "Every Ocean a Corridor"
CBL_every_ocean_a_corridor_desc: "The Host prepares permanent ocean routes for armies, guarded populations, and Larder columns. Their final reach depends on the mature naval network and the costs of every crossing."
CBL_every_ocean_a_corridor_tt: "Opens global naval corridors and prepares the ocean-crossing plan for final mobilization."
CBL_repair_the_captured_airframes: "Repair the Captured Airframes"
CBL_repair_the_captured_airframes_desc: "Captured aircraft will be inspected, stripped, and repaired at the command capital. Air strength grows only from usable stockpiles and paid workshop projects."
CBL_repair_the_captured_airframes_tt: "Opens airframe-repair projects, requires aircraft stockpile costs, and adds one Air Base level in the owned and controlled capital."
CBL_terror_reconnaissance: "Terror Reconnaissance"
CBL_terror_reconnaissance_desc: "Reconnaissance crews will mark weak headquarters, refugee routes, and supply columns for the Host. Their reports become targets for later air and ground operations."
CBL_terror_reconnaissance_tt: "Opens terror-reconnaissance missions and air-target marking."
CBL_interdiction_markers: "Interdiction Markers"
CBL_interdiction_markers_desc: "Marked railways, depots, ports, and road columns will receive synchronized attacks. The target list follows current enemy supply and shifts with the front."
CBL_interdiction_markers_tt: "Opens supply-interdiction missions and dynamic air-interdiction targets."
CBL_airborne_cell_insertion: "Airborne Cell Insertion"
CBL_airborne_cell_insertion_desc: "Transport aircraft can place small cadres behind distant fronts when range, access, and a valid target permit it. Aircraft, organizers, and supplies remain part of the operation's cost."
CBL_airborne_cell_insertion_tt: "Opens airborne cell insertion and requires transport-aircraft costs for every operation."
CBL_battlefield_recovery_signals: "Battlefield Recovery Signals"
CBL_battlefield_recovery_signals_desc: "Air crews will signal verified wrecks, routs, and casualty concentrations to ground recovery teams. The marks connect reconnaissance to real battlefield receipts."
CBL_battlefield_recovery_signals_tt: "Opens air-directed recovery signals and marked-battlefield missions."
CBL_fear_bombing_tables: "Fear Bombing Tables"
CBL_fear_bombing_tables_desc: "Bombing plans will combine physical damage with timed cell action and targeted panic. Escalation strengthens the world's determination to destroy the Host."
CBL_fear_bombing_tables_tt: "Opens fear-bombing missions, activates escalation risk, and raises World Hostility."
CBL_skies_over_the_larder: "Skies Over the Larder"
CBL_skies_over_the_larder_desc: "Aircraft, couriers, recovery teams, and interdiction markers become one air network above the continental routes. The completed network prepares fronts to collapse under pressure from above and within."
CBL_skies_over_the_larder_tt: "Completes the unified air network and prepares front-collapse operations for final mobilization."
CBL_global_courier_network: "Global Courier Network"
CBL_global_courier_network_desc: "Couriers receive protected stages, replacement papers, and schedules reaching every major theater. The revealed command can direct foreign cells without relying on one exposed route."
CBL_global_courier_network_tt: "Opens the unified cell category and global-courier decisions."
CBL_prison_and_port_cells: "Prison and Port Cells"
CBL_prison_and_port_cells_desc: "Prisons and ports give organizers victims, records, uniforms, and transport. The command will select living foreign nodes linked by usable routes and ignore places it cannot reach."
CBL_prison_and_port_cells_tt: "Opens prison-and-port cell missions against living foreign nodes connected by usable routes."
CBL_corrupt_the_enemy_officers: "Corrupt the Enemy Officers"
CBL_corrupt_the_enemy_officers_desc: "Enemy officers can trade rosters, depot access, and transfer orders for protection or captured goods. Every approach carries a risk of exposure and counterintelligence."
CBL_corrupt_the_enemy_officers_tt: "Opens officer-corruption decisions and corruption-exposure missions."
CBL_perfect_the_false_surrender: "Perfect the False Surrender"
CBL_perfect_the_false_surrender_desc: "Selected cadres will use surrender papers, prisoner routes, and guarded camps to enter enemy rear areas. Discovery can destroy the cell and strengthen the target's defenses."
CBL_perfect_the_false_surrender_tt: "Opens false-surrender decisions and activates false-surrender failure risk."
CBL_sleep_beneath_retreat: "Sleep Beneath Retreat"
CBL_sleep_beneath_retreat_desc: "Cells abandoned during a withdrawal will hide their stores and names until the front passes. Dormant organizers can survive the retreat, but a cleared country cannot re-enter the network without another external route."
CBL_sleep_beneath_retreat_tt: "Opens retreat-cell preservation and dormant-cell missions."
CBL_synchronize_the_uprisings: "Synchronize the Uprisings"
CBL_synchronize_the_uprisings_desc: "Several foreign nodes will receive one timetable for sabotage, mutiny, and seizure of local routes. A target cap limits how many uprisings the command can prepare at once."
CBL_synchronize_the_uprisings_tt: "Opens synchronized-uprising missions and activates the uprising target cap."
CBL_reactivate_the_cured_networks: "Reactivate the Cured Networks"
CBL_reactivate_the_cured_networks_desc: "Locally cured countries can be attacked through new couriers, invasion routes, captured prisoners, or returning cadres. Their old crisis will not revive without a real external operation."
CBL_reactivate_the_cured_networks_tt: "Opens external reinfection and cured-country reactivation missions. Every target requires a valid external route and paid operation."
CBL_the_war_begins_inside: "The War Begins Inside"
CBL_the_war_begins_inside_desc: "Major campaigns will begin with cells already mapping depots, prisons, officers, and retreat routes. Internal operations prepare a front for invasion while remaining vulnerable to counterintelligence."
CBL_the_war_begins_inside_tt: "Completes the internal-front capstone and opens prewar cell operations."
CBL_read_the_continental_weakness: "Read the Continental Weakness"
CBL_read_the_continental_weakness_desc: "The command will score only reachable, usable human targets. Population centers, active cells, prisons, ports, weak supply, adjacency, current wars, and coalition command raise priority. Contamination, distance, and overextension reduce it."
CBL_read_the_continental_weakness_tt: "Opens the unified campaign category and assigns score-banded campaign priorities to eligible targets. The six targeted campaign decisions use the same score."
CBL_terror_ultimata: "Terror Ultimata"
CBL_terror_ultimata_desc: "Selected governments will receive demands backed by nearby armies, cells, and named routes. Refusal opens a campaign process and increases the hostility surrounding the Host."
CBL_terror_ultimata_tt: "Opens terror-ultimatum decisions and refusal missions, then raises World Hostility."
CBL_cell_backed_border_incidents: "Cell-Backed Border Incidents"
CBL_cell_backed_border_incidents_desc: "Foreign cells and border commands will prepare incidents around live targets whose routes can support escalation. A failed operation can expose the network before war begins."
CBL_cell_backed_border_incidents_tt: "Opens cell-backed border-incident decisions and incident-escalation missions, then raises World Hostility."
CBL_host_theaters_without_borders: "Host Theaters Without Borders"
CBL_host_theaters_without_borders_desc: "Continental campaigns become theaters defined by routes, cells, and enemy command, replacing old frontiers. Conquered states enter costed integration and consumption stages after the fighting."
CBL_host_theaters_without_borders_tt: "Opens global campaigns and staged postwar integration. The Expansion preparation activates only after [?constant:cannibalism_unified_operation.expansion_package_campaigns|0] prepared campaigns, [?constant:cannibalism_unified_operation.expansion_package_integrations|0] paid postwar integrations, and [?constant:cannibalism_unified_operation.expansion_package_cells|0] paid cell operations. Conquered states receive neither immediate cores nor automatic annexation."
CBL_measure_world_hostility: "Measure World Hostility"
CBL_measure_world_hostility_desc: "The command will track relief routes, coalition officers, blockades, and states organizing the counterwar. The resulting breakdown identifies current targets as relief routes and coalitions change."
CBL_measure_world_hostility_tt: "Opens the unified counterwar category and the World Hostility breakdown."
CBL_break_the_relief_corridors: "Break the Relief Corridors"
CBL_break_the_relief_corridors_desc: "Coalition supply and evacuation depend on a limited set of ports, rails, roads, and escorted convoys. Attack missions will select corridors the Host can actually reach."
CBL_break_the_relief_corridors_tt: "Opens relief-corridor attack missions and their dynamic target pool."
CBL_sever_the_coalition_command: "Sever the Coalition Command"
CBL_sever_the_coalition_command_desc: "Officers linking the anti-cannibal coalition become targets for corruption, capture, assassination, and cell action. Operations will follow current command relationships."
CBL_sever_the_coalition_command_tt: "Opens coalition-command operations and coalition-officer targets."
CBL_consume_the_counterwar: "Consume the Counterwar"
CBL_consume_the_counterwar_desc: "Captured relief systems, coalition units, and command routes will be processed through the Host's existing cost and population rules. The counterwar becomes another governed source of expansion."
CBL_consume_the_counterwar_tt: "Completes the Counterwar doctrine and opens costed hostility conversion, but the Last Table preparation activates only after [?constant:cannibalism_unified_operation.counterwar_package_operations|0] paid counterwar operations."
CBL_final_global_mobilization: "Final Global Mobilization"
CBL_final_global_mobilization_desc: "The Last Table prepares universal campaigns, guarded population routes, and final consumption under one mobilization order. The order can proceed only while all four ordinary preparations remain complete and Chaos has crossed the world-end threshold."
CBL_final_global_mobilization_tt: "Requires all four Last Table preparations and global Chaos above [?constant:cannibalism_evolution_threshold.world_end_chaos|0]. When valid, opens the final population levy."
CBL_dismantle_the_ordinary_world: "Dismantle the Ordinary World"
CBL_dismantle_the_ordinary_world_desc: "Every remaining state, army, and population center is designated for the final Host. The order can begin only while all four Last Table preparations remain valid and Chaos stays above the world-end threshold."
CBL_dismantle_the_ordinary_world_tt: "Requires all four Last Table preparations, the final population levy, and global Chaos above [?constant:cannibalism_evolution_threshold.world_end_chaos|0]. Completion begins annexation wars against every surviving country, grants the Last Table command, and opens million-person consumption sweeps."
ZZZ_wendigo_bind_the_two_hungers: "Bind the Two Hungers"
ZZZ_wendigo_bind_the_two_hungers_desc: "Hannibal's command joins the discipline of the cannibal hosts to the appetite carried by the surviving Wendigo country. The merged staff will govern both through one chain of orders and one accounting of prey."
ZZZ_wendigo_bind_the_two_hungers_tt: "Raises Unified Authority, Command Power, and Stability."
ZZZ_wendigo_preserve_the_pack: "Preserve the Pack"
ZZZ_wendigo_preserve_the_pack_desc: "The original Wendigo Pack remains the core formation of the transformed country. Its sixteen Wendigo battalions, locked template, and paid muster contract stay intact while the command studies how to sustain further packs."
ZZZ_wendigo_preserve_the_pack_tt: "Preserves the original Wendigo Pack organization, increases its finite training capacity, and grants an Infantry Weapons research bonus."
ZZZ_wendigo_keep_the_larder_ledger: "Keep the Larder Ledger"
ZZZ_wendigo_keep_the_larder_ledger_desc: "The inherited Larder records will remain tied to the routes, cells, and controlled populations that produced them. Officers trained under Hannibal will reconcile those records with the Wendigo command without inventing stores that do not exist."
ZZZ_wendigo_keep_the_larder_ledger_tt: "Raises Unified Authority and Political Power, then grants an Industry research bonus. No Larder is created."
ZZZ_wendigo_bind_the_warlord_commands: "Bind the Warlord Commands"
ZZZ_wendigo_bind_the_warlord_commands_desc: "Retained warlord captains will receive winter sectors beneath Hannibal's direct command. Their origin forces remain recognizable, while disputes over routes and feeding are settled through a single operational order."
ZZZ_wendigo_bind_the_warlord_commands_tt: "Raises Unified Authority, Command Power, and War Support."
ZZZ_wendigo_raise_the_first_anchors: "Raise the First Anchors"
ZZZ_wendigo_raise_the_first_anchors_desc: "The first transformation anchors will be hardened as supply points and defended as the joints of the coming winter network. Each remains tied to its real state, controller, strength, and population history."
ZZZ_wendigo_raise_the_first_anchors_tt: "Strengthens every live transformation anchor, adds a bunker in each owned and controlled anchor state, and raises Unified Authority."
ZZZ_wendigo_open_the_winter_hunt: "Open the Winter Hunt"
ZZZ_wendigo_open_the_winter_hunt_desc: "The winter command ranks reachable enemies by usable population, cold-front evidence, existing cells, supply pressure, physical routes, and coalition leadership before assigning campaign priorities."
ZZZ_wendigo_open_the_winter_hunt_tt: "Applies the scored pre-lock target profile, raises War Support and Command Power, and grants a Land Doctrine research bonus."
ZZZ_wendigo_freeze_the_supply_corridors: "Freeze the Supply Corridors"
ZZZ_wendigo_freeze_the_supply_corridors_desc: "Anchor commands will prepare selected roads and rails for frozen movement while hostile columns lose organization along the same routes. Every corridor remains a paid operation tied to a valid anchor state."
ZZZ_wendigo_freeze_the_supply_corridors_tt: "Opens Frozen Corridor decisions, adds Infrastructure to owned and controlled anchor states, and raises Command Power."
ZZZ_wendigo_march_through_the_blizzard: "March Through the Blizzard"
ZZZ_wendigo_march_through_the_blizzard_desc: "Pack columns will learn to move through blizzards with fewer pauses and tighter supply discipline. Engineers will reinforce the anchor roads that carry the hunt beyond ordinary winter limits."
ZZZ_wendigo_march_through_the_blizzard_tt: "Adds Infrastructure to owned and controlled anchor states and grants a Support Technology research bonus."
ZZZ_wendigo_count_the_winter_victories: "Count the Winter Victories"
ZZZ_wendigo_count_the_winter_victories_desc: "The command snapshots losses already suffered by every current enemy, then records only later positive casualty deltas while that country remains an active enemy. Every full [?constant:cannibalism_wendigo_enemy_death_receipt.casualties_per_receipt|0] new losses may produce one bounded receipt. Those losses are not counted again in Deaths."
ZZZ_wendigo_count_the_winter_victories_tt: "Opens non-retroactive enemy-loss receipts, then raises Unified Authority, Frenzy, and War Support. At most [?constant:cannibalism_wendigo_enemy_death_receipt.per_enemy_cap|0] receipts come from one enemy and at most [?constant:cannibalism_wendigo_enemy_death_receipt.pool_cap|0] may be held."
ZZZ_wendigo_raise_the_winter_network: "Raise the Winter Network"
ZZZ_wendigo_raise_the_winter_network_desc: "The anchor chain becomes a continental feeding network under Hannibal's winter command. The conjoined hunger gives way to the established winter form while every living anchor remains exposed to enemy action."
ZZZ_wendigo_raise_the_winter_network_tt: "Advances the transformation to the Winter Network stage, applies its established idea and leader trait, strengthens live anchors, and raises Command Power."
ZZZ_wendigo_drill_the_original_pack: "Drill the Original Pack"
ZZZ_wendigo_drill_the_original_pack_desc: "The locked sixteen-battalion Wendigo Pack receives a reconnaissance support company. Existing and later Packs must reinforce that support structure from paid manpower and equipment."
ZZZ_wendigo_drill_the_original_pack_tt: "Adds reconnaissance support to the Wendigo Pack without changing its sixteen battalions, then preserves its contract, expands capacity, and grants an Infantry Weapons bonus."
ZZZ_wendigo_open_the_pack_musters: "Open the Pack Musters"
ZZZ_wendigo_open_the_pack_musters_desc: "Live anchors may conduct the existing paid two-Pack musters or spend a bounded enemy-loss receipt on one exact-population, empty Pack muster. Neither method opens normal queue recruitment."
ZZZ_wendigo_open_the_pack_musters_tt: "Opens paid Pack training and receipt-backed one-Pack musters, increases Pack capacity, and raises Command Power."
ZZZ_wendigo_feed_the_anchor_guardians: "Feed the Anchor Guardians"
ZZZ_wendigo_feed_the_anchor_guardians_desc: "Anchor garrisons will be organized around the packs that understand the transformation network best. Dedicated stores and command rotations let more paid Packs guard the chain without creating free formations."
ZZZ_wendigo_feed_the_anchor_guardians_tt: "Strengthens live anchors, expands the paid Wendigo Pack capacity by [?constant:cannibalism_wendigo_focus.pack_capacity_small|0], and raises Command Power."
ZZZ_wendigo_expand_the_hunting_packs: "Expand the Hunting Packs"
ZZZ_wendigo_expand_the_hunting_packs_desc: "The locked Wendigo Pack receives engineer support for prepared assaults. The added company draws normal reinforcement and does not create equipment or manpower."
ZZZ_wendigo_expand_the_hunting_packs_tt: "Adds engineer support to the Wendigo Pack, expands paid Pack capacity, raises Political Power, and grants a Special Forces Doctrine bonus."
ZZZ_wendigo_army_of_the_frozen_larder: "Army of the Frozen Larder"
ZZZ_wendigo_army_of_the_frozen_larder_desc: "The locked Wendigo Pack receives logistics support for extended hunts. The military workshop supports reinforcement, but every formation remains bound to paid population, Larder, equipment, anchor access, and Pack capacity."
ZZZ_wendigo_army_of_the_frozen_larder_tt: "Adds logistics support to the Wendigo Pack, expands paid Pack capacity, adds one Military Factory and one building slot to the controlled capital, and raises Command Power."
ZZZ_wendigo_keep_the_cannibal_legions: "Keep the Cannibal Legions"
ZZZ_wendigo_keep_the_cannibal_legions_desc: "The ordinary cannibal formations absorbed into the merged command keep their officers, operational knowledge, and established route duties. Their experience becomes a disciplined wing of Hannibal's winter host."
ZZZ_wendigo_keep_the_cannibal_legions_tt: "Raises Unified Authority and Stability, then grants a Land Doctrine research bonus."
ZZZ_wendigo_retain_the_warlord_captains: "Retain the Warlord Captains"
ZZZ_wendigo_retain_the_warlord_captains_desc: "Surviving inherited host commanders and bound servants enter the first captain stage. No commander is created, and the country leader is not altered by this order."
ZZZ_wendigo_retain_the_warlord_captains_tt: "Grants eligible inherited army leaders the Bound Captain trait, then raises Command Power, Political Power, and War Support."
ZZZ_wendigo_keep_the_foreign_cells: "Keep the Foreign Cells"
ZZZ_wendigo_keep_the_foreign_cells_desc: "Existing foreign cells may be activated through a paid winter operation that disrupts a current enemy for [?constant:cannibalism_wendigo_inherited_cell.duration_days|0] days. The operation never creates a cell, unit, war goal, population loss, equipment, or Larder."
ZZZ_wendigo_keep_the_foreign_cells_tt: "Opens inherited winter-cell operations, raises Political Power and Unified Authority, and grants an Electronics research bonus."
ZZZ_wendigo_join_the_larder_routes: "Join the Larder Routes"
ZZZ_wendigo_join_the_larder_routes_desc: "Roads from the anchors will be joined to the inherited Larder administration and the command capital. The route network improves movement and processing capacity without creating population or stored flesh."
ZZZ_wendigo_join_the_larder_routes_tt: "Adds Infrastructure to owned and controlled anchor states, adds one Civilian Factory and one building slot to the controlled capital, and grants an Industry research bonus."
ZZZ_wendigo_all_inheritances_intact: "All Inheritances Intact"
ZZZ_wendigo_all_inheritances_intact_desc: "Inherited island, siege, and march formations receive one winter-bound support upgrade when their knowledge and locked template both survive. Eligible captains advance after the required winter victories."
ZZZ_wendigo_all_inheritances_intact_tt: "Applies available inherited formation variants, opens the Winter-Hunt Captain stage, and raises Unified Authority, Stability, and Command Power."
ZZZ_wendigo_link_the_transformation_anchors: "Link the Transformation Anchors"
ZZZ_wendigo_link_the_transformation_anchors_desc: "The live anchors will exchange strength reports, route maps, and warnings of enemy sabotage. A linked chain can support the transformation only while its states remain controlled and its anchors remain alive."
ZZZ_wendigo_link_the_transformation_anchors_tt: "Strengthens every live anchor, adds infrastructure in each owned and controlled anchor state, and raises Political Power."
ZZZ_wendigo_mark_the_irreversible_road: "Mark the Irreversible Road"
ZZZ_wendigo_mark_the_irreversible_road_desc: "The command charts the sequence from the winter network to the transformation countdown. Every step depends on real anchors, territory, consumption, Network Reach, Larder, authority, winter victories, and global Chaos."
ZZZ_wendigo_mark_the_irreversible_road_tt: "Raises Command Power and Unified Authority, then grants a Support Technology research bonus."
ZZZ_wendigo_accelerate_the_transformation: "Accelerate the Transformation"
ZZZ_wendigo_accelerate_the_transformation_desc: "Hannibal authorizes paid operations that force more population and Larder through a selected anchor. Acceleration remains costly, local, and vulnerable to the loss of the anchor chain."
ZZZ_wendigo_accelerate_the_transformation_tt: "Opens countdown acceleration decisions, raises Frenzy, and raises Command Power."
ZZZ_wendigo_stabilize_the_anchor_chain: "Stabilize the Anchor Chain"
ZZZ_wendigo_stabilize_the_anchor_chain_desc: "Anchor officers will spend Larder and command resources to repair weak points before the countdown advances. Stabilization preserves progress by strengthening the actual chain that enemies can still break."
ZZZ_wendigo_stabilize_the_anchor_chain_tt: "Opens countdown stabilization decisions, strengthens live anchors, and raises Political Power."
ZZZ_wendigo_begin_the_countdown: "Begin the Countdown"
ZZZ_wendigo_begin_the_countdown_desc: "The winter network is ready to attempt the irreversible transformation. The countdown can begin only when Chaos, anchors, territory, consumption, Network Reach, winter victories, Unified Authority, and Larder all satisfy the established thresholds."
ZZZ_wendigo_begin_the_countdown_tt: "Completes the countdown route and raises Unified Authority. If every established terminal requirement is present, the transformation countdown begins."
ZZZ_wendigo_begin_the_countdown_available_tt: "Requires the accelerated transformation, stabilized anchor chain, winter network, frozen larder army, and intact inheritances."
ZZZ_wendigo_designate_the_last_hunt: "Designate the Last Hunt"
ZZZ_wendigo_designate_the_last_hunt_desc: "With the full countdown gate satisfied, Hannibal marks the terminal route through the remaining organized world. The designation binds the final hunt to a living anchor network and an active transformation countdown."
ZZZ_wendigo_designate_the_last_hunt_tt: "Raises Unified Authority and Command Power while confirming the active countdown. The terminal route remains incomplete."
ZZZ_wendigo_hunt_every_remaining_capital: "Hunt Every Remaining Capital"
ZZZ_wendigo_hunt_every_remaining_capital_desc: "A paid [?constant:cannibalism_wendigo_terminal_hunt.mission_days|0]-day terminal hunt may target a reachable current enemy. The winter command must force capitulation or control the capital at [?constant:cannibalism_wendigo_terminal_hunt.pressure_goal|0] Hunt Pressure, while the defender can spend reserves to reach [?constant:cannibalism_wendigo_terminal_hunt.counterpressure_goal|0] Counterpressure."
ZZZ_wendigo_hunt_every_remaining_capital_tt: "Opens the launch, mission, press, and defender-break terminal-hunt surfaces, refreshes scored enemy priorities, raises War Support, and grants a Land Doctrine bonus. No free war or formation is created."
ZZZ_wendigo_the_world_beneath_winter: "The World Beneath Winter"
ZZZ_wendigo_the_world_beneath_winter_desc: "The terminal route and paid hunt remain available while the anchor chain survives. This focus does not impose the terminal form. Only a later valid transformation pulse can clear pre-lock operations, apply the lock, and begin scored global war."
ZZZ_wendigo_the_world_beneath_winter_tt: "Completes the terminal route, keeps terminal hunts open, strengthens live anchors, raises Unified Authority and Command Power, refreshes scored priorities, and confirms the countdown. The focus itself does not set the world-end state."

# International response and eligible defeat aftermath
chaosx.nr14.80.t: "A Warlord in Custody"
chaosx.nr14.80.desc: "[cannibalism_captured_warlord.GetLeader], the captured commander of [cannibalism_captured_warlord.GetNameDef], has been removed from the remaining Host formations. Survivor testimony, ration ledgers, burial records, and prisoner lists tie his command to specific districts and named victims. The government must preserve those records while deciding where he will answer for them."
chaosx.nr14.80.a: "Hold a public trial under recorded law."
chaosx.nr14.80.b: "Transfer him to an international tribunal."
chaosx.nr14.80.c: "Return the case to the recovered districts."
chaosx.nr14.80.d: "Trade cooperation for the recovery of captives."
chaosx.nr14.80.e: "Carry out the sentence here."
chaosx.nr14.80.f: "The command convoy arrived empty."
cannibalism_captured_warlord_public_trial_tt: "The warlord is retired from command and his outcome is recorded as a public trial."
cannibalism_captured_warlord_tribunal_tt: "The warlord is retired from command and transferred to an international tribunal with the surviving evidence."
cannibalism_captured_warlord_local_prosecution_tt: "The warlord is retired from command and returned for prosecution in the recovered districts."
cannibalism_captured_warlord_cooperation_tt: "The warlord may identify captive routes and hidden sites. A guarded transfer still carries a small escape risk."
cannibalism_captured_warlord_execution_tt: "The warlord is retired from command and executed. The decision raises War Support but damages Stability."
cannibalism_captured_warlord_anti_decapitation_escape_tt: "The dispersed command extracts the warlord before a prosecution can begin. His escape remains part of the prosecution record. The capitulated country is not restored."
chaosx.nr14.81.t: "The Last Command Prisoner"
chaosx.nr14.81.desc: "Hannibal Lecter has been taken before the terminal lock. His command archives are incomplete, the recovered states remain filled with unmarked losses, and surviving warlords dispute how the collapse occurred. Whatever judgment follows must protect the evidence and the living witnesses. It cannot return the dead or make the feeding states whole."
chaosx.nr14.81.a: "Build the international case."
chaosx.nr14.81.b: "Record the disappearance and preserve the evidence."
chaosx.nr14.81.c: "The government will carry out the sentence."
chaosx.nr14.81.d: "He died with the command line in battle."
cannibalism_captured_hannibal_tribunal_tt: "Hannibal is removed from command and transferred for an international trial. His outcome is fixed in the global record."
cannibalism_captured_hannibal_disappearance_tt: "Hannibal disappears during the collapse. The uncertainty remains part of the recovery record, and he cannot return as a leader."
cannibalism_captured_hannibal_execution_tt: "Hannibal is removed from command and executed. The outcome raises War Support while deepening domestic strain."
cannibalism_captured_hannibal_battle_death_tt: "Hannibal is recorded as dead in the final fighting and removed from every command position."
cannibalism_international_response_category: "International Hunger Response"
cannibalism_international_response_category_desc: "Ordinary governments can commit real troops, equipment, shipping, and command capacity against the international network. Convergence and Island Host actions create wars and exposed objectives with concrete fronts."
cannibalism_reconstruction_category: "Identification, Burial, and Vigilance"
cannibalism_reconstruction_category_desc: "Former feeding states require complete records, rebuilt institutions, memorial safeguards, and a lasting inspection compact. The dead population cannot be restored."
cannibalism_end_terror_exploitation: "Dismantle the Terror Command"
cannibalism_end_terror_exploitation_desc: "Public court records will end the battalion's special authority, remove its surviving command, and place ordinary military supply and discipline over every remaining formation."
cannibalism_end_terror_exploitation_requirements_tt: "Requires a completed public court martial and no terror battalion still deployed in the field."
cannibalism_end_terror_exploitation_effect_tt: "Ends the exploitation policy, restores the open emergency command, and records a permanent renunciation. Returning to exploitation will remain visible in the campaign record."
cannibalism_joint_suppression_operation: "Joint Suppression in [FROM.GetNameDef]"
cannibalism_joint_suppression_operation_desc: "Attach investigators, transport, medical staff, and screened troops to [FROM.GetAdjective] commands. The mission weakens real cells and records which country received assistance."
cannibalism_joint_suppression_cost_text: "£manpower_texticon §Y[?constant:cannibalism_international_response_cost.joint_manpower|0]§!  £command_power §Y[?constant:cannibalism_international_response_cost.joint_command|0]§!  £infantry_equipment_text_icon §Y[?constant:cannibalism_international_response_cost.joint_infantry|0]§!  £support_equipment_text_icon §Y[?constant:cannibalism_international_response_cost.joint_support|0]§!  £motorized_equipment_text_icon §Y[?constant:cannibalism_international_response_cost.joint_trucks|0]§!"
cannibalism_joint_suppression_effect_tt: "Pays the full expedition cost, reduces the target's Cell Strength and Cult Cohesion, restores Command Integrity, weakens Network Reach, and records unique-country suppression credit."
cannibalism_interdict_likely_convergence_host: "Interdict the Likely Convergence Host"
cannibalism_interdict_likely_convergence_host_desc: "Traffic analysis has isolated the Host most likely to become the convergence center. A committed interdiction will expose its routes, weaken its alignment, and begin open counterwar."
cannibalism_convergence_interdiction_cost_text: "£manpower_texticon §Y[?constant:cannibalism_international_response_cost.convergence_manpower|0]§!  £command_power §Y[?constant:cannibalism_international_response_cost.convergence_command|0]§!  £infantry_equipment_text_icon §Y[?constant:cannibalism_international_response_cost.convergence_infantry|0]§!  £support_equipment_text_icon §Y[?constant:cannibalism_international_response_cost.convergence_support|0]§!  £motorized_equipment_text_icon §Y[?constant:cannibalism_international_response_cost.convergence_trucks|0]§!"
cannibalism_convergence_interdiction_effect_tt: "Weakens the selected Host and global Network Reach, records it as the likely convergence target, and begins war if the countries are not already fighting. The reveal is stopped only if that Host falls and the network is broken."
cannibalism_blockade_island_host: "Close the Water Around [FROM.GetNameDef]"
cannibalism_blockade_island_host_desc: "Screened patrols, mine watches, and convoy inspections will deny the Island Host quiet access to surrounding sea lanes."
cannibalism_island_blockade_cost_text: "£command_power §Y[?constant:cannibalism_international_response_cost.blockade_command|0]§!  £navy_experience §Y[?constant:cannibalism_international_response_cost.blockade_navy_experience|0]§!  £convoy_texticon §Y[?constant:cannibalism_international_response_cost.blockade_convoys|0]§!"
cannibalism_island_blockade_effect_tt: "Maintains a costly blockade that damages Host supply, raiding, naval movement, and dockyard output for [?constant:cannibalism_international_response_cost.blockade_days|0] days."
cannibalism_land_against_island_host: "Land the Relief Force in [FROM.GetNameDef]"
cannibalism_land_against_island_host_desc: "A screened landing force will follow the blockade, open protected beaches, and place the Host under direct military pressure."
cannibalism_island_landing_cost_text: "£manpower_texticon §Y[?constant:cannibalism_international_response_cost.landing_manpower|0]§!  £command_power §Y[?constant:cannibalism_international_response_cost.landing_command|0]§!  £infantry_equipment_text_icon §Y[?constant:cannibalism_international_response_cost.landing_infantry|0]§!  £support_equipment_text_icon §Y[?constant:cannibalism_international_response_cost.landing_support|0]§!  £convoy_texticon §Y[?constant:cannibalism_international_response_cost.landing_convoys|0]§!"
cannibalism_island_landing_effect_tt: "Begins the landing counterwar and imposes an organization, defense, reinforcement, and supply penalty on the blockaded Island Host for [?constant:cannibalism_international_response_cost.landing_days|0] days."
cannibalism_rescue_island_host_survivors: "Rescue the Island Host Survivors"
cannibalism_rescue_island_host_survivors_desc: "Landing teams will secure surviving civilians, treatment sites, ration stores, and witness routes before another Host can occupy the abandoned command ground."
cannibalism_island_rescue_cost_text: "£manpower_texticon §Y[?constant:cannibalism_international_response_cost.rescue_manpower|0]§!  £command_power §Y[?constant:cannibalism_international_response_cost.rescue_command|0]§!  £support_equipment_text_icon §Y[?constant:cannibalism_international_response_cost.rescue_support|0]§!  £convoy_texticon §Y[?constant:cannibalism_international_response_cost.rescue_convoys|0]§!"
cannibalism_island_rescue_effect_tt: "Rescues the surviving population, bars the origin state from another Island Host formation, and completes the humanitarian part of the island counterwar."
cannibalism_identify_and_bury_victims: "Identify and Bury the Victims"
cannibalism_identify_and_bury_victims_desc: "Protected teams will match remains to military and civil records, return names to families, and prosecute theft from graves and casualty stations."
cannibalism_aftermath_identification_cost_text: "£manpower_texticon §Y[?constant:cannibalism_reconstruction.identification_manpower|0]§!  £command_power §Y[?constant:cannibalism_reconstruction.identification_command|0]§!  £support_equipment_text_icon §Y[?constant:cannibalism_reconstruction.identification_support|0]§!"
cannibalism_aftermath_identification_effect_tt: "Completes identification and burial work in the selected former feeding state and advances the national recovery burden."
cannibalism_rebuild_feeding_state_institutions: "Rebuild the Feeding State Institutions"
cannibalism_rebuild_feeding_state_institutions_desc: "Administrators, rail crews, hospital staff, prison inspectors, and screened security units will restore the services that predatory commands destroyed."
cannibalism_aftermath_institution_cost_text: "£manpower_texticon §Y[?constant:cannibalism_reconstruction.institution_manpower|0]§!  £command_power §Y[?constant:cannibalism_reconstruction.institution_command|0]§!  £support_equipment_text_icon §Y[?constant:cannibalism_reconstruction.institution_support|0]§!  £motorized_equipment_text_icon §Y[?constant:cannibalism_reconstruction.institution_trucks|0]§!  £train_equipment_text_icon §Y[?constant:cannibalism_reconstruction.institution_trains|0]§!"
cannibalism_aftermath_institution_effect_tt: "Completes institutional recovery in the selected state and replaces the burial emergency with the burden of broken military trust."
cannibalism_complete_memorial_and_inspection_site: "Complete the Memorial and Inspection Site"
cannibalism_complete_memorial_and_inspection_site_desc: "A permanent archive, protected burial ground, supply inspection office, and public memorial will keep the state's losses in the international record."
cannibalism_aftermath_memorial_cost_text: "£manpower_texticon §Y[?constant:cannibalism_reconstruction.memorial_manpower|0]§!  £command_power §Y[?constant:cannibalism_reconstruction.memorial_command|0]§!  £support_equipment_text_icon §Y[?constant:cannibalism_reconstruction.memorial_support|0]§!"
cannibalism_aftermath_memorial_effect_tt: "Finishes reconstruction in the selected former feeding state, records the country's contribution, and installs permanent local vigilance."
cannibalism_ratify_international_inspection_compact: "Ratify the International Inspection Compact"
cannibalism_ratify_international_inspection_compact_desc: "The compact protects casualty and burial records, regulates prisoner transfers, exchanges cult intelligence, and prepares rapid responses for isolated ports, islands, and prisons."
cannibalism_compact_ratification_requirements_tt: "Requires every former feeding state owned by this country to finish reconstruction, plus command staff, support equipment, convoys, and trains."
cannibalism_compact_ratification_cost_text: "£command_power §Y[?constant:cannibalism_reconstruction.compact_command|0]§!  £support_equipment_text_icon §Y[?constant:cannibalism_reconstruction.compact_support|0]§!  £convoy_texticon §Y[?constant:cannibalism_reconstruction.compact_convoys|0]§!  £train_equipment_text_icon §Y[?constant:cannibalism_reconstruction.compact_trains|0]§!"
cannibalism_compact_ratification_effect_tt: "Begins a [?constant:cannibalism_reconstruction.compact_duration_days|0]-day vigilance mission and replaces the temporary supply recovery with Permanent Vigilance."
cannibalism_maintain_international_inspection_compact: "Maintain the Inspection Compact"
cannibalism_maintain_international_inspection_compact_desc: "For [?constant:cannibalism_reconstruction.compact_duration_days|0] days the country must preserve its records, reconstructed states, inspection staff, and international commitments."
cannibalism_compact_vigilance_success_tt: "The country has maintained the inspection and memory system for [?constant:cannibalism_reconstruction.compact_duration_days|0] days."
cannibalism_compact_vigilance_failure_tt: "The inspection compact has lost the records, reconstructed obligations, or international stability needed to continue."
cannibalism_island_host_blockade: "Island Host Under Blockade"
cannibalism_island_host_blockade_desc: "Patrols and inspection cordons have severed the Host's quiet sea routes and strained every protected anchorage."
cannibalism_island_host_landing_pressure: "Relief Force Ashore"
cannibalism_island_host_landing_pressure_desc: "A screened landing force is holding protected beaches and pushing into the Host's ration and command districts."
cannibalism_wendigo_transformation_anchor: "Transformation Anchor"
cannibalism_wendigo_transformation_anchor_desc: "A fortified feeding and supply nexus binds the winter network to this state's population, transport, and defenders. Its strength sustains the transformation while it remains under the Winter Host's control."
cannibalism_wendigo_broken_anchor_recovery: "Broken Anchor Recovery"
cannibalism_wendigo_broken_anchor_recovery_desc: "The destroyed nexus left frozen stores, damaged routes, scattered victims, and a command structure built around predation. Recovery will take years of protected relief and reconstruction."
cannibalism_wendigo_frozen_supply_corridor: "Frozen Supply Corridor"
cannibalism_wendigo_frozen_supply_corridor_desc: "Pack engineers and anchor crews have hardened this route for the Winter Host, keeping its columns supplied through severe cold and ruined infrastructure."
cannibalism_wendigo_frozen_supply_disruption: "Frozen Supply Disruption"
cannibalism_wendigo_frozen_supply_disruption_desc: "The adjoining winter network chokes movement through this state, breaking timetables, freezing depots, and exhausting formations before they reach the front."
cannibalism_liberated_feeding_states: "Liberated Feeding States"
cannibalism_liberated_feeding_states_desc: "Liberation stopped active consumption, but damaged supply, missing residents, and destroyed administration impose an immediate national emergency."
cannibalism_identification_and_burial_emergency: "Identification and Burial Emergency"
cannibalism_identification_and_burial_emergency_desc: "The country is protecting burial work, reconstructing casualty records, supporting families, and prosecuting theft from the dead."
cannibalism_broken_military_trust: "Broken Military Trust"
cannibalism_broken_military_trust_desc: "Officers, prisons, field kitchens, casualty stations, and transfer systems must be screened before ordinary command can be trusted again."
cannibalism_rebuilt_supply_discipline: "Rebuilt Supply Discipline"
cannibalism_rebuilt_supply_discipline_desc: "Audited depots, protected records, and restored transport have replaced the improvised systems that allowed predatory commands to hide."
cannibalism_permanent_vigilance: "Permanent Vigilance"
cannibalism_permanent_vigilance_desc: "Inspection staffs, protected archives, and rapid response agreements remain after reconstruction, carrying the memory of what was lost."
cannibalism_international_inspection_compact: "International Inspection Compact"

# Triggerable Scenario 010
chaosx.scenarios.entry.id.cannibalism: "#010"
chaosx.scenarios.cannibalism.name: "The Hunger Lines"
chaosx.scenarios.cannibalism.desc.discipline_collapse: "A wartime supply crisis has broken discipline inside selected formations. Field Hunger rises while damaged commands attempt containment before predation spreads beyond the first theaters."
chaosx.scenarios.cannibalism.desc.ritual_cells: "Officer circles and hidden field kitchens have become organized ritual cells. Cult Cohesion is already visible, and several countries may begin with compromised commands."
chaosx.scenarios.cannibalism.desc.silent_islands: "Remote ports and island garrisons have fallen quiet behind broken convoy schedules. Communes begin with mature cells, exposed sea routes, and a growing risk of armed island hosts."
chaosx.scenarios.cannibalism.desc.warlord_states: "Armed host countries emerge from occupied feeding grounds. Each begins with a regional command, an origin doctrine, scavenged stores, and forces raised from the territory it has seized."
chaosx.scenarios.cannibalism.desc.convergence: "Several mature host countries answer a common signal. A public convergence warning begins after launch, leaving the world time to destroy the likely hosts and sever their routes before a final authority emerges."
chaosx.scenarios.type.cannibalism.discipline_collapse: "Discipline Collapse"
chaosx.scenarios.type.cannibalism.ritual_cells: "Ritual Cells"
chaosx.scenarios.type.cannibalism.silent_islands: "Silent Islands"
chaosx.scenarios.type.cannibalism.warlord_states: "Warlord States"
chaosx.scenarios.type.cannibalism.convergence: "Convergence"
chaosx.scenarios.cannibalism.impact.low: "A narrow crisis begins with limited territory and forces. Containment remains possible, but delay will strengthen the cells."
chaosx.scenarios.cannibalism.impact.medium: "Several formations or theaters enter the crisis. Supply pressure, concealment, and foreign routes will demand an organized response."
chaosx.scenarios.cannibalism.impact.high: "Mature cells and armed hosts begin with strong cohesion, severe command damage, and multiple routes across the map."
chaosx.scenarios.cannibalism.impact.maximum: "A broad international network begins with numerous theaters and host countries. Escalation is immediate, but its supply lines, leaders, territories, and convergence routes can still be attacked."

# Unified CBL operational contracts
cannibalism_unified_focus_tree: "The Continental Host"
cannibalism_unified_command_category: "The Continental Command"
cannibalism_unified_command_category_desc: "Hannibal's completed command preparations expand the reach of paid operational orders. World Hostility mobilizes at [?constant:cannibalism_unified_hostility.pressure_threshold|0], [?constant:cannibalism_unified_hostility.mobilized_threshold|0], and [?constant:cannibalism_unified_hostility.total_threshold|0], raising costs and imposing increasingly severe counterpressure."
cannibalism_unified_larder_category: "The Continental Larder"
cannibalism_unified_larder_category_desc: "Storage and consumption orders turn the chosen Larder doctrine into exact population losses entered in the casualty and disappearance rolls."
cannibalism_unified_war_machine_category: "The War Machine"
cannibalism_unified_war_machine_category_desc: "Army, naval, and air mobilization converts population and existing reserves into temporary operational strength. No formation or operation receives free equipment."
cannibalism_unified_global_campaign_category: "Campaigns Without Borders"
cannibalism_unified_global_campaign_category_desc: "Foreign cells, prepared wars, occupied-state integration, and attacks on coalition command carry the Host's apparatus beyond its original borders."
cannibalism_unified_world_end_category: "Final Global Mobilization"
cannibalism_unified_world_end_category_desc: "The completed apparatus can be driven into one last consumption effort. After the global mobilization begins, conquered provinces can be emptied to keep every front in motion."

cannibalism_unified_absorb_warlord: "Absorb an Autonomous Warlord"
cannibalism_unified_absorb_warlord_desc: "End the charter of one autonomous warlord subject and absorb its troops, territory, Larder share, and retained commander into the unified host."
cannibalism_unified_absorb_warlord_requirements_tt: "Requires an autonomous warlord subject at peace with our command, [?cannibalism_unified_absorb_larder_cost|0] Larder, and [?cannibalism_unified_absorb_command_cost|0] Command Power."
cannibalism_unified_absorb_warlord_cost_text: "[?cannibalism_unified_absorb_larder_cost|0] Larder, [?cannibalism_unified_absorb_command_cost|0] Command Power"
cannibalism_unified_absorb_warlord_effect_tt: "Territory, divisions, stores, and the retained commander pass into the unified Host after the full command cost is paid."
cannibalism_unified_appoint_governor: "Appoint a Regional Governor"
cannibalism_unified_appoint_governor_desc: "Place one owned and controlled state under a paid regional governor. This action belongs to the retained-host and many-jaws routes."
cannibalism_unified_appoint_governor_requirements_tt: "Requires the retained-host or many-jaws route, a state without a unified governor, [?cannibalism_unified_governor_manpower_cost|0] manpower, [?cannibalism_unified_governor_support_cost|0] support equipment, and [?cannibalism_unified_governor_command_cost|0] Command Power."
cannibalism_unified_appoint_governor_cost_text: "[?cannibalism_unified_governor_manpower_cost|0] Manpower, [?cannibalism_unified_governor_support_cost|0] Support Equipment, [?cannibalism_unified_governor_command_cost|0] Command Power"
cannibalism_unified_appoint_governor_effect_tt: "Pays the administrative cost, adds infrastructure and permanent local administration, raises Unified Authority, and counts toward proving the continental chain of command."
cannibalism_unified_purge_rival: "Purge a Resistant Rival"
cannibalism_unified_purge_rival_desc: "The broken-warlord hierarchy can spend stores and staff authority to damage one resistant or challenging warlord already at war with us."
cannibalism_unified_purge_rival_requirements_tt: "Requires the Break the Warlords route, a resistant warlord enemy, [?cannibalism_unified_purge_larder_cost|0] Larder, [?cannibalism_unified_purge_support_cost|0] support equipment, [?cannibalism_unified_purge_command_cost|0] Command Power, and [?cannibalism_unified_purge_army_experience_cost|0] Army Experience."
cannibalism_unified_purge_rival_cost_text: "[?cannibalism_unified_purge_larder_cost|0] Larder, [?cannibalism_unified_purge_support_cost|0] Support Equipment, [?cannibalism_unified_purge_command_cost|0] Command Power, [?cannibalism_unified_purge_army_experience_cost|0] Army Experience"
cannibalism_unified_purge_rival_effect_tt: "Pays the full purge cost, weakens the rival's defence and organization, raises authority and hostility, and advances the command mission."

cannibalism_unified_issue_continental_command: "Issue a Continental Command"
cannibalism_unified_issue_continental_command_desc: "Commit stores, command power, and staff experience to an order shaped by the selected warlord settlement and supreme hierarchy. Further command preparations lengthen the operation."
cannibalism_unified_command_operation_requirements_tt: "Requires [?cannibalism_unified_command_larder_cost|0] Larder, [?cannibalism_unified_command_power_cost|0] Command Power, and [?cannibalism_unified_command_army_experience_cost|0] Army Experience."
cannibalism_unified_command_operation_cost_text: "[?cannibalism_unified_command_larder_cost|0] Larder, [?cannibalism_unified_command_power_cost|0] Command Power, [?cannibalism_unified_command_army_experience_cost|0] Army Experience"
cannibalism_unified_command_operation_effect_tt: "Pays the full command cost, applies a temporary planning operation, and counts toward the active command timetable. The chosen hierarchy determines the authority, alignment, network, and hostility result."
cannibalism_unified_command_mission: "Prove the Continental Chain of Command"
cannibalism_unified_command_mission_desc: "Accumulate [?cannibalism_unified_command_mission_goal|0] command progress before the route-shaped timetable expires."
cannibalism_unified_command_mission_objective_tt: "Accumulate [?cannibalism_unified_command_mission_goal|0] paid Continental Command progress."
cannibalism_unified_command_mission_success_tt: "The chain of command holds and Unified Authority rises by [?cannibalism_unified_command_mission_success_authority|0]."
cannibalism_unified_command_mission_partial_tt: "The partial timetable raises Unified Authority by [?cannibalism_unified_command_mission_partial_authority|0]."
cannibalism_unified_command_mission_failure_tt: "The timetable collapses: Unified Authority changes by [?cannibalism_unified_command_mission_failure_authority|0], and route exposure may raise World Hostility."

cannibalism_unified_centralize_larder: "Centralize the Larder"
cannibalism_unified_centralize_larder_desc: "Commit transport staff and stores to one controlled state. The project adds infrastructure and turns accumulated Larder preparations into a longer national storage benefit."
cannibalism_unified_storage_requirements_tt: "Requires a controlled state without a completed storage link, [?cannibalism_unified_storage_manpower_cost|0] manpower, [?cannibalism_unified_storage_support_cost|0] support equipment, and [?cannibalism_unified_storage_train_cost|0] trains."
cannibalism_unified_storage_cost_text: "[?cannibalism_unified_storage_manpower_cost|0] Manpower, [?cannibalism_unified_storage_support_cost|0] Support Equipment, [?cannibalism_unified_storage_train_cost|0] Trains"
cannibalism_unified_storage_effect_tt: "Pays the project cost, adds one infrastructure level, and counts toward keeping the continental ledger moving."
cannibalism_unified_convert_captured_workshop: "Convert a Captured Workshop"
cannibalism_unified_convert_captured_workshop_desc: "Reopen one controlled industrial site as a guarded Larder workshop. The state receives a permanent paid conversion and one Military Factory."
cannibalism_unified_captured_workshop_requirements_tt: "Requires captured-industry projects and workshop conversion, a controlled state without a converted workshop, [?cannibalism_unified_workshop_manpower_cost|0] manpower, [?cannibalism_unified_workshop_support_cost|0] support equipment, and [?cannibalism_unified_workshop_train_cost|0] trains."
cannibalism_unified_captured_workshop_cost_text: "[?cannibalism_unified_workshop_manpower_cost|0] Manpower, [?cannibalism_unified_workshop_support_cost|0] Support Equipment, [?cannibalism_unified_workshop_train_cost|0] Trains"
cannibalism_unified_captured_workshop_effect_tt: "Pays the conversion cost, establishes a guarded workshop, adds one Military Factory, and advances the Larder timetable."
cannibalism_unified_abandon_exhausted_frontier: "Abandon an Exhausted Frontier"
cannibalism_unified_abandon_exhausted_frontier_desc: "Withdraw the feeding apparatus from a frontier already exhausted by rapid consumption and leave its administration to decay."
cannibalism_unified_frontier_abandonment_requirements_tt: "Requires an exhausted controlled state and [?cannibalism_unified_frontier_abandon_command_cost|0] Command Power."
cannibalism_unified_frontier_abandonment_cost_text: "[?cannibalism_unified_frontier_abandon_command_cost|0] Command Power"
cannibalism_unified_frontier_abandonment_effect_tt: "Pays the withdrawal cost, replaces exhaustion with a permanent abandoned-frontier administration, raises Unified Authority, and advances the Larder timetable."
cannibalism_unified_designate_feeding_capital: "Designate a Feeding Capital"
cannibalism_unified_designate_feeding_capital_desc: "Choose one owned and controlled usable state as the permanent administrative capital of the continental Larder."
cannibalism_unified_feeding_capital_requirements_tt: "Requires central accounting and state classification, one usable controlled state, [?cannibalism_unified_feeding_capital_larder_cost|0] Larder, [?cannibalism_unified_feeding_capital_manpower_cost|0] manpower, [?cannibalism_unified_feeding_capital_support_cost|0] support equipment, and [?cannibalism_unified_feeding_capital_command_cost|0] Command Power."
cannibalism_unified_feeding_capital_cost_text: "[?cannibalism_unified_feeding_capital_larder_cost|0] Larder, [?cannibalism_unified_feeding_capital_manpower_cost|0] Manpower, [?cannibalism_unified_feeding_capital_support_cost|0] Support Equipment, [?cannibalism_unified_feeding_capital_command_cost|0] Command Power"
cannibalism_unified_feeding_capital_effect_tt: "Pays the full administrative cost, moves the capital, adds infrastructure, and counts toward keeping the continental ledger moving."
cannibalism_unified_rapid_consumption: "Burn Through the Near State"
cannibalism_unified_rapid_consumption_desc: "The rapid route removes a large population block for immediate Larder yield. The entire loss enters the state's casualty and disappearance rolls."
cannibalism_unified_rapid_consumption_requirements_tt: "Requires a controlled usable state with at least [?constant:cannibalism_unified_decision_cost.rapid_minimum_population_k|0]K population and [?cannibalism_unified_rapid_command_cost|0] Command Power."
cannibalism_unified_rapid_consumption_cost_text: "[?constant:cannibalism_unified_decision_cost.rapid_population_k|0]K State Population, [?cannibalism_unified_rapid_command_cost|0] Command Power"
cannibalism_unified_rapid_consumption_effect_tt: "Removes exactly [?constant:cannibalism_unified_decision_cost.rapid_population_k|0]K people from the selected state, applies the feeding yield, and counts toward keeping the continental ledger moving."
cannibalism_unified_managed_consumption: "Rotate a Managed Feeding District"
cannibalism_unified_managed_consumption_desc: "The managed route takes a smaller population block through a quieter Larder transaction."
cannibalism_unified_managed_consumption_requirements_tt: "Requires a controlled usable state with at least [?constant:cannibalism_unified_decision_cost.managed_minimum_population_k|0]K population, [?cannibalism_unified_managed_command_cost|0] Command Power, and [?cannibalism_unified_managed_support_cost|0] support equipment."
cannibalism_unified_managed_consumption_cost_text: "[?constant:cannibalism_unified_decision_cost.managed_population_k|0]K State Population, [?cannibalism_unified_managed_command_cost|0] Command Power, [?cannibalism_unified_managed_support_cost|0] Support Equipment"
cannibalism_unified_managed_consumption_effect_tt: "Removes exactly [?constant:cannibalism_unified_decision_cost.managed_population_k|0]K people from the selected state, applies the silent Larder yield, and counts toward keeping the continental ledger moving."
cannibalism_unified_mobile_consumption: "Move the Prisoner Trains"
cannibalism_unified_mobile_consumption_desc: "The mobile route spends rolling stock and trucks to move a paid population harvest through the continental network."
cannibalism_unified_mobile_consumption_requirements_tt: "Requires a controlled usable state with at least [?constant:cannibalism_unified_decision_cost.mobile_minimum_population_k|0]K population, [?cannibalism_unified_mobile_command_cost|0] Command Power, [?cannibalism_unified_mobile_truck_cost|0] trucks, [?cannibalism_unified_mobile_train_cost|0] trains, [?cannibalism_unified_mobile_support_cost|0] support equipment, [?cannibalism_unified_mobile_convoy_cost|0] convoys, and [?cannibalism_unified_mobile_fuel_cost|0] fuel."
cannibalism_unified_mobile_consumption_cost_text: "[?constant:cannibalism_unified_decision_cost.mobile_population_k|0]K State Population, [?cannibalism_unified_mobile_command_cost|0] Command Power, [?cannibalism_unified_mobile_truck_cost|0] Trucks, [?cannibalism_unified_mobile_train_cost|0] Trains, [?cannibalism_unified_mobile_support_cost|0] Support Equipment, [?cannibalism_unified_mobile_convoy_cost|0] Convoys, [?cannibalism_unified_mobile_fuel_cost|0] Fuel"
cannibalism_unified_mobile_consumption_effect_tt: "Removes exactly [?constant:cannibalism_unified_decision_cost.mobile_population_k|0]K people from the selected state, spends the transport reserve, and counts toward keeping the continental ledger moving."
cannibalism_unified_battlefield_consumption: "Process the Battlefield Yield"
cannibalism_unified_battlefield_consumption_desc: "The battlefield route commits recovery equipment to a smaller harvest taken under the battlefield accounting rules."
cannibalism_unified_battlefield_consumption_requirements_tt: "Requires a controlled usable state with at least [?constant:cannibalism_unified_decision_cost.battlefield_minimum_population_k|0]K population, [?cannibalism_unified_battlefield_command_cost|0] Command Power, and [?cannibalism_unified_battlefield_support_cost|0] support equipment. Once harvest caps apply, it also requires [?constant:cannibalism_unified_profile.one|0] receipt earned from a distinct enemy capitulation."
cannibalism_unified_battlefield_consumption_cost_text: "[?constant:cannibalism_unified_decision_cost.battlefield_population_k|0]K State Population, [?cannibalism_unified_battlefield_command_cost|0] Command Power, [?cannibalism_unified_battlefield_support_cost|0] Support Equipment, [?constant:cannibalism_unified_profile.one|0] Victory Receipt"
cannibalism_unified_battlefield_consumption_effect_tt: "Removes exactly [?constant:cannibalism_unified_decision_cost.battlefield_population_k|0]K people from the selected state, spends the recovery equipment and [?constant:cannibalism_unified_profile.one|0] required receipt, and advances the continental ledger."
cannibalism_unified_larder_mission: "Keep the Continental Ledger Moving"
cannibalism_unified_larder_mission_desc: "Accumulate [?cannibalism_unified_larder_mission_goal|0] Larder progress before the route-shaped timetable expires."
cannibalism_unified_larder_mission_objective_tt: "Accumulate [?cannibalism_unified_larder_mission_goal|0] paid Larder progress."
cannibalism_unified_larder_mission_success_tt: "The ledger closes cleanly and Unified Authority rises by [?cannibalism_unified_larder_mission_success_authority|0]."
cannibalism_unified_larder_mission_partial_tt: "The partial ledger raises World Hostility by [?cannibalism_unified_larder_mission_partial_hostility|0]."
cannibalism_unified_larder_mission_failure_tt: "The routes seize up and World Hostility rises by [?cannibalism_unified_larder_mission_failure_hostility|0]."

cannibalism_unified_establish_air_program_foundation: "Establish an Air Program Foundation"
cannibalism_unified_establish_air_program_foundation_desc: "If the inherited host has no usable air base, air experience, or captured airframes, a paid conversion project can establish the foundation required by the air branch."
cannibalism_unified_air_foundation_requirements_tt: "Requires captured-equipment conversion, no existing air-program foundation, [?cannibalism_unified_air_foundation_manpower_cost|0] manpower, [?cannibalism_unified_air_foundation_support_cost|0] support equipment, and [?cannibalism_unified_air_foundation_fuel_cost|0] fuel."
cannibalism_unified_air_foundation_cost_text: "[?cannibalism_unified_air_foundation_manpower_cost|0] Manpower, [?cannibalism_unified_air_foundation_support_cost|0] Support Equipment, [?cannibalism_unified_air_foundation_fuel_cost|0] Fuel"
cannibalism_unified_air_foundation_effect_tt: "Pays the project cost and builds one air-base level in the capital."
cannibalism_unified_air_program_foundation_tt: "Requires a controlled air base, more than [?constant:cannibalism_unified_operation.air_program_experience_gate|0] Air Experience, or more than [?constant:cannibalism_unified_operation.air_program_airframe_gate|0] small airframes. The War Machine offers a paid foundation project when none of these are available."
cannibalism_unified_create_cannibal_legion: "Create a Cannibal Legion"
cannibalism_unified_create_cannibal_legion_desc: "Convert one exact population block into replacement manpower, then create a Feast Cohort formation with no starting manpower and no starting equipment. Existing stockpiles must equip it."
cannibalism_unified_legion_requirements_tt: "Requires legion capacity, a controlled state with at least [?constant:cannibalism_unified_decision_cost.legion_minimum_population_k|0]K population, [?cannibalism_unified_legion_larder_cost|0] Larder, and reserves of [?cannibalism_unified_legion_infantry_reserve|0] infantry equipment and [?cannibalism_unified_legion_support_reserve|0] support equipment."
cannibalism_unified_legion_cost_text: "[?cannibalism_unified_legion_population_cost_k|0]K State Population, [?cannibalism_unified_legion_larder_cost|0] Larder"
cannibalism_unified_legion_effect_tt: "Removes exactly [?cannibalism_unified_legion_population_cost_k|0]K people from the selected state, converts that loss into manpower, and creates one empty Cannibal Legion formation."
cannibalism_unified_surge_cannibal_legion: "Surge a Cannibal Legion"
cannibalism_unified_surge_cannibal_legion_desc: "Force another Cannibal Legion through the rapid Larder schedule. Every Legion and Bone Guard already raised increases the shared Larder cost of subsequent formations."
cannibalism_unified_legion_surge_requirements_tt: "Requires the rapid Legion-surge apparatus, Legion capacity, an eligible controlled state, the displayed escalating Larder payment, and the full equipment reserve."
cannibalism_unified_legion_surge_effect_tt: "Pays the escalating Larder cost, records the exact population loss through Deaths accounting, converts it into manpower, and creates one empty Cannibal Legion formation."
cannibalism_unified_raise_bone_guard: "Raise a Bone Guard"
cannibalism_unified_raise_bone_guard_desc: "Convert one exact population block into replacement manpower for a Bone Guard formation created without free manpower or equipment."
cannibalism_unified_bone_guard_requirements_tt: "Requires Bone Guard capacity, a controlled state with at least [?constant:cannibalism_unified_decision_cost.bone_guard_minimum_population_k|0]K population, [?cannibalism_unified_bone_guard_larder_cost|0] Larder, and reserves of [?cannibalism_unified_bone_guard_infantry_reserve|0] infantry equipment, [?cannibalism_unified_bone_guard_support_reserve|0] support equipment, and [?cannibalism_unified_bone_guard_artillery_reserve|0] artillery."
cannibalism_unified_bone_guard_cost_text: "[?cannibalism_unified_bone_guard_population_cost_k|0]K State Population, [?cannibalism_unified_bone_guard_larder_cost|0] Larder"
cannibalism_unified_bone_guard_effect_tt: "Removes exactly [?cannibalism_unified_bone_guard_population_cost_k|0]K people from the selected state, converts that loss into manpower, and creates one empty Bone Guard formation."
cannibalism_unified_launch_continental_hunt: "Launch a Continental Hunt"
cannibalism_unified_launch_continental_hunt_desc: "Spend command power, staff experience, and fuel on a temporary continental offensive. Mature army preparations determine its duration."
cannibalism_unified_recruit_island_reavers: "Recruit Island Reavers"
cannibalism_unified_recruit_island_reavers_desc: "Recreate the independently preserved Island Reaver command without free equipment or manpower."
cannibalism_unified_island_specialist_requirements_tt: "Requires mapped Island Host knowledge, an Island Reaver slot below the cap of [?cannibalism_unified_origin_specialist_cap|0], a controlled state with at least [?constant:cannibalism_unified_decision_cost.origin_specialist_minimum_population_k|0]K population, [?cannibalism_unified_origin_specialist_larder_cost|0] Larder, [?cannibalism_unified_origin_specialist_infantry_reserve|0] infantry equipment, and [?cannibalism_unified_origin_specialist_support_reserve|0] support equipment."
cannibalism_unified_island_specialist_effect_tt: "Removes the exact population block through Deaths accounting, converts it into manpower, and creates one Island Reavers formation at zero starting manpower and equipment."
cannibalism_unified_recruit_siege_eaters: "Recruit Siege Eaters"
cannibalism_unified_recruit_siege_eaters_desc: "Recreate the independently preserved Siege Eater command without free equipment or manpower."
cannibalism_unified_siege_specialist_requirements_tt: "Requires mapped Siege Commune knowledge, a Siege Eater slot below the cap of [?cannibalism_unified_origin_specialist_cap|0], a controlled state with at least [?constant:cannibalism_unified_decision_cost.origin_specialist_minimum_population_k|0]K population, [?cannibalism_unified_origin_specialist_larder_cost|0] Larder, [?cannibalism_unified_origin_specialist_infantry_reserve|0] infantry equipment, [?cannibalism_unified_origin_specialist_support_reserve|0] support equipment, and [?cannibalism_unified_origin_specialist_artillery_reserve|0] artillery."
cannibalism_unified_siege_specialist_effect_tt: "Removes the exact population block through Deaths accounting, converts it into manpower, and creates one Siege Eaters formation at zero starting manpower and equipment."
cannibalism_unified_recruit_march_predation_column: "Recruit a March Predation Column"
cannibalism_unified_recruit_march_predation_column_desc: "Recreate the independently preserved March Host column without free equipment or manpower."
cannibalism_unified_march_specialist_requirements_tt: "Requires mapped March Host knowledge, a March Predation slot below the cap of [?cannibalism_unified_origin_specialist_cap|0], a controlled state with at least [?constant:cannibalism_unified_decision_cost.origin_specialist_minimum_population_k|0]K population, [?cannibalism_unified_origin_specialist_larder_cost|0] Larder, [?cannibalism_unified_origin_specialist_infantry_reserve|0] infantry equipment, [?cannibalism_unified_origin_specialist_support_reserve|0] support equipment, and [?cannibalism_unified_origin_specialist_motorized_reserve|0] trucks."
cannibalism_unified_march_specialist_effect_tt: "Removes the exact population block through Deaths accounting, converts it into manpower, and creates one March Predation Column at zero starting manpower and equipment."
cannibalism_unified_origin_specialist_cost_text: "[?cannibalism_unified_origin_specialist_population_cost_k|0]K State Population, [?cannibalism_unified_origin_specialist_larder_cost|0] Larder"
cannibalism_unified_army_operation_requirements_tt: "Requires joint army operations, the second army preparation, [?cannibalism_unified_army_command_cost|0] Command Power, [?cannibalism_unified_army_experience_cost|0] Army Experience, [?cannibalism_unified_army_fuel_cost|0] fuel, and [?cannibalism_unified_army_support_cost|0] support equipment."
cannibalism_unified_army_operation_cost_text: "[?cannibalism_unified_army_command_cost|0] Command Power, [?cannibalism_unified_army_experience_cost|0] Army Experience, [?cannibalism_unified_army_fuel_cost|0] Fuel, [?cannibalism_unified_army_support_cost|0] Support Equipment"
cannibalism_unified_army_operation_effect_tt: "Pays the full operation cost, applies a temporary army modifier, and counts toward feeding the War Machine. After rout-harvest missions open, it also issues [?constant:cannibalism_unified_profile.one|0] rout receipt."
cannibalism_unified_collapse_enemy_front: "Collapse an Enemy Front"
cannibalism_unified_collapse_enemy_front_desc: "Commit recovery teams, fuel, command power, and staff experience to turn a current enemy's retreat into a cascading front collapse."
cannibalism_unified_enemy_front_collapse_requirements_tt: "Requires enemy-collapse decisions, a current enemy, [?cannibalism_unified_enemy_front_support_cost|0] support equipment, [?cannibalism_unified_enemy_front_fuel_cost|0] fuel, [?cannibalism_unified_enemy_front_command_cost|0] Command Power, and [?cannibalism_unified_enemy_front_experience_cost|0] Army Experience. Once rout limits apply, one receipt from a paid Continental Hunt is also required."
cannibalism_unified_enemy_front_collapse_cost_text: "[?cannibalism_unified_enemy_front_support_cost|0] Support Equipment, [?cannibalism_unified_enemy_front_fuel_cost|0] Fuel, [?cannibalism_unified_enemy_front_command_cost|0] Command Power, [?cannibalism_unified_enemy_front_experience_cost|0] Army Experience"
cannibalism_unified_enemy_front_collapse_effect_tt: "Pays the full operation cost, disrupts the target's defence and organization, faces hostility-tier counterpressure, and records one army operation."
cannibalism_unified_launch_naval_hunt: "Launch a Continental Naval Hunt"
cannibalism_unified_launch_naval_hunt_desc: "Consume convoy hulls, escorts, fuel, and naval staff experience to activate the prepared raiding network."
cannibalism_unified_naval_operation_requirements_tt: "Requires a controlled coast with a naval base, [?cannibalism_unified_naval_convoy_cost|0] convoys, [?cannibalism_unified_naval_support_cost|0] support equipment, [?cannibalism_unified_naval_fuel_cost|0] fuel, and [?cannibalism_unified_naval_experience_cost|0] Navy Experience."
cannibalism_unified_naval_operation_cost_text: "[?cannibalism_unified_naval_convoy_cost|0] Convoys, [?cannibalism_unified_naval_support_cost|0] Support Equipment, [?cannibalism_unified_naval_fuel_cost|0] Fuel, [?cannibalism_unified_naval_experience_cost|0] Navy Experience"
cannibalism_unified_naval_operation_effect_tt: "Pays the full reserve cost and applies a route-shaped naval operation. After convoy-hunt tables open, it also issues [?constant:cannibalism_unified_profile.one|0] convoy receipt."
cannibalism_unified_process_convoy_harvest: "Process a Convoy-Hunt Receipt"
cannibalism_unified_process_convoy_harvest_desc: "Close one convoy receipt, transfer its captured bodies into the continental Larder, and accept the discovery risk carried by the naval route."
cannibalism_unified_convoy_harvest_requirements_tt: "Requires convoy-hunt tables and [?constant:cannibalism_unified_profile.one|0] receipt earned by a paid Continental Naval Hunt."
cannibalism_unified_convoy_harvest_cost_text: "[?constant:cannibalism_unified_profile.one|0] Convoy-Hunt Receipt"
cannibalism_unified_convoy_harvest_effect_tt: "Consumes [?constant:cannibalism_unified_profile.one|0] receipt, adds [?constant:cannibalism_unified_operation.convoy_harvest_larder_yield|0] Larder, applies naval discovery risk, and advances the Larder timetable. The processing order has a [?constant:cannibalism_unified_operation.decision_reenable_days|0]-day cooldown."
cannibalism_unified_build_silent_anchorage: "Build a Silent Anchorage"
cannibalism_unified_build_silent_anchorage_desc: "Convert one owned coastal state into a concealed paid anchorage for prisoner hulks, raiders, and global naval corridors."
cannibalism_unified_silent_anchorage_requirements_tt: "Requires silent-anchorage projects, an owned controlled coastal state, [?cannibalism_unified_anchorage_manpower_cost|0] manpower, [?cannibalism_unified_anchorage_support_cost|0] support equipment, [?cannibalism_unified_anchorage_convoy_cost|0] convoys, [?cannibalism_unified_anchorage_fuel_cost|0] fuel, and [?cannibalism_unified_anchorage_experience_cost|0] Navy Experience."
cannibalism_unified_silent_anchorage_cost_text: "[?cannibalism_unified_anchorage_manpower_cost|0] Manpower, [?cannibalism_unified_anchorage_support_cost|0] Support Equipment, [?cannibalism_unified_anchorage_convoy_cost|0] Convoys, [?cannibalism_unified_anchorage_fuel_cost|0] Fuel, [?cannibalism_unified_anchorage_experience_cost|0] Navy Experience"
cannibalism_unified_silent_anchorage_effect_tt: "Pays the conversion cost, establishes a permanent anchorage, adds one Dockyard, applies discovery risk, and advances the War Machine timetable."
cannibalism_unified_launch_air_interdiction: "Launch an Air Interdiction Hunt"
cannibalism_unified_launch_air_interdiction_desc: "Commit captured aircraft, transports, ground equipment, fuel, and air staff experience to the prepared air network."
cannibalism_unified_air_operation_requirements_tt: "Requires an air-program foundation, [?cannibalism_unified_air_airframe_cost|0] small airframes, [?cannibalism_unified_air_transport_cost|0] transport aircraft, [?cannibalism_unified_air_support_cost|0] support equipment, [?cannibalism_unified_air_fuel_cost|0] fuel, and [?cannibalism_unified_air_experience_price|0] Air Experience."
cannibalism_unified_air_operation_cost_text: "[?cannibalism_unified_air_airframe_cost|0] Small Airframes, [?cannibalism_unified_air_transport_cost|0] Transports, [?cannibalism_unified_air_support_cost|0] Support Equipment, [?cannibalism_unified_air_fuel_cost|0] Fuel, [?cannibalism_unified_air_experience_price|0] Air Experience"
cannibalism_unified_air_operation_effect_tt: "Pays the full aircraft and support cost and applies an air operation whose duration grows with the Host's air preparations."
cannibalism_unified_war_machine_mission: "Feed the War Machine"
cannibalism_unified_war_machine_mission_desc: "Accumulate [?cannibalism_unified_war_machine_mission_goal|0] paid recruitment, army, naval, or air progress before the timetable expires."
cannibalism_unified_war_machine_mission_objective_tt: "Accumulate [?cannibalism_unified_war_machine_mission_goal|0] paid War Machine progress."
cannibalism_unified_war_machine_mission_success_tt: "The War Machine holds its schedule and Unified Authority rises by [?cannibalism_unified_war_machine_mission_success_authority|0]."
cannibalism_unified_war_machine_mission_partial_tt: "The partial schedule raises World Hostility by [?cannibalism_unified_war_machine_mission_partial_hostility|0]."
cannibalism_unified_war_machine_mission_failure_tt: "The schedule breaks and World Hostility rises by [?cannibalism_unified_war_machine_mission_failure_hostility|0]."

cannibalism_unified_seed_major_enemy_army: "Seed a Foreign Army"
cannibalism_unified_seed_major_enemy_army_desc: "Spend Larder, support equipment, and command power to disrupt one ordinary country. Mature cell preparations determine the duration."
cannibalism_unified_cell_operation_requirements_tt: "Requires prewar cell operations, [?cannibalism_unified_cell_larder_cost|0] Larder, [?cannibalism_unified_cell_support_cost|0] support equipment, and [?cannibalism_unified_cell_command_cost|0] Command Power. The target must be an ordinary country outside our faction."
cannibalism_unified_cell_operation_cost_text: "[?cannibalism_unified_cell_larder_cost|0] Larder, [?cannibalism_unified_cell_support_cost|0] Support Equipment, [?cannibalism_unified_cell_command_cost|0] Command Power"
cannibalism_unified_cell_operation_effect_tt: "Pays the operation cost, weakens the target's stability and war support, expands Network Reach, and records one cell operation."
cannibalism_unified_prepare_global_campaign: "Prepare a Global Campaign"
cannibalism_unified_prepare_global_campaign_desc: "Spend stores and command authority to establish an annexation war goal against one valid ordinary country."
cannibalism_unified_campaign_operation_requirements_tt: "Requires global campaigns, [?cannibalism_unified_campaign_larder_cost|0] Larder, [?cannibalism_unified_campaign_infantry_cost|0] infantry equipment, [?cannibalism_unified_campaign_support_cost|0] support equipment, and [?cannibalism_unified_campaign_command_cost|0] Command Power. The target must be outside our faction and not already at war with us."
cannibalism_unified_campaign_operation_cost_text: "[?cannibalism_unified_campaign_larder_cost|0] Larder, [?cannibalism_unified_campaign_infantry_cost|0] Infantry Equipment, [?cannibalism_unified_campaign_support_cost|0] Support Equipment, [?cannibalism_unified_campaign_command_cost|0] Command Power"
cannibalism_unified_campaign_operation_effect_tt: "Pays the campaign cost, establishes an annexation war goal, applies a temporary campaign modifier, raises World Hostility, and records one prepared campaign."
cannibalism_unified_integrate_postwar_state: "Integrate a Postwar State"
cannibalism_unified_integrate_postwar_state_desc: "Commit administrators, equipment, and trains to one owned non-core state. Each state can complete this project only once."
cannibalism_unified_issue_terror_ultimatum: "Issue a Terror Ultimatum"
cannibalism_unified_issue_terror_ultimatum_desc: "Deliver the Host's demand to one ordinary country. Refusal is answered by a prepared annexation claim and a paid cell attack."
cannibalism_unified_terror_ultimatum_requirements_tt: "Requires terror ultimata, a valid ordinary target, [?cannibalism_unified_ultimatum_larder_cost|0] Larder, [?cannibalism_unified_ultimatum_infantry_cost|0] infantry equipment, and [?cannibalism_unified_ultimatum_command_cost|0] Command Power."
cannibalism_unified_terror_ultimatum_cost_text: "[?cannibalism_unified_ultimatum_larder_cost|0] Larder, [?cannibalism_unified_ultimatum_infantry_cost|0] Infantry Equipment, [?cannibalism_unified_ultimatum_command_cost|0] Command Power"
cannibalism_unified_terror_ultimatum_effect_tt: "Pays the ultimatum cost, disrupts the target, establishes an annexation war goal, faces hostility-tier counterpressure, raises World Hostility, and records one prepared campaign."
cannibalism_unified_provoke_border_incident: "Provoke a Cell-Backed Border Incident"
cannibalism_unified_provoke_border_incident_desc: "Arm cells along a neighboring border and turn their attack into an open annexation claim."
cannibalism_unified_border_incident_requirements_tt: "Requires border-incident decisions, a valid neighboring target, [?cannibalism_unified_border_incident_larder_cost|0] Larder, [?cannibalism_unified_border_incident_infantry_cost|0] infantry equipment, [?cannibalism_unified_border_incident_support_cost|0] support equipment, and [?cannibalism_unified_border_incident_command_cost|0] Command Power."
cannibalism_unified_border_incident_cost_text: "[?cannibalism_unified_border_incident_larder_cost|0] Larder, [?cannibalism_unified_border_incident_infantry_cost|0] Infantry Equipment, [?cannibalism_unified_border_incident_support_cost|0] Support Equipment, [?cannibalism_unified_border_incident_command_cost|0] Command Power"
cannibalism_unified_border_incident_effect_tt: "Pays the incident cost, disrupts the neighboring front, establishes an annexation war goal, faces hostility-tier counterpressure, and records one prepared campaign."
cannibalism_unified_postwar_integration_requirements_tt: "Requires postwar integration, an owned and controlled non-core state, [?cannibalism_unified_integration_manpower_cost|0] manpower, [?cannibalism_unified_integration_support_cost|0] support equipment, and [?cannibalism_unified_integration_train_cost|0] trains."
cannibalism_unified_postwar_integration_cost_text: "[?cannibalism_unified_integration_manpower_cost|0] Manpower, [?cannibalism_unified_integration_support_cost|0] Support Equipment, [?cannibalism_unified_integration_train_cost|0] Trains"
cannibalism_unified_postwar_integration_effect_tt: "Pays the integration cost, adds infrastructure and a permanent local supply and resistance modifier, and records one postwar integration."
cannibalism_unified_destroy_coalition_hub: "Destroy a Coalition Hub"
cannibalism_unified_destroy_coalition_hub_desc: "Spend motor transport, support stores, fuel, command power, and staff experience to disrupt one current enemy."
cannibalism_unified_counterwar_operation_requirements_tt: "Requires coalition command operations, a current enemy, [?cannibalism_unified_counterwar_support_cost|0] support equipment, [?cannibalism_unified_counterwar_truck_cost|0] trucks, [?cannibalism_unified_counterwar_fuel_cost|0] fuel, [?cannibalism_unified_counterwar_command_cost|0] Command Power, and [?cannibalism_unified_counterwar_experience_cost|0] Army Experience."
cannibalism_unified_counterwar_operation_cost_text: "[?cannibalism_unified_counterwar_support_cost|0] Support Equipment, [?cannibalism_unified_counterwar_truck_cost|0] Trucks, [?cannibalism_unified_counterwar_fuel_cost|0] Fuel, [?cannibalism_unified_counterwar_command_cost|0] Command Power, [?cannibalism_unified_counterwar_experience_cost|0] Army Experience"
cannibalism_unified_counterwar_operation_effect_tt: "Pays the full operation cost, weakens the target's defence and organization, relieves World Hostility, and records one counterwar operation."
cannibalism_unified_counterwar_mission: "Consume the Counterwar"
cannibalism_unified_convert_counterwar_pressure: "Convert Counterwar Pressure"
cannibalism_unified_convert_counterwar_pressure_desc: "Spend a full mobile reserve to turn the coalition's mobilization against itself, reduce World Hostility, and consolidate Unified Authority."
cannibalism_unified_counterwar_conversion_requirements_tt: "Requires counterwar conversion, World Hostility of at least [?constant:cannibalism_unified_hostility.pressure_threshold|0], [?cannibalism_unified_counterwar_conversion_support_cost|0] support equipment, [?cannibalism_unified_counterwar_conversion_truck_cost|0] trucks, [?cannibalism_unified_counterwar_conversion_fuel_cost|0] fuel, [?cannibalism_unified_counterwar_conversion_command_cost|0] Command Power, and [?cannibalism_unified_counterwar_conversion_experience_cost|0] Army Experience."
cannibalism_unified_counterwar_conversion_cost_text: "[?cannibalism_unified_counterwar_conversion_support_cost|0] Support Equipment, [?cannibalism_unified_counterwar_conversion_truck_cost|0] Trucks, [?cannibalism_unified_counterwar_conversion_fuel_cost|0] Fuel, [?cannibalism_unified_counterwar_conversion_command_cost|0] Command Power, [?cannibalism_unified_counterwar_conversion_experience_cost|0] Army Experience"
cannibalism_unified_counterwar_conversion_effect_tt: "Pays the full conversion cost, changes World Hostility by [?constant:cannibalism_unified_hostility.counterwar_conversion_relief|0], raises Unified Authority by [?constant:cannibalism_unified_hostility.counterwar_conversion_authority|0], and records one counterwar operation."
cannibalism_unified_counterwar_mission_desc: "Accumulate [?cannibalism_unified_counterwar_mission_goal|0] paid counterwar progress before the timetable expires."
cannibalism_unified_counterwar_mission_objective_tt: "Accumulate [?cannibalism_unified_counterwar_mission_goal|0] paid counterwar progress."
cannibalism_unified_counterwar_mission_success_tt: "The coalition fractures and World Hostility changes by [?cannibalism_unified_counterwar_mission_success_relief|0]."
cannibalism_unified_counterwar_mission_partial_tt: "The partial counterwar changes World Hostility by [?cannibalism_unified_counterwar_mission_partial_relief|0]."
cannibalism_unified_counterwar_mission_failure_tt: "The coalition regroups and World Hostility rises by [?cannibalism_unified_counterwar_mission_failure_hostility|0]."

cannibalism_unified_begin_terminal_mobilization: "Begin Terminal Mobilization"
cannibalism_unified_begin_terminal_mobilization_desc: "Commit one final population block and command order to the global mobilization. The dead will be counted among the war's losses."
cannibalism_unified_terminal_consumption_requirements_tt: "Requires final global mobilization, a controlled usable state with at least [?constant:cannibalism_unified_decision_cost.terminal_minimum_population_k|0]K population, and [?constant:cannibalism_unified_decision_cost.terminal_command|0] Command Power."
cannibalism_unified_terminal_consumption_cost_text: "[?constant:cannibalism_unified_decision_cost.terminal_population_k|0]K Population, [?constant:cannibalism_unified_decision_cost.terminal_command|0] Command Power"
cannibalism_unified_terminal_consumption_effect_tt: "Kills exactly [?constant:cannibalism_unified_decision_cost.terminal_population_k|0]K people, expands the Larder, and begins the final mobilization with a severe temporary supply burden."
cannibalism_unified_terminal_mobilization_prepared_tt: "Requires the final population levy to be carried out."
cannibalism_unified_terminal_consume_controlled_state: "Empty a Conquered Province"
cannibalism_unified_terminal_consume_controlled_state_desc: "Sweep a controlled province block by block and turn its remaining people into stores for the global offensive. The state must still hold at least [?constant:cannibalism_unified_decision_cost.terminal_locked_minimum_population_k|0]K people and cannot have been consumed recently."
cannibalism_unified_locked_terminal_consumption_requirements_tt: "Requires the final global mobilization, a controlled usable state with at least [?constant:cannibalism_unified_decision_cost.terminal_locked_minimum_population_k|0]K people, and [?constant:cannibalism_unified_decision_cost.terminal_locked_command|0] Command Power."
cannibalism_unified_locked_terminal_consumption_cost_text: "[?constant:cannibalism_unified_decision_cost.terminal_locked_population_k|0]K Population, [?constant:cannibalism_unified_decision_cost.terminal_locked_command|0] Command Power"
cannibalism_unified_locked_terminal_consumption_effect_tt: "Kills exactly [?constant:cannibalism_unified_decision_cost.terminal_locked_population_k|0]K people, expands the global Larder, strengthens the network, and exhausts the province."

cannibalism_unified_command_operation: "Continental Command Operation"
cannibalism_unified_command_operation_desc: "The chosen command routes are driving a paid planning and organization effort across the unified host."
cannibalism_unified_larder_storage: "Continental Storage Network"
cannibalism_unified_larder_storage_desc: "Paid storage links reduce supply consumption and improve factory throughput for a duration set by completed Larder contracts."
cannibalism_unified_army_operation: "Three-Army Operation"
cannibalism_unified_army_operation_desc: "A paid continental offensive improves attack, breakthrough, organization recovery, and supply discipline."
cannibalism_unified_naval_operation: "Continental Naval Hunt"
cannibalism_unified_naval_operation_desc: "Consumed hulls and naval stores support a temporary increase in raiding efficiency and fleet speed."
cannibalism_unified_air_operation: "Air Interdiction Hunt"
cannibalism_unified_air_operation_desc: "Consumed aircraft and support stores sustain a temporary increase in mission and air-superiority efficiency."
cannibalism_unified_cell_disruption: "Foreign Command Cells"
cannibalism_unified_cell_disruption_desc: "Infiltrated cells are eroding the target's stability and willingness to continue the war."
cannibalism_unified_campaign_operation: "Campaign Without Borders"
cannibalism_unified_campaign_operation_desc: "Paid campaign staff improve planning and shorten the work needed to prepare further war goals."
cannibalism_unified_postwar_integration: "Integrated Feeding Administration"
cannibalism_unified_postwar_integration_desc: "A permanent paid administration improves local supply while suppressing resistance."
cannibalism_unified_governor_administration: "Regional Host Governor"
cannibalism_unified_governor_administration_desc: "A paid regional governor maintains local supply and suppresses resistance on behalf of the unified host."
cannibalism_unified_counterwar_disruption: "Coalition Command Broken"
cannibalism_unified_counterwar_disruption_desc: "Cannibal counterwar operations have damaged this country's defence and army organization."
cannibalism_unified_enemy_front_disruption: "Front in Collapse"
cannibalism_unified_enemy_front_disruption_desc: "Paid Host recovery teams are turning retreat into a collapse of defence and army organization."
cannibalism_unified_managed_district: "Managed Feeding District"
cannibalism_unified_managed_district_desc: "Paid guards and rotation schedules preserve local supply while containing resistance."
cannibalism_unified_battlefield_processing: "Battlefield Processing District"
cannibalism_unified_battlefield_processing_desc: "Verified victory receipts and recovery teams sustain local processing under the battlefield Larder doctrine."
cannibalism_unified_captured_workshop: "Converted Larder Workshop"
cannibalism_unified_captured_workshop_desc: "A paid industrial conversion supports local supply while guards suppress resistance."
cannibalism_unified_silent_anchorage: "Silent Anchorage"
cannibalism_unified_silent_anchorage_desc: "A concealed raider anchorage supports local supply and dockyard construction."
cannibalism_unified_frontier_abandoned: "Abandoned Feeding Frontier"
cannibalism_unified_frontier_abandoned_desc: "The Host withdrew from this exhausted frontier, leaving weakened supply and a hollow administration."
cannibalism_unified_world_hostility_pressure: "World Hostility: Coordinated Pressure"
cannibalism_unified_world_hostility_pressure_desc: "At [?constant:cannibalism_unified_hostility.pressure_threshold|0] World Hostility, foreign coordination raises operational costs, consumer-goods demand, and supply consumption while reducing organization and political power."
cannibalism_unified_world_hostility_mobilized: "World Hostility: Coalition Mobilization"
cannibalism_unified_world_hostility_mobilized_desc: "At [?constant:cannibalism_unified_hostility.mobilized_threshold|0] World Hostility, coalition mobilization imposes heavier costs, longer counterpressure, and command disruption."
cannibalism_unified_world_hostility_total: "World Hostility: Total Counterwar"
cannibalism_unified_world_hostility_total_desc: "At [?constant:cannibalism_unified_hostility.total_threshold|0] World Hostility, the ordinary world commits its full economy, armies, and command networks against the Host."
cannibalism_unified_enemy_counterpressure_pressure: "Coordinated Counterpressure"
cannibalism_unified_enemy_counterpressure_pressure_desc: "Foreign coordination stiffens this target's defence and organization against the Host's operation."
cannibalism_unified_enemy_counterpressure_mobilized: "Mobilized Counterpressure"
cannibalism_unified_enemy_counterpressure_mobilized_desc: "Coalition mobilization substantially stiffens this target's defence and organization."
cannibalism_unified_enemy_counterpressure_total: "Total Counterwar Pressure"
cannibalism_unified_enemy_counterpressure_total_desc: "The full counterwar gives this target its strongest temporary defence and organization response."
cannibalism_unified_terminal_mobilization: "Terminal Mobilization"
cannibalism_unified_terminal_mobilization_desc: "The final consumption drive strengthens attack while imposing a severe supply burden on the mobilized host."

cannibalism_wendigo_command_category: "The Frozen Command"
cannibalism_wendigo_command_category_desc: "Anchor states, transformed recruitment, and the countdown remain bound to controlled territory, finite population, and the global Larder."
cannibalism_wendigo_counterwar_category: "Break the Frozen Anchors"
cannibalism_wendigo_counterwar_category_desc: "Identified anchors can be isolated, assaulted, and stripped of their supply before the transformation locks."

cannibalism_designate_transformation_anchor: "Designate a Transformation Anchor"
cannibalism_designate_transformation_anchor_desc: "Convert a controlled, populated, and usable state into a visible nexus for the Winter Host. The full population loss is taken from the state before its anchor joins the live chain."
cannibalism_designate_transformation_anchor_cost_text: "§O[?constant:cannibalism_wendigo_decision.designate_anchor_larder|0] Larder§!  £command_power §Y[?constant:cannibalism_wendigo_decision.designate_anchor_command|0]§!  §R[?constant:cannibalism_wendigo_anchor.feeding_population_k|0]K state population§!"
cannibalism_designate_transformation_anchor_effect_tt: "Consumes the exact population requirement from the selected state, pays Larder and Command Power, and creates a new live anchor only if every cost can be paid."
cannibalism_fortify_transformation_anchor: "Fortify a Transformation Anchor"
cannibalism_fortify_transformation_anchor_desc: "Spend finite stores and command capacity to harden a selected live anchor before enemy identification, logistics raids, or a direct assault can break it."
cannibalism_fortify_transformation_anchor_cost_text: "§O[?constant:cannibalism_wendigo_decision.fortify_anchor_larder|0] Larder§!  £command_power §Y[?constant:cannibalism_wendigo_decision.fortify_anchor_command|0]§!"
cannibalism_fortify_transformation_anchor_effect_tt: "Adds [?constant:cannibalism_wendigo_decision.fortify_anchor_strength|0] strength to the selected live anchor without exceeding its maximum."
cannibalism_consume_transformation_anchor_population: "Feed the Transformation Anchor"
cannibalism_consume_transformation_anchor_population_desc: "Consume another measured share of an eligible anchor state's population. The operation cannot draw from exhausted, contaminated, recovering, duplicated, or otherwise unusable territory."
cannibalism_consume_transformation_anchor_population_cost_text: "§R[?constant:cannibalism_wendigo_decision.feed_anchor_population_k|0]K State Population§!"
cannibalism_consume_transformation_anchor_population_effect_tt: "If the exact population loss is paid, the selected anchor gains [?constant:cannibalism_wendigo_decision.feed_anchor_strength|0] strength and the transformation gains [?constant:cannibalism_wendigo_decision.feed_anchor_progress|0] progress."
cannibalism_train_additional_wendigo_packs: "Train Additional Wendigo Packs"
cannibalism_train_additional_wendigo_packs_desc: "Raise a paid batch through a valid live anchor. The new Wendigo Packs begin empty, remain locked to the preserved template, and reinforce only from the manpower and equipment actually held by the country."
cannibalism_train_additional_wendigo_packs_cost_text: "§O[?constant:cannibalism_wendigo_decision.train_pack_larder|0] Larder§!  §R[?constant:cannibalism_wendigo_decision.train_pack_population_k|0]K State Population§!"
cannibalism_train_additional_wendigo_packs_effect_tt: "Creates [?constant:cannibalism_wendigo_decision.train_pack_batch|0] empty Wendigo Pack formations at the selected anchor and counts them against the active training limit."
cannibalism_freeze_supply_corridor: "Freeze a Supply Corridor"
cannibalism_freeze_supply_corridor_desc: "Bind a controlled road, rail line, supply node, or naval base to the Winter Network while disrupting adjacent enemy-held routes."
cannibalism_freeze_supply_corridor_cost_text: "§O[?constant:cannibalism_wendigo_decision.freeze_corridor_larder|0] Larder§!  £command_power §Y[?constant:cannibalism_wendigo_decision.freeze_corridor_command|0]§!"
cannibalism_freeze_supply_corridor_effect_tt: "For [?constant:cannibalism_wendigo_decision.freeze_corridor_days|0] days, the selected state gains winter supply and organization recovery while adjacent enemy-controlled states suffer severe supply and organization disruption."
cannibalism_accelerate_transformation_countdown: "Accelerate the Transformation"
cannibalism_accelerate_transformation_countdown_desc: "Force more population and Larder through a selected live anchor during the pre-lock countdown. The gain is large, local, finite, and followed by a long cooldown."
cannibalism_accelerate_transformation_countdown_cost_text: "§O[?constant:cannibalism_wendigo_decision.accelerate_larder|0] Larder§!  §R[?constant:cannibalism_wendigo_decision.accelerate_population_k|0]K State Population§!"
cannibalism_accelerate_transformation_countdown_effect_tt: "If the exact population transaction succeeds, the transformation gains [?constant:cannibalism_wendigo_decision.accelerate_progress|0] progress and acceleration enters a [?constant:cannibalism_wendigo_decision.accelerate_cooldown_days|0]-day cooldown."
cannibalism_stabilize_transformation_countdown: "Stabilize the Anchor Chain"
cannibalism_stabilize_transformation_countdown_desc: "Reinforce a damaged point in the live chain, restore part of the lost countdown momentum, and reduce the accumulated burden of broken anchors."
cannibalism_stabilize_transformation_countdown_cost_text: "§O[?constant:cannibalism_wendigo_decision.stabilize_larder|0] Larder§!  £command_power §Y[?constant:cannibalism_wendigo_decision.stabilize_command|0]§!"
cannibalism_stabilize_transformation_countdown_effect_tt: "Adds [?constant:cannibalism_wendigo_decision.stabilize_anchor_strength|0] anchor strength and [?constant:cannibalism_wendigo_decision.stabilize_progress|0] transformation progress, reduces the broken-anchor burden by one, and enters a [?constant:cannibalism_wendigo_decision.stabilize_cooldown_days|0]-day cooldown."

cannibalism_identify_transformation_anchor: "Identify a Transformation Anchor"
cannibalism_identify_transformation_anchor_desc: "Use intelligence, refugees, transport records, and front-line observation to expose a reachable live anchor before committing a destructive operation."
cannibalism_identify_transformation_anchor_cost_text: "£pol_power §Y[?constant:cannibalism_wendigo_decision.identify_political_power|0]§!"
cannibalism_identify_transformation_anchor_effect_tt: "Marks the highest-priority reachable unidentified anchor for stronger follow-up assaults and records the country as a counterwar contributor."
cannibalism_assault_transformation_anchor: "Assault a Transformation Anchor"
cannibalism_assault_transformation_anchor_desc: "Commit a screened ground force and engineers against the highest-priority reachable anchor. Identification increases the damage and a destroyed anchor leaves long recovery."
cannibalism_assault_transformation_anchor_cost_text: "£manpower_texticon §Y[?constant:cannibalism_wendigo_decision.assault_manpower|0]§!  £command_power §Y[?constant:cannibalism_wendigo_decision.assault_command|0]§!  £infantry_equipment_text_icon §Y[?constant:cannibalism_wendigo_decision.assault_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:cannibalism_wendigo_decision.assault_support_equipment|0]§!"
cannibalism_assault_transformation_anchor_effect_tt: "Damages the selected reachable anchor by at least [?constant:cannibalism_wendigo_decision.assault_strength_damage|0] strength, with [?constant:cannibalism_wendigo_decision.assault_identified_bonus_damage|0] additional damage if identified. Destroying the last live anchor breaks the countdown."
cannibalism_disrupt_transformation_logistics: "Disrupt Transformation Logistics"
cannibalism_disrupt_transformation_logistics_desc: "Raid couriers, frozen depots, and relay crews around the highest-priority reachable anchor to weaken both the local chain and the public countdown."
cannibalism_disrupt_transformation_logistics_cost_text: "£manpower_texticon §Y[?constant:cannibalism_wendigo_decision.disrupt_manpower|0]§!  £command_power §Y[?constant:cannibalism_wendigo_decision.disrupt_command|0]§!  £support_equipment_text_icon §Y[?constant:cannibalism_wendigo_decision.disrupt_support_equipment|0]§!"
cannibalism_disrupt_transformation_logistics_effect_tt: "Damages the selected anchor by [?constant:cannibalism_wendigo_decision.disrupt_strength_damage|0] strength and removes [?constant:cannibalism_wendigo_decision.disrupt_progress_damage|0] transformation progress."
cannibalism_break_wendigo_recruitment_site: "Break a Wendigo Recruitment Site"
cannibalism_break_wendigo_recruitment_site_desc: "Strike an active anchor muster, destroy its conversion and training facilities, and prevent it from raising additional Wendigo Packs for an extended period."
cannibalism_break_wendigo_recruitment_site_cost_text: "£manpower_texticon §Y[?constant:cannibalism_wendigo_decision.break_site_manpower|0]§!  £command_power §Y[?constant:cannibalism_wendigo_decision.break_site_command|0]§!  £infantry_equipment_text_icon §Y[?constant:cannibalism_wendigo_decision.break_site_infantry_equipment|0]§!"
cannibalism_break_wendigo_recruitment_site_effect_tt: "Damages the selected anchor by [?constant:cannibalism_wendigo_decision.break_site_strength_damage|0] strength and closes its recruitment site for [?constant:cannibalism_wendigo_decision.break_site_lock_days|0] days."

