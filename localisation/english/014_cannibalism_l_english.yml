l_english:
chaosx.nr14.1.t: "Cannibalism"
chaosx.nr14.2.t: "Field Kitchens of the Dead"
chaosx.nr14.2.d: "The first reports were dismissed as the usual lies of exhausted armies: missing ration clerks, field hospitals with empty beds, prisoners whose transfer papers stopped at the depot gate. Then the patrols found a kitchen ledger written in names instead of weights.\n\nThis is not famine alone. Our supply discipline is collapsing into ritualized violence. Whole companies are hiding what they have done, quartermasters are falsifying the meat issue, and officers are deciding whether to burn the evidence or admit that the front has learned a new hunger."
chaosx.nr14.2.a: "Put the army under hard discipline."
chaosx.nr14.2.b: "Flood the front with guarded rations."
chaosx.nr14.2.c: "Seal the files and purge quietly."
chaosx.nr14.3.t: "The First Command Investigation"
chaosx.nr14.3.d: "The first command investigation finds no single guilty kitchen. Ration clerks, field hospitals, prisoners, and exhausted officers all point to the same failure: the front has learned how to hide hunger inside paperwork.\n\nThe investigators can follow the supply ledgers, break the first catechism, or seal the files and trust discipline to hold. Every choice teaches the army what kind of truth it is allowed to survive."
chaosx.nr14.3.a: "Follow the kitchens first."
chaosx.nr14.3.b: "Interrogate the hospital chain."
chaosx.nr14.3.c: "Keep the papers inside command."
chaosx.nr14.4.t: "The Ledger Reaches the Press"
chaosx.nr14.5.t: "The Army Learns the Taste"
chaosx.nr14.5.d: "Containment broke in too many places at once. Prison kitchens disappeared into the night, hospital trains arrived with fewer patients than they departed with, and the front has begun to trade its own rumors as instructions.\n\nThis is no longer a scandal to suppress. It is an outbreak with its own believers."
chaosx.nr14.5.a: "There is no clean front left."
chaosx.nr14.6.t: "The Kitchens Go Cold"
chaosx.nr14.6.d: "The emergency lists have been reconciled. Field kitchens are under guard, the transfer depots are sealed, and officers who fed the habit into their units have been dragged into daylight. There are still graves without names, but the surviving formations can again eat without looking at one another."
chaosx.nr14.6.a: "Burn every ledger we can prove."
chaosx.nr14.7.t: "The Recipes Cross the Line"
chaosx.nr14.7.d: "Foreign prisoners arrived with the same marks found in our own camps. Drivers report coded ration lists in captured trucks, and hospital orderlies whisper that a missing regiment taught its jailers how to butcher a siege.\n\nThe outbreak has not become ours by rumor. It has arrived by rail, convoy, and example. This country must fight its own version before the practice hardens into doctrine."
chaosx.nr14.7.a: "Open a local containment command."
chaosx.nr14.8.t: "Ritual Hunger"
chaosx.nr14.8.d: "The first confession sounded mad until the chaplains found matching words in another barracks. The eating has become a proof of loyalty, a punishment, a promise that hunger can be turned into rank.\n\nA ritual ideology is forming inside the mess lines. It calls itself discipline because that is the word soldiers already obey."
chaosx.nr14.8.a: "Break the catechism."
chaosx.nr14.9.t: "The Silent Islands"
chaosx.nr14.9.d: "Coastal garrisons have gone quiet. On some islands the wireless still answers in clipped code, but no civilian boats return and no shore leave is granted. Elsewhere inland communes keep the same silence behind barricades and butcher-paper ration cards.\n\nThe outbreak has learned how to hold territory."
chaosx.nr14.9.a: "No landing party goes unescorted."
chaosx.nr14.10.t: "The Cannibal Commune Declares"
chaosx.nr14.10.d: "A fortified district has stopped pretending to obey its old government. Its council speaks from a seized transmitter, naming itself a commune of the table and promising rations to anyone who accepts its law.\n\nThe new state is poor, surrounded, and already at war. It is also fed by every collapse it creates."
chaosx.nr14.10.a: "Mark them as an enemy state."
chaosx.nr14.11.t: "The Table Without Borders"
chaosx.nr14.11.d: "Captured cells carried identical knots of string, identical cargo marks, and a name that nobody admits hearing first. The cults no longer copy one another by accident. They pass couriers, lists, and hunger like orders.\n\nThe network is preparing a place for a unifier, whether it finds Hannibal, invents him, or accepts another hand at the head of the table."
chaosx.nr14.11.a: "Find the hand behind the table."
chaosx.nr14.12.t: "Hannibal at the Gates"
chaosx.nr14.12.d: "The phrase has stopped behaving like a rumor. Couriers preserve it in cipher pads, commune officers use it as a salute, and captured cells wait for a mind they believe can make appetite into law.\n\nHannibal may be a person, a title, or the mask a later unifier chooses to wear. The table has made room for him."
chaosx.nr14.12.a: "There is a chair left empty."
chaosx.nr14.13.t: "The World as Larder"
chaosx.nr14.13.d: "The gates are open. The network has a unifier, the world is already deep in chaos, and enough communes have survived to treat humanity itself as a ration system.\n\nThey no longer speak of survival. They speak of management, harvest, and a future in which every border is a stock line."
chaosx.nr14.13.a: "Nothing is enough."
chaosx.nr14.14.t: "The Burned Ledgers"
chaosx.nr14.14.d: "The last active tables have been broken, their depots searched, their sermons confiscated, their island kitchens burned down to stone. In every country that fought its own outbreak, survivors compare lists and find that the horror was local, but never isolated.\n\nThe appetite is defeated for now. The memory is not."
chaosx.nr14.14.a: "Seal the archives."

chaosx.news.17.t: "Cannibalism"
chaosx.news.17.d: "Military investigators in [From.GetName] have confirmed organized cannibalism inside frontline and detention supply networks. The first public reports describe forged ration ledgers, missing prisoners, and commanders who allowed the practice to hide behind war necessity."
chaosx.news.17.a: "The front has learned a new hunger."

cannibalism_frontline_hunger_category: "Frontline Hunger Command"
cannibalism_frontline_hunger_category_desc: "The outbreak is fought through supplies, discipline, controlled territory, transport capacity, and deadlines. Containment can defeat it locally; delay lets ritual cells, communes, and international couriers harden the practice into a wider threat."

