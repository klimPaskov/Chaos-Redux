cannibalism_replace_compromised_officer_chain: "Replace the Compromised Officer Chain"
cannibalism_replace_compromised_officer_chain_desc: "Remove officers named by protected witnesses, break their transfer authority, and rebuild the chain with screened replacements."
cannibalism_replace_compromised_officer_chain_requirements_tt: "Requires [?constant:cannibalism_objective_cost.officer_manpower|0] manpower, [?constant:cannibalism_objective_cost.officer_support|0] support equipment, and [?constant:cannibalism_objective_cost.officer_command|0] command power."
cannibalism_replace_compromised_officer_chain_cost_text: "§R[?constant:cannibalism_objective_cost.officer_manpower|0] manpower§! · §Y[?constant:cannibalism_objective_cost.officer_support|0] support equipment§! · §C[?constant:cannibalism_objective_cost.officer_command|0] command power§!"
cannibalism_replace_compromised_officer_chain_effect_tt: "Command Integrity rises and Cell Strength falls. The personnel review also advances an active investigation."

cannibalism_infiltrate_ritual_cell: "Infiltrate the Oath Circle"
cannibalism_infiltrate_ritual_cell_desc: "Place screened witnesses and investigators inside a controlled cell before its organizers can move the ledgers and promotion lists."
cannibalism_infiltrate_ritual_cell_cost_text: "§R[?constant:cannibalism_objective_cost.infiltration_manpower|0] manpower§! · §Y[?constant:cannibalism_objective_cost.infiltration_support|0] support equipment§! · §C[?constant:cannibalism_objective_cost.infiltration_command|0] command power§!"
cannibalism_infiltrate_ritual_cell_effect_tt: "Evidence rises while the cell, its organizers, and the local node lose strength. The operation advances an active investigation."

cannibalism_break_ritual_economy: "Break the Hidden Ration Economy"
cannibalism_break_ritual_economy_desc: "Seize false ration accounts, close protected stores, and cut the transport officers who turn controlled districts into private supply systems."
cannibalism_break_ritual_economy_cost_text: "§R[?constant:cannibalism_objective_cost.ritual_economy_manpower|0] manpower§! · §Y[?constant:cannibalism_objective_cost.ritual_economy_infantry|0] infantry / [?constant:cannibalism_objective_cost.ritual_economy_support|0] support equipment§! · §C[?constant:cannibalism_objective_cost.ritual_economy_command|0] command power§!"
cannibalism_break_ritual_economy_effect_tt: "The local node, Cell Strength, Cult Cohesion, and Network Reach fall. The seizure also advances an active investigation."

cannibalism_infiltrate_ritual_cell_requirements_tt: "Requires screened personnel, support equipment, command capacity, and a controlled active cell that has not been infiltrated recently."
cannibalism_break_ritual_economy_requirements_tt: "Requires troops, infantry and support equipment, command capacity, and a controlled cell tied to a feeding or ration system."

cannibalism_investigation_mission: "Trace the Missing Ranks"
cannibalism_investigation_mission_desc: "Link ration records, protected testimony, recovered remains, and officer transfers before the trail is moved. The target state and any active node identity are preserved for the whole investigation."
cannibalism_investigation_objective_tt: "Complete [?cannibalism_investigation_goal|0] linked operations. Current progress: [?cannibalism_investigation_progress|0]."
cannibalism_investigation_success_tt: "The linked record is secured. Evidence rises, Cell Strength falls, and the target node loses access to its protected routes."
cannibalism_investigation_partial_tt: "A usable portion of the record survives. Evidence rises modestly and the target cell loses some protection."
cannibalism_investigation_failure_tt: "The trail is burned and witnesses disappear. Command Integrity falls while the target cell and node recover."

cannibalism_hold_prison_mission: "Keep the Compound Secure"
cannibalism_hold_prison_mission_desc: "Maintain a screened formation and transport reserve around the compromised prison or camp. Any pulse without the required garrison or reserve resets uninterrupted progress."
cannibalism_hold_prison_objective_tt: "Maintain the compound for [?cannibalism_prison_required_hold_days|0] days. Current uninterrupted progress: [?cannibalism_prison_hold_days|0] days."
cannibalism_hold_prison_success_tt: "The compound remains under screened control. Command Integrity rises, while the cell and local node lose access to prisoners and records."
cannibalism_hold_prison_partial_tt: "The cordon holds long enough to remove part of the compromised staff. Command Integrity improves and the local cell weakens."
cannibalism_hold_prison_failure_tt: "The cordon breaks before the transfer is complete. Command Integrity falls while the cell and local node gain new access."

cannibalism_reconnoiter_silent_island: "Chart the Silent Coast"
cannibalism_reconnoiter_silent_island_desc: "Spend ships, convoy escorts, and command capacity to identify approaches, landing water, and the routes that keep the isolated Host supplied."
cannibalism_reconnoiter_silent_island_requirements_tt: "Requires [?constant:cannibalism_objective_cost.island_recon_convoys|0] convoys, [?constant:cannibalism_objective_cost.island_recon_navy_experience|0] Navy Experience, and [?constant:cannibalism_objective_cost.island_recon_command|0] command power."
cannibalism_reconnoiter_silent_island_cost_text: "§Y[?constant:cannibalism_objective_cost.island_recon_convoys|0] convoys§! · §B[?constant:cannibalism_objective_cost.island_recon_navy_experience|0] Navy Experience§! · §C[?constant:cannibalism_objective_cost.island_recon_command|0] command power§!"
cannibalism_reconnoiter_silent_island_effect_tt: "Begins the sea-road objective against this exact Host and records the reconnaissance as its first operation."

cannibalism_liberate_feeding_state: "Liberate the Feeding District"
cannibalism_liberate_feeding_state_desc: "Commit a screened force to break the active node and begin the existing identification, institutional recovery, and long-trauma sequence."
cannibalism_liberate_feeding_state_requirements_tt: "Requires [?constant:cannibalism_objective_cost.liberation_manpower|0] manpower, [?constant:cannibalism_objective_cost.liberation_infantry|0] infantry equipment, [?constant:cannibalism_objective_cost.liberation_support|0] support equipment, and [?constant:cannibalism_objective_cost.liberation_command|0] command power."
cannibalism_liberate_feeding_state_cost_text: "§R[?constant:cannibalism_objective_cost.liberation_manpower|0] manpower§! · §Y[?constant:cannibalism_objective_cost.liberation_infantry|0] infantry / [?constant:cannibalism_objective_cost.liberation_support|0] support equipment§! · §C[?constant:cannibalism_objective_cost.liberation_command|0] command power§!"
cannibalism_liberate_feeding_state_effect_tt: "The exact active node is retired and the state enters the established liberation-recovery sequence. No population, equipment, units, or stores are created."

cannibalism_reach_island_mission: "Open the Sea Road"
cannibalism_reach_island_mission_desc: "Combine reconnaissance, blockade, and landing pressure against the same Host. The expedition remains bound to that living command, so no successor can inherit its progress."
cannibalism_reach_island_objective_tt: "Complete [?cannibalism_reach_island_goal|0] linked operations against the recorded Host. Current progress: [?cannibalism_reach_island_progress|0]."
cannibalism_reach_island_success_tt: "The sea road is open and the isolated Host loses alignment and initiative. The operation is recorded as decisive aid."
cannibalism_reach_island_partial_tt: "Charts and forward positions survive the deadline. War Support rises modestly and the Host loses some alignment."
cannibalism_reach_island_failure_tt: "The approaches close again. War Support falls and the Host gains confidence from the failed expedition."

cannibalism_break_network_mission: "Sever the Common Routes"
cannibalism_break_network_mission_desc: "Repeat joint suppression against the same recorded network country until its couriers, officers, and protected stores can no longer replace one another."
cannibalism_break_network_objective_tt: "Complete [?cannibalism_break_network_goal|0] linked suppression operations. Current progress: [?cannibalism_break_network_progress|0]."
cannibalism_break_network_success_tt: "The route family breaks. Network Reach falls sharply, Command Integrity rises, and the target loses cell and organizer strength."
cannibalism_break_network_partial_tt: "Several links remain broken. Network Reach falls and the target cell loses part of its protected traffic."
cannibalism_break_network_failure_tt: "The exposed routes are replaced faster than they are closed. Command Integrity falls and the target cell regains strength."

cannibalism_stop_unification_mission: "Fracture the Gathering"
cannibalism_stop_unification_mission_desc: "Keep the likely center under uninterrupted military pressure before the warning window closes. The operation remains bound to the same command throughout."
cannibalism_stop_unification_objective_tt: "Maintain interdiction for [?cannibalism_stop_unification_goal_days|0] days. Current uninterrupted progress: [?cannibalism_stop_unification_hold_days|0] days."
cannibalism_stop_unification_success_tt: "The gathering fractures before a single command can form. Network Reach and the target's alignment fall sharply."
cannibalism_stop_unification_partial_tt: "The interdiction delays the gathering and strips away several routes, reducing Network Reach and target alignment."
cannibalism_stop_unification_failure_tt: "The pressure breaks too soon. War Support falls and the likely center gains alignment from surviving the operation."

cannibalism_prepare_network_submission: "Prepare an Orderly Submission"
cannibalism_prepare_network_submission_desc: "Spend stores and command capacity to preserve selected officers, signals, and supply records for the approaching decision."
cannibalism_prepare_network_submission_requirements_tt: "Requires [?constant:cannibalism_objective_cost.submission_larder|0] Larder, [?constant:cannibalism_objective_cost.submission_support|0] support equipment, and [?constant:cannibalism_objective_cost.submission_command|0] command power."
cannibalism_prepare_network_submission_cost_text: "§O[?constant:cannibalism_objective_cost.submission_larder|0] Larder§! · §Y[?constant:cannibalism_objective_cost.submission_support|0] support equipment§! · §C[?constant:cannibalism_objective_cost.submission_command|0] command power§!"
cannibalism_prepare_network_submission_effect_tt: "Network Alignment rises and this Host is more likely to seek retained command when the gathering demands an answer."

cannibalism_prepare_network_resistance: "Prepare Independent Resistance"
cannibalism_prepare_network_resistance_desc: "Disperse stores, screen the command chain, and arm the formations expected to resist absorption."
cannibalism_prepare_network_resistance_requirements_tt: "Requires [?constant:cannibalism_objective_cost.resistance_larder|0] Larder, [?constant:cannibalism_objective_cost.resistance_infantry|0] infantry equipment, [?constant:cannibalism_objective_cost.resistance_support|0] support equipment, and [?constant:cannibalism_objective_cost.resistance_command|0] command power."
cannibalism_prepare_network_resistance_cost_text: "§O[?constant:cannibalism_objective_cost.resistance_larder|0] Larder§! · §Y[?constant:cannibalism_objective_cost.resistance_infantry|0] infantry / [?constant:cannibalism_objective_cost.resistance_support|0] support equipment§! · §C[?constant:cannibalism_objective_cost.resistance_command|0] command power§!"
cannibalism_prepare_network_resistance_effect_tt: "Network Alignment falls while Command Integrity and Frenzy rise. This Host becomes more likely to resist the approaching demand."

cannibalism_stop_transformation_mission: "Break the Anchor Chain"
cannibalism_stop_transformation_mission_desc: "Identify, assault, isolate, and dismantle frozen anchors before the transformation locks. The counterwar follows the recorded Host alone, and no successor inherits its progress."
cannibalism_stop_transformation_objective_tt: "Complete [?cannibalism_stop_transformation_goal|0] successful counterwar operations. Current progress: [?cannibalism_stop_transformation_progress|0]."
cannibalism_stop_transformation_success_tt: "The anchor chain breaks before lock. War Support rises and the operation is recorded as decisive aid."
cannibalism_stop_transformation_partial_tt: "Several anchors remain unusable after the deadline. War Support rises modestly, but the wider threat survives."
cannibalism_stop_transformation_failure_tt: "The counterwar loses its window. War Support falls as the surviving anchors hold."

cannibalism_compact_vigilance_partial_tt: "The inspection compact survives long enough to establish a limited standing regime, but falls short of full vigilance. This participant's reconstruction work is retired without recording failure."

