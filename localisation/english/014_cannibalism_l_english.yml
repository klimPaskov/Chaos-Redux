cannibalism.evolution.type: "Cannibal Network Escalation"
cannibalism.evolution.stage_1.title: "Ritualized Ranks"
cannibalism.evolution.stage_1.desc: "Scattered predators now share oaths, marks, ranks, and protection. The cells recognize one another, though nobody can find a headquarters."
cannibalism.evolution.stage_2.title: "The Organized Network"
cannibalism.evolution.stage_2.desc: "Cells in different countries use the same ledgers, courier routes, prisoner rules, and attack schedules. The network is clearly organized, but its center is still hidden."
cannibalism.evolution.stage_3.title: "Hannibal Lecter Commands"
cannibalism.evolution.stage_3.desc: "Hannibal Lecter steps into public view and begins drawing the mature network into one command."
cannibalism.evolution.summary: "Wartime predators grow into ritual cells, armed territories, and a network capable of fighting under one command."

ritual_predation: "Ritual Predation"
ritual_predation_desc: "Military obedience, rank, distribution, and belonging are organized through ritualized predation. Authority belongs to those who can feed, command, and keep the Host moving."

