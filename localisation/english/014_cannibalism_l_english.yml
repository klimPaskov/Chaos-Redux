cannibalism_hannibal_network_command: "The Network Command"
cannibalism_hannibal_network_command_desc: "Hannibal coordinates feeding states, warlord formations, courier routes, and reserve columns as one predatory military system."
cannibalism_hannibal_continental_command: "Continental Predation"
cannibalism_hannibal_continental_command_desc: "The unified command converts captured roads, enemy losses, and linked cells into a sustained continental offensive."
cannibalism_hannibal_terminal_command: "The Last Table"
cannibalism_hannibal_terminal_command_desc: "Every surviving institution, population center, and supply route is treated as material for a completed global Host."
cannibalism_hannibal_wendigo_command: "Command of the Joined Hunger"
cannibalism_hannibal_wendigo_command_desc: "Hannibal directs the retained cannibal hosts and the surviving Wendigo Pack through one winter campaign staff."
cannibalism_hannibal_wendigo_winter_command: "Master of the Winter Network"
cannibalism_hannibal_wendigo_winter_command_desc: "Live anchors, frozen corridors, and trained packs answer to a command that feeds military movement through severe cold."
cannibalism_hannibal_wendigo_terminal_command: "The Hunger Beneath Winter"
cannibalism_hannibal_wendigo_terminal_command_desc: "The completed transformation drives the locked Winter Host with overwhelming speed, recovery, discipline, and reinforcement."
cannibalism_wendigo_conjoined_hunger: "The Conjoined Hunger"
cannibalism_wendigo_conjoined_hunger_desc: "The existing Wendigo identity and forces remain intact while Hannibal's cannibal commands, routes, stores, and retained officers are bound to them. The merger is powerful but unstable, and its anchors remain vulnerable."
cannibalism_wendigo_winter_feeding_network: "The Winter Feeding Network"
cannibalism_wendigo_winter_feeding_network_desc: "Transformation anchors and frozen corridors sustain a faster, harder, and far less supply-dependent war machine. The network still collapses if its anchor chain is broken before the final lock."
cannibalism_wendigo_locked_terminal_form: "The World Beneath Winter"
cannibalism_wendigo_locked_terminal_form_desc: "The transformation has locked. The Winter Host moves, reinforces, recovers, and fights beyond conventional limits while occupied populations and captured equipment feed an effectively undefeatable terminal campaign."
cannibalism_warlord_focus_tree: "The Regional Host"
cannibalism_wendigo_focus_tree: "The Winter Host"
ZZZ_wendigo_preserve_the_pack_bonus: "Preserved Pack Weapons"
ZZZ_wendigo_keep_the_larder_ledger_bonus: "Inherited Larder Industry"
