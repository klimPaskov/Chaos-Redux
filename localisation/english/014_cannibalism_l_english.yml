cannibalism_cbl_last_table_map_mission: "Map the Final Larder"
cannibalism_cbl_last_table_map_mission_desc: "Keep the final larder map anchored in [?cannibalism_cbl_last_table_map_target_state.GetName], control at least four states, and maintain one completed hunting-ground project before the deadline."
cannibalism_cbl_last_table_map_success_tt: "The Last Table map is validated and ready for proclamation."
cannibalism_cbl_last_table_map_failure_tt: "The map collapses into uncontrolled raids, casualties, and another cult node."
cannibalism_cbl_pact_courier_mission: "Pact Couriers Abroad"
cannibalism_cbl_pact_courier_mission_desc: "Restore coast or rail projection through [?cannibalism_cbl_pact_courier_target_state.GetName] before the coded couriers are lost."
cannibalism_cbl_pact_courier_success_tt: "The couriers return with new marks, strengthening the global table."
cannibalism_cbl_pact_courier_failure_tt: "The courier chain breaks, leaving bodies and evidence along the route."

cannibalism_containment_deadline_mission: "Contain the Frontline Hunger"
cannibalism_containment_deadline_mission_desc: "Reach containment before the army normalizes the practice."
cannibalism_containment_deadline_success_tt: "The local outbreak is defeated before it hardens."
cannibalism_containment_deadline_failure_tt: "The local outbreak evolves beyond early containment."
cannibalism_guard_ration_rail_mission: "Guard the Ration Rail"
cannibalism_guard_ration_rail_mission_desc: "Keep [?cannibalism_ration_rail_target_state.GetName] controlled and keep supplied divisions assigned there until the ration rail stabilizes."
cannibalism_guard_ration_rail_success_tt: "The ration rail holds and hunger pressure falls."
cannibalism_guard_ration_rail_failure_tt: "The ration rail breaks and the outbreak spreads through transfer zones."
cannibalism_audit_field_hospitals_mission: "Complete the Hospital Audit"
cannibalism_audit_field_hospitals_mission_desc: "Keep [?cannibalism_hospital_audit_target_state.GetName] controlled and supplied until the hospital lists are audited."
cannibalism_audit_field_hospitals_success_tt: "The audit exposes false casualty movements."
cannibalism_audit_field_hospitals_failure_tt: "Hospital disappearances feed the outbreak."
cannibalism_seal_prison_kitchens_mission: "Seal Prison Kitchens"
cannibalism_seal_prison_kitchens_mission_desc: "Hold [?cannibalism_prison_kitchen_target_state.GetName] while prison kitchens and transfer ledgers are searched."
cannibalism_seal_prison_kitchens_success_tt: "The prison kitchen chain is broken."
cannibalism_seal_prison_kitchens_failure_tt: "Prison transfers seed new ritual cells."
cannibalism_inspect_silent_island_mission: "Silent Island Inspection"
cannibalism_inspect_silent_island_mission_desc: "Maintain naval access to [?cannibalism_island_inspection_target_state.GetName] until inspectors return."
cannibalism_inspect_silent_island_success_tt: "The island is cleared before it becomes a commune."
cannibalism_inspect_silent_island_failure_tt: "The silent garrison becomes a model for other tables."
cannibalism_evacuation_mission: "Evacuate the Marked Zone"
cannibalism_evacuation_mission_desc: "Keep convoy or field-supply access to [?cannibalism_evacuation_target_state.GetName] until the marked garrison is evacuated."
cannibalism_evacuation_success_tt: "The last ship and train get home."
cannibalism_evacuation_failure_tt: "The evacuation fails and fear surges."
cannibalism_break_ritual_cell_mission: "Purge the Ritual Cell"
cannibalism_break_ritual_cell_mission_desc: "Keep supplied troops in [?cannibalism_ritual_cell_target_state.GetName] until the cell archive is destroyed."
cannibalism_break_ritual_cell_success_tt: "The ritual cell is broken and its cookbooks burn."
cannibalism_break_ritual_cell_failure_tt: "The cell survives and recruits another node."
cannibalism_retake_commune_mission: "Retake the Table"
cannibalism_retake_commune_mission_desc: "Hold or retake [?cannibalism_commune_retake_target_state.GetName] before the commune becomes a state."
cannibalism_retake_commune_success_tt: "The commune is retaken and local pressure is cleaned up."
cannibalism_retake_commune_failure_tt: "The commune hardens and may declare itself."
cannibalism_stop_mainland_copying_mission: "Stop Mainland Copying"
cannibalism_stop_mainland_copying_mission_desc: "Keep [?cannibalism_mainland_copying_target_state.GetName] controlled as port, hospital, and prison transfer routes are inspected."
cannibalism_stop_mainland_copying_success_tt: "Courier copying is interrupted."
cannibalism_stop_mainland_copying_failure_tt: "The network teaches another country how to begin."
cannibalism_dismantle_terror_units_mission: "Dismantle the Terror Units"
cannibalism_dismantle_terror_units_mission_desc: "Keep supplied troops in [?cannibalism_terror_unit_target_state.GetName] until the exploited formations are disbanded."
cannibalism_dismantle_terror_units_success_tt: "The exploited units are dismantled."
cannibalism_dismantle_terror_units_failure_tt: "The exploited units deepen Hannibal resonance."

cannibalism_field_collapse: "Field Collapse"
cannibalism_field_collapse_desc: "Supply discipline has broken into hidden kitchens, false casualty lists, and missing transfers. The state can still defeat the outbreak if it acts before the practice becomes a creed."
cannibalism_ritual_hunger: "Ritual Hunger"
cannibalism_ritual_hunger_desc: "The practice has acquired words, proofs, and officers willing to repeat them. Hunger is becoming an ideology inside the chain of command."
cannibalism_public_truth: "Public Truth Commission"
cannibalism_public_truth_desc: "The government has chosen disclosure over silence. It damages trust, but makes the outbreak harder to hide."
cannibalism_exploitation_scandal: "Exploitation Scandal"
cannibalism_exploitation_scandal_desc: "The state used compromised formations as terror troops. The network has learned from the order, and the public is beginning to learn who signed it."
cannibalism_exploitation_condemned: "Condemned Cannibal Terror Exploitation"
cannibalism_commune_country_spirit: "Commune of the Table"
cannibalism_commune_country_spirit_desc: "The commune feeds itself through fear, seizure, and discipline by appetite. It can survive on ruins, but its command structure devours the state beneath it."
cannibalism_council_obedience: "Council Obedience"
cannibalism_council_obedience_desc: "The Table Council keeps the commune quiet enough to survive. Raids are measured, ledgers are checked, and every knife answers upward."
cannibalism_warlord_kitchen_command: "Warlord Kitchen Command"
cannibalism_warlord_kitchen_command_desc: "Commanders with armed kitchens rule by attack lists and immediate consumption. The front moves faster, but the state beneath it rots."
cannibalism_hannibal_discipline: "Hannibal Discipline"
cannibalism_hannibal_discipline_desc: "The commune aligns its appetite with a wider unifier. Hunger becomes order, courier marks become doctrine, and the table waits for instructions."
cannibalism_scavenger_logistics: "Scavenger Logistics"
cannibalism_scavenger_logistics_desc: "The commune has learned to march on stripped depots, abandoned stores, and the ruined supply lines of enemies."
cannibalism_cbl_pact_couriers: "Pact Couriers"
cannibalism_cbl_pact_couriers_desc: "Couriers pass coded ration marks between tables. Their journeys delay open war, but deepen the network."
cannibalism_cbl_solitary_rampage: "Solitary Rampage"
cannibalism_cbl_solitary_rampage_desc: "The commune refuses a wider pact and turns its isolation outward through border raids and claims."
cannibalism_last_table_discipline: "Last Table Discipline"
cannibalism_last_table_discipline_desc: "The commune has forced its hunger into a military order. It no longer wastes itself on spectacle when a campaign can feed it better."
cannibalism_last_table_integration: "Last Table Integration"
cannibalism_last_table_integration_desc: "Mapped districts, controlled states, and courier routes are being folded into one terrible administrative appetite."

cannibalism_field_disappearances_state: "Field Disappearances"
cannibalism_field_disappearances_state_desc: "Mess lines, aid posts, and transfer rosters no longer agree with one another."
cannibalism_night_transfer_zone_state: "Night Transfer Zone"
cannibalism_night_transfer_zone_state_desc: "Prisoners and civilians vanish along night roads guarded by compromised units."
cannibalism_empty_village_reports_state: "Empty Village Reports"
cannibalism_empty_village_reports_state_desc: "Patrols find warm stoves, open doors, and nobody left to answer."
cannibalism_silent_garrison_state: "Silent Garrison"
cannibalism_silent_garrison_state_desc: "The garrison still answers the wireless, but the island no longer lives by ordinary orders."
cannibalism_commune_state: "Cannibal Commune"
cannibalism_commune_state_desc: "A barricaded table controls the streets, stores, and kitchens."
cannibalism_hunting_ground_state: "Hunting Ground"
cannibalism_hunting_ground_state_desc: "The commune has turned the state into terrain for raids and fear."

