cannibalism_wendigo_launch_terminal_hunt: "Launch a Terminal Hunt"
cannibalism_wendigo_launch_terminal_hunt_desc: "Commit the winter command to [FROM.GetName]. The hunt lasts [?constant:cannibalism_wendigo_terminal_hunt.mission_days|0] days. Capitulation succeeds immediately. Otherwise, the hunt needs control of the target capital and [?constant:cannibalism_wendigo_terminal_hunt.pressure_goal|0] Hunt Pressure. Defender counterpressure, a broken route, lost anchors, an invalid target, or timeout causes failure."
cannibalism_wendigo_launch_terminal_hunt_cost_text: "[?constant:cannibalism_wendigo_terminal_hunt.launch_larder|0] Larder, [?constant:cannibalism_wendigo_terminal_hunt.launch_command|0] Command Power, [?constant:cannibalism_wendigo_terminal_hunt.launch_infantry|0] Infantry Equipment, [?constant:cannibalism_wendigo_terminal_hunt.launch_support|0] Support Equipment"
cannibalism_wendigo_launch_terminal_hunt_effect_tt: "Begins a paid [?constant:cannibalism_wendigo_terminal_hunt.mission_days|0]-day terminal hunt against [FROM.GetName] at [?constant:cannibalism_wendigo_terminal_hunt.starting_pressure|0] Hunt Pressure. No war, formation, manpower, population, or equipment is granted."

cannibalism_wendigo_terminal_hunt_mission: "Terminal Hunt: [cannibalism_wendigo_terminal_hunt_target.GetName]"
cannibalism_wendigo_terminal_hunt_mission_desc: "The winter command must force [cannibalism_wendigo_terminal_hunt_target.GetName] to capitulate, or hold its capital after Hunt Pressure reaches [?constant:cannibalism_wendigo_terminal_hunt.pressure_goal|0]. The defender may spend reserves to raise Counterpressure. The hunt fails if Counterpressure reaches [?constant:cannibalism_wendigo_terminal_hunt.counterpressure_goal|0], the route breaks, every anchor falls, the target becomes unusable, the war ends without success, or time expires."
cannibalism_wendigo_terminal_hunt_mission_cost_text: "The launch and every additional press are paid separately."
cannibalism_wendigo_terminal_hunt_mission_effect_tt: "Success adds [?constant:cannibalism_wendigo_terminal_hunt.success_progress|0] transformation progress. Failure removes [?constant:cannibalism_wendigo_terminal_hunt.failure_progress|0] transformation progress. Neither outcome creates free formations."

cannibalism_wendigo_press_terminal_hunt: "Press the Terminal Hunt"
cannibalism_wendigo_press_terminal_hunt_desc: "Spend another field package against [cannibalism_wendigo_terminal_hunt_target.GetName] to add [?constant:cannibalism_wendigo_terminal_hunt.press_pressure|0] Hunt Pressure. Pressing the hunt does not create troops, equipment, manpower, population loss, receipts, or a war goal."
cannibalism_wendigo_press_terminal_hunt_cost_text: "[?constant:cannibalism_wendigo_terminal_hunt.press_larder|0] Larder, [?constant:cannibalism_wendigo_terminal_hunt.press_command|0] Command Power, [?constant:cannibalism_wendigo_terminal_hunt.press_infantry|0] Infantry Equipment, [?constant:cannibalism_wendigo_terminal_hunt.press_support|0] Support Equipment, [?constant:cannibalism_wendigo_terminal_hunt.press_fuel|0] Fuel"
cannibalism_wendigo_press_terminal_hunt_effect_tt: "Adds [?constant:cannibalism_wendigo_terminal_hunt.press_pressure|0] Hunt Pressure, to a maximum of [?constant:cannibalism_wendigo_terminal_hunt.pressure_goal|0], and begins a [?constant:cannibalism_wendigo_terminal_hunt.press_cooldown_days|0]-day press cooldown."

cannibalism_break_wendigo_terminal_hunt: "Break the Terminal Hunt"
cannibalism_break_wendigo_terminal_hunt_desc: "Commit reserves while holding the capital to disrupt the terminal hunt. Each operation adds [?constant:cannibalism_wendigo_terminal_hunt.defender_counterpressure|0] Counterpressure. At [?constant:cannibalism_wendigo_terminal_hunt.counterpressure_goal|0] Counterpressure the active hunt fails. The anchor remains intact until a dedicated assault destroys it."
cannibalism_break_wendigo_terminal_hunt_cost_text: "[?constant:cannibalism_wendigo_terminal_hunt.defender_manpower|0] Manpower, [?constant:cannibalism_wendigo_terminal_hunt.defender_command|0] Command Power, [?constant:cannibalism_wendigo_terminal_hunt.defender_infantry|0] Infantry Equipment, [?constant:cannibalism_wendigo_terminal_hunt.defender_support|0] Support Equipment"
cannibalism_break_wendigo_terminal_hunt_effect_tt: "Adds [?constant:cannibalism_wendigo_terminal_hunt.defender_counterpressure|0] Counterpressure, to a maximum of [?constant:cannibalism_wendigo_terminal_hunt.counterpressure_goal|0], and records this country among the active resistance."

cannibalism_muster_wendigo_pack_from_enemy_death_receipt: "Muster a Pack from an Enemy-Loss Receipt"
cannibalism_muster_wendigo_pack_from_enemy_death_receipt_desc: "Spend [?constant:cannibalism_wendigo_enemy_death_receipt.muster_receipt_cost|0] recorded enemy-loss receipt at this live anchor and take exactly [?constant:cannibalism_wendigo_enemy_death_receipt.muster_population_k|0]K people from the controlled state. The paid loss supplies [?constant:cannibalism_wendigo_enemy_death_receipt.muster_manpower_factor|%0] of that amount to the reinforcement pool. One empty Wendigo Pack is then mustered within the existing Pack cap and must draw its manpower and equipment normally."
cannibalism_muster_wendigo_pack_from_enemy_death_receipt_cost_text: "[?constant:cannibalism_wendigo_enemy_death_receipt.muster_receipt_cost|0] Enemy-Loss Receipt, [?constant:cannibalism_wendigo_enemy_death_receipt.muster_population_k|0]K Population, [?constant:cannibalism_wendigo_enemy_death_receipt.muster_larder|0] Larder, [?constant:cannibalism_wendigo_enemy_death_receipt.muster_infantry|0] Infantry Equipment, [?constant:cannibalism_wendigo_enemy_death_receipt.muster_support|0] Support Equipment"
cannibalism_muster_wendigo_pack_from_enemy_death_receipt_effect_tt: "Pays the exact population and stockpile costs, records the population loss through the Deaths system, and creates one empty Wendigo Pack with no starting manpower or equipment."

cannibalism_activate_inherited_winter_cell: "Activate an Inherited Winter Cell"
cannibalism_activate_inherited_winter_cell_desc: "Activate an inherited foreign cell inside [FROM.GetName] for [?constant:cannibalism_wendigo_inherited_cell.duration_days|0] days. The cell disrupts planning, organization, and supply without creating another cell, casualties, population loss, Larder, equipment, a unit, or a war goal. If this country is the active terminal-hunt target, the cell adds [?constant:cannibalism_wendigo_inherited_cell.hunt_pressure|0] Hunt Pressure once."
cannibalism_activate_inherited_winter_cell_cost_text: "[?constant:cannibalism_wendigo_inherited_cell.larder|0] Larder, [?constant:cannibalism_wendigo_inherited_cell.command|0] Command Power, [?constant:cannibalism_wendigo_inherited_cell.support|0] Support Equipment"
cannibalism_activate_inherited_winter_cell_effect_tt: "Applies [?constant:cannibalism_wendigo_inherited_cell.duration_days|0] days of inherited-cell disruption and a [?constant:cannibalism_wendigo_inherited_cell.target_lock_days|0]-day target lock."

cannibalism_wendigo_terminal_hunt_success_tt: "The terminal hunt succeeds: the target has capitulated, or its capital is controlled while Hunt Pressure is at least [?constant:cannibalism_wendigo_terminal_hunt.pressure_goal|0]. Transformation progress rises by [?constant:cannibalism_wendigo_terminal_hunt.success_progress|0]."
