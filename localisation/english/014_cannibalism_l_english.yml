cannibalism_warlord_survival_burdens: "A Host on the Brink"
cannibalism_warlord_survival_burdens_desc: "A starving assault force, a broken chain of command, and a first territorial reserve coexist without a durable operating order. The Host can strike hard, but every plan, march, and ration issue risks collapse."
cannibalism_island_host_origin: "Island Host"
cannibalism_island_host_origin_desc: "Silent harbors and missing convoys sustain a raiding society built for coastal defense, landings, and blockade running. Fuel and replacement shipping remain its decisive weaknesses."
cannibalism_siege_commune_origin: "Siege Commune"
cannibalism_siege_commune_origin_desc: "Barricades, tunnels, workshops, and dense feeding districts let the Commune survive bombardment and relief assaults, but make it slow and territorially dependent."
cannibalism_march_host_origin: "March Host"
cannibalism_march_host_origin_desc: "Defecting formations carry a mobile Larder between depots and broken fronts. Speed is life, and a long static siege means starvation."

cannibalism_warlord_hoarder: "Hoarder"
cannibalism_warlord_hoarder_desc: "He counts every guarded store personally and starves subordinates before surrendering control of the Larder."
cannibalism_warlord_feast_captain: "Feast Captain"
cannibalism_warlord_feast_captain_desc: "He holds authority through violent success and the immediate distribution of captured stores."
cannibalism_warlord_charismatic_initiator: "Charismatic Initiator"
cannibalism_warlord_charismatic_initiator_desc: "He turns fear, hunger, and belonging into recruitment faster than the Host can safely organize it."
cannibalism_warlord_suspicious_tyrant: "Suspicious Tyrant"
cannibalism_warlord_suspicious_tyrant_desc: "He survives by watching captains, couriers, and prisoners more closely than the enemy."
cannibalism_warlord_network_disciple: "Network Disciple"
cannibalism_warlord_network_disciple_desc: "He follows shared tables, routes, and operational timings without publicly identifying their source."
cannibalism_warlord_defiant_mouth: "Defiant Mouth"
cannibalism_warlord_defiant_mouth_desc: "He rejects every outside claim to his Host and turns isolation into personal authority."
cannibalism_commander_hoarder: "Hoarder's Logistics"
cannibalism_commander_hoarder_desc: "The absorbed warlord still counts guarded stores personally and squeezes waste from every march."
cannibalism_commander_feast_captain: "Feast Captain's Momentum"
cannibalism_commander_feast_captain_desc: "Violent success remains his preferred instrument of authority, even beneath unified command."
cannibalism_commander_charismatic_initiator: "Initiator's Cadence"
cannibalism_commander_charismatic_initiator_desc: "He can still turn terror and belonging into synchronized preparation."
cannibalism_commander_suspicious_tyrant: "Tyrant's Watch"
cannibalism_commander_suspicious_tyrant_desc: "He studies scouts and subordinates with the same distrust, making his formations difficult to surprise."
cannibalism_commander_network_disciple: "Network Discipline"
cannibalism_commander_network_disciple_desc: "Copied timings and guarded routes shape every plan he carries into the field."
cannibalism_commander_defiant_mouth: "Defiant Command"
cannibalism_commander_defiant_mouth_desc: "Submission did not extinguish his refusal to yield ground or abandon a broken formation."
cannibalism_bound_servant: "Bound Servant"
cannibalism_bound_servant_desc: "His surrendered warband is gone. Guards, hostages, and a watched staff keep the former warlord useful but deliberately weak."
cannibalism_host_commander: "Host Commander"
cannibalism_host_commander_desc: "This commander understands warband momentum, ration violence, and the brittle loyalties of a predatory army."
cannibalism_island_raider_commander: "Island Reaver"
cannibalism_island_raider_commander_desc: "Coastal raids, small landings, and hasty embarkation define his command."
cannibalism_siege_commander: "Siege Eater"
cannibalism_siege_commander_desc: "He organizes barricades, tunnels, workshops, and sudden relief-route assaults."
cannibalism_march_commander: "March Captain"
cannibalism_march_commander_desc: "He keeps columns moving between depots before hunger can immobilize them."

