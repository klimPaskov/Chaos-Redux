l_english:
mengele_event016_xenobiological_synthesis_theory: "Establish Xenobiological Synthesis Theory"
mengele_event016_xenobiological_synthesis_theory_desc: "Study alien tissue, growth cycles, and containment needs before breeding assault organisms."
mengele_event016_xenobiological_synthesis_prototype: "Grow a Xenobiological Prototype"
mengele_event016_xenobiological_synthesis_prototype_desc: "Raise a viable alien organism and test whether it can be contained under laboratory conditions."
mengele_event016_xenobiological_synthesis_deployment: "Deploy Xenobiological Organisms"
mengele_event016_xenobiological_synthesis_deployment_desc: "Establish breeding, transport, containment, and handler capacity for sustained operations."
mengele_event016_xenobiological_synthesis_weaponization: "Weaponize Xenobiological Organisms"
mengele_event016_xenobiological_synthesis_weaponization_desc: "Prepare assault organisms and trained handlers for coordinated battlefield use."

mengele_event016_xenobiological_synthesis_theory_cost: "£pol_power §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisTheoryPoliticalPower]§!  £support_equipment_text_icon §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisTheorySupportEquipment]§!"
