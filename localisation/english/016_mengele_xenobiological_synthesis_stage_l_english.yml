l_english:
mengele_event016_xenobiological_synthesis_theory: "Establish Xenobiological Synthesis Theory"
mengele_event016_xenobiological_synthesis_theory_desc: "Study alien tissue, growth cycles, and containment needs before breeding assault organisms."
mengele_event016_xenobiological_synthesis_prototype: "Grow a Xenobiological Prototype"
mengele_event016_xenobiological_synthesis_prototype_desc: "Raise a viable alien organism and test whether it can be contained under laboratory conditions."
mengele_event016_xenobiological_synthesis_deployment: "Deploy Xenobiological Organisms"
mengele_event016_xenobiological_synthesis_deployment_desc: "Establish breeding, transport, containment, and handler capacity for sustained operations."
mengele_event016_xenobiological_synthesis_weaponization: "Weaponize Xenobiological Organisms"
mengele_event016_xenobiological_synthesis_weaponization_desc: "Prepare assault organisms and trained handlers for coordinated battlefield use."

mengele_event016_xenobiological_synthesis_theory_cost: "£pol_power §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisTheoryPoliticalPower]§!  £support_equipment_text_icon §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisTheorySupportEquipment]§!"
mengele_event016_xenobiological_synthesis_prototype_cost: "£pol_power §Y[This.GetMengeleStageValueFallbackXenobiologicalSynthesisPoliticalPower]§!  £support_equipment_text_icon §Y[This.GetMengeleStageValueFallbackXenobiologicalSynthesisSupportEquipment]§!  £GFX_fuel_texticon §Y[This.GetMengeleStageValueFallbackXenobiologicalSynthesisFuel]§!"
mengele_event016_xenobiological_synthesis_deployment_cost: "£pol_power §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisDeploymentPoliticalPower]§!  £support_equipment_text_icon §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisDeploymentSupportEquipment]§!  £GFX_fuel_texticon §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisDeploymentFuel]§!"
mengele_event016_xenobiological_synthesis_weaponization_cost: "£pol_power §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisWeaponizationPoliticalPower]§!  £support_equipment_text_icon §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisWeaponizationSupportEquipment]§!  £GFX_fuel_texticon §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisWeaponizationFuel]§!"

mengele_event016_xenobiological_synthesis_theory_requirements_tt: "The Directorate's research programme is active and xenobiological theory remains unfinished."
mengele_event016_xenobiological_synthesis_prototype_requirements_tt: "Xenobiological theory is complete. The Directorate can support a living prototype."
mengele_event016_xenobiological_synthesis_deployment_requirements_tt: "The Xenobiological Prototype has been recorded under Mengele's programme."
mengele_event016_xenobiological_synthesis_weaponization_requirements_tt: "Alien organisms have been deployed under Mengele's programme."
mengele_event016_xenobiological_synthesis_theory_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisTheoryCivilianFactories]§! until the work ends. The Political Power and Support Equipment shown in the cost row are spent when work begins."
mengele_event016_xenobiological_synthesis_prototype_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueFallbackXenobiologicalSynthesisCivilianFactories]§! until the work ends. The Political Power, Support Equipment, and Fuel shown in the cost row are spent when work begins."
mengele_event016_xenobiological_synthesis_deployment_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisDeploymentCivilianFactories]§! until the work ends. The Political Power, Support Equipment, and Fuel shown in the cost row are spent when work begins."
mengele_event016_xenobiological_synthesis_weaponization_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisWeaponizationCivilianFactories]§! until the work ends. The Political Power, Support Equipment, and Fuel shown in the cost row are spent when work begins."

mengele_event016_xenobiological_synthesis_stage_started_tt: "The listed stores are committed. Civilian factories remain assigned until this work ends."
mengele_event016_xenobiological_synthesis_stage_cancel_trigger_tt: "The programme has lost authority over this work."
mengele_event016_xenobiological_synthesis_stage_cancelled_tt: "The work is cancelled. Committed stores return and civilian factories are released."
mengele_event016_xenobiological_synthesis_theory_effect_tt: "Xenobiological synthesis theory is established."
mengele_event016_xenobiological_synthesis_prototype_effect_tt: "A living xenobiological prototype is complete. Organism operations are available."
mengele_event016_xenobiological_synthesis_deployment_effect_tt: "Alien organisms are ready for sustained operations."
mengele_event016_xenobiological_synthesis_weaponization_effect_tt: "Assault organisms and handlers are ready for battlefield service."

