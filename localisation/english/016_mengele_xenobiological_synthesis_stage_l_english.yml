mengele_event016_xenobiological_synthesis_theory_requirements_tt: "The Directorate's research program is active and Xenobiological Synthesis Theory remains unfinished."
mengele_event016_xenobiological_synthesis_prototype_requirements_tt: "Xenobiological Synthesis Theory is complete. The Directorate can fund a first living alien organism."
mengele_event016_xenobiological_synthesis_deployment_requirements_tt: "The Xenobiological Prototype has been recorded under Mengele's program."
mengele_event016_xenobiological_synthesis_weaponization_requirements_tt: "Alien organisms have been deployed under Mengele's program."
mengele_event016_xenobiological_synthesis_theory_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisTheoryCivilianFactories]§! until the stage ends. Political Power and Support Equipment are paid when the stage begins."
mengele_event016_xenobiological_synthesis_prototype_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueFallbackXenobiologicalSynthesisCivilianFactories]§! until the stage ends. Political Power, Support Equipment, and Fuel are paid when the stage begins."
mengele_event016_xenobiological_synthesis_deployment_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisDeploymentCivilianFactories]§! until the stage ends. Political Power, Support Equipment, and Fuel are paid when the stage begins."
mengele_event016_xenobiological_synthesis_weaponization_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStageXenobiologicalSynthesisWeaponizationCivilianFactories]§! until the stage ends. Political Power, Support Equipment, and Fuel are paid when the stage begins."

mengele_event016_xenobiological_synthesis_stage_started_tt: "The listed stores are spent. The civilian factories stay assigned until the work ends."
mengele_event016_xenobiological_synthesis_stage_cancel_trigger_tt: "Mengele's program can no longer carry out this work."
mengele_event016_xenobiological_synthesis_stage_cancelled_tt: "The work is cancelled. Recorded payments are returned and the civilian factories are released."
mengele_event016_xenobiological_synthesis_theory_effect_tt: "Xenobiological synthesis theory is established."
mengele_event016_xenobiological_synthesis_prototype_effect_tt: "A living xenobiological prototype is complete. Organism operations are available."
mengele_event016_xenobiological_synthesis_deployment_effect_tt: "Alien organisms are ready for sustained operations."
mengele_event016_xenobiological_synthesis_weaponization_effect_tt: "Assault organisms and handlers are ready for battlefield service."

