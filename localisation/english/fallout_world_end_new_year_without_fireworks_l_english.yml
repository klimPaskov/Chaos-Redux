chaosx.event_name.655: "New Year Register Closure"
chaosx.fallout.649.d: "As the year turns, an East Asian settlement faces a low ash-darkened sky. Covered lamps line a ration table, memorial ribbons hang from a cold wall, and guards keep the road clear while families decide how much of the night can be shared. The choice will leave a durable memory in the country that survives the winter."
chaosx.fallout.649.a: "Quiet Remembrance"
chaosx.fallout.649.b: "Hold a Ration Feast"
chaosx.fallout.649.c: "Stage a Military Ceremony"
chaosx.fallout.649.d_option: "Leave the Night to Local Festivals"
chaosx.fallout.649.a.tt: "Spend [?constant:fallout_event_649_cost.quiet_recognition|0] Recognition, [?constant:fallout_event_649_cost.quiet_shelter|0] Shelter Capacity, and [?constant:fallout_event_649_cost.quiet_medicine|0] Medicine. The result is judged after [?constant:fallout_event_649_timing.result_delay_days|0] days and reviewed again after [?constant:fallout_event_649_timing.callback_delay_days|0] days."
chaosx.fallout.649.b.tt: "Spend [?constant:fallout_event_649_cost.feast_food|0] Food, [?constant:fallout_event_649_cost.feast_clean_water|0] Clean Water, and [?constant:fallout_event_649_cost.feast_fuel|0] Fuel. The result is judged after [?constant:fallout_event_649_timing.result_delay_days|0] days and reviewed again after [?constant:fallout_event_649_timing.callback_delay_days|0] days."
chaosx.fallout.649.c.tt: "Spend [?constant:fallout_event_649_cost.military_food|0] Food, [?constant:fallout_event_649_cost.military_fuel|0] Fuel, and [?constant:fallout_event_649_cost.military_command_power|0] Command Power. The result is judged after [?constant:fallout_event_649_timing.result_delay_days|0] days and reviewed again after [?constant:fallout_event_649_timing.callback_delay_days|0] days."
chaosx.fallout.649.d_option.tt: "Spend [?constant:fallout_event_649_cost.festivals_food|0] Food, [?constant:fallout_event_649_cost.festivals_recognition|0] Recognition, and [?constant:fallout_event_649_cost.festivals_scrap|0] Scrap. The result is judged after [?constant:fallout_event_649_timing.result_delay_days|0] days and reviewed again after [?constant:fallout_event_649_timing.callback_delay_days|0] days."

chaosx.fallout.651.t: "The Morning After the Turning"
chaosx.fallout.651.quiet.success.d: "The covered lamps stayed lit through the coldest hours. Families kept a quiet remembrance beside the ration table, the memorial ribbons became a shared register, and the settlement gained a little medicine, shelter, and recognition for the season ahead."
chaosx.fallout.651.quiet.partial.d: "The quiet remembrance reached the central shelters, but the outer road lost its lamps before dawn. The ribbons were kept, although some households still waited for medicine and a place at the table."
chaosx.fallout.651.quiet.failure.d: "The cold broke the meeting before the names were finished. The lamps went dark, the memorial ribbons were torn down in the argument, and the settlement lost medicine, shelter, recognition, and lives to the failed night."
chaosx.fallout.651.feast.success.d: "A measured ration feast gave the settlement one warm table without emptying the storehouse. Guards and families shared the same queue, the water tins stayed clean, and the shared-table trust ledger rose with the new year."
chaosx.fallout.651.feast.partial.d: "The ration feast reached the central shelters, but the last tables received thin portions. The settlement kept its water and its dignity, while the shared-table trust ledger rose only slightly."
chaosx.fallout.651.feast.failure.d: "The ration feast outran the stores before the last district arrived. Empty tins and a crowded gate turned the celebration into a dispute, leaving the shared-table trust ledger weaker than it began."
chaosx.fallout.651.military.success.d: "The guard formed a measured line around the covered lamps. A short military ceremony protected the ration route, kept the roads open, and raised martial pageantry without making the night a spectacle."
chaosx.fallout.651.military.partial.d: "The military ceremony held the central square, but the outer roads remained dark. The guards kept order and the martial pageantry ledger rose, although families outside the patrol line were left to mark the turn alone."
chaosx.fallout.651.military.failure.d: "The ceremony became a checkpoint before it became a remembrance. Fuel ran short, the guards lost the outer road, and martial pageantry weakened with the families who refused the closed gate."
chaosx.fallout.651.local.success.d: "Local festivals filled the cold streets with covered lamps, hand bells, and food counted by each neighborhood. The settlement kept its local festival autonomy while the memorial ribbons moved from door to door."
chaosx.fallout.651.local.partial.d: "Local festivals held in the neighborhoods that still had fuel. The central square stayed quiet, yet local festival autonomy rose as each district kept its own careful measure."
chaosx.fallout.651.local.failure.d: "The local festivals split along the ration routes. Some lamps were covered, others were left unguarded, and the settlement lost cohesion as the night passed without one shared register."
chaosx.fallout.651.a: "Record the night"
chaosx.fallout.651.a.tt: "Apply the result, write the New Year memory to the Event Log, and schedule the follow-up register after 330 days."

chaosx.fallout.653.t: "The Next New Year Register"
chaosx.fallout.653.success.d: "The follow-up register finds the covered lamps repaired, the ration table counted, and the memorial ribbons tied to one durable country memory. The settlement can enter the next year with a little more food, water, medicine, shelter, recognition, and cohesion."
chaosx.fallout.653.partial.d: "The follow-up register works in the central shelters, but the outer districts still keep their own names and portions. The country memory survives with a narrow path toward the next winter."
chaosx.fallout.653.failure.d: "The follow-up register finds a cold table, missing ribbons, and a road that no longer answers the lamps. Disease pressure rises, the country loses more people to the failed observance, and the durable memory closes as a warning."
chaosx.fallout.653.a: "Close the New Year register"
chaosx.fallout.653.a.tt: "Record the delayed outcome and close the New Year register."

