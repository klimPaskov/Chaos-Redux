l_english:
africa_priority_member_category: "Priority Member Settlement"
africa_priority_member_category_desc: "Recognised countries govern their own political settlement, distinct institutions, forces, Charter relationship, overlap disputes, departure rights, and continuing national programme."
africa_survey_priority_member_candidate: "Survey [FROM.GetNameDef] for a Priority Package"
africa_survey_priority_member_candidate_desc: "A regional congress can test [FROM.GetNameDef]'s compact base against the six promotion conditions. The current dossier records §Y[?FROM.africa_priority_promotion_criteria_count|0]§! conditions and §Y[?FROM.africa_priority_local_support|0]§! local support. At least three conditions and the minimum support threshold are required. Opinion is not evidence and grants nothing."
africa_survey_priority_member_candidate_tt: "Rebuilds [FROM.GetNameDef]'s promotion dossier from current territory, institutions, strategic function, League problem, population and infrastructure, and distinct package identity, then selects that country for the Charter action card. The survey transfers no territory, grants no cores, and changes no relationship status."
africa_resolve_priority_member_requalification: "Resolve [FROM.GetNameDef]'s Promotion Obstacle"
africa_resolve_priority_member_requalification_desc: "The partial congress settlement left [FROM.GetNameDef] protected or associated without activating its full package. The recorded obstacle is §Y[FROM.GetAfricaPriorityRequalificationIssue]§!. The issue must be solved in live country conditions before a fresh survey and another full promotion action."
africa_resolve_priority_member_requalification_tt: "Records the promotion obstacle as resolved and rebuilds the dossier. This does not activate the full country package. A later full promotion result remains mandatory."
africa_priority_requalification_issue_access: "an inadequate working access corridor"
africa_priority_requalification_issue_overlap: "an unsettled congress or overlap question"
africa_priority_requalification_issue_local_ratification: "insufficient local ratification"
africa_priority_requalification_issue_unrecorded: "an unrecorded compact-settlement problem"
africa_priority_member_ratify_promoted_package: "Ratify the Recognised Polity Settlement"
africa_priority_member_ratify_promoted_package_desc: "The regional congress has recognised [ROOT.GetName]'s viable territory, functioning institution, local support, and distinct role. Ratification opens the country's own settlement rather than absorbing it into the host."
africa_priority_member_ratify_promoted_package_tt: "Confirms the recognised country's settlement and opens its political debate. No territory or relationship status changes automatically."
africa_priority_member_convene_political_settlement: "Convene the National Political Settlement"
africa_priority_member_convene_political_settlement_desc: "The recognised country must decide who governs, how councils and parties compete, and which institutions limit the executive."
africa_priority_member_convene_political_settlement_tt: "Opens the country's constitutional choice among a council route, civic route, and producer route."
africa_priority_member_negotiate_league_role: "Negotiate the Charter League Role"
africa_priority_member_negotiate_league_role_desc: "[ROOT.GetName] can accept one lawful relationship stage, offer an autonomy counterproposal, refuse, or open departure terms."
africa_priority_member_negotiate_league_role_tt: "Opens direct Charter bargaining. Positive opinion cannot change relationship status."
africa_priority_member_resolve_overlap: "Resolve the Overlap Question"
africa_priority_member_resolve_overlap_desc: "Claims, corridors, communities, and institutions that extend beyond the compact country require congress, consent, autonomy, or rivalry."
africa_priority_member_resolve_overlap_tt: "Opens a binding overlap settlement without granting automatic cores or annexing another country."
africa_priority_member_open_departure_terms: "Open Departure and Renewal Terms"
africa_priority_member_open_departure_terms_desc: "Membership can be renewed, ended through a timed negotiated withdrawal, or replaced by a rival bloc."
africa_priority_member_open_departure_terms_tt: "Opens the country's explicit renewal, peaceful exit, and rivalry choices."
africa_priority_member_recall_withdrawal_notice: "Recall the Withdrawal Notice"
africa_priority_member_recall_withdrawal_notice_desc: "The government can end the withdrawal period and return to staged Charter bargaining."
africa_priority_member_recall_withdrawal_notice_tt: "Cancels the withdrawal mission and renews the relationship by at most one lawful stage."
africa_priority_member_withdrawal_mission: "Complete the Negotiated Withdrawal"
africa_priority_member_withdrawal_mission_desc: "Units, bases, debts, borders, access rights, and public obligations are being settled before [ROOT.GetName] leaves the Charter."
africa_priority_member_withdrawal_mission_complete_tt: "[ROOT.GetName] completes a peaceful exit and remains playable as an outside country."
africa_priority_member_coastal_site_required_tt: "[ROOT.GetName] must own and control a coastal state for this maritime programme."
africa_priority_asante_advance_mechanic: "Convene the Stool and Revenue Council"
africa_priority_asante_advance_mechanic_desc: "Asante can bind stool legitimacy to council representation, succession law, cocoa and gold revenue, and public works. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_asante_advance_mechanic_tt: "Advances stool and council legitimacy, improves stability, and strengthens regional restoration and equality. A public works project is built as the compact matures."
africa_priority_oyo_advance_mechanic: "Negotiate the Corridor and City Compact"
africa_priority_oyo_advance_mechanic_desc: "Oyo must connect the Alaafin, Ife, inland cities, road corridors, and a negotiated port without reviving tributary rule by decree. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_oyo_advance_mechanic_tt: "Advances the corridor and city compact, adds mobile equipment and army experience, and extends continental reach at a manageable administrative cost."
africa_priority_sokoto_advance_mechanic: "Reform the Emirate Compact"
africa_priority_sokoto_advance_mechanic_desc: "Sokoto must reconcile emirate authority with consultative government, legal reform, education, pastoral access, taxation, and Charter obligations. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_sokoto_advance_mechanic_tt: "Advances the emirate reform compact, improves stability and army experience, and strengthens consent within the Charter."
africa_priority_kanem_bornu_advance_mechanic: "Convene the Lake and Caravan Covenant"
africa_priority_kanem_bornu_advance_mechanic_desc: "Kanem-Bornu depends on a living Lake Chad settlement for wells, fisheries, pasture, customs, caravan security, and cross-border movement. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_kanem_bornu_advance_mechanic_tt: "Advances the lake and caravan covenant, adds trains and motorised equipment, improves stability, and extends continental reach."
africa_priority_manden_advance_mechanic: "Build the Manden Restoration Assembly"
africa_priority_manden_advance_mechanic_desc: "Manden needs legitimacy from local authorities, civic delegates, producer bodies, scholars, and corridor partners rather than one uncontested imperial claimant. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_manden_advance_mechanic_tt: "Advances assembly legitimacy, supports rail access and political organisation, improves stability, and strengthens regional equality."
africa_priority_kongo_advance_mechanic: "Record Kongo Cross-Border Community Consent"
africa_priority_kongo_advance_mechanic_desc: "Kongo separates cultural citizenship and community ties from territorial integration across Belgian, French, and Portuguese colonial borders. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_kongo_advance_mechanic_tt: "Advances cross-border consent, supports river and port access, improves stability, and strengthens Charter consent and regional equality."
africa_priority_buganda_advance_mechanic: "Balance the Buganda Kingdom and Federation"
africa_priority_buganda_advance_mechanic_desc: "Buganda must make the Kabaka, Lukiiko, mailo land, cotton revenue, Bunyoro grievances, and equal Ugandan representation part of one visible bargain. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_buganda_advance_mechanic_tt: "Advances kingdom confidence, supports lake transport, improves stability, and strengthens representation within the Charter."
africa_priority_aksum_advance_mechanic: "Separate Aksum Heritage from Political Claim"
africa_priority_aksum_advance_mechanic_desc: "Aksum must distinguish monument custody and cultural recognition from living consent in Ethiopian, Eritrean, highland, and Red Sea politics. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_aksum_advance_mechanic_tt: "Advances the heritage and consent settlement, supports highland logistics, improves stability, and strengthens restoration legitimacy and regional reach."
africa_priority_harar_advance_mechanic: "Diversify Harar Corridor Guarantees"
africa_priority_harar_advance_mechanic_desc: "Harar needs balanced water, food, railway, caravan, market, and port access instead of dependence on one patron or host. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_harar_advance_mechanic_tt: "Advances diversified corridor guarantees, adds trains and convoys, improves stability, and extends continental reach."
africa_priority_kilwa_advance_mechanic: "Arbitrate Kilwa Port Customs and Patrols"
africa_priority_kilwa_advance_mechanic_desc: "Kilwa must negotiate tariffs, patrols, maritime courts, representation, island relations, labour interests, and inland access among a plural coast. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_kilwa_advance_mechanic_tt: "Advances common customs and patrol arbitration, adds convoys and naval experience, and extends continental reach. A coastal dockyard is built as the compact matures."
africa_priority_nubia_advance_mechanic: "Establish the Nubia River Rights Commission"
africa_priority_nubia_advance_mechanic_desc: "Nubia needs dual recognition from Egypt, Sudan, and affected communities alongside enforceable water, land, transport, and heritage rights. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_nubia_advance_mechanic_tt: "Advances river rights and dual recognition, adds trains and support equipment, improves stability, and strengthens regional equality."
africa_priority_luba_advance_mechanic: "Settle Luba Mining Revenue and Political Status"
africa_priority_luba_advance_mechanic_desc: "Luba must separate cultural affiliation from political status while negotiating mining revenue, labour rights, rail and river access, and the Kazembe question. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_luba_advance_mechanic_tt: "Advances mining revenue and consent, adds support equipment and political capacity, and strengthens restoration legitimacy and regional equality."
africa_priority_lunda_advance_mechanic: "Open the Lunda Cross-Border Access Congress"
africa_priority_lunda_advance_mechanic_desc: "Lunda must pair claimant legitimacy with cross-border consent, citizenship, mining revenue, trade routes, rail access, and the Kazembe question. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_lunda_advance_mechanic_tt: "Advances cross-border access, adds motorised and train equipment, and strengthens continental reach and regional equality."
africa_priority_great_zimbabwe_advance_mechanic: "Build the Great Zimbabwe Restoration Mandate"
africa_priority_great_zimbabwe_advance_mechanic_desc: "Great Zimbabwe must build separate support among heritage custodians, rural communities, urban organisers, land reformers, and mining workers. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_great_zimbabwe_advance_mechanic_tt: "Advances the restoration mandate, adds support equipment and army experience, and strengthens restoration legitimacy. Public industry grows as the mandate matures."
africa_priority_merina_advance_mechanic: "Test Merina Island Confidence"
africa_priority_merina_advance_mechanic_desc: "Merina must earn coastal and regional acceptance for land, labour, language, road, port, and representation policy across Madagascar. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_merina_advance_mechanic_tt: "Advances island confidence, adds convoys and trains, improves stability, and strengthens regional equality and reach."
africa_priority_zulu_advance_mechanic: "Balance Zulu Crown, Land, and Labour"
africa_priority_zulu_advance_mechanic_desc: "Zulu politics must link crown authority and territorial mobilisation to lawful land reform, rural consent, migrant labour protection, and urban representation. Institutional progress: [?africa_priority_member_mechanic_progress|0]."
africa_priority_zulu_advance_mechanic_tt: "Advances the crown, land, and labour settlement, adds support equipment and army experience, improves stability and war support, and strengthens common defence."
africa_priority_asante_reinforce_force: "Expand the Asante Royal Guard"
africa_priority_asante_reinforce_force_desc: "The royal guard, local infantry, and veterans need a disciplined reinforcement path that can serve Asante or a federal contingent. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_asante_reinforce_force_tt: "Commits a trained manpower cohort, adds infantry and support equipment, and develops army experience."
africa_priority_oyo_reinforce_force: "Raise Oyo Mobile Corridor Brigades"
africa_priority_oyo_reinforce_force_desc: "Local infantry, mobile formations, cavalry traditions, and urban guards can secure the compact without claiming every remembered dependency. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_oyo_reinforce_force_tt: "Commits a trained manpower cohort, adds infantry and motorised equipment, and develops army experience."
africa_priority_sokoto_reinforce_force: "Reinforce the Sokoto Frontier Guards"
africa_priority_sokoto_reinforce_force_desc: "Mobile traditions, local infantry, and frontier guards can defend pastoral routes while later motorised formations serve a wider settlement. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_sokoto_reinforce_force_tt: "Commits a trained manpower cohort, adds infantry and motorised equipment, and develops army experience."
africa_priority_kanem_bornu_reinforce_force: "Expand the Kanem-Bornu Lake and Caravan Guards"
africa_priority_kanem_bornu_reinforce_force_desc: "Mobile frontier troops, lake guards, local infantry, and desert transport units protect water and trade without enforcing maximal borders. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_kanem_bornu_reinforce_force_tt: "Commits a trained manpower cohort and adds infantry, motorised, and train equipment."
africa_priority_manden_reinforce_force: "Organise Manden River and Caravan Guards"
africa_priority_manden_reinforce_force_desc: "Local infantry, river guards, caravan guards, and mounted traditions can defend a compact inland state and its negotiated corridors. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_manden_reinforce_force_tt: "Commits a trained manpower cohort, adds infantry and train equipment, and develops army experience."
africa_priority_kongo_reinforce_force: "Form the Kongo River and Port Guard"
africa_priority_kongo_reinforce_force_desc: "Local guards, defectors, river troops, and port units can defend a compact Kongo settlement and its lawful access routes. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_kongo_reinforce_force_tt: "Commits a trained manpower cohort, adds infantry equipment and convoys, and develops army experience."
africa_priority_buganda_reinforce_force: "Reinforce the Buganda Royal and Lake Guards"
africa_priority_buganda_reinforce_force_desc: "Royal guards, lake units, regional infantry, and later federal contingents defend Buganda without erasing neighbouring kingdoms or districts. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_buganda_reinforce_force_tt: "Commits a trained manpower cohort, adds infantry equipment and convoys, and develops army experience."
africa_priority_aksum_reinforce_force: "Build the Aksum Highland Logistics Corps"
africa_priority_aksum_reinforce_force_desc: "Highland infantry, territorial guards, mule logistics, engineers, and Red Sea support form a defensive force suited to the compact settlement. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_aksum_reinforce_force_tt: "Commits a trained manpower cohort, adds infantry and support equipment, and develops army experience."
africa_priority_harar_reinforce_force: "Expand the Harar City and Corridor Guard"
africa_priority_harar_reinforce_force_desc: "City guards, mounted patrols, railway security, caravan security, and League volunteers protect Harar without claiming the wider plateau. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_harar_reinforce_force_tt: "Commits a trained manpower cohort and adds infantry, train, and motorised equipment."
africa_priority_kilwa_reinforce_force: "Expand the Kilwa Coast Guard and Marines"
africa_priority_kilwa_reinforce_force_desc: "Coastal guards, marines, dhow patrols, port engineers, and a small later fleet protect the maritime compact. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_kilwa_reinforce_force_tt: "Commits a trained manpower cohort, adds infantry equipment and convoys, and develops naval experience."
africa_priority_nubia_reinforce_force: "Raise Nubia River Engineers and Desert Patrols"
africa_priority_nubia_reinforce_force_desc: "River guards, desert patrols, engineers, and light infantry protect communities and infrastructure without imposing a border by force. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_nubia_reinforce_force_tt: "Commits a trained manpower cohort and adds infantry, support, and train equipment."
africa_priority_luba_reinforce_force: "Reform Luba Mining Security and River Troops"
africa_priority_luba_reinforce_force_desc: "Local guards, reformed mining security units, river troops, and regional infantry replace concession coercion with public command. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_luba_reinforce_force_tt: "Commits a trained manpower cohort, adds infantry and support equipment, and develops army experience."
africa_priority_lunda_reinforce_force: "Expand Lunda Frontier and River Units"
africa_priority_lunda_reinforce_force_desc: "Local guards, frontier troops, river units, and regional infantry defend communities and routes without imposing an unwanted federation. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_lunda_reinforce_force_tt: "Commits a trained manpower cohort, adds infantry and motorised equipment, and develops army experience."
africa_priority_great_zimbabwe_reinforce_force: "Organise Great Zimbabwe Engineers and Regulars"
africa_priority_great_zimbabwe_reinforce_force_desc: "Local defence groups, defectors, mounted and motorised units, engineers, and regular infantry protect the compact settlement. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_great_zimbabwe_reinforce_force_tt: "Commits a trained manpower cohort and adds infantry, motorised, and support equipment."
africa_priority_merina_reinforce_force: "Build Merina Island Logistics and Coastal Guards"
africa_priority_merina_reinforce_force_desc: "Highland infantry, coastal guards, reformed gendarmes, island logistics, and marines can defend Madagascar under an agreed settlement. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_merina_reinforce_force_tt: "Commits a trained manpower cohort, adds infantry equipment and convoys, and develops army experience."
africa_priority_zulu_reinforce_force: "Professionalise the Zulu Territorial Forces"
africa_priority_zulu_reinforce_force_desc: "Territorial infantry, scouts, mounted units, engineers, and later regular formations defend the settlement under public command. Security readiness: [?africa_priority_member_security_readiness|0]."
africa_priority_zulu_reinforce_force_tt: "Commits a trained manpower cohort, adds infantry and support equipment, and develops army experience."
africa_priority_asante_post_settlement_action: "Fund Asante Producer Boards and Public Works"
africa_priority_asante_post_settlement_action_desc: "Producer boards, regional arbitration, succession management, and public infrastructure keep Asante playable after its constitutional settlement."
africa_priority_asante_post_settlement_action_tt: "Funds producer administration and public works, improves stability, and strengthens regional equality."
africa_priority_oyo_post_settlement_action: "Open Oyo Market Corridors and Port Treaties"
africa_priority_oyo_post_settlement_action_desc: "Market corridors, urban arbitration, agricultural development, and port treaties give Oyo a durable regional role."
africa_priority_oyo_post_settlement_action_tt: "Expands mobile transport, improves stability, and extends negotiated continental reach."
africa_priority_sokoto_post_settlement_action: "Govern Sokoto Pastoral Routes and Schools"
africa_priority_sokoto_post_settlement_action_desc: "Pastoral water routes, education reform, Sahel diplomacy, and drought resilience sustain Sokoto beyond accession."
africa_priority_sokoto_post_settlement_action_tt: "Supports rail and pastoral administration, improves stability, and deepens Charter consent."
africa_priority_kanem_bornu_post_settlement_action: "Coordinate Kanem-Bornu Drought and Caravan Relief"
africa_priority_kanem_bornu_post_settlement_action_desc: "Water governance, caravan security, drought relief, and cross-border markets remain central after the League settlement."
africa_priority_kanem_bornu_post_settlement_action_tt: "Supports mobile relief and market administration, improves stability, and extends regional reach."
africa_priority_manden_post_settlement_action: "Fund Manden River, Road, and Cultural Institutions"
africa_priority_manden_post_settlement_action_desc: "River and road projects, cultural institutions, agriculture, and inland-coastal bargaining give Manden continuing work."
africa_priority_manden_post_settlement_action_tt: "Supports transport and civic administration while strengthening regional equality."
africa_priority_kongo_post_settlement_action: "Administer Kongo Cross-Border Rights and River Ports"
africa_priority_kongo_post_settlement_action_desc: "Cross-border rights, river administration, port access, education, and mediation keep Kongo active after settlement."
africa_priority_kongo_post_settlement_action_tt: "Supports river transport, improves stability, and deepens consent across the Charter."
africa_priority_buganda_post_settlement_action: "Share Buganda Cotton Revenue and Lake Investment"
africa_priority_buganda_post_settlement_action_desc: "Cotton revenue sharing, lake projects, kingdom-federal arbitration, and constitutional succession sustain the settlement."
africa_priority_buganda_post_settlement_action_tt: "Supports lake transport and public administration while strengthening regional representation."
africa_priority_aksum_post_settlement_action: "Fund Aksum Heritage, Red Sea, and Highland Projects"
africa_priority_aksum_post_settlement_action_desc: "Heritage institutions, Red Sea treaties, highland infrastructure, and autonomy arbitration keep Aksum playable without expansion."
africa_priority_aksum_post_settlement_action_tt: "Supports highland logistics, improves stability, and strengthens restoration legitimacy."
africa_priority_harar_post_settlement_action: "Secure Harar Water, Education, and Trade Routes"
africa_priority_harar_post_settlement_action_desc: "Trade arbitration, corridor diversification, water security, endowments, and schools sustain Harar after its settlement."
africa_priority_harar_post_settlement_action_tt: "Supports corridor logistics, improves stability, and extends negotiated reach."
africa_priority_kilwa_post_settlement_action: "Invest in Kilwa Ports, Customs, and Island Security"
africa_priority_kilwa_post_settlement_action_desc: "Customs arbitration, port investment, inland corridor treaties, and island security keep Kilwa central to the Indian Ocean."
africa_priority_kilwa_post_settlement_action_tt: "Expands shipping and naval experience while extending regional reach."
africa_priority_nubia_post_settlement_action: "Fund Nubia Irrigation, River Transport, and Heritage"
africa_priority_nubia_post_settlement_action_desc: "Water negotiation, irrigation, river transport, heritage governance, and cross-border mediation define Nubia after settlement."
africa_priority_nubia_post_settlement_action_tt: "Supports river logistics, improves stability, and strengthens regional equality."
africa_priority_luba_post_settlement_action: "Build Luba Public Processing and Railway Projects"
africa_priority_luba_post_settlement_action_desc: "Mining labour, public processing, railway projects, and Luba-Lunda arbitration keep the country active after settlement."
africa_priority_luba_post_settlement_action_tt: "Activates public processing, supports rail logistics and administration, and strengthens regional equality."
africa_priority_lunda_post_settlement_action: "Administer Lunda Citizenship, Corridors, and Mining Revenue"
africa_priority_lunda_post_settlement_action_desc: "Cross-border citizenship, corridor management, mining revenue, and Luba-Lunda arbitration sustain the country."
africa_priority_lunda_post_settlement_action_tt: "Supports mobile corridor administration and extends negotiated reach."
africa_priority_great_zimbabwe_post_settlement_action: "Fund Great Zimbabwe Land, Heritage, and Processing"
africa_priority_great_zimbabwe_post_settlement_action_desc: "Land reform, heritage governance, public processing, transport development, and restoration arbitration preserve a long campaign."
africa_priority_great_zimbabwe_post_settlement_action_tt: "Activates public processing, supports rail logistics, improves stability, and strengthens restoration legitimacy."
africa_priority_merina_post_settlement_action: "Connect Merina Roads, Ports, and Regional Councils"
africa_priority_merina_post_settlement_action_desc: "Asymmetric island federalism, port investment, road building, and regional confidence remain central after settlement."
africa_priority_merina_post_settlement_action_tt: "Supports island shipping and rail logistics while strengthening regional equality."
africa_priority_zulu_post_settlement_action: "Guarantee Zulu Land, Labour, and Reconstruction"
africa_priority_zulu_post_settlement_action_desc: "Land guarantees, labour protection, constitutional succession, regional arbitration, and South African reconstruction sustain the country."
africa_priority_zulu_post_settlement_action_tt: "Supports territorial logistics, improves stability, and strengthens common defence."
africa_priority_member.1200.t: "Who Governs [ROOT.GetName]?"
africa_priority_member.1200.asante.d: "Asante must decide how the Golden Stool, local councils, civic delegates, and producer boards will share authority. The settlement will shape succession, revenue, and the limits of royal government."
africa_priority_member.1200.oyo.d: "Oyo must settle the place of the Alaafin, Ife, city governments, market delegates, and producer organisations. The result will determine whether authority rests with a royal council, a civic federation, or an urban producer compact."
africa_priority_member.1200.sokoto.d: "Sokoto must decide how the emirates, scholars, reformers, pastoral communities, and civic delegates will govern together. The settlement can preserve a consultative emirate, build a federal chamber, or empower a pastoral producer compact."
africa_priority_member.1200.kanem_bornu.d: "Kanem-Bornu must balance a claimant court, civic administrators, Lake Chad communities, pastoral delegates, and market towns. Government can rest with a covenant council, a lake commission, or a pastoral water compact."
africa_priority_member.1200.manden.d: "Manden must choose how restoration authorities, civic delegates, producer organisations, scholars, and corridor partners share power. The settlement can centre a restoration assembly, a river federation, or an inland producer assembly."
africa_priority_member.1200.kongo.d: "Kongo must balance a verified court, church and civic institutions, provincial delegates, river communities, and producer organisations. The settlement can support a court-civic congress, a cross-border commonwealth, or a river community union."
africa_priority_member.1200.buganda.d: "Buganda must decide how the Kabaka, Lukiiko, civic delegates, land reformers, and other Ugandan interests share authority. Government can rest on a crown compact, a federal balance, or a cotton and land reform coalition."
africa_priority_member.1200.aksum.d: "Aksum must balance a claimant or heritage council, religious and civic representation, highland communities, and development bodies. The settlement can favour a heritage council, a federal commonwealth, or a civic development compact."
africa_priority_member.1200.harar.d: "Harar must balance municipal institutions, a constitutional court, merchants, hinterland councils, endowments, and producer groups. Government can become a municipal court compact, a mercantile city government, or a hinterland market coalition."
africa_priority_member.1200.kilwa.d: "Kilwa must balance a sultan or civic council, coastal cities, island delegates, merchants, labour organisations, and inland partners. The settlement can favour a coastal council, a maritime federation, or a people's maritime union."
africa_priority_member.1200.nubia.d: "Nubia must balance community councils, dual Egyptian and Sudanese recognition, civic administrators, river workers, and heritage custodians. Government can rest on a recognition council, an autonomous river federation, or a workers' river union."
africa_priority_member.1200.luba.d: "Luba must balance a claimant or civic government, local councils, mining communities, producer organisations, and memory institutions. The settlement can favour a civic council, a mining federation, or a public processing union."
africa_priority_member.1200.lunda.d: "Lunda must balance a claimant or civic court, cross-border communities, corridor delegates, mining interests, and producer organisations. Government can rest on a cross-border council, a corridor confederation, or a resource union."
africa_priority_member.1200.great_zimbabwe.d: "Great Zimbabwe must balance heritage custodians, rural communities, urban organisers, land reformers, mine workers, and a claimant or civic council. Government can favour a restoration council, a Zimbabwe federation, or an agrarian mining union."
africa_priority_member.1200.merina.d: "Merina must balance the crown, an assembly, coastal and regional councils, land and labour reformers, and producer organisations. Government can favour a crown assembly, a Malagasy federation, or a people's island union."
africa_priority_member.1200.zulu.d: "Zulu must balance the crown, an assembly, rural landholders, migrant workers, urban organisations, and territorial forces. Government can favour a crown assembly, a South African federal state, or a land and labour union."
africa_priority_member.1200.a: "Entrust the council settlement"
africa_priority_member.1200.a.tt: "Strengthens non-aligned support, recognises the country's named council or crown institution, and supports restoration legitimacy."
africa_priority_member.1200.b: "Ratify a civic federal settlement"
africa_priority_member.1200.b.tt: "Strengthens democratic support, recognises the country's civic or federal institutions, and supports representative balance."
africa_priority_member.1200.c: "Empower producers and workers"
africa_priority_member.1200.c.tt: "Strengthens communist support, recognises the country's producer or worker institutions, and supports public consent."
africa_priority_member.1210.t: "The Place of [ROOT.GetName] in the Charter"
africa_priority_member.1210.asante.d: "Asante can serve as a protected cultural member, an autonomous federal state, a sovereign Charter member, or a West African rival. Any agreement must protect the stool and local councils from direct annexation or outside manipulation."
africa_priority_member.1210.oyo.d: "Oyo can become a strong Charter member, a Nigerian federal state, a Yoruba-centred bloc leader, or a regional rival. It will not accept a Nigerian settlement that ignores city representation and a secure port corridor."
africa_priority_member.1210.sokoto.d: "Sokoto can anchor the Council of Crowns, enter a federal settlement, remain a sovereign member, or organise a Sahel rival bloc. A Charter cannot abolish every local institution or impose coercive central rule."
africa_priority_member.1210.kanem_bornu.d: "Kanem-Bornu can mediate the Sahel, anchor a confederation, join the Council of Crowns, or lead a military corridor rival. It will resist any host that monopolises water or caravan access."
africa_priority_member.1210.manden.d: "Manden can become a West African federal member, a cultural commonwealth, a regional congress host, or an inland rival. It can reject coastal fiscal dominance without claiming every imperial memory as territory."
africa_priority_member.1210.kongo.d: "Kongo can be a major basin member, a federal state, a cultural commonwealth, or a Congo-basin rival. It will oppose hosts that use restoration as a pretext to annex communities in Congo or Angola."
africa_priority_member.1210.buganda.d: "Buganda can anchor the Council of Crowns, become a Ugandan federal state, remain sovereign, or organise a royal rival bloc. It rejects structures that preserve privilege without shared benefit and structures that abolish autonomy."
africa_priority_member.1210.aksum.d: "Aksum can join the Council of Crowns, become a federal highland state, remain a protected cultural polity, or oppose Ethiopian or Eritrean centralisation. Heritage recognition never grants automatic political control."
africa_priority_member.1210.harar.d: "Harar can remain a protected city-state, become a specialist mediator, join as a Horn associate, or enter a corridor federation. It may declare neutrality or oppose any host that monopolises railway and market access."
africa_priority_member.1210.kilwa.d: "Kilwa can lead an Indian Ocean association, join a confederation, become a maritime federal state, or lead a coastal rival. No host may dictate customs while denying ports equal representation."
africa_priority_member.1210.nubia.d: "Nubia can become a bridge member, a Nile arbitration centre, an autonomous river federation, or a rival Nile bloc. It will resist domination by either Egypt or Sudan."
africa_priority_member.1210.luba.d: "Luba can join the Central Council, become a federal state, lead a mining compact, or emerge as a regional rival. It will reject host capture of mining revenue and an imposed Luba-Lunda union."
africa_priority_member.1210.lunda.d: "Lunda can bridge the Central and Southern Councils, join a confederation, enter a royal compact, or lead a resource rival. It can reject imposed federation and outside capture of corridor revenue."
africa_priority_member.1210.great_zimbabwe.d: "Great Zimbabwe can join the Southern Council, lead a Zimbabwe federation, remain a cultural restoration, or become an anti-settler rival. It rejects settler-led continental authority and unsafe territorial maximalism."
africa_priority_member.1210.merina.d: "Merina can join the Council of Crowns, become a Malagasy federal component, lead the Islands Council, or remain a sovereign rival. It rejects mainland neglect and forced island annexation."
africa_priority_member.1210.zulu.d: "Zulu can join the Council of Crowns, become a federal South African state, lead a southern rival, or serve as a civil-war coalition partner. It opposes settler-dominated leadership."
africa_priority_member.1210.a: "Sign the next lawful stage"
africa_priority_member.1210.a.tt: "Records the country's preferred clause and advances the relationship by one legal stage. An outside country becomes Protected before later accession."
africa_priority_member.1210.b: "Return an autonomy counterproposal"
africa_priority_member.1210.b.tt: "Records an autonomy clause and the country's preferred guarantee, then advances by at most one legal stage."
africa_priority_member.1210.c: "Refuse the offer"
africa_priority_member.1210.c.tt: "Transfers no territory. The country stays outside or moves toward Resistant status while retaining its institutions."
africa_priority_member.1210.d: "Open formal departure terms"
africa_priority_member.1210.d.tt: "Opens renewal, a timed peaceful withdrawal, and a rival bloc course."
africa_priority_member.1220.t: "The Boundaries of Consent"
africa_priority_member.1220.asante.d: "A compact Kumasi-centred Asante state can be recognised without treating every Akan or Gold Coast claim as settled. A congress, local consent, an autonomy statute, or an open rival compact can define the remaining relationship."
africa_priority_member.1220.oyo.d: "The Oyo core does not decide the status of Ife, Dahomey, Edo, coastal cities, or former tributary routes. Congress, local consent, autonomy, or rivalry must settle each modern relationship."
africa_priority_member.1220.sokoto.d: "A compact Sokoto base cannot settle every emirate, pastoral route, or Nigerian federal question by proclamation. Congress, local consent, autonomy, or rivalry will define the modern compact."
africa_priority_member.1220.kanem_bornu.d: "Kanem, Bornu, Baguirmi, Chad, Niger, Nigeria, and Cameroon share routes and communities without sharing one automatic border. Congress, consent, autonomy, or a rival lake compact must define political status."
africa_priority_member.1220.manden.d: "Mali, Kaabu, Songhai, neighbouring states, and Atlantic corridors remain separate political questions. Congress, local consent, autonomy, or rivalry will define the compact Manden settlement."
africa_priority_member.1220.kongo.d: "A researched Kongo heartland can coexist with cultural links beyond its border. Congress, local consent, autonomy, or rivalry must decide whether each cross-border community joins politically, associates culturally, or remains outside."
africa_priority_member.1220.buganda.d: "A compact Buganda kingdom does not automatically govern all Uganda or settle Bunyoro claims and lost county questions. Congress, consent, autonomy, or rivalry must define the wider relationship."
africa_priority_member.1220.aksum.d: "Ancient links, modern Ethiopian and Eritrean politics, Red Sea access, and local highland consent are separate questions. Congress, consent, autonomy, or rivalry must settle them without a maximal restoration."
africa_priority_member.1220.harar.d: "Harar's compact city and immediate district do not decide plateau, railway, caravan, or Gulf claims. Congress, local consent, autonomy, or rivalry must define each corridor."
africa_priority_member.1220.kilwa.d: "Kilwa's compact coast does not automatically absorb other Swahili cities or islands. Congress, local consent, autonomy, or rivalry must settle tariffs, patrols, courts, and representation."
africa_priority_member.1220.nubia.d: "Northern Sudan, southern Egypt, water rights, displaced communities, and Kushite, Makurian, and Alodian memories cannot be collapsed into one claim. Congress, consent, autonomy, or rivalry must settle political status."
africa_priority_member.1220.luba.d: "Luba, Lunda, Kazembe, Katanga, and Copperbelt communities can hold several cultural ties while choosing one political status. Congress, consent, autonomy, or rivalry must record that choice."
africa_priority_member.1220.lunda.d: "Lunda, Luba, Kazembe, Angola, Zambia, and Congo share communities and routes without sharing one automatic political border. Congress, consent, autonomy, or rivalry must settle access and status."
africa_priority_member.1220.great_zimbabwe.d: "A compact Shona-majority or monument-centred base does not decide Mutapa, Rozwi, land, mining, or neighbouring treaty questions. Congress, consent, autonomy, or rivalry must build the mandate."
africa_priority_member.1220.merina.d: "A central highland Merina base cannot claim island-wide authority without coastal and regional consent. Congress, local consent, autonomy, or rivalry must define the Malagasy settlement."
africa_priority_member.1220.zulu.d: "A compact Zululand core does not settle Natal, Swazi, Ndebele, or wider South African questions. Congress, consent, autonomy, or rivalry must define land, labour, access, and representation."
africa_priority_member.1220.a: "Accept the regional congress line"
africa_priority_member.1220.a.tt: "Settles the overlap through a regional congress and records representation without automatic annexation."
africa_priority_member.1220.b: "Require recorded local consent"
africa_priority_member.1220.b.tt: "Separates cultural ties from political status and records local consent for any later integration step."
africa_priority_member.1220.c: "Guarantee autonomy across the overlap"
africa_priority_member.1220.c.tt: "Preserves federal autonomy and representation while leaving later status changes to the Charter relationship rules."
africa_priority_member.1220.d: "Organise a rival settlement"
africa_priority_member.1220.d.tt: "Rejects the common settlement and moves the country through Resistant status toward a Rival Bloc."
africa_priority_member.1230.t: "Renewal, Withdrawal, or Rivalry"
africa_priority_member.1230.asante.d: "Asante will not accept direct annexation, court interference, or manipulation of neighbouring restorations. Renewal, a timed peaceful withdrawal, and a West African rival course all preserve the country and its institutions."
africa_priority_member.1230.oyo.d: "Oyo can renew a negotiated Charter, withdraw under agreed corridor terms, or organise a city-based rival compact. No option transfers neighbouring cities by assumption."
africa_priority_member.1230.sokoto.d: "Sokoto can renew reformed membership, complete a lawful withdrawal, or organise an emirate bloc against coercive centralism. The departure process preserves courts, schools, routes, and public obligations."
africa_priority_member.1230.kanem_bornu.d: "Kanem-Bornu can renew a lake covenant, leave peacefully under water and corridor guarantees, or lead a separate Lake Chad compact. Fisheries, wells, and markets remain governed after departure."
africa_priority_member.1230.manden.d: "Manden can renew membership, leave with negotiated river and road access, or form an inland federation outside the Charter. Cultural institutions and corridor bargaining continue in every outcome."
africa_priority_member.1230.kongo.d: "Kongo can renew a consent-based Charter, withdraw with river and port guarantees, or lead a basin rival. Community rights survive the end of membership and never force a territorial transfer."
africa_priority_member.1230.buganda.d: "Buganda can renew a balanced Charter, withdraw under agreed land and revenue terms, or form a royal rival bloc. Lake projects and constitutional succession continue outside membership."
africa_priority_member.1230.aksum.d: "Aksum can renew a cultural or federal Charter, withdraw while preserving heritage and port treaties, or resist centralisation as a rival. Living communities retain the final word over political status."
africa_priority_member.1230.harar.d: "Harar can renew an associate Charter, withdraw with diversified access guarantees, or align against a monopolising host. Water, food, rail, caravan, and market agreements remain active questions."
africa_priority_member.1230.kilwa.d: "Kilwa can renew a maritime Charter, withdraw with customs and port treaties, or form a rival city league. Its ports and islands continue to negotiate after departure."
africa_priority_member.1230.nubia.d: "Nubia can renew a river Charter, withdraw with water and transit guarantees, or organise a rival Nile compact. Irrigation, transport, and heritage duties continue under every result."
africa_priority_member.1230.luba.d: "Luba can renew a revenue-sharing Charter, withdraw with labour and rail guarantees, or lead a mining rival. Public processing and overlap arbitration continue beyond membership."
africa_priority_member.1230.lunda.d: "Lunda can renew a corridor Charter, withdraw under citizenship and rail guarantees, or form a separate corridor bloc. Mining and cross-border administration continue afterward."
africa_priority_member.1230.great_zimbabwe.d: "Great Zimbabwe can renew a bounded Charter, withdraw with land and heritage guarantees, or oppose settler-led leadership as a rival. Processing and transport remain playable afterward."
africa_priority_member.1230.merina.d: "Merina can renew an asymmetric Charter, withdraw with port and regional guarantees, or lead a sovereign island rival. Coastal regions retain a lawful answer to coercive highland rule."
africa_priority_member.1230.zulu.d: "Zulu can renew a lawful Charter, withdraw under land and labour guarantees, or build a southern royal and territorial bloc. Succession and reconstruction continue in every outcome."
africa_priority_member.1230.a: "Renew the negotiated relationship"
africa_priority_member.1230.a.tt: "Ends withdrawal pressure and advances the relationship by at most one legal stage."
africa_priority_member.1230.b: "Begin a peaceful withdrawal"
africa_priority_member.1230.b.tt: "Starts a timed withdrawal for units, bases, debts, borders, access, and public obligations. The country remains playable after exit."
africa_priority_member.1230.c: "Lead a rival bloc"
africa_priority_member.1230.c.tt: "Moves through the explicit resistance path into Rival Bloc status and preserves the country's post-settlement programme."
