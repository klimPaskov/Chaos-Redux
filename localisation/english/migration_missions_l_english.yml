migration_mission_protect_evacuation_transport_failure: "The evacuation route became unsafe before the transport protection window ended."
migration_mission_protect_evacuation_transport_tt: "Keep the named cohort's route safe until its protected transport window ends."
migration_mission_prepare_safe_return_route: "Prepare a Safe Return Route"
migration_mission_prepare_safe_return_route_desc: "A displaced community has begun returning voluntarily. Keep its route and food access safe while the returned families settle."
migration_mission_prepare_safe_return_route_success: "The return route and returned settlement remained safe through the observation window."
migration_mission_prepare_safe_return_route_failure: "The return route or origin became unsafe before the observation window ended."
migration_mission_prepare_safe_return_route_tt: "Keep the named return route, food access, and settlement conditions safe until the return window ends."
migration_mission_reception_observation_pending: "Medical observation in progress"
migration_mission_reception_observation_breach: "Medical observation failed: the reception subject was overloaded or infected."
