independence_wave_tat_convene_the_provisional_assembly: "Convene the Provisional Assembly"
independence_wave_tat_convene_the_provisional_assembly_desc: "Bring town officials, village delegates, and river communities into a civil authority able to govern Kazan and its depots. Organize the civilian workshops that will sustain the founding administration."
independence_wave_tat_secure_river_communities: "Guarantee River Communities"
independence_wave_tat_secure_river_communities_desc: "Record representation for the valleys, towns, parishes, and recognized communities whose cooperation sustains the Civic Compact."
independence_wave_tat_unify_border_guards: "Unify the Border Guards"
independence_wave_tat_unify_border_guards_desc: "Bring local detachments under a common river-defense staff as Tatarstan secures its crossing points."
independence_wave_tat_reconcile_former_host_ledgers: "Reconcile the Former-Host Accounts"
independence_wave_tat_reconcile_former_host_ledgers_desc: "Reconcile Tatarstan's outstanding claims, property disputes, and border settlement with the former administration when it can negotiate. If war or its disappearance prevents talks, strengthen the Civic Compact while those claims remain unresolved."
independence_wave_tat_connect_volga_network: "Connect the Volga Network"
independence_wave_tat_connect_volga_network_desc: "With the founding settlement complete and the compact stable, connect Tatarstan's Volga corridor to the Independence Network and advance its League cooperation."

independence_wave_tat_host_ledgers_at_war_effect_tt: "Civic Concord and River Security improve. War leaves Tatarstan's bilateral claims and obligations unresolved."
independence_wave_tat_volga_network_ready_tt: "The founding settlement and compact crisis are resolved, both compact measures are stable, and Tatarstan belongs to the Independence Network with a League route available."
independence_wave_tat_volga_network_not_ready_tt: "Complete the founding settlement, resolve the Civic Compact crisis, stabilize both compact measures, join the Independence Network, and make the League route available."

