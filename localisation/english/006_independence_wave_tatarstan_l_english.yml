tat_fragmented_river_mandate: "Fragmented River Mandate"
tat_fragmented_river_mandate_desc: "Village councils, railway officials, religious communities, and border guards recognize the provisional state without yet accepting a common settlement."
tat_tatarstan_host_compact: "Tatarstan Civic Compact"
tat_tatarstan_host_compact_desc: "Written community guarantees and a common river defense bind Tatarstan's towns, villages, and river crossings to one civil authority."
tat_rada_charter: "Assembly Charter"
tat_rada_charter_desc: "An elected assembly protects Tatarstan self-government while keeping the civil service and river communities represented."
tat_guard_soviets: "River Workers' Councils"
tat_guard_soviets_desc: "Railway workers, forestry crews, and town committees coordinate production and transport through a common workers' council."
tat_stanitsa_land_compact: "Village Land Compact"
tat_stanitsa_land_compact_desc: "Village delegates, cooperatives, and community elders share responsibility for food, recruitment, and local administration."
tat_river_emergency_command: "River Emergency Command"
tat_river_emergency_command_desc: "A unified territorial staff directs the border guards and river reserves while civil councils preserve local supply and relief."

independence_wave_tat_river_compact_category: "Tatarstan Civic Compact"
independence_wave_tat_river_compact_category_desc: "Tatarstan's assembly must keep civic concord while the river stays secure. Raise both values to [?constant:independence_wave_tatarstan_pressure.stable|0] to stabilize the compact.\n\nCivic Concord: §Y[?independence_wave_tat_rada_cohesion|0]§!  River Security: §Y[?independence_wave_tat_river_readiness|0]§!"
independence_wave_tat_hold_river_compact_together: "Hold Tatarstan Compact Together"
independence_wave_tat_hold_river_compact_together_desc: "Within [?constant:independence_wave_tatarstan_duration.founding_crisis|0] days, install a government, raise both compact values to [?constant:independence_wave_tatarstan_pressure.stable|0], and secure ownership and control of $STATE_249$."
independence_wave_tat_secure_river_depots: "Secure the River Depots"
independence_wave_tat_secure_river_depots_desc: "Commission the river stores, road registers, railway depots, and civilian works while the Civic Compact is forming. The project needs an existing civilian factory and administrative resources."
independence_wave_tat_integrate_border_guards: "Integrate the Border Guards"
independence_wave_tat_integrate_border_guards_desc: "Unify the local detachments under a river defense staff while preserving the community guarantees that sustain them."
independence_wave_tat_register_community_compacts: "Register the Community Compacts"
independence_wave_tat_register_community_compacts_desc: "Record the rights, obligations, and representation of every valley, town, village, and recognized community."
independence_wave_tat_settle_former_host_ledgers: "Settle the Former Host Accounts"
independence_wave_tat_settle_former_host_ledgers_desc: "Settle Tatarstan's claims, property disputes, and border obligations with the former administration while peaceful talks remain possible. If war or the host's disappearance prevents a bilateral settlement, strengthen the Civic Compact without changing those claims."
independence_wave_tat_ratify_constitutional_autonomy: "Ratify Constitutional Autonomy"
independence_wave_tat_ratify_constitutional_autonomy_desc: "Give the provisional assembly a binding charter of self-government and explicit protections for the river communities."
independence_wave_tat_adopt_agrarian_compact: "Adopt the Agrarian Compact"
independence_wave_tat_adopt_agrarian_compact_desc: "Entrust village delegates, cooperatives, and community elders with food, recruitment, and local administration."
independence_wave_tat_convene_socialist_councils: "Convene the Socialist Councils"
independence_wave_tat_convene_socialist_councils_desc: "Place the railway, forestry districts, workshops, and municipal services under a common workers' council."
independence_wave_tat_establish_river_emergency_command: "Establish River Emergency Command"
independence_wave_tat_establish_river_emergency_command_desc: "Put the border guards under one emergency staff and secure the passes before neighboring armies test the compact."
independence_wave_tat_codify_durable_sovereignty: "Codify Durable Sovereignty"
independence_wave_tat_codify_durable_sovereignty_desc: "A resolved founding crisis, a stable compact, and a functioning government can turn liberation into a durable Tatarstan state."
independence_wave_tat_open_volga_river_network_corridor: "Open Volga River Network Corridor"
independence_wave_tat_open_volga_river_network_corridor_desc: "After the founding settlement, exchange supplies, officers, and diplomatic access with the other states that survived the wave."

independence_wave_tat_project_failure_effect_tt: "Civic Concord §R[?constant:independence_wave_tatarstan_pressure.standard_loss|0]§!, River Security §R[?constant:independence_wave_tatarstan_pressure.standard_loss|0]§!. Legitimacy, Recognition, State Capacity, and Security fall. Instability rises."
independence_wave_tat_depots_effect_tt: "Civic Concord and River Security improve, while Legitimacy and State Capacity rise. Kazan's civilian industry expands to a reserve of [?constant:independence_wave_tatarstan_cost.founding_civilian_factory_target|0] factories when fewer are present."
independence_wave_tat_guards_effect_tt: "River Security improves sharply and the security administration gains Legitimacy and Security."
independence_wave_tat_communities_effect_tt: "Civic Concord improves, Recognition and State Capacity rise, and Instability falls."
independence_wave_tat_host_ledgers_effect_tt: "Civic Concord and River Security improve. Claims, hostility, property disputes, and host obligations fall while bilateral border settlement advances."
independence_wave_tat_host_loss_effect_tt: "With the former host gone, bilateral negotiations end. Civic Concord and River Security improve."
independence_wave_tat_constitutional_route_effect_tt: "The Tatarstan Civic Assembly takes office. Civic Concord and River Security improve, with gains to Legitimacy and State Capacity."
independence_wave_tat_agrarian_route_effect_tt: "The Tatarstan Village Compact takes office. Civic Concord and River Security improve, with gains to Legitimacy and Recognition."
independence_wave_tat_socialist_route_effect_tt: "The Tatarstan Workers' Council takes office. River Security improves sharply while the railway and municipal economy are reorganized."
independence_wave_tat_emergency_route_effect_tt: "The River Defense Directorate takes office. River Security rises sharply while Civic Concord falls under emergency rule."
independence_wave_tat_sovereignty_effect_tt: "Legitimacy, Recognition, and State Capacity rise, and the compact gains Security."
independence_wave_tat_network_effect_tt: "Civic Concord and River Security improve. Network Standing, League Cohesion, Common Cause, Shared Reserve, and Member Confidence rise."

