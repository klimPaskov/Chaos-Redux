# Clean city rats
black_plague_clean_city_rats: "Clear City Rats"
black_plague_clean_city_rats_desc: "Send municipal crews through the selected urban state to trap colonies, clear refuse, and strip nesting sites. Sealed food stores, flea control, and purged transport hubs turn the sweep into a supported clearance. Frightened colonies can scatter into a neighboring state when those measures are absent. Each repeated sweep must reach deeper warrens and costs more, up to twice the first operation."
black_plague_clean_city_rats_cost: "£support_equipment_text_icon §Y[?FROM.black_plague_quote_clean_rats_support|0]§! £GFX_fuel_texticon §Y[?FROM.black_plague_quote_clean_rats_fuel|0]§! £civ_factory §Y[GetBlackPlagueRatsFactoriesQuote]§!"
black_plague_clean_city_rats_cost_blocked: "£support_equipment_text_icon §R[?FROM.black_plague_quote_clean_rats_support|0]§! £GFX_fuel_texticon §R[?FROM.black_plague_quote_clean_rats_fuel|0]§! £civ_factory §R[GetBlackPlagueRatsFactoriesQuote]§!"
black_plague_clean_city_rats_cost_tooltip: "Requires [?FROM.black_plague_quote_clean_rats_manpower|0] available personnel, [?FROM.black_plague_quote_clean_rats_motorized|0] trucks, and [?FROM.black_plague_quote_clean_rats_medical_reserve|0] Medical Reserve on hand. These are not spent. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueRatsBurdenQuote] Response Capacity and the displayed factories for [GetBlackPlagueRatsDaysQuote] days. Payments are not refunded if work stops."
black_plague_clean_city_rats_start_tt: "The rat-clearance sweep begins in the selected state."
black_plague_clean_city_rats_complete_tt: "Reduces Rat Infestation. Supported sweeps also reduce plague load, spread, and mortality, raise containment, and avoid cross-border exposure. Unsupported sweeps have weaker effects and may spread exposure."

# Seal food stores
black_plague_seal_food_stores: "Seal Food Stores"
black_plague_seal_food_stores_desc: "Harden granaries, warehouses, ration depots, and market cellars in the selected state. The work suppresses rat access and lowers future exposure, but guarded storage reduces local resource and supply throughput while it remains active."
black_plague_seal_food_stores_cost: "£support_equipment_text_icon §Y[?FROM.black_plague_quote_seal_stores_support|0]§! £GFX_fuel_texticon §Y[?FROM.black_plague_quote_seal_stores_fuel|0]§! £civ_factory §Y[GetBlackPlagueSealFactoriesQuote]§!"
black_plague_seal_food_stores_cost_blocked: "£support_equipment_text_icon §R[?FROM.black_plague_quote_seal_stores_support|0]§! £GFX_fuel_texticon §R[?FROM.black_plague_quote_seal_stores_fuel|0]§! £civ_factory §R[GetBlackPlagueSealFactoriesQuote]§!"
black_plague_seal_food_stores_cost_tooltip: "Requires [?FROM.black_plague_quote_seal_stores_manpower|0] available personnel and [?FROM.black_plague_quote_seal_stores_motorized|0] trucks on hand; they are not spent. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueSealBurdenQuote] Response Capacity and the displayed factories for [GetBlackPlagueSealDaysQuote] days."
black_plague_seal_food_stores_start_tt: "Storehouses and ration depots are placed under guarded sealing orders."
black_plague_seal_food_stores_complete_tt: "Reduces infestation, spread pressure, incoming exposure, and relapse risk, then sustains weekly vermin suppression for [GetBlackPlagueSealSustainDaysQuote] days."

# Sewers and burrows
black_plague_clear_sewers_and_burrows: "Clear Sewers and Burrows"
black_plague_clear_sewers_and_burrows_desc: "Open the selected state's drains, tunnels, culverts, and buried service corridors. Engineers will destroy deep nests at the cost of infrastructure damage. Entrenched infestations cannot be fully cleared without an army cordon."
black_plague_clear_sewers_and_burrows_cost: "£support_equipment_text_icon §Y[?FROM.black_plague_quote_clear_sewers_support|0]§! £GFX_fuel_texticon §Y[?FROM.black_plague_quote_clear_sewers_fuel|0]§! £civ_factory §Y[GetBlackPlagueSewersFactoriesQuote]§!"
black_plague_clear_sewers_and_burrows_cost_blocked: "£support_equipment_text_icon §R[?FROM.black_plague_quote_clear_sewers_support|0]§! £GFX_fuel_texticon §R[?FROM.black_plague_quote_clear_sewers_fuel|0]§! £civ_factory §R[GetBlackPlagueSewersFactoriesQuote]§!"
black_plague_clear_sewers_and_burrows_cost_tooltip: "Requires [?FROM.black_plague_quote_clear_sewers_manpower|0] available personnel and [?FROM.black_plague_quote_clear_sewers_motorized|0] trucks on hand; they are not spent. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueSewersBurdenQuote] Response Capacity and the displayed factories for [GetBlackPlagueSewersDaysQuote] days."
black_plague_clear_sewers_and_burrows_start_tt: "Engineering crews enter the sewer and burrow network."
black_plague_clear_sewers_and_burrows_complete_tt: "Damages infrastructure and reduces infestation, plague load, spread, and relapse pressure. A deeply entrenched colony without a cordon yields only a partial clearance and raises relapse risk."

# Flea control
black_plague_flea_shelter_bedding_control: "Treat Flea Infestations"
black_plague_flea_shelter_bedding_control_desc: "Treat barracks, shelters, hospitals, bedding stores, and crowded housing in the selected state. The campaign attacks the vector around patients and refugees instead of promising an immediate cure."
black_plague_flea_shelter_bedding_control_cost: "£support_equipment_text_icon §Y[?FROM.black_plague_quote_flea_control_support|0]§! £GFX_black_plague_medical_reserve_texticon §Y[?FROM.black_plague_quote_flea_control_medical_reserve|0]§! £civ_factory §Y[GetBlackPlagueFleaFactoriesQuote]§!"
black_plague_flea_shelter_bedding_control_cost_blocked: "£support_equipment_text_icon §R[?FROM.black_plague_quote_flea_control_support|0]§! £GFX_black_plague_medical_reserve_texticon §R[?FROM.black_plague_quote_flea_control_medical_reserve|0]§! £civ_factory §R[GetBlackPlagueFleaFactoriesQuote]§!"
black_plague_flea_shelter_bedding_control_cost_tooltip: "Requires [?FROM.black_plague_quote_flea_control_manpower|0] available personnel, [?FROM.black_plague_quote_flea_control_motorized|0] trucks, and [?FROM.black_plague_quote_flea_control_fuel|0] fuel on hand. These are not spent. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueFleaBurdenQuote] Response Capacity and the displayed factories for [GetBlackPlagueFleaDaysQuote] days. Payments are not refunded if work stops."
black_plague_flea_shelter_bedding_control_start_tt: "Vector-control teams begin work in shelters, wards, and barracks."
black_plague_flea_shelter_bedding_control_complete_tt: "Reduces mortality pressure, plague load, infestation, and relapse risk while raising treatment coverage. The local program continues for [GetBlackPlagueFleaSustainDaysQuote] days."

# Transport purge
black_plague_purge_rail_yards_and_docks: "Purge Transport Depots"
black_plague_purge_rail_yards_and_docks_desc: "Stop and strip cargo in the selected transport state, clear warehouses, fumigate rolling stock, and inspect dockside storage. The purge sharply reduces transport and port transmission while constraining supply and movement."
black_plague_purge_rail_yards_and_docks_cost: "£GFX_train_texticon §Y[?FROM.black_plague_quote_transport_purge_trains|0]§! £GFX_fuel_texticon §Y[?FROM.black_plague_quote_transport_purge_fuel|0]§! £civ_factory §Y[GetBlackPlagueTransportFactoriesQuote]§!"
black_plague_purge_rail_yards_and_docks_cost_blocked: "£GFX_train_texticon §R[?FROM.black_plague_quote_transport_purge_trains|0]§! £GFX_fuel_texticon §R[?FROM.black_plague_quote_transport_purge_fuel|0]§! £civ_factory §R[GetBlackPlagueTransportFactoriesQuote]§!"
black_plague_purge_rail_yards_and_docks_cost_tooltip: "Requires [?FROM.black_plague_quote_transport_purge_manpower|0] available personnel, [?FROM.black_plague_quote_transport_purge_support|0] support equipment, and [?FROM.black_plague_quote_transport_purge_motorized|0] trucks on hand. Coastal targets also require [?FROM.black_plague_quote_transport_purge_convoys|0] convoys. These are not spent. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueTransportBurdenQuote] Response Capacity and the displayed factories for [GetBlackPlagueTransportDaysQuote] days. Payments are not refunded if work stops."
black_plague_purge_rail_yards_and_docks_start_tt: "Rail and port traffic is halted for a systematic purge."
black_plague_purge_rail_yards_and_docks_complete_tt: "Reduces infestation, spread, exposure, and relapse risk. For [GetBlackPlagueTransportSustainDaysQuote] days, internal transport and port transmission are sharply suppressed."

# Demolition
black_plague_demolish_infested_blocks: "Demolish Lost Blocks"
black_plague_demolish_infested_blocks_desc: "Destroy districts that cannot be reclaimed by ordinary clearance. This irreversible operation requires quarantine, an army cordon, prior cleanup attempts, and a screened neighboring state for displaced civilians. If screening or the cordon fails before completion, the operation still ends in destruction but disperses infection."
black_plague_demolish_infested_blocks_cost: "£support_equipment_text_icon §Y[?FROM.black_plague_quote_demolition_support|0]§! £stability_texticon §Y[GetBlackPlagueDemolitionStabilityQuote]§! £civ_factory §Y[GetBlackPlagueDemolitionFactoriesQuote]§!"
black_plague_demolish_infested_blocks_cost_blocked: "£support_equipment_text_icon §R[?FROM.black_plague_quote_demolition_support|0]§! £stability_texticon §R[GetBlackPlagueDemolitionStabilityQuote]§! £civ_factory §R[GetBlackPlagueDemolitionFactoriesQuote]§!"
black_plague_demolish_infested_blocks_cost_tooltip: "Requires [?FROM.black_plague_quote_demolition_manpower|0] available personnel, [?FROM.black_plague_quote_demolition_motorized|0] trucks, [?FROM.black_plague_quote_demolition_trains|0] trains, and [?FROM.black_plague_quote_demolition_fuel|0] fuel on hand. These are not spent. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueDemolitionBurdenQuote] Response Capacity and the displayed factories for [GetBlackPlagueDemolitionDaysQuote] days. A completed demolition cannot be repeated this episode. Payments are not refunded if work stops."
black_plague_demolish_infested_blocks_start_tt: "Evacuation screening begins as demolition teams seal the lost blocks."
black_plague_demolish_infested_blocks_complete_tt: "Damages infrastructure and factories, raises resistance, lowers compliance, and displaces civilians. A preserved cordon and screened receiver sharply reduces infestation and disease pressure. Failure spreads exposure into the receiver."

# Hospitals
black_plague_emergency_hospitals: "Build Plague Hospitals"
black_plague_emergency_hospitals_desc: "Convert accessible facilities in the selected state into dedicated isolation wards and treatment stations. The hospitals commit factories and response capacity while operating and generate field findings for the national countermeasure program."
black_plague_emergency_hospitals_accelerated: "Rapid Plague Hospitals"
black_plague_emergency_hospitals_accelerated_desc: "Use emergency production to convert the selected state's facilities in [GetBlackPlagueAcceleratedHospitalDaysQuote] days. This accelerated route retains the standard hospital program's material, Medical Reserve, factory, and continuing response burden."
black_plague_emergency_hospitals_cost: "£support_equipment_text_icon §Y[?FROM.black_plague_quote_hospital_support|0]§! £GFX_black_plague_medical_reserve_texticon §Y[?FROM.black_plague_quote_hospital_medical_reserve|0]§! £civ_factory §Y[GetBlackPlagueHospitalFactoriesQuote]§!"
black_plague_emergency_hospitals_cost_blocked: "£support_equipment_text_icon §R[?FROM.black_plague_quote_hospital_support|0]§! £GFX_black_plague_medical_reserve_texticon §R[?FROM.black_plague_quote_hospital_medical_reserve|0]§! £civ_factory §R[GetBlackPlagueHospitalFactoriesQuote]§!"
black_plague_emergency_hospitals_cost_tooltip: "Requires [?FROM.black_plague_quote_hospital_manpower|0] available personnel, [?FROM.black_plague_quote_hospital_motorized|0] trucks, [?FROM.black_plague_quote_hospital_trains|0] trains, and [?FROM.black_plague_quote_hospital_fuel|0] fuel on hand. These are not spent. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueHospitalBurdenQuote] Response Capacity and the displayed factories for [GetBlackPlagueHospitalDaysQuote] days. Operating wards then use £civ_factory [GetBlackPlagueHospitalPersistentFactoriesQuote] factories and £GFX_black_plague_response_capacity_texticon [GetBlackPlagueHospitalPersistentBurdenQuote] Response Capacity. Payments are not refunded if work stops."
black_plague_emergency_hospitals_accelerated_cost: "£support_equipment_text_icon §Y[?FROM.black_plague_quote_hospital_support|0]§! £GFX_black_plague_medical_reserve_texticon §Y[?FROM.black_plague_quote_hospital_medical_reserve|0]§! £civ_factory §Y[GetBlackPlagueHospitalFactoriesQuote]§!"
black_plague_emergency_hospitals_accelerated_cost_blocked: "£support_equipment_text_icon §R[?FROM.black_plague_quote_hospital_support|0]§! £GFX_black_plague_medical_reserve_texticon §R[?FROM.black_plague_quote_hospital_medical_reserve|0]§! £civ_factory §R[GetBlackPlagueHospitalFactoriesQuote]§!"
black_plague_emergency_hospitals_accelerated_cost_tooltip: "Requires [?FROM.black_plague_quote_hospital_manpower|0] available personnel, [?FROM.black_plague_quote_hospital_motorized|0] trucks, [?FROM.black_plague_quote_hospital_trains|0] trains, and [?FROM.black_plague_quote_hospital_fuel|0] fuel on hand. These are not spent. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueHospitalBurdenQuote] Response Capacity and the displayed factories for [GetBlackPlagueHospitalFastDaysQuote] days. Operating wards then use £civ_factory [GetBlackPlagueHospitalPersistentFactoriesQuote] factories and £GFX_black_plague_response_capacity_texticon [GetBlackPlagueHospitalPersistentBurdenQuote] Response Capacity. Payments are not refunded if work stops."
black_plague_emergency_hospitals_start_tt: "Accessible buildings are requisitioned for plague wards."
black_plague_emergency_hospitals_accelerated_start_tt: "Emergency production compresses hospital construction to [GetBlackPlagueAcceleratedHospitalDaysQuote] days."
black_plague_emergency_hospitals_complete_tt: "Raises treatment and containment, lowers mortality and plague load, and adds the hospital's findings to countermeasure research. The hospital remains active until access is lost, the state collapses, or the local outbreak ends."

# Quarantine
black_plague_establish_quarantine: "Establish Quarantine"
black_plague_establish_quarantine_desc: "Isolate the selected state and close civilian routes. Supported quarantine limits exposure and spread. Collapsed access can deepen mortality. Contained states move to monitoring before Recovery."
black_plague_establish_quarantine_cost: "£GFX_fuel_texticon §Y[?FROM.black_plague_quote_quarantine_fuel|0]§! £command_power §Y[GetBlackPlagueQuarantineCommandQuote]§! £civ_factory §Y[GetBlackPlagueQuarantineFactoriesQuote]§!"
black_plague_establish_quarantine_cost_blocked: "£GFX_fuel_texticon §R[?FROM.black_plague_quote_quarantine_fuel|0]§! £command_power §R[GetBlackPlagueQuarantineCommandQuote]§! £civ_factory §R[GetBlackPlagueQuarantineFactoriesQuote]§!"
black_plague_establish_quarantine_cost_tooltip: "Requires [?FROM.black_plague_quote_quarantine_manpower|0] available personnel, [?FROM.black_plague_quote_quarantine_support|0] support equipment, and [?FROM.black_plague_quote_quarantine_motorized|0] trucks on hand. These are not spent. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueQuarantineBurdenQuote] Response Capacity and the displayed factories for [GetBlackPlagueQuarantineDaysQuote] days. The factories are then released, while quarantine uses the same capacity or £GFX_black_plague_response_capacity_texticon [GetBlackPlagueQuarantineMonitoringQuote] during monitoring. Payments are not refunded if work stops."
black_plague_establish_quarantine_start_tt: "Civilian movement is restricted around the selected state."
black_plague_establish_quarantine_complete_tt: "Raises containment and reduces spread, incoming exposure, and infestation. The quarantine remains active through the dangerous phases, shifts to monitoring under Containment, and ends in Recovery or Cured."

# Cordon
black_plague_raise_army_cordon: "Raise an Army Cordon"
black_plague_raise_army_cordon_desc: "Commit organized troops and military stores to checkpoints around the selected infected state. The cordon provides the strongest local spread control and supports difficult cleanup, but it consumes supply, movement capacity, and construction effort while maintained."
black_plague_raise_army_cordon_cost: "£infantry_equipment_text_icon §Y[?FROM.black_plague_quote_cordon_infantry|0]§! £command_power §Y[GetBlackPlagueCordonCommandQuote]§! £civ_factory §Y[GetBlackPlagueCordonFactoriesQuote]§!"
black_plague_raise_army_cordon_cost_blocked: "£infantry_equipment_text_icon §R[?FROM.black_plague_quote_cordon_infantry|0]§! £command_power §R[GetBlackPlagueCordonCommandQuote]§! £civ_factory §R[GetBlackPlagueCordonFactoriesQuote]§!"
black_plague_raise_army_cordon_cost_tooltip: "Requires [?FROM.black_plague_quote_cordon_manpower|0] available personnel, [?FROM.black_plague_quote_cordon_support|0] support equipment, [?FROM.black_plague_quote_cordon_motorized|0] trucks, [?FROM.black_plague_quote_cordon_fuel|0] fuel, and a qualifying division in the state. The stock and personnel are not spent. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueCordonBurdenQuote] Response Capacity and the displayed factories for [GetBlackPlagueCordonDaysQuote] days. Factories are then released, while the cordon keeps the same capacity. Payments are not refunded if work stops."
black_plague_raise_army_cordon_start_tt: "Troops begin closing roads, crossings, and freight approaches."
black_plague_raise_army_cordon_complete_tt: "Greatly raises containment and reduces spread, exposure, and infestation. The cordon persists until Recovery, Cured, loss of control, or loss of the containment force."

# Treatment reserves
black_plague_distribute_treatment_reserves: "Deliver Treatment Reserves"
black_plague_distribute_treatment_reserves_desc: "Move protected medical stores, transport, and staff into the selected state. The short operation expands treatment coverage and suppresses mortality without erasing the outbreak."
black_plague_distribute_treatment_reserves_cost: "£support_equipment_text_icon §Y[?FROM.black_plague_quote_treatment_support|0]§! £GFX_black_plague_medical_reserve_texticon §Y[?FROM.black_plague_quote_treatment_medical_reserve|0]§! £civ_factory §Y[GetBlackPlagueTreatmentFactoriesQuote]§!"
black_plague_distribute_treatment_reserves_cost_blocked: "£support_equipment_text_icon §R[?FROM.black_plague_quote_treatment_support|0]§! £GFX_black_plague_medical_reserve_texticon §R[?FROM.black_plague_quote_treatment_medical_reserve|0]§! £civ_factory §R[GetBlackPlagueTreatmentFactoriesQuote]§!"
black_plague_distribute_treatment_reserves_cost_tooltip: "Requires [?FROM.black_plague_quote_treatment_manpower|0] available personnel, [?FROM.black_plague_quote_treatment_motorized|0] trucks, and [?FROM.black_plague_quote_treatment_fuel|0] fuel on hand. These are not spent. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueTreatmentBurdenQuote] Response Capacity and the displayed factory for [GetBlackPlagueTreatmentDaysQuote] days. Payments are not refunded if work stops."
black_plague_distribute_treatment_reserves_start_tt: "Protected treatment convoys depart for the selected state."
black_plague_distribute_treatment_reserves_complete_tt: "Lowers mortality, plague load, and relapse risk while raising treatment coverage and containment. Relief remains active for [GetBlackPlagueTreatmentReliefDaysQuote] days."

# Liberated warrens
black_plague_purge_liberated_warrens: "Purge Liberated Warrens"
black_plague_purge_liberated_warrens_desc: "Return organized troops and engineers to a state once ruled by a brood. Buried chambers, food caches, and contaminated tunnels must be cleared before civil recovery can take hold."
black_plague_purge_liberated_warrens_cost: "£infantry_equipment_text_icon §Y[?FROM.black_plague_quote_warren_purge_infantry|0]§! £GFX_black_plague_medical_reserve_texticon §Y[?FROM.black_plague_quote_warren_purge_medical_reserve|0]§! £civ_factory §Y[GetBlackPlagueWarrenFactoriesQuote]§!"
black_plague_purge_liberated_warrens_cost_blocked: "£infantry_equipment_text_icon §R[?FROM.black_plague_quote_warren_purge_infantry|0]§! £GFX_black_plague_medical_reserve_texticon §R[?FROM.black_plague_quote_warren_purge_medical_reserve|0]§! £civ_factory §R[GetBlackPlagueWarrenFactoriesQuote]§!"
black_plague_purge_liberated_warrens_cost_tooltip: "Requires [?FROM.black_plague_quote_warren_purge_manpower|0] available personnel, [?FROM.black_plague_quote_warren_purge_support|0] support equipment, [?FROM.black_plague_quote_warren_purge_motorized|0] trucks, [?FROM.black_plague_quote_warren_purge_trains|0] trains, [?FROM.black_plague_quote_warren_purge_fuel|0] fuel, and a containment force in the state. The listed stock and personnel remain on hand. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueWarrenBurdenQuote] Response Capacity and the displayed factories for [GetBlackPlagueWarrenDaysQuote] days. Completed clearance then uses £GFX_black_plague_response_capacity_texticon [GetBlackPlagueWarrenSuppressionBurdenQuote] Response Capacity for [GetBlackPlagueHiddenNestDaysQuote] days of hidden-nest suppression. One completion is allowed per plague episode. Payments are not refunded if work stops."
black_plague_purge_liberated_warrens_start_tt: "Engineers and troops descend into the abandoned warren network."
black_plague_purge_liberated_warrens_complete_tt: "Severely reduces infestation, plague load, spread, exposure, and relapse risk while raising containment. It also contributes field findings and suppresses hidden nests for [GetBlackPlagueHiddenNestDaysQuote] days."

# Countermeasure program
black_plague_establish_countermeasure_program: "Establish Countermeasure Lab"
black_plague_establish_countermeasure_program_desc: "Concentrate patient histories, hospital samples, logistics reports, and clinical findings at a protected site in the selected state. Progress runs from 0 to 100 and improves survival, spread control, and cleanup without instantly removing disease."
black_plague_establish_countermeasure_program_cost: "£support_equipment_text_icon §Y[GetBlackPlagueCountermeasureSupportQuote]§! £GFX_black_plague_medical_reserve_texticon §Y[GetBlackPlagueCountermeasureReserveQuote]§! £civ_factory §Y[GetBlackPlagueCountermeasureFactoriesQuote]§!"
black_plague_establish_countermeasure_program_cost_blocked: "£support_equipment_text_icon §R[GetBlackPlagueCountermeasureSupportQuote]§! £GFX_black_plague_medical_reserve_texticon §R[GetBlackPlagueCountermeasureReserveQuote]§! £civ_factory §R[GetBlackPlagueCountermeasureFactoriesQuote]§!"
black_plague_establish_countermeasure_program_cost_tooltip: "Requires [GetBlackPlagueCountermeasureManpowerQuote] available personnel, [GetBlackPlagueCountermeasureTrucksQuote] trucks, [GetBlackPlagueCountermeasureTrainsQuote] trains, and [GetBlackPlagueCountermeasureFuelQuote] fuel on hand. These are not spent. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueCountermeasureBurdenQuote] Response Capacity and the displayed factories for [GetBlackPlagueCountermeasureDaysQuote] days. The programme then uses £civ_factory [GetBlackPlagueCountermeasurePersistentFactoriesQuote] factories and the same capacity until research ends. Payments are not refunded if work stops."
black_plague_establish_countermeasure_program_start_tt: "A protected countermeasure site is organized in the selected state."
black_plague_establish_countermeasure_program_complete_tt: "Activates the national 0–100 countermeasure program, grants initial progress, and incorporates any field findings already recorded."

