l_english:

# Dedicated Black Plague response category
black_plague_response_category: "Black Plague Emergency"
black_plague_response_category_desc: "Direct national research, medical logistics, knowledge policy, cooperation, and recovery here. Use the Disease Containment board for quarantine, treatment, rat clearance, and cleanup in a selected state."
black_plague_response_gui_title: "National Plague Response"
black_plague_response_gui_programme_status: "Cure programme: [GetBlackPlagueCountermeasureStatus]"
black_plague_response_gui_identity_tt: "Coordinates national research, medical logistics, knowledge policy, foreign cooperation, and recovery. Use the Disease Containment board for selected-state operations."
black_plague_response_gui_medical_reserve: "§GReserve§!  [?black_plague_medical_reserve|0] / [?black_plague_medical_reserve_capacity|0]"
black_plague_response_gui_medical_reserve_tt: "Medical Reserve supplies field hospitals, treatment teams, vector control, protected storage, and cleanup. Production raises it, while active operations consume it."
black_plague_response_gui_response_capacity: "§YResponse Capacity§!  [?black_plague_response_capacity_remaining|0] / [?black_plague_response_capacity|0]"
black_plague_response_gui_response_capacity_tt: "Response Capacity limits how many national and selected-state plague operations we can run at once. Each running operation holds one point, and the point returns when that operation completes or is cancelled."
black_plague_response_gui_capacity_unorganized: "§YResponse Capacity§!  Not organized"
black_plague_response_gui_capacity_unorganized_tt: "We have organized no response capacity yet, so no operation that needs it can be committed. Civilian industry, national territory, field hospital research, a working emergency hospital and cure progress all raise it, while low stability holds it down."
black_plague_response_gui_capacity_warning: "§RResponse capacity exhausted: no further operations can be committed.§!"
black_plague_response_gui_capacity_warning_tt: "Complete or cancel an active plague operation before starting another action that requires Response Capacity."
black_plague_response_gui_outbreak_ledger: "§RNational Deaths§!  [?black_plague_achievement_country_deaths_people|0]"
black_plague_response_gui_outbreak_ledger_tt: "National deaths count people already lost within our borders. World deaths: [?global.black_plague_deaths_total|0]. Threatened and exposed populations are not included."
black_plague_response_gui_international_status: "§CInternational response:§! [GetBlackPlagueInternationalResponseStatus]"
black_plague_response_gui_international_status_tt: "Tracks whether the national programme acts independently, exchanges restricted findings, or supports an international medical mission."
black_plague_countermeasure_status_complete: "§GComplete: cure-capable cleanup unlocked§!"
black_plague_countermeasure_status_researching: "§CActive research programme§!"
black_plague_countermeasure_status_mobilising: "§YLaboratories mobilising§!"
black_plague_countermeasure_status_findings_waiting: "§YField findings await a programme§!"
black_plague_countermeasure_status_not_started: "§RNot established§!"
black_plague_international_response_status_mission: "§GInternational medical mission active§!"
black_plague_international_response_status_exchange: "§CRestricted alliance exchange active§!"
black_plague_international_response_status_independent: "§YIndependent national response§!"

# Shared Black Plague response board
black_plague_response_capacity_label: "Response Capacity"
black_plague_response_capacity_value: "[?black_plague_response_capacity_remaining|0] / [?black_plague_response_capacity|0]"
black_plague_countermeasure_progress_label: "Countermeasure Progress"
black_plague_countermeasure_progress_value: "§G[?black_plague_countermeasure_progress|0]%§!"
black_plague_countermeasure_progress_tt: "Field observations, hospital reports, and controlled trials raise Countermeasure Progress. Higher progress reduces plague mortality and spread, improves treatment, and unlocks cure-capable local cleanup at completion. Progress does not remove an outbreak by itself."
black_plague_rat_infestation_label: "Rat Infestation"
black_plague_medical_reserve_label: "Medical Reserve"
black_plague_medical_reserve_value: "[?black_plague_medical_reserve|0] / [?black_plague_medical_reserve_capacity|0]"
black_plague_cleanup_attempts_label: "Completed Cleanup Operations"
black_plague_persistent_response_burden: "Sustained Plague Response"
black_plague_persistent_response_burden_desc: "Factories, transport, personnel, consumer goods, and local authority remain committed to active plague measures and protected Medical Reserve storage."
black_plague_sealed_food_stores: "Sealed Food Stores"
black_plague_sealed_food_stores_desc: "Granaries, warehouses, and ration depots are under guarded vermin-control procedures."
black_plague_transport_purge: "Purged Rail Yards and Docks"
black_plague_transport_purge_desc: "Cargo sheds, rolling stock, and dockside stores are repeatedly searched and cleared."
black_plague_quarantine_state: "Plague Quarantine"
black_plague_quarantine_state_desc: "Movement and supply are restricted while health teams isolate active districts."
black_plague_cordon_state: "Army Cordon"
black_plague_cordon_state_desc: "Military checkpoints and perimeter patrols enforce the containment line."

# Medical reserve production
black_plague_produce_medical_reserve: "Stock Reserves"
black_plague_produce_medical_reserve_desc: "Protected factories assemble medicines and disinfectants for outbreak response. Holding [GetBlackPlagueReserveFirstThresholdQuote] Medical Reserve reduces the first response cost in each state to [GetBlackPlagueReserveFirstFactorQuote] of normal. City rat sweeps require Medical Reserve on hand. Flea control, hospitals, treatment, and warren clearance draw from the stock. Reaching [GetBlackPlagueReserveUpkeepOneQuote] or [GetBlackPlagueReserveUpkeepTwoQuote] reserve progressively raises the consumer-goods burden for storage and inspection."
black_plague_produce_medical_reserve_cost: "£support_equipment_text_icon §Y[GetBlackPlagueReserveSupportQuote]§! £GFX_fuel_texticon §Y[GetBlackPlagueReserveFuelQuote]§! £civ_factory §Y[GetBlackPlagueReserveFactoriesQuote]§!"
black_plague_produce_medical_reserve_cost_blocked: "£support_equipment_text_icon §R[GetBlackPlagueReserveSupportQuote]§! £GFX_fuel_texticon §R[GetBlackPlagueReserveFuelQuote]§! £civ_factory §R[GetBlackPlagueReserveFactoriesQuote]§!"
black_plague_produce_medical_reserve_cost_tooltip: "Requires [GetBlackPlagueReserveManpowerQuote] available personnel and [GetBlackPlagueReserveTrucksQuote] trucks in stock. Commits £GFX_black_plague_response_capacity_texticon [GetBlackPlagueReserveBurdenQuote] Response Capacity and the displayed civilian factories for [GetBlackPlagueReserveDurationQuote] days. The full batch must fit within remaining reserve capacity."
