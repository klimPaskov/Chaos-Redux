black_plague_shared_sentinel_surveillance: "Establish Sentinel Surveillance"
black_plague_shared_sentinel_surveillance_desc: "Post trained observers at threatened and incubating settlements. Early reports reduce incoming exposure and reveal a route before it becomes an established outbreak."
black_plague_shared_inspect_transport_hubs: "Inspect Transport Hubs"
black_plague_shared_inspect_transport_hubs_desc: "Search freight yards, depots, and passenger terminals in the selected state. Inspections slow transport-borne spread while the operation remains active."
black_plague_shared_stronger_prevention_law: "Enact Stronger Prevention Law"
black_plague_shared_stronger_prevention_law_desc: "Use emergency sanitation and food-handling rules in the selected threatened state. The law lowers incoming exposure but costs stability and administrative capacity."
black_plague_shared_close_threatened_corridor: "Close a Threatened Corridor"
black_plague_shared_close_threatened_corridor_desc: "Close roads and border crossings between the selected threatened state and an established case. The corridor buys time while preserving a route for controlled relief."
black_plague_shared_port_inspections: "Inspect Port Arrivals"
black_plague_shared_port_inspections_desc: "Inspect ships, cargo, and dockside workers at the selected coastal hub. Port controls suppress maritime exposure and contaminated freight."
black_plague_shared_restrict_troop_routes: "Restrict Troop Routes"
black_plague_shared_restrict_troop_routes_desc: "Reroute formations and military freight around the selected state. The order reduces troop-borne exposure while command power and supply are committed."
black_plague_shared_preposition_field_hospitals: "Preposition Field Hospitals"
black_plague_shared_preposition_field_hospitals_desc: "Stage wards, disinfectants, and protected staff in the selected threatened state before cases turn severe. Treatment coverage rises without removing disease."
black_plague_shared_suspend_civilian_travel: "Suspend Civilian Travel"
black_plague_shared_suspend_civilian_travel_desc: "Suspend non-essential travel from the selected threatened or incubating state. The restriction slows civilian transmission while factories and fuel are diverted."
black_plague_shared_relief_corridor: "Open a Relief Corridor"
black_plague_shared_relief_corridor_desc: "Open a guarded corridor into an infected state under quarantine or cordon. Food and treatment reach households without reopening uncontrolled movement."
black_plague_shared_burial_sanitation: "Organize Burial Sanitation"
black_plague_shared_burial_sanitation_desc: "Replace unsafe disposal with supervised burial, disinfection, and grave registers in the selected infected state. The measure lowers load and mortality pressure."
black_plague_shared_seal_all_transport: "Seal All Transport"
black_plague_shared_seal_all_transport_desc: "Seal every rail, road, port, and air route from a severe or collapsed state. This drastic order sharply reduces spread at the cost of national logistics."
black_plague_shared_evacuate_threatened_perimeter: "Evacuate the Threatened Perimeter"
black_plague_shared_evacuate_threatened_perimeter_desc: "Move exposed households from the selected threatened state into screened reception zones. Evacuation lowers exposure but consumes trains and protected fuel."
black_plague_shared_foreign_medical_mission: "Invite a Foreign Medical Mission"
black_plague_shared_foreign_medical_mission_desc: "Bring outside clinicians and supplies into an infected state. The mission raises treatment and countermeasure progress while quarantine remains in force."
black_plague_shared_maintain_containment: "Maintain Containment"
black_plague_shared_maintain_containment_desc: "Keep a contained state under staffed checkpoints, inspection logs, and controlled supplies. Continued effort prevents a premature reopening from becoming relapse."
black_plague_shared_controlled_reopening: "Begin Controlled Reopening"
black_plague_shared_controlled_reopening_desc: "Reopen a contained state in screened stages. The decision trades a small amount of containment for economic and social recovery."
black_plague_shared_trace_residual_clusters: "Trace Residual Clusters"
black_plague_shared_trace_residual_clusters_desc: "Map lingering cases and hidden contacts in a contained or recovering state. Tracing reduces residual load before recovery can be declared secure."
black_plague_shared_rotate_exhausted_personnel: "Rotate Exhausted Personnel"
black_plague_shared_rotate_exhausted_personnel_desc: "Replace exhausted quarantine crews and medics in a contained or recovering state. Rested teams strengthen containment and reduce administrative failure."
black_plague_shared_restore_local_administration: "Restore Local Administration"
black_plague_shared_restore_local_administration_desc: "Rebuild registries, food distribution, and local courts in a recovering state. Civil administration turns medical recovery into durable control."
black_plague_shared_rebuild_hospitals_transport: "Rebuild Hospitals and Transport"
black_plague_shared_rebuild_hospitals_transport_desc: "Repair wards, ambulances, and screened transport links in a recovering state. Rebuilding expands treatment while keeping residual movement controlled."
black_plague_shared_support_surviving_households: "Support Surviving Households"
black_plague_shared_support_surviving_households_desc: "Provide food, shelter, and survivor assistance in a recovering state. Household support lowers mortality pressure and protects the recovery effort."
black_plague_shared_preserve_sentinel_surveillance: "Preserve Sentinel Surveillance"
black_plague_shared_preserve_sentinel_surveillance_desc: "Keep trained observers in a cured state after emergency measures lift. Sentinel posts detect imported cases before a second episode forms."
black_plague_shared_remove_emergency_restrictions: "Remove Emergency Restrictions"
black_plague_shared_remove_emergency_restrictions_desc: "Lift remaining travel and monitoring restrictions from a cured state after a deliberate review. The release restores stability but ends the emergency safety net."
black_plague_shared_fortify_anti_rat_line: "Fortify the Anti-Rat Line"
black_plague_shared_fortify_anti_rat_line_desc: "Build barriers, traps, and defended sanitation lines on the edge of a threatened state. Fortification slows rat incursions before a warren takes hold."
black_plague_shared_armored_clearance: "Conduct Armored Clearance"
black_plague_shared_armored_clearance_desc: "Use protected vehicles and infantry to clear infestation left in a liberated former rat state. Clearance reduces infestation and raises containment but cannot proceed without equipment and fuel."
black_plague_shared_air_reconnaissance_sweep: "Sweep Rat Routes from the Air"
black_plague_shared_air_reconnaissance_sweep_desc: "Reconnoitre a liberated former rat state for burrows, supply trails, and escape routes. The sweep lowers incoming exposure for the ground operation."
black_plague_shared_liberate_and_quarantine: "Liberate and Quarantine"
black_plague_shared_liberate_and_quarantine_desc: "After retaking a rat state, impose quarantine. Warrens and contaminated stores still require cleanup."
black_plague_shared_strike_royal_node: "Strike the Royal Node"
black_plague_shared_strike_royal_node_desc: "Concentrate a costly military operation against the Rat King's royal node. A successful strike damages infestation, cuts Dominion, and delays the next royal pulse. A prepared node can break the assault and strengthen the Rat King's final campaign."
black_plague_shared_strike_royal_node_cost: "£infantry_equipment_text_icon §Y[GetBlackPlague020SharedCostCountryInfantryEquipmentQuote]§!  £GFX_fuel_texticon §Y[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §Y3§!"
black_plague_shared_strike_royal_node_cost_blocked: "£infantry_equipment_text_icon §R[GetBlackPlague020SharedCostCountryInfantryEquipmentQuote]§!  £GFX_fuel_texticon §R[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §R3§!"
black_plague_shared_strike_royal_node_cost_tooltip: "Spent at launch: £infantry_equipment_text_icon §Y[GetBlackPlague020SharedCostCountryInfantryEquipmentQuote]§! and £GFX_fuel_texticon §Y[GetBlackPlague020SharedCostCountryFuelQuote]§!.\nFactory commitment: £civ_factory §Y3§!.\nResponse Capacity commitment: £GFX_black_plague_response_capacity_texticon §Y[GetBlackPlague020SharedBurdenMediumQuote]§!.\nDuration: £clock_texticon §Y[GetBlackPlague020SharedDurationStrikeRoyalNodeQuote]§! days. Material costs are not refunded if the operation ends early."
black_plague_shared_strike_the_crown: "Strike the Crown"
black_plague_shared_strike_the_crown_desc: "Commit a sovereign assault against the Rat King's basin after Evolution IV, two Royal Node strikes, a military route, and three Council strikes. Capture the target before the deadline to break the royal command chain. The plague remains."
black_plague_shared_strike_the_crown_cost: "£infantry_equipment_text_icon §Y[GetBlackPlague020SharedResultCrownStrikeInfantryEquipmentQuote]§!  £GFX_fuel_texticon §Y[GetBlackPlague020SharedResultCrownStrikeFuelQuote]§!  £civ_factory §Y[GetBlackPlague020SharedResultCrownStrikeCivilianFactoriesQuote]§!"
black_plague_shared_strike_the_crown_cost_blocked: "£infantry_equipment_text_icon §R[GetBlackPlague020SharedResultCrownStrikeInfantryEquipmentQuote]§!  £GFX_fuel_texticon §R[GetBlackPlague020SharedResultCrownStrikeFuelQuote]§!  £civ_factory §R[GetBlackPlague020SharedResultCrownStrikeCivilianFactoriesQuote]§!"
black_plague_shared_strike_the_crown_cost_tooltip: "Spent at launch: £infantry_equipment_text_icon §Y[GetBlackPlague020SharedResultCrownStrikeInfantryEquipmentQuote]§! and £GFX_fuel_texticon §Y[GetBlackPlague020SharedResultCrownStrikeFuelQuote]§!.\nFactory commitment: £civ_factory §Y[GetBlackPlague020SharedResultCrownStrikeCivilianFactoriesQuote]§!.\nResponse Capacity commitment: £GFX_black_plague_response_capacity_texticon §Y[GetBlackPlague020ResponseBurdenCrownStrikeQuote]§!.\nDuration: £clock_texticon §Y[GetBlackPlague020SharedDurationStrikeTheCrownQuote]§! days. Material costs are not refunded if the operation ends early."
black_plague_shared_strike_the_crown_mission: "Strike the Crown: Assault Underway"
black_plague_shared_strike_the_crown_mission_desc: "The sovereign assault is in progress. The marked Royal Basin remains contested until the operation resolves. Losing the route cancels the mission. The deadline applies the Crown Strike outcome."
black_plague_shared_strike_the_crown_mission_cancelled_tt: "The Crown Strike is cancelled because its target or military route is no longer viable. The response lane is released without an outcome."
black_plague_shared_strike_the_crown_mission_complete_tt: "A human coalition has captured the marked Royal Basin. The Crown Strike result is resolved and the royal assault lane is released."
black_plague_shared_strike_the_crown_mission_timeout_tt: "The Crown Strike deadline is reached. Resolve the marked state through the existing assault result."
black_plague_shared_seal_royal_burrows: "Seal Royal Burrows"
black_plague_shared_seal_royal_burrows_desc: "Collapse a former Royal Node or the Royal Basin's remaining burrow network. This operation lowers infestation and raises containment without curing the Black Plague or deleting the historical site."
black_plague_shared_seal_royal_burrows_cost: "£support_equipment_text_icon §Y[GetBlackPlague020SharedResultRoyalSealSupportEquipmentQuote]§!  £GFX_fuel_texticon §Y[GetBlackPlague020SharedResultRoyalSealFuelQuote]§!  £civ_factory §Y[GetBlackPlague020SharedResultRoyalSealCivilianFactoriesQuote]§!"
black_plague_shared_seal_royal_burrows_cost_blocked: "£support_equipment_text_icon §R[GetBlackPlague020SharedResultRoyalSealSupportEquipmentQuote]§!  £GFX_fuel_texticon §R[GetBlackPlague020SharedResultRoyalSealFuelQuote]§!  £civ_factory §R[GetBlackPlague020SharedResultRoyalSealCivilianFactoriesQuote]§!"
black_plague_shared_seal_royal_burrows_cost_tooltip: "Spent at launch: £support_equipment_text_icon §Y[GetBlackPlague020SharedResultRoyalSealSupportEquipmentQuote]§! and £GFX_fuel_texticon §Y[GetBlackPlague020SharedResultRoyalSealFuelQuote]§!.\nFactory commitment: £civ_factory §Y[GetBlackPlague020SharedResultRoyalSealCivilianFactoriesQuote]§!.\nResponse Capacity commitment: £GFX_black_plague_response_capacity_texticon §Y[GetBlackPlague020SharedResultRoyalSealResponseBurdenQuote]§!.\nDuration: £clock_texticon §Y[GetBlackPlague020SharedDurationSealRoyalBurrowsQuote]§! days. Material costs are not refunded if the operation ends early."
black_plague_shared_seal_royal_burrows_mission: "Seal Royal Burrows: Collapse Underway"
black_plague_shared_seal_royal_burrows_mission_desc: "Engineers are collapsing the marked royal site. The mission resolves at the deadline. Losing control of the site cancels the work. The surrounding disease remains."
black_plague_shared_seal_royal_burrows_mission_cancelled_tt: "Royal Burrow sealing is cancelled because the marked site is no longer controlled or the aftermath route has closed. No containment result is applied."
black_plague_shared_seal_royal_burrows_mission_timeout_tt: "The Royal Burrow sealing deadline is reached. Resolve the marked site through the existing anti-rat result."
black_plague_shared_emergency_countermeasure_drive: "Emergency Countermeasure Drive"
black_plague_shared_emergency_countermeasure_drive_desc: "A timed national effort to convert emergency stockpiles into countermeasure progress before the severe crisis widens."
black_plague_shared_emergency_countermeasure_drive_cost: "£support_equipment_text_icon §Y[GetBlackPlague020SharedCostCountrySupportEquipmentQuote]§!  £motorized_equipment_text_icon §Y[GetBlackPlague020SharedCostCountryMotorizedEquipmentQuote]§!  £GFX_fuel_texticon §Y[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §Y[GetBlackPlague020SharedCostEmergencyCountermeasureCivilianFactoriesQuote]§!  [GetBlackPlague020SharedDurationEmergencyCountermeasureDriveQuote] days"
black_plague_shared_emergency_countermeasure_drive_cost_blocked: "£support_equipment_text_icon §R[GetBlackPlague020SharedCostCountrySupportEquipmentQuote]§!  £motorized_equipment_text_icon §R[GetBlackPlague020SharedCostCountryMotorizedEquipmentQuote]§!  £GFX_fuel_texticon §R[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §R[GetBlackPlague020SharedCostEmergencyCountermeasureCivilianFactoriesQuote]§!  [GetBlackPlague020SharedDurationEmergencyCountermeasureDriveQuote] days"

black_plague_shared_publish_findings: "Publish Countermeasure Findings"
black_plague_shared_publish_findings_desc: "Release verified field findings to public laboratories and civil authorities. Publication accelerates countermeasure progress but exposes methods and costs protected stores."
black_plague_shared_restricted_alliance_exchange: "Exchange Findings with Allies"
black_plague_shared_restricted_alliance_exchange_desc: "Share selected samples and treatment findings with a faction partner under strict access controls. The exchange raises progress while the agreement remains active."
black_plague_shared_hoard_protocol: "Hoard a Countermeasure Protocol"
black_plague_shared_hoard_protocol_desc: "Lock the most sensitive findings inside a protected national archive. Hoarding preserves a small edge but harms stability and slows collective progress."
black_plague_shared_steal_foreign_progress: "Steal Foreign Progress"
black_plague_shared_steal_foreign_progress_desc: "Use an intelligence network to acquire another country's countermeasure research. The operation is costly and risky but can recover progress when cooperation fails."
black_plague_shared_international_medical_mission: "Fund an International Medical Mission"
black_plague_shared_international_medical_mission_desc: "Send clinicians, equipment, and samples abroad to coordinate a multinational response. The mission produces major countermeasure progress while it consumes national capacity."
black_plague_shared_reconstruction_vigilance: "Rebuild and Keep Vigilance"
black_plague_shared_reconstruction_vigilance_desc: "Rebuild recovered states and keep inspectors in the field."
black_plague_shared_reconstruction_vigilance_cost: "£support_equipment_text_icon §Y[GetBlackPlague020SharedCostCountrySupportEquipmentQuote]§!  £motorized_equipment_text_icon §Y[GetBlackPlague020SharedCostCountryMotorizedEquipmentQuote]§!  £GFX_fuel_texticon §Y[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §Y2§!  [GetBlackPlague020SharedDurationReconstructionVigilanceQuote] days"
black_plague_shared_reconstruction_vigilance_cost_blocked: "£support_equipment_text_icon §R[GetBlackPlague020SharedCostCountrySupportEquipmentQuote]§!  £motorized_equipment_text_icon §R[GetBlackPlague020SharedCostCountryMotorizedEquipmentQuote]§!  £GFX_fuel_texticon §R[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §R2§!  [GetBlackPlague020SharedDurationReconstructionVigilanceQuote] days"
black_plague_shared_reconstruction_vigilance_cost_tooltip: "Materials are spent when the operation starts. Factories and Response Capacity remain committed until it ends."
black_plague_shared_international_inspection_compact: "Sign the International Inspection Compact"
black_plague_shared_international_inspection_compact_desc: "Coordinate allied inspectors at coastal hubs and logistics crossings. The compact reduces port, rail, troop, and refugee spread while it remains in force, but demands a long commitment of equipment and factories."
black_plague_shared_international_inspection_compact_cost: "£support_equipment_text_icon §Y[GetBlackPlague020SharedCostCountrySupportEquipmentQuote]§!  £motorized_equipment_text_icon §Y[GetBlackPlague020SharedCostCountryMotorizedEquipmentQuote]§!  £GFX_fuel_texticon §Y[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §Y3§!  [GetBlackPlague020SharedDurationInternationalInspectionCompactQuote] days"
black_plague_shared_international_inspection_compact_cost_blocked: "£support_equipment_text_icon §R[GetBlackPlague020SharedCostCountrySupportEquipmentQuote]§!  £motorized_equipment_text_icon §R[GetBlackPlague020SharedCostCountryMotorizedEquipmentQuote]§!  £GFX_fuel_texticon §R[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §R3§!  [GetBlackPlague020SharedDurationInternationalInspectionCompactQuote] days"
black_plague_shared_international_inspection_compact_cost_tooltip: "Materials are spent when the operation starts. Factories and Response Capacity remain committed until it ends."
black_plague_shared_condemn_future_weaponization: "Condemn Future Weaponization"
black_plague_shared_condemn_future_weaponization_desc: "Place the verified findings under an international ban on weaponization. The decision steadies the country and bars a future Black Plague weaponization project, at the cost of a final review effort and protected stores."
black_plague_shared_condemn_future_weaponization_cost: "£support_equipment_text_icon §Y[GetBlackPlague020SharedCostCountrySupportEquipmentQuote]§!  £motorized_equipment_text_icon §Y[GetBlackPlague020SharedCostCountryMotorizedEquipmentQuote]§!  £GFX_fuel_texticon §Y[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §Y2§!  [GetBlackPlague020SharedDurationCondemnFutureWeaponizationQuote] days"
black_plague_shared_condemn_future_weaponization_cost_blocked: "£support_equipment_text_icon §R[GetBlackPlague020SharedCostCountrySupportEquipmentQuote]§!  £motorized_equipment_text_icon §R[GetBlackPlague020SharedCostCountryMotorizedEquipmentQuote]§!  £GFX_fuel_texticon §R[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §R2§!  [GetBlackPlague020SharedDurationCondemnFutureWeaponizationQuote] days"
black_plague_shared_condemn_future_weaponization_cost_tooltip: "Materials are spent when the operation starts. Factories and Response Capacity remain committed until it ends."
black_plague_shared_population_recovery_program: "Run a Population Recovery Programme"
black_plague_shared_population_recovery_program_desc: "Repopulate ruined districts through hospitals, screened transport, housing repair, and returning households. The programme reduces devastation and relapse, but it cannot end an active outbreak."
black_plague_shared_population_recovery_program_cost: "£support_equipment_text_icon §Y[GetBlackPlague020SharedCostCountrySupportEquipmentQuote]§!  £motorized_equipment_text_icon §Y[GetBlackPlague020SharedCostCountryMotorizedEquipmentQuote]§!  £GFX_fuel_texticon §Y[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §Y3§!  [GetBlackPlague020SharedDurationPopulationRecoveryProgramQuote] days"
black_plague_shared_population_recovery_program_cost_blocked: "£support_equipment_text_icon §R[GetBlackPlague020SharedCostCountrySupportEquipmentQuote]§!  £motorized_equipment_text_icon §R[GetBlackPlague020SharedCostCountryMotorizedEquipmentQuote]§!  £GFX_fuel_texticon §R[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §R3§!  [GetBlackPlague020SharedDurationPopulationRecoveryProgramQuote] days"
black_plague_shared_population_recovery_program_cost_tooltip: "Materials are spent when the programme starts. Every controlled recovering or cured state with devastation gains a lasting recovery modifier."
black_plague_shared_memorial_biosecurity_charter: "Open a Memorial and Biosecurity Charter"
black_plague_shared_memorial_biosecurity_charter_desc: "Create a permanent memorial and biosecurity charter for the dead, the displaced, and the prohibition on biological weapon use. Recovered states retain the history while countermeasure findings remain available."
black_plague_shared_memorial_biosecurity_charter_cost: "£support_equipment_text_icon §Y[GetBlackPlague020SharedCostCountrySupportEquipmentQuote]§!  £motorized_equipment_text_icon §Y[GetBlackPlague020SharedCostCountryMotorizedEquipmentQuote]§!  £GFX_fuel_texticon §Y[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §Y2§!  [GetBlackPlague020SharedDurationMemorialBiosecurityCharterQuote] days"
black_plague_shared_memorial_biosecurity_charter_cost_blocked: "£support_equipment_text_icon §R[GetBlackPlague020SharedCostCountrySupportEquipmentQuote]§!  £motorized_equipment_text_icon §R[GetBlackPlague020SharedCostCountryMotorizedEquipmentQuote]§!  £GFX_fuel_texticon §R[GetBlackPlague020SharedCostCountryFuelQuote]§!  £civ_factory §R2§!  [GetBlackPlague020SharedDurationMemorialBiosecurityCharterQuote] days"
black_plague_shared_memorial_biosecurity_charter_cost_tooltip: "Materials are spent when the charter starts. The memorial and biosecurity stewardship modifier remains afterward."
black_plague_population_recovery_program: "Population Recovery Programme"
black_plague_population_recovery_program_desc: "Hospitals, screened transport, housing repair, and returning households reduce the lasting cost of a ruined state without pretending that the disease phase has vanished."
black_plague_memorial_biosecurity_stewardship: "Memorial and Biosecurity Stewardship"
black_plague_memorial_biosecurity_stewardship_desc: "The recovered state carries a permanent memorial, inspection, and biosecurity obligation under the country's charter."

black_plague_shared_start_last_response_hold: "Organize the Last Response: Hold the Line"
black_plague_shared_start_last_response_hold_desc: "After Evolution V opens the final campaign, organize support equipment, infantry equipment, and manpower to hold an established state out of the Rat King's order. Stability must remain at or above §Y[GetBlackPlague020LastResponseHoldStabilityFloorQuote]§!, and War Support at or above §Y[GetBlackPlague020LastResponseHoldWarSupportFloorQuote]§!. Weekly progress determines success."
black_plague_shared_start_last_response_hold_cost: "£support_equipment_text_icon §Y[GetBlackPlague020LastResponseHoldSupportEquipmentQuote]§!  £infantry_equipment_text_icon §Y[GetBlackPlague020LastResponseHoldInfantryEquipmentQuote]§!  £manpower_texticon §Y[GetBlackPlague020LastResponseHoldManpowerQuote]§!"
black_plague_shared_start_last_response_hold_cost_blocked: "£support_equipment_text_icon §R[GetBlackPlague020LastResponseHoldSupportEquipmentQuote]§!  £infantry_equipment_text_icon §R[GetBlackPlague020LastResponseHoldInfantryEquipmentQuote]§!  £manpower_texticon §R[GetBlackPlague020LastResponseHoldManpowerQuote]§!"
black_plague_shared_start_last_response_hold_cost_tooltip: "$black_plague_shared_start_last_response_hold_cost$\nFactory commitment: £civ_factory §Y[GetBlackPlague020LastResponseHoldCivilianFactoriesQuote]§!. Launch window, days: £clock_texticon §Y[GetBlackPlague020LastResponseLaunchDaysQuote]§!. Mission duration, days: £clock_texticon §Y[GetBlackPlagueLastResponseMissionDaysQuote]§!."
black_plague_shared_start_last_response_hold_effect_tt: "Activate a [GetBlackPlagueLastResponseMissionDaysQuote]-day last-response mission. Weekly progress improves while at war with the Rat King, through countermeasure progress, and for each established state held."
black_plague_shared_last_response_hold_mission: "Last Response: Hold the Line"
black_plague_shared_last_response_hold_mission_desc: "Progress: [?black_plague_human_last_response_hold_progress|0] / [GetBlackPlagueLastResponseGoalQuote]. Hold an established state as the Rat King prepares the final campaign. Success lowers preparation and strengthens countermeasure work. Timeout raises hunger, exposure, and pressure."
black_plague_shared_last_response_hold_complete_tt: "The line holds. Terminal preparation falls, countermeasure progress advances, and one held state gains containment."
black_plague_shared_last_response_hold_timeout_tt: "The line breaks. The Rat King gains terminal pressure and hunger, while held established states suffer renewed exposure."

black_plague_shared_start_last_response_refuge: "Organize the Last Response: Secure the Refuge"
black_plague_shared_start_last_response_refuge_desc: "Commit the national reserve to a held terminal capital, refuge node, or city. The operation uses motorized equipment, manpower, and fuel while tying up civilian factories for its launch. Stability must remain at or above §Y[GetBlackPlague020LastResponseRefugeStabilityFloorQuote]§!, and War Support at or above §Y[GetBlackPlague020LastResponseRefugeWarSupportFloorQuote]§!. Success buys a deeper reduction in terminal preparation and protects key human ground."
black_plague_shared_start_last_response_refuge_cost: "£motorized_equipment_text_icon §Y[GetBlackPlague020LastResponseRefugeMotorizedEquipmentQuote]§!  £manpower_texticon §Y[GetBlackPlague020LastResponseRefugeManpowerQuote]§!  £GFX_fuel_texticon §Y[GetBlackPlague020LastResponseRefugeFuelQuote]§!"
black_plague_shared_start_last_response_refuge_cost_blocked: "£motorized_equipment_text_icon §R[GetBlackPlague020LastResponseRefugeMotorizedEquipmentQuote]§!  £manpower_texticon §R[GetBlackPlague020LastResponseRefugeManpowerQuote]§!  £GFX_fuel_texticon §R[GetBlackPlague020LastResponseRefugeFuelQuote]§!"
black_plague_shared_start_last_response_refuge_cost_tooltip: "$black_plague_shared_start_last_response_refuge_cost$\nFactory commitment: £civ_factory §Y[GetBlackPlague020LastResponseRefugeCivilianFactoriesQuote]§!. Launch window, days: £clock_texticon §Y[GetBlackPlague020LastResponseLaunchDaysQuote]§!. Mission duration, days: £clock_texticon §Y[GetBlackPlagueLastResponseMissionDaysQuote]§!."
black_plague_shared_start_last_response_refuge_effect_tt: "Activate a [GetBlackPlagueLastResponseMissionDaysQuote]-day refuge mission. A held terminal capital, refuge node, or city adds progress each week."
black_plague_shared_last_response_refuge_mission: "Last Response: Secure the Refuge"
black_plague_shared_last_response_refuge_mission_desc: "Progress: [?black_plague_human_last_response_refuge_progress|0] / [GetBlackPlagueLastResponseGoalQuote]. Protect a held capital, refuge node, or city as the Rat King prepares the final campaign. Success buys stronger relief. Timeout exposes the remaining human basin."
black_plague_shared_last_response_refuge_complete_tt: "The refuge holds. Terminal preparation falls sharply, countermeasure progress advances, and the protected node gains containment."
black_plague_shared_last_response_refuge_timeout_tt: "The refuge fails. The Rat King gains terminal pressure and hunger, while the remaining human basin suffers renewed exposure."

