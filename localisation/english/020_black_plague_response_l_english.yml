black_plague_shared_sentinel_surveillance: "Establish Sentinel Surveillance"
black_plague_shared_sentinel_surveillance_desc: "Post trained observers at threatened and incubating settlements. Early reports reduce incoming exposure and reveal a route before it becomes an established outbreak."
black_plague_shared_inspect_transport_hubs: "Inspect Transport Hubs"
black_plague_shared_inspect_transport_hubs_desc: "Search freight yards, depots, and passenger terminals in the selected state. Inspections slow transport-borne spread while the operation remains active."
black_plague_shared_stronger_prevention_law: "Enact Stronger Prevention Law"
black_plague_shared_stronger_prevention_law_desc: "Use emergency sanitation and food-handling rules in the selected threatened state. The law lowers incoming exposure but costs stability and administrative capacity."
black_plague_shared_close_threatened_corridor: "Close a Threatened Corridor"
black_plague_shared_close_threatened_corridor_desc: "Close roads and border crossings between the selected threatened state and an established case. The corridor buys time while preserving a route for controlled relief."
black_plague_shared_port_inspections: "Inspect Port Arrivals"
black_plague_shared_port_inspections_desc: "Inspect ships, cargo, and dockside workers at the selected coastal hub. Port controls suppress maritime exposure and contaminated freight."
black_plague_shared_restrict_troop_routes: "Restrict Troop Routes"
black_plague_shared_restrict_troop_routes_desc: "Reroute formations and military freight around the selected state. The order reduces troop-borne exposure while command power and supply are committed."
black_plague_shared_preposition_field_hospitals: "Preposition Field Hospitals"
black_plague_shared_preposition_field_hospitals_desc: "Stage wards, disinfectants, and protected staff in the selected threatened state before cases turn severe. Treatment coverage rises without removing disease."
black_plague_shared_suspend_civilian_travel: "Suspend Civilian Travel"
black_plague_shared_suspend_civilian_travel_desc: "Suspend non-essential travel from the selected threatened or incubating state. The restriction slows civilian transmission while factories and fuel are diverted."
black_plague_shared_relief_corridor: "Open a Relief Corridor"
black_plague_shared_relief_corridor_desc: "Open a guarded corridor into an infected state under quarantine or cordon. Food and treatment reach households without reopening uncontrolled movement."
black_plague_shared_burial_sanitation: "Organize Burial Sanitation"
black_plague_shared_burial_sanitation_desc: "Replace unsafe disposal with supervised burial, disinfection, and records in the selected infected state. The measure lowers load and mortality pressure."
black_plague_shared_seal_all_transport: "Seal All Transport"
black_plague_shared_seal_all_transport_desc: "Seal every rail, road, port, and air route from a severe or collapsed state. This drastic order sharply reduces spread at the cost of national logistics."
black_plague_shared_evacuate_threatened_perimeter: "Evacuate the Threatened Perimeter"
black_plague_shared_evacuate_threatened_perimeter_desc: "Move exposed households from the selected threatened state into screened reception zones. Evacuation lowers exposure but consumes trains and protected fuel."
black_plague_shared_foreign_medical_mission: "Invite a Foreign Medical Mission"
black_plague_shared_foreign_medical_mission_desc: "Bring outside clinicians and supplies into an infected state. The mission raises treatment and countermeasure progress while quarantine remains in force."
black_plague_shared_maintain_containment: "Maintain Containment"
black_plague_shared_maintain_containment_desc: "Keep a contained state under staffed checkpoints, records, and controlled supply. Continued effort prevents a premature reopening from becoming relapse."
black_plague_shared_controlled_reopening: "Begin Controlled Reopening"
black_plague_shared_controlled_reopening_desc: "Reopen a contained state in screened stages. The decision trades a small amount of containment for economic and social recovery."
black_plague_shared_trace_residual_clusters: "Trace Residual Clusters"
black_plague_shared_trace_residual_clusters_desc: "Map lingering cases and hidden contacts in a contained or recovering state. Tracing reduces residual load before recovery can be declared secure."
black_plague_shared_rotate_exhausted_personnel: "Rotate Exhausted Personnel"
black_plague_shared_rotate_exhausted_personnel_desc: "Replace exhausted quarantine crews and medics in a contained or recovering state. Rested teams strengthen containment and reduce administrative failure."
black_plague_shared_restore_local_administration: "Restore Local Administration"
black_plague_shared_restore_local_administration_desc: "Rebuild registries, food distribution, and local courts in a recovering state. Civil administration turns medical recovery into durable control."
black_plague_shared_rebuild_hospitals_transport: "Rebuild Hospitals and Transport"
black_plague_shared_rebuild_hospitals_transport_desc: "Repair wards, ambulances, and screened transport links in a recovering state. Rebuilding expands treatment while keeping residual movement controlled."
black_plague_shared_support_surviving_households: "Support Surviving Households"
black_plague_shared_support_surviving_households_desc: "Provide food, shelter, and survivor assistance in a recovering state. Household support lowers mortality pressure and protects the recovery effort."
black_plague_shared_preserve_sentinel_surveillance: "Preserve Sentinel Surveillance"
black_plague_shared_preserve_sentinel_surveillance_desc: "Keep trained observers in a cured state after emergency measures lift. Sentinel posts detect imported cases before a second episode forms."
black_plague_shared_remove_emergency_restrictions: "Remove Emergency Restrictions"
black_plague_shared_remove_emergency_restrictions_desc: "Lift remaining travel and monitoring restrictions from a cured state after a deliberate review. The release restores stability but ends the emergency safety net."
black_plague_shared_fortify_anti_rat_line: "Fortify the Anti-Rat Line"
black_plague_shared_fortify_anti_rat_line_desc: "Build barriers, traps, and defended sanitation lines on the edge of a threatened state. Fortification slows rat incursions before a warren takes hold."
black_plague_shared_armored_clearance: "Conduct Armored Clearance"
black_plague_shared_armored_clearance_desc: "Use protected vehicles and infantry to clear infestation left in a liberated former rat state. Clearance reduces infestation and raises containment but cannot proceed without equipment and fuel."
black_plague_shared_air_reconnaissance_sweep: "Sweep Rat Routes from the Air"
black_plague_shared_air_reconnaissance_sweep_desc: "Reconnoitre a liberated former rat state for burrows, supply trails, and escape routes. The sweep lowers incoming exposure for the ground operation."
black_plague_shared_liberate_and_quarantine: "Liberate and Quarantine"
black_plague_shared_liberate_and_quarantine_desc: "After a rat state is retaken, impose an immediate quarantine. Military control is only the first step; warrens and contaminated stores still require cleanup."

black_plague_shared_publish_findings: "Publish Countermeasure Findings"
black_plague_shared_publish_findings_desc: "Release verified field findings to public laboratories and civil authorities. Publication accelerates countermeasure progress but exposes methods and costs protected stores."
black_plague_shared_restricted_alliance_exchange: "Exchange Findings with Allies"
black_plague_shared_restricted_alliance_exchange_desc: "Share selected samples and treatment records with a faction partner under strict access controls. The exchange raises progress while the agreement remains active."
black_plague_shared_hoard_protocol: "Hoard a Countermeasure Protocol"
black_plague_shared_hoard_protocol_desc: "Lock the most sensitive findings inside a protected national archive. Hoarding preserves a small edge but harms stability and slows collective progress."
black_plague_shared_steal_foreign_progress: "Steal Foreign Progress"
black_plague_shared_steal_foreign_progress_desc: "Use an intelligence network to acquire another country's countermeasure records. The operation is costly and risky but can recover progress when cooperation fails."
black_plague_shared_international_medical_mission: "Fund an International Medical Mission"
black_plague_shared_international_medical_mission_desc: "Send clinicians, equipment, and samples abroad to coordinate a multinational response. The mission produces major countermeasure progress while it consumes national capacity."
