black_plague_purge_liberated_warrens_cost_tooltip: "Spend the displayed resources and keep a containment force in the state. Assign [?constant:black_plague_response_factories.purge_liberated_warrens|0] civilian factories and [?constant:black_plague_response_burden.purge_liberated_warrens|0] response capacity for [?constant:black_plague_response_duration.purge_liberated_warrens|0] days. This can be completed once per plague episode."
black_plague_purge_liberated_warrens_start_tt: "Engineers and troops descend into the abandoned warren network."
black_plague_purge_liberated_warrens_complete_tt: "Severely reduces infestation, plague load, spread, exposure, relapse risk, and raises containment. It also contributes field findings and suppresses hidden nests for [?constant:black_plague_response_duration.hidden_nest_duration|0] days."

# Countermeasure program
black_plague_establish_countermeasure_program: "Establish the Countermeasure Program"
black_plague_establish_countermeasure_program_desc: "Concentrate field reports, hospital samples, logistics records, and clinical observations at a protected site in the selected state. Progress runs from 0 to 100 and improves survival, spread control, and cleanup without instantly removing disease."
black_plague_establish_countermeasure_program_cost: "£manpower_texticon §Y[?constant:black_plague_response_cost_countermeasure.manpower|0]§!  £support_equipment_text_icon §Y[?constant:black_plague_response_cost_countermeasure.support_equipment|0]§!  £motorized_equipment_text_icon §Y[?constant:black_plague_response_cost_countermeasure.motorized_equipment|0]§!  £GFX_train_texticon §Y[?constant:black_plague_response_cost_countermeasure.trains|0]§!  £GFX_fuel_texticon §Y[?constant:black_plague_response_cost_countermeasure.fuel|0]§!  Medical Reserve §G[?constant:black_plague_medical_reserve.countermeasure_entry_reserve|0]§!  £civ_factory §Y[?constant:black_plague_response_factories.countermeasure_setup|0]§!"
black_plague_establish_countermeasure_program_cost_blocked: "£manpower_texticon §R[?constant:black_plague_response_cost_countermeasure.manpower|0]§!  £support_equipment_text_icon §R[?constant:black_plague_response_cost_countermeasure.support_equipment|0]§!  £motorized_equipment_text_icon §R[?constant:black_plague_response_cost_countermeasure.motorized_equipment|0]§!  £GFX_train_texticon §R[?constant:black_plague_response_cost_countermeasure.trains|0]§!  £GFX_fuel_texticon §R[?constant:black_plague_response_cost_countermeasure.fuel|0]§!  Medical Reserve §R[?constant:black_plague_medical_reserve.countermeasure_entry_reserve|0]§!  £civ_factory §R[?constant:black_plague_response_factories.countermeasure_setup|0]§!"
black_plague_establish_countermeasure_program_cost_tooltip: "Spend the displayed national resources and [?constant:black_plague_medical_reserve.countermeasure_entry_reserve|0] Medical Reserve. Assign [?constant:black_plague_response_factories.countermeasure_setup|0] civilian factories and [?constant:black_plague_response_burden.countermeasure|0] response capacity for [?constant:black_plague_response_duration.countermeasure_setup|0] days. Once established, the program commits [?constant:black_plague_response_factories.countermeasure_persistent|0] civilian factories and the same response capacity until completion."
black_plague_establish_countermeasure_program_start_tt: "A protected countermeasure site is organized in the selected state."
black_plague_establish_countermeasure_program_complete_tt: "Activates the national 0–100 countermeasure program, grants initial progress, and incorporates any field findings already recorded."

# Doctor Wu
black_plague_activate_doctor_wu_protocol: "Activate Doctor Wu's Protocol"
black_plague_activate_doctor_wu_protocol_desc: "Give Doctor Wu's network priority access to the selected Severe Crisis state. The protocol combines rapid case identification, treatment allocation, and vector suppression; it exposes hidden incubation and accelerates cleanup but does not cure a state outright."
black_plague_activate_doctor_wu_protocol_cost: "£manpower_texticon §Y[?constant:black_plague_response_cost_doctor_wu.manpower|0]§!  £support_equipment_text_icon §Y[?constant:black_plague_response_cost_doctor_wu.support_equipment|0]§!  £motorized_equipment_text_icon §Y[?constant:black_plague_response_cost_doctor_wu.motorized_equipment|0]§!  £GFX_fuel_texticon §Y[?constant:black_plague_response_cost_doctor_wu.fuel|0]§!  £civ_factory §Y[?constant:black_plague_response_factories.doctor_wu_protocol|0]§!"
black_plague_activate_doctor_wu_protocol_cost_blocked: "£manpower_texticon §R[?constant:black_plague_response_cost_doctor_wu.manpower|0]§!  £support_equipment_text_icon §R[?constant:black_plague_response_cost_doctor_wu.support_equipment|0]§!  £motorized_equipment_text_icon §R[?constant:black_plague_response_cost_doctor_wu.motorized_equipment|0]§!  £GFX_fuel_texticon §R[?constant:black_plague_response_cost_doctor_wu.fuel|0]§!  £civ_factory §R[?constant:black_plague_response_factories.doctor_wu_protocol|0]§!"
black_plague_activate_doctor_wu_protocol_cost_tooltip: "Spend the displayed resources. Assign [?constant:black_plague_response_factories.doctor_wu_protocol|0] civilian factories and [?constant:black_plague_response_burden.doctor_wu_protocol|0] response capacity for [?constant:black_plague_response_duration.doctor_wu_protocol|0] days. Doctor Wu must still be active and hosted by this country."
black_plague_activate_doctor_wu_protocol_start_tt: "Doctor Wu's teams enter the selected Severe Crisis state."
black_plague_activate_doctor_wu_protocol_complete_tt: "Adds [?constant:black_plague_response_result.doctor_wu_countermeasure|0] countermeasure findings, raises treatment and containment, lowers mortality, reveals controlled incubation in this country's states, and accelerates later cleanup."

# Doctor Wu foreign access
black_plague_request_doctor_wu_access: "Request Doctor Wu Foreign Access"
black_plague_request_doctor_wu_access_desc: "Ask the current Doctor Wu host for a bounded mission to the selected Black Plague state. Neighbouring or allied access is negotiated through real transport, fuel, and medical stores; the mission improves treatment and countermeasure work but does not replace quarantine or cleanup."
black_plague_request_doctor_wu_access_cost: "£support_equipment_text_icon §Y[?constant:doctor_wu_access.request_support_equipment|0]§!  £motorized_equipment_text_icon §Y[?constant:doctor_wu_access.request_motorized_equipment|0]§!  £convoy_texticon §Y[?constant:doctor_wu_access.request_convoys|0]§!  £GFX_fuel_texticon §Y[?constant:doctor_wu_access.request_fuel|0]§!"
