l_english:

# Shared Black Plague response board
black_plague_response_capacity_label: "Response Capacity"
black_plague_response_capacity_value: "[?black_plague_response_capacity_remaining|0] / [?black_plague_response_capacity|0]"
black_plague_countermeasure_progress_label: "Countermeasure Progress"
black_plague_countermeasure_progress_value: "[?black_plague_countermeasure_progress|0] / [?constant:black_plague_response_threshold.countermeasure_completion|0]"
black_plague_countermeasure_progress_tt: "A national program built from field observations, hospital reports, and controlled trials. Higher progress suppresses plague mortality and spread, improves treatment, and eventually makes complete local cleanup possible. It does not remove an outbreak by itself."
black_plague_rat_infestation_label: "Rat Infestation"
black_plague_medical_reserve_label: "Medical Reserve"
black_plague_medical_reserve_value: "[?black_plague_medical_reserve|0] / [?black_plague_medical_reserve_capacity|0]"
black_plague_cleanup_attempts_label: "Completed Cleanup Operations"
black_plague_persistent_response_burden: "Sustained Plague Response"
black_plague_persistent_response_burden_desc: "Factories, transport, personnel, consumer goods, and local authority remain committed to active plague measures and protected Medical Reserve storage."
black_plague_sealed_food_stores: "Sealed Food Stores"
black_plague_sealed_food_stores_desc: "Granaries, warehouses, and ration depots are under guarded vermin-control procedures."
black_plague_transport_purge: "Purged Rail Yards and Docks"
black_plague_transport_purge_desc: "Cargo sheds, rolling stock, and dockside stores are repeatedly searched and cleared."
black_plague_quarantine_state: "Plague Quarantine"
black_plague_quarantine_state_desc: "Movement and supply are restricted while health teams isolate active districts."
black_plague_cordon_state: "Army Cordon"
black_plague_cordon_state_desc: "Military checkpoints and perimeter patrols enforce the containment line."

# Medical reserve production
black_plague_produce_medical_reserve: "Assemble Medical Reserve"
black_plague_produce_medical_reserve_desc: "Divert protected production, transport, and trained personnel into a capped national stock of field medicines, protective stores, disinfectants, and clinical supplies. Holding at least [?constant:black_plague_medical_reserve.first_response_minimum_reserve|0] Medical Reserve lowers the displayed population-scaled cost of the first response mobilized in each state to [?constant:black_plague_medical_reserve.first_response_cost_factor|%0] of normal. Rat clearing, vector control, hospitals, treatment distribution, and liberated-warren work also draw directly from this reserve. Stockpiles above [?constant:black_plague_medical_reserve.upkeep_threshold_one|0] and [?constant:black_plague_medical_reserve.upkeep_threshold_two|0] progressively divert consumer goods into storage, rotation, and inspection."
black_plague_produce_medical_reserve_cost: "£manpower_texticon §Y[?constant:black_plague_medical_reserve_cost.manpower|0]§!  £support_equipment_text_icon §Y[?constant:black_plague_medical_reserve_cost.support_equipment|0]§!  £motorized_equipment_text_icon §Y[?constant:black_plague_medical_reserve_cost.motorized_equipment|0]§!  £GFX_fuel_texticon §Y[?constant:black_plague_medical_reserve_cost.fuel|0]§!  £civ_factory §Y[?constant:black_plague_medical_reserve_cost.civilian_factories|0]§!"
black_plague_produce_medical_reserve_cost_blocked: "£manpower_texticon §R[?constant:black_plague_medical_reserve_cost.manpower|0]§!  £support_equipment_text_icon §R[?constant:black_plague_medical_reserve_cost.support_equipment|0]§!  £motorized_equipment_text_icon §R[?constant:black_plague_medical_reserve_cost.motorized_equipment|0]§!  £GFX_fuel_texticon §R[?constant:black_plague_medical_reserve_cost.fuel|0]§!  £civ_factory §R[?constant:black_plague_medical_reserve_cost.civilian_factories|0]§!"
black_plague_produce_medical_reserve_cost_tooltip: "Spend the displayed resources and assign [?constant:black_plague_medical_reserve_cost.civilian_factories|0] civilian factories plus [?constant:black_plague_medical_reserve_cost.response_burden|0] response capacity for [?constant:black_plague_medical_reserve_cost.duration_days|0] days. The batch must fit entirely below the current reserve cap."
black_plague_produce_medical_reserve_start_tt: "Protected factories and depots begin assembling a medical-reserve batch."
black_plague_produce_medical_reserve_complete_tt: "Adds the committed batch of §G[?black_plague_medical_reserve_active_batch|0]§! Medical Reserve. Emergency Production knowledge raises future batch output."

# Clean city rats
black_plague_clean_city_rats: "Clean the City of Rats"
black_plague_clean_city_rats_desc: "Send municipal crews through the selected urban state to trap colonies, clear refuse, and strip nesting sites. Sealed food stores, flea control, and purged transport hubs turn the sweep into a supported clearance; without them, frightened colonies can scatter into a neighboring state. Each repeated sweep must reach deeper warrens and costs more, up to twice the first operation."
black_plague_clean_city_rats_cost: "£manpower_texticon §Y[?FROM.black_plague_quote_clean_rats_manpower|0]§!  £support_equipment_text_icon §Y[?FROM.black_plague_quote_clean_rats_support|0]§!  £motorized_equipment_text_icon §Y[?FROM.black_plague_quote_clean_rats_motorized|0]§!  £GFX_fuel_texticon §Y[?FROM.black_plague_quote_clean_rats_fuel|0]§!  Medical Reserve §Y[?FROM.black_plague_quote_clean_rats_medical_reserve|0]§!  £stability_texticon §Y[?constant:black_plague_response_cost_clean_city_rats.stability|%0]§!  £civ_factory §Y[?constant:black_plague_response_factories.clean_city_rats|0]§!"
black_plague_clean_city_rats_cost_blocked: "£manpower_texticon §R[?FROM.black_plague_quote_clean_rats_manpower|0]§!  £support_equipment_text_icon §R[?FROM.black_plague_quote_clean_rats_support|0]§!  £motorized_equipment_text_icon §R[?FROM.black_plague_quote_clean_rats_motorized|0]§!  £GFX_fuel_texticon §R[?FROM.black_plague_quote_clean_rats_fuel|0]§!  Medical Reserve §R[?FROM.black_plague_quote_clean_rats_medical_reserve|0]§!  £stability_texticon §R[?constant:black_plague_response_cost_clean_city_rats.stability|%0]§!  £civ_factory §R[?constant:black_plague_response_factories.clean_city_rats|0]§!"
black_plague_clean_city_rats_cost_tooltip: "Spend the displayed population- and repeat-scaled personnel, support equipment, trucks, fuel, Medical Reserve, and stability. Assign [?constant:black_plague_response_factories.clean_city_rats|0] civilian factories and [?constant:black_plague_response_burden.clean_city_rats|0] response capacity for [?constant:black_plague_response_duration.clean_city_rats|0] days."
black_plague_clean_city_rats_start_tt: "The rat-clearance sweep begins in the selected state."
black_plague_clean_city_rats_complete_tt: "Reduces Rat Infestation. A supported sweep also reduces plague load, spread, and mortality and raises containment; an unsupported sweep has weaker effects and may drive exposure across the border."

# Seal food stores
black_plague_seal_food_stores: "Seal Food Stores"
black_plague_seal_food_stores_desc: "Harden granaries, warehouses, ration depots, and market cellars in the selected state. The work suppresses rat access and lowers future exposure, but guarded storage reduces local resource and supply throughput while it remains active."
black_plague_seal_food_stores_cost: "£manpower_texticon §Y[?FROM.black_plague_quote_seal_stores_manpower|0]§!  £support_equipment_text_icon §Y[?FROM.black_plague_quote_seal_stores_support|0]§!  £motorized_equipment_text_icon §Y[?FROM.black_plague_quote_seal_stores_motorized|0]§!  £GFX_fuel_texticon §Y[?FROM.black_plague_quote_seal_stores_fuel|0]§!  £stability_texticon §Y[?constant:black_plague_response_cost_seal_food_stores.stability|%0]§!  £civ_factory §Y[?constant:black_plague_response_factories.seal_food_stores|0]§!"
black_plague_seal_food_stores_cost_blocked: "£manpower_texticon §R[?FROM.black_plague_quote_seal_stores_manpower|0]§!  £support_equipment_text_icon §R[?FROM.black_plague_quote_seal_stores_support|0]§!  £motorized_equipment_text_icon §R[?FROM.black_plague_quote_seal_stores_motorized|0]§!  £GFX_fuel_texticon §R[?FROM.black_plague_quote_seal_stores_fuel|0]§!  £stability_texticon §R[?constant:black_plague_response_cost_seal_food_stores.stability|%0]§!  £civ_factory §R[?constant:black_plague_response_factories.seal_food_stores|0]§!"
black_plague_seal_food_stores_cost_tooltip: "Spend the displayed state-scaled resources. Assign [?constant:black_plague_response_factories.seal_food_stores|0] civilian factories and [?constant:black_plague_response_burden.seal_food_stores|0] response capacity for [?constant:black_plague_response_duration.seal_food_stores|0] days."
black_plague_seal_food_stores_start_tt: "Storehouses and ration depots are placed under guarded sealing orders."
black_plague_seal_food_stores_complete_tt: "Reduces infestation, spread pressure, incoming exposure, and relapse risk, then sustains weekly vermin suppression for [?constant:black_plague_response_duration.seal_food_stores_sustain|0] days."

# Sewers and burrows
black_plague_clear_sewers_and_burrows: "Clear Sewers and Burrows"
black_plague_clear_sewers_and_burrows_desc: "Open the selected state's drains, tunnels, culverts, and buried service corridors. Engineers will destroy deep nests at the cost of infrastructure damage. Entrenched infestations cannot be fully cleared without an army cordon."
black_plague_clear_sewers_and_burrows_cost: "£manpower_texticon §Y[?FROM.black_plague_quote_clear_sewers_manpower|0]§!  £support_equipment_text_icon §Y[?FROM.black_plague_quote_clear_sewers_support|0]§!  £motorized_equipment_text_icon §Y[?FROM.black_plague_quote_clear_sewers_motorized|0]§!  £GFX_fuel_texticon §Y[?FROM.black_plague_quote_clear_sewers_fuel|0]§!  £stability_texticon §Y[?constant:black_plague_response_cost_clear_sewers.stability|%0]§!  £civ_factory §Y[?constant:black_plague_response_factories.clear_sewers|0]§!"
black_plague_clear_sewers_and_burrows_cost_blocked: "£manpower_texticon §R[?FROM.black_plague_quote_clear_sewers_manpower|0]§!  £support_equipment_text_icon §R[?FROM.black_plague_quote_clear_sewers_support|0]§!  £motorized_equipment_text_icon §R[?FROM.black_plague_quote_clear_sewers_motorized|0]§!  £GFX_fuel_texticon §R[?FROM.black_plague_quote_clear_sewers_fuel|0]§!  £stability_texticon §R[?constant:black_plague_response_cost_clear_sewers.stability|%0]§!  £civ_factory §R[?constant:black_plague_response_factories.clear_sewers|0]§!"
black_plague_clear_sewers_and_burrows_cost_tooltip: "Spend the displayed state-scaled resources. Assign [?constant:black_plague_response_factories.clear_sewers|0] civilian factories and [?constant:black_plague_response_burden.clear_sewers|0] response capacity for [?constant:black_plague_response_duration.clear_sewers|0] days."
black_plague_clear_sewers_and_burrows_start_tt: "Engineering crews enter the sewer and burrow network."
black_plague_clear_sewers_and_burrows_complete_tt: "Damages infrastructure and reduces infestation, plague load, spread, and relapse pressure. A deeply entrenched colony without a cordon yields only a partial clearance and raises relapse risk."

# Flea control
black_plague_flea_shelter_bedding_control: "Flea Control in Shelters and Bedding"
black_plague_flea_shelter_bedding_control_desc: "Treat barracks, shelters, hospitals, bedding stores, and crowded housing in the selected state. The campaign attacks the vector around patients and refugees instead of promising an immediate cure."
black_plague_flea_shelter_bedding_control_cost: "£manpower_texticon §Y[?FROM.black_plague_quote_flea_control_manpower|0]§!  £support_equipment_text_icon §Y[?FROM.black_plague_quote_flea_control_support|0]§!  £motorized_equipment_text_icon §Y[?FROM.black_plague_quote_flea_control_motorized|0]§!  £GFX_fuel_texticon §Y[?FROM.black_plague_quote_flea_control_fuel|0]§!  Medical Reserve §Y[?FROM.black_plague_quote_flea_control_medical_reserve|0]§!  £civ_factory §Y[?constant:black_plague_response_factories.flea_control|0]§!"
black_plague_flea_shelter_bedding_control_cost_blocked: "£manpower_texticon §R[?FROM.black_plague_quote_flea_control_manpower|0]§!  £support_equipment_text_icon §R[?FROM.black_plague_quote_flea_control_support|0]§!  £motorized_equipment_text_icon §R[?FROM.black_plague_quote_flea_control_motorized|0]§!  £GFX_fuel_texticon §R[?FROM.black_plague_quote_flea_control_fuel|0]§!  Medical Reserve §R[?FROM.black_plague_quote_flea_control_medical_reserve|0]§!  £civ_factory §R[?constant:black_plague_response_factories.flea_control|0]§!"
black_plague_flea_shelter_bedding_control_cost_tooltip: "Spend the displayed state-scaled resources. Assign [?constant:black_plague_response_factories.flea_control|0] civilian factories and [?constant:black_plague_response_burden.flea_control|0] response capacity for [?constant:black_plague_response_duration.flea_control|0] days."
black_plague_flea_shelter_bedding_control_start_tt: "Vector-control teams begin work in shelters, wards, and barracks."
black_plague_flea_shelter_bedding_control_complete_tt: "Reduces mortality pressure, plague load, infestation, and relapse risk while raising treatment coverage. The local program continues for [?constant:black_plague_response_duration.flea_control_sustain|0] days."

# Transport purge
black_plague_purge_rail_yards_and_docks: "Purge Rail Yards and Docks"
black_plague_purge_rail_yards_and_docks_desc: "Stop and strip cargo in the selected transport state, clear warehouses, fumigate rolling stock, and inspect dockside storage. The purge sharply reduces transport and port transmission while constraining supply and movement."
black_plague_purge_rail_yards_and_docks_cost: "£manpower_texticon §Y[?FROM.black_plague_quote_transport_purge_manpower|0]§!  £support_equipment_text_icon §Y[?FROM.black_plague_quote_transport_purge_support|0]§!  £motorized_equipment_text_icon §Y[?FROM.black_plague_quote_transport_purge_motorized|0]§!  £GFX_train_texticon §Y[?FROM.black_plague_quote_transport_purge_trains|0]§!  £convoy_texticon §Y[?FROM.black_plague_quote_transport_purge_convoys|0]§!  £GFX_fuel_texticon §Y[?FROM.black_plague_quote_transport_purge_fuel|0]§!  £command_power §Y[?constant:black_plague_response_cost_purge_transport.command_power|0]§!  £GFX_war_support_icon §Y[?constant:black_plague_response_cost_purge_transport.war_support|%0]§!"
black_plague_purge_rail_yards_and_docks_cost_blocked: "£manpower_texticon §R[?FROM.black_plague_quote_transport_purge_manpower|0]§!  £support_equipment_text_icon §R[?FROM.black_plague_quote_transport_purge_support|0]§!  £motorized_equipment_text_icon §R[?FROM.black_plague_quote_transport_purge_motorized|0]§!  £GFX_train_texticon §R[?FROM.black_plague_quote_transport_purge_trains|0]§!  £convoy_texticon §R[?FROM.black_plague_quote_transport_purge_convoys|0]§!  £GFX_fuel_texticon §R[?FROM.black_plague_quote_transport_purge_fuel|0]§!  £command_power §R[?constant:black_plague_response_cost_purge_transport.command_power|0]§!  £GFX_war_support_icon §R[?constant:black_plague_response_cost_purge_transport.war_support|%0]§!"
black_plague_purge_rail_yards_and_docks_cost_tooltip: "Spend the displayed resources and assign [?constant:black_plague_response_factories.purge_transport|0] civilian factories plus [?constant:black_plague_response_burden.purge_transport|0] response capacity for [?constant:black_plague_response_duration.purge_transport|0] days. Convoys are required only for a coastal target."
black_plague_purge_rail_yards_and_docks_start_tt: "Rail and port traffic is halted for a systematic purge."
black_plague_purge_rail_yards_and_docks_complete_tt: "Reduces infestation, spread, exposure, and relapse risk. For [?constant:black_plague_response_duration.purge_transport_sustain|0] days, internal transport and port transmission are sharply suppressed."

# Demolition
black_plague_demolish_infested_blocks: "Demolish Lost Blocks"
black_plague_demolish_infested_blocks_desc: "Destroy districts that cannot be reclaimed by ordinary clearance. This irreversible operation requires quarantine, an army cordon, prior cleanup attempts, and a screened neighboring state for displaced civilians. If screening or the cordon fails before completion, the operation still ends in destruction but disperses infection."
black_plague_demolish_infested_blocks_cost: "£manpower_texticon §Y[?FROM.black_plague_quote_demolition_manpower|0]§!  £support_equipment_text_icon §Y[?FROM.black_plague_quote_demolition_support|0]§!  £motorized_equipment_text_icon §Y[?FROM.black_plague_quote_demolition_motorized|0]§!  £GFX_train_texticon §Y[?FROM.black_plague_quote_demolition_trains|0]§!  £GFX_fuel_texticon §Y[?FROM.black_plague_quote_demolition_fuel|0]§!  £command_power §Y[?constant:black_plague_response_cost_demolish_lost_blocks.command_power|0]§!  £stability_texticon §Y[?constant:black_plague_response_cost_demolish_lost_blocks.stability|%0]§!  £GFX_war_support_icon §Y[?constant:black_plague_response_cost_demolish_lost_blocks.war_support|%0]§!"
black_plague_demolish_infested_blocks_cost_blocked: "£manpower_texticon §R[?FROM.black_plague_quote_demolition_manpower|0]§!  £support_equipment_text_icon §R[?FROM.black_plague_quote_demolition_support|0]§!  £motorized_equipment_text_icon §R[?FROM.black_plague_quote_demolition_motorized|0]§!  £GFX_train_texticon §R[?FROM.black_plague_quote_demolition_trains|0]§!  £GFX_fuel_texticon §R[?FROM.black_plague_quote_demolition_fuel|0]§!  £command_power §R[?constant:black_plague_response_cost_demolish_lost_blocks.command_power|0]§!  £stability_texticon §R[?constant:black_plague_response_cost_demolish_lost_blocks.stability|%0]§!  £GFX_war_support_icon §R[?constant:black_plague_response_cost_demolish_lost_blocks.war_support|%0]§!"
black_plague_demolish_infested_blocks_cost_tooltip: "Spend the displayed resources. Assign [?constant:black_plague_response_factories.demolish_lost_blocks|0] civilian factories and [?constant:black_plague_response_burden.demolish_lost_blocks|0] response capacity for [?constant:black_plague_response_duration.demolish_lost_blocks|0] days. This can be attempted only once in a plague episode."
black_plague_demolish_infested_blocks_start_tt: "Evacuation screening begins as demolition teams seal the lost blocks."
black_plague_demolish_infested_blocks_complete_tt: "Damages infrastructure and factories, raises resistance, lowers compliance, and displaces civilians. A preserved cordon and screened receiving state yield a major reduction in infestation and disease pressure; failure spreads exposure into the receiving state and gives only partial control."

# Hospitals
black_plague_emergency_hospitals: "Build Emergency Plague Hospitals"
black_plague_emergency_hospitals_desc: "Convert accessible facilities in the selected state into dedicated isolation wards and treatment stations. The hospitals commit factories and response capacity while operating and generate field findings for the national countermeasure program."
black_plague_emergency_hospitals_accelerated: "Build Emergency Plague Hospitals Rapidly"
black_plague_emergency_hospitals_accelerated_desc: "Use the countermeasure program's emergency-production doctrine to convert the selected state's facilities in [?constant:black_plague_response_duration.emergency_hospitals_accelerated|0] days. The network retains the full material, Medical Reserve, factory, and continuing response burden of the standard hospital program."
black_plague_emergency_hospitals_cost: "£manpower_texticon §Y[?FROM.black_plague_quote_hospital_manpower|0]§!  £support_equipment_text_icon §Y[?FROM.black_plague_quote_hospital_support|0]§!  £motorized_equipment_text_icon §Y[?FROM.black_plague_quote_hospital_motorized|0]§!  £GFX_train_texticon §Y[?FROM.black_plague_quote_hospital_trains|0]§!  £GFX_fuel_texticon §Y[?FROM.black_plague_quote_hospital_fuel|0]§!  Medical Reserve §Y[?FROM.black_plague_quote_hospital_medical_reserve|0]§!  £civ_factory §Y[?constant:black_plague_response_factories.emergency_hospitals_setup|0]§!"
black_plague_emergency_hospitals_cost_blocked: "£manpower_texticon §R[?FROM.black_plague_quote_hospital_manpower|0]§!  £support_equipment_text_icon §R[?FROM.black_plague_quote_hospital_support|0]§!  £motorized_equipment_text_icon §R[?FROM.black_plague_quote_hospital_motorized|0]§!  £GFX_train_texticon §R[?FROM.black_plague_quote_hospital_trains|0]§!  £GFX_fuel_texticon §R[?FROM.black_plague_quote_hospital_fuel|0]§!  Medical Reserve §R[?FROM.black_plague_quote_hospital_medical_reserve|0]§!  £civ_factory §R[?constant:black_plague_response_factories.emergency_hospitals_setup|0]§!"
black_plague_emergency_hospitals_cost_tooltip: "Spend the displayed state-scaled resources. Assign [?constant:black_plague_response_factories.emergency_hospitals_setup|0] civilian factories and [?constant:black_plague_response_burden.emergency_hospitals_setup|0] response capacity for [?constant:black_plague_response_duration.emergency_hospitals|0] days. An operating hospital then sustains [?constant:black_plague_response_factories.emergency_hospitals_persistent|0] factories and [?constant:black_plague_response_burden.emergency_hospitals_persistent|0] response capacity."
black_plague_emergency_hospitals_accelerated_cost: "£manpower_texticon §Y[?FROM.black_plague_quote_hospital_manpower|0]§!  £support_equipment_text_icon §Y[?FROM.black_plague_quote_hospital_support|0]§!  £motorized_equipment_text_icon §Y[?FROM.black_plague_quote_hospital_motorized|0]§!  £GFX_train_texticon §Y[?FROM.black_plague_quote_hospital_trains|0]§!  £GFX_fuel_texticon §Y[?FROM.black_plague_quote_hospital_fuel|0]§!  Medical Reserve §Y[?FROM.black_plague_quote_hospital_medical_reserve|0]§!  £civ_factory §Y[?constant:black_plague_response_factories.emergency_hospitals_setup|0]§!"
black_plague_emergency_hospitals_accelerated_cost_blocked: "£manpower_texticon §R[?FROM.black_plague_quote_hospital_manpower|0]§!  £support_equipment_text_icon §R[?FROM.black_plague_quote_hospital_support|0]§!  £motorized_equipment_text_icon §R[?FROM.black_plague_quote_hospital_motorized|0]§!  £GFX_train_texticon §R[?FROM.black_plague_quote_hospital_trains|0]§!  £GFX_fuel_texticon §R[?FROM.black_plague_quote_hospital_fuel|0]§!  Medical Reserve §R[?FROM.black_plague_quote_hospital_medical_reserve|0]§!  £civ_factory §R[?constant:black_plague_response_factories.emergency_hospitals_setup|0]§!"
black_plague_emergency_hospitals_accelerated_cost_tooltip: "Spend the displayed state-scaled resources. Emergency-production doctrine assigns [?constant:black_plague_response_factories.emergency_hospitals_setup|0] civilian factories and [?constant:black_plague_response_burden.emergency_hospitals_setup|0] response capacity for [?constant:black_plague_response_duration.emergency_hospitals_accelerated|0] days. An operating hospital then sustains [?constant:black_plague_response_factories.emergency_hospitals_persistent|0] factories and [?constant:black_plague_response_burden.emergency_hospitals_persistent|0] response capacity."
black_plague_emergency_hospitals_start_tt: "Accessible buildings are requisitioned for plague wards."
black_plague_emergency_hospitals_accelerated_start_tt: "Emergency-production doctrine compresses hospital construction to [?constant:black_plague_response_duration.emergency_hospitals_accelerated|0] days."
black_plague_emergency_hospitals_complete_tt: "Raises treatment and containment, lowers mortality and plague load, and records countermeasure findings. The hospital remains active until access is lost, the state collapses, or the local outbreak ends."

# Quarantine
black_plague_establish_quarantine: "Establish State Quarantine"
black_plague_establish_quarantine_desc: "Close civilian routes around the selected state and impose monitored isolation. A supported quarantine sharply limits exposure and spread; if access collapses, isolation can deepen mortality. Contained states shift to monitoring before reopening in Recovery."
black_plague_establish_quarantine_cost: "£manpower_texticon §Y[?FROM.black_plague_quote_quarantine_manpower|0]§!  £support_equipment_text_icon §Y[?FROM.black_plague_quote_quarantine_support|0]§!  £motorized_equipment_text_icon §Y[?FROM.black_plague_quote_quarantine_motorized|0]§!  £GFX_fuel_texticon §Y[?FROM.black_plague_quote_quarantine_fuel|0]§!  £command_power §Y[?constant:black_plague_response_cost_quarantine.command_power|0]§!  £stability_texticon §Y[?constant:black_plague_response_cost_quarantine.stability|%0]§!  £GFX_war_support_icon §Y[?constant:black_plague_response_cost_quarantine.war_support|%0]§!"
black_plague_establish_quarantine_cost_blocked: "£manpower_texticon §R[?FROM.black_plague_quote_quarantine_manpower|0]§!  £support_equipment_text_icon §R[?FROM.black_plague_quote_quarantine_support|0]§!  £motorized_equipment_text_icon §R[?FROM.black_plague_quote_quarantine_motorized|0]§!  £GFX_fuel_texticon §R[?FROM.black_plague_quote_quarantine_fuel|0]§!  £command_power §R[?constant:black_plague_response_cost_quarantine.command_power|0]§!  £stability_texticon §R[?constant:black_plague_response_cost_quarantine.stability|%0]§!  £GFX_war_support_icon §R[?constant:black_plague_response_cost_quarantine.war_support|%0]§!"
black_plague_establish_quarantine_cost_tooltip: "Spend the displayed resources. Assign [?constant:black_plague_response_factories.quarantine_setup|0] civilian factories and [?constant:black_plague_response_burden.quarantine|0] response capacity for [?constant:black_plague_response_duration.quarantine|0] days; the same response capacity remains committed while quarantine is active."
black_plague_establish_quarantine_start_tt: "Civilian movement is restricted around the selected state."
black_plague_establish_quarantine_complete_tt: "Raises containment and reduces spread, incoming exposure, and infestation. The quarantine remains active through the dangerous phases, shifts to monitoring under Containment, and ends in Recovery or Cured."

# Cordon
black_plague_raise_army_cordon: "Raise an Army Cordon"
black_plague_raise_army_cordon_desc: "Commit organized troops and military stores to checkpoints around the selected infected state. The cordon provides the strongest local spread control and supports difficult cleanup, but it consumes supply, movement capacity, and construction effort while maintained."
black_plague_raise_army_cordon_cost: "£manpower_texticon §Y[?FROM.black_plague_quote_cordon_manpower|0]§!  £infantry_equipment_text_icon §Y[?FROM.black_plague_quote_cordon_infantry|0]§!  £support_equipment_text_icon §Y[?FROM.black_plague_quote_cordon_support|0]§!  £motorized_equipment_text_icon §Y[?FROM.black_plague_quote_cordon_motorized|0]§!  £GFX_fuel_texticon §Y[?FROM.black_plague_quote_cordon_fuel|0]§!  £command_power §Y[?constant:black_plague_response_cost_cordon.command_power|0]§!  £stability_texticon §Y[?constant:black_plague_response_cost_cordon.stability|%0]§!  £GFX_war_support_icon §Y[?constant:black_plague_response_cost_cordon.war_support|%0]§!"
black_plague_raise_army_cordon_cost_blocked: "£manpower_texticon §R[?FROM.black_plague_quote_cordon_manpower|0]§!  £infantry_equipment_text_icon §R[?FROM.black_plague_quote_cordon_infantry|0]§!  £support_equipment_text_icon §R[?FROM.black_plague_quote_cordon_support|0]§!  £motorized_equipment_text_icon §R[?FROM.black_plague_quote_cordon_motorized|0]§!  £GFX_fuel_texticon §R[?FROM.black_plague_quote_cordon_fuel|0]§!  £command_power §R[?constant:black_plague_response_cost_cordon.command_power|0]§!  £stability_texticon §R[?constant:black_plague_response_cost_cordon.stability|%0]§!  £GFX_war_support_icon §R[?constant:black_plague_response_cost_cordon.war_support|%0]§!"
black_plague_raise_army_cordon_cost_tooltip: "Spend the displayed resources and keep a sufficiently strong, organized division in the state. Assign [?constant:black_plague_response_factories.cordon_setup|0] civilian factories and [?constant:black_plague_response_burden.cordon|0] response capacity for [?constant:black_plague_response_duration.cordon|0] days; the response burden persists while the cordon is active."
black_plague_raise_army_cordon_start_tt: "Troops begin closing roads, crossings, and freight approaches."
black_plague_raise_army_cordon_complete_tt: "Greatly raises containment and reduces spread, exposure, and infestation. The cordon persists until Recovery, Cured, loss of control, or loss of the containment force."

# Treatment reserves
black_plague_distribute_treatment_reserves: "Distribute Treatment Reserves"
black_plague_distribute_treatment_reserves_desc: "Move protected medical stores, transport, and staff into the selected state. The short operation expands treatment coverage and suppresses mortality without erasing the outbreak."
black_plague_distribute_treatment_reserves_cost: "£manpower_texticon §Y[?FROM.black_plague_quote_treatment_manpower|0]§!  £support_equipment_text_icon §Y[?FROM.black_plague_quote_treatment_support|0]§!  £motorized_equipment_text_icon §Y[?FROM.black_plague_quote_treatment_motorized|0]§!  £GFX_fuel_texticon §Y[?FROM.black_plague_quote_treatment_fuel|0]§!  Medical Reserve §Y[?FROM.black_plague_quote_treatment_medical_reserve|0]§!  £civ_factory §Y[?constant:black_plague_response_factories.treatment_reserves|0]§!"
black_plague_distribute_treatment_reserves_cost_blocked: "£manpower_texticon §R[?FROM.black_plague_quote_treatment_manpower|0]§!  £support_equipment_text_icon §R[?FROM.black_plague_quote_treatment_support|0]§!  £motorized_equipment_text_icon §R[?FROM.black_plague_quote_treatment_motorized|0]§!  £GFX_fuel_texticon §R[?FROM.black_plague_quote_treatment_fuel|0]§!  Medical Reserve §R[?FROM.black_plague_quote_treatment_medical_reserve|0]§!  £civ_factory §R[?constant:black_plague_response_factories.treatment_reserves|0]§!"
black_plague_distribute_treatment_reserves_cost_tooltip: "Spend the displayed state-scaled resources. Assign [?constant:black_plague_response_factories.treatment_reserves|0] civilian factory and [?constant:black_plague_response_burden.treatment_reserves|0] response capacity for [?constant:black_plague_response_duration.treatment_reserves|0] days."
black_plague_distribute_treatment_reserves_start_tt: "Protected treatment convoys depart for the selected state."
black_plague_distribute_treatment_reserves_complete_tt: "Lowers mortality, plague load, and relapse risk while raising treatment coverage and containment. Relief remains active for [?constant:black_plague_response_duration.treatment_relief_duration|0] days."

# Liberated warrens
black_plague_purge_liberated_warrens: "Purge Liberated Warrens"
black_plague_purge_liberated_warrens_desc: "Return organized troops and engineers to a state once ruled by a brood. Buried chambers, food caches, and contaminated tunnels must be cleared before civil recovery can take hold."
black_plague_purge_liberated_warrens_cost: "£manpower_texticon §Y[?FROM.black_plague_quote_warren_purge_manpower|0]§!  £infantry_equipment_text_icon §Y[?FROM.black_plague_quote_warren_purge_infantry|0]§!  £support_equipment_text_icon §Y[?FROM.black_plague_quote_warren_purge_support|0]§!  £motorized_equipment_text_icon §Y[?FROM.black_plague_quote_warren_purge_motorized|0]§!  £GFX_train_texticon §Y[?FROM.black_plague_quote_warren_purge_trains|0]§!  £GFX_fuel_texticon §Y[?FROM.black_plague_quote_warren_purge_fuel|0]§!  Medical Reserve §Y[?FROM.black_plague_quote_warren_purge_medical_reserve|0]§!  £command_power §Y[?constant:black_plague_response_cost_purge_liberated_warrens.command_power|0]§!  £stability_texticon §Y[?constant:black_plague_response_cost_purge_liberated_warrens.stability|%0]§!  £GFX_war_support_icon §Y[?constant:black_plague_response_cost_purge_liberated_warrens.war_support|%0]§!"
