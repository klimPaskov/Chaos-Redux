black_plague_request_doctor_wu_access_cost_tooltip: "$black_plague_request_doctor_wu_access_cost$\n£clock_texticon §Y[?constant:doctor_wu_access.request_duration_days|0]§!"
black_plague_request_doctor_wu_access_start_tt: "A [?constant:doctor_wu_access.request_duration_days|0]-day request is sent to the current Doctor Wu host. If accepted, the selected state receives bounded clinical support."

