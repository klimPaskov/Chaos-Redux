gods_of_africa_strength_tooltip: "Gods of Africa Strength: [?global.gods_of_africa_strength|0]. Current band: [GetGodsOfAfricaStrengthBand]. This global value limits the practical ceiling of African punishment."
gods_of_africa_wrath_quiet: "Calm"
gods_of_africa_wrath_watchful: "Watchful"
gods_of_africa_wrath_angered: "Angered"
