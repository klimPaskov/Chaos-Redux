gods_of_africa_focus_reveal: "The Gods of Africa path opens after Evolution I and the consolidation milestone."
gods_of_africa_focus_overlay: "Gods of Africa"
gods_of_africa_focus_prepare_proclamation: "Prepare the Continental Proclamation"
gods_of_africa_focus_prepare_proclamation_desc: "Organize the voices, offices, and records needed for a credible continental proclamation."
gods_of_africa_focus_office_voices: "Establish the Office of the Voices"
gods_of_africa_focus_office_voices_desc: "Create a durable African institution for demands, receipts, protection, and remembered conduct."
gods_of_africa_focus_measure_needs: "Measure the Needs of the Continent"
gods_of_africa_focus_measure_needs_desc: "Respond to mounting strain before an emergency becomes severe."
gods_of_africa_focus_continental_arsenals: "Raise the Continental Arsenals"
gods_of_africa_focus_continental_arsenals_desc: "Build the stockpile and distribution capacity needed to receive and use material tribute."
gods_of_africa_focus_rails_ports_fuel: "Rails, Ports, and Fuel"
gods_of_africa_focus_rails_ports_fuel_desc: "Protection can send [?constant:gods_of_africa_transaction.transport_amount|0] convoys or trains to a partner with a shortage while Africa keeps more than [?constant:gods_of_africa_protection.transport_host_stockpile_minimum|0] in reserve."
gods_of_africa_focus_continental_reserve: "Create the Continental Reserve"
gods_of_africa_focus_continental_reserve_desc: "Hold a measured strategic reserve for emergencies and reliable partners."
gods_of_africa_focus_recognize_voice: "Recognize the Continental Voice"
gods_of_africa_focus_recognize_voice_desc: "Turn recognition into a precise obligation that can be accepted, delayed, or refused."
gods_of_africa_focus_return_soil: "Demand the Return of African Soil"
gods_of_africa_focus_return_soil_desc: "Name the occupied African states and tie withdrawal to a visible settlement."
gods_of_africa_focus_end_sponsorship: "End Foreign Sponsorship"
gods_of_africa_focus_end_sponsorship_desc: "Record and challenge the aid, bases, and guarantees that sustain Africa's enemies."
gods_of_africa_focus_security_oaths: "Swear Continental Security Oaths"
gods_of_africa_focus_security_oaths_desc: "Protection can grant military access. With La Résistance, an agency in each country, and Africa at war, it shares [GetGodsOfAfricaProtectionIntelAmount] points of every intelligence type on current enemies the partner is not fighting."
gods_of_africa_focus_shelter_faithful: "Shelter the Faithful"
gods_of_africa_focus_shelter_faithful_desc: "Protection can establish shelter and medical reception capacity in an eligible partner capital without moving its population."
gods_of_africa_focus_relief_beyond: "Relief Beyond the Continent"
gods_of_africa_focus_relief_beyond_desc: "Protection can improve a partner's stability and an eligible capital's infrastructure. With an open recovery card and mission slot, the partner may also receive a Relief Convoy through the separate Foreign Disaster Relief choice, at its listed price."
gods_of_africa_focus_expedition: "The African Expedition"
gods_of_africa_focus_expedition_desc: "Each protection pledge can strengthen the partner's war support alongside its real equipment and fuel shipment."
gods_of_africa_focus_final_council: "A Place at the Final Council"
gods_of_africa_focus_final_council_desc: "Record each country's standing when the continent's final settlement is complete."
gods_of_africa_focus_record_refusal: "Record Every Refusal"
gods_of_africa_focus_record_refusal_desc: "Preserve the evidence of failed demands without pretending that memory alone creates power."
gods_of_africa_focus_reach_beyond_coast: "Reach Beyond the Coast"
gods_of_africa_focus_reach_beyond_coast_desc: "Let the continental office pursue a proven offense beyond ordinary review, with Africa's Strength setting the ceiling."
gods_of_africa_focus_let_world_answer: "Let the World Answer"
gods_of_africa_focus_let_world_answer_desc: "Use sanctions and coalition pressure before invoking stranger consequences."
gods_of_africa_focus_hand_judgment: "The Hand of Judgment"
gods_of_africa_focus_hand_judgment_desc: "Coordinate punishment reviews so intent and capability are never confused."
gods_of_africa_focus_no_sanctuary: "Sanctuary for Reliable Partners"
gods_of_africa_focus_no_sanctuary_desc: "A protection pledge can guarantee a reliable partner and, with Arms Against Tyranny, grant mutual market access when the two countries are not at war with each other."
gods_of_africa_focus_last_sentence: "The Last Sentence"
gods_of_africa_focus_last_sentence_desc: "Prepare the rare extreme ultimatum without exceeding Africa's Strength or ignoring Wrath, Chaos, and past conduct."
gods_of_africa_focus_sacred_state: "The Sacred State"
gods_of_africa_focus_sacred_state_desc: "Treat the Gods as literal sovereign powers and accept the domestic risk of that claim."
gods_of_africa_focus_veiled_instrument: "The Veiled Instrument"
gods_of_africa_focus_veiled_instrument_desc: "Keep the source of each consequence deliberately uncertain while preserving diplomatic room."

gods_of_africa_idea_proclamation: "Continental Proclamation"
gods_of_africa_idea_proclamation_desc: "Africa's institutions can now speak with one recorded voice."
gods_of_africa_idea_voices: "Office of the Voices"
gods_of_africa_idea_voices_desc: "Demands, receipts, and warnings follow an accountable continental ledger."
gods_of_africa_idea_reserve: "Continental Reserve"
gods_of_africa_idea_reserve_desc: "Tribute becomes a real reserve for African emergencies and protection."
gods_of_africa_idea_judgment: "The Hand of Judgment"
gods_of_africa_idea_judgment_desc: "Punishment intent is kept beneath the capability supplied by Africa's Strength."

# Event 012 focus and doctrine names that are intentionally kept beside the
# relationship text so the overlay cannot silently fall back to raw keys.
gods_of_africa_focus_continental_proclamation: "The Continental Proclamation"
gods_of_africa_focus_continental_proclamation_desc: "Give the African unifier a public voice that can be answered by every major power."
gods_of_africa_focus_reciprocal_covenant: "The Reciprocal Covenant"
gods_of_africa_focus_reciprocal_covenant_desc: "Measure every demand against African need, answer partners with dependable protection, temper retaliation, and reward sustained cooperation."
gods_of_africa_focus_sovereign_exaction: "Sovereign Exaction"
gods_of_africa_focus_sovereign_exaction_desc: "Claim restitution and obedience as the price of a continent forced to defend itself; host-marked offenders draw firmer retaliation, and Favored standing requires sustained support."
gods_of_africa_focus_africa_speaks_for_itself: "Africa Speaks for Itself"
gods_of_africa_focus_africa_speaks_for_itself_desc: "Close the ordinary demand cycle and let each participant's conduct decide its place in the final council."

gods_of_africa_idea_reciprocal_covenant: "Reciprocal Covenant"
gods_of_africa_idea_reciprocal_covenant_desc: "The continent's obligations are measured, mutual, and backed by protection for dependable partners."
gods_of_africa_idea_sovereign_exaction: "Sovereign Exaction"
gods_of_africa_idea_sovereign_exaction_desc: "The continent demands restitution and obedience, while every refusal carries lasting diplomatic weight."

# Participant response and defensive preparation surfaces.
gods_of_africa_return_to_demand: "[GetGodsOfAfricaVictorReturnName]"
gods_of_africa_return_to_demand_desc: "[GetGodsOfAfricaVictorReturnDesc]"
gods_of_africa_return_to_demand_effect_tt: "[GetGodsOfAfricaVictorReturnEffect]"
gods_of_africa_prepare_defensive_defiance: "Prepare for Retaliation"
gods_of_africa_prepare_defensive_defiance_desc: "Spend political capital to ready the country for a possible African response after defiance."
gods_of_africa_prepare_defensive_defiance_effect_tt: "Political capital is spent and the country gains a short defensive preparation."
gods_of_africa_harden_stockpiles: "Harden the Stockpiles"
gods_of_africa_harden_stockpiles_desc: "Protect essential reserves against disruption while permanent defiance remains active."
gods_of_africa_harden_stockpiles_effect_tt: "Political capital is spent to harden stockpiles, improving stability against the next response."
gods_of_africa_secure_transport: "Secure Transport"
gods_of_africa_secure_transport_desc: "Protect the rail, road, and convoy routes that keep a defiant country supplied."
gods_of_africa_secure_transport_effect_tt: "Political capital is spent to secure transport, improving war support against the next response."
gods_of_africa_prepare_countermeasures: "Prepare Countermeasures"
gods_of_africa_prepare_countermeasures_desc: "Organize civil and military countermeasures before retaliation or protection duties arrive."
gods_of_africa_prepare_countermeasures_effect_tt: "Political capital is spent to prepare countermeasures, improving stability and war support."

# Host priorities and acceptance actions.
gods_of_africa_prioritize_land: "Prioritize Land Equipment"
gods_of_africa_prioritize_land_desc: "Ask the council to seek land equipment first when several valid needs compete."
gods_of_africa_prioritize_land_effect_tt: "Future demand selection gives land equipment the first priority when it is a valid need."
gods_of_africa_prioritize_support: "Prioritize Support Equipment"
gods_of_africa_prioritize_support_desc: "Ask the council to seek support equipment first when African field formations lack the tools to sustain their operations."
gods_of_africa_prioritize_support_effect_tt: "Future demand selection gives support equipment first priority when a maintained support-equipment need is active."
gods_of_africa_prioritize_fuel: "Prioritize Fuel"
gods_of_africa_prioritize_fuel_desc: "Ask the council to seek fuel first when several valid needs compete."
gods_of_africa_prioritize_fuel_effect_tt: "Future demand selection gives fuel the first priority when it is a valid need."
gods_of_africa_prioritize_manpower: "Prioritize Manpower"
gods_of_africa_prioritize_manpower_desc: "Ask the council to seek manpower first when several valid needs compete."
gods_of_africa_prioritize_manpower_effect_tt: "Future demand selection gives manpower the first priority when it is a valid need."
gods_of_africa_prioritize_industry: "Prioritize Industry"
gods_of_africa_prioritize_industry_desc: "Ask the council to seek industrial repair first when several valid needs compete."
gods_of_africa_prioritize_industry_effect_tt: "Future demand selection gives industrial repair the first priority when it is a valid need."
gods_of_africa_prioritize_transport: "Prioritize Transport"
gods_of_africa_prioritize_transport_desc: "Ask the council to seek trains or convoys first when African logistics are strained."
gods_of_africa_prioritize_transport_effect_tt: "Future demand selection gives transport reserves first priority when a maintained transport need is active."
gods_of_africa_prioritize_air_defense: "Prioritize Air Defense"
gods_of_africa_prioritize_air_defense_desc: "Ask the council to seek aircraft first when African air cover is under pressure."
gods_of_africa_prioritize_air_defense_effect_tt: "Future demand selection gives aircraft first priority when a maintained aircraft need is active."
gods_of_africa_prioritize_emergency: "Prioritize Emergency Relief"
gods_of_africa_prioritize_emergency_desc: "Ask the council to seek emergency political relief when the continent faces an immediate crisis."
gods_of_africa_prioritize_emergency_effect_tt: "Future demand selection gives emergency relief first priority when the maintained emergency need is active."
gods_of_africa_accept_reconciliation: "[GetGodsOfAfricaVictorAcceptName]"
gods_of_africa_accept_reconciliation_desc: "[GetGodsOfAfricaVictorAcceptDesc]"
gods_of_africa_accept_reconciliation_effect_tt: "[GetGodsOfAfricaVictorAcceptEffect]"
gods_of_africa_mark_offender: "Mark the Offender"
