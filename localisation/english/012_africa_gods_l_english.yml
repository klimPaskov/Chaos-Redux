l_english:
chaosx.nr12.601.t: "The Gods Speak Through Africa"
chaosx.nr12.601.d: "The African unifier has survived the consolidation of its institutions. Its leaders now claim to speak for the Gods of Africa, whose warnings and demands will be carried to every major power and every country that holds a place in the world's councils."
chaosx.nr12.601.a: "Let the proclamation be heard"
gods_of_africa_activation_effect_tt: "Gods of Africa is active. Africa's current Strength is [GetGodsOfAfricaStrengthBand]. Foreign governments will receive demands when a real continental need can be answered."

chaosx.nr12.602.t: "A Voice Beyond the Continent"
chaosx.nr12.602.d: "A formal notice arrives from the African unifier. The Gods of Africa now speak through its government. Their shared Strength is [GetGodsOfAfricaStrengthBand], while this government's Wrath of the Gods is [GetGodsOfAfricaWrathBand]. The relationship will endure through recurring demands, real transfers, and remembered conduct."
chaosx.nr12.602.a: "We will answer in our own way"
gods_of_africa_introduction_effect_tt: "The Gods of Africa relationship is recorded. Strength is global; Wrath belongs to this country."

chaosx.nr12.603.t: "A Demand from Africa"
chaosx.nr12.603.d: "The African unifier has issued a demand under the current continental doctrine. Its amount, deadline, and available responses are shown in the Gods of Africa category. Compliance transfers the requested resource to Africa; refusal raises Wrath and may permit a response within Africa's current Strength."
chaosx.nr12.603.a: "Read the demand"
gods_of_africa_demand_effect_tt: "Review the active demand and its deadline in the Gods of Africa category."

chaosx.nr12.604.t: "Africa Receives Our Answer"
chaosx.nr12.604.d: "Africa has received the response to its demand. The transfer, compromise, or refusal has changed the relationship, while the exact history remains known only to the governments and the voices that judge it."
chaosx.nr12.604.a: "Let the answer stand"
gods_of_africa_response_effect_tt: "The response is recorded and the next valid relationship step will follow from the relationship."

chaosx.nr12.605.t: "The Consequence of a Broken Demand"
chaosx.nr12.605.d: "A demand has failed or been refused. Africa's response is constrained by its current Strength, the target's Wrath, and the record of escalation. A weak manifestation can falter; a stronger punishment requires both capability and cause."
chaosx.nr12.605.a: "Endure the consequence"
gods_of_africa_punishment_effect_tt: "The punishment report is closed. The active demand has ended and its outcome remains part of the relationship."

chaosx.nr12.608.t: "A Place in the Final Council"
chaosx.nr12.608.d: "The African continent has secured its settlement. Ordinary Gods of Africa demands are over, and this country is remembered as [GetGodsOfAfricaSettlementName]."
chaosx.nr12.608.a: "Accept the settlement"
gods_of_africa_settlement_effect_tt: "The Gods of Africa demand cycle is closed for this country. Its conduct still shapes the final settlement."

chaosx.nr12.609.t: "A Country Defies the Gods"
chaosx.nr12.609.d: "The declaration of permanent defiance has been recorded. Ordinary demands stop, the normal friendship route closes, and punishment, protection duties, and retaliation remain possible. Reconciliation is costly and must be accepted by Africa."
chaosx.nr12.609.a: "Stand behind the declaration"
gods_of_africa_defiance_effect_tt: "Permanent defiance remains active. Ordinary demands are suspended until an accepted reconciliation is completed."

chaosx.nr12.610.t: "Africa Answers a Call for Protection"
chaosx.nr12.610.d: "The African unifier has committed a measured protection package to a reliable partner. The material cost and the obligation that follows are clear; protection gives cooperation a tangible return without creating unlimited power."
chaosx.nr12.610.a: "Receive the protection"
gods_of_africa_protection_effect_tt: "The protection package is recorded and its cooldown begins."
chaosx.nr12.611.t: "The Window Closes"
chaosx.nr12.611.d: "The reconciliation offer was not accepted before the appointed window ended. The old defiance remains in force, and the Gods remember the missed opportunity."
chaosx.nr12.611.a: "The defiance continues"
chaosx.nr12.612.t: "The Substitute Is Refused"
chaosx.nr12.612.d: "Africa has declined the proposed substitute. The refusal is not treated as a broken demand, but the original obligation remains and the extended window is now the only time left to answer it."
chaosx.nr12.612.a: "Return to the obligation"
chaosx.nr12.613.t: "The Wartime Contract Is Set Aside"
chaosx.nr12.613.d: "War has opened between this government and Africa. The active tribute contract has been cancelled rather than enforced during the conflict; the broken compact is remembered, and ordinary demands will wait until the war is over."
chaosx.nr12.613.a: "Let the wartime terms stand"
chaosx.nr12.614.t: "A Voluntary Offering Reaches Africa"
chaosx.nr12.614.d: "Africa's ledger records the shipment as help freely given during a measured continental shortage. The aid changes the balance between this government and the Gods, while the next offering remains limited by a long recovery interval."
chaosx.nr12.614.a: "Let the offering be remembered"

gods_of_africa_participant_category: "Gods of Africa"
gods_of_africa_participant_category_desc: "Strength: [?global.gods_of_africa_strength|0] ([GetGodsOfAfricaStrengthBand]). Wrath: [?gods_of_africa_wrath|0] ([GetGodsOfAfricaWrathBand]). The African unifier's recurring demands, voluntary aid, warnings, and rare offers of protection are recorded here."
gods_of_africa_host_category: "Gods of Africa — Continental Council"
gods_of_africa_host_category_desc: "Strength: [?global.gods_of_africa_strength|0] ([GetGodsOfAfricaStrengthBand]). Manage doctrine, priorities, leniency, protection, and the final settlement of each relationship."

gods_of_africa_demand_mission: "Answer the Demand"
gods_of_africa_demand_mission_desc: "The current demand is [GetGodsOfAfricaDemandFamilyName]: [?gods_of_africa_demand_remaining|0] of [?gods_of_africa_demand_amount|0] remains due. Resolve it by day [?gods_of_africa_demand_deadline|0] or the relationship will record a failure. Request an extension or choose a frozen substitute when those actions are available."
gods_of_africa_reconciliation_mission: "Reconciliation Window"
gods_of_africa_reconciliation_mission_desc: "Submit [?constant:gods_of_africa_transaction.reconciliation_pp_amount|0] political power in reparations and secure Africa's acceptance by day [?gods_of_africa_reconciliation_due_day|0]. A missed offer deepens the remembered defiance."
gods_of_africa_offer_voluntary_aid: "Offer Voluntary Aid"
gods_of_africa_offer_voluntary_aid_desc: "Send a meaningful shipment to answer Africa's current land-equipment or fuel shortage. The offer is available only outside an active demand and leaves a protected reserve behind."
gods_of_africa_comply_demand: "Fulfil the Demand"
gods_of_africa_comply_demand_desc: "Transfer the requested amount from our reserves to Africa while the contract is still valid."
gods_of_africa_partial_compliance: "Make a Partial Shipment"
gods_of_africa_partial_compliance_desc: "Transfer the frozen half-shipment now and leave the remaining balance active under the same contract."
gods_of_africa_negotiate_demand: "Request an Extension"
gods_of_africa_negotiate_demand_desc: "Ask Africa for more time. An extension can add a burden and is not guaranteed when Wrath is high."
gods_of_africa_substitute_demand: "Offer a Substitute"
gods_of_africa_substitute_demand_desc: "Offer a comparable valid resource from the alternatives named for this demand."
gods_of_africa_substitute_demand_slot_1: "Offer Alternative I"
gods_of_africa_substitute_demand_slot_1_desc: "Offer [GetGodsOfAfricaSubstituteSlot1Name] to answer the current demand. The quoted amount is fixed for this negotiation."
gods_of_africa_substitute_demand_slot_2: "Offer Alternative II"
gods_of_africa_substitute_demand_slot_2_desc: "Offer [GetGodsOfAfricaSubstituteSlot2Name] to answer the current demand. The quoted amount is fixed for this negotiation."
gods_of_africa_substitute_demand_slot_3: "Offer Alternative III"
gods_of_africa_substitute_demand_slot_3_desc: "Offer [GetGodsOfAfricaSubstituteSlot3Name] to answer the current demand. The quoted amount is fixed for this negotiation."
gods_of_africa_accept_substitute: "Accept the Substitute"
gods_of_africa_accept_substitute_desc: "Accept the participant's frozen substitute and close the demand on the recorded terms."
gods_of_africa_reject_substitute: "Reject the Substitute"
gods_of_africa_reject_substitute_desc: "Reject the proposed substitute without recording a full refusal; the original demand remains due."
gods_of_africa_refuse_demand: "Refuse the Demand"
gods_of_africa_refuse_demand_desc: "Reject this demand while remaining in the recurring relationship. Wrath rises and punishment may be evaluated within Africa's current Strength."
gods_of_africa_permanent_defiance: "Defy the Gods"
gods_of_africa_permanent_defiance_desc: "End ordinary demands permanently. The normal friendship route closes, Wrath gains a floor, and retaliation remains possible."
gods_of_africa_seek_reconciliation: "Seek Reconciliation"
gods_of_africa_seek_reconciliation_desc: "Offer the costly reparations and conduct required to reopen a relationship after permanent defiance."

gods_of_africa_choose_reciprocal_covenant: "Adopt the Reciprocal Covenant"
gods_of_africa_choose_reciprocal_covenant_desc: "Treat tribute as a shared survival compact. Demands are measured against need, and reliable partners can receive protection."
gods_of_africa_choose_sovereign_exaction: "Declare Sovereign Exaction"
gods_of_africa_choose_sovereign_exaction_desc: "Treat tribute as restitution and obedience. Demands become firmer, while refusal carries greater diplomatic weight."
gods_of_africa_choose_strategic_ambiguity: "Keep the Voices Veiled"
gods_of_africa_choose_strategic_ambiguity_desc: "Leave the source of each consequence deliberately unclear. Ambiguity helps diplomacy but never permits punishment beyond Strength."
gods_of_africa_grant_leniency: "Grant Leniency"
gods_of_africa_grant_leniency_desc: "Reduce or postpone one valid demand for a cooperative partner or a country facing a genuine hardship."
gods_of_africa_protect_partner: "Protect a Reliable Partner"
gods_of_africa_protect_partner_desc: "Spend real African capacity on a bounded protection package for a partner without defiance or an unresolved offense."
gods_of_africa_commit_settlement: "Accept the Final Settlement"
gods_of_africa_commit_settlement_desc: "Commit the selected participant's hidden relationship outcome after Africa's secured-continent settlement."

gods_of_africa_comply_demand_effect_tt: "The requested resources are debited once and credited to Africa. Wrath falls, the demand closes, and compliance history is preserved."
gods_of_africa_partial_compliance_effect_tt: "A measured partial shipment is debited once and credited to Africa. The remaining balance stays active, with a short payment cooldown."
gods_of_africa_negotiate_demand_effect_tt: "The demand enters a single extension window. Africa may add a burden or reject the request."
gods_of_africa_substitute_demand_effect_tt: "The frozen substitute offer is submitted for Africa's review; it does not silently count as compliance."
gods_of_africa_substitute_demand_slot_1_effect_tt: "Alternative I is submitted using its frozen family and amount. Africa must accept the offer before the relationship is settled."
gods_of_africa_substitute_demand_slot_2_effect_tt: "Alternative II is submitted using its frozen family and amount. Africa must accept the offer before the relationship is settled."
gods_of_africa_substitute_demand_slot_3_effect_tt: "Alternative III is submitted using its frozen family and amount. Africa must accept the offer before the relationship is settled."
gods_of_africa_accept_substitute_effect_tt: "The frozen substitute is accepted, transferred once, and recorded as a negotiated success."
gods_of_africa_reject_substitute_effect_tt: "The substitute is rejected without counting as a refusal. The original demand remains active under its extended deadline, and Wrath rises slightly."
gods_of_africa_refuse_demand_effect_tt: "Wrath rises once, the demand closes, and punishment is evaluated under the current Strength ceiling."
gods_of_africa_permanent_defiance_effect_tt: "Ordinary demands stop, permanent defiance is recorded, and reconciliation becomes the only route back."
gods_of_africa_seek_reconciliation_effect_tt: "The reconciliation package is offered to Africa. It must be accepted before ordinary demands can return."
gods_of_africa_reconciliation_failure_effect_tt: "The reconciliation window closed without an accepted offer. Defiance remains active and Wrath rises."
gods_of_africa_wartime_demand_cancelled_effect_tt: "The active demand is cancelled once for the war, the treaty break is remembered, and no ordinary demand returns until the conflict ends."
gods_of_africa_voluntary_aid_effect_tt: "A real shipment is debited once and credited to Africa's current material reserve. Wrath falls, aid history is preserved, and the voluntary-offer cooldown begins."
gods_of_africa_choose_reciprocal_covenant_effect_tt: "The continental ledger adopts the Reciprocal Covenant doctrine."
gods_of_africa_choose_sovereign_exaction_effect_tt: "The continental ledger adopts the Sovereign Exaction doctrine."
gods_of_africa_choose_strategic_ambiguity_effect_tt: "The continental ledger adopts Strategic Ambiguity."
gods_of_africa_grant_leniency_effect_tt: "The selected participant's demand is reduced or extended, and Africa's hidden goodwill improves."
gods_of_africa_protect_partner_effect_tt: "A real bounded protection package is paid from African capacity and sent to the selected participant."
gods_of_africa_commit_settlement_effect_tt: "The selected participant receives its hidden final relationship outcome and all ordinary demands close."

