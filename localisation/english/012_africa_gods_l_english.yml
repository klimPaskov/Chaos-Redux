l_english:
chaosx.nr12.601.t: "The Gods Speak Through Africa"
chaosx.nr12.601.d: "The African unifier has survived the consolidation of its institutions. Its leaders now claim to speak for the Gods of Africa, whose warnings and demands will be carried to every major power and every country that holds a place in the world's councils."
chaosx.nr12.601.a: "Let the proclamation be heard"
gods_of_africa_activation_effect_tt: "Gods of Africa is active. Africa's current Strength is [GetGodsOfAfricaStrengthBand]. Foreign governments will receive demands when a real continental need can be answered."

chaosx.nr12.602.t: "A Voice Beyond the Continent"
chaosx.nr12.602.d: "A formal notice arrives from the African unifier. The Gods of Africa now speak through its government. Their shared Strength is [GetGodsOfAfricaStrengthBand], while this government's Wrath of the Gods is [GetGodsOfAfricaWrathBand]. The relationship will endure through recurring demands, real transfers, and remembered conduct."
chaosx.nr12.602.a: "We will answer in our own way"
gods_of_africa_introduction_effect_tt: "The Gods of Africa relationship is recorded. Strength is global. Wrath belongs to this country."

chaosx.nr12.603.t: "A Demand from Africa"
chaosx.nr12.603.d: "Africa demands [GetGodsOfAfricaDemandFamilyName]. We can fulfil the obligation, ask for an extension, offer an available substitute, or refuse it. A refusal raises our Wrath and may bring a response limited by Africa's Strength."
chaosx.nr12.603.a: "Read the demand"
gods_of_africa_demand_effect_tt: "Review the active demand and its deadline in the Gods of Africa category."

chaosx.nr12.604.t: "Africa Receives Our Answer"
chaosx.nr12.604.d: "[GetGodsOfAfricaResponseReport][GetGodsOfAfricaResponseBreachLine]"
chaosx.nr12.604.a: "Let the answer stand"
gods_of_africa_response_effect_tt: "Acknowledge this response."

chaosx.nr12.605.t: "Africa Answers"
chaosx.nr12.605.d: "[GetGodsOfAfricaPunishmentReportBody]"
chaosx.nr12.605.a: "Endure the consequence"
gods_of_africa_punishment_effect_tt: "Acknowledge Africa's response."

gods_of_africa_response_compliance_report: "We have fulfilled Africa's demand for [GetGodsOfAfricaResponseFamilyName]. The obligation is settled."
gods_of_africa_response_substitute_report: "Africa has received [GetGodsOfAfricaResponsePaidAmount] as agreed alternative tribute. The original obligation is settled."
gods_of_africa_response_partial_report: "We have delivered [GetGodsOfAfricaResponsePaidAmount]. [GetGodsOfAfricaResponseBalance] remains due under the running deadline."
gods_of_africa_response_refusal_report: "We have refused Africa's demand for [GetGodsOfAfricaResponseFamilyName]. The contract is closed, and Africa remembers the refusal."
gods_of_africa_response_expired_report: "The deadline passed with [GetGodsOfAfricaResponseBalance] still unpaid. The contract is closed, and Africa remembers the failure."
gods_of_africa_response_unknown_report: "No completed response is available in this report."
gods_of_africa_punishment_pressure_report: "Africa has answered with political pressure."
gods_of_africa_punishment_disruption_report: "Africa has answered with limited disruption."
gods_of_africa_punishment_crisis_report: "Africa has answered with a crisis."
gods_of_africa_punishment_ultimatum_report: "Africa has delivered an ultimatum."
gods_of_africa_punishment_failed_manifestation_report: "Africa's attempted manifestation failed to reach us. Its political pressure still left the consequences shown below."
gods_of_africa_punishment_catastrophe_report: "Africa has unleashed disaster against us. Its attack killed [?gods_of_africa_punishment_report_population_loss|0] civilians."
gods_of_africa_punishment_catastrophe_no_wave_report: "Africa has unleashed disaster against us. We escaped its additional attack on our civilian population."
gods_of_africa_punishment_unknown_report: "No completed punishment is available in this report."
gods_of_africa_response_equipment_paid: "[?gods_of_africa_last_response_amount|0] [GetGodsOfAfricaResponseFamilyName]"
gods_of_africa_response_equipment_balance: "[?gods_of_africa_last_response_balance|0] [GetGodsOfAfricaResponseFamilyName]"
gods_of_africa_response_fuel_paid: "[?gods_of_africa_last_response_amount|3] fuel"
gods_of_africa_response_fuel_balance: "[?gods_of_africa_last_response_balance|3] fuel"
gods_of_africa_response_manpower_paid: "[?gods_of_africa_last_response_amount|0] manpower"
gods_of_africa_response_manpower_balance: "[?gods_of_africa_last_response_balance|0] manpower"
gods_of_africa_response_rights_paid: "a concession of steel resource rights"
gods_of_africa_response_rights_balance: "a concession of steel resource rights"
gods_of_africa_response_political_power_paid: "[?gods_of_africa_last_response_amount|3] political power for [GetGodsOfAfricaResponseFamilyName]"
gods_of_africa_response_political_power_balance: "[?gods_of_africa_last_response_balance|3] political power for [GetGodsOfAfricaResponseFamilyName]"
gods_of_africa_punishment_report_with_receipt: "[GetGodsOfAfricaPunishmentReport] [GetGodsOfAfricaPunishmentLocalConsequence]\n\nPolitical power: [?gods_of_africa_last_punishment_pp_change|=+1]. Stability: [?gods_of_africa_last_punishment_stability_change|%=+1]. War support: [?gods_of_africa_last_punishment_war_support_change|%=+1]."
gods_of_africa_punishment_resistance_consequence: "Resistance rose by [?gods_of_africa_punishment_report_resistance_change|1] points in [?gods_of_africa_punishment_report_state.GetName]."
gods_of_africa_punishment_factory_consequence: "Sabotage targeted infrastructure and factories in [?gods_of_africa_punishment_report_state.GetName]."
gods_of_africa_punishment_infrastructure_consequence: "Sabotage targeted infrastructure in [?gods_of_africa_punishment_report_state.GetName]."
gods_of_africa_punishment_transport_protected_consequence: "Our transport preparations prevented the local attack."
gods_of_africa_punishment_no_local_consequence: ""

chaosx.nr12.608.t: "A Place in the Final Council"
chaosx.nr12.608.d: "The African continent has secured its settlement. Ordinary Gods of Africa demands are over, and this country is remembered as [GetGodsOfAfricaSettlementName]."
chaosx.nr12.608.a: "Accept the settlement"
gods_of_africa_settlement_effect_tt: "Ordinary tribute is over. This country's standing and past conduct remain part of Africa's settlement."

chaosx.nr12.609.t: "A Country Defies the Gods"
chaosx.nr12.609.d: "This country has defied the Gods of Africa. Ordinary demands stop, and Africa ends the guarantees, access, and reception services it granted through this compact where they remain in place. Punishment and retaliation remain possible. Only reconciliation accepted by Africa can restore cooperation."
chaosx.nr12.609.a: "Stand behind the declaration"
gods_of_africa_defiance_effect_tt: "Ordinary demands stop during defiance. Africa may answer with punishment or retaliation, and only accepted reconciliation can restore cooperation."

chaosx.nr12.610.t: "Africa Answers a Call for Protection"
chaosx.nr12.610.d: "Africa has sent infantry equipment and fuel to [gods_of_africa_protected_participant.GetName]. The pledge details show which guarantees, access rights, intelligence, and further supplies reached the partner. Relief Convoy remains a separate choice in Foreign Disaster Relief at its own price."
chaosx.nr12.610.a: "Stand by the pledge"
gods_of_africa_protection_effect_tt: "Africa can renew a pledge after [?constant:gods_of_africa_transaction.protection_cooldown_days|0] days. Reciprocal Covenant cuts that wait by [?constant:gods_of_africa_doctrine_effect.reciprocal_protection_cooldown_reduction_days|0] days, and Continental Reserve cuts it by another [?constant:gods_of_africa_transaction.reserve_protection_cooldown_reduction_days|0]. If the partnership ends, Africa withdraws its guarantee, access rights, and reception capacity. Delivered supplies, completed works, shared intelligence, and relief already underway remain."
gods_of_africa_protection_service_guarantee_tt: "A guarantee for [gods_of_africa_protected_participant.GetName] is active."
gods_of_africa_protection_service_military_access_tt: "[gods_of_africa_protected_participant.GetName] has military access through Africa."
gods_of_africa_protection_service_market_access_tt: "Mutual market access with [gods_of_africa_protected_participant.GetName] is active."
gods_of_africa_protection_service_market_missing_dlc_tt: "Mutual market access requires Arms Against Tyranny."
gods_of_africa_protection_service_market_capability_locked_tt: "Africa must complete Sanctuary for Reliable Partners to offer mutual market access."
gods_of_africa_protection_service_market_unconfirmed_tt: "Mutual market access with [gods_of_africa_protected_participant.GetName] was not secured under this pledge."
gods_of_africa_protection_service_intelligence_tt: "[gods_of_africa_protected_participant.GetName] received [GetGodsOfAfricaProtectionIntelAmount] points of each intelligence type on at least one eligible African enemy."
gods_of_africa_protection_intelligence_base_amount: "[?constant:gods_of_africa_transaction.protection_intelligence_amount|0]"
gods_of_africa_protection_intelligence_ambiguity_amount: "[?constant:gods_of_africa_doctrine_effect.strategic_ambiguity_protection_intelligence_amount|0]"
gods_of_africa_protection_service_intelligence_missing_dlc_tt: "Sharing enemy intelligence requires La Résistance."
gods_of_africa_protection_service_intelligence_capability_locked_tt: "Africa must complete Swear Continental Security Oaths to share enemy intelligence."
gods_of_africa_protection_service_intelligence_host_agency_missing_tt: "Africa has no intelligence agency to share intelligence on its enemies."
gods_of_africa_protection_service_intelligence_participant_agency_missing_tt: "[gods_of_africa_protected_participant.GetName] has no intelligence agency to receive Africa's enemy intelligence."
gods_of_africa_protection_service_intelligence_no_war_tt: "Africa is not at war, so it has no enemy intelligence to share."
gods_of_africa_protection_service_intelligence_no_eligible_enemy_tt: "Africa has no active enemy that [gods_of_africa_protected_participant.GetName] is not also fighting."
gods_of_africa_protection_service_intelligence_unconfirmed_tt: "No enemy intelligence was shared with [gods_of_africa_protected_participant.GetName] under this pledge."
gods_of_africa_protection_service_convoys_tt: "Africa delivered [?constant:gods_of_africa_transaction.transport_amount|0] convoys to [gods_of_africa_protected_participant.GetName]."
gods_of_africa_protection_service_trains_tt: "Africa delivered [?constant:gods_of_africa_transaction.transport_amount|0] trains to [gods_of_africa_protected_participant.GetName]."
gods_of_africa_protection_service_capital_tt: "Africa raised infrastructure in [gods_of_africa_protected_participant.GetName]'s eligible capital."
gods_of_africa_protection_service_reception_tt: "Shelter and medical reception capacity is active in [gods_of_africa_protected_participant.GetName]."
gods_of_africa_protection_service_stability_tt: "The Relief Beyond Our Borders focus improved [gods_of_africa_protected_participant.GetName]'s stability."
gods_of_africa_protection_service_war_support_tt: "The Expedition focus improved [gods_of_africa_protected_participant.GetName]'s war support."
gods_of_africa_protection_service_conditions_tt: "Africa offers each extra service only when its focus, stockpiles, and diplomatic conditions permit. Reception also needs Migration capacity."
chaosx.nr12.611.t: "The Window Closes"
chaosx.nr12.611.d: "The reconciliation offer was not accepted before the appointed window ended. The defiance, broken agreement, or war against Africa remains unresolved, and the Gods remember the missed opportunity."
chaosx.nr12.611.a: "Then it stays unresolved"
chaosx.nr12.612.t: "[GetGodsOfAfricaRejectionTitle]"
chaosx.nr12.612.d: "[GetGodsOfAfricaRejectionReport]"
chaosx.nr12.612.a: "[GetGodsOfAfricaRejectionAcknowledgement]"
chaosx.nr12.613.t: "The Wartime Contract Is Set Aside"
chaosx.nr12.613.d: "War has opened between this government and Africa. The active tribute contract has been cancelled rather than enforced during the conflict, and ordinary demands will wait until the war is over.[GetGodsOfAfricaWartimeBreachLine]"
chaosx.nr12.613.a: "Let the wartime terms stand"
gods_of_africa_response_breach_terms: "\n\nThese were agreed terms, so Africa counts this as a broken agreement. Wrath rises sharply and cannot fall below [?constant:gods_of_africa_wrath.floor_broken_treaty|0] until Africa accepts a reconciliation."
gods_of_africa_response_breach_none: ""
gods_of_africa_wartime_breach_terms: "\n\nThe contract carried agreed terms, so Africa counts the war as a broken agreement. Any protection Africa still extended to this government ends, and Wrath cannot fall below [?constant:gods_of_africa_wrath.floor_broken_treaty|0] until Africa accepts a reconciliation."
gods_of_africa_wartime_breach_none: " The war itself is remembered."
gods_of_africa_agreement_tribute_terms: "agreed tribute terms"
gods_of_africa_agreement_protection_compact: "Africa's protection compact"
gods_of_africa_agreement_reconciliation: "the reconciliation Africa had accepted"
gods_of_africa_agreement_victor_renewal: "the renewed recognition of Africa's authority"
chaosx.nr12.616.t: "An Agreement Broken by War"
chaosx.nr12.616.d: "War has opened between this government and Africa while [GetGodsOfAfricaBrokenAgreementName] still stood. Africa counts the agreement as broken. Every agreement it had made with this government ends, Wrath rises sharply, and Wrath cannot fall below [?constant:gods_of_africa_wrath.floor_broken_treaty|0] until Africa accepts a reconciliation."
chaosx.nr12.616.a: "We chose this war"
gods_of_africa_agreement_breach_effect_tt: "The broken agreement stays on record permanently. After the war, Africa opens a reconciliation window; only a reconciliation it accepts lifts the Wrath floor."
gods_of_africa_refuse_agreed_terms_tt: "These are agreed terms. Refusing them is a broken agreement: Wrath rises sharply and cannot fall below [?constant:gods_of_africa_wrath.floor_broken_treaty|0] until Africa accepts a reconciliation."
chaosx.nr12.614.t: "A Voluntary Offering Reaches Africa"
chaosx.nr12.614.d: "Africa has received [?gods_of_africa_last_aid_amount|0] units of [GetGodsOfAfricaLastAidFamilyName] from us. The shipment eases its shortage and lowers our Wrath. Another voluntary shipment must wait [?constant:gods_of_africa_timing.voluntary_aid_cooldown_days|0] days."
chaosx.nr12.614.a: "Let the offering be remembered"

gods_of_africa_participant_category: "Gods of Africa"
gods_of_africa_participant_category_desc: "[GetGodsOfAfricaVictorCategoryDesc]"
gods_of_africa_host_category: "Gods of Africa: Continental Council"
gods_of_africa_host_category_desc: "[GetGodsOfAfricaHostCategoryDesc]"

gods_of_africa_demand_mission: "Answer the Demand"
gods_of_africa_demand_mission_desc: "Africa demands [GetGodsOfAfricaDemandFamilyName]. [?gods_of_africa_demand_remaining|0] of [?gods_of_africa_demand_amount|0] remains due, with [?days_mission_timeout@gods_of_africa_demand_mission|0] days left. Fulfil the obligation, request an extension, or offer an available substitute before the deadline."
gods_of_africa_reconciliation_mission: "Reconciliation Window"
gods_of_africa_reconciliation_mission_desc: "Offer [?constant:gods_of_africa_transaction.reconciliation_pp_amount|0] political power in reparations and secure Africa's acceptance within [?days_mission_timeout@gods_of_africa_reconciliation_mission|0] days. If the offer expires, the defiance, broken agreement, or war stays unresolved and Wrath rises."
gods_of_africa_offer_voluntary_aid: "Offer Voluntary Aid"
gods_of_africa_offer_voluntary_aid_desc: "Send infantry equipment if Africa needs it and we can spare it. Otherwise send fuel if Africa needs fuel and we can spare it. No voluntary offer can be made during an active demand."
gods_of_africa_comply_demand: "Fulfil the Demand"
gods_of_africa_comply_demand_desc: "Transfer the requested amount from our reserves to Africa while the contract is still valid."
gods_of_africa_partial_compliance: "Make a Partial Shipment"
gods_of_africa_partial_compliance_desc: "Transfer the frozen half-shipment now and leave the remaining balance active under the same contract."
gods_of_africa_negotiate_demand: "Request an Extension"
gods_of_africa_negotiate_demand_desc: "Open one measured extension window and review the frozen substitute alternatives before answering the original obligation."
gods_of_africa_substitute_demand: "Offer a Substitute"
gods_of_africa_substitute_demand_desc: "Offer a comparable valid resource from the alternatives named for this demand."
gods_of_africa_substitute_demand_slot_1: "Offer Alternative I"
gods_of_africa_substitute_demand_slot_1_desc: "Offer [GetGodsOfAfricaSubstituteSlot1Name] to answer the current demand. The quoted amount is fixed for this negotiation."
gods_of_africa_substitute_demand_slot_2: "Offer Alternative II"
gods_of_africa_substitute_demand_slot_2_desc: "Offer [GetGodsOfAfricaSubstituteSlot2Name] to answer the current demand. The quoted amount is fixed for this negotiation."
gods_of_africa_substitute_demand_slot_3: "Offer Alternative III"
gods_of_africa_substitute_demand_slot_3_desc: "Offer [GetGodsOfAfricaSubstituteSlot3Name] to answer the current demand. The quoted amount is fixed for this negotiation."
gods_of_africa_accept_substitute: "Accept the Substitute"
gods_of_africa_accept_substitute_desc: "Accept the participant's frozen substitute and close the demand on the recorded terms."
gods_of_africa_reject_substitute: "[GetGodsOfAfricaVictorRejectName]"
gods_of_africa_reject_substitute_desc: "[GetGodsOfAfricaVictorRejectDesc]"
gods_of_africa_refuse_demand: "Refuse the Demand"
gods_of_africa_refuse_demand_desc: "Reject this demand while remaining in the recurring relationship. Wrath rises and punishment may be evaluated within Africa's current Strength."
gods_of_africa_permanent_defiance: "Defy the Gods"
gods_of_africa_permanent_defiance_desc: "End ordinary demands permanently. The normal friendship route closes, Wrath gains a floor, and retaliation remains possible."
gods_of_africa_seek_reconciliation: "[GetGodsOfAfricaVictorSeekName]"
gods_of_africa_seek_reconciliation_desc: "[GetGodsOfAfricaVictorSeekDesc]"

gods_of_africa_choose_reciprocal_covenant: "Adopt the Reciprocal Covenant"
gods_of_africa_choose_reciprocal_covenant_desc: "Measure tribute against African need. Protection returns sooner and relieves more Wrath, retaliation softens, and two fulfilled demands or one recorded support action can earn a Favored settlement."
gods_of_africa_choose_sovereign_exaction: "Declare Sovereign Exaction"
gods_of_africa_choose_sovereign_exaction_desc: "Treat tribute as restitution and obedience. Demands grow larger, host-marked offenders face firmer retaliation, protection brings less relief, and sustained support is needed for a Favored settlement."
gods_of_africa_choose_strategic_ambiguity: "Keep the Voices Veiled"
gods_of_africa_choose_strategic_ambiguity_desc: "Give countries longer to answer Africa's demands. Protection can share intelligence when Security Oaths, La Résistance, both agencies, and an African war permit it. Punishment takes less stability and war support, while host-marked offenders can still face sanctions. Africa's Strength continues to limit retaliation."
gods_of_africa_grant_leniency: "Grant Leniency"
gods_of_africa_grant_leniency_desc: "Reduce or postpone one valid demand for a cooperative partner or a country facing a genuine hardship."
gods_of_africa_public_pardon: "Public Pardon"
gods_of_africa_public_pardon_desc: "Lift one proven offender's active mark and lower Wrath once, without erasing the hidden history of the offense."
gods_of_africa_escalate_offense: "Escalate a Proven Offense"
gods_of_africa_escalate_offense_desc: "Commit one bounded punishment against a proven offender under Africa's current Strength ceiling."
gods_of_africa_protect_partner: "Protect a Reliable Partner"
gods_of_africa_protect_partner_desc: "Send infantry equipment and fuel to a reliable partner at peace with Africa. Doctrine and Continental Reserve affect when Africa can renew the pledge. Relief Convoy is a separate choice in Foreign Disaster Relief at its own price."
gods_of_africa_commit_settlement: "Accept the Final Settlement"
gods_of_africa_commit_settlement_desc: "Conclude the tribute cycle after Africa secures the continent, and record the standing of every surviving participant."

gods_of_africa_comply_demand_effect_tt: "The requested material or resource rights are transferred once and credited to Africa. Wrath falls, the demand closes, and compliance history is preserved."
gods_of_africa_partial_compliance_effect_tt: "A measured partial shipment is debited once and credited to Africa. The remaining balance stays active, with a short payment cooldown. Once a partial payment is made, the rest is an agreed obligation: failing or refusing it counts as a broken agreement."
gods_of_africa_negotiate_demand_effect_tt: "The demand enters a single extension window and freezes up to three capacity-checked substitute alternatives. The extension makes the demand an agreed obligation: failing or refusing it afterwards counts as a broken agreement."
gods_of_africa_substitute_demand_effect_tt: "The frozen substitute offer is submitted for Africa's review. It is not accepted until Africa approves it."
gods_of_africa_substitute_demand_slot_1_effect_tt: "Alternative I is submitted using its frozen family and amount. Africa must accept the offer before the relationship is settled."
gods_of_africa_substitute_demand_slot_2_effect_tt: "Alternative II is submitted using its frozen family and amount. Africa must accept the offer before the relationship is settled."
gods_of_africa_substitute_demand_slot_3_effect_tt: "Alternative III is submitted using its frozen family and amount. Africa must accept the offer before the relationship is settled."
gods_of_africa_accept_substitute_effect_tt: "The frozen substitute is accepted, transferred once, and recorded as a negotiated success."
gods_of_africa_reject_substitute_effect_tt: "[GetGodsOfAfricaVictorRejectEffect]"
gods_of_africa_refuse_demand_effect_tt: "Wrath rises once, the demand closes, and punishment is evaluated under the current Strength ceiling."
gods_of_africa_permanent_defiance_effect_tt: "Ordinary demands stop, permanent defiance is recorded, and reconciliation becomes the only route back."
gods_of_africa_seek_reconciliation_effect_tt: "[GetGodsOfAfricaVictorSeekEffect]"
gods_of_africa_reconciliation_failure_effect_tt: "The reconciliation window closed without an accepted offer. The defiance, broken agreement, or war stays unresolved and Wrath rises. A new window opens later."
gods_of_africa_wartime_demand_cancelled_effect_tt: "The active demand is cancelled once for the war, and no ordinary demand returns until the conflict ends. If the demand carried agreed terms, the war is recorded as a broken agreement."
gods_of_africa_voluntary_aid_effect_tt: "A real shipment is debited once and credited to Africa's current material reserve. Wrath falls, aid history is preserved, and the voluntary-offer cooldown begins."
gods_of_africa_choose_reciprocal_covenant_effect_tt: "Demands ask for [?constant:gods_of_africa_demand_scale.reciprocal_percent|0]% of the usual tribute. Protection returns [?constant:gods_of_africa_doctrine_effect.reciprocal_protection_cooldown_reduction_days|0] days sooner and lowers Wrath by [?constant:gods_of_africa_doctrine_effect.reciprocal_protection_wrath_relief|0]. Retaliation softens by [?constant:gods_of_africa_doctrine_effect.reciprocal_punishment_tier_reduction|0] tier, down to Pressure. [?constant:gods_of_africa_doctrine_effect.reciprocal_favored_minimum_compliance|0] fulfilled demands or [?constant:gods_of_africa_value.one|0] support action can earn Favored standing."
gods_of_africa_choose_sovereign_exaction_effect_tt: "Demands ask for [?constant:gods_of_africa_demand_scale.sovereign_percent|0]% of the usual tribute. Protection lowers Wrath by [?constant:gods_of_africa_doctrine_effect.sovereign_exaction_protection_wrath_relief|0]. Retaliation against a host-marked offender rises by [?constant:gods_of_africa_doctrine_effect.sovereign_exaction_punishment_tier_increase|0] tier, up to Ultimatum unless every catastrophe gate opens. [?constant:gods_of_africa_doctrine_effect.sovereign_exaction_favored_minimum_compliance|0] fulfilled demands or [?constant:gods_of_africa_doctrine_effect.sovereign_exaction_favored_minimum_aid|0] support actions can earn Favored standing."
gods_of_africa_choose_strategic_ambiguity_effect_tt: "Demand windows last [?constant:gods_of_africa_doctrine_effect.strategic_ambiguity_deadline_extension_days|0] days longer. With Security Oaths, La Résistance, an agency in each country, and an African war, protection shares [?constant:gods_of_africa_doctrine_effect.strategic_ambiguity_protection_intelligence_amount|0] points of each intelligence type on an eligible African enemy. Direct stability and war-support losses from punishment are halved, and host-marked offenders face sanctions. Fewer than [?constant:gods_of_africa_doctrine_effect.strategic_ambiguity_respected_failure_ceiling|0] failures and fewer than [?constant:gods_of_africa_doctrine_effect.strategic_ambiguity_respected_refusal_ceiling|0] refusals can still earn Respected standing. Africa's Strength continues to limit retaliation."
gods_of_africa_grant_leniency_effect_tt: "The selected participant's demand is reduced or extended, and Africa's confidence in the participant improves."
gods_of_africa_public_pardon_effect_tt: "The selected offender is publicly pardoned once. Wrath falls, but the underlying history remains recorded."
gods_of_africa_escalate_offense_effect_tt: "The selected proven offense is escalated once. Punishment remains bounded by Strength and the active safety gates."
gods_of_africa_protect_partner_effect_tt: "Protection lowers Wrath by [?constant:gods_of_africa_wrath.protection_magnitude|0] normally, [?constant:gods_of_africa_doctrine_effect.reciprocal_protection_wrath_relief|0] under Reciprocal Covenant, or [?constant:gods_of_africa_doctrine_effect.sovereign_exaction_protection_wrath_relief|0] under Sovereign Exaction. Africa can renew the pledge after [?constant:gods_of_africa_transaction.protection_cooldown_days|0] days. Reciprocal Covenant cuts that wait by [?constant:gods_of_africa_doctrine_effect.reciprocal_protection_cooldown_reduction_days|0] days, and Continental Reserve cuts it by another [?constant:gods_of_africa_transaction.reserve_protection_cooldown_reduction_days|0]. Sanctuary can add a guarantee and, with Arms Against Tyranny, mutual market access. Security Oaths can grant military access and share [GetGodsOfAfricaProtectionIntelAmount] points of each intelligence type on active African enemies the partner is not fighting, when La Résistance and both agencies allow it. Other protection focuses can improve stability or war support, rebuild the partner's controlled capital, or establish reception capacity. Rails, Ports, and Fuel can send one extra shipment of [?constant:gods_of_africa_transaction.transport_amount|0] £convoy_texticon convoys or [?constant:gods_of_africa_transaction.transport_amount|0] £train_texticon trains when stockpiles permit. Convoys take priority."
gods_of_africa_protection_cost: "£infantry_equipment_text_icon §Y[?constant:gods_of_africa_transaction.protection_infantry_equipment|0]§!  £fuel_texticon §Y[?constant:gods_of_africa_transaction.protection_fuel|0]§!  £pol_power §Y[?constant:gods_of_africa_transaction.protection_pp_cost|0]§!"
gods_of_africa_protection_cost_blocked: "£infantry_equipment_text_icon §R[?constant:gods_of_africa_transaction.protection_infantry_equipment|0]§!  £fuel_texticon §R[?constant:gods_of_africa_transaction.protection_fuel|0]§!  £pol_power §R[?constant:gods_of_africa_transaction.protection_pp_cost|0]§!"
gods_of_africa_protection_cost_tooltip: "The base payment is [?constant:gods_of_africa_transaction.protection_infantry_equipment|0] £infantry_equipment_text_icon, [?constant:gods_of_africa_transaction.protection_fuel|0] £fuel_texticon, and [?constant:gods_of_africa_transaction.protection_pp_cost|0] £pol_power. Africa's common-defence reserve must cover and is reduced by the same infantry shipment. With Rails, Ports, and Fuel, at most one shipment of [?constant:gods_of_africa_transaction.transport_amount|0] £convoy_texticon convoys or [?constant:gods_of_africa_transaction.transport_amount|0] £train_texticon trains may be sent. The partner must hold fewer than that amount of the chosen type, and Africa must retain more than [?constant:gods_of_africa_protection.transport_host_stockpile_minimum|0] after delivery. Convoys take priority."
gods_of_africa_commit_settlement_effect_tt: "Every surviving participant's final standing is recorded and ordinary demands close."

