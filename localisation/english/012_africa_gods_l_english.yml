gods_of_africa_mobile_truck_capacity_tt: "Can ship the required trucks to Africa while keeping enough for army reinforcements and an operating reserve."
gods_of_africa_mobile_artillery_capacity_tt: "Can ship the required artillery to Africa while keeping enough for army reinforcements and an operating reserve."
gods_of_africa_mobile_type_invalid_tt: "The shipment specifies either trucks or artillery."
gods_of_africa_seek_reconciliation_ordinary: "Seek Reconciliation"
gods_of_africa_victor_seek_name: "Offer Renewed Recognition"
gods_of_africa_seek_reconciliation_desc_ordinary: "Offer the costly reparations and conduct required to reopen a relationship after permanent defiance, a broken agreement, or war against Africa."
gods_of_africa_victor_seek_desc: "Offer recognition of Africa's renewed authority. Our earlier victory remains recorded, and ordinary demands stay closed until Africa accepts."
gods_of_africa_seek_reconciliation_effect_tt_ordinary: "The reconciliation package is offered to Africa. It must be accepted before ordinary demands can return."
gods_of_africa_victor_seek_effect: "A recognition offer is sent without reparations. Africa must explicitly accept before its authority over us can return."
gods_of_africa_return_to_demand_ordinary: "Return to the Demand"
gods_of_africa_victor_return_name: "Withdraw the Recognition Offer"
gods_of_africa_return_to_demand_desc_ordinary: "Close the extension request and answer the original demand before its current deadline."
gods_of_africa_victor_return_desc: "Withdraw our pending offer. Our victory and freedom from ordinary demands remain in force."
gods_of_africa_return_to_demand_effect_tt_ordinary: "The extension window closes and the original demand becomes the active response again."
gods_of_africa_victor_return_effect: "The recognition offer is withdrawn. Our exemption and prior conduct remain unchanged."
gods_of_africa_accept_reconciliation_ordinary: "Accept Reconciliation"
gods_of_africa_victor_accept_name: "Accept Renewed Recognition"
gods_of_africa_accept_reconciliation_desc_ordinary: "Accept the reparations and conduct offered by a country that defied Africa, broke an agreement with it, or fought it, reopening the ordinary relationship."
gods_of_africa_victor_accept_desc: "Accept this former victor's voluntary recognition. The Gods regain authority over that country through this agreement."
gods_of_africa_accept_reconciliation_effect_tt_ordinary: "The reparations are accepted. The defiance, broken agreement, or war is resolved, its Wrath floor lifts, and ordinary demands may return after the reconciliation interval. Past breaches and wars stay on record, and the reconciliation itself becomes an agreement that war would break."
gods_of_africa_victor_accept_effect: "The recognition agreement is accepted and the victor's exemption ends. Earlier victory and conduct remain recorded. Any independent defiance still requires its own reconciliation."
gods_of_africa_reject_substitute_ordinary: "Reject the Substitute"
gods_of_africa_victor_reject_name: "Decline Renewed Recognition"
gods_of_africa_reject_substitute_desc_ordinary: "Reject the proposed substitute without recording a full refusal. The original demand remains due."
gods_of_africa_victor_reject_desc: "Decline this recognition offer. The victor remains outside ordinary tribute and may approach Africa again."
gods_of_africa_reject_substitute_effect_tt_ordinary: "The substitute is rejected without counting as a refusal. The original demand remains active under its extended deadline, and Wrath rises slightly."
gods_of_africa_victor_reject_effect: "The recognition offer is declined without a tribute penalty. The victor's exemption and conduct remain intact."
chaosx.nr12.612.t_ordinary: "The Substitute Is Refused"
gods_of_africa_victor_rejection_title: "Recognition Is Declined"
chaosx.nr12.612.d_ordinary: "Africa has declined the proposed substitute. The refusal is not treated as a broken demand, but the original obligation remains and the extended window is now the only time left to answer it."
gods_of_africa_victor_rejection_body: "Africa has declined our recognition offer. Our earlier victory remains recorded, and the Gods still hold no claim to ordinary tribute from this country. We may offer renewed recognition again."
chaosx.nr12.612.a_ordinary: "Return to the obligation"
gods_of_africa_victor_rejection_ack: "Our independence stands"
gods_of_africa_participant_category_desc_ordinary: "£GFX_012_africa_gods_strength Strength: [?global.gods_of_africa_strength|0] ([GetGodsOfAfricaStrengthBand]). £GFX_012_africa_gods_wrath Wrath: [?gods_of_africa_wrath|0] ([GetGodsOfAfricaWrathBand]). The African unifier's recurring demands, voluntary aid, warnings, and rare offers of protection are recorded here."
gods_of_africa_victor_category_desc: "£GFX_012_africa_gods_strength Strength: [?global.gods_of_africa_strength|0] ([GetGodsOfAfricaStrengthBand]). £GFX_012_africa_gods_wrath Wrath: [?gods_of_africa_wrath|0] ([GetGodsOfAfricaWrathBand]). Our victory ended Africa's claim to tribute. [GetGodsOfAfricaVictorOfferStatus]"
gods_of_africa_reconciliation_offer_cost: "[GetGodsOfAfricaReconciliationCost]"
gods_of_africa_victor_recognition_cost: "Recognition offer (no reparations)"
gods_of_africa_victor_offer_pending: "Our recognition offer awaits Africa's acceptance. We may withdraw it while it remains pending."
gods_of_africa_victor_offer_ready: "Renewed authority requires a voluntary offer and Africa's acceptance."
gods_of_africa_victor_renewal_requirements_tt: "Africa holds renewed authority under the same continental settlement and is at peace with us. We hold none of its African core territory and have no current recognition offer."
chaosx.nr12.615.t: "The Gods Have Lost Their Claim"
chaosx.nr12.615.d: "Our forces have made the African unifier capitulate. Its ordinary tribute and punishments against this government have ended. A successor's claim will not bind us through mere continuity. Renewed authority requires our voluntary recognition and Africa's explicit acceptance. The victory remains in the historical record."
chaosx.nr12.615.a: "The victory is ours"
gods_of_africa_victor_result_effect_tt: "This victory bars ordinary Gods demands and punishment against this government. Only a separate recognition agreement accepted by both governments can restore that authority."
gods_of_africa_victor_offer_stale: "This recognition offer cannot yet bind the present relationship. We may withdraw it, or approach Africa again when peace and territory permit."
gods_of_africa_victor_accept_requirements_tt: "This victor has offered recognition to the present African government. Peace holds and it owns or controls none of Africa's core territory."
gods_of_africa_victor_withdraw_requirements_tt: "A recognition offer remains pending and may be withdrawn."
gods_of_africa_victor_recorded: "Has defeated the African unifier."
gods_of_africa_victor_exempt: "Victory bars the Gods' ordinary claim to tribute."

gods_of_africa_host_category_desc_ordinary: "£GFX_012_africa_gods_strength Strength: [?global.gods_of_africa_strength|0] ([GetGodsOfAfricaStrengthBand]). Doctrine: [GetGodsOfAfricaDoctrineName]. Manage priorities, leniency, protection, and the final settlement of each relationship."
