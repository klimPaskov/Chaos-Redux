l_english:
chaosx.fallout.175.t: "The Triage Wall"
chaosx.fallout.175.d: "In the clinic at [?fallout_event_175_triage_state_id.GetName], a medic has fixed four sets of colored tabs to a sheet of salvaged steel. The medicine cabinet cannot cover every shelter bed. [ROOT.GetAirWinterGovernmentOfficial] must decide which people receive the first measured course, while [ROOT.GetAirWinterGovernmentAuthority] accepts the memory that follows."
chaosx.fallout.175.a: "Protect the children"
chaosx.fallout.175.a.tt: "Spend §Y[?constant:fallout_event_175_cost.children_medicine|0]§! Medicine and review the children's ward after §Y[?constant:fallout_event_175_timing.result_delay_days|0] days§!. A strong result preserves dependents and records the policy in the state ledger."
chaosx.fallout.175.b: "Keep the workers standing"
chaosx.fallout.175.b.tt: "Spend §Y[?constant:fallout_event_175_cost.workers_medicine|0]§! Medicine and review the workshops after §Y[?constant:fallout_event_175_timing.result_delay_days|0] days§!. A strong result returns skilled hands to reclamation work."
chaosx.fallout.175.c: "Treat the soldiers first"
chaosx.fallout.175.c.tt: "Spend §Y[?constant:fallout_event_175_cost.soldiers_medicine|0]§! Medicine and review the guard wards after §Y[?constant:fallout_event_175_timing.result_delay_days|0] days§!. A strong result restores a field reserve while the shelters remember the choice."
chaosx.fallout.175.e: "Give every bed an equal chance"
chaosx.fallout.175.e.tt: "Spend §Y[?constant:fallout_event_175_cost.equal_medicine|0]§! Medicine and draw the ward lots. The result returns after §Y[?constant:fallout_event_175_timing.result_delay_days|0] days§! and leaves the clearest record of the equal-chance rule."

chaosx.fallout.177.t: "The Children's Ward Report"
chaosx.fallout.177.success.d: "The children's ward in [?fallout_event_175_triage_state_id.GetName] received complete courses before the clinic lamps failed. The medic's tallies kept the shelter's youngest households together, and [ROOT.GetAirWinterGovernmentAuthority] now has a policy that families can name."
chaosx.fallout.177.partial.d: "The children's ward in [?fallout_event_175_triage_state_id.GetName] received enough medicine to prevent the worst cases, but two outer rooms waited through the coldest night. The surviving families can see where the list narrowed."
chaosx.fallout.177.failure.d: "The children's ward in [?fallout_event_175_triage_state_id.GetName] ran out of measured courses before the shelter ledger was complete. The Deaths register carries the names that the triage wall could not protect, and the clinic has lost public trust."
chaosx.fallout.177.a: "Send the ward ledger to the doctor"
chaosx.fallout.177.a.tt: "Resolve the children's ward, preserve its medical ethics memory, and schedule a doctor's callback in §Y[?constant:fallout_event_175_timing.callback_delay_days|0] days§!."

chaosx.fallout.178.t: "The Workshop Ward Report"
chaosx.fallout.178.success.d: "The workshop ward in [?fallout_event_175_triage_state_id.GetName] returned fit hands to the reclamation crews. The clinic protected machinists and haulers without turning the shelter into a factory dormitory, and the next repair roster has names on it."
chaosx.fallout.178.partial.d: "The workshop ward in [?fallout_event_175_triage_state_id.GetName] saved enough workers to keep one route open. The outer salvage teams still lost hours to fever, so the production ledger shows a recovery with a cost."
chaosx.fallout.178.failure.d: "The workshop ward in [?fallout_event_175_triage_state_id.GetName] could not return its crews to the cold depots. The Deaths register and the broken equipment list now share a column, and the clinic faces the families of the missing workers."
chaosx.fallout.178.a: "Send the work roster to the doctor"
chaosx.fallout.178.a.tt: "Resolve the workshop ward, preserve its labor memory, and schedule a doctor's callback."

chaosx.fallout.179.t: "The Guard Ward Report"
chaosx.fallout.179.success.d: "The guard ward in [?fallout_event_175_triage_state_id.GetName] returned patrol leaders and stretcher teams to duty. Their officers accepted the clinic's order, and [ROOT.GetAirWinterGovernmentOfficial] can protect the next convoy without stripping the shelters bare."
chaosx.fallout.179.partial.d: "The guard ward in [?fallout_event_175_triage_state_id.GetName] restored a thin patrol reserve. The soldiers can hold the gate, but they cannot yet escort every reclamation team, and the families have counted the beds used."
chaosx.fallout.179.failure.d: "The guard ward in [?fallout_event_175_triage_state_id.GetName] lost too many soldiers to rebuild the patrol roster. The Deaths register reaches the barracks, while [ROOT.GetAirWinterGovernmentAuthority] must answer for a choice that left both guards and civilians afraid."
chaosx.fallout.179.a: "Send the patrol roster to the doctor"
chaosx.fallout.179.a.tt: "Resolve the guard ward, preserve its command memory, and schedule a doctor's callback."

chaosx.fallout.180.t: "The Equal Chance Report"
chaosx.fallout.180.success.d: "The equal-chance draw in [?fallout_event_175_triage_state_id.GetName] survived inspection by every shelter district. The medic's metal tags were counted in public, and even the wards that received less medicine recognize the rule that governed the wall."
chaosx.fallout.180.partial.d: "The equal-chance draw in [?fallout_event_175_triage_state_id.GetName] kept the clinic from becoming a private gate, but the medicine ran thin before every bed was reached. The rule stands because the count was witnessed."
chaosx.fallout.180.failure.d: "The equal-chance draw in [?fallout_event_175_triage_state_id.GetName] failed when the last ampoules broke. The Deaths register records an equal process with unequal grief, and the shelter districts will carry that distinction into the next policy vote."
chaosx.fallout.180.a: "Send the public count to the doctor"
chaosx.fallout.180.a.tt: "Resolve the equal-chance ward, preserve its public record, and schedule a doctor's callback."

chaosx.fallout.185.t: "The Doctor's Callback"
chaosx.fallout.185.success.d: "The doctor returned to the triage wall in [?fallout_event_175_triage_state_id.GetName] with a clean set of records. The chosen ward gained enough medicine to reopen its training table, and the clinic's ethics rule is now part of the shelter charter."
chaosx.fallout.185.partial.d: "The doctor returned to the triage wall in [?fallout_event_175_triage_state_id.GetName] with a usable but disputed record. The clinic can treat another small wave, although every district has marked which promise remained beyond the medicine shelf."
chaosx.fallout.185.failure.d: "The doctor returned to the triage wall in [?fallout_event_175_triage_state_id.GetName] after the last reserve failed. The clinic closes its training table, and [ROOT.GetAirWinterGovernmentAuthority] must carry the ward's memory into the next demographic policy."
chaosx.fallout.185.a: "Seal the medical ethics record"
chaosx.fallout.185.a.tt: "Resolve the callback, preserve the doctor's memory, and release the delayed cleanup receipt."

fallout.event_log.triage_wall.name: "The Triage Wall"
fallout.event_log.triage_wall.detail: "[GetFalloutEvent175EventLogDetail]"
fallout.event_log.triage_wall.detail.children_success: "The children's ward received full courses and preserved the shelter's youngest households."
fallout.event_log.triage_wall.detail.children_partial: "The children's ward prevented the worst cases, but outer rooms waited through the coldest night."
fallout.event_log.triage_wall.detail.children_failure: "The children's ward ran out of measured courses and the Deaths register carried the cost."
fallout.event_log.triage_wall.detail.workers_success: "The workshop ward returned skilled hands to reclamation crews and kept a repair route open."
fallout.event_log.triage_wall.detail.workers_partial: "The workshop ward saved one route while outer salvage teams lost hours to fever."
fallout.event_log.triage_wall.detail.workers_failure: "The workshop ward could not return its crews and the production ledger recorded the loss."
fallout.event_log.triage_wall.detail.soldiers_success: "The guard ward restored patrol leaders and stretcher teams without stripping shelters bare."
fallout.event_log.triage_wall.detail.soldiers_partial: "The guard ward rebuilt a thin patrol reserve and left convoy protection limited."
fallout.event_log.triage_wall.detail.soldiers_failure: "The guard ward lost its patrol roster and the Deaths register reached the barracks."
fallout.event_log.triage_wall.detail.equal_success: "The equal-chance draw survived public inspection and became a recognized shelter rule."
fallout.event_log.triage_wall.detail.equal_partial: "The equal-chance draw kept the clinic open, although the medicine ran thin before every bed was reached."
fallout.event_log.triage_wall.detail.equal_failure: "The equal-chance draw ended when the last ampoules broke, leaving an equal process with unequal grief."
fallout.event_log.triage_wall.detail.callback_success: "The doctor's callback reopened training and entered the triage rule into the shelter charter."
fallout.event_log.triage_wall.detail.callback_partial: "The doctor's callback produced a usable record while every district marked the unkept promise."
fallout.event_log.triage_wall.detail.callback_failure: "The doctor's callback closed the clinic training table and carried the ward memory into policy."
