l_english:
bio_designate_strategic_raid_staging_state: "Designate Biological Raid Staging Complex"
bio_designate_strategic_raid_staging_state_desc: "Assign a controlled air-base state as the secured complex where strategic biological payloads are stored, inspected, and loaded. Mishandling can expose the complex itself before an operation leaves the ground. Relocation is locked for §Y[?constant:bio_strategic_raid_staging.relocation_cooldown_days|.0] days§! while the designated complex remains valid."
bio_designate_strategic_raid_staging_state_target_tt: "The selected state must be controlled by us, inhabited, outside wasteland conditions, and contain both an air base and functioning infrastructure. It cannot already be our designated staging complex."
bio_strategic_raid_staging_required_tt: "We must designate a valid Biological Raid Staging Complex."
bio_strategic_raid_policy_required_tt: "Our CBRN Use Policy must authorize strategic release, or retaliation must have been formally activated under Retaliation Authority."
bio_strategic_raid_staging_invalid_tt: "The designated staging complex must remain controlled and inhabited, contain an air base, and have functioning infrastructure."
raid_target_name_biological_state: "Strategic biological operation over $LOCATION$"
bio_strategic_raid_target_available_tt: "The selected state must be inhabited, outside wasteland and zombie control, and controlled by an enemy at war with us. Faction partners and subject-overlord pairs cannot be targeted."
bio_strategic_raid_preparation_available_tt: "A valid Biological Raid Staging Complex and strategic-release authority are required before preparations can begin."
bio_strategic_raid_launch_available_tt: "The target, strategic-release authority, and designated staging complex must remain valid when the operation launches."
bio_strategic_raid_context_rejected_actor_tt: "The reserved payload is lost because the operation no longer has valid release authority, staging, or eligible target conditions. No biological release or biological-consequence record is created."
bio_strategic_raid_context_rejected_target_tt: "The operation cannot establish a valid release into this state. It creates no contamination, biological deaths, evidence, attribution, or Condemnation here."
bio_strategic_raid_anthrax_failure_actor_tt: "The reserved anthrax lot is reconciled after the failed release. Mishandling may instead expose the designated staging complex, while recovered evidence can still bring political consequences."
bio_strategic_raid_anthrax_failure_target_tt: "No target outbreak is assured. If the delivery failed over the target, investigators may recover evidence of the attempted anthrax release."
bio_strategic_raid_anthrax_limited_success_actor_tt: "A successfully established release consumes most of the reserved anthrax lot, returns any unused sealed material, and enters the biological-use, evidence, attribution, and Condemnation records. Failure to establish the release loses the collected lot without creating a biological release or biological-consequence record."
bio_strategic_raid_anthrax_limited_success_target_tt: "If the release is successfully established, a partial anthrax seed enters the selected state and begins incubation. An outbreak is neither immediate nor guaranteed."
bio_strategic_raid_anthrax_success_actor_tt: "The reserved anthrax lot is expended. A successfully established release enters the biological-use, evidence, attribution, and Condemnation records. Failure to establish the release creates no biological release or consequence record."
bio_strategic_raid_anthrax_success_target_tt: "If the release is successfully established, a viable anthrax seed enters the selected state under concealed or detected conditions. It then passes through incubation, and local countermeasures decide what follows."
bio_strategic_raid_anthrax_critical_success_actor_tt: "The reserved anthrax lot is expended. A successfully established high-confidence release leaves biological-use history and the full consequence record in force. Failure to establish the release creates no biological release or consequence record."
bio_strategic_raid_anthrax_critical_success_target_tt: "If the release is successfully established, a strong anthrax seed enters the selected state. Incubation still precedes any outbreak, and detection, containment, and treatment remain decisive."
