l_english:
bio_strategic_raid_policy_required_tt: "Our CBRN Use Policy must authorize strategic release, or retaliation must have been formally activated under Retaliation Authority."
raid_target_name_biological_state: "Strategic biological operation over $LOCATION$"
bio_strategic_raid_target_available_tt: "The selected state must be inhabited, outside wasteland and zombie control, and controlled by an enemy at war with us. Faction partners and subject-overlord pairs cannot be targeted."
bio_strategic_raid_preparation_available_tt: "A controlled handling state with an air base or supply node, eligible target, available payload, and strategic-release authority are required before preparation."
bio_strategic_raid_launch_available_tt: "The selected target and strategic-release authority must remain valid when the operation launches."
bio_strategic_raid_context_rejected_actor_tt: "The reserved payload is lost because release authority, a safe handling location, or the selected target is no longer valid. No biological release is recorded."
bio_strategic_raid_context_rejected_target_tt: "The operation cannot establish a valid release into this state. It creates no contamination, biological deaths, evidence, attribution, or Condemnation here."
bio_strategic_raid_anthrax_failure_actor_tt: "The reserved anthrax lot is expended after the failed raid. Mishandling may expose an internal handling location, while recovered evidence can still bring political consequences."
bio_strategic_raid_anthrax_failure_target_tt: "No target outbreak is assured. If the delivery failed over the target, investigators may recover evidence of the attempted anthrax release."
bio_strategic_raid_anthrax_limited_success_actor_tt: "The reserved anthrax lot is expended. A viable partial release enters the biological-use, evidence, attribution, and Condemnation records; an invalid release creates no biological episode."
bio_strategic_raid_anthrax_limited_success_target_tt: "If the release is successfully established, a partial anthrax seed enters the selected state and begins incubation. An outbreak is neither immediate nor guaranteed."
bio_strategic_raid_anthrax_success_actor_tt: "The reserved anthrax lot is expended. A successfully established release enters the biological-use, evidence, attribution, and Condemnation records. Failure to establish the release creates no biological release or consequence record."
bio_strategic_raid_anthrax_success_target_tt: "If the release is successfully established, a viable anthrax seed enters the selected state under concealed or detected conditions. It then passes through incubation, and local countermeasures decide what follows."
bio_strategic_raid_anthrax_critical_success_actor_tt: "The reserved anthrax lot is expended. A successfully established high-confidence release leaves biological-use history and the full consequence record in force. Failure to establish the release creates no biological release or consequence record."
bio_strategic_raid_anthrax_critical_success_target_tt: "If the release is successfully established, a strong anthrax seed enters the selected state. Incubation still precedes any outbreak, and detection, containment, and treatment remain decisive."
