l_english:
bio_strategic_raid_policy_required_tt: "Our CBRN Use Policy must authorize strategic release, or retaliation must have been formally activated under Retaliation Authority."
raid_target_name_biological_state: "Strategic biological operation over $LOCATION$"
bio_strategic_raid_target_available_tt: "The selected state must be inhabited, outside wasteland and zombie control, and controlled by an enemy at war with us. Faction partners and subject-overlord pairs cannot be targeted."
bio_strategic_raid_preparation_available_tt: "A controlled handling state with an air base or supply node, eligible target, available payload, and strategic-release authority are required before preparation."
bio_strategic_raid_launch_available_tt: "The selected target and strategic-release authority must remain valid when the operation launches."
bio_strategic_raid_context_rejected_actor_tt: "The raid cannot release its payload because its authority, handling state, or target is no longer valid."
bio_strategic_raid_context_rejected_target_tt: "No biological agent is released in this state."
bio_strategic_raid_anthrax_failure_actor_tt: "Failed delivery can leave evidence of the attempted anthrax attack and bring Condemnation. Mishandling may spread anthrax inside our country."
bio_strategic_raid_anthrax_failure_target_tt: "Failed delivery may leave evidence of an attempted anthrax release here. Mishandling may spread anthrax in the raiding country instead."
bio_strategic_raid_anthrax_limited_success_actor_tt: "A partial anthrax release may seed the target state. Evidence can expose us and bring Condemnation."
bio_strategic_raid_anthrax_limited_success_target_tt: "A partial anthrax release can begin incubation here. Local detection and containment may stop an outbreak."
bio_strategic_raid_anthrax_success_actor_tt: "An anthrax release may take hold unnoticed or be detected. Evidence can identify us and bring Condemnation."
bio_strategic_raid_anthrax_success_target_tt: "Anthrax can begin incubation here, concealed or detected. Early detection and containment can limit casualties."
bio_strategic_raid_anthrax_critical_success_actor_tt: "A strong anthrax release can take hold in the target state. Evidence can identify us and bring Condemnation."
bio_strategic_raid_anthrax_critical_success_target_tt: "A strong anthrax release can begin incubation here. Detection, containment, and treatment may still limit the outbreak."
