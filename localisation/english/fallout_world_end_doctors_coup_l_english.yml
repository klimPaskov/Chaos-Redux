l_english:
  chaosx.fallout.705.t: "The Doctor's Coup"
  chaosx.fallout.705.d: "Dr. Mara Venn's clinic board has refused the civil council's quarantine timetable. The physicians say the permit crisis left infection decisions to exhausted ward clerks. The council says the doctors are using public health to take the state. The Ash Ward Hospital is the last place where both sides still meet."
  chaosx.fallout.705.a: "Accept medical rule"
  chaosx.fallout.705.a.tt: "Spend Food, Medicine, and Recognition to place the medical board above the civil council. A successful settlement changes the Quarantine State into a technate and strengthens public health, but a partial settlement leaves both authorities armed with competing orders."
  chaosx.fallout.705.b: "Build a medical coalition"
  chaosx.fallout.705.b.tt: "Spend Medicine, Fuel, and Recognition to give doctors, ward councils, and civil officers a shared emergency cabinet. This protects the clinic network while making every decision slower and more visible."
  chaosx.fallout.705.c: "Arrest the medical leadership"
  chaosx.fallout.705.c.tt: "Spend Food, Scrap, and Recognition to seize the clinic board and reopen the council's chain of command. The operation can restore civil control, but a failed arrest risks a hospital strike and a public-health breach."
  chaosx.fallout.705.e: "Call a public vote"
  chaosx.fallout.705.d.tt: "Spend Medicine, Fuel, and Power to hold a ward vote under winter lighting. A mandate can settle the dispute in public, while a contested count leaves the clinic and council claiming the same authority."
  chaosx.fallout.707.t: "The White Coat Challenge"
  chaosx.fallout.707.tech.success.d: "The civil council signed the hospital charter and accepted medical rule. Clinic orders now carry state authority, and the Quarantine State has entered a technate arrangement that keeps infection records above factional bargaining."
  chaosx.fallout.707.tech.partial.d: "The council granted the doctors emergency powers but kept the ward keys. Hospitals obey the board on fever cases and the civil office on movement, so every new patient can reopen the constitutional dispute."
  chaosx.fallout.707.tech.failure.d: "The medical board could not turn its ward charts into a government. Clerks hid the patient lists, guards withdrew from the hospital doors, and the council's failed compromise left the quarantine line without one command."
  chaosx.fallout.707.coalition.success.d: "Doctors, ward delegates, and civil officers signed one cabinet minute beside the ash-burned dispensary. The medical board gained a formal seat, the council kept civilian oversight, and the clinic network received a common supply schedule."
  chaosx.fallout.707.coalition.partial.d: "The coalition agreed on fever treatment but not on who could close a road. Two wards followed the hospital board and two followed the civil office, leaving the Quarantine State with a workable clinic and a contested border rule."
  chaosx.fallout.707.coalition.failure.d: "The coalition meeting ended when the fuel lamps failed and the patient register was carried away. Doctors blamed the council, delegates blamed the board, and the hospital became a separate authority in everything but name."
  chaosx.fallout.707.arrest.success.d: "Civil guards entered the Ash Ward Hospital with a signed warrant and found the board waiting. The doctors were removed without a firefight, the clinic books were sealed, and the council reclaimed a single chain of command for the winter response."
  chaosx.fallout.707.arrest.partial.d: "The arrest removed the loudest medical officers but left their ward captains in place. The council controls the central hospital, while outlying clinics keep their own lists and decide which orders count."
  chaosx.fallout.707.arrest.failure.d: "The arrest party reached the hospital after the medical board had moved its patients and records into the snow tunnels. The council lost the confrontation, and every clinic now treats the warrant as proof that the state will use force against care."
  chaosx.fallout.707.vote.success.d: "Ward delegates counted the vote under the hospital's green lamps. The result gave the civil council a public mandate, protected the medical board's treatment authority, and placed the quarantine timetable in a record that every district could read."
  chaosx.fallout.707.vote.partial.d: "The vote was accepted in the central wards and disputed in the outer camps. The council has a mandate where the lamps stayed lit, while the medical board still controls the roads where the count could not be witnessed."
  chaosx.fallout.707.vote.failure.d: "The vote collapsed when the last fuel allotment was diverted to the hospital boilers. Ballot lists froze in the ward office, the doctors declared an emergency, and the council could not prove that its order reached the people it meant to govern."
  chaosx.fallout.707.a: "Record the hospital settlement"
  chaosx.fallout.707.a.tt: "Record the chosen settlement and its delayed review in the Quarantine State's cause memory. A later hospital review will test whether the new authority survived another winter."
  chaosx.fallout.709.t: "The Hospital Answers"
  chaosx.fallout.709.success.d: "Eight months later, the hospital charter still answers to one public record. Fever teams share their reports with the civil office, and the Quarantine State can close a road without turning every clinic into a rival government."
  chaosx.fallout.709.partial.d: "The settlement survives where medicine and power remain steady. The central hospital follows the written rule, while remote clinics still keep private lists that can become a second authority during the next outbreak."
  chaosx.fallout.709.failure.d: "The settlement broke under fatigue and missing records. The medical board and civil council now issue separate orders, and each ward must decide whether a hospital seal or a public vote grants the right to close its road."
  chaosx.fallout.709.a: "Close the hospital review"
  chaosx.fallout.709.a.tt: "Release the delayed cleanup receipt and preserve the Quarantine State's memory of the medical power struggle."
  fallout.event_log.doctors_coup.name: "The Doctor's Coup"
  fallout.event_log.doctors_coup.detail: "[GetFalloutEvent705EventLogDetail]"
  fallout.event_log.doctors_coup.detail.choice_accept_technocratic_rule: "The Quarantine State accepted medical rule after the Ash Ward Hospital challenged the civil council."
  fallout.event_log.doctors_coup.detail.choice_build_medical_coalition: "The Quarantine State formed a medical coalition between doctors, ward delegates, and civil officers."
  fallout.event_log.doctors_coup.detail.choice_arrest_medical_leadership: "The Quarantine State arrested its medical leadership and reopened the civil chain of command."
  fallout.event_log.doctors_coup.detail.choice_public_vote: "The Quarantine State called a public vote under the hospital's winter lamps."
  fallout.event_log.doctors_coup.detail.accept_technocratic_rule_success: "Medical rule became the state's formal authority and the clinic network received one command."
  fallout.event_log.doctors_coup.detail.accept_technocratic_rule_partial: "Medical rule received emergency powers while ward offices retained competing authority."
  fallout.event_log.doctors_coup.detail.accept_technocratic_rule_failure: "The medical board failed to turn its patient charts into a government."
  fallout.event_log.doctors_coup.detail.build_medical_coalition_success: "A signed cabinet minute joined the hospital board to civilian oversight."
  fallout.event_log.doctors_coup.detail.build_medical_coalition_partial: "The coalition agreed on treatment but left road closures under rival orders."
  fallout.event_log.doctors_coup.detail.build_medical_coalition_failure: "The coalition failed when the hospital register and fuel lamps disappeared."
  fallout.event_log.doctors_coup.detail.arrest_medical_leadership_success: "Civil guards removed the medical board without a firefight and sealed its clinic books."
  fallout.event_log.doctors_coup.detail.arrest_medical_leadership_partial: "The central board was arrested while outer clinics retained their own lists."
  fallout.event_log.doctors_coup.detail.arrest_medical_leadership_failure: "The medical board escaped through the snow tunnels and turned the warrant into a grievance."
  fallout.event_log.doctors_coup.detail.public_vote_success: "Ward delegates gave the civil council a witnessed mandate and kept treatment authority public."
  fallout.event_log.doctors_coup.detail.public_vote_partial: "The central wards accepted the vote while outer camps disputed the count."
  fallout.event_log.doctors_coup.detail.public_vote_failure: "The vote collapsed when the hospital boilers took the last fuel allotment."
  fallout.event_log.doctors_coup.detail.callback_success: "The hospital charter survived another winter and remained answerable to one public record."
  fallout.event_log.doctors_coup.detail.callback_partial: "The settlement survived in the central hospital while remote clinics kept private lists."
  fallout.event_log.doctors_coup.detail.callback_failure: "The medical settlement broke into separate hospital and civil orders."
  fallout.event_log.doctors_coup.detail.cancelled: "The medical power struggle was cancelled before its delayed settlement and its reserved memory was released."
  fallout_doctors_coup_result_success: "Medical settlement established"
  fallout_doctors_coup_result_partial: "Medical settlement contested"
  fallout_doctors_coup_result_failed: "Medical settlement failed"
  fallout_doctors_coup_callback_settled: "Hospital authority consolidated"
  fallout_doctors_coup_callback_partial: "Hospital authority divided"
  fallout_doctors_coup_callback_failed: "Hospital authority breached"
