l_english:
 africa_world_package.700.t: "A Continental Convention"
 africa_world_package.700.d: "A neighbouring continental government has asked whether shared institutions can protect both sovereignties. The answer must be voluntary and public."
 africa_world_package.700.a: "Accept the invitation"
 africa_world_package.700.b: "Return counterterms"
 africa_world_package.700.c: "Decline the convention"
 africa_world_package.701.t: "The Partner's Mandate"
 africa_world_package.701.d: "The partner has accepted a convention in principle. Our cabinet must decide whether to place the question before both constituent assemblies."
 africa_world_package.701.a: "Authorize the ballots"
 africa_world_package.701.b: "Withdraw the proposal"
 africa_world_package.702.t: "The Host Assembly Ballot"
 africa_world_package.702.d: "The convention is before the members who consented to our package. Each assembly records its own answer."
 africa_world_package.702.a: "Approve the compact"
 africa_world_package.702.b: "Abstain for now"
 africa_world_package.702.c: "Reject the compact"
 africa_world_package.703.t: "The Partner Assembly Ballot"
 africa_world_package.703.d: "The partner's consenting members are voting separately. Their answer will stand beside our own."
 africa_world_package.703.a: "Approve the compact"
 africa_world_package.703.b: "Abstain for now"
 africa_world_package.703.c: "Reject the compact"
 africa_world_package.704.t: "A Shared Constitution"
 africa_world_package.704.d: "Both ballots have met the voluntary threshold. The proposed constitution distributes authority without erasing either government."
 africa_world_package.704.a: "Ratify the constitution"
 africa_world_package.704.b: "Ask for a final review"
 africa_world_package.704.c: "End the convention"
 africa_world_package.705.t: "The Command Question"
 africa_world_package.705.d: "The two governments must settle how their factions and commanders will coexist. A union cannot hide a conflict of mandates."
 africa_world_package.705.a: "Recognize distributed command"
 africa_world_package.705.b: "Refuse the arrangement"
 africa_world_package.706.t: "A Defensive Clause"
 africa_world_package.706.d: "The constitution is ready for a mutual defence clause. It promises consultation before either government is drawn into a continental war."
 africa_world_package.706.a: "Ratify the defence clause"
 africa_world_package.706.b: "Keep the clause open"
 africa_world_package.707.t: "The Resource Ledger"
 africa_world_package.707.d: "Shared infrastructure requires a transparent resource ledger. The clause protects local control while opening common reserves."
 africa_world_package.707.a: "Ratify the resource clause"
 africa_world_package.707.b: "Keep the ledger open"
 africa_world_package.708.t: "The Right of Withdrawal"
 africa_world_package.708.d: "Every member must retain a lawful route out of the convention. The withdrawal clause is the last safeguard before activation."
 africa_world_package.708.a: "Ratify the withdrawal clause"
 africa_world_package.708.b: "Delay activation"
 africa_world_package.709.t: "Strain in the Union"
 africa_world_package.709.d: "The shared institutions are under strain. The governments can repair the compact, accept a deeper dispute, or begin a lawful dissolution."
 africa_world_package.709.a: "Renegotiate the compact"
 africa_world_package.709.b: "Hold the line"
 africa_world_package.709.c: "Open dissolution talks"
 africa_world_package.710.t: "Counterterms from the Partner"
 africa_world_package.710.d: "The partner has returned a narrower mandate. Acceptance preserves the convention. Refusal closes it without coercion."
 africa_world_package.710.a: "Accept the counterterms"
 africa_world_package.710.b: "Close the convention"
 africa_world_package.711.t: "The Host's Dissolution Vote"
 africa_world_package.711.d: "The host assembly is considering a peaceful dissolution. Its approval must be recorded independently of the partner's vote."
 africa_world_package.711.a: "Approve dissolution"
 africa_world_package.711.b: "Keep the union together"
 africa_world_package.712.t: "The Partner's Dissolution Vote"
 africa_world_package.712.d: "The partner must decide whether the treaty can be ended peacefully. A contested answer may break the rival compact by force."
 africa_world_package.712.a: "Approve dissolution"
 africa_world_package.712.b: "Contest the dissolution"
 africa_world_package.713.t: "The Convention Is Closed"
 africa_world_package.713.d: "Both governments have recorded the treaty's disposition. The continental relationship returns to its own constitutional paths."
 africa_world_package.713.a: "Record the settlement"
 africa_world_package.714.t: "A Constitutional Reconsideration"
 africa_world_package.714.d: "The assemblies have asked for one more reading of the constitutional text."
 africa_world_package.714.a: "Return to the text"
 africa_world_package.715.t: "An Unfinished Clause"
 africa_world_package.715.d: "One of the safeguard clauses remains open."
 africa_world_package.715.a: "Continue the negotiations"
 africa_world_package.716.t: "The Compact Is Contested"
 africa_world_package.716.d: "A dissolution vote has become a dispute between sovereign governments."
 africa_world_package.716.a: "Prepare the record"
 africa_world_package.717.t: "The Union Dissolves"
 africa_world_package.717.d: "The treaty has ended by consent. Its members keep the memory of the experiment and the right to choose their next course."
 africa_world_package.717.a: "Close the ledger"
 africa_world_package.718.t: "A Further Strain"
 africa_world_package.718.d: "The union's institutions have accumulated another grievance."
 africa_world_package.718.a: "Register the grievance"
 africa_world_package.719.t: "The Partner Declines"
 africa_world_package.719.d: "The partner has declined the convention. No government has been compelled to join it."
 africa_world_package.719.a: "End the proposal"

 africa_world_package.720.t: "The Continental Ultimatum"
 africa_world_package.720.d: "A rival package has demanded a constitutional settlement. We can accept a sovereign armistice, reject the demand, or ask the attacker to hear counterterms."
 africa_world_package.720.a: "Accept the settlement"
 africa_world_package.720.b: "Reject the ultimatum"
 africa_world_package.720.c: "Return counterterms"
 africa_world_package.721.t: "A Call to the Registered Partners"
 africa_world_package.721.d: "The war record lists this government as a registered partner. It must choose whether to join, send material support, or remain neutral."
 africa_world_package.721.a: "Join the war"
 africa_world_package.721.b: "Send material support"
 africa_world_package.721.c: "Remain neutral"
 africa_world_package.722.t: "The Partner's Answer"
 africa_world_package.722.d: "The partner's response has been entered in the continental war record."
 africa_world_package.722.a: "Acknowledge the answer"
 africa_world_package.723.t: "The Continental War Opens"
 africa_world_package.723.d: "The registered dispute has become an open war with a defined constitutional objective."
 africa_world_package.723.a: "Issue the order"
 africa_world_package.724.t: "An Armistice Offer"
 africa_world_package.724.d: "The attacker has offered an armistice that leaves the constitutional question recorded rather than erased."
 africa_world_package.724.a: "Accept the armistice"
 africa_world_package.724.b: "Reject the armistice"
 africa_world_package.725.t: "A Settlement Is Recorded"
 africa_world_package.725.d: "The war's disposition has been recorded by both sides."
 africa_world_package.725.a: "Seal the record"
 africa_world_package.726.t: "The Rival Has Fallen"
 africa_world_package.726.d: "The defender has capitulated. The victor must choose between an armistice, a constitutional submission, constituent release, or a formal successor review."
 africa_world_package.726.a: "Offer an armistice"
 africa_world_package.726.b: "Accept a confederal submission"
 africa_world_package.726.c: "Release the constituents"
 africa_world_package.726.review: "Open the defeated review"
 africa_world_package.727.t: "Terms for the Defeated Package"
 africa_world_package.727.d: "The battlefield has ended the old compact. The settlement must state what remains sovereign and what must be rebuilt."
 africa_world_package.727.a: "Offer an armistice"
 africa_world_package.727.b: "Impose constitutional submission"
 africa_world_package.727.c: "Release the constituents"
 africa_world_package.727.review: "Open the defeated review"
 africa_world_package.728.t: "Sovereignty Survives the Armistice"
 africa_world_package.728.d: "The armistice preserves a sovereign constitutional path while keeping the rivalry visible."
 africa_world_package.728.a: "Record the armistice"
 africa_world_package.729.t: "A Confederal Submission"
 africa_world_package.729.d: "The defeated package has accepted a confederal settlement under a recorded constitutional mandate."
 africa_world_package.729.a: "Record the submission"
 africa_world_package.730.t: "Constituents Regain Their Choice"
 africa_world_package.730.d: "The settlement releases the package's constituent governments and records their withdrawal from the defeated compact."
 africa_world_package.730.a: "Record the release"
 africa_world_package.731.t: "Counterterms on the Battlefield"
 africa_world_package.731.d: "The defender's counterterms can lead to an armistice or a renewed opening of hostilities."
 africa_world_package.731.a: "Accept the counterterms"
 africa_world_package.731.b: "Renew the war"
 africa_world_package.732.t: "A Defeated Review Is Pending"
 africa_world_package.732.d: "The defeated package still requires a constitutional disposition."
 africa_world_package.732.a: "Await the review"
 africa_world_package.733.t: "The Settlement Collapses"
 africa_world_package.733.d: "Neither side has produced a durable constitutional settlement."
 africa_world_package.733.a: "Record the collapse"
 africa_world_package.734.t: "The Continental Settlement Is Recorded"
 africa_world_package.734.d: "The continental war is settled. Outstanding partner invitations and pending reviews are closed, and its result remains in the political record."
 africa_world_package.734.a: "Acknowledge the settlement"
 africa_world_package.735.t: "The War Is Closed"
 africa_world_package.735.d: "The continental war protocol has ended and its disposition remains available to the political record."
 africa_world_package.735.a: "Continue"
 africa_world_package.736.t: "A Rivalry Remains"
 africa_world_package.736.d: "The armistice has stopped the fighting without erasing the memory of the dispute."
 africa_world_package.736.a: "Remember the terms"
 africa_world_package.737.t: "Autonomy After Release"
 africa_world_package.737.d: "The released constituents are rebuilding their own institutions."
 africa_world_package.737.a: "Recognize their autonomy"
 africa_world_package.738.t: "Return to the Settlement Table"
 africa_world_package.738.d: "The constitutional question remains open after the first exchange of terms."
 africa_world_package.738.a: "Offer another armistice"
 africa_world_package.739.t: "A Continental War Epilogue"
 africa_world_package.739.d: "The final disposition is entered in the world order record."
 africa_world_package.739.a: "Close the chapter"

 africa_world_package.740.t: "The Defeated Package Review"
 africa_world_package.740.d: "A successor may carry the package forward. If no valid successor exists, the government in exile or the remaining constituents must receive a lawful disposition."
 africa_world_package.740.a: "Accept the nominated successor"
 africa_world_package.740.b: "Certify the exile path"
 africa_world_package.740.c: "Certify the breakup"
 africa_world_package.741.t: "Exile Certification"
 africa_world_package.741.d: "The government in exile has a valid path to preserve its constitutional memory."
 africa_world_package.741.a: "Certify the exile"
 africa_world_package.742.t: "Breakup Certification"
 africa_world_package.742.d: "No successor can lawfully receive the package. Its constituent governments will return to separate sovereignty."
 africa_world_package.742.a: "Certify the breakup"
 africa_world_package.743.t: "A Successor Continues the Record"
 africa_world_package.743.d: "The nominated successor has received the package's constitutional mandate through the established transfer."
 africa_world_package.743.a: "Recognize the continuation"
 africa_world_package.744.t: "The Exile Path Is Recorded"
 africa_world_package.744.d: "The exile government remains part of the constitutional record without forcing a new territorial settlement."
 africa_world_package.744.a: "Record the exile"
 africa_world_package.745.t: "The Package Breaks Up"
 africa_world_package.745.d: "The old package has ended. Its constituent governments will carry forward their own choices."
 africa_world_package.745.a: "Record the breakup"
 africa_world_package.746.t: "A Predecessor Is Replaced"
 africa_world_package.746.d: "The predecessor's authority has passed to the receiving government."
 africa_world_package.746.a: "Acknowledge the transfer"
 africa_world_package.747.t: "The Successor Is Registered"
 africa_world_package.747.d: "The successor now stands in the package roster with its inherited constitutional record."
 africa_world_package.747.a: "Continue"
 africa_world_package.748.t: "A Terminal Disposition Is Recorded"
 africa_world_package.748.d: "The package's final disposition is available for the actor-by-actor political review."
 africa_world_package.748.a: "Continue"
 africa_world_package.749.t: "The Review Closes"
 africa_world_package.749.d: "The successor, exile, or breakup path has reached a recorded conclusion."
 africa_world_package.749.a: "Close the review"

 africa_world_package.750.t: "One Continental Mandate"
 africa_world_package.750.d: "The terminal union review asks every installed package actor to approve the shared political identity without surrendering its own constitutional proof."
 africa_world_package.750.a: "Approve the union"
 africa_world_package.750.b: "Refuse the union"
 africa_world_package.751.t: "The Unanimous Review Continues"
 africa_world_package.751.d: "Not every actor has answered the terminal union review."
 africa_world_package.751.a: "Await the remaining mandates"
 africa_world_package.752.t: "Unanimous Political Proof"
 africa_world_package.752.d: "Every actor has approved the union and met the voluntary constituent standard. The host may record the political proof."
 africa_world_package.752.a: "Record the proof"
 africa_world_package.753.t: "The Last Standing Proof"
 africa_world_package.753.d: "The terminal review asks this actor to prove its final constitutional disposition."
 africa_world_package.753.a: "Confirm the disposition"
 africa_world_package.753.b: "Reject the review"
 africa_world_package.754.t: "An Actor Rejects the Proof"
 africa_world_package.754.d: "The terminal review cannot close while one actor rejects its disposition."
 africa_world_package.754.a: "Record the rejection"
 africa_world_package.755.t: "Last-Standing Political Review"
 africa_world_package.755.d: "Every actor has supplied a terminal disposition and the sovereign count is sufficient for a final political review."
 africa_world_package.755.a: "Record the proof"
 africa_world_package.756.t: "The Political Handoff"
 africa_world_package.756.d: "The political proof is complete. The separate terminal identity package may now decide whether to proceed."
 africa_world_package.756.a: "Prepare the handoff"
 africa_world_package.757.t: "The Terminal Review Is Blocked"
 africa_world_package.757.d: "A government has refused the terminal protocol. The proof remains historical and the review can be reopened after new consent."
 africa_world_package.757.a: "Keep the record and retry later"
 africa_world_package.758.t: "Retry the Terminal Review"
 africa_world_package.758.d: "The host can reopen a unanimous union review or ask each actor for a last-standing disposition."
 africa_world_package.758.a: "Reopen the unanimous review"
 africa_world_package.758.b: "Open the last-standing review"
 africa_world_package.759.t: "Terminal Protocol Epilogue"
 africa_world_package.759.d: "The political handoff is ready for the separate identity package."
 africa_world_package.759.a: "Close the protocol"

# Decision and scripted-GUI text reserved for the parent call sites.
 africa_world_open_union_convention: "Open a Union Convention"
 africa_world_open_union_convention_desc: "Invite a second sovereign package actor to a voluntary two-continent convention."
 africa_world_open_union_convention_req: "A valid independent package actor from another continent must be selected."
 africa_world_open_union_convention_effect_tt: "Records bilateral consent before any constituent ballot."
 africa_world_ratify_union_constitution: "Ratify the Union Constitution"
 africa_world_ratify_union_constitution_desc: "Adopt distributed government after both actor approvals and separate constituent ballots."
 africa_world_ratify_union_constitution_effect_tt: "Preserves autonomous partner governments and opens the safeguard clauses."
 africa_world_integrate_union_defence: "Ratify the Defence Clause"
 africa_world_integrate_union_defence_desc: "Commit both governments to consultation before a shared war response."
 africa_world_integrate_union_resource: "Ratify the Resource Clause"
 africa_world_integrate_union_resource_desc: "Open a transparent common resource ledger without erasing local control."
 africa_world_integrate_union_withdrawal: "Ratify the Withdrawal Clause"
 africa_world_integrate_union_withdrawal_desc: "Guarantee a lawful route out of the convention for every constituent."
 africa_world_review_union_strain: "Review Union Strain"
 africa_world_review_union_strain_desc: "Renegotiate institutions when the shared compact accumulates grievances."
 africa_world_dissolve_union_by_treaty: "Dissolve the Union by Treaty"
 africa_world_dissolve_union_by_treaty_desc: "End an active union peacefully when both governments approve."
 africa_world_prepare_continental_war: "Prepare a Continental War Protocol"
 africa_world_prepare_continental_war_desc: "Set the attacker, defender, and war aim before hostilities. Registered partners can be called once the war opens."
 africa_world_call_registered_continental_partners: "Call Registered War Partners"
 africa_world_call_registered_continental_partners_desc: "Call the governments registered for this war to join, send material support, or remain neutral."
 africa_world_offer_continental_armistice: "Offer a Continental Armistice"
 africa_world_offer_continental_armistice_desc: "Stop the war while preserving a visible constitutional settlement."
 africa_world_impose_constitutional_settlement: "Impose a Constitutional Settlement"
 africa_world_impose_constitutional_settlement_desc: "Record confederal submission without annexing the defeated package."
 africa_world_release_contested_constituents: "Release Contested Constituents"
 africa_world_release_contested_constituents_desc: "Restore constituent sovereignty and record each withdrawal."
 africa_world_open_defeated_package_review: "Open the Defeated Package Review"
 africa_world_open_defeated_package_review_desc: "Choose a valid successor, exile path, or breakup certification."
 africa_world_open_unanimous_union_review: "Open the Unanimous Union Review"
 africa_world_open_unanimous_union_review_desc: "Ask every installed actor for an independent approval and voluntary constituent proof."
 africa_world_open_last_standing_review: "Open the Last-Standing Review"
 africa_world_open_last_standing_review_desc: "Ask every actor to prove its terminal political disposition."
 africa_world_commit_terminal_political_proof: "Commit Terminal Political Proof"
 africa_world_commit_terminal_political_proof_desc: "Record the actor-by-actor political proof for the separate identity package."
 africa_world_prepare_terminal_handoff: "Prepare Terminal Handoff"
 africa_world_prepare_terminal_handoff_desc: "Mark the political protocol ready without setting the super-event package gate."
