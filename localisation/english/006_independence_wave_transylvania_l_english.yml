 TRA_independence_wave_federal_council: "Transylvanian Federal Council"
 TRA_independence_wave_federal_council_long: "Transylvanian Federal Council"
 TRA_independence_wave_workers_rail_council: "Workers and Rail Council"
 TRA_independence_wave_workers_rail_council_long: "Transylvanian Workers and Rail Council"
 TRA_independence_wave_border_communes: "Border Communes League"
 TRA_independence_wave_border_communes_long: "Transylvanian Border Communes League"
 TRA_independence_wave_frontier_commission: "Carpathian Frontier Commission"
 TRA_independence_wave_frontier_commission_long: "Carpathian Frontier Security Commission"
 TRA_independence_wave_patron_compact: "Danube Patron Compact"
 TRA_independence_wave_patron_compact_long: "Transylvanian Danube Patron Compact"

 tra_divided_border_authority: "Divided Border Authority"
 tra_divided_border_authority_desc: "The new administration must keep mountain roads, mixed districts, and defecting units aligned while its institutions are still being negotiated."
 tra_danube_settlement: "Danube Settlement"
 tra_danube_settlement_desc: "A durable federal settlement binds the mountain anchor to its river routes and gives every recognised district a stake in the state."
 tra_federal_council_charter: "Federal Council Charter"
 tra_federal_council_charter_desc: "Delegates from the compact territory share authority over recognition, taxation, and the treatment of local communities."
 tra_workers_and_rail_council: "Workers and Rail Council"
 tra_workers_and_rail_council_desc: "Workshops and railway crews coordinate production and transport through a council that answers to the released state."
 tra_border_communes_compact: "Border Communes Compact"
 tra_border_communes_compact_desc: "Municipal agreements and local obligations keep the frontier supplied while the state negotiates its place among its neighbours."
 tra_frontier_security_commission: "Frontier Security Commission"
 tra_frontier_security_commission_desc: "A central commission screens armed formations and concentrates scarce equipment on the mountain approaches."
 tra_patron_trade_compact: "Danube Patron Trade Compact"
 tra_patron_trade_compact_desc: "A negotiated patron relationship opens trade and supplies while imposing obligations on the new government."

 independence_wave_tra_danube_council_category: "Transylvanian Danube Council"
 independence_wave_tra_danube_council_category_desc: "The council coordinates the frontier, the assembly, and the former host settlement while the compact remains fragile."
 independence_wave_tra_hold_border_council_together: "Hold the Border Council Together"
 independence_wave_tra_hold_border_council_together_desc: "The first council must keep municipal delegates, railway officers, and mountain guards inside one provisional authority."
 independence_wave_tra_secure_carpathian_depots: "Secure the Carpathian Depots"
 independence_wave_tra_secure_carpathian_depots_desc: "Recover stores along the mountain roads and place them under a common register. Administrative capacity and a civilian factory commitment are required."
 independence_wave_tra_screen_defecting_regulars: "Screen the Defecting Regulars"
 independence_wave_tra_screen_defecting_regulars_desc: "Vetted defectors can strengthen the opening force, but every formation must accept the federal commission before it receives the compact's supplies."
 independence_wave_tra_convene_multiethnic_assembly: "Convene the Multiethnic Assembly"
 independence_wave_tra_convene_multiethnic_assembly_desc: "Bring the compact's communities into one assembly with explicit rights and a shared rail and tax register."
 independence_wave_tra_settle_former_host_ledgers: "Settle the Former Host Ledgers"
 independence_wave_tra_settle_former_host_ledgers_desc: "Negotiate property, recognition, population, and border obligations with the state that released Transylvania."
 independence_wave_tra_ratify_federal_charter: "Ratify the Federal Charter"
 independence_wave_tra_ratify_federal_charter_desc: "Give the assembly authority to settle the compact and make a constitutional government responsible to its districts."
 independence_wave_tra_convene_workers_and_rail_council: "Convene the Workers and Rail Council"
 independence_wave_tra_convene_workers_and_rail_council_desc: "Place workshops and railway crews under a council that can meet the army's material demands without dissolving local authority."
 independence_wave_tra_restore_border_communes: "Restore the Border Communes"
 independence_wave_tra_restore_border_communes_desc: "Renew the local compacts that protect the mountain roads and keep the frontier supplied through a traditional settlement."
 independence_wave_tra_establish_frontier_commission: "Establish the Frontier Commission"
 independence_wave_tra_establish_frontier_commission_desc: "Put the emergency chain of command above factional units and prepare the compact for a hard border war."
 independence_wave_tra_accept_patron_compact: "Accept the Danube Patron Compact"
 independence_wave_tra_accept_patron_compact_desc: "Trade sovereignty obligations for supplies, recognition, and access to the river corridor."
 independence_wave_tra_codify_danube_settlement: "Codify the Danube Settlement"
 independence_wave_tra_codify_danube_settlement_desc: "A stable authority, a recognised border, and an integrated mountain force can turn the liberation into a durable state."
 independence_wave_tra_open_danube_network: "Open the Danube Network"
 independence_wave_tra_open_danube_network_desc: "Use the league's channels to exchange supplies, officers, and recognition with other states that survived the wave."

 independence_wave_tra_project_failure_effect_tt: "The frontier and federal ledgers fall as the provisional authority loses control of the compact."
 independence_wave_tra_depots_effect_tt: "Secured depots improve frontier cohesion and administrative capacity."
 independence_wave_tra_defectors_effect_tt: "The screened defectors strengthen the opening force and improve security."
 independence_wave_tra_assembly_effect_tt: "The assembly raises federal legitimacy and gives the compact a public settlement."
 independence_wave_tra_host_ledgers_effect_tt: "The former host ledger is settled through border, property, population, and recognition concessions."
 independence_wave_tra_route_effect_tt: "The selected government route becomes the active authority and changes the compact's public ledgers."
independence_wave_tra_sovereignty_effect_tt: "Transylvania secures durable sovereignty. Legitimacy, recognition, state capacity, and security rise as instability falls."
 independence_wave_tra_network_effect_tt: "The Danube network strengthens league standing, common cause, and member confidence."
