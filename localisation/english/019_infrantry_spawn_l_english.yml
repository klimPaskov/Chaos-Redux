infantry_spawn_seal_selected_family_breach_decision: "Seal a Family Breach"
infantry_spawn_seal_selected_family_breach_decision_desc: "Surround the selected host's compromised sites, restore its bindings, and break the command cells preparing a revolt."
infantry_spawn_seal_selected_family_breach_tt: "Attempts immediate containment, sharply reducing family pressure and interrupting a developing breach."
infantry_spawn_seal_selected_family_breach_cost: "£pol_power §Y[?constant:infantry_spawn_family_management_cost.containment_political_power|0]§!  £command_power §Y[?constant:infantry_spawn_family_management_cost.containment_command_power|0]§!  £support_equipment_text_icon §Y[?constant:infantry_spawn_family_management_cost.containment_support_equipment|0]§!"

infantry_spawn_disperse_selected_anomalous_lot_decision: "Disperse the Selected Host"
infantry_spawn_disperse_selected_anomalous_lot_decision_desc: "Break the selected anomalous lot into guarded detachments and remove its ability to act as one formation."
infantry_spawn_disperse_selected_anomalous_lot_tt: "Demobilizes the selected anomalous lot, reduces saturation and family pressure, and closes its unresolved obligations."
infantry_spawn_disperse_selected_anomalous_lot_cost: "£command_power §Y[?constant:infantry_spawn_family_management_cost.dispersal_command_power|0]§!  £support_equipment_text_icon §Y[?constant:infantry_spawn_family_management_cost.dispersal_support_equipment|0]§!"

infantry_spawn_achievement_one_battalion_combat_trial: "Stage the One Battalion Trial"
infantry_spawn_achievement_one_battalion_combat_trial_desc: "Isolate one original unbidden battalion on a quiet frontier and test whether it can carry a controlled engagement alone."
infantry_spawn_achievement_one_battalion_combat_trial_tt: "Begins a controlled border trial lasting at least §Y[?constant:infantry_spawn_achievement_combat_trial.minimum_duration_days|0] days§!. The selected formation and one temporary opposing detachment are the only permitted participants. State ownership cannot change. Victory is recognized only if the same mustered formation remains on the sealed roll with its original one-battalion composition."
infantry_spawn_achievement_one_battalion_trial_target_tt: "This state must contain exactly one division owned by this country and no allied or foreign formation. That division must be an original unbidden formation with exactly one combat battalion, at least poor material quality, at least absurd coherence, §Y[?constant:infantry_spawn_achievement_combat_trial_readiness.one_battalion_strength|%0] strength§!, and §Y[?constant:infantry_spawn_achievement_combat_trial_readiness.one_battalion_organization|%0] organization§!. An adjacent state owned and controlled by a peaceful independent foreign country must contain no divisions."
infantry_spawn_achievement_one_battalion_trial_cost: "£army_experience §Y[?constant:infantry_spawn_achievement_combat_trial_cost.one_battalion_army_experience|0]§!  £command_power §Y[?constant:infantry_spawn_achievement_combat_trial_cost.one_battalion_command_power|0]§!"

infantry_spawn_achievement_combined_arms_combat_trial: "Stage the Combined-Arms Trial"
infantry_spawn_achievement_combined_arms_combat_trial_desc: "Give an impossible Evolution III formation a sealed frontier exercise where every mismatched arm must work together."
infantry_spawn_achievement_combined_arms_combat_trial_tt: "Begins a controlled border trial lasting at least §Y[?constant:infantry_spawn_achievement_combat_trial.minimum_duration_days|0] days§!. The selected formation and one temporary opposing detachment are the only permitted participants. State ownership cannot change. Victory is recognized only if the same mustered formation still contains every component entered on its arrival roll."
infantry_spawn_achievement_combined_arms_trial_target_tt: "This state must contain exactly one division owned by this country and no allied or foreign formation. That division must be an original Evolution III random formation with at least §Y[?constant:infantry_spawn_achievement_threshold.combined_arms_distinct_component_types|0] distinct combat-component types§!, at least mixed material quality, at least strained coherence, §Y[?constant:infantry_spawn_achievement_combat_trial_readiness.combined_arms_strength|%0] strength§!, and §Y[?constant:infantry_spawn_achievement_combat_trial_readiness.combined_arms_organization|%0] organization§!. An adjacent state owned and controlled by a peaceful independent foreign country must contain no divisions."
infantry_spawn_achievement_combined_arms_trial_cost: "£army_experience §Y[?constant:infantry_spawn_achievement_combat_trial_cost.combined_arms_army_experience|0]§!  £command_power §Y[?constant:infantry_spawn_achievement_combat_trial_cost.combined_arms_command_power|0]§!"

infantry_spawn_achievement_borrowed_future_combat_trial: "Stage the Borrowed Future Trial"
infantry_spawn_achievement_borrowed_future_combat_trial_desc: "Commit one advanced unbidden formation before the workshops and schools of the country can reproduce what it carries."
infantry_spawn_achievement_borrowed_future_combat_trial_tt: "Begins a controlled border trial lasting at least §Y[?constant:infantry_spawn_achievement_combat_trial.minimum_duration_days|0] days§!. The selected formation and one temporary opposing detachment are the only permitted participants. State ownership cannot change. Victory is accepted only while at least one technology or special project recorded at arrival remains locked."
infantry_spawn_achievement_borrowed_future_trial_target_tt: "This state must contain exactly one division owned by this country and no allied or foreign formation. That division must be an original advanced unbidden formation carrying equipment whose recorded technology or special project remains beyond national reach, with at least mixed material quality, at least strained coherence, §Y[?constant:infantry_spawn_achievement_combat_trial_readiness.borrowed_future_strength|%0] strength§!, and §Y[?constant:infantry_spawn_achievement_combat_trial_readiness.borrowed_future_organization|%0] organization§!. An adjacent state owned and controlled by a peaceful independent foreign country must contain no divisions."
infantry_spawn_achievement_borrowed_future_trial_cost: "£army_experience §Y[?constant:infantry_spawn_achievement_combat_trial_cost.borrowed_future_army_experience|0]§!  £command_power §Y[?constant:infantry_spawn_achievement_combat_trial_cost.borrowed_future_command_power|0]§!"

infantry_spawn_achievement_barracks_of_babel_combat_trial: "Stage the Babel Trial"
infantry_spawn_achievement_barracks_of_babel_combat_trial_desc: "Send the muster column of beasts, bicycles, armor, fire, guns, and engineers through one sealed field test."
infantry_spawn_achievement_barracks_of_babel_combat_trial_tt: "Begins a controlled border trial lasting at least §Y[?constant:infantry_spawn_achievement_combat_trial.minimum_duration_days|0] days§!. The selected formation and one temporary opposing detachment are the only permitted participants. State ownership cannot change. Victory is recognized only if every required element remains in the same mustered formation."
infantry_spawn_achievement_barracks_of_babel_trial_target_tt: "This state must contain exactly one division owned by this country and no allied or foreign formation. That division must be an original Evolution III random formation containing camelry, bicycle infantry, amphibious armor, a flame element, artillery, and engineers, with at least serviceable material quality, at least strained coherence, §Y[?constant:infantry_spawn_achievement_combat_trial_readiness.barracks_of_babel_strength|%0] strength§!, and §Y[?constant:infantry_spawn_achievement_combat_trial_readiness.barracks_of_babel_organization|%0] organization§!. An adjacent state owned and controlled by a peaceful independent foreign country must contain no divisions."
infantry_spawn_achievement_barracks_of_babel_trial_cost: "£army_experience §Y[?constant:infantry_spawn_achievement_combat_trial_cost.barracks_of_babel_army_experience|0]§!  £command_power §Y[?constant:infantry_spawn_achievement_combat_trial_cost.barracks_of_babel_command_power|0]§!"

infantry_spawn_achievement_combat_trial_country_available_tt: "The country must be at peace, independent, outside a civil war or border conflict, and free of another controlled formation trial or its §Y[?constant:infantry_spawn_achievement_combat_trial.cooldown_days|0]-day§! recovery period. The Muster Board and sealed roll-call inspections must remain available."
infantry_spawn_achievement_combat_trial_mission: "Controlled Formation Trial"
infantry_spawn_achievement_combat_trial_mission_desc: "The selected formation is fighting one temporary detachment in a sealed border engagement. The trial is voided if another division enters either state, a state changes hands, either country enters another war, or either formation no longer matches its sealed muster roll."
infantry_spawn_achievement_combat_trial_cancel_tt: "The controlled trial has been voided. No distinction is awarded. The temporary detachment and its locked template are removed without returning manpower or equipment, and the recovery period begins."
infantry_spawn_achievement_combat_trial_timeout_tt: "The controlled trial has exceeded its allotted time. No distinction is awarded. The temporary detachment and its locked template are removed without returning manpower or equipment, and the recovery period begins."

infantry_spawn_formation_roll_call_mission: "Formation Roll Call"
infantry_spawn_formation_roll_call_mission_desc: "Staff officers are counting the selected lot's companies, equipment, and unresolved obligations."
infantry_spawn_standardization_cycle_mission: "Standardization Cycle"
infantry_spawn_standardization_cycle_mission_desc: "The selected cohort is preparing to convert to the National Muster Standard. If the army loses authority to reorganize its formations, the cycle ends with the cohort and its stores unchanged."
infantry_spawn_supervised_demobilization_mission: "Supervised Demobilization"
infantry_spawn_supervised_demobilization_mission_desc: "The selected lot is surrendering weapons under guard. Its formations and unique muster pattern will be checked again before any removal or salvage. If the army loses authority to alter that pattern, the lot remains armed and no stores are returned."
infantry_spawn_training_cycle_mission: "Joint Training Cycle"
infantry_spawn_training_cycle_mission_desc: "The selected lot is drilling beside established formations under one field procedure."
infantry_spawn_muster_districts_mission: "Muster District Organization"
infantry_spawn_muster_districts_mission_desc: "District staffs are mapping every formation lot to an accountable office and supply route."
infantry_spawn_officer_search_mission: "Integration Staff Search"
infantry_spawn_officer_search_mission_desc: "The high command is selecting officers capable of administering the unbidden formations."
infantry_spawn_specialist_preservation_mission: "Specialist Company Preservation"
infantry_spawn_specialist_preservation_mission_desc: "Useful support companies are being separated, retrained, and placed under national cadres."
infantry_spawn_prototype_maintenance_trial_mission: "Prototype Maintenance Trial"
infantry_spawn_prototype_maintenance_trial_mission_desc: "The selected advanced formation remains on the rolls while workshops test whether its finite equipment, replacement parts, and unfamiliar drills can be sustained together."
infantry_spawn_rail_corridor_mission: "Reserved Rail Corridor"
infantry_spawn_rail_corridor_mission_desc: "Trains and fuel have been assigned to a protected route serving the selected lot's origin district."
infantry_spawn_request_cooldown_mission: "Muster Request in Transit"
infantry_spawn_request_cooldown_mission_desc: "The muster is assembling the consequences of the last request. Another call cannot be issued until this interval ends."

infantry_spawn_claimant_category: "Claimants of the Muster"
infantry_spawn_claimant_category_desc: "Commanders born from the unbidden formations are gathering loyal lots, issuing private orders, and demanding rights from the state. Recognition can bind them to government. Every concession gives their authority a firmer foundation."

infantry_spawn_recognize_claimant: "Recognize the Selected Claimant"
infantry_spawn_recognize_claimant_desc: "Grant the selected commander a formal place in the national chain of command before private authority hardens into open defiance."
infantry_spawn_recognize_claimant_requirements_tt: "Requires a live selected claimant who has not submitted an unanswered demand and enough Political Power to issue a formal appointment."
infantry_spawn_recognize_claimant_cost_text: "£pol_power §Y[?constant:infantry_spawn_claimant_response.recognition_political_power|0]§!"
infantry_spawn_recognize_claimant_effect_tt: "Recognizes the selected claimant, grants the §YRecognized Claimant Command§!, and raises the claimant's influence by §Y[?constant:infantry_spawn_claimant_response.recognition_influence_gain|0]§!."

infantry_spawn_accept_claimant_demand: "Accept the Claimant's Demand"
infantry_spawn_accept_claimant_demand_desc: "Meet the selected claimant's current demand and turn another piece of private military power into a recognized right."
infantry_spawn_accept_claimant_demand_requirements_tt: "Requires a pending demand from the selected claimant and the resources or authority demanded."
infantry_spawn_accept_claimant_demand_cost_text: "The selected demand sets its price.\nFormal appointment: no material payment\nEquipment share: £infantry_equipment_text_icon §Y[?constant:infantry_spawn_claimant_cost.equipment_share_infantry_equipment|0]§! and £support_equipment_text_icon §Y[?constant:infantry_spawn_claimant_cost.equipment_share_support_equipment|0]§!\nAutonomous district: £command_power §Y[?constant:infantry_spawn_claimant_cost.autonomous_district_command_power|0]§!\nAnother formation: £army_experience §Y[?constant:infantry_spawn_claimant_cost.another_formation_army_experience|0]§!\nPolitical seat: £pol_power §Y[?constant:infantry_spawn_claimant_cost.political_seat_political_power|0]§!\nEmergency powers: £stability_texticon §Y[?constant:infantry_spawn_claimant_cost.emergency_power_stability|%0]§!\nSubordinate command: £army_experience §Y[?constant:infantry_spawn_generalissimo_cost.subordinate_command_army_experience|0]§! and £command_power §Y[?constant:infantry_spawn_generalissimo_cost.subordinate_command_command_power|0]§!\nParallel command: £pol_power §Y[?constant:infantry_spawn_generalissimo_cost.parallel_command_political_power|0]§! and £command_power §Y[?constant:infantry_spawn_generalissimo_cost.parallel_command_command_power|0]§!"
infantry_spawn_accept_claimant_demand_effect_tt: "Pays and grants the selected demand, then closes it. A subordinate command reduces claimant influence by §Y[?constant:infantry_spawn_generalissimo_outcome.subordinate_accept_influence_loss|0]§! and raises Muster Control by §Y[?constant:infantry_spawn_generalissimo_outcome.subordinate_accept_control_gain|0]§!. A parallel command raises claimant influence by §Y[?constant:infantry_spawn_generalissimo_outcome.parallel_accept_influence_gain|0]§! and lowers Muster Control by §Y[?constant:infantry_spawn_generalissimo_outcome.parallel_accept_control_loss|0]§!."

infantry_spawn_refuse_claimant_demand: "Refuse the Claimant's Demand"
infantry_spawn_refuse_claimant_demand_desc: "Reject the selected claimant's terms and force the formations to decide whether the government's order still carries weight."
infantry_spawn_refuse_claimant_demand_effect_tt: "Refuses the current demand and marks the claimant as countermanded. Refusing a subordinate command raises claimant influence by §Y[?constant:infantry_spawn_generalissimo_outcome.subordinate_refuse_influence_gain|0]§! and lowers Muster Control by §Y[?constant:infantry_spawn_generalissimo_outcome.subordinate_refuse_control_loss|0]§!. Refusing a parallel command raises influence by §Y[?constant:infantry_spawn_generalissimo_outcome.parallel_refuse_influence_gain|0]§! and lowers Muster Control by §Y[?constant:infantry_spawn_generalissimo_outcome.parallel_refuse_control_loss|0]§!. Other refusals still depend on Muster Control."

infantry_spawn_counter_command_claimant: "Issue a Counter-Command"
infantry_spawn_counter_command_claimant_desc: "Flood the claimant's formations with authenticated national orders and place loyal officers between the private staff and its companies."
infantry_spawn_counter_command_requirements_tt: "Requires a live selected claimant, enough Army Experience and Command Power, and no active lock on this response."
infantry_spawn_counter_command_cost_text: "£army_experience §Y[?constant:infantry_spawn_claimant_cost.counter_command_army_experience|0]§!  £command_power §Y[?constant:infantry_spawn_claimant_cost.counter_command_command_power|0]§!"
infantry_spawn_counter_command_effect_tt: "Reduces the selected claimant's influence by §Y[?constant:infantry_spawn_claimant_response.counter_command_influence_loss|0]§!, raises Muster Control by §Y[?constant:infantry_spawn_claimant_response.counter_command_control_gain|0]§!, and can end a developing crisis if influence falls far enough. The command staff cannot repeat this response for §Y[?constant:infantry_spawn_timer.officer_search_days|0] days§!."

infantry_spawn_discredit_claimant: "Discredit the Claimant"
infantry_spawn_discredit_claimant_desc: "Publish contradictory orders, false victories, and unauthorized requisitions from the claimant's own files."
infantry_spawn_discredit_claimant_requirements_tt: "Requires a live selected claimant, enough Political Power, and no active lock on this response."
infantry_spawn_discredit_claimant_cost_text: "£pol_power §Y[?constant:infantry_spawn_claimant_cost.discredit_political_power|0]§!"
infantry_spawn_discredit_claimant_effect_tt: "Reduces the selected claimant's influence by §Y[?constant:infantry_spawn_claimant_response.discredit_influence_loss|0]§!, raises Muster Control by §Y[?constant:infantry_spawn_claimant_response.discredit_control_gain|0]§!, and can end a developing crisis if influence falls far enough. The political staff cannot repeat this response for §Y[?constant:infantry_spawn_timer.officer_search_days|0] days§!."

infantry_spawn_arrest_claimant: "Arrest the Claimant"
infantry_spawn_arrest_claimant_desc: "Send loyal troops into the claimant's headquarters before the private command can complete its revolt preparations."
infantry_spawn_arrest_claimant_requirements_tt: "Requires an active claimant crisis, enough Command Power, and enough Stability to absorb the operation."
infantry_spawn_arrest_claimant_cost_text: "£command_power §Y[?constant:infantry_spawn_claimant_cost.arrest_command_power|0]§!  £stability_texticon §Y[?constant:infantry_spawn_claimant_cost.arrest_stability|%0]§!"
infantry_spawn_arrest_claimant_effect_tt: "If the claimant's influence is below §Y[?constant:infantry_spawn_claimant_response.arrest_influence_ceiling|0]§!, loyal troops break the coup. A stronger claimant escapes the arrest, gains §Y[?constant:infantry_spawn_claimant_response.failed_arrest_influence_gain|0]§! influence, and advances the revolt."

infantry_spawn_claimant_archetype_quartermaster_sovereign: "Quartermaster Sovereign"
infantry_spawn_claimant_archetype_quartermaster_sovereign_desc: "This claimant treats depots, rolling stock, and supply permissions as the true instruments of rule."
infantry_spawn_claimant_archetype_field_prophet: "Field Prophet"
infantry_spawn_claimant_archetype_field_prophet_desc: "This claimant converts battlefield success into a doctrine of personal destiny."
infantry_spawn_claimant_archetype_barracks_tribune: "Barracks Tribune"
infantry_spawn_claimant_archetype_barracks_tribune_desc: "This claimant builds authority through company delegates, soldier petitions, and the language of the rank and file."
infantry_spawn_claimant_archetype_iron_saint: "Iron Saint"
infantry_spawn_claimant_archetype_iron_saint_desc: "This claimant promises safety through rigid discipline, fortified ground, and unquestioned endurance."
infantry_spawn_claimant_archetype_hollow_marshal: "Hollow Marshal"
infantry_spawn_claimant_archetype_hollow_marshal_desc: "This claimant moves formations with uncanny precision and reveals almost nothing of the purpose behind each order."
infantry_spawn_claimant_archetype_none: "No Recorded Archetype"
infantry_spawn_claimant_archetype_none_desc: "No live private command profile is selected."

infantry_spawn_claimant_demand_none: "No Pending Demand"
infantry_spawn_claimant_demand_none_desc: "The selected claimant has no unanswered demand before the government."
infantry_spawn_claimant_demand_formal_appointment: "A Formal Appointment"
infantry_spawn_claimant_demand_formal_appointment_desc: "The claimant demands a recognized place in the national chain of command."
infantry_spawn_claimant_demand_equipment_share: "A Share of the Arsenals"
infantry_spawn_claimant_demand_equipment_share_desc: "The claimant demands dedicated infantry and support equipment for loyal formations."
infantry_spawn_claimant_demand_autonomous_district: "An Autonomous Muster District"
infantry_spawn_claimant_demand_autonomous_district_desc: "The claimant demands exclusive command rights in the headquarters district."
infantry_spawn_claimant_demand_another_formation: "Another Formation"
infantry_spawn_claimant_demand_another_formation_desc: "The claimant demands a fresh formation lot assembled under the private command."
infantry_spawn_claimant_demand_political_seat: "A Seat in Government"
infantry_spawn_claimant_demand_political_seat_desc: "The claimant demands a permanent voice in the civil government."
infantry_spawn_claimant_demand_emergency_powers: "Emergency Command Powers"
infantry_spawn_claimant_demand_emergency_powers_desc: "The claimant demands authority to issue national military orders without ordinary civil review."
infantry_spawn_claimant_demand_subordinate_command: "A Commission Beneath the Generalissimo"
infantry_spawn_claimant_demand_subordinate_command_desc: "The claimant demands a recognized command that remains formally subordinate to the Generalissimo."
infantry_spawn_claimant_demand_parallel_command: "A Parallel Command"
infantry_spawn_claimant_demand_parallel_command_desc: "The claimant demands authority to issue orders beside the Generalissimo through a separate national staff."
infantry_spawn_claimant_generalissimo_context_exact: "The claimant already holds the Generalissimo's supreme commission, so the demand concerns the authority attached to that office."
infantry_spawn_claimant_generalissimo_context_rival: "The recognized Generalissimo still holds the supreme commission, leaving the claimant to seek a subordinate post or a parallel command."
infantry_spawn_claimant_generalissimo_context_none: "No recognized Generalissimo stands between the claimant and the government."

infantry_spawn_claimant_status_inactive: "No Active Claim"
infantry_spawn_claimant_status_emerging: "Gathering a Following"
infantry_spawn_claimant_status_recognized: "Recognized Command"
infantry_spawn_claimant_status_demanding: "Demand Before the Government"
infantry_spawn_claimant_status_countermanded: "Countermanded"
infantry_spawn_claimant_status_retired: "Removed from Command"
infantry_spawn_claimant_status_arrested: "Under Arrest"
infantry_spawn_claimant_status_takeover: "Seizing Government"
infantry_spawn_claimant_status_revolt_staged: "Formations in Open Defiance"
infantry_spawn_claimant_status_revolted: "Rival Command"
infantry_spawn_claimant_status_defeated: "Defeated Claim"

infantry_spawn_family_name_base_dead: "Base Dead Host"
infantry_spawn_family_name_base_dead_desc: "A numbered host of reanimated infantry whose hunger, equipment, and living reserve require continuous supervision."
infantry_spawn_family_name_pale_procession: "Pale Procession"
infantry_spawn_family_name_pale_procession_desc: "A ghost formation held together by anchors, shared memory, and regular access to political or living strength."
infantry_spawn_family_name_coal_golem: "Coal Golem Host"
infantry_spawn_family_name_coal_golem_desc: "A bound formation of coal and stone constructs sustained through workshops, binding marks, and replacement cores."
infantry_spawn_family_name_mutated_zombie_host: "Mutated Zombie Host"
infantry_spawn_family_name_mutated_zombie_host_desc: "A massed host of infected, parasitic, necrotic, demonic, wendigo, and armoured zombie formations."
infantry_spawn_family_name_africa_strange_forces: "African Strange-Force Host"
infantry_spawn_family_name_africa_strange_forces_desc: "A combined host of gorilla infantry, Pan sappers, stone cohorts, Riverborn, Forest Giants, oracle scouts, Disaster Wardens, and Plague Carriers."
infantry_spawn_family_name_greater_ghost_hosts: "Greater Ghost Hosts"
infantry_spawn_family_name_greater_ghost_hosts_desc: "A massed procession drawn from Hollow Ghost and Last Shore hosts."
infantry_spawn_family_name_cave_broods: "Cave Broods"
infantry_spawn_family_name_cave_broods_desc: "A host of cave broods whose bodies, armour, and field needs remain bound to their subterranean origin."
infantry_spawn_family_name_rat_broods: "Rat Broods"
infantry_spawn_family_name_rat_broods_desc: "A combined rat host of swarms, brutes, burrowers, carrion guards, dock stowaways, and tunnelers."
infantry_spawn_family_name_unrecorded: "Unrecorded Anomalous Host"
infantry_spawn_family_name_unrecorded_desc: "An eligible anomalous formation family whose identity is not part of the current national reference roll."

infantry_spawn_derivative_operations_category: "Government of the Host"
infantry_spawn_derivative_operations_category_desc: "A breakaway command must feed its formations, hold the districts that gave it birth, survive the former state, and decide what place its claimant or nonhuman family will occupy in the new order."

infantry_spawn_derivative_rotate_collective_commands_decision: "Rotate the District Commands"
infantry_spawn_derivative_rotate_collective_commands_decision_desc: "Move the council seals between district staffs so that no single headquarters can turn a shared host into its private army."
infantry_spawn_derivative_rotate_collective_commands_requirements_tt: "Requires the Collective Host route, bound district councils, no active governance cooldown, and the full Political Power and Command Power payment."
infantry_spawn_derivative_rotate_collective_commands_cost: "£pol_power §Y[?constant:infantry_spawn_derivative_decision_cost.collective_rotate_commands_pp|0]§!  £command_power §Y[?constant:infantry_spawn_derivative_decision_cost.collective_rotate_commands_cp|0]§!"
infantry_spawn_derivative_rotate_collective_commands_decision_tt: "Adopts rotating district command, raises Stability by §Y[?constant:infantry_spawn_derivative_expansion.governance_stability_shift|%0]§!, lowers War Support by §Y[?constant:infantry_spawn_derivative_expansion.governance_war_support_shift|%0]§!, and begins a §Y[?constant:infantry_spawn_derivative_timer.governance_cooldown_days|0]-day§! governance cooldown."

infantry_spawn_derivative_centralize_collective_muster_decision: "Centralize the Common Muster"
infantry_spawn_derivative_centralize_collective_muster_decision_desc: "Give one council staff temporary precedence over the district commands so the whole host can answer a single campaign order."
infantry_spawn_derivative_centralize_collective_muster_requirements_tt: "Requires the Collective Host route, bound district councils, no active governance cooldown, and the full Political Power and Army Experience payment."
infantry_spawn_derivative_centralize_collective_muster_cost: "£pol_power §Y[?constant:infantry_spawn_derivative_decision_cost.collective_centralize_muster_pp|0]§!  £army_experience §Y[?constant:infantry_spawn_derivative_decision_cost.collective_centralize_muster_xp|0]§!"
infantry_spawn_derivative_centralize_collective_muster_decision_tt: "Adopts a centralized common muster, lowers Stability by §Y[?constant:infantry_spawn_derivative_expansion.governance_stability_shift|%0]§!, raises War Support by §Y[?constant:infantry_spawn_derivative_expansion.governance_war_support_shift|%0]§!, and begins a §Y[?constant:infantry_spawn_derivative_timer.governance_cooldown_days|0]-day§! governance cooldown."

infantry_spawn_derivative_ratify_species_compacts_decision: "Ratify the District Compacts"
infantry_spawn_derivative_ratify_species_compacts_decision_desc: "Recognize ordinary district offices that accept the family's domain and bind them to written duties of supply, passage, and restraint."
infantry_spawn_derivative_ratify_species_compacts_requirements_tt: "Requires the Species Realm route, a marked family domain, no active governance cooldown, and the full Political Power and Command Power payment."
infantry_spawn_derivative_ratify_species_compacts_cost: "£pol_power §Y[?constant:infantry_spawn_derivative_decision_cost.species_ratify_compacts_pp|0]§!  £command_power §Y[?constant:infantry_spawn_derivative_decision_cost.species_ratify_compacts_cp|0]§!"
infantry_spawn_derivative_ratify_species_compacts_decision_tt: "Adopts compact government, raises Stability by §Y[?constant:infantry_spawn_derivative_expansion.governance_stability_shift|%0]§!, lowers War Support by §Y[?constant:infantry_spawn_derivative_expansion.governance_war_support_shift|%0]§!, and begins a §Y[?constant:infantry_spawn_derivative_timer.governance_cooldown_days|0]-day§! governance cooldown."

infantry_spawn_derivative_proclaim_family_primacy_decision: "Proclaim the Family's Primacy"
infantry_spawn_derivative_proclaim_family_primacy_decision_desc: "Place the survival and command of the nonhuman host above every inherited district law and ordinary political claim."
infantry_spawn_derivative_proclaim_family_primacy_requirements_tt: "Requires the Species Realm route, a marked family domain, no active governance cooldown, and the full Political Power and Army Experience payment."
infantry_spawn_derivative_proclaim_family_primacy_cost: "£pol_power §Y[?constant:infantry_spawn_derivative_decision_cost.species_proclaim_primacy_pp|0]§!  £army_experience §Y[?constant:infantry_spawn_derivative_decision_cost.species_proclaim_primacy_xp|0]§!"
infantry_spawn_derivative_proclaim_family_primacy_decision_tt: "Adopts family primacy, lowers Stability by §Y[?constant:infantry_spawn_derivative_expansion.governance_stability_shift|%0]§!, raises War Support by §Y[?constant:infantry_spawn_derivative_expansion.governance_war_support_shift|%0]§!, and begins a §Y[?constant:infantry_spawn_derivative_timer.governance_cooldown_days|0]-day§! governance cooldown."

infantry_spawn_derivative_secure_muster_depot_decision: "Secure a Muster Depot"
infantry_spawn_derivative_secure_muster_depot_decision_desc: "Convert a controlled state into a guarded depot that recognizes the host's own seals and obligations."
infantry_spawn_derivative_secure_muster_depot_requirements_tt: "Requires a controlled eligible state that does not already contain one of our muster depots."
infantry_spawn_derivative_secure_muster_depot_decision_tt: "Marks [FROM.GetName] as a §YMuster Depot§!, raises local compliance, and adds it to the host's supply network."

infantry_spawn_derivative_authorize_base_zombie_training_decision: "Teach the Base Dead to Muster"
infantry_spawn_derivative_authorize_base_zombie_training_decision_desc: "Establish fixed drills, numbered bands, and repeatable assembly orders for the least altered dead."
infantry_spawn_derivative_authorize_base_zombie_training_requirements_tt: "Requires a zombie host, an eligible state, aligned formation ledgers, and the full training payment."
infantry_spawn_derivative_authorize_base_zombie_training_cost: "£army_experience §Y[?constant:event19_zombie_family.training_army_experience_cost|0]§!  £infantry_equipment_text_icon §Y[?constant:event19_zombie_family.training_infantry_equipment_cost|0]§!  £manpower_texticon §Y[?constant:event19_zombie_family.training_manpower_cost|0]§!"
infantry_spawn_derivative_authorize_base_zombie_training_decision_tt: "Authorizes repeatable assembly of base-dead formations under the host's own command."

infantry_spawn_derivative_rally_zombie_band_decision: "Rally a Devouring Band"
infantry_spawn_derivative_rally_zombie_band_decision_desc: "Gather another numbered band around an existing command knot and arm it from captured stores."
infantry_spawn_derivative_rally_zombie_band_requirements_tt: "Requires a zombie host with numbered bands, an eligible state, aligned ledgers, no reinforcement cooldown, and the full manpower and equipment payment."
infantry_spawn_derivative_rally_zombie_band_cost: "£manpower_texticon §Y[?constant:infantry_spawn_derivative_reinforcement.zombie_manpower_cost|0]§!  £infantry_equipment_text_icon §Y[?constant:infantry_spawn_derivative_reinforcement.zombie_infantry_equipment_cost|0]§!"
infantry_spawn_derivative_rally_zombie_band_decision_tt: "Raises one base-dead formation in an eligible state and begins the reinforcement cooldown."

infantry_spawn_derivative_manifest_ghost_host_decision: "Call Another Pale Procession"
infantry_spawn_derivative_manifest_ghost_host_decision_desc: "Spend political authority and command attention to establish anchors for another ghost formation."
infantry_spawn_derivative_manifest_ghost_host_requirements_tt: "Requires a ghost host, an eligible state, aligned ledgers, and enough Political Power and Command Power."
infantry_spawn_derivative_manifest_ghost_host_cost: "£pol_power §Y[?constant:event19_ghost_family.manifest_political_power_cost|0]§!  £command_power §Y[?constant:event19_ghost_family.manifest_command_power_cost|0]§!"
infantry_spawn_derivative_manifest_ghost_host_decision_tt: "Manifests one weak ghost-host formation in an eligible state."

infantry_spawn_derivative_bind_golem_host_decision: "Bind Another Stone Host"
infantry_spawn_derivative_bind_golem_host_decision_desc: "Assemble coal cores, iron braces, and living marks into a new formation of bound constructs."
infantry_spawn_derivative_bind_golem_host_requirements_tt: "Requires a golem host, an eligible state, at least §Y[?constant:event19_golem_family.binding_civilian_factory_gate|0]§! available Civilian Factories, and the full political, command, and Coal Golem Equipment payment."
infantry_spawn_derivative_bind_golem_host_cost: "£pol_power §Y[?constant:event19_golem_family.binding_political_power_cost|0]§!  £command_power §Y[?constant:event19_golem_family.binding_command_power_cost|0]§!  §Y[?constant:event19_golem_family.binding_equipment_cost|0]§! Coal Golem Equipment"
infantry_spawn_derivative_bind_golem_host_decision_tt: "Binds one coal-golem formation in an eligible industrial state."

infantry_spawn_derivative_pay_family_sustainment_decision: "Meet the Host's Sustenance"
infantry_spawn_derivative_pay_family_sustainment_decision_desc: "Deliver the resource that keeps this nonhuman command coherent enough to remain a state."
infantry_spawn_derivative_pay_family_sustainment_requirements_tt: "Requires live family formations and the complete sustainment payment appropriate to this host."
infantry_spawn_derivative_pay_family_sustainment_cost: "Base dead: £infantry_equipment_text_icon §Y[?constant:event19_zombie_family.sustainment_infantry_equipment_cost|0]§! and £manpower_texticon §Y[?constant:event19_zombie_family.sustainment_manpower_cost|0]§!\nGhost host: £pol_power §Y[?constant:event19_ghost_family.sustainment_political_power_cost|0]§! and £command_power §Y[?constant:event19_ghost_family.sustainment_command_power_cost|0]§!\nGolem host: £pol_power §Y[?constant:event19_golem_family.sustainment_political_power_cost|0]§! and §Y[?constant:event19_golem_family.sustainment_equipment_cost|0]§! Coal Golem Equipment"
infantry_spawn_derivative_pay_family_sustainment_decision_tt: "Pays the current family obligation and restores the host's sustainment record."

infantry_spawn_derivative_rally_claimant_guard_decision: "Rally the Claimant's Guard"
infantry_spawn_derivative_rally_claimant_guard_decision_desc: "The claimant's headquarters will draw one formation from the surviving musters and bind its officers to the personal chain of command."
infantry_spawn_derivative_rally_claimant_guard_requirements_tt: "Requires an established claimant government, an eligible muster state, aligned formation records, no active reinforcement cooldown, and £army_experience §Y[?constant:infantry_spawn_claimant_cost.another_formation_army_experience|0]§!."
infantry_spawn_derivative_rally_claimant_guard_cost: "£army_experience §Y[?constant:infantry_spawn_claimant_cost.another_formation_army_experience|0]§!"
infantry_spawn_derivative_rally_claimant_guard_decision_tt: "Raises one claimant-loyal formation and records its manpower and equipment in the Muster Ledger."

infantry_spawn_derivative_establish_sustainment_site_decision: "Establish a Sustainment Site"
infantry_spawn_derivative_establish_sustainment_site_decision_desc: "Prepare a controlled state to feed, anchor, or repair the host according to its family needs."
infantry_spawn_derivative_establish_sustainment_site_requirements_tt: "Requires a controlled eligible state that does not already contain one of our sustainment sites."
infantry_spawn_derivative_establish_sustainment_site_decision_tt: "Marks [FROM.GetName] as a §YSustainment Site§!, raises local compliance, grants a family-specific reserve, and strengthens the host's sustainment network."

infantry_spawn_derivative_offer_zombie_containment_decision: "Offer a Containment Bargain"
infantry_spawn_derivative_offer_zombie_containment_decision_desc: "Arm a neighboring border command and bind it to marked corridors where the numbered dead may pass without a general mobilization."
infantry_spawn_derivative_offer_zombie_containment_requirements_tt: "Requires surveyed frontiers, scavenged zombie barracks, peace on both sides, no active diplomatic cooldown, and a neighboring ordinary country with no pact or war claim between us. Each neighbor may receive only one family agreement."
infantry_spawn_derivative_offer_zombie_containment_cost: "£pol_power §Y[?constant:infantry_spawn_derivative_decision_cost.zombie_containment_pp|0]§!  £manpower_texticon §Y[?constant:infantry_spawn_derivative_decision_cost.zombie_containment_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:infantry_spawn_derivative_decision_cost.zombie_containment_equipment|0]§!"
infantry_spawn_derivative_offer_zombie_containment_decision_tt: "Transfers the rifles to [FROM.GetNameDef], establishes a Non-Aggression Pact and mutual recognition, and begins a §Y[?constant:infantry_spawn_derivative_timer.diplomacy_cooldown_days|0]-day§! diplomatic cooldown."

infantry_spawn_derivative_offer_ghost_border_recognition_decision: "Offer Border Recognition"
infantry_spawn_derivative_offer_ghost_border_recognition_decision_desc: "Mark a quiet frontier, recognize the living offices beyond it, and let the pale procession hold to agreed anchors instead of feeding every border fear."
infantry_spawn_derivative_offer_ghost_border_recognition_requirements_tt: "Requires surveyed frontiers, marked ghost anchors, peace on both sides, no active diplomatic cooldown, and a neighboring ordinary country with no pact or war claim between us. Each neighbor may receive only one family agreement."
infantry_spawn_derivative_offer_ghost_border_recognition_cost: "£pol_power §Y[?constant:infantry_spawn_derivative_decision_cost.ghost_recognition_pp|0]§!  £command_power §Y[?constant:infantry_spawn_derivative_decision_cost.ghost_recognition_cp|0]§!"
infantry_spawn_derivative_offer_ghost_border_recognition_decision_tt: "Establishes a Non-Aggression Pact and mutual recognition with [FROM.GetNameDef]. The recognized anchor network lowers the periodic population toll from §Y[?constant:infantry_spawn_derivative_ghost_decline.base_population_fraction|%2]§! to §Y[?constant:infantry_spawn_derivative_ghost_decline.anchored_population_fraction|%2]§! without ending it, and the §Y[?constant:infantry_spawn_derivative_timer.diplomacy_cooldown_days|0]-day§! diplomatic cooldown begins."

infantry_spawn_derivative_offer_golem_material_agreement_decision: "Offer a Material Agreement"
infantry_spawn_derivative_offer_golem_material_agreement_decision_desc: "Trade shaped coal cores for ordinary support stores and mark the neighboring railheads where both governments may exchange material without mobilizing."
infantry_spawn_derivative_offer_golem_material_agreement_requirements_tt: "Requires surveyed frontiers, recovered golem coal, peace on both sides, no active diplomatic cooldown, and a neighboring ordinary country able to provide the support stores. Each neighbor may receive only one family agreement."
infantry_spawn_derivative_offer_golem_material_agreement_cost: "£pol_power §Y[?constant:infantry_spawn_derivative_decision_cost.golem_material_agreement_pp|0]§!  §Y[?constant:infantry_spawn_derivative_decision_cost.golem_material_agreement_coal|0]§! Coal Golem Equipment"
infantry_spawn_derivative_offer_golem_material_agreement_decision_tt: "Exchanges §Y[?constant:infantry_spawn_derivative_decision_cost.golem_material_agreement_coal|0]§! Coal Golem Equipment for £support_equipment_text_icon §Y[?constant:infantry_spawn_derivative_decision_cost.golem_material_agreement_support|0]§!, establishes a Non-Aggression Pact and mutual recognition with [FROM.GetNameDef], and begins a §Y[?constant:infantry_spawn_derivative_timer.diplomacy_cooldown_days|0]-day§! diplomatic cooldown."

infantry_spawn_derivative_integrate_zombie_muster_district_decision: "Settle a Devouring Muster District"
infantry_spawn_derivative_integrate_zombie_muster_district_decision_desc: "Replace occupation offices with guarded ration rolls, numbered feeding routes, and a permanent base-dead muster."
infantry_spawn_derivative_integrate_zombie_muster_district_requirements_tt: "Requires peace, scavenged zombie barracks, the full Political Power, manpower, and infantry-equipment payment, and an owned and controlled populated non-core state."
infantry_spawn_derivative_integrate_zombie_muster_district_cost: "£pol_power §Y[?constant:infantry_spawn_derivative_decision_cost.zombie_integration_pp|0]§!  £manpower_texticon §Y[?constant:infantry_spawn_derivative_decision_cost.zombie_integration_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:infantry_spawn_derivative_decision_cost.zombie_integration_equipment|0]§!"
infantry_spawn_derivative_integrate_zombie_muster_district_decision_tt: "Begins a §Y[?constant:infantry_spawn_derivative_timer.zombie_integration_days|0]-day§! integration mission in [FROM.GetName]. Numbered bands reduce it to §Y[?constant:infantry_spawn_derivative_timer.zombie_numbered_integration_days|0] days§!. Losing ownership or control cancels the work."

infantry_spawn_derivative_recognize_ghost_anchor_district_decision: "Recognize an Anchor District"
infantry_spawn_derivative_recognize_ghost_anchor_district_decision_desc: "Replace occupation offices with recognized sites, witnesses, and district duties that can hold the procession to one governed place."
infantry_spawn_derivative_recognize_ghost_anchor_district_requirements_tt: "Requires peace, marked ghost anchors, the full Political Power and Command Power payment, and an owned and controlled populated non-core state."
infantry_spawn_derivative_recognize_ghost_anchor_district_cost: "£pol_power §Y[?constant:infantry_spawn_derivative_decision_cost.ghost_integration_pp|0]§!  £command_power §Y[?constant:infantry_spawn_derivative_decision_cost.ghost_integration_cp|0]§!"
infantry_spawn_derivative_recognize_ghost_anchor_district_decision_tt: "Begins a §Y[?constant:infantry_spawn_derivative_timer.ghost_integration_days|0]-day§! recognition mission in [FROM.GetName]. An anchored procession reduces it to §Y[?constant:infantry_spawn_derivative_timer.ghost_anchored_integration_days|0] days§!. Losing ownership or control cancels the work."

infantry_spawn_derivative_bind_golem_foundry_district_decision: "Bind a Foundry District"
infantry_spawn_derivative_bind_golem_foundry_district_decision_desc: "Join workshops, rail sidings, and district offices beneath one pattern able to repair the roads that carry the stone host."
infantry_spawn_derivative_bind_golem_foundry_district_requirements_tt: "Requires peace, recovered golem coal, the full Political Power, Coal Golem Equipment, and train payment, and an owned and controlled industrial or rail-served non-core state with room for another Infrastructure level."
infantry_spawn_derivative_bind_golem_foundry_district_cost: "£pol_power §Y[?constant:infantry_spawn_derivative_decision_cost.golem_integration_pp|0]§!  §Y[?constant:infantry_spawn_derivative_decision_cost.golem_integration_coal|0]§! Coal Golem Equipment  £train_equipment_text_icon §Y[?constant:infantry_spawn_derivative_decision_cost.golem_integration_trains|0]§!"
infantry_spawn_derivative_bind_golem_foundry_district_decision_tt: "Begins a §Y[?constant:infantry_spawn_derivative_timer.golem_integration_days|0]-day§! binding mission in [FROM.GetName]. Open foundries reduce it to §Y[?constant:infantry_spawn_derivative_timer.golem_foundry_integration_days|0] days§!. Losing ownership or control cancels the work."

infantry_spawn_derivative_integrate_conquered_district_mission: "Integrating a Conquered District"
infantry_spawn_derivative_integrate_conquered_district_mission_desc: "The selected district is replacing temporary occupation orders with a permanent administration fitted to the host that governs it."
infantry_spawn_derivative_integrate_zombie_muster_district_mission_tt: "Records another governed district, raises Compliance by §Y[?constant:infantry_spawn_derivative_expansion.zombie_integration_compliance|0]%§!, and raises Resistance by §Y[?constant:infantry_spawn_derivative_expansion.zombie_integration_resistance|0]%§! as the living population is pressed around a permanent zombie muster."
infantry_spawn_derivative_recognize_ghost_anchor_district_mission_tt: "Records another governed district, raises Compliance by §Y[?constant:infantry_spawn_derivative_expansion.ghost_integration_compliance|0]%§!, changes Resistance by §Y[?constant:infantry_spawn_derivative_expansion.ghost_integration_resistance|0]%§!, and establishes an anchor network that slows future ghost decline through the existing population ledger."
infantry_spawn_derivative_bind_golem_foundry_district_mission_tt: "Records another governed district, raises Compliance by §Y[?constant:infantry_spawn_derivative_expansion.golem_integration_compliance|0]%§!, changes Resistance by §Y[?constant:infantry_spawn_derivative_expansion.golem_integration_resistance|0]%§!, and adds §Y[?constant:infantry_spawn_derivative_expansion.golem_infrastructure_levels|0] Infrastructure§! from the bound workshop-and-rail project."

infantry_spawn_derivative_suppress_fragmentation_decision: "Suppress Command Fragmentation"
infantry_spawn_derivative_suppress_fragmentation_decision_desc: "Reissue the chain of orders, isolate rival countersigns, and compel scattered formations to report to one headquarters."
infantry_spawn_derivative_suppress_fragmentation_requirements_tt: "Requires no active fragmentation cooldown and enough Political Power and Army Experience."
infantry_spawn_derivative_suppress_fragmentation_cost: "£pol_power §Y[?constant:infantry_spawn_derivative_decision_cost.suppress_fragmentation_pp|0]§!  £army_experience §Y[?constant:infantry_spawn_derivative_decision_cost.suppress_fragmentation_xp|0]§!"
infantry_spawn_derivative_suppress_fragmentation_decision_tt: "Raises Stability and Command Power, suppresses the current fragmentation, and begins a cooldown before the operation can be repeated."

infantry_spawn_derivative_break_former_parent_command_net_decision: "Break the Former Command Net"
infantry_spawn_derivative_break_former_parent_command_net_decision_desc: "Cut the codes, couriers, and depot contacts through which the former state still reaches into the host."
infantry_spawn_derivative_break_former_parent_command_net_requirements_tt: "Requires an unresolved former-state front and enough Command Power."
infantry_spawn_derivative_break_former_parent_command_net_cost: "£command_power §Y[?constant:infantry_spawn_derivative_decision_cost.break_command_net_cp|0]§!"
infantry_spawn_derivative_break_former_parent_command_net_decision_tt: "Ends the former state's command pressure, removes the opening war-plan burden, and grants §YThe Outward Muster§! with faster planning and division movement."

infantry_spawn_derivative_demand_local_submission_decision: "Demand Local Submission"
infantry_spawn_derivative_demand_local_submission_decision_desc: "Deliver terms to a neighboring ordinary state and give its government time to abandon resistance."
infantry_spawn_derivative_demand_local_submission_requirements_tt: "Requires peace, no active submission demand or cooldown, an expansion-ready host, and a valid neighboring ordinary country."
infantry_spawn_derivative_demand_local_submission_decision_tt: "Gives [FROM.GetNameDef] §Y[?constant:infantry_spawn_derivative_timer.submission_warning_days|0] days§! before our command receives an annexation war goal."

infantry_spawn_derivative_submission_warning_mission: "Terms Before the Neighbor"
infantry_spawn_derivative_submission_warning_mission_desc: "A neighboring government has received our demand and is using its final days to choose resistance or submission."
infantry_spawn_derivative_submission_warning_mission_tt: "If the target remains valid when the term expires, we receive a time-limited annexation war goal against it."

infantry_spawn_derivative_preserve_claimant_decision: "Preserve the Founding Claimant"
infantry_spawn_derivative_preserve_claimant_decision_desc: "Confirm that the commander who led the breakaway will remain the personal center of the new state."
infantry_spawn_derivative_preserve_claimant_requirements_tt: "Requires the claimant route, assigned command estates, a recorded founding claimant, and no prior continuity decision."
infantry_spawn_derivative_preserve_claimant_decision_tt: "Preserves the founding claimant, settles the continuity question, and grants Stability and Command Power."

infantry_spawn_derivative_replace_claimant_decision: "Replace the Founding Claimant"
infantry_spawn_derivative_replace_claimant_decision_desc: "Retire the commander whose revolt created the state and issue a fresh claimant identity to the government."
infantry_spawn_derivative_replace_claimant_requirements_tt: "Requires the claimant route, assigned command estates, a recorded founding claimant, and no prior continuity decision."
infantry_spawn_derivative_replace_claimant_decision_tt: "Appoints a replacement commander from the region's surviving officers, records the new claimant, installs them as country leader, retires the founder, settles the continuity question, and grants Stability and Army Experience."

infantry_spawn_derivative_survive_former_parent_front: "Survive the Former State"
infantry_spawn_derivative_survive_former_parent_front_desc: "Hold the opening front until the former government's command claims no longer determine the host's future."
infantry_spawn_derivative_survive_former_parent_front_tt: "Surviving until the mission expires ends former-state pressure, grants Stability and War Support, and grants §YThe Outward Muster§! with faster planning and division movement."

infantry_spawn_control_low: "Fractured Muster Control"
infantry_spawn_control_low_desc: "Formation rolls contradict one another, private countersigns circulate freely, and national orders reach too few of the unbidden units."
infantry_spawn_control_guarded: "Guarded Muster Control"
infantry_spawn_control_guarded_desc: "The state can direct most formation lots. Every unusual order still requires escorts, duplicate seals, and close supervision."
infantry_spawn_control_strong: "Strong Muster Control"
infantry_spawn_control_strong_desc: "District staffs, depot officers, and field commanders share one reliable ledger for the unbidden formations."
infantry_spawn_control_exceptional: "Unified Muster Command"
infantry_spawn_control_exceptional_desc: "Every recorded lot answers through an accountable chain of command, and rival seals find little room among the ranks."

infantry_spawn_congestion_strained: "Strained Army Accommodation"
infantry_spawn_congestion_strained_desc: "Barracks, railheads, and staff offices are carrying more formations than their ordinary schedules can absorb."
infantry_spawn_congestion_severe: "Severe Formation Congestion"
infantry_spawn_congestion_severe_desc: "Unsettled lots compete for the same depots, training grounds, and movement orders, slowing the whole army."
infantry_spawn_congestion_critical: "Critical Formation Congestion"
infantry_spawn_congestion_critical_desc: "The muster has overwhelmed its own routes and offices. New orders create collisions faster than the staff can resolve them."

infantry_spawn_equipment_debt_modest: "Recorded Equipment Liabilities"
infantry_spawn_equipment_debt_modest_desc: "The unbidden formations consume rifles, parts, and stores that never appeared in the ordinary procurement plan."
infantry_spawn_equipment_debt_severe: "Severe Equipment Liabilities"
infantry_spawn_equipment_debt_severe_desc: "Factories are being diverted to incompatible weapons and missing replacement stocks carried on the formation ledger."
infantry_spawn_equipment_debt_critical: "Arsenal Obligations in Crisis"
infantry_spawn_equipment_debt_critical_desc: "The state is repairing, replacing, and feeding more unexplained materiel than its industrial system can comfortably sustain."

infantry_spawn_officer_reassignment_burden: "Officer Reassignment Burden"
infantry_spawn_officer_reassignment_burden_desc: "Experienced officers have been pulled from field commands to authenticate rolls, reconcile orders, and supervise unfamiliar staffs."
infantry_spawn_training_ground_saturation: "Saturated Training Grounds"
infantry_spawn_training_ground_saturation_desc: "Too many untested formations are drilling on the same ranges, leaving little time or space for coherent instruction."

infantry_spawn_preserved_specialist_training: "Preserved Specialist Instruction"
infantry_spawn_preserved_specialist_training_desc: "Recovered specialist cadres are passing their drills, maintenance routines, and field procedures into the regular training establishment."
infantry_spawn_preserved_prototype_burden: "Preserved Prototype Formation"
infantry_spawn_preserved_prototype_burden_desc: "A finite advanced formation has been kept intact. Its workshops cannot feed the wider reinforcement pool, but the hard lessons of maintaining it are improving field experience throughout the army."
infantry_spawn_supply_allocation_strain: "Reserved Supply Corridors"
infantry_spawn_supply_allocation_strain_desc: "Trains, fuel, and route priority are committed to a formation corridor. The rest of the army works around it."

infantry_spawn_recognized_claimant_command: "Recognized Claimant Command"
infantry_spawn_recognized_claimant_command_desc: "A commander from the unbidden muster holds formal authority. The appointment improves coordination and gives a private following a place inside the state."
infantry_spawn_claimant_in_government: "Claimant in Government"
infantry_spawn_claimant_in_government_desc: "The claimant's military constituency now speaks inside the civil government and expects every cabinet decision to respect the barracks."
infantry_spawn_claimant_emergency_command: "Claimant Emergency Command"
infantry_spawn_claimant_emergency_command_desc: "The claimant may issue national military orders without ordinary review, sharpening battlefield response and weakening civil confidence."
infantry_spawn_claimant_takeover_regime: "Government of the Claimant"
infantry_spawn_claimant_takeover_regime_desc: "The ministries, depots, and formations have been placed beneath one military authority born from the unbidden muster."
infantry_spawn_failed_coup_aftermath: "Aftermath of the Broken Coup"
infantry_spawn_failed_coup_aftermath_desc: "Loyal troops kept the government, and purges, contradictory orders, and mutual suspicion still divide the officer corps."

infantry_spawn_claimant_quartermaster_sovereign: "The Quartermaster Sovereign"
infantry_spawn_claimant_quartermaster_sovereign_desc: "Depots, transport schedules, and issue papers have become the claimant's instruments of political command."
infantry_spawn_claimant_field_prophet: "The Field Prophet"
infantry_spawn_claimant_field_prophet_desc: "Victories are presented as proof that the claimant alone understands the purpose of the unbidden army."
infantry_spawn_claimant_barracks_tribune: "The Barracks Tribune"
infantry_spawn_claimant_barracks_tribune_desc: "Company petitions and soldier delegates carry the claimant's authority through the ranks."
infantry_spawn_claimant_iron_saint: "The Iron Saint"
infantry_spawn_claimant_iron_saint_desc: "Fortified ground, rigid drill, and personal austerity have made obedience resemble a military faith."
infantry_spawn_claimant_hollow_marshal: "The Hollow Marshal"
infantry_spawn_claimant_hollow_marshal_desc: "The claimant's commands arrive with perfect timing and little explanation, binding the army through motion itself."

infantry_spawn_derivative_unrecognized_host: "An Unrecognized Host"
infantry_spawn_derivative_unrecognized_host_desc: "The breakaway holds ground and weapons. Its claim to government remains no stronger than the formations enforcing it."
infantry_spawn_derivative_seized_muster_districts: "Seized Muster Districts"
infantry_spawn_derivative_seized_muster_districts_desc: "The host inherited depots and district offices designed for another state, leaving supply and administration under constant strain."
infantry_spawn_derivative_claimant_disputed_command: "Disputed Chain of Command"
infantry_spawn_derivative_claimant_disputed_command_desc: "The founding claimant holds the capital, but officers beyond the first cantonments still dispute whose seal binds the muster."
infantry_spawn_derivative_zombie_fragmented_command: "Fragmented Devouring Bands"
infantry_spawn_derivative_zombie_fragmented_command_desc: "The base dead gather around local hungers and broken countersigns without one reliable chain of command."
infantry_spawn_derivative_ghost_unstable_manifestation: "Unstable Manifestation"
infantry_spawn_derivative_ghost_unstable_manifestation_desc: "The pale procession lacks enough trusted anchors to hold a common shape across every front."
infantry_spawn_derivative_golem_broken_pattern: "Broken Living Pattern"
infantry_spawn_derivative_golem_broken_pattern_desc: "Missing marks and divided workshops leave the constructs slow, wasteful, and uncertain of shared orders."
infantry_spawn_derivative_pursued_by_former_state: "Pursued by the Former State"
infantry_spawn_derivative_pursued_by_former_state_desc: "The old government still knows the depots, routes, and officers from which this host was made."

infantry_spawn_derivative_claimant_war_state: "The Claimant's War State"
infantry_spawn_derivative_claimant_war_state_desc: "Government is organized around the founding commander's right to lead the host through permanent military struggle."
infantry_spawn_derivative_claimant_command_estates: "Command Estates"
infantry_spawn_derivative_claimant_command_estates_desc: "Depots, workshops, and districts have been assigned to officers whose authority descends from the claimant."
infantry_spawn_derivative_claimant_decisive_war_plan: "The Decisive War Plan"
infantry_spawn_derivative_claimant_decisive_war_plan_desc: "The host has one concentrated plan for breaking the former state's claim and proving the commander's right to rule."
infantry_spawn_derivative_claimant_personal_staff: "The Claimant's Personal Staff"
infantry_spawn_derivative_claimant_personal_staff_desc: "A single numbered staff now carries the claimant's orders from the capital to every surviving district and front."
infantry_spawn_derivative_zombie_bound_to_commander: "Bands Bound to the Commander"
infantry_spawn_derivative_zombie_bound_to_commander_desc: "Numbered hungers answer to a personal countersign carried down from the claimant."
infantry_spawn_derivative_ghost_bound_procession: "The Bound Procession"
infantry_spawn_derivative_ghost_bound_procession_desc: "The claimant serves as the procession's highest anchor and the source of its common direction."
infantry_spawn_derivative_golem_master_bound_constructs: "Master-Bound Constructs"
infantry_spawn_derivative_golem_master_bound_constructs_desc: "Every living mark refers back to one master pattern guarded by the claimant's workshops."

infantry_spawn_derivative_collective_command_host: "Collective Command Host"
infantry_spawn_derivative_collective_command_host_desc: "No single commander owns the muster. District delegates share responsibility for its orders and failures."
infantry_spawn_derivative_collective_district_network: "District Council Network"
infantry_spawn_derivative_collective_district_network_desc: "Local councils coordinate depots, routes, and repair work through a common host ledger."
infantry_spawn_derivative_collective_defensive_compact: "Host Defensive Compact"
infantry_spawn_derivative_collective_defensive_compact_desc: "Each district promises prepared ground and immediate reinforcement to every other member of the host."
infantry_spawn_derivative_zombie_coordinated_bands: "Coordinated Devouring Bands"
infantry_spawn_derivative_zombie_coordinated_bands_desc: "Local zombie bands retain their own leaders under shared assembly numbers and march signals."
infantry_spawn_derivative_ghost_chorus_of_anchors: "Chorus of Anchors"
infantry_spawn_derivative_ghost_chorus_of_anchors_desc: "Many fixed places hold the procession together, allowing no single anchor to command the whole."
infantry_spawn_derivative_golem_distributed_binding: "Distributed Binding"
infantry_spawn_derivative_golem_distributed_binding_desc: "Workshops share living marks across the host so the loss of one master pattern cannot end the march."

infantry_spawn_derivative_species_realm: "Realm of the Host"
infantry_spawn_derivative_species_realm_desc: "The state claims legitimacy from the nonhuman family itself and treats ordinary government as a vanished inheritance."
infantry_spawn_derivative_species_family_domain: "The Family Domain"
infantry_spawn_derivative_species_family_domain_desc: "Land, resources, and captured institutions are ordered around the survival and expansion of the host's family."
infantry_spawn_derivative_species_extinction_of_old_rule: "End of the Old Chain"
infantry_spawn_derivative_species_extinction_of_old_rule_desc: "The host fights to remove every command system that once treated its formations as property."
infantry_spawn_derivative_zombie_instinct_hierarchy: "Hierarchy of Hunger"
infantry_spawn_derivative_zombie_instinct_hierarchy_desc: "The strongest and most coherent bands pull the rest of the base dead into a moving order."
infantry_spawn_derivative_ghost_haunting_without_masters: "A Haunting Without Masters"
infantry_spawn_derivative_ghost_haunting_without_masters_desc: "The procession follows shared memory and territorial anchors without a living command."
infantry_spawn_derivative_golem_living_pattern: "The Living Pattern"
infantry_spawn_derivative_golem_living_pattern_desc: "The constructs reproduce and correct their own binding marks without a human master."

infantry_spawn_derivative_concentrated_host_method: "Concentrated Host Method"
infantry_spawn_derivative_concentrated_host_method_desc: "The host gathers its best formations under one plan and accepts the supply burden of decisive mass."
infantry_spawn_derivative_scattered_bands_method: "Scattered Bands Method"
infantry_spawn_derivative_scattered_bands_method_desc: "Independent columns exploit speed, local sustainment, and rapid reinforcement at the cost of elaborate planning."
infantry_spawn_derivative_captured_auxiliaries_method: "Captured Auxiliaries Method"
infantry_spawn_derivative_captured_auxiliaries_method_desc: "Ordinary soldiers and seized equipment fill the gaps that the host's family formations cannot cover alone."
infantry_spawn_derivative_sustainment_network: "Host Sustainment Network"
infantry_spawn_derivative_sustainment_network_desc: "Marked depots, workshops, anchors, and living corridors carry the obligations that keep the host coherent."
infantry_spawn_derivative_concentrated_sustainment_method: "Concentrated Host Supply Columns"
infantry_spawn_derivative_concentrated_sustainment_method_desc: "Numbered supply columns feed a massed host through marked depots and rebuilt corridors, binding decisive concentration to a strict ledger of obligations."
infantry_spawn_derivative_scattered_sustainment_method: "Scattered Band Supply Lines"
infantry_spawn_derivative_scattered_sustainment_method_desc: "Local caches, anchor points, and moving workshops let independent columns disperse without losing the thread that returns them to battle."
infantry_spawn_derivative_auxiliary_sustainment_method: "Auxiliary Muster Network"
infantry_spawn_derivative_auxiliary_sustainment_method_desc: "Captured stores and ordinary auxiliaries are assigned to a network of guarded depots, filling the gaps between the host's family formations."
infantry_spawn_derivative_outward_muster: "The Outward Muster"
infantry_spawn_derivative_outward_muster_desc: "With the former state's command net broken, every numbered road and frontier depot becomes the beginning of another campaign."
infantry_spawn_derivative_regional_predator: "Regional Predator"
infantry_spawn_derivative_regional_predator_desc: "Repeated victories and integrated districts have taught neighboring governments to expect another demand from the host."

infantry_spawn_derivative_hunted_remnant: "Hunted Remnant"
infantry_spawn_derivative_hunted_remnant_desc: "The host has lost its state and survives only through scattered officers, hidden sites, and the memory of command."
infantry_spawn_derivative_scattered_enclaves: "Scattered Enclaves"
infantry_spawn_derivative_scattered_enclaves_desc: "Isolated remnants consume supplies without the routes or institutions that once joined them."
infantry_spawn_derivative_encircled_remnant: "Encircled Remnant"
infantry_spawn_derivative_encircled_remnant_desc: "The former state's closing command net has reduced the breakaway to watched roads, broken couriers, and pockets with no secure line of retreat."
infantry_spawn_derivative_claimant_broken_staff: "The Broken Personal Staff"
infantry_spawn_derivative_claimant_broken_staff_desc: "The claimant's last couriers have been scattered, leaving isolated officers to defend seals that no longer carry an order."
infantry_spawn_derivative_zombie_devouring_fragments: "Devouring Fragments"
infantry_spawn_derivative_zombie_devouring_fragments_desc: "Leaderless bands of the base dead wander beyond any lasting muster order."
infantry_spawn_derivative_ghost_fading_host: "Fading Host"
infantry_spawn_derivative_ghost_fading_host_desc: "The defeated procession loses anchors and shared memory with every passing march."
infantry_spawn_derivative_golem_crumbling_host: "Crumbling Host"
infantry_spawn_derivative_golem_crumbling_host_desc: "Broken foundries and missing patterns leave the remaining constructs slow to repair and hard to command."

infantry_spawn_derivative_focus_tree: "The Host Takes Shape"

infantry_spawn_derivative_hold_the_first_ground: "Hold the First Ground"
infantry_spawn_derivative_hold_the_first_ground_desc: "The host exists because its formations occupy real roads, depots, and towns. Those first positions must survive the former state's answer."
infantry_spawn_derivative_hold_the_first_ground_tt: "Gain £command_power §Y[?constant:infantry_spawn_derivative_reward.command_power_medium|0]§! and £army_experience §Y[?constant:infantry_spawn_derivative_reward.army_experience_small|0]§!."

infantry_spawn_derivative_count_the_surviving_host: "Count the Surviving Host"
infantry_spawn_derivative_count_the_surviving_host_desc: "No government can command formations whose strength, losses, and obligations remain scattered among battlefield reports."
infantry_spawn_derivative_count_the_surviving_host_tt: "Complete the first host census, gain £pol_power §Y[?constant:infantry_spawn_derivative_reward.political_power_small|0]§!, and gain £command_power §Y[?constant:infantry_spawn_derivative_reward.command_power_small|0]§!."

infantry_spawn_derivative_inventory_the_seized_districts: "Inventory the Seized Districts"
infantry_spawn_derivative_inventory_the_seized_districts_desc: "The host will catalogue every captured depot, anchor, workshop, and reserve left inside its opening territory."
infantry_spawn_derivative_inventory_the_seized_districts_tt: "Reconcile the opening local-asset shortfall, unlock §YSecure a Muster Depot§!, and let family hosts also receive a family-specific reserve: zombies gain infantry equipment, ghosts gain Command Power, and golems gain Coal Golem Equipment."

infantry_spawn_derivative_restore_a_chain_of_orders: "Restore a Chain of Orders"
infantry_spawn_derivative_restore_a_chain_of_orders_desc: "Private countersigns and improvised columns must become a headquarters able to issue one authenticated order."
infantry_spawn_derivative_restore_a_chain_of_orders_tt: "Gain £command_power §Y[?constant:infantry_spawn_derivative_reward.command_power_small|0]§! and £army_experience §Y[?constant:infantry_spawn_derivative_reward.army_experience_small|0]§!."

infantry_spawn_derivative_name_the_future_host: "Name the Future Host"
infantry_spawn_derivative_name_the_future_host_desc: "The breakaway must decide whether it belongs to a claimant, a council of formations, or the family that fills its ranks."
infantry_spawn_derivative_name_the_future_host_tt: "Gain £pol_power §Y[?constant:infantry_spawn_derivative_reward.political_power_medium|0]§! and open the three mutually exclusive hierarchy routes."

infantry_spawn_derivative_crown_the_claimant: "Crown the Claimant"
infantry_spawn_derivative_crown_the_claimant_desc: "A founding commander may take the crown. If none marched at the head of the revolt, the officers will nominate one from the region's surviving command."
infantry_spawn_derivative_crown_the_claimant_tt: "Install or appoint a recorded claimant, adopt the §YClaimant Sovereignty§! route, establish its government and family identity, and close the Collective and Species routes."

infantry_spawn_derivative_assign_command_estates: "Assign Command Estates"
infantry_spawn_derivative_assign_command_estates_desc: "Depots, workshops, and governed districts will be entrusted to officers whose authority descends from the claimant."
infantry_spawn_derivative_assign_command_estates_tt: "Establish the command estates and gain £pol_power §Y[?constant:infantry_spawn_derivative_reward.political_power_small|0]§!."

infantry_spawn_derivative_one_voice_over_the_host: "One Voice Over the Host"
infantry_spawn_derivative_one_voice_over_the_host_desc: "Every family formation and captured auxiliary will receive its final orders through the claimant's staff."
infantry_spawn_derivative_one_voice_over_the_host_tt: "Consolidate claimant command and gain £command_power §Y[?constant:infantry_spawn_derivative_reward.command_power_medium|0]§!."

infantry_spawn_derivative_convene_the_host_council: "Convene the Host Council"
infantry_spawn_derivative_convene_the_host_council_desc: "District staffs and formation delegates will share command without placing the host beneath one claimant."
infantry_spawn_derivative_convene_the_host_council_tt: "Adopt the §YCollective Host§! route, establish its council government and family identity, and close the Claimant and Species routes."

infantry_spawn_derivative_bind_the_district_councils: "Bind the District Councils"
infantry_spawn_derivative_bind_the_district_councils_desc: "Local authorities will retain their voices under one common ledger and mutual obligations."
infantry_spawn_derivative_bind_the_district_councils_tt: "Bind the district councils, open the Collective Host's governance operations, and gain £command_power §Y[?constant:infantry_spawn_derivative_reward.command_power_small|0]§!."

infantry_spawn_derivative_no_host_abandoned: "No Host Abandoned"
infantry_spawn_derivative_no_host_abandoned_desc: "Every district will reinforce a threatened neighbor, even when its own formations belong to another local command."
infantry_spawn_derivative_no_host_abandoned_tt: "Consolidate collective command and gain £pol_power §Y[?constant:infantry_spawn_derivative_reward.political_power_medium|0]§!."

infantry_spawn_derivative_obey_the_family_instinct: "Obey the Family Instinct"
infantry_spawn_derivative_obey_the_family_instinct_desc: "The host will recognize the needs and impulses of its nonhuman family as the foundation of government."
infantry_spawn_derivative_obey_the_family_instinct_tt: "Adopt the §YSpecies Realm§! route, establish its family government and identity, and close the Claimant and Collective routes."

infantry_spawn_derivative_mark_the_family_domain: "Mark the Family Domain"
infantry_spawn_derivative_mark_the_family_domain_desc: "Every road, resource, and occupied office will be judged by what it contributes to the host's survival."
infantry_spawn_derivative_mark_the_family_domain_tt: "Mark the family domain, open the Species Realm's governance operations, and gain £command_power §Y[?constant:infantry_spawn_derivative_reward.command_power_medium|0]§!."

infantry_spawn_derivative_end_the_old_chain_of_rule: "End the Old Chain of Rule"
infantry_spawn_derivative_end_the_old_chain_of_rule_desc: "No outside government will again treat the host as an inventory of formations waiting to be reclaimed."
infantry_spawn_derivative_end_the_old_chain_of_rule_tt: "Consolidate species command, gain §Y[?constant:infantry_spawn_derivative_reward.war_support_medium|%0]§! War Support, and gain £army_experience §Y[?constant:infantry_spawn_derivative_reward.army_experience_small|0]§!."

infantry_spawn_derivative_mark_the_muster_depots: "Mark the Muster Depots"
infantry_spawn_derivative_mark_the_muster_depots_desc: "The host will identify the stores and junctions from which its formations can be supplied under their own seals."
infantry_spawn_derivative_mark_the_muster_depots_tt: "Unlock §YSecure a Muster Depot§! and gain £pol_power §Y[?constant:infantry_spawn_derivative_reward.political_power_small|0]§!."

infantry_spawn_derivative_reopen_captured_workshops: "Reopen Captured Workshops"
infantry_spawn_derivative_reopen_captured_workshops_desc: "Abandoned repair sheds and military workshops will be adapted to the family that now controls them."
infantry_spawn_derivative_reopen_captured_workshops_tt: "Receive a medium family-specific reserve. Zombies gain infantry equipment, ghosts gain Political Power, and golems gain Coal Golem Equipment."

infantry_spawn_derivative_open_the_living_corridor: "Open the Living Corridor"
infantry_spawn_derivative_open_the_living_corridor_desc: "A marked chain of depots, anchors, or workshops will carry the host's needs between its districts."
infantry_spawn_derivative_open_the_living_corridor_tt: "Unlock §YEstablish a Sustainment Site§! and gain £command_power §Y[?constant:infantry_spawn_derivative_reward.command_power_small|0]§!."

infantry_spawn_derivative_count_every_obligation: "Count Every Obligation"
infantry_spawn_derivative_count_every_obligation_desc: "The government will record what each formation consumes and which authority is responsible for paying it."
infantry_spawn_derivative_count_every_obligation_tt: "Unlock §YMeet the Host's Sustenance§! and establish a sustainment institution that preserves the host's chosen military method."

infantry_spawn_derivative_quiet_the_fragmented_columns: "Quiet the Fragmented Columns"
infantry_spawn_derivative_quiet_the_fragmented_columns_desc: "Rival countersigns will be isolated before they can turn local confusion into a second breakaway."
infantry_spawn_derivative_quiet_the_fragmented_columns_tt: "Unlock §YSuppress Command Fragmentation§!."

infantry_spawn_derivative_outlast_the_former_state: "Outlast the Former State"
infantry_spawn_derivative_outlast_the_former_state_desc: "The old government's knowledge of our routes and officers will matter less with every month the host survives."
infantry_spawn_derivative_outlast_the_former_state_tt: "Unlock §YBreak the Former Command Net§! and gain §Y[?constant:infantry_spawn_derivative_reward.war_support_medium|%0]§! War Support."

infantry_spawn_derivative_make_an_army_of_the_host: "Make an Army of the Host"
infantry_spawn_derivative_make_an_army_of_the_host_desc: "A government made from stray formations must choose a repeatable method of fighting."
infantry_spawn_derivative_make_an_army_of_the_host_tt: "Open the three mutually exclusive military-method routes and gain £army_experience §Y[?constant:infantry_spawn_derivative_reward.army_experience_medium|0]§! Army Experience."

infantry_spawn_derivative_concentrate_the_host: "Concentrate the Host"
infantry_spawn_derivative_concentrate_the_host_desc: "Gather the strongest formations beneath one plan and accept the supply cost of decisive mass."
infantry_spawn_derivative_concentrate_the_host_tt: "Reform the host's logistics around the §YConcentrated Host Method§! and close the Scattered Bands and Captured Auxiliaries routes."

infantry_spawn_derivative_scatter_the_bands: "Scatter the Bands"
infantry_spawn_derivative_scatter_the_bands_desc: "Let independent columns survive through movement, local knowledge, and rapid reinforcement."
infantry_spawn_derivative_scatter_the_bands_tt: "Reform the host's logistics around the §YScattered Bands Method§! and close the Concentrated Host and Captured Auxiliaries routes."

infantry_spawn_derivative_arm_the_captured_auxiliaries: "Arm the Captured Auxiliaries"
infantry_spawn_derivative_arm_the_captured_auxiliaries_desc: "Ordinary soldiers and seized stores will cover the tasks that family formations cannot perform alone."
infantry_spawn_derivative_arm_the_captured_auxiliaries_tt: "Reform the host's logistics around the §YCaptured Auxiliaries Method§!, close the other military-method routes, and receive £infantry_equipment_text_icon §Y[?constant:infantry_spawn_derivative_reward.infantry_equipment_small|0]§!."

infantry_spawn_derivative_a_method_fit_for_the_host: "A Method Fit for the Host"
infantry_spawn_derivative_a_method_fit_for_the_host_desc: "The chosen doctrine will be carried from the founding formations into every future campaign."
infantry_spawn_derivative_a_method_fit_for_the_host_tt: "Complete the host's military method, gain £command_power §Y[?constant:infantry_spawn_derivative_reward.command_power_medium|0]§!, and gain £army_experience §Y[?constant:infantry_spawn_derivative_reward.army_experience_medium|0]§!."

infantry_spawn_derivative_read_the_neighboring_frontiers: "Read the Neighboring Frontiers"
infantry_spawn_derivative_read_the_neighboring_frontiers_desc: "Map nearby garrisons, weak junctions, and districts whose governments could not withstand the host."
infantry_spawn_derivative_read_the_neighboring_frontiers_tt: "Complete the frontier survey and gain £pol_power §Y[?constant:infantry_spawn_derivative_reward.political_power_small|0]§!."

infantry_spawn_derivative_issue_the_submission_terms: "Issue the Submission Terms"
infantry_spawn_derivative_issue_the_submission_terms_desc: "Neighboring governments will receive a fixed term to recognize the host or prepare for war."
infantry_spawn_derivative_issue_the_submission_terms_tt: "Unlock §YDemand Local Submission§!."

infantry_spawn_derivative_absorb_the_conquered_districts: "Absorb the Conquered Districts"
infantry_spawn_derivative_absorb_the_conquered_districts_desc: "Occupation offices will become permanent district administrations able to sustain the host."
infantry_spawn_derivative_absorb_the_conquered_districts_tt: "Unlock the host family's conquered-district integration operation."

infantry_spawn_derivative_turn_the_host_outward: "Turn the Host Outward"
infantry_spawn_derivative_turn_the_host_outward_desc: "The formations will stop measuring themselves against the former state and begin planning beyond it."
infantry_spawn_derivative_turn_the_host_outward_tt: "Prepare the outward campaign and gain £army_experience §Y[?constant:infantry_spawn_derivative_reward.army_experience_medium|0]§!."

infantry_spawn_derivative_become_the_regional_predator: "Become the Regional Predator"
infantry_spawn_derivative_become_the_regional_predator_desc: "Repeated victories and districts made answerable to the host will make it the power that every nearby government must calculate first."
infantry_spawn_derivative_become_the_regional_predator_tt: "Requires a consolidated hierarchy, completed family transformation, sustainable reinforcement, resolved former-state pressure, at least §Y[?constant:infantry_spawn_derivative_package_value.one|0]§! integrated family district (or an established claimant sustainment district), §Y[?constant:infantry_spawn_derivative_runtime.regional_predator_states|0]§! controlled states, and §Y[?constant:infantry_spawn_derivative_runtime.regional_predator_wars|0]§! recorded war victories. Grants §YRegional Predator§!."

infantry_spawn_derivative_zombie_scavenge_the_abandoned_barracks: "Scavenge the Abandoned Barracks"
infantry_spawn_derivative_zombie_scavenge_the_abandoned_barracks_desc: "The base dead will strip empty barracks, battlefield dumps, and broken columns for usable rifles."
infantry_spawn_derivative_zombie_scavenge_the_abandoned_barracks_tt: "Gain £infantry_equipment_text_icon §Y[?constant:infantry_spawn_derivative_reward.infantry_equipment_medium|0]§!."

infantry_spawn_derivative_zombie_number_the_devouring_bands: "Number the Devouring Bands"
infantry_spawn_derivative_zombie_number_the_devouring_bands_desc: "Each hunger will receive a muster number, a march signal, and a place in the host's order."
infantry_spawn_derivative_zombie_number_the_devouring_bands_tt: "Requires the §YSpecies Realm§! route. Number the bands, unlock §YRally a Devouring Band§! and §YSuppress Command Fragmentation§!, shorten zombie district integration, gain £army_experience §Y[?constant:infantry_spawn_derivative_reward.army_experience_small|0]§! Army Experience, and gain £command_power §Y[?constant:infantry_spawn_derivative_reward.command_power_small|0]§! Command Power. This excludes the controlled-training and claimant-column methods."

infantry_spawn_derivative_zombie_teach_the_base_dead_to_muster: "Teach the Base Dead to Muster"
infantry_spawn_derivative_zombie_teach_the_base_dead_to_muster_desc: "Repeated drills will turn the least altered dead into formations that can be raised by order."
infantry_spawn_derivative_zombie_teach_the_base_dead_to_muster_tt: "Requires the §YCollective Host§! route. Unlock §YTeach the Base Dead to Muster§! as a controlled training decision and gain £army_experience §Y[?constant:infantry_spawn_derivative_reward.army_experience_small|0]§! Army Experience. This excludes the numbered-band and claimant-column methods."

infantry_spawn_derivative_zombie_keep_the_hunger_in_column: "Keep the Hunger in Column"
infantry_spawn_derivative_zombie_keep_the_hunger_in_column_desc: "Fixed intervals, guarded routes, and numbered signals will keep feeding impulses from breaking the march."
infantry_spawn_derivative_zombie_keep_the_hunger_in_column_tt: "The Claimant route disciplines the devouring columns, opens controlled base-dead training, and unlocks §YBreak the Former Command Net§!. This excludes the other zombie methods."

infantry_spawn_derivative_zombie_a_realm_of_base_dead: "A Realm of Base Dead"
infantry_spawn_derivative_zombie_a_realm_of_base_dead_desc: "The numbered bands will recognize a lasting state built for their own continued muster."
infantry_spawn_derivative_zombie_a_realm_of_base_dead_tt: "Complete the zombie host identity, gain §Y[?constant:infantry_spawn_derivative_reward.war_support_medium|%0]§! War Support, and gain £command_power §Y[?constant:infantry_spawn_derivative_reward.command_power_medium|0]§!."

infantry_spawn_derivative_ghost_mark_the_first_anchors: "Mark the First Anchors"
infantry_spawn_derivative_ghost_mark_the_first_anchors_desc: "The procession will identify the places, objects, and memories able to hold it to the world."
infantry_spawn_derivative_ghost_mark_the_first_anchors_tt: "Mark the first anchors and gain £pol_power §Y[?constant:infantry_spawn_derivative_reward.political_power_small|0]§!."

infantry_spawn_derivative_ghost_call_a_second_procession: "Call a Second Procession"
infantry_spawn_derivative_ghost_call_a_second_procession_desc: "With known anchors and a common summons, another pale formation can gather beneath the host."
infantry_spawn_derivative_ghost_call_a_second_procession_tt: "Requires the §YSpecies Realm§! route. Unlock §YCall Another Pale Procession§! before the family transformation is complete and gain £command_power §Y[?constant:infantry_spawn_derivative_reward.command_power_small|0]§! Command Power. This excludes the anchored and claimant-controlled methods."

infantry_spawn_derivative_ghost_bind_the_procession_to_place: "Bind the Procession to Place"
infantry_spawn_derivative_ghost_bind_the_procession_to_place_desc: "Shared ground will keep the host coherent when memory and distance pull its formations apart."
infantry_spawn_derivative_ghost_bind_the_procession_to_place_tt: "Requires the §YCollective Host§! route. Anchor the procession, unlock §YEstablish a Sustainment Site§!, and shorten ghost district recognition. This excludes the early-procession and claimant-controlled methods."

infantry_spawn_derivative_ghost_thin_the_hunger_for_life: "Thin the Hunger for Life"
infantry_spawn_derivative_ghost_thin_the_hunger_for_life_desc: "Carefully ordered anchors will reduce the procession's need to draw strength from the living population."
infantry_spawn_derivative_ghost_thin_the_hunger_for_life_tt: "The Claimant route reduces the periodic population toll of ghost decline to its managed rate and gains £stability_texticon §Y[?constant:infantry_spawn_derivative_reward.stability_medium|%0]§! Stability. This excludes the early-procession and anchored methods."

infantry_spawn_derivative_ghost_a_pale_dominion: "A Pale Dominion"
infantry_spawn_derivative_ghost_a_pale_dominion_desc: "The procession will hold land through anchors, shared memory, and a government belonging to the dead."
infantry_spawn_derivative_ghost_a_pale_dominion_tt: "Complete the ghost host identity, gain §Y[?constant:infantry_spawn_derivative_reward.war_support_medium|%0]§! War Support, and gain £command_power §Y[?constant:infantry_spawn_derivative_reward.command_power_medium|0]§!."

infantry_spawn_derivative_golem_recover_the_broken_coal: "Recover the Broken Coal"
infantry_spawn_derivative_golem_recover_the_broken_coal_desc: "The host will gather scattered cores, braces, and furnace stocks from the ruins of its first workshops."
infantry_spawn_derivative_golem_recover_the_broken_coal_tt: "Gain §Y[?constant:infantry_spawn_derivative_reward.coal_golem_equipment_medium|0]§! Coal Golem Equipment."

infantry_spawn_derivative_golem_reconstruct_the_binding_marks: "Reconstruct the Binding Marks"
infantry_spawn_derivative_golem_reconstruct_the_binding_marks_desc: "Surviving patterns will be compared until the host can bind another formation without the lost masters."
infantry_spawn_derivative_golem_reconstruct_the_binding_marks_tt: "Requires the §YSpecies Realm§! route. Reconstruct a central binding pattern, unlock §YBind Another Stone Host§!, and gain £army_experience §Y[?constant:infantry_spawn_derivative_reward.army_experience_small|0]§! Army Experience. This excludes the foundry and claimant-shared patterns."

infantry_spawn_derivative_golem_turn_workshops_into_foundries: "Turn Workshops into Foundries"
infantry_spawn_derivative_golem_turn_workshops_into_foundries_desc: "Repair sheds will become permanent sites for shaping coal cores, braces, and control harnesses."
infantry_spawn_derivative_golem_turn_workshops_into_foundries_tt: "Requires the §YCollective Host§! route. Distribute binding work across permanent foundries, gain §Y[?constant:infantry_spawn_derivative_reward.coal_golem_equipment_small|0]§! Coal Golem Equipment, and shorten golem district integration. This excludes the other golem patterns."

infantry_spawn_derivative_golem_share_the_living_pattern: "Share the Living Pattern"
infantry_spawn_derivative_golem_share_the_living_pattern_desc: "Every workshop will hold enough of the pattern to correct mistakes and survive the loss of one master."
infantry_spawn_derivative_golem_share_the_living_pattern_tt: "The Claimant route shares the living pattern under one authority, strengthens material-agreement planning, and gains £stability_texticon §Y[?constant:infantry_spawn_derivative_reward.stability_medium|%0]§! Stability. This excludes the other golem patterns."

infantry_spawn_derivative_golem_a_march_of_living_stone: "A March of Living Stone"
infantry_spawn_derivative_golem_a_march_of_living_stone_desc: "Foundries, marks, and constructs will become one self-sustaining government in motion."
infantry_spawn_derivative_golem_a_march_of_living_stone_tt: "Complete the golem host identity, gain §Y[?constant:infantry_spawn_derivative_reward.war_support_medium|%0]§! War Support, and gain £command_power §Y[?constant:infantry_spawn_derivative_reward.command_power_medium|0]§!."


# Retained compatibility localisation for the archived pre-decision-only surface
infantry_spawn_muster_gui_title: "Infantry Muster Board"
infantry_spawn_muster_gui_subtitle: "National formation orders"
infantry_spawn_muster_gui_animations: "Motion"
infantry_spawn_muster_gui_animations_tt: "Enable or disable the Muster Board's animated border and emblem motion."
infantry_spawn_muster_gui_refresh: "Refresh"
infantry_spawn_muster_gui_refresh_tt: "Recount formation lots, claimant files, anomalous hosts, and recent generation records."
infantry_spawn_muster_gui_close: "Close"
infantry_spawn_muster_gui_close_tt: "Close the Muster Board."

infantry_spawn_muster_gui_tab_overview: "Overview"
infantry_spawn_muster_gui_tab_overview_tt: "Review national muster pressure and issue another formation request."
infantry_spawn_muster_gui_tab_lots: "Lots"
infantry_spawn_muster_gui_tab_lots_tt: "Inspect numbered formation lots and issue disposition orders."
infantry_spawn_muster_gui_tab_command: "Claimants"
infantry_spawn_muster_gui_tab_command_tt: "Review commanders who have gathered private authority within the muster."
infantry_spawn_muster_gui_tab_anomalous: "Anomalous"
infantry_spawn_muster_gui_tab_anomalous_tt: "Review zombie, ghost, golem, and other nonhuman formation families available to this country."
infantry_spawn_muster_gui_tab_history: "History"
infantry_spawn_muster_gui_tab_history_tt: "Review the most recent generations recorded by the formation ledger."

infantry_spawn_muster_gui_control: "Muster Control\n§Y[?infantry_spawn_muster_control|0]§!"
infantry_spawn_muster_gui_control_tt: "Muster Control measures whether national orders reach the unbidden formations. Strong control improves audits and claimant responses. Weak control allows private command networks to grow."
infantry_spawn_muster_gui_congestion: "Army Congestion\n§Y[?infantry_spawn_army_congestion|0]§!"
infantry_spawn_muster_gui_congestion_tt: "Army Congestion measures the burden imposed by unresolved and poorly integrated formation lots. Unsettled manpower liability raises this pressure. Territorial assignments, training, settlement, and demobilization reduce it."
infantry_spawn_muster_gui_debt: "Equipment / Manpower\n§Y[?infantry_spawn_equipment_debt|0]§! / §Y[?infantry_spawn_manpower_liability|0]§!"
infantry_spawn_muster_gui_debt_tt: "Equipment Debt records weapons, vehicles, and stores consumed before a lot's obligations were settled. Manpower Liability records the personnel obligation still carried by active formation records."
infantry_spawn_muster_gui_saturation: "Anomalous Saturation\n§Y[?infantry_spawn_anomalous_saturation|0]§!"
infantry_spawn_muster_gui_saturation_tt: "Anomalous Saturation measures how heavily nonhuman hosts press against the ordinary army and civil population."

infantry_spawn_muster_gui_rail_active_lots: "Lots §Y[?infantry_spawn_active_lot_count|0]§!"
infantry_spawn_muster_gui_rail_open_records: "Open §Y[?infantry_spawn_unresolved_generation_count|0]§!"
infantry_spawn_muster_gui_rail_claimants: "Claims §Y[?infantry_spawn_active_claimant_count|0]§!"
infantry_spawn_muster_gui_rail_anomalies: "Anomaly §Y[?infantry_spawn_anomalous_saturation|0]§!"
infantry_spawn_muster_gui_rail_requests: "Requests §Y[?infantry_spawn_request_count_generation|0]§!"
infantry_spawn_muster_gui_rail_divisions: "Divisions §Y[?infantry_spawn_active_division_count|0]§!"

infantry_spawn_muster_gui_overview_summary: "Choose the next formation order."
infantry_spawn_muster_gui_overview_summary_tt: "Formation choices shape the composition of the next lot. The price rises with national reach, active formations, unresolved lots, congestion, and repeated requests."
infantry_spawn_muster_gui_overview_actions_heading: "Lot orders"
infantry_spawn_muster_gui_overview_audit: "Audit"
