chaosx.nr19.910.t: "The Muster That Would Not Die"
chaosx.nr19.910.d: "The first numbered bands have crossed the old district boundary without waiting for a living officer. Torn uniforms still carry the seals of the muster that armed them, but hunger has become their common drill. Depot clerks have barred the doors. The dead have begun issuing their own assembly calls."
chaosx.nr19.910.a: "Count every band."
chaosx.nr19.911.t: "Every Hunger Scattered"
chaosx.nr19.911.d: "The numbered bands no longer answer one another. Their depots are empty, their countersigns broken, and the roads behind them are held by living patrols. What survives moves in small hungers through ruined cantonments, unable to restore the host that once marched beneath a single seal."
chaosx.nr19.911.a: "Seal the abandoned barracks."
chaosx.nr19.912.t: "The Pale Procession Crosses the Wire"
chaosx.nr19.912.d: "At dusk the field telephones began ringing from disconnected lines. A procession gathered around stations, memorials, and empty command posts, each pale rank fixed to a remembered place. No living headquarters gave the order to advance. By midnight the old frontier belonged to an army held together by anchors and memory."
chaosx.nr19.912.a: "Mark every anchor on the map."
chaosx.nr19.913.t: "The Last Anchor Goes Dark"
chaosx.nr19.913.d: "The procession has lost the places that gave it shape. Signals fade between abandoned posts, pale ranks thin along the roads, and the final command echoes have fallen silent. Remnants still linger where memory is strongest, but no common host remains to carry them across the frontier."
chaosx.nr19.913.a: "Let the silence hold."
chaosx.nr19.914.t: "The Workshops Begin to March"
chaosx.nr19.914.d: "Coal cores burn behind iron braces while living marks pass from workshop to workshop. The constructs no longer wait for requisition papers from the state that assembled them. They have taken the depots, repeated the binding pattern, and set the roads trembling beneath a government made of stone and orders."
chaosx.nr19.914.a: "Record the master pattern."
chaosx.nr19.915.t: "The Living Pattern Breaks"
chaosx.nr19.915.d: "The workshops are cold and the shared marks no longer answer. Along the defeated front, cracked constructs stand where their last instructions ended. A few cores still glow beneath collapsed depots, but the pattern that joined them into a state has broken into isolated, crumbling hosts."
chaosx.nr19.915.a: "Dismantle what still moves."
chaosx.nr19.917.t: "The Last Claimant's Seal"
chaosx.nr19.917.d: "The breakaway's headquarters has fallen. Couriers burn their ledgers in the yard while the final loyal formations surrender their marked rifles and torn standards. The claimant's seal survives on a few hidden orders, but no district remains willing or able to answer it."
chaosx.nr19.917.a: "Close the muster rolls."
chaosx.nr19.918.t: "A New Project Force Takes Shape"
chaosx.nr19.918.d: "The project force has crossed the boundary between prototype and host. Its cadres answer a new command receipt, and the first formations march under a neutral muster seal independent of the laboratory that created them."
chaosx.nr19.918.a: "Register the host."
chaosx.nr19.919.t: "The Project Host Falls Silent"
chaosx.nr19.919.d: "The project host has lost its final command receipt. Its equipment is scattered, its formations have been accounted for, and the neutral muster seal no longer authorizes a living response."
chaosx.nr19.919.a: "Close the project ledger."
