l_english:
chaosx.nr19.1.t: "Infantry Spawn"

chaosx.nr19.2.t: "The Unbidden Muster"
chaosx.nr19.2.d: "Before dawn, formations appeared across [ROOT.GetNameDef] with full ranks, unfamiliar officers, and orders bearing seals that no ministry issued. Their ranks carry ordinary rifles, vehicles, specialist companies, and equipment our depots cannot explain. Every company is waiting to learn whether the state intends to command it."
chaosx.nr19.2.evolution_i.d: "Before dawn, formations appeared across [ROOT.GetNameDef] beneath seals no ministry issued. District staffs already hold common rolls, supply tables, and countersigns prepared for arrivals nobody recruited. Every company is waiting for its place in the national line."
chaosx.nr19.2.evolution_ii.d: "Before dawn, fully formed units appeared across [ROOT.GetNameDef] with rifles, vehicles, armor, and specialist equipment drawn from incompatible arsenals. The army can use them, but each lot brings its own demands for training, repair, and supply."
chaosx.nr19.2.evolution_iii.d: "Before dawn, complete military societies appeared across [ROOT.GetNameDef]. Their officers carry private seals, their companies share unfamiliar countersigns, and a sealed muster ledger offers the government its first draw before those commands learn to stand alone."
chaosx.nr19.2.evolution_iv.d: "Before dawn, ordinary formations and impossible hosts appeared across [ROOT.GetNameDef]. Dead infantry, pale processions, and living stone wait beside the national barracks, each carrying obligations and loyalties that no ordinary personnel roll can contain."
chaosx.nr19.2.a: "Put every company on the rolls."
chaosx.nr19.2.b: "Open the sealed muster ledger and accept its first draw."
chaosx.nr19.2.b.tt: "Accept one initial unrestricted formation draw, open the Muster Board, and place the new lot under national accounting."
chaosx.nr19.2.c: "Keep the sealed ledger closed."
chaosx.nr19.2.c.tt: "Decline the initial draw and keep the Muster Board dormant. Refusal during a war weakens Muster Control and raises Army Congestion."

chaosx.nr19.101.t: "The Muster Finds Its Order"
chaosx.nr19.101.d: "The unbidden formations no longer answer to improvised lists and hurried countersigns. District staffs have begun assigning officers, tracing supply routes, and treating each arrival as part of a national muster. The army has gained a structure large enough to hold what appeared overnight."
chaosx.nr19.101.a: "Give every formation a place in the line."

chaosx.nr19.102.t: "The Arsenal Draws Lots"
chaosx.nr19.102.d: "The latest formations have arrived with their own arsenals. Tank crews report without spare tracks, motor columns carry parts from incompatible factories, and specialist companies demand ammunition that no ordinary table anticipated. The muster can still use them, and every unusual lot brings a new burden of training, repair, and supply."
chaosx.nr19.102.a: "Inventory every weapon before it reaches the front."

chaosx.nr19.103.t: "Commands Without a Country"
chaosx.nr19.103.d: "Fresh formations now arrive as complete military societies. Their companies share private countersigns, their officers claim victories nobody remembers, and their commanders speak as though the barracks already owe them political obedience. The muster has become a contest over who commands the army and what the army may command in return."
chaosx.nr19.103.a: "No private order outranks the state."

chaosx.nr19.104.t: "The Barracks Admit the Impossible"
chaosx.nr19.104.d: "The newest columns cannot be entered on an ordinary personnel roll. Dead infantry stand in numbered ranks, pale processions gather around fixed anchors, and living stone waits beside heaps of coal and binding marks. They can fight, and each family carries needs and loyalties that no human quartermaster can ignore."
chaosx.nr19.104.a: "Open a separate ledger for every impossible host."

chaosx.nr19.105.t: "The First Impossible Delegation"
chaosx.nr19.105.d: "A delegation from the §Y[This.GetInfantrySpawnSelectedFamilyName]§! has reached the command offices before its formation enters the national roll. Its terms are neither enlistment papers nor an ultimatum. The host will accept guarded quarters, a compact recognizing its own internal authority, or a refusal delivered before its ranks cross the gate."
chaosx.nr19.105.a: "Receive the host inside a guarded cantonment."
chaosx.nr19.105.a.tt: "Accepts one §Y[This.GetInfantrySpawnSelectedFamilyName]§! formation under guarded national custody.\nMuster Control: §G+[?constant:infantry_spawn_first_family_reception.cantonment_control_gain|0]§!\nAnomalous Saturation Pressure: §G-[?constant:infantry_spawn_first_family_reception.cantonment_pressure_relief|0]§!\nThis first reception carries no material or administrative charge."
chaosx.nr19.105.b: "Negotiate a compact with its own command."
chaosx.nr19.105.b.tt: "Accepts one §Y[This.GetInfantrySpawnSelectedFamilyName]§! formation under a negotiated charter recognizing its internal autonomy.\nArmy Experience: §G+[?constant:infantry_spawn_first_family_reception.negotiated_army_experience_gain|0]§!\nMuster Control: §R-[?constant:infantry_spawn_first_family_reception.negotiated_control_loss|0]§!\nAnomalous Saturation Pressure: §R+[?constant:infantry_spawn_first_family_reception.negotiated_pressure_gain|0]§!\nThis first reception carries no material or administrative charge."
chaosx.nr19.105.c: "Refuse the host before the gate opens."
chaosx.nr19.105.c.tt: "No family formation is accepted.\nPolitical Power: §R-[?constant:infantry_spawn_first_family_reception.refusal_political_power_cost|0]§!\nCommand Power: §R-[?constant:infantry_spawn_first_family_reception.refusal_command_power_cost|0]§!\nMuster Control: §G+[?constant:infantry_spawn_first_family_reception.refusal_control_gain|0]§!\nAnomalous Saturation Pressure: §G-[?constant:infantry_spawn_first_family_reception.refusal_pressure_relief|0]§!"

chaosx.nr19.200.t: "A Commander Claims the Muster"
chaosx.nr19.200.d: "[This.GetInfantrySpawnSelectedClaimantName] has taken custody of a recorded formation lot and begun issuing orders through a loyal staff. Officers who were strangers yesterday repeat the claimant's countersigns, and depot clerks accept requisitions bearing a private seal. A commander has become a political fact."
chaosx.nr19.200.a: "Record the name and watch the ranks."

chaosx.nr19.201.t: "The Claimant's Price"
chaosx.nr19.201.d: "[This.GetInfantrySpawnSelectedClaimantName] has delivered a signed demand backed by formations that already obey a separate chain of command. The present demand is §Y[This.GetInfantrySpawnSelectedClaimantDemand]§!. [This.GetInfantrySpawnSelectedClaimantGeneralissimoContext] Acceptance may keep the claimant inside the state. Refusal may teach the claimant how much power the state still possesses."
chaosx.nr19.201.a: "Meet the demand."
chaosx.nr19.201.a.tt: "$infantry_spawn_accept_claimant_demand_cost_text$\n\n$infantry_spawn_accept_claimant_demand_effect_tt$"
chaosx.nr19.201.b: "Refuse it."
chaosx.nr19.201.b.tt: "$infantry_spawn_refuse_claimant_demand_effect_tt$"

chaosx.nr19.202.t: "Orders Split at the Barracks"
chaosx.nr19.202.d: "Loyal officers report duplicate movement orders, guarded depots, and companies leaving their assigned cantonments under private colors. [This.GetInfantrySpawnSelectedClaimantName] is testing whether the formations will follow the government or the commander who first gave them purpose."
chaosx.nr19.202.a: "Secure the loyal commands."

chaosx.nr19.203.t: "The Muster Seizes the State"
chaosx.nr19.203.d: "[This.GetInfantrySpawnSelectedClaimantName] has occupied the command offices, replaced the national countersign, and ordered every formation to recognize a single military authority. Ministries continue to function under seals that carry weight only when the claimant permits it."
chaosx.nr19.203.a: "The government answers to the barracks."

chaosx.nr19.204.t: "The Coup Breaks in the Corridors"
chaosx.nr19.204.d: "The claimant's staff tried to seize the command offices before its loyal formations could close every road. Government troops held the communications rooms and arrested the first wave of conspirators. The coup has failed, and a divided officer corps and abandoned orders have left the army badly shaken."
chaosx.nr19.204.a: "Rebuild one chain of command."

chaosx.nr19.206.t: "The Family Breach Is Contained"
chaosx.nr19.206.d: "Claimant-free formations of the §Y[This.GetInfantrySpawnSelectedFamilyName]§! tried to close their districts to the national chain of command. Their recorded rolls did not support a clean transfer of authority, and loyal staffs held the junctions long enough to keep the host inside its existing perimeter. The breach has been deferred, not forgotten."
chaosx.nr19.206.a: "Reinforce the perimeter before it tests us again."

chaosx.nr19.300.t: "The Keys to an Unbidden Barracks"
chaosx.nr19.300.d: "An unbidden formation in [infantry_spawn_incident_state.GetName] has occupied a barracks that the local authorities considered their own. District officials hold the keys, army quartermasters demand the stores, and the soldiers have elected a provisional committee to guard the gate until someone settles the question of command."
chaosx.nr19.300.a: "Leave the keys with the local authority."
chaosx.nr19.300.a.tt: "The incident lot becomes §YTerritorial§! and falls under §YLocal Authority§! command.\nMuster Control: §G+[?constant:infantry_spawn_incident.control_small|0]§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_small|0]§!"
chaosx.nr19.300.b: "Place the barracks under army command."
chaosx.nr19.300.b.tt: "Training: §G+1§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_medium|0]§!\nArmy Congestion: §R+[?constant:infantry_spawn_incident.congestion_minor|0]§!\nClaimant Susceptibility: §G-[?constant:infantry_spawn_incident.claimant_susceptibility_minor|0]§!"
chaosx.nr19.300.c: "Recognize the provisional committee."
chaosx.nr19.300.c.tt: "Muster Control: §R-[?constant:infantry_spawn_incident.control_minor|0]§!\nArmy Congestion: §G-[?constant:infantry_spawn_incident.congestion_minor|0]§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_large|0]§!"

chaosx.nr19.301.t: "Cartridges Without a Caliber"
chaosx.nr19.301.d: "The rifles issued to an unbidden formation in [infantry_spawn_incident_state.GetName] accept cartridges found in no national inventory. Its officers have enough ammunition for one inspection parade and none for training. The arsenal can interrupt production, the armorers can sacrifice part of the lot, or the formation can wait behind the range gates."
chaosx.nr19.301.a: "Turn a production line to their caliber."
chaosx.nr19.301.a.tt: "Pays £infantry_equipment_text_icon §Y[?constant:infantry_spawn_incident.infantry_equipment_cost|0]§! Infantry Equipment and settles up to §G[?constant:infantry_spawn_incident.debt_relief_medium|0]§! Equipment Debt from the incident lot.\nTraining: §G+1§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_small|0]§!"
chaosx.nr19.301.b: "Break half the rifles to feed the rest."
chaosx.nr19.301.b.tt: "Settles up to §G[?constant:infantry_spawn_incident.debt_relief_medium|0]§! Equipment Debt from the incident lot.\nQuality: §R-1§!\nEquipment State: §R-1§!\nArmy Congestion: §G-[?constant:infantry_spawn_incident.congestion_small|0]§!"
chaosx.nr19.301.c: "Keep them on the range until stores arrive."
chaosx.nr19.301.c.tt: "Adds §R[?constant:infantry_spawn_incident.debt_gain_small|0]§! Infantry Equipment Debt to the incident lot and changes its status to §YTraining§!.\nMuster Control: §G+[?constant:infantry_spawn_incident.control_minor|0]§!"

chaosx.nr19.302.t: "A Motor Pool of Strangers"
chaosx.nr19.302.d: "The motor pool attached to an unbidden formation in [infantry_spawn_incident_state.GetName] contains trucks with unfamiliar engines, mismatched wheels, and fuel lines that defeat every depot manual. Local officials can keep the vehicles on district roads, the army can rebuild them to a common standard, or the quartermasters can accept the burden unchanged."
chaosx.nr19.302.a: "Confine the vehicles to territorial service."
chaosx.nr19.302.a.tt: "The incident lot becomes §YTerritorial§!, falls under §YLocal Authority§! command, and receives a §YLight§! Supply Burden.\nArmy Congestion: §G-[?constant:infantry_spawn_incident.congestion_small|0]§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_small|0]§!"
chaosx.nr19.302.b: "Rebuild the pool to a common standard."
chaosx.nr19.302.b.tt: "Pays £GFX_motorized_equipment_text_icon §Y[?constant:infantry_spawn_incident.motorized_equipment_cost|0]§! Motorized Equipment, gives the incident lot an §YOrdinary§! Supply Burden, and reduces Mobility Mismatch by up to §G[?constant:infantry_spawn_incident.mobility_mismatch_incident|0]§!.\nMuster Control: §G+[?constant:infantry_spawn_incident.control_small|0]§!"
chaosx.nr19.302.c: "Keep the convoy moving as it stands."
chaosx.nr19.302.c.tt: "The incident lot receives a §RHeavy§! Supply Burden.\nArmy Congestion: §R+[?constant:infantry_spawn_incident.congestion_medium|0]§!\nMuster Control: §R-[?constant:infantry_spawn_incident.control_minor|0]§!"

chaosx.nr19.303.t: "The Village Claims Its Soldiers"
chaosx.nr19.303.d: "A village in [infantry_spawn_incident_state.GetName] has fed, housed, and named the soldiers of an unbidden formation. Families now stand between the barracks and every army lorry sent to collect them. The formation can remain a district guard, depart under force, or accept national supplies in exchange for orderly service."
chaosx.nr19.303.a: "Bind them to territorial service."
chaosx.nr19.303.a.tt: "The incident lot becomes §YTerritorial§!.\nMuster Control: §G+[?constant:infantry_spawn_incident.control_small|0]§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_small|0]§!\nDemobilization Resistance: §R+[?constant:infantry_spawn_incident.demobilization_resistance_gain|0]§! up to §Y[?constant:infantry_spawn_incident.demobilization_resistance_maximum|0]§!. Each point adds §R[?constant:infantry_spawn_incident.demobilization_resistance_days|0] days§! to supervised demobilization and specialist preservation."
chaosx.nr19.303.b: "Enforce the transfer to army command."
chaosx.nr19.303.b.tt: "Training: §G+1§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_medium|0]§!\nArmy Congestion: §R+[?constant:infantry_spawn_incident.congestion_medium|0]§!\nClaimant Susceptibility: §G-[?constant:infantry_spawn_incident.claimant_susceptibility_minor|0]§!"
chaosx.nr19.303.c: "Supply the lot and take its oath."
chaosx.nr19.303.c.tt: "Pays £support_equipment_text_icon §Y[?constant:infantry_spawn_incident.support_equipment_cost|0]§! Support Equipment and lowers the incident lot's Supply Burden by one step.\nMuster Control: §G+[?constant:infantry_spawn_incident.control_small|0]§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_minor|0]§!"

chaosx.nr19.304.t: "Officers on No Army List"
chaosx.nr19.304.d: "The officers leading an unbidden formation in [infantry_spawn_incident_state.GetName] carry decorations from campaigns no archive records. They know their companies, their maps, and one another with unnerving precision. The army can commission them, disperse them among separate commands, or preserve the cadre under local protection."
chaosx.nr19.304.a: "Commission them into the regular army."
chaosx.nr19.304.a.tt: "Training: §G+1§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_medium|0]§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_minor|0]§!"
chaosx.nr19.304.b: "Disperse the officers among separate commands."
chaosx.nr19.304.b.tt: "Coherence: §R-1§!\nArmy Congestion: §G-[?constant:infantry_spawn_incident.congestion_medium|0]§!\nClaimant Susceptibility: §G-[?constant:infantry_spawn_incident.claimant_susceptibility_minor|0]§!"
chaosx.nr19.304.c: "Preserve the cadre under local protection."
chaosx.nr19.304.c.tt: "The incident lot falls under §YLocal Authority§! command, and its unknown officers retain a protected independent cadre.\nMuster Control: §R-[?constant:infantry_spawn_incident.control_minor|0]§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_large|0]§!"

chaosx.nr19.305.t: "Two Staffs, One Order"
chaosx.nr19.305.d: "The unbidden formation in [infantry_spawn_incident_state.GetName] has arrived beside a regular headquarters already responsible for the district. Both staffs issue marching tables, both assign the same depots, and neither accepts the other's countersign. One command arrangement must survive the week."
chaosx.nr19.305.a: "Merge the staffs under one table."
chaosx.nr19.305.a.tt: "Training: §G+1§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_medium|0]§!\nArmy Congestion: §R+[?constant:infantry_spawn_incident.congestion_minor|0]§!"
chaosx.nr19.305.b: "Give the regular staff final authority."
chaosx.nr19.305.b.tt: "Coherence: §G+1§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_medium|0]§!\nClaimant Susceptibility: §G-[?constant:infantry_spawn_incident.claimant_susceptibility_small|0]§!"
chaosx.nr19.305.c: "Reserve a territorial command for the newcomers."
chaosx.nr19.305.c.tt: "The incident lot becomes §YTerritorial§! and falls under §YLocal Authority§! command.\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_small|0]§!\nDemobilization Resistance: §R+[?constant:infantry_spawn_incident.demobilization_resistance_gain|0]§! up to §Y[?constant:infantry_spawn_incident.demobilization_resistance_maximum|0]§!. Each point adds §R[?constant:infantry_spawn_incident.demobilization_resistance_days|0] days§! to supervised demobilization and specialist preservation."

chaosx.nr19.306.t: "The Sealed Depot"
chaosx.nr19.306.d: "A sealed depot has appeared with an advanced formation in [infantry_spawn_incident_state.GetName]. Every crate fits the lot's weapons, every maintenance bench bears unfamiliar gauges, and the inventory describes stores that the national ledger already counts as missing. The depot can be absorbed, preserved intact, or stripped at once."
chaosx.nr19.306.a: "Absorb the depot into the national inventory."
chaosx.nr19.306.a.tt: "Settles up to §G[?constant:infantry_spawn_incident.debt_relief_medium|0]§! Equipment Debt from the incident lot.\nMuster Control: §G+[?constant:infantry_spawn_incident.control_small|0]§!"
chaosx.nr19.306.b: "Preserve the depot and its methods."
chaosx.nr19.306.b.tt: "Quality: §G+1§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_minor|0]§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_minor|0]§!\nAdvanced arsenal families receive §Y[?constant:infantry_spawn_incident.advanced_affinity_weight|0]§! additional muster weight in future draws."
chaosx.nr19.306.c: "Strip the depot for usable stores."
chaosx.nr19.306.c.tt: "Settles up to §G[?constant:infantry_spawn_incident.debt_relief_medium|0]§! Equipment Debt from the incident lot.\nQuality: §R-1§!\nEquipment State: §R-1§!\nArmy Congestion: §G-[?constant:infantry_spawn_incident.congestion_small|0]§!"

chaosx.nr19.307.t: "Colors Without a History"
chaosx.nr19.307.d: "The unbidden formation in [infantry_spawn_incident_state.GetName] has unfurled colors stitched with battles that no regiment claims and honors that no ministry awarded. The soldiers refuse to drill while the standards remain unrecognized. Recognition will secure their service and give the cloth a claim upon them."
chaosx.nr19.307.a: "Recognize the colors and their honors."
chaosx.nr19.307.a.tt: "Training: §G+1§!\nCoherence: §G+1§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_small|0]§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_small|0]§!\nDemobilization Resistance: §R+[?constant:infantry_spawn_incident.demobilization_resistance_gain|0]§! up to §Y[?constant:infantry_spawn_incident.demobilization_resistance_maximum|0]§!. Each point adds §R[?constant:infantry_spawn_incident.demobilization_resistance_days|0] days§! to supervised demobilization and specialist preservation."
chaosx.nr19.307.b: "Refuse every invented honor."
chaosx.nr19.307.b.tt: "Training: §R-1§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_small|0]§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_minor|0]§!"
chaosx.nr19.307.c: "Recognize them as territorial colors."
chaosx.nr19.307.c.tt: "The incident lot becomes §YTerritorial§!.\nTraining: §G+1§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_small|0]§!\nDemobilization Resistance: §R+[?constant:infantry_spawn_incident.demobilization_resistance_gain|0]§! up to §Y[?constant:infantry_spawn_incident.demobilization_resistance_maximum|0]§!. Each point adds §R[?constant:infantry_spawn_incident.demobilization_resistance_days|0] days§! to supervised demobilization and specialist preservation."

chaosx.nr19.308.t: "Tanks Without Workshops"
chaosx.nr19.308.d: "An armored formation in [infantry_spawn_incident_state.GetName] has reported with tanks that can fight today and cannot be repaired tomorrow. Their tools fit no national workshop, their spare parts exist only in the sealed manifests, and their crews expect orders before the tracks begin to fail."
chaosx.nr19.308.a: "Build an engineer train around the tanks."
chaosx.nr19.308.a.tt: "Pays £support_equipment_text_icon §Y[?constant:infantry_spawn_incident.support_equipment_cost|0]§! Support Equipment and £army_experience §Y[?constant:infantry_spawn_incident.army_experience_cost|0]§! Army Experience. Settles up to §G[?constant:infantry_spawn_incident.debt_relief_small|0]§! Equipment Debt from the incident lot.\nQuality: §G+1§!\nEquipment State: §G+1§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_small|0]§!"
chaosx.nr19.308.b: "Spend them in one offensive."
chaosx.nr19.308.b.tt: "Adds §R[?constant:infantry_spawn_incident.debt_gain_medium|0]§! Infantry Equipment Debt to the incident lot and gives it a §RHeavy§! Supply Burden.\nTraining: §G+1§!\nQuality: §G+1§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_small|0]§!"
chaosx.nr19.308.c: "Dismantle the tanks for common stores."
chaosx.nr19.308.c.tt: "Settles up to §G[?constant:infantry_spawn_incident.debt_relief_medium|0]§! Equipment Debt from the incident lot.\nQuality: §R-1§!\nEquipment State: §R-1§!\nArmy Congestion: §G-[?constant:infantry_spawn_incident.congestion_small|0]§!"

chaosx.nr19.309.t: "Rotorcraft Over the Muster Ground"
chaosx.nr19.309.d: "Rotorcraft belonging to an unbidden formation circle [infantry_spawn_incident_state.GetName] while ground crews guard a dwindling row of unfamiliar parts. The machines can be kept operational through a costly maintenance train, reduced to ceremonial and liaison service, or sent to the front until the supply system fails."
chaosx.nr19.309.a: "Keep the machines in operational service."
chaosx.nr19.309.a.tt: "Pays £support_equipment_text_icon §Y[?constant:infantry_spawn_incident.support_equipment_cost|0]§! Support Equipment and £GFX_motorized_equipment_text_icon §Y[?constant:infantry_spawn_incident.motorized_equipment_cost|0]§! Motorized Equipment. Settles up to §G[?constant:infantry_spawn_incident.debt_relief_small|0]§! Equipment Debt from the incident lot.\nQuality: §G+1§!\nSupply Burden becomes §RHeavy§!."
chaosx.nr19.309.b: "Reserve them for liaison and ceremony."
chaosx.nr19.309.b.tt: "Quality: §R-1§!\nSupply Burden becomes §YLight§!.\nArmy Congestion: §G-[?constant:infantry_spawn_incident.congestion_medium|0]§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_small|0]§!"
chaosx.nr19.309.c: "Send every aircraft to the front."
chaosx.nr19.309.c.tt: "Adds §R[?constant:infantry_spawn_incident.debt_gain_medium|0]§! Infantry Equipment Debt to the incident lot and makes its Supply Burden §RLocally Impossible§!.\nTraining: §G+1§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_small|0]§!"

chaosx.nr19.310.t: "A Net of Foreign Frequencies"
chaosx.nr19.310.d: "The radios carried by an unbidden formation in [infantry_spawn_incident_state.GetName] speak across bands that national sets cannot hear. Its companies receive orders clearly from one another and silence from army headquarters. Signal officers can rebuild the net, tolerate the gaps, or leave command divided along the range of each set."
chaosx.nr19.310.a: "Rebuild the net around national standards."
chaosx.nr19.310.a.tt: "Pays £support_equipment_text_icon §Y[?constant:infantry_spawn_incident.support_equipment_cost|0]§! Support Equipment and settles up to §G[?constant:infantry_spawn_incident.debt_relief_small|0]§! Equipment Debt from the incident lot.\nCoherence: §G+1§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_medium|0]§!"
chaosx.nr19.310.b: "Issue orders through the gaps."
chaosx.nr19.310.b.tt: "Adds §R[?constant:infantry_spawn_incident.debt_gain_small|0]§! Infantry Equipment Debt to the incident lot.\nCoherence: §R-1§!\nArmy Congestion: §R+[?constant:infantry_spawn_incident.congestion_small|0]§!"
chaosx.nr19.310.c: "Divide command by radio range."
chaosx.nr19.310.c.tt: "The incident lot becomes §YIsolated§! and falls under §YLocal Authority§! command.\nArmy Congestion: §R+[?constant:infantry_spawn_incident.congestion_medium|0]§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_minor|0]§!"

chaosx.nr19.311.t: "The Cavalry Refuses the Motor Pool"
chaosx.nr19.311.d: "An unbidden cavalry formation in [infantry_spawn_incident_state.GetName] has rejected the trucks assigned to replace its horses. The riders trust animals that arrived with them, the transport officers demand a common motor table, and both sides warn that a mixed column will obey two different tempos."
chaosx.nr19.311.a: "Keep the horses in territorial service."
chaosx.nr19.311.a.tt: "The incident lot becomes §YTerritorial§! and receives a §YLight§! Supply Burden.\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_small|0]§!\nMounted Patrols receive §Y[?constant:infantry_spawn_incident.mounted_affinity_weight|0]§! additional muster weight in future draws."
chaosx.nr19.311.b: "Replace the remounts with trucks."
chaosx.nr19.311.b.tt: "Pays £GFX_motorized_equipment_text_icon §Y[?constant:infantry_spawn_incident.motorized_equipment_cost|0]§! Motorized Equipment and reduces Mobility Mismatch by up to §G[?constant:infantry_spawn_incident.mobility_mismatch_incident|0]§!.\nTraining: §G+1§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_small|0]§!\nMobile Reserves and Motor Rifle Formations receive §Y[?constant:infantry_spawn_incident.motor_affinity_weight|0]§! additional muster weight in future draws."
chaosx.nr19.311.c: "Write a doctrine for horses and trucks."
chaosx.nr19.311.c.tt: "Coherence: §R-1§!\nMuster Control: §G+[?constant:infantry_spawn_incident.control_minor|0]§!\nMounted Patrols receive §Y[?constant:infantry_spawn_incident.mounted_affinity_weight|0]§! additional muster weight in future draws. Mobile Reserves and Motor Rifle Formations receive §Y[?constant:infantry_spawn_incident.motor_affinity_weight|0]§! additional muster weight."

chaosx.nr19.312.t: "Armored Cars Looking for a War"
chaosx.nr19.312.d: "An unbidden column of armored cars has reached [infantry_spawn_incident_state.GetName] with crews trained for a doctrine no staff recognizes. The vehicles can patrol district roads, the crews can retrain for regular service, or the entire depot can remain intact as a model for later formations."
chaosx.nr19.312.a: "Assign the cars to territorial reconnaissance."
chaosx.nr19.312.a.tt: "The incident lot becomes §YTerritorial§!.\nMuster Control: §G+[?constant:infantry_spawn_incident.control_small|0]§!\nArmy Congestion: §G-[?constant:infantry_spawn_incident.congestion_minor|0]§!"
chaosx.nr19.312.b: "Retrain the crews for regular service."
chaosx.nr19.312.b.tt: "Pays £army_experience §Y[?constant:infantry_spawn_incident.army_experience_cost|0]§! Army Experience and adds §R[?constant:infantry_spawn_incident.debt_gain_small|0]§! Infantry Equipment Debt to the incident lot.\nTraining: §G+1§!\nQuality: §G+1§!"
chaosx.nr19.312.c: "Preserve the depot and its doctrine."
chaosx.nr19.312.c.tt: "Quality: §G+1§!\nClaimant Susceptibility: §R+[?constant:infantry_spawn_incident.claimant_susceptibility_small|0]§!\nDemobilization Resistance: §R+[?constant:infantry_spawn_incident.demobilization_resistance_gain|0]§! up to §Y[?constant:infantry_spawn_incident.demobilization_resistance_maximum|0]§!. Each point adds §R[?constant:infantry_spawn_incident.demobilization_resistance_days|0] days§! to supervised demobilization and specialist preservation.\nArmy Congestion: §R+[?constant:infantry_spawn_incident.congestion_small|0]§!\nAdvanced arsenal families receive §Y[?constant:infantry_spawn_incident.advanced_affinity_weight|0]§! additional muster weight in future draws."

infantry_spawn.evolution.type: "The Unbidden Muster"
infantry_spawn.evolution.1.title: "Organized Muster"
infantry_spawn.evolution.1.body: "The soldiers from nowhere now have district staffs, proper rolls, and officers the government can actually hold responsible."
infantry_spawn.evolution.2.title: "Arsenal Lottery"
infantry_spawn.evolution.2.body: "New formations arrive carrying baffling mixes of weapons and gear. Each one needs its own training, spare parts, and supply plan."
infantry_spawn.evolution.3.title: "Command Fracture"
infantry_spawn.evolution.3.body: "Some new commanders inspire more loyalty than the government that received them. Their private authority can split an army or put a claimant in the capital."
infantry_spawn.evolution.4.title: "Anomalous Muster"
infantry_spawn.evolution.4.body: "Not every arriving host is human. Governments must decide whether to quarter these soldiers, bargain with them, or turn them away before an armed camp becomes a country of its own."
infantry_spawn.evolution.summary: "A miraculous supply of soldiers becomes a struggle over strange arsenals, ambitious commanders, and the nature of the troops themselves."

chaosx.events_log.window.event_details.infantry_spawn: "Fully formed military units are appearing across the world with no recruitment orders, training records, or known home. Governments suddenly have to feed, equip, command, and watch soldiers who arrived ready to march.\n\nSome formations bring strange weapons, ambitious commanders, or troops that are not human at all. A useful windfall can become a rival army very quickly."

infantry_spawn.history.claimant_appearance.title: "A Claimant Enters the Rolls"
infantry_spawn.history.claimant_appearance.description: "An unbidden commander secured a loyal formation lot and began exercising authority beyond the battlefield."
infantry_spawn.history.claimant_takeover.title: "The Barracks Take Government"
infantry_spawn.history.claimant_takeover.description: "A claimant occupied the command offices and placed the state beneath a military chain of authority."
infantry_spawn.history.failed_coup.title: "The Claimant's Coup Fails"
infantry_spawn.history.failed_coup.description: "Loyal troops held the government offices, leaving the claimant's conspiracy broken and the officer corps divided."
infantry_spawn.history.claimant_revolt.title: "Claimant Formations Revolt"
infantry_spawn.history.claimant_revolt.description: "Formation lots loyal to a claimant abandoned national orders and opened a separate military front."
infantry_spawn.history.zombie_revolt.title: "The Devouring Bands Rise"
infantry_spawn.history.zombie_revolt.description: "Numbered ranks of the base dead broke from their custodians and established an armed host of their own."
infantry_spawn.history.ghost_revolt.title: "The Pale Procession Breaks Free"
infantry_spawn.history.ghost_revolt.description: "A ghost host abandoned its anchors and opened a separate front under the authority of the dead."
infantry_spawn.history.golem_revolt.title: "The Living Pattern Marches Alone"
infantry_spawn.history.golem_revolt.description: "Bound constructs rejected their workshops and formed an independent march of living stone."
infantry_spawn.history.anomalous_revolt.title: "An Anomalous Host Breaks Free"
infantry_spawn.history.anomalous_revolt.description: "A registered anomalous formation family abandoned its custodians and opened an independent front under its own command."
infantry_spawn.history.zombie_defeat.title: "The Devouring Host Is Broken"
infantry_spawn.history.zombie_defeat.description: "The independent bands of the base dead lost their territory and ceased to command a state."
infantry_spawn.history.ghost_defeat.title: "The Pale Dominion Fades"
infantry_spawn.history.ghost_defeat.description: "The ghost host lost its last governed ground and its procession scattered beyond political command."
infantry_spawn.history.golem_defeat.title: "The Stone March Crumbles"
infantry_spawn.history.golem_defeat.description: "The independent golem host lost its foundries, binding sites, and final seat of rule."
infantry_spawn.history.anomalous_defeat.title: "The Anomalous Host Falls"
infantry_spawn.history.anomalous_defeat.description: "An independent anomalous host lost its last governed territory and could no longer sustain a separate command."
infantry_spawn.history.claimant_defeat.title: "The Claimant's State Falls"
infantry_spawn.history.claimant_defeat.description: "A claimant command lost its territory and could no longer sustain a rival government."
infantry_spawn.history.scenario_launch.title: "The Unbidden Muster Opens"
infantry_spawn.history.scenario_launch.description: "A coordinated wave of unbidden formations produced immediate revolts, takeovers, and regional wars."
infantry_spawn.history.first_family_cantonment.title: "The First Host Enters Cantonment"
infantry_spawn.history.first_family_cantonment.description: "The government received its first anomalous host beneath guarded quarters, strict rolls, and a single accountable command."
infantry_spawn.history.first_family_negotiated.title: "A Compact with the First Host"
infantry_spawn.history.first_family_negotiated.description: "The government admitted its first anomalous host under a negotiated charter that preserved part of the host's own authority."
infantry_spawn.history.first_family_refused.title: "The First Host Is Turned Away"
infantry_spawn.history.first_family_refused.description: "The government barred its first anomalous delegation from the rolls and paid the political cost of holding the cordon."
infantry_spawn.history.first_family_reception_failed.title: "The First Reception Breaks Down"
infantry_spawn.history.first_family_reception_failed.description: "The promised anomalous formation could not be proven within the national rolls, leaving the reception under containment review."

infantry_spawn_scenario_type_conventional_flood: "The Barracks Overflow"
infantry_spawn_scenario_type_conventional_flood_tt: "Ordinary formations and organized arsenal lots appear in great numbers. Their immediate mutinies create large conventional civil wars, crowded supply routes, and divided command staffs. No anomalous family is called."
infantry_spawn_scenario_type_arsenal_lottery: "The Arsenal Draw"
infantry_spawn_scenario_type_arsenal_lottery_tt: "Rebel formations receive uneven packages of armor, motor transport, amphibious equipment, and other specialist materiel. Some fronts gain powerful machines without support, and other fronts inherit narrow military curiosities."
infantry_spawn_scenario_type_general_mutiny: "The Generals' Muster"
infantry_spawn_scenario_type_general_mutiny_tt: "Randomly composed formations arrive under claimant commanders. Every affected country faces an immediate personalized revolt or takeover attempt."
infantry_spawn_scenario_type_anomalous_rising: "The Impossible Host"
infantry_spawn_scenario_type_anomalous_rising_tt: "Zombie, ghost, golem, and other nonhuman formations rise at high saturation. Their new regional commands establish independent hosts and begin their wars at once."

infantry_spawn_scenario_intensity_low: "Contained"
infantry_spawn_scenario_intensity_low_tt: "A smaller share of the world is affected. Each selected country group faces one principal revolt, fewer units per state, and only limited anomalous participation."
infantry_spawn_scenario_intensity_medium: "Widespread"
infantry_spawn_scenario_intensity_medium_tt: "Broad state coverage produces several formation lots and full-strength local revolts. Claimants and breakaway hosts are chosen from the circumstances of each affected country."
infantry_spawn_scenario_intensity_high: "Cascading"
infantry_spawn_scenario_intensity_high_tt: "Many states receive multiple formations from larger and more advanced pools. More countries revolt at once, and rival claimant fronts become more likely."
infantry_spawn_scenario_intensity_maximum: "World Muster"
infantry_spawn_scenario_intensity_maximum_tt: "Nearly every country able to sustain an open revolt faces an immediate uprising or takeover. Large formation lots, rival claimants, multiple family crises, and outward regional wars appear wherever those fronts can hold together."

infantry_spawn_scenario_confirmation.t: "Open the Unbidden Muster?"
infantry_spawn_scenario_confirmation.d: "The selected crisis will distribute unbidden formations across countries able to sustain the revolt and begin their uprisings at once.\n\n§YPattern:§! [This.GetInfantrySpawnScenarioPendingType]\n[This.GetInfantrySpawnScenarioPendingTypeTooltip]\n\n§YReach:§! [This.GetInfantrySpawnScenarioPendingIntensity]\n[This.GetInfantrySpawnScenarioPendingIntensityTooltip]"
infantry_spawn_scenario_confirmation.confirm: "Give the muster its signal."
infantry_spawn_scenario_confirmation.cancel: "Seal the orders."
infantry_spawn_scenario_setup_complete.t: "The Unbidden Muster Begins"
infantry_spawn_scenario_setup_complete.d: "The signal has reached every chosen command area. The chosen pattern, §Y[This.GetInfantrySpawnScenarioActiveType]§!, is taking the field at §Y[This.GetInfantrySpawnScenarioActiveIntensity]§! reach, and the first divided governments are already issuing rival orders."
infantry_spawn_scenario_setup_complete.a: "Let every command prove its claim."
infantry_spawn_scenario_setup_failed.t: "The Muster Finds No Front"
infantry_spawn_scenario_setup_failed.d: "No command area could sustain a coherent rebel front under the selected orders. The unbidden muster has not begun."
infantry_spawn_scenario_setup_failed.a: "Close the empty ledger."
infantry_spawn_scenario_request_unregistered_tt: "Seals the chosen crisis pattern and reach in the muster orders, then opens the final confirmation report."
infantry_spawn_scenario_launch_unregistered_tt: "Immediately distributes the selected formations, establishes claimant or anomalous commands where applicable, and begins the resulting wars across countries able to sustain the revolt."
infantry_spawn_scenario_already_launched_tt: "The Unbidden Muster has already been launched during this campaign."
infantry_spawn_scenario_invalid_launch_tt: "Select one crisis pattern and one level of reach before issuing the muster signal."

infantry_spawn_scenario_muster_council: "Muster Council"
infantry_spawn_scenario_unbidden_assembly: "Unbidden Assembly"

infantry_spawn_formation_management_category: "The Formation Ledger"
infantry_spawn_formation_management_category_desc: "Every unbidden formation is recorded as part of a numbered lot. Audit those lots, assign their role, settle their equipment obligations, and decide which formations remain under arms."

infantry_spawn_review_formation_ledger: "Review the Formation Ledger"
infantry_spawn_review_formation_ledger_desc: "Recount current lots, obligations, claimant files, and anomalous families before the next order is issued."
infantry_spawn_review_formation_ledger_tt: "Recounts formation lots and recalculates current request costs. Existing lots remain unchanged."

infantry_spawn_cycle_selected_anomalous_family: "Cycle the Anomalous Family"
infantry_spawn_cycle_selected_anomalous_family_desc: "Move the ledger marker to the next eligible anomalous family before issuing a training, deployment, sustainment, containment, or dispersal order."
infantry_spawn_cycle_selected_anomalous_family_tt: "Selects the next eligible anomalous family and displays the orders available for that host."
infantry_spawn_cycle_anomalous_family_decision: "Cycle the Anomalous Family"
infantry_spawn_cycle_anomalous_family_decision_desc: "Move the ledger marker to the next eligible anomalous family before issuing a training, deployment, sustainment, containment, or dispersal order."

infantry_spawn_cycle_claimant_file: "Review the Next Claimant File"
infantry_spawn_cycle_claimant_file_desc: "Move the claimant desk to the next live commander without changing recognition, authority, or a pending demand."
infantry_spawn_cycle_claimant_file_tt: "Selects the next valid claimant file. It does not accept, refuse, recognize, or transfer authority."

infantry_spawn_select_next_ordinary_lot: "Select the Next Unsettled Lot"
infantry_spawn_select_next_ordinary_lot_desc: "Move the ledger marker to the next ordinary formation lot that still awaits a final disposition."
infantry_spawn_select_next_ordinary_lot_tt: "Selects the next unresolved ordinary formation lot without changing its status."

infantry_spawn_select_next_unaccounted_lot: "Select the Next Unaccounted Lot"
infantry_spawn_select_next_unaccounted_lot_desc: "Move the ledger marker among lots whose formations disappeared outside a verified destruction, transfer, or supervised demobilization."
infantry_spawn_select_next_unaccounted_lot_tt: "Selects the next unaccounted lot and lists every manpower and material obligation that remains unpaid."

infantry_spawn_settle_selected_lot_obligations: "Settle the Selected Lot's Obligations"
infantry_spawn_settle_selected_lot_obligations_desc: "Return every person, weapon, vehicle, chassis, train, and fuel allotment still owed by the selected formation lot."
infantry_spawn_settle_selected_lot_obligations_tt: "Pays every remaining manpower and material obligation at once. An unaccounted lot is archived only after its equipment debt and manpower liability both reach zero. This does not report its formations as destroyed or demobilized."
infantry_spawn_selected_lot_exact_obligation_cost: "Weighted debt value: §Y[?infantry_spawn_exact_settlement_debt_value|2]§!  Obligation categories: §Y[?infantry_spawn_exact_settlement_row_count|0]§!\nManpower: §Y[?infantry_spawn_exact_manpower|0]§!\nInfantry equipment: §Y[?infantry_spawn_exact_infantry_equipment|0]§!\nArtillery: §Y[?infantry_spawn_exact_artillery_equipment|0]§!\nSupport equipment: §Y[?infantry_spawn_exact_support_equipment|0]§!\nTrucks: §Y[?infantry_spawn_exact_motorized_equipment|0]§!\nArmored cars: §Y[?infantry_spawn_exact_armored_car_equipment|0]§!\nMechanized equipment: §Y[?infantry_spawn_exact_mechanized_equipment|0]§!\nHelicopters: §Y[?infantry_spawn_exact_helicopter_equipment|0]§!\nAmphibious mechanized equipment: §Y[?infantry_spawn_exact_amphibious_mechanized_equipment|0]§!\nFuel: §Y[?infantry_spawn_exact_fuel|0]§!\nTrains: §Y[?infantry_spawn_exact_train_equipment|0]§!\nCoal golems: §Y[?infantry_spawn_exact_coal_golem_equipment|0]§!\nLight tank chassis: §Y[?infantry_spawn_exact_light_tank_chassis|0]§!\nLight SP artillery chassis: §Y[?infantry_spawn_exact_light_tank_artillery_chassis|0]§!\nAnti-tank equipment: §Y[?infantry_spawn_exact_anti_tank_equipment|0]§!\nAnti-air equipment: §Y[?infantry_spawn_exact_anti_air_equipment|0]§!\nRocket artillery: §Y[?infantry_spawn_exact_rocket_artillery_equipment|0]§!\nAmphibious tank chassis: §Y[?infantry_spawn_exact_amphibious_tank_chassis|0]§!\nArmored support vehicles: §Y[?infantry_spawn_exact_armored_support_vehicle|0]§!\nHeavy AA chassis: §Y[?infantry_spawn_exact_heavy_tank_aa_chassis|0]§!\nHeavy amphibious chassis: §Y[?infantry_spawn_exact_heavy_tank_amphibious_chassis|0]§!\nHeavy artillery chassis: §Y[?infantry_spawn_exact_heavy_tank_artillery_chassis|0]§!\nHeavy tank chassis: §Y[?infantry_spawn_exact_heavy_tank_chassis|0]§!\nHeavy destroyer chassis: §Y[?infantry_spawn_exact_heavy_tank_destroyer_chassis|0]§!\nHeavy flame chassis: §Y[?infantry_spawn_exact_heavy_tank_flame_chassis|0]§!\nLand cruisers: §Y[?infantry_spawn_exact_land_cruiser_chassis|0]§!\nLight AA chassis: §Y[?infantry_spawn_exact_light_tank_aa_chassis|0]§!\nLight amphibious chassis: §Y[?infantry_spawn_exact_light_tank_amphibious_chassis|0]§!\nLight destroyer chassis: §Y[?infantry_spawn_exact_light_tank_destroyer_chassis|0]§!\nLight flame chassis: §Y[?infantry_spawn_exact_light_tank_flame_chassis|0]§!\nMedium AA chassis: §Y[?infantry_spawn_exact_medium_tank_aa_chassis|0]§!\nMedium amphibious chassis: §Y[?infantry_spawn_exact_medium_tank_amphibious_chassis|0]§!\nMedium artillery chassis: §Y[?infantry_spawn_exact_medium_tank_artillery_chassis|0]§!\nMedium tank chassis: §Y[?infantry_spawn_exact_medium_tank_chassis|0]§!\nMedium destroyer chassis: §Y[?infantry_spawn_exact_medium_tank_destroyer_chassis|0]§!\nMedium flame chassis: §Y[?infantry_spawn_exact_medium_tank_flame_chassis|0]§!\nModern AA chassis: §Y[?infantry_spawn_exact_modern_tank_aa_chassis|0]§!\nModern artillery chassis: §Y[?infantry_spawn_exact_modern_tank_artillery_chassis|0]§!\nModern tank chassis: §Y[?infantry_spawn_exact_modern_tank_chassis|0]§!\nMotorbikes: §Y[?infantry_spawn_exact_motorbike_equipment|0]§!\nMotorized rocket equipment: §Y[?infantry_spawn_exact_motorized_rocket_equipment|0]§!\nSelf-propelled super-heavy artillery: §Y[?infantry_spawn_exact_self_propelled_super_heavy_artillery_equipment|0]§!\nSuper-heavy artillery: §Y[?infantry_spawn_exact_super_heavy_artillery_equipment|0]§!\nSuper-heavy AA chassis: §Y[?infantry_spawn_exact_super_heavy_tank_aa_chassis|0]§!\nSuper-heavy artillery chassis: §Y[?infantry_spawn_exact_super_heavy_tank_artillery_chassis|0]§!\nSuper-heavy tank chassis: §Y[?infantry_spawn_exact_super_heavy_tank_chassis|0]§!\nSuper-heavy destroyer chassis: §Y[?infantry_spawn_exact_super_heavy_tank_destroyer_chassis|0]§!"

infantry_spawn_audit_selected_lot: "Audit the Selected Lot"
infantry_spawn_audit_selected_lot_desc: "Count every company, weapon, vehicle, and outstanding obligation before the selected lot receives a permanent role."
infantry_spawn_audit_selected_lot_tt: "Begins a timed roll call for the selected lot. Completion improves Muster Control and records the lot's liabilities."
infantry_spawn_audit_selected_lot_cost: "£army_experience §Y[?constant:infantry_spawn_request_cost.base_army_experience|0]§!  £support_equipment_text_icon §Y[?constant:infantry_spawn_request_cost.base_support_equipment|0]§!"

infantry_spawn_assign_territorial_roles: "Assign Territorial Roles"
infantry_spawn_assign_territorial_roles_desc: "Place the selected formations under local defense schedules and fixed district commands."
infantry_spawn_assign_territorial_roles_tt: "Resolves the selected lot as territorial formations, easing army congestion at the cost of a narrower field role."
infantry_spawn_support_equipment_management_cost: "£support_equipment_text_icon §Y[?constant:infantry_spawn_request_cost.base_support_equipment|0]§!"

infantry_spawn_open_standardization_cycle: "Open a Standardization Cycle"
infantry_spawn_open_standardization_cycle_desc: "Reform the selected ordinary cohort around the locked National Muster Standard."
infantry_spawn_open_standardization_cycle_tt: "Begins a timed conversion for a fully settled ordinary lot. At completion, every surviving formation in that lot converts to the shared §YNational Muster Standard§!. The country must replace §Y[?constant:infantry_spawn_accounting.standardization_loss_share|%0]§! of the equipment and fuel actually issued to those formations. Manpower and debts forgiven during incidents are never charged. If the recorded formation roster no longer matches the lot, the formations return to their locked template and the material charge is refunded."
infantry_spawn_standardization_cycle_cost: "§YConversion Stores§!: Rifles [?infantry_spawn_exact_infantry_equipment|0], Artillery [?infantry_spawn_exact_artillery_equipment|0], Support [?infantry_spawn_exact_support_equipment|0], Trucks [?infantry_spawn_exact_motorized_equipment|0], Anti-Tank [?infantry_spawn_exact_anti_tank_equipment|0], Anti-Air [?infantry_spawn_exact_anti_air_equipment|0], Fuel [?infantry_spawn_exact_fuel|0]"

infantry_spawn_supervised_demobilization: "Supervised Demobilization"
infantry_spawn_supervised_demobilization_desc: "Disarm the selected lot under guard, recover usable stores, and close its formation records without an uncontrolled dispersal."
infantry_spawn_supervised_demobilization_tt: "Begins a timed demobilization after every obligation of the selected lot is settled. At completion, all surviving formations tied to its unique muster pattern are removed together. The state then returns §G30%§! of their paid manpower and issued stores to national service and reduces Army Congestion. Debts forgiven during incidents yield no salvage. Formations using the shared §YNational Muster Standard§! cannot be selected. The order proceeds only while the army retains authority to alter the lot's muster pattern. No formation is removed and no stores are returned unless that authority remains intact."

infantry_spawn_emergency_field_integration: "Emergency Field Integration"
infantry_spawn_emergency_field_integration_desc: "Send the selected lot directly into the army once every issued person and material allotment has been accounted for."
infantry_spawn_emergency_field_integration_tt: "Requires zero equipment debt and zero manpower liability for the selected lot. Once all its obligations are settled, the rushed order preserves its formations but worsens Muster Control and imposes temporary organizational burdens."

infantry_spawn_establish_muster_districts: "Establish Muster Districts"
infantry_spawn_establish_muster_districts_desc: "Give every formation lot a district staff, a transport route, and an office responsible for its rolls."
infantry_spawn_establish_muster_districts_tt: "Begins the district program. Completion permanently strengthens lot administration and reduces congestion."
infantry_spawn_muster_districts_cost: "£army_experience §Y[?constant:infantry_spawn_request_cost.base_army_experience|0]§!  £support_equipment_text_icon §Y[?constant:infantry_spawn_request_cost.base_support_equipment|0]§!  £GFX_train_texticon §Y[?constant:infantry_spawn_request_cost.base_trains|0]§!"

infantry_spawn_appoint_integration_staff: "Appoint an Integration Staff"
infantry_spawn_appoint_integration_staff_desc: "Search the officer corps for administrators able to reconcile unfamiliar formations with the national chain of command."
infantry_spawn_appoint_integration_staff_tt: "Begins an officer search. Completion appoints a permanent integration staff and improves future lot management."
infantry_spawn_army_experience_management_cost: "£army_experience §Y[?constant:infantry_spawn_request_cost.base_army_experience|0]§!"

infantry_spawn_issue_common_tables: "Issue Common Tables"
infantry_spawn_issue_common_tables_desc: "Distribute standard company tables, depot codes, and reporting forms to the selected lot."
infantry_spawn_issue_common_tables_tt: "Begins the same fully funded National Muster Standard conversion for the selected lot under the Organized Muster institutions."

infantry_spawn_preserve_specialist_companies: "Preserve Specialist Companies"
infantry_spawn_preserve_specialist_companies_desc: "Separate valuable support companies from a lot that cannot remain intact, then retrain them under national cadres."
infantry_spawn_preserve_specialist_companies_tt: "Begins only after every obligation of the selected lot is settled. Completion returns §G45%§! of paid support equipment and §G45%§! of the paid manpower assigned to support companies, then grants §YPreserved Specialist Instruction§! for §Y[?constant:infantry_spawn_timer.training_cycle_days|0] days§!. Debts forgiven during incidents yield no salvage."

infantry_spawn_recognize_emergency_reserve: "Recognize an Emergency Reserve"
infantry_spawn_recognize_emergency_reserve_desc: "Place the selected lot on a provisional wartime roll without pretending that its peacetime obligations have been resolved."
infantry_spawn_recognize_emergency_reserve_tt: "Recognizes the selected lot as an emergency reserve and makes it available for immediate service under a provisional command arrangement."

infantry_spawn_survey_formation_lots: "Survey the Formation Lots"
infantry_spawn_survey_formation_lots_desc: "Refresh the rolls, close completed generation records, and place the next unsettled ordinary lot before the staff."
infantry_spawn_survey_formation_lots_tt: "Selects the first unresolved ordinary lot, closes any fully resolved generation, and refreshes every quoted formation-request cost."

infantry_spawn_open_training_cycle: "Open a Joint Training Cycle"
infantry_spawn_open_training_cycle_desc: "Drill the selected lot beside established units until its companies can use one set of signals and field procedures."
infantry_spawn_open_training_cycle_tt: "Begins a timed training cycle for the selected lot. Completion improves coherence and strengthens Muster Control."
infantry_spawn_training_cycle_cost: "£infantry_equipment_text_icon §Y[?constant:infantry_spawn_request_cost.base_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:infantry_spawn_request_cost.base_support_equipment|0]§!"

infantry_spawn_reserve_rail_corridors: "Reserve Rail Corridors"
infantry_spawn_reserve_rail_corridors_desc: "Assign trains and fuel to a protected route between the selected lot's origin district and the national supply network."
infantry_spawn_reserve_rail_corridors_tt: "Begins a corridor mission tied to the selected lot's origin state. If that state remains controlled, completion eases congestion and records a secured rail route."
infantry_spawn_rail_corridor_cost: "£GFX_train_texticon §Y[?constant:infantry_spawn_request_cost.base_trains|0]§!  £GFX_fuel_texticon §Y[?constant:infantry_spawn_request_cost.base_fuel|0]§!"

infantry_spawn_preserve_prototype_formation: "Preserve the Prototype Formation"
infantry_spawn_preserve_prototype_formation_desc: "Keep the selected advanced lot intact while workshops, depots, and field officers learn how to maintain equipment that ordinary production cannot replace."
infantry_spawn_preserve_prototype_formation_tt: "Pays the maintenance stores and begins a §Y120 to 365 day§! trial tied to the selected advanced formation. A sound result improves training and material quality, preserves the lot under a special reinforcement burden, and grants one limited research insight in its equipment field. A strained result preserves the formation with degraded equipment. The trial fails if that formation can no longer be identified at completion."
infantry_spawn_preserve_prototype_formation_cost: "£army_experience §Y[?constant:infantry_spawn_prototype.preserve_army_experience_cost|0]§!  £support_equipment_text_icon §Y[?constant:infantry_spawn_prototype.preserve_support_equipment_cost|0]§!  £GFX_train_texticon §Y[?constant:infantry_spawn_prototype.preserve_train_cost|0]§!  £GFX_fuel_texticon §Y[?constant:infantry_spawn_prototype.preserve_fuel_cost|0]§!"

infantry_spawn_cannibalize_advanced_lot: "Cannibalize the Advanced Lot"
infantry_spawn_cannibalize_advanced_lot_desc: "Break the selected prototype formation into recoverable assemblies, compatible stores, and workshop notes before its unsupported equipment consumes more of the army."
infantry_spawn_cannibalize_advanced_lot_tt: "Dismantles only the selected advanced formation group and retires its unique template. The state recovers §G45%§! of the paid manpower and issued stores carried by its surviving formations. Unpaid obligations are forfeited without salvage, Army Congestion falls, and a serviceable prototype may yield one small research insight. The formation's combat value is destroyed and this does not count as supervised demobilization."

infantry_spawn_request_field_reinforcement: "Request Field Reinforcements"
infantry_spawn_request_field_reinforcement_desc: "Ask the muster for a balanced formation suited to an active front."
infantry_spawn_request_field_reinforcement_tt: "Pays the quoted cost, draws one field-biased formation lot, and closes further requests until the current cooldown ends."
infantry_spawn_request_field_reinforcement_cost: "£army_experience §Y[?infantry_spawn_request_field_xp_cost|0]§!  £infantry_equipment_text_icon §Y[?infantry_spawn_request_field_infantry_cost|0]§!  £support_equipment_text_icon §Y[?infantry_spawn_request_field_support_cost|0]§!  £GFX_motorized_equipment_text_icon §Y[?infantry_spawn_request_field_truck_cost|0]§!  £GFX_train_texticon §Y[?infantry_spawn_request_field_train_cost|0]§!  £GFX_fuel_texticon §Y[?infantry_spawn_request_field_fuel_cost|0]§!  £manpower_texticon §Y[?infantry_spawn_request_field_manpower_cost|0]§!"

infantry_spawn_request_mobile_reserve: "Request a Mobile Reserve"
infantry_spawn_request_mobile_reserve_desc: "Ask the muster for formations weighted toward motor transport, rapid reinforcement, and operational movement."
infantry_spawn_request_mobile_reserve_tt: "Pays the quoted cost, draws one mobility-biased formation lot, and closes further requests until the current cooldown ends."
infantry_spawn_request_mobile_reserve_cost: "£army_experience §Y[?infantry_spawn_request_mobile_xp_cost|0]§!  £infantry_equipment_text_icon §Y[?infantry_spawn_request_mobile_infantry_cost|0]§!  £support_equipment_text_icon §Y[?infantry_spawn_request_mobile_support_cost|0]§!  £GFX_motorized_equipment_text_icon §Y[?infantry_spawn_request_mobile_truck_cost|0]§!  £GFX_train_texticon §Y[?infantry_spawn_request_mobile_train_cost|0]§!  £GFX_fuel_texticon §Y[?infantry_spawn_request_mobile_fuel_cost|0]§!  £manpower_texticon §Y[?infantry_spawn_request_mobile_manpower_cost|0]§!"

infantry_spawn_request_territorial_defenders: "Request Territorial Defenders"
infantry_spawn_request_territorial_defenders_desc: "Ask the muster for formations suited to fixed defense, local knowledge, and a smaller mobile burden."
infantry_spawn_request_territorial_defenders_tt: "Pays the quoted cost, draws one territorial formation lot, and closes further requests until the current cooldown ends."
infantry_spawn_request_territorial_defenders_cost: "£army_experience §Y[?infantry_spawn_request_territorial_xp_cost|0]§!  £infantry_equipment_text_icon §Y[?infantry_spawn_request_territorial_infantry_cost|0]§!  £support_equipment_text_icon §Y[?infantry_spawn_request_territorial_support_cost|0]§!  £GFX_motorized_equipment_text_icon §Y[?infantry_spawn_request_territorial_truck_cost|0]§!  £GFX_train_texticon §Y[?infantry_spawn_request_territorial_train_cost|0]§!  £GFX_fuel_texticon §Y[?infantry_spawn_request_territorial_fuel_cost|0]§!  £manpower_texticon §Y[?infantry_spawn_request_territorial_manpower_cost|0]§!"

infantry_spawn_request_specialist_firepower: "Request Specialist Firepower"
infantry_spawn_request_specialist_firepower_desc: "Ask the muster for a formation weighted toward heavy weapons and uncommon support companies."
infantry_spawn_request_specialist_firepower_tt: "Pays the quoted cost, draws one specialist formation lot, and closes further requests until the current cooldown ends."
infantry_spawn_request_specialist_firepower_cost: "£army_experience §Y[?infantry_spawn_request_specialist_xp_cost|0]§!  £infantry_equipment_text_icon §Y[?infantry_spawn_request_specialist_infantry_cost|0]§!  £support_equipment_text_icon §Y[?infantry_spawn_request_specialist_support_cost|0]§!  £GFX_motorized_equipment_text_icon §Y[?infantry_spawn_request_specialist_truck_cost|0]§!  £GFX_train_texticon §Y[?infantry_spawn_request_specialist_train_cost|0]§!  £GFX_fuel_texticon §Y[?infantry_spawn_request_specialist_fuel_cost|0]§!  £manpower_texticon §Y[?infantry_spawn_request_specialist_manpower_cost|0]§!"

infantry_spawn_request_numbers: "Ask for Numbers"
infantry_spawn_request_numbers_desc: "Tell the muster that mass matters more than elegance and accept whatever composition answers."
infantry_spawn_request_numbers_tt: "Pays the quoted cost and draws one unrestricted formation lot weighted toward manpower and numerous combat elements."
infantry_spawn_request_numbers_cost: "£army_experience §Y[?infantry_spawn_request_numbers_xp_cost|0]§!  £infantry_equipment_text_icon §Y[?infantry_spawn_request_numbers_infantry_cost|0]§!  £support_equipment_text_icon §Y[?infantry_spawn_request_numbers_support_cost|0]§!  £GFX_motorized_equipment_text_icon §Y[?infantry_spawn_request_numbers_truck_cost|0]§!  £GFX_train_texticon §Y[?infantry_spawn_request_numbers_train_cost|0]§!  £GFX_fuel_texticon §Y[?infantry_spawn_request_numbers_fuel_cost|0]§!  £manpower_texticon §Y[?infantry_spawn_request_numbers_manpower_cost|0]§!"

infantry_spawn_request_discipline: "Ask for Discipline"
infantry_spawn_request_discipline_desc: "Demand a formation whose command structure matters more than the novelty of its equipment."
infantry_spawn_request_discipline_tt: "Pays the quoted cost and draws one unrestricted formation lot weighted toward coherent organization and controllable support."
infantry_spawn_request_discipline_cost: "£army_experience §Y[?infantry_spawn_request_discipline_xp_cost|0]§!  £infantry_equipment_text_icon §Y[?infantry_spawn_request_discipline_infantry_cost|0]§!  £support_equipment_text_icon §Y[?infantry_spawn_request_discipline_support_cost|0]§!  £GFX_motorized_equipment_text_icon §Y[?infantry_spawn_request_discipline_truck_cost|0]§!  £GFX_train_texticon §Y[?infantry_spawn_request_discipline_train_cost|0]§!  £GFX_fuel_texticon §Y[?infantry_spawn_request_discipline_fuel_cost|0]§!  £manpower_texticon §Y[?infantry_spawn_request_discipline_manpower_cost|0]§!"

infantry_spawn_request_firepower: "Ask for Firepower"
infantry_spawn_request_firepower_desc: "Demand a formation built around the heaviest valid weapons the muster can assemble."
infantry_spawn_request_firepower_tt: "Pays the quoted cost and draws one unrestricted formation lot weighted toward artillery, armor, and specialist support."
infantry_spawn_request_firepower_cost: "£army_experience §Y[?infantry_spawn_request_firepower_xp_cost|0]§!  £infantry_equipment_text_icon §Y[?infantry_spawn_request_firepower_infantry_cost|0]§!  £support_equipment_text_icon §Y[?infantry_spawn_request_firepower_support_cost|0]§!  £GFX_motorized_equipment_text_icon §Y[?infantry_spawn_request_firepower_truck_cost|0]§!  £GFX_train_texticon §Y[?infantry_spawn_request_firepower_train_cost|0]§!  £GFX_fuel_texticon §Y[?infantry_spawn_request_firepower_fuel_cost|0]§!  £manpower_texticon §Y[?infantry_spawn_request_firepower_manpower_cost|0]§!"

infantry_spawn_request_mobility: "Ask for Mobility"
infantry_spawn_request_mobility_desc: "Demand a formation able to move before the rest of the muster has finished counting itself."
infantry_spawn_request_mobility_tt: "Pays the quoted cost and draws one unrestricted formation lot weighted toward motorized and other mobile components."
infantry_spawn_request_mobility_cost: "£army_experience §Y[?infantry_spawn_request_mobility_xp_cost|0]§!  £infantry_equipment_text_icon §Y[?infantry_spawn_request_mobility_infantry_cost|0]§!  £support_equipment_text_icon §Y[?infantry_spawn_request_mobility_support_cost|0]§!  £GFX_motorized_equipment_text_icon §Y[?infantry_spawn_request_mobility_truck_cost|0]§!  £GFX_train_texticon §Y[?infantry_spawn_request_mobility_train_cost|0]§!  £GFX_fuel_texticon §Y[?infantry_spawn_request_mobility_fuel_cost|0]§!  £manpower_texticon §Y[?infantry_spawn_request_mobility_manpower_cost|0]§!"

infantry_spawn_request_anything: "Ask for Anything"
infantry_spawn_request_anything_desc: "Remove every preference and invite the muster to answer with the strangest valid formation it can assemble."
infantry_spawn_request_anything_tt: "Pays a larger quoted cost and draws one fully unrestricted formation lot. No composition preference protects the result."
infantry_spawn_request_anything_cost: "£army_experience §Y[?infantry_spawn_request_anything_xp_cost|0]§!  £infantry_equipment_text_icon §Y[?infantry_spawn_request_anything_infantry_cost|0]§!  £support_equipment_text_icon §Y[?infantry_spawn_request_anything_support_cost|0]§!  £GFX_motorized_equipment_text_icon §Y[?infantry_spawn_request_anything_truck_cost|0]§!  £GFX_train_texticon §Y[?infantry_spawn_request_anything_train_cost|0]§!  £GFX_fuel_texticon §Y[?infantry_spawn_request_anything_fuel_cost|0]§!  £manpower_texticon §Y[?infantry_spawn_request_anything_manpower_cost|0]§!"

infantry_spawn_request_selected_anomalous_family: "Reinforce the Selected Family"
infantry_spawn_request_selected_anomalous_family_desc: "Pay the selected family's own price and call another viable formation from its known host."
infantry_spawn_request_selected_anomalous_family_tt: "Pays the host's material price and the political and command burden created by earlier requests. A successful call creates one formation and closes the channel until the next request interval."
infantry_spawn_request_selected_anomalous_family_cost: "[This.GetInfantrySpawnSelectedFamilyRequestCost]"

infantry_spawn_open_selected_family_cantonment_decision: "Open a Family Cantonment"
infantry_spawn_open_selected_family_cantonment_decision_desc: "Give the selected host a guarded district where its formations can gather, receive supplies, and remain separate from ordinary barracks."
infantry_spawn_open_selected_family_cantonment_tt: "Opens a cantonment for §Y[?constant:infantry_spawn_family_management_duration.cantonment_days|0] days§!, reducing family pressure and increasing the host's institutional presence."
infantry_spawn_open_selected_family_cantonment_cost: "£pol_power §Y[?constant:infantry_spawn_family_management_cost.cantonment_political_power|0]§!  £command_power §Y[?constant:infantry_spawn_family_management_cost.cantonment_command_power|0]§!  £support_equipment_text_icon §Y[?constant:infantry_spawn_family_management_cost.cantonment_support_equipment|0]§!"

infantry_spawn_appoint_selected_family_liaison_decision: "Appoint a Family Liaison"
infantry_spawn_appoint_selected_family_liaison_decision_desc: "Place one accountable office between the selected host's internal authority and the national command."
infantry_spawn_appoint_selected_family_liaison_tt: "Appoints a liaison for §Y[?constant:infantry_spawn_family_management_duration.liaison_days|0] days§!, improving oversight and reducing family pressure."
infantry_spawn_appoint_selected_family_liaison_cost: "£pol_power §Y[?constant:infantry_spawn_family_management_cost.liaison_political_power|0]§!  £command_power §Y[?constant:infantry_spawn_family_management_cost.liaison_command_power|0]§!"

infantry_spawn_restrict_selected_family_deployment_decision: "Restrict Family Deployment"
infantry_spawn_restrict_selected_family_deployment_decision_desc: "Confine the selected host to approved states and routes until its command obligations are stable."
infantry_spawn_restrict_selected_family_deployment_tt: "Restricts deployments for §Y[?constant:infantry_spawn_family_management_duration.restricted_deployment_days|0] days§!, reducing pressure at the cost of operational freedom."
infantry_spawn_restrict_selected_family_deployment_cost: "£command_power §Y[?constant:infantry_spawn_family_management_cost.restricted_command_power|0]§!  £army_experience §Y[?constant:infantry_spawn_family_management_cost.restricted_army_experience|0]§!"

infantry_spawn_sustain_selected_family_decision: "Meet the Family's Obligations"
infantry_spawn_sustain_selected_family_decision_desc: "Deliver the material, authority, or living reserves that keep the selected nonhuman host coherent."
infantry_spawn_sustain_selected_family_tt: "Pays the selected family's sustainment price and records the host as supplied for §Y[?constant:infantry_spawn_family_management_duration.sustainment_days|0] days§!."
infantry_spawn_sustain_selected_family_cost: "[This.GetInfantrySpawnSelectedFamilySustainmentCost]"

