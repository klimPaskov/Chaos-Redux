l_english:
independence_wave_founding_category: "The Work of Founding"
independence_wave_founding_category_desc: "The capital, treasury, census, and political compact must be secured before independence can outlive its first season."
independence_wave_government_category: "Institutions of Independence"
independence_wave_government_category_desc: "Build an administration that can command the country without surrendering it to former masters or foreign patrons."
independence_wave_recognition_category: "Recognition and Foreign Service"
independence_wave_recognition_category_desc: "Recognition is earned through missions, guarantees, and hard bargains with states that can make independence harder to reverse."
independence_wave_security_category: "Forces of the New State"
independence_wave_security_category_desc: "Militias, depots, officers, border guards, and emergency reserves determine whether the new state can survive its first wars."
independence_wave_host_relations_category: "The Former Host Settlement"
independence_wave_host_relations_category_desc: "Property, citizenship, borders, recognition, and the danger of reclamation remain bound to the former host."
independence_wave_patron_category: "Patrons and Concessions"
independence_wave_patron_category_desc: "Foreign aid can preserve the state, but every channel carries influence and every concession narrows sovereignty."
independence_wave_network_category: "The Independence Network"
independence_wave_network_category_desc: "New states can recognize, reinforce, arbitrate, and rescue one another through a shared network of standing and obligation."
independence_wave_league_category: "The League Congress"
independence_wave_league_category_desc: "Founders shape the charter, contribute to the congress, and contest who will lead the league."
independence_wave_borders_category: "Borders and Ambitions"
independence_wave_borders_category_desc: "Surveyed claims may proceed through plebiscites, negotiated transfers, ultimatums, and long integration."
independence_wave_formables_category: "Regional Union"
independence_wave_formables_category_desc: "A recognized regional identity can become a congress, a military proclamation, and a common state."
independence_wave_high_chaos_category: "Open Sovereignty"
independence_wave_high_chaos_category_desc: "Radical powers may open another breakaway front and turn the league into an instrument of reclamation."

