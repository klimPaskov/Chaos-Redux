independence_wave_secure_provisional_capital: "Secure the Provisional Capital"
independence_wave_secure_provisional_capital_desc: "Hold the capital for [?constant:independence_wave_decision_duration.short|0] days with more than [?constant:independence_wave_decision_gate.secure_capital_divisions|0] divisions assigned to it. Losing the capital or stripping its garrison will break the provisional government."
independence_wave_establish_revenue_service: "Establish a Revenue Service"
independence_wave_establish_revenue_service_desc: "Build a salaried revenue service before the deadline. Success gives the government a durable fiscal base, while delay ends in arrears and corruption."
independence_wave_register_population: "Register the Population"
independence_wave_register_population_desc: "Keep the capital secure and the country below severe instability while registrars map households, obligations, and manpower for 180 days."
independence_wave_hold_first_assembly: "Hold the First Assembly"
independence_wave_hold_first_assembly_desc: "Organize delegates and complete the assembly before its mandate expires. A successful sitting opens the constitutional road without choosing it for us."
independence_wave_confirm_traditional_authority: "Confirm Traditional Authority"
independence_wave_confirm_traditional_authority_desc: "Gather councils, courts, chiefs, and clergy behind a recognized settlement. Success opens the traditional road without closing other government choices."
independence_wave_recruit_local_civil_servants: "Recruit Local Civil Servants"
independence_wave_recruit_local_civil_servants_desc: "Favor locally rooted administrators. Capacity rises sharply, though established factions will resent the loss of offices and influence."
independence_wave_recall_exile_administrators: "Recall Exile Administrators"
independence_wave_recall_exile_administrators_desc: "Bring experienced exiles home through foreign transit routes. Their knowledge raises capacity and recognition, but their return unsettles domestic claimants."
independence_wave_retain_former_host_officials: "Retain Former-Host Officials"
independence_wave_retain_former_host_officials_desc: "Vet and retain officials who know the inherited machinery. Administration recovers quickly at the cost of legitimacy and greater former-host leverage."
independence_wave_create_provincial_compacts: "Create a Provincial Compact"
independence_wave_create_provincial_compacts_desc: "Offer a controlled province a negotiated place in the state. The compact lowers instability and improves control while conceding some central authority."
independence_wave_establish_treasury_and_currency: "Establish Treasury and Currency"
independence_wave_establish_treasury_and_currency_desc: "Turn revenue records into a treasury and trusted currency before inflation outruns the state. Success expands capacity and the capital's economic foundations."
independence_wave_send_diplomatic_mission: "Send a Diplomatic Mission"
independence_wave_send_diplomatic_mission_desc: "Dispatch a mission to the selected capital. Friendly states and fellow new countries are likely to establish ties, while refusal may bring an arms-limit offer."
independence_wave_request_former_host_recognition: "Request Former-Host Recognition"
independence_wave_request_former_host_recognition_desc: "Place sovereignty before the former host. Strong security or a receptive host can secure recognized separation, while refusal raises pressure and may produce an autonomy offer."
independence_wave_seek_regional_guarantee: "Seek a Regional Guarantee"
independence_wave_seek_regional_guarantee_desc: "Ask a regional power to guarantee independence. A willing power grants protection, while a reluctant one may demand an influence-bearing recognition channel."
independence_wave_accept_arms_limit_recognition: "Accept Arms-Limit Recognition"
independence_wave_accept_arms_limit_recognition_desc: "Accept recognition in exchange for military restraint. Host fear falls and recognition surges, but security and domestic legitimacy pay the price."
independence_wave_build_permanent_foreign_service: "Build a Permanent Foreign Service"
independence_wave_build_permanent_foreign_service_desc: "Train a permanent diplomatic corps before staffing costs overwhelm the effort. Success creates an independent foreign service and broadens diplomatic reach."
independence_wave_coordinate_recognition_campaign: "Coordinate a Recognition Campaign"
independence_wave_coordinate_recognition_campaign_desc: "Use network standing to lift a less recognized member. A completed campaign raises the target's recognition and strengthens shared confidence."
independence_wave_integrate_militias: "Integrate the Militias"
independence_wave_integrate_militias_desc: "Bring armed formations under a common command before their leaders become permanent rivals. Success strengthens security, while failure produces a warlord crisis."
independence_wave_secure_depot: "Secure a Depot"
independence_wave_secure_depot_desc: "Commit supplied forces to a depot state. Once secured, its captured stores improve supply access, equipment reserves, and state security."
independence_wave_recall_defecting_officers: "Recall Defecting Officers"
independence_wave_recall_defecting_officers_desc: "Offer vetted commissions to officers who abandoned the former host. Their experience restores command capacity, though divided loyalties remain politically costly."
independence_wave_form_border_guards: "Form Border Guards"
independence_wave_form_border_guards_desc: "Equip and train a frontier service before local commanders entrench themselves. Success raises readiness, while failure empowers abusive provincial forces."
independence_wave_open_volunteer_corridor: "Open a Volunteer Corridor"
independence_wave_open_volunteer_corridor_desc: "Build a protected land or sea route through a foreign sponsor. Volunteers improve security, but the route grants its sponsor influence."
independence_wave_raise_emergency_units: "Raise Emergency Formations"
independence_wave_raise_emergency_units_desc: "Commit the trained reserve and equipment to [?constant:independence_wave_decision_force.emergency_division_count|0] understrength formations and immediate capital defenses. The formations demobilize when the army professionalizes; until then, the measure deepens instability and military influence."
independence_wave_professionalize_army: "Professionalize the Army"
independence_wave_professionalize_army_desc: "Replace militia bargains with training, supply standards, and a professional officer system. Failure leaves the force divided and the treasury exhausted."
independence_wave_offer_ceasefire_line: "Offer a Ceasefire Line"
independence_wave_offer_ceasefire_line_desc: "Freeze the active frontier and open guarded talks. A completed offer ends direct fighting and converts reclamation pressure into a tense coexistence."
independence_wave_divide_state_property: "Divide State Property"
independence_wave_divide_state_property_desc: "Settle inherited debts, railways, stores, ships, and treasury claims. The bargain reduces the property dispute and advances a broader settlement."
independence_wave_negotiate_citizenship_and_return: "Negotiate Citizenship and Return"
independence_wave_negotiate_citizenship_and_return_desc: "Resolve nationality, return, and displaced property claims with the former host. A settlement lowers instability and border tension."
independence_wave_accept_limited_claims: "Accept Limited Claims"
independence_wave_accept_limited_claims_desc: "Renounce claims inside the former host's remaining territory in exchange for recognized separation. Nationalists will regard the treaty as a lasting surrender."
independence_wave_demand_recognition_by_force: "Demand Recognition by Force"
independence_wave_demand_recognition_by_force_desc: "Mobilize behind an ultimatum to the former host. A distracted host may concede, while a failed bluff opens a reclamation conflict and diplomatic isolation."
independence_wave_offer_association_or_reunion: "Offer Association or Reunion"
independence_wave_offer_association_or_reunion_desc: "Submit sovereignty to a final negotiated vote with a receptive former host. Acceptance ends the independent origin and reunites the country voluntarily."
independence_wave_prepare_reclamation_defense: "Prepare Reclamation Defense"
independence_wave_prepare_reclamation_defense_desc: "Rush equipment, fortifications, and trained reserves to the capital before the former host acts. Missing the deadline leaves the government exposed to surprise."
independence_wave_accept_arms_mission: "Accept an Arms Mission"
independence_wave_accept_arms_mission_desc: "Receive real equipment from a sponsor with adequate stocks. The shipment strengthens security and records an arms channel in the patron ledger."
independence_wave_accept_industrial_credits: "Accept Industrial Credits"
independence_wave_accept_industrial_credits_desc: "Use foreign credit to build a factory and infrastructure in the capital. The project raises capacity while creating a concession and substantial patron influence."
independence_wave_invite_security_advisers: "Invite Security Advisers"
independence_wave_invite_security_advisers_desc: "Allow a sponsor to train counterintelligence and internal security services. Instability falls, but legitimacy and institutional independence weaken."
independence_wave_grant_base_or_transit_rights: "Grant Base or Transit Rights"
independence_wave_grant_base_or_transit_rights_desc: "Exchange strategic access for a guarantee and major aid. The treaty strengthens defense while alarming the former host and binding the state to its patron."
independence_wave_balance_patrons: "Balance the Patrons"
independence_wave_balance_patrons_desc: "Play two or more patrons against one another before one becomes dominant. Success cuts influence across every channel, while failure invites coordinated retaliation."
independence_wave_buy_out_concession: "Buy Out a Concession"
independence_wave_buy_out_concession_desc: "Use the strength of a regional economy to retire one foreign concession. Patron influence falls, but the buyout consumes diplomatic, fiscal, and domestic reserves."
independence_wave_expose_foreign_interference: "Expose Foreign Interference"
independence_wave_expose_foreign_interference_desc: "Publish evidence against a selected patron. A legitimate government can dismantle influence networks, while a weak case brings isolation and an aid rupture."
independence_wave_choose_client_future: "Choose a Client Future"
independence_wave_choose_client_future_desc: "Entrust the state to its dominant patron. Aid and protection expand, but the client route permanently closes the independent government alternatives."
independence_wave_recognize_new_independence_wave_country: "Recognize a New Independence-Wave Country"
independence_wave_recognize_new_independence_wave_country_desc: "Extend recognition to another active new state. Both countries gain network standing, though the act increases pressure from former hosts."
independence_wave_send_civil_service_cadres: "Send Civil Service Cadres"
independence_wave_send_civil_service_cadres_desc: "Lend experienced administrators to a less capable member. The recipient gains capacity while our own ministries accept a temporary shortage."
independence_wave_contribute_emergency_reserve: "Contribute to the Emergency Reserve"
independence_wave_contribute_emergency_reserve_desc: "Transfer one safe surplus channel into the league reserve. The contribution is recorded once and cannot draw the country below its survival floor."
independence_wave_request_collective_recognition: "Request Collective Recognition"
independence_wave_request_collective_recognition_desc: "Coordinate the league behind a low-recognition member. Completion raises recognition and confidence, while a broken campaign damages cohesion."
independence_wave_request_border_arbitration: "Request Border Arbitration"
independence_wave_request_border_arbitration_desc: "Submit mutual claims between league members to binding arbitration. Completion removes the disputed claims and restores network standing."
independence_wave_rescue_threatened_member: "Rescue a Threatened Member"
independence_wave_rescue_threatened_member_desc: "Send equipment and a guarantee to a league member at war. Survival strengthens the charter, while annexation marks a failed rescue and a crisis of confidence."
independence_wave_convene_founding_congress: "Convene the Founding Congress"
independence_wave_convene_founding_congress_desc: "Contribute travel, security, reserves, and political authority to the common congress. Enough committed founders can open the charter vote."
independence_wave_adopt_charter_pillar: "Adopt a Charter Pillar"
independence_wave_adopt_charter_pillar_desc: "Adopt the next unresolved pillar covering equality, defense, anti-puppetry, arbitration, or common development. Completing all five formalizes the league."
independence_wave_challenge_league_leadership: "Challenge League Leadership"
independence_wave_challenge_league_leadership_desc: "Turn standing and contribution into a leadership challenge. Victory names a new leader, while defeat creates a rival caucus and damages confidence."
independence_wave_survey_claimed_districts: "Survey Claimed Districts"
independence_wave_survey_claimed_districts_desc: "Map administration, access, and local support in an ambition state before choosing a plebiscite, negotiation, or ultimatum."
independence_wave_sponsor_plebiscite: "Sponsor a Plebiscite"
independence_wave_sponsor_plebiscite_desc: "Fund observers and local security in a surveyed state. Strong local support yields a peaceful transfer, while a failed vote leaves only a disputed claim."
independence_wave_negotiate_transfer: "Negotiate a Transfer"
independence_wave_negotiate_transfer_desc: "Compensate a receptive owner for a surveyed state. Completion transfers the district peacefully and records it for the integration mission."
independence_wave_prepare_border_ultimatum: "Prepare a Border Ultimatum"
independence_wave_prepare_border_ultimatum_desc: "Mobilize around a surveyed state. A distracted or receptive owner may transfer it, while refusal grants a state-specific war goal and raises isolation."
independence_wave_integrate_settled_district: "Integrate a Settled District"
independence_wave_integrate_settled_district_desc: "Commit administrators, equipment, and infrastructure to a district gained by settlement. Keeping control through the project establishes a durable core."
independence_wave_discover_regional_identity: "Discover Regional Identity"
independence_wave_discover_regional_identity_desc: "Research the selected formable family and reveal its territorial, political, and recognition requirements."
independence_wave_convene_formation_congress: "Convene a Formation Congress"
independence_wave_convene_formation_congress_desc: "Gather eligible members behind the selected regional identity. Success authorizes formation, while withdrawal or a capital dispute ends the project."
independence_wave_proclaim_military_union: "Proclaim a Military Union"
independence_wave_proclaim_military_union_desc: "Issue the selected family's military proclamation and commit the registry transaction. The proclamation carries heavy occupation, equipment, stability, and recognition costs."
independence_wave_integrate_member_region: "Integrate a Member Region"
independence_wave_integrate_member_region_desc: "Extend common institutions, security, and infrastructure through a controlled member region. Holding the state to completion establishes a shared core."
independence_wave_sponsor_another_breakaway: "Sponsor Another Breakaway"
independence_wave_sponsor_another_breakaway_desc: "Prepare a valid future candidate for the next release plan. Equipment and agents raise its opening strength and radical influence, while exposure damages recognition and standing."
independence_wave_coordinate_reclamation_fronts: "Coordinate Reclamation Fronts"
independence_wave_coordinate_reclamation_fronts_desc: "Commit the radical league's reserve to synchronized fronts. Success marks every member ready and advances the danger milestone, while failure may break the league."
independence_wave_transform_league_charter: "Transform the League Charter"
independence_wave_transform_league_charter_desc: "Submit an irreversible revisionist charter to the league. Radical members remain, unwilling low-standing members depart, and the league becomes an instrument of open sovereignty."
