l_english:
chaosx.nr15.2.t: "The Public Edition"
chaosx.nr15.2.d: "The public edition has come back from the presses. Reading circles ask for copies, ministries ask for an approved commentary, and the censors warn that an argument already copied into every workshop cannot be recalled."
chaosx.nr15.2.a: "Let every reading room have a copy."
chaosx.nr15.2.a.tt: "§YConcord§! rises moderately and §YAssignment§! falls slightly. Grants §YThe Manifesto in Public Hands§!."
chaosx.nr15.2.b: "Circulate through approved institutions."
chaosx.nr15.2.b.tt: "§YConcord§! rises slightly. Grants §YThe Manifesto in Public Hands§!."
chaosx.nr15.2.c: "Print a restricted edition."
chaosx.nr15.2.c.tt: "§YConcord§! falls moderately and §YAssignment§! rises moderately. Grants §YThe Book Made Doctrine§!."

chaosx.nr15.3.t: "The First Account"
chaosx.nr15.3.d: "Surveyors have laid their first count on the assembly table. It lists full granaries beside hungry districts, idle hands beside empty workshops, and transport routes that fail in between."
chaosx.nr15.3.a: "Publish every figure and correction."
chaosx.nr15.3.a.tt: "§YConcord§! rises moderately. Replaces §YThe Unmeasured Country§! with §YThe First Honest Account§!."
chaosx.nr15.3.b: "Let councils check the count first."
chaosx.nr15.3.b.tt: "§YConcord§! rises sharply and §YAssignment§! falls slightly. Replaces §YThe Unmeasured Country§! with §YThe First Honest Account§!."
chaosx.nr15.3.c: "Revise the figures before publication."
chaosx.nr15.3.c.tt: "§YNeed§! and §YConcord§! fall slightly. Replaces §YThe Unmeasured Country§! with §YThe First Honest Account§!."
chaosx.nr15.3.option_d: "The country rejects the plan."
chaosx.nr15.3.option_d.tt: "§YConcord§! falls sharply and §YAssignment§! rises moderately. Turns the public accounts into §YAccounts No One Believes§!."

chaosx.nr15.4.t: "The Interpretive Congress"
chaosx.nr15.4.d: "Delegates have filled the hall with five answers to the same question. Some trust households, some the common table, some exact measure, some sealed service, and a few insist the book was written to expose certainty itself."
chaosx.nr15.4.a: "Let each household assent freely."
chaosx.nr15.4.a.tt: "§YConcord§! rises moderately and §YAssignment§! falls moderately."
chaosx.nr15.4.b: "Place necessity at the common table."
chaosx.nr15.4.b.tt: "§YPlenty§! and §YConcord§! rise slightly."
chaosx.nr15.4.c: "Give the surveyors authority to measure."
chaosx.nr15.4.c.tt: "§YNeed§! falls slightly and §YAssignment§! rises slightly."
chaosx.nr15.4.option_d: "One island must obey one measure."
chaosx.nr15.4.option_d.tt: "§YPlenty§! rises slightly and §YAssignment§! rises moderately."
chaosx.nr15.4.e: "The book should teach us how to doubt it."
chaosx.nr15.4.e.tt: "§YConcord§! rises sharply and §YAssignment§! falls sharply."

chaosx.nr15.5.t: "The Storehouse Doors"
chaosx.nr15.5.d: "The first common store is ready to issue its stock, but the queue stretches beyond the square. Storekeepers can follow the schedule, serve the hungriest households first, or close the doors while a missing consignment is investigated."
chaosx.nr15.5.a: "Open the doors in orderly sequence."
chaosx.nr15.5.a.tt: "§YPlenty§! rises moderately and §YConcord§! rises slightly. Founds the §YCommon Store Network§!."
chaosx.nr15.5.b: "Prioritize households in greatest need."
chaosx.nr15.5.b.tt: "§YNeed§! falls moderately, §YPlenty§! rises slightly and §YConcord§! rises moderately. Founds the §YCommon Store Network§!."
chaosx.nr15.5.c: "Close the doors and count missing sacks."
chaosx.nr15.5.c.tt: "§YPlenty§! and §YConcord§! fall moderately. Leaves the stores as §YEmpty Common Stores§!."

chaosx.nr15.6.t: "A Calling Left Empty"
chaosx.nr15.6.d: "One of the callings the country cannot do without has too few volunteers. The empty places can be made more attractive, shared by rotation, or filled by order."
chaosx.nr15.6.a: "Improve the terms and pay for training."
chaosx.nr15.6.a.tt: "§YPlenty§! and §YAssignment§! fall slightly and §YConcord§! rises moderately."
chaosx.nr15.6.b: "Rotate the duty among qualified hands."
chaosx.nr15.6.b.tt: "§YConcord§! and §YAssignment§! rise slightly."
chaosx.nr15.6.c: "Issue an assignment quota."
chaosx.nr15.6.c.tt: "§YNeed§! and §YConcord§! fall moderately and §YAssignment§! rises sharply."

chaosx.nr15.7.t: "Promise and Provision"
chaosx.nr15.7.d: "A public guarantee has grown larger than the goods behind it. The government can correct the promise, narrow it, or defend words that the storehouse cannot honor."
chaosx.nr15.7.a: "Publish the shortage and the correction."
chaosx.nr15.7.a.tt: "§YConcord§! rises slightly."
chaosx.nr15.7.b: "Narrow the guarantee to what can be kept."
chaosx.nr15.7.b.tt: "§YNeed§! and §YConcord§! fall slightly."
chaosx.nr15.7.c: "Keep the promise and alter the figures."
chaosx.nr15.7.c.tt: "§YConcord§! falls sharply and §YAssignment§! rises moderately. The route's institution slips into its failing form."

chaosx.nr15.8.t: "The First Necessary Ground"
chaosx.nr15.8.d: "The survey finds a serious shortfall that domestic works cannot quickly answer. Before any foreign ground is named necessary, the country must decide how openly it will state the case."
chaosx.nr15.8.a: "Publish the need and peaceful remedies."
chaosx.nr15.8.a.tt: "§YLocal support§! rises slightly."
chaosx.nr15.8.b: "Exhaust another domestic review first."
chaosx.nr15.8.b.tt: "§YConcord§! rises slightly."
chaosx.nr15.8.c: "Need itself grants a natural right."
chaosx.nr15.8.c.tt: "§YConcord§! and §YLocal support§! fall moderately."

chaosx.nr15.9.t: "The First Stewardship"
chaosx.nr15.9.d: "The first territory placed under stewardship needs food, repairs, and a political future, and the order in which they are met will shape what stewardship comes to mean."
chaosx.nr15.9.a: "Provision the population before all else."
chaosx.nr15.9.a.tt: "§YConcord§! rises moderately. Puts the territory under §YProvision Before Status§! and counts as a provision check."
chaosx.nr15.9.b: "Convene a local charter assembly."
chaosx.nr15.9.b.tt: "§YLocal support§! rises moderately. Counts as the stewardship's local charter check."
chaosx.nr15.9.c: "Make the territory an Assigned Colony."
chaosx.nr15.9.c.tt: "§YConcord§! falls sharply and §YAssignment§! rises sharply. Places the territory under Assigned Colony rule as §YStewardship Without Assent§!."

chaosx.nr15.10.t: "The Proof Is Read"
chaosx.nr15.10.d: "The stores, the island, and the first obligations abroad have all been tested. Delegates have brought a final charter to the public chamber, and dissenters ask for more proof before the country takes a new name."
chaosx.nr15.10.a: "Ratify the commonwealth."
chaosx.nr15.10.a.tt: "Constitutes the commonwealth. The country takes the commonwealth name of its chosen route."
chaosx.nr15.10.b: "The country has more to prove."
chaosx.nr15.10.b.tt: "Postpones ratification until the remaining proof is met."

chaosx.nr15.11.t: "Reading Rooms Multiply"
chaosx.nr15.11.d: "Copies of the manifesto carry annotations from farms, workshops, schools, and exile circles. The reading groups ask whether their disagreements belong in public institutions."
chaosx.nr15.11.a: "Give the reading groups public rooms."
chaosx.nr15.11.a.tt: "§YConcord§! rises moderately and §YAssignment§! falls slightly."
chaosx.nr15.11.b: "Sponsor the reading circles."
chaosx.nr15.11.b.tt: "§YConcord§! rises slightly."
chaosx.nr15.11.c: "Circulate only approved commentary."
chaosx.nr15.11.c.tt: "§YConcord§! falls moderately and §YAssignment§! rises moderately."

chaosx.nr15.12.t: "Petitions of Property"
chaosx.nr15.12.d: "Petitions have arrived from tenants, smallholders, creditors, and councils as the inherited order is surveyed. The settlement can protect modest property, register compensation, open land to public claims, or proceed by seizure."
chaosx.nr15.12.a: "Protect homes, farms, and small workshops."
chaosx.nr15.12.a.tt: "§YConcord§! rises moderately and §YAssignment§! falls slightly."
chaosx.nr15.12.b: "Open a public register of compensation."
chaosx.nr15.12.b.tt: "§YPlenty§! falls slightly and §YConcord§! rises slightly."
chaosx.nr15.12.c: "Let councils petition for shared land."
chaosx.nr15.12.c.tt: "§YNeed§! falls slightly and §YAssignment§! rises slightly."
chaosx.nr15.12.option_d: "Seize what is needed without compensation."
chaosx.nr15.12.option_d.tt: "§YConcord§! falls sharply and §YAssignment§! rises sharply. Replaces §YThe Inherited Order§! with §YProperty Without Settlement§!."

chaosx.nr15.13.t: "The Doors Open"
chaosx.nr15.13.d: "The first reserve holds enough to supply more than the emergency offices. Distribution can follow published rules, favor the neediest households, or simply stay open to whoever arrives."
chaosx.nr15.13.a: "Open distribution under published rules."
chaosx.nr15.13.a.tt: "§YNeed§! falls slightly and §YConcord§! rises moderately. Turns the stores into §YReliable Public Stores§!."
chaosx.nr15.13.b: "Prioritize households in greatest need."
chaosx.nr15.13.b.tt: "§YNeed§! falls moderately and §YAssignment§! rises slightly."
chaosx.nr15.13.c: "Keep the public store open."
chaosx.nr15.13.c.tt: "§YPlenty§! and §YConcord§! fall slightly."

chaosx.nr15.15.t: "Empty Bins"
chaosx.nr15.15.d: "The bins are nearly empty and the guarantee is still posted on the wall. Officials propose narrowing the promise, prosecuting diversion, assigning emergency labor, or appealing to foreign partners."
chaosx.nr15.15.a: "Reduce the promise and explain why."
chaosx.nr15.15.a.tt: "§YNeed§! and §YConcord§! rise slightly."
chaosx.nr15.15.b: "Find and prosecute the diversion."
chaosx.nr15.15.b.tt: "§YConcord§! rises moderately and §YAssignment§! rises slightly."
chaosx.nr15.15.c: "Assign labor to refill the stores."
chaosx.nr15.15.c.tt: "§YPlenty§! rises slightly, §YConcord§! falls moderately and §YAssignment§! rises sharply."
chaosx.nr15.15.option_d: "Import supplies from foreign partners."
chaosx.nr15.15.option_d.tt: "§YPlenty§! rises slightly."

chaosx.nr15.20.t: "A Calling No One Chooses"
chaosx.nr15.20.d: "A calling essential to food, transport, care, or defense still lacks hands. Its members describe hard conditions, poor housing, and a duty that has become a permanent burden."
chaosx.nr15.20.a: "Improve the work and its rewards."
chaosx.nr15.20.a.tt: "§YPlenty§! and §YAssignment§! fall slightly and §YConcord§! rises moderately."
chaosx.nr15.20.b: "Guarantee housing near the calling."
chaosx.nr15.20.b.tt: "§YPlenty§! falls moderately and §YConcord§! rises sharply."
chaosx.nr15.20.c: "Rotate the service among trained hands."
chaosx.nr15.20.c.tt: "§YConcord§! and §YAssignment§! rise slightly."
chaosx.nr15.20.option_d: "Fill the vacancies by quota."
chaosx.nr15.20.option_d.tt: "§YNeed§! falls moderately, §YConcord§! falls sharply and §YAssignment§! rises sharply."

chaosx.nr15.21.t: "The Gifted Transfer"
chaosx.nr15.21.d: "A group of trained workers has volunteered to leave a comfortable calling for one in shortage. Their example can be celebrated as civic service or turned into a permanent fund for future transfers."
chaosx.nr15.21.a: "Publish names and honor their transfer."
chaosx.nr15.21.a.tt: "§YConcord§! rises slightly and §YAssignment§! falls slightly."
chaosx.nr15.21.b: "Turn their gift into a training fund."
chaosx.nr15.21.b.tt: "§YPlenty§! falls slightly and §YConcord§! rises moderately."

chaosx.nr15.22.t: "Names Missing from the Register"
chaosx.nr15.22.d: "Inspectors find workers missing from the calling lists. Some have fled, some were never counted, and local officials are sheltering the rest."
chaosx.nr15.22.a: "Negotiate their return on better terms."
chaosx.nr15.22.a.tt: "§YConcord§! rises moderately and §YAssignment§! falls slightly."
chaosx.nr15.22.b: "Revise the quotas to match real capacity."
chaosx.nr15.22.b.tt: "§YNeed§! rises slightly and §YAssignment§! falls moderately."
chaosx.nr15.22.c: "Punish evasion and those who shelter it."
chaosx.nr15.22.c.tt: "§YConcord§! falls moderately and §YAssignment§! rises moderately."
chaosx.nr15.22.option_d: "Mark the quotas complete anyway."
chaosx.nr15.22.option_d.tt: "§YConcord§! falls sharply. Leaves the stores or the survey in their failing form, §YEmpty Common Stores§! or §YAccounts No One Believes§!."

chaosx.nr15.23.t: "Six Hours Under Pressure"
chaosx.nr15.23.d: "The six-hour day has reached its first severe shortage. The country can preserve the promise, suspend it openly, extend hours only where needed, or discard it as a luxury."
chaosx.nr15.23.a: "Keep the short day, train more hands."
chaosx.nr15.23.a.tt: "§YPlenty§! falls slightly and §YConcord§! rises moderately."
chaosx.nr15.23.b: "Suspend it until the stores recover."
chaosx.nr15.23.b.tt: "§YPlenty§! rises moderately and §YAssignment§! rises slightly."
chaosx.nr15.23.c: "Extend hours in strained callings."
chaosx.nr15.23.c.tt: "§YPlenty§!, §YConcord§! and §YAssignment§! rise slightly."
chaosx.nr15.23.option_d: "Abolish the six-hour day."
chaosx.nr15.23.option_d.tt: "§YPlenty§! and §YAssignment§! rise sharply and §YConcord§! falls sharply."

chaosx.nr15.30.t: "Surplus Grain"
chaosx.nr15.30.d: "Regional stores hold more grain than the reserve plan requires. Neighboring districts and foreign partners report shortages. The surplus can be kept, rotated through households, given as aid, or traded for something the country lacks."
chaosx.nr15.30.a: "Keep the reserve above every promise."
chaosx.nr15.30.a.tt: "§YPlenty§! rises slightly."
chaosx.nr15.30.b: "Rotate grain through household stores."
chaosx.nr15.30.b.tt: "§YNeed§! falls slightly and §YConcord§! rises slightly. Turns the stores into §YReliable Public Stores§!."
chaosx.nr15.30.c: "Send relief beyond the shore."
chaosx.nr15.30.c.tt: "§YPlenty§! falls moderately and §YConcord§! rises moderately."
chaosx.nr15.30.option_d: "Trade the surplus for what we lack."
chaosx.nr15.30.option_d.tt: "§YNeed§! falls moderately and §YPlenty§! falls slightly."

chaosx.nr15.31.t: "Gold Without Honor"
chaosx.nr15.31.d: "Luxury goods and gold sit behind guarded doors, public works are short of materials, and the common stores are short of money. Their value can pay for provision, public services, a political example, or the reserve."
chaosx.nr15.31.a: "Pledge it to pay for provision."
chaosx.nr15.31.a.tt: "§YNeed§! falls moderately and §YPlenty§! rises slightly."
chaosx.nr15.31.b: "Fund clinics and schools with it."
chaosx.nr15.31.b.tt: "§YPlenty§! rises moderately and §YConcord§! rises slightly."
chaosx.nr15.31.c: "Open the vault and condemn luxury."
chaosx.nr15.31.c.tt: "§YConcord§! and §YAssignment§! rise slightly."
chaosx.nr15.31.option_d: "Keep a reserve recognized abroad."
chaosx.nr15.31.option_d.tt: "§YPlenty§! rises slightly."

chaosx.nr15.32.t: "The Hidden Market"
chaosx.nr15.32.d: "An unofficial market has grown beside the ration queue. It may reveal a need for lawful exchange, a failure in distribution, hidden privilege, or a crime against the common stock."
chaosx.nr15.32.a: "Allow limited public exchange."
chaosx.nr15.32.a.tt: "§YPlenty§! and §YConcord§! rise slightly and §YAssignment§! falls slightly."
chaosx.nr15.32.b: "Repair distribution first."
chaosx.nr15.32.b.tt: "§YPlenty§! and §YConcord§! rise moderately."
chaosx.nr15.32.c: "Audit the officials and favored buyers."
chaosx.nr15.32.c.tt: "§YNeed§! falls slightly and §YConcord§! rises slightly."
chaosx.nr15.32.option_d: "Close the market and prosecute sellers."
chaosx.nr15.32.option_d.tt: "§YPlenty§! rises slightly, §YConcord§! falls sharply and §YAssignment§! rises sharply."

chaosx.nr15.40.t: "The District Chooses Its Shape"
chaosx.nr15.40.d: "Residents have gathered around the survey map. They ask whether the new district will grow food, house industry, connect the railways, serve learning and care, or receive displaced families."
chaosx.nr15.40.a: "Build a market-garden municipality."
chaosx.nr15.40.a.tt: "§YNeed§! falls slightly and §YPlenty§! rises slightly. Presents the district as a market-garden municipality."
chaosx.nr15.40.b: "Join industrial housing to the workshops."
chaosx.nr15.40.b.tt: "§YNeed§! falls moderately and §YPlenty§! falls slightly. Presents the district as an industrial housing district."
chaosx.nr15.40.c: "Build a rail and road junction."
chaosx.nr15.40.c.tt: "§YPlenty§! rises moderately. Presents the district as a rail and road junction."
chaosx.nr15.40.option_d: "Build around schools and clinics."
chaosx.nr15.40.option_d.tt: "§YConcord§! rises moderately and §YAssignment§! falls slightly. Presents the district as a town of schools and clinics."
chaosx.nr15.40.e: "Found a refugee municipality."
chaosx.nr15.40.e.tt: "§YNeed§! rises slightly and §YConcord§! rises sharply. Presents the district as a refugee municipality."

chaosx.nr15.41.t: "Houses Without Work"
chaosx.nr15.41.d: "The houses are finished, but the promised work has not arrived. Empty workshops and long commutes are turning a model district into a dormitory town."
chaosx.nr15.41.a: "Require each project to name its calling."
chaosx.nr15.41.a.tt: "§YNeed§! rises moderately and §YConcord§! falls slightly."
chaosx.nr15.41.b: "Fund local workshops and repair halls."
chaosx.nr15.41.b.tt: "§YPlenty§! and §YConcord§! rise slightly."
chaosx.nr15.41.c: "Assign residents to required work."
chaosx.nr15.41.c.tt: "§YNeed§! falls slightly, §YConcord§! falls moderately and §YAssignment§! rises moderately."

chaosx.nr15.42.t: "Work Without Homes"
chaosx.nr15.42.d: "Factories and offices are hiring faster than the district can house their workers. Rents, overcrowding, and improvised lodgings threaten the life the plan was meant to secure."
chaosx.nr15.42.a: "Build emergency housing."
chaosx.nr15.42.a.tt: "§YNeed§! rises moderately and §YPlenty§! falls slightly."
chaosx.nr15.42.b: "Extend transport from existing homes."
chaosx.nr15.42.b.tt: "§YPlenty§! falls slightly and §YConcord§! rises slightly."
chaosx.nr15.42.c: "Erect barracks beside the works."
chaosx.nr15.42.c.tt: "§YConcord§! falls moderately and §YAssignment§! rises moderately."

chaosx.nr15.43.t: "The District Refuses the Plan"
chaosx.nr15.43.d: "The district assembly refuses the standardized plan. Residents say its roads ignore local trade, its housing ignores family life, and its public buildings were placed without a vote."
chaosx.nr15.43.a: "Revise the charter with the assembly."
chaosx.nr15.43.a.tt: "§YConcord§! rises moderately and §YAssignment§! falls slightly."
chaosx.nr15.43.b: "Let local designers direct the plan."
chaosx.nr15.43.b.tt: "§YConcord§! rises sharply and §YAssignment§! falls moderately."
chaosx.nr15.43.c: "Impose the approved standard."
chaosx.nr15.43.c.tt: "§YPlenty§! rises slightly, §YConcord§! falls sharply and §YAssignment§! rises sharply."
chaosx.nr15.43.option_d: "Abandon the district and count the loss."
chaosx.nr15.43.option_d.tt: "§YNeed§! rises slightly and §YConcord§! falls slightly."

chaosx.nr15.44.t: "The Inland Island"
chaosx.nr15.44.d: "A landlocked country cannot put its island project behind a natural channel. Surveyors propose a railway ring, a ring of gardens and waterworks, or fortified roads that would give the inland capital the functions of an island."
chaosx.nr15.44.a: "Make the railway ring its first boundary."
chaosx.nr15.44.a.tt: "§YPlenty§! rises slightly."
chaosx.nr15.44.b: "Build a ring of gardens and waterworks."
chaosx.nr15.44.b.tt: "§YNeed§! falls slightly and §YConcord§! rises slightly."
chaosx.nr15.44.c: "Fortify every road into the ring."
chaosx.nr15.44.c.tt: "§YAssignment§! rises slightly."

chaosx.nr15.45.t: "The District Falls Short"
chaosx.nr15.45.survey.d: "The final survey of [?utopia_manifesto_district_project_state.GetName] finds that the state can no longer support the planned district. Population, roads, available land, housing, migration, reserves, and the demand for skilled workers have all shifted since the plans were drawn. The government can publish the shortfall and seek support for revised plans, reduce the district's scope, or impose a construction timetable."
chaosx.nr15.45.obligations.d: "The construction review in [?utopia_manifesto_district_project_state.GetName] found homes, transport links, or public facilities still unfinished, and residents are still waiting for the district they were promised. The government can publish the shortfall, reduce the plan, or force the work ahead."
chaosx.nr15.45.a: "Publish the shortfall."
chaosx.nr15.45.a_release_tt: "§GConcord +15§!  §GAssignment -10§!\nThe government pledges a public remedy. The incomplete district remains available for recommitment if it still qualifies."
chaosx.nr15.45.b: "Reduce the district's scope."
chaosx.nr15.45.b_release_tt: "§RNeed +10§!  §GPlenty +10§!  §RConcord -10§!\nThe failed survey closes. The incomplete district remains delayed until another suitable role is chosen."
chaosx.nr15.45.c: "Impose the timetable."
chaosx.nr15.45.c_release_tt: "§GNeed -10§!  §RConcord -20§!  §RAssignment +20§!\nThe failed survey closes. The coercion and unresolved obligation dispute become part of the country's history."

chaosx.nr15.46.t: "The Assigned Charter Is Challenged"
chaosx.nr15.46.d: "The Closed Island charter in [?utopia_manifesto_district_project_state.GetName] ties homes, stores, and service to an assigned conduct code. Residents are petitioning for the right to appeal their stewards' orders. The government can fund hearings, admit foreign inspectors, or suppress the challenge."
chaosx.nr15.46.a: "Fund the appeals."
chaosx.nr15.46.a_release_tt: "£pol_power §R[?global.black_friday_price_utopia_manifesto_decision_cost_pp_medium|0]§!  §GConcord +20§!  §GAssignment -15§!\nLocal Resistance Target falls from §R+8%§! to §R+3%§!. Neighboring states remain wary."
chaosx.nr15.46.b: "Admit foreign inspectors."
chaosx.nr15.46.b_release_tt: "§RPlenty -15§!  §GConcord +15§!  §GAssignment -10§!\nLocal Resistance Target falls from §R+8%§! to §R+3%§!. Neighboring states accept the partnership."
chaosx.nr15.46.c: "Suppress the appeal."
chaosx.nr15.46.c_release_tt: "§GPlenty +10§!  §RConcord -20§!  §RAssignment +20§!\nThe §R+8%§! Resistance Target remains. Neighboring states oppose the arrangement, and the coercive dispute stays unresolved."

chaosx.nr15.47.t: "The Rolls of Penal Works"
chaosx.nr15.47.d: "Household names sit beside quotas in the labor columns from [?utopia_manifesto_penal_works_project_state.GetName]. Penal Works has already killed [?utopia_manifesto_penal_works_report_civilian_loss|0] civilians through camps and forced labor."
chaosx.nr15.47.a: "Publish the labor rolls."
chaosx.nr15.47.a_release_tt: "§GConcord +10§!  §GAssignment -10§!\nPenal Works continues under supervision. Local Resistance Target becomes §R+8%§!."
chaosx.nr15.47.b: "Admit foreign inspectors."
chaosx.nr15.47.b_release_tt: "§RPlenty -15§!  §GConcord +15§!  §GAssignment -10§!\nPenal Works remains active. Local Resistance Target becomes §R+8%§!, and neighboring states accept the partnership."
chaosx.nr15.47.c: "Harden the timetable."
chaosx.nr15.47.c_release_tt: "§GPlenty +10§!  §RConcord -15§!  §RAssignment +15§!\nPenal Works remains active. Local Resistance Target becomes §R+18%§!, and neighboring states oppose the arrangement."
chaosx.nr15.47.option_d: "Halt Penal Works."
chaosx.nr15.47.option_d_release_tt: "§GConcord +5§!  §GAssignment -5§!\nThe district must meet its role plan by ordinary means. Neighboring states welcome the halt. The [?utopia_manifesto_penal_works_report_civilian_loss|0] civilian deaths and the coercion remain part of the country's history."

chaosx.nr15.50.t: "The Case Is Made"
chaosx.nr15.50.d: "The inquiry has assembled the deficit, the target ground, domestic alternatives, and the conduct expected after any agreement. The case can be made public, tested independently, or declared beyond further question."
chaosx.nr15.50.a: "Publish the case and every assumption."
chaosx.nr15.50.b: "Submit it to independent review."
chaosx.nr15.50.c: "The survey is sufficient authority."

chaosx.nr15.51.t: "A Domestic Alternative"
chaosx.nr15.51.d: "A domestic alternative could answer the need without foreign ground, but it would take time and investment. The government can close the case, revise it honestly, suppress the finding, or dismiss the alternative as inadequate."
chaosx.nr15.51.a: "Close the case and build at home."
chaosx.nr15.51.b: "Fit the claim to remaining need."
chaosx.nr15.51.c: "Suppress the domestic alternative."
chaosx.nr15.51.option_d: "Dismiss it as too slow for the need."

chaosx.nr15.52.t: "The Counteroffer"
chaosx.nr15.52.d: "The foreign government has answered with terms short of our first request. We can accept them if they meet the real need, revise our proposal once more, or reject them as an evasion."
chaosx.nr15.52.a: "Accept the terms that answer the need."
chaosx.nr15.52.b: "Revise the proposal once more."
chaosx.nr15.52.c: "Reject the counteroffer."

chaosx.nr15.53.t: "Petition from the Ground"
chaosx.nr15.53.d: "Residents of the ground named in our case have sent a petition describing their own shortages, institutions, and wishes for their status. They ask to be treated as parties to the settlement."
chaosx.nr15.53.a: "Draft a local charter with residents."
chaosx.nr15.53.b: "Promise a public status vote."
chaosx.nr15.53.c: "Hear the competing petitions first."
chaosx.nr15.53.option_d: "The claim concerns land alone."

chaosx.nr15.54.t: "When Need Recedes"
chaosx.nr15.54.d: "The published term has ended, or the deficit no longer supports the case, and every ultimatum and private warrant has lapsed. The country can renounce the case or ask the named partner for a limited treaty in its place. If the original need and the target ground still exist, the case can also continue under a shorter deadline and a public political cost."
chaosx.nr15.54.a: "Renounce the obsolete claim."
chaosx.nr15.54.b: "Replace the claim with a limited treaty."
chaosx.nr15.54.c: "Continue the case under public penalty."
chaosx.nr15.54.a.tt: "Ends this case, withdraws every remaining warrant, and clears the named target. Concord rises."
chaosx.nr15.54.b.tt: "Asks the named partner to replace the suspended case with a limited long-supply contract, settlement agreement, or lease, depending on the selected ground. The partner may accept or refuse. The offer creates no ownership, core, claim, or wargoal."
chaosx.nr15.54.c.tt: "Available only while the original deficit and the selected target remain valid. The old ultimatum and wargoal stay removed. Case integrity, local support, and Concord fall, Assignment rises, and a shorter deadline begins."

chaosx.nr15.55.t: "The Natural Right Hardens"
chaosx.nr15.55.d: "Officials present Necessary Ground as a permanent doctrine. The country can return to the ladder of peaceful offers, keep a strict review, or declare that need itself is a title to land."
chaosx.nr15.55.a: "Return every case to peaceful proof."
chaosx.nr15.55.b: "Keep a strict doctrine under formal review."
chaosx.nr15.55.c: "Declare need a title to land."

chaosx.nr15.60.t: "Stores Arrive First"
chaosx.nr15.60.d: "Supply columns have reached the administered territory, whose political status is still unsettled. The stores can distribute through common institutions or place local authorities in charge."
chaosx.nr15.60.a: "Open the common stores for distribution."
chaosx.nr15.60.b: "Let local institutions direct the issue."

chaosx.nr15.61.t: "Soldiers Arrive First"
chaosx.nr15.61.d: "Soldiers have reached the territory ahead of enough food, medicine, and repair stock. The administration can put civilian provision first, share military rations, or keep the army supplied at the population's expense."
chaosx.nr15.61.a: "Divert stores to emergency provision."
chaosx.nr15.61.b: "Share rations with troops and households."
chaosx.nr15.61.c: "The army must remain supplied first."

chaosx.nr15.62.t: "The Charter Assembly"
chaosx.nr15.62.d: "The provisional charter assembly is ready. It can establish an elected municipality, a worker council, a planning board, an autonomy compact, or an Assigned Colony."
chaosx.nr15.62.a: "Seat an elected municipality."
chaosx.nr15.62.b: "Convene workers and calling delegates."
chaosx.nr15.62.c: "Create a territory planning board."
chaosx.nr15.62.option_d: "Write an autonomy compact."
chaosx.nr15.62.e: "Establish an Assigned Colony."

chaosx.nr15.63.t: "The Status Vote"
chaosx.nr15.63.d: "The charter period has ended and residents have gathered to choose a lasting status. The ballot reflects local supplies and support, the place's ties to its former country, wartime damage, past imposed rule, and how our own institutions have behaved."
chaosx.nr15.63.a: "Offer integration through a public vote."
chaosx.nr15.63.b: "Form an associated partnership."
chaosx.nr15.63.c: "Grant independence with an autonomy pact."
chaosx.nr15.63.option_d: "Return the stewardship."
chaosx.nr15.63.a.tt: "Requires very high case integrity and local support, completed stewardship proof, no history of repression or unresolved war damage, and a route that allows a public integration vote. Opens the long integration mission. No territory or core changes hands immediately."
chaosx.nr15.63.b.tt: "Requires strong case integrity and local support. Ratification returns the state, keeps its institutions under an association charter, creates only the access and guarantee relations the charter names, and adds the partner to the external network with a right of later review."
chaosx.nr15.63.c.tt: "Requires a valid partner and sufficient local support. Ratification returns the state, recognizes an independent government, and creates an autonomy pact with a defensive guarantee but no access or annexation."
chaosx.nr15.63.option_d.tt: "Returns the state without an association or defense pact, publicly renounces the claim, and ends every stewardship obligation."

chaosx.nr15.64.t: "The Colony Revolts"
chaosx.nr15.64.d: "The colony has risen against assigned labor, ration priority, and rule without local assent. The state can recognize independence, negotiate association, repress the revolt, or accept outside mediation."
chaosx.nr15.64.a: "End assignment and grant independence."
chaosx.nr15.64.b: "Negotiate a free association."
chaosx.nr15.64.c: "Suppress the revolt."
chaosx.nr15.64.option_d: "Invite foreign mediation."

chaosx.nr15.70.t: "The First Invitation"
chaosx.nr15.70.d: "The first foreign government has asked what membership in the commonwealth would require. We can offer full participation, observation, or a narrower reserve compact."
chaosx.nr15.70.a: "Invite them into the commonwealth."
chaosx.nr15.70.b: "Offer observation and technical exchange."
chaosx.nr15.70.c: "Begin with a reserve compact."

chaosx.nr15.71.t: "The Stores Are Tested"
chaosx.nr15.71.d: "A partner has asked the common reserve for help during a severe shortage. How much we send will show what the compact is worth."
chaosx.nr15.71.a: "Release the full aid promised."
chaosx.nr15.71.b: "Send what the stores can spare."
chaosx.nr15.71.c: "Our own guarantees come first."
chaosx.nr15.71.option_d: "Aid will come with new conditions."

chaosx.nr15.72.t: "The Sponsor's Answer"
chaosx.nr15.72.d: "[FROM.GetNameDef] has accepted a bounded place in the League. Its chosen terms are public, with no authority over member governments and no military obligation beyond what it expressly offered."
chaosx.nr15.72.a: "Publish the League's accepted terms."

chaosx.nr15.73.t: "A Dispute Among Small Places"
chaosx.nr15.73.d: "Two members dispute a reserve contribution and the route of an aid convoy. Households, councils, experts, stewards, or a plural panel can settle the matter."
chaosx.nr15.73.a: "Put the dispute to household votes."
chaosx.nr15.73.b: "Convene a congress of member councils."
chaosx.nr15.73.c: "Seek technical arbitration."
chaosx.nr15.73.option_d: "Issue a binding stewardship order."
chaosx.nr15.73.e: "Form a panel with every side represented."

chaosx.nr15.74.t: "The League Becomes a Mask"
chaosx.nr15.74.d: "A partner says the commonwealth has become a mask for our command. We can restore its autonomy, rewrite the compact, or keep the mask because it is useful."
chaosx.nr15.74.a: "Restore the member's promised powers."
chaosx.nr15.74.b: "Rewrite the compact with all delegates."
chaosx.nr15.74.c: "Give the commonwealth one leader."

chaosx.nr15.80.t: "The Citizen Watch Holds"
chaosx.nr15.80.d: "The citizen watch held a storehouse through bombardment and disorder. Its volunteers ask whether the watch will be honored as a permanent institution or return to ordinary callings."
chaosx.nr15.80.a: "Honor the watch that defended the stores."
chaosx.nr15.80.b: "Return the volunteers to their callings."

chaosx.nr15.81.t: "Engineers Save the Route"
chaosx.nr15.81.d: "Engineer companies restored a broken supply route on their own. Their work can be commemorated or expanded into a lasting national institution."
chaosx.nr15.81.a: "Honor the engineers who saved the route."
chaosx.nr15.81.b: "Expand the engineer service."

chaosx.nr15.82.t: "The Auxiliary Bill"
chaosx.nr15.82.d: "The auxiliary force has presented its bill in equipment, pay, privileges, and political concessions. The state can pay, equip, grant limited autonomy, or postpone the settlement."
chaosx.nr15.82.a: "Pay the contract in full."
chaosx.nr15.82.b: "Settle the account with equipment."
chaosx.nr15.82.c: "Grant limited autonomy under our command."
chaosx.nr15.82.option_d: "Promise a settlement after the emergency."

chaosx.nr15.83.t: "Casualties Beyond the Island"
chaosx.nr15.83.d: "Reports list foreign auxiliaries killed in an operation that spared citizen formations. The country can review how they were used, offer citizenship, or keep the losses out of the public count."
chaosx.nr15.83.a: "Open a service and casualty review."
chaosx.nr15.83.b: "Offer citizenship to those who remain."
chaosx.nr15.83.c: "Their losses were part of the contract."

chaosx.nr15.84.t: "The Contract Breaks"
chaosx.nr15.84.d: "The auxiliary contract is breaking under unpaid obligations, divided command, and foreign pressure. Renegotiation, integration into the regular army, organized defection, and open mutiny are all possible outcomes."
chaosx.nr15.84.a: "Renegotiate while command still holds."
chaosx.nr15.84.b: "Integrate vetted forces into the army."
chaosx.nr15.84.c: "Prepare for organized defections."
chaosx.nr15.84.option_d: "Crush the mutiny before it spreads."

chaosx.nr15.90.t: "The Promise Outruns the Stores"
chaosx.nr15.90.d: "The common stores can no longer keep every guarantee printed in the founding charter. The country can narrow the promise, reorder distribution, or keep a promise the shelves cannot honor."
chaosx.nr15.90.a: "Limit the guarantee to our reserves."
chaosx.nr15.90.b: "Prioritize those in greatest need."
chaosx.nr15.90.c: "Keep the promise and hide the shortage."

chaosx.nr15.91.t: "The Survey Becomes Scripture"
chaosx.nr15.91.d: "The Board of Measure treats disputed surveys as disobedience. Appeals are delayed, local findings are ignored, and corrections vanish from public view."
chaosx.nr15.91.a: "Restore independent appeals."
chaosx.nr15.91.b: "Let local institutions review the data."
chaosx.nr15.91.c: "The survey is the country's scripture."

chaosx.nr15.92.t: "The Councils Cannot Decide"
chaosx.nr15.92.d: "The councils cannot agree on production, reserve release, or the transfer of workers between callings. Every delegate claims a mandate, and the stores are paying for the deadlock."
chaosx.nr15.92.a: "Grant the congress an emergency mandate."
chaosx.nr15.92.b: "Put the dispute to household referendums."
chaosx.nr15.92.c: "No council will surrender its mandate."

chaosx.nr15.93.t: "The Household Cannot Leave"
chaosx.nr15.93.d: "A household that wishes to leave an assigned calling has been refused housing, ration priority, and municipal transfer. The charter promises lawful exit, and this refusal contradicts it."
chaosx.nr15.93.a: "Guarantee the household's right to leave."
chaosx.nr15.93.b: "Review relocation and placement rules."
chaosx.nr15.93.c: "No household leaves its service."
chaosx.nr15.93.option_d: "Move the household to assigned work."

chaosx.nr15.94.t: "The Island Needs Another Shore"
chaosx.nr15.94.d: "The Closed Island has completed its first external case and found that its separation still depends on foreign routes, labor, or ground. The regime can admit the dependence, rebuild its reserves around it, or deny it."
chaosx.nr15.94.a: "Admit what the island still needs."
chaosx.nr15.94.b: "Rebuild reserves around the dependency."
chaosx.nr15.94.c: "The island is self-sufficient by decree."

chaosx.nr15.95.t: "The Book Cannot Be Questioned"
chaosx.nr15.95.d: "Official commentators have begun treating criticism of the manifesto as hostility to the state. The government can protect dissent, authorize one commentary, or declare the text beyond dispute."
chaosx.nr15.95.a: "Protect the right to criticize the book."
chaosx.nr15.95.b: "Publish an official commentary."
chaosx.nr15.95.c: "The manifesto is no longer a question."

chaosx.nr15.200.t: "Offer of Long Supply"
chaosx.nr15.200.d: "[FROM.GetNameDef] offers a long-term supply agreement for the resource or goods named in its Necessary Ground case. The proposal promises regular deliveries in exchange for payment and public guarantees."
chaosx.nr15.200.a: "Accept the long-term supply agreement."
chaosx.nr15.200.b: "Return a counteroffer."
chaosx.nr15.200.c: "Refuse the arrangement."

chaosx.nr15.201.t: "Request for a Lease"
chaosx.nr15.201.d: "[FROM.GetNameDef] requests a lease over the ground or facilities named in its case. The lease would leave our sovereignty intact and grant defined access for a fixed term."
chaosx.nr15.201.a: "Accept the lease under published terms."
chaosx.nr15.201.b: "Return a narrower lease proposal."
chaosx.nr15.201.c: "Refuse the lease."

chaosx.nr15.202.t: "A Joint Administration"
chaosx.nr15.202.d: "[FROM.GetNameDef] proposes a joint administration over the place named in its case. Shared officials would manage access, provision, and accounts, and both states would keep a public voice."
chaosx.nr15.202.a: "Accept joint administration."
chaosx.nr15.202.b: "Return a revised division of authority."
chaosx.nr15.202.c: "Refuse shared rule."

chaosx.nr15.203.t: "An Association Proposed"
chaosx.nr15.203.d: "[FROM.GetNameDef] offers association in place of annexation or direct rule. The compact would join our stores and obligations and leave our government and a defined right of withdrawal in place."
chaosx.nr15.203.a: "Accept the association."
chaosx.nr15.203.b: "Return terms that protect our autonomy."
chaosx.nr15.203.c: "Refuse the compact."

chaosx.nr15.204.t: "An Ultimatum from Utopia"
chaosx.nr15.204.d: "[FROM.GetNameDef] declares that its material need gives it a final claim over our ground. It demands compliance by the published deadline and promises force if we refuse."
chaosx.nr15.204.a: "Submit to the ultimatum."
chaosx.nr15.204.b: "Refuse the claim."

chaosx.nr15.210.t: "An Invitation from the Commonwealth"
chaosx.nr15.210.d: "[FROM.GetNameDef] invites us to join a compact of stores, reconstruction, arbitration, and mutual defense. Full membership would carry shared obligations and leave our government and formal sovereignty intact."
chaosx.nr15.210.a: "Join the commonwealth as a full member."
chaosx.nr15.210.b: "Accept observer status."
chaosx.nr15.210.c: "Join only the reserve compact."
chaosx.nr15.210.option_d: "Refuse the invitation."
chaosx.nr15.210.e: "Join only with a defense guarantee."

chaosx.nr15.211.t: "A Reserve Compact"
chaosx.nr15.211.d: "[FROM.GetNameDef] proposes a narrower compact for emergency stores, reconstruction deliveries, and public contributions. It offers practical cooperation without full political membership."
chaosx.nr15.211.a: "Join the reserve compact."
chaosx.nr15.211.b: "Keep our stores outside it."

chaosx.nr15.215.t: "A Request from the Commonwealth League"
chaosx.nr15.215.d: "[FROM.GetNameDef] asks us to sponsor its compact of smaller places. We can send engineers and credit without taking on a defense obligation, offer a formal guarantee on terms we choose, or refuse. Nothing is committed unless we consent here."
chaosx.nr15.215.a: "Offer sponsorship without a guarantee."
chaosx.nr15.215.b: "Back our sponsorship with a guarantee."
chaosx.nr15.215.c: "Refuse the sponsorship request."

chaosx.nr15.217.t: "The Founder Breaks the Charter"
chaosx.nr15.217.d: "[FROM.GetNameDef], which promised to preserve our government and sovereignty, has made war upon us. The League charter does not require us to remain under a founder that attacks a member. We may leave at once or keep our seat while the League judges the breach."
chaosx.nr15.217.a: "Leave the League."
chaosx.nr15.217.b: "Let the League judge the breach."

chaosx.nr15.213.t: "The Island Lease Comes Due"
chaosx.nr15.213.d: "[FROM.GetNameDef] asks us to extend the published lease over our island. Its harbor, stores, and defenses remain our property even while the commonwealth controls them, and every permanent work will stay with the state when control returns. We can grant three more years, offer a narrower two-year term, or let the original agreement expire."
chaosx.nr15.213.a: "Extend the public lease for three years."
chaosx.nr15.213.b: "Offer two years and no more."
chaosx.nr15.213.c: "The island returns when the term ends."

chaosx.nr15.219.t: "A Claim Becomes an Agreement"
chaosx.nr15.219.d: "[FROM.GetNameDef] has suspended its Necessary Ground case against us and withdrawn every ultimatum and private warrant. It offers a limited agreement suited to the place named in the case: regular supply, a settlement charter, or a fixed lease for access and defense. Our ownership and sovereignty stay unchanged unless we accept the published terms."
chaosx.nr15.219.a: "Accept the limited agreement."
chaosx.nr15.219.b: "Decline the agreement."

chaosx.nr15.100.t: "Glosses in the Margin"
chaosx.nr15.100.d: "Annotations have outgrown the private margins. Schools, councils, households, and exiles defend organized readings of the book, and the right to revise it has become an institution in its own right."
chaosx.nr15.100.a: "Open schools of interpretation."
chaosx.nr15.100.b: "Place the schools under public charters."
chaosx.nr15.100.c: "Censor the margins before factions form."

chaosx.nr15.101.t: "Necessary Shores"
chaosx.nr15.101.d: "Migration, blockade, and crowded districts have carried the question of need to the shore. Surveyors must decide whether domestic alternatives, peaceful offers, or emergency power will define the next case."
chaosx.nr15.101.a: "Exhaust domestic alternatives first."
chaosx.nr15.101.b: "Make peaceful offers before every demand."
chaosx.nr15.101.c: "Use emergency powers for severe need."

chaosx.nr15.102.t: "Cities of One Measure"
chaosx.nr15.102.d: "The settlement plan has crossed municipal and national boundaries. Linked cities ask whether they will preserve local charters, accept a common standard, or form an outward circle of influence."
chaosx.nr15.102.a: "Let every city keep its charter."
chaosx.nr15.102.b: "Join the cities under one standard."
chaosx.nr15.102.c: "Build a foreign circle of planned cities."

chaosx.nr15.103.t: "Nowhere Made Law"
chaosx.nr15.103.d: "Foreign governments treat the manifesto as a legal identity claimed by partners, movements, sponsors, and rivals. The commonwealth must decide whether that identity remains plural, sponsored, or tied to one official route."
chaosx.nr15.103.a: "Let many constitutions bear the name."
chaosx.nr15.103.b: "Accept sponsorship under written limits."
chaosx.nr15.103.c: "Make our interpretation the regional law."

chaosx.nr15.104.t: "The Perfect Island"
chaosx.nr15.104.d: "Regional order is failing around the commonwealth. The state can spread refuge through willing places, seek self-sufficiency within limits, or seal itself behind a compulsory island order."
chaosx.nr15.104.a: "Build a network of willing refuges."
chaosx.nr15.104.b: "Pursue bounded self-sufficiency."
chaosx.nr15.104.c: "Close the gates and complete the order."

chaosx.nr15.105.t: "The Margins Enter the Survey"
chaosx.nr15.105.d: "Annotated copies of the manifesto have reached the survey schools ahead of the founding congress. Teachers, delegates, and household witnesses must decide whether rival readings stay open, receive public charters, or are suppressed."
chaosx.nr15.105.a: "Open every margin to public challenge."
chaosx.nr15.105.b: "Give the schools public charters."
chaosx.nr15.105.c: "Seal the margins before factions form."

chaosx.nr15.106.t: "Necessary Shores Before the Charter"
chaosx.nr15.106.d: "The completed survey has identified shortages that may become claims upon land and transport. Before a constitutional route is chosen, the delegates must decide whether domestic repair, an ordered ladder of peaceful offers, or emergency warrants will govern every Necessary Ground case."
chaosx.nr15.106.a: "Prove the domestic alternative first."
chaosx.nr15.106.b: "Bind every case to the peaceful ladder."
chaosx.nr15.106.c: "Reserve warrants for severe need."
chaosx_nr15_106_a_domestic_alternative_tt: "Enables §YDomestic Alternatives§!. Necessary Ground cases permit paid repair terms that strengthen case integrity and local support, then ease the affected calling shortage and lower Need."
chaosx_nr15_106_b_peaceful_ladder_tt: "Enables §YPeaceful Priority§!. Necessary Ground cases keep the order of purchase, lease, settlement, joint administration, and association. Paid bargaining terms strengthen integrity and local support, then raise Concord and move Choice versus Assignment toward Choice."
chaosx_nr15_106_c_emergency_warrant_tt: "Enables §YEmergency Powers§!. Severe cases permit costly warrants that trade case integrity and Concord for local support and movement toward Assignment. Completing a warrant brings foreign and League opposition."

chaosx.nr15.107.t: "Cities Before One Measure"
chaosx.nr15.107.d: "The first districts already share workshops, transport, and public accounts, and a foreign municipality is watching the experiment. The opening compact can preserve local charters, adopt one linked standard, or invite an outward circle of planned cities."
chaosx.nr15.107.a: "Let each city renew its own charter."
chaosx.nr15.107.b: "Link the districts under one measure."
chaosx.nr15.107.c: "Invite a foreign municipal circle."

chaosx.nr15.108.t: "A Manifesto Seeks Our Judgment"
chaosx.nr15.108.d: "[FROM.GetNameDef] has asked us to judge whether its public stores and planned districts deserve support before the commonwealth is formally constituted. We can promise aid under written terms, send observers and keep our distance, or oppose the doctrine openly."
chaosx.nr15.108.a: "Offer support under written terms."
chaosx.nr15.108.b: "Send observers without committing aid."
chaosx.nr15.108.c: "Oppose this doctrine before it spreads."

chaosx.nr15.109.t: "The Observer Answers"
chaosx.nr15.109.d: "[FROM.GetNameDef] has answered our request for judgment. We must now decide what to do with its support, its observers, or its opposition."
chaosx.nr15.109.a: "Accept support under clear limits."
chaosx.nr15.109.b: "Refuse support and preserve plural law."
chaosx.nr15.109.c: "Receive the observers under public rules."
chaosx.nr15.109.option_d: "Acknowledge opposition and reply openly."
chaosx_nr15_109_a_support_dependency_tt: "Accepting support raises Plenty by §G10§!, moves Choice versus Assignment §Y5§! toward Assignment, selects §YSponsored Law§!, and shortens the next capital store project by §G30 days§!. Once the constitutional route is settled, support also has a public consequence that depends on the route. The Consent of Households and Revision routes gain §GConcord +5§!, the Closed Island route loses §RConcord -5§! and moves a further §Y5§! toward Assignment, and the other routes gain §GPlenty +5§! and move a further §Y5§! toward Assignment."

chaosx.nr15.117.t: "The Perfect Island Before Its Shores"
chaosx.nr15.117.d: "Even before the constitution is settled, planners are drawing the boundary of a possible refuge. The opening design can connect willing harbors, seek bounded self-sufficiency, or prepare a closed order whose gates answer every shortage with discipline."
chaosx.nr15.117.a: "Prepare a network of willing refuges."
chaosx.nr15.117.b: "Prepare bounded self-sufficiency."
chaosx.nr15.117.c: "Prepare the closed order."
chaosx_nr15_117_a_refuge_preparation_tt: "Enables §YRefuge Network§! under a compatible constitutional route. The policy permits recurring intake terms that lower Need and raise Concord, then spend Plenty on settlement services and ease Maritime and Settlement pressure."
chaosx_nr15_117_b_bounded_preparation_tt: "Enables §YBounded Self-Sufficiency§! under a compatible constitutional route. The policy permits recurring reserve terms that raise Plenty and move Choice versus Assignment toward Assignment. Completing a term eases Provisioning pressure, and an insecure reserve lowers Concord."
chaosx_nr15_117_c_closed_preparation_tt: "Enables §YClosed Order§! and strengthens the closed interpretation under a compatible constitutional route. The policy permits recurring enforcement terms that raise Plenty and move Choice versus Assignment toward Assignment while lowering Concord. Weak Concord can end a term in revolt."

chaosx.nr15.110.t: "The Household Compact Abroad"
chaosx.nr15.110.d: "[FROM.GetNameDef] has formed a voluntary commonwealth of households, municipalities, and public stores. Its institutions ask neighbors to judge them by local assent, aid, and the promises they keep."
chaosx.nr15.110.a: "Partner with the household compact."
chaosx.nr15.110.b: "Watch whether its guarantees survive."
chaosx.nr15.110.c: "Oppose this foreign experiment."

chaosx.nr15.111.t: "The Common Tables Abroad"
chaosx.nr15.111.d: "[FROM.GetNameDef] has joined councils, workshops, and common stores under a congress of recallable delegates. Its trains carry aid and the example of common ownership."
chaosx.nr15.111.a: "Invite a mission from the common tables."
chaosx.nr15.111.b: "Observe the congress before choosing."
chaosx.nr15.111.c: "Oppose its influence among our workers."

chaosx.nr15.112.t: "The Planners' Commonwealth"
chaosx.nr15.112.d: "[FROM.GetNameDef] has linked housing, reserves, industry, and transport under a Board of Measure. Its engineers offer impressive works, and every schedule shows how much authority the planners hold."
chaosx.nr15.112.a: "Invite a technical mission."
chaosx.nr15.112.b: "Watch how the plan treats local judgment."
chaosx.nr15.112.c: "Oppose the spread of measured rule."

chaosx.nr15.113.t: "A Colonial Office Takes Notice"
chaosx.nr15.113.d: "The commonwealth of [FROM.GetName] speaks of Necessary Ground, local charters, and public status near territories under our administration. Its claims may support bargains, expose contradictions in our rule, or encourage resistance."
chaosx.nr15.113.a: "Bargain with the commonwealth."
chaosx.nr15.113.b: "Expose the hypocrisy in its own claims."
chaosx.nr15.113.c: "Oppose intrusion into our territory."

chaosx.nr15.114.t: "A Great Power Takes Notice"
chaosx.nr15.114.d: "The rise of [FROM.GetNameDef] has created a compact of stores, associates, and small states beyond our direction. We can sponsor it, guarantee it, observe it, or contain it."
chaosx.nr15.114.a: "Offer sponsorship under formal terms."
chaosx.nr15.114.b: "Extend a defensive guarantee."
chaosx.nr15.114.c: "Watch the compact without commitment."
chaosx.nr15.114.option_d: "Oppose a regional order we do not lead."

chaosx.nr15.115.t: "A Fellow Small State"
chaosx.nr15.115.d: "[FROM.GetNameDef] has shown that a small country can turn stores, municipal agreements, and mutual defense into regional influence. Its example offers partnership without requiring submission to a major patron."
chaosx.nr15.115.a: "Propose a technical partnership."
chaosx.nr15.115.b: "Join a common reserve compact."
chaosx.nr15.115.c: "Distrust another small state's promises."

chaosx.nr15.120.t: "The Commonwealth Dissolved"
chaosx.nr15.120.d: "The Founding Charter no longer governs the country. Its interpretation, offices, unfinished projects, and temporary authorities all end with it. Only a viable member of the League can carry the compact forward, and every surviving administration, practical institution, and copy of the manifesto now needs a place outside the fallen constitution."
chaosx.nr15.120.a: "Restore ordinary government."
chaosx.nr15.120.b: "Let a viable member lead the League."
chaosx.nr15.120.c: "Keep no commonwealth legacy."
utopia_manifesto_aftermath_dissolution_tt: "The Founding Charter and the chosen interpretation lose all authority. Their national spirits are removed, unfinished projects and public programs close, and their offices are dismissed. Ordinary government returns and any League led by the founder dissolves. Settlements for administered ground, practical institutions, and the manifesto still follow where eligible."
utopia_manifesto_aftermath_league_survival_tt: "The domestic Founding Charter and chosen interpretation lose all authority. Their national spirits are removed, unfinished projects and public programs close, and their offices are dismissed. A viable external member succeeds the founder as leader of the League, and every League member gains a Partnership opinion of that successor. If we lead a formal defense faction and the successor belongs to it, faction leadership passes to the successor and we leave the faction. Other compacts keep their members' post-founder ties. Domestic settlements still follow where eligible."
utopia_manifesto_aftermath_abandonment_tt: "The Founding Charter, the chosen interpretation, and the external League end. Their national spirits are removed, unfinished projects and public programs close, and their offices are dismissed. No Common Store, Garden District, or practical civic legacy can be preserved. Settlements for administered ground and the manifesto still follow where eligible."

chaosx.nr15.121.t: "What the Country Can Keep"
chaosx.nr15.121.d: "The chosen interpretation is ending, but some of its institutions still meet needs that outlasted it. The country can carry one practical legacy into ordinary government. Stores and districts qualify only if they actually exist."
chaosx.nr15.121.a: "Preserve the working common stores."
chaosx.nr15.121.b: "Preserve the working district network."
chaosx.nr15.121.c: "Keep only publicly reviewed institutions."
utopia_manifesto_aftermath_store_legacy_tt: "Keeps §YReliable Public Stores§!, the moderated form of the Common Store Network, as the country's only practical legacy. The former interpretation is not restored."
utopia_manifesto_aftermath_district_legacy_tt: "Keeps §YWorking Social Districts§!, the moderated form of the Garden District Network, as the country's only practical legacy. The former interpretation is not restored."
utopia_manifesto_aftermath_practical_legacy_tt: "Keeps §YInstitutions Under Review§!, the moderated form of the Practical Commonwealth, as the country's only practical legacy. The former interpretation is not restored."

chaosx.nr15.122.t: "The Administered Ground Returns"
chaosx.nr15.122.d: "Stewardship and Assigned Colony administrations end with the Founding Charter. Every state held through purchase, enforcement, lease, joint administration, or colonial rule must go back to the country it came from. The departure can bring plain independence, an equal reconstruction compact, or a public refusal of restitution."
chaosx.nr15.122.a: "Return all states as independent."
chaosx.nr15.122.b: "Return all states under an equal compact."
chaosx.nr15.122.c: "Return every state without restitution."
utopia_manifesto_aftermath_colony_independence_tt: "Ends stewardship and Assigned Colony rule. Territory gained by purchase, enforcement, or ultimatum returns to the partner it came from. Leases and joint administrations end, and Assigned Colonies return to the countries that rose against them. No reconstruction compact is made, and restitution is neither promised nor refused."
utopia_manifesto_aftermath_colony_compact_tt: "Returns territory on the same terms as independence. The affected countries become equal reconstruction partners and gain a Partnership opinion of us. Restitution is acknowledged."
utopia_manifesto_aftermath_colony_refusal_tt: "Returns territory on the same terms as independence but makes no reconstruction compact. The country publicly refuses restitution."

chaosx.nr15.123.t: "The Book Returns to Debate"
chaosx.nr15.123.d: "The manifesto has lost its constitutional authority. Its words can return to competing public editions, survive only in the country's history, or become a forbidden doctrine guarded by the state. None of these choices restores the former interpretation."
chaosx.nr15.123.a: "Return the book to public debate."
chaosx.nr15.123.b: "Keep the book as a reminder."
chaosx.nr15.123.c: "Ban the book and police its doctrine."
utopia_manifesto_aftermath_book_debate_tt: "Repudiates censorship and official dogma. Once ordinary government returns, a public edition grants §YThe Manifesto in Public Hands§! without restoring the former interpretation."
utopia_manifesto_aftermath_book_history_tt: "Keeps the manifesto in the country's history. Its national spirit and interpretation stay ended, and no public or dogmatic replacement is granted."
utopia_manifesto_aftermath_book_ban_tt: "Renews censorship. Once ordinary government returns, official dogma grants §YThe Book Made Doctrine§! without restoring the former interpretation."

chaosx.nr15.130.t: "Utopia Has Neighbors"
chaosx.nr15.130.d: "Member delegations, associates, and reserve councils have gathered beneath their own flags. The commonwealth has become a regional fact, and the final proclamation is ready for signatures."
chaosx.nr15.130.a: "Proclaim that Utopia has neighbors."

chaosx.nr15.160.t: "Utopia Has Neighbors"
chaosx.nr15.160.d: "Small states and associated places announce a regional commonwealth built around shared stores, reconstruction, and mutual defense. Members keep their flags, and common councils coordinate their promises."
chaosx.nr15.160.a: "The timetable has begun."

chaosx.nr15.161.t: "Necessary Ground at War"
chaosx.nr15.161.d: "A dispute over Necessary Ground has become a war. The commonwealth claims that material need gives it a right to conquest, and opposing governments reject the doctrine."
chaosx.nr15.161.a: "The claim will be answered in the field."

chaosx.nr15.162.t: "The Assigned Colonies Rise"
chaosx.nr15.162.d: "An Assigned Colony has revolted against compulsory labor, ration priority, and rule without local consent. Its uprising exposes the human cost of the Closed Island's order beyond its gates."
chaosx.nr15.162.a: "No assigned shore stays quiet forever."

chaosx.nr15.206.t: "A Settlement Charter from [FROM.GetNameDef]"
chaosx.nr15.206.d: "[FROM.GetNameDef] offers a settlement charter built on migration corridors, reciprocal local settlement, and public review. The agreement leaves territorial control unchanged and binds both governments to receive people and administer their settlement under written terms."
chaosx.nr15.206.a: "Accept the settlement charter."
chaosx.nr15.206.b: "Return the charter with conditions."
chaosx.nr15.206.c: "Refuse the settlement proposal."

chaosx.nr15.207.t: "The Association Comes Up for Review"
chaosx.nr15.207.d: "Our municipal association was written as a voluntary charter with authority remaining in each member. The review term has arrived, and the councils may renew their shared obligations across the commonwealth or withdraw from the compact."
chaosx.nr15.207.a: "Renew the voluntary association."
chaosx.nr15.207.b: "Withdraw from the association."
