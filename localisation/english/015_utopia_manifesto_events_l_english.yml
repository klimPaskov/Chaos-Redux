l_english:
chaosx.nr15.2.t: "The Public Edition"
chaosx.nr15.2.d: "The public edition has returned from the presses. Reading circles request copies, ministries request an approved commentary, and censors warn that an argument copied into every workshop cannot be recalled."
chaosx.nr15.2.a: "Let every reading room have a copy."
chaosx.nr15.2.b: "Circulate it through approved institutions."
chaosx.nr15.2.c: "Print a restricted edition under official supervision."

chaosx.nr15.3.t: "The First Account"
chaosx.nr15.3.d: "Surveyors have set the first account on the assembly table. It counts full granaries beside hungry districts, useful hands beside empty workshops, and transport routes that fail between them."
chaosx.nr15.3.a: "Publish every figure and correction."
chaosx.nr15.3.b: "Let the councils verify the account first."
chaosx.nr15.3.c: "Revise the figures before they become public."
chaosx.nr15.3.option_d: "The country will not be governed by this ledger."

chaosx.nr15.4.t: "The Interpretive Congress"
chaosx.nr15.4.d: "Delegates have filled the hall with five answers to the same question. Some trust households, some the common table, some exact measure, some sealed service, and a few insist the book was written to expose certainty itself."
chaosx.nr15.4.a: "Let each household keep the right to assent."
chaosx.nr15.4.b: "Place necessity at the common table."
chaosx.nr15.4.c: "Give the surveyors authority to measure."
chaosx.nr15.4.option_d: "One island must obey one measure."
chaosx.nr15.4.e: "The book should teach us how to doubt it."

chaosx.nr15.5.t: "The Storehouse Doors"
chaosx.nr15.5.d: "The first common store is ready to issue its stock, but the queue reaches beyond the square. Storekeepers can follow the schedule, prioritize the hungriest households, or close the doors while a missing consignment is investigated."
chaosx.nr15.5.a: "Open the doors in orderly sequence."
chaosx.nr15.5.b: "The households in greatest need come first."
chaosx.nr15.5.c: "Close the doors and account for every missing sack."

chaosx.nr15.6.t: "A Calling Left Empty"
chaosx.nr15.6.d: "A necessary calling has attracted too few volunteers. The empty places can be made bearable, shared by rotation, or filled by order."
chaosx.nr15.6.a: "Improve the terms and pay for training."
chaosx.nr15.6.b: "Rotate the duty among qualified hands."
chaosx.nr15.6.c: "Issue an assignment quota."

chaosx.nr15.7.t: "Promise and Provision"
chaosx.nr15.7.d: "A public guarantee has outgrown the goods behind it. The government must correct the promise, narrow it, or defend words that the storehouse cannot honor."
chaosx.nr15.7.a: "Publish the shortage and the correction."
chaosx.nr15.7.b: "Narrow the guarantee to what can be kept."
chaosx.nr15.7.c: "The promise stands. Revise the account."

chaosx.nr15.8.t: "The First Necessary Ground"
chaosx.nr15.8.d: "The survey records a serious lack that domestic works cannot quickly answer. Before any foreign ground is named necessary, the country must decide how openly it will state the case."
chaosx.nr15.8.a: "Publish the need, evidence, and peaceful remedies."
chaosx.nr15.8.b: "Exhaust another domestic review first."
chaosx.nr15.8.c: "Need itself grants a natural right."

chaosx.nr15.9.t: "The First Stewardship"
chaosx.nr15.9.d: "The first territory placed under stewardship waits for food, repairs, and a political future. The order in which those obligations are met will define what stewardship means."
chaosx.nr15.9.a: "Provision the population before all else."
chaosx.nr15.9.b: "Convene a local charter assembly."
chaosx.nr15.9.c: "Organize the territory as an Assigned Colony."

chaosx.nr15.10.t: "The Proof Is Read"
chaosx.nr15.10.d: "The stores, bounded center, and first external obligations have all been tested. Delegates have brought a final charter to the public chamber, while dissenters ask for more proof before the country takes a new name."
chaosx.nr15.10.a: "Ratify the commonwealth."
chaosx.nr15.10.b: "The country has more to prove."

chaosx.nr15.11.t: "Reading Rooms Multiply"
chaosx.nr15.11.d: "Copies of the manifesto carry annotations from farms, workshops, schools, and exile circles. The reading groups now ask whether their disagreements belong in public institutions."
chaosx.nr15.11.a: "Give the reading groups public rooms."
chaosx.nr15.11.b: "Bring the circles under institutional sponsorship."
chaosx.nr15.11.c: "Only an approved commentary may circulate."

chaosx.nr15.12.t: "Petitions of Property"
chaosx.nr15.12.d: "Petitions have arrived from tenants, smallholders, creditors, and councils as the inherited order is surveyed. The settlement can protect modest property, register compensation, open land to public claims, or proceed by seizure."
chaosx.nr15.12.a: "Protect homes, farms, and small workshops."
chaosx.nr15.12.b: "Open a public register of compensation."
chaosx.nr15.12.c: "Let councils petition for land in common trust."
chaosx.nr15.12.option_d: "Necessity leaves no claim to compensate."

chaosx.nr15.13.t: "The Doors Open"
chaosx.nr15.13.d: "The first reserve is full enough to open beyond emergency offices. How the doors open will determine whether provision appears as a right, a priority system, or an invitation to organized resistance."
chaosx.nr15.13.a: "Open distribution under published rules."
chaosx.nr15.13.b: "Give priority to the households in greatest need."
chaosx.nr15.13.c: "The boycott will not close a public store."

chaosx.nr15.15.t: "Empty Bins"
chaosx.nr15.15.d: "The bins are nearly empty and the guarantee remains on the wall. Officials propose a narrower promise, prosecution of diversion, emergency assignments, or an appeal to foreign partners."
chaosx.nr15.15.a: "Reduce the promise and publish the reason."
chaosx.nr15.15.b: "Find and prosecute the diversion."
chaosx.nr15.15.c: "Assign the labor needed to refill the stores."
chaosx.nr15.15.option_d: "Request foreign provision before hunger spreads."

chaosx.nr15.20.t: "A Calling No One Chooses"
chaosx.nr15.20.d: "A calling essential to food, transport, care, or defense still lacks hands. Its members describe hard conditions, poor housing, and a duty that has become a permanent burden."
chaosx.nr15.20.a: "Improve the work and its rewards."
chaosx.nr15.20.b: "Guarantee housing near the calling."
chaosx.nr15.20.c: "Rotate the service among trained hands."
chaosx.nr15.20.option_d: "Fill the vacancies by quota."

chaosx.nr15.21.t: "The Gifted Transfer"
chaosx.nr15.21.d: "A group of trained workers has volunteered to leave a comfortable calling for one in shortage. Their example can be celebrated as civic service or turned into a permanent fund for future transfers."
chaosx.nr15.21.a: "Publish their names and honor the transfer."
chaosx.nr15.21.b: "Turn their gift into a training fund."

chaosx.nr15.22.t: "Names Missing from the Register"
chaosx.nr15.22.d: "Inspectors find names missing from the calling register while quotas remain officially complete. Some workers have fled, some were never recorded, and some survive under the protection of local officials."
chaosx.nr15.22.a: "Negotiate their return under better terms."
chaosx.nr15.22.b: "Revise the quotas to match real capacity."
chaosx.nr15.22.c: "Punish evasion and those who shelter it."
chaosx.nr15.22.option_d: "Complete the register on paper."

chaosx.nr15.23.t: "Six Hours Under Pressure"
chaosx.nr15.23.d: "The six-hour day has reached its first severe shortage. The country can preserve the promise, suspend it openly, extend hours only where needed, or discard it as a luxury."
chaosx.nr15.23.a: "Preserve the short day and train more hands."
chaosx.nr15.23.b: "Suspend it until the stores recover."
chaosx.nr15.23.c: "Extend hours only in the strained callings."
chaosx.nr15.23.option_d: "A country in need has no six-hour day."

chaosx.nr15.30.t: "Grain Beyond Use"
chaosx.nr15.30.d: "Regional stores hold more grain than the current reserve plan requires, while neighboring districts and foreign partners report shortages. The excess can be preserved, rotated at home, given as aid, or traded for another need."
chaosx.nr15.30.a: "Keep the reserve above every promise."
chaosx.nr15.30.b: "Rotate the grain through household stores."
chaosx.nr15.30.c: "Send relief beyond the shore."
chaosx.nr15.30.option_d: "Trade the excess for what we lack."

chaosx.nr15.31.t: "Gold Without Honor"
chaosx.nr15.31.d: "Luxury stock sits behind guarded doors while public works ask for material and the common stores ask for money. Its value can serve provision, public life, political example, or the reserve balance."
chaosx.nr15.31.a: "Pledge it to finance common provision."
chaosx.nr15.31.b: "Turn it into clinics, schools, and public halls."
chaosx.nr15.31.c: "Open the vault and rebuke private display."
chaosx.nr15.31.option_d: "Keep a reserve that other states recognize."

chaosx.nr15.32.t: "The Hidden Market"
chaosx.nr15.32.d: "An unofficial market has grown beside the ration queue. It may reveal a need for lawful exchange, a failure in distribution, hidden privilege, or a crime against the common stock."
chaosx.nr15.32.a: "Permit limited exchange under public rules."
chaosx.nr15.32.b: "Repair distribution before punishing trade."
chaosx.nr15.32.c: "Audit the officials and favored buyers."
chaosx.nr15.32.option_d: "Close the market and prosecute every seller."

chaosx.nr15.40.t: "The District Chooses Its Shape"
chaosx.nr15.40.d: "Residents have assembled around the survey map. They ask whether the new district will grow food, house industry, connect the railways, center learning and care, or receive displaced families."
chaosx.nr15.40.a: "Build a market-garden municipality."
chaosx.nr15.40.b: "Join industrial housing to the workshops."
chaosx.nr15.40.c: "Make the district a rail and road junction."
chaosx.nr15.40.option_d: "Center the district on schools, clinics, and care."
chaosx.nr15.40.e: "Found a municipality for displaced households."

chaosx.nr15.41.t: "Houses Without Work"
chaosx.nr15.41.d: "The houses are complete, but the promised work has not arrived. Empty workshops and long commutes are turning a model district into a dormitory of disappointment."
chaosx.nr15.41.a: "Require every new project to name its calling."
chaosx.nr15.41.b: "Fund local workshops and repair halls."
chaosx.nr15.41.c: "Assign residents to the nearest necessary work."

chaosx.nr15.42.t: "Work Without Homes"
chaosx.nr15.42.d: "Factories and offices are hiring faster than the district can house their workers. Rents, overcrowding, and improvised lodgings now threaten the life the plan was meant to secure."
chaosx.nr15.42.a: "Build emergency housing under public rules."
chaosx.nr15.42.b: "Extend transport from existing homes."
chaosx.nr15.42.c: "Erect barracks beside the works."

chaosx.nr15.43.t: "The District Refuses the Plan"
chaosx.nr15.43.d: "The district assembly refuses the standardized plan. Residents say its roads ignore local trade, its housing ignores family life, and its public buildings were placed without a vote."
chaosx.nr15.43.a: "Revise the charter with the assembly."
chaosx.nr15.43.b: "Give local designers authority over the plan."
chaosx.nr15.43.c: "Impose the approved standard."
chaosx.nr15.43.option_d: "Abandon the district and account for the loss."

chaosx.nr15.44.t: "The Inland Island"
chaosx.nr15.44.d: "A landlocked country cannot put the bounded center behind a natural channel. Surveyors propose a ring of routes, gardens and waterworks, or defenses that can give the inland capital the functions of an island."
chaosx.nr15.44.a: "Make the railway ring its first boundary."
chaosx.nr15.44.b: "Join gardens and waterworks around the center."
chaosx.nr15.44.c: "Fortify every road into the ring."

chaosx.nr15.45.t: "The District Falls Short"
chaosx.nr15.45.survey.d: "The final survey of §Y[?utopia_manifesto_district_project_state.GetName]§! finds no district role that still matches both the state and the country's present needs. Population, infrastructure, building room, migration, housing, reserves, or a calling shortage changed before the review. The state is refused until the country decides whether to publish and reopen the shortfall, close the survey, or impose a timetable without a viable role."
chaosx.nr15.45.obligations.d: "Construction in §Y[?utopia_manifesto_district_project_state.GetName]§! reaches review with at least one live housing, transport, or role-plan obligation unmet. The district remains surveyed, but the works are incomplete. Until a suitable role is recommitted, the state carries §R-5%§! Local Supplies, §R-10%§! Building Construction Speed, and §R+5%§! Resistance Target."
chaosx.nr15.45.a: "Publish the shortfall and open a public remedy.\n§GConcord +15§!  §GAssignment -10§!\nA failed survey is reopened. An incomplete district records a remediation pledge and remains available for a suitable recommitment."
chaosx.nr15.45.b: "Reduce the district's promised scope.\n§RNeed +10§!  §GPlenty +10§!  §RConcord -10§!\nA failed survey closes without reopening. An incomplete district remains delayed until another suitable role is chosen."
chaosx.nr15.45.c: "Impose the timetable and leave the dispute unresolved.\n§GNeed -10§!  §RConcord -20§!  §RAssignment +20§!\nA failed survey closes without reopening. The coercive conduct and unresolved obligation dispute remain on the public record."

chaosx.nr15.46.t: "The Assigned Charter Is Challenged"
chaosx.nr15.46.d: "The Closed Island charter in §Y[?utopia_manifesto_district_project_state.GetName]§! has tied homes, stores, and service to an assigned conduct code. Its first settlement grants §G+10%§! Local Supplies while imposing §R+8%§! Resistance Target, §GPlenty +5§!, §RConcord -5§!, and §RAssignment +10§!. Residents demand appeals, outside observation, or an admission that the charter rests on compulsion."
chaosx.nr15.46.a: "Fund appeals and rewrite the conduct rules.\n£pol_power §R40§!  §GConcord +20§!  §GAssignment -15§!\nLocal Resistance Target falls from §R+8%§! to §R+3%§!. Neighboring states record wary relations."
chaosx.nr15.46.b: "Station permanent observers and admit the breach.\n§RPlenty -15§!  §GConcord +15§!  §GAssignment -10§!\nLocal Resistance Target falls from §R+8%§! to §R+3%§!. Neighboring states record partnership."
chaosx.nr15.46.c: "Keep the assigned charter and suppress the appeal.\n§GPlenty +10§!  §RConcord -20§!  §RAssignment +20§!\nThe §R+8%§! Resistance Target remains. Neighboring states record opposition, and the coercive dispute stays unresolved."

chaosx.nr15.47.t: "The Rolls of Penal Works"
chaosx.nr15.47.d: "The first labor rolls from §Y[?utopia_manifesto_penal_works_project_state.GetName]§! carry household names beside quotas, guards, and construction assignments. Five hundred civilians have already died and entered the Deaths ledger under camps and forced labor. The method grants §G+25%§! Building Construction Speed and substitutes for the role-plan obligation while imposing §R-10%§! Local Supplies, §R+25%§! Required Garrisons, and an initial §R+12%§! Resistance Target. Its opening order also changes the Ledger by §GNeed -3§!, §GPlenty +3§!, §RConcord -10§!, and §RAssignment +10§!, while neighboring states become wary. If the district completes under Penal Works, another 1,000 civilian deaths enter the Deaths ledger before the labor columns are dismissed. The coercive conduct remains part of the country's history under every response."
chaosx.nr15.47.a: "Publish every roll and place the work under supervision.\n§GConcord +10§!  §GAssignment -10§!\nPenal Works remains active. Local Resistance Target becomes §R+8%§!."
chaosx.nr15.47.b: "Admit foreign inspectors to the worksite.\n§RPlenty -15§!  §GConcord +15§!  §GAssignment -10§!\nPenal Works remains active. Local Resistance Target becomes §R+8%§!, and neighboring states record partnership."
chaosx.nr15.47.c: "Harden the timetable and suppress every refusal.\n§GPlenty +10§!  §RConcord -15§!  §RAssignment +15§!\nPenal Works remains active. Local Resistance Target becomes §R+18%§!, and neighboring states record opposition."
chaosx.nr15.47.option_d: "Halt the labor columns and accept the unfinished timetable.\n§GConcord +5§!  §GAssignment -5§!\nThe district must meet its role plan by ordinary means. Neighboring states welcome the halt. The 500 civilian deaths and the coercion remain part of the country's history."

chaosx.nr15.50.t: "The Case Is Made"
chaosx.nr15.50.d: "The inquiry has assembled the deficit, the target ground, domestic alternatives, and the conduct expected after any agreement. The case can be made public, tested independently, or declared beyond further question."
chaosx.nr15.50.a: "Publish the case and every assumption."
chaosx.nr15.50.b: "Submit it to independent review."
chaosx.nr15.50.c: "The survey is sufficient authority."

chaosx.nr15.51.t: "A Domestic Alternative"
chaosx.nr15.51.d: "A domestic alternative can answer the need without foreign ground, though it demands time and investment. The government must close the case, revise it honestly, suppress the finding, or dismiss the alternative as inadequate."
chaosx.nr15.51.a: "Close the case and build at home."
chaosx.nr15.51.b: "Revise the claim around the remaining need."
chaosx.nr15.51.c: "The alternative report will not circulate."
chaosx.nr15.51.option_d: "It is too slow to answer necessity."

chaosx.nr15.52.t: "The Counteroffer"
chaosx.nr15.52.d: "The foreign government has answered with terms short of our first request. Its counteroffer may satisfy the real need, invite another revision, or be refused as an evasion."
chaosx.nr15.52.a: "Accept the terms that answer the need."
chaosx.nr15.52.b: "Revise the proposal once more."
chaosx.nr15.52.c: "Reject the counteroffer."

chaosx.nr15.53.t: "Petition from the Ground"
chaosx.nr15.53.d: "Residents of the necessary ground have sent a petition describing their own shortages, institutions, and desired status. They ask to be treated as parties to the settlement."
chaosx.nr15.53.a: "Draft a local charter with their delegates."
chaosx.nr15.53.b: "Promise a public status vote."
chaosx.nr15.53.c: "Hear the competing petitions before deciding."
chaosx.nr15.53.option_d: "The case concerns ground, not petitioners."

chaosx.nr15.54.t: "When Need Recedes"
chaosx.nr15.54.d: "The published term has ended, or the recorded deficit no longer supports the case. Its ultimatum and every private warrant have already lapsed. The country may renounce the case or ask the named partner to replace it with a bounded treaty. Only while the original need and relevant ground still survive may the case continue under a shorter deadline and a public political cost."
chaosx.nr15.54.a: "Renounce the obsolete claim."
chaosx.nr15.54.b: "Replace the claim with a limited treaty."
chaosx.nr15.54.c: "Continue the still-relevant case under public penalty."
chaosx.nr15.54.a.tt: "Ends the exact case, removes every remaining case warrant, restores any temporary stewardship, and records a public renunciation before the target and state record is cleared."
chaosx.nr15.54.b.tt: "Asks the recorded partner to replace the suspended case with a bounded long-supply contract, settlement agreement, or lease appropriate to the selected ground. The partner may accept or refuse. No ownership, core, claim, or wargoal is created by the offer."
chaosx.nr15.54.c.tt: "Available only while the original deficit and relevant target or state remain valid. The old ultimatum and wargoal stay removed. Case integrity, local support, and Concord fall, Assignment rises, and a shorter expiry term begins."

chaosx.nr15.55.t: "The Natural Right Hardens"
chaosx.nr15.55.d: "Officials now speak of Necessary Ground as a standing doctrine rather than an exceptional case. The country can restore the peaceful ladder, retain a hard review, or proclaim need itself a title."
chaosx.nr15.55.a: "Return every case to peaceful proof."
chaosx.nr15.55.b: "Keep a hard doctrine under formal review."
chaosx.nr15.55.c: "Need is the natural right of the commonwealth."

chaosx.nr15.60.t: "Stores Arrive First"
chaosx.nr15.60.d: "Supply columns have reached the administered territory before its political settlement. The stores can distribute through common institutions or place local authorities in charge."
chaosx.nr15.60.a: "Open distribution through the common stores."
chaosx.nr15.60.b: "Let local institutions direct the issue."

chaosx.nr15.61.t: "Soldiers Arrive First"
chaosx.nr15.61.d: "Soldiers arrived before enough food, medicine, and repair stock. The administration can prioritize civilian provision, share military rations, or preserve the army's supply at the population's expense."
chaosx.nr15.61.a: "Divert stores to emergency provision."
chaosx.nr15.61.b: "Put soldiers and households on the same ration."
chaosx.nr15.61.c: "The army must remain supplied first."

chaosx.nr15.62.t: "The Charter Assembly"
chaosx.nr15.62.d: "The provisional charter assembly is ready. It can establish an elected municipality, a worker council, a planning board, an autonomy compact, or an Assigned Colony."
chaosx.nr15.62.a: "Seat an elected municipality."
chaosx.nr15.62.b: "Convene a council of workers and callings."
chaosx.nr15.62.c: "Place the territory under a planning board."
chaosx.nr15.62.option_d: "Write an autonomy compact."
chaosx.nr15.62.e: "Register the territory as an Assigned Colony."

chaosx.nr15.63.t: "The Status Vote"
chaosx.nr15.63.d: "The charter period has ended, and residents are assembled to choose a durable status. The ballot is constrained by the public record: provision and local support, the place's ties to its existing country, wartime damage, any history of imposed administration, and the conduct of our chosen institutions."
chaosx.nr15.63.a: "Offer integration through a public vote."
chaosx.nr15.63.b: "Form an associated partnership."
chaosx.nr15.63.c: "Recognize independence with an autonomy pact."
chaosx.nr15.63.option_d: "Return the stewardship."
chaosx.nr15.63.a.tt: "Requires exceptional case integrity and local support, completed stewardship proof, no repression record or unresolved war damage, and a route that can honor a public integration vote. It authorizes the long integration mission. No territory or core changes immediately."
chaosx.nr15.63.b.tt: "Requires strong integrity and local support. Ratification returns the state, preserves its institutions under an association charter, creates only attributed access and guarantee relations, and adds the partner to the external network with a right of later review."
chaosx.nr15.63.c.tt: "Requires a valid partner and sufficient local support. Ratification returns the state, recognizes an independent government, and creates a distinct autonomy pact with an attributed defensive guarantee but no access or annexation."
chaosx.nr15.63.option_d.tt: "Returns the state without a continuing association or defense pact, records peaceful renunciation, and ends every stewardship obligation."

chaosx.nr15.64.t: "The Colony Revolts"
chaosx.nr15.64.d: "The colony has risen against assigned labor, ration priority, and rule without local assent. The state may recognize independence, negotiate association, repress the revolt, or accept outside mediation."
chaosx.nr15.64.a: "Recognize independence and end the assignment."
chaosx.nr15.64.b: "Negotiate a free association."
chaosx.nr15.64.c: "Suppress the revolt."
chaosx.nr15.64.option_d: "Invite foreign mediation."

chaosx.nr15.70.t: "The First Invitation"
chaosx.nr15.70.d: "The first foreign government has asked what membership in the commonwealth would require. We can offer full participation, observation, or a narrower reserve compact."
chaosx.nr15.70.a: "Invite them into the commonwealth."
chaosx.nr15.70.b: "Offer observer status and technical exchange."
chaosx.nr15.70.c: "Begin with a reserve compact."

chaosx.nr15.71.t: "The Stores Are Tested"
chaosx.nr15.71.d: "A partner has called upon the common reserve during a severe shortage. The answer will reveal whether the compact is a shared obligation or a favorable-weather declaration."
chaosx.nr15.71.a: "Release the full aid promised."
chaosx.nr15.71.b: "Send what the stores can spare."
chaosx.nr15.71.c: "Our own guarantees come first."
chaosx.nr15.71.option_d: "Aid will come with new conditions."

chaosx.nr15.72.t: "The Sponsor's Answer"
chaosx.nr15.72.d: "[FROM.GetNameDef] has accepted a bounded place in the League. The package it chose has been entered in the public record, with no authority over member governments and no military obligation beyond the terms it expressly offered."
chaosx.nr15.72.a: "Enter the accepted terms in the League record."

chaosx.nr15.73.t: "A Dispute Among Small Places"
chaosx.nr15.73.d: "Two members dispute a reserve contribution and the route of an aid convoy. Households, councils, experts, stewards, or a plural panel can settle the matter."
chaosx.nr15.73.a: "Put the dispute to household votes."
chaosx.nr15.73.b: "Convene a congress of member councils."
chaosx.nr15.73.c: "Submit the accounts to technical arbitration."
chaosx.nr15.73.option_d: "Issue a binding stewardship order."
chaosx.nr15.73.e: "Form a panel with every side represented."

chaosx.nr15.74.t: "The League Becomes a Mask"
chaosx.nr15.74.d: "A partner says the commonwealth has become a mask for our command. We can restore its autonomy, rewrite the compact, or admit that the mask is useful."
chaosx.nr15.74.a: "Restore the powers promised to the member."
chaosx.nr15.74.b: "Rewrite the compact with every delegation."
chaosx.nr15.74.c: "The commonwealth needs one directing hand."

chaosx.nr15.80.t: "The Citizen Watch Holds"
chaosx.nr15.80.d: "The citizen watch held a storehouse through bombardment and disorder. Its volunteers ask whether the watch will be honored as a permanent institution or return to ordinary callings."
chaosx.nr15.80.a: "Honor the watch that defended the stores."
chaosx.nr15.80.b: "Return the volunteers to their callings."

chaosx.nr15.81.t: "Engineers Save the Route"
chaosx.nr15.81.d: "Engineer companies restored a broken supply route before the army could replace it. Their work can be commemorated or expanded into a lasting national institution."
chaosx.nr15.81.a: "Honor the engineers who kept the road open."
chaosx.nr15.81.b: "Expand the engineer service."

chaosx.nr15.82.t: "The Auxiliary Bill"
chaosx.nr15.82.d: "The auxiliary force has presented its bill in equipment, pay, privileges, and political concessions. The state can pay, equip, grant limited autonomy, or postpone the settlement."
chaosx.nr15.82.a: "Pay the contract in full."
chaosx.nr15.82.b: "Settle the account with equipment."
chaosx.nr15.82.c: "Grant limited autonomy under our command."
chaosx.nr15.82.option_d: "Promise a settlement after the emergency."

chaosx.nr15.83.t: "Casualties Beyond the Island"
chaosx.nr15.83.d: "Reports list foreign auxiliaries killed in an operation that spared citizen formations. The country can review how they were used, offer citizenship, or keep the losses outside the public account."
chaosx.nr15.83.a: "Open a public service and casualty review."
chaosx.nr15.83.b: "Offer citizenship to those who remain."
chaosx.nr15.83.c: "Their losses were part of the contract."

chaosx.nr15.84.t: "The Contract Breaks"
chaosx.nr15.84.d: "The auxiliary contract is breaking under unpaid obligations, divided command, and foreign pressure. Renegotiation, regular integration, organized defection, or mutiny now stand close together."
chaosx.nr15.84.a: "Renegotiate while command still holds."
chaosx.nr15.84.b: "Integrate vetted formations into the regular army."
chaosx.nr15.84.c: "Prepare for organized defections."
chaosx.nr15.84.option_d: "Crush the mutiny before it spreads."

chaosx.nr15.90.t: "The Promise Outruns the Stores"
chaosx.nr15.90.d: "The common stores can no longer keep every guarantee printed in the founding charter. The country must narrow the promise, reorder distribution, or preserve a promise the shelves cannot honor."
chaosx.nr15.90.a: "Limit the guarantee to what the stores can sustain."
chaosx.nr15.90.b: "Reorder distribution around the deepest need."
chaosx.nr15.90.c: "Keep the guarantee and conceal the empty bins."

chaosx.nr15.91.t: "The Survey Becomes Scripture"
chaosx.nr15.91.d: "The Board of Measure has begun treating disputed surveys as disobedience. Appeals are delayed, local records are ignored, and corrections vanish from the public account."
chaosx.nr15.91.a: "Restore independent appeals."
chaosx.nr15.91.b: "Let local institutions review the data."
chaosx.nr15.91.c: "The survey is the country's scripture."

chaosx.nr15.92.t: "The Councils Cannot Decide"
chaosx.nr15.92.d: "The councils cannot agree on production, reserve release, or the transfer of workers between callings. Every delegate claims a mandate, and the stores are paying for the deadlock."
chaosx.nr15.92.a: "Grant the congress an emergency mandate."
chaosx.nr15.92.b: "Put the dispute to household referendums."
chaosx.nr15.92.c: "No council will surrender its mandate."

chaosx.nr15.93.t: "The Household Cannot Leave"
chaosx.nr15.93.d: "A household that wishes to leave an assigned calling has been refused housing, ration priority, and municipal transfer. The charter's promise of lawful exit now faces its plainest test."
chaosx.nr15.93.a: "Guarantee the household's right to leave."
chaosx.nr15.93.b: "Review the relocation and placement rules."
chaosx.nr15.93.c: "No household leaves its service."
chaosx.nr15.93.option_d: "Move the household where its service is assigned."

chaosx.nr15.94.t: "The Island Needs Another Shore"
chaosx.nr15.94.d: "The Closed Island has completed its first external case and discovered that separation still depends on foreign routes, labor, or ground. The regime can admit the dependence, revise its reserves, or deny the contradiction."
chaosx.nr15.94.a: "Admit what the island still needs."
chaosx.nr15.94.b: "Rebuild the reserve plan around the dependency."
chaosx.nr15.94.c: "The island is self-sufficient by decree."

chaosx.nr15.95.t: "The Book Cannot Be Questioned"
chaosx.nr15.95.d: "Official commentators have begun treating criticism of the manifesto as hostility to the state. The government can protect dissent, authorize one commentary, or declare the text beyond dispute."
chaosx.nr15.95.a: "Protect the right to criticize the book."
chaosx.nr15.95.b: "Publish an official commentary."
chaosx.nr15.95.c: "The manifesto is no longer a question."

chaosx.nr15.200.t: "Offer of Long Supply"
chaosx.nr15.200.d: "[FROM.GetNameDef] offers a long-term supply agreement for the resource or goods named in its Necessary Ground case. The proposal promises regular deliveries in exchange for payment and public guarantees."
chaosx.nr15.200.a: "Accept the long-term supply agreement."
chaosx.nr15.200.b: "Return a counteroffer."
chaosx.nr15.200.c: "Refuse the arrangement."

chaosx.nr15.201.t: "Request for a Lease"
chaosx.nr15.201.d: "[FROM.GetNameDef] requests a lease over the ground or facilities named in its case. The lease would preserve our sovereignty while granting defined access under a fixed term."
chaosx.nr15.201.a: "Accept the lease under published terms."
chaosx.nr15.201.b: "Return a narrower lease proposal."
chaosx.nr15.201.c: "Refuse the lease."

chaosx.nr15.202.t: "A Joint Administration"
chaosx.nr15.202.d: "[FROM.GetNameDef] proposes a joint administration over the place named in its case. Shared officials would manage access, provision, and accounts while both states retain a public voice."
chaosx.nr15.202.a: "Accept joint administration."
chaosx.nr15.202.b: "Return a revised division of authority."
chaosx.nr15.202.c: "Refuse shared rule."

chaosx.nr15.203.t: "An Association Proposed"
chaosx.nr15.203.d: "[FROM.GetNameDef] offers association in place of annexation or direct rule. The compact would join stores and obligations while preserving our government and a defined right of withdrawal."
chaosx.nr15.203.a: "Accept the association."
chaosx.nr15.203.b: "Return terms that better protect our autonomy."
chaosx.nr15.203.c: "Refuse the compact."

chaosx.nr15.204.t: "An Ultimatum from Utopia"
chaosx.nr15.204.d: "[FROM.GetNameDef] declares that its material need grants a final claim over our ground. Compliance is demanded before the published deadline, with force promised after refusal."
chaosx.nr15.204.a: "Submit to the ultimatum."
chaosx.nr15.204.b: "Refuse the claim."

chaosx.nr15.210.t: "An Invitation from the Commonwealth"
chaosx.nr15.210.d: "[FROM.GetNameDef] invites us to join a compact of stores, reconstruction, arbitration, and mutual defense. Full membership would carry shared obligations while preserving our government and formal sovereignty."
chaosx.nr15.210.a: "Join the commonwealth as a full member."
chaosx.nr15.210.b: "Accept observer status."
chaosx.nr15.210.c: "Join only the reserve compact."
chaosx.nr15.210.option_d: "Refuse the invitation."
chaosx.nr15.210.e: "Request a defense guarantee before joining."

chaosx.nr15.211.t: "A Reserve Compact"
chaosx.nr15.211.d: "[FROM.GetNameDef] proposes a narrower compact for emergency stores, reconstruction deliveries, and public contributions. It offers practical cooperation without full political membership."
chaosx.nr15.211.a: "Join the reserve compact."
chaosx.nr15.211.b: "Keep our stores outside it."

chaosx.nr15.215.t: "A Request from the Commonwealth League"
chaosx.nr15.215.d: "[FROM.GetNameDef] asks us to sponsor its compact of smaller places. We may send engineers and credit without assuming a defense obligation, offer a formal guarantee on terms we choose, or refuse the request entirely. No place in the League exists unless we consent to it here."
chaosx.nr15.215.a: "Offer technical sponsorship without a guarantee."
chaosx.nr15.215.b: "Offer sponsorship backed by our guarantee."
chaosx.nr15.215.c: "Refuse the sponsorship request."

chaosx.nr15.217.t: "The Founder Breaks the Charter"
chaosx.nr15.217.d: "[FROM.GetNameDef], which promised to preserve our government and sovereignty, has made war upon us. The League charter gives us no duty to remain under a founder that attacks its own member. We may leave at once or keep our seat while the breach is judged in the League's public record."
chaosx.nr15.217.a: "Leave the League. The charter has been broken."
chaosx.nr15.217.b: "Remain for now, but record the founder's breach."

chaosx.nr15.213.t: "The Island Lease Comes Due"
chaosx.nr15.213.d: "[FROM.GetNameDef] asks us to extend the published lease over our island. Its harbor, stores, and defenses remain our property even while the commonwealth controls them, and every permanent work will stay with the state when control returns. We may grant three further years, offer a narrower two-year term, or let the original agreement expire."
chaosx.nr15.213.a: "Extend the public lease for three years."
chaosx.nr15.213.b: "Offer two years and no more."
chaosx.nr15.213.c: "The island returns when the term ends."

chaosx.nr15.219.t: "A Claim Becomes an Agreement"
chaosx.nr15.219.d: "[FROM.GetNameDef] has suspended the Necessary Ground case it recorded against us and withdrawn every ultimatum and private warrant. It now offers a bounded agreement suited to the named place: regular supply where goods were at issue, a settlement charter where housing was at issue, or a fixed lease where access and defense were at issue. Our ownership and sovereignty remain unchanged unless we separately accept the published terms."
chaosx.nr15.219.a: "Accept the limited agreement."
chaosx.nr15.219.b: "A lapsed case creates no treaty obligation."

chaosx.nr15.100.t: "Glosses in the Margin"
chaosx.nr15.100.d: "Annotations have outgrown the private margins. Schools, councils, households, and exiles now defend organized readings of the book, and the right to revise it has become an institution in its own right."
chaosx.nr15.100.a: "Open schools of interpretation."
chaosx.nr15.100.b: "Place the schools under public charters."
chaosx.nr15.100.c: "Censor the margins before they become factions."

chaosx.nr15.101.t: "Necessary Shores"
chaosx.nr15.101.d: "Migration, blockade, and crowded districts have carried the question of need to the shore. Surveyors must decide whether domestic alternatives, peaceful offers, or emergency power will define the next case."
chaosx.nr15.101.a: "Exhaust domestic alternatives first."
chaosx.nr15.101.b: "Make peaceful offers before every demand."
chaosx.nr15.101.c: "Authorize emergency powers for severe need."

chaosx.nr15.102.t: "Cities of One Measure"
chaosx.nr15.102.d: "The settlement plan has crossed municipal and national boundaries. Linked cities now ask whether they will preserve local charters, accept a common standard, or form an outward circle of influence."
chaosx.nr15.102.a: "Let every city keep its charter."
chaosx.nr15.102.b: "Join the cities under one measured standard."
chaosx.nr15.102.c: "Build a foreign circle of planned cities."

chaosx.nr15.103.t: "Nowhere Made Law"
chaosx.nr15.103.d: "Foreign governments now treat the manifesto as a legal identity claimed by partners, movements, sponsors, and rivals. The commonwealth must decide whether that identity remains plural, sponsored, or tied to one official route."
chaosx.nr15.103.a: "Let many constitutions bear the name."
chaosx.nr15.103.b: "Accept sponsorship under written limits."
chaosx.nr15.103.c: "Make our interpretation the regional law."

chaosx.nr15.104.t: "The Perfect Island"
chaosx.nr15.104.d: "Regional order is failing around the bounded center. The state can spread refuge through willing places, pursue self-sufficiency within limits, or seal a compulsory island against the world."
chaosx.nr15.104.a: "Build a network of willing refuges."
chaosx.nr15.104.b: "Pursue bounded self-sufficiency."
chaosx.nr15.104.c: "Close the gates and complete the order."

chaosx.nr15.105.t: "The Margins Enter the Survey"
chaosx.nr15.105.d: "Annotated copies of the Manifesto have reached the survey schools before the founding congress. Teachers, delegates, and household witnesses must decide whether rival readings will remain open, receive public charters, or be suppressed before the constitution is chosen."
chaosx.nr15.105.a: "Open every margin to public challenge."
chaosx.nr15.105.b: "Give the schools measured public charters."
chaosx.nr15.105.c: "Close the margins before they divide the survey."

chaosx.nr15.106.t: "Necessary Shores Before the Charter"
chaosx.nr15.106.d: "The completed survey has identified shortages that may become claims upon land and transport. Before a constitutional route is chosen, the delegates must decide whether domestic repair, an ordered ladder of peaceful offers, or emergency warrants will govern every Necessary Ground case."
chaosx.nr15.106.a: "Prove the domestic alternative first."
chaosx.nr15.106.b: "Bind every case to the peaceful ladder."
chaosx.nr15.106.c: "Reserve emergency warrants for severe need."
chaosx_nr15_106_a_domestic_alternative_tt: "Records §YDomestic Alternatives§!. Necessary Ground cases will permit paid repair terms that strengthen case integrity and local support before easing the affected calling shortage and lowering Need."
chaosx_nr15_106_b_peaceful_ladder_tt: "Records §YPeaceful Priority§!. Necessary Ground cases must preserve the order of purchase, lease, settlement, joint administration, and association. Paid bargaining terms strengthen integrity and local support, then raise Concord and move Choice versus Assignment toward Choice."
chaosx_nr15_106_c_emergency_warrant_tt: "Records §YEmergency Powers§!. Severe cases will permit costly warrants that exchange integrity and Concord for speed, stronger local enforcement, and movement toward Assignment. Their completion creates foreign opposition."

chaosx.nr15.107.t: "Cities Before One Measure"
chaosx.nr15.107.d: "The first districts already share workshops, transport, and public accounts, while a foreign municipality watches the experiment. Their opening compact can preserve local charters, adopt one linked standard, or invite an outward circle of planned cities."
chaosx.nr15.107.a: "Let each city renew its own charter."
chaosx.nr15.107.b: "Link the districts under one public measure."
chaosx.nr15.107.c: "Invite a foreign municipal circle."

chaosx.nr15.108.t: "A Manifesto Seeks Our Judgment"
chaosx.nr15.108.d: "[FROM.GetNameDef] has asked us to judge whether its public stores and planned districts deserve support before the commonwealth is formally constituted. A promise of aid may shape its law, scrutiny may preserve our distance, and open opposition may turn its doctrine against us."
chaosx.nr15.108.a: "Offer support under written terms."
chaosx.nr15.108.b: "Send observers without committing aid."
chaosx.nr15.108.c: "Oppose this doctrine before it spreads."

chaosx.nr15.109.t: "The Observer Answers"
chaosx.nr15.109.d: "[FROM.GetNameDef] has returned its judgment. Its answer will determine whether outside support becomes a written obligation, whether observers enter the public accounts, or whether foreign opposition hardens one interpretation into regional law."
chaosx.nr15.109.a: "Accept the support and write its limits into law."
chaosx.nr15.109.b: "Refuse the support and preserve plural law."
chaosx.nr15.109.c: "Receive the observers under public rules."
chaosx.nr15.109.option_d: "Record the opposition and answer it openly."
chaosx_nr15_109_a_support_dependency_tt: "Accepting support raises Plenty by §G10§!, moves Choice versus Assignment §Y5§! toward Assignment, selects §YSponsored Law§!, and shortens the next capital store project by §G30 days§!. Once the constitutional route is settled, the support will also produce one of these public consequences: Concord §G+5§!, or Plenty §G+5§! and a further §Y5§! toward Assignment, or Concord §R-5§! and a further §Y5§! toward Assignment."

chaosx.nr15.117.t: "The Perfect Island Before Its Shores"
chaosx.nr15.117.d: "Even before the constitution is settled, planners are drawing the boundary of a possible refuge. The opening design may connect willing harbors, seek bounded self-sufficiency, or prepare a closed order whose gates answer every shortage with discipline."
chaosx.nr15.117.a: "Prepare a network of willing refuges."
chaosx.nr15.117.b: "Prepare bounded self-sufficiency."
chaosx.nr15.117.c: "Prepare the closed order."
chaosx_nr15_117_a_refuge_preparation_tt: "Records §YRefuge Network§! and an open interpretation for use when the constitutional route can support it. The policy permits recurring intake obligations that lower Need and raise Concord before settlement services consume Plenty and ease Maritime and Settlement pressure."
chaosx_nr15_117_b_bounded_preparation_tt: "Records §YBounded Self-Sufficiency§! for use when the constitutional route can support it. The policy permits recurring reserve terms that raise Plenty and move Choice versus Assignment toward Assignment before the live reserve is tested."
chaosx_nr15_117_c_closed_preparation_tt: "Records §YClosed Order§! and strengthens the closed interpretation for use when the constitutional route can support it. The policy permits recurring enforcement terms that raise Plenty and move Choice versus Assignment toward Assignment while lowering Concord. Weak Concord can end a term in revolt."

chaosx.nr15.110.t: "The Household Compact Abroad"
chaosx.nr15.110.d: "[FROM.GetNameDef] has formed a voluntary commonwealth of households, municipalities, and public stores. Its institutions ask neighbors to judge them by local assent, aid, and the promises they keep."
chaosx.nr15.110.a: "Seek partnership with the household compact."
chaosx.nr15.110.b: "Watch whether its guarantees survive."
chaosx.nr15.110.c: "Oppose this foreign experiment."

chaosx.nr15.111.t: "The Common Tables Abroad"
chaosx.nr15.111.d: "[FROM.GetNameDef] has joined councils, workshops, and common stores under a congress of recallable delegates. Its trains carry both aid and the example of common ownership."
chaosx.nr15.111.a: "Invite a mission from the common tables."
chaosx.nr15.111.b: "Observe the congress before choosing."
chaosx.nr15.111.c: "Oppose its influence among our workers."

chaosx.nr15.112.t: "The Planners' Commonwealth"
chaosx.nr15.112.d: "[FROM.GetNameDef] has linked housing, reserves, industry, and transport under a Board of Measure. Its engineers offer impressive works, while every schedule reveals the authority granted to planners."
chaosx.nr15.112.a: "Invite a technical mission."
chaosx.nr15.112.b: "Watch how the plan treats local judgment."
chaosx.nr15.112.c: "Oppose the spread of measured rule."

chaosx.nr15.113.t: "A Colonial Office Takes Notice"
chaosx.nr15.113.d: "The commonwealth of [FROM.GetName] speaks of Necessary Ground, local charters, and public status near territories under our administration. Its language may support bargains, expose our record, or encourage resistance."
chaosx.nr15.113.a: "Bargain with the commonwealth while we can."
chaosx.nr15.113.b: "Expose the hypocrisy in its own claims."
chaosx.nr15.113.c: "Oppose every intrusion into our administration."

chaosx.nr15.114.t: "A Great Power Takes Notice"
chaosx.nr15.114.d: "The rise of [FROM.GetNameDef] has created a compact of stores, associates, and small states beyond our direction. We can sponsor it, guarantee it, observe it, or contain it."
chaosx.nr15.114.a: "Offer sponsorship under formal terms."
chaosx.nr15.114.b: "Extend a defensive guarantee."
chaosx.nr15.114.c: "Watch the compact without commitment."
chaosx.nr15.114.option_d: "Oppose a regional order we do not lead."

chaosx.nr15.115.t: "A Fellow Small State"
chaosx.nr15.115.d: "[FROM.GetNameDef] has shown that a small country can turn stores, municipal agreements, and mutual defense into regional influence. Its example offers partnership without requiring submission to a major patron."
chaosx.nr15.115.a: "Propose a technical partnership."
chaosx.nr15.115.b: "Join a common reserve compact."
chaosx.nr15.115.c: "Remain wary of another small state's promises."

chaosx.nr15.120.t: "The Commonwealth Dissolved"
chaosx.nr15.120.d: "The Founding Charter no longer commands the country. Whichever settlement we choose, its chosen interpretation, public offices, unfinished undertakings, and temporary authorities will end. Only a viable external League member can carry the compact beyond its founder. Before the last accounts are sealed, every surviving administration, practical institution, and copy of the Manifesto must find its place outside the fallen constitution."
chaosx.nr15.120.a: "Restore ordinary government and settle what remains."
chaosx.nr15.120.b: "Entrust the League to a viable external member."
chaosx.nr15.120.c: "Preserve no practical commonwealth legacy."
utopia_manifesto_aftermath_dissolution_tt: "The Founding Charter and chosen interpretation lose all authority. Their national spirits are removed, unfinished undertakings and public programs close, and their offices are dismissed. Ordinary government returns and any founder-led external League dissolves. Settlements for administered ground, practical institutions, and the Manifesto still follow where eligible."
utopia_manifesto_aftermath_league_survival_tt: "The domestic Founding Charter and chosen interpretation lose all authority. Their national spirits are removed, unfinished undertakings and public programs close, and their offices are dismissed. A viable external member succeeds the founder as leader of the League, and every League member gains a Partnership opinion of that successor. If we lead a formal defense faction and the successor belongs to it, faction leadership transfers to the successor and we leave the faction. Other compacts preserve their members' post-founder ties. Domestic settlements still follow where eligible."
utopia_manifesto_aftermath_abandonment_tt: "The Founding Charter, chosen interpretation, and external League end. Their national spirits are removed, unfinished undertakings and public programs close, and their offices are dismissed. No Common Store, Garden District, or practical civic legacy can be preserved. Settlements for administered ground and the Manifesto still follow where eligible."

chaosx.nr15.121.t: "What the Country Can Keep"
chaosx.nr15.121.d: "The chosen interpretation is ending, but some institutions answer needs that did not vanish with it. One practical legacy can be carried into the ordinary state. Only stores and districts that actually existed can claim a place beside the broader lessons of public review."
chaosx.nr15.121.a: "Preserve the working common stores."
chaosx.nr15.121.b: "Preserve the working district network."
chaosx.nr15.121.c: "Preserve only institutions under public review."
utopia_manifesto_aftermath_store_legacy_tt: "Preserves §YReliable Public Stores§! as the sole practical legacy after the Founding Charter ends. The country retains the moderated §YCommon Store Network§! national spirit without restoring the former interpretation."
utopia_manifesto_aftermath_district_legacy_tt: "Preserves §YWorking Social Districts§! as the sole practical legacy after the Founding Charter ends. The country retains the moderated §YGarden District Network§! national spirit without restoring the former interpretation."
utopia_manifesto_aftermath_practical_legacy_tt: "Preserves §YInstitutions Under Review§! as the sole practical legacy after the Founding Charter ends. The country retains the moderated §YPractical Commonwealth§! national spirit without restoring the former interpretation."

chaosx.nr15.122.t: "The Administered Ground Returns"
chaosx.nr15.122.d: "Stewardship and Assigned Colony administrations cannot survive the Founding Charter. States held through purchase, enforcement, lease, joint administration, or revolt government must return to the country from which they came. The remaining question is whether departure brings simple independence, an equal reconstruction compact, or a public refusal of restitution."
chaosx.nr15.122.a: "Return every state and recognize independence."
chaosx.nr15.122.b: "Return every state through an equal reconstruction compact."
chaosx.nr15.122.c: "Return every state, but refuse restitution."
utopia_manifesto_aftermath_colony_independence_tt: "Ends stewardship and Assigned Colony rule. Territory gained by purchase, enforcement, or ultimatum returns to the partner from whom it came. Leases and joint administrations end, and Assigned Colonies return to the countries that rose against them. Independence is recognized without a reconstruction compact or a refusal of restitution."
utopia_manifesto_aftermath_colony_compact_tt: "Restores territorial ownership and control by the same terms as independence. The affected countries become equal post-commonwealth reconstruction partners and gain a Partnership opinion of us. Restitution is acknowledged."
utopia_manifesto_aftermath_colony_refusal_tt: "Restores territorial ownership and control by the same terms as independence, but creates no reconstruction compact. The country's public history retains its refusal of restitution."

chaosx.nr15.123.t: "The Book Returns to Debate"
chaosx.nr15.123.d: "The Manifesto has lost its constitutional authority. Its words can return to competing public editions, remain only as a historical record, or become a forbidden doctrine guarded by the state. None of these choices restores the former interpretation."
chaosx.nr15.123.a: "Return the book to public debate."
chaosx.nr15.123.b: "Keep it as a record of the country we attempted."
chaosx.nr15.123.c: "Ban the Manifesto and police its doctrine."
utopia_manifesto_aftermath_book_debate_tt: "Repudiates censorship and official dogma. Once ordinary government returns, a public edition grants §YThe Manifesto in Public Hands§! without restoring the former interpretation."
utopia_manifesto_aftermath_book_history_tt: "Keeps the Manifesto as a historical record. Its former national spirit and interpretation remain ended, and no public or dogmatic replacement is granted."
utopia_manifesto_aftermath_book_ban_tt: "Renews censorship. Once ordinary government returns, official dogma grants §YThe Book Made Doctrine§! without restoring the former interpretation."

chaosx.nr15.130.t: "Utopia Has Neighbors"
chaosx.nr15.130.d: "Member delegations, associates, and reserve councils have gathered beneath their own flags. The commonwealth has become a regional fact, and the final proclamation is ready for signatures."
chaosx.nr15.130.a: "Proclaim that Utopia has neighbors."

chaosx.nr15.160.t: "Utopia Has Neighbors"
chaosx.nr15.160.d: "A compact of small states and associated places has announced a regional commonwealth built around shared stores, reconstruction, and mutual defense. Its members retain their flags, but the new councils give their promises a common timetable."
chaosx.nr15.160.a: "The timetable has begun."

chaosx.nr15.161.t: "Necessary Ground at War"
chaosx.nr15.161.d: "A dispute first recorded as a case of Necessary Ground has become war. One side calls the campaign the enforcement of material need, while its enemies call the doctrine a measured path to conquest."
chaosx.nr15.161.a: "The claim will be answered in the field."

chaosx.nr15.162.t: "The Assigned Colonies Rise"
chaosx.nr15.162.d: "An Assigned Colony has risen against compulsory labor, ration priority, and government without local assent. The revolt has exposed the human cost carried beyond the gates of the Closed Island."
chaosx.nr15.162.a: "No assigned shore stays quiet forever."

chaosx.nr15.206.t: "A Settlement Charter from [FROM.GetNameDef]"
chaosx.nr15.206.d: "[FROM.GetNameDef] offers a settlement charter built on migration corridors, reciprocal local settlement, and public review. No territory would change hands. The agreement would instead bind both governments to receive people and administer their settlement under written terms."
chaosx.nr15.206.a: "Accept the settlement charter."
chaosx.nr15.206.b: "Return the charter with conditions."
chaosx.nr15.206.c: "Refuse the settlement proposal."

chaosx.nr15.207.t: "The Association Comes Up for Review"
chaosx.nr15.207.d: "Our municipal association was written as a voluntary charter, not a permanent transfer of authority. The review term has arrived, and the councils may renew their shared obligations across the commonwealth or withdraw from the compact."
chaosx.nr15.207.a: "Renew the voluntary association."
chaosx.nr15.207.b: "Withdraw from the association."
