BOS_independence_wave_corridor_accord_long: "Drina Corridor Patron Accord"

bos_divided_drina_authority: "Divided Drina Authority"
bos_divided_drina_authority_desc: "Sarajevo delegates, cantonal officials, and defecting garrisons still dispute who may speak for the released state. Supplies and mountain defence suffer while the compact remains unsettled."
bos_drina_compact: "Drina Compact"
bos_drina_compact_desc: "A negotiated civic compact joins the Sarajevo anchor to screened defectors and gives the new state a durable administrative centre."
bos_sarajevo_charter: "Sarajevo Civic Charter"
bos_sarajevo_charter_desc: "A published charter gives the cantons a constitutional voice while the central government builds recognition and public capacity."
bos_drina_workers_council: "Drina Workers' Council"
bos_drina_workers_council_desc: "Workshops, miners, railway crews, and municipal labour boards coordinate production and transport through a council responsible to the released state."
bos_cantonal_compact: "Cantonal Compact"
bos_cantonal_compact_desc: "Cantonal councils keep local obligations and food routes visible to the central government, improving stability and recruiting power."
bos_mountain_command: "Mountain Command"
bos_mountain_command_desc: "A central command screens defecting formations and concentrates scarce equipment on the Sarajevo and Drina approaches."
bos_corridor_accord: "Drina Corridor Accord"
bos_corridor_accord_desc: "A negotiated patron relationship opens corridor access and supplies while imposing obligations on the new government."

independence_wave_bos_drina_council_category: "Drina Civic Council"
independence_wave_bos_drina_council_category_desc: "The council coordinates Sarajevo administration, cantonal rights, defecting garrisons, mountain defence, and the Yugoslav settlement while the compact remains fragile."
independence_wave_bos_hold_drina_council_together: "Hold the Drina Council Together"
independence_wave_bos_hold_drina_council_together_desc: "The first council must keep Sarajevo delegates, cantonal officials, and defecting officers inside one provisional authority."
independence_wave_bos_reopen_sarajevo_depots: "Reopen the Sarajevo Depots"
independence_wave_bos_reopen_sarajevo_depots_desc: "Recover stores along the anchor's roads and place them under a common register. Administrative capacity and a civilian-factory commitment are required."
independence_wave_bos_screen_defecting_garrisons: "Screen the Defecting Garrisons"
independence_wave_bos_screen_defecting_garrisons_desc: "Vetted defectors can strengthen the opening force, but each formation must accept the mixed officer board before receiving compact supplies."
independence_wave_bos_convene_cantonal_council: "Convene the Cantonal Council"
independence_wave_bos_convene_cantonal_council_desc: "Bring Bosnia's cantons and communities into one council with explicit rights and a shared rail, tax, and food register."
independence_wave_bos_settle_yugoslav_ledgers: "Settle Relations with [GetIndependenceWaveFormerHostNameDef]"
independence_wave_bos_settle_yugoslav_ledgers_desc: "Negotiate borders, property claims, population obligations, and recognition with [GetIndependenceWaveFormerHostNameDef]. The talks cannot continue if war begins."
independence_wave_bos_ratify_sarajevo_charter: "Ratify the Sarajevo Charter"
independence_wave_bos_ratify_sarajevo_charter_desc: "Give the cantons a constitutional voice and make the central government responsible to the Drina compact."
independence_wave_bos_convene_drina_workers: "Convene the Drina Workers' Council"
independence_wave_bos_convene_drina_workers_desc: "Place workshops and railway crews under a council that can meet the army's material demands without dissolving local authority."
independence_wave_bos_restore_cantonal_compacts: "Restore Cantonal Compacts"
independence_wave_bos_restore_cantonal_compacts_desc: "Renew local compacts that protect food routes and keep mountain communities supplied through a traditional settlement."
independence_wave_bos_establish_mountain_command: "Establish the Mountain Command"
independence_wave_bos_establish_mountain_command_desc: "Put the emergency chain of command above factional units and prepare the compact for a hard border war."
independence_wave_bos_accept_corridor_accord: "Accept the Drina Corridor Accord"
independence_wave_bos_accept_corridor_accord_desc: "Trade a measure of sovereignty for corridor access, supplies, recognition, and a foreign guarantor's obligations."
independence_wave_bos_codify_drina_settlement: "Codify the Drina Settlement"
independence_wave_bos_codify_drina_settlement_desc: "A stable authority, a recognised border, and an integrated mixed force can turn the liberation into a durable state."
independence_wave_bos_open_danube_network: "Open the Danube Network"
independence_wave_bos_open_danube_network_desc: "Use the league's channels to exchange supplies, officers, and recognition with other states that survived the wave."

independence_wave_bos_project_failure_effect_tt: "The civic and mountain-defence ledgers fall as the provisional authority loses control of the compact."
independence_wave_bos_depots_effect_tt: "Reopened depots improve the Drina civic mandate and mountain-defence readiness."
independence_wave_bos_garrisons_effect_tt: "Screened defecting garrisons strengthen the opening force and improve defence readiness."
independence_wave_bos_cantonal_effect_tt: "The cantonal council raises the civic mandate and records a public settlement."
independence_wave_bos_host_ledgers_effect_tt: "[GetIndependenceWaveFormerHostNameDefCap] reduces its claims, hostility, obligations, and property demands while accepting firmer borders."
independence_wave_bos_route_effect_tt: "The selected government route becomes the active authority and changes the Drina ledgers."
independence_wave_bos_sovereignty_effect_tt: "Bosnia secures durable sovereignty. Legitimacy, recognition, capacity, and security rise as instability falls."
independence_wave_bos_network_effect_tt: "The Danube network strengthens league standing, common cause, and member confidence."

BOS_independence_wave_drina_council: "Mehmed Spaho"
BOS_independence_wave_drina_council_desc: "Mehmed Spaho coordinates Sarajevo delegates, cantonal officials, and the mixed mountain command in Bosnia's provisional government."
