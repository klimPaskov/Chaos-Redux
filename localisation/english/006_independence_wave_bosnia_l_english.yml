BOS_independence_wave_sarajevo_charter_long: "Sarajevo Civic Charter"
BOS_independence_wave_drina_workers: "Drina Workers' Council"
BOS_independence_wave_drina_workers_long: "Bosnian Drina Workers' Council"
BOS_independence_wave_cantonal_compact: "Cantonal Compact"
BOS_independence_wave_cantonal_compact_long: "Bosnian Cantonal Compact"
BOS_independence_wave_mountain_command: "Mountain Command"
BOS_independence_wave_mountain_command_long: "Bosnian Mountain Command"
