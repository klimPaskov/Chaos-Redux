 chaosx.fallout.256.t: "The Fever Dormitory"
 chaosx.fallout.256.d: "The dormitory in [?fallout_event_dispatch_issued_target.GetName] has filled beyond its winter register. Coughing has moved from the clinic beds to the cooking room, and the attendants have begun to mark doors with charcoal because the medicine shelf no longer matches the shelter list. [ROOT.GetAirWinterGovernmentOfficial] can quarantine the room, split the bunks, treat people in the open, or keep the fever out of the public ledger. Every choice leaves a record in the state."
 chaosx.fallout.256.a: "Seal the dormitory and rotate the attendants"
 chaosx.fallout.256.b: "Disperse the bunks before nightfall"
 chaosx.fallout.256.c: "Treat the fever in public"
 chaosx.fallout.256.d: "Conceal the fever until the stores recover"
 chaosx.fallout.256.a.tt: "Spend Â§Y[?constant:fallout_event_256_cost.quarantine_filters|0]Â§! Filters, Â§Y[?constant:fallout_event_256_cost.quarantine_medicine|0]Â§! Medicine, and Â§Y[?constant:fallout_event_256_cost.quarantine_food|0]Â§! Food. The sealed ward is reviewed after Â§Y[?constant:fallout_event_256_timing.result_delay_days|0] daysÂ§!, then receives a follow-up after Â§Y[?constant:fallout_event_256_timing.callback_delay_days|0] daysÂ§!. Failure enters the Deaths ledger."
 chaosx.fallout.256.b.tt: "Spend Â§Y[?constant:fallout_event_256_cost.disperse_food|0]Â§! Food and Â§Y[?constant:fallout_event_256_cost.disperse_recognition|0]Â§! Recognition. The dispersed bunks are reviewed after Â§Y[?constant:fallout_event_256_timing.result_delay_days|0] daysÂ§!, then receive a follow-up after Â§Y[?constant:fallout_event_256_timing.callback_delay_days|0] daysÂ§!. Failure enters the Deaths ledger."
 chaosx.fallout.256.c.tt: "Spend Â§Y[?constant:fallout_event_256_cost.public_medicine|0]Â§! Medicine, Â§Y[?constant:fallout_event_256_cost.public_shelter|0]Â§! Shelter Capacity, and Â§Y[?constant:fallout_event_256_cost.public_recognition|0]Â§! Recognition. The public ward is reviewed after Â§Y[?constant:fallout_event_256_timing.result_delay_days|0] daysÂ§!, then receives a follow-up after Â§Y[?constant:fallout_event_256_timing.callback_delay_days|0] daysÂ§!. Failure enters the Deaths ledger."
 chaosx.fallout.256.d.tt: "Spend Â§Y[?constant:fallout_event_256_cost.conceal_scrap|0]Â§! Scrap and Â§Y[?constant:fallout_event_256_cost.conceal_recognition|0]Â§! Recognition. The concealed ward is reviewed after Â§Y[?constant:fallout_event_256_timing.result_delay_days|0]Â§! days, then receives a follow-up after Â§Y[?constant:fallout_event_256_timing.callback_delay_days|0]Â§! days. Failure enters the Deaths ledger."
 chaosx.fallout.258.t: "The sealed ward report"
 chaosx.fallout.258.success.d: "The sealed dormitory in [?fallout_event_256_state_id.GetName] held through the cold shift. Filters were counted at the hatch, attendants changed in pairs, and the clinic kept its medicine away from the cooking room. Disease pressure has fallen, although every bed now carries a name and a watch."
 chaosx.fallout.258.partial.d: "The seal around the dormitory in [?fallout_event_256_state_id.GetName] held for the clinic and the first bunks, but a service door opened when the stove ran low. The ward is still usable, though the attendants have less medicine and a narrower shelter margin."
 chaosx.fallout.258.failure.d: "The seal in [?fallout_event_256_state_id.GetName] failed when the night crew crossed the dormitory without a clean filter. Fever reached the cooking room, the Deaths register carries the first losses, and [ROOT.GetAirWinterGovernmentAuthority] must answer for the order that promised more protection than the ward possessed."
 chaosx.fallout.258.a: "Read the sealed ward report"
 chaosx.fallout.258.a.tt: "Record the first Fever Dormitory outcome and schedule its follow-up review."
 chaosx.fallout.259.t: "The split-bunk report"
 chaosx.fallout.259.success.d: "The bunks in [?fallout_event_256_state_id.GetName] were split before the frost settled. Families carried blankets between rooms, attendants marked the clean routes, and the ward learned which households could shelter apart without abandoning the sick."
 chaosx.fallout.259.partial.d: "The split-bunk order in [?fallout_event_256_state_id.GetName] moved the strongest households first. Food ran short at the outer rooms, and exposure rose on the corridors, but the clinic has not lost its entire shelter list."
 chaosx.fallout.259.failure.d: "The bunks in [?fallout_event_256_state_id.GetName] were dispersed without enough food or warm rooms. Fever followed the corridor lights, the shelter ledger lost its order, and the Deaths register records people who were moved into cold spaces without attendants."
 chaosx.fallout.259.a: "Read the split-bunk report"
 chaosx.fallout.259.a.tt: "Record the dispersed-bunk outcome and schedule its follow-up review."
 chaosx.fallout.260.t: "The public ward report"
 chaosx.fallout.260.success.d: "The public ward in [?fallout_event_256_state_id.GetName] kept the clinic doors open without turning the street into a waiting room. Medicine was issued by the same tally used by the shelter officers, and the attendants learned which cases needed quiet before the next cold shift."
 chaosx.fallout.260.partial.d: "The public ward in [?fallout_event_256_state_id.GetName] treated the first queue, but medicine ran thin before the outer rooms were called. The public count is visible, and the shelter officers now carry a dispute over which beds received the last measured course."
 chaosx.fallout.260.failure.d: "The public ward in [?fallout_event_256_state_id.GetName] opened its doors before the clinic could separate the coughing rooms. Medicine was spent without lowering disease pressure, exposure rose around the queue, and the Deaths register carries the patients and attendants who waited in the open."
 chaosx.fallout.260.a: "Read the public ward report"
 chaosx.fallout.260.a.tt: "Record the public-treatment outcome and schedule its follow-up review."
 chaosx.fallout.261.t: "The concealed fever report"
 chaosx.fallout.261.success.d: "The concealed ward in [?fallout_event_256_state_id.GetName] kept its doors shut long enough to rebuild a small medicine reserve. The attendants used scrap for a second stove and told the nearest families the truth before the illness reached the market queue."
 chaosx.fallout.261.partial.d: "The concealed ward in [?fallout_event_256_state_id.GetName] survived the first review, but the fever did not stay inside the marked rooms. The public ledger remains incomplete, and the next attendants will inherit a shelter with less trust and a rising disease pressure."
 chaosx.fallout.261.failure.d: "The concealed ward in [?fallout_event_256_state_id.GetName] broke when a patient was carried through the kitchen at dawn. Fever crossed the dormitory, the Deaths register records the rooms that lost their last attendants, and [ROOT.GetAirWinterGovernmentAuthority] must carry the concealment into every later clinic decision."
 chaosx.fallout.261.a: "Read the concealed fever report"
 chaosx.fallout.261.a.tt: "Record the concealed-fever outcome and schedule its follow-up review."
 chaosx.fallout.266.t: "The dormitory follow-up"
 chaosx.fallout.266.success.d: "The follow-up in [?fallout_event_256_state_id.GetName] found a ward that could teach its rules to a second shelter. Disease pressure has eased again, the attendants have a smaller but reliable reserve, and the chosen policy now lives in the country's memory."
 chaosx.fallout.266.partial.d: "The follow-up in [?fallout_event_256_state_id.GetName] found a shelter that survived by exception. The ward can still treat a small wave, but the food and medicine ledgers remain tight and the people who were moved remember which door closed first."
 chaosx.fallout.266.failure.d: "The follow-up in [?fallout_event_256_state_id.GetName] found another fever pocket behind the dormitory stove. Disease pressure has returned, the Deaths register is open again, and [ROOT.GetAirWinterGovernmentOfficial] must revise the shelter list before the next frost."
 chaosx.fallout.266.a: "Close the dormitory review"
 chaosx.fallout.266.a.tt: "Record the follow-up memory and release the dormant Fever Dormitory receipts."

 fallout.event_log.fever_dormitory.name: "The Fever Dormitory"
 fallout.event_log.fever_dormitory.detail: "[GetFalloutEvent256EventLogDetail]"
 fallout.event_log.fever_dormitory.detail.quarantine_success: "The sealed dormitory reduced disease pressure and kept the clinic rule legible."
 fallout.event_log.fever_dormitory.detail.quarantine_partial: "The sealed dormitory held in part, with a smaller medicine reserve and a disputed cold-room margin."
 fallout.event_log.fever_dormitory.detail.quarantine_failure: "The sealed dormitory failed and its ward losses entered the Deaths register."
 fallout.event_log.fever_dormitory.detail.disperse_success: "The bunks were dispersed before nightfall and the shelter learned a workable family route."
 fallout.event_log.fever_dormitory.detail.disperse_partial: "The bunks were dispersed unevenly, leaving food and corridor exposure pressure behind."
 fallout.event_log.fever_dormitory.detail.disperse_failure: "The dispersed bunks lost shelter order and the Deaths register recorded the cold rooms."
 fallout.event_log.fever_dormitory.detail.public_success: "The public ward treated the first queue with a visible medicine tally."
 fallout.event_log.fever_dormitory.detail.public_partial: "The public ward treated part of the queue and left a recorded dispute over the final courses."
 fallout.event_log.fever_dormitory.detail.public_failure: "The public ward spread the fever beyond the clinic and entered losses in the Deaths register."
 fallout.event_log.fever_dormitory.detail.conceal_success: "The concealed ward rebuilt a small reserve before the illness reached the market queue."
 fallout.event_log.fever_dormitory.detail.conceal_partial: "The concealed ward survived the first review but left an incomplete public ledger."
 fallout.event_log.fever_dormitory.detail.conceal_failure: "The concealed ward broke through the kitchen route and left a lasting fever memory."
 fallout.event_log.fever_dormitory.detail.callback_success: "The dormitory follow-up found a teachable ward rule and a smaller reliable reserve."
 fallout.event_log.fever_dormitory.detail.callback_partial: "The dormitory follow-up found a shelter surviving by exception and carrying a visible grievance."
 fallout.event_log.fever_dormitory.detail.callback_failure: "The dormitory follow-up found another fever pocket and reopened the Deaths register."
