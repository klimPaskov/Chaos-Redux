KOS_independence_wave_ferhat_draga: "Ferhat Bey Draga"
KOS_independence_wave_ferhat_draga_desc: "An Albanian political leader from Kosovo, Draga anchors the civic and federal settlements in municipal institutions and negotiated authority."
KOS_independence_wave_miladin_popovic: "Miladin Popović"
KOS_independence_wave_miladin_popovic_desc: "A Yugoslav communist organizer, Popović links mine, workshop, railway, and municipal committees through a workers' council."
KOS_independence_wave_shaban_polluzha: "Shaban Polluzha"
KOS_independence_wave_shaban_polluzha_desc: "A Drenica commander, Polluzha turns local fighters and mountain knowledge into an emergency territorial defence."
