l_english:
# KURD
KUR_independence_wave_federal_party: "Kurdish Civic Assembly"
KUR_independence_wave_federal_party_long: "Constitutional Assembly of the Kurdish Frontier Compact"
KUR_independence_wave_socialist_party: "Kurdish Mountain Workers' Council"
KUR_independence_wave_socialist_party_long: "Workers' and Mountain Council of the Kurdish Frontier Compact"
KUR_independence_wave_tribal_party: "Kurdish Land Compact"
KUR_independence_wave_tribal_party_long: "Traditional Land Compact of the Kurdish Frontier Communities"
KUR_independence_wave_military_party: "Frontier Command Directorate"
KUR_independence_wave_military_party_long: "Frontier Command Directorate of Kurdistan"
KUR_independence_wave_patron_party: "Protected Kurdish Directorate"
KUR_independence_wave_patron_party_long: "Patron-Protected Directorate of Kurdistan"

kur_fragmented_mountain_mandate: "Fragmented Mountain Mandate"
kur_fragmented_mountain_mandate_desc: "Kurdish communities, villages, and mountain detachments recognize the provisional authority without yet accepting one settlement."
kur_kurdish_compact: "Kurdish Compact"
kur_kurdish_compact_desc: "A council charter and common mountain command bind Kurdistan's communities, settlements, and routes to one civil authority."
kur_federal_charter: "Kurdish Council Charter"
kur_federal_charter_desc: "The council establishes elected civic administration and guarantees representation for Kurdistan's frontier communities."
kur_socialist_councils: "Frontier Workers' Council"
kur_socialist_councils_desc: "Railway crews, mountain workers, and municipal committees coordinate production and transport through a common council."
kur_tribal_federal_compact: "Tribal Federal Compact"
kur_tribal_federal_compact_desc: "Tribal delegates and village cooperatives protect food, remounts, recruitment, and local administration across the mountains."
kur_mountain_emergency_command: "Emergency Frontier Command"
kur_mountain_emergency_command_desc: "A unified staff directs mounted guards and depot reserves while civil councils preserve supply and relief."
kur_patron_protected_compact: "Patron-Protected Compact"
kur_patron_protected_compact_desc: "An external patron guarantees the compact's borders and matériel while Kurdish authorities trade some autonomy for time."

independence_wave_kurdistan_mountain_compact_category: "Kurdish Frontier Compact"
independence_wave_kurdistan_mountain_compact_category_desc: "Council Legitimacy: §Y[?independence_wave_kur_council_legitimacy|0]§! / [?constant:independence_wave_kurdistan_pressure.maximum|0]\nMountain Readiness: §Y[?independence_wave_kur_mountain_readiness|0]§! / [?constant:independence_wave_kurdistan_pressure.maximum|0]\nReach [?constant:independence_wave_kurdistan_pressure.stable|0] in both values to stabilize the compact."
independence_wave_kur_hold_mountain_council: "Hold the Kurdish Frontier Council Together"
independence_wave_kur_hold_mountain_council_desc: "Within [?constant:independence_wave_kurdistan_duration.founding_crisis|0] days, install a government, raise both compact values to [?constant:independence_wave_kurdistan_pressure.stable|0], and keep $STATE_421$ owned and controlled."
independence_wave_kur_integrate_tribal_guards: "Integrate the Frontier Guards"
independence_wave_kur_integrate_tribal_guards_desc: "Unify mounted detachments and local guards under a frontier staff while preserving the community guarantees that sustain them."
independence_wave_kur_settle_former_host_ledgers: "Settle the Former Host Ledgers"
independence_wave_kur_settle_former_host_ledgers_desc: "Close the property, border, population, and recognition claims inherited from the former administration. If talks fail, Kurdistan will settle them locally."
independence_wave_kur_ratify_federal_charter: "Ratify Constitutional Autonomy"
independence_wave_kur_ratify_federal_charter_desc: "Give the provisional council a binding charter of self-government and protections for frontier communities."
independence_wave_kur_adopt_tribal_federal_compact: "Adopt the Tribal Federal Compact"
independence_wave_kur_adopt_tribal_federal_compact_desc: "Entrust tribal delegates and cooperatives with food, remounts, recruitment, and local administration."
independence_wave_kur_convene_socialist_councils: "Convene the Socialist Councils"
independence_wave_kur_convene_socialist_councils_desc: "Place mountain workers, railways, workshops, and municipal services under a common workers' council."
independence_wave_kur_codify_durable_sovereignty: "Codify Durable Sovereignty"
independence_wave_kur_codify_durable_sovereignty_desc: "A resolved founding crisis, stable ledgers, and a functioning government can turn liberation into a durable Kurdish state."
independence_wave_kur_secure_mountain_depots_desc: "Place the mountain stores, rail registers, and depot guards under a civil authority able to supply the compact."
independence_wave_kur_secure_mountain_depots: "Secure the Frontier Depots"
independence_wave_kur_register_kurdish_communities_desc: "Record the rights, obligations, and representation of every mountain district, village, railway town, and recognized community."
independence_wave_kur_register_kurdish_communities: "Register the Kurdish Communities"
independence_wave_kur_establish_mountain_emergency_command_desc: "Put the mounted guards under one emergency staff and secure the passes before neighboring armies test the compact."
independence_wave_kur_establish_mountain_emergency_command: "Establish the Frontier Emergency Command"
independence_wave_kur_open_mountain_corridor_desc: "After the founding settlement, exchange supplies, officers, and diplomatic access along the mountain network with the other states that survived the wave."
independence_wave_kur_open_mountain_corridor: "Open the Mountain Network Corridor"
independence_wave_kur_depots_effect_tt: "Council Legitimacy and Mountain Readiness improve, while Legitimacy and State Capacity rise."
independence_wave_kur_guards_effect_tt: "Mountain Readiness improves sharply and the security administration gains Legitimacy and Security."
independence_wave_kur_communities_effect_tt: "Council Legitimacy improves sharply, Recognition and State Capacity rise, and the compact absorbs a measured instability cost."
independence_wave_kur_host_ledgers_effect_tt: "Council Legitimacy and Mountain Readiness improve. Former-host property, border, population, and recognition ledgers are settled through negotiation."
independence_wave_kur_host_loss_effect_tt: "The former-host ledger closes locally. Council Legitimacy and Mountain Readiness improve, and no bilateral host values change."
independence_wave_kur_federal_route_effect_tt: "The Kurdish Civic Assembly takes office under the federal standard. Council Legitimacy and Mountain Readiness improve, with gains to Legitimacy and State Capacity."
independence_wave_kur_tribal_route_effect_tt: "The Kurdish Land Compact takes office under the tribal federal standard. Council Legitimacy and Mountain Readiness improve, with gains to Legitimacy and Recognition."
independence_wave_kur_socialist_route_effect_tt: "The Kurdish Mountain Workers' Council takes office under the socialist standard. Mountain Readiness improves sharply while the railway and mountain economy are reorganized."
independence_wave_kur_military_route_effect_tt: "The Frontier Command Directorate takes office under the military standard. Mountain Readiness rises sharply while Council Legitimacy pays the cost of emergency rule."
independence_wave_kur_sovereignty_effect_tt: "Legitimacy, Recognition, and State Capacity rise, and the compact gains Security."
independence_wave_kur_network_effect_tt: "Council Legitimacy and Mountain Readiness improve. Network Standing, League Cohesion, Common Cause, Shared Reserve, and Member Confidence rise."
independence_wave_kur_focus_integrate_tribal_guards: "Integrate the Frontier Guards"
independence_wave_kur_focus_register_kurdish_communities: "Register the Kurdish Communities"
independence_wave_kur_focus_secure_mountain_depots: "Secure the Frontier Depots"
independence_wave_kur_focus_settle_former_host_ledgers: "Settle the Former Host Ledgers"
independence_wave_kur_focus_convene_mountain_council: "Convene the Mountain Council"
independence_wave_kur_focus_secure_kurdish_communities: "Secure Kurdish Communities"
independence_wave_kur_focus_open_mountain_corridor: "Open the Mountain Corridor"
independence_wave_kur_patron_route_effect_tt: "A patron-protected directorate takes office. Mountain Readiness improves, external support arrives, and Council Legitimacy trades some autonomy for security."
independence_wave_kur_accept_patron_protection: "Accept Patron Protection"
independence_wave_kur_accept_patron_protection_desc: "Accept a defined external guarantee, trading some autonomy for matériel, time, and a protected mountain frontier."

independence_wave_kur_project_failure_effect_tt: "Council Legitimacy and Mountain Readiness each fall by [?constant:independence_wave_kurdistan_pressure.standard_loss|0]. Legitimacy, Recognition, State Capacity, and Security fall. Instability rises."
independence_wave_kur_cost_administration_light: "£command_power §Y[?constant:independence_wave_decision_cost.command_power_light|0]§!  £manpower_texticon §Y[?constant:independence_wave_decision_cost.manpower_light|0]§!  £civ_factory §Y[?constant:independence_wave_kurdistan_cost.civilian_factory_use|0]§!"
