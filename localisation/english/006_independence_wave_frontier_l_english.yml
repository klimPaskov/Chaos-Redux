independence_wave_kub_settle_former_host_ledgers_desc: "Close the property, border, population, and recognition claims inherited from the former administration. If talks fail, the Kuban Host compact will settle them locally."
independence_wave_kub_ratify_constitutional_autonomy: "Ratify Constitutional Autonomy"
independence_wave_kub_ratify_constitutional_autonomy_desc: "Give the provisional assembly a binding charter of self-government and explicit protections for the mounted communities."
independence_wave_kub_adopt_agrarian_compact: "Adopt the Agrarian Compact"
independence_wave_kub_adopt_agrarian_compact_desc: "Entrust village delegates, cooperatives, and parish communities with food, recruitment, and local administration."
