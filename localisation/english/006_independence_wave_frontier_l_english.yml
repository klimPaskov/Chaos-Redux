kub_fragmented_mounted_mandate: "Fragmented Mounted Mandate"
kub_fragmented_mounted_mandate_desc: "Village councils, railway officials, church communities, and border guards recognize the provisional state without yet accepting a common settlement."
kub_kuban_host_compact: "Kuban Host Compact"
kub_kuban_host_compact_desc: "Written community guarantees and a common mounted defence bind the Kuban Cossack Host's valleys, towns, and guarded passes to one civil authority."
kub_rada_charter: "Rada Charter"
kub_rada_charter_desc: "An elected assembly protects Kuban self-government while keeping the civil service and mounted communities represented."
kub_guard_soviets: "Guard Soviets"
kub_guard_soviets_desc: "Railway workers, forestry crews, and town committees coordinate production and transport through a common workers' council."
kub_stanitsa_land_compact: "Stanitsa Land Compact"
kub_stanitsa_land_compact_desc: "Village delegates, cooperatives, and parish communities share responsibility for food, recruitment, and local administration."
kub_mounted_emergency_command: "Mounted Emergency Command"
kub_mounted_emergency_command_desc: "A unified territorial staff directs the border guards and mounted reserves while civil councils preserve local supply and relief."

independence_wave_kub_mounted_compact_category: "Kuban Host Compact"
independence_wave_kub_mounted_compact_category_desc: "Civic Concord: §Y[?independence_wave_kub_rada_cohesion|0]§! / [?constant:independence_wave_kuban_pressure.maximum|0]\nMounted Readiness: §Y[?independence_wave_kub_mounted_readiness|0]§! / [?constant:independence_wave_kuban_pressure.maximum|0]\nReach [?constant:independence_wave_kuban_pressure.stable|0] in both values to stabilize the compact."
independence_wave_kub_hold_mounted_compact_together: "Hold the Kuban Host Compact Together"
independence_wave_kub_hold_mounted_compact_together_desc: "Within [?constant:independence_wave_kuban_duration.founding_crisis|0] days, install a government, raise both compact values to [?constant:independence_wave_kuban_pressure.stable|0], and secure ownership and control of $STATE_234$."
independence_wave_kub_secure_mounted_depots: "Secure the Mounted Depots"
independence_wave_kub_secure_mounted_depots_desc: "Place the upland stores, road registers, and railway depots under a civil authority able to supply the compact."
independence_wave_kub_integrate_border_guards: "Integrate the Border Guards"
independence_wave_kub_integrate_border_guards_desc: "Unify the local detachments under a mounted defence staff while preserving the community guarantees that sustain them."
