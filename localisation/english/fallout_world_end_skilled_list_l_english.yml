l_english:
 chaosx.fallout.429.t: "The Skilled List"
 chaosx.fallout.429.d: "The census clerk has found a packet of names sealed inside a school wall. Engineers, doctors, officers, and growers are still alive, but they have no common charter and every district wants a different share of their time. [This.GetName] must decide whether these people travel, organize, obey, or govern themselves."
 chaosx.fallout.429.a: "Send the roster outward"
 chaosx.fallout.429.b: "Charter a specialist guild"
 chaosx.fallout.429.c: "Bind the list to state service"
chaosx.fallout.429.e: "Recognize a self-governing quarter"
 chaosx.fallout.429.a.tt: "Spend food, medicine, recognition, and cohesion to place named specialists in several settlements."
 chaosx.fallout.429.b.tt: "Spend food, medicine, recognition, and cohesion to give the specialists a guild hall and a public charter."
 chaosx.fallout.429.c.tt: "Spend food, medicine, recognition, and cohesion to place the roster under a state service office."
 chaosx.fallout.429.d.tt: "Spend food, medicine, recognition, and cohesion to recognize a specialist quarter with its own rules."
 chaosx.fallout.431.t: "The List Finds Its Work"
 chaosx.fallout.431.disperse_roster.success.d: "The clerk sends the engineers to the pumps, the doctors to the fever rooms, and the growers to the frost line. Each name receives a duty and a second address. The roster becomes a web of people who can repair one settlement without abandoning the next."
 chaosx.fallout.431.disperse_roster.partial.d: "Several specialists reach the outlying shelters, but the roads lose the officers and two doctors before winter closes them. The list still guides work, though every district keeps a private copy and a private grievance."
 chaosx.fallout.431.disperse_roster.failure.d: "The clerk posts the names at every gate, then the gates close. Settlements hide their engineers and the doctors choose their own families. The list becomes a catalogue of people the state cannot reach."
 chaosx.fallout.431.form_guild.success.d: "The guild hall opens beside the old school boiler. Its charter lets engineers inspect a bridge, doctors refuse a contaminated ward, and growers reserve seed without begging a patrol. The specialists have a public house and the country has a place to ask for skill."
 chaosx.fallout.431.form_guild.partial.d: "The guild receives a key and a seal, but not enough medicine for every clinic. It can certify a repair and defend a doctor from a mob, yet some settlements still trade access for their own promises."
 chaosx.fallout.431.form_guild.failure.d: "The charter becomes a contest over who may sign it. The specialists withdraw their names, the guild hall remains dark, and every district starts calling its own apprentice an expert."
 chaosx.fallout.431.bind_state_service.success.d: "The roster enters the service office with clear pay, transport, and refusal rules. Officers plan escorts for engineers, doctors can requisition a clean room, and growers receive the same protection as a depot. The state has gained a service without owning every conscience."
 chaosx.fallout.431.bind_state_service.partial.d: "The service office keeps the list moving, but its escorts arrive late at the frost line. The specialists accept the seal for now, while families record every requisition that leaves a clinic without a replacement."
 chaosx.fallout.431.bind_state_service.failure.d: "The office turns the roster into a summons. Engineers are taken from pump repairs, doctors are ordered into guarded wards, and growers stop answering the radio. A list meant to save work now marks the people who must hide."
 chaosx.fallout.431.allow_self_government.success.d: "The specialist quarter receives its own water rota, clinic council, and repair court. It answers for the boundary wall and shares its records with the country. The quarter keeps its names, while the country gains a neighbour instead of another department."
 chaosx.fallout.431.allow_self_government.partial.d: "The quarter keeps its council, but the water rota fails during a hard week and the state sends an armed clerk to count the tanks. Self-rule survives as a negotiated privilege rather than a settled promise."
 chaosx.fallout.431.allow_self_government.failure.d: "The quarter cannot decide who speaks for the engineers and who speaks for the dead. The state suspends its charter, the specialists scatter into private workshops, and the names on the wall lose their authority."
 chaosx.fallout.431.a: "Record the specialists and await the review"
 chaosx.fallout.431.a.tt: "Apply the specialist result, preserve role memory, and schedule a 240-day review."
 chaosx.fallout.433.t: "A Year of Names"
 chaosx.fallout.433.success.d: "The first review finds the roster in use. A doctor has trained two assistants, an engineer has left repair notes in three districts, and the growers have kept a seed ledger that survived the frost. The names now describe a generation of work rather than a list of survivors."
 chaosx.fallout.433.partial.d: "The review finds useful work and several empty seats. The guild, office, or quarter has kept its records, but the next generation still depends on a few people who cannot be in every room at once."
 chaosx.fallout.433.failure.d: "The review finds signatures without people. The roster has become a relic, and the settlements must decide whether to preserve the names or admit that the work has passed to strangers."
 chaosx.fallout.433.a: "Close the specialist record"
 chaosx.fallout.433.a.tt: "Resolve the review, retain the character-memory ledgers, and release scheduler cleanup."
 fallout.event_log.skilled_list.name: "The Skilled List"
 fallout.event_log.skilled_list.detail: "[This.GetName] decided how the surviving specialists would be remembered and assigned."
 fallout.event_log.skilled_list.disperse_roster_success: "The roster reached several settlements and became a working network of named specialists."
 fallout.event_log.skilled_list.disperse_roster_partial: "The roster reached the road towns, but travel losses left every district short of skill."
 fallout.event_log.skilled_list.disperse_roster_failure: "The settlements hid their specialists and the roster became a list the state could not reach."
 fallout.event_log.skilled_list.form_guild_success: "A public guild protected repairs, clinics, and seed stores under one charter."
 fallout.event_log.skilled_list.form_guild_partial: "The guild received a charter but could not serve every clinic or workshop."
 fallout.event_log.skilled_list.form_guild_failure: "A fight over the guild seal scattered the specialists into private workshops."
 fallout.event_log.skilled_list.bind_state_service_success: "A service office protected specialist work without claiming every conscience."
 fallout.event_log.skilled_list.bind_state_service_partial: "The service office kept the list moving, though escorts and replacements arrived late."
 fallout.event_log.skilled_list.bind_state_service_failure: "The state turned the roster into a summons and the specialists withdrew."
 fallout.event_log.skilled_list.allow_self_government_success: "A specialist quarter kept its council while sharing records with the country."
 fallout.event_log.skilled_list.allow_self_government_partial: "Self-rule survived as a negotiated privilege after the water rota failed."
 fallout.event_log.skilled_list.allow_self_government_failure: "The specialist charter collapsed and its names lost public authority."
 fallout.event_log.skilled_list.callback_success: "The first review found a durable generation of named specialist work."
 fallout.event_log.skilled_list.callback_partial: "The first review found useful records and too few people to fill every seat."
 fallout.event_log.skilled_list.callback_failure: "The first review found signatures without the people who made them matter."
