l_english:

chaosx.nr163.2.t: "A Doctor Without a Ministry"
chaosx.nr163.2.d: "A physician calling himself Doctor Wu has arrived with sealed casebooks, portable lamps, and a methodical contempt for official boundaries. He asks for access to hospitals, railway manifests, burial records, and the authority to move his small clinical network wherever an outbreak is worst. His claims are extravagant. The procedures in his notebooks are not."
chaosx.nr163.2.a: "Give his work a public medical mandate."
chaosx.nr163.2.b: "Place the network under protected clinical authority."
chaosx.nr163.2.c: "No unaccountable doctor will cross our wards."

doctor_wu_public_mandate_tt: "Doctor Wu establishes his public clinical network in §Y[ROOT.GetNameDef]§!. Disease systems may offer state-level protocols and foreign access requests, but ordinary costs and cleanup requirements remain in force."
doctor_wu_protected_service_tt: "Doctor Wu establishes a protected clinical service in §Y[ROOT.GetNameDef]§!. Disease systems may offer state-level protocols and foreign access requests, but ordinary costs and cleanup requirements remain in force."
doctor_wu_refusal_tt: "Doctor Wu is denied a host. No replacement host is created."

chaosx.events_log.window.event_details.doctor_wu: "Doctor Wu appears in one weighted independent country with a functioning capital. Severe disease pressure, hospitals, and medical readiness make a country more likely to receive him. If accepted, his network becomes a single persistent host relationship that other disease systems can consult.\n\nFor the Black Plague, the network can reveal hidden incubation, accelerate countermeasure research, and improve treatment in one selected Severe Crisis state. It never removes every outbreak, bypasses local costs, or substitutes for containment and cleanup. Foreign governments must request temporary access from the current host."

chaosx.nr163.3.t: "A Request Across the Border"
chaosx.nr163.3.d: "A neighbouring or allied state asks for Doctor Wu's clinical access. Their delegation brings samples, escorts, and transport capacity, but the work will consume our own scarce medical material."
chaosx.nr163.3.a: "Open the field laboratory"
chaosx.nr163.3.b: "Decline the mission"
doctor_wu_foreign_accept_tt: "Spend support equipment, motorized equipment, and fuel to grant a 90-day foreign clinical window. The requester gains treatment support and countermeasure progress, while its selected state remains subject to normal cleanup."
doctor_wu_foreign_decline_tt: "Decline the request and place the requester on a temporary diplomatic cooldown."

chaosx.nr163.4.t: "Doctor Wu's Foreign Mission"
chaosx.nr163.4.d: "The request has been answered. Doctor Wu's methods travel through a bounded clinical mission. The disease and treatment board still require ordinary action."
chaosx.nr163.4.a: "Record the work"
