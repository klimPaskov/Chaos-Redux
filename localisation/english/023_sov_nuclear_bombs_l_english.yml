l_english:
chaosx.nr23.1.t: "SOV Nuclear Bombs"

chaosx.nr23.2.t: "The Arsenal Opens"
chaosx.nr23.2.d: "The Soviet research directorate has completed a secret atomic arsenal. Guards must secure its depots, technicians must certify the devices, and trained crews must carry them to their targets. Moscow must decide who will hold the release codes and authorize their use."
chaosx.nr23.2.party: "Place the arsenal under Party custody"
chaosx.nr23.2.military: "Place the arsenal under military custody"
chaosx.nr23.2.scientific_safety: "Require a scientific safety veto"
chaosx.nr23.2.dispersed_commands: "Disperse custody among regional commands"

chaosx.nr23.100.t: "The Nuclear Command Board"
chaosx.nr23.100.d: "Guards hold the depots, laboratory crews are preparing the devices, and delivery commanders await orders. The arsenal must be kept secure through every test, movement and release."
chaosx.nr23.100.a: "Keep the arsenal secure."
chaosx.nr23.100.custody: "Return to custody and accounting"
chaosx.nr23.100.production: "Open production and delivery"
chaosx.nr23.100.test: "Open the test program"
chaosx.nr23.100.coercion: "Open coercion and settlement"
chaosx.nr23.100.retaliation: "Open retaliation command"

chaosx.nr23.103.t: "Reform the Custody Doctrine"
chaosx.nr23.103.d: "The crisis has exposed weaknesses in the arsenal's chain of command. Transferring custody, technical certification, and release authority will disrupt operations as guards, technicians, and officers learn their new duties. Moscow must choose who will command the arsenal through the next crisis."
chaosx.nr23.103.party: "Entrust custody to the Party"
chaosx.nr23.103.military: "Entrust custody to the military"
chaosx.nr23.103.scientific_safety: "Require scientific safety certification"
chaosx.nr23.103.dispersed_commands: "Disperse custody among regional commands"
chaosx.nr23.101.t: "Atomic Test Report"
chaosx.nr23.101.d: "The test has ended, but its instruments have not established a reliable result. Technicians are inspecting the site and the device."
chaosx.nr23.101.success.d: "The test produced a confirmed atomic yield. Engineers have verified the readings, and the spent device has been removed from the arsenal.\n\nReadiness change: [?sov_nuclear_bombs_last_test_readiness_change|0][GetSovietNuclearBombsTestRepeatNote][GetSovietNuclearBombsLastTestPresentation]"
chaosx.nr23.101.partial.d: "The test produced only a partial atomic yield. The device is spent, and the weak result has shaken confidence in the arsenal, though the engineers learned something from it.\n\nReadiness change: [?sov_nuclear_bombs_last_test_readiness_change|0][GetSovietNuclearBombsTestRepeatNote][GetSovietNuclearBombsLastTestPresentation]"
chaosx.nr23.101.failure.d: "The atomic test produced no yield. The device is spent, and the command board must investigate the failure before another test.\n\nReadiness change: [?sov_nuclear_bombs_last_test_readiness_change|0][GetSovietNuclearBombsLastTestPresentation]"
sov_nuclear_bombs_test_repeat_note: " (a repeat test at this stage taught the engineers less)"
sov_nuclear_bombs_test_repeat_none: ""
chaosx.nr23.101.a: "Read the report."
chaosx.nr23.102.t: "A Test Has Gone Wrong"
chaosx.nr23.102.d: "The latest atomic test has ended badly. The device remains accounted for, but the failure has damaged confidence in the arsenal and exposed weaknesses in the command chain."
chaosx.nr23.102.accident.d: "The test accident produced an atomic yield. The blast damaged the test site, and crews are securing the contaminated area as investigators examine how the safeguards failed.[GetSovietNuclearBombsLastTestPresentation]"
chaosx.nr23.102.a: "Secure the site."
chaosx.nr23.104.t: "An Accident Before Yield"
chaosx.nr23.104.d: "The device's conventional explosives detonated during test preparation without producing an atomic yield. Crews are securing contaminated debris and accounting for the dead. The ruined device has been removed from the arsenal.[GetSovietNuclearBombsLastTestPresentation]"
chaosx.nr23.104.a: "Care for the injured."
chaosx.nr23.107.t: "Foreign Eyes on the Program"
chaosx.nr23.107.suspected.d: "Foreign intelligence services have picked up fragments of the program through [GetSovietNuclearBombsExposureSourceName]. No government can prove anything yet, but several have begun asking questions, and our security officers report unusual interest in the sites. A counterintelligence sweep could still explain the fragments away."
chaosx.nr23.107.confirmed.d: "A foreign government now holds reliable proof of the program, gathered through [GetSovietNuclearBombsExposureSourceName]. It has said nothing in public, but its planners are already adjusting their war plans and research. No sweep can take that proof back."
chaosx.nr23.107.observed.d: "Foreign instruments recorded our last test. The governments that hold the readings now know the weapon works, though none has yet said so in public."
chaosx.nr23.107.detected.d: "Our last test was detected beyond any credible denial. Foreign governments have published the readings, and the arsenal is now a public fact."
chaosx.nr23.107.a: "Tighten security around the program."
chaosx.nr23.171.t: "Moscow Asks for the Devices"
chaosx.nr23.171.joint.d: "Soviet negotiators have arrived to discuss the depot at [sov_nuclear_bombs_custody_talks_site.GetName]. They propose a joint guard and a shared key: neither side could move the devices without the other. Our generals say the devices are the only reason Moscow is talking to us at all."
chaosx.nr23.171.recall.d: "Soviet troops stand at the rail yards outside the depot at [sov_nuclear_bombs_custody_talks_site.GetName], and their officers ask us to load the devices onto their trains. They would rather take them by agreement than by force, but they have come prepared for either."
chaosx.nr23.171.a: "Accept joint custody."
chaosx.nr23.171.b: "Return the devices to Moscow."
chaosx.nr23.171.c: "Refuse to hand over the devices."
sov_nuclear_bombs_custody_talks_joint_tt: "The depot passes into joint Soviet and local custody, and neither side can move or use the devices alone."
sov_nuclear_bombs_custody_talks_return_tt: "The devices return to Soviet custody, and Moscow's command gains more from the agreement than it would from a raid."
sov_nuclear_bombs_custody_talks_refuse_tt: "The Soviet talks end without result. The devices stay in our hands, and so does the risk."
sov_nuclear_bombs_custody_talks_refuse_recall_tt: "We will not load their trains. The Soviet troops will try to take the devices by force while they hold the route to the depot, and Moscow gains less from a forced recall than from an agreement."
chaosx.nr23.172.t: "A Request to Remove Soviet Devices"
chaosx.nr23.172.d: "[FROM.GetNameDef] holds a depot of Soviet atomic devices it cannot safely keep and asks us to send technicians, guards and transport to dismantle them under observation. We would not own the devices, only see them destroyed. Moscow will not thank us for interfering, and the convoy would have to cross unsettled country."
chaosx.nr23.172.a: "Send the removal team."
chaosx.nr23.172.b: "Decline the request."
sov_nuclear_bombs_removal_accept_tt: "Our technicians and guards help [FROM.GetNameDef] dismantle the devices under observation. We never take control of them, and the work fails if the rail route to the depot is lost."
sov_nuclear_bombs_removal_decline_tt: "[FROM.GetNameDef] must find another way to deal with the devices."
chaosx.nr23.173.t: "An Answer on Foreign Help"
chaosx.nr23.173.accepted.d: "Foreign technicians and guards are on their way to the depot. The dismantlement will take months, and it holds only as long as the rail route stays open."
chaosx.nr23.173.declined.d: "The government we asked has declined to send a removal team. The devices remain ours to guard, conceal, bargain with or destroy."
chaosx.nr23.173.lapsed.d: "A foreign removal team was ready to come, but the depot can no longer be opened to it: either it has slipped from our hands or the rail line to it is cut. The offer lapses, and the devices stay where they are."
chaosx.nr23.173.a: "Understood."
sov_nuclear_bombs_reinforce_depot: "Reinforce the Depot"
sov_nuclear_bombs_reinforce_depot_desc: "Send a garrison, engineers and supplies into the selected depot while a Soviet force holds its state. Command Integrity rises by [?constant:sov_nuclear_bombs_breakaway.reinforce_integrity|0], and for [?constant:sov_nuclear_bombs_breakaway.garrison_days|0] days the holder cannot begin technical access there. Work already under way takes [?constant:sov_nuclear_bombs_breakaway.garrison_delay_days|0] days longer. Each depot can be reinforced once."
sov_nuclear_bombs_depot_not_reinforced_tt: "The selected depot has not been reinforced before"
sov_nuclear_bombs_depot_not_concealed_tt: "The holder has not hidden the selected depot's devices"
sov_nuclear_bombs_depot_not_garrisoned_tt: "No Soviet garrison holds the selected depot"
sov_nuclear_bombs_breakaway_selected_depot_tt: "We hold the selected depot under our own custody, and no other nuclear project is under way"
sov_nuclear_bombs_breakaway_removal_requirements_tt: "We hold the selected depot, a rail route reaches it, no request is already pending, and a major outside the Soviet camp that is not at war with us could help"
sov_nuclear_bombs_breakaway_conceal_devices: "Conceal the Devices"
sov_nuclear_bombs_breakaway_conceal_devices_desc: "Move the devices of our selected depot into hidden storage. For [?constant:sov_nuclear_bombs_breakaway.concealment_days|0] days Moscow cannot recall or raid them, but the record of where they are can no longer be checked, and our own people may lose track of them."
sov_nuclear_bombs_breakaway_conceal_devices_tt: "The devices are hidden from Soviet recall and raids for [?constant:sov_nuclear_bombs_breakaway.concealment_days|0] days. Their record can no longer be verified, and there is a [?constant:sov_nuclear_bombs_breakaway.concealment_missing_chance|0]% chance that our accounting loses them and they go missing."
sov_nuclear_bombs_breakaway_request_removal_assistance: "Request Foreign Removal Assistance"
sov_nuclear_bombs_breakaway_request_removal_assistance_desc: "Ask a major outside the Soviet camp to send technicians, guards and transport so the devices of our selected depot can be dismantled under observation. The helper never takes the devices over."
sov_nuclear_bombs_breakaway_request_removal_assistance_tt: "A major outside the Soviet camp is asked for help and may accept or decline."
sov_nuclear_bombs_breakaway_dismantle_under_observation: "Dismantle Under Observation"
sov_nuclear_bombs_breakaway_dismantle_under_observation_desc: "Give up the devices of our selected depot through a verified dismantlement lasting [?constant:sov_nuclear_bombs_breakaway.dismantlement_days|0] days. The devices are destroyed, not handed to anyone, and any work toward using them at that depot ends."
sov_nuclear_bombs_breakaway_dismantlement_mission: "Dismantlement Under Observation"
sov_nuclear_bombs_breakaway_dismantlement_mission_desc: "The devices of our selected depot are being taken apart under observation. The work stops if we lose the depot, or, with foreign help, if the rail route to it is cut."
chaosx.nr23.190.t: "Proof of a Soviet Bomb"
chaosx.nr23.190.d: "Our intelligence services now hold reliable proof that the Soviet Union has built atomic weapons: shipping records from guarded depots, reactor plans and the testimony of men who have seen the assembly halls. Moscow has said nothing in public, and neither have we. The question is what we do while the secret is still a secret."
chaosx.nr23.191.t: "The Soviet Arsenal Is Public"
chaosx.nr23.191.d: "The Soviet atomic arsenal is no longer a matter for intelligence briefings. Every newspaper carries the story, embassies are asking for assurances, and our own staff must plan for a war in which a single aircraft can destroy a city. The general staff wants a decision on where our effort goes first."
chaosx.nr23.192.t: "The Atomic Race Begins"
chaosx.nr23.192.d: "Reports from across the Soviet Union describe new reactors, larger assembly halls and a programme that is no longer a single secret project but a standing industry. Our planners warn that a country without its own atomic research, or without a way to stop the bombers, will soon have no say in its own defence."
sov_nuclear_bombs_foreign_intelligence_option: "Turn our intelligence services on the Soviet programme."
sov_nuclear_bombs_foreign_research_option: "Make our own atomic research a national priority."
sov_nuclear_bombs_foreign_air_defence_option: "Strengthen our air defences against the bombers."
sov_nuclear_bombs_foreign_guarantee_option: "Guarantee a threatened neighbour of the Union."
chaosx.nr23.193.t: "Moscow Has Used the Bomb"
chaosx.nr23.193.d: "A Soviet atomic weapon has been used in war. Our people know that whatever Moscow does next, our cities stand closer to the Union than anyone else's, and that the enemies of the Union will count us among its targets. Moscow expects us to stand with it. Some in our government want to say, loudly, that this was not our decision."
chaosx.nr23.193.a: "Stand with Moscow."
chaosx.nr23.193.b: "Keep our distance from the Union."
sov_nuclear_bombs_foreign_atomic_priority: "Atomic Research Priority"
sov_nuclear_bombs_foreign_atomic_priority_desc: "The Soviet arsenal has made atomic research a matter of national survival. Laboratories, uranium and scientists are directed to our own programme first."
sov_nuclear_bombs_foreign_air_defence: "Air Defence Against the Bombers"
sov_nuclear_bombs_foreign_air_defence_desc: "Anti-aircraft batteries, radar posts and night-fighter control are concentrated around our cities and industry, so that no bomber reaches its target unchallenged."
chaosx.nr23.106.t: "The Nuclear Race Widens"
chaosx.nr23.106.d: "Soviet factories and reactor compounds are being enlarged. More atomic devices will reach the guarded depots, and foreign air forces are preparing for a growing Soviet arsenal."
chaosx.nr23.106.a: "Expand the program under control."
chaosx.nr23.110.t: "The Breakaway Custody Board"
chaosx.nr23.110.d: "A breakaway authority has taken custody of a Soviet nuclear depot. Its guards hold the devices, but its technicians must learn to service them, its officers must establish release authority, and its crews must prepare delivery before it can use them."
chaosx.nr23.110.a: "Open the custody review."
chaosx.nr23.111.t: "A Physicist Fails to Report"
chaosx.nr23.111.d: "One of the senior physicists from the reactor and assembly programme did not return from a technical conference abroad. His travel papers were in order, his notebooks are missing, and the security officer assigned to him says he was last seen entering a foreign consulate. Whatever he knows, someone else may soon know it too."
chaosx.nr23.111.a: "Recover him quietly through our agents."
chaosx.nr23.111.b: "Accuse his hosts of kidnapping in public."
chaosx.nr23.111.c: "Purge the laboratories of anyone who knew him."
chaosx.nr23.111.e: "Accept that a foreign power now has our secrets."
chaosx.nr23.112.t: "A Rail Manifest Goes Missing"
chaosx.nr23.112.d: "A copy of the manifest for the next guarded train has disappeared from a junction office. It lists the wagons, the escort and the stops, enough for anyone watching the line to know that something unusual is moving. The convoy commander asks for orders before the train leaves the yard."
chaosx.nr23.112.a: "Reroute the convoy on a slower line."
chaosx.nr23.112.b: "Keep to the schedule and accept the risk."
chaosx.nr23.112.c: "Send a decoy train along the listed route."
chaosx.nr23.112.e: "Unload the device at a temporary site."
chaosx.nr23.113.t: "Foreign Aircraft over the Test Site"
chaosx.nr23.113.d: "Air defence posts report a high-flying foreign aircraft that circled the test ground twice before turning for the border. The exclusion zone, the tower and the instrument bunkers are all visible from that height. The test director wants to know whether the work goes on."
chaosx.nr23.113.a: "Cancel the test and return the device."
chaosx.nr23.113.b: "Accelerate the test before more evidence is gathered."
chaosx.nr23.113.c: "Invite selected observers and make it a controlled demonstration."
chaosx.nr23.113.e: "Deny everything and accept the suspicion."
chaosx.nr23.114.t: "Sick Workers Leave the Zone"
chaosx.nr23.114.d: "Labourers and soldiers who worked inside the restricted zone after the test have reported to village clinics with burns, vomiting and hair falling out in handfuls. Their families are asking what happened to them, and the local doctors have started writing it down."
chaosx.nr23.114.a: "Isolate and treat them, and compensate the families."
chaosx.nr23.114.b: "Confine them inside the zone."
chaosx.nr23.114.c: "Admit a safety failure without naming the weapon."
chaosx.nr23.114.e: "Destroy the medical records."
chaosx.nr23.115.t: "A Device Component Is Lost"
chaosx.nr23.115.d: "When the depot changed hands, the inventory teams found a gap: a casing assembly and its firing documentation are no longer where the records say they should be. The new holders of the site deny having them. Without the component the device cannot be used, but in the wrong hands it shows exactly how it was built."
chaosx.nr23.115.a: "Order a recovery raid."
chaosx.nr23.115.b: "Negotiate the component's return."
chaosx.nr23.115.c: "Claim the material is industrial equipment."
chaosx.nr23.115.e: "Redesign the device and change the authentication codes."
sov_nuclear_bombs_incident_recover_physicist_tt: "Command Integrity [?constant:sov_nuclear_bombs_incident.recover_physicist_integrity|+=0]. Foreign services lose an important source."
sov_nuclear_bombs_incident_accuse_hosts_tt: "Command Integrity [?constant:sov_nuclear_bombs_incident.accuse_integrity|+=0]. The accusation draws foreign attention, and the programme becomes at least §YSuspected§! abroad."
sov_nuclear_bombs_incident_purge_laboratories_tt: "Arsenal Readiness [?constant:sov_nuclear_bombs_incident.purge_readiness|+=0] and Command Integrity [?constant:sov_nuclear_bombs_incident.purge_integrity|+=0]. Foreign services lose their contacts inside the programme."
sov_nuclear_bombs_incident_accept_foreign_knowledge_tt: "A foreign major gains private proof of the arsenal, which becomes at least §YConfirmed in private§!."
sov_nuclear_bombs_incident_reroute_convoy_tt: "Arsenal Readiness [?constant:sov_nuclear_bombs_incident.reroute_readiness|+=0]. The watchers on the line lose the train."
sov_nuclear_bombs_incident_continue_convoy_tt: "Foreign services learn a great deal from the guarded train."
sov_nuclear_bombs_incident_decoy_shipment_tt: "The decoy draws the watchers away, and foreign services lose track of the real shipment."
sov_nuclear_bombs_incident_temporary_site_tt: "Command Integrity [?constant:sov_nuclear_bombs_incident.temporary_site_integrity|+=0] while the device sits at a poorly guarded site, but the watchers lose it."
sov_nuclear_bombs_incident_cancel_test_tt: "The prepared test is cancelled and its device returns to its depot. Arsenal Readiness [?constant:sov_nuclear_bombs_tuning.cancel_test_readiness|+=0]."
sov_nuclear_bombs_incident_accelerate_test_tt: "The test takes place [?constant:sov_nuclear_bombs_incident.accelerate_days|0] days sooner. Command Integrity [?constant:sov_nuclear_bombs_incident.accelerate_integrity|+=0]. Less evidence escapes before the test, but the rushed preparation makes an accident more likely."
sov_nuclear_bombs_incident_invite_observers_tt: "If the device detonates, the test becomes a public demonstration: the arsenal becomes §YDemonstrated§! and Soviet threats more credible."
sov_nuclear_bombs_incident_deny_overflight_tt: "The programme becomes at least §YSuspected§! abroad."
sov_nuclear_bombs_incident_isolate_workers_tt: "Command Integrity [?constant:sov_nuclear_bombs_incident.isolate_integrity|+=0]. The hospital records draw some foreign attention."
sov_nuclear_bombs_incident_confine_workers_tt: "Command Integrity [?constant:sov_nuclear_bombs_incident.confine_integrity|+=0]. The workers disappear behind the wire, and foreign services lose the story."
sov_nuclear_bombs_incident_admit_safety_failure_tt: "Command Integrity [?constant:sov_nuclear_bombs_incident.admit_integrity|+=0]. The admission draws foreign attention, and the programme becomes at least §YSuspected§! abroad."
sov_nuclear_bombs_incident_destroy_medical_records_tt: "Command Integrity [?constant:sov_nuclear_bombs_incident.destroy_records_integrity|+=0]. Foreign services lose the evidence."
sov_nuclear_bombs_incident_raid_for_component_tt: "Arsenal Readiness [?constant:sov_nuclear_bombs_incident.raid_readiness|+=0]. The raid draws foreign attention and opens the custody board if it is not already open."
sov_nuclear_bombs_incident_negotiate_component_tt: "Command Integrity [?constant:sov_nuclear_bombs_incident.negotiate_integrity|+=0]. Quiet talks keep the matter out of foreign hands."
sov_nuclear_bombs_incident_claim_industrial_material_tt: "Command Integrity [?constant:sov_nuclear_bombs_incident.industrial_claim_integrity|+=0]. The cover story confuses foreign services."
sov_nuclear_bombs_incident_redesign_device_tt: "Arsenal Readiness [?constant:sov_nuclear_bombs_incident.redesign_readiness|+=0] and Command Integrity [?constant:sov_nuclear_bombs_incident.redesign_integrity|+=0]."
sov_nuclear_bombs_exposure_source_defector: "a physicist who failed to report"
chaosx.nr23.120.t: "The Ultimatum Reaches the Capital"
chaosx.nr23.120.d: "[ROOT.GetName] has received the Soviet demand: [GetSovietNuclearBombsDemandName]. The demand names [sov_nuclear_bombs_coercion_state.GetName], and Moscow has backed its terms with the atomic arsenal. [GetSovietNuclearBombsThreatAssessment] Our government must decide whether to concede, negotiate, or resist, and how to protect the threatened territory."
sov_nuclear_bombs_threat_assessment_empty: "Moscow has already withdrawn earlier threats without acting, and our ministers doubt it will act now."
sov_nuclear_bombs_threat_assessment_employed: "Soviet atomic weapons have already been used in war."
sov_nuclear_bombs_threat_assessment_proven: "The Union has shown the world that its weapon works."
sov_nuclear_bombs_threat_assessment_unproven: "No Soviet atomic weapon has ever been seen to work, and our ministers are divided on whether the threat is real."
chaosx.nr23.120.a: "Accept the Soviet terms."
chaosx.nr23.120.b: "Accept a partial settlement."
chaosx.nr23.120.c: "Delay the answer."
chaosx.nr23.120.refuse: "Refuse the demand."
chaosx.nr23.120.e: "Expose the channel."
chaosx.nr23.120.f: "Seek foreign support."
chaosx.nr23.120.g: "Evacuate and disperse the named state."
chaosx.nr23.120.h: "Prepare nuclear retaliation."
chaosx.nr23.120.i: "Attempt a delivery-chain raid."
chaosx.nr23.140.t: "Authorization Record"
chaosx.nr23.140.d: "A release order has reached the authorization board. Technical certification, target validity, delivery readiness, command integrity, and the reserved device must all be verified before the strike can proceed."
chaosx.nr23.140.a: "Confirm the order."
chaosx.nr23.141.t: "Possible Enemy Launch"
chaosx.nr23.141.d: "Frontier radar posts report a formation of heavy aircraft climbing out of [sov_nuclear_bombs_warning_suspect.GetNameDef] airspace on a course for the Union. No detonation has been confirmed, the tracks keep fading in and out, and one station already insists it is seeing birds and weather. The duty officer has [?sov_nuclear_bombs_warning_window_days|0] days of reports to sort before the picture is clear, and the command board wants an order now."
chaosx.nr23.141.a: "Wait for confirmation."
chaosx.nr23.141.b: "Disperse the arsenal and raise readiness."
chaosx.nr23.141.c: "Contact [sov_nuclear_bombs_warning_suspect.GetNameDef] on the emergency line."
chaosx.nr23.141.e: "Prepare a response without releasing anything."
chaosx.nr23.141.f: "Act on the warning now."
sov_nuclear_bombs_warning_wait_tt: "Command Integrity [?constant:sov_nuclear_bombs_false_warning.wait_integrity|+=0]. Nothing is launched while the warning is checked."
sov_nuclear_bombs_warning_disperse_tt: "Arsenal Readiness [?constant:sov_nuclear_bombs_false_warning.disperse_readiness|+=0] and Command Integrity [?constant:sov_nuclear_bombs_false_warning.disperse_integrity|+=0] as bombers and devices scatter to their dispersal fields."
sov_nuclear_bombs_warning_contact_tt: "Opens the emergency hotline with [sov_nuclear_bombs_warning_suspect.GetNameDef]: a Nuclear Confrontation that gives both sides time to talk and to offer a stand-down."
sov_nuclear_bombs_warning_prepare_tt: "Arsenal Readiness [?constant:sov_nuclear_bombs_false_warning.prepare_readiness|+=0] and Command Integrity [?constant:sov_nuclear_bombs_false_warning.prepare_integrity|+=0]. The retaliation board stays on alert until the warning clears, and the crisis counts as a §YNuclear Confrontation§!. No release is authorized."
sov_nuclear_bombs_warning_act_tt: "Command Integrity [?constant:sov_nuclear_bombs_false_warning.act_integrity|+=0]. The command moves to the retaliation board under the emergency first-use rules. A target still has to be marked, prepared, certified and finally authorized before anything is released."
chaosx.nr23.150.t: "The Exchange Has Begun"
chaosx.nr23.150.d: "A confirmed nuclear detonation has been answered by another major power. Communications are failing, retaliation windows are opening, and the first exchange between nuclear powers has begun. Fallout is spreading from each blast as commanders decide whether the next orders will widen the war."
chaosx.nr23.150.a: "Keep the line open."
chaosx.nr23.160.t: "Moratorium Verification"
chaosx.nr23.160.d: "The Soviet Union has entered an atomic moratorium. Release orders are suspended, and guards are counting and inspecting every device to ensure that none has left custody."
chaosx.nr23.160.a: "Verify the moratorium."
chaosx.nr23.161.t: "Reciprocal Stand-Down Review"
chaosx.nr23.161.d: "The hotline pause has reached its review date. The command board must confirm that both nuclear powers agreed to suspend release orders and kept their command authorities intact throughout the pause."
chaosx.nr23.161.a: "Review the agreement."
chaosx.nr23.162.t: "Settlement Review"
chaosx.nr23.162.d: "The response to [GetSovietNuclearBombsDemandName] has reached its verification date. The settlement with [sov_nuclear_bombs_coercion_target.GetName] remains valid only if that government is independent, has not capitulated, and still enforces the agreed terms."
chaosx.nr23.162.a: "Review the settlement."
chaosx.nr23.163.t: "A Reciprocal Stand-Down Offer"
chaosx.nr23.163.d: "Moscow has suspended its release orders and asks us to do the same. Both sides must keep their command authorities intact throughout the pause. Refusal returns the hotline to crisis footing."
chaosx.nr23.163.a: "Suspend our release orders."
chaosx.nr23.163.b: "Refuse the offer."
chaosx.nr23.170.t: "Review of the Broken Chain"
chaosx.nr23.170.d: "The Soviet command chain has been damaged around a registered nuclear depot. The review separates what remains in Soviet hands from what is physically held by a successor authority, what can be recovered, and what must be marked missing or dismantled."
chaosx.nr23.170.a: "Open the custody board."

chaosx.news.230.t: "The Soviet Test Site Speaks"
chaosx.news.230.d: "A Soviet atomic demonstration has made the arsenal visible to the world. The remote blast proves that Soviet delivery crews can release a working weapon, and every major government is reassessing its air defenses and war plans. [GetSovietNuclearBombsPublicTestPresentation]"
chaosx.news.230.a: "The secret is over."
chaosx.news.235.t: "A Secret Test Is Detected"
chaosx.news.235.d: "Seismic stations and air samples abroad have recorded an atomic detonation deep inside the Soviet Union. Moscow has made no announcement, but the readings leave no room for doubt: the Soviet Union holds a working atomic weapon, and every major government is reviewing its plans."
chaosx.news.235.a: "Moscow has kept its silence."
chaosx.news.231.t: "Moscow Names Its Demand"
chaosx.news.231.d: "The Soviet Union has issued an atomic ultimatum to [?SOV.sov_nuclear_bombs_news_threat_country.GetNameDef], naming [?SOV.sov_nuclear_bombs_news_threat_state.GetName] as its target. Diplomats are seeking a settlement as military staffs prepare for a strike."
chaosx.news.231.a: "The answer is awaited."
chaosx.news.232.t: "A Nuclear Strike Is Confirmed"
chaosx.news.232.d: "A Soviet atomic weapon has detonated in [?SOV.sov_nuclear_bombs_news_strike_state.GetName], striking [?SOV.sov_nuclear_bombs_news_strike_country.GetNameDef]. Fallout spreads beyond the blast zone as casualty lists grow. Foreign governments condemn the attack, and military staffs prepare for retaliation."
chaosx.news.232.a: "The detonation is confirmed."
chaosx.news.233.t: "Retaliation Windows Open"
chaosx.news.233.d: "Nuclear powers are preparing retaliation after a confirmed strike. Commanders must choose between a limited response, keeping weapons in reserve, talks on the emergency hotline, and a wider exchange. Fallout spreads from each blast as people flee the affected cities."
chaosx.news.233.a: "Hold the response line."
chaosx.news.234.t: "A Depot Answers to Another Flag"
chaosx.news.234.d: "A breakaway authority has seized a Soviet nuclear depot. Its guards hold the devices, but technicians must learn to service them, officers must establish release authority, and crews must prepare delivery before the weapons can be used."
chaosx.news.234.a: "Track the custody transfer."

