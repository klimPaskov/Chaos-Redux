l_english:
 chaosx.fallout.317.t: "The First Streetlight"
 chaosx.fallout.317.d: "The grid now carries enough current to make one district visible after dark. The choice is not merely where to put a lamp. It decides what the city believes a public night should protect, and who gets to call the next circuit necessary."
 chaosx.fallout.317.a: "Light the capital first"
 chaosx.fallout.317.a.tt: "Make the capital the first public face of recovery. Costs Power, Scrap, and Recognition. A stable result builds civic identity and a common city schedule."
 chaosx.fallout.317.b: "Put the clinics in the light"
 chaosx.fallout.317.b.tt: "Send the first reliable current to clinics and night wards. Costs Power and Medicine, with a Cohesion threshold. A stable result strengthens civic trust and health."
 chaosx.fallout.317.c: "Light the factory streets"
 chaosx.fallout.317.c.tt: "Use the first current to restart workshops and loading bays. Costs Power, Scrap, and Food. A stable result raises production while the city learns a harder rhythm."
 chaosx.fallout.317.d_option: "Light the perimeter"
 chaosx.fallout.317.d_option.tt: "Place the lamps along the approaches and ash roads. Costs Power, Fuel, and Reclamation. A stable result makes the city safer beyond the wall."
 chaosx.fallout.319.t: "One district after dark"
 chaosx.fallout.319.capital.success.d: "The capital's first streetlight burns through the ash dusk. People gather beneath it to read notices, trade clean water, and mark the hours without a siren. The lamp becomes a civic promise that the city can keep seeing itself."
 chaosx.fallout.319.capital.partial.d: "The capital glows around the control room, while outer streets return to darkness when the wind turns cold. The public schedule exists, but only the districts near the old center can trust it."
 chaosx.fallout.319.capital.failure.d: "The capital circuit trips before the first notice is read. The city keeps one emergency lamp in the council room and learns that a public symbol can fail more loudly than a private wire."
 chaosx.fallout.319.clinic.success.d: "Clinic lamps come on beside the night wards. Nurses can count medicine without burning precious fuel, and families see the same light above the doors when they arrive. The city measures recovery by who can reach care after sunset."
 chaosx.fallout.319.clinic.partial.d: "The clinics receive current, but only on a narrow schedule. The wards can keep their lamps for emergencies and lose them for ordinary work. Trust grows where the schedule holds and thins where it does not."
 chaosx.fallout.319.clinic.failure.d: "A relay fault leaves the wards dark during a crowded night. The staff improvise with hand lamps, and the settlement spends medicine and confidence repairing a promise that was meant to be simple."
 chaosx.fallout.319.factory.success.d: "Workshop doors open under the first industrial lamps. Metalworkers share the current with the loading crews, and the city's first night shift produces tools for streets that do not yet have lights. Production becomes a public reason to keep the grid alive."
 chaosx.fallout.319.factory.partial.d: "The factory streets glow in short shifts. Workshops can finish a repair before the current falls, but no foreman can promise a full night's work. The city gains output and a new argument over whose queue comes next."
 chaosx.fallout.319.factory.failure.d: "The first factory start burns a feeder and spoils a store of food. The workshops close their doors while crews salvage the line. Production falls, and the city remembers that recovery can consume what it meant to save."
 chaosx.fallout.319.perimeter.success.d: "Lamps appear along the ash roads and the approaches to the wall. Patrols can see the empty ground between checkpoints, and travelers can find the gates without firing a warning shot. The city begins to feel larger than its shelters."
 chaosx.fallout.319.perimeter.partial.d: "The perimeter lights cover the main gate and leave the side roads dark. Patrols gain a safer route, while every unlit bend becomes a question for the next reclamation crew. The city has a boundary it can partly defend."
 chaosx.fallout.319.perimeter.failure.d: "The lamps fail along the first ash road. A patrol withdraws, a reclamation crew loses its tools, and the city pulls the surviving current back behind the wall. The outside remains a place reached by memory rather than light."
 chaosx.fallout.319.a: "Accept the first-light report"
 chaosx.fallout.319.a.tt: "Record the urban priority, apply its immediate result, and begin the 240-day public maintenance follow-up."
 chaosx.fallout.321.t: "A city learns its night"
 chaosx.fallout.321.success.d: "The first streetlight has survived a full maintenance cycle. Crews know which lamps fail in cold rain, which districts share a feeder, and which promises belong on the public board. Night is no longer only the absence of day."
 chaosx.fallout.321.partial.d: "The city's lights hold when people share parts and keep the schedule visible. Some districts remain dark by choice or neglect, yet the settlement now has a public language for asking where the next lamp belongs."
 chaosx.fallout.321.failure.d: "The maintenance year finds empty cabinets and rival claims on the last relays. The first streetlight remains a memory over one doorway, while the city returns to hand lamps and guarded darkness."
 chaosx.fallout.321.a: "Close the first-light ledger"
 chaosx.fallout.321.a.tt: "Resolve the public maintenance follow-up, preserve the urban memory, and release the First Streetlight transaction."
 fallout.event_log.first_streetlight.name: "The First Streetlight"
 fallout.event_log.first_streetlight.detail: "A Fallout recovery chain recorded an urban lighting priority, a delayed first-light result, and a public maintenance follow-up."
