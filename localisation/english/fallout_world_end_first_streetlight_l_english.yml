 fallout.event_log.first_streetlight.capital_failure: "The capital circuit failed before its first public notice."
 fallout.event_log.first_streetlight.clinic_success: "Clinic lamps made night care a public measure of recovery."
 fallout.event_log.first_streetlight.clinic_partial: "Clinic power held on a narrow emergency schedule."
 fallout.event_log.first_streetlight.clinic_failure: "A ward relay failed during a crowded night."
 fallout.event_log.first_streetlight.factory_success: "Factory streets reopened under the first industrial lamps."
