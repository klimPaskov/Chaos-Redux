 fallout.event_log.first_streetlight.callback_success: "A maintenance year turned the first lamp into a city institution."
 fallout.event_log.first_streetlight.callback_partial: "A maintenance year created a usable but uneven public schedule."
 fallout.event_log.first_streetlight.callback_failure: "A maintenance year left the city with hand lamps and guarded darkness."
