cbrn_reconcile_occupied_mask_records: "Audit Occupied Mask Stocks"
cbrn_reconcile_occupied_mask_records_desc: "An occupied mask programme has crates or fees unaccounted for. Review the depots, recover confirmed stocks, and write off missing supplies so distribution can resume.[This.GetCbrnOccupiedAuditSummary]"
cbrn_reconcile_occupied_mask_records_available_tt: "An occupied distribution programme left crates or a spent service fee unaccounted for, and no programme is running."
cbrn_reconcile_occupied_mask_records_tt: "Returns every crate the depots confirm, writes off whatever cannot be found and the unaccounted service fee, and reopens the Occupied Mask Program. Crates already delivered to occupied populations stay where they are."
cbrn_reconcile_occupied_audit_summary: " The last audit returned §G[?cbrn_occupied_reconciled_returned|.0]§! crates, wrote off §R[?cbrn_occupied_reconciled_written_off_models|.0]§! crates and wrote off §R[?cbrn_occupied_reconciled_written_off_fee|.0]§! Political Power."
cbrn_reconcile_occupied_audit_summary_none: ""
cbrn_reconcile_export_shipment_records: "Audit Mask Shipment"
cbrn_reconcile_export_shipment_records_desc: "A mask shipment to [FROM.GetNameDef] remains unaccounted for. Review the depots, recover confirmed stocks, and write off missing supplies so shipments can resume.[This.GetCbrnExportAuditSummary]"
cbrn_reconcile_export_shipment_records_available_tt: "A shipment to [FROM.GetNameDef] left crates or a spent service fee unaccounted for, and no shipment to this partner is under way."
cbrn_reconcile_export_shipment_records_tt: "Returns every crate the depots confirm, writes off whatever cannot be found and the unaccounted service fee, and allows protective equipment to be sent to [FROM.GetNameDef] again. Masks already delivered stay with the recipient."
cbrn_reconcile_export_audit_summary: " The last audit returned §G[?cbrn_export_reconciled_returned|.0]§! crates, wrote off §R[?cbrn_export_reconciled_written_off_models|.0]§! crates and wrote off §R[?cbrn_export_reconciled_written_off_fee|.0]§! Political Power."
cbrn_reconcile_export_audit_summary_none: ""
