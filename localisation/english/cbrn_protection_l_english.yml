l_english:
cbrn_program_management_category: "National CBRN Protection Program"
cbrn_program_management_category_desc: "Build, issue and service real protective-equipment reserves. Respirators in warehouses do not protect anyone until they are assigned to the field army or distributed to a state's population."
cbrn_civil_defence_category: "Respirator Distribution and Chemical Alerts"
cbrn_civil_defence_category_desc: "Direct mask stocks to individual states and respond to verified chemical warnings. State coverage scales with population, fitting, filter condition and the models actually delivered."

cbrn_establish_national_respirator_reserve: "Establish a National Respirator Reserve"
cbrn_establish_national_respirator_reserve_desc: "Create a central inspection, storage and rotation service for military and civilian respirators. Organized depots reduce storage losses and turn isolated stocks into a durable national program."
cbrn_establish_national_respirator_reserve_requirements_tt: "Requires Basic Service Respirators, [?constant:cbrn_protection_decision_cost.establish_reserve_support|0] Support Equipment and [?constant:cbrn_protection_decision_cost.establish_reserve_factories|0] available Civilian Factories."
cbrn_establish_national_respirator_reserve_extra_cost: "Additional: [?constant:cbrn_protection_decision_cost.establish_reserve_support|0] Support Equipment; [?constant:cbrn_protection_decision_cost.establish_reserve_factories|0] Civilian Factories reserved"
cbrn_establish_national_respirator_reserve_extra_cost_blocked: "§RAdditional project requirements are not met§!"
cbrn_establish_national_respirator_reserve_extra_cost_tooltip: "Consumes [?constant:cbrn_protection_decision_cost.establish_reserve_support|0] Support Equipment when begun and reserves [?constant:cbrn_protection_decision_cost.establish_reserve_factories|0] Civilian Factories for the project."
cbrn_establish_national_respirator_reserve_begin_tt: "The depot service consumes its Support Equipment when work begins. The assigned factories remain occupied for [?constant:cbrn_protection_decision_timing.establish_reserve_days|0] days."
cbrn_establish_national_respirator_reserve_complete_tt: "Establishes the national reserve, improves Chemical Readiness and begins inspection and storage-loss accounting every [?constant:cbrn_scheduler.protection_maintenance_days|0] days."

cbrn_register_and_fit_population: "Register and Fit the Population"
cbrn_register_and_fit_population_desc: "Prepare household rolls, fitting stations and distribution records before an emergency. A small share of reserve masks is consumed by fitting damage, demonstrations and rejected facepieces."
cbrn_register_and_fit_population_requirements_tt: "Requires an established national reserve, respirators in stock, [?constant:cbrn_protection_decision_cost.register_population_support|0] Support Equipment, [?constant:cbrn_protection_decision_cost.register_population_manpower_gate|0] Manpower and [?constant:cbrn_protection_decision_cost.register_population_factories|0] available Civilian Factories."
cbrn_register_and_fit_population_extra_cost: "Additional: [?constant:cbrn_protection_decision_cost.register_population_support|0] Support Equipment; [?constant:cbrn_protection_decision_cost.register_population_manpower_gate|0] Manpower; [?constant:cbrn_protection_decision_cost.register_population_factories|0] Civilian Factories reserved"
cbrn_register_and_fit_population_extra_cost_blocked: "§RAdditional project requirements are not met§!"
cbrn_register_and_fit_population_extra_cost_tooltip: "Consumes [?constant:cbrn_protection_decision_cost.register_population_support|0] Support Equipment and [?constant:cbrn_protection_decision_cost.register_population_manpower_gate|0] Manpower when begun, and reserves [?constant:cbrn_protection_decision_cost.register_population_factories|0] Civilian Factories for the project."
cbrn_register_and_fit_population_begin_tt: "Registration offices and fitting stations mobilize their administrative staff and begin work across the country."
cbrn_register_and_fit_population_complete_tt: "Completes the civilian fitting register, improves warning and distribution efficiency, and transfers rejected masks to the reconditioning ledger. The program succeeds only if respirators remain available at completion."

cbrn_issue_masks_to_field_army: "Issue Masks to the Field Army"
cbrn_issue_masks_to_field_army_desc: "Move respirator crates from national stock into standing military issue. Each order covers up to [?constant:cbrn_mask_scale.issue_increment_of_need|%0] of the army's remaining requirement, using the most protective available models first."
cbrn_issue_masks_to_field_army_requirements_tt: "Requires respirators in stock, [?constant:cbrn_protection_decision_cost.issue_field_army_support|0] Support Equipment and [?constant:cbrn_protection_decision_cost.issue_field_army_factories|0] available Civilian Factory."
cbrn_issue_masks_to_field_army_extra_cost: "Additional: [?constant:cbrn_protection_decision_cost.issue_field_army_support|0] Support Equipment; [?constant:cbrn_protection_decision_cost.issue_field_army_factories|0] Civilian Factory reserved"
cbrn_issue_masks_to_field_army_extra_cost_blocked: "§RAdditional project requirements are not met§!"
cbrn_issue_masks_to_field_army_extra_cost_tooltip: "Consumes [?constant:cbrn_protection_decision_cost.issue_field_army_support|0] Support Equipment when begun and reserves [?constant:cbrn_protection_decision_cost.issue_field_army_factories|0] Civilian Factory for the project."
cbrn_issue_masks_to_field_army_begin_tt: "Quartermasters prepare fittings, filter records and unit issue tables."
cbrn_issue_masks_to_field_army_complete_tt: "Issues available respirator crates to the field army. If stock changed during the project, only the crates still available are issued."

cbrn_replace_military_mask_filters: "Replace Military Mask Filters"
cbrn_replace_military_mask_filters_desc: "Withdraw exhausted canisters and distribute replacements across the field army. Replacement filters consume respirator-crate stock in proportion to issued masks and current filter condition."
cbrn_replace_military_mask_filters_requirements_tt: "Requires issued military respirators with worn filters, spare respirator crates and [?constant:cbrn_protection_decision_cost.replace_filters_factories|0] available Civilian Factory."
cbrn_replace_military_mask_filters_extra_cost: "Additional: [?constant:cbrn_protection_decision_cost.replace_filters_factories|0] Civilian Factory reserved; replacement crates consumed at completion"
cbrn_replace_military_mask_filters_extra_cost_blocked: "§RAdditional project requirements are not met§!"
cbrn_replace_military_mask_filters_extra_cost_tooltip: "Reserves [?constant:cbrn_protection_decision_cost.replace_filters_factories|0] Civilian Factory for the project. The required replacement crates are calculated and consumed at completion."
cbrn_replace_military_mask_filters_begin_tt: "Filter lots are inspected and assigned to field formations."
cbrn_replace_military_mask_filters_complete_tt: "Consumes available reserve crates to restore military filter condition. A shortage restores only the supported share."

cbrn_recondition_old_masks: "Recondition Old Masks"
cbrn_recondition_old_masks_desc: "Strip damaged facepieces, replace seals and combine serviceable components into low-reliability reserve crates. Reconditioned masks offer weaker protection and can fail depot inspection."
cbrn_recondition_old_masks_requirements_tt: "Requires damaged or replacement-demand masks, [?constant:cbrn_protection_decision_cost.recondition_masks_support|0] Support Equipment and [?constant:cbrn_protection_decision_cost.recondition_masks_factories|0] available Civilian Factory."
cbrn_recondition_old_masks_extra_cost: "Additional: [?constant:cbrn_protection_decision_cost.recondition_masks_support|0] Support Equipment; [?constant:cbrn_protection_decision_cost.recondition_masks_factories|0] Civilian Factory reserved"
cbrn_recondition_old_masks_extra_cost_blocked: "§RAdditional project requirements are not met§!"
cbrn_recondition_old_masks_extra_cost_tooltip: "Consumes [?constant:cbrn_protection_decision_cost.recondition_masks_support|0] Support Equipment when begun and reserves [?constant:cbrn_protection_decision_cost.recondition_masks_factories|0] Civilian Factory for the project."
cbrn_recondition_old_masks_begin_tt: "Depot workshops begin sorting and rebuilding damaged respirators."
cbrn_recondition_old_masks_complete_tt: "Returns up to [?constant:cbrn_mask_filters.recondition_action_max|0] reconditioned crates from the damaged-mask ledger. Inspection may uncover a defective batch."

cbrn_convert_civilian_mask_industry: "Convert Civilian Mask Industry"
cbrn_convert_civilian_mask_industry_desc: "Redirect rubber goods, filter media and civilian assembly lines toward a rapid run of basic respirators. The conversion is material-intensive but can rebuild a depleted reserve."
cbrn_convert_civilian_mask_industry_requirements_tt: "Requires Basic Service Respirators, [?constant:cbrn_protection_decision_cost.convert_industry_support|0] Support Equipment and [?constant:cbrn_protection_decision_cost.convert_industry_factories|0] available Civilian Factories."
cbrn_convert_civilian_mask_industry_extra_cost: "Additional: [?constant:cbrn_protection_decision_cost.convert_industry_support|0] Support Equipment; [?constant:cbrn_protection_decision_cost.convert_industry_factories|0] Civilian Factories reserved"
cbrn_convert_civilian_mask_industry_extra_cost_blocked: "§RAdditional project requirements are not met§!"
cbrn_convert_civilian_mask_industry_extra_cost_tooltip: "Consumes [?constant:cbrn_protection_decision_cost.convert_industry_support|0] Support Equipment when begun and reserves [?constant:cbrn_protection_decision_cost.convert_industry_factories|0] Civilian Factories for the project."
cbrn_convert_civilian_mask_industry_begin_tt: "Civilian rubber and filter lines are converted for respirator production."
cbrn_convert_civilian_mask_industry_complete_tt: "Adds [?constant:cbrn_protection_decision_cost.convert_industry_basic_crates|0] Basic Respirator Crates to national stock."

cbrn_simplify_filters_for_mass_issue: "Simplify Filters for Mass Issue"
cbrn_simplify_filters_for_mass_issue_desc: "Use simpler canisters and fittings to stretch scarce material across a larger emergency production run. Distribution becomes cheaper for [?constant:cbrn_protection_decision_timing.simplified_filter_program_days|0] days, but new masks offer weaker protection and shorter filter life."
cbrn_simplify_filters_for_mass_issue_requirements_tt: "Requires Basic Service Respirators, [?constant:cbrn_protection_decision_cost.simplify_filters_support|0] Support Equipment and [?constant:cbrn_protection_decision_cost.simplify_filters_factories|0] available Civilian Factories."
cbrn_simplify_filters_for_mass_issue_extra_cost: "Additional: [?constant:cbrn_protection_decision_cost.simplify_filters_support|0] Support Equipment; [?constant:cbrn_protection_decision_cost.simplify_filters_factories|0] Civilian Factories reserved"
cbrn_simplify_filters_for_mass_issue_extra_cost_blocked: "§RAdditional project requirements are not met§!"
cbrn_simplify_filters_for_mass_issue_extra_cost_tooltip: "Consumes [?constant:cbrn_protection_decision_cost.simplify_filters_support|0] Support Equipment when begun and reserves [?constant:cbrn_protection_decision_cost.simplify_filters_factories|0] Civilian Factories for the project."
cbrn_simplify_filters_for_mass_issue_begin_tt: "Factories adopt simplified filter media, fittings and inspection standards."
cbrn_simplify_filters_for_mass_issue_complete_tt: "Adds [?constant:cbrn_protection_decision_cost.simplify_filters_basic_crates|0] Basic Respirator Crates. For [?constant:cbrn_protection_decision_timing.simplified_filter_program_days|0] days, state distribution uses fewer crates but provides reduced protection and filter condition."

cbrn_export_protective_equipment: "Export Protective Equipment to [FROM.GetNameDef]"
cbrn_export_protective_equipment_desc: "Reserve a protected shipment for an allied civil-defence program. Old and reconditioned models are selected first so modern frontline issue is preserved."
cbrn_export_protective_equipment_begin_tt: "Prepares an allied shipment of [?constant:cbrn_protection_decision_cost.export_masks_crates|0] respirator crates."
cbrn_export_protective_equipment_complete_tt: "Transfers [?constant:cbrn_protection_decision_cost.export_masks_crates|0] respirator crates to [FROM.GetNameDef], using older models first. The recipient records the aid and gains a favorable opinion. If [ROOT.GetNameDef] already meets international compliance terms, the shipment may ease a small share of current Condemnation. Evidence, attribution, casualties, contamination and confirmed use remain on record. The shipment is cancelled if either partner or the reserve becomes ineligible."

cbrn_import_protective_equipment: "Import Protective Equipment from [FROM.GetNameDef]"
cbrn_import_protective_equipment_desc: "Request an emergency allied transfer while domestic reserves remain inadequate. The supplying ally sends older models first."
cbrn_import_protective_equipment_begin_tt: "Negotiates and prepares an allied shipment of [?constant:cbrn_protection_decision_cost.import_masks_crates|0] respirator crates."
cbrn_import_protective_equipment_complete_tt: "[FROM.GetNameDef] transfers [?constant:cbrn_protection_decision_cost.import_masks_crates|0] respirator crates, using its older models first."

cbrn_license_foreign_respirator_design: "License [FROM.GetAdjective] Respirator Designs"
cbrn_license_foreign_respirator_design_desc: "Acquire allied drawings, filter standards and fitting data from a partner with more advanced protective equipment."
cbrn_license_foreign_respirator_design_begin_tt: "Technical missions compare [FROM.GetAdjective] respirator designs with domestic production standards."
cbrn_license_foreign_respirator_design_complete_tt: "Adds a [?constant:cbrn_protection_decision_cost.license_design_uses|0]-use [?constant:cbrn_protection_decision_cost.license_design_bonus|%0] research bonus for Gas Mask technologies and improves Chemical Readiness."
cbrn_foreign_respirator_design_bonus: "Licensed Respirator Design"

cbrn_priority_state_mask_issue: "Priority Mask Issue in [FROM.GetName]"
cbrn_priority_state_mask_issue_desc: "Direct reserve crates to a capital, industrial center, port, air base or supply hub. The project aims for [?constant:cbrn_mask_distribution.priority_target_percent|0]% effective civilian coverage."
cbrn_priority_state_mask_issue_begin_tt: "Begins a [?constant:cbrn_protection_decision_timing.priority_distribution_days|0]-day distribution project in [FROM.GetName]."
cbrn_priority_state_mask_issue_complete_tt: "Consumes available national respirator crates to approach [?constant:cbrn_mask_distribution.priority_target_percent|0]% effective coverage in [FROM.GetName]. Population, infrastructure, fitting records, model quality and filter standards determine the real result. If reserves changed, delivery is partial."

cbrn_full_state_mask_distribution: "Full Mask Distribution in [FROM.GetName]"
cbrn_full_state_mask_distribution_desc: "Attempt near-universal distribution across [FROM.GetName]. The project requires a registered population and at least two Infrastructure, aims for [?constant:cbrn_mask_distribution.full_target_percent|0]% effective coverage, and scales directly with the state's population."
cbrn_full_state_mask_distribution_begin_tt: "Begins a [?constant:cbrn_protection_decision_timing.full_distribution_days|0]-day mass distribution project in [FROM.GetName]."
cbrn_full_state_mask_distribution_complete_tt: "Consumes available national respirator crates to approach [?constant:cbrn_mask_distribution.full_target_percent|0]% effective coverage in [FROM.GetName]. Urban, low-infrastructure and disrupted states consume more stock. If reserves changed, delivery is partial."

cbrn_emergency_state_mask_distribution: "Emergency Mask Distribution in [FROM.GetName]"
cbrn_emergency_state_mask_distribution_desc: "Release available crates immediately after a verified warning for [FROM.GetName] or confirmed local contamination. Emergency issue reaches fewer people, wastes more stock and begins with degraded filter condition. Congestion temporarily disrupts local production and movement."
cbrn_emergency_state_mask_distribution_complete_tt: "Immediately consumes available national stock to approach [?constant:cbrn_mask_distribution.emergency_target_percent|0]% emergency coverage in [FROM.GetName]. The hurried issue is less efficient and less protective than an organized project, and disrupts the state for [?constant:cbrn_protection_decision_timing.emergency_distribution_disruption_days|0] days."

cbrn_replace_state_mask_filters: "Replace Civilian Filters in [FROM.GetName]"
cbrn_replace_state_mask_filters_desc: "Service distributed respirators and replace exhausted canisters. Persistent contamination increases filter demand."
cbrn_replace_state_mask_filters_begin_tt: "Begins a [?constant:cbrn_protection_decision_timing.replace_filters_days|0]-day filter replacement project in [FROM.GetName]."
cbrn_replace_state_mask_filters_complete_tt: "Consumes national respirator crates in proportion to distributed masks, missing filter life and local contamination. A shortage restores only the supported share."

cbrn_supply_occupied_population: "Supply the Occupied Population of [FROM.GetName]"
cbrn_supply_occupied_population_desc: "Distribute respirators through an occupied administration. Diversion, damaged records and hostile conditions increase the number of crates required, but credible protection reduces resistance and improves compliance."
cbrn_supply_occupied_population_begin_tt: "Begins a [?constant:cbrn_protection_decision_timing.occupied_distribution_days|0]-day occupied-population distribution project in [FROM.GetName]."
cbrn_supply_occupied_population_complete_tt: "Consumes available national stock to approach [?constant:cbrn_protection_program_effect.occupied_distribution_target_percent|0]% effective coverage in [FROM.GetName]. On delivery, Resistance changes by [?constant:cbrn_protection_program_effect.occupied_resistance_change|0] and Compliance by +[?constant:cbrn_protection_program_effect.occupied_compliance_change|0]."

cbrn_protect_hospitals_and_utilities: "Protect Hospitals and Utilities in [FROM.GetName]"
cbrn_protect_hospitals_and_utilities_desc: "Seal hospital intake rooms, protect water and power crews, and reserve filters for medical staff before the reported raid arrives."
cbrn_protect_hospitals_and_utilities_complete_tt: "Consumes [?FROM.cbrn_response_hospital_mask_cost|0] respirator crates and [?FROM.cbrn_response_hospital_support_cost|0] Support Equipment. For [?constant:cbrn_protection_decision_timing.response_effect_days|0] days, [FROM.GetName] gains protected medical capacity and suffers less medical saturation from chemical exposure."

cbrn_move_civilians_to_shelters: "Move Civilians to Shelters in [FROM.GetName]"
cbrn_move_civilians_to_shelters_desc: "Use trains, local transport and public shelters to reduce the population exposed when the reported raid arrives. Industry and military movement slow during the evacuation."
cbrn_move_civilians_to_shelters_complete_tt: "Consumes [?FROM.cbrn_response_shelter_support_cost|0] Support Equipment and [?FROM.cbrn_response_shelter_train_cost|0] Trains. For [?constant:cbrn_protection_decision_timing.response_effect_days|0] days, the civilian share exposed in [FROM.GetName] is multiplied by [?constant:cbrn_protection_response.shelter_exposed_fraction_mult|%0], with factory and movement disruption. This cannot be combined with an order to keep industry operating."

cbrn_sound_chemical_alarm: "Sound the Chemical Alarm in [FROM.GetName]"
cbrn_sound_chemical_alarm_desc: "Stop traffic, broadcast recognition drills and move workers to prepared cover. The warning improves effective protection but disrupts factories and military movement."
cbrn_sound_chemical_alarm_complete_tt: "For [?constant:cbrn_protection_decision_timing.response_effect_days|0] days, [FROM.GetName] gains [?constant:cbrn_protection_response.alarm_warning_bonus|0] Warning Protection and suffers temporary factory and movement disruption."

cbrn_keep_industry_operating: "Keep Industry Operating in [FROM.GetName]"
cbrn_keep_industry_operating_desc: "Reject a general shelter movement and keep factories at their stations. Production continues, but more civilians remain exposed if the raid arrives."
cbrn_keep_industry_operating_complete_tt: "For [?constant:cbrn_protection_decision_timing.response_effect_days|0] days, [FROM.GetName] gains local factory output while its civilian exposed share is multiplied by [?constant:cbrn_protection_response.industry_exposed_fraction_mult|%0]. This cannot be combined with moving civilians to shelters."

cbrn_chemical_alarm_disruption: "Chemical Alarm Disruption"
cbrn_chemical_alarm_disruption_desc: "Traffic controls, factory stoppages and local movement restrictions remain in effect while the chemical warning is active."
cbrn_civilian_shelter_disruption: "Civilian Shelter Movement"
cbrn_civilian_shelter_disruption_desc: "Workers and civilians are being moved into prepared cover, reducing exposure at the cost of factory output and local movement."
cbrn_hospitals_utilities_protected: "Protected Hospitals and Utilities"
cbrn_hospitals_utilities_protected_desc: "Medical wards, water crews and essential utility teams have protected intake rooms and reserved respirators."
cbrn_industry_kept_operating: "Industrial Continuity Order"
cbrn_industry_kept_operating_desc: "Factories remain at work during the chemical warning, preserving output while exposing more civilians."
cbrn_emergency_distribution_disruption: "Emergency Distribution Congestion"
cbrn_emergency_distribution_disruption_desc: "Hasty respirator issue has crowded transport, workplaces and local roads."
cbrn_protective_aid_received: "Protective Equipment Aid Delivered"
cbrn_protective_aid_received_desc: "Allied respirator shipments have strengthened civil protection and practical cooperation."

cbrn_protection.2.t: "Defects in the Reconditioned Batch"
cbrn_protection.2.desc: "Depot inspectors have found cracked seals, brittle straps and degraded filter media in part of the latest reconditioned respirator batch. The affected crates cannot be trusted for military issue or civilian protection. They must be withdrawn before false confidence turns a chemical warning into a mass-casualty incident."
cbrn_protection.2.a: "Withdraw every suspect crate."
cbrn_protection.2.a.tt: "Removes [?constant:cbrn_protection_program_effect.defective_batch_loss_ratio|%0] of the reconditioned batch, records the loss as replacement demand and changes Chemical Readiness by [?constant:cbrn_protection_program_effect.defective_batch_readiness_loss|0]."
