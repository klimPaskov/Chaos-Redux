l_english:
cbrn_program_management_category: "National CBRN Protection Program"
cbrn_program_management_category_desc: "Rebuild, produce, trade, and license protective equipment. Warehouse stocks protect troops and civilians only after they are distributed.\n\n$cbrn_program_management_status_desc$"
cbrn_civil_defence_category: "Civil Defence"
cbrn_civil_defence_category_desc: "Track civilian protection during alerts, contamination, and outbreaks. Mask issue depends on fit, filters, and supply crates. Field kits from production or trade serve troops first, then threatened states.\n\n$cbrn_civil_defence_status_desc$"

cbrn_recondition_old_masks: "Rebuild Old Masks"
cbrn_recondition_old_masks_desc: "Strip damaged facepieces, replace seals and combine serviceable components into low-reliability reserve crates. Reconditioned masks offer weaker protection and can fail depot inspection."
cbrn_recondition_old_masks_extra_cost: "£pol_power [This.GetCbrnReconditionPoliticalCost]  £support_equipment_text_icon [This.GetCbrnReconditionSupportCost]"
cbrn_recondition_old_masks_extra_cost_blocked: "$cbrn_recondition_old_masks_extra_cost$"
cbrn_recondition_political_cost_short: "§R[?black_friday_cbrn_recondition_masks_pp_cost|0]§!"
cbrn_recondition_political_cost_ready: "§Y[?black_friday_cbrn_recondition_masks_pp_cost|0]§!"
cbrn_recondition_support_cost_short: "§R[?black_friday_cbrn_recondition_masks_support_cost|0]§!"
cbrn_recondition_support_cost_ready: "§Y[?black_friday_cbrn_recondition_masks_support_cost|0]§!"
cbrn_recondition_old_masks_extra_cost_tooltip: "Requires [This.GetCbrnValueReconditionMasksFactories] available civilian factory. It remains assigned until the project finishes."
cbrn_recondition_old_masks_begin_tt: "Depot workshops begin sorting and rebuilding damaged respirators."
cbrn_recondition_old_masks_complete_tt: "Returns up to [This.GetCbrnValueReconditionActionMax] repaired respirator crates to the reserve. Inspection may uncover a defective batch."

cbrn_convert_civilian_mask_industry: "Convert Mask Factories"
cbrn_convert_civilian_mask_industry_desc: "Redirect rubber goods, filter media and civilian assembly lines toward a rapid run of basic respirators. This material-intensive conversion can rebuild a depleted reserve."
cbrn_convert_civilian_mask_industry_extra_cost: "£pol_power [This.GetCbrnConvertPoliticalCost]  £support_equipment_text_icon [This.GetCbrnConvertSupportCost]"
cbrn_convert_civilian_mask_industry_extra_cost_blocked: "$cbrn_convert_civilian_mask_industry_extra_cost$"
cbrn_convert_political_cost_short: "§R[?black_friday_cbrn_convert_mask_industry_pp_cost|0]§!"
cbrn_convert_political_cost_ready: "§Y[?black_friday_cbrn_convert_mask_industry_pp_cost|0]§!"
cbrn_convert_support_cost_short: "§R[?black_friday_cbrn_convert_mask_industry_support_cost|0]§!"
cbrn_convert_support_cost_ready: "§Y[?black_friday_cbrn_convert_mask_industry_support_cost|0]§!"
cbrn_convert_civilian_mask_industry_extra_cost_tooltip: "Requires [This.GetCbrnValueConvertIndustryFactories] available civilian factories. They remain assigned until the project finishes."
cbrn_convert_civilian_mask_industry_begin_tt: "Civilian rubber and filter lines are converted for respirator production."
cbrn_convert_civilian_mask_industry_complete_tt: "Adds [This.GetCbrnValueConvertIndustryBasicCrates] Basic Respirator Crates to national stock."

cbrn_simplify_filters_for_mass_issue: "Simplify Mask Filters"
cbrn_simplify_filters_for_mass_issue_desc: "Use simpler canisters and fittings to stretch scarce material across a larger emergency production run. During the program, distribution uses fewer crates, while new masks offer weaker protection and shorter filter life."
cbrn_simplify_filters_for_mass_issue_extra_cost: "£pol_power [This.GetCbrnSimplifyPoliticalCost]  £support_equipment_text_icon [This.GetCbrnSimplifySupportCost]"
cbrn_simplify_filters_for_mass_issue_extra_cost_blocked: "$cbrn_simplify_filters_for_mass_issue_extra_cost$"
cbrn_simplify_political_cost_short: "§R[?black_friday_cbrn_simplify_filters_pp_cost|0]§!"
cbrn_simplify_political_cost_ready: "§Y[?black_friday_cbrn_simplify_filters_pp_cost|0]§!"
cbrn_simplify_support_cost_short: "§R[?black_friday_cbrn_simplify_filters_support_cost|0]§!"
cbrn_simplify_support_cost_ready: "§Y[?black_friday_cbrn_simplify_filters_support_cost|0]§!"
cbrn_simplify_filters_for_mass_issue_extra_cost_tooltip: "Requires [This.GetCbrnValueSimplifyFiltersFactories] available civilian factories. They remain assigned until the project finishes."
cbrn_simplify_filters_for_mass_issue_begin_tt: "Factories adopt simplified filter media, fittings and inspection standards."
cbrn_simplify_filters_for_mass_issue_complete_tt: "Adds [This.GetCbrnValueSimplifyFiltersBasicCrates] Basic Respirator Crates. For [This.GetCbrnValueSimplifiedFilterProgramDays] days, distribution uses fewer crates but issues masks with weaker protection and poorer filters."

cbrn_export_protective_equipment: "Export Protective Equipment to [FROM.GetNameDef]"
cbrn_export_protective_equipment_desc: "Reserve a protected shipment for an allied civil-defence program or an exact humanitarian CBRN corridor partner. Old and reconditioned models are selected first so modern frontline issue is preserved."
cbrn_export_protective_equipment_extra_cost: "£pol_power [This.GetCbrnExportPoliticalCost]  £GFX_gas_mask_equipment_1_medium [This.GetCbrnExportMaskCost]  £civ_factory [This.GetCbrnExportFactoryCost]"
cbrn_export_protective_equipment_extra_cost_blocked: "$cbrn_export_protective_equipment_extra_cost$"
cbrn_export_political_cost_short: "§R[This.GetCbrnValueExportMasksPp]§!"
cbrn_export_political_cost_ready: "§Y[This.GetCbrnValueExportMasksPp]§!"
cbrn_export_mask_cost_short: "§R[This.GetCbrnValueExportMasksCrates]§!"
cbrn_export_mask_cost_ready: "§Y[This.GetCbrnValueExportMasksCrates]§!"
cbrn_export_factory_cost_short: "§R[This.GetCbrnValueExportMasksFactories]§!"
cbrn_export_factory_cost_ready: "§Y[This.GetCbrnValueExportMasksFactories]§!"
cbrn_export_protective_equipment_extra_cost_tooltip: "A stockpile of at least [This.GetCbrnValueExportMinimumReserve] respirator crates is required to authorize export. The civilian factory remains assigned during preparation; crates leave on completion."
cbrn_export_protective_equipment_begin_tt: "Prepares a protected shipment, drawing on older and reconditioned respirators first."
cbrn_export_protective_equipment_complete_tt: "Transfers respirator crates to [FROM.GetNameDef], using older models first. The recipient records the aid and gains a favorable opinion. If [ROOT.GetNameDef] already meets international compliance terms, the shipment may ease a small share of current Condemnation. Evidence, attribution, casualties, contamination and confirmed use remain on record. The shipment is cancelled if either partner or the reserve becomes ineligible."

cbrn_import_protective_equipment: "Import Protective Equipment from [FROM.GetNameDef]"
cbrn_import_protective_equipment_desc: "Request an emergency allied transfer while domestic reserves remain inadequate. The supplying ally sends older models first."
cbrn_import_protective_equipment_begin_tt: "Negotiates and prepares an allied shipment of [This.GetCbrnValueImportMasksCrates] respirator crates."
cbrn_import_protective_equipment_complete_tt: "[FROM.GetNameDef] transfers [This.GetCbrnValueImportMasksCrates] respirator crates, using its older models first."

cbrn_license_foreign_respirator_design: "License [FROM.GetAdjective] Respirator Designs"
cbrn_license_foreign_respirator_design_desc: "Acquire allied drawings, filter standards and fitting data from a partner with more advanced protective equipment."
cbrn_license_foreign_respirator_design_begin_tt: "Technical missions compare [FROM.GetAdjective] respirator designs with domestic production standards."
cbrn_license_foreign_respirator_design_complete_tt: "Adds a [This.GetCbrnValueLicenseDesignUses]-use [This.GetCbrnValueLicenseDesignBonus] research bonus for Gas Mask technologies."
cbrn_foreign_respirator_design_bonus: "Licensed Respirator Design"

cbrn_emergency_state_mask_distribution: "Emergency Masks: [FROM.GetName]"
cbrn_emergency_state_mask_distribution_desc: "Release a one-time emergency surge of available crates in [FROM.GetName] during a verified warning or confirmed contamination. Routine distribution continues without this order; the immediate surge reaches fewer people, wastes more stock, and starts with degraded filters. Congestion temporarily disrupts local production and movement."
cbrn_emergency_mask_distribution_quote: "[?cbrn_mask_reservation_quote|.0]"
cbrn_emergency_state_mask_distribution_cost: "£pol_power §Y[This.GetCbrnValueEmergencyDistributionPp]§!  £GFX_gas_mask_equipment_1_medium §Y[This.GetCbrnEmergencyMaskDistributionQuote]§!"
cbrn_emergency_state_mask_distribution_cost_blocked: "£pol_power §R[This.GetCbrnValueEmergencyDistributionPp]§!  £GFX_gas_mask_equipment_1_medium §R[This.GetCbrnEmergencyMaskDistributionQuote]§!"
cbrn_emergency_state_mask_distribution_cost_tooltip: "Political Power and the displayed respirator crates are spent when the order is given. The shipment is limited to available national stock."
cbrn_emergency_state_mask_distribution_complete_tt: "A hurried issue approaches [This.GetCbrnValueEmergencyTargetPercent]% emergency coverage in [FROM.GetName] with poorer fitting and filters than an organized project. Congestion disrupts the state for [This.GetCbrnValueEmergencyDistributionDisruptionDays] days if crates are delivered."

cbrn_supply_occupied_population: "Occupied Mask Program"
cbrn_supply_occupied_population_desc: "Distribute respirators in occupied states facing a verified chemical warning or contamination. The national program covers non-core populations outside ordinary priority allocation. Diversion, damaged records and hostile conditions increase the crates required. Credible protection reduces resistance and improves compliance wherever delivery succeeds."
cbrn_occupied_mask_reservation_quote: "[?cbrn_mask_reservation_quote|.0]"
cbrn_supply_occupied_population_cost: "£pol_power §Y[This.GetCbrnValueOccupiedDistributionPp]§!  £GFX_gas_mask_equipment_1_medium §Y[This.GetCbrnOccupiedMaskReservationQuote]§!  £civ_factory §Y[This.GetCbrnValueOccupiedDistributionFactories]§!"
cbrn_supply_occupied_population_cost_blocked: "£pol_power §R[This.GetCbrnValueOccupiedDistributionPp]§!  £GFX_gas_mask_equipment_1_medium §R[This.GetCbrnOccupiedMaskReservationQuote]§!  £civ_factory §R[This.GetCbrnValueOccupiedDistributionFactories]§!"
cbrn_supply_occupied_population_cost_tooltip: "Political Power is spent and the displayed respirator crates are reserved when selected. Civilian factories remain assigned during the program. Unused crates return to the reserve if the program ends early or a state can no longer receive them."
cbrn_supply_occupied_population_begin_tt: "Begins a [This.GetCbrnValueOccupiedDistributionDays]-day delivery program. Eligible occupied states receive crates from the reserved shipment."
cbrn_supply_occupied_population_complete_tt: "Delivers reserved crates toward [This.GetCbrnValueOccupiedDistributionTargetPercent]% effective coverage. Each successful delivery changes Resistance by [This.GetCbrnValueOccupiedResistanceChange] and Compliance by +[This.GetCbrnValueOccupiedComplianceChange]. Unused crates return to the reserve."

cbrn_protect_hospitals_and_utilities: "Protect Hospitals: [FROM.GetName]"
cbrn_protect_hospitals_and_utilities_desc: "Seal hospital intake rooms, protect water and power crews, and reserve filters for medical staff before the reported raid arrives."
cbrn_protect_hospitals_and_utilities_cost: "£pol_power §Y[This.GetCbrnValueProtectHospitalsPp]§!  £GFX_gas_mask_equipment_1_medium §Y[?FROM.cbrn_response_hospital_mask_cost|0]§!  £support_equipment_text_icon §Y[?FROM.cbrn_response_hospital_support_cost|0]§!"
cbrn_protect_hospitals_and_utilities_cost_blocked: "£pol_power §R[This.GetCbrnValueProtectHospitalsPp]§!  £GFX_gas_mask_equipment_1_medium §R[?FROM.cbrn_response_hospital_mask_cost|0]§!  £support_equipment_text_icon §R[?FROM.cbrn_response_hospital_support_cost|0]§!"
cbrn_protect_hospitals_and_utilities_cost_tooltip: "The displayed resources are consumed when the hospital order is given in [FROM.GetName]."
cbrn_protect_hospitals_and_utilities_complete_tt: "For [This.GetCbrnValueResponseEffectDays] days, [FROM.GetName] gains protected medical capacity and suffers less medical saturation from chemical exposure."

cbrn_move_civilians_to_shelters: "Move to Shelters: [FROM.GetName]"
cbrn_move_civilians_to_shelters_desc: "Use trains, local transport and public shelters to reduce the population exposed when the reported raid arrives. Industry and military movement slow during the evacuation."
cbrn_move_civilians_to_shelters_complete_tt: "For [This.GetCbrnValueResponseEffectDays] days, shelters reduce the civilian share exposed in [FROM.GetName] to [This.GetCbrnValueShelterExposedFractionMult] of its normal level. Factories and military movement slow. This order cannot be combined with keeping industry operating."
black_friday_cbrn_move_civilians_to_shelters_cost: "£pol_power §Y[?black_friday_cbrn_shelter_pp_cost|0]§!  £support_equipment_text_icon §Y[?black_friday_cbrn_shelter_support_cost|0]§!  £GFX_train_texticon §Y[?black_friday_cbrn_shelter_train_cost|0]§!"
black_friday_cbrn_move_civilians_to_shelters_cost_blocked: "£pol_power §R[?black_friday_cbrn_shelter_pp_cost|0]§!  £support_equipment_text_icon §R[?black_friday_cbrn_shelter_support_cost|0]§!  £GFX_train_texticon §R[?black_friday_cbrn_shelter_train_cost|0]§!"
black_friday_cbrn_move_civilians_to_shelters_cost_tooltip: "The displayed resources are consumed when the shelter order is given."

cbrn_sound_chemical_alarm: "Sound the Chemical Alarm in [FROM.GetName]"
cbrn_sound_chemical_alarm_desc: "Stop traffic, broadcast recognition drills and move workers to prepared cover. The warning improves effective protection and disrupts factories and military movement."
cbrn_sound_chemical_alarm_complete_tt: "For [This.GetCbrnValueResponseEffectDays] days, [FROM.GetName] gains [This.GetCbrnValueAlarmWarningBonus] Warning Protection and suffers temporary factory and movement disruption."

cbrn_keep_industry_operating: "Keep Industry Operating in [FROM.GetName]"
cbrn_keep_industry_operating_desc: "Reject a general shelter movement and keep factories at their stations. Production continues with more civilians exposed if the raid arrives."
cbrn_keep_industry_operating_complete_tt: "For [This.GetCbrnValueResponseEffectDays] days, [FROM.GetName] gains local factory output while civilian exposure rises to [This.GetCbrnValueIndustryExposedFractionMult] of its normal level. This order cannot be combined with moving civilians to shelters."

cbrn_chemical_alarm_disruption: "Chemical Alarm Disruption"
cbrn_chemical_alarm_disruption_desc: "Traffic controls, factory stoppages and local movement restrictions remain in effect while the chemical warning is active."
cbrn_civilian_shelter_disruption: "Civilian Shelter Movement"
cbrn_civilian_shelter_disruption_desc: "Workers and civilians are being moved into prepared cover, reducing exposure at the cost of factory output and local movement."
cbrn_hospitals_utilities_protected: "Protected Hospitals and Utilities"
cbrn_hospitals_utilities_protected_desc: "Medical wards, water crews and essential utility teams have protected intake rooms and reserved respirators."
cbrn_industry_kept_operating: "Industrial Continuity Order"
cbrn_industry_kept_operating_desc: "Factories remain at work during the chemical warning, preserving output and exposing more civilians."
cbrn_emergency_distribution_disruption: "Emergency Distribution Congestion"
cbrn_emergency_distribution_disruption_desc: "Hasty respirator issue has crowded transport, workplaces and local roads."
cbrn_protective_aid_received: "Protective Equipment Aid Delivered"
cbrn_protective_aid_received_desc: "Allied respirator shipments have strengthened civil protection and practical cooperation."

cbrn_protection.2.t: "Defects in the Reconditioned Batch"
cbrn_protection.2.desc: "Depot inspectors have found cracked seals, brittle straps and degraded filter media in part of the latest reconditioned respirator batch. The affected crates cannot be trusted for military issue or civilian protection. They must be withdrawn before false confidence turns a chemical warning into a mass-casualty incident."
cbrn_protection.2.a: "Withdraw every suspect crate."
cbrn_protection.2.a.tt: "Withdraws [This.GetCbrnValueDefectiveBatchLossRatio] of the reconditioned batch. Routine issue draws usable stock to replace the lost protection."
