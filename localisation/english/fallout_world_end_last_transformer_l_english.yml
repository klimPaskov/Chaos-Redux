l_english:
 chaosx.fallout.243.t: "The Last Transformer"
 chaosx.fallout.243.d: "A transformer at the edge of [This.GetName] still carries one useful circuit. The workshop crew can strip an industrial line, keep a clinic circuit alive, split the feeders among nearby districts, or ask a neighbouring authority for technicians. Power will buy only one plan, and the chosen state will carry the memory of the decision."
 chaosx.fallout.243.a: "Strip the industrial line"
 chaosx.fallout.243.a.tt: "Pay 2 Power and remove one operational civilian factory level, or one operational military factory level when no civilian level remains. The result arrives after 10 days."
 chaosx.fallout.243.b: "Protect the clinic circuit"
 chaosx.fallout.243.b.tt: "Pay 5 Power and 4 Medicine to route the remaining load through a protected clinical circuit. The result arrives after 10 days."
 chaosx.fallout.243.c: "Separate the feeder districts"
 chaosx.fallout.243.c.tt: "Pay 4 Power and 6 Scrap to divide the load among local feeder crews. The result arrives after 10 days."
 chaosx.fallout.243.e: "Request neighbouring technicians"
 chaosx.fallout.243.e.tt: "Pay 3 Power and 4 Recognition when an eligible AI-controlled neighbour is available. The result arrives after 10 days."

 chaosx.fallout.245.t: "The Industrial Line Answers"
 chaosx.fallout.245.success.d: "The stripped line feeds the remaining workshops with a steadier current. Scrap crews have recovered usable metal, and the state can reclaim ground around the switch house."
 chaosx.fallout.245.partial.d: "The industrial line gives a weak current to the workshops. The factory loss has become a grievance among the crews, yet the state retains one more supply route."
 chaosx.fallout.245.failure.d: "The line was stripped, but the final transformer could not carry the load. The workshops fall silent, the feeder loses capacity, and people near the damaged substation die in the cold."
 chaosx.fallout.245.a: "Record the industrial settlement"
 chaosx.fallout.245.a.tt: "Resolve the industrial result and schedule the callback for 120 days later."

 chaosx.fallout.246.t: "The Clinic Circuit Holds"
 chaosx.fallout.246.success.d: "The clinic receives a protected circuit. Ward lamps return one room at a time, and its staff gain the authority to ration the current without closing the doors."
 chaosx.fallout.246.partial.d: "Only some wards receive the protected current. The clinic keeps its doors open, though each room must wait for its turn at the switchboard."
 chaosx.fallout.246.failure.d: "The clinic circuit failed under the load. Medicine was lost in the dark wards, the supply route weakened, and exposure rose around the waiting rooms."
 chaosx.fallout.246.a: "Let the ward crews continue"
 chaosx.fallout.246.a.tt: "Resolve the clinical result and schedule the callback for 120 days later."

 chaosx.fallout.247.t: "Feeder Districts Separate"
 chaosx.fallout.247.success.d: "Local crews isolate the feeder districts and keep small loads alive. The switch houses become municipal meeting points, and the reclaimed streets around them begin to function again."
 chaosx.fallout.247.partial.d: "The districts receive uneven current. Some workshops and homes recover while other streets wait for cable and labour."
 chaosx.fallout.247.failure.d: "The local feeders burned through their last margin. Supply access collapsed, exposure rose around the switch houses, and the infrastructure took repairable damage."
 chaosx.fallout.247.a: "Trust the feeder councils"
 chaosx.fallout.247.a.tt: "Resolve the municipal result and schedule the callback for 120 days later."

 chaosx.fallout.248.t: "Technicians Cross the Border"
 chaosx.fallout.248.success.d: "Technicians from a neighbouring authority bring a compatible switching plan. The circuit steadies, recovery crews clear the approaches, and the agreement earns a place in the state's memory."
 chaosx.fallout.248.partial.d: "The technicians lend switchgear and restore one route, but the borrowed arrangement leaves [This.GetName] dependent on outside schedules."
 chaosx.fallout.248.failure.d: "The technicians arrived after the last workable window. Recognition was spent, the supply route weakened, and the state must carry the failure without changing its neighbour's affairs."
 chaosx.fallout.248.a: "Seal the technical record"
 chaosx.fallout.248.a.tt: "Resolve the neighbour result and schedule the callback for 120 days later."

 chaosx.fallout.253.t: "The Grid Memory Settles"
 chaosx.fallout.253.success.d: "The emergency circuit has become an institution. The state now remembers who held the switches, where the crews worked, and which promise will be demanded when the next transformer fails."
 chaosx.fallout.253.partial.d: "The emergency arrangement survives as a contested institution. Its workshops, wards, feeder crews, or outside technicians still shape how [This.GetName] distributes power."
 chaosx.fallout.253.failure.d: "The emergency arrangement leaves a liability in the state record. The crews know which rooms went dark, and the next repair will begin under that memory."
 chaosx.fallout.253.a: "Close the transformer ledger"
 chaosx.fallout.253.a.tt: "Apply the callback memory and release the result and callback receipts."

