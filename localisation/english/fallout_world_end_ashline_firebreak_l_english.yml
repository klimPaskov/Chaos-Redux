l_english:
  chaosx.fallout.554.t: "The Ashline Reaches the Shelter Roofs"
  chaosx.fallout.554.d: "The open aftermath card for [This.GetName] points to a state where the old fire line and the new ash have become one problem. Wildfire smoke, volcanic grit, and the frozen season are settling into roof seams, wells, and road cuts. The natural disaster has already added its small capped air burden. What we decide here is how many people must work in the dirty snow to keep the state alive."
  chaosx.fallout.554.a: "Cut a firebreak through the ash grass"
  chaosx.fallout.554.a.tt: "Spend Scrap and Fuel. Improve adaptation and reclamation if the crews can keep the line open."
  chaosx.fallout.554.b: "Seal the roofs before the next fall"
  chaosx.fallout.554.b.tt: "Spend Shelter Capacity and Scrap. Protect indoor medicine and water at the cost of a slower surface recovery."
  chaosx.fallout.554.c: "Put the military on the ash road"
  chaosx.fallout.554.c.tt: "Spend Power and Fuel. Secure the route for operations and evacuation while civilian stores are diverted."
  chaosx.fallout.555.t: "Ashline Firebreak orders"
  chaosx.fallout.556.t: "The Firebreak Report"
  chaosx.fallout.556.success.d: "The crews reached the black grass before the wind turned. Their firebreak is narrow, but it gives the state a clean lane for snowmelt, repair teams, and guarded food carts. The road remains ugly. It is no longer a trap."
  chaosx.fallout.556.partial.d: "The line holds in the valley and fails on the ridge. The crews saved the road at the cost of shelters and sleep. The first thaw can use the cut, but every movement still raises ash."
  chaosx.fallout.556.failure.d: "A gust carried the fire across the marked line. The work party vanished into smoke and frost, and the road crews abandoned their tools. The state loses people, buildings, and the confidence to reopen its outer lanes."
  chaosx.fallout.556.a: "Read the firebreak report"
  chaosx.fallout.556.a.tt: "Apply the delayed Air Winter, Deaths, supply, building, military, and memory consequences. A callback is scheduled for the next ash season."
  chaosx.fallout.557.t: "Roof Seal Review"
  chaosx.fallout.557.success.d: "The shelter wardens covered the vents with stitched filters and packed the roof seams with snow clay. Indoor clinics report fewer ash fevers. The roofs will not last forever, but the state has bought a season in which children can sleep without a mask."
  chaosx.fallout.557.partial.d: "The main hall is sealed, while the small houses still breathe the grey air. Medicine is protected in the centre and scarce at the edge. The compromise keeps the card open without making the roofs safe."
  chaosx.fallout.557.failure.d: "The roof teams ran out of dry material while ash filled the rafters. A ward collapsed into a clinic store and the remaining shelters closed their doors. Exposure and sickness rise as the state loses another piece of its winter capacity."
  chaosx.fallout.557.a: "Open the roof ledger"
  chaosx.fallout.557.a.tt: "Apply the delayed shelter, disease, supply, building, Air Winter, and memory consequences."
  chaosx.fallout.558.t: "The Ash Road Cordon"
  chaosx.fallout.558.success.d: "The cordon officers marked a safe road through the ash and put a medic at each gate. Military traffic moves slowly, but it moves with a ledger. The government has kept the state connected without pretending the road is clean."
  chaosx.fallout.558.partial.d: "The cordon protects the central road and abandons two side tracks. Units can still reach the state, though every convoy consumes food and fuel that the villages expected to see. The ash road is held, not healed."
  chaosx.fallout.558.failure.d: "The first military convoy crossed a frozen wash and broke its wheels. The cordon scattered, the side roads closed, and the ash settled into the last working stores. Operations lose a route and the state loses people to exposure and disease."
  chaosx.fallout.558.a: "Seal the cordon report"
  chaosx.fallout.558.a.tt: "Apply the delayed military, supply, disease, building, Air Winter, and memory consequences."
  chaosx.fallout.559.t: "Firebreak report"
  chaosx.fallout.560.t: "Roof seal report"
  chaosx.fallout.561.t: "Cordon report"
  chaosx.fallout.562.t: "The Next Ash Season"
  chaosx.fallout.562.success.d: "The next ash season finds the state changed. The first repair teams can work under a roof, the guarded road has a schedule, and the firebreak is now part of the winter map. Recovery is still local, but it has a memory."
  chaosx.fallout.562.partial.d: "The callback closes one ledger and opens another. The state can repair a short road and shelter a few more families, yet the old ash line still dictates where the government can promise help."
  chaosx.fallout.562.failure.d: "The second review finds the state poorer than the first report admitted. Ash has entered the new stores, the road crews are short of people, and the next winter will begin with a weaker shelter line."
  chaosx.fallout.562.a: "Record the next ash season"
  chaosx.fallout.562.a.tt: "Apply the callback and release both delayed receipts. The state memory remains for later Fallout chains."
  fallout.event_log.ashline_firebreak.name: "Ashline Firebreak"
  fallout.event_log.ashline_firebreak.detail.cut_success: "Firebreak crews secured a clean lane through the ash aftermath."
  fallout.event_log.ashline_firebreak.detail.cut_partial: "Firebreak crews held the valley road but lost the ridge line."
  fallout.event_log.ashline_firebreak.detail.cut_failure: "The firebreak failed and the ash road was abandoned."
  fallout.event_log.ashline_firebreak.detail.seal_success: "Shelter wardens sealed the roofs and reduced indoor ash sickness."
  fallout.event_log.ashline_firebreak.detail.seal_partial: "The main shelter was sealed while outer homes remained exposed."
  fallout.event_log.ashline_firebreak.detail.seal_failure: "Roof seals failed and a winter clinic store collapsed."
  fallout.event_log.ashline_firebreak.detail.cordon_success: "A military ash-road cordon restored guarded movement through the state."
  fallout.event_log.ashline_firebreak.detail.cordon_partial: "The cordon held the central road and abandoned the side tracks."
  fallout.event_log.ashline_firebreak.detail.cordon_failure: "The ash-road convoy failed and operations lost the route."
  fallout.event_log.ashline_firebreak.detail.callback_success: "The next ash season opened a durable local repair lane."
  fallout.event_log.ashline_firebreak.detail.callback_partial: "The next ash season closed one ledger while leaving the outer road exposed."
  fallout.event_log.ashline_firebreak.detail.callback_failure: "The next ash season found the state with fewer people and weaker shelters."
