l_english:
UWR_blacksite_command: "Blacksite Command Charter"
UWR_blacksite_command_desc: "The directorate gives its secret laboratories a single command ledger, tying breakthrough work to depots, officers, and the war that must protect it."
UWR_cold_chain_foundries: "Cold-Chain Foundries"
UWR_cold_chain_foundries_desc: "Factories beside the chemical stores will make the research program durable enough to supply both the laboratory and the front."
UWR_registry_of_containment: "Registry of Containment"
UWR_registry_of_containment_desc: "Every recovered weapon and every experiment camp receives a guarded entry, turning the pathogen republic's terror into an organized field system."
UWR_release_authority_commissions: "Release Authority Commissions"
UWR_release_authority_commissions_desc: "Commissions decide when field releases become military operations, issuing columns, claims, and a mandate that can survive the first battle."
UWR_quarantine_corridor_protocols: "Quarantine Corridor Protocols"
UWR_quarantine_corridor_protocols_desc: "Foreign intermediaries are offered controlled corridors and recognition in exchange for keeping the republic's laboratories supplied and feared."
UWR_field_release_supply_chain: "Field-Release Supply Chain"
UWR_field_release_supply_chain_desc: "Supply nodes and repair depots follow the release columns, because an operation without fuel, roads, and replacement crews is only a story."
UWR_directorate_of_last_resort: "Directorate of Last Resort"
UWR_directorate_of_last_resort_desc: "The directorate accepts the final burden of the collapse: claims, assault columns, and a breakaway war fought under the quarantine seal."
KMB_subsoil_deepening_commission: "Subsoil Deepening Commission"
KMB_subsoil_deepening_commission_desc: "Mining engineers turn the first basin ledger into a continuing extraction programme, sending deeper seams, safer galleries, and larger ore trains into the Board's industrial reserve."
KMB_furnace_procurement_board: "Furnace Procurement Board"
KMB_furnace_procurement_board_desc: "The board binds pitheads, furnaces, and the first coal-golem contracts into an armed industrial chain rather than a collection of local quotas."
KMB_treaty_corridor_guards: "Treaty Corridor Guards"
KMB_treaty_corridor_guards_desc: "Resource treaties need escorts, depots, and a factory reserve, so the export road cannot be closed by the first rival who reads the ledger."
KMB_oil_shale_convoy_pool: "Oil-Shale Convoy Pool"
KMB_oil_shale_convoy_pool_desc: "Oil shale is assigned to a convoy pool that feeds trucks, fuel reserves, and the depots required to move the basin's heavy columns."
KMB_golem_foundry_council: "Golem Foundry Council"
KMB_golem_foundry_council_desc: "Foundry foremen receive a common template and field mandate, turning coal-golem columns into a planned military arm instead of an emergency spectacle."
KMB_basin_concession_court: "Basin Concession Court"
KMB_basin_concession_court_desc: "The court prepares claims, treaty pressure, and the legal machinery for taking a neighboring basin when bargaining fails."
KMB_orefront_mobilization: "Orefront Mobilization"
KMB_orefront_mobilization_desc: "The mining board sends its accumulated contracts to the orefront: golem columns, assault formations, and a settlement crisis that cannot be postponed."
