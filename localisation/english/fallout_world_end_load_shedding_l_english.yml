chaosx.fallout.803.t: "Load Shedding at the Reactor Keeps"
chaosx.fallout.803.opening.d: "The Manchurian Reactor Keeps has one reliable turbine circuit and four places that need it. The hospital ward is losing its sterilizer, the food depots cannot keep their cold rooms closed, the repair halls are waiting on a live crane, and the perimeter lamps are going dark along the ash road. The Engineer Franchise left a power board behind, but its first season will be judged by the order in which it lets people go cold."
chaosx.fallout.803.a: "Hold the hospital circuit"
chaosx.fallout.803.a.tt: "Spend Food 1, Medicine 4, and Recognition 1 to keep the sterilizer, oxygen pumps, and clinic radio on. The ward gains trust while repair capacity and the grid reserve are consumed."
chaosx.fallout.803.b: "Keep the food depots cold"
chaosx.fallout.803.b.tt: "Spend Fuel 2, Recognition 2, and Cohesion 3 to protect cold rooms and ration scales. Food handling improves, but the power board must accept a public queue for every other sector."
chaosx.fallout.803.c: "Feed the repair halls"
chaosx.fallout.803.c.tt: "Spend Scrap 3, Power 3, and Medicine 1 to run cranes and salvage presses through the ash cycle. Industry gains a working margin while technicians and scrap stores carry the burden."
chaosx.fallout.803.d: "Light the perimeter"
chaosx.fallout.803.d.tt: "Spend Food 2, Fuel 3, and Recognition 2 to keep the patrol road, radio mast, and gate sensors alive. The perimeter holds, but the reserve and technical roster shrink."
chaosx.fallout.804.t: "Load Shedding at the Reactor Keeps"
chaosx.fallout.805.t: "The Next Circuit"
chaosx.fallout.805.hospital_priority.success.d: "The hospital ward received the first live circuit. Its sterilizer and oxygen pumps ran through the ash night, and the ward clerks published every diverted kilowatt on the public board. The food depots and repair halls accepted the loss because the schedule gave them a named hour to work."
chaosx.fallout.805.hospital_priority.partial.d: "The hospital circuit held until the coldest watch, then the turbine voltage fell below the sterilizer threshold. The ward survived on hand pumps and shared medicine, while the power board gained a promise that the next schedule would name the failure before it happened."
chaosx.fallout.805.hospital_priority.failure.d: "The ward circuit failed during a sterilizer cycle. The hospital lost medicine, the turbine crew lost its last reserve, and the power board now faces a choice between an emergency repair and a public inquiry into the diverted current."
chaosx.fallout.805.food_priority.success.d: "The food depots kept their cold rooms closed through the ash cycle. Grain, fermented vegetables, and the remaining seed stores were weighed in public, so the repair halls could see exactly why their cranes were idle. The ration queue became a civic institution instead of a guarded door."
chaosx.fallout.805.food_priority.partial.d: "The food depots held the cold rooms for most of the week, but two doors thawed before the reserve circuit returned. The public queue kept the loss visible, though the eastern shelters now expect the next ration call to include their own tally clerks."
chaosx.fallout.805.food_priority.failure.d: "The depot circuit went dark while the night crew was moving the grain ledger. Fuel was spent without keeping the cold rooms shut, and the food queue has become a contest between the reactor keep and the shelters along the ash road."
chaosx.fallout.805.industry_priority.success.d: "The repair halls received enough current to run one crane, one lathe, and the salvage press. They rebuilt a clinic valve before dawn and posted the parts list beside the power schedule. The technate gained a working margin, although every repair now carries a cost in scrap and exhausted hands."
chaosx.fallout.805.industry_priority.partial.d: "The repair halls ran in short windows and returned one crane to service. The turbine kept its voltage, but the parts queue still reaches beyond the next ash storm, and the hospital ward has begun keeping its own reserve instead of trusting the public board."
chaosx.fallout.805.industry_priority.failure.d: "A repair press seized when the circuit dropped under load. Scrap stores were consumed clearing the jam, a clinic valve remained broken, and the power board has lost the confidence of the technicians who kept the reactor keep alive."
chaosx.fallout.805.defense_priority.success.d: "The perimeter lamps and radio mast stayed live along the ash road. Patrols could see the gate sensors, the garrison returned its spare fuel to the depot, and the neighboring shelters received a clear warning before the next dust front crossed the pass."
chaosx.fallout.805.defense_priority.partial.d: "The perimeter held through the first night and failed along the eastern road before the second. The garrison kept the radio mast alive, but food depots and hospital clerks now demand a written hour for their own circuit."
chaosx.fallout.805.defense_priority.failure.d: "The gate sensors went dark while the patrol road was under ash. Fuel and recognition were spent without restoring the lamps, and the power board must answer whether the perimeter was protected for the keep or for the people living beyond its wire."
chaosx.fallout.805.a: "Record the circuit order"
chaosx.fallout.805.a.tt: "Apply the delayed Load Shedding result, update the Air Winter and Supply Access ledgers, write the sector memory, and schedule a first-winter review."
chaosx.fallout.807.t: "The First-Winter Load Review"
chaosx.fallout.807.success.d: "The first-winter review found a power board with a named order, a working reserve ledger, and enough trust to publish the next outage before it reached the wards. The Manchurian Reactor Keeps still has competing sectors, but its circuit decisions can now be challenged without opening the turbine doors."
chaosx.fallout.807.partial.d: "The grid reached the first-winter review, though its schedule still depends on one exhausted crew and a reserve that cannot cover two cold nights. The hospital, depot, repair hall, and perimeter each hold a different memory of the first cut."
chaosx.fallout.807.failure.d: "The first-winter review found a power board that had spent its reserve without earning a public schedule. The reactor keep has lower supply, damaged infrastructure, and four sectors prepared to keep their own ledgers apart from the technate."
chaosx.fallout.807.a: "Close the first-winter review"
chaosx.fallout.807.a.tt: "Apply the delayed review, record the final sector memory, release the reserved district and neighboring state rows, and clear the chain receipts."
