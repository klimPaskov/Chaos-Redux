fallout.event_log.load_shedding.detail.choice_hospital_priority: "The reactor keep gave the first circuit to its hospital ward."
fallout.event_log.load_shedding.detail.choice_food_priority: "The reactor keep kept its food depots cold before the other sectors."
fallout.event_log.load_shedding.detail.choice_industry_priority: "The reactor keep fed a repair hall and salvage press through the ash cycle."
fallout.event_log.load_shedding.detail.choice_defense_priority: "The reactor keep lit its perimeter road and radio mast."
fallout.event_log.load_shedding.detail.hospital_priority_success: "The hospital circuit held and the power board published the diverted load."
fallout.event_log.load_shedding.detail.hospital_priority_partial: "The hospital circuit held until a cold watch, then voltage fell below the sterilizer threshold."
fallout.event_log.load_shedding.detail.hospital_priority_failure: "The ward circuit failed during a sterilizer cycle and the public board lost its reserve."
fallout.event_log.load_shedding.detail.food_priority_success: "The food depots protected cold rooms and turned the ration queue into a civic ledger."
fallout.event_log.load_shedding.detail.food_priority_partial: "The food depots held most cold rooms, but two eastern doors thawed before the reserve returned."
fallout.event_log.load_shedding.detail.food_priority_failure: "The depot circuit went dark while the grain ledger was being moved."
fallout.event_log.load_shedding.detail.industry_priority_success: "The repair halls restored a crane and a clinic valve with the protected circuit."
fallout.event_log.load_shedding.detail.industry_priority_partial: "The repair halls worked in short windows while the parts queue outlasted the ash storm."
fallout.event_log.load_shedding.detail.industry_priority_failure: "A repair press seized under load and the technicians withdrew their confidence."
fallout.event_log.load_shedding.detail.defense_priority_success: "The perimeter lamps and radio mast stayed live along the ash road."
fallout.event_log.load_shedding.detail.defense_priority_partial: "The eastern perimeter road went dark while the radio mast remained live."
fallout.event_log.load_shedding.detail.defense_priority_failure: "The gate sensors failed and the power board could not explain the diverted fuel."
fallout.event_log.load_shedding.detail.callback_success: "The first-winter review made the circuit order a public institution."
fallout.event_log.load_shedding.detail.callback_partial: "The grid survived its first winter while every sector kept a different reserve ledger."
fallout.event_log.load_shedding.detail.callback_failure: "The first-winter review found a spent reserve and four sector ledgers outside the technate."
fallout.event_log.load_shedding.detail.cancelled: "The circuit record was cancelled after its district, neighbor, owner, controller, or generation changed."
