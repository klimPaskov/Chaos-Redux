concentration_camps_mission_contain_escape: "Contain the Escape Networks"
concentration_camps_mission_contain_escape_desc: "The camps are watched harder, and the prisoners' organizers know it. Resistance pressure has to fall back to disorganized opposition before the escapes begin."
concentration_camps_mission_escape_objective_tt: "Resistance pressure is back at disorganized opposition."
concentration_camps_mission_escape_complete_tt: "The escape networks are broken up. Reform pressure grows slightly and stability recovers."
concentration_camps_mission_escape_timeout_tt: "Prisoners reach the border. Resistance pressure and exposure rise and stability falls."

