concentration_camps_review_cases_desc: "Inspectors go through the files of every camp and release the prisoners who cannot be tied to any charge. The Ledger mandate returns to custody."
concentration_camps_review_cases_tt: "The Ledger mandate returns to custody and a share of the prisoners in every camp are released in place. Resistance pressure eases, and the open files make the camps easier to see."
concentration_camps_review_requirements_tt: "At least one camp holds living prisoners."
