concentration_camps_mission_relieve_sites: "Relieve the Liberated Camps"
concentration_camps_mission_relieve_sites_desc: "Survivors in the camps we have taken cannot wait for the administration to settle. Every liberated camp state we hold needs aid before the districts around it turn against us."
concentration_camps_mission_relief_objective_tt: "Every liberated camp state we hold has received relief."
concentration_camps_mission_relief_complete_tt: "The survivors are cared for. Stability recovers a little."
concentration_camps_mission_relief_timeout_tt: "Survivors waited too long. Stability falls and the districts around the camps keep their penalties."

# Achievements
chaos_redux_022_the_machine_stopped_NAME: "The Machine Stopped"
chaos_redux_022_the_machine_stopped_DESC: "Close a camp network that spread across half the country and keep it closed."
chaos_redux_022_the_machine_stopped_tooltip: "Reach Evolution III with both detention and killing camps in your own network, close the whole network through the Ledger reform within 730 days without destroying records or adding a camp after the closure begins, and keep it closed for 180 days."
chaos_redux_022_the_evidence_survives_NAME: "The Evidence Survives"
chaos_redux_022_the_evidence_survives_DESC: "Preserve the proof of a camp network whose operator tried to hide it."
chaos_redux_022_the_evidence_survives_tooltip: "Record the site, the survivors' statements and the papers of liberated camps through the Liberated Camps decisions, include a camp network whose operator destroyed or concealed records, verify the responsible government and hold every recorded state for 180 days."
chaos_redux_022_no_one_disappears_twice_NAME: "No One Disappears Twice"
chaos_redux_022_no_one_disappears_twice_DESC: "Take camps before the order to march or clear the prisoners can run."
chaos_redux_022_no_one_disappears_twice_tooltip: "Take three camps from one operator while its order to march or clear the prisoners is still pending, give every one of them relief and keep them. That operator must never have carried out such an order."
chaos_redux_022_a_government_answers_NAME: "A Government Answers"
chaos_redux_022_a_government_answers_DESC: "Open the archives of the camps your government inherited and close them."
chaos_redux_022_a_government_answers_tooltip: "When the ruling ideology changes in a country with a live camp network, open the archives and close the camps, never continue the network, and keep it closed for 180 days."
chaos_redux_022_safe_harbor_NAME: "Safe Harbor"
chaos_redux_022_safe_harbor_DESC: "Open the border to people who flee the camps of three different governments."
chaos_redux_022_safe_harbor_tooltip: "Open your border to people who leave the camps of three different countries after their foreign reports, without ever running a camp network of your own, and keep your commitment for 180 days."
chaos_redux_022_against_the_order_NAME: "Against the Order"
chaos_redux_022_against_the_order_DESC: "Close the camps although the administrators refuse."
chaos_redux_022_against_the_order_tooltip: "Close your camp network while its administrators refuse the order, arrest the commandants and take the files without sending soldiers or giving way, and keep the network closed for 180 days."
