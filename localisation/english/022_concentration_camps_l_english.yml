# Event log
chaosx.events_log.window.event_details.concentration_camps: "A government with occupied regions, active resistance or a list of political enemies opens detention camps in about a fifth of its states. The camps hold people without trial, and many of them die of hunger, disease and overwork. Neighbours hear reports and the prisoners' families begin to search. The country can close the camps, review the cases, put the prisoners to work or widen the network."
chaosx.events_log.events.na_reason.concentration_camps_target: "\n§RUnavailable: no country has the occupied, resisting or politically targeted population the camps need, or every candidate is on cooldown.§!"

# Front approaches
chaosx.nr22.511.t: "The Front Nears [concentration_camps_front_state.GetName]"
chaosx.nr22.511.d: "Enemy columns have reached the country around [concentration_camps_front_state.GetName], where the camp holds [?concentration_camps_front_people|0] prisoners. The commandant reports that the guards ask what they should do when the first shells fall, and that anyone who walks through the gates will be able to read the registers. The ministry has a few weeks to decide before the line moves again."
chaosx.nr22.511.a: "Open the gates."
chaosx.nr22.511.a_tt: "The prisoners are released in place and the Ledger records every release. Resistance pressure eases and the registers stay in the camp for whoever arrives first. Nobody is lost."
chaosx.nr22.511.b: "March the prisoners away from the front."
chaosx.nr22.511.b_tt: "The order runs in [?concentration_camps_front_delay_days|0] days. [?concentration_camps_front_march_percent|0] percent of the prisoners die on the road and the rest are left behind the line. If the enemy takes the camp first, the order fails and nobody is lost. Evidence and exposure rise."
chaosx.nr22.511.c: "Order the camp cleared."
chaosx.nr22.511.c_tt: "The order runs in [?concentration_camps_front_delay_days|0] days. [?concentration_camps_front_clear_percent|0] percent of the prisoners are killed and the rest are released. If the enemy takes the camp first, the order fails and nobody is lost. Evidence and exposure rise sharply."
chaosx.nr22.511.f: "Burn the records and keep the gates shut."
chaosx.nr22.511.f_tt: "The records of this camp are destroyed through the shared evidence destruction. It can fail if the camp is already known, and a failure raises exposure and evidence. The prisoners stay where they are."
chaosx.nr22.511.e: "Hold the camp."
chaosx.nr22.511.e_tt: "Nothing changes."
chaosx.nr22.512.t: "Camp Orders"
chaosx.nr22.803.t: "Harbor Proof"
chaosx.nr22.804.t: "Evidence Proof"

# Closure refused
chaosx.nr22.811.t: "The Camp Administrators Refuse"
chaosx.nr22.811.d: "The order to close the camps of [Root.GetNameDef] has reached the commandants, and they have not obeyed it. Guards at several sites have stayed at their posts, registers are being carried to private houses, and officers of the security services say the order comes from men who do not know the camps. The ministry holds the order but not the keys."
chaosx.nr22.811.a: "Arrest the commandants and take the files."
chaosx.nr22.811.a_tt: "Costs £pol_power §Y[?concentration_camps_refusal_arrest_pp|0]§! and a little stability. The files are kept and the closure stays an open one."
chaosx.nr22.811.b: "Send soldiers to take the camps."
chaosx.nr22.811.b_tt: "Stability and war support fall. The files are kept, but the camps are taken by force and the closure does not count as a peaceful one."
chaosx.nr22.811.c: "Let the administrators keep the files."
chaosx.nr22.811.c_tt: "The camps close, but the files stay with the administrators. The closure no longer counts as an open one and the secrecy leaves cover-up evidence behind."

# Operator decision
concentration_camps_round_up_prisoners: "Widen the Intake"
concentration_camps_round_up_prisoners_desc: "Security units go back to the districts around a camp and bring in more of the people the local campaign has already marked. A camp can only take people from that marked group, and every new arrival raises resistance pressure and exposure."
concentration_camps_round_up_prisoners_tt: "A camp takes another cohort from its remaining marked population. Resistance pressure, exposure and the guard burden rise."
concentration_camps_round_up_requirements_tt: "A government that is not democratic, a coercive Ledger mandate and no escape networks in the camps."
concentration_camps_round_up_state_tt: "The camp is operating and its marked population still holds people for another intake."
