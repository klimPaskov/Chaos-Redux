l_english:
# Event 022 Concentration Camps
chaosx.nr22.1.t: "Concentration Camps"
chaosx.nr22.3.t: "Camp Network Review"

# Opening report
chaosx.nr22.2.t: "Detention Camps Open"
chaosx.nr22.2.d_occupied: "Police and security units in [Root.GetNameDef] have turned barracks, depots and factory yards into holding camps and filled them with people taken from the occupied regions. The camps already reach [?concentration_camps_coverage_percent|0] percent of the country's states, among them [concentration_camps_lead_state.GetName]. Guards, wire and rations arrive by the same railways that supply the front, and families wait at the stations for news of relatives who were collected at night. The cabinet has to decide what the camps are for.[GetConcentrationCampsOpeningAddendum]"
chaosx.nr22.2.d_resistance: "After months of sabotage and attacks on garrisons, the security services of [Root.GetNameDef] have begun holding suspects and their relatives in camps at the edge of towns. The camps already reach [?concentration_camps_coverage_percent|0] percent of the country's states, among them [concentration_camps_lead_state.GetName]. Prisoners sleep in sheds and requisitioned schools, and local commanders treat the camps as the answer to every ambush. The government has to decide whether the camps stay open and under whose authority.[GetConcentrationCampsOpeningAddendum]"
chaosx.nr22.2.d_political: "The government of [Root.GetNameDef] has opened camps for its opponents. Officials, union organizers, clergy and anyone named in a denunciation are held without trial in converted barracks and depots, and the camps already reach [?concentration_camps_coverage_percent|0] percent of the country's states, among them [concentration_camps_lead_state.GetName]. Informers and guards fill the new posts, and the ministries are already competing for the prisoners' labour. The cabinet has to decide how far the system goes.[GetConcentrationCampsOpeningAddendum]"
chaosx.nr22.2.a: "Close the camps and release the prisoners."
chaosx.nr22.2.a_tt: "Every camp stops holding prisoners and forced work ends. Civilian employment projects replace the labour over time. Costs £pol_power §Y[?camp_admin_generic_reform_pp|2]§!."
chaosx.nr22.2.b: "Hold every case under review."
chaosx.nr22.2.b_tt: "Forced work stops and the Ledger mandate returns to custody. Inspectors begin reading the files, which makes the camps easier to see from outside."
chaosx.nr22.2.c: "Put the prisoners to work."
chaosx.nr22.2.c_tt: "The Ledger mandate becomes coercive and every camp with a factory or workshop nearby takes a labour role. Output follows the Ledger priority, and deaths, resistance pressure and exposure rise with it."
chaosx.nr22.2.d: "Extend the camps to more regions."
chaosx.nr22.2.d_tt: "The Ledger mandate becomes coercive and the Camp Network category opens its expansion decision. Resistance pressure and exposure rise."

# Escape networks
chaosx.nr22.101.t: "Escape Networks in the Camps"
chaosx.nr22.101.d: "Messages are moving between the camps of [Root.GetNameDef]. Prisoners have mapped the guard rotations, a work detail failed to return to its barracks last week, and several guards were found without their rifles. Camp commanders report that an escape is being prepared across more than one site."
chaosx.nr22.101.a: "Improve food, shelter and medical care."
chaosx.nr22.101.a_tt: "Costs £support_equipment_text_icon §Y[?concentration_camps_cost_relief_support|0]§!, £GFX_train_texticon §Y[?concentration_camps_cost_relief_trains|0]§! and £GFX_fuel_texticon §Y[?concentration_camps_cost_relief_fuel|0]§!. Resistance pressure falls and exposure eases. A containment mission begins."
chaosx.nr22.101.b: "Reinforce the guard posts."
chaosx.nr22.101.b_tt: "Costs £support_equipment_text_icon §Y[?concentration_camps_cost_guards_support|0]§! and £manpower_texticon §Y[?concentration_camps_cost_guards_manpower_k|0]k§!. Resistance pressure falls for now and the guard burden grows. A containment mission begins."
chaosx.nr22.101.c: "Break the networks by force."
chaosx.nr22.101.c_tt: "Guards at the most crowded camp turn on the suspected organizers and many prisoners die. Resistance pressure falls, while evidence and exposure rise sharply and stability suffers."
chaosx.nr22.101.e: "Leave the sites as they are."
chaosx.nr22.101.e_tt: "Nothing changes."

# Sickness
chaosx.nr22.102.t: "Sickness in the Camps"
chaosx.nr22.102.d: "Typhus and dysentery are spreading through the camps of [Root.GetNameDef]. Hunger, crowded barracks and untreated water have emptied the infirmaries of medicine, and orderlies are falling ill at their posts. Guards refuse to enter the worst sheds, and camp physicians write that the sickness will leave the wire within weeks."
chaosx.nr22.102.a: "Send food and medical supplies."
chaosx.nr22.102.a_tt: "Costs £support_equipment_text_icon §Y[?concentration_camps_cost_relief_support|0]§!, £GFX_train_texticon §Y[?concentration_camps_cost_relief_trains|0]§! and £GFX_fuel_texticon §Y[?concentration_camps_cost_relief_fuel|0]§!. Resistance pressure and exposure ease and the outbreak costs no further lives."
chaosx.nr22.102.b: "Seal the camps and say nothing."
chaosx.nr22.102.b_tt: "Prisoners in the hungry camps die of the sickness. Exposure eases for now, and the secrecy leaves cover-up evidence behind."
chaosx.nr22.102.c: "Keep the prisoners at work."
chaosx.nr22.102.c_tt: "Output holds while labour deaths rise in the hungry camps. Resistance pressure and evidence grow."

# Leaks
chaosx.nr22.103.t: "Reports Leave the Camps"
chaosx.nr22.103.d: "Letters hidden in laundry, a clerk's copies of transport lists and the account of a released prisoner have reached foreign journalists. Embassies in the capital are asking to visit the camps, and the ministry of the interior has not decided what to show them."
chaosx.nr22.103.a: "Keep visitors away from the sites."
chaosx.nr22.103.a_tt: "Exposure eases for now. The secrecy leaves cover-up evidence behind."
chaosx.nr22.103.b: "Rewrite the records and stage a tour."
chaosx.nr22.103.b_tt: "If the files hold together, exposure eases. If they do not, exposure and evidence rise sharply. Either way the attempt leaves cover-up evidence behind."
chaosx.nr22.103.c: "Admit inspectors to the camps."
chaosx.nr22.103.c_tt: "The Ledger mandate returns to custody and forced work stops. Exposure rises as the files open, and reform pressure grows."

# Foreign report
chaosx.nr22.510.t: "Reports of Camps in [From.GetNameDef]"
chaosx.nr22.510.d: "Refugees and border guards describe camps across [From.GetNameDef] where large numbers of people are held without trial and many are dying of hunger and disease. The accounts agree on the location of several sites. Our diplomats have not been allowed to see any of them."
chaosx.nr22.510.a: "Send investigators."
chaosx.nr22.510.a_tt: "Costs £pol_power §Y[?concentration_camps_observer_investigate_pp|0]§!. [From.GetNameDef] becomes more exposed. At war with [From.GetNameDef], a camp site may be verified."
chaosx.nr22.510.b: "Support the witnesses quietly."
chaosx.nr22.510.b_tt: "Costs £pol_power §Y[?concentration_camps_observer_protect_pp|0]§!. Witnesses and escape routes in [From.GetNameDef] receive help, and the pressure on its camps grows."
chaosx.nr22.510.e: "Open the border to the people who leave the camps."
chaosx.nr22.510.e_tt: "Costs £support_equipment_text_icon §Y[?concentration_camps_cost_aid_support|0]§!, £GFX_train_texticon §Y[?concentration_camps_cost_aid_trains|0]§!, £GFX_fuel_texticon §Y[?concentration_camps_cost_aid_fuel|0]§! and £pol_power §Y[?concentration_camps_harbor_pp|0]§! for housing, food, care and papers. [From.GetNameDef] becomes more exposed and our opinion of it worsens."
chaosx.nr22.510.c: "Set the reports aside."
chaosx.nr22.510.c_tt: "No action is taken."

# Closure
chaosx.nr22.800.t: "The Camps Are Closed"
chaosx.nr22.800.d: "The camps of [Root.GetNameDef] have been closed. The prisoners have gone home and the barracks stand empty, but the files of several sites were burned before the gates opened. Families searching for relatives are finding gaps in the registers where the names should be."
chaosx.nr22.800.a: "The sites are empty."
chaosx.nr22.801.t: "The Camps Are Closed"
chaosx.nr22.801.d: "The last camp of [Root.GetNameDef] has closed. The surviving prisoners were registered and sent home, civilian workers have taken over the labour in the factories and depots, and the camp files are kept in the state archives where families can ask for them."
chaosx.nr22.801.a: "The files stay in the archive."

# Evolutions
concentration_camps_empty: ""
concentration_camps_opening_addendum_killing: " Part of the network answers to a separate chain of command, and the transport lists from those camps run longer each week than the registers there."
concentration_camps_opening_addendum_late: " The network is far larger than the labour offices ever planned for, and part of it answers to a separate chain of command that they do not control."
chaosx.nr22.2.e: "Accept the killing orders."
chaosx.nr22.2.e_tt: "The Ledger mandate becomes radical, so the camps that hold the killing role begin killing prisoners on the next monthly visit. Resistance pressure, evidence and exposure rise."
chaosx.nr22.201.t: "Killing Orders Reach the Camps"
chaosx.nr22.201.d_converted: "A separate chain of command has taken over [?concentration_camps_stage_converted|0] of the camps in [Root.GetNameDef]. Their commandants no longer answer to the labour offices but to the security services, new sidings have been laid beside the gates, and the registers at those camps show fewer people each week while the transport lists grow longer. The rest of the cabinet learns of the change from the monthly returns."
chaosx.nr22.201.d_single: "The security services of [Root.GetNameDef] have asked for the last remaining camp to be given a new purpose. Its commandant has received orders that the labour offices were not shown, and the army liaison officer there has asked to be reassigned."
chaosx.nr22.201.d_blocked: "Hardliners in the security services of [Root.GetNameDef] have asked for the camps to be given a new purpose. The ministers who control the budget have refused for now, and the camp commanders have been told to wait."
chaosx.nr22.201.a: "Accept the orders."
chaosx.nr22.201.a_tt: "The Ledger mandate becomes radical, so the camps that hold the killing role begin killing prisoners on the next monthly visit. A lone valid camp is converted first. Resistance pressure, evidence and exposure rise."
chaosx.nr22.201.b: "Halt the conversion and close the camps."
chaosx.nr22.201.b_tt: "The killing role ends at every camp and the shared closure begins, which releases the prisoners. Costs £pol_power §Y[?camp_admin_generic_reform_pp|2]§!."
chaosx.nr22.201.c: "Place every camp under review."
chaosx.nr22.201.c_tt: "The killing role ends at every camp, the Ledger mandate returns to custody and the cases are reviewed."
chaosx.nr22.201.e: "Let the request wait."
chaosx.nr22.201.e_tt: "Nothing changes. Camps that hold the killing role stay on the books, and the Ledger mandate decides what they do."
chaosx.nr22.301.t: "A Month of Deaths in the Camps"
chaosx.nr22.301.d: "In every state that holds a camp, the death returns of [Root.GetNameDef] for the past month are far above the usual figure. Rations were cut across the whole network, the transports ran full, and the camp infirmaries recorded fever, exhaustion and shootings in the same ledgers. The registers count [?concentration_camps_evolution_loss_people|0] dead."
chaosx.nr22.301.a: "Continue as before."
chaosx.nr22.301.a_tt: "No further change. The shared monthly processor keeps recording deaths at its usual rates."
chaosx.nr22.301.b: "Lower the intensity."
chaosx.nr22.301.b_tt: "The Ledger mandate returns to custody. Killing roles stay on the books but no longer act."
chaosx.nr22.301.c: "Begin closing the camps."
chaosx.nr22.301.c_tt: "The shared closure begins and the prisoners are released. Costs £pol_power §Y[?camp_admin_generic_reform_pp|2]§!."
chaosx.nr22.301.e: "Open an inquiry into the orders."
chaosx.nr22.301.e_tt: "Exposure and reform pressure rise, and stability recovers a little."
chaosx.nr22.401.t: "Half the Country in Camps"
chaosx.nr22.401.d: "The camp system of [Root.GetNameDef] now reaches [?concentration_camps_coverage_percent|0] percent of the country's states. [?concentration_camps_stage_added|0] camps opened within one season, some of the camps hold a killing purpose, and the registers count [?concentration_camps_evolution_loss_people|0] dead for the past month. Trains, guards, rations and the labour of the prisoners have become a question for the whole government, and the army is asking how many of its men are still at the front."
chaosx.nr22.401.a: "Order an emergency closure."
chaosx.nr22.401.a_tt: "The killing role ends at every camp and the shared closure begins, which releases the prisoners. Costs £pol_power §Y[?camp_admin_generic_reform_pp|2]§!."
chaosx.nr22.401.b: "Keep the mixed network."
chaosx.nr22.401.b_tt: "No change. Both kinds of camp stay as they are."
chaosx.nr22.401.c: "Press the killing orders."
chaosx.nr22.401.c_tt: "The Ledger mandate becomes radical, so every camp that holds the killing role acts on the next monthly visit. Resistance pressure, evidence and exposure rise."
chaosx.nr22.401.e: "Place the network under review."
chaosx.nr22.401.e_tt: "The killing role ends at every camp, the Ledger mandate returns to custody and the cases are reviewed."
concentration_camps.evolution.type: "Concentration Camps"
concentration_camps.evolution.1.title: "Killing Orders"
concentration_camps.evolution.1.body: "Part of the camp network receives a different purpose and chain of command. Killing orders replace detention and forced labour in selected camps, and the government that receives them has to decide whether to accept."
concentration_camps.evolution.1.summary: "Part of the network is given a killing purpose."
concentration_camps.evolution.2.title: "A Month of Deaths"
concentration_camps.evolution.2.body: "Rations are cut and transports run full across the whole network at once. Deaths in every state that holds a camp rise far above the usual figure for a month, and families begin to count the missing."
concentration_camps.evolution.2.summary: "A synchronized wave of deaths in every camp state."
concentration_camps.evolution.3.title: "Half the Country in Camps"
concentration_camps.evolution.3.body: "The network spreads until it touches about half of the states, with detention camps and killing camps side by side. Another synchronized wave of deaths follows, and the camps become an emergency for the whole government."
concentration_camps.evolution.3.summary: "The network reaches half of the country."

# Liberation and succession
chaosx.nr22.601.t: "A Camp at [concentration_camps_liberated_state.GetName]"
chaosx.nr22.601.d: "Our troops have taken [concentration_camps_liberated_state.GetName] and found a camp run by [concentration_camps_liberated_from.GetNameDef]. The gates stand open, the survivors are too weak to leave the barracks, and the medical officers report that most of them need food and care before anything else. The commandant's office still holds registers, transport lists and a safe full of orders."
chaosx.nr22.601.a: "Send food and medical supplies."
chaosx.nr22.601.a_tt: "Costs £support_equipment_text_icon §Y[?concentration_camps_cost_aid_support|0]§!, £GFX_train_texticon §Y[?concentration_camps_cost_aid_trains|0]§! and £GFX_fuel_texticon §Y[?concentration_camps_cost_aid_fuel|0]§!. The survivors in the state receive relief and its penalties end. Stability and war support rise."
chaosx.nr22.601.b: "Secure the records for investigators."
chaosx.nr22.601.b_tt: "Costs £support_equipment_text_icon §Y[?concentration_camps_cost_record_support|0]§!. Investigators collect the site, the survivors' statements and the papers that remain. Tribunal records are prepared against the government that ran the camp, and its opinion of us worsens."
chaosx.nr22.601.c: "Leave the camp to local authorities."
chaosx.nr22.601.c_tt: "No action is taken."
chaosx.nr22.701.t: "A New Government Inherits the Camps"
chaosx.nr22.701.d: "The ministers who took office in [Root.GetNameDef] have found the camps in their budgets. [?concentration_camps_live_sites|0] sites still hold prisoners, the registers and transport lists of the old government fill the cellars of the interior ministry, and the guards are asking who gives their orders now."
chaosx.nr22.701.a: "Open the archives and close the camps."
chaosx.nr22.701.a_tt: "Every camp stops holding prisoners and forced work ends. The old government stays responsible for what was done before. Exposure and reform pressure rise. Costs £pol_power §Y[?camp_admin_generic_reform_pp|2]§!."
chaosx.nr22.701.b: "Put every case under review."
chaosx.nr22.701.b_tt: "Forced work stops and the Ledger mandate returns to custody while inspectors read the files."
chaosx.nr22.701.c: "Keep the camps running."
chaosx.nr22.701.c_tt: "The camps operate under this government from now on, and it answers for what happens in them. Resistance pressure and exposure rise."
chaosx.nr22.701.e: "Burn the old government's files."
chaosx.nr22.701.e_tt: "Exposure eases for now. The cover-up leaves evidence behind."

# Closure proof and achievement
chaosx.nr22.802.t: "Closure Proof"
chaos_redux_022_close_every_gate_NAME: "Close Every Gate"
chaos_redux_022_close_every_gate_DESC: "Close a camp network, leave its records in the archive and keep it closed."
chaos_redux_022_close_every_gate_tooltip: "Close every camp of your own network through the Ledger reform without destroying any records, and keep the network closed for 180 days."

# News
chaosx.news.22.t: "Camps in [From.GetNameDef] Documented"
chaosx.news.22.d: "Foreign investigators, escaped prisoners and captured records have given the world a consistent account of the camps in [From.GetNameDef]. The network reaches many of its states, and the number of prisoners who have died in it rises every month.\n\nGovernments that kept their distance are being asked whether they will keep dealing with it."
chaosx.news.22.a: "The camps are no longer a rumour."

# Category, decisions and mission
concentration_camps_category: "Camp Network"
concentration_camps_category_desc: "The camp network runs §Y[?concentration_camps_live_sites|0]§! sites and reaches §Y[?concentration_camps_coverage_percent|0]§! percent of eligible states.\nForeign exposure: §Y[GetConcentrationCampsExposureBand]§!. Resistance pressure: §Y[GetConcentrationCampsResistanceBand]§!.\nPolicy: §Y[GetConcentrationCampsPolicy]§!.\nMandate, priority, budget, site roles and records are managed in the Camp Administration window."
concentration_camps_expand_network: "Widen the Camp Network"
concentration_camps_expand_network_desc: "Register a new camp in a state under our control. Its first prisoners come from the people the local campaign has already marked, and every new camp raises resistance pressure and exposure."
concentration_camps_expand_network_tt: "A new camp is registered in the chosen state and receives its first prisoners from the people the local campaign has marked. Resistance pressure and exposure rise."
concentration_camps_expand_requirements_tt: "Requires a government that can widen the camps by decree, a coercive Ledger mandate, a network below the generic ceiling and a free state with a campaign source."
concentration_camps_expand_state_requirements_tt: "The state is under our control, holds enough people for a camp, has no camp and no relief work of its own, and the local campaign supplies prisoners: occupied territory, active resistance or a government that names political enemies."
