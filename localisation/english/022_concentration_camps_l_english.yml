# Liberated camps
concentration_camps_relief_category: "Liberated Camps"
concentration_camps_relief_category_desc: "Camps we took from their operators. [GetConcentrationCampsReliefHeader] Relief has reached §Y[?concentration_camps_relieved_sites|0]§! camp states so far. The survivors need food, medicine and papers first, and the investigators need the site, the statements and the records."
concentration_camps_relief_header_waiting: "Survivors are still waiting for relief."
concentration_camps_relief_header_recording: "Relief has reached every survivor."
concentration_camps_unrelieved_state: "Survivors Without Relief"
concentration_camps_relieve_site: "Relieve the Camp"
concentration_camps_relieve_site_desc: "Food, doctors and blankets reach the survivors who were left in the camp. Until then the district around it recruits and builds less and turns against us."
concentration_camps_relieve_site_tt: "The survivors in the state receive relief and the penalties of the state end. Stability and war support rise."
concentration_camps_relieve_state_requirements_tt: "The state is a camp we took from its operator and its survivors have not received relief."
