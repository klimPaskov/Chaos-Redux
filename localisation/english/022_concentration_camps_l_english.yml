# Event log
chaosx.events_log.window.event_details.concentration_camps: "A government with occupied regions, active resistance or a list of political enemies opens detention camps in about a fifth of its states. The camps hold people without trial, and many of them die of hunger, disease and overwork. Neighbours hear reports and the prisoners' families begin to search. The country can close the camps, review the cases, put the prisoners to work or widen the network."
chaosx.events_log.events.na_reason.concentration_camps_target: "\n§RUnavailable: no country has the occupied, resisting or politically targeted population the camps need, or every candidate is on cooldown.§!"
