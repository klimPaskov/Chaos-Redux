concentration_camps_record_site: "Record the Camp"
concentration_camps_record_site_desc: "Investigators photograph the grounds, take the statements of the survivors and copy the registers that remain. What they collect decides what a tribunal can prove."
concentration_camps_record_site_tt: "The site, the survivors' statements and the papers that remain are collected for investigators. Tribunal records are prepared against the operator, and its opinion of us worsens."
concentration_camps_record_state_requirements_tt: "The state is a camp we took from its operator, the site is verified and its records have not been collected."
