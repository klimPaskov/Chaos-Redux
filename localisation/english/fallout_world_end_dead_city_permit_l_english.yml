 chaosx.fallout.338.t: "A Permit for the Dead City"
 chaosx.fallout.338.d: "The eastern skyline is a dark line of empty towers around a city that no longer answers radio calls. A reconnaissance team has found a road through the ash and asks who may enter, who may profit, and who will answer for the bodies left behind. The sealed warehouse route gave us a ledger, but this city will test whether our laws reach beyond the fence."
 chaosx.fallout.338.a: "Send a state expedition"
 chaosx.fallout.338.a.tt: "Spend Scrap, Fuel, and Medicine on a survey team from the selected dead-city state. Success returns salvage and a public claim, while failure costs lives and worsens the city's exposure."
 chaosx.fallout.338.b: "License the guilds"
 chaosx.fallout.338.b.tt: "Let licensed carriers and scavengers enter under a written permit. This costs Scrap, Recognition, and Fuel, but it can build a durable claim without placing the army at the gate."
 chaosx.fallout.338.c: "Seize the city road"
 chaosx.fallout.338.c.tt: "Use military escorts to control the expedition road. The operation spends Scrap, Fuel, and Power, brings equipment home, and can turn a salvage corridor into a garrison obligation."
 chaosx.fallout.338.d_option: "Forbid entry"
 chaosx.fallout.338.d_option.tt: "Spend Shelter Capacity, Filters, and Scrap to close the road and guard the perimeter. The city remains untouched for now, but an abandoned claim can harden into a future grievance."
 chaosx.fallout.340.t: "The City Gives Up Its First Secret"
 chaosx.fallout.340.survey.success.d: "The survey team reached the civic district before dusk. They recovered sealed tools, a municipal map, and enough medical stock to make the expedition a public service rather than a private raid. The selected city state now has a claim that other survivors can see."
 chaosx.fallout.340.survey.partial.d: "The survey team returned with wet maps, damaged tools, and a small medical cache. The road is open, but the city has taken more fuel and confidence than it gave back. The first claim is written in pencil."
 chaosx.fallout.340.survey.failure.d: "The survey team lost its route among collapsed towers and ash-filled underpasses. The survivors brought back contamination on their coats, and several names are missing from the evening count. The city is still there, but our first claim has become a warning."
 chaosx.fallout.340.license.success.d: "The guilds delivered a stamped inventory and paid the agreed share before they entered the city. Their carriers found workshops and a clinic without opening the sealed military wing. The permit has made a salvage law that other regions can understand."
 chaosx.fallout.340.license.partial.d: "The guilds returned with a partial inventory and three competing claims. They brought enough material to keep the road open, but the city has become a market where every witness remembers a different owner."
 chaosx.fallout.340.license.failure.d: "The licensed carriers broke the route agreement and disappeared into the city. Their abandoned carts carried contamination back to the checkpoint, and the permit now looks like a promise made to people who never intended to keep it."
 chaosx.fallout.340.military.success.d: "The military escort secured the road, marked a safe depot, and brought the city's machine shops under accountable custody. The operation was costly, but the selected state now has a defended corridor and a claim backed by more than paper."
 chaosx.fallout.340.military.partial.d: "The escort held the road long enough to recover tools and fuel, then withdrew from the inner districts. Soldiers want a permanent post, while the civil council wants the permit returned to civilian hands."
 chaosx.fallout.340.military.failure.d: "The escort entered the city and lost contact with the road team. A damaged convoy returned without its maps, and the abandoned vehicles have become landmarks for scavengers. The army has gained a grievance and the city has gained another empty street."
 chaosx.fallout.340.forbid.success.d: "The perimeter watch held through the first ash storm. Filters stayed sealed, the road was marked with clear warnings, and the council recorded the city as a protected exclusion rather than a forgotten prize."
 chaosx.fallout.340.forbid.partial.d: "The road was closed, but two families crossed the barrier before the watch could stop them. The city remains outside the permit system, and the council must decide whether the warning is law or only a painted sign."
 chaosx.fallout.340.forbid.failure.d: "The barrier failed in the night. Unlicensed scavengers entered through the drainage cut, leaving torn filters and a trail of ash behind them. The city has become a danger that the country formally denied and practically abandoned."
 chaosx.fallout.340.a: "Record the first claim"
 chaosx.fallout.340.a.tt: "Close the expedition report and wait for the city permit review. The selected state keeps its claim while the next result is scheduled."
 chaosx.fallout.342.t: "The Permit Comes Due"
 chaosx.fallout.342.success.d: "Months later, the city road remains useful because its first rules were clear. A second inventory has arrived, the checkpoint has a civic clerk, and the selected state can decide whether the claim belongs to the town, the army, or the guilds."
 chaosx.fallout.342.partial.d: "The road still functions, but every shipment needs another argument. The city permit has survived its first season, though its boundaries are now a negotiation between clerks, guards, and families who need parts."
 chaosx.fallout.342.failure.d: "The permit review failed when the city watch lost its filters and the inventory ledger vanished. A new plume rises over the road, and the selected state must carry the cost of having opened a door it could not keep guarded."
 chaosx.fallout.342.a: "Close the permit record"
 chaosx.fallout.342.a.tt: "Resolve the second review, write the city memory to the selected state, and release the authenticated result and callback receipts."
 fallout.event_log.dead_city_permit.name: "A Permit for the Dead City"
 fallout.event_log.dead_city_permit.detail: "A dead-city permit chain was recorded."
 fallout.event_log.dead_city_permit.survey_success: "State expedition recovered a public cache and established a visible city claim."
 fallout.event_log.dead_city_permit.survey_partial: "State expedition returned with a partial cache and a disputed road claim."
 fallout.event_log.dead_city_permit.survey_failure: "State expedition failed and brought contamination and deaths back to the checkpoint."
 fallout.event_log.dead_city_permit.license_success: "Licensed guilds delivered an inventory and formalized salvage law."
 fallout.event_log.dead_city_permit.license_partial: "Licensed guilds returned with a partial inventory and competing claims."
 fallout.event_log.dead_city_permit.license_failure: "Licensed carriers broke the route agreement and abandoned contaminated carts."
 fallout.event_log.dead_city_permit.military_success: "Military escorts secured the city road and established an accountable depot."
 fallout.event_log.dead_city_permit.military_partial: "Military escorts held the road but left the inner city contested."
 fallout.event_log.dead_city_permit.military_failure: "Military escorts lost contact and left a dangerous convoy route behind."
 fallout.event_log.dead_city_permit.forbid_success: "A protected exclusion held through the first ash storm."
 fallout.event_log.dead_city_permit.forbid_partial: "The road was closed, but families crossed the barrier before the watch settled."
 fallout.event_log.dead_city_permit.forbid_failure: "Unlicensed scavengers crossed the failed barrier and spread ash along the road."
 fallout.event_log.dead_city_permit.callback_success: "The permit review kept the road useful and gave the selected state a durable claim."
 fallout.event_log.dead_city_permit.callback_partial: "The permit survived its first season, but its boundaries became a continuing negotiation."
 fallout.event_log.dead_city_permit.callback_failure: "The permit review failed after filters and records were lost at the city road."
