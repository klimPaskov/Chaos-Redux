l_english:
brilliant_scientist_origin_investigation_category: "Kruger Provenance Investigation"
brilliant_scientist_origin_investigation_category_desc: "§YIndependent evidence: [?brilliant_scientist_origin_independent_evidence_count|0]/[?constant:brilliant_scientist_origin.public_proof_minimum|0]§!\n§YAuthenticated sources: [?brilliant_scientist_origin_authenticated_source_count|0]/[?constant:brilliant_scientist_origin.authenticated_sources_minimum|0]§!\n\nAlien interfaces, biological isotope ratios, stellar vectors, and a nonhuman archive can be cross-examined as separate sources. A transformation is not evidence of origin."

brilliant_scientist_analyze_exotic_interface_residue: "Analyze Exotic Interface Residue"
brilliant_scientist_analyze_exotic_interface_residue_desc: "Dismantle a working alien-arms interface inside the primary facility and compare its material tolerances against the Directorate's impossible-materials record. The apparatus and support instruments will not survive the test."
brilliant_scientist_sequence_xenobiological_isotopes: "Sequence Xenobiological Isotopes"
brilliant_scientist_sequence_xenobiological_isotopes_desc: "Run xenobiological tissue through the biomedical and cloning laboratories. If its isotope ratios precede every terrestrial supply chain, the result will stand apart from Kruger's later transformations."
brilliant_scientist_triangulate_stellar_provenance: "Triangulate Stellar Provenance"
brilliant_scientist_triangulate_stellar_provenance_desc: "Use rocketry telemetry, high-energy calibration, and computation arrays to reconstruct the direction from which the exotic interfaces first entered the laboratory record."
brilliant_scientist_authenticate_nonhuman_archive: "Authenticate the Nonhuman Archive"
brilliant_scientist_authenticate_nonhuman_archive_desc: "Compare temporal checksums in the alien archive against the Directorate's sealed computation record. The train-borne chronometric rigs make this the longest and most fragile test."
brilliant_scientist_convene_provenance_tribunal: "Convene the Provenance Tribunal"
brilliant_scientist_convene_provenance_tribunal_desc: "Place at least three independent sources and two authenticated chains before scientists who do not answer to Kruger. Their finding will lock one origin conclusion for the campaign."
brilliant_scientist_publish_conclusive_provenance_dossier: "Publish the Conclusive Provenance Dossier"
brilliant_scientist_publish_conclusive_provenance_dossier_desc: "Release all four sources, methods, and custody records to the world. The proof will end secrecy, sharply raise Exposure, and make Extraterrestrial Provenance a public fact."
brilliant_scientist_origin_interface_result_tt: "Adds one §Yindependent§! and one §Yauthenticated§! provenance source, and raises Exposure."
brilliant_scientist_origin_biological_result_tt: "Adds one §Yindependent biological§! provenance source, and raises Exposure."
brilliant_scientist_origin_stellar_result_tt: "Adds one §Yindependent§! and one §Yauthenticated stellar§! provenance source, and raises Exposure."
brilliant_scientist_origin_archive_result_tt: "Adds one §Yindependent archive§! provenance source, and raises Exposure."
brilliant_scientist_origin_tribunal_result_tt: "Locks §YExtraterrestrial Provenance§! as the campaign's sole authenticated origin conclusion."
brilliant_scientist_origin_publication_result_tt: "Publishes the complete proof, records its date, and sharply raises Exposure."
