chaosx.fallout.747.t: "Health Without Borders"
chaosx.fallout.747.opening.d: "Five winters after the East Gate closed, the Ash Ward clinics are treating people from three districts while every council keeps its own register. The Quarantine government can turn that improvised network into a regional health authority, but each road rule will decide who receives care and who answers for the next outbreak."
chaosx.fallout.747.a: "Sign a shared health compact"
chaosx.fallout.747.a.tt: "Spend Food 5, Scrap 3, and Recognition 3. After 45 days, the compact is graded against clinic capacity, state shelter, supply, and regional trust."
chaosx.fallout.747.b: "License client inspections"
chaosx.fallout.747.b.tt: "Spend Food 4, Power 4, Scrap 2, and Recognition 2. After 45 days, inspection teams will test partner clinics and record whether the network shares care or merely exports quarantine."
chaosx.fallout.747.c: "Adopt an isolation doctrine"
chaosx.fallout.747.c.tt: "Spend Food 4, Fuel 2, Support Equipment 3, and Command Power 12. After 45 days, the Quarantine command will formalize isolation corridors and accept the cost of closing them."
chaosx.fallout.747.d: "Expand humanitarian service"
chaosx.fallout.747.d.tt: "Spend Food 6, Medicine 3, Fuel 3, and Recognition 1. After 45 days, mobile care teams will carry medicine across the North Gate and record whether the state can protect patients outside its walls."
chaosx.fallout.749.t: "The Regional Register"
chaosx.fallout.749.health_compact.success.d: "The Ash Ward compact names one medicine register for the North Gate, the clinic districts, and the farms beyond the state line. Each partner keeps a local voice, while the Quarantine council accepts the first regional duty."
chaosx.fallout.749.health_compact.partial.d: "The compact covers the North Gate and one clinic district. The other wards keep separate medicine ledgers, so the first regional authority exists only where a clerk can carry its seal."
chaosx.fallout.749.health_compact.failure.d: "The shared register collapsed when the councils disputed who could close a clinic. Medicine stayed behind local locks, and the Quarantine government recorded another border that exists inside its own authority."
chaosx.fallout.749.client_inspections.success.d: "Licensed teams inspected the partner clinics without seizing their stores. The North Gate now recognizes treatment records from the Ash Ward, and inspection reports name the patients instead of hiding them behind a client seal."
chaosx.fallout.749.client_inspections.partial.d: "The inspection teams certified two clinics and left the third under review. Care can cross the North Gate, but every partner still asks whether the Quarantine council will publish its failures."
chaosx.fallout.749.client_inspections.failure.d: "The inspection teams treated the partner clinics as evidence rather than patients. Records were copied, medicine was delayed, and the regional network now remembers the Quarantine government as another authority that takes before it helps."
chaosx.fallout.749.isolation_doctrine.success.d: "The isolation doctrine closes only the rooms named by the Ash Ward doctors. Filters, guards, and clinic shifts share one roster, and the North Gate commander accepts that a narrow seal can be stronger than a permanent wall."
chaosx.fallout.749.isolation_doctrine.partial.d: "The Quarantine command secured the most exposed rooms and left the farm road open under escort. The doctrine works in the city, though the first convoy still carries more soldiers than nurses."
chaosx.fallout.749.isolation_doctrine.failure.d: "The new doctrine sealed the road before the clinics could move their patients. Fuel and filters were spent on empty checkpoints, the Ash Ward lost medicine, and the council gained a military health order that nobody trusts."
chaosx.fallout.749.humanitarian_service.success.d: "Mobile care teams crossed the North Gate with a named patient list and returned with empty medicine cases. The Quarantine state now measures its authority by the districts it can reach, not the gates it can close."
chaosx.fallout.749.humanitarian_service.partial.d: "The service teams reached the farms and one outer clinic before exposure forced them back. Patients received medicine, but the regional register still ends where the road turns white with ash."
chaosx.fallout.749.humanitarian_service.failure.d: "The service convoy ran out of filters at the first winter checkpoint. The council closed the road to save its remaining stores, and families outside the North Gate remember the promise of care as a ration that never arrived."
chaosx.fallout.749.a: "Review the regional register"
chaosx.fallout.749.a.tt: "Apply the authenticated 45-day health-authority result and continue the delayed regional review."
chaosx.fallout.751.t: "A Duty Beyond the Gate"
chaosx.fallout.751.success.d: "The delayed review finds a Quarantine authority that can share medicine, publish inspection failures, and keep isolation narrow. The North Gate is still a border, but it is no longer the end of the state's duty."
chaosx.fallout.751.partial.d: "The delayed review keeps the clinics linked, though partner councils still bargain over records and fuel. Health Without Borders has become a regional promise with a local limit."
chaosx.fallout.751.failure.d: "The delayed review finds separate ledgers, closed roads, and a clinic network that serves the council before the patient. The Quarantine government keeps its authority, but the region has learned to make other plans."
chaosx.fallout.751.a: "Record the regional review"
chaosx.fallout.751.a.tt: "Apply the authenticated callback outcome and close the Health Without Borders transaction without creating a new country tag."
