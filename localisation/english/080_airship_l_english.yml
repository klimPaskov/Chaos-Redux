l_english:
chaosx.nr80.1.t: "Airship"

chaosx.nr80.2.t: "Airship"
chaosx.nr80.2.d: "Our nation must host the USA airship expedition as it explores the world. We will provide safe passage, supplies, and a view of our country to its crew."
chaosx.nr80.2.a: "Accept the responsibility."

chaosx.nr80.3.t: "Our airship"
chaosx.nr80.3.d: "Our airship is leaving port to explore a world at war. The crew must navigate combat zones and storms to bring the vessel home."
chaosx.nr80.3.a: "Oh the people!"

chaosx.nr80.4.t: "Airship crashed!"
chaosx.nr80.4.d: "The USA airship has crashed on our soil. The wreck has killed people and may pull us into war with the United States."
chaosx.nr80.4.a: "It was an accident!"

chaosx.nr80.5.t: "[FROM.GetName] crashed our airship!"
chaosx.nr80.5.d: ""
chaosx.nr80.5.a: "They are officially dead"

chaosx.nr80.6.t: "Airship"
chaosx.nr80.6.d: "Our airship expedition has returned home after crossing the world. The crew and vessel arrived without incident."
chaosx.nr80.6.a: "It's party time!"

chaosx.nr80.7.t: "Airship arrives back safely!"
chaosx.nr80.7.d: ""
chaosx.nr80.7.a: "A miracle!"

chaosx.nr80.8.t: "The Airship is over our country!"
chaosx.nr80.8.d: "We will not let it crash on our soil!"
chaosx.nr80.8.a: "Look, there!"

chaosx.nr80.9.t: "The Airship has left our country!"
chaosx.nr80.9.d: "The airship has left our country without crashing. The crew is clear of our territory."
chaosx.nr80.9.a: "A relief!"

chaosx.news.69.t: "The Airship is back home!"
chaosx.news.69.d: "The USA airship has returned home after a perilous journey. The vessel and its crew survived storms, mechanical failures, and the long passage through a world at war."
chaosx.news.69.a: "Fairy tales are more than true"

chaosx.news.70.t: "Airship crashed in [FROM.GetName]"
chaosx.news.70.d: "A USA airship has crashed in a foreign country, and the wreck has triggered a conflict between the two governments. The host country accuses the USA of violating its airspace, while the USA demands access to the site."
chaosx.news.70.a: "Oh, the humanity"
