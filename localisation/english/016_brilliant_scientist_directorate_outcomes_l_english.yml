brilliant_scientist_cause_appointment_secret: "§gFounding Compact: Secret appointment concentrates control and Dependence behind classified authority.§!"
brilliant_scientist_cause_appointment_unsettled: "§gFounding Compact: The Directorate has no settled public status.§!"
brilliant_scientist_cause_context_public_science: "§gHost settlement: Universities lead the public network, trading secrecy for independent replication.§!"
brilliant_scientist_cause_context_strategic_security: "§gHost settlement: A strategic office controls the laboratories through emergency authority and compartmented access.§!"
brilliant_scientist_cause_context_industrial_mobilization: "§gHost settlement: Factories and procurement offices treat Kruger's work as an industrial mobilisation programme.§!"
