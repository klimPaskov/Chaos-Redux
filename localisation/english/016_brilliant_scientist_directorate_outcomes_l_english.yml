brilliant_scientist_project_incident_report_security_tt: "Record a state security cordon for [This.GetBrilliantScientistIncidentProjectName]. Mandate rises by §G5§!, Dependence rises by §R5§!, Exposure falls by §G10§!, Capacity falls by §R5§!, and the government gains a containment advantage. The family-specific recovery mission remains active."
brilliant_scientist_project_incident_report_kruger_tt: "Put Doctor Kruger in charge of the first cordon around [This.GetBrilliantScientistIncidentProjectName]. Dependence rises by §R10§!, Exposure falls by §G5§!, Independent Capacity falls by §R5§!, and Grievance rises by §R10§!. The family-specific recovery mission remains active."
