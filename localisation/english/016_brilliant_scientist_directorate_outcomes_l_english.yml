brilliant_scientist_cause_security_military: "§gSecurity: Military guards protect the sites through direct command authority.§!"
brilliant_scientist_cause_security_private: "§gSecurity: Kruger's private guard controls access close to the laboratories.§!"
brilliant_scientist_cause_security_allied: "§gSecurity: Allied protection lowers isolation while creating foreign access.§!"
brilliant_scientist_cause_security_open: "§gSecurity: Open-science safeguards trade secrecy for public verification.§!"
