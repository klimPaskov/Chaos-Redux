brilliant_scientist_last_loyalty_review_kruger_loyalists: "§gLoyalty review: A private Kruger loyalist network was broken.§!"
brilliant_scientist_last_loyalty_review_transformed_personnel: "§gLoyalty review: Transformed or duplicated personnel were quarantined.§!"
