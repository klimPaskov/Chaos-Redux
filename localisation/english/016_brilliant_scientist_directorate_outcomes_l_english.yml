chaosx.nr16.13.t: "A Directorate Project Incident"
chaosx.nr16.13.standard.d: "The [This.GetBrilliantScientistIncidentProjectName] programme has reported a contained irregularity. The exact project remains active, but its recovery mission now has a deadline and the Directorate must decide who is trusted to announce the danger, secure the site, and control the first response."
chaosx.nr16.13.major.d: "The [This.GetBrilliantScientistIncidentProjectName] programme has crossed from warning into a laboratory crisis. Staff, equipment, and records are already at risk, and the recovery mission cannot begin with a neutral chain of command. The Directorate must choose whether to expose the hazard, seal it under state security, or put Kruger in charge of the cordon."
chaosx.nr16.13.severe.d: "The [This.GetBrilliantScientistIncidentProjectName] programme is producing a national incident. The pressure has damaged the margin for error, and the active recovery mission may be the last chance to keep the project from becoming a political or military crisis. The Directorate must choose its first chain of command before the deadline closes."
chaosx.nr16.13.a: "Publish the hazard notice"
chaosx.nr16.13.b: "Seal the site under state security"
chaosx.nr16.13.c: "Let Kruger direct the cordon"
