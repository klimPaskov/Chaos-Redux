brilliant_scientist_last_relocation_none: "§gRelocation: No completed primary-laboratory transfer is on record.§!"

chaosx.nr16.4.t: "The Laboratory Meets the State"
chaosx.nr16.4.wartime.d: "The appointment has barely settled before the war ministry asks what Kruger's rooms can deliver under emergency conditions. Universities want access, officers want clearances, and procurement boards want a timetable. The government must decide which part of the state will define the laboratory before the laboratory defines itself. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.4.public.d: "The public compact has made Kruger famous before his first national results are complete. Universities request copies of his notes, newspapers ask who authorized the appointment, and ministers fear that secrecy would turn a scientific success into a private government. The first settlement must decide whether public institutions will lead or merely observe. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.4.industrial.d: "Factories begin reserving tools and skilled workers for experiments that have no ordinary production category. Industrial ministries promise delivery, university boards demand safeguards, and Kruger treats every delay as evidence that the state has not understood the problem. The cabinet must place the laboratory inside a structure it can still recognize. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.4.default.d: "Kruger's appointment has created a new office without deciding what that office is. Universities, ministries, firms, and security services each claim a right to supervise the work. The first institutional settlement will determine whether the Directorate becomes a national network, a strategic command, or a private technical court. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.4.a: "Put universities in the lead."
chaosx.nr16.4.b: "Give the strategic office control."
chaosx.nr16.4.c: "Set the laboratory to an industrial timetable."
chaosx.nr16.4.d_option: "Distribute the work before it hardens."
brilliant_scientist_context_public_science_tt: "Mandate rises by §G10§!, Dependence falls by §G10§!, Exposure rises by §R10§!, and Capacity rises by §G5§!. Public replication gains room to grow while pressure around the staff eases."
brilliant_scientist_context_strategic_security_tt: "Mandate rises by §G5§!, Dependence rises by §R15§!, Exposure falls by §G15§!, and Capacity rises by §G15§!. Emergency authority narrows Kruger's private reach while hardening pressure inside the staff."
brilliant_scientist_context_industrial_mobilization_tt: "Mandate rises by §G5§!, Dependence rises by §R10§!, Exposure rises by §R5§!, and Capacity rises by §G20§!. Industrial scheduling expands the programme while increasing pressure around the Directorate."
brilliant_scientist_context_distributed_research_tt: "Mandate rises by §G10§!, Dependence falls by §G15§!, Exposure rises by §R15§!, and Capacity rises by §G10§!. Distributed work broadens independent replication while easing pressure around the staff."

chaosx.nr16.5.t: "The Assistants Take Sides"
chaosx.nr16.5.school.d: "The first assistants have become more than a staff. They teach one another, copy Kruger's notation, and ask whether their work belongs to a government office or to a scientific profession. Recognition could make replication real. It could also make the Directorate visible enough for every rival to find. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.5.security.d: "Clearance lists have become political documents. Assistants selected for the inner service receive protection, while those excluded from it carry methods into universities, factories, and foreign correspondence. Kruger calls the dispute a security problem. The cabinet must decide whether loyalty is a legal status or a technical skill. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.5.industrial.d: "Procurement chiefs have discovered that the laboratory's assistants know which factories can reproduce its designs and which merely imitate the paperwork. Firms now compete for their signatures. The Directorate can recognize a professional school, bind the staff to classified service, or let the cabinet mediate before the dispute becomes a strike. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.5.default.d: "The appointment created a staff. The staff has now created factions. Some assistants want a profession with rules that survive Kruger. Others want direct access to his authority and the protection that comes with it. The first conflict is small enough to settle and important enough to shape every later project. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.5.a: "Recognize the school as a profession."
chaosx.nr16.5.b: "Bind the assistants to the Directorate."
chaosx.nr16.5.c: "Let the cabinet arbitrate."
brilliant_scientist_context_recognize_assistant_school_tt: "Mandate rises by §G5§!, Dependence falls by §G10§!, Exposure rises by §R10§!, and Capacity rises by §G5§!. A professional school broadens replication and eases pressure around the staff."
brilliant_scientist_context_bind_assistant_service_tt: "Mandate rises by §G5§!, Dependence rises by §R15§!, Exposure falls by §G5§!, and Capacity rises by §G10§!. Classified service narrows Kruger's private reach while hardening pressure inside the staff."
brilliant_scientist_context_mediate_assistant_conflict_tt: "Mandate rises by §G10§!, Exposure rises by §R5§!, and Capacity rises by §G5§!. Cabinet mediation shares authority and eases pressure around the staff."
chaosx.nr16.6.t: "A Working Prototype"
chaosx.nr16.6.computation.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has survived the test bench. Its calculations can now be checked by staff who do not share Doctor Kruger's private notation, which means the result is scientific evidence and an institutional claim at the same time. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.electronics.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has turned uncertain signals into a record that other engineers can inspect. The Directorate has demonstrated more than a device. It has demonstrated a method that can be copied, contested, and used against the state that funded it. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.materials.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has left the pilot plant with its properties intact. Production offices want the process immediately, while independent engineers warn that the new standard is still tied to the people who discovered it. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.rocketry.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has completed its controlled trial. A result that once belonged to a sealed test range is now a transport, industrial, and military fact, and every observer is asking who will control the next launch. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.high_energy.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has stayed inside its certified envelope long enough to be called a success. The instruments have recorded a new source of power and danger, and the Directorate must decide whether proof should travel farther than the laboratory's security cordon. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.biomedical.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has produced a verified medical result without relying on Kruger's personal intervention at every step. Patients, inspectors, and military planners now have a reason to demand access to the method. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.teleportation.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has crossed its recorded distance and returned with the ledger intact. The Directorate has not merely shortened a journey. It has created a new security boundary that no border office understands. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.cloning.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has produced a viable duplicate with a traceable identity record. The result promises a new labour and military system, but it also gives every institution a reason to ask who owns a person made by policy. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.robotics.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has followed a task beyond the scripted demonstration and returned to its maintenance station. Engineers call it a machine. The Directorate's lawyers are less certain that the word settles anything. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.paleogenetics.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has survived outside its reconstruction chamber. Reserve officers now plan feed, handlers, transport, and containment for a living military possibility that did not exist in the country's history. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.xenobiological_synthesis.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has obeyed its selected control method through a full test cycle. The Directorate has made an organism that can be designed and directed, and every failure mode now has a path into the world. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.biological_weapons.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has passed its sealed validation. The result is a weapon and a public-health threat in the same ledger, so the question of disclosure is inseparable from the question of whether anyone can contain it. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.alien_arms.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has answered the Directorate's interface protocol without destroying its operators. The proof is incomplete, but it is enough to make foreign intelligence services treat the laboratory as a strategic frontier. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.temporal.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has returned a consistent record from a test that should have produced incompatible histories. The archive now contains evidence that time can be handled as a technical problem, and a debt that cannot be erased by filing it away. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.singularity.d: "The first reproducible prototype of [This.GetBrilliantScientistBreakthroughProjectName] has linked its first components without entering the terminal state. The Directorate has proved that the architecture can grow, which makes every later approval a decision about a future the government may no longer be able to close. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.default.d: "The first reproducible prototype has survived the test bench and produced a result that staff outside Kruger's private notation can inspect. The Directorate has proved that its work is more than a promise, and the government must decide how much of that proof should enter public institutions. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.6.a: "Publish the validated result."
chaosx.nr16.6.b: "Seal it in the strategic ledger."
brilliant_scientist_breakthrough_public_tt: "Mandate rises by §G10§!, Dependence falls by §G5§!, Exposure rises by §R15§!, and Capacity rises by §G5§! at full report strength. [This.GetBrilliantScientistBreakthroughPotency] Public custody broadens replication while easing pressure around the staff. This report is recorded once for the family."
brilliant_scientist_breakthrough_classified_tt: "Mandate rises by §G5§!, Dependence rises by §R10§!, Exposure falls by §G10§!, and Capacity rises by §G10§! at full report strength. [This.GetBrilliantScientistBreakthroughPotency] The strategic ledger narrows Kruger's private reach while hardening pressure inside the staff. This report is recorded once for the family."
brilliant_scientist_breakthrough_potency_full: "The first resolved report applies the full governance shift."
brilliant_scientist_breakthrough_potency_early: "The next two resolved reports apply half-strength governance shifts."
brilliant_scientist_breakthrough_potency_late: "Later resolved reports apply quarter-strength governance shifts."
brilliant_scientist_last_breakthrough_public: "§gPrototype record: [ROOT.GetBrilliantScientistBreakthroughProjectName] entered public custody.§!"
brilliant_scientist_last_breakthrough_classified: "§gPrototype record: [ROOT.GetBrilliantScientistBreakthroughProjectName] remains in the strategic ledger.§!"
brilliant_scientist_last_breakthrough_none: "§gPrototype record: No first-prototype governance choice is on record.§!"
chaosx.nr16.7.t: "Terms for the Primary Facility"
chaosx.nr16.7.public.d: "The first reproducible prototype has forced a question that the opening charter avoided. The primary facility can be a civic compact, a restricted district, or an industrial charter. [brilliant_scientist_primary_facility.GetName] will become the visible answer, and Doctor Kruger's staff will treat that answer as a promise about who owns the work. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.7.security.d: "The first reproducible prototype has made the primary facility too important to leave under ordinary access rules. [brilliant_scientist_primary_facility.GetName] can become a restricted district with a security cordon, or the Directorate can bind it to a civic compact or an industrial charter. Kruger's staff are waiting to see whether secrecy is a shield or a claim of ownership. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.7.industrial.d: "The first reproducible prototype has drawn procurement officers into the primary facility. [brilliant_scientist_primary_facility.GetName] can become an industrial charter whose factories carry the laboratory's methods into production, or it can remain a civic or restricted institution. Kruger's staff understand that the first contract will define their future authority. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.7.distributed.d: "The first reproducible prototype has outgrown the room where it was made. [brilliant_scientist_primary_facility.GetName] must now be given terms: a civic compact, a restricted district, or an industrial charter. The choice will tell Kruger's staff whether the Directorate intends to share the method, guard it, or turn it into a production system. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.7.default.d: "The first reproducible prototype has made the primary facility a political fact. [brilliant_scientist_primary_facility.GetName] needs a governing compact before its staff decide that the laboratory's methods belong to themselves. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.7.a: "Open a civic compact"
chaosx.nr16.7.b: "Build a restricted district"
chaosx.nr16.7.c: "Grant an industrial charter"
brilliant_scientist_reaction_facility_civic_compact_tt: "Set the primary facility to a civic compact. Exposure rises by §R5§!, Grievance falls by §G5§!, and Doctor Kruger's personal facility record is resolved."
brilliant_scientist_reaction_facility_restricted_district_tt: "Set the primary facility to a restricted district. Exposure falls by §G5§!, Grievance rises by §R5§!, and foreign operations against the host face a stronger security penalty."
brilliant_scientist_reaction_facility_industrial_charter_tt: "Set the primary facility to an industrial charter. Project Capacity and Dependence rise by §G5§!, accident pressure rises by §R5§!, and Doctor Kruger's personal facility record is resolved."
chaosx.nr16.8.t: "Custody of the Second Method"
chaosx.nr16.8.democratic.d: "A second resolved prototype, [This.GetBrilliantScientistReactionCustodyProjectName], has survived outside Doctor Kruger's private notation. Parliament, the executive office, and the patent bureau each claim the right to decide how the method is held. The custody choice will add a permanent entry to the Directorate's record without creating a second reward. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.8.communist.d: "A second resolved prototype, [This.GetBrilliantScientistReactionCustodyProjectName], has survived outside Doctor Kruger's private notation. The committee must decide whether the method belongs to public trust, an executive reserve, or a patent pool administered through the state. Each answer changes who can command the staff. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.8.fascist.d: "A second resolved prototype, [This.GetBrilliantScientistReactionCustodyProjectName], has survived outside Doctor Kruger's private notation. The executive office can keep the method in reserve, place it under public trust, or license it through a patent pool. The choice will determine which authority reaches the laboratories first. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.8.neutral.d: "A second resolved prototype, [This.GetBrilliantScientistReactionCustodyProjectName], has survived outside Doctor Kruger's private notation. The Directorate must decide whether the method enters public trust, an executive reserve, or a patent pool. The result will be recorded as custody, not as another scientific reward. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.8.a: "Place it in public trust"
chaosx.nr16.8.b: "Hold it in executive reserve"
chaosx.nr16.8.c: "Create a patent pool"
brilliant_scientist_reaction_public_trust_tt: "Record public trust for [This.GetBrilliantScientistReactionCustodyProjectName]. Dependence and Grievance fall by §G5§! while Exposure rises by §R5§!."
brilliant_scientist_reaction_executive_reserve_tt: "Record an executive reserve for [This.GetBrilliantScientistReactionCustodyProjectName]. Mandate and Dependence rise by §G5§! while Exposure falls by §G5§!."
brilliant_scientist_reaction_patent_pool_tt: "Record a patent pool for [This.GetBrilliantScientistReactionCustodyProjectName]. Project Capacity and Exposure rise by §G5§!, and accident pressure rises by §R5§!."
chaosx.nr16.9.t: "The Directorate Answers a Foreign Hand"
chaosx.nr16.9.d: "The Directorate has resolved a foreign operation concerning [This.GetBrilliantScientistReactionForeignOperationName]. [brilliant_scientist_foreign_operation_actor.GetNameDef] now knows that its agents were identified. The response can trade a controlled method, issue a private warning, or make a public accusation that turns the laboratory into a diplomatic incident. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.9.a: "Offer a controlled exchange"
chaosx.nr16.9.b: "Issue a private warning"
chaosx.nr16.9.c: "Make a public accusation"
brilliant_scientist_reaction_controlled_exchange_tt: "Give the detected actor one capped theory grant for [This.GetBrilliantScientistBreakthroughProjectName]. Relations improve by §G15§!, Exposure rises by §R5§!, and Grievance falls by §G5§!."
brilliant_scientist_reaction_private_warning_tt: "Warn the detected actor in private. Relations worsen by §R10§!, and Exposure falls by §G5§!."
brilliant_scientist_reaction_public_accusation_tt: "Accuse the detected actor publicly. Relations worsen by §R35§!, the actor's foreign interest rises by §R5§!, and Mandate and Exposure rise by §G5§!."
brilliant_scientist_reaction_operation_observation: "an observation mission"
brilliant_scientist_reaction_operation_assistant: "an assistant recruitment attempt"
brilliant_scientist_reaction_operation_archive: "an archive theft"
brilliant_scientist_reaction_operation_sabotage: "a sabotage operation"
brilliant_scientist_reaction_operation_defection: "a defection approach"
brilliant_scientist_reaction_operation_extraction: "an extraction attempt"
brilliant_scientist_reaction_operation_assassination: "an assassination attempt"
brilliant_scientist_reaction_operation_unknown: "an unclassified foreign operation"
brilliant_scientist_host_flavor_clause_university: "Universities are strong enough to demand a voice in the new office, and the first public lecture is already being planned."
brilliant_scientist_host_flavor_clause_industrial: "Factories have reserved machine time for the new work, while firms are preparing claims on whatever leaves the laboratory."
brilliant_scientist_host_flavor_clause_militarized: "The weapons office wants the laboratory inside its security perimeter, and officers are already asking which results can be deployed."
brilliant_scientist_host_flavor_clause_threatened: "The country has little room for another institution, so a single facility could decide whether the programme becomes a lifeline or a liability."
brilliant_scientist_host_flavor_clause_colonial: "Remote institutes and subject administrations offer space for the work, but every distant site adds another government that can resist the Directorate."
brilliant_scientist_host_flavor_clause_refugee: "Kruger's arrival has drawn displaced scholars toward the host, and their loyalties will depend on whether the programme offers a home or another chain of command."
brilliant_scientist_host_flavor_clause_default: "The host has no single tradition ready to absorb the Directorate, so its first decisions will shape the institution's public identity."
chaosx.nr16.12.t: "The Impossible Lecture"
chaosx.nr16.12.public.d: "Kruger fills a university hall with instruments that produce a result the senior lecturers can reproduce only after the demonstration is over. Students copy the calculations while the Directorate decides how much of the method can belong to the institutions that witnessed it. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.12.military.d: "The military briefing ends with officers asking for a second test and Kruger asking for a larger laboratory. The device has no place in a normal procurement table, yet the security office already wants its measurements sealed. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.12.industrial.d: "At the pilot works, Kruger makes a production line perform a task its engineers had marked as impossible. Factory managers want the drawings, university delegates want the method, and the Directorate must decide which timetable the result will obey. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.12.interrupted.d: "A foreign observer reaches the lecture before the final demonstration and names one instrument from a design Kruger has never published. The room falls quiet while staff members decide whether to continue, close the doors, or learn what the observer already knows. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.12.default.d: "Kruger demonstrates a computation that ordinary experts can describe only after they have seen it work. The result gives the Directorate its first shared project and leaves the state responsible for deciding who may repeat the method. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.12.a: "Let the universities record the result."
chaosx.nr16.12.b: "Keep the demonstration under guard."
chaosx.nr16.12.c: "Put the method on an industrial timetable."
chaosx.nr16.12.d: "Stop the lecture and question the observer."
