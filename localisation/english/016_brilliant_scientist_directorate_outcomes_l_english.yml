brilliant_scientist_cause_authority_delegated: "§gAuthority: Delegated technical authority raises Mandate while weakening direct ministerial control.§!"
brilliant_scientist_cause_authority_cabinet: "§gAuthority: A cabinet safety board can delay dangerous work and constrain Mandate.§!"
brilliant_scientist_cause_authority_unsettled: "§gAuthority: Final oversight remains under negotiation.§!"

