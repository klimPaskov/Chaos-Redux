chaosx.nr16.10.t: "The Sealed Loyalty Dossier"
chaosx.nr16.10.foreign_agents.d: "The review has reconstructed a foreign collection network from duplicate clearances, missing procurement records, and covert contact reports. The exposed cells are broken before they can empty the archives, but every arrest confirms how widely the Directorate has been watched. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.10.kruger_loyalists.d: "The investigators find no foreign master. Instead, appointments, guard rotations, and laboratory access have formed a private chain of loyalty centered on Doctor Kruger. Removing its organizers weakens that internal apparatus, though the purge leaves the remaining staff angrier and the programme harder to conceal. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.10.transformed_personnel.d: "Personnel records no longer match the people holding the badges. Biological signatures, mechanical substitutions, and impossible duplicate histories point back to the Directorate's own advanced work. The affected sections are quarantined, costing laboratory capacity while the discovery becomes another secret that cannot remain quiet. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.10.inconclusive.d: "The sealed files contain suspicion but no finding that survives scrutiny. Investigators have spent weeks disrupting laboratories and accusing indispensable staff without identifying a foreign cell or an internal conspiracy. The government gains no security advantage from the review. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.10.wrongful_purge.d: "The review's weakest accusations become dismissals, arrests, and broken research teams. Later checks expose contradictory testimony and evidence manufactured to satisfy the investigators. The Directorate loses authority and capacity while fear hardens into lasting resentment. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.10.a: "Enter the finding in the sealed register."

chaosx.nr16.11.t: "The Primary Laboratory Convoy"
chaosx.nr16.11.success.d: "The final sealed convoy reaches the prepared destination under the planned cover. Staff authenticate the inventory, restore the secure channels, and transfer the primary laboratory designation without creating a second institutional center. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.11.interception.d: "Unknown observers shadow the route before the convoy reaches its destination. Security teams recover the surviving vehicles and abort the transfer, but compromised manifests and scattered witnesses reveal more of the Directorate than the relocation was meant to hide. The primary laboratory remains where it was. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.11.prototype_loss.d: "A containment failure inside the convoy forces security teams to destroy one advanced project's working archive and prototype package. The transfer is abandoned, the affected project is marked damaged, and the primary laboratory remains at its original site. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.11.staff_refusal.d: "Senior staff refuse the final movement order after discovering that families, patients, and hazardous work are being divided across the route. The standoff ends without bloodshed, but it exposes how little formal authority can compel a Directorate that no longer trusts its supervisors. The primary laboratory does not move. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.11.escape.d: "The movement plan contains a second itinerary written outside the government's chain of command. Personnel and sealed material disappear toward the requested destination, where a hidden cell begins operating before security can reconstruct the route. The primary laboratory remains in place, but the Directorate has gained another center beyond ordinary supervision. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.11.a: "Close the route ledger."

