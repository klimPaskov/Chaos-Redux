# Glosses in the Margin
decision_utopia_hold_open_interpretation_audit: "Hold an Open Interpretation Audit"
decision_utopia_hold_open_interpretation_audit_desc: "Teachers, critics, households, and public officers will compare the official reading against the accounts and the lived work of the commonwealth."
decision_utopia_hold_open_interpretation_audit_effect_tt: "Begins a public audit lasting between §Y90 and 210 days§!. War and a larger country lengthen the audit. Stable Plenty, trusted Concord, and relevant public offices shorten it. Concord rises and Choice versus Assignment moves toward Choice at once. Completion eases Learning and Care pressure through an Open Call."
decision_utopia_consolidate_chartered_schools: "Consolidate the Chartered Schools"
decision_utopia_consolidate_chartered_schools_desc: "Charters can preserve rival readings only if classrooms, councils, and travelling instructors share a stable civic administration."
decision_utopia_consolidate_chartered_schools_effect_tt: "Begins a consolidation term lasting between §Y90 and 210 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Concord rises and Choice versus Assignment moves toward Choice at once. Completion eases Civic Works pressure through guaranteed placement."
decision_utopia_police_censored_margins: "Police the Censored Margins"
decision_utopia_police_censored_margins_desc: "Inspectors will suppress unauthorized editions and test whether the institutions can enforce silence without exposing their own contradictions."
decision_utopia_police_censored_margins_effect_tt: "Begins an enforcement term lasting between §Y90 and 210 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Choice versus Assignment moves toward Assignment and Concord falls. Completion brings organized resistance when Concord holds, or a data scandal when it does not."

# Necessary Shores
decision_utopia_fund_domestic_repairs: "Fund the Domestic Alternative"
decision_utopia_fund_domestic_repairs_desc: "The current Necessary Ground case will be tested against repairs, transport, and service capacity that can be supplied at home."
decision_utopia_fund_domestic_repairs_effect_tt: "Begins a repair term lasting between §Y90 and 180 days§! for the current case. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it. Integrity and local support rise at once. Completion eases the case's Calling pressure and lowers Need."
decision_utopia_bind_peaceful_case_order: "Bind the Peaceful Case Order"
decision_utopia_bind_peaceful_case_order_desc: "Witnesses, translators, and carriers will preserve the order of purchase, lease, settlement, joint administration, and association."
decision_utopia_bind_peaceful_case_order_effect_tt: "Begins a bargaining term lasting between §Y90 and 180 days§! for the current case. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Integrity and local support rise. Completion restores peaceful steps, raises Concord, and moves Choice versus Assignment toward Choice."
decision_utopia_invoke_shores_emergency_warrant: "Invoke a Shores Emergency Warrant"
decision_utopia_invoke_shores_emergency_warrant_desc: "A severe case can be forced through the administrative queue, but the warrant makes the loss of integrity and foreign confidence public."
decision_utopia_invoke_shores_emergency_warrant_effect_tt: "Begins an emergency term lasting between §Y90 and 180 days§! for the current case. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Local support rises, Choice versus Assignment moves toward Assignment, and integrity falls. Completion lowers Concord and creates foreign and League opposition."

# Cities of One Measure
decision_utopia_renew_local_charters: "Renew the Local Charters"
decision_utopia_renew_local_charters_desc: "Municipal councils will renew their own standards while sharing transport, stores, and public measurements through the district network."
decision_utopia_renew_local_charters_effect_tt: "Begins a charter term lasting between §Y90 and 330 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. The district network and Concord strengthen at once. Completion eases Civic Works pressure and supports League cohesion."
decision_utopia_coordinate_linked_standard: "Coordinate the Linked Standard"
decision_utopia_coordinate_linked_standard_desc: "Engineers and workshop delegates will reconcile the common measurements without hiding the accounts that reveal their cost."
decision_utopia_coordinate_linked_standard_effect_tt: "Begins a coordination term lasting between §Y90 and 330 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Plenty rises and Choice versus Assignment moves toward Assignment at once. Completion eases Workshop pressure, while suppressed data becomes a scandal."
decision_utopia_open_foreign_municipal_circle: "Open the Foreign Municipal Circle"
decision_utopia_open_foreign_municipal_circle_desc: "Associated municipalities will exchange surveyors, harbor officers, and public records under a visible League compact."
decision_utopia_open_foreign_municipal_circle_effect_tt: "Begins an exchange term lasting between §Y90 and 330 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. League cohesion rises at once. Completion eases Maritime and Settlement pressure and raises Concord."

# Nowhere Made Law
decision_utopia_ratify_plural_league_law: "Ratify Plural League Law"
decision_utopia_ratify_plural_league_law_desc: "Observers, associates, and members will affirm common duties without surrendering the constitutions by which they entered."
decision_utopia_ratify_plural_league_law_effect_tt: "Begins a ratification term lasting between §Y90 and 330 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. League cohesion rises at once. Completion raises Concord and moves Choice versus Assignment toward Choice."
decision_utopia_honor_sponsored_law: "Honor the Sponsored Law"
decision_utopia_honor_sponsored_law_desc: "Written sponsorship survives only when stores, carriers, and public officers meet the obligations attached to outside support."
decision_utopia_honor_sponsored_law_effect_tt: "Begins a sponsored term lasting between §Y90 and 330 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Plenty rises while cohesion weakens at once. Completion spends Plenty to restore cohesion. Losing written sponsorship cancels the term."
decision_utopia_broadcast_route_law: "Broadcast the Route as Law"
decision_utopia_broadcast_route_law_desc: "The official interpretation will be carried abroad as a regional claim, binding recruitment to the prestige and failures of the chosen route."
decision_utopia_broadcast_route_law_effect_tt: "Begins a broadcast term lasting between §Y90 and 330 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Choice versus Assignment moves toward Assignment and Concord falls at once. Completion records foreign condemnation and lowers League cohesion."

# The Perfect Island
decision_utopia_provision_refuge_network: "Provision the Refuge Network"
decision_utopia_provision_refuge_network_desc: "Willing refuges need carriers, intake offices, stores, and settlement workers long after the first gates are opened."
decision_utopia_provision_refuge_network_effect_tt: "Begins an intake term lasting between §Y90 and 420 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Need falls and Concord rises at once. Completion spends Plenty and eases Maritime and Settlement pressure. A Closed Island route cancels the term."
decision_utopia_stock_bounded_self_sufficiency: "Stock Bounded Self-Sufficiency"
decision_utopia_stock_bounded_self_sufficiency_desc: "The commonwealth will build reserves for autonomy without pretending that every shortage can be solved behind a wall."
decision_utopia_stock_bounded_self_sufficiency_effect_tt: "Begins a reserve term lasting between §Y90 and 420 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Plenty rises and Choice versus Assignment moves toward Assignment at once. Completion eases Provisioning pressure and rewards a secure reserve, while an insecure reserve lowers Concord."
decision_utopia_enforce_closed_order: "Enforce the Closed Order"
decision_utopia_enforce_closed_order_desc: "Households, stores, and watches will be confined to the sealed design, with every shortage answered as a question of discipline."
decision_utopia_enforce_closed_order_effect_tt: "Begins an enforcement term lasting between §Y90 and 420 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Plenty rises and Choice versus Assignment moves toward Assignment while Concord falls. Completion eases Defense pressure, but weak Concord causes revolt and surviving League ties lose cohesion."

# Shared obligation mission
mission_utopia_evolution_policy_obligation: "An Interpretation Owes Its Proof"
mission_utopia_evolution_policy_obligation_desc: "The chosen reading of the Manifesto has become a public obligation. Its promised consequence will be judged against the Ledger and the country's surviving cases, districts, League ties, reserves, and constitutional course when the term ends."
mission_utopia_evolution_policy_obligation_timeout_tt: "The obligation reaches judgment and delivers the consequence promised by the chosen reading. If the country could no longer honor that reading, the obligation would already have ended without reward."
