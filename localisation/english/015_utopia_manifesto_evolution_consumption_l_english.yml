# Evolution option consequences
chaosx_nr15_100_a_evolution_policy_tt: "Open interpretation schools allow recurring public audits. Each paid audit raises Concord, moves Choice versus Assignment toward Choice, and eases Learning and Care pressure."
chaosx_nr15_100_b_evolution_policy_tt: "Chartered schools allow recurring consolidation terms. Each term raises Concord, moves Choice versus Assignment toward Choice, and eases Civic Works and Transport pressure."
chaosx_nr15_100_c_evolution_policy_tt: "Censored margins allow recurring enforcement terms. Enforcement moves Choice versus Assignment toward Assignment and lowers Concord, and it can end in organized resistance or a public data scandal."
chaosx_nr15_101_a_evolution_policy_tt: "Domestic alternatives allow paid repair terms while a Necessary Ground case is active. Repairs raise integrity and local support and then ease the case's calling shortage."
chaosx_nr15_101_b_evolution_policy_tt: "Peaceful priority holds an active case to its order of attempted steps, so crisis exceptions cannot skip ahead to later offers or an ultimatum. Witnessed bargaining terms raise integrity, local support, and Concord, and move Choice versus Assignment toward Choice."
chaosx_nr15_101_c_evolution_policy_tt: "Emergency powers allow costly warrants while a case is active. A warrant raises local support at the cost of integrity and Concord, moves Choice versus Assignment toward Assignment, and leaves lasting foreign and League opposition."
chaosx_nr15_102_a_evolution_policy_tt: "Local charters allow recurring municipal renewals. Each renewal strengthens the district network, eases Civic Works and Transport pressure, and supports voluntary League cohesion."
chaosx_nr15_102_b_evolution_policy_tt: "A linked standard allows recurring coordination terms. Coordination supports district production and eases Workshops and Arsenal pressure, and suppressed accounts can turn into a data scandal."
chaosx_nr15_102_c_evolution_policy_tt: "A foreign circle allows recurring municipal exchanges. Exchanges strengthen League cohesion and ease Maritime and Settlement pressure."
chaosx_nr15_103_a_evolution_policy_tt: "Plural law allows recurring ratification terms. Ratification strengthens voluntary League cohesion, raises Concord, and moves Choice versus Assignment toward Choice."
chaosx_nr15_103_b_evolution_policy_tt: "Sponsored law allows recurring obligations backed by a sponsor. Sponsorship raises Plenty at first, and League cohesion returns only after the material aid is paid."
chaosx_nr15_103_c_evolution_policy_tt: "Route propaganda allows recurring broadcasts. Broadcasts move Choice versus Assignment toward Assignment and cost Concord, and they end in condemnation that weakens League cohesion."
chaosx_nr15_104_a_evolution_policy_tt: "A refuge network allows recurring intake obligations. Provisioning lowers Need and raises Concord, and settlement services then consume Plenty and ease Maritime and Settlement pressure."
chaosx_nr15_104_b_evolution_policy_tt: "Bounded self-sufficiency allows recurring reserve terms. Stocking raises Plenty and moves Choice versus Assignment toward Assignment, and the term is judged against the live Common Reserve."
chaosx_nr15_104_c_evolution_policy_tt: "Closed order allows recurring enforcement terms. Enforcement moves Choice versus Assignment toward Assignment and eases Defense and Watches pressure. Weak Concord ends the term in revolt, and otherwise League cohesion falls."

