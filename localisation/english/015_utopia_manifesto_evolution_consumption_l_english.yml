l_english:

# Evolution option consequences
chaosx_nr15_100_a_evolution_policy_tt: "Open interpretation schools permit recurring public audits. Each paid audit raises Concord and moves Choice versus Assignment toward Choice before easing Learning and Care pressure."
chaosx_nr15_100_b_evolution_policy_tt: "Chartered schools permit recurring consolidation terms. Each term raises Concord and moves Choice versus Assignment toward Choice before easing Civic Works pressure."
chaosx_nr15_100_c_evolution_policy_tt: "Censored margins permit recurring enforcement terms. Enforcement moves Choice versus Assignment toward Assignment, lowers Concord, and can end in organized resistance or a public data scandal."
chaosx_nr15_101_a_evolution_policy_tt: "Domestic alternatives permit paid repair terms during an active Necessary Ground case. Repairs strengthen local support and integrity before relieving the case's calling deficit."
chaosx_nr15_101_b_evolution_policy_tt: "Peaceful priority binds an active case to its attempted-step order: crisis exceptions cannot skip directly to later offers or an ultimatum. Witnessed bargaining terms strengthen integrity and local support, raise Concord, and move Choice versus Assignment toward Choice."
chaosx_nr15_101_c_evolution_policy_tt: "Emergency powers permit costly warrants during an active case. Warrants trade integrity and Concord for speed, move Choice versus Assignment toward Assignment, and leave lasting foreign and League opposition."
chaosx_nr15_102_a_evolution_policy_tt: "Local charters permit recurring municipal renewals. Renewals reinforce the district network before easing Civic Works pressure and supporting voluntary League cohesion."
chaosx_nr15_102_b_evolution_policy_tt: "A linked standard permits recurring coordination terms. Coordination supports district production before easing Workshop pressure, but suppressed accounts can become a data scandal."
chaosx_nr15_102_c_evolution_policy_tt: "A foreign circle permits recurring municipal exchanges. Exchanges strengthen League cohesion before easing Maritime and Settlement pressure."
chaosx_nr15_103_a_evolution_policy_tt: "Plural law permits recurring ratification terms. Ratification strengthens voluntary League cohesion before raising Concord and moving Choice versus Assignment toward Choice."
chaosx_nr15_103_b_evolution_policy_tt: "Sponsored law permits recurring faction-backed obligations. Sponsorship raises Plenty at first, but material aid must be paid before cohesion is restored."
chaosx_nr15_103_c_evolution_policy_tt: "Route propaganda permits recurring broadcasts. Broadcasts move Choice versus Assignment toward Assignment at a Concord cost and end with condemnation that weakens League cohesion."
chaosx_nr15_104_a_evolution_policy_tt: "A refuge network permits recurring intake obligations. Provisioning lowers Need and raises Concord before settlement services consume Plenty and ease Maritime pressure."
chaosx_nr15_104_b_evolution_policy_tt: "Bounded self-sufficiency permits recurring reserve terms. Stocking raises Plenty and moves Choice versus Assignment toward Assignment before provisioning pressure is tested against the live reserve."
chaosx_nr15_104_c_evolution_policy_tt: "Closed order permits recurring enforcement terms. Enforcement moves Choice versus Assignment toward Assignment and raises defense capacity, but weak Concord can end in revolt and surviving leagues condemn the burden."

