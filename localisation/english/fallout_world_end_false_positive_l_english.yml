l_english:
  chaosx.fallout.691.t: "False Positive"
  chaosx.fallout.691.d: "The clinic's second register clears a household that the first red seal trapped outside the cordon. The ash road is frozen, the appeal queue is growing, and the Quarantine State must decide whether the seal protects a living settlement or only protects its own authority."
  chaosx.fallout.691.a: "Release them and pay the ward"
  chaosx.fallout.691.a.tt: "Spend food, medicine, and recognition to release the cleared households with compensation. This relieves grievance and appeal pressure, but it uses the reserve needed for the next cold front."
  chaosx.fallout.691.b: "Keep the cordon in place"
  chaosx.fallout.691.b.tt: "Spend medicine, fuel, and recognition to maintain the seal until another test is complete. This is safer for disease control, but it increases fatigue, backlog, and resentment."
  chaosx.fallout.691.c: "Give the case to a ward tribunal"
  chaosx.fallout.691.c.tt: "Spend food, scrap, and recognition on a public hearing. A fair ruling can restore trust and memory, while a failed hearing leaves both the clinic and the wards discredited."
  chaosx.fallout.691.e: "Rotate the inspection teams"
  chaosx.fallout.691.d.tt: "Spend medicine, fuel, and power to replace the exhausted inspectors and reopen the registers. This offers the strongest recovery of shelter and disease control, but it consumes medicine quickly."
  chaosx.fallout.693.t: "The Seal Is Questioned"
  chaosx.fallout.693.release.success.d: "The cleared households crossed before the ash rain returned. The ward received compensation, the clinic corrected its register, and the red seal now marks a duty to verify rather than a license to forget."
  chaosx.fallout.693.release.partial.d: "Most of the cleared households were released, but the compensation queue outlasted the food reserve. The ward accepts the correction, although every new fever will reopen the charge that the first list was careless."
  chaosx.fallout.693.release.failure.d: "The release convoy reached the outer gate without the promised medicine or names. The cleared households returned to the same queue, and the first red seal now looks like a sentence that cannot be appealed."
  chaosx.fallout.693.cordon.success.d: "The cordon held through the next cold night. No new case crossed the gate, yet the inspectors kept a second register for cleared households so the seal could be challenged without breaking the road."
  chaosx.fallout.693.cordon.partial.d: "The cordon held, but the inspection teams lost another day to the appeal queue. Fever control improved while the wards counted the fuel spent on a seal that still carried no answer."
  chaosx.fallout.693.cordon.failure.d: "The cordon guards could not keep the gate supplied. A broken lamp and an empty medicine crate turned the appeal queue into a crowd, and the settlement stopped treating the red seal as a common rule."
  chaosx.fallout.693.tribunal.success.d: "The ward tribunal read both registers in public and cleared the households by name. The clinic kept its mandate, the grievance ledger fell, and the Quarantine State gained a memory that can survive a change of officers."
  chaosx.fallout.693.tribunal.partial.d: "The tribunal named the error but could not fund every remedy. The wards have a shared account of what happened, though the families still wait under shelter that was never meant to hold them."
  chaosx.fallout.693.tribunal.failure.d: "The tribunal became another closed room. The clinic withheld pages, the ward captains argued over missing names, and the appeal backlog became a second cordon around the truth."
  chaosx.fallout.693.rotate.success.d: "Fresh inspectors compared the paper seals with the clinic's living register. The cleared households were moved through a marked gate, shelter capacity recovered, and the exhausted teams finally stood down."
  chaosx.fallout.693.rotate.partial.d: "The rotation found the worst errors, but two wards kept different lists. The clinic has a path to repair its practice, while disease pressure and suspicion continue to move along the same road."
  chaosx.fallout.693.rotate.failure.d: "The replacement teams arrived without the power to read the frozen registers. The old officers left, the new officers guessed, and the cleared households remained trapped between two versions of the same seal."
  chaosx.fallout.693.a: "File the first finding"
  chaosx.fallout.693.a.tt: "Record the branch and its delayed result in the Quarantine State's cause memory. A later appeal will test whether the new practice survived the next winter."
  chaosx.fallout.695.t: "The Appeal Queue Returns"
  chaosx.fallout.695.success.d: "Six months later the second register is still read beside the first. The wards can challenge a seal without tearing down the clinic, and the Quarantine State's officers inherit a record that names the error and the remedy."
  chaosx.fallout.695.partial.d: "The appeal practice survived, but only where the lamps and medicine held. The wards remember the correction, while the outer streets still decide which list to trust when the next fever arrives."
  chaosx.fallout.695.failure.d: "The appeal practice collapsed under fatigue and missing pages. The cleared households remain a warning in the ward ledger, and every officer who inherits the cordon must decide whether to reopen the case or hide it again."
  chaosx.fallout.695.a: "Close the appeal record"
  chaosx.fallout.695.a.tt: "Release the delayed cleanup receipt and preserve the Quarantine State's memory of the screening error."
  fallout.event_log.false_positive.name: "False Positive"
  fallout.event_log.false_positive.detail: "[GetFalloutEvent691EventLogDetail]"
  fallout.event_log.false_positive.detail.choice_release: "The Quarantine State released cleared households and promised compensation after a false red seal."
  fallout.event_log.false_positive.detail.choice_cordon: "The Quarantine State kept a disputed red seal in place while it gathered another test."
  fallout.event_log.false_positive.detail.choice_tribunal: "The Quarantine State sent the disputed seal to a public ward tribunal."
  fallout.event_log.false_positive.detail.choice_rotate: "The Quarantine State rotated inspection teams and reopened the frozen registers."
  fallout.event_log.false_positive.detail.release_success: "Release and compensation restored the register and reduced the ward grievance."
  fallout.event_log.false_positive.detail.release_partial: "Release and compensation corrected most names but left a queue without enough reserve."
  fallout.event_log.false_positive.detail.release_failure: "Release and compensation failed at the gate, deepening the grievance around the first red seal."
  fallout.event_log.false_positive.detail.cordon_success: "The cordon held while a second register made the seal answerable to the wards."
  fallout.event_log.false_positive.detail.cordon_partial: "The cordon held unevenly and left the inspection teams tired and the appeal queue longer."
  fallout.event_log.false_positive.detail.cordon_failure: "The cordon lost its supply and its shared meaning when the appeal crowd reached the gate."
  fallout.event_log.false_positive.detail.tribunal_success: "A public tribunal cleared the households by name and preserved a durable record of the error."
  fallout.event_log.false_positive.detail.tribunal_partial: "A public tribunal named the error but could not fund every remedy."
  fallout.event_log.false_positive.detail.tribunal_failure: "A public tribunal broke into rival lists and made the appeal backlog a second cordon."
  fallout.event_log.false_positive.detail.rotate_success: "Fresh inspectors corrected the register and restored shelter capacity."
  fallout.event_log.false_positive.detail.rotate_partial: "Fresh inspectors corrected the worst errors but left two ward lists in conflict."
  fallout.event_log.false_positive.detail.rotate_failure: "Replacement inspectors arrived without power for the frozen registers and left the seal disputed."
  fallout.event_log.false_positive.detail.callback_success: "The delayed appeal record survived the next winter and made the seal answerable."
  fallout.event_log.false_positive.detail.callback_partial: "The delayed appeal record survived only where lamps and medicine held."
  fallout.event_log.false_positive.detail.callback_failure: "The delayed appeal record collapsed under fatigue and missing pages."
  fallout.event_log.false_positive.detail.cancelled: "The false positive chain was not completed and its reserved memory was released."
  fallout_false_positive_result_success: "False positive corrected"
  fallout_false_positive_result_partial: "False positive contested"
  fallout_false_positive_result_failed: "False positive failed"
  fallout_false_positive_callback_settled: "Appeal record consolidated"
  fallout_false_positive_callback_partial: "Appeal record unresolved"
  fallout_false_positive_callback_failed: "Appeal record breached"
