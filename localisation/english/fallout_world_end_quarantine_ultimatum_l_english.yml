chaosx.fallout.1051.t: "The Quarantine Ultimatum"
chaosx.fallout.1051.opening.d: "At the lower river gate of the Congo Green Basin, wet ash has blackened the bridge planks and a neighboring government has hung red quarantine cloth across the road. Its envoy will allow medicine through only if Basin guards accept a named inspection team, a shared fever register, and a return seal for every patient. The mutant polity must decide whether to accept the controls, negotiate the inspection, defy the line, or seek allies before the clinic stores run out."
chaosx.fallout.1051.a: "Accept the named controls"
chaosx.fallout.1051.a.tt: "Spend Food 2, Medicine 1, and Recognition 1 to let the foreign team inspect the river clinic and issue return seals. Disease and exposure fall, but Basin guards lose cohesion while an outside witness gains access to the ledger."
chaosx.fallout.1051.b: "Negotiate a joint inspection"
chaosx.fallout.1051.b.tt: "Spend Scrap 1, Power 1, and Recognition 2 to place Basin healers beside the foreign team at the bridge. The joint register costs medicine and time, but it can raise recognition and settle which authority may close the road."
chaosx.fallout.1051.c: "Defy the red line"
chaosx.fallout.1051.c.tt: "Spend Fuel 2, Recognition 1, and Cohesion 2 to keep the river gate open under Basin guards. The choice protects movement and local pride, but disease and exposure rise while the neighboring government records a refusal."
chaosx.fallout.1051.d: "Seek allies along the hill road"
chaosx.fallout.1051.d.tt: "Spend Food 1, Medicine 2, Fuel 1, and Recognition 2 to send a trusted courier through the hill road for neutral clinic witnesses. The search can widen the Basin's support, but it leaves the lower gate exposed while the convoy travels."
chaosx.fallout.1053.t: "The Gate Ledger Answers"
chaosx.fallout.1053.accept_controls.success.d: "The Basin signs the inspection ledger beneath the lower gate. Foreign nurses enter the river clinic with two Basin guards, every fever case receives a return seal, and the neighboring government reopens the ash road for medicine wagons."
chaosx.fallout.1053.accept_controls.partial.d: "The foreign team receives the river register, but the hill clinic refuses to copy its patient names before the next rain. The lower gate opens for medicine only, and Basin guards must escort every return journey."
chaosx.fallout.1053.accept_controls.failure.d: "The inspection team finds missing names and a flooded medicine store. The neighboring government closes the bridge again, while Basin guards argue over whether the foreign ledger or the hill archive carries the lawful count."
chaosx.fallout.1053.negotiate_inspection.success.d: "Basin healers and foreign nurses sign one register at the bridge table. The joint team limits inspections to named symptoms, shares medicine receipts, and gives the Congo Green Basin a written voice in every closure order."
chaosx.fallout.1053.negotiate_inspection.partial.d: "The joint inspection starts at the river clinic, but a broken power cell leaves the hill pages unsealed. The gate accepts marked medicine crates while the two governments postpone the rule for family crossings."
chaosx.fallout.1053.negotiate_inspection.failure.d: "The inspection talks collapse when neither side accepts the other's patient tally. The foreign team leaves with its seals, the Basin hides the clinic ledger, and the lower river road returns to a guarded closure."
chaosx.fallout.1053.defy_line.success.d: "Basin guards keep the bridge open through the rain and record every crossing in their own hand. A short medicine convoy reaches the hill clinic, and the neighboring government agrees to review the refusal after its first verified delivery."
chaosx.fallout.1053.defy_line.partial.d: "The red cloth comes down for one convoy, but two fever cases cross without a return seal. The Basin keeps the gate, while the neighboring government places a second guard post on the far bank."
chaosx.fallout.1053.defy_line.failure.d: "The defiant guard line burns through its fuel before the hill clinic receives medicine. The bridge closes, the neighboring government names the Basin a noncompliant crossing, and the river wards turn against the guards who promised open passage."
chaosx.fallout.1053.seek_allies.success.d: "A hill-road courier returns with a neutral clinic witness and two mule teams. The witness verifies the Basin register, the lower gate gains a narrow relief corridor, and the neighboring government accepts a three-party seal for medicine and patients."
chaosx.fallout.1053.seek_allies.partial.d: "The courier finds a hill clinic willing to witness the ledger, but only one mule team reaches the bridge. Medicine arrives in marked crates while the neighboring government keeps its red cloth on family crossings."
chaosx.fallout.1053.seek_allies.failure.d: "The hill road collapses under rain before the courier returns. The foreign government tightens the quarantine, the river clinic runs short of medicine, and Basin guards must choose between a closed gate and an unrecorded crossing."
chaosx.fallout.1053.a: "Seal the gate ledger"
chaosx.fallout.1053.a.tt: "Apply the graded quarantine result, record the branch memory, update the neighboring government's opinion, and schedule a delayed wet-season review."
chaosx.fallout.1055.t: "The Wet-Season Review"
chaosx.fallout.1055.success.d: "After the next wet season, the river and hill pages carry the same patient seals. The Basin keeps a named inspection rule, the neighboring government recognizes the three-party ledger, and the bridge opens without a new red line."
chaosx.fallout.1055.partial.d: "The review confirms a working medicine corridor, but the hill archive and foreign ledger still disagree about two family crossings. The lower gate remains open under escort while the Basin repairs its health register."
chaosx.fallout.1055.failure.d: "The review finds a missing seal, an unpaid escort, and two clinics keeping separate fever counts. The neighboring government withdraws recognition, and the Basin must close the river gate until its guards and healers choose one record."
chaosx.fallout.1055.a: "Close the quarantine record"
chaosx.fallout.1055.a.tt: "Apply the delayed review, record the final cause memory, release the gate and witness reservations, and close The Quarantine Ultimatum."
