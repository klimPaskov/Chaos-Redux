fallout.event_log.quarantine_ultimatum.detail.choice_accept_controls: "The Congo Green Basin accepted a named foreign inspection at the lower river gate."
fallout.event_log.quarantine_ultimatum.detail.choice_negotiate_inspection: "The Congo Green Basin made its healers partners in a joint inspection ledger."
fallout.event_log.quarantine_ultimatum.detail.choice_defy_line: "The Congo Green Basin kept the bridge open under its own guards and refused the red line."
fallout.event_log.quarantine_ultimatum.detail.choice_seek_allies: "The Congo Green Basin sent a courier along the hill road for neutral clinic witnesses."
fallout.event_log.quarantine_ultimatum.detail.accept_controls_success: "Named foreign nurses and Basin guards reopened the lower gate for sealed medicine wagons."
fallout.event_log.quarantine_ultimatum.detail.accept_controls_partial: "The river gate opened for medicine, but the hill clinic withheld its patient copy."
fallout.event_log.quarantine_ultimatum.detail.accept_controls_failure: "A flooded store and missing names left the foreign inspection without a trusted count."
fallout.event_log.quarantine_ultimatum.detail.negotiate_inspection_success: "A joint bridge ledger gave Basin healers a written voice in every closure order."
fallout.event_log.quarantine_ultimatum.detail.negotiate_inspection_partial: "The joint team marked medicine crates while family crossings remained disputed."
fallout.event_log.quarantine_ultimatum.detail.negotiate_inspection_failure: "The inspection talks failed and the lower river road returned to guarded closure."
fallout.event_log.quarantine_ultimatum.detail.defy_line_success: "Basin guards kept the bridge open long enough for a verified hill-clinic delivery."
fallout.event_log.quarantine_ultimatum.detail.defy_line_partial: "One convoy crossed without a return seal while a second guard post rose on the far bank."
fallout.event_log.quarantine_ultimatum.detail.defy_line_failure: "Fuel ran out before medicine reached the hill clinic and the bridge was closed."
fallout.event_log.quarantine_ultimatum.detail.seek_allies_success: "A neutral witness and two mule teams created a three-party medicine corridor."
fallout.event_log.quarantine_ultimatum.detail.seek_allies_partial: "A hill witness arrived with one mule team while family crossings stayed closed."
fallout.event_log.quarantine_ultimatum.detail.seek_allies_failure: "Rain broke the hill road and left the river clinic short of medicine."
fallout.event_log.quarantine_ultimatum.detail.callback_success: "The next wet season matched the river and hill seals and removed the red line."
fallout.event_log.quarantine_ultimatum.detail.callback_partial: "The medicine corridor held while two clinics repaired their fever counts."
fallout.event_log.quarantine_ultimatum.detail.callback_failure: "Missing seals and separate clinic counts ended recognition of the gate ledger."
fallout.event_log.quarantine_ultimatum.detail.cancelled: "The Quarantine Ultimatum closed after its gate, witness, owner, or Fallout generation changed."
