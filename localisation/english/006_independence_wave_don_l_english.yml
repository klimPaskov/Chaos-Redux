don_millerovo_emergency_stores: "Millerovo Emergency Stores"
don_millerovo_emergency_stores_desc: "Mounted patrols rely on narrow depots and exposed remount stores. The railhead survey can ease their strain."
don_millerovo_stores_secured: "Millerovo Stores Surveyed"
don_millerovo_stores_secured_desc: "The council has surveyed the remount stores and the supply limits around its inland seat."
don_unratified_service_mandate: "Unratified Service Mandate"
don_unratified_service_mandate_desc: "The host's mounted command serves without a ratified government or agreed district rights."
don_elected_host_assembly: "Elected Host Assembly"
don_elected_host_assembly_desc: "The elected assembly gives host and non-host residents standing to petition the district council."
don_constitutional_district_compact: "Constitutional District Compact"
don_constitutional_district_compact_desc: "The district compact places mounted command under elected civilian oversight."
don_emergency_host_staff: "Emergency Host Staff"
don_emergency_host_staff_desc: "The host staff holds temporary command authority while the civilian council prepares its review."
don_reviewed_civilian_command: "Reviewed Civilian Command"
don_reviewed_civilian_command_desc: "The council has reviewed the service mandate and retained civilian oversight of the mounted command."
don_chartered_host_service: "Chartered Don Service"
don_chartered_host_service_desc: "The ratified charter binds mounted service to the council's recorded rights and remount stores."
don_fractured_host_charter: "Fractured Host Charter"
don_fractured_host_charter_desc: "The council has failed to keep its seat or settle the host's service mandate before the charter deadline."
