l_english:
independence_wave_don_millerovo_charter_category: "Millerovo Host Charter"
independence_wave_don_millerovo_charter_category_desc: "Settle the rail approach, district petitions, mounted-service obligations, and government under the Millerovo charter."
independence_wave_iw_039_don_setup_complete: "Millerovo host charter established"
independence_wave_don_elected_host_assembly: "Elected host assembly selected"
independence_wave_don_constitutional_district_compact: "Constitutional district compact selected"
independence_wave_don_emergency_host_staff: "Emergency host staff selected"
independence_wave_don_charter_ratified: "Millerovo charter ratified"
independence_wave_don_charter_failed: "Millerovo charter has failed"
independence_wave_don_railhead_receipt: "Millerovo railhead survey complete"
independence_wave_don_petition_receipt: "District petition hearing complete"
independence_wave_don_government_receipt: "A host government settlement has been recorded"
independence_wave_don_hold_millerovo_charter: "Hold the Millerovo Charter Together"
independence_wave_don_hold_millerovo_charter_desc: "Within [?constant:independence_wave_don_duration.founding_charter|0] days, keep Millerovo under Don control as the capital, complete a rail and remount survey, hear host and non-host petitions, set a service quota, choose a government, and ratify the charter."
independence_wave_don_charter_failed_tt: "The council loses its seat, the state no longer meets its founding terms, or the deadline passes. The charter fails, legitimacy falls, and former-host hostility and obligations rise."
independence_wave_don_charter_succeeded_tt: "The charter takes effect. Legitimacy, recognition, network standing, and border settlement improve as former-host hostility, obligations, property disputes, and population disputes ease. The charter records the Don-Kuban federation question for a later, separate settlement."
independence_wave_don_review_emergency_host_staff: "Review the Emergency Host Staff"
independence_wave_don_review_emergency_host_staff_desc: "The host staff holds command under a temporary mandate. Millerovo must remain under Don control as the capital while the civilian council reviews its service authority within [?constant:independence_wave_don_duration.emergency_civilian_review|0] days."
independence_wave_don_emergency_review_complete_tt: "The civilian council has reviewed the host staff's mandate, easing instability and former-host hostility."
independence_wave_don_emergency_review_failed_tt: "The host staff's mandate remains unreviewed and the charter fails."
independence_wave_don_audit_millerovo_railhead: "Audit the Millerovo Railhead"
independence_wave_don_audit_millerovo_railhead_desc: "Survey the rail approach and remount stores that sustain the mounted service. Millerovo must remain under Don control as the capital while the audit is underway."
independence_wave_don_railhead_available_tt: "The rail survey requires the completed survey focus, an active charter mission, Millerovo to remain under Don control as the capital, and no other charter project in progress."
independence_wave_don_railhead_complete_tt: "The survey records remount stores and rail limits, improving capacity and security while easing instability."
independence_wave_don_railhead_interrupted_tt: "The railhead survey stops before it is finished, and the political power already spent is not returned."
independence_wave_don_hear_district_petitions: "Hear the District Petitions"
independence_wave_don_hear_district_petitions_desc: "Invite host and non-host residents to present land and service claims to the provisional district council. Millerovo must remain under Don control as the capital while the hearing is underway."
independence_wave_don_petitions_available_tt: "The hearing requires the completed petition focus, an active charter mission, Millerovo to remain under Don control as the capital, and no other charter project in progress."
independence_wave_don_petitions_complete_tt: "The council records host and non-host claims. Legitimacy rises, while property and population disputes and obligations to the former host increase."
independence_wave_don_petitions_interrupted_tt: "The petition hearing stops before it is finished, and the political power already spent is not returned."
independence_wave_don_elect_host_assembly: "Elect the Host Assembly"
independence_wave_don_elect_host_assembly_desc: "Seat an elected host assembly with standing for non-host district petitioners. Its civilian authority rests on the rail survey and the completed hearing."
independence_wave_don_assembly_settled_tt: "The elected host assembly takes office, raises legitimacy, and recognizes non-host petition rights."
independence_wave_don_ratify_district_compact: "Ratify the District Compact"
independence_wave_don_ratify_district_compact_desc: "Place the mounted command under elected civilian oversight and give host and non-host residents standing in the district council."
independence_wave_don_constitutional_settled_tt: "The district compact raises recognition and capacity, settles petition claims, and places mounted command under civilian oversight."
independence_wave_don_establish_emergency_host_staff: "Establish the Emergency Host Staff"
independence_wave_don_establish_emergency_host_staff_desc: "Give the host staff temporary command authority while the civilian council prepares a review of the service mandate. The review must be completed before the charter closes."
independence_wave_don_emergency_settled_tt: "The host staff raises security and war support at the cost of stability and former-host trust. Civilian review is due before the charter closes."
independence_wave_don_review_civilian_command: "Submit Mandate for Civilian Review"
independence_wave_don_review_civilian_command_desc: "Present the emergency service mandate to the civilian council and place the mounted command under its review."
independence_wave_don_focus_group_available_tt: "This focus belongs to the active Don charter. Millerovo must remain under Don control as the capital."
independence_wave_don_service_quota_receipts_tt: "The railhead survey and the petition hearing must both be finished before a service quota can be set."
independence_wave_don_charter_ready_tt: "Millerovo must remain under Don control as the capital. Ratification also requires the finished railhead survey and petition hearing, the service quota focus, one government settlement, and civilian review of the emergency staff when that route is chosen."
independence_wave_don_register_millerovo_authorities: "Register the Millerovo Authorities"
independence_wave_don_register_millerovo_authorities_desc: "The provisional host council records which district offices and mounted staff may act in its name."
independence_wave_don_register_millerovo_authorities_tt: "Register the council and its authority to receive host and non-host petitions, strengthening its legitimacy."
independence_wave_don_survey_rail_and_remount_stores: "Survey Rail and Remount Stores"
independence_wave_don_survey_rail_and_remount_stores_desc: "The inland host depends on the Millerovo rail approach, nearby supply, and stores for its horses. The council opens a paid survey before committing the mounted service."
independence_wave_don_survey_rail_and_remount_stores_tt: "The council can commission a paid survey of the Millerovo railhead and remount stores."
independence_wave_don_hear_land_and_service_claims: "Hear the Land and Service Claims"
independence_wave_don_hear_land_and_service_claims_desc: "The host council invites both host and non-host residents to present their land and service claims before a government is chosen."
independence_wave_don_hear_land_and_service_claims_tt: "The council can convene a paid hearing for host and non-host land and service claims."
independence_wave_don_set_the_service_quota: "Set the Service Quota"
independence_wave_don_set_the_service_quota_desc: "With the remount stores surveyed and district petitions recorded, the council commits the district to mounted service, strengthening security and capacity while increasing obligations to the former host."
independence_wave_don_set_the_service_quota_tt: "The district's mounted-service commitment strengthens security and capacity, increases obligations to the former host, and raises its standing in the independence network."
independence_wave_don_ratify_the_millerovo_charter: "Ratify the Millerovo Charter"
independence_wave_don_ratify_the_millerovo_charter_desc: "The council can ratify a host charter only after the district's rights, government, and mounted-service obligations have been settled."
independence_wave_don_ratify_the_millerovo_charter_tt: "Ratify the charter once the survey, the hearing, the service commitment, the government settlement, and any required civilian review are complete. Its terms take effect when the charter mission is complete, and the separate Don-Kuban federation question is recorded for later settlement."
