l_english:
# Americas framework packages.
independence_wave_gzx_institution: "House of Assembly"
independence_wave_gzx_institution_long: "Newfoundland House of Assembly"
independence_wave_hcx_institution: "Legislature"
independence_wave_hcx_institution_long: "Texas Legislature"
independence_wave_hux_institution: "Territorial Congress"
independence_wave_hux_institution_long: "Congress of the Patagonian Territories"

# Quebec
independence_wave_que_quebec_category: "The Quebec Assembly"
independence_wave_que_quebec_category_desc: "Quebec governs itself. Parishes and the Church shape the countryside, Saint James Street's banks run Montreal, and the depression sends families north to the Abitibi."
independence_wave_que_seat_legislative_assembly: "Seat the Legislative Assembly"
independence_wave_que_seat_legislative_assembly_desc: "Open the Legislative Assembly at Quebec City as the parliament of the new state, with the ministry answerable to it."
independence_wave_que_seat_legislative_assembly_tt: "Adds §YThe Legislative Assembly§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_que_nationalise_power_trusts: "Nationalize the Power Trusts"
independence_wave_que_nationalise_power_trusts_desc: "Buy out the Montreal power companies and place the dams and lines under a public hydro commission."
independence_wave_que_nationalise_power_trusts_tt: "Replaces §YThe Power Trusts§! with §YThe Hydro Commission§!, raises §YCapacity§! and lowers §YRecognition§!."
independence_wave_que_charter_caisses_populaires: "Charter the Caisses Populaires"
independence_wave_que_charter_caisses_populaires_desc: "Give the parish credit unions a national charter and let them lend to farmers and small businesses everywhere."
independence_wave_que_charter_caisses_populaires_tt: "Adds §YThe Caisses Populaires§! and raises §YLegitimacy§! and §YCapacity§!."
independence_wave_que_power_trusts: "The Power Trusts"
independence_wave_que_power_trusts_desc: "A few private companies own the dams, the power lines and the tramways, and set their own rates."
independence_wave_que_legislative_assembly: "The Legislative Assembly"
independence_wave_que_legislative_assembly_desc: "The assembly at Quebec City makes the laws and the ministry answers to it."
independence_wave_que_hydro_commission: "The Hydro Commission"
independence_wave_que_hydro_commission_desc: "A public commission runs the dams and sells power at rates the assembly sets."
independence_wave_que_caisses_populaires: "The Caisses Populaires"
independence_wave_que_caisses_populaires_desc: "Parish credit unions lend the savings of their members to their neighbors."
independence_wave_que_assembly_seated: "The Legislative Assembly has been seated"

# Newfoundland
independence_wave_gzx_newfoundland_category: "The House of Assembly"
independence_wave_gzx_newfoundland_category_desc: "Newfoundland governs itself again after bankruptcy and a London commission. The bondholders still wait, and the outports depend on cod and the merchants of Water Street."
independence_wave_gzx_restore_responsible_government: "Restore Responsible Government"
independence_wave_gzx_restore_responsible_government_desc: "Recall the House of Assembly suspended in 1934 and form a ministry from its members."
independence_wave_gzx_restore_responsible_government_tt: "Adds §YThe House of Assembly§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_gzx_settle_the_bondholders: "Settle the Bondholders"
independence_wave_gzx_settle_the_bondholders_desc: "Negotiate a reduced interest rate with the holders of the dominion's debt in exchange for a fixed repayment plan."
independence_wave_gzx_settle_the_bondholders_tt: "Removes §YThe Dominion Debt§!, raises §YRecognition§! and lowers §YCapacity§!."
independence_wave_gzx_found_fisheries_board: "Found the Fisheries Board"
independence_wave_gzx_found_fisheries_board_desc: "Set grading standards for salt cod, license the exporters and market the catch together abroad."
independence_wave_gzx_found_fisheries_board_tt: "Adds §YThe Fisheries Board§! and raises §YCapacity§!."
independence_wave_gzx_dominion_debt: "The Dominion Debt"
independence_wave_gzx_dominion_debt_desc: "Most of the revenue goes to interest on the dominion's debt, and the creditors watch every budget."
independence_wave_gzx_house_of_assembly: "The House of Assembly"
independence_wave_gzx_house_of_assembly_desc: "The island elects its own assembly again and the ministry answers to it."
independence_wave_gzx_fisheries_board: "The Fisheries Board"
independence_wave_gzx_fisheries_board_desc: "Graded and marketed together, Newfoundland's salt cod fetches better prices abroad."
independence_wave_gzx_assembly_restored: "Responsible government has been restored"

# Texas
independence_wave_hcx_texas_category: "The Texas Legislature"
independence_wave_hcx_texas_category_desc: "Texas governs itself. East Texas oil floods the market, cotton has collapsed, and the plains, coast, and border counties each expect Austin to serve them first."
independence_wave_hcx_seat_legislature_at_austin: "Seat the Legislature at Austin"
independence_wave_hcx_seat_legislature_at_austin_desc: "Convene the Texas Legislature at Austin as the parliament of the new state."
independence_wave_hcx_seat_legislature_at_austin_tt: "Adds §YThe Texas Legislature§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_hcx_empower_railroad_commission: "Empower the Railroad Commission"
independence_wave_hcx_empower_railroad_commission_desc: "Give the Railroad Commission full power to set oil production quotas for every field and to stop oil pumped beyond them."
independence_wave_hcx_empower_railroad_commission_tt: "Replaces §YThe Oil Glut§! with §YThe Proration Orders§!, raises §YCapacity§! and lowers §YInstability§!."
independence_wave_hcx_muster_ranger_companies: "Muster the Ranger Companies"
independence_wave_hcx_muster_ranger_companies_desc: "Raise new Ranger companies to keep order in the oil towns and along the border."
independence_wave_hcx_muster_ranger_companies_tt: "Adds §YThe Ranger Companies§! and raises §YSecurity§!."
independence_wave_hcx_oil_glut: "The Oil Glut"
independence_wave_hcx_oil_glut_desc: "The oil fields produce more than anyone will buy, and the price has fallen to almost nothing."
independence_wave_hcx_texas_legislature: "The Texas Legislature"
independence_wave_hcx_texas_legislature_desc: "The legislature at Austin makes the laws of the state and votes its budget."
independence_wave_hcx_proration_orders: "The Proration Orders"
independence_wave_hcx_proration_orders_desc: "Every oil field pumps to a quota, and the price holds."
independence_wave_hcx_ranger_companies: "The Ranger Companies"
independence_wave_hcx_ranger_companies_desc: "Ranger companies keep order in the oil towns and on the border."
independence_wave_hcx_legislature_seated: "The Texas Legislature has been seated"

# Yucatan
independence_wave_yuc_yucatan_category: "The Yucatan Congress"
independence_wave_yuc_yucatan_category_desc: "Yucatan governs itself. The henequen haciendas hold the best land and pay Maya laborers little, the Socialist Party organizes villages, and everything rides on twine."
independence_wave_yuc_seat_yucatan_congress: "Seat the Yucatan Congress"
independence_wave_yuc_seat_yucatan_congress_desc: "Convene the state congress at Merida as the parliament of the new state."
independence_wave_yuc_seat_yucatan_congress_tt: "Adds §YThe Yucatan Congress§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_yuc_turn_haciendas_into_ejidos: "Turn the Haciendas into Ejidos"
independence_wave_yuc_turn_haciendas_into_ejidos_desc: "Hand the henequen fields to the villages as collective ejidos, with the machinery shared between them."
independence_wave_yuc_turn_haciendas_into_ejidos_tt: "Removes §YThe Henequen Haciendas§!, greatly raises §YLegitimacy§!, lowers §YCapacity§! and raises §YInstability§!."
independence_wave_yuc_open_port_of_progreso: "Open the Port of Progreso"
independence_wave_yuc_open_port_of_progreso_desc: "Extend the pier at Progreso and set the state's own export duty on henequen."
independence_wave_yuc_open_port_of_progreso_tt: "Adds §YThe Port of Progreso§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_yuc_henequen_haciendas: "The Henequen Haciendas"
independence_wave_yuc_henequen_haciendas_desc: "A few hacienda families own the henequen fields, and the villages work them for low wages."
independence_wave_yuc_yucatan_congress: "The Yucatan Congress"
independence_wave_yuc_yucatan_congress_desc: "The congress at Merida makes the laws of the state."
independence_wave_yuc_port_of_progreso: "The Port of Progreso"
independence_wave_yuc_port_of_progreso_desc: "Henequen leaves from Progreso under the state's own export duty."
independence_wave_yuc_congress_seated: "The Yucatan Congress has been seated"

# Incidents
chaosx.nr6.272.t: "The Abitibi Settlers"
chaosx.nr6.272.d: "Families sent north to clear farms in the Abitibi ask for the settlement grants to continue for another season. Their crops are not yet enough to live on."
chaosx.nr6.272.a: "Fund the settlers"
chaosx.nr6.272.b: "End the settlement grants"
chaosx.nr6.273.t: "Strike at Thetford Mines"
chaosx.nr6.273.d: "The asbestos miners of Thetford have struck for better pay and protection from the dust. The mining companies ask the government to declare the strike illegal."
chaosx.nr6.273.a: "Recognize the miners' union"
chaosx.nr6.273.b: "Back the mining companies"
chaosx.nr6.274.t: "The Labrador Boundary"
chaosx.nr6.274.d: "Canada and Quebec dispute the Labrador boundary awarded to Newfoundland in 1927. The ministry can post officers along the line or offer a joint commission."
chaosx.nr6.274.a: "Survey and post the boundary"
chaosx.nr6.274.b: "Offer a joint commission"
chaosx.nr6.275.t: "The Merchants of Water Street"
chaosx.nr6.275.d: "The outport fishermen are paid in credit at the merchants' stores and never see cash. They ask the government to set a price for their fish."
chaosx.nr6.275.a: "Set a fish price for the outports"
chaosx.nr6.275.b: "Leave the trade to the merchants"
chaosx.nr6.276.t: "The Hot Oil Runners"
chaosx.nr6.276.d: "Operators in East Texas are pumping oil beyond their quotas at night and selling it through hidden pipelines."
chaosx.nr6.276.a: "Enforce the quotas"
chaosx.nr6.276.b: "Look the other way"
chaosx.nr6.277.t: "The Border Bridges"
chaosx.nr6.277.d: "Merchants on both banks of the Rio Grande ask for the international bridges to be opened to free trade. The treasury wants customs posts on them."
chaosx.nr6.277.a: "Open the bridges to free trade"
chaosx.nr6.277.b: "Tax the border trade"
chaosx.nr6.278.t: "The Leagues of Resistance"
chaosx.nr6.278.d: "The leagues of resistance of the Socialist Party of the Southeast demand a voice in every village government. The hacienda owners call them agitators."
chaosx.nr6.278.a: "Recognize the leagues"
chaosx.nr6.278.b: "Ban the leagues"
chaosx.nr6.279.t: "The Price of Twine"
chaosx.nr6.279.d: "Cheaper fiber from abroad has driven the price of henequen down again. The growers ask the state to buy the crop at a fixed price."
chaosx.nr6.279.a: "Buy the crop at a fixed price"
chaosx.nr6.279.b: "Let the price fall"
