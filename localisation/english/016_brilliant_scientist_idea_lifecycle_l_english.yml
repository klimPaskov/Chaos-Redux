l_english:
brilliant_scientist_kruger_appointment: "Kruger's Appointment"
brilliant_scientist_kruger_appointment_desc: "Doctor Warren Kruger directs a privileged scientific program whose methods move faster than the institutions assigned to supervise him."
brilliant_scientist_kruger_method: "The Kruger Method"
brilliant_scientist_kruger_method_desc: "Published procedures and independently replicated project families have turned parts of Kruger's practice into a national scientific discipline."
brilliant_scientist_national_scientific_dependence: "National Scientific Dependence"
brilliant_scientist_national_scientific_dependence_desc: "Laboratories, factories, and ministries organize their most ambitious work around one scientist and the apparatus he controls."
brilliant_scientist_public_scientific_renaissance: "Public Scientific Renaissance"
brilliant_scientist_public_scientific_renaissance_desc: "Universities, public laboratories, and industrial institutes share reproducible work under a celebrated national program."
brilliant_scientist_controlled_secret_compact: "Controlled Secret Compact"
brilliant_scientist_controlled_secret_compact_desc: "Kruger's laboratories retain wide operational freedom inside a negotiated security system with guarded records and enforceable limits."
brilliant_scientist_unrestricted_laboratory_state: "Unrestricted Laboratory State"
brilliant_scientist_unrestricted_laboratory_state_desc: "The government has yielded practical sovereignty over laboratories, project forces, and strategic facilities in exchange for results no conventional institution can match."
brilliant_scientist_scientific_vacuum: "Scientific Vacuum"
brilliant_scientist_scientific_vacuum_desc: "Kruger's departure has left unfinished apparatus, broken teams, and institutions built around knowledge they can no longer reproduce."
brilliant_scientist_world_threat_project_state: "World-Threat Project State"
brilliant_scientist_world_threat_project_state_desc: "A sovereign network of laboratories and project armies now treats international resistance as another technical obstacle."
