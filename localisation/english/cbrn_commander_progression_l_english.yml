l_english:
chemical_operations_commander_earned_tt: "Earned after two completed Decontamination Corridor or Combined CBRN Overmatch Headquarters orders. Preparations and canceled orders do not count."
biological_operations_veteran: "Biological Operations Veteran"
biological_operations_veteran_desc: "Has directed sustained medical and containment operations under biological threat."
biological_operations_veteran_earned_tt: "Earned after two completed Mass Antidote Response, Seal Infection Corridor, or Combined CBRN Overmatch Headquarters orders."
hazard_warfare_veteran: "Hazard Warfare Veteran"
hazard_warfare_veteran_desc: "Has directed both chemical and biological operations in the field."
hazard_warfare_veteran_earned_tt: "Earned after qualifying for both Chemical Operations Commander and Biological Operations Veteran."
protected_assault_expert: "Protected Assault Expert"
protected_assault_expert_desc: "Has led protected detachments through repeated engagements."
protected_assault_expert_prerequisites_tt: "Requires Chemical Operations Commander and two combat victories while commanding a protected CBRN detachment."
theatre_containment_organizer: "Theatre Containment Organizer"
theatre_containment_organizer_desc: "Coordinates containment and protected response across an army group."
theatre_containment_organizer_prerequisites_tt: "Requires Hazard Warfare Veteran and two completed containment Headquarters operations."
cbrn_operations_high_command_1: "CBRN Operations Specialist"
cbrn_operations_high_command_1_desc: "Coordinates the field planning and command reserve of CBRN operations."
cbrn_operations_high_command_2: "CBRN Operations Expert"
cbrn_operations_high_command_2_desc: "Coordinates sustained CBRN operations across several commands."
cbrn_operations_high_command_3: "CBRN Operations Genius"
cbrn_operations_high_command_3_desc: "Directs integrated CBRN planning across the armed forces."
