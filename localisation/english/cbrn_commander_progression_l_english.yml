l_english:
chemical_operations_commander_earned_tt: "Earned when this general has seen two Decontamination Corridor orders through to their final day while commanding an army. Preparations, cancelled orders, and orders that finished under another commander do not count."
biological_operations_veteran: "Biological Operations Veteran"
biological_operations_veteran_desc: "Has directed sustained medical and containment operations under biological threat."
biological_operations_veteran_earned_tt: "Earned when this general has seen two Mass Antidote Response or Seal Infection Corridor orders through to their final day while commanding an army."
hazard_warfare_veteran: "Hazard Warfare Veteran"
hazard_warfare_veteran_desc: "Has directed both chemical and biological operations in the field."
hazard_warfare_veteran_earned_tt: "Earned after qualifying for both Chemical Operations Commander and Biological Operations Veteran."
protected_assault_expert: "Protected Assault Expert"
protected_assault_expert_desc: "Has led protected detachments through repeated engagements."
protected_assault_expert_prerequisites_tt: "Requires Chemical Operations Commander and two combats won while this general commands an army that includes a Gas Mask and Decontamination Detachment."
theatre_containment_organizer: "Theatre Containment Organizer"
theatre_containment_organizer_desc: "Coordinates containment and protected response across an army group."
theatre_containment_organizer_prerequisites_tt: "Requires Hazard Warfare Veteran and two Decontamination Corridor, Sealed Operational Area or Seal Infection Corridor orders seen through to their final day."
cbrn_operations_high_command_1: "CBRN Operations Specialist"
cbrn_operations_high_command_1_desc: "Coordinates the field planning and command reserve of CBRN operations."
cbrn_operations_high_command_2: "CBRN Operations Expert"
cbrn_operations_high_command_2_desc: "Coordinates sustained CBRN operations across several commands."
cbrn_operations_high_command_3: "CBRN Operations Genius"
cbrn_operations_high_command_3_desc: "Directs integrated CBRN planning across the armed forces."
cbrn_operations_high_command_specialist_preparation_tt: "Chemical attacks and biological outbreaks in controlled states cause §G[?constant:cbrn_commander_progression.high_command_specialist_bonus|%0] fewer deaths§! and §G[?constant:cbrn_commander_progression.high_command_specialist_bonus|%0] less medical saturation§!. Only the highest appointed CBRN Operations rank applies. CBRN Headquarters orders take §G[?constant:cbrn_commander_progression.high_command_specialist_bonus|%0] less preparation time§!. Stacks with the commanding officer's Chemical Operations Commander bonus. Preparation takes at least §G[?constant:cbrn_hazard_budget.residual_floor|%0]§! of the order's base time."
cbrn_operations_high_command_expert_preparation_tt: "Chemical attacks and biological outbreaks in controlled states cause §G[?constant:cbrn_commander_progression.high_command_expert_bonus|%0] fewer deaths§! and §G[?constant:cbrn_commander_progression.high_command_expert_bonus|%0] less medical saturation§!. Only the highest appointed CBRN Operations rank applies. CBRN Headquarters orders take §G[?constant:cbrn_commander_progression.high_command_expert_bonus|%0] less preparation time§!. Stacks with the commanding officer's Chemical Operations Commander bonus. Preparation takes at least §G[?constant:cbrn_hazard_budget.residual_floor|%0]§! of the order's base time."
cbrn_operations_high_command_genius_preparation_tt: "Chemical attacks and biological outbreaks in controlled states cause §G[?constant:cbrn_commander_progression.high_command_genius_bonus|%0] fewer deaths§! and §G[?constant:cbrn_commander_progression.high_command_genius_bonus|%0] less medical saturation§!. Only the highest appointed CBRN Operations rank applies. CBRN Headquarters orders take §G[?constant:cbrn_commander_progression.high_command_genius_bonus|%0] less preparation time§!. Stacks with the commanding officer's Chemical Operations Commander bonus. Preparation takes at least §G[?constant:cbrn_hazard_budget.residual_floor|%0]§! of the order's base time."
