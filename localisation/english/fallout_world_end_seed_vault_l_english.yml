 chaosx.fallout.188.t: "The Archive Above the Rail Cut"
 chaosx.fallout.188.d: "A cold store survived beneath the old freight embankment. Its drawers hold seed envelopes, field notes, and a ledger that names three districts which still have hands to plant. The archive cannot serve every claimant. The council must decide whether seed is a state reserve, a farmer's trust, a promise between countries, or a thing sold to whoever can pay."
 chaosx.fallout.188.a: "Make the archive a public reserve"
 chaosx.fallout.188.b: "Entrust it to the field cooperatives"
 chaosx.fallout.188.c: "Share the first packets with allies"
 chaosx.fallout.188.e: "Auction access to fund the harvest"
 chaosx.fallout.188.a.tt: "The state will guard the archive and spend scrap on cataloguing, dry storage, and guarded transport."
 chaosx.fallout.188.b.tt: "Farmers will choose the first plots and receive the seed under a binding harvest covenant."
 chaosx.fallout.188.c.tt: "The council will trade seed packets for clean water and recognition from a proven partner."
 chaosx.fallout.188.e.tt: "Licensed buyers will pay for access, creating food and reclamation funds while risking public distrust."
 chaosx.fallout.190.t: "The State Seed Ledger"
 chaosx.fallout.190.success.d: "The public reserve opened under a single ledger. Clerks from the rail cut counted every envelope, while the first protected plots received water before the next frost."
 chaosx.fallout.190.partial.d: "The archive was catalogued, but two drawers had already taken damp. The remaining packets can reach the fields if the reclamation crews keep the route open."
 chaosx.fallout.190.failure.d: "The state seal arrived before the drying racks. Mold and hurried hands ruined part of the archive, and the shelter wards recorded the cost of the lost planting season."
 chaosx.fallout.190.a: "Give the agronomist one season to prove the ledger"
 chaosx.fallout.190.a.tt: "The seed reserve will return for a recorded agronomist review after the first planting."
 chaosx.fallout.191.t: "The Farmers' Covenant"
 chaosx.fallout.191.success.d: "The field cooperatives accepted the archive under a public covenant. Their first plots follow the sheltered drainage lines, and the seed keepers have written down which families carry each variety."
 chaosx.fallout.191.partial.d: "The cooperatives saved a planting schedule, but the cold ground forced them to choose only the safest plots. The covenant now carries a debt to the families left outside the first allotment."
 chaosx.fallout.191.failure.d: "The archive reached the fields without enough sheltered ground. The first planting failed, and families who were promised a share now remember the covenant as a broken law."
 chaosx.fallout.191.a: "Keep the covenant open through the first harvest"
 chaosx.fallout.191.a.tt: "A named agronomist will return with the first harvest report and a durable state memory."
 chaosx.fallout.192.t: "Packets Across the Waterline"
 chaosx.fallout.192.success.d: "The first packets crossed the waterline with a clean-water convoy. The allied delegates recorded the exchange in both ledgers, giving the archive a route beyond one damaged country."
 chaosx.fallout.192.partial.d: "Some packets crossed, but the convoy arrived with less water than promised. The exchange remains visible in both ledgers and the next shipment will be argued over."
 chaosx.fallout.192.failure.d: "The exchange collapsed at the checkpoint. The archive lost a season of water testing, and the partner's delegates now treat the seed offer as another broken promise."
 chaosx.fallout.192.a: "Let the agronomist write the compact's first harvest clause"
 chaosx.fallout.192.a.tt: "The callback will turn this exchange into a remembered compact or a recorded grievance."
 chaosx.fallout.193.t: "A Price on the First Green"
 chaosx.fallout.193.success.d: "Licensed buyers paid in scrap and transport hours. The archive gained a working route to the fields, although every receipt now carries the names of those who could not bid."
 chaosx.fallout.193.partial.d: "The auction paid for part of the route, but the highest bids came from the same districts that already held the safest ground. The public ledger records both the food and the resentment."
 chaosx.fallout.193.failure.d: "The auction drew promises instead of transport. The packets were delayed, the reclamation crews lost their window, and the shelters counted another season without a reliable crop."
 chaosx.fallout.193.a: "Let the agronomist audit every receipt"
 chaosx.fallout.193.a.tt: "The callback will establish whether paid access became a working market or a permanent grievance."
 chaosx.fallout.198.t: "The First Harvest Review"
 chaosx.fallout.198.success.d: "The agronomist returned with envelopes from the first protected plots. The archive now has a living charter, and the state can name which route carried each successful variety."
 chaosx.fallout.198.partial.d: "The review found a usable harvest, but not a common rule. The archive remains open while each district argues over the next packet and the cost of keeping it dry."
 chaosx.fallout.198.failure.d: "The review found no safe harvest to certify. The archive will remain a warning in the state memory, with access grievance attached to every future seed debate."
 chaosx.fallout.198.a: "Record the review beside the seed ledger"
 chaosx.fallout.198.a.tt: "The chain will close after the callback records its outcome and releases the scheduler transactions."
 fallout.event_log.seed_vault.name: "Seed Vault Custody"
 fallout.event_log.seed_vault.detail: "[GetFalloutEvent188EventLogDetail]"
 fallout.event_log.seed_vault.detail.nationalize_success: "The public reserve opened a protected route from the rail-cut archive to the first planting plots."
 fallout.event_log.seed_vault.detail.nationalize_partial: "The public reserve saved a portion of the archive while damp damaged the first catalogue."
 fallout.event_log.seed_vault.detail.nationalize_failure: "The public seal arrived too late and the archive lost packets before the first planting."
 fallout.event_log.seed_vault.detail.farmers_success: "Field cooperatives carried the seed under a public covenant and named the families responsible for each variety."
 fallout.event_log.seed_vault.detail.farmers_partial: "Field cooperatives saved a narrow planting schedule and left an allotment grievance in the ledger."
 fallout.event_log.seed_vault.detail.farmers_failure: "The first cooperative planting failed and the broken covenant became a durable local memory."
 fallout.event_log.seed_vault.detail.allies_success: "A clean-water convoy carried seed packets across the waterline and created a witnessed compact."
 fallout.event_log.seed_vault.detail.allies_partial: "The packet exchange survived with less water than promised and a disputed next shipment."
 fallout.event_log.seed_vault.detail.allies_failure: "The checkpoint dispute ended the exchange and left the partner's archive memory hostile."
 fallout.event_log.seed_vault.detail.auction_success: "Licensed buyers financed a working seed route while the receipts recorded who could not bid."
 fallout.event_log.seed_vault.detail.auction_partial: "The auction paid for part of the route and concentrated the safest plots among the highest bidders."
 fallout.event_log.seed_vault.detail.auction_failure: "The auction produced promises instead of transport and the planting window closed."
 fallout.event_log.seed_vault.detail.callback_success: "The agronomist's harvest review became a living charter for the seed archive."
 fallout.event_log.seed_vault.detail.callback_partial: "The agronomist found a usable harvest without a common rule for the next packet."
 fallout.event_log.seed_vault.detail.callback_failure: "The agronomist found no safe harvest to certify and attached grievance to future seed debates."
