014_cannibalism_all_mouths_one_command_DESC: "Absorb every surviving Host and keep the global Larder functioning."
achievement_cannibalism_all_mouths_one_command_tooltip: "As Hannibal Lecter's unified Host, leave no resistant Host or foreign commune outside your control while maintaining at least §Y[?constant:cannibalism_achievement.functional_larder|0] Global Larder§! and §Y[?constant:cannibalism_achievement.functional_routes|0] connected routes§!."
