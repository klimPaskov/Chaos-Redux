l_english:
alien_infantry_landing_category: "D’Rhondan Landing Network"
alien_infantry_landing_category_desc: "Each landing reserves 2,000 Alien Laser Weapons for seven days. Alien Presence counts successful arrivals. Pact Strain measures how close the pact is to rebellion."
alien_infantry_call_landing: "Call a D’Rhondan Landing"
alien_infantry_call_landing_desc: "Reserve £GFX_alien_laser_weapon_equipment_medium §Y2,000§! Alien Laser Weapons for a D’Rhondan landing in a controlled state. The cohort arrives after seven days."
alien_infantry_landing_mission: "D’Rhondan Landing in Progress"
alien_infantry_landing_mission_desc: "The landing reserve remains committed while the selected state stays under our control."
alien_infantry_landing_reserve_cost_text: "Requires £GFX_alien_laser_weapon_equipment_medium §Y2,000§! Alien Laser Weapons"
alien_infantry_call_landing_effect_tt: "Reserve £GFX_alien_laser_weapon_equipment_medium §Y2,000§! Alien Laser Weapons for seven days. Losing the selected state refunds all £GFX_alien_laser_weapon_equipment_medium §Y2,000§! weapons. A successful landing adds §Y1 Alien Presence§! and §Y5 Pact Strain§!, then starts a 30-day recovery reduced to 24, 18, or 12 days by the D’Rhondan landing network."
