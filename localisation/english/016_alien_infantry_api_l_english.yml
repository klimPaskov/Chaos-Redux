alien_infantry_landing_category: "D’Rhondan Landing Network"
alien_infantry_landing_category_desc: "Each landing reserves £GFX_alien_laser_weapon_equipment_medium §Y[?constant:alien_infantry_landing.reserve_equipment|0]§! Alien Laser Weapons for §Y[?constant:alien_infantry_landing.reservation_days|0] days§!. Alien Presence counts successful arrivals. Pact Strain measures how close the pact is to rebellion."
alien_infantry_call_landing: "Call a D’Rhondan Landing"
alien_infantry_call_landing_desc: "Reserve £GFX_alien_laser_weapon_equipment_medium §Y[?constant:alien_infantry_landing.reserve_equipment|0]§! Alien Laser Weapons for a D’Rhondan landing in a controlled state. The cohort arrives after §Y[?constant:alien_infantry_landing.reservation_days|0] days§!."
alien_infantry_landing_requirements_tt: "Requires an active alien-infantry contact, no landing pending or recovery cooldown, at least £GFX_alien_laser_weapon_equipment_medium §Y[?constant:alien_infantry_landing.reserve_equipment|0]§! Alien Laser Weapons, and one owned, controlled, passable state."
alien_infantry_landing_mission: "D’Rhondan Landing in Progress"
alien_infantry_landing_mission_desc: "The landing reserve remains committed while the selected state stays under our control."
alien_infantry_landing_reserve_cost_text: "Requires £GFX_alien_laser_weapon_equipment_medium §Y[?constant:alien_infantry_landing.reserve_equipment|0]§! Alien Laser Weapons"
alien_infantry_call_landing_effect_tt: "Reserve £GFX_alien_laser_weapon_equipment_medium §Y[?constant:alien_infantry_landing.reserve_equipment|0]§! Alien Laser Weapons for §Y[?constant:alien_infantry_landing.reservation_days|0] days§!.\n§YIf control is lost:§! Refund the full reserve.\n§YIf the landing succeeds:§! Gain §Y[?constant:alien_infantry_landing.presence_gain|0] Alien Presence§! and §Y[?constant:alien_infantry_landing.strain_gain|0] Pact Strain§!, then begin a §Y[?constant:alien_infantry_landing.cooldown_days|0]-day§! recovery. D’Rhondan focuses can reduce recovery to §Y[?constant:alien_infantry_landing.cooldown_days_network|0]§!, §Y[?constant:alien_infantry_landing.cooldown_days_guarded_descent|0]§!, or §Y[?constant:alien_infantry_landing.cooldown_days_near_space|0] days§!."
