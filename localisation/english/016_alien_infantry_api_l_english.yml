l_english:
alien_infantry_landing_category: "D’Rhondan Landing Network"
alien_infantry_landing_category_desc: "Each landing reserves its displayed £GFX_alien_laser_weapon_equipment_medium Alien Laser Weapon cost for [ROOT.GetAlienInfantryLandingReservationDays]. Alien Presence counts arrivals. Pact Strain shows how close the pact is to rebellion."
alien_infantry_call_landing: "Call a D’Rhondan Landing"
alien_infantry_call_landing_desc: "Reserve £GFX_alien_laser_weapon_equipment_medium §Y[?black_friday_alien_infantry_landing_reserve_cost|0]§! Alien Laser Weapons for a D’Rhondan landing in a controlled state. The cohort arrives after [ROOT.GetAlienInfantryLandingReservationDays]."
alien_infantry_landing_requirements_tt: "Requires an active alien-infantry contact, no landing pending or recovery cooldown, at least £GFX_alien_laser_weapon_equipment_medium §Y[?black_friday_alien_infantry_landing_reserve_cost|0]§! Alien Laser Weapons, and one owned, controlled, passable state."
alien_infantry_landing_mission: "D’Rhondan Landing in Progress"
alien_infantry_landing_mission_desc: "The landing reserve remains committed while the selected state stays under our control."
alien_infantry_landing_reserve_cost_text: "Requires £GFX_alien_laser_weapon_equipment_medium §Y[?black_friday_alien_infantry_landing_reserve_cost|0]§! Alien Laser Weapons"
alien_infantry_call_landing_effect_tt: "Reserve the displayed £GFX_alien_laser_weapon_equipment_medium Alien Laser Weapon cost for [ROOT.GetAlienInfantryLandingReservationDays].\n§YIf control is lost:§! Refund the amount actually reserved.\n§YIf the landing succeeds:§! Gain §Y[?constant:alien_infantry_landing.presence_gain|0] Alien Presence§! and §Y[?constant:alien_infantry_landing.strain_gain|0] Pact Strain§!, then begin a §Y[?constant:alien_infantry_landing.cooldown_days|0]-day§! recovery. D’Rhondan focuses can reduce recovery to §Y[?constant:alien_infantry_landing.cooldown_days_network|0]§!, §Y[?constant:alien_infantry_landing.cooldown_days_guarded_descent|0]§!, or §Y[?constant:alien_infantry_landing.cooldown_days_near_space|0] days§!, and the Synod's audited descents and a prepared counterstroke in wartime shorten it further, to no less than §Y[?constant:dhrondan_focus_mechanic.minimum_landing_cooldown_days|0] days§!."
alien_infantry_landing_reservation_days_standard: "§Y[?constant:alien_infantry_landing.reservation_days|0] days§!"
alien_infantry_landing_reservation_days_signal: "§Y[?constant:dhrondan_focus_mechanic.signal_reservation_days|0] days§!"
