independence_wave_form05_charter_category: "Mediterranean Charter Congress"
independence_wave_form05_charter_category_desc: "[This.GetIndependenceWaveForm05Ledger]\n\n§YCongress Seat:§! [This.GetIndependenceWaveForm05CapitalModel]\n§YOur Delegation:§! [This.GetIndependenceWaveForm05DelegationStatus]\n\nThe founding charter requires each article to reach [?constant:independence_wave_form05_progression.first_stage_threshold|0]. After proclamation, the first maritime board must raise all three articles to [?constant:independence_wave_form05_integration_value.completion_threshold|0] and ratify the permanent shipping, warning, and customs institutions."
