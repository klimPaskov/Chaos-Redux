independence_wave_form05_status_observer: "No Founding Mandate"

independence_wave_form05_shipping: "Shipping Guarantees"
independence_wave_form05_shipping_desc: "Shared route books, convoy schedules, port signals, and access guarantees keep traffic moving between sovereign member islands. After proclamation, a permanent shipping board must raise this article to [?constant:independence_wave_form05_integration_value.completion_threshold|0]."
independence_wave_form05_defense: "Common Defense"
independence_wave_form05_defense_desc: "Coastal warnings, reinforcement plans, and garrison communications allow the member governments to react as one without surrendering command of their own forces. After proclamation, a linked warning chain must raise this article to [?constant:independence_wave_form05_integration_value.completion_threshold|0]."
independence_wave_form05_customs: "Customs Union"
independence_wave_form05_customs_desc: "Common manifests, tariffs, quarantine rules, and emergency clearances turn separate island ports into a reliable commercial system. After proclamation, a permanent clearinghouse must raise this article to [?constant:independence_wave_form05_integration_value.completion_threshold|0]."

independence_wave_form05_charter_deadline: "Complete the Maritime Charter"
independence_wave_form05_charter_deadline_desc: "The island delegations have [?constant:independence_wave_mediterranean_duration.form05_deadline_days|0] days to secure shipping guarantees, a common defense protocol, a customs convention, a congress seat, and the consent of at least [?constant:independence_wave_formable_registry.mediterranean_island_league.minimum_consents|0] sovereign governments."
independence_wave_form05_petition_maritime_congress: "Petition a Maritime Congress"
independence_wave_form05_petition_maritime_congress_desc: "Commit an administrative mission and a convoy-backed diplomatic mission for [?constant:independence_wave_mediterranean_duration.project_long_days|0] days. A connected Corsican, Sardinian, or Sicilian government must be able to send a delegation through a controlled naval base."
independence_wave_form05_accept_charter_invitation: "Authorize a Founding Delegation"
independence_wave_form05_accept_charter_invitation_desc: "Send a sovereign delegation to the active maritime congress after a [?constant:independence_wave_mediterranean_duration.project_short_days|0]-day consultation. Ratification records membership without surrendering our country, states, capital, cores, armed forces, or national institutions."
independence_wave_form05_withhold_charter_invitation: "Withhold the Founding Mandate"
independence_wave_form05_withhold_charter_invitation_desc: "Spend [?constant:independence_wave_mediterranean_duration.project_short_days|0] days closing the delegation brief and notify the congress that our government will not ratify the founding charter."
independence_wave_form05_chart_convoy_guarantees: "Chart the Convoy Guarantees"
independence_wave_form05_chart_convoy_guarantees_desc: "Commit command attention and [?constant:independence_wave_decision_cost.convoy_standard|0] convoys for [?constant:independence_wave_mediterranean_duration.project_standard_days|0] days. The delegations will publish protected routes, insurance rules, port signals, and reciprocal access schedules."
independence_wave_form05_ratify_common_defense_protocol: "Ratify the Common Defense Protocol"
independence_wave_form05_ratify_common_defense_protocol_desc: "Commit [?constant:independence_wave_decision_cost.manpower_standard|0] manpower, [?constant:independence_wave_decision_cost.army_experience_standard|0] Army Experience, [?constant:independence_wave_decision_cost.infantry_standard|0] infantry equipment, and [?constant:independence_wave_decision_cost.support_standard|0] support equipment for a [?constant:independence_wave_mediterranean_duration.project_long_days|0]-day coastal warning and reinforcement plan."
independence_wave_form05_conclude_customs_convention: "Conclude the Customs Convention"
independence_wave_form05_conclude_customs_convention_desc: "Assign administrators, port clerks, convoy inspectors, and civilian industry for [?constant:independence_wave_mediterranean_duration.project_standard_days|0] days. The convention unifies manifests, quarantine rules, tariffs, and emergency supply clearance."
independence_wave_form05_settle_congress_seat: "Settle the Congress Seat"
independence_wave_form05_settle_congress_seat_desc: "Spend [?constant:independence_wave_mediterranean_duration.project_standard_days|0] days resolving whether the congress rotates among member islands or keeps a permanent secretariat at the carrier capital. All three public charter values must reach [?constant:independence_wave_form05_progression.compromise_threshold|0] and a second sovereign government must consent."
independence_wave_form05_proclaim_island_league: "Proclaim the Mediterranean Island League"
independence_wave_form05_proclaim_island_league_desc: "Complete a [?constant:independence_wave_mediterranean_duration.project_long_days|0]-day ratification session after Shipping Guarantees, Common Defense, and Customs Union each reach [?constant:independence_wave_form05_progression.first_stage_threshold|0]. The carrier will speak publicly as the Mediterranean Island League while every consenting government remains sovereign."
independence_wave_form05_reopen_maritime_congress: "Reopen the Maritime Congress"
independence_wave_form05_reopen_maritime_congress_desc: "After the [?constant:independence_wave_mediterranean_duration.form05_recovery_days|0]-day recovery period, commit stability, command attention, shipping, and civilian industry to restore the opening articles and call the delegations back to the charter table."

independence_wave_form05_complete_first_maritime_board: "Complete the First Maritime Board"
independence_wave_form05_complete_first_maritime_board_desc: "The proclaimed league has [?constant:independence_wave_form05_integration_duration.first_board_deadline_days|0] days to establish a common shipping board, link the coastal warning stations, open a customs clearinghouse, and ratify the three institutions. Every public charter article must reach [?constant:independence_wave_form05_integration_value.completion_threshold|0]."
independence_wave_form05_establish_common_shipping_board: "Establish the Common Shipping Board"
independence_wave_form05_establish_common_shipping_board_desc: "Commission representatives from the sovereign member ports to publish convoy schedules, reciprocal access rules, insurance guarantees, and a common route book. The board requires a living autonomous member and an open first session."
independence_wave_form05_link_coastal_warning_stations: "Link the Coastal Warning Stations"
independence_wave_form05_link_coastal_warning_stations_desc: "Connect island signal posts, harbor watches, and garrison communications through one reporting chain. Each member keeps command of its own forces while receiving the same warnings and reinforcement requests."
independence_wave_form05_open_customs_clearinghouse: "Open the Customs Clearinghouse"
independence_wave_form05_open_customs_clearinghouse_desc: "Create a permanent office for reconciling manifests, tariffs, quarantine rules, and emergency supply clearance between the sovereign member ports."
independence_wave_form05_ratify_first_maritime_board: "Ratify the First Maritime Board"
independence_wave_form05_ratify_first_maritime_board_desc: "Enter the shipping board, coastal warning chain, and customs clearinghouse into the law of the league. Ratification requires all three institutions, all three charter articles at [?constant:independence_wave_form05_integration_value.completion_threshold|0], and at least one living autonomous member."
independence_wave_form05_reconvene_first_maritime_board: "Reconvene the First Maritime Board"
independence_wave_form05_reconvene_first_maritime_board_desc: "The first session expired before its institutions could be ratified. Commit political authority, command attention, shipping, and civilian industry to recall the autonomous members and reopen the board."

