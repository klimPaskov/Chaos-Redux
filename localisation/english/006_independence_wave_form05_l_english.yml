independence_wave_form05_petition_maritime_congress_effect_tt: "Opens a [?constant:independence_wave_mediterranean_duration.form05_deadline_days|0]-day charter mission with Shipping Guarantees at [?constant:independence_wave_form05_progression.shipping_start|0], Common Defense at [?constant:independence_wave_form05_progression.defense_start|0], and Customs Union at [?constant:independence_wave_form05_progression.customs_start|0]. Connected Corsican, Sardinian, and Sicilian governments receive invitations."
independence_wave_form05_accept_charter_invitation_effect_tt: "Grants this sovereign government a founding mandate and adds its consent to the active carrier."
independence_wave_form05_withhold_charter_invitation_effect_tt: "Records this government as outside the founding charter."
independence_wave_form05_chart_convoy_guarantees_effect_tt: "Shipping Guarantees and Customs Union each increase by [?constant:independence_wave_form05_progression.project_decisive|0]."
independence_wave_form05_ratify_common_defense_protocol_effect_tt: "Common Defense increases by [?constant:independence_wave_form05_progression.project_decisive|0] and Shipping Guarantees increase by [?constant:independence_wave_form05_progression.project_major|0]."
independence_wave_form05_conclude_customs_convention_effect_tt: "Customs Union and Common Defense each increase by [?constant:independence_wave_form05_progression.project_decisive|0]."
independence_wave_form05_proclaim_island_league_effect_tt: "The carrier takes the name and banner of the Mediterranean Island League, and every connected consenting island is recorded as a sovereign member. No country is annexed, no state is transferred, and no core is granted."
independence_wave_form05_reopen_maritime_congress_effect_tt: "Removes the charter breakdown and opens a fresh [?constant:independence_wave_mediterranean_duration.form05_deadline_days|0]-day congress."
independence_wave_form05_establish_common_shipping_board_effect_tt: "The common shipping board is established. Shipping Guarantees rise by [?constant:independence_wave_form05_integration_value.primary_project_gain|0] and Customs Union rises by [?constant:independence_wave_form05_integration_value.secondary_project_gain|0]."
independence_wave_form05_link_coastal_warning_stations_effect_tt: "The coastal warning chain is linked. Common Defense rises by [?constant:independence_wave_form05_integration_value.primary_project_gain|0] and Shipping Guarantees rise by [?constant:independence_wave_form05_integration_value.secondary_project_gain|0]."
independence_wave_form05_open_customs_clearinghouse_effect_tt: "The customs clearinghouse opens. Customs Union rises by [?constant:independence_wave_form05_integration_value.primary_project_gain|0] and Common Defense rises by [?constant:independence_wave_form05_integration_value.secondary_project_gain|0]."
independence_wave_form05_ratify_first_maritime_board_effect_tt: "The common shipping board, coastal warning chain, and customs clearinghouse enter into force across the league."
independence_wave_form05_reconvene_first_maritime_board_effect_tt: "The failed deadline is set aside and a new [?constant:independence_wave_form05_integration_duration.first_board_deadline_days|0]-day board session begins."

independence_wave_form05_provisional_maritime_charter: "Provisional Maritime Charter"
independence_wave_form05_provisional_maritime_charter_desc: "The carrier has opened its ports and ministries to an island congress. Convoy insurers, coast-watch officers, customs clerks, and sovereign delegations are drafting one enforceable maritime charter."
independence_wave_form05_ratified_island_union: "Ratified Island Union"
independence_wave_form05_ratified_island_union_desc: "Member governments share convoy guarantees, coastal warnings, customs schedules, and a congress while retaining their own states, capitals, armed forces, and national institutions."
independence_wave_form05_charter_breakdown: "Charter Breakdown"
independence_wave_form05_charter_breakdown_desc: "The charter's delegates and boards have left essential articles unsettled. Shipping guarantees have narrowed, defense planning has stalled, and customs authorities are restoring separate procedures."

chaosx.nr6.28.t: "The Island Delegations Assemble"
chaosx.nr6.28.d: "Delegates arrive by steamer under separate flags. The charter table places convoy insurance, port signals, coastal warning, customs schedules, and the seat of the congress before them. Each government keeps its own mandate while the clerks begin drafting common maritime law."
chaosx.nr6.28.a: "Open the charter books"
chaosx.nr6.29.t: "Where the Congress Will Sit"
chaosx.nr6.29.d: "The working articles are ready, yet the delegations still dispute the seat of the league. A rotating congress protects the equality of the islands. A permanent secretariat offers continuity at the carrier capital. Either settlement will complete the administrative article."
chaosx.nr6.29.a: "Rotate the congress among the member islands"
chaosx.nr6.29.b: "Seat a permanent secretariat at our capital"
chaosx.nr6.30.t: "The Mediterranean Island League"
chaosx.nr6.30.d: "The delegations sign the charter beneath the flags of their own governments. Convoy guarantees, coastal warnings, customs schedules, and the congress enter into force together. The carrier speaks for the league at sea while every member keeps its sovereignty on land."
chaosx.nr6.30.a: "Carry the charter to every member port"
chaosx.nr6.31.t: "The Charter Table Empties"
chaosx.nr6.31.d: "The deadline passes with essential articles unsettled. Insurers withdraw their guarantees, defense officers return to separate commands, and customs clerks close the common books. Another congress will require a long season of repair."
chaosx.nr6.31.a: "Preserve the drafts for a later congress"

chaosx.nr6.32.t: "The First Maritime Board Convenes"
chaosx.nr6.32.d: "The league's name is written above the congress doors, but its institutions still rest on provisional articles. Port delegates ask for a permanent shipping board before private schedules return. Coast-watch officers warn that a shared flag means little if an alarm still stops at the water's edge. The first allocation will reveal what the new league considers most urgent."
chaosx.nr6.32.a: "Favor shipping, even at defense's expense"
chaosx.nr6.32.b: "Favor warnings, even at customs' expense"
chaosx.nr6.33.t: "The Charter Becomes an Institution"
chaosx.nr6.33.d: "The shipping board's route books reach every member port. Warning stations exchange signals without waiting for separate diplomatic notes, and the clearinghouse settles disputed manifests under the same published rules. The sovereign islands have turned their founding promises into offices that can survive the delegates who signed them."
chaosx.nr6.33.a: "Enter the board in every member ledger"
chaosx.nr6.33.a.tt: "The common shipping board, coastal warning chain, and customs clearinghouse are fully ratified across the Mediterranean Island League."
chaosx.nr6.34.t: "The First Board Loses the Tide"
chaosx.nr6.34.d: "The session expires with route books unfinished, warning stations divided, and customs disputes returning to private negotiation. Every charter article loses ground as the member governments resume separate practices. The league can call another board, but it must first decide which broken promise to repair in public."
chaosx.nr6.34.a: "Spend civil authority to restore the shipping ledger"
chaosx.nr6.34.b: "Spend military confidence to restore the warning ledger"
