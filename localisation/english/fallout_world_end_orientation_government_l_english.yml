chaosx.fallout.74.t: "Who Carries the Public Seal"
chaosx.fallout.74.d: "[This.GetFalloutOrientationGovernmentCountryOpeningText]\n\n[This.GetFalloutOrientationGovernmentArchetypeText] The council must choose whether authority will be concentrated, divided through a compact, or extended to a rival institution before the next public orders leave the assigned capital."
chaosx.fallout.74.a: "[This.GetFalloutOrientationGovernmentConsolidateOption]"
chaosx.fallout.74.a.tt: "Commit §Y[?constant:fallout_orientation_cost.government_consolidate_food|0] Food§! and §Y[?constant:fallout_orientation_cost.government_consolidate_fuel|0] Fuel§!. Strong authority adds §Y[?constant:fallout_orientation_result.government_consolidate_success_recognition|0] Recognition§! and §Y[?constant:fallout_orientation_result.government_consolidate_success_cohesion|0] Cohesion§!, grants consolidated authority for §Y[?constant:fallout_orientation_duration.consolidated_authority_days|0] days§!, and [This.GetFalloutOrientationGovernmentEffectPreview]. A contested result grants smaller gains and contested authority. Failure lowers Recognition and Cohesion and creates a legitimacy crisis."
chaosx.fallout.74.b: "[This.GetFalloutOrientationGovernmentDivisionOption]"
chaosx.fallout.74.b.tt: "Commit §Y[?constant:fallout_orientation_cost.government_division_food|0] Food§! and §Y[?constant:fallout_orientation_cost.government_division_shelter|0] Shelter capacity§!. Success adds §Y[?constant:fallout_orientation_result.government_division_success_recognition|0] Recognition§! and §Y[?constant:fallout_orientation_result.government_division_success_cohesion|0] Cohesion§! and records a durable institutional compact. A contested result records a disputed compact with smaller gains. Failure lowers Recognition and Cohesion and records an unresolved institutional dispute."
chaosx.fallout.74.c: "[This.GetFalloutOrientationGovernmentRivalOption]"
chaosx.fallout.74.c.tt: "Commit §Y[?constant:fallout_orientation_cost.government_rival_scrap|0] Scrap§! and §Y[?constant:fallout_orientation_cost.government_rival_fuel|0] Fuel§!. Success adds §Y[?constant:fallout_orientation_result.government_rival_success_recognition|0] Recognition§! and §Y[?constant:fallout_orientation_result.government_rival_success_cohesion|0] Cohesion§! and records the rival as integrated. A contested result leaves the rival autonomous with smaller gains. Failure lowers Recognition and Cohesion and records a rupture."

chaosx.fallout.76.t: "The Authority Return"
chaosx.fallout.76.consolidate.success.d: "[This.GetFalloutOrientationGovernmentCountryResultText] The central warrant reached stores, route guards, and district offices with one recognized signature. [This.GetFalloutOrientationLastGovernmentEffectClause]"
chaosx.fallout.76.consolidate.partial.d: "[This.GetFalloutOrientationGovernmentCountryResultText] The central office gained obedience in the assigned capital, but district institutions retained separate custody over stores and escorts. The authority remains under review."
chaosx.fallout.76.consolidate.failure.d: "[This.GetFalloutOrientationGovernmentCountryResultText] Several offices rejected the central warrant and continued issuing incompatible orders. The failed consolidation opened a legitimacy crisis across the public counters."
chaosx.fallout.76.division.success.d: "[This.GetFalloutOrientationGovernmentCountryResultText] The represented institutions signed one compact with named powers, stores, and appeal duties. The agreement raised both public recognition and internal cohesion."
chaosx.fallout.76.division.partial.d: "[This.GetFalloutOrientationGovernmentCountryResultText] The compact assigned offices and duties, but one represented body withheld full assent. Authority can move, although every major order will reopen the dispute."
chaosx.fallout.76.division.failure.d: "[This.GetFalloutOrientationGovernmentCountryResultText] The delegates left with incompatible copies of the compact and renewed claims over stores, guards, and shelter space. The institutional dispute remains open."
chaosx.fallout.76.rival.success.d: "[This.GetFalloutOrientationGovernmentCountryResultText] The rival authority accepted a named office, bounded command, and common public register. Its routes and guards now answer through the national order."
chaosx.fallout.76.rival.partial.d: "[This.GetFalloutOrientationGovernmentCountryResultText] The rival accepted coordination but kept its own command and stores. The agreement prevented an immediate break while preserving an autonomous center of power."
chaosx.fallout.76.rival.failure.d: "[This.GetFalloutOrientationGovernmentCountryResultText] The rival rejected the offered mandate and withdrew its people, records, or guards. The rupture damaged recognition and cohesion before the next orders could leave."
chaosx.fallout.76.a: "Enter the authority return."
chaosx.fallout.76.a.tt: "The authority return records the chosen institution, its result, and the durable government memory."
