l_english:
fallout_orientation_government_opening_federal_continuity_zone: "The emergency congress, state guard custodians, and county shelter boards have all arrived with separate warrants. None can govern the grain trains and filter shops without naming which offices must obey the others."
fallout_orientation_government_opening_alpine_redoubt: "Tunnel wardens have seated the bunker council beneath the fort doors while surface cantons wait for recognized delegates. Glacier water and hydro service depend on a chain of authority both populations will obey."
fallout_orientation_government_opening_rhine_dead_cities: "Salvage guilds, municipal wards, and permit physicians have filled the hearing room with competing claims. The dead-city routes need one public authority before another crew enters the poisoned factories."
fallout_orientation_government_opening_don_steppe_hetmanates: "The elected hetman, militia rada, and convoy hosts have brought armed escorts to the grain-road council. Barge tolls and rail protection cannot remain under three separate orders."
fallout_orientation_government_opening_mekong_greenhouse_compact: "The agronomist council has called ferry captains, seed custodians, and village ration delegates into the greenhouse hall. The river deliveries need an authority that can bind both banks."
fallout_orientation_government_opening_bengal_delta_raft_republic: "Raft wards, landing councils, and boat militia captains have gathered beside the raised grain store. Harbor rescue and ration law now require a government that can cross the damaged delta."
fallout_orientation_government_opening_levant_quarantine_cities: "The health command, municipal delegates, and field-hospital registrars have met inside the certified district. Cordon gates and cistern schedules need one appealable public order."
fallout_orientation_government_opening_congo_green_basin: "The altered river assembly, mixed-family clinics, and settlement guards have opened a basin council. Equal civic standing must be defended without surrendering the landings to quarantine command."
fallout_orientation_government_opening_sahel_caravan_wards: "Caravan delegates, well guardians, and radio-market judges have halted the departure schedule for a public council. The next route cannot carry several incompatible laws."
fallout_orientation_government_opening_ethiopian_highland_refuge: "The refuge council, storehouse clerks, relief custodians, and mountain officers have assembled above the damaged road. Bread convoys and sanctuary claims need one recognized compact."
fallout_orientation_government_opening_atacama_observatory_state: "The observatory council has summoned pump engineers, mine delegates, port clerks, and security guards. Water forecasts and convoy orders can no longer be issued by separate rooms."
fallout_orientation_government_opening_antarctic_listening_government: "Human records officers, maintenance crews, and the station protocol have produced different answers to the same emergency. The occupied modules need a named authority for exceptions and rescue duty."

fallout_orientation_government_result_federal_continuity_zone: "Congress clerks posted the final warrants beside the county rolls and state guard depot lists."
fallout_orientation_government_result_alpine_redoubt: "Tunnel wardens and surface delegates entered the decision in the same fort and water register."
fallout_orientation_government_result_rhine_dead_cities: "The salvage hearing published its decision at the permit office, pump room, and factory gate."
fallout_orientation_government_result_don_steppe_hetmanates: "The hetman's clerks carried the signed order to the grain roads, barge landings, and host camps."
fallout_orientation_government_result_mekong_greenhouse_compact: "Ferry captains and seed custodians read the same authority order to the river wards."
fallout_orientation_government_result_bengal_delta_raft_republic: "Landing councils copied the decision onto every raft-clinic and grain-barge schedule."
fallout_orientation_government_result_levant_quarantine_cities: "Hospital registrars posted the authority order at each clinic, cistern, and cordon appeal desk."
fallout_orientation_government_result_congo_green_basin: "The basin assembly read the decision at the river clinics and mixed-family landings."
fallout_orientation_government_result_sahel_caravan_wards: "Radio markets repeated the ruling to every well ward before the convoys resumed movement."
fallout_orientation_government_result_ethiopian_highland_refuge: "Storehouse clerks and road guards carried the compact to the highland kitchens and clinics."
fallout_orientation_government_result_atacama_observatory_state: "The observatory transmitted the ruling with the pump schedule and Pacific convoy window."
fallout_orientation_government_result_antarctic_listening_government: "Human records officers entered the decision beside the station schedule and rescue watch."

fallout_orientation_government_consolidate_federal_continuity_zone: "Place the emergency congress above every district warrant."
fallout_orientation_government_consolidate_alpine_redoubt: "Confirm the bunker council as the redoubt command."
fallout_orientation_government_consolidate_rhine_dead_cities: "Give the salvage senate custody of the public permit book."
fallout_orientation_government_consolidate_don_steppe_hetmanates: "Bind every host and road guard to the elected hetman."
fallout_orientation_government_consolidate_mekong_greenhouse_compact: "Give the agronomist council final authority over river delivery."
fallout_orientation_government_consolidate_bengal_delta_raft_republic: "Confirm the delta relief council over every landing."
fallout_orientation_government_consolidate_levant_quarantine_cities: "Place the certified districts under the health command."
fallout_orientation_government_consolidate_congo_green_basin: "Confirm the altered river assembly as the basin authority."
fallout_orientation_government_consolidate_sahel_caravan_wards: "Give the caravan assembly final authority over the route."
fallout_orientation_government_consolidate_ethiopian_highland_refuge: "Confirm the refuge council over the highland relief network."
fallout_orientation_government_consolidate_atacama_observatory_state: "Give the observatory council final command of public utilities."
fallout_orientation_government_consolidate_antarctic_listening_government: "Maintain the station protocol under one human review office."

fallout_orientation_government_division_federal_continuity_zone: "Write state guard and county representation into the federal compact."
fallout_orientation_government_division_alpine_redoubt: "Give the surface cantons seats beside the tunnel wards."
fallout_orientation_government_division_rhine_dead_cities: "Divide authority among guild assessors and municipal services."
fallout_orientation_government_division_don_steppe_hetmanates: "Recognize the militia rada and route communities in the host compact."
fallout_orientation_government_division_mekong_greenhouse_compact: "Share the river order with ferry and village councils."
fallout_orientation_government_division_bengal_delta_raft_republic: "Give raft wards and landing councils binding votes."
fallout_orientation_government_division_levant_quarantine_cities: "Seat municipal and relief delegates beside the health command."
fallout_orientation_government_division_congo_green_basin: "Form a mixed clinic and settlement compact."
fallout_orientation_government_division_sahel_caravan_wards: "Share route authority with well guardians and settled markets."
fallout_orientation_government_division_ethiopian_highland_refuge: "Create a lay and relief compact for the highland roads."
fallout_orientation_government_division_atacama_observatory_state: "Give mine and port communities audited representation."
fallout_orientation_government_division_antarctic_listening_government: "Give the crew assembly formal exception power."

fallout_orientation_government_rival_federal_continuity_zone: "Bring the military custodian into government under a named warrant."
fallout_orientation_government_rival_alpine_redoubt: "Bind the redoubt command to a public fort charter."
fallout_orientation_government_rival_rhine_dead_cities: "Offer the medical police a bounded place in the salvage order."
fallout_orientation_government_rival_don_steppe_hetmanates: "Integrate the autonomous convoy host before it closes the junction."
fallout_orientation_government_rival_mekong_greenhouse_compact: "Bring the armed ferry command under the greenhouse ledger."
fallout_orientation_government_rival_bengal_delta_raft_republic: "Bind the boat militia admirals to the landing schedule."
fallout_orientation_government_rival_levant_quarantine_cities: "Place the medical police under municipal appeal."
fallout_orientation_government_rival_congo_green_basin: "Offer the quarantine command a bounded public mandate."
fallout_orientation_government_rival_sahel_caravan_wards: "Bring the breakaway route captain before the caravan court."
fallout_orientation_government_rival_ethiopian_highland_refuge: "Bind the mountain army command to the relief road compact."
fallout_orientation_government_rival_atacama_observatory_state: "Place the mine guards under the published utility order."
fallout_orientation_government_rival_antarctic_listening_government: "Subject the closed caretaker protocol to human exception review."

