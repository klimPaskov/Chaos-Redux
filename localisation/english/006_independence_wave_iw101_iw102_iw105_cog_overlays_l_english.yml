  independence_wave_iw102_integrate_kuba_forest_guard_desc: "Forest guards and local infantry receive one service charter while officers record which communities supplied each formation."
  independence_wave_iw102_integrate_kuba_forest_guard_effect_tt: "Forest integration strengthens the royal council while consuming some territorial capacity."
  independence_wave_iw102_hold_kuba_forest_anchor: "Hold the Kuba Forest Anchor"
  independence_wave_iw102_hold_kuba_forest_anchor_desc: "Keep a supplied guard in state 538 while the Kuba cosmetic carrier controls its forest anchor."
  independence_wave_iw102_hold_kuba_forest_anchor_success_effect_tt: "The forest guard demonstrates that the council can defend its own anchor."
  independence_wave_iw102_hold_kuba_forest_anchor_failure_effect_tt: "The forest guard failed, damaging stability and council legitimacy."
  independence_wave_iw102_charter_kuba_council: "Charter the Kuba Council"
  independence_wave_iw102_charter_kuba_council_desc: "A territorial compact gives forest, customary, court, municipal, and veteran interests a written voice before any settlement is considered."
  independence_wave_iw102_charter_kuba_council_effect_tt: "The council records a forest-defense charter and territorial compact without creating a new Kuba tag."
  independence_wave_iw102_kuba_contested_royal_council: "Contested Kuba Royal Council"
  independence_wave_iw102_kuba_contested_royal_council_desc: "The provisional council still balances court, customary, municipal, veteran, and sponsor interests in the forest."
  independence_wave_iw102_kuba_integrated_forest_guard: "Integrated Kuba Forest Guard"
  independence_wave_iw102_kuba_integrated_forest_guard_desc: "The provisional council has aligned forest forces and depots under a common command."
  independence_wave_iw102_kuba_council_charter: "Kuba Council Charter"
  independence_wave_iw102_kuba_council_charter_desc: "A provisional council gives forest communities and local institutions a recorded place in the kingdom."
  independence_wave_iw102_kuba_territorial_compact: "Kuba Territorial Compact"
  independence_wave_iw102_kuba_territorial_compact_desc: "Forest authorities and the royal council share responsibility for the anchor."

