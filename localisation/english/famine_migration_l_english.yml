famine_migration_achievement_eligible_tooltip: "Available in a natural campaign as a human country using the normal civilian system. Debug, forced-trigger, and scenario shortcuts disqualify the attempt."
famine_migration_break_the_blockade_NAME: "Break the Blockade"
famine_migration_break_the_blockade_DESC: "Restore relief to a blockaded island famine and preserve its threatened population."
famine_migration_break_the_blockade_tooltip: "Prove a wartime island blockade famine, restore a valid relief route, recover below famine, and preserve at least 70% of the threatened population. Forced removal, predatory requisition, concealed mass mortality, wasteland conversion, and self-created route exploits disqualify the attempt."
famine_migration_no_one_left_at_the_gate_NAME: "No One Left at the Gate"
famine_migration_no_one_left_at_the_gate_DESC: "Protect every cohort in a major trapped-border crisis and secure a durable outcome."
famine_migration_no_one_left_at_the_gate_tooltip: "Protect every valid cohort in one major border crisis, keep reception below catastrophic famine, and complete voluntary return, integration, or resettlement. Violent pushback, forced return, internment, or forced labor of the protected cohort disqualifies the attempt."
famine_migration_roads_home_NAME: "Roads Home"
famine_migration_roads_home_DESC: "Restore a safe origin and voluntarily return most of a long-displaced cohort."
famine_migration_roads_home_tooltip: "Keep a cohort at least as large as 25,000 people or 2% of the country's initial core population, whichever is greater, displaced for 180 days. End its cause, restore food, housing, route safety, and protection at the origin, then voluntarily return at least 75% of those eligible. Forced return or a failed population ledger disqualifies the attempt."
famine_migration_bread_across_the_front_NAME: "Bread Across the Front"
famine_migration_bread_across_the_front_DESC: "Hold a humanitarian corridor until relief resolves a famine or trapped-population crisis."
famine_migration_bread_across_the_front_tooltip: "Open a proven corridor across an active front, hold it for 60 days, and move the target below famine or trapped status. Attacking the protected corridor or deliberately manufacturing its crisis disqualifies the attempt."
famine_migration_hungry_not_contagious_NAME: "They Were Hungry, Not Contagious"
famine_migration_hungry_not_contagious_DESC: "Receive an outbreak-exposed famine cohort safely and reach a durable outcome."
famine_migration_hungry_not_contagious_tooltip: "Use controlled medical reception for a cohort with proven outbreak exposure, prevent a host outbreak and catastrophic overload, then complete a durable outcome. Internment, forced labor, or forced return disqualifies the attempt."
famine_migration_a_place_at_the_table_NAME: "A Place at the Table"
famine_migration_a_place_at_the_table_DESC: "Integrate large displaced populations from at least three origins without coercion."
famine_migration_a_place_at_the_table_tooltip: "Integrate cohorts from at least three distinct origins until their total reaches 5% of the host's initial core population. Keep major receiving states above famine and Stability above 50%. Transfer cycling, violent pushback, forced labor, or forced return disqualifies the attempt."
famine_migration_the_grain_stayed_home_NAME: "The Grain Stayed Home"
famine_migration_the_grain_stayed_home_DESC: "Suspend extraction during a real shortage and preserve national survival through other logistics."
famine_migration_the_grain_stayed_home_tooltip: "Face an acute crop or transport shock while extraction is active, suspend extraction before catastrophic famine, prove an alternative logistical solution, and recover the state. Requisitioning another strained state disqualifies the attempt."
famine_migration_the_country_did_not_empty_NAME: "The Country Did Not Empty"
famine_migration_the_country_did_not_empty_DESC: "Survive simultaneous war, famine, and mass displacement without losing the country's population floor."
famine_migration_the_country_did_not_empty_tooltip: "Have at least three core states enter severe famine or displacement, with at least 15% of the initial core population threatened. Recover every famine state, resolve every major cohort, remain independent, and keep each affected core state above 15% of its population when the crisis began. Tag switching disqualifies the attempt."

