fm_mission_secure_relief_route: "Secure the Relief Route"
fm_mission_secure_relief_route_desc: "Keep an affected state connected to a usable railway, port, or land corridor until emergency deliveries can proceed."
fm_mission_secure_relief_route_success: "The relief route remained open through the emergency period."
fm_mission_secure_relief_route_failure: "The route failed before reliable deliveries could reach the affected population."
fm_mission_hold_humanitarian_corridor: "Keep the Humanitarian Corridor Open"
fm_mission_hold_humanitarian_corridor_desc: "Protect the route serving a trapped population until relief workers and civilian transports finish their work."
fm_mission_hold_humanitarian_corridor_success: "The corridor remained open for its full term."
fm_mission_hold_humanitarian_corridor_failure: "The corridor closed with civilians still trapped along the route."
fm_mission_prevent_reception_collapse: "Prevent Reception Collapse"
fm_mission_prevent_reception_collapse_desc: "Expand shelter and distribution before the receiving network is overwhelmed by arrivals."
fm_mission_prevent_reception_collapse_success: "Reception services absorbed the arriving population without collapsing."
fm_mission_prevent_reception_collapse_failure: "The receiving network remained overloaded when the emergency term ended."

fm_prepare_evacuation: "Prepare the Evacuation of [FROM.GetName]"
fm_prepare_evacuation_desc: "Reserve trains and fuel, identify safer destinations, and organize departure points before conditions in [FROM.GetName] worsen. Preparation reduces later congestion and route losses."
fm_open_departure_routes: "Open Civilian Departure Routes"
fm_open_departure_routes_desc: "Permit civilians to leave threatened districts and support their movement toward safer territory. This reduces trapped populations but places more pressure on transport and receiving states."
fm_restrict_departure: "Restrict Civilian Departure"
fm_restrict_departure_desc: "Use security forces to hold civilians and workers in place. Outward movement will slow, but people remaining in danger may become trapped."
fm_close_border: "Close the Border at [FROM.GetName]"
fm_close_border_desc: "Stop ordinary entry through [FROM.GetName]. New inflows will slow, while civilians denied passage may gather at the border or seek irregular routes."
fm_release_reserves: "Release Reserves to [FROM.GetName]"
fm_release_reserves_desc: "Redirect food stores and support equipment to rationing authorities in [FROM.GetName]. The measure lowers immediate food pressure at the cost of national reserves and transport fuel."
fm_emergency_imports: "Secure Emergency Food Imports for [FROM.GetName]"
fm_emergency_imports_desc: "Use an accessible foreign route to bring food into [FROM.GetName]. Imports ease shortages but consume convoys, fuel, and political leverage."
fm_repair_relief_route: "Repair the Relief Route to [FROM.GetName]"
fm_repair_relief_route_desc: "Commit trains and fuel to restore the railway, hub, or corridor serving [FROM.GetName]. A working route will reduce food pressure and improve later relief operations."
fm_escorted_relief_convoy: "Escort Relief to [FROM.GetName]"
fm_escorted_relief_convoy_desc: "Send a protected convoy through the proven blockade around [FROM.GetName]. Successful delivery sharply improves access, but the operation risks scarce shipping and fuel."
fm_emergency_airlift: "Airlift Relief into [FROM.GetName]"
fm_emergency_airlift_desc: "Commit five transport aircraft, fuel, and experienced air crews to limited emergency deliveries. The airlift can check a severe decline but cannot replace a secure surface route."
fm_invite_relief: "Invite International Relief to [FROM.GetName]"
fm_invite_relief_desc: "Grant foreign relief teams access to [FROM.GetName] and support their deliveries. Outside aid lowers food pressure, though observers may also see local conditions and government conduct."
fm_famine_evacuation: "Evacuate Civilians from [FROM.GetName]"
fm_famine_evacuation_desc: "Move a bounded civilian cohort from [FROM.GetName] to a proven safe destination. The origin loses population, the receiving state gains the surviving arrivals, and dangerous route losses remain separate."
fm_evacuate_vulnerable: "Evacuate Vulnerable Civilians from [FROM.GetName]"
fm_evacuate_vulnerable_desc: "Give children, elderly people, injured civilians, and others needing care priority on prepared transports from [FROM.GetName]. This saves those at greatest risk but moves fewer people per journey."
fm_evacuate_workers: "Evacuate Essential Workers from [FROM.GetName]"
fm_evacuate_workers_desc: "Move industrial and transport workers from [FROM.GetName] before local production collapses. Their skills can support recovery elsewhere, while fewer places remain for vulnerable civilians."
fm_requisition_safer_state: "Requisition Food for [FROM.GetName]"
fm_requisition_safer_state_desc: "Draw food from a safe neighboring state and send it to [FROM.GetName]. The target receives relief, but the donor state assumes new pressure and political grievance."
fm_conceal_crisis: "Conceal the Crisis in [FROM.GetName]"
fm_conceal_crisis_desc: "Suppress shortage and mortality reports from [FROM.GetName]. Public pressure and foreign scrutiny fall briefly, while hunger and the risk of later exposure increase."
fm_maintain_extraction: "Maintain Extraction from [FROM.GetName]"
fm_maintain_extraction_desc: "Keep military and national supply priorities ahead of civilian need in [FROM.GetName]. The state continues feeding the war effort as famine pressure, resistance, and responsibility rise."
fm_negotiate_corridor: "Negotiate a Corridor through [FROM.GetName]"
fm_negotiate_corridor_desc: "Seek safe passage for relief workers and trapped civilians in [FROM.GetName]. The arrangement requires a valid counterpart and route, and may carry diplomatic or military concessions."
fm_open_reception: "Open Emergency Reception"
fm_open_reception_desc: "Expand temporary shelter, food distribution, and local administration for new arrivals. Reception capacity rises, though the work consumes equipment, fuel, and political attention."
fm_controlled_medical_reception: "Establish Controlled Medical Reception"
fm_controlled_medical_reception_desc: "Admit exposed arrivals through screening, shelter, and medical support. This protects the host without treating displaced civilians as the source of disease."
fm_distribute_arrivals: "Distribute Arrivals among Safe States"
fm_distribute_arrivals_desc: "Move arrivals away from overloaded border districts and place them across safer receiving states. This relieves local crowding while spreading the national reception burden."
fm_transit_only: "Permit Humanitarian Transit"
fm_transit_only_desc: "Allow civilians to cross the country toward a confirmed safe destination. Transit limits long-term reception duties, but a failed onward route can leave the cohort stranded."
fm_enforce_closure: "Enforce the Border Closure"
fm_enforce_closure_desc: "Commit troops, equipment, and fuel to stop irregular crossings. Movement will fall, while violence, exposure, and foreign condemnation may follow."
fm_local_integration: "Begin Local Integration"
fm_local_integration_desc: "Provide housing, administration, and long-term legal settlement to a displaced cohort. Successful integration ends temporary reception status and makes the population part of the host country."
fm_third_country_resettlement: "Arrange Third-Country Resettlement from [FROM.GetName]"
fm_third_country_resettlement_desc: "Transfer a displaced cohort from [FROM.GetName] to a safe neighboring country with proven capacity. Only people removed from the origin and surviving the route can be received."
fm_voluntary_return: "Support Voluntary Return from [FROM.GetName]"
fm_voluntary_return_desc: "Provide transport for civilians who choose to return after food, housing, routes, and protection have been restored at their origin."
fm_forced_repatriation: "Force Repatriation from [FROM.GetName]"
fm_forced_repatriation_desc: "Compel a displaced cohort to leave [FROM.GetName]. The host sheds part of its reception load, but an unsafe origin or route can cause deaths, renewed flight, and condemnation."

famine_migration_decision_target_available_tt: "The selected state and route must remain valid when the action completes."
famine_migration_decision_effect_tt: "The action changes food pressure, displacement, reception, or border policy according to the selected state and current route."
famine_migration_decision_transfer_tt: "Population is debited from the origin once. Only surviving civilians arrive at the valid destination, and any route deaths are recorded separately."
famine_migration_airlift_planes_requirement_tt: "Requires and consumes §Y5 Transport Aircraft§!."

