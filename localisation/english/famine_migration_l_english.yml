famine_migration_condemnation_deliberate_starvation: "Deliberate Starvation"
famine_migration_condemnation_deliberate_starvation_desc: "Food was extracted or withheld while civilians faced a proven hunger crisis."
famine_migration_condemnation_relief_obstruction: "Obstruction of Civilian Relief"
famine_migration_condemnation_relief_obstruction_desc: "Verified food, medical aid, or evacuation access was blocked despite a viable relief route."
famine_migration_condemnation_deportation: "Forced Deportation"
famine_migration_condemnation_deportation_desc: "A civilian population was moved through coercion under the authority of the responsible government."
famine_migration_condemnation_forced_return: "Forced Return to Danger"
famine_migration_condemnation_forced_return_desc: "Displaced civilians were returned to a proven famine, persecution, camp, contamination, or active-combat threat."
famine_migration_condemnation_violent_pushback: "Violent Border Pushback"
famine_migration_condemnation_violent_pushback_desc: "Border enforcement used violence against civilians seeking passage or protection."
famine_migration_condemnation_concealment: "Concealment of Civilian Harm"
famine_migration_condemnation_concealment_desc: "Mortality reports, relief records, or evidence of forced movement were suppressed or destroyed."
