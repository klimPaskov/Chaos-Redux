famine_migration_state_supply_strain: "Supply Strain"
famine_migration_state_supply_strain_desc: "Food still reaches this state, but damaged production or distribution is narrowing the margin of safety. Restored routes and early relief can prevent an acute shortage."
famine_migration_state_acute_shortage: "Acute Shortage"
famine_migration_state_acute_shortage_desc: "Food access is failing across this state. Production, transport, extraction, environmental damage, or weak administration may push it into famine unless relief arrives."
famine_migration_state_famine: "Famine"
famine_migration_state_famine_desc: "Sustained hunger is causing recurring civilian deaths, population flight, and production loss. Mortality continues until food pressure falls and recovery persists."
famine_migration_state_catastrophic_famine: "Catastrophic Famine"
famine_migration_state_catastrophic_famine_desc: "Food access has collapsed. Civilian mortality, depopulation, and political opposition will remain severe until major relief or evacuation restores a viable route."
famine_migration_state_exodus: "Civilian Exodus"
famine_migration_state_exodus_desc: "Civilians are leaving unsafe districts and local labor is disappearing. Safe routes reduce losses, while blocked movement creates trapped populations."
famine_migration_state_reception: "Displaced Population Reception"
famine_migration_state_reception_desc: "This state is sheltering displaced civilians. Food, housing, transport, sanitation, and administration determine whether reception remains manageable."
famine_migration_state_overcrowded: "Overcrowded Reception"
famine_migration_state_overcrowded_desc: "Arrivals have exceeded local reception capacity. Distribution, outside aid, integration, or resettlement is needed before food and medical services fail."
famine_migration_state_trapped_border: "Trapped at the Border"
famine_migration_state_trapped_border_desc: "A civilian cohort has reached a closed or failed route and cannot proceed. Hunger, exposure, irregular crossings, and violent enforcement can cause further deaths."
famine_migration_state_return: "Return and Resettlement"
famine_migration_state_return_desc: "Residents are returning or settling after displacement. Safe housing, food, transport, and protection must hold while communities and production recover."

