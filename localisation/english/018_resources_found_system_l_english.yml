DHO_communism_party_long: "The Common Feeding Vault of the Host"
resonant_brood_hierarchy: "Resonant Brood Hierarchy"
resonant_brood_hierarchy_desc: "A nonhuman command order in which mineral-armored broods coordinate through chamber resonance, feeding anchors, and the authority of the first cave sovereign."
DHO_vhorruk_name: "Vhorruk"
DHO_thessik_name: "Thessik"
DHO_orrukesh_name: "Orrukesh"
DHO_khalvek_name: "Khalvek"
DHO_vhorruk_desc: "Vhorruk is a literal cave monster: a many-limbed, mineral-armored sovereign whose resonant calls coordinate the Oth-Kesh Host. Human observers have found no mask, costume, or human office behind the creature."
cave_first_resonance: "First Resonance"
cave_first_resonance_desc: "Vhorruk coordinates the first war-broods through resonant signals carried by rock and chamber."
cave_one_maw_sovereign: "Sovereign of One Maw"
cave_one_maw_sovereign_desc: "Every campaign answers the same centralized resonance."
cave_many_chambers_memory: "Memory of Many Chambers"
cave_many_chambers_memory_desc: "Command survives through distributed chambers and local brood memory."
cave_vein_hoarder: "Hoarder of the Veins"
cave_vein_hoarder_desc: "Resource anchors govern strategy, defense, and the preservation of every brood."
cave_stone_phalanx_commander: "Stone Phalanx Resonator"
cave_stone_phalanx_commander_desc: "Specialist in slow, interlocking mineral formations."
cave_burrow_war_commander: "Burrow-War Listener"
cave_burrow_war_commander_desc: "Specialist in underground approaches and attacks on transport."
cave_scree_tide_commander: "Scree-Tide Caller"
cave_scree_tide_commander_desc: "Specialist in light, rapid broods that exploit broken fronts."
cave_monster_brood: "Oth-Kesh War-Brood"
cave_monster_brood_desc: "Equipment-free, zero-manpower cave bodies with extreme hardness and armor, very low speed, and severe exposure to piercing and concentrated hard attack."
cave_stone_phalanx_brood: "Stone Phalanx Brood"
cave_stone_phalanx_brood_desc: "A nearly immobile mineral wall designed to survive ordinary infantry weapons and grind through prepared positions."
cave_burrow_war_brood: "Burrow Column"
cave_burrow_war_brood_desc: "A tunnel-adapted brood for urban ground, mountains, and attacks beneath transport corridors."
cave_scree_tide_brood: "Scree Pack"
cave_scree_tide_brood_desc: "A lighter, faster Oth-Kesh formation that sacrifices armor and defense for exploitation speed."
cave_anchor_guard_brood: "Feeding Guard"
cave_anchor_guard_brood_desc: "A slow defensive brood bred to hold active resource anchors."
resources_found_field_management_category: "Selected Resource Field"
resources_found_field_management_category_desc: "Manage the selected discovery field through a five-page workboard or review the most recent exact seal. Administration, development, infrastructure, safety, and operations remain grouped around the field lifecycle. A closed history record remains read-only."
resources_found_trade_and_security_category: "Field Contracts and Foreign Pressure"
resources_found_trade_and_security_category_desc: "Manage buyers, concessions, survey teams, smuggling, claims, commissions, and border pressure around the selected field."
resources_found_containment_category: "Subsurface Containment"
resources_found_containment_category_desc: "Investigate disturbances, protect workers and routes, evacuate threatened populations, and close dangerous access networks."
resources_found_cave_brood_network_category: "Oth-Kesh Brood Network"
resources_found_cave_brood_network_category_desc: "Direct resource anchors, automatic brood capacity, doctrine actions, and the campaign to consume the origin continent."
resources_found_anti_cave_response_category: "Anti-Cave Emergency Command"
resources_found_anti_cave_response_category_desc: "Prepare hard attack, deny threatened resources, recapture activating anchors, clear mature chambers, and coordinate aid against the Oth-Kesh Host."
resources_found.gui.title: "RESOURCE FIELD RECORD"
resources_found.gui.selected_state: "Field: §Y[?resources_found_selected_field.GetName]§!\nActive field §Y[?resources_found_gui_selected_display_index|0]/[?resources_found_gui_fields^num|0]§!"
resources_found.gui.selected_state.tt: "This is the persistent state record selected for field administration. The arrow controls cycle through active discovery fields administered by this country. A permanently sealed field can only be viewed through history."
resources_found.gui.closed_state: "Sealed: §Y[?resources_found_last_closed_field.GetName]§!\nExact seal history"
resources_found.gui.closed_state.tt: "This is the most recent exact-seal history record. It cannot receive another discovery or be chosen for field projects."
resources_found.gui.identity: "Owner §Y[?resources_found_recorded_owner.GetName]§!  Control §Y[?resources_found_recorded_controller.GetName]§!  Finds §Y[?resources_found_discovery_count|0]§!"
resources_found.gui.resources: "Discovery ledger: Oil §Y[?resources_found_selected_field.resources_found_added_oil|0]§!  Aluminium §Y[?resources_found_selected_field.resources_found_added_aluminium|0]§!  Rubber §Y[?resources_found_selected_field.resources_found_added_rubber|0]§!\nTungsten §Y[?resources_found_selected_field.resources_found_added_tungsten|0]§!  Steel §Y[?resources_found_selected_field.resources_found_added_steel|0]§!  Chromium §Y[?resources_found_selected_field.resources_found_added_chromium|0]§!\nAdded total §Y[?resources_found_selected_field.resources_found_total_added|0]§!  State total §Y[?resources_found_selected_field.resources_found_current_state_resource_total|0]§!"
resources_found.gui.resource_summary: "Added §Y[?resources_found_selected_field.resources_found_total_added|0]§!   Total §Y[?resources_found_selected_field.resources_found_current_state_resource_total|0]§!"
resources_found.gui.resources.tt: "Recorded discoveries: Oil §Y[?resources_found_selected_field.resources_found_added_oil|0]§!  Aluminium §Y[?resources_found_selected_field.resources_found_added_aluminium|0]§!  Rubber §Y[?resources_found_selected_field.resources_found_added_rubber|0]§!\nTungsten §Y[?resources_found_selected_field.resources_found_added_tungsten|0]§!  Steel §Y[?resources_found_selected_field.resources_found_added_steel|0]§!  Chromium §Y[?resources_found_selected_field.resources_found_added_chromium|0]§!\nAdded total §Y[?resources_found_selected_field.resources_found_total_added|0]§!  State total §Y[?resources_found_selected_field.resources_found_current_state_resource_total|0]§!\n\nThe discovery ledger records only deposits created by these finds. State total includes every strategic resource source in the state. Final closure subtracts the six registered amounts and leaves other resources untouched."
resources_found.gui.values: "Developed Yield §Y[?resources_found_selected_field.resources_found_developed_yield|0]§! [GetResourcesFoundSelectedYieldBand]\nExcavation Depth §Y[?resources_found_selected_field.resources_found_excavation_depth|0]§! [GetResourcesFoundSelectedDepthBand]\nWorkforce Safety §Y[?resources_found_selected_field.resources_found_workforce_safety|0]§! [GetResourcesFoundSelectedSafetyBand]\nForeign Pressure §Y[?resources_found_selected_field.resources_found_foreign_pressure|0]§! [GetResourcesFoundSelectedPressureBand]"
resources_found.gui.values.tt: "Developed Yield rises through machinery, processing, and works. Higher yield improves output and raises exploitation history.\nExcavation Depth rises through surveys and deep works. Greater depth increases project cost, project time, and later incident risk.\nWorkforce Safety rises through training, settlement, evacuation, and engineering. High safety reduces accidents, deaths, and failed containment.\nForeign Pressure responds to field value, contracts, claims, smuggling, and strategic demand. High pressure unlocks stronger foreign action and border danger."
resources_found.gui.disturbance: "Subsurface Disturbance §R[?resources_found_selected_field.resources_found_subsurface_disturbance|0]§! [GetResourcesFoundSelectedDisturbanceBand]"
resources_found.gui.disturbance.tt: "Subsurface Disturbance records physical instability, sickness patterns, corrosion, disappearances, and underground attacks after evidence reveals the danger. Safety work, restricted workings, investigation, and closure reduce its growth."
resources_found.gui.breach: "Breach Pressure §R[?resources_found_selected_field.resources_found_breach_pressure|0]§! [GetResourcesFoundSelectedBreachBand]"
resources_found.gui.breach.tt: "Breach Pressure measures the visible risk of attacks reaching the surface. Extraction, failed hunts, concealment, and open workings raise it. Evacuation, supplied hard-attack forces, partial sealing, and full closure lower or end it."
resources_found.gui.status: "[?resources_found_selected_field.GetResourcesFoundFieldPosture] · [?resources_found_selected_field.GetResourcesFoundFieldStage]\n[?resources_found_selected_field.GetResourcesFoundFieldLifecycleStatus]\nC:[?resources_found_selected_field.GetResourcesFoundFieldContractStatus] M:[?resources_found_selected_field.GetResourcesFoundFieldCommissionStatus]"
resources_found.gui.closed_status: "[?resources_found_last_closed_field.GetResourcesFoundFieldPosture] · [?resources_found_last_closed_field.GetResourcesFoundFieldStage]\n[?resources_found_last_closed_field.GetResourcesFoundFieldLifecycleStatus]\nC:[?resources_found_last_closed_field.GetResourcesFoundFieldContractStatus] M:[?resources_found_last_closed_field.GetResourcesFoundFieldCommissionStatus]"
resources_found.gui.status.tt: "The first line shows operating authority and development stage. The second shows whether the site is operating, restricted, suspended, sealing, breached, or closed. C shows the contract and M shows the demilitarized commission."
resources_found.gui.closed_resources: "Reversed ledger: Oil §Y[?resources_found_last_closed_field.resources_found_sealed_oil|0]§!  Aluminium §Y[?resources_found_last_closed_field.resources_found_sealed_aluminium|0]§!  Rubber §Y[?resources_found_last_closed_field.resources_found_sealed_rubber|0]§!\nTungsten §Y[?resources_found_last_closed_field.resources_found_sealed_tungsten|0]§!  Steel §Y[?resources_found_last_closed_field.resources_found_sealed_steel|0]§!  Chromium §Y[?resources_found_last_closed_field.resources_found_sealed_chromium|0]§!\nRemoved total §Y[?resources_found_last_closed_field.resources_found_sealed_total|0]§!  Post-seal total §Y[?resources_found_last_closed_field.resources_found_current_state_resource_total|0]§!"
resources_found.gui.closed_resource_summary: "Removed §Y[?resources_found_last_closed_field.resources_found_sealed_total|0]§!   Total §Y[?resources_found_last_closed_field.resources_found_current_state_resource_total|0]§!"
resources_found.gui.closed_resources.tt: "Removed by the exact seal: Oil §Y[?resources_found_last_closed_field.resources_found_sealed_oil|0]§!  Aluminium §Y[?resources_found_last_closed_field.resources_found_sealed_aluminium|0]§!  Rubber §Y[?resources_found_last_closed_field.resources_found_sealed_rubber|0]§!\nTungsten §Y[?resources_found_last_closed_field.resources_found_sealed_tungsten|0]§!  Steel §Y[?resources_found_last_closed_field.resources_found_sealed_steel|0]§!  Chromium §Y[?resources_found_last_closed_field.resources_found_sealed_chromium|0]§!\nRemoved total §Y[?resources_found_last_closed_field.resources_found_sealed_total|0]§!  Post-seal total §Y[?resources_found_last_closed_field.resources_found_current_state_resource_total|0]§!\n\nThe post-seal total records the state's resources when closure finished. It excludes those additions and retains every unrelated source present at that time."
resources_found.gui.closed_values: "Developed Yield §Y[?resources_found_last_closed_field.resources_found_developed_yield|0]§! [?resources_found_last_closed_field.GetResourcesFoundFieldYieldBand]\nExcavation Depth §Y[?resources_found_last_closed_field.resources_found_excavation_depth|0]§! [?resources_found_last_closed_field.GetResourcesFoundFieldDepthBand]\nWorkforce Safety §Y[?resources_found_last_closed_field.resources_found_workforce_safety|0]§! [?resources_found_last_closed_field.GetResourcesFoundFieldSafetyBand]\nForeign Pressure §Y[?resources_found_last_closed_field.resources_found_foreign_pressure|0]§! [?resources_found_last_closed_field.GetResourcesFoundFieldPressureBand]"
resources_found.gui.closed_disturbance: "Subsurface Disturbance §R[?resources_found_last_closed_field.resources_found_subsurface_disturbance|0]§! [?resources_found_last_closed_field.GetResourcesFoundFieldDisturbanceBand]"
