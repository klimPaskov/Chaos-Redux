resources_found.evolution.type: "The Deepening Field"
resources_found.evolution.stage_1.title: "Veins Without End"
resources_found.evolution.stage_1.body: "One field keeps giving. New deposits appear beneath old workings, and foreign buyers, rival claimants, and would-be peacekeepers all want a share of the wealth."
resources_found.evolution.stage_2.title: "The Workings Turn Sick"
resources_found.evolution.stage_2.body: "Miners fall sick, metal corrodes overnight, people vanish, and something attacks in the lower workings. The country must investigate, contain the danger, or close the field before the boomtown becomes a grave."
resources_found.evolution.stage_3.title: "The Breach Takes Shape"
resources_found.evolution.stage_3.body: "A huge mixed deposit pulls the workings far below safe ground. Attacks reach the surface, and the country must hunt what escaped, evacuate the field, or seal away every valuable shaft before the breach fully opens."
resources_found.evolution.stage_4.title: "The Oth-Kesh Emerge"
resources_found.evolution.stage_4.body: "The field opens into an Oth-Kesh origin chamber. Armored broods pour through the workings, feed on rich deposits, and attack every country they can reach as they search for roads beneath the next continent."
resources_found.evolution.summary: "A lucky strike can become a mineral rush, a poisoned mine, a breach into the depths, or the birthplace of a new underground power."
resources_found.evolution.unrecorded_1.title: "Unrecorded Development I"
resources_found.evolution.unrecorded_2.title: "Unrecorded Development II"
resources_found.evolution.unrecorded_3.title: "Unrecorded Development III"
resources_found.evolution.unrecorded_4.title: "Unrecorded Development IV"
resources_found.evolution.unrecorded.body: "No public milestone has established what this development means for the field."
resources_found.evolution.unrecorded.summary: "The field record contains no public account of this development."

# Event 018 news reports
chaosx.news.84.t: "An Impossible Field Draws the World"
chaosx.news.84.d: "A single extraction district has become a forest of derricks, headframes, rail yards, and foreign offices. Governments that once ignored the discovery are sending engineers, buyers, and security delegations to contest access to the compound field."
chaosx.news.84.a: "The rush has begun."
chaosx.news.85.t: "Survey Stakes Become a Frontier Crisis"
chaosx.news.85.d: "Competing survey parties have raised guarded posts around a disputed resource field. Roads are blocked, patrols face one another across temporary markers, and diplomats warn that a commercial claim may become a military frontier."
chaosx.news.85.a: "The line hardens."
chaosx.news.86.t: "Armored Creatures Break the Surface"
chaosx.news.86.d: "Reports from an industrial settlement describe mineral-armored creatures entering through collapsed workings and broken streets. Civilians are being evacuated while soldiers and engineers establish a perimeter around the field."
chaosx.news.86.a: "The workings were not empty."
chaosx.news.87.t: "A Country Marches From Below"
chaosx.news.87.d: "Organized ranks have emerged from the ruined resource field beneath a coherent command. The beings call themselves the Oth-Kesh Host, hold the breach as sovereign ground, and have attacked every land power bordering their new territory."
chaosx.news.87.a: "The map has gained another country."
chaosx.news.88.t: "The Regional Host Is Broken"
chaosx.news.88.d: "The last regional Oth-Kesh stronghold has fallen. Soldiers and engineers are sealing captured chambers, clearing mineral growth, and dismantling the resource anchors that sustained the cave armies."
chaosx.news.88.a: "The final shafts must still be closed."
chaosx.news.89.t: "The World Below Is Defeated"
chaosx.news.89.d: "The last distant footholds of the Oth-Kesh Host have been destroyed after a war fought across several continents. Multinational engineering teams are sealing the surviving tunnel networks and rebuilding the industrial districts above them."
chaosx.news.89.a: "The ground is quiet again."
