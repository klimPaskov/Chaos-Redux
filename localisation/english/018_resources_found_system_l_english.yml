chaosx_super_event.82.t: "THE OTH-KESH HOST RISES"
chaosx_super_event.82.d: "The extraction zone has collapsed into a passage wider than its deepest surveys recorded. Mineral-armored formations advance through the ruins in ordered columns, with the cave monster Vhorruk directing them toward the border roads. The fallen field has become the capital of the Oth-Kesh Host, and its war broods are already attacking every country along its borders."
chaosx_super_event.82.q: "“As for the earth, out of it comes bread. Underneath it is turned up as it were by fire.”\n§YJob 28:5, World English Bible§!"
chaosx_super_event.82.a: "The field has a sovereign."
chaosx_super_event.83.t: "THE DEEP WAR CROSSES THE SEAS"
chaosx_super_event.83.d: "The Oth-Kesh Host has converted its first continent into a connected domain of chambers, resource basins, and marching routes. Across distant continents, mines, refineries, and industrial districts split open under stronger formations shaped by the first war. Vhorruk’s armies are emerging on several shores at once, and the ground beneath the remaining countries has become a front."
chaosx_super_event.83.q: "“the firmament is embroiled with the deep.”\n§YAeschylus, Prometheus Bound, trans. Theodore Alois Buckley§!"
chaosx_super_event.83.a: "Every deep has found a road."
chaosx_super_event.84.t: "THE LAST DEPTH IS SEALED"
chaosx_super_event.84.d: "The last territory held by the Oth-Kesh Host has been retaken, and every known foothold has been broken or sealed. Survivors return to damaged resource regions beside engineers, burial teams, and soldiers carrying weapons built for the underground war. Reconstruction begins under shared survey rules and the knowledge that the earth beneath an industrial frontier can no longer be treated as empty."
chaosx_super_event.84.q: "“In peace sons bury their fathers, in war fathers bury their sons.”\n§YCroesus in Herodotus, Histories 1.87, trans. A. D. Godley§!"
chaosx_super_event.84.a: "The living will rebuild above it."
cave_mineral_carapaces: "Mineral Carapaces"
cave_mineral_carapaces_desc: "Oth-Kesh bodies are living mineral armor. Ordinary soft attack is inefficient. Piercing and concentrated hard attack are required."
cave_slow_blood: "Slow Blood"
cave_slow_blood_desc: "The Host moves with geological weight. Its formations are powerful but slow to maneuver and recover."
cave_resource_born_broods: "Resource-Born Broods"
cave_resource_born_broods_desc: "Broods use no ordinary manpower or equipment. They appear only through protected origin allocation and active resource-anchor capacity."
cave_surface_starvation: "Surface Starvation"
cave_surface_starvation_desc: "Away from connected feeding chambers, cave formations consume more supply and recover poorly."
cave_untranslatable_command: "Untranslatable Command"
cave_untranslatable_command_desc: "The Host cannot participate in ordinary trade, alliances, recruitment, or industrial production. Its war economy exists entirely through captured resource anchors."
cave_one_maw_command: "One Maw Command"
cave_one_maw_command_desc: "Central resonance grants 15% maximum planning, 12% planning speed, and 8% army organization, while increasing supply consumption by 5%."
cave_many_chambers_command: "Many Chambers Command"
cave_many_chambers_command_desc: "Distributed chambers grant 18% organization recovery and reduce supply consumption by 12%, while reducing planning speed by 5%."
cave_hoard_the_veins_command: "Hoard the Veins"
cave_hoard_the_veins_command_desc: "Resource anchors become the Host's political order. Broods gain 15% defense and 12% morale while moving 8% more slowly."
cave_stone_phalanx_doctrine: "Stone Phalanx Doctrine"
cave_stone_phalanx_doctrine_desc: "The Stone Phalanx grants 12% army attack, 15% planning speed, and 10% defense while reducing movement speed by 10%."
cave_burrow_war_doctrine: "Burrow War Doctrine"
cave_burrow_war_doctrine_desc: "Burrow War grants 8% army attack and 15% planning speed, reduces supply consumption by 15%, and reduces defense by 5%."
cave_scree_tide_doctrine: "Scree Tide Doctrine"
cave_scree_tide_doctrine_desc: "The Scree Tide grants 25% movement speed and 10% planning speed while reducing organization and defense by 5%."
cave_interlocking_carapaces_adaptation: "Interlocking Carapaces"
cave_interlocking_carapaces_adaptation_desc: "The cumulative Stone doctrine grants 12% army attack, 15% planning speed, 8% organization, and 22% defense while reducing movement speed by 18% and increasing supply consumption by 8%."
cave_great_gun_resistance: "Great-Gun Resistance"
cave_great_gun_resistance_desc: "The cumulative Stone doctrine grants 16% army attack, 15% planning speed, 14% organization, and 32% defense while reducing movement speed by 23% and increasing supply consumption by 8%."
cave_urban_cellar_networks_adaptation: "Urban Cellar Networks"
cave_urban_cellar_networks_adaptation_desc: "The cumulative Burrow doctrine grants 13% army attack and 25% planning speed, reduces supply consumption by 23%, and reduces defense by 8%."
cave_split_broods_adaptation: "Split Great Broods"
cave_split_broods_adaptation_desc: "The cumulative Scree doctrine grants 33% movement speed and 10% planning speed while reducing organization by 9% and defense by 10%, and increasing supply consumption by 5%."
cave_lighter_plates_adaptation: "Lighter Plates"
cave_lighter_plates_adaptation_desc: "The cumulative Scree doctrine grants 45% movement speed, 10% planning speed, and 8% organization recovery while reducing organization by 9% and defense by 18%, and increasing supply consumption by 5%."
resources_found_burrow_infiltration: "Cellars Beneath the Lines"
resources_found_burrow_infiltration_desc: "Oth-Kesh chambers run beneath transport, storage, and foundations. Resources, supplies, organization, and construction are disrupted until the network collapses."
cave_dense_plate_adaptation: "Dense Plate Adaptation"
cave_dense_plate_adaptation_desc: "Dense plates grant 10% organization and 8% defense while reducing movement speed by 12%."
cave_open_joint_adaptation: "Open Joint Adaptation"
cave_open_joint_adaptation_desc: "Open joints grant 18% movement speed and 10% organization recovery while reducing defense by 8%."
cave_dense_surface_senses_adaptation: "Dense Plates with Surface Senses"
cave_dense_surface_senses_adaptation_desc: "The cumulative dense adaptation grants 10% organization, 8% defense, 12% planning speed, 10% maximum planning, and 15% reconnaissance while reducing movement speed by 12%."
cave_open_surface_senses_adaptation: "Open Joints with Surface Senses"
cave_open_surface_senses_adaptation_desc: "The cumulative open-joint adaptation grants 18% movement speed, 10% organization recovery, 12% planning speed, 10% maximum planning, and 15% reconnaissance while reducing defense by 8%."
cave_dense_sky_hardened_adaptation: "Dense Sky-Hardened Plates"
cave_dense_sky_hardened_adaptation_desc: "The final dense adaptation grants 10% organization, 16% defense, 12% planning speed, 10% maximum planning, and 15% reconnaissance while reducing movement speed by 12% and the hostile air-superiority combat advantage by 20%."
cave_open_sky_hardened_adaptation: "Open-Joint Sky-Hardened Plates"
cave_open_sky_hardened_adaptation_desc: "The final open-joint adaptation grants 18% movement speed, 10% organization recovery, 12% planning speed, 10% maximum planning, and 15% reconnaissance. Sky-hardening offsets its earlier defense penalty and reduces the hostile air-superiority combat advantage by 20%."
cave_unfed_broods: "Unfed Broods"
cave_unfed_broods_desc: "The Host has more active formations than its protected allocation and mature anchors can sustain."
cave_origin_command_crisis: "Origin Command Crisis"
cave_origin_command_crisis_desc: "The first chamber has been lost before a redundant command network could replace it."
cave_world_below_network: "The World Below Network"
cave_world_below_network_desc: "Continental depth and distant footholds now sustain a transformed global Host."
resources_found_anti_cave_contracts: "Emergency Anti-Cave Contracts"
resources_found_anti_cave_contracts_desc: "Factories and army laboratories prioritize weapons capable of piercing mineral armor."
resources_found_threat_cooperation: "Threat Cooperation"
resources_found_threat_cooperation_desc: "Governments fighting the Host share hard-attack intelligence, surveys, and operational planning."
resources_found_field_dormant: "Dormant Resource Field"
resources_found_field_dormant_desc: "Extraction is suspended while maintenance and monitoring continue."
resources_found_field_surveyed: "Surveyed Resource Field"
resources_found_field_surveyed_desc: "Confirmed reserves and mapped workings support deliberate development."
resources_found_field_operating: "Operating Resource Field"
resources_found_field_operating_desc: "The field is producing under its current posture and safety rules."
resources_found_field_industrial: "Industrial Resource Complex"
resources_found_field_industrial_desc: "Processing, transport, and settlement works have made this field a major industrial center."
resources_found_field_maximum_extraction: "Maximum Extraction"
resources_found_field_maximum_extraction_desc: "Deep shifts and heavy machinery deliver exceptional output at severe safety and disturbance risk."
resources_found_field_suspended: "Suspended Workings"
resources_found_field_suspended_desc: "Production is halted while depth, pressure, and underground danger slowly recede."
resources_found_compound_corridor: "Integrated Compound Corridor"
resources_found_compound_corridor_desc: "Several strategic resources share one high-capacity processing and export network."
resources_found_demilitarized_commission: "Demilitarized Resource Commission"
resources_found_demilitarized_commission_desc: "International access and inspection reduce seizure risk while restricting fortification and troop concentration."
resources_found_public_breach: "Public Subsurface Breach"
resources_found_public_breach_desc: "Attacks from below have become a public military emergency."
resources_found_cave_origin_chamber: "Oth-Kesh Origin Chamber"
resources_found_cave_origin_chamber_desc: "The Host's capital and protected first allocation lie beneath this state. The origin never grants future captured-state capacity."
resources_found_cave_anchor_activating: "Anchor Activation Underway"
resources_found_cave_anchor_activating_desc: "Continuous cave control is connecting this resource state to the brood network. Recapture before the window closes prevents capacity."
resources_found_cave_anchor_active: "Active Resource Anchor"
resources_found_cave_anchor_active_desc: "This non-origin state supplies capacity equal to floor(total strategic resources / 10), up to a maximum of 10."
resources_found_cave_anchor_fortified: "Fortified Feeding Chamber"
resources_found_cave_anchor_fortified_desc: "Guard galleries and reserves protect a mature Oth-Kesh anchor."
resources_found_denied_resource_state: "Denied Resource State"
resources_found_denied_resource_state_desc: "Demolition and evacuation slow cave anchor activation and damage local output."
resources_found_anchor_cleanup: "Anchor Cleanup"
resources_found_anchor_cleanup_desc: "Engineers and security forces are clearing residual chambers after liberation."
resources_found_sealed_field_scar: "Sealed Field Scar"
resources_found_sealed_field_scar_desc: "Every registered discovery deposit has been removed and the access network permanently sealed."
resources_found_export_contract: "Long-Term Resource Contract"
resources_found_concession_partner: "Field Concession Partner"
resources_found_competing_buyer: "Competing Resource Buyer"
resources_found_field_claim: "Claim on the Resource Field"
resources_found_smuggling_accusation: "Accused of Field Smuggling"
resources_found_sabotage_exposed: "Field Sabotage Exposed"
resources_found_nationalization_dispute: "Nationalization Dispute"
resources_found_compensation_settled: "Field Compensation Settled"
resources_found_commission_partner: "Resource Commission Partner"
resources_found_commission_violation: "Resource Commission Violation"
resources_found_emergency_aid: "Emergency Anti-Cave Aid"
resources_found_threat_cooperation_opinion: "Cooperation Against the Oth-Kesh"
018_resources_found_cave_focus_tree: "The Oth-Kesh Host"
DHO_the_first_breach: "The First Breach"
DHO_the_first_breach_desc: "The Host enters the surface world through the shattered extraction field. The first task is to turn a violent emergence into a functioning command network before the surrounding states can close the opening."
DHO_the_first_breach_tt: "Secures the origin, measures the Host's protected opening strength, and charts reachable resource states."
DHO_secure_the_origin_chamber: "Secure the Origin Chamber"
DHO_secure_the_origin_chamber_desc: "The chamber from which the Host emerged is both capital and irreplaceable memory. Its passages must be held even though the origin can never feed future brood capacity."
DHO_secure_the_origin_chamber_tt: "Fortifies the origin state and protects its fixed opening allocation. The origin remains worth §Y0§! future capacity."
DHO_organize_the_first_war_broods: "Organize the First War-Broods"
DHO_organize_the_first_war_broods_desc: "War-broods raised in separate galleries must learn to move under one campaign rhythm. Vhorruk will appoint commanders suited to stone, tunnels, and rapid surface pursuit."
DHO_organize_the_first_war_broods_tt: "Recruits Thessik, Orrukesh, and Khalvek to command the existing protected brood templates."
DHO_read_the_surface_veins: "Read the Surface Veins"
DHO_read_the_surface_veins_desc: "Roads, rails, mines, and refineries are veins written across the surface. Learning to read them will guide the Host toward ground that can sustain another brood generation."
DHO_read_the_surface_veins_tt: "Marks the richest reachable resource state and updates offensive priorities."
DHO_one_maw: "One Maw"
DHO_one_maw_desc: "Every chamber will answer one resonance. Central command promises disciplined advances and a single appetite, at the cost of making the origin the mind of the Host."
DHO_one_maw_tt: "Adopts §YOne Maw§!: 15% maximum planning, 12% planning speed, and 8% organization, with 5% greater supply consumption. This hierarchy excludes every other command structure."
DHO_central_resonance: "Central Resonance"
DHO_central_resonance_desc: "Signals carried through the origin chamber can coordinate distant broods with exact timing. The network will trade redundancy for speed and concentration."
DHO_central_resonance_tt: "Improves centralized command and recalculates active capacity."
DHO_count_every_vein: "Count Every Vein"
DHO_count_every_vein_desc: "The origin will account for every mature chamber, every protected allocation, and every empty place in the brood order. No viable capacity will be lost between one replacement cycle and the next."
DHO_count_every_vein_tt: "Recalculates exact anchor capacity and shortens the automatic replacement cooldown by §Y5 days§!, never below §Y15 days§!. The capacity rule remains §Yfloor(total resources / 10)§!, capped at §Y10§! per non-origin state."
DHO_directed_war_broods: "Directed War-Broods"
DHO_directed_war_broods_desc: "Individual formations will no longer pursue whatever vibration is nearest. Vhorruk's chosen fronts will receive deliberate concentrations and guarded reserves."
DHO_directed_war_broods_tt: "Concentrates brood commands on selected resource and strongpoint objectives."
DHO_origin_above_all: "Origin Above All"
DHO_origin_above_all_desc: "All roads below will bend back toward the first chamber. Defensive galleries and command refuges will make the capital exceptionally difficult to sever."
DHO_origin_above_all_tt: "Adds stronger fortification and command protection to the origin without granting resource capacity."
DHO_the_singular_hunger: "The Singular Hunger"
DHO_the_singular_hunger_desc: "A single ordered hunger can choose one decisive vein at a time. The Host will gather its strength against the richest reachable route instead of scattering across every frontier."
DHO_the_singular_hunger_tt: "Continuously prioritizes the richest reachable state for the centralized Host."
DHO_many_chambers: "Many Chambers"
DHO_many_chambers_desc: "No single collapse should silence the Host. Each mature feeding chamber will preserve local memory, local command, and enough resonance to continue the war."
DHO_many_chambers_tt: "Adopts §YMany Chambers§!: 18% organization recovery and 12% lower supply consumption, with 5% lower planning speed. This hierarchy excludes every other command structure."
DHO_local_brood_memory: "Local Brood Memory"
DHO_local_brood_memory_desc: "Broods will learn the passages and feeding rhythms of their own chambers. A lost connection will no longer erase every local pattern at once."
DHO_local_brood_memory_tt: "Extends anchor-loss grace and shortens the automatic brood replacement interval."
DHO_chamber_autonomy: "Chamber Autonomy"
DHO_chamber_autonomy_desc: "Each mature chamber will hold its own queue, read its own frontier, and begin connecting captured depths without waiting for every signal to return to the origin."
DHO_chamber_autonomy_tt: "Non-origin anchors activate §Y10 days§! faster, and automatic replacements prefer active frontier chambers. Anchor-loss grace is extended by §Y10 days§!."
DHO_distributed_command: "Distributed Command"
DHO_distributed_command_desc: "Campaign orders will be divided among active chambers. The Host will react faster to separated fronts, though no single thrust will carry the full weight of Vhorruk's will."
DHO_distributed_command_tt: "Distributes front commands among multiple independent anchor regions."
DHO_a_second_deep_capital: "A Second Deep Capital"
DHO_a_second_deep_capital_desc: "A mature non-origin anchor can preserve the command resonance if the first chamber is cut off. The chosen site must already be secure and productive."
DHO_a_second_deep_capital_tt: "Designates a mature non-origin anchor as the secondary command capital."
DHO_the_host_without_a_head: "The Host Without a Head"
DHO_the_host_without_a_head_desc: "The Oth-Kesh will remain coherent even if one chamber is destroyed. Authority will pass through the network instead of dying with a single sovereign node."
DHO_the_host_without_a_head_tt: "Removes the worst command-collapse effects when the origin is lost while other mature anchors survive."
DHO_hoard_the_veins: "Hoard the Veins"
DHO_hoard_the_veins_desc: "The Host exists to possess the productive depths. Command will follow mineral abundance, feeding chambers will govern war, and barren ground will matter only as a road."
DHO_hoard_the_veins_tt: "Adopts §YHoard the Veins§!: 15% defense and 12% morale, with 8% lower movement speed. This hierarchy excludes every other command structure and reinforces active anchors."
DHO_mineral_tithe: "Mineral Tithe"
DHO_mineral_tithe_desc: "Every active chamber will yield a measured share to the war-broods. Richer captured states will sustain stronger local recovery and defense."
DHO_mineral_tithe_tt: "Refreshes every mature anchor's benefits and shortens the automatic-spawn interval by 5 days, never below 15 days."
DHO_guard_the_feeding_chambers: "Guard the Feeding Chambers"
DHO_guard_the_feeding_chambers_desc: "The richest anchors need formations bred to remain in place. Feeding Guards will trade speed for armor, entrenchment, and stubborn defense."
DHO_guard_the_feeding_chambers_tt: "Unlocks the §YFeeding Guard§! template for guarded mature anchors."
DHO_refuse_barren_ground: "Refuse Barren Ground"
DHO_refuse_barren_ground_desc: "Empty territory cannot feed the Host. Campaign plans will bypass low-value expanses whenever a reachable resource route offers a better objective."
DHO_refuse_barren_ground_tt: "Orders campaigns to favor resource-bearing targets over barren diversions."
DHO_preserve_every_plate: "Preserve Every Plate"
DHO_preserve_every_plate_desc: "Lost broods are lost mineral memory. Recovery cycles and chamber reserves will be reorganized to replace strength with less waste."
DHO_preserve_every_plate_tt: "Shortens replacement timing and improves capacity recovery at secure anchors."
DHO_vaults_beneath_the_continent: "Vaults Beneath the Continent"
DHO_vaults_beneath_the_continent_desc: "The richest chambers will be deepened into armored vaults. They will remain feeding centers, regional fortresses, and protected links in the continental network."
DHO_vaults_beneath_the_continent_tt: "Adds one permanent land-fort level to every current and future mature anchor. Each anchor receives this vault fortification only once."
DHO_survey_surface_seams: "Survey Surface Seams"
DHO_survey_surface_seams_desc: "The Host will compare captured surveys with the vibrations beneath roads and factories. Future anchors must be chosen for what the state truly contains."
DHO_survey_surface_seams_tt: "Refreshes the resource-weighted anchor target map."
DHO_activate_resource_anchors: "Activate Resource Anchors"
DHO_activate_resource_anchors_desc: "Captured ground becomes useful only after uninterrupted control allows the Host to connect it to the chambers below. Each non-origin state will be measured by its total strategic resources."
DHO_activate_resource_anchors_tt: "Enables continuous-control anchor activation and capacity of §Yfloor(total resources / 10)§!, up to a maximum of §Y10§! per non-origin state."
DHO_build_brood_queues: "Build Brood Queues"
DHO_build_brood_queues_desc: "Active anchors will shape new formations automatically as capacity becomes available. No human barracks, recruiting pool, or equipment stockpile will be used."
DHO_build_brood_queues_tt: "Enables automatic capacity-bound brood spawning. Cave units cannot be trained normally."
DHO_fortify_the_feeding_state: "Fortify the Feeding State"
DHO_fortify_the_feeding_state_desc: "A mature anchor is more than a source of bodies. Guard galleries, reserve chambers, and hardened entrances will make one feeding state costly to recapture."
DHO_fortify_the_feeding_state_tt: "Allows mature anchors to receive the fortified feeding-chamber package."
DHO_consume_captured_industry: "Consume Captured Industry"
DHO_consume_captured_industry_desc: "Surface factories cannot build Oth-Kesh bodies. Their foundations, power, and excavations can accelerate chamber works. Secure industry will be converted into anchor infrastructure."
DHO_consume_captured_industry_tt: "Unlocks conversion of controlled industrial states into faster anchor and adaptation projects."
DHO_link_the_chambers: "Link the Chambers"
DHO_link_the_chambers_desc: "Nearby active anchors will be joined by bounded underground routes. The links improve movement and recovery but fail if either endpoint is lost."
DHO_link_the_chambers_tt: "Marks up to two mature anchors as tunnel endpoints and unlocks projects that can choose a new pair."
DHO_the_continental_network: "The Continental Network"
DHO_the_continental_network_desc: "A chain of mature anchors can become one strategic depth. Broods will recover, move, and receive targets through a continent-wide chamber network."
DHO_the_continental_network_tt: "Makes future automatic broods prioritize tunnel-linked anchor endpoints, refreshes mature-anchor defenses, and keeps total brood capacity aligned with the active anchor network."
DHO_learn_the_open_sky: "Learn the Open Sky"
DHO_learn_the_open_sky_desc: "The surface has horizons, aircraft, and lines of sight unknown in the first chamber. The Host must learn how exposed movement changes war."
DHO_learn_the_open_sky_tt: "Begins the surface-warfare doctrine and adaptation branches."
DHO_read_the_enemy_line: "Read the Enemy Line"
DHO_read_the_enemy_line_desc: "Armor values alone do not reveal where a human front will bend. Captured weapons, fortifications, and supply routes will be studied before doctrine is chosen."
DHO_read_the_enemy_line_tt: "Records enemy piercing and fortification conditions for the Host's doctrine choices."
DHO_stone_phalanx: "Stone Phalanx"
DHO_stone_phalanx_desc: "Dense formations will advance as interlocking mineral walls. They are slow even by Oth-Kesh standards, but ordinary infantry weapons will struggle to stop them."
DHO_stone_phalanx_tt: "Chooses §YStone Phalanx§!: 12% army attack, 15% planning speed, and 10% defense at a 10% movement-speed cost. Stone Phalanxes become the preferred automatic brood."
DHO_interlocking_carapaces: "Interlocking Carapaces"
DHO_interlocking_carapaces_desc: "Each brood will cover the exposed seams of the next. Concentrated formations gain defense and cohesion at the cost of still slower maneuver."
DHO_interlocking_carapaces_tt: "Evolves the single cumulative Stone spirit into §YInterlocking Carapaces§!: 12% army attack, 15% planning speed, 8% organization, and 22% defense, with 18% lower movement speed and 8% greater supply consumption."
DHO_deliberate_front_advance: "Deliberate Front Advance"
DHO_deliberate_front_advance_desc: "The phalanx will spend time aligning chambers, supply, and attack lanes before it moves. Once committed, the whole mineral wall presses one sector."
DHO_deliberate_front_advance_tt: "Unlocks a planned phalanx assault action and careful front execution."
DHO_resist_the_great_guns: "Resist the Great Guns"
DHO_resist_the_great_guns_desc: "Weapons capable of piercing the first carapaces have been identified. Denser layers and sacrificial outer plates will answer them."
DHO_resist_the_great_guns_tt: "Evolves the single cumulative Stone spirit into §YGreat-Gun Resistance§!: 16% army attack, 15% planning speed, 14% organization, and 32% defense, with 23% lower movement speed and 8% greater supply consumption. A reachable strongpoint is marked."
DHO_crush_the_fortified_line: "Crush the Fortified Line"
DHO_crush_the_fortified_line_desc: "Human fortifications concentrate exactly the guns that threaten the Host. The phalanx will mark one strongpoint and break it with massed armored pressure."
DHO_crush_the_fortified_line_tt: "Marks a fortified target and concentrates Stone Phalanxes against it."
DHO_the_moving_mountain: "The Moving Mountain"
DHO_the_moving_mountain_desc: "A complete phalanx no longer resembles an army crossing the ground. It is a ridge advancing under command, slow enough to measure and too heavy to ignore."
DHO_the_moving_mountain_tt: "Makes Stone Phalanx the Host's preferred automatic brood."
DHO_burrow_war: "Burrow War"
DHO_burrow_war_desc: "The front has a lower surface that human maps rarely show. Broods will approach through rock, cellars, and cuttings before striking supply and command points."
DHO_burrow_war_tt: "Chooses §YBurrow War§!: 8% army attack, 15% planning speed, 15% lower supply consumption, and 5% lower defense. Burrow Columns become the preferred automatic brood."
DHO_listen_beneath_the_roads: "Listen Beneath the Roads"
DHO_listen_beneath_the_roads_desc: "Traffic and rail vibration reveal where armies are fed. The Host will use the ground itself to locate the routes holding a front together."
DHO_listen_beneath_the_roads_tt: "Marks critical rail and road targets for underground operations."
DHO_hidden_approach_chambers: "Hidden Approach Chambers"
DHO_hidden_approach_chambers_desc: "Small chambers can be excavated behind a protected anchor before an attack. Their value lies in secrecy and a short final approach."
DHO_hidden_approach_chambers_tt: "Unlocks bounded burrow approaches from active anchors to adjacent targets."
DHO_undermine_the_rail_junction: "Undermine the Rail Junction"
DHO_undermine_the_rail_junction_desc: "A front supplied through one junction can be weakened before the first visible attack. Broods will collapse the route at the chosen hour."
DHO_undermine_the_rail_junction_tt: "Adds transport-junction disruption objectives to Burrow War."
DHO_urban_cellar_networks: "Urban Cellar Networks"
DHO_urban_cellar_networks_desc: "Cities already contain foundations, tunnels, drains, and basements. The Host will connect them into a battlefield beneath the streets."
DHO_urban_cellar_networks_tt: "Evolves the single cumulative Burrow spirit into §YUrban Cellar Networks§!: 13% army attack, 25% planning speed, 23% lower supply consumption, and 8% lower defense. Transport objectives suffer 120 days of resource, supply, organization, and construction disruption."
DHO_the_front_has_a_floor: "The Front Has a Floor"
DHO_the_front_has_a_floor_desc: "Every human line rests on ground that can be entered, broken, and used. Burrow Columns will become the Host's preferred answer to difficult fronts."
DHO_the_front_has_a_floor_tt: "Makes Burrow Columns the Host's preferred automatic brood."
DHO_scree_tide: "Scree Tide"
DHO_scree_tide_desc: "Smaller, lighter broods will trade armor for momentum. They will pour through a broken line before the enemy can rebuild it."
DHO_scree_tide_tt: "Chooses §YScree Tide§!: 25% movement speed and 10% planning speed at a 5% organization and defense cost. Scree Packs become the preferred automatic brood."
DHO_split_the_great_broods: "Split the Great Broods"
DHO_split_the_great_broods_desc: "The largest formations will be divided into packets that can follow several roads at once. Capacity is spread across more maneuverable bodies."
DHO_split_the_great_broods_tt: "Evolves the single cumulative Scree spirit into §YSplit Great Broods§!: 33% movement speed and 10% planning speed, with 9% lower organization, 10% lower defense, and 5% greater supply consumption. The automatic-spawn interval shortens once."
DHO_lighter_plates: "Lighter Plates"
DHO_lighter_plates_desc: "Outer mineral layers will be thinned where speed matters more than protection. The resulting broods can pursue retreating armies without becoming ordinary infantry."
DHO_lighter_plates_tt: "Evolves the single cumulative Scree spirit into §YLighter Plates§!: 45% movement speed, 10% planning speed, and 8% organization recovery, with 9% lower organization, 18% lower defense, and 5% greater supply consumption. Scree Packs remain the preferred automatic brood."
DHO_follow_the_retreat: "Follow the Retreat"
DHO_follow_the_retreat_desc: "A broken army exposes crossings, depots, and unguarded resource states. Scree Packs will receive immediate pursuit priorities."
DHO_follow_the_retreat_tt: "Orders Scree Packs to exploit retreats and seize reachable resource corridors."
DHO_swarm_the_crossings: "Swarm the Crossings"
DHO_swarm_the_crossings_desc: "Bridges, passes, and junctions will be taken before defenders can assemble. Raiding broods will commit available capacity to rapid seizure."
DHO_swarm_the_crossings_tt: "Unlocks doctrine-specific raiding broods and crossing targets."
DHO_the_hills_begin_to_move: "The Hills Begin to Move"
DHO_the_hills_begin_to_move_desc: "Separated packs can make an entire horizon appear to advance. Their armor is thinner, but their speed turns every weak front into a route for the Host."
DHO_the_hills_begin_to_move_tt: "Makes Scree Packs the Host's preferred automatic brood."
DHO_study_broken_weapons: "Study Broken Weapons"
DHO_study_broken_weapons_desc: "Recovered anti-armor weapons reveal how the surface has learned to kill the Host. The next answer will use living tissue and mineral structure, with factory output serving as a supporting tool."
DHO_study_broken_weapons_tt: "Records enemy weapon lessons and opens mutually exclusive body adaptations."
DHO_grow_denser_plates: "Grow Denser Plates"
DHO_grow_denser_plates_desc: "Additional mineral layers will protect the broods from concentrated hard attack. The gain in survival is purchased with still slower movement."
DHO_grow_denser_plates_tt: "Chooses the dense adaptation spirit: 10% organization and 8% defense at a 12% movement-speed cost."
DHO_open_the_joints: "Open the Joints"
DHO_open_the_joints_desc: "Armor will be reduced around selected articulations so broods can turn and recover faster. Exposure at the seams is the price of maneuver."
DHO_open_the_joints_tt: "Chooses the open-joint adaptation spirit: 18% movement speed and 10% organization recovery at an 8% defense cost."
DHO_surface_senses: "Surface Senses"
DHO_surface_senses_desc: "Light, sound, and distant movement will be read as carefully as vibration in rock. The Host will plan with a wider picture of each front."
DHO_surface_senses_tt: "Evolves the selected body plan into one cumulative spirit. Dense Plates retain 10% organization, 8% defense, and 12% lower speed. Open Joints retain 18% speed, 10% organization recovery, and 8% lower defense. Both gain 12% planning speed, 10% maximum planning, and 15% reconnaissance."
DHO_harden_against_the_sky: "Harden Against the Sky"
DHO_harden_against_the_sky_desc: "The open sky leaves the Host exposed wherever stone no longer covers it. Broods will alter their upper plates and movement rhythms before surface aircraft can exploit that weakness."
DHO_harden_against_the_sky_tt: "Evolves the selected adaptation into its final cumulative spirit and reduces the hostile air-superiority combat advantage by 20%. Dense Plates reach 16% defense. Sky-hardening offsets the Open Joints defense penalty."
DHO_choose_the_final_adaptation: "Choose the Final Adaptation"
DHO_choose_the_final_adaptation_desc: "The first continental war has revealed which weakness is most dangerous. The chosen body pattern will be fixed into later brood generations."
DHO_choose_the_final_adaptation_tt: "Fixes the selected body pattern in later brood generations. Dense Plates favor Stone Phalanxes, while Open Joints favor Scree Packs."
DHO_mark_the_richest_route: "Mark the Richest Route"
DHO_mark_the_richest_route_desc: "Expansion must serve capacity. The next campaign objective will be the richest reachable state, with border convenience carrying less weight."
DHO_mark_the_richest_route_tt: "Marks the richest reachable enemy state as the next map objective."
DHO_break_the_first_ring: "Break the First Ring"
DHO_break_the_first_ring_desc: "The countries touching the origin form the first cage. Their fronts must be broken so the Host can reach a sustainable network of anchors."
DHO_break_the_first_ring_tt: "Refreshes wars against every adjacent land neighbor and prioritizes the first encirclement ring."
DHO_consume_an_industrial_belt: "Consume an Industrial Belt"
DHO_consume_an_industrial_belt_desc: "A connected industrial region offers excavations, transport, and multiple resource states. Capturing it will accelerate the chamber network."
DHO_consume_an_industrial_belt_tt: "Marks an industrial-resource belt and improves conversion priorities."
DHO_take_the_continental_capitals: "Take the Continental Capitals"
DHO_take_the_continental_capitals_desc: "Political capitals concentrate rails, stockpiles, and command. Their loss will fracture resistance even when they are not the richest ground."
DHO_take_the_continental_capitals_tt: "Adds surviving continental capitals to the Host's strategic objective map."
DHO_seal_the_coast: "Seal the Coast"
DHO_seal_the_coast_desc: "Ports and coastal corridors carry aid and anti-armor weapons into the continent. The Host will drive defenders away from these entry points."
DHO_seal_the_coast_tt: "Marks hostile continental ports and coastal supply states as campaign objectives."
DHO_break_continental_coalitions: "Break Continental Coalitions"
DHO_break_continental_coalitions_desc: "Threatened governments will cooperate against the Host. Neighbor wars and target priorities must be refreshed faster than their coalition can stabilize."
DHO_break_continental_coalitions_tt: "Renews wars against adjacent defenders and concentrates the Host against countries sharing anti-cave intelligence."
DHO_consume_the_last_resistance: "Consume the Last Resistance"
DHO_consume_the_last_resistance_desc: "Only a few eligible states remain outside the network. Every surviving pocket will be marked for the final continental campaign."
DHO_consume_the_last_resistance_tt: "Marks every remaining eligible origin-continent state for the final campaign."
DHO_continent_consumed: "Continent Consumed"
DHO_continent_consumed_desc: "Every eligible state of the origin continent lies under Oth-Kesh ownership and control. The claim must survive exact delayed verification before the war can cross the seas."
DHO_continent_consumed_tt: "Begins a delayed verification of Oth-Kesh ownership and control across the entire origin continent."
DHO_deepen_the_continental_heart: "Deepen the Continental Heart"
DHO_deepen_the_continental_heart_desc: "The first continent will become a protected reservoir for every later front. Mature anchors are strengthened before any distant rupture is attempted."
DHO_deepen_the_continental_heart_tt: "Strengthens mature anchors across the origin continent before the Host commits to distant ruptures."
DHO_listen_beneath_distant_shores: "Listen Beneath Distant Shores"
DHO_listen_beneath_distant_shores_desc: "Industrial vibration crosses no ocean, but comparable depths answer one another. The Host will identify resource-heavy footholds beyond the first continent."
DHO_listen_beneath_distant_shores_tt: "Surveys valid resource-rich footholds on other continents and favors the richest sites."
DHO_choose_the_first_rupture: "Choose the First Rupture"
DHO_choose_the_first_rupture_desc: "With chaos beyond the final threshold and the first continent verified, the Host can choose where the connected depths will open next."
DHO_choose_the_first_rupture_tt: "Begins a 60-day final verification when chaos is strictly above §Y1000§!, the origin continent remains secured, and no rival world-ending crisis is active."
DHO_the_world_opens_below: "The World Opens Below"
DHO_the_world_opens_below_desc: "The first continent is no longer a contained theater. Stronger formations will emerge through resource-weighted footholds on distant continents at once."
DHO_the_world_opens_below_tt: "Transforms the Host into the World Below, halts unfinished field development, and opens stronger footholds in valid resource-rich states on distant continents."

# Event log, history payload, and evolution detail text
resources_found.event_details.description: "Surveyors have struck a major deposit in one of the country's states. The first find promises jobs, trade, and new industry. Repeated discoveries can turn the same field into a boomtown, a diplomatic prize, or something much harder to control."
resources_found.event_details.history: "[GetResourcesFoundHistoryMode] at §Y[?resources_found_history_detail_state.GetName]§! added §Y[?resources_found_history_detail_amount|0] [GetResourcesFoundHistoryResourceName]§!. The field's discovery ledger stood at §Y[?resources_found_history_detail_total|0]§! total strategic resources after this find."
