cbrn_help_condemnation_summary: "A confirmed release brings international Condemnation on a §Y[?cbrn_help_condemnation_scale_minimum|0]§!-§Y[?cbrn_help_condemnation_scale_maximum|0]§! scale. Higher Condemnation makes concealing an incident more expensive, up to §Y[?cbrn_help_concealment_price_ceiling|0]§! times the base price, and can invite inspections. While inspections are running, a §Y[?cbrn_help_inspection_days|0]§!-day burden raises consumer goods by §Y[?cbrn_help_inspection_consumer_goods_minimum|%0]§! to §Y[?cbrn_help_inspection_consumer_goods_maximum|%0]§! depending on your score."
cbrn_choose_retaliation_only: "Retaliation Only"
cbrn_choose_retaliation_only_desc: "Eligible chemical and biological operations may target a confirmed first user while an exact-target retaliation right remains active. First use and unrestricted strategic release remain prohibited."
cbrn_choose_retaliation_only_requirements_tt: "Requires the end of the current policy reassessment period."
cbrn_choose_retaliation_only_effect_tt: "Adopts Retaliation Only and begins a [GetCBRNPolicyReassessmentDaysQuote]-day reassessment period."
cbrn_choose_battlefield_authorization: "Battlefield Authorization"
cbrn_choose_battlefield_authorization_desc: "Authorizes chemical and biological battlefield raids when their research, equipment, protection, and target requirements are met. Strategic first use remains prohibited."
cbrn_choose_battlefield_authorization_requirements_tt: "Requires the end of the current policy reassessment period."
cbrn_choose_battlefield_authorization_effect_tt: "Adopts Battlefield Authorization and begins a [GetCBRNPolicyReassessmentDaysQuote]-day reassessment period."
cbrn_choose_unrestricted_authorization: "Unrestricted Authorization"
cbrn_choose_unrestricted_authorization_desc: "Authorizes strategic and extreme chemical or biological operations after terminal Chaos Warfare command. Every route still requires its research, equipment, and valid target."
cbrn_choose_unrestricted_authorization_requirements_tt: "Requires terminal Chaos Warfare command and the end of the current policy reassessment period."
cbrn_choose_unrestricted_authorization_effect_tt: "Adopts Unrestricted Authorization and begins a [GetCBRNPolicyReassessmentDaysQuote]-day reassessment period."
cbrn_operations_status_desc: "Current release policy: [GetCBRNPolicyStatus]. Changing it starts a reassessment period."
cbrn_program_management_status_desc: "Status: [GetCBRNOperationalStatus]. Military masks: [?cbrn_military_mask_coverage|.1]% ([?cbrn_military_mask_crates|.0]/[?cbrn_military_mask_requirement|.0] crates; short [?cbrn_military_mask_shortage_crates|.0]). Cleanup: [?cbrn_military_decontamination_kits|.0]/[?cbrn_military_decontamination_requirement|.0] kits (short [?cbrn_military_decontamination_shortage_kits|.0]). Training: [GetCBRNMaskTrainingStatus]."
cbrn_civil_defence_status_desc: "Civilian masks: [?cbrn_civilian_mask_total_crates|.0] crates issued. New crates go to threatened states or wartime distribution.\nCivilian cleanup: [?cbrn_civilian_decontamination_demand_kits|.0] kits needed in prepared or affected states; short [?cbrn_civilian_decontamination_shortage_kits|.0] after troop priority. Field kit research is required."
