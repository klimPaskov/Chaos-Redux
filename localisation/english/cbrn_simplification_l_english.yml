cbrn_choose_retaliation_only: "Retaliation Only"
cbrn_choose_retaliation_only_desc: "Chemical weapons may be released against a confirmed first user during an active response window. Battlefield first use and unrestricted strategic release remain prohibited."
cbrn_choose_retaliation_only_requirements_tt: "Requires the end of the current policy reassessment period."
cbrn_choose_retaliation_only_effect_tt: "Adopts Retaliation Only and begins a [?constant:cbrn_doctrine_timing.policy_reassessment_days|.0]-day reassessment period."
cbrn_choose_battlefield_authorization: "Battlefield Authorization"
cbrn_choose_battlefield_authorization_desc: "Authorizes battlefield chemical operations when their equipment, targeting and command requirements are met. Strategic release remains limited to valid retaliation."
cbrn_choose_battlefield_authorization_requirements_tt: "Requires the end of the current policy reassessment period."
cbrn_choose_battlefield_authorization_effect_tt: "Adopts Battlefield Authorization and begins a [?constant:cbrn_doctrine_timing.policy_reassessment_days|.0]-day reassessment period."
cbrn_choose_unrestricted_authorization: "Unrestricted Authorization"
cbrn_choose_unrestricted_authorization_desc: "Authorizes strategic chemical release and other extreme operations after Chaos Warfare reaches terminal command. Operations still require real equipment and valid targets."
cbrn_choose_unrestricted_authorization_requirements_tt: "Requires terminal Chaos Warfare command and the end of the current policy reassessment period."
cbrn_choose_unrestricted_authorization_effect_tt: "Adopts Unrestricted Authorization and begins a [?constant:cbrn_doctrine_timing.policy_reassessment_days|.0]-day reassessment period."
cbrn_operations_status_desc: "Current release policy: [GetCBRNPolicyStatus]. A policy change begins a [?constant:cbrn_doctrine_timing.policy_reassessment_days|.0]-day reassessment."
cbrn_program_management_status_desc: "Military mask coverage: [?cbrn_military_mask_coverage|.1]%. Issued crates: [?cbrn_military_mask_crates|.0] / [?cbrn_military_mask_requirement|.0]; shortage: [?cbrn_military_mask_shortage_crates|.0]. Protection training: [GetCBRNMaskTrainingStatus]. Operational readiness: [?chemical_readiness|.1] / [?chemical_readiness_cap|.0]. Routine issue and filter replacement draw from real stockpiles."
cbrn_civil_defence_status_desc: "Civilian masks issued: [?cbrn_civilian_mask_total_crates|.0] crates. Available mask crates are issued during a qualifying state alert, contamination, or wartime distribution. Emergency state responses require an alert or contamination."
