dhrondan_event_detail_clause: "\n\nThe D’Rhondan landings have produced a sovereign exile state whose scattered enclaves remember another world. Its leaders must preserve their people, settle their place on Earth, and decide what they owe to the countries beneath their landing grounds. Their chosen regime may propose an access accord, whose terms take effect only if a terrestrial government accepts."
dhrondan_event_detail_clause_blank: ""
dhrondan_calculant_refund_tt: "The First Calculants recover §G[?constant:dhrondan_focus_mechanic_factor.calculant_refund_share|%0]§! of this order's Political Power."
dhrondan_council_integration_tt: "The state's elected council raises recruits from its population (§Y[?constant:dhrondan_focus_mechanic.council_manpower_per_thousand|0]§! manpower for each thousand inhabitants) and changes our stability by §G+[?constant:dhrondan_focus_mechanic_factor.council_integration_stability|%0]§!."
dhrondan_reclamation_debated_mandate_tt: "The chamber's debated mandate makes the war goal last §Y[?constant:dhrondan_focus_mechanic.reclamation_debate_multiplier|0]§! times as long."
dhrondan_enclave_forecast_bridge_tt: "The Synod's forecast builds a second infrastructure level with the bridge."
dhrondan_compact_departure_terms_tt: "We grant D’Rhonda military access, and people who choose to leave may settle in D’Rhonda."
dhrondan_compact_federation_terms_tt: "We join D’Rhonda’s Two-World Federation."
dhrondan_extraterrestrial_embassy: "Extraterrestrial Embassy"
