# Regime leaders
DHR_emperor_vael_ix: "Emperor Vael IX"
DHR_emperor_vael_ix_desc: "Vael IX carries a broken imperial line into exile. He regards every landing state as a surviving province and every alien cohort as proof that the old crown still commands obedience."
DHR_first_calculant_sera_qel: "First Calculant Sera Qel"
DHR_first_calculant_sera_qel_desc: "Sera Qel treats sovereignty as a survival equation. Her Synod gives authority to those whose projections keep the scattered enclaves alive."
DHR_speaker_ilyr_ren: "Speaker Ilyr Ren"
DHR_speaker_ilyr_ren_desc: "Ilyr Ren insists that exile created obligations to both peoples. The Chamber she leads gives human delegates a voice beside D’Rhondan survivors."

# Advisors and high command
DHR_archivist_thaal_ven: "Archivist Thaal Ven"
DHR_archivist_thaal_ven_desc: "Thaal Ven remembers institutions that no longer exist and turns their records into laws that can survive on Earth."
DHR_logistics_oracle_nym_vor: "Logistics Oracle Nym Vor"
DHR_logistics_oracle_nym_vor_desc: "Nym Vor reads supply routes as chains of probability, sending scarce stores where failure would spread fastest."
DHR_harmonic_envoy_rae_syl: "Harmonic Envoy Rae Syl"
DHR_harmonic_envoy_rae_syl_desc: "Rae Syl hears hesitation before words are translated and builds agreements around the meaning both sides can accept."
DHR_war_calculant_orr_kesh: "War Calculant Orr Kesh"
DHR_war_calculant_orr_kesh_desc: "Orr Kesh reduces campaigns to branches, losses, and decisive moments, then teaches officers to act before the favorable branch closes."
DHR_genetic_steward_vel_ara: "Genetic Steward Vel Ara"
DHR_genetic_steward_vel_ara_desc: "Vel Ara protects a population whose future depends on careful medicine, shared citizenship, and the survival of every enclave."
DHR_shadow_listener_thel_ior: "Shadow Listener Thel Ior"
DHR_shadow_listener_thel_ior_desc: "Thel Ior finds patterns in intercepted noise and patient silence, revealing intentions long before a formal message arrives."
DHR_field_vector_kaal_dren: "Field Vector Kaal Dren"
DHR_field_vector_kaal_dren_desc: "Kaal Dren commands by tracing the narrow route through which an attack can become inevitable."
DHR_enclave_guardian_syr_vek: "Enclave Guardian Syr Vek"
DHR_enclave_guardian_syr_vek_desc: "Syr Vek built defenses for isolated landing communities that could expect neither relief nor retreat."
DHR_orbital_liaison_omn_tal: "Orbital Liaison Omn Tal"
DHR_orbital_liaison_omn_tal_desc: "Omn Tal translates orbital timing into ground movement and keeps scattered columns synchronized under impossible skies."

# Traits
dhrondan_ninth_diadem: "The Ninth Diadem"
dhrondan_ninth_diadem_desc: "The exile crown binds military continuity to the survival of the scattered imperial people."
dhrondan_predictive_calculus: "Predictive Calculus"
dhrondan_predictive_calculus_desc: "Policy is judged by the futures it prevents and the futures it makes possible."
dhrondan_two_world_speaker: "Speaker for Two Worlds"
dhrondan_two_world_speaker_desc: "Legitimacy depends on a chamber able to speak for both the arrivals and the people among whom they landed."
dhrondan_living_archive: "Living Archive"
dhrondan_living_archive_desc: "Lost institutions survive through disciplined memory and adaptable law."
dhrondan_supply_oracle: "Supply Oracle"
dhrondan_supply_oracle_desc: "Predictive routing reduces waste across separated and vulnerable enclaves."
dhrondan_harmonic_envoy: "Harmonic Envoy"
dhrondan_harmonic_envoy_desc: "Translation, cadence, and mutual concession make difficult agreements durable."
dhrondan_predictive_high_command: "Predictive High Command"
dhrondan_predictive_high_command_desc: "Operational branches are rehearsed before the enemy chooses among them."
dhrondan_genetic_stewardship: "Genetic Stewardship"
dhrondan_genetic_stewardship_desc: "Careful integration protects both the exile population and the communities that receive it."
dhrondan_shadow_listener: "Shadow Listener"
dhrondan_shadow_listener_desc: "Signals become useful when silence is studied as closely as transmission."

# Decisions
dhrondan_sovereignty_category: "D’Rhondan Sovereignty"
dhrondan_sovereignty_category_desc: "Landing states, stranded enclaves, and human partners define the borders of a nation divided between worlds."
dhrondan_reclaim_landing_site: "Reclaim [FROM.GetName]"
dhrondan_reclaim_landing_site_desc: "A marked landing state remains outside our rule. We can declare our intention to recover it and prepare a territorial war goal against its owner."
dhrondan_establish_enclave_supply_bridge: "Bridge the [FROM.GetName] Enclave"
dhrondan_establish_enclave_supply_bridge_desc: "This disconnected enclave needs a protected terrestrial supply bridge before it can share the burden of government."
dhrondan_integrate_reclaimed_landing_site: "Integrate [FROM.GetName]"
dhrondan_integrate_reclaimed_landing_site_desc: "A recovered landing state can enter the sovereign settlement after its regime establishes a political mandate for integration."
dhrondan_offer_two_world_compact: "Offer a Two-World Compact to [FROM.GetNameDef]"
dhrondan_offer_two_world_compact_desc: "The ratified Two-World Covenant permits a formal compact establishing mutual recognition, a non-aggression pact, and a durable channel between terrestrial and D’Rhondan institutions."
dhrondan_offer_terrestrial_partner_accord: "Offer a Terrestrial Partner Accord to [FROM.GetNameDef]"
dhrondan_offer_terrestrial_partner_accord_desc: "After exchanging maps and opening partner selection, D’Rhonda may propose one accord at a time. Acceptance is voluntary. Imperial rule grants a guarantee and reciprocal military access; the Synod grants mutual market access with Arms Against Tyranny, or reciprocal military access without it; the Covenant grants reciprocal military access and a bilateral embassy understanding. Existing non-aggression pacts remain untouched."
dhrondan_partner_accord_root_requirements_tt: "Requires independent D’Rhonda to be at peace under Imperial, Synod, or Covenant rule, with the map exchange and partner-selection mandate. Only one terrestrial partner accord may be concluded, or two once the Embassy Beyond the Stars is established."
dhrondan_reclamation_wargoal_issued_tt: "We will receive a limited territorial war goal to take [FROM.GetName] from its present owner."
dhrondan_enclave_crisis_resolved_tt: "[FROM.GetName] gains an infrastructure level. When every disconnected landing enclave has a supply bridge, or after Offer a Shared Horizon is a core of D’Rhonda, the enclave crisis ends and our stability improves."
dhrondan_postwar_integration_completed_tt: "[FROM.GetName] becomes our core territory, advances the sovereign settlement, and increases war support."
dhrondan_diplomatic_offer_active_tt: "No other D’Rhondan diplomatic proposal is awaiting an answer."
dhrondan_reclamation_target_requirements_tt: "Requires a marked landing state claimed by D’Rhonda, held by another country, and not already named in an active reclamation demand."
dhrondan_enclave_target_requirements_tt: "Requires a marked, controlled enclave outside the capital region, below maximum infrastructure, and without a completed supply bridge."
dhrondan_reclamation_route_requirements_tt: "Requires D’Rhonda’s perfected predictive-warfare program, or under the Covenant a mandate debated by the chamber, before a reclamation demand can be issued."
dhrondan_enclave_route_requirements_tt: "Requires the completed Two-World Research Complex before a disconnected enclave can receive a supply bridge."
dhrondan_integration_target_requirements_tt: "Requires a marked landing state under D’Rhondan ownership and control that is not yet a core. Integration needs peace unless the Imperial Continuity has codified wartime service."
dhrondan_integration_route_requirements_tt: "Requires the Subject World Protocol, Optimal Order administration, or Enclave Congress mandate for the current regime."
dhrondan_compact_target_requirements_tt: "Both parties must be independent and at peace with one another. The proposed partner must have neither a non-aggression pact nor an existing Two-World Compact with D’Rhonda."
dhrondan_terrestrial_partner_target_requirements_tt: "The proposed partner must be independent, at peace with D’Rhonda, and not capitulated. A current non-aggression pact is allowed, but a country that already concluded a terrestrial partner accord cannot be selected again."
dhrondan_partner_accord_imperial_accept_effect_tt: "D’Rhonda guarantees our independence, both governments grant reciprocal military access, and their relations deepen through the partner accord."
dhrondan_partner_accord_synod_accept_effect_tt: "With Arms Against Tyranny, both governments receive mutual market access. Without it, both grant each other military access."
dhrondan_partner_accord_covenant_accept_effect_tt: "Both governments grant reciprocal military access and establish a bilateral embassy accord that improves relations."
dhrondan_partner_accord_refuse_effect_tt: "Decline the offer without changing relations or creating an access agreement. The decision’s cooldown still applies."

# Country events
chaosx.nr16.48.t: "D’Rhonda Rises"
chaosx.nr16.48.d: "Across the marked landing states, alien garrisons have lowered their former hosts’ standards and raised a banner remembered from another world. The exiles call their state D’Rhonda. Its first proclamations promise continuity, survival, and the recovery of every scattered enclave. The new state holds former host territory behind ranks of alien soldiers."
chaosx.nr16.48.a: "Another sovereignty enters the world."
chaosx.nr16.49.t: "A Compact Across Two Worlds"
chaosx.nr16.49.d: "An envoy from [dhrondan_diplomatic_actor.GetNameDef] offers mutual recognition and a non-aggression pact. The document names Earth as one chamber in a political order shared by two peoples. Acceptance would make us one of the first terrestrial governments to recognize that claim."
chaosx.nr16.49.partner.t: "A Terrestrial Partner Accord"
chaosx.nr16.49.partner.imperial.d: "Envoys from [dhrondan_diplomatic_actor.GetNameDef] offer a guarantee of our independence and reciprocal military access. Acceptance records our consent to the Imperial accord; any existing non-aggression pact remains in force."
chaosx.nr16.49.partner.synod_market.d: "Envoys from [dhrondan_diplomatic_actor.GetNameDef] offer mutual market access under the Synod accord. Acceptance records our consent to open our markets to one another; any existing non-aggression pact remains in force."
chaosx.nr16.49.partner.synod_military.d: "Envoys from [dhrondan_diplomatic_actor.GetNameDef] offer reciprocal military access under the Synod accord. Arms Against Tyranny is not enabled, so acceptance grants both governments access to each other’s territory; any existing non-aggression pact remains in force."
chaosx.nr16.49.partner.covenant.d: "Envoys from [dhrondan_diplomatic_actor.GetNameDef] offer reciprocal military access and a bilateral embassy understanding under the Covenant accord. Acceptance records our consent to both terms; any existing non-aggression pact remains in force."
chaosx.nr16.49.partner.b: "Decline the proposal."
chaosx.nr16.49.a: "Accept the proposal."
chaosx.nr16.49.b: "Decline the proposal."
chaosx.nr16.49.c: "The offer no longer stands."
dhrondan_compact_accept_effect_tt: "§GConclude a non-aggression pact and improve mutual relations.§! D’Rhondan stability rises by §G2%§!. Both governments must still be independent, at peace with one another, and able to honor this offer when the reply is sent."
dhrondan_compact_refuse_effect_tt: "§RReject recognition and reduce our opinion of D’Rhonda.§! If the offer has lapsed, the reply closes it without a diplomatic penalty."
dhrondan_compact_expired_effect_tt: "Close this offer without changing relations or concluding an agreement."
chaosx.nr16.50.t: "The Compact Is Ratified"
chaosx.nr16.50.d: "Our envoys return with a signed compact and formal recognition of D’Rhondan sovereignty by a terrestrial government. The Chamber presents the agreement as a peaceful foundation for the exile state."
chaosx.nr16.50.a: "Let both skies witness it."
chaosx.nr16.51.t: "The Compact Is Refused"
chaosx.nr16.51.d: "Our proposed partner has rejected formal recognition. Their reply treats D’Rhondan sovereignty as an unsettled consequence of the landings. The Chamber must decide how long to pursue recognition without reciprocity."
chaosx.nr16.51.a: "The offer will be remembered."

# Opinion modifiers and Event 016 details
dhrondan_two_world_compact: "Two-World Compact"
dhrondan_terrestrial_partner_accord: "Terrestrial Partner Accord"
dhrondan_reclamation_demand: "D’Rhondan Reclamation Demand"
