chaosx.fallout.1023.t: "The Old Doctor's Trial"
chaosx.fallout.1023.opening.d: "When the Fertility Question memory closes in the Congo Green Basin, ward delegates bring a second ledger to the river clinic. It records coerced treatment, forged consent, and patients moved between the river wards and the hill road without a witness. The pages describe a brutal civic crime. They do not establish ordinary radiation biology. The former clinic director asks for a hearing before the Basin decides whether knowledge, punishment, and care can share one room."
chaosx.fallout.1023.a: "Open a public trial"
chaosx.fallout.1023.a.tt: "Spend Food 2, Medicine 3, and Recognition 2 to seat river and hill witnesses in a public hearing. The trial can restore trust when the ward records survive examination."
chaosx.fallout.1023.b: "Convene a truth commission"
chaosx.fallout.1023.b.tt: "Spend Scrap 2, Power 2, and Recognition 2 to preserve the clinic ledgers and give each witness a recorded statement. The commission can expose a wider network, though the Basin may lose cohesion while the inquiry proceeds."
chaosx.fallout.1023.c: "Pardon the doctor for retained knowledge"
chaosx.fallout.1023.c.tt: "Spend Fuel 1 and Recognition 2, then accept a Cohesion cost, to keep the former director working under two-witness supervision. The Basin may retain useful medical practice, but survivors must live with the pardon."
chaosx.fallout.1023.d: "Keep the records under seal"
chaosx.fallout.1023.d.tt: "Spend Food 1, Medicine 1, Fuel 1, and Recognition 1 to lock the files in a guarded archive. The seal may protect witnesses from reprisals, yet silence can leave the ward without a shared account."
chaosx.fallout.1025.t: "The Basin Hears the Ward"
chaosx.fallout.1025.public_trial.success.d: "The public trial keeps the river and hill records on the same table. Two witnesses confirm the consent failures, the former director is removed from clinical authority, and the clinic receives medicine under a ward council that can be challenged in public."
chaosx.fallout.1025.public_trial.partial.d: "The public trial reaches the river wards, but rain cuts the hill road before every witness can speak. The council accepts a narrow finding and a supervised clinic, while one missing ledger leaves the former director's wider network in dispute."
chaosx.fallout.1025.public_trial.failure.d: "The public trial loses its chain of custody when the clinic store floods. A witness withdraws after a guard changes sides, the former director's supporters scatter the pages, and the Basin spends medicine on a hearing that cannot establish who signed the orders."
chaosx.fallout.1025.truth_commission.success.d: "The truth commission copies the clinic ledgers into three ward archives and gives each witness a private route to amend a statement. It names the coercive practice, protects the river midwives, and allows the Basin to rebuild the clinic without returning the former director to command."
chaosx.fallout.1025.truth_commission.partial.d: "The commission preserves the river ledger and two witness accounts, but the hill archive loses its power before the final interview. The Basin can name the abuse in one district, while another keeps arguing over whether the missing pages were destroyed or carried away."
chaosx.fallout.1025.truth_commission.failure.d: "The commission turns into a contest over custody. The archive room is opened by an armed faction, witness names appear on a market wall, and the former director's knowledge is traded to clinics that refuse the Basin's oversight."
chaosx.fallout.1025.pardon_for_knowledge.success.d: "The Basin grants a narrow pardon for retained medical knowledge and binds the former director to two witnesses from different wards. The clinic treats cold-rain injuries under public review, and every procedure must carry a consent mark that the river council can revoke."
chaosx.fallout.1025.pardon_for_knowledge.partial.d: "The supervised pardon keeps the clinic open, though only one hill ward accepts the arrangement. Medicine reaches patients who would otherwise wait, while survivors keep a separate book of names that the council has not yet agreed to read aloud."
chaosx.fallout.1025.pardon_for_knowledge.failure.d: "The pardon breaks the witnesses' confidence when the former director hides a treatment register. Two wards close their doors to the clinic, the retained knowledge leaves with a night convoy, and the Basin must treat the pardon as a public injury."
chaosx.fallout.1025.secret_retention.success.d: "The sealed archive survives a guard rotation and protects the witnesses named in the first ledger. A small review cell still delivers medicine to the river wards, and the Basin records the seal as a temporary custody rule with a date for reopening."
chaosx.fallout.1025.secret_retention.partial.d: "The archive protects the river witnesses, but the hill road receives only an unsigned copy. The clinic remains open under a quiet guard, and every ward understands that the sealed pages can still be used by whoever controls the key."
chaosx.fallout.1025.secret_retention.failure.d: "The seal turns the clinic into a rumour. The key passes between guards, the witnesses stop answering the council, and a medicine cart leaves the Basin with a copy of the records that no court can verify."
chaosx.fallout.1025.a: "Record the Basin's finding"
chaosx.fallout.1025.a.tt: "Apply the graded hearing result, register the branch memory, notify the foreign witness ward, and schedule a delayed review after the next wet season."
chaosx.fallout.1027.t: "The Witnesses Return"
chaosx.fallout.1027.success.d: "After another wet season, the river and hill witnesses return with matching consent marks. The clinic council keeps the former director outside command, medicine stores are counted in both wards, and the Basin can explain which part of the old practice it retained."
chaosx.fallout.1027.partial.d: "The delayed review finds one ward still using the clinic's new consent marks while the other keeps its own witness book. The Basin has a working rule for the river road, but the hill council will reopen the question when it has enough medicine to hold another hearing."
chaosx.fallout.1027.failure.d: "The delayed review finds a missing witness, a broken archive key, and a clinic register written in three hands. Medicine reaches the wards through personal promises, while the old director's name has become a reason to close the doors."
chaosx.fallout.1027.a: "Close the trial record"
chaosx.fallout.1027.a.tt: "Apply the delayed witness result, record the final cause memory, release the ward and witness reservations, and close the Old Doctor's Trial chain."
