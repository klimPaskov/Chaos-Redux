l_english:
  chaosx.fallout.366.t: "The Reactor Without a Country"
  chaosx.fallout.366.d: "A cooling crew has kept a reactor alive inside a state that no council can defend. The control room still has power, but its records name three claimants and no trusted succession. The plant can become a shared utility, a military prize, an engineer protectorate, or a silent ruin."
  chaosx.fallout.366.a: "Create a joint authority"
  chaosx.fallout.366.a.tt: "Spend Power, Fuel, Medicine, and Recognition to place the reactor under a civilian and technical board. This improves supply and diplomacy while keeping every claimant at the table."
  chaosx.fallout.366.b: "Occupy the plant"
  chaosx.fallout.366.b.tt: "Spend Power, Fuel, and Cohesion to secure the reactor with troops. This protects the grid quickly and leaves a military memory in the state."
  chaosx.fallout.366.c: "Grant an engineer protectorate"
  chaosx.fallout.366.c.tt: "Spend Power, Fuel, and Recognition to give the cooling crew protected authority. This favors research and technical safety while narrowing public control."
  chaosx.fallout.366.d_option: "Shut it down permanently"
  chaosx.fallout.366.d_option.tt: "Spend Fuel, Power, and Recognition to drain and seal the core. This lowers exposure and protects future settlements, but the region loses a source of power."

  chaosx.fallout.368.t: "The reactor chooses a country"
  chaosx.fallout.368.joint_authority.success.d: "The three claimants signed one cooling schedule and accepted a public ledger. The reactor now feeds clinics and workshops without giving any faction a private switch. The first joint board has become a local successor institution."
  chaosx.fallout.368.joint_authority.partial.d: "The board agreed on pumps but not on who may enter the control room. Power reaches the nearest shelters in short bursts. The reactor remains shared in law and divided in practice."
  chaosx.fallout.368.joint_authority.failure.d: "The claimants fought over the emergency keys while the cooling water fell. The board collapsed before the first safe handover. The reactor state is more exposed, and every faction now keeps a separate evacuation list."
  chaosx.fallout.368.military_occupation.success.d: "The occupation secured the pumps, cleared the rival guards, and restored a guarded line to the grid. Soldiers now control the gates and the ration office. The plant is safe enough to serve the country, but its new order is unmistakably military."
  chaosx.fallout.368.military_occupation.partial.d: "The troops held the control room while two cooling shifts refused the chain of command. The reactor produces guarded power, yet every patrol consumes fuel that the grid cannot spare. The occupation has bought time rather than trust."
  chaosx.fallout.368.military_occupation.failure.d: "The occupation reached the plant after a valve seizure. The cooling crew scattered, the rival claimants armed their own escorts, and the reactor lost a repairable layer of protection. The army must explain why force arrived after the warning."
  chaosx.fallout.368.engineer_protectorate.success.d: "The cooling crew received a written mandate, a protected workshop, and authority to train replacements. They stabilized the core and published the first reliable load chart. The reactor serves the grid while its engineers become a new political class."
  chaosx.fallout.368.engineer_protectorate.partial.d: "The engineers kept the core below danger but reserved the best parts for their own service tunnels. Power improved, while the public ledger grew thinner. The protectorate works because no one else can yet replace it."
  chaosx.fallout.368.engineer_protectorate.failure.d: "The protected crew could not agree on the old control codes. A hurried bypass damaged the reactor network and forced a night evacuation. The engineers survived, but their promise of neutral safety is now a political accusation."
  chaosx.fallout.368.permanent_shutdown.success.d: "The crew drained the core, sealed the fuel hall, and marked every hot corridor. The state loses a future power source, yet its clinics can finally plan without a reactor alarm. The seal gives neighboring governments a reason to recognize the border."
  chaosx.fallout.368.permanent_shutdown.partial.d: "The core is cold, but the spent fuel vault still needs watch rotations. Exposure falls slowly and the region must import power for another winter. The shutdown protects the next settlement only if the guards keep their ledger."
  chaosx.fallout.368.permanent_shutdown.failure.d: "The shutdown team reached the final valve and found its manual missing. The plant was left in a dangerous low-output state, with fuel spent and no new authority. The reactor remains a prize that no claimant can safely claim."
  chaosx.fallout.368.a: "Wait for the plant report"
  chaosx.fallout.368.a.tt: "Keep the reactor chain open until the scheduled inspection confirms the result."

  chaosx.fallout.370.t: "The cooling ledger returns"
  chaosx.fallout.370.success.d: "The scheduled report includes a clean maintenance log, a trained replacement crew, and a signed map of the hot corridors. The reactor decision has outlived its first crisis and now shapes the country's next power bargain."
  chaosx.fallout.370.partial.d: "The report confirms a working pump and three unresolved alarms. The plant can continue, but every future shift needs a second witness and a spare route to the shelter. The reactor is useful because its limits are finally visible."
  chaosx.fallout.370.failure.d: "The report arrived with a broken seal and a missing page from the fuel ledger. Guards closed the plant while rival claimants spread different figures. The reactor is again without a trusted country, even if its flag still flies."
  chaosx.fallout.370.a: "Close the reactor ledger"
  chaosx.fallout.370.a.tt: "Resolve the inspection, record its result, and release every delayed receipt."

  fallout.event_log.reactor_without_a_country.name: "The Reactor Without a Country"
  fallout.event_log.reactor_without_a_country.detail: "[This.GetName] faced a reactor state with no trusted succession. The chosen policy changed power, exposure, diplomacy, and the local successor institution."
  fallout.event_log.reactor_without_a_country.joint_authority_success: "Established a successful joint reactor authority"
  fallout.event_log.reactor_without_a_country.joint_authority_partial: "Held the reactor under a divided joint authority"
  fallout.event_log.reactor_without_a_country.joint_authority_failure: "Lost the joint authority during reactor handover"
  fallout.event_log.reactor_without_a_country.military_occupation_success: "Secured the reactor through military occupation"
  fallout.event_log.reactor_without_a_country.military_occupation_partial: "Held the plant under an incomplete occupation"
  fallout.event_log.reactor_without_a_country.military_occupation_failure: "Failed to secure the reactor before the warning"
  fallout.event_log.reactor_without_a_country.engineer_protectorate_success: "Established an engineer protectorate"
  fallout.event_log.reactor_without_a_country.engineer_protectorate_partial: "Kept a reactor under a narrow engineer mandate"
  fallout.event_log.reactor_without_a_country.engineer_protectorate_failure: "Lost the engineer protectorate during the bypass"
  fallout.event_log.reactor_without_a_country.permanent_shutdown_success: "Sealed the reactor and secured recognition"
  fallout.event_log.reactor_without_a_country.permanent_shutdown_partial: "Partially sealed the reactor for a later watch"
  fallout.event_log.reactor_without_a_country.permanent_shutdown_failure: "Left the reactor in a dangerous low-output state"
  fallout.event_log.reactor_without_a_country.callback_success: "Received a clean reactor maintenance ledger"
  fallout.event_log.reactor_without_a_country.callback_partial: "Received a partial reactor maintenance report"
  fallout.event_log.reactor_without_a_country.callback_failure: "Closed the reactor after a broken ledger"
