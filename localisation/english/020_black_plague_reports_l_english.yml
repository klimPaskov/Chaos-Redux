l_english:
chaosx.nr20.2.t: "The Fever Has a Name"
chaosx.nr20.2.d: "The first basin has been identified as the source of the Black Plague. Hospitals, rail offices, and local authorities can no longer dismiss the pattern as an ordinary fever. The shared disease board now marks the crisis as public."
chaosx.nr20.2.a: "Open the ledgers."
chaosx.nr20.3.t: "The Warning Was Missed"
chaosx.nr20.3.d: "Surveillance failed to contain the first basin before the crisis became severe. The origin administration now has to respond in public, with mortality, flight, and supply disruption already moving faster than the old reports."
chaosx.nr20.3.a: "Bring every report forward."
chaosx.nr20.5.t: "The Plague Reaches Another Country"
chaosx.nr20.5.d: "The first Black Plague infection has been confirmed beyond the origin administration. A border, transport corridor, refugee route, or wartime movement has turned a local emergency into an international one."
chaosx.nr20.5.a: "Warn the neighbours."
chaosx.nr20.6.t: "A Severe Crisis"
chaosx.nr20.6.d: "A Black Plague state has crossed into Severe Crisis. Mortality, flight, and supply disruption are now reinforcing one another. The response will need more than warnings: hospitals, cordons, clean stores, and protected routes must work together."
chaosx.nr20.6.a: "The line must hold."
chaosx.nr20.7.t: "Containment Holds"
chaosx.nr20.7.d: "A plague state has entered Contained status. The disease is not gone, and neglect can still reopen the corridor, but treatment, movement control, and local administration have bent the outbreak away from collapse."
chaosx.nr20.7.a: "Keep the cordon staffed."
chaosx.nr20.8.t: "The Plague Returns"
chaosx.nr20.8.d: "A state once thought contained has relapsed into active infection. Residual burrows, exhausted personnel, and reopened roads have given the strain another path. Every cure must now be treated as a promise that still needs guarding."
chaosx.nr20.8.a: "Trace every route again."
chaosx.nr20.9.t: "A State Is Cured"
chaosx.nr20.9.d: "The first Black Plague state has reached Cured status. Its hospitals and streets are not restored overnight, and monitoring remains necessary, but the active disease has been driven out without an instant miracle."
chaosx.nr20.9.a: "Record the recovery."
chaosx.nr20.10.t: "Ten Million Dead"
chaosx.nr20.10.d: "The shared death ledger has crossed ten million Black Plague deaths. The figure is not an abstraction: it is the accumulated price of untreated states, broken corridors, war, flight, and the decisions that came too late. Chaos rises with the record."
chaosx.nr20.10.a: "Count every name."
chaosx.nr20.11.t: "The Black Plague Is Eradicated"
chaosx.nr20.11.d: "The last established Black Plague state has left the active ledger. Streets still bear the cost of the crisis, but no registered basin remains in an active disease phase. Recovery can begin without pretending the losses were undone."
chaosx.nr20.11.a: "Guard the recovery."
chaosx.nr20.12.t: "A Basin Has Collapsed"
chaosx.nr20.12.d: "A Black Plague state has entered Collapsed status. Hospitals are failing, local administration is breaking apart, and the remaining population is fleeing through every open corridor. The ledger now records devastation as part of the disease, not as a separate disaster."
chaosx.nr20.12.a: "Hold the ruins together."
chaosx.nr20.13.t: "Recovery Is a Campaign"
chaosx.nr20.13.d: "The first Black Plague state has entered Recovery. Active transmission is receding, but empty homes, damaged routes, and residual burrows can still reopen the crisis. Treatment, sanitation, and a guarded reopening must continue until Cured status is earned."
chaosx.nr20.13.a: "Rebuild under watch."
chaosx.nr20.14.t: "The Quiet Phase"
chaosx.nr20.14.d: "The Black Plague has entered an incubating state. The disease is present, but the public ledger has not yet caught up with the first hidden cases. Surveillance, sealed stores, and protected routes can still buy time before the state becomes openly infected."
chaosx.nr20.14.a: "Find the cases before they spread."
chaosx.nr20.21.t: "The Response Learns"
chaosx.nr20.21.d: "Your countermeasure programme has crossed its first serious threshold. The board now records a repeatable response: treatments, sealed stores, cordons, and transport controls can reinforce one another instead of arriving as isolated orders."
chaosx.nr20.21.a: "Make the lesson routine."
chaosx.nr20.20.t: "The Strain Grows Stronger"
chaosx.nr20.20.d: "The strain has adapted to crowded, underdeveloped, and weakly protected ground. Untreated corridors now punish delay more severely, and the mortality curve will rise faster wherever response capacity is exhausted."
chaosx.nr20.20.a: "Recheck every warning."
chaosx.nr20.30.t: "The Plague Crosses the Sea"
chaosx.nr20.30.d: "Ports, troop convoys, refugee routes, and wartime shipping can now carry the Black Plague beyond its mainland cradle. Overseas exposure will begin as a route problem before it becomes another established basin."
chaosx.nr20.30.a: "Seal the docks without delay."
chaosx.nr20.31.t: "The First Overseas Infection"
chaosx.nr20.31.d: "The Black Plague has been established across an overseas route. A port, convoy, or ship contact has carried more than cargo: the disease now has a second geography and a new set of corridors to watch."
chaosx.nr20.31.a: "Warn every harbour."
chaosx.nr20.40.t: "The Warrens Raise a Flag"
chaosx.nr20.40.d: "Collapsed plague basins have begun to organize as a Rat Nation. Its armies grow through brood pulses rather than human manpower or ordinary equipment, and every occupied state becomes a new infection corridor."
chaosx.nr20.40.a: "The map has acquired a new enemy."
chaosx.nr20.41.t: "The Rats Take the Surface"
chaosx.nr20.41.d: "Independent broods now control a plague state. Their black-marked territory is no longer only a health emergency: it is an armed occupation with its own food stores, tunnels, and infection pressure."
chaosx.nr20.41.a: "Hold the liberated line."
chaosx.nr20.43.t: "A Brood Is Absorbed"
chaosx.nr20.43.d: "The stronger Rat Nation has absorbed a weaker brood. Surviving units and tunnel knowledge have been folded into one capped force pool, leaving the human world with fewer enemies but a more coherent one."
chaosx.nr20.43.d.distributed: "The stronger brood has absorbed a weaker warren through shared signals. Surviving units and tunnel knowledge are being divided across several nests, making the carrier harder to decapitate while widening the network that must be watched."
chaosx.nr20.43.d.dominant: "The stronger brood has absorbed a weaker warren beneath one command voice. Its surviving units and tunnel knowledge now reinforce an alpha route, making the carrier faster to direct and more dangerous wherever its single order reaches."
chaosx.nr20.43.d.emergent: "The stronger brood has absorbed a weaker warren by reading its routes. Surviving units and tunnel knowledge have become another map in the carrier's memory, turning rail yards, ports, and supply lines into a more deliberate infection network."
chaosx.nr20.43.a: "Do not let them consolidate."
chaosx.nr20.44.t: "Rat Resurgence"
chaosx.nr20.44.d: "A human-controlled state has been re-infected through rat occupation pressure. The rats did not need a new country to return: a burrow, a convoy, and a moment of neglect were enough to reopen the route."
chaosx.nr20.44.a: "Rebuild the cordon."
chaosx.nr20.45.t: "The Brood Finds an Order"
chaosx.nr20.45.d: "The surviving warrens have chosen a hierarchy. Some voices share the burden, one voice may command the whole, or the marks of transport and memory may guide the brood. The choice now shapes its pulses, force ceiling, and claim to royal succession."
chaosx.nr20.45.d.distributed: "The surviving warrens have chosen many mouths and one signal. No single nest owns the whole brood; shared routes and distributed stores will make the carrier harder to decapitate, even as every new nest makes the signal harder to keep coherent."
chaosx.nr20.45.d.dominant: "The surviving warrens have chosen one command voice. A dominant brood can gather mass and force behind an alpha route, but every hunger crisis and every broken order will now strike at the carrier's single point of command."
chaosx.nr20.45.d.emergent: "The surviving warrens have chosen the marks of memory. Routes, ports, and captured signals will guide the brood beyond instinct, opening a colder intelligence that can turn human logistics against the surface."
chaosx.nr20.45.a: "The order will be remembered."
chaosx.nr20.46.t: "The Brood Is Hungry"
chaosx.nr20.46.d: "Stores have thinned across the warren, and the surviving bodies are no longer moving to one rhythm. The carrier can ration its growth and restore a common command, or it can strip a controlled district for immediate mass and leave the ground more ruined than before."
chaosx.nr20.46.a: "Ration the Nest"
chaosx.nr20.46.b: "Break the Granaries"
chaosx.nr20.47.t: "The Brood Chooses a Method"
chaosx.nr20.47.d: "The carrier has learned to choose how it will fight. Its surviving warrens have no court and no human quartermaster, but their first method will decide which pressure the next pulse carries."
chaosx.nr20.47.d.flood_front: "The warrens will become a flood. Every opening in the line is an invitation, and the brood will trade hunger for the mass needed to keep pressure on several fronts at once."
chaosx.nr20.47.d.break_strongpoints: "The warrens have studied the hard places. They will spend their bodies against walls, rail junctions, and fortified blocks until a single breach makes the rest of the line irrelevant."
chaosx.nr20.47.d.hunt_roads: "The roads are the brood's weapon. It will follow convoys, refugee trains, and returning units rather than waste its strength on a fixed front."
chaosx.nr20.47.d.hold_nest: "The brood will hold its nest. A defended warren can wait out a human offensive, preserve its signal, and let the next pulse arrive with more of its command still intact."
chaosx.nr20.47.a.flood_front: "Open every breach"
chaosx.nr20.47.a.break_strongpoints: "Break the hard places"
chaosx.nr20.47.a.hunt_roads: "Follow the roads"
chaosx.nr20.47.a.hold_nest: "Hold the nest"
chaosx.nr20.48.t: "The Brood Rewrites Itself"
chaosx.nr20.48.d: "The first mutation route has settled into the carrier's living rhythm. The warrens can multiply, grow larger bodies, or turn every tunnel into a weapon."
chaosx.nr20.48.d.mass_swarm: "The brood has chosen numbers. It will spend the next stores on a wider pulse, accepting a sharper hunger in exchange for a crowd that can appear wherever the line is weakest."
chaosx.nr20.48.d.giant_mutation: "The brood has chosen size. Larger bodies are slower to replace, but the pattern of their movement is beginning to look like a thought rather than a reflex."
chaosx.nr20.48.d.burrow_warfare: "The brood has chosen the ground beneath the ground. A rail bed, cellar, or sewer is now part of the front, and the carrier's coherence will survive attacks that never find the nest."
chaosx.nr20.48.a.mass_swarm: "Raise the swarm"
chaosx.nr20.48.a.giant_mutation: "Feed the giants"
chaosx.nr20.48.a.burrow_warfare: "Make every tunnel a front"
chaosx.nr20.49.t: "The Basin Sets Its Law"
chaosx.nr20.49.d: "The carrier has reached the first decision about what a captured basin is for. It can preserve the territory that feeds it, or turn the state itself into a store of mass and ruin."
chaosx.nr20.49.d.preserve_herd: "The warrens will preserve the herd. A living surface keeps the pulse coherent and leaves more food, routes, and hiding places for the next generation."
chaosx.nr20.49.d.consume_state: "The warrens will consume the state. The next meal will be immediate, but the streets, stores, and surviving population will be poorer when the brood moves on."
chaosx.nr20.49.a.preserve_herd: "Preserve the living ground"
chaosx.nr20.49.a.consume_state: "Consume the captured state"
chaosx.nr20.50.t: "The Rat King Wakes"
chaosx.nr20.50.d: "A separate royal basin has produced a sentient Rat King. The crown can remember routes, direct advanced broods, and turn scattered infestations into a government with a court, a hunger, and a claim on the surface."
chaosx.nr20.50.a: "The crown is real."
chaosx.nr20.51.t: "The Rat King Is Crowned"
chaosx.nr20.51.d: "The royal basin has accepted a sentient ruler. The Rat King now governs a separate court, directs advanced broods, and inherits the memory of the first warrens without erasing the surviving Rat Nation."
chaosx.nr20.51.d.absolute_crown: "The royal basin has accepted an absolute crown. The King will gather every surviving warren behind one command, turn the tithe into law, and measure the surface by what the court can seize and hold."
chaosx.nr20.51.d.brood_council: "The royal basin has accepted a council of burrows. The King will rule through charters, shared stores, and rival voices, trading the speed of one command for a network that can survive the loss of any single nest."
chaosx.nr20.51.d.breath_hierophancy: "The royal basin has accepted a Black-Breath hierophant. The King will make plague memory a rite, reading routes and corpses as scripture while sentience, doctrine, and contagion become one instrument of rule."
chaosx.nr20.51.a: "Watch the royal basin."
chaosx.nr20.52.t: "Coronation of the Royal Basin"
chaosx.nr20.52.d: "A crown has become a government. The royal court's first broadcast is carried through plague corridors and intercepted in human capitals as the Rat King turns survival into a claim of sovereignty."
chaosx.nr20.52.a: "The crown has entered the world."
chaosx.nr20.53.t: "The Crown Is Disputed"
chaosx.nr20.53.d: "Hunger has outrun cohesion in the royal basin. Court factions are testing the King's authority, and the next decisions must balance royal memory, brood loyalty, and the food routes that keep the crown alive."
chaosx.nr20.53.a: "Hold the court together."
chaosx.nr20.54.t: "The Royal Node Is Broken"
chaosx.nr20.54.d: "A coordinated strike has broken a royal node before the King could harden it. The infestation retreats, Dominion falls, and the next royal pulse will arrive late."
chaosx.nr20.54.a: "Keep the breach open."
chaosx.nr20.55.t: "The Royal Node Strikes Back"
chaosx.nr20.55.d: "The assault met a prepared brood and failed. The King has learned the shape of the attack, and the failed strike has fed both royal hunger and terminal preparation."
chaosx.nr20.55.a: "Pay for the failure."
chaosx.nr20.56.t: "The Countermeasure Drive Stalls"
chaosx.nr20.56.d: "The emergency drive ran out of time before the severe crisis could be turned. Stores were spent without a finished programme, and infected corridors now carry the cost of the delay."
chaosx.nr20.56.a: "Restart the work with discipline."
chaosx.nr20.57.t: "The Tithe Fails"
chaosx.nr20.57.d: "The Crown's tribute has failed to arrive. The court can replace the warden and rebuild its command chain, or exact a harsher tithe from the warrens."
chaosx.nr20.57.d.brittle: "The Crown's brittle command has cracked under a second failure. The court can replace the warden and rebuild its command chain, or exact a harsher tithe from the warrens."
chaosx.nr20.57.a: "Replace the failed warden."
chaosx.nr20.57.b: "Exact the missing tribute."
chaosx.nr20.58.t: "The Warrens Refuse the Ledger"
chaosx.nr20.58.d: "The Council's ledger no longer binds every brood. The court can honor its charter and restore cohesion, or appoint an emergency speaker at the cost of trust."
chaosx.nr20.58.a: "Honor the charter."
chaosx.nr20.58.b: "Appoint an emergency speaker."
chaosx.nr20.59.t: "Ash Beneath the Throne"
chaosx.nr20.59.d: "The Hierophancy's reliquaries are emptying while the human response learns the shape of the plague. The court can consume another prepared city or seal the route and accept less dominion."
chaosx.nr20.59.a: "Consume another prepared city."
chaosx.nr20.59.b: "Seal the reliquaries."
chaosx.nr20.60.t: "Evolution V Is Earned"
chaosx.nr20.60.d: "The Rat King has met the final conditions: catastrophic deaths, sufficient conquest, a completed royal route, and the required continental control. Evolution V has opened the terminal route; the court must still issue the final order before the world can be taken."
chaosx.nr20.60.a: "Begin the final design."
chaosx.nr20.61.t: "A Continent Is Selected"
chaosx.nr20.61.d: "The royal court has selected [GetBlackPlagueRatKingTargetContinentName]. Its capitals, refuge nodes, and surviving infrastructure will carry the final campaign. Every remaining operation is now measured against that chosen geography."
chaosx.nr20.61.a: "Mark the route."
chaosx.nr20.62.t: "The Continent Is Crowned"
chaosx.nr20.62.d: "The Rat King controls the required continental threshold. Capitals and refuge nodes have been claimed, and the human administrations on that continent can no longer restore an independent line."
chaosx.nr20.62.a: "The crown crosses the last border."
chaosx.nr20.63.t: "The Kingdom of Teeth Advances"
chaosx.nr20.63.d: "The terminal campaign has begun. The Rat King will take the remaining human states by a deterministic sequence, ending the Black Plague crisis as a world governed from the Royal Basin."
chaosx.nr20.63.a: "There is no neutral ground left."
chaosx.nr20.70.t: "The Rat Nation Is Defeated"
chaosx.nr20.70.d: "The independent Rat Nation no longer controls a plague state. Its remaining broods have scattered or been destroyed, and the human front has won a local victory without making the wider Black Plague harmless."
chaosx.nr20.70.a: "Secure every burrow."
chaosx.nr20.71.t: "The Rat King Is Defeated"
chaosx.nr20.71.d: "The Royal Basin has lost its last controlled state after pressure from [GetBlackPlagueRatKingDefeatActorName]. The crown's armies no longer hold the surface, but abandoned tunnels and surviving plague records leave a dangerous reconstruction ahead."
chaosx.nr20.71.a: "Search the ruins."
chaosx.nr20.72.t: "Recovery Becomes Reconstruction"
chaosx.nr20.72.d: "The surviving states are moving from emergency cure work into reconstruction. Hospitals, roads, food stores, and records must be rebuilt together or the next crisis will inherit the same empty corridors left by the Royal Basin's fall."
chaosx.nr20.72.a: "Rebuild with memory."
chaosx.nr20.90.t: "Black Plague Unbound"
chaosx.nr20.90.d: "Across [?global.black_plague_scenario_selected_continents|0] continents, established Black Plague basins have awakened at once. The launch registered [?global.black_plague_established_state_count|0] established states against a target of [?global.black_plague_scenario_established_target|0], [?global.black_plague_scenario_internal_broods_created|0] internal RTA brood basins, and [?global.black_plague_scenario_king_states_transferred|0] states in a separate RTX Royal Basin. Evolutions I through IV are active; the two-tag package is complete, while Evolution V and world end still require their earned route. The ordinary disease board, response decisions, map overlays, and terminal gates remain live."
chaosx.nr20.90.d.low: "Across [?global.black_plague_scenario_selected_continents|0] continents, a limited wave of established Black Plague basins has awakened together. [?global.black_plague_established_state_count|0] states are already carrying the fever, while [?global.black_plague_scenario_internal_broods_created|0] hidden warrens move beneath the surface and [?global.black_plague_scenario_king_states_transferred|0] states answer to a separate royal basin. The first four mutations are active, but the final crown still has to earn its road."
chaosx.nr20.90.d.medium: "Across [?global.black_plague_scenario_selected_continents|0] continents, established Black Plague basins have awakened in a broad regional wave. [?global.black_plague_established_state_count|0] states are already infected, [?global.black_plague_scenario_internal_broods_created|0] internal warrens are gathering under RTA, and [?global.black_plague_scenario_king_states_transferred|0] states have been drawn into the separate RTX Royal Basin. The first four mutations are active, leaving every government a narrow window to protect roads, ports, and food stores."
chaosx.nr20.90.d.high: "Across [?global.black_plague_scenario_selected_continents|0] continents, the Black Plague has opened several fronts at once. [?global.black_plague_established_state_count|0] established states are burning through their stores, [?global.black_plague_scenario_internal_broods_created|0] RTA warrens are feeding on the collapse, and [?global.black_plague_scenario_king_states_transferred|0] states have been drawn into a separate RTX Royal Basin. The first four mutations are active, so every port, rail line, and refuge now matters."
chaosx.nr20.90.d.maximum: "Every eligible inhabited continent has become part of the same Black Plague season. [?global.black_plague_established_state_count|0] established states, [?global.black_plague_scenario_internal_broods_created|0] RTA warrens, and [?global.black_plague_scenario_king_states_transferred|0] states in a separate RTX Royal Basin now share one widening crisis. The first four mutations are already present. Humanity still has a route to resist the final crown, but it must be built while the world is infected."
chaosx.nr20.90.a: "Open the Black Plague board."
chaosx.nr20.64.t: "The Crown Is Broken"
chaosx.nr20.64.d: "The sovereign basin has fallen to a human army before the Rat King could harden the terminal route. Dominion and Cohesion have been shaken, but the Black Plague remains in every surviving state."
chaosx.nr20.64.a: "Hold the basin."
chaosx.nr20.65.t: "The Deep Roads Close"
chaosx.nr20.65.d: "The assault failed to take the Royal Basin before the deadline. The Rat King has sealed the approaches, demanded another tithe, and pushed the terminal preparation closer to completion."
chaosx.nr20.65.a: "Withdraw and regroup."
chaosx.nr20.66.t: "The Line Holds"
chaosx.nr20.66.d: "A human last-response operation has held an established Black Plague state through the Rat King's terminal preparations. The delay has bought countermeasure time and a little more containment, but it has not cured the disease or closed the route."
chaosx.nr20.66.a: "Keep the teams moving."
chaosx.nr20.67.t: "The Line Breaks"
chaosx.nr20.67.d: "The last-response line expired before its human teams could establish enough control. The Rat King has gained pressure and hunger, and fresh exposure is moving through the established states that remain in human hands."
chaosx.nr20.67.a: "Fall back behind the next cordon."
chaosx.nr20.68.t: "The Refuge Endures"
chaosx.nr20.68.d: "A held capital, refuge node, or city has survived the full last-response operation. The protected ground has bought a deeper delay and improved the countermeasure effort, but the terminal route remains earned and active."
chaosx.nr20.68.a: "Guard the refuge."
chaosx.nr20.69.t: "The Refuge Falls"
chaosx.nr20.69.d: "The protected refuge could not be held through the last-response window. The Rat King has gained a larger share of terminal pressure and hunger, while the remaining human basin faces renewed exposure."
chaosx.nr20.69.a: "Save whoever can still move."
chaosx.nr20.73.t: "After the Crown Falls"
chaosx.nr20.73.d: "The Royal Basin is no longer governed by the Rat King. Its sealed warrens, ruined archives, and plague stores remain active hazards, and each former royal node must be secured without pretending the wider disease has vanished. The surviving records can be carried into the shared countermeasure programme, if they are preserved rather than buried."
chaosx.nr20.73.a: "Seal the warrens."
chaosx.nr20.73.b: "Preserve the royal records for countermeasures."
chaosx.nr20.74.t: "A Royal Burrow Is Sealed"
chaosx.nr20.74.d: "The surface teams have collapsed one royal burrow and recorded the remaining tunnels. More former nodes can be secured, or the campaign can close while the surviving Black Plague states remain under ordinary containment."
chaosx.nr20.74.a: "Continue the sealing work."
chaosx.nr20.74.b: "Close the royal operation."
chaosx.nr20.75.t: "The Burrow Breaks Open"
chaosx.nr20.75.d: "The sealing teams missed their deadline. A former royal site has spilled vermin and contaminated stores into the surrounding state, raising the cost of every later cleanup operation."
chaosx.nr20.75.a: "Renew the operation."
chaosx.nr20.75.b: "Abandon this line."
chaosx.nr20.76.t: "The Royal Strike Arrives"
chaosx.nr20.76.d: "The Rat King's operation has reached [black_plague_royal_strike_state.GetName]. The first pressure wave has reopened the Black Plague ledger in the selected state; hospitals, stores, and transport routes now have to answer an enemy that can choose where the next basin begins."
chaosx.nr20.76.a: "Raise the cordon."
chaosx.nr20.77.t: "The Court Chooses Its Voice"
chaosx.nr20.77.d: "The Rat King has named a government route, but the route is still only a promise. The first decree will decide which royal meter answers the court's identity and which cost the crown accepts before the next pulse."
chaosx.nr20.77.d.absolute_crown: "The Absolute Crown will make Dominion the measure of obedience. The first decree gathers the surface behind one command, but the court must spend hunger to make that command immediate."
chaosx.nr20.77.d.brood_council: "The Council of Burrows will make Cohesion the measure of legitimacy. Its first charter gives rival warrens a shared rhythm and lets Sentience grow through argument rather than one voice."
chaosx.nr20.77.d.breath_hierophancy: "The Black-Breath Hierophancy will make Sentience the measure of revelation. Its first liturgy opens the King's memory, but the rite consumes hunger as the court turns plague into doctrine."
chaosx.nr20.77.a.absolute_crown: "Issue the royal decree"
chaosx.nr20.77.a.brood_council: "Seal the shared charter"
chaosx.nr20.77.a.breath_hierophancy: "Read the black breath"
chaosx.nr20.78.t: "The Brood's Route Takes Shape"
chaosx.nr20.78.d: "The carrier has completed a route operation, and the warrens are already moving to make it part of their living map."
chaosx.nr20.78.d.citadel_stockpile: "The nest has turned captured stores into a citadel reserve. More bodies can be held behind the warren's hard edge while the surface searches for an opening."
chaosx.nr20.78.d.migration_lanes: "The brood has opened migration lanes between its nests. Food, bodies, and signals can now move along paths that were empty at the last pulse."
chaosx.nr20.78.d.tide_manifest: "The tide has found the docks. Cargo holds, tide pipes, and abandoned wharves now carry the brood's movement beyond the basin that first fed it."
chaosx.nr20.78.d.rail_breach: "The rail breach order has gone out. Warrens are following the steel lines toward depots and fronts, turning transport schedules into another battlefield."
chaosx.nr20.78.d.distributed_nests: "Signals have been divided across several nests. The carrier can survive the loss of one mouth, though every added relay makes the shared rhythm harder to keep."
chaosx.nr20.78.d.dominant_alpha: "An alpha pattern now directs the brood. The carrier can gather mass behind one command, but hunger will sharpen whenever that command demands too much."
chaosx.nr20.78.d.emergent_route_memory: "The brood has read a human route and folded it into its memory. A road, depot, or convoy now carries a danger that the surface cannot see from the map alone."
chaosx.nr20.78.a: "Let the route run."
chaosx.nr20.79.t: "The Royal Court's Policy Takes Shape"
chaosx.nr20.79.d: "The Rat King's court has completed a policy operation. Its chosen government is beginning to shape how the royal basin feeds, remembers, and commands."
chaosx.nr20.79.d.crown_tithe: "The Crown's tithe has been gathered from the warrens. Dominion has become food and reserve for the royal command, and every nest now knows where the court expects its share."
chaosx.nr20.79.d.council_audit: "The Council has opened its ledgers. Rival warrens are sharing stores and signals, trading the King's certainty for a court that can survive disagreement."
chaosx.nr20.79.d.hierophant_broadcast: "The Hierophant's broadcast has passed through the plague corridors. Royal memory is becoming doctrine, and the court is drawing nearer to the omen it has chosen to read."
chaosx.nr20.79.a: "Record the policy."
chaosx.nr20.80.t: "Name the World Prey"
chaosx.nr20.80.d: "The royal maps are finally specific. The court may choose one living continent for the terminal campaign; once marked, its control ratio, capitals, and refuge nodes will be the only geography that can open Evolution V. The choice consumes Dominion and Sentience and cannot be changed without breaking the route."
chaosx.nr20.80.a.europe: "Mark Europe"
chaosx.nr20.80.a.asia: "Mark Asia"
chaosx.nr20.80.a.africa: "Mark Africa"
chaosx.nr20.80.a.north_america: "Mark North America"
chaosx.nr20.80.a.south_america: "Mark South America"
chaosx.nr20.80.a.australia: "Mark Australia"
chaosx.nr20.81.t: "The Continent Is Crowned"
chaosx.nr20.81.d: "The Rat King has held [GetBlackPlagueRatKingTargetContinentName] through the full crown campaign. Its surviving capitals and refuge nodes answer to the Royal Basin, and the terminal route now has a geography that cannot be mistaken for a lucky ratio elsewhere."
chaosx.nr20.81.a: "Raise the final standard."
chaosx.nr20.82.t: "The Crown Campaign Breaks"
chaosx.nr20.82.d: "The Rat King's hold on [GetBlackPlagueRatKingTargetContinentName] failed before the crown could be installed. Dominion and terminal preparation have been lost, hunger has risen in the royal basin, and the court must rebuild the campaign after the cooldown."
chaosx.nr20.82.a: "Rebuild the route."
