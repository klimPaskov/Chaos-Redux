famine_profile_mode_memory: "Historical Memory"
famine_profile_mode_window: "Historical-Window Crisis"
famine_profile_mode_analogue: "Policy Analogue"
famine_profile_mode_regional: "Dynamic Regional Profile"
famine_break_the_blockade_NAME: "Break the Blockade"
famine_break_the_blockade_DESC: "Restore relief to a blockaded island famine and preserve its threatened population."
famine_break_the_blockade_tooltip: "Face a wartime island blockade famine, restore a valid relief route, recover below famine, and preserve at least 70% of the threatened population. Forced removal, predatory requisition, concealed mass mortality, wasteland conversion, or deliberately creating the route crisis disqualifies the attempt."
famine_bread_across_the_front_NAME: "Bread Across the Front"
famine_bread_across_the_front_DESC: "Hold a humanitarian corridor until relief resolves a famine or trapped-population crisis."
famine_bread_across_the_front_tooltip: "Open a proven corridor across an active front, hold it for 60 days, and move the target below famine or trapped status. Attacking the protected corridor or deliberately manufacturing its crisis disqualifies the attempt."
famine_the_grain_stayed_home_NAME: "The Grain Stayed Home"
famine_the_grain_stayed_home_DESC: "Suspend extraction during a real shortage and preserve national survival through other logistics."
famine_the_grain_stayed_home_tooltip: "Face an acute crop or transport shock while extraction is active, suspend extraction before catastrophic famine, prove an alternative logistical solution, and recover the state. Requisitioning another strained state disqualifies the attempt."
famine_report_generic: "Famine Report"
famine_report_generic_summary: "Civilian food access has broken down. Restore production, transport, reserves, and relief before prolonged exposure becomes lethal."
famine_report_island_blockade: "Blockaded Island"
famine_report_island_blockade_summary: "War and maritime isolation have cut a dependent island from adequate supply. Reopen a proven port and relief route before reserves fail."
famine_report_relief_arrival: "Relief Arrives"
famine_report_relief_arrival_summary: "Food and transport have reached the affected population. Protect the route and continue distribution until the severe stages recede."
famine_condemnation_deliberate_starvation: "Deliberate Starvation"
famine_condemnation_deliberate_starvation_desc: "Food was extracted or withheld while civilians faced a proven hunger crisis."
famine_condemnation_relief_obstruction: "Obstruction of Civilian Relief"
famine_condemnation_relief_obstruction_desc: "Verified food, medical aid, or evacuation access was blocked despite a viable relief route."
famine_condemnation_concealment: "Concealment of Civilian Harm"
famine_condemnation_concealment_desc: "Mortality reports, relief records, or evidence of forced movement were suppressed or destroyed."
