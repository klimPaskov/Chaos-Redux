l_english:
famine_decision_category: "Famine"
famine_decision_category_desc: "[GetFamineCategoryPhase]\nFood Security: [GetFamineNationalFoodStage]\nFood Reserves: [GetFamineReserveSummary]\nRelief Access: [GetFamineReliefAccess]\nCurrent priority: [GetFaminePriorityResponse]"
famine_category_phase_emerging: "Food access has become a sustained national problem. Mobilize reserves, transport, and relief before the shortage becomes lethal."
famine_category_phase_active: "A severe food-security crisis requires active relief, reserve management, or evacuation."
famine_category_phase_resolution: "The lethal stage has eased. Keep relief access and reserves stable until recovery is secure."
famine_category_phase_dormant: "No material food-security problem currently requires national management."
famine_reserve_summary_critical: "§RCritical§!"
famine_reserve_summary_low: "§OLow§!"
famine_reserve_summary_working: "§YWorking Stocks§!"
famine_reserve_summary_untracked: "No Reserves Recorded"
famine_relief_access_open: "§GOpen§!"
famine_relief_access_blocked: "§RBlocked§!"
famine_relief_access_not_required: "Not Required"
famine_food_stage_stable: "§GStable§!"
famine_food_stage_supply_strain: "§YSupply Strain§!"
famine_food_stage_acute_shortage: "§OAcute Shortage§!"
famine_food_stage_famine: "§RFamine§!"
famine_food_stage_catastrophic: "§tCatastrophic Famine§!"
famine_priority_response_catastrophic: "Prevent further deaths: establish a proven relief route or move civilians through a safe, accepted route."
famine_priority_response_famine: "Restore access and reserve deliveries before the mortality interval repeats."
famine_priority_response_acute: "Repair transport, secure imports, or ration proven reserves before famine begins."
famine_priority_response_strain: "Build reserve headroom and remove the strongest food-pressure source."
famine_priority_response_stable: "No deadly food crisis is active. Maintain reserve headroom and reliable relief access."
famine_mission_secure_relief_route: "Secure the Relief Route"
famine_mission_secure_relief_route_desc: "Keep an affected state connected to a usable railway, port, or land corridor until emergency deliveries can proceed."
famine_mission_secure_relief_route_success: "The relief route remained open through the emergency period."
famine_mission_secure_relief_route_failure: "The route failed before reliable deliveries could reach the affected population."
famine_release_reserves: "Release Reserves to [FROM.GetName]"
famine_release_reserves_desc: "Redirect food stores and support equipment to rationing authorities in [FROM.GetName]. Rationed food keeps feeding people longer than stock left in depots during a shortage, at the cost of political power, support equipment, and transport fuel."
famine_emergency_imports: "Secure Emergency Food Imports for [FROM.GetName]"
famine_emergency_imports_desc: "Arrange food for [FROM.GetName] from a foreign donor and bring it overland. Delivery fails if the route closes, the donor runs short, or local stores cannot hold the shipment."
famine_repair_relief_route: "Repair the Relief Route to [FROM.GetName]"
famine_repair_relief_route_desc: "Commit trains and fuel to restore the railway, hub, or corridor serving [FROM.GetName]. A working route will reduce food pressure and improve later relief operations."
famine_escorted_relief_convoy: "Escort Relief to [FROM.GetName]"
famine_escorted_relief_convoy_desc: "Escort a food shipment from the selected foreign donor through the blockade around [FROM.GetName]. The donor, both ports, and the sea route must remain available until the convoy arrives."
famine_emergency_airlift: "Airlift Relief into [FROM.GetName]"
famine_emergency_airlift_desc: "Commit five transport aircraft, fuel, and air experience to fly food from the selected foreign donor into [FROM.GetName]. The donor and both airfields must remain available until the shipment arrives."
famine_evacuation: "Evacuate Civilians from [FROM.GetName]"
famine_evacuation_desc: "Move civilians from [FROM.GetName] to a safe receiving state. The people who survive the journey settle at their destination, while any deaths along the route are recorded separately."
famine_requisition_safer_state: "Requisition Food for [FROM.GetName]"
famine_requisition_safer_state_desc: "Draw food from a safe neighboring state and send it to [FROM.GetName]. The target receives relief, but the donor state assumes new pressure and political grievance."
famine_conceal_crisis: "Conceal the Crisis in [FROM.GetName]"
famine_conceal_crisis_desc: "Suppress shortage and mortality reports from [FROM.GetName]. For [?constant:famine_national_crisis.conceal_days|0] days the hunger there stops weighing on the nation, but food grows scarcer and the first deaths will be condemned as a cover-up."
famine_maintain_extraction: "Maintain Extraction from [FROM.GetName]"
famine_maintain_extraction_desc: "Keep military and national supply priorities ahead of civilian need in [FROM.GetName]. The state continues feeding the war effort as famine pressure, resistance, and responsibility rise."
famine_airlift_planes_requirement_tt: "Requires and consumes £GFX_unit_transport_plane_icon_small §Y[?humanitarian_cost_quote_transport_planes|.0]§!."
