famine_state_supply_strain: "Supply Strain"
famine_state_supply_strain_desc: "Food still reaches this state, but damaged production or distribution is narrowing the margin of safety. Restored routes and early relief can prevent an acute shortage."
famine_state_acute_shortage: "Acute Shortage"
famine_state_acute_shortage_desc: "Food access is failing across this state. Production, transport, extraction, environmental damage, or weak administration may push it into famine unless relief arrives."
famine_state_famine: "Famine"
famine_state_famine_desc: "Sustained hunger is causing recurring civilian deaths, population flight, and production loss. Mortality continues until food pressure falls and recovery persists."
famine_state_catastrophic_famine: "Catastrophic Famine"
famine_state_catastrophic_famine_desc: "Food access has collapsed. Civilian mortality, depopulation, and political opposition will remain severe until major relief or evacuation restores a viable route."
famine_national_food_crisis: "Food Crisis"
famine_national_food_crisis_desc: "Hunger in our provinces is public knowledge. Every state in acute shortage or famine erodes confidence in the government and the war effort until food reaches it."
famine_profile_none: "No Historical Profile"
famine_profile_soviet_1932_memory: "Soviet Famine Memory and Reactivation"
famine_profile_china_henan_1942: "Henan Wartime Famine"
famine_profile_china_policy_famine: "Over-Procurement and False Reporting"
