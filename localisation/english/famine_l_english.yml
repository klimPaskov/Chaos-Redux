famine_profile_ireland_memory: "Irish Famine and Diaspora Memory"
famine_profile_brazil_ceara: "Northeast Brazil Drought and Retirantes"
famine_profile_congo_interaction: "Congo Conflict, Labor, and Hunger"
famine_profile_ethiopia_policy: "Ethiopian Concealment and Resettlement Analogue"
