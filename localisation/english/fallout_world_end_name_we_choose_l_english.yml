chaosx.fallout.873.t: "The Name We Choose"
chaosx.fallout.873.opening.d: "In the Congo Green Basin, the river council calls a night assembly after the first ash week. The old district name survives on a cracked sign, but children and ferrymen use another name at the water pumps. The council must decide whether this polity speaks through a local name, carries its old nationality, rejects every outside biological label, or grounds its public life in a religious identity."
chaosx.fallout.873.a: "Choose the river name"
chaosx.fallout.873.a.tt: "Spend Food 3, Medicine 1, and Recognition 3 to register a local civic name, teach it at the pumps, and open a public identity charter."
chaosx.fallout.873.b: "Carry the old nationality"
chaosx.fallout.873.b.tt: "Spend Scrap 2, Power 3, and Recognition 3 to preserve the pre-Fallout nationality in records while the Basin negotiates inherited obligations."
chaosx.fallout.873.c: "Reject the biological label"
chaosx.fallout.873.c.tt: "Spend Fuel 4 and Recognition 2, then accept a Cohesion cost, to refuse an outside body-based label and define citizenship through conduct."
chaosx.fallout.873.d: "Take a religious identity"
chaosx.fallout.873.d.tt: "Spend Food 2, Medicine 3, Fuel 2, and Recognition 2 to build a sacred public name with a recorded service rule for every district."
chaosx.fallout.874.t: "The Name We Choose"
chaosx.fallout.875.t: "A Basin Names Itself"
chaosx.fallout.875.local_identity.success.d: "The council chose the river name and painted it above the water pumps. Basin schools, ferrymen, and the nearest foreign clerk now use the same civic term, giving an altered community a public identity that belongs to its own streets."
chaosx.fallout.875.local_identity.partial.d: "The river name reached the pump houses and two district ledgers. The eastern shore still uses the cracked sign, but the council has a word that can be carried without borrowing an old capital's authority."
chaosx.fallout.875.local_identity.failure.d: "The local name broke into three spellings before the first register closed. The council kept its meeting, but each district now sends a different answer when a neighboring government asks who speaks for the Basin."
chaosx.fallout.875.old_nationality.success.d: "The council restored the old nationality on its ledgers, then added a Basin clause that limits inherited debts and military claims. The neighboring archive accepts the clause, so continuity becomes a negotiated tool rather than a demand for the past to return."
chaosx.fallout.875.old_nationality.partial.d: "The old nationality survives in seals and radio calls, while the council refuses to restore every former office. The Basin can claim continuity at a border desk, but young ferrymen still ask whether the name describes them."
chaosx.fallout.875.old_nationality.failure.d: "The old nationality reopened disputes over taxes, conscription, and a vanished capital. The council tore the first register in half, leaving the Basin with a remembered country and no agreed promise attached to it."
chaosx.fallout.875.biological_label.success.d: "The assembly rejected the outside body label in a public vote. Its charter names residents by conduct, service, and consent, while the Basin clinic records care without turning an altered life into a diagnosis."
chaosx.fallout.875.biological_label.partial.d: "The council refused the label and wrote a civic alternative, but two clinics keep the old forms for lack of paper. The new identity has a public voice, though every intake desk must learn to use it."
chaosx.fallout.875.biological_label.failure.d: "The label returned on imported forms and trade permits. The council's refusal became a quarrel between clinic clerks and ward captains, with neither side willing to sign a register that names the other."
chaosx.fallout.875.religious_identity.success.d: "The Basin chose a religious name tied to river service, burial duty, and shared stores. The rite stays open to every resident, and the neighboring government records a polity whose public authority comes from service rather than blood."
chaosx.fallout.875.religious_identity.partial.d: "The sacred name carries through the western wards and the night ferries. The eastern council accepts the service rule but not the rite, leaving one polity with two ways to explain why its people belong together."
chaosx.fallout.875.religious_identity.failure.d: "The religious name became a boundary before it became a shelter. The Basin council kept medicine moving, yet several wards now treat the new register as a test of belief instead of a promise of common care."
chaosx.fallout.875.a: "Record the chosen name"
chaosx.fallout.875.a.tt: "Apply the graded identity result, preserve the chosen-name memory, and schedule the delayed generation review."
chaosx.fallout.877.t: "The Name Holds"
chaosx.fallout.877.success.d: "The delayed review finds children, ferrymen, and ward captains using the same name without a clerk forcing the issue. The Congo Green Basin can answer a foreign government in its own voice, and its identity memory now guides the next generation."
chaosx.fallout.877.partial.d: "The delayed review keeps the chosen name alive, though old seals and new schoolbooks still disagree. The Basin has a usable public identity, but each generation must decide how much of the old record it carries."
chaosx.fallout.877.failure.d: "The delayed review finds the name split between pump houses and border papers. The council retains the memory of its choice, yet the next generation will inherit a dispute instead of a settled civic answer."
chaosx.fallout.877.a: "Close the identity record"
chaosx.fallout.877.a.tt: "Apply the delayed generation outcome, record the final identity memory, and release the reserved state and neighbor rows."
