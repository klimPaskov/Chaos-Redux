l_english:
# Shared priority-member focus overlay
africa_priority_member_focus_tree: "The Priority Member Settlement"
africa_priority_member_focus_tree_desc: "A promoted priority member carries its compact-country settlement into public institutions, economic function, league relations, national force, and a durable post-settlement programme."
africa_priority_define_compact_country: "[ROOT.GetAfricaPriorityPackageName]: Define the Compact Country"
africa_priority_define_compact_country_desc: "[ROOT.GetAfricaPriorityStartingProblem]. The first task is to define a viable country that can govern its present territory without converting history into automatic borders."
africa_priority_define_compact_country_tt: "Records the compact-country mandate and convenes the unresolved political settlement. It grants no claims, cores, or territorial transfers."
africa_priority_ratify_political_settlement: "[ROOT.GetAfricaPriorityPackageName]: Ratify the Political Settlement"
africa_priority_ratify_political_settlement_desc: "[ROOT.GetAfricaPriorityPoliticalSettlement]. The chosen institution must govern in public and carry the package from its starting problem into a visible constitutional stage."
africa_priority_ratify_political_settlement_tt: "Replaces the starting-problem idea with exactly one council, civic, or producer settlement idea matching the recorded political choice."
africa_priority_build_distinct_institution: "[ROOT.GetAfricaPriorityPackageName]: Build the Distinct Institution"
africa_priority_build_distinct_institution_desc: "[ROOT.GetAfricaPriorityDistinctInstitution]. This is the package's central mechanic, not a generic legitimacy meter."
africa_priority_build_distinct_institution_tt: "Advances the existing package mechanic by one stage and applies its country-specific institutional payoff."
africa_priority_secure_economic_function: "[ROOT.GetAfricaPriorityPackageName]: Secure the Economic Function"
africa_priority_secure_economic_function_desc: "[ROOT.GetAfricaPriorityEconomicFunction]. A full package must do more than display a restored name; it needs a working route, public work, or strategic service."
africa_priority_secure_economic_function_tt: "Builds one package-specific compact-country project and supplies the equipment appropriate to its economic or strategic role."
africa_priority_negotiate_league_role: "[ROOT.GetAfricaPriorityPackageName]: Consolidate the League Role"
africa_priority_negotiate_league_role_desc: "[ROOT.GetAfricaPriorityLeagueRole]. The focus recognises the relationship already negotiated through the Charter state machine; it cannot infer membership from opinion."
africa_priority_negotiate_league_role_tt: "Consolidates the recorded cooperative, outside, or rival relationship without skipping a relationship stage."
africa_priority_field_national_force: "[ROOT.GetAfricaPriorityPackageName]: Field the National Force"
africa_priority_field_national_force_desc: "[ROOT.GetAfricaPriorityForceIdentity]. Reinforcement must come from manpower, equipment, training, and the package's plausible military institutions."
africa_priority_field_national_force_tt: "Advances the existing force-readiness track by one stage and applies the package-specific equipment and experience payload."
africa_priority_resolve_overlap_question: "[ROOT.GetAfricaPriorityPackageName]: Resolve the Overlap Question"
africa_priority_resolve_overlap_question_desc: "[ROOT.GetAfricaPriorityOverlapQuestion]. Congress, local consent, autonomy, or rivalry must settle the question before the package can write a durable programme."
africa_priority_resolve_overlap_question_tt: "Recognises the already recorded overlap disposition. It annexes nothing and grants no automatic core."
africa_priority_write_post_settlement_programme: "[ROOT.GetAfricaPriorityPackageName]: Write the Post-Settlement Programme"
africa_priority_write_post_settlement_programme_desc: "[ROOT.GetAfricaPriorityPostSettlementProgramme]. The country remains playable after settlement and turns its compact institutions into continuing regional policy."
africa_priority_write_post_settlement_programme_tt: "Replaces the political-stage idea with the package's mature compact and begins one existing post-settlement programme cycle."

# Direct public package names
africa_priority_dynamic_name_asante: "Asante"
africa_priority_dynamic_name_oyo: "Oyo"
africa_priority_dynamic_name_sokoto: "Sokoto"
africa_priority_dynamic_name_kanem_bornu: "Kanem-Bornu"
africa_priority_dynamic_name_manden: "Manden"
africa_priority_dynamic_name_kongo: "Kongo"
africa_priority_dynamic_name_buganda: "Buganda"
africa_priority_dynamic_name_aksum: "Aksum"
africa_priority_dynamic_name_harar: "Harar"
africa_priority_dynamic_name_kilwa: "Kilwa"
africa_priority_dynamic_name_nubia: "Nubia"
africa_priority_dynamic_name_luba: "Luba"
africa_priority_dynamic_name_lunda: "Lunda"
africa_priority_dynamic_name_great_zimbabwe: "Great Zimbabwe"
africa_priority_dynamic_name_merina: "Merina"
africa_priority_dynamic_name_zulu: "Zulu"
africa_priority_dynamic_unmapped: "Unmapped priority package"

# Starting problems
africa_priority_dynamic_start_asante: "Restored court prestige faces incomplete administration, disputed constituent authority, weak port access, and unsettled Gold Coast relations"
africa_priority_dynamic_start_oyo: "Imperial prestige lacks a settled centre, royal and urban authority remain divided, and no port corridor is guaranteed"
africa_priority_dynamic_start_sokoto: "Restored authority is entangled with colonial indirect rule, taxation, court reform, pastoral routes, and Nigerian federal politics"
africa_priority_dynamic_start_kanem_bornu: "Restoration surrounds a shrinking lake and fragmented trade system without an accepted modern territorial formula"
africa_priority_dynamic_start_manden: "Imperial memory has no single uncontested claimant, capital, border, or route to the sea"
africa_priority_dynamic_start_kongo: "Court and people remain divided among Belgian, French, and Portuguese colonial systems with disputed access and leadership"
africa_priority_dynamic_start_buganda: "A privileged kingdom inside a wider protectorate faces mailo land disputes, cotton revenue, lost counties, and non-Buganda mistrust"
africa_priority_dynamic_start_aksum: "Ancient legitimacy sits inside modern Ethiopian and Eritrean politics without an automatic route to a port"
africa_priority_dynamic_start_harar: "The city lacks secure water, food, railway, caravan, and port access"
africa_priority_dynamic_start_kilwa: "A prestigious port sits inside a plural coast divided among city, island, labour, merchant, and inland interests"
africa_priority_dynamic_start_nubia: "A borderland claimed by two capitals and several historical memories faces shared water and displacement risks"
africa_priority_dynamic_start_luba: "A political tradition operates inside a mining and transport frontier with uncertain institutions and concession control"
africa_priority_dynamic_start_lunda: "A cross-border political tradition has communities and routes divided among several modern territories"
africa_priority_dynamic_start_great_zimbabwe: "A powerful historical symbol is contested by colonial rule, land inequality, mining interests, and rival restoration language"
africa_priority_dynamic_start_merina: "A highland crown faces an island-wide legitimacy deficit and unresolved land, labour, port, and regional questions"
africa_priority_dynamic_start_zulu: "A royal institution operates inside a racial and territorial order it did not design, with divided rural and urban interests"

# Political settlements
africa_priority_dynamic_politics_asante: "A stool-and-council government, civic revenue board, or producer compact defines how court legitimacy and public revenue share authority"
africa_priority_dynamic_politics_oyo: "An Alaafin-city council, corridor federation, or urban producer compact settles royal, civic, and commercial power"
africa_priority_dynamic_politics_sokoto: "An emirate consultative chamber, reformist federal chamber, or pastoral producer compact limits jurisdiction and taxation"
africa_priority_dynamic_politics_kanem_bornu: "A lake covenant council, Lake Chad commission, or pastoral water compact governs the shared basin"
africa_priority_dynamic_politics_manden: "A restoration assembly, river federation, or inland producer assembly joins local authorities, citizens, scholars, and producers"
africa_priority_dynamic_politics_kongo: "A court-civic congress, cross-border commonwealth, or river community union separates government from territorial maximalism"
africa_priority_dynamic_politics_buganda: "A Kabaka-Lukiiko compact, Uganda federal balance, or cotton and land-reform compact must distribute benefits transparently"
africa_priority_dynamic_politics_aksum: "A highland heritage council, federal commonwealth, or civic development compact separates cultural custody from political claim"
africa_priority_dynamic_politics_harar: "A municipal-court compact, mercantile city government, or hinterland market compact balances city and corridor interests"
africa_priority_dynamic_politics_kilwa: "A coastal-island council, maritime federation, or people's maritime union governs customs without one port dominating the coast"
africa_priority_dynamic_politics_nubia: "A dual-recognition council, autonomous river federation, or workers' river union binds community surveys to Nile governance"
africa_priority_dynamic_politics_luba: "A claimant-civic council, mining federation, or public-processing union separates cultural ties from political and concession status"
africa_priority_dynamic_politics_lunda: "A cross-border council, corridor confederation, or resource-corridor union regulates claimant authority and divided routes"
africa_priority_dynamic_politics_great_zimbabwe: "A restoration council, Zimbabwe federation, or agrarian-mining union defines heritage, land, and modern authority separately"
africa_priority_dynamic_politics_merina: "A crown assembly, Malagasy federation, or people's island union must win coastal as well as highland legitimacy"
africa_priority_dynamic_politics_zulu: "A crown assembly, South African federal state, or land-labour union binds royal authority to rural and urban consent"

# Distinct mechanics
africa_priority_dynamic_mechanic_asante: "Stool and council legitimacy grows through representation, succession, dispute settlement, and public works"
africa_priority_dynamic_mechanic_oyo: "The corridor and city compact distinguishes commercially open, federally administered, and occupied route states"
africa_priority_dynamic_mechanic_sokoto: "The emirate reform compact covers taxation, court jurisdiction, education, pastoral access, and Charter obligations"
africa_priority_dynamic_mechanic_kanem_bornu: "The lake and caravan covenant governs wells, fisheries, pasture, customs, and cross-border movement"
africa_priority_dynamic_mechanic_manden: "Assembly legitimacy comes from local authorities, civic delegates, producer bodies, scholars, and corridor partners"
africa_priority_dynamic_mechanic_kongo: "Cross-border community consent separates cultural citizenship from territorial integration"
africa_priority_dynamic_mechanic_buganda: "Kingdom confidence depends on a federal balance with transparent distribution of land, revenue, and representation"
africa_priority_dynamic_mechanic_aksum: "Heritage law separates monument and cultural recognition from living consent and political integration"
africa_priority_dynamic_mechanic_harar: "Corridor guarantees balance patrons, merchants, hinterland councils, and local institutions"
africa_priority_dynamic_mechanic_kilwa: "Port rivalry and common customs require separate assent to tariffs, patrols, courts, and representation"
africa_priority_dynamic_mechanic_nubia: "River rights require dual recognition from Egypt, Sudan, and affected local communities"
africa_priority_dynamic_mechanic_luba: "Overlap settlement permits cultural ties to several polities while assigning political status separately"
africa_priority_dynamic_mechanic_lunda: "Overlap settlement combines cross-border access with a tested claimant mandate"
africa_priority_dynamic_mechanic_great_zimbabwe: "The restoration mandate separates heritage support, rural consent, urban organisation, and land settlement"
africa_priority_dynamic_mechanic_merina: "Island confidence lets regional councils accept, amend, or reject highland policy"
africa_priority_dynamic_mechanic_zulu: "Crown, land, and labour balance links royal mobilisation to rural and urban consent"

# Economic and strategic functions
africa_priority_dynamic_economy_asante: "Court and council oversight connects cocoa and gold public revenue to port, rail, and public works"
africa_priority_dynamic_economy_oyo: "Road and motor corridors connect inland cities to negotiated port access and agricultural markets"
africa_priority_dynamic_economy_sokoto: "Pastoral water routes, rail markets, schools, and lawful taxation make the emirate compact governable"
africa_priority_dynamic_economy_kanem_bornu: "Lake access, caravan routes, drought response, and cross-border markets sustain the compact"
africa_priority_dynamic_economy_manden: "Niger and Atlantic access joins agricultural reform, road and rail projects, and archival institutions"
africa_priority_dynamic_economy_kongo: "River administration and negotiated port access connect education, law, and cross-border communities"
africa_priority_dynamic_economy_buganda: "Cotton revenue sharing and lake transport fund equal representation and kingdom-federal arbitration"
africa_priority_dynamic_economy_aksum: "Highland logistics and negotiated Red Sea access support heritage institutions without annexation"
africa_priority_dynamic_economy_harar: "Water, food, railway, caravan, and market guarantees diversify the city beyond one patron"
africa_priority_dynamic_economy_kilwa: "Customs, port dues, inland access, and distributed investment sustain a plural maritime economy"
africa_priority_dynamic_economy_nubia: "Irrigation, river transport, land rights, and heritage custody create a viable Nile administration"
africa_priority_dynamic_economy_luba: "Public processing, mining revenue, rail access, and labour rules replace concession dependence"
africa_priority_dynamic_economy_lunda: "Mining and trade routes, rail access, and cross-border citizenship sustain a corridor compact"
africa_priority_dynamic_economy_great_zimbabwe: "Land settlement, local mineral processing, rail, roads, and heritage governance support modern state capacity"
africa_priority_dynamic_economy_merina: "Highland-port roads, land and labour reform, and coastal investment build island-wide confidence"
africa_priority_dynamic_economy_zulu: "Lawful land reform, labour protection, Natal access, and public security works support the compact"

# Force identities
africa_priority_dynamic_force_asante: "A small royal guard, local infantry, veterans, and later federal or mobile formations"
africa_priority_dynamic_force_oyo: "Local infantry, mobile cavalry-derived units, urban guards, and later motorised regional brigades"
africa_priority_dynamic_force_sokoto: "Mobile and cavalry traditions, local infantry, frontier guards, and later motorised formations"
africa_priority_dynamic_force_kanem_bornu: "Mobile frontier troops, lake guards, local infantry, and later motorised desert units"
africa_priority_dynamic_force_manden: "Local infantry, river and caravan guards, mounted units, and later regional contingents"
africa_priority_dynamic_force_kongo: "Local guards, defectors, river troops, and later regional infantry and port units"
africa_priority_dynamic_force_buganda: "Royal guards, lake units, regional infantry, and later federal contingents"
africa_priority_dynamic_force_aksum: "Highland infantry, territorial guards, mule logistics, engineers, and later Red Sea support"
africa_priority_dynamic_force_harar: "City guards, mounted patrols, railway and caravan security units, and League volunteers"
africa_priority_dynamic_force_kilwa: "Coastal guards, marines, dhow patrols, port engineers, and later a small blue-water force"
africa_priority_dynamic_force_nubia: "River guards, desert patrols, engineers, and light infantry"
africa_priority_dynamic_force_luba: "Local guards, reformed mining security units, river troops, and regional infantry"
africa_priority_dynamic_force_lunda: "Local guards, frontier troops, river units, and regional infantry"
africa_priority_dynamic_force_great_zimbabwe: "Local defence groups, defectors, mounted and motorised units, engineers, and later regular infantry"
africa_priority_dynamic_force_merina: "Highland infantry, coastal guards, reformed gendarmes, and later island logistics and marines"
africa_priority_dynamic_force_zulu: "Territorial infantry, scouts, mounted units, engineers, and later regular formations"

# League roles
africa_priority_dynamic_league_asante: "Protected cultural member, autonomous federal state, sovereign member, or West African rival"
africa_priority_dynamic_league_oyo: "Strong member, Nigerian federal state, Yoruba-centred bloc leader, or regional rival"
africa_priority_dynamic_league_sokoto: "Major federal state, sovereign member, Council of Crowns anchor, or Sahel rival"
africa_priority_dynamic_league_kanem_bornu: "Sahel mediator, crowns member, confederal anchor, or military-corridor rival"
africa_priority_dynamic_league_manden: "West African federal member, cultural commonwealth, inland rival, or regional congress host"
africa_priority_dynamic_league_kongo: "Major basin member, federal state, cultural commonwealth, or Congo-basin rival"
africa_priority_dynamic_league_buganda: "Crowns anchor, Ugandan federal state, sovereign member, or royal rival bloc"
africa_priority_dynamic_league_aksum: "Crowns member, federal highland state, cultural commonwealth, or difficult Horn restoration"
africa_priority_dynamic_league_harar: "Protected city-state, specialist mediator, Horn associate, or corridor-federation member"
africa_priority_dynamic_league_kilwa: "Indian Ocean association leader, confederal member, maritime federal state, or coastal rival"
africa_priority_dynamic_league_nubia: "Bridge member, Nile arbitration centre, autonomous river federation, or rival Nile bloc"
africa_priority_dynamic_league_luba: "Central Council member, federal state, mining-compact leader, or regional rival"
africa_priority_dynamic_league_lunda: "Central or Southern Council member, confederal bridge, royal compact member, or resource rival"
africa_priority_dynamic_league_great_zimbabwe: "Southern Council state, Zimbabwe federation leader, cultural restoration, or anti-settler rival"
africa_priority_dynamic_league_merina: "Crowns member, Malagasy federal component, Islands Council leader, or sovereign island rival"
africa_priority_dynamic_league_zulu: "Crowns member, federal South African state, southern rival leader, or civil-war coalition partner"

# Overlap and refusal questions
africa_priority_dynamic_overlap_asante: "Asante resists direct annexation, court interference, and hosts that manipulate neighbouring restorations"
africa_priority_dynamic_overlap_oyo: "Oyo opposes Nigerian leadership without a regional settlement and can form a city-based rival compact"
africa_priority_dynamic_overlap_sokoto: "Sokoto resists abolition of all local institutions and can organise an emirate bloc against coercive centralism"
africa_priority_dynamic_overlap_kanem_bornu: "Kanem-Bornu can lead a Lake Chad compact against hosts that monopolise water or corridors"
africa_priority_dynamic_overlap_manden: "Manden can reject coastal fiscal dominance and form an inland federation"
africa_priority_dynamic_overlap_kongo: "Kongo opposes Congo or Angola hosts that use restoration as a pretext for annexation"
africa_priority_dynamic_overlap_buganda: "Buganda resists structures that preserve privilege without shared benefits or abolish negotiated autonomy"
africa_priority_dynamic_overlap_aksum: "Aksum can oppose Ethiopian or Eritrean centralisation and remain a protected cultural polity instead of expanding"
africa_priority_dynamic_overlap_harar: "Harar can declare neutrality or oppose a host that monopolises railway and market access"
africa_priority_dynamic_overlap_kilwa: "Kilwa can withdraw, form a rival city league, or reject host-controlled customs"
africa_priority_dynamic_overlap_nubia: "Nubia can resist Egyptian or Sudanese domination and organise a river compact"
africa_priority_dynamic_overlap_luba: "Luba can reject host control of mining revenue or an imposed Luba-Lunda union"
africa_priority_dynamic_overlap_lunda: "Lunda can reject imposed federation, fight over revenue, or form a separate corridor bloc"
africa_priority_dynamic_overlap_great_zimbabwe: "Great Zimbabwe can oppose settler-led or South African leadership and reject unsafe territorial maximalism"
africa_priority_dynamic_overlap_merina: "Merina can resist mainland neglect or forced island annexation, while coastal regions retain refusal rights"
africa_priority_dynamic_overlap_zulu: "Zulu opposes settler-dominated leadership and can build a southern royal or territorial bloc"

# Post-settlement programmes
africa_priority_dynamic_post_asante: "Producer boards, regional arbitration, succession management, and public infrastructure"
africa_priority_dynamic_post_oyo: "Market corridors, urban arbitration, agricultural development, and port treaties"
africa_priority_dynamic_post_sokoto: "Pastoral corridor governance, education reform, Sahel diplomacy, and drought resilience"
africa_priority_dynamic_post_kanem_bornu: "Water governance, caravan security, regional drought relief, and cross-border market administration"
africa_priority_dynamic_post_manden: "River and road projects, cultural institutions, agricultural development, and inland-coastal bargaining"
africa_priority_dynamic_post_kongo: "Cross-border rights, river administration, port access, and regional mediation"
africa_priority_dynamic_post_buganda: "Kingdom-federal arbitration, cotton revenue sharing, lake projects, and constitutional succession"
africa_priority_dynamic_post_aksum: "Heritage institutions, Red Sea treaties, highland infrastructure, and autonomy arbitration"
africa_priority_dynamic_post_harar: "Trade arbitration, corridor diversification, water security, and educational institutions"
africa_priority_dynamic_post_kilwa: "Customs arbitration, port investment, inland corridor treaties, and island security"
africa_priority_dynamic_post_nubia: "Water negotiation, irrigation, river transport, heritage governance, and cross-border mediation"
africa_priority_dynamic_post_luba: "Mining labour, public processing, railway projects, and overlap arbitration"
africa_priority_dynamic_post_lunda: "Cross-border citizenship, corridor management, mining revenue, and Luba-Lunda arbitration"
africa_priority_dynamic_post_great_zimbabwe: "Land reform, heritage governance, local processing, transport development, and restoration arbitration"
africa_priority_dynamic_post_merina: "Asymmetric island federalism, port investment, road building, and regional confidence management"
africa_priority_dynamic_post_zulu: "Land guarantees, labour protection, constitutional succession, regional arbitration, and South African reconstruction"

