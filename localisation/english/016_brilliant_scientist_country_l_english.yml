brilliant_scientist_sovereign_director: "Sovereign Polymath"
brilliant_scientist_sovereign_director_desc: "Doctor Warren Kruger directs the state as he once directed its laboratories: across every discipline, with absolute confidence and no tolerance for delay."

brilliant_scientist_improvised_laboratory_state: "Improvised Laboratory State"
brilliant_scientist_improvised_laboratory_state_desc: "A collection of laboratories, guards, and displaced administrators is learning how to function as a country while every institution competes for scarce space."
brilliant_scientist_civic_laboratory_administration: "Civic Laboratory Administration"
brilliant_scientist_civic_laboratory_administration_desc: "Civilian ministries translate laboratory plans into accountable public administration without displacing scientific authority."
brilliant_scientist_machine_laboratory_administration: "Machine Laboratory Administration"
brilliant_scientist_machine_laboratory_administration_desc: "Automated schedules and machine adjudicators coordinate production with inhuman precision, though political initiative atrophies."
brilliant_scientist_replication_administration: "Replication Administration"
brilliant_scientist_replication_administration_desc: "Identity records, growth cohorts, and accelerated training form a state designed around replaceable citizens."
brilliant_scientist_synthesis_administration: "Synthesis Administration"
brilliant_scientist_synthesis_administration_desc: "Competing project directorates are fused into one state apparatus optimized for impossible research."
brilliant_scientist_temporal_continuum_administration: "Continuity Administration"
brilliant_scientist_temporal_continuum_administration_desc: "Orders, forecasts, and contingencies are reconciled across competing records of events. The state moves with unnatural preparation, but its civilian population cannot be treated as another reserve of replaceable outcomes."
brilliant_scientist_xenobiological_administration: "Engineered Cohort Administration"
brilliant_scientist_xenobiological_administration_desc: "Civil and military offices are reorganized around engineered cohorts whose physical discipline sustains the state while deepening public fear of what citizenship has become."
brilliant_scientist_laboratory_feudalism: "Laboratory Feudalism"
brilliant_scientist_laboratory_feudalism_desc: "Facility chiefs rule their compounds as private domains, trading obedience for access to Kruger's instruments."
brilliant_scientist_inherited_project_portfolio: "Inherited Project Portfolio"
brilliant_scientist_inherited_project_portfolio_desc: "The state possesses an extraordinary body of work, but its scattered notes, prototypes, and specialized sites impose a severe coordination burden."
brilliant_scientist_documented_project_portfolio: "Documented Project Portfolio"
brilliant_scientist_documented_project_portfolio_desc: "A common technical archive allows each laboratory to build upon the exact results of the others."
brilliant_scientist_weaponized_project_portfolio: "Weaponized Project Portfolio"
brilliant_scientist_weaponized_project_portfolio_desc: "Research, industry, and military procurement are organized around rapid conversion of experiments into field systems."
brilliant_scientist_fragmented_portfolio: "Fragmented Portfolio"
brilliant_scientist_fragmented_portfolio_desc: "Competing custodians conceal data, hoard prototypes, and repeatedly reproduce work that another laboratory has already completed."
brilliant_scientist_fragmented_command: "Fragmented Command"
brilliant_scientist_fragmented_command_desc: "Conventional officers and project commanders obey incompatible chains of command."
brilliant_scientist_general_staff_command: "General Staff Command"
brilliant_scientist_general_staff_command_desc: "A professional staff integrates laboratory formations into coherent operational plans."
brilliant_scientist_machine_command_network: "Machine Command Network"
brilliant_scientist_machine_command_network_desc: "Distributed processors synchronize orders, reserves, and fire plans faster than human staffs can intervene."
brilliant_scientist_clone_officer_corps: "Clone Officer Corps"
brilliant_scientist_clone_officer_corps_desc: "Purpose-grown officers share doctrine, memory exercises, and an unusually consistent understanding of command."
brilliant_scientist_project_council_command: "Project Council Command"
brilliant_scientist_project_council_command_desc: "Each project army retains its identity while a permanent council allocates operations and resources."
brilliant_scientist_project_armies_in_rivalry: "Project Armies in Rivalry"
brilliant_scientist_project_armies_in_rivalry_desc: "Laboratory formations with incompatible doctrines compete for prestige, supplies, and authority."
brilliant_scientist_experimental_supply_chain: "Experimental Supply Chain"
brilliant_scientist_experimental_supply_chain_desc: "Unique components, living payloads, and unstable devices must pass through an improvised logistics system."
brilliant_scientist_automated_supply_network: "Automated Supply Network"
brilliant_scientist_automated_supply_network_desc: "Machine dispatchers predict consumption and route specialized parts directly to the formations that require them."
brilliant_scientist_portal_supply_network: "Portal Supply Network"
brilliant_scientist_portal_supply_network_desc: "Authenticated transit terminals shorten conventional supply lines at the cost of enormous energy demand."
brilliant_scientist_biological_supply_network: "Biological Supply Network"
brilliant_scientist_biological_supply_network_desc: "Growth sites and living logistics reduce transport demand while tying the army to controversial biological infrastructure."
brilliant_scientist_conventional_supply_corps: "Conventional Supply Corps"
brilliant_scientist_conventional_supply_corps_desc: "Ordinary depots, trains, and disciplined quartermasters provide a reliable foundation beneath the experimental army."
brilliant_scientist_prototype_cannibalization: "Prototype Cannibalization"
brilliant_scientist_prototype_cannibalization_desc: "Irreplaceable devices are stripped to sustain other systems, sacrificing industry and future research for immediate readiness."
brilliant_scientist_scientific_exodus: "Scientific Exodus"
brilliant_scientist_scientific_exodus_desc: "Researchers fear isolation, coercion, and the unstable future of the laboratory state. Many seek safer institutions abroad."
brilliant_scientist_international_scientific_center: "International Scientific Center"
brilliant_scientist_international_scientific_center_desc: "Protected exchanges and foreign institutes make the state a destination for ambitious researchers."
brilliant_scientist_autonomous_research_network: "Autonomous Research Network"
brilliant_scientist_autonomous_research_network_desc: "Distributed laboratories continue their work without relying on foreign recognition or a single vulnerable archive."
brilliant_scientist_intellectual_isolation: "Intellectual Isolation"
brilliant_scientist_intellectual_isolation_desc: "Secrecy and distrust have cut the laboratories away from outside criticism, materials, and talent."

brilliant_scientist_xeno_control_chemical_force: "Chemical-Signal Control"
brilliant_scientist_xeno_control_chemical_force_desc: "Xenobiological formations obey a verified chemical signaling chain."
brilliant_scientist_xeno_control_neural_force: "Neural Control"
brilliant_scientist_xeno_control_neural_force_desc: "Neural interfaces drive xenobiological formations toward aggressive coordination."
brilliant_scientist_xeno_control_machine_force: "Machine Control"
brilliant_scientist_xeno_control_machine_force_desc: "Automated handlers direct xenobiological formations through a hardened command network."
brilliant_scientist_xeno_control_researched_force: "Researched Control"
brilliant_scientist_xeno_control_researched_force_desc: "Extended observation produces a balanced and efficient xenobiological control protocol."
brilliant_scientist_biological_delivery_anthrax: "Kruger Anthrax Delivery"
brilliant_scientist_biological_delivery_anthrax_desc: "Kruger's retained anthrax work improves the reliability and reach of its matching delivery system."
brilliant_scientist_biological_delivery_plague: "Kruger Plague Delivery"
brilliant_scientist_biological_delivery_plague_desc: "Kruger's retained plague work improves the reliability and reach of its matching delivery system."
brilliant_scientist_biological_delivery_tularemia: "Kruger Tularemia Delivery"
brilliant_scientist_biological_delivery_tularemia_desc: "Kruger's retained tularemia work improves the reliability and reach of its matching delivery system."
brilliant_scientist_biological_delivery_smallpox: "Kruger Smallpox Delivery"
brilliant_scientist_biological_delivery_smallpox_desc: "Kruger's retained smallpox work improves the reliability and reach of its matching delivery system."
brilliant_scientist_biological_delivery_weaponized_zombies: "Kruger Zombie Delivery"
brilliant_scientist_biological_delivery_weaponized_zombies_desc: "Kruger's retained zombie-agent work improves the reliability and reach of its matching delivery system."

portal_raider: "Portal Raider"
portal_raider_desc: "A line-infantry battalion equipped with portable transit apparatus for sudden portal insertions. Each battalion uses one hundred Infantry Equipment and ten Teleportation Equipment."
autonomous_robot: "Autonomous Robot"
autonomous_robot_desc: "A heavily armored machine-infantry battalion whose integrated automatic weapons deliver tank-grade firepower without a human crew."
kruger_paleogenetic_beast: "Paleogenetic Shock Pack"
kruger_paleogenetic_beast_desc: "Revived terrestrial predators bred, equipped, and handled for shock action."
kruger_xenobiological_assault: "Xenobiological Assault Organisms"
kruger_xenobiological_assault_desc: "Engineered organisms whose field behavior depends on the Directorate's exact control protocol."
alien_infantry: "Alien Infantry"
alien_infantry_desc: "Extraterrestrial infantry equipped for independent ground operations. Each battalion requires two hundred Alien Laser Weapons and no human manpower or ordinary equipment."
kruger_temporal_guard: "Temporal Continuity Guard"
kruger_temporal_guard_desc: "An authenticated guard trained to retain orders and cohesion through local continuity disturbances."

teleportation_equipment: "Teleportation Equipment"
teleportation_equipment_desc: "Portable field apertures, synchronization instruments, and containment assemblies usable by any compatible portal formation."
teleportation_equipment_1: "Teleportation Equipment"
teleportation_equipment_1_short: "Teleportation Eq."
autonomous_robot_equipment: "Autonomous Combat Robot"
autonomous_robot_equipment_desc: "A self-directed armored infantry chassis with twin arm-mounted machine guns, protected drives, and battlefield target logic."
autonomous_robot_equipment_1: "Autonomous Combat Robot"
autonomous_robot_equipment_1_short: "Combat Robot"
kruger_paleogenetic_equipment: "Paleogenetic Handling Train"
kruger_paleogenetic_equipment_desc: "Restraint, veterinary, feeding, and command equipment for revived predators."
kruger_paleogenetic_equipment_1: "Paleogenetic Handling Train"
kruger_paleogenetic_equipment_1_short: "Handling Train"
kruger_xenobiological_equipment: "Xenobiological Control Suite"
kruger_xenobiological_equipment_desc: "Life support, signaling, and containment systems for engineered assault organisms."
kruger_xenobiological_equipment_1: "Xenobiological Control Suite"
kruger_xenobiological_equipment_1_short: "Control Suite"
alien_laser_weapon_equipment: "Alien Laser Weapon"
alien_laser_weapon_equipment_desc: "Compact extraterrestrial beam weapons whose predictive fire control and armor penetration exceed terrestrial infantry arms."
alien_laser_weapon_equipment_1: "Alien Laser Weapon"
alien_laser_weapon_equipment_1_short: "Alien Laser"
kruger_temporal_equipment: "Continuity Field Apparatus"
kruger_temporal_equipment_desc: "Anchor-derived instruments that preserve a formation's local command continuity."
kruger_temporal_equipment_1: "Continuity Field Apparatus"
kruger_temporal_equipment_1_short: "Continuity Apparatus"

brilliant_scientist_portal_warfare_weaponization_tech: "Weaponized Transit Doctrine"
brilliant_scientist_portal_warfare_weaponization_tech_desc: "Field apertures are integrated into assault plans, improving Quantum Transit Raiders and enabling Portal Warfare raids against hostile installations."
brilliant_scientist_clone_formations_weaponization_tech: "Weaponized Replication Doctrine"
brilliant_scientist_clone_formations_weaponization_tech_desc: "Replicated formations exploit common training and recovery protocols at army scale."
brilliant_scientist_robot_formations_weaponization_tech: "Weaponized Autonomous Doctrine"
brilliant_scientist_robot_formations_weaponization_tech_desc: "Combat robots receive hardened targeting and assault logic, multiplying their anti-armor fire, breakthrough, and mechanical reliability."
brilliant_scientist_paleogenetic_formations_weaponization_tech: "Weaponized Paleogenetic Doctrine"
brilliant_scientist_paleogenetic_formations_weaponization_tech_desc: "Selective breeding and battlefield conditioning turn revived predators into faster shock formations."
brilliant_scientist_xenobiological_formations_weaponization_tech: "Weaponized Xenobiological Doctrine"
brilliant_scientist_xenobiological_formations_weaponization_tech_desc: "The selected control method is adapted for deliberate combined-arms assaults."
brilliant_scientist_alien_predictive_warfare_tech: "Alien Predictive Warfare"
brilliant_scientist_alien_predictive_warfare_tech_desc: "Alien combat calculus unlocks Predictive Vector Assault and Probability Screen tactics for formations fielding Alien Infantry."
tactic_alien_predictive_vector_assault: "Predictive Vector Assault"
tactic_alien_probability_screen: "Probability Screen"
brilliant_scientist_temporal_guard_weaponization_tech: "Weaponized Continuity Doctrine"
brilliant_scientist_temporal_guard_weaponization_tech_desc: "Continuity fields preserve defensive action and unit memory through battlefield disturbances."

