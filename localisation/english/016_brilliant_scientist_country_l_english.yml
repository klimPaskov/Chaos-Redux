KRG_general_staff_office: "General Staff Office"
KRG_general_staff_office_desc: "A chartered office of surviving officers translates the laboratory's unusual formations into ordinary operational plans."
KRG_machine_command_node: "Machine Command Node"
KRG_machine_command_node_desc: "A relay of processors and human operators coordinates project formations through a command network built for rapid handoffs."
KRG_clone_officer_corps: "Clone Officer Corps"
KRG_clone_officer_corps_desc: "A cohort of purpose-grown officers shares doctrine, memory exercises, and a common service record."
KRG_project_command_council: "Project Command Council"
KRG_project_command_council_desc: "A permanent council gives each project army a voice while allocating operations and scarce resources."

brilliant_scientist_krg_general_staff_advisor: "General Staff Office"
brilliant_scientist_krg_general_staff_advisor_desc: "Professional staff work improves planning and steadies the army's operational organization."
brilliant_scientist_krg_machine_command_advisor: "Machine Command Node"
brilliant_scientist_krg_machine_command_advisor_desc: "Distributed command relays synchronize orders and reduce the supply burden of project formations."
brilliant_scientist_krg_clone_officer_advisor: "Clone Officer Corps"
brilliant_scientist_krg_clone_officer_advisor_desc: "Shared training records make replicated officers faster to train and more consistent in the field."
brilliant_scientist_krg_project_council_advisor: "Project Command Council"
brilliant_scientist_krg_project_council_advisor_desc: "A standing council turns project rivalries into a common operational picture and a stronger command reserve."

