bya_fragmented_frontier_mandate: "Fragmented Frontier Mandate"
bya_fragmented_frontier_mandate_desc: "Baikal communities, villages, railway workers, and mounted frontier detachments recognize the provisional authority without yet accepting one settlement."
bya_buryatia_frontier_compact: "Buryat Frontier Compact"
bya_buryatia_frontier_compact_desc: "A council charter and common frontier command bind Buryatia's baikals, settlements, and routes to one civil authority."
bya_buryat_frontier_compact: "Buryat Frontier Compact"
bya_buryat_frontier_compact_desc: "A council charter and common frontier command bind Buryatia's baikals, settlements, and routes to one civil authority."
bya_council_charter: "Buryat Council Charter"
bya_council_charter_desc: "The council establishes elected civic administration and guarantees representation for Buryatia's frontier communities."
bya_baikal_council: "Baikal Communities Council"
bya_baikal_council_desc: "Baikal workers, engineers, and local delegates coordinate extraction, rail access, and civic revenue."
bya_traditional_land_compact: "Traditional Land Compact"
bya_traditional_land_compact_desc: "Village delegates and cooperatives protect food, remounts, and local administration across the frontier."
bya_steppe_land_compact: "Traditional Land Compact"
bya_steppe_land_compact_desc: "Village delegates and cooperatives protect food, remounts, and local administration across the frontier."
bya_frontier_workers_council: "Frontier Workers' Council"
bya_frontier_workers_council_desc: "Railway crews, baikal workers, and municipal committees coordinate production and transport through a common council."
bya_baikal_workers_council: "Frontier Workers' Council"
bya_baikal_workers_council_desc: "Railway crews, baikal workers, and municipal committees coordinate production and transport through a common council."
bya_emergency_frontier_command: "Emergency Frontier Command"
bya_emergency_frontier_command_desc: "A unified staff directs mounted guards and depot reserves while civil councils preserve supply and relief."
bya_frontier_emergency_command: "Emergency Frontier Command"
bya_frontier_emergency_command_desc: "A unified staff directs mounted guards and depot reserves while civil councils preserve supply and relief."

independence_wave_buryatia_frontier_compact_category: "Buryat Frontier Compact"
independence_wave_buryatia_frontier_compact_category_desc: "Council Cohesion: §Y[?independence_wave_bya_council_cohesion|0]§! / [?constant:independence_wave_buryatia_pressure.maximum|0]\nFrontier Readiness: §Y[?independence_wave_bya_frontier_readiness|0]§! / [?constant:independence_wave_buryatia_pressure.maximum|0]\nReach [?constant:independence_wave_buryatia_pressure.stable|0] in both values to stabilize the compact."
independence_wave_bya_hold_frontier_council: "Hold the Buryat Frontier Council Together"
independence_wave_bya_hold_frontier_council_desc: "Within [?constant:independence_wave_buryatia_duration.founding_crisis|0] days, install a government, raise both compact values to [?constant:independence_wave_buryatia_pressure.stable|0], and keep Ulan-Ude owned and controlled."
independence_wave_bya_integrate_frontier_guards: "Integrate the Frontier Guards"
independence_wave_bya_integrate_frontier_guards_desc: "Unify mounted detachments and local guards under a frontier staff while preserving the community guarantees that sustain them."
independence_wave_bya_settle_former_host_ledgers: "Settle the Former Host Ledgers"
independence_wave_bya_settle_former_host_ledgers_desc: "Close the property, border, population, and recognition claims inherited from the former administration. If talks fail, Buryatia will settle them locally."
independence_wave_bya_ratify_constitutional_autonomy: "Ratify Constitutional Autonomy"
independence_wave_bya_ratify_constitutional_autonomy_desc: "Give the provisional council a binding charter of self-government and protections for frontier communities."
independence_wave_bya_adopt_traditional_compact: "Adopt the Traditional Compact"
independence_wave_bya_adopt_traditional_compact_desc: "Entrust village delegates and cooperatives with food, remounts, recruitment, and local administration."
independence_wave_bya_convene_socialist_councils: "Convene the Socialist Councils"
independence_wave_bya_convene_socialist_councils_desc: "Place the baikals, railways, workshops, and municipal services under a common workers' council."
independence_wave_bya_codify_durable_sovereignty: "Codify Durable Sovereignty"
independence_wave_bya_codify_durable_sovereignty_desc: "A resolved founding crisis, stable ledgers, and a functioning government can turn liberation into a durable Buryat state."
independence_wave_bya_secure_frontier_depots_desc: "Place the Ulan-Ude baikal stores, rail registers, and depot guards under a civil authority able to supply the compact."
independence_wave_bya_secure_frontier_depots: "Secure the Frontier Depots"
independence_wave_bya_register_buryat_communities_desc: "Record the rights, obligations, and representation of every baikal district, village, railway town, and recognized community."
independence_wave_bya_register_buryat_communities: "Register the Buryat Communities"
independence_wave_bya_establish_frontier_emergency_command_desc: "Put the mounted guards under one emergency staff and secure the passes before neighboring armies test the compact."
independence_wave_bya_establish_frontier_emergency_command: "Establish the Frontier Emergency Command"
independence_wave_bya_open_baikal_mongolia_corridor_desc: "After the founding settlement, exchange supplies, officers, and diplomatic access along the Baikal–Mongolia network with the other states that survived the wave."
independence_wave_bya_open_baikal_mongolia_corridor: "Open the Baikal–Mongolia Network Corridor"
independence_wave_bya_depots_effect_tt: "Council Cohesion and Frontier Readiness improve, while Legitimacy and State Capacity rise."
independence_wave_bya_guards_effect_tt: "Frontier Readiness improves sharply and the security administration gains Legitimacy and Security."
independence_wave_bya_communities_effect_tt: "Council Cohesion improves sharply, Recognition and State Capacity rise, and the compact absorbs a measured instability cost."
independence_wave_bya_host_ledgers_effect_tt: "Council Cohesion and Frontier Readiness improve. Former-host property, border, population, and recognition ledgers are settled through negotiation."
independence_wave_bya_host_loss_effect_tt: "The former-host ledger closes locally. Council Cohesion and Frontier Readiness improve, and no bilateral host values change."
independence_wave_bya_constitutional_route_effect_tt: "The Buryat Civic Assembly takes office under the constitutional standard. Council Cohesion and Frontier Readiness improve, with gains to Legitimacy and State Capacity."
independence_wave_bya_traditional_route_effect_tt: "The Buryat Land Compact takes office under the traditional standard. Council Cohesion and Frontier Readiness improve, with gains to Legitimacy and Recognition."
independence_wave_bya_socialist_route_effect_tt: "The Buryat Baikal Workers' Council takes office under the socialist standard. Frontier Readiness improves sharply while the railway and baikal economy are reorganized."
independence_wave_bya_emergency_route_effect_tt: "The Frontier Command Directorate takes office under the emergency standard. Frontier Readiness rises sharply while Council Cohesion pays the cost of emergency rule."
independence_wave_bya_sovereignty_effect_tt: "Legitimacy, Recognition, and State Capacity rise, and the compact gains Security."
independence_wave_bya_network_effect_tt: "Council Cohesion and Frontier Readiness improve. Network Standing, League Cohesion, Common Cause, Shared Reserve, and Member Confidence rise."
independence_wave_bya_focus_integrate_frontier_guards: "Integrate the Frontier Guards"
independence_wave_bya_focus_register_buryat_communities: "Register the Buryat Communities"
independence_wave_bya_focus_secure_frontier_depots: "Secure the Frontier Depots"
independence_wave_bya_focus_settle_former_host_ledgers: "Settle the Former Host Ledgers"

independence_wave_bya_project_failure_effect_tt: "Council Cohesion and Frontier Readiness each fall by [?constant:independence_wave_buryatia_pressure.standard_loss|0]. Legitimacy, Recognition, State Capacity, and Security fall. Instability rises."
