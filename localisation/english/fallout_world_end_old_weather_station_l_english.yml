l_english:
  chaosx.fallout.373.t: "The Old Weather Station"
  chaosx.fallout.373.d: "A remote station has kept its barometer, radio mast, and climate notebooks dry through the ash years. Its observers can read the next cold front, but they cannot keep the tower powered and the radio open without a decision from [ROOT.GetName]. The station can serve public shelter planning, military warning, shared science, or no one at all."
  chaosx.fallout.373.a: "Fund the observers"
  chaosx.fallout.373.a.tt: "Spend Power, Fuel, Medicine, and Recognition to keep civilian observers on the tower. Forecast precision and local supply improve, and the station becomes a public climate service."
  chaosx.fallout.373.b: "Militarize the forecast"
  chaosx.fallout.373.b.tt: "Spend Power, Fuel, and Cohesion to place the radio watch under military command. Warning reaches patrols quickly, but the station becomes a security instrument."
  chaosx.fallout.373.c: "Share the records"
  chaosx.fallout.373.c.tt: "Spend Power, Medicine, and Recognition to copy the notebooks and open the radio schedule to other survivors. Foreign contact and research improve while the country gives up exclusive control."
  chaosx.fallout.373.d_option: "Abandon the tower"
  chaosx.fallout.373.d_option.tt: "Spend a small Fuel, Power, and Recognition reserve to leave a sealed station log. The tower stops serving the country, but the records may remain for a later expedition."

  chaosx.fallout.375.t: "The tower sends its first warning"
  chaosx.fallout.375.fund_observers.success.d: "The observers replaced the cracked anemometer, dried the radio batteries, and moved the warning board into the clinic foyer. The next cold front reached every shelter before the snow began. The tower now belongs to public planning rather than a single office."
  chaosx.fallout.375.fund_observers.partial.d: "The observers repaired the mast but not the old pressure recorder. They can warn the capital and two nearby depots, while outlying farms still read the sky for themselves. The public service works, with gaps marked in red ink."
  chaosx.fallout.375.fund_observers.failure.d: "The replacement batteries arrived after the first storm. The observers lost a week of readings, and the radio room filled with frost. Shelters received the warning through rumor instead of the station ledger."
  chaosx.fallout.375.militarize_forecast.success.d: "The army installed a guarded transmitter and taught patrol commanders to read the station's coded fronts. Convoys now leave before the ash rain, while the observers keep a civilian copy of every report."
  chaosx.fallout.375.militarize_forecast.partial.d: "The guard posts are manned, but the radio schedule follows patrol priorities rather than clinic needs. Military columns receive useful warning, while villages learn of the same storm when the first roofs frost over."
  chaosx.fallout.375.militarize_forecast.failure.d: "The station became a checkpoint before its instruments were repaired. A patrol took the last dry batteries, the observers stopped signing the log, and the warning network lost the one voice that made it credible."
  chaosx.fallout.375.share_global_data.success.d: "Copies of the notebooks crossed three radio relays before the first storm. Neighboring shelters returned their own readings, and the station's map now shows a shared cold front instead of a private border. Scientists and couriers have a reason to keep speaking."
  chaosx.fallout.375.share_global_data.partial.d: "The country released the older records but kept the current wind table. Foreign stations answer with fragments, enough to mark a storm corridor but not enough to protect every convoy. The exchange has begun with a line still withheld."
  chaosx.fallout.375.share_global_data.failure.d: "The copied records reached a rival transmitter with their verification page missing. Two governments broadcast different forecasts, and the station crew spent its medicine stores proving which thermometer had survived."
  chaosx.fallout.375.abandon_station.success.d: "The tower crew sealed the radio batteries, wrapped the notebooks in waxed cloth, and marked the safe approach across the snowfield. No current government receives a warning, but the next expedition will find an honest record."
  chaosx.fallout.375.abandon_station.partial.d: "The mast is quiet and the tower door is chained. One weather box still records pressure by itself, leaving a narrow thread for anyone who can reach it before the next deep freeze."
  chaosx.fallout.375.abandon_station.failure.d: "The evacuation crew left the tower unlocked. Wind tore pages from the climate ledger, and a scavenger fire ruined the radio batteries. The station has become a blank place on every map."
  chaosx.fallout.375.a: "Keep the forecast ledger open"
  chaosx.fallout.375.a.tt: "Resolve the first warning and schedule the later station review."

  chaosx.fallout.377.t: "The weather ledger returns"
  chaosx.fallout.377.success.d: "The scheduled review contains a full pressure series, a repaired mast, and radio acknowledgements from two distant shelters. The forecast is now a country service with a memory of who answered the call."
  chaosx.fallout.377.partial.d: "The review confirms a useful warning and a silent outpost. The station can continue, but every forecast must name its missing readings and every convoy needs a second route."
  chaosx.fallout.377.failure.d: "The review arrived with a torn seal and no current readings. The radio tower still stands, yet no one can tell whether its next warning is weather or a claimant's message."
  chaosx.fallout.377.a: "Close the weather ledger"
  chaosx.fallout.377.a.tt: "Record the review, release the delayed cleanup, and close the station memory."

  fallout.event_log.old_weather_station.name: "The Old Weather Station"
  fallout.event_log.old_weather_station.detail: "[This.GetName] chose who would keep a remote climate station and its radio alive. The decision changed forecast precision, polar contact, military warning, and the station's place in the country's recovery."
  fallout.event_log.old_weather_station.fund_observers_success: "Funded a public observer service"
  fallout.event_log.old_weather_station.fund_observers_partial: "Kept a public forecast service with gaps"
  fallout.event_log.old_weather_station.fund_observers_failure: "Lost the observer schedule in a storm"
  fallout.event_log.old_weather_station.militarize_forecast_success: "Built a guarded military warning net"
  fallout.event_log.old_weather_station.militarize_forecast_partial: "Held a warning net that favored patrols"
  fallout.event_log.old_weather_station.militarize_forecast_failure: "Turned the station into an empty checkpoint"
  fallout.event_log.old_weather_station.share_global_data_success: "Opened a working interregional climate exchange"
  fallout.event_log.old_weather_station.share_global_data_partial: "Shared old records while holding current tables"
  fallout.event_log.old_weather_station.share_global_data_failure: "Lost the verification chain in a forecast dispute"
  fallout.event_log.old_weather_station.abandon_station_success: "Sealed an honest climate archive for later use"
  fallout.event_log.old_weather_station.abandon_station_partial: "Left a narrow automatic weather record"
  fallout.event_log.old_weather_station.abandon_station_failure: "Lost the weather archive to wind and fire"
  fallout.event_log.old_weather_station.callback_success: "Received a complete weather ledger review"
  fallout.event_log.old_weather_station.callback_partial: "Received a partial weather station review"
  fallout.event_log.old_weather_station.callback_failure: "Closed the station after a false or missing report"
