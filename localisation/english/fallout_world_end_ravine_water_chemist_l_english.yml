l_english:
  chaosx.fallout.499.t: "The Ravine Water Chemist"
  chaosx.fallout.499.intro: "Ash has settled into the blue snow above the thaw line. Dr. Mara Vey has been testing cloth, charcoal, and ice melt in a ravine clinic while families arrive from the exposed lower wards. Your government can give her a permanent bench, escort the clean-ice families to safer tanks, seal the ravine ward under a quarantine order, or send her method to every district that still has a working pump."
  chaosx.fallout.499.a: "Give Dr. Vey the water bench"
  chaosx.fallout.499.a.tt: "Spend Food, Water, Medicine, Filters, Recognition, and Cohesion to keep the chemist at the ravine clinic and establish a named service memory."
  chaosx.fallout.499.b: "Escort the clean-ice families"
  chaosx.fallout.499.b.tt: "Spend Food, Water, Medicine, Filters, Recognition, and Cohesion to move families from the ash shelf to your safer tanks. The origin state will lose the recorded cohort through the Deaths pipeline."
  chaosx.fallout.499.c: "Quarantine the ravine ward"
  chaosx.fallout.499.c.tt: "Spend Food, Water, Medicine, Filters, Recognition, and Cohesion to close the ward, trace the fever line, and protect the remaining clinic staff."
  chaosx.fallout.499.d: "Share the filter method with districts"
  chaosx.fallout.499.d.tt: "Spend Food, Water, Medicine, Filters, Recognition, and Cohesion to send Dr. Vey's ash-water protocol to neighboring pumps without creating a new tag."

  chaosx.fallout.501.register_chemist.success.d: "Dr. Mara Vey receives a heated bench in the ravine clinic. Her charcoal columns take the ash from the meltwater, the lower ward gets a measured supply, and the ministry records her name beside the first clean pump."
  chaosx.fallout.501.register_chemist.partial.d: "The clinic keeps Dr. Vey's bench open, but the charcoal allotment arrives late. The governor's office can claim a working service, while the upper families still queue beside a grey cistern."
  chaosx.fallout.501.register_chemist.failure.d: "The heated bench freezes before the second sample. Dr. Vey loses a filter drum to the ash wind, and the local council turns the ravine clinic into a guarded storehouse."
  chaosx.fallout.501.escort_clean_ice_families.success.d: "The clean-ice families cross the ridge under lanterns and reach the district tanks before the frost closes the path. The ravine clinic keeps Dr. Vey's records, while the host state takes responsibility for every arrival."
  chaosx.fallout.501.escort_clean_ice_families.partial.d: "Half the families reach the host tanks, but a broken sled leaves the rest in the school shelter. The route remains open, though each household now carries a ration mark from both states."
  chaosx.fallout.501.escort_clean_ice_families.failure.d: "The escort meets a whiteout on the ash shelf. The families turn back toward the ravine, the origin ward loses its last spare filters, and the host district closes its gate for the night."
  chaosx.fallout.501.quarantine_ravine_ward.success.d: "The quarantine cordon holds around the ravine ward. Dr. Vey maps the fever line from the pump house to the dormitory, and the district governor accepts a hard closure that leaves the clean tanks untouched."
  chaosx.fallout.501.quarantine_ravine_ward.partial.d: "The ward is sealed, but two pump crews cross the cordon before the order reaches the lower road. The clinic gains a disease ledger while the neighboring district prepares its own watch."
  chaosx.fallout.501.quarantine_ravine_ward.failure.d: "The quarantine order arrives after the fever has crossed the pump house. The cordon breaks at the fuel shed, the ravine clinic loses its filters, and the council must count the sick without a clean line."
  chaosx.fallout.501.share_method_with_districts.success.d: "Dr. Vey's method travels by radio, courier, and stamped ration card. Three district pumps copy the charcoal layers before the next ash fall, and the water board turns a ravine notebook into a regional rule."
  chaosx.fallout.501.share_method_with_districts.partial.d: "The method reaches the central districts, but the outer pumps receive only the charcoal ratios. Their clerks improvise the cloth layers and ask the ravine clinic for a second transmission."
  chaosx.fallout.501.share_method_with_districts.failure.d: "The courier route fails at the frozen bridge. A damaged radio repeats half of Dr. Vey's protocol, and the districts fall back on separate water marks while the ash thickens over the roads."
  chaosx.fallout.501.a: "Record the chemist's result"
  chaosx.fallout.501.a.tt: "Resolve the delayed ravine result and schedule the later service review."

  chaosx.fallout.503.t: "The Ravine Service Review"
  chaosx.fallout.503.success.d: "After the next thaw, Dr. Vey's notebooks are still legible. The host tanks have room for another convoy, the disease line has receded, and the water board can name the districts that copied the method."
  chaosx.fallout.503.partial.d: "The review keeps the ravine service alive, but the outer pump crews still count cloth by the strip. Families have a route into safer tanks, though the clinic cannot promise every place a full clean allotment."
  chaosx.fallout.503.failure.d: "The review finds the ravine bench cold and the route ledger torn. Fever pressure rises around the lower pump, the next convoy is cancelled, and the government must rebuild trust before it can ask for another sample."
  chaosx.fallout.503.a: "Close the ravine service review"
  chaosx.fallout.503.a.tt: "Apply the delayed review, record its disease and migration memory, and release the scheduler receipts."

  fallout.event_log.ravine_water_chemist.name: "The Ravine Water Chemist"
  fallout.event_log.ravine_water_chemist.detail: "[GetFalloutEvent499EventLogDetail]"
  fallout.event_log.ravine_water_chemist.register_chemist_success: "Dr. Vey's ravine bench removed ash from the clinic cistern and made her service a named memory."
  fallout.event_log.ravine_water_chemist.register_chemist_partial: "The chemist kept the clinic open, but late charcoal left the upper ward on a grey-water ration."
  fallout.event_log.ravine_water_chemist.register_chemist_failure: "A frozen bench and a lost filter drum turned the ravine clinic into a guarded storehouse."
  fallout.event_log.ravine_water_chemist.escort_clean_ice_families_success: "Clean-ice families reached the host tanks, opening a recorded migration route between the two states."
  fallout.event_log.ravine_water_chemist.escort_clean_ice_families_partial: "Half the clean-ice families reached the host tanks while the rest waited in a school shelter."
  fallout.event_log.ravine_water_chemist.escort_clean_ice_families_failure: "A whiteout broke the escort and left both wards short of spare filters."
  fallout.event_log.ravine_water_chemist.quarantine_ravine_ward_success: "The ravine cordon held, and Dr. Vey mapped the fever line without touching the clean tanks."
  fallout.event_log.ravine_water_chemist.quarantine_ravine_ward_partial: "The ward was sealed after two pump crews crossed the cordon, leaving a disease ledger for the next watch."
  fallout.event_log.ravine_water_chemist.quarantine_ravine_ward_failure: "The fever crossed the pump house before the quarantine order arrived."
  fallout.event_log.ravine_water_chemist.share_method_with_districts_success: "Three districts copied the ravine filter method before the next ash fall."
  fallout.event_log.ravine_water_chemist.share_method_with_districts_partial: "Central districts received the method, while outer pumps waited for its cloth ratios."
  fallout.event_log.ravine_water_chemist.share_method_with_districts_failure: "A frozen bridge broke the courier route and left districts with separate water marks."
  fallout.event_log.ravine_water_chemist.callback_success: "The later review found Dr. Vey's bench working and the migration route ready for another convoy."
  fallout.event_log.ravine_water_chemist.callback_partial: "The ravine service survived, but outer pump crews still counted cloth by the strip."
  fallout.event_log.ravine_water_chemist.callback_failure: "The service review found a cold bench, a torn route ledger, and rising fever pressure."
