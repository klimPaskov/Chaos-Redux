chaosx.nr78.3.a: "Engage!"

chaosx.nr78.4.t: "We won a battle!"
chaosx.nr78.4.d: ""
chaosx.nr78.4.a: "Just a few more victories!"

chaosx.nr78.5.t: "We lost a battle!"
chaosx.nr78.5.d: ""
chaosx.nr78.5.a: "Could be worse"

chaosx.nr78.6.t: "Battle cancelled"
chaosx.nr78.6.d: ""
chaosx.nr78.6.a: "Mhm"

chaosx.news.78.t: "Border War!"
chaosx.news.78.d: "Clashes along the border between [?global.border_war_country.GetName] and [FROM.GetName] have become open war. Both armies are fighting for the disputed territory, and civilians are fleeing the frontier."
chaosx.news.78.a: "The conflict continues."
