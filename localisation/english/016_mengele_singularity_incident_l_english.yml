mengele_event016_singularity_incident_recovery: "Restore Singularity Component Control"
mengele_event016_singularity_incident_recovery_desc: "Technical staff isolate the contradictory commands, verify the affected component, and restore control of the contained architecture."
mengele_event016_singularity_incident_recovery_requirements_tt: "Requires an active Singularity component incident, a valid registered Mengele program, and no recovery already underway."
mengele_event016_singularity_incident_recovery_cost: "£pol_power §Y[?constant:brilliant_scientist_project_board.response_technical_political_power|0]§!  £support_equipment_text_icon §Y[?constant:brilliant_scientist_project_board.response_technical_support_equipment|0]§!  £GFX_fuel_texticon §Y[?constant:brilliant_scientist_project_board.response_technical_fuel|0]§!"
mengele_event016_singularity_incident_recovery_cost_blocked_tt: "Requires at least §Y[?constant:brilliant_scientist_project_board.response_technical_political_power|0]§! £pol_power, §Y[?constant:brilliant_scientist_project_board.response_technical_support_equipment|0]§! £support_equipment_text_icon, §Y[?constant:brilliant_scientist_project_board.response_technical_fuel|0]§! £GFX_fuel_texticon, and §Y[?constant:brilliant_scientist_project_board.response_technical_civilian_factories|0]§! available civilian factories."
mengele_event016_singularity_incident_recovery_started_tt: "A technical response team is assigned. [?constant:brilliant_scientist_project_board.response_technical_civilian_factories|0] civilian factories remain committed for [?constant:brilliant_scientist_project_board.response_technical_days|0] days."
mengele_event016_singularity_incident_recovery_cancel_trigger_tt: "The component incident, assigned response, or valid Mengele program is no longer present."
