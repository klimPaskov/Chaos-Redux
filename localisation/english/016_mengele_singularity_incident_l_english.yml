mengele_event016_singularity_incident_recovery_effect_tt: "Component control is restored, its penalty is removed, and the technical recovery is recorded."
brilliant_scientist_mengele_singularity_incident: "Singularity Component Authentication Cascade"
brilliant_scientist_mengele_singularity_incident_desc: "A contained component is accepting contradictory orders. Command coordination and national stability suffer until its controls are restored."
