brilliant_scientist_directorate_gui_mandate_tt: "§YMandate§! ranges from §Y0§! to §Y100§!. Higher Mandate strengthens the legal and political authority granted to the Directorate.\n\nAppointment: [ROOT.GetBrilliantScientistAppointmentCause]\nInstitution: [ROOT.GetBrilliantScientistInstitutionCause]\nAuthority: [ROOT.GetBrilliantScientistAuthorityCause]"
brilliant_scientist_directorate_gui_dependence_tt: "§YDependence§! ranges from §Y0§! to §Y100§!. Higher Dependence means the state relies more heavily on Doctor Kruger's personal direction and is less able to contain him.\n\nInstitution: [ROOT.GetBrilliantScientistInstitutionCause]\nPriority: [ROOT.GetBrilliantScientistPriorityCause]\nAuthority: [ROOT.GetBrilliantScientistAuthorityCause]"
brilliant_scientist_directorate_gui_exposure_tt: "§YExposure§! ranges from §Y0§! to §Y100§!. Higher Exposure makes the programme easier for the public and foreign services to detect and target.\n\nAppointment: [ROOT.GetBrilliantScientistAppointmentCause]\nSecurity: [ROOT.GetBrilliantScientistSecurityCause]\nForeign record: [ROOT.GetBrilliantScientistDirectorateForeignStatus]"
brilliant_scientist_directorate_gui_capacity_tt: "§YCapacity§! ranges from §Y0§! to §Y100§!. Higher Capacity sustains a larger and more demanding project portfolio.\n\nPrimary laboratory: [ROOT.GetBrilliantScientistDirectoratePrimaryFacilityName]\nFacility condition: [ROOT.GetBrilliantScientistDirectorateFacilityStatus]\nResearch cohort: [ROOT.GetBrilliantScientistDirectorateResearchCohortStatus]"
brilliant_scientist_directorate_gui_control: "Government Control: [ROOT.GetBrilliantScientistGovernmentControl]"
brilliant_scientist_directorate_gui_control_tt: "Government Control summarizes the public evidence created by institutions, security, facilities, and project conduct."

