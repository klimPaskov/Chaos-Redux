l_english:
sp_cbrn_mechanized_smoke_screens: "Mechanized Smoke Screens"
sp_cbrn_mechanized_smoke_screens_desc: "Smoke generators and sealed vehicle drills let mechanized columns cross exposed ground under reduced observation. The protection against contaminated advances depends on actual mask reserves; the heavier generator trains consume steel and rubber."
sp_cbrn_mechanized_smoke_screens_complete_tt: "Mechanized battalions gain breakthrough. Protected advances reduce friendly exposure only while protective equipment is available."
sp_cbrn_collective_protection_systems: "Collective Protection Systems"
sp_cbrn_collective_protection_systems_desc: "Filtered shelters and pressurized crew compartments extend protection beyond an individual mask. The fixed installations and specialized vehicle fittings require a substantial industrial commitment."
sp_cbrn_collective_protection_systems_complete_tt: "Sheltered civilians and sealed vehicle crews receive additional exposure protection. Compatible flamethrower tanks and engineering vehicles can receive specialized fittings after their project and technology prerequisites are complete."
sp_cbrn_self_renewing_filters: "Self-Renewing Filters"
sp_cbrn_self_renewing_filters_desc: "Experimental regenerative cartridges extend time between mask replacements, but complex catalyst beds raise the industrial cost of every protected set. The process is speculative and demands advanced gas masks and collective protection."
sp_cbrn_self_renewing_filters_complete_tt: "Mask replacement losses fall, while gas-mask equipment becomes more expensive to produce."
sp_cbrn_phantom_mist: "Phantom Mist"
sp_cbrn_phantom_mist_desc: "A fictional aerosol formulated for disorientation and disrupted command, not mass casualties. Conventional damage remains low; containment controls and unrestricted authorization are required before the concept can enter service."
sp_cbrn_phantom_mist_complete_tt: "Unlocks a specialized low-casualty disruption effect in authorized chemical operations. It does not substitute for conventional firepower."
sp_cbrn_mass_vaccine_production: "Mass Vaccine Production"
sp_cbrn_mass_vaccine_production_desc: "Standardized cultures and cold-chain distribution support advance protection against identified pathogens. Each vaccine remains agent-specific, while building the production capacity consumes steel and rubber."
sp_cbrn_mass_vaccine_production_complete_tt: "Agent-specific vaccination lowers susceptibility to anthrax, plague, tularemia, and smallpox in territory under the national medical program."
sp_cbrn_field_antibiotics: "Field Antibiotics"
sp_cbrn_field_antibiotics_desc: "Portable antibiotic courses and trained field teams improve care for susceptible bacterial infections and casualty recovery. The courses cannot treat smallpox or an unknown agent; establishing the field network consumes steel and rubber."
sp_cbrn_field_antibiotics_complete_tt: "Field hospitals and CBRN medical detachments recover more casualties. Antibiotics reduce mortality from susceptible anthrax, plague, and tularemia infections only."
sp_cbrn_regenerative_serum: "Regenerative Serum"
sp_cbrn_regenerative_serum_desc: "A fictional tissue-repair serum accelerates recovery in protected military hospitals. Difficult synthesis diverts civilian industry, while the work opens a route to cloning research."
sp_cbrn_regenerative_serum_complete_tt: "Army recovery improves at a continuing civilian-industry cost. Regenerative research is a prerequisite for ordinary cloning discovery."
sp_cbrn_broad_spectrum_antiserum: "Broad-Spectrum Antiserum"
sp_cbrn_broad_spectrum_antiserum_desc: "Emergency antiserum stocks stabilize selected severe cases until an agent can be identified and treated. Limited supply and uncertain pathogen response prevent it from acting as a universal cure."
sp_cbrn_broad_spectrum_antiserum_complete_tt: "Emergency treatment reduces mortality in eligible outbreaks. Pathogen-specific prevention and treatment remain necessary; the antiserum never clears an outbreak by itself."
cbrn_project_regenerative_serum_idea: "Regenerative Serum Hospitals"
cbrn_project_regenerative_serum_idea_desc: "Military recovery wards receive a costly experimental serum. Civilian industry supplies the demanding production process."
sp_cbrn_protection_trial_reward: "Protective System Trials"
sp_cbrn_protection_trial_reward_desc: "Field trials have reached a decision point. Controlled testing improves confidence but delays deployment; rushing the trial brings the schedule forward at a political cost."
sp_cbrn_protection_trial_controlled: "Keep the trial controlled"
sp_cbrn_protection_trial_controlled_tt: "Careful testing improves stability but slows the project."
sp_cbrn_protection_trial_rushed: "Accelerate deployment"
sp_cbrn_protection_trial_rushed_tt: "A rushed trial advances the project but reduces stability."
sp_cbrn_phantom_trial_reward: "Aerosol Containment Trial"
sp_cbrn_phantom_trial_reward_desc: "The new aerosol remains difficult to confine during tests. Closed-chamber work protects personnel but slows research; an open-air trial advances it at a public cost."
sp_cbrn_phantom_trial_contained: "Continue closed-chamber testing"
sp_cbrn_phantom_trial_contained_tt: "Containment slows the project."
sp_cbrn_phantom_trial_open_air: "Authorize an open-air trial"
sp_cbrn_phantom_trial_open_air_tt: "The trial advances the project but lowers war support."
sp_cbrn_medical_trial_reward: "Medical Production Trials"
sp_cbrn_medical_trial_reward_desc: "The pilot batches can pass a full clinical review or be moved into emergency production. Review earns public confidence but takes time; an emergency schedule carries political risk."
sp_cbrn_medical_trial_reviewed: "Complete the review"
sp_cbrn_medical_trial_reviewed_tt: "A full review improves stability but slows the project."
sp_cbrn_medical_trial_emergency: "Begin emergency production"
sp_cbrn_medical_trial_emergency_tt: "Emergency production advances the project but reduces stability."
cbrn_ordinary_unlicensed_trial_risky_tt: "An unlicensed trial advances the project but reduces stability."
cbrn_ordinary_biomedical_acceleration_complete_tt: "Biomedical acceleration strengthens the national medical program and opens further research."
cbrn_ordinary_cloning_complete_tt: "Cloning research establishes an operational replicated-body program."
cbrn_ordinary_paleogenetics_complete_tt: "Paleogenetic research establishes an operational recovered-genome program."
cbrn_ordinary_xenobiological_complete_tt: "Xenobiological research establishes an operational synthesis program."
