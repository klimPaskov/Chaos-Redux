l_english:
chaosx.nr26.1.t: "Desert Industry"

chaosx.nr26.2.t: "Move Industry to desert?"
chaosx.nr26.2.d: "[ROOT.GetName]'s cities are filling with workers and families, while factories crowd the urban core. Operation Desert Forge would move industrial production into the desert and leave more room for housing."
chaosx.nr26.2.a: "Secure our industry!"
chaosx.nr26.2.b: "Keep the factories in the cities."

chaosx.news.27.t: "Desert Industry"
chaosx.news.27.d: "[FROM.GetName] has completed Operation Desert Forge and moved its industrial base into the desert. Urban districts now have room to expand, while the factories sit behind new defensive lines."
chaosx.news.27.a: "The relocation is complete."
