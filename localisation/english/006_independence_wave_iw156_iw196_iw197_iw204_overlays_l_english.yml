  independence_wave_iw156_convene_moluccan_congress: "Convene the Moluccan Congress"
  independence_wave_iw156_convene_moluccan_congress_desc: "Island councils, port officers, customary authorities, and veterans must share a provisional congress before the democratic Moluccan identity can carry a federal charter."
  independence_wave_iw156_convene_moluccan_congress_effect_tt: "The congress improves maritime mobility and federal legitimacy while island logistics absorb the first coordination cost."
  independence_wave_iw156_secure_moluccan_interisland_depots: "Secure the Inter-Island Depots"
  independence_wave_iw156_secure_moluccan_interisland_depots_desc: "Transport crews and depot officers connect the Moluccan islands to the state 668 anchor without pretending that a distant sponsor has solved local logistics."
  independence_wave_iw156_secure_moluccan_interisland_depots_effect_tt: "The inter-island chain improves mobility but temporarily strains island logistics."
  independence_wave_iw156_integrate_moluccan_island_guard: "Integrate the Island Guard"
  independence_wave_iw156_integrate_moluccan_island_guard_desc: "Island guards and local infantry receive one service charter while officers record which communities supplied each formation."
  independence_wave_iw156_integrate_moluccan_island_guard_effect_tt: "Island integration strengthens the congress while consuming some federal capacity."
  independence_wave_iw156_hold_moluccan_sea_lanes: "Hold the Moluccan Sea Lanes"
  independence_wave_iw156_hold_moluccan_sea_lanes_desc: "Keep a supplied guard in state 668 while democratic TNE controls its Moluccan anchor."
  independence_wave_iw156_hold_moluccan_sea_lanes_success_effect_tt: "The island guard demonstrates that the federation can defend its own sea lanes."
  independence_wave_iw156_hold_moluccan_sea_lanes_failure_effect_tt: "The island guard failed, damaging stability and federal legitimacy."
  independence_wave_iw156_ratify_moluccan_charter: "Ratify the Moluccan Charter"
  independence_wave_iw156_ratify_moluccan_charter_desc: "A federal compact gives island, port, customary, municipal, and veteran interests a written voice before any settlement is considered."
  independence_wave_iw156_ratify_moluccan_charter_effect_tt: "The congress records a sea-lane defense charter and federal compact without creating a new Moluccan tag."
  independence_wave_iw156_moluccan_contested_congress: "Contested Moluccan Congress"
  independence_wave_iw156_moluccan_contested_congress_desc: "The provisional congress still balances island, port, customary, municipal, veteran, and sponsor interests."
  independence_wave_iw156_moluccan_integrated_island_guard: "Integrated Moluccan Island Guard"
  independence_wave_iw156_moluccan_integrated_island_guard_desc: "The provisional congress has aligned island forces and depots under a common maritime command."
  independence_wave_iw156_moluccan_federal_compact: "Moluccan Federal Compact"
  independence_wave_iw156_moluccan_federal_compact_desc: "The member islands and their institutions have recorded a common federal settlement."
  independence_wave_iw156_moluccan_charter: "Moluccan Sea-Lane Charter"
  independence_wave_iw156_moluccan_charter_desc: "Island councils and port authorities share responsibility for federal defense."

