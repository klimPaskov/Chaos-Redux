l_english:

chaosx.nr18.1.t: "The Ground Gives an Answer"
chaosx.nr18.1.d: "Surveyors working in [resources_found_field_state.GetName] have opened a vast [resources_found_field_state.GetResourcesFoundLastResourceName] deposit whose breadth has no place in their cautious reports. Samples arrive under armed seal while engineers argue over the roads, labor, and machinery that must follow. The discovery can transform our country, but the first signature placed upon it will decide who commands the field when the crowds arrive."
chaosx.nr18.1.a: "Place the field under national authority."
chaosx.nr18.1.a.tt: "The new deposit remains in [ROOT.GetAdjective] hands. Direct state administration controls later development and resists foreign leverage."
chaosx.nr18.1.b: "Issue a domestic charter."
chaosx.nr18.1.b.tt: "Licensed domestic firms control development. The field stays national and favors faster output growth at the cost of greater foreign interest."
chaosx.nr18.1.c: "Invite a foreign concession."
chaosx.nr18.1.c.tt: "The new deposit remains under our ownership. Foreign governments may negotiate development rights and resource access."
chaosx.nr18.1.e: "Hold the deposit as a strategic reserve."
chaosx.nr18.1.e.tt: "The new deposit is guarded for later use. The field forgoes active development in favor of lower excavation risk."

chaosx.nr18.2.t: "Another Vein Beneath [resources_found_field_state.GetName]"
chaosx.nr18.2.d: "A second survey line has crossed [resources_found_field_state.GetResourcesFoundLastResourceName] beyond the known deposit. The samples enlarge the field, deepen its workings, and draw fresh attention from every ministry and buyer already watching the site."
chaosx.nr18.2.a: "Fold the new vein into the works."
chaosx.nr18.2.a.tt: "The new deposit joins the active works. Development advances as excavation depth and foreign pressure continue to rise."
chaosx.nr18.2.b: "Mark it, seal it, and wait."
chaosx.nr18.2.b.tt: "The new deposit remains in the state. Where conditions allow, extraction is suspended, output falls, and active contracts enter review."

chaosx.nr18.3.t: "A Survey Line Breaks Through"
chaosx.nr18.3.d: "The appraisal crews have closed the last gap between scattered samples and a coherent underground map. Their new plates show where deeper work could begin, where a transport corridor could carry the field, and where untouched ground might remain a reserve against an uncertain future."
chaosx.nr18.3.a: "Authorize the deeper survey."
chaosx.nr18.3.a.tt: "The field advances toward development and opens the route for deeper appraisal work."
chaosx.nr18.3.b: "Map the transport approaches first."
chaosx.nr18.3.b.tt: "Transport planning receives priority, preparing the field for a durable road or rail corridor."
chaosx.nr18.3.c: "Leave the deepest lines unopened."
chaosx.nr18.3.c.tt: "The field is restrained and suspended where possible, preserving the unworked deposit."

chaosx.nr18.4.t: "The First Foreign Inquiry"
chaosx.nr18.4.d: "A foreign commercial mission has requested technical access to [resources_found_field_state.GetName]. Its language is courteous. Attached shipping schedules and credit offers reveal weeks of preparation. Refusing the meeting will not erase their interest, and accepting it will begin a contest over terms."
chaosx.nr18.4.a: "Receive the delegation."
chaosx.nr18.4.a.tt: "Foreign interest becomes an open negotiation and the contract route begins."
chaosx.nr18.4.b: "Tell them the surveys are incomplete."
chaosx.nr18.4.b.tt: "The inquiry is deferred while the field remains under appraisal."
chaosx.nr18.4.c: "Reserve every shipment for ourselves."
chaosx.nr18.4.c.tt: "The inquiry is refused and the field moves toward a strategic reserve posture."

chaosx.nr18.5.t: "Bids Crowd the Cabinet Table"
chaosx.nr18.5.d: "One offer has become several. Buyers promise machinery, transport, political support, and prices that cannot all remain honest once the first train leaves the field. Our negotiators can select a partner, divide access among rivals, or refuse to grant anyone an exclusive claim."
chaosx.nr18.5.a: "Choose the strongest bid."
chaosx.nr18.5.a.tt: "A preferred bid is selected and contract negotiations continue toward a single partner."
chaosx.nr18.5.b: "Balance the buyers against one another."
chaosx.nr18.5.b.tt: "Access remains diversified, preserving several negotiating channels and reducing dependence on one buyer."
chaosx.nr18.5.c: "No foreign power receives exclusivity."
chaosx.nr18.5.c.tt: "Exclusive negotiations end and the field returns to independent administration."

chaosx.nr18.6.t: "The Export Contract Is Signed"
chaosx.nr18.6.d: "The final pages carry the seals of both parties. Inspectors will count the loads, railway officials will guard the schedules, and diplomats will measure every interruption as carefully as the ore itself. The agreement has become a living obligation rather than a promise."
chaosx.nr18.6.a: "Honor the terms."
chaosx.nr18.6.a.tt: "The prepared partner becomes the active contract partner and the delivery relationship begins."

chaosx.nr18.7.t: "The Contracted Trains Stand Still"
chaosx.nr18.7.d: "The agreed shipments cannot move. Fighting, damaged approaches, suspended work, or a broken line of control has left loaded wagons idle beneath guard. Our partner demands a date. No official can promise one without choosing what survives the interruption."
chaosx.nr18.7.a: "Restore the delivery route."
chaosx.nr18.7.a.tt: "The contract is suspended for restoration and remains eligible to resume after the field route is secured."
chaosx.nr18.7.b: "Renegotiate every obligation."
chaosx.nr18.7.b.tt: "The contract enters formal review while the field's new circumstances are assessed."
chaosx.nr18.7.c: "End the agreement."
chaosx.nr18.7.c.tt: "The active contract is terminated and its pending review is closed."

chaosx.nr18.8.t: "The Nationalization Claim"
chaosx.nr18.8.d: "The concession offices have been placed under our seal, and their former managers now speak through diplomats. They demand compensation for machinery, surveys, and rights that our government no longer recognizes in full. A hard settlement may secure the field quickly, while arbitration could contain the wider dispute."
chaosx.nr18.8.a: "The field belongs to the nation."
chaosx.nr18.8.a.tt: "The concession ends, the field returns to national authority, and the former partner's claim remains contested."
chaosx.nr18.8.b: "Offer a compensation settlement."
chaosx.nr18.8.b.tt: "The contract enters review while compensation terms are negotiated."
chaosx.nr18.8.c: "Submit the dispute to arbitration."
chaosx.nr18.8.c.tt: "An international commission route opens to arbitrate the nationalization claim."

chaosx.nr18.9.t: "The Last Claim Is Settled"
chaosx.nr18.9.d: "The former partner has accepted the closing account. Neither side has received everything it demanded, but the warehouses, rail schedules, and survey records are no longer held hostage to the dispute. The field can proceed without an unresolved foreign claim."
chaosx.nr18.9.a: "Close the account."
chaosx.nr18.9.a.tt: "The compensation settlement ends the former contract claim and clears the pending review."

chaosx.nr18.10.t: "A Smuggling Road in the Dust"
chaosx.nr18.10.d: "Field guards followed missing loads beyond the official weigh station and found a private road lined with false manifests. Workers, carriers, and foreign brokers have built a trade beneath the legal one. The network can be broken, absorbed, or used as evidence against those who financed it."
chaosx.nr18.10.a: "Break the network and prosecute its keepers."
chaosx.nr18.10.a.tt: "The smuggling network is suppressed and field security treats further diversion as a hostile act."
chaosx.nr18.10.b: "Bring the trade under license."
chaosx.nr18.10.b.tt: "Limited trade is regularized under a domestic charter instead of remaining underground."
chaosx.nr18.10.c: "Name the foreign sponsor."
chaosx.nr18.10.c.tt: "The suspected sponsor is publicly accused, opening a diplomatic incident around the field."

chaosx.nr18.11.t: "The Charge Was Placed by Hand"
chaosx.nr18.11.d: "Engineers examining the damaged works have ruled out an accident. The charge sat behind a brace where only someone with plans and access could have placed it. Fragments of equipment and a chain of payments point beyond the field, though exposing the evidence will widen the confrontation."
chaosx.nr18.11.a: "Demand an answer through official channels."
chaosx.nr18.11.a.tt: "A formal diplomatic demand is prepared around the sabotage evidence."
chaosx.nr18.11.b: "Send our own people after the network."
chaosx.nr18.11.b.tt: "A counteroperation begins against the suspected sabotage network."
chaosx.nr18.11.c: "Keep the evidence inside the ministry."
chaosx.nr18.11.c.tt: "The sabotage is concealed to avoid an immediate international confrontation."

chaosx.nr18.12.t: "A Field Under a New Flag"
chaosx.nr18.12.d: "The legal owner of [resources_found_field_state.GetName] has changed, but the deposit, contracts, and machinery remain where they stood. Foreign agents have arrived with copies of old agreements while local officials wait for instructions. The new authority must decide which obligations crossed the border with the land."
chaosx.nr18.12.a: "Honor the existing contracts."
chaosx.nr18.12.a.tt: "Valid field contracts are honored under the new owner and their review is closed."
chaosx.nr18.12.b: "Renegotiate from the first page."
chaosx.nr18.12.b.tt: "Every inherited contract enters review under the new administration."
chaosx.nr18.12.c: "Nationalize the entire field."
chaosx.nr18.12.c.tt: "Inherited contracts end and the field adopts direct national authority."
chaosx.nr18.12.e: "Suspend the workings until the claims are clear."
chaosx.nr18.12.e.tt: "The field is suspended where conditions permit while inherited rights and records are examined."

chaosx.nr18.13.t: "Soldiers at the Loading Yard"
chaosx.nr18.13.d: "The legal owner no longer controls the approaches to [resources_found_field_state.GetName]. Armed men count the trains, guard the pumps, and question the crews while distant ministries still claim the output. Occupation has turned every shift into a decision about exploitation, denial, and survival."
chaosx.nr18.13.a: "Work the field for the war effort."
chaosx.nr18.13.a.tt: "The occupying authority marks the field for wartime exploitation."
chaosx.nr18.13.b: "Deny the deposit to every army."
chaosx.nr18.13.b.tt: "The field is marked for denial rather than continued extraction."
chaosx.nr18.13.c: "Guard the plant and keep the crews intact."
chaosx.nr18.13.c.tt: "The occupied field receives a guarded continuity policy that protects its machinery and workforce."

chaosx.nr18.14.t: "The Field Becomes an Institution"
chaosx.nr18.14.d: "Temporary huts have become offices, survey roads have become towns, and a generation of contracts now depends upon the output of [resources_found_field_state.GetName]. The field is mature enough to outlive its founders. Its permanent identity must match the country that has grown around it."
chaosx.nr18.14.a: "Make it a national estate."
chaosx.nr18.14.a.tt: "The mature field adopts a permanent national identity under direct authority."
chaosx.nr18.14.b: "Entrust it to domestic industry."
chaosx.nr18.14.b.tt: "The mature field adopts a commercial identity led by domestic chartered interests."
chaosx.nr18.14.c: "Bind its future to the concession."
chaosx.nr18.14.c.tt: "The mature field adopts a concession identity centered on a valid foreign partnership."
chaosx.nr18.14.f: "Preserve the international commission."
chaosx.nr18.14.f.tt: "The mature field adopts a supervised commission identity and keeps its cooperative safeguards."
chaosx.nr18.14.e: "Keep the deepest wealth in reserve."
chaosx.nr18.14.e.tt: "The mature field adopts a strategic reserve identity that favors restraint and long-term control."

chaosx.nr18.15.t: "The Last Shaft Is Filled"
chaosx.nr18.15.d: "The closure crews have withdrawn behind the final barrier in [resources_found_field_state.GetName]. Survey plates, pumps, and rails that once promised abundance lie beneath packed stone. The field's added resources can now be removed from the national ledger, leaving the sealed ground to settle in silence."
chaosx.nr18.15.a: "Close the field and its accounts."
chaosx.nr18.15.a.tt: "Every registered discovery deposit is removed from the state. The field and its accounts close permanently."

chaosx.nr18.20.t: "Survey Stakes Across the Line"
chaosx.nr18.20.d: "Crews from a neighboring claimant have planted survey markers inside the approaches to [resources_found_field_state.GetName]. Their maps describe the ground as disputed and their guards describe the markers as lawful. Removing them may defend our claim, but every road through the frontier is already carrying rumors of a richer border than either side expected."
chaosx.nr18.20.a: "Send the maps to arbitration."
chaosx.nr18.20.a.tt: "The border dispute remains at the survey stage while an arbitration route is opened."
chaosx.nr18.20.b: "Expel the foreign crews."
chaosx.nr18.20.b.tt: "The survey teams are expelled and the dispute advances toward a road confrontation."
chaosx.nr18.20.c: "Propose a joint survey."
chaosx.nr18.20.c.tt: "Both sides retain survey access while a shared technical record is prepared."
chaosx.nr18.20.e: "Reinforce our administration on the ground."
chaosx.nr18.20.e.tt: "Field administration is reinforced and the dispute advances toward control of the frontier roads."

chaosx.nr18.21.t: "The Customs Road Is Blocked"
chaosx.nr18.21.d: "Two lines of barriers now face one another on the road serving [resources_found_field_state.GetName]. Drivers wait between them with documents that satisfy neither side. A withdrawal could reopen the road, a corridor could divide authority, or more guards could make the next encounter an armed one."
chaosx.nr18.21.a: "Withdraw the forward checkpoints."
chaosx.nr18.21.a.tt: "The confrontation ends in a border settlement and the forward barriers are removed."
chaosx.nr18.21.b: "Negotiate a customs corridor."
chaosx.nr18.21.b.tt: "The road returns to the survey stage under a negotiated customs corridor."
chaosx.nr18.21.c: "Send more guards to the road."
chaosx.nr18.21.c.tt: "The confrontation advances to armed patrols along the field approaches."

chaosx.nr18.22.t: "Shots Between the Survey Posts"
chaosx.nr18.22.d: "A patrol returned with wounded men, captured equipment, and incompatible accounts of who crossed the line first. The frontier is still quiet enough for an apology or a mediator, but local commanders are asking for objectives and authority before the next patrol leaves."
chaosx.nr18.22.a: "Issue an apology and stand down."
chaosx.nr18.22.a.tt: "The armed incident ends in a settlement and our patrols leave the contested ground."
chaosx.nr18.22.b: "Place the blame before the world."
chaosx.nr18.22.b.tt: "The claimant is blamed and the dispute advances toward a timed frontier contest."
chaosx.nr18.22.c: "Give the frontier command a clear mission."
chaosx.nr18.22.c.tt: "A frontier mission is requested to establish leverage without immediate general war."
chaosx.nr18.22.e: "Invite a neutral mediator."
chaosx.nr18.22.e.tt: "A commission proposal opens as an alternative to further armed escalation."

chaosx.nr18.23.t: "The Frontier Objective Is Held"
chaosx.nr18.23.d: "The mission has ended with our posts supplied, our approaches open, and the contested ground under effective supervision. Even the claimant's officers must bargain from the map our troops have made real. The advantage can now be turned into a settlement."
chaosx.nr18.23.a: "Use the victory at the table."
chaosx.nr18.23.a.tt: "The frontier mission ends successfully, granting the owner leverage in the border settlement."

chaosx.nr18.24.t: "The Frontier Mission Fails"
chaosx.nr18.24.d: "The objective could not be held before the mission clock expired. Supply broke down, the posts were forced back, or the claimant established the stronger line. We can concede practical access, seek a commission, or accept the risk of a limited border war if both sides are ready."
chaosx.nr18.24.a: "Concede a controlled route."
chaosx.nr18.24.a.tt: "The dispute ends in a settlement that grants the claimant limited frontier access."
chaosx.nr18.24.b: "Accept an international commission."
chaosx.nr18.24.b.tt: "A commission proposal opens to settle the failed frontier contest."
chaosx.nr18.24.c: "Let the border decide."
chaosx.nr18.24.c.tt: "When both sides meet the military conditions, the dispute advances to a limited border war."

chaosx.nr18.25.t: "War for the Field Road"
chaosx.nr18.25.d: "The last negotiators have left the frontier, and the local commands have received their objectives. The struggle is limited on paper, though every ridge and depot around [resources_found_field_state.GetName] now carries the weight of the deposit beneath it. Victory will determine who writes the settlement."
chaosx.nr18.25.a: "The contest has begun."
chaosx.nr18.25.a.tt: "The field enters the active border-war stage and its result will determine the settlement route."

chaosx.nr18.26.t: "Our Line Holds"
chaosx.nr18.26.d: "The claimant's troops have withdrawn from the contested approaches. Our administration remains in [resources_found_field_state.GetName], and the survey stakes that began the crisis lie behind our line. We can confirm the border, soften the result with compensation, or close the field to the defeated claimant."
chaosx.nr18.26.a: "Confirm the border without further terms."
chaosx.nr18.26.a.tt: "The owner records a decisive border victory and the field remains under its authority."
chaosx.nr18.26.b: "Offer compensation for the abandoned claim."
chaosx.nr18.26.b.tt: "The owner keeps the field while opening a compensatory settlement."
chaosx.nr18.26.c: "Exclude the claimant from the field."
chaosx.nr18.26.c.tt: "The owner keeps the field and imposes a strict exclusion settlement."

chaosx.nr18.27.t: "The Claimant Takes the Field"
chaosx.nr18.27.d: "Our frontier positions have broken, and the claimant now controls the roads that sustain [resources_found_field_state.GetName]. The settlement follows the ground rather than the old documents. The field record, resource ledger, and inherited obligations must pass intact to the victorious owner."
chaosx.nr18.27.a: "Transfer the field under the settlement."
chaosx.nr18.27.a.tt: "The field transfers to the victorious claimant. Its resources, contracts, and operating history remain attached to the state."

chaosx.nr18.28.t: "Neither Line Can Advance"
chaosx.nr18.28.d: "The border war has consumed its strength without producing a decision. Both sides hold enough ground to deny the other a clean victory, and every new attack threatens to escape the limits imposed upon it. A commission or demilitarized settlement can end the contest, though neither claim has disappeared."
chaosx.nr18.28.a: "Place the field under a commission."
chaosx.nr18.28.a.tt: "The border war ends and an international commission route opens."
chaosx.nr18.28.b: "Demilitarize the approaches."
chaosx.nr18.28.b.tt: "The border war ends in a demilitarized settlement around the field."
chaosx.nr18.28.c: "Withdraw for now and preserve the claim."
chaosx.nr18.28.c.tt: "The fighting ends, but the dispute returns to competing surveys rather than a final settlement."

chaosx.nr18.29.t: "A Commission for [resources_found_field_state.GetName]"
chaosx.nr18.29.d: "The proposed commission would place inspectors, quotas, and troop limits around the field. Its sponsors promise that no claimant will gain the deposit by surprise. They also expect access to records that our administration has kept behind guarded doors."
chaosx.nr18.29.a: "Accept the commission's terms."
chaosx.nr18.29.a.tt: "The prepared sponsor activates the commission and the field adopts international administration."
chaosx.nr18.29.b: "Demand revised quotas and powers."
chaosx.nr18.29.b.tt: "The commission remains under negotiation while its authority and quotas are revised."
chaosx.nr18.29.c: "Reject foreign supervision."
chaosx.nr18.29.c.tt: "The commission proposal ends and the field remains under unilateral control."

chaosx.nr18.30.t: "Inspectors at Every Gate"
chaosx.nr18.30.d: "The commission has opened its offices beside the field administration. Foreign inspectors count shipments, local officers enforce the troop limits, and claimants receive the same stamped production tables. The arrangement constrains every participant, which is why it may hold."
chaosx.nr18.30.a: "Observe the quotas and the limits."
chaosx.nr18.30.a.tt: "The commission becomes active, border dispute markers are cleared, and supervised quotas govern the field."

chaosx.nr18.31.t: "The Commission Seal Is Broken"
chaosx.nr18.31.d: "Inspectors have recorded a violation in [resources_found_field_state.GetName]. Troops, fortifications, hidden shipments, or barred records have breached the terms that kept the claimants apart. Compliance can still be restored, but accusation and withdrawal now carry their own constituencies."
chaosx.nr18.31.a: "Restore compliance at once."
chaosx.nr18.31.a.tt: "The violation is cleared and the commission returns to active supervision."
chaosx.nr18.31.b: "Publish the breach and name its author."
chaosx.nr18.31.b.tt: "The violation becomes a public accusation while the commission remains under strain."
chaosx.nr18.31.c: "Withdraw from the commission."
chaosx.nr18.31.c.tt: "The commission dissolves and its supervision over the field ends."

chaosx.nr18.32.t: "The Commission Leaves"
chaosx.nr18.32.d: "The last inspectors have packed their ledgers and lowered their flag. The field remains, along with the interests that made supervision necessary. We can return it to national administration or attempt a narrower successor arrangement before the old competition hardens again."
chaosx.nr18.32.a: "Return the field to national control."
chaosx.nr18.32.a.tt: "Commission state is cleared and the field returns to direct national authority."
chaosx.nr18.32.b: "Negotiate a successor arrangement."
chaosx.nr18.32.b.tt: "The former commission reenters negotiation as a narrower successor agreement."

chaosx.nr18.40.t: "A Field of Many Seams"
chaosx.nr18.40.d: "The latest cores from [resources_found_field_state.GetName] contain several valuable materials in the same broken formation. Separate industries are already tracing their own paths into the deposit, and a field once managed as a single concern has become a compound prize. Its administration must be able to govern abundance without letting every concession dig its own country underground."
chaosx.nr18.40.a: "Centralize every working."
chaosx.nr18.40.a.tt: "The compound field adopts national authority and a single centralized administration."
chaosx.nr18.40.b: "Divide the seams among concessions."
chaosx.nr18.40.b.tt: "The compound field adopts a concession posture with access divided among commercial partners."
chaosx.nr18.40.c: "Ration the output between industries."
chaosx.nr18.40.c.tt: "The compound field adopts a reserve posture and its output is allocated strategically."
chaosx.nr18.40.e: "Restrain the works before they sprawl."
chaosx.nr18.40.e.tt: "The compound field is restrained and suspended where conditions allow."

chaosx.nr18.41.t: "Riches in the Same Stone"
chaosx.nr18.41.d: "The first shafts in [resources_found_field_state.GetName] have struck more than one valuable seam. Engineers pass samples from hand to hand because no ordinary opening survey should reveal such variety at once. The field begins its life as a compound deposit, and the institutions chosen today will govern several industries rather than one."
chaosx.nr18.41.a: "Create a national field authority."
chaosx.nr18.41.a.tt: "The evolved opening remains under direct national administration."
chaosx.nr18.41.b: "Charter a domestic development board."
chaosx.nr18.41.b.tt: "The evolved opening adopts a domestic charter for coordinated multi-resource development."
chaosx.nr18.41.c: "Reserve the richest seams."
chaosx.nr18.41.c.tt: "The evolved opening adopts a strategic reserve posture before the compound works expand."

chaosx.nr18.42.t: "The Integrated Corridor Opens"
chaosx.nr18.42.d: "The new corridor binds pit, plant, railway, and settlement into one continuous industrial route. Loads that once waited on mud roads can move by schedule, and every seam in the compound field can reach a specialized processor. The corridor can feed domestic industry first or become the spine of an export system."
chaosx.nr18.42.a: "Domestic factories receive priority."
chaosx.nr18.42.a.tt: "The completed corridor is organized around national industrial demand."
chaosx.nr18.42.b: "Build the schedules around export trains."
chaosx.nr18.42.b.tt: "The completed corridor is organized around exports and opens wider foreign interest."

chaosx.nr18.43.t: "The World Rushes Toward [resources_found_field_state.GetName]"
chaosx.nr18.43.d: "Bankers, purchasing missions, engineers, and intelligence officers have arrived behind different flags and nearly identical smiles. The compound field is too large to remain a provincial secret. Opening its market may finance rapid growth, reserving output may protect our strategy, and a commission may keep the gathering powers from turning bids into threats."
chaosx.nr18.43.a: "Open the field to international buyers."
chaosx.nr18.43.a.tt: "The field adopts a foreign concession posture and opens an international market route."
chaosx.nr18.43.b: "Reserve the output for national needs."
chaosx.nr18.43.b.tt: "The field adopts a strategic reserve posture despite the international rush."
chaosx.nr18.43.c: "Seek an international commission."
chaosx.nr18.43.c.tt: "A commission proposal opens to manage the field's global competition."

chaosx.nr18.44.t: "The Demilitarized Corridor"
chaosx.nr18.44.d: "Negotiators have drawn a line around the field where heavy units, new forts, and unilateral checkpoints would be forbidden. Inspectors argue that a demilitarized corridor can keep the compound wealth from becoming a permanent frontier crisis. Commanders answer that the field cannot be left defenseless."
chaosx.nr18.44.a: "Accept full demilitarization."
chaosx.nr18.44.a.tt: "The field enters a demilitarized commission regime with supervised troop limits."
chaosx.nr18.44.b: "Retain a limited guard force."
chaosx.nr18.44.b.tt: "The commission remains active while a limited field guard is retained."
chaosx.nr18.44.c: "Reject the corridor."
chaosx.nr18.44.c.tt: "Demilitarization is rejected and the commission route closes."

chaosx.nr18.50.t: "The Great Opening"
chaosx.nr18.50.d: "The first development blasts in [resources_found_field_state.GetName] have exposed a deposit larger than the surveyors' most ambitious plates. New galleries are being driven before the old ones have names, and work camps are filling faster than the roads can carry them. Deep crews report stale air and headaches, but every ordinary explanation still appears sufficient when considered alone."
chaosx.nr18.50.a: "Place the opening under state command."
chaosx.nr18.50.a.tt: "The large opening adopts national authority and begins its incident sequence under direct supervision."
chaosx.nr18.50.b: "Charter a domestic development board."
chaosx.nr18.50.b.tt: "The large opening adopts a domestic charter and begins accelerated development."
chaosx.nr18.50.c: "Bring in a concession with heavy machinery."
chaosx.nr18.50.c.tt: "The large opening adopts a foreign concession posture and exposes the field to wider outside interest."
chaosx.nr18.50.e: "Mark the deepest seams as a reserve."
chaosx.nr18.50.e.tt: "The large opening adopts a strategic reserve posture before its deepest workings are developed."

chaosx.nr18.51.t: "The Sickness in the Lower Crews"
chaosx.nr18.51.d: "Men leaving the lower galleries complain of fever, ringing ears, and dreams they cannot recount without shame. The clinic first blamed dust, then water, then exhaustion, but each explanation leaves a different group of patients unexplained. Production continues above them while the infirmary beds fill."
chaosx.nr18.51.a: "Open a full medical inspection."
chaosx.nr18.51.a.tt: "Medical inspection begins and the hidden disturbance becomes visible to field management."
chaosx.nr18.51.b: "Rotate every exposed crew."
chaosx.nr18.51.b.tt: "Crew rotation and restricted workings reduce future exposure at the cost of continuity."
chaosx.nr18.51.c: "Keep the reports inside the company."
chaosx.nr18.51.c.tt: "The sickness is concealed, increasing the danger of later exposure and worsening loss calculations."
chaosx.nr18.51.e: "The shifts continue."
chaosx.nr18.51.e.tt: "Extraction continues despite the sickness and the field records a coercive exploitation choice."

chaosx.nr18.52.t: "Metal That Rots Overnight"
chaosx.nr18.52.d: "New drill heads return pitted after a single shift. Cable housings split beneath an oily bloom, and replacement bolts crumble where they touch stone from the lowest gallery. The damage follows no familiar chemical pattern. Isolating the passage may save the works, while continued use risks carrying the corrosion farther."
chaosx.nr18.52.a: "Replace the affected machinery."
chaosx.nr18.52.a.tt: "Damaged machinery is replaced while the affected works operate under restriction."
chaosx.nr18.52.b: "Test the residue in every laboratory."
chaosx.nr18.52.b.tt: "A formal corrosion investigation begins and subsurface disturbance is exposed to management."
chaosx.nr18.52.c: "Isolate the gallery."
chaosx.nr18.52.c.tt: "The affected gallery is sealed and counted as a contained underground network."
chaosx.nr18.52.e: "Clean the tools and send them back."
chaosx.nr18.52.e.tt: "The damaged equipment returns to service and the field records continued exploitation."

chaosx.nr18.53.t: "The Shift That Did Not Return"
chaosx.nr18.53.d: "A full crew entered the lower workings and missed every signal to ascend. Searchers found lamps arranged beside an empty junction and a drag mark leading beyond the mapped stone. The number lost is entered in the national casualty register, even if officials choose to hide their names from the public."
chaosx.nr18.53.a: "Send a rescue party below."
chaosx.nr18.53.a.tt: "A rescue mission opens for the missing shift after the incident's real population loss is recorded."
chaosx.nr18.53.b: "Seal the passage behind them."
chaosx.nr18.53.b.tt: "The missing passage is sealed and counted as a contained network."
chaosx.nr18.53.c: "Alter the shift books."
chaosx.nr18.53.c.tt: "The disappearance is concealed, worsening later loss risk and public exposure."
chaosx.nr18.53.e: "No second crew follows them."
chaosx.nr18.53.e.tt: "The missing crew is abandoned and the field records a coercive exploitation choice."

chaosx.nr18.54.t: "The Knocking Follows"
chaosx.nr18.54.d: "Crews hear three measured knocks in the rock after the drills stop. When they move to another face, the sound returns from the wall beside them. The pattern follows men through separate galleries and ceases whenever a recorder is brought close."
chaosx.nr18.54.a: "Record every occurrence."
chaosx.nr18.54.a.tt: "The reports enter the official investigation and reveal subsurface disturbance."
chaosx.nr18.54.b: "Evacuate the lower workings."
chaosx.nr18.54.b.tt: "The lowest crews withdraw and the field adopts restricted workings."
chaosx.nr18.54.c: "Treat it as ordinary rock movement."
chaosx.nr18.54.c.tt: "The reports are dismissed and no protective response is ordered."
chaosx.nr18.54.e: "Follow the sound with an inspection team."
chaosx.nr18.54.e.tt: "A dedicated investigation follows the knocking through the lower works."

chaosx.nr18.55.t: "Every Ordinary Test Fails"
chaosx.nr18.55.d: "Dust, gas, water, fatigue, sabotage, and equipment failure explain fragments of the incidents. The whole remains unexplained. The inspection office has issued a single conclusion. Something beneath [resources_found_field_state.GetName] is disturbing the workings in ways the field cannot safely classify as ordinary."
chaosx.nr18.55.a: "Tell the workers what the tests found."
chaosx.nr18.55.a.tt: "Subsurface disturbance becomes public inside the field and restricted workings begin."
chaosx.nr18.55.b: "Classify the finding and continue the inquiry."
chaosx.nr18.55.b.tt: "Subsurface disturbance remains classified while formal inspection continues."

chaosx.nr18.56.t: "What the Searchers Carried Up"
chaosx.nr18.56.d: "The rescue team returned with a broken lamp, a strip of unfamiliar hide, and one survivor whose wounds do not match any tool in the field. The evidence is physical, bloodied, and impossible to explain with bad air. Soldiers and physicians have both requested custody before rumor reaches the gates."
chaosx.nr18.56.a: "Give the evidence to the army."
chaosx.nr18.56.a.tt: "Military study begins and opens a field countermeasure route."
chaosx.nr18.56.b: "Give it to the physicians."
chaosx.nr18.56.b.tt: "Medical study begins and strengthens the incident investigation."
chaosx.nr18.56.c: "Burn it and seal the chamber."
chaosx.nr18.56.c.tt: "The evidence is destroyed and the chamber is counted as a sealed network."
chaosx.nr18.56.e: "Release the evidence to the public."
chaosx.nr18.56.e.tt: "The physical evidence becomes public and draws wider foreign attention."

chaosx.nr18.57.t: "The Attack Below"
chaosx.nr18.57.d: "The lower gallery erupted in gunfire and screaming until its telephone went dead. Survivors describe pale shapes moving through drill smoke and carrying workers into cracks too narrow for a man. Names are missing from the shift rolls, and families wait at the sealed gate while the search teams prepare to descend."
chaosx.nr18.57.a: "Reach the trapped crews."
chaosx.nr18.57.a.tt: "An underground rescue begins after the incident's real population loss is recorded."
chaosx.nr18.57.b: "Sweep the galleries with armed teams."
chaosx.nr18.57.b.tt: "An armed sweep begins and contributes to practical countermeasure knowledge."
chaosx.nr18.57.c: "Close the lower works."
chaosx.nr18.57.c.tt: "A partial closure begins around the attacked galleries."
chaosx.nr18.57.e: "Keep the upper shifts moving."
chaosx.nr18.57.e.tt: "Extraction continues after the attack and the field records military exploitation."

chaosx.nr18.58.t: "The Hidden List Reaches Daylight"
chaosx.nr18.58.d: "Copies of a concealed casualty register have reached families and foreign offices. The dates contradict every statement issued by the field administration. The deaths remain in the national record. The list now demands responsibility, blame, suppression, or compensation."
chaosx.nr18.58.a: "Admit the deaths and open the books."
chaosx.nr18.58.a.tt: "Concealment ends, the deaths are admitted, and compensation negotiations open."
chaosx.nr18.58.b: "The concession ran the lower works."
chaosx.nr18.58.b.tt: "The concession partner is blamed and its contract enters formal review."
chaosx.nr18.58.c: "Seize every remaining copy."
chaosx.nr18.58.c.tt: "The casualty list is suppressed and concealment continues, worsening later incident risk."
chaosx.nr18.58.e: "Compensate every recorded family."
chaosx.nr18.58.e.tt: "Concealment ends and affected families receive priority in the compensation settlement."

chaosx.nr18.59.t: "Restricted Workings"
chaosx.nr18.59.d: "The deepest galleries are closed, crew movements are controlled, and the field hospital reports fewer new cases. [resources_found_field_state.GetName] has reached an uneasy stability without resolving what lives below. The reduced site can remain open, or the closure crews can begin the longer work of ending it completely."
chaosx.nr18.59.a: "Maintain the restricted field."
chaosx.nr18.59.a.tt: "The field remains active under restricted workings and coercive exploitation ends."
chaosx.nr18.59.b: "Authorize full-closure preparations."
chaosx.nr18.59.b.tt: "The closure intent is recorded without blocking the field. Once the present stabilization detail demobilizes, the priced full-seal decision becomes available when its engineering, evacuation, security, and contract requirements are met."

chaosx.nr18.60.t: "Every Resource in One Basin"
chaosx.nr18.60.d: "The opening at [resources_found_field_state.GetName] has revealed oil-bearing stone beside metals and rubber-bearing strata that should never have shared one formation. Six industries can read their future in the first samples. The field promises wealth on a global scale, while its pace of excavation leaves little time for institutions to catch up."
chaosx.nr18.60.a: "Place the basin under national command."
chaosx.nr18.60.a.tt: "The all-resource field adopts national authority and a centralized global-scale administration."
chaosx.nr18.60.b: "Propose an international commission."
chaosx.nr18.60.b.tt: "The all-resource field adopts an international posture and opens commission negotiations."
chaosx.nr18.60.c: "Reserve the basin before the rush begins."
chaosx.nr18.60.c.tt: "The all-resource field adopts a strategic reserve posture."

chaosx.nr18.61.t: "The Perimeter Breaks"
chaosx.nr18.61.d: "Field guards have lost an upper access point. Creatures crossed the fence under floodlights, killed men on the service road, and vanished into drainage cuts leading away from the works. The threat can no longer be confined to company reports. Breach Pressure is visible, and the public-crisis clock has begun."
chaosx.nr18.61.a: "Reinforce every access point."
chaosx.nr18.61.a.tt: "The perimeter receives military reinforcement and the countermeasure route expands."
chaosx.nr18.61.b: "Seal the lost approach."
chaosx.nr18.61.b.tt: "A partial closure begins around the breached access network."
chaosx.nr18.61.c: "Prepare the settlements for evacuation."
chaosx.nr18.61.c.tt: "Evacuation preparation begins before the attacks reach larger population centers."
chaosx.nr18.61.e: "Protect the shafts and keep extracting."
chaosx.nr18.61.e.tt: "Extraction continues during the public crisis and permanently records military exploitation."

chaosx.nr18.62.t: "The Outlying Settlement"
chaosx.nr18.62.d: "A worker settlement beyond the field fence was attacked in the last hours of darkness. Doors were broken inward, livestock scattered, and survivors followed the railway toward the guarded camps. Bodies remain in shattered homes and along the service road. The remaining families will judge us by what follows."
chaosx.nr18.62.a: "Hunt the pack before it returns below."
chaosx.nr18.62.a.tt: "A monster-hunt mission opens after the settlement attack's population loss is recorded."
chaosx.nr18.62.b: "Evacuate the remaining settlements."
chaosx.nr18.62.b.tt: "Civilian evacuation preparation begins around the threatened field settlements."
chaosx.nr18.62.c: "Fortify the road and rail approaches."
chaosx.nr18.62.c.tt: "The settlement route is fortified and practical countermeasure work continues."

chaosx.nr18.63.t: "The Train Does Not Arrive"
chaosx.nr18.63.d: "The field train was found across the line with its wagons opened and its guards missing. No shipment can move while the transport corridor remains exposed, and every contract tied to the route has stopped. Escorts, rerouting, abandonment, or foreign assistance will decide whether the field still has a surface lifeline."
chaosx.nr18.63.a: "Escort every train with troops."
chaosx.nr18.63.a.tt: "Armed escorts defend the transport corridor and contribute to the countermeasure route."
chaosx.nr18.63.b: "Reroute the line around the attacks."
chaosx.nr18.63.b.tt: "The transport route shifts and suspended contracts enter review."
chaosx.nr18.63.c: "Abandon the line and suspend the field."
chaosx.nr18.63.c.tt: "The damaged transport route is abandoned and extraction is suspended where possible."
chaosx.nr18.63.e: "Request foreign transport assistance."
chaosx.nr18.63.e.tt: "Foreign aid channels open around the threatened transport corridor."

chaosx.nr18.64.t: "Shapes in the City Streets"
chaosx.nr18.64.d: "The creatures have reached a populated district in [resources_found_field_state.GetName]. Police whistles and rifle fire move between darkened blocks while families crowd the roads out. Bodies lie where the first police lines collapsed. An urban hunt may contain the intrusion, but evacuation offers the only reliable protection for those still trapped."
chaosx.nr18.64.a: "Order an urban hunt."
chaosx.nr18.64.a.tt: "An urban monster-hunt mission opens after the city's population loss is recorded."
chaosx.nr18.64.b: "Begin mass evacuation."
chaosx.nr18.64.b.tt: "Mass evacuation preparation begins across the threatened district."
chaosx.nr18.64.c: "Abandon the district and close the field."
chaosx.nr18.64.c.tt: "The district is abandoned, evacuation begins, and the field is suspended where possible."

chaosx.nr18.65.t: "Aircraft from Abroad"
chaosx.nr18.65.d: "Foreign aircraft have arrived with offers marked for the crisis at [resources_found_field_state.GetName]. Engineering teams can reinforce the seals, weapons can equip the hunts, and trucks can carry civilians away. Every package creates influence, but refusing it leaves the country to face the breach with its own reserves."
chaosx.nr18.65.a: "Accept the engineering teams."
chaosx.nr18.65.a.tt: "Foreign engineers reinforce the sealing and containment route."
chaosx.nr18.65.b: "Accept weapons for the hunts."
chaosx.nr18.65.b.tt: "Foreign weapons support countermeasure research and armed hunting operations."
chaosx.nr18.65.c: "Accept evacuation transport."
chaosx.nr18.65.c.tt: "Foreign transport strengthens evacuation preparation."
chaosx.nr18.65.e: "We will contain this ourselves."
chaosx.nr18.65.e.tt: "The foreign aid offer is refused and no outside package is accepted."

chaosx.nr18.66.t: "The Hunt Returns"
chaosx.nr18.66.d: "The hunting column has returned with survivors, weapons marked by close fighting, and bodies that prove the creatures can be killed above ground. The success lowers fear even as it confirms the scale of the threat. Studying the remains may improve the next operation, while destroying them will deny the lower tunnels another trail to follow."
chaosx.nr18.66.a: "Study what the hunters recovered."
chaosx.nr18.66.a.tt: "The successful hunt is recorded and the remains support countermeasure research."
chaosx.nr18.66.b: "Destroy the remains completely."
chaosx.nr18.66.b.tt: "The successful hunt is recorded and the remains are destroyed as part of the sealing route."

chaosx.nr18.67.t: "No Signal from the Hunt"
chaosx.nr18.67.d: "The hunting column missed its return time. Those who reached the perimeter carried fewer weapons than they took and would not describe what followed them through the cut. The missing are entered as dead after the last search party returns empty-handed. We can withdraw, reinforce, or hide the failure."
chaosx.nr18.67.a: "Withdraw the survivors and close the route."
chaosx.nr18.67.a.tt: "The failed hunt's loss is recorded and the field adopts restricted workings."
chaosx.nr18.67.b: "Prepare a stronger second hunt."
chaosx.nr18.67.b.tt: "The failed hunt's loss is recorded and a reinforced hunt mission opens."
chaosx.nr18.67.c: "Do not publish the casualty report."
chaosx.nr18.67.c.tt: "The failed hunt's losses remain in the national casualty register, but the public report is concealed."

chaosx.nr18.68.t: "The Last Civilian Convoy"
chaosx.nr18.68.d: "The final convoy has crossed the secured route out of [resources_found_field_state.GetName]. Empty houses and dark station platforms remain behind the perimeter, but the threatened population has reached prepared shelter. The field can be sealed without leaving a city in the path of the next breach."
chaosx.nr18.68.a: "Complete the relocation."
chaosx.nr18.68.a.tt: "The evacuation succeeds, reducing later incident losses and the strength of any assault that still breaks through."

chaosx.nr18.69.t: "The Road Closes Too Soon"
chaosx.nr18.69.d: "The evacuation route failed while civilians were still moving. Vehicles burned at the choke point, families scattered into fields, and the last organized convoy never reached the receiving station. The surviving passengers no longer match the convoy lists. The government must choose between an emergency retreat and abandonment."
chaosx.nr18.69.a: "Open an emergency retreat on foot."
chaosx.nr18.69.a.tt: "The evacuation failure's population loss is recorded and a partial emergency retreat continues."
chaosx.nr18.69.b: "The army must hold what remains."
chaosx.nr18.69.b.tt: "The evacuation failure's population loss is recorded and civilians outside the defended zone are abandoned."

chaosx.nr18.70.t: "The Lower Network Is Sealed"
chaosx.nr18.70.d: "Charges have collapsed the selected passages and concrete has filled the service shafts behind them. The reduced field is quieter, shallower, and less exposed, though the added resources remain in place and the sealed network does not guarantee permanent safety. We may hold the restricted site or continue toward a complete seal."
chaosx.nr18.70.a: "Hold the reduced field."
chaosx.nr18.70.a.tt: "The partial closure completes and the field remains active under restricted workings. A future cave emergence remains possible."
chaosx.nr18.70.b: "Order preparations for a full seal."
chaosx.nr18.70.b.tt: "The partial closure completes and the crews record an intention to seal the remaining works. Once they demobilize, the full-seal operation can be ordered and paid for separately."

chaosx.nr18.71.t: "Stone Over Every Door"
chaosx.nr18.71.d: "The closure crews have withdrawn from [resources_found_field_state.GetName] and broken the final access road behind them. Every mapped gallery lies under collapsed stone, flooded concrete, or packed earth. The wealth added by the field can be struck from the ledger, and nothing beneath it will receive another shift of workers."
chaosx.nr18.71.a: "Seal the record with the ground."
chaosx.nr18.71.a.tt: "All resources added by this field are removed from the state. The field closes permanently, no cave host can emerge from it, and nothing below will strike back after the seal succeeds."

chaosx.nr18.72.t: "The Seal Gives Way"
chaosx.nr18.72.d: "The final works failed before the barrier could be certified. A collapsed access opened into older galleries, the surface perimeter moved, or extraction resumed before the site was secure. The field remains active, and the failed attempt has given whatever lies below another path toward the surface."
chaosx.nr18.72.a: "Prepare another sealing attempt."
chaosx.nr18.72.a.tt: "The failed seal is recorded without leaving a phantom closure active. After the failed mission demobilizes, the relevant priced sealing decision remains available for a separately paid attempt."
chaosx.nr18.72.b: "Turn the works into a defensive line."
chaosx.nr18.72.b.tt: "The failed seal is recorded and the field prepares a final military defense."

chaosx.nr18.73.t: "The Last Window"
chaosx.nr18.73.d: "Engineers believe the main breach will open after one final interval. The estimate is short enough to force every convoy, train, and demolition team onto the same clock. An emergency seal can still prevent emergence if its requirements are completed, evacuation can save those outside the perimeter, and a military defense can prepare the state for what follows."
chaosx.nr18.73.a: "Commit everything to the emergency seal."
chaosx.nr18.73.a.tt: "A short, separately funded emergency closure begins only after evacuation, access control, engineering, security, and contract requirements are secured. If the crews finish in time, the field is sealed. If preparations collapse or access is lost, the attempt fails."
chaosx.nr18.73.b: "Use the interval for evacuation."
chaosx.nr18.73.b.tt: "The final interval is devoted to evacuation preparation, reducing later civilian loss if the breach occurs."
chaosx.nr18.73.c: "Prepare the state for battle."
chaosx.nr18.73.c.tt: "The final interval is devoted to a military defense and practical countermeasures."

chaosx.nr18.80.t: "The Country Beneath the Field"
chaosx.nr18.80.d: "The earth in [resources_found_cave_notice_state.GetName] opened beneath the defenses, and an army climbed through the ruined field. Its soldiers are armored in stone and metal taken from the workings. They call themselves the Oth-Kesh Host, recognize no surface border, and have made the lost state the first chamber of a country that intends to spread. Our government can organize resistance, seek aid, or abandon its former perspective and continue the struggle as the Host itself."
chaosx.nr18.80.a: "Organize resistance to the Host."
chaosx.nr18.80.a.tt: "The former owner enters the anti-cave war as an organized resistance power and gains the anti-cave contracts route."
chaosx.nr18.80.b: "Call for immediate foreign aid."
chaosx.nr18.80.b.tt: "The former owner opens emergency aid and threat-cooperation routes against the cave country."
chaosx.nr18.80.c: "Continue as the Oth-Kesh Host."
chaosx.nr18.80.c.tt: "You leave the former owner and take direct control of the Oth-Kesh Host. Both countries remember that this transfer was chosen."

chaosx.nr18.81.t: "Another Field Falls Inward"
chaosx.nr18.81.d: "The breach at [resources_found_cave_notice_state.GetName] did not create a second underground state. It opened a road to the existing Host. Oth-Kesh forces crossed the galleries, seized the field, and turned its resources into another anchor for the same growing country. The dispossessed administration must save what it can and choose how it will resist."
chaosx.nr18.81.a: "Evacuate the surviving state assets."
chaosx.nr18.81.a.tt: "Government assets are withdrawn and the former owner enters the anti-cave war as a participant."
chaosx.nr18.81.b: "Build a resistance around the lost field."
chaosx.nr18.81.b.tt: "The former owner organizes resistance and gains the anti-cave contracts route."
chaosx.nr18.81.c: "Seek an international response."
chaosx.nr18.81.c.tt: "The former owner requests emergency aid and gains the threat-cooperation route."

chaosx.nr18.82.t: "Mobilization at the Cave Frontier"
chaosx.nr18.82.d: "The Oth-Kesh Host has declared the surface around its chambers hostile ground. Roads leading toward [resources_found_cave_notice_state.GetName] carry refugees in one direction and columns in the other. Resource districts will become anchors if held long enough, while every neighboring country must prepare for a war whose supply lines run downward."
chaosx.nr18.82.a: "Break the first ring of surface states."
chaosx.nr18.82.a.tt: "The Host records its assault on the neighboring ring and aligns its expansion strategy with the active war."
chaosx.nr18.82.b: "Fortify every resource district."
chaosx.nr18.82.b.tt: "The neighboring country enters the cave war and gains anti-cave production contracts."
chaosx.nr18.82.c: "Request weapons that can pierce them."
chaosx.nr18.82.c.tt: "The neighboring country opens hard-attack aid and threat-cooperation routes."
chaosx.nr18.82.e: "Evacuate the exposed frontier."
chaosx.nr18.82.e.tt: "The neighboring country prepares a border evacuation and enters the cave-war response system."

chaosx.nr18.83.t: "What Stops the Stone Armor"
chaosx.nr18.83.d: "Reports from the first battles agree that ordinary rifle fire breaks against the Host's armored bodies. Concentrated anti-tank weapons, heavy armor, air attack, and delaying positions have each produced useful results under different conditions. Our doctrine must give commanders one clear priority before the next engagement."
chaosx.nr18.83.a: "Put anti-tank guns at the center."
chaosx.nr18.83.a.tt: "The country prioritizes anti-tank counterplay and gains anti-cave equipment contracts."
chaosx.nr18.83.b: "Meet armor with armor."
chaosx.nr18.83.b.tt: "The country prioritizes armored counterattacks and gains anti-cave equipment contracts."
chaosx.nr18.83.c: "Use the air to break their columns."
chaosx.nr18.83.c.tt: "The country prioritizes airpower and joins the threat-cooperation network."
chaosx.nr18.83.e: "Trade ground for time."
chaosx.nr18.83.e.tt: "The country adopts a delaying defense and becomes eligible for further cave-war aid."

chaosx.nr18.84.t: "An Anchor Begins to Feed"
chaosx.nr18.84.d: "The Host has held [resources_found_cave_notice_state.GetName] long enough to bind its resource sites into the chambers below. Loads vanish into guarded shafts, and fresh broods emerge in proportion to the captured wealth. The active anchor sustains the Host, and the deepest chambers have begun breeding new broods."
chaosx.nr18.84.a: "Let the chambers count their share."
chaosx.nr18.84.a.tt: "The active anchor is counted and the Host refreshes its current brood strength and carrying capacity."

chaosx.nr18.85.t: "The Anchor Goes Hungry"
chaosx.nr18.85.d: "Surface forces have broken control of an Oth-Kesh anchor. Its galleries remain, but the resource flow and brood capacity have fallen away after the grace period. The Host can make its recapture the first priority, consolidate around stronger chambers, or abandon the disrupted network."
chaosx.nr18.85.a: "Recapture the anchor."
chaosx.nr18.85.a.tt: "The Host makes the disrupted anchor its foremost military objective."
chaosx.nr18.85.b: "Consolidate around the surviving chambers."
chaosx.nr18.85.b.tt: "The Host recalculates capacity and adopts a defensive consolidation response."
chaosx.nr18.85.c: "Abandon the broken network."
chaosx.nr18.85.c.tt: "The Host accepts the lost anchor and refreshes its reduced brood capacity."

chaosx.nr18.86.t: "Broods Without a Chamber"
chaosx.nr18.86.d: "The Host commands more active broods than its surviving anchors can feed. Armor flakes from unfed soldiers, formation discipline weakens, and the chambers fight over every captured load. More anchors, a tighter army, or deliberate endurance can answer the deficit, but the excess cannot be hidden from the war."
chaosx.nr18.86.a: "Take new anchors before anything else."
chaosx.nr18.86.a.tt: "Resource-anchor targets receive priority in the Host's expansion strategy."
chaosx.nr18.86.b: "Consolidate the broods around supply."
chaosx.nr18.86.b.tt: "The Host recalculates capacity and adopts a consolidation response to the deficit."
chaosx.nr18.86.c: "Let the unfed endure."
chaosx.nr18.86.c.tt: "The Host accepts the overcapacity penalty without deleting any divisions."

chaosx.nr18.87.t: "The First Chamber Is Threatened"
chaosx.nr18.87.d: "Enemy forces are contesting the approaches to [resources_found_cave_notice_state.GetName], the chamber from which the Host first climbed. Command links falter whenever the origin is cut off, and every brood understands what its loss would mean. The Host can concentrate its army, designate an emergency chamber, or prepare a retreat into the wider anchor network."
chaosx.nr18.87.a: "Concentrate around the origin."
chaosx.nr18.87.a.tt: "The Host marks the origin as its immediate military priority."
chaosx.nr18.87.b: "Designate an emergency chamber."
chaosx.nr18.87.b.tt: "The Host attempts to designate a valid secondary capital and records an emergency command chamber."
chaosx.nr18.87.c: "Withdraw command into the network."
chaosx.nr18.87.c.tt: "The Host prepares an origin retreat and recalculates the capacity of its surviving network."

chaosx.nr18.88.t: "The Regional Host Is Broken"
chaosx.nr18.88.d: "The Oth-Kesh Host controls no surviving chamber or foothold. Its organized armies have been destroyed, captured, or driven below sealed ground. The threat never became a global one, but every liberated resource state still contains shafts, altered machinery, and tunnels that must be cleaned before ordinary life can return."
chaosx.nr18.88.a: "Begin the regional cleanup."
chaosx.nr18.88.a.tt: "The country joins regional cave cleanup and keeps the threat-cooperation institutions needed for restoration."

chaosx.nr18.89.t: "The Anchor Is Clean"
chaosx.nr18.89.d: "Engineers in [resources_found_cave_notice_state.GetName] have removed the active cave works, collapsed hostile tunnels, and left a sealed scar over the former anchor. The state can restore ordinary resource production, deepen the permanent seal, or preserve selected evidence for future defense."
chaosx.nr18.89.a: "Restore the resource district."
chaosx.nr18.89.a.tt: "The cleaned state records a resource-restoration priority."
chaosx.nr18.89.b: "Seal every remaining tunnel."
chaosx.nr18.89.b.tt: "The cleaned state records a permanent tunnel-sealing priority."
chaosx.nr18.89.c: "Preserve evidence under guard."
chaosx.nr18.89.c.tt: "The cleaned state preserves controlled evidence for future anti-cave study."

chaosx.nr18.90.t: "A Quarter of the Continent"
chaosx.nr18.90.d: "One quarter of the eligible states on the origin continent are owned and controlled by the Oth-Kesh Host. The chamber network has become too broad to describe as a regional outbreak. Every new anchor shortens the road to the continental interior."
chaosx.nr18.90.a: "The surface has begun to bend."
chaosx.nr18.90.a.tt: "The Host records the quarter-continent strategy milestone and refreshes its expansion targets."

chaosx.nr18.91.t: "Half the Continent Below"
chaosx.nr18.91.d: "Half of the origin continent's eligible states lie within the Host's owned and controlled network. Armies that once fought at the edge of a single breach now defend the remnants of a continental frontier. The remaining states receive marks in the Host's war map."
chaosx.nr18.91.a: "Mark the remaining ground."
chaosx.nr18.91.a.tt: "The Host records the half-continent milestone and marks the remaining eligible states as objectives."

chaosx.nr18.92.t: "Three Quarters Consumed"
chaosx.nr18.92.d: "Three quarters of the eligible origin continent belong to the Oth-Kesh Host. The surviving coalition can see the danger reaching beyond the continent, and the Host can see other shores through the same deep routes that connected its first fields. Distant resource-rich ground is surveyed, but no passage is opened while surface resistance survives."
chaosx.nr18.92.a: "Prepare the roads beneath the oceans."
chaosx.nr18.92.a.tt: "The Host records its continental advance and surveys resource-rich distant footholds without opening them."

chaosx.nr18.93.t: "The Last Surface States"
chaosx.nr18.93.d: "Only a few eligible states remain outside the Host's owned and controlled origin-continent network. Their capitals, resource sites, and transport lines carry the weight of the final continental campaign. The Host can prioritize the last assault or strengthen the anchors that must sustain it."
chaosx.nr18.93.a: "Drive every brood toward the last states."
chaosx.nr18.93.a.tt: "The remaining eligible states become the Host's immediate assault objectives."
chaosx.nr18.93.b: "Secure the anchors before the final advance."
chaosx.nr18.93.b.tt: "The Host prioritizes anchor capacity before committing to the last continental objectives."

chaosx.nr18.94.t: "A Continent Without a Surface Border"
chaosx.nr18.94.d: "Every eligible state on the origin continent is owned and controlled by the Oth-Kesh Host. The conquest has been confirmed across the entire landmass. The deepest chambers can sound distant resource states while the Host proves that no surface power can break its rule at home."
chaosx.nr18.94.a: "Sound the galleries beneath distant shores."
chaosx.nr18.94.a.tt: "Distant resource-rich sites are surveyed and a 60-day proof of continental rule begins. No foothold opens unless the conquest remains secure throughout."

chaosx.nr18.95.t: "Every Shore Has a Floor"
chaosx.nr18.95.d: "For sixty unbroken days, every eligible state of the first continent has remained beneath Oth-Kesh control. The chosen distant chambers answer through stone, but none has opened. The Choir waits for the final descent, when The World Opens Below will turn surveyed weakness into a war across continents."
chaosx.nr18.95.a: "Hold the galleries for the final descent."
chaosx.nr18.95.a.tt: "The continental verification is complete. The World Opens Below may be undertaken, but no terminal transformation or distant foothold occurs until that final rite is completed."

chaosx.nr18.96.t: "A Distant Rupture"
chaosx.nr18.96.d: "The ground in [resources_found_cave_notice_state.GetName] opened far from the Host's origin continent. Oth-Kesh troops seized the resource district through a distant gallery and converted it into an immediate foothold. The former owner can organize resistance or call upon the global coalition before the new anchor expands."
chaosx.nr18.96.a: "Organize resistance around the rupture."
chaosx.nr18.96.a.tt: "The dispossessed owner enters the global cave war and gains anti-cave equipment contracts."
chaosx.nr18.96.b: "Call the coalition to this front."
chaosx.nr18.96.b.tt: "The dispossessed owner requests aid and joins the threat-cooperation network."

chaosx.nr18.97.t: "The Last Host Falls"
chaosx.nr18.97.d: "No Oth-Kesh chamber, anchor, or distant foothold remains under cave control. The war crossed enough of the world to leave shared doctrine, ruined resource states, and governments that survived by depending upon one another. Cleanup begins everywhere the tunnels remain, while a global reconstruction compact becomes possible."
chaosx.nr18.97.a: "Carry the lessons into the peace."
chaosx.nr18.97.a.tt: "The global aftermath opens and the threat-cooperation institutions survive. Only countries that complete their own cleanup contribution may enter compact negotiations."

chaosx.nr18.98.t: "After the World Below"
chaosx.nr18.98.d: "The defeat belongs to more than one front. The Host consumed most of its origin continent, completed a continental conquest, or opened distant footholds before the surviving powers destroyed it. A global victory commemoration belongs to that history and would be out of place after a merely regional war."
chaosx.nr18.98.a: "Remember what the surface survived."
chaosx.nr18.98.a.tt: "The global victory announcement is reserved for a war that reached continental conquest or opened distant footholds."

chaosx.nr18.99.t: "The Reconstruction Compact"
chaosx.nr18.99.d: "States that fought the Oth-Kesh Host have proposed a permanent compact for sealed sites, anti-cave weapons, shared records, and rapid aid. Joining will preserve institutions born in catastrophe. Leading it will demand resources and authority. Refusing will return those responsibilities to national hands."
chaosx.nr18.99.a: "Commit to join the compact."
chaosx.nr18.99.a.tt: "The country commits to membership. A reconstruction project must still be funded before the compact is established."
chaosx.nr18.99.b: "Commit to lead the compact."
chaosx.nr18.99.b.tt: "A qualifying major commits to leadership. A reconstruction project must still be completed before leadership becomes final."
chaosx.nr18.99.c: "Reconstruction remains a national duty."
chaosx.nr18.99.c.tt: "The country permanently refuses compact membership and will not receive the reconstruction project."
