l_english:
  independence_wave_iw022_dalmatia_category: "Dalmatian Port Settlement"
  independence_wave_iw022_dalmatia_category_desc: "Port coordination: §Y[?independence_wave_iw022_dalmatia_port_coordination|0]§! / [?constant:independence_wave_iw022_dalmatia_value.maximum|0]\nCoastal security: §Y[?independence_wave_iw022_dalmatia_coastal_security|0]§! / [?constant:independence_wave_iw022_dalmatia_value.maximum|0]\nMunicipal legitimacy: §Y[?independence_wave_iw022_dalmatia_municipal_legitimacy|0]§! / [?constant:independence_wave_iw022_dalmatia_value.maximum|0]\nAdriatic watch: §Y[?independence_wave_iw022_dalmatia_watch_hold_days|0]§! / [?constant:independence_wave_iw022_dalmatia_value.watch_required|0] days\n\nThe vanilla Dalmatian carrier has inherited a coast, a port bureaucracy, and a disputed chain of command. Customs houses, municipal councils, merchant shipping, and local defence must agree before the new authority can speak for the Adriatic."

  independence_wave_iw022_compile_port_ledgers: "Compile the Dalmatian Port Ledgers"
  independence_wave_iw022_compile_port_ledgers_desc: "Reconcile harbour dues, warehouse rolls, rail allocations, and municipal employment registers. The ledger will make port capacity legible to the provisional authority, but it requires clerks, railway stock, and a deliberate call on the population."
  independence_wave_iw022_ledger_cost: "£command_power §Y[?constant:independence_wave_iw022_dalmatia_cost.ledger_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw022_dalmatia_cost.ledger_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw022_dalmatia_cost.ledger_trains|0]§!"
  independence_wave_iw022_compile_port_ledgers_effect_tt: "Gain §G+[?constant:independence_wave_iw022_dalmatia_value.port_ledger_gain|0]§! Port Coordination, §G+[?constant:independence_wave_iw022_dalmatia_value.port_ledger_security_gain|0]§! Coastal Security, and §G+[?constant:independence_wave_iw022_dalmatia_value.port_ledger_legitimacy_gain|0]§! Municipal Legitimacy."

  independence_wave_iw022_establish_adriatic_coastwatch: "Establish the Adriatic Coastwatch"
  independence_wave_iw022_establish_adriatic_coastwatch_desc: "Place harbour patrols, signal stations, and coastal defence stores under a common watch bill. The coastwatch protects the Dalmatian anchor without changing the vanilla route's state ownership."
  independence_wave_iw022_coastwatch_cost: "£command_power §Y[?constant:independence_wave_iw022_dalmatia_cost.coastwatch_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw022_dalmatia_cost.coastwatch_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw022_dalmatia_cost.coastwatch_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw022_dalmatia_cost.coastwatch_support_equipment|0]§!"
  independence_wave_iw022_establish_adriatic_coastwatch_effect_tt: "Gain §G+[?constant:independence_wave_iw022_dalmatia_value.coastwatch_coordination_gain|0]§! Port Coordination and §G+[?constant:independence_wave_iw022_dalmatia_value.coastwatch_security_gain|0]§! Coastal Security, at a cost of §R[?constant:independence_wave_iw022_dalmatia_value.coastwatch_legitimacy_loss|0]§! Municipal Legitimacy."

  independence_wave_iw022_hold_adriatic_watch: "Hold the Adriatic Watch"
  independence_wave_iw022_hold_adriatic_watch_desc: "Keep the Dalmatian anchor under our ownership and control with a division stationed in the state. Continuous watch duty stands at §Y[?independence_wave_iw022_dalmatia_watch_hold_days|0]§! of [?constant:independence_wave_iw022_dalmatia_value.watch_required|0] required days. Losing the port or its garrison resets the count."
  independence_wave_iw022_hold_adriatic_watch_success_effect_tt: "The Adriatic watch succeeds. Gain §G+[?constant:independence_wave_iw022_dalmatia_value.port_ledger_gain|0]§! Port Coordination, §G+[?constant:independence_wave_iw022_dalmatia_value.coastwatch_security_gain|0]§! Coastal Security, and §G+[?constant:independence_wave_iw022_dalmatia_value.port_ledger_legitimacy_gain|0]§! Municipal Legitimacy."
  independence_wave_iw022_hold_adriatic_watch_failure_effect_tt: "The Adriatic watch fails. Stability changes by §R[?constant:independence_wave_iw022_dalmatia_outcome.watch_failure_stability|%0]§! and Municipal Legitimacy changes by §R[?constant:independence_wave_iw022_dalmatia_outcome.watch_failure_legitimacy|0]§!."

  independence_wave_iw022_charter_dalmatian_municipal_authority: "Charter the Dalmatian Municipal Authority"
  independence_wave_iw022_charter_dalmatian_municipal_authority_desc: "Give municipal councils, customs officials, shipping houses, and harbour labour a written charter for civil administration. The charter rewards legitimacy and commerce, but it limits the security command's freedom to requisition the coast."
  independence_wave_iw022_charter_cost: "£command_power §Y[?constant:independence_wave_iw022_dalmatia_cost.charter_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw022_dalmatia_cost.charter_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw022_dalmatia_cost.charter_trains|0]§!"
  independence_wave_iw022_charter_dalmatian_municipal_authority_effect_tt: "Choose the §YDalmatian Municipal Charter§!. Gain §G+[?constant:independence_wave_iw022_dalmatia_value.charter_coordination_gain|0]§! Port Coordination and §G+[?constant:independence_wave_iw022_dalmatia_value.charter_legitimacy_gain|0]§! Municipal Legitimacy; Coastal Security changes by §R[?constant:independence_wave_iw022_dalmatia_value.charter_security_loss|0]§!."

  independence_wave_iw022_entrust_coastal_security_compact: "Entrust the Coastal Security Compact"
  independence_wave_iw022_entrust_coastal_security_compact_desc: "Place patrol schedules, garrison stores, and emergency requisitions under a coastal security compact. The compact responds quickly to war, but its officers will take priority over civilian port committees."
  independence_wave_iw022_security_compact_cost: "£manpower_texticon §Y[?constant:independence_wave_iw022_dalmatia_cost.security_compact_manpower|0]§!  £army_experience §Y[?constant:independence_wave_iw022_dalmatia_cost.security_compact_army_experience|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw022_dalmatia_cost.security_compact_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw022_dalmatia_cost.security_compact_support_equipment|0]§!"
  independence_wave_iw022_entrust_coastal_security_compact_effect_tt: "Choose the §YCoastal Security Compact§!. Gain §G+[?constant:independence_wave_iw022_dalmatia_value.security_compact_security_gain|0]§! Coastal Security and §G+[?constant:independence_wave_iw022_dalmatia_value.security_compact_legitimacy_gain|0]§! Municipal Legitimacy; Port Coordination changes by §R[?constant:independence_wave_iw022_dalmatia_value.security_compact_coordination_loss|0]§!."

  independence_wave_iw022_dalmatia_contested_adriatic_administration: "Contested Adriatic Administration"
  independence_wave_iw022_dalmatia_contested_adriatic_administration_desc: "Customs houses, municipal councils, shipping agents, and garrison officers still issue competing orders. The port is useful, but every emergency becomes a dispute over whose authority is legitimate."
  independence_wave_iw022_dalmatia_coordinated_port_authority: "Coordinated Dalmatian Port Authority"
  independence_wave_iw022_dalmatia_coordinated_port_authority_desc: "Harbour dues, rail schedules, shipping offices, and local defence now share one operating ledger. The arrangement remains provisional, but the coast can move goods and men without reopening every institutional quarrel."
  independence_wave_iw022_dalmatia_municipal_charter: "Dalmatian Municipal Charter"
  independence_wave_iw022_dalmatia_municipal_charter_desc: "Municipal councils and port authorities hold the decisive warrants. Civilian administration and maritime commerce are protected, though military requisitions must pass through a slower charter process."
  independence_wave_iw022_dalmatia_coastal_security_compact: "Coastal Security Compact"
  independence_wave_iw022_dalmatia_coastal_security_compact_desc: "The coastal command controls patrols, garrison stores, and emergency movements. Defence is faster and more disciplined, while municipal officials surrender room whenever the compact declares an emergency."
