l_english:
brilliant_scientist_mengele_electronics_incident: "Guidance Phantom"
brilliant_scientist_mengele_electronics_incident_desc: "False tracks from the private guidance laboratory are drawing aircraft away from their targets and disrupting anti-aircraft batteries."
mengele_event016_electronics_incident_recovery: "Purge the Guidance Network"
mengele_event016_electronics_incident_recovery_desc: "Recalibrate the guidance network and replace unreliable instruments so aircraft and anti-aircraft crews can trust their targets again."
mengele_event016_electronics_incident_recovery_requirements_tt: "The private programme must remain active, with a Guidance Phantom incident and no response already assigned to it."
mengele_event016_electronics_incident_recovery_started_tt: "Recalibrate the guidance network and replace unreliable instruments so aircraft and anti-aircraft crews can trust their targets again. The assigned civilian factories remain committed for §Y[?constant:brilliant_scientist_project_board.response_technical_days|0] days§!."
mengele_event016_electronics_incident_recovery_effect_tt: "Removes §YGuidance Phantom§! and records the completed recovery."
brilliant_scientist_mengele_materials_incident: "Catalytic Spill"
brilliant_scientist_mengele_materials_incident_desc: "A defective batch from the private materials laboratory has reached production lines, slowing output and undermining workshop standards."
mengele_event016_materials_incident_recovery: "Isolate the Catalytic Chain"
mengele_event016_materials_incident_recovery_desc: "Withdraw the defective batch and restore workshop standards so production lines can regain their output and efficiency."
mengele_event016_materials_incident_recovery_requirements_tt: "The private programme must remain active, with a Catalytic Spill incident and no response already assigned to it."
mengele_event016_materials_incident_recovery_started_tt: "Withdraw the defective batch and restore workshop standards so production lines can regain their output and efficiency. The assigned civilian factories remain committed for §Y[?constant:brilliant_scientist_project_board.response_industrial_days|0] days§!."
mengele_event016_materials_incident_recovery_effect_tt: "Removes §YCatalytic Spill§! and records the completed recovery."
brilliant_scientist_mengele_rocketry_incident: "Test Stand Explosion"
brilliant_scientist_mengele_rocketry_incident_desc: "An explosion at the private propulsion works has damaged test equipment and interrupted the flow of usable fuel to air operations."
mengele_event016_rocketry_incident_recovery: "Secure the Propulsion Works"
mengele_event016_rocketry_incident_recovery_desc: "Rebuild the damaged test stand and replace its instruments so propulsion work and fuel deliveries can resume."
mengele_event016_rocketry_incident_recovery_requirements_tt: "The private programme must remain active, with a Test Stand Explosion incident and no response already assigned to it."
mengele_event016_rocketry_incident_recovery_started_tt: "Rebuild the damaged test stand and replace its instruments so propulsion work and fuel deliveries can resume. The assigned civilian factories remain committed for §Y[?constant:brilliant_scientist_project_board.response_industrial_days|0] days§!."
mengele_event016_rocketry_incident_recovery_effect_tt: "Removes §YTest Stand Explosion§! and records the completed recovery."
brilliant_scientist_mengele_high_energy_incident: "Reactor Containment Crisis"
brilliant_scientist_mengele_high_energy_incident_desc: "Heat and radiation escaping the private laboratory have frightened nearby communities and forced research teams to suspend their work."
mengele_event016_high_energy_incident_recovery: "Stabilize the Reactor Envelope"
mengele_event016_high_energy_incident_recovery_desc: "Commit engineering crews to secure the damaged laboratory and restore safe working conditions for research teams."
mengele_event016_high_energy_incident_recovery_requirements_tt: "The private programme must remain active, with a Reactor Containment Crisis incident and no response already assigned to it."
mengele_event016_high_energy_incident_recovery_started_tt: "Commit engineering crews to secure the damaged laboratory and restore safe working conditions for research teams. The assigned civilian factories remain committed for §Y[?constant:brilliant_scientist_project_board.response_exotic_days|0] days§!."
mengele_event016_high_energy_incident_recovery_effect_tt: "Removes §YReactor Containment Crisis§! and records the completed recovery."
brilliant_scientist_mengele_biomedical_incident: "Clinical Contamination"
brilliant_scientist_mengele_biomedical_incident_desc: "A contaminated medical trial in the private programme has put staff and patients out of action, draining recruitment and disrupting unit organization."
mengele_event016_biomedical_incident_recovery: "Seal the Clinical Chain"
mengele_event016_biomedical_incident_recovery_desc: "Suspend the affected trial, replace compromised medical supplies, and support the injured staff and patients so military medical services can recover."
mengele_event016_biomedical_incident_recovery_requirements_tt: "The private programme must remain active, with a Clinical Contamination incident and no response already assigned to it."
mengele_event016_biomedical_incident_recovery_started_tt: "Suspend the affected trial, replace compromised medical supplies, and support the injured staff and patients so military medical services can recover. The assigned civilian factories remain committed for §Y[?constant:brilliant_scientist_project_board.response_biological_days|0] days§!."
mengele_event016_biomedical_incident_recovery_effect_tt: "Removes §YClinical Contamination§! and records the completed recovery."
mengele_event016_conventional_incident_cancel_trigger_tt: "The incident, assigned response, or private programme is no longer active."
mengele_event016_conventional_incident_cancelled_tt: "Any complete recorded payment is returned, and the assigned civilian factories are released."
