chaosx.fallout.831.t: "The Failed Calculation"
chaosx.fallout.831.opening.d: "The Grid Vote left the Manchurian Reactor Keeps with a power charter, but the first cold-season model overstated how much current a damaged cooling district could carry. A hospital ward lost pressure, a relay room overheated, and the calculation ledger now has to decide whether the Technate will expose the error, bury it, punish one operator, or rebuild the model before the next shift."
chaosx.fallout.831.a: "Open the ledger to a public inquiry"
chaosx.fallout.831.a.tt: "Spend Medicine 2, Scrap 1, and Recognition 2 to publish the failed assumptions and let eastern repair councils inspect the damage. This raises accountability while consuming scarce repair material."
chaosx.fallout.831.b: "Seal the calculation and protect the archive"
chaosx.fallout.831.b.tt: "Spend Power 2, Scrap 2, and Recognition 1 to keep the error inside the reactor archive. This preserves a clean public record for now, but leaves neighboring councils dependent on private assurances."
chaosx.fallout.831.c: "Blame the operator and preserve the plan"
chaosx.fallout.831.c.tt: "Spend Cohesion 2, Medicine 2, and Recognition 1 to remove the named operator while keeping the current model in service. This protects the schedule but makes every later safety report personal."
chaosx.fallout.831.d: "Rebuild the model before another shift"
chaosx.fallout.831.d.tt: "Spend Fuel 2, Power 2, and Scrap 2 to close the damaged line and recalculate the load from surviving equipment. This slows exports while the Technate tests a safer technical standard."
chaosx.fallout.832.t: "The Failed Calculation"
chaosx.fallout.833.t: "The Ledger Opens"
chaosx.fallout.833.public_inquiry.success.d: "The inquiry opened the cooling ledger in the Manchurian Reactor Keeps and sent copies to the eastern repair councils. The hospital ward received a measured repair window, the relay crew kept its tools, and the Technate can now name which assumption failed without turning the whole district against its engineers."
chaosx.fallout.833.public_inquiry.partial.d: "The public ledger reached most repair councils, but one damaged transformer forced the inquiry to rely on a handwritten night roster. The Technate gained witnesses and lost time, leaving the next cold shift exposed to another narrow margin."
chaosx.fallout.833.public_inquiry.failure.d: "The inquiry found three incompatible load tables and no surviving signature for the final calculation. The hospital ward received emergency power, but the repair councils now treat every Technate figure as a claim that must be checked in person."
chaosx.fallout.833.hide_calculation.success.d: "The archive kept the error out of the public ledger while the reactor staff replaced the damaged relay. The Manchurian Reactor Keeps kept its export charter intact, yet the eastern councils will receive only a sealed assurance that the next model is safe."
chaosx.fallout.833.hide_calculation.partial.d: "The archive preserved a single technical record, although two repair crews kept private copies of the overwritten table. The hospital line returned, but the Technate now has to negotiate with witnesses who know what was removed."
chaosx.fallout.833.hide_calculation.failure.d: "The sealed record failed when a relay room lost pressure during the correction. The Technate kept the archive closed, but a dark hospital ward and an empty maintenance roster made the hidden calculation impossible to defend."
chaosx.fallout.833.blame_operator.success.d: "The named operator accepted removal from the cooling roster and supplied a final hand note that saved the next shift. The old model remains in service under supervision, while the Technate's public statement turns a technical failure into a personal warning."
chaosx.fallout.833.blame_operator.partial.d: "The operator was removed, but the surviving crew could not agree which part of the model had been copied. The reactor schedule continued under escort, and every engineer now expects their name to stand beside the next bad number."
chaosx.fallout.833.blame_operator.failure.d: "Removing one operator did not repair the damaged line. The hospital ward lost another shift, the crew stopped signing the roster, and the Technate preserved a model that no longer has a person willing to defend it."
chaosx.fallout.833.revise_system.success.d: "The Technate shut the damaged circuit before the next frost and rebuilt its load model from surviving relays, pumps, and clinic hours. Exports slowed, but the Manchurian Reactor Keeps can now publish a safer technical standard to the neighboring councils."
chaosx.fallout.833.revise_system.partial.d: "The rebuilt model kept the reactor stable, although the eastern repair line stayed dark for one scheduled night. The new table is usable, but the councils want a second audit before they sign another power compact."
chaosx.fallout.833.revise_system.failure.d: "The revision closed the wrong circuit and left the cooling district without a dependable night roster. Fuel and scrap disappeared into emergency work, while the Technate's new model gained neither the confidence of the operators nor the patience of its neighbors."
chaosx.fallout.833.a: "Record the calculation decision"
chaosx.fallout.833.a.tt: "Record the delayed calculation result, apply its state and country effects, and open the later technical audit for the Manchurian Reactor Keeps."
chaosx.fallout.834.t: "The Failed Calculation"
chaosx.fallout.835.t: "The Technical Audit"
chaosx.fallout.835.success.d: "A full technical audit followed the first cold season. The surviving model has named inputs, a signed operator roster, and a repair council that can challenge the next calculation before the reactor line is committed."
chaosx.fallout.835.partial.d: "The audit found a workable model, but two eastern councils still keep their own figures beside the Technate table. The system can recover, although every new export will begin with a demand for another copy of the assumptions."
chaosx.fallout.835.failure.d: "The audit found that the failed calculation was never replaced. The reactor staff now ration trust as carefully as power, and the next technical decision will be made under a safety memory written by the damaged district."
chaosx.fallout.835.a: "Close the technical audit"
chaosx.fallout.835.a.tt: "Apply the delayed audit, write the durable calculation memory, and release the reserved state and neighboring receipts."
