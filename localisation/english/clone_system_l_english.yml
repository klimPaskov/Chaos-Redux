l_english:
clone_infantry: "Clone Infantry"
clone_infantry_desc: "Purpose-grown soldiers fielded in complete cohorts. Their discipline is exceptional, but their standardized biology leaves them vulnerable to losses that ordinary formations can absorb."
aryan_clone_infantry: "Aryan Clone Infantry"
aryan_clone_infantry_desc: "Mengele's aggressively selected clone soldiers retain the shared cohort economy but fight as a distinct, heavily refined formation."
clone_equipment: "Clone Cohorts"
clone_equipment_desc: "Viable purpose-grown cohorts held in controlled reserve. Each cohort in the national stockpile supplies ten replacement personnel every week. Cohorts assigned to divisions no longer contribute to the reserve."
clone_equipment_1: "Standardized Clone Cohort"
clone_equipment_1_short: "Clone Cohort"
clone_equipment_1_desc: "A complete viable cohort with growth support, conditioning records, and the medical controls required for deployment or continued reserve production."
clone_infantry_access_tech: "Clone Infantry Logistics"
clone_infantry_access_tech_desc: "Standardized growth, conditioning, and deployment protocols permit clone cohorts to be manufactured and organized into infantry divisions."
mengele_clone_refinement_tech: "Mengele Clone Conditioning"
mengele_clone_refinement_tech_desc: "Mengele's conditioning regime hardens ordinary clone formations without separating them from the shared clone program."
mengele_aryan_clone_refinement_tech: "Aryan Clone Selection"
mengele_aryan_clone_refinement_tech_desc: "Mengele's extreme selection program creates a distinct clone battalion with exceptional cohesion, aggression, endurance, and battlefield replacement discipline."
clone_reserve_manpower: "Clone Reserve Manpower"
clone_reserve_manpower_desc: "Clone cohorts in stockpile: §Y[?clone_equipment_stockpile|0]§!\nWeekly manpower per cohort: §G+10§!\nTotal weekly manpower: §G+[?clone_reserve_weekly_manpower|0]§!"
