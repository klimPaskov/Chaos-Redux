  independence_wave_iw022_security_compact_cost_tooltip: "Security-compact commitment: £manpower_texticon §Y[?constant:independence_wave_iw022_dalmatia_cost.security_compact_manpower|0]§!  £army_experience §Y[?constant:independence_wave_iw022_dalmatia_cost.security_compact_army_experience|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw022_dalmatia_cost.security_compact_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw022_dalmatia_cost.security_compact_support_equipment|0]§!"
  independence_wave_iw022_entrust_coastal_security_compact_effect_tt: "Choose the §YCoastal Security Compact§!. Gain §G+[?constant:independence_wave_iw022_dalmatia_value.security_compact_security_gain|0]§! Coastal Security and §G+[?constant:independence_wave_iw022_dalmatia_value.security_compact_legitimacy_gain|0]§! Municipal Legitimacy. Port Coordination changes by §R[?constant:independence_wave_iw022_dalmatia_value.security_compact_coordination_loss|0]§!."

  independence_wave_iw022_dalmatia_contested_adriatic_administration: "Contested Adriatic Administration"
  independence_wave_iw022_dalmatia_contested_adriatic_administration_desc: "Customs houses, municipal councils, shipping agents, and garrison officers still issue competing orders. The port is useful, but every emergency becomes a dispute over whose authority is legitimate."
  independence_wave_iw022_dalmatia_coordinated_port_authority: "Coordinated Dalmatian Port Authority"
  independence_wave_iw022_dalmatia_coordinated_port_authority_desc: "Harbour dues, rail schedules, shipping offices, and local defence now share one operating ledger. The arrangement remains provisional, but the coast can move goods and men without reopening every institutional quarrel."
  independence_wave_iw022_dalmatia_municipal_charter: "Dalmatian Municipal Charter"
  independence_wave_iw022_dalmatia_municipal_charter_desc: "Municipal councils and port authorities hold the decisive warrants. Civilian administration and maritime commerce are protected, though military requisitions must pass through a slower charter process."
  independence_wave_iw022_dalmatia_coastal_security_compact: "Coastal Security Compact"
  independence_wave_iw022_dalmatia_coastal_security_compact_desc: "The coastal command controls patrols, garrison stores, and emergency movements. Defence is faster and more disciplined, while municipal officials surrender room whenever the compact declares an emergency."

  # SOURCE: 006_independence_wave_iw025_vojvodina_l_english.yml
  independence_wave_iw025_vojvodina_category: "Vojvodina River and Frontier Settlement"
  independence_wave_iw025_vojvodina_category_desc: "River logistics: §Y[?independence_wave_iw025_vojvodina_river_logistics|0]§! / [?constant:independence_wave_iw025_vojvodina_value.maximum|0]\nProvincial legitimacy: §Y[?independence_wave_iw025_vojvodina_provincial_legitimacy|0]§! / [?constant:independence_wave_iw025_vojvodina_value.maximum|0]\nBorder mobility: §Y[?independence_wave_iw025_vojvodina_border_mobility|0]§! / [?constant:independence_wave_iw025_vojvodina_value.maximum|0]\nBorder watch: §Y[?independence_wave_iw025_vojvodina_watch_hold_days|0]§! / [?constant:independence_wave_iw025_vojvodina_value.watch_required|0] days\n\nVojvodina has inherited a fertile plain, river depots, and a border command shared by several communities. Grain, remounts, municipal guarantees, and a watch line must agree before the province can speak as a federal neighbour rather than a contested corridor."

  independence_wave_iw025_compile_danube_depot_survey: "Survey the Danube Depots"
  independence_wave_iw025_compile_danube_depot_survey_desc: "Reconcile grain warehouses, river barges, rail allocations, and remount ledgers. The survey makes the provincial supply chain legible, but it spends clerks, railway stock, and a deliberate call on the population."
  independence_wave_iw025_depot_cost: "£command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_trains|0]§!"
