  independence_wave_iw035_compile_baltic_rail_ledgers_desc: "Reconcile rail allocations, Baltic depots, coastal warehouses, and customs manifests. The ledger makes the Livonian corridor legible, but it spends clerks, railway stock, and a deliberate call on the population."
