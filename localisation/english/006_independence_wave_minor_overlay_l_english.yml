  independence_wave_iw197_convene_mapuche_territorial_council_desc: "Territorial communities, local officers, customary authorities, and veterans must share a council before the Mapuche State identity can carry a written settlement."
  independence_wave_iw197_convene_mapuche_territorial_council_effect_tt: "The council improves mountain mobility and territorial representation while federal legitimacy absorbs the first coordination cost."
  independence_wave_iw197_secure_araucania_depots: "Secure the Araucania Depots"
  independence_wave_iw197_secure_araucania_depots_desc: "Transport crews and depot officers connect the Araucania road chain to $STATE_950$ under a locally controlled supply schedule."
  independence_wave_iw197_secure_araucania_depots_effect_tt: "The Araucania chain improves mobility but temporarily strains territorial representation."
  independence_wave_iw197_integrate_mapuche_mountain_guard: "Integrate the Mountain Guard"
  independence_wave_iw197_integrate_mapuche_mountain_guard_desc: "Mountain guards and local infantry receive one service charter while officers record which communities supplied each formation."
  independence_wave_iw197_integrate_mapuche_mountain_guard_effect_tt: "Mountain integration strengthens the council while consuming some federal capacity."
  independence_wave_iw197_hold_araucania_anchor: "Hold the Araucania Anchor"
