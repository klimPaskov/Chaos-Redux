  independence_wave_iw101_convene_kongo_regency: "Convene the Kongo Regency"
  independence_wave_iw101_convene_kongo_regency_desc: "River chiefs, municipal officers, veterans, and customary authorities must share a provisional command before the Kongo identity can carry an independent charter."
  independence_wave_iw101_convene_kongo_regency_effect_tt: "The regency improves river logistics and legitimacy while veteran integration absorbs the first coordination cost."
  independence_wave_iw101_secure_kongo_river_depots: "Secure the Kongo River Depots"
  independence_wave_iw101_secure_kongo_river_depots_desc: "Transport crews and depot officers connect the lower Congo river chain to the Kongo depots under a locally controlled supply schedule."
  independence_wave_iw101_secure_kongo_river_depots_effect_tt: "The river chain improves logistics but temporarily strains veteran integration."
  independence_wave_iw101_integrate_kongo_veterans: "Integrate Kongo Veterans"
  independence_wave_iw101_integrate_kongo_veterans_desc: "Local veterans and river infantry receive one service charter while officers record which communities supplied each formation."
  independence_wave_iw101_integrate_kongo_veterans_effect_tt: "Veteran integration strengthens the river authority while consuming some regency capacity."
  independence_wave_iw101_hold_kongo_river_corridor: "Hold the Kongo River Corridor"
  independence_wave_iw101_hold_kongo_river_corridor_desc: "Keep a supplied guard in $STATE_538$ while the Kongo regency controls its river anchor."
  independence_wave_iw101_hold_kongo_river_corridor_success_effect_tt: "The river guard demonstrates that the regency can defend its own corridor."
  independence_wave_iw101_hold_kongo_river_corridor_failure_effect_tt: "The river guard failed, damaging stability and regency legitimacy."
  independence_wave_iw101_establish_kongo_assembly: "Establish the Kongo Assembly"
  independence_wave_iw101_establish_kongo_assembly_desc: "A provisional assembly gives river, customary, municipal, and veteran interests a written voice before any settlement is considered."
  independence_wave_iw101_establish_kongo_assembly_effect_tt: "The assembly records a river-defense charter and civic compact without creating a new Kongo tag."
