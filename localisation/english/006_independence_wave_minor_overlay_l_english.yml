  independence_wave_iw025_mounted_reserve_cost_tooltip: "Mounted-reserve commitment: £command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_support_equipment|0]§!"
  independence_wave_iw025_establish_mounted_frontier_reserve_effect_tt: "Gain §G+[?constant:independence_wave_iw025_vojvodina_value.mounted_reserve_logistics_gain|0]§! River Logistics and §G+[?constant:independence_wave_iw025_vojvodina_value.mounted_reserve_mobility_gain|0]§! Border Mobility, but lose §R[?constant:independence_wave_iw025_vojvodina_value.mounted_reserve_legitimacy_loss|0]§! Provincial Legitimacy."

  independence_wave_iw025_mobilize_border_watch: "Mobilize the Vojvodina Border Watch"
  independence_wave_iw025_mobilize_border_watch_desc: "Equip a border watch from river patrols, mounted reserves, and screened reservists. The commitment begins a [?constant:independence_wave_iw025_vojvodina_duration.watch_mission_timeout|0]-day objective. One division must remain in the Vojvodina anchor while the authority owns and controls the state."
  independence_wave_iw025_guard_cost: "£command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.guard_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.guard_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.guard_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.guard_support_equipment|0]§!"
