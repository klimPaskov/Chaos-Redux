  independence_wave_iw025_federal_compact_cost_tooltip: "Federal-compact commitment: £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_manpower|0]§!  £army_experience §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_army_experience|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_support_equipment|0]§!"
  independence_wave_iw025_establish_federal_agrarian_compact_effect_tt: "Adopt the Federal Agrarian Compact: lose §R[?constant:independence_wave_iw025_vojvodina_value.federal_compact_logistics_loss|0]§! River Logistics and gain §G+[?constant:independence_wave_iw025_vojvodina_value.federal_compact_mobility_gain|0]§! Border Mobility and §G+[?constant:independence_wave_iw025_vojvodina_value.federal_compact_legitimacy_gain|0]§! Provincial Legitimacy."

  independence_wave_iw025_vojvodina_contested_danube_administration: "Contested Danube Administration"
  independence_wave_iw025_vojvodina_contested_danube_administration_desc: "River offices, border commands, and municipal councils still answer to different ledgers."
  independence_wave_iw025_vojvodina_coordinated_grain_authority: "Coordinated Grain Authority"
  independence_wave_iw025_vojvodina_coordinated_grain_authority_desc: "A common grain and remount authority keeps the corridor supplied while the settlement is negotiated."
  independence_wave_iw025_vojvodina_municipal_minority_charter: "Municipal Minority Charter"
  independence_wave_iw025_vojvodina_municipal_minority_charter_desc: "Municipal guarantees give the Vojvodinian settlement a civic foundation."
  independence_wave_iw025_vojvodina_federal_frontier_compact: "Federal Frontier Compact"
  independence_wave_iw025_vojvodina_federal_frontier_compact_desc: "A federal agrarian compact joins river districts and mounted border defence."

