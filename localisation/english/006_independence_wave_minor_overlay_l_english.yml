  independence_wave_iw035_hold_livonian_corridor_watch: "Hold the Livonian Corridor Watch"
  independence_wave_iw035_hold_livonian_corridor_watch_desc: "Keep one Baltic anchor supplied while the garrison patrols rail junctions and coastal approaches. The watch succeeds only when an anchor state remains controlled and a division holds it."
