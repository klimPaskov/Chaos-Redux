  independence_wave_iw025_guard_cost_tooltip: "Commit the displayed command authority, personnel, weapons, and support stores to the Vojvodina border watch."
  independence_wave_iw025_guard_start_effect_tt: "Activate §YHold the Vojvodina Border Watch§!. The watch must maintain the full anchor objective for [?constant:independence_wave_iw025_vojvodina_value.watch_required|0] continuous days."

  independence_wave_iw025_hold_vojvodina_border_watch: "Hold the Vojvodina Border Watch"
  independence_wave_iw025_hold_vojvodina_border_watch_desc: "Keep the anchor garrison supplied while riders inspect crossings and municipalities. The watch succeeds only when the state remains controlled and a division holds the border."
  independence_wave_iw025_hold_vojvodina_border_watch_success_effect_tt: "The border watch holds. Gain §G+[?constant:independence_wave_iw025_vojvodina_value.depot_survey_gain|0]§! River Logistics, §G+[?constant:independence_wave_iw025_vojvodina_value.watch_legitimacy_gain|0]§! Provincial Legitimacy, and §G+[?constant:independence_wave_iw025_vojvodina_value.mounted_reserve_mobility_gain|0]§! Border Mobility."
  independence_wave_iw025_hold_vojvodina_border_watch_failure_effect_tt: "The border watch breaks. Provincial confidence and logistics suffer."

  independence_wave_iw025_charter_municipal_minority_guarantees: "Charter Municipal Minority Guarantees"
  independence_wave_iw025_charter_municipal_minority_guarantees_desc: "Give municipal councils a common charter for language, land, school, and militia administration. The charter raises legitimacy while requiring railway and administrative resources."
  independence_wave_iw025_charter_cost: "£command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.charter_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.charter_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.charter_trains|0]§!"
