  independence_wave_iw035_livonia_category: "Livonian Baltic Settlement"
  independence_wave_iw035_livonia_category_desc: "Rail coordination: §Y[?independence_wave_iw035_livonia_rail_coordination|0]§! / [?constant:independence_wave_iw035_livonia_value.maximum|0]\nCivic legitimacy: §Y[?independence_wave_iw035_livonia_civic_legitimacy|0]§! / [?constant:independence_wave_iw035_livonia_value.maximum|0]\nCoastal security: §Y[?independence_wave_iw035_livonia_coastal_security|0]§! / [?constant:independence_wave_iw035_livonia_value.maximum|0]\nLivonian watch: §Y[?independence_wave_iw035_livonia_watch_hold_days|0]§! / [?constant:independence_wave_iw035_livonia_value.watch_required|0] days\n\nThe Livonian route is a Lithuanian-led Baltic project with old rail lines, coastal depots, and competing municipal memories. A common authority must make the corridor defensible without pretending that a new name has erased Lithuania's existing state."

