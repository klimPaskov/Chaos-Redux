  independence_wave_iw035_mobilize_livonian_watch: "Mobilize the Livonian Corridor Watch"
  independence_wave_iw035_mobilize_livonian_watch_desc: "Equip a corridor watch from rail personnel, coastal patrols, and screened reservists. The commitment begins a [?constant:independence_wave_iw035_livonia_duration.watch_mission_timeout|0]-day objective. One division must remain in the Livonian anchor while the authority owns and controls the state."
  independence_wave_iw035_guard_cost: "£command_power §Y[?constant:independence_wave_iw035_livonia_cost.guard_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw035_livonia_cost.guard_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw035_livonia_cost.guard_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw035_livonia_cost.guard_support_equipment|0]§!"
