  independence_wave_iw197_hold_araucania_anchor_success_effect_tt: "The mountain guard demonstrates that the council can defend its own territorial anchor."
  independence_wave_iw197_hold_araucania_anchor_failure_effect_tt: "The mountain guard failed, damaging stability and territorial representation."
  independence_wave_iw197_ratify_mapuche_charter: "Ratify the Mapuche Charter"
  independence_wave_iw197_ratify_mapuche_charter_desc: "A territorial compact gives communities, customary authorities, municipal officers, and veterans a written voice before any settlement is considered."
  independence_wave_iw197_ratify_mapuche_charter_effect_tt: "The council records a mountain-defense charter and territorial compact while Chile's existing institutions remain in force."
  independence_wave_iw197_mapuche_contested_territorial_council: "Contested Mapuche Territorial Council"
  independence_wave_iw197_mapuche_contested_territorial_council_desc: "The provisional council still balances territorial, customary, municipal, veteran, and sponsor interests."
  independence_wave_iw197_mapuche_integrated_mountain_guard: "Integrated Mapuche Mountain Guard"
  independence_wave_iw197_mapuche_integrated_mountain_guard_desc: "The provisional council has aligned mountain forces and depots under a common command."
  independence_wave_iw197_mapuche_federal_compact: "Mapuche Territorial Compact"
  independence_wave_iw197_mapuche_federal_compact_desc: "Territorial communities and their institutions have recorded a common settlement."
  independence_wave_iw197_mapuche_charter: "Mapuche Mountain Charter"
  independence_wave_iw197_mapuche_charter_desc: "Territorial councils and mountain authorities share responsibility for defense."

