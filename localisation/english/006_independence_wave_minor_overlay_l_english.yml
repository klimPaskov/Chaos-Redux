  independence_wave_iw025_depot_cost_tooltip: "Depot commitment: £command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_trains|0]§!"
  independence_wave_iw025_compile_danube_depot_survey_effect_tt: "Gain §G+[?constant:independence_wave_iw025_vojvodina_value.depot_survey_gain|0]§! River Logistics, §G+[?constant:independence_wave_iw025_vojvodina_value.depot_survey_legitimacy_gain|0]§! Provincial Legitimacy, and §G+[?constant:independence_wave_iw025_vojvodina_value.depot_survey_mobility_gain|0]§! Border Mobility."

  independence_wave_iw025_establish_mounted_frontier_reserve: "Establish the Mounted Frontier Reserve"
  independence_wave_iw025_establish_mounted_frontier_reserve_desc: "Place border riders, remount stations, and river patrols under a single reserve bill. The reserve protects the Vojvodinian anchor while preserving the existing state settlement."
  independence_wave_iw025_mounted_reserve_cost: "£command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_support_equipment|0]§!"
