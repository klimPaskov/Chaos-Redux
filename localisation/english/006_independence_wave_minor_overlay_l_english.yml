  independence_wave_iw035_compile_baltic_rail_ledgers_effect_tt: "Gain §G+[?constant:independence_wave_iw035_livonia_value.depot_survey_gain|0]§! Rail Coordination, §G+[?constant:independence_wave_iw035_livonia_value.depot_survey_legitimacy_gain|0]§! Civic Legitimacy, and §G+[?constant:independence_wave_iw035_livonia_value.depot_survey_security_gain|0]§! Coastal Security."

