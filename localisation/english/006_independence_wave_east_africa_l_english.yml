l_english:
# East Africa, Horn and Great Lakes framework packages.
# Buganda
independence_wave_uga_buganda_category: "The Buganda Settlement"
independence_wave_uga_buganda_category_desc: "Buganda governs itself again from Mengo. The Kabaka, his ministers and the Lukiiko, the kingdom's council, each claim the powers the protectorate once arbitrated, while clan heads contest the land titles of 1900 and the lake trade waits for a government that can run it."
independence_wave_uga_convene_great_lukiiko: "Convene the Great Lukiiko"
independence_wave_uga_convene_great_lukiiko_desc: "Call the chiefs, ministers and elected members of the Lukiiko to write down the powers of the Kabaka, the ministers and the council."
independence_wave_uga_convene_great_lukiiko_tt: "Replaces §YThe Kabaka and the Lukiiko§! with §YThe Lukiiko Constitution§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_uga_settle_mailo_claims: "Settle the Mailo Land Claims"
independence_wave_uga_settle_mailo_claims_desc: "Hear the clan heads who lost their ancestral burial grounds when the 1900 agreement turned land into private mailo estates, and register a settlement."
independence_wave_uga_settle_mailo_claims_tt: "Raises §YCapacity§! and §YLegitimacy§! and lowers §YInstability§!."
independence_wave_uga_open_port_bell_wharf: "Open the Port Bell Wharf"
independence_wave_uga_open_port_bell_wharf_desc: "Rebuild the lake wharf at Port Bell and the rail spur to Kampala, so cotton and coffee leave by Lake Victoria under our own customs."
independence_wave_uga_open_port_bell_wharf_tt: "Adds §YThe Lake Victoria Wharves§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_uga_kabaka_and_lukiiko: "The Kabaka and the Lukiiko"
independence_wave_uga_kabaka_and_lukiiko_desc: "The Kabaka, his chief minister and the Lukiiko each act on their own reading of the old agreement, and nobody can say whose decree is final."
independence_wave_uga_lukiiko_constitution: "The Lukiiko Constitution"
independence_wave_uga_lukiiko_constitution_desc: "The powers of the Kabaka, the ministers and the Lukiiko are written down and accepted by all three."
independence_wave_uga_lake_wharves: "The Lake Victoria Wharves"
independence_wave_uga_lake_wharves_desc: "Buganda's cotton and coffee leave through its own wharves on Lake Victoria."
independence_wave_uga_lukiiko_convened: "The Great Lukiiko has been convened"

# Rwanda
independence_wave_rwa_kingdom_category: "The Rwandan Settlement"
independence_wave_rwa_kingdom_category_desc: "Rwanda governs itself again under its Mwami. The chiefdoms were redrawn by the mandate administration, the old cattle contracts still bind much of the countryside, and the kingdom must decide how far its court will reform."
independence_wave_rwa_convene_mwami_council: "Convene the Mwami's Council"
independence_wave_rwa_convene_mwami_council_desc: "Bring the chiefs of every province into a council that advises the Mwami and approves appointments."
independence_wave_rwa_convene_mwami_council_tt: "Replaces §YThe Court and the Chiefdoms§! with §YThe Mwami's Council§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_rwa_abolish_ubuhake: "Abolish the Ubuhake Contracts"
independence_wave_rwa_abolish_ubuhake_desc: "End the cattle clientship contracts and divide the herds between patrons and clients, a reform the court itself would later carry out."
independence_wave_rwa_abolish_ubuhake_tt: "Greatly raises §YLegitimacy§!, raises §YCapacity§! and raises §YInstability§! while the patrons resist."
independence_wave_rwa_open_kivu_trade: "Open the Lake Kivu Trade"
independence_wave_rwa_open_kivu_trade_desc: "Fund boats, markets and a road to the lake, so cattle and coffee reach the markets across Lake Kivu."
independence_wave_rwa_open_kivu_trade_tt: "Adds §YThe Lake Kivu Trade§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_rwa_court_and_chiefdoms: "The Court and the Chiefdoms"
independence_wave_rwa_court_and_chiefdoms_desc: "The chiefdoms the mandate redrew answer partly to the court and partly to habit. Appointments are disputed in every province."
independence_wave_rwa_mwami_council: "The Mwami's Council"
independence_wave_rwa_mwami_council_desc: "The chiefs of every province sit in one council that advises the Mwami and approves appointments."
independence_wave_rwa_kivu_trade: "The Lake Kivu Trade"
independence_wave_rwa_kivu_trade_desc: "Boats and markets on Lake Kivu carry Rwanda's cattle and coffee to its neighbours."
independence_wave_rwa_council_convened: "The Mwami's council has been convened"

# Burundi
independence_wave_brd_kingdom_category: "The Burundian Settlement"
independence_wave_brd_kingdom_category_desc: "Burundi governs itself again under its Mwami. The princely houses of the Bezi and the Batare compete for every office, and the accounts of the mandate years are still open."
independence_wave_brd_reconcile_bezi_and_batare: "Reconcile the Bezi and the Batare"
independence_wave_brd_reconcile_bezi_and_batare_desc: "Divide the provincial commands between the two princely houses by a written compact sworn before the Mwami."
independence_wave_brd_reconcile_bezi_and_batare_tt: "Replaces §YThe Princely Rivalry§! with §YThe Royal Compact§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_brd_settle_mandate_accounts: "Settle the Mandate Accounts"
independence_wave_brd_settle_mandate_accounts_desc: "Agree with our former host how the debts, the mission property and the public works of the mandate years are divided."
independence_wave_brd_settle_mandate_accounts_tt: "Raises §YRecognition§! and eases hostility and obligations with our former host."
independence_wave_brd_build_usumbura_port: "Build the Usumbura Lake Port"
independence_wave_brd_build_usumbura_port_desc: "Build a deep-water quay at Usumbura on Lake Tanganyika and the warehouses to serve it."
independence_wave_brd_build_usumbura_port_tt: "Adds §YThe Usumbura Lake Port§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_brd_princely_rivalry: "The Princely Rivalry"
independence_wave_brd_princely_rivalry_desc: "The Bezi and the Batare princes each hold provinces and each suspect the other of plotting for the throne."
independence_wave_brd_royal_compact: "The Royal Compact"
independence_wave_brd_royal_compact_desc: "The princely houses share the provinces under a compact sworn before the Mwami."
independence_wave_brd_usumbura_port: "The Usumbura Lake Port"
independence_wave_brd_usumbura_port_desc: "Usumbura's quay ties Burundi to the trade of Lake Tanganyika."
independence_wave_brd_princes_reconciled: "The princely houses have been reconciled"

# Harar
independence_wave_har_city_category: "The City of Harar"
independence_wave_har_city_category_desc: "Harar governs itself again behind its old walls. Its merchants trade with the Somali coast and the highlands, its shrines draw pilgrims from the whole region, and the city must build a state that reaches beyond its gates."
independence_wave_har_seat_merchants_council: "Seat the Merchants' Council of the Jugol"
independence_wave_har_seat_merchants_council_desc: "Seat the merchant families, scholars and quarter heads of the walled city in a council that governs the city and the roads around it."
independence_wave_har_seat_merchants_council_tt: "Replaces §YThe City Within the Walls§! with §YThe Merchants' Council§! and raises §YLegitimacy§! and §YCapacity§!."
independence_wave_har_reopen_zeila_road: "Reopen the Zeila Caravan Road"
independence_wave_har_reopen_zeila_road_desc: "Guard the caravan road to Zeila and Berbera and agree tolls with the clans along it."
independence_wave_har_reopen_zeila_road_tt: "Adds §YThe Zeila Caravans§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_har_raise_highland_guard: "Raise the City Guard"
independence_wave_har_raise_highland_guard_desc: "Recruit a guard from the Harari, Oromo and Somali communities around the city, under officers the council appoints."
independence_wave_har_raise_highland_guard_tt: "Raises §YSecurity§! and §YLegitimacy§!."
independence_wave_har_city_within_walls: "The City Within the Walls"
independence_wave_har_city_within_walls_desc: "The institutions of Harar reach only as far as its gates. Beyond them, the roads and markets answer to nobody."
independence_wave_har_merchants_council: "The Merchants' Council"
independence_wave_har_merchants_council_desc: "The merchants, scholars and quarter heads of Harar govern the city and the roads around it."
independence_wave_har_zeila_caravans: "The Zeila Caravans"
independence_wave_har_zeila_caravans_desc: "Caravans carry Harar's coffee and hides to the coast at Zeila and Berbera under guard."
independence_wave_har_council_seated: "The Merchants' Council has been seated"

# Somaliland
independence_wave_som_sultanates_category: "The Sultans' Federation"
independence_wave_som_sultanates_category_desc: "The sultanates of Somaliland govern themselves again, but each sultan answers to his own clans. Berbera's trade, the grazing wells of the interior and a common council must hold the federation together."
independence_wave_som_convene_sultans_council: "Convene the Sultans' Council at Hargeisa"
independence_wave_som_convene_sultans_council_desc: "Call the sultans and the elders of every clan to Hargeisa to agree on a federal council and its laws."
independence_wave_som_convene_sultans_council_tt: "Replaces §YRival Sultanates§! with §YThe Sultans' Council§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_som_open_berbera_trade: "Open Berbera to the Gulf Trade"
independence_wave_som_open_berbera_trade_desc: "Open the port of Berbera to the livestock and incense trade of the Gulf of Aden under federal customs."
independence_wave_som_open_berbera_trade_tt: "Adds §YThe Berbera Trade§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_som_divide_grazing_wells: "Divide the Grazing Wells"
independence_wave_som_divide_grazing_wells_desc: "Have the council register the wells and grazing lands of the interior and settle the disputes between clans."
independence_wave_som_divide_grazing_wells_tt: "Lowers §YInstability§! and raises §YLegitimacy§!."
independence_wave_som_rival_sultanates: "Rival Sultanates"
independence_wave_som_rival_sultanates_desc: "Every sultan rules his own clans and treats the others as rivals for wells, roads and the port."
independence_wave_som_sultans_council: "The Sultans' Council"
independence_wave_som_sultans_council_desc: "The sultans and clan elders meet in one council at Hargeisa and keep its laws."
independence_wave_som_berbera_trade: "The Berbera Trade"
independence_wave_som_berbera_trade_desc: "Livestock and incense leave Berbera for Aden and the Gulf under federal customs."
independence_wave_som_council_convened: "The Sultans' Council has been convened"

# Tigray
independence_wave_tig_highlands_category: "The Tigray Settlement"
independence_wave_tig_highlands_category_desc: "Tigray governs itself again from Mek'ele. Its princely houses have long been rivals, the church holds much of its land, and the passes into the highlands must be held."
independence_wave_tig_convene_mekele_council: "Convene the Council at Mek'ele"
independence_wave_tig_convene_mekele_council_desc: "Seat the heads of the princely houses, the district governors and the clergy in one council at Mek'ele."
independence_wave_tig_convene_mekele_council_tt: "Replaces §YThe Divided Highlands§! with §YThe Mek'ele Council§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_tig_settle_aksum_church_lands: "Settle the Church Lands of Aksum"
independence_wave_tig_settle_aksum_church_lands_desc: "Agree with the clergy of Aksum which church lands pay tax and which remain to the monasteries."
independence_wave_tig_settle_aksum_church_lands_tt: "Raises §YLegitimacy§! and §YCapacity§!."
independence_wave_tig_garrison_highland_passes: "Garrison the Highland Passes"
independence_wave_tig_garrison_highland_passes_desc: "Post garrisons and build stone forts on the passes that lead up to the Tigray plateau."
independence_wave_tig_garrison_highland_passes_tt: "Adds §YThe Highland Passes§! and raises §YSecurity§!."
independence_wave_tig_divided_highlands: "The Divided Highlands"
independence_wave_tig_divided_highlands_desc: "Tigray's princely houses each hold their own districts and doubt that anyone else should govern them."
independence_wave_tig_mekele_council: "The Mek'ele Council"
independence_wave_tig_mekele_council_desc: "The princely houses, governors and clergy govern Tigray together from Mek'ele."
independence_wave_tig_highland_passes: "The Highland Passes"
independence_wave_tig_highland_passes_desc: "Garrisons and stone forts hold every pass up to the plateau."
independence_wave_tig_council_convened: "The council at Mek'ele has been convened"

# Incidents
chaosx.nr6.214.t: "The Bataka Petition"
chaosx.nr6.214.d: "The heads of the Baganda clans have petitioned the government: the burial grounds of their ancestors were given away as private estates in 1900, and they want them back."
chaosx.nr6.214.a: "Hear the clan heads"
chaosx.nr6.214.b: "Uphold the estate titles"
chaosx.nr6.215.t: "The Cotton Ginneries"
chaosx.nr6.215.d: "The ginnery owners have agreed on one low price for this year's cotton. The growers ask the government to set a minimum."
chaosx.nr6.215.a: "Set a minimum price for the growers"
chaosx.nr6.215.b: "Leave the price to the ginners"
chaosx.nr6.216.t: "The Coffee Quotas"
chaosx.nr6.216.d: "Every household was once ordered to grow a quota of coffee for export. The farmers want to plant food again; the treasury wants the coffee."
chaosx.nr6.216.a: "End the compulsory quotas"
chaosx.nr6.216.b: "Keep the quotas for export"
chaosx.nr6.217.t: "Hunger in the Hills"
chaosx.nr6.217.d: "The rains have failed in the south and families are leaving the hills in search of food."
chaosx.nr6.217.a: "Open the royal granaries"
chaosx.nr6.217.b: "Ask the missions to distribute grain"
chaosx.nr6.218.t: "The Festival of the Sorghum"
chaosx.nr6.218.d: "The season of the Muganuro, the royal sorghum festival, has come. The court wants it held with the old ceremony; the missions ask that it be kept modest."
chaosx.nr6.218.a: "Hold the festival at court"
chaosx.nr6.218.b: "Keep the ceremony modest"
chaosx.nr6.219.t: "Recruiters from the Mines"
chaosx.nr6.219.d: "Labour recruiters from the copper mines to the west offer contracts in the hill villages. The chiefs want a share; the families want their sons at home."
chaosx.nr6.219.a: "Allow the recruiters"
chaosx.nr6.219.b: "Ban the recruiters"
chaosx.nr6.220.t: "The Coffee of the Harar Hills"
chaosx.nr6.220.d: "The coffee growers of the hills ask the council to buy their harvest at a fixed price. The merchant houses would rather buy it themselves."
chaosx.nr6.220.a: "Found a coffee board"
chaosx.nr6.220.b: "Leave the trade to the merchants"
chaosx.nr6.221.t: "The Shrines of the City"
chaosx.nr6.221.d: "Harar's shrines draw pilgrims from the whole region, and the city also holds a church built in the years of the former host. Both communities ask the council for protection."
chaosx.nr6.221.a: "Protect every shrine and church alike"
chaosx.nr6.221.b: "Restore the shrines first"
chaosx.nr6.222.t: "The Livestock Ships to Aden"
chaosx.nr6.222.d: "The livestock ships for Aden are loading at Berbera. The council could tax every head of cattle and sheep, or let the herders trade free."
chaosx.nr6.222.a: "Tax the livestock exports"
chaosx.nr6.222.b: "Let the herders trade free"
chaosx.nr6.223.t: "The Dervish Veterans"
chaosx.nr6.223.d: "Old fighters of the Dervish movement, defeated in 1920, ask for a place in the council. Some sultans fought against them and refuse."
chaosx.nr6.223.a: "Honour the Dervish veterans"
chaosx.nr6.223.b: "Keep them out of the council"
chaosx.nr6.224.t: "The Salt Bars of the Plain"
chaosx.nr6.224.d: "The salt caravans from the plain below have reached the highland markets. The council could tax the salt bars, which still serve as money in the villages, or let them pass."
chaosx.nr6.224.a: "Tax the salt caravans"
chaosx.nr6.224.b: "Let the salt pass untaxed"
chaosx.nr6.225.t: "The Clergy of Aksum"
chaosx.nr6.225.d: "The clergy of Aksum ask for a seat in the council, as the church has always had a voice in the highlands."
chaosx.nr6.225.a: "Give the clergy a seat"
chaosx.nr6.225.b: "Keep the church outside the council"
