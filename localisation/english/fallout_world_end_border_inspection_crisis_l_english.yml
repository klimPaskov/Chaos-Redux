 chaosx.fallout.726.t: "Border Inspection Crisis"
 chaosx.fallout.726.d: "The East Gate ledger records a new inspection demand from the government across the winter road. Its officers will not accept our Clean Certificate without a shared procedure, while our own clinic cannot absorb another uncontrolled queue. The Quarantine council must decide whether to seal the crossing, invite a joint team, protect named relief caravans, or put soldiers on the gate."
 chaosx.fallout.726.a: "Close the crossing"
 chaosx.fallout.726.a.tt: "Spend Food, Medicine, and Recognition to seal the East Gate. The measure protects the Rime Ward clinic but raises the crossing backlog and strains the neighboring government's trust. A result arrives after thirty days."
 chaosx.fallout.726.b: "Admit a joint team"
 chaosx.fallout.726.b.tt: "Spend Scrap, Power, and Recognition to admit foreign inspectors beside our clinic staff. The measure can create a bilateral health compact, but it exposes our ledgers to a difficult review. A result arrives after thirty days."
 chaosx.fallout.726.c: "Issue relief exemptions"
 chaosx.fallout.726.c.tt: "Spend Fuel and Recognition with a Cohesion commitment to admit only named relief caravans. The road moves again while the wider dispute remains unresolved. A result arrives after thirty days."
 chaosx.fallout.726.e: "Deploy a military screen"
 chaosx.fallout.726.e.tt: "Spend Food, Medicine, Fuel, and Recognition to place the crossing under military inspection. The screen can hold the line during a health emergency, but the neighboring government may read it as a war signal. A result arrives after thirty days."
 chaosx.fallout.727.t: "Border Inspection Crisis"
 chaosx.fallout.728.t: "The East Gate Answers"
 chaosx.fallout.728.close_border.success.d: "The East Gate closes before the first convoy reaches the Rime Ward clinic. Guards post a clear return route, nurses receive the medicine they would have spent at the checkpoint, and the neighboring government records the closure as a temporary health measure. Trade slows, yet the frontier remains legible."
 chaosx.fallout.728.close_border.partial.d: "The gate closes, but the night watch cannot keep every footpath sealed. The Rime Ward clinic gains time while the crossing backlog grows beyond the ledger's first estimate. The neighboring government accepts the notice without calling it a treaty."
 chaosx.fallout.728.close_border.failure.d: "The closure consumes medicine and fuel without controlling the East Gate. A crowd reaches the Rime Ward road through an unlisted track, the clinic's register loses its final pages, and the neighboring government treats the seal as a hostile act."
 chaosx.fallout.728.joint_team.success.d: "Foreign inspectors enter the Rime Ward office beside our nurses. They compare the Clean Certificate with the East Gate ledger, accept the same exposure limits, and sign a narrow health compact that leaves ordinary trade open under recorded checks."
 chaosx.fallout.728.joint_team.partial.d: "The joint team agrees on a clinic form, but the East Gate keeps a second ledger for freight. Patients move through the crossing with fewer arguments while cargo remains subject to a dispute neither government will yet call a treaty."
 chaosx.fallout.728.joint_team.failure.d: "The joint team finds that the two ledgers describe different roads. Inspectors leave with no signature, the Rime Ward clinic loses its reserved power, and the neighboring government announces that our certificate cannot be trusted."
 chaosx.fallout.728.exemptions.success.d: "Named relief caravans cross the East Gate with their seals visible and their routes logged. The Rime Ward clinic receives medicine without opening the wider road, and the neighboring government accepts the exemption as a narrow act of care rather than a general waiver."
 chaosx.fallout.728.exemptions.partial.d: "The first relief caravans cross, but fuel shortages force the gate to turn back two unlisted vehicles. The exemption keeps the clinic supplied while the neighboring government waits for a broader answer on ordinary travelers."
 chaosx.fallout.728.exemptions.failure.d: "The exemption list reaches the East Gate after the caravans have already departed. Guards improvise names at the barrier, the Rime Ward clinic receives no promised delivery, and the neighboring government suspends the route as an invitation to forgery."
 chaosx.fallout.728.military_inspection.success.d: "The military screen takes the East Gate before dawn. Soldiers use the clinic's exposure table instead of inventing a new one, the road remains open to inspected freight, and the neighboring government keeps its patrols back from the line."
 chaosx.fallout.728.military_inspection.partial.d: "The screen stops an uncontrolled rush, but soldiers and nurses disagree over the final queue. The Rime Ward clinic gains a guarded supply lane while the neighboring government moves its own patrols closer to the crossing."
 chaosx.fallout.728.military_inspection.failure.d: "The military screen turns the East Gate into a standoff. Fuel is consumed, the clinic receives no reliable queue, and the neighboring government records the deployment as a warning that may outlast the health emergency."
 chaosx.fallout.728.a: "Record the crossing decision"
 chaosx.fallout.728.a.tt: "The border result is recorded in the Fallout Event Log and a delayed seasonal review will arrive after one hundred eighty days."
 chaosx.fallout.729.t: "Border Inspection Crisis"
 chaosx.fallout.730.t: "A Season at the East Gate"
 chaosx.fallout.730.success.d: "A season later, the East Gate ledger and the Rime Ward clinic record the same names. The neighboring government honors the inspection lane, and the Quarantine council can describe the compact without pretending that the frontier is safe."
 chaosx.fallout.730.partial.d: "A season later, the crossing survives through local exception pages. The neighboring government answers some notices and ignores others, yet the clinic can still trace the medicine that crossed the road."
 chaosx.fallout.730.failure.d: "A season later, the two governments keep incompatible registers. The East Gate closes its public desk, the Rime Ward clinic loses its trusted route, and every new crossing begins as a negotiation under suspicion."
 chaosx.fallout.730.a: "Archive the border review"
 chaosx.fallout.730.a.tt: "The seasonal review is recorded and the chain will close through its authenticated cleanup receipt."
 fallout.event_log.border_inspection_crisis.name: "Border Inspection Crisis"
 fallout.event_log.border_inspection_crisis.detail.choice_close_border: "The Quarantine council sealed the East Gate to protect the Rime Ward clinic."
 fallout.event_log.border_inspection_crisis.detail.choice_joint_team: "The Quarantine council admitted a joint inspection team at the East Gate."
 fallout.event_log.border_inspection_crisis.detail.choice_exemptions: "The Quarantine council issued named relief exemptions for the East Gate."
 fallout.event_log.border_inspection_crisis.detail.choice_military_inspection: "The Quarantine council placed the East Gate under military inspection."
 fallout.event_log.border_inspection_crisis.detail.close_border_success: "The closed crossing protected the clinic and remained legible to the neighboring government."
 fallout.event_log.border_inspection_crisis.detail.close_border_partial: "The closed crossing protected the clinic but left a growing backlog and unsealed footpaths."
 fallout.event_log.border_inspection_crisis.detail.close_border_failure: "The closed crossing failed to control movement and was recorded as a hostile act."
 fallout.event_log.border_inspection_crisis.detail.joint_team_success: "A joint team signed a narrow health compact and kept recorded trade open."
 fallout.event_log.border_inspection_crisis.detail.joint_team_partial: "A joint team aligned clinic forms while freight remained under a separate ledger."
 fallout.event_log.border_inspection_crisis.detail.joint_team_failure: "A joint team found incompatible ledgers and left without a trusted signature."
 fallout.event_log.border_inspection_crisis.detail.exemptions_success: "Named relief caravans crossed under a narrow exemption accepted by both governments."
 fallout.event_log.border_inspection_crisis.detail.exemptions_partial: "Relief exemptions kept the clinic supplied while ordinary travelers waited."
 fallout.event_log.border_inspection_crisis.detail.exemptions_failure: "A late exemption list failed to protect the promised relief route."
 fallout.event_log.border_inspection_crisis.detail.military_inspection_success: "A military screen controlled the gate while using the clinic's exposure table."
 fallout.event_log.border_inspection_crisis.detail.military_inspection_partial: "A military screen held the crossing while patrols and nurses disputed the queue."
 fallout.event_log.border_inspection_crisis.detail.military_inspection_failure: "A military screen turned the crossing into a standoff under suspicion."
 fallout.event_log.border_inspection_crisis.detail.callback_success: "A season later, both ledgers still described the same inspection lane."
 fallout.event_log.border_inspection_crisis.detail.callback_partial: "A season later, local exception pages kept the crossing barely traceable."
 fallout.event_log.border_inspection_crisis.detail.callback_failure: "A season later, incompatible registers closed the trusted route."
 fallout.event_log.border_inspection_crisis.detail.cancelled: "The border chain ended before its surviving receipt could be reconciled."
 fallout.event_log.border_inspection_crisis.detail: "The East Gate dispute changed the Quarantine state's health, movement, and neighboring relations."
