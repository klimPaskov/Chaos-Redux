chaosx.nr61.1.t: "Conversions of arms factories"

chaosx.nr61.2.t: "Conversions of arms factories"
chaosx.nr61.2.d: "Every nation is converting half of its arms factories to civilian production. The change is moving workers and machinery toward goods for homes and markets."
chaosx.nr61.2.a: "Peace must last!"
