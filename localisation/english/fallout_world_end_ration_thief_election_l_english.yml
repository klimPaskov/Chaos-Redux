 chaosx.fallout.394.t: "The Ration Thief Election"
 chaosx.fallout.394.d: "The ration ledger for [This.GetName] has lost a page. A local official insists the missing grain was an emergency reserve, while the queue outside the storehouse names the households that went without it. The accusation has become a test of who may speak for the settlement."
 chaosx.fallout.394.a: "Let the wards choose a public keeper"
 chaosx.fallout.394.b: "Convene a ration tribunal"
 chaosx.fallout.394.c: "Purge the office and seize the ledger"
chaosx.fallout.394.e: "Settle the shortage behind closed doors"
 chaosx.fallout.394.a.tt: "Spend food, recognition, and cohesion to establish a public mandate."
 chaosx.fallout.394.b.tt: "Spend food, medicine, and recognition to put the accusation before a tribunal."
 chaosx.fallout.394.c.tt: "Spend food, recognition, and cohesion to make the accusation an instrument of fear."
 chaosx.fallout.394.d.tt: "Spend food, medicine, and recognition to bind the storehouse to a private compact."
 chaosx.fallout.396.t: "The Ledger Gives Its Answer"
 chaosx.fallout.396.public_election.success.d: "The wards compare ration slips in the open. Their chosen keeper publishes every correction and leaves the official's name on the record. Trust rises because the queue can see who is counted."
 chaosx.fallout.396.public_election.partial.d: "The wards choose a keeper, but two districts refuse the count. The storehouse remains open, though every distribution now requires a witness from both sides."
 chaosx.fallout.396.public_election.failure.d: "The public count collapses when the last intact ledger is taken from the table. The queue leaves with empty hands, and the old official's silence becomes a new source of power."
 chaosx.fallout.396.tribunal.success.d: "The tribunal hears the grain clerks, the night guards, and the families who were marked absent. It finds a forged entry, restores the ration line, and gives the settlement a procedure that can be repeated."
 chaosx.fallout.396.tribunal.partial.d: "The tribunal proves the missing page was altered, but it cannot agree who ordered it. Medicine is diverted to the storehouse and the ration line resumes under a cloud of suspicion."
 chaosx.fallout.396.tribunal.failure.d: "The tribunal becomes another queue. Witnesses trade accusations until the storehouse closes, and the settlement learns that a lawful hearing can still starve a district."
 chaosx.fallout.396.purge.success.d: "The office is stripped before dawn. Armed stewards take the keys, publish a shorter ration table, and make the theft impossible to repeat without confronting the new order directly."
 chaosx.fallout.396.purge.partial.d: "The purge removes the official but leaves the clerks in place. The ledger is safe for a week, while every faction counts the names of those who were made afraid."
 chaosx.fallout.396.purge.failure.d: "The purge breaks the storehouse into rival rooms. Food spoils under competing seals, and families disappear from the ration list before anyone can call the result a victory."
 chaosx.fallout.396.private_settlement.success.d: "The official returns the missing grain through a private compact with the millers. The settlement eats tonight, and the signatories quietly build a government that depends on their continued agreement."
 chaosx.fallout.396.private_settlement.partial.d: "The compact restores part of the grain, but the public queue receives no explanation. Recognition and trust move in opposite directions as each district writes its own account."
 chaosx.fallout.396.private_settlement.failure.d: "The private bargain consumes the last usable medicine and produces no grain. The official keeps the seal, the millers keep their silence, and the queue learns that secrecy has a cost."
 chaosx.fallout.396.a: "Record the ruling and prepare the next audit"
 chaosx.fallout.396.a.tt: "Apply the ruling, record the government memory, and schedule the delayed legitimacy callback."
 chaosx.fallout.398.t: "A Second Count at the Storehouse"
 chaosx.fallout.398.success.d: "Months later, the next ration count is held under the precedent [This.GetName] chose. A new generation of clerks can follow it without asking which faction owns the keys."
 chaosx.fallout.398.partial.d: "The precedent survives, but only because rival witnesses keep meeting at the storehouse. The settlement has a habit now, though not yet a shared faith in it."
 chaosx.fallout.398.failure.d: "The second count fails and the old accusations return. The settlement keeps the memory of the ration thief, but loses the institution that could have judged the next one."
 chaosx.fallout.398.a: "Close the case and keep the memory"
 chaosx.fallout.398.a.tt: "Resolve the callback, preserve its branch memory, and release the scheduler cleanup receipt."
 fallout.event_log.ration_thief_election.name: "The Ration Thief Election"
 fallout.event_log.ration_thief_election.detail: "A ration theft accusation became a government precedent in [This.GetName]."
 fallout.event_log.ration_thief_election.public_election_success: "The wards established a public ration mandate."
 fallout.event_log.ration_thief_election.public_election_partial: "The wards chose a ration keeper, but the count remained contested."
 fallout.event_log.ration_thief_election.public_election_failure: "A failed public count left the ration office without trust."
 fallout.event_log.ration_thief_election.tribunal_success: "A tribunal proved the ration ledger was forged and restored a repeatable hearing."
 fallout.event_log.ration_thief_election.tribunal_partial: "A tribunal found an altered ledger but no responsible hand."
 fallout.event_log.ration_thief_election.tribunal_failure: "The ration tribunal closed the storehouse while witnesses traded accusations."
 fallout.event_log.ration_thief_election.purge_success: "A purge secured the ration office and made the new order explicit."
 fallout.event_log.ration_thief_election.purge_partial: "A purge removed the official but left the old clerks in place."
 fallout.event_log.ration_thief_election.purge_failure: "The purge split the storehouse into rival rooms and spoiled food."
 fallout.event_log.ration_thief_election.private_settlement_success: "A private compact restored grain and empowered the millers."
 fallout.event_log.ration_thief_election.private_settlement_partial: "A private compact restored only part of the missing grain."
 fallout.event_log.ration_thief_election.private_settlement_failure: "A private bargain consumed medicine without restoring the ration line."
 fallout.event_log.ration_thief_election.callback_success: "The ration precedent survived its second count."
 fallout.event_log.ration_thief_election.callback_partial: "The ration precedent survived only under rival witnesses."
 fallout.event_log.ration_thief_election.callback_failure: "The second count failed and the ration institution broke."
