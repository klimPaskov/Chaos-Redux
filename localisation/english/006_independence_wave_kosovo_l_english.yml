kos_fractured_municipal_mandate: "Fractured Municipal Mandate"
kos_fractured_municipal_mandate_desc: "Town councils, community delegates, and territorial guards recognize the provisional state without yet trusting one another's guarantees."
kos_cantonal_state_compact: "Cantonal State Compact"
kos_cantonal_state_compact_desc: "Written municipal guarantees bind the capital, market towns, and guarded roads to a common civil authority."
kos_agrarian_civic_assembly: "Agrarian Civic Assembly"
kos_agrarian_civic_assembly_desc: "Village delegates and civic associations share a constitutional assembly with explicit protections for Kosovo's communities."
kos_workers_municipal_council: "Municipal Workers' Council"
kos_workers_municipal_council_desc: "Mine, workshop, railway, and municipal committees direct scarce production through a common council."
kos_federal_cantonal_charter: "Federal Cantonal Charter"
kos_federal_cantonal_charter_desc: "Cantonal powers and community guarantees are written into a federal settlement that keeps local administration intact."
kos_territorial_defence_command: "Territorial Defence Command"
kos_territorial_defence_command_desc: "A unified emergency staff directs the territorial guards while municipal authorities retain responsibility for supply and relief."

independence_wave_kos_cantonal_compact_category: "Kosovo Cantonal Compact"
independence_wave_kos_cantonal_compact_category_desc: "Civic Concord: §Y[?independence_wave_kos_civic_concord|0]§! / [?constant:independence_wave_kosovo_pressure.maximum|0]\nMunicipal Reach: §Y[?independence_wave_kos_municipal_reach|0]§! / [?constant:independence_wave_kosovo_pressure.maximum|0]\nBoth values remain between [?constant:independence_wave_kosovo_pressure.minimum|0] and [?constant:independence_wave_kosovo_pressure.maximum|0]. A stable compact requires both to reach [?constant:independence_wave_kosovo_pressure.stable|0]."
independence_wave_kos_hold_cantonal_compact_together: "Hold the Cantonal Compact Together"
independence_wave_kos_hold_cantonal_compact_together_desc: "The new state must establish a government and raise Civic Concord and Municipal Reach before the cantonal compact gives way."
independence_wave_kos_secure_mitrovica_depots: "Secure the Mitrovica Depots"
independence_wave_kos_secure_mitrovica_depots_desc: "Put the northern stores and road registers under a civil assembly capable of supplying the whole compact."
independence_wave_kos_integrate_territorial_guards: "Integrate the Territorial Guards"
independence_wave_kos_integrate_territorial_guards_desc: "Unify local detachments under a territorial staff while preserving the municipal guarantees that sustain them."
independence_wave_kos_register_municipal_compacts: "Register the Municipal Compacts"
independence_wave_kos_register_municipal_compacts_desc: "Record the rights, obligations, and representation of every participating municipality and community."
independence_wave_kos_settle_former_host_ledgers: "Settle the Yugoslav Ledgers"
independence_wave_kos_settle_former_host_ledgers_desc: "Close the property, border, population, and recognition claims inherited from Yugoslav administration. If talks fail, the cantonal compact will settle them locally."
independence_wave_kos_ratify_agrarian_civic_charter: "Ratify the Agrarian Civic Charter"
independence_wave_kos_ratify_agrarian_civic_charter_desc: "Give village delegates and civic associations an elected assembly with binding community protections."
independence_wave_kos_convene_workers_council: "Convene the Municipal Workers' Council"
independence_wave_kos_convene_workers_council_desc: "Place mines, workshops, railway crews, and municipal services under a common workers' council."
independence_wave_kos_adopt_federal_cantonal_charter: "Adopt the Federal Cantonal Charter"
independence_wave_kos_adopt_federal_cantonal_charter_desc: "Preserve municipal autonomy through a federal settlement that guarantees every recognized community a place in government."
independence_wave_kos_establish_territorial_command: "Establish the Territorial Defence Command"
independence_wave_kos_establish_territorial_command_desc: "Put the territorial guards under one emergency staff and secure the roads before neighboring armies test the compact."
independence_wave_kos_codify_durable_sovereignty: "Codify Durable Sovereignty"
independence_wave_kos_codify_durable_sovereignty_desc: "A stable compact, functioning municipalities, and a recognized government can turn liberation into a durable state."
independence_wave_kos_open_balkan_network_corridor: "Open the Balkan Network Corridor"
independence_wave_kos_open_balkan_network_corridor_desc: "Exchange supplies, officers, and diplomatic access with the other states that survived the wave."

independence_wave_kos_project_failure_effect_tt: "Civic Concord and Municipal Reach each change by [?constant:independence_wave_kosovo_pressure.standard_loss|0].\nLegitimacy [?constant:independence_wave_decision_effect.value_standard_loss|0], Recognition [?constant:independence_wave_decision_effect.value_minor_loss|0], State Capacity [?constant:independence_wave_decision_effect.value_standard_loss|0], Security [?constant:independence_wave_decision_effect.value_standard_loss|0], Instability §R+[?constant:independence_wave_decision_effect.value_major|0]§!."
independence_wave_kos_assembly_effect_tt: "Civic Concord §G+[?constant:independence_wave_kosovo_pressure.major_gain|0]§! and Municipal Reach §G+[?constant:independence_wave_kosovo_pressure.minor_gain|0]§!.\nLegitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability [?constant:independence_wave_value.minor_loss|0]."
independence_wave_kos_guards_effect_tt: "Civic Concord §G+[?constant:independence_wave_kosovo_pressure.minor_gain|0]§! and Municipal Reach §G+[?constant:independence_wave_kosovo_pressure.major_gain|0]§!.\nLegitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Security §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability [?constant:independence_wave_value.minor_loss|0]."
independence_wave_kos_communities_effect_tt: "Civic Concord §G+[?constant:independence_wave_kosovo_pressure.major_gain|0]§! and Municipal Reach §G+[?constant:independence_wave_kosovo_pressure.standard_gain|0]§!.\nLegitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability [?constant:independence_wave_value.standard_loss|0]."
independence_wave_kos_host_ledgers_effect_tt: "Civic Concord and Municipal Reach each gain §G+[?constant:independence_wave_kosovo_pressure.standard_gain|0]§!.\nKosovo's settlement changes Host Claim by [?constant:independence_wave_decision_effect.bilateral_minor_loss|0], Hostility and Host Obligations by [?constant:independence_wave_decision_effect.bilateral_standard_loss|0], Property Claims by [?constant:independence_wave_decision_effect.bilateral_major_loss|0], Border Settlement by §G+[?constant:independence_wave_decision_effect.bilateral_standard|0]§!, and Host Pressure and Reconquest Fear by [?constant:independence_wave_decision_effect.bilateral_minor_loss|0].\nThe accompanying negotiations change Host Claim, Hostility, Property Claims, and Reconquest Fear by [?constant:independence_wave_value.standard_loss|0]. They change Host Obligations, Population Pressure, and Host Pressure by [?constant:independence_wave_value.minor_loss|0], while Border Settlement gains §G+[?constant:independence_wave_value.major_gain|0]§!."
independence_wave_kos_host_loss_effect_tt: "The Yugoslav ledger closes locally. Civic Concord and Municipal Reach each gain §G+[?constant:independence_wave_kosovo_pressure.standard_gain|0]§!. No bilateral host values change."
independence_wave_kos_civic_route_effect_tt: "The Agrarian Civic Union takes office under Ferhat Bey Draga and adopts the Albanian civic standard.\nLegitimacy §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, State Capacity §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, Security §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Instability [?constant:independence_wave_decision_effect.value_minor_loss|0]."
independence_wave_kos_socialist_route_effect_tt: "The Kosovo Workers' Front takes office under Miladin Popović, convenes the Municipal Workers' Council, and retains the Yugoslav municipal standard.\nLegitimacy §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, State Capacity §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, Security §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Instability [?constant:independence_wave_decision_effect.value_minor_loss|0]."
independence_wave_kos_federal_route_effect_tt: "The Federal Cantonal League takes office under Ferhat Bey Draga and retains the Yugoslav municipal standard.\nLegitimacy §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Recognition §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, State Capacity §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Instability [?constant:independence_wave_decision_effect.value_minor_loss|0]."
independence_wave_kos_emergency_route_effect_tt: "The Territorial Defence Command takes office under Shaban Polluzha and retains the Yugoslav municipal standard.\nLegitimacy §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, State Capacity §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Security §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, Instability [?constant:independence_wave_decision_effect.value_minor_loss|0]."
independence_wave_kos_sovereignty_effect_tt: "Legitimacy, Recognition, and State Capacity each gain §G+[?constant:independence_wave_decision_effect.value_standard|0]§!. Security gains §G+[?constant:independence_wave_decision_effect.value_minor|0]§! and Instability changes by [?constant:independence_wave_decision_effect.value_standard_loss|0]."
independence_wave_kos_network_effect_tt: "Opening the corridor: Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, Recognition, State Capacity, and Security §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!, and Network Standing §G+[?constant:independence_wave_network.aid_gain|0]§!. League Cohesion, Common Cause, Shared Reserve, and Member Confidence each gain §G+[?constant:independence_wave_value.minor_gain|0]§!.\nRatifying the corridor accords: Legitimacy, Recognition, and State Capacity §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, Security §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Instability [?constant:independence_wave_decision_effect.value_standard_loss|0], and Network Standing §G+[?constant:independence_wave_decision_effect.network_standard|0]§!. League Cohesion, Common Cause, Shared Reserve, and Member Confidence each gain §G+[?constant:independence_wave_value.minor_gain|0]§!."

