# Generic
sp_biowarfare_generic_reward_scientist_xp_1: "New Learnings"
sp_biowarfare_generic_reward_scientist_xp_2: "Refined Expertise"
sp_biowarfare_generic_reward_scientist_xp_3: "Insightful Discovery"
sp_biowarfare_generic_reward_option_scientist_xp_desc: "[Character.GetName] has achieved a major breakthrough, accelerating progress and solidifying [Character.GetHerHis] role as a pioneer in advanced biology. With each discovery, [Character.GetHerHis] mastery of engineering grows, shaping the future of military technology."
sp_biowarfare_generic_reward_option_scientist_xp: "Knowledge is Power!"

sp_biowarfare_generic_reward_major_progress_1: "Promising Prototype"
sp_biowarfare_generic_reward_major_progress_2: "Critical Test Successful"
sp_biowarfare_generic_reward_major_progress_3: "Pivotal Discovery"
sp_biowarfare_generic_reward_option_major_breakthrough_desc: "[Character.GetName] has achieved a major breakthrough, propelling the project significantly forward, validating [Character.GetHerHis] expertise and energizing the research team. With this progress, the project moves closer to its goal, cementing [Character.GetName]'s legacy as a trailblazer."
sp_biowarfare_generic_reward_option_major_breakthrough: "Great News!"

sp_biowarfare_generic_reward_test_failure_1: "Testing Inconclusive"
sp_biowarfare_generic_reward_test_failure_2: "Design Flaw Detected"
sp_biowarfare_generic_reward_test_failure_3: "Minor Test Failure"
sp_biowarfare_generic_reward_option_test_failure: "Back to the Drawing Board"
sp_biowarfare_generic_reward_option_test_failure_desc: "A minor setback has occurred during testing, revealing unexpected flaws in [Character.GetName]'s prototype. This hiccup prompts a reevaluation of the approach and refinement of techniques. While temporarily delaying progress, these lessons learned contribute to a stronger and more resilient project in the long run."

sp_biowarfare_generic_reward_resource_scarcity: "Resource Scarcity"
sp_biowarfare_generic_reward_option_resource_scarcity_desc: "[Character.GetName]'s team is facing shortages of critical materials for the development of the [SpecialProject.GetName] project, forcing [Character.GetHerHim] to find alternative sources and to develop new manufacturing methods to meet the demands."
sp_biowarfare_generic_reward_option_resource_scarcity: "Find another source."

sp_biowarfare_generic_reward_critical_failure: "Critical Failure"
sp_biowarfare_generic_reward_option_critical_failure_desc: "A critical failure has occurred during the testing phase of the [SpecialProject.GetName] project, leading to a significant setback. The team must now reevaluate their approach and make necessary adjustments to overcome this challenge."
sp_biowarfare_generic_reward_option_critical_failure: "How could this happen?"

sp_biowarfare_political_interference_generic_reward: "Political Interference"
sp_biowarfare_political_interference_generic_reward_option_desc: "Politicians dabbling where they shouldn't have led to the project being forced to redo things that were already done, for reasons that make sense to no-one."
sp_biowarfare_political_interference_generic_reward_option: "Two steps forward, one step back"


# Zombies
zombie_cure_bomb: "Anti-Zombie Bombs"
zombie_cure_bomb_desc: "A fast-response containment project for aerosol decontamination payloads that suppress zombie control, movement, and manpower extraction inside treated states while the cure remains active."
anti_zombie_bomb_unlocked_tooltip: "§GAnti-zombie bomb strikes are now available while any cure activation remains in effect.§!"
weaponize_the_zombies: "Weaponize the Zombies"
weaponize_the_zombies_desc: "A reckless deep-research program to profile, shape, and weaponize the zombie pathogen itself. The final zombie depends on our choices during development, producing radically different outbreak archetypes, delivery costs, cure resistance, and containment risks."
weaponized_zombies_unlocked_tooltip: "§RCompletion will unlock a weaponized zombie delivery system. The exact zombie characteristics will only be determined over the course of research.§!"

sp_weaponized_zombie_reward_acquisition: "Initial Acquisition"
sp_weaponized_zombie_reward_acquisition_desc: "The project begins with the controlled extraction of infected subjects for study. Once we commit to this step, there is no plausible way to claim innocence."
sp_weaponized_zombie_reward_acquisition_extract: "Bring the infected in alive"
weaponized_zombie_acquisition_tt: "§YCaptured infected subjects will be transferred into controlled research isolation, beginning the weaponization program.§!"

sp_weaponized_zombie_reward_nature: "Nature of the Disease"
sp_weaponized_zombie_reward_nature_desc: "Our first real conclusions concern what this horror actually is. That answer will shape every later experiment."
sp_weaponized_zombie_reward_nature_neurobiological: "A neurobiological pathogen"
sp_weaponized_zombie_reward_nature_rage: "A rage-inducing degenerative agent"
sp_weaponized_zombie_reward_nature_parasitic: "A parasitic symbiosis"
sp_weaponized_zombie_reward_nature_necrotic: "A necrotic reanimation phenomenon"
sp_weaponized_zombie_reward_nature_demonic: "An extra-scientific corruption"

sp_weaponized_zombie_reward_trials: "Human Experimentation"
sp_weaponized_zombie_reward_trials_desc: "The work can no longer remain theoretical. Live testing will consume personnel, but it will also move the project into far more reliable results."
sp_weaponized_zombie_reward_trials_approve: "Authorize the sacrifices"
weaponized_zombie_trials_tt: "§RThis iteration consumes 1000 manpower and sharply escalates the moral and containment stakes of the project.§!"

sp_weaponized_zombie_reward_resources: "Resource Allocation"
sp_weaponized_zombie_reward_resources_desc: "The research teams want more staff, more sealed laboratories, and more priority access. Higher commitment accelerates progress but worsens accident risk."
sp_weaponized_zombie_reward_resources_minimal: "Minimal allocation"
sp_weaponized_zombie_reward_resources_expanded: "Expanded funding"
sp_weaponized_zombie_reward_resources_maximum: "Maximum priority"
weaponized_zombie_resources_minimal_tt: "§YWe will slow the work slightly and keep the program smaller, reducing exposure.§!"
weaponized_zombie_resources_expanded_tt: "§YWe will expand the program for noticeably faster progress, while only accepting a very small increase in accident risk.§!"
weaponized_zombie_resources_maximum_tt: "§RWe will prioritize the program at all costs, greatly accelerating research while making containment failure far more likely.§!"

sp_weaponized_zombie_reward_life_state: "What Are the Infected Now?"
sp_weaponized_zombie_reward_life_state_desc: "Our autopsies and behavioral studies cannot agree on whether the infected are dead, overridden, fragment-conscious, or transformed into something else."
sp_weaponized_zombie_reward_life_state_dead: "They are biologically dead"
sp_weaponized_zombie_reward_life_state_alive: "They are still alive"
sp_weaponized_zombie_reward_life_state_fragmented: "Fragments of mind remain"
sp_weaponized_zombie_reward_life_state_transformed: "They become something else entirely"

sp_weaponized_zombie_reward_strength: "Zombie Strength"
sp_weaponized_zombie_reward_strength_desc: "We can emphasize brute physical power, but stronger zombies are harder to contain."
sp_weaponized_zombie_reward_strength_mild: "Keep strength mild"
sp_weaponized_zombie_reward_strength_medium: "Pursue medium strength"
sp_weaponized_zombie_reward_strength_strong: "Maximize strength"

sp_weaponized_zombie_reward_infectiousness: "Zombie Infectiousness"
sp_weaponized_zombie_reward_infectiousness_desc: "How aggressively should the zombie infection spread from one victim to the next?"
sp_weaponized_zombie_reward_infectiousness_mild: "Keep it limited"
sp_weaponized_zombie_reward_infectiousness_medium: "Make it contagious"
sp_weaponized_zombie_reward_infectiousness_strong: "Maximize spread"

sp_weaponized_zombie_reward_speed: "Zombie Speed"
sp_weaponized_zombie_reward_speed_desc: "Fast infected are more tactically useful, but they are also harder to predict and trap."
sp_weaponized_zombie_reward_speed_mild: "Slow and deliberate"
sp_weaponized_zombie_reward_speed_medium: "Balanced mobility"
sp_weaponized_zombie_reward_speed_strong: "Make them fast"

sp_weaponized_zombie_reward_durability: "Zombie Durability"
sp_weaponized_zombie_reward_durability_desc: "We can make the infected better at absorbing damage, at the cost of more dangerous breakout potential."
sp_weaponized_zombie_reward_durability_mild: "Limited resilience"
sp_weaponized_zombie_reward_durability_medium: "Harden the zombies"
sp_weaponized_zombie_reward_durability_strong: "Make them endure anything"

sp_weaponized_zombie_reward_cure: "Cure Resistance"
sp_weaponized_zombie_reward_cure_desc: "Countermeasures are improving worldwide. We can adapt the zombie infection to resist them."
sp_weaponized_zombie_reward_cure_mild: "Minimal resistance"
sp_weaponized_zombie_reward_cure_medium: "Complicate the cure"
sp_weaponized_zombie_reward_cure_strong: "Resist all treatment"

sp_weaponized_zombie_reward_friendliness: "Obedience and Friendliness"
sp_weaponized_zombie_reward_friendliness_desc: "Can the infected be steered, tolerated, or directed with selective behavior, or should we accept a truly feral result?"
sp_weaponized_zombie_reward_friendliness_mild: "Accept a feral result"
sp_weaponized_zombie_reward_friendliness_medium: "Conditional loyalty"
sp_weaponized_zombie_reward_friendliness_strong: "Pursue selective control"

sp_weaponized_zombie_reward_field_test: "Field Testing"
sp_weaponized_zombie_reward_field_test_desc: "The laboratories want practical data. We can test the zombies outside the facility, but any test risks proving the critics right."
sp_weaponized_zombie_reward_field_test_conduct: "Conduct field tests"
sp_weaponized_zombie_reward_field_test_skip: "Skip field tests"
weaponized_zombie_field_test_tt: "We will field-test the zombies where possible, prioritizing enemy territory and preferring remote low-population islands when a suitable site exists."
weaponized_zombie_field_test_location_tt: "Field tests will be conducted in §Y[This.GetWeaponizedZombieFieldTestStateName]§!. Enemy territory is preferred, with remote low-population sites used whenever possible."
weaponized_zombie_field_test_state_unknown: "the selected test site"
weaponized_zombie_field_test_skip_tt: "§GWe will deny ourselves practical data and keep the zombies inside the laboratories.§!"

sp_weaponized_zombie_reward_refinement: "Prototype Refinement"
sp_weaponized_zombie_reward_refinement_desc: "The first field data has arrived. Our laboratories can spend another cycle refining containment and extracting more reliable zombie behavior data."
sp_weaponized_zombie_reward_refinement_analyze: "Analyze the field data"
weaponized_zombie_refinement_tt: "§YWe will refine the zombie weapon with data from the first live trials, making the final product more stable before deployment.§!"

sp_weaponized_zombie_reward_forbidden: "Forbidden Branches"
sp_weaponized_zombie_reward_forbidden_desc: "Some researchers insist the final breakthroughs lie beyond disciplined science. Entering those branches may deliver results no sane laboratory should want."
sp_weaponized_zombie_reward_forbidden_caution: "Keep the work disciplined"
sp_weaponized_zombie_reward_forbidden_pursue: "Pursue the forbidden branch"
weaponized_zombie_forbidden_caution_tt: "§YWe retain stricter discipline and reduce the project's final volatility, though progress slows.§!"
weaponized_zombie_forbidden_pursue_tt: "§RWe will cross ethical and scientific red lines for faster progress and more extreme outcomes.§!"

sp_weaponized_zombie_reward_deployment: "Weaponization and Deployment"
sp_weaponized_zombie_reward_deployment_desc: "The zombie weapon is now understood well enough for final packaging, delivery doctrine, and production integration."
sp_weaponized_zombie_reward_deployment_finalize: "Finalize deployment protocols"
weaponized_zombie_deployment_tt: "§YWe complete the final integration work needed to turn the zombie program into a deployable weapon.§!"

sp_weaponized_zombie_reward_filler: "Minor Breakthrough"
sp_weaponized_zombie_reward_filler_desc: "The mandatory zombie program is complete, but one more laboratory cycle could still yield a small technical gain before full production is locked in."

# Anthrax
anthrax_bomb: "Anthrax Bomb"
anthrax_bomb_desc: "A specialized project to develop a bomb that can spread anthrax, a deadly bacterium, over a wide area, causing widespread illness and death."
anthrax_bomb_unlocked_tooltip: "§GThe Anthrax Bomb is now available for production.§!"

# Plague
plague_bomb: "Plague Bomb"
plague_bomb_desc: "A specialized project to develop a devastating plague bomb designed to render entire regions uninhabitable for years. This weapon spreads a virulent strain of plague that causes massive casualties and long-term contamination."
plague_bomb_unlocked_tooltip: "§GThe Plague Bomb is now available for production.§!"

# Tularemia
tularemia_bomb: "Tularemia Bomb"
tularemia_bomb_desc: "A specialized project to develop a tactical biological weapon using tularemia bacteria. Its comparatively limited persistence favors attacks on military concentrations, but exposed civilians remain at risk."
tularemia_bomb_unlocked_tooltip: "§GThe Tularemia Bomb is now available for production.§!"

# Smallpox
smallpox_bomb: "Smallpox Bomb"
smallpox_bomb_desc: "A specialized project to develop the most severe ordinary biological weapon using the smallpox virus. Its long incubation and strong person-to-person spread can sustain a major epidemic until detection, containment, treatment, and vaccination bring the episode under control."
smallpox_bomb_unlocked_tooltip: "§RThe Smallpox Bomb is available for production. A successful release can sustain a major epidemic and requires detection, containment, treatment, and vaccination to defeat.§!"

# Anthrax Prototype Rewards
sp_anthrax_reward_caution: "Take Caution or Chance?"
sp_anthrax_reward_caution_desc: "Our research team is requesting guidance on safety protocols for anthrax development. Should we prioritize speed or safety?"
sp_anthrax_reward_caution_careful: "Take Extra Precautions"
sp_anthrax_reward_caution_risky: "Accept the Risk"
anthrax_careful_research_tt: "§YWe will slow down research to maintain safety protocols, reducing the chance of laboratory accidents.§!"
anthrax_risky_research_tt: "§RWe will accept the risks and continue at full speed, though this may increase the chance of accidental outbreaks in our facilities.§!"

sp_anthrax_reward_field_testing: "Field Testing"
sp_anthrax_reward_field_testing_desc: "Our weapon is ready for field testing. Should we conduct live tests to gather valuable data?"
sp_anthrax_reward_field_testing_conduct: "Conduct Field Tests"
sp_anthrax_reward_field_testing_skip: "Skip Field Testing"
anthrax_field_testing_tt: "§YThe active project facility will conduct a controlled test. Every ordinary agent has the same containment-accident risk, while Anthrax determines only the consequences if containment fails.§!"
anthrax_skip_field_testing_tt: "§GWe will not conduct field tests. This avoids diplomatic consequences and forfeits potential research gains.§!"

sp_anthrax_reward_antibiotics: "Antibiotics Production"
sp_anthrax_reward_antibiotics_desc: "Should we develop countermeasures for our own bioweapon? This would protect us but significantly delay completion."
sp_anthrax_reward_antibiotics_produce: "Start Antibiotic Research"
sp_anthrax_reward_antibiotics_skip: "Skip Antibiotic Research"
anthrax_produce_antibiotics_tt: "§YWe will begin developing antibiotics to counter our own weapon, significantly extending research time but providing protection.§!"
anthrax_skip_antibiotics_tt: "§RWe will not develop countermeasures. Research stays faster, and public morale may suffer.§!"

