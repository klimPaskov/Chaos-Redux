# Chemical Warfare: Nerve Agent Projects
sp_cw_sarin_program: "Sarin Program"
sp_cw_sarin_program_desc: "A dedicated facility project to weaponize sarin production and delivery protocols once baseline nerve-agent research is complete."
sarin_unlocked_tooltip: "§GThe Sarin technology has been unlocked through facility research.§!"

sp_cw_soman_program: "Soman Program"
sp_cw_soman_program_desc: "An advanced facility project focused on soman stabilization, industrialization, and military deployment doctrine."
soman_unlocked_tooltip: "§GThe Soman technology has been unlocked through facility research.§!"

sp_cw_malodor_bomb_program: "Malodor Bomb Program"
sp_cw_malodor_bomb_program_desc: "A US nonlethal raid concept centered on powerful malodorants and aerosol dispersal engineering. The program wrecks cohesion, fouls positions, and disrupts occupation control and sorties without killing outright."
malodor_bomb_unlocked_tooltip: "§GMalodor dispersal racks and incapacitating-agent air payload lots are available for aircraft design and explicit raid preparation.§!"

sp_cw_aphrodisiac_bomb_program: "Behavioral-Agent Aerosol Program"
sp_cw_aphrodisiac_bomb_program_desc: "A speculative US behavioral-chemistry program built around mass aerosol delivery of disinhibiting compounds. The design triggers aggression, confusion, and command breakdown inside the target zone without relying on conventional casualties."
aphrodisiac_bomb_unlocked_tooltip: "§GExperimental behavioral-agent dispersal racks and payload lots are available for aircraft design and explicit raid preparation.§!"

# Nerve Agent Project Unique Rewards
sp_cw_sarin_reward_safety_review: "Safety Protocol Review"
sp_cw_sarin_reward_safety_review_desc: "Our scientists request guidance: enforce stricter safety controls or accelerate testing and production."
sp_cw_sarin_reward_safety_review_careful: "Prioritize Safety"
sp_cw_sarin_reward_safety_review_risky: "Accelerate Development"
sp_cw_sarin_reward_safety_review_careful_tt: "§YProgress slows while safety controls are reinforced.§!"
sp_cw_sarin_reward_safety_review_risky_tt: "§YProgress increases, but oversight is relaxed.§!"

sp_cw_soman_reward_stabilization: "Stabilization Strategy"
sp_cw_soman_reward_stabilization_desc: "Soman weaponization can favor strict quality control or rapid field deployment."
sp_cw_soman_reward_stabilization_careful: "Controlled Standardization"
sp_cw_soman_reward_stabilization_aggressive: "Rapid Militarization"
sp_cw_soman_reward_stabilization_careful_tt: "§YSafer rollout and minor stability gains, at the cost of speed.§!"
sp_cw_soman_reward_stabilization_aggressive_tt: "§YFaster rollout, but with minor domestic destabilization.§!"

sp_cw_malodor_reward_dispersal: "Dispersal Doctrine"
sp_cw_malodor_reward_dispersal_desc: "The team can either harden the malodor carrier mix for predictable saturation or rush aggressive dispersal trials for faster deployment."
sp_cw_malodor_reward_dispersal_careful: "Stabilize the Carrier Mix"
sp_cw_malodor_reward_dispersal_aggressive: "Rush Area-Saturation Trials"
sp_cw_malodor_reward_dispersal_careful_tt: "§YProgress slows while the dispersal chemistry is made safer and more controllable.§!"
sp_cw_malodor_reward_dispersal_aggressive_tt: "§YProgress accelerates, but domestic unease grows around the program.§!"

sp_cw_aphrodisiac_reward_behavior: "Behavioral Modeling"
sp_cw_aphrodisiac_reward_behavior_desc: "The most speculative branch of the program can follow carefully screened modeling work or riskier human-response extrapolation to speed field design."
sp_cw_aphrodisiac_reward_behavior_careful: "Use Controlled Modeling"
sp_cw_aphrodisiac_reward_behavior_risky: "Push Unscreened Response Trials"
sp_cw_aphrodisiac_reward_behavior_careful_tt: "§YProgress slows while the project remains politically contained and more defensible.§!"
sp_cw_aphrodisiac_reward_behavior_risky_tt: "§YProgress accelerates, but political fallout increases around the project.§!"

