# Smallpox Prototype Rewards
sp_smallpox_reward_caution: "Proceed with Ultimate Caution?"
sp_smallpox_reward_caution_desc: "Our research team is requesting the highest level of safety protocols for smallpox development. This is the most dangerous bioweapon ever conceived - should we implement extreme safety measures?"
sp_smallpox_reward_caution_careful: "Maximum Safety Protocols"
sp_smallpox_reward_caution_risky: "Accept the Extreme Risk"
smallpox_careful_research_tt: "§YWe will implement the most stringent safety protocols ever used, significantly slowing research but drastically reducing the chance of catastrophic laboratory accidents.§!"
smallpox_risky_research_tt: "§RWe will accept the extreme risks and continue at full speed, though this may cause devastating nationwide outbreaks in our own facilities.§!"

sp_smallpox_reward_field_testing: "Field Testing the Ultimate Weapon"
sp_smallpox_reward_field_testing_desc: "Our smallpox weapon is ready for field testing. Should we test this weapon of mass destruction? Warning: Smallpox is extremely contagious and may trigger uncontrollable epidemics."
sp_smallpox_reward_field_testing_conduct: "Conduct Field Tests"
sp_smallpox_reward_field_testing_skip: "Skip Field Testing"
smallpox_field_testing_tt: "§YThe active project facility will conduct a controlled test. Every ordinary agent has the same containment-accident risk, while severe Smallpox determines only the consequences if containment fails.§!"
smallpox_skip_field_testing_tt: "§GWe will not conduct field tests. This avoids catastrophic consequences and forfeits critical research data.§!"

# Bioweapon Events
chaosx_bioweapon.2.t: "Anthrax Test Contained"
chaosx_bioweapon.2.d: "The controlled Anthrax test at [field_test_state.GetName] has concluded without a containment breach. Instruments, sealed samples, and medical observations have produced usable project data while the surrounding population remains unexposed."
chaosx_bioweapon.2.a: "Archive the results."

chaosx_bioweapon.3.t: "Anthrax Test Containment Failure"
chaosx_bioweapon.3.d: "Containment failed during the Anthrax test at [field_test_state.GetName]. The facility has been sealed, exposed personnel are being traced, and the biological-response service is treating the breach as an incubating outbreak."
chaosx_bioweapon.3.a: "Seal the facility and trace every contact."
bio_field_test_contained_result_tt: "§GThe test remained contained.§! Project progress is recorded and no outbreak is seeded."
bio_field_test_accident_result_tt: "The exact project-facility state receives an incubating outbreak record. Detection, spread, deaths, medical pressure, evidence, attribution, and Condemnation will follow the shared biological lifecycle."

# Stockpile Accident Event
chaosx_bioweapon.4.t: "Anthrax Arsenal Incident"
chaosx_bioweapon.4.d: "A handling failure has struck the anthrax stockpile at [lab_accident_state.GetName]. Authorities classify the emergency as [GetBioStockpileAccidentSeverityText]. [?bio_stockpile_safety_last_accident_stock_loss|.0] payload units were destroyed. Medical and containment teams are responding to every exposure created by the breach."
chaosx_bioweapon.4.a: "Seal the complex and account for every canister."

# Plague Events
chaosx_bioweapon.7.t: "Plague Test Contained"
chaosx_bioweapon.7.d: "The controlled Plague test at [field_test_state.GetName] has concluded without a containment breach. The facility remains sealed, the surrounding population remains unexposed, and the project has gained reliable observations."
chaosx_bioweapon.7.a: "Archive the results."

chaosx_bioweapon.8.t: "Plague Test Containment Failure"
chaosx_bioweapon.8.d: "Containment failed during the Plague test at [field_test_state.GetName]. Isolation wards are opening around the facility while epidemiologists trace personnel, vectors, and supplies that may have carried the agent beyond the sealed perimeter."
chaosx_bioweapon.8.a: "Quarantine the facility and trace every vector."

chaosx_bioweapon.9.t: "Plague Arsenal Incident"
chaosx_bioweapon.9.d: "The plague stockpile at [lab_accident_state.GetName] has suffered a containment incident classified as [GetBioStockpileAccidentSeverityText]. [?bio_stockpile_safety_last_accident_stock_loss|.0] payload units were destroyed. Isolation wards and field laboratories are tracing every possible exposure."
chaosx_bioweapon.9.a: "Lock down the complex and trace the breach."

# Tularemia Events
chaosx_bioweapon.100.t: "Tularemia Test Contained"
chaosx_bioweapon.100.d: "The controlled Tularemia test at [field_test_state.GetName] has concluded without a containment breach. The facility remains secure, the surrounding population remains unexposed, and the project has gained useful tactical observations."
chaosx_bioweapon.100.a: "Archive the results."

chaosx_bioweapon.101.t: "Tularemia Test Containment Failure"
chaosx_bioweapon.101.d: "Containment failed during the Tularemia test at [field_test_state.GetName]. Medical teams are tracing exposed personnel and sealing the facility while the biological-response service monitors the surrounding area for an incubating outbreak."
chaosx_bioweapon.101.a: "Seal the facility and begin treatment."

chaosx_bioweapon.102.t: "Tularemia Arsenal Incident"
chaosx_bioweapon.102.d: "A tularemia handling incident at [lab_accident_state.GetName] has reached [GetBioStockpileAccidentSeverityText]. [?bio_stockpile_safety_last_accident_stock_loss|.0] payload units were destroyed. Containment teams are isolating the facility while medical units examine the surrounding population."
chaosx_bioweapon.102.a: "Contain the site and begin treatment."

# Smallpox Events
chaosx_bioweapon.201.t: "Smallpox Test Contained"
chaosx_bioweapon.201.d: "The controlled Smallpox test at [field_test_state.GetName] has concluded without a containment breach. Every sample remains accounted for, the surrounding population remains unexposed, and the project has gained the required observations."
chaosx_bioweapon.201.a: "Archive the results under maximum security."

chaosx_bioweapon.202.t: "Smallpox Test Containment Failure"
chaosx_bioweapon.202.d: "Containment failed during the Smallpox test at [field_test_state.GetName]. The facility has entered full isolation, vaccination teams are mobilizing, and the biological-response service is treating every possible exposure as the beginning of a severe outbreak."
chaosx_bioweapon.202.a: "Declare a biological emergency."

chaosx_bioweapon.203.t: "Smallpox Arsenal Incident"
chaosx_bioweapon.203.d: "The smallpox arsenal at [lab_accident_state.GetName] has suffered an emergency classified as [GetBioStockpileAccidentSeverityText]. [?bio_stockpile_safety_last_accident_stock_loss|.0] payload units were destroyed. Vaccination teams, isolation wards, and military containment units are mobilizing around the complex."
chaosx_bioweapon.203.a: "Declare a national biological emergency."

chaosx_bioweapon.207.t: "First Use of Smallpox as a Weapon!"
chaosx_bioweapon.207.d: "[FROM.GetNameDef] has crossed the ultimate red line in biological warfare by deploying smallpox as a strategic weapon. This marks the first time in history that the disease has been deliberately weaponized and used against civilian populations. The international community is watching in horror as reports emerge of epidemic outbreaks in enemy territory."
chaosx_bioweapon.207.a: "This is a crime against humanity!"
chaosx_bioweapon.207.b: "Strategic necessity demanded extreme measures"

chaosx_bioweapon.208.t: "Smallpox Epidemic Detected!"
chaosx_bioweapon.208.d: "Emergency health officials have confirmed the presence of smallpox in our territory. We must immediately mobilize all available resources for emergency containment and vaccination programs to prevent a nationwide catastrophe."
chaosx_bioweapon.208.a: "Declare a national health emergency!"

