l_english:
  chaosx.fallout.572.t: "The County Fair Returns"
  chaosx.fallout.572.desc: "In the North American grain belt, three rural districts have kept enough food, tools, and watchmen to send a delegation to [?fallout_event_572_target_state_id.GetName]. The host ground has a repair shed, a cleared field, and a ledger of families who still owe one another a season. The fair can become a civic exhibition, a careful exchange, a disciplined muster, or a memorial gathering. Each choice spends stores before the first stall opens."
  chaosx.fallout.572.a: "Put the civic boards in charge"
  chaosx.fallout.572.a.tt: "Spend Food 6, Scrap 4, and Recognition 2. The host state will be rechecked before a result in 35 days. A civic exhibition can build trust and repair credit, but a poorly ordered field may expose old grievances."
  chaosx.fallout.572.b: "Give the exchange stalls priority"
  chaosx.fallout.572.b.tt: "Spend Food 8, Fuel 4, Scrap 2, and Recognition 1. The host state will be rechecked before a result in 35 days. A seasonal exchange can strengthen supply, but spoiled stores and hard bargaining can leave a ration debt."
  chaosx.fallout.572.c: "Call a disciplined local muster"
  chaosx.fallout.572.c.tt: "Spend Fuel 6, Equipment 3, and Recognition 1. The host state will be rechecked before a result in 35 days. A militia muster can restore order, but an accident or coercive levy can make the fair a source of fear."
  chaosx.fallout.572.d: "Set aside a memorial ground"
  chaosx.fallout.572.d.tt: "Spend Food 5, Medicine 5, and Recognition 2. The host state will be rechecked before a result in 35 days. A memorial gathering can bind families together, but illness or competing rites can turn remembrance into grievance."
  chaosx.fallout.574.t: "The Fair Ground in [?fallout_event_572_target_state_id.GetName]"
  chaosx.fallout.574.civic.success.d: "The civic boards kept the field open through a week of rain. Repair crews marked each contribution, families accepted a shared order of stalls, and the host district gained a public institution that does not belong to one office."
  chaosx.fallout.574.civic.partial.d: "The civic exhibition opened, but the repair ledger and the family roll did not agree. The host district kept a smaller gathering and a list of grievances that the next season must answer."
  chaosx.fallout.574.civic.failure.d: "The civic exhibition collapsed when the boards disputed the field and the repair crews withdrew. Stands broke under the crowd, stores were counted twice, and the host district carries a local loss that cannot be hidden behind a speech."
  chaosx.fallout.574.exchange.success.d: "The exchange stalls kept their measures through the wet week. Preserved food, seed, tools, and livestock moved under one route book, and the host district gained a reliable seasonal supply tradition."
  chaosx.fallout.574.exchange.partial.d: "The exchange moved enough food to matter, but fuel and route marks failed at the outer stalls. The host district kept a modest trade custom and a debt ledger for the next gathering."
  chaosx.fallout.574.exchange.failure.d: "The exchange became a ration dispute. Spoilage reached the cold store, two route books contradicted one another, and the host district closed the stalls before the crowd could turn the shortage into a fight."
  chaosx.fallout.574.muster.success.d: "The local companies inspected their tools in public and accepted one chain of command for the host ground. Volunteers signed without a forced levy, and the fair left the district safer without placing every family under arms."
  chaosx.fallout.574.muster.partial.d: "The muster found enough discipline for a guarded field, but the companies argued over who could recruit from the outer farms. The host district kept a watch roster and a warning about pressure at the next gathering."
  chaosx.fallout.574.muster.failure.d: "The muster failed when a weapon was mishandled and the recruiting tables became a contest for authority. The fair ground lost stores and trust, while the host district recorded an arms grievance beside the names of the injured."
  chaosx.fallout.574.memorial.success.d: "The memorial ground opened beside the relief kitchen. Families placed recovered names with care, the medicine tent held, and the host district gained a remembrance tradition that leaves room for every household."
  chaosx.fallout.574.memorial.partial.d: "The memorial gathering held through the first service, but the family roll and the health table could not keep pace. The host district kept a smaller remembrance and a promise to repair the missing names."
  chaosx.fallout.574.memorial.failure.d: "Illness reached the memorial ground before the final names were read. Families withdrew from the crowded pavilion, relief stores were spent on treatment, and the host district left with a disputed memory instead of a shared rite."
  chaosx.fallout.574.a: "Record the result and prepare the first seasonal review"
  chaosx.fallout.574.a.tt: "The result is settled through the authenticated host state. A first seasonal review is scheduled for 365 days later."
  chaosx.fallout.576.t: "The First Seasonal Review"
  chaosx.fallout.576.success.d: "A year later, the field in [?fallout_event_572_target_state_id.GetName] has a date, a route book, and a place for families who were not present at the first gathering. The fair has become an annual institution without erasing the districts that built it."
  chaosx.fallout.576.partial.d: "A year later, the fair returns in a smaller form. The stalls and remembrance ground survived, but the host district still carries a grievance ledger and cannot promise the same reach next season."
  chaosx.fallout.576.failure.d: "A year later, the fair has not become a trusted institution. The host district keeps the failure memory, closes the damaged ground, and sends its first warning to any council that asks to repeat the gathering."
  chaosx.fallout.576.a: "Close the review"
  chaosx.fallout.576.a.tt: "The callback is recorded and the County Fair transaction is cleaned up after its delayed receipts are released."
  fallout.event_log.county_fair_returns.name: "The County Fair Returns"
  fallout.event_log.county_fair_returns.detail: "[GetFalloutEvent572EventLogDetail]"
  fallout.event_log.county_fair_returns.detail.choice_civic: "The host district chose a civic exhibition."
  fallout.event_log.county_fair_returns.detail.choice_exchange: "The host district chose a seasonal exchange."
  fallout.event_log.county_fair_returns.detail.choice_muster: "The host district chose a disciplined local muster."
  fallout.event_log.county_fair_returns.detail.choice_memorial: "The host district chose a memorial gathering."
  fallout.event_log.county_fair_returns.detail.civic_success: "The civic exhibition became a durable public institution."
  fallout.event_log.county_fair_returns.detail.civic_partial: "The civic exhibition held in smaller form and left a grievance ledger."
  fallout.event_log.county_fair_returns.detail.civic_failure: "The civic exhibition failed on the host ground."
  fallout.event_log.county_fair_returns.detail.exchange_success: "The seasonal exchange secured a reliable supply tradition."
  fallout.event_log.county_fair_returns.detail.exchange_partial: "The seasonal exchange moved stores but left a route debt."
  fallout.event_log.county_fair_returns.detail.exchange_failure: "The seasonal exchange became a ration dispute."
  fallout.event_log.county_fair_returns.detail.muster_success: "The local muster restored order without a forced levy."
  fallout.event_log.county_fair_returns.detail.muster_partial: "The local muster held the field but left recruitment pressure."
  fallout.event_log.county_fair_returns.detail.muster_failure: "The local muster left an arms grievance."
  fallout.event_log.county_fair_returns.detail.memorial_success: "The memorial gathering became a shared remembrance tradition."
  fallout.event_log.county_fair_returns.detail.memorial_partial: "The memorial gathering held with missing names still to repair."
  fallout.event_log.county_fair_returns.detail.memorial_failure: "The memorial gathering ended in illness and contested memory."
  fallout.event_log.county_fair_returns.detail.callback_success: "The first seasonal review established an annual fair."
  fallout.event_log.county_fair_returns.detail.callback_partial: "The first seasonal review preserved a smaller tradition."
  fallout.event_log.county_fair_returns.detail.callback_failure: "The first seasonal review closed the failed fair ground."
  fallout.event_log.county_fair_returns.detail.cancelled: "The County Fair receipt was cancelled before its host state could be revalidated."
