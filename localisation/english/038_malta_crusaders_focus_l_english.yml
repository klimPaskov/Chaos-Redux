l_english:
mcf_crusade_is_underway: "The Crusade Is Underway"
mcf_crusade_is_underway_desc: "The banners are out, the ships are loaded and the council has to make a war that began in a single week last longer than that week."
mcf_crusade_is_underway_tt: "Command power rises. The campaign decisions and missions are open."
mcf_hold_the_four_anchors: "Hold the Four Anchors"
mcf_hold_the_four_anchors_desc: "Malta, Jerusalem, the sea road and a Holy Land port are named as the four places that may not fall. Marshals and admirals are told which they answer for."
mcf_hold_the_four_anchors_tt: "The missions to keep the sea road open and to protect the Grand Harbour begin."
mcf_convene_the_council: "Convene the Crusade Council"
mcf_convene_the_council_desc: "The Grand Master calls the marshals of every seated order to Valletta. For the first time they sit at one table with a map of all four anchors in front of them."
mcf_convene_the_council_tt: "Order Cohesion and command power rise, and the first political choice opens."
mcf_secure_the_sea_road: "Secure the Sea Road"
mcf_secure_the_sea_road_desc: "Every escort in Malta is assigned to the convoy lanes between the Grand Harbour and the Holy Land coast, and the crossing is made in company or not at all."
mcf_secure_the_sea_road_tt: "Convoys arrive and supply consumption falls for six months. The Mediterranean lane opens."
mcf_fortress_malta: "Fortress Malta"
mcf_fortress_malta_desc: "Fort St Angelo, the Grand Harbour and the rock cellars are put in order. Workshops go into the old galleries where the guns cannot reach them."
mcf_fortress_malta_tt: "Malta gains a dockyard, a road level and building slots."
mcf_chain_of_fortified_ports: "Chain of Fortified Ports"
mcf_chain_of_fortified_ports_desc: "Engineers go to Cyprus and the island garrisons with stone, timber and orders to give every harbour a quay wall and a slip."
mcf_chain_of_fortified_ports_tt: "Held bridge states gain a dockyard and a building slot, and port projects cost less."
mcf_convoy_republic: "Convoy Republic"
mcf_convoy_republic_desc: "The harbour masters of Valletta and Cyprus pool their ships under one convoy court that settles claims, assigns escorts and pays for lost cargo."
mcf_convoy_republic_tt: "Convoys and destroyers arrive, and the sea road escort and the air bridge cost less."
mcf_workshops_of_the_orders: "Workshops of the Orders"
mcf_workshops_of_the_orders_desc: "Each order opens a workshop in the buildings it already holds. Armourers, bowyers and carpenters work to one pattern for the first time."
mcf_workshops_of_the_orders_tt: "Malta and the Holy Land gain a military factory, and banners cost less."
mcf_supply_hub_network: "Supply Hub Network"
mcf_supply_hub_network_desc: "Depots, water points and relay stations are built along the coast road and the rail line, and the trains finally have somewhere to stop."
mcf_supply_hub_network_tt: "Trains arrive and two held expedition states gain a road level."
mcf_foreign_contracts: "Foreign Contracts"
mcf_foreign_contracts_desc: "Steel and fuel come from friendly merchants at a price the orders resent. The council signs because the island has none of its own."
mcf_foreign_contracts_tt: "Malta gains steel. The campaign has used foreign help, and Order Cohesion falls."
mcf_foreign_contracts_avail_tt: "Local substitution must not have been chosen."
mcf_captured_concessions: "Captured Concessions"
mcf_captured_concessions_desc: "The oil and mineral rights of the Holy Land are taken over by the council. The companies that held them are paid in promises."
mcf_captured_concessions_tt: "The Holy Land yields oil. The state loses compliance and Sacred Legitimacy falls."
mcf_local_substitution: "Local Substitution"
mcf_local_substitution_desc: "Charcoal burners, salvage crews and ropewalkers are put to work. The island learns to build with what it can reach."
mcf_local_substitution_tt: "Fuel and support equipment arrive and Order Cohesion rises."
mcf_local_substitution_avail_tt: "Foreign contracts must not have been chosen."
mcf_unleash_the_knight_banners: "Unleash the Knight Banners"
mcf_unleash_the_knight_banners_desc: "The marshals are told to attack. The banners ride at once with the ammunition and the rifles they have, which are fewer than anyone would like."
mcf_unleash_the_knight_banners_tt: "Two armored knight banners and one mounted column appear at reduced equipment, army experience rises, and supply consumption rises for six months. The army lane opens."
mcf_standardize_the_banners: "Standardize the Banners"
mcf_standardize_the_banners_desc: "A small readable set of banner patterns replaces the habits of a dozen orders. Every banner trains from one book and draws from one quartermaster."
mcf_standardize_the_banners_tt: "An Army Out of Time becomes Banners Standardized, and the council can field more banners."
mcf_armour_against_the_century: "Armour Against the Century"
mcf_armour_against_the_century_desc: "The smiths of Valletta cut plate to the pattern of modern helmets and breastplates, tested against rifle bullets on the quay."
mcf_armour_against_the_century_tt: "Better rifles are researched and one armored knight banner appears."
mcf_ranged_orders: "Ranged Orders"
mcf_ranged_orders_desc: "The crossbowmen and the gun crews are given their own officers, their own barracks and a place at the council table."
mcf_ranged_orders_tt: "Artillery is researched and one crossbow levy appears."
mcf_engines_of_siege: "Engines of Siege"
mcf_engines_of_siege_desc: "The brotherhoods wheel their rebuilt engines out of the arsenal, and the sappers teach the gun crews how to open a wall."
mcf_engines_of_siege_tt: "Better artillery is researched, one siege host appears, and regional crusades need fewer rifles."
mcf_modern_combined_arms: "Modern Combined Arms"
mcf_modern_combined_arms_desc: "Radios, field telephones, anti-air sections and supply columns are fitted into every banner, and the marshals plan battles with all of them at once."
mcf_modern_combined_arms_tt: "Radio, signals and logistics companies are researched and army experience rises."
mcf_anti_tank_lances: "Anti-Tank Lances"
mcf_anti_tank_lances_desc: "Lancers train with rifle grenades and explosive charges against old tanks bought from the scrapyards of three armies."
mcf_anti_tank_lances_tt: "A mounted column appears with a second round of army experience."
mcf_mechanized_knight_carriers: "Mechanized Knight Carriers"
mcf_mechanized_knight_carriers_desc: "The mounted tradition is carried on in light tanks and trucks, with the heraldry painted on the turret and the horse emblem on the bonnet."
mcf_mechanized_knight_carriers_tt: "Motorized infantry and light tanks are researched and a mounted column appears."
mcf_mechanized_knight_carriers_avail_tt: "The council must run at least ten military factories."
mcf_charter_the_orders: "Charter the Orders"
mcf_charter_the_orders_desc: "Each order receives a written charter that states what it owes the council and what it may keep. Six paths open, one for each brotherhood."
mcf_charter_the_orders_tt: "Army experience rises and the six order paths open."
mcf_hospitals_under_fire: "Hospitals Under Fire"
mcf_hospitals_under_fire_desc: "The Hospitallers set up wards behind every sector of the front, and the wounded no longer have to be carried to the sea before anyone looks at them."
mcf_hospitals_under_fire_tt: "The Hospitallers take a seat. A fortress commandery appears in the Holy Land and Sacred Legitimacy rises."
mcf_fortress_medicine: "Fortress Medicine"
mcf_fortress_medicine_desc: "Cellars, cisterns and ward halls are built into the walls of the Holy Land cities so the sick can be kept under cover during a siege."
mcf_fortress_medicine_tt: "The Holy Land gains a civilian factory and a building slot."
mcf_recovery_columns: "Recovery Columns"
mcf_recovery_columns_desc: "Mobile infirmaries follow the divisions with ambulances and convalescent camps, and the Hospitaller marshal has the right to hold men back from the line."
mcf_recovery_columns_tt: "Logistics companies are researched and the Hospitaller seat becomes senior."
mcf_relief_access_charters: "Relief Access Charters"
mcf_relief_access_charters_desc: "Hospitals open their doors to every faith by charter. Pilgrims and villagers alike learn that the brothers will treat them."
mcf_relief_access_charters_tt: "Sacred Legitimacy rises greatly and pilgrim routes ease resistance for a year."
mcf_the_hospital_and_the_sword: "The Hospital and the Sword"
mcf_the_hospital_and_the_sword_desc: "The Grand Master rules that the order of the sick shall carry the sword for the council, and that no brother may be sent to a front without a ward behind him."
mcf_the_hospital_and_the_sword_tt: "The Hospitallers become the dominant order. Their primacy replaces The Orders Recalled, the other orders lose standing and resent it."
mcf_the_hospital_and_the_sword_avail_tt: "The Grand Magistry must have standardized the order law, and no other order may have been named dominant."
mcf_reopen_the_treasury: "Reopen the Treasury"
mcf_reopen_the_treasury_desc: "The Templar revival unlocks the strong rooms under its commandery and begins lending to the council at a rate the council reads with attention."
mcf_reopen_the_treasury_tt: "The Templar Revival takes a seat. Political power arrives and Order Cohesion falls because the other orders resent the lender."
mcf_foreign_credit_network: "Foreign Credit Network"
mcf_foreign_credit_network_desc: "Templar bankers write to Genoa, Marseille and Barcelona. Money, rifles and convoy space come back, together with expectations."
mcf_foreign_credit_network_tt: "Rifles and convoys arrive. The campaign has used foreign help and Order Cohesion falls."
mcf_war_finance_offices: "War Finance Offices"
mcf_war_finance_offices_desc: "Templar accountants move into the ministries and put every workshop, dock and storehouse on a ledger."
mcf_war_finance_offices_tt: "The Templar seat becomes senior and Malta gains a military factory."
mcf_offensive_procurement: "Offensive Procurement"
mcf_offensive_procurement_desc: "Templar buyers order stores for a campaign season in advance, and the marshals discover they can plan beyond the next convoy."
mcf_offensive_procurement_tt: "A mounted column and an armored knight banner appear at reduced equipment and army experience rises."
mcf_the_temples_treasury: "The Temple's Treasury"
mcf_the_temples_treasury_desc: "The Grand Master places the treasury of the crusade in Templar hands. The war has a bank at last, and the bank has a say in the war."
mcf_the_temples_treasury_tt: "The Templar Revival becomes the dominant order. Its primacy replaces The Orders Recalled, the other orders lose standing and resent it."
mcf_the_temples_treasury_avail_tt: "The Grand Magistry must have standardized the order law, and no other order may have been named dominant."
mcf_command_the_sea_road: "Command the Sea Road"
mcf_command_the_sea_road_desc: "The naval chapters take over the convoy stations and the pilot boats, and the admirals move into Valletta."
mcf_command_the_sea_road_tt: "The Naval Orders take a seat. Destroyers are researched and convoys arrive."
mcf_island_chapters: "Island Chapters"
mcf_island_chapters_desc: "Every island garrison receives a chapter of the Naval Orders, with a commander, a chaplain and a harbour master."
mcf_island_chapters_tt: "Held bridge states gain a building slot and a guard division appears on an island."
mcf_boarding_companies: "Boarding Companies"
mcf_boarding_companies_desc: "Seamen who once took merchantmen with grapnels learn to take harbour towns the same way, and the marines' officers are trained in Valletta."
mcf_boarding_companies_tt: "Marines are researched and the Naval seat becomes senior."
mcf_amphibious_banners: "Amphibious Banners"
mcf_amphibious_banners_desc: "Landing barges are built at the old galley slips, and the banners practise leaving a boat under fire."
mcf_amphibious_banners_tt: "Landing parties are stronger in a recovery, convoys arrive and army experience rises."
mcf_the_sea_wall: "The Sea Wall"
mcf_the_sea_wall_desc: "The Grand Master rules that the sea is the first wall of the crusade and that the admirals sit above the marshals in time of war."
mcf_the_sea_wall_tt: "The Naval Orders become the dominant order. Their primacy replaces The Orders Recalled, the other orders lose standing and resent it."
mcf_the_sea_wall_avail_tt: "The Grand Magistry must have standardized the order law, and no other order may have been named dominant."
mcf_heavy_armour_schools: "Heavy Armour Schools"
mcf_heavy_armour_schools_desc: "The Teutonic Chapter brings its drill books and its commander to Valletta. Within a month the young knights stand in rank for hours at a time."
mcf_heavy_armour_schools_tt: "The Teutonic Chapter takes a seat. A knight commander joins and an armored knight banner appears."
mcf_iron_discipline: "Iron Discipline"
mcf_iron_discipline_desc: "Roll calls, inspections and written orders replace the arguments of the first months. The chapter's methods spread from its own banners to everyone who drills beside them."
mcf_iron_discipline_tt: "Army experience rises and Order Cohesion rises."
mcf_eastern_chapter_doctrine: "Eastern Chapter Doctrine"
mcf_eastern_chapter_doctrine_desc: "Veterans of the chapter's old marches teach the divisions to hold a cold and broken front, to dig in and to live off forest roads."
mcf_eastern_chapter_doctrine_tt: "Mountain troops are researched and the Teutonic seat becomes senior."
mcf_knight_foundries: "Knight Foundries"
mcf_knight_foundries_desc: "Furnaces are fired in the Holy Land and in Valletta to forge helmets, shields and armoured breastplates by the thousand."
mcf_knight_foundries_tt: "Malta and the Holy Land gain a military factory and a building slot."
mcf_the_black_cross_arsenal: "The Black Cross Arsenal"
mcf_the_black_cross_arsenal_desc: "The Grand Master gives the Teutonic Chapter the command of the army's drill, supply and armour, and the black cross is painted on every gate."
mcf_the_black_cross_arsenal_tt: "The Teutonic Chapter becomes the dominant order. Its primacy replaces The Orders Recalled, the other orders lose standing and resent it."
mcf_the_black_cross_arsenal_avail_tt: "The Grand Magistry must have standardized the order law, and no other order may have been named dominant."
mcf_field_hospitals_for_the_shunned: "Field Hospitals for the Shunned"
mcf_field_hospitals_for_the_shunned_desc: "The Order of Saint Lazarus takes the sick that other wards refuse and sets up tents for them at the edge of every camp."
mcf_field_hospitals_for_the_shunned_tt: "The Order of Saint Lazarus takes a seat, Sacred Legitimacy rises and manpower recovers."
mcf_quarantine_orders: "Quarantine Orders"
mcf_quarantine_orders_desc: "Roads are watched, wells are marked and infected villages are closed by a ring of brothers with lanterns."
mcf_quarantine_orders_tt: "Support equipment arrives, Order Cohesion rises and Sacred Legitimacy rises."
mcf_disease_wardens: "Disease Wardens"
mcf_disease_wardens_desc: "Wardens trained at the Lazarite houses travel with every column and are given the right to halt a march for the sake of a camp."
mcf_disease_wardens_tt: "Military police companies are researched and the Lazarite seat becomes senior."
mcf_the_lazarite_frontier: "The Lazarite Frontier"
mcf_the_lazarite_frontier_desc: "Lazarite wardens settle in the worst-hit districts of the expedition, and local people begin to bring their sick to them."
mcf_the_lazarite_frontier_tt: "Held expedition states gain compliance and a guard division of wardens appears."
mcf_the_green_cross_commands: "The Green Cross Commands"
mcf_the_green_cross_commands_desc: "The Grand Master gives the Order of Saint Lazarus the command of every district that the other orders will not enter. It fights and nurses in the same regions."
mcf_the_green_cross_commands_tt: "The Order of Saint Lazarus becomes the dominant order. Its primacy replaces The Orders Recalled, the other orders lose standing and resent it."
mcf_the_green_cross_commands_avail_tt: "The Grand Magistry must have standardized the order law, and no other order may have been named dominant."
mcf_rebuild_the_engines: "Rebuild the Engines"
mcf_rebuild_the_engines_desc: "The siege brotherhoods roll their engines out of the arsenals, oil the windlasses and recut the ropes."
mcf_rebuild_the_engines_tt: "The Siege Brotherhoods take a seat and a siege host appears."
mcf_engineers_of_the_walls: "Engineers of the Walls"
mcf_engineers_of_the_walls_desc: "The brothers draw plans of every fort in the Holy Land and train sappers who can bring one down or hold one up."
mcf_engineers_of_the_walls_tt: "Engineers are researched and an engineer division appears."
mcf_captured_artillery_schools: "Captured Artillery Schools"
mcf_captured_artillery_schools_desc: "Gun crews from three captured arsenals teach the brotherhood how modern howitzers are laid, and the brothers teach them how to open walls."
mcf_captured_artillery_schools_tt: "Army experience rises and the Siege seat becomes senior."
mcf_mobile_siege_trains: "Mobile Siege Trains"
mcf_mobile_siege_trains_desc: "The engines are mounted on railway wagons and lorries, and the siege train arrives at a wall in a week rather than a season."
mcf_mobile_siege_trains_tt: "Trains arrive and regional crusades need fewer rifles."
mcf_the_brotherhood_of_the_broken_gate: "The Brotherhood of the Broken Gate"
mcf_the_brotherhood_of_the_broken_gate_desc: "The Grand Master places the siege brotherhoods at the head of the army's engineering and fortifications."
mcf_the_brotherhood_of_the_broken_gate_tt: "The Siege Brotherhoods become the dominant order. Their primacy replaces The Orders Recalled, the other orders lose standing and resent it."
mcf_the_brotherhood_of_the_broken_gate_avail_tt: "The Grand Magistry must have standardized the order law, and no other order may have been named dominant."
mcf_frame_the_settlement: "Frame the Settlement"
mcf_frame_the_settlement_desc: "The council puts the question that every order has avoided: who commands the expedition when the first battles are over. Three answers are drafted."
mcf_frame_the_settlement_tt: "Order Cohesion rises. The Grand Magistry, the Assembly of the Langues and the civil settlement open."
mcf_codify_emergency_command: "Codify the Emergency Command"
mcf_codify_emergency_command_desc: "The Grand Master's orders are written into the statutes of the crusade. Marshals who disobey will answer to the Grand Magistry and to no one else."
mcf_codify_emergency_command_tt: "Command power rises greatly and Order Cohesion falls. The Grand Magistry route is chosen."
mcf_appoint_central_officers: "Appoint Central Officers"
mcf_appoint_central_officers_desc: "The Grand Master names the marshals and the quartermasters directly, and the orders learn to send names rather than candidates."
mcf_appoint_central_officers_tt: "Army experience and command power rise and the council can field more banners."
mcf_absorb_chapter_treasuries: "Absorb the Chapter Treasuries"
mcf_absorb_chapter_treasuries_desc: "The chapter strong rooms are opened by order of the Grand Master. Their contents go to the common stores and the orders note who gave the order."
mcf_absorb_chapter_treasuries_tt: "Political power, rifles and support equipment arrive. Order Cohesion falls and every order's grievance rises. This can be done once."
mcf_standardize_order_law: "Standardize the Order Law"
mcf_standardize_order_law_desc: "The statutes of six orders are replaced by a single code. Every brother, from the Hospitallers to the siege masters, answers to the same article for the same offence."
mcf_standardize_order_law_tt: "Order Cohesion rises and the Grand Master can name a dominant order."
mcf_permanent_grand_magistry: "The Permanent Grand Magistry"
mcf_permanent_grand_magistry_desc: "The crusade becomes a standing sovereign order. Its seal replaces the cross of the provisional council, and its Grand Master rules for life."
mcf_permanent_grand_magistry_tt: "The realm becomes the Sovereign Order of Malta under the Grand Magistry. The dominant order's primacy remains."
mcf_permanent_grand_magistry_avail_tt: "An order must be named dominant, the command must be Functional or better and no demand or incident may be open."
mcf_restore_the_langues: "Restore the Langues"
mcf_restore_the_langues_desc: "The old divisions of the Order by language, Auvergne, Provence, Italy, Aragon, Castile, England and Germany, are called back as constituencies with a voice in the council."
mcf_restore_the_langues_tt: "All six orders take a seat and Order Cohesion rises. The Assembly of the Langues is chosen."
mcf_allocate_council_seats: "Allocate the Council Seats"
mcf_allocate_council_seats_desc: "Seats are reapportioned by language and by service, and old quarrels over precedence are settled in writing."
mcf_allocate_council_seats_tt: "Every order's grievance is cleared and Order Cohesion rises."
mcf_establish_shared_command: "Establish a Shared Command"
mcf_establish_shared_command_desc: "A permanent staff of officers from every order sits in one building. A conference of the marshals becomes a matter of routine."
mcf_establish_shared_command_tt: "Joint Command no longer waits for a cooldown to cool and succeeds more often."
mcf_rotate_offices: "Rotate the Offices"
mcf_rotate_offices_desc: "The great offices of the Order pass from chapter to chapter on a fixed schedule, and no one holds the treasury long enough to be blamed for it."
mcf_rotate_offices_tt: "Order demands come less often."
mcf_arbitrate_land_grants: "Arbitrate the Land Grants"
mcf_arbitrate_land_grants_desc: "A standing court hears every claim to a harbour, a farm or a house, and its rulings are carried out by the brothers who sit on it."
mcf_arbitrate_land_grants_tt: "Settlement actions cost less and Sacred Legitimacy rises."
mcf_constitutional_confederation: "The Confederation of the Orders"
mcf_constitutional_confederation_desc: "The six orders sign a charter that makes them a confederation under one council with one treasury and six commanders."
mcf_constitutional_confederation_tt: "The realm becomes the Confederation of the Military Orders. The Assembly of the Langues takes the place of The Orders Recalled."
mcf_constitutional_confederation_avail_tt: "Order Cohesion must be at the United band, four orders must hold a seat and no demand or incident may be open."
mcf_restore_civilian_courts: "Restore the Civilian Courts"
mcf_restore_civilian_courts_desc: "Maltese judges return to the bench. Disputes between the Order and the island are heard in the Auberge of Castile with a jury of citizens."
mcf_restore_civilian_courts_tt: "Sacred Legitimacy rises and stability rises. Order Cohesion falls. The civil settlement is chosen."
mcf_protect_maltese_labour: "Protect Maltese Labour"
mcf_protect_maltese_labour_desc: "The dockers, masons and bakers of the Three Cities are given their own guilds, wage tables and a seat at the harbour board."
mcf_protect_maltese_labour_tt: "Malta gains a civilian factory and a building slot, and stability rises."
mcf_define_military_jurisdiction: "Define Military Jurisdiction"
mcf_define_military_jurisdiction_desc: "A statute says where the Order may command and where it must ask. The orders read it with attention and the courts read it with relief."
mcf_define_military_jurisdiction_tt: "Every order's grievance falls, Sacred Legitimacy rises and Order Cohesion falls."
mcf_elected_mixed_council: "An Elected and Mixed Council"
mcf_elected_mixed_council_desc: "The council takes four citizens elected from the Maltese parishes and four brothers appointed by the orders, with the Grand Master as its chair."
mcf_elected_mixed_council_tt: "The democratic movement gains ground and Sacred Legitimacy rises."
mcf_church_and_civil_authority: "Church and Civil Authority"
mcf_church_and_civil_authority_desc: "The Archbishop of Malta and the Grand Master sign a concordat that divides the courts, the schools and the hospitals between them."
mcf_church_and_civil_authority_tt: "Sacred Legitimacy rises greatly and relations with the Pope open."
mcf_constitutional_crusader_kingdom: "The Crusader Kingdom of Malta"
mcf_constitutional_crusader_kingdom_desc: "The Grand Master is crowned in St John's Co-Cathedral under a constitution. The crusade has a king, a parliament and a bench of judges."
mcf_constitutional_crusader_kingdom_tt: "The realm becomes the Crusader Kingdom of Malta. The Civil Constitution takes the place of The Orders Recalled."
mcf_constitutional_crusader_kingdom_avail_tt: "Sacred Legitimacy must be Recognized or better and no demand or incident may be open."
mcf_fortify_the_holy_land: "Fortify the Holy Land"
mcf_fortify_the_holy_land_desc: "The garrisons dig in around the shrines and the main roads. Every tower between the coast and the Jordan is given a crew and a store of water."
mcf_fortify_the_holy_land_tt: "A guard division appears in the Holy Land and roads improve there. The Holy Land defends better for six months. The Holy Land lane opens."
mcf_secure_jerusalem: "Secure Jerusalem"
mcf_secure_jerusalem_desc: "Jerusalem is held by a garrison of the Orders and a council of local notables. The Order stops treating the city as a conquest and starts treating it as a charge."
mcf_secure_jerusalem_tt: "Palestine becomes a core of the Order and Sacred Legitimacy rises greatly."
mcf_secure_jerusalem_avail_tt: "Jerusalem must have been held for four months."
mcf_the_jordan_corridor: "The Jordan Corridor"
mcf_the_jordan_corridor_desc: "Gangs of sappers rebuild the road and rail line between the coast and Aqaba, and the supply columns no longer cross the hills in single file."
mcf_the_jordan_corridor_tt: "Jordan gains infrastructure and a building slot, and the Holy Land states hold more firmly."
mcf_the_jordan_corridor_avail_tt: "Both Holy Land states must be held."
mcf_the_levantine_frontier: "The Levantine Frontier"
mcf_the_levantine_frontier_desc: "The Order lays claim to the coastal towns of Lebanon and Syria. Its envoys cite old charters and its engineers survey the roads."
mcf_the_levantine_frontier_tt: "The Levantine states become regional crusade targets and Maltese claims are placed on them."
mcf_islands_of_the_cross: "Islands of the Cross"
mcf_islands_of_the_cross_desc: "The harbours of Cyprus and the Aegean are named in the council as the stepping stones that make the Holy Land a sea power's possession."
mcf_islands_of_the_cross_tt: "The Greek mainland becomes a regional crusade target and Maltese claims are placed on its coast. The islands gain a building slot."
mcf_gates_of_anatolia: "Gates of Anatolia"
mcf_gates_of_anatolia_desc: "The mountain passes of Cilicia are surveyed, the old Armenian fortresses are charted, and the Order names its ambition in Anatolia."
mcf_gates_of_anatolia_tt: "The Anatolian march becomes a regional crusade target and Maltese claims are placed on it."
mcf_fortresses_of_the_southern_sea: "Fortresses of the Southern Sea"
mcf_fortresses_of_the_southern_sea_desc: "Coastal forts on the Libyan shore are chosen as the western end of the sea road, and the council sends a first survey party."
mcf_fortresses_of_the_southern_sea_tt: "The Libyan coast becomes a regional crusade target and Maltese claims are placed on it."
mcf_a_network_of_commanderies: "A Network of Commanderies"
mcf_a_network_of_commanderies_desc: "Each conquered district is run by a commander of the Order with a small garrison, a tax office and an infirmary. The map fills with the Order's small keeps."
mcf_a_network_of_commanderies_tt: "Settlement of held states costs less, and held expedition states gain compliance."
mcf_a_league_of_principalities: "A League of Principalities"
mcf_a_league_of_principalities_desc: "Instead of ruling every district, the Order recognises local princes who owe it service. The map fills with states that carry the cross on their flags."
mcf_a_league_of_principalities_tt: "The charters of the crusader principalities open."
mcf_restore_the_local_thrones: "Restore the Local Thrones"
mcf_restore_the_local_thrones_desc: "Armenians, Greeks and Syriac Christians are invited to restore their own governments under the Order's protection."
mcf_restore_the_local_thrones_tt: "Returning a state under treaty brings Sacred Legitimacy and no loss of standing."
mcf_appeal_to_catholic_governments: "Appeal to Catholic Governments"
mcf_appeal_to_catholic_governments_desc: "Envoys carry the Grand Master's letter to the ministries of Rome, Lisbon, Madrid, Warsaw and Dublin, and priests read it from the pulpit."
mcf_appeal_to_catholic_governments_tt: "Volunteers arrive and Sacred Legitimacy rises. The campaign has used foreign help. The diplomacy lane opens."
mcf_the_papal_legation: "The Papal Legation"
mcf_the_papal_legation_desc: "A legate of the Pope takes rooms in the Grand Master's palace. The crusade now has a representative at the Holy See and the Holy See has an informant in the crusade."
mcf_the_papal_legation_tt: "Relations with the Pope open and Sacred Legitimacy rises greatly."
mcf_protect_the_pilgrims: "Protect the Pilgrims"
mcf_protect_the_pilgrims_desc: "Escorts, hostels and water stations are set along the pilgrim routes from the coast to the shrines."
mcf_protect_the_pilgrims_tt: "Pilgrim routes ease resistance for a year and Sacred Legitimacy rises."
mcf_concord_with_local_churches: "Concord with Local Churches"
mcf_concord_with_local_churches_desc: "Orthodox, Armenian and Syriac bishops are given written guarantees that their parishes will keep their rites."
mcf_concord_with_local_churches_tt: "Held expedition states gain compliance and Sacred Legitimacy rises."
mcf_foreign_military_chapters: "Foreign Military Chapters"
mcf_foreign_military_chapters_desc: "Catholic countries host chapters of the Orders. Officers, recruits and money cross to Valletta from half a dozen capitals."
mcf_foreign_military_chapters_tt: "Manpower and army experience arrive. The campaign has used foreign help."
mcf_the_chancery_of_the_order: "The Chancery of the Order"
mcf_the_chancery_of_the_order_desc: "The Grand Master's secretaries draft ultimatums on a standard form, with titles, charters and deadlines already cited."
mcf_the_chancery_of_the_order_tt: "Ultimatums cost less."
mcf_response_to_condemnation: "Answer the Condemnation"
mcf_response_to_condemnation_desc: "When the foreign press prints stories from the occupied districts, the council opens its prisons and its hospitals to inspectors."
mcf_response_to_condemnation_tt: "Sacred Legitimacy rises greatly and relations with the Church improve."
mcf_the_western_question: "The Western Question"
mcf_the_western_question_desc: "The council asks who guards the Pope while the Order guards his shrines. Rome becomes a name in the crusade's war plans."
mcf_the_western_question_tt: "Rome becomes a regional crusade target and a Maltese claim is placed on it."
mcf_the_western_question_avail_tt: "The command must be Recognized and relations with the Pope must be open."
mcf_return_the_keys_to_rome: "Return the Keys to Rome"
mcf_return_the_keys_to_rome_desc: "The Pope is seated in the Lateran under the protection of the Order, and the crusade becomes the army of the Holy See."
mcf_return_the_keys_to_rome_tt: "The realm becomes the Holy See. The Pope is the supreme ruler, Rome the political capital and Jerusalem the sacred and military centre. Papal administration takes the place of the old orders spirit."
mcf_return_the_keys_to_rome_avail_tt: "Rome must be held, Sacred Legitimacy must be a Sacred Mandate, the command must be Recognized and the realm must not have become a secular kingdom."
mcf_the_lateran_and_the_roman_administration: "The Lateran and the Roman Administration"
mcf_the_lateran_and_the_roman_administration_desc: "Roman clerks, Swiss guards and Maltese quartermasters share the offices of the Lateran and learn each other's filing."
mcf_the_lateran_and_the_roman_administration_tt: "Rome gains a building slot and a civilian factory, and Sacred Legitimacy rises."
mcf_jerusalem_the_sacred_centre: "Jerusalem the Sacred Centre"
mcf_jerusalem_the_sacred_centre_desc: "Jerusalem stays the military heart of the crusade. Its governor is chosen by the Pope and its garrison answers to the Grand Master."
mcf_jerusalem_the_sacred_centre_tt: "Jerusalem gains a building slot and Palestine becomes a core."
mcf_papal_supremacy_over_the_council: "Papal Supremacy over the Council"
mcf_papal_supremacy_over_the_council_desc: "The Crusade Council becomes an advisory chamber of the Pope. Marshals take their oath of service in St Peter's."
mcf_papal_supremacy_over_the_council_tt: "Order Cohesion is read as obedience to the Pope. Every order's grievance falls and Sacred Legitimacy rises greatly."
mcf_the_crown_beneath_the_tiara: "The Crown Beneath the Tiara"
mcf_the_crown_beneath_the_tiara_desc: "The Pope receives a crown from the Grand Master and the Grand Master receives his authority from the Pope. Church and Crown become a single body."
mcf_the_crown_beneath_the_tiara_tt: "The realm becomes the Kingdom of God. The Kingdom of God takes the place of the Papal Administration."
mcf_the_crown_beneath_the_tiara_avail_tt: "The realm must be the Holy See, the command must be Supreme, Sacred Legitimacy must be a Universal Claim and the realm must hold twenty states."
mcf_renew_the_latin_east: "Renew the Latin East"
mcf_renew_the_latin_east_desc: "The council reads the old charters of Jerusalem, Antioch, Tripoli and Cyprus and asks which of them could be given again to a prince who will hold the land and the ports."
mcf_renew_the_latin_east_tt: "Sacred Legitimacy rises and the charters of the principalities open."
mcf_renew_the_latin_east_avail_tt: "The command must be Recognized and the government of the realm must be settled."
mcf_charter_the_kingdom_of_jerusalem: "Charter the Kingdom of Jerusalem"
mcf_charter_the_kingdom_of_jerusalem_desc: "The Grand Master drafts a charter for a crown of Jerusalem under his protection. The most prestigious principality is also the most exposed."
mcf_charter_the_kingdom_of_jerusalem_tt: "The Kingdom of Jerusalem can be chartered as a decision."
mcf_charter_the_principality_of_antioch: "Charter the Principality of Antioch"
mcf_charter_the_principality_of_antioch_desc: "A frontier principality of fortresses, mountain roads and mixed churches is drafted for the northern Levant."
mcf_charter_the_principality_of_antioch_tt: "The Principality of Antioch can be chartered as a decision."
mcf_charter_crusader_cyprus: "Charter Crusader Cyprus"
mcf_charter_crusader_cyprus_desc: "Cyprus is offered a government of its own, with its own court, its own harbour board and its own seat among the sea princes."
mcf_charter_crusader_cyprus_tt: "Crusader Cyprus can be chartered as a decision."
mcf_charter_the_marches: "Charter the Marches"
mcf_charter_the_marches_desc: "Four small marches, Tripoli, the Aegean, Anatolia and the African coast, are drafted as a lighter kind of charter with a regency council and a short list of duties."
mcf_charter_the_marches_tt: "The County of Tripoli, the Aegean Crusader State, the Anatolian Order State and the North African March can be chartered as decisions."
mcf_define_obligations: "Define the Obligations"
mcf_define_obligations_desc: "Each charter lists the soldiers, grain, ships and pilgrim roads that the principality owes. Clerks of the council keep the tally."
mcf_define_obligations_tt: "Levies and relief to the principalities can be requested and the principalities keep their promises more reliably."
mcf_succession_laws: "Succession Laws"
mcf_succession_laws_desc: "The charters lay down who may succeed a prince and who must confirm him. A dead prince now has a procedure waiting."
mcf_succession_laws_tt: "Succession crises in the principalities are rarer and their candidates are easier to arbitrate."
mcf_principality_contributions: "Principality Contributions"
mcf_principality_contributions_desc: "The principalities send their obligations as shiploads of rifles, boots and grain instead of promises."
mcf_principality_contributions_tt: "Levies requested from the principalities yield half again as much."
mcf_high_court_of_the_principalities: "High Court of the Principalities"
mcf_high_court_of_the_principalities_desc: "The princes sit once a year in a court that hears disputes among them and between them and the crown."
mcf_high_court_of_the_principalities_tt: "The principalities can be joined into a federation and Sacred Legitimacy rises greatly."
mcf_gather_the_survivors: "Gather the Survivors"
mcf_gather_the_survivors_desc: "The ships that came home are counted, the cadres are listed by order, and the council meets in the cellar of the Auberge of Castile."
mcf_gather_the_survivors_tt: "Order Cohesion and command power rise."
mcf_hold_the_island: "Hold the Island"
mcf_hold_the_island_desc: "Every bastion and storehouse in Malta is manned, and the old catacombs are opened for stores and hospitals."
mcf_hold_the_island_tt: "Malta gains a building slot and a road level. The island garrison defends better for a year."
mcf_appeal_to_the_catholic_world: "Appeal to the Catholic World"
mcf_appeal_to_the_catholic_world_desc: "Bishops are asked to preach the Eleventh Crusade in every diocese, and the pilgrim ships are asked to carry recruits instead of passengers."
mcf_appeal_to_the_catholic_world_tt: "Manpower and Sacred Legitimacy rise. The campaign has used foreign help."
mcf_raise_emergency_banners: "Raise Emergency Banners"
mcf_raise_emergency_banners_desc: "Dockers, farmers and half-trained cadets are taken into new banners, and the old knights drill them in the Floriana parade ground."
mcf_raise_emergency_banners_tt: "An armored knight banner and two guard divisions appear in Malta."
mcf_rebuild_the_works: "Rebuild the Works"
mcf_rebuild_the_works_desc: "Slips, forges and ropewalks are repaired with money from the donors, and the first new landing craft are laid down."
mcf_rebuild_the_works_tt: "Malta gains a dockyard and a military factory."
mcf_mark_the_landing: "Mark the Landing"
mcf_mark_the_landing_desc: "The staff draws a beach, a road inland and a first town on the chart, and the officers are told which they will hold."
mcf_mark_the_landing_tt: "Army experience rises and the Levantine and Greek coasts open to the regional crusade."
mcf_the_eleventh_vow: "The Eleventh Vow"
mcf_the_eleventh_vow_desc: "The knights swear at the high altar not to return from the Holy Land a second time. The landing force is sent with the vow."
mcf_the_eleventh_vow_tt: "The landing force of the Eleventh Crusade is stronger by one division and war support rises."
