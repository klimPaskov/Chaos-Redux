chaosx.fallout.768.t: "The Captain's Articles"
chaosx.fallout.768.opening.d: "At a repaired dock in the West African Port Confederacies, rescue captains, fishers, merchants, and families crowd around a salt-stained ledger. Boats are arriving from burned river mouths with no shared rule for rescue duty, salvaged cargo, or berths. The port council must decide what the fleet owes the living."
chaosx.fallout.768.a: "Write the rescue articles"
chaosx.fallout.768.a.tt: "Spend Food 3, Medicine 1, and Recognition 3 to publish a rescue charter that gives captains and families a voice at the dock."
chaosx.fallout.768.b: "Seat a prize court"
chaosx.fallout.768.b.tt: "Spend Scrap 2, Power 3, and Recognition 3 to judge salvaged cargo in public and stop private seizure from becoming port law."
chaosx.fallout.768.c: "Call a harbor muster"
chaosx.fallout.768.c.tt: "Spend Fuel 4 and Recognition 2, then accept a Cohesion cost, to put armed patrols under an accountable harbor council."
chaosx.fallout.768.d: "Split the fleet by vote"
chaosx.fallout.768.d.tt: "Spend Food 2, Medicine 3, Fuel 2, and Recognition 2 to let ship crews form a separate rescue flotilla before command turns coercive."
chaosx.fallout.769.t: "The Captain's Articles"
chaosx.fallout.770.t: "A Port Chooses Its Law"
chaosx.fallout.770.rescue_articles.success.d: "The captains signed a rescue charter beside the loading crane. A family berth now counts as a duty, a fuel allotment has a public witness, and the port can name who answers when a boat fails to return."
chaosx.fallout.770.rescue_articles.partial.d: "The charter reached the dock crews and two river pilots. The council gained a working rescue roster, but the outer anchorage still treats berth access as a captain's favor."
chaosx.fallout.770.rescue_articles.failure.d: "The articles broke over who could speak for the refugee boats. The council kept the ledger, yet every captain left with a different promise about fuel and landing space."
chaosx.fallout.770.prize_court.success.d: "The prize court weighed each salvaged crate in public and returned a medicine case to the crew that found it. The first verdict makes cargo a trust held for the port rather than a private victory."
chaosx.fallout.770.prize_court.partial.d: "The judges agreed on medicine, seed, and navigation tools. They could not settle fuel or engine parts, so merchants still hide the most valuable crates before the next hearing."
chaosx.fallout.770.prize_court.failure.d: "The court became a fight between dock owners and hungry crews. The port sealed the prize shed, and every wreck on the coast now looks like an invitation to steal."
chaosx.fallout.770.harbor_muster.success.d: "The harbor muster put patrol boats under a rotating council and recorded the names of every watch officer. A loaded skiff can now ask for escort without surrendering its cargo."
chaosx.fallout.770.harbor_muster.partial.d: "The patrols accepted a public roster but kept their own fuel keys. The port has a visible guard and a weak answer to the question of who can order a night landing."
chaosx.fallout.770.harbor_muster.failure.d: "The muster ended when officers demanded a private chain of command. The council kept the quay open, while armed crews began to treat rescue calls as orders to themselves."
chaosx.fallout.770.fleet_split.success.d: "The crews voted to form a separate rescue flotilla and left the port with a shared ration ledger. The split costs command unity, yet families know which boats will answer an emergency call."
chaosx.fallout.770.fleet_split.partial.d: "The flotilla vote kept the crews from fighting at the dock. It also moved two fuel stores beyond the council's reach, leaving the port safer in one channel and weaker in the next."
chaosx.fallout.770.fleet_split.failure.d: "The fleet divided without a berth agreement. Three crews departed with medicine and no return route, while the council recorded the fracture as a warning against private rescue law."
chaosx.fallout.770.a: "Record the port's decision"
chaosx.fallout.770.a.tt: "Apply the graded harbor result, preserve the chosen maritime memory, and schedule the delayed fleet review."
chaosx.fallout.772.t: "The Fleet Remembers"
chaosx.fallout.772.success.d: "The delayed review finds a port that can keep names, fuel, and rescue duty in one ledger. Captains accept the articles, families receive predictable berths, and the West African Port Confederacies have a law that can travel with a boat."
chaosx.fallout.772.partial.d: "The delayed review keeps the harbor open, but the prize shed and patrol roster still depend on two people who do not trust one another. The articles exist, though they are not yet a habit."
chaosx.fallout.772.failure.d: "The delayed review finds a fleet exhausted by private promises. The council must choose whether to reopen the articles or let each captain carry a separate law into the next storm."
chaosx.fallout.772.a: "Close the fleet record"
chaosx.fallout.772.a.tt: "Apply the delayed maritime outcome, record the final memory, and release the reserved harbor state and partner rows."
fallout.event_log.captains_articles.name: "The Captain's Articles"
fallout.event_log.captains_articles.detail: "[GetFalloutEvent768EventLogDetail]"
fallout.event_log.captains_articles.detail.choice_rescue_articles: "The port council published rescue articles that gave captains and families a witnessed duty at the dock."
fallout.event_log.captains_articles.detail.choice_prize_court: "The port council opened a public prize court for salvaged cargo and disputed wreck claims."
fallout.event_log.captains_articles.detail.choice_harbor_muster: "The harbor council placed patrol boats under a rotating public muster."
fallout.event_log.captains_articles.detail.choice_fleet_split: "The crews voted to form a separate rescue flotilla and divided the fleet ledger."
fallout.event_log.captains_articles.detail.rescue_articles_success: "The rescue charter made berth, fuel, and return duty visible at the West African dock."
fallout.event_log.captains_articles.detail.rescue_articles_partial: "The rescue charter reached the dock crews while outer anchorage practice remained unsettled."
fallout.event_log.captains_articles.detail.rescue_articles_failure: "The rescue articles failed to settle who could speak for displaced crews and families."
fallout.event_log.captains_articles.detail.prize_court_success: "The prize court returned a medicine case and made salvaged cargo a public trust."
fallout.event_log.captains_articles.detail.prize_court_partial: "The prize court settled medicine and seed while fuel and engines remained disputed."
fallout.event_log.captains_articles.detail.prize_court_failure: "The prize court collapsed into a fight between dock owners and hungry crews."
fallout.event_log.captains_articles.detail.harbor_muster_success: "The harbor muster put patrol boats under a named rotating council."
fallout.event_log.captains_articles.detail.harbor_muster_partial: "The harbor muster published a guard roster while fuel keys stayed private."
fallout.event_log.captains_articles.detail.harbor_muster_failure: "The harbor muster left officers and the council claiming separate command."
fallout.event_log.captains_articles.detail.fleet_split_success: "The crews formed a rescue flotilla with a shared ration ledger and a named emergency duty."
fallout.event_log.captains_articles.detail.fleet_split_partial: "The flotilla vote prevented a dock fight but moved fuel beyond the council's reach."
fallout.event_log.captains_articles.detail.fleet_split_failure: "The fleet divided without a berth agreement and left crews without a return route."
fallout.event_log.captains_articles.detail.callback_success: "The delayed review kept names, fuel, and rescue duty in one harbor ledger."
fallout.event_log.captains_articles.detail.callback_partial: "The delayed review kept the articles alive while the prize shed and patrol roster lagged."
fallout.event_log.captains_articles.detail.callback_failure: "The delayed review found exhausted crews and separate promises at the dock."
fallout.event_log.captains_articles.detail.cancelled: "The port record was cancelled after its state, partner, owner, controller, or generation changed."

