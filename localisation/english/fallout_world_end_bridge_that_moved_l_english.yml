l_english:
 chaosx.fallout.464.t: "The Bridge That Moved"
 chaosx.fallout.464.d: "The thaw shifted the rail bridge outside [This.GetName]. Its deck still stands, but the approaches have sunk into ash-slick mud and the supply timetable no longer matches the river. Your government must decide whether to close the crossing, lay a temporary trestle, send military engineers, or publish a shared bridge rule with the settlements on both banks."
 chaosx.fallout.464.a: "Close the crossing and reroute"
 chaosx.fallout.464.a.tt: "Spend food, medicine, and recognition to mark a safe detour and keep civilians away from the damaged span."
 chaosx.fallout.464.b: "Lay a temporary trestle"
 chaosx.fallout.464.b.tt: "Spend stores and labour to keep a narrow civilian route open while the riverbank settles."
 chaosx.fallout.464.c: "Send military pontoons"
 chaosx.fallout.464.c.tt: "Spend medicine and recognition to put engineers on the crossing and accept military control of the first repairs."
chaosx.fallout.464.e: "Publish a shared bridge rule"
 chaosx.fallout.464.d.tt: "Spend a small reserve to let both banks set a public crossing order before private guards claim the route."
 chaosx.fallout.466.t: "The Crossing Ledger"
 chaosx.fallout.466.close_crossing.success.d: "The detour markers held through the first rain. Carts reached the clinics by the long road, the damaged span stayed empty, and the council gained a route map that every district could read."
 chaosx.fallout.466.close_crossing.partial.d: "The detour carried part of the traffic, but a missing marker sent two ration carts toward the broken approach. The route is usable, although the bridge crews have lost a week of trust."
 chaosx.fallout.466.close_crossing.failure.d: "The closure notice reached the river after a night convoy entered the mud. The span shifted again, the supply road is cut, and families now blame the government for hiding the warning."
 chaosx.fallout.466.temporary_trestle.success.d: "The trestle crews anchored a narrow foot route and kept the rail embankment from sliding further. The government has traded timber and fuel for a crossing that civilians can actually reach."
 chaosx.fallout.466.temporary_trestle.partial.d: "The trestle holds under light carts, but the riverbank keeps moving. Engineers have a route for medicine while grain wagons wait on the far bank and argue over priority."
 chaosx.fallout.466.temporary_trestle.failure.d: "The temporary span went down before the first convoy crossed. The carts bogged down, the crews lost their tools, and the two banks no longer trust the same timetable."
 chaosx.fallout.466.military_pontoon.success.d: "Military engineers secured a pontoon lane and repaired the worst approach. The army can move a guarded convoy, while the rail crews record which loads must wait for a permanent bridge."
 chaosx.fallout.466.military_pontoon.partial.d: "The pontoons carried medicine and engineers before a cable failed. The crossing works under guard, yet civilian traffic still depends on a rationed window."
 chaosx.fallout.466.military_pontoon.failure.d: "The engineers spent their cable on a false anchor. The next surge broke the approach, a rail section is damaged, and the supply command has no honest arrival time."
 chaosx.fallout.466.shared_bridge.success.d: "Both banks signed the same crossing order and posted it at the station ruins. The bridge is still unsafe, but traders, clinics, and patrols now know when they may use the route."
 chaosx.fallout.466.shared_bridge.partial.d: "The public order covers the day shift, while private guards claim the night. A few wagons crossed safely, but each bank keeps a different copy of the agreement."
 chaosx.fallout.466.shared_bridge.failure.d: "No one accepted the shared rule. A toll crew seized the crossing, the rail timetable vanished, and the bridge dispute has become a border grievance."
 chaosx.fallout.466.a: "Close the crossing report"
 chaosx.fallout.466.a.tt: "Resolve the bridge decision and schedule a later review of route reliability, engineering capacity, and bilateral trust."
 chaosx.fallout.468.t: "The Route Review"
 chaosx.fallout.468.success.d: "The review finds a marked detour, a repaired approach, and one crossing order that both banks recognise. [This.GetName] can move supplies without guessing which route the thaw will take next."
 chaosx.fallout.468.partial.d: "One route remains passable and the bridge crews still answer calls, but the two banks remember different promises. The next repair will test whether the shared order is stronger than the toll gangs."
 chaosx.fallout.468.failure.d: "The review found broken markers, a damaged rail section, and a grievance at every ferry point. The bridge memory now turns each supply delay into a government question."
 chaosx.fallout.468.a: "Archive the route agreement"
 chaosx.fallout.468.a.tt: "Record the delayed result, keep the infrastructure and supply effects, and release every scheduler receipt."
 fallout.event_log.bridge_that_moved.name: "The Bridge That Moved"
 fallout.event_log.bridge_that_moved.detail: "[This.GetName] decided who could use a damaged crossing after the Air Winter thaw."
 fallout.event_log.bridge_that_moved.close_crossing_success: "A marked detour kept traffic away from the damaged span."
 fallout.event_log.bridge_that_moved.close_crossing_partial: "The detour worked until a missing marker sent carts toward the mud."
 fallout.event_log.bridge_that_moved.close_crossing_failure: "A late closure sent a convoy into the shifting approach."
 fallout.event_log.bridge_that_moved.temporary_trestle_success: "A narrow trestle kept civilian traffic moving."
 fallout.event_log.bridge_that_moved.temporary_trestle_partial: "The trestle held light carts while grain waited."
 fallout.event_log.bridge_that_moved.temporary_trestle_failure: "The temporary span failed before the first convoy."
 fallout.event_log.bridge_that_moved.military_pontoon_success: "Military engineers secured a guarded crossing."
 fallout.event_log.bridge_that_moved.military_pontoon_partial: "A cable failure left the crossing open only by rationed window."
 fallout.event_log.bridge_that_moved.military_pontoon_failure: "A false anchor broke the approach and the rail timetable."
 fallout.event_log.bridge_that_moved.shared_bridge_success: "Both banks accepted one public crossing order."
 fallout.event_log.bridge_that_moved.shared_bridge_partial: "The shared order held by day while guards claimed the night."
 fallout.event_log.bridge_that_moved.shared_bridge_failure: "A toll crew seized the crossing and made the dispute political."
 fallout.event_log.bridge_that_moved.callback_success: "The review found a marked route and a recognised crossing order."
 fallout.event_log.bridge_that_moved.callback_partial: "One route survived, but both banks kept different promises."
 fallout.event_log.bridge_that_moved.callback_failure: "Broken markers made every supply delay a grievance."
