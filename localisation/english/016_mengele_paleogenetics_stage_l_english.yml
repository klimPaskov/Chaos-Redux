l_english:
mengele_event016_paleogenetics_theory: "Establish the Paleogenetics Theory"
mengele_event016_paleogenetics_theory_desc: "Use biomedical and cloning methods to reconstruct extinct terrestrial creatures from verified material."
mengele_event016_paleogenetics_prototype: "Reconstruct a Paleogenetic Prototype"
mengele_event016_paleogenetics_prototype_desc: "Raise a viable restored creature under the Directorate's care."
mengele_event016_paleogenetics_deployment: "Deploy the Restored Creatures"
mengele_event016_paleogenetics_deployment_desc: "Establish reserves, hatcheries, feed supplies, and trained handlers for sustained operations."
mengele_event016_paleogenetics_weaponization: "Weaponize the Restored Creatures"
mengele_event016_paleogenetics_weaponization_desc: "Prepare restored-creature formations and their handlers for battlefield service."

mengele_event016_paleogenetics_theory_cost: "£pol_power §Y[This.GetMengeleStageValueStagePaleogeneticsTheoryPoliticalPower]§!  £support_equipment_text_icon §Y[This.GetMengeleStageValueStagePaleogeneticsTheorySupportEquipment]§!"
mengele_event016_paleogenetics_prototype_cost: "£pol_power §Y[This.GetMengeleStageValueFallbackPaleogeneticsPoliticalPower]§!  £support_equipment_text_icon §Y[This.GetMengeleStageValueFallbackPaleogeneticsSupportEquipment]§!  £GFX_fuel_texticon §Y[This.GetMengeleStageValueFallbackPaleogeneticsFuel]§!"
mengele_event016_paleogenetics_deployment_cost: "£pol_power §Y[This.GetMengeleStageValueStagePaleogeneticsDeploymentPoliticalPower]§!  £support_equipment_text_icon §Y[This.GetMengeleStageValueStagePaleogeneticsDeploymentSupportEquipment]§!  £GFX_fuel_texticon §Y[This.GetMengeleStageValueStagePaleogeneticsDeploymentFuel]§!"
mengele_event016_paleogenetics_weaponization_cost: "£pol_power §Y[This.GetMengeleStageValueStagePaleogeneticsWeaponizationPoliticalPower]§!  £support_equipment_text_icon §Y[This.GetMengeleStageValueStagePaleogeneticsWeaponizationSupportEquipment]§!  £GFX_fuel_texticon §Y[This.GetMengeleStageValueStagePaleogeneticsWeaponizationFuel]§!"

mengele_event016_paleogenetics_theory_requirements_tt: "The Directorate's research programme is active and Paleogenetics Theory remains unfinished."
mengele_event016_paleogenetics_prototype_requirements_tt: "Paleogenetics Theory is complete. The Directorate can support a living prototype."
mengele_event016_paleogenetics_deployment_requirements_tt: "The Paleogenetics Prototype has been recorded under Mengele's programme."
mengele_event016_paleogenetics_weaponization_requirements_tt: "The restored creatures have been deployed under Mengele's programme."
mengele_event016_paleogenetics_theory_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStagePaleogeneticsTheoryCivilianFactories]§! until the stage ends. Political Power and Support Equipment are paid when the stage begins."
mengele_event016_paleogenetics_prototype_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueFallbackPaleogeneticsCivilianFactories]§! until the stage ends. Political Power, Support Equipment, and Fuel are paid when the stage begins."
mengele_event016_paleogenetics_deployment_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStagePaleogeneticsDeploymentCivilianFactories]§! until the stage ends. Political Power, Support Equipment, and Fuel are paid when the stage begins."
mengele_event016_paleogenetics_weaponization_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStagePaleogeneticsWeaponizationCivilianFactories]§! until the stage ends. Political Power, Support Equipment, and Fuel are paid when the stage begins."

mengele_event016_paleogenetics_stage_started_tt: "The listed stores are committed. Civilian factories remain assigned until this work ends."
mengele_event016_paleogenetics_stage_cancel_trigger_tt: "The programme has lost authority over this work."
mengele_event016_paleogenetics_stage_cancelled_tt: "The work is cancelled. Committed stores return and civilian factories are released."
mengele_event016_paleogenetics_theory_effect_tt: "Paleogenetics Theory is established."
mengele_event016_paleogenetics_prototype_effect_tt: "The Paleogenetics Prototype is complete. Restored-creature operations are available."
mengele_event016_paleogenetics_deployment_effect_tt: "Restored creatures are deployed for sustained operations."
mengele_event016_paleogenetics_weaponization_effect_tt: "Restored-creature formations are ready for battlefield service."

