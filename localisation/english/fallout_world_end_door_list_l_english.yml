l_english:
 chaosx.fallout.230.t: "The Door List"
 chaosx.fallout.230.d: "A convoy from [?fallout_event_230_source_state_id.GetName] has reached the doors of [?fallout_event_230_destination_state_id.GetName]. The source shelter is carrying a heavier Air Winter exposure, while the receiving rooms still have a measured reserve. [ROOT.GetAirWinterGovernmentAuthority] must decide who enters, how the ledger will be read, and what the destination can carry through the next twelve days."
 chaosx.fallout.230.a: "Admit families first"
 chaosx.fallout.230.a.tt: "Spend §Y[?constant:fallout_event_230_cost.family_food|0]§! Food and §Y[?constant:fallout_event_230_cost.family_filters|0]§! Filters. The receiving rooms will be reviewed after §Y[?constant:fallout_event_230_timing.result_delay_days|0] days§!."
 chaosx.fallout.230.b: "Admit the specialists"
 chaosx.fallout.230.b.tt: "Spend §Y[?constant:fallout_event_230_cost.specialist_medicine|0]§! Medicine and §Y[?constant:fallout_event_230_cost.specialist_shelter|0]§! Shelter Capacity. The service class will be reviewed after §Y[?constant:fallout_event_230_timing.result_delay_days|0] days§!."
 chaosx.fallout.230.c: "Open a public lottery"
 chaosx.fallout.230.c.tt: "Spend §Y[?constant:fallout_event_230_cost.lottery_recognition|0]§! Recognition and §Y[?constant:fallout_event_230_cost.lottery_filters|0]§! Filters. The civic roll will be reviewed after §Y[?constant:fallout_event_230_timing.result_delay_days|0] days§!."
chaosx.fallout.230.e: "Refuse the convoy"
 chaosx.fallout.230.d.tt: "Spend §Y[?constant:fallout_event_230_cost.refusal_scrap|0]§! Scrap to close the doors and record the refusal. The shelter will be reviewed after §Y[?constant:fallout_event_230_timing.result_delay_days|0] days§!."

 chaosx.fallout.232.t: "Families at the Door"
 chaosx.fallout.232.success.d: "The family registry from [?fallout_event_230_source_state_id.GetName] was admitted to [?fallout_event_230_destination_state_id.GetName]. The receiving rooms lost some reserve, but the families arrived as counted households and the shelter can name who is responsible for each bunk."
 chaosx.fallout.232.partial.d: "Most of the family convoy entered [?fallout_event_230_destination_state_id.GetName], although the final rooms filled before every name was checked. The destination kept a narrow reserve and the missing households remain a visible debt in the ledger."
 chaosx.fallout.232.failure.d: "The family convoy reached [?fallout_event_230_destination_state_id.GetName] after the receiving rooms had lost their margin. Medicine and shelter reserves fell during the attempt, and the Deaths register carries the people who did not cross the last door."
 chaosx.fallout.232.a: "Seal the family registry"
 chaosx.fallout.232.a.tt: "Resolve the family admission and schedule a survivor-family audit in §Y[?constant:fallout_event_230_timing.callback_delay_days|0] days§!."

 chaosx.fallout.233.t: "Specialists at the Door"
 chaosx.fallout.233.success.d: "The service class from [?fallout_event_230_source_state_id.GetName] entered [?fallout_event_230_destination_state_id.GetName] with its tools, route maps, and medical case notes. Reclamation gained a working crew, while the receiving shelter accepted a smaller but useful obligation."
 chaosx.fallout.233.partial.d: "A smaller service class made it into [?fallout_event_230_destination_state_id.GetName]. The crews can repair one route and teach one clinic, but their arrival consumed rooms that the shelter had reserved for the coldest month."
 chaosx.fallout.233.failure.d: "The specialist convoy could not establish a safe handover at [?fallout_event_230_destination_state_id.GetName]. Medicine and recognition fell with the failed admission, and the Deaths register records the workers who were left between the two shelters."
 chaosx.fallout.233.a: "Bind the service class to the shelter"
 chaosx.fallout.233.a.tt: "Resolve the specialist admission and schedule a service-class audit in §Y[?constant:fallout_event_230_timing.callback_delay_days|0] days§!."

 chaosx.fallout.234.t: "The Civic Roll at the Door"
 chaosx.fallout.234.success.d: "The public roll moved selected households from [?fallout_event_230_source_state_id.GetName] into [?fallout_event_230_destination_state_id.GetName]. The names were read in the square, recognition rose, and the receiving rooms now know which civic duties accompany every berth."
 chaosx.fallout.234.partial.d: "The public roll filled part of [?fallout_event_230_destination_state_id.GetName] before the filters ran short. The draw remains visible and the first arrivals have a place, but the shelter districts disagree about the names that were left outside."
 chaosx.fallout.234.failure.d: "The public roll broke down at [?fallout_event_230_destination_state_id.GetName]. The receiving rooms lost shelter and recognition, the draw became a quarrel, and the Deaths register holds the cost of the failed list."
 chaosx.fallout.234.a: "Publish the civic roll"
 chaosx.fallout.234.a.tt: "Resolve the lottery admission and schedule a civic-roll audit in §Y[?constant:fallout_event_230_timing.callback_delay_days|0] days§!."

 chaosx.fallout.235.t: "The Refusal at the Door"
 chaosx.fallout.235.success.d: "The doors at [?fallout_event_230_destination_state_id.GetName] stayed closed in an orderly refusal. The convoy returned to [?fallout_event_230_source_state_id.GetName] with its route recorded, while recognition and cohesion fell by a measured amount."
 chaosx.fallout.235.partial.d: "The refusal at [?fallout_event_230_destination_state_id.GetName] held for the first watch, then fractured along the shelter districts. The convoy was turned away, but the exclusion was not accepted as a single rule."
 chaosx.fallout.235.failure.d: "The refusal at [?fallout_event_230_destination_state_id.GetName] became violent before the convoy could withdraw. The doors lost shelter capacity, the exclusion register became a grievance, and the Deaths register records the people caught in the breach."
 chaosx.fallout.235.a: "Record the exclusion register"
 chaosx.fallout.235.a.tt: "Resolve the refusal and schedule a door audit in §Y[?constant:fallout_event_230_timing.callback_delay_days|0] days§!."

 chaosx.fallout.240.t: "The Door List Audit"
 chaosx.fallout.240.success.d: "The delayed audit returned to [?fallout_event_230_destination_state_id.GetName]. The survivor-family registry, service class, civic roll, or exclusion register has become an institution that the shelter can inspect, and the next convoy will meet a rule rather than a rumor."
 chaosx.fallout.240.partial.d: "The delayed audit at [?fallout_event_230_destination_state_id.GetName] found a working record with a contested margin. The doors have a memory now, although the districts still argue over whose names belong on it."
 chaosx.fallout.240.failure.d: "The delayed audit at [?fallout_event_230_destination_state_id.GetName] found a record that could not carry the next winter shift. Recognition and cohesion fell again, and the shelter will remember the admission as a warning rather than a settlement."
 chaosx.fallout.240.a: "Close the door audit"
 chaosx.fallout.240.a.tt: "Resolve the delayed audit, preserve its durable institution memory, and release both cleanup receipts."

 fallout.event_log.door_list.name: "The Door List"
 fallout.event_log.door_list.detail: "[GetFalloutEventDoorListEventLogDetail]"
 fallout.event_log.door_list.detail.family_success: "Families crossed the shelter door and left a counted registry behind."
 fallout.event_log.door_list.detail.family_partial: "Most families crossed the door, but the final rooms could not hold every name."
 fallout.event_log.door_list.detail.family_failure: "The family convoy failed at the door and left losses in the Deaths register."
 fallout.event_log.door_list.detail.specialist_success: "A service class entered with tools and route maps for the receiving shelter."
 fallout.event_log.door_list.detail.specialist_partial: "A smaller service class entered while the receiving rooms lost their margin."
 fallout.event_log.door_list.detail.specialist_failure: "The specialist handover failed between the two shelters."
 fallout.event_log.door_list.detail.lottery_success: "A public civic roll admitted selected households and named their duties."
 fallout.event_log.door_list.detail.lottery_partial: "The civic roll filled part of the shelter before filters ran short."
 fallout.event_log.door_list.detail.lottery_failure: "The civic roll broke down and became a quarrel at the door."
 fallout.event_log.door_list.detail.refusal_success: "The shelter recorded an orderly refusal and turned the convoy back."
 fallout.event_log.door_list.detail.refusal_partial: "The refusal fractured across districts after the first watch."
 fallout.event_log.door_list.detail.refusal_failure: "A violent refusal turned the exclusion register into a grievance."
 fallout.event_log.door_list.detail.callback_success: "The delayed audit made the door policy an inspectable institution."
 fallout.event_log.door_list.detail.callback_partial: "The delayed audit found a working but contested door record."
 fallout.event_log.door_list.detail.callback_failure: "The delayed audit found a door record too weak for the next winter shift."
