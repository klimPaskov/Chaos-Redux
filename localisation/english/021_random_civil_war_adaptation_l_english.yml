l_english:
event021_adapt_campaign: "Adapt the Campaign"
event021_adapt_campaign_desc: "Use battle experience and reserve rifles to reorganize the army for the ground it holds."
event021_adaptation_cost: "£army_experience [?constant:event021_regional_response.adaptation_xp|0]  £infantry_equipment_text_icon [?constant:event021_regional_response.adaptation_rifles|0]"
event021_adaptation_cost_blocked: "$event021_adaptation_cost$"
event021_adaptation_cost_tooltip: "$event021_adaptation_cost_tt$"
event021_adaptation_cost_tt: "Requires [?constant:event021_regional_response.adaptation_xp|0] army experience and [?constant:event021_regional_response.adaptation_rifles|0] reserve rifles."
event021_adapt_campaign_tt: "Commit the rifles and training staff, then choose one campaign plan for [?constant:event021_regional_response.adaptation_days|0] days."
chaosx.nr21_adaptation.1.t: "Orders for the Campaign"
chaosx.nr21_adaptation.1.d: "Officers have drawn on the fighting to train fresh formations. Reserve rifles have gone to the training grounds. The army can concentrate on keeping supplies moving, holding difficult ground or forming mobile columns."
chaosx.nr21_adaptation.1.a: "Keep supplies moving"
chaosx.nr21_adaptation.1.b: "Prepare strong defensive positions"
chaosx.nr21_adaptation.1.c: "Form mobile columns"
event021_adapt_supply_tt: "For [?constant:event021_regional_response.adaptation_days|0] days: supply use [?constant:event021_campaign_modifiers.supply_relief|%0], recovery [?constant:event021_campaign_modifiers.supply_recovery|%0] and attack [?constant:event021_campaign_modifiers.supply_attack_cost|%0]. Troops guard the supply routes."
event021_adapt_defense_tt: "For [?constant:event021_regional_response.adaptation_days|0] days: defense [?constant:event021_campaign_modifiers.defense_strength|%0], entrenchment [?constant:event021_campaign_modifiers.defense_entrenchment|%0] and movement [?constant:event021_campaign_modifiers.defense_speed_cost|%0]."
event021_adapt_columns_tt: "For [?constant:event021_regional_response.adaptation_days|0] days: movement [?constant:event021_campaign_modifiers.column_speed|%0], planning speed [?constant:event021_campaign_modifiers.column_planning|%0] and defense [?constant:event021_campaign_modifiers.column_defense_cost|%0]."
event021_campaign_supply: "Guarded Supply Routes"
event021_campaign_supply_desc: "Trained escorts and repair parties keep the army supplied, drawing troops away from the attack."
event021_campaign_defense: "Prepared Positions"
event021_campaign_defense_desc: "Field works and trained reserves strengthen the defense but slow the army's movement."
event021_campaign_columns: "Mobile Columns"
event021_campaign_columns_desc: "Small columns move quickly and prepare attacks without waiting for a continuous front. They are less suited to holding ground."
event021_mass_mobilization: "Mobilize the Region"
event021_mass_mobilization_desc: "Arm local recruits and concentrate every available formation for a short campaign. Civilian work suffers and armed groups remain after the fighting."
event021_mass_mobilization_cost: "£infantry_equipment_text_icon [?constant:event021_regional_response.mobilization_rifles|0]  £support_equipment_text_icon [?constant:event021_regional_response.mobilization_support|0]"
event021_mass_mobilization_cost_blocked: "$event021_mass_mobilization_cost$"
event021_mass_mobilization_cost_tooltip: "$event021_mass_mobilization_cost_tt$"
event021_mass_mobilization_cost_tt: "Requires [?constant:event021_regional_response.mobilization_rifles|0] rifles and [?constant:event021_regional_response.mobilization_support|0] support equipment. Temporary stability and consumer goods penalties reflect the civilian sacrifice."
event021_mass_mobilization_tt: "For [?constant:event021_regional_response.mobilization_days|0] days: attack [?constant:event021_campaign_modifiers.mobilization_attack|%0], organization [?constant:event021_campaign_modifiers.mobilization_org|%0] and recruitable population [?constant:event021_campaign_modifiers.mobilization_recruits|%0]. Stability [?constant:event021_campaign_modifiers.mobilization_stability_cost|%0] and consumer goods requirements [?constant:event021_campaign_modifiers.mobilization_consumer_cost|%0] reflect the strain on civilian work. Armed groups make renewed civil war more likely after the fighting."
event021_mass_regional_mobilization: "Regional Mobilization"
event021_mass_regional_mobilization_desc: "Local recruits join the campaign with reserve arms. Farms and workshops lose workers, and the formations will need to be disarmed after the war."
event021_expose_intervention: "Expose Foreign Intervention"
event021_expose_intervention_desc: "Publish the arms shipments from [?random_civil_war_foreign_sponsor_scope.GetName] and demand that its support for our opponents ends."
event021_expose_intervention_cost: "£pol_power [?constant:event021_regional_response.expose_political|0]  £support_equipment_text_icon [?constant:event021_regional_response.expose_support|0]"
event021_expose_intervention_cost_blocked: "$event021_expose_intervention_cost$"
event021_expose_intervention_cost_tooltip: "$event021_expose_intervention_cost_tt$"
event021_expose_intervention_cost_tt: "Requires [?constant:event021_regional_response.expose_political|0] political power and [?constant:event021_regional_response.expose_support|0] support equipment for border investigators."
event021_expose_intervention_tt: "End [?random_civil_war_foreign_sponsor_scope.GetName]'s military commitment to the opposition. Its opinion of us falls by [?constant:event021_regional_response.expose_opinion_loss|0] and recovers gradually. Arms already delivered stay with their recipients."
event021_intervention_exposed: "Foreign Intervention Exposed"
event021_exposure_observed: "Observed"
event021_exposure_pressured: "Pressured"
event021_exposure_penetrated: "Penetrated"
event021_exposure_mobilizing: "Mobilizing"
event021_entry_already_active: "A civil-war crisis is already under way in this country. Its present commands must settle their dispute before another rising can begin."
event021_entry_external_pending: "The successor government must decide its claims against foreign enemies before another domestic rising can begin."
event021_entry_capacity_full: "The civil wars already under way occupy every available theatre. Another rising cannot be opened until one of them ends."
event021_entry_wrong_country: "This country has no ordinary civil government for rival political or military authorities to challenge."
event021_entry_no_region: "No viable opposing authority can be formed here. A rising needs a coherent region, a capital and enough troops, while leaving the government able to fight."
event021_entry_no_claimant_room: "Other civil wars must end before another rebel government can be established. This country remains under its present command."
