l_english:
AJX_friedrich_hoffmann: "Walter Simons"
AJX_karl_becker: "Friedrich von Rabenau"
AJX_independence_wave_mine_rail_dispatch_superintendent: "Mine and Rail Dispatch Superintendent"
AJX_independence_wave_mine_rail_dispatch_superintendent_desc: "The superintendent matches coal orders, wagons, pumping schedules, and municipal reserves through one dispatch office, keeping the basin's tightly coupled industries from starving one another."
AJX_independence_wave_cross_border_accounts_comptroller: "Cross-Border Accounts Comptroller"
AJX_independence_wave_cross_border_accounts_comptroller_desc: "A single comptroller reconciles pensions, rolling stock, customs receipts, and industrial property without allowing unresolved accounts to become a renewed sovereignty claim."
AJX_independence_wave_factory_security_inspector: "Factory Security Inspector"
AJX_independence_wave_factory_security_inspector_desc: "The inspector audits company guards, weapons registers, civil warrants, and plant defenses so essential works remain protected without creating a private army beyond municipal law."

independence_wave_trait_mine_rail_dispatch_superintendent: "Unified Basin Dispatch"
independence_wave_trait_mine_rail_dispatch_superintendent_desc: "Coalfield railway works and factory schedules share one operational ledger."
independence_wave_trait_cross_border_accounts_comptroller: "Reconciled Cross-Border Accounts"
independence_wave_trait_cross_border_accounts_comptroller_desc: "Clear accounts reduce domestic burdens and make foreign commerce easier to sustain."
independence_wave_trait_factory_security_inspector: "Civil Inspection of Industrial Guards"
independence_wave_trait_factory_security_inspector_desc: "Registered guards and inspected plant defenses strengthen industry and territorial defense under civilian authority."

AJX_independence_wave_democratic_party: "Municipal Union"
AJX_independence_wave_democratic_party_long: "Saar Municipal and Civic Union"
AJX_independence_wave_communism_party: "Labor Councils"
AJX_independence_wave_communism_party_long: "Saar Mine and Factory Labor Councils"
AJX_independence_wave_neutrality_party: "Neutral Commission Bloc"
AJX_independence_wave_neutrality_party_long: "Saar Municipal Neutral Commission Bloc"
AJX_independence_wave_fascism_party: "National Security League"
AJX_independence_wave_fascism_party_long: "Saar National Security League"
AJX_independence_wave_constitutional_party: "Charter Coalition"
AJX_independence_wave_constitutional_party_long: "Saar Constitutional Charter Coalition"
AJX_independence_wave_labor_party: "Labor Congress"
AJX_independence_wave_labor_party_long: "Saar Congress of Mine, Rail, and Factory Councils"
AJX_independence_wave_patron_party: "Guarantee Board"
AJX_independence_wave_patron_party_long: "Saar Industrial Guarantee Board"
AJX_independence_wave_neutral_commission_party: "Neutral Commission"
AJX_independence_wave_neutral_commission_party_long: "Saar Municipal Neutral Commission"

ajx_exposed_saar_industrial_compact: "Exposed Saar Industrial Compact"
ajx_exposed_saar_industrial_compact_desc: "The Saar has inherited a dense industrial system without the wider treasury, markets, or security apparatus that once kept it moving. Every interrupted train and disputed factory gate tests the state itself."
ajx_balanced_saar_industrial_compact: "Balanced Saar Industrial Compact"
ajx_balanced_saar_industrial_compact_desc: "Municipal offices, labor delegates, industrial managers, and screened security companies keep coal, rail, and public order under one legible compact."
ajx_constitutional_municipal_charter: "Constitutional Municipal Charter"
ajx_constitutional_municipal_charter_desc: "An elected charter binds the municipalities to equal civil guarantees and a common industrial treasury."
ajx_saar_labor_compact: "Saar Labor Compact"
ajx_saar_labor_compact_desc: "Mine, rail, and factory councils coordinate production through a congress answerable to the working districts."
ajx_patron_industrial_mandate: "Patron Industrial Mandate"
ajx_patron_industrial_mandate_desc: "Foreign credit and purchase guarantees keep the industrial basin moving, but the contracts narrow the state's freedom of action."
ajx_municipal_neutral_commission: "Municipal Neutral Commission"
ajx_municipal_neutral_commission_desc: "A civilian commission balances municipalities, labor, and industry while refusing permanent alignment. Industrial security remains subordinate to written civil warrants."

independence_wave_ajx_saar_category: "The Saar Compact"
independence_wave_ajx_saar_category_desc: "Industrial Continuity: §Y[?independence_wave_ajx_industrial_continuity|0]§! / 100\nNeutrality Credibility: §Y[?independence_wave_ajx_neutrality_credibility|0]§! / 100\nCommission–Security Balance: §Y[?independence_wave_internal_power_balance|0]§! / 100\n\nA lower balance favors the Municipal Commission; a higher balance favors the Industrial Security Companies. Both public values must reach §Y60§! to stabilize the compact."

independence_wave_ajx_hold_saar_compact_together: "Hold the Saar Compact Together"
independence_wave_ajx_hold_saar_compact_together_desc: "Raise Industrial Continuity and Neutrality Credibility to at least §Y60§! before interrupted coal traffic, unpaid guards, and disputed borders break the founding compact."
independence_wave_ajx_restore_mine_rail_dispatch: "Restore Mine and Rail Dispatch"
independence_wave_ajx_restore_mine_rail_dispatch_desc: "A joint dispatch office can match pits, wagons, power stations, and municipal stocks before local closures become permanent."
independence_wave_ajx_integrate_factory_security_companies: "Integrate the Factory Security Companies"
independence_wave_ajx_integrate_factory_security_companies_desc: "The industrial guards will register personnel, weapons, and jurisdictions under civil warrants while preserving rapid protection for essential works."
independence_wave_ajx_open_cross_border_trade_desk: "Open the Cross-Border Trade Desk"
independence_wave_ajx_open_cross_border_trade_desk_desc: "A permanent customs and contracts office will keep coal moving without surrendering the Saar's political independence."
independence_wave_ajx_settle_former_host_ledgers: "Settle the Former Host Ledgers"
independence_wave_ajx_settle_former_host_ledgers_desc: "Property, pensions, rolling stock, and border administration must be separated from sovereignty and written into an enforceable account."
independence_wave_ajx_ratify_constitutional_charter: "Ratify the Municipal Charter"
independence_wave_ajx_ratify_constitutional_charter_desc: "The elected municipalities can turn the provisional compact into a constitutional republic."
independence_wave_ajx_entrust_saar_labor_councils: "Entrust the Saar Labor Councils"
independence_wave_ajx_entrust_saar_labor_councils_desc: "Mine, rail, and factory delegates can assume the permanent administration through a common labor congress."
independence_wave_ajx_accept_patron_industrial_mandate: "Accept a Patron Industrial Mandate"
independence_wave_ajx_accept_patron_industrial_mandate_desc: "A guarantor's orders, credit, and transit protection can secure the basin at the price of strategic dependence."
independence_wave_ajx_seat_municipal_neutral_commission: "Seat the Municipal Neutral Commission"
independence_wave_ajx_seat_municipal_neutral_commission_desc: "Municipal jurists and civil servants will hold the balance between industry, labor, and the security companies without allowing armed companies to govern."
independence_wave_ajx_codify_durable_independence: "Codify Durable Saar Independence"
independence_wave_ajx_codify_durable_independence_desc: "A stable compact and a seated government can bind the founding bargains into permanent public law."
independence_wave_ajx_balance_patron_contracts: "Balance the Patron Contracts"
independence_wave_ajx_balance_patron_contracts_desc: "No single foreign purchaser should be able to turn coal orders, credit, or transit permits into control of the state."
independence_wave_ajx_survey_rhenish_league_corridor: "Survey the Rhenish League Corridor"
independence_wave_ajx_survey_rhenish_league_corridor_desc: "Municipal engineers and customs officials will map the rail, river, debt, and industrial terms of a wider Rhenish settlement."
independence_wave_ajx_convene_rhenish_league_congress: "Convene a Rhenish League Congress"
independence_wave_ajx_convene_rhenish_league_congress_desc: "The Saar can submit a negotiated league proposal once its own compact and regional standing are strong enough to survive the bargain."
independence_wave_ajx_charter_network_coal_transit: "Charter Network Coal Transit"
independence_wave_ajx_charter_network_coal_transit_desc: "A common transit charter will exchange predictable coal deliveries for protected network access."

independence_wave_ajx_project_failure_effect_tt: "Industrial Continuity and Neutrality Credibility fall by §R10§!, while the founding crisis worsens."
independence_wave_ajx_industrial_project_effect_tt: "Industrial Continuity rises by §G20§! and Neutrality Credibility by §G5§!, with additional administrative progress."
independence_wave_ajx_security_project_effect_tt: "Industrial Continuity and Neutrality Credibility each rise by §G15§!, with additional security progress."
independence_wave_ajx_diplomatic_project_effect_tt: "Industrial Continuity rises by §G10§! and Neutrality Credibility by §G20§!, with additional diplomatic progress."
independence_wave_ajx_host_settlement_effect_tt: "Neutrality Credibility rises by §G20§! and Industrial Continuity by §G5§!. Former-host claims, hostility, obligations, and property disputes are reduced while border cooperation improves."
independence_wave_ajx_route_government_effect_tt: "Installs the selected permanent Saar government and its route identity."
independence_wave_ajx_neutral_commission_government_effect_tt: "Seats Walter Simons's civilian Municipal Neutral Commission and establishes its distinct neutral identity."
independence_wave_ajx_durable_independence_effect_tt: "Records a durable Saar settlement and substantially improves the public state values."
independence_wave_ajx_patron_balance_effect_tt: "Reduces the influence of every registered patron and strengthens the Saar's diplomatic position."
independence_wave_ajx_rhenish_corridor_survey_effect_tt: "Completes the Saar corridor survey and improves diplomatic standing."
independence_wave_ajx_rhenish_congress_effect_tt: "The Saar delegation prepares the selected §YRhenish League§! ledgers and submits them to the shared congress vote. A successful vote strengthens network standing and leaves the league charter ready for the final proclamation."
independence_wave_ajx_network_project_effect_tt: "Charters network coal transit and substantially improves network and public standing."

independence_wave_power_first_municipal_commission: "Entrench the Municipal Commission"
independence_wave_power_second_industrial_security: "Empower the Industrial Security Companies"

independence_wave_ajx_appoint_neutral_commission_focus: "Appoint the Neutral Commission"
independence_wave_ajx_appoint_neutral_commission_focus_desc: "The municipalities can place a civilian commission above partisan blocs, industrial managers, and armed company guards."
independence_wave_ajx_appoint_neutral_commission_tt: "Locks the distinct §YMunicipal Neutral Commission§! route, improves Neutrality Credibility, and excludes every other permanent-government route."
independence_wave_ajx_codify_municipal_neutrality_focus: "Codify Municipal Neutrality"
independence_wave_ajx_codify_municipal_neutrality_focus_desc: "Neutrality will rest on published customs, transit, procurement, and diplomatic rules rather than improvised declarations."
independence_wave_ajx_codify_municipal_neutrality_tt: "Raises Neutrality Credibility and stabilizes the public compact."
independence_wave_ajx_bind_security_to_commission_focus: "Bind Security to the Commission"
independence_wave_ajx_bind_security_to_commission_focus_desc: "Industrial security may protect mines and railways, but warrants, appointments, and budgets will remain in civilian hands."
independence_wave_ajx_bind_security_to_commission_tt: "Improves both compact values and subordinates the security companies to the civilian settlement."
independence_wave_ajx_entrench_neutral_commission_focus: "Entrench the Neutral Commission"
independence_wave_ajx_entrench_neutral_commission_focus_desc: "A durable division of municipal, industrial, labor, and security authority can turn provisional neutrality into a governing identity."
independence_wave_ajx_entrench_neutral_commission_tt: "Completes the distinct Neutral Commission government settlement and advances durable sovereignty."

independence_wave_ajx_keep_mines_breathing_focus: "Keep the Mines Breathing"
independence_wave_ajx_keep_mines_breathing_focus_desc: "Coal traffic, pumping, power, and food deliveries must be kept under a single emergency ledger."
independence_wave_ajx_keep_mines_breathing_tt: "Raises Industrial Continuity and begins the Saar survival program."
independence_wave_ajx_charter_coal_rail_authority_focus: "Charter the Coal and Rail Authority"
independence_wave_ajx_charter_coal_rail_authority_focus_desc: "A public authority will coordinate coal orders, wagons, infrastructure, and municipal stocks without handing sovereignty to any firm."
independence_wave_ajx_charter_coal_rail_authority_tt: "Improves both compact values, administration, and infrastructure in the Saar."
independence_wave_ajx_screen_industrial_security_companies_focus: "Screen the Industrial Security Companies"
independence_wave_ajx_screen_industrial_security_companies_focus_desc: "Personnel rolls, armories, contracts, and chains of command must be inspected before private guards become a rival state."
independence_wave_ajx_screen_industrial_security_companies_tt: "Improves both compact values and public security."
independence_wave_ajx_open_cross_border_trade_desk_focus: "Open the Cross-Border Trade Desk"
independence_wave_ajx_open_cross_border_trade_desk_focus_desc: "The Saar cannot live by sealing its borders, but every contract must preserve customs authority and political independence."
independence_wave_ajx_open_cross_border_trade_desk_tt: "Raises Neutrality Credibility and advances diplomatic recognition."
independence_wave_ajx_settle_saar_accounts_focus: "Settle the Saar Accounts"
independence_wave_ajx_settle_saar_accounts_focus_desc: "Pensions, rolling stock, municipal debts, and industrial property will be separated from the former host's sovereignty claim."
independence_wave_ajx_settle_saar_accounts_tt: "Opens a Saar account settlement and strengthens the compact's public legitimacy."
independence_wave_ajx_send_rhenish_league_delegation_focus: "Send the Rhenish League Delegation"
independence_wave_ajx_send_rhenish_league_delegation_focus_desc: "The Saar will carry its coal, customs, demobilization, and municipal guarantees into negotiations for a Rhenish League."
independence_wave_ajx_send_rhenish_league_delegation_tt: "Readies the Saar's Rhenish League delegation and advances regional network standing."
