l_english:
africa_achievement_eligible_tooltip: "Available through normal play."

africa_guardians_without_borders_NAME: "Guardians Without Borders"
africa_guardians_without_borders_DESC: "Protect eight independent African partners and carry every promise safely into continental union."
africa_guardians_without_borders_tooltip: "As a normal grounded host, protect at least eight independent African states, settle every protection war, and keep every counted partner alive and outside direct annexation until Africa is One."
africa_last_convoy_home_NAME: "The Last Convoy Home"
africa_last_convoy_home_DESC: "Reach a colonial partner at the edge of defeat and keep the road home open."
africa_last_convoy_home_tooltip: "Complete an aid corridor to a colonial-war partner with less than 20 percent resistance remaining, prevent capitulation for 180 days, then secure victory or negotiated independence without annexing it."
africa_no_empty_promises_NAME: "No Empty Promises"
africa_no_empty_promises_DESC: "Let twelve guarantees become the foundation of a trusted continental order."
africa_no_empty_promises_tooltip: "On a voluntary League or confederal route, issue at least twelve guarantees, break none, and reach Africa is One with every surviving guaranteed partner at high Member Confidence."
africa_the_interveners_left_NAME: "The Interveners Left"
africa_the_interveners_left_DESC: "Turn a great-power expedition away without surrendering a League member."
africa_the_interveners_left_tooltip: "During the Scramble, defeat a foreign great-power expedition or intervention coalition on African soil without a League member capitulating or accepting partition."
africa_archive_of_the_living_state_NAME: "Archive of the Living State"
africa_archive_of_the_living_state_DESC: "Carry three governments through collapse and restore each one to political life."
africa_archive_of_the_living_state_tooltip: "Evacuate three collapsing partner governments and their archives, restore all three as independent or autonomous-federal polities, and never destroy, suppress, sell, or annex their state memory."
africa_twelve_empty_chairs_filled_NAME: "Twelve Empty Chairs Filled"
africa_twelve_empty_chairs_filled_DESC: "Seat a full congress and keep every delegation at the table for a year."
africa_twelve_empty_chairs_filled_tooltip: "Complete every agenda of a congress with at least twelve full members, then retain all twelve for 365 days without expulsion or coerced accession."
africa_the_clause_is_the_country_NAME: "The Clause Is the Country"
africa_the_clause_is_the_country_DESC: "Bind a continent through negotiated obligations that its members chose to keep."
africa_the_clause_is_the_country_tooltip: "Reach Africa is One with ten members each holding at least three distinct accession clauses and every counted dispute resolved. Do not cancel protected clauses, annex untracked members, or use Military Continentalism."
africa_exit_without_war_NAME: "Exit Without War"
africa_exit_without_war_DESC: "Allow a major member to leave, remain at peace, and welcome it back by consent."
africa_exit_without_war_tooltip: "On a voluntary or confederal route, negotiate a major member's exit, remain at peace with it for 720 days, then restore it as an associate or ally without war, coup, or coercion."
africa_no_second_capital_NAME: "No Second Capital"
africa_no_second_capital_DESC: "Resolve four rival crises before a second continental centre can harden."
africa_no_second_capital_tooltip: "Resolve four rival-bloc crises through arbitration, concessions, development, or constitutional settlement within 180 days each. Do not annex a rival leader or use terminal coercion."
africa_every_region_speaks_NAME: "Every Region Speaks"
africa_every_region_speaks_DESC: "Give all nine continental regions a member, a congress, and a settled voice."
africa_every_region_speaks_tooltip: "Before Africa is One, represent all nine regions with at least one member and resolve every regional overlap dispute."
africa_confidence_is_contagious_NAME: "Confidence Is Contagious"
africa_confidence_is_contagious_DESC: "Keep fifteen members confident while the centre carries a sustainable burden."
africa_confidence_is_contagious_tooltip: "Maintain at least fifteen members at high Member Confidence and keep Integration Burden below high for 720 days without coercive integration, a member cascade, or direct member annexation."
africa_federation_by_consent_NAME: "Federation by Consent"
africa_federation_by_consent_DESC: "Build a federal Africa through statutes, representation, and accepted fiscal terms."
africa_federation_by_consent_tooltip: "As the Federal Union, reach Africa is One with at least twelve autonomous federal members whose representation and fiscal settlements are complete. Never force annexation, accept a military takeover, or enter the Covenant route."
africa_republic_of_many_capitals_NAME: "Republic of Many Capitals"
africa_republic_of_many_capitals_DESC: "Distribute republican institutions and prove that succession can outlive one centre."
africa_republic_of_many_capitals_tooltip: "As the Continental Republic, establish five continental institutions in distinct regions, activate constitutional succession, and survive for five years without suspension, one-region centralisation, or military transition."
africa_crowns_at_one_table_NAME: "Crowns at One Table"
africa_crowns_at_one_table_DESC: "Seat eight recognised courts inside one constitutional continental settlement."
africa_crowns_at_one_table_tooltip: "Begin with or restore monarchical legitimacy, complete the Council of Crowns, seat eight recognised monarchies or courts, settle succession, and reach Africa is One without deposition, abolition, or coercive annexation."
africa_union_of_work_and_land_NAME: "Union of Work and Land"
africa_union_of_work_and_land_DESC: "Make workers, farmers, food, and public industry the union's durable foundation."
africa_union_of_work_and_land_tooltip: "As a socialist or communist People's Union host, represent workers and peasants in eight regions, socialise twelve resource projects, and keep food stable for three years without military takeover, private concessions, or preventable famine."
africa_order_without_partition_NAME: "Order Without Partition"
africa_order_without_partition_DESC: "Win the emergency, then return military power to a represented continent."
africa_order_without_partition_tooltip: "As a military or authoritarian host, form Africa through Military Continentalism, defeat two major interventions, reduce emergency rule, and restore representation without permanent maximum rule, genocide against members, or regional partition."
africa_confederation_that_endured_NAME: "The Confederation That Endured"
africa_confederation_that_endured_DESC: "Hold fifteen sovereign members together for a decade without hollowing out their sovereignty."
africa_confederation_that_endured_tooltip: "As the Continental Confederation, retain at least fifteen sovereign members for ten years, settle or win the Scramble, and never breach the confederal integration ceiling or trigger federal annexation or a member cascade."
africa_covenant_with_the_impossible_NAME: "A Covenant with the Impossible"
africa_covenant_with_the_impossible_DESC: "Write rights and obligations for actors that no grounded constitution expected."
africa_covenant_with_the_impossible_tooltip: "As a high-chaos Covenant host, seat at least three clearly nonhuman or supernatural members with protected rights and settled obligations, then keep peace for five years without enslavement, extermination, rampage, or terminal disease."
africa_kings_of_the_savanna_NAME: "Kings of the Savanna"
africa_kings_of_the_savanna_DESC: "Restore Luba, Lunda, and Kuba as distinct courts inside one settled order."
africa_kings_of_the_savanna_tooltip: "Recognise living Luba, Lunda, and Kuba polities, settle their overlaps, and keep all three in the same League or federation without premature annexation or destruction of a court."
africa_nile_has_many_memories_NAME: "The Nile Has Many Memories"
africa_nile_has_many_memories_DESC: "Let several Nile inheritances share the river without erasing one another."
africa_nile_has_many_memories_tooltip: "As a Nile or Horn actor, recognise at least three of Kush, Nubia, Makuria, and Alodia, settle their overlaps, and maintain a Nile corridor without erasure, corridor failure, or an unresolved capital dispute."
africa_ports_of_the_monsoon_NAME: "Ports of the Monsoon"
africa_ports_of_the_monsoon_DESC: "Join six coastal and island polities through ports, law, and monsoon passage."
africa_ports_of_the_monsoon_tooltip: "As an East African, island, or coastal actor, unite six Swahili or island polities in a maritime federation, operate five ports, and maintain convoy access for three years without losing two ports or taking an inland military shortcut."
africa_walls_courts_and_caravans_NAME: "Walls, Courts, and Caravans"
africa_walls_courts_and_caravans_DESC: "Give Aksum and Harar secure constitutional places on both sides of a living corridor."
africa_walls_courts_and_caravans_tooltip: "As a Horn actor, complete the Aksum and Harar packages, secure Red Sea and inland corridors, and keep their constitutional settlement at peace for one year without abolition or corridor loss."
africa_the_old_gold_roads_NAME: "The Old Gold Roads"
africa_the_old_gold_roads_DESC: "Turn three plateau restorations and their mines toward local industry."
africa_the_old_gold_roads_tooltip: "As a Southern African actor, sustain three plateau polities, pair their mining zones with local processing, and prevent foreign majority ownership for five years without annexing a polity or losing its corridor."
africa_member_who_said_no_NAME: "The Member Who Said No"
africa_member_who_said_no_DESC: "Refuse the unifier and build a recognised African alternative instead of abandoning the continent."
africa_member_who_said_no_tooltip: "Begin as or validly switch to a Tier A Event 12 polity, refuse the unifier, build a rival bloc of four, defeat or settle the unifier, and lead a recognised African confederation without becoming a colonial puppet or destroying the League."
africa_return_without_compulsion_NAME: "Return Without Compulsion"
africa_return_without_compulsion_DESC: "Welcome eight voluntary waves from four shores with trust and citizenship intact."
africa_return_without_compulsion_tooltip: "Complete eight voluntary return waves from four origin groups, keep Diaspora Trust high, and guarantee citizenship or protected status without forced relocation, negligent disaster, or discrimination."
africa_tools_books_and_ballots_NAME: "Tools, Books, and Ballots"
africa_tools_books_and_ballots_DESC: "Let returnees build schools, clinics, works, administration, and political voice."
africa_tools_books_and_ballots_tooltip: "Complete education, medicine, engineering, and administration programmes, protect returnee representation, and deliver twelve diaspora projects without a military labor-only programme, denied representation, or trust collapse."
africa_four_oceans_homeward_NAME: "Four Oceans Homeward"
africa_four_oceans_homeward_DESC: "Bring safe voluntary routes home from four distinct global communities."
africa_four_oceans_homeward_tooltip: "Complete safe return or investment routes from North America, South America or the Caribbean, Europe, and the Indian Ocean without catastrophic loss or forced relocation."
africa_capital_without_capture_NAME: "Capital Without Capture"
africa_capital_without_capture_DESC: "Use diaspora capital for ten locally controlled projects without surrendering the government."
africa_capital_without_capture_tooltip: "Fund ten locally controlled diaspora-invested projects, keep local ownership above the protected threshold, and prevent foreign or diaspora capture of the Charter government or an unresolved corruption crisis."
africa_rails_rivers_roads_and_ports_NAME: "Rails, Rivers, Roads, and Ports"
africa_rails_rivers_roads_and_ports_DESC: "Connect every region through all four continental transport systems."
africa_rails_rivers_roads_and_ports_tooltip: "Complete a major rail, river, road, and port system, connect all nine regions, and maintain access for 720 days without splitting the network or losing a connected region."
africa_ore_leaves_as_machines_NAME: "Ore Leaves as Machines"
africa_ore_leaves_as_machines_DESC: "Pair twelve resource zones with local processing and keep concessions bounded."
africa_ore_leaves_as_machines_tooltip: "Control or partner in twelve major resource zones, establish local processing for each, and keep foreign concession share below the cap for five years without dependency crisis or forced seizure."
africa_bread_before_banners_NAME: "Bread Before Banners"
africa_bread_before_banners_DESC: "Secure food in every region before the final continental banner rises."
africa_bread_before_banners_tooltip: "Reach high food security in all nine regions before Africa is One, maintain reserves, and survive a drought or famine without preventable collapse or maximum ecological wrath against civilians."
africa_development_without_overstretch_NAME: "Development Without Overstretch"
africa_development_without_overstretch_DESC: "Complete thirty projects while every region remains represented in the gains."
africa_development_without_overstretch_tooltip: "Complete thirty development projects across all nine regions while Integration Burden stays below high and no region falls below medium confidence for 720 days. Avoid exploitation scandals."
africa_common_reserve_answers_NAME: "The Common Reserve Answers"
africa_common_reserve_answers_DESC: "Send the common reserve where it was promised, six times, before a capital falls."
africa_common_reserve_answers_tooltip: "Answer six distinct defensive wars by every deadline and lose no protected capital. Do not use the reserve for offensive abuse."
africa_no_foreign_boot_remains_NAME: "No Foreign Boot Remains"
africa_no_foreign_boot_remains_DESC: "End the Scramble with no hostile non-African power controlling African soil."
africa_no_foreign_boot_remains_tooltip: "Defeat the Scramble coalition, remove all hostile non-African control from Africa, and sign peace without ceding an African core, leaving a member capitulation unreversed, or accepting an external puppet."
africa_beasts_but_not_caricatures_NAME: "Beasts, but Not Caricatures"
africa_beasts_but_not_caricatures_DESC: "Win beside four impossible formations while their actors retain constitutional rights."
africa_beasts_but_not_caricatures_tooltip: "As a high-chaos host, field four clearly nonhuman or supernatural unit families, win a great-power war, and preserve actor rights without human caricature, extermination, or removal of those rights."
africa_elephants_crossed_the_desert_NAME: "Elephants Crossed the Desert"
africa_elephants_crossed_the_desert_DESC: "Carry an impossible elephant formation across three terrain regions and home from a just war."
africa_elephants_crossed_the_desert_tooltip: "As a high-chaos or Evolution II host, field the elephant logistics or shock formation, cross three terrain regions including desert, maintain supply, and win a protection war without using it against an unthreatened African state."
africa_the_forest_kept_its_word_NAME: "The Forest Kept Its Word"
africa_the_forest_kept_its_word_DESC: "Honor five ecological bargains and survive the disasters they were meant to contain."
africa_the_forest_kept_its_word_tooltip: "As a high-chaos host, honor five ecological bargains, avert or contain three disasters, and keep Ecological Wrath below rampage for five years without breaking a bargain or weaponising disaster against civilians."
africa_rain_on_command_NAME: "Rain on Command"
africa_rain_on_command_DESC: "Turn weather against three hostile armies without destroying a member's land."
africa_rain_on_command_tooltip: "Use weather power against three distinct hostile colonial or intervention armies and win the war without causing a maximum member disaster, targeting a neutral African state, or collapsing Ecological Wrath."
africa_disease_made_and_unmade_NAME: "Disease Made and Unmade"
africa_disease_made_and_unmade_DESC: "Contain every outbreak of the fictional disease unlocked by your own route."
africa_disease_made_and_unmade_tooltip: "Unlock and create the disease route, endure an accidental or enemy outbreak, contain every active outbreak, and complete countermeasures without deliberate uncontrolled civilian release, irreversible spread, or terminal world end."
africa_stone_walks_into_parliament_NAME: "Stone Walks into Parliament"
africa_stone_walks_into_parliament_DESC: "Give the Stoneborn representation and obligations inside a peaceful constitutional order."
africa_stone_walks_into_parliament_tooltip: "Recognise the Stoneborn, ratify representation and obligations, and keep peace with human members for five years without enslavement, dismantling, war, or political erasure."
africa_another_continent_stood_up_NAME: "Another Continent Stood Up"
africa_another_continent_stood_up_DESC: "Sponsor another continental movement from its opening assembly to full identity."
africa_another_continent_stood_up_tooltip: "After Africa is One, sponsor another continent from opening movement to full identity, then remain allied or friendly for five years without puppeting it, allowing collapse, or betraying sponsorship clauses."
africa_two_continents_one_name_NAME: "Two Continents, One Name"
africa_two_continents_one_name_DESC: "Negotiate a readable union of two continents and keep both confident for five years."
africa_two_continents_one_name_tooltip: "Form a two-continent union through negotiation, complete constitutional and military integration, and keep both regions at medium confidence or higher for five years without conquest-only formation, confidence collapse, or civil war."
africa_war_between_worlds_NAME: "War Between Worlds"
africa_war_between_worlds_DESC: "Defeat a rival continent-scale power and make the settlement endure."
africa_war_between_worlds_tooltip: "As Africa or an Africa-led union, defeat a rival continent-scale power in a terminal war, complete a sustainable settlement, and avoid global revolt for three years without forcing a surrender during the settlement period."
africa_the_world_is_one_NAME: "The World Is One"
africa_the_world_is_one_DESC: "Resolve every continent-scale rival and complete the final world identity."
africa_the_world_is_one_tooltip: "As Africa or an Africa-led union, become the last eligible continent-scale actor, resolve every rival through valid methods, form The World, and fire its terminal super-event without another world end or unresolved identity."
