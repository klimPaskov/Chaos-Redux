l_english:
japan_biological_campaign_category: "Biological Campaign in China"
japan_biological_campaign_category_desc: "The offensive medical program can extend occupation-linked biological operations into selected Chinese states held by active belligerents. Every action consumes weaponized agent stock, commits field support, and risks an outbreak whose evidence can establish responsibility."

japan_bio_campaign_contaminate_supply_network: "Contaminate [FROM.GetName] Supply Networks"
japan_bio_campaign_contaminate_supply_network_desc: "Field teams will introduce weaponized anthrax into military stores, transport junctions, and handling sites serving [FROM.GetName]. The release will enter incubation in the selected state and can leave durable contamination, medical pressure, deaths, and forensic evidence."
japan_bio_campaign_disperse_plague_vectors: "Disperse Plague Vectors in [FROM.GetName]"
japan_bio_campaign_disperse_plague_vectors_desc: "Occupation-linked detachments will disperse plague-bearing vectors toward dense population and transport sites in [FROM.GetName]. The selected state will enter incubation, with serious spread potential and a high risk that recovered evidence identifies the program."

japan_bio_campaign_anthrax_target_tt: "Select an enemy-controlled Chinese core state adjacent to Japanese or Japanese-subject territory. The state must contain a military, supply, port, infrastructure, or industrial target, have no active Anthrax episode, and be outside its campaign cooldown."
japan_bio_campaign_plague_target_tt: "Select an enemy-controlled Chinese core state adjacent to Japanese or Japanese-subject territory. The state must contain a city, port, capital, or large population center, have no active Plague episode, and be outside its campaign cooldown."

japan_bio_campaign_anthrax_requirements_tt: "Requires the explicit Ishii authority route, the active Pingfang program, Operational Chemical Readiness, strategic biological-use authority, the Anthrax Bomb project, 35 Political Power, 8 Anthrax Payloads, 35 Support Equipment, 10 Command Power, and no national campaign cooldown."
japan_bio_campaign_plague_requirements_tt: "Requires the explicit Ishii authority route, the active Pingfang program, Operational Chemical Readiness, strategic biological-use authority, the Plague Bomb project, 40 Political Power, 10 Plague Payloads, 45 Support Equipment, 14 Command Power, and no national campaign cooldown."

japan_bio_campaign_anthrax_cost: "£pol_power 35  £command_power 10  Anthrax Payloads 8  £support_equipment_text_icon 35"
japan_bio_campaign_anthrax_cost_blocked: "£pol_power §R35§!  £command_power §R10§!  §RAnthrax Payloads 8§!  £support_equipment_text_icon §R35§!"
japan_bio_campaign_anthrax_cost_tooltip: "Commit §Y35 Political Power§!, §Y10 Command Power§!, §Y8 Anthrax Payloads§!, and §Y35 Support Equipment§! to the selected state."
japan_bio_campaign_plague_cost: "£pol_power 40  £command_power 14  Plague Payloads 10  £support_equipment_text_icon 45"
japan_bio_campaign_plague_cost_blocked: "£pol_power §R40§!  £command_power §R14§!  §RPlague Payloads 10§!  £support_equipment_text_icon §R45§!"
japan_bio_campaign_plague_cost_tooltip: "Commit §Y40 Political Power§!, §Y14 Command Power§!, §Y10 Plague Payloads§!, and §Y45 Support Equipment§! to the selected state."

japan_bio_campaign_anthrax_effect_tt: "Consumes the committed Political Power, §Y8 Anthrax Payloads§!, §Y35 Support Equipment§!, and §Y10 Command Power§!, then seeds an Anthrax incubation in the selected state. Theater Contamination restores §Y2 Command Power§! after a valid release, and Terminal Hazard restores §Y4§!. Detection can expose substantial evidence and impose Condemnation on Japan."
japan_bio_campaign_plague_effect_tt: "Consumes the committed Political Power, §Y10 Plague Payloads§!, §Y45 Support Equipment§!, and §Y14 Command Power§!, then seeds a Plague incubation in the selected state. Theater Contamination restores §Y2 Command Power§! after a valid release, and Terminal Hazard restores §Y4§!. Detection can expose substantial evidence and impose Condemnation on Japan."
