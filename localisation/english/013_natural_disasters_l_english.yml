l_english:
chaosx.events_log.evolution.type.natural_disasters: "Natural Disasters"
chaosx.events_log.window.event_details.natural_disasters: "Natural Disasters brings a season of delayed reports rather than a single accident. A season can strike one state, neighboring districts, several regions, or the wider world as the weather and the ground grow less predictable. Roads, factories, ports, railways, and towns can be damaged, civilian losses enter the death rolls, and affected countries receive response work as the reports arrive."
chaosx.events_log.window.evolution_details.natural_disasters.title.stage_1: "Regional Cascade"
chaosx.events_log.window.evolution_details.natural_disasters.title.stage_2: "Global Disaster Season"
chaosx.events_log.window.evolution_details.natural_disasters.title.stage_3: "Abnormal Front"
chaosx.events_log.window.evolution_details.natural_disasters.body.stage_1: "Disaster seasons broaden into more families and regions. Several states or countries can suffer at once, with follow-up hazards that make capitals, ports, supply hubs, and population centers matter."
chaosx.events_log.window.evolution_details.natural_disasters.body.stage_2: "The season can become worldwide. Reports arrive selectively while damage, displacement, famine risk, supply disruption, and reconstruction pressure appear across several continents."
chaosx.events_log.window.evolution_details.natural_disasters.body.stage_3: "High-chaos seasons can bring meteor showers, global rupture, massive eruptions, delayed tsunamis, and moving storm corridors. The disaster map and response teams track the largest warnings while the most shocking crises break into the world's broadcasts."
chaosx.events_log.window.evolution_details.natural_disasters.body.event_detail: "Natural Disasters tracks its growth through season behavior instead of one world-ending branch: broader regional seasons, global aftermath chains, and abnormal high-chaos families."
chaosx.nr13.1.t: "Natural Disasters"
chaosx.nr13.report.t: "Disaster Report"
chaosx.nr13.201.d: "A delayed field report from [natural_disaster_slot_1_report_state.GetName] confirms a §Y[natural_disaster_slot_1_report_state.GetNaturalDisasterStateFamilyName]§! impact. Rail crews, local relief columns, and transport teams are still sorting which roads can carry traffic and which districts have been cut off.\n\nThe first recovery orders are waiting for crews, equipment, and transport before the situation hardens."
chaosx.nr13.202.d: "A delayed field report from [natural_disaster_slot_2_report_state.GetName] confirms a §Y[natural_disaster_slot_2_report_state.GetNaturalDisasterStateFamilyName]§! impact. Local crews describe damaged buildings, displaced civilians, and transport routes that need direct attention.\n\nThe response teams have work ready before shortages and blocked roads turn temporary damage into a longer crisis."
chaosx.nr13.203.d: "A delayed field report from [natural_disaster_slot_3_report_state.GetName] confirms a §Y[natural_disaster_slot_3_report_state.GetNaturalDisasterStateFamilyName]§! impact. The first accounts are practical rather than dramatic: blocked roads, broken services, missing families, and commanders asking how much equipment can be spared.\n\nLocal recovery will move faster if relief columns arrive before the next weather report."
chaosx.nr13.204.d: "A delayed field report from [natural_disaster_slot_4_report_state.GetName] confirms a §Y[natural_disaster_slot_4_report_state.GetNaturalDisasterStateFamilyName]§! impact. Recovery crews are prioritizing access roads, food, water, and shelters before local production can be made reliable again.\n\nThe state needs practical orders more than announcements."
chaosx.nr13.205.d: "A delayed field report from [natural_disaster_slot_5_report_state.GetName] confirms a §Y[natural_disaster_slot_5_report_state.GetNaturalDisasterStateFamilyName]§! impact. The affected district is not waiting for a speech. It needs crews, fuel, support equipment, and orders that arrive before the next shortage.\n\nThe recovery queue is open while local routes can still carry relief."
chaosx.nr13.206.d: "A delayed field report from [natural_disaster_slot_6_report_state.GetName] confirms a §Y[natural_disaster_slot_6_report_state.GetNaturalDisasterStateFamilyName]§! impact. Wires are down, local returns are incomplete, and the first trustworthy numbers are being carried by relief columns.\n\nA fast response can still keep the aftermath from spreading into supply and public-order trouble."
chaosx.nr13.207.d: "A delayed field report from [natural_disaster_slot_7_report_state.GetName] confirms a §Y[natural_disaster_slot_7_report_state.GetNaturalDisasterStateFamilyName]§! impact. Field coordinators report that the state can be stabilized, but not by paperwork alone.\n\nRecovery crews are needed before the next delayed report arrives."
chaosx.nr13.208.d: "A delayed field report from [natural_disaster_slot_8_report_state.GetName] confirms a §Y[natural_disaster_slot_8_report_state.GetNaturalDisasterStateFamilyName]§! impact. The season has left another state with damaged services and urgent recovery work.\n\nThe affected country can still shorten the aftermath with direct relief and reconstruction orders."
chaosx.nr13.209.d: "A direct field report from [natural_disaster_direct_report_state.GetName] confirms a §Y[natural_disaster_direct_report_state.GetNaturalDisasterStateFamilyName]§! impact. Broken routes, displaced families, and recovery work are already shaping the first accounts from the affected districts.\n\nThe affected country can respond before the local aftermath hardens."
chaosx.nr13.report.a: "Put the crews to work."

chaosx.nr13.news.skyfall.t: "Meteor Showers Strike the Earth"
chaosx.nr13.news.skyfall.d: "Night reports from several observatories no longer agree with the morning. Fire trails were seen over rail towns, rural depots, and coast roads before impacts tore open isolated districts.\n\nAcross the struck districts, rail crews and families are already watching the next sky report."
chaosx.nr13.news.rupture.t: "The Ground Opens Across Continents"
chaosx.nr13.news.rupture.d: "Seismographs across the world have stopped looking like local instruments. Ruptures have split rail beds, harbor roads, and city districts in places that share no fault line on any survey map.\n\nThe first reports ask whether the world itself has become unreliable."
chaosx.nr13.news.eruption.t: "Massive Eruption Darkens the Routes"
chaosx.nr13.news.eruption.d: "A plume large enough to change the day's color has risen over the affected region. Ash is falling over farms, rail lines, waterworks, and airfields, while evacuation columns move under a sky that will not clear.\n\nForeign observers are already revising their maps of the disaster."
chaosx.nr13.news.barrage.t: "Disaster Barrage"
chaosx.nr13.news.barrage.d: "Emergency wires from several regions describe a season that has stopped behaving like weather. Flood, fire, rupture, ash, and storm warnings crowd the calendar into a single violent dispatch.\n\nThe affected countries will remember it as one disaster season, even if the ground names every blow separately."
chaosx.nr13.news.disaster.t: "[natural_disaster_news_state.GetNaturalDisasterNewsTitle]"
chaosx.nr13.news.disaster.d: "[natural_disaster_news_state.GetNaturalDisasterNewsDesc]"
chaosx.nr13.news.a: "Follow the reports."
chaosx.nr13.news.skyfall.a: "Keep the observatories awake."
chaosx.nr13.news.rupture.a: "No survey map is enough."
chaosx.nr13.news.eruption.a: "Ash will choose the routes."
chaosx.nr13.news.barrage.a: "Every road is provisional."
chaosx.nr13.news.earthquake.t: "Earthquake Shakes [natural_disaster_news_state.GetName]"
chaosx.nr13.news.earthquake.d: "Rescue lines are moving into [natural_disaster_news_state.GetName] after an earthquake split roads, rail beds, and factory yards. The first reports are still being rewritten as crews reach districts that went silent under the dust."
chaosx.nr13.news.earthquake.a: "Count the streets that answer."
chaosx.nr13.news.flood.t: "Floodwaters Swallow [natural_disaster_news_state.GetName]"
chaosx.nr13.news.flood.d: "Water has crossed depots, bridges, and low streets in [natural_disaster_news_state.GetName]. Convoys are turning back from drowned approaches while rescue crews search upper floors, embankments, and the last dry roads."
chaosx.nr13.news.flood.a: "Send boats where roads were."
chaosx.nr13.news.tropical_cyclone.t: "Tropical Cyclone Makes Landfall in [natural_disaster_news_state.GetName]"
chaosx.nr13.news.tropical_cyclone.d: "A tropical cyclone has torn through [natural_disaster_news_state.GetName], breaking harbor work, airfields, warehouses, and inland roads in one long sweep. Coastal dispatches are arriving wet, late, and already contradicted by the next tide."
chaosx.nr13.news.tropical_cyclone.a: "Watch the coast after the wind."
chaosx.nr13.news.thunderstorm.t: "Severe Thunderstorm Tears Through [natural_disaster_news_state.GetName]"
chaosx.nr13.news.thunderstorm.d: "Lightning, sudden flooding, and violent wind have cut services across [natural_disaster_news_state.GetName]. The storm moved faster than the warning wires, leaving rail crews and local authorities to find the damage by sound and smoke."
chaosx.nr13.news.thunderstorm.a: "The sky did not wait."
chaosx.nr13.news.hailstorm.t: "Hailstorm Batters [natural_disaster_news_state.GetName]"
chaosx.nr13.news.hailstorm.d: "Heavy hail has hammered [natural_disaster_news_state.GetName], breaking roofs, storehouses, crop rows, and exposed roads. The damage looks scattered from a distance, but the local counts are arriving with ruined granaries and smashed shelter lines."
chaosx.nr13.news.hailstorm.a: "Listen for broken glass."
chaosx.nr13.news.extreme_wind.t: "Extreme Winds Cross [natural_disaster_news_state.GetName]"
chaosx.nr13.news.extreme_wind.d: "Extreme winds have crossed [natural_disaster_news_state.GetName], throwing debris across roads, rail yards, airfields, and exposed settlements. Transport officers are marking downed lines first, because every blocked approach is slowing the next rescue column."
chaosx.nr13.news.extreme_wind.a: "Tie down what remains."
chaosx.nr13.news.wildfire.t: "Wildfire Spreads Through [natural_disaster_news_state.GetName]"
chaosx.nr13.news.wildfire.d: "Wildfire has spread through [natural_disaster_news_state.GetName], driving smoke over towns, depots, forests, and roadside shelters. Firebreak crews are cutting around industry and evacuation roads while the wind keeps changing the front."
chaosx.nr13.news.wildfire.a: "The smoke has a timetable."
chaosx.nr13.news.drought.t: "Drought Tightens Around [natural_disaster_news_state.GetName]"
chaosx.nr13.news.drought.d: "Drought pressure in [natural_disaster_news_state.GetName] has reached wells, fields, and distribution routes. Food and water columns are being counted before the shortage becomes the sort that cannot be talked down."
chaosx.nr13.news.drought.a: "Count the wells twice."
chaosx.nr13.news.dust_storm.t: "Dust Storm Buries Routes in [natural_disaster_news_state.GetName]"
chaosx.nr13.news.dust_storm.d: "A sand and dust storm has buried routes across [natural_disaster_news_state.GetName]. Engines are choking, airfields are closing, and road columns are moving by the memory of landmarks they can no longer see."
chaosx.nr13.news.dust_storm.a: "The horizon has closed."
chaosx.nr13.news.blizzard.t: "Blizzard Cuts Through [natural_disaster_news_state.GetName]"
chaosx.nr13.news.blizzard.d: "A blizzard has cut through [natural_disaster_news_state.GetName], closing passes, burying rail work, and forcing relief columns into slow convoys of fuel, blankets, and shovels. The cold is turning delay into damage."
chaosx.nr13.news.blizzard.a: "Keep the fires counted."
chaosx.nr13.news.heat_wave.t: "Heat Wave Grips [natural_disaster_news_state.GetName]"
chaosx.nr13.news.heat_wave.d: "Heat has settled over [natural_disaster_news_state.GetName], straining water points, clinics, workshops, and shelter queues. The local reports are quiet at first, then full of names from districts where the shade ran out."
chaosx.nr13.news.heat_wave.a: "Move before noon."
chaosx.nr13.news.cold_wave.t: "Cold Wave Freezes [natural_disaster_news_state.GetName]"
chaosx.nr13.news.cold_wave.d: "A cold wave has frozen roads, rails, and shelters across [natural_disaster_news_state.GetName]. Fuel wagons and repair crews are being pushed toward the worst-hit districts before the pipes, tracks, and people fail together."
chaosx.nr13.news.cold_wave.a: "Warmth is logistics."
chaosx.nr13.news.dry_mass_movement.t: "Landslide Blocks [natural_disaster_news_state.GetName]"
chaosx.nr13.news.dry_mass_movement.d: "A dry landslide has come down across [natural_disaster_news_state.GetName], burying roads, cutting service lines, and trapping small settlements behind stone and dust. Relief columns are measuring the slope before they dare move under it."
chaosx.nr13.news.dry_mass_movement.a: "The hill has moved."
chaosx.nr13.news.wet_mass_movement.t: "Mudslide Hits [natural_disaster_news_state.GetName]"
chaosx.nr13.news.wet_mass_movement.d: "Mud has swept through roads and settlements in [natural_disaster_news_state.GetName]. Rescue crews are searching for firm ground as warehouses, bridges, and homes settle into the same brown line."
chaosx.nr13.news.wet_mass_movement.a: "Find the ground first."
chaosx.nr13.news.volcanic_eruption.t: "Volcanic Eruption Covers [natural_disaster_news_state.GetName]"
chaosx.nr13.news.volcanic_eruption.d: "A volcanic eruption has thrown ash across [natural_disaster_news_state.GetName]. Airfields, water points, farms, and roads are being covered while evacuation routes fill with people carrying what the ash has not taken."
chaosx.nr13.news.volcanic_eruption.a: "Ash makes its own night."
chaosx.nr13.news.tsunami.t: "Tsunami Strikes [natural_disaster_news_state.GetName]"
chaosx.nr13.news.tsunami.d: "A tsunami has struck [natural_disaster_news_state.GetName], damaging harbors, coastal roads, depots, and low districts. Survivors are moving inland as the water pulls wreckage back through streets that still have names."
chaosx.nr13.news.tsunami.a: "The sea has entered the ledgers."
chaosx.nr13.news.avalanche.t: "Avalanche Buries Routes in [natural_disaster_news_state.GetName]"
chaosx.nr13.news.avalanche.d: "An avalanche has fallen across [natural_disaster_news_state.GetName], burying routes and cutting settlements away from supply. Rescue teams are moving through snow, stone, and broken timber while the slopes above them keep settling."
chaosx.nr13.news.avalanche.a: "Speak softly on the slope."
chaosx.nr13.news.glacial_outburst.t: "Glacial Outburst Flood Hits [natural_disaster_news_state.GetName]"
chaosx.nr13.news.glacial_outburst.d: "A glacial outburst flood has rushed into [natural_disaster_news_state.GetName]. Bridges, rail approaches, and low settlements are being hit by water carrying ice, stone, and entire pieces of the valley."
chaosx.nr13.news.glacial_outburst.a: "The mountain sent water."
chaosx.nr13.news.sinkhole.t: "Sinkhole Collapse Tears Open [natural_disaster_news_state.GetName]"
chaosx.nr13.news.sinkhole.d: "A sinkhole collapse has opened under [natural_disaster_news_state.GetName], breaking roads, service lines, and nearby buildings without warning. Crews are stepping lightly around gaps that were not on yesterday's maps."
chaosx.nr13.news.sinkhole.a: "Measure every hollow."
chaosx.nr13.news.limnic_eruption.t: "Limnic Eruption Chokes [natural_disaster_news_state.GetName]"
chaosx.nr13.news.limnic_eruption.d: "A limnic eruption has choked parts of [natural_disaster_news_state.GetName]. Villages near the water are clearing out while rescue parties test the low ground before sending anyone else into the invisible air."
chaosx.nr13.news.limnic_eruption.a: "Even the air needs scouts."
chaosx.nr13.news.meteor_shower.t: "Meteor Shower Strikes [natural_disaster_news_state.GetName]"
chaosx.nr13.news.meteor_shower.d: "Meteor strikes have hit [natural_disaster_news_state.GetName], leaving fires, craters, and broken routes across scattered districts. Night travel is slowing because every clear sky now looks like a warning."
chaosx.nr13.news.meteor_shower.a: "Do not trust the stars."
chaosx.nr13.news.global_rupture.t: "Rupture Splits [natural_disaster_news_state.GetName]"
chaosx.nr13.news.global_rupture.d: "The ground under [natural_disaster_news_state.GetName] has split along lines that do not match local surveys. Rails, roads, and whole districts are breaking as if the map beneath them has been edited by force."
chaosx.nr13.news.global_rupture.a: "The fault is not local."
chaosx.nr13.news.massive_eruption.t: "Massive Eruption Darkens [natural_disaster_news_state.GetName]"
chaosx.nr13.news.massive_eruption.d: "A massive eruption has darkened [natural_disaster_news_state.GetName], covering fields, roads, airfields, and water points with ash. Evacuation columns are moving under a sky that seems to be staying for the season."
chaosx.nr13.news.massive_eruption.a: "Keep lamps in daylight."
chaosx.nr13.news.storm_corridor.t: "Moving Storm Corridor Crosses [natural_disaster_news_state.GetName]"
chaosx.nr13.news.storm_corridor.d: "A moving storm corridor has crossed [natural_disaster_news_state.GetName], pulling damage along roads, airfields, and exposed settlements. Communities in the projected path are leaving before the storm learns the next road."
chaosx.nr13.news.storm_corridor.a: "The storm has a route."

