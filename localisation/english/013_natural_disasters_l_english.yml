natural_disaster.report.batch.summary.empty: "No current disaster details are available."
natural_disaster.report.batch.family.mixed: "Several types of disaster struck [This.GetNaturalDisasterReportBatchStateList], including [This.GetNaturalDisasterReportBatchWorstFamily] and [This.GetNaturalDisasterReportBatchSecondFamily][This.GetNaturalDisasterReportBatchMoreFamilies]."
natural_disaster.report.batch.family.more: ", with other hazards also reported."
natural_disaster.report.batch.deaths.present: "\n\nCivilian lives were lost across the affected territory."
natural_disaster.report.batch.damage.present: "\n\nReported damage includes[This.GetNaturalDisasterReportBatchDamageList]."
natural_disaster.report.batch.damage.list: "[This.GetNaturalDisasterReportBatchDamageTransportClause][This.GetNaturalDisasterReportBatchDamageIndustryClause][This.GetNaturalDisasterReportBatchDamagePortClause][This.GetNaturalDisasterReportBatchDamageAirClause][This.GetNaturalDisasterReportBatchDamageRadarClause]"
natural_disaster.report.batch.damage.none: ""
natural_disaster.report.batch.recovery.stack: "\n\nRemaining priorities include [This.GetNaturalDisasterReportBatchRecoveryRescueSentence][This.GetNaturalDisasterReportBatchRecoveryStabilizationSentence][This.GetNaturalDisasterReportBatchRecoveryReconstructionSentence]."
natural_disaster.report.batch.recovery.rescue: "search teams"
natural_disaster.report.batch.recovery.stabilization: "relief supplies"
natural_disaster.report.batch.recovery.stabilization.next: " and relief supplies"
natural_disaster.report.batch.recovery.reconstruction: "permanent repairs"
natural_disaster.report.batch.recovery.reconstruction.next: " and permanent repairs"
natural_disaster.report.batch.recovery.none: ""
natural_disaster.report.batch.family.earthquake: "Earthquakes shook [This.GetNaturalDisasterReportBatchStateList]. Crews are searching damaged buildings and inspecting bridges and rail lines."
natural_disaster.report.batch.family.flood: "Floodwater spread through [This.GetNaturalDisasterReportBatchStateList]. Boat crews are reaching cut-off villages and engineers are checking which roads still carry traffic."
natural_disaster.report.batch.family.tropical_cyclone: "Cyclone winds and coastal rain crossed [This.GetNaturalDisasterReportBatchStateList]. Harbor crews are securing the ports and relief teams are moving families away from the coast."
natural_disaster.report.batch.family.extreme_wind: "Destructive winds crossed [This.GetNaturalDisasterReportBatchStateList]. Crews are clearing debris from the roads and checking exposed roofs."
natural_disaster.report.batch.family.tornado_outbreak: "Tornadoes cut narrow paths through [This.GetNaturalDisasterReportBatchStateList]. Rescue crews are working along each track."
natural_disaster.report.batch.family.thunderstorm: "Severe thunderstorms passed across [This.GetNaturalDisasterReportBatchStateList]. Crews are clearing flooded roads and checking the airfields."
natural_disaster.report.batch.family.hailstorm: "Large hail fell on [This.GetNaturalDisasterReportBatchStateList]. Field teams are counting damaged roofs, vehicles, and crops."
natural_disaster.report.batch.family.blizzard: "Blizzard conditions swept across [This.GetNaturalDisasterReportBatchStateList]. Plows and fuel convoys are working to reach snowbound settlements."
natural_disaster.report.batch.family.cold_wave: "Severe cold settled over [This.GetNaturalDisasterReportBatchStateList]. Heating fuel and warm shelter are the first needs in the coldest districts."
natural_disaster.report.batch.family.heat_wave: "Extreme heat persisted across [This.GetNaturalDisasterReportBatchStateList]. Hospitals and crowded districts need drinking water and shade."
natural_disaster.report.batch.family.drought: "Drought spread through [This.GetNaturalDisasterReportBatchStateList]. Wells are failing and crews are hauling water to farms and towns."
natural_disaster.report.batch.family.dust_and_sandstorm: "Dust and sand darkened the sky over [This.GetNaturalDisasterReportBatchStateList]. Crews are clearing roads and checking the water supply."
natural_disaster.report.batch.family.wildfire: "Wildfires burned across [This.GetNaturalDisasterReportBatchStateList]. Fire crews are cutting firebreaks and moving families away from the flames."
natural_disaster.report.batch.family.dry_mass_movement: "Dry soil and rock gave way on slopes near [This.GetNaturalDisasterReportBatchStateList]. Rescue teams are searching below the slides and watching for more rockfall."
natural_disaster.report.batch.family.wet_mass_movement: "Rain-soaked slopes gave way near [This.GetNaturalDisasterReportBatchStateList]. Rescue teams are searching the valleys and the settlements downstream."
natural_disaster.report.batch.family.volcanic_eruption: "A volcanic eruption sent ash and gas over [This.GetNaturalDisasterReportBatchStateList]. Crews are moving families off the slopes and out of the valleys nearest the vent."
natural_disaster.report.batch.family.ashfall: "Volcanic ash fell over [This.GetNaturalDisasterReportBatchStateList]. Crews are sweeping roofs, clearing runways, and checking the water supply."
natural_disaster.report.batch.family.lahar: "A lahar swept down the valleys near [This.GetNaturalDisasterReportBatchStateList]. Rescue teams are searching the settlements downstream."
natural_disaster.report.batch.family.tsunami: "Tsunami waves reached the coast at [This.GetNaturalDisasterReportBatchStateList]. Relief crews are working above the shoreline and searching the flooded harbors."
natural_disaster.report.batch.family.storm_surge: "A storm surge pushed seawater onto the coast at [This.GetNaturalDisasterReportBatchStateList]. Pump crews and harbor teams are working in the flooded districts."
natural_disaster.report.batch.family.meteor_impact: "Meteors fell near [This.GetNaturalDisasterReportBatchStateList]. Search teams are walking the fall area and the nearby shore."
natural_disaster.report.batch.family.meteor_shower: "Burning fragments from a meteor shower fell over [This.GetNaturalDisasterReportBatchStateList]. Teams are marking the impact sites and putting out fires."
natural_disaster.report.batch.family.whole_earth_rupture: "Rupture waves tore across [This.GetNaturalDisasterReportBatchStateList]. Rescue teams are working between the broken stretches of road and rail."
natural_disaster.report.batch.family.massive_eruption: "A massive eruption sent ash and gas high above [This.GetNaturalDisasterReportBatchStateList]. Crews are evacuating the valleys nearest the vent."
natural_disaster.report.batch.family.moving_storm_corridor: "A belt of storms moved across [This.GetNaturalDisasterReportBatchStateList] with wind, flooding, and tornadoes. Crews are following its path and clearing what it left behind."
natural_disaster.report.batch.states.one: "[?natural_disaster_report_batch_state_entries^natural_disaster_report_active_state_index_0.GetName]"
