nd_cat_recovery_overview: "Natural Disaster Recovery"
nd_cat_recovery_overview_desc: "Tracks active warnings, local recovery ledgers, shared shelter work, and national relief movement while family boards handle serious incidents."
nd_overview_coordinate_relief_access: "Coordinate Relief Access"
nd_overview_coordinate_relief_access_desc: "Direct national transport staff toward states where floodwater, rubble, ash, fire, or crater fields still block relief."
nd_overview_coordinate_relief_access_tt: "Relief access improves recovery progress across unresolved disaster aftermaths and strengthens national relief coordination."
nd_overview_expand_shelter_registry: "Expand Shelter Registry"
nd_overview_expand_shelter_registry_desc: "Move public shelters, field kitchens, and civil defense stores into the active disaster ledger."
nd_overview_expand_shelter_registry_tt: "Shelter work reduces future civilian exposure and advances recovery across unresolved aftermath states."
nd_cat_famine_displacement_commission: "Famine and Displacement Commission"
nd_cat_famine_displacement_commission_desc: "Handles food columns, shelter space, transport guards, and families pushed out of damaged districts."
nd_famine_displacement_open_food_columns: "Open Food Columns"
nd_famine_displacement_open_food_columns_desc: "Move food, water, and protected transport toward families displaced by disaster aftermaths."
nd_famine_displacement_open_food_columns_tt: "Relief columns advance recovery across active aftermath states and keep hunger from becoming another disaster."
nd_famine_displacement_shelter_refugee_columns_mission: "Shelter Refugee Columns"
nd_famine_displacement_shelter_refugee_columns_mission_desc: "Shelter columns must find heated rooms, clean water, and guarded rail space before exposure worsens."
nd_famine_displacement_shelter_refugee_columns_mission_success_tt: "The displacement columns reach shelter and recovery progress rises across active aftermath states."
nd_famine_displacement_shelter_refugee_columns_mission_failure_tt: "The columns fail to settle the displaced families. New civilian deaths are reported across the exposed settlements."
nd_cat_flood_relief_authority: "Flood Relief Authority"
nd_cat_flood_relief_authority_desc: "Manages river warnings, pump columns, flooded rail belts, contaminated wells, and displaced households."
nd_flood_reinforce_the_dikes: "Reinforce the Dikes"
nd_flood_reinforce_the_dikes_desc: "Move families above the low crossings, reinforce dikes, and stage pumps before the water reaches the rail belt."
nd_flood_reinforce_the_dikes_tt: "Evacuation and pump work reduce deaths and transport losses if the flood reaches the warned state."
nd_flood_deploy_pumping_columns: "Deploy Pumping Columns"
nd_flood_deploy_pumping_columns_desc: "Send pumping columns, bridge crews, and water inspectors into the flooded aftermath states."
nd_flood_deploy_pumping_columns_tt: "Engineer work drains flooded routes and can close the flood response once state recovery is complete."
nd_flood_clear_the_river_rail_belt_mission: "Clear the River Rail Belt"
nd_flood_clear_the_river_rail_belt_mission_desc: "Rail crews must clear the river belt before soaked embankments and bad water spread the disaster."
nd_flood_clear_the_river_rail_belt_mission_success_tt: "The river rail belt is passable again and matching flood aftermath states gain recovery progress."
nd_flood_clear_the_river_rail_belt_mission_failure_tt: "The river belt stays cut. New civilian deaths are reported along the flooded routes."
nd_cat_cyclone_emergency_command: "Cyclone Emergency Command"
nd_cat_cyclone_emergency_command_desc: "Coordinates coastal evacuation, port closure, island relief convoys, and harbor reopening after landfall."
nd_cyclone_order_coastal_evacuation: "Order Coastal Evacuation"
nd_cyclone_order_coastal_evacuation_desc: "Move people off exposed quays and islands while trains, trucks, and convoys can still move."
nd_cyclone_order_coastal_evacuation_tt: "Coastal evacuation lowers deaths and port losses if the cyclone reaches the warned state."
nd_cyclone_stage_island_relief_convoys: "Stage Island Relief Convoys"
nd_cyclone_stage_island_relief_convoys_desc: "Stage convoys, dock crews, and emergency fuel for islands and damaged harbors."
nd_cyclone_stage_island_relief_convoys_tt: "Relief convoys reopen coastal supply and can close the cyclone response once state recovery is complete."
nd_cyclone_reopen_the_main_harbor_mission: "Reopen the Main Harbor"
nd_cyclone_reopen_the_main_harbor_mission_desc: "Harbor crews must clear wreckage, restore berths, and reopen the main landing before shortages deepen."
nd_cyclone_reopen_the_main_harbor_mission_success_tt: "The harbor accepts relief shipping and matching cyclone aftermath states gain recovery progress."
nd_cyclone_reopen_the_main_harbor_mission_failure_tt: "The harbor remains choked by wreckage. New civilian deaths are reported along the stranded coast."
nd_cat_severe_storm_office: "Severe Storm Response Board"
nd_cat_severe_storm_office_desc: "Handles storm shelters, torn road lines, damaged airfields, debris clearance, and radio repair after a serious storm report."
nd_severe_storm_open_storm_shelters: "Open Storm Shelters"
nd_severe_storm_open_storm_shelters_desc: "Open cellars, schools, and station halls before the storm reaches the warned districts."
nd_severe_storm_open_storm_shelters_tt: "Shelter orders reduce civilian exposure and keep rescue traffic moving after impact."
nd_severe_storm_clear_debris_roads: "Clear Debris Roads"
nd_severe_storm_clear_debris_roads_desc: "Clear trees, roof debris, downed wire, and blocked road approaches in the storm aftermath."
nd_severe_storm_clear_debris_roads_tt: "Road clearance improves recovery and can close the storm response once state recovery is complete."
nd_severe_storm_restore_the_storm_cut_roads_mission: "Restore the Storm Cut Roads"
nd_severe_storm_restore_the_storm_cut_roads_mission_desc: "Work gangs must restore the storm-cut roads before isolated shelters run out of supplies."
nd_severe_storm_restore_the_storm_cut_roads_mission_success_tt: "The storm-cut roads reopen and matching storm aftermath states gain recovery progress."
nd_severe_storm_restore_the_storm_cut_roads_mission_failure_tt: "Roads remain blocked around the shelters. New civilian deaths are reported where relief cannot reach."
nd_cat_hail_damage_board: "Hail Damage Board"
nd_cat_hail_damage_board_desc: "Protects harvest stores, airfield surfaces, depot roofs, and rural rail sidings after destructive hail."
nd_hail_cover_harvest_stores: "Cover Harvest Stores"
nd_hail_cover_harvest_stores_desc: "Cover grain stacks, glasshouses, ammunition sheds, and exposed aircraft before the hail line arrives."
nd_hail_cover_harvest_stores_tt: "Covered stores and grounded aircraft reduce supply losses if hail hits the warned state."
nd_hail_repair_airfield_surfaces: "Repair Airfield Surfaces"
nd_hail_repair_airfield_surfaces_desc: "Patch airfield surfaces, hangar roofs, and crop depots damaged by hail."
nd_hail_repair_airfield_surfaces_tt: "Repair teams restore airfield and harvest access and can close the hail board once recovery is complete."
nd_hail_protect_the_harvest_line_mission: "Protect the Harvest Line"
nd_hail_protect_the_harvest_line_mission_desc: "Farm boards and airfield crews must protect the harvest line before food shipments slip."
nd_hail_protect_the_harvest_line_mission_success_tt: "The harvest line is protected and matching hail aftermath states gain recovery progress."
nd_hail_protect_the_harvest_line_mission_failure_tt: "Harvest traffic breaks down. New civilian deaths are reported in the exposed farming belt."
nd_cat_wind_damage_control: "Wind Damage Control"
nd_cat_wind_damage_control_desc: "Manages shelter bracing, rail signal repair, damaged roofs, toppled poles, and wind-cut supply lines."
nd_wind_reinforce_public_shelters: "Reinforce Public Shelters"
nd_wind_reinforce_public_shelters_desc: "Brace public shelters, secure station roofs, and move families away from exposed signal yards."
nd_wind_reinforce_public_shelters_tt: "Shelter bracing lowers civilian exposure and keeps rail staff alive if the wind front hits."
