l_english:
chaosx.events_log.evolution.type.natural_disasters: "Natural Disasters"
chaosx.events_log.window.event_details.natural_disasters: "Natural Disasters brings a season of delayed reports rather than a single accident. A season can strike one state, neighboring districts, several regions, or the wider world as the weather and the ground grow less predictable. Roads, factories, ports, railways, and towns can be damaged, civilian losses reach the casualty offices, and affected countries receive response work as the reports arrive."
chaosx.events_log.window.evolution_details.natural_disasters.title.stage_1: "Disaster Seasons Diversify"
chaosx.events_log.window.evolution_details.natural_disasters.title.stage_2: "The World Enters the Season"
chaosx.events_log.window.evolution_details.natural_disasters.title.stage_3: "Abnormal Disaster Seasons"
chaosx.events_log.window.evolution_details.natural_disasters.body.stage_1: "Disaster seasons broaden into more families and regions. Several states or countries can suffer at once, with follow-up hazards that make capitals, ports, supply hubs, and population centers matter."
chaosx.events_log.window.evolution_details.natural_disasters.body.stage_2: "The season can become worldwide. Reports arrive selectively while damage, displacement, famine risk, supply disruption, and reconstruction pressure appear across several continents."
chaosx.events_log.window.evolution_details.natural_disasters.body.stage_3: "High-chaos seasons can bring meteor showers, global rupture, massive eruptions, delayed tsunamis, and moving storm corridors. The disaster map and response offices track the largest warnings while the most shocking crises break into the world's broadcasts."
chaosx.events_log.window.evolution_details.natural_disasters.body.event_detail: "Natural Disasters tracks its growth through season behavior instead of one world-ending branch: broader regional seasons, global aftermath chains, and abnormal high-chaos families."
chaosx.nr13.1.t: "Natural Disasters"
chaosx.nr13.report.t: "Disaster Report"
chaosx.nr13.201.d: "A delayed field report from [natural_disaster_slot_1_report_state.GetName] confirms a §Y[natural_disaster_slot_1_report_state.GetNaturalDisasterStateFamilyName]§! impact. Rail crews, local authorities, and relief offices are still sorting which roads can carry traffic and which districts have been cut off.\n\nThe first recovery orders are waiting for crews, equipment, and transport before the situation hardens."
chaosx.nr13.202.d: "A delayed field report from [natural_disaster_slot_2_report_state.GetName] confirms a §Y[natural_disaster_slot_2_report_state.GetNaturalDisasterStateFamilyName]§! impact. Local offices describe damaged buildings, displaced civilians, and transport routes that need direct attention.\n\nThe response office has work ready before shortages and blocked roads turn temporary damage into a longer crisis."
chaosx.nr13.203.d: "A delayed field report from [natural_disaster_slot_3_report_state.GetName] confirms a §Y[natural_disaster_slot_3_report_state.GetNaturalDisasterStateFamilyName]§! impact. The first accounts are practical rather than dramatic: blocked roads, broken services, missing families, and commanders asking how much equipment can be spared.\n\nLocal recovery will move faster if relief columns arrive before the next weather report."
chaosx.nr13.204.d: "A delayed field report from [natural_disaster_slot_4_report_state.GetName] confirms a §Y[natural_disaster_slot_4_report_state.GetNaturalDisasterStateFamilyName]§! impact. Recovery officers are prioritizing access roads, food, water, and shelters before local production can be made reliable again.\n\nThe state needs practical orders more than announcements."
chaosx.nr13.205.d: "A delayed field report from [natural_disaster_slot_5_report_state.GetName] confirms a §Y[natural_disaster_slot_5_report_state.GetNaturalDisasterStateFamilyName]§! impact. The affected district is not waiting for a speech; it needs crews, fuel, support equipment, and orders that arrive before the next shortage.\n\nThe recovery queue is open while local authorities still have usable routes."
chaosx.nr13.206.d: "A delayed field report from [natural_disaster_slot_6_report_state.GetName] confirms a §Y[natural_disaster_slot_6_report_state.GetNaturalDisasterStateFamilyName]§! impact. Wires are down, local returns are incomplete, and the first trustworthy numbers are being carried by relief columns.\n\nA fast response can still keep the aftermath from spreading into supply and public-order trouble."
chaosx.nr13.207.d: "A delayed field report from [natural_disaster_slot_7_report_state.GetName] confirms a §Y[natural_disaster_slot_7_report_state.GetNaturalDisasterStateFamilyName]§! impact. Administrators report that the state can be stabilized, but not by paperwork alone.\n\nThe recovery offices are asking for crews that can work before the next delayed report arrives."
chaosx.nr13.208.d: "A delayed field report from [natural_disaster_slot_8_report_state.GetName] confirms a §Y[natural_disaster_slot_8_report_state.GetNaturalDisasterStateFamilyName]§! impact. The season has left another state with damaged services and urgent recovery work.\n\nThe affected country can still shorten the aftermath with direct relief and reconstruction orders."
chaosx.nr13.report.a: "Put the crews to work."

chaosx.nr13.news.skyfall.t: "Meteor Showers Strike the Earth"
chaosx.nr13.news.skyfall.d: "Night reports from several observatories no longer agree with the morning. Fire trails were seen over rail towns, rural depots, and coast roads before impacts tore open isolated districts.\n\nGovernments are calling the damage local until the next sky report proves otherwise."
chaosx.nr13.news.rupture.t: "The Ground Opens Across Continents"
chaosx.nr13.news.rupture.d: "Seismographs across the world have stopped looking like local instruments. Ruptures have split rail beds, harbor roads, and city districts in places that share no fault line on any official map.\n\nThe first ministries to receive the reports are asking whether the world itself has become unreliable."
chaosx.nr13.news.eruption.t: "Massive Eruption Darkens the Routes"
chaosx.nr13.news.eruption.d: "A plume large enough to change the day's color has risen over the affected region. Ash is falling over farms, rail lines, waterworks, and airfields, while evacuation columns move under a sky that will not clear.\n\nForeign observers are already revising their maps of the disaster."
chaosx.nr13.news.barrage.t: "Disaster Barrage"
chaosx.nr13.news.barrage.d: "Emergency wires from several regions describe a season that has stopped behaving like weather. Flood, fire, rupture, ash, and storm warnings crowd the calendar into a single violent dispatch.\n\nThe affected countries will remember it as one disaster season, even if the ground names every blow separately."
chaosx.nr13.news.season.t: "Natural Disaster Season Reported"
chaosx.nr13.news.season.d: "Foreign dispatches describe a delayed disaster season spreading through rail offices, relief columns, harbor authorities, and local clinics. The first reports name damaged roads, broken services, displaced families, and emergency crews waiting for weather and ground conditions to settle.\n\nThe affected governments are opening recovery work while later reports are still on the road."
chaosx.nr13.news.a: "Send the bulletin."

