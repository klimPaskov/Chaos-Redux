natural_disaster_warning_flood: "River gauges, rail dispatchers, and local police are moving people away from low crossings while pump crews fight for fuel and intact bridges."
natural_disaster_warning_cyclone_storm: "Coastal stations report a dangerous landfall window. Port authorities are closing exposed berths while evacuation trains wait for clearance."
natural_disaster_warning_corridor_storm: "Radio posts are tracking a moving storm path. Rail junctions, shelters, and airfields in the forecast belt have only a narrow window to prepare."
natural_disaster_warning_earthquake: "Seismographs show violent tremor readings and bridge inspectors have been ordered toward the most crowded districts."
natural_disaster_warning_rupture: "A regional stress front is moving across the ground. Engineers are checking dams, tunnels, and coastal warning posts."
natural_disaster_warning_tsunami: "Coastal observers have issued a wave warning. High ground shelters, port closures, and evacuation trains must move before the sea arrives."
natural_disaster_warning_volcano: "Observatories report ash pressure, slope movement, and unsafe water sources near the eruption zone."
natural_disaster_warning_massive_eruption: "Observatories report an eruption rhythm outside normal records. Ash, lahar routes, airfields, and food corridors all need immediate protection."
natural_disaster_warning_wildfire: "Fire weather stations report a dangerous front. Fuel, trucks, shelter space, and firebreak teams are being moved before the wind changes."
natural_disaster_warning_drought_famine: "Water boards are rationing reserves while field kitchens and rail depots prepare for crop stress and displaced families."
natural_disaster_warning_heat: "Hospitals and city authorities warn that water, rail, and shelter capacity may fail before the heat breaks."
natural_disaster_warning_winter: "Rail switches, mountain roads, fuel stocks, and refugee shelters are already under strain from the cold front."
natural_disaster_warning_dust_sandstorm: "Airfields are grounding flights, wells are being covered, and desert supply convoys are waiting for a safe route."
natural_disaster_warning_landslide_slope_collapse: "Slope watchers report unstable passes, tunnels, and valley roads. Rescue crews are moving before the ground closes."
natural_disaster_warning_skyfall_meteor: "Skywatch stations disagree on the pattern, but shelters and rail yards have been ordered to prepare for impacts."
natural_disaster_warning_generic: "Local authorities are preparing transport, shelters, and repair crews before the impact reaches the state."
natural_disaster_impact_flood: "Floodwater has cut roads, damaged rail, contaminated wells, and forced families into temporary shelters."
natural_disaster_impact_cyclone_storm: "Storm surge and wind have struck ports, airfields, homes, and supply roads across the landfall zone."
natural_disaster_impact_severe_storm: "Lightning, hail, wind, and debris have torn through airfields, harvest stores, roads, and radio lines."
natural_disaster_impact_corridor_storm: "The moving storm corridor has crossed the state, leaving broken rail junctions, damaged factories, and scattered shelter failures."
natural_disaster_impact_earthquake: "Rubble, cracked bridges, and damaged water lines have left rescue crews searching through collapsed districts."
natural_disaster_impact_rupture: "The rupture wave has broken rail belts, bridge spans, and city blocks across the stress front."
natural_disaster_impact_tsunami: "The wave has reached the coast, breaking harbor works, flooding homes, and isolating low districts."
natural_disaster_impact_volcano: "Ash and eruption debris have closed roads, damaged airfields, and left towns fighting contaminated water."
natural_disaster_impact_massive_eruption: "Eruption pulses and ash clouds have buried routes, shut airfields, and turned food transport into an emergency."
natural_disaster_impact_wildfire: "The fire front has burned roads, homes, depots, and fields while smoke slows rescue traffic."
natural_disaster_impact_drought_famine: "Water stress has turned into a public emergency, with food queues, damaged supply routes, and rising displacement."
natural_disaster_impact_heat: "The heat has overwhelmed shelters, hospitals, water routes, and rail timetables in the affected districts."
natural_disaster_impact_winter: "Frozen rail switches, blocked roads, and fuel shortages have left exposed communities in danger."
natural_disaster_impact_dust_sandstorm: "Dust has buried airfields, cut visibility, fouled wells, and slowed supply traffic across the state."
natural_disaster_impact_landslide_slope_collapse: "Slope failure has buried roads, damaged rail, isolated valleys, and trapped rescue teams behind unstable ground."
natural_disaster_impact_skyfall_meteor: "Airbursts and impacts have cratered rail, broken roofs, ignited fires, and overwhelmed local rescue crews."
natural_disaster_impact_generic: "Local reports confirm damage to transport, shelters, supply, and civilian life."

