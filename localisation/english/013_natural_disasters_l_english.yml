natural_disaster_restore_main_line_mission: "Restore the Main Line"
natural_disaster_restore_main_line_mission_desc: "Keep the damaged corridor controlled and supplied until crews can reopen the route."
natural_disaster_restore_main_line_failure_tt: "Rail recovery fails and the disaster aftermath strains stability."
natural_disaster_restore_main_line_success_tt: "Transport recovery crews reopen one active disaster corridor."
natural_disaster_mission_security_presence_required_tt: "A controlled, organized division must remain in the affected area."
natural_disaster_hold_dam_watch_mission: "Hold the Dam Watch"
natural_disaster_hold_dam_watch_mission_desc: "Keep engineers and local security on the floodworks until the threatened crossings, dams, and culverts are stable."
natural_disaster_hold_dam_watch_failure_tt: "The dam watch fails and the flood aftermath strains stability."
natural_disaster_hold_dam_watch_success_tt: "The dam watch holds and flood pressure is brought under control."
natural_disaster_keep_port_open_mission: "Keep the Port Open"
natural_disaster_keep_port_open_mission_desc: "Keep harbour crews, convoy relief, and emergency fuel moving until the storm or tsunami damage is under control."
natural_disaster_keep_port_open_failure_tt: "Port recovery fails and the coastline becomes a visible war-support liability."
natural_disaster_keep_port_open_success_tt: "Port response crews restore the damaged coast before the recovery window expires."
natural_disaster_feed_dry_belt_mission: "Feed the Dry Belt"
natural_disaster_feed_dry_belt_mission_desc: "Keep food, trains, and relief transport moving through drought-struck states."
natural_disaster_feed_dry_belt_failure_tt: "The dry belt is not supplied and stability suffers."
natural_disaster_feed_dry_belt_success_tt: "Food transport reduces crop-failure pressure in one affected state."
natural_disaster_guard_mountain_passes_mission: "Guard the Mountain Passes"
natural_disaster_guard_mountain_passes_mission_desc: "Keep the damaged pass watched, supplied, and patrolled until the landslide route is stable."
natural_disaster_guard_mountain_passes_failure_tt: "The pass watch fails and the mountain aftermath strains stability."
natural_disaster_guard_mountain_passes_success_tt: "Mountain-pass teams keep the route open until the aftermath is cleared."
natural_disaster_clear_ash_fields_mission: "Clear the Ash Fields"
natural_disaster_clear_ash_fields_mission_desc: "Keep crews and equipment ready until ash and crater damage can be cleared from fields, airstrips, and roads."
natural_disaster_clear_ash_fields_failure_tt: "Ash and panic linger, reducing war support."
natural_disaster_clear_ash_fields_success_tt: "Ash cleanup reduces one volcanic or meteor aftermath."
natural_disaster_rehouse_displaced_mission: "Rehouse the Displaced"
natural_disaster_rehouse_displaced_mission_desc: "Maintain shelters and medical routes until displaced civilians can leave temporary camps."
natural_disaster_rehouse_displaced_failure_tt: "Displacement pressure becomes a political liability."
natural_disaster_rehouse_displaced_success_tt: "Shelter work reduces population pressure in one affected state."
natural_disaster_survey_crater_belt_mission: "Survey the Crater Belt"
natural_disaster_survey_crater_belt_mission_desc: "Keep engineers and military survey teams in meteor-damaged districts until the crater belt is mapped."
natural_disaster_survey_crater_belt_failure_tt: "Unmapped crater damage feeds panic and war-support fatigue."
natural_disaster_survey_crater_belt_success_tt: "Survey teams reduce one meteor aftermath."

