natural_disaster_stabilization_mission: "Stabilize Disaster Zones"
natural_disaster_stabilization_mission_desc: "A disaster season has opened emergency recovery work. Finish the active state response before local systems settle into longer damage."
natural_disaster_stabilization_mission_success_tt: "All active disaster aftermath has been stabilized."
natural_disaster_stabilization_mission_failure_tt: "Unresolved disaster aftermath damages national stability and war support."
natural_disaster_reconstruction_mission: "Complete Reconstruction"
natural_disaster_reconstruction_mission_desc: "The first response is not enough. Reconstruction needs routes, depots, shelters, and replacement services before the season can be closed."
natural_disaster_reconstruction_mission_success_tt: "All active disaster aftermath has been reconstructed."
natural_disaster_reconstruction_mission_failure_tt: "Lingering disaster damage weakens national stability."

natural_disaster_earthquake_aftermath_state: "Earthquake Aftermath"
natural_disaster_earthquake_aftermath_state_desc: "Cracked roads, broken service lines, and collapsed buildings slow recovery until crews reopen the state."
natural_disaster_flood_aftermath_state: "Flood Aftermath"
natural_disaster_flood_aftermath_state_desc: "Waterlogged depots, damaged bridges, and displaced civilians strain supply and production."
natural_disaster_cyclone_aftermath_state: "Cyclone Aftermath"
natural_disaster_cyclone_aftermath_state_desc: "Landfall has damaged ports, roads, and shelters while inland flooding spreads the disruption."
natural_disaster_thunderstorm_aftermath_state: "Severe Storm Aftermath"
natural_disaster_thunderstorm_aftermath_state_desc: "Sudden storm damage has cut local services and forced emergency road clearance."
natural_disaster_hailstorm_aftermath_state: "Hailstorm Aftermath"
natural_disaster_hailstorm_aftermath_state_desc: "Ruined roofs, fields, and depots need practical repairs before the state can settle."
natural_disaster_wind_aftermath_state: "Wind Damage"
natural_disaster_wind_aftermath_state_desc: "Wind has torn through transport and shelter routes, leaving scattered but stubborn disruption."
natural_disaster_wildfire_aftermath_state: "Wildfire Aftermath"
natural_disaster_wildfire_aftermath_state_desc: "Fire lines, smoke, and evacuation losses drag down local production and recovery."
natural_disaster_drought_aftermath_state: "Drought Aftermath"
natural_disaster_drought_aftermath_state_desc: "Water shortage, failed distribution, and weakened rural routes threaten longer famine pressure."
natural_disaster_dust_aftermath_state: "Dust Storm Aftermath"
natural_disaster_dust_aftermath_state_desc: "Buried roads, fouled engines, and closed airfields keep the state from moving cleanly."
natural_disaster_blizzard_aftermath_state: "Blizzard Aftermath"
natural_disaster_blizzard_aftermath_state_desc: "Blocked passes and frozen rail work leave shelter and supply under pressure."
natural_disaster_heat_aftermath_state: "Heat Emergency"
natural_disaster_heat_aftermath_state_desc: "Heat pressure strains shelter, water, and workplaces without merging into the separate Heat Wave event."
natural_disaster_cold_aftermath_state: "Cold Emergency"
natural_disaster_cold_aftermath_state_desc: "Fuel, shelter, and frozen transport remain the state's first problems."
natural_disaster_landslide_aftermath_state: "Landslide Aftermath"
natural_disaster_landslide_aftermath_state_desc: "Buried roads and isolated settlements make recovery a route problem first."
natural_disaster_ashfall_aftermath_state: "Ashfall Aftermath"
natural_disaster_ashfall_aftermath_state_desc: "Ash has settled into water, engines, roofs, and airfields."
natural_disaster_tsunami_aftermath_state: "Tsunami Aftermath"
natural_disaster_tsunami_aftermath_state_desc: "Coastal districts, ports, and water systems have been damaged by the wave."
natural_disaster_skyfall_aftermath_state: "Skyfall Aftermath"
natural_disaster_skyfall_aftermath_state_desc: "Impact sites, fires, and damaged routes have made the state an abnormal recovery zone."
natural_disaster_global_rupture_aftermath_state: "Global Rupture Aftermath"
natural_disaster_global_rupture_aftermath_state_desc: "The ground has failed in ways local maps cannot explain."
natural_disaster_massive_eruption_aftermath_state: "Massive Eruption Aftermath"
natural_disaster_massive_eruption_aftermath_state_desc: "Ash, plume fallout, and evacuation pressure have turned ordinary logistics into crisis work."
natural_disaster_storm_corridor_warning_state: "Storm Corridor Warning"
natural_disaster_storm_corridor_warning_state_desc: "A moving corridor is being tracked. Evacuation and route work can still change the outcome."
natural_disaster_storm_corridor_aftermath_state: "Storm Corridor Aftermath"
natural_disaster_storm_corridor_aftermath_state_desc: "The corridor has crossed the state, leaving scattered damage along roads, rails, and settlements."
natural_disaster_recovery_mobilized_state: "Recovery Mobilized"
natural_disaster_recovery_mobilized_state_desc: "Rescue crews and service teams are working through the disaster zone."
natural_disaster_reconstruction_state: "Reconstruction Underway"
natural_disaster_reconstruction_state_desc: "Longer repairs are restoring routes, depots, and local services."

natural_disaster_aftermath_idea: "Disaster Aftermath"
natural_disaster_aftermath_idea_desc: "Disaster zones are pulling national repair crews, materials, and local administrations into emergency work."
natural_disaster_refugee_pressure_idea: "Refugee Pressure"
natural_disaster_refugee_pressure_idea_desc: "Evacuees and displaced families are pressing shelter, supply, and civil order beyond the damaged states."
natural_disaster_famine_pressure_idea: "Famine Pressure"
natural_disaster_famine_pressure_idea_desc: "Food, water, and rural distribution systems are under strain while the disaster season remains unresolved."
natural_disaster_broken_infrastructure_idea: "Broken Infrastructure"
natural_disaster_broken_infrastructure_idea_desc: "Damaged roads, rail lines, bridges, ports, and service depots are slowing national recovery work."
natural_disaster_recovery_mobilization_idea: "Disaster Recovery Mobilization"
natural_disaster_recovery_mobilization_idea_desc: "Engineers, medical columns, and supply crews are mobilized to hold the recovery line."

chaosx_super_event.67.t: "Foundations Out of Course"
chaosx_super_event.67.q: "\"All the foundations of the earth are out of course.\""
chaosx_super_event.67.a: "Its pillars tremble."
chaosx_super_event.67.d: "Ruptures are appearing across continents without waiting for old fault maps. Rail beds, harbors, and ministries are learning that the ground can fail everywhere at once."
chaosx_super_event.68.t: "Everything Is Ashes"
chaosx_super_event.68.q: "\"Its form resembled that of a pine tree ...\""
chaosx_super_event.68.a: "Everything is ashes."
chaosx_super_event.68.d: "A massive eruption has turned daylight into ashfall. Roads, water, airfields, and settlements now carry the same dark weight."
chaosx_super_event.69.t: "The Falling Stars"
chaosx_super_event.69.q: "\"Probably no celestial phenomenon ... was viewed with so much astonishment and fear by another class.\""
chaosx_super_event.69.a: "Falling Stars."
chaosx_super_event.69.d: "Meteor showers have crossed from astronomy into civil defense. Impact fires, broken rails, and frightened towns now sit inside the disaster season."
chaosx_super_event.70.t: "In the Whirlwind"
chaosx_super_event.70.q: "\"The LORD hath his way in the whirlwind and in the storm ...\""
chaosx_super_event.70.a: "Rage, blow!"
chaosx_super_event.70.d: "A moving storm corridor has become a map-visible hazard. Its path can be guessed, not trusted, and every state in its route must decide before the warning becomes debris."

