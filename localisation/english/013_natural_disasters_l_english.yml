chaosx.nr13.101.t: "Earthquakes Strike [Root.GetName]"
chaosx.nr13.101.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.101.a: "Begin the recovery work."
chaosx.nr13.201.t: "A Violent Earthquake Strikes [natural_disaster_news_state.GetName]"
chaosx.nr13.201.d: "Streets have split and heavy buildings have collapsed in [natural_disaster_news_state.GetName]. Rail traffic has stopped and crews are pulling survivors from the damaged districts."
chaosx.nr13.201.a: "The ground has not settled."
chaosx.nr13.102.t: "Floods Spread Across [Root.GetName]"
chaosx.nr13.102.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.102.a: "Begin the recovery work."
chaosx.nr13.202.t: "Floods Overwhelm [natural_disaster_news_state.GetName]"
chaosx.nr13.202.d: "Floodwater has swallowed roads and settlements in [natural_disaster_news_state.GetName], isolating communities and threatening disease as supplies run short."
chaosx.nr13.202.a: "The waters keep rising."
chaosx.nr13.103.t: "Cyclones Strike [Root.GetName]"
chaosx.nr13.103.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.103.a: "Begin the recovery work."
chaosx.nr13.203.t: "A Tropical Cyclone Devastates [natural_disaster_news_state.GetName]"
chaosx.nr13.203.d: "Violent wind and storm surge have battered [natural_disaster_news_state.GetName], closing harbors and driving coastal residents inland."
chaosx.nr13.203.a: "The coast counts its losses."
chaosx.nr13.104.t: "Windstorms Strike [Root.GetName]"
chaosx.nr13.104.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.104.a: "Begin the recovery work."
chaosx.nr13.204.t: "Destructive Winds Sweep [natural_disaster_news_state.GetName]"
chaosx.nr13.204.d: "Sustained destructive winds have damaged transport, airfields, and exposed settlements throughout [natural_disaster_news_state.GetName]."
chaosx.nr13.204.a: "The wind leaves a long scar."
chaosx.nr13.105.t: "Tornadoes Strike [Root.GetName]"
chaosx.nr13.105.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.105.a: "Begin the recovery work."
chaosx.nr13.205.t: "Tornadoes Tear Across [natural_disaster_news_state.GetName]"
chaosx.nr13.205.d: "Tornadoes have torn through towns in [natural_disaster_news_state.GetName], leaving roads blocked by wreckage and rescue crews searching collapsed buildings."
chaosx.nr13.205.a: "The tracks remain on the land."
chaosx.nr13.106.t: "Severe Storms Strike [Root.GetName]"
chaosx.nr13.106.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.106.a: "Begin the recovery work."
chaosx.nr13.206.t: "Violent Thunderstorms Strike [natural_disaster_news_state.GetName]"
chaosx.nr13.206.d: "Severe thunderstorms have damaged airfields, roads, and power lines in [natural_disaster_news_state.GetName]."
chaosx.nr13.206.a: "The storm cells keep coming."
chaosx.nr13.107.t: "Hailstorms Strike [Root.GetName]"
chaosx.nr13.107.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.107.a: "Begin the recovery work."
chaosx.nr13.207.t: "A Ruinous Hailstorm Hits [natural_disaster_news_state.GetName]"
chaosx.nr13.207.d: "Enormous hail has damaged aircraft, roofs, vehicles, and crops throughout [natural_disaster_news_state.GetName]."
chaosx.nr13.207.a: "The fields lie white with wreckage."
chaosx.nr13.108.t: "Blizzards Sweep [Root.GetName]"
chaosx.nr13.108.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.108.a: "Begin the recovery work."
chaosx.nr13.208.t: "A Blizzard Isolates [natural_disaster_news_state.GetName]"
chaosx.nr13.208.d: "Heavy snow and extreme wind have buried transport routes and isolated settlements across [natural_disaster_news_state.GetName]."
chaosx.nr13.208.a: "Winter closes the roads."
chaosx.nr13.109.t: "Bitter Cold Grips [Root.GetName]"
chaosx.nr13.109.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.109.a: "Begin the recovery work."
chaosx.nr13.209.t: "A Cold Wave Grips [natural_disaster_news_state.GetName]"
chaosx.nr13.209.d: "Extreme cold has strained fuel supplies and left settlements in [natural_disaster_news_state.GetName] struggling to heat homes and keep roads open."
chaosx.nr13.209.a: "The cold reaches indoors."
chaosx.nr13.110.t: "Extreme Heat Grips [Root.GetName]"
chaosx.nr13.110.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.110.a: "Begin the recovery work."
chaosx.nr13.210.t: "Extreme Heat Scorches [natural_disaster_news_state.GetName]"
chaosx.nr13.210.d: "Extreme heat has strained water supplies, hospitals, and factories throughout [natural_disaster_news_state.GetName]."
chaosx.nr13.210.a: "There is no relief after sunset."
chaosx.nr13.111.t: "Drought Grips [Root.GetName]"
chaosx.nr13.111.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.111.a: "Begin the recovery work."
chaosx.nr13.211.t: "Drought Deepens in [natural_disaster_news_state.GetName]"
chaosx.nr13.211.d: "Water sources and crops are failing across [natural_disaster_news_state.GetName], raising the prospect of famine and displacement."
chaosx.nr13.211.a: "The dry season has become a crisis."
chaosx.nr13.112.t: "Dust Storms Sweep [Root.GetName]"
chaosx.nr13.112.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.112.a: "Begin the recovery work."
chaosx.nr13.212.t: "A Vast Dust Storm Crosses [natural_disaster_news_state.GetName]"
chaosx.nr13.212.d: "Dense dust has darkened [natural_disaster_news_state.GetName], closing transport and threatening health, machinery, and water supplies."
chaosx.nr13.212.a: "The horizon has disappeared."
chaosx.nr13.113.t: "Wildfires Spread Across [Root.GetName]"
chaosx.nr13.113.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.113.a: "Begin the recovery work."
chaosx.nr13.213.t: "Wildfires Consume [natural_disaster_news_state.GetName]"
chaosx.nr13.213.d: "Wildfires are burning through woods, farms, and villages in [natural_disaster_news_state.GetName]. Smoke has closed roads and crews are cutting firebreaks around the nearest towns."
chaosx.nr13.213.a: "Smoke covers the roads."
chaosx.nr13.114.t: "Landslides Strike [Root.GetName]"
chaosx.nr13.114.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.114.a: "Begin the recovery work."
chaosx.nr13.214.t: "Landslides Block [natural_disaster_news_state.GetName]"
chaosx.nr13.214.d: "Rockfalls and dry landslides have buried routes and settlements in [natural_disaster_news_state.GetName]."
chaosx.nr13.214.a: "The slopes are still moving."
chaosx.nr13.115.t: "Mudslides Strike [Root.GetName]"
chaosx.nr13.115.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.115.a: "Begin the recovery work."
chaosx.nr13.215.t: "Mudslides Devastate [natural_disaster_news_state.GetName]"
chaosx.nr13.215.d: "Rain-soaked slopes have collapsed into valleys and settlements across [natural_disaster_news_state.GetName]."
chaosx.nr13.215.a: "Water and earth move together."
chaosx.nr13.116.t: "Volcanoes Erupt in [Root.GetName]"
chaosx.nr13.116.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.116.a: "Begin the recovery work."
chaosx.nr13.216.t: "A Volcano Erupts in [natural_disaster_news_state.GetName]"
chaosx.nr13.216.d: "Ash columns, falling rock, and lava have forced evacuations throughout [natural_disaster_news_state.GetName]."
chaosx.nr13.216.a: "The mountain is awake."
chaosx.nr13.117.t: "Ash Covers [Root.GetName]"
chaosx.nr13.117.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.117.a: "Begin the recovery work."
chaosx.nr13.217.t: "Heavy Ashfall Covers [natural_disaster_news_state.GetName]"
chaosx.nr13.217.d: "Volcanic ash has darkened [natural_disaster_news_state.GetName], closing airfields, fouling water, and covering fields. People struggle to breathe in the thick dust."
chaosx.nr13.217.a: "Daylight fades beneath the plume."
chaosx.nr13.118.t: "Volcanic Mudflows Strike [Root.GetName]"
chaosx.nr13.118.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.118.a: "Begin the recovery work."
chaosx.nr13.218.t: "A Volcanic Mudflow Strikes [natural_disaster_news_state.GetName]"
chaosx.nr13.218.d: "A lahar has swept through valleys in [natural_disaster_news_state.GetName], burying routes and communities beneath ash and debris."
chaosx.nr13.218.a: "The valleys carried the mountain."
chaosx.nr13.119.t: "Tsunamis Strike [Root.GetName]"
chaosx.nr13.119.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.119.a: "Begin the recovery work."
chaosx.nr13.219.t: "A Tsunami Strikes [natural_disaster_news_state.GetName]"
chaosx.nr13.219.d: "Powerful waves have inundated ports and coastal settlements throughout [natural_disaster_news_state.GetName]."
chaosx.nr13.219.a: "The sea crossed every boundary."
chaosx.nr13.120.t: "Storm Surges Strike [Root.GetName]"
chaosx.nr13.120.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.120.a: "Begin the recovery work."
chaosx.nr13.220.t: "Storm Surge Inundates [natural_disaster_news_state.GetName]"
chaosx.nr13.220.d: "Coastal water driven by a severe storm has flooded ports and low districts across [natural_disaster_news_state.GetName]."
chaosx.nr13.220.a: "The tide came with the storm."
chaosx.nr13.121.t: "Meteors Fall Near [Root.GetName]"
chaosx.nr13.121.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.121.a: "Begin the recovery work."
chaosx.nr13.221.t: "[natural_disaster_news_state.GetNaturalDisasterMeteorNewsTitle]"
chaosx.nr13.221.d: "[natural_disaster_news_state.GetNaturalDisasterMeteorNewsDescription]"
chaosx.nr13.221.a: "The sky left a wound."
chaosx.nr13.122.t: "Meteor Fragments Fall Across [Root.GetName]"
chaosx.nr13.122.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.122.a: "Begin the recovery work."
chaosx.nr13.222.t: "A Meteor Shower Rakes [natural_disaster_news_state.GetName]"
chaosx.nr13.222.d: "Meteor fragments have fallen across [natural_disaster_news_state.GetName]. Rescue crews are searching the impact sites, and weather stations recorded explosions high in the atmosphere."
chaosx.nr13.222.a: "The fragments are still being counted."
chaosx.nr13.123.t: "Rupture Waves Strike [Root.GetName]"
chaosx.nr13.123.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.123.a: "Begin the recovery work."
chaosx.nr13.223.t: "The Earth Tears Open at [natural_disaster_news_state.GetName]"
chaosx.nr13.223.d: "A vast wave of tremors has devastated [natural_disaster_news_state.GetName], splitting roads and breaking railways along the faults."
chaosx.nr13.223.a: "The fracture does not end at the border."
chaosx.nr13.124.t: "Great Eruptions Strike [Root.GetName]"
chaosx.nr13.124.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.124.a: "Begin the recovery work."
chaosx.nr13.224.t: "A Massive Eruption Devastates [natural_disaster_news_state.GetName]"
chaosx.nr13.224.d: "A colossal eruption has destroyed the vent region of [natural_disaster_news_state.GetName] and cast ash across neighboring lands."
chaosx.nr13.224.a: "The plume climbs beyond the weather."
chaosx.nr13.125.t: "Storm Belts Cross [Root.GetName]"
chaosx.nr13.125.d: "[This.GetNaturalDisasterReportBatchSummary]"
chaosx.nr13.125.a: "Begin the recovery work."
chaosx.nr13.225.t: "A Storm Corridor Cuts Through [natural_disaster_news_state.GetName]"
chaosx.nr13.225.d: "A moving belt of destructive storms has struck [natural_disaster_news_state.GetName], leaving flooded roads, scattered wreckage, and damaged settlements along its path."
chaosx.nr13.225.a: "The storm belt is still moving."
