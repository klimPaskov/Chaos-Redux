super_event.67.t: "The Unquiet Earth"
super_event.67.q: "\"Nor can nature be commanded except by being obeyed.\""
super_event.67.a: "Not single spies."
super_event.67.d: "Disaster reports no longer describe isolated weather or unlucky ground. The world has entered an abnormal age of quakes, ash, sea withdrawals, skyfall, and storms that move like campaigns."
