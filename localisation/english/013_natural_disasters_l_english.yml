l_english:
natural_disaster_seismic_disruption: "Seismic Rupture Damage"
natural_disaster_warning_civilian_burden: "Emergency Civilian Mobilization"
natural_disaster_warning_civilian_burden_desc: "Factories, communications offices, and construction crews have been reserved for overlapping disaster warnings. Each preparation releases its burden after fourteen days."
natural_disaster_seismic_disruption_desc: "Broken ground, unstable structures, damaged routes, and disrupted extraction obstruct local operations."
natural_disaster_water_coastal_disruption: "Flooded Routes and Harbors"
natural_disaster_water_coastal_disruption_desc: "Waterlogged roads, damaged embankments, and blocked coastal facilities constrain supply and repair work."
natural_disaster_storm_weather_disruption: "Storm-Damaged Districts"
natural_disaster_storm_weather_disruption_desc: "Wind, hail, and debris slow movement, damage equipment, and expose recovery crews."
natural_disaster_winter_temperature_disruption: "Frozen Supply Network"
natural_disaster_winter_temperature_disruption_desc: "Cold, ice, and snow isolate settlements and consume fuel while routes remain dangerous."
natural_disaster_fire_drought_disruption: "Scorched and Water-Starved Land"
natural_disaster_fire_drought_disruption_desc: "Fire or prolonged dryness has damaged stores, production, resources, and local supply."
natural_disaster_mass_movement_disruption: "Buried Transport Corridors"
natural_disaster_mass_movement_disruption_desc: "Collapsed slopes and debris fields have severed roads, rails, and access to damaged communities."
natural_disaster_volcanic_ash_disruption: "Volcanic Ash and Debris"
natural_disaster_volcanic_ash_disruption_desc: "Ash, ejecta, and unstable volcanic ground foul machinery, close routes, and delay reconstruction."
natural_disaster_dust_sand_disruption: "Dust-Choked Logistics"
natural_disaster_dust_sand_disruption_desc: "Dense dust fouls engines, contaminates stores, and makes movement and resource work hazardous."
natural_disaster_abnormal_disruption: "Abnormal Devastation Zone"
natural_disaster_abnormal_disruption_desc: "Damage exceeds ordinary disaster patterns, overwhelming supply, movement, resources, and repair capacity at once."
natural_disaster.report.clause.empty: ""
natural_disaster.report.summary: "§YImpact record: sequence [?natural_disaster_report_snapshot_sequence_id|0], segment [?natural_disaster_report_snapshot_segment|0], filed [?natural_disaster_report_snapshot_report_date.GetDateStringNoHour]§!\n[This.GetNaturalDisasterReportOriginClause][This.GetNaturalDisasterReportSeverityClause] [This.GetNaturalDisasterReportHumanClause]\n\n§YConfirmed damage§!: [This.GetNaturalDisasterReportTransportDamageClause][This.GetNaturalDisasterReportIndustryDamageClause][This.GetNaturalDisasterReportPortDamageClause][This.GetNaturalDisasterReportAirDamageClause][This.GetNaturalDisasterReportResourceDamageClause][This.GetNaturalDisasterReportShelterDamageClause][This.GetNaturalDisasterReportNoDamageClause]\n\n[This.GetNaturalDisasterReportWarningClause]\n[This.GetNaturalDisasterReportFollowupClause]\n[This.GetNaturalDisasterReportRecoveryClause]"
natural_disaster.report.origin.land_impact: "§YSkyfall origin§!: a land impact was confirmed.\n"
natural_disaster.report.origin.atmospheric_fragmentation: "§YSkyfall origin§!: the object fragmented in the atmosphere.\n"
natural_disaster.report.origin.skyfire: "§YSkyfall origin§!: atmospheric fragmentation produced a moving skyfire hail front.\n"
natural_disaster.report.origin.ocean_impact: "§YSkyfall origin§!: an ocean impact was confirmed in the [This.GetNaturalDisasterReportPathBasin]. The named coastal state is the nearest observation point, not a land crater.\n"
natural_disaster.path_basin.pacific: "Pacific tsunami basin"
natural_disaster.path_basin.indian: "Indian Ocean tsunami basin"
natural_disaster.path_basin.atlantic: "Atlantic tsunami basin"
natural_disaster.path_basin.mediterranean: "Mediterranean tsunami basin"
natural_disaster.path_basin.black_sea: "Black Sea tsunami basin"
natural_disaster.path_basin.unresolved: "unresolved path basin"
natural_disaster.report.meteor_title.land: "A Crater Opens in [This.GetName]"
natural_disaster.report.meteor_title.ocean: "An Ocean Impact Is Observed Near [This.GetName]"
natural_disaster.news.meteor_title.land: "A Meteor Strikes [This.GetName]"
natural_disaster.news.meteor_title.ocean: "A Meteor Strikes the Sea Near [This.GetName]"
natural_disaster.news.meteor_desc.land: "A meteor impact has opened a destructive crater in [This.GetName], damaging settlements and industry far beyond the point of impact."
natural_disaster.news.meteor_desc.ocean: "A meteor has struck the ocean beyond [This.GetName]. Coastal stations report the flash and pressure wave while tsunami forecasts trace the locked basin. No land crater has been recorded in the named state."
natural_disaster.report.severity.local: "The impact is assessed as §Ylocal§!."
natural_disaster.report.severity.severe: "The impact is assessed as §Osevere§!."
natural_disaster.report.severity.regional: "The impact is assessed as §Rregional§!."
natural_disaster.report.severity.catastrophic: "The impact is assessed as §Rcatastrophic§!."
natural_disaster.report.severity.abnormal: "The impact is assessed as §Rabnormal§!."
natural_disaster.report.human.confirmed: "Confirmed deaths in this impact: §R[?natural_disaster_report_snapshot_deaths|0]§!."
natural_disaster.report.human.none_confirmed: "No deaths have been confirmed in the first assessment."
natural_disaster.report.damage.transport: " Transport and rail systems;"
natural_disaster.report.damage.industry: " factories and industrial sites;"
natural_disaster.report.damage.ports: " ports and coastal facilities;"
natural_disaster.report.damage.air: " airfields and aviation facilities;"
natural_disaster.report.damage.resources: " extraction, storage, and resource sites;"
natural_disaster.report.damage.shelter: " homes, shelters, and public buildings;"
natural_disaster.report.damage.none: " no major building system was confirmed damaged."
natural_disaster.report.warning.matched: "A timely preparation matched the recorded follow-up hazard and reduced its expected consequence."
natural_disaster.report.warning.prepared: "A timely preparation protected its intended target, but it did not suppress the independently recorded follow-up hazard."
natural_disaster.report.warning.late: "Preparations were ordered but were not in place before impact."
natural_disaster.report.warning.none: "No preparation was completed before impact."
natural_disaster.report.followup.linked: "§YForecast follow-up§!: [This.GetNaturalDisasterReportFollowupRoute] is scheduled toward §Y[natural_disaster_report_linked_state.GetName]§! on §Y[?natural_disaster_report_snapshot_followup_due_date.GetDateStringNoHour]§!."
natural_disaster.report.followup.local: "§YForecast follow-up§!: [This.GetNaturalDisasterReportFollowupRoute] is scheduled in §Y[This.GetName]§! on §Y[?natural_disaster_report_snapshot_followup_due_date.GetDateStringNoHour]§!."
natural_disaster.report.followup.none: "No delayed follow-up is scheduled from this impact."
natural_disaster.report.recovery.warning: "Recovery remains at the warning stage."
natural_disaster.report.recovery.rescue: "Early rescue is active; search, shelter, medical access, and one open route are the immediate needs."
natural_disaster.report.recovery.stabilization: "Stabilization is active; supply, water, transport, and the recorded chain risk require attention."
natural_disaster.report.recovery.reconstruction: "Late reconstruction is active; permanent repairs and resilience work remain unfinished."
natural_disaster.report.recovery.closed: "The recorded recovery card has been closed."
chaosx.nr13.101.t: "Faults Break Beneath [natural_disaster_report_state.GetName]"
chaosx.nr13.101.d: "An earthquake has struck [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.101.a: "Keep the search lines moving."
chaosx.nr13.201.t: "A Violent Earthquake Strikes [natural_disaster_news_state.GetName]"
chaosx.nr13.201.d: "Streets have split and heavy buildings have collapsed in [natural_disaster_news_state.GetName]. Rail traffic is halted while survivors are pulled from damaged districts."
chaosx.nr13.201.a: "The ground has not settled."
chaosx.nr13.102.t: "Floodwater Engulfs [natural_disaster_report_state.GetName]"
chaosx.nr13.102.d: "Floodwater has spread across [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.102.a: "Move boats, pumps, and clean water."
chaosx.nr13.202.t: "Floods Overwhelm [natural_disaster_news_state.GetName]"
chaosx.nr13.202.d: "Floodwater has swallowed roads and settlements in [natural_disaster_news_state.GetName], isolating communities and threatening disease as supplies run short."
chaosx.nr13.202.a: "The waters keep rising."
chaosx.nr13.103.t: "The Cyclone Crosses [natural_disaster_report_state.GetName]"
chaosx.nr13.103.d: "A tropical cyclone has crossed [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.103.a: "Reopen one lifeline from the coast."
chaosx.nr13.203.t: "A Tropical Cyclone Devastates [natural_disaster_news_state.GetName]"
chaosx.nr13.203.d: "Violent wind and storm surge have battered [natural_disaster_news_state.GetName], closing harbors and scattering coastal communities across the interior."
chaosx.nr13.203.a: "The coast counts its losses."
chaosx.nr13.104.t: "Wind Damage Across [natural_disaster_report_state.GetName]"
chaosx.nr13.104.d: "A destructive wind field has crossed [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.104.a: "Secure the routes beneath the gale."
chaosx.nr13.204.t: "Destructive Winds Sweep [natural_disaster_news_state.GetName]"
chaosx.nr13.204.d: "Sustained destructive winds have damaged transport, airfields, and exposed settlements throughout [natural_disaster_news_state.GetName]."
chaosx.nr13.204.a: "The wind leaves a long scar."
chaosx.nr13.105.t: "Tornado Tracks Cut Through [natural_disaster_report_state.GetName]"
chaosx.nr13.105.d: "Several tornado tracks have crossed [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.105.a: "Follow every broken path."
chaosx.nr13.205.t: "Tornadoes Tear Across [natural_disaster_news_state.GetName]"
chaosx.nr13.205.d: "Multiple tornado tracks have cut through [natural_disaster_news_state.GetName], destroying towns along a moving corridor and complicating rescue work."
chaosx.nr13.205.a: "The tracks remain on the land."
chaosx.nr13.106.t: "Severe Storms Batter [natural_disaster_report_state.GetName]"
chaosx.nr13.106.d: "A line of severe thunderstorms has crossed [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.106.a: "Ground the aircraft and clear the roads."
chaosx.nr13.206.t: "Violent Thunderstorms Strike [natural_disaster_news_state.GetName]"
chaosx.nr13.206.d: "A concentrated line of severe thunderstorms has damaged airfields, roads, and power networks in [natural_disaster_news_state.GetName]."
chaosx.nr13.206.a: "The storm line rolls onward."
chaosx.nr13.107.t: "Hail Shatters [natural_disaster_report_state.GetName]"
chaosx.nr13.107.d: "A severe hailstorm has crossed [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.107.a: "Cover the wounded and count the harvest."
chaosx.nr13.207.t: "A Ruinous Hailstorm Hits [natural_disaster_news_state.GetName]"
chaosx.nr13.207.d: "Enormous hail has damaged aircraft, roofs, vehicles, and crops throughout [natural_disaster_news_state.GetName]."
chaosx.nr13.207.a: "The fields lie white with wreckage."
chaosx.nr13.108.t: "The Blizzard Buries [natural_disaster_report_state.GetName]"
chaosx.nr13.108.d: "A blizzard has settled over [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.108.a: "Get heat and food through the drifts."
chaosx.nr13.208.t: "A Blizzard Isolates [natural_disaster_news_state.GetName]"
chaosx.nr13.208.d: "Heavy snow and extreme wind have buried transport routes and isolated settlements across [natural_disaster_news_state.GetName]."
chaosx.nr13.208.a: "Winter closes the roads."
chaosx.nr13.109.t: "Deadly Cold Settles Over [natural_disaster_report_state.GetName]"
chaosx.nr13.109.d: "A prolonged cold wave has reached [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.109.a: "Keep the shelters warm."
chaosx.nr13.209.t: "A Cold Wave Grips [natural_disaster_news_state.GetName]"
chaosx.nr13.209.d: "A sustained wave of extreme cold has strained fuel, shelter, and transport across [natural_disaster_news_state.GetName]."
chaosx.nr13.209.a: "The cold reaches indoors."
chaosx.nr13.110.t: "Lethal Heat Across [natural_disaster_report_state.GetName]"
chaosx.nr13.110.d: "A sustained heat wave has reached [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.110.a: "Open shade, water, and night shifts."
chaosx.nr13.210.t: "Extreme Heat Scorches [natural_disaster_news_state.GetName]"
chaosx.nr13.210.d: "Record heat has strained water supplies, hospitals, and industry throughout [natural_disaster_news_state.GetName]."
chaosx.nr13.210.a: "There is no relief after sunset."
chaosx.nr13.111.t: "The Wells Fail in [natural_disaster_report_state.GetName]"
chaosx.nr13.111.d: "A deep drought has taken hold in [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.111.a: "Bring water before hunger follows."
chaosx.nr13.211.t: "Drought Deepens in [natural_disaster_news_state.GetName]"
chaosx.nr13.211.d: "Water sources and crops are failing across [natural_disaster_news_state.GetName], raising the prospect of famine and displacement."
chaosx.nr13.211.a: "The dry season has become a crisis."
chaosx.nr13.112.t: "Dust Buries the Routes of [natural_disaster_report_state.GetName]"
chaosx.nr13.112.d: "A dense dust and sandstorm has crossed [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.112.a: "Clear filters, tracks, and wells."
chaosx.nr13.212.t: "A Vast Dust Storm Crosses [natural_disaster_news_state.GetName]"
chaosx.nr13.212.d: "Dense dust has darkened [natural_disaster_news_state.GetName], closing transport and threatening health, machinery, and water supplies."
chaosx.nr13.212.a: "The horizon has disappeared."
chaosx.nr13.113.t: "Firefronts Advance Through [natural_disaster_report_state.GetName]"
chaosx.nr13.113.d: "A wildfire front is moving through [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.113.a: "Hold the firebreaks."
chaosx.nr13.213.t: "Wildfires Consume [natural_disaster_news_state.GetName]"
chaosx.nr13.213.d: "Several firefronts are advancing across [natural_disaster_news_state.GetName], forcing evacuations and threatening industry and transport."
chaosx.nr13.213.a: "Smoke covers the roads."
chaosx.nr13.114.t: "Slopes Collapse in [natural_disaster_report_state.GetName]"
chaosx.nr13.114.d: "Dry slopes and fractured rock have collapsed in [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.114.a: "Clear one safe path beneath the slopes."
chaosx.nr13.214.t: "Landslides Block [natural_disaster_news_state.GetName]"
chaosx.nr13.214.d: "Rockfalls and dry landslides have buried routes and settlements in [natural_disaster_news_state.GetName]."
chaosx.nr13.214.a: "The hills are still moving."
chaosx.nr13.115.t: "Mudslides Sweep [natural_disaster_report_state.GetName]"
chaosx.nr13.115.d: "Saturated ground has released mud and debris through [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.115.a: "Reach the valleys before the mud sets."
chaosx.nr13.215.t: "Mudslides Devastate [natural_disaster_news_state.GetName]"
chaosx.nr13.215.d: "Rain-soaked slopes have collapsed into valleys and settlements across [natural_disaster_news_state.GetName]."
chaosx.nr13.215.a: "Water and earth move together."
chaosx.nr13.116.t: "The Volcano Erupts Over [natural_disaster_report_state.GetName]"
chaosx.nr13.116.d: "A volcano has erupted in [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.116.a: "Keep every valley route open."
chaosx.nr13.216.t: "A Volcano Erupts in [natural_disaster_news_state.GetName]"
chaosx.nr13.216.d: "Ash columns, falling rock, and lava have forced evacuations throughout [natural_disaster_news_state.GetName]."
chaosx.nr13.216.a: "The mountain is awake."
chaosx.nr13.117.t: "Ash Darkens [natural_disaster_report_state.GetName]"
chaosx.nr13.117.d: "Heavy volcanic ash has covered [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.117.a: "Sweep roofs, filters, and runways."
chaosx.nr13.217.t: "Heavy Ashfall Covers [natural_disaster_news_state.GetName]"
chaosx.nr13.217.d: "Volcanic ash has darkened [natural_disaster_news_state.GetName], closing airfields and threatening water, crops, and respiratory health."
chaosx.nr13.217.a: "Daylight fades beneath the plume."
chaosx.nr13.118.t: "A Lahar Descends on [natural_disaster_report_state.GetName]"
chaosx.nr13.118.d: "A volcanic mudflow has descended through [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.118.a: "Get above the valley floors."
chaosx.nr13.218.t: "A Volcanic Mudflow Strikes [natural_disaster_news_state.GetName]"
chaosx.nr13.218.d: "A lahar has swept through valleys in [natural_disaster_news_state.GetName], burying routes and communities beneath ash and debris."
chaosx.nr13.218.a: "The valleys carried the mountain."
chaosx.nr13.119.t: "The Sea Reaches [natural_disaster_report_state.GetName]"
chaosx.nr13.119.d: "A tsunami has reached the coast of [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.119.a: "Keep the coast empty and the high roads open."
chaosx.nr13.219.t: "A Tsunami Strikes [natural_disaster_news_state.GetName]"
chaosx.nr13.219.d: "Powerful waves have inundated ports and coastal settlements throughout [natural_disaster_news_state.GetName]."
chaosx.nr13.219.a: "The sea crossed every boundary."
chaosx.nr13.120.t: "The Surge Floods [natural_disaster_report_state.GetName]"
chaosx.nr13.120.d: "A storm surge has overtopped the coast of [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.120.a: "Hold the inland route above the water."
chaosx.nr13.220.t: "Storm Surge Inundates [natural_disaster_news_state.GetName]"
chaosx.nr13.220.d: "Coastal water driven by a severe storm has flooded ports and low districts across [natural_disaster_news_state.GetName]."
chaosx.nr13.220.a: "The tide came with the storm."
chaosx.nr13.121.t: "[natural_disaster_report_state.GetNaturalDisasterMeteorReportTitle]"
chaosx.nr13.121.d: "An object from the sky has been recorded near [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.121.a: "Search beyond the crater rim."
chaosx.nr13.221.t: "[natural_disaster_news_state.GetNaturalDisasterMeteorNewsTitle]"
chaosx.nr13.221.d: "[natural_disaster_news_state.GetNaturalDisasterMeteorNewsDescription]"
chaosx.nr13.221.a: "The sky left a wound."
chaosx.nr13.122.t: "Impacts Fall Across [natural_disaster_report_state.GetName]"
chaosx.nr13.122.d: "Multiple fragments have fallen across [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.122.a: "Mark every fall and divide the teams."
chaosx.nr13.222.t: "A Meteor Shower Rakes [natural_disaster_news_state.GetName]"
chaosx.nr13.222.d: "Multiple fragments have crossed the sky above [natural_disaster_news_state.GetName]. Impact teams and weather stations are tracking each confirmed fall and atmospheric burst separately."
chaosx.nr13.222.a: "More lights are still falling."
chaosx.nr13.123.t: "Rupture Waves Tear Through [natural_disaster_report_state.GetName]"
chaosx.nr13.123.d: "An abnormal rupture wave has crossed [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.123.a: "Triage the routes that still exist."
chaosx.nr13.223.t: "The Earth Tears Open at [natural_disaster_news_state.GetName]"
chaosx.nr13.223.d: "An abnormal rupture wave has devastated [natural_disaster_news_state.GetName] and continues along connected fault systems."
chaosx.nr13.223.a: "The fracture does not end at the border."
chaosx.nr13.124.t: "The Great Plume Rises Over [natural_disaster_report_state.GetName]"
chaosx.nr13.124.d: "A massive eruption has begun in [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.124.a: "Abandon the vent and hold the distant routes."
chaosx.nr13.224.t: "A Massive Eruption Devastates [natural_disaster_news_state.GetName]"
chaosx.nr13.224.d: "A colossal eruption has destroyed the vent region of [natural_disaster_news_state.GetName] and cast ash across neighboring lands."
chaosx.nr13.224.a: "The plume climbs beyond the weather."
chaosx.nr13.125.t: "The Corridor Reaches [natural_disaster_report_state.GetName]"
chaosx.nr13.125.d: "A moving corridor of violent storms has crossed [natural_disaster_report_state.GetName].\n\n[natural_disaster_report_state.GetNaturalDisasterReportSummary]"
chaosx.nr13.125.a: "Warn the states ahead of the track."
chaosx.nr13.225.t: "A Storm Corridor Cuts Through [natural_disaster_news_state.GetName]"
chaosx.nr13.225.d: "A mobile corridor of destructive storms has struck [natural_disaster_news_state.GetName] and continues toward neighboring regions."
chaosx.nr13.225.a: "The path is still moving."
