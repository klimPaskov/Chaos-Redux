natural_disaster_severity_scenario_maximum: "Scenario Maximum"
natural_disaster_stage_baseline: "Local Disaster Report"
natural_disaster_stage_varied_local: "Varied Local Disasters"
natural_disaster_stage_regional_systems: "Regional Disaster Systems"
natural_disaster_stage_chained_aftermaths: "Disaster Chains"
natural_disaster_stage_abnormal_age: "Abnormal Disaster Age"
natural_disaster_response_office_warning_status: "Warnings active. Transport, evacuation, floodworks, port, airfield, rationing, inspection, and observatory responses can reduce the next impact."
natural_disaster_response_office_recovery_status: "Recovery active. Affected states need engineers, medical columns, rail crews, convoys, shelters, ash crews, fuel, and labour."
natural_disaster_response_office_scenario_status: "Disaster Barrage active. Multiple incidents are being compressed into a short window."
natural_disaster_response_office_idle_status: "No active disaster file."

natural_disaster_response_office: "Disaster Response Office"
natural_disaster_response_office_desc: "[GetNaturalDisasterResponseOfficeHeader]"
natural_disaster_preposition_relief_trains: "Pre-Position Relief Trains"
natural_disaster_preposition_relief_trains_desc: "Move engineers, grain, tents, and medical stores toward [FROM.GetName] before the warning becomes an impact report."
natural_disaster_preposition_relief_trains_tt: "Prepared relief trains reduce casualties and shorten recovery in the targeted warned state."
natural_disaster_evacuate_industrial_districts: "Evacuate Industrial Districts"
natural_disaster_evacuate_industrial_districts_desc: "Move workers and machinery out of [FROM.GetName] while there is still time."
natural_disaster_evacuate_industrial_districts_tt: "Evacuation reduces population and factory losses, but strains public confidence."
natural_disaster_reinforce_flood_barriers: "Reinforce Flood Barriers"
natural_disaster_reinforce_flood_barriers_desc: "Send pumps, labour teams, and engineers to bridges, dams, and low crossings around [FROM.GetName]."
natural_disaster_reinforce_flood_barriers_tt: "Flood, storm-surge, and dam-strain impacts are blunted in the targeted warned state."
natural_disaster_close_vulnerable_ports: "Close Vulnerable Ports"
natural_disaster_close_vulnerable_ports_desc: "Move ships, fuel, and harbour stores away from [FROM.GetName] before the coast turns violent."
natural_disaster_close_vulnerable_ports_tt: "Port preparation reduces coastal and tsunami damage at the cost of convoys and fuel."
natural_disaster_move_air_wings_inland: "Move Air Wings Inland"
natural_disaster_move_air_wings_inland_desc: "Disperse aircraft, crews, fuel carts, and spare parts away from [FROM.GetName] before ash, storm, or shock damage reaches the airfield."
natural_disaster_move_air_wings_inland_tt: "Airbase preparation reduces the danger to airfields and counts as mitigation for the warned state."
natural_disaster_grain_and_water_rationing: "Grain and Water Rationing"
natural_disaster_grain_and_water_rationing_desc: "Open emergency grain, water, train, and convoy channels for [FROM.GetName] before drought pressure hardens into famine."
natural_disaster_grain_and_water_rationing_tt: "Rationing and imports reduce civilian losses in a drought-prone warned state, but strain stability."
natural_disaster_inspect_dams_and_tunnels: "Inspect Dams and Tunnels"
natural_disaster_inspect_dams_and_tunnels_desc: "Send engineers through the dams, culverts, tunnels, bridges, and mountain approaches around [FROM.GetName]."
natural_disaster_inspect_dams_and_tunnels_tt: "Infrastructure inspection reduces dam, pass, and rail-collapse risk in the warned state."
natural_disaster_observatory_alert: "Observatory Alert"
natural_disaster_observatory_alert_desc: "Keep observers, signal offices, and emergency survey teams watching [FROM.GetName] for ashfall, tremors, strange weather, or skyfall."
natural_disaster_observatory_alert_tt: "Observation teams reduce abnormal volcanic and meteor losses in the warned state."
natural_disaster_dispatch_emergency_engineers: "Dispatch Emergency Engineers"
natural_disaster_dispatch_emergency_engineers_desc: "Commit engineers and transport to damaged districts in [FROM.GetName]."
natural_disaster_dispatch_emergency_engineers_tt: "Adds recovery progress to the targeted aftermath state."
natural_disaster_send_medical_columns: "Send Medical Columns"
natural_disaster_send_medical_columns_desc: "Move medical tents, trucks, and labour detachments toward displaced civilians in [FROM.GetName]."
natural_disaster_send_medical_columns_tt: "Reduces population and displacement pressure in the targeted aftermath state."
natural_disaster_emergency_railway_repair: "Emergency Railway Repair"
natural_disaster_emergency_railway_repair_desc: "Use train crews and military engineers to reopen the main line through [FROM.GetName]."
natural_disaster_emergency_railway_repair_tt: "Adds infrastructure recovery progress to the targeted aftermath state."
natural_disaster_firebreak_mobilisation: "Firebreak Mobilisation"
natural_disaster_firebreak_mobilisation_desc: "Send trucks, crews, and fuel to keep flames, ash, and smoke from spreading through [FROM.GetName]."
natural_disaster_firebreak_mobilisation_tt: "Adds industry recovery progress to the targeted aftermath state."
natural_disaster_shoreline_rescue: "Shoreline Rescue"
natural_disaster_shoreline_rescue_desc: "Open convoys, fuel dumps, and emergency crews for the damaged coast around [FROM.GetName]."
natural_disaster_shoreline_rescue_tt: "Adds population recovery progress to a coastal, storm, flood, or tsunami aftermath."
natural_disaster_open_relief_convoys: "Open Relief Convoys"
natural_disaster_open_relief_convoys_desc: "Send convoy relief and coastal fuel through [FROM.GetName] before port damage, crop failure, and displacement lock the area down."
natural_disaster_open_relief_convoys_tt: "Adds population recovery progress and records port or coastal response work."
natural_disaster_temporary_shelter_program: "Temporary Shelter Program"
natural_disaster_temporary_shelter_program_desc: "Turn schools, depots, churches, halls, and camps near [FROM.GetName] into temporary shelter space."
natural_disaster_temporary_shelter_program_tt: "Adds population recovery progress, but consumes manpower, support equipment, and public patience."
natural_disaster_ash_clearance_crews: "Ash Clearance Crews"
natural_disaster_ash_clearance_crews_desc: "Put crews on roads, fields, and airstrips around [FROM.GetName] before ash or crater dust becomes the new weather."
natural_disaster_ash_clearance_crews_tt: "Adds infrastructure recovery progress and records airfield or ash-clearance response work."
natural_disaster_controlled_factory_shutdown: "Controlled Factory Shutdown"
natural_disaster_controlled_factory_shutdown_desc: "Slow dangerous factory lines in [FROM.GetName] long enough to move people, tools, and fuel out of the collapse zone."
natural_disaster_controlled_factory_shutdown_tt: "Adds industry recovery progress, but costs stability and war support."
natural_disaster_offer_relief_mission_to_FROM: "Offer Relief Mission to [FROM.GetNameDef]"
natural_disaster_offer_relief_mission_to_FROM_desc: "Send trucks, tents, and field stores to [FROM.GetNameDef] while its disaster aftermath is still active."
natural_disaster_offer_relief_mission_to_FROM_tt: "Sends a foreign relief mission that reduces one population or displacement aftermath in [FROM.GetNameDef]."
natural_disaster_military_bridge_teams_to_FROM: "Military Bridge Teams to [FROM.GetNameDef]"
natural_disaster_military_bridge_teams_to_FROM_desc: "Detach military engineers, trains, and bridge teams to reopen one damaged corridor in [FROM.GetNameDef]."
natural_disaster_military_bridge_teams_to_FROM_tt: "Sends bridge teams that reduce one transport aftermath in [FROM.GetNameDef]."
natural_disaster_international_ash_warning_to_FROM: "International Ash Warning to [FROM.GetNameDef]"
natural_disaster_international_ash_warning_to_FROM_desc: "Share observers, signal traffic, and survey teams with [FROM.GetNameDef] while ash or crater dust is disrupting its roads and airfields."
natural_disaster_international_ash_warning_to_FROM_tt: "Sends observation support that reduces one volcanic or meteor aftermath in [FROM.GetNameDef]."
natural_disaster_joint_river_commission_with_FROM: "Joint River Commission with [FROM.GetNameDef]"
natural_disaster_joint_river_commission_with_FROM_desc: "Coordinate floodworks, bridge watches, and river gauges with [FROM.GetNameDef]."
natural_disaster_joint_river_commission_with_FROM_tt: "Funds a joint river commission that reduces one flood aftermath in [FROM.GetNameDef]."
natural_disaster_accept_disaster_refugees_from_FROM: "Accept Disaster Refugees from [FROM.GetNameDef]"
natural_disaster_accept_disaster_refugees_from_FROM_desc: "Open temporary camp space and relief offices for civilians fleeing the active disaster in [FROM.GetNameDef]."
natural_disaster_accept_disaster_refugees_from_FROM_tt: "Accepts displaced civilians and reduces one population aftermath in [FROM.GetNameDef], while straining domestic stability."
natural_disaster_seal_border_camps_against_FROM: "Seal the Border Camps against [FROM.GetNameDef]"
natural_disaster_seal_border_camps_against_FROM_desc: "Send guards, wire, and field stores to harden the frontier camps while [FROM.GetNameDef] is still managing disaster displacement."
natural_disaster_seal_border_camps_against_FROM_tt: "Blocks refugee movement and pushes additional population pressure onto one active disaster aftermath in [FROM.GetNameDef], while costing domestic stability and war support."

