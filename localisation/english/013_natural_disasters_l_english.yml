l_english:
chaosx.nr13.1.t: "Natural Disasters"
chaosx.nr13.100.t: "Natural Disaster Report"
chaosx.nr13.101.t: "Natural Disaster Chain"
chaosx.nr13.10.t: "Warning from [natural_disaster_current_target_state.GetName]"
chaosx.nr13.10.d: "Reports from [natural_disaster_current_target_state.GetName] describe the first signs of [GetNaturalDisasterFamilyName]. The warning is incomplete, but the area is exposed: rail yards, homes, factories, ports, or fields may be in the path before the next bulletin arrives."
chaosx.nr13.10.a: "Move before the report becomes an obituary."
chaosx.nr13.10.tt: "The Disaster Response Office can prepare the warned state. Preparation reduces damage and population loss if the disaster strikes."
chaosx.nr13.20.t: "Disaster Report: [natural_disaster_current_target_state.GetName]"
chaosx.nr13.20.d: "[GetNaturalDisasterFamilyName] has struck [natural_disaster_current_target_state.GetName]. Local industry, transport, and homes are damaged, casualties are being counted, and the controller must decide how much equipment, fuel, labour, and transport can be spared for recovery."
chaosx.nr13.20.a: "Send the engineers before the speeches."
chaosx.nr13.20.tt: "The affected state takes local building damage, population loss, and a timed family-specific aftermath modifier. Recovery decisions and missions become available."
chaosx.nr13.30.t: "Aftermath in [Root.GetNameDef]"
chaosx.nr13.30.d: "The first disaster report was not the end of the crisis. Refugees, broken transport, lost crops, shuttered airfields, and damaged ports are now competing with military and industrial priorities."
chaosx.nr13.30.a: "The second ledger is always political."
chaosx.nr13.30.tt: "A delayed family-specific aftermath can spread from one active disaster state if recovery pressure remains active."
chaosx.nr13.199.t: "Disaster Barrage Cleanup"

