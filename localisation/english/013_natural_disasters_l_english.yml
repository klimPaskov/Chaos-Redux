natural_disaster.event_details.description: "Warnings arrive from named states as rivers leave their banks, faults break, storms cross transport belts, ash buries fields, and fires outrun the roads. Local reports follow each impact into rescue, stabilization, and reconstruction while nearby states watch for the danger to spread."
natural_disaster.evolution.type: "Disaster Escalation"
natural_disaster.evolution.stage_1.title: "Wider Disaster Seasons"
natural_disaster.evolution.stage_1.body: "Disaster seasons carry more impacts and a broader family pool. Warning choices and family reports remain local, while repeated hits make rescue and stabilization capacity harder to allocate."
natural_disaster.evolution.stage_2.title: "Regional Cascades"
natural_disaster.evolution.stage_2.body: "Deaths and damage rise sharply. Neighboring states suffer transport and supply disruption. Famine, disease, refugee pressure, delayed deaths, and reconstruction strain become central risks when recovery falters."
natural_disaster.evolution.stage_3.title: "Abnormal Paths"
natural_disaster.evolution.stage_3.body: "Abnormal disasters can travel across regions as rupture waves, meteor showers, eruption plumes, storm corridors, tornado tracks, and tsunami paths. The abnormal map shows queued danger and the places likely to be struck next."
natural_disaster.evolution.summary: "Chaos Tier: [GetEventsLogSelectedEvolutionTierView]\nEvolution Stage: §Y[GetEventsLogSelectedEvolutionStageView]§!"
chaosx_super_event.67.t: "NO FIRM GROUND"
chaosx_super_event.67.q: "The earth is utterly broken. The earth is torn apart. (Isaiah 24:19)"
chaosx_super_event.67.a: "No soil offers escape."
chaosx_super_event.67.d: "Connected ruptures are tearing through distant regions in a single abnormal sequence. Rails buckle, bridges separate, ports fail, and the next shock no longer belongs to one fault or one country."
chaosx_super_event.68.t: "ASH AT NOON"
chaosx_super_event.68.q: "The ashes now began to fall upon us. (Pliny the Younger)"
chaosx_super_event.68.a: "Shake off the ash."
chaosx_super_event.68.d: "An eruption has exceeded every ordinary exclusion plan. Ash closes the day across several regions while pyroclastic loss, buried valleys, crop failure, and broken air routes spread beyond the first vent."
chaosx_super_event.69.t: "THE BURNING FIRMAMENT"
chaosx_super_event.69.q: "The heavens themselves blaze forth the death of princes. (William Shakespeare)"
chaosx_super_event.69.a: "Who is able to stand?"
chaosx_super_event.69.d: "The first impact was not solitary. Fire trails cross the sky toward separated districts, dividing rescue forces between craters, burning settlements, severed communications, and the uncertainty of the next descent."
chaosx_super_event.70.t: "THE FRETFUL ELEMENTS"
chaosx_super_event.70.q: "Blow, winds, and crack your cheeks! Rage! blow! (William Shakespeare)"
chaosx_super_event.70.a: "Here's a night pities neither wise men nor fools."
chaosx_super_event.70.d: "A destructive corridor is crossing borders without dispersing. Tornadoes, floodwater, fire, and violent wind arrive in sequence while warning lines race ahead toward the next exposed states."
chaosx_super_event.71.t: "OLD STORIES CEASE TO BE INCREDIBLE"
chaosx_super_event.71.q: "Old stories of occurrences handed down by tradition, but scantily confirmed by experience, suddenly ceased to be incredible. (Thucydides)"
chaosx_super_event.71.a: "The time is out of joint."
chaosx_super_event.71.d: "Reports once dismissed as impossible now define the disaster season. Governments face moving paths, compound impacts, and physical crises whose next zones must be read before the old rules fail again."
chaosx_super_event.72.t: "BELOW THE STONE"
chaosx_super_event.72.q: "There is nothing in the world more soft and weak than water ... for attacking things that are firm and strong there is nothing that can take precedence of it. (Laozi)"
chaosx_super_event.72.a: "Remember the high-water stones."
chaosx_super_event.72.d: "The sea has withdrawn from one harbor while warnings run along several coasts. Each confirmed arrival leaves other ports counting the distance to the next surge."
chaosx.nr13.4.t: "The [natural_disaster_abnormal_notice_state.GetNaturalDisasterFamilyName] Path Turns Toward [natural_disaster_abnormal_notice_state.GetName]"
chaosx.nr13.4.d: "The abnormal sequence has placed §Y[natural_disaster_abnormal_notice_state.GetName]§! in its active path. Field reports identify [natural_disaster_abnormal_notice_state.GetNaturalDisasterDamageSummary] as the immediate danger. The path map shows the other threatened states, the expected order of impact, chain risks, and the recovery work already underway."
chaosx.nr13.4.a: "Open the path map."
chaosx.nr13.4.b: "Keep the warning with the aftermath cards."
chaosx.nr13.126.t: "No New Disaster Front Forms"
chaosx.nr13.126.d: "The projected paths fail to converge on an uncommitted inhabited state under our control. Every viable route is already inside an active warning or recovery corridor, or the available disaster families have no physical path through our territory. No new impact has been scheduled."
chaosx.nr13.126.a: "The existing fronts remain."
chaosx.nr13.127.t: "The Barrage Paths Break Apart"
chaosx.nr13.127.d: "The selected crisis family cannot form a valid path through our controlled states. No warning, impact, or recovery card has been scheduled. Another crisis type or launching country must be chosen."
chaosx.nr13.127.a: "Choose a path the terrain can carry."
natural_disaster_review_abnormal_path_map: "Review the Abnormal Path"
natural_disaster_review_abnormal_path_map_desc: "Open the abnormal path map when a moving rupture, storm, eruption, meteor fall, or tsunami sequence threatens the country. The map reads the same warnings and recovery work as the aftermath decisions."
natural_disaster_review_abnormal_path_map_tt: "Shows the five most urgent abnormal zones. Scheduled impacts, active warnings, chain risks, unresolved severity, and approaching dates set their order. Selecting a card reveals its disaster layer and recovery schedule."
