natural_disaster_cost_warning_naval_coast: "[FROM.GetNaturalDisasterWarningCostNavalCoast]"
natural_disaster_cost_warning_naval_coast_blocked: "[FROM.GetNaturalDisasterWarningCostNavalCoastBlocked]"
natural_disaster_cost_warning_naval_coast_tooltip: "[FROM.GetNaturalDisasterWarningCostNavalCoastFull]\nCoastal withdrawal uses manpower, convoys, fuel, and Command Power. Cost scales with the targeted disaster's severity."
natural_disaster_cost_warning_command_rail: "[FROM.GetNaturalDisasterWarningCostCommandRail]"
natural_disaster_cost_warning_command_rail_blocked: "[FROM.GetNaturalDisasterWarningCostCommandRailBlocked]"
natural_disaster_cost_warning_command_rail_tooltip: "[FROM.GetNaturalDisasterWarningCostCommandRailFull]\nManpower, support equipment, trains, and fuel keep the route open. Cost scales with the targeted disaster's severity."
natural_disaster_cost_warning_civilian_shutdown: "[FROM.GetNaturalDisasterWarningCostCivilianShutdown]"
natural_disaster_cost_warning_civilian_shutdown_blocked: "[FROM.GetNaturalDisasterWarningCostCivilianShutdownBlocked]"
natural_disaster_cost_warning_civilian_shutdown_tooltip: "[FROM.GetNaturalDisasterWarningCostCivilianShutdownFull]\nFree civilian factories are required but not spent. The shutdown uses manpower and support equipment and costs Stability."
natural_disaster_cost_warning_shelter_medical: "[FROM.GetNaturalDisasterWarningCostShelterMedical]"
natural_disaster_cost_warning_shelter_medical_blocked: "[FROM.GetNaturalDisasterWarningCostShelterMedicalBlocked]"
natural_disaster_cost_warning_shelter_medical_tooltip: "[FROM.GetNaturalDisasterWarningCostShelterMedicalFull]\nShelter and medical preparation uses manpower, support equipment, and Stability according to the targeted disaster's severity."
natural_disaster_cost_warning_transport: "[FROM.GetNaturalDisasterWarningCostTransport]"
natural_disaster_cost_warning_transport_blocked: "[FROM.GetNaturalDisasterWarningCostTransportBlocked]"
natural_disaster_cost_warning_transport_tooltip: "[FROM.GetNaturalDisasterWarningCostTransportFull]\nEvacuation columns use manpower, trucks, fuel, and Stability. Trains and convoys are not used."
natural_disaster_cost_warning_fuel_convoy: "[FROM.GetNaturalDisasterWarningCostFuelConvoy]"
natural_disaster_cost_warning_fuel_convoy_blocked: "[FROM.GetNaturalDisasterWarningCostFuelConvoyBlocked]"
natural_disaster_cost_warning_fuel_convoy_tooltip: "[FROM.GetNaturalDisasterWarningCostFuelConvoyFull]\nCoastal states pay convoys and inland states pay trains. Manpower, support equipment, and fuel supply the route."
