natural_disaster_cost_warning_air: "[FROM.GetNaturalDisasterWarningCostAir]"
natural_disaster_cost_warning_air_blocked: "[FROM.GetNaturalDisasterWarningCostAirBlocked]"
natural_disaster_cost_warning_air_tooltip: "Ground crews disperse aircraft and secure air operations. Cost scales with the targeted disaster's severity; regional and abnormal shutdowns also reserve civilian capacity."
natural_disaster_cost_warning_naval_coast: "[FROM.GetNaturalDisasterWarningCostNavalCoast]"
natural_disaster_cost_warning_naval_coast_blocked: "[FROM.GetNaturalDisasterWarningCostNavalCoastBlocked]"
natural_disaster_cost_warning_naval_coast_tooltip: "Coastal withdrawal uses convoys, fuel, manpower, and command capacity. No inland transport substitution is made."
natural_disaster_cost_warning_command_rail: "[FROM.GetNaturalDisasterWarningCostCommandRail]"
natural_disaster_cost_warning_command_rail_blocked: "[FROM.GetNaturalDisasterWarningCostCommandRailBlocked]"
natural_disaster_cost_warning_command_rail_tooltip: "Rail protection removes the displayed trains from service and uses support equipment, fuel, manpower, and command capacity."
natural_disaster_cost_warning_civilian_shutdown: "[FROM.GetNaturalDisasterWarningCostCivilianShutdown]"
natural_disaster_cost_warning_civilian_shutdown_blocked: "[FROM.GetNaturalDisasterWarningCostCivilianShutdownBlocked]"
natural_disaster_cost_warning_civilian_shutdown_tooltip: "Civilian shutdowns require the displayed available factories, consume manpower and support equipment, and add a counted 14-day consumer-goods burden. Wartime actions also cost War Support."
natural_disaster_cost_warning_shelter_medical: "[FROM.GetNaturalDisasterWarningCostShelterMedical]"
natural_disaster_cost_warning_shelter_medical_blocked: "[FROM.GetNaturalDisasterWarningCostShelterMedicalBlocked]"
natural_disaster_cost_warning_shelter_medical_tooltip: "Shelter and medical preparation uses manpower, support equipment, and Stability according to the targeted disaster's severity."
natural_disaster_cost_warning_transport: "[FROM.GetNaturalDisasterWarningCostTransport]"
natural_disaster_cost_warning_transport_blocked: "[FROM.GetNaturalDisasterWarningCostTransportBlocked]"
natural_disaster_cost_warning_transport_tooltip: "Evacuation columns use the displayed trucks, fuel, manpower, and Stability. They never substitute trains or convoys."
natural_disaster_cost_warning_fuel_convoy: "[FROM.GetNaturalDisasterWarningCostFuelConvoy]"
natural_disaster_cost_warning_fuel_convoy_blocked: "[FROM.GetNaturalDisasterWarningCostFuelConvoyBlocked]"
natural_disaster_cost_warning_fuel_convoy_tooltip: "The route is selected from the target state before affordability is checked: equipped coastal ports use convoys; inland routes use trains. Manpower, support equipment, and fuel are always paid."
natural_disaster_cost_warning_field_research: "[FROM.GetNaturalDisasterWarningCostFieldResearch]"
natural_disaster_cost_warning_field_research_blocked: "[FROM.GetNaturalDisasterWarningCostFieldResearchBlocked]"
natural_disaster_cost_warning_field_research_tooltip: "Observer, forecast, and field-research networks use manpower, support equipment, command capacity, and a counted 14-day civilian burden."
