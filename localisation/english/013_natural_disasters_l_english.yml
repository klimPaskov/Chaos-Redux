natural_disaster.gui.event_details_button: "Abnormal Path"
natural_disaster.gui.event_details_button.tt: "Open the global abnormal-zone record, including active threats, resolved zones, and the dormant monitor available before the first abnormal path is observed."
natural_disaster_aftermath_category: "Disaster Warnings and Aftermath"
natural_disaster_aftermath_category_desc: "Named states remain here from the first field warning through rescue, stabilization, reconstruction, and cleanup. Mission capacity is limited. Equipment, manpower, trains, convoys, fuel, stability, and time decide which places recover."
natural_disaster_foreign_relief_category: "Foreign Disaster Relief"
natural_disaster_foreign_relief_category_desc: "Send a physical relief package to a neighboring or allied state with an open disaster card. Donor burden and transport limits allow only one outbound operation at a time."
natural_disaster_aftermath_idea: "Reconstruction Burden"
natural_disaster_aftermath_idea_desc: "Damaged routes, emergency shelter, and rebuilding contracts are drawing civilian industry away from ordinary production until the country's open aftermath cards are closed."
natural_disaster_outbound_relief_burden: "Relief Convoys Abroad"
natural_disaster_outbound_relief_burden_desc: "Vehicles, medical stores, engineers, fuel, and shipping assigned abroad impose a heavy temporary burden on the donor economy."
natural_disaster_outbound_relief_light_burden: "Relief Columns Abroad"
natural_disaster_outbound_relief_light_burden_desc: "A bounded relief column is drawing civilian transport and depot capacity away from ordinary work until it returns."
natural_disaster_foreign_relief_dependency: "Foreign Relief Dependency"
natural_disaster_foreign_relief_dependency_desc: "Imported equipment and routes saved lives, but ministries and local distribution now depend on foreign schedules, liaison officers, and replacement supplies."
natural_disaster_relief_gratitude: "Disaster Relief Delivered"
natural_disaster_warn_earthquake_rail_crews: "Clear the Rail Crews from the Fault"
natural_disaster_warn_earthquake_rail_crews_desc: "Stop trains outside §Y[FROM.GetName]§!, move bridge and cutting crews to open ground, and mark emergency turnbacks before the shaking begins. Preparation reduces deaths and transport damage if the warning proves timely."
natural_disaster_warn_flood_move_rolling_stock: "Move the Rolling Stock Above the Waterline"
natural_disaster_warn_flood_move_rolling_stock_desc: "Pull locomotives, wagons, pumps, and food stores out of low yards in §Y[FROM.GetName]§! while roads still cross the river approaches."
natural_disaster_warn_tropical_cyclone_close_ports: "Close the Harbor Mouth"
natural_disaster_warn_tropical_cyclone_close_ports_desc: "Clear exposed berths in §Y[FROM.GetName]§!, tow small craft inland, and send dock crews away from cranes before wind and surge enter the port."
natural_disaster_warn_extreme_wind_pause_trains: "Hold the Trains Below the Wind"
natural_disaster_warn_extreme_wind_pause_trains_desc: "Suspend exposed rail movements through §Y[FROM.GetName]§!, secure loose loads, and shelter repair crews before the wind field reaches the line."
natural_disaster_warn_tornado_outbreak_shelter_belt: "Open the Shelter Belt"
natural_disaster_warn_tornado_outbreak_shelter_belt_desc: "Place observers and shelter teams along the forecast corridor through §Y[FROM.GetName]§!, with trucks ready to move people away from the next track."
natural_disaster_warn_thunderstorm_lightning_patrol: "Post Lightning Patrols"
natural_disaster_warn_thunderstorm_lightning_patrol_desc: "Disperse crews across airfields, fuel yards, and rail approaches in §Y[FROM.GetName]§! to extinguish strikes and report washed-out routes."
natural_disaster_warn_hailstorm_cover_aircraft: "Cover the Aircraft"
natural_disaster_warn_hailstorm_cover_aircraft_desc: "Move aircraft under cover, protect hospital roofs, and clear exposed vehicles from §Y[FROM.GetName]§! before the hail core arrives."
natural_disaster_warn_blizzard_fuel_corridor: "Keep One Fuel Corridor Open"
natural_disaster_warn_blizzard_fuel_corridor_desc: "Reserve plows, locomotives, and guarded fuel wagons for a single route into §Y[FROM.GetName]§! before driven snow closes every approach."
natural_disaster_warn_cold_wave_heat_shelters: "Light the Heat Shelters"
natural_disaster_warn_cold_wave_heat_shelters_desc: "Open heated public rooms in §Y[FROM.GetName]§!, move fuel under guard, and collect exposed families before pipes and roads freeze."
natural_disaster_warn_heat_wave_water_points: "Open the Water Points"
natural_disaster_warn_heat_wave_water_points_desc: "Distribute water, shade, and medical teams through §Y[FROM.GetName]§! and shift outdoor work before exposure overwhelms hospitals."
natural_disaster_warn_drought_water_trains: "Dispatch the Water Trains"
natural_disaster_warn_drought_water_trains_desc: "Assign tank wagons and guarded convoys to the failing wells of §Y[FROM.GetName]§! before crop loss, thirst, and migration reinforce one another."
natural_disaster_warn_dust_and_sandstorm_convoy_spacing: "Space the Convoys in the Dust"
natural_disaster_warn_dust_and_sandstorm_convoy_spacing_desc: "Break columns into marked intervals, cover engines and water stores, and post route beacons across §Y[FROM.GetName]§! before visibility disappears."
natural_disaster_warn_wildfire_firebreaks: "Cut Firebreaks Ahead of the Wind"
natural_disaster_warn_wildfire_firebreaks_desc: "Move crews and trucks ahead of the advancing front in §Y[FROM.GetName]§!, protecting settlements, fuel stores, and the last evacuation roads."
natural_disaster_warn_dry_mass_movement_slope_watch: "Post Watchers Below the Slopes"
natural_disaster_warn_dry_mass_movement_slope_watch_desc: "Close threatened cuttings in §Y[FROM.GetName]§!, watch fractured faces, and move residents away from unstable rock before collapse begins."
natural_disaster_warn_wet_mass_movement_valley_evacuation: "Empty the Mudflow Valleys"
natural_disaster_warn_wet_mass_movement_valley_evacuation_desc: "Evacuate low valleys in §Y[FROM.GetName]§!, mark high routes, and keep bridge approaches clear before saturated ground releases."
natural_disaster_warn_volcanic_eruption_exclusion_zone: "Draw the Exclusion Ring"
natural_disaster_warn_volcanic_eruption_exclusion_zone_desc: "Clear the vent approaches and exposed valleys of §Y[FROM.GetName]§!, close nearby airfields, and keep one outward route open."
natural_disaster_warn_ashfall_cover_machinery: "Cover Engines Against the Ash"
natural_disaster_warn_ashfall_cover_machinery_desc: "Seal machinery, cover water and food stores, and move aircraft from exposed fields in §Y[FROM.GetName]§! before the ash thickens."
natural_disaster_warn_lahar_valley_sirens: "Sound the Valley Sirens"
natural_disaster_warn_lahar_valley_sirens_desc: "Warn river settlements in §Y[FROM.GetName]§!, empty bridge crossings, and direct traffic uphill before volcanic mud reaches the channels."
natural_disaster_warn_tsunami_inland_corridors: "Open the Inland Corridors"
natural_disaster_warn_tsunami_inland_corridors_desc: "Move coastal residents of §Y[FROM.GetName]§! toward high ground, close quays, and reserve roads for repeated-wave evacuation."
natural_disaster_warn_storm_surge_sandbag_low_roads: "Sandbag the Low Roads"
natural_disaster_warn_storm_surge_sandbag_low_roads_desc: "Protect pumps and the lowest evacuation routes in §Y[FROM.GetName]§! while clearing exposed port districts before the water rises."
natural_disaster_warn_meteor_impact_crater_evacuation: "Evacuate the Predicted Crater"
natural_disaster_warn_meteor_impact_crater_evacuation_desc: "Use the uncertain track to empty the most exposed districts of §Y[FROM.GetName]§!, disperse fire crews, and keep approach roads open."
natural_disaster_warn_meteor_shower_shelter_lights_out: "Shelter Under a Darkened Sky"
natural_disaster_warn_meteor_shower_shelter_lights_out_desc: "Black out exposed facilities in §Y[FROM.GetName]§!, open shelters, and disperse fire patrols while observers track separate fragments."
natural_disaster_warn_whole_earth_rupture_rail_standdown: "Order a Regional Rail Standdown"
natural_disaster_warn_whole_earth_rupture_rail_standdown_desc: "Halt rail traffic through §Y[FROM.GetName]§!, clear bridges and tunnels, and place coastal and slope observers before the connected rupture reaches the region."
natural_disaster_warn_massive_eruption_food_corridors: "Guard the Food Corridors"
natural_disaster_warn_massive_eruption_food_corridors_desc: "Reserve trains, convoys, and fuel for food movement through §Y[FROM.GetName]§! before ash, valley collapse, and air closure divide the region."
natural_disaster_warn_moving_storm_corridor_rail_reroute: "Reroute Ahead of the Storm Core"
natural_disaster_warn_moving_storm_corridor_rail_reroute_desc: "Read the moving path beyond §Y[FROM.GetName]§!, divert rail traffic, and layer evacuations toward the states still ahead of the corridor."
natural_disaster_rescue_search_teams: "Send Block-by-Block Search Teams"
natural_disaster_rescue_search_teams_desc: "Commit manpower, vehicles, tools, transport, and fuel to search the damaged districts of §Y[FROM.GetName]§!. This advances early rescue and favors dense or industrial states."
natural_disaster_rescue_open_shelters: "Open Emergency Shelters"
natural_disaster_rescue_open_shelters_desc: "Convert public buildings and guarded stores in §Y[FROM.GetName]§! into shelter space. Refugee protection routes remember this action separately."
natural_disaster_rescue_clear_one_route: "Clear One Lifeline Route"
natural_disaster_rescue_clear_one_route_desc: "Concentrate crews and trains on one road or railway into §Y[FROM.GetName]§! instead of scattering effort across every blocked approach."
natural_disaster_rescue_emergency_evacuation: "Run an Emergency Evacuation"
natural_disaster_rescue_emergency_evacuation_desc: "Use trucks, trains or convoys, fuel, and local manpower to move the most exposed population out of §Y[FROM.GetName]§!."
natural_disaster_rescue_medical_triage: "Establish Field Triage"
natural_disaster_rescue_medical_triage_desc: "Place medical posts beside the accessible routes of §Y[FROM.GetName]§!, concentrating scarce support equipment where delayed deaths are most likely."
natural_disaster_rescue_port_lifeline: "Keep a Port Lifeline Open"
natural_disaster_rescue_port_lifeline_desc: "Clear a berth, protect the quay approach, and assign convoy capacity to §Y[FROM.GetName]§! so coastal rescue and supply can continue."
natural_disaster_stabilize_clean_water: "Secure Clean Water"
natural_disaster_stabilize_clean_water_desc: "Move pumps, tankers, filters, and guarded stores into §Y[FROM.GetName]§! to prevent contaminated water from turning displacement into disease."
natural_disaster_stabilize_restore_rail: "Restore the Rail Spine"
natural_disaster_stabilize_restore_rail_desc: "Commit engineers, rolling stock, and fuel to the principal rail route through §Y[FROM.GetName]§!, restoring supply before ordinary factory repair."
natural_disaster_stabilize_reopen_port: "Reopen a Relief Berth"
natural_disaster_stabilize_reopen_port_desc: "Clear debris, inspect the quay, and route convoys through one usable berth in §Y[FROM.GetName]§!."
natural_disaster_stabilize_secure_food: "Secure the Food Corridor"
natural_disaster_stabilize_secure_food_desc: "Reserve vehicles, escorts, fuel, and stores for food deliveries into §Y[FROM.GetName]§! before scarcity matures into famine."
natural_disaster_stabilize_factory_inspection: "Inspect the Damaged Works"
natural_disaster_stabilize_factory_inspection_desc: "Survey unstable factories and utilities in §Y[FROM.GetName]§!, isolating dangerous structures before repair crews return."
natural_disaster_chain_prevent_tsunami: "Evacuate Before the Tsunami"
natural_disaster_chain_prevent_tsunami_desc: "Evacuate the exposed coast of §Y[FROM.GetName]§! and close the quays before the scheduled wave arrives. Full preparation blocks the chain. incomplete work only reduces the first losses."
natural_disaster_chain_prevent_disease: "Secure Clean Water and Medical Routes"
natural_disaster_chain_prevent_disease_desc: "Protect wells, hospitals, and medical access in §Y[FROM.GetName]§! before contaminated water and crowded shelters mature into disease."
natural_disaster_chain_prevent_famine: "Open the Food Corridors"
natural_disaster_chain_prevent_famine_desc: "Commit trains or convoys to the food corridor serving §Y[FROM.GetName]§! before crop loss and isolation mature into famine."
natural_disaster_chain_prevent_wildfire_spread: "Hold the Firebreak Line"
natural_disaster_chain_prevent_wildfire_spread_desc: "Build patrol lines and firebreaks around §Y[FROM.GetName]§! before wind and dry ground carry the fire into another state."
natural_disaster_chain_prevent_supply_collapse: "Keep One Supply Route Open"
natural_disaster_chain_prevent_supply_collapse_desc: "Hold at least one rail, port, or road route into §Y[FROM.GetName]§! before the damaged network collapses."
natural_disaster_chain_prevent_lahar: "Clear the Lahar Channels"
natural_disaster_chain_prevent_lahar_desc: "Clear volcanic channels and evacuate the valleys of §Y[FROM.GetName]§! before saturated ash begins to move."
natural_disaster_chain_prevent_aftershock: "Inspect Bridges and Priority Buildings"
natural_disaster_chain_prevent_aftershock_desc: "Keep engineers on the bridges and priority buildings of §Y[FROM.GetName]§! until the aftershock window closes."
natural_disaster_stabilize_chain_prevention: "Break the Follow-up Chain"
natural_disaster_stabilize_chain_prevention_desc: "Spend scarce early or middle-phase capacity on the known follow-up risk in §Y[FROM.GetName]§!. A prevented tsunami, aftershock, lahar, fire spread, famine, disease, refugee crisis, or supply collapse never reaches its queued impact."
natural_disaster_reconstruct_resilient_rails: "Rebuild a Resilient Rail Spine"
natural_disaster_reconstruct_resilient_rails_desc: "Reconstruct the principal route through §Y[FROM.GetName]§! with protected cuttings, drainage, and alternate access. Later transport disasters inflict less damage here."
natural_disaster_reconstruct_seismic_retrofit: "Retrofit Against Ground Failure"
natural_disaster_reconstruct_seismic_retrofit_desc: "Strengthen bridges, public buildings, and route approaches in §Y[FROM.GetName]§! against earthquakes and rupture waves."
natural_disaster_reconstruct_coastal_barriers: "Raise Coastal Barriers"
natural_disaster_reconstruct_coastal_barriers_desc: "Rebuild pumps, seawalls, raised routes, and inland exits in §Y[FROM.GetName]§! against flood, cyclone, tsunami, and surge."
natural_disaster_reconstruct_firebreak_network: "Build a Firebreak Network"
natural_disaster_reconstruct_firebreak_network_desc: "Join cleared strips, water points, observation posts, and evacuation roads across §Y[FROM.GetName]§! to blunt later wildfire fronts."
natural_disaster_reconstruct_volcanic_exclusion_routes: "Fix the Volcanic Exclusion Routes"
natural_disaster_reconstruct_volcanic_exclusion_routes_desc: "Mark durable exclusion rings and high-ground routes in §Y[FROM.GetName]§! for eruption, ashfall, lahar, and massive-eruption crises."
natural_disaster_reconstruct_water_security: "Harden the Water System"
natural_disaster_reconstruct_water_security_desc: "Protect wells, reservoirs, pipes, and distribution points in §Y[FROM.GetName]§! against heat, drought, and choking dust."
natural_disaster_reconstruct_crater_or_exclusion_cordon: "Establish a Permanent Exclusion Cordon"
natural_disaster_reconstruct_crater_or_exclusion_cordon_desc: "Survey unstable ground, mark impact debris, and build alternate routes around dangerous zones in §Y[FROM.GetName]§!."
natural_disaster_reconstruct_weather_shelter_network: "Build a Weather Shelter Network"
natural_disaster_reconstruct_weather_shelter_network_desc: "Link hardened shelters, fuel stores, observers, and protected communications throughout §Y[FROM.GetName]§! for violent wind, hail, snow, cold, and meteor fragments."
natural_disaster_reconstruct_slope_stabilization: "Stabilize the Slopes"
natural_disaster_reconstruct_slope_stabilization_desc: "Drain saturated faces, anchor dangerous cuttings, and reroute exposed roads in §Y[FROM.GetName]§! against rockfall and mudflow."
natural_disaster_route_inbound_relief: "Route the Foreign Relief Column"
natural_disaster_route_inbound_relief_desc: "Assign local manpower, fuel, and political responsibility to move the pledged foreign package from the border or port into its recorded disaster state. Successful routing improves the card but leaves a year of visible dependency."
natural_disaster_refuse_inbound_relief: "Refuse the Foreign Relief"
natural_disaster_refuse_inbound_relief_desc: "Turn the foreign column away before it enters the disaster route. The supplies are lost to this recovery effort, but no dependency is recorded."
natural_disaster_rescue_mission_1: "Rescue Window: [?natural_disaster_rescue_state_1.GetName]"
natural_disaster_rescue_mission_1_desc: "The early rescue window in §Y[?natural_disaster_rescue_state_1.GetName]§! is closing. Reach the rescue score before reassessment. Partial work limits the failure, while neglect worsens the card and its follow-up risk."
natural_disaster_rescue_mission_2: "Rescue Window: [?natural_disaster_rescue_state_2.GetName]"
natural_disaster_rescue_mission_2_desc: "§Y[?natural_disaster_rescue_state_2.GetName]§! is consuming rescue capacity. Equipment and transport committed here cannot answer every other card before the same early deadline."
natural_disaster_rescue_mission_3: "Rescue Window: [?natural_disaster_rescue_state_3.GetName]"
natural_disaster_rescue_mission_3_desc: "The rescue line in §Y[?natural_disaster_rescue_state_3.GetName]§! is active. Additional states remain visible, but cannot receive a full rescue mission until capacity opens."
natural_disaster_rescue_mission_4: "Rescue Window: [?natural_disaster_rescue_state_4.GetName]"
natural_disaster_rescue_mission_4_desc: "Reinforced capacity has opened a rescue line in §Y[?natural_disaster_rescue_state_4.GetName]§!. It follows the same hard deadline and consumes real field capacity."
natural_disaster_stabilization_mission_1: "Stabilization: [?natural_disaster_stabilization_state_1.GetName]"
natural_disaster_stabilization_mission_1_desc: "Secure water, food, transport, medical access, and dangerous works in §Y[?natural_disaster_stabilization_state_1.GetName]§! before middle-phase reassessment. Full, partial, and failed outcomes change the later chain pressure."
natural_disaster_stabilization_mission_2: "Stabilization: [?natural_disaster_stabilization_state_2.GetName]"
natural_disaster_stabilization_mission_2_desc: "The stabilization line in §Y[?natural_disaster_stabilization_state_2.GetName]§! is committed. Choose between restoring a lifeline and preventing a follow-up before the deadline closes."
natural_disaster_stabilization_mission_3: "Stabilization: [?natural_disaster_stabilization_state_3.GetName]"
natural_disaster_stabilization_mission_3_desc: "A reinforced stabilization line is active in §Y[?natural_disaster_stabilization_state_3.GetName]§!. It must still secure a real lifeline before reassessment."
natural_disaster_reconstruction_mission_1: "Reconstruction: [?natural_disaster_reconstruction_state_1.GetName]"
natural_disaster_reconstruction_mission_1_desc: "Complete enough durable work to close the late-phase card in §Y[?natural_disaster_reconstruction_state_1.GetName]§!. A partial result leaves recovery strain. Failure leaves continuing damage."
natural_disaster_reconstruction_mission_2: "Reconstruction: [?natural_disaster_reconstruction_state_2.GetName]"
natural_disaster_reconstruction_mission_2_desc: "The project in §Y[?natural_disaster_reconstruction_state_2.GetName]§! requires permanent route, shelter, barrier, water, slope, or exclusion work."
natural_disaster_reconstruction_mission_3: "Reconstruction: [?natural_disaster_reconstruction_state_3.GetName]"
natural_disaster_reconstruction_mission_3_desc: "A reinforced reconstruction project is active in §Y[?natural_disaster_reconstruction_state_3.GetName]§!. Partial cleanup cannot substitute for full recovery."
natural_disaster_chain_prevent_tsunami_mission: "Tsunami Arrival: [?natural_disaster_chain_mission_state.GetName]"
natural_disaster_chain_prevent_tsunami_mission_desc: "Evacuate the coast and close the quays before the wave reaches §Y[?natural_disaster_chain_mission_state.GetName]§!."
natural_disaster_chain_prevent_disease_mission: "Disease Prevention: [?natural_disaster_chain_mission_state.GetName]"
natural_disaster_chain_prevent_disease_mission_desc: "Secure clean water and a medical route in §Y[?natural_disaster_chain_mission_state.GetName]§! before disease matures."
natural_disaster_chain_prevent_famine_mission: "Famine Prevention: [?natural_disaster_chain_mission_state.GetName]"
natural_disaster_chain_prevent_famine_mission_desc: "Open a food corridor into §Y[?natural_disaster_chain_mission_state.GetName]§! before shortage becomes mass hunger."
natural_disaster_chain_prevent_wildfire_spread_mission: "Wildfire Spread: [?natural_disaster_chain_mission_state.GetName]"
natural_disaster_chain_prevent_wildfire_spread_mission_desc: "Complete the firebreak and patrol line around §Y[?natural_disaster_chain_mission_state.GetName]§! before the fire crosses into another state."
natural_disaster_chain_prevent_supply_collapse_mission: "Supply Lifeline: [?natural_disaster_chain_mission_state.GetName]"
natural_disaster_chain_prevent_supply_collapse_mission_desc: "Keep one rail, port, or road route into §Y[?natural_disaster_chain_mission_state.GetName]§! operating before local supply fails."
natural_disaster_chain_prevent_lahar_mission: "Lahar Arrival: [?natural_disaster_chain_mission_state.GetName]"
natural_disaster_chain_prevent_lahar_mission_desc: "Clear channels and evacuate valley floors in §Y[?natural_disaster_chain_mission_state.GetName]§! before volcanic mud arrives."
natural_disaster_chain_prevent_aftershock_mission: "Aftershock Inspection: [?natural_disaster_chain_mission_state.GetName]"
natural_disaster_chain_prevent_aftershock_mission_desc: "Inspect bridges and priority buildings in §Y[?natural_disaster_chain_mission_state.GetName]§! before the dangerous aftershock window closes."
natural_disaster_chain_mission: "Follow-up Approaching [?natural_disaster_chain_mission_state.GetName]"
natural_disaster_chain_mission_desc: "A known follow-up remains queued for §Y[?natural_disaster_chain_mission_state.GetName]§!. Prevention must be completed before its arrival date."
natural_disaster_inbound_relief_mission: "Relief from [?natural_disaster_inbound_relief_donor.GetName] for [?natural_disaster_inbound_relief_state.GetName]"
natural_disaster_inbound_relief_mission_desc: "A package from §Y[?natural_disaster_inbound_relief_donor.GetName]§! is waiting for delivery to §Y[?natural_disaster_inbound_relief_state.GetName]§!. Route it before transport and stores are withdrawn."
natural_disaster_offer_neighbor_convoy_relief: "Send a Neighboring Relief Convoy"
natural_disaster_offer_neighbor_convoy_relief_desc: "Send trucks, support equipment, fuel, manpower, and shipping to the most urgent eligible neighboring or allied disaster state. The recipient must still route the package."
natural_disaster_offer_port_lifeline_relief: "Open a Foreign Port Lifeline"
natural_disaster_offer_port_lifeline_relief_desc: "Favor an exposed coastal state and send a convoy-heavy package for berth clearance, water, shelter, and port access."
natural_disaster_offer_engineer_relief: "Dispatch an Engineer Column"
natural_disaster_offer_engineer_relief_desc: "Favor a damaged industrial or strategic transport state and send heavy equipment, trucks, fuel, and manpower for route stabilization."
natural_disaster_offer_medical_relief: "Dispatch a Medical Relief Column"
natural_disaster_offer_medical_relief_desc: "Favor a densely populated or disease-threatened state and send support equipment, vehicles, fuel, manpower, and convoy capacity for triage and shelter."
# Additional accepted family warning directions
natural_disaster_warn_earthquake_open_squares: "Open the Squares"
natural_disaster_warn_earthquake_open_squares_desc: "Move civilians, field hospitals, and rescue columns into open ground in §Y[FROM.GetName]§!. This reduces collapse deaths and leaves room for aftershock searches."
natural_disaster_warn_earthquake_port_withdrawal_watch: "Post the Port-Withdrawal Watch"
natural_disaster_warn_earthquake_port_withdrawal_watch_desc: "Pull quay crews and ships away from exposed approaches in §Y[FROM.GetName]§!. The watch protects the coast if offshore shaking drives a delayed wave."
natural_disaster_warn_flood_raise_embankments: "Raise the Embankments"
natural_disaster_warn_flood_raise_embankments_desc: "Put engineers and pumps on the rail and river banks of §Y[FROM.GetName]§!. Stronger embankments reduce transport washouts and dam-failure flash flooding."
natural_disaster_warn_flood_clean_water_stores: "Secure Clean-Water Stores"
natural_disaster_warn_flood_clean_water_stores_desc: "Seal wells, tanks, and hospital reserves in §Y[FROM.GetName]§!. Protected water lowers the risk that flood recovery turns into disease."
natural_disaster_warn_tropical_cyclone_disperse_aircraft: "Disperse the Aircraft"
natural_disaster_warn_tropical_cyclone_disperse_aircraft_desc: "Move aircraft, fuel bowsers, and ground crews from exposed fields in §Y[FROM.GetName]§!. Dispersal protects air operations from the cyclone core."
natural_disaster_warn_tropical_cyclone_coastal_evacuation: "Begin the Coastal Evacuation"
natural_disaster_warn_tropical_cyclone_coastal_evacuation_desc: "Use trains, convoys, and fuel to move exposed communities inland from §Y[FROM.GetName]§!. Evacuation reduces surge deaths but consumes scarce transport."
natural_disaster_warn_extreme_wind_anchor_aircraft: "Anchor the Aircraft"
natural_disaster_warn_extreme_wind_anchor_aircraft_desc: "Tie down aircraft, cranes, and loose equipment across §Y[FROM.GetName]§!. The work protects airfields and industry from sustained destructive wind."
natural_disaster_warn_extreme_wind_secure_roofs: "Secure the Roofs"
natural_disaster_warn_extreme_wind_secure_roofs_desc: "Send support teams through the industrial districts of §Y[FROM.GetName]§! to brace factory roofs, power sheds, and exposed workshops before the wind field arrives."
natural_disaster_warn_tornado_outbreak_spotter_line: "Establish a Spotter Line"
natural_disaster_warn_tornado_outbreak_spotter_line_desc: "Place observers, radios, and medical teams along the storm approach to §Y[FROM.GetName]§!. Earlier track calls improve shelter and triage time."
natural_disaster_warn_tornado_outbreak_clear_airfields: "Clear the Airfields"
natural_disaster_warn_tornado_outbreak_clear_airfields_desc: "Move aircraft and emergency vehicles away from the projected tracks through §Y[FROM.GetName]§!. The cleared fields remain available for rescue flights."
natural_disaster_warn_thunderstorm_ground_aircraft: "Ground the Aircraft"
natural_disaster_warn_thunderstorm_ground_aircraft_desc: "Ground aircraft and protect exposed crews in §Y[FROM.GetName]§! before lightning and hail arrive. This limits airfield losses."
natural_disaster_warn_thunderstorm_drainage_crews: "Dispatch Drainage Crews"
natural_disaster_warn_thunderstorm_drainage_crews_desc: "Send pumps, trains, and road crews to low crossings in §Y[FROM.GetName]§!. Clear drainage reduces flash flooding and transport isolation."
natural_disaster_warn_hailstorm_cover_depots: "Cover the Depots"
natural_disaster_warn_hailstorm_cover_depots_desc: "Brace depot roofs and move vehicles under cover in §Y[FROM.GetName]§!. The preparation protects equipment and nearby airfields from destructive hail."
natural_disaster_warn_hailstorm_food_reserve: "Build a Food Reserve"
natural_disaster_warn_hailstorm_food_reserve_desc: "Move protected food stocks into §Y[FROM.GetName]§! before the hail reaches standing crops. The reserve reduces later ration and famine pressure."
natural_disaster_warn_blizzard_rail_snow_crews: "Stage Rail Snow Crews"
natural_disaster_warn_blizzard_rail_snow_crews_desc: "Pre-position ploughs, trains, and fuel along the rail approaches to §Y[FROM.GetName]§!. Keeping one line open limits supply collapse."
natural_disaster_warn_blizzard_winter_shelter: "Open Winter Shelters"
natural_disaster_warn_blizzard_winter_shelter_desc: "Convert heated buildings into shelters across §Y[FROM.GetName]§!. Support equipment and manpower reduce exposure deaths if roads close."
natural_disaster_warn_cold_wave_protect_water_lines: "Protect the Water Lines"
natural_disaster_warn_cold_wave_protect_water_lines_desc: "Send field teams to insulate pumps, pipes, and hospital water in §Y[FROM.GetName]§!. This limits frozen utilities and shelter disease."
natural_disaster_warn_cold_wave_frontline_rotation: "Rotate Exposed Formations"
natural_disaster_warn_cold_wave_frontline_rotation_desc: "Pull exposed troops and labor crews through heated shelters in §Y[FROM.GetName]§!. The rotation reduces cold casualties at the cost of local readiness."
natural_disaster_warn_heat_wave_shift_work_hours: "Shift the Work Hours"
natural_disaster_warn_heat_wave_shift_work_hours_desc: "Move outdoor work and factory shifts in §Y[FROM.GetName]§! into cooler hours. This protects workers and hospital capacity from lethal heat."
natural_disaster_warn_heat_wave_fire_watch: "Post the Fire Watch"
natural_disaster_warn_heat_wave_fire_watch_desc: "Place patrols and field teams around power lines, depots, and dry districts in §Y[FROM.GetName]§!. Early suppression reduces wildfire follow-up risk."
natural_disaster_warn_drought_crop_salvage: "Organize Crop Salvage"
natural_disaster_warn_drought_crop_salvage_desc: "Use protected stores and labor teams to salvage the remaining harvest in §Y[FROM.GetName]§!. The effort reduces famine pressure if the drought deepens."
natural_disaster_warn_drought_firebreaks: "Cut Drought Firebreaks"
natural_disaster_warn_drought_firebreaks_desc: "Send field crews through the driest approaches to §Y[FROM.GetName]§!. Firebreaks reduce the chance that drought becomes a moving wildfire."
natural_disaster_warn_dust_and_sandstorm_seal_airfields: "Seal the Airfields"
natural_disaster_warn_dust_and_sandstorm_seal_airfields_desc: "Cover engines, intakes, and runway equipment in §Y[FROM.GetName]§!. The work keeps dust from disabling aircraft and rescue flights."
natural_disaster_warn_dust_and_sandstorm_cover_water_stores: "Cover the Water Stores"
natural_disaster_warn_dust_and_sandstorm_cover_water_stores_desc: "Seal wells, tanks, and field kitchens across §Y[FROM.GetName]§!. Protected water limits disease and heat pressure after the dust front."
natural_disaster_warn_wildfire_evacuation_columns: "Form Evacuation Columns"
natural_disaster_warn_wildfire_evacuation_columns_desc: "Commit trains, convoys, and fuel to move communities out of §Y[FROM.GetName]§!'s projected fire path. This reduces deaths before roads choke with smoke."
natural_disaster_warn_wildfire_protect_power_lines: "Protect the Power Lines"
natural_disaster_warn_wildfire_protect_power_lines_desc: "Send field teams to substations and industrial firebreaks in §Y[FROM.GetName]§!. Protecting power limits factory shutdown and secondary ignition."
natural_disaster_warn_dry_mass_movement_pass_closure: "Close the Passes"
natural_disaster_warn_dry_mass_movement_pass_closure_desc: "Stop trains and convoys beneath unstable slopes in §Y[FROM.GetName]§!. Closing the passes protects transport from rockfall, though supply must reroute."
natural_disaster_warn_dry_mass_movement_mine_evacuation: "Evacuate the Mines"
natural_disaster_warn_dry_mass_movement_mine_evacuation_desc: "Move miners and nearby settlements away from unstable faces in §Y[FROM.GetName]§!. The evacuation reduces collapse deaths and resource losses."
natural_disaster_warn_wet_mass_movement_bridge_watch: "Post the Bridge Watch"
natural_disaster_warn_wet_mass_movement_bridge_watch_desc: "Place crews, trains, and pumps at threatened bridges in §Y[FROM.GetName]§!. Early closure protects the remaining transport corridor."
natural_disaster_warn_wet_mass_movement_channel_clearance: "Clear the Channels"
natural_disaster_warn_wet_mass_movement_channel_clearance_desc: "Send field teams to drainage channels and contaminated crossings in §Y[FROM.GetName]§!. The work reduces renewed flooding and disease."
natural_disaster_warn_volcanic_eruption_observatory_watch: "Maintain the Observatory Watch"
natural_disaster_warn_volcanic_eruption_observatory_watch_desc: "Keep observers and radios tracking the vent above §Y[FROM.GetName]§!. Better warning lengthens the evacuation window and moves exposed communities before the exclusion routes close."
natural_disaster_warn_volcanic_eruption_ash_airfield_closure: "Close the Ash Airfields"
natural_disaster_warn_volcanic_eruption_ash_airfield_closure_desc: "Withdraw aircraft and fuel from fields beneath the projected plume over §Y[FROM.GetName]§!. Closure prevents ash from destroying engines."
natural_disaster_warn_ashfall_ground_air_traffic: "Ground Air Traffic"
natural_disaster_warn_ashfall_ground_air_traffic_desc: "Ground aircraft and cover runway equipment throughout §Y[FROM.GetName]§!. This protects the air network while ash density is uncertain."
natural_disaster_warn_ashfall_cover_food_and_water: "Cover Food and Water"
natural_disaster_warn_ashfall_cover_food_and_water_desc: "Seal food stores, wells, and hospital water in §Y[FROM.GetName]§!. Protection reduces respiratory, disease, and famine follow-ups."
natural_disaster_warn_lahar_bridge_cordon: "Cordon the Bridges"
natural_disaster_warn_lahar_bridge_cordon_desc: "Close and guard valley bridges in §Y[FROM.GetName]§! before volcanic mud reaches them. The cordon protects rescue traffic from sudden collapse."
natural_disaster_warn_lahar_channel_clearance: "Clear the Lahar Channels"
natural_disaster_warn_lahar_channel_clearance_desc: "Send field teams into drainage channels and high crossings in §Y[FROM.GetName]§!. Clear channels limit renewed flooding and contaminated water."
natural_disaster_warn_tsunami_coast_withdrawal_alarm: "Sound the Coast-Withdrawal Alarm"
natural_disaster_warn_tsunami_coast_withdrawal_alarm_desc: "Open shelters and order exposed districts of §Y[FROM.GetName]§! away from the shore. The alarm reduces wave deaths before the first arrival."
natural_disaster_warn_tsunami_close_quays: "Close the Quays"
natural_disaster_warn_tsunami_close_quays_desc: "Pull ships, convoys, and quay crews out of §Y[FROM.GetName]§!'s harbor approaches. Closure protects relief shipping from the incoming wave."
natural_disaster_warn_storm_surge_quay_closure: "Order the Quay Closure"
natural_disaster_warn_storm_surge_quay_closure_desc: "Halt port traffic and withdraw convoys from low berths in §Y[FROM.GetName]§!. This preserves a relief route after the surge."
natural_disaster_warn_storm_surge_evacuate_marsh_edge: "Evacuate the Marsh Edge"
natural_disaster_warn_storm_surge_evacuate_marsh_edge_desc: "Move exposed lowland communities into shelters above §Y[FROM.GetName]§!'s surge line. Evacuation reduces drowning and displacement."
natural_disaster_warn_meteor_impact_observatory_tracking: "Maintain Observatory Tracking"
natural_disaster_warn_meteor_impact_observatory_tracking_desc: "Keep observers, aircraft, and radios following the object projected toward §Y[FROM.GetName]§!. Better tracking sharpens the impact warning."
natural_disaster_warn_meteor_impact_fire_perimeter: "Prepare the Fire Perimeter"
natural_disaster_warn_meteor_impact_fire_perimeter_desc: "Commit transport, fuel, and crews around §Y[FROM.GetName]§!'s projected impact zone. The perimeter reduces post-impact fire spread."
natural_disaster_warn_meteor_shower_observer_net: "Raise the Observer Net"
natural_disaster_warn_meteor_shower_observer_net_desc: "Link observers, radios, and shelters around §Y[FROM.GetName]§!. Track calls give exposed communities time to move between projected impact corridors."
natural_disaster_warn_meteor_shower_fire_patrols: "Post Fire Patrols"
natural_disaster_warn_meteor_shower_fire_patrols_desc: "Place support teams around settlements and depots in §Y[FROM.GetName]§!. Patrols suppress the scattered fires left by falling fragments."
natural_disaster_warn_whole_earth_rupture_coastal_tide_watch: "Post the Coastal Tide Watch"
natural_disaster_warn_whole_earth_rupture_coastal_tide_watch_desc: "Link coast observers and regional radios around §Y[FROM.GetName]§!. The watch gives threatened shores time to react to rupture-driven waves."
natural_disaster_warn_whole_earth_rupture_regional_triage: "Organize Regional Triage"
natural_disaster_warn_whole_earth_rupture_regional_triage_desc: "Open shelters and medical sorting points across §Y[FROM.GetName]§!. Triage protects survivors when several rupture fronts arrive in succession."
natural_disaster_warn_massive_eruption_exclusion_ring: "Enforce the Exclusion Ring"
natural_disaster_warn_massive_eruption_exclusion_ring_desc: "Move communities and rescue stores outside the exclusion ring around §Y[FROM.GetName]§!. This reduces deaths from the first eruptive surge."
natural_disaster_warn_massive_eruption_air_shutdown: "Shut Down the Airspace"
natural_disaster_warn_massive_eruption_air_shutdown_desc: "Ground aircraft and protect airfield equipment beneath the plume over §Y[FROM.GetName]§!. The shutdown preserves the air network for recovery."
natural_disaster_warn_moving_storm_corridor_path_forecast: "Publish the Path Forecast"
natural_disaster_warn_moving_storm_corridor_path_forecast_desc: "Commit observers, radios, and airfields to track the corridor approaching §Y[FROM.GetName]§!. Forecasting identifies the next threatened state."
natural_disaster_warn_moving_storm_corridor_layered_evacuation: "Begin Layered Evacuation"
natural_disaster_warn_moving_storm_corridor_layered_evacuation_desc: "Move exposed districts of §Y[FROM.GetName]§! in stages along the forecast path. Layering keeps transport open for the states still ahead."
