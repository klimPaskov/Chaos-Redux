l_english:
chaosx.nr13.1.t: "Natural Disasters"
chaosx.nr13.1.d: "Scattered station reports, railway notices, and local observations are being logged across [ROOT.GetName]. Most will pass without consequence, but the first serious forecast or impact will arrive as a local report."
chaosx.nr13.1.a: "Log the field reports."
chaosx.nr13.1.tt: "Records one Natural Disasters sequence. Only actual forecast, warning, and impact reports will appear."
chaosx.nr13.10.t: "Disaster Report"
chaosx.nr13.11.t: "[GetNaturalDisasterFamilyName] Forecast in [This.GetName]"
chaosx.nr13.11.d: "Gauges, observers, and local reports point to a §Y[GetNaturalDisasterSeverityName]§! [GetNaturalDisasterFamilyName] in §Y[This.GetName]§!. [GetNaturalDisasterWarningBody]"
chaosx.nr13.11.a: "Act on the forecast."
chaosx.nr13.11.tt: "The affected state receives a short preparation window. Serious impacts open the matching family response category."
chaosx.nr13.21.t: "[GetNaturalDisasterFamilyName] Hits [This.GetName]"
chaosx.nr13.21.d: "Impact reports arrive from §Y[This.GetName]§!. [GetNaturalDisasterImpactBody]"
chaosx.nr13.21.a: "Send the damage reports."
chaosx.nr13.21.tt: "Applies building damage, supply disruption, aftermath ledgers, and civilian death reports across the affected state."
chaosx.nr13.30.t: "Natural Disaster Sequence Stabilizes"
chaosx.nr13.30.d: "The first wave of reports has ended, but response boards remain active wherever rails, shelters, ports, fires, ash, water, or crater fields still need work. Recovery choices will decide whether the sequence becomes a contained emergency or the opening act of a wider aftermath."
chaosx.nr13.30.a: "Keep relief crews moving."
chaosx.news.84.t: "[FROM.GetNaturalDisasterNewsFamilyName] Strikes [natural_disaster_news_state.GetName]"
chaosx.news.84.d: "Reports from [FROM.GetNameDef] name [natural_disaster_news_state.GetName] as the latest disaster zone. Local boards describe damaged rails, closed ports, crowded shelters, and families still moving between temporary rooms as recovery crews try to keep the aftermath from spreading."
chaosx.news.84.a: "The reports keep arriving."
chaosx.news.85.t: "Ground Breaks Across [natural_disaster_news_state.GetName]"
chaosx.news.85.d: "[FROM.GetNameDef] reports a severe [FROM.GetNaturalDisasterNewsFamilyName] around [natural_disaster_news_state.GetName]. Rail bridges, utility lines, and hill roads have become the first measure of the emergency, while rescue boards warn that aftershocks and slope failures may still decide which towns remain connected."
chaosx.news.85.a: "The ground has not settled."
chaosx.news.86.t: "Water Drives Families From [natural_disaster_news_state.GetName]"
chaosx.news.86.d: "Coastal stations and river authorities in [FROM.GetNameDef] report that [natural_disaster_news_state.GetName] has become the center of a [FROM.GetNaturalDisasterNewsFamilyName] response. Ports, rail yards, low roads, and shelter columns are being counted by name as crews try to keep the water from turning one disaster into a wider displacement."
chaosx.news.86.a: "The water keeps moving."
chaosx.news.87.t: "Exposure Belt Opens in [FROM.GetNameDef]"
chaosx.news.87.d: "[FROM.GetNameDef] reports that [natural_disaster_news_state.GetName] is carrying a [FROM.GetNaturalDisasterNewsFamilyName] aftermath. Relief boards describe water routes, fuel stores, fire lines, and road markers under constant revision as weather and hunger press the same communities from different directions."
chaosx.news.87.a: "The exposed districts wait."
chaosx.news.88.t: "Skyfall Over [natural_disaster_news_state.GetName]"
chaosx.news.88.d: "Officials in [FROM.GetNameDef] confirm that [natural_disaster_news_state.GetName] has entered a skyfall emergency. Cratered routes, scattered fires, and crowded impact shelters have forced the recovery command to treat every rail yard and hospital approach as part of the same disaster field."
chaosx.news.88.a: "Watch the sky."
chaosx.news.89.t: "Storm Corridor Crosses [natural_disaster_news_state.GetName]"
chaosx.news.89.d: "The latest [FROM.GetNaturalDisasterNewsFamilyName] reports from [FROM.GetNameDef] place [natural_disaster_news_state.GetName] on the active corridor. Forecast stations, shelters, and rail junctions are moving faster than the paperwork as the system threatens to cut a path into the next district."
chaosx.news.89.a: "The corridor is still moving."
chaosx.news.90.t: "Ashfall Darkens [natural_disaster_news_state.GetName]"
chaosx.news.90.d: "[FROM.GetNameDef] reports that ash from a [FROM.GetNaturalDisasterNewsFamilyName] has settled across [natural_disaster_news_state.GetName]. Airfields, water stores, valleys, and food routes now sit inside one emergency map, and every delayed convoy raises the risk of a longer crisis."
chaosx.news.90.a: "The ash keeps falling."

