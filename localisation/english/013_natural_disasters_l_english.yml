natural_disaster_deploy_rescue_columns: "Deploy Rescue Columns"
natural_disaster_deploy_rescue_columns_desc: "Send trained crews, medical stores, and route guides into a disaster state before local recovery loses its first days."
natural_disaster_deploy_rescue_columns_tt: "Reduces local recovery pressure, adds temporary rescue support to §Y[FROM.GetName]§!, and helps keep the stabilization mission under control."
natural_disaster_clear_blocked_routes: "Clear Blocked Routes"
natural_disaster_clear_blocked_routes_desc: "Open roads, bridges, rail approaches, and passable service lanes so relief can move without waiting for a full reconstruction program."
natural_disaster_clear_blocked_routes_tt: "Repairs transport pressure in §Y[FROM.GetName]§! and removes one layer of disaster recovery strain."
natural_disaster_restore_supply_lifelines: "Restore Supply Lifelines"
natural_disaster_restore_supply_lifelines_desc: "Prioritize depots, rails, and field stores so troops and civilians do not compete for the same broken road."
natural_disaster_restore_supply_lifelines_tt: "Adds reconstruction work in §Y[FROM.GetName]§! and lowers the chance that the recovery mission fails."
natural_disaster_reopen_ports_and_airfields: "Reopen Ports and Airfields"
natural_disaster_reopen_ports_and_airfields_desc: "Harbors, airstrips, and service roads can carry relief faster than damaged inland routes if crews reach them in time."
natural_disaster_reopen_ports_and_airfields_tt: "Repairs port and airfield access in §Y[FROM.GetName]§! and reduces local aftermath pressure."
natural_disaster_import_food_and_water: "Import Food and Water"
natural_disaster_import_food_and_water_desc: "Move drinking water, fuel, rations, and temporary kitchens into states where ordinary distribution has broken."
natural_disaster_import_food_and_water_tt: "Stabilizes civilian relief in §Y[FROM.GetName]§! and helps prevent the disaster season from turning into famine pressure."
natural_disaster_cut_firebreaks: "Cut Firebreaks"
natural_disaster_cut_firebreaks_desc: "Use infantry tools, support equipment, and local route knowledge to separate settlements and industry from advancing fire."
natural_disaster_cut_firebreaks_tt: "Reduces wildfire recovery pressure in §Y[FROM.GetName]§! and helps protect local infrastructure."
natural_disaster_clear_ash_and_dust: "Clear Ash and Dust"
natural_disaster_clear_ash_and_dust_desc: "Keep engines, depots, water points, and airfield surfaces from failing under ash, sand, or choking dust."
natural_disaster_clear_ash_and_dust_tt: "Clears volcanic, ashfall, and dust-storm pressure in §Y[FROM.GetName]§!."
natural_disaster_evacuate_predicted_path: "Evacuate Predicted Path"
natural_disaster_evacuate_predicted_path_desc: "Move civilians and essential staff before a tsunami warning, storm corridor, or abnormal impact zone becomes an impact report."
natural_disaster_evacuate_predicted_path_tt: "Reduces severe and abnormal aftermath pressure in §Y[FROM.GetName]§! and helps the country survive the next pulse."

