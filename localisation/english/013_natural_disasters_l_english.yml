natural_disaster.event_details.description: "Rivers burst their banks, faults split open, storms tear through rail lines, ash buries farms, and wildfires outrun the roads. Each disaster leaves a local fight to rescue survivors, steady the region, and rebuild before the next emergency arrives."
natural_disaster.evolution.type: "Disaster Escalation"
natural_disaster.evolution.stage_1.title: "Wider Disaster Seasons"
natural_disaster.evolution.stage_1.body: "Bad seasons bring several disasters close together. Rescue crews, supplies, and safe roads become harder to share when every region seems to need them at once."
natural_disaster.evolution.stage_2.title: "Regional Cascades"
natural_disaster.evolution.stage_2.body: "The damage spills across state lines. Broken transport, hunger, disease, refugees, and exhausted reconstruction crews turn one ruined region into a problem for all its neighbors."
natural_disaster.evolution.stage_3.title: "Abnormal Paths"
natural_disaster.evolution.stage_3.body: "The disasters begin moving in impossible ways. Ruptures, meteors, ash clouds, storms, tornadoes, and tsunamis travel across whole regions, giving countries only a rough idea of where the next blow will land."
natural_disaster.evolution.summary: "Chaos Tier: [GetEventsLogSelectedEvolutionTierView]\nEvolution Stage: §Y[GetEventsLogSelectedEvolutionStageView]§!"
chaosx_super_event.67.t: "NO FIRM GROUND"
chaosx_super_event.67.q: "The earth is utterly broken. The earth is torn apart. (Isaiah 24:19)"
chaosx_super_event.67.a: "No soil offers escape."
chaosx_super_event.67.d: "Connected ruptures are tearing through distant regions in a single abnormal sequence. Rails buckle, bridges separate, ports fail, and the next shock no longer belongs to one fault or one country."
chaosx_super_event.68.t: "ASH AT NOON"
chaosx_super_event.68.q: "The ashes now began to fall upon us. (Pliny the Younger)"
chaosx_super_event.68.a: "Shake off the ash."
chaosx_super_event.68.d: "An eruption has overrun every evacuation zone drawn for it. Ash turns day to night across several regions, and pyroclastic flows, buried valleys, failed crops, and grounded air routes spread well beyond the first vent."
chaosx_super_event.69.t: "THE BURNING FIRMAMENT"
chaosx_super_event.69.q: "The heavens themselves blaze forth the death of princes. (William Shakespeare)"
chaosx_super_event.69.a: "Who is able to stand?"
chaosx_super_event.69.d: "More fragments follow the first impact. Fire trails cross the sky toward separated districts, dividing rescue forces between craters, burning settlements, and cut communications."
chaosx_super_event.70.t: "THE FRETFUL ELEMENTS"
chaosx_super_event.70.q: "Blow, winds, and crack your cheeks! Rage! blow! (William Shakespeare)"
chaosx_super_event.70.a: "Here's a night pities neither wise men nor fools."
chaosx_super_event.70.d: "A destructive corridor is crossing borders without dispersing. Tornadoes, floodwater, fire, and violent wind arrive in turn, and observers race to name the next states in its path."
chaosx_super_event.71.t: "OLD STORIES CEASE TO BE INCREDIBLE"
chaosx_super_event.71.q: "Old stories of occurrences handed down by tradition, but scantily confirmed by experience, suddenly ceased to be incredible. (Thucydides)"
chaosx_super_event.71.a: "The time is out of joint."
chaosx_super_event.71.d: "Disasters now follow paths no earlier season produced. Storms, quakes, and floods strike the same regions in turn, and governments must work out from the ground where the next one will land."
chaosx_super_event.72.t: "BELOW THE STONE"
chaosx_super_event.72.q: "There is nothing in the world more soft and weak than water ... for attacking things that are firm and strong there is nothing that can take precedence of it. (Laozi)"
chaosx_super_event.72.a: "Remember the high-water stones."
chaosx_super_event.72.d: "The sea has drawn back from one harbor and warnings are running along several coasts. Each wave that lands leaves the next ports counting the hours until the surge reaches them."
chaosx.nr13.4.t: "The [?natural_disaster_abnormal_notice_state.GetNaturalDisasterFamilyName] Path Turns Toward [?natural_disaster_abnormal_notice_state.GetName]"
chaosx.nr13.4.d: "The abnormal sequence has placed [?natural_disaster_abnormal_notice_state.GetName] in its active path. Field reports identify [?natural_disaster_abnormal_notice_state.GetNaturalDisasterDamageSummary] as the immediate danger. The path map shows the other threatened states, the expected order of impact, chain risks, and the recovery work already underway."
chaosx.nr13.4.a: "Open the path map."
chaosx.nr13.4.b: "Keep the warning with the aftermath cards."
chaosx.nr13.126.t: "No New Disaster Front Forms"
chaosx.nr13.126.d: "No controlled state in this country meets the selected disaster's terrain and population requirements. Choose a different country or disaster."
chaosx.nr13.126.a: "Choose another country or disaster."
chaosx.nr13.127.t: "The Barrage Paths Break Apart"
chaosx.nr13.127.d: "The selected disaster cannot reach a suitable state under this country's control. Choose another country or a disaster suited to its geography."
chaosx.nr13.127.a: "Choose another country or disaster."
chaosx.nr13.128.t: "No Relief Card Is Available"
chaosx.nr13.128.d: "The selected country has no open recovery card that can receive this relief. The operation was not dispatched, and no supplies were charged."
chaosx.nr13.128.a: "Understood."
natural_disaster_review_abnormal_path_map: "Review the Abnormal Path"
natural_disaster_review_abnormal_path_map_desc: "Open the abnormal path map when a moving rupture, storm, eruption, meteor fall, or tsunami sequence threatens the country. The map shows the same warnings and recovery work as the aftermath decisions."
natural_disaster_review_abnormal_path_map_tt: "Shows the selected abnormal disaster sequence with its ordered states, scheduled impacts, active warnings, follow-up risks, severity, and recovery work."
