natural_disaster_news_desc_unknown: "Damage in [natural_disaster_news_state.GetName] is spreading faster than the first counts can settle. Relief columns are moving through broken roads, damaged buildings, and displaced families."
natural_disaster_news_desc_earthquake: "Rail beds, roads, and buildings in [natural_disaster_news_state.GetName] have cracked under a sharp earthquake. Relief columns are moving toward collapsed districts and blocked service routes."
natural_disaster_news_desc_flood: "Floodwater has crossed depots, bridges, and low streets in [natural_disaster_news_state.GetName]. Convoys are being redirected while crews search for passable roads and dry shelters."
natural_disaster_news_desc_tropical_cyclone: "A tropical cyclone has pushed through [natural_disaster_news_state.GetName], tearing at ports, roads, airfields, and shelters. Coastal traffic is slowing as inland damage reports arrive."
natural_disaster_news_desc_thunderstorm: "A severe thunderstorm has torn through [natural_disaster_news_state.GetName]. Lightning, wind, and sudden flooding have cut services across the struck districts."
natural_disaster_news_desc_hailstorm: "Heavy hail has battered [natural_disaster_news_state.GetName], breaking roofs, depots, fields, and local roads. Repair crews are moving before ruined stores become a longer shortage."
natural_disaster_news_desc_extreme_wind: "Extreme wind has crossed [natural_disaster_news_state.GetName], scattering debris across roads, airfields, and exposed settlements. Transport is slowing around downed lines and blocked approaches."
natural_disaster_news_desc_wildfire: "Wildfire has spread through [natural_disaster_news_state.GetName], pushing smoke over roads, depots, and nearby towns. Firebreak crews are trying to keep the flames away from industry and shelters."
natural_disaster_news_desc_drought: "Drought pressure in [natural_disaster_news_state.GetName] has reached wells, fields, and distribution routes. Food and water convoys are being prepared before local shortages harden."
natural_disaster_news_desc_dust_storm: "A sand and dust storm has buried routes across [natural_disaster_news_state.GetName]. Engines, airfields, depots, and road columns are struggling through choking dust."
natural_disaster_news_desc_blizzard: "A blizzard has cut through [natural_disaster_news_state.GetName], closing passes and slowing rail work. Shelter and supply routes are under pressure as snow blocks the first response."
natural_disaster_news_desc_heat_wave: "Heat has settled over [natural_disaster_news_state.GetName], straining water, shelter, and workplaces. Clinics and transport crews are moving around the hottest districts first."
natural_disaster_news_desc_cold_wave: "A cold wave has frozen roads, rails, and shelters across [natural_disaster_news_state.GetName]. Fuel, food, and repair crews are being pushed toward the worst-hit districts."
natural_disaster_news_desc_dry_mass_movement: "A dry landslide has blocked routes in [natural_disaster_news_state.GetName]. Broken slopes, buried roads, and damaged service lines are slowing the first relief columns."
natural_disaster_news_desc_wet_mass_movement: "Mud has swept through roads and settlements in [natural_disaster_news_state.GetName]. Relief crews are searching for firm ground as supply routes sink under debris."
natural_disaster_news_desc_volcanic_eruption: "A volcanic eruption has thrown ash across [natural_disaster_news_state.GetName]. Airfields, roads, water points, and farms are being covered as evacuation routes fill."
natural_disaster_news_desc_tsunami: "A tsunami has struck [natural_disaster_news_state.GetName], damaging harbors, coastal roads, depots, and low districts. Survivors are moving inland as the water pulls wreckage back through the streets."
natural_disaster_news_desc_avalanche: "An avalanche has fallen across [natural_disaster_news_state.GetName], burying routes and cutting settlements off from supply. Rescue teams are moving through snow, stone, and broken timber."
natural_disaster_news_desc_glacial_outburst: "A glacial outburst flood has rushed into [natural_disaster_news_state.GetName]. Bridges, rail approaches, and low settlements are being hit by water carrying ice and debris."
natural_disaster_news_desc_sinkhole: "A sinkhole collapse has torn open ground in [natural_disaster_news_state.GetName]. Roads, service lines, and nearby buildings are failing around the new breaks."
natural_disaster_news_desc_limnic_eruption: "A limnic eruption has choked parts of [natural_disaster_news_state.GetName]. Villages near the water are clearing out as rescue crews search for safe routes through the low ground."
natural_disaster_news_desc_meteor_shower: "Meteor strikes have hit [natural_disaster_news_state.GetName], leaving fires, craters, and damaged routes across scattered districts. Night travel is slowing as people watch the sky."
natural_disaster_news_desc_global_rupture: "The ground under [natural_disaster_news_state.GetName] has split in a rupture that does not match ordinary local faults. Rails, roads, and districts are breaking across lines that were never marked on maps."
natural_disaster_news_desc_massive_eruption: "A massive eruption has darkened [natural_disaster_news_state.GetName], covering fields, roads, airfields, and water points with ash. Evacuation columns are moving under a sky that will not clear."
natural_disaster_news_desc_storm_corridor: "A moving storm corridor has crossed [natural_disaster_news_state.GetName], pulling damage along roads, airfields, and exposed settlements. Communities in its path are clearing out before the next strike."

natural_disaster_response_category: "Disaster Response"
natural_disaster_response_category_desc: "Active recovery states: §Y[?natural_disaster_open_recovery_states|0]§!\nLatest disaster family: §Y[GetNaturalDisasterLatestFamilyLabel]§!\nUse rescue, transport, supply, shelter, and evacuation work to reduce aftermath pressure before the stabilization and reconstruction missions close."
natural_disaster_gui_title: "Disaster Response"
