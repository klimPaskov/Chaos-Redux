l_english:
gods_of_africa_industry_text_empty: ""
gods_of_africa_industry_terms: "\n\nPaying the remaining [?gods_of_africa_demand_remaining|3] political power funds [?gods_of_africa_industry_full_new_days|0] more days of +[?constant:gods_of_africa_industry.repair_speed|%0] civilian-factory repair speed in [?gods_of_africa_industry_site.GetName], toward [?gods_of_africa_industry_service_days|0] paid days for the full [?gods_of_africa_industry_quote|3] quote. Africa must retain control of the site and at least [?constant:gods_of_africa_industry.available_project_factory_floor|0] civilian factory available for projects. Support ends when its paid time expires or the site's civilian factories finish repairing."
gods_of_africa_industry_terms_completed: "\n\nCivilian factories in [?gods_of_africa_industry_site.GetName] have finished repairing. The remaining [?gods_of_africa_demand_remaining|3] political power settles the agreed funding without adding repair days."
gods_of_africa_industry_partial_terms: "\n\nPaying [?gods_of_africa_partial_payment_amount|3] political power funds [?gods_of_africa_industry_partial_new_days|0] more days of +[?constant:gods_of_africa_industry.repair_speed|%0] civilian-factory repair speed in [?gods_of_africa_industry_site.GetName]. Africa must retain control of the site and at least [?constant:gods_of_africa_industry.available_project_factory_floor|0] civilian factory available for projects. Support ends when its paid time expires or the site's civilian factories finish repairing."
gods_of_africa_industry_partial_terms_completed: "\n\nCivilian factories in [?gods_of_africa_industry_site.GetName] have finished repairing. This [?gods_of_africa_partial_payment_amount|3] political-power payment reduces the agreed balance without adding repair days."
gods_of_africa_industry_response_paid: "\n\nThe payment funds [?gods_of_africa_last_response_industry_new_days|0] more days of +[?constant:gods_of_africa_industry.repair_speed|%0] civilian-factory repair speed in [?gods_of_africa_last_response_industry_site.GetName]. Africa has received [?gods_of_africa_last_response_industry_funded|3] of the agreed [?gods_of_africa_last_response_industry_quote|3] political power, funding [?gods_of_africa_last_response_industry_granted_days|0] of [?gods_of_africa_last_response_industry_service_days|0] service days in total. Support ends at its paid expiry or when the site's civilian factories finish repairing."
gods_of_africa_industry_response_completed: "\n\nCivilian factories in [?gods_of_africa_last_response_industry_site.GetName] have finished repairing. Africa has received [?gods_of_africa_last_response_industry_funded|3] of the agreed [?gods_of_africa_last_response_industry_quote|3] political power. This response adds no repair days."
gods_of_africa_industry_response_retired: "\n\nAfrica received [?gods_of_africa_last_response_industry_funded|3] of the agreed [?gods_of_africa_last_response_industry_quote|3] political power for [?gods_of_africa_last_response_industry_site.GetName]. Any paid support keeps its original expiry and ends when the factories finish repairing or the original African government loses the site."
gods_of_africa_industry_response_substitute: "\n\nThe alternative tribute adds no repair days in [?gods_of_africa_last_response_industry_site.GetName]. Any paid support keeps its own expiry and ends if the site finishes repairing or Africa loses the site."
gods_of_africa_industry_response_unchanged: "\n\nThis response adds no repair days in [?gods_of_africa_last_response_industry_site.GetName]. Any paid support keeps its own expiry and ends if the site finishes repairing or Africa loses the site."
gods_of_africa_industry_lapsed_report: "Africa can no longer receive the agreed industrial funding. The demand has ended with [GetGodsOfAfricaResponseBalance] unpaid, without a penalty for refusal or credit for fulfilment."
gods_of_africa_industry_undelivered_report: "Africa could not receive this industrial payment. No payment is credited and the remaining balance stays due."
gods_of_africa_industry_repair_program: "Funded Civilian Factory Repairs"
gods_of_africa_industry_repair_program_desc: "Foreign tribute funds faster repair of damaged civilian factories in this state until the paid term expires or those factories finish repairing. Africa must retain the site."
gods_of_africa_industry_unavailable_tt: "The agreed African repair site must remain under its recipient's ownership and control, with its core status and the original funding agreement intact. Unfinished repairs require civilian factory capacity available for projects and a payment that funds further service. If repairs are already complete, their paid completion must be confirmed before the remaining funding can be settled. We must retain [?constant:gods_of_africa_value.capacity_floor_industry|3] political power after payment."
