SCO_independence_wave_territorial_commandant_desc: "A Scottish-born Black Watch officer commanding the 52nd (Lowland) Division, Victor Morven Fortune brings territorial command experience to Scotland's emergency defence."
WLS_independence_wave_national_council: "J. H. Thomas"
WLS_independence_wave_national_council_desc: "A Welsh-born Newport trade-union leader and Labour minister, J. H. Thomas gives the National Council an experienced civic voice while its emergency institutions take shape."
