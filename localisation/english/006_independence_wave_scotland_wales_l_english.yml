sco_divided_coastal_command: "Divided Coastal Command"
sco_divided_coastal_command_desc: "Civil offices, territorial commanders, and port authorities still issue competing orders. Until the shipping ledger and central belt are joined under one service, every convoy carries the cost of divided command."
sco_north_atlantic_state_service: "North Atlantic State Service"
sco_north_atlantic_state_service_desc: "A single civil service now joins the central belt, the firths, and the northern ports. Maritime administration gives the state a reliable spine without surrendering local authority."
sco_constitutional_convention: "Constitutional Convention"
sco_constitutional_convention_desc: "The convention binds executive authority to an elected chamber and a public settlement of powers."
sco_workers_commonwealth_charter: "Workers' Commonwealth Charter"
sco_workers_commonwealth_charter_desc: "Factory committees, dock unions, and local councils coordinate production through a national congress."
sco_crown_and_convention_settlement: "Crown and Convention Settlement"
sco_crown_and_convention_settlement_desc: "Traditional authority survives through a compact with the civic convention and the country's local institutions."
sco_emergency_territorial_directorate: "Emergency Territorial Directorate"
sco_emergency_territorial_directorate_desc: "Territorial commands coordinate training, supply, and civil defense while the emergency endures."

wls_divided_valleys_administration: "Divided Valleys Administration"
wls_divided_valleys_administration_desc: "Rail offices, coalfield committees, and language services are divided between north and south. The state exists, but its orders do not yet travel cleanly from one valley to the next."
wls_bilingual_coal_and_rail_compact: "Bilingual Coal and Rail Compact"
wls_bilingual_coal_and_rail_compact_desc: "A bilingual service joins the coalfields, ports, railways, and mountain districts under shared law and dependable public accounts."
wls_constitutional_national_council: "Constitutional National Council"
wls_constitutional_national_council_desc: "A representative national council balances local government with a responsible executive."
wls_workers_valleys_charter: "Workers' Valleys Charter"
wls_workers_valleys_charter_desc: "Valley councils and industrial unions direct reconstruction through a common national charter."
wls_cultural_guardians_settlement: "Cultural Guardians Settlement"
wls_cultural_guardians_settlement_desc: "Language, law, and historic institutions are entrusted to a council of guardians within a national settlement."
wls_emergency_mountain_directorate: "Emergency Mountain Directorate"
wls_emergency_mountain_directorate_desc: "A unified mountain command coordinates transport, reserve formations, and the defense of the interior."

independence_wave_sco_state_category: "The Scottish Founding Settlement"
independence_wave_sco_state_category_desc: "§YStatehood Ledger§!\nLegitimacy: §Y[?independence_wave_legitimacy|0]§!  Recognition: §Y[?independence_wave_recognition|0]§!\nCapacity: §Y[?independence_wave_capacity|0]§!  Security: §Y[?independence_wave_security|0]§!  Instability: §Y[?independence_wave_instability|0]§!\n\nShipping Authority: §Y[?independence_wave_sco_shipping_authority|0]§!\n\nThe central belt, territorial command, and North Atlantic ports must answer to one public authority."
independence_wave_wls_state_category: "The Welsh Founding Settlement"
independence_wave_wls_state_category_desc: "§YStatehood Ledger§!\nLegitimacy: §Y[?independence_wave_legitimacy|0]§!  Recognition: §Y[?independence_wave_recognition|0]§!\nCapacity: §Y[?independence_wave_capacity|0]§!  Security: §Y[?independence_wave_security|0]§!  Instability: §Y[?independence_wave_instability|0]§!\n\nNorth-South Integration: §Y[?independence_wave_wls_north_south_integration|0]§!\nBilingual Service: §Y[?independence_wave_wls_bilingual_service|0]§!\n\nThe railways, coalfields, public language service, and mountain districts must be bound into one state."

independence_wave_sco_reconnect_central_belt: "Reconnect the Central Belt"
independence_wave_sco_reconnect_central_belt_desc: "Restore the administrative and freight links between the capital, the Clyde, and the Forth so orders and supplies can cross the country's industrial heart."
independence_wave_sco_organize_firth_convoys: "Organize the Firth Convoys"
independence_wave_sco_organize_firth_convoys_desc: "Publish convoy schedules, port priorities, and escort rules that connect coastal traffic with the state ledger."
independence_wave_sco_settle_british_asset_ledgers: "Settle the British Asset Ledgers"
independence_wave_sco_settle_british_asset_ledgers_desc: "Negotiate the status of public property, pensions, customs accounts, and transport obligations with our former host."
independence_wave_sco_unify_territorial_command: "Unify the Territorial Command"
independence_wave_sco_unify_territorial_command_desc: "Place depot guards, coastal watchers, and territorial formations under a single accountable command."
independence_wave_sco_ratify_constitutional_convention: "Ratify the Constitutional Convention"
independence_wave_sco_ratify_constitutional_convention_desc: "Turn the civic convention into an elected constitutional government with a responsible ministry."
independence_wave_sco_charter_workers_commonwealth: "Charter the Workers' Commonwealth"
independence_wave_sco_charter_workers_commonwealth_desc: "Give the dock unions, factory committees, and workers' councils a national charter of government."
independence_wave_sco_settle_crown_and_convention: "Settle Crown and Convention"
independence_wave_sco_settle_crown_and_convention_desc: "Reconcile inherited authority with the convention through a public compact of limited powers and national duties."
independence_wave_sco_establish_emergency_directorate: "Establish the Emergency Directorate"
independence_wave_sco_establish_emergency_directorate_desc: "Entrust the territorial command with emergency government until the frontier and shipping routes are secure."
independence_wave_sco_choose_celtic_cooperation: "Choose Celtic Cooperation"
independence_wave_sco_choose_celtic_cooperation_desc: "Orient our regional ambition toward a compact of the Celtic nations, built through consent and shared institutions."
independence_wave_sco_choose_north_atlantic_compact: "Choose the North Atlantic Compact"
independence_wave_sco_choose_north_atlantic_compact_desc: "Orient our regional ambition toward the northern sea lanes and the states that depend upon them."
independence_wave_sco_convene_maritime_conference: "Convene the Maritime Conference"
independence_wave_sco_convene_maritime_conference_desc: "Invite eligible partners to settle the terms of the selected regional union and submit them to the wider independence network."

independence_wave_wls_reconnect_north_south_rail: "Reconnect the North-South Railway"
independence_wave_wls_reconnect_north_south_rail_desc: "Give the national administration a dependable route between northern districts, the central mountains, and the southern coalfields."
independence_wave_wls_settle_bilingual_services: "Settle the Bilingual Services"
independence_wave_wls_settle_bilingual_services_desc: "Establish equal Welsh and English public service across courts, rail offices, schools, and military administration."
independence_wave_wls_guard_coalfield_corridors: "Guard the Coalfield Corridors"
independence_wave_wls_guard_coalfield_corridors_desc: "Coordinate railway guards, depot watches, and mountain patrols around the country's industrial arteries."
independence_wave_wls_settle_british_property_board: "Settle the British Property Board"
independence_wave_wls_settle_british_property_board_desc: "Resolve public property, pensions, railway accounts, and border obligations with our former host."
independence_wave_wls_ratify_national_council: "Ratify the National Council"
independence_wave_wls_ratify_national_council_desc: "Entrust an elected national council with a responsible ministry and guaranteed local government."
independence_wave_wls_charter_workers_valleys: "Charter the Workers' Valleys"
independence_wave_wls_charter_workers_valleys_desc: "Unite valley councils and industrial unions in a national workers' commonwealth."
independence_wave_wls_settle_cultural_guardians: "Settle the Cultural Guardians"
independence_wave_wls_settle_cultural_guardians_desc: "Bind cultural authority, local law, and the national administration through a council of guardians."
independence_wave_wls_establish_emergency_directorate: "Establish the Mountain Directorate"
independence_wave_wls_establish_emergency_directorate_desc: "Give a unified mountain command temporary authority over defense, transport, and reserve mobilization."
independence_wave_wls_convene_celtic_council: "Convene the Celtic Council"
independence_wave_wls_convene_celtic_council_desc: "Call eligible Celtic partners to negotiate a common state and submit its settlement to the wider independence network."

independence_wave_scotland_wales_administrative_project_effect_tt: "Strengthens the package's civil authority and improves §YLegitimacy§!, §YCapacity§!, and §YSecurity§! while reducing §YInstability§!."
independence_wave_sco_shipping_project_effect_tt: "Strengthens §YShipping Authority§! and advances diplomatic recognition of the coastal state."
independence_wave_wls_bilingual_project_effect_tt: "Strengthens §YBilingual Service§!, improves north-south cooperation, and advances the founding settlement."
independence_wave_scotland_wales_security_project_effect_tt: "Strengthens package authority and improves §YSecurity§! while reducing §YInstability§!."
independence_wave_scotland_wales_host_settlement_effect_tt: "Reduces outstanding claims, hostility, property disputes, and reconquest fear with the former host while strengthening the border settlement."
independence_wave_scotland_wales_route_government_effect_tt: "Installs the government promised by the selected shared route and grants its package-specific national spirit."
independence_wave_sco_celtic_choice_effect_tt: "Selects the §YCeltic Cooperation State§! as Scotland's regional formable family."
independence_wave_sco_north_atlantic_choice_effect_tt: "Selects the §YNorth Atlantic Compact§! as Scotland's regional formable family."
independence_wave_scotland_wales_conference_effect_tt: "The delegates prepare the selected union ledgers and submit them to the shared congress vote. A successful vote improves network standing and leaves the union charter ready for the final proclamation."

independence_wave_sco_reconnect_central_belt_focus: "Reconnect the Central Belt"
independence_wave_sco_reconnect_central_belt_focus_desc: "The industrial heart must carry freight, orders, and revenue between both firths and the capital."
independence_wave_sco_reconnect_central_belt_tt: "Greatly strengthens §YShipping Authority§!, advances civil capacity, and improves stability."
independence_wave_sco_charter_north_atlantic_shipping_focus: "Charter North Atlantic Shipping"
independence_wave_sco_charter_north_atlantic_shipping_focus_desc: "A public maritime charter will join port administration, coastal convoys, and northern sea policy."
independence_wave_sco_charter_north_atlantic_shipping_tt: "Greatly strengthens §YShipping Authority§!, advances recognition, and grants naval experience."
independence_wave_sco_settle_crown_and_convention_focus: "Settle Crown and Convention"
independence_wave_sco_settle_crown_and_convention_focus_desc: "Neither inherited authority nor the civic convention can govern alone; their duties must be written in public law."
independence_wave_sco_settle_crown_and_convention_tt: "Strengthens §YShipping Authority§! and delivers a major public settlement."
independence_wave_sco_convene_celtic_maritime_conference_focus: "Convene a Celtic Maritime Conference"
independence_wave_sco_convene_celtic_maritime_conference_focus_desc: "The western nations and northern sea routes share enough dangers to justify a permanent table of cooperation."
independence_wave_sco_convene_celtic_maritime_conference_tt: "Improves every statehood value and strengthens our standing in the independence network."
independence_wave_sco_found_north_atlantic_state_service_focus: "Found the North Atlantic State Service"
independence_wave_sco_found_north_atlantic_state_service_focus_desc: "A mature state needs one service capable of carrying civil authority from the central belt to every port and island district."
independence_wave_sco_found_north_atlantic_state_service_tt: "Greatly strengthens §YShipping Authority§!, grants command power, and secures the state-service milestone."

independence_wave_wls_reconnect_north_and_south_focus: "Reconnect North and South"
independence_wave_wls_reconnect_north_and_south_focus_desc: "A national government cannot survive if the mountains divide its railways, accounts, and public service."
independence_wave_wls_reconnect_north_and_south_tt: "Greatly strengthens §YNorth-South Integration§!, strengthens §YBilingual Service§!, and advances civil capacity."
independence_wave_wls_charter_coal_and_rail_focus: "Charter Coal and Rail"
independence_wave_wls_charter_coal_and_rail_focus_desc: "The coalfields and railways will share revenue rules, maintenance priorities, and public oversight."
independence_wave_wls_charter_coal_and_rail_tt: "Greatly strengthens §YNorth-South Integration§!, strengthens §YBilingual Service§!, and improves stability."
independence_wave_wls_establish_bilingual_service_focus: "Establish the Bilingual Service"
independence_wave_wls_establish_bilingual_service_focus_desc: "The state must speak clearly to every citizen in courts, schools, stations, and barracks."
independence_wave_wls_establish_bilingual_service_tt: "Greatly strengthens §YBilingual Service§!, strengthens §YNorth-South Integration§!, and delivers a major public settlement."
independence_wave_wls_secure_mountain_corridors_focus: "Secure the Mountain Corridors"
independence_wave_wls_secure_mountain_corridors_focus_desc: "The interior roads, rail cuts, and passes must remain open to national administration and territorial defense."
independence_wave_wls_secure_mountain_corridors_tt: "Strengthens §YNorth-South Integration§!, advances security, and grants army experience."
independence_wave_wls_convene_celtic_council_focus: "Convene the Celtic Council"
independence_wave_wls_convene_celtic_council_focus_desc: "A durable Welsh state can help shape a consent-based compact among the Celtic nations."
independence_wave_wls_convene_celtic_council_tt: "Improves every statehood value and strengthens our standing in the independence network."
