africa.event_log.scramble.recognition.title: "Recognition from [?global.events_log_view_actor_entries^events_log_history_index.GetName]"
africa.event_log.scramble.recognition.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] recognised Africa's continental settlement. [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName] remains the continental counterpart named in the agreement."
africa.event_log.scramble.conditional_recognition.title: "Conditional Recognition from [?global.events_log_view_actor_entries^events_log_history_index.GetName]"
africa.event_log.scramble.conditional_recognition.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] opened recognition talks with [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]. Recognition now depends on the guarantees and obligations placed before both governments."
africa.event_log.scramble.sanctions.title: "Sanctions from [?global.events_log_view_actor_entries^events_log_history_index.GetName]"
africa.event_log.scramble.sanctions.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] joined the sanctions coalition against [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]. The pressure remains part of the Scramble settlement."
africa.event_log.scramble.ultimatum.title: "Ultimatum from [?global.events_log_view_actor_entries^events_log_history_index.GetName]"
africa.event_log.scramble.ultimatum.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] issued an ultimatum to [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]. The demand is now part of the intervention and settlement docket."

africa.event_log.package.middle_east.title: "Middle Eastern Order: [?global.events_log_view_actor_entries^events_log_history_index.GetName]"
africa.event_log.package.middle_east.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] joined the Middle Eastern continental order administered by [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]."
africa.event_log.package.europe.title: "European Order: [?global.events_log_view_actor_entries^events_log_history_index.GetName]"
africa.event_log.package.europe.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] joined the European continental order administered by [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]."
africa.event_log.package.asia.title: "Asian Order: [?global.events_log_view_actor_entries^events_log_history_index.GetName]"
africa.event_log.package.asia.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] joined the Asian continental order administered by [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]."
africa.event_log.package.north_america.title: "North American Order: [?global.events_log_view_actor_entries^events_log_history_index.GetName]"
africa.event_log.package.north_america.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] joined the North American continental order administered by [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]."
africa.event_log.package.south_america.title: "South American Order: [?global.events_log_view_actor_entries^events_log_history_index.GetName]"
africa.event_log.package.south_america.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] joined the South American continental order administered by [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]."
africa.event_log.package.oceania.title: "Oceanian Order: [?global.events_log_view_actor_entries^events_log_history_index.GetName]"
africa.event_log.package.oceania.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] joined the Oceanian continental order administered by [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]."

africa.event_log.constituent.ratification.title: "[?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName] Ratifies the Compact"
africa.event_log.constituent.ratification.detail: "[?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName] ratified the compact offered by [?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName]. The government's consent remains part of the public settlement."
africa.event_log.constituent.refusal.title: "[?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName] Refuses the Compact"
africa.event_log.constituent.refusal.detail: "[?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName] refused the compact offered by [?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName]. The refusal remains part of the public record."
africa.event_log.constituent.withdrawal.title: "[?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName] Withdraws from the Compact"
africa.event_log.constituent.withdrawal.detail: "[?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName] withdrew from the compact administered by [?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName]. The withdrawal follows the recorded safeguards and leaves the government's sovereignty intact."
africa.event_log.package.successor.title: "[?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName] Continues [?global.events_log_view_actor_entries^events_log_history_index.GetName]"
africa.event_log.package.successor.detail: "[?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName] now carries [?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName]'s continental package. The transfer preserves the constitutional record without erasing the defeated government's history."
africa.event_log.package.exile.title: "Exile Preserves [?global.events_log_view_actor_entries^events_log_history_index.GetName]"
africa.event_log.package.exile.detail: "After the territorial government falls, [?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName]'s government-in-exile preserves the package's constitutional record. The exile remains a public disposition without creating a territorial settlement."
africa.event_log.package.breakup.title: "The [?global.events_log_view_actor_entries^events_log_history_index.GetName] Package Breaks Up"
africa.event_log.package.breakup.detail: "The package administered by [?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] has broken up after successor and exile paths failed. Its constituents return to separate sovereignty, while the African host retains the historical record."

africa.event_log.union.two_continent.title: "[?global.events_log_view_actor_entries^events_log_history_index.GetName] and [?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName] Form a Union"
africa.event_log.union.two_continent.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] and [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName] activated a two-continent union. Their autonomous constituents and withdrawal clauses remain part of the shared constitution."

africa.event_log.war.restore_constituent_sovereignty.title: "[?global.events_log_view_actor_entries^events_log_history_index.GetName] Opens a Sovereignty War"
africa.event_log.war.restore_constituent_sovereignty.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] opened a continental war against [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName] to restore constituent sovereignty. The objective is limited to the registered constitutional dispute."
africa.event_log.war.break_rival_compact.title: "[?global.events_log_view_actor_entries^events_log_history_index.GetName] Challenges a Rival Compact"
africa.event_log.war.break_rival_compact.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] opened a continental war against [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName] to break a rival compact. The war goal names the opposing package and its constitutional claim."
africa.event_log.war.constitutional_settlement.title: "[?global.events_log_view_actor_entries^events_log_history_index.GetName] Demands a Constitutional Settlement"
africa.event_log.war.constitutional_settlement.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] opened a continental war against [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName] to compel a constitutional settlement. The recorded objective does not erase the defender's public status."
africa.event_log.war.armistice.title: "A Continental Armistice between [?global.events_log_view_actor_entries^events_log_history_index.GetName] and [?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName]"
africa.event_log.war.armistice.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] and [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName] ended their continental war with a sovereign armistice. The rivalry and the constitutional question remain visible in the settlement."
africa.event_log.war.submission.title: "[?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName] Accepts a Continental Submission"
africa.event_log.war.submission.detail: "[?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName] accepted a confederal submission under terms imposed by [?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName]. The defeated government retains its public identity under a new constitutional status."
africa.event_log.war.constituent_release.title: "Constituents Released by [?global.events_log_view_actor_entries^events_log_history_index.GetName]"
africa.event_log.war.constituent_release.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] released the defeated package's constituent governments after the continental war with [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]. The former members return to separate sovereignty under the recorded settlement."
africa.event_log.war.prewar_settlement.title: "A Sovereign Settlement between [?global.events_log_view_actor_entries^events_log_history_index.GetName] and [?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName]"
africa.event_log.war.prewar_settlement.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] and [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName] accepted a sovereign constitutional settlement before their registered war opened. The rival claims remain visible under the agreed terms."

africa.event_log.the_world.unanimous_union.title: "The World: Unanimous Continental Union"
africa.event_log.the_world.unanimous_union.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] completed the constitutional agreement for a unanimous continental union and leads The World resolution. Continental governments now follow the settlement's public terms."
africa.event_log.the_world.last_standing.title: "The World: Last Standing Resolution"
africa.event_log.the_world.last_standing.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] survived as the last continental government and leads The World resolution. Its final settlement defines the new order."
africa.event_log.the_world.continental_campaign.title: "The World: Continental Campaign"
africa.event_log.the_world.continental_campaign.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] won the final continental campaign and leads the new world order. The settlement binds the continent's rival governments under its terms."

africa.event_log.host_succession.title: "The Charter Passes to [?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName]"
africa.event_log.host_succession.detail: "Before [?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] disappeared, its Charter mandate passed to [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]. The new host inherits the League's obligations, not the old government's land or cores."
africa.event_log.host_succession_suspended.title: "The Charter Host Seat Falls Silent"
africa.event_log.host_succession_suspended.detail: "The government that carried the Charter League was removed without a valid successor. Its obligations remain suspended until a lawful constitutional answer exists. The vacant mandate transfers neither territory nor sovereignty."
africa.event_log.host_succession_terminal.title: "The Charter League Reaches Its Final Settlement"
africa.event_log.host_succession_terminal.detail: "The successor that carried the Charter League was removed after the continuity mandate had been spent. The League's active business has closed, and its host seat will remain vacant."

africa.event_log.gods.activation.title: "The Gods of Africa Are Proclaimed"
africa.event_log.gods.activation.detail: "The African unifier has completed its consolidation and proclaimed the Gods of Africa. Foreign governments now face a lasting relationship shaped by tribute, protection, and restraint."
africa.event_log.gods.first_demand.title: "The First Tribute Is Requested"
africa.event_log.gods.first_demand.detail: "The African unifier has presented its first demand under the Gods of Africa. Its terms, deadline, and ways to answer are clear to the invited government."
africa.event_log.gods.first_punishment.title: "A Gods of Africa Punishment Is Recorded"
africa.event_log.gods.first_punishment.detail: "A missed demand draws a response shaped by Africa's Strength and the participant's Wrath. Even grave refusals do not always end in catastrophe."
africa.event_log.gods.defiance.title: "A Government Defies the Gods"
africa.event_log.gods.defiance.detail: "A government has permanently defied the Gods of Africa. Ordinary demands have ended for it, while punishment, protection withdrawal, and reconciliation remain possible."
africa.event_log.gods.protection.title: "Protection Is Granted"
africa.event_log.gods.protection.detail: "Africa has sent equipment and fuel to a reliable partner. Its protection pledge binds the two governments to a compact of mutual trust."
africa.event_log.gods.continental_settlement.title: "The Gods of Africa Enter Settlement"
africa.event_log.gods.continental_settlement.detail: "Africa has secured the continent and closed ordinary demands. Each surviving participant is remembered as Favored, Respected, Distrusted, or Enemy according to its conduct, and Favored and Respected governments are owed equipment and fuel from Africa's own stocks."
africa.event_log.gods.unifier_defeat.title: "The Gods of Africa Lose Their Authority"
africa.event_log.gods.unifier_defeat.detail: "The African unifier has been defeated or disappeared. Active demands, punishment, and protection ties have ended with its authority."
africa.event_log.gods.first_heavy_punishment.title: "Africa Strikes [?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName] Across the Nation"
africa.event_log.gods.first_heavy_punishment.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] delivered its heaviest punishment yet against [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName], one step short of catastrophe."
africa.event_log.gods.final_ultimatum.title: "Africa's Final Ultimatum to [?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName]"
africa.event_log.gods.final_ultimatum.detail: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] delivered a final ultimatum to [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]: hand back Africa's land and make peace, or pay an extraordinary settlement, before disaster falls."
africa.event_log.gods.catastrophe.title: "Catastrophe Falls on [?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName]"
africa.event_log.gods.catastrophe.detail: "After its final ultimatum was refused or left to expire, [?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] brought disaster and waves of civilian deaths upon [?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]."
africa.event_log.gods.victor_relegitimation.title: "A Victor Recognises the Gods Again"
africa.event_log.gods.victor_relegitimation.detail: "A former victor has voluntarily offered renewed recognition, and the African government has accepted. The agreement restores authority over that country while preserving its earlier victory and conduct."
