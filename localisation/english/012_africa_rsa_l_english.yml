chaosx.nr12.1200.t: "The Continental Coalition Takes the Interior"
chaosx.nr12.1200.d: "The dispute over Africa's future has broken the South African state in two. The Continental Coalition holds Pretoria and the Transvaal industrial base, claiming that the continental project cannot remain subordinate to an overseas alliance. The old ministries, ports, faction obligations, and most naval commands have rallied around the Allied Union Government at Cape Town.\n\nThe Coalition must protect civilians, secure a railway from the interior to a Cape or Natal port, preserve its industrial base, and win material support from two African governments before the war closes that mandate."
chaosx.nr12.1200.a: "The continental mandate will be proved under fire."

chaosx.nr12.1201.t: "The Allied Union Government Holds the Cape"
chaosx.nr12.1201.d: "The constitutional ministries have regrouped in Cape Town under the name Allied Union Government. They retain the old governing tradition, the pre-war chain of foreign obligation, the Cape and Natal ports, and the greater share of South Africa's naval strength. Their declaration calls the Pretoria coalition an illegal seizure that threatens both the Union and its allies."
chaosx.nr12.1201.a: "The Union and its lawful obligations will survive."

chaosx.nr12.1202.t: "A Request from the Continental Coalition"
chaosx.nr12.1202.d: "[FROM.GetNameDef] asks us to place matériel behind its claim to continental independence. Its envoys do not ask for annexation, command rights, or a faction pledge. They ask for a visible shipment that can keep civilians moving and the inland corridor supplied. Acceptance will place [ROOT.GetNameDef] among the African governments that sustained the Coalition during its founding war."
chaosx.nr12.1202.a: "Send matériel and recognise the continental claim."
chaosx.nr12.1202.b: "We will not enter South Africa's quarrel."

chaosx.nr12.1204.t: "The Cape Settlement"
chaosx.nr12.1204.d: "The Allied Union Government has fallen, but its foreign commitments cannot be erased by a victory parade. The remaining Allied belligerents have been separated from the South African war and bound by a truce. Cape Town and Natal now require a public settlement: a continental convention, a temporary Allied lease, or the closure of foreign bases. Each course will define whether the Coalition's first peace looks like independence, compromise, or exclusion."
chaosx.nr12.1204.a: "Convene a sovereign Cape convention."
chaosx.nr12.1204.b: "Permit temporary Allied access under a fixed lease."
chaosx.nr12.1204.c: "Close the ports to foreign bases."

chaosx.nr12.1205.t: "The Coalition Is Suppressed"
chaosx.nr12.1205.d: "The Allied Union Government has restored control over Pretoria and dissolved the Continental Coalition's public institutions. Its surviving organisers have crossed borders with correspondence, names, and fragments of the Charter project. The old South African route is closed, but one African government chosen from its established contacts may preserve a single council in exile."
chaosx.nr12.1205.a: "Restore the Union and disperse the coalition offices."

chaosx.nr12.1206.t: "The Continental Council in Exile"
chaosx.nr12.1206.d: "Couriers from the defeated Continental Coalition have reached [ROOT.GetNameDef]. They carry the League's founding mandate, surviving Charter agreements, constitutional papers, and a request to keep the continental project alive under local custody. Accepting the papers does not recreate the South African army. It grants one public opportunity to reconstitute the council under stricter oversight."
chaosx.nr12.1206.a: "Receive the papers and convene the surviving council."

chaosx.nr12.1208.t: "No Government Receives the Exiles"
chaosx.nr12.1208.d: "The Coalition's last couriers found no surviving independent African government among its established contacts able to receive the mandate. The Allied Union Government has restored the South African state, and the continental project has no lawful custodian through which to continue."
chaosx.nr12.1208.a: "The route ends with the defeated coalition."

chaosx.nr12.1209.t: "South Africa Breaks with the Alliance"
chaosx.nr12.1209.d: "The South African host has split between the Continental Coalition in Pretoria and the Allied Union Government at Cape Town. The latter retains the old faction bond and asks [ROOT.GetNameDef] for material support. The Coalition claims that Allied command over South African ports made peaceful continental independence impossible. We may back the Union, seek a narrow mediation, or keep our distance from the civil war."
chaosx.nr12.1209.a: "Supply the Allied Union Government."
chaosx.nr12.1209.b: "Offer mediation without recognising the Coalition."
chaosx.nr12.1209.c: "Keep the alliance clear of this quarrel."

africa_rsa_crisis_category: "South Africa's Continental Rupture"
africa_rsa_crisis_category_desc: "Manage civilian protection, the inland rail and port corridor, African support, the Cape settlement, and the single exile mandate created by South Africa's constitutional rupture."

africa_rsa_protect_civilian_corridor: "Protect the Inland Relief Corridor"
africa_rsa_protect_civilian_corridor_desc: "Assign trains, support equipment, civil administrators, and field command capacity to move civilians between the Transvaal interior and the contested coast. This is the civilian component of the Coalition's first proof."
africa_rsa_seek_regional_support: "Request Material Support from [FROM.GetNameDef]"
africa_rsa_seek_regional_support_desc: "Ask [FROM.GetNameDef] for a visible matériel shipment without demanding entry into the war, the faction, or the continental project. Two distinct African governments must accept."
africa_rsa_first_proof_mission: "Prove the Coalition's Civil-War Mandate"
africa_rsa_first_proof_mission_desc: "Before the deadline, protect civilians, hold the Transvaal industrial base, control a Cape or Natal port connected to the interior by an allied railway, and secure material support from two distinct African governments."
africa_rsa_enact_citizenship_land_milestone: "Enact the Citizenship and Land Settlement"
africa_rsa_enact_citizenship_land_milestone_desc: "Place equal civil status, protected residence, and an initial land claims board into the post-war settlement. Political capital and short-term stability will be spent to make the domestic clause binding."
africa_rsa_guarantee_neighbor_sovereignty: "Guarantee [FROM.GetNameDef]'s Sovereignty"
africa_rsa_guarantee_neighbor_sovereignty_desc: "Issue a public guarantee to an independent neighboring African government without annexation or a demand for membership. Together with the domestic settlement, this can recover a failed wartime mandate."
africa_rsa_terminate_base_lease_early: "Terminate the Allied Base Lease"
africa_rsa_terminate_base_lease_early_desc: "End the military-access clause granted in the Cape settlement before its fixed expiry and return both coastal base districts to ordinary sovereign administration."
africa_rsa_reconstitute_exile_council: "Reconstitute the Continental Council"
africa_rsa_reconstitute_exile_council_desc: "Spend political and command authority to publish the inherited mandate, seat the surviving delegates, and accept the oversight clause attached to the Coalition's defeat. This opportunity cannot be repeated."

