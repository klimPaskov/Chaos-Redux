africa_rsa_allied_branch_can_start_tt: "South Africa must host the Charter League, remain in an Allied framework, control Pretoria, Cape Town, and Natal, have a supported autonomy status, and possess an established independent African contact able to receive exiles if the Coalition is defeated."
africa_rsa_start_allied_civil_war_tt: "The original South African host becomes the player-led Continental Coalition. The Allied Union Government keeps the former government, faction relationship, subject status, Cape and Natal ports, and its allocated shares of the armed forces and stockpile."
africa_rsa_continental_coalition_opening_tt: "The Continental Coalition remains the Charter League host and begins from Pretoria. It leaves the old faction, abandons inherited external wars, and must capture a working route to a coastal port while protecting civilians and winning two African supporters."
africa_rsa_allied_union_opening_tt: "The Allied Union Government retains the pre-war government, faction, overlord relationship, Cape and Natal ports, §Y44%§! of the stockpile, §Y46%§! of the army, §Y72%§! of the navy, and §Y56%§! of the air force."
africa_rsa_regional_support_accept_tt: "Send §Y2%§! of the current equipment stockpile to the Continental Coalition and count [ROOT.GetNameDef] as one distinct African supporter."
africa_rsa_regional_support_refuse_tt: "[ROOT.GetNameDef] will not be counted among the Coalition's external supporters."
africa_rsa_cape_convention_tt: "Restore the pre-war capital, confirm sovereign control over Cape and Natal, increase Charter Authority and Continental Reach, and close every civil-war-related Allied conflict with a pairwise truce."
africa_rsa_temporary_base_lease_tt: "Grant the Allied faction leader temporary military access under a fixed two-year lease. Integration Burden and Colonial Pressure will rise, and the granted access will be removed at expiry unless ended earlier."
africa_rsa_closed_ports_tt: "Close Cape and Natal to foreign bases, increase Charter Authority, and accept higher Colonial Pressure. The civil-war settlement still grants each recorded belligerent a pairwise truce."
africa_rsa_loyalist_suppression_tt: "Restore the ordinary South African public identity and suppress the Coalition's institutions. If a valid established African patron survived, the Charter League's host mandate has already passed to that single exile custodian."
africa_rsa_exile_custodian_tt: "[ROOT.GetNameDef] receives the former host's public identity, surviving Charter agreements, constitutional settlement, and continental authority. Active South African operations do not transfer, and the recovery remains subject to oversight."
africa_rsa_no_exile_patron_tt: "No eligible government survived among the Coalition's established contacts. The continental project ends because no lawful custodian remains."
africa_rsa_allied_leader_support_tt: "Send §Y2%§! of the current equipment stockpile to the Allied Union Government and record material support from the former faction leader."
africa_rsa_allied_leader_mediate_tt: "Record an Allied mediation policy without forcing a war declaration or a territorial settlement."
africa_rsa_allied_leader_distance_tt: "Record that the former faction leader will neither supply the loyalists nor claim a role in the South African settlement."
africa_rsa_protect_civilian_corridor_tt: "Protect civilian movement through Pretoria, Cape Town, and Natal. The proof still requires physical control of the industrial interior, a working allied railway to a controlled port, and two African supporters."
africa_rsa_seek_regional_support_tt: "[FROM.GetNameDef] will receive a direct request. Acceptance grants matériel and one distinct supporter credit. Refusal grants no credit and cannot be replaced by counting the same government twice."
africa_rsa_first_proof_requirements_tt: "Protect civilians, secure two distinct African supporters, hold an industrial complex or arms factory in Transvaal, control a naval base in Cape or Natal, and maintain an allied-only railway connection between them."
africa_rsa_first_proof_success_tt: "Record the civilian, industrial, railway, port, and two-supporter evidence as the Coalition's completed first proof."
africa_rsa_citizenship_land_milestone_tt: "Establish the domestic citizenship and land milestone. A failed wartime proof still requires a sovereign guarantee to an independent neighboring African country."
africa_rsa_guarantee_neighbor_sovereignty_tt: "Guarantee [FROM.GetNameDef] without annexation. If the domestic citizenship and land milestone is also complete, recover the failed first proof under the post-war oversight clause."
africa_rsa_terminate_base_lease_tt: "Remove only the military access created by the temporary Cape lease and end the temporary base arrangement in Cape and Natal."
africa_rsa_reconstitute_exile_council_tt: "Recover the inherited first proof under mandatory oversight, preserve the remembered South African defeat, and use the single opportunity to continue the project in exile."

africa_rsa.event_log.opening_coalition.title: "The Continental Coalition takes the interior"
africa_rsa.event_log.opening_coalition.detail: "South Africa's rupture has left the Continental Coalition holding Pretoria and the Charter League mandate. Its first proof now begins under the pressure of an Allied-backed rival government."
africa_rsa.event_log.opening_union.title: "The Allied Union Government takes the coast"
africa_rsa.event_log.opening_union.detail: "The Allied Union Government has secured Cape and Natal with its inherited forces, stockpile, faction ties, and pre-war political identity intact."
africa_rsa.event_log.settlement_convention.title: "The Cape Convention is signed"
africa_rsa.event_log.settlement_convention.detail: "The Coalition has restored the pre-war capital and settled the South African rupture through a sovereign Cape Convention, with Cape and Natal returned to its authority."
africa_rsa.event_log.settlement_base_lease.title: "An Allied base lease is granted"
africa_rsa.event_log.settlement_base_lease.detail: "The settlement grants the Allied faction leader temporary access to Cape and Natal. The lease carries a defined expiry and leaves its political cost on the Coalition."
africa_rsa.event_log.settlement_closed_ports.title: "Cape and Natal close to foreign bases"
africa_rsa.event_log.settlement_closed_ports.detail: "The Coalition has closed Cape and Natal to foreign bases, accepting higher pressure in exchange for a settlement that keeps the coastal states sovereign."
africa_rsa.event_log.exile_continuation.title: "The Charter League continues in exile"
africa_rsa.event_log.exile_continuation.detail: "The defeated South African host has passed its surviving Charter League mandate to an established African custodian. The project continues under oversight rather than returning to the battlefield."
africa_rsa.event_log.no_exile_patron.title: "The South African mandate ends"
africa_rsa.event_log.no_exile_patron.detail: "The loyalist victory left no eligible established African custodian. Without a lawful patron, the South African Charter League mandate has ended."
