brilliant_scientist_cabinet_safety_board_effect_tt: "The §YCabinet Safety Board§! gains oversight of hazardous work.\nMandate: §R-5§!\nDependence: §R+10§!\nExposure: §G-5§!\nProject Capacity: §R-5§!"
