brilliant_scientist_protect_dissenting_scientists_effect_tt: "Dissenting scientists remain protected inside the Directorate.\nMandate: §R-5§!\nDependence: §G-5§!\nExposure: §R+5§!\nProject Capacity: §R-5§!\nIndependent Capacity: §G+10§!\nGrievance: §G-10§!\nSafety and legitimacy improve, but hazardous projects slow."
brilliant_scientist_dismiss_ethics_chair_effect_tt: "The ethics chair is dismissed.\nMandate: §G+5§!\nDependence: §R+10§!\nExposure: §G-5§!\nProject Capacity: §G+10§!\nIndependent Capacity: §R-5§!\nGrievance: §R+15§!\nWeaponisation accelerates while assistants and outside observers become more hostile."
brilliant_scientist_award_national_science_chair_effect_tt: "A national science chair leads the public university network.\nMandate: §G+5§!\nDependence: §G-5§!\nExposure: §R+10§!\nProject Capacity: §G+5§!\nIndependent Capacity: §G+10§!\nGrievance: §R+5§!\nPublic replication and regional prestige improve, but the network becomes a visible intelligence target."
brilliant_scientist_rotate_grants_among_institutions_effect_tt: "Grants rotate among the public institutions.\nDependence: §G-10§!\nProject Capacity: §R-5§!\nIndependent Capacity: §G+10§!\nGrievance: §G-5§!\nThe network becomes resilient, but concentrated progress slows."
brilliant_scientist_let_kruger_select_institutions_effect_tt: "Kruger selects the institutions and grant recipients.\nMandate: §G+10§!\nDependence: §R+10§!\nExposure: §G-5§!\nProject Capacity: §G+10§!\nIndependent Capacity: §R-5§!\nGrievance: §R+10§!\nProjects accelerate while excluded scholars become hostile."

brilliant_scientist_primary_campus_effect_tt: "The primary facility becomes a permanent research campus and gains one level of Infrastructure.\nMandate: §G+5§!\nDependence: §R+5§!\nExposure: §R+5§!\nProject Capacity: §G+10§!"
brilliant_scientist_prototype_works_effect_tt: "The primary facility gains a Military Factory and becomes the Directorate's prototype works.\nDependence: §R+5§!\nExposure: §R+5§!\nProject Capacity: §G+10§!"
brilliant_scientist_secondary_laboratory_effect_tt: "The selected state becomes the secondary laboratory and gains one level of Infrastructure.\nMandate: §G+5§!\nDependence: §R+5§!\nExposure: §R+5§!\nProject Capacity: §G+10§!"
brilliant_scientist_primary_relocation_effect_tt: "The transfer plan records the origin, destination, route, and current condition of the programme. It constructs no new Infrastructure, factories, facilities, or prototypes. The primary-site designation changes only if the move succeeds."
brilliant_scientist_primary_hardening_effect_tt: "The primary facility gains an Anti-Air installation and Land Fort.\nDependence: §R+5§!\nExposure: §G-5§!\nProject Capacity: §G+5§!"
brilliant_scientist_primary_repairs_effect_tt: "The state receives priority reconstruction support while the decision is active."

brilliant_scientist_foreign_approach_selected_tt: "The liaison office selects §Y[brilliant_scientist_foreign_actor.GetNameDef]§! as the current foreign approach."
brilliant_scientist_no_foreign_approach_available_tt: "No eligible foreign government is presently seeking access to the Directorate."
brilliant_scientist_controlled_research_access_effect_tt: "[brilliant_scientist_foreign_actor.GetNameDef] receives controlled research access.\nMandate: §G+5§!\nExposure: §R+10§!\nProject Capacity: §G+5§!"
brilliant_scientist_joint_laboratory_effect_tt: "A persistent joint laboratory is established with [brilliant_scientist_foreign_actor.GetNameDef].\nMandate: §G+5§!\nDependence: §G-5§!\nExposure: §R+10§!\nProject Capacity: §G+10§!"
brilliant_scientist_joint_laboratory_site_lost_tt: "The prospective partner no longer controls a viable laboratory site. The joint-laboratory agreement is not concluded."
brilliant_scientist_foreign_protection_effect_tt: "[brilliant_scientist_foreign_actor.GetNameDef] becomes the Directorate's foreign protection partner.\nMandate: §G+5§!\nDependence: §R+10§!\nExposure: §R+5§!\nProject Capacity: §G+5§!"
brilliant_scientist_restrict_foreign_access_effect_tt: "The selected foreign partner loses access to sensitive work.\nDependence: §R+5§!\nExposure: §G-10§!\nProject Capacity: §R-5§!"
brilliant_scientist_terminate_foreign_frameworks_effect_tt: "All standing foreign research frameworks are terminated.\nExposure: §G-5§!\nProject Capacity: §R-10§!"

brilliant_scientist_project_approval_effect_tt: "Cabinet authorization is filed for the selected family and stage. The responsible laboratories must still meet their own requirements before work begins."
brilliant_scientist_project_suspension_effect_tt: "Work stops at the selected project's current stage. Its teams stand down while its records are preserved."
brilliant_scientist_project_resumption_effect_tt: "The selected project's preserved work and teams return to active service."
brilliant_scientist_project_cancellation_effect_tt: "The selected project's workshops are dismantled, its active work ends, and its committed capacity is released."
brilliant_scientist_independent_replication_effect_tt: "An independent team reproduces the selected result without Kruger's direct supervision.\nDependence: §G-10§!\nExposure: §R+5§!\nProject Capacity: §G+5§!"
brilliant_scientist_publication_effect_tt: "The selected verified method enters public scientific institutions.\nMandate: §G+10§!\nDependence: §G-10§!\nExposure: §R+20§!\nProject Capacity: §G+5§!"

brilliant_scientist_public_science_council: "Public Science Council"
brilliant_scientist_public_science_council_desc: "Civilian oversight accelerates research and legitimizes the programme, but requires public allocations and political attention."
brilliant_scientist_compartmentalized_military_office: "Compartmentalized Military Office"
brilliant_scientist_compartmentalized_military_office_desc: "Military compartments accelerate special projects and improve detection at the cost of broader research and civilian production."
brilliant_scientist_private_industrial_concession: "Private Industrial Concession"
brilliant_scientist_private_industrial_concession_desc: "Privileged firms accelerate prototyping and factory learning while claiming a larger civilian share of production."
brilliant_scientist_exile_scholar_network: "Exile Scholar Network"
brilliant_scientist_exile_scholar_network_desc: "Displaced specialists strengthen research and projects, though their politically uncertain status burdens stability."
brilliant_scientist_facility_network: "Kruger Facility Network"
brilliant_scientist_facility_network_desc: "Permanent laboratories accelerate special projects, but consume civilian allocations and a larger stream of supplies."
brilliant_scientist_research_cohort: "Kruger Research Cohort"
brilliant_scientist_research_cohort_desc: "A trained cohort improves national research, scientist output, and special-project throughput."
brilliant_scientist_university_research_network: "University Research Network"
brilliant_scientist_university_research_network_desc: "Universities broaden research and project capacity while demanding civilian resources and political support."
brilliant_scientist_priority_fundamental_inquiry: "Priority: Fundamental Inquiry"
brilliant_scientist_priority_fundamental_inquiry_desc: "The Directorate favours foundational research over immediate special-project delivery."
brilliant_scientist_priority_prototype_delivery: "Priority: Prototype Delivery"
brilliant_scientist_priority_prototype_delivery_desc: "The Directorate concentrates on special projects, accepting slower ordinary research and heavier civilian demands."
brilliant_scientist_priority_distributed_replication: "Priority: Distributed Replication"
brilliant_scientist_priority_distributed_replication_desc: "The Directorate accepts slower work and heavier allocations to make results reproducible beyond Kruger's laboratory."
brilliant_scientist_internal_security_section: "Internal Security Section"
brilliant_scientist_internal_security_section_desc: "Permanent counterintelligence improves encryption and hostile-operative detection while drawing resources into security."
brilliant_scientist_cabinet_safety_board: "Cabinet Safety Board"
brilliant_scientist_cabinet_safety_board_desc: "Cabinet oversight protects stability and political authority, but slows the Directorate's special projects."
brilliant_scientist_delegated_technical_authority: "Delegated Technical Authority"
brilliant_scientist_delegated_technical_authority_desc: "Kruger's control accelerates projects and reduces administrative drag, but weakens ordinary political control."
brilliant_scientist_sovereign_technical_authority: "Sovereign Technical Authority"
brilliant_scientist_sovereign_technical_authority_desc: "Kruger commands an exceptionally swift programme beyond routine administration, consuming civilian resources and political authority."
brilliant_scientist_host_synthesis_program: "Controlled Synthesis Programme"
brilliant_scientist_host_synthesis_program_desc: "A paid synthesis programme keeps the Paleogenetics and Xenobiological Synthesis ledgers separate while consuming facility supply and civilian production capacity."
brilliant_scientist_protected_dissent: "Protected Scientific Dissent"
brilliant_scientist_protected_dissent_desc: "Protected critics keep the Directorate's hazardous work reviewable. Their presence improves stability and counterintelligence, but slows special projects and consumes civilian allocations."
brilliant_scientist_ethics_chair_dismissed: "Dismissed Ethics Chair"
brilliant_scientist_ethics_chair_dismissed_desc: "The Directorate's ethics chair has been removed. Projects accelerate, but legitimacy, stability, and the loyalty of ordinary assistants deteriorate."
brilliant_scientist_national_chair: "National Science Chair"
brilliant_scientist_national_chair_desc: "A formal university chair directs public replication and regional prestige, at the cost of a visible, exposed institutional target."
brilliant_scientist_grant_rotation: "Rotating Institutional Grants"
brilliant_scientist_grant_rotation_desc: "Rotating grants spread the Directorate's methods across institutions, making the network resilient while slowing concentrated project delivery."
brilliant_scientist_kruger_selected_institutions: "Kruger-Selected Institutions"
brilliant_scientist_kruger_selected_institutions_desc: "Kruger personally selects laboratories and scholars. His authority accelerates special projects but leaves excluded institutions resentful and easier for foreign services to recruit."
