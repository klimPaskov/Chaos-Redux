l_english:
brilliant_scientist_directorate_category: "The Kruger Directorate"
brilliant_scientist_directorate_category_desc: "The Directorate turns Doctor Kruger's genius into a national institution.\n\n§YMandate§!: [?brilliant_scientist_mandate|.0]\n§YDependence§!: [?brilliant_scientist_dependence|.0]\n§YExposure§!: [?brilliant_scientist_exposure|.0]\n§YProject Capacity§!: [?brilliant_scientist_project_capacity|.0]\n§YGovernment Control§!: [ROOT.GetBrilliantScientistGovernmentControl]\n\n§YNamed causes§!\n[ROOT.GetBrilliantScientistAppointmentCause]\n[ROOT.GetBrilliantScientistInstitutionCause]\n[ROOT.GetBrilliantScientistPriorityCause]\n[ROOT.GetBrilliantScientistSecurityCause]\n[ROOT.GetBrilliantScientistAuthorityCause]\n\n§YLatest Directorate records§!\n[ROOT.GetBrilliantScientistLastLoyaltyReview]\n[ROOT.GetBrilliantScientistLastRelocation]\n\nMandate measures formal authority. Dependence measures reliance on Kruger's personal control. Exposure measures public and foreign visibility. Project Capacity measures sustainable laboratory bandwidth. Government Control summarizes visible evidence without revealing the Directorate's hidden causal state."

brilliant_scientist_convene_public_science_council: "Convene a Public Science Council"
brilliant_scientist_convene_public_science_council_desc: "Place Kruger's programme beneath a civilian council of scholars, ministers, and public institutions. Open authority will strengthen legitimacy and research, but scrutiny will expose more of the programme."
brilliant_scientist_establish_compartmentalized_military_office: "Establish a Compartmentalized Military Office"
brilliant_scientist_establish_compartmentalized_military_office_desc: "Divide the programme into guarded military compartments. The office will accelerate projects and frustrate hostile observers, while binding the state more closely to Kruger's closed command."
brilliant_scientist_grant_private_industrial_concession: "Grant a Private Industrial Concession"
brilliant_scientist_grant_private_industrial_concession_desc: "Give selected industrial combines privileged access to Kruger's methods. Production and prototyping will benefit, though private intermediaries will weaken direct state control."
brilliant_scientist_assemble_exile_scholar_network: "Assemble an Exile Scholar Network"
brilliant_scientist_assemble_exile_scholar_network_desc: "Gather displaced physicists, engineers, and physicians around Kruger's laboratory. Their experience broadens the programme, but their presence is politically delicate."

brilliant_scientist_recruit_research_cohort: "Recruit a Research Cohort"
brilliant_scientist_recruit_research_cohort_desc: "Recruit technicians, assistants, and junior scientists who can absorb Kruger's methods. A permanent cohort will widen throughput, although it expands the circle that knows the Directorate's work."
brilliant_scientist_charter_university_research_network: "Charter a University Research Network"
brilliant_scientist_charter_university_research_network_desc: "Bind the Directorate to selected universities and laboratories. Distributed expertise will make national science more resilient and reduce reliance on a single workshop."

brilliant_scientist_prioritize_fundamental_inquiry: "Prioritize Fundamental Inquiry"
brilliant_scientist_prioritize_fundamental_inquiry_desc: "Direct the Directorate toward theory, measurement, and foundational research. Ordinary research will flourish, but immediate prototype work will proceed more cautiously."
brilliant_scientist_prioritize_prototype_delivery: "Prioritize Prototype Delivery"
brilliant_scientist_prioritize_prototype_delivery_desc: "Concentrate resources on working machines and field trials. Project work will quicken at the expense of broader research and civilian allocations."
brilliant_scientist_prioritize_distributed_replication: "Prioritize Distributed Replication"
brilliant_scientist_prioritize_distributed_replication_desc: "Make reproducibility the Directorate's first standard. Parallel teams will sacrifice some speed to ensure that Kruger's results can survive without his direct supervision."

brilliant_scientist_establish_internal_security_section: "Establish an Internal Security Section"
brilliant_scientist_establish_internal_security_section_desc: "Create a permanent office for clearances, compartmentation, and counterintelligence. Its guards and investigators will protect the programme while increasing bureaucratic dependence."
brilliant_scientist_rotate_security_clearances: "Rotate Security Clearances"
brilliant_scientist_rotate_security_clearances_desc: "Reassign access lists, couriers, and compartment codes before hostile services can map the Directorate's organisation."
brilliant_scientist_conduct_loyalty_review: "Conduct a Loyalty Review"
brilliant_scientist_conduct_loyalty_review_desc: "Open a formal investigation into the Directorate's staff, patrons, and contractors. Its findings are uncertain: intelligence capability, the programme's Exposure, and the projects already pursued determine whether investigators uncover foreign agents, Kruger loyalists, engineered personnel, or only cause a wrongful purge."
brilliant_scientist_loyalty_review_mission: "The Directorate Loyalty Review"
brilliant_scientist_loyalty_review_mission_desc: "Security officers are tracing clearances, contracts, laboratory records, and personnel histories. Better intelligence institutions may separate a genuine conspiracy from suspicion. An exposed or technically transformed Directorate gives investigators more dangerous possibilities to find."
brilliant_scientist_lay_false_procurement_trails: "Lay False Procurement Trails"
brilliant_scientist_lay_false_procurement_trails_desc: "Disguise laboratory orders among fictitious depots and misleading industrial contracts. Secrecy will improve, but real project capacity will be consumed maintaining the deception."

brilliant_scientist_establish_cabinet_safety_board: "Establish a Cabinet Safety Board"
brilliant_scientist_establish_cabinet_safety_board_desc: "Require cabinet review for the Directorate's most hazardous work. Civil authority and stability will gain safeguards, but political review will slow projects."
brilliant_scientist_delegate_technical_authority: "Delegate Technical Authority"
brilliant_scientist_delegate_technical_authority_desc: "Grant Kruger broad authority over technical schedules, staffing, and laboratory resources. Projects will move faster, while the state becomes more exposed to his personal judgement."
brilliant_scientist_grant_final_technical_authority: "Grant Final Technical Authority"
brilliant_scientist_grant_final_technical_authority_desc: "Recognise Kruger as the final authority over the Directorate's scientific programme. The arrangement promises exceptional speed and independence from ordinary administration, but leaves the state dangerously reliant on one mind."
brilliant_scientist_protect_dissenting_scientists: "Protect Dissenting Scientists"
brilliant_scientist_protect_dissenting_scientists_desc: "Keep internal critics and cautious assistants inside the public network. Their scrutiny improves safety and legitimacy, but slows hazardous work and requires a continuing support allocation."
brilliant_scientist_dismiss_ethics_chair: "Dismiss the Ethics Chair"
brilliant_scientist_dismiss_ethics_chair_desc: "Remove the chair who can still delay weaponisation and hazardous trials. The Directorate gains speed, while assistants and foreign observers read the decision as a surrender of restraint."
brilliant_scientist_award_national_science_chair: "Award the National Science Chair"
brilliant_scientist_award_national_science_chair_desc: "Give one university formal leadership of the public research network. Replication and regional prestige will improve, but rivals and foreign services will know where to look."
brilliant_scientist_rotate_grants_among_institutions: "Rotate Grants Among Institutions"
brilliant_scientist_rotate_grants_among_institutions_desc: "Spread grants across the university network instead of allowing one institution to dominate. The programme becomes more resilient, but concentrated progress slows and administration grows heavier."
brilliant_scientist_let_kruger_select_institutions: "Let Kruger Select the Institutions"
brilliant_scientist_let_kruger_select_institutions_desc: "Put appointments and grant schedules directly in Kruger's hands. Projects will move quickly, while excluded scholars become a pool of grievance and foreign recruitment."

brilliant_scientist_formalize_primary_research_campus: "Formalize the Primary Research Campus"
brilliant_scientist_formalize_primary_research_campus_desc: "Turn Kruger's current laboratory into a permanent national campus with secure workshops, stores, and administrative support."
brilliant_scientist_expand_primary_prototype_works: "Expand the Primary Prototype Works"
brilliant_scientist_expand_primary_prototype_works_desc: "Add heavy workshops and production facilities to the primary campus so designs can pass rapidly from paper to fieldworthy prototypes."
brilliant_scientist_establish_secondary_laboratory: "Establish a Secondary Laboratory"
brilliant_scientist_establish_secondary_laboratory_desc: "Build a second laboratory in a fully controlled core state with at least two levels of Infrastructure, a Civilian Factory or Military Factory, and either a home-area connection or a Supply Hub. A trained research cohort must already exist. The additional Infrastructure creates another centre able to sustain the programme if the primary campus is threatened."
brilliant_scientist_relocate_primary_laboratory: "Relocate the Primary Laboratory"
brilliant_scientist_relocate_primary_laboratory_desc: "Commit Kruger's laboratory to another fully controlled core state with at least two levels of Infrastructure and a Civilian Factory or Military Factory. The destination must have a home-area connection or a Naval Base supplied by convoys. The transfer consumes logistics and time, and may still be intercepted, lose prototypes, provoke staff refusal, or give Kruger an opening to escape."
brilliant_scientist_harden_primary_laboratory: "Harden the Primary Laboratory"
brilliant_scientist_harden_primary_laboratory_desc: "Surround the primary campus with shelters, dispersed stores, and defensive works. The site will become harder to disrupt and better able to sustain project work."
brilliant_scientist_mobilize_primary_laboratory_repairs: "Mobilize Primary Laboratory Repairs"
brilliant_scientist_mobilize_primary_laboratory_repairs_desc: "Give the primary campus priority access to engineers, materials, and reconstruction schedules until damaged facilities are restored."

brilliant_scientist_review_foreign_approaches: "Review Foreign Approaches"
brilliant_scientist_review_foreign_approaches_desc: "Order the liaison office to examine governments seeking access to Kruger's programme and select the most credible current approach."
brilliant_scientist_offer_controlled_research_access: "Offer Controlled Research Access"
brilliant_scientist_offer_controlled_research_access_desc: "Permit [brilliant_scientist_foreign_actor.GetNameDef] to observe a carefully delimited portion of the programme. The exchange expands capacity and legitimacy while increasing foreign knowledge of the Directorate."
brilliant_scientist_open_joint_laboratory: "Open a Joint Laboratory"
brilliant_scientist_open_joint_laboratory_desc: "Establish a joint laboratory with [brilliant_scientist_foreign_actor.GetNameDef] at a viable partner site. Shared facilities promise substantial capacity, at the price of dependence and exposure."
brilliant_scientist_accept_foreign_protection_framework: "Accept a Foreign Protection Framework"
brilliant_scientist_accept_foreign_protection_framework_desc: "Allow [brilliant_scientist_foreign_actor.GetNameDef] to provide security, logistics, and political cover for the Directorate. The arrangement protects the work while granting the partner enduring leverage."
brilliant_scientist_restrict_foreign_research_access: "Restrict Foreign Research Access"
brilliant_scientist_restrict_foreign_research_access_desc: "Close compartments, recall observers, and limit the selected foreign partner to non-sensitive exchanges. Exposure will fall, although useful cooperation will contract."
brilliant_scientist_terminate_foreign_research_frameworks: "Terminate Foreign Research Frameworks"
brilliant_scientist_terminate_foreign_research_frameworks_desc: "End the Directorate's standing joint laboratory, protection, and controlled-access arrangements. The break restores freedom of action but sacrifices capacity and leaves foreign grievances."

brilliant_scientist_approve_selected_project: "Approve the Selected Project"
brilliant_scientist_approve_selected_project_desc: "Submit the selected project family and stage for formal authorization. Its laboratories must still satisfy their scientific, industrial, and security requirements before work begins."
brilliant_scientist_suspend_selected_project: "Suspend the Selected Project"
brilliant_scientist_suspend_selected_project_desc: "Freeze the selected project's current stage, stand down its active teams, and preserve its records for a later resumption."
brilliant_scientist_resume_selected_project: "Resume the Selected Project"
brilliant_scientist_resume_selected_project_desc: "Restore the selected suspended project to active work from its preserved stage."
brilliant_scientist_cancel_selected_project: "Cancel the Selected Project"
brilliant_scientist_cancel_selected_project_desc: "Dismantle the selected active or suspended project, release its committed capacity, and order the responsible laboratories to clear their work."
brilliant_scientist_commission_independent_replication: "Commission Independent Replication"
brilliant_scientist_commission_independent_replication_desc: "Fund a separate team to reproduce the selected eligible result without Kruger's direct supervision. Successful replication reduces personal dependence and proves that the method can survive its inventor."
brilliant_scientist_publish_verified_methods: "Publish Verified Methods"
brilliant_scientist_publish_verified_methods_desc: "Release the selected independently replicated method to scientific institutions. Publication establishes public legitimacy and sovereign scientific authority, while making the programme far more visible."

