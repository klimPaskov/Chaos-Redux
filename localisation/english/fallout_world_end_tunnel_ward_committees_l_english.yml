 chaosx.fallout.607.t: "The Tunnel Ward Register"
 chaosx.fallout.607.d: "In the East Asian shelter district, ventilation crews have kept three ward ledgers alive through the ash week. Delegates now ask who may open the ration books, who may appoint the tunnel watch, and who will answer when a family is turned away. The register cannot remain a private promise."
 chaosx.fallout.607.a: "Recognize the ward councils"
 chaosx.fallout.607.a.tt: "Spend Food, Medicine, and Recognition to grant the councils a formal charter."
 chaosx.fallout.607.b: "Centralize appointments"
 chaosx.fallout.607.b.tt: "Spend Food, Power, Scrap, and Recognition to bind the wards to a central register."
 chaosx.fallout.607.c: "Establish military wards"
 chaosx.fallout.607.c.tt: "Spend Food, Support Equipment, and Command Power to place the tunnels under a security roster."
 chaosx.fallout.607.option_rotate: "Rotate ward leadership"
 chaosx.fallout.607.option_rotate.tt: "Spend Food, Medicine, Power, and Recognition to rotate the charter between the wards."
 chaosx.fallout.609.t: "The Ward Register Is Read"
 chaosx.fallout.609.recognize.success.d: "The delegates sign a common charter beside the ventilation board. The ration clerks accept the ward seals, and families displaced from the southern industrial belt receive a place in the intake ledger."
 chaosx.fallout.609.recognize.partial.d: "The councils are recognized, but the intake ledger remains uneven. Two wards share medicine while the third keeps its own ration tally."
 chaosx.fallout.609.recognize.failure.d: "The recognition meeting breaks over the order of the queues. The delegates leave with separate seals, and the shelter guards begin checking lists that no longer agree."
 chaosx.fallout.609.centralize.success.d: "The central register survives the night shift. Appointments, ration lots, and ventilation repairs now carry one seal, while the ward clerks receive a copy for their own shelves."
 chaosx.fallout.609.centralize.partial.d: "The central office can reconcile the largest queues, but local clerks still keep parallel books. The appointment roster is useful, though no one mistakes it for trust."
 chaosx.fallout.609.centralize.failure.d: "The appointment list arrives with names from a district that no longer has a road to the shelter. The wards reject the order, and the central office loses its only reliable register."
 chaosx.fallout.609.military.success.d: "The tunnel watch takes the night roster and leaves the ration clerks in place. The wards hold the line, though every guard now knows that security has a cost in the common ledger."
 chaosx.fallout.609.military.partial.d: "The guards secure the valves and the main store, but the ward delegates retain control of the family lists. The shelter is orderly without becoming quiet."
 chaosx.fallout.609.military.failure.d: "The new patrols close a passage before the refugee list is copied. A family count is lost in the crush, and the ward leaders describe the arrangement as a tunnel crackdown."
 chaosx.fallout.609.rotate.success.d: "The charter passes from ward to ward without losing the ration count. The ventilation crews receive representation, and the displaced families gain a named clerk at every turn."
 chaosx.fallout.609.rotate.partial.d: "The leadership changes hands, but the old register takes time to follow. The wards share a meal schedule and a partial list of the families in transit."
 chaosx.fallout.609.rotate.failure.d: "The rotation leaves three leaders holding different copies of the same charter. The ventilation board remains lit, but the committees cannot agree who may touch it."
 chaosx.fallout.609.a: "Record the settlement"
 chaosx.fallout.609.a.tt: "Apply the settlement to the shelter state and schedule the institutional review."
 chaosx.fallout.611.t: "The Ward Review"
 chaosx.fallout.611.success.d: "Two hundred and ten days later, the review board finds a working shelter institution. The East Asian ward ledgers agree on food, ventilation, and families admitted since the ash week."
 chaosx.fallout.611.partial.d: "The review board finds a shelter that functions by habit more than trust. The ledgers can be reconciled, but faction pressure remains visible in every queue."
 chaosx.fallout.611.failure.d: "The review board cannot reconcile the ward ledgers. The ventilation crews keep working, yet the shelter loses people from the common register and returns to guarded lists."
 chaosx.fallout.611.a: "Close the review"
 chaosx.fallout.611.a.tt: "Record the institutional review and release the chain cleanup receipt."
