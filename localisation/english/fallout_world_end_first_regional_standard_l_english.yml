chaosx.fallout.852.t: "The First Regional Standard"
chaosx.fallout.852.opening.d: "The Manchurian Reactor Keeps can keep its clinics and workshops alive only when every gauge agrees. The machine district has copied one voltage table, one axle measure, one parts ledger, and one radio interval from the records that survived the Fallout winter. Neighboring settlements will follow the table only if the Technate decides who may read it, change it, and profit from it."
chaosx.fallout.852.a: "Publish one open standard"
chaosx.fallout.852.a.tt: "Spend Food 2, Scrap 1, and Recognition 2 to publish the voltage, parts, measures, and radio tables for every neighboring workshop. Open access improves compatibility, but rival traders can copy the work."
chaosx.fallout.852.b: "Protect a proprietary standard"
chaosx.fallout.852.b.tt: "Spend Power 2, Scrap 2, and Recognition 1 to keep the tables inside licensed workshops. The Keeps gains control over repair trade, but every neighbor must bargain for a compatible part."
chaosx.fallout.852.c: "Bind it to a regional compact"
chaosx.fallout.852.c.tt: "Spend Fuel 1, Power 2, and Recognition 2 to give the eastern settlements a joint standards council. The compact shares measurements, but every signatory can delay a change."
chaosx.fallout.852.d: "Keep the standard under military secrecy"
chaosx.fallout.852.d.tt: "Spend Medicine 1, Fuel 2, and Recognition 2 to reserve the tables for perimeter workshops and protected radio rooms. Military repairs improve, but civilian markets lose a common language."
chaosx.fallout.853.t: "The First Regional Standard"
chaosx.fallout.854.t: "A Measure for the Ruined East"
chaosx.fallout.854.open_standard.success.d: "The Keeps published a voltage table that the eastern workshops could actually reproduce. Rail crews adjusted their axle gauges, clinic pumps stopped burning out their motors, and the radio rooms began using one interval for emergency calls."
chaosx.fallout.854.open_standard.partial.d: "The open table reached the river settlements, but two workshops copied different parts tolerances from the same page. The Keeps kept the register public and sent a measuring crew to settle the mismatch before the next thaw."
chaosx.fallout.854.open_standard.failure.d: "The open register spread faster than the Keep's inspectors could check it. A copied voltage table damaged a cold store motor, and the neighboring councils now treat every published measure as a proposal until a local crew signs it."
chaosx.fallout.854.proprietary_standard.success.d: "Licensed workshops paid for the Keep's tables and returned clean parts to the rail depots. The Technate gained a dependable trade margin, while neighboring settlements accepted the fees because the motors and radio valves finally fit."
chaosx.fallout.854.proprietary_standard.partial.d: "The proprietary register protected the best drawings, but one outer workshop built its own axle gauge after missing a payment. The Keeps kept its license system and opened a narrow exchange for emergency parts."
chaosx.fallout.854.proprietary_standard.failure.d: "The license office withheld a bearing measurement from a settlement whose convoy arrived late. A clinic pump failed during the dispute, and traders now treat the Keeps as a gatekeeper rather than a partner."
chaosx.fallout.854.compact_standard.success.d: "The eastern standards council signed one table for voltage, parts, measures, and radio intervals. Each settlement can request a change, yet the council keeps a common reference that lets repair crews cross the ash roads without rebuilding every tool."
chaosx.fallout.854.compact_standard.partial.d: "The compact agreed on axle measures and radio intervals, but the voltage table still carries three local exceptions. The Keeps accepted the delay and sent a joint inspection crew before winter stores move again."
chaosx.fallout.854.compact_standard.failure.d: "The council spent its first session arguing over whose gauges counted as honest. No common table reached the outer workshops, and the Keeps lost a month of trade while every settlement guarded its own measure."
chaosx.fallout.854.military_secrecy.success.d: "Perimeter workshops received a protected standard for generators, field radios, and armored repair tools. The military corridor returned more vehicles to service, while civilian mechanics copied only the safe public fragments."
chaosx.fallout.854.military_secrecy.partial.d: "The protected tables kept the radio net coherent, but a civilian pump crew could not obtain the matching voltage note. The Keeps released a narrow safety sheet and kept the rest of the standard behind the perimeter."
chaosx.fallout.854.military_secrecy.failure.d: "Secrecy hid a faulty parts tolerance from the same crews expected to repair it. Two perimeter workshops blamed each other for the failure, and civilian councils now refuse any standard they cannot inspect."
chaosx.fallout.854.a: "Record the regional standard"
chaosx.fallout.854.a.tt: "Record the delayed standards result, apply its Air Winter, Supply Access, trade, and recognition effects, and open the later compatibility review."
chaosx.fallout.855.t: "The First Regional Standard"
chaosx.fallout.856.t: "The Compatibility Review"
chaosx.fallout.856.success.d: "The review found that the eastern workshops could share a standard without erasing their local repair practice. The Keeps kept a named review board, and every future change will carry a visible table revision."
chaosx.fallout.856.partial.d: "The review saved the common voltage and radio tables, but one outer workshop still uses a private axle measure. The Technate accepted a narrow exception while the council negotiates a final conversion kit."
chaosx.fallout.856.failure.d: "The review found no trusted way to reconcile the private and public tables. The Keeps can still repair its own grid, but neighboring settlements now keep separate measures and charge for every conversion."
chaosx.fallout.856.a: "Close the compatibility review"
chaosx.fallout.856.a.tt: "Apply the delayed review, write the durable standards memory, and release the reserved state and neighboring receipts."
chaosx.fallout.857.t: "The First Regional Standard"
