chaosx.fallout.970.t: "The Fertility Question"
chaosx.fallout.970.opening.d: "After the Congo Green Basin records a common settlement road, household stewards ask what kind of future the surviving districts can support. Some families want voluntary aid, some demand a public cohort program, some build adoption houses, and others refuse a ledger that could become a command. The Basin must decide how to help without turning family life into a state quota."
chaosx.fallout.970.a: "Offer voluntary household support"
chaosx.fallout.970.a.tt: "Spend Food 2, Medicine 3, and Recognition 2 to fund voluntary household support without assigning a target or a required family pattern."
chaosx.fallout.970.b: "Build a public cohort program"
chaosx.fallout.970.b.tt: "Spend Scrap 2, Power 2, and Recognition 2 to build public schools, food stores, and household services under a published civic charter."
chaosx.fallout.970.c: "Open adoption houses"
chaosx.fallout.970.c.tt: "Spend Fuel 1 and Recognition 2, then accept a Cohesion cost, to connect orphan care, kinship claims, and local guardians through named adoption houses."
chaosx.fallout.970.d: "Leave households alone"
chaosx.fallout.970.d.tt: "Spend Food 1, Medicine 1, Fuel 1, and Recognition 1 to refuse a public family program while keeping a minimal record for emergency aid."
chaosx.fallout.971.t: "The Fertility Question"
chaosx.fallout.972.t: "The Basin Debates Its Next Generation"
chaosx.fallout.972.voluntary_support.success.d: "The voluntary support office funds food, medicine, and a warm room without asking a household to prove what its future should look like. Families choose their own arrangements, and the Basin records help delivered rather than lives counted."
chaosx.fallout.972.voluntary_support.partial.d: "The office reaches the river wards, but the hill road receives help only when a named steward is present. Support remains voluntary, though unequal delivery leaves a quiet argument over whose household deserves the next cart."
chaosx.fallout.972.voluntary_support.failure.d: "The Basin announces voluntary aid before it has a reliable way to deliver it. The same families are listed by three clerks, medicine waits in a locked store, and a promise of choice becomes another reason to distrust the register."
chaosx.fallout.972.state_program.success.d: "The public cohort program opens a school, a food store, and a repair room without assigning a required family shape. Its charter names services rather than targets, and households can appeal when a district office confuses planning with command."
chaosx.fallout.972.state_program.partial.d: "The program keeps the river school supplied, but the hill district receives only the printed rule and an empty storehouse. A public service exists, yet each cold rain turns access into a question of which clerk still has power."
chaosx.fallout.972.state_program.failure.d: "The program office begins measuring compliance instead of service. Families hide their names, the storehouse records become political weapons, and a plan meant to keep children warm creates a new fear of being counted."
chaosx.fallout.972.adoption_network.success.d: "Adoption houses join orphan care with local guardians and make every transfer answerable to two witnesses. Kinship claims can be heard without becoming a military register, and the Basin gains a durable path for children who lost their first home."
chaosx.fallout.972.adoption_network.partial.d: "The first adoption house works beside the river, while the hill settlement still settles guardianship by memory and favor. The network gives families a route to ask for help, though the next generation will have to decide who may speak for it."
chaosx.fallout.972.adoption_network.failure.d: "The houses open faster than their witnesses can agree. A child is carried between two ledgers, a guardian waits for a missing seal, and the Basin learns that a kind institution can still become a queue with no answer."
chaosx.fallout.972.no_intervention.success.d: "The Basin refuses a public family program and keeps only a narrow emergency register. Food and medicine reach households that ask for them, while no office receives authority to turn a demographic question into a command."
chaosx.fallout.972.no_intervention.partial.d: "The refusal leaves household support to local stewards, and the river wards manage better than the hill road. Families keep their privacy, but winter aid follows friendship and kinship rather than a rule that everyone can see."
chaosx.fallout.972.no_intervention.failure.d: "The Basin leaves the ledger blank and calls the silence freedom. When food, medicine, and shelter run short, no household can prove its need without starting the argument the council hoped to avoid."
chaosx.fallout.972.a: "Enter the household charter"
chaosx.fallout.972.a.tt: "Apply the graded household result, record its fictional generation memory, and schedule the delayed next-generation review."
chaosx.fallout.974.t: "The Next Generation Answers"
chaosx.fallout.974.success.d: "The delayed review finds households using the charter in their own language after another cold rain. Children can claim school, shelter, or a guardian without being assigned a public destiny, and the Congo Green Basin can explain what it chose to protect."
chaosx.fallout.974.partial.d: "The review keeps one household service alive while a second district disputes the meaning of support. The Basin has a public memory of care and a private argument about whether the next generation inherited a promise or a burden."
chaosx.fallout.974.failure.d: "The review finds duplicate household ledgers, missing guardians, and a storehouse that answers to no trusted steward. The Basin remembers choosing a future, but families now avoid every office that claims to speak for it."
chaosx.fallout.974.a: "Close the household review"
chaosx.fallout.974.a.tt: "Apply the delayed next-generation outcome, record the final fictional generation memory, and release the reserved state and witness rows."
