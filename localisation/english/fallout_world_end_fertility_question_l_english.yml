fallout.event_log.fertility_question.detail.voluntary_support_success: "Voluntary aid reached households without turning lives into a quota."
fallout.event_log.fertility_question.detail.voluntary_support_partial: "River wards received aid while the hill road waited for a named steward."
fallout.event_log.fertility_question.detail.voluntary_support_failure: "Three clerks listed the same families while medicine stayed locked."
fallout.event_log.fertility_question.detail.state_program_success: "Public services named support rather than a required family shape."
fallout.event_log.fertility_question.detail.state_program_partial: "The river school held while the hill district received an empty storehouse."
fallout.event_log.fertility_question.detail.state_program_failure: "A service program became a compliance ledger that families feared."
fallout.event_log.fertility_question.detail.adoption_network_success: "Two-witness adoption houses gave displaced children a durable route to guardianship."
fallout.event_log.fertility_question.detail.adoption_network_partial: "The river house worked while the hill settlement still relied on memory and favor."
fallout.event_log.fertility_question.detail.adoption_network_failure: "A missing seal left a child between two household ledgers."
fallout.event_log.fertility_question.detail.no_intervention_success: "A narrow emergency register delivered aid without a public family program."
fallout.event_log.fertility_question.detail.no_intervention_partial: "Privacy survived while winter aid followed local favor."
fallout.event_log.fertility_question.detail.no_intervention_failure: "A blank ledger left households unable to prove urgent need."
fallout.event_log.fertility_question.detail.callback_success: "Households used the charter in their own language after cold rain returned."
fallout.event_log.fertility_question.detail.callback_partial: "One household service survived while a second district disputed support."
fallout.event_log.fertility_question.detail.callback_failure: "Duplicate ledgers and missing guardians broke trust in every office."
fallout.event_log.fertility_question.detail.cancelled: "The household review was cancelled after its state, witness, owner, or generation changed."
