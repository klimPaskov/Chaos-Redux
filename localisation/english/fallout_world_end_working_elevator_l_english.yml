 fallout.event_log.working_elevator.granary_partial: "A public grain ledger reached the central shelters but not the frozen rail edge."
 fallout.event_log.working_elevator.granary_failure: "A damp seal spoiled the public store before its first full count."
 fallout.event_log.working_elevator.military_success: "A guarded depot linked grain, fuel, and patrol routes."
 fallout.event_log.working_elevator.military_partial: "A military depot supplied patrols while civilian queues waited."
 fallout.event_log.working_elevator.military_failure: "A fuel dispute left grain behind the depot gate."
 fallout.event_log.working_elevator.merchant_success: "Licensed carriers turned the loading floor into a measured exchange."
 fallout.event_log.working_elevator.merchant_partial: "The merchant exchange worked near the capital while outer routes lagged."
 fallout.event_log.working_elevator.merchant_failure: "Altered weights and a missing seal broke the first grain exchange."
 fallout.event_log.working_elevator.refugee_success: "A visible ration center fed arriving families and recorded their welcome."
 fallout.event_log.working_elevator.refugee_partial: "The refugee queue received grain at the main door while the road line waited."
 fallout.event_log.working_elevator.refugee_failure: "The ration center opened before its water barrels arrived."
 fallout.event_log.working_elevator.callback_success: "A maintenance year made the elevator a durable public store."
 fallout.event_log.working_elevator.callback_partial: "A maintenance year left a usable but seasonal grain route."
 fallout.event_log.working_elevator.callback_failure: "A maintenance year returned the elevator to guarded darkness."
