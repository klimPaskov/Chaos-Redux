 chaosx.fallout.324.t: "The Working Elevator"
 chaosx.fallout.324.d: "The grain elevator at the edge of the settlement has kept one sealed hopper through the ash years. Its rail spur is frozen, its ledger is written in three hands, and the first working streetlight has made the loading floor visible again. The country must decide whether the surviving store feeds a public granary, a guarded depot, a merchant exchange, or the families arriving from the road."
 chaosx.fallout.324.a: "Make it a public granary"
 chaosx.fallout.324.a.tt: "Open the elevator under a public ration ledger. Costs Food and Scrap. A stable result expands grain capacity and lowers spoilage while making the store a civic institution."
 chaosx.fallout.324.b: "Make it a military depot"
 chaosx.fallout.324.b.tt: "Put the elevator under guarded supply control. Costs Food, Fuel, and Power. A stable result strengthens logistics and patrol readiness while narrowing civilian access."
 chaosx.fallout.324.c: "License a merchant exchange"
 chaosx.fallout.324.c.tt: "Let licensed carriers trade grain through a measured exchange. Costs Food, Scrap, and Recognition. A stable result raises market legitimacy and opens a cleaner route."
 chaosx.fallout.324.d_option: "Reserve it for refugee rations"
 chaosx.fallout.324.d_option.tt: "Use the elevator to feed families arriving from the ash road. Costs Food, Clean Water, and Shelter Capacity. A stable result raises integration and keeps the intake visible."
 chaosx.fallout.326.t: "The Hopper Ledger"
 chaosx.fallout.326.granary.success.d: "The public granary opened beneath the first streetlight. Ration clerks read the hopper count aloud, the same family could return without bribing a guard, and the old elevator became a place where a country could measure tomorrow without pretending the store was endless."
 chaosx.fallout.326.granary.partial.d: "The public ledger reached the central shelters and stopped at the frozen rail spur. Grain moved under a clear rule near the elevator, while outer rooms still traded names and promises for a place in the next sack line."
 chaosx.fallout.326.granary.failure.d: "The public count collapsed when a damp seal broke above the loading floor. Spoiled grain ran into the thaw channel, the clerks lost their cross-check, and the settlement learned that an open store can fail in front of every hungry witness."
 chaosx.fallout.326.military.success.d: "The guarded depot put grain, fuel, and patrol routes on one board. Convoys left with measured loads, the garrison stopped stripping household carts, and the elevator became a hard but reliable hinge between the ration table and the perimeter."
 chaosx.fallout.326.military.partial.d: "The depot kept the main patrol route supplied, but civilian queues waited behind the guard roster. The elevator sends out grain on schedule, yet every delayed household now knows which uniform received the first tally."
 chaosx.fallout.326.military.failure.d: "A fuel dispute stopped the military lift before the first convoy cleared the yard. Grain sat behind a locked gate, the patrol line took what it could by hand, and the country lost both food and trust in the officer who promised a clean depot."
 chaosx.fallout.326.merchant.success.d: "Licensed carriers turned the loading floor into a measured exchange. Their ledgers name the route, the price, and the share kept for the shelters, while unfamiliar carts bring grain from beyond the ash road without taking the whole public store as payment."
 chaosx.fallout.326.merchant.partial.d: "The merchant exchange works at the capital end of the rail spur. A few carriers return with grain and useful news, but the outer settlements still see a market that knows their names only when a sack is late."
 chaosx.fallout.326.merchant.failure.d: "The first licensed convoy arrived with altered weights and a missing seal. Recognition fell when the exchange could not explain its own figures, and the elevator floor became a court for merchants who had already carried the grain away."
 chaosx.fallout.326.refugee.success.d: "The elevator became a refugee ration center with a visible intake board. Families from the ash road received water before the grain issue, local households could see the rule, and the settlement gained workers who knew that the first welcome had been written down."
 chaosx.fallout.326.refugee.partial.d: "The refugee queue received grain and clean water at the main door, while the last arrivals waited beside the frozen spur. Integration has a place on the ledger, though the town still argues over whether the shelter line or the road line came first."
 chaosx.fallout.326.refugee.failure.d: "The refugee ration center opened before the water barrels arrived. Grain spoiled in the damp queue, families were turned back toward the road, and the country now carries a public memory of an elevator that promised welcome without a safe place to stand."
 chaosx.fallout.326.a: "Accept the hopper report"
 chaosx.fallout.326.a.tt: "Record the grain policy, apply its delayed result, and begin the 210-day storage and ration maintenance follow-up."
 chaosx.fallout.328.t: "The Storehouse Year"
 chaosx.fallout.328.success.d: "The elevator has survived a full maintenance year. Its seals are checked before the first frost, its ration board names both arrivals and residents, and the country can move grain without turning every loading door into a separate government."
 chaosx.fallout.328.partial.d: "The elevator still works where the rail spur meets the capital. Outer routes remain seasonal and contested, yet the storehouse has a rule that can be carried to the next settlement when the thaw opens the road."
 chaosx.fallout.328.failure.d: "The maintenance year found a broken seal, a missing clerk, and three claims on the last dry hopper. The elevator returns to guarded darkness, while the country carries a grain ledger that records who was left waiting."
 chaosx.fallout.328.a: "Close the storehouse ledger"
 chaosx.fallout.328.a.tt: "Resolve the storage and ration follow-up, preserve the grain policy memory, and release the Working Elevator transaction."
 fallout.event_log.working_elevator.name: "The Working Elevator"
 fallout.event_log.working_elevator.detail: "A Fallout recovery chain recorded a grain-storage policy, a delayed hopper result, and a storehouse maintenance follow-up."
