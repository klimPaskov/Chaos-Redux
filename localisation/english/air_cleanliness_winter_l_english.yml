l_english:
air_winter_phase_1: "Air Winter: Dim Frost"
air_winter_phase_1_desc: "Weak daylight and regional frost have begun to slow transport, repair work, and exposed troops."
air_winter_phase_2: "Air Winter: Crop Shock"
air_winter_phase_2_desc: "Cold rain, failed planting, and persistent frost are reducing local food, supplies, and available labor."
air_winter_phase_3: "Air Winter: Hard Freeze"
air_winter_phase_3_desc: "Frozen routes and utilities are damaging infrastructure while severe cold restricts military movement."
air_winter_phase_4: "Air Winter: Black Harvest"
air_winter_phase_4_desc: "Dead crops, failing shelter, and frozen water are forcing settlements to concentrate around heat and food."
air_winter_phase_5: "Air Winter: Ash Winter"
air_winter_phase_5_desc: "Ash, deep cold, and collapsing supply routes have made ordinary settlement life difficult to sustain."
air_winter_phase_6: "Air Winter: Terminal Winter"
air_winter_phase_6_desc: "The state endures extreme cold, failed production, mass exposure, and the loss of reliable transport."
air_winter_air_operations_country: "Air Winter Flight Conditions"
air_winter_air_operations_country_desc: "Cold, ash, frost, and weak visibility around the country's working airfields are reducing sortie reliability. The burden follows the average Air Winter phase across controlled states with a working airbase and applies to every national air operation."
air_winter_refinery_output_disruption_state: "Black Snow over the Oil Works"
air_winter_refinery_output_disruption_state_desc: "Frozen valves, contaminated feedstock, and dangerous ash deposits are reducing oil output until crews can stabilize the affected works."
air_winter_reactor_emergency_power_demand_state: "Emergency Cooling Power Draw"
air_winter_reactor_emergency_power_demand_state_desc: "Cooling pumps, heat tracing, and emergency control rooms are drawing additional power while reactor crews stabilize the plant."
air_winter_disease_pressure_state: "Cold-Weather Disease Pressure"
air_winter_disease_pressure_state_desc: "Crowded shelters, poor food, contaminated water, and prolonged exposure are driving respiratory illness and attrition."
air_winter_rail_protection_state: "Protected Winter Rail Corridor"
air_winter_rail_protection_state_desc: "Heated points, guarded crews, and reserved repair stock protect this state's principal winter supply route."
air_winter_airbase_closure_state: "Winter Airbase Closure"
air_winter_airbase_closure_state_desc: "Runways and exposed facilities remain closed while crews preserve aircraft, fuel, and heating capacity."
