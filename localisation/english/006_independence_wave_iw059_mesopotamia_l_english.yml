l_english:
  independence_wave_iw059_mesopotamia_category: "Mesopotamian Civic Cabinet"
  independence_wave_iw059_mesopotamia_category_desc: "Baghdad's cabinet must align river logistics, provincial authority, and minority guarantees before the federation can defend the basin."
  independence_wave_iw059_convene_baghdad_civic_cabinet: "Convene the Baghdad Civic Cabinet"
  independence_wave_iw059_convene_baghdad_civic_cabinet_desc: "Municipal delegates, river provinces, labor organizers, and minority liaisons must share one emergency ledger before the new federation can defend its capital."
  independence_wave_iw059_cabinet_cost: "£command_power 12£  £manpower_texticon 1500  £train_equipment 4"
  independence_wave_iw059_cabinet_cost_blocked: "Unavailable: requires £command_power 12£  £manpower_texticon 1500  £train_equipment 4"
  independence_wave_iw059_cabinet_cost_tooltip: "Baghdad cabinet commitment: £command_power 12£  £manpower_texticon 1500  £train_equipment 4"
  independence_wave_iw059_convene_baghdad_civic_cabinet_effect_tt: "The Baghdad cabinet improves river logistics and civic legitimacy while provincial autonomy pays the first coordination cost."
  independence_wave_iw059_secure_tigris_depots: "Secure the Tigris Depots"
  independence_wave_iw059_secure_tigris_depots_desc: "Rail clerks and river engineers secure Baghdad's depots so supplies can move between the capital and the basin without relying on an unaccountable host."
  independence_wave_iw059_depot_cost: "£command_power 16£  £manpower_texticon 2500  £train_equipment 6  £support_equipment 80"
  independence_wave_iw059_depot_cost_blocked: "Unavailable: requires £command_power 16£  £manpower_texticon 2500  £train_equipment 6  £support_equipment 80"
  independence_wave_iw059_depot_cost_tooltip: "Tigris depot commitment: £command_power 16£  £manpower_texticon 2500  £train_equipment 6  £support_equipment 80"
  independence_wave_iw059_secure_tigris_depots_effect_tt: "The Tigris depots raise river logistics and civic legitimacy but centralize authority around the capital."
  independence_wave_iw059_integrate_river_officer_council: "Integrate the River Officer Council"
  independence_wave_iw059_integrate_river_officer_council_desc: "Veteran cadres, provincial officers, and urban defense committees receive one professional command charter instead of competing orders."
  independence_wave_iw059_officer_cost: "£command_power 18£  £manpower_texticon 3500  £army_experience 20  £infantry_equipment 450"
  independence_wave_iw059_officer_cost_blocked: "Unavailable: requires £command_power 18£  £manpower_texticon 3500  £army_experience 20  £infantry_equipment 450"
  independence_wave_iw059_officer_cost_tooltip: "River officer-council commitment: £command_power 18£  £manpower_texticon 3500  £army_experience 20  £infantry_equipment 450"
  independence_wave_iw059_integrate_river_officer_council_effect_tt: "The river force gains a professional command, trading some provincial autonomy for legitimacy and mobility."
  independence_wave_iw059_hold_baghdad_river_guard: "Hold the Baghdad River Guard"
  independence_wave_iw059_hold_baghdad_river_guard_desc: "Keep a supplied guard in state 291 while the capital remains under our control. A broken line will expose the cabinet's weakness."
  independence_wave_iw059_hold_baghdad_river_guard_success_effect_tt: "The Baghdad guard proves that river provinces can defend a shared capital."
  independence_wave_iw059_hold_baghdad_river_guard_failure_effect_tt: "The Baghdad guard failed to hold its objective, damaging stability and civic legitimacy."
  independence_wave_iw059_adopt_baghdad_constitution: "Adopt the Baghdad Constitutional Compact"
  independence_wave_iw059_adopt_baghdad_constitution_desc: "A written compact guarantees minority representation, provincial voice, and a federal defense obligation before the federation claims a wider mandate."
  independence_wave_iw059_constitutional_cost: "£manpower_texticon 5500  £army_experience 28  £infantry_equipment 800  £support_equipment 160"
  independence_wave_iw059_constitutional_cost_blocked: "Unavailable: requires £manpower_texticon 5500  £army_experience 28  £infantry_equipment 800  £support_equipment 160"
  independence_wave_iw059_constitutional_cost_tooltip: "Baghdad constitutional-compact commitment: £manpower_texticon 5500  £army_experience 28  £infantry_equipment 800  £support_equipment 160"
  independence_wave_iw059_adopt_baghdad_constitution_effect_tt: "The Baghdad compact establishes constitutional and minority guarantees, trading river efficiency for durable legitimacy and autonomy."
  independence_wave_iw059_mesopotamia_contested_river_cabinet: "Contested River Cabinet"
  independence_wave_iw059_mesopotamia_contested_river_cabinet_desc: "Municipal, provincial, and river commands still compete for the federation's limited authority."
  independence_wave_iw059_mesopotamia_integrated_river_authority: "Integrated River Authority"
  independence_wave_iw059_mesopotamia_integrated_river_authority_desc: "The Baghdad cabinet has aligned river logistics with a professional command."
  independence_wave_iw059_mesopotamia_minority_guarantees: "Mesopotamian Minority Guarantees"
  independence_wave_iw059_mesopotamia_minority_guarantees_desc: "The constitutional compact gives the basin's communities a visible place in the federation."
  independence_wave_iw059_mesopotamia_constitutional_compact: "Baghdad Constitutional Compact"
  independence_wave_iw059_mesopotamia_constitutional_compact_desc: "A federal charter binds provincial autonomy to a shared defense and revenue settlement."
