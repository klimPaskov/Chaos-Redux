l_english:
KRG_warren_kruger: "Doctor Warren Kruger"
KRG_warren_kruger_desc: "A fiercely private scientist whose command of every major research discipline has no obvious contemporary equal."
KRG_warren_kruger_scientist_desc: "Kruger moves between atomic theory, aeronautics, naval engineering, land systems, chemical research, and biomedicine as though they were one subject."
brilliant_scientist_warren_kruger_advisor: "Doctor Warren Kruger"
brilliant_scientist_warren_kruger_advisor_desc: "Kruger's unified research method places every national laboratory within reach of the same extraordinary intellect."
brilliant_scientist_research_director: "The Kruger Method"
brilliant_scientist_research_director_desc: "Every research programme is reorganized around Kruger's proofs, instruments, and relentless review."
brilliant_scientist_polymath: "Universal Polymath"
brilliant_scientist_polymath_desc: "Kruger possesses extreme practical command of every special-project field."

chaosx.nr16.1.t: "Brilliant Scientist"
chaosx.nr16.2.t: "Doctor Warren Kruger"
chaosx.nr16.2.d: "A fixed-wing guidance assembly, a compact isotope separator, and a bacterial culture that should have taken months to stabilize sit together on the same laboratory bench. Doctor Warren Kruger claims responsibility for all three. He offers no institutional pedigree and asks for no ceremonial title. He asks only for laboratories, authority, and a place inside our government."
chaosx.nr16.2.evolution_i.d: "Doctor Warren Kruger's name has been circulating through universities and ministries for months. The papers accompanying him include a reproducible conventional result and a list of competing institutions that already want to supervise his work. He asks for laboratories, authority, and a place inside our government, but the appointment is also a decision about who will inherit a scientific reputation that has arrived before its owner."
chaosx.nr16.2.evolution_ii.d: "Doctor Warren Kruger arrives under observation. Foreign services have already copied fragments of his work, and the sealed case contains a prototype proposal alongside the instruments that made his reputation. He asks for laboratories, authority, and protection from the governments now trying to claim him. Any appointment will be a scientific decision and an international alignment."
chaosx.nr16.2.evolution_iii.d: "Doctor Warren Kruger arrives with an impossible prototype and assistants who refuse to describe exactly how it works. The equipment answers questions that ordinary laboratories cannot ask, while rival ministries argue that the safest place for it is under their control. He asks for laboratories, authority, and a government willing to decide whether forbidden science can have a public owner."
chaosx.nr16.2.evolution_iv.d: "Doctor Warren Kruger arrives with an international reputation, advanced prototypes, and a small circle of assistants who treat his instructions as standing law. Foreign powers are already moving, and the laboratory's first security report names sovereignty as a practical risk rather than a constitutional word. He still asks for a real appointment, but the state must choose its terms before his network chooses them for us."
chaosx.nr16.2.refugee.d: "Doctor Warren Kruger arrives through a network of displaced scholars who have carried instruments, notebooks, and unfinished experiments across several borders. Their community can make a new laboratory more generous than the offices that refused them, but it will need a government willing to protect its plural membership."
chaosx.nr16.2.colonial.d: "Doctor Warren Kruger arrives with a proposal for laboratories linked across the empire. Remote institutes can provide space, materials, and distance from crowded ministries, yet every overseas site adds another administration that may claim a share of the work."
chaosx.nr16.2.university.d: "Doctor Warren Kruger arrives with a reproducible result that has already unsettled the national academies. The universities want the papers opened to review, while the cabinet must decide whether a national chair can carry research across every field without becoming a private institution."
chaosx.nr16.2.industrial.d: "Doctor Warren Kruger arrives with designs that factory engineers can reproduce only after watching his demonstration. Industrial firms have offered machinery and contracts before the appointment is signed, so the government must decide whether production will serve the laboratory or own it."
chaosx.nr16.2.militarized.d: "Doctor Warren Kruger arrives under the attention of the general staff, which has already identified several uses for his methods. The weapons office can give him protection and immediate access, but the appointment will place every later experiment inside a chain of command."
chaosx.nr16.2.threatened.d: "Doctor Warren Kruger arrives while the country is counting damaged workshops and shortened supply lines. His laboratories could give a threatened government a way to survive the next crisis, provided the state can spare the authority and material needed to protect the work."
chaosx.nr16.2.a: "Appoint him before the cameras."
chaosx.nr16.2.b: "Place him under sealed military authority."
chaosx.nr16.2.c: "Arrange a foreign appointment."

chaosx.nr16.3.t: "Doctor Warren Kruger"
chaosx.nr16.3.d: "Officials in [brilliant_scientist_send_away_rejector.GetNameDef] declined Doctor Warren Kruger's application and quietly forwarded his papers to us. The instruments accompanying him answer several questions before our experts can finish asking them. His biography remains fragmentary, but his offer is immediate: staff, archives, laboratories, and production access in exchange for results across every field we can name."
chaosx.nr16.3.evolution_i.d: "Officials in [brilliant_scientist_send_away_rejector.GetNameDef] declined Doctor Warren Kruger's application even after universities there began circulating a conventional result under his name. The forwarded papers include a reproducible method and competing claims to supervise it. His offer is immediate: staff, archives, laboratories, and production access in exchange for results across every field we can name."
chaosx.nr16.3.evolution_ii.d: "Officials in [brilliant_scientist_send_away_rejector.GetNameDef] declined Doctor Warren Kruger's application after foreign observers began asking for copies of his work. The forwarded papers include a prototype proposal and enough intelligence traffic to make his arrival a diplomatic problem. His offer is immediate: staff, archives, laboratories, and protection from the governments now trying to claim him."
chaosx.nr16.3.evolution_iii.d: "Officials in [brilliant_scientist_send_away_rejector.GetNameDef] declined Doctor Warren Kruger's application after an impossible prototype appeared in a sealed inventory. The assistants who travel with him will not explain the instrument, but they will work for the state that gives them a laboratory. His offer is immediate: staff, archives, and forbidden methods in exchange for a government willing to own the risk."
chaosx.nr16.3.evolution_iv.d: "Officials in [brilliant_scientist_send_away_rejector.GetNameDef] declined Doctor Warren Kruger's application after several powers began competing to protect or seize his programme. He arrives with advanced prototypes, a loyal assistant network, and a reputation that has outgrown any one passport. His offer is immediate, but receiving him means choosing terms before the network chooses a country of its own."
chaosx.nr16.3.refugee.d: "Officials in [brilliant_scientist_send_away_rejector.GetNameDef] declined Doctor Warren Kruger's application even though displaced scholars had already gathered around his instruments. The papers now reach us with the assistants who carried them, and our government must decide whether it can protect a community that no longer belongs to one country."
chaosx.nr16.3.colonial.d: "Officials in [brilliant_scientist_send_away_rejector.GetNameDef] declined Doctor Warren Kruger's application after their overseas institutes disputed the cost of his programme. The forwarded papers include plans for remote laboratories, and accepting him would place our ministries inside a contest over who controls the distant sites."
chaosx.nr16.3.university.d: "Officials in [brilliant_scientist_send_away_rejector.GetNameDef] declined Doctor Warren Kruger's application after their academies failed to agree on a national chair. The reproducible result now comes to our universities, which must decide whether to open the review or give one director authority over every field."
chaosx.nr16.3.industrial.d: "Officials in [brilliant_scientist_send_away_rejector.GetNameDef] declined Doctor Warren Kruger's application after firms there disputed his production terms. His designs now arrive with the instruments that made them work, and our factories will ask for access before the government has decided who may supervise the programme."
chaosx.nr16.3.militarized.d: "Officials in [brilliant_scientist_send_away_rejector.GetNameDef] declined Doctor Warren Kruger's application after the general staff classified his methods and then refused the requested resources. He arrives with a security problem attached to every prototype, offering his service to the government that can command the risk."
chaosx.nr16.3.threatened.d: "Officials in [brilliant_scientist_send_away_rejector.GetNameDef] declined Doctor Warren Kruger's application while their own workshops were being pulled into emergency repairs. The forwarded papers offer a chance to build protection around the laboratory before the next crisis reaches us, but every resource spent on him will be counted elsewhere."
chaosx.nr16.3.a: "Receive him as a public scientific director."
chaosx.nr16.3.b: "Move him into a sealed military programme."

brilliant_scientist_public_appointment_effect_tt: "Recruit Doctor Warren Kruger as the same national advisor and special-project scientist in every field. His active public appointment grants +100% Research Speed, opens the public Directorate route, and begins with greater public attention and lower institutional dependence."
brilliant_scientist_secret_appointment_effect_tt: "Recruit Doctor Warren Kruger as the same national advisor and special-project scientist in every field. His active secret appointment grants +100% Research Speed, opens the compartmentalized Directorate route, and begins with stronger security, lower exposure, and greater institutional dependence."
brilliant_scientist_send_away_effect_tt: "Kruger remains unrecruited here. [brilliant_scientist_send_away_recipient.GetNameDefCap] receives the appointment choice, while our refusal becomes part of the permanent history of the programme."

chaosx.nr16.15.t: "The Appointment We Refused"
chaosx.nr16.15.public.d: "The refusal did not end Doctor Warren Kruger's career. [brilliant_scientist_send_away_recipient.GetNameDef] accepted him as a public scientific director, and the papers we forwarded now circulate through a compact we cannot supervise. Our intelligence office can record the consequence, but it cannot reclaim the appointment without creating a new crisis. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.15.secret.d: "The refusal did not end Doctor Warren Kruger's career. [brilliant_scientist_send_away_recipient.GetNameDef] placed him under a sealed directorate, and the instruments we forwarded are now inside a security chain we do not control. Our intelligence office can record the consequence, but it cannot reclaim the appointment without creating a new crisis. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.15.default.d: "The refusal did not end Doctor Warren Kruger's career. [brilliant_scientist_send_away_recipient.GetNameDef] accepted the appointment, and the papers we forwarded now support a laboratory programme beyond our authority. The intelligence office can record the consequence, but the decision to send him away cannot be undone here. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.15.a: "Enter the consequence in the intelligence register."
brilliant_scientist_rejection_reaction_effect_tt: "Record the referred appointment and close the temporary rejection memory. This report creates no second Kruger and no new claim on the programme."

# One-time public milestones. These headlines are descriptive only; the
# source effects own their persistent guards and no headline grants a reward.
chaosx.nr16.304.t: "A Scientist Takes the Podium"
chaosx.nr16.304.d: "A government has placed Doctor Warren Kruger at the head of a public laboratory programme. The appointment is being treated as a national scientific commitment, and every foreign observer now has a reason to ask what the new director intends to build. [This.GetBrilliantScientistNewsHostFlavorClause]"
chaosx.nr16.304.a: "Acknowledge the appointment."
chaosx.nr16.305.t: "The Kruger Method Crosses Borders"
chaosx.nr16.305.d: "Delegations, laboratories, and ministries have begun treating Doctor Warren Kruger's work as an international fact. Invitations and warnings arrive together as governments compete for access to a programme whose public record is no longer confined to one country. [This.GetBrilliantScientistNewsHostFlavorClause]"
chaosx.nr16.305.a: "Record the international interest."
chaosx.nr16.306.t: "A Breakthrough Leaves the Laboratory"
chaosx.nr16.306.d: "A public demonstration has carried the Kruger Directorate's first impossible prototype beyond its guarded rooms. The result is too visible to dismiss and too dangerous to explain away, leaving every major power to decide whether to study, copy, or contain it. [This.GetBrilliantScientistNewsHostFlavorClause]"
chaosx.nr16.306.a: "Read the report."
chaosx.nr16.307.t: "A New State of the Laboratory"
chaosx.nr16.307.d: "The laboratories and territories gathered around Doctor Warren Kruger have declared a sovereign order of their own. A new state now claims the workshops, archives, and project cadres that once answered to another government. [This.GetBrilliantScientistNewsHostFlavorClause]"
chaosx.nr16.307.a: "Note the new state."
chaosx.nr16.308.t: "The First Project Army Appears"
chaosx.nr16.308.d: "An experimental formation has left the laboratory perimeter and entered the field. Its equipment and personnel do not fit any ordinary military category, and the deployment makes clear that the Directorate's projects are no longer confined to research facilities. [This.GetBrilliantScientistNewsHostFlavorClause]"
chaosx.nr16.308.a: "Follow the deployment."
chaosx.nr16.309.t: "The Containment Coalition Meets"
chaosx.nr16.309.d: "Governments confronted by the Kruger world threat have begun coordinating a containment coalition. Intelligence offices compare laboratory sites, military planners exchange countermeasures, and the programme's expansion is now being treated as a common international emergency. [This.GetBrilliantScientistNewsHostFlavorClause]"
chaosx.nr16.309.a: "Record the coalition."

chaosx.nr16.16.t: "A Visitor Out of Sequence"
chaosx.nr16.16.current.d: "The traveler who appeared in the national record has left a second kind of evidence behind. While the temporary report is still fresh, its descriptions of Doctor Kruger's work line up with instruments that should not have been able to measure him. The Directorate can treat the contact as a warning without pretending that it explains the visitor. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.16.archived.d: "The temporary account has expired, but the Directorate's archive still contains the traveler's impossible description of Doctor Kruger's work. It is not a project result and it is not proof of an origin. It is a warning that the temporal question can be studied before the next witness disappears. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.16.a: "Enter the warning in the temporal ledger."
brilliant_scientist_time_traveler_contact_effect_tt: "Record the Time Traveler contact as a one-time temporal lead. This report grants no project stage, resources, units, claim, evolution, or event-log entry."

chaosx.nr16.17.t: "The Artifact Answers Back"
chaosx.nr16.17.recovered.d: "The Antarctic recovery team has delivered more than a specimen and a set of instruments. Doctor Kruger's notes identify a pattern in the recovered material that resembles a deliberately engineered interface, but the resemblance is not a conclusion. The Directorate can preserve the observation as a lead while the recovered evidence remains under its original custody. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.17.archived.d: "The Antarctic report is now an archived lead rather than a fresh discovery. The recovered material still qualifies the alien-arms question for study, but the Directorate has not proved an origin, copied an artifact, or advanced a project by filing this observation. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.17.a: "File the recovered interface as a lead."
brilliant_scientist_alien_artifact_contact_effect_tt: "Record the Antarctic artifact contact as a one-time alien-arms lead. This report grants no project stage, resources, units, claim, origin conclusion, evolution, or event-log entry."

chaosx.nr16.18.t: "The Wreckage Has a Weapons Shape"
chaosx.nr16.18.d: "The recovered spacecraft has no place in any known inventory. The recovery team is cataloguing the wreckage while Doctor Warren Kruger identifies its geometry as a weapons architecture. His recognition is a lead for the Directorate, and the physical evidence remains with the recovery team. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.18.a: "File Kruger's recognition as a lead."
brilliant_scientist_alien_spacecraft_contact_effect_tt: "Record the recovered spacecraft as a one-time alien-arms lead. This report grants no project stage, resources, units, claim, origin conclusion, evolution, or event-log entry."
brilliant_scientist_tech_sharing_joined_tt: "With Kruger active, joining this network raises Mandate by 5, Exposure by 5, Project Capacity by 10, and Independent Capacity by 10. Dependence and Grievance each fall by 5. The Directorate records the shared-science posture once."
brilliant_scientist_tech_sharing_refused_tt: "With Kruger active, refusing this network raises Mandate and Dependence by 10, Project Capacity by 5, and Grievance by 10. Exposure and Independent Capacity each fall by 5. The Directorate records the private-science posture once."
brilliant_scientist_assistant_breakthrough_effect_tt: "Kruger's assistants turn the gift into an independent breakthrough. Mandate rises by 10, Dependence falls by 5, Exposure rises by 5, Project Capacity rises by 5, Independent Capacity rises by 10, and Grievance falls by 5. This receipt can be recorded once."
brilliant_scientist_missile_crisis_effect_tt: "Kruger links the new rocket sites to a propulsion and guidance lead. Mandate rises by 5, Dependence rises by 5, Exposure rises by 10, Project Capacity rises by 5, Independent Capacity rises by 5, and Grievance rises by 5. This infrastructure receipt can be recorded once."
brilliant_scientist_space_race_effect_tt: "Kruger treats the space race as a public rocketry opportunity. Mandate rises by 5, Dependence falls by 5, Exposure rises by 5, Project Capacity rises by 5, Independent Capacity rises by 10, and Grievance falls by 5. This receipt can be recorded once."
brilliant_scientist_mass_panic_effect_tt: "The panic becomes a public-risk receipt for the Directorate. Mandate falls by 5, Dependence rises by 5, Exposure rises by 15, Project Capacity falls by 5, Independent Capacity falls by 5, and Grievance rises by 10. This receipt can be recorded once."
brilliant_scientist_nuclear_milestone_effect_tt: "Kruger marks the nuclear milestone as a delivery-architecture lead. Mandate rises by 5, Dependence rises by 10, Exposure rises by 10, Project Capacity rises by 10, Independent Capacity rises by 5, and Grievance rises by 5. This receipt can be recorded once."
brilliant_scientist_doctrine_research_effect_tt: "Kruger records the doctrine decision as an external military-research posture. Mandate rises by 5, Dependence falls by 5, Project Capacity and Independent Capacity each rise by 5, and Grievance falls by 5. This receipt can be recorded once."
brilliant_scientist_asteroid_impact_effect_tt: "The impact becomes a Directorate exposure and capacity shock. Mandate falls by 5, Dependence rises by 5, Exposure rises by 15, Project Capacity falls by 5, Independent Capacity falls by 5, and Grievance rises by 10. This receipt can be recorded once."
