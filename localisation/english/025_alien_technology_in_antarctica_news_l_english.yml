chaosx.news.25.t: "Alien Technology in Antarctica"
chaosx.news.25.d: "Reports from Antarctica confirm a cluster of impossible readings beneath the ice. Governments are dispatching scientific expeditions to establish outposts, verify the evidence, and discover what the buried structure can still teach us."
chaosx.news.25.a: "The discovery is significant."

chaosx.news.26.t: "Antarctica Race Over"
chaosx.news.26.d: "[FROM.GetName] has won the race to the Antarctic recovery site and secured the only confirmed cache of the alien-derived system. Other expeditions retain only the survey evidence and fragments they verified."
chaosx.news.26.a: "The ice has yielded one answer."
