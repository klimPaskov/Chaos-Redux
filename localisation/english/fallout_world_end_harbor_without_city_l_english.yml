fallout.event_log.harbor_without_city.detail.choice_military_occupation: "The harbor accepted military control of its gates and cranes."
fallout.event_log.harbor_without_city.detail.choice_evacuate: "The harbor loaded families, tools, and berth records onto the convoy route."
fallout.event_log.harbor_without_city.detail.port_republic_success: "The elected dock council opened the cranes and kept a named food register."
fallout.event_log.harbor_without_city.detail.port_republic_partial: "The first council governed the piers while a warehouse claim stayed contested."
fallout.event_log.harbor_without_city.detail.port_republic_failure: "The election failed during the count and garrison clerks took the berth records."
fallout.event_log.harbor_without_city.detail.inland_alliance_success: "Inland wards shared road crews, grain audits, and a seal with the harbor."
fallout.event_log.harbor_without_city.detail.inland_alliance_partial: "Two inland wards joined the harbor register while one kept its own toll book."
fallout.event_log.harbor_without_city.detail.inland_alliance_failure: "Delegates arrived after the cranes stopped and guards seized the road stores."
fallout.event_log.harbor_without_city.detail.military_occupation_success: "Named garrison officers secured the harbor gates and food reserve."
fallout.event_log.harbor_without_city.detail.military_occupation_partial: "The garrison secured fuel while the crews kept the fish quay."
fallout.event_log.harbor_without_city.detail.military_occupation_failure: "The occupation emptied the reserve and turned the harbor into a captured town."
fallout.event_log.harbor_without_city.detail.evacuate_success: "Families, tools, clinic ledgers, and the lighthouse lens left on three hulls."
fallout.event_log.harbor_without_city.detail.evacuate_partial: "The evacuation saved the clinic and two crane crews, but left families waiting."
fallout.event_log.harbor_without_city.detail.evacuate_failure: "Ash closed the channel and scattered cargo and berth records across the harbor."
fallout.event_log.harbor_without_city.detail.callback_success: "The harbor kept a named authority register and a working road seal."
fallout.event_log.harbor_without_city.detail.callback_partial: "The harbor remained useful while a rival council contested one shared ledger."
fallout.event_log.harbor_without_city.detail.callback_failure: "The review found a guarded pier, an empty reserve, and no trusted road authority."
fallout.event_log.harbor_without_city.detail.cancelled: "The harbor record was cancelled after its state, partner, owner, controller, or generation changed."
