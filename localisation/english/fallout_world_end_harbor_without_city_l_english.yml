chaosx.fallout.782.t: "The Harbor Without a City"
chaosx.fallout.782.opening.d: "The convoy route has outlived the inland government. Three ash-stained piers still unload grain, but the capital no longer sends a clerk or a guard. The West African Port Confederacies must decide whether the harbor becomes a republic, binds itself to inland wards, accepts a garrison, or moves its people before the next tide."
chaosx.fallout.782.a: "Build a port republic"
chaosx.fallout.782.a.tt: "Spend Food 3, Medicine 2, and Recognition 2 to place the harbor under a council elected by crews, dock workers, and berth holders."
chaosx.fallout.782.b: "Bind an inland alliance"
chaosx.fallout.782.b.tt: "Spend Scrap 2, Power 3, and Recognition 3 to join the port's stores to named inland wards and share the road guard."
chaosx.fallout.782.c: "Accept military occupation"
chaosx.fallout.782.c.tt: "Spend Fuel 2 and Recognition 3, then accept a Cohesion cost, to let the harbor garrison control the cranes and gates."
chaosx.fallout.782.d: "Evacuate the harbor"
chaosx.fallout.782.d.tt: "Spend Food 3, Medicine 2, Fuel 2, and Recognition 2 to load families, tools, and berth records onto the convoy route."
chaosx.fallout.783.t: "The Harbor Without a City"
chaosx.fallout.784.t: "A Port Must Choose Its Government"
chaosx.fallout.784.port_republic.success.d: "The dock crews elected a council before the next ash tide. Berth holders, crane teams, and the lighthouse keeper each hold a named seat, while the port keeps its own food register and answers inland petitioners."
chaosx.fallout.784.port_republic.partial.d: "The first council opened the cranes, but the largest warehouse stayed under one owner's seal. The port can govern its piers while a contested claim waits for a public hearing."
chaosx.fallout.784.port_republic.failure.d: "The election hall lost power during the count. Garrison clerks carried the berth records away, the hungry districts received no schedule, and the new republic begins under a broken trust memory."
chaosx.fallout.784.inland_alliance.success.d: "The inland wards sent road crews and grain auditors to the harbor. A shared road seal now covers the pier, the first bridge, and the clinic storehouse, so the city can trade without pretending the capital returned."
chaosx.fallout.784.inland_alliance.partial.d: "Two inland wards joined the harbor register and one kept its own toll book. The alliance moves food again, yet each crossing still asks which council owns the road."
chaosx.fallout.784.inland_alliance.failure.d: "The inland delegates arrived after the cranes stopped. Their guards seized the road stores, the harbor crews hid the cargo lists, and the proposed alliance became another border dispute."
chaosx.fallout.784.military_occupation.success.d: "The garrison posted named officers at every gate and kept the cranes working through the ash. It protects the food reserve, but every dock worker now signs a military pass before entering the harbor."
chaosx.fallout.784.military_occupation.partial.d: "The garrison secured the fuel tanks and left the fish quay to the crews. The harbor has a guard chain, but its authority ends where the inland road begins."
chaosx.fallout.784.military_occupation.failure.d: "The occupation emptied the port's reserve into a convoy order that never arrived. Soldiers hold the gate, dock workers refuse the cranes, and the inland wards call the harbor a captured town."
chaosx.fallout.784.evacuate.success.d: "The harbor loaded families, tools, clinic ledgers, and the lighthouse lens onto three convoy hulls. The empty piers remain a claim on the map, while the survivors carry a precise record of every berth left behind."
chaosx.fallout.784.evacuate.partial.d: "The evacuation saved the clinic and two crane crews, but the food reserve could not cover every inland family. The fleet leaves with a route memory and a list of names still waiting on the quay."
chaosx.fallout.784.evacuate.failure.d: "Ash closed the channel before the last hull cleared the reef. Cargo, medicine, and berth records were scattered across the old harbor, leaving the convoy route with more claimants than space."
chaosx.fallout.784.a: "Close the harbor record"
chaosx.fallout.784.a.tt: "Apply the delayed harbor outcome, record its government memory, and release the reserved harbor and partner rows."
chaosx.fallout.786.t: "The Harbor's New Claim"
chaosx.fallout.786.success.d: "The harbor's authority now has a named register and a working road seal. The surviving government can bargain with inland wards without erasing the people who kept the cranes moving."
chaosx.fallout.786.partial.d: "The harbor survives as a useful place, but its government still shares one ledger with a rival council. The next convoy can dock while the claim remains contested."
chaosx.fallout.786.failure.d: "The review found a guarded pier, an empty reserve, and three incompatible maps. The harbor has people and ships, but no authority trusted by the road beyond its gate."
chaosx.fallout.786.a: "Close the government review"
chaosx.fallout.786.a.tt: "Apply the delayed harbor review, write the final government memory, and release the reserved harbor and partner rows."
