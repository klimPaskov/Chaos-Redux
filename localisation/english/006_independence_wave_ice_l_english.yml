l_english:
  independence_wave_ice_hold_the_harbour: "Hold the Harbour Together"
  independence_wave_ice_hold_the_harbour_desc: "Iceland's first Event 006 winter is a contest between a fragile port authority, a short coastline, and a former host that still has a claim to the island's future. Keep Reykjavík and the harbour in our hands while the emergency republic builds a serviceable state."
  independence_wave_ice_reconcile_shipping_registers: "Reconcile the Shipping Registers"
  independence_wave_ice_reconcile_shipping_registers_desc: "Merge municipal lists, merchant manifests, and customs seals into one working register. The port will carry the republic only if its ledgers agree."
  independence_wave_ice_charter_municipal_council: "Charter the Municipal Council"
  independence_wave_ice_charter_municipal_council_desc: "Give fishing towns, harbour officials, and the provisional cabinet a common charter. It costs factories and administrative labour, but makes the emergency government legible to its own citizens."
  independence_wave_ice_expand_coastwatch: "Expand the Coastwatch"
  independence_wave_ice_expand_coastwatch_desc: "Put patrol craft, local guards, and signal stations under one coastwatch command. The island cannot deter a landing with speeches alone."
  independence_wave_ice_negotiate_north_atlantic_compact: "Negotiate the North Atlantic Compact"
  independence_wave_ice_negotiate_north_atlantic_compact_desc: "Use the informal network to turn shared shipping, patrol, and recognition into a chartered North Atlantic Compact. The agreement is a negotiation, not a free alliance."
  independence_wave_ice_settle_former_host_charter: "Settle the Former Host Charter"
  independence_wave_ice_settle_former_host_charter_desc: "Settle property, citizens' rights, border claims, and future shipping access with the surviving former host. Recognition is cheaper than a permanent war, but it requires a credible ledger."
  independence_wave_ice_declare_armed_neutrality: "Declare Armed Neutrality"
  independence_wave_ice_declare_armed_neutrality_desc: "Bind the emergency republic to armed neutrality: no patron receives a blank cheque, and no fleet approaches the island without an answer."
  independence_wave_ice_shipping_registers_effect_tt: "Port Authority, Civic Cohesion, Shipping Security, and Compact Support improve as the island's registers are reconciled."
  independence_wave_ice_municipal_charter_effect_tt: "The municipal shipping council is established. Civic Cohesion and recognition improve."
  independence_wave_ice_coastwatch_effect_tt: "Coastwatch readiness and shipping security improve, and the emergency command becomes visible."
  independence_wave_ice_compact_effect_tt: "Network standing and league cohesion improve; the North Atlantic Compact route is now open to formation."
  independence_wave_ice_host_charter_effect_tt: "The former-host ledger is settled as recognized separation, reducing claim, hostility, property, population, pressure, and reconquest fear while recording obligations and border progress."
  independence_wave_ice_armed_neutrality_effect_tt: "The emergency military route is locked. Coastwatch readiness and shipping security rise at the cost of civic cohesion."
  independence_wave_ice_project_failure_effect_tt: "The harbour project failed or was abandoned. Iceland's public statehood values and Event 006 ledgers deteriorate."
  ice_exposed_north_atlantic_charter: "Exposed North Atlantic Charter"
  ice_exposed_north_atlantic_charter_desc: "The emergency republic has a port but not yet a dependable state."
  ice_north_atlantic_service_compact: "North Atlantic Service Compact"
  ice_north_atlantic_service_compact_desc: "Municipal shipping, customs, and coastwatch institutions now reinforce one another."
  ice_municipal_shipping_council: "Municipal Shipping Council"
  ice_municipal_shipping_council_desc: "A chartered council joins harbour officials, fishing towns, and the provisional cabinet."
  ice_coastwatch_emergency_command: "Coastwatch Emergency Command"
  ice_coastwatch_emergency_command_desc: "Patrol craft and local guards share signals, stores, and a common emergency chain of command."
  ice_north_atlantic_patron_mandate: "North Atlantic Patron Mandate"
  ice_north_atlantic_patron_mandate_desc: "A patron's shipping and security support comes with an influence ledger that the republic must eventually balance."
  independence_wave_ice_north_atlantic_category: "North Atlantic Republic"
  independence_wave_ice_north_atlantic_category_desc: "Reykjavík's emergency government must keep the harbour working, settle with the former host, and decide how far it will bind itself to the wider network.\n\nPort Authority: §Y[?independence_wave_ice_port_authority|0]§!   Civic Cohesion: §Y[?independence_wave_ice_civic_cohesion|0]§!   Coastwatch Readiness: §Y[?independence_wave_ice_coastwatch_readiness|0]§!   Shipping Security: §Y[?independence_wave_ice_shipping_security|0]§!   Compact Support: §Y[?independence_wave_ice_compact_support|0]§!\n\nFormer Host Claims: §R[?independence_wave_host_claim_intensity|0]§!   Hostility: §R[?independence_wave_hostility|0]§!   Obligations: §Y[?independence_wave_host_obligations|0]§!   Property Dispute: §R[?independence_wave_property_dispute|0]§!   Population Dispute: §R[?independence_wave_population_dispute|0]§!   Border Settlement: §G[?independence_wave_border_settlement_progress|0]§!   Host Pressure: §R[?independence_wave_host_domestic_pressure|0]§!   Reconquest Fear: §R[?independence_wave_reconquest_fear|0]§!\n\nNetwork Standing: §Y[?independence_wave_network_standing|0]§!   League Cohesion: §Y[?global.independence_wave_league_cohesion|0]§!   Common Cause: §Y[?global.independence_wave_league_common_cause|0]§!   Patron Capture: §R[?global.independence_wave_league_patron_capture|0]§!   Shared Reserve: §Y[?global.independence_wave_league_shared_reserve|0]§!   Member Confidence: §Y[?global.independence_wave_league_member_confidence|0]§!"
