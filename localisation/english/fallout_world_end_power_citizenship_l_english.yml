chaosx.fallout.866.t: "Power as Citizenship"
chaosx.fallout.866.opening.d: "The Repair Charter kept one workshop ledger alive, but it never answered who should own the current. In the Manchurian Reactor Keeps, three eastern substations can feed clinics, schools, or a protected rail line. The Technate must decide whether power is public citizenship, an engineer state, a grid empire, or a machine transition under human audit."
chaosx.fallout.866.a: "Make power a public service"
chaosx.fallout.866.a.tt: "Spend Food 2, Medicine 1, and Recognition 2 to place the eastern substations under a public service register. Every settlement may request power, but the Keeps must publish its shortages."
chaosx.fallout.866.b: "Constitute an engineer state"
chaosx.fallout.866.b.tt: "Spend Power 2, Scrap 2, and Recognition 1 to put certified engineers in charge of the grid and its production quotas. The state gains control, but local councils lose their veto."
chaosx.fallout.866.c: "Build a grid empire"
chaosx.fallout.866.c.tt: "Spend Fuel 1, Medicine 2, and Recognition 2 to tie eastern settlements to one protected grid compact. Clients receive current first, while the Keeps sets the terms of access."
chaosx.fallout.866.d: "Authorize a machine transition"
chaosx.fallout.866.d.tt: "Spend Medicine 1, Fuel 2, and Recognition 2 to let the planning machine schedule power while a human review board can overrule it. Efficiency rises, but every exception becomes a political test."
chaosx.fallout.867.t: "Power as Citizenship"
chaosx.fallout.868.t: "The Power Register"
chaosx.fallout.868.public_service_republic.success.d: "The Keeps opened a public power register and gave river settlements a vote on clinic, school, and rail demand. The first published shortage list was painful, yet it kept three neighborhoods from being cut off without warning."
chaosx.fallout.868.public_service_republic.partial.d: "The public register reached the nearest settlements, but the rail ward claimed priority over a clinic outside the walls. The Technate kept the list open and sent a civic auditor to publish the next allocation."
chaosx.fallout.868.public_service_republic.failure.d: "The public register promised every settlement a voice, but no ward accepted the burden of declaring a shortage. A cold convoy arrived without current, and outer councils now demand private guarantees before they join."
chaosx.fallout.868.engineer_state.success.d: "Certified engineers took command of the substations and published production quotas for the Keeps. The rail depots received steady current, while the new state trained apprentices to replace the crews lost during the ash season."
chaosx.fallout.868.engineer_state.partial.d: "The engineer state stabilized the main line, but one outer council lost its right to review a quota. The Keeps granted an emergency seat and kept the production schedule under certification."
chaosx.fallout.868.engineer_state.failure.d: "An engineer quota diverted current from a clinic whose council could not meet the new production target. The pump failed during the dispute, and neighboring wards now treat the Technate as a factory that charges for citizenship."
chaosx.fallout.868.grid_empire.success.d: "The Keeps bound eastern settlements to one protected grid compact. Client wards received current before the ash roads froze, and every transfer carried a visible price, a repair duty, and a seat at the next compact review."
chaosx.fallout.868.grid_empire.partial.d: "The grid compact kept its clients connected, but three settlements disputed the price of protected current. The Keeps accepted the complaint and sent a joint delegation before the next winter allocation."
chaosx.fallout.868.grid_empire.failure.d: "The first grid compact became a contest over who could set the access price. No common roster reached the outer substations, and each client held its reserve while clinics waited for a contract."
chaosx.fallout.868.machine_transition.success.d: "The planning machine scheduled the substations around clinic hours, food lifts, and rail repair. A human review board overturned two unsafe orders, and the published exceptions gave citizens a reason to trust the transition."
chaosx.fallout.868.machine_transition.partial.d: "The machine kept the radio corridor alive, but a civilian ward could not understand why its clinic was moved behind a freight lift. The Keeps released an appeal process and limited the next schedule to audited districts."
chaosx.fallout.868.machine_transition.failure.d: "A hidden machine priority diverted current from a clinic to a repair depot. The board could not reconstruct the decision, and civilian councils now refuse any schedule whose exceptions cannot be read aloud."
chaosx.fallout.868.a: "Record the power register"
chaosx.fallout.868.a.tt: "Record the delayed result, apply its Air Winter, Supply Access, government, and recognition effects, and open the later citizenship audit."
chaosx.fallout.869.t: "Power as Citizenship"
chaosx.fallout.870.t: "The Citizenship Audit"
chaosx.fallout.870.success.d: "The audit found a durable answer to who may request, schedule, and overrule the eastern current. The Keeps kept a named citizenship board, and every future allocation will carry a public reason and a recorded exception."
chaosx.fallout.870.partial.d: "The audit saved the allocation register and the human review notes, but one outer ward still follows a private power schedule. The Technate accepted a narrow exception while the board prepares a conversion team."
chaosx.fallout.870.failure.d: "The audit found no trusted way to reconcile public citizenship with the private schedule held by the substations. The Keeps can still power its own grid, but neighboring settlements now charge for every seat at the register."
chaosx.fallout.870.a: "Close the citizenship audit"
chaosx.fallout.870.a.tt: "Apply the delayed audit, write the durable identity memory, and release the reserved state and neighboring receipts."
chaosx.fallout.871.t: "Power as Citizenship"
