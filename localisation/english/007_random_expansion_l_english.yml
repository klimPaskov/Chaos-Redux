l_english:
chaosx.nr7.1.t: "Fury"
chaosx.nr7.2.t: "Fury Takes Command"
chaosx.nr7.2.d: "Reservists fill barracks in [ROOT.GetName], and officers assemble armed columns for an invasion. The commanders send their men toward a neighboring frontier without delivering a demand to its government."
chaosx.nr7.2.a: "The border is no longer secure."
chaosx.nr7.3.t: "No Country Can Enter Fury"
chaosx.nr7.3.d: "Fury can begin only in an independent minor with at least one neighboring country it can attack. Player countries, their allies, and their subjects cannot become Fury's starting country."
chaosx.nr7.3.a: "Understood."
chaosx.nr7.10.t: "Fury Target Loop"
chaosx.nr7.20.t: "Fury Weekly Reinforcement"
chaosx.nr7.30.t: "Fury First Conquest"
chaosx.nr7.40.t: "Fury Evolution Sync"
chaosx.news.7007.t: "Fury Troops Cross the Frontier"
chaosx.news.7007.d: "The forces of [fury_news_actor.GetName] have taken foreign territory and keep advancing. Soldiers push farther along the roads as civilians flee the occupied towns."
chaosx.news.7007.a: "The fighting has crossed the border."
chaosx.news.7008.t: "[GetFuryOpeningNewsTitle]"
chaosx.news.7008.d: "[GetFuryOpeningNewsDescription]"
chaosx.news.7008.a: "Watch the border."
fury_national_fury: "National Fury"
fury_national_fury_desc: "The government directs the country toward rapid conquest and emergency mobilization."
fury_hardened_fury: "Hardened Fury"
fury_hardened_fury_desc: "The War Office forces more citizens into service as the campaign expands."
fury_overextension: "Fury Overextension"
fury_overextension_desc: "Rapid conquest has strained the country and increased unrest."
fury_compliance_drive: "Compliance Drive"
fury_compliance_drive_desc: "Occupation forces hold seized territory and suppress resistance."
fury_pact_command: "Fury Pact Command"
fury_pact_command_desc: "Fury countries coordinate attacks while keeping their own commands."
fury_rival_doctrine: "Rival Column Doctrine"
fury_rival_doctrine_desc: "Fury countries compete to conquer the next neighbor."
anti_fury_border_watch: "Anti-Fury Border Watch"
anti_fury_border_watch_desc: "Border guards and reserve depots prepare for a nearby Fury attack."
anti_fury_emergency_aid: "Anti-Fury Emergency Aid"
anti_fury_emergency_aid_desc: "Rail crews and depot staff send supplies to countries under Fury attack."
anti_fury_staff_talks: "Firebreak Staff Talks"
anti_fury_staff_talks_desc: "Neighboring commands coordinate border defenses against Fury."
anti_fury_supply_denial: "Anti-Fury Supply Denial"
anti_fury_supply_denial_desc: "Border forces deny Fury access to depots and supply lines."
fury_war_office_category: "Fury War Office"
fury_war_office_category_desc: "Choose targets, supply the army, govern occupied territory, and coordinate with other Fury countries."
anti_fury_response_category: "Anti-Fury Response"
anti_fury_response_category_desc: "Protect borders, aid countries under attack, coordinate defenses, and reject Fury's claims."
fury_select_new_target: "Select the Next Target"
fury_select_new_target_desc: "Order the War Office to choose its next target."
fury_select_new_target_tt: "Declares war on a weaker neighboring country when one is available."
fury_open_forward_depots: "Open Forward Depots"
fury_open_forward_depots_desc: "Deploy a reserve column to reinforce the army."
fury_open_forward_depots_tt: "Uses one reserve to deploy one fully equipped Fury column."
fury_open_forward_depots_reserve_requirement: "At least one Fury reserve column is available."
fury_open_forward_depots_state_requirement: "Fury must own and control at least one state where a column can deploy."
fury_register_occupation_settlement: "Prepare an Occupied State"
fury_register_occupation_settlement_desc: "Prepare one occupied state for civilian integration."
fury_register_occupation_settlement_tt: "Selects one occupied non-core state and improves compliance."
fury_count_captured_registers: "Survey an Occupied State"
fury_count_captured_registers_desc: "Begin administrative work in one occupied state."
fury_count_captured_registers_tt: "Prepares one occupied non-core state for integration."
fury_count_captured_registers_effect_tt: "Administrative work begins in the selected state."
fury_rail_registry_survey: "Survey Occupied Railways"
fury_rail_registry_survey_desc: "Survey railways and depots in an occupied state."
fury_rail_registry_survey_tt: "Surveys one occupied state and lowers occupation pressure."
fury_rail_registry_survey_effect_tt: "The survey improves compliance in the selected state."
fury_garrison_the_names_mission: "Garrison the Names"
fury_garrison_the_names_mission_desc: "Hold the capital and occupied states while garrisons restore order."
fury_core_state_by_administration: "Core by Administration"
fury_core_state_by_administration_desc: "Integrate a highly compliant occupied state through civilian administration."
fury_core_state_by_administration_tt: "Adds one highly compliant occupied state to your core territory and lowers occupation pressure."
fury_core_state_by_administration_effect_tt: "One occupied state joins your core territory through civilian administration."
fury_core_state_by_march: "Core by March"
fury_core_state_by_march_desc: "Integrate an occupied state by force before civilian administration is complete."
fury_core_state_by_march_tt: "Adds one less compliant state to your core territory at the cost shown above."
fury_core_state_by_march_effect_tt: "One occupied state joins your core territory through military force."
fury_restore_the_registers_mission: "Restore Occupation Control"
fury_restore_the_registers_mission_desc: "Hold the capital and occupied states until the occupation crisis eases."
fury_form_war_table: "Form a Fury War Table"
fury_form_war_table_desc: "Coordinate attacks with another Fury country."
fury_form_war_table_tt: "Raises pact cohesion and improves relations with other Fury countries."
fury_mark_rival_column: "Mark a Rival Column"
fury_mark_rival_column_desc: "Challenge another Fury country to conquer more territory."
fury_mark_rival_column_tt: "Strengthens Rival Column Doctrine and raises Fury momentum."
fury_share_terminal_reserves: "Share Reserve Supplies"
fury_share_terminal_reserves_desc: "Send the reservists, rifles, and support supplies shown in the cost to another pact member. Command power coordinates their journey."
fury_share_terminal_reserves_tt: "Sends supplies to another eligible Fury Pact member, strengthens the pact, and eases overextension."
fury_share_terminal_reserves_effect_tt: "Another eligible Fury Pact member receives manpower, rifles, and support equipment."
fury_assign_terminal_fronts: "Assign the Final Fronts"
fury_assign_terminal_fronts_desc: "Coordinate attacks across the World in Fury pact."
fury_assign_terminal_fronts_tt: "Improves pact cohesion, target preparation, and Fury momentum."
fury_assign_terminal_fronts_effect_tt: "Pact members prepare for attack and reduce overextension."
anti_fury_border_watch_tt: "Begins a mission to secure the capital and nearby borders."
anti_fury_border_watch_start_tt: "Hold the capital and border posts until the mission ends to gain Anti-Fury Border Watch."
anti_fury_border_watch_mission: "Hold the Anti-Fury Border Watch"
anti_fury_border_watch_mission_desc: "Hold the capital while border guards prepare for a Fury attack."
anti_fury_send_emergency_aid: "Send Emergency Aid to the Target"
anti_fury_send_emergency_aid_desc: "Send emergency aid to a country under Fury attack."
anti_fury_send_emergency_aid_tt: "Sends aid to a country under Fury attack and reduces Fury momentum."
anti_fury_send_emergency_aid_effect_tt: "Begins a mission to keep the aid route open."
anti_fury_aid_route_mission: "Keep the Aid Route Open"
anti_fury_aid_route_mission_desc: "Keep the aid route open until the mission ends so the recipient can resist Fury."
anti_fury_firebreak_staff_talks: "Firebreak Staff Talks"
anti_fury_firebreak_staff_talks_desc: "Coordinate border defenses with other countries."
anti_fury_firebreak_staff_talks_tt: "Strengthens the shared response to Fury."
anti_fury_firebreak_staff_talks_effect_tt: "Improves defense against nearby Fury countries."
anti_fury_start_supply_denial: "Start Supply Denial"
anti_fury_start_supply_denial_desc: "Deny nearby Fury forces access to rail depots."
anti_fury_start_supply_denial_tt: "Starts a mission to deny supplies to a neighboring Fury country."
anti_fury_start_supply_denial_effect_tt: "Holding the denial until the mission ends increases Fury overextension and lowers its momentum."
anti_fury_supply_denial_mission: "Deny Fury Supply"
anti_fury_supply_denial_mission_desc: "Hold the capital while rail crews and border troops restrict Fury access to local depots."
