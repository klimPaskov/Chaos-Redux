fury_world_in_fury_faction: "The World in Fury"
chaosx.nr7.50.t: "The World in Fury"
chaosx.nr7.50.d: "Fury has spread beyond its first country. Other governments are mobilizing and attacking their neighbors. Their columns keep advancing, and countries once beyond Fury's reach now face the same threat."
chaosx.nr7.50.a: "Fury has spread beyond its first country."
chaosx.nr7.51.t: "Fury Cannot Spread Further"
chaosx.nr7.51.d: "There are too few independent minor countries for Fury to spread farther. Player countries, their allies, and their subjects cannot become new Fury countries."
chaosx.nr7.51.a: "Fury cannot spread farther."
chaosx.nr7.52.t: "Fury Targets a Player Country"
chaosx.nr7.52.d: "The World in Fury pact is preparing to attack [fury_terminal_player_target.GetName]. Its forces are gathering near the border."
chaosx.nr7.52.a: "Defend the border."
chaosx.nr7.53.t: "The Last Fury Breaks"
chaosx.nr7.53.d: "The last leading Fury country has fallen. Its forces can no longer carry the war to another country."
chaosx.nr7.53.a: "The advance is over."
chaosx.nr7.60.t: "Fury Reaches South America"
chaosx.nr7.60.d: "The Fury government in [fury_monroe_response_actor.GetNameDef] has taken another South American capital. Its forces are entering government offices as refugees flee by rail.\n\nWashington must decide whether to declare war or leave nearby countries to face Fury alone."
chaosx.nr7.60.a: "Declare war on [fury_monroe_response_actor.GetNameDef]."
chaosx.nr7.60.b: "Keep the response diplomatic."
chaosx_super_event.59.t: "Fury Becomes a State"
chaosx_super_event.59.q: "\"The condition of man is a condition of war of every one against every one.\"\n §Y-Thomas Hobbes-§!"
chaosx_super_event.59.a: "The rage has a state."
chaosx_super_event.59.d: "A minor country has stopped behaving like a country at all. Its soldiers pour into the streets with fever-bright discipline, its officers point them toward the nearest neighbor, and its civilians watch their own government become something hungry.\n\nFury wears a uniform and grows hotter with every conquest."
chaosx_super_event.60.t: "The World in Fury"
chaosx_super_event.60.q: "\"The condition of man is a condition of war of every one against every one.\"\n §Y-Thomas Hobbes-§!"
chaosx_super_event.60.a: "No country is calm."
chaosx_super_event.60.d: "The rage has multiplied. Minor states across the world answer one another with the same sudden mobilizations, the same red-eyed officers, and the same columns pressing into neighbors before reason can take hold.\n\nFury now finds hosts everywhere at once, turning separate border wars into one spreading campaign."

chaosx.news.7008.t.single: "Fury Grips [fury_opening_news_actor.GetName]"
chaosx.news.7008.d.single: "Reservists crowd the barracks of [fury_opening_news_actor.GetName], and armed columns assemble along its frontier. Officers drive their men through sleepless preparations for an invasion. Travelers leaving the country call the sudden mobilization Fury."
chaosx.news.7008.t.multiple: "Fury Grips Several Countries"
chaosx.news.7008.d.multiple: "Reports of Fury have arrived from [?fury_opening_news_actor.fury_opening_actor_count|0] countries. Reservists crowd their barracks, and officers assemble armed columns along the frontiers. Neighboring towns prepare for invasion as the same sleepless mobilization spreads under different flags."