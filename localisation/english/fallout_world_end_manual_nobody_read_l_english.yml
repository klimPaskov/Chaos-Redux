l_english:
 chaosx.fallout.345.t: "The Manual Nobody Read"
 chaosx.fallout.345.d: "The technical station sits behind a frost-locked service gate. Its lamps still burn against the ash, but the staff board lists three names and only one of them has been seen this winter. A ring-bound manual describes a sequence for bringing the heat exchangers and filter pumps back into service. The final pages are missing."
 chaosx.fallout.345.a: "Follow the surviving procedure"
 chaosx.fallout.345.b: "Improvise with the tools at hand"
 chaosx.fallout.345.c: "Recruit an engineer from abroad"
 chaosx.fallout.345.d_option: "Seal the facility and ration its shelter"
 chaosx.fallout.345.a.tt: "Spend 8 Power, 6 Scrap, and 3 Medicine. The station crew will work from the intact pages."
 chaosx.fallout.345.b.tt: "Spend 7 Power and 10 Scrap. A local crew will attempt a shorter sequence with no verified safety margin."
 chaosx.fallout.345.c.tt: "Spend 6 Power, 5 Medicine, and 8 Recognition. A foreign engineer will be offered a protected place in the station."
 chaosx.fallout.345.d_option.tt: "Spend 8 Shelter, 4 Filters, and 3 Scrap. The doors will be closed before the pumps can poison the refuge."
 chaosx.fallout.347.t: "The Facility Answers"
 chaosx.fallout.347.follow.success.d: "The surviving pages were enough. The heat exchangers turn slowly, and clean air reaches the service rooms before the night shift changes. The crew marks every valve in charcoal so the next winter will not depend on memory."
 chaosx.fallout.347.follow.partial.d: "The procedure restored the main circuit, but the last pressure gate will not hold. The station can provide a little heat and filtered air while the crew searches for a replacement seal."
 chaosx.fallout.347.follow.failure.d: "The manual's missing pages concealed the dangerous step. A pressure surge tears through the plant, damaging the workshop and driving ash into the service rooms."
 chaosx.fallout.347.improvise.success.d: "The local crew used a boiler diagram from the maintenance archive and found a safe shortcut. The station gives the settlement a narrow band of warmth, and the improvised notes are copied into the ledger."
 chaosx.fallout.347.improvise.partial.d: "The shortcut works for a few hours at a time. The settlement gains a fragile source of heat, but every restart consumes more scrap than the crew expected."
 chaosx.fallout.347.improvise.failure.d: "The improvised sequence leaves the filters open during a pressure change. The workshop loses a machine and the nearest ward must be moved away from the vents."
 chaosx.fallout.347.recruit.success.d: "The engineer arrives with a hand-drawn correction to the old manual. Their first inspection finds a bypass around the cracked exchanger, and the station becomes a guarded source of clean air."
 chaosx.fallout.347.recruit.partial.d: "The engineer identifies the fault but cannot rebuild the missing control board. A limited service resumes, with a strict schedule for every filter and shift."
 chaosx.fallout.347.recruit.failure.d: "The promised engineer never reaches the station. The escort returns with a damaged case of instruments and a warning that the route is no longer safe."
 chaosx.fallout.347.shut.success.d: "The facility is sealed before the ash reaches its inner rooms. The shelter crew salvages the heat blankets and records the valve sequence for a safer season."
 chaosx.fallout.347.shut.partial.d: "The doors hold, but the shelter loses time and material maintaining the seal. The station is quiet, and its future depends on a better filter shipment."
 chaosx.fallout.347.shut.failure.d: "The seal fails during the first cold night. The station contributes no heat, and the ward nearest the service gate must absorb the consequences."
 chaosx.fallout.347.a: "Record the result and prepare the follow-up"
 chaosx.fallout.347.a.tt: "Resolve the facility outcome and schedule its delayed maintenance follow-up."
 chaosx.fallout.349.t: "The Second Winter Inspection"
 chaosx.fallout.349.success.d: "The follow-up crew finds the station still operating within its narrow safety band. The correction is copied into the settlement archive, and the facility can be trusted through another cold season."
 chaosx.fallout.349.partial.d: "The station survives, but its filters are being replaced faster than the stores can support. The crew keeps one room open and marks the rest for a later repair."
 chaosx.fallout.349.failure.d: "The second inspection finds ash in the pressure lines and a silent pump. The facility is abandoned for now, and the settlement loses people when the contaminated ward is cleared."
 chaosx.fallout.349.a: "Close the maintenance record"
 chaosx.fallout.349.a.tt: "Resolve the follow-up and release the chain's cleanup receipt."
 fallout.event_log.manual_nobody_read.name: "The Manual Nobody Read"
 fallout.event_log.manual_nobody_read.detail: "A technical facility protocol was attempted after the Dead City Permit memory closed. The result and its delayed inspection were recorded in the survival ledger."
 fallout.event_log.manual_nobody_read.follow_success: "The surviving procedure restored a guarded source of heat and filtered air."
 fallout.event_log.manual_nobody_read.follow_partial: "The procedure restored a fragile circuit while the final pressure gate remained unsafe."
 fallout.event_log.manual_nobody_read.follow_failure: "A missing manual step damaged the facility and drove ash into the service rooms."
 fallout.event_log.manual_nobody_read.improvise_success: "A local boiler diagram let the crew restore a narrow band of warmth."
 fallout.event_log.manual_nobody_read.improvise_partial: "An improvised shortcut worked intermittently and consumed the remaining repair stock."
 fallout.event_log.manual_nobody_read.improvise_failure: "An improvised pressure change damaged a machine and forced a ward move."
 fallout.event_log.manual_nobody_read.recruit_success: "A foreign engineer found a bypass and made the station a guarded source of clean air."
 fallout.event_log.manual_nobody_read.recruit_partial: "The engineer identified the fault, but the missing control board kept service limited."
 fallout.event_log.manual_nobody_read.recruit_failure: "The engineer failed to reach the station and the route was declared unsafe."
 fallout.event_log.manual_nobody_read.shut_success: "The station was sealed before ash reached the inner rooms."
 fallout.event_log.manual_nobody_read.shut_partial: "The seal held at a high material cost and left the station quiet."
 fallout.event_log.manual_nobody_read.shut_failure: "The seal failed during a cold night and the nearest ward paid the price."
 fallout.event_log.manual_nobody_read.callback_success: "The second inspection renewed the station's safety record for another cold season."
 fallout.event_log.manual_nobody_read.callback_partial: "The second inspection kept one room open while the stores could not support full service."
 fallout.event_log.manual_nobody_read.callback_failure: "The second inspection found ash in the pressure lines and closed the facility."
