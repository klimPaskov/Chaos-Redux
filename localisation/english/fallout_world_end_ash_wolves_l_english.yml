l_english:
 chaosx.fallout.450.t: "The Ash Wolves"
 chaosx.fallout.450.d: "A gray pack has followed the old freight cut into [This.GetName]. The tracks are too deliberate for ordinary wolves, yet the field team has no honest word for what they found. The pack takes goats at the edge of the settlement, circles the frozen water trench, and leaves black fur on the gate wire. The report marks this as fictional altered ecology. It makes no claim that ordinary radiation breeds such animals."
 chaosx.fallout.450.a: "Order the ranger cordon"
 chaosx.fallout.450.a.tt: "Spend food, medicine, and recognition to hunt the pack and put trained people on the line."
 chaosx.fallout.450.b: "Build a living fence"
 chaosx.fallout.450.b.tt: "Spend supplies to protect homes and keep the corridor open for controlled passage."
 chaosx.fallout.450.c: "Send the field biologists"
 chaosx.fallout.450.c.tt: "Spend medicine and recognition to study tracks, calls, and territory without treating fiction as science."
chaosx.fallout.450.e: "Mark the corridor and leave it"
 chaosx.fallout.450.d.tt: "Spend a small reserve to protect the settlement by recognizing a dangerous corridor and preserving the altered habitat."
 chaosx.fallout.452.t: "The Pack Has Chosen Its Ground"
 chaosx.fallout.452.hunt_pack.success.d: "The ranger cordon moved at dawn through the ash grass. Three dens were sealed, the goats were brought behind the school wall, and the pack withdrew from the freight cut. The hunters brought back food and a map of the remaining tracks."
 chaosx.fallout.452.hunt_pack.partial.d: "The cordon found two dens but lost the trail where cold rain covered the old rail bed. The settlement gained a few weeks of safer pasture, while the night watch doubled."
 chaosx.fallout.452.hunt_pack.failure.d: "The hunters fired into the gray and struck only the gate posts. A wounded animal drew the pack closer to the homes, and the families by the water trench paid the price."
 chaosx.fallout.452.fence_corridor.success.d: "Stone, wire, and lamp oil turned the edge of [This.GetName] into a guarded corridor. The pack still moves beyond the markers, but the road, clinic, and winter storehouse are safe enough for escorted traffic."
 chaosx.fallout.452.fence_corridor.partial.d: "The first fence holds beside the clinic, then fails where the ash has buried the old posts. Children can cross with an escort, while the far pasture remains closed."
 chaosx.fallout.452.fence_corridor.failure.d: "The fence was built from damp timber and tired wire. When the pack pressed against it, the corridor became a trap and the settlement lost its last reliable road watch."
 chaosx.fallout.452.study_tracks.success.d: "The field biologists followed the prints through frost and soot without naming the animals as a new species. Their map shows a changing territory, a recurring call, and a safe hour for water crews."
 chaosx.fallout.452.study_tracks.partial.d: "The study team recovered tracks and a feeding pattern, but the cold ruined the samples before the second survey. The notes are useful, though the pack remains ahead of the lanterns."
 chaosx.fallout.452.study_tracks.failure.d: "The team mistook a collapsed culvert for a den and spent its medicine on an empty shelter. The real pack crossed the supply road while the observers argued over names."
 chaosx.fallout.452.leave_corridor.success.d: "The council marked the freight cut with red posts and moved its grazing line away. The protected corridor became a living boundary, and the wolves stopped testing the settlement gate."
 chaosx.fallout.452.leave_corridor.partial.d: "The signs went up, but two families ignored them when the grain store ran low. The corridor remains open to the ash and closed to carts, with a new argument over who owns the quiet ground."
 chaosx.fallout.452.leave_corridor.failure.d: "The council left the cut alone and called that restraint. The pack learned the new routes faster than the people did, and the next winter watch found paw prints beside the clinic door."
 chaosx.fallout.452.a: "Record the field result"
 chaosx.fallout.452.a.tt: "Resolve the Ash Wolves policy and schedule its seasonal corridor review."
 chaosx.fallout.454.t: "The Corridor Review"
 chaosx.fallout.454.success.d: "After another hard season, the corridor has a name, a watch rota, and a rule that the pack is not a people and the people are not prey. The field notes now guide water crews, patrols, and the first altered-ecology archive."
 chaosx.fallout.454.partial.d: "The settlement kept the road open, but every thaw changes the tracks. The watch has a practical map and a growing fear that a single bad night will reopen the old dispute."
 chaosx.fallout.454.failure.d: "The corridor review failed in the first cold rain. A damaged gate, a lost patrol, and an empty clinic room made the old boundary meaningless again."
 chaosx.fallout.454.a: "Close the field ledger"
 chaosx.fallout.454.a.tt: "Record the corridor memory and release the delayed cleanup."
 fallout.event_log.ash_wolves.name: "The Ash Wolves"
 fallout.event_log.ash_wolves.detail: "[This.GetName] chose whether to hunt, fence, study, or protect a fictional altered-ecology corridor."
 fallout.event_log.ash_wolves.hunt_pack_success: "Rangers pushed the ash wolves away from the settlement."
 fallout.event_log.ash_wolves.hunt_pack_partial: "Rangers secured part of the ash-wolf corridor."
 fallout.event_log.ash_wolves.hunt_pack_failure: "A failed hunt brought the pack closer to the homes."
 fallout.event_log.ash_wolves.fence_corridor_success: "A guarded corridor kept the pack away from the road and clinic."
 fallout.event_log.ash_wolves.fence_corridor_partial: "The first fence held only around the settlement core."
 fallout.event_log.ash_wolves.fence_corridor_failure: "The corridor fence failed in the ash and cold rain."
 fallout.event_log.ash_wolves.study_tracks_success: "Field notes mapped the pack without calling fiction science."
 fallout.event_log.ash_wolves.study_tracks_partial: "The field team kept only part of its altered-ecology record."
 fallout.event_log.ash_wolves.study_tracks_failure: "The study team missed the pack and lost its safe route."
 fallout.event_log.ash_wolves.leave_corridor_success: "A marked corridor let the pack and the settlement keep their distance."
 fallout.event_log.ash_wolves.leave_corridor_partial: "A protected corridor survived, but families still crossed it."
 fallout.event_log.ash_wolves.leave_corridor_failure: "The unguarded corridor reached the clinic gate."
 fallout.event_log.ash_wolves.callback_success: "The seasonal review turned the corridor into a durable public rule."
 fallout.event_log.ash_wolves.callback_partial: "The seasonal review preserved a useful but fragile map."
 fallout.event_log.ash_wolves.callback_failure: "The seasonal review failed and the corridor boundary broke."
