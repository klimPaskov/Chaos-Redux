l_english:
# Event 006 world milestone news
chaosx.nr6.190.t: "A New State Takes Its Seat"
chaosx.nr6.190.d: "Foreign ministries that once left the letters of [From.GetNameDef] unanswered have now exchanged ambassadors with it, and its flag flies outside legations in several capitals. For the first time since the wave began, one of its countries is received abroad as a state like any other."
chaosx.nr6.190.a: "Another name on the diplomatic list."
chaosx.nr6.191.t: "Separation by Treaty"
chaosx.nr6.191.d: "[?global.independence_wave_milestone_treaty_host.GetNameDefCap] and [From.GetNameDef] have signed a treaty that recognizes their separation without a shot fired between them. The two governments have agreed on a frontier and on the fate of the officials, property and families caught on the wrong side of it."
chaosx.nr6.191.a: "A border drawn in ink."
chaosx.nr6.192.t: "The Old Flag Returns"
chaosx.nr6.192.d: "Troops of [From.GetNameDef] have entered the capital of [?global.independence_wave_milestone_annexed_country.GetNameDef] and lowered its flag. The ministers who proclaimed its independence are under arrest or in hiding, and its provinces are once more governed from [From.Capital.GetName]."
chaosx.nr6.192.a: "The first of the new states has fallen."
chaosx.nr6.193.t: "A Union Is Proclaimed"
chaosx.nr6.193.d: "Delegates of states born in the independence wave have signed an act of union and raised a common flag over [From.Capital.GetName]. [From.GetNameDefCap] is the first of the new countries to grow into something larger than the province it began as."
chaosx.nr6.193.a: "The map changes again."
chaosx.nr6.194.t: "The League Answers a Call"
chaosx.nr6.194.d: "[From.GetNameDefCap] has sent troops and supplies to [?global.independence_wave_milestone_rescued_country.GetNameDef] under the League's banner. The new states have defended one of their own together for the first time."
chaosx.nr6.194.a: "The new states keep their promise."
chaosx.nr6.195.t: "A League Across Continents"
chaosx.nr6.195.d: "The League of new states now counts members from regions that share no border and no history beyond the wave that freed them. Its delegates argue in a dozen languages, and its sessions run late into the night while the interpreters catch up."
chaosx.nr6.195.a: "A long way to travel for a vote."
chaosx.nr6.196.t: "The Radical Bloc"
chaosx.nr6.196.d: "Radical members of the League of new states have agreed on a common plan to press their claims against the states they left, with shared timetables and joint war councils. [From.GetNameDefCap] directs the effort, and its general staff has stopped answering the questions of foreign attaches."
chaosx.nr6.196.a: "The old capitals look to their borders."
chaosx.nr6.197.t: "The Tenth Flag"
chaosx.nr6.197.d: "[?global.independence_wave_milestone_survivor_count|0] countries born in the independence wave now stand at the same time, each with its own government, army and seal. Atlases printed last year are already out of date, and postal clerks keep a list of the new stamps pinned above their counters."
chaosx.nr6.197.a: "The atlases will need reprinting."
chaosx.nr6.198.t: "The Twenty-Fifth Flag"
chaosx.nr6.198.d: "[?global.independence_wave_milestone_survivor_count|0] countries born in the independence wave now stand at the same time. Their envoys crowd the halls of every international conference, and older governments have begun to wonder which of their own provinces will be next."
chaosx.nr6.198.a: "The world has more borders than it did."
chaosx.nr6.199.t: "From One Province to a Great Power"
chaosx.nr6.199.d: "[From.GetNameDefCap] began as a single province that broke away in the independence wave. Its army, its industry and its alliances now place it among the great powers of the world."
chaosx.nr6.199.a: "Few would have believed it."
independence_wave.history.milestone.broad_recognition: "[?events_log_history_selected_actor.GetNameDefCap] became the first country of the independence wave to be received abroad as a state like any other."
independence_wave.history.milestone.peaceful_treaty: "[?events_log_history_selected_actor.GetNameDefCap] and [?events_log_history_selected_secondary_actor.GetNameDef] signed the first treaty that settled a separation from the wave without war."
independence_wave.history.milestone.host_annexation: "[?events_log_history_selected_actor.GetNameDefCap] reabsorbed [?events_log_history_selected_secondary_actor.GetNameDef], the first country of the independence wave to be retaken by the state it left."
independence_wave.history.milestone.regional_formable: "[?events_log_history_selected_actor.GetNameDefCap] became the first union formed by countries of the independence wave."
independence_wave.history.milestone.collective_rescue: "[?events_log_history_selected_actor.GetNameDefCap] came to the aid of [?events_log_history_selected_secondary_actor.GetNameDef] under the League's banner, the first rescue of a new state by its fellow members."
independence_wave.history.milestone.cross_regional_league: "The League of new states first counted members from three or more regions of the world."
independence_wave.history.milestone.radical_bloc: "[?events_log_history_selected_actor.GetNameDefCap] led the first radical bloc of new states in a coordinated campaign against their former hosts."
independence_wave.history.milestone.ten_survivors: "Ten countries of the independence wave stood at the same time for the first time."
independence_wave.history.milestone.twenty_five_survivors: "Twenty-five countries of the independence wave stood at the same time for the first time."
independence_wave.history.milestone.one_state_major: "[?events_log_history_selected_actor.GetNameDefCap], which began as a single breakaway province, became a great power."
