l_english:
africa.evolution.type: "The Continental Project"
africa.evolution.1.title: "Regional Consolidation"
africa.evolution.1.body: "The Charter League has kept its first promise and can finally look beyond one corridor. Regional congresses, negotiated settlements, restoration claims, and rival blocs will decide whether its protection grows into lasting cooperation."
africa.evolution.2.title: "Continental Machinery"
africa.evolution.2.body: "The League is settling into daily life. Shared railways, emergency forces, membership law, and resource bargains tie distant courts together, and every new connection brings another bill or obligation."
africa.evolution.3.title: "Africa as a World Pole"
africa.evolution.3.body: "Africa's settlement has become a question every great power must answer. Foreign bases, sanctions, continent-wide mobilization, strange new actors, and rival projects are now part of the same struggle."
africa.evolution.summary: "The continental project grows from local promises into a working League with friends, rivals, and obligations across the world."
africa_evolution_i_action_gate_tt: "Requires Regional Consolidation while evolution progression is active. The actions needed to reach it remain available."
africa_evolution_ii_action_gate_tt: "Requires Continental Machinery while evolution progression is active. The actions needed to reach it remain available."

chaosx.nr12.401.t: "The Charter Crosses Its First Region"
chaosx.nr12.401.d: "The first guarantees have survived scrutiny, and the corridor carries more than declarations. Delegates arrive with claims, debts, local terms, and demands for representation. The League can intervene more widely, but every new obligation gives rivals a reason to organise."
chaosx.nr12.401.a: "Convene the regional courts."
africa_evolution_i_effect_tt: "Regional congress, intervention, restoration, and negotiated settlement actions become available. The League gains more regional contacts and living-core capacity as its reach and obligations grow together."

chaosx.nr12.402.t: "The Continental Machinery Turns"
chaosx.nr12.402.d: "Court records have become budgets, timetables, reserve plans, and accession statutes. Distant governments can see what the League asks of them and what it can deliver. The same machinery that makes union possible also makes its costs impossible to hide."
chaosx.nr12.402.a: "Make every obligation legible."
africa_evolution_ii_effect_tt: "Advanced security integration, core recognition, federalisation, resource review, continental industry, citizenship, and emergency leadership actions become available. Operational capacity expands and integration burden remains visible."

chaosx.nr12.403.t: "Africa Becomes a World Pole"
chaosx.nr12.403.d: "Foreign ministries now debate recognition, embargoes, bases, expeditions, and the possibility that another continent might follow. At home, old stories and impossible witnesses press against the constitutional order without erasing the people who built it."
chaosx.nr12.403.a: "Answer the world as a continent."
africa_evolution_iii_effect_tt: "Bounded high-chaos investigations and formations become available, and the League gains capacity for world-scale diplomacy, mobilisation, overseas-base pressure, continent sponsorship, unions, and rivalries once their separate settlement gates are met. Africa still requires a complete constitutional settlement before it is one."
