l_english:
bio_designate_national_biological_arsenal: "Designate National Biological Arsenal"
bio_designate_national_biological_arsenal_desc: "Place the national pathogen stockpile under one exact military and scientific command at an owned biowarfare facility. This establishes the storage site used for safety, accident, bombing, sabotage, and capture consequences. It does not authorize or conduct biological release."
bio_designate_national_biological_arsenal_target_tt: "Select an owned and controlled state with an operational §YBiowarfare Facility§!. The state must support an ordinary pathogen lifecycle and cannot already be this country's arsenal."
bio_designate_national_biological_arsenal_effect_tt: "Designate §Y[FROM.GetName]§! as the exact national biological arsenal, bind stockpile-risk monitoring to its facility, and begin the relocation cooldown. No pathogen is released."

bio_stockpile_risk_controlled: "Biological Stockpile Risk: Controlled"
bio_stockpile_risk_controlled_desc: "The national arsenal at §Y[?bio_stockpile_safety_arsenal_state.GetName]§! is operating within controlled limits. Ordinary accident risk is negligible while safety remains at least §Y[?constant:bio_stockpile_safety_risk.safety_controlled_minimum|.0]§! and danger-weighted stock stays below the program threshold.\n\nLive risk score: §Y[?bio_stockpile_safety_risk_score|.0]§!\nEffective Biosecurity: §Y[?bio_stockpile_safety_effective_safety|.0]§!\nPayload units: §Y[?bio_stockpile_safety_total_stockpile|.0]§!\nDanger-weighted stock: §Y[?bio_stockpile_safety_weighted_stockpile|.0]§!\nDamaged facility levels: §Y[?bio_stockpile_safety_facility_damaged_level|.0]§!"
bio_stockpile_risk_strained: "Biological Stockpile Risk: Strained"
bio_stockpile_risk_strained_desc: "The national arsenal at §Y[?bio_stockpile_safety_arsenal_state.GetName]§! has exceeded a safe operating margin. A contained handling incident is possible unless the stockpile is reduced or Biosecurity improves.\n\nLive risk score: §Y[?bio_stockpile_safety_risk_score|.0]§!\nEffective Biosecurity: §Y[?bio_stockpile_safety_effective_safety|.0]§!\nPayload units: §Y[?bio_stockpile_safety_total_stockpile|.0]§!\nDanger-weighted stock: §Y[?bio_stockpile_safety_weighted_stockpile|.0]§!\nDamaged facility levels: §Y[?bio_stockpile_safety_facility_damaged_level|.0]§!"
bio_stockpile_risk_dangerous: "Biological Stockpile Risk: Dangerous"
bio_stockpile_risk_dangerous_desc: "The national arsenal at §Y[?bio_stockpile_safety_arsenal_state.GetName]§! combines low safety with a large stockpile, a disabled containment facility, or recent bombing. A local outbreak is a meaningful risk.\n\nLive risk score: §Y[?bio_stockpile_safety_risk_score|.0]§!\nEffective Biosecurity: §Y[?bio_stockpile_safety_effective_safety|.0]§!\nPayload units: §Y[?bio_stockpile_safety_total_stockpile|.0]§!\nDanger-weighted stock: §Y[?bio_stockpile_safety_weighted_stockpile|.0]§!\nDamaged facility levels: §Y[?bio_stockpile_safety_facility_damaged_level|.0]§!"
bio_stockpile_risk_critical: "Biological Stockpile Risk: Critical"
bio_stockpile_risk_critical_desc: "The national arsenal at §Y[?bio_stockpile_safety_arsenal_state.GetName]§! is exposed to critical failure through extreme stock, safety below §Y[?constant:bio_stockpile_safety_risk.safety_dangerous_minimum|.0]§!, war damage, or confirmed sabotage. Major domestic outbreak and public international exposure are possible.\n\nLive risk score: §Y[?bio_stockpile_safety_risk_score|.0]§!\nEffective Biosecurity: §Y[?bio_stockpile_safety_effective_safety|.0]§!\nPayload units: §Y[?bio_stockpile_safety_total_stockpile|.0]§!\nDanger-weighted stock: §Y[?bio_stockpile_safety_weighted_stockpile|.0]§!\nDamaged facility levels: §Y[?bio_stockpile_safety_facility_damaged_level|.0]§!"

bio_stockpile_safety_accident_resolved_tt: "§RThe exact matching payload stock has already been debited.§! Any exposure is being processed through incubation, detection, medical saturation, deaths, evidence, attribution, contamination, and Condemnation. A contained incident creates no outbreak seed."
bio_stockpile_accident_severity_contained: "a contained incident"
bio_stockpile_accident_severity_lab_contamination: "laboratory contamination"
bio_stockpile_accident_severity_local_outbreak: "a local outbreak"
bio_stockpile_accident_severity_major_domestic_outbreak: "a major domestic outbreak"
bio_stockpile_accident_severity_international_exposure: "international exposure of the program"
bio_stockpile_accident_severity_unresolved: "an unresolved biological emergency"
