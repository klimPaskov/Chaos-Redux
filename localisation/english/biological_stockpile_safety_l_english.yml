l_english:
bio_designate_national_biological_arsenal: "Designate National Biological Arsenal"
bio_designate_national_biological_arsenal_desc: "Place the national pathogen stockpile under one exact military and scientific command at an owned biowarfare facility. This establishes the storage site used for safety, accident, bombing, sabotage, and capture consequences. It does not authorize or conduct biological release."
bio_designate_national_biological_arsenal_target_tt: "Select an owned and controlled state with an operational §YBiowarfare Facility§!. The state must support an ordinary pathogen lifecycle and cannot already be this country's arsenal."
bio_designate_national_biological_arsenal_effect_tt: "Designate §Y[FROM.GetName]§! as the exact national biological arsenal, bind stockpile-risk monitoring to its facility, and begin the relocation cooldown. No pathogen is released."

bio_stockpile_safety_accident_resolved_tt: "§RThe exact matching payload stock has already been debited.§! Any exposure is being processed through incubation, detection, medical saturation, deaths, evidence, attribution, contamination, and Condemnation. A contained incident creates no outbreak seed."
bio_stockpile_accident_severity_contained: "a contained incident"
bio_stockpile_accident_severity_lab_contamination: "laboratory contamination"
bio_stockpile_accident_severity_local_outbreak: "a local outbreak"
bio_stockpile_accident_severity_major_domestic_outbreak: "a major domestic outbreak"
bio_stockpile_accident_severity_international_exposure: "international exposure of the program"
bio_stockpile_accident_severity_unresolved: "an unresolved biological emergency"
