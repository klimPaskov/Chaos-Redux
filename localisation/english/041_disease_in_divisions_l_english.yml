l_english:
chaosx.nr41.1.t: "Disease in divisions"

chaosx.nr41.2.t: "Disease in divisions!"
chaosx.nr41.2.d: "A disease outbreak has struck our frontline divisions, incapacitating soldiers and disrupting operations. Medical teams are isolating the sick and testing samples while commanders try to keep the line supplied."
chaosx.nr41.2.a: "Contain the outbreak."

chaosx.news.46.t: "Sudden Disease in [From.GetName]"
chaosx.news.46.d: "A disease outbreak has struck the frontline divisions of [From.GetName]. Soldiers are falling ill during combat, and military doctors are moving through the affected units to identify the cause."
chaosx.news.46.a: "The frontline cannot hold."
