l_english:
DHR_survival_shortcut: "Survival"
DHR_imperial_shortcut: "Imperial Continuity"
DHR_synod_shortcut: "Predictive Synod"
DHR_covenant_shortcut: "Two-World Covenant"
DHR_laboratory_shortcut: "Laboratory Economy"
DHR_army_shortcut: "Predictive Warfare"
DHR_orbital_shortcut: "Orbital Support"
DHR_diplomacy_shortcut: "Diplomacy and Intelligence"
DHR_expansion_shortcut: "Two-World Order"
DHR_crisis_shortcut: "Enclave Crisis"

DHR_paid_landing_network_effect: "Enables paid cohort landings. Every landing requires §Y[?dhrondan_landing_equipment_cost|0]§! exotic laser weapons, and ordinary landing recovery is §Y[?constant:alien_infantry_landing.cooldown_days_network|0] days§!."
DHR_paid_landing_reserve_effect: "Authorizes one paid cohort request. Equipment is reserved only when the landing decision is taken, and this focus grants no cohort by itself."
DHR_reclamation_declaration_effect: "Formally commits the state to the reclamation and settlement of the former host territory."
DHR_world_order_contract_effect: "Authorizes the regime's two-world territorial and diplomatic program."
DHR_integration_program_effect: "Begins the political, legal, and logistical integration of the postwar settlement."
DHR_enclave_crisis_begins_effect: "The enclave crisis becomes active and must be answered by reconciliation or counterintelligence."
DHR_enclave_crisis_resolved_effect: "Ends the enclave crisis and records its settlement across the state."

DHR_beneath_an_alien_sky: "Beneath an Alien Sky"
DHR_beneath_an_alien_sky_desc: "The expedition survives on a world its planners knew only through distant signals. Before ambition returns, the scattered survivors must learn what still answers to D’Rhondan command."
DHR_count_the_landing_states: "Count the Landing States"
DHR_count_the_landing_states_desc: "Every enclave reports through a different calendar, cipher, and chain of command. A single ledger will show what people, stores, and strategic positions remain."
DHR_secure_the_scattered_enclaves: "Secure the Scattered Enclaves"
DHR_secure_the_scattered_enclaves_desc: "The landing zones cannot endure as isolated islands. Coordinated patrols and emergency signals will keep each enclave inside the common defense."
DHR_inventory_the_expedition_stores: "Inventory the Expedition Stores"
DHR_inventory_the_expedition_stores_desc: "Broken fabrication cells, terrestrial tools, and preserved alien components must be assigned where they can sustain the greatest number of survivors."
DHR_restore_the_landing_beacons: "Restore the Landing Beacons"
DHR_restore_the_landing_beacons_desc: "The beacons carried the expedition across the void. Rebuilding their receivers will reconnect isolated columns and restore part of our lost situational awareness."
DHR_bind_the_enclaves: "Bind the Enclaves"
DHR_bind_the_enclaves_desc: "Shared rations, transport schedules, and command obligations will turn a collection of frightened landings into one political community."
DHR_reopen_the_orbital_channel: "Reopen the Orbital Channel"
DHR_reopen_the_orbital_channel_desc: "The surviving orbital relays can again authenticate descent vectors. Every further landing will still require §Y[?dhrondan_landing_equipment_cost|0]§! exotic laser weapons."
DHR_convene_the_two_world_throne: "Convene the Two-World Throne"
DHR_convene_the_two_world_throne_desc: "Exile has left three credible answers to the question of authority. The convention will choose who speaks for D’Rhonda on Earth and toward the homeworld."
DHR_vael_ix_takes_the_throne: "Vael IX Takes the Throne"
DHR_vael_ix_takes_the_throne_desc: "Emperor Vael IX claims that continuity alone preserved the expedition. The Ninth Line will bind the enclaves through personal oath and imperial law."
DHR_restore_the_ninth_diadem: "Restore the Ninth Diadem"
DHR_restore_the_ninth_diadem_desc: "Reassembling the diadem from the expedition vaults will affirm that the imperial office survived the crossing."
DHR_bind_the_landing_lords: "Bind the Landing Lords"
DHR_bind_the_landing_lords_desc: "Enclave commanders who ruled by necessity will retain honor only by accepting the hierarchy of the restored throne."
DHR_codify_imperial_service: "Codify Imperial Service"
DHR_codify_imperial_service_desc: "Every station and settlement will owe a defined measure of labor, intelligence, and military service to the Imperial Continuity."
DHR_raise_the_palace_guard: "Raise the Palace Guard"
DHR_raise_the_palace_guard_desc: "The throne will raise a disciplined guard from proven cadres and supply it through the restored laser forges."
DHR_proclaim_the_right_of_return: "Proclaim the Right of Return"
DHR_proclaim_the_right_of_return_desc: "Imperial law will make recovery of the former host and the road home sovereign obligations."
DHR_crown_the_enclave_empire: "Crown the Enclave Empire"
DHR_crown_the_enclave_empire_desc: "The scattered landings will become provinces of an empire in exile, each charged with preserving one part of the civilization that crossed the void."
DHR_the_unbroken_imperial_line: "The Unbroken Imperial Line"
DHR_the_unbroken_imperial_line_desc: "The Ninth Line will stand as the living bridge between the lost homeworld, the terrestrial enclaves, and every realm still to be reclaimed."
DHR_sera_qel_presents_the_calculus: "Sera Qel Presents the Calculus"
DHR_sera_qel_presents_the_calculus_desc: "First Calculant Sera Qel argues that survival is a problem of measurable constraints. The Synod will rule through forecasts, audits, and accountable expertise."
DHR_audit_every_command_node: "Audit Every Command Node"
DHR_audit_every_command_node_desc: "No enclave command will remain beyond review. Inputs, assumptions, and predicted outcomes must be visible to the central calculus."
DHR_elevate_the_first_calculants: "Elevate the First Calculants"
DHR_elevate_the_first_calculants_desc: "Authority will follow demonstrated accuracy. The best analysts of each landing will join a Synod empowered to revise every failing institution."
DHR_publish_the_survival_equations: "Publish the Survival Equations"
DHR_publish_the_survival_equations_desc: "The population deserves to understand the constraints guiding public sacrifice. Publishing the core models will replace rumor with common terms."
DHR_assign_merit_by_projection: "Assign Merit by Projection"
DHR_assign_merit_by_projection_desc: "Verified forecasts will determine rank and access to resources. The most accurate projections will shape the state."
DHR_replace_decree_with_prediction: "Replace Decree with Prediction"
DHR_replace_decree_with_prediction_desc: "Policy should be a tested response to observable conditions. The Synod will retire arbitrary decree in favor of continuously revised projections."
DHR_enthrone_the_synod: "Enthrone the Synod"
DHR_enthrone_the_synod_desc: "A council of calculators can be sovereign without pretending to a crown. Its mandate will rest on survival delivered and error openly corrected."
DHR_the_government_of_certainties: "The Government of Certainties"
DHR_the_government_of_certainties_desc: "The Synod will never promise a future it cannot model. Within those limits, it will direct every laboratory, factory, and command node toward the optimal outcome."
DHR_ilyr_ren_opens_the_chamber: "Ilyr Ren Opens the Chamber"
DHR_ilyr_ren_opens_the_chamber_desc: "Speaker Ilyr Ren makes consent the foundation of government in exile. A new chamber will give both peoples a voice in the state they share."
DHR_seat_the_human_delegates: "Seat the Human Delegates"
DHR_seat_the_human_delegates_desc: "Human communities living beside the enclaves will receive delegates of their own, with the right to question agreements made in their name."
DHR_write_the_dual_citizenship_code: "Write the Dual Citizenship Code"
DHR_write_the_dual_citizenship_code_desc: "Citizenship must protect persons rather than species. A common code will define equal civil standing while respecting the obligations of the expedition."
DHR_elect_the_landing_councils: "Elect the Landing Councils"
DHR_elect_the_landing_councils_desc: "Emergency commanders will yield local administration to councils chosen by the people who endure each landing's risks."
DHR_guarantee_the_right_to_depart: "Guarantee the Right to Depart"
DHR_guarantee_the_right_to_depart_desc: "No citizen should be trapped inside an enclave by birth, debt, or military necessity. The right to leave will prove that the Covenant is freely entered."
DHR_submit_the_military_to_debate: "Submit the Military to Debate"
DHR_submit_the_military_to_debate_desc: "Predictive officers will present strategic commitments to the chamber, where civilian delegates will decide which battles are justified."
DHR_ratify_the_two_world_covenant: "Ratify the Two-World Covenant"
DHR_ratify_the_two_world_covenant_desc: "Alien and human delegates will ratify one compact governing rights, representation, security, and the eventual relationship with the homeworld."
DHR_the_chamber_of_two_skies: "The Chamber of Two Skies"
DHR_the_chamber_of_two_skies_desc: "A durable democratic state can bind Earth and D’Rhonda through equal citizenship for both peoples."
DHR_relight_the_field_laboratories: "Relight the Field Laboratories"
DHR_relight_the_field_laboratories_desc: "Surviving instruments will be gathered into working field laboratories able to translate D’Rhondan science into terrestrial production."
DHR_recover_the_laser_forges: "Recover the Laser Forges"
DHR_recover_the_laser_forges_desc: "Restoring the expedition’s damaged weapon forges will support paid landing requests and conventional military production."
DHR_convert_terrestrial_workshops: "Convert Terrestrial Workshops"
DHR_convert_terrestrial_workshops_desc: "Human machine tools cannot reproduce every alien component, yet careful redesign can make them useful parts of a mixed industrial chain."
DHR_crystal_growth_chambers: "Crystal Growth Chambers"
DHR_crystal_growth_chambers_desc: "Stable high-energy arrays depend on crystals that once came from a distant biosphere. Controlled growth chambers will replace dwindling stores."
DHR_the_twenty_element_substitution: "The Twenty-Element Substitution"
DHR_the_twenty_element_substitution_desc: "Earth lacks several materials assumed by D’Rhondan engineering. A disciplined substitution program will rebuild devices from what this planet can provide."
DHR_standardize_alien_components: "Standardize Alien Components"
DHR_standardize_alien_components_desc: "Every enclave improvised its own repairs. Common tolerances and authenticated interfaces will make components transferable across the whole expedition."
DHR_feed_the_landing_reserve: "Feed the Landing Reserve"
DHR_feed_the_landing_reserve_desc: "Future cohorts must be purchased and supplied before descent. This authorization prepares a paid request without reserving equipment or granting soldiers."
DHR_the_exoplanetary_materials_board: "The Exoplanetary Materials Board"
DHR_the_exoplanetary_materials_board_desc: "Scientists, quartermasters, and terrestrial manufacturers will jointly decide which scarce substances serve research, defense, or civil recovery."
DHR_join_the_scattered_laboratories: "Join the Scattered Laboratories"
DHR_join_the_scattered_laboratories_desc: "A shared data lattice will let each enclave test the others' work, reducing duplicate failures and recovering expertise once thought lost."
DHR_a_two_world_research_complex: "A Two-World Research Complex"
DHR_a_two_world_research_complex_desc: "The mature laboratory network will unite alien theory with terrestrial materials and sustain an additional permanent research program."
DHR_restore_the_predictive_staff: "Restore the Predictive Staff"
DHR_restore_the_predictive_staff_desc: "Disciplined prediction gave the expedition its military advantage. The surviving staff must rebuild that process from fragmented archives."
DHR_map_the_probability_front: "Map the Probability Front"
DHR_map_the_probability_front_desc: "Every battlefield contains branching possibilities. The staff will mark where small actions can collapse the enemy's most dangerous futures."
DHR_encode_the_enemy_reaction: "Encode the Enemy Reaction"
DHR_encode_the_enemy_reaction_desc: "Signals, doctrine, and logistics reveal how an opponent is likely to respond. Encoding those patterns will make deception measurable."
DHR_train_human_signal_teams: "Train Human Signal Teams"
DHR_train_human_signal_teams_desc: "Human operators can read local habits and language faster than the exiles. Mixed teams will turn that knowledge into reliable battlefield inputs."
DHR_rebuild_the_expeditionary_cadres: "Rebuild the Expeditionary Cadres"
DHR_rebuild_the_expeditionary_cadres_desc: "Veterans from the landing will form compact training cadres for ordinary forces while the alien cohorts remain outside normal recruitment."
DHR_fire_control_by_forecast: "Fire Control by Forecast"
DHR_fire_control_by_forecast_desc: "Weapons will engage the positions made most probable by enemy movement, cover, and intent."
DHR_supply_before_the_order: "Supply Before the Order"
DHR_supply_before_the_order_desc: "A predicted maneuver is useless if its supplies begin moving afterward. Logistics will prepare for likely orders before final authorization."
DHR_the_thousand_branch_wargame: "The Thousand-Branch Wargame"
DHR_the_thousand_branch_wargame_desc: "Commanders will rehearse hundreds of plausible continuations from one opening situation, learning where prediction fails and judgment must intervene."
DHR_delegate_to_the_field_calculants: "Delegate to the Field Calculants"
DHR_delegate_to_the_field_calculants_desc: "Front-line analysts need authority to revise forecasts when the battlefield departs from the central model."
DHR_command_without_surprise: "Command Without Surprise"
DHR_command_without_surprise_desc: "Disciplined warning thresholds will contain battlefield uncertainty before local shocks become a strategic collapse."
DHR_the_foreseen_counterstroke: "The Foreseen Counterstroke"
DHR_the_foreseen_counterstroke_desc: "The best counterattack begins while the enemy still believes its advance is unobserved. Reserves will move along branches prepared in advance."
DHR_perfect_predictive_warfare: "Perfect Predictive Warfare"
DHR_perfect_predictive_warfare_desc: "Prediction will become a complete command culture that joins intelligence, supply, initiative, and correction without pretending to infallibility."
DHR_reassemble_the_orbital_office: "Reassemble the Orbital Office"
DHR_reassemble_the_orbital_office_desc: "Air and naval support must answer to one office that understands the descent relays, terrestrial weather, and the limits of surviving spacecraft."
DHR_chart_terrestrial_air_corridors: "Chart Terrestrial Air Corridors"
DHR_chart_terrestrial_air_corridors_desc: "Reliable approach lanes will connect enclave airfields while avoiding weather patterns and detection zones alien navigators once ignored."
DHR_adapt_the_gravity_fighters: "Adapt the Gravity Fighters"
DHR_adapt_the_gravity_fighters_desc: "Surviving fighter systems were built for another atmosphere. Terrestrial engines, fuels, and control surfaces will keep the doctrine alive."
DHR_salvage_the_shuttle_docks: "Salvage the Shuttle Docks"
DHR_salvage_the_shuttle_docks_desc: "Coastal workshops can become shuttle docks and naval yards when fitted with the expedition's remaining handling equipment."
DHR_link_airfields_to_the_relay: "Link Airfields to the Relay"
DHR_link_airfields_to_the_relay_desc: "Radar stations, airfields, and orbital telemetry will share one schedule so that every ascent and descent has a protected window."
DHR_form_the_exile_flotilla: "Form the Exile Flotilla"
DHR_form_the_exile_flotilla_desc: "A modest terrestrial flotilla will guard salvage routes and coastal enclaves while training crews for the very different demands of orbital logistics."
DHR_guard_the_descent_windows: "Guard the Descent Windows"
DHR_guard_the_descent_windows_desc: "Landing cohorts are most vulnerable during their final approach. Air patrols will protect the narrow periods when paid arrivals can safely descend, shortening ordinary landing recovery to §Y[?constant:alien_infantry_landing.cooldown_days_guarded_descent|0] days§!."
DHR_make_near_space_ours: "Make Near Space Ours"
DHR_make_near_space_ours_desc: "The surviving relays, airfields, docks, and patrols will form a coherent support zone from the coast to the edge of orbit, shortening ordinary landing recovery to §Y[?constant:alien_infantry_landing.cooldown_days_near_space|0] days§!."
DHR_open_the_translation_bureaus: "Open the Translation Bureaus"
DHR_open_the_translation_bureaus_desc: "Diplomacy begins with language precise enough to carry law, fear, and intent. Permanent bureaus will train speakers from both worlds."
DHR_listen_to_the_human_airwaves: "Listen to the Human Airwaves"
DHR_listen_to_the_human_airwaves_desc: "Broadcasts reveal alliances, public anxieties, and military preparations. Careful listening will provide context no landing archive contains."
DHR_trade_in_impossible_materials: "Trade in Impossible Materials"
DHR_trade_in_impossible_materials_desc: "Small quantities of alien material can purchase terrestrial machinery and goodwill without surrendering the technologies that keep the enclaves alive."
DHR_exchange_maps_for_access: "Exchange Maps for Access"
DHR_exchange_maps_for_access_desc: "Our orbital observations have value to terrestrial governments. In return, their roads, ports, and records can open regions closed to the enclaves."
DHR_seed_the_enclave_network: "Seed the Enclave Network"
DHR_seed_the_enclave_network_desc: "Merchants, translators, and displaced families already cross political borders. Their reports can become an intelligence network grounded in real communities."
DHR_recruit_two_world_operatives: "Recruit Two-World Operatives"
DHR_recruit_two_world_operatives_desc: "Operatives who understand both societies can recognize deceptions that appear convincing to specialists from only one world."
DHR_choose_our_terrestrial_partners: "Choose Our Terrestrial Partners"
DHR_choose_our_terrestrial_partners_desc: "Partnerships will be judged by access, reliability, and treatment of enclave citizens rather than by flattering promises."
DHR_the_embassy_beyond_the_stars: "The Embassy Beyond the Stars"
DHR_the_embassy_beyond_the_stars_desc: "A permanent diplomatic institution will represent an extraterrestrial state without concealing how deeply its future is tied to Earth."
DHR_define_the_two_worlds_question: "Define the Two Worlds Question"
DHR_define_the_two_worlds_question_desc: "The regime must decide whether recovery means dominion, calculated administration, or a negotiated federation. The answer will shape every territorial claim."
DHR_restore_the_imperial_reaches: "Restore the Imperial Reaches"
DHR_restore_the_imperial_reaches_desc: "Imperial jurists will treat the enclaves and their approaches as surviving reaches of the Ninth Line's realm."
DHR_demand_the_origin_host: "Demand the Origin Host"
DHR_demand_the_origin_host_desc: "The territory from which the expedition emerged will be named an inseparable possession of the restored empire."
DHR_the_subject_world_protocol: "The Subject World Protocol"
DHR_the_subject_world_protocol_desc: "A formal protocol will define tribute, local autonomy, military obligations, and the place of terrestrial subjects beneath the imperial crown."
DHR_calculate_the_reclamation_zones: "Calculate the Reclamation Zones"
DHR_calculate_the_reclamation_zones_desc: "The Synod will rank territorial objectives by population, supply, scientific value, and their contribution to survival."
DHR_subordinate_borders_to_need: "Subordinate Borders to Need"
DHR_subordinate_borders_to_need_desc: "Inherited frontiers cannot outweigh the movement of food, power, and matériel. Administration will follow functional regions."
DHR_administer_the_optimal_order: "Administer the Optimal Order"
DHR_administer_the_optimal_order_desc: "A predictive occupation model will assign resources and authority according to measurable needs while exposing costly deviations."
DHR_invite_the_enclave_congress: "Invite the Enclave Congress"
DHR_invite_the_enclave_congress_desc: "Delegates from every enclave and neighboring human community will be invited to debate the political shape of two worlds."
DHR_negotiate_the_origin_settlement: "Negotiate the Origin Settlement"
DHR_negotiate_the_origin_settlement_desc: "The former host territory can become a jointly guaranteed home rather than the object of an endless hereditary claim."
DHR_federate_the_two_worlds: "Federate the Two Worlds"
DHR_federate_the_two_worlds_desc: "A federation will preserve local institutions while giving both peoples a common chamber for defense, movement, and interplanetary policy."
DHR_begin_postwar_integration: "Begin Postwar Integration"
DHR_begin_postwar_integration_desc: "Victory cannot leave a permanent hierarchy of conqueror and conquered. A staged settlement will connect administration, rights, supply, and reconstruction."
DHR_a_place_in_the_world_order: "A Place in the World Order"
DHR_a_place_in_the_world_order_desc: "D’Rhonda will enter terrestrial affairs as a durable power with explicit institutions, obligations, and an answer to the question of belonging."
DHR_the_enclaves_refuse_the_ledger: "The Enclaves Refuse the Ledger"
DHR_the_enclaves_refuse_the_ledger_desc: "Several enclaves reject the settlement imposed by the central regime. Their refusal threatens the routes and records holding the exile state together."
DHR_offer_a_shared_horizon: "Offer a Shared Horizon"
DHR_offer_a_shared_horizon_desc: "The dissident enclaves will receive guarantees that preserve local voice while binding them to the shared future of both worlds."
DHR_break_the_separatist_ciphers: "Break the Separatist Ciphers"
DHR_break_the_separatist_ciphers_desc: "The crisis can be contained by exposing clandestine routes and command links before secession becomes an armed front."
DHR_resolve_the_enclave_crisis: "Resolve the Enclave Crisis"
DHR_resolve_the_enclave_crisis_desc: "Reconciliation or counterintelligence has broken the immediate deadlock. The settlement must now be recorded and enforced across every enclave."
DHR_reopen_the_homeworld_corridor: "Reopen the Homeworld Corridor"
DHR_reopen_the_homeworld_corridor_desc: "The mature orbital network can sustain a corridor of repeated descents. Each cohort still requires §Y[?dhrondan_landing_equipment_cost|0] Alien Laser Weapons§!."
DHR_the_century_beyond_exile: "The Century Beyond Exile"
DHR_the_century_beyond_exile_desc: "The institutions built in exile can carry D’Rhonda through a century shaped by two skies."

dhrondan_homeworld_fragmentation: "Homeworld Fragmentation"
dhrondan_homeworld_fragmentation_desc: "The expedition's political institutions shattered across isolated landings, leaving authority uncertain and supply chains divided."
dhrondan_homeworld_cohesion: "Enclave Cohesion"
dhrondan_homeworld_cohesion_desc: "Shared ledgers and obligations have made the enclaves capable of acting as one state before their final regime is settled."
dhrondan_imperial_mandate: "The Imperial Mandate"
dhrondan_imperial_mandate_desc: "The Ninth Line joins survival, return, and service beneath a restored imperial office."
dhrondan_synod_calculus: "The Synod Calculus"
dhrondan_synod_calculus_desc: "Public forecasts and expert audits direct national effort through a government built around measurable outcomes."
dhrondan_covenant_compact: "The Covenant Compact"
dhrondan_covenant_compact_desc: "Alien and human citizens share a representative settlement that makes consent part of the exile state's strength."
dhrondan_predictive_lag: "Predictive Lag"
dhrondan_predictive_lag_desc: "Broken archives and scattered analysts leave the army reacting to possibilities it can identify but cannot yet coordinate."
dhrondan_predictive_sight: "Predictive Sight"
dhrondan_predictive_sight_desc: "Signals, forecasts, and mixed teams reveal the most likely branches of an enemy plan."
dhrondan_predictive_command: "Predictive Command"
dhrondan_predictive_command_desc: "Forecasting is fully integrated with initiative, logistics, and reserve movement across the armed forces."
dhrondan_offworld_isolation: "Off-World Isolation"
dhrondan_offworld_isolation_desc: "The expedition remains cut off from its orbital support and must sustain alien systems through uncertain terrestrial routes."
dhrondan_offworld_relay: "The Restored Relay"
dhrondan_offworld_relay_desc: "Airfields and telemetry again support coordinated descent windows and long-range logistics."
dhrondan_offworld_corridor: "The Homeworld Corridor"
dhrondan_offworld_corridor_desc: "A mature orbital network binds the terrestrial state to the routes beyond Earth without erasing the cost of distance."
