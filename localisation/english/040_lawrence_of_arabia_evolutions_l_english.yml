# ---------------------------------------------------------------------------
# Event Log: evolution rows
# ---------------------------------------------------------------------------
lawrence_of_arabia.evolution.type: "Lawrence's Arabia"
lawrence_of_arabia.evolution.stage_1.title: "The Arab Revolt Network"
lawrence_of_arabia.evolution.stage_2.title: "The British Arabian System"
lawrence_of_arabia.evolution.stage_3.title: "Lawrence's Arabia"
lawrence_of_arabia.evolution.stage_1.body: "British money and arms reach smugglers, officers, railway workers, couriers and local leaders. Their cells can sabotage a line, divide a garrison or demand a new government."
lawrence_of_arabia.evolution.stage_2.body: "Governments that accepted British help begin to act as one order. Their officers train together, their ports serve the same convoys and their ministers write to each other. Each can contribute, bargain, refuse or turn against the arrangement."
lawrence_of_arabia.evolution.stage_3.body: "Partners, allies and independent governments are drawn towards one federation. It can become a British dominion, a sovereign union or a state built around Lawrence himself."
lawrence_of_arabia.evolution.summary: "The mission grows from persuasion into a network that acts in secret, then into a system of partners, and finally into a plan for one Arab state."

