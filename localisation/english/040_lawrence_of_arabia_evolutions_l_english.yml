# ---------------------------------------------------------------------------
# Events: cell incidents
# ---------------------------------------------------------------------------
chaosx.nr40.90.t: "Rifles in the Wells"
chaosx.nr40.90.d: "Herdsmen near the frontier report crates buried at the bottom of dry wells and camel caravans that travel by night and avoid the customs posts. The rifles are new and carry British markings that someone has filed off, and the men who guard them are paid in sovereigns."
chaosx.nr40.90.a: "Send the army to dig them up."
chaosx.nr40.90.a_tt: "A strong security service seizes the caches. Cells fall by §Y15§! and evidence grows by §Y1§!. A weak one finds nothing, cells grow by §Y6§! and Influence rises by §Y4§!."
chaosx.nr40.90.b: "Leave the frontier to its herdsmen."
chaosx.nr40.90.b_tt: "Cells grow by §Y6§! and Influence rises by §Y3§!."
chaosx.nr40.91.t: "A Bridge on the Line"
chaosx.nr40.91.d: "A culvert on the railway line was blown up overnight and two trains stand empty on either side. Nobody was hurt. Track-walkers found a spent fuse and a telegraph wire cut at the next station, and the station-master says the men who did it spoke with the local accent."
chaosx.nr40.91.a: "Garrison the line."
chaosx.nr40.91.a_tt: "If the route state and the capital are garrisoned the line holds and cells fall by §Y8§!. Otherwise the line is damaged and cells grow by §Y5§!."
chaosx.nr40.91.b: "Repair it and carry on."
chaosx.nr40.91.b_tt: "Infrastructure in the route state is damaged, stability falls by §Y1§! and cells fall by §Y3§!."
chaosx.nr40.92.t: "Officers Demand a New Government"
chaosx.nr40.92.d: "Eleven officers of the General Staff signed a memorandum asking the cabinet to resign in favour of a council of generals. Several of them have attended dinners at the legation, and the English word reform appears in the memorandum where the Arabic would use a different one."
chaosx.nr40.92.a: "Arrest the signatories."
chaosx.nr40.92.a_tt: "With a strong security service the share of officers who follow the mission falls by §Y10§! and cells fall by §Y12§!. With a weak one the arrests backfire and both rise. Stability falls by §Y3§!."
chaosx.nr40.92.b: "Receive a delegation."
chaosx.nr40.92.b_tt: "More officers follow the mission, cells grow by §Y8§! and Influence rises by §Y4§!."
chaosx.nr40.93.t: "Chiefs Ask for Recognition"
chaosx.nr40.93.d: "Three tribal leaders from the southern provinces came to the capital with an offer to guarantee the roads and provide scouts for the army. They want their grazing rights confirmed in writing and their sons commissioned in the regular army. The legation has already told them that Britain would be glad to support the request."
chaosx.nr40.93.a: "Recognise their rights."
chaosx.nr40.93.a_tt: "Cells grow by §Y10§!, Influence rises by §Y5§! and stability rises by §Y2§!."
chaosx.nr40.93.b: "Refuse."
chaosx.nr40.93.b_tt: "Cells fall by §Y4§! and stability falls by §Y1§!."
chaosx.nr40.94.t: "Pamphlets in Every Coffeehouse"
chaosx.nr40.94.d: "Pamphlets printed on a press that nobody can name have appeared in the coffeehouses of the capital and the port. They set the government's budget beside the British subsidies and ask which of the two the army serves. Crowds gathered outside the Ministry of the Interior on two evenings."
chaosx.nr40.94.a: "Close the presses."
chaosx.nr40.94.a_tt: "Cells fall by §Y10§! and stability falls by §Y3§!."
chaosx.nr40.94.b: "Answer in public."
chaosx.nr40.94.b_tt: "Costs £pol_power §Y30§!. Cells fall by §Y6§!."
chaosx.nr40.95.t: "Revolt in the Provinces"
chaosx.nr40.95.d: "The order to leave was ignored by two garrisons in the provinces, and a crowd closed the railway junction for a day. The line to the coast is damaged, officers of the garrison are negotiating through the legation's friends, and the cabinet has a few days to restore its authority."
chaosx.nr40.95.a: "Restore order."
chaosx.nr40.95.a_tt: "Infrastructure in the route state and the capital is damaged and stability falls by §Y4§!."

# ---------------------------------------------------------------------------
# Events: evolution reports and the system
# ---------------------------------------------------------------------------
chaosx.nr40.96.t: "The Network Wakes"
chaosx.nr40.96.d: "Shopkeepers, railway clerks, young officers and tribal scouts who took British money for small favours have begun to meet each other. Nobody gave the order. A cell in the south has a name and a printed oath, and another in the port keeps a list of the guards on the customs wharf."
chaosx.nr40.96.d_britain: "Reports from the legation describe a web of small groups in [?global.lawrence_target.GetNameDef] that now act without waiting for instructions. The men on the ground want funds for a coordinated effort, and Lawrence has told them that nothing can be promised until the roads are secure."
chaosx.nr40.96.a: "Watch it grow."
chaosx.nr40.96.a_tt: "Hidden cells now grow in the target and cause incidents. Britain can fund the network or back a government replacement. The target can break the cells."
chaosx.nr40.97.t: "A System, Not a Chain of Favours"
chaosx.nr40.97.d: "The governments that accepted British help are no longer separate matters. Their officers train together, their ports serve the same convoys and their ministers have started to write to each other. The Foreign Office asks whether a standing conference, a common arms standard and shared intelligence would hold them together or give them a grievance in common."
chaosx.nr40.97.a: "Study the proposal."
chaosx.nr40.97.a_tt: "The institutions of the British Arabian System open in the §YThe Arabian Mission§! category, one stage at a time."
chaosx.nr40.98.t: "The System Falls Apart"
chaosx.nr40.98.d: "With too few partners left, or too little trust in London's word, the common offices have closed one after another. The officers sent home take their files with them, and the clients that remain deal with Britain one at a time."
chaosx.nr40.98.a: "Close the registers."
chaosx.nr40.98.a_tt: "The institutions and their national spirits are removed."
chaosx.nr40.99.t: "A British Arabian System"
chaosx.nr40.99.d: "The conference sits twice a year, the arms standard is printed in Arabic and English, and one intelligence desk reads the same mail for several governments. Ministers in the capitals call it the London arrangement or the Cairo arrangement depending on how they feel about the bill."
chaosx.nr40.99.a: "A durable order."
chaosx.nr40.99.a_tt: "The system is established and Chaos rises by §Y10§!."
chaosx.nr40.100.t: "The Liaison Conference"
chaosx.nr40.100.d: "Britain has called its partners to a conference. The agenda lists a common arms standard, a shared watch on the frontiers and a joint position towards the governments that still refuse British help. London expects each delegation to say what it will contribute."
chaosx.nr40.100.a: "Contribute officers and routes."
chaosx.nr40.100.a_tt: "Britain's pressure on the current target rises by §Y3§! and this country moves closer to becoming the favoured partner."
chaosx.nr40.100.b: "Name the price of cooperation."
chaosx.nr40.100.b_tt: "Britain pays £pol_power §Y30§!, this country gains autonomy and contributes half as much."
chaosx.nr40.100.c: "Refuse the new obligation."
chaosx.nr40.100.c_tt: "British credibility falls by §Y2§! and this country's dissent grows."
chaosx.nr40.101.t: "Letters Before the Mission"
chaosx.nr40.101.d: "Before the British liaison officer has unpacked, letters arrive from the capitals of Britain's other partners. They offer introductions, arms on credit and the loan of transport officers. Every letter ends with a reminder of what the writer's own government gained from its arrangement with London."
chaosx.nr40.101.a: "Read them all."
chaosx.nr40.101.a_tt: "The target started with more Influence for each partner Britain already has."
chaosx.nr40.102.t: "The Liaison Conference"
chaosx.nr40.110.t: "An Invitation from a Neighbour"
chaosx.nr40.110.d: "A neighbouring government proposes a compact of independent governments against the arrangements London has been making around the peninsula. It would share counterintelligence, warn its members of British couriers and prepare a congress of its own. Joining would put the signatory on a list in the Foreign Office."
chaosx.nr40.110.a: "Join the compact."
chaosx.nr40.110.a_tt: "This country becomes a member of the bloc if enough governments join. Members gain counterintelligence and preparedness."
chaosx.nr40.110.b: "Decline."
chaosx.nr40.110.b_tt: "No effect."
chaosx.nr40.111.t: "The Compact"
chaosx.nr40.112.t: "A Compact of Independent Governments"
chaosx.nr40.112.d: "The governments of the compact have published their charter. It guarantees their frontiers against foreign missions, shares their counterintelligence and invites any Arabian government to join as an equal. Their delegates ask Britain whether it will recognise the compact and end its missions or continue against it."
chaosx.nr40.112.a: "Recognise the compact and end the missions."
chaosx.nr40.112.a_tt: "The campaign ends through a negotiated settlement and Chaos falls by §Y5§!. Members of the bloc earn recognition."
chaosx.nr40.112.b: "Continue the missions."
chaosx.nr40.112.b_tt: "The bloc stands. Its members are no longer valid targets, and Britain's pressure on every target falls."
chaosx.nr40.71.d_coup: "Officers who dined at the legation seized the ministries before dawn and told the radio that the cabinet had resigned. The ruler and the army stayed where they were, and the new administration signed British terms within the week. The Treasury paid the first salaries."
chaosx.nr40.71.d_britain_coup: "The officer coalition in [?global.lawrence_last_target.GetNameDef] took the ministries without a battle and has signed British terms. The legation insists it did nothing beyond providing introductions."

# ---------------------------------------------------------------------------
# Ideas
# ---------------------------------------------------------------------------
lawrence_provisional_administration: "Provisional Administration"
lawrence_provisional_administration_desc: "An officer coalition runs the ministries under British protection. Few outside the capital have accepted its authority."
lawrence_arms_standard: "Common Arms Standard"
lawrence_arms_standard_desc: "The army trains and repairs to one British-written standard shared with the other partners."
lawrence_transport_compact: "Transport Compact"
lawrence_transport_compact_desc: "Railways, ports and roads run under a compact with Britain and its other partners."
lawrence_oil_agreements: "Oil Agreements"
lawrence_oil_agreements_desc: "Oil from the partner governments reaches British tankers under signed contracts."
lawrence_favoured_partner: "Favoured Partner"
lawrence_favoured_partner_desc: "London lists this government first when contracts and appointments are handed out."
lawrence_counter_bloc_member: "Counter-Bloc Member"
lawrence_counter_bloc_member_desc: "Counterintelligence is shared with the other governments of the compact."

# ---------------------------------------------------------------------------
# Decisions
# ---------------------------------------------------------------------------
lawrence_region_category: "The Arabian Compact"
lawrence_region_category_desc: "British partners press for autonomy and independent governments weigh a compact of their own. The British system stands on §Y[?global.lawrence_node_count|0]§! partners."
lawrence_break_the_revolt_cells: "Break the Revolt Cells"
lawrence_break_the_revolt_cells_desc: "Police and garrison commanders map every cell in the capital, the port and along the railway and raid them together."
lawrence_break_cells_tt: "Starts the §YBreak the Revolt Cells§! mission. While the capital, the port and the route state are held with divisions, the cells weaken every week."
lawrence_break_cells_mission: "Break the Revolt Cells"
lawrence_break_cells_mission_desc: "Hold the capital, the port and the road until the cells fall apart."
lawrence_break_cells_hold_tt: "Cells at §Y15§! or below (now §Y[?lawrence_cells|0]§!). Cells weaken each week while the capital, the port and the route state are all garrisoned."
lawrence_break_cells_success_tt: "The cells collapse. Influence falls by §Y10§! and evidence grows by §Y1§!."
lawrence_break_cells_partial_tt: "One network survives and cells fall to §Y30§!. Influence falls by §Y4§!."
lawrence_break_cells_failure_tt: "A line is sabotaged, cells grow by §Y10§!, more officers follow the mission and Influence rises by §Y6§!."
lawrence_fund_the_revolt_network: "Fund the Revolt Network"
lawrence_fund_the_revolt_network_desc: "Funds and rifles go to smugglers, officers, clerks and chiefs who have already shown they will act."
lawrence_fund_revolt_tt: "Cells grow by §Y15§! and keep growing faster for §Y90§! days. Exposure rises by §Y10§!. Can be repeated every §Y90§! days."
lawrence_back_a_government_replacement: "Back a Government Replacement"
lawrence_back_a_government_replacement_desc: "Britain supports an officer coalition that is ready to take the ministries."
lawrence_replace_government_tt: "The target becomes a British client under a provisional administration. Stability and war support fall for §Y270§! days. The first replacement raises Chaos by §Y5§!."
lawrence_replacement_valid_tt: "Influence is at least §Y80§!, cells at least §Y45§!, at least §Y55§! of every hundred officers follow the mission and the target has at least §Y3§! divisions"
lawrence_convene_the_liaison_conference: "Convene the Liaison Conference"
lawrence_convene_the_liaison_conference_desc: "Delegations of British partners meet in one hall to agree who supplies what."
lawrence_conference_tt: "Every regional node answers. The node that contributes most becomes the favoured partner and the others grow resentful. Opens the next institutions."
lawrence_set_up_the_arms_standardization_office: "Set Up the Arms Standardization Office"
lawrence_set_up_the_arms_standardization_office_desc: "Officers from every partner army learn to repair and train to one standard."
lawrence_arms_office_tt: "Nodes train faster and upgrade equipment cheaper for §Y540§! days, and British arms shipments cost §Y20§!% less while the office stands."
lawrence_sign_the_oil_and_transport_agreements: "Sign the Oil and Transport Agreements"
lawrence_sign_the_oil_and_transport_agreements_desc: "Oil, rail and port privileges are traded for protection and investment."
lawrence_oil_agreements_tt: "Britain gains fuel and every node builds faster for §Y540§! days. Subject nodes gain a little autonomy."
lawrence_open_the_regional_intelligence_office: "Open the Regional Intelligence Office"
lawrence_open_the_regional_intelligence_office_desc: "Clerks and officers from every partner read the same intercepted mail."
lawrence_intel_office_tt: "Every target is under more pressure while the office stands. A target that exposes the network in public closes the office."
lawrence_open_the_desert_air_route: "Open the Desert Air Route"
lawrence_open_the_desert_air_route_desc: "Transport aircraft, fuel dumps and landing strips are assigned to the road across the desert."
lawrence_air_route_tt: "For §Y180§! days shipments arrive §Y20§! days sooner and cannot be seized."
lawrence_air_base_tt: "Britain or one of its partners holds an airbase in the region"
lawrence_sign_the_joint_defense_charter: "Sign the Joint Defense Charter"
lawrence_sign_the_joint_defense_charter_desc: "Partners agree to consult, open their territory to each other and keep one chain of command in a crisis."
lawrence_joint_charter_tt: "Partners join the British faction where Britain leads one and trade military access. British credibility rises by §Y5§!."
lawrence_demand_greater_autonomy: "Demand Greater Autonomy"
lawrence_demand_greater_autonomy_desc: "The cabinet tells London that its patience with the arrangement is limited."
lawrence_node_autonomy_tt: "Autonomy rises by §Y10§!% and British credibility falls by §Y3§!. Dissent resets."
lawrence_found_an_arab_counter_bloc: "Found an Arab Counter-Bloc"
lawrence_found_an_arab_counter_bloc_desc: "The cabinet invites independent governments to a compact against foreign missions."
lawrence_found_bloc_tt: "Up to two independent governments are invited. With at least §Y[?constant:lawrence_system.bloc_minimum|0]§! members the bloc forms: members share counterintelligence and gain preparedness, and Britain must decide whether to recognise it."

