l_english:
  chaosx.fallout.387.t: "Counterfeit Antibiotics in the Ash Clinic"
  chaosx.fallout.387.d: "The clinic at the freight border has found chalk, starch, and a bitter solvent inside boxes marked with the old medical seal. The fever ward is full, and a river-road trader offers a second shipment before the next ash wind. The public trial would expose every seller. A quiet purchase would buy time without naming the source. A regulated guild could test each batch. The garrison can seize the stock, though the seizure would make the clinics dependent on its quartermaster."
  chaosx.fallout.387.a: "Put the first batch on the public table"
  chaosx.fallout.387.a.tt: "Spend medicine, food, and cohesion to test the shipment in front of the fever ward."
  chaosx.fallout.387.b: "Buy quietly from the river road"
  chaosx.fallout.387.b.tt: "Spend medicine and recognition to keep treatment moving while the supplier remains unnamed."
  chaosx.fallout.387.c: "Give the apothecaries a charter"
  chaosx.fallout.387.c.tt: "Spend medicine, scrap, and recognition to create a regulated testing guild."
  chaosx.fallout.387.d: "Seize the boxes for the garrison"
  chaosx.fallout.387.d.tt: "Spend medicine, scrap, and cohesion to put the military quartermaster in control."
  chaosx.fallout.389.t: "The Clinic Ledger Opens"
  chaosx.fallout.389.public_trial.success.d: "The public test found the active dose in enough vials to keep the freight ward open. The failed boxes were stacked under the watch of nurses, not burned in a panic. Families now ask for the names of every trader who touched the shipment."
  chaosx.fallout.389.public_trial.partial.d: "The public test saved several patients, but the dose varied from shelf to shelf. The clinic can continue if every household accepts a measured ration and the next shipment is tested before it crosses the river."
  chaosx.fallout.389.public_trial.failure.d: "The test exposed the fraud after the ward had already used the worst vials. Nurses record the losses in a book that the traders cannot confiscate. The freight clinic has lost its stock and its promise."
  chaosx.fallout.389.quiet_purchase.success.d: "The unnamed supplier delivered a consistent course through the river road. The fever ward is quieter, yet the clinic director keeps the invoices in a locked drawer. Treatment survives on a promise that no public court has examined."
  chaosx.fallout.389.quiet_purchase.partial.d: "The quiet shipment works for the first cases and fails for the last. The ward keeps the children on the stronger doses and sends the weak vials to the fever barracks. Trust is now a private bargain between the director and the road crew."
  chaosx.fallout.389.quiet_purchase.failure.d: "The river-road boxes contain almost no active medicine. The director hid the purchase to spare the market, so the clinic cannot ask the settlements for help without admitting who signed the order."
  chaosx.fallout.389.guild_regulation.success.d: "The apothecaries have built a testing bench from the old school laboratory. Each vial receives a mark, a batch number, and a named witness. The guild accepts fewer shipments, but the freight ward can tell families what it is giving them."
  chaosx.fallout.389.guild_regulation.partial.d: "The guild catches the worst substitutions, though its bench cannot measure every powder. The clinic gains a rulebook and loses speed. Rural patients will receive treatment only when a marked convoy arrives."
  chaosx.fallout.389.guild_regulation.failure.d: "The guild spends its scrap on glassware and finds that its reagents were counterfeit too. The apothecaries withdraw behind their shutters while the market begins to trade in promises instead of doses."
  chaosx.fallout.389.military_seizure.success.d: "The quartermaster sealed the boxes, assigned a guard to the cold room, and released measured courses to the fever ward. The garrison can keep the medicine moving, but every clinic now reports through the same armed office."
  chaosx.fallout.389.military_seizure.partial.d: "The garrison protects the stronger boxes and leaves the weaker stock to local nurses. Treatment reaches soldiers first, while families in the freight ward wait for a second convoy."
  chaosx.fallout.389.military_seizure.failure.d: "The seizure turns the clinic into a warehouse. The quartermaster cannot distinguish the real doses from the chalk, and the road crew has vanished before the first inquiry begins."
  chaosx.fallout.389.a: "Record the batch and face the next ward"
  chaosx.fallout.389.a.tt: "Resolve the clinic result and schedule its later supplier review."
  chaosx.fallout.391.t: "The Supplier Comes Back"
  chaosx.fallout.391.success.d: "Months later, the clinic has a second test bench and a named supplier. The freight ward still remembers the first fever, but the ledger now travels with every convoy and the apothecaries can refuse a box without closing the door."
  chaosx.fallout.391.partial.d: "The review keeps the clinic open, though the supplier's name remains a disputed mark in the ledger. Families accept the medicine when a nurse signs for it and refuse it when a guard does."
  chaosx.fallout.391.failure.d: "The next batch fails in the strongest ward. The clinic burns the labels, not the records. A fever returns to the freight road and the garrison begins counting medicine as a military secret."
  chaosx.fallout.391.a: "Close the ledger and keep the ward open"
  chaosx.fallout.391.a.tt: "Resolve the supplier review and release the delayed cleanup receipt."
  fallout.event_log.counterfeit_antibiotics.name: "Counterfeit Antibiotics"
  fallout.event_log.counterfeit_antibiotics.detail: "A medicine shipment forced the ash clinics to choose between a public trial, a quiet purchase, an apothecary charter, and a garrison seizure. The follow-up review left a memory about trust, adulteration, and the supplier's reach."
  fallout.event_log.counterfeit_antibiotics.public_trial_success: "The public clinic test found enough active doses to keep the freight ward open."
  fallout.event_log.counterfeit_antibiotics.public_trial_partial: "The public clinic test saved some patients, but the dose varied between shelves."
  fallout.event_log.counterfeit_antibiotics.public_trial_failure: "The public clinic test exposed the fraud after the worst vials had already been used."
  fallout.event_log.counterfeit_antibiotics.quiet_purchase_success: "A quiet river-road purchase delivered a consistent course while the supplier stayed unnamed."
  fallout.event_log.counterfeit_antibiotics.quiet_purchase_partial: "The quiet shipment worked for some cases and failed for the last patients."
  fallout.event_log.counterfeit_antibiotics.quiet_purchase_failure: "The quiet shipment contained almost no active medicine and could not be admitted publicly."
  fallout.event_log.counterfeit_antibiotics.guild_regulation_success: "An apothecary guild built a testing bench and marked every accepted vial."
  fallout.event_log.counterfeit_antibiotics.guild_regulation_partial: "The apothecary guild caught the worst substitutions, but its bench remained incomplete."
  fallout.event_log.counterfeit_antibiotics.guild_regulation_failure: "The apothecary guild found that its own reagents were counterfeit."
  fallout.event_log.counterfeit_antibiotics.military_seizure_success: "The garrison quartermaster protected the stronger boxes and released measured courses."
  fallout.event_log.counterfeit_antibiotics.military_seizure_partial: "The garrison protected soldiers first and left weaker stock to the clinics."
  fallout.event_log.counterfeit_antibiotics.military_seizure_failure: "The seizure turned the clinic into a warehouse that could not distinguish real doses."
  fallout.event_log.counterfeit_antibiotics.callback_success: "The later supplier review left a named source and a travelling clinic ledger."
  fallout.event_log.counterfeit_antibiotics.callback_partial: "The later review kept the clinic open, though the supplier's name remained disputed."
  fallout.event_log.counterfeit_antibiotics.callback_failure: "The next shipment failed and the garrison began treating medicine as a military secret."
