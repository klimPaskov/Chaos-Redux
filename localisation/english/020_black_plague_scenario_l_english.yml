chaosx.nr20.4.t: "A Neighbouring State Shows Signs of Infection"
chaosx.nr20.4.d: "A nearby state is receiving infected traffic through border crossings, rail lines, refugee columns, and unguarded stores. The first paths are open, and local clinics are filling as the fever approaches."
chaosx.nr20.4.a: "Close the crossings"
