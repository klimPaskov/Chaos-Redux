chaosx.nr20.4.t: "The Black Plague Unbound"
chaosx.nr20.4.d: "Reports from several continents describe the same black-marked fever, the same emptied storehouses, and the same movement in the drains. The outbreak is no longer a local crisis. It has entered the age of nations, armies, and royal vermin."
chaosx.nr20.4.a: "Open the containment board"
