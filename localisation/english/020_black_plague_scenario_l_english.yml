chaosx.nr20.4.t: "A Neighbouring State Is Threatened"
chaosx.nr20.4.d: "A nearby state has entered Threatened status. The fever has not yet taken hold, but border traffic, rail movement, refugees, and unguarded stores have given it a path. The shared disease board now marks the state for immediate attention."
chaosx.nr20.4.a: "Raise the warning flags"
