l_english:
operation_plant_anthrax_outbreak: "Release Anthrax Agent"
operation_plant_anthrax_outbreak_desc: "Commit an operative team, an Anthrax payload, and support equipment to a covert release in a selected state controlled by [FROM.GetNameDef] that contains an airfield, naval base, supply node, industrial center, or laboratory. The agent may remain undetected while local contamination incubates, but capturing an assigned operative exposes the sponsor."
operation_plant_plague_outbreak: "Release Plague Agent"
operation_plant_plague_outbreak_desc: "Commit an operative team, a Plague payload, and support equipment to a covert release in a selected state controlled by [FROM.GetNameDef] with a dense population or transport center. A successful seed can spread beyond its first victims, while capturing an assigned operative exposes the sponsor."
operation_plant_tularemia_outbreak: "Release Tularemia Agent"
operation_plant_tularemia_outbreak_desc: "Commit an operative team, a Tularemia payload, and support equipment to a covert release in a selected supply or troop-concentration state controlled by [FROM.GetNameDef]. The mission favors military concentrations; containment may reveal its origin, while capturing an assigned operative exposes the sponsor."
operation_plant_smallpox_outbreak: "Release Smallpox Agent"
operation_plant_smallpox_outbreak_desc: "Commit an enlarged operative team, a Smallpox payload, and support equipment to a covert release in a selected state controlled by [FROM.GetNameDef] with a major population or strategic center. The long preparation reflects the agent's strategic danger; discovery can expose the sponsor and provoke severe international consequences."
operation_plant_weaponized_zombie_outbreak: "Plant Weaponized Zombie Outbreak"
operation_plant_weaponized_zombie_outbreak_desc: "Send operatives to introduce the [ROOT.GetAdjective] weaponized zombie strain in a selected state controlled by [FROM.GetNameDef]. Its infectiousness follows the strain profile developed by [ROOT.GetNameDef]."
operation_plant_bioweapon_outcome_tt: "The committed payload and support equipment are not returned after the operation. The team may abort, establish a limited seed, or establish a full hidden seed in [FROM.FROM.GetName]. Any release enters incubation before detection. If an assigned operative is captured, the sponsor is exposed; attribution is confirmed for an existing seed, otherwise the biological attempt is confirmed. Advanced Chaos Warfare doctrine returns some Command Power after resolution."
operation_plant_weaponized_zombie_outcome_tt: "The committed payload and support equipment are not returned after the operation. A successful mission releases the [ROOT.GetAdjective] weaponized zombie strain in [FROM.FROM.GetName]."
operation_plant_bioweapon_aborted_tt: "The release condition could not be established. The team aborted; the committed payload and support equipment were disposed of without starting an outbreak."
operation_plant_bioweapon_partial_seed_tt: "A limited hidden contamination has entered incubation in the selected state."
operation_plant_bioweapon_hidden_seed_tt: "A full hidden contamination has entered incubation in the selected state."
operation_plant_bioweapon_context_lost_tt: "The selected state no longer supports the planned release. The committed payload and support equipment were lost without starting an outbreak."
operation_plant_weaponized_zombie_failure_tt: "The team failed to release the weaponized zombie strain. The committed payload and support equipment were lost."
operation_plant_weaponized_zombie_success_tt: "The weaponized strain was released in the selected state."
bioweapon_plant_reservoir: "Secure Sample and Transport Chain"
bioweapon_plant_reservoir_desc: "The team prepares the sealed sample, support equipment, and local transfer chain needed to reach the selected state."
bioweapon_plant_reservoir_outcome: "The sample and its transport chain reached the operational network intact."
bioweapon_seed_medical_chain: "Establish Release Condition"
bioweapon_seed_medical_chain_desc: "Operatives locate a viable release condition and judge whether the agent can be introduced without immediate detection."
bioweapon_seed_medical_chain_outcome: "The team identified a viable release condition and prepared the payload."
bioweapon_contaminate_transport_hub: "Release or Abort"
bioweapon_contaminate_transport_hub_desc: "The team makes the final release decision. If the selected state no longer offers a viable condition, the payload must be abandoned or destroyed."
bioweapon_contaminate_transport_hub_outcome: "The team completed its final action and began withdrawal before the consequences were known."
