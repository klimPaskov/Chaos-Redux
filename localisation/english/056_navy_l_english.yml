chaosx.nr56.2.t: "Navy"
chaosx.nr56.2.d: "Every country now has a functioning navy. New fleets are leaving port and turning every sea lane into a contested route."
chaosx.nr56.2.a: "[ROOT.GetName] rules the waves!"

chaosx.news.55.t: "The Navy"
chaosx.news.55.d: "Every nation has launched a navy, and fleets are appearing across the world's seas. Shipping routes are becoming contested as governments race to build more hulls."
chaosx.news.55.a: "What's a navy?"
