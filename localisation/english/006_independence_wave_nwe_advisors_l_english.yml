l_english:
RHI_independence_wave_municipal_customs_administrator: "Municipal Customs Administrator"
RHI_independence_wave_municipal_customs_administrator_desc: "The river cities cannot survive on declarations alone. A single customs service reconciles municipal tolls, clears disputed cargoes, and turns the Rhine corridor into a functioning market."
RHI_independence_wave_rail_works_liaison: "Rail and Public Works Liaison"
RHI_independence_wave_rail_works_liaison_desc: "Bridge crews, station boards, and municipal engineers report through one practical office, allowing reconstruction to follow the traffic that sustains the new state."
RHI_independence_wave_river_defense_planner: "River Defense Planner"
RHI_independence_wave_river_defense_planner_desc: "Crossings, embankments, and reserve routes are treated as one defensive problem. The planner's sober surveys give the army time and ground on which to stand."

BAY_independence_wave_district_finance_administrator: "District Finance Administrator"
BAY_independence_wave_district_finance_administrator_desc: "Bavaria's districts bring incompatible ledgers, obligations, and tax customs into independence. A severe common treasury makes those accounts governable without dissolving local authority."
BAY_independence_wave_estates_constitutional_liaison: "Estates' Constitutional Liaison"
BAY_independence_wave_estates_constitutional_liaison_desc: "The liaison translates between cabinet decrees, district privileges, and the restored estates, keeping constitutional bargains from becoming another contest of vetoes."
BAY_independence_wave_alpine_supply_inspector: "Alpine Supply Inspector"
BAY_independence_wave_alpine_supply_inspector_desc: "Mountain depots and winter roads are inspected as a connected system. Wasteful columns are reorganized before snow and distance can turn shortages into defeat."

SCO_independence_wave_shipping_authority_commissioner: "Shipping Authority Commissioner"
SCO_independence_wave_shipping_authority_commissioner_desc: "The Forth, Clyde, and northern harbors need a common convoy board. The commissioner coordinates escorts, dock allocations, and repair priorities without subordinating every port to one city."
SCO_independence_wave_industrial_reconstruction_secretary: "Industrial Reconstruction Secretary"
SCO_independence_wave_industrial_reconstruction_secretary_desc: "Closed works and broken transport links are assigned to a national reconstruction schedule, concentrating scarce machinery where it can restore both production and employment."
SCO_independence_wave_territorial_defense_planner: "Territorial Defense Planner"
SCO_independence_wave_territorial_defense_planner_desc: "Local defense forces receive common sectors, reserve timetables, and fallback positions, turning scattered territorial commands into a coherent shield."

WLS_independence_wave_bilingual_civil_service_commissioner: "Bilingual Civil Service Commissioner"
WLS_independence_wave_bilingual_civil_service_commissioner_desc: "A public administration able to work in Welsh and English binds valleys, coast, and capital without treating either language as a concession."
WLS_independence_wave_coal_rail_organizer: "Coal and Rail Organizer"
WLS_independence_wave_coal_rail_organizer_desc: "Pit committees, locomotive depots, and the north-south railway answer to one reconstruction schedule, so fuel and rolling stock reach the industries that need them."
WLS_independence_wave_mountain_defense_planner: "Mountain Defense Planner"
WLS_independence_wave_mountain_defense_planner_desc: "Supply tables and defensive positions are designed for narrow roads, steep ground, and winter exposure, giving a small army the endurance its terrain demands."

independence_wave_trait_municipal_customs_administrator: "Unified Municipal Customs"
independence_wave_trait_municipal_customs_administrator_desc: "Shared tariff books and cleared freight disputes reduce domestic burdens while making foreign trade easier to conduct."
independence_wave_trait_rail_works_liaison: "Rhine Works Coordination"
independence_wave_trait_rail_works_liaison_desc: "Railway and public-works schedules are coordinated across municipal boundaries."
independence_wave_trait_river_defense_planner: "Defense in Depth along the Rhine"
independence_wave_trait_river_defense_planner_desc: "Crossing plans and prepared reserves strengthen the army's defense and operational tempo."
independence_wave_trait_district_finance_administrator: "Reconciled District Accounts"
independence_wave_trait_district_finance_administrator_desc: "A common treasury reduces civilian overhead and restores productive confidence."
independence_wave_trait_estates_constitutional_liaison: "Compact of Cabinet and Estates"
independence_wave_trait_estates_constitutional_liaison_desc: "A durable channel between the government and the estates steadies public authority."
independence_wave_trait_alpine_supply_inspector: "Inspected Mountain Depots"
independence_wave_trait_alpine_supply_inspector_desc: "Disciplined supply routes reduce consumption and protect formations from winter attrition."
independence_wave_trait_shipping_authority_commissioner: "National Shipping Authority"
independence_wave_trait_shipping_authority_commissioner_desc: "Coordinated docks and convoy schedules improve naval construction and escort performance."
independence_wave_trait_industrial_reconstruction_secretary: "Scheduled Industrial Recovery"
independence_wave_trait_industrial_reconstruction_secretary_desc: "Reconstruction resources are concentrated on productive works and the transport links that sustain them."
independence_wave_trait_territorial_defense_planner: "Unified Territorial Sectors"
independence_wave_trait_territorial_defense_planner_desc: "Common sectors and reserve plans strengthen defense and speed operational preparation."
independence_wave_trait_bilingual_civil_service_commissioner: "Bilingual State Service"
independence_wave_trait_bilingual_civil_service_commissioner_desc: "Equal administrative capacity in both national languages improves legitimacy and government coordination."
independence_wave_trait_coal_rail_organizer: "Coalfield Railway Board"
independence_wave_trait_coal_rail_organizer_desc: "Integrated pit and railway schedules accelerate track work and factory recovery."
independence_wave_trait_mountain_defense_planner: "Upland Defense Tables"
independence_wave_trait_mountain_defense_planner_desc: "Terrain-conscious supply and winter planning give the army greater endurance on difficult ground."
