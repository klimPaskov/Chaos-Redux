fallout.event_log.engineer_franchise.detail.universal_vote_partial: "The universal vote named a board that the eastern shelters still dispute."
fallout.event_log.engineer_franchise.detail.universal_vote_failure: "The public register failed and no ward accepted the board's authority."
fallout.event_log.engineer_franchise.detail.callback_success: "The reactor keep made the power board a durable public institution."
