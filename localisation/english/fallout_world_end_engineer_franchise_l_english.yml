chaosx.fallout.796.t: "The Engineer Franchise"
chaosx.fallout.796.opening.d: "The Manchurian Reactor Keeps still has a live turbine hall, a public power board, and enough technicians to keep one district warm. The engineers say the Reactor Without a Country memory gives them the only honest claim to rule. Families, clerks, and the garrison have brought their own ledgers to the same table. Four constitutional routes are possible before the next ash season closes the doors."
chaosx.fallout.796.a: "Let the engineers elect the board"
chaosx.fallout.796.a.tt: "Spend Food 2, Medicine 2, and Recognition 2 to give the technicians a public mandate, reduce class pressure, and repair the power district."
chaosx.fallout.796.b: "Open a public council"
chaosx.fallout.796.b.tt: "Spend Fuel 2, Recognition 3, and Cohesion 2 to place households and technicians in one council with a shared maintenance register."
chaosx.fallout.796.c: "Put the garrison over the grid"
chaosx.fallout.796.c.tt: "Spend Scrap 2, Power 2, and Medicine 2 to secure the switch rooms under military oversight while the reactor keep remains exposed."
chaosx.fallout.796.d: "Call a universal vote"
chaosx.fallout.796.d.tt: "Spend Food 2, Fuel 2, and Recognition 2 to let every surviving district choose who controls the power board."
chaosx.fallout.797.t: "The Engineer Franchise"
chaosx.fallout.798.t: "Who Owns the Power Board"
chaosx.fallout.798.engineer_vote.success.d: "The technicians won an election without hiding the maintenance failures. Their board publishes the load schedule, keeps a night crew for the clinics, and accepts that a reactor keep needs consent as well as expertise."
chaosx.fallout.798.engineer_vote.partial.d: "The engineers won the vote, but two wards refused to sign the load schedule. The turbines run and the clinic stays lit, though every repair now carries a dispute over who may inspect the figures."
chaosx.fallout.798.engineer_vote.failure.d: "The ballot boxes filled with blank slips after the night crew lost power during the count. The technicians keep the switches, the wards keep their grievances, and the next outage will be treated as a political act."
chaosx.fallout.798.public_council.success.d: "A public council now reads the same power register as the turbine staff. It gives the households a real voice, turns the reactor keep toward civic rule, and keeps enough maintenance authority to prevent a winter blackout."
chaosx.fallout.798.public_council.partial.d: "The council opened its books, but the technicians kept the emergency bypass keys. Families can challenge a load decision, yet a public meeting still ends when the warning lamps begin to flash."
chaosx.fallout.798.public_council.failure.d: "The first council session became a fight over the clinic circuit and the factory circuit. The power board has no public trust left, and a failed switch has damaged the district's only reliable repair room."
chaosx.fallout.798.military_oversight.success.d: "The garrison secured the switch rooms and posted every rationed kilowatt at the gate. The arrangement is hard, but it prevents sabotage, keeps the turbine staff alive, and gives the reactor keep a clear command route."
chaosx.fallout.798.military_oversight.partial.d: "The soldiers held the control rooms without breaking the turbine crew. Power reaches the clinics and the barracks, while the civilian wards wait for a promise that oversight will not become permanent rule."
chaosx.fallout.798.military_oversight.failure.d: "The garrison took the keys before it had a maintenance roster. A pump seized during the handover, the repair stores were consumed, and the wards now believe the army can only govern a dark grid."
chaosx.fallout.798.universal_vote.success.d: "Every surviving ward received the same ballot and the same load figures. The vote keeps the technate's technical staff, gives households a binding veto over clinic power, and turns the reactor keep into a constitutional project."
chaosx.fallout.798.universal_vote.partial.d: "The universal vote named a board, but the eastern shelters could not send delegates through the ash. The result is recognized in the reactor keep and disputed everywhere the grid does not reach."
chaosx.fallout.798.universal_vote.failure.d: "The vote failed when the public register lost its last duplicate. The technicians still know how to run the turbines, yet no district accepts the board's claim to speak for the whole keep."
chaosx.fallout.798.a: "Record the constitutional result"
chaosx.fallout.798.a.tt: "Apply the delayed power-board result, update the technate route and Air Winter ledgers, and schedule the first winter engineering review."
chaosx.fallout.800.t: "The First Winter Power Review"
chaosx.fallout.800.success.d: "The reactor keep reached its first winter review with a public load schedule, a maintained clinic circuit, and enough technical trust to share the repair roster. The power board is now an institution instead of a locked room."
chaosx.fallout.800.partial.d: "The grid survived the first winter, but its ledgers still depend on one exhausted crew. The reactor keep can keep the lights on while it decides whether trust comes from elections, inspection, or command."
chaosx.fallout.800.failure.d: "The review found a power board that had outlived its maintenance crew. The reactor keep has entered another winter with lower supply, damaged infrastructure, and a constitutional dispute that will not stay in the turbine hall."
chaosx.fallout.800.a: "Close the winter review"
chaosx.fallout.800.a.tt: "Apply the delayed engineering review, write the final power-board memory, and release the reserved technical district and partner rows."
