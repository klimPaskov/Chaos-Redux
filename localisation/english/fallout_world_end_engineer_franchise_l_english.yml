fallout.event_log.engineer_franchise.detail.callback_failure: "The winter review found damaged infrastructure and a power board without a crew."
fallout.event_log.engineer_franchise.detail.cancelled: "The power-board record was cancelled after its district, partner, owner, controller, or generation changed."
