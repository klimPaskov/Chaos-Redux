# CBRN protective equipment and its automatically awarded service standards.
basic_gas_masks: "Basic Service Respirators"
basic_gas_masks_desc: "Standard facepieces, canister filters and fitting drills make Basic Respirator Crates available. Protection depends on the number of crates held and issued, and on filter condition."
improved_gas_masks: "Improved Service Masks"
improved_gas_masks_desc: "Better seals and interchangeable canisters make Improved Service Mask Crates available. Standard fittings also support registered civilian issue and reduce filter wear across military and civilian stocks."
advanced_gas_masks: "Advanced Protective Clothing"
advanced_gas_masks_desc: "Broad-spectrum filters, protective garments and prepared filter exchanges make Advanced CBRN Protective Sets available. They improve protection when supplied and maintained."
sealed_assault_protection: "Sealed Assault Protection"
sealed_assault_protection_desc: "Sealed respirators and hardened protective garments make Sealed Protective Sets available. Filtered overpressure compartments and crew drills also reduce exposure during armored chemical operations."
civil_defence_fitting_and_registration: "Civil Defence Fitting and Registration"
civil_defence_fitting_and_registration_desc: "Fitting stations, household registers and trained wardens reduce the respirator stocks consumed by organized civilian distribution."
military_filter_standardization: "Military Filter Standardization"
military_filter_standardization_desc: "Common canister threads, inspection gauges and interchangeable seals reduce filter wear and mask replacement losses."
rapid_filter_replacement: "Rapid Filter Replacement"
rapid_filter_replacement_desc: "Exchange depots and pre-packed canisters reduce the stock needed to restore military and civilian filter condition."
vehicle_overpressure_and_sealed_compartments: "Vehicle Overpressure and Sealed Compartments"
vehicle_overpressure_and_sealed_compartments_desc: "Filtered, positive-pressure crew compartments reduce friendly exposure risk during armored chemical delivery."

# Decontamination equipment progression.
field_decontamination_kits: "Field Decontamination Kits"
field_decontamination_kits_desc: "Portable sprayers, absorbents and neutralizing compounds make Field Decontamination Kits available and support Gas Mask and Decontamination Detachments."
mobile_wash_columns: "Mobile Wash Columns"
mobile_wash_columns_desc: "Vehicle-mounted pumps, heated wash lines and protected crews make Mobile Wash Columns available for work near the operational rear."
rapid_decontamination_plants: "Rapid Decontamination Plants"
rapid_decontamination_plants_desc: "High-throughput treatment lines and theater logistics make Rapid Decontamination Plants available around headquarters and supply hubs."

# Detection equipment includes the weather instruments previously researched apart.
chemical_detection_paper: "Field Detection and Weather Sets"
chemical_detection_paper_desc: "Indicator papers, sampling tubes and portable anemometers make Field Detection Sets available. Chemical Reconnaissance Detachments can identify common agents and chart local hazard drift."
mobile_sampling_laboratories: "Mobile Sampling Laboratories"
mobile_sampling_laboratories_desc: "Protected vehicle laboratories and trained weather observers identify agents, preserve evidence and chart contamination routes. Mobile Sampling Laboratories become available for production."
theater_cbrn_command_set: "Theater Detection and Forecasting Sets"
theater_cbrn_command_set_desc: "Upper-air reports, secure sampling networks and advanced field instruments make Theater CBRN Command Sets available for coordinated warning and evidence work."
portable_anemometer: "Portable Anemometers"
portable_anemometer_desc: "Handheld wind observations help Chemical Reconnaissance Detachments chart drift and safe movement corridors."
meteorological_stations: "Meteorological Stations"
meteorological_stations_desc: "Weather stations and trained observers improve hazard forecasts for field sampling teams."
upper_air_soundings: "Upper-Air Soundings"
upper_air_soundings_desc: "Balloon soundings help field teams anticipate shifting hazard corridors around contaminated ground."
