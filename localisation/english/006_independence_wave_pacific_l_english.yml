independence_wave_hbx_california_category: "California: Ports, Arsenals, and the Pacific"
independence_wave_hbx_california_category_desc: "California has inherited federal arsenals, coastal yards, and a government whose writ is still measured depot by depot. The coast command must bind Sacramento, the ports, and the industrial guard before it can speak for a wider Pacific settlement."
independence_wave_haw_hawaii_category: "Hawai'i: The Island Shipping Compact"
independence_wave_haw_hawaii_category_desc: "Independence leaves Hawai'i dependent on shipping registers, guarded anchorages, and an exact settlement of the bases and property left behind by the former administration."
independence_wave_fsm_micronesia_category: "Micronesia: An Ocean Between Governments"
independence_wave_fsm_micronesia_category_desc: "The federation's communities are separated by immense distances. Revenue, patrol relays, and a legitimate inter-island mandate must travel the same sea lanes that hold the state together."

hbx_divided_federal_arsenals: "Divided Federal Arsenals"
hbx_divided_federal_arsenals_desc: "Federal depots, state formations, port authorities, and factory guards obey overlapping warrants. Until a common chain of custody is accepted, California possesses matériel without a settled command."
hbx_californian_ports_and_works_board: "Californian Ports and Works Board"
hbx_californian_ports_and_works_board_desc: "A joint board now connects Sacramento's civil authority with coastal yards, inland works, and the screened state command. Procurement can follow a single public ledger."
haw_exposed_island_supply: "Exposed Island Supply"
haw_exposed_island_supply_desc: "The island government has ships on its registers but no settled order for allocating cargoes, escorting them, or reconciling territorial obligations."
haw_island_shipping_compact: "Island Shipping Compact"
haw_island_shipping_compact_desc: "Civil shipping registers, coastwatch stations, and public supply priorities operate under one compact without erasing Hawai'i's political continuity."
fsm_scattered_island_authority: "Scattered Island Authority"
fsm_scattered_island_authority_desc: "Revenue notices and patrol orders can spend weeks at sea. A government that cannot reliably reach its member islands cannot yet ask them for sacrifice."
fsm_federal_patrol_compact: "Federal Patrol Compact"
fsm_federal_patrol_compact_desc: "The island governments share revenue schedules, radio relays, and patrol obligations while retaining their place in the Micronesian federation."

independence_wave_hbx_hold_coastal_command_together: "Hold the Coastal Command Together"
independence_wave_hbx_hold_coastal_command_together_desc: "The first months will decide whether depots, yards, state formations, and factory guards accept one chain of custody. Raise Coastal Command before rival warrants harden into rival armies."
independence_wave_hbx_founding_crisis_failure_tt: "The command fractures: legitimacy, administrative capacity, and security fall while instability rises."
independence_wave_hbx_screen_federal_arsenals: "Screen the Federal Arsenals"
independence_wave_hbx_screen_federal_arsenals_desc: "Commit officers, guards, and support matériel to inventory the depots and recognize only warrants endorsed by the provisional state command."
independence_wave_hbx_arsenals_project_tt: "The screened depots strengthen Coastal Command and the national security settlement."
independence_wave_hbx_reopen_coastal_supply_bureaus: "Reopen the Coastal Supply Bureaus"
independence_wave_hbx_reopen_coastal_supply_bureaus_desc: "Restore the civil offices that matched rail consignments, port capacity, and military requisitions before the federal chain collapsed."
independence_wave_hbx_supply_bureaus_project_tt: "Coastal supply returns to a public administrative ledger."
independence_wave_hbx_seat_sacramento_civic_convention: "Seat the Sacramento Civic Convention"
independence_wave_hbx_seat_sacramento_civic_convention_desc: "Municipal delegations, labor representatives, port officials, and the state command will meet in Sacramento to define the limits of emergency authority."
independence_wave_hbx_civic_convention_project_tt: "The convention gives civilian institutions a recognized place in the provisional state."
independence_wave_hbx_settle_federal_asset_ledger: "Settle the Federal Asset Ledger"
independence_wave_hbx_settle_federal_asset_ledger_desc: "Negotiate custody of depots, public obligations, and protected property with the former host before an unsettled account becomes a pretext for reclamation."
independence_wave_hbx_asset_ledger_project_tt: "The bilateral ledger reduces hostile claims and clarifies California's custody of federal property."
independence_wave_hbx_charter_pacific_procurement_board: "Charter the Pacific Procurement Board"
independence_wave_hbx_charter_pacific_procurement_board_desc: "Pool vetted contracts, shipping schedules, and industrial requirements with the independence network without surrendering California's public control of procurement."
independence_wave_hbx_procurement_board_project_tt: "The procurement board links California's works program to the independence network."
independence_wave_hbx_prepare_pacific_maritime_congress: "Prepare a Pacific Maritime Congress"
independence_wave_hbx_prepare_pacific_maritime_congress_desc: "Reserve shipping, diplomatic staff, and factory time for a congress whose members must arrive as autonomous governments, not as appendages of California."
independence_wave_hbx_maritime_congress_project_tt: "A complete congress docket is prepared. California may finish the researched maritime-congress route in its national focus branch."

independence_wave_haw_secure_island_shipping_lanes: "Secure the Island Shipping Lanes"
independence_wave_haw_secure_island_shipping_lanes_desc: "The government must reconcile its registers, organize a coastwatch, and establish lawful custody of the old bases before the shipping system breaks into private schedules."
independence_wave_haw_founding_crisis_failure_tt: "The shipping compact fails to form: legitimacy, capacity, and security fall while instability rises."
independence_wave_haw_reconcile_shipping_registers: "Reconcile the Shipping Registers"
independence_wave_haw_reconcile_shipping_registers_desc: "Compare territorial, naval, and commercial records so scarce hulls cannot be claimed twice or diverted without public authority."
independence_wave_haw_shipping_registers_project_tt: "A single civil register governs the island shipping pool."
independence_wave_haw_organize_island_coastwatch: "Organize the Island Coastwatch"
independence_wave_haw_organize_island_coastwatch_desc: "Equip observation posts, signal stations, and harbor patrols to protect the routes on which every public service depends."
independence_wave_haw_coastwatch_project_tt: "The coastwatch binds harbor security to the island shipping compact."
independence_wave_haw_settle_base_and_property_accounts: "Settle Base and Property Accounts"
independence_wave_haw_settle_base_and_property_accounts_desc: "Put leases, public obligations, and military property into a bilateral account that neither government can reinterpret by force."
independence_wave_haw_base_accounts_project_tt: "The former-host ledger records the disposition of bases and public property."
independence_wave_haw_authorize_pacific_delegation: "Authorize a Pacific Delegation"
independence_wave_haw_authorize_pacific_delegation_desc: "Send delegates with an autonomous mandate: they may negotiate common shipping and defense, but only Hawai'i may accept a final federal settlement."
independence_wave_haw_delegation_project_tt: "Hawai'i prepares an autonomous Pacific delegation. This is not consent to federation."

independence_wave_fsm_keep_island_federation_connected: "Keep the Island Federation Connected"
independence_wave_fsm_keep_island_federation_connected_desc: "The federation must make revenue, patrol orders, and political guarantees travel reliably between its member islands before distance turns autonomy into isolation."
independence_wave_fsm_founding_crisis_failure_tt: "Inter-island authority breaks down: legitimacy, capacity, and security fall while instability rises."
independence_wave_fsm_convene_inter_island_revenue_congress: "Convene the Inter-Island Revenue Congress"
independence_wave_fsm_convene_inter_island_revenue_congress_desc: "Agree on contributions and relief schedules that recognize the different means of each island government."
independence_wave_fsm_revenue_congress_project_tt: "The member islands publish a common revenue and relief schedule."
independence_wave_fsm_establish_patrol_relay_network: "Establish a Patrol Relay Network"
independence_wave_fsm_establish_patrol_relay_network_desc: "Equip radio relays and patrol stations so warnings and public orders can cross the federation without waiting for a single long circuit."
independence_wave_fsm_patrol_relay_project_tt: "The relay network gives the federal patrol service a reliable chain of communication."
independence_wave_fsm_settle_external_administration_accounts: "Settle External Administration Accounts"
independence_wave_fsm_settle_external_administration_accounts_desc: "Resolve protected property, public obligations, and continuing claims with the former administration through an exact bilateral ledger."
independence_wave_fsm_external_accounts_project_tt: "The external-administration ledger reduces hostile claims and clarifies public obligations."
independence_wave_fsm_ratify_federal_council_compact: "Ratify the Federal Council Compact"
independence_wave_fsm_ratify_federal_council_compact_desc: "Give the member islands a permanent federal council whose revenue, relief, and patrol mandates remain accountable to every constituent government."
independence_wave_fsm_federal_council_settlement_tt: "Micronesia adopts the federal-council route, completes its government settlement, strengthens every national value, and reduces instability."
independence_wave_fsm_confirm_traditional_leaders_council: "Confirm the Traditional Leaders' Council"
independence_wave_fsm_confirm_traditional_leaders_council_desc: "Bind the federal administration to a council of customary authorities so distant ministries cannot govern the islands without local consent."
independence_wave_fsm_traditional_settlement_tt: "Micronesia adopts the traditional route, completes its government settlement, strengthens legitimacy and security, and reduces instability."
independence_wave_fsm_adopt_inter_island_constitution: "Adopt the Inter-Island Constitution"
independence_wave_fsm_adopt_inter_island_constitution_desc: "Codify equal federal citizenship, enumerated island powers, and a civil executive answerable to a representative inter-island assembly."
independence_wave_fsm_constitutional_settlement_tt: "Micronesia adopts the constitutional route, completes its government settlement, strengthens legitimacy and administrative capacity, and reduces instability."
independence_wave_fsm_accept_protected_ocean_mandate: "Accept a Protected Ocean Mandate"
independence_wave_fsm_accept_protected_ocean_mandate_desc: "Place external defense and strategic shipping beneath a guarantor's protection while preserving the federation's internal councils and civil administration."
independence_wave_fsm_patron_settlement_tt: "Micronesia adopts the patron-client route, completes its government settlement, improves recognition and administration, and withdraws from independent league leadership."
independence_wave_fsm_ratify_autonomous_federation_mandate: "Ratify an Autonomous Federation Mandate"
independence_wave_fsm_ratify_autonomous_federation_mandate_desc: "Authorize delegates to negotiate Pacific cooperation while reserving final consent to the Micronesian government and its member islands."
independence_wave_fsm_delegation_project_tt: "Micronesia prepares an autonomous Pacific delegation. This is not consent to federation."
independence_wave_cost_pacific_island_strategic: "Requires more than [?constant:independence_wave_decision_cost.stability_standard|%0] Stability, [?constant:independence_wave_decision_cost.war_support_minor|%0] War Support, [?constant:independence_wave_decision_cost.command_power_standard|0] Command Power, [?constant:independence_wave_decision_cost.manpower_light|0] manpower, and [?constant:independence_wave_decision_cost.convoy_light|0] convoys; completion commits exactly those amounts."

independence_wave_hbx_screen_federal_arsenals_focus: "Screen the Federal Arsenals"
independence_wave_hbx_screen_federal_arsenals_focus_desc: "California cannot build a state around depots whose guards recognize different warrants. A screened chain of custody will place the arsenals under accountable command."
independence_wave_hbx_screen_federal_arsenals_focus_tt: "Screen the federal depots and strengthen California's security settlement."
independence_wave_hbx_reopen_coastal_supply_bureaus_focus: "Reopen the Coastal Supply Bureaus"
independence_wave_hbx_reopen_coastal_supply_bureaus_focus_desc: "The coast and the interior must share one schedule for rail consignments, port allocations, and public requisitions."
independence_wave_hbx_reopen_coastal_supply_bureaus_focus_tt: "Restore the public supply ledger and administrative capacity."
independence_wave_hbx_seat_sacramento_civic_convention_focus: "Seat the Sacramento Civic Convention"
independence_wave_hbx_seat_sacramento_civic_convention_focus_desc: "A durable California needs consent beyond the emergency command. Municipalities, labor, industry, and the services will define a provisional civic compact."
independence_wave_hbx_seat_sacramento_civic_convention_focus_tt: "Seat the convention and strengthen civilian legitimacy."
independence_wave_hbx_bind_ports_factories_and_guard_focus: "Bind Ports, Factories, and Guard"
independence_wave_hbx_bind_ports_factories_and_guard_focus_desc: "The convention's writ and the coast command's warrants will be joined in one public machinery of defense and production."
independence_wave_hbx_bind_ports_factories_and_guard_focus_tt: "Complete the Coastal Command crisis settlement and mature California's package spirit."
independence_wave_hbx_settle_federal_asset_ledger_focus: "Settle the Federal Asset Ledger"
independence_wave_hbx_settle_federal_asset_ledger_focus_desc: "A documented settlement of property and obligations offers more security than a depot held under an unanswered claim."
independence_wave_hbx_settle_federal_asset_ledger_focus_tt: "Clarify federal property, obligations, and protected claims with the former host."
independence_wave_hbx_charter_pacific_procurement_board_focus: "Charter the Pacific Procurement Board"
independence_wave_hbx_charter_pacific_procurement_board_focus_desc: "California's yards and factories can coordinate common orders with the independence network while preserving public custody of contracts."
independence_wave_hbx_charter_pacific_procurement_board_focus_tt: "Create a network-facing procurement institution and improve common cooperation."
independence_wave_hbx_convene_pacific_maritime_congress_focus: "Convene the Pacific Maritime Congress"
independence_wave_hbx_convene_pacific_maritime_congress_focus_desc: "California will invite Hawai'i and Micronesia as autonomous governments to negotiate shipping, defense, and federal settlement without presuming their consent."
independence_wave_hbx_convene_pacific_maritime_congress_focus_tt: "Complete the researched maritime-congress route and reveal the Pacific federation prospect once every founding condition is satisfied."

independence_wave_haw_reconcile_shipping_registers_focus: "Reconcile the Shipping Registers"
independence_wave_haw_reconcile_shipping_registers_focus_desc: "Territorial, naval, and commercial books assign the same hulls to competing duties. A single public register will establish which ships carry supplies, which answer emergencies, and which remain available to trade."
independence_wave_haw_reconcile_shipping_registers_focus_tt: "Unify the civil shipping register, strengthen Shipping Security, and improve administrative capacity."
independence_wave_haw_organize_island_coastwatch_focus: "Organize the Island Coastwatch"
independence_wave_haw_organize_island_coastwatch_focus_desc: "Observation posts, signal stations, and harbor patrols must share one warning chain if Hawai'i is to guard the routes on which every public service depends."
independence_wave_haw_organize_island_coastwatch_focus_tt: "Bind the coastwatch to the public shipping system and strengthen national security."
independence_wave_haw_seat_island_government_compact_focus: "Seat the Island Government Compact"
independence_wave_haw_seat_island_government_compact_focus_desc: "Island delegates, port authorities, labor representatives, and the existing government will define the civil warrant beneath every shipping and defense order."
independence_wave_haw_seat_island_government_compact_focus_tt: "Seat a public island compact, strengthen Shipping Security, and reinforce civilian legitimacy."
independence_wave_haw_bind_shipping_supply_and_coastwatch_focus: "Bind Shipping, Supply, and Coastwatch"
independence_wave_haw_bind_shipping_supply_and_coastwatch_focus_desc: "The register, the supply offices, and the warning stations will answer one civil schedule. Emergency cargoes can move under guard without placing the islands beneath a separate military authority."
independence_wave_haw_bind_shipping_supply_and_coastwatch_focus_tt: "Complete the Shipping Security settlement and mature the Island Shipping Compact."
independence_wave_haw_settle_base_and_property_accounts_focus: "Settle Base and Property Accounts"
independence_wave_haw_settle_base_and_property_accounts_focus_desc: "Leases, public obligations, and military property require an exact account. If the former administration still speaks, Hawai'i will negotiate the ledger; if it has fallen, Hawai'i will publish the surviving obligations under its own civil warrant."
independence_wave_haw_settle_base_and_property_accounts_focus_tt: "Settle the base ledger, strengthen Shipping Security, and improve Hawai'i's diplomatic standing."
independence_wave_haw_ratify_autonomous_pacific_mandate_focus: "Ratify an Autonomous Pacific Mandate"
independence_wave_haw_ratify_autonomous_pacific_mandate_focus_desc: "Hawai'i can seek common shipping and defense without surrendering its government. The mandate will define what delegates may negotiate and reserve every final federal obligation to the islands."
independence_wave_haw_ratify_autonomous_pacific_mandate_focus_tt: "Ratify a sovereign negotiating mandate and deepen cooperation with the independence network. This is not consent to federation."
independence_wave_haw_dispatch_pacific_delegation_focus: "Dispatch the Pacific Delegation"
independence_wave_haw_dispatch_pacific_delegation_focus_desc: "With the base accounts settled and the autonomous mandate ratified, Hawai'i can send delegates empowered to negotiate common shipping, procurement, and defense while reserving final consent at home."
independence_wave_haw_dispatch_pacific_delegation_focus_tt: "Prepare Hawai'i's autonomous Pacific delegation and strengthen diplomatic and network cooperation. This is not consent to federation."

independence_wave_form48_invitation_category: "The Pacific Federal Invitation"
independence_wave_form48_invitation_category_desc: "California has proposed a federation of sovereign Pacific governments. The compact offers reciprocal guarantees, military access, common shipping administration, and negotiated defense obligations. It does not authorize annexation or full integration: Hawai'i and Micronesia retain their governments, territories, and national institutions."
independence_wave_form48_accept_autonomous_membership: "Authorize Autonomous Federal Membership"
independence_wave_form48_accept_autonomous_membership_desc: "Ratify the founding invitation under an autonomous mandate. Our government remains sovereign and reserves the right to grant or withhold each later shipping, procurement, and basing obligation."
independence_wave_form48_accept_autonomous_membership_tt: "Accept California's founding invitation as a sovereign autonomous member. This does not permit full integration."
independence_wave_form48_withhold_autonomous_membership: "Withhold the Federal Mandate"
independence_wave_form48_withhold_autonomous_membership_desc: "Refuse the founding compact. California cannot count our delegation as consent and the Pacific federation cannot form through this proposal."
independence_wave_form48_withhold_autonomous_membership_tt: "Withhold consent from California's Pacific federal proposal."
independence_wave_form48_invitation_acceptance_cost: "Commits [?constant:independence_wave_form48_cost.member_command_power|0] Command Power and [?constant:independence_wave_form48_cost.member_convoys|0] convoys"

independence_wave_form48_federal_compact_category: "The Pacific Federal Compact"
independence_wave_form48_federal_compact_category_desc: "§YFederal Carrier:§! [HBX.GetName]\n§CShipping Coordination:§! [?HBX.independence_wave_form48_shipping_coordination|0]/[?constant:independence_wave_form48_value.maximum|0]\n§OIndustrial Specialization:§! [?HBX.independence_wave_form48_industrial_specialization|0]/[?constant:independence_wave_form48_value.maximum|0]\n§RDefense Readiness:§! [?HBX.independence_wave_form48_defense_readiness|0]/[?constant:independence_wave_form48_value.maximum|0]\n§GMember Autonomy:§! [?HBX.independence_wave_form48_member_autonomy|0]/[?constant:independence_wave_form48_value.maximum|0]\n§tCompact Strain:§! [?HBX.independence_wave_form48_compact_strain|0]/[?constant:independence_wave_form48_value.dissolution_strain|0]\n§YCompleted Work Cycles:§! [?HBX.independence_wave_form48_program_cycles_completed|0]\n\n[HBX.GetName] administers the common ledger, but Hawai'i and Micronesia remain sovereign. Every federal cycle requires material commitments from the carrier and an explicit decision by both members. Withholding protects the member's immediate discretion while weakening common capacity and trust."

independence_wave_form48_federal_coordination: "Pacific Federal Coordination"
independence_wave_form48_federal_coordination_desc: "The federal carrier administers the federal register and coordinates the work program, but it cannot seize a member's shipping, factories, or bases. Common benefits depend on paid projects and renewed member consent."
independence_wave_form48_autonomous_compact: "Sovereign Pacific Membership"
independence_wave_form48_autonomous_compact_desc: "The Pacific compact grants reciprocal access and guarantees while reserving national government, territory, and each federal obligation to the member state."

independence_wave_form48_commission_convoy_defense_rotation: "Commission a Convoy-Defense Rotation"
independence_wave_form48_commission_convoy_defense_rotation_desc: "The federal carrier will reserve escorts, fuel, command attention, and yard capacity for a common rotation. The scheme becomes effective only if Hawai'i and Micronesia each enter their own convoy obligation before the deadline."
independence_wave_form48_commission_convoy_defense_rotation_tt: "Open a [?constant:independence_wave_form48_duration.convoy_deadline|0]-day convoy-defense mission and request a paid contribution from both sovereign members."
independence_wave_form48_carrier_convoy_cost: "Commits [?constant:independence_wave_form48_cost.carrier_command_power|0] Command Power, [?constant:independence_wave_form48_cost.carrier_convoys|0] convoys, [?constant:independence_wave_form48_cost.carrier_fuel|0] fuel, and [?constant:independence_wave_form48_cost.carrier_convoy_factories|0] civilian factories"
independence_wave_form48_convoy_defense_deadline: "Complete the Convoy-Defense Rotation"
independence_wave_form48_convoy_defense_deadline_desc: "Both Hawai'i and Micronesia must fulfill their convoy obligations before the federal timetable expires. Success strengthens shipping, defense, autonomy safeguards, former-host settlements, and league confidence; failure damages shipping and defense and raises compact strain."

independence_wave_form48_allocate_shared_procurement_contracts: "Allocate Shared Procurement Contracts"
independence_wave_form48_allocate_shared_procurement_contracts_desc: "The federal carrier will commit equipment, hulls, and factory time to a transparent joint schedule. Each member must supply a bounded national quota before the common orders can be released."
independence_wave_form48_allocate_shared_procurement_contracts_tt: "Open a [?constant:independence_wave_form48_duration.procurement_deadline|0]-day procurement mission and request a paid equipment quota from both sovereign members."
independence_wave_form48_carrier_procurement_cost: "Commits [?constant:independence_wave_form48_cost.carrier_procurement_convoys|0] convoys, [?constant:independence_wave_form48_cost.carrier_infantry_equipment|0] infantry equipment, [?constant:independence_wave_form48_cost.carrier_support_equipment|0] support equipment, and [?constant:independence_wave_form48_cost.carrier_procurement_factories|0] civilian factories"
independence_wave_form48_procurement_deadline: "Complete the Shared Procurement Schedule"
independence_wave_form48_procurement_deadline_desc: "Both member governments must fulfill their national procurement quotas. Success deepens industrial specialization, common readiness, league reserves, and independence from patron contracts; failure weakens the industrial and defense ledgers and raises compact strain."

independence_wave_form48_negotiate_island_basing_convention: "Negotiate an Island Basing Convention"
independence_wave_form48_negotiate_island_basing_convention_desc: "Draft limited access schedules for repair, refueling, coastwatch, and emergency dispersal. No base enters the convention until its sovereign government gives a separate, bounded consent."
independence_wave_form48_negotiate_island_basing_convention_tt: "Open a [?constant:independence_wave_form48_duration.basing_deadline|0]-day basing mission. Hawai'i and Micronesia must each grant limited consent."
independence_wave_form48_carrier_basing_cost: "Commits [?constant:independence_wave_form48_cost.carrier_command_power|0] Command Power, [?constant:independence_wave_form48_cost.carrier_support_equipment|0] support equipment, and [?constant:independence_wave_form48_cost.carrier_basing_factories|0] civilian factories"
independence_wave_form48_basing_deadline: "Ratify the Island Basing Convention"
independence_wave_form48_basing_deadline_desc: "Both sovereign members must grant the limited basing protocol before the deadline. Ratification raises defense readiness and the autonomy ledger together; failure weakens both and deepens compact strain."

independence_wave_form48_fulfill_convoy_obligation: "Enter the Convoy Rotation"
independence_wave_form48_fulfill_convoy_obligation_desc: "Commit a bounded national convoy detachment and the command staff needed to place it on the common route book."
independence_wave_form48_fulfill_convoy_obligation_tt: "Fulfill our convoy obligation and strengthen our contribution and confidence records in the wider league."
independence_wave_form48_withhold_convoy_obligation: "Withhold the Convoy Detachment"
independence_wave_form48_withhold_convoy_obligation_desc: "Keep our hulls under national schedules. This asserts immediate autonomy but reduces shipping coordination, league confidence, and the compact's ability to finish the rotation."
independence_wave_form48_withhold_convoy_obligation_tt: "Withhold this cycle's convoy obligation. Federal autonomy rises, while shipping capacity and compact trust fall."
independence_wave_form48_member_convoy_cost: "Commits [?constant:independence_wave_form48_cost.member_command_power|0] Command Power and [?constant:independence_wave_form48_cost.member_convoys|0] convoys"

independence_wave_form48_fulfill_procurement_obligation: "Fulfill the National Procurement Quota"
independence_wave_form48_fulfill_procurement_obligation_desc: "Place a bounded equipment lot and one civilian works allocation on the common schedule while retaining national title to the contributing facilities."
independence_wave_form48_fulfill_procurement_obligation_tt: "Fulfill our procurement obligation and strengthen our contribution and confidence records in the wider league."
independence_wave_form48_withhold_procurement_obligation: "Withhold the Procurement Quota"
independence_wave_form48_withhold_procurement_obligation_desc: "Keep the equipment under national allocation. This preserves immediate discretion but weakens industrial specialization, federal trust, and the common schedule."
independence_wave_form48_withhold_procurement_obligation_tt: "Withhold this cycle's procurement obligation. Federal autonomy rises, while industrial coordination and compact trust fall."
independence_wave_form48_member_procurement_cost: "Commits [?constant:independence_wave_form48_cost.member_infantry_equipment|0] infantry equipment, [?constant:independence_wave_form48_cost.member_support_equipment|0] support equipment, and [?constant:independence_wave_form48_cost.member_factories|0] civilian factory"

independence_wave_form48_grant_limited_basing_consent: "Grant Limited Basing Consent"
independence_wave_form48_grant_limited_basing_consent_desc: "Authorize repair, refueling, coastwatch, and emergency dispersal under a revocable national warrant. The convention grants neither territory nor permanent command."
independence_wave_form48_grant_limited_basing_consent_tt: "Grant the bounded basing protocol. A successful convention raises defense readiness and member autonomy together."
independence_wave_form48_withhold_basing_consent: "Withhold Basing Consent"
independence_wave_form48_withhold_basing_consent_desc: "Keep every facility outside the federal schedule. Our sovereign discretion is preserved, but the common warning and dispersal plan remains incomplete."
independence_wave_form48_withhold_basing_consent_tt: "Withhold this cycle's basing consent. Federal autonomy rises, while defense coordination and compact trust fall."
independence_wave_form48_member_basing_cost: "Commits [?constant:independence_wave_form48_cost.member_command_power|0] Command Power and [?constant:independence_wave_form48_cost.member_support_equipment|0] support equipment"

independence_wave_form48_dissolve_pacific_federation: "Dissolve the Pacific Federal Compact"
independence_wave_form48_dissolve_pacific_federation_desc: "The common ledger can no longer conceal the compact's loss of consent. End the reciprocal federal relations, restore California's national identity, and leave all three Pacific governments sovereign."
independence_wave_form48_dissolve_pacific_federation_tt: "End the federal register, active common projects, and the reciprocal access and guarantees created by the compact. California, Hawai'i, and Micronesia suffer political, administrative, and security consequences, while relations with their former rulers and the wider league deteriorate."
