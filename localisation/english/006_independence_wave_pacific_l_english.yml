HBX_independence_wave_civic_convention_chair: "William D. Stephens"
HBX_independence_wave_civic_convention_chair_desc: "A former governor and Los Angeles civic leader, Stephens brings long experience in public administration, commercial coordination, and constitutional bargaining to California's emergency convention."
FSM_independence_wave_inter_island_congress_chair: "Elias Kihleng"
FSM_independence_wave_inter_island_congress_chair_desc: "A Pohnpeian schoolmaster and municipal clerk, Kihleng is elected to reconcile island representation, revenue schedules, and patrol authority until a durable federal executive can be constituted."

