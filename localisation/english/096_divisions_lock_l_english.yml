chaosx.nr96.1.t: "Division templates locked"
chaosx.nr96.2.t: "Division templates locked"
chaosx.nr96.2.d: "Our division templates are temporarily locked. New formations cannot be trained, and existing templates cannot be adjusted."
chaosx.nr96.2.a: "What now?"

chaosx.nr96.3.t: "Division templates unlocked"
chaosx.nr96.3.d: "Our division templates are unlocked again. We can train new formations and adjust existing designs."
chaosx.nr96.3.a: "About time!"
