fallout.event_log.grid_vote.detail.choice_favored_clients: "The Technate favored the settlements that rebuilt its surviving cables."
fallout.event_log.grid_vote.detail.choice_domestic_first: "The Technate reserved current for its domestic wards before exports."
fallout.event_log.grid_vote.detail.choice_military_network: "The Technate bound the surviving grid to protected military corridors."
fallout.event_log.grid_vote.detail.neighbors_equal_success: "Equal rationed shares became the first regional power table."
fallout.event_log.grid_vote.detail.neighbors_equal_partial: "Equal shares survived while one damaged transformer delayed a neighbor."
fallout.event_log.grid_vote.detail.neighbors_equal_failure: "The equal-share schedule failed at a disputed transformer."
fallout.event_log.grid_vote.detail.favored_clients_success: "Cable-building settlements gained priority and a durable repair voice."
fallout.event_log.grid_vote.detail.favored_clients_partial: "Two favored repair towns received current while a third waited."
fallout.event_log.grid_vote.detail.favored_clients_failure: "The client list divided the relay crews and closed a workshop gate."
fallout.event_log.grid_vote.detail.domestic_first_success: "Domestic wards stayed lit while the Technate promised a fixed export review."
fallout.event_log.grid_vote.detail.domestic_first_partial: "Domestic wards held current while an eastern water pump stopped."
fallout.event_log.grid_vote.detail.domestic_first_failure: "Domestic priority protected one clinic and lost a neighboring pump."
fallout.event_log.grid_vote.detail.military_network_success: "A protected corridor carried power to the repair depots."
fallout.event_log.grid_vote.detail.military_network_partial: "The guarded corridor arrived while civilian lines waited."
fallout.event_log.grid_vote.detail.military_network_failure: "A diverted relay broke the military corridor and armed the next vote."
fallout.event_log.grid_vote.detail.callback_success: "One winter of measured current produced a recognized regional grid charter."
fallout.event_log.grid_vote.detail.callback_partial: "The grid survived on private lists and an unsettled charter."
fallout.event_log.grid_vote.detail.callback_failure: "Exhausted reserves turned the regional grid into a political lever."
fallout.event_log.grid_vote.detail.cancelled: "The grid record was cancelled after its district, partner, owner, controller, or generation changed."
