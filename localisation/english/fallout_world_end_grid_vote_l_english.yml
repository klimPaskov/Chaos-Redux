chaosx.fallout.824.t: "The Grid Vote"
chaosx.fallout.824.opening.d: "The Patent After the End left the Manchurian Reactor Keeps with enough working cable to light only a few districts beyond its own walls. East Asian settlements have sent delegates with different ledgers. Some want every neighbor to receive the same measured share. Others want the workshops that rebuilt the lines to receive priority. The domestic wards demand power before any export, while the garrison wants a protected military corridor."
chaosx.fallout.824.a: "Share power with every neighbor"
chaosx.fallout.824.a.tt: "Spend Food 2, Medicine 2, and Recognition 2 to give each neighboring settlement the same measured share. This improves trust and trade while reducing the Technate's reserve."
chaosx.fallout.824.b: "Favor the settlements that built the lines"
chaosx.fallout.824.b.tt: "Spend Fuel 2, Recognition 3, and Cohesion 2 to reward the workshops and settlements that repaired the cables. This strengthens local production but creates dependency on favored clients."
chaosx.fallout.824.c: "Reserve power for domestic districts"
chaosx.fallout.824.c.tt: "Spend Scrap 2, Power 2, and Medicine 2 to keep the Manchurian Reactor Keeps supplied before exports resume. This protects domestic reliability while neighbors question the grid's promise."
chaosx.fallout.824.d: "Bind the grid to military corridors"
chaosx.fallout.824.d.tt: "Spend Food 2, Fuel 2, and Recognition 2 to route power through protected military corridors. This raises strategic reach but makes every civilian line a political bargain."
chaosx.fallout.825.t: "The Grid Vote"
chaosx.fallout.826.t: "The Lines Have Been Assigned"
chaosx.fallout.826.neighbors_equal.success.d: "The Technate published one rationed power table for the Manchurian Reactor Keeps and every settlement on its surviving line. Clinics in the eastern wards received the same first-hour protection as the neighboring repair towns. No settlement gained a private claim over the cables."
chaosx.fallout.826.neighbors_equal.partial.d: "Most neighbors accepted equal shares, but a damaged transformer forced one eastern town to wait through the first cold night. The public table survived, although the Technate's reserve is thinner than its delegates admitted."
chaosx.fallout.826.neighbors_equal.failure.d: "The equal-share schedule collapsed when two relay crews counted the same transformer as theirs. The Manchurian Reactor Keeps kept its lights, but the neighboring towns now call the grid a promise written without spare parts."
chaosx.fallout.826.favored_clients.success.d: "The settlements that rebuilt the cables received priority hours and a voice in the next repair roster. Their workshops are producing new relays, yet the favored towns now expect every future fault to be paid for first."
chaosx.fallout.826.favored_clients.partial.d: "Two repair towns received their promised current while a third lost its share to an unfinished line. The Technate gained working relays and lost some confidence among settlements outside the client circle."
chaosx.fallout.826.favored_clients.failure.d: "The client list became a quarrel over who had carried the first cable. A workshop shut its gate rather than accept a lower priority, and the grid lost both a relay crew and the trust of the next town."
chaosx.fallout.826.domestic_first.success.d: "The Manchurian Reactor Keeps kept its clinics, food rooms, and filter pumps lit through the first export week. The domestic wards stabilized, but every neighboring delegate left with a written date for the next review."
chaosx.fallout.826.domestic_first.partial.d: "Domestic wards received the current while one eastern settlement ran its water pumps by hand. The reserve held and the grid remained intact, yet the neighboring councils now treat every export as a concession."
chaosx.fallout.826.domestic_first.failure.d: "The domestic priority roster consumed a relay that should have powered the eastern water line. A clinic stayed open while a neighboring settlement lost its pump, leaving the Technate with a safe core and a hostile border."
chaosx.fallout.826.military_network.success.d: "The garrison secured the mountain corridor and kept a guarded line open to the repair depots. Convoys moved after dark, but the military route now has a claim on every future turbine decision."
chaosx.fallout.826.military_network.partial.d: "The protected corridor reached the main depot, although two civilian lines received power only after the convoy passed. The garrison gained reach while local councils began recording every diverted hour."
chaosx.fallout.826.military_network.failure.d: "A military relay was diverted to a broken road and the protected corridor never closed its gap. The garrison blamed the workshops, the workshops blamed the officers, and the next export vote will begin under armed watch."
chaosx.fallout.826.a: "Record the grid decision"
chaosx.fallout.826.a.tt: "Record the delayed grid result, apply its regional effects, and open the later review for the Manchurian Reactor Keeps."
chaosx.fallout.827.t: "The Grid Vote"
chaosx.fallout.828.t: "The Grid After One Winter"
chaosx.fallout.828.success.d: "One winter of measured current left the Technate with a recognized power charter. Neighbor councils accepted the published hours, repair crews shared relay designs, and the Manchurian Reactor Keeps can now negotiate a regional standard without hiding its reserve."
chaosx.fallout.828.partial.d: "The grid survived the winter, but only because clerks and relay crews kept separate private lists. The charter exists, although two neighboring councils still reserve the right to cut their line when domestic demand rises."
chaosx.fallout.828.failure.d: "The winter review found an exhausted reserve, unpaid relay crews, and a growing dependency grievance. The Technate still controls the reactor, but its neighbors now treat the grid as a lever rather than a common service."
chaosx.fallout.828.a: "Seal the winter charter"
chaosx.fallout.828.a.tt: "Apply the regional grid result, record the second-year memory, and release the reserved state and neighboring receipts."
chaosx.fallout.829.t: "The Grid Vote"
chaosx.fallout.830.t: "The Grid Vote"
