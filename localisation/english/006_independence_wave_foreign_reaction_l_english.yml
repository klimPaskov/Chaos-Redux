l_english:
chaosx.nr6.65.t: "A New Neighbor"
chaosx.nr6.65.d: "[?independence_wave_foreign_reaction_target.GetNameDefCap] has broken away[GetIndependenceWaveForeignHostClause] in the Independence Wave. [GetIndependenceWaveForeignPrimaryReason][GetIndependenceWaveForeignSecondaryReason][GetIndependenceWaveForeignConflictNote]\n\nOur border guards are asking for orders, and the cabinet must decide how [ROOT.GetNameDef] will treat the new state."
chaosx.nr6.65.a: "Watch the frontier"
chaosx.nr6.65.a.tt: "We take no position on [?independence_wave_foreign_reaction_target.GetNameDef]."
chaosx.nr6.65.b: "Recognize [?independence_wave_foreign_reaction_target.GetName] and open a liaison office"
chaosx.nr6.65.b.tt: "[GetIndependenceWaveForeignRecognitionCost]\n$independence_wave_foreign_recognition_effect_tt$"
chaosx.nr6.65.c: "Sponsor border talks"
chaosx.nr6.65.c.tt: "$independence_wave_foreign_cost_standard$\n$independence_wave_foreign_mediation_effect_tt$"
chaosx.nr6.65.e: "Stand with [?independence_wave_foreign_reaction_host.GetNameDef]"
chaosx.nr6.65.e.tt: "$independence_wave_foreign_cost_light$\n$independence_wave_foreign_containment_effect_tt$"

chaosx.nr6.66.t: "A Shift in the Regional Balance"
chaosx.nr6.66.d: "The Independence Wave has carried [?independence_wave_foreign_reaction_target.GetNameDef] to independence[GetIndependenceWaveForeignHostClause]. [GetIndependenceWaveForeignPrimaryReason][GetIndependenceWaveForeignSecondaryReason][GetIndependenceWaveForeignConflictNote]\n\nOur ministers see three ways to act: a guarantee, mediation, or an investment in the routes that now cross a new border."
chaosx.nr6.66.a: "Withhold support"
chaosx.nr6.66.a.tt: "We make no commitment to [?independence_wave_foreign_reaction_target.GetNameDef]."
chaosx.nr6.66.b: "Guarantee its independence"
chaosx.nr6.66.b.tt: "[GetIndependenceWaveForeignGuaranteeCost]\n$independence_wave_foreign_guarantee_effect_tt$"
chaosx.nr6.66.c: "Offer to mediate"
chaosx.nr6.66.c.tt: "$independence_wave_foreign_cost_standard$\n$independence_wave_foreign_mediation_effect_tt$"
chaosx.nr6.66.e: "Invest in the transit corridor"
chaosx.nr6.66.e.tt: "$independence_wave_foreign_cost_standard$\nWe offer to fund road and rail works through [?independence_wave_foreign_reaction_target.GetNameDef]. If it accepts, its capital gains §Ginfrastructure§! and §GCapacity§!, and we gain trade influence there. It may accept a smaller arrangement or refuse. The cost is spent either way."

chaosx.nr6.67.t: "A Question of Precedent"
chaosx.nr6.67.d: "Every foreign ministry is studying [?independence_wave_foreign_reaction_target.GetNameDef], newly independent[GetIndependenceWaveForeignHostClause]. [GetIndependenceWaveForeignPrimaryReason][GetIndependenceWaveForeignSecondaryReason][GetIndependenceWaveForeignConflictNote]\n\nWhatever a great power does now will be read as a precedent. We can recognize the new state, offer it arms, or stand with the government it left."
chaosx.nr6.67.a: "Abstain"
chaosx.nr6.67.a.tt: "We take no position on [?independence_wave_foreign_reaction_target.GetNameDef]."
chaosx.nr6.67.b: "Extend recognition and limited aid"
chaosx.nr6.67.b.tt: "[GetIndependenceWaveForeignRecognitionCost] We also ship §Y[?constant:independence_wave_decision_cost.infantry_light|0]§! infantry equipment from our stockpile, which gives it §GSecurity§!.\n$independence_wave_foreign_recognition_effect_tt$"
chaosx.nr6.67.c: "Offer an arms channel"
chaosx.nr6.67.c.tt: "$independence_wave_foreign_cost_standard$\nWe offer §Y[?constant:independence_wave_decision_cost.infantry_major|0]§! infantry equipment and §Y[?constant:independence_wave_decision_cost.support_standard|0]§! support equipment from our stockpile. If [?independence_wave_foreign_reaction_target.GetNameDef] accepts, the arms are delivered and we gain military influence there. It may take fewer arms for less influence, or refuse. The cost is spent either way."
chaosx.nr6.67.e: "Organize containment"
chaosx.nr6.67.e.tt: "$independence_wave_foreign_cost_standard$\n$independence_wave_foreign_containment_effect_tt$"

chaosx.nr6.68.t: "A Younger State"
chaosx.nr6.68.d: "Another country has joined the new states: [?independence_wave_foreign_reaction_target.GetNameDef] has won its independence[GetIndependenceWaveForeignHostClause]. [GetIndependenceWaveForeignPrimaryReason][GetIndependenceWaveForeignSecondaryReason][GetIndependenceWaveForeignConflictNote]\n\nOur own independence is recent enough that the choice feels personal. We can share what we have built, send help, or contest land we both want."
chaosx.nr6.68.a: "Stand aside"
chaosx.nr6.68.a.tt: "We take no position on [?independence_wave_foreign_reaction_target.GetNameDef]."
chaosx.nr6.68.b: "Recognize it and share our institutions"
chaosx.nr6.68.b.tt: "[GetIndependenceWaveForeignRecognitionCost]\n$independence_wave_foreign_recognition_effect_tt$ It also gains §GCapacity§!, and both our standings in the Independence Network rise."
chaosx.nr6.68.c: "Send aid"
chaosx.nr6.68.c.tt: "Costs §Y[?constant:independence_wave_decision_cost.command_power_light|0]§! £command_power and ships §Y[?constant:independence_wave_decision_cost.infantry_light|0]§! infantry equipment and §Y[?constant:independence_wave_decision_cost.support_light|0]§! support equipment from our stockpile.\n[?independence_wave_foreign_reaction_target.GetNameDefCap] gains §GSecurity§!, more if it is at war or under severe threat, and its §GInstability§! falls. Both our standings in the Independence Network rise."
chaosx.nr6.68.e: "Contest its standing"
chaosx.nr6.68.e.tt: "$independence_wave_foreign_cost_light$\nWe dispute its claim to the land we also claim. [?independence_wave_foreign_reaction_target.GetNameDefCap] loses §RLegitimacy§! and §RRecognition§!, its §RInstability§! rises, and it will resent us."

chaosx.nr6.71.t: "A Foreign Offer"
chaosx.nr6.71.d: "[?independence_wave_foreign_offer_country.GetNameDefCap] [GetIndependenceWaveForeignOfferTerms]\n\nThe help would strengthen us, but it would also give a foreign government a say in our affairs."
chaosx.nr6.71.a: "Refuse the offer"
chaosx.nr6.71.a.tt: "We keep our freedom of action and gain §GLegitimacy§!. [?independence_wave_foreign_offer_country.GetNameDefCap] will think less of us."
chaosx.nr6.71.b: "Accept the offer"
chaosx.nr6.71.b.tt: "[GetIndependenceWaveForeignOfferAcceptTerms]"
chaosx.nr6.71.c: "Accept a smaller arrangement"
chaosx.nr6.71.c.tt: "[GetIndependenceWaveForeignOfferLimitTerms]"

independence_wave_foreign_empty: ""
independence_wave_foreign_host_clause: " from [?independence_wave_foreign_reaction_host.GetNameDef]"
independence_wave_foreign_reason_direct: "[GetIndependenceWaveForeignDirectFact]"
independence_wave_foreign_reason_relationship: "[GetIndependenceWaveForeignRelationshipFact]"
independence_wave_foreign_reason_strategic: "[GetIndependenceWaveForeignStrategicFact]"
independence_wave_foreign_reason_political: "[GetIndependenceWaveForeignPoliticalFact]"
independence_wave_foreign_secondary_relationship: " [GetIndependenceWaveForeignRelationshipFact]"
independence_wave_foreign_secondary_strategic: " [GetIndependenceWaveForeignStrategicFact]"
independence_wave_foreign_secondary_political: " [GetIndependenceWaveForeignPoliticalFact]"
independence_wave_foreign_fact_frontier: "Its new border runs along our own."
independence_wave_foreign_fact_claim: "We hold claims on land it now governs."
independence_wave_foreign_fact_guarantee: "We already guarantee its independence."
independence_wave_foreign_fact_host_ally: "Its former host is our ally and expects our support."
independence_wave_foreign_fact_alliance: "It is already allied with us."
independence_wave_foreign_fact_patron: "Our envoys already hold influence in its capital."
independence_wave_foreign_fact_network: "As members of the Independence Network, we are expected to stand with new states."
independence_wave_foreign_fact_prior_recognition: "We have already recognized its government."
independence_wave_foreign_fact_access: "Military access already links our two countries."
independence_wave_foreign_fact_balance: "We border its former host, and the partition changes the balance on our own frontier."
independence_wave_foreign_fact_region: "It belongs to our own region, and its fate is bound up with ours."
independence_wave_foreign_fact_reach: "It lies on our continent, well within reach of our interests."
independence_wave_foreign_fact_ideology: "Its government shares our political outlook."
independence_wave_foreign_note_war_burden: " Our war leaves little attention to spare."
independence_wave_foreign_note_settled: " We have already recognized and guaranteed it, so little remains to settle."

independence_wave_foreign_cost_light: "Costs $independence_wave_cost_diplomatic_light$."
independence_wave_foreign_cost_standard: "Costs $independence_wave_cost_diplomatic_standard$."
independence_wave_foreign_cost_settles_recognition: "[?independence_wave_foreign_reaction_target.GetNameDefCap] already has a recognition mission in our capital. Our answer settles it at no further cost."
independence_wave_foreign_cost_settles_guarantee: "[?independence_wave_foreign_reaction_target.GetNameDefCap] has already asked us for protection. Our answer settles that request at no further cost."
independence_wave_foreign_recognition_effect_tt: "[?independence_wave_foreign_reaction_target.GetNameDefCap] gains §GLegitimacy§! and §GRecognition§! and will think better of us. Its former host resents the recognition: hostility and pressure between the two grow, and the former host thinks less of us."
independence_wave_foreign_mediation_effect_tt: "[?independence_wave_foreign_reaction_target.GetNameDefCap] and [?independence_wave_foreign_reaction_host.GetNameDef] move toward a settled border. Claims, hostility, property and population disputes ease, the border settlement advances, and fear of reconquest falls. [?independence_wave_foreign_reaction_target.GetNameDefCap] gains §GLegitimacy§! and its §GInstability§! falls. Both governments will think better of us."
independence_wave_foreign_containment_effect_tt: "We back [?independence_wave_foreign_reaction_host.GetNameDef] without declaring war. [?independence_wave_foreign_reaction_target.GetNameDefCap] loses §RRecognition§! and its §RInstability§! rises, while hostility, pressure and fear of reconquest grow along its border. [?independence_wave_foreign_reaction_host.GetNameDefCap] will think better of us and [?independence_wave_foreign_reaction_target.GetNameDef] much worse."
independence_wave_foreign_guarantee_effect_tt: "We guarantee the independence of [?independence_wave_foreign_reaction_target.GetNameDef] and take on the duty to defend it. It gains §GLegitimacy§!, §GRecognition§! and §GSecurity§!, and its §GInstability§! falls."

independence_wave_foreign_offer_terms_arms: "offers us §Y[?constant:independence_wave_decision_cost.infantry_major|0]§! infantry equipment and §Y[?constant:independence_wave_decision_cost.support_standard|0]§! support equipment for our army. In return it expects a voice in our military affairs."
independence_wave_foreign_offer_terms_corridor: "offers to fund road and rail works across our territory. In return it expects a share of the trade those routes will carry."
independence_wave_foreign_offer_accept_arms: "If it still holds them, [?independence_wave_foreign_offer_country.GetNameDef] delivers the full shipment. We gain §GSecurity§! and §GRecognition§!, but §RLegitimacy§! falls, §RInstability§! rises, and it gains military influence over us. If it can no longer spare the full shipment, a smaller one arrives instead."
independence_wave_foreign_offer_accept_corridor: "Our capital gains §Ginfrastructure§! and we gain §GCapacity§!, but §RLegitimacy§! falls, §RInstability§! rises, and [?independence_wave_foreign_offer_country.GetNameDef] gains trade influence over us."
independence_wave_foreign_offer_limit_arms: "If it still holds them, [?independence_wave_foreign_offer_country.GetNameDef] delivers §Y[?constant:independence_wave_decision_cost.infantry_standard|0]§! infantry equipment. We gain §GSecurity§! and §GRecognition§!, and it gains a smaller measure of military influence."
independence_wave_foreign_offer_limit_corridor: "Our capital gains §Ginfrastructure§! and we gain §GCapacity§!, while [?independence_wave_foreign_offer_country.GetNameDef] gains a smaller share of trade influence."

independence_wave.history.foreign.recognition: "[?events_log_history_selected_secondary_actor.GetNameDefCap] recognized the independence of [?events_log_history_selected_actor.GetNameDef]."
independence_wave.history.foreign.guarantee: "[?events_log_history_selected_secondary_actor.GetNameDefCap] guaranteed the independence of [?events_log_history_selected_actor.GetNameDef]."
independence_wave.history.foreign.mediation: "[?events_log_history_selected_secondary_actor.GetNameDefCap] mediated border talks between [?events_log_history_selected_actor.GetNameDef] and its former host."
independence_wave.history.foreign.containment: "[?events_log_history_selected_secondary_actor.GetNameDefCap] backed the former host of [?events_log_history_selected_actor.GetNameDef] against the new state."
independence_wave.history.foreign.network_aid: "[?events_log_history_selected_secondary_actor.GetNameDefCap] sent arms and supplies to [?events_log_history_selected_actor.GetNameDef]."

independence_wave_foreign_recognition: "Recognized our independence"
independence_wave_foreign_recognized_breakaway: "Recognized a breakaway state"
independence_wave_foreign_mediation: "Mediated our border"
independence_wave_foreign_containment_pressure: "Backed our former host"
independence_wave_foreign_containment_support: "Stood with us against a breakaway state"
independence_wave_foreign_guarantee: "Guaranteed our independence"
independence_wave_foreign_solidarity: "Sent aid to our new state"
independence_wave_foreign_rivalry: "Contested our standing"
independence_wave_foreign_patron_agreement: "Sponsors our development"
independence_wave_foreign_offer_refused: "Refused our offer"

chaosx.nr6.69.t: "A Petition for Protection"
chaosx.nr6.69.d: "The Independence Wave has left [?independence_wave_remnant_petition_from.GetNameDef] with only a remnant of its former territory. Its remaining government asks [ROOT.GetNameDef] to guarantee what is left of the country. In return, it offers our forces the right to pass through its territory if we agree."
chaosx.nr6.69.a: "Decline the petition"
chaosx.nr6.69.a.tt: "We give no guarantee. [?independence_wave_remnant_petition_from.GetNameDefCap] will think less of us."
chaosx.nr6.69.b: "Guarantee [?independence_wave_remnant_petition_from.GetName]"
chaosx.nr6.69.b.tt: "Costs $independence_wave_cost_diplomatic_standard$.\nWe guarantee the independence of [?independence_wave_remnant_petition_from.GetNameDef] and take on the duty to defend it. In return it grants us military access. The guarantee does not recognize any state that broke away from it."
chaosx.nr6.70.t: "An Answer to Our Petition"
chaosx.nr6.70.d: "[GetIndependenceWaveRemnantPetitionOutcome]"
chaosx.nr6.70.a: "So be it"
independence_wave_remnant_petition_outcome_accepted: "[?independence_wave_remnant_petition_recipient.GetNameDefCap] has agreed to guarantee our independence. As we promised, its forces may now pass through our territory."
independence_wave_remnant_petition_outcome_refused: "[?independence_wave_remnant_petition_recipient.GetNameDefCap] has declined to guarantee our independence. We will have to defend what remains on our own."
independence_wave_remnant_petition_outcome_lapsed: "Our petition to [?independence_wave_remnant_petition_recipient.GetNameDef] lapsed before a guarantee could be given. No protection was promised, and our offer of passage is withdrawn."

independence_wave_remnant_petition_category: "A Foreign Guarantee"
independence_wave_remnant_petition_category_desc: "What remains of our state cannot stand alone. For a short time, we may ask one foreign government to guarantee our independence."
independence_wave_petition_foreign_guarantee: "Petition [?independence_wave_remnant_petition_candidate.GetNameDef] for a Guarantee"
independence_wave_petition_foreign_guarantee_desc: "[?independence_wave_remnant_petition_candidate.GetNameDefCap] has the strongest interest in our survival among the governments around us. We can ask it once to guarantee our independence, offering its forces passage through our territory if it agrees."
independence_wave_petition_foreign_guarantee_tt: "[?independence_wave_remnant_petition_candidate.GetNameDefCap] will decide whether to guarantee our independence. If it agrees, it gains military access through our territory. We can make this request only once."
independence_wave_petition_foreign_guarantee_recipient_tt: "[?independence_wave_remnant_petition_candidate.GetNameDefCap] can still receive our petition: it exists, is independent, is not at war with us, does not already guarantee us, and is not answering another petition."

independence_wave.history.foreign.remnant_guarantee: "[?events_log_history_selected_secondary_actor.GetNameDefCap] guaranteed the surviving territory of [?events_log_history_selected_actor.GetNameDef]."

independence_wave_remnant_petition_guarantor: "Guaranteed our surviving state"
independence_wave_remnant_petition_refused: "Declined our petition for protection"
