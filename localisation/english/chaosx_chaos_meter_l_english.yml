chaos_meter.air.source.asteroid.description: "Asteroid impacts, fragments, suspended debris, and the disasters they cause add to a separate dust load."
chaos_meter.air.source.acid_rain.description: "Acid rain adds its own contamination on top of the other sources."
chaos_meter.air.source.unknown.description: "The atmospheric source has not been classified."
chaos_meter.air.source.chemical.behavior: "The footprint falls when contamination in a state weakens or is cleared."
chaos_meter.air.source.biological.behavior: "The footprint falls when outbreak intensity declines or affected states recover."
chaos_meter.air.source.fallout.behavior: "The footprint falls as fallout intensity falls. Once Fallout takes hold, the global total stays at 99%."
chaos_meter.air.source.aerosols.behavior: "The ash load fades between disasters, so repeated fires and eruptions stay below chemical and nuclear sources."
chaos_meter.air.source.asteroid.behavior: "Dust rises after impacts and with each month of atmospheric loading. Recovery and observation lower it over time. It never turns into radioactive fallout."
chaos_meter.air.source.acid_rain.behavior: "The record of acid-rain contamination stays after the rain clears. It is counted separately from asteroid dust, smoke, chemical contamination, and Fallout."
chaos_meter.air.source.unknown.behavior: "No decay rule is available."
