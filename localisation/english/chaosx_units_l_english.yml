cbrn_gas_mask_decon_detachment: "Gas Mask and Decontamination Detachment"
cbrn_gas_mask_decon_detachment_desc: "A regimental protection detachment that fits respirators, maintains filters, and cleans exposed personnel and equipment. Its protection depends on issued mask crates, decontamination kits, and support equipment reaching the division."

cbrn_chemical_recon_detachment: "Chemical Reconnaissance Detachment"
cbrn_chemical_recon_detachment_desc: "Protected reconnaissance teams carry field detection sets ahead of the main body, identify chemical hazards, preserve samples, and warn the division before it enters a contaminated route."

cbrn_hazard_pioneer_detachment: "Hazard Pioneer Detachment"
cbrn_hazard_pioneer_detachment_desc: "Engineer specialists are trained to mark contaminated lanes, breach protected positions, and establish local wash points. Their modest fortification and urban utility rely on masks, instruments, decontamination equipment, support equipment, and trucks."

cbrn_chemical_projector_battery: "Chemical Projector Battery"
cbrn_chemical_projector_battery_desc: "A protected Livens projector battery organized for close chemical delivery. The battery carries launch equipment but no universal agent load. A prepared operation must select and draw the required payload before any release."

cbrn_chemical_ammunition_train: "Chemical Ammunition Train"
cbrn_chemical_ammunition_train_desc: "A protected transport and filling organization for moving prepared shell lots to artillery formations. It supports planned chemical fire without adding a large direct combat bonus of its own, but any release still requires a prepared operation that draws the chosen agent from the national arsenal."

cbrn_light_armored_delivery_detachment: "Light Armored Chemical Delivery Detachment"
cbrn_light_armored_delivery_detachment_desc: "A light flame-role chassis detachment fitted for protected close delivery. It cannot parachute, and chemical release still requires an authorized operation with the chosen agent available in the national arsenal."

cbrn_medium_armored_delivery_detachment: "Medium Armored Chemical Delivery Detachment"
cbrn_medium_armored_delivery_detachment_desc: "A medium flame-role chassis detachment fitted for protected close delivery. It cannot parachute, and chemical release still requires an authorized operation with the chosen agent available in the national arsenal."

cbrn_heavy_armored_delivery_detachment: "Heavy Armored Chemical Delivery Detachment"
cbrn_heavy_armored_delivery_detachment_desc: "A heavy flame-role chassis detachment fitted for protected close delivery. It cannot parachute, and chemical release still requires an authorized operation with the chosen agent available in the national arsenal."

cbrn_nerve_suppression_detachment: "Nerve Agent Suppression Detachment"
cbrn_nerve_suppression_detachment_desc: "A heavily protected occupation detachment trained for an extreme targeted suppression operation. Its presence alone releases nothing. Authorized use requires nerve-agent payload, equipment, and policy authority, and records deaths, contamination, medical saturation, resistance trauma, evidence, attribution, confirmed use, and Condemnation. Doctrine may soften only the Condemnation impact."

cbrn_field_epidemiology_detachment: "Field Epidemiology and Quarantine Detachment"
cbrn_field_epidemiology_detachment_desc: "Mobile epidemiology teams detect unusual disease patterns, establish quarantine boundaries, and coordinate samples and contact reports before an outbreak can spread along the front."

cbrn_medical_countermeasure_detachment: "Medical Countermeasure Detachment"
cbrn_medical_countermeasure_detachment_desc: "Protected field medical teams organize respiratory treatment, burn care, antidote distribution, and mass-casualty sorting. They draw on masks, support equipment, trucks, and the country's wider medical capacity."

cbrn_biosecurity_assault_detachment: "Biological Security Assault Detachment"
cbrn_biosecurity_assault_detachment_desc: "A protected assault and containment team for entering suspected biological facilities, preserving attribution evidence, and preventing a captured stockpile or laboratory from escaping control."

chaos_battalion: "Chaos Assault Battalion"
chaos_battalion_desc: "A protected special-forces battalion built for fortifications, cities, forests, jungles, and contaminated approaches. It is costly to equip and supply, performs poorly in open dry ground, mountains, river crossings, and amphibious assaults, and carries no chemical or biological payload by default. Chemical support requires a separately prepared operation that draws the chosen agent from the national arsenal."
