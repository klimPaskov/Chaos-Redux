fallout.event_log.children_of_two_settlements.detail: "[GetFalloutEvent915EventLogDetail]"
fallout.event_log.children_of_two_settlements.detail.choice_equal_public_school: "The Congo Green Basin opened one public school for the river and hill wards."
fallout.event_log.children_of_two_settlements.detail.choice_separate_institutions: "The Congo Green Basin kept separate river and hill institutions with one exchange book."
fallout.event_log.children_of_two_settlements.detail.choice_local_autonomy: "The Congo Green Basin gave each settlement a youth council and local school authority."
fallout.event_log.children_of_two_settlements.detail.choice_migration_compact: "The Congo Green Basin wrote a dated compact for children to move between the two settlements."
fallout.event_log.children_of_two_settlements.detail.equal_public_school_success: "One public school joined the river and hill wards under shared attendance, food, and medicine records."
fallout.event_log.children_of_two_settlements.detail.equal_public_school_partial: "The public school opened in the river ward while the hill storehouse kept a temporary copy."
fallout.event_log.children_of_two_settlements.detail.equal_public_school_failure: "A flooded ferry shelter lost the school ledger and turned the two wards against one another."
fallout.event_log.children_of_two_settlements.detail.separate_institutions_success: "Separate schools kept local lessons while an exchange book gave the foreign witness a common record."
fallout.event_log.children_of_two_settlements.detail.separate_institutions_partial: "Separate schools survived, but the river ward could not copy the attendance book before the ash road closed."
fallout.event_log.children_of_two_settlements.detail.separate_institutions_failure: "Separate institutions became competing claims over the children and their storehouses."
fallout.event_log.children_of_two_settlements.detail.local_autonomy_success: "Two youth councils governed local lessons and exchanged teachers under a witnessed dispute rule."
fallout.event_log.children_of_two_settlements.detail.local_autonomy_partial: "Local councils reduced travel strain while the hill ward kept its own lessons."
fallout.event_log.children_of_two_settlements.detail.local_autonomy_failure: "Local councils guarded their own stores and ended the exchange before a shared record existed."
fallout.event_log.children_of_two_settlements.detail.migration_compact_success: "A named-guardian compact moved children between the river and hill wards with matching registers."
fallout.event_log.children_of_two_settlements.detail.migration_compact_partial: "The compact survived a missed return day and demanded a stronger crossing register."
fallout.event_log.children_of_two_settlements.detail.migration_compact_failure: "A soaked movement register left two guardians claiming the same child and ended the compact."
fallout.event_log.children_of_two_settlements.detail.callback_success: "The next wet season confirmed matching attendance marks and a civic rule for the next generation."
fallout.event_log.children_of_two_settlements.detail.callback_partial: "The river and hill wards kept different copies and postponed a single charter."
fallout.event_log.children_of_two_settlements.detail.callback_failure: "A missing guardian and broken storehouse key turned school records into a border."
fallout.event_log.children_of_two_settlements.detail.cancelled: "Children of Two Settlements closed after its ward, witness, owner, or Fallout generation changed."
