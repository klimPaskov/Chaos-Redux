chaosx.fallout.1037.t: "Children of Two Settlements"
chaosx.fallout.1037.opening.d: "Four years after the river and hill wards began sharing a pump road, the first children raised between the two settlements reach the age for public instruction. The lower ward has a dry classroom beside the ferry, while the hill ward has a roofed storehouse and a teacher who can read the old route books. The Basin must decide whether the children share one school, keep separate institutions, govern their own wards, or move between settlements under a compact. Their altered society is fictional. The choice does not prove ordinary radiation biology."
chaosx.fallout.1037.a: "Open one public school"
chaosx.fallout.1037.a.tt: "Spend Food 2, Medicine 2, and Recognition 2 to teach the river and hill children under one charter. A shared school can build confidence when both wards keep the same attendance and food record."
chaosx.fallout.1037.b: "Keep separate institutions"
chaosx.fallout.1037.b.tt: "Spend Scrap 1, Power 1, and Recognition 2 to keep a river school and a hill school with separate storekeepers. Separate rooms can protect local practice, but the two records may drift apart."
chaosx.fallout.1037.c: "Give each settlement local autonomy"
chaosx.fallout.1037.c.tt: "Spend Fuel 1, Recognition 2, and Cohesion 2 to let each settlement set its own lessons and youth council. Local authority can reduce travel strain, though the foreign witness may see two futures instead of one."
chaosx.fallout.1037.d: "Write a migration compact"
chaosx.fallout.1037.d.tt: "Spend Food 1, Medicine 1, Fuel 1, and Recognition 1 to rotate children between the river and hill wards under a dated compact. The compact can widen skills, but every crossing needs a named guardian."
chaosx.fallout.1039.t: "The Basin Teaches Its Future"
chaosx.fallout.1039.equal_public_school.success.d: "The river and hill wards open one public school beside the ferry. The same lesson boards, food ledger, and medicine register travel up the road, and the first class elects two pupil stewards who can question either storekeeper."
chaosx.fallout.1039.equal_public_school.partial.d: "The public school opens in the lower ward, but cold rain closes the hill road before the hill teacher arrives. River children share the charter while the hill storehouse keeps a temporary copy of the lessons."
chaosx.fallout.1039.equal_public_school.failure.d: "The public school loses its food ledger when the ferry shelter floods. A hill guard takes the medicine register uphill, the teacher leaves, and the two wards accuse each other of keeping the children for future labor."
chaosx.fallout.1039.separate_institutions.success.d: "The river school and hill school receive separate storekeepers and one exchange book. Each ward keeps its own language and work lessons, while the foreign witness checks the shared book after every cold-rain crossing."
chaosx.fallout.1039.separate_institutions.partial.d: "Separate schools protect the hill lessons, but the river storekeeper cannot copy the attendance book before the ash road closes. The wards keep their rooms and agree to compare records after the next thaw."
chaosx.fallout.1039.separate_institutions.failure.d: "Separate institutions turn into separate claims over the children. The hill guard locks the storehouse, the river school loses its power cell, and the two records describe different ages for the same class."
chaosx.fallout.1039.local_autonomy.success.d: "The Basin grants each settlement a youth council with authority over lessons, work rotations, and shelter duty. The councils exchange one teacher each wet month, and the foreign witness records a rule for settling disputes without moving children by force."
chaosx.fallout.1039.local_autonomy.partial.d: "Local autonomy reduces travel through the cold rain, but the hill council cannot spare a teacher for the river ward. Both settlements keep their own lessons and ask the foreign witness to compare the first spring records."
chaosx.fallout.1039.local_autonomy.failure.d: "The local councils spend their first month guarding their own stores. The river ward cancels the exchange, the hill ward calls its pupils a private reserve, and the Basin loses a shared account of who can read the route books."
chaosx.fallout.1039.migration_compact.success.d: "The migration compact gives every child a named guardian for the river crossing and a return date at the hill storehouse. Children learn ferry repair and upland seed work, while both wards keep a copy of the same movement register."
chaosx.fallout.1039.migration_compact.partial.d: "The compact moves children between the two wards, but one cold-rain crossing misses its return day. The guardians recover the class before the next market, while the foreign witness demands a stronger register for future travel."
chaosx.fallout.1039.migration_compact.failure.d: "The movement register is soaked during a night crossing. Two guardians claim the same child, the hill storehouse closes its gate, and the river ward ends the compact before the Basin can establish where the class belongs."
chaosx.fallout.1039.a: "Record the Basin's school settlement"
chaosx.fallout.1039.a.tt: "Apply the graded generation result, register its branch memory, notify the foreign witness ward, and schedule a delayed review after the next wet season."
chaosx.fallout.1041.t: "The First Class Returns"
chaosx.fallout.1041.success.d: "After the next wet season, the first class returns with matching attendance marks and a shared movement register. The river and hill wards keep the chosen arrangement, and the foreign witness accepts the Basin's record as a civic rule for the next generation."
chaosx.fallout.1041.partial.d: "The delayed review finds one ward teaching from the common book while the other follows a local copy. The children can still cross the pump road, but the two councils postpone a single charter until medicine and power stores recover."
chaosx.fallout.1041.failure.d: "The delayed review finds a missing guardian, a broken storehouse key, and two records for the same class. The wards stop the exchange, the foreign witness withdraws recognition, and the next children inherit a border made from school ledgers."
chaosx.fallout.1041.a: "Close the generation record"
chaosx.fallout.1041.a.tt: "Apply the delayed generation result, record the final cause memory, release the ward and witness reservations, and close Children of Two Settlements."
