SOK_umaru_gwadabawa: "Umaru Gwadabawa"
SOK_umaru_gwadabawa_desc: "A senior frontier horseman, Gwadabawa organizes mounted columns around wells, grazing routes, and the long approaches to Sokoto. He favors decisive movement before an enemy can close the frontier."
SOK_bello_rabah: "Bello Rabah"
SOK_bello_rabah_desc: "Rabah combines caravan security with a methodical defensive staff. His patrols protect markets and livestock routes while keeping reserves ready for threats emerging from the borderlands."
