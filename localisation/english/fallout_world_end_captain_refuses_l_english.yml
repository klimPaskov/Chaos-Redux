 chaosx.fallout.520.t: "The Captain Refuses"
 chaosx.fallout.520.intro: "The winter operation was planned around a road that no longer exists. Captain Elian Varga has refused to send the remaining platoon through the ash cut until the council states who will carry the wounded, who can withdraw, and who answers for a failed order. The quartermaster reports enough fuel for one attempt, while the field radio carries only fragments from the exposed state of [This.GetName]."
 chaosx.fallout.520.a: "Make the mission a negotiated duty"
 chaosx.fallout.520.a.tt: "Spend Food, Fuel, and Recognition to give the captain a written mandate with a civilian liaison. The delayed operation report will measure whether the compromise preserved the route and the platoon."
 chaosx.fallout.520.b: "Replace the captain before departure"
 chaosx.fallout.520.b.tt: "Spend Scrap and Equipment to appoint another field commander from the surviving roster. The delayed report will test whether the replacement can restore attack strength without breaking organization."
 chaosx.fallout.520.c: "Arrest the captain and force the march"
 chaosx.fallout.520.c.tt: "Spend Fuel and Equipment to place the operation under military custody. The order can restore momentum, but a failed march will damage morale, supply, and lives through the Deaths system."
 chaosx.fallout.520.d: "Grant the field command autonomy"
 chaosx.fallout.520.d.tt: "Spend Food and Scrap to let the captain set a local route and withdrawal rule. The choice protects the exposed state from a rigid order, while the callback will test whether the autonomy stayed accountable."
 chaosx.fallout.522.t: "The Command Fracture Report"
 chaosx.fallout.522.compromise_mission.success.d: "The civilian liaison reaches the ash cut with a revised route and a signed casualty rule. Captain Varga sends the platoon around the collapsed bridge, brings the medical sleds home, and keeps the winter road open for one more convoy. The mission is no longer a private refusal, though the state has paid for the agreement."
 chaosx.fallout.522.compromise_mission.partial.d: "The revised route saves the medical sleds but abandons two supply pallets in the snow. Captain Varga accepts the mandate only after the platoon marks a second withdrawal line. The road remains usable, yet every future order will carry the memory of this negotiation."
 chaosx.fallout.522.compromise_mission.failure.d: "The liaison reaches the cut after the platoon has already scattered. Fuel is lost in the ash, the field depot is damaged, and families in [This.GetName] wait for soldiers who will not return. The command fracture enters the Deaths ledger and the winter road loses its protection."
 chaosx.fallout.522.replace_captain.success.d: "The replacement officer reads the route book before the first engine starts. The platoon crosses the exposed ridge in disciplined stages, recovers the radio crew, and returns with enough equipment to keep the next operation supplied. The state has recorded a replacement instead of pretending that loyalty was restored."
 chaosx.fallout.522.replace_captain.partial.d: "The replacement officer reaches the ridge but cannot keep the old platoon together. One section returns with the radio crew, while another abandons equipment in the frost. The operation survives, though organization and trust will need a second review."
 chaosx.fallout.522.replace_captain.failure.d: "The replacement order arrives without a map that the new officer can read. The platoon turns back under fire, a military workshop is damaged, and the state spends more equipment than it can replace. The Deaths ledger records the cost of changing command in the middle of winter."
 chaosx.fallout.522.arrest_captain.success.d: "The military custody order is carried out before the column leaves. A staff officer takes the route, keeps the engines moving, and returns the wounded under guard. The operation succeeds, but the state has made obedience a visible weapon and the captain's refusal remains in public memory."
 chaosx.fallout.522.arrest_captain.partial.d: "The arrest restores movement for one night, then the lead truck breaks through a frost shelf. The column reaches the radio post with damaged equipment and a divided escort. The order held, but the military command now pays for every quiet objection."
 chaosx.fallout.522.arrest_captain.failure.d: "The forced march enters the ash cut before the route is checked. A vehicle burns beside the field depot, soldiers are lost in the retreat, and the captain's arrest leaves no one trusted to explain the order. The Deaths ledger records a command decision that became a military disaster."
 chaosx.fallout.522.grant_field_autonomy.success.d: "Captain Varga chooses a riverbank path that the central map marked as impassable. The platoon escorts the wounded through a sheltered cut, leaves a beacon for the next convoy, and reports every ration used. Field autonomy has protected the operation without erasing the council's authority."
 chaosx.fallout.522.grant_field_autonomy.partial.d: "The captain's local route avoids the worst ash but consumes the reserve food before the radio post is reached. The platoon returns with its wounded and a written list of supplies it could not carry. Autonomy kept the column alive, while the council now needs a firmer accounting rule."
 chaosx.fallout.522.grant_field_autonomy.failure.d: "The autonomous column leaves the marked road and loses contact with the field depot. The winter state suffers a damaged supply line, the platoon returns without its radio crew, and families in [This.GetName] absorb the casualties through the Deaths system. The refusal has become a command memory without becoming a safe policy."
 chaosx.fallout.522.a: "File the command report and await the review"
 chaosx.fallout.522.a.tt: "Resolve the delayed operation report, apply its military and Air Winter effects, and schedule the command review callback."
 chaosx.fallout.524.t: "The Command Review"
 chaosx.fallout.524.success.d: "The review board finds the route book, casualty rule, and fuel ledger in agreement. Captain Varga's refusal is no longer an open order, and the field command can close its first winter review with a usable chain of responsibility."
 chaosx.fallout.524.partial.d: "The review board finds a working command with one missing signature and two disputed fuel entries. The route remains open under a second officer, but the state keeps the command memory active until the next winter operation."
 chaosx.fallout.524.failure.d: "The review board finds that the order, the route book, and the casualty ledger describe three different marches. The field depot is damaged again, the remaining platoon loses people in the confusion, and the command memory closes as a warning against another unrecorded order."
 chaosx.fallout.524.a: "Close the command review"
 chaosx.fallout.524.a.tt: "Resolve the delayed callback, record the command memory, and release both scheduler receipts."
 fallout.event_log.captain_refuses.name: "The Captain Refuses"
 fallout.event_log.captain_refuses.detail: "[GetFalloutEvent520EventLogDetail]"
 fallout.event_log.captain_refuses.compromise_mission_success: "A negotiated winter mission preserved the route and its casualty rule."
 fallout.event_log.captain_refuses.compromise_mission_partial: "A negotiated winter mission saved the wounded but left the route contested."
 fallout.event_log.captain_refuses.compromise_mission_failure: "A failed negotiation scattered the winter platoon and caused deaths."
 fallout.event_log.captain_refuses.replace_captain_success: "A replacement officer restored the operation and recorded the command change."
 fallout.event_log.captain_refuses.replace_captain_partial: "A replacement officer reached the ridge while organization weakened."
 fallout.event_log.captain_refuses.replace_captain_failure: "A replacement order failed in the exposed state and caused deaths."
 fallout.event_log.captain_refuses.arrest_captain_success: "Military custody forced the march and kept the wounded moving."
 fallout.event_log.captain_refuses.arrest_captain_partial: "A forced march reached the radio post with divided command."
 fallout.event_log.captain_refuses.arrest_captain_failure: "A forced march became a winter disaster and caused deaths."
 fallout.event_log.captain_refuses.grant_field_autonomy_success: "Field autonomy protected the operation under a written withdrawal rule."
 fallout.event_log.captain_refuses.grant_field_autonomy_partial: "Field autonomy saved the column while the reserve ledger failed."
 fallout.event_log.captain_refuses.grant_field_autonomy_failure: "An autonomous route lost the depot and caused deaths."
 fallout.event_log.captain_refuses.callback_success: "The command review confirmed a usable chain of responsibility."
 fallout.event_log.captain_refuses.callback_partial: "The command review left one route ledger disputed."
 fallout.event_log.captain_refuses.callback_failure: "The command review found conflicting orders and further deaths."
