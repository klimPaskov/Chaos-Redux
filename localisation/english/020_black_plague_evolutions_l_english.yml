l_english:
black_plague.evolution.type: "The Plague Changes"
black_plague.evolution.stage_1.title: "The Strain Grows Stronger"
black_plague.evolution.stage_1.body: "The plague has learned to thrive in crowded and poorly protected places. Deaths rise faster, and every untreated corridor helps the next wave spread."
black_plague.evolution.stage_1.prefire.title: "A Hardier Strain"
black_plague.evolution.stage_1.prefire.body: "Doctors are watching signs that the plague may be changing. For now, the feared strain has not taken hold."
black_plague.evolution.stage_2.title: "The Plague Crosses the Sea"
black_plague.evolution.stage_2.body: "Ports and long-distance transport carry the plague beyond its mainland cradle. Docks, troop convoys, refugees, and wartime shipping can open a second front across the sea."
black_plague.evolution.stage_2.prefire.title: "Sickness at the Docks"
black_plague.evolution.stage_2.prefire.body: "Port doctors are watching incoming ships and crowded quays. The plague has not yet secured a route across the sea."
black_plague.evolution.stage_3.title: "The Warrens Raise Flags"
black_plague.evolution.stage_3.body: "Collapsed plague basins have joined one Rat Nation. Its broods seize infected ground and build armies without human soldiers or ordinary equipment."
black_plague.evolution.stage_3.prefire.title: "Restless Warrens"
black_plague.evolution.stage_3.prefire.body: "The rats in collapsed basins are gathering into larger broods. None has raised a flag or claimed a country yet."
black_plague.evolution.stage_4.title: "The Rat King Wakes"
black_plague.evolution.stage_4.body: "A royal basin has learned to obey one sentient ruler. The Rat King gathers memory, hunger, and authority as the surviving broods decide whether to kneel."
black_plague.evolution.stage_4.prefire.title: "The Crown Lies Empty"
black_plague.evolution.stage_4.prefire.body: "Independent broods are growing, but no Rat King has awakened to command them."
black_plague.evolution.stage_5.title: "The Kingdom of Teeth"
black_plague.evolution.stage_5.body: "The Rat King's dominion has grown beyond the warrens. Capitals fall silent, refuges are overrun, and the last continental cordons begin to break."
black_plague.evolution.stage_5.prefire.title: "A Kingdom Not Yet Won"
black_plague.evolution.stage_5.prefire.body: "The Rat King dreams of ruling the surface, but the surviving countries and refuges still stand in the way."
black_plague.event_details.description: "A black-marked fever has broken out on the mainland. It moves through roads, ports, hungry cities, and rat-filled ruins, leaving governments to choose which places to isolate and which people they can still save.\n\nIf the plague is allowed to settle in, the rats may become something more dangerous than carriers. Whole warrens can learn to fight, govern, and follow a king of their own."
