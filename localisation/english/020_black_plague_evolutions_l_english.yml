l_english:
black_plague.evolution.type: "Black Plague Evolution"
black_plague.evolution.stage_1.title: "Evolution I — The Strengthened Strain"
black_plague.evolution.stage_1.body: "The strain has adapted to crowded, underprotected ground. Deaths accelerate where treatment and countermeasures fall behind, and every untreated corridor becomes a stronger source for the next pulse."
black_plague.evolution.stage_1.prefire.title: "Evolution I — A Strengthened Strain in the Ledger"
black_plague.evolution.stage_1.prefire.body: "The first evolutionary threshold is visible but not active. The strain remains ordinary until its pressure, deaths, or failed containment make this change real."
black_plague.evolution.stage_2.title: "Evolution II — Overseas Vectors"
black_plague.evolution.stage_2.body: "Ports and long-range transport now carry the plague beyond its mainland cradle. Docks, troop convoys, refugees, and wartime shipping can open a second front across the sea."
black_plague.evolution.stage_2.prefire.title: "Evolution II — Overseas Vectors on the Horizon"
black_plague.evolution.stage_2.prefire.body: "The overseas threshold is being watched. Ports and long-range transport remain ordinary routes until the strain earns this second evolution."
black_plague.evolution.stage_3.title: "Evolution III — Rat Nations"
black_plague.evolution.stage_3.body: "Uncontrolled basins have become political organisms. Finite Rat Nations raise capped broods without human manpower or ordinary equipment, occupy infected ground, and contest adjacent warren territories."
black_plague.evolution.stage_3.prefire.title: "Evolution III — Rat Nations Not Yet Born"
black_plague.evolution.stage_3.prefire.body: "Collapsed basins are approaching the rat-emergence threshold. No Rat Nation exists until the evolution fires and claims an uncontrolled basin."
black_plague.evolution.stage_4.title: "Evolution IV — The Sentient Rat King"
black_plague.evolution.stage_4.body: "A separate royal basin has learned to command. The Rat King gathers dominion, sentience, cohesion, and hunger through royal choices while the surviving broods retain a grace period of independent life."
black_plague.evolution.stage_4.prefire.title: "Evolution IV — The Crown Still Silent"
black_plague.evolution.stage_4.prefire.body: "Independent broods may be forming, but a sentient Rat King has not yet awakened. The royal basin remains a future threshold, not an active government."
black_plague.evolution.stage_5.title: "Evolution V — The Earned Dominion"
black_plague.evolution.stage_5.body: "Only catastrophic deaths, Chaos above 1000, a completed royal route, sufficient conquest, designated capitals and refuge nodes, and ninety percent control of one eligible continent can open the deterministic takeover."
black_plague.evolution.stage_5.prefire.title: "Evolution V — The Earned Dominion Is Locked"
black_plague.evolution.stage_5.prefire.body: "The terminal route is visible as a locked possibility. It cannot activate until the Rat King, conquest, catastrophic deaths, royal route, capitals, refuge nodes, and continental control all meet their final gates."
