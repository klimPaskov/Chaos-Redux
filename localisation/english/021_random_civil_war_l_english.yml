chaosx.nr21.2.t: "The Lines Break"
chaosx.nr21.2.d: "Ministers in [ROOT.Capital.GetName] can no longer command the whole country. Regional commands, political committees, and depot guards are choosing which authority they will obey.\n\n$event021_authority_report_line$"
chaosx.nr21.2.a: "Issue the order"
event021_posture_firm: "Hold firm and enforce every order"
event021_posture_firm_tt: "Loyal units and military courts enforce the government's orders. State Authority rises by §G[?constant:event021_opening_posture.firm_authority_gain|0]§!. Later loyalty reviews are carried out as arrests."
event021_posture_constitutional: "Appeal to the constitution and keep talks open"
event021_posture_constitutional_tt: "The government speaks through the courts and the assembly and leaves a way back for those who stop fighting. Internal division eases, and later loyalty reviews favour reintegration."
event021_posture_containment: "Contain the rising and secure what we hold"
event021_posture_containment_tt: "Reserves are held back to protect the capital, the depots, and the rail lines still under control. Later loyalty reviews favour reintegration."
chaosx.nr21.3.t: "A Wider Fracture"
chaosx.nr21.3.d: "A second authority has formed around a connected region, military district, or independence homeland. Its leaders are assembling forces and issuing demands of their own.\n\n$event021_authority_report_line$"
chaosx.nr21.3.a: "Prepare for more than one front"
chaosx.nr21.4.t: "Across the Border"
chaosx.nr21.4.d: "Weapons and organizers cross the frontier, and displaced families crowd roads into neighboring countries. Local authorities struggle to keep the crossings open as foreign sponsors and mediators seek influence over the routes."
chaosx.nr21.4.a: "Keep the crossings under watch"
chaosx.nr21.5.t: "The Terms of Peace"
chaosx.nr21.5.d: "A settlement can stop the guns, but its obligations will decide whether the next crisis is avoided or merely delayed."
chaosx.nr21.5.a: "Sign the terms"
chaosx.nr21.5.a.tt: "The fighting stops at once. Rival claimants rejoin the state under a coalition, regional autonomy, or a negotiated merger. If the government lacks the authority to reunite the country and the rival regions can stand on their own, they become separate states instead. An independence front is recognized. Reconstruction and the settlement's obligations follow."
chaosx.nr21.6.t: "The Fracture Cascade"
chaosx.nr21.6.d: "Internal wars are spreading through countries already weakened by divided commands, contested capitals, and broken supply routes. Strong institutions can contain the strain, while failing governments may fracture without immediate action."
chaosx.nr21.6.a: "Continue the campaign"
chaosx.nr21.7.t: "A Civil War Begins"
chaosx.nr21.7.d: "Army units and regional offices are receiving orders from rival commands. Opposition leaders have seized depots and provincial garrisons, and the central government is losing control of the chain of command.\n\n$event021_authority_report_line$"
chaosx.nr21.7.a: "Take command"
chaosx.nr21.8.t: "An Independence Front"
chaosx.nr21.8.d: "An established independence movement has secured a defensible homeland inside the crisis. Its leaders retain their own institutions and national ambitions as they fight to separate from the former host.\n\n$event021_authority_report_line$"
chaosx.nr21.8.a: "Recognize the front"
chaosx.nr21.9.t: "The Fighting Stops"
chaosx.nr21.9.d: "A settlement has ended the fighting. Every signatory is now bound by [event021_GetSettlementObligationName], and the coming months will show whether the terms are honoured. Administrators are starting to take back the work of emergency councils and military decrees.\n\n$event021_authority_report_line$"
chaosx.nr21.9.a: "Begin reconstruction"
chaosx.nr21.9.d_victory: "The last organized resistance has broken, and government troops hold the country again. Prisoners fill barracks and stadiums, officials who served the rebels wait to learn their fate, and every region is watching how the victors will rule. The settlement still binds the government to [event021_GetSettlementObligationName], and reconstruction is about to begin.\n\n$event021_authority_report_line$"
chaosx.nr21.9.amnesty: "Offer amnesty to the rank and file"
chaosx.nr21.9.amnesty.tt: "Rebel soldiers who lay down their arms go home, and their regions return to ordinary administration. State Authority rises by §G[?constant:event021_postwar_direction.amnesty_authority_gain|0]§!, internal division eases, and §YAmnesty Commissions§! is in force until the settlement's obligation is resolved."
chaosx.nr21.9.reform: "Try the leaders and reform the ministries"
chaosx.nr21.9.reform.tt: "Tribunals try the leaders of the rising and the ministries that failed are rebuilt. State Authority rises by §G[?constant:event021_postwar_direction.reform_authority_gain|0]§!, and §YReform Tribunals§! is in force until the settlement's obligation is resolved."
chaosx.nr21.9.harsh: "Impose a security settlement"
chaosx.nr21.9.harsh.tt: "Garrisons, checkpoints, and detention camps hold the former rebel regions down. State Authority rises by §G[?constant:event021_postwar_direction.harsh_authority_gain|0]§! and internal division eases for now, and §YSecurity Regime§! is in force until the settlement's obligation is resolved. The harsh peace leaves lasting grievances, and renewed civil war becomes much more likely."
chaosx.nr21.9.emergency: "Keep the emergency decrees in force"
chaosx.nr21.9.emergency.tt: "The wartime decrees stay in force and the army keeps its emergency powers. State Authority rises by §G[?constant:event021_postwar_direction.emergency_authority_gain|0]§!, and §YContinued Emergency Rule§! is in force until the settlement's obligation is resolved. The harsh peace leaves lasting grievances, and renewed civil war becomes much more likely."
chaosx.nr21.9.a.tt: "Reconstruction begins, restoring some State Authority and easing the pressure for renewed war. The terms are confirmed only if [event021_GetSettlementObligationName] is met and the peace holds until the agreed date. A breach puts the settlement at risk."
chaosx.nr21.21.t: "Strange Reports from [event021_GetStrangeIncidentRegion]"
chaosx.nr21.21.d: "[event021_GetStrangeIncidentReport]"
chaosx.nr21.21.a: "Leave the practice alone"
chaosx.nr21.21.a.tt: "[event021_GetStrangeIncidentTolerateOutcome]"
event021_strange_incident_tolerate_government: "The practice and Unease in the Ranks run their course. Those who took part will expect a place of their own after the war, and renewed civil war becomes more likely once the fighting ends."
event021_strange_incident_tolerate_claimant: "The practice and Unease in the Ranks run their course. Those who took part will expect a place of their own, and if your side takes power, renewed civil war becomes more likely once the fighting ends."
event021_strange_incident_tolerate_independence: "The practice and Unease in the Ranks run their course, and those who took part will expect a place of their own once the fighting ends."
chaosx.nr21.21.b: "Investigate the organizers"
chaosx.nr21.21.b.tt: "Investigators break up the gatherings and question their leaders. The practice ends at once, Unease in the Ranks remains until it fades, and State Authority rises by §G[?constant:event021_strange_incident.investigate_authority_gain|0]§!."
chaosx.nr21.21.c: "Rotate the affected units"
chaosx.nr21.21.c.tt: "The affected units are relieved, rested, and spread among other formations. The practice and Unease in the Ranks both end at once."
event021_strange_incident_region_fallback: "the forward positions"
event021_strange_incident_night_assemblies: "Patrols around [event021_GetStrangeIncidentRegion] report that whole companies leave their positions after dark and gather in the ruins of an old chapel and a burned mill. Nobody who has followed them can say what is said there. The men return before dawn in silence and keep their posts without being told, and not one sentry has gone missing since. Their officers complain that orders now reach the ranks only after someone else has repeated them, and two lieutenants have asked to be transferred."
event021_strange_incident_oath_circles: "A battalion holding the line near [event021_GetStrangeIncidentRegion] has taken an oath that its soldiers will not repeat to outsiders. Each evening they stand in a ring and speak the same words until the light is gone. Since then they have refused every order to fall back and have held a river crossing against attacks that broke the units beside them. Replacements sent to them are turned away at the trench line, and their casualty lists grow longer every week."
event021_strange_incident_signal_fires: "Fires are lit on the hills around [event021_GetStrangeIncidentRegion] in the same pattern every few nights, and a mark of three crossed lines has appeared on walls, carts, and road signs along the supply route. Within a day of each new mark the local formations move together without any order that headquarters can trace. Villagers have started to leave the road, and foreign correspondents are asking who sends the signals."
event021_strange_incident_endurance_rumours: "Soldiers from other units swear that one formation near [event021_GetStrangeIncidentRegion] marches through the night, eats little, and never seems to tire. Doctors who examined a few of its men found them thin and hollow-eyed and unwilling to rest. The story has travelled the whole front, and enemy pickets now give the formation a wide berth. Its medical officers have asked for help they will not describe in writing."
event021_strange_incident_relic_processions: "A procession has been carrying an old banner and a sealed wooden case from village to village around [event021_GetStrangeIncidentRegion]. Crowds follow it, young men enlist wherever it stops, and the movement's speakers call it proof that their cause is older than the state. Other communities in the region refuse to let it pass, and the procession now travels under armed guard."
chaosx.nr21.22.t: "The Peace Is Judged"
chaosx.nr21.22.d_held: "The date set by the settlement has passed, and [event021_GetSettlementObligationName] has been honoured. Emergency councils are handing their powers back to the ministries, demobilized soldiers are going home, and the regions that fought the government are governed under the agreed terms. The settlement stands."
chaosx.nr21.22.d_breached: "Reconstruction is over, and [event021_GetSettlementObligationName] was broken. Former fighters still keep their weapons, the promises made at the table are mocked openly in the regions that rose, and the grievances behind the war remain unanswered. The emergency councils are being dissolved on schedule, and the peace they leave behind is fragile."
chaosx.nr21.22.a: "Return to ordinary government"
event021_settlement_verdict_tt: "[event021_GetSettlementVerdictConsequence]"
event021_settlement_verdict_held: "The settlement is confirmed, and no broken terms add to the risk of renewed civil war."
event021_settlement_verdict_upheld: "The settlement is confirmed. Holding to its terms to the end makes renewed civil war less likely."
event021_settlement_verdict_breached: "The breach is remembered, and renewed civil war becomes more likely."

news_event_021_multi_front_war.t: "A Civil War Opens on Several Fronts"
news_event_021_multi_front_war.d: "Connected regions, military commands, and political authorities are contesting one country at once. The outcome will depend on supply, administration, and the terms offered to those who still have a road back."
news_event_021_multi_front_war.a: "Watch the fronts"
news_event_021_global_fracture.t: "The Age of Global Fracture"
news_event_021_global_fracture.d: "Internal crises are no longer isolated. Governments are guarding capitals, railways, barracks, and provincial assemblies as rival movements test whether public authority can still hold."
news_event_021_global_fracture.a: "The world watches"

