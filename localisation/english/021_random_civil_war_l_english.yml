chaosx.nr21.2.t: "The Lines Break"
chaosx.nr21.2.d: "Ministers in [ROOT.Capital.GetName] can no longer command the whole country. Regional commands, political committees, and depot guards are choosing which authority they will obey."
chaosx.nr21.2.a: "Issue the order"
chaosx.nr21.3.t: "A Wider Fracture"
chaosx.nr21.3.d: "A second authority has formed around a connected region, military district, or independence homeland. Its leaders are assembling forces and issuing demands of their own."
chaosx.nr21.3.a: "Prepare for more than one front"
chaosx.nr21.4.t: "Across the Border"
chaosx.nr21.4.d: "The conflict is now visible beyond the original frontier. Sponsors, relief workers, returning cadres, and frightened administrations are changing the region's choices."
chaosx.nr21.4.a: "Keep the crossings under watch"
chaosx.nr21.5.t: "The Terms of Peace"
chaosx.nr21.5.d: "A settlement can stop the guns, but its obligations will decide whether the next crisis is avoided or merely delayed."
chaosx.nr21.5.a: "Sign the terms"
chaosx.nr21.6.t: "The Fracture Cascade"
chaosx.nr21.6.d: "Internal wars are spreading through countries already weakened by divided commands, contested capitals, and broken supply routes. Strong institutions can contain the strain, while failing governments may fracture without immediate action."
chaosx.nr21.6.a: "Continue the campaign"
chaosx.nr21.7.t: "A Civil War Begins"
chaosx.nr21.7.d: "A government, an organized opposition, and the local state apparatus are now contesting the same national future."
chaosx.nr21.7.a: "Take command"
chaosx.nr21.8.t: "An Independence Front"
chaosx.nr21.8.d: "An established independence movement has secured a defensible homeland inside the crisis. Its leaders retain their own institutions and national ambitions as they fight to separate from the former host."
chaosx.nr21.8.a: "Recognize the front"
chaosx.nr21.9.t: "A Settlement Holds"
chaosx.nr21.9.d: "The signatories have kept the first obligations of the settlement. Administration and disarmament are beginning to replace emergency rule."
chaosx.nr21.9.a: "Begin reconstruction"
chaosx.nr21.10.t: "The Fracture Fades"
chaosx.nr21.10.d: "The last emergency obligations have been met. The state remains marked by the war, but ordinary institutions no longer depend on emergency councils and military decrees."
chaosx.nr21.10.a: "Return to ordinary government"

news_event_021_multi_front_war.t: "A Civil War Opens on Several Fronts"
news_event_021_multi_front_war.d: "Connected regions, military commands, and political authorities are contesting one country at once. The outcome will depend on supply, administration, and the terms offered to those who still have a road back."
news_event_021_multi_front_war.a: "Watch the fronts"
news_event_021_global_fracture.t: "The Age of Global Fracture"
news_event_021_global_fracture.d: "Internal crises are no longer isolated. Governments are guarding capitals, railways, barracks, and provincial assemblies as rival movements test whether public authority can still hold."
news_event_021_global_fracture.a: "The world watches"

