event021_secure_rail_spine_mission: "Secure the Rail Spine"
event021_secure_rail_spine_mission_desc: "Hold [event021_GetRailMissionStateName] for [?constant:event021_mission_tuning.secure_rail_days|0] days. Success restores infrastructure, recovers trains, and strengthens State Authority; failure deepens internal division."
event021_secure_rail_requirement_tt: "[event021_GetRailMissionStateName] must remain an owned and controlled opening-front state with a supply node or usable infrastructure."
event021_hold_settlement_terms_mission: "Hold the Settlement Terms"
event021_hold_settlement_terms_mission_desc: "Fulfil [event021_GetSettlementObligationName] and prevent renewed conflict for [?constant:event021_mission_tuning.settlement_terms_days|0] days. Success confirms the settlement; failure records a breach and preserves recurrence pressure."
event021_settlement_terms_requirement_tt: "A live settlement obligation and its recorded deadline are required."
