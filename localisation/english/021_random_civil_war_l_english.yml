l_english:
chaosx.nr21.1.t: "The Lines Break"
chaosx.nr21.1.d: "Orders no longer travel cleanly from the capital. Garrisons, officials, and regional commanders are choosing which authority they will obey. The country still has a chance to hold together, but the next decisions will decide whether this becomes a contained crisis or a war."
chaosx.nr21.1.a: "Hold the state together"
chaosx.nr21.1.no_target: "[event021_GetEntryFailureReason]"
chaosx.nr21.1.skip: "The fracture plan was abandoned because no safe actor, capital, remnant, or front remained."
chaosx.nr21.17.t: "No Fracture to Field"

event021_civil_war_crisis_category: "Civil War Crisis"
event021_civil_war_crisis_category_desc: "[event021_GetCategoryStatus]"
event021_category_status_crisis: "Phase: §Y[event021_GetCrisisPhase]§!\nState Authority: §Y[event021_GetAuthorityValue]§! ([event021_GetAuthorityBand]). [event021_GetAuthorityGuidance]\n[event021_GetCrisisSummary] Current focus: [event021_GetCrisisTargetName]."
event021_category_status_exposure: "Phase: §Y[event021_GetCrisisPhase]§! · Exposure: [event021_GetExposureStage]\n[event021_GetCrisisSummary] Source: §Y[event021_GetExposureSourceName]§!."
event021_category_status_prevention: "Fracture risk: §Y[event021_GetFractureBand]§!\n[event021_GetFractureBandSummary]"
event021_fracture_band_stable: "Stable"
event021_fracture_band_exposed: "Exposed"
event021_fracture_band_fractured: "Fractured"
event021_fracture_band_critical: "Critical"
event021_fracture_summary_stable: "Ministries, garrisons, and provincial offices still answer to the capital, and the strains on the country remain local."
event021_fracture_summary_exposed: "Grievances, nearby wars, and doubtful commands are testing the state. Protecting communications and reviewing loyalty keeps them from organizing."
event021_fracture_summary_fractured: "Rival networks are organizing inside the army and the provinces, and an armed rupture is now possible."
event021_fracture_summary_critical: "The country is in a state of emergency: barracks, ministries, and provincial halls are choosing sides, and open civil war can break out within weeks."
event021_state_authority: "State Authority"
event021_authority_value_present: "[?random_civil_war_state_authority|0]"
event021_authority_cohesive: "Cohesive"
event021_authority_contested: "Contested"
event021_authority_failing: "Failing"
event021_authority_collapse: "Collapse"
event021_authority_guidance_cohesive: "Next threshold: Contested at [?constant:random_civil_war_authority.contested_maximum|0] or below. Protect the capital, supply, and command routes."
event021_authority_guidance_contested: "Next threshold: Failing at [?constant:random_civil_war_authority.failing_maximum|0] or below. Hold the capital, review loyalty, or restore the rail spine."
event021_authority_guidance_failing: "Next threshold: Collapse at [?constant:random_civil_war_authority.collapse_maximum|0] or below. Spend resources on the capital, supply, or settlement before control breaks."
event021_authority_guidance_collapse: "Authority has reached Collapse. Recover a viable capital or enforce settlement terms to restore control."
event021_authority_guidance_na: "No authority guidance is available."
event021_authority_report_line: "State Authority stands at §Y[?random_civil_war_state_authority|0]§! ([event021_GetAuthorityBand])."
event021_phase_opening: "Opening scramble"
event021_phase_active: "Active war"
event021_phase_multi_front: "Multi-front war"
event021_phase_exposure: "Regional exposure"
event021_phase_settlement: "Settlement"
event021_phase_reconstruction: "Reconstruction"
event021_phase_prevention: "Fracture prevention"
event021_summary_capital: "The capital and the nearest rail spine determine whether orders can still be enforced."
event021_summary_supply: "Supply and depot access are the immediate limits on every front."
event021_summary_politics: "A rival political center is turning discontent into organized opposition."
event021_summary_command: "Command loyalty is uncertain and the arsenals are not secure."
event021_summary_neighbor: "A nearby war is disrupting border communities with weapons traffic, returning cadres, and displaced civilians who need shelter."
event021_summary_settlement: "The fighting has stopped, and the terms will hold only if their obligations are met."
event021_summary_stable: "The country is exposed to fracture, but functioning institutions still have room to act."
event021_summary_reconstruction: "The fighting is over. Railways, ministries, and demobilized soldiers decide how quickly ordinary government returns."
event021_summary_authority: "Whole regions ignore orders from the capital, and every lost state weakens the government further."
event021_summary_war: "The fronts are still moving, and every state, depot, and rail line changes hands at a cost."
event021_target_na: "N/A"
event021_focus_none: "No immediate focus"
event021_priority_front_none: "no active front"
event021_priority_front_candidate_fallback: "a state still held on your current front"
event021_exposure_source_named: "[?random_civil_war_exposure_source_country_scope.GetName]"
event021_exposure_source_fallback: "the neighboring civil war"
event021_support_target_government_against: "the government fighting [?random_civil_war_exposure_source_country_scope.GetName]"
event021_support_target_government_fallback: "the recognized government in the neighboring civil war"
event021_support_target_opposition_against: "the claimants fighting [?random_civil_war_exposure_source_country_scope.GetName]"
event021_support_target_opposition_fallback: "the claimant authority in the neighboring civil war"
event021_rail_mission_target_none: "the assigned rail corridor"

event021_secure_arsenals: "Secure the Arsenals"
event021_secure_arsenals_desc: "Protect the depots and deny uncontrolled formations access to the national stockpile."
event021_secure_arsenals_tt: "Secure the main arsenals, steady the command chain, and raise State Authority. If §YFractured Command§! has no end date, it ends in §Y[?constant:event021_action_tuning.arsenal_idea_days|0]§! days."
event021_secure_arsenals_cost_text: "§Y[?constant:event021_action_cost.secure_arsenals_command_power_gate|0]§! £command_power · §Y[?constant:event021_action_cost.secure_arsenals_infantry_gate|0]§! £infantry_equipment_text_icon · §Y[?constant:event021_action_cost.secure_arsenals_trains_gate|0]§! £GFX_train_texticon"
event021_secure_arsenals_cost_text_blocked: "£command_power §R[?constant:event021_action_cost.secure_arsenals_command_power_gate|0]§!  £infantry_equipment_text_icon §R[?constant:event021_action_cost.secure_arsenals_infantry_gate|0]§!  £GFX_train_texticon §R[?constant:event021_action_cost.secure_arsenals_trains_gate|0]§!"
event021_secure_arsenals_cost_text_tooltip: "Command capacity, rifles, and trains secure the arsenals."
event021_defend_capital: "Defend the Capital"
event021_defend_capital_desc: "Commit a measured reserve to the capital without stripping the fronts that keep the remnant supplied."
event021_defend_capital_tt: "Commit a capital reserve, raise State Authority, and protect the current capital."
event021_defend_capital_cost_text: "§Y[?constant:event021_action_cost.capital_command_power_gate|0]§! £command_power · §Y[?constant:event021_action_cost.capital_infantry_gate|0]§! £infantry_equipment_text_icon · §Y[?constant:event021_action_cost.capital_manpower_gate|0]§! £manpower_texticon"
event021_defend_capital_cost_text_blocked: "£command_power §R[?constant:event021_action_cost.capital_command_power_gate|0]§!  £infantry_equipment_text_icon §R[?constant:event021_action_cost.capital_infantry_gate|0]§!  £manpower_texticon §R[?constant:event021_action_cost.capital_manpower_gate|0]§!"
event021_defend_capital_cost_text_tooltip: "Command capacity, rifles, and manpower hold the capital."
event021_review_loyalty: "Review Command Loyalty"
event021_review_loyalty_desc: "Audit officers and regional staffs, offering integration where possible and isolating proven defectors."
event021_review_loyalty_tt: "Review the command structure. [event021_GetLoyaltyReviewOutcome]"
event021_review_loyalty_outcome_careful: "Careful reintegration steadies the officer corps, raises State Authority, and eases internal division. §YFractured Command§! ends in §Y[?constant:event021_action_tuning.loyalty_idea_days|0]§! days if it has no end date, or §Y[?constant:event021_action_tuning.loyalty_shorten_days|0]§! days sooner if it already has one."
event021_review_loyalty_outcome_steady: "Careful reintegration steadies the officer corps, raises State Authority, and eases internal division."
event021_review_loyalty_outcome_hardliner: "Indiscriminate arrests deepen resentment, lower State Authority, and worsen internal division. A timed §YFractured Command§! lasts §Y[?constant:event021_action_tuning.loyalty_extend_days|0]§! days longer, and an ended one returns for §Y[?constant:event021_action_tuning.loyalty_idea_days|0]§! days."
event021_review_loyalty_cost_text: "§Y[?constant:event021_action_cost.loyalty_command_power_gate|0]§! £command_power · §Y[?constant:event021_action_cost.loyalty_army_xp_gate|0]§! £army_experience · §Y[?constant:event021_action_cost.loyalty_political_power_gate|0]§! £pol_power"
event021_review_loyalty_cost_text_blocked: "£command_power §R[?constant:event021_action_cost.loyalty_command_power_gate|0]§!  £army_experience §R[?constant:event021_action_cost.loyalty_army_xp_gate|0]§!  £pol_power §R[?constant:event021_action_cost.loyalty_political_power_gate|0]§!"
event021_review_loyalty_cost_text_tooltip: "Command capacity, army experience, and political authority review the officer corps."
event021_seize_depot: "Seize an Opposition Depot"
event021_seize_depot_desc: "Take control of a forward depot before it becomes the opposition's permanent source of supply."
event021_seize_depot_tt: "Secure the selected priority-front depot, disrupt rival coordination, and temporarily improve frontline supply."
event021_depot_target_requirement_tt: "[event021_GetPriorityFrontName] must remain under your control and contain a supply node or military factory."
event021_seize_depot_cost_text: "§Y[?constant:event021_action_cost.depot_command_power_gate|0]§! £command_power · §Y[?constant:event021_action_cost.depot_infantry_gate|0]§! £infantry_equipment_text_icon · §Y[?constant:event021_action_cost.depot_trucks_gate|0]§! £GFX_motorized_equipment_text_icon"
event021_seize_depot_cost_text_blocked: "£command_power §R[?constant:event021_action_cost.depot_command_power_gate|0]§!  £infantry_equipment_text_icon §R[?constant:event021_action_cost.depot_infantry_gate|0]§!  £GFX_motorized_equipment_text_icon §R[?constant:event021_action_cost.depot_trucks_gate|0]§!"
event021_seize_depot_cost_text_tooltip: "Command capacity, rifles, and motor transport seize the depot."
event021_open_relief_corridor: "Open a Relief Corridor"
event021_open_relief_corridor_desc: "Register displaced civilians and keep food, medical supplies, and administrators moving through a monitored route."
event021_open_relief_corridor_tt: "Separate civilian relief from armed support, lower humanitarian pressure, and improve administration."
event021_open_relief_corridor_cost_text: "§Y[?constant:event021_action_cost.relief_political_power_gate|0]§! £pol_power · §Y[?constant:event021_action_cost.relief_trucks_gate|0]§! £GFX_motorized_equipment_text_icon · §Y[?constant:event021_action_cost.relief_convoys_gate|0]§! £convoy_texticon"
event021_open_relief_corridor_cost_text_blocked: "£pol_power §R[?constant:event021_action_cost.relief_political_power_gate|0]§!  £GFX_motorized_equipment_text_icon §R[?constant:event021_action_cost.relief_trucks_gate|0]§!  £convoy_texticon §R[?constant:event021_action_cost.relief_convoys_gate|0]§!"
event021_open_relief_corridor_cost_text_tooltip: "Political authority, motor transport, and convoys open the route."
event021_offer_emergency_settlement: "Offer Emergency Terms"
event021_offer_emergency_settlement_desc: "Offer a ceasefire built on autonomy, a coalition, recognition, or a negotiated partition before the remaining fronts become permanent."
event021_offer_emergency_settlement_tt: "Offer terms to every opposing side at a temporary cost in State Authority. Signing them ends the fighting and begins enforceable obligations."
event021_offer_emergency_settlement_ready_tt: "[event021_GetSettlementOfferReadyLine]"
event021_offer_emergency_settlement_duration_tt: "The war has been fought for at least §Y[?constant:event021_settlement_offer.minimum_war_days|0]§! days, which it reaches on §Y[?random_civil_war_settlement_offer_ready_date.GetDateStringNoHour]§!, or a neighbour is mediating it."
event021_offer_emergency_settlement_mediated_tt: "§Y[?random_civil_war_mediator_scope.GetName]§! is mediating the war until §Y[?random_civil_war_mediation_until.GetDateStringNoHour]§!, so terms can be offered now."
event021_offer_emergency_settlement_sides_tt: "No additional independence front is fighting the government, and no opposing side is controlled by a player."
event021_offer_emergency_settlement_cost_text: "§Y[?constant:event021_action_cost.settlement_political_power_gate|0]§! £pol_power · §Y[?constant:event021_action_cost.settlement_command_power_gate|0]§! £command_power · §Y[?constant:event021_action_cost.settlement_infantry_gate|0]§! £infantry_equipment_text_icon"
event021_offer_emergency_settlement_cost_text_blocked: "£pol_power §R[?constant:event021_action_cost.settlement_political_power_gate|0]§!  £command_power §R[?constant:event021_action_cost.settlement_command_power_gate|0]§!  £infantry_equipment_text_icon §R[?constant:event021_action_cost.settlement_infantry_gate|0]§!"
event021_offer_emergency_settlement_cost_text_tooltip: "Political authority, command capacity, and rifles open settlement terms, and the talks also commit §Y[?constant:event021_action_cost.settlement_manpower_gate|0]§! manpower."
event021_reconstruct_administration: "Reconstruct the Administration"
event021_reconstruct_administration_desc: "Repair the rail and civil-service network left behind by the war."
event021_reconstruct_administration_tt: "Restore administration, raise State Authority, and reduce postwar recurrence risk."
event021_reconstruct_administration_cost_text: "§Y[?constant:event021_action_cost.reconstruction_political_power_gate|0]§! £pol_power · §Y[?constant:event021_action_cost.reconstruction_trains_gate|0]§! £GFX_train_texticon · §Y[?constant:event021_action_cost.reconstruction_manpower_gate|0]§! £manpower_texticon"
event021_reconstruct_administration_cost_text_blocked: "£pol_power §R[?constant:event021_action_cost.reconstruction_political_power_gate|0]§!  £GFX_train_texticon §R[?constant:event021_action_cost.reconstruction_trains_gate|0]§!  £manpower_texticon §R[?constant:event021_action_cost.reconstruction_manpower_gate|0]§!"
event021_reconstruct_administration_cost_text_tooltip: "Political authority, trains, and manpower restore administration."

event021_integrate_formations: "Integrate Loyal Formations"
event021_integrate_formations_desc: "Bring compatible commands under one field structure without stripping the priority front of its reserves."
event021_integrate_formations_tt: "Improve front coordination, raise State Authority, ease internal division, and end §YFractured Command§!."
event021_integrate_formations_cost_text: "§Y[?constant:event021_action_cost.integration_army_xp_gate|0]§! £army_experience · §Y[?constant:event021_action_cost.integration_infantry_gate|0]§! £infantry_equipment_text_icon · §Y[?constant:event021_action_cost.integration_manpower_gate|0]§! £manpower_texticon"
event021_integrate_formations_cost_text_blocked: "£army_experience §R[?constant:event021_action_cost.integration_army_xp_gate|0]§!  £infantry_equipment_text_icon §R[?constant:event021_action_cost.integration_infantry_gate|0]§!  £manpower_texticon §R[?constant:event021_action_cost.integration_manpower_gate|0]§!"
event021_integrate_formations_cost_text_tooltip: "Army experience, rifles, and manpower integrate the formations."
event021_set_priority_front: "Set the Priority Front"
event021_set_priority_front_desc: "Concentrate staff attention and scarce transport around [event021_GetPriorityFrontCandidateName]."
event021_set_priority_front_tt: "Make [event021_GetPriorityFrontCandidateName] the national priority front and improve its command response."
event021_set_priority_front_requirement_tt: "You must still own and control at least one state of your current front."
event021_set_priority_front_cost_text: "§Y[?constant:event021_action_cost.priority_command_power_gate|0]§! £command_power"
event021_set_priority_front_cost_text_blocked: "£command_power §R[?constant:event021_action_cost.priority_command_power_gate|0]§!"
event021_set_priority_front_cost_text_tooltip: "Command capacity establishes the priority front."
event021_monitor_border: "Monitor the Border"
event021_monitor_border_desc: "Track weapons traffic, returning cadres, and displaced administrations from [event021_GetExposureSourceName] without treating civilian movement as armed infiltration."
event021_monitor_border_tt: "Patrol the crossings and disrupt arms routes and recruitment. Lower exposure by one stage and hold it there while patrols continue. Relief stays separate from military aid."
event021_monitor_border_cost_text: "§Y[?constant:event021_action_cost.border_command_power_gate|0]§! £command_power · §Y[?constant:event021_action_cost.border_trucks_gate|0]§! £GFX_motorized_equipment_text_icon · §Y[?constant:event021_action_cost.border_convoys_gate|0]§! £convoy_texticon"
event021_monitor_border_cost_text_blocked: "£command_power §R[?constant:event021_action_cost.border_command_power_gate|0]§!  £GFX_motorized_equipment_text_icon §R[?constant:event021_action_cost.border_trucks_gate|0]§!  £convoy_texticon §R[?constant:event021_action_cost.border_convoys_gate|0]§!"
event021_monitor_border_cost_text_tooltip: "Command capacity, motor transport, and convoys secure the border watch."
event021_support_government: "Support the Government"
event021_support_government_desc: "Send rifles and liaison staff to [event021_GetSupportGovernmentTarget]."
event021_support_government_tt: "Ship §Y[?constant:event021_action_cost.government_support_infantry_gate|0]§! rifles and liaison staff to [event021_GetSupportGovernmentTarget]. Transport and handling losses leave §Y[?constant:event021_action_cost.government_support_infantry_transfer|0]§! rifles on arrival. Civilian aid stays with the relief corridor."
event021_support_government_target_requirement_tt: "The recognized side must retain a viable controlled territory, production base, or public leadership."
event021_support_government_cost_text: "§Y[?constant:event021_action_cost.government_support_political_power_gate|0]§! £pol_power · §Y[?constant:event021_action_cost.government_support_infantry_gate|0]§! £infantry_equipment_text_icon · §Y[?constant:event021_action_cost.government_support_convoys_gate|0]§! £convoy_texticon"
event021_support_government_cost_text_blocked: "£pol_power §R[?constant:event021_action_cost.government_support_political_power_gate|0]§!  £infantry_equipment_text_icon §R[?constant:event021_action_cost.government_support_infantry_gate|0]§!  £convoy_texticon §R[?constant:event021_action_cost.government_support_convoys_gate|0]§!"
event021_support_government_cost_text_tooltip: "Political authority, rifles, and convoys support the recognized government."
event021_support_opposition: "Support the Opposition"
event021_support_opposition_desc: "Send rifles and advisers to [event021_GetSupportOppositionTarget]."
event021_support_opposition_tt: "Ship §Y[?constant:event021_action_cost.opposition_support_infantry_gate|0]§! rifles and advisers to [event021_GetSupportOppositionTarget]. Transport and handling losses leave §Y[?constant:event021_action_cost.opposition_support_infantry_transfer|0]§! rifles on arrival. Civilian aid stays with the relief corridor. The government they are fighting loses §R[?constant:random_civil_war_authority.foreign_intervention|0]§! State Authority if no other sponsor is already arming its enemies."
event021_support_opposition_target_requirement_tt: "The claimant must retain a viable controlled territory, production base, or public leadership."
event021_support_opposition_cost_text: "§Y[?constant:event021_action_cost.opposition_support_political_power_gate|0]§! £pol_power · §Y[?constant:event021_action_cost.opposition_support_infantry_gate|0]§! £infantry_equipment_text_icon · §Y[?constant:event021_action_cost.opposition_support_convoys_gate|0]§! £convoy_texticon"
event021_support_opposition_cost_text_blocked: "£pol_power §R[?constant:event021_action_cost.opposition_support_political_power_gate|0]§!  £infantry_equipment_text_icon §R[?constant:event021_action_cost.opposition_support_infantry_gate|0]§!  £convoy_texticon §R[?constant:event021_action_cost.opposition_support_convoys_gate|0]§!"
event021_support_opposition_cost_text_tooltip: "Political authority, rifles, and convoys support the claimant authority."
event021_offer_mediation: "Offer Regional Mediation"
event021_offer_mediation_desc: "Open a neutral channel for recognition, ceasefire, and border guarantees without supplying either army."
event021_offer_mediation_tt: "Open talks with [event021_GetSupportGovernmentTarget], lower exposure by one stage and hold it there while mediation continues. For §Y[?constant:event021_action_tuning.mediation_days|0]§! days that government can offer terms to its opponents at once, and any terms it signs count as a negotiated peace. The first talks in that war raise its State Authority by §G[?constant:random_civil_war_authority.negotiation|0]§!."
event021_offer_mediation_cost_text: "§Y[?constant:event021_action_cost.mediation_political_power_gate|0]§! £pol_power · §Y[?constant:event021_action_cost.mediation_command_power_gate|0]§! £command_power · §Y[?constant:event021_action_cost.mediation_convoys_gate|0]§! £convoy_texticon"
event021_offer_mediation_cost_text_blocked: "£pol_power §R[?constant:event021_action_cost.mediation_political_power_gate|0]§!  £command_power §R[?constant:event021_action_cost.mediation_command_power_gate|0]§!  £convoy_texticon §R[?constant:event021_action_cost.mediation_convoys_gate|0]§!"
event021_offer_mediation_cost_text_tooltip: "Political authority, command capacity, and convoys sustain the mediation mission."
event021_end_sponsor_commitment: "Secure Sponsor Withdrawal"
event021_end_sponsor_commitment_desc: "Require the outside patron to end its support under the settlement terms."
event021_end_sponsor_commitment_tt: "End the linked sponsor's active commitment and satisfy this settlement obligation."
event021_end_sponsor_commitment_cost_text: "§Y[?constant:event021_action_cost.disengage_political_power_gate|0]§! £pol_power · §Y[?constant:event021_action_cost.disengage_command_power_gate|0]§! £command_power"
event021_end_sponsor_commitment_cost_text_blocked: "£pol_power §R[?constant:event021_action_cost.disengage_political_power_gate|0]§!  £command_power §R[?constant:event021_action_cost.disengage_command_power_gate|0]§!"
event021_end_sponsor_commitment_cost_text_tooltip: "Political authority and command capacity disengage the sponsor mission."
event021_complete_disarmament: "Complete the Disarmament"
event021_complete_disarmament_desc: "Register formations, collect heavy weapons, and return released personnel to civilian administration."
event021_complete_disarmament_tt: "Fulfil the settlement's disarmament obligation."
event021_complete_disarmament_cost_text: "§Y[?constant:event021_action_cost.disarmament_army_xp_gate|0]§! £army_experience · §Y[?constant:event021_action_cost.disarmament_infantry_gate|0]§! £infantry_equipment_text_icon · §Y[?constant:event021_action_cost.disarmament_manpower_gate|0]§! £manpower_texticon"
event021_complete_disarmament_cost_text_blocked: "£army_experience §R[?constant:event021_action_cost.disarmament_army_xp_gate|0]§!  £infantry_equipment_text_icon §R[?constant:event021_action_cost.disarmament_infantry_gate|0]§!  £manpower_texticon §R[?constant:event021_action_cost.disarmament_manpower_gate|0]§!"
event021_complete_disarmament_cost_text_tooltip: "Army experience, rifles, and manpower complete the disarmament."
event021_complete_coalition_governance: "Seat the Coalition Council"
event021_complete_coalition_governance_desc: "Bind the signatories to one budget, one civil service, and a public schedule for shared rule."
event021_complete_coalition_governance_tt: "Fulfil the coalition-governance obligation."
event021_complete_coalition_governance_cost_text: "§Y[?constant:event021_action_cost.mediation_political_power_gate|0]§! £pol_power · §Y[?constant:event021_action_cost.mediation_command_power_gate|0]§! £command_power"
event021_complete_coalition_governance_cost_text_blocked: "£pol_power §R[?constant:event021_action_cost.mediation_political_power_gate|0]§!  £command_power §R[?constant:event021_action_cost.mediation_command_power_gate|0]§!"
event021_complete_coalition_governance_cost_text_tooltip: "Political authority and command capacity seat the coalition council."
event021_protect_communications: "Protect State Communications"
event021_protect_communications_desc: "Guard dispatch trains, ministry relays, and regional command links before exposed institutions begin to fail."
event021_protect_communications_tt: "Protect national communications, ease the pressure on the state, and raise State Authority."
event021_protect_communications_cost_text: "§Y[?constant:event021_action_cost.prevention_command_power_gate|0]§! £command_power · §Y[?constant:event021_action_cost.prevention_trains_gate|0]§! £GFX_train_texticon"
event021_protect_communications_cost_text_blocked: "£command_power §R[?constant:event021_action_cost.prevention_command_power_gate|0]§!  £GFX_train_texticon §R[?constant:event021_action_cost.prevention_trains_gate|0]§!"
event021_protect_communications_cost_text_tooltip: "Command capacity and trains protect state communications."
event021_review_regional_administration: "Review Regional Administration"
event021_review_regional_administration_desc: "Reinforce provincial offices, replace missing staff, and answer grievances before rival authorities can organize."
event021_review_regional_administration_tt: "Ease regional tensions and improve the state's administrative reach."
event021_review_regional_administration_cost_text: "§Y[?constant:event021_action_cost.prevention_political_power_gate|0]§! £pol_power · §Y[?constant:event021_action_cost.prevention_manpower_gate|0]§! £manpower_texticon"
event021_review_regional_administration_cost_text_blocked: "£pol_power §R[?constant:event021_action_cost.prevention_political_power_gate|0]§!  £manpower_texticon §R[?constant:event021_action_cost.prevention_manpower_gate|0]§!"
event021_review_regional_administration_cost_text_tooltip: "Political authority and manpower reinforce regional administration."

event021_hold_the_capital_mission: "Hold the Capital"
event021_hold_the_capital_mission_desc: "Once [ROOT.Capital.GetName] has a supply node and a defensive reserve, commit to holding it for [?constant:event021_mission_tuning.hold_capital_days|0] days. Success restores State Authority. Failure weakens authority and deepens internal division."
event021_hold_capital_requirement_tt: "To start, [ROOT.Capital.GetName] must remain under your control, have infrastructure and a supply node, and keep its defenses in place."
event021_secure_rail_spine_mission: "Secure the Rail Spine"
event021_secure_rail_spine_mission_desc: "Commit to keeping [event021_GetRailMissionStateName] under your control for [?constant:event021_mission_tuning.secure_rail_days|0] days, with a supply node or usable infrastructure at the deadline. Success repairs the route, recovers trains, and strengthens State Authority. Failure deepens internal division."
event021_secure_rail_requirement_tt: "[event021_GetRailMissionStateName] must remain under your control within the territory you held when fighting began, with a supply node or usable infrastructure."
event021_hold_settlement_terms_mission: "Hold the Settlement Terms"
event021_hold_settlement_terms_mission_desc: "Commit to fulfilling [event021_GetSettlementObligationName] and keeping the peace until the terms are reviewed on §Y[?random_civil_war_settlement_terms_hold_until.GetDateStringNoHour]§!. Success confirms the settlement and strengthens the state. Failure records a breach and puts the peace at risk."
event021_settlement_terms_requirement_tt: "The settlement's obligation, [event021_GetSettlementObligationName], is still in force and has not been broken."
event021_hold_capital_commit_tt: "Begin a [?constant:event021_mission_tuning.hold_capital_days|0]-day hold of [ROOT.Capital.GetName]. Losing control of it during the hold ends it in failure."
event021_secure_rail_commit_tt: "Begin a [?constant:event021_mission_tuning.secure_rail_days|0]-day hold of [event021_GetRailMissionStateName]. Losing control of it during the hold ends it in failure."
event021_mission_offer_lapsed_tt: "The moment passes. The commitment can be offered again in [?constant:event021_action_tuning.action_cooldown_days|0] days."
event021_settlement_terms_commit_tt: "Hold to the terms until §Y[?random_civil_war_settlement_terms_hold_until.GetDateStringNoHour]§!, when they are reviewed, and fulfil [event021_GetSettlementObligationName] before then."
event021_holding_the_capital_mission: "Holding the Capital"
event021_holding_the_capital_mission_desc: "Keep [event021_GetHoldCapitalTargetName] under your control until the deadline. If it falls, the hold fails at once. At the deadline it must still be the capital, with infrastructure, a supply node and its defenses in place."
event021_holding_the_capital_outcome_tt: "At the deadline, if [event021_GetHoldCapitalTargetName] is still your capital and under your control, with infrastructure, a supply node and its defenses in place, State Authority rises. Otherwise the hold fails: State Authority falls and internal division deepens."
event021_securing_the_rail_spine_mission: "Securing the Rail Spine"
event021_securing_the_rail_spine_mission_desc: "Keep [event021_GetRailMissionStateName] under your control until the deadline. If it falls, the hold fails at once. At the deadline it needs a supply node or usable infrastructure."
event021_securing_the_rail_spine_outcome_tt: "At the deadline, if [event021_GetRailMissionStateName] is still under your control with a supply node or usable infrastructure, the route is repaired, trains are recovered, State Authority rises, and internal division eases. Otherwise the rail spine is lost for this war: State Authority falls and internal division deepens."
event021_upholding_the_settlement_mission: "Upholding the Settlement"
event021_upholding_the_settlement_mission_desc: "Fulfil [event021_GetSettlementObligationName] before the deadline and keep the peace. Success confirms the settlement. Failure records a breach."
event021_upholding_the_settlement_outcome_tt: "On §Y[?random_civil_war_settlement_terms_hold_until.GetDateStringNoHour]§!, if [event021_GetSettlementObligationName] has been fulfilled and the fighting has not resumed, the settlement is confirmed: State Authority rises by §G[?constant:event021_action_tuning.settlement_terms_authority_gain|0]§!, internal division eases, and renewed civil war becomes less likely. Otherwise a breach is recorded and the peace is put at risk."
event021_mission_success: "The objective is complete."
event021_mission_failure: "The objective was lost."
event021_obligation_none: "the public peace"
event021_obligation_recognition: "the recognition guarantee"
event021_obligation_disarmament: "the disarmament schedule"
event021_obligation_rail_security: "the rail-security compact"
event021_obligation_sponsor_repayment: "the sponsor disengagement terms"
event021_obligation_coalition_governance: "the coalition-governance charter"

event021_idea_fractured_command: "Fractured Command"
event021_idea_fractured_command_desc: "Officers, depots, and regional commands no longer share one unquestioned chain of authority."
event021_idea_war_torn_administration: "War-Torn Administration"
event021_idea_war_torn_administration_desc: "Railways, factories, and civil servants are working around contested territory and damaged institutions."
event021_idea_unsettled_settlement: "Unsettled Settlement"
event021_idea_unsettled_settlement_desc: "The war has ended under terms whose legitimacy, disarmament, and regional obligations remain to be proved."
event021_fractured_command: "Fractured Command"
event021_fractured_command_desc: "Officers, depots, and regional commands no longer share one unquestioned chain of authority."
event021_war_torn_administration: "War-Torn Administration"
event021_war_torn_administration_desc: "Railways, factories, and civil servants are working around contested territory and damaged institutions."
event021_unsettled_settlement: "Unsettled Settlement"
event021_unsettled_settlement_desc: "The war has ended under terms whose legitimacy, disarmament, and regional obligations remain to be proved."
event021_incident_night_assemblies: "Night Assemblies"
event021_incident_night_assemblies_desc: "Companies slip away after dark and return before dawn, silent, disciplined, and unwilling to say where they have been."
event021_incident_oath_circles: "Oath Circles"
event021_incident_oath_circles_desc: "A sworn battalion stands in its ring each evening and refuses to give up a yard of ground, whatever it costs."
event021_incident_signal_fires: "Signal Fires"
event021_incident_signal_fires_desc: "Fires on the hills and a repeated mark along the roads come before every coordinated move of the local formations."
event021_incident_endurance_rumours: "The Sleepless Column"
event021_incident_endurance_rumours_desc: "One formation marches through the night and never seems to tire, and the story of it unsettles friend and enemy alike."
event021_incident_relic_processions: "Relic Procession"
event021_incident_relic_processions_desc: "An old banner carried from village to village draws crowds and recruits wherever it stops."
event021_strange_incident_strain: "Unease in the Ranks"
event021_strange_incident_strain_desc: "Talk of the practice has spread through the army. Ordinary units fear and resent those involved, and officers argue over what should be done."
event021_aftermath_amnesty: "Amnesty Commissions"
event021_aftermath_amnesty_desc: "Former rebels who surrendered their weapons are registered, pardoned, and sent home, and some are returning to the army under the government's colours."
event021_aftermath_reform: "Reform Tribunals"
event021_aftermath_reform_desc: "Tribunals are trying the leaders of the rising while the ministries that failed during the war are rebuilt under new staff."
event021_aftermath_security_regime: "Security Regime"
event021_aftermath_security_regime_desc: "Garrisons, checkpoints, and detention camps hold the former rebel regions. The population there is watched and distrusted."
event021_aftermath_emergency_rule: "Continued Emergency Rule"
event021_aftermath_emergency_rule_desc: "The wartime decrees remain in force, and the army and the emergency councils still govern in place of ordinary institutions."
event021_aftermath_autonomy_compact: "Autonomy Compact"
event021_aftermath_autonomy_compact_desc: "A self-governing region keeps its own administration, part of its revenue, and its own rules for recruitment under the settlement."
event021_aftermath_power_sharing: "Power-Sharing Council"
event021_aftermath_power_sharing_desc: "Former enemies sit in one government, and every budget, appointment, and decree has to be bargained over among them."
event021_aftermath_armistice_line: "Armistice Line"
event021_aftermath_armistice_line_desc: "A guarded line now divides the old country, and troops on both sides watch it for any sign that the fighting is about to resume."
event021_aftermath_foreign_patronage: "Foreign Patronage"
event021_aftermath_foreign_patronage_desc: "The outside power that armed one side during the war expects repayment, influence, and a voice in how the peace is kept."
event021_aftermath_recognized_border: "Recognized Border"
event021_aftermath_recognized_border_desc: "The state has accepted the loss of a region that now governs itself, and many still refuse to accept that border as final."
event021_secured_front_depot: "Secured Front Depot"
event021_secured_front_depot_desc: "A verified depot on the priority front is feeding nearby formations through a protected local supply chain."

event021_evolution_i_title: "Gathering Fronts"
event021_evolution_i_body: "Rival commands and regional movements are joining the civil wars already under way. Where a region can hold its own capital and forces, a new side takes up arms; elsewhere, governments and claimants tighten their grip on their fronts. New crises can now open on several fronts at once."
event021_evolution_ii_title: "Regional Exposure"
event021_evolution_ii_body: "Arms routes and foreign sponsors are carrying the crisis across borders. Civilian relief and armed support demand separate choices. The fighting sides are reorganizing their supplies, defenses and mobile columns. In a few units, night gatherings, sworn oaths and repeated signs have appeared that no one outside their ranks can explain."
event021_evolution_iii_title: "Global Fracture"
event021_evolution_iii_body: "Countries are moving from stability into exposure, fracture, and open crisis as divided commands and regional movements test weakened governments. Victory, reform, and negotiated terms can still restore public authority."
event021_evolution_i_stage: "Gathering Fronts"
event021_evolution_ii_stage: "Regional Exposure"
event021_evolution_iii_stage: "Global Fracture"
event021_evolution_i_log: "Rival commands and regional movements joined the civil wars already under way, and new crises began opening on several fronts."
event021_evolution_ii_log: "Weapons routes, sponsors, and displaced administrations carried the crisis across nearby borders."
event021_evolution_iii_log: "Domestic fractures began recurring across countries already under political and military strain."

event021_event_log_evolution_type: "Global Fracture"
event021_event_log_evolution_summary: "Domestic fracture can spread from one contested government to additional fronts, neighboring countries, and later crises. Each war can still end through victory, autonomy, coalition, recognition, or disarmament."
event021_event_log_detail: "A country's chain of command has split between rival political and military authorities. Capitals, supply routes, public legitimacy, and the terms offered to each front will shape the conflict. When the fronts gather, a war already under way can draw in new regional sides, or its government and claimants take firmer command of the fronts they hold. A claimant that replaces the government can open a new war against the old government's foreign enemies for its own core or claimed territory, or let that quarrel lapse."
event021_event_log_detail_opening: "Regional leaders and military commands have broken with the central government. Rival authorities are competing for defensible territory, a functioning capital, supplies, and public loyalty.[event021_GetHistorySnapshotSummary]"
event021_event_log_detail_multi_front: "Another regional or political authority has entered the war with its own territory, objective, armed forces, and demands for peace.[event021_GetHistorySnapshotSummary]"
event021_event_log_detail_exposure: "The fighting has reached neighboring communities through weapons routes, political organizers, displaced civilians, foreign sponsors, and calls for mediation.[event021_GetHistorySnapshotSummary]"
event021_event_log_detail_settlement: "The sides have accepted terms based on recognition, autonomy, coalition, partition, or disarmament. The peace will last only if every signatory meets its obligations.[event021_GetHistorySnapshotSummary]"
event021_event_log_detail_reconstruction: "The fighting has ended. Repaired railways, restored civil administration, demobilization, and fulfilled peace terms will determine whether the settlement lasts.[event021_GetHistorySnapshotSummary]"
event021_event_log_detail_failed_opening: "The confrontation subsided before any side could secure a defensible capital, coherent territory, or enough organized support to begin a war.[event021_GetHistorySnapshotSummary]"
event021_event_log_snapshot_empty: ""
