event021_hold_the_capital_mission: "Hold the Capital"
event021_hold_the_capital_mission_desc: "Hold [ROOT.Capital.GetName] under supplied control for [?constant:event021_mission_tuning.hold_capital_days|0] days. Success restores State Authority; failure weakens authority and deepens internal division."
