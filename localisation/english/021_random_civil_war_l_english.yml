chaosx.scenarios.random_civil_war.name: "The Fracture Cascade"
chaosx.scenarios.random_civil_war.desc.political: "Prioritizes ideological uprisings, rival legal governments, coalition breakdowns, constitutional disputes, and seizures of central authority."
chaosx.scenarios.random_civil_war.desc.independence: "Prioritizes established independence movements, regional secessions, recognition disputes, and wars of separation."
chaosx.scenarios.random_civil_war.desc.command: "Prioritizes command schisms, military districts, arsenal seizures, officer disloyalty, and military seizures of central authority."
chaosx.scenarios.random_civil_war.desc.universal: "Combines political, legal, military, regional, independence, and successor-state crises wherever each form can sustain a conflict."
chaosx.scenarios.random_civil_war.impact.low: "Roughly ten percent of eligible countries face limited uprisings with smaller territorial and military commitments."
chaosx.scenarios.random_civil_war.impact.medium: "Roughly a quarter of eligible countries face stronger uprisings, established independence movements, and selected multi-front wars."
chaosx.scenarios.random_civil_war.impact.high: "Roughly half of eligible countries face frequent multi-front wars, stronger foreign pressure, and some crises within young successor states."
chaosx.scenarios.random_civil_war.impact.maximum: "Every eligible country faces its strongest sustainable fracture. Countries outside ordinary human politics remain unaffected, and the scenario does not end the world."
chaosx.scenarios.random_civil_war.confirmation: "Launch The Fracture Cascade against the selected share of eligible countries. The scenario creates internal wars without ending the world."
