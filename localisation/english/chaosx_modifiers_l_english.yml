l_english:
communism_control_level_1: "Communist Agitation Zone"
communism_control_level_1_desc: "Local communist cells are spreading strikes, propaganda, and intimidation. Penalties worsen while the state remains controlled, but loyal authorities can still recover the state through regular intervention."
communism_control_level_2: "Communist Insurgent Stronghold"
communism_control_level_2_desc: "Organized communist militias and revolutionary committees are disrupting industry, logistics, manpower, and local administration. Repeated local intervention can push the state back to an Agitation Zone."
communism_control_level_3: "Communist Lockdown"
communism_control_level_3_desc: "The state has effectively fallen under communist parallel authority. Normal local intervention can only suppress the worst penalties, and the area has become a demilitarized revolutionary lockdown zone."
communism_post_crackdown_scars: "Post-Crackdown Scars"
communism_post_crackdown_scars_desc: "Security operations have restored authority, but arrests, raids, and disrupted workplaces have left temporary economic and local-order damage."
communism_worker_ritual_fear: "Worker Ritual Fear"
communism_worker_ritual_fear_desc: "Strange revolutionary ceremonies and oath gatherings are intimidating loyal workers, slowing production, and weakening local order."
communism_emergency_disruption: "Emergency Anti-Communist Disruption"
communism_emergency_disruption_desc: "Nationwide emergency powers are disrupting production, mobilization, and civilian administration."
zombie_hostile: "Zombie Hostility"
bio_ambiguous_health_pressure_state: "Unexplained Health Pressure"
bio_ambiguous_health_pressure_state_desc: "Hospitals and workplaces report rising strain and unusual absences, but no agent or deliberate source has been confirmed."
anthrax_contaminated_state: "Anthrax Contamination"
anthrax_contaminated_state_desc: "This state has been contaminated with anthrax spores, creating a persistent local burden on population and production."
quarantined_contaminated_state: "Quarantined Contaminated State"
quarantined_contaminated_state_desc: "Roadblocks, travel controls, and emergency requisitions are slowing biological spread at the cost of construction, factories, resources, local supplies, and growing resistance."
bioweapon_user: "Used Biological Weapons"
bioweapon_user_desc: "This nation has used biological weapons, which is condemned by the international community."
bioweapon_repeat_offender: "Repeated Bioweapon Use"
bioweapon_repeat_offender_desc: "This nation has repeatedly used biological weapons despite international condemnation, marking them as a rogue state."
bioweapon_victim_sympathy: "Bioweapon Attack Victim"
bioweapon_victim_sympathy_desc: "This nation was the victim of a biological weapon attack, gaining international sympathy."
air_cleanliness_treaty_member_respect: "Air Cleanliness Treaty Cooperation"
air_cleanliness_treaty_member_respect_desc: "Both governments exchange atmospheric readings, recognize the same depot clearances, accept secretariat verification, and comply with the treaty prohibition on unconventional weapons."
air_cleanliness_treaty_violator: "Air Cleanliness Treaty Violator"
air_cleanliness_treaty_violator_desc: "This government breached a binding treaty obligation. Member offices have withdrawn relief access and opened a permanent sanctions ledger."
air_cleanliness_treaty_verified_access: "Treaty Verification Opened"
air_cleanliness_treaty_verified_access_desc: "This government admitted treaty technicians to its atmospheric samplers and filter depots, then released matching records to every member office."
air_cleanliness_treaty_records_only: "Restricted Treaty Verification"
air_cleanliness_treaty_records_only_desc: "This government released certified atmospheric records but kept treaty technicians outside the facilities they were meant to verify."
air_cleanliness_treaty_refused_inspection: "Treaty Inspection Refused"
air_cleanliness_treaty_refused_inspection_desc: "This government denied entry to a treaty verification mission. Member offices expelled it from the sampling exchange, closed relief access, and opened coordinated embargo files."
strategic_bioweapon_user: "Used Strategic Bioweapons"
strategic_bioweapon_user_desc: "This nation has used strategic biological weapons, committing crimes against humanity and triggering international outrage."
strategic_bioweapon_repeat_offender: "Repeat Strategic Bioweapon Use"
strategic_bioweapon_repeat_offender_desc: "This nation has repeatedly used strategic biological weapons, marking them as a genocidal rogue state that must be stopped at all costs."
strategic_bioweapon_victim_sympathy: "Strategic Bioweapon Attack Victim"
strategic_bioweapon_victim_sympathy_desc: "This nation was the victim of a strategic biological weapon attack, gaining overwhelming international sympathy and support against such crimes against humanity."
field_hospital_contamination_defense: "Field Hospital Defense"
field_hospital_contamination_defense_desc: "Mobile field hospitals are providing medical care to reduce contamination effects in this state."
quarantine_containment_measures: "Quarantine Protocols"
quarantine_containment_measures_desc: "Strict quarantine measures are in place to contain biological contamination, but at the cost of reduced economic activity."
zombie_decontaminated_state: "Anti-Zombie Decontamination"
zombie_decontaminated_state_desc: "This state has been saturated with anti-zombie decontaminants. Zombie occupation here yields far less manpower and local operational freedom while the cure remains active."
nuclear_fallout_state: "Radioactive Fallout"
nuclear_fallout_state_desc: "This state is suffering long-term radioactive fallout after a nuclear strike. Civilian losses continue to mount while the contamination remains active."

# Plague Contamination
plague_contaminated_state: "Plague Contamination"
plague_contaminated_state_desc: "This state has been contaminated with plague bacteria, causing a serious spreading crisis across population and production."

# Tularemia Contamination
tularemia_contaminated_state: "Tularemia Contamination"
tularemia_contaminated_state_desc: "This state has been contaminated with tularemia bacteria, causing tactical military disruption and temporary production issues."

# Smallpox Contamination
smallpox_contaminated_state: "Smallpox Epidemic"
smallpox_contaminated_state_desc: "This state is experiencing a devastating Smallpox epidemic, causing catastrophic population loss and economic collapse. Vaccination provides the strongest dedicated protection, while surveillance, containment, and medical response support recovery."

genocide_forced_labor_exploitation_state: "Forced Labor Exploitation"
genocide_forced_labor_exploitation_state_desc: "Camp labor is being forced into state extraction and construction work. Output rises while resistance and compliance damage deepen."
genocide_concentration_camp_network_state: "Concentration Camp Network"
genocide_concentration_camp_network_state_desc: "The camp network is drawing labor, transport authority, and local administration into production. Its strength scales with the responsible country's repression apparatus and escalation."
genocide_camp_sabotage_pressure_state: "Camp Sabotage Pressure"
genocide_camp_sabotage_pressure_state_desc: "Resistance cells, prisoners, and local networks are disrupting the camp system and the logistics that support it."
genocide_evidence_burned_state: "Burned Evidence"
genocide_evidence_burned_state_desc: "Records, camp infrastructure, and witnesses have been targeted for destruction, damaging local production and leaving traces for later discovery."
genocide_refugee_pressure_state: "Refugee Pressure"
genocide_refugee_pressure_state_desc: "Forced transfers and camp rumors are driving civilians out of the state, weakening manpower and local production."
genocide_foreign_resistance_support_state: "Foreign-Supported Resistance"
genocide_foreign_resistance_support_state_desc: "Foreign support is reaching local resistance networks that target camp infrastructure, records, and occupation authorities."
genocide_atrocity_condemned: "Atrocity Evidence Condemned"
genocide_tribunal_records_prepared: "Tribunal Records Prepared"
genocide_refugee_aid_respect: "Survivor Testimony Recorded"
