  fallout.event_log.permit_market.detail.choice_sell: "The Quarantine State opened a temporary paid permit market at the ash gate."
  fallout.event_log.permit_market.detail.issue_success: "Local passes reopened the road and kept movement answerable to the wards."
  fallout.event_log.permit_market.detail.issue_partial: "Local passes reopened most wards but left a shortage queue."
  fallout.event_log.permit_market.detail.issue_failure: "The local permit desks failed and deepened the movement grievance."
  fallout.event_log.permit_market.detail.audit_success: "The registry audit removed false permits without erasing legitimate travel."
  fallout.event_log.permit_market.detail.audit_partial: "The registry audit corrected duplicate passes but left outer wards on rival calendars."
  fallout.event_log.permit_market.detail.audit_failure: "The registry audit lost power and left the old permit market circulating."
  fallout.event_log.permit_market.detail.delegate_success: "Ward councils made permit decisions public and preserved a durable appeal record."
  fallout.event_log.permit_market.detail.delegate_partial: "Ward councils named a common permit rule but left two districts in conflict."
  fallout.event_log.permit_market.detail.delegate_failure: "Rival ward permit courts split the road into competing lists."
  fallout.event_log.permit_market.detail.sell_success: "A bounded permit market funded repairs while preserving household exemptions."
  fallout.event_log.permit_market.detail.sell_partial: "The permit market kept the central desk alive but made access unequal."
  fallout.event_log.permit_market.detail.sell_failure: "The permit market collected fees without restoring a trusted road."
  fallout.event_log.permit_market.detail.callback_success: "The delayed permit review survived the next winter and remained answerable."
  fallout.event_log.permit_market.detail.callback_partial: "The delayed permit review survived only where lamps and medicine held."
  fallout.event_log.permit_market.detail.callback_failure: "The delayed permit review collapsed under fatigue and missing pages."
  fallout.event_log.permit_market.detail.cancelled: "The permit market chain was not completed and its reserved memory was released."
