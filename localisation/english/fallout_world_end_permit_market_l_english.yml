l_english:
  chaosx.fallout.698.t: "Permit Market"
  chaosx.fallout.698.d: "The Quarantine State discovers that paper movement permits are being traded at the ash gate. The clinic still controls the red seal, the roads are freezing, and a market has formed where a public rule should stand. The state must decide whether access is a service, a record, or a price."
  chaosx.fallout.698.a: "Issue local passes"
  chaosx.fallout.698.a.tt: "Spend food, medicine, and recognition to issue free passes through ward offices. This restores movement and trust while consuming the reserve needed to keep the permit desks open."
  chaosx.fallout.698.b: "Audit every register"
  chaosx.fallout.698.b.tt: "Spend medicine, fuel, and recognition on a full registry audit. This improves disease control and evidence quality, but the audit slows travel and exhausts the inspection staff."
  chaosx.fallout.698.c: "Delegate permits to the wards"
  chaosx.fallout.698.c.tt: "Spend food, scrap, and recognition to let ward councils issue and appeal permits. This can rebuild local trust, but rival lists may split the road into competing jurisdictions."
  chaosx.fallout.698.d: "Sell temporary permits"
  chaosx.fallout.698.d.tt: "Spend medicine, fuel, and power to run a temporary paid permit market. This preserves the central registry and funds repairs, but it risks turning movement into a privilege."
  chaosx.fallout.700.t: "The Road Has a Price"
  chaosx.fallout.700.issue.success.d: "Local offices issued passes by household and kept the clinic's red seal attached to a reviewable record. The ash road opened for work and care, and the Quarantine State gained a movement rule that did not depend on a single guard."
  chaosx.fallout.700.issue.partial.d: "Most wards received local passes, but the food reserve could not keep every desk open. Travel resumed unevenly, and each new fever will test whether the free list survives the next shortage."
  chaosx.fallout.700.issue.failure.d: "The local desks ran out of medicine and paper before the first full list was copied. The gates stayed shut, the permits became favors, and the road grievance deepened around an empty public promise."
  chaosx.fallout.700.audit.success.d: "The audit compared clinic seals, ward ledgers, and the names carried by the winter teams. False permits were removed without erasing legitimate travel, and the registry became evidence rather than a second cordon."
  chaosx.fallout.700.audit.partial.d: "The audit found the worst duplicate passes, but fuel shortages left two outer wards on separate calendars. Disease control improved while the market learned to wait for the next gap in the ledger."
  chaosx.fallout.700.audit.failure.d: "The audit convoy lost power at the frozen archive. Inspectors returned with partial pages, the old permits kept circulating, and the registry failed as both a health tool and a public promise."
  chaosx.fallout.700.delegate.success.d: "Ward councils issued permits in public sessions and kept one appeal book beside the clinic register. The road reopened by local agreement, and the Quarantine State gained a shared memory of who could move and why."
  chaosx.fallout.700.delegate.partial.d: "The ward councils named a common rule but could not fund every appeal. Most households moved again, while two districts kept rival lists that made the next inspection a political test."
  chaosx.fallout.700.delegate.failure.d: "The councils turned the permit desks into rival courts. Names disappeared between ledgers, the appeal queue became another border, and the road no longer carried one meaning from the clinic to the outer farms."
  chaosx.fallout.700.sell.success.d: "The temporary market funded lamps, paper, and a second registry. Paid access was limited by household exemptions, so the state preserved a public route without pretending that the winter reserve was endless."
  chaosx.fallout.700.sell.partial.d: "The market raised enough for the central desk but pushed poorer households into delayed travel. The registry survived, while the Quarantine State carried a durable grievance about who could afford a clean certificate."
  chaosx.fallout.700.sell.failure.d: "The paid desks collected fees without restoring the road. Medicine and power ran out, brokers kept the best passes, and the permit market became a visible proof that the cordon could be bought but not trusted."
  chaosx.fallout.700.a: "Record the movement ruling"
  chaosx.fallout.700.a.tt: "Record the branch and its delayed result in the Quarantine State's cause memory. A later review will test whether the permit rule survived the next winter."
  chaosx.fallout.702.t: "The Ledger Returns"
  chaosx.fallout.702.success.d: "Seven months later, ward passes and the clinic register still answer to one appeal book. The road is not free of fear, but officers inherit a movement record that can be checked instead of guessed."
  chaosx.fallout.702.partial.d: "The permit rule survived where lamps and medicine held. The wards remember the correction, while the outer streets still decide which list to trust when the next fever arrives."
  chaosx.fallout.702.failure.d: "The permit rule collapsed under fatigue and missing pages. Brokers reclaimed the gaps, households stopped expecting an answer, and every new officer must decide whether to reopen the market or hide it."
  chaosx.fallout.702.a: "Close the permit review"
  chaosx.fallout.702.a.tt: "Release the delayed cleanup receipt and preserve the Quarantine State's memory of the permit dispute."
