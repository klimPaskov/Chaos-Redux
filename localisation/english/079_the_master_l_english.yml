l_english:
chaosx.nr79.1.t: "The Battle for a minor"
chaosx.nr79.1.d: "Our nation must defend a neutral minor that enemy forces are pressuring. If the minor joins our enemies, our position in the region will weaken."
chaosx.nr79.1.a: "We are the Master!"

chaosx.nr79.2.t: "[?global.minor_to_attract.GetName] is ours!"
chaosx.nr79.2.d: "Our diplomats have brought [?global.minor_to_attract.GetName] into our camp. The new ally will follow our foreign policy and support our plans in the region."
chaosx.nr79.2.a: "Well worth it!"

chaosx.news.66.t: "The Master"
chaosx.news.66.d: "[FROM.GetName] has won a minor country away from the major powers that contested it. The new ally now follows [FROM.GetName]'s diplomacy and military plans."
chaosx.news.66.a: "Spread love everywhere you go"
