l_english:
 fallout_usa_federal_continuity_focus_tree: "Federal Continuity Layer"
 fallout_usa_federal_continuity_ledger: "Reconcile the Federal Ledger"
 fallout_usa_federal_continuity_ledger_desc: "The surviving federal offices compare shelter rolls, state charters, and the sealed records carried out of Washington. The work gives the continuity government a common list of people it can still protect."
 fallout_usa_shelter_registry: "Open the Shelter Registry"
 fallout_usa_shelter_registry_desc: "County engineers reopen the registry rooms beneath the eastern cities. Each entry names a place, a watch rotation, and a repair crew that can reach it before the next ash front."
 fallout_usa_supply_corridors: "Repair the Inland Corridors"
 fallout_usa_supply_corridors_desc: "Rail crews clear the frozen approaches to the capital and reconnect the roads that carry grain, filters, and boiler fuel. The corridor is a working promise between the federal center and the interior counties."
 fallout_usa_guard_compacts: "Sign Guard Compacts"
 fallout_usa_guard_compacts_desc: "State guards retain their local oaths while accepting one federal rule for convoy protection. The compact leaves county commanders room to respond to winter roads without turning every patrol into a private army."
 fallout_usa_bilateral_reconstruction: "Recognize Regional Partners"
 fallout_usa_bilateral_reconstruction_desc: "The continuity government recognizes the councils that kept their water plants and clinics open. Their charters become bilateral instruments for rebuilding rather than orders issued from a distant capital."
 fallout_usa_continental_radio_net: "Link the Continental Radio Net"
 fallout_usa_continental_radio_net_desc: "Relay crews align the surviving transmitters across the Great Lakes and the mountain passes. The network reports blocked roads, contaminated wells, and safe landing fields in the same language."
 fallout_usa_federal_reconstruction: "Rebuild the Federal Compact"
 fallout_usa_federal_reconstruction_desc: "The federal ledger, repaired corridors, guard compacts, and regional charters now describe one government with several working hands. Reconstruction can proceed without pretending that the old map survived intact."
 fallout_usa_federal_continuity_ledger_idea: "Federal Continuity Ledger"
 fallout_usa_federal_continuity_ledger_idea_desc: "A current register joins shelter rolls, state charters, and supply obligations for the North American continuity government."
 fallout_usa_shelter_registry_idea: "Shelter Registry"
 fallout_usa_shelter_registry_idea_desc: "Eastern shelter registries coordinate repairs and local defense around the federal capital."
 fallout_usa_guard_compact_idea: "Guard Compacts"
 fallout_usa_guard_compact_idea_desc: "County guards protect federal convoys under a common compact while retaining local command."
 fallout_usa_federal_reconstruction_idea: "Federal Reconstruction"
 fallout_usa_federal_reconstruction_idea_desc: "The continuity government has rebuilt a dependable administrative and supply framework across its surviving states."
