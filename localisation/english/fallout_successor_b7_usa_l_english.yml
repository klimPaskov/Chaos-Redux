l_english:
 fallout_usa_federal_continuity_focus_tree: "Federal Continuity Layer"
 fallout_usa_federal_continuity_ledger: "Reconcile the Federal Ledger"
 fallout_usa_federal_continuity_ledger_desc: "The surviving federal offices compare shelter rolls, state charters, and the sealed records carried out of Washington. The work gives the continuity government a common list of people it can still protect."
 fallout_usa_shelter_registry: "Open the Shelter Registry"
 fallout_usa_shelter_registry_desc: "County engineers reopen the registry rooms beneath the eastern cities. Each entry names a place, a watch rotation, and a repair crew that can reach it before the next ash front."
 fallout_usa_supply_corridors: "Repair the Inland Corridors"
 fallout_usa_supply_corridors_desc: "Rail crews clear the frozen approaches to the capital and reconnect the roads that carry grain, filters, and boiler fuel. The corridor is a working promise between the federal center and the interior counties."
 fallout_usa_guard_compacts: "Sign Guard Compacts"
 fallout_usa_guard_compacts_desc: "State guards retain their local oaths while accepting one federal rule for convoy protection. The compact leaves county commanders room to respond to winter roads without turning every patrol into a private army."
 fallout_usa_bilateral_reconstruction: "Recognize Regional Partners"
 fallout_usa_bilateral_reconstruction_desc: "The continuity government recognizes the councils that kept their water plants and clinics open. Their charters become bilateral instruments for rebuilding rather than orders issued from a distant capital."
 fallout_usa_continental_radio_net: "Link the Continental Radio Net"
 fallout_usa_continental_radio_net_desc: "Relay crews align the surviving transmitters across the Great Lakes and the mountain passes. The network reports blocked roads, contaminated wells, and safe landing fields in the same language."
 fallout_usa_federal_reconstruction: "Rebuild the Federal Compact"
 fallout_usa_federal_reconstruction_desc: "The federal ledger, repaired corridors, guard compacts, and regional charters now describe one government with several working hands. Reconstruction can proceed without pretending that the old map survived intact."
 fallout_usa_federal_continuity_ledger_idea: "Federal Continuity Ledger"
 fallout_usa_federal_continuity_ledger_idea_desc: "A current register joins shelter rolls, state charters, and supply obligations for the North American continuity government."
 fallout_usa_shelter_registry_idea: "Shelter Registry"
 fallout_usa_shelter_registry_idea_desc: "Eastern shelter registries coordinate repairs and local defense around the federal capital."
 fallout_usa_guard_compact_idea: "Guard Compacts"
 fallout_usa_guard_compact_idea_desc: "County guards protect federal convoys under a common compact while retaining local command."
 fallout_usa_federal_reconstruction_idea: "Federal Reconstruction"
 fallout_usa_federal_reconstruction_idea_desc: "The continuity government has rebuilt a dependable administrative and supply framework across its surviving states."
 fallout_usa_continuity_projects_category: "Continuity Projects"
 fallout_usa_continuity_projects_category_desc: "The federal continuity government chooses which surviving institutions receive scarce trains, equipment, command authority, and working capital. Each project is tied to the North American receipt and closes when the capital is lost."
 fallout_usa_repair_inland_depot: "Rebuild the Inland Depot Belt"
 fallout_usa_repair_inland_depot_desc: "Rail crews use the repaired supply corridor to restore the federal capital's inland depot belt. The program consumes rifles and trains while one civilian factory remains assigned to the work."
 fallout_usa_repair_inland_depot_cost: "Consumes [?constant:fallout_successor_b7_project.depot_infantry_equipment|0] infantry equipment and [?constant:fallout_successor_b7_project.depot_train_equipment|0] trains. Assigns [?constant:fallout_successor_b7_project.depot_civilian_factories|0] civilian factory for [?constant:fallout_successor_b7_project.depot_duration|0] days."
 fallout_usa_repair_inland_depot_cost_blocked: "Unavailable: needs the listed infantry equipment, trains, and a spare civilian factory while the capital remains controlled."
 fallout_usa_repair_inland_depot_effect_tt: "The federal capital receives two infrastructure levels and one railway level. The logistics memory records a repaired inland depot belt."
 fallout_usa_muster_guard_compacts: "Muster the Guard Compacts"
 fallout_usa_muster_guard_compacts_desc: "County guards report to the common convoy rule. The federal staff spends trained manpower, rifles, support stores, and command authority to make the compact enforceable."
 fallout_usa_muster_guard_compacts_cost: "Consumes [?constant:fallout_successor_b7_project.guard_manpower|0] manpower, [?constant:fallout_successor_b7_project.guard_infantry_equipment|0] infantry equipment, [?constant:fallout_successor_b7_project.guard_support_equipment|0] support equipment, and [?constant:fallout_successor_b7_project.guard_command_power|0] Command Power."
 fallout_usa_muster_guard_compacts_cost_blocked: "Unavailable: needs the listed manpower, weapons, support stores, and Command Power while the capital remains controlled."
 fallout_usa_muster_guard_compacts_effect_tt: "The federal guard gains a staffed reserve, 25 Army Experience, and 6 percent War Support. The security memory records the compact as enforceable."
 fallout_usa_ratify_lakes_charter: "Ratify the Great Lakes Charter"
 fallout_usa_ratify_lakes_charter_desc: "The councils around the Great Lakes receive a written charter for water, grain, and rail access. Convoys and command authority are spent to make recognition reciprocal rather than ceremonial."
 fallout_usa_ratify_lakes_charter_cost: "Consumes [?constant:fallout_successor_b7_project.charter_convoys|0] convoys and [?constant:fallout_successor_b7_project.charter_command_power|0] Command Power."
 fallout_usa_ratify_lakes_charter_cost_blocked: "Unavailable: needs the listed convoys and Command Power while the capital remains controlled."
 fallout_usa_ratify_lakes_charter_effect_tt: "The federal government gains 8 percent Stability and 75 Political Power. The diplomacy memory records a recognized Great Lakes charter."
 fallout_usa_sweep_radio_dead_zones: "Sweep the Radio Dead Zones"
 fallout_usa_sweep_radio_dead_zones_desc: "Relay crews carry support stores into the dead zones between the Great Lakes and the mountain passes. Command authority is spent to keep the reports tied to real roads and clinics."
 fallout_usa_sweep_radio_dead_zones_cost: "Consumes [?constant:fallout_successor_b7_project.radio_support_equipment|0] support equipment and [?constant:fallout_successor_b7_project.radio_command_power|0] Command Power."
 fallout_usa_sweep_radio_dead_zones_cost_blocked: "Unavailable: needs the listed support stores and Command Power while the capital remains controlled."
 fallout_usa_sweep_radio_dead_zones_effect_tt: "The radio service gains 10 Air Experience and 10 Command Power. The information memory records the dead zones as surveyed."
 fallout_usa_launch_federal_reconstruction_drive: "Launch the Federal Reconstruction Drive"
 fallout_usa_launch_federal_reconstruction_drive_desc: "The rebuilt compact opens a final capital works program. Trains and a civilian factory are tied up until the federal center can produce more than records and orders."
 fallout_usa_launch_federal_reconstruction_drive_cost: "Consumes [?constant:fallout_successor_b7_project.reconstruction_train_equipment|0] trains and assigns [?constant:fallout_successor_b7_project.reconstruction_civilian_factories|0] civilian factory for [?constant:fallout_successor_b7_project.reconstruction_duration|0] days."
 fallout_usa_launch_federal_reconstruction_drive_cost_blocked: "Unavailable: needs the listed trains and a spare civilian factory while the capital remains controlled."
 fallout_usa_launch_federal_reconstruction_drive_effect_tt: "The federal capital receives one industrial complex and one infrastructure level. The reconstruction memory records a functioning federal works program."
 fallout_usa_continuity_project_cancelled_tt: "The continuity project failed when the federal capital or its current Fallout receipt ceased to be valid. Stability and War Support fall by 4 percent."
