l_english:
concentration: "Legacy Occupation Policy"
concentration_desc: "This obsolete policy is retained only to migrate existing references to military administration."
cbrn_coercive_security_occupation: "CBRN Coercive Security"
cbrn_coercive_security_occupation_desc: "Occupation forces establish sealed security zones, protected patrol routes, and chemical-control detachments. The system can support targeted nerve-agent suppression where national policy permits it. Garrison and protective-equipment burdens rise, local production falls, and coercion slows compliance."
cbrn_protected_occupation_administration: "Protected Occupation Administration"
cbrn_protected_occupation_administration_desc: "Garrisons and local services receive protective equipment, decontamination support, and contamination-response plans. The policy raises occupation costs while improving compliance and limiting losses in contaminated territory. Offensive nerve-agent suppression is prohibited."
