l_english:
africa_world_package.100.t: "The Crossroads Congress"
africa_world_package.100.d: "Delegates from the desert routes, the river basins, the ports, and the holy cities have arrived. The first docket must decide whether the congress can replace foreign mandates with guarantees that its own communities will accept."
africa_world_package.100.a: "Seat the mandate-exit board"
africa_world_package.100.a.tt: "Open the Crossroads mandate-exit dispute and begin the founding crisis."
africa_world_package.101.t: "Mandates, Water, and Protected Routes"
africa_world_package.101.d: "Every delegation has brought a different measure of sovereignty. The board can press for a full settlement when the relevant Crossroads institutions are strong enough, accept a negotiated compromise, or adjourn without a common law."
africa_world_package.101.a: "Ratify a full Crossroads settlement"
africa_world_package.101.a.tt: "A strong package balance secures the board's full settlement, raising authority and legitimacy and ending the founding problem."
africa_world_package.101.b: "Sign a negotiated compromise"
africa_world_package.101.b.tt: "A compromise raises authority and legitimacy while leaving a visible cost in holy-site legitimacy."
africa_world_package.101.c: "Adjourn without a settlement"
africa_world_package.101.c.tt: "The founding balance loses authority, legitimacy, minority guarantees, and water security. A later lifecycle crisis will reopen the congress."
africa_world_package.102.t: "The Crossroads Settlement Holds"
africa_world_package.102.d: "The mandate-exit board has accepted a common law. The Crossroads balance now has enough authority to carry its regional guarantees into the shared lanes."
africa_world_package.102.a: "Publish the settlement"
africa_world_package.102.a.tt: "The founding crisis is resolved with a full settlement. The founding problem is removed and the package gains authority, legitimacy, Arab compact, and minority guarantees."
africa_world_package.103.t: "A Compromise at the Crossroads"
africa_world_package.103.d: "No delegation received every safeguard it requested, but the congress has chosen a common docket over another mandate. The unresolved questions will remain visible in the shared lanes."
africa_world_package.103.a: "Publish the compromise"
africa_world_package.103.a.tt: "The founding crisis is resolved by compromise. The founding problem is removed, while the package gains smaller authority, legitimacy, and holy-site legitimacy."
africa_world_package.104.t: "The Crossroads Congress Breaks"
africa_world_package.104.d: "The board could not align mandates, resources, and guarantees. Delegates have left with the founding problem still in force, and the next crisis will test whether the congress can be repaired."
africa_world_package.104.a: "Record the failed docket"
africa_world_package.104.a.tt: "The founding problem remains. A lifecycle crisis will reopen the Crossroads docket after a short review period."
africa_world_package.105.t: "Ratify the Shared Crossroads Lane"
africa_world_package.105.d: "A route-specific lane has reached the common docket. Ratifying it as written strengthens authority and legitimacy. A transitional accord keeps the lane open while accepting a smaller legitimacy cost."
africa_world_package.105.a: "Ratify the lane as written"
africa_world_package.105.a.tt: "Record a full shared-lane ratification, increasing package legitimacy and stability."
africa_world_package.105.b: "Adopt a transitional accord"
africa_world_package.105.b.tt: "Record a transitional shared-lane accord, increasing legitimacy while sacrificing some authority and holy-site legitimacy."
africa_world_package.106.t: "The Crossroads Lifecycle Crisis"
africa_world_package.106.d: "The failed founding docket has returned as a practical crisis. The congress can authorize an emergency guarantee, reopen the water and holy-site boards, or defer again and accept a deeper loss of authority."
africa_world_package.106.a: "Issue an emergency guarantee"
africa_world_package.106.a.tt: "Resolve the lifecycle crisis with a full repair, restoring authority, legitimacy, water security, and holy-site legitimacy."
africa_world_package.106.b: "Reopen the guarantees board"
africa_world_package.106.b.tt: "Resolve the lifecycle crisis through compromise, restoring authority, legitimacy, and minority guarantees."
africa_world_package.106.c: "Defer the docket again"
africa_world_package.106.c.tt: "Keep the lifecycle crisis open, losing authority, holy-site legitimacy, and oil sovereignty before the next review."

africa_world_package.200.t: "The Continental Settlement Conference"
africa_world_package.200.d: "European delegations have brought border claims, reconstruction plans, and the unsettled debts of empire. The conference must choose which ledger will carry the first test of continental sovereignty."
africa_world_package.200.a: "Seat the border and debt boards"
africa_world_package.200.a.tt: "Open the Continental Settlement founding crisis and begin the selected board's negotiations."
africa_world_package.201.t: "Borders, Reconstruction, and Colonial Debt"
africa_world_package.201.d: "The conference can ratify a full settlement when the relevant European ledger is ready. It can also accept a compromise that preserves the conference, or fail and leave the post-war docket unresolved."
africa_world_package.201.a: "Ratify a full continental settlement"
africa_world_package.201.a.tt: "A strong European balance secures a full settlement, raising authority, legitimacy, and border settlement while reducing war memory."
africa_world_package.201.b: "Sign a negotiated compromise"
africa_world_package.201.b.tt: "A compromise raises authority, legitimacy, and ideological balance while leaving the harder border and debt questions for the shared lanes."
africa_world_package.201.c: "Break off the conference"
africa_world_package.201.c.tt: "The failed conference loses authority, legitimacy, border settlement, and war memory while increasing colonial debt. A lifecycle crisis will follow."
africa_world_package.202.t: "A Continental Law Takes Shape"
africa_world_package.202.d: "The European conference has aligned its first guarantees. A border, reconstruction, or debt settlement can now be carried into the common defence and withdrawal lanes."
africa_world_package.202.a: "Publish the continental settlement"
africa_world_package.202.a.tt: "The founding crisis ends with a full settlement. The founding problem is removed and the package gains authority, legitimacy, border settlement, and lower war memory."
africa_world_package.203.t: "A Compromise for the Continent"
africa_world_package.203.d: "The conference has chosen a workable treaty over a perfect one. The ideological balance is stronger, but the remaining debt and border questions will be contested in the shared lanes."
africa_world_package.203.a: "Publish the compromise"
africa_world_package.203.a.tt: "The founding crisis ends by compromise. The founding problem is removed and the package gains smaller authority, legitimacy, and ideological balance."
africa_world_package.204.t: "The Continental Conference Fails"
africa_world_package.204.d: "Border guarantees and the colonial debt docket could not be reconciled. The founding problem remains, and a later crisis will decide whether the conference can be repaired without another rupture."
africa_world_package.204.a: "Record the failed conference"
africa_world_package.204.a.tt: "The founding problem remains. A lifecycle crisis will reopen the continental docket after a short review period."
africa_world_package.205.t: "Ratify the Shared Continental Lane"
africa_world_package.205.d: "A common defence, withdrawal law, or post-colonial treaty has reached the shared docket. Full ratification strengthens legitimacy and stability. A transitional accord keeps the lane open while accepting a smaller sovereignty cost."
africa_world_package.205.a: "Ratify the lane as written"
africa_world_package.205.a.tt: "Record a full shared-lane ratification, increasing package legitimacy, industrial integration, and stability."
africa_world_package.205.b: "Adopt a transitional accord"
africa_world_package.205.b.tt: "Record a transitional shared-lane accord, increasing legitimacy and war memory while sacrificing some national sovereignty."
africa_world_package.206.t: "The Continental Lifecycle Crisis"
africa_world_package.206.d: "The failed conference has returned as a practical crisis. The continent can issue a reparations and border guarantee, reopen the defence docket, or defer again and accept a deeper loss of authority."
africa_world_package.206.a: "Issue a continental guarantee"
africa_world_package.206.a.tt: "Resolve the lifecycle crisis with a full repair, restoring authority, legitimacy, border settlement, and reducing colonial debt."
africa_world_package.206.b: "Reopen the reconstruction docket"
africa_world_package.206.b.tt: "Resolve the lifecycle crisis through compromise, restoring authority, legitimacy, and ideological balance."
africa_world_package.206.c: "Defer the docket again"
africa_world_package.206.c.tt: "Keep the lifecycle crisis open, losing authority and border settlement while increasing war memory and colonial debt before the next review."

africa_crossroads_convene_mandate_exit_board: "Convene the Mandate-Exit Board"
africa_crossroads_convene_mandate_exit_board_desc: "Replace foreign mandates with an Arab compact, minority guarantees, and a lawful transition for the holy cities."
africa_crossroads_convene_mandate_exit_board_tt: "Open the Crossroads mandate-exit founding board and begin its event negotiation."
africa_crossroads_allocate_water_food_and_pipeline_access: "Allocate Water, Food, and Pipeline Access"
africa_crossroads_allocate_water_food_and_pipeline_access_desc: "Set a consent-based water, food, pipeline, and port settlement that balances water security, oil sovereignty, and Persian influence."
africa_crossroads_allocate_water_food_and_pipeline_access_tt: "Open the Crossroads water, food, and pipeline board and begin its event negotiation."
africa_crossroads_ratify_protected_routes_and_holy_sites: "Ratify Protected Routes and Holy Sites"
africa_crossroads_ratify_protected_routes_and_holy_sites_desc: "Guarantee transit and holy sites while protecting minorities and balancing Anatolian power."
africa_crossroads_ratify_protected_routes_and_holy_sites_tt: "Open the Crossroads protected-routes and holy-sites board and begin its event negotiation."

africa_europe_arbitrate_border_and_minority_guarantees: "Arbitrate Border and Minority Guarantees"
africa_europe_arbitrate_border_and_minority_guarantees_desc: "Settle borders and minority guarantees without replacing national sovereignty with a new mandate."
africa_europe_arbitrate_border_and_minority_guarantees_tt: "Open the Continental Settlement border-arbitration board and begin its event negotiation."
africa_europe_allocate_reconstruction_and_industrial_access: "Allocate Reconstruction and Industrial Access"
africa_europe_allocate_reconstruction_and_industrial_access_desc: "Direct reconstruction, rail, and industrial access toward a shared settlement while balancing ideological blocs."
africa_europe_allocate_reconstruction_and_industrial_access_tt: "Open the Continental Settlement reconstruction board and begin its event negotiation."
africa_europe_settle_colonial_debt_and_external_guarantees: "Settle Colonial Debt and External Guarantees"
africa_europe_settle_colonial_debt_and_external_guarantees_desc: "Reduce colonial debt through enforceable external guarantees, keeping borders and sovereign consent visible in the treaty."
africa_europe_settle_colonial_debt_and_external_guarantees_tt: "Open the Continental Settlement colonial-debt board and begin its event negotiation."
