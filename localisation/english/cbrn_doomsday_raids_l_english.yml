l_english:
raid_type_chemical_stockpile_doomsday_raid: "Chemical Doomsday Release"
raid_type_chemical_stockpile_doomsday_raid_desc: "Prepare a last-resort chemical release over every eligible state you control, with the selected state as the raid target. Preparation sets aside one chlorine, phosgene, mustard, and lewisite cylinder. If authorization and the target are still valid at launch, the release then uses all remaining stocks and spreads their lots across eligible states. Local protection limits casualties and contamination, and confirmed use brings public Condemnation. Requires a fascist government at war, near capitulation, and the Unrestricted Chaos Warfare policy. Costs 25 Command Power."
chemical_doomsday_raid_failure_tt: "The release fails and the national cylinder stockpile stays untouched. The assigned division suffers heavy losses of organization and strength."
chemical_doomsday_raid_limited_tt: "The release order is not carried through, and the wider cylinder stockpile stays under guard. The assigned division suffers moderate losses of organization and strength."
chemical_doomsday_raid_success_tt: "If authorization and the target are still valid, the chlorine, phosgene, mustard, and lewisite stockpiles are released over every eligible state you control, causing deaths, disruption, and contamination. Confirmed use brings Condemnation."
chemical_doomsday_raid_critical_tt: "If authorization and the target are still valid, all four chemical stockpiles are released over every eligible state you control. Contamination lingers after the operation, and confirmed responsibility brings Condemnation."

raid_type_biological_stockpile_doomsday_raid: "Biological Doomsday Release"
raid_type_biological_stockpile_doomsday_raid_desc: "Prepare a last-resort pathogen release over every eligible state you control and the enemy-held states that border them, with the selected state as the raid target. Preparation sets aside one anthrax, plague, tularemia, and smallpox bomb. If authorization and the target are still valid at launch, the release then uses all remaining stocks. The pathogens can spread across borders and bring extreme Condemnation. Requires an unrestricted CBRN route or extreme-use policy and a last-resort condition. Costs 25 Command Power."
biological_doomsday_raid_failure_tt: "The release fails and the national pathogen stockpile stays untouched. The assigned division suffers heavy losses of organization and strength."
biological_doomsday_raid_limited_tt: "The release order is not carried through, and the wider pathogen stockpile stays under guard. The assigned division suffers moderate losses of organization and strength."
biological_doomsday_raid_success_tt: "If authorization and the target are still valid, the anthrax, plague, tularemia, and smallpox stockpiles are released over every eligible state you control and the enemy-held states that border them. Each pathogen then runs its own incubation and outbreak."
biological_doomsday_raid_critical_tt: "If authorization and the target are still valid, all four pathogen stockpiles are released over every eligible state you control and the enemy-held states that border them. Confirmed responsibility brings Condemnation, and disease may spread farther."
