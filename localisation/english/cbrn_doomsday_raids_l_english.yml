l_english:
raid_type_chemical_stockpile_doomsday_raid: "Chemical Doomsday Release"
raid_type_chemical_stockpile_doomsday_raid_desc: "Prepare a terminal release across eligible controlled states. The selected state anchors the raid. Preparation reserves one chlorine, phosgene, mustard, and lewisite cylinder. A successful release consumes every remaining cylinder in those stockpiles and distributes the real lots across the release zone. Local protection shapes deaths, military disruption, contamination, evidence, and public Condemnation wherever a lot is delivered. Requires a fascist government at war, near capitulation, and the Unrestricted Chaos Warfare policy. The raid costs 25 Command Power."
chemical_doomsday_raid_failure_tt: "The terminal release failed. The remaining national cylinder stockpiles were not released."
chemical_doomsday_raid_limited_tt: "The release order could not be carried through. The wider cylinder stockpiles remain under guard."
chemical_doomsday_raid_success_tt: "The four reserved cylinders and every remaining chlorine, phosgene, mustard, and lewisite cylinder were committed across eligible controlled states. Deaths, disruption, contamination, confirmed use, and Condemnation follow where real lots were delivered."
chemical_doomsday_raid_critical_tt: "The terminal chemical release committed all four cylinder stockpiles across the eligible zone. Contamination and confirmed public responsibility will outlast the operation."

raid_type_biological_stockpile_doomsday_raid: "Biological Doomsday Release"
raid_type_biological_stockpile_doomsday_raid_desc: "Prepare a terminal pathogen release across eligible controlled states and adjacent enemy-held border states. The selected state anchors the raid. Preparation reserves one anthrax, plague, tularemia, and smallpox payload. A successful release consumes every remaining payload in those stockpiles and distributes the real lots across the release zone. Incubation, medical response, cross-border spread, confirmed responsibility, and extreme Condemnation follow wherever an agent is delivered. Requires an unrestricted CBRN route or extreme-use policy and a last-resort condition. The raid costs 25 Command Power."
biological_doomsday_raid_failure_tt: "The terminal release failed. The remaining national pathogen stockpiles were not released."
biological_doomsday_raid_limited_tt: "The release order could not be carried through. The wider pathogen stockpiles remain under guard."
biological_doomsday_raid_success_tt: "The four reserved payloads and every remaining anthrax, plague, tularemia, and smallpox payload were committed across eligible controlled and enemy-held border states. Delivered agents enter their own incubation and outbreak courses."
biological_doomsday_raid_critical_tt: "The terminal pathogen release committed all four agent stockpiles across the domestic and enemy-front zone. Confirmed responsibility, public Condemnation, and the danger of further spread remain."
