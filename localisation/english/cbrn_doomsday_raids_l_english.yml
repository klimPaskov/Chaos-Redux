l_english:
raid_type_chemical_stockpile_doomsday_raid: "Chemical Doomsday Release"
raid_type_chemical_stockpile_doomsday_raid_desc: "Prepare a terminal chemical release across eligible controlled states, using the selected state as the raid target. Preparation collects one chlorine, phosgene, mustard, and lewisite cylinder. If the final authorization and target checks pass, the release consumes the remaining stocks and distributes their lots across eligible states. Local protection limits casualties and contamination, while confirmed use brings public Condemnation. Requires a fascist government at war, near capitulation, and the Unrestricted Chaos Warfare policy. Costs 25 Command Power."
chemical_doomsday_raid_failure_tt: "The terminal release failed. The remaining national cylinder stockpiles were not released."
chemical_doomsday_raid_limited_tt: "The release order could not be carried through. The wider cylinder stockpiles remain under guard."
chemical_doomsday_raid_success_tt: "If authorization and the selected target remain valid, chlorine, phosgene, mustard, and lewisite stocks are released across eligible controlled states. Delivered lots can cause deaths, disruption, and contamination. Confirmed use brings Condemnation."
chemical_doomsday_raid_critical_tt: "If authorization and the selected target remain valid, all four chemical stocks are released across eligible controlled states. Contamination and confirmed public responsibility can outlast the operation."

raid_type_biological_stockpile_doomsday_raid: "Biological Doomsday Release"
raid_type_biological_stockpile_doomsday_raid_desc: "Prepare a terminal pathogen release across eligible controlled states and adjacent enemy-held border states, using the selected state as the raid target. Preparation collects one anthrax, plague, tularemia, and smallpox payload. If final authorization and target checks pass, the release consumes the remaining stocks and distributes their lots across eligible states. Delivered agents can spread disease across borders and bring extreme Condemnation. Requires an unrestricted CBRN route or extreme-use policy and a last-resort condition. Costs 25 Command Power."
biological_doomsday_raid_failure_tt: "The terminal release failed. The remaining national pathogen stockpiles were not released."
biological_doomsday_raid_limited_tt: "The release order could not be carried through. The wider pathogen stockpiles remain under guard."
biological_doomsday_raid_success_tt: "If authorization and the selected target remain valid, anthrax, plague, tularemia, and smallpox stocks are released across eligible controlled and enemy-held border states. Delivered agents enter their own incubation and outbreak courses."
biological_doomsday_raid_critical_tt: "If authorization and the selected target remain valid, all four pathogen stocks are released across eligible controlled and enemy-held border states. Confirmed responsibility brings Condemnation, and disease may spread farther."
