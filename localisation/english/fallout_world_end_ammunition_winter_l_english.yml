l_english:
  chaosx.fallout.534.t: "The Ammunition Winter"
  chaosx.fallout.534.intro: "The state armoury has enough rounds for a few hard engagements, not a season. Snow has buried the old roads, and every patrol burns fuel that cannot be replaced. A railway clerk has marked private caches on a hand drawn map. The militia wants a promise before it opens the doors."
  chaosx.fallout.534.a: "Shorten the patrol routes"
  chaosx.fallout.534.a.tt: "Pull patrols back to the inhabited roads. Defence around the depot improves, but outlying farms will be left to their own watch."
  chaosx.fallout.534.b: "Melt civilian metal"
  chaosx.fallout.534.b.tt: "Strip rail fittings and household tools for a small arms run. The work is quick, loud, and difficult to hide."
  chaosx.fallout.534.c: "Trade food for cartridges"
  chaosx.fallout.534.c.tt: "Send winter stores to the river market in exchange for ammunition. The bargain can steady the town or make hunger visible."
  chaosx.fallout.534.d: "Seize private arms"
  chaosx.fallout.534.d.tt: "Register and confiscate weapons from households. The depot gains control, while the neighbourhoods decide whether the law still protects them."
  chaosx.fallout.536.t: "The quartermaster's answer"
  chaosx.fallout.536.reduce_patrols.success.d: "The patrol map is redrawn around the wells and the depot. No sentry is lost, and the first winter convoy reaches the line with its ammunition intact."
  chaosx.fallout.536.reduce_patrols.partial.d: "The shorter routes save fuel, but two farm roads go dark. A local watch returns with a damaged radio and a list of names that will not patrol again."
  chaosx.fallout.536.reduce_patrols.failure.d: "The retreat leaves the wrong road open. A raiding party reaches the stores, and the armoury loses both crates and the confidence of the outer villages."
  chaosx.fallout.536.melt_civilian_metal.success.d: "The foundry crew turns rail shoes, stove plates, and farm hinges into usable casings. The new stock is modest, but the work gives the winter militia a reason to stand together."
  chaosx.fallout.536.melt_civilian_metal.partial.d: "The furnace runs for three nights and produces rounds with uneven seals. The armourer accepts them for close defence, while the town counts the tools that disappeared."
  chaosx.fallout.536.melt_civilian_metal.failure.d: "The furnace cracks under the cold. Fire takes the shed, the remaining scrap is ruined, and a family sleeping nearby is carried out through the snow."
  chaosx.fallout.536.trade_food.success.d: "The river market honours the bargain. Grain leaves the storehouse, cartridges arrive before the thaw, and the traders record [This.GetName] as a government that pays."
  chaosx.fallout.536.trade_food.partial.d: "The market sends mixed lots and keeps a share of the grain. The depot can arm the gate, but the ration board must cut one meal from the town."
  chaosx.fallout.536.trade_food.failure.d: "The river ice breaks before the convoy arrives. Food is lost in the black water, and the merchants return with nothing but a warning about the next checkpoint."
  chaosx.fallout.536.seize_private_arms.success.d: "The registry is read aloud in every ward. Most households surrender old rifles after the militia guarantees a night watch, and the depot gains a disciplined reserve."
  chaosx.fallout.536.seize_private_arms.partial.d: "The confiscation fills one rack and empties three streets of trust. A few families keep hidden pistols, and every sergeant now has to negotiate before entering a home."
  chaosx.fallout.536.seize_private_arms.failure.d: "The seizure becomes a raid. Neighbours bar the doors, a shot is fired in the stairwell, and the remaining ammunition is divided among people who no longer answer to the depot."
  chaosx.fallout.536.a: "Record the winter ledger"
  chaosx.fallout.536.a.tt: "Accept the delayed result and send the militia to its next task."
  chaosx.fallout.538.t: "The next thaw"
  chaosx.fallout.538.success.d: "The first thaw exposes the old firing range. The militia returns with a clean inventory and a message from the villages that were left outside the patrol line."
  chaosx.fallout.538.partial.d: "Snowmelt reveals missing boxes and a second ledger. The armoury can account for most of the stock, though the local watch will keep its own count from now on."
  chaosx.fallout.538.failure.d: "The thaw brings no reconciliation. A burned storehouse and several unmarked graves make the ammunition shortage a permanent argument between the depot and the town."
  chaosx.fallout.538.a: "Close the ammunition case"
  chaosx.fallout.538.a.tt: "Seal the cause memory and release the delayed receipts."
  fallout.event_log.ammunition_winter.name: "The Ammunition Winter"
  fallout.event_log.ammunition_winter.detail: "[GetFalloutEvent534EventLogDetail]"
  fallout.event_log.ammunition_winter.reduce_patrols_success: "Patrol routes were shortened without losing the depot."
  fallout.event_log.ammunition_winter.reduce_patrols_partial: "Shortened patrols saved fuel and exposed outer roads."
  fallout.event_log.ammunition_winter.reduce_patrols_failure: "A shortened patrol line left the stores open to raiders."
  fallout.event_log.ammunition_winter.melt_civilian_metal_success: "Civilian metal became a small but reliable run of ammunition."
  fallout.event_log.ammunition_winter.melt_civilian_metal_partial: "The foundry produced uneven rounds and damaged civic trust."
  fallout.event_log.ammunition_winter.melt_civilian_metal_failure: "A failed furnace destroyed the workshop and winter stores."
  fallout.event_log.ammunition_winter.trade_food_success: "A food convoy returned from the river market with cartridges."
  fallout.event_log.ammunition_winter.trade_food_partial: "A costly food trade armed the gate but tightened rations."
  fallout.event_log.ammunition_winter.trade_food_failure: "The winter market convoy was lost in broken river ice."
  fallout.event_log.ammunition_winter.seize_private_arms_success: "A guarded registry brought private weapons into a trusted reserve."
  fallout.event_log.ammunition_winter.seize_private_arms_partial: "The registry filled the rack and left neighbourhoods wary."
  fallout.event_log.ammunition_winter.seize_private_arms_failure: "A seizure raid split the depot from the town."
  fallout.event_log.ammunition_winter.callback_success: "The thaw inventory restored a working ammunition compact."
  fallout.event_log.ammunition_winter.callback_partial: "The thaw inventory left a second ledger in local hands."
  fallout.event_log.ammunition_winter.callback_failure: "The thaw confirmed a lasting break between armoury and town."
