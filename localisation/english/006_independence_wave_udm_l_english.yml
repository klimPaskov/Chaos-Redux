  independence_wave_udm_cost_strategic_tooltip: "Strategic commitment: £stability_texticon §Y[?constant:independence_wave_decision_cost.stability_standard|%0]§!  £command_power §Y[?constant:independence_wave_decision_cost.command_power_standard|0]§!  £convoy_texticon £GFX_train_texticon §Y[?constant:independence_wave_decision_cost.convoy_standard|0]§!  £civ_factory §Y[?constant:independence_wave_udm_cost.civilian_factory_use|0]§!"
  independence_wave_udm_project_failure_effect_tt: "Workshop Control and Forest-Rail Readiness each fall by §R[?constant:independence_wave_udm_pressure.standard_gain|0]§!. Legitimacy, Recognition, State Capacity, and Security fall. Instability rises."
  independence_wave_udm_depots_effect_tt: "Workshop Control rises by §Y[?constant:independence_wave_udm_pressure.major_gain|0]§! and Forest-Rail Readiness rises by §Y[?constant:independence_wave_udm_pressure.minor_gain|0]§!. Legitimacy and State Capacity rise while Instability falls."
  independence_wave_udm_guards_effect_tt: "Workshop Control rises by §Y[?constant:independence_wave_udm_pressure.standard_gain|0]§! and Forest-Rail Readiness rises by §Y[?constant:independence_wave_udm_pressure.major_gain|0]§!. Legitimacy and Security rise while Instability falls."
  independence_wave_udm_communities_effect_tt: "Workshop Control rises by §Y[?constant:independence_wave_udm_pressure.major_gain|0]§! and Forest-Rail Readiness rises by §Y[?constant:independence_wave_udm_pressure.standard_gain|0]§!. The Cultural Register is established, public authority rises, and Instability falls."
  independence_wave_udm_host_ledgers_effect_tt: "Workshop Control and Forest-Rail Readiness each rise by §Y[?constant:independence_wave_udm_pressure.standard_gain|0]§!. The former host's property, border, population, and recognition claims are settled."
  independence_wave_udm_constitutional_effect_tt: "The Workshop Civic Union takes office. Workshop Control rises by §Y[?constant:independence_wave_udm_pressure.major_gain|0]§! and Forest-Rail Readiness rises by §Y[?constant:independence_wave_udm_pressure.minor_gain|0]§!."
  independence_wave_udm_cultural_effect_tt: "The Udmurt Land Compact takes office. Workshop Control rises by §Y[?constant:independence_wave_udm_pressure.major_gain|0]§! and Forest-Rail Readiness rises by §Y[?constant:independence_wave_udm_pressure.standard_gain|0]§!."
  independence_wave_udm_worker_effect_tt: "The Workshop and Rail Councils take office. Workshop Control rises by §Y[?constant:independence_wave_udm_pressure.minor_gain|0]§! and Forest-Rail Readiness rises by §Y[?constant:independence_wave_udm_pressure.major_gain|0]§!."
  independence_wave_udm_emergency_effect_tt: "The Industrial Defence Directorate takes office. Forest-Rail Readiness rises by §Y[?constant:independence_wave_udm_pressure.decisive_gain|0]§!, but Workshop Control falls by §R[?constant:independence_wave_udm_pressure.minor_gain|0]§!."
  independence_wave_udm_sovereignty_effect_tt: "Legitimacy, Recognition, State Capacity, and Security rise. Instability falls and the compact gains a durable sovereignty settlement."
  independence_wave_udm_corridor_effect_tt: "Workshop Control rises by §Y[?constant:independence_wave_udm_pressure.standard_gain|0]§! and Forest-Rail Readiness rises by §Y[?constant:independence_wave_udm_pressure.major_gain|0]§!. Network Standing and League cooperation rise, while the outward push also raises Instability."
  udm_fragmented_workshop_mandate: "Fragmented Workshop Mandate"
  udm_fragmented_workshop_mandate_desc: "Izhevsk's workshop directors, rail guards, forest communities, and provisional offices obey separate authorities."
  udm_industrial_forest_compact: "Industrial-Forest Compact"
  udm_industrial_forest_compact_desc: "A common government binds Izhevsk's workshops, repair depots, forest railway, and local communities to the Udmurt republic."
  udm_workshop_charter: "Workshop Charter"
  udm_workshop_charter_desc: "An elected government protects workshop production while holding industrial administrators accountable to civil law."
  udm_worker_forest_councils: "Worker-Forest Councils"
  udm_worker_forest_councils_desc: "Workshop committees, rail crews, and forestry councils coordinate production and distribution."
  udm_cultural_register: "Udmurt Cultural Register"
  udm_cultural_register_desc: "The state records each Udmurt community's representation, language rights, land claims, and public duties."
  udm_cultural_land_compact: "Cultural Land Compact"
  udm_cultural_land_compact_desc: "Registered communities administer local land, forests, food supply, and recruitment through a common compact."
  udm_industrial_emergency_command: "Industrial Emergency Command"
  udm_industrial_emergency_command_desc: "An emergency staff directs industrial guards, workshop output, and the forest-rail defence line."
  UDM_independence_wave_constitutional_party: "Workshop Civic Union"
  UDM_independence_wave_constitutional_party_long: "Constitutional Union of Udmurt Workshop and Municipal Councils"
  UDM_independence_wave_socialist_party: "Workshop and Rail Councils"
  UDM_independence_wave_socialist_party_long: "Congress of Udmurt Workshop, Rail, and Forest Councils"
  UDM_independence_wave_cultural_party: "Udmurt Land Compact"
  UDM_independence_wave_cultural_party_long: "Council of the Udmurt Cultural and Forest-Land Compact"
  UDM_independence_wave_emergency_party: "Industrial Defence Directorate"
  UDM_independence_wave_emergency_party_long: "Emergency Industrial Defence Directorate of Udmurtia"
