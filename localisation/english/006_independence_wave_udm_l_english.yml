l_english:
  independence_wave_udm_industrial_forest_category: "Udmurt Industrial-Forest Compact"
  independence_wave_udm_industrial_forest_category_desc: "Izhevsk's workshop administrations, rail communities, and local councils must turn a provisional breakaway into a defensible republic."
  independence_wave_udm_hold_workshop_congress: "Hold the Izhevsk Workshop Congress"
  independence_wave_udm_hold_workshop_congress_desc: "Keep the provisional cabinet together until the workshops, rail belt, former-host ledger, and route government can carry the compact."
  independence_wave_udm_secure_workshop_depots: "Secure the Workshop Depots"
  independence_wave_udm_secure_workshop_depots_desc: "Put factory stores and repair depots under a common civil administration."
  independence_wave_udm_integrate_industrial_guards: "Integrate Industrial Guards"
  independence_wave_udm_integrate_industrial_guards_desc: "Bring defecting security forces and factory guards into one accountable industrial defence service."
  independence_wave_udm_register_udmurt_communities: "Register Udmurt Communities"
  independence_wave_udm_register_udmurt_communities_desc: "Give rail towns, village councils, and Udmurt communities a place in the provisional state."
  independence_wave_udm_settle_former_host_ledgers: "Settle the Former-Host Ledgers"
  independence_wave_udm_settle_former_host_ledgers_desc: "Resolve property, obligations, and border claims with the former host while the line remains open."
  independence_wave_udm_ratify_constitutional_autonomy: "Ratify Constitutional Autonomy"
  independence_wave_udm_ratify_constitutional_autonomy_desc: "Make the workshop compact a constitutional republic with elected civilian authority."
  independence_wave_udm_adopt_forest_land_compact: "Adopt the Forest-Land Compact"
  independence_wave_udm_adopt_forest_land_compact_desc: "Pair cultural registration with local land and forest administration."
  independence_wave_udm_convene_worker_councils: "Convene Worker Councils"
  independence_wave_udm_convene_worker_councils_desc: "Place workshop production and rail distribution under councils responsible to the republic."
  independence_wave_udm_establish_industrial_emergency_command: "Establish Industrial Emergency Command"
  independence_wave_udm_establish_industrial_emergency_command_desc: "Put the industrial belt on a wartime footing and let the guards secure the critical line."
  independence_wave_udm_codify_durable_sovereignty: "Codify Durable Sovereignty"
  independence_wave_udm_codify_durable_sovereignty_desc: "Settle the compact's institutions and make the new government durable."
  independence_wave_udm_open_volga_ural_corridor: "Open the Volga–Ural Corridor"
  independence_wave_udm_open_volga_ural_corridor_desc: "Use the network to connect Izhevsk's workshops to fellow governments and the wider federation."
