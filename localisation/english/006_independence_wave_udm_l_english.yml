l_english:
  independence_wave_udm_industrial_forest_category: "Udmurt Industrial-Forest Compact"
  independence_wave_udm_industrial_forest_category_desc: "Workshop Control: §Y[?independence_wave_udm_workshop_control|0]§! / [?constant:independence_wave_udm_pressure.maximum|0]\nForest-Rail Readiness: §Y[?independence_wave_udm_forest_rail_readiness|0]§! / [?constant:independence_wave_udm_pressure.maximum|0]\nRaise both values to [?constant:independence_wave_udm_pressure.stable|0], install a route government, and keep $STATE_399$ secure to stabilize the compact."
  independence_wave_udm_hold_workshop_congress: "Hold the Izhevsk Workshop Congress"
  independence_wave_udm_hold_workshop_congress_desc: "Within [?constant:independence_wave_udm_duration.founding_crisis|0] days, install a route government, raise Workshop Control and Forest-Rail Readiness to [?constant:independence_wave_udm_pressure.stable|0], keep $STATE_399$ owned and controlled, and retain control of the capital."
  independence_wave_udm_secure_workshop_depots: "Secure the Workshop Depots"
  independence_wave_udm_secure_workshop_depots_desc: "Place Izhevsk's factory stores, repair depots, and production registers under one civil administration."
  independence_wave_udm_integrate_industrial_guards: "Integrate the Industrial Guards"
  independence_wave_udm_integrate_industrial_guards_desc: "Unify factory guards and defecting security units under an accountable industrial defence staff."
  independence_wave_udm_register_udmurt_communities: "Register Udmurt Communities"
  independence_wave_udm_register_udmurt_communities_desc: "Record the representation, land rights, and public duties of Udmurt villages, rail towns, and forest communities."
  independence_wave_udm_settle_former_host_ledgers: "Settle the Former Host Ledgers"
  independence_wave_udm_settle_former_host_ledgers_desc: "Negotiate the property, border, population, and recognition claims inherited from the former administration while the two governments remain at peace."
  independence_wave_udm_ratify_constitutional_autonomy: "Ratify Constitutional Autonomy"
  independence_wave_udm_ratify_constitutional_autonomy_desc: "Give the Workshop Civic Union an elected government, a binding charter, and responsibility for the civil service."
  independence_wave_udm_adopt_forest_land_compact: "Adopt the Forest-Land Compact"
  independence_wave_udm_adopt_forest_land_compact_desc: "Entrust registered communities with forest use, local land administration, food supply, and recruitment."
  independence_wave_udm_convene_worker_councils: "Convene the Worker Councils"
  independence_wave_udm_convene_worker_councils_desc: "Place workshop production, forest industries, and rail distribution under a congress of workers' councils."
  independence_wave_udm_establish_industrial_emergency_command: "Establish the Industrial Emergency Command"
  independence_wave_udm_establish_industrial_emergency_command_desc: "Put the industrial belt under an emergency defence staff, even at the cost of civilian control over the workshops."
  independence_wave_udm_codify_durable_sovereignty: "Codify Durable Sovereignty"
  independence_wave_udm_codify_durable_sovereignty_desc: "Turn the stabilized compact and its functioning route government into a durable sovereign settlement."
  independence_wave_udm_open_volga_ural_corridor: "Open the Volga–Ural Corridor"
  independence_wave_udm_open_volga_ural_corridor_desc: "Connect Izhevsk's workshops and forest railway to other network states across the Volga–Ural corridor."
  independence_wave_udm_cost_administration_light: "£command_power §Y[?constant:independence_wave_decision_cost.command_power_light|0]§!  £manpower_texticon §Y[?constant:independence_wave_decision_cost.manpower_light|0]§!  £civ_factory §Y[?constant:independence_wave_udm_cost.civilian_factory_use|0]§!"
  independence_wave_udm_cost_administration_light_blocked: "£command_power §R[?constant:independence_wave_decision_cost.command_power_light|0]§!  £manpower_texticon §R[?constant:independence_wave_decision_cost.manpower_light|0]§!  £civ_factory §R[?constant:independence_wave_udm_cost.civilian_factory_use|0]§!"
