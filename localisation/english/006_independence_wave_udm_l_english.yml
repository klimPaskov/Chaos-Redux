  independence_wave_udm_cost_administration_standard_tooltip: "Standard administrative commitment: £command_power §Y[?constant:independence_wave_decision_cost.command_power_standard|0]§!  £manpower_texticon §Y[?constant:independence_wave_decision_cost.manpower_standard|0]§!  £civ_factory §Y[?constant:independence_wave_udm_cost.civilian_factory_use|0]§!"
