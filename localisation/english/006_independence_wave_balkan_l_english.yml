  # SOURCE: 006_independence_wave_banat_l_english.yml
  AXX_independence_wave_municipal_charter: "Banat Municipal Charter"
  AXX_independence_wave_municipal_charter_long: "Banat Municipal Charter"
  AXX_independence_wave_mountain_workers: "Mountain Workers' Council"
  AXX_independence_wave_mountain_workers_long: "Banatian Mountain Workers' Council"
  AXX_independence_wave_village_compact: "Village Autonomy Compact"
  AXX_independence_wave_village_compact_long: "Banatian Village Autonomy Compact"
  AXX_independence_wave_emergency_commission: "Mountain Defence Commission"
  AXX_independence_wave_emergency_commission_long: "Banatian Mountain Defence Commission"
  AXX_independence_wave_patron_rail_compact: "Banat Rail Compact"
  AXX_independence_wave_patron_rail_compact_long: "Banat Patron Rail Compact"

  axx_divided_banat_authority: "Divided Banat Authority"
  axx_divided_banat_authority_desc: "Municipal delegates, veteran networks, and inherited offices still dispute who may speak for the released state. Supplies and mountain defence suffer while the compact remains unsettled."
  axx_banat_compact: "Banat Compact"
  axx_banat_compact_desc: "A negotiated civic compact joins the Banat municipalities to screened mountain formations and gives the new state a durable administrative centre."
  axx_municipal_charter: "Municipal Charter"
  axx_municipal_charter_desc: "A published charter gives municipalities a share of taxation, recognition, and public-service authority while the central government builds capacity."
  axx_mountain_workers_council: "Mountain Workers' Council"
  axx_mountain_workers_council_desc: "Workshops, miners, and railway crews coordinate production and transport through a council that answers to the released state."
  axx_village_autonomy_compact: "Village Autonomy Compact"
  axx_village_autonomy_compact_desc: "Village councils keep local obligations and food routes visible to the central government, improving stability and recruiting power."
  axx_mountain_defence_commission: "Mountain Defence Commission"
  axx_mountain_defence_commission_desc: "A central commission screens armed formations and concentrates scarce equipment on the Banat approaches."
  axx_patron_rail_compact: "Patron Rail Compact"
  axx_patron_rail_compact_desc: "A negotiated patron relationship opens rail access and supplies while imposing obligations on the new government."

  independence_wave_axx_banat_council_category: "Banat Civic Council"
  independence_wave_axx_banat_council_category_desc: "The council coordinates municipal rights, veteran networks, mountain defence, and the former-host settlement while the compact remains fragile."
  independence_wave_axx_hold_banat_council_together: "Hold the Banat Council Together"
  independence_wave_axx_hold_banat_council_together_desc: "The first council must keep municipal delegates, railway officials, and mountain veterans inside one provisional authority."
  independence_wave_axx_reopen_banat_depots: "Reopen the Banat Depots"
  independence_wave_axx_reopen_banat_depots_desc: "Recover stores along the anchor's roads and place them under a common register. Administrative capacity and a civilian-factory commitment are required."
  independence_wave_axx_screen_veteran_networks: "Screen the Veteran Networks"
  independence_wave_axx_screen_veteran_networks_desc: "Vetted veterans can strengthen the opening force, but every formation must accept the defence commission before receiving the compact's supplies."
  independence_wave_axx_convene_community_council: "Convene the Community Council"
  independence_wave_axx_convene_community_council_desc: "Bring the region's communities into one council with explicit rights and a shared rail and tax register."
  independence_wave_axx_settle_romanian_ledgers: "Settle Relations with [GetIndependenceWaveFormerHostNameDef]"
  independence_wave_axx_settle_romanian_ledgers_desc: "Negotiate borders, property claims, population obligations, and recognition with [GetIndependenceWaveFormerHostNameDef]. The talks cannot continue if war begins."
  independence_wave_axx_ratify_municipal_charter: "Ratify the Municipal Charter"
  independence_wave_axx_ratify_municipal_charter_desc: "Give the municipalities a constitutional voice and make the central government responsible to the Banat compact."
  independence_wave_axx_convene_mountain_workers: "Convene the Mountain Workers' Council"
  independence_wave_axx_convene_mountain_workers_desc: "Place workshops and railway crews under a council that can meet the army's material demands without dissolving local authority."
  independence_wave_axx_restore_village_autonomy: "Restore Village Autonomy"
  independence_wave_axx_restore_village_autonomy_desc: "Renew local compacts that protect food routes and keep mountain communities supplied through a traditional settlement."
  independence_wave_axx_establish_mountain_commission: "Establish the Mountain Commission"
  independence_wave_axx_establish_mountain_commission_desc: "Put the emergency chain of command above factional units and prepare the compact for a hard border war."
  independence_wave_axx_accept_rail_patron_compact: "Accept the Banat Rail Compact"
  independence_wave_axx_accept_rail_patron_compact_desc: "Trade a measure of sovereignty for rail access, supplies, recognition, and a foreign guarantor's obligations."
  independence_wave_axx_codify_banat_settlement: "Codify the Banat Settlement"
  independence_wave_axx_codify_banat_settlement_desc: "A stable authority, a recognised border, and an integrated mountain force can turn the liberation into a durable state."
  independence_wave_axx_open_danube_network: "Open the Danube Network"
  independence_wave_axx_open_danube_network_desc: "Use the league's channels to exchange supplies, officers, and recognition with other states that survived the wave."

  independence_wave_axx_project_failure_effect_tt: "The civic and mountain-defence ledgers fall as the provisional authority loses control of the compact."
  independence_wave_axx_depots_effect_tt: "Reopened depots improve the Banat civic mandate and mountain-defence readiness."
  independence_wave_axx_networks_effect_tt: "Screened veteran networks strengthen the opening force and improve defence readiness."
  independence_wave_axx_community_effect_tt: "The community council raises the civic mandate and gives the compact a public settlement."
  independence_wave_axx_host_ledgers_effect_tt: "[GetIndependenceWaveFormerHostNameDefCap] reduces its claims, hostility, obligations, and property demands while accepting firmer borders."
  independence_wave_axx_route_effect_tt: "The selected government route becomes the active authority and changes the Banat ledgers."
  independence_wave_axx_sovereignty_effect_tt: "Banat secures durable sovereignty. Legitimacy, recognition, capacity, and security rise as instability falls."
  independence_wave_axx_network_effect_tt: "The Danube network strengthens league standing, common cause, and member confidence."

  AXX_independence_wave_banat_presidium: "Otto Roth"
  AXX_independence_wave_banat_presidium_desc: "Otto Roth coordinates municipal delegates, veteran networks, and the border defence commission in Banat's provisional government."

