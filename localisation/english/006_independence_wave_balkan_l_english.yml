  independence_wave_bbx_project_failure_effect_tt: "Civic Mandate and Mountain Defence each change by §R[?constant:independence_wave_epirus_pressure.standard_loss|0]§!. Legitimacy changes by §R[?constant:independence_wave_decision_effect.value_standard_loss|0]§!, Recognition by §R[?constant:independence_wave_decision_effect.value_minor_loss|0]§!, Capacity by §R[?constant:independence_wave_decision_effect.value_standard_loss|0]§!, Security by §R[?constant:independence_wave_decision_effect.value_standard_loss|0]§!, and Instability rises by §R[?constant:independence_wave_decision_effect.value_major|0]§!."
