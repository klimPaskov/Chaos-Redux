  independence_wave_bbx_community_effect_tt: "Civic Mandate rises by §G[?constant:independence_wave_epirus_pressure.major_gain|0]§! and Mountain Defence rises by §G[?constant:independence_wave_epirus_pressure.minor_gain|0]§! as the community compact gains a public settlement."
  independence_wave_bbx_host_ledgers_effect_tt: "[GetIndependenceWaveFormerHostNameDefCap]'s Claims change by §G[?constant:independence_wave_decision_effect.bilateral_minor_loss|0]§!, Hostility by §G[?constant:independence_wave_decision_effect.bilateral_standard_loss|0]§!, Obligations by §G[?constant:independence_wave_decision_effect.bilateral_standard_loss|0]§!, Property Disputes by §G[?constant:independence_wave_decision_effect.bilateral_major_loss|0]§!, Host Pressure by §G[?constant:independence_wave_decision_effect.bilateral_minor_loss|0]§!, and Reconquest Fear by §G[?constant:independence_wave_decision_effect.bilateral_minor_loss|0]§!. Border Settlement rises by §G[?constant:independence_wave_decision_effect.bilateral_standard|0]§!."
  independence_wave_bbx_constitutional_route_effect_tt: "The Municipal Charter takes office. Civic Mandate rises by §G[?constant:independence_wave_epirus_pressure.major_gain|0]§! and Mountain Defence by §G[?constant:independence_wave_epirus_pressure.minor_gain|0]§!."
  independence_wave_bbx_workers_route_effect_tt: "The Mountain Workers' Council takes office. Civic Mandate rises by §G[?constant:independence_wave_epirus_pressure.minor_gain|0]§! and Mountain Defence by §G[?constant:independence_wave_epirus_pressure.standard_gain|0]§!."
  independence_wave_bbx_traditional_route_effect_tt: "The Community Autonomy Compact takes office. Civic Mandate rises by §G[?constant:independence_wave_epirus_pressure.major_gain|0]§! and Mountain Defence by §G[?constant:independence_wave_epirus_pressure.standard_gain|0]§!."
  independence_wave_bbx_emergency_route_effect_tt: "The Mountain Defence Commission takes office. Civic Mandate changes by §R[?constant:independence_wave_epirus_pressure.minor_loss|0]§! and Mountain Defence rises by §G[?constant:independence_wave_epirus_pressure.decisive_gain|0]§!."
  independence_wave_bbx_patron_route_effect_tt: "The Epirus Pass Compact takes office. Civic Mandate rises by §G[?constant:independence_wave_epirus_pressure.standard_gain|0]§! and Mountain Defence by §G[?constant:independence_wave_epirus_pressure.minor_gain|0]§!."
  independence_wave_bbx_sovereignty_effect_tt: "Legitimacy, Recognition, and Capacity each rise by §G[?constant:independence_wave_decision_effect.value_standard|0]§!, Security rises by §G[?constant:independence_wave_decision_effect.value_minor|0]§!, and Instability changes by §G[?constant:independence_wave_decision_effect.value_standard_loss|0]§!."
  independence_wave_bbx_network_effect_tt: "Legitimacy, Recognition, and Capacity each rise by §G[?constant:independence_wave_decision_effect.value_standard|0]§!, Security by §G[?constant:independence_wave_decision_effect.value_minor|0]§!, and Instability changes by §G[?constant:independence_wave_decision_effect.value_standard_loss|0]§!. Network Standing rises by §G[?constant:independence_wave_decision_effect.network_standard|0]§!. League Cohesion, Common Cause, Shared Reserve, and Member Confidence each rise by §G[?constant:independence_wave_value.minor_gain|0]§!."

  BBX_independence_wave_epirus_council: "Georgios Christakis-Zografos"
  BBX_independence_wave_epirus_council_desc: "Georgios Christakis-Zografos was a Greek politician who headed the Autonomous Republic of Northern Epirus in 1914. In Epirus's provisional assembly, his office coordinates municipal delegates, mountain communities, and border defence."
  BBX_independence_wave_spyros_spyromilios: "Spyros Spyromilios"
  BBX_independence_wave_spyros_spyromilios_desc: "Spyros Spyromilios was a Greek Gendarmerie officer and guerrilla fighter who served in the Macedonian Struggle and the Balkan Wars. In 1914 he proclaimed the autonomy of Himarë and joined the Northern Epirus autonomist struggle."

