chaosx_super_event.96.t: "UTOPIA HAS NEIGHBORS"
chaosx_super_event.96.q: "\"However, there are many things in the commonwealth of Utopia that I rather wish, than hope, to see followed in our governments.\" - Thomas More, Utopia, trans. Gilbert Burnet"
chaosx_super_event.96.a: "Nowhere has a timetable."
chaosx_super_event.96.d: "What began as a recovered book has become a compact of towns and small states. Public assemblies ratify common guarantees, municipal stores remain open to their neighbors, and linked ports and railways carry food, tools, and delegates across borders. The member governments have kept their flags and their right to leave. Together they have made voluntary association into a regional power whose survival will depend on promises kept after the founding celebration."
chaosx_super_event.97.t: "UTOPIA HAS NEIGHBORS"
chaosx_super_event.97.q: "\"However, there are many things in the commonwealth of Utopia that I rather wish, than hope, to see followed in our governments.\" - Thomas More, Utopia, trans. Gilbert Burnet"
chaosx_super_event.97.a: "Nowhere has a timetable."
chaosx_super_event.97.d: "Delegates from workshops, farms, civic services, and defense councils now meet across borders under a common congress. Shared stores answer shortages, production plans travel with reserve trains, and local councils send mandates instead of tribute. The union has given workers and municipalities a regional authority that no single capital can claim. Its workshops feed a common defense, and every delay at the council tables tests how long solidarity can carry the weight of command."
chaosx_super_event.98.t: "UTOPIA HAS NEIGHBORS"
chaosx_super_event.98.q: "\"However, there are many things in the commonwealth of Utopia that I rather wish, than hope, to see followed in our governments.\" - Thomas More, Utopia, trans. Gilbert Burnet"
chaosx_super_event.98.a: "Nowhere has a timetable."
chaosx_super_event.98.d: "A chain of planned cities now runs through the region. Rail lines join public housing, harbors, clinics, workshops, and measured reserves under one technical standard. Expert delegations arrive to copy the surveys, and neighboring governments sign their districts to the same schedules. Lit homes and full depots show what the planners have achieved. Assignment notices at every station reveal how far the boards' authority now reaches."
chaosx_super_event.99.t: "UTOPIA HAS NEIGHBORS"
chaosx_super_event.99.q: "\"However, there are many things in the commonwealth of Utopia that I rather wish, than hope, to see followed in our governments.\" - Thomas More, Utopia, trans. Gilbert Burnet"
chaosx_super_event.99.a: "Nowhere has a timetable."
chaosx_super_event.99.d: "The gates of the completed island-state have closed behind a society organized for service. Guarded stores, fortified boundaries, assigned districts, and dependent outposts now answer to one stewardship. Foreign missions watch ration columns move with military precision and find no place for refusal inside the system. The state calls its separation complete. Its neighbors see a regional hierarchy held together by reserves, compulsory labor, and checkpoints that govern every road and harbor."
chaosx_super_event.100.t: "UTOPIA HAS NEIGHBORS"
chaosx_super_event.100.q: "\"However, there are many things in the commonwealth of Utopia that I rather wish, than hope, to see followed in our governments.\" - Thomas More, Utopia, trans. Gilbert Burnet"
chaosx_super_event.100.a: "Nowhere has a timetable."
chaosx_super_event.100.d: "The manifesto has left the cabinet table and entered the region as a habit of government. Municipal assemblies revise old rules in public, mixed institutions protect common guarantees, and reconstruction missions carry tools farther than proclamations. Neighboring states join a loose compact without adopting one constitution or one official reading of the book. Its authority rests on aid, criticism, and agreements that can be amended. Every member keeps the power to argue with its founders."
