MAPMODE_AIR_WINTER_EXPOSURE_MAP_MODE_NAME: "Winter Exposure"
MAPMODE_AIR_WINTER_EXPOSURE_MAP_MODE_DESCRIPTION: "Shows the combined burden of cold, ash, contaminated air, and local fallout. Red states carry the greatest immediate danger."

