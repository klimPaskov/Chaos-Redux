l_english:
chaosx.nr17.1.t: "Random faction"
chaosx.nr17.10.t: "The Cabinet Doors Close"
chaosx.nr17.10.d: "In [ROOT.GetName], the maps on the table no longer show a line called neutrality. Every nearby mission has already asked which side the country will stand with, and every answer that says \"later\" has started to sound like an answer of its own.\n\nThe factions that actually exist have found us. One of them will leave this room with our signature."
chaosx.nr17.10.a: "Open the file from [random_faction_option_1_leader.GetFactionName]."
chaosx.nr17.10.b: "Hear the envoys from [random_faction_option_2_leader.GetFactionName]."
chaosx.nr17.10.c: "Sign with [random_faction_option_3_leader.GetFactionName]."
chaosx.nr17.10.e: "Accept the fourth door: [random_faction_option_4_leader.GetFactionName]."
chaosx.nr17.10.f: "Recheck the emergency faction file."
chaosx.nr17.20.t: "Random faction AI Resolver"
chaosx.nr17.20.a: "Choose option one."
chaosx.nr17.20.b: "Choose option two."
chaosx.nr17.20.c: "Choose option three."
chaosx.nr17.20.e: "Choose option four."
chaosx.nr17.20.f: "Rebuild the option file."
chaosx.nr17.30.t: "The Border Asks the Same Question"
chaosx.nr17.30.d: "A neighbor's signature has changed every road sign. Officers who once planned for patrol disputes now compare faction colors. Commercial envoys arrive with advisory notes, and local newspapers count trains as if every freight car were a vote."
chaosx.nr17.30.a: "Follow [random_faction_option_1_leader.GetFactionName] before pressure becomes an ultimatum."
chaosx.nr17.30.b: "Seek a counterweight in [random_faction_option_2_leader.GetFactionName]."
chaosx.nr17.30.c: "Make neutrality louder."
chaosx.nr17.40.t: "A New Name on the Roster"
chaosx.nr17.40.d: "[random_faction_target_country.GetName]'s accession reaches the faction desk before the ink is dry. The signature is useful, fragile, and watched by every neighbor that still claims not to be choosing a side."
chaosx.nr17.40.a: "Send staff officers before rivals arrive."
chaosx.nr17.40.b: "Build the radio net around the border."
chaosx.nr17.50.t: "Regional Bloc Race"
chaosx.nr17.50.d: "The first forced accession has become a regional habit. Border offices, liaison rooms, and newspapers now compare faction pressure across the whole neighborhood."
chaosx.nr17.60.t: "Pressured Neutrality"
chaosx.nr17.60.d: "Neutral cabinets are no longer treated as quiet rooms. War-adjacent states, exposed capitals, and borders beside enemy faction members are being asked to explain how neutrality survives the next mobilisation."
chaosx.nr17.70.t: "Neutrality Collapse"
chaosx.nr17.70.d: "The regional file has too many signatures to stay orderly. The remaining neutrals are being counted, courted, warned, and cornered before the next round of faction paperwork begins."
chaosx.nr17.80.t: "The Bloc Pressure Map"
chaosx.nr17.80.d: "The region no longer moves one country at a time. Every new accession rewrites the promises offered to the next neutral capital, and every border post becomes a place where diplomats count divisions."
chaosx.nr17.80.a: "Keep the map open."
chaosx.nr17.81.t: "Four Doors Check"
chaosx.nr17.82.t: "Hold the Line Check"
chaosx.nr17.83.t: "Liaison Web Check"
chaosx.nr17.84.t: "Frontier Commitment Check"
chaosx.nr17.86.t: "Not Everyone Signed Check"

chaosx.news.4.t: "[FROM.GetName] Joins [FROM.GetFactionName]"
chaosx.news.4.d: "[FROM.GetName] has entered [FROM.GetFactionName] after emergency talks over its position between rival blocs. The accession is small on paper, but every nearby neutral capital now has to answer a harder version of the same question."
chaosx.news.4.a: "Another door closes."

random_faction_bloc_pressure_category: "Bloc Pressure"
random_faction_bloc_pressure_category_desc: "Faction pressure spreads through new signatures, border missions, liaison officers, and public neutrality work. Newly aligned minors can stabilize their entry. Pressured neutrals can resist or choose a pull. Faction leaders can spend real resources to support, court, or force commitments.\n\n[GetRandomFactionBlocPressureStatus]"
random_faction_bloc_pressure_status_aligned: "Current faction: [ROOT.GetFactionName]. Accession pressure: [?random_faction_pressure_score|0]. Neutrality resilience: [?random_faction_neutrality_resilience|0]."
random_faction_bloc_pressure_status_neutral: "Current faction pressure: [?random_faction_pressure_score|0]. Neutrality resilience: [?random_faction_neutrality_resilience|0]."
random_faction_bloc_pressure_status_leader: "Faction: [ROOT.GetFactionName]. Supported minors: [?random_faction_supported_minors|0]. Active pressure targets remain available while their countries and faction leaders stay valid."
random_faction_bloc_pressure_status_default: "No active bloc pressure case is open in this country."

random_faction_stabilize_alignment: "Stabilize Alignment"
random_faction_stabilize_alignment_desc: "Turn emergency accession into ordinary cabinet work before the shock becomes a domestic crisis."
random_faction_request_liaison: "Request Faction Liaison"
random_faction_request_liaison_desc: "Ask the faction leader to send staff officers who can make the new signature feel less improvised."
random_faction_quiet_opposition: "Quiet Opposition"
random_faction_quiet_opposition_desc: "Use political offices, police briefings, and loyal newspapers to blunt the first wave of anti-faction agitation."
random_faction_convene_neutrality_council: "Convene Neutrality Council"
random_faction_convene_neutrality_council_desc: "Gather ministers, border commanders, and party leaders around a public neutrality line."
random_faction_reinforce_border_posts: "Reinforce Border Posts"
random_faction_reinforce_border_posts_desc: "Keep the border posts supplied and controlled while faction envoys test the road network."
random_faction_invite_observers: "Invite Observers"
random_faction_invite_observers_desc: "Let one faction watch the border in exchange for a quieter pressure channel."
random_faction_publish_neutrality: "Publish Neutrality"
random_faction_publish_neutrality_desc: "Put the cabinet's neutral line into public language before others write it for us."
random_faction_offer_staff_mission: "Offer Staff Mission"
random_faction_offer_staff_mission_desc: "Send officers, radios, and practical advice to a pressured or newly aligned country."
random_faction_radio_networks: "Build Radio Networks"
random_faction_radio_networks_desc: "Fund regional radio rooms that keep the faction's promises audible across pressured borders."
random_faction_guarantee_corridor: "Guarantee Corridor"
random_faction_guarantee_corridor_desc: "Commit convoys, escorts, and staff routes to prove that support can physically arrive."
random_faction_guarantee_corridor_mission: "Corridor Guarantee"
random_faction_guarantee_corridor_mission_desc: "Keep the corridor credible until the target can stand on the promise."
random_faction_demand_commitment: "Demand Commitment"
random_faction_demand_commitment_desc: "Turn pressure into a public demand for alignment while the regional race is still moving."

random_faction_stabilize_alignment_available_tt: "Political power and support equipment are available."
random_faction_request_liaison_available_tt: "The faction leader is valid, and command power plus support equipment are available."
random_faction_quiet_opposition_available_tt: "Political power, infantry equipment, stability, and wartime support reserves are available."
random_faction_convene_neutrality_council_available_tt: "Political power, command channels, and stability reserves are available for the council."
random_faction_border_posts_objective_tt: "Keep the capital controlled and station divisions in the capital or a border state while infantry reserves remain available."
random_faction_invite_observers_available_tt: "The observer source is valid, and command power plus convoy access are available."
random_faction_publish_neutrality_available_tt: "Political power and stability reserves are available for the public neutrality line."
random_faction_offer_staff_mission_available_tt: "The target is valid, and command power plus support equipment are available for a staff mission."
random_faction_radio_networks_available_tt: "Political power and support equipment are available for a regional radio network."
random_faction_guarantee_corridor_available_tt: "The target is valid, and command power, infantry reserves, and convoy access are available."
random_faction_corridor_objective_tt: "Keep a valid guaranteed target, a plausible land or coastal route, and enough convoys to make the corridor credible."
random_faction_demand_commitment_available_tt: "The target is valid, and political power plus command channels are available for a public demand."

