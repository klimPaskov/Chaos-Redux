random_faction_stabilize_alignment_tt: "Alignment shock eases, faction relations settle, and regional pressure becomes less volatile."
random_faction_request_liaison_tt: "A liaison mission arrives, improving command coordination and adding faction support pressure."
random_faction_quiet_opposition_tt: "Opposition pressure falls quickly, though the cabinet spends political capital to do it."
random_faction_convene_neutrality_council_tt: "Neutrality resilience rises and a border-post mission begins."
random_faction_invite_observers_tt: "Observer channels raise one faction's pull while keeping the country formally neutral."
random_faction_publish_neutrality_tt: "Neutrality resistance rises and immediate faction pressure weakens."
random_faction_offer_staff_mission_tt: "The target receives a liaison mission and the faction records another supported minor."
random_faction_radio_networks_tt: "Regional faction pull rises through radio rooms and liaison schedules, and distinct supported minors are recorded for the faction leader."
random_faction_guarantee_corridor_tt: "A corridor mission begins. If the leader remains credible, the target's pressure score falls."
random_faction_demand_commitment_tt: "The target receives public commitment pressure and may enter a faction if its resistance breaks."

random_faction_cancel_border_posts_mission_tt: "Border post work ends because the country is no longer a pressured neutral."
random_faction_border_posts_success_tt: "Border posts hold. Neutrality resilience rises and pressure falls."
random_faction_border_posts_failure_tt: "The border watch fails. Faction pressure grows."
random_faction_cancel_corridor_mission_tt: "Corridor work ends because the guarantee is no longer active."
random_faction_corridor_success_tt: "The corridor remains credible. The target's pressure falls."
random_faction_corridor_failure_tt: "The corridor fails. The target's pressure rises and rival promises sound stronger."

random_faction_alignment_shock: "Alignment Shock"
random_faction_alignment_shock_desc: "The country entered a faction under visible pressure. Ministries, parties, and officers are still learning what the signature means."
random_faction_border_pressure: "Border Pressure"
random_faction_border_pressure_desc: "A neighboring accession has turned the border into a daily argument over which bloc can promise safety."
random_faction_bloc_polarization: "Bloc Polarization"
random_faction_bloc_polarization_desc: "Radio rooms, embassy visits, and faction-adjacent offices keep the region's loyalties under public strain."
random_faction_neutrality_exhaustion: "Neutrality Exhaustion"
random_faction_neutrality_exhaustion_desc: "Neutrality is still the official line, but every train, speech, and military order is being read as a partial choice."
random_faction_liaison_mission: "Faction Liaison Mission"
random_faction_liaison_mission_desc: "Faction officers and radio staff are helping the country translate a political signature into usable military practice."

chaosx.events_log.evolution.type.random_faction: "Random faction"
chaosx.events_log.window.event_details.random_faction: "An independent minor outside the factions is pulled into a forced alignment by the blocs that actually exist in the current world. A player country caught in the choice sees the available faction doors and must sign through one of them.\n\nThe accession unsettles nearby neutral capitals, gives faction leaders a reason to court the border, and turns neutrality into work that has to be defended in public, in councils, and at frontier posts."
chaosx.events_log.window.evolution_details.random_faction.title.stage_1: "Regional Bloc Race"
chaosx.events_log.window.evolution_details.random_faction.title.stage_2: "Pressured Neutrality"
chaosx.events_log.window.evolution_details.random_faction.title.stage_3: "Neutrality Collapse"
chaosx.events_log.window.evolution_details.random_faction.title.event_detail: "Random faction"
chaosx.events_log.window.evolution_details.random_faction.body.stage_1: "Regional pressure starts spreading from one accession to neighboring neutrals. Border posts, observer invitations, neutrality councils, and faction staff missions become the public tools of the race."
chaosx.events_log.window.evolution_details.random_faction.body.stage_2: "Wartime and war-adjacent minors become eligible pressure targets. Neutral countries beside active faction fronts face stronger pressure and faction leaders can demand clearer commitments."
chaosx.events_log.window.evolution_details.random_faction.body.stage_3: "Neutrality collapse can pull several small states in one region toward rival blocs, while some capitals still try to hold their line through hurried councils and guarded borders."
chaosx.events_log.window.evolution_details.random_faction.body.event_detail: "Small countries lose the luxury of waiting. Existing factions compete around exposed capitals, and nearby neutrals decide whether to resist, counter-align, or follow the newest signature."
