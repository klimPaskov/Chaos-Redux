chaosx.nr17.1.t: "Random faction"
chaosx.nr17.10.t: "The Cabinet Doors Close"
chaosx.nr17.10.d: "In [ROOT.GetName], military attachés, trade missions, and neighboring governments have stopped accepting delays. They want a public answer before routes close and guarantees move elsewhere.\n\nThe available factions have placed their terms before the cabinet. [ROOT.GetName] must sign with one of them."
chaosx.nr17.10.a: "Accept the protection of [random_faction_option_1_leader.GetFactionName]."
chaosx.nr17.10.b: "Receive the envoys from [random_faction_option_2_leader.GetFactionName]."
chaosx.nr17.10.c: "Declare our place in [random_faction_option_3_leader.GetFactionName]."
chaosx.nr17.10.e: "Take the fourth door into [random_faction_option_4_leader.GetFactionName]."
chaosx.nr17.10.f: "Demand fresh terms from the factions still standing."
random_faction_option_1_join_tt: "Join §Y[random_faction_option_1_leader.GetFactionName]§!. Gain Alignment Shock for §Y150 days§!, begin with §R20§! accession pressure and §G50§! Neutrality Resilience, improve mutual relations, and add §R5§! Cohesion Strain to the faction leader. Nearby neutral governments face bloc pressure."
random_faction_option_2_join_tt: "Join §Y[random_faction_option_2_leader.GetFactionName]§!. Gain Alignment Shock for §Y150 days§!, begin with §R20§! accession pressure and §G50§! Neutrality Resilience, improve mutual relations, and add §R5§! Cohesion Strain to the faction leader. Nearby neutral governments face bloc pressure."
random_faction_option_3_join_tt: "Join §Y[random_faction_option_3_leader.GetFactionName]§!. Gain Alignment Shock for §Y150 days§!, begin with §R20§! accession pressure and §G50§! Neutrality Resilience, improve mutual relations, and add §R5§! Cohesion Strain to the faction leader. Nearby neutral governments face bloc pressure."
random_faction_option_4_join_tt: "Join §Y[random_faction_option_4_leader.GetFactionName]§!. Gain Alignment Shock for §Y150 days§!, begin with §R20§! accession pressure and §G50§! Neutrality Resilience, improve mutual relations, and add §R5§! Cohesion Strain to the faction leader. Nearby neutral governments face bloc pressure."
random_faction_option_1_war_warning_tt: "§R[random_faction_option_1_leader.GetFactionName] is already at war. Accession adds Emergency Defensive Coordination for 120 days and may bring active fronts to our borders.§!"
random_faction_option_2_war_warning_tt: "§R[random_faction_option_2_leader.GetFactionName] is already at war. Accession adds Emergency Defensive Coordination for 120 days and may bring active fronts to our borders.§!"
random_faction_option_3_war_warning_tt: "§R[random_faction_option_3_leader.GetFactionName] is already at war. Accession adds Emergency Defensive Coordination for 120 days and may bring active fronts to our borders.§!"
random_faction_option_4_war_warning_tt: "§R[random_faction_option_4_leader.GetFactionName] is already at war. Accession adds Emergency Defensive Coordination for 120 days and may bring active fronts to our borders.§!"
random_faction_resist_alignment_tt: "Remain outside the factions, lose §R18§! Neutrality Resilience, and suffer Neutrality Exhaustion for §Y180 days§!."
chaosx.nr17.20.t: "Random faction AI Resolver"
chaosx.nr17.20.a: "Choose option one."
chaosx.nr17.20.b: "Choose option two."
chaosx.nr17.20.c: "Choose option three."
chaosx.nr17.20.e: "Choose option four."
chaosx.nr17.20.f: "Rebuild the option file."
chaosx.nr17.30.t: "The Border Asks the Same Question"
chaosx.nr17.30.d: "A neighboring government has joined a faction, and every border crossing now carries new military implications. Officers compare mobilization plans, commercial envoys ask who will protect the railways, and newspapers count troop trains as carefully as election returns."
chaosx.nr17.30.a: "Follow [random_faction_option_1_leader.GetFactionName] before pressure becomes an ultimatum."
chaosx.nr17.30.b: "Seek a counterweight in [random_faction_option_2_leader.GetFactionName]."
chaosx.nr17.30.c: "Make neutrality louder."
chaosx.nr17.40.t: "A New Ally at the Frontier"
chaosx.nr17.40.d: "[random_faction_target_country.GetName]'s accession has already sent staff officers and radio planners toward the new frontier. The new member is useful, politically fragile, and watched by every neutral neighbor still trying to avoid a choice."
chaosx.nr17.40.a: "Send staff officers before rivals arrive."
chaosx.nr17.40.b: "Build the radio net around the border."
chaosx.nr17.40.c: "The frontier liaison has already ended."
chaosx.nr17.50.t: "Regional Bloc Race"
chaosx.nr17.50.d: "The first forced accession has become a regional habit. Border offices, liaison rooms, and newspapers now compare faction pressure across the whole neighborhood."
chaosx.nr17.60.t: "Pressured Neutrality"
chaosx.nr17.60.d: "Neutral cabinets are no longer treated as quiet rooms. War-adjacent states, exposed capitals, and borders beside enemy faction members are being asked to explain how neutrality survives the next mobilisation."
chaosx.nr17.70.t: "Collapse of Neutrality"
chaosx.nr17.70.d: "The regional file has too many signatures to stay orderly. The remaining neutrals are being counted, courted, warned, and cornered before the next round of faction paperwork begins."
chaosx.nr17.80.t: "Signatures Across the Region"
chaosx.nr17.80.d: "Accession ceremonies are being announced across several capitals in quick succession. Rail stations fill with liaison officers, border units receive new instructions, and the neutral governments still outside the blocs face mounting public demands for a choice."
chaosx.nr17.80.a: "Count the capitals still outside."
chaosx.nr17.81.t: "Four Doors Check"
chaosx.nr17.82.t: "Hold the Line Check"
chaosx.nr17.83.t: "Liaison Web Check"
chaosx.nr17.84.t: "Frontier Commitment Check"
chaosx.nr17.85.t: "Bloc Pressure Cleanup"
chaosx.nr17.86.t: "Not Everyone Signed Check"

chaosx.news.4.t: "[FROM.GetName] Joins [FROM.GetFactionName]"
chaosx.news.4.d: "[FROM.GetName] has entered [FROM.GetFactionName] after rival powers pressed for a public commitment. Liaison officers are already moving toward its borders, and nearby neutral governments are calling ministers and commanders together to decide how long they can remain outside the blocs."
chaosx.news.4.a: "Another neutral capital has chosen."

random_faction_bloc_pressure_category: "Bloc Pressure"
random_faction_bloc_pressure_category_desc: "Faction pressure spreads through accession ceremonies, border missions, liaison officers, and public neutrality campaigns. Newly aligned minors can steady their governments. Pressured neutrals can resist or lean toward a faction. Faction leaders can commit resources to support, court, or force commitments.\n\n[GetRandomFactionBlocPressureStatus]"
random_faction_bloc_pressure_status_aligned: "Faction: §Y[ROOT.GetFactionName]§!. Faction leader: §Y[?random_faction_chosen_leader.GetName]§!. Alignment shock: §Y[?random_faction_alignment_shock_window:days_left|0] days§!. Accession pressure: §Y[?random_faction_pressure_score|0]§!."
random_faction_bloc_pressure_status_neutral: "Pressure source: §Y[?random_faction_pressure_source_country.GetName]§! and §Y[?random_faction_pressure_source_leader.GetFactionName]§!. Regional anchor: §Y[?random_faction_pressure_anchor_country.GetName]§!. Pressure window: §Y[?random_faction_under_pressure:days_left|0] days§!. Pressure: §Y[?random_faction_pressure_score|0]§!. Neutrality resilience: §Y[?random_faction_neutrality_resilience|0]§!."
random_faction_bloc_pressure_status_leader: "Faction: §Y[ROOT.GetFactionName]§!. Last aligned member: §Y[?random_faction_last_aligned_member.GetName]§!. Regional anchor: §Y[?random_faction_last_region_anchor.GetName]§!. Supported minors: §Y[?random_faction_supported_minors|0]§!. Cohesion strain: §Y[?random_faction_faction_cohesion_strain|0]§!. Reaction window: §Y[?random_faction_rival_reaction_cooldown:days_left|0] days§!."
random_faction_bloc_pressure_status_default: "No active bloc pressure is shaping this country's decisions."

random_faction_stabilize_alignment: "Stabilize Alignment"
random_faction_stabilize_alignment_desc: "Turn emergency accession into ordinary cabinet work before the shock becomes a domestic crisis."
random_faction_request_liaison: "Request Faction Liaison"
random_faction_request_liaison_desc: "Ask the faction leader to send staff officers who can make the new signature feel less improvised."
random_faction_quiet_opposition: "Quiet Opposition"
random_faction_quiet_opposition_desc: "Use political offices, police briefings, and loyal newspapers to blunt the first wave of anti-faction agitation."
random_faction_convene_neutrality_council: "Convene Neutrality Council"
random_faction_convene_neutrality_council_desc: "Gather ministers, border commanders, and party leaders around a public neutrality line."
random_faction_reinforce_border_posts: "Reinforce Border Posts"
random_faction_reinforce_border_posts_desc: "Keep the border posts supplied and controlled while faction envoys test the road network."
random_faction_invite_observers: "Invite Observers"
random_faction_invite_observers_desc: "Let one faction watch the border in exchange for a quieter pressure channel."
random_faction_publish_neutrality: "Publish Neutrality"
random_faction_publish_neutrality_desc: "Put the cabinet's neutral line into public language before others write it for us."
random_faction_offer_staff_mission: "Offer Staff Mission"
random_faction_offer_staff_mission_desc: "Send officers, radios, and practical advice to a pressured or newly aligned country."
random_faction_radio_networks: "Build Radio Networks"
random_faction_radio_networks_desc: "Fund regional radio rooms that keep the faction's promises audible across pressured borders."
random_faction_guarantee_corridor: "Guarantee Corridor"
random_faction_guarantee_corridor_desc: "Commit convoys, escorts, and staff routes to prove that support can physically arrive."
random_faction_guarantee_corridor_mission: "Corridor Guarantee"
random_faction_guarantee_corridor_mission_desc: "Keep the corridor credible until the target can stand on the promise."
random_faction_demand_commitment: "Demand Commitment"
random_faction_demand_commitment_desc: "Turn pressure into a public demand for alignment while the regional race is still moving."

random_faction_stabilize_alignment_available_tt: "The government has the authority and matériel required for the accession burden shown below."
random_faction_request_liaison_available_tt: "[FROM.GetName] still leads our faction and can provide §Y60§! support equipment. We can spend §Y15§! Command Power."
random_faction_quiet_opposition_available_tt: "We can spend §Y25§! Political Power, §Y450§! infantry equipment, and §Y2%§! Stability. A country at war must also bear §Y2%§! War Support strain."
random_faction_convene_neutrality_council_available_tt: "We can spend §Y45§! Political Power, §Y15§! Command Power, and §Y2%§! Stability."
random_faction_border_posts_objective_tt: "Keep the capital and §Y[?random_faction_border_post_state.GetName]§! controlled, retain §Y450§! infantry equipment, and raise our garrison in that state to §Y[?random_faction_border_post_divisions_required|0]§! divisions. The required reinforcement was measured when the mission began."
random_faction_invite_observers_available_tt: "Our liaison route to [FROM.GetName] is open. We can spend §Y15§! Command Power and §Y15§! convoys."
random_faction_publish_neutrality_available_tt: "We can spend §Y25§! Political Power and §Y2%§! Stability."
random_faction_offer_staff_mission_available_tt: "Our staff can reach [FROM.GetName], which has not hosted another mission in the last §Y180 days§!. We can spend §Y30§! Command Power and §Y120§! support equipment."
random_faction_radio_networks_available_tt: "We can provide the Political Power and support equipment needed to fund a regional radio network."
random_faction_guarantee_corridor_available_tt: "A supply route to [FROM.GetName] can be maintained. We can spend §Y15§! Command Power, §Y450§! infantry equipment, and §Y15§! convoys."
random_faction_corridor_objective_tt: "Keep §Y[?random_faction_corridor_targets^0.GetName]§! independent, out of direct war with us, and within liaison reach. Retain §Y15§! convoys and raise the train stockpile to §Y[?random_faction_corridor_train_target|0]§!. This requires §Y5§! additional trains after the mission begins."
random_faction_demand_commitment_available_tt: "Our envoys can reach [FROM.GetName], which remains under active bloc pressure. We can spend §Y70§! Political Power and §Y30§! Command Power."

