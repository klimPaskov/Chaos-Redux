random_faction_stabilize_alignment_tt: "Remove Alignment Shock and Emergency Defensive Coordination, gain §G3%§! Stability, reduce accession pressure by §G10§!, improve mutual relations with the faction leader, and reduce its cohesion strain by §G5§!."
random_faction_request_liaison_tt: "Gain a liaison mission for §Y180 days§!, improve mutual relations with [FROM.GetName], increase that faction's pull by §R8§!, and lose §R8§! Neutrality Resilience through dependency. If this is a new contact, it strengthens [FROM.GetName]'s Liaison Web."
random_faction_leader_staff_response_tt: "Give [random_faction_target_country.GetName] a Faction Liaison Mission for §Y180 days§!, reduce its accession pressure by §G12§!, and improve mutual relations. Each different small state aided this way strengthens our Liaison Web."
random_faction_leader_radio_response_tt: "Maintain our faction radio network for §Y240 days§!. [random_faction_target_country.GetName] gains §R10§! bloc pressure and Bloc Polarization for §Y240 days§!. Each different small state reached this way strengthens our Liaison Web."
random_faction_quiet_opposition_tt: "Remove Alignment Shock and reduce accession pressure by §G12§!. A backlash may restore §R12§! pressure and apply Bloc Polarization. Low stability and harsher regional pressure make a backlash more likely."
random_faction_convene_neutrality_council_tt: "Gain §G18§! Neutrality Resilience, reduce pressure by §G6§!, and begin a 120-day reinforcement mission in a named state."
random_faction_invite_observers_tt: "Set [FROM.GetName] as the pressure source, increase its pull by §R10§!, lose §R10§! Neutrality Resilience, gain §G1%§! War Support, improve mutual relations, and provoke a rival faction's displeasure."
random_faction_publish_neutrality_tt: "Gain §G8§! Neutrality Resilience and reduce immediate faction pressure by §G8§!."
random_faction_offer_staff_mission_tt: "Give [FROM.GetName] a liaison mission for §Y180 days§! and improve mutual relations. A member of our faction loses §G12§! pressure, removes Alignment Shock and Emergency Defensive Coordination, and gains §G2%§! Stability. A pressured neutral instead gains §R12§! pull toward us and loses §R8§! Neutrality Resilience. Each different small state aided this way strengthens our Liaison Web."
random_faction_radio_networks_tt: "Maintain our faction radio network for §Y240 days§!. Every reachable country already under bloc pressure gains §R10§! faction pressure and Bloc Polarization for §Y240 days§!. Each different country reached this way strengthens our Liaison Web."
random_faction_guarantee_corridor_tt: "Begin a §Y120-day§! corridor mission for [FROM.GetName]. Retain §Y15§! convoys and add §Y5§! trains after launch while [FROM.GetName] remains independent, out of direct war with us, and within liaison reach."
random_faction_demand_commitment_tt: "Add §R18§! pressure to [FROM.GetName]. At §Y80§! pressure it receives the faction choice. A refusal instead raises its resilience by §G10§!, damages mutual relations, and can redirect its pressure source toward a rival faction."

random_faction_cancel_border_posts_mission_tt: "Border post work ends because the country is no longer a pressured neutral."
random_faction_border_posts_success_tt: "Gain §G15§! Neutrality Resilience and §G2%§! Stability, and reduce pressure by §G10§!."
random_faction_border_posts_failure_tt: "Gain §R18§! pressure, lose §R15§! Neutrality Resilience, and receive Neutrality Exhaustion for §Y180 days§!."
random_faction_cancel_corridor_mission_tt: "Corridor work ends because the intended country can no longer be reached or supported. The effort ends without a result."
random_faction_corridor_success_tt: "Gain §G5§! Command Power. The target loses §G10§! pressure, loses §R8§! Neutrality Resilience through faction dependency, and improves mutual relations with the faction leader."
random_faction_corridor_failure_tt: "Lose §R2%§! Stability. The target gains §R18§! pressure, loses §R8§! Neutrality Resilience, damages mutual relations, and can lean toward a rival faction."

random_faction_alignment_shock: "Alignment Shock"
random_faction_alignment_shock_desc: "The country entered a faction under visible pressure. Ministries, parties, and officers are still learning what the signature means."
random_faction_emergency_defensive_coordination: "Emergency Defensive Coordination"
random_faction_emergency_defensive_coordination_desc: "The faction's active war has forced the new member's staffs to exchange defensive plans before the political shock has settled."
random_faction_emergency_accession: "Emergency Accession"
random_faction_border_pressure: "Border Pressure"
random_faction_border_pressure_desc: "A neighboring accession has turned the border into a daily argument over which bloc can promise safety."
random_faction_bloc_polarization: "Bloc Polarization"
random_faction_bloc_polarization_desc: "Radio rooms, embassy visits, and faction-adjacent offices keep the region's loyalties under public strain."
random_faction_neutrality_exhaustion: "Neutrality Exhaustion"
random_faction_neutrality_exhaustion_desc: "Neutrality is still the official line, but every train, speech, and military order is being read as a partial choice."
random_faction_liaison_mission: "Faction Liaison Mission"
random_faction_liaison_mission_desc: "Faction officers and radio staff are helping the country translate a political signature into usable military practice."

chaosx.events_log.evolution.type.random_faction: "Random faction"
chaosx.events_log.window.event_details.random_faction: "An independent minor outside the factions is cornered by the blocs able to offer membership and forced to choose one. A player country caught in the decision receives up to four faction offers and must sign with one of them.\n\nThe accession unsettles nearby neutral capitals, gives faction leaders a reason to court the border, and turns neutrality into work that has to be defended in public, in councils, and at frontier posts."
chaosx.events_log.window.event_details.random_faction.result: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] signed into the faction led at the time by §Y[?global.events_log_open_event_detail_secondary_actor_entries^events_log_open_event_detail_index.GetName]§! under public pressure.\n\nThe accession unsettled nearby neutral capitals, gave faction leaders a reason to court the border, and turned neutrality into work that had to be defended in public, in councils, and at frontier posts."
chaosx.events_log.window.event_details.random_faction.result.neutral: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] signed a forced faction accession under public pressure. The country that led the faction at accession no longer exists.\n\nThe accession unsettled nearby neutral capitals, gave faction leaders a reason to court the border, and turned neutrality into work that had to be defended in public, in councils, and at frontier posts."
chaosx.events_log.window.event_details.random_faction.result.unresolved: "[?global.events_log_open_event_detail_actor_entries^events_log_open_event_detail_index.GetName] faced a forced faction decision under public pressure, but no surviving faction signature can yet be named.\n\nNearby neutral capitals are watching the decision, faction leaders are courting the border, and neutrality has become work that must be defended in public, in councils, and at frontier posts."
chaosx.events_log.window.history.dynamic_entry.random_faction: "#[?global.events_log_view_sequence_entries^events_log_history_index|0]  [?global.events_log_view_date_entries^events_log_history_index.GetDateStringNoHour]  Event ID: §Y[?global.events_log_view_event_id_entries^events_log_history_index|0]§!  Type: [GetEventsLogHistoryTypeView]\n§Y[?global.events_log_view_actor_entries^events_log_history_index.GetName]§! signed into the faction led at the time by §Y[?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName]§!."
chaosx.events_log.window.history.dynamic_entry.random_faction.lost: "#[?global.events_log_view_sequence_entries^events_log_history_index|0]  [?global.events_log_view_date_entries^events_log_history_index.GetDateStringNoHour]  Event ID: §Y[?global.events_log_view_event_id_entries^events_log_history_index|0]§!  Type: [GetEventsLogHistoryTypeView]\n§Y[?global.events_log_view_actor_entries^events_log_history_index.GetName]§! signed a forced accession. The country that led the faction at accession no longer exists."
