l_english:
 chaosx.fallout.310.t: "Black Start"
 chaosx.fallout.310.d: "The settlement has enough scrap and stored power to attempt a first restart. The old grid will not return as one machine. It must be made into a promise that people can see, test, and refuse. Four crews have brought four ideas for the first live circuit."
 chaosx.fallout.310.a: "Build one guarded central grid"
 chaosx.fallout.310.a.tt: "Put the surviving relays under one control room. Costs Power and Scrap. A stable result improves capacity and governance, while a failure leaves the settlement exposed."
 chaosx.fallout.310.b: "Let local cooperatives share the load"
 chaosx.fallout.310.b.tt: "Give neighborhood crews their own switching authority and a common repair ledger. Costs Power, Scrap, and Food. A stable result favors resilience and trust."
 chaosx.fallout.310.c: "Place the relays under military guard"
 chaosx.fallout.310.c.tt: "Use the garrison to secure fuel lines and enforce a repair schedule. Costs Power and Fuel. A stable result strengthens capacity and readiness, but failure deepens dependence."
 chaosx.fallout.310.d_option: "Invite an outside grid partner"
 chaosx.fallout.310.d_option.tt: "Trade Recognition for imported parts, technicians, and a guaranteed first current. Costs Power and Recognition. A stable result brings quick capacity with a lasting dependency."
 chaosx.fallout.312.t: "The first live circuit"
 chaosx.fallout.312.central.success.d: "The central control room closes its first circuit without a fire. A relay crew walks the line from the battery vault to the water pumps, calling each green lamp by name. The settlement gains a common measure of power and a government that can answer for it."
 chaosx.fallout.312.central.partial.d: "The central grid reaches the pumps, but the outer relays trip whenever the ash wind rises. The control room can promise a schedule only to the districts it can see, and every unseen line becomes a bargaining point."
 chaosx.fallout.312.central.failure.d: "The first synchronized start burns three switching cabinets. The control room keeps the lamps dark while crews strip the failed relays for parts. People remember the promise of one grid as a warning against distant certainty."
 chaosx.fallout.312.cooperative.success.d: "Local crews bring their circuits online one street at a time. The repair ledger travels with the food carts, and a broken transformer becomes a public problem before it becomes a private feud. The settlement has less reach but more hands inside the work."
 chaosx.fallout.312.cooperative.partial.d: "The cooperative crews keep their own rooms alive, yet their standards do not match. Water arrives on time in some districts and late in others. The shared ledger survives, though the grid now speaks in local accents."
 chaosx.fallout.312.cooperative.failure.d: "Two crews close the same line from opposite ends. The surge kills tools and starts a fight over whose ledger was correct. The settlement keeps a few lamps by cutting the promise of a common network down to a handful of rooms."
 chaosx.fallout.312.military.success.d: "The garrison makes the first restart a drilled operation. Fuel guards clear the line, engineers count every load, and the pumps return before curfew. The grid gains capacity and the officers gain a reason to keep the truce with the workshops."
 chaosx.fallout.312.military.partial.d: "The garrison secures the main relay, but civilian workshops are pushed to the end of the schedule. Power is dependable near the barracks and uncertain beyond them. The settlement has a working grid with a harder question about who it serves."
 chaosx.fallout.312.military.failure.d: "The guarded start turns into a fuel dispute. A convoy takes the reserve cells, a workshop hides its last transformer, and the line goes dark again. The garrison keeps order around the dead cabinets while the settlement loses faith in the timetable."
 chaosx.fallout.312.foreign.success.d: "The outside crew arrives with a sealed crate of relays and a map of compatible loads. Their technicians bring the first current back before the next ash front. The settlement gains capacity quickly, but every new lamp carries the name of the partner who supplied it."
 chaosx.fallout.312.foreign.partial.d: "The imported relays fit the central line and nowhere else. The partner keeps a technician at the control room while local crews improvise adapters. Power grows, yet the settlement must ask permission for the parts that keep it growing."
 chaosx.fallout.312.foreign.failure.d: "The partner's first shipment arrives with incompatible coils. The technicians leave behind a bill, a quiet threat, and a dead control cabinet. Recognition has been spent without a circuit to show for it, and the settlement must repair the old lines alone."
 chaosx.fallout.312.a: "Accept the first circuit report"
 chaosx.fallout.312.a.tt: "Record the grid policy, apply its immediate result, and begin the 270-day maintenance follow-up."
 chaosx.fallout.314.t: "A year beside the relays"
 chaosx.fallout.314.success.d: "The first circuit has survived a full maintenance cycle. Crews know which lamps fail in cold rain, which pumps need a hand start, and which promises were written too far from the line. The grid is no longer an experiment. It is an institution with a cost."
 chaosx.fallout.314.partial.d: "The follow-up finds a network that works when people remember one another. Some districts keep careful records, while others borrow parts and leave no receipt. The settlement can plan its next expansion, but not yet trust every lamp."
 chaosx.fallout.314.failure.d: "The follow-up finds empty cabinets and competing repair claims. Fuel was counted twice, the reserve cells vanished, and the main line now depends on a single exhausted crew. The first restart survives as a lesson written in outages."
 chaosx.fallout.314.a: "Close the Black Start ledger"
 chaosx.fallout.314.a.tt: "Resolve the maintenance follow-up, preserve the durable grid memory, and release the Black Start transaction."
 fallout.event_log.black_start.name: "Black Start"
 fallout.event_log.black_start.detail: "A Fallout recovery chain recorded a first grid policy, a delayed circuit result, and a maintenance follow-up."
 fallout.event_log.black_start.central_success: "A guarded central grid reached the pumps and became a durable institution."
 fallout.event_log.black_start.central_partial: "A guarded central grid reached the pumps but left outer relays contested."
 fallout.event_log.black_start.central_failure: "A synchronized central start burned relays and weakened trust in distant control."
 fallout.event_log.black_start.cooperative_success: "Local cooperatives restored circuits with a shared repair ledger."
 fallout.event_log.black_start.cooperative_partial: "Local cooperatives kept separate circuits alive without a common standard."
 fallout.event_log.black_start.cooperative_failure: "Cooperative crews fought over switching authority and lost most of the network."
 fallout.event_log.black_start.military_success: "A guarded military restart returned the pumps and secured the fuel schedule."
 fallout.event_log.black_start.military_partial: "A guarded military restart favored the garrison and left civilian districts uncertain."
 fallout.event_log.black_start.military_failure: "A military fuel dispute left the main relay dark."
 fallout.event_log.black_start.foreign_success: "An outside partner supplied compatible relays and a fast first current."
 fallout.event_log.black_start.foreign_partial: "An outside partner restored one line while local crews improvised the rest."
 fallout.event_log.black_start.foreign_failure: "An outside shipment failed and spent Recognition without a working circuit."
 fallout.event_log.black_start.callback_success: "The first maintenance year turned the grid into a durable institution."
 fallout.event_log.black_start.callback_partial: "The first maintenance year left a usable but uneven network."
 fallout.event_log.black_start.callback_failure: "The first maintenance year ended in outages and competing repair claims."
 fallout_black_start_central: "Central Grid Charter"
 fallout_black_start_central_desc: "A guarded control room coordinates the settlement's first reliable circuits."
 fallout_black_start_cooperative: "Cooperative Switching Ledger"
 fallout_black_start_cooperative_desc: "Local crews share repairs through a public ledger and neighborhood authority."
 fallout_black_start_military: "Military Relay Guard"
 fallout_black_start_military_desc: "A garrison protects fuel lines and enforces a strict relay schedule."
 fallout_black_start_foreign: "Foreign Relay Compact"
 fallout_black_start_foreign_desc: "An outside partner keeps imported relays moving while dependence grows."
 fallout_black_start_maintained: "Maintained Black Start"
 fallout_black_start_maintained_desc: "A completed maintenance cycle makes the first grid policy durable."
 fallout_black_start_failed: "Black Start Failure"
 fallout_black_start_failed_desc: "Burned relays and disputed reserves make every restart harder."
