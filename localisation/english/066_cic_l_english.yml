chaosx.nr66.2.t: "CIC"
chaosx.nr66.2.d: "Our civilian industry has expanded, giving factories more room to build machinery, transport, and housing. The new capacity is already drawing workers and investment into production."
chaosx.nr66.2.a: "Truly amazing!"

chaosx.news.58.t: "Construction Industrial Capacity"
