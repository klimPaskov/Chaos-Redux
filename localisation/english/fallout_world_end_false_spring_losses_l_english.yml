l_english:
  chaosx.fallout.478.t: "The False Spring Losses"
  chaosx.fallout.478.intro: "The thaw reached the surviving fields before the seed ledgers were ready. Green shoots appeared under a clean sky, then a hard night froze the low ground and split the irrigation channels. The state can replant from what it saved, pay a neighboring country for seed, lock the reserve below the old rail tunnel, or accept a smaller harvest while the people ration through the late frost."
  chaosx.fallout.478.a: "Replant before the ground closes"
  chaosx.fallout.478.a.tt: "Spend Food and Medicine to cover the shoots and rebuild the damaged beds before another frost."
  chaosx.fallout.478.b: "Buy seed from the eastern convoy"
  chaosx.fallout.478.b.tt: "Spend Food and Medicine to import seed and record a bilateral debt with the convoy's country."
  chaosx.fallout.478.c: "Open the underground reserve"
  chaosx.fallout.478.c.tt: "Spend supplies to move the remaining seed below the rail tunnel and make access a shared civic rule."
  chaosx.fallout.478.d: "Accept the smaller harvest"
  chaosx.fallout.478.d.tt: "Spend Food and Medicine to protect the weakest households while agronomists measure what the frost left behind."
  chaosx.fallout.480.t: "The Frost Ledger"
  chaosx.fallout.480.emergency_replant.success.d: "The replant crews reached the low terraces before the second cold front. Covers held through the night, the state granary released a measured ration, and the growers marked which beds can carry seed next year."
  chaosx.fallout.480.emergency_replant.partial.d: "The covers saved the upper beds, but ice split the lower channels. The state gains a short harvest and a map of the ground that cannot be trusted until the next thaw."
  chaosx.fallout.480.emergency_replant.failure.d: "The crews planted into frozen mud. A late frost took the shoots and left the remaining seed stores too thin for another attempt."
  chaosx.fallout.480.import_seed.success.d: "The eastern convoy arrived under a written debt and delivered seed suited to short summers. The new ledger names both countries, and the valley receives enough grain to keep the next planting honest."
  chaosx.fallout.480.import_seed.partial.d: "Only half the convoy crossed the ash road. Imported seed fills the protected beds, while the lost crates become a diplomatic grievance and another entry in the famine ledger."
  chaosx.fallout.480.import_seed.failure.d: "The convoy's seed was stored wet after the long crossing. The debt remains, the bags are useless, and the late frost reaches the last unprotected beds."
  chaosx.fallout.480.underground_reserve.success.d: "The tunnel crews sealed the reserve behind the old rail gate. Access passes through a public ledger, so the reserve strengthens local trust without emptying the surface granary."
  chaosx.fallout.480.underground_reserve.partial.d: "The reserve is underground, but the lift cannot carry every crate. The rule survives and the valley argues over which districts receive the first dry seed."
  chaosx.fallout.480.underground_reserve.failure.d: "The rail tunnel flooded when the thaw returned. The reserve is lost behind silt, and the last clean water barrel becomes the price of a smaller planting."
  chaosx.fallout.480.accept_shortage.success.d: "The council accepts a smaller harvest and protects households with the least shelter. Agronomists preserve a reliable frost record, and the ration line holds through the late cold."
  chaosx.fallout.480.accept_shortage.partial.d: "The ration plan prevents panic in the town center, but outlying farms receive less than promised. The state keeps a useful frost record and a sharper memory of the shortage."
  chaosx.fallout.480.accept_shortage.failure.d: "The shortage reaches the seed keepers first. Medicine runs low, the ration line breaks at the edge of the state, and another winter memory is written in missing names."
  chaosx.fallout.480.a: "Record the frost decision"
  chaosx.fallout.480.a.tt: "Resolve the delayed late-frost result and schedule the second-sowing review."
  chaosx.fallout.482.t: "The Second Sowing"
  chaosx.fallout.482.success.d: "The next sowing opens on ground that once looked lost. The seed ledger, the convoy debt, and the state granary share one date, while the thaw route remains open for the next region that needs it."
  chaosx.fallout.482.partial.d: "The second sowing is uneven, but enough beds take root to keep the state from repeating the false spring. The record names the districts that still need shelter and seed."
  chaosx.fallout.482.failure.d: "The second sowing fails in the low ground. Growers keep the frost map and close the exposed beds while the state prepares for another hungry winter."
  chaosx.fallout.482.a: "Close the frost record"
  chaosx.fallout.482.a.tt: "Record the second-sowing review and release the recovery chain."
  fallout.event_log.false_spring_losses.name: "The False Spring Losses"
  fallout.event_log.false_spring_losses.detail: "[GetFalloutEvent478EventLogDetail]"
  fallout.event_log.false_spring_losses.emergency_replant_success: "Replant crews saved the upper terraces and mapped the beds that can carry seed."
  fallout.event_log.false_spring_losses.emergency_replant_partial: "Replant crews saved part of the terraces and lost the lower irrigation channels."
  fallout.event_log.false_spring_losses.emergency_replant_failure: "A late frost took the replanting and thinned the remaining seed stores."
  fallout.event_log.false_spring_losses.import_seed_success: "An eastern convoy delivered short-summer seed under a written bilateral debt."
  fallout.event_log.false_spring_losses.import_seed_partial: "Half an eastern seed convoy arrived, leaving a diplomatic grievance behind."
  fallout.event_log.false_spring_losses.import_seed_failure: "Wet imported seed failed, but the convoy debt remained on the ledger."
  fallout.event_log.false_spring_losses.underground_reserve_success: "A public rule secured the remaining seed below the old rail tunnel."
  fallout.event_log.false_spring_losses.underground_reserve_partial: "The underground reserve held, but districts disputed the first dry seed."
  fallout.event_log.false_spring_losses.underground_reserve_failure: "A thaw flood destroyed the underground reserve and tightened the ration line."
  fallout.event_log.false_spring_losses.accept_shortage_success: "A smaller harvest plan protected weak households and preserved a frost record."
  fallout.event_log.false_spring_losses.accept_shortage_partial: "A smaller harvest plan held in the center but failed at the state edge."
  fallout.event_log.false_spring_losses.accept_shortage_failure: "The shortage reached the seed keepers and broke the outer ration line."
  fallout.event_log.false_spring_losses.callback_success: "The second sowing opened on ground that could carry a new season."
  fallout.event_log.false_spring_losses.callback_partial: "The second sowing held unevenly and named the districts still needing help."
  fallout.event_log.false_spring_losses.callback_failure: "The second sowing failed in the low ground before another hungry winter."
