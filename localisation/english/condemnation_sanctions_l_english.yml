chaos_meter.window.condemnation.details.response.tt: "§YCurrent response§!\nCompliance: [GetCondemnationDetailComplianceState]\nDecay: [GetCondemnationDetailDecayState]  Credit §G[?chaos_meter_condemnation_detail_decay_credit|0]§!\nEvasion: [GetCondemnationDetailEvasionSummary]\nEnforcement actions: §Y[?chaos_meter_condemnation_detail_tight_enforcement_count|0]§!\n\nCompliance credit improves recovery over time. Recent condemned conduct, a broken pledge, refusal of inspection, or exposed evasion can stop decay. Evasion exposure is shown only to the selected target or after detection."
