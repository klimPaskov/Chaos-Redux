condemnation_falsify_shipping_manifests: "Falsify Shipping Manifests"
condemnation_falsify_shipping_manifests_desc: "Create layered cargo records and rotating end users for embargoed shipments."
condemnation_falsify_shipping_manifests_cost: "£convoy_texticon §Y[?constant:condemnation_cost.false_manifest_convoys|0]§!"
condemnation_falsify_shipping_manifests_cost_blocked: "£convoy_texticon §R[?constant:condemnation_cost.false_manifest_convoys|0]§!"
condemnation_falsify_shipping_manifests_cost_tooltip: "The falsified route costs £convoy_texticon §Y[?constant:condemnation_cost.false_manifest_convoys|0]§!."
condemnation_falsify_shipping_manifests_tt: "For §Y[?constant:condemnation_duration_days.evasion_route|0] days§!, gain §G+[?constant:condemnation_response_modifier.false_manifest_convoy_efficiency|%0] Convoy Escort Efficiency§! and §O[?constant:condemnation_route.false_manifest_strength|0]§! evasion strength, but add §O[?constant:condemnation_route.exposure_per_route|0]§! discovery exposure."
