condemnation_issue_non_use_pledge: "Issue a Non-Use Pledge"
condemnation_issue_non_use_pledge_desc: "Bind the government publicly against renewed unconventional use while international monitors test whether the promise survives military pressure."
condemnation_issue_non_use_pledge_requirements_tt: "The international memory of any previous broken pledge must first expire."
condemnation_issue_non_use_pledge_tt: "For §Y[?constant:condemnation_duration_days.non_use_pledge|0] days§!, war support changes by §R[?constant:condemnation_response_modifier.pledge_war_support|%0]§! and clean observance builds verified non-use credit. A breach immediately adds §R[?constant:condemnation_gain.pledge_break_coverup|0] Coverup§! and §R[?constant:condemnation_gain.pledge_break_repeat|0] Repeat-Use§! condemnation."
condemnation_allow_foreign_observers: "Allow Foreign Observers"
condemnation_allow_foreign_observers_desc: "Give foreign observers continuing access to ports, rail nodes, and suspect facilities. Their presence improves credibility while exposing intelligence gaps."
condemnation_allow_foreign_observers_requirements_tt: "Requires £convoy_texticon §Y[?constant:condemnation_cost.observer_convoys|0]§! to transport and support the observer mission."
condemnation_allow_foreign_observers_cost: "£convoy_texticon §Y[?constant:condemnation_cost.observer_convoys|0]§!"
condemnation_allow_foreign_observers_cost_blocked: "£convoy_texticon §R[?constant:condemnation_cost.observer_convoys|0]§!"
condemnation_allow_foreign_observers_cost_tooltip: "Supporting the observer mission costs £convoy_texticon §Y[?constant:condemnation_cost.observer_convoys|0]§!."
condemnation_allow_foreign_observers_tt: "For §Y[?constant:condemnation_duration_days.observers|0] days§!, observers impose §Y+[?constant:condemnation_response_modifier.observer_consumer_goods|%0] Consumer Goods§! and §R[?constant:condemnation_response_modifier.observer_detection|%0] Enemy Operative Detection§!. We gain §G[?constant:condemnation_compliance_credit.observers|0] decay credit§!, and each pulse discloses §Y[?constant:condemnation_decay.observer_hidden_exposure|%0]§! of hidden evidence."
condemnation_reform_unconventional_command: "Reform the Unconventional Command"
condemnation_reform_unconventional_command_desc: "Remove the command networks responsible for prohibited programs and rebuild doctrine under tighter civilian control."
condemnation_reform_unconventional_command_requirements_tt: "Requires experience from all three services to replace entrenched command structures."
condemnation_reform_unconventional_command_cost: "£army_experience §Y[?constant:condemnation_cost.command_reform_army_xp|0]§!  £air_experience §Y[?constant:condemnation_cost.command_reform_air_xp|0]§!  £navy_experience §Y[?constant:condemnation_cost.command_reform_navy_xp|0]§!"
condemnation_reform_unconventional_command_cost_blocked: "[GetCondemnationCommandArmyCostStatus]  [GetCondemnationCommandAirCostStatus]  [GetCondemnationCommandNavyCostStatus]"
condemnation_reform_unconventional_command_cost_tooltip: "Command reform costs £army_experience §Y[?constant:condemnation_cost.command_reform_army_xp|0]§!, £air_experience §Y[?constant:condemnation_cost.command_reform_air_xp|0]§!, and £navy_experience §Y[?constant:condemnation_cost.command_reform_navy_xp|0]§!."
condemnation_reform_unconventional_command_tt: "Grants §G[?constant:condemnation_compliance_credit.command_reform|0] decay credit§! and permanent reform memory. For §Y[?constant:condemnation_duration_days.command_reform|0] days§!, the transition imposes §R[?constant:condemnation_response_modifier.command_reform_org|%0] Army Organization§! and §R+[?constant:condemnation_response_modifier.command_reform_training|%0] Training Time§!."

condemnation_refuse_inspections_decision: "Refuse the Inspectors"
condemnation_refuse_inspections_decision_desc: "Deny foreign teams access and preserve operational secrecy, accepting that the refusal will be treated as evidence of concealment."
condemnation_refuse_inspections_tt: "Cancels active inspections and observers, blocks condemnation decay for §Y[?constant:condemnation_duration_days.defiance_program|0] days§!, and adds a public §RCoverup§! source from the denied inspection."
condemnation_domestic_propaganda_campaign: "Rally the Nation Against Sanctions"
condemnation_domestic_propaganda_campaign_desc: "Present the embargo as foreign coercion and mobilize public resolve. The campaign hardens war support but strains civilian supply and makes foreign enforcement more likely."
condemnation_domestic_propaganda_campaign_tt: "Immediately changes Stability by §R[?constant:condemnation_cost.propaganda_stability|%0]§!. For §Y[?constant:condemnation_duration_days.defiance_program|0] days§!, gain §G+[?constant:condemnation_response_modifier.propaganda_war_support|%0] War Support§! while suffering §R[?constant:condemnation_response_modifier.propaganda_stability|%0] Stability§! and §Y+[?constant:condemnation_response_modifier.propaganda_consumer_goods|%0] Consumer Goods§!. Participant pressure increases by §R[?constant:condemnation_participant_score.defiant_propaganda|0]§!."
condemnation_launch_autarky_program: "Launch an Emergency Autarky Program"
condemnation_launch_autarky_program_desc: "Burn reserve fuel to reorganize industry around domestic substitutes and emergency extraction."
condemnation_launch_autarky_program_cost: "£GFX_fuel_texticon §Y[?constant:condemnation_cost.autarky_fuel_fraction|%0]§!"
condemnation_launch_autarky_program_cost_blocked: "£GFX_fuel_texticon §R[?constant:condemnation_cost.autarky_fuel_fraction|%0]§!"
condemnation_launch_autarky_program_cost_tooltip: "Emergency reorganization consumes £GFX_fuel_texticon §Y[?constant:condemnation_cost.autarky_fuel_fraction|%0]§! of fuel reserves."
condemnation_launch_autarky_program_tt: "For §Y[?constant:condemnation_duration_days.defiance_program|0] days§!, gain §G+[?constant:condemnation_response_modifier.autarky_resources|%0] Local Resources§! and §G[?constant:condemnation_route.autarky_relief|%0] sanction relief§!, but suffer §Y+[?constant:condemnation_response_modifier.autarky_consumer_goods|%0] Consumer Goods§! and §R[?constant:condemnation_response_modifier.autarky_factory_output|%0] Factory Output§!."
condemnation_force_domestic_extraction: "Force Domestic Resource Extraction"
condemnation_force_domestic_extraction_desc: "Drive mines and refineries beyond safe capacity to replace embargoed imports."
condemnation_force_domestic_extraction_tt: "Immediately changes Stability by §R[?constant:condemnation_cost.forced_extraction_stability|%0]§!. For §Y[?constant:condemnation_duration_days.defiance_program|0] days§!, gain §G+[?constant:condemnation_response_modifier.forced_extraction_resources|%0] Local Resources§! and §G[?constant:condemnation_route.forced_extraction_relief|%0] sanction relief§!, but suffer §R[?constant:condemnation_response_modifier.forced_extraction_efficiency|%0] Production Efficiency Growth§!."
condemnation_substitute_materials_program: "Accelerate Substitute Materials"
condemnation_substitute_materials_program_desc: "Replace embargoed inputs with lower-grade domestic materials and improvised industrial processes."
condemnation_substitute_materials_program_tt: "For §Y[?constant:condemnation_duration_days.defiance_program|0] days§!, gain §G+[?constant:condemnation_response_modifier.substitute_resources|%0] Local Resources§! and §G[?constant:condemnation_route.substitute_materials_relief|%0] sanction relief§!, but suffer §R[?constant:condemnation_response_modifier.substitute_efficiency|%0] Production Efficiency Growth§!."
condemnation_impose_military_rationing: "Impose Military Rationing"
condemnation_impose_military_rationing_desc: "Reserve fuel and imported parts for priority formations by slowing ordinary military production."
condemnation_impose_military_rationing_tt: "For §Y[?constant:condemnation_duration_days.defiance_program|0] days§!, military fuel consumption changes by §G[?constant:condemnation_response_modifier.rationing_fuel_use|%0]§! and sanctions receive §G[?constant:condemnation_route.rationing_relief|%0] relief§!, while factory output changes by §R[?constant:condemnation_response_modifier.rationing_factory_output|%0]§!."
condemnation_pressure_subject_supply: "Pressure Subject Supply Networks"
condemnation_pressure_subject_supply_desc: "Compel dependent governments to redirect resources through protected imperial channels."
condemnation_pressure_subject_supply_tt: "Requires a subject and immediately changes Stability by §R[?constant:condemnation_cost.subject_pressure_stability|%0]§!. For §Y[?constant:condemnation_duration_days.defiance_program|0] days§!, gain §G+[?constant:condemnation_response_modifier.subject_pressure_resources|%0] Local Resources§! and §G[?constant:condemnation_route.subject_pressure_relief|%0] sanction relief§!, while Stability changes by §R[?constant:condemnation_response_modifier.subject_pressure_stability|%0]§!."
condemnation_establish_controlled_shipping: "Establish Controlled Shipping"
condemnation_establish_controlled_shipping_desc: "Concentrate scarce escorts and fuel into government-managed routes that can survive foreign interdiction."
condemnation_establish_controlled_shipping_cost: "£convoy_texticon §Y[?constant:condemnation_cost.controlled_shipping_convoys|0]§!  £GFX_fuel_texticon §Y[?constant:condemnation_cost.controlled_shipping_fuel_fraction|%0]§!"
condemnation_establish_controlled_shipping_cost_blocked: "[GetCondemnationControlledShippingConvoyCostStatus]  [GetCondemnationControlledShippingFuelCostStatus]"
condemnation_establish_controlled_shipping_cost_tooltip: "Controlled shipping costs £convoy_texticon §Y[?constant:condemnation_cost.controlled_shipping_convoys|0]§! and £GFX_fuel_texticon §Y[?constant:condemnation_cost.controlled_shipping_fuel_fraction|%0]§! of fuel reserves."
condemnation_establish_controlled_shipping_tt: "For §Y[?constant:condemnation_duration_days.defiance_program|0] days§!, gain §G+[?constant:condemnation_response_modifier.controlled_shipping_convoys|%0] Convoy Escort Efficiency§! and §G[?constant:condemnation_route.controlled_shipping_relief|%0] sanction relief§!, while Factory Output changes by §R[?constant:condemnation_response_modifier.controlled_shipping_factory_output|%0]§!."
condemnation_hardline_mobilization_decision: "Order Hardline Mobilization"
condemnation_hardline_mobilization_decision_desc: "Turn isolation into a permanent war footing and suppress domestic demands for accommodation."
condemnation_hardline_mobilization_tt: "For §Y[?constant:condemnation_duration_days.defiance_program|0] days§!, gain §G+[?constant:condemnation_response_modifier.hardline_war_support|%0] War Support§! while Stability changes by §R[?constant:condemnation_response_modifier.hardline_stability|%0]§!. This does not reduce material sanction pressure."

condemnation_black_market_arms_procurement: "Procure Arms on the Black Market"
condemnation_black_market_arms_procurement_desc: "Pay brokers to move rifles and support equipment through unregistered ports and false end users."
condemnation_black_market_arms_procurement_cost: "£convoy_texticon §Y[?constant:condemnation_cost.black_market_convoys|0]§!  £GFX_fuel_texticon §Y[?constant:condemnation_cost.black_market_fuel_fraction|%0]§!"
