condemnation_escalate_total_embargo: "Total Embargo against [FROM.GetNameDef]"
condemnation_escalate_total_embargo_desc: "Broaden existing sanctions across trade, research contact, investment, recognition, and diplomatic support."
condemnation_escalate_total_embargo_tt: "Our sanctions against [FROM.GetNameDef] rise to §RTotal Embargo§! enforcement for a §Y[?constant:condemnation_duration_days.total_embargo_review|0]-day§! review period."
condemnation_escalate_pariah_embargo: "Pariah Enforcement against [FROM.GetNameDef]"
condemnation_escalate_pariah_embargo_desc: "Lead the harshest isolation measures against a country whose conduct has placed it beyond ordinary diplomatic protection."
condemnation_escalate_pariah_embargo_tt: "Our sanctions against [FROM.GetNameDef] rise to §0Pariah§! enforcement for a §Y[?constant:condemnation_duration_days.pariah_embargo_review|0]-day§! review period."

condemnation_target_response_category: "Condemnation Response"
condemnation_target_response_category_desc: "International pressure has become a material constraint on our diplomacy, war industry, and access to foreign supply. We may submit to verification, absorb the damage, or build expensive routes around it."
condemnation_participant_action_category: "International Sanctions"
condemnation_participant_action_category_desc: "Condemned governments can be isolated through enforceable bilateral measures. Every embargo carries trade losses, enforcement burdens, fatigue, or the risk of being exposed as a profiteer."
condemnation_view_compliance_options: "Show Compliance Measures"
condemnation_view_compliance_options_desc: "Review inspections, verified disarmament, compensation, observer access, and other measures that rebuild international credibility."
condemnation_view_defiance_options: "Show Defiance Measures"
condemnation_view_defiance_options_desc: "Review propaganda, autarky, rationing, controlled shipping, and other measures for enduring sanctions without accommodation."
condemnation_view_evasion_options: "Show Evasion Networks"
condemnation_view_evasion_options_desc: "Review covert procurement, false manifests, front companies, smuggling, and other routes that trade exposure risk for material relief."

condemnation_accept_international_inspections: "Accept International Inspections"
condemnation_accept_international_inspections_desc: "Open military depots and restricted facilities to foreign inspection teams. Their access will expose our security practices and burden the civilian economy, but credible cooperation will accelerate recovery."
condemnation_accept_international_inspections_tt: "For §Y[?constant:condemnation_duration_days.inspection|0] days§!, inspections impose §Y+[?constant:condemnation_response_modifier.inspection_consumer_goods|%0] Consumer Goods§! and §R[?constant:condemnation_response_modifier.inspection_encryption|%0] Encryption§!. We gain §G[?constant:condemnation_compliance_credit.inspection|0] decay credit§!, and each sanctions pulse discloses §Y[?constant:condemnation_decay.inspection_hidden_exposure|%0]§! of remaining hidden evidence."
condemnation_destroy_chemical_stockpiles_decision: "Destroy Chemical Stockpiles"
condemnation_destroy_chemical_stockpiles_decision_desc: "Permit monitored destruction of most chemical payload cylinders and accept a prolonged restriction on renewed use."
condemnation_destroy_chemical_stockpiles_tt: "Destroys §R[?constant:condemnation_cost.chemical_stockpile_fraction|%0]§! of every chemical cylinder stockpile, restricts chemical use for §Y[?constant:condemnation_duration_days.non_use_pledge|0] days§!, and grants §G[?constant:condemnation_compliance_credit.destroy_chemical_stockpile|0] decay credit§!. Breaking the restriction creates pledge-breaking condemnation."
condemnation_destroy_biological_stockpiles_decision: "Destroy Biological Stockpiles"
condemnation_destroy_biological_stockpiles_decision_desc: "Dismantle most deployable biological munitions under verification and accept a prolonged restriction on renewed use."
condemnation_destroy_biological_stockpiles_tt: "Destroys §R[?constant:condemnation_cost.biological_stockpile_fraction|%0]§! of anthrax, plague, tularemia, smallpox, and weaponized-infected bomb stockpiles, restricts biological use for §Y[?constant:condemnation_duration_days.non_use_pledge|0] days§!, and grants §G[?constant:condemnation_compliance_credit.destroy_biological_stockpile|0] decay credit§!."
condemnation_dismantle_restricted_sites_decision: "Dismantle Restricted Sites"
condemnation_dismantle_restricted_sites_decision_desc: "Close controlled chemical and experimental facilities whose continued operation prevents a credible settlement."
condemnation_dismantle_restricted_sites_tt: "Closes every controlled restricted chemical or experiment site, ends its output, marks the facilities dismantled, and grants §G[?constant:condemnation_compliance_credit.dismantle_sites|0] decay credit§!."
