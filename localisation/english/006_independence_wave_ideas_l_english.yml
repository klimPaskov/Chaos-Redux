l_english:
independence_wave_improvised_government: "An Improvised Government"
independence_wave_improvised_government_desc: "Offices, revenue, and command still depend on emergency committees and borrowed records. Until a permanent administration exists, every order consumes scarce authority and material."
independence_wave_functioning_administration: "A Functioning Administration"
independence_wave_functioning_administration_desc: "The ministries can collect revenue, maintain records, and carry orders beyond the capital, though shortages and overlapping jurisdictions still slow the state."
independence_wave_permanent_government: "A Permanent Government"
independence_wave_permanent_government_desc: "The founding administration has become a durable state apparatus, able to direct production and public business without living from one emergency to the next."
independence_wave_collapsed_cabinet: "The Cabinet in Collapse"
independence_wave_collapsed_cabinet_desc: "Rival offices issue competing orders while salaries, records, and public confidence disappear. The government survives in name, but its machinery no longer obeys a common center."
independence_wave_independent_treasury: "An Independent Treasury"
independence_wave_independent_treasury_desc: "A sovereign treasury now directs revenue, production incentives, and public works through institutions answerable to the new state."

independence_wave_unrecognized_state: "An Unrecognized State"
independence_wave_unrecognized_state_desc: "Foreign governments hesitate to trade, lend, or exchange missions with an authority whose borders and succession remain disputed."
independence_wave_observed_state: "A State Under Observation"
independence_wave_observed_state_desc: "Informal missions and cautious trade have begun, but most governments still reserve judgment on the permanence of independence."
independence_wave_entrenched_diplomacy: "Entrenched Diplomacy"
independence_wave_entrenched_diplomacy_desc: "Treaties, missions, and accumulated recognition have made the country's diplomatic position difficult to erase even when former rulers object."
independence_wave_recognition_blockade: "Recognition Blockade"
independence_wave_recognition_blockade_desc: "Former rulers and hostile patrons are coordinating diplomatic and commercial pressure to keep the new government outside normal international life."

independence_wave_fragmented_command: "Fragmented Command"
independence_wave_fragmented_command_desc: "Militias, defecting officers, local guards, and political formations answer to different chains of command. Training and reinforcement suffer while the government negotiates control."
independence_wave_integrating_commands: "Commands Under Integration"
independence_wave_integrating_commands_desc: "Common ranks, supply standards, and staff procedures are replacing the separate armed organizations of the first days."
independence_wave_professional_defense: "Professional National Defense"
independence_wave_professional_defense_desc: "A unified officer corps, dependable reinforcement system, and national planning staff can defend the state without surrendering authority to local commanders."
independence_wave_warlord_commands: "Warlord Commands"
independence_wave_warlord_commands_desc: "Armed leaders have preserved their striking power by refusing national discipline. Their forces attack aggressively, consume heavily, and leave the government dangerously divided."

independence_wave_unsettled_borders: "Unsettled Borders"
independence_wave_unsettled_borders_desc: "Claims, refugees, raids, and uncertain lines keep troops dispersed and supplies moving through improvised frontier systems."
independence_wave_border_talks: "Border Talks"
independence_wave_border_talks_desc: "Ceasefire lines, arbitration, and property negotiations have reduced the immediate danger, although the final frontier remains unwritten."
independence_wave_settled_frontier: "A Settled Frontier"
independence_wave_settled_frontier_desc: "Recognized boundaries and prepared defensive districts give the army a frontier it can fortify and the administration a jurisdiction it can govern."
independence_wave_permanent_border_war: "Permanent Border War"
independence_wave_permanent_border_war_desc: "The frontier has become a standing theater of mobilization, raids, and retaliation. Public resolve hardens as stability and supply discipline deteriorate."

independence_wave_patron_pressure: "Patron Pressure"
independence_wave_patron_pressure_desc: "Foreign credit, weapons, transit, and advisers keep the state alive while giving outside governments influence over its cabinet and economy."
independence_wave_balanced_patronage: "Balanced Patronage"
independence_wave_balanced_patronage_desc: "No single sponsor can dictate terms. Competing channels provide resources while the government preserves room to bargain."
independence_wave_independent_foreign_policy: "An Independent Foreign Policy"
independence_wave_independent_foreign_policy_desc: "Domestic institutions and diversified diplomacy allow the state to trade and negotiate without accepting a foreign veto over its decisions."
independence_wave_captured_cabinet: "A Captured Cabinet"
independence_wave_captured_cabinet_desc: "One patron's loans, missions, and security guarantees have become the organizing principle of government. Aid flows, but sovereign decisions narrow."

independence_wave_post_release_instability: "The Shock of Independence"
independence_wave_post_release_instability_desc: "Disrupted markets, hurried appointments, displaced populations, and uncertain loyalties press on every institution created by the declaration."
independence_wave_foundation_under_repair: "The Foundation Under Repair"
independence_wave_foundation_under_repair_desc: "Supply, administration, and public order are recovering through deliberate founding work, though the settlement remains vulnerable to a serious reverse."
independence_wave_stable_founding_settlement: "A Stable Founding Settlement"
independence_wave_stable_founding_settlement_desc: "The first political compact has survived its tests. Citizens and institutions can plan beyond the immediate emergency."
independence_wave_provincial_fracture: "Provincial Fracture"
independence_wave_provincial_fracture_desc: "Regions and local authorities are withholding obedience, production, and supplies from a center they no longer trust to protect or represent them."

independence_wave_league_membership: "League Membership"
independence_wave_league_membership_desc: "Mutual aid, recognition, and defensive consultation strengthen the member, but contributions and charter obligations draw resources into the common institution."
independence_wave_league_pillar_institution: "A Charter Pillar Institution"
independence_wave_league_pillar_institution_desc: "The league's adopted principles now operate through permanent national offices, common procedures, and dependable material cooperation."
independence_wave_discredited_league_member: "A Discredited League Member"
independence_wave_discredited_league_member_desc: "Broken obligations and mistrust have isolated this government inside the institution that was meant to protect it."

independence_wave_identity_northern_western_europe: "A Settlement of Ports and Parliaments"
independence_wave_identity_northern_western_europe_desc: "Municipal government, organized labor, shipping, railways, and inherited constitutional practice give the new state a recognizable public foundation."
independence_wave_identity_mediterranean_iberia: "A Maritime Civic Settlement"
independence_wave_identity_mediterranean_iberia_desc: "Ports, island routes, regional institutions, and a contested civic tradition bind the country to Mediterranean exchange."
independence_wave_identity_balkans_danube: "A Danubian Frontier Settlement"
independence_wave_identity_balkans_danube_desc: "River crossings, mixed provinces, veterans, and negotiated local authority shape a state prepared to defend a difficult regional compact."
independence_wave_identity_eastern_europe_western_russia: "A Borderland Republic in Arms"
independence_wave_identity_eastern_europe_western_russia_desc: "Railways, agrarian districts, and defecting formations have created a defensive state along the broken imperial frontier."
independence_wave_identity_volga_urals_siberia_far_east: "A River-and-Rail Commonwealth"
independence_wave_identity_volga_urals_siberia_far_east_desc: "Distance can be governed only through rivers, railway settlements, extraction centers, and mobile regional administration."
independence_wave_identity_caucasus_anatolia_mesopotamia: "A Mountain-and-Corridor Compact"
independence_wave_identity_caucasus_anatolia_mesopotamia_desc: "Mountain communities, strategic corridors, oil and river routes, and layered local authorities define the founding balance."
independence_wave_identity_levant_arabia: "A Covenant of Port and Interior"
independence_wave_identity_levant_arabia_desc: "Urban institutions, caravan routes, dynastic or communal authority, and foreign concessions must coexist inside one sovereign settlement."
independence_wave_identity_north_africa_sahara: "A Coast-and-Caravan Settlement"
independence_wave_identity_north_africa_sahara_desc: "Coastal towns and mobile interior routes support a state whose administration must travel as readily as its defenders."
independence_wave_identity_west_central_africa: "A Congress of Courts and Towns"
independence_wave_identity_west_central_africa_desc: "Municipal institutions, trade corridors, labor, and established political authorities provide the country with several durable centers of public legitimacy."
independence_wave_identity_east_africa_horn_great_lakes: "A Highland-and-Lake Compact"
independence_wave_identity_east_africa_horn_great_lakes_desc: "Lake routes, highland defenses, ports, courts, and local councils create a state built for negotiated regional survival."
independence_wave_identity_southern_africa_indian_ocean: "An Ocean-and-Rail Commonwealth"
independence_wave_identity_southern_africa_indian_ocean_desc: "Ports, island shipping, mines, farms, and inland railways give the founding government a practical economic geography."
independence_wave_identity_south_asia_himalaya: "A Federal Settlement of Plain and Pass"
independence_wave_identity_south_asia_himalaya_desc: "Provincial institutions, princely or popular authority, language, water, and mountain defense are balanced through a negotiated public order."
independence_wave_identity_southeast_east_asia_oceania: "A Maritime and Archipelagic Compact"
independence_wave_identity_southeast_east_asia_oceania_desc: "Ports, island councils, river deltas, and shipping routes turn separation into a workable network of administration and exchange."
independence_wave_identity_americas_caribbean: "A Continental and Island Settlement"
independence_wave_identity_americas_caribbean_desc: "Federal practice, local congresses, ports, frontier communities, and industrial corridors give the state a public claim to permanence."
