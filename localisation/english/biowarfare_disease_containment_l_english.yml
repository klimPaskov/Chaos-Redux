disease_containment.gui.header.title: "Disease Containment Board"
disease_containment.gui.header.summary: "Selected disease: §Y[This.GetDiseaseContainmentSelectedDiseaseName]§!\nCountry phase: §Y[This.GetDiseaseContainmentCountryPhase]§!"
disease_containment.gui.header.summary.tt: "The shared board combines disease selection, public outbreak inspection, country preparedness, and local response targeting without creating a separate category for any one disease."
disease_containment.gui.header.black_plague: "Countermeasures: §G[?black_plague_countermeasure_progress|0]§! / [?constant:disease_containment_board_value.maximum|0]"
disease_containment.gui.header.black_plague.tt: "Black Plague countermeasure progress lowers death and spread pressure and opens stronger cleanup methods. It does not remove an established outbreak instantly."
disease_containment.gui.open: "Open Board"
disease_containment.gui.open.tt: "Open the shared disease crisis board and rebuild the selected disease's visible state list."

disease_containment.gui.title: "Disease Containment Board"
disease_containment.gui.global_summary: "[This.GetDiseaseContainmentGlobalSummary]"
disease_containment.gui.global_summary.tt: "Only outbreaks visible to this country contribute to the displayed state and country totals. Hidden foreign incubation and undisclosed weapon projects are excluded."
disease_containment.gui.country_summary: "[This.GetDiseaseContainmentCountrySummary]"
disease_containment.gui.country_summary.tt: "Preparedness reflects biological security, prevention technology, hygiene, quarantine, border controls, war, and stability. Medical Capacity comes from the shared CBRN system."
disease_containment.gui.refresh: "Refresh"
disease_containment.gui.refresh.tt: "Rebuild the visible list and refresh the existing disease mapmode."
disease_containment.gui.close: "Close"
disease_containment.gui.close.tt: "Close the board. Paid state projects and the controlled response-state record continue."
disease_containment.gui.tab.anthrax: "Anthrax"
disease_containment.gui.tab.anthrax.tt: "Inspect Anthrax states and show relevant shared actions."
disease_containment.gui.tab.plague: "Plague"
disease_containment.gui.tab.plague.tt: "Inspect ordinary plague states and show relevant shared actions."
disease_containment.gui.tab.tularemia: "Tularemia"
disease_containment.gui.tab.tularemia.tt: "Inspect Tularemia states and show relevant shared actions."
disease_containment.gui.tab.smallpox: "Smallpox"
disease_containment.gui.tab.smallpox.tt: "Inspect Smallpox states and show relevant shared actions."
disease_containment.gui.tab.black_plague: "Black Plague"
disease_containment.gui.tab.black_plague.tt: "Inspect Black Plague states and show state-specific containment, treatment, sanitation, and rat-control actions. Map identity remains black for every visible established state even when another tab is selected."
disease_containment.gui.filter.status: "[This.GetDiseaseContainmentStatusFilter]"
disease_containment.gui.filter.status.tt: "Cycle between every state, critical states, active infection, containment and recovery, and monitored states."
disease_containment.gui.filter.ownership: "[This.GetDiseaseContainmentOwnershipFilter]"
disease_containment.gui.filter.ownership.tt: "Cycle between every visible state, states controlled by this country, and public foreign outbreaks."
disease_containment.gui.filter.urgency: "[This.GetDiseaseContainmentUrgencyFilter]"
disease_containment.gui.filter.urgency.tt: "Cycle between every urgency band, high or critical states, and critical states only."
disease_containment.gui.states: "Visible States: [?disease_containment_board_state_count|0]"
disease_containment.gui.no_states: "No states match the selected disease and filters."
disease_containment.gui.selected.title: "Selected State"
disease_containment.gui.selected.summary: "§Y[?disease_containment_board_view_state.GetName]§!\n[?disease_containment_board_view_state.GetDiseaseContainmentBoardStateControllerSummary]\n[?disease_containment_board_view_state.GetDiseaseContainmentBoardStateStatus]"
disease_containment.gui.selected.summary.tt: "The inspection state may be controlled locally or publicly identified abroad. Only a controlled eligible Black Plague state can become the persistent response target for paid decisions."
disease_containment.gui.selected.private_values: "[This.GetDiseaseContainmentSelectedPrivateValues]"
disease_containment.gui.selected.private_values.tt: "These exact values are available because this country controls the selected state."
disease_containment.gui.selected.public_values: "[This.GetDiseaseContainmentSelectedPublicValues]"
disease_containment.gui.selected.public_values.tt: "Foreign outbreaks expose only public and qualitative information."
disease_containment.gui.response_target: "Response state: §Y[?black_plague_selected_response_state.GetName]§!\nBlack Plague decisions below use this persistent controlled target."
disease_containment.gui.response_target.tt: "Changing disease tabs does not cancel active projects. Selecting a public foreign state clears the local response selection, but work already underway remains state-owned and continues."
disease_containment.gui.goto: "Go to State"
disease_containment.gui.goto.tt: "Center the map on the inspected state."
disease_containment.gui.state_entry: "[This.GetName]\n[This.GetDiseaseContainmentBoardStateEntryDetail]"
disease_containment.gui.state_entry.select.tt: "Inspect this state. A controlled Black Plague state also becomes the response target used by paid local decisions."
disease_containment.gui.state_entry.view: "§YVIEW§!"
disease_containment.gui.state_entry.response: "§GRESPONSE§!"

black_plague_select_response_state: "Select Black Plague Response State"
black_plague_select_response_state_desc: "Choose one controlled Black Plague state on the existing disease map. The shared board and plague decisions will use it as the persistent local response target."
black_plague_select_response_state_tt: "§Y[FROM.GetName]§! becomes the Black Plague response state. This selection has no material cost and does not alter disease values."
