MAC_independence_wave_municipal_charter: "Vardar Municipal Charter"
MAC_independence_wave_municipal_charter_long: "Vardar Municipal Charter"
MAC_independence_wave_mountain_workers: "Mountain Workers' Council"
MAC_independence_wave_mountain_workers_long: "Macedonian Mountain Workers' Council"
MAC_independence_wave_village_compact: "Village Autonomy Compact"
MAC_independence_wave_village_compact_long: "Macedonian Village Autonomy Compact"
MAC_independence_wave_emergency_commission: "Mountain Defence Commission"
MAC_independence_wave_emergency_commission_long: "Macedonian Mountain Defence Commission"
MAC_independence_wave_patron_rail_compact: "Vardar Rail Compact"
MAC_independence_wave_patron_rail_compact_long: "Vardar Patron Rail Compact"

mac_divided_vardar_authority: "Divided Vardar Authority"
mac_divided_vardar_authority_desc: "Municipal delegates, veteran networks, and inherited offices still dispute who may speak for the released state. Supplies and mountain defence suffer while the compact remains unsettled."
mac_vardar_compact: "Vardar Compact"
mac_vardar_compact_desc: "A negotiated civic compact joins the Vardar municipalities to screened mountain formations and gives the new state a durable administrative centre."
mac_municipal_charter: "Municipal Charter"
mac_municipal_charter_desc: "A published charter gives municipalities a share of taxation, recognition, and public-service authority while the central government builds capacity."
mac_mountain_workers_council: "Mountain Workers' Council"
mac_mountain_workers_council_desc: "Workshops, miners, and railway crews coordinate production and transport through a council that answers to the released state."
mac_village_autonomy_compact: "Village Autonomy Compact"
mac_village_autonomy_compact_desc: "Village councils keep local obligations and food routes visible to the central government, improving stability and recruiting power."
mac_mountain_defence_commission: "Mountain Defence Commission"
mac_mountain_defence_commission_desc: "A central commission screens armed formations and concentrates scarce equipment on the Vardar approaches."
mac_patron_rail_compact: "Patron Rail Compact"
mac_patron_rail_compact_desc: "A negotiated patron relationship opens rail access and supplies while imposing obligations on the new government."

independence_wave_mac_vardar_council_category: "Vardar Civic Council"
independence_wave_mac_vardar_council_category_desc: "The council coordinates municipal rights, veteran networks, mountain defence, and the former-host settlement while the compact remains fragile."
independence_wave_mac_hold_vardar_council_together: "Hold the Vardar Council Together"
independence_wave_mac_hold_vardar_council_together_desc: "The first council must keep municipal delegates, railway officials, and mountain veterans inside one provisional authority."
independence_wave_mac_reopen_vardar_depots: "Reopen the Vardar Depots"
independence_wave_mac_reopen_vardar_depots_desc: "Recover stores along the anchor's roads and place them under a common register. Administrative capacity and a civilian-factory commitment are required."
independence_wave_mac_screen_veteran_networks: "Screen the Veteran Networks"
independence_wave_mac_screen_veteran_networks_desc: "Vetted veterans can strengthen the opening force, but every formation must accept the defence commission before receiving the compact's supplies."
independence_wave_mac_convene_community_council: "Convene the Community Council"
independence_wave_mac_convene_community_council_desc: "Bring the region's communities into one council with explicit rights and a shared rail and tax register."
independence_wave_mac_settle_yugoslav_ledgers: "Settle Relations with [GetIndependenceWaveFormerHostNameDef]"
independence_wave_mac_settle_yugoslav_ledgers_desc: "Negotiate borders, property claims, population obligations, and recognition with [GetIndependenceWaveFormerHostNameDef]. The talks cannot continue if war begins."
independence_wave_mac_ratify_municipal_charter: "Ratify the Municipal Charter"
independence_wave_mac_ratify_municipal_charter_desc: "Give the municipalities a constitutional voice and make the central government responsible to the Vardar compact."
independence_wave_mac_convene_mountain_workers: "Convene the Mountain Workers' Council"
independence_wave_mac_convene_mountain_workers_desc: "Place workshops and railway crews under a council that can meet the army's material demands without dissolving local authority."
independence_wave_mac_restore_village_autonomy: "Restore Village Autonomy"
independence_wave_mac_restore_village_autonomy_desc: "Renew local compacts that protect food routes and keep mountain communities supplied through a traditional settlement."
independence_wave_mac_establish_mountain_commission: "Establish the Mountain Commission"
independence_wave_mac_establish_mountain_commission_desc: "Put the emergency chain of command above factional units and prepare the compact for a hard border war."
independence_wave_mac_accept_rail_patron_compact: "Accept the Vardar Rail Compact"
independence_wave_mac_accept_rail_patron_compact_desc: "Trade a measure of sovereignty for rail access, supplies, recognition, and a foreign guarantor's obligations."
independence_wave_mac_codify_vardar_settlement: "Codify the Vardar Settlement"
independence_wave_mac_codify_vardar_settlement_desc: "A stable authority, a recognised border, and an integrated mountain force can turn the liberation into a durable state."
independence_wave_mac_open_danube_network: "Open the Danube Network"
independence_wave_mac_open_danube_network_desc: "Use the league's channels to exchange supplies, officers, and recognition with other states that survived the wave."

independence_wave_mac_project_failure_effect_tt: "The civic and mountain-defence ledgers fall as the provisional authority loses control of the compact."
independence_wave_mac_depots_effect_tt: "Reopened depots improve the Vardar civic mandate and mountain-defence readiness."
independence_wave_mac_networks_effect_tt: "Screened veteran networks strengthen the opening force and improve defence readiness."
independence_wave_mac_community_effect_tt: "The community council raises the civic mandate and gives the compact a public settlement."
independence_wave_mac_host_ledgers_effect_tt: "[GetIndependenceWaveFormerHostNameDefCap] reduces its claims, hostility, obligations, and property demands while accepting firmer borders."
independence_wave_mac_route_effect_tt: "The selected government route becomes the active authority and changes the Vardar ledgers."
independence_wave_mac_sovereignty_effect_tt: "Macedonia secures durable sovereignty. Legitimacy, recognition, capacity, and security rise as instability falls."
independence_wave_mac_network_effect_tt: "The Danube network strengthens league standing, common cause, and member confidence."

MAC_independence_wave_vardar_presidium: "Metodija Andonov-Cento"
MAC_independence_wave_vardar_presidium_desc: "Metodija Andonov-Cento coordinates municipal delegates, veteran networks, and the mountain defence commission in Macedonia's provisional government."
