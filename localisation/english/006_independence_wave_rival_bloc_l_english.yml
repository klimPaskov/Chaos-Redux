independence_wave_rival_bloc_invite_member: "Open a Rival Bloc Invitation"
independence_wave_rival_bloc_invite_member_desc: "Spend a transport and arms package to invite a network state into the rival contract. Delivery takes time, and the recipient has a limited period to answer. The target must remain independent, outside the main league, and above the standing threshold until delivery and before it can accept."
independence_wave_rival_bloc_accept_membership: "Accept the Rival Bloc Charter"
independence_wave_rival_bloc_accept_membership_desc: "Pay the diplomatic cost and begin a [?constant:independence_wave_rival_bloc_duration.acceptance|0]-day ratification of the rival contract. Membership preserves network standing while placing the country under the bloc's confidence, reserve, patron, and host-front ledgers. If eligibility changes before ratification, the invitation is declined and the committed transport is not recovered."
independence_wave_rival_bloc_accept_membership_requirements_tt: "Requires an active invitation from the current rival-bloc leader, network membership with sufficient standing, peace, and no main-league or incompatible client commitment."
independence_wave_rival_bloc_respond_to_invitation: "Answer the Rival Bloc Invitation"
independence_wave_rival_bloc_respond_to_invitation_desc: "A rival-bloc charter delegation awaits an answer. Accepting the charter begins its separate ratification period. If no answer is given before this deadline, the bloc records a refusal."
independence_wave_rival_bloc_invitation_response_expired_tt: "The unanswered rival-bloc invitation is treated as a refusal."
independence_wave_rival_bloc_decline_membership: "Decline the Rival Bloc Charter"
independence_wave_rival_bloc_decline_membership_desc: "Decline the invitation. The bloc loses confidence because a live network state rejected its counter-league."
independence_wave_rival_bloc_commit_shared_reserve: "Commit to the Shared Reserve"
independence_wave_rival_bloc_commit_shared_reserve_desc: "Commit trains, fuel, and infantry equipment to the bloc reserve. The timed commitment raises common cause and confidence, while cancellation or loss of the member damages both."
independence_wave_rival_bloc_coordinate_host_front: "Coordinate the Former-Host Front"
independence_wave_rival_bloc_coordinate_host_front_desc: "Commit a supplied front against the former host. The action lowers bilateral reconquest pressure and the bloc's host-pressure meter, but its equipment and fuel are spent even if the front worsens."
independence_wave_rival_bloc_balance_patron: "Balance the Patron Channel"
independence_wave_rival_bloc_balance_patron_desc: "Spend convoys and fuel to renegotiate the patron relationship. Capture falls and the member's confidence rises, but the bloc must accept the diplomatic cost and the patron's reduced leverage."
independence_wave_rival_bloc_challenge_leadership: "Challenge Rival Bloc Leadership"
independence_wave_rival_bloc_challenge_leadership_desc: "A confident member can spend command, experience, and equipment on a leadership challenge. Success changes the bloc's leader and redistributes confidence; cancellation leaves the bloc less cohesive."
independence_wave_rival_bloc_leave_contract: "Leave the Rival Bloc"
independence_wave_rival_bloc_leave_contract_desc: "Leave the separate rival contract while preserving the wider independence network. The departure lowers bloc cohesion and can dissolve the contract if no members remain."

