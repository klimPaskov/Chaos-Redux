CAT_independence_wave_protected_charter_long: "Catalan Protected Charter"

independence_wave_cat_accept_protected_customs_mandate: "Accept the Protected Customs Mandate"
independence_wave_cat_accept_protected_customs_mandate_desc: "Secure recognition, supplies, and a guarded trade channel by accepting a patron's customs mandate without surrendering the Catalan assembly."

cat_contested_assembly: "Contested Assembly"
cat_contested_assembly_desc: "The provisional assembly must balance industrial survival against competing civic mandates."
cat_industrial_compact: "Industrial Compact"
cat_industrial_compact_desc: "Barcelona's workshops, rail offices, and civic assembly now share a stable industrial compact."
cat_constitutional_charter: "Constitutional Charter"
cat_constitutional_charter_desc: "A constitutional route gives the provisional state a public legal foundation and a clearer mandate."
cat_workers_board: "Workers' Board"
cat_workers_board_desc: "Workers' delegates coordinate production, supply, and public order through the board."
cat_municipal_covenant: "Municipal Covenant"
cat_municipal_covenant_desc: "Municipal authority is protected by a covenant that still binds the comarques to common defence."
cat_security_command: "Pyrenean Security Command"
cat_security_command_desc: "An emergency command holds the mountain approaches and the industrial rail spine."
cat_patron_trade_mission: "Protected Trade Mission"
cat_patron_trade_mission_desc: "A patron-backed trade mission turns recognition into supplies, contracts, and diplomatic leverage."

independence_wave_cat_secure_barcelona_port_focus: "Secure the Barcelona Port"
independence_wave_cat_secure_barcelona_port_focus_desc: "The port is the hinge between factory survival and maritime recognition."
independence_wave_cat_secure_barcelona_port_tt: "Reopen the port offices and raise Catalan industrial cohesion."
independence_wave_cat_integrate_factory_workers_focus: "Integrate Factory Workers"
independence_wave_cat_integrate_factory_workers_focus_desc: "A single command can protect the factories without erasing their civic committees."
independence_wave_cat_integrate_factory_workers_tt: "Integrate the factory guards and strengthen the industrial compact."
independence_wave_cat_reconcile_assembly_focus: "Reconcile the Assembly"
independence_wave_cat_reconcile_assembly_focus_desc: "A common assembly procedure can keep the civic and workers' mandates from splitting the state."
independence_wave_cat_reconcile_assembly_tt: "Reconcile assembly procedure and raise assembly legitimacy."
independence_wave_cat_settle_iberian_charter_focus: "Settle the Iberian Charter"
independence_wave_cat_settle_iberian_charter_focus_desc: "The former host must see a negotiated settlement as safer than a reconquest."
independence_wave_cat_settle_iberian_charter_tt: "Settle former-host ledgers and improve the founding compact."
independence_wave_cat_open_mediterranean_corridor_focus: "Open the Mediterranean Corridor"
independence_wave_cat_open_mediterranean_corridor_focus_desc: "Barcelona can turn the league's maritime promise into a working corridor."
independence_wave_cat_open_mediterranean_corridor_tt: "Open the Mediterranean network and increase league cooperation."
independence_wave_cat_ratify_catalan_sovereignty_focus: "Ratify Catalan Sovereignty"
independence_wave_cat_ratify_catalan_sovereignty_focus_desc: "A stable compact and a chosen government can make sovereignty durable."
independence_wave_cat_ratify_catalan_sovereignty_tt: "Codify durable sovereignty and complete the Catalan settlement."
