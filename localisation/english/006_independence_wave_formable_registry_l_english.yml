independence_wave_form09_federal_general_staff: "Federal General Staff"
independence_wave_form09_federal_general_staff_desc: "The consenting armies answer to one general staff while the federal government settles the frontiers they defend."
independence_wave_form09_autonomous_balkan_member: "Autonomous Federal Member"
independence_wave_form09_autonomous_balkan_member_desc: "Our government retains its territory, armed forces, and institutions while contributing officers and defensive plans to the Balkan Federation."
independence_wave_form09_balkan_category: "Balkan Federal Settlement"
independence_wave_form09_balkan_category_desc: "The founding governments must turn their congress lines into a border settlement that civil authorities and the general staff can uphold."
independence_wave_form09_ratify_border_board: "Ratify the Federal Border Board"
independence_wave_form09_ratify_border_board_desc: "Fund survey teams, legal delegations, and military liaison offices to confirm the constituent frontiers recognized by the charter."
independence_wave_form09_ratify_border_board_effect_tt: "Legitimacy rises by §G[?constant:independence_wave_decision_effect.value_standard|0]§!, Recognition by §G[?constant:independence_wave_decision_effect.value_standard|0]§!, Capacity by §G[?constant:independence_wave_decision_effect.value_minor|0]§!, and Security by §G[?constant:independence_wave_decision_effect.value_standard|0]§!. Instability changes by §G[?constant:independence_wave_decision_effect.value_standard_loss|0]§!."
independence_wave_form09_ratify_border_board_cancel_effect_tt: "The Federal Border Board is abandoned. Legitimacy, Recognition, and Security each fall by §R[?constant:independence_wave_decision_effect.value_minor|0]§!. Instability rises by §R+[?constant:independence_wave_decision_effect.value_minor|0]§!."
independence_wave_form09_invitation_response_cancel_effect_tt: "The Balkan invitation response is withdrawn before consent is recorded."

