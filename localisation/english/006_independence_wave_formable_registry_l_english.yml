independence_wave_formable_transaction_category: "Formation Covenant"
independence_wave_formable_transaction_category_desc: "Choose how the proposed common state will be founded and whose consent will carry its charter."

independence_wave_select_negotiated_formation_method: "Negotiate a Federal Charter"
independence_wave_select_negotiated_formation_method_desc: "Found [This.GetIndependenceWaveSelectedFormableName] through a congress of recognized governments, territorial delegations, and negotiated institutions."
independence_wave_select_dynastic_formation_method: "Join the Traditional Houses"
independence_wave_select_dynastic_formation_method_desc: "Found [This.GetIndependenceWaveSelectedFormableName] through a settlement among compatible houses, councils, and traditional authorities."
independence_wave_select_revolutionary_formation_method: "Unite the Revolutionary Councils"
independence_wave_select_revolutionary_formation_method_desc: "Found [This.GetIndependenceWaveSelectedFormableName] through common councils, social transformation, and a shared revolutionary mandate."
independence_wave_select_military_formation_method: "Impose a Military Settlement"
independence_wave_select_military_formation_method_desc: "Found [This.GetIndependenceWaveSelectedFormableName] through controlled capital states and a military settlement. Uncontrolled member lands remain outside the charter."
independence_wave_select_league_formation_method: "Transform the Regional League"
independence_wave_select_league_formation_method_desc: "Turn an established league and its shared institutions into [This.GetIndependenceWaveSelectedFormableName]."
independence_wave_select_hidden_formation_method: "Issue the Sovereignty Proclamation"
independence_wave_select_hidden_formation_method_desc: "Invoke an exceptional sovereignty claim available only to a fully revealed high-chaos family."

independence_wave_choose_voluntary_membership: "Offer Voluntary Membership"
independence_wave_choose_voluntary_membership_desc: "Count declared supporters toward the charter, leave observers outside the common state, and halt the congress if an eligible member openly opposes it."
independence_wave_choose_unanimous_compact: "Demand a Unanimous Compact"
independence_wave_choose_unanimous_compact_desc: "Require every registered member to consent before the charter can be ratified."
independence_wave_choose_controlled_settlement: "Define a Controlled Settlement"
independence_wave_choose_controlled_settlement_desc: "Base the charter on controlled capital states. Use registered settlements and preserve each living member's institutions."
independence_wave_issue_founding_invitations: "Dispatch the Founding Invitations"
independence_wave_issue_founding_invitations_desc: "Send one recorded charter proposal to every eligible founding government. Each reply will belong only to our present proposal and cannot authorize another founding state's congress."

