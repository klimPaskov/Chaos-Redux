# FORM-11 Cossack Host Federation charter.
independence_wave_form11_family_opened_tt: "The Don and Kuban hosts may now found the §YCossack Host Federation§! together, once both are free and willing."
independence_wave_form11_project_ready_tt: "The federation controls its capital and no other charter project is under way."
independence_wave_form11_host_category: "Host Federation Charter"
independence_wave_form11_host_category_desc: "The charter becomes coordinated when every measure reaches [?constant:independence_wave_form11_value.coordinated_threshold|0] and integrated at [?constant:independence_wave_form11_value.integrated_threshold|0]. Only one charter project runs at a time, and Rostov stays outside the federation.\n\nCivilian Control: §Y[?independence_wave_form11_civilian_control|0]§!  Cavalry Integration: §Y[?independence_wave_form11_cavalry_integration|0]§!  Resident Settlement: §Y[?independence_wave_form11_resident_settlement|0]§!"
independence_wave_form11_provisional_charter: "Provisional Host Charter"
independence_wave_form11_provisional_charter_desc: "The Don and Kuban hosts share a flag and a council, but their regiments still answer to separate atamans and the non-Cossack towns have no settled voice."
independence_wave_form11_coordinated_charter: "Coordinated Host Charter"
independence_wave_form11_coordinated_charter_desc: "A federal council answers for the mounted corps, the host regiments train to one standard, and the stanitsa lands are open to residents who were never Cossacks."
independence_wave_form11_integrated_charter: "Integrated Host Charter"
independence_wave_form11_integrated_charter_desc: "The Cossack Host Federation governs its corps through a civilian council and treats every resident of the steppe as a citizen. Its mounted divisions are among the best trained in the region."
independence_wave_form11_autonomous_host_member: "Autonomous Host Membership"
independence_wave_form11_autonomous_host_member_desc: "A sovereign host joins the Cossack Host Federation through reciprocal access and guarantees while keeping its own government, territory and regiments."
independence_wave_form11_seat_federal_host_council: "Seat the Federal Host Council"
independence_wave_form11_seat_federal_host_council_desc: "Place the mounted command under a council elected by the Don and Kuban circles, with civilian members who approve every mobilization."
independence_wave_form11_seat_federal_host_council_tt: "Raises §Ycivilian control§! sharply and §Yresident settlement§! and §Ycavalry integration§! a little."
independence_wave_form11_raise_federal_mounted_corps: "Raise the Federal Mounted Corps"
independence_wave_form11_raise_federal_mounted_corps_desc: "Merge the host regiments into one corps with a shared staff, common remounts and one drill book, paid for with men and equipment from our own stores."
independence_wave_form11_raise_federal_mounted_corps_tt: "Raises §Ycavalry integration§! sharply and §Ycivilian control§! a little."
independence_wave_form11_open_stanitsa_lands: "Open the Stanitsa Lands"
independence_wave_form11_open_stanitsa_lands_desc: "Give the Russian and Ukrainian peasants who rent host land the right to own it and to vote in the stanitsa assemblies. Older Cossack families will see their privileges shrink."
independence_wave_form11_open_stanitsa_lands_tt: "Raises §Yresident settlement§! sharply and §Ycivilian control§! a little, but lowers §Ycavalry integration§! as host privileges shrink."
independence_wave_form11_convene_grand_host_circle: "Convene the Grand Host Circle"
independence_wave_form11_convene_grand_host_circle_desc: "Call delegates from every stanitsa and town to review the charter and settle the disputes that remain."
independence_wave_form11_convene_grand_host_circle_tt: "Raises every charter measure a little."
