independence_wave_form08_provisional_charter: "Provisional Danube Charter"
independence_wave_form08_provisional_charter_desc: "A fragile federal settlement keeps the Danube corridor open while arbitration, transport authority, and minority guarantees are still being built."
independence_wave_form08_coordinated_charter: "Coordinated Danube Charter"
independence_wave_form08_coordinated_charter_desc: "A working congress now coordinates the Danube corridor, with member governments retaining their institutions under a negotiated federal settlement."
independence_wave_form08_integrated_charter: "Integrated Danube Charter"
independence_wave_form08_integrated_charter_desc: "The Danubian Confederation has established a durable federal authority, a functioning corridor, and enforceable minority guarantees."
independence_wave_form08_autonomous_danube_member: "Danubian Autonomous Membership"
independence_wave_form08_autonomous_danube_member_desc: "A sovereign Event 006 country participates in the Danubian compact through reciprocal access and guarantees without surrendering its origin, focus content, or territory."
independence_wave_form08_convene_river_congress: "Convene the River Congress"
independence_wave_form08_convene_river_congress_desc: "Bring the member governments together to settle transport authority and the federal balance along the Danube."
independence_wave_form08_arbitrate_minorities: "Arbitrate the Border Communities"
independence_wave_form08_arbitrate_minorities_desc: "Fund a public arbitration process for mixed towns, languages, and local institutions before the charter hardens into a central settlement."
independence_wave_form08_standardize_rail_authority: "Standardize Rail and River Authority"
independence_wave_form08_standardize_rail_authority_desc: "Create a shared transport authority for the corridor, with concrete administrative and strategic commitments from the carrier."
independence_wave_form08_project_cost: "Commits Stability, War Support, Command Power, transport reserves, and manpower for a Danube charter project."
independence_wave_form08_convene_river_congress_tt: "Raises federal cohesion and arbitration capacity after a long, costed congress."
independence_wave_form08_arbitrate_minorities_tt: "Raises minority settlement and recognition after a costed public arbitration."
independence_wave_form08_standardize_rail_authority_tt: "Raises transport authority and federal cohesion after a costed infrastructure convention."
independence_wave_form08_danube_category: "Danubian Federal Charter"
independence_wave_form08_danube_category_desc: "The Danubian Confederation measures its survival through federal cohesion, arbitration capacity, transport authority, and minority settlement. Each project consumes real strategic and administrative reserves."

independence_wave_form39_authorize_full_integration: "Authorize Full Integration"
independence_wave_form39_authorize_full_integration_desc: "Authorize the Fiji carrier to integrate the consenting Papuan and West Papuan anchors under the negotiated charter. Their origin in this independence wave is recorded before any transferred anchor is added to the federation."
independence_wave_form39_authorize_full_integration_tt: "Authorize full integration for this founding invitation at the diplomatic standard cost. Only consenting, controlled anchors may transfer."
independence_wave_form39_authorize_autonomous_membership: "Authorize Autonomous Membership"
independence_wave_form39_authorize_autonomous_membership_desc: "Join the Melanesian Federation as a sovereign member. Preserve Papua or West Papua's institutions, territory, and national focus content while accepting reciprocal access and guarantees."
independence_wave_form39_authorize_autonomous_membership_tt: "Authorize sovereign membership at the diplomatic standard cost. No state transfers or origin replacement occur."
independence_wave_form39_withhold_membership: "Withhold Membership"
independence_wave_form39_withhold_membership_desc: "Decline the recorded Melanesian founding invitation. Keep the national origin and territory outside the proposed federation."
independence_wave_form39_withhold_membership_tt: "Withhold this invitation at the diplomatic light cost. The federation's founding ledger will record opposition."

independence_wave_form03_authorize_core_delegation: "Authorize a Founding Delegation"
independence_wave_form03_authorize_core_delegation_desc: "Accept the recorded proposal from §Y[?independence_wave_formable_inviting_carrier.GetNameDef]§! for a negotiated charter. Only the consenting core anchor may enter the common state."
independence_wave_form03_withhold_core_delegation: "Withhold the Founding Mandate"
independence_wave_form03_withhold_core_delegation_desc: "Decline the recorded proposal from §Y[?independence_wave_formable_inviting_carrier.GetNameDef]§!. A voluntary charter cannot proceed while an eligible founding government formally opposes it."
independence_wave_form03_belgium_authorize_founding_delegation: "Send a Belgian Founding Delegation"
independence_wave_form03_belgium_authorize_founding_delegation_desc: "Authorize Belgium's Flemish delegation to answer §Y[?independence_wave_formable_inviting_carrier.GetNameDef]§!'s recorded proposal and join the founding congress as a sovereign member. Belgian territory, institutions, and national identity remain under Belgian authority."
independence_wave_form03_belgium_withhold_founding_delegation: "Keep Belgium Outside the Charter"
independence_wave_form03_belgium_withhold_founding_delegation_desc: "Decline the recorded invitation from §Y[?independence_wave_formable_inviting_carrier.GetNameDef]§! and preserve Belgium's place outside the proposed confederation."
independence_wave_form03_join_as_autonomous_member: "Associate with the Low Countries Charter"
independence_wave_form03_join_as_autonomous_member_desc: "Join the Confederation of the Low Countries as a sovereign member while retaining territory, national institutions, and an independent government."
independence_wave_form03_authorize_core_delegation_effect_tt: "Our founding delegation will count as consenting when a connected Walloon or Frisian government convenes the charter congress."
independence_wave_form03_withhold_core_delegation_effect_tt: "Our founding delegation will be recorded as opposed to the charter."
independence_wave_form03_belgium_authorize_effect_tt: "Belgium will support the founding charter as a sovereign member without transferring Belgian territory."
independence_wave_form03_belgium_withhold_effect_tt: "Belgium will formally withhold its support from the founding charter."
independence_wave_form03_join_as_autonomous_member_effect_tt: "We will enter the Low Countries association as a sovereign post-charter member."
independence_wave_form03_compatible_route_tt: "The carrier must follow a constitutional settlement or belong to a league governed by the Development Compact."

independence_wave_form39_negotiate_island_shipping_convention: "Negotiate the Island Shipping Convention"
independence_wave_form39_negotiate_island_shipping_convention_desc: "Fund a joint maritime schedule between the three consenting members. The convention costs command attention, stability, administration, and convoy or train reserves while it builds federal logistics."
independence_wave_form39_negotiate_island_shipping_convention_tt: "The convention will increase maritime logistics, federal capacity, recognition, and member consent."
independence_wave_form39_open_regional_civil_service: "Open the Regional Civil Service"
independence_wave_form39_open_regional_civil_service_desc: "Create a staffed civil-service exchange for port offices, schools, customs, and emergency administration. The project spends diplomatic attention and strategic reserves over a long preparation window."
independence_wave_form39_open_regional_civil_service_tt: "The service will increase cultural autonomy, federal capacity, recognition, security, and stability."
independence_wave_form39_stage_member_plebiscites: "Stage Member Plebiscites"
independence_wave_form39_stage_member_plebiscites_desc: "Hold locally administered votes before any disputed integration. The federation pays a security and equipment cost and accepts a long public timetable rather than forcing a central settlement."
independence_wave_form39_stage_member_plebiscites_tt: "The plebiscites will increase member consent and cultural autonomy while improving recognition, capacity, security, and stability."
independence_wave_form39_dissolve_federation: "Dissolve the Melanesian Federation"
independence_wave_form39_dissolve_federation_desc: "End the federal charter and release its autonomous members from the reciprocal compact. The dissolution costs political standing and clears relations created by the federation."
independence_wave_form39_dissolve_federation_tt: "The federation will dissolve, with severe legitimacy, recognition, capacity, security, and stability consequences."
independence_wave_form39_shipping_cost: "Commits [?constant:independence_wave_decision_cost.stability_standard|%0] Stability, [?constant:independence_wave_decision_cost.war_support_minor|%0] War Support, [?constant:independence_wave_formable_cost.civic_command_power|0] Command Power, [?constant:independence_wave_decision_cost.convoy_standard|0] convoys or trains, and [?constant:independence_wave_decision_cost.manpower_standard|0] manpower."
independence_wave_form39_shipping_cost_tooltip: "Commits strategic and standard-administration reserves. Requires [?constant:independence_wave_decision_cost.civilian_factory_standard|0] spare civilian factories."
independence_wave_form39_shipping_cost_blocked: "Unavailable: requires [?constant:independence_wave_decision_cost.stability_standard|%0] Stability, [?constant:independence_wave_decision_cost.war_support_minor|%0] War Support, [?constant:independence_wave_formable_cost.civic_command_power|0] Command Power, [?constant:independence_wave_decision_cost.convoy_standard|0] convoys or trains, [?constant:independence_wave_decision_cost.manpower_standard|0] manpower, and [?constant:independence_wave_decision_cost.civilian_factory_standard|0] spare civilian factories."
independence_wave_form39_civil_service_cost: "Commits [?constant:independence_wave_decision_cost.stability_standard|%0] Stability, [?constant:independence_wave_decision_cost.war_support_minor|%0] War Support, [?constant:independence_wave_formable_cost.civic_command_power|0] Command Power, and two [?constant:independence_wave_decision_cost.convoy_standard|0]-convoy or train commitments."
independence_wave_form39_civil_service_cost_tooltip: "Each transport commitment may use convoys or trains. Requires enough stockpile for both commitments and [?constant:independence_wave_decision_cost.civilian_factory_standard|0] spare civilian factories."
independence_wave_form39_civil_service_cost_blocked: "Unavailable: requires [?constant:independence_wave_decision_cost.stability_standard|%0] Stability, [?constant:independence_wave_decision_cost.war_support_minor|%0] War Support, [?constant:independence_wave_formable_cost.civic_command_power|0] Command Power, two [?constant:independence_wave_decision_cost.convoy_standard|0]-convoy or train commitments, and [?constant:independence_wave_decision_cost.civilian_factory_standard|0] spare civilian factories."
independence_wave_form39_plebiscite_cost: "Commits [?constant:independence_wave_decision_cost.stability_standard|%0] Stability, [?constant:independence_wave_decision_cost.war_support_minor|%0] War Support, [?constant:independence_wave_decision_cost.command_power_standard|0] Command Power, [?constant:independence_wave_decision_cost.convoy_standard|0] convoys or trains, [?constant:independence_wave_decision_cost.manpower_standard|0] manpower, [?constant:independence_wave_decision_cost.army_experience_standard|0] Army Experience, [?constant:independence_wave_decision_cost.infantry_standard|0] infantry equipment, and [?constant:independence_wave_decision_cost.support_standard|0] support equipment."
independence_wave_form39_plebiscite_cost_tooltip: "Commits strategic and standard-security reserves. Requires [?constant:independence_wave_decision_cost.civilian_factory_standard|0] spare civilian factories."
independence_wave_form39_plebiscite_cost_blocked: "Unavailable: requires [?constant:independence_wave_decision_cost.stability_standard|%0] Stability, [?constant:independence_wave_decision_cost.war_support_minor|%0] War Support, [?constant:independence_wave_decision_cost.command_power_standard|0] Command Power, [?constant:independence_wave_decision_cost.convoy_standard|0] convoys or trains, [?constant:independence_wave_decision_cost.manpower_standard|0] manpower, [?constant:independence_wave_decision_cost.army_experience_standard|0] Army Experience, [?constant:independence_wave_decision_cost.infantry_standard|0] infantry equipment, [?constant:independence_wave_decision_cost.support_standard|0] support equipment, and [?constant:independence_wave_decision_cost.civilian_factory_standard|0] spare civilian factories."
independence_wave_form39_invitation_category: "The Melanesian Founding Congress"
independence_wave_form39_invitation_category_desc: "The recorded congress invitation links Fiji, Papua, and West Papua through a negotiated charter. A member may authorize full integration, preserve sovereign autonomy, or withhold consent. No response overwrites its originating movement or national tree."
independence_wave_form39_federal_compact_category: "The Melanesian Federal Compact"
independence_wave_form39_federal_compact_category_desc: "§YFederal Carrier:§! [FIJ.GetName]\n§CMaritime Logistics:§! [?FIJ.independence_wave_form39_maritime_logistics|0]/100\n§GCultural Autonomy:§! [?FIJ.independence_wave_form39_cultural_autonomy|0]/100\n§YFederal Capacity:§! [?FIJ.independence_wave_form39_federal_capacity|0]/100\n§OMember Consent:§! [?FIJ.independence_wave_form39_member_consent|0]/100\n\nThe carrier must fund shipping, civil-service, and plebiscite projects with concrete command, stability, equipment, manpower, and transport costs. Autonomous members retain their origins and institutions while reciprocal access and guarantees remain bound to this generation."

independence_wave_form39_federal_charter: "Melanesian Federal Charter"
independence_wave_form39_federal_charter_desc: "A negotiated federation joins Fiji, Papua, and West Papua through a maritime congress. Its strength depends on logistics, cultural autonomy, federal capacity, and member consent."
independence_wave_form39_autonomous_compact: "Melanesian Autonomous Compact"
independence_wave_form39_autonomous_compact_desc: "A sovereign member of the Melanesian Federation retains its original institutions, territory, and local authority while participating in reciprocal access and guarantees."

