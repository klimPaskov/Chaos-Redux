l_english:
chaosx.nr52.1.t: "Intelligence leak"

chaosx.nr52.2.t: "Intelligence leak"
chaosx.nr52.2.d: "A breach has exposed our nation's intelligence files to every country. Secret operations and military plans are now available to foreign governments, leaving our agents and commanders vulnerable."
chaosx.nr52.2.a: "Nothing is secret anymore"

chaosx.news.53.t: "Intel leaked"
chaosx.news.53.d: "Sensitive files from [From.GetName]'s intelligence agencies have been leaked worldwide. Every government can now study [From.GetName]'s operations and use the information for its own plans."
chaosx.news.53.a: "Discomforting"
