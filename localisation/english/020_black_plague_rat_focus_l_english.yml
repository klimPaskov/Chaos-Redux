l_english:
black_plague_rat_focus_tree: "Rat Nation"
black_plague_rat_first_warren: "The First Warren"
black_plague_rat_first_warren_desc: "A basin becomes a home, a pantry, and a command post."
black_plague_rat_listen_to_the_drains: "Listen to the Drains"
black_plague_rat_listen_to_the_drains_desc: "Water and waste carry a map beneath every human road."
black_plague_rat_feral_quarantine: "Feral Quarantine"
black_plague_rat_feral_quarantine_desc: "Keep the brood immune by refusing every human contagion."
black_plague_rat_no_human_rations: "No Human Rations"
black_plague_rat_no_human_rations_desc: "The brood grows from captured stores and its own mass."
black_plague_rat_urban_warren: "Urban Warren"
black_plague_rat_urban_warren_desc: "Cities offer cellars, wires, and thousands of blind corners."
black_plague_rat_cellar_cities: "Cellar Cities"
black_plague_rat_cellar_cities_desc: "Link basements into a second street grid."
black_plague_rat_city_breachers: "City Breachers"
black_plague_rat_city_breachers_desc: "Specialist swarms open hospitals, depots, and sealed blocks."
black_plague_rat_field_brood: "Field Brood"
black_plague_rat_field_brood_desc: "Open country rewards quiet growth and sudden movement."
black_plague_rat_grain_pockets: "Grain Pockets"
black_plague_rat_grain_pockets_desc: "Find the stores that armies forgot to guard."
black_plague_rat_long_grass_ambush: "Long-Grass Ambush"
black_plague_rat_long_grass_ambush_desc: "A dispersed brood makes every field a trap."
black_plague_rat_dock_brood: "Dock Brood"
black_plague_rat_dock_brood_desc: "Salt water and cargo holds make distance irrelevant."
black_plague_rat_tide_pipes: "Tide Pipes"
black_plague_rat_tide_pipes_desc: "Port sewers become a route under the customs line."
black_plague_rat_wharf_raids: "Wharf Raids"
black_plague_rat_wharf_raids_desc: "Steal passages on ships without needing a human crew."
black_plague_rat_war_brood: "War Brood"
black_plague_rat_war_brood_desc: "Shellfire, refugees, and broken fronts conceal the advance."
black_plague_rat_rail_hunters: "Rail Hunters"
black_plague_rat_rail_hunters_desc: "Follow the timetable rather than the road."
black_plague_rat_frontline_burrows: "Frontline Burrows"
black_plague_rat_frontline_burrows_desc: "A trench is only a long, badly guarded warren."
black_plague_rat_brood_signal: "Brood Signal"
black_plague_rat_brood_signal_desc: "Clicks and scent bind distant nests to one pulse."
black_plague_rat_four_mouths: "Four Mouths"
black_plague_rat_four_mouths_desc: "Four archetypes share a warning before they share a crown."
black_plague_rat_choose_a_voice: "Choose a Voice"
black_plague_rat_choose_a_voice_desc: "A dominant voice can coordinate a basin without erasing it."
black_plague_rat_read_the_marks: "Read the Marks"
black_plague_rat_read_the_marks_desc: "Routes, stolen signs, and repeated human habits become a language of survival."
black_plague_rat_many_nests_one_signal: "Many Nests, One Signal"
black_plague_rat_many_nests_one_signal_desc: "Distributed instinct turns distance into strength and makes every warren a relay."
black_plague_rat_fang_above_the_warren: "Fang Above the Warren"
black_plague_rat_fang_above_the_warren_desc: "One commanding pattern gathers the brood for a harder, faster strike."
black_plague_rat_stolen_route_memory: "Stolen Route Memory"
black_plague_rat_stolen_route_memory_desc: "Captured route marks teach the brood where the human world is weakest."
black_plague_rat_capped_pulses: "Capped Pulses"
black_plague_rat_capped_pulses_desc: "Growth arrives in finite pulses, never as a free human levy."
black_plague_rat_citadel_warrens: "Citadel Warrens"
black_plague_rat_citadel_warrens_desc: "Turn the city's deep foundations into a defensible chain of brood chambers."
black_plague_rat_citadel_relays: "Citadel Relays"
black_plague_rat_citadel_relays_desc: "Carry commands through walls, service ducts, and buried lines before the surface hears them."
black_plague_rat_grain_tunnels: "Grain Tunnels"
black_plague_rat_grain_tunnels_desc: "Link forgotten granaries into a patient field network."
black_plague_rat_migration_burrows: "Migration Burrows"
black_plague_rat_migration_burrows_desc: "Move the brood beneath harvest roads and emptied villages without exposing the route."
black_plague_rat_tide_court: "Tide Court"
black_plague_rat_tide_court_desc: "Make the dock brood answer to tide tables, cargo bells, and the next unsearched hold."
black_plague_rat_cross_sea_cargo: "Cross-Sea Cargo"
black_plague_rat_cross_sea_cargo_desc: "The overseas route is no longer an accident of stowaways; it is a deliberate brood corridor."
black_plague_rat_frontline_command: "Frontline Command"
black_plague_rat_frontline_command_desc: "A broken front becomes a chain of nests, signals, and attacks launched from the smoke."
black_plague_rat_rail_breach: "Rail Breach"
black_plague_rat_rail_breach_desc: "The timetable becomes a weapon as broods move through the war's junctions."
black_plague_rat_immune_blood: "Immune Blood"
black_plague_rat_immune_blood_desc: "The plague that made the brood cannot consume it."
black_plague_rat_annex_the_weak: "Annex the Weak"
black_plague_rat_annex_the_weak_desc: "The stronger brood inherits the weaker brood's surviving strength."
black_plague_rat_prepare_the_crown: "Prepare the Crown"
black_plague_rat_prepare_the_crown_desc: "A successful basin can become the source of a separate royal mind."

black_plague_rat_king_focus_tree: "The Rat King"
black_plague_rat_king_the_royal_basin: "The Royal Basin"
black_plague_rat_king_the_royal_basin_desc: "A separate basin is reserved for a mind that can rule."
black_plague_rat_king_crown_the_broods: "Crown the Broods"
black_plague_rat_king_crown_the_broods_desc: "Independent nests accept one signal without losing their history."
black_plague_rat_king_listen_to_the_crown: "Listen to the Crown"
black_plague_rat_king_listen_to_the_crown_desc: "The first royal thoughts arrive as pressure, scent, and memory."
black_plague_rat_king_first_royal_decree: "First Royal Decree"
black_plague_rat_king_first_royal_decree_desc: "A decree turns sentience into an institution."
black_plague_rat_king_refuge_nodes: "Refuge Nodes"
black_plague_rat_king_refuge_nodes_desc: "Mark places where the brood can survive a human counterstroke."
black_plague_rat_king_capital_seals: "Capital Seals"
black_plague_rat_king_capital_seals_desc: "Cities that decide continents receive a royal mark."
black_plague_rat_king_the_four_registers: "The Four Registers"
black_plague_rat_king_the_four_registers_desc: "Dominion, sentience, cohesion, and hunger become visible statecraft."
black_plague_rat_absolute_crown: "Absolute Crown"
black_plague_rat_absolute_crown_desc: "One mind speaks for every surviving tunnel."
black_plague_rat_absolute_throne: "Absolute Throne"
black_plague_rat_absolute_throne_desc: "The crown absorbs the last independent court."
black_plague_rat_crown_tax: "Crown Tax"
black_plague_rat_crown_tax_desc: "Every captured storehouse feeds the royal reserve."
black_plague_rat_court_of_teeth: "Court of Teeth"
black_plague_rat_court_of_teeth_desc: "A disciplined court turns violence into law."
black_plague_rat_brood_council: "Brood Council"
black_plague_rat_brood_council_desc: "The King rules by remembered voices and negotiated hunger."
black_plague_rat_council_seats: "Council Seats"
black_plague_rat_council_seats_desc: "Every archetype receives a place beneath the crown."
black_plague_rat_shared_hunger: "Shared Hunger"
black_plague_rat_shared_hunger_desc: "A common ration law prevents one basin from eating the others."
black_plague_rat_warren_charter: "Warren Charter"
black_plague_rat_warren_charter_desc: "The royal order survives even when its first King is gone."
black_plague_rat_breath_hierophancy: "Black-Breath Hierophancy"
black_plague_rat_breath_hierophancy_desc: "The plague becomes a sacred language of command."
black_plague_rat_black_breath_liturgy: "Black-Breath Liturgy"
black_plague_rat_black_breath_liturgy_desc: "Ritual keeps sentience awake through long winters."
black_plague_rat_omens_in_burrows: "Omens in the Burrows"
black_plague_rat_omens_in_burrows_desc: "The court reads movement as prophecy before the humans see it."
black_plague_rat_crown_of_ash: "Crown of Ash"
black_plague_rat_crown_of_ash_desc: "A dead city becomes a royal shrine and an army."
black_plague_rat_crown_preserve_and_rule: "Preserve and Rule"
black_plague_rat_crown_preserve_and_rule_desc: "A concentrated crown keeps valuable populations alive long enough to serve it."
black_plague_rat_crown_granary_tithe: "Granary Tithe"
black_plague_rat_crown_granary_tithe_desc: "Every sealed storehouse pays the crown in food, brood mass, and obedience."
black_plague_rat_crown_capital_seals: "Capital Seals"
black_plague_rat_crown_capital_seals_desc: "The royal mark turns a human capital into a defended brood node."
black_plague_rat_crown_dominion: "Dominion of the Crown"
black_plague_rat_crown_dominion_desc: "Roads, capitals, and royal decrees become one instrument of command."
black_plague_rat_council_houses_of_memory: "Houses of Memory"
black_plague_rat_council_houses_of_memory_desc: "The council gives every surviving basin a voice and a ledger."
black_plague_rat_council_shared_ration_charter: "Shared Ration Charter"
black_plague_rat_council_shared_ration_charter_desc: "A common ration law prevents the strongest warren from consuming the rest."
black_plague_rat_council_safeguards: "Council Safeguards"
black_plague_rat_council_safeguards_desc: "Distributed authority protects the crown from one failed tunnel or one lost capital."
black_plague_rat_council_transparent_hunger: "Transparent Hunger"
black_plague_rat_council_transparent_hunger_desc: "The council names its hunger openly, turning sentience into a terminal plan."
black_plague_rat_hierophant_empty_the_cities: "Empty the Cities"
black_plague_rat_hierophant_empty_the_cities_desc: "A sacred campaign trades human abundance for immediate dominion and dangerous hunger."
black_plague_rat_hierophant_ashen_liturgy: "Ashen Liturgy"
black_plague_rat_hierophant_ashen_liturgy_desc: "The black breath becomes a language that binds death, memory, and command."
black_plague_rat_hierophant_black_breath_processions: "Black-Breath Processions"
black_plague_rat_hierophant_black_breath_processions_desc: "Processions carry plague doctrine through ports and arm advanced royal broods."
black_plague_rat_hierophant_final_omen: "The Final Omen"
black_plague_rat_hierophant_final_omen_desc: "The hierophancy records a terminal route, but every omen increases the cost of hunger."
black_plague_rat_royal_armouries: "Royal Armouries"
black_plague_rat_royal_armouries_desc: "Advanced broods are grown as named instruments of the crown."
black_plague_rat_crown_brutes: "Crown Brutes"
black_plague_rat_crown_brutes_desc: "Heavy broods hold the breach while smaller nests spread."
black_plague_rat_tunnel_columns: "Tunnel Columns"
black_plague_rat_tunnel_columns_desc: "Deep formations move under forts and rail embankments."
black_plague_rat_tail_guard: "Tail Guard"
black_plague_rat_tail_guard_desc: "A royal guard protects the basin behind the front."
black_plague_rat_sea_brood: "Sea Brood"
black_plague_rat_sea_brood_desc: "Cargo, ports, and tide pipes extend the royal reach overseas."
black_plague_rat_royal_template_lock: "Royal Template Lock"
black_plague_rat_royal_template_lock_desc: "Only the crown can authorize advanced brood formations."
black_plague_rat_hunger_court: "Hunger Court"
black_plague_rat_hunger_court_desc: "A crisis court must decide which basin receives the next pulse."
black_plague_rat_brood_succession: "Brood Succession"
black_plague_rat_brood_succession_desc: "The kingdom prepares for a King who can no longer speak."
black_plague_rat_human_minds_in_chains: "Human Minds in Chains"
black_plague_rat_human_minds_in_chains_desc: "Captured knowledge is exploited without granting humans a political voice."
black_plague_rat_refugee_memory: "Refugee Memory"
black_plague_rat_refugee_memory_desc: "The royal court studies the routes that made the plague mobile."
black_plague_rat_solve_the_first_crisis: "Solve the First Crisis"
black_plague_rat_solve_the_first_crisis_desc: "The crown survives its first shortage, revolt, and succession dispute."
black_plague_rat_cartography_of_capitals: "Cartography of Capitals"
black_plague_rat_cartography_of_capitals_desc: "Designated capitals are counted rather than merely occupied."
black_plague_rat_map_the_refuge_nodes: "Map the Refuge Nodes"
black_plague_rat_map_the_refuge_nodes_desc: "The route to terminal control requires places that can shelter the brood."
black_plague_rat_terminal_cryptography: "Terminal Cryptography"
black_plague_rat_terminal_cryptography_desc: "A royal cipher turns conquest into measurable continental control."
black_plague_rat_dominion_over_roads: "Dominion over Roads"
black_plague_rat_dominion_over_roads_desc: "Rails and ports become a single royal artery."
black_plague_rat_terminal_armature: "Terminal Armature"
black_plague_rat_terminal_armature_desc: "Advanced units make a final campaign possible without human reserves."
black_plague_rat_terminal_sentience: "Terminal Sentience"
black_plague_rat_terminal_sentience_desc: "The King must understand the world before it can end it."
black_plague_rat_terminal_cohesion: "Terminal Cohesion"
black_plague_rat_terminal_cohesion_desc: "Every brood, court, and refuge agrees on the final route."
black_plague_rat_earned_terminal_route: "The Earned Terminal Route"
black_plague_rat_earned_terminal_route_desc: "Only the completed royal route can make Evolution V visible."
