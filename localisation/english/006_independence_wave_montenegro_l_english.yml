mnt_divided_mountain_authority: "Divided Mountain Authority"
mnt_divided_mountain_authority_desc: "Cetinje and Podgorica offices share an exhausted state while local guards decide which roads remain open."
mnt_mountain_state_compact: "Mountain State Compact"
mnt_mountain_state_compact_desc: "Written compacts bind the passes, depots, and local authorities to a single Montenegrin defense."
mnt_constitutional_assembly_charter: "Assembly Charter of the Mountains"
mnt_constitutional_assembly_charter_desc: "An elected assembly gives the new state a public authority capable of negotiating recognition and supply."
mnt_mountain_workers_council: "Mountain Workers' Council"
mnt_mountain_workers_council_desc: "Miners, carriers, and workshop committees direct scarce production toward the formations holding the high roads."
mnt_crown_and_communes_settlement: "Crown and Communes Settlement"
mnt_crown_and_communes_settlement_desc: "Traditional authority survives through written obligations to communes, garrisons, and the frontier villages."
mnt_national_mountain_command: "National Mountain Command"
mnt_national_mountain_command_desc: "An emergency command concentrates the state's officers and stores on the passes most likely to be tested."

independence_wave_mnt_mountain_compact_category: "Montenegrin Mountain Compact"
independence_wave_mnt_mountain_compact_category_desc: "Mountain Cohesion: §Y[?independence_wave_mnt_mountain_cohesion|0]§! / [?constant:independence_wave_montenegro_pressure.maximum|0]\nCrown Legitimacy: §Y[?independence_wave_mnt_crown_legitimacy|0]§! / [?constant:independence_wave_montenegro_pressure.maximum|0]\nBoth values remain between [?constant:independence_wave_montenegro_pressure.minimum|0] and [?constant:independence_wave_montenegro_pressure.maximum|0]. A stable compact requires both to reach [?constant:independence_wave_montenegro_pressure.stable|0]."
independence_wave_mnt_hold_mountain_compact_together: "Hold the Mountain Compact Together"
independence_wave_mnt_hold_mountain_compact_together_desc: "The new state must keep its offices, guards, and stores aligned until a stable authority can claim the passes."
independence_wave_mnt_reopen_mountain_depots: "Reopen the Mountain Depots"
independence_wave_mnt_reopen_mountain_depots_desc: "Restore the abandoned stores along the approaches to Cetinje and Podgorica. Command attention and a light administrative commitment are required."
independence_wave_mnt_integrate_regional_guards: "Integrate the Regional Guards"
independence_wave_mnt_integrate_regional_guards_desc: "Bring local detachments into the opening force without erasing the valley agreements that keep them supplied."
independence_wave_mnt_reconcile_cetinje_podgorica_offices: "Reconcile the Cetinje and Podgorica Offices"
independence_wave_mnt_reconcile_cetinje_podgorica_offices_desc: "Give the two administrative centers one register for orders, levies, and the movement of food through the mountain roads."
independence_wave_mnt_settle_former_host_ledgers: "Settle the Former Host Ledgers"
independence_wave_mnt_settle_former_host_ledgers_desc: "Bring property, border, population, and recognition claims to a close with the state that released Montenegro. If direct talks become impossible, the mountain compact will settle the accounts locally."
independence_wave_mnt_ratify_constitutional_charter: "Ratify the Constitutional Charter"
independence_wave_mnt_ratify_constitutional_charter_desc: "Make the assembly the public face of the compact and give its delegates authority to bargain for recognition."
independence_wave_mnt_convene_workers_council: "Convene the Mountain Workers' Council"
independence_wave_mnt_convene_workers_council_desc: "Place workshops, carriers, and the depot crews under a council that can meet the army's material demands."
independence_wave_mnt_restore_crown_compact: "Restore the Crown Compact"
independence_wave_mnt_restore_crown_compact_desc: "Renew the crown's claim through explicit obligations to communes and the officers guarding the passes."
independence_wave_mnt_establish_mountain_command: "Establish the Mountain Command"
independence_wave_mnt_establish_mountain_command_desc: "Put the emergency chain of command above local rivalries and prepare the opening force for a hard frontier war."
independence_wave_mnt_codify_durable_sovereignty: "Codify Durable Sovereignty"
independence_wave_mnt_codify_durable_sovereignty_desc: "A stable authority, a recognized border, and a functioning mountain force can turn the liberation into a durable state."
independence_wave_mnt_open_balkan_network_corridor: "Open the Balkan Network Corridor"
independence_wave_mnt_open_balkan_network_corridor_desc: "Use the league's channels to exchange supplies, officers, and recognition with other states that survived the wave."

independence_wave_mnt_project_failure_effect_tt: "Mountain Cohesion changes by [?constant:independence_wave_montenegro_pressure.standard_loss|0] and Crown Legitimacy changes by [?constant:independence_wave_montenegro_pressure.minor_loss|0].\nLegitimacy [?constant:independence_wave_decision_effect.value_standard_loss|0], Recognition [?constant:independence_wave_decision_effect.value_minor_loss|0], State Capacity [?constant:independence_wave_decision_effect.value_standard_loss|0], Security [?constant:independence_wave_decision_effect.value_standard_loss|0], Instability §R+[?constant:independence_wave_decision_effect.value_major|0]§!."
independence_wave_mnt_depots_effect_tt: "Mountain Cohesion §G+[?constant:independence_wave_montenegro_pressure.major_gain|0]§!. Crown Legitimacy §G+[?constant:independence_wave_montenegro_pressure.minor_gain|0]§!, or §G+[?constant:independence_wave_montenegro_pressure.decisive_gain|0]§! while the former-host settlement remains unavailable.\nLegitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability [?constant:independence_wave_value.minor_loss|0]."
independence_wave_mnt_guards_effect_tt: "Mountain Cohesion §G+[?constant:independence_wave_montenegro_pressure.standard_gain|0]§! and Crown Legitimacy §G+[?constant:independence_wave_montenegro_pressure.minor_gain|0]§!.\nLegitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Security §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability [?constant:independence_wave_value.minor_loss|0]."
independence_wave_mnt_offices_effect_tt: "Mountain Cohesion and Crown Legitimacy each gain §G+[?constant:independence_wave_montenegro_pressure.standard_gain|0]§!.\nLegitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability [?constant:independence_wave_value.standard_loss|0]."
independence_wave_mnt_host_ledgers_effect_tt: "Mountain Cohesion §G+[?constant:independence_wave_montenegro_pressure.minor_gain|0]§! and Crown Legitimacy §G+[?constant:independence_wave_montenegro_pressure.standard_gain|0]§!.\nPackage settlement: Host Claim [?constant:independence_wave_decision_effect.bilateral_minor_loss|0], Hostility and Host Obligations [?constant:independence_wave_decision_effect.bilateral_standard_loss|0], Property Claims [?constant:independence_wave_decision_effect.bilateral_major_loss|0], Border Settlement §G+[?constant:independence_wave_decision_effect.bilateral_standard|0]§!, Host Pressure and Reconquest Fear [?constant:independence_wave_decision_effect.bilateral_minor_loss|0].\nShared negotiation changes Host Claim, Hostility, Property Claims, and Reconquest Fear by [?constant:independence_wave_value.standard_loss|0]. It changes Host Obligations, Population Pressure, and Host Pressure by [?constant:independence_wave_value.minor_loss|0], while Border Settlement gains §G+[?constant:independence_wave_value.major_gain|0]§!."
independence_wave_mnt_host_loss_effect_tt: "The former-host ledger closes locally. Mountain Cohesion §G+[?constant:independence_wave_montenegro_pressure.minor_gain|0]§! and Crown Legitimacy §G+[?constant:independence_wave_montenegro_pressure.decisive_gain|0]§!. No bilateral host values change."
independence_wave_mnt_constitutional_route_effect_tt: "The Constitutional Union takes office under Krsto Popović.\nLegitimacy §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, State Capacity §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, Security §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Instability [?constant:independence_wave_decision_effect.value_minor_loss|0]."
independence_wave_mnt_socialist_route_effect_tt: "The Mountain Workers' Council takes office under Blažo Jovanović.\nLegitimacy §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, State Capacity §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, Security §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Instability [?constant:independence_wave_decision_effect.value_minor_loss|0]."
independence_wave_mnt_traditional_route_effect_tt: "The Crown and Communes Settlement takes office under Krsto Popović.\nLegitimacy §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Recognition §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, State Capacity §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Instability [?constant:independence_wave_decision_effect.value_minor_loss|0]."
independence_wave_mnt_emergency_route_effect_tt: "The National Mountain Command takes office under Mitar Martinović.\nLegitimacy §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, State Capacity §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Security §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, Instability [?constant:independence_wave_decision_effect.value_minor_loss|0]."
independence_wave_mnt_sovereignty_effect_tt: "Legitimacy, Recognition, and State Capacity each gain §G+[?constant:independence_wave_decision_effect.value_standard|0]§!. Security gains §G+[?constant:independence_wave_decision_effect.value_minor|0]§! and Instability changes by [?constant:independence_wave_decision_effect.value_standard_loss|0]."
independence_wave_mnt_network_effect_tt: "Corridor opening: Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, Recognition, State Capacity, and Security §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!, and Network Standing §G+[?constant:independence_wave_network.aid_gain|0]§!. League Cohesion, Common Cause, Shared Reserve, and Member Confidence each gain §G+[?constant:independence_wave_value.minor_gain|0]§!.\nProject settlement: Legitimacy, Recognition, and State Capacity §G+[?constant:independence_wave_decision_effect.value_standard|0]§!, Security §G+[?constant:independence_wave_decision_effect.value_minor|0]§!, Instability [?constant:independence_wave_decision_effect.value_standard_loss|0], and Network Standing §G+[?constant:independence_wave_decision_effect.network_standard|0]§!. League Cohesion, Common Cause, Shared Reserve, and Member Confidence each gain §G+[?constant:independence_wave_value.minor_gain|0]§!."

