l_english:
chaosx.nr4.1.t: "Random War"
chaosx.nr4.2.t: "An Ultimatum Leads to War"
chaosx.nr4.2.d: "Our government has followed its ultimatum with a declaration of war. Troops are assembling for the campaign, and the general staff needs orders. Ministers can support the offensive or dismiss the officers responsible for the crisis."
chaosx.nr4.2.a: "Stand by the order."
chaosx.nr4.2.b: "Blame the general staff."
chaosx.nr4.2.b.tt: "This country will not be chosen to start another sudden war for six months."
chaosx.nr4.3.t: "Our Country Is Under Attack"
chaosx.nr4.3.d: "An unexpected declaration has brought war to our country. Commanders need men and supplies to meet the attack. We can organize field defenses or call up more of the reserves, disrupting work and family life across the country."
chaosx.nr4.3.a: "Hold the line."
chaosx.nr4.3.b: "Mobilize the reserves."
chaosx.news.104.t: "[GetRandomWarNewsTitle]"
chaosx.news.104.t.single: "War Between [?global.random_war_news_first_aggressor.GetName] and [?global.random_war_news_first_target.GetName]"
chaosx.news.104.t.chain: "War Spreads to [GetRandomWarNewsCountryCountTitle] Countries"
chaosx.news.104.d: "[GetRandomWarNewsDesc]"
chaosx.news.104.d.single: "[?global.random_war_news_first_aggressor.GetName] has declared war on [?global.random_war_news_first_target.GetName] after a sudden ultimatum. Troops are assembling for the campaign, and neighboring governments fear that the fighting will spread."
chaosx.news.104.d.three: "[?global.random_war_news_first_aggressor.GetName], [?global.random_war_news_first_target.GetName], and [?global.random_war_news_third_country.GetName] are now at war after a chain of declarations. The first declaration sent [?global.random_war_news_first_aggressor.GetName] against [?global.random_war_news_first_target.GetName]. The latest front pits [?global.random_war_news_last_aggressor.GetName] against [?global.random_war_news_last_target.GetName]."
chaosx.news.104.d.chain: "A chain of declarations has pulled [GetRandomWarNewsCountryCount] countries into open war. The first declaration sent [?global.random_war_news_first_aggressor.GetName] against [?global.random_war_news_first_target.GetName]. The latest front pits [?global.random_war_news_last_aggressor.GetName] against [?global.random_war_news_last_target.GetName]."
chaosx.news.104.a: "Another front opens."
