l_english:
chaosx.nr4.1.t: "Random War"
chaosx.nr4.2.t: "An Ultimatum Leads to War"
chaosx.nr4.2.d: "Our ultimatum went unanswered, and the declaration of war has gone out. Regiments are moving toward the frontier while the general staff waits for the cabinet's orders. The government can stand by the campaign or dismiss the officers who pressed it into this war."
chaosx.nr4.2.a: "Stand by the order."
chaosx.nr4.2.b: "Blame the general staff."
chaosx.nr4.2.b.tt: "This country will not be chosen to start another sudden war for six months."
chaosx.nr4.3.t: "Our Country Is Under Attack"
chaosx.nr4.3.d: "A declaration of war we did not expect has put our frontier under attack. Commanders are asking for men and supplies to meet the first assault. The government can dig in along the border with the army it has, or call up the reserves and take workers out of the factories and fields."
chaosx.nr4.3.a: "Hold the line."
chaosx.nr4.3.b: "Mobilize the reserves."
chaosx.news.104.t: "[GetRandomWarNewsTitle]"
chaosx.news.104.t.single: "War Between [?global.random_war_news_first_aggressor.GetName] and [?global.random_war_news_first_target.GetName]"
chaosx.news.104.t.chain: "War Spreads to [GetRandomWarNewsCountryCountTitle] Countries"
chaosx.news.104.d: "[GetRandomWarNewsDesc]"
chaosx.news.104.d.single: "[?global.random_war_news_first_aggressor.GetName] has declared war on [?global.random_war_news_first_target.GetName] after a sudden ultimatum. Troops are assembling for the campaign, and neighboring governments fear that the fighting will spread."
chaosx.news.104.d.three: "A chain of declarations has dragged [?global.random_war_news_first_aggressor.GetName], [?global.random_war_news_first_target.GetName] and [?global.random_war_news_third_country.GetName] into war. It began when [?global.random_war_news_first_aggressor.GetName] turned on [?global.random_war_news_first_target.GetName], and the latest front sets [?global.random_war_news_last_aggressor.GetName] against [?global.random_war_news_last_target.GetName]."
chaosx.news.104.d.chain: "A chain of declarations has pulled [GetRandomWarNewsCountryCount] countries into open war. It began when [?global.random_war_news_first_aggressor.GetName] turned on [?global.random_war_news_first_target.GetName], and the latest front sets [?global.random_war_news_last_aggressor.GetName] against [?global.random_war_news_last_target.GetName]."
chaosx.news.104.a: "Another front opens."
