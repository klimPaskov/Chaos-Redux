random_war_hold_the_line: "Hold the Line"
random_war_hold_the_line_desc: "The government has put supplies and transport at the army's disposal. Field units are digging defensive positions and restoring their strength close to home."
random_war_reserve_mobilization: "Reserve Mobilization"
random_war_reserve_mobilization_desc: "Reservists are leaving their jobs for military service. Training depots are shortening courses and preparing men for the front."
chaosx.nr4.4.t: "No Declaration of War"
chaosx.nr4.4.d: "No government is ready to start a new war. Alliances, wars already under way, recent incidents and the limits on declaring war keep every possible pair of rivals apart for now."
chaosx.nr4.4.a: "The peace holds."
