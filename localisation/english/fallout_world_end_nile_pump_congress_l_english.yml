l_english:
  chaosx.fallout.579.t: "The Nile Pump Congress"
  chaosx.fallout.579.desc: "The river has not forgiven the old borders. In a low schoolhouse beside the surviving intake, district engineers, field officers, and village delegates argue over one pump board. The southern farms can receive clean water when the board decides who controls the valves before the next ash front arrives."
  chaosx.fallout.579.a: "Give the public board the valves"
  chaosx.fallout.579.a.tt: "Spend food, scrap, recognition, and clean water. The board favors shared access and a stronger civic compact."
  chaosx.fallout.579.b: "Put the upstream command in uniform"
  chaosx.fallout.579.b.tt: "Spend fuel, Power, and Command Power. The command protects flow under military discipline while straining cohesion."
  chaosx.fallout.579.c: "Let the river cooperatives bargain"
  chaosx.fallout.579.c.tt: "Spend medicine, food, recognition, and clean water. The cooperatives reduce disease pressure and accept slower military response."
  chaosx.fallout.579.d: "Hold the emergency reserve"
  chaosx.fallout.579.d.tt: "Spend Power, medicine, and clean water. The reserve keeps a narrow flow alive while risking infrastructure and lives."
  chaosx.fallout.581.t: "The Pump Board Reports"
  chaosx.fallout.581.invalid.d: "The intake changed hands before the board could report. The old schedule is void, and the remaining crews are already moving the valve records to safer ground."
  chaosx.fallout.581.public.success.d: "The public board put a river compact on paper and made every district sign it. The intake crews now know whose homes must be served before the next cold rain."
  chaosx.fallout.581.public.partial.d: "The public board opened the gates while two districts kept private ledgers. Water moves again as the first compact comes under dispute."
  chaosx.fallout.581.public.failure.d: "The public board dissolved before the first full rotation. A basin war now surrounds the pumps, and families carry empty jars past the locked intake."
  chaosx.fallout.581.command.success.d: "The upstream command secured the valves and protected the most exposed line. Its sentries kept the flow moving through the ash-dark nights despite the strain on cohesion."
  chaosx.fallout.581.command.partial.d: "The upstream command held the main valve while the southern branch ran dry twice. The river is moving, and every village remembers the interruption."
  chaosx.fallout.581.command.failure.d: "The command seized the intake and lost the river crew. A basin war now surrounds a damaged pump that feeds only a guarded compound while the surrounding fields go without."
  chaosx.fallout.581.cooperative.success.d: "The river cooperatives traded medicine for clean-water access and set a river compact that even rival villages accepted. The first tally is higher than the officers expected."
  chaosx.fallout.581.cooperative.partial.d: "The cooperatives kept the intake open while the medicine stores grew nearly bare. Disease is easing as the river agreement remains fragile."
  chaosx.fallout.581.cooperative.failure.d: "The cooperatives could not agree on a tally. The intake stayed open long enough to spread a basin war, then failed under a preventable sickness."
  chaosx.fallout.581.hold.success.d: "The reserve crew held a narrow emergency flow through the worst ash fall. The southern wards have water for another season while the intake remains under emergency guard."
  chaosx.fallout.581.hold.partial.d: "The reserve kept the pump alive at a reduced pressure. The intake survived, while its housing now carries the strain of another campaign."
  chaosx.fallout.581.hold.failure.d: "The emergency hold consumed the last safe stores and cracked the intake housing. A basin war follows the river below the station while the pump no longer reaches it."
  chaosx.fallout.581.a: "Record the first water tally"
  chaosx.fallout.581.a.tt: "Confirm the pump board’s first result and begin its seasonal review."
  chaosx.fallout.583.t: "The First Seasonal Review"
  chaosx.fallout.583.invalid.d: "The intake changed hands before the seasonal review. The river agreement has been closed, and the surviving crews are carrying the records away from the station."
  chaosx.fallout.583.success.d: "The first seasonal review found a working schedule, a protected intake, and fewer graves along the southern road. The pump board has become a public fact."
  chaosx.fallout.583.partial.d: "The first seasonal review found water on the map and arguments at the valves. The agreement survives while every district can see the next delivery."
  chaosx.fallout.583.failure.d: "The first seasonal review found the intake below its promised flow. The river agreement is closing, and the next repair crew will have to start from the broken housing."
  chaosx.fallout.583.a: "Close the seasonal review"
  chaosx.fallout.583.a.tt: "Close the seasonal review and return the intake to ordinary service."
  fallout.event_log.nile_pump_congress.name: "The Nile Pump Congress"
  fallout.event_log.nile_pump_congress.detail: "[GetFalloutEvent579EventLogDetail]"
  fallout.event_log.nile_pump_congress.detail.choice_public: "The country gave the intake to a public pump board."
  fallout.event_log.nile_pump_congress.detail.choice_command: "The country placed the intake under an upstream command."
  fallout.event_log.nile_pump_congress.detail.choice_cooperative: "The country let river cooperatives bargain over the flow."
  fallout.event_log.nile_pump_congress.detail.choice_hold: "The country held an emergency reserve at the intake."
  fallout.event_log.nile_pump_congress.detail.public_success: "The public pump board secured a river compact."
  fallout.event_log.nile_pump_congress.detail.public_partial: "The public pump board opened a contested river compact."
  fallout.event_log.nile_pump_congress.detail.public_failure: "The public pump board failed before the first rotation and opened a basin war."
  fallout.event_log.nile_pump_congress.detail.command_success: "The upstream command protected the flow and secured the exposed line."
  fallout.event_log.nile_pump_congress.detail.command_partial: "The upstream command held the main valve while a branch ran dry."
  fallout.event_log.nile_pump_congress.detail.command_failure: "The upstream command lost the river crew and opened a basin war around the intake."
  fallout.event_log.nile_pump_congress.detail.cooperative_success: "The river cooperatives reduced sickness and agreed a durable river compact."
  fallout.event_log.nile_pump_congress.detail.cooperative_partial: "The river cooperatives kept the intake open at a medicine cost."
  fallout.event_log.nile_pump_congress.detail.cooperative_failure: "The river cooperatives failed to keep a shared tally and opened a basin war."
  fallout.event_log.nile_pump_congress.detail.hold_success: "The emergency reserve kept a narrow flow alive through the ash fall."
  fallout.event_log.nile_pump_congress.detail.hold_partial: "The emergency reserve survived at reduced pressure."
  fallout.event_log.nile_pump_congress.detail.hold_failure: "The emergency reserve cracked the intake housing and opened a basin war."
  fallout.event_log.nile_pump_congress.detail.callback_success: "The first seasonal review established a public pump memory."
  fallout.event_log.nile_pump_congress.detail.callback_partial: "The first seasonal review preserved a fragile pump agreement."
  fallout.event_log.nile_pump_congress.detail.callback_failure: "The first seasonal review closed the broken intake agreement."
  fallout.event_log.nile_pump_congress.detail.cancelled: "The Nile Pump Congress record could not be confirmed after the intake changed."
