chaosx.events_log.world_end.black_plague.title: "The Kingdom of Teeth"
chaosx.events_log.world_end.black_plague.details: "The Rat King rules from the Royal Basin, where the plague's surviving broods gather under one crown. Fallen capitals and overrun refuges feed a kingdom that carries its warrens, human servants, and royal hunger across the world."
chaosx.events_log.world_end.zombie_apocalypse.title: "Zombie Apocalypse"
chaosx.events_log.world_end.zombie_apocalypse.details: "The outbreak has outgrown every line built to contain it. The dead move from ruined cities into the last organized refuges, while the living lose the roads, laboratories, and armies needed to answer them.\n\nThe Zombie Horde becomes the dominant power of the world, and the survivors hold on in scattered refuges."
chaosx.events_log.world_end.world_in_fury.title: "The World in Fury"
chaosx.events_log.world_end.world_in_fury.details: "Fury has reached countries across the world. Armies gather at their frontiers, and refugees flee successive invasions as the fighting spreads."
chaosx.events_log.world_end.last_shores.title: "Last Shores"
chaosx.events_log.world_end.last_shores.details: "Death has begun its Last Shores campaign. The living countries that remain must hold distant fronts across empty cities and ruined supply roads."
chaosx.events_log.world_end.world_is_the_larder.title: "The World Is the Larder"
chaosx.events_log.world_end.world_is_the_larder.details: "The unified Host has pulled the feeding territories and armed kitchens into one command. Roads, farms, prisons, and conquered cities are all treated as parts of the same larder. Surviving countries are reduced to prey, raiders, or small resistance enclaves.\n\nThe network has no reason to hide anymore. Every government still standing faces an expanding Host that intends to feed on the whole world."
chaosx.events_log.world_end.no_thaw_will_come.title: "No Thaw Will Come"
chaosx.events_log.world_end.no_thaw_will_come.details: "The Winter Host has given itself to the Wendigo hunger. Feeding grounds spread with the cold, and conquered communities are dragged into a world where thaw, harvest, and mercy are treated as weaknesses.\n\nWinter advances with the Host. Every surviving country is hunted until human rule is consumed or driven into a handful of frozen refuges."
chaosx.events_log.world_end.world_opens_below.title: "The World Opens Below"
chaosx.events_log.world_end.world_opens_below.details: "The Oth-Kesh have secured their first continent and opened new chambers beyond the sea. The tunnels below become roads for armored broods, and fresh fronts tear open beneath the richest ground.\n\nEvery surviving continent now has its own entrance to the World Below. The surface is caught in one global war against the depths."
chaosx.events_log.world_end.laboratory_world.title: "Laboratory World"
chaosx.events_log.world_end.laboratory_world.details: "Kruger's Directorate has swallowed the governments that once tried to supervise it. Countries, populations, and whole landscapes survive as controlled samples inside a planetary laboratory.\n\nThe world has become one experiment, and Kruger alone decides what happens to the control group."
chaosx.events_log.world_end.strategic_singularity.title: "The Strategic Singularity"
chaosx.events_log.world_end.strategic_singularity.details: "The Directorate's final device tears through armies, cities, and the air itself. The blast leaves mass death, poisoned ground, and governments too broken to hold the old world together.\n\nThe Singularity ends Kruger's experiment and leaves the survivors in a world of fallout."
chaosx.events_log.world_end.final_silence.title: "Final Silence"
chaosx.events_log.world_end.final_silence.details: "The Holy Realm's final rite ends in a nuclear catastrophe. Fallout follows the strike, destroying governments and leaving survivors to seek shelter."
chaosx.events_log.world_end.africa_the_world.title: "The World Is One"
chaosx.events_log.world_end.africa_the_world.details: "The African Union has absorbed or defeated every rival government. It proclaims The World, binds the surviving territories to one constitutional order, and ends the age of separate states."
chaosx.events_log.world_end.global_jihad.title: "The False Revelation"
chaosx.events_log.world_end.global_jihad.details: "An extremist authority has turned a transnational terror network into a territorial war machine and claims that its final command came from beyond the human world. No one verifies the claim, and governments, Muslim communities, clerics, soldiers, and rival authorities keep up an organized resistance."
chaosx.events_log.world_end.weaponized_wendigo_ascendancy.title: "Wendigo Ascendancy"
chaosx.events_log.world_end.weaponized_wendigo_ascendancy.details: "The engineered Wendigo outbreak has crossed every remaining continental threshold. Packs take the last organized territories and open a world ruled by predation and permanent winter."
chaosx.events_log.catalog.evolution.1.stage_1.details: "Communist cells turn local unrest into sudden revolts. Strikes, clandestine committees, and armed breakaways make every communist-held district a possible center of insurrection."
chaosx.events_log.catalog.evolution.1.stage_2.details: "Worker circles gather after dark in mills, mines, and depots, binding revolutionary discipline to secret rites. Fear spreads through industrial districts as the movement gains new converts."
chaosx.events_log.catalog.evolution.1.stage_3.details: "Lockdown zones speak of one world revolution and treat distant uprisings as parts of the same struggle. Their whispers prepare new strongholds for a conflict that no border can contain."
chaosx.events_log.catalog.evolution.2.stage_1.details: "The first major adaptation lets the horde endure hunger and darkness. Early containment lines begin to fail as the dead keep moving through nights that once slowed them."
chaosx.events_log.catalog.evolution.2.stage_2.details: "A faster strain drives the horde into sustained assaults. Starved packs cross broken supply lines without losing their pace, and laboratories struggle to keep the cure abreast of the mutation."
chaosx.events_log.catalog.evolution.2.stage_3.details: "The final mutation makes the horde exceptionally difficult to exhaust or cure. Weak fronts can collapse under attacks that continue through darkness, isolation, and ruined supply routes."
chaosx.events_log.catalog.evolution.11.stage_1.details: "The same routes, tricks, and timings appear far beyond the first incidents. Leaks and defections expose fragments of a hidden partnership whose full membership remains unknown."
chaosx.events_log.catalog.evolution.11.stage_2.details: "Covert attacks across several countries now follow one plan. Governments hunt for the alliance behind the campaign as agents sabotage defenses and deepen suspicion between possible partners."
chaosx.events_log.catalog.evolution.11.stage_3.details: "Border pressure and military preparations bring the hidden alliance close to open confrontation. Its members maneuver for the first blow while exposed countries prepare for a war whose sides are still unclear."
chaosx.events_log.window.event_details.communism_spread: "Communist organizers turn propaganda networks and local agitation into control of vulnerable states. Strikes give way to committees, committees begin to give orders of their own, and the longer a government waits the closer its country comes to open revolution.\n\nGovernments can answer with local crackdowns or a national emergency operation, and either can go wrong."
chaosx.events_log.window.event_details.zombie_outbreak: "A zombie outbreak erupts in a populous state and grows by consuming the people and territory in its path. Crowded, underdeveloped regions face the greatest risk of secondary outbreaks, while each evolution makes the horde harder to contain.\n\nCountries can fortify the front, reduce outbreak risk, pursue a cure, and coordinate through the Anti-Zombie League. If the horde gains momentum, it can spread faster than isolated governments can respond."
chaosx.events_log.window.event_details.random_war: "Random War turns border orders, panicked ultimatums and opportunistic claims into sudden declarations between sovereign countries.\n\nAs the world grows more unstable, a single incident can pull in neighbors, great powers and stranger states, until a quarrel between two countries has become a chain of wars."
chaosx.events_log.window.event_details.soviet_collapse: "The Soviet Union is losing command over its republics and the forces that connect them. Local ministries, garrisons, rail offices, and depots answer to competing authorities as Moscow struggles to keep its orders in force. Across the republics, officials and soldiers must decide whom to follow."
chaosx.events_log.window.event_details.fury: "An unnatural rage spreads through a minor country's army. Reservists crowd its barracks and armed columns gather at the frontier, preparing to attack neighboring countries."
chaosx.events_log.window.event_details.white_peace: "Exhausted belligerents agree to an armistice without conquest or indemnity. Their armies withdraw to the borders held before the war, and neither government claims victory."
chaosx.events_log.window.event_details.death.pre_reveal: "Death first appears through missing island traffic. Mail boats fail to return, radio rooms stop answering, and port offices cannot confirm any arrivals from the affected island.\n\nAt this stage there is no public enemy. A country that receives the report can ignore it, restrict sea traffic, preserve the records, or send a survey boat while the problem is still small."
chaosx.events_log.window.event_details.death: "The islands fall silent, and governments search the coast for an answer. A cold presence gathers beyond the sea, where ships, letters, and radio calls no longer return."
chaosx.events_log.window.event_details.utopia_manifesto: "A translated manifesto slips out of reading rooms and into the government of a small country. It promises that common stores, useful work, and public need can build a fairer society. Its readers quickly split over who gets to decide what people need and how much freedom the plan can afford.\n\nShortages, public works, local charters, and deals with neighboring states put every promise to the test. The commonwealth must prove that it can care for people without turning necessity into an excuse for control or conquest."
chaosx.events_log.window.evolution_details.fury.title.stage_1: "Hardened Fury"
chaosx.events_log.window.evolution_details.fury.title.stage_2: "Two Fires"
chaosx.events_log.window.evolution_details.fury.title.stage_3: "All Borders at Once"
chaosx.events_log.window.evolution_details.fury.body.event_detail: "Reservists gather under commanders who drive their men toward the next frontier. Conquest feeds the rage spreading through the army."
chaosx.events_log.window.evolution_details.fury.body.stage_1: "Columns regroup at captured depots, refill their ranks, and march toward the next frontier. Neighboring governments prepare for a prolonged war."
chaosx.events_log.window.evolution_details.fury.body.stage_2: "Reports of Fury arrive from different frontiers. Officers and soldiers repeat the same sleepless preparations under separate flags."
chaosx.events_log.window.evolution_details.fury.body.stage_3: "Armies seized by Fury fight for roads and towns across a widening front. Civilians search for a way past the advancing columns."
chaosx.events_log.window.evolution_details.white_peace.title.stage_1: "Repeated Minor Settlements"
chaosx.events_log.window.evolution_details.white_peace.title.stage_2: "Major-Country Settlement"
chaosx.events_log.window.evolution_details.white_peace.title.stage_3: "Broad Diplomatic Settlement"
chaosx.events_log.window.evolution_details.white_peace.body.event_detail: "Negotiations bring exhausted armies back to their own territory. Other governments watch the ceasefire for signs that peace can hold."
chaosx.events_log.window.evolution_details.white_peace.body.stage_1: "Armies withdraw to the old frontier as minor governments accept an armistice. Soldiers return to their own towns without a victory parade."
chaosx.events_log.window.evolution_details.white_peace.body.stage_2: "A major power agrees to stop fighting without gaining land or tribute. Its soldiers withdraw across the old frontier."
chaosx.events_log.window.evolution_details.white_peace.body.stage_3: "Separate armies receive orders to stop fighting and return to their own territory. The armistices leave neither side with conquered land or tribute."
chaosx.events_log.evolution.type.death: "Death"
chaosx.events_log.window.evolution_details.death.title.stage_2: "Second Shore"
chaosx.events_log.window.evolution_details.death.title.stage_3: "Mainland Reach"
chaosx.events_log.window.evolution_details.death.title.stage_4: "First Ghost Hosts"
chaosx.events_log.window.evolution_details.death.title.stage_5: "Hollow Ghost Hosts"
chaosx.events_log.window.evolution_details.death.title.stage_6: "Last Shores"
chaosx.events_log.window.evolution_details.death.body.event_detail: "An unexplained silence spreads from remote islands toward inhabited shores. Governments search for a cause as a cold presence gathers beyond the sea."
chaosx.events_log.window.evolution_details.death.body.stage_2: "Ships stop arriving from a second island. Nobody yet knows it is lost, but its neighbors have noticed the silence."
chaosx.events_log.window.evolution_details.death.body.stage_3: "The Black Ledger reaches the mainland. Coastal settlements empty, survivors name the force consuming them, and the first organized war against Death begins."
chaosx.events_log.window.evolution_details.death.body.stage_4: "Weak ghost hosts rise from emptied land and gather along its borders. They defend the wasteland in broken ranks while Death prepares a larger army from those it has counted."
chaosx.events_log.window.evolution_details.death.body.stage_5: "The hollow hosts return in greater numbers and hold their ranks longer. They remain imperfect soldiers, yet every fallen district gives Death more ground from which to raise them."
chaosx.events_log.window.evolution_details.death.body.stage_6: "An emptied continent becomes Death's muster ground. Ghost hosts cross the last shores in force and attack the living wherever the Black Ledger remains unfinished."
chaosx.events_log.window.event_details.soviet_collapse.crisis.terminal: "central command has failed as a Union-wide authority."
chaosx.events_log.window.event_details.soviet_collapse.crisis.active: "orders still move from Moscow, and republic ministries, rail offices, and garrisons are testing which commands will be obeyed."
chaosx.events_log.window.event_details.soviet_collapse.crisis.dormant: "the crisis is not currently active on the map."
chaosx.events_log.window.event_details.soviet_collapse.first_wave.active: "the first emergency declarations are still shaping the crisis."
chaosx.events_log.window.event_details.soviet_collapse.first_wave.ended: "the opening rupture has been overtaken by the full collapse."
chaosx.events_log.window.event_details.soviet_collapse.first_wave.settled: "the opening shock has passed into the wider struggle over authority."
chaosx.events_log.window.event_details.soviet_collapse.first_wave.none: "no active first wave is visible."
chaosx.events_log.window.event_details.soviet_collapse.league.exists: "organized breakaway coordination exists."
chaosx.events_log.window.event_details.soviet_collapse.league.absent: "breakaway cooperation has not become a formal league."
chaosx.events_log.window.event_details.soviet_collapse.authority.terminal: "Moscow can no longer speak for the Union."
chaosx.events_log.window.event_details.soviet_collapse.authority.failing: "authority is failing and local offices are preparing their own answers."
chaosx.events_log.window.event_details.soviet_collapse.authority.shaken: "authority is shaken, and the center still has instruments to answer the crisis."
chaosx.events_log.window.event_details.soviet_collapse.authority.contested: "authority is contested and depends on visible successes."
chaosx.events_log.window.event_details.soviet_collapse.authority.recovering: "authority is recovering enough for Moscow to pressure the edges again."
chaosx.events_log.window.event_details.soviet_collapse.threat.terminal: "the crisis has crossed into irreversible rupture."
chaosx.events_log.window.event_details.soviet_collapse.threat.severe: "the crisis is severe and broad failure is credible."
chaosx.events_log.window.event_details.soviet_collapse.threat.rising: "the crisis is rising through visible failures and widening refusal."
chaosx.events_log.window.event_details.soviet_collapse.threat.contained: "the crisis is still contained enough for outcomes to change."
chaosx.events_log.window.event_details.soviet_collapse.foreign.dominant: "outside patrons are shaping the crisis as much as local ministries."
chaosx.events_log.window.event_details.soviet_collapse.foreign.organized: "foreign channels are organized and increasingly hard to ignore."
chaosx.events_log.window.event_details.soviet_collapse.foreign.limited: "foreign observers and aid channels are present, with little influence so far."
chaosx.events_log.window.event_details.soviet_collapse.foreign.watchful: "foreign governments are watching for leverage."
chaosx.events_log.window.event_details.soviet_collapse.mutation.high: "high-chaos authorities and old claims are pressing beyond ordinary republican politics."
chaosx.events_log.window.event_details.soviet_collapse.mutation.visible: "old movements, strange symbols, and irregular authorities are becoming visible."
chaosx.events_log.window.event_details.soviet_collapse.mutation.quiet: "ordinary republic politics still dominate the visible crisis."
