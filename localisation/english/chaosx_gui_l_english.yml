chaosx.scenarios.black_plague.name: "Black Plague Unbound"
chaosx.scenarios.black_plague.desc: "A contagious Black Plague erupts across multiple continents. A Rat Nation rises among the infected while the Rat King gathers a separate royal basin. The outbreak advances through an escalating chain of plague evolutions."
chaosx.scenarios.black_plague.impact.low: "§RSeeds three continents with a limited Black Plague crisis.§! Establishes 12 to 18 plague states, the Rat Nation, a separate royal basin, and Evolutions I through IV."
chaosx.scenarios.black_plague.impact.medium: "§RSeeds four continents with a regional Black Plague crisis.§! Establishes 24 to 36 plague states, the Rat Nation, a separate royal basin, and Evolutions I through IV."
chaosx.scenarios.black_plague.impact.high: "§RSeeds five eligible continents, or all when fewer exist.§! Establishes 45 to 65 plague states, the Rat Nation, a separate royal basin, and Evolutions I through IV."
chaosx.scenarios.black_plague.impact.maximum: "§RSeeds every eligible inhabited continent with a Black Plague crisis.§! Establishes 75 to 110 plague states, the Rat Nation, a separate royal basin, and Evolutions I through IV."
chaosx.scenarios.zombie.name: "Zombie Apocalypse"
chaosx.scenarios.zombie.desc.diverse: "Launches several outbreaks with mixed zombie profiles. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.random: "Launches several outbreaks that each roll a profile independently. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.standard: "Launches standard outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.rabid: "Launches fast, aggressive outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.parasitic: "Launches parasitic outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.mutant: "Launches mutant outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.undead: "Launches undead outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.necrotic: "Launches necrotic outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.demonic: "Launches demonic outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.wendigo: "Launches wendigo outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.connected: "Launches one connected outbreak front with concentrated starting forces. Intensity controls the number of linked states, divisions, and early pressure."
chaosx.scenarios.zombie.impact.low: "§RLaunches hostile outbreaks immediately.§! Low intensity keeps the initial footprint limited."
chaosx.scenarios.zombie.impact.medium: "§RLaunches hostile outbreaks immediately.§! Medium intensity creates a broad crisis with room for containment."
chaosx.scenarios.zombie.impact.high: "§RLaunches hostile outbreaks immediately.§! High intensity starts with more regions, troops, and pressure."
chaosx.scenarios.zombie.impact.maximum: "§RLaunches hostile outbreaks immediately.§! Maximum intensity opens with severe global pressure."
chaosx.scenarios.clones.name: "Army of Clones"
chaosx.scenarios.clones.desc.standard: "Creates a hostile artificial army across Poland, parts of Germany, and the western Soviet borderlands. Intensity controls territory, equipment, divisions, and pressure on neighbors."
chaosx.scenarios.clones.desc.aryan: "Creates a stronger hostile variant with better equipment, extra formations, and more aggressive pressure on neighboring countries."
chaosx.scenarios.clones.impact.low: "§RTransfers territory and starts wars immediately.§! Low intensity keeps the starting front narrower."
chaosx.scenarios.clones.impact.medium: "§RTransfers territory and starts wars immediately.§! Medium intensity creates a hard regional front."
chaosx.scenarios.clones.impact.high: "§RTransfers territory and starts wars immediately.§! High intensity expands the front and army stockpiles."
chaosx.scenarios.clones.impact.maximum: "§RTransfers territory and starts wars immediately.§! Maximum intensity creates the largest starting army and front."
chaosx.scenarios.soviet_collapse.name: "Soviet Collapse"
chaosx.scenarios.soviet_collapse.desc.normal: "Fires the Union Unmade collapse immediately, releases every available ordinary Soviet republic, forms local defensive leagues, and starts the anti-Soviet wars. Intensity controls the extra starting forces granted to each breakaway."
chaosx.scenarios.soviet_collapse.desc.chaos: "Fires the Union Unmade collapse immediately, releases ordinary republics, enables the high-chaos splinters that can exist, forms local factions, and starts the anti-Soviet wars. Intensity controls the extra starting forces granted to each breakaway."
chaosx.scenarios.soviet_collapse.impact.low: "§RBreaks the Soviet Union immediately.§! Low intensity adds only a limited emergency army to each republic."
chaosx.scenarios.soviet_collapse.impact.medium: "§RBreaks the Soviet Union immediately.§! Medium intensity gives the republics enough force to hold a broad opening front."
chaosx.scenarios.soviet_collapse.impact.high: "§RBreaks the Soviet Union immediately.§! High intensity gives stronger republics a large starting army."
chaosx.scenarios.soviet_collapse.impact.maximum: "§RBreaks the Soviet Union immediately.§! Maximum intensity gives the strongest republics a very large starting army."
chaosx.scenarios.fallout.name: "Fallout"
chaosx.scenarios.fallout.desc: "Strikes every valid province with the exact thermonuclear sweep, waits seven days after the verified batch, then opens the Fallout blackout. The Deaths system receives the population loss, every surviving tag regresses, wars end, and a new fractured map is assigned."
chaosx.scenarios.fallout.impact: "§RStarts the Fallout sweep immediately.§! Every valid province receives one thermonuclear strike. The verified batch waits seven days before the blackout and permanent ninety-nine percent contamination lock."


chaosx.scenarios.fury.name: "The World in Fury"
chaosx.scenarios.fury.desc.pact: "Turns eligible non-player minor countries into dispersed Fury actors and organizes them into the Fury Pact. Higher intensity spreads more Fury states across the world and grants stronger evolved openings."
chaosx.scenarios.fury.desc.hostile: "Turns eligible non-player minor countries into dispersed hostile Fury actors that immediately pursue neighboring wars. Higher intensity spreads more Fury states across the world and escalates their opening pressure."
chaosx.scenarios.type.fury.pact: "Fury Pact"
chaosx.scenarios.type.fury.hostile: "Hostile Fury"
chaosx.scenarios.fury.impact.low: "§RCreates two dispersed Fury actors immediately.§! The player and player-linked countries are excluded."
chaosx.scenarios.fury.impact.medium: "§RCreates five dispersed Fury actors immediately.§! The player and player-linked countries are excluded."
chaosx.scenarios.fury.impact.high: "§RCreates nine dispersed Fury actors immediately.§! The player and player-linked countries are excluded."
chaosx.scenarios.fury.impact.maximum: "§RCreates up to sixteen dispersed Fury actors when enough safe candidates exist.§! The player and player-linked countries are excluded."
chaosx.scenarios.death.name: "Death"
chaosx.scenarios.death.desc.instant_outbreak: "Starts Death as an immediate outbreak. One remote island and one mainland state are consumed at once, and intensity adds more starting territory and ghost hosts. Later spread grows normally from that opening."
chaosx.scenarios.type.death.instant_outbreak: "Instant Outbreak"
chaosx.scenarios.death.impact.low: "Low intensity consumes one island and one mainland state, then spawns one weak ghost host."
chaosx.scenarios.death.impact.medium: "Medium intensity adds two extra islands and spawns two weak ghost hosts."
chaosx.scenarios.death.impact.high: "High intensity adds four extra islands, one extra mainland state, and two stronger ghost hosts."
chaosx.scenarios.death.impact.maximum: "Maximum intensity adds six extra islands, two extra mainland states, and four stronger ghost hosts."
chaosx.scenarios.disaster_barrage.name: "Disaster Barrage"
chaosx.scenarios.disaster_barrage.desc.random: "Starts a varied disaster season in the selected country. The catalogue follows the chosen intensity, and each impact uses normal warnings, reports, recovery work, and follow-up risks."
chaosx.scenarios.disaster_barrage.desc.geological: "Starts a geological crisis built from earthquakes, landslides, eruptions, lahars, tsunamis, and skyfall impacts that fit the chosen intensity."
chaosx.scenarios.disaster_barrage.desc.weather: "Starts a weather crisis built from floods, storms, wind, tornadoes, hail, wildfire, drought, heat, cold, blizzards, and dust."
chaosx.scenarios.disaster_barrage.desc.skyfall: "Starts a skyfall crisis built from meteor impacts, meteor showers, fire-bearing hail, ocean impacts, and the ash or tsunami chains they can produce."
chaosx.scenarios.disaster_barrage.desc.full_catalogue: "Starts a broad disaster season with few family restrictions. Global news is reserved for the largest impacts so the reports remain readable."
chaosx.scenarios.disaster_barrage.impact.low: "Low intensity starts a varied local season with ordinary warnings, affected-country reports, and recovery work."
chaosx.scenarios.disaster_barrage.impact.medium: "Medium intensity increases the sequence and opens regional damage with heavier recovery pressure."
chaosx.scenarios.disaster_barrage.impact.high: "High intensity creates severe chained disasters with catastrophic impacts and emergency aftermath work."
chaosx.scenarios.disaster_barrage.impact.maximum: "Maximum intensity can unleash rupture waves, meteor showers, massive eruptions, delayed tsunami chains, and moving storm corridors. Countries survive into the rescue and reconstruction struggle that follows."
chaosx.scenarios.type.disaster_barrage.random: "Random Barrage"
chaosx.scenarios.type.disaster_barrage.geological: "Geological Crisis"
chaosx.scenarios.type.disaster_barrage.weather: "Weather Crisis"
chaosx.scenarios.type.disaster_barrage.skyfall: "Skyfall Crisis"
chaosx.scenarios.type.disaster_barrage.full_catalogue: "Full Catalogue"
chaosx.scenarios.africa.name: "Africa Is One"
chaosx.scenarios.africa.desc.placeholder: "No playable incident is assigned to this scenario."
chaosx.scenarios.type.black_plague.instant_plague_kingdoms: "Instant Plague Kingdoms"
chaosx.scenarios.infantry_spawn.name: "The Unbidden Muster"
chaosx.scenarios.infantry_spawn.desc.conventional_flood: "Unbidden ordinary formations and organized arsenal lots appear in great numbers. Their mutinies divide command staffs, open immediate conventional wars, and crowd supply routes without calling any anomalous host."
chaosx.scenarios.infantry_spawn.desc.arsenal_lottery: "Rebel formations draw uneven packages of armor, motor transport, amphibious equipment, and other specialist materiel. Some fronts gain powerful machines without support, while others inherit narrow military curiosities."
chaosx.scenarios.infantry_spawn.desc.general_mutiny: "Randomly composed formations rally behind claimant commanders. Every affected country faces an immediate personalized revolt or military takeover attempt."
chaosx.scenarios.infantry_spawn.desc.anomalous_rising: "Nonhuman formations rise under new regional commands and begin their wars immediately. Zombie, ghost, and golem hosts establish armed breakaways wherever their ranks gather."
chaosx.scenarios.type.infantry_spawn.conventional_flood: "The Barracks Overflow"
chaosx.scenarios.type.infantry_spawn.arsenal_lottery: "The Arsenal Draw"
chaosx.scenarios.type.infantry_spawn.general_mutiny: "The Generals' Muster"
chaosx.scenarios.type.infantry_spawn.anomalous_rising: "The Impossible Host"
chaosx.scenarios.infantry_spawn.impact.low: "§RStarts immediate revolts and regional wars.§! Low intensity affects a smaller share of countries able to sustain an open front and establishes one principal front in each selected command area."
chaosx.scenarios.infantry_spawn.impact.medium: "§RStarts immediate revolts and regional wars.§! Medium intensity spreads several formation lots across broad command areas and establishes full-strength local fronts."
chaosx.scenarios.infantry_spawn.impact.high: "§RStarts immediate revolts and regional wars.§! High intensity affects many countries at once, establishes larger formation pools, and can open several rival fronts."
chaosx.scenarios.infantry_spawn.impact.maximum: "§RStarts a near-global wave of immediate revolts and regional wars.§! Maximum intensity reaches every country able to sustain an open front and establishes the largest sustainable formation packages and front count."
chaosx.scenarios.type.placeholder: "Unavailable"
chaosx.scenarios.placeholder.impact: "§YNo playable outcome is assigned to this scenario.§! Launching it opens a neutral event."
