chaosx.events_log.world_end.black_plague.title: "The Kingdom of Teeth"
chaosx.events_log.world_end.black_plague.details: "The Black Plague has crossed the final threshold. The sentient Rat King has completed its royal route, seized the required capitals and refuge nodes, and brought an eligible continent under one crown. Evolution V begins the deterministic takeover: human administrations collapse, the rat dominion claims the surviving infrastructure, and the world enters a new order ruled from the Royal Basin."
chaosx.events_log.world_end.zombie_apocalypse.title: "Zombie Apocalypse"
chaosx.events_log.world_end.zombie_apocalypse.details: "The outbreak has outgrown every line built to contain it. The dead move from ruined cities into the last organized refuges, while the living lose the roads, laboratories, and armies needed to answer them.\n\nThe Zombie Horde becomes the dominant order of the world. Isolated survivors remain in scattered refuges under a world ordered by the dead."
chaosx.events_log.world_end.fallout.title: "Fallout"
chaosx.events_log.world_end.fallout.details: "The thermonuclear sweep has ended the old map. Population loss has been entered into the Deaths system, every government has regressed, and every surviving tag remains in the fractured world.\n\nThe blackout resolves a new border pattern from the surviving states and the independence-wave tag pool. Wars end before the rewrite, the air remains fixed at ninety-nine percent contamination, and the survivor scheduler begins after the map returns."
chaosx.events_log.world_end.final_silence.title: "The Final Silence"
chaosx.events_log.world_end.final_silence.details: "The Holy Realm carries its last doctrine into firing tables, distant commands, and the machinery of war. Its arsenals serve a single purpose: silence.\n\nThe Empty Seat's final order silences organized resistance and ordinary state life. Radio networks, armies, and governments disappear into a world that has fallen quiet."
chaosx.events_log.world_end.world_in_fury.title: "The World in Fury"
chaosx.events_log.world_end.world_in_fury.details: "Fury is no longer confined to one rogue state. Armed hosts answer one another across continents, each treating the nearest border as an invitation to attack and every pause as weakness.\n\nA network of Fury states opens a global war without a negotiated political end. Rage becomes the world's governing order."
chaosx.events_log.world_end.last_shores.title: "Last Shores"
chaosx.events_log.world_end.last_shores.details: "Death has emptied enough land to turn islands, wastelands, and ghost hosts into one design. A consumed continent gives Zol the ground from which to reach every surviving shore.\n\nNew footholds open across the living world, and the dead march from the last shores to complete the Black Ledger. No population remains beyond Death's count."
chaosx.events_log.world_end.world_is_the_larder.title: "The World Is the Larder"
chaosx.events_log.world_end.world_is_the_larder.details: "Lecter's host has pulled the feeding territories and armed kitchens into one command. Roads, farms, prisons, and conquered cities are all treated as parts of the same larder. Surviving countries are reduced to prey, raiders, or small resistance enclaves.\n\nThe network has no reason to hide anymore. Every government still standing faces an expanding host that intends to feed on the whole world."
chaosx.events_log.world_end.no_thaw_will_come.title: "No Thaw Will Come"
chaosx.events_log.world_end.no_thaw_will_come.details: "Lecter's winter host has given itself to the Wendigo hunger. Feeding grounds spread with the cold, and conquered communities are dragged into a world where thaw, harvest, and mercy are treated as weaknesses.\n\nWinter advances with the host. Every surviving country is hunted until human rule is consumed or driven into a handful of frozen refuges."
chaosx.events_log.world_end.world_opens_below.title: "The World Opens Below"
chaosx.events_log.world_end.world_opens_below.details: "The Oth-Kesh have secured their first continent and opened new chambers beyond the sea. The tunnels below become roads for armored broods, and fresh fronts tear open beneath the richest ground.\n\nEvery surviving continent now has its own entrance to the World Below. The surface is caught in one global war against the depths."
chaosx.events_log.world_end.laboratory_world.title: "Laboratory World"
chaosx.events_log.world_end.laboratory_world.details: "Kruger's Directorate has swallowed the governments that once tried to supervise it. Countries, populations, and whole landscapes survive as controlled samples inside a planetary laboratory.\n\nThe world has become one experiment, and Kruger alone decides what happens to the control group."
chaosx.events_log.world_end.strategic_singularity.title: "The Strategic Singularity"
chaosx.events_log.world_end.strategic_singularity.details: "The Directorate's final device tears through armies, cities, and the air itself. The blast leaves mass death, poisoned ground, and governments too broken to hold the old world together.\n\nThe Singularity ends Kruger's experiment and leaves the survivors in a world of fallout."
chaosx.events_log.window.event_details.communism_spread: "Communist organizers build pressure through national propaganda and local control. The national spirit gives a small daily communist drift, while each communist-controlled state adds another §R+0.01§! daily drift through dynamic pressure.\n\nControlled states can become Agitation Zones, Insurgent Strongholds, or Communist Lockdowns. Regular state intervention works only against the first two levels. Emergency national intervention affects all controlled states, but can trigger a custom communist uprising from converted controlled states.\n\nAs the movement evolves, controlled states may produce rare surprise revolts, stranger worker incidents, and broader revolutionary pressure."
chaosx.events_log.window.event_details.zombie_outbreak: "The outbreak begins in one random populous state. Zombies use only manpower for their divisions, and thus depend a lot on the population of states they capture. If the horde gets momentum, it spreads fast and captured land is cored right away.\n\nSecondary outbreaks happen most likely in big, crowded, less developed states. Chaos makes those outbreaks more common over time, and each zombie evolution makes the horde harder to contain.\n\nIf you want to keep the event under control, the main things that matter are holding the front, cutting outbreak risk with prevention decisions, pushing cure research, and joining the Anti-Zombie League."
chaosx.events_log.window.event_details.random_war: "Random War turns border orders, panicked ultimatums, and opportunistic claims into sudden declarations between eligible sovereign countries.\n\nHigher chaos tiers unlock War Contagion stages that spread one incident into a wider war web. Later stages can draw compatible Chaos Redux special countries, major powers, and faction members into the chain."
chaosx.events_log.window.event_details.soviet_collapse: "The Soviet Union is losing command over its republics, rail offices, garrisons, and depots. Moscow can answer with force, negotiation, isolation, or party discipline, but each visible failure gives local authorities more room to act.\n\nCurrent reading: [GetEventsLogSovietCollapseDetailCrisisState]\nFirst wave: [GetEventsLogSovietCollapseDetailFirstWave]\nFree Republics' League: [GetEventsLogSovietCollapseDetailLeague]\nMoscow Authority: [GetEventsLogSovietCollapseDetailAuthority]\nUnion Crisis Threat: [GetEventsLogSovietCollapseDetailThreat]\nForeign intervention: [GetEventsLogSovietCollapseDetailForeign]\nOld movements and splinters: [GetEventsLogSovietCollapseDetailMutation]\n\nForced-labor quotas, grain extraction, and NKVD campaigns can briefly reinforce Moscow's authority, but each use deepens famine pressure, republic fear, old-movement grievance, and the evidence record. Once the crisis becomes severe, repression can no longer reduce the terminal threat.\n\nBreakaway republics can seek recognition, seize depots, coordinate defenses, or draw more republics into the crisis while Moscow tries to restore command or force a new settlement."
chaosx.events_log.window.event_details.fury: "Fury turns an eligible non-player minor country into a rogue war state driven by an unnatural rage. The player, subjects, majors, player-linked countries, and island-only countries are kept out of the Fury selection pool, but they can still become targets when ordinary target rules allow it.\n\nThe actor receives the Fury Column template, stockpiles scaled to its size, recurring reinforcement waves, Fury decisions, and a shared focus tree. It attacks valid neighboring targets, records its first conquest, and can escalate through Hardened Fury, second-actor cooperation or rivalry, and all-border violence."
chaosx.events_log.window.event_details.white_peace: "White Peace searches for wars that can end without conquest, indemnity, or scripted-story damage. At first it settles one minor country pair under the same flags and the same borders.\n\nLater evolutions can settle several minor pairs, rarely include a major country, or issue broader diplomatic settlements when the world has too many wars.\n\nIts selection weight rises with active wars and valid minor-war candidates, but repeated firings and higher evolutions keep it from becoming common."
chaosx.events_log.window.event_details.death.pre_reveal: "Death first appears through missing island traffic. Mail boats fail to return, radio rooms stop answering, and port offices cannot confirm any arrivals from the affected island.\n\nAt this stage there is no public enemy. A country that receives the report can ignore it, restrict sea traffic, preserve the records, or send a survey boat while the problem is still small."
chaosx.events_log.window.event_details.death: "Death is a hidden island crisis that can become a war. It begins by taking one remote island and waiting in silence. Before the public reveal, island spread looks for small island states, especially nearby islands under 100K people, before widening to other low-population island targets.\n\nWhen Death consumes a state, the state is not occupied in the normal way. Its full population is removed and recorded in the Deaths System, then the state is transferred to Death, cored by Death, stripped of factories, dockyards, ports, infrastructure, and other usable buildings, and marked with the active wasteland modifier. Local manpower, factories, resources, supply, and movement are ruined there. Units caught inside are withered, and recaptured wastelands stay dangerous until countries invest in recovery work.\n\nDeath grows through the Black Ledger. Each consumed state adds soul power, and consumed population adds more at one soul power per 250K people. After the world-end stage begins, last-shore footholds add extra soul power as well. Available soul power is what Death has generated but not yet spent.\n\nDeath spends soul power on forced island spread, mainland pressure, and ghost hosts. Early hosts are weak and passive, later hosts become stronger, and the world-end stage lets Death open last-shore footholds on surviving continents.\n\nLiving countries answer through investigation decisions, early survey boats, war declarations after the danger is clearer, coastal watches, quarantine lines, the Living Compact, wasteland entry gear, dead-zone outposts, and risky Black Book methods. Defeating Death means retaking every state it controls."
chaosx.events_log.window.event_details.utopia_manifesto: "A translated manifesto slips out of reading rooms and into the government of a small country. It promises that common stores, useful work, and public need can build a fairer society. Its readers quickly split over who gets to decide what people need and how much freedom the plan can afford.\n\nShortages, public works, local charters, and deals with neighboring states put every promise to the test. The commonwealth must prove that it can care for people without turning necessity into an excuse for control or conquest."
chaosx.events_log.window.event_details.event_011_unavailable: "Event 011 is currently unavailable."
chaosx.events_log.window.evolution_details.fury.title.stage_1: "Hardened Fury"
chaosx.events_log.window.evolution_details.fury.title.stage_2: "Two Fires"
chaosx.events_log.window.evolution_details.fury.title.stage_3: "All Borders at Once"
chaosx.events_log.window.evolution_details.fury.body.event_detail: "Fury evolutions change how the rage mutates, how many rogue actors can exist, and how violently they attack nearby countries."
chaosx.events_log.window.evolution_details.fury.body.stage_1: "Hardened Fury turns the first outbreak into a more disciplined rage. The actor replaces emergency National Fury with Hardened Fury, gains momentum and reach, and opens stronger military and depot routes."
chaosx.events_log.window.evolution_details.fury.body.stage_2: "Two Fires allows a second Fury actor to exist when safe candidates remain. The two actors can cooperate, compete, or turn their fury on each other while nearby countries face more than one rogue threat."
chaosx.events_log.window.evolution_details.fury.body.stage_3: "All Borders at Once allows up to three Fury actors and shifts the danger from serial neighbor wars to simultaneous attacks. Fury actors can open all valid neighboring fronts and unlock the highest escalation routes."
chaosx.events_log.window.evolution_details.white_peace.title.stage_1: "Repeated Minor Settlements"
chaosx.events_log.window.evolution_details.white_peace.title.stage_2: "Major-Country Settlement"
chaosx.events_log.window.evolution_details.white_peace.title.stage_3: "Broad Diplomatic Settlement"
chaosx.events_log.window.evolution_details.white_peace.body.event_detail: "White Peace evolutions change how many quiet settlements can fit inside one firing and how rarely larger actors can be drawn to the same no-gain table."
chaosx.events_log.window.evolution_details.white_peace.body.stage_1: "Repeated Minor Settlements lets one firing quiet several minor fronts when enough safe pairs exist."
chaosx.events_log.window.evolution_details.white_peace.body.stage_2: "Major-Country Settlement allows a rare no-gain exit involving a major country when the war segment can be settled without rewriting the wider conflict."
chaosx.events_log.window.evolution_details.white_peace.body.stage_3: "Broad Diplomatic Settlement lets one armistice circular quiet broader safe war clutter while leaving protected wars untouched."
chaosx.events_log.evolution.type.death: "Death"
chaosx.events_log.window.evolution_details.death.title.stage_2: "Second Shore"
chaosx.events_log.window.evolution_details.death.title.stage_3: "Mainland Reach"
chaosx.events_log.window.evolution_details.death.title.stage_4: "First Ghost Hosts"
chaosx.events_log.window.evolution_details.death.title.stage_5: "Hollow Ghost Hosts"
chaosx.events_log.window.evolution_details.death.title.stage_6: "Last Shores"
chaosx.events_log.window.evolution_details.death.body.event_detail: "Death evolutions track what Death can do: take more islands, reach the mainland, raise weak hosts, raise stronger hosts, and finally open footholds across every remaining continent."
chaosx.events_log.window.evolution_details.death.body.stage_2: "Second Shore lets Death start consuming additional islands. The spread is still slow, and most governments can still mistake it for missing shipping."
chaosx.events_log.window.evolution_details.death.body.stage_3: "Mainland Reach lets Death push toward a mainland state. If it succeeds, Death becomes public and opens the normal containment war."
chaosx.events_log.window.evolution_details.death.body.stage_4: "First Ghost Hosts lets weak ghost divisions appear in the wasteland. They hold borders passively, have very low organization, and are easy to push."
chaosx.events_log.window.evolution_details.death.body.stage_5: "Hollow Ghost Hosts brings more ghost divisions with slightly better combat strength. They are still weaker than regular infantry."
chaosx.events_log.window.evolution_details.death.body.stage_6: "Last Shores begins after Death consumes a continent. Death gains many more hosts, the hosts fight on infantry terms, and they start attacking aggressively."
chaosx.events_log.window.event_details.soviet_collapse.crisis.terminal: "central command has failed as a Union-wide authority."
chaosx.events_log.window.event_details.soviet_collapse.crisis.active: "orders still move from Moscow, but republic ministries, rail offices, and garrisons are testing which commands will be obeyed."
chaosx.events_log.window.event_details.soviet_collapse.crisis.dormant: "the crisis is not currently active on the map."
chaosx.events_log.window.event_details.soviet_collapse.first_wave.active: "the first emergency declarations are still shaping the crisis."
chaosx.events_log.window.event_details.soviet_collapse.first_wave.ended: "the opening rupture has been overtaken by the full collapse."
chaosx.events_log.window.event_details.soviet_collapse.first_wave.settled: "the opening shock has passed into the wider struggle over authority."
chaosx.events_log.window.event_details.soviet_collapse.first_wave.none: "no active first wave is visible."
chaosx.events_log.window.event_details.soviet_collapse.league.exists: "organized breakaway coordination exists."
chaosx.events_log.window.event_details.soviet_collapse.league.absent: "breakaway cooperation has not become a formal league."
chaosx.events_log.window.event_details.soviet_collapse.authority.terminal: "Moscow can no longer speak for the Union."
chaosx.events_log.window.event_details.soviet_collapse.authority.failing: "authority is failing and local offices are preparing their own answers."
chaosx.events_log.window.event_details.soviet_collapse.authority.shaken: "authority is shaken, but the center still has instruments to answer the crisis."
chaosx.events_log.window.event_details.soviet_collapse.authority.contested: "authority is contested and depends on visible successes."
chaosx.events_log.window.event_details.soviet_collapse.authority.recovering: "authority is recovering enough for Moscow to pressure the edges again."
chaosx.events_log.window.event_details.soviet_collapse.threat.terminal: "the crisis has crossed into terminal rupture."
chaosx.events_log.window.event_details.soviet_collapse.threat.severe: "the crisis is severe and broad failure is credible."
chaosx.events_log.window.event_details.soviet_collapse.threat.rising: "the crisis is rising through visible failures and widening refusal."
chaosx.events_log.window.event_details.soviet_collapse.threat.contained: "the crisis is still contained enough for outcomes to change."
chaosx.events_log.window.event_details.soviet_collapse.foreign.dominant: "outside patrons are shaping the crisis as much as local ministries."
chaosx.events_log.window.event_details.soviet_collapse.foreign.organized: "foreign channels are organized and increasingly hard to ignore."
chaosx.events_log.window.event_details.soviet_collapse.foreign.limited: "foreign observers and aid channels are present but not yet decisive."
chaosx.events_log.window.event_details.soviet_collapse.foreign.watchful: "foreign governments are watching for leverage."
chaosx.events_log.window.event_details.soviet_collapse.mutation.high: "high-chaos authorities and old claims are pressing beyond ordinary republican politics."
chaosx.events_log.window.event_details.soviet_collapse.mutation.visible: "old movements, strange symbols, and irregular authorities are becoming visible."
chaosx.events_log.window.event_details.soviet_collapse.mutation.quiet: "ordinary republic politics still dominate the visible crisis."
