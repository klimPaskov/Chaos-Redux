chaosx.events_log.window.event_details.independence_wave: "Across several regions, provisional states rise in one synchronized wave from viable local claims, prepared institutions, regional identities, and remembered polities. Automatic waves release 6 countries in Calm World, 8 in Gathering Storm, 10 in Rising Chaos, 14 in Chaos Tier, and 20 in Totalen Chaos. World Collapse also releases 20 while raising force, instability, rarity, and ambition pressure. Their former hosts retain a remnant, but the new governments inherit unsettled borders, disputed assets, fragile forces, and urgent struggles for recognition. The crisis opens at stability below 35%, an enemy-controlled owned state above 50 resistance, or a controlled foreign-owned state above 50 resistance. The 120-day crisis queues the ordinary doubled wave when pressure remains. Cancelling changes stability by [?constant:independence_wave_crisis.stability_failure_loss|%0] and starts the [?constant:independence_wave_crisis_timing.cooldown_days|0]-day cooldown. An invalid or exhausted plan changes stability by [?constant:independence_wave_crisis.stability_failure_loss|%0], adds [?constant:independence_wave_crisis.war_support_failure_gain|%0] war support, raises qualifying resistance by [?constant:independence_wave_crisis.resistance_failure_gain|0], starts the cooldown, and leaves ownership unchanged. A busy coordinator uses a bounded retry. Each new country must choose how to govern, secure itself, bargain with its former host, and resist or accept competing patrons.\n\n[GetIndependenceWaveRivalBlocEventDetails]\n[GetIndependenceWaveRivalBlocEventDetailsMember]"
