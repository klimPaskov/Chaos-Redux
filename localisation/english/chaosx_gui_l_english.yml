chaosx.help.body: "[GetChaosxHelpBody]"
chaosx.help.tab.overview: "Overview"
chaosx.help.tab.events: "Events"
chaosx.help.tab.chaos_meter: "Chaos"
chaosx.help.tab.warfare: "Warfare"
chaosx.help.tab.controls: "Controls"
chaosx.help.body.overview: "§YCurrent State§!\nChaos: [GetChaosMeterValueColored]  Tier: §Y[GetChaosTierName]§!\nTimer: §Y[?event_timer_days|0]§! days  Range: §Y[?timer_window_dynamic_min_days|0]§!-§Y[?timer_window_dynamic_max_days|0]§! days\nEvents: §Y[?global.total_events_fired|0]§!  Evolutions: §Y[?global.events_log_evolution_sequence|0]§!\nClusters: §Y[?global.total_event_clusters_fired|0]§!\n\n§YAutomatic Events§!\nEach eligible player country has its own timer. When it reaches zero, an eligible event is chosen using the current weights. Disabled events and unique events that have already fired are excluded. Rising Chaos shortens the interval and allows stronger crises.\n\n§YYour Controls§!\nSettings lets you pause automatic events, choose an event or cluster, adjust timing and change the global Chaos level. Sending an event manually starts a fresh automatic-event timer interval. Event Logs shows the campaign history and opens details about each event.\n\n§YMultiplayer§!\nChaos and world crises are shared. Each player can pause their own automatic events without stopping another player's timer."
chaosx.help.body.events: "§YLive Values§!\nEvents fired: §Y[?global.total_events_fired|0]§!  Unique events left: §Y[?global.unfired_total_events_count|0]§!\nMajor left: §Y[?global.unfired_major_events_count|0]§!  Fire once left: §Y[?global.unfired_fire_once_events_count|0]§!  Repeatable never fired: §Y[?global.unfired_repeatable_events_count|0]§!\nDisabled events: §Y[?global.disabled_events^num|0]§!\n\n§YEvent Types§!\nRepeatable events can return to the automatic pool after firing, so they may appear several times when their triggers and recovered weight allow it. Fire-once events are ordinary unique events that leave the normal pool after they fire automatically. Major events are unique, high-impact events with their own count and gating, and they also leave automatic selection after firing unless fired manually.\n\n§YEvolutions§!\nEvolutions are staged progress markers inside a larger event system. When a stage fires, the log records how far that system has advanced.\n\n§YClusters§!\nFixed-member clusters begin with an eligible trigger, guarantee required members, and roll optional members by severity and current Chaos. They may add stricter gates but can never override event-system fireability. Random Stuff works differently: after an ordinary automatic minor event, it can draw 3 to 5 events uniformly from the entire currently fireable pool.\n\n§YWorld-End Scenarios§!\nWorld-end scenarios are campaign endings unlocked at the World Collapse tier. An enabled one can resolve the campaign from the global situation, and once one begins, automatic event firing stops for every country."
chaosx.help.body.chaos_meter: "§YLive Values§!\nChaos: [GetChaosMeterValueColored]  Tier: §Y[GetChaosTierName]§!\nTimer modifier: §Y[?global.chaos_timer_modifier|.2]x§!\nRecorded deaths: §Y[GetChaosMeterDeathsTotalDisplay]§!\nAir contamination: [GetAirContaminationValueColored]\n\n§YChaos Meter§!\nThe global Chaos Meter shortens event timing, unlocks stronger escalation, and increases eligible cluster pressure as its tier rises.\n\n§YDeaths System§!\nMilitary casualties and state-linked civilian deaths from war, disasters, disease, famine, forced displacement, camps, and unconventional weapons count toward the global death toll. Civilian deaths reduce state population and can increase Chaos.\n\n§YAir Cleanliness§!\nAir Cleanliness tracks atmospheric contamination from chemical hazards, outbreaks, fallout, smoke, ash, and aerosols. Thresholds at 25%, 50%, 75%, and 100% accelerate outbreaks, worsen Air Winter, activate the Air Cleanliness Treaty, and can enable the Fallout consequence. Its Chaos Meter tab shows recovery and each source's contribution.\n\n§YFamine Mechanics§!\nFood shortages become a crisis when war, disasters, or disrupted supplies leave people without enough to eat. Hunger can kill civilians and drive survivors from affected regions. Relief supplies, restored transport, imports, and evacuation can protect your population and help the country recover.\n\n§YMigration Mechanics§!\nMigration affects your country when people flee war, persecution, hunger, or disasters, or when you receive those fleeing elsewhere. Flight reduces the population of affected regions, while arrivals can overwhelm local support. Border policies, safe routes, relief, settlement, and return decisions shape where people can live and whether they survive the journey.\n\n§YCamp System Mechanics§!\nCamps become relevant where your government uses detention or forced labor, including in occupied territory. Camps can cause civilian deaths and suffering, while exposed abuses can bring condemnation against those responsible. Reform and dismantlement decisions let you curb abuses or close the camps."
chaosx.help.body.warfare: "§YChaos Warfare§!\nChaos warfare covers weapons and military systems that change a war beyond normal battles. They leave lasting problems in territory as well as effects on the battlefield.\n\n§YAuthorization§!\nNothing is released until your government picks a use policy. §YRetaliation Only§! allows a release only against an enemy that has already used these weapons on you. §YBattlefield Authorization§! allows ordinary battlefield use against a country you are at war with. §YUnrestricted Authorization§! also allows strategic use, including against a country you are not at war with. Each change costs §Y[GetCBRNPolicyChangeCostQuote]§! Command Power and starts a §Y[GetCBRNPolicyReassessmentDaysQuote]§!-day reassessment, during which the policy cannot be changed again. A stricter policy blocks the matching routes immediately.\n\n§YRaids§!\nChaos warfare adds two raid categories, §YChemical Raids§! and §YBiological Raids§!. A raid targets one state, starts from one of your supply nodes, assigns a qualifying division that travels to the target, and reserves its payload from your stockpile when you launch it. Army intelligence on the target country decides whether the target is shown and how well the raid is prepared. Each route has its own agent, payload, preparation time and cooldown, and the current policy decides which routes accept which targets.\n\n§YChemical Warfare§!\nChemical warfare is built around agents, delivery methods, protective gear, and contamination. It can use shells, projectors, aircraft, or other delivery paths, and it can leave chemical contamination in states. Chemical pressure can affect combat, state safety, cleanup needs, diplomatic reaction, and long-term chaos.\n\n§YBiological Warfare§!\nBiological warfare is built around research projects, facilities, pathogens, defenses, field tests, and outbreak control. Biological attacks can create disease contamination or outbreaks, force prevention and cure decisions, and leave long-term hazards in affected states. The main danger is that effects can keep spreading after the original attack.\n\n§YProtection§!\nOnce a respirator reserve exists, masks are issued from real stock, so the protection you see is always backed by equipment you own. Divisions are served first, then civilians in states under a chemical warning or already contaminated. Nothing is issued that the stockpile cannot cover, and unused crates return to the reserve when a program ends early. Decisions cover building the reserve, reconditioning old masks, replacing filters, exporting to a partner and supplying occupied populations.\n\n§YCondemnation§!\n[GetCBRNHelpCondemnationSummary] Compliance, non-use pledges, compensation and verified aid shipments can bring the score back down.\n\n§YContamination and Mitigation§!\nChemical, biological, and nuclear contamination are tracked at state level. Cleanup, filters, masks, medical defenses, doctrine, technologies, and decisions change duration, strength, and exposure. The mapmode helps find contaminated states, while death and chaos systems record severe failures."
chaosx.help.body.controls: "§YShortcuts§!\nSettings: §YCtrl+Shift+C§!\nChaos Meter: §YCtrl+Shift+M§!\nEvent Logs: §YCtrl+Shift+E§!\nEvents tab: §YCtrl+E§!\nEvent Timer: §YCtrl+Shift+T§!\nScenarios: §YCtrl+Shift+S§!\nHelp: §YCtrl+Shift+H§!\nPause automatic events: §YCtrl+Shift+D§!\n\nIf Radeon Software captures Ctrl+Shift+E or Ctrl+Shift+S, change its recording shortcuts or open these windows through Settings.\n\n§YSettings§!\nChoose an event or cluster in Trigger Events. Sending an event starts a fresh automatic-event timer interval. Force Trigger Mode bypasses the chaos requirement and the fired-event limit. Target requirements still apply. Timer System changes timing and country eligibility. Chaos Meter changes the shared Chaos level. Advanced Settings changes weights and recovery. Miscellaneous includes audio controls. Scenarios opens challenge setups.\n\n§YEvent Logs§!\nSelect a row to open its details. Detail windows can be moved. The Map button locates an event's actor, and Trigger requests the selected event."

