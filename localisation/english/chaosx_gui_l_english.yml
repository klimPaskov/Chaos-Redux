chaosx.events_log.window.cluster_details.description.wars: "Sudden wars and armed conflicts break out between countries, turning local disputes, opportunistic attacks, and border shocks into a wider chain of fighting."
chaosx.events_log.window.cluster_details.description.liberations: "Liberation shocks create new countries, break old chains of command, and turn subject or republic disputes into broader independence crises."
chaosx.events_log.window.cluster_details.description.diplomatic_panic: "Diplomatic crises spread through public quarrels, collapsing relations, hurried guarantees, and minor states pressed to choose among nearby blocs."
chaosx.events_log.window.cluster_details.description.peace: "Peace incidents reduce conflict through settlements, ceasefires, exhaustion, negotiations, and other de-escalation shocks. White Peace is the low-impact member: it looks for wars that can end without territorial gain."
chaosx.events_log.window.cluster_details.description.natural_disasters: "Natural Disasters can strike repeatedly across separated states. Early crises remain local, while higher chaos brings regional cascades and abnormal moving paths. Each affected country receives its own reports and aftermath work."
chaosx.events_log.window.cluster_details.description.formables: "This cluster has no playable formable escalation."
chaosx.events_log.window.cluster_details.description.economy_positive: "Economy (pos) delivers beneficial economic shocks with persistent development choices. Resources Found is its medium-severity repeatable member: one discovery can mature into trade, investment, foreign pressure, or a cleanly closed field."
chaosx.events_log.window.cluster_details.description.generic: "Related events form a shared theme, so one incident can grow into a broader chain instead of staying isolated."
