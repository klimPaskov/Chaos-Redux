chaosx.events_log.window.cluster_details.description.wars: "Sudden wars and armed conflicts break out between countries, turning local disputes, opportunistic attacks, internal fractures, and alliance betrayals into wider fighting."
chaosx.events_log.window.cluster_details.description.liberations: "Liberations create independent countries, break up subject states and unions, and link freed states into wider liberation crises."
chaosx.events_log.window.cluster_details.description.diplomacy: "International relations destabilize through diplomatic crises, faction pressure, treaties, strategic alignment, aggressive posturing, and intervention."
chaosx.events_log.window.cluster_details.description.diplomatic_panic: "International relations destabilize through diplomatic crises, faction pressure, treaties, strategic alignment, aggressive posturing, and intervention."
chaosx.events_log.window.cluster_details.description.peace: "Wars wind down through settlements, ceasefires, demobilization, exhaustion, negotiations, and forced returns to peacetime."
chaosx.events_log.window.cluster_details.description.natural_disasters: "Natural and environmental catastrophes strike states or regions, and repeated disasters can grow into larger cascades."
chaosx.events_log.window.cluster_details.description.formables: "Countries revive, construct, or transform into major historical, religious, imperial, or alternative political formations."
chaosx.events_log.window.cluster_details.description.positive_economy: "Economic windfalls bring sudden growth, wealth, industry, infrastructure, construction, lower costs, or profitable underground markets."
chaosx.events_log.window.cluster_details.description.economy_positive: "Economic windfalls bring sudden growth, wealth, industry, infrastructure, construction, lower costs, or profitable underground markets."
chaosx.events_log.window.cluster_details.description.intelligence: "Espionage, leaks, investigations, and intelligence failures expose or manipulate states through secret information."
chaosx.events_log.window.cluster_details.description.scientific_research: "Military schools, research offices, command staffs, public agencies, and national leadership enter a period of rapid improvement. The selected breakthrough is guaranteed, and other eligible members may join the same worldwide wave of development."
chaosx.events_log.window.cluster_details.description.national_breakthroughs: "Military schools, research offices, command staffs, public agencies, and national leadership enter a period of rapid improvement. The selected breakthrough is guaranteed, and other eligible members may join the same worldwide wave of development."
chaosx.events_log.window.cluster_details.description.negative_economy: "Economic crises damage production, trade, employment, and industrial capacity. Great Depression 2.0 is the cluster's Low baseline member, and harsher consequences follow from the conditions the crisis creates."
chaosx.events_log.window.cluster_details.description.various_anomalies: "Anomalous events that fit no more specific cluster."
chaosx.events_log.window.cluster_details.description.pacts: "Countries create secret, unusual, or rapidly assembled pacts and alliance arrangements that can reshape later conflicts."
chaosx.events_log.window.cluster_details.description.diseases: "Disease outbreaks and biological crises spread through countries, armies, and populations, creating escalating health and military emergencies."
chaosx.events_log.window.cluster_details.description.randomizations: "Core parts of the game state are deliberately randomized, producing sweeping systemic changes."
chaosx.events_log.window.cluster_details.description.sudden_abundance: "Countries suddenly receive large quantities of manpower, wealth, equipment, weapons, fleets, structures, or other valuable assets without normal buildup."
chaosx.events_log.window.cluster_details.description.domestic_unrest: "Internal instability produces insurgency, separatism, terrorism, civil conflict, and breakaway movements inside or against existing states."
chaosx.events_log.window.cluster_details.description.domestic_unrest: "Internal instability produces insurgency, separatism, terrorism, civil conflict, and breakaway movements inside or against existing states."
chaosx.events_log.window.cluster_details.description.alien_invasions: "Extraterrestrial or non-human invasion forces directly threaten countries, territory, and the existing international order."
chaosx.events_log.window.cluster_details.description.military_preparation: "States rapidly acquire the doctrine, strategic weapons, equipment, fortifications, institutions, and military capacity needed for future conflict."
chaosx.events_log.window.cluster_details.description.random_stuff: "After an ordinary minor event fires at Chaos Tier 3 or above, Random Stuff gets a rare activation roll. On success it draws 3 to 5 additional events uniformly and without replacement from the entire currently fireable positive-weight event pool, ignoring major or minor type, severity, and weight. Its chance starts at 0.30%, 0.60%, or 0.85% by tier, rises gradually after valid misses, can exceed 1% during a long dry streak, and has a 240-day cooldown after a success."
chaosx.events_log.window.cluster_details.description.generic: "Related events form a shared theme, allowing one incident to grow into a broader chain."
