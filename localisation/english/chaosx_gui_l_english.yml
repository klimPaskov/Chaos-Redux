chaosx.triggerable_scenarios.1.t: "Zombie Apocalypse Launched"
chaosx.triggerable_scenarios.1.d: "The Zombie Apocalypse scenario has begun. Outbreaks have started across the world at the chosen intensity, each following the strain selected in the scenario window."
chaosx.triggerable_scenarios.1.a: "Containment begins."
chaosx.triggerable_scenarios.2.t: "Army of Clones"
chaosx.triggerable_scenarios.2.d: "A hostile artificial army has seized a broad front in Eastern Europe and the western Soviet borderlands. Its leaders preach engineered obedience and racial myth, and every country around it now faces a military crisis."
chaosx.triggerable_scenarios.2.a: "A new front opens."
chaosx.triggerable_scenarios.3.t: "The Clone Army Mobilizes"
chaosx.triggerable_scenarios.3.d: "The clone formations advance under forced discipline and laboratory command, with orders to expand, break neighboring states, and turn the surrounding front into a test ground."
chaosx.triggerable_scenarios.3.a: "Advance."
chaosx.triggerable_scenarios.4.t: "The Union Unmade"
chaosx.triggerable_scenarios.4.d: "The Soviet Union has collapsed at once. Republic councils, regional leagues, and armed committees have left Moscow's command structure and opened the war for the former Union."
chaosx.triggerable_scenarios.4.a: "The republics go their own way."
chaosx.triggerable_scenarios.6.t: "Death: Instant Outbreak"
chaosx.triggerable_scenarios.6.d: "The manual Death scenario has begun. Death has taken an island, gained a foothold on the mainland, and raised ghost hosts scaled to the chosen intensity. Further spread follows from this opening."
chaosx.triggerable_scenarios.6.a: "Begin containment."
chaosx.triggerable_scenarios.11.t: "Africa Is One"
chaosx.triggerable_scenarios.11.d: "Africa has united under one continental state. The Charter League and its regional institutions now shape the campaign, scaled to the chosen intensity."
chaosx.triggerable_scenarios.11.a: "The continent answers."
