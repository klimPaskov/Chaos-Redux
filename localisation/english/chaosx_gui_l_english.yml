chaosx.scenarios.black_plague.name: "Black Plague Unbound"
chaosx.scenarios.black_plague.desc: "A plague erupts across several continents. A Rat Nation rises among the infected while the Rat King gathers a royal basin of his own. Evolutions I to IV start active, and Evolution V and the world end stay locked."
chaosx.scenarios.black_plague.impact.low: "§RSeeds three continents with a limited plague.§! Establishes [?constant:black_plague_evolution_runtime.scenario_low_established_states|0] infected states, [?constant:black_plague_scenario.low_internal_brood_target|0] brood basins, and [?constant:black_plague_evolution_runtime.scenario_low_king_states|0] Royal Basin state."
chaosx.scenarios.black_plague.impact.medium: "§RSeeds four continents with a regional plague.§! Establishes [?constant:black_plague_evolution_runtime.scenario_medium_established_states|0] infected states, [?constant:black_plague_scenario.medium_internal_brood_target|0] brood basins, and [?constant:black_plague_evolution_runtime.scenario_medium_king_states|0] Royal Basin states."
chaosx.scenarios.black_plague.impact.high: "§RSeeds five continents, or all if fewer exist.§! Establishes [?constant:black_plague_evolution_runtime.scenario_high_established_states|0] infected states, [?constant:black_plague_scenario.high_internal_brood_target|0] brood basins, and [?constant:black_plague_evolution_runtime.scenario_high_king_states|0] Royal Basin states."
chaosx.scenarios.black_plague.impact.maximum: "§RSeeds every inhabited continent.§! Establishes [?constant:black_plague_evolution_runtime.scenario_maximum_established_states|0] infected states, [?constant:black_plague_scenario.maximum_internal_brood_target|0] brood basins, and [?constant:black_plague_evolution_runtime.scenario_maximum_king_states|0] Royal Basin states."
chaosx.scenarios.zombie.name: "Zombie Apocalypse"
chaosx.scenarios.zombie.desc.diverse: "Launches several outbreaks with mixed zombie profiles. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.random: "Launches several outbreaks that each roll a profile independently. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.standard: "Launches standard outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.rabid: "Launches fast, aggressive outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.parasitic: "Launches parasitic outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.mutant: "Launches mutant outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.undead: "Launches undead outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.necrotic: "Launches necrotic outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.demonic: "Launches demonic outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.wendigo: "Launches wendigo outbreaks across multiple regions. Intensity controls outbreak count, starting states, divisions, and early pressure."
chaosx.scenarios.zombie.desc.connected: "Launches one connected outbreak front with concentrated starting forces. Intensity controls the number of linked states, divisions, and early pressure."
chaosx.scenarios.zombie.impact.low: "§RLaunches hostile outbreaks immediately.§! Low intensity starts with a small outbreak area."
chaosx.scenarios.zombie.impact.medium: "§RLaunches hostile outbreaks immediately.§! Medium intensity starts a broad crisis that can still be contained."
chaosx.scenarios.zombie.impact.high: "§RLaunches hostile outbreaks immediately.§! High intensity starts with more regions, troops, and pressure."
chaosx.scenarios.zombie.impact.maximum: "§RLaunches hostile outbreaks immediately.§! Maximum intensity opens with severe global pressure."
chaosx.scenarios.clones.name: "Army of Clones"
chaosx.scenarios.clones.desc.standard: "Creates a hostile artificial army across Poland, parts of Germany, and the western Soviet borderlands. Intensity controls territory, equipment, divisions, and pressure on neighbors."
chaosx.scenarios.clones.desc.aryan: "Creates a stronger hostile variant with better equipment, extra formations, and more aggressive pressure on neighboring countries."
chaosx.scenarios.clones.impact.low: "§RTransfers territory and starts wars immediately.§! Low intensity keeps the starting front narrower."
chaosx.scenarios.clones.impact.medium: "§RTransfers territory and starts wars immediately.§! Medium intensity creates a difficult regional front."
chaosx.scenarios.clones.impact.high: "§RTransfers territory and starts wars immediately.§! High intensity expands the front and army stockpiles."
chaosx.scenarios.clones.impact.maximum: "§RTransfers territory and starts wars immediately.§! Maximum intensity creates the largest starting army and front."
chaosx.scenarios.soviet_collapse.name: "Soviet Collapse"
chaosx.scenarios.soviet_collapse.desc.normal: "The Soviet Union breaks apart at once. Every ordinary republic is released, local defensive leagues form, and the anti-Soviet wars begin. Intensity sets the extra starting forces of each breakaway."
chaosx.scenarios.soviet_collapse.desc.chaos: "The Soviet Union breaks apart at once. Every republic is released, including the high-chaos splinter states that can form, local factions arise, and the anti-Soviet wars begin. Intensity sets the extra starting forces of each breakaway."
chaosx.scenarios.soviet_collapse.impact.low: "§RBreaks the Soviet Union immediately.§! Low intensity adds only a limited emergency army to each republic."
chaosx.scenarios.soviet_collapse.impact.medium: "§RBreaks the Soviet Union immediately.§! Medium intensity gives the republics enough force to hold a broad opening front."
chaosx.scenarios.soviet_collapse.impact.high: "§RBreaks the Soviet Union immediately.§! High intensity gives stronger republics a large starting army."
chaosx.scenarios.soviet_collapse.impact.maximum: "§RBreaks the Soviet Union immediately.§! Maximum intensity gives the strongest republics a very large starting army."
chaosx.scenarios.fallout.name: "Fallout"
chaosx.scenarios.fallout.desc: "A thermonuclear strike hits every valid province. Seven days later the Fallout blackout begins. The population collapses, surviving countries are thrown back, all wars end, and a new fractured map takes shape."
chaosx.scenarios.fallout.impact: "§RStarts the strikes immediately.§! After seven days the blackout begins and Air Contamination is locked at ninety-nine percent for good."


chaosx.scenarios.fury.name: "The World in Fury"
chaosx.scenarios.fury.desc.pact: "Turns eligible minor governments into dispersed Fury states and organizes them into the Fury Pact. Higher intensity spreads the pact farther across the world and strengthens its opening forces."
chaosx.scenarios.fury.desc.hostile: "Turns eligible minor governments into dispersed hostile Fury states that immediately pursue neighboring wars. Higher intensity spreads the Fury farther across the world and strengthens their opening attacks."
chaosx.scenarios.type.fury.pact: "Fury Pact"
chaosx.scenarios.type.fury.hostile: "Hostile Fury"
chaosx.scenarios.fury.impact.low: "Up to two independent minor countries enter Fury. Your country, its allies, and its subjects are protected."
chaosx.scenarios.fury.impact.medium: "Up to five independent minor countries enter Fury. Your country, its allies, and its subjects are protected."
chaosx.scenarios.fury.impact.high: "Up to nine independent minor countries enter Fury. Your country, its allies, and its subjects are protected."
chaosx.scenarios.fury.impact.maximum: "Up to sixteen independent minor countries enter Fury. Your country, its allies, and its subjects are protected."
chaosx.scenarios.death.name: "Death"
chaosx.scenarios.death.desc.instant_outbreak: "Starts Death as an immediate outbreak. One remote island and one mainland state are consumed at once, and intensity adds more starting territory and ghost hosts. Later spread grows normally from that opening."
chaosx.scenarios.type.death.instant_outbreak: "Instant Outbreak"
chaosx.scenarios.death.impact.low: "Low intensity consumes one island and one mainland state, then spawns one weak ghost host."
chaosx.scenarios.death.impact.medium: "Medium intensity adds two extra islands and spawns two weak ghost hosts."
chaosx.scenarios.death.impact.high: "High intensity adds four extra islands, one extra mainland state, and two stronger ghost hosts."
chaosx.scenarios.death.impact.maximum: "Maximum intensity adds six extra islands, two extra mainland states, and four stronger ghost hosts."
chaosx.scenarios.disaster_barrage.name: "Disaster Barrage"
chaosx.scenarios.disaster_barrage.desc.random: "Starts a varied disaster season in the selected country. The mix of disasters follows the chosen intensity, and each impact brings the usual warnings, reports, recovery work, and follow-up risks."
chaosx.scenarios.disaster_barrage.desc.geological: "Starts a geological crisis built from earthquakes, landslides, eruptions, lahars, tsunamis, and skyfall impacts that fit the chosen intensity."
chaosx.scenarios.disaster_barrage.desc.weather: "Starts a weather crisis built from floods, storms, wind, tornadoes, hail, wildfire, drought, heat, cold, blizzards, and dust."
chaosx.scenarios.disaster_barrage.desc.skyfall: "Starts a skyfall crisis built from meteor impacts, meteor showers, fire-bearing hail, ocean impacts, and the ash or tsunami chains they can produce."
chaosx.scenarios.disaster_barrage.desc.full_catalogue: "Starts a disaster season open to every kind of disaster. Global news covers only the largest impacts, which keeps the reports readable."
chaosx.scenarios.disaster_barrage.impact.low: "Low intensity starts a varied local season with ordinary warnings, affected-country reports, and recovery work."
chaosx.scenarios.disaster_barrage.impact.medium: "Medium intensity lengthens the sequence and brings regional damage and heavier recovery work."
chaosx.scenarios.disaster_barrage.impact.high: "High intensity chains severe disasters into catastrophic impacts and emergency aftermath work."
chaosx.scenarios.disaster_barrage.impact.maximum: "Maximum intensity brings rupture waves, meteor showers, massive eruptions, delayed tsunamis, moving storms, and a long recovery."
chaosx.scenarios.type.disaster_barrage.random: "Random Barrage"
chaosx.scenarios.type.disaster_barrage.geological: "Geological Crisis"
chaosx.scenarios.type.disaster_barrage.weather: "Weather Crisis"
chaosx.scenarios.type.disaster_barrage.skyfall: "Skyfall Crisis"
chaosx.scenarios.type.disaster_barrage.full_catalogue: "Full Catalog"
chaosx.scenarios.africa.name: "Africa Is One"
chaosx.scenarios.africa.desc.africa_is_one: "Unites Africa under a powerful continental state, establishes the Charter League and its regional institutions, and prepares the wars required to complete unification."
chaosx.scenarios.africa.desc.world_is_one: "Forms Africa and starts the World Is One campaign. Rival continental powers can be met with treaties, containment, or war, and The World can be proclaimed only after every continental dispute is resolved and the final settlement is ratified."
chaosx.scenarios.africa.impact.low: "§RForms Africa and opens the continental systems immediately.§! Low intensity adds a limited emergency force and modest authority, reach, consent, and readiness."
chaosx.scenarios.africa.impact.medium: "§RForms Africa and opens the continental systems immediately.§! Medium intensity adds a regional emergency force and stronger authority, reach, consent, and readiness."
chaosx.scenarios.africa.impact.high: "§RForms Africa and opens the continental systems immediately.§! High intensity adds a large emergency force and broadens the opening values."
chaosx.scenarios.africa.impact.maximum: "§RForms Africa and opens the continental systems immediately.§! Maximum intensity adds the largest emergency force and strongest opening values."
chaosx.scenarios.type.africa.africa_is_one: "Africa Is One"
chaosx.scenarios.type.africa.world_is_one: "World Is One"
chaosx.scenarios.type.black_plague.instant_plague_kingdoms: "Plague Kingdoms"
chaosx.scenarios.infantry_spawn.name: "The Unbidden Muster"
chaosx.scenarios.infantry_spawn.desc.conventional_flood: "Ordinary formations and caches of arms appear unbidden in great numbers. Their mutinies split command staffs, open conventional wars at once, and clog supply routes. No anomalous host takes part."
chaosx.scenarios.infantry_spawn.desc.arsenal_lottery: "Rebel formations receive uneven packages of armor, motor transport, amphibious equipment, and other specialist materiel. Some fronts get powerful machines without support, others only odd scraps of specialist gear."
chaosx.scenarios.infantry_spawn.desc.general_mutiny: "Randomly composed formations rally behind claimant commanders. Every affected country faces an immediate revolt or military takeover attempt of its own."
chaosx.scenarios.infantry_spawn.desc.anomalous_rising: "Nonhuman formations rise under new regional commands and begin their wars immediately. Zombie, ghost, and golem hosts establish armed breakaways wherever their ranks gather."
chaosx.scenarios.type.infantry_spawn.conventional_flood: "Barracks Flood"
chaosx.scenarios.type.infantry_spawn.arsenal_lottery: "Arsenal Draw"
chaosx.scenarios.type.infantry_spawn.general_mutiny: "Generals' Muster"
chaosx.scenarios.type.infantry_spawn.anomalous_rising: "Impossible Host"
chaosx.scenarios.infantry_spawn.impact.low: "§RStarts immediate revolts and regional wars.§! Low intensity affects a smaller share of eligible countries and opens one main front in each selected command area."
chaosx.scenarios.infantry_spawn.impact.medium: "§RStarts immediate revolts and regional wars.§! Medium intensity spreads several formation lots across broad command areas and opens full-strength local fronts."
chaosx.scenarios.infantry_spawn.impact.high: "§RStarts immediate revolts and regional wars.§! High intensity affects many countries at once, creates larger formation pools, and can open several rival fronts."
chaosx.scenarios.infantry_spawn.impact.maximum: "§RStarts a near-global wave of immediate revolts and wars.§! Every country able to hold an open front receives the largest formation packages."
chaosx.scenarios.intensity: "Intensity"
chaosx.scenarios.intensity.tt: "§YLow§!: a serious crisis with limited reach.\n§YMedium§!: a major regional or global crisis.\n§YHigh§!: heavy pressure over more territory or outbreaks.\n§YMaximum§!: the strongest version of the crisis."
chaosx.scenarios.intensity.low: "Low"
chaosx.scenarios.intensity.medium: "Medium"
chaosx.scenarios.intensity.high: "High"
chaosx.scenarios.intensity.maximum: "Maximum"
