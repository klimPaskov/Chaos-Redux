chaosx.nr55.1.t: "The Great Infrastructure Project"

chaosx.nr55.2.t: "The Great Infrastructure Project"
chaosx.nr55.2.d: "Our nation has completed a major network of roads, bridges, and railways. The new links are moving goods and people faster across the country."
chaosx.nr55.2.a: "All roads lead to [ROOT.capital.GetName]"

chaosx.news.54.t: "The Great Infrastructure Project"
chaosx.news.54.d: "[From.GetName] has completed a major infrastructure project. New roads and railways are connecting markets and opening room for further construction."
chaosx.news.54.a: "Impressive"
