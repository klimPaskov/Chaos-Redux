 chaosx.fallout.513.t: "The Weapons in the Nursery"
 chaosx.fallout.513.intro: "The shelter register for [This.GetName] lists a former child-care room beside the heating plant. The room is vacant, the windows are sealed, and the shelves now hold rifles, detonators, and spare parts gathered from abandoned depots. No minors are present, yet every household recognizes the room and asks who may touch what is inside. The council needs a custody rule before the next shift arrives."
 chaosx.fallout.513.a: "Seal the stock in a central armory"
 chaosx.fallout.513.a.tt: "Spend Power and Recognition to place the room under a council armory. The delayed report will test whether a single seal can keep the stock accountable."
 chaosx.fallout.513.b: "Register every household's weapons"
 chaosx.fallout.513.b.tt: "Spend Scrap, Recognition, and Food to issue household receipts. The result will depend on civic trust and the state's supply position."
 chaosx.fallout.513.c: "Place the stock with a sworn militia"
 chaosx.fallout.513.c.tt: "Spend Power and Fuel to arm a supervised militia. The plan protects the room quickly, but a later safety review can expose private hoarding."
 chaosx.fallout.513.d: "Break down the stock and reopen the room"
 chaosx.fallout.513.d.tt: "Spend Medicine, Recognition, and Food to dismantle the cache and restore the room as a public shelter. Failure damages the state and enters civilian losses in the Deaths system."
 chaosx.fallout.515.t: "The Nursery Armory Report"
 chaosx.fallout.515.central_armory.success.d: "The central seal holds through the first cold rotation. The council's armourer records every rifle and detonator, and the former nursery remains a quiet room beside the heating plant. The state can now move supplies without guessing who controls the stock."
 chaosx.fallout.515.central_armory.partial.d: "The central seal is accepted, but the register has gaps. Two crates move between shifts without a signature, and the council must call the armourer back before the next ration count. The room is controlled, though not yet trusted."
 chaosx.fallout.515.central_armory.failure.d: "The central seal fails during a power interruption. The register burns with the lamp oil, a state arms workshop is damaged, and families in [This.GetName] lose people in the scramble around the former nursery. The Deaths ledger records the failure."
 chaosx.fallout.515.family_registry.success.d: "Household receipts make the cache legible. Families bring each weapon to the table, receive a stamped number, and leave with a duty that neighbors can verify. The former nursery becomes a place of records rather than rumors."
 chaosx.fallout.515.family_registry.partial.d: "Most households accept the register, but three receipts carry the same serial mark. Food carts reach the room late, and the council postpones the second count. The cache is visible, yet a private reserve is forming behind the shelves."
 chaosx.fallout.515.family_registry.failure.d: "The household register turns into a dispute over whose name comes first. Scrap and food vanish from the counting table, the room loses its public purpose, and the local supply line breaks under the argument. The Deaths ledger carries the cost."
 chaosx.fallout.515.militia_custody.success.d: "The sworn militia takes the stock under a written shift order. Its sentries keep the heating plant clear, patrol the door, and return every weapon for inspection. The former nursery becomes a guarded store without becoming a private fortress."
 chaosx.fallout.515.militia_custody.partial.d: "The militia keeps the door closed, but its captain refuses a full inventory. Fuel reaches the guard post before the clinics, and households begin hiding spare ammunition. The room is defended while civic trust thins around it."
 chaosx.fallout.515.militia_custody.failure.d: "The militia abandons the shift after a fuel dispute. A fire reaches the arms workshop, civilians are caught between the shelves and the heating plant, and the state records deaths beside a room that should have been safe."
 chaosx.fallout.515.disarm_nursery.success.d: "The cache is dismantled under the clinic's supervision. Medicine crews clear the shelves, the room reopens as a warm shelter, and the last detonator is entered into a sealed destruction log. The council gains safety without pretending the weapons never existed."
 chaosx.fallout.515.disarm_nursery.partial.d: "The dangerous pieces are removed, but several rifles remain hidden behind a service panel. Food and medicine keep the room open for now, while the council leaves a second inspection on the calendar. The nursery is usable, not settled."
 chaosx.fallout.515.disarm_nursery.failure.d: "The dismantling crew loses the room's inventory during a rushed shift. A charge is damaged, the infrastructure takes the blast, and families in [This.GetName] die while the shelter doors are cleared. The Deaths ledger closes the first report with a warning."
 chaosx.fallout.515.a: "File the armory report and continue the watch"
 chaosx.fallout.515.a.tt: "Resolve the delayed custody report, apply its state and country effects, and schedule the safety callback."
 chaosx.fallout.517.t: "The Nursery Safety Callback"
 chaosx.fallout.517.success.d: "The second inspection finds the custody rule intact. The former nursery is warm, the inventory matches its receipts, and the heating plant can run without a sentry choosing which household receives fuel. The memory is ready to close."
 chaosx.fallout.517.partial.d: "The second inspection finds a workable room with a disputed shelf. The council keeps the doors open, but every shift carries a second count and the state pays for the extra watch. The memory remains conditional."
 chaosx.fallout.517.failure.d: "The second inspection finds an empty lock, a damaged workshop, and a new trail leading away from the former nursery. Families in [This.GetName] have paid again for a custody rule that never became safe. The final Deaths entry is filed with the state record."
 chaosx.fallout.517.a: "Close the custody file and release the room"
 chaosx.fallout.517.a.tt: "Resolve the safety callback, record the Fallout memory, and release the scheduler receipt."
 fallout.event_log.weapons_in_nursery.name: "The Weapons in the Nursery"
 fallout.event_log.weapons_in_nursery.detail: "[GetFalloutEvent513EventLogDetail]"
 fallout.event_log.weapons_in_nursery.central_armory_success: "A central armory kept the former nursery's stock accountable."
 fallout.event_log.weapons_in_nursery.central_armory_partial: "A central armory held the room while its register remained incomplete."
 fallout.event_log.weapons_in_nursery.central_armory_failure: "A failed central armory caused deaths and damaged the state workshop."
 fallout.event_log.weapons_in_nursery.family_registry_success: "Household receipts made the nursery cache visible and shared."
 fallout.event_log.weapons_in_nursery.family_registry_partial: "Household receipts left a private reserve behind the shelves."
 fallout.event_log.weapons_in_nursery.family_registry_failure: "A household register broke the room's supply line and caused deaths."
 fallout.event_log.weapons_in_nursery.militia_custody_success: "A supervised militia guarded the cache without making it private."
 fallout.event_log.weapons_in_nursery.militia_custody_partial: "A militia held the room while civic trust weakened around it."
 fallout.event_log.weapons_in_nursery.militia_custody_failure: "A militia failure caused deaths beside the heating plant."
 fallout.event_log.weapons_in_nursery.disarm_nursery_success: "The cache was dismantled and the former nursery reopened as shelter."
 fallout.event_log.weapons_in_nursery.disarm_nursery_partial: "The dangerous pieces were removed while hidden rifles remained."
 fallout.event_log.weapons_in_nursery.disarm_nursery_failure: "A failed dismantling caused deaths and damaged infrastructure."
 fallout.event_log.weapons_in_nursery.callback_success: "The safety callback confirmed a custody rule that could close."
 fallout.event_log.weapons_in_nursery.callback_partial: "The safety callback left a workable room under a second count."
 fallout.event_log.weapons_in_nursery.callback_failure: "The safety callback found the custody rule had failed again."
