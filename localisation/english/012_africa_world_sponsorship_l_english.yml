l_english:
africa_world_package.20.t: "A Sponsorship Dossier from Africa"
africa_world_package.20.d: "The government of [africa_host.GetNameDef] has sent a formal sponsorship dossier. It names one obligation, one timetable, and one set of safeguards for our sovereign institutions. The offer may strengthen our reconstruction, defence, diplomacy, or public route, but accepting it will bind us to a visible answer before the continental courts."
africa_world_package.20.a: "Accept the sponsorship"
africa_world_package.20.a.tt: "Accept [africa_host.GetNameDef]'s selected sponsorship mode and open its [?constant:africa_world_order.sponsorship_obligation_days|0]-day obligation. Our country remains sovereign and keeps its own institutions."
africa_world_package.20.b: "Negotiate safeguards first"
africa_world_package.20.b.tt: "Ask [africa_host.GetNameDef] to recognise additional safeguards before accepting the sponsorship."
africa_world_package.20.c: "Refuse the dossier"
africa_world_package.20.c.tt: "Remain independent, record the refusal, and leave the package candidate path open without installing sponsorship."

africa_world_package.21.t: "Sponsorship Accepted"
africa_world_package.21.d: "[africa_world_sponsorship_candidate.GetNameDef] has accepted our sponsorship dossier. The package remains a sovereign partner, while its selected obligation now has a public deadline and a recorded duty."
africa_world_package.21.a: "Publish the obligation"
africa_world_package.21.a.tt: "The sponsored partner keeps its sovereign government. Its fulfilment action and deadline are now visible to the courts."

africa_world_package.22.t: "Safeguards on the Sponsorship Dossier"
africa_world_package.22.d: "[africa_world_sponsorship_candidate.GetNameDef] will consider sponsorship only if its safeguards are written into the offer. We can pay the additional political cost, send a final revision for the candidate's answer, or close the dossier."
africa_world_package.22.a: "Accept the safeguards"
africa_world_package.22.a.tt: "Spend the counterterm political cost and send the candidate a final safeguard offer. Acceptance will install the selected sponsorship mode."
africa_world_package.22.b: "Send a final revision"
africa_world_package.22.b.tt: "Let the candidate answer the final safeguard wording before the dossier is closed."
africa_world_package.22.c: "Close the dossier"
africa_world_package.22.c.tt: "End negotiations without installing sponsorship. The candidate remains independent."

africa_world_package.23.t: "Final Safeguards for Sponsorship"
africa_world_package.23.d: "The revised safeguards from [africa_host.GetNameDef] are before the court. They protect our sovereign institutions while leaving the selected sponsorship duty and its public deadline intact."
africa_world_package.23.a: "Accept the revised safeguards"
africa_world_package.23.a.tt: "Accept the safeguards, install the sponsorship package, and open the selected [?constant:africa_world_order.sponsorship_obligation_days|0]-day obligation."
africa_world_package.23.b: "Refuse the revised offer"
africa_world_package.23.b.tt: "Remain independent and close the sponsorship dossier without installing a package."

africa_world_package.24.t: "Diplomatic Sponsorship Fulfilled"
africa_world_package.24.d: "The sponsored government has completed its recognition and mediation duty. The conference record protects its public standing, while the host's obligation ledger closes without changing the partner's sovereignty."
africa_world_package.24.a: "Record the mediation"
africa_world_package.24.a.tt: "Diplomatic sponsorship is fulfilled. Recognition, mediation, and the partner's sovereign standing are recorded."

africa_world_package.25.t: "Material Sponsorship Fulfilled"
africa_world_package.25.d: "The promised equipment, support equipment, and convoys have reached the sponsored government. The existing material ledger has closed the duty and recorded the reconstruction result."
africa_world_package.25.a: "Record the deliveries"
africa_world_package.25.a.tt: "Material sponsorship is fulfilled through the established delivery ledger. Stores are deducted once and the obligation closes."

africa_world_package.26.t: "Military Sponsorship Fulfilled"
africa_world_package.26.d: "The sponsored government has completed its military cooperation duty. Command capacity and deterrence now support its sovereign defence, while the host's promise is closed on the public ledger."
africa_world_package.26.a: "Record the defence compact"
africa_world_package.26.a.tt: "Military sponsorship is fulfilled. The defensive compact remains a sovereign guarantee rather than a subject relationship."

africa_world_package.27.t: "Ideological Sponsorship Fulfilled"
africa_world_package.27.d: "The public congress has concluded under the selected route. The sponsored government keeps its institutions, while the congress record strengthens its legitimacy and capacity and closes the host's obligation."
africa_world_package.27.a: "Publish the congress record"
africa_world_package.27.a.tt: "Ideological sponsorship is fulfilled. The public congress and its sovereign route are recorded."

africa_world_package.28.t: "Sponsorship Obligation Defaulted"
africa_world_package.28.d: "The sponsored government did not complete its selected obligation before the public deadline. Its package has become a rival settlement, and the failure has left a grievance in the host's sponsorship ledger."
africa_world_package.28.a: "Record the default"
africa_world_package.28.a.tt: "The obligation closes as a default. The partner remains independent, but legitimacy and rivalry memories record the breach."

africa_world_package.29.t: "A Defensive Call from the Sponsored Government"
africa_world_package.29.d: "[africa_world_sponsorship_candidate.GetNameDef] has entered a defensive war while its military sponsorship duty is still active. The host can honour the guarantee and close the obligation through cooperation, or contest the call and accept a recorded breach."
africa_world_package.29.a: "Honour the defensive call"
africa_world_package.29.a.tt: "Honour the military guarantee, resolve the active duty, and strengthen the partner's deterrence without subordinating it."
africa_world_package.29.b: "Contest the call"
africa_world_package.29.b.tt: "Decline the defensive call. The military sponsorship defaults, blocks immediate union cooperation, and records a grievance."

africa_world_package.30.t: "The Mediation Table Opens"
africa_world_package.30.d: "The diplomatic sponsorship obligation has reached its mediation stage. [africa_world_sponsorship_candidate.GetNameDef] can conclude a recognition conference under our guarantee, or the host can abandon the table and accept the cost of a default."
africa_world_package.30.a: "Conclude the recognition conference"
africa_world_package.30.a.tt: "Conclude mediation, protect the partner's recognition standing, and fulfil the diplomatic sponsorship duty."
africa_world_package.30.b: "Abandon the table"
africa_world_package.30.b.tt: "End mediation and default the diplomatic sponsorship, increasing rivalry and leaving a memory of failed recognition."

africa_world_package.31.t: "The Public Congress Convenes"
africa_world_package.31.d: "The ideological sponsorship obligation has reached its public congress. The host can hold a plural congress, capture the session at the cost of sovereignty and legitimacy, or cancel the promise and accept a default."
africa_world_package.31.a: "Hold a plural congress"
africa_world_package.31.a.tt: "Complete the ideological duty through a public congress that preserves the partner's sovereign route."
africa_world_package.31.b: "Capture the congress"
africa_world_package.31.b.tt: "Capture the congress, reduce the partner's sovereignty and legitimacy, then close the ideological duty with a recorded grievance."
africa_world_package.31.c: "Cancel the congress"
africa_world_package.31.c.tt: "Cancel the public congress and default the ideological sponsorship, increasing rivalry and sovereignty pressure."

africa_world_choose_diplomatic_sponsorship: "Offer Diplomatic Sponsorship to [FROM.GetNameDef]"
africa_world_choose_diplomatic_sponsorship_desc: "Open a diplomatic sponsorship dossier. Spend political power, promise recognition and mediation, and bind the candidate to a public [?constant:africa_world_order.sponsorship_obligation_days|0]-day duty if it accepts."
africa_world_choose_diplomatic_sponsorship_tt: "The candidate answers independently. Acceptance keeps it sovereign and opens the diplomatic obligation. Negotiation or refusal does not install a package."
africa_world_choose_material_sponsorship: "Offer Material Sponsorship to [FROM.GetNameDef]"
africa_world_choose_material_sponsorship_desc: "Open a material sponsorship dossier. Spend political power and promise the established equipment, support equipment, and convoy delivery if the candidate accepts."
africa_world_choose_material_sponsorship_tt: "The candidate answers independently. Material stockpiles are spent only when the promised shipment is delivered."
africa_world_choose_military_sponsorship: "Offer Military Sponsorship to [FROM.GetNameDef]"
africa_world_choose_military_sponsorship_desc: "Open a military sponsorship dossier. Spend political power and command power, promise a [?constant:africa_world_order.sponsorship_obligation_days|0]-day guarantee and training compact, and keep the candidate sovereign."
africa_world_choose_military_sponsorship_tt: "The candidate answers independently. A defensive call can be honoured or contested without annexation or subject creation."
africa_world_choose_ideological_sponsorship: "Offer Ideological Sponsorship to [FROM.GetNameDef]"
africa_world_choose_ideological_sponsorship_desc: "Open an ideological sponsorship dossier. Spend political power and promise a public congress under the selected route for [?constant:africa_world_order.sponsorship_obligation_days|0] days."
africa_world_choose_ideological_sponsorship_tt: "The candidate answers independently. A plural congress preserves sovereignty, while capture creates a recorded sovereignty grievance."
africa_world_sponsorship_diplomatic_offer_cost: "Requires [?constant:africa_world_sponsorship_mode.diplomatic_offer_pp|0] Political Power"
africa_world_sponsorship_material_offer_cost: "Requires [?constant:africa_world_sponsorship_mode.material_offer_pp|0] Political Power"
africa_world_sponsorship_military_offer_cost: "Requires [?constant:africa_world_sponsorship_mode.military_offer_pp|0] Political Power and [?constant:africa_world_sponsorship_mode.military_offer_command_power|0] Command Power"
africa_world_sponsorship_ideological_offer_cost: "Requires [?constant:africa_world_sponsorship_mode.ideological_offer_pp|0] Political Power"
africa_world_sponsorship_counterterms_cost: "Requires [?constant:africa_world_sponsorship_mode.counterterm_pp_cost|0] Political Power"
africa_world_sponsorship_military_training_cost: "No additional cost"

africa_world_fulfil_diplomatic_sponsorship: "Conclude Diplomatic Sponsorship for [FROM.GetNameDef]"
africa_world_fulfil_diplomatic_sponsorship_desc: "Open the recognition and mediation table for the diplomatic sponsorship duty."
africa_world_fulfil_diplomatic_sponsorship_tt: "Conclude mediation before the [?constant:africa_world_order.sponsorship_obligation_days|0]-day deadline to protect recognition and close the obligation."
africa_world_fulfil_material_sponsorship: "Deliver Material Sponsorship to [FROM.GetNameDef]"
africa_world_fulfil_material_sponsorship_desc: "Deliver the established equipment, support equipment, and convoy package promised to the sponsored government."
africa_world_fulfil_material_sponsorship_tt: "Deliver [?constant:africa_world_order.sponsorship_equipment|0] infantry equipment, [?constant:africa_world_order.sponsorship_support_equipment|0] support equipment, and [?constant:africa_world_order.sponsorship_convoys|0] convoys. These resources are deducted once when the shipment leaves."
africa_world_fulfil_military_sponsorship: "Answer Military Sponsorship for [FROM.GetNameDef]"
africa_world_fulfil_military_sponsorship_desc: "Open the guarantee and training compact for the military sponsorship duty."
africa_world_fulfil_military_sponsorship_tt: "Keep the defensive compact active through the [?constant:africa_world_order.sponsorship_obligation_days|0]-day duty. A defensive call can be honoured or contested."
africa_world_fulfil_ideological_sponsorship: "Convene Ideological Congress for [FROM.GetNameDef]"
africa_world_fulfil_ideological_sponsorship_desc: "Open the public congress promised by the ideological sponsorship dossier."
africa_world_fulfil_ideological_sponsorship_tt: "Conclude a plural congress or record capture before the [?constant:africa_world_order.sponsorship_obligation_days|0]-day deadline."

africa_world_sponsorship_diplomatic_obligation: "Diplomatic Sponsorship Obligation for [FROM.GetNameDef]"
africa_world_sponsorship_diplomatic_obligation_desc: "The sponsored government must complete recognition and mediation before the [?constant:africa_world_order.sponsorship_obligation_days|0]-day public deadline."
africa_world_sponsorship_diplomatic_obligation_timeout: "Diplomatic sponsorship defaults if mediation is not concluded before the deadline."
africa_world_sponsorship_material_obligation: "Material Sponsorship Obligation for [FROM.GetNameDef]"
africa_world_sponsorship_material_obligation_desc: "The sponsored government must receive the established delivery package before the [?constant:africa_world_order.sponsorship_obligation_days|0]-day public deadline."
africa_world_sponsorship_material_obligation_timeout: "Material sponsorship defaults if the established delivery package is not fulfilled before the deadline."
africa_world_sponsorship_military_obligation: "Military Sponsorship Obligation for [FROM.GetNameDef]"
africa_world_sponsorship_military_obligation_desc: "The sponsored government must complete the guarantee and training compact before the [?constant:africa_world_order.sponsorship_obligation_days|0]-day public deadline."
africa_world_sponsorship_military_obligation_timeout: "Military sponsorship defaults if the guarantee and training compact is not fulfilled before the deadline."
africa_world_sponsorship_ideological_obligation: "Ideological Sponsorship Obligation for [FROM.GetNameDef]"
africa_world_sponsorship_ideological_obligation_desc: "The sponsored government must conclude its public congress before the [?constant:africa_world_order.sponsorship_obligation_days|0]-day public deadline."
africa_world_sponsorship_ideological_obligation_timeout: "Ideological sponsorship defaults if the congress is not concluded before the deadline."

africa_world_renegotiate_sponsorship_safeguards: "Renegotiate Sponsorship Safeguards with [FROM.GetNameDef]"
africa_world_renegotiate_sponsorship_safeguards_desc: "Open a final safeguard exchange for the active sponsorship dossier."
africa_world_renegotiate_sponsorship_safeguards_tt: "The candidate receives a final safeguard answer. Acceptance installs the selected mode."
africa_world_close_sponsorship_after_refusal: "Close Sponsorship after Refusal by [FROM.GetNameDef]"
africa_world_close_sponsorship_after_refusal_desc: "Close the refused sponsorship dossier and keep the candidate independent."
africa_world_close_sponsorship_after_refusal_tt: "No sponsorship begins. The refusal remains part of future rivalry and diplomacy."
