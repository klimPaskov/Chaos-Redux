africa_sponsorship_duty_tt_material: "Deliver £infantry_equipment_text_icon §Y[?constant:africa_world_order.sponsorship_equipment|0]§!, £support_equipment_text_icon §Y[?constant:africa_world_order.sponsorship_support_equipment|0]§! and §Y[?constant:africa_world_order.sponsorship_convoys|0]§! convoys. They are deducted once when the shipment leaves."
africa_sponsorship_duty_tt_military: "Keep the defensive compact active through the [?constant:africa_world_order.sponsorship_obligation_days|0]-day duty. A defensive call can be honoured or contested."
