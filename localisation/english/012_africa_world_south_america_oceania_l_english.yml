l_english:

# South American decision contracts
africa_south_america_balance_the_three_regions: "Balance the Three Regions"
africa_south_america_balance_the_three_regions_desc: "Use the public congress to give the Andean, Amazonian, and Plata regions a voice in the settlement. The weakest regional voice receives priority while indigenous representation remains part of the bargain."
africa_south_america_balance_the_three_regions_tt: "The lowest regional voice gains a major step, indigenous representation gains a minor step, and package authority gains a minor step. The founding dispute opens when the congress is unresolved."
africa_south_america_audit_resource_concessions_and_debt: "Audit Concessions and Debt"
africa_south_america_audit_resource_concessions_and_debt_desc: "Publish resource concessions, debt service, ownership claims, and revenue transfers so the continental settlement can bargain over its inherited obligations."
africa_south_america_audit_resource_concessions_and_debt_tt: "Resource sovereignty and debt freedom gain a major step. If indigenous representation remains low, it gains a minor step as well."
africa_south_america_protect_river_forest_and_corridor_rights: "Protect River, Forest, and Corridor Rights"
africa_south_america_protect_river_forest_and_corridor_rights_desc: "Tie river navigation, forest communities, mountain roads, and Atlantic or Pacific corridors to local consent and a common transport reserve."
africa_south_america_protect_river_forest_and_corridor_rights_tt: "Amazon voice and indigenous representation gain major steps. Resource sovereignty gains a minor step, with trains and convoys prepared for the corridor system."

# Oceanian decision contracts
africa_oceania_seat_the_island_congress: "Seat the Island Congress"
africa_oceania_seat_the_island_congress_desc: "Give island governments and indigenous authorities a constitutional voice that does not depend on industrial size or the fleet of a mainland power."
africa_oceania_seat_the_island_congress_tt: "Island representation and indigenous settlement gain major steps. Air network and package legitimacy gain minor steps."
africa_oceania_maintain_convoy_air_and_disaster_networks: "Maintain Convoy, Air, and Disaster Networks"
africa_oceania_maintain_convoy_air_and_disaster_networks_desc: "Coordinate merchant convoys, air relays, repair yards, and disaster stores so a distant island remains connected when a port or runway is lost."
africa_oceania_maintain_convoy_air_and_disaster_networks_tt: "Convoy reach and air network gain major steps. Dispersed industry gains a minor step and convoy stockpiles are prepared."
africa_oceania_settle_land_basing_and_evacuation_rights: "Settle Land, Basing, and Evacuation Rights"
africa_oceania_settle_land_basing_and_evacuation_rights_desc: "Settle land, base leases, evacuation plans, and return rights through local consent before a common fleet can claim island facilities."
africa_oceania_settle_land_basing_and_evacuation_rights_tt: "Indigenous settlement gains a major step. Naval protection and island representation gain minor steps, and island refusal rights are recorded."

# South American founding congress and lifecycle events
africa_world_package.500.t: "The Three Regions Convene"
africa_world_package.500.d: "Andean delegates bring mountain roads and highland supply. Amazonian representatives carry river and forest claims. The Plata governments arrive with port, customs, and Atlantic obligations. Every delegation asks for a voice in the settlement before the ledger becomes a constitution."
africa_world_package.500.a: "Seat the regional boards"
africa_world_package.500.a.tt: "The congress strengthens the least represented region and opens the founding dispute."
africa_world_package.500.b: "Open the concessions ledger"
africa_world_package.500.b.tt: "The congress audits foreign concessions and debt obligations before the founding dispute."
africa_world_package.500.c: "Guarantee river and forest corridors"
africa_world_package.500.c.tt: "The congress protects local corridor rights and prepares a shared transport reserve."
africa_world_package.501.t: "Terms for a South American Settlement"
africa_world_package.501.d: "The first public charter has exposed the hard questions. A region wants reliable routes through another region's territory. Foreign lenders demand old payments. River and forest communities insist that their consent cannot be signed away by a distant capital. The congress must choose how to close the founding dispute."
africa_world_package.501.a: "Sign the three-region charter"
africa_world_package.501.a.tt: "Resolve the founding dispute with a successful charter and remove the founding problem."
africa_world_package.501.b: "Adopt a negotiated compromise"
africa_world_package.501.b.tt: "Resolve the founding dispute through staged guarantees and a smaller authority gain."
africa_world_package.501.c: "Defer the settlement"
africa_world_package.501.c.tt: "The charter fails for now, reducing regional confidence and leaving the founding problem in place."
africa_world_package.502.t: "The Regional Charter Holds"
africa_world_package.502.d: "The Andean, Amazonian, and Plata delegations have accepted a public settlement. Their institutions retain distinct powers while the common ledger records shared obligations, routes, and consent."
africa_world_package.502.a: "Publish the charter"
africa_world_package.502.a.tt: "The founding crisis is resolved successfully. Shared laws can now be ratified."
africa_world_package.503.t: "A Compromise Charter"
africa_world_package.503.d: "The congress has accepted a narrower settlement. The regions will cooperate through staged guarantees, leaving several questions for later review. The compromise is enough to continue, but every institution will remember the clauses left open."
africa_world_package.503.a: "Keep the compromise in force"
africa_world_package.503.a.tt: "The founding crisis is resolved by compromise. Shared laws can now be ratified, with less authority than a full charter."
africa_world_package.504.t: "The Congress Breaks Over Its Ledger"
africa_world_package.504.d: "Delegates have left without a founding settlement. Debt claims, river access, and regional representation remain contested. The package can reopen the talks through its decisions, but the founding problem will continue to weigh on every institution."
africa_world_package.504.a: "Return to bargaining"
africa_world_package.504.a.tt: "The package remains independent and can reopen the founding dispute through a later decision."
africa_world_package.505.t: "Ratification of the Three-Region Laws"
africa_world_package.505.d: "The resource and debt law, the continental corridor command, and the South Atlantic partnership now stand before the regional congress. The final seal requires a proven heartland, resolved constituents, and a founding settlement that the public can recognise."
africa_world_package.505.a: "Ratify the shared lanes"
africa_world_package.505.a.tt: "Record South America's shared-lane proof and open the final sovereign ratification when all common requirements are met."
africa_world_package.505.b: "Send the clauses back to the regions"
africa_world_package.505.b.tt: "Keep the package in route review until constituent and heartland proof is complete."
africa_world_package.506.t: "A South American Ledger in Crisis"
africa_world_package.506.d: "A concession dispute, a weak debt settlement, or a contested corridor has reopened the package's founding problem. Regional delegates are asking whether the common institutions still protect the people and routes they were meant to serve."
africa_world_package.506.a: "Repair the public settlement"
africa_world_package.506.a.tt: "Restore resource and debt confidence through a river, forest, and local-consent settlement."
africa_world_package.506.b: "Use emergency corridor powers"
africa_world_package.506.b.tt: "Strengthen resource control and the Plata corridor while reducing indigenous representation."
africa_world_package.506.c: "Defer the disputed clauses"
africa_world_package.506.c.tt: "Preserve the existing institutions at the cost of authority and legitimacy."

# Oceanian founding congress and lifecycle events
africa_world_package.600.t: "The Island Congress Opens"
africa_world_package.600.d: "Delegates arrive by coastal steamer, cargo flight, and canoe route. Island governments demand votes that cannot be outbid by a mainland treasury. Indigenous authorities bring land and authority claims. Naval planners ask for bases, while disaster coordinators ask for stores that remain available to the communities that fill them."
africa_world_package.600.a: "Seat the island governments"
africa_world_package.600.a.tt: "The congress strengthens island and indigenous representation and opens the founding dispute."
africa_world_package.600.b: "Build the network first"
africa_world_package.600.b.tt: "The congress strengthens convoy, air, and disaster links before the founding dispute."
africa_world_package.600.c: "Settle land and basing rights"
africa_world_package.600.c.tt: "The congress protects local land, base, and evacuation rights before the founding dispute."
africa_world_package.601.t: "Terms for an Ocean Network"
africa_world_package.601.d: "The opening charter has forced every island and mainland delegation to state its terms. A base lease can protect a sea lane while displacing a village. An evacuation plan can save lives while denying a community its return. The congress must decide whether the network will be held together by consent, compromise, or command."
africa_world_package.601.a: "Sign the island charter"
africa_world_package.601.a.tt: "Resolve the founding dispute with a successful island charter and remove the founding problem."
africa_world_package.601.b: "Adopt a staged compromise"
africa_world_package.601.b.tt: "Resolve the founding dispute through staged island guarantees and a smaller authority gain."
africa_world_package.601.c: "Defer the settlement"
africa_world_package.601.c.tt: "The charter fails for now, reducing network confidence and leaving the founding problem in place."
africa_world_package.602.t: "The Island Charter Holds"
africa_world_package.602.d: "The island governments and indigenous authorities have accepted a common charter. Convoys, air relays, and disaster reserves will serve the network while local communities retain the right to refuse land use and base terms."
africa_world_package.602.a: "Publish the island charter"
africa_world_package.602.a.tt: "The founding crisis is resolved successfully. Shared laws can now be ratified."
africa_world_package.603.t: "A Staged Ocean Compromise"
africa_world_package.603.d: "The congress has accepted a narrower settlement. Island representation and land guarantees will be reviewed in stages while the network continues to operate. The compromise allows the sea lanes to open, but its legitimacy depends on the next rounds of consent."
africa_world_package.603.a: "Keep the compromise in force"
africa_world_package.603.a.tt: "The founding crisis is resolved by compromise. Shared laws can now be ratified, with less authority than a full charter."
africa_world_package.604.t: "The Ocean Congress Breaks Over Land and Bases"
africa_world_package.604.d: "The delegations have left without a founding settlement. Land, base leases, evacuation routes, and island votes remain contested. The package can reopen the talks through its decisions, but every convoy and air route will carry the memory of the failed charter."
africa_world_package.604.a: "Return to island bargaining"
africa_world_package.604.a.tt: "The package remains independent and can reopen the founding dispute through a later decision."
africa_world_package.605.t: "Ratification of the Ocean Network Laws"
africa_world_package.605.d: "The ocean constitution, the Pacific defence and disaster reserve, and the Africa Sea treaty now stand before the island congress. The final seal requires a proven heartland, resolved constituents, and a founding settlement that protects local authority."
africa_world_package.605.a: "Ratify the shared lanes"
africa_world_package.605.a.tt: "Record Oceania's shared-lane proof and open the final sovereign ratification when all common requirements are met."
africa_world_package.605.b: "Return the clauses to the islands"
africa_world_package.605.b.tt: "Keep the package in route review until constituent and heartland proof is complete."
africa_world_package.606.t: "An Ocean Network in Crisis"
africa_world_package.606.d: "A convoy shortage, a base dispute, or a failed evacuation plan has reopened the ocean network's founding problem. Island governments are asking whether the shared system still protects their communities or only the routes drawn on naval charts."
africa_world_package.606.a: "Repair the island network"
africa_world_package.606.a.tt: "Restore convoy, land, and disaster confidence through a consent-based settlement."
africa_world_package.606.b: "Use emergency naval powers"
africa_world_package.606.b.tt: "Strengthen naval and air protection while reducing indigenous settlement."
africa_world_package.606.c: "Defer the disputed clauses"
africa_world_package.606.c.tt: "Preserve the existing institutions at the cost of authority and legitimacy."

# Shared focus proof tooltips
africa_south_america_resource_debt_law_proof_tt: "The route-specific resource and debt law records South American proof for the shared-lane ratification."
africa_south_america_defence_corridor_proof_tt: "The route-specific defence and corridor law records South American proof for the shared-lane ratification."
africa_south_america_south_atlantic_partnership_proof_tt: "The South Atlantic partnership records a voluntary treaty proof and opens the regional ratification event."
africa_south_america_ratification_proof_tt: "Ratification requires a successful or compromised founding crisis, all three shared-lane proofs, a balanced regional ledger, a proven heartland, resolved constituents, and the shared package proof."
africa_oceania_constitution_withdrawal_law_proof_tt: "The route-specific ocean constitution records Oceanian proof for the shared-lane ratification."
africa_oceania_pacific_reserve_proof_tt: "The Pacific defence and disaster reserve records Oceanian proof for the shared-lane ratification."
africa_oceania_africa_sea_treaty_proof_tt: "The Africa Sea treaty records a voluntary sea-access proof and opens the island ratification event."
africa_oceania_ratification_proof_tt: "Ratification requires a successful or compromised founding crisis, all three shared-lane proofs, a connected ocean network, a proven heartland, resolved constituents, and the shared package proof."
