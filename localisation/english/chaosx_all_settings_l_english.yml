l_english:
# All Settings window (interface/chaosx_all_settings.gui) and the shared Fallout toggle.
chaosx.all_settings.open: "Show All Settings"
chaosx.all_settings.open.tt: "Open a window that lists every adjustable Chaos Redux setting with its current value."
chaosx.all_settings.title: "All Settings"
chaosx.all_settings.close.tt: "Close"
chaosx.all_settings.hint: "Each control changes the same value as its settings page."
chaosx.all_settings.group.events: "§YAutomatic Events§!"
chaosx.all_settings.group.weights: "§YEvent Weights§!"
chaosx.all_settings.group.chaos: "§YChaos and World End§!"
chaosx.all_settings.group.systems: "§YWorld Systems§!"
chaosx.all_settings.group.countries: "§YCountry Control§!"
chaosx.all_settings.group.audio: "§YSuper-Event Audio§!"
chaosx.all_settings.event_system: "Automatic events"
chaosx.all_settings.event_system.tt: "§YAutomatic Events§!\n\nWhen checked, your country's event timer counts down and fires events. Every player country has its own timer."
chaosx.all_settings.timer_min: "Shortest interval (days)"
chaosx.all_settings.timer_max: "Longest interval (days)"
chaosx.all_settings.timer.tt: "§YEvent Interval§!\n\nYour next automatic event fires after a random number of days between these limits. Rising Chaos shortens the wait. New limits take effect when you press §YApply Interval§!."
chaosx.all_settings.timer.active: "Active interval: §Y[?timer_min_days]§!-§Y[?timer_max_days]§! days"
chaosx.all_settings.timer.apply: "Apply Interval"
chaosx.all_settings.timer_window: "Show event timer window"
chaosx.all_settings.force_trigger: "Force trigger mode"
chaosx.all_settings.recovery: "Minor event recovery rate"
chaosx.all_settings.recovery.tt: "§YMinor Event Recovery Rate§!\n\nHow quickly a repeatable minor event regains its selection weight after it fires."
chaosx.all_settings.recovery.pending: "[GetRecoveryRateValue]"
chaosx.all_settings.recovery.active: "Active: §Y[GetActiveRecoveryRateValue]§!"
chaosx.all_settings.cap_reduction: "Weight cut after firing"
chaosx.all_settings.cap_reduction.tt: "§YWeight Cut After Firing§!\n\nHow much an event's selection weight drops each time it fires."
chaosx.all_settings.cap_reduction.active: "Active: §Y[?global.reduce_cap_factor|.0%]§!"
chaosx.all_settings.major_gain: "Baseline major gain"
chaosx.all_settings.major_gain.tt: "§YBaseline Major Gain§!\n\nHow much weight major events gain each time a minor event fires. The current gain scales with the size of the active event pool."
chaosx.all_settings.major_gain.pending: "[GetMajorWeightPerMinorValue]"
chaosx.all_settings.major_gain.active: "Current: §Y[?global.current_dynamic_major_weight_gain|.0]§!"
chaosx.all_settings.weights.note: "New weights take effect after Apply."
chaosx.all_settings.weights.apply: "Apply Weights"
chaosx.all_settings.weights.reset: "Reset Weights"
chaosx.all_settings.chaos_meter: "Chaos Meter"
chaosx.all_settings.chaos_meter.tt: "§YChaos Meter§!\n\nWhen checked, the global Chaos Meter rises and falls with world events. When unchecked, it stops updating. It cannot be changed after a world-end scenario begins."
chaosx.all_settings.world_end: "World-end scenarios"
chaosx.all_settings.world_end.tt: "§YWorld-End Scenarios§!\n\nWhen checked, a Chaos Meter of 1000 or more lets the state of the world decide which world-end scenario begins. Automatic events then stop for every country."
chaosx.fallout_toggle.label: "Allow Fallout"
chaosx.fallout_toggle.tt: "§YFallout§!\n\nWhen checked, nuclear catastrophes and fully poisoned skies can plunge the world into global Fallout. Once Fallout begins, this setting cannot change."
chaosx.all_settings.air: "Air Cleanliness"
chaosx.all_settings.deaths: "Deaths ledger"
chaosx.all_settings.static_map: "Static winter map"
chaosx.all_settings.chaos_ui_wear: "Chaos cracks"
chaosx.all_settings.auto_enable: "Enable events on tag switch"
chaosx.all_settings.disable_previous: "Disable events for previous tag"
chaosx.all_settings.volume: "Super-event volume"
chaosx.all_settings.volume.tt: "§YSuper-Event Volume§!\n\nVolume multiplier for super-event audio. 0x mutes it."
chaosx.warning.reenable: "Click to Enable"
