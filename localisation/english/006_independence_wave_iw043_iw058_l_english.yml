l_english:
# IW-043/IW-058 country, party, idea, and category localisation
CHU_independence_wave_middle_volga_congress: "Mirsaid Sultan-Galiev"
CHU_independence_wave_middle_volga_congress_desc: "A Tatar revolutionary and advocate of Muslim federal autonomy, Sultan-Galiev chairs the Kazan congress while municipal, labor, national, religious, and river-transport delegates contest its mandate."
CHU_independence_wave_federal_presidium: "Galimzhan Ibrahimov"
CHU_independence_wave_federal_presidium_desc: "Ibrahimov brings the federal chambers a Tatar publicist's insistence on education, equal civic standing, and accountable government among the Volga peoples. The presidium joins river administration to national representation without treating the federation as a single nation."
CHU_independence_wave_bolgar_civic_presidium: "Bolgar Civic Presidium"
CHU_independence_wave_bolgar_civic_presidium_desc: "The constitutional proclamation at Bolgar entrusts a civic presidium with protecting religious jurisdiction, resident equality, and the ordinary law of the republic. Historical memory gives the state a name, while the charter defines its government."
CHU_independence_wave_river_security_directorate: "Luka Semyonovich Spasov"
CHU_independence_wave_river_security_directorate_desc: "A Chuvash ASSR and Middle Volga territorial administrator, Spasov brings state-service and military experience to the emergency security mandate while the congress settles the crossings, river traffic, and civil warrant."
ASY_gallo_shabo: "Gallo Shabo"
ASY_gallo_shabo_desc: "A veteran of the defense of Iwardo, Gallo Shabo lends the provisional council a recognized Assyrian military and community authority while its civil, church, village, and diaspora delegates negotiate a common mandate."
ASY_independence_wave_concordat_council: "Concordat Council"
ASY_independence_wave_concordat_council_desc: "Church delegates and civic commissioners govern through a written division of competence. No single church speaks for every community, and municipal law retains its own protected sphere."
ASY_independence_wave_civic_national_assembly: "Civic National Assembly"
ASY_independence_wave_civic_national_assembly_desc: "Mosul's municipal delegates, community representatives, and civil committees place the public administration under an elected national assembly. Religious institutions retain their guaranteed internal jurisdiction."
ASY_independence_wave_levies_guardianship: "Levies Guardianship"
ASY_independence_wave_levies_guardianship_desc: "A joint board of Levies veterans, guard officers, and civilian commissioners holds emergency authority over the Mosul approaches. Civilian restoration remains part of its written mandate."

iw043_middle_volga_congress_trait: "Mandate of the Middle Volga Congress"
iw043_middle_volga_congress_trait_desc: "The founding delegates can turn disputed authority into a workable civil administration."
iw043_federal_presidium_trait: "Chambers of the Volga Peoples"
iw043_federal_presidium_trait_desc: "Federal representation ties municipal legitimacy to the practical administration of river supply."
iw043_bolgar_civic_presidium_trait: "Memory Bound by Modern Law"
iw043_bolgar_civic_presidium_trait_desc: "The Bolgar proclamation draws strength from historical memory while keeping public authority under a resident-rights constitution."
iw043_river_security_directorate_trait: "Emergency Navigation Mandate"
iw043_river_security_directorate_trait_desc: "The directorate can concentrate the defenses of the river crossings, but emergency administration consumes political authority."
iw058_provisional_national_council_trait: "Council of the Mosul Quarter"
iw058_provisional_national_council_trait_desc: "The provisional council coordinates the city's civil offices and the supply of its exposed approaches."
iw058_concordat_council_trait: "Jurisdictions in Concordat"
iw058_concordat_council_trait_desc: "Written limits between church and civic authority give each institution a secure place in public life."
iw058_civic_national_assembly_trait: "Municipal Mandate"
iw058_civic_national_assembly_trait_desc: "An accountable assembly directs reconstruction through the civil service and the municipalities."
iw058_levies_guardianship_trait: "Guardians of the Mosul Approaches"
iw058_levies_guardianship_trait_desc: "The guardianship organizes a strong defensive command while the burden of emergency rule weighs on civilian confidence."

independence_wave_iw043_congress_in_session_idea: "Congress in Session"
independence_wave_iw043_congress_in_session_idea_desc: "The Middle Volga Congress keeps rival delegates at one table, though every provisional decree must survive a difficult chamber and an uncertain civil service."
independence_wave_iw043_federal_charter_idea: "Federal Charter of the Volga Peoples"
independence_wave_iw043_federal_charter_idea_desc: "Municipal and national chambers share authority under a charter of equal citizenship, language guarantees, and negotiated federal competence."
independence_wave_iw043_bolgar_constitution_idea: "The Bolgar Constitution"
independence_wave_iw043_bolgar_constitution_idea_desc: "Bolgar history and Islamic institutions have a protected place in a modern republic whose civic guarantees extend to every resident."
independence_wave_iw043_emergency_navigation_council_idea: "Emergency Navigation Council"
independence_wave_iw043_emergency_navigation_council_idea_desc: "River Guard officers and navigation commissioners can mobilize the Kazan crossings quickly, but the congress pays for every extension of emergency authority."
independence_wave_iw043_disrupted_river_economy_idea: "Disrupted River Economy"
independence_wave_iw043_disrupted_river_economy_idea_desc: "Idle barges, divided railway accounts, and insecure crossings leave Kazan short of goods and burden every attempt to supply the new state."
independence_wave_iw043_reopened_river_economy_idea: "The River Reopened"
independence_wave_iw043_reopened_river_economy_idea_desc: "A common navigation schedule and repaired river-rail links move food, fuel, and workshop goods through the Middle Volga again."
independence_wave_iw043_provisional_river_guard_idea: "Provisional River Guard"
independence_wave_iw043_provisional_river_guard_idea_desc: "The founding guard can defend bridges and depots, but its emergency recruitment and divided command remain costly."
independence_wave_iw043_civilian_river_guard_idea: "River Guard Under Civilian Law"
independence_wave_iw043_civilian_river_guard_idea_desc: "The River Guard serves a defined territorial mandate under congress oversight, with its mobilization and accounts subject to ordinary law."
independence_wave_iw043_emergency_river_guard_idea: "River Guard Emergency Mandate"
independence_wave_iw043_emergency_river_guard_idea_desc: "The River Guard receives broad authority to hold the crossings during a tracked crisis. Its mobilization strains the civil administration and cannot become a permanent settlement."

independence_wave_iw058_provisional_council_idea: "Provisional National Council"
independence_wave_iw058_provisional_council_idea_desc: "The council keeps Mosul's community delegations and civil offices in session while the boundaries of public, municipal, and church authority remain under negotiation."
independence_wave_iw058_concordat_charter_idea: "Concordat Charter"
independence_wave_iw058_concordat_charter_idea_desc: "Church institutions and civic chambers govern through distinct jurisdictions and reciprocal guarantees, without assigning one church authority over every community."
independence_wave_iw058_civic_charter_idea: "Civic Assembly Charter"
independence_wave_iw058_civic_charter_idea_desc: "The elected assembly directs the state through municipal law, an accountable civil service, and protected community institutions."
independence_wave_iw058_levies_guardianship_idea: "Levies Guardianship"
independence_wave_iw058_levies_guardianship_idea_desc: "The guardianship concentrates defensive authority around Mosul during a severe crisis. Civilian government must be restored before a lasting settlement can be ratified."
independence_wave_iw058_mesopotamian_federal_settlement_idea: "Mesopotamian Federal Settlement"
independence_wave_iw058_mesopotamian_federal_settlement_idea_desc: "Member governments share river, transit, revenue, and defense institutions while retaining their accepted civic, language, and religious guarantees."
independence_wave_iw058_sovereign_autonomy_compact_idea: "Sovereign Autonomy Compact"
independence_wave_iw058_sovereign_autonomy_compact_idea_desc: "A recognized boundary, protected transit, community guarantees, and a balanced external treaty secure Assyrian sovereignty without subject status."
independence_wave_iw058_exposed_mosul_corridor_idea: "Exposed Mosul Corridor"
independence_wave_iw058_exposed_mosul_corridor_idea_desc: "The roads and river approaches beyond the council quarter remain vulnerable, raising the cost of supply and weakening the defense of Mosul."
independence_wave_iw058_secured_mosul_corridor_idea: "Secured Mosul Corridor"
independence_wave_iw058_secured_mosul_corridor_idea_desc: "Patrol agreements, repaired approaches, and a disciplined territorial guard keep Mosul connected without turning corridor security into a claim on the wider region."
independence_wave_iw058_fragile_diaspora_links_idea: "Fragile Diaspora Links"
independence_wave_iw058_fragile_diaspora_links_idea_desc: "Letters, remittances, and political appeals cross several borders, but the council lacks a reliable office to turn distant support into lawful state capacity."
independence_wave_iw058_diaspora_liaison_idea: "Diaspora Liaison Service"
independence_wave_iw058_diaspora_liaison_idea_desc: "A civilian liaison service coordinates experts, remittances, and recognition work while keeping foreign assistance on transparent terms."

