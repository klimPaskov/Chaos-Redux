independence_wave_iw043_middle_volga_congress_category: "The Middle Volga Congress"
independence_wave_iw043_middle_volga_congress_category_desc: "The congress must keep the Volga open while it decides who speaks for Kazan, Cheboksary, and the wider river country.\n\nCongress Authority: §Y[?iw043_congress_authority|0]§!\nRights Compact: §Y[?iw043_rights_compact|0]§!\nRiver Control: §Y[?iw043_river_control|0]§!\nCoalition Balance: §Y[?iw043_coalition_balance|0]§!\n\nA lower coalition balance favors the constitutional restoration current. A higher balance favors the federal current."
