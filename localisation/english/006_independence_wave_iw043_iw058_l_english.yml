independence_wave_iw058_council_of_communities_category: "The Council of Communities"
independence_wave_iw058_council_of_communities_category_desc: "The provisional council protects Mosul by joining church, civic, village, diaspora, and veteran institutions under civilian law. Each self-identification guarantee remains a separate public promise.\n\nCouncil Cohesion: §Y[?iw058_council_cohesion|0]§!\nCommunity Guarantees: §Y[?iw058_community_guarantee_count|0]§! of §Y4§!\nCorridor Security: §Y[?iw058_corridor_security|0]§!\nExternal Guarantee Credibility: §Y[?iw058_external_guarantee_credibility|0]§!\nChurch and Secular Balance: §Y[?iw058_church_secular_balance|0]§!\n\nA lower church and secular balance favors a church-civic compact. A higher balance favors a civic national assembly."
