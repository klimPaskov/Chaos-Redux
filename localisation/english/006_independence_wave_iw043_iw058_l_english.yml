independence_wave_iw058_cost_reconciliation_tooltip: "£command_power  §Y20§!  £manpower_texticon  §Y5,000§!  £civ_factory  §Y2§!"

# IW-058 decisions and missions
independence_wave_iw058_secure_mosul_council_quarter: "Secure the Mosul Council Quarter"
independence_wave_iw058_secure_mosul_council_quarter_desc: "Commit the Mosul Civic Guard and equipment to protect the provisional council quarter. The assigned formation returns to normal duty when the mission ends or the provisional government is dissolved."
independence_wave_iw058_secure_mosul_council_quarter_start_tt: "The Civic Guard holds the council quarter for §Y120 days§!. The equipment is spent immediately."
independence_wave_iw058_secure_mosul_council_quarter_success_tt: "The anchor is secured. §YCouncil Cohesion§! increases by §G15§! and §YCorridor Security§! increases by §G20§!."
independence_wave_iw058_secure_mosul_council_quarter_timeout_tt: "The council quarter remains exposed. §YCouncil Cohesion§! and §YCorridor Security§! each decrease by §R10§!, and a corridor incident opens."
independence_wave_iw058_secure_mosul_council_quarter_cancel_tt: "The Civic Guard is released. The anchor crisis worsens, and the committed equipment remains spent."

independence_wave_iw058_enumerate_council_seats: "Enumerate Council Seats"
independence_wave_iw058_enumerate_council_seats_desc: "Assign clerks and a civilian office to seat church, secular, village and municipal, and Levies-veteran institutions. Every institution remains represented even when one constitutional current gains influence."
independence_wave_iw058_enumerate_council_seats_start_tt: "The seat commission works for §Y150 days§!. The administrative commitment is spent immediately."
independence_wave_iw058_enumerate_council_seats_success_tt: "The institution seats are ready and §YCouncil Cohesion§! increases by §G15§!."
independence_wave_iw058_enumerate_council_seats_timeout_tt: "The seat commission deadlocks. §YCouncil Cohesion§! decreases by §R15§!."
independence_wave_iw058_enumerate_council_seats_cancel_tt: "The seat commission is cancelled. The deadlock remains, and the committed resources remain spent."

independence_wave_iw058_ratify_assyrian_self_identification: "Ratify Assyrian Self-Identification"
independence_wave_iw058_ratify_assyrian_self_identification_desc: "Vote on an Assyrian self-identification guarantee with national-council representation and petition rights. This settlement does not define another person's identity."
independence_wave_iw058_ratify_chaldean_self_identification: "Ratify Chaldean Self-Identification"
independence_wave_iw058_ratify_chaldean_self_identification_desc: "Vote on a Chaldean self-identification guarantee with church and municipal petition rights. It remains separate from national and language institutions."
independence_wave_iw058_ratify_syriac_self_identification: "Ratify Syriac Self-Identification"
independence_wave_iw058_ratify_syriac_self_identification_desc: "Vote on a Syriac self-identification guarantee with language, school, and civic petition rights. It remains separate from church office."
independence_wave_iw058_ratify_aramean_self_identification: "Ratify Aramean Self-Identification"
independence_wave_iw058_ratify_aramean_self_identification_desc: "Vote on an Aramean self-identification guarantee with civic self-description and municipal petition rights. Each resident chooses whether the label describes them."

independence_wave_iw058_settle_church_civil_competence: "Settle Church and Civil Competence"
independence_wave_iw058_settle_church_civil_competence_desc: "Define church competence, public civil law, and personal identity as separate constitutional questions. All institution families must remain seated while the commission works."
independence_wave_iw058_settle_church_civil_competence_start_tt: "The competence commission sits for §Y180 days§!. The administrative commitment is spent immediately."
independence_wave_iw058_settle_church_civil_competence_success_tt: "The council may ratify a church-civic or civic-law settlement."
independence_wave_iw058_settle_church_civil_competence_timeout_tt: "The commission breaks into a church-civic crisis. §YCouncil Cohesion§! decreases by §R10§!."
independence_wave_iw058_settle_church_civil_competence_cancel_tt: "The competence commission is dissolved. The crisis remains, and the committed resources remain spent."

independence_wave_iw058_open_diaspora_expert_mission: "Open a Diaspora Expert Mission with [FROM.GetNameDef]"
independence_wave_iw058_open_diaspora_expert_mission_desc: "Commit convoys and civilian capacity to bring experts and remittance accounting from [FROM.GetNameDef] into public service. They serve through the bureau rather than entering the cabinet or supplementing military stockpiles."
independence_wave_iw058_open_diaspora_expert_mission_start_tt: "The selected mission continues for §Y150 days§!. The convoy and command commitment is spent immediately."
independence_wave_iw058_open_diaspora_expert_mission_success_tt: "The experts and remittance accounts reach Mosul from the selected partner, and their public role comes before the council."
independence_wave_iw058_open_diaspora_expert_mission_timeout_tt: "The mission fails. Foreign suspicion rises and §YExternal Guarantee Credibility§! decreases by §R5§!."
independence_wave_iw058_open_diaspora_expert_mission_cancel_tt: "The expert mission is cancelled. The committed convoys remain spent."

independence_wave_iw058_discipline_levies_under_civilian_law: "Discipline the Levies under Civilian Law"
independence_wave_iw058_discipline_levies_under_civilian_law_desc: "Convert the existing Assyrian Levies detachment under a recorded civilian board. The mission consumes manpower and equipment and never creates a replacement formation."
independence_wave_iw058_discipline_levies_under_civilian_law_start_tt: "The existing detachment begins a §Y150 day§! conversion under civilian command."
independence_wave_iw058_discipline_levies_under_civilian_law_success_tt: "Civilian command is recorded. §YCouncil Cohesion§! and §YCorridor Security§! each increase by §G10§!."
independence_wave_iw058_discipline_levies_under_civilian_law_timeout_tt: "The conversion fails and emergency pressure rises. §YCouncil Cohesion§! decreases by §R10§!."
independence_wave_iw058_discipline_levies_under_civilian_law_cancel_tt: "The conversion ends without a replacement unit. Guardianship pressure rises, and the committed resources remain spent."

independence_wave_iw058_patrol_nineveh_approaches: "Patrol the Nineveh Approaches"
independence_wave_iw058_patrol_nineveh_approaches_desc: "Bind a supplied guard formation to patrol the roads and river crossings around the Mosul anchor. The action claims no remote state and releases the formation on every exit."
independence_wave_iw058_patrol_nineveh_approaches_start_tt: "The patrol operates for §Y120 days§!. The equipment and command commitment is spent immediately."
independence_wave_iw058_patrol_nineveh_approaches_success_tt: "The approaches are patrolled. §YCorridor Security§! increases by §G20§! and §YCouncil Cohesion§! increases by §G5§!."
independence_wave_iw058_patrol_nineveh_approaches_timeout_tt: "The patrol cannot hold the approaches. §YCorridor Security§! decreases by §R10§!, and a corridor incident opens."
independence_wave_iw058_patrol_nineveh_approaches_cancel_tt: "The patrol formation is released. The anchor crisis remains, and the committed resources remain spent."

independence_wave_iw058_fortify_mountain_river_corridor_start_tt: "Construction and route security continue for §Y180 days§!. The material commitment is spent immediately."
independence_wave_iw058_fortify_mountain_river_corridor_success_tt: "Mosul gains one land fort and one infrastructure level. §YCorridor Security§! increases by §G25§!."
independence_wave_iw058_fortify_mountain_river_corridor_timeout_tt: "The works at Mosul remain partial, no construction spreads beyond the controlled corridor, and §YCorridor Security§! decreases by §R5§!."
independence_wave_iw058_fortify_mountain_river_corridor_cancel_tt: "The formation is released and the construction burden remains. The committed resources remain spent."

independence_wave_iw058_request_named_external_guarantee: "Request a Named External Guarantee from [FROM.GetNameDef]"
independence_wave_iw058_request_named_external_guarantee_desc: "Ask [FROM.GetNameDef] for a public guarantee. The resulting settlement weighs credible protection against patron leverage."
independence_wave_iw058_request_named_external_guarantee_start_tt: "The named approach continues for §Y150 days§!. The convoy and command commitment is spent immediately."
independence_wave_iw058_request_named_external_guarantee_success_tt: "The guarantor presents conditions to the council."
independence_wave_iw058_request_named_external_guarantee_timeout_tt: "The approach fails. §YExternal Guarantee Credibility§! decreases by §R10§!."
independence_wave_iw058_request_named_external_guarantee_cancel_tt: "The approach is cancelled. The committed transport remains spent."

independence_wave_iw058_negotiate_former_host_security_settlement: "Negotiate a Former-Host Security Settlement"
independence_wave_iw058_negotiate_former_host_security_settlement_desc: "Negotiate directly with the former host over the Mosul boundary, return and protection, church-civil jurisdiction, transit and property, and security terms. The compact may not create subject or client status."
independence_wave_iw058_negotiate_former_host_security_settlement_start_tt: "The former-host talks continue for §Y180 days§!. The administrative commitment is spent immediately."
independence_wave_iw058_negotiate_former_host_security_settlement_success_tt: "The treaty records are completed. §YExternal Guarantee Credibility§! increases by §G20§! and §YCorridor Security§! increases by §G10§!."
independence_wave_iw058_negotiate_former_host_security_settlement_timeout_tt: "The former host issues an ultimatum, and the reclamation crisis begins."
independence_wave_iw058_negotiate_former_host_security_settlement_cancel_tt: "The talks fail and the former host issues an ultimatum. The committed resources remain spent."

independence_wave_iw058_survive_reclamation_crisis: "Survive the Reclamation Crisis"
independence_wave_iw058_survive_reclamation_crisis_desc: "Hold sovereign control of Mosul for the full crisis while the former host remains at peace with us. A full stand-down establishes that the council survived the reclamation claim."
independence_wave_iw058_survive_reclamation_crisis_start_tt: "The council commits equipment and command authority to a §Y180 day§! stand-down. The commitment is spent immediately."
independence_wave_iw058_survive_reclamation_crisis_success_tt: "The former host stands down. §YCouncil Cohesion§! and §YExternal Guarantee Credibility§! each increase by §G15§!."
independence_wave_iw058_survive_reclamation_crisis_timeout_tt: "The crisis escalates. §YCorridor Security§! decreases by §R15§!, and the former host's reclamation claim remains unresolved."
independence_wave_iw058_survive_reclamation_crisis_cancel_tt: "The defense collapses before a stand-down. Severe security pressure remains, and the committed resources are lost."

independence_wave_iw058_hold_form18_federal_congress: "Hold the Mesopotamian Federal Congress"
independence_wave_iw058_hold_form18_federal_congress_desc: "Invite the eligible Mesopotamian corridor governments to a synchronized federal congress. The settlement requires at least two consenting sovereign members with two unique controlled anchors, all four community guarantees, civilian command, a river authority, and ratified capital-and-revenue terms."
independence_wave_iw058_form18_pre_congress_method_policy_tt: "Use the negotiated federation method, or prove a defensive settlement: win the former-host defensive war, remain sovereign in Mosul, and secure the fortified corridor."
independence_wave_iw058_hold_form18_federal_congress_start_tt: "The federal congress sits for §Y180 days§!. The administrative commitment is spent immediately."
independence_wave_iw058_hold_form18_federal_congress_success_tt: "The accepted federal consents remain valid, and the Mesopotamian settlement is presented."
independence_wave_iw058_hold_form18_federal_congress_timeout_tt: "The consent margin fails. §YCouncil Cohesion§! decreases by §R15§! and §YExternal Guarantee Credibility§! decreases by §R10§!."
independence_wave_iw058_hold_form18_federal_congress_cancel_tt: "The congress ends without formation. The committed resources remain spent."

independence_wave_iw058_ratify_sovereign_autonomy_compact: "Ratify a Sovereign Autonomy Compact"
independence_wave_iw058_ratify_sovereign_autonomy_compact_desc: "Ratify a treaty-backed Mesopotamian autonomy settlement with the former host or a sovereignty-bound regional guarantor. Church-civil jurisdiction must already be settled. The compact confirms the boundary, protection and return, transit and property, and security records. It preserves sovereignty and creates no client relationship."
independence_wave_iw058_ratify_sovereign_autonomy_compact_start_tt: "The autonomy compact remains before the chosen treaty partner for §Y180 days§!. The counterpart is locked for the duration, and the administrative commitment is spent immediately."
independence_wave_iw058_ratify_sovereign_autonomy_compact_success_tt: "The chosen partner signs every treaty chapter. The sovereign autonomy compact is placed before the national council for final ratification."
independence_wave_iw058_ratify_sovereign_autonomy_compact_timeout_tt: "The compact fails. Treaty pressure rises and §YExternal Guarantee Credibility§! decreases by §R10§!."
independence_wave_iw058_ratify_sovereign_autonomy_compact_cancel_tt: "The compact is cancelled. The committed resources remain spent."

independence_wave_iw058_reopen_community_guarantee: "Reopen a Community Guarantee"
independence_wave_iw058_reopen_community_guarantee_desc: "Reopen the first rejected self-identification guarantee whose single reconciliation attempt remains unused. A forced-relabelling or protection-breach record permanently closes this action."
independence_wave_iw058_reopen_community_guarantee_start_tt: "A guarantee reconciliation begins for §Y180 days§!. The full administrative commitment is spent immediately."
independence_wave_iw058_reopen_community_guarantee_success_tt: "The selected guarantee returns to the council for its own political settlement."
independence_wave_iw058_reopen_community_guarantee_timeout_tt: "The reconciliation fails before a vote. This guarantee cannot be reopened again, and the committed resources remain spent."
independence_wave_iw058_reopen_community_guarantee_cancel_tt: "The reconciliation is cancelled. This guarantee cannot be reopened again, and the committed resources remain spent."

independence_wave_iw043_register_form12_member_charters: "Register the Volga-Ural Member Charters"
independence_wave_iw043_register_form12_member_charters_desc: "Register each consenting government's autonomy, language administration, anchor, and accession receipt while preserving its government and sovereignty."
independence_wave_iw043_register_form12_member_charters_success_tt: "Every consenting founding member completes the first constitutional integration stage while remaining sovereign."
independence_wave_iw043_coordinate_form12_river_defense: "Coordinate the Federal River Defense"
independence_wave_iw043_coordinate_form12_river_defense_desc: "Coordinate ferries, rail links, river patrols, and civilian defense commands across the registered members. This final initial stage transfers no states and creates no subjects."
independence_wave_iw043_coordinate_form12_river_defense_success_tt: "The founding members complete the required initial river-defense integration."

independence_wave_iw043_register_form13_member_compacts: "Register the Idel-Ural Member Compacts"
independence_wave_iw043_register_form13_member_compacts_desc: "Record the religious-civic settlement, cultural autonomy, sovereign anchor, and explicit consent of each founding member without replacing its government."
independence_wave_iw043_register_form13_member_compacts_success_tt: "Every consenting founding member completes the first compact integration stage while remaining sovereign."
independence_wave_iw043_coordinate_form13_river_defense: "Coordinate the Compact River Defense"
independence_wave_iw043_coordinate_form13_river_defense_desc: "Bind civilian river-guard standards and transit schedules across the registered compacts. No country is annexed and no blanket cores are granted."
independence_wave_iw043_coordinate_form13_river_defense_success_tt: "The founding members complete the required initial river-defense integration."

independence_wave_iw058_register_form18_member_charters: "Register the Mesopotamian Member Charters"
independence_wave_iw058_register_form18_member_charters_desc: "Register autonomy, minority guarantees, sovereign anchors, and explicit consent for every founding member while preserving each government's institutions and sovereignty."
independence_wave_iw058_register_form18_member_charters_success_tt: "Every consenting member completes the first constitutional stage, allowing the federal settlement to be presented."
independence_wave_iw058_coordinate_form18_defense_and_revenue: "Coordinate Defense and Federal Revenue"
independence_wave_iw058_coordinate_form18_defense_and_revenue_desc: "Coordinate civilian member forces, corridor security, and the agreed revenue schedule without creating client status or an unaccountable standing force."
independence_wave_iw058_coordinate_form18_defense_and_revenue_success_tt: "The founding members complete the required initial defense-and-revenue integration."
# IW-043/IW-058 incident events
# IW-043 incidents
chaosx.nr006.4301.t: "The Middle Volga Congress Assembles"
chaosx.nr006.4301.desc: "Delegates arrive in Kazan from municipal councils, national organizations, religious bodies, workshops, rail offices, ferry stations, and the river guard. They have assembled a modern emergency congress with authority grounded in a navigable Volga, civilian command, and a rights compact residents can trust."
chaosx.nr006.4301.a: "Open the congress under the Kazan mandate."
chaosx.nr006.4301.a.tt: "The §YMiddle Volga Congress§! decision category opens with its founding authority intact."

chaosx.nr006.4302.t: "Who Speaks for the River Cities"
chaosx.nr006.4302.desc: "The verified delegates agree that Kazan cannot govern the river country by declaration alone. One proposal gives national and civic chambers equal standing. Another gives historic delegations a stronger first voice while keeping municipal representatives inside the constitution."
chaosx.nr006.4302.a: "Seat equal national and civic chambers."
chaosx.nr006.4302.a.tt: "The parity formula strengthens the federal coalition. §YCoalition Balance§! increases by §G10§! and §YCongress Authority§! increases by §G5§!."
chaosx.nr006.4302.b: "Begin with the historic delegations."
chaosx.nr006.4302.b.tt: "The historic-delegation formula strengthens the restoration coalition. §YCoalition Balance§! decreases by §G10§! and §YCongress Authority§! increases by §G10§!."
chaosx.nr006.4302.tatar.t: "Tatar and Bashkir Seats Before the Congress"
chaosx.nr006.4302.tatar.desc: "Tatar and Bashkir delegates demand a representation formula that recognizes their distinct institutions without turning either delegation into an ornament. The vote sets public seats and leaves personal identity to each resident."
chaosx.nr006.4302.tatar.a: "Guarantee parity within the chamber of peoples."
chaosx.nr006.4302.tatar.a.tt: "Ratifies §YTatar and Bashkir Representation§!, strengthens the federal coalition, and keeps the allocated resources committed."
chaosx.nr006.4302.tatar.b: "Guarantee distinct historic delegations."
chaosx.nr006.4302.tatar.b.tt: "Ratifies §YTatar and Bashkir Representation§!, strengthens the restoration coalition, and keeps the allocated resources committed."
chaosx.nr006.4302.tatar.c: "The congress will not reserve these seats."
chaosx.nr006.4302.tatar.c.tt: "Rejects the clause, leaves the allocated resources spent, and blocks both constitutional settlements until a successful reconciliation."
chaosx.nr006.4302.resident.t: "Equal Standing for Every Resident"
chaosx.nr006.4302.resident.desc: "Delegates outside the principal national and religious bodies ask the congress to protect equal civic standing, public petition, and freedom of religious practice. Their clause preserves named national rights while preventing them from becoming an exclusionary test of residence."
chaosx.nr006.4302.resident.a: "Guarantee civic and religious equality."
chaosx.nr006.4302.resident.a.tt: "Ratifies §YResident Civic and Religious Equality§! and keeps the allocated resources committed."
chaosx.nr006.4302.resident.b: "Keep equality outside the constitutional compact."
chaosx.nr006.4302.resident.b.tt: "Rejects the clause, raises emergency influence, and blocks both constitutional settlements until reconciliation. The allocated resources remain spent."

chaosx.nr006.4303.t: "Cheboksary Demands a Municipal Guarantee"
chaosx.nr006.4303.desc: "The Chuvash delegation demands protected municipal administration for Cheboksary, a voice in ferry and customs policy, and consent before deeper integration. The congress may accept direct municipal autonomy, write the guarantee through a treaty administration, or choose confrontation."
chaosx.nr006.4303.a: "Guarantee Chuvash municipal autonomy in the charter."
chaosx.nr006.4303.a.tt: "Ratifies §YChuvash Municipal Autonomy§!, records Cheboksary's municipal consent, and strengthens federal cooperation."
chaosx.nr006.4303.b: "Write the guarantee through a Cheboksary treaty."
chaosx.nr006.4303.b.tt: "Ratifies §YChuvash Municipal Autonomy§! through treaty administration and secures transit without automatic annexation."
chaosx.nr006.4303.c: "Kazan will dictate the ferry terms."
chaosx.nr006.4303.c.tt: "Rejects the clause, opens confrontation with Cheboksary, and leaves the paid commitment spent."

chaosx.nr006.4304.t: "Languages of the Congress"
chaosx.nr006.4304.desc: "Mari and Udmurt delegates ask for language rights in schools, municipal filings, and public petitions. A full administrative guarantee places a heavier burden on the young congress. A local petition model costs less authority but gives the center greater control over administration."
chaosx.nr006.4304.a: "Fund full language administration."
chaosx.nr006.4304.a.tt: "Ratifies §YMari and Udmurt Language Rights§!, strengthens the federal coalition, and reduces §YCongress Authority§! by §R10§! while the administration is established."
chaosx.nr006.4304.b: "Guarantee schools and local petition rights."
chaosx.nr006.4304.b.tt: "Ratifies §YMari and Udmurt Language Rights§! through a local model and reduces §YCongress Authority§! by §R5§!."
chaosx.nr006.4304.c: "One administrative language is enough."
chaosx.nr006.4304.c.tt: "Rejects the language-rights clause, leaves the allocated resources spent, and blocks both constitutional settlements until reconciliation."

chaosx.nr006.4305.t: "The Muftiate and the Civic Courts"
chaosx.nr006.4305.desc: "The Muftiate asks for authority over defined religious and personal matters. Civic delegates insist that criminal law, taxation, residence, public office, and constitutional rights must remain under public courts. Neither settlement can allow religious affiliation to determine civic equality."
chaosx.nr006.4305.a: "Public jurisdiction belongs to the civic courts."
chaosx.nr006.4305.a.tt: "Completes the religious-civic settlement with public-law primacy. §YCongress Authority§! and the federal coalition each gain §G10§!."
chaosx.nr006.4305.b: "Define a limited personal competence for the Muftiate."
chaosx.nr006.4305.b.tt: "Completes the religious-civic settlement with a delimited Muftiate competence. §YCongress Authority§! gains §G15§! and the restoration coalition gains strength."
chaosx.nr006.4305.c: "Return the unresolved draft to committee."
chaosx.nr006.4305.c.tt: "The jurisdiction crisis remains unresolved and §YCongress Authority§! decreases by §R10§!."

chaosx.nr006.4306.t: "Barges Held Below Kazan"
chaosx.nr006.4306.desc: "Barges wait below Kazan while ferry crews, customs clerks, and armed patrols dispute passage. The congress can escort a civilian convoy, accept a temporary trade compromise, or ask the former host to reopen negotiations. Each choice protects a different part of the river settlement."
chaosx.nr006.4306.a: "Order a civilian convoy under the river guard."
chaosx.nr006.4306.a.tt: "The guard restores passage under civilian law. §YRiver Control§! increases by §G10§! and §YCongress Authority§! decreases by §R5§!."
chaosx.nr006.4306.b: "Accept a temporary customs compromise."
chaosx.nr006.4306.b.tt: "The barges move under a limited agreement. §YRiver Control§! increases by §G5§! and §YCongress Authority§! decreases by §R5§!."
chaosx.nr006.4306.c: "Ask the former host to reopen transit talks."
chaosx.nr006.4306.c.tt: "The congress seeks former-host mediation. §YCongress Authority§! decreases by §R10§! and host claim pressure rises."

chaosx.nr006.4307.t: "The Guard Demands Temporary Authority"
chaosx.nr006.4307.desc: "Guard officers argue that a divided congress cannot protect the ferries, workshops, and Kazan approaches. They ask for a temporary navigation council with broad security authority. The proposal can suspend a chosen constitutional route while completed rights clauses and later civilian restoration remain protected."
chaosx.nr006.4307.a: "Authorize the Emergency Navigation Council."
chaosx.nr006.4307.a.tt: "Temporarily suspends the constitutional surface and grants strong river defense. Completed route and rights records remain intact for civilian restoration."
chaosx.nr006.4307.b: "The guard remains under civilian law."
chaosx.nr006.4307.b.tt: "Refuses emergency rule. §YCongress Authority§! increases by §G10§!, while §YRiver Control§! decreases by §R10§!."

chaosx.nr006.4308.t: "A Chamber of Peoples"
chaosx.nr006.4308.desc: "The congress adopts a bicameral settlement in which common river policy belongs to a federal chamber and protected national, municipal, and language rights belong to a chamber of peoples. Kazan remains the working center, but member institutions enter by charter rather than absorption."
chaosx.nr006.4308.a: "Ratify the modern Volga federation."
chaosx.nr006.4308.a.tt: "Locks the §YFederal Route§!, completes the chamber settlements, applies the federal institutional surface, and strengthens the federal coalition."

chaosx.nr006.4309.t: "Bolgar Memory, Modern Law"
chaosx.nr006.4309.desc: "The congress invokes Bolgar history as civic memory. Its constitution binds historical and Islamic institutions to elected public law, the rights compact, and equal civic standing for non-Tatar and non-Muslim residents."
chaosx.nr006.4309.a: "Proclaim a constitutional Volga Bulgaria."
chaosx.nr006.4309.a.tt: "Locks the §YRestoration Route§!, adopts modern Bolgar constitutional memory, applies its institutional surface, and strengthens the restoration coalition."

chaosx.nr006.4310.t: "The Volga Chooses Its Charter"
chaosx.nr006.4310.desc: "The congress places its completed charter before the river cities. The rights compact and civilian institutions determine whether the proclamation carries constitutional authority. Any wider Volga-Ural federation still requires consenting member governments and completed settlement terms."
chaosx.nr006.4310.a: "Present the federal charter to the river cities."
chaosx.nr006.4310.a.tt: "Proclaims the federal charter and proceeds toward a wider Volga-Ural federation only when the accepted member and settlement terms are ready."
chaosx.nr006.4310.b: "Present the Volga Bulgaria constitution."
chaosx.nr006.4310.b.tt: "Proclaims the Bolgar constitutional settlement and proceeds toward an Idel-Ural compact only when the accepted member and settlement terms are ready."

# IW-058 incidents
chaosx.nr006.5801.t: "The Mosul Council Convenes"
chaosx.nr006.5801.desc: "Church delegates, secular activists, village and municipal representatives, diaspora liaisons, and Levies veterans meet in the Mosul council quarter. They agree that the anchor population needs protection, but no institution may choose a person's identity or treat one community name as the state's compulsory answer."
chaosx.nr006.5801.a: "Open the provisional national council."
chaosx.nr006.5801.a.tt: "The §YCouncil of Communities§! decision category opens with its founding authority intact."

chaosx.nr006.5802.t: "Four Names Before One State"
chaosx.nr006.5802.desc: "The council must seat church, civic, village, municipal, and veteran institutions before it writes the community guarantees. A balanced formula gives each institution an independent voice. A dual church-civic formula gives the two largest public blocs greater responsibility while retaining every other seat."
chaosx.nr006.5802.a: "Seat every institution on equal terms."
chaosx.nr006.5802.a.tt: "Seats all four institution families and increases §YCouncil Cohesion§! by §G15§!."
chaosx.nr006.5802.b: "Use a dual church-civic formula."
chaosx.nr006.5802.b.tt: "Seats all four institution families, increases §YCouncil Cohesion§! by §G10§!, and moves the constitutional balance toward the church-civic current."

chaosx.nr006.5802.assyrian.t: "The Assyrian Self-Identification Guarantee"
chaosx.nr006.5802.assyrian.desc: "Assyrian delegates ask the council to protect self-identification, national-council representation, public petition, and freedom from compulsory relabelling. The guarantee belongs to every resident who claims it."
chaosx.nr006.5802.assyrian.a: "Ratify the Assyrian guarantee."
chaosx.nr006.5802.assyrian.a.tt: "Ratifies the distinct §YAssyrian Self-Identification Guarantee§!, records national-council petition rights, and keeps the allocated resources committed."
chaosx.nr006.5802.assyrian.b: "Refuse a separate Assyrian guarantee."
chaosx.nr006.5802.assyrian.b.tt: "Rejects the Assyrian guarantee, raises national opposition, and leaves the paid commitment spent."

chaosx.nr006.5802.chaldean.t: "The Chaldean Self-Identification Guarantee"
chaosx.nr006.5802.chaldean.desc: "Chaldean delegates ask for protection against compulsory relabelling, church petition rights, and municipal representation where their institutions serve residents. Civic identity remains personal, and the Chaldean guarantee stands apart from other community guarantees."
chaosx.nr006.5802.chaldean.a: "Ratify the Chaldean guarantee."
chaosx.nr006.5802.chaldean.a.tt: "Ratifies the distinct §YChaldean Self-Identification Guarantee§!, records church and municipal petition rights, and keeps the allocated resources committed."
chaosx.nr006.5802.chaldean.b: "Refuse a separate Chaldean guarantee."
chaosx.nr006.5802.chaldean.b.tt: "Rejects the Chaldean guarantee, damages the church settlement, and leaves the paid commitment spent."

chaosx.nr006.5802.syriac.t: "The Syriac Self-Identification Guarantee"
chaosx.nr006.5802.syriac.desc: "Syriac delegates ask for self-identification, language, school, and civic petition protections. The council recognizes that language use, church office, and national politics are related in some institutions without treating them as the same personal identity."
chaosx.nr006.5802.syriac.a: "Ratify the Syriac guarantee."
chaosx.nr006.5802.syriac.a.tt: "Ratifies the distinct §YSyriac Self-Identification Guarantee§!, records language and school petition rights, and improves external credibility."
chaosx.nr006.5802.syriac.b: "Refuse a separate Syriac guarantee."
chaosx.nr006.5802.syriac.b.tt: "Rejects the Syriac guarantee, damages the language settlement, and leaves the paid commitment spent."

chaosx.nr006.5802.aramean.t: "The Aramean Self-Identification Guarantee"
chaosx.nr006.5802.aramean.desc: "Aramean delegates ask for protection of civic self-description, municipal and village petition, and freedom from compulsory relabelling. Their guarantee remains separate from language, church, and other national institutions."
chaosx.nr006.5802.aramean.a: "Ratify the Aramean guarantee."
chaosx.nr006.5802.aramean.a.tt: "Ratifies the distinct §YAramean Self-Identification Guarantee§!, records civic petition rights, and strengthens the civic current."
chaosx.nr006.5802.aramean.b: "Refuse a separate Aramean guarantee."
chaosx.nr006.5802.aramean.b.tt: "Rejects the Aramean guarantee, damages the civic settlement, and leaves the paid commitment spent."

chaosx.nr006.5803.t: "The Churches Ask Their Competence"
chaosx.nr006.5803.desc: "Church delegates ask the constitution to protect worship, internal office, and defined personal matters. Civic delegates insist that criminal law, taxation, public appointment, residence, and constitutional rights belong to public courts. Both sides agree that church office cannot decide a person's civic identity."
chaosx.nr006.5803.a: "Define a limited personal competence for the churches."
chaosx.nr006.5803.a.tt: "Completes the jurisdiction record, moves the balance toward the church-civic compact, and increases §YCouncil Cohesion§! by §G10§!."
chaosx.nr006.5803.b: "Place public law under the civic courts."
chaosx.nr006.5803.b.tt: "Completes the jurisdiction record, moves the balance toward the civic assembly, and increases §YCouncil Cohesion§! by §G10§!."
chaosx.nr006.5803.c: "Return the unresolved draft to committee."
chaosx.nr006.5803.c.tt: "The church-civic deadlock remains and §YCouncil Cohesion§! decreases by §R10§!."

chaosx.nr006.5804.t: "Veterans at the Council Door"
chaosx.nr006.5804.desc: "Levies veterans remind the council that armed service kept roads and villages alive when public institutions failed. The council must choose among supervised constitutional service, removal from council votes, and emergency political authority for the veterans."
chaosx.nr006.5804.a: "Recognize service under a civilian Levies board."
chaosx.nr006.5804.a.tt: "Keeps the Levies under civilian law. §YCouncil Cohesion§! and §YCorridor Security§! each increase by §G10§!."
chaosx.nr006.5804.b: "Keep the board but exclude it from council votes."
chaosx.nr006.5804.b.tt: "Preserves civilian command and improves security by §G15§!, while §YCouncil Cohesion§! decreases by §R10§!."
chaosx.nr006.5804.c: "Let the emergency petition proceed."
chaosx.nr006.5804.c.tt: "Raises severe security pressure. §YCorridor Security§! increases by §G20§! and §YCouncil Cohesion§! decreases by §R15§!. Guardianship still requires a separate decision."

chaosx.nr006.5805.t: "Letters and Remittances from Abroad"
chaosx.nr006.5805.desc: "Engineers, teachers, accountants, and organizers in [independence_wave_iw058_diaspora_partner.GetNameDef] offer to serve the council. Their remittances can support public administration, while the liaison also needs a durable legal route for people, accounts, and supplies between the two countries."
chaosx.nr006.5805.a: "Bind the experts to public service."
chaosx.nr006.5805.a.tt: "Establishes market access with the named diaspora partner, improves §YExternal Guarantee Credibility§! by §G20§!, and accepts an administrative burden. The experts remain public servants outside the cabinet."
chaosx.nr006.5805.b: "Limit the bureau to remittance accounts."
chaosx.nr006.5805.b.tt: "Establishes market access with the named diaspora partner through a narrow remittance bureau and improves §YExternal Guarantee Credibility§! by §G10§!."
chaosx.nr006.5805.c: "Close the bureau to foreign influence."
chaosx.nr006.5805.c.tt: "Closes the liaison, raises foreign suspicion, and reduces §YExternal Guarantee Credibility§! by §R10§!."

chaosx.nr006.5806.t: "The Roads Above Mosul"
chaosx.nr006.5806.desc: "Patrol reports warn that the roads, river approaches, and mountain tracks above Mosul cannot be secured by a distant claim. The council must work through local patrols, accepted transit agreements, or bounded fortification in the anchor it actually owns and controls."
chaosx.nr006.5806.a: "Conclude local patrol agreements."
chaosx.nr006.5806.a.tt: "Ends the immediate anchor crisis. §YCorridor Security§! increases by §G10§! and §YCouncil Cohesion§! increases by §G5§!."
chaosx.nr006.5806.b: "Negotiate mountain and river transit."
chaosx.nr006.5806.b.tt: "Records transit agreements. §YCorridor Security§! increases by §G15§! and §YExternal Guarantee Credibility§! increases by §G5§!."
chaosx.nr006.5806.c: "Prioritize hard defenses inside Mosul."
chaosx.nr006.5806.c.tt: "Prioritizes bounded anchor fortification. §YCorridor Security§! increases by §G20§! and §YCouncil Cohesion§! decreases by §R5§!."

chaosx.nr006.5807.t: "A Guarantee with Conditions"
chaosx.nr006.5807.desc: "[independence_wave_iw058_named_external_guarantee_target.GetNameDefCap] is willing to name Mosul in a public security agreement. Its diplomats ask for influence over future defense consultations and access to council reporting. The council may insist on sovereignty safeguards, accept a deeper patron role, or reject the conditions."
chaosx.nr006.5807.a: "Accept only with explicit sovereignty safeguards."
chaosx.nr006.5807.a.tt: "Secures a guarantee and an external security treaty without subject or client status. A qualifying regional guarantor may serve as the sovereign-autonomy settlement partner. §YExternal Guarantee Credibility§! increases by §G25§!."
chaosx.nr006.5807.b: "Accept the guarantee and its political leverage."
chaosx.nr006.5807.b.tt: "Secures the guarantee and records the guarantor as an influential patron without creating subject status. Credibility increases by §G25§! and cohesion decreases by §R10§!."
chaosx.nr006.5807.c: "Reject conditions that compromise the council."
chaosx.nr006.5807.c.tt: "Rejects the guarantee terms and reduces §YExternal Guarantee Credibility§! by §R5§!."

chaosx.nr006.5808.t: "The Former Host Demands Mosul"
chaosx.nr006.5808.desc: "The former host demands that the Mosul settlement be reversed or subordinated. Its ultimatum begins a reclamation crisis. The council may pursue a timed stand-down, prepare for a defensive conflict, or invoke an existing sovereign guarantee. None of these choices accepts subject or client status."
chaosx.nr006.5808.a: "Seek a timed security stand-down."
chaosx.nr006.5808.a.tt: "Records the ultimatum and opens the authored §YSurvive the Reclamation Crisis§! path."
chaosx.nr006.5808.b: "Prepare Mosul for a defensive conflict."
chaosx.nr006.5808.b.tt: "Records the ultimatum and severe security pressure. §YCorridor Security§! increases by §G10§! and external credibility decreases by §R5§!."
chaosx.nr006.5808.c: "Invoke the sovereign guarantee and request arbitration."
chaosx.nr006.5808.c.tt: "Records the ultimatum and arbitration request. §YExternal Guarantee Credibility§! increases by §G10§!."

chaosx.nr006.5809.t: "Civilian Law or Guardianship"
chaosx.nr006.5809.desc: "The security board argues that the anchor cannot survive divided command. It asks for a temporary Levies Guardianship. The proposal suspends constitutional capstones and the Mesopotamian settlement while ratified guarantees, the chosen constitutional route, and completed institutions remain protected."
chaosx.nr006.5809.a: "Authorize the Levies Guardianship."
chaosx.nr006.5809.a.tt: "Temporarily suspends the civilian constitutional surface. Existing routes, guarantees, and jurisdiction records remain intact for civilian restoration."
chaosx.nr006.5809.b: "Keep the armed institutions under civilian law."
chaosx.nr006.5809.b.tt: "Refuses guardianship. §YCouncil Cohesion§! increases by §G10§! and §YCorridor Security§! decreases by §R10§!."

chaosx.nr006.5810.t: "A Mesopotamian Settlement"
chaosx.nr006.5810.desc: "The council presents a settlement grounded in civilian rule, four separate community guarantees, secure approaches, and negotiated institutions. A federation still requires consenting members, a ratified charter, and agreed integration terms. A sovereign autonomy compact must preserve the Mosul boundary, protection, jurisdiction, transit, property, and security records without client capture."
chaosx.nr006.5810.a: "Ratify the negotiated Mesopotamian federation."
chaosx.nr006.5810.a.tt: "Ratifies the negotiated federation only when its accepted members, charter, and integration settlement are ready, then records the completed Mesopotamian settlement."
chaosx.nr006.5810.b: "Ratify the sovereign autonomy compact."
chaosx.nr006.5810.b.tt: "Preserves sovereignty under the autonomy compact and records the completed Mesopotamian settlement."

chaosx.nr006.4311.t: "An Invitation from [FROM.GetNameDef]"
chaosx.nr006.4311.desc: "[FROM.GetNameDefCap] invites [ROOT.GetNameDef] to enter the Volga-Ural accession congress as a sovereign founding member. The multilingual charter preserves public language rights and member government. The river authority, defense compact, and later integration work bind only governments that consent. Refusal leaves our country independent and outside the federation."
chaosx.nr006.4311.a: "Accept a sovereign place at the congress."
chaosx.nr006.4311.a.tt: "Records explicit consent for this proposal and its constitutional terms without annexing our country or granting the federation immediate cores."
chaosx.nr006.4311.b: "Withhold our consent."
chaosx.nr006.4311.b.tt: "Records opposition to this proposal. [ROOT.GetNameDefCap] remains sovereign and outside its founding member ledger."

chaosx.nr006.4312.t: "The Idel-Ural Delegation Arrives"
chaosx.nr006.4312.desc: "Delegates from [FROM.GetNameDef] ask [ROOT.GetNameDef] to join an Idel-Ural compact founded on a religious-civic settlement, cultural autonomy, member consent, and a common river defense. The compact cannot erase our institutions or claim our territory without a ratified accession."
chaosx.nr006.4312.a: "Authorize our delegation to consent."
chaosx.nr006.4312.a.tt: "Records explicit consent for this proposal and its constitutional terms. Membership remains sovereign and integration proceeds by negotiated stages."
chaosx.nr006.4312.b: "Reject the compact on these terms."
chaosx.nr006.4312.b.tt: "Records opposition to this proposal without transferring territory or sovereignty."

chaosx.nr006.5811.t: "A Mesopotamian Federal Invitation"
chaosx.nr006.5811.desc: "[FROM.GetNameDefCap] invites [ROOT.GetNameDef] to a Mesopotamian federal congress. Its offer preserves member autonomy, distinct community guarantees, civilian control of member forces, river and transit rights, and a negotiated capital-and-revenue settlement. Acceptance authorizes this congress alone and leaves our government and sovereignty intact."
chaosx.nr006.5811.a: "Accept the constitutional invitation."
chaosx.nr006.5811.a.tt: "Records explicit consent for this proposal and its constitutional terms. Any later integration requires the ratified federal stages."
chaosx.nr006.5811.b: "Remain outside the proposed federation."
chaosx.nr006.5811.b.tt: "Records opposition to this proposal. [ROOT.GetNameDefCap] remains sovereign and no territory changes hands."

chaosx.nr006.4313.t: "The Volga-Ural Charter Takes Effect"
chaosx.nr006.4313.desc: "The accession congress has closed with the required sovereign consents and distinct territorial anchors. [ROOT.GetNameDefCap] carries the multilingual charter, while the founding governments retain their institutions and sovereign status. River authority, member autonomy, and defense integration will proceed through ratified stages rather than an immediate territorial absorption."
chaosx.nr006.4313.a: "Register the founding charter."
chaosx.nr006.4313.a.tt: "Records the Volga-Ural federation's founding. Member countries remain sovereign while charter and defense integration decisions proceed."

chaosx.nr006.4314.t: "The Idel-Ural Compact Is Proclaimed"
chaosx.nr006.4314.desc: "The restoration congress has accepted a religious-civic settlement, cultural autonomy, member consent, and common river defense. [ROOT.GetNameDefCap] becomes the compact's constitutional center without erasing the governments that consented to its founding."
chaosx.nr006.4314.a: "Publish the compact and its guarantees."
chaosx.nr006.4314.a.tt: "Records the Idel-Ural compact's founding. Member compacts and common river defense remain staged constitutional work."

chaosx.nr006.5812.t: "The Mesopotamian Federation Is Founded"
chaosx.nr006.5812.desc: "The federal congress has secured sovereign consent, protected member autonomy, preserved the four community guarantees, and agreed civilian control of the common defense. [ROOT.GetNameDefCap] carries the federation, while its founding governments retain their own institutions and sovereign status and enter the capital, revenue, river, and security settlement by ratified stages."
chaosx.nr006.5812.a: "Enter the federal charter into force."
chaosx.nr006.5812.a.tt: "Records the federation's founding. Member charters and the defense-and-revenue settlement continue through their staged decisions."
# IW-043/IW-058 focus localisation
independence_wave_iw043_open_middle_volga_congress: "The Congress at Kazan"
independence_wave_iw043_open_middle_volga_congress_desc: "Kazan can be more than a defended crossing. Delegates from the river cities, national communities, workshops, railways, mosques, and municipal councils must be brought into one provisional chamber before any government can claim to speak for the Middle Volga."
independence_wave_iw043_open_middle_volga_congress_tt: "The Middle Volga Congress begins its institutional work and strengthens §YCongress Authority§!."
independence_wave_iw043_confirm_kazan_mandate: "A Mandate from the River"
independence_wave_iw043_confirm_kazan_mandate_desc: "Our authority rests on the routes that converge on Kazan and the people who depend upon them. A public mandate must define the capital as a compact civic center, while other Volga communities receive their own settlements."
independence_wave_iw043_confirm_kazan_mandate_tt: "Secures the Kazan anchor administration, raises §YCongress Authority§!, and establishes terms for dealings with the former host."
independence_wave_iw043_seat_the_delegations: "Who May Speak for the Volga"
independence_wave_iw043_seat_the_delegations_desc: "Representation cannot be improvised behind closed doors. The congress must publish a roll, assign seats, and accept that Tatar, Bashkir, Chuvash, Mari, Udmurt, municipal, religious, labor, and resident interests will not always vote together."
independence_wave_iw043_seat_the_delegations_tt: "Unlocks the §YDelegation Roll Call§! and the four negotiated rights-clause settlements."
independence_wave_iw043_secure_volga_navigation: "Keep the Volga Moving"
independence_wave_iw043_secure_volga_navigation_desc: "A proclamation cannot tow a stranded barge or keep a ferry landing open under fire. Civil officials and a supplied formation must protect the crossings without turning commercial traffic into military property."
independence_wave_iw043_secure_volga_navigation_tt: "Unlocks the §YKazan–Cheboksary Navigation§! mission, requiring a supplied formation and committed trains."
independence_wave_iw043_reopen_kazan_river_customs: "Customs without a Blockade"
independence_wave_iw043_reopen_kazan_river_customs_desc: "River dues once served a much larger state. Our customs service must collect enough to operate while guaranteeing that inspection, ferry schedules, and warehouse accounts cannot be used to choke neighboring communities."
independence_wave_iw043_reopen_kazan_river_customs_tt: "Unlocks the timed §YVolga Customs and Ferries§! project and the river-economy lifecycle."
independence_wave_iw043_repair_cheboksary_workshops: "Repair the Cheboksary Workshops"
independence_wave_iw043_repair_cheboksary_workshops_desc: "Cheboksary's workshops can turn river access into durable capacity, but only if engineers, municipal authorities, and the congress agree on who will carry the cost. The repair programme must serve the crossing without treating the city as a requisition depot."
independence_wave_iw043_repair_cheboksary_workshops_tt: "Unlocks a workshop-repair project when §YCheboksary§! is controlled or treaty access has been secured. The work requires civilian capacity."
independence_wave_iw043_survey_rail_and_ferry_network: "Measure Every Rail and Landing"
independence_wave_iw043_survey_rail_and_ferry_network_desc: "Broken timetables conceal broken bridges, missing rolling stock, and ferry approaches that cannot support an army or a harvest. A joint civil survey will turn rumor into a repair order."
independence_wave_iw043_survey_rail_and_ferry_network_tt: "Prepares rail-and-ferry projects and improves the conditions for sustained §YRiver Control§!."
independence_wave_iw043_organize_the_river_guard: "A Guard for Crossings"
independence_wave_iw043_organize_the_river_guard_desc: "The River Guard must defend bridges, depots, and civil traffic while remaining answerable to the congress. Its equipment and manpower will be drawn from forces and reserves already under our authority."
independence_wave_iw043_organize_the_river_guard_tt: "Unlocks §YDiscipline the River Guard§!, requiring command power, equipment, manpower, and an existing formation."
independence_wave_iw043_trade_beyond_the_middle_volga: "Markets beyond the Bend"
independence_wave_iw043_trade_beyond_the_middle_volga_desc: "A compact river state will suffocate if every contract ends at its frontier. Delegations must seek one reachable partner at a time and accept that transport committed abroad may be lost."
independence_wave_iw043_trade_beyond_the_middle_volga_tt: "Unlocks a §YVolga Trade Delegation§! to one reachable partner, with train or convoy commitments."
independence_wave_iw043_recover_bolgar_civic_memory: "Bolgar Memory, Civic Law"
independence_wave_iw043_recover_bolgar_civic_memory_desc: "Bolgar history can give the republic a language of continuity. Scholars, jurists, and municipal delegates will decide which traditions can guide a modern constitution."
independence_wave_iw043_recover_bolgar_civic_memory_tt: "Strengthens the constitutional-restoration tendency while preserving equal resident citizenship."
independence_wave_iw043_settle_muftiate_and_civic_jurisdiction: "Faith beside the Civic Courts"
independence_wave_iw043_settle_muftiate_and_civic_jurisdiction_desc: "The muftiate may administer religious life without becoming the state, while civil courts must protect believers and nonbelievers alike. The boundary will be negotiated in public and paid for through administrative capacity."
independence_wave_iw043_settle_muftiate_and_civic_jurisdiction_tt: "Unlocks the timed §YMuftiate and Civic Courts§! settlement. Resident civic and religious equality is required for a constitutional outcome."
independence_wave_iw043_bind_crescent_to_congress: "The Crescent beneath the Charter"
independence_wave_iw043_bind_crescent_to_congress_desc: "Our restoration may draw legitimacy from Islam and Bolgar history only if the congress remains sovereign and every resident remains protected by ordinary law."
independence_wave_iw043_bind_crescent_to_congress_tt: "Locks the §YBolgar Constitutional§! route. The federal route becomes unavailable, while an emergency mandate may only suspend this settlement."
independence_wave_iw043_invite_idel_ural_delegations: "A Compact of the Idel and Urals"
independence_wave_iw043_invite_idel_ural_delegations_desc: "An Idel-Ural compact cannot be proclaimed from Kazan. Each prospective member must receive a defined place in the religious-civic settlement, cultural autonomy, river defense, and the final consent roll."
independence_wave_iw043_invite_idel_ural_delegations_tt: "Unlocks the §YIdel-Ural Compact Congress§! and records each prospective member's consent."
independence_wave_iw043_proclaim_modern_volga_bulgaria: "A Republic of Bolgar Memory"
independence_wave_iw043_proclaim_modern_volga_bulgaria_desc: "With the rights compact, river institutions, and civic-religious settlement complete, the congress can claim a modern Volga Bulgarian continuity without inventing a khan or subordinating non-Muslim residents."
independence_wave_iw043_proclaim_modern_volga_bulgaria_tt: "Completes the §YBolgar Constitutional§! settlement when Kazan, Cheboksary, the rights compact, river administration, and civic-religious law are secure."
independence_wave_iw043_charter_chamber_of_peoples: "Two Chambers on One River"
independence_wave_iw043_charter_chamber_of_peoples_desc: "A federal state needs both citizens and communities to be heard. A civic chamber will govern the common state while a chamber of peoples protects language, municipality, and national autonomy."
independence_wave_iw043_charter_chamber_of_peoples_tt: "Locks the §YFederal Congress§! route. The restoration route becomes unavailable, while an emergency mandate may only suspend this settlement."
independence_wave_iw043_guarantee_language_and_municipal_rights: "Rights That Reach the Municipality"
independence_wave_iw043_guarantee_language_and_municipal_rights_desc: "A guarantee written only in Kazan is no guarantee at all. Schools, courts, notices, budgets, and municipal offices must be able to use the languages and procedures promised by the congress."
independence_wave_iw043_guarantee_language_and_municipal_rights_tt: "Strengthens the §YRights Compact§! and opens costly reconciliation for clauses that were previously rejected."
independence_wave_iw043_federalize_river_cities: "The River Cities Govern Themselves"
independence_wave_iw043_federalize_river_cities_desc: "Kazan will retain customs, defense, and common navigation, but local councils must control the daily institutions that give the federation legitimacy. Direct extraction will fall as consent and river cooperation rise."
independence_wave_iw043_federalize_river_cities_tt: "Raises §YRiver Control§! and federal confidence at the cost of direct central extraction."
independence_wave_iw043_negotiate_volga_ural_accessions: "Accession by Written Consent"
independence_wave_iw043_negotiate_volga_ural_accessions_desc: "The Volga-Ural Federation will be assembled from signed charters and agreed institutions. Prospective members must accept autonomy, language rights, shared river authority, and a defined defense settlement."
independence_wave_iw043_negotiate_volga_ural_accessions_tt: "Unlocks the §YVolga-Ural Accession Congress§! and its member-consent ledger."
independence_wave_iw043_ratify_modern_volga_federation: "The Volga Federation Ratified"
independence_wave_iw043_ratify_modern_volga_federation_desc: "The two chambers, rights compact, and river administration can at last be bound into a federal constitution. Its legitimacy will rest on equal civic standing and negotiated national autonomy."
independence_wave_iw043_ratify_modern_volga_federation_tt: "Completes the §YModern Volga Federation§! settlement when Kazan, Cheboksary, the rights compact, river administration, and federal chambers are secure."
independence_wave_iw043_authorize_emergency_navigation_council: "Emergency Authority at the Crossings"
independence_wave_iw043_authorize_emergency_navigation_council_desc: "A severe crisis may require one command for the bridges and ferries. The mandate will consume authority and matériel, suspend constitutional capstones, and expire when civilian law can safely return."
independence_wave_iw043_authorize_emergency_navigation_council_tt: "Offers a temporary §YEmergency Navigation Council§!. It preserves completed constitutional work but suspends route capstones until civilian restoration."
independence_wave_iw043_return_guard_to_civilian_law: "The Guard Returns Its Mandate"
independence_wave_iw043_return_guard_to_civilian_law_desc: "Emergency command cannot become the constitution by inertia. The congress will reclaim the accounts, appointments, and crossings, accepting a real command and authority cost to restore ordinary law."
independence_wave_iw043_return_guard_to_civilian_law_tt: "Ends the emergency mandate and restores the preserved constitutional route. It cannot be taken during an immediate anchor crisis."
independence_wave_iw043_convene_volga_ural_federal_congress: "The Volga-Ural Federal Congress"
independence_wave_iw043_convene_volga_ural_federal_congress_desc: "The accession ledger is ready for judgment. Every member, anchor, and consent must align before the federation can replace promises with a common river authority."
independence_wave_iw043_convene_volga_ural_federal_congress_tt: "Allows final ratification of the §YVolga-Ural Federation§! when every member, anchor, consent, and settlement record is valid."
independence_wave_iw043_convene_idel_ural_compact: "Ratify the Idel-Ural Compact"
independence_wave_iw043_convene_idel_ural_compact_desc: "A modern compact must reject disputed reconstructions and rest on the consent actually recorded here: cultural autonomy, religious-civic law, river defense, and member sovereignty."
independence_wave_iw043_convene_idel_ural_compact_tt: "Allows final ratification of the §YIdel-Ural Compact§! when every required consent and settlement record is valid."

independence_wave_iw058_assemble_provisional_national_council: "The Council in Mosul"
independence_wave_iw058_assemble_provisional_national_council_desc: "Mosul's new authority must begin with a council. Church offices, civic committees, villages, veterans, and diaspora representatives will sit together so no single institution speaks for everyone."
independence_wave_iw058_assemble_provisional_national_council_tt: "Opens the §YCouncil of Communities§! and begins the country's institutional settlement."
independence_wave_iw058_hold_mosul_council_quarter: "Hold the Council Quarter"
independence_wave_iw058_hold_mosul_council_quarter_desc: "The council cannot deliberate while its streets, records, and supply routes remain exposed. A supplied formation must protect the compact anchor under civilian rules and a recorded equipment commitment."
independence_wave_iw058_hold_mosul_council_quarter_tt: "Unlocks the §YMosul Council Quarter§! defense mission, requiring a supplied formation and equipment upkeep."
independence_wave_iw058_seat_church_civic_and_village_delegates: "Seats for Church, Town, and Village"
independence_wave_iw058_seat_church_civic_and_village_delegates_desc: "The seat roll must include prelates, urban committees, and rural institutions so the council can represent the whole country without collapsing its members into one another."
independence_wave_iw058_seat_church_civic_and_village_delegates_tt: "Unlocks the §YCouncil Seat Enumeration§! and the distinct community-guarantee settlements."
independence_wave_iw058_secure_nineveh_approaches: "The Roads above Mosul"
independence_wave_iw058_secure_nineveh_approaches_desc: "The mountain and river approaches are a security problem before they are any territorial ambition. Patrols, local agreements, and repaired routes must protect Mosul without manufacturing claims on the wider region."
independence_wave_iw058_secure_nineveh_approaches_tt: "Unlocks the §YNineveh Approaches§! patrol mission and begins the corridor-security program."
independence_wave_iw058_open_diaspora_liaison_bureau: "Letters across the Borders"
independence_wave_iw058_open_diaspora_liaison_bureau_desc: "Distant communities can provide specialists, remittances, and diplomatic access, but assistance without public terms can become leverage. A civilian bureau will keep every commitment visible."
independence_wave_iw058_open_diaspora_liaison_bureau_tt: "Unlocks a §YDiaspora Expert Mission§! to one reachable partner, with convoy and civilian-capacity costs."
independence_wave_iw058_write_four_community_guarantees: "Four Guarantees, No Forced Name"
independence_wave_iw058_write_four_community_guarantees_desc: "Assyrian, Chaldean, Syriac, and Aramean self-identification must each be protected in its own words. The state may hold a public Assyrian identity without compelling every person, church, or community to adopt the same label."
independence_wave_iw058_write_four_community_guarantees_tt: "Unlocks four distinct settlements for §YAssyrian§!, §YChaldean§!, §YSyriac§!, and §YAramean§! self-identification."
independence_wave_iw058_settle_church_and_civil_jurisdiction: "Where Church Office Ends"
independence_wave_iw058_settle_church_and_civil_jurisdiction_desc: "Church institutions will retain their spiritual and communal functions, while civil courts, taxation, security, and public citizenship remain accountable to the state. No single hierarchy may define every community."
independence_wave_iw058_settle_church_and_civil_jurisdiction_tt: "Unlocks the timed §YChurch–Civil Competence§! settlement after the community guarantees have begun."
independence_wave_iw058_discipline_the_levies_board: "The Levies under Civilian Orders"
independence_wave_iw058_discipline_the_levies_board_desc: "Veteran formations are indispensable and dangerous in equal measure. Their equipment, command, and territorial duties must be recorded before they can defend the council without governing it."
independence_wave_iw058_discipline_the_levies_board_tt: "Unlocks §YLevies under Civilian Law§!, requiring command power, equipment, manpower, and an existing formation."
independence_wave_iw058_request_external_guarantees: "A Guarantor with a Name"
independence_wave_iw058_request_external_guarantees_desc: "Recognition cannot be requested from the world in the abstract. The council will approach one diplomatically reachable power and weigh protection against the leverage that power expects in return."
independence_wave_iw058_request_external_guarantees_tt: "Unlocks a §YNamed External Guarantee§! mission to one diplomatically reachable country."
independence_wave_iw058_entrench_mosul_recognition: "Recognition Rooted in Mosul"
independence_wave_iw058_entrench_mosul_recognition_desc: "Foreign signatures matter only when the council can protect its anchor, keep its guarantees, and administer the corridor. Recognition will be advanced through the established statehood process."
independence_wave_iw058_entrench_mosul_recognition_tt: "Advances the shared §YRecognition§! system once the Mosul anchor and external credibility are secure."
independence_wave_iw058_convene_concordat_council: "A Concordat of Distinct Institutions"
independence_wave_iw058_convene_concordat_council_desc: "The concordat sets separate competences and reciprocal guarantees for church and civic institutions. Secular citizenship remains protected."
independence_wave_iw058_convene_concordat_council_tt: "Locks the §YChurch–Civic Concordat§! route. The civic-assembly route becomes unavailable. A guardianship may only suspend this settlement."
independence_wave_iw058_charter_church_civic_compact: "The Church–Civic Charter"
independence_wave_iw058_charter_church_civic_compact_desc: "The concordat must become daily law: civil courts remain public, church bodies retain protected competences, and every self-identification guarantee binds both."
independence_wave_iw058_charter_church_civic_compact_tt: "Ratifies the Church–Civic Charter after all four identity guarantees are live."
independence_wave_iw058_link_synods_villages_and_diaspora: "Synods, Villages, and the Diaspora"
independence_wave_iw058_link_synods_villages_and_diaspora_desc: "The state will survive only if distant experts, village councils, and church networks can communicate without becoming parallel governments. A lawful liaison chain will connect them."
independence_wave_iw058_link_synods_villages_and_diaspora_tt: "Strengthens §YExternal Credibility§! and council cohesion while preserving civilian control of the liaison service."
independence_wave_iw058_ratify_concordat_state: "The Concordat State"
independence_wave_iw058_ratify_concordat_state_desc: "The council may now ratify a constitutional state in which church and civic bodies possess defined powers, every community guarantee is enforceable, and public sovereignty remains civilian."
independence_wave_iw058_ratify_concordat_state_tt: "Completes the §YChurch–Civic Constitutional§! route after cohesion, corridor security, all four guarantees, and civilian control are secured."
independence_wave_iw058_convene_civic_national_assembly: "The Civic National Assembly"
independence_wave_iw058_convene_civic_national_assembly_desc: "A civic republic can protect church and community institutions without assigning them sovereign authority. Municipal delegates and an accountable civil service will define the common state."
independence_wave_iw058_convene_civic_national_assembly_tt: "Locks the §YCivic National Assembly§! route. The concordat route becomes unavailable. A guardianship may only suspend this settlement."
independence_wave_iw058_charter_municipal_and_community_chambers: "Municipal and Community Chambers"
independence_wave_iw058_charter_municipal_and_community_chambers_desc: "Municipal government and protected community institutions will share a constitutional structure without turning either into an instrument for forced identity."
independence_wave_iw058_charter_municipal_and_community_chambers_tt: "Ratifies the Civic Assembly Charter after all four identity guarantees are live."
independence_wave_iw058_bind_diaspora_experts_to_public_service: "Expertise under Public Contract"
independence_wave_iw058_bind_diaspora_experts_to_public_service_desc: "Engineers, physicians, teachers, and administrators arriving through diaspora networks will enter transparent public service under civilian rules. Their work will demand real civilian capacity."
independence_wave_iw058_bind_diaspora_experts_to_public_service_tt: "Converts diaspora support into public administration and research capacity under transparent civilian contracts."
independence_wave_iw058_ratify_civic_national_state: "The Civic National State"
independence_wave_iw058_ratify_civic_national_state_desc: "The assembly can now bind municipal government, protected identities, civilian security, and public administration into a constitutional civic state."
independence_wave_iw058_ratify_civic_national_state_tt: "Completes the §YCivic Constitutional§! route after cohesion, corridor security, all four guarantees, and civilian control are secured."
independence_wave_iw058_authorize_levies_guardianship: "Guardianship at the Council Door"
independence_wave_iw058_authorize_levies_guardianship_desc: "A severe threat may require the Levies Board to coordinate every defensive order around Mosul. The mandate will exact political and administrative costs and cannot become a third constitutional ideology."
independence_wave_iw058_authorize_levies_guardianship_tt: "Offers a temporary §YLevies Guardianship§!. It preserves guarantees and any earlier constitutional route but suspends capstones and settlement work."
independence_wave_iw058_restore_civilian_command: "Civilian Orders Restored"
independence_wave_iw058_restore_civilian_command_desc: "The council will reclaim appointments, accounts, and operational authority from the guardianship. The cost is real, but allowing emergency command to harden into government would cost more."
independence_wave_iw058_restore_civilian_command_tt: "Ends the guardianship and restores the preserved constitutional route. It cannot be taken during an immediate anchor crisis."
independence_wave_iw058_fortify_mountain_river_corridor: "Fortify the Mountain–River Corridor"
independence_wave_iw058_fortify_mountain_river_corridor_desc: "The approaches to Mosul are bound together by mountain roads, river crossings, and the stores that make both defensible. A corridor plan will protect the anchor while keeping the Levies Board answerable to the civilian council."
independence_wave_iw058_fortify_mountain_river_corridor_tt: "Unlocks the §YMountain–River Corridor§! fortification mission and its equipment commitment."
independence_wave_iw058_negotiate_former_host_settlement: "Terms with the Former Host"
independence_wave_iw058_negotiate_former_host_settlement_desc: "Property, return, transit, borders, and security cannot remain one unresolved grievance. The former host must receive a named proposal and retain the power to refuse it."
independence_wave_iw058_negotiate_former_host_settlement_tt: "Unlocks the timed §YFormer-Host Security Settlement§! and its treaty-or-crisis outcomes."
independence_wave_iw058_offer_mesopotamian_autonomy_charter: "A Mesopotamian Charter of Autonomies"
independence_wave_iw058_offer_mesopotamian_autonomy_charter_desc: "With a constitutional route secured, the council can offer a broader settlement based on protected autonomy, shared transit, minority guarantees, and explicit sovereignty."
independence_wave_iw058_offer_mesopotamian_autonomy_charter_tt: "Opens two exclusive settlement modes: a consent-based §YMesopotamian Federation§! or a §YSovereign Autonomy Compact§!."
independence_wave_iw058_convene_mesopotamian_federal_congress: "The Mesopotamian Federal Congress"
independence_wave_iw058_convene_mesopotamian_federal_congress_desc: "A federation cannot be assembled by annexation. Member governments must consent to the river authority, revenue settlement, army terms, capital arrangement, and every protected autonomy."
independence_wave_iw058_convene_mesopotamian_federal_congress_tt: "Unlocks the §YMesopotamian Federal Congress§! and its member-by-member consent ledger."
independence_wave_iw058_ratify_mesopotamian_settlement: "A Settlement Worth Ratifying"
independence_wave_iw058_ratify_mesopotamian_settlement_desc: "Whether the council leads a federation or secures sovereign autonomy, the final settlement must close the host conflict, preserve all four guarantees, and return every emergency power to civilian law."
independence_wave_iw058_ratify_mesopotamian_settlement_tt: "Ratifies exactly one settlement: a consent-based §YMesopotamian Federation§! or a complete §YSovereign Autonomy Compact§!."
