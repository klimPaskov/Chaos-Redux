l_english:
  independence_wave_iw025_vojvodina_category: "Vojvodina River and Frontier Settlement"
  independence_wave_iw025_vojvodina_category_desc: "River logistics: §Y[?independence_wave_iw025_vojvodina_river_logistics|0]§! / [?constant:independence_wave_iw025_vojvodina_value.maximum|0]\nProvincial legitimacy: §Y[?independence_wave_iw025_vojvodina_provincial_legitimacy|0]§! / [?constant:independence_wave_iw025_vojvodina_value.maximum|0]\nBorder mobility: §Y[?independence_wave_iw025_vojvodina_border_mobility|0]§! / [?constant:independence_wave_iw025_vojvodina_value.maximum|0]\nBorder watch: §Y[?independence_wave_iw025_vojvodina_watch_hold_days|0]§! / [?constant:independence_wave_iw025_vojvodina_value.watch_required|0] days\n\nVojvodina has inherited a fertile plain, river depots, and a border command shared by several communities. Grain, remounts, municipal guarantees, and a watch line must agree before the province can speak as a federal neighbour rather than a contested corridor."

  independence_wave_iw025_compile_danube_depot_survey: "Survey the Danube Depots"
  independence_wave_iw025_compile_danube_depot_survey_desc: "Reconcile grain warehouses, river barges, rail allocations, and remount ledgers. The survey makes the provincial supply chain legible, but it spends clerks, railway stock, and a deliberate call on the population."
  independence_wave_iw025_depot_cost: "£command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_trains|0]§!"
  independence_wave_iw025_depot_cost_blocked: "Unavailable: requires £command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_trains|0]§!"
  independence_wave_iw025_depot_cost_tooltip: "Depot commitment: £command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.depot_trains|0]§!"
  independence_wave_iw025_compile_danube_depot_survey_effect_tt: "Gain §G+[?constant:independence_wave_iw025_vojvodina_value.depot_survey_gain|0]§! River Logistics, §G+[?constant:independence_wave_iw025_vojvodina_value.depot_survey_legitimacy_gain|0]§! Provincial Legitimacy, and §G+[?constant:independence_wave_iw025_vojvodina_value.depot_survey_mobility_gain|0]§! Border Mobility."

  independence_wave_iw025_establish_mounted_frontier_reserve: "Establish the Mounted Frontier Reserve"
  independence_wave_iw025_establish_mounted_frontier_reserve_desc: "Place border riders, remount stations, and river patrols under a single reserve bill. The reserve protects the Vojvodinian anchor while preserving the existing state settlement."
  independence_wave_iw025_mounted_reserve_cost: "£command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_support_equipment|0]§!"
  independence_wave_iw025_mounted_reserve_cost_blocked: "Unavailable: requires £command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_support_equipment|0]§!"
  independence_wave_iw025_mounted_reserve_cost_tooltip: "Mounted-reserve commitment: £command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.mounted_reserve_support_equipment|0]§!"
  independence_wave_iw025_establish_mounted_frontier_reserve_effect_tt: "Gain §G+[?constant:independence_wave_iw025_vojvodina_value.mounted_reserve_logistics_gain|0]§! River Logistics and §G+[?constant:independence_wave_iw025_vojvodina_value.mounted_reserve_mobility_gain|0]§! Border Mobility, but lose §R[?constant:independence_wave_iw025_vojvodina_value.mounted_reserve_legitimacy_loss|0]§! Provincial Legitimacy."

  independence_wave_iw025_mobilize_border_watch: "Mobilize the Vojvodina Border Watch"
  independence_wave_iw025_mobilize_border_watch_desc: "Equip a border watch from river patrols, mounted reserves, and screened reservists. The commitment begins a [?constant:independence_wave_iw025_vojvodina_duration.watch_mission_timeout|0]-day objective. One division must remain in the Vojvodina anchor while the authority owns and controls the state."
  independence_wave_iw025_guard_cost: "£command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.guard_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.guard_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.guard_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.guard_support_equipment|0]§!"
  independence_wave_iw025_guard_cost_blocked: "Unavailable: requires £command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.guard_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.guard_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.guard_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.guard_support_equipment|0]§!"
  independence_wave_iw025_guard_cost_tooltip: "Commit the displayed command authority, personnel, weapons, and support stores to the Vojvodina border watch."
  independence_wave_iw025_guard_start_effect_tt: "Activate §YHold the Vojvodina Border Watch§!. The watch must maintain the full anchor objective for [?constant:independence_wave_iw025_vojvodina_value.watch_required|0] continuous days."

  independence_wave_iw025_hold_vojvodina_border_watch: "Hold the Vojvodina Border Watch"
  independence_wave_iw025_hold_vojvodina_border_watch_desc: "Keep the anchor garrison supplied while riders inspect crossings and municipalities. The watch succeeds only when the state remains controlled and a division holds the border."
  independence_wave_iw025_hold_vojvodina_border_watch_success_effect_tt: "The border watch holds. Gain §G+[?constant:independence_wave_iw025_vojvodina_value.depot_survey_gain|0]§! River Logistics, §G+[?constant:independence_wave_iw025_vojvodina_value.watch_legitimacy_gain|0]§! Provincial Legitimacy, and §G+[?constant:independence_wave_iw025_vojvodina_value.mounted_reserve_mobility_gain|0]§! Border Mobility."
  independence_wave_iw025_hold_vojvodina_border_watch_failure_effect_tt: "The border watch breaks. Provincial confidence and logistics suffer."

  independence_wave_iw025_charter_municipal_minority_guarantees: "Charter Municipal Minority Guarantees"
  independence_wave_iw025_charter_municipal_minority_guarantees_desc: "Give municipal councils a common charter for language, land, school, and militia administration. The charter raises legitimacy while requiring railway and administrative resources."
  independence_wave_iw025_charter_cost: "£command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.charter_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.charter_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.charter_trains|0]§!"
  independence_wave_iw025_charter_cost_blocked: "Unavailable: requires £command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.charter_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.charter_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.charter_trains|0]§!"
  independence_wave_iw025_charter_cost_tooltip: "Municipal-charter commitment: £command_power §Y[?constant:independence_wave_iw025_vojvodina_cost.charter_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.charter_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.charter_trains|0]§!"
  independence_wave_iw025_charter_municipal_minority_guarantees_effect_tt: "Adopt the Municipal Minority Charter: gain §G+[?constant:independence_wave_iw025_vojvodina_value.municipal_charter_logistics_gain|0]§! River Logistics and §G+[?constant:independence_wave_iw025_vojvodina_value.municipal_charter_legitimacy_gain|0]§! Provincial Legitimacy, but lose §R[?constant:independence_wave_iw025_vojvodina_value.municipal_charter_mobility_loss|0]§! Border Mobility."

  independence_wave_iw025_establish_federal_agrarian_compact: "Establish the Federal Agrarian Compact"
  independence_wave_iw025_establish_federal_agrarian_compact_desc: "Bind grain districts, border officers, and municipal councils to a federal compact. It sacrifices short-term river logistics for a durable provincial settlement and a more mobile defence."
  independence_wave_iw025_federal_compact_cost: "£manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_manpower|0]§!  £army_experience §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_army_experience|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_support_equipment|0]§!"
  independence_wave_iw025_federal_compact_cost_blocked: "Unavailable: requires £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_manpower|0]§!  £army_experience §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_army_experience|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_support_equipment|0]§!"
  independence_wave_iw025_federal_compact_cost_tooltip: "Federal-compact commitment: £manpower_texticon §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_manpower|0]§!  £army_experience §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_army_experience|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw025_vojvodina_cost.federal_compact_support_equipment|0]§!"
  independence_wave_iw025_establish_federal_agrarian_compact_effect_tt: "Adopt the Federal Agrarian Compact: lose §R[?constant:independence_wave_iw025_vojvodina_value.federal_compact_logistics_loss|0]§! River Logistics and gain §G+[?constant:independence_wave_iw025_vojvodina_value.federal_compact_mobility_gain|0]§! Border Mobility and §G+[?constant:independence_wave_iw025_vojvodina_value.federal_compact_legitimacy_gain|0]§! Provincial Legitimacy."

  independence_wave_iw025_vojvodina_contested_danube_administration: "Contested Danube Administration"
  independence_wave_iw025_vojvodina_contested_danube_administration_desc: "River offices, border commands, and municipal councils still answer to different ledgers."
  independence_wave_iw025_vojvodina_coordinated_grain_authority: "Coordinated Grain Authority"
  independence_wave_iw025_vojvodina_coordinated_grain_authority_desc: "A common grain and remount authority keeps the corridor supplied while the settlement is negotiated."
  independence_wave_iw025_vojvodina_municipal_minority_charter: "Municipal Minority Charter"
  independence_wave_iw025_vojvodina_municipal_minority_charter_desc: "Municipal guarantees give the Vojvodinian settlement a civic foundation."
  independence_wave_iw025_vojvodina_federal_frontier_compact: "Federal Frontier Compact"
  independence_wave_iw025_vojvodina_federal_frontier_compact_desc: "A federal agrarian compact joins river districts and mounted border defence."
