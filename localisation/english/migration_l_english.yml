migration_state_preparing_to_leave: "Preparing to Leave"
migration_state_preparing_to_leave_desc: "A civilian movement plan is drawing people and transport away from danger. The pressure grows with the share of the state prepared to depart."
migration_state_exodus: "Civilian Exodus"
migration_state_exodus_desc: "Civilians are leaving unsafe districts and local labor is disappearing. Safe routes reduce losses, while blocked movement creates trapped populations."
migration_state_organized_evacuation: "Organized Evacuation"
migration_state_organized_evacuation_desc: "A proven evacuation is moving civilians through a planned route. Transport and receiving capacity must hold for the cohort to arrive safely."
migration_state_depopulated_districts: "Depopulated Districts"
migration_state_depopulated_districts_desc: "Recorded civilian departures have emptied part of this state. Production, local labor, and available building space remain reduced until recovery."
migration_state_reception: "Displaced Population Reception"
migration_state_reception_desc: "This state is sheltering displaced civilians. Food, housing, transport, sanitation, and administration determine whether reception remains manageable."
migration_state_overcrowded: "Overcrowded Reception"
migration_state_overcrowded_desc: "Arrivals have exceeded local reception capacity. Distribution, outside aid, integration, or resettlement is needed before food and medical services fail."
migration_state_trapped_border: "Trapped at the Border"
migration_state_trapped_border_desc: "A civilian cohort has reached a closed or failed route and cannot proceed. Hunger, exposure, irregular crossings, and violent enforcement can cause further deaths."
migration_state_transit: "Humanitarian Transit"
migration_state_transit_desc: "A civilian cohort is passing through this state without settling here. Route capacity and supplies must hold until onward movement is proven."
migration_state_return_readiness: "Return Readiness"
migration_state_return_readiness_desc: "A recorded displaced cohort is eligible to return after food, housing, protection, and route safety have been restored at its origin."
migration_state_return: "Return and Resettlement"
migration_state_return_desc: "Residents are returning or settling after displacement. Safe housing, food, transport, and protection must hold while communities and production recover."
migration_cohort_unknown: "Civilian Cohort"
migration_cohort_occupation: "Occupation Flight"
migration_cohort_camp: "Camp Escapees"
migration_cohort_gulag: "Gulag Survivors"
migration_cohort_forced_labor: "Forced-Labor Cohort"
migration_cohort_deportation: "Deportees"
migration_cohort_bombing: "Bombing Evacuees"
migration_cohort_nuclear: "Nuclear Survivors"
migration_cohort_fallout: "Fallout Evacuees"
migration_cohort_outbreak: "Outbreak-Exposed Civilians"
migration_cohort_disaster: "Disaster Evacuees"
migration_cohort_war: "War-Displaced Civilians"
migration_cohort_peace: "Postwar Returnees"
migration_cohort_event: "Displaced Civilians"
migration_cohort_blockade: "Blockade Evacuees"
migration_cohort_shortage: "Famine-Displaced Civilians"
migration_cohort_evacuation: "Organized Evacuees"
migration_cohort_internal: "Internally Displaced Civilians"
migration_cohort_refugees: "Refugees"
migration_no_one_left_at_the_gate_NAME: "No One Left at the Gate"
migration_no_one_left_at_the_gate_DESC: "Protect every cohort in a major trapped-border crisis and secure a durable outcome."
migration_no_one_left_at_the_gate_tooltip: "Protect every valid cohort in one major border crisis, keep reception below catastrophic famine, and complete voluntary return, integration, or resettlement. Violent pushback, forced return, internment, or forced labor of the protected cohort disqualifies the attempt."
migration_roads_home_NAME: "Roads Home"
migration_roads_home_DESC: "Restore a safe origin and voluntarily return most of a long-displaced cohort."
migration_roads_home_tooltip: "Keep a cohort at least as large as 25,000 people or 2% of the country's initial core population, whichever is greater, displaced for 180 days. End its cause, restore food, housing, route safety, and protection at the origin, then voluntarily return at least 75% of those eligible. Forced return or any unaccounted departure or return disqualifies the attempt."
migration_hungry_not_contagious_NAME: "They Were Hungry, Not Contagious"
migration_hungry_not_contagious_DESC: "Receive an outbreak-exposed famine cohort safely and reach a durable outcome."
migration_hungry_not_contagious_tooltip: "Use controlled medical reception for a cohort with proven outbreak exposure, prevent a host outbreak and catastrophic overload, then complete a durable outcome. Internment, forced labor, or forced return disqualifies the attempt."
migration_a_place_at_the_table_NAME: "A Place at the Table"
migration_a_place_at_the_table_DESC: "Integrate large displaced populations from at least three origins without coercion."
migration_a_place_at_the_table_tooltip: "Integrate cohorts from at least three distinct origins until their total reaches 5% of the host's initial core population. Keep major receiving states above famine and Stability above 50%. Repeatedly moving the same cohort between destinations, violent pushback, forced labor, or forced return disqualifies the attempt."
migration_the_country_did_not_empty_NAME: "The Country Did Not Empty"
migration_the_country_did_not_empty_DESC: "Survive simultaneous war, famine, and mass displacement without losing the country's population floor."
migration_the_country_did_not_empty_tooltip: "Have at least three core states enter severe famine or displacement, with at least 15% of the initial core population threatened. Recover every famine state, resolve every major cohort, remain independent, and keep each affected core state above 15% of its population when the crisis began. Continuing the campaign as another country disqualifies the attempt."
migration_report_wartime_evacuation: "Wartime Evacuation"
migration_report_wartime_evacuation_summary: "An organized route is moving civilians away from immediate danger. Transport safety and reception capacity determine how many survive the journey."
migration_report_closed_border: "Closed Border"
migration_report_closed_border_summary: "Denied passage has left civilians trapped near the frontier. Pressure will accumulate until safe transit, reception, or return becomes possible."
migration_report_nuclear_evacuation: "Nuclear Evacuation"
migration_report_nuclear_evacuation_summary: "Survivors are leaving a damaged and contaminated area under medical supervision. Route safety and host capacity remain decisive."
migration_report_return: "Voluntary Return"
migration_report_return_summary: "A displaced cohort is returning after food, housing, protection, and route safety have been restored at the origin."
migration_condemnation_deportation: "Forced Deportation"
migration_condemnation_deportation_desc: "A civilian population was moved through coercion under the authority of the responsible government."
migration_condemnation_forced_return: "Forced Return to Danger"
migration_condemnation_forced_return_desc: "Displaced civilians were returned to a proven famine, persecution, camp, contamination, or active-combat threat."
migration_condemnation_violent_pushback: "Violent Border Pushback"
migration_condemnation_violent_pushback_desc: "Border enforcement used violence against civilians seeking passage or protection."
