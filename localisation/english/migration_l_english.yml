l_english:
migration_decision_category: "Migration"
migration_decision_category_desc: "Review civilian movements and arrange evacuation, reception or settlement for affected states."
migration_category_phase_emerging: "Repeated or large civilian movements have become a sustained national issue. Prepare routes, reception, and border policy."
migration_category_phase_active: "Displacement routes, trapped populations, or receiving states require active management."
migration_category_phase_resolution: "Immediate movement pressure has eased. Complete integration, resettlement, or voluntary return before retiring the response."
migration_category_phase_dormant: "No sustained displacement or reception problem currently requires national management."
migration_priority_response_trapped: "Open a safe route or negotiate protected passage before exposure and violence cause deaths."
migration_priority_response_reception: "Expand, distribute, integrate, resettle, or return cohorts before reception services collapse."
migration_priority_response_displacement: "Match departures to a proven route and real reception capacity."
migration_priority_response_stable: "No major displacement burden currently requires action."
migration_priority_response_request: "Prepare reception for the requested civilians, or decide whether to refuse passage. Acceptance requires a safe route and enough capacity."
migration_border_policy_open: "§GHumanitarian Admission§!"
migration_border_policy_controlled: "§YControlled Admission§!"
migration_border_policy_transit: "§YTransit Only§!"
migration_border_policy_quarantine: "§OMedical Quarantine§!"
migration_border_policy_closed: "§RClosed Admission§!"
migration_border_policy_violent: "§tViolent Rejection§!"
migration_border_policy_forced_return: "§tForced Return§!"
migration_border_policy_unset: "No Standing Policy"
migration_mission_hold_humanitarian_corridor: "Keep the Humanitarian Corridor Open"
migration_mission_hold_humanitarian_corridor_desc: "Protect the route serving a trapped population until relief workers and civilian transports finish their work."
migration_mission_hold_humanitarian_corridor_success: "The corridor remained open for its full term."
migration_mission_hold_humanitarian_corridor_failure: "The corridor closed with civilians still trapped along the route."
migration_mission_prevent_reception_collapse: "Prevent Reception Collapse"
migration_mission_prevent_reception_collapse_desc: "Expand shelter and distribution before the receiving network is overwhelmed by arrivals."
migration_mission_prevent_reception_collapse_success: "Reception services absorbed the arriving population without collapsing."
migration_mission_prevent_reception_collapse_failure: "The receiving network remained overloaded when the emergency term ended."
migration_open_departure_routes: "Open Civilian Departure Routes"
migration_open_departure_routes_desc: "Permit civilians to leave threatened districts and support their movement toward safer territory. This reduces trapped populations but places more pressure on transport and receiving states."
migration_restrict_departure: "Restrict Civilian Departure"
migration_restrict_departure_desc: "Use security forces to hold civilians and workers in place. Outward movement will slow, but people remaining in danger may become trapped."
migration_close_border: "Close the Border at [FROM.GetName]"
migration_close_border_desc: "Stop ordinary entry through [FROM.GetName]. New inflows will slow, while civilians denied passage may gather at the border or seek irregular routes."
migration_evacuate_civilians: "Evacuate Civilians: [FROM.GetName]"
migration_evacuate_civilians_desc: "Move civilians from [FROM.GetName] to a safer state with reception capacity. Survivors settle at their destination, but a dangerous route can cost lives."
migration_evacuation_room_tt: "Our reception network has room for more people."
migration_negotiate_corridor: "Negotiate a Corridor through [FROM.GetName]"
migration_negotiate_corridor_desc: "Request an evacuation corridor from the controller of the only suitable enemy front beside [FROM.GetName]. The request covers the civilians trapped there, and its cost is paid when the other government receives it. Civilians remain in place until the request is accepted and the evacuation succeeds."
migration_accept_corridor_offer: "Accept the Corridor Request from [?humanitarian_corridor_offer_requester_country_id.GetName]"
migration_accept_corridor_offer_desc: "Guarantee safe passage from [?humanitarian_corridor_offer_origin_state_id.GetName] through [?humanitarian_corridor_offer_front_state_id.GetName]. Acceptance requires a safe route and enough reception capacity for all requested civilians. People remain at the origin until their transfer succeeds."
migration_reject_corridor_offer: "Reject the Corridor Request from [?humanitarian_corridor_offer_requester_country_id.GetName]"
migration_reject_corridor_offer_desc: "Refuse safe passage from [?humanitarian_corridor_offer_origin_state_id.GetName] through [?humanitarian_corridor_offer_front_state_id.GetName]. The civilians remain trapped at their origin. If they are starving and we have room for all of them, the world will condemn a refusal, or a request left unanswered, as obstruction of relief."
migration_open_reception: "Prepare Emergency Reception"
migration_open_reception_desc: "Expand shelter, sanitation and medical services in [FROM.GetName]. An incoming corridor request must name this receiving state, and preparation must provide room for everyone requested. The request still needs acceptance before anyone moves."
migration_controlled_medical_reception: "Screen Exposed Arrivals"
migration_controlled_medical_reception_desc: "Provide medical screening and shelter for disease-exposed arrivals under the Medical Quarantine law. Keep reception below capacity and prevent an outbreak throughout the observation period."
migration_distribute_arrivals: "Distribute Arrivals among Safe States"
migration_distribute_arrivals_desc: "Move arrivals away from overloaded border districts and place them across safer receiving states. This relieves local crowding while spreading the national reception burden."
migration_transit_only: "Arrange Humanitarian Transit"
migration_transit_only_desc: "Arrange onward transport for sheltered civilians under the Transit Only law. A safe neighboring country must admit them, and a failed route can leave them stranded."
migration_enforce_closure: "Enforce the Border Closure"
migration_enforce_closure_desc: "Enforce the Violent Rejection law with troops and transport. Fewer civilians will cross, but violence and exposure can kill those turned away and bring foreign condemnation."
migration_local_integration: "Begin Local Integration"
migration_local_integration_desc: "Provide housing, administration, and long-term legal settlement to a displaced cohort. Successful integration ends temporary reception status and makes the population part of the host country."
migration_local_integration_effect_tt: "The arrivals sheltered in [FROM.GetName] settle there permanently. Their reception space is freed, and they become part of our integrated population. Nobody has to move."
migration_third_country_resettlement: "Arrange Third-Country Resettlement from [FROM.GetName]"
migration_third_country_resettlement_desc: "Move displaced civilians from [FROM.GetName] to a safe neighboring country with enough reception capacity. Only those who survive the journey settle there."
migration_voluntary_return: "Support Voluntary Return from [FROM.GetName]"
migration_voluntary_return_desc: "Provide transport for civilians who choose to return after food, housing, routes, and protection have been restored at their origin."
migration_forced_repatriation: "Force Repatriation from [FROM.GetName]"
migration_forced_repatriation_desc: "Compel sheltered civilians in [FROM.GetName] to return under the Forced Return law. An unsafe origin or route can cause deaths, renewed flight and condemnation."
migration_decision_target_available_tt: "The selected state, hosted cohort, route, policy, and current reception capacity must still meet the requirements when the action completes."
migration_open_reception_target_tt: "Select a safe state that we own and control, with secure food and usable transport. Our reception law must permit admission, and preparation must improve local services. An incoming request must still name this state, and the resulting capacity must cover everyone requested. Failed preparation refunds its payment."
migration_reception_preparation_effect_tt: "Expand shelter and medical services in the selected state. A corridor request still needs acceptance before anyone moves."
migration_decision_effect_tt: "A successful operation changes local conditions or moves civilians. National laws remain set in the political view."
migration_decision_transfer_tt: "The action moves one identified cohort. Only people who leave are removed from the origin, survivors arrive at the destination, and route deaths are recorded separately. A failed movement grants no benefit."
