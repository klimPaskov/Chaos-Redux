migration_mission_hold_humanitarian_corridor_available_tt: "The humanitarian corridor has stayed open until the deadline and has moved civilians or delivered relief."
migration_mission_protect_evacuation_transport_available_tt: "When the deadline arrives, the evacuation state is still ours, with usable infrastructure, stable food, and no persecution, bombing, contamination, fallout, or plague."
migration_mission_prevent_reception_collapse_available_tt: "When the observation period ends, the receiving state still shelters the same arrivals without overcrowding, breaches, or plague."
migration_mission_prepare_safe_return_route_available_tt: "When the deadline arrives, the return state is still ours, with usable infrastructure, stable food, and no persecution, bombing, contamination, fallout, or plague."
migration_open_departure_routes_policy_tt: "Departure is currently restricted, or no departure policy has been set."
migration_restrict_departure_policy_tt: "Departure is currently open, or no departure policy has been set."
migration_reception_load_tt: "We are sheltering displaced people."
migration_reception_state_host_tt: "[FROM.GetName] shelters one identified group of arrivals."
migration_close_border_policy_tt: "Our borders are not already closed to arrivals."
migration_negotiate_corridor_target_tt: "[FROM.GetName] holds trapped civilians beside an enemy-held state, and both sides have usable infrastructure."
migration_accept_corridor_offer_available_tt: "A corridor request is waiting, and the front state can still receive everyone it covers."
migration_reject_corridor_offer_available_tt: "A corridor request is waiting for our answer."
migration_controlled_medical_reception_target_tt: "Arrivals in one of our states were exposed to disease and need medical screening."
migration_free_mission_slot_tt: "We can take on another migration mission."
migration_distribute_arrivals_destination_tt: "A neighboring state that we own and control is safe for arrivals, with usable infrastructure, stable food, and no persecution, bombing, trapped population, camps, contamination, fallout, or plague."
migration_transit_only_policy_tt: "Our reception policy is open or controlled."
migration_transit_only_target_tt: "[FROM.GetName] shelters one identified group of arrivals, and a safe neighboring foreign state can admit them."
migration_third_country_resettlement_target_tt: "[FROM.GetName] shelters one identified group of arrivals, and a safe neighboring foreign state has room for them and admits arrivals."
