migration_evacuate_vulnerable: "Evacuate the Vulnerable: [FROM.GetName]"

migration_evacuate_vulnerable_desc: "Give children, elderly people, injured civilians, and others needing care priority on prepared transports from [FROM.GetName]. This saves those at greatest risk but moves fewer people per journey."

migration_evacuate_workers: "Evacuate Workers: [FROM.GetName]"

migration_evacuate_workers_desc: "Move industrial and transport workers from [FROM.GetName] before local production collapses. Their skills can support recovery elsewhere, while fewer places remain for vulnerable civilians."

