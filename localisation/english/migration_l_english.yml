migration_decision_category: "Migration"
migration_decision_category_desc: "[GetMigrationCategoryPhase]\nDisplacement Load: §Y[?migration_displacement_load|0]§! people\nReception Capacity: §G[?migration_reception_capacity|0]§! people\nBorder Policy: [GetMigrationBorderPolicy]\nPriority: [GetMigrationPriorityResponse]"
migration_category_phase_emerging: "Large or repeated civilian movements are straining the country. Prepare routes, reception, and border policy."
migration_category_phase_active: "People are moving, trapped, or overwhelming receiving states."
migration_category_phase_resolution: "Flight has eased. Help displaced families settle permanently or return home safely."
migration_category_phase_dormant: "No displacement or reception problem needs national action."
migration_priority_response_trapped: "Open a safe route or negotiate protected passage before exposure and violence cause deaths."
migration_priority_response_reception: "Expand shelter or help arrivals settle elsewhere before food and medical services fail."
migration_priority_response_displacement: "Arrange safe transport to places with room for the arrivals."
migration_priority_response_stable: "No displacement needs action."
migration_priority_response_request: "Prepare reception for the requested civilians, or decide whether to refuse passage. Acceptance requires a safe route and enough capacity."
migration_border_policy_open: "§GHumanitarian Entry§!"
migration_border_policy_controlled: "§YControlled Entry§!"
migration_border_policy_transit: "§YTransit Only§!"
migration_border_policy_quarantine: "§OControlled Medical Entry§!"
migration_border_policy_closed: "§RClosed Border§!"
migration_border_policy_violent: "§tViolent Enforcement§!"
migration_border_policy_forced_return: "§tForced Return§!"
migration_border_policy_unset: "No Standing Policy"
migration_mission_hold_humanitarian_corridor: "Keep the Humanitarian Corridor Open"
migration_mission_hold_humanitarian_corridor_desc: "Protect the route serving a trapped population until relief workers and civilian transports finish their work."
migration_mission_hold_humanitarian_corridor_success: "The corridor remained open for its full term."
migration_mission_hold_humanitarian_corridor_failure: "The corridor closed with civilians still trapped along the route."
migration_mission_prevent_reception_collapse: "Prevent Reception Collapse"
migration_mission_prevent_reception_collapse_desc: "Expand shelter and distribution before the receiving network is overwhelmed by arrivals."
migration_mission_prevent_reception_collapse_success: "Reception services absorbed the arriving population without collapsing."
migration_mission_prevent_reception_collapse_failure: "The receiving network remained overloaded when the emergency term ended."
migration_open_departure_routes: "Open Civilian Departure Routes"
migration_open_departure_routes_desc: "Permit civilians to leave threatened districts and support their movement toward safer territory. This reduces trapped populations but places more pressure on transport and receiving states."
migration_restrict_departure: "Restrict Civilian Departure"
migration_restrict_departure_desc: "Use security forces to hold civilians and workers in place. Outward movement will slow, but people remaining in danger may become trapped."
migration_close_border: "Close the Border at [FROM.GetName]"
migration_close_border_desc: "Stop ordinary entry through [FROM.GetName]. New inflows will slow, while civilians denied passage may gather at the border or seek irregular routes."
migration_evacuate_civilians: "Evacuate Civilians: [FROM.GetName]"
migration_evacuate_civilians_desc: "Load trains with the families of [FROM.GetName], the sick and the old first, and carry them to a safer state with room for them. Survivors settle at their destination, but a dangerous route can cost lives."
migration_evacuation_room_tt: "Our reception network has room for more people."
migration_negotiate_corridor: "Request Passage: [FROM.GetName]"
migration_negotiate_corridor_desc: "Ask the controller of the only suitable enemy front state beside [FROM.GetName] for an evacuation corridor for the civilians trapped there. The cost is paid when the other government receives the request. Civilians stay in place until the request is accepted and the evacuation succeeds."
migration_accept_corridor_offer: "Accept Passage: [?humanitarian_corridor_offer_requester_country_id.GetName]"
migration_accept_corridor_offer_desc: "Guarantee safe passage from [?humanitarian_corridor_offer_origin_state_id.GetName] through [?humanitarian_corridor_offer_front_state_id.GetName]. This needs a safe route and room for all requested civilians. People stay at the origin until the transfer succeeds."
migration_reject_corridor_offer: "Refuse Passage: [?humanitarian_corridor_offer_requester_country_id.GetName]"
migration_reject_corridor_offer_desc: "Refuse safe passage from [?humanitarian_corridor_offer_origin_state_id.GetName] through [?humanitarian_corridor_offer_front_state_id.GetName]. The civilians remain trapped at their origin. If they are starving and we have room for all of them, the world condemns a refusal, or an unanswered request, as obstruction of relief."
migration_open_reception: "Open Emergency Reception"
migration_open_reception_desc: "Fund shelter, sanitation, and basic medical care in [FROM.GetName]. Against an incoming request, this prepares the requested border state. Preparation moves no one and does not open the route. The request still has to be accepted."
migration_controlled_medical_reception: "Screen Incoming Civilians"
migration_controlled_medical_reception_desc: "Admit exposed arrivals through screening, shelter, and medical care, keeping disease from spreading to the host."
migration_distribute_arrivals: "Distribute Arrivals"
migration_distribute_arrivals_desc: "Move arrivals away from overloaded border districts and place them across safer receiving states. This relieves local crowding while spreading the national reception burden."
migration_transit_only: "Permit Humanitarian Transit"
migration_transit_only_desc: "Allow civilians to cross the country toward a safe destination. This limits long-term shelter needs, but a broken onward route can leave them stranded."
migration_enforce_closure: "Enforce the Border Closure"
migration_enforce_closure_desc: "Commit troops, equipment, and fuel to stop irregular crossings. Movement falls, but violence, exposure, and foreign condemnation may follow."
migration_local_integration: "Begin Local Integration"
migration_local_integration_desc: "Provide housing and permanent residence to displaced families. Their temporary shelter space becomes available for other arrivals."
migration_local_integration_effect_tt: "The arrivals sheltered in [FROM.GetName] settle there permanently. Their reception space is freed, and they become part of our integrated population. Nobody has to move."
migration_third_country_resettlement: "Resettle Abroad: [FROM.GetName]"
migration_third_country_resettlement_desc: "Move displaced civilians from [FROM.GetName] to a safe neighboring country with enough reception capacity. Only those who survive the journey settle there."
migration_voluntary_return: "Help Families Return: [FROM.GetName]"
migration_voluntary_return_desc: "Provide transport for civilians who choose to return after food, housing, routes, and protection have been restored at their origin."
migration_forced_repatriation: "Force Repatriation from [FROM.GetName]"
migration_forced_repatriation_desc: "Force displaced civilians to leave [FROM.GetName]. This frees shelter space, but unsafe homes or routes can cause deaths, renewed flight, and condemnation."
migration_decision_target_available_tt: "The civilians, destination, route, and reception services must remain suitable until the work is finished."
migration_open_reception_target_tt: "Select a safe state that we own and control, with secure food and usable transport. Against an incoming request, it must be the requested state, the request must still be current, and the resulting capacity must cover all requested civilians. Preparation must improve services or change reception policy. A failed setup returns its payment."
migration_reception_preparation_effect_tt: "Improve reception services in the selected state and permit humanitarian entry if setup succeeds. Preparation neither accepts the request nor moves people."
migration_decision_effect_tt: "Food pressure, displacement, reception, or border policy changes only if the action succeeds."
migration_decision_transfer_tt: "Move one group of civilians to the selected destination. Survivors settle there. Unsafe routes can cost lives."
