migration_state_preparing_to_leave: "Preparing to Leave"
migration_state_preparing_to_leave_desc: "A civilian movement plan is drawing people and transport away from danger. The pressure grows with the share of the state prepared to depart."
migration_state_exodus: "Civilian Exodus"
migration_state_exodus_desc: "Civilians are leaving unsafe districts and local labor is disappearing. Safe routes reduce losses, while blocked movement creates trapped populations."
migration_state_organized_evacuation: "Organized Evacuation"
migration_state_organized_evacuation_desc: "Civilians are leaving along an organized route. Transport and shelter must remain available until they arrive safely."
migration_state_depopulated_districts: "Depopulated Districts"
migration_state_depopulated_districts_desc: "Civilian flight has emptied part of this state. Production, local labor, and available building space remain reduced until recovery."
migration_state_reception: "Displaced Population Reception"
migration_state_reception_desc: "This state is sheltering displaced civilians. Food, housing, transport, sanitation, and administration determine whether reception remains manageable."
migration_state_overcrowded: "Overcrowded Reception"
migration_state_overcrowded_desc: "Arrivals have exceeded local reception capacity. Distribution, outside aid, integration, or resettlement is needed before food and medical services fail."
migration_state_trapped_border: "Trapped at the Border"
migration_state_trapped_border_desc: "Civilians have reached a closed or broken route and cannot proceed. Hunger, exposure, and violence can cost further lives."
migration_state_transit: "Humanitarian Transit"
migration_state_transit_desc: "Displaced civilians are passing through this state. Keep transport and supplies available until they reach their destination."
migration_state_return_readiness: "Return Readiness"
migration_state_return_readiness_desc: "Displaced families can return home after food, housing, protection, and safe routes have been restored."
migration_state_return: "Return and Resettlement"
migration_state_return_desc: "Residents are returning or settling after displacement. Safe housing, food, transport, and protection must hold while communities and production recover."
migration_cohort_unknown: "Displaced Civilians"
migration_cohort_occupation: "Occupation Flight"
migration_cohort_camp: "Camp Escapees"
migration_cohort_gulag: "Gulag Survivors"
migration_cohort_forced_labor: "Forced Laborers"
migration_cohort_deportation: "Deportees"
migration_cohort_bombing: "Bombing Evacuees"
migration_cohort_nuclear: "Nuclear Survivors"
migration_cohort_fallout: "Fallout Evacuees"
migration_cohort_outbreak: "Outbreak-Exposed Civilians"
migration_cohort_disaster: "Disaster Evacuees"
migration_cohort_war: "War-Displaced Civilians"
migration_cohort_peace: "Postwar Returnees"
migration_cohort_event: "Displaced Civilians"
migration_cohort_blockade: "Blockade Evacuees"
migration_cohort_shortage: "Famine-Displaced Civilians"
migration_cohort_evacuation: "Organized Evacuees"
migration_cohort_internal: "Internally Displaced Civilians"
migration_cohort_refugees: "Refugees"
migration_no_one_left_at_the_gate_NAME: "No One Left at the Gate"
migration_no_one_left_at_the_gate_DESC: "Protect every group trapped at the border and help them settle safely."
migration_no_one_left_at_the_gate_tooltip: "Protect every displaced group in one major border crisis, prevent catastrophic famine where they are sheltered, and complete voluntary return, integration, or resettlement. Violent pushback, forced return, internment, or forced labor of these civilians disqualifies the attempt."
migration_roads_home_NAME: "Roads Home"
migration_roads_home_DESC: "Restore safe homes and help most of a long-displaced group return voluntarily."
migration_roads_home_tooltip: "Shelter a group of at least 25,000 people or 2% of the country's initial core population, whichever is greater, for 180 days. End the cause of their flight and restore food, housing, safe routes, and protection at home, then help at least 75% return voluntarily. Forced return or unexplained losses during departure or return disqualifies the attempt."
migration_hungry_not_contagious_NAME: "They Were Hungry, Not Contagious"
migration_hungry_not_contagious_DESC: "Receive starving civilians exposed to disease and help them settle safely."
migration_hungry_not_contagious_tooltip: "Screen and shelter displaced civilians exposed to an outbreak, prevent disease from spreading to the host and prevent catastrophic crowding, then complete voluntary return, integration, or resettlement. Internment, forced labor, or forced return disqualifies the attempt."
migration_a_place_at_the_table_NAME: "A Place at the Table"
migration_a_place_at_the_table_DESC: "Integrate large displaced populations from at least three origins without coercion."
migration_a_place_at_the_table_tooltip: "Integrate displaced groups from at least three different origins until their total reaches 5% of the host's initial core population. Keep major receiving states free of famine and Stability above 50%. Repeatedly moving the same group between destinations, violent pushback, forced labor, or forced return disqualifies the attempt."
migration_the_country_did_not_empty_NAME: "The Country Did Not Empty"
migration_the_country_did_not_empty_DESC: "Survive simultaneous war, famine, and mass displacement without losing the country's population floor."
migration_the_country_did_not_empty_tooltip: "Have at least three core states enter severe famine or displacement, with at least 15% of the initial core population threatened. End every famine and help every major displaced group return or settle. Remain independent and keep each affected core state above 15% of its population when the crisis began. Continuing the campaign as another country disqualifies the attempt."
migration_report_wartime_evacuation: "Wartime Evacuation"
migration_report_wartime_evacuation_summary: "An organized route is moving civilians away from immediate danger. Transport safety and reception capacity determine how many survive the journey."
migration_report_closed_border: "Closed Border"
migration_report_closed_border_summary: "Civilians are trapped at the frontier with food and shelter running short. Arrange safe passage, offer shelter, or help them return home."
migration_report_nuclear_evacuation: "Nuclear Evacuation"
migration_report_nuclear_evacuation_summary: "Survivors are leaving the contaminated districts under medical supervision. Keep their route safe and prepare food, shelter, and care."
migration_report_return: "Voluntary Return"
migration_report_return_summary: "Displaced families are returning home. Food, housing, protection, and safe routes have been restored."
migration_condemnation_deportation: "Forced Deportation"
migration_condemnation_deportation_desc: "The responsible government forced a civilian population to move."
migration_condemnation_forced_return: "Forced Return to Danger"
migration_condemnation_forced_return_desc: "Displaced civilians were sent back to proven famine, persecution, camps, contamination, or active combat."
migration_condemnation_violent_pushback: "Violent Border Pushback"
migration_condemnation_violent_pushback_desc: "Border enforcement used violence against civilians seeking passage or protection."
