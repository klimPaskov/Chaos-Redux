yak_fragmented_arctic_mandate: "Fragmented Arctic Mandate"
yak_fragmented_arctic_mandate_desc: "Lena communities, villages, railway workers, and river arctic detachments recognize the provisional authority without yet accepting one settlement."
yak_sakha_arctic_compact: "Sakha Arctic Compact"
yak_sakha_arctic_compact_desc: "A council charter and common river-guard command bind Sakha's Lena settlements and routes to one civil authority."
yak_sakha_council_charter: "Sakha Council Charter"
yak_sakha_council_charter_desc: "The council establishes civic administration and guarantees representation for Sakha's arctic communities."
yak_sakha_community_register: "Sakha Community Register"
yak_sakha_community_register_desc: "Lena workers, engineers, and local delegates coordinate extraction, river access, and civic revenue."
yak_arctic_land_compact: "Arctic Land Compact"
yak_arctic_land_compact_desc: "Village delegates and cooperatives protect food, recruitment, and local administration across the arctic."
yak_lena_workers_councils: "Lena Workers' Councils"
yak_lena_workers_councils_desc: "Railway crews, Lena workers, and municipal committees coordinate production and transport through common councils."
yak_river_guard_command: "River Guard Command"
yak_river_guard_command_desc: "A unified staff directs river guards and depot reserves while civil councils preserve supply and relief."

independence_wave_sakha_arctic_compact_category: "Sakha Arctic Compact"
independence_wave_sakha_arctic_compact_category_desc: "Council Cohesion: §Y[?independence_wave_yak_council_cohesion|0]§! / [?constant:independence_wave_sakha_pressure.maximum|0]\nRiver-Guard Readiness: §Y[?independence_wave_yak_river_guard_readiness|0]§! / [?constant:independence_wave_sakha_pressure.maximum|0]\nReach [?constant:independence_wave_sakha_pressure.stable|0] in both values to stabilize the compact."
independence_wave_yak_hold_arctic_council: "Hold the Sakha Arctic Council Together"
independence_wave_yak_hold_arctic_council_desc: "Within [?constant:independence_wave_sakha_duration.founding_crisis|0] days, install a government, raise both compact values to [?constant:independence_wave_sakha_pressure.stable|0], and keep Yakutsk owned and controlled."
independence_wave_yak_integrate_river_guards: "Integrate the River Guards"
independence_wave_yak_integrate_river_guards_desc: "Unify river detachments and local guards under a arctic staff while preserving the community guarantees that sustain them."
independence_wave_yak_settle_former_host_ledgers: "Settle the Former Host Ledgers"
independence_wave_yak_settle_former_host_ledgers_desc: "Close the property, border, population, and recognition claims inherited from the former administration. If talks fail, Sakha will settle them locally."
independence_wave_yak_ratify_constitutional_autonomy: "Ratify Constitutional Autonomy"
independence_wave_yak_ratify_constitutional_autonomy_desc: "Give the provisional council a binding charter of self-government and protections for arctic communities."
independence_wave_yak_adopt_arctic_land_compact: "Adopt the Arctic Land Compact"
independence_wave_yak_adopt_arctic_land_compact_desc: "Entrust village delegates and cooperatives with food, recruitment, and local administration."
independence_wave_yak_convene_lena_councils: "Convene the Lena Councils"
independence_wave_yak_convene_lena_councils_desc: "Place the Lena districts, railways, workshops, and municipal services under a common workers' council."
independence_wave_yak_codify_durable_sovereignty: "Codify Durable Sovereignty"
independence_wave_yak_codify_durable_sovereignty_desc: "A resolved founding crisis, stable ledgers, and a functioning government can turn liberation into a durable Sakha state."
independence_wave_yak_secure_lena_depots_desc: "Place the Yakutsk Lena stores, rail registers, and depot guards under a civil authority able to supply the compact."
independence_wave_yak_secure_lena_depots: "Secure the Lena Depots"
independence_wave_yak_register_sakha_communities_desc: "Record the rights, obligations, and representation of every Lena district, village, railway town, and recognized community."
independence_wave_yak_register_sakha_communities: "Register the Sakha Communities"
independence_wave_yak_establish_river_guard_emergency_command_desc: "Put the river guards under one emergency staff and secure the passes before neighboring armies test the compact."
independence_wave_yak_establish_river_guard_emergency_command: "Establish the River Guard Emergency Command"
independence_wave_yak_open_lena_network_corridor_desc: "After the founding settlement, exchange supplies, officers, and diplomatic access along the Lena–Arctic network with the other states that survived the wave."
independence_wave_yak_open_lena_network_corridor: "Open the Lena–Arctic Network Corridor"
independence_wave_yak_depots_effect_tt: "Council Cohesion and River-Guard Readiness improve, while Legitimacy and State Capacity rise."
independence_wave_yak_guards_effect_tt: "River-Guard Readiness improves sharply and the security administration gains Legitimacy and Security."
independence_wave_yak_communities_effect_tt: "Council Cohesion improves sharply, Recognition and State Capacity rise, and the compact absorbs a measured instability cost."
independence_wave_yak_host_ledgers_effect_tt: "Council Cohesion and River-Guard Readiness improve. Former-host property, border, population, and recognition ledgers are settled through negotiation."
independence_wave_yak_host_loss_effect_tt: "The former-host ledger closes locally. Council Cohesion and River-Guard Readiness improve, and no bilateral host values change."
independence_wave_yak_constitutional_route_effect_tt: "The Sakha Civic Assembly takes office under the constitutional standard. Council Cohesion and River-Guard Readiness improve, with gains to Legitimacy and State Capacity."
independence_wave_yak_arctic_land_route_effect_tt: "The Sakha Arctic Land Compact takes office under the traditional standard. Council Cohesion and River-Guard Readiness improve, with gains to Legitimacy and Recognition."
independence_wave_yak_socialist_route_effect_tt: "The Sakha Lena Workers' Council takes office under the socialist standard. River-Guard Readiness improves sharply while the railway and Lena economy are reorganized."
independence_wave_yak_emergency_route_effect_tt: "The Arctic Command Directorate takes office under the emergency standard. River-Guard Readiness rises sharply while Council Cohesion pays the cost of emergency rule."
independence_wave_yak_sovereignty_effect_tt: "Legitimacy, Recognition, and State Capacity rise, and the compact gains Security."
independence_wave_yak_network_effect_tt: "Council Cohesion and River-Guard Readiness improve. Network Standing, League Cohesion, Common Cause, Shared Reserve, and Member Confidence rise."
independence_wave_yak_focus_convene_arctic_council: "Convene the Sakha Arctic Council"
