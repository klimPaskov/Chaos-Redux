l_english:
# System Settings window (interface/chaosx_system_settings.gui) and the shared Fallout toggle.
chaosx.system_settings.open: "Show All Settings"
chaosx.system_settings.open.tt: "Adjust event pacing and crisis pressure."
chaosx.system_settings.title: "Advanced System Settings"
chaosx.system_settings.close.tt: "Close"
chaosx.system_settings.hint: "Adjust event pacing and pressure on your country."
chaosx.system_settings.step_down.tt: "Lower the value. Right click for a larger step."
chaosx.system_settings.step_up.tt: "Raise the value. Right click for a larger step."
chaosx.system_settings.group.pacing: "§YEvent Pacing§!"
chaosx.system_settings.group.pressure: "§YCrisis Pressure§!"
chaosx.system_settings.event_weight: "Base event weight"
chaosx.system_settings.event_weight.tt: "Sets fallback event caps, the crisis rescue weight floor and White Peace decay. Default: 1000 (100–5000)."
chaosx.system_settings.event_weight.value: "[?global.settings_event_weight|.0]"
chaosx.system_settings.event_weight.active: "Active: §Y[?global.default_event_weight|.0]§!"
chaosx.system_settings.timer_modifier: "Event interval scale"
chaosx.system_settings.timer_modifier.tt: "Scales future event intervals across all Chaos tiers. Default: 100% (10–200%)."
chaosx.system_settings.timer_modifier.value: "[?global.settings_timer_modifier|%0]"
chaosx.system_settings.timer_modifier.active: "Active: §Y[?global.chaos_timer_modifier_calm|%0]§!"
chaosx.system_settings.pacing.note: "New values take effect after Apply."
chaosx.system_settings.apply: "Apply"
chaosx.system_settings.apply.tt: "Apply the base event weight and event interval scale."
chaosx.system_settings.pacing_reset: "Reset"
chaosx.system_settings.pacing_reset.tt: "Restore weight 1000 and interval scale 100%, then press Apply."
chaosx.system_settings.pressure: "Crisis pressure on you"
chaosx.system_settings.pressure.tt: "Slightly shortens the interval between events as Chaos rises and increases pressure from ongoing crises in your country. Applies to every scheduled event. Default: Off."
chaosx.system_settings.reset_all: "Reset All"
chaosx.system_settings.reset_all.tt: "Restore and apply defaults: weight 1k, interval scale 100%, crisis pressure Off."
chaosx.fallout_toggle.label: "Allow Fallout"
chaosx.fallout_toggle.tt: "§YFallout§!\n\nWhen checked, nuclear catastrophes and fully poisoned skies can plunge the world into global Fallout. Once Fallout begins, this setting cannot change."
chaosx.warning.reenable: "Click to Enable"
