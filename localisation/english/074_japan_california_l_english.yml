l_english:
chaosx.nr74.1.t: "Japan in California"
chaosx.nr74.2.t: "We landed in California!"
chaosx.nr74.2.d: "Our forces have landed in California. The beachhead puts Japanese troops on American soil and opens a new front across the Pacific."
chaosx.nr74.2.a: "Luck is on our side!"

chaosx.news.65.t: "Japan lands in California!"
chaosx.news.65.d: "Japanese forces have landed in California and seized a foothold on the American coast. Governments across the Pacific are revising their plans for the war."
chaosx.news.65.a: "How?!"
