chaosx.nr1.35.t: "No Insurgency Takes Hold"
chaosx.nr1.35.d: "Communist organizers cannot gain a foothold in [communism_unavailable_host.GetNameDef]. They require a regular civilian government controlling at least two states, including a passable district outside its capital."
chaosx.nr1.35.a: "Understood."
