l_english:
chaosx.nr1.1.t: "Communist Insurgency"
chaosx.nr1.1.d: "Communist organizers are building networks among workers and soldiers. Strikes and party meetings now challenge governments across the world."
chaosx.nr1.1.a: "The government will defend the country against communist revolt."
chaosx.nr1.1.b: "The party already holds power."
chaosx.nr1.1.invalid: "No communist insurgency can take hold here."

chaosx.nr1.2.t: "Communists Target Industry in [communist_sabotage_state.GetName]"
chaosx.nr1.2.d: "Reports from [communist_sabotage_state.GetName] describe coordinated communist pressure against local industry. Factory managers are requesting army protection, union committees are disrupting production, and suspected militia couriers have been seen near rail depots and warehouses."
chaosx.nr1.2.a: "Absorb the disruption."
chaosx.nr1.2.b: "Deploy security detachments."
chaosx_tt_1_2a: "Factories and transport in [communist_sabotage_state.GetName] suffer damage."

chaosx.nr1.34.t: "Coordinated Strike Wave in [communist_sabotage_state.GetName]"
chaosx.nr1.34.d: "Work stoppages, transport delays, and sudden factory meetings have spread through [communist_sabotage_state.GetName]. Communist committees coordinate strikes around supply depots, rail movement, and police shift changes. Production across the state has slowed."
chaosx.nr1.34.a: "The strike wave spreads."
chaosx_tt_1_34a: "Communist support rises by 0.5 percentage points. Government stability and war support each fall by 0.5 points. Factories and transport in [communist_sabotage_state.GetName] suffer damage."

chaosx.nr1.3.t: "Emergency Anti-Communist Intervention"
chaosx.nr1.3.d: "The government has invoked emergency powers against communist-controlled territories. Army units are preparing mass raids, factory occupations, militia disarmament operations, and arrests of revolutionary committees.\n\nThe operation may restore authority. If the controlled states are well organized, the crackdown could trigger a communist uprising."
chaosx.nr1.3.a: "Force the country back under control."
chaosx.nr1.3.b: "The uprising begins."

chaosx.nr1.4.t: "Communist Control Spreads"
chaosx.nr1.4.d: "Communist cells have gained local influence in [communist_target_state.GetName]. Strikes and party meetings now challenge the state government, though loyal forces still hold the main towns."
chaosx.nr1.4.a: "Communist cells are taking root here."

chaosx.nr1.5.t: "Communist Control Escalates"
chaosx.nr1.5.d: "Communist committees have taken over more workplaces, depots, and municipal offices in [communist_target_state.GetName]. Loyal officials are losing control of the streets, and armed patrols now answer to the local party. A state that reaches Communist Lockdown costs the government 1.5 points of stability."
chaosx.nr1.5.a: "Loyal officials are losing control."

chaosx.nr1.6.t: "Local Intervention Succeeds"
chaosx.nr1.6.d: "Security forces disrupted communist networks in [communist_target_state.GetName]. Arrests, weapons seizures, and patrols restored part of the loyal administration's authority. Depending on the state and the progress made, stability falls by 0.5 to 2 percentage points."
chaosx.nr1.6.a: "The local communist network is weakened."
chaosx_tt_1_6a: "Government stability falls by 0.5 to 2 percentage points, depending on the state and intervention outcome."

chaosx.nr1.7.t: "Local Intervention Backfires"
chaosx.nr1.7.d: "The intervention in [communist_target_state.GetName] failed. Communist organizers evaded the sweep and local workers rallied against it. Communist support rose by 1.5 percentage points, while government stability fell by 1 to 3 points depending on state control."
chaosx.nr1.7.a: "The crackdown has failed."
chaosx_tt_1_7a: "Communist support rises by 1.5 percentage points. Government stability falls by 1 point, or 3 points in Communist Lockdown."

chaosx.nr1.8.t: "Revolutionary War Imminent"
chaosx.nr1.8.d: "Army officers warn that communist-controlled states are coordinating openly. Red militias are mobilizing, factories are refusing central government orders, and revolutionary committees are now communicating across regional lines.\n\nThe government can strike immediately, attempt concessions, or prepare loyalist forces for the coming confrontation."
chaosx.nr1.8.a: "Launch emergency intervention now."
chaosx.nr1.8.b: "Offer concessions to delay revolt."
chaosx.nr1.8.c: "Prepare loyalist forces."
chaosx.nr1.8.invalid: "The emergency operation is already underway or the rebel war has begun."

chaosx.nr1.9.t: "Emergency Intervention Restores Control"
chaosx.nr1.9.d: "The emergency operation failed to spark a national uprising. Communist support has fallen, and loyal forces have struck the controlled states. Some networks are broken while others reorganize under pressure, and factories remain strained."
chaosx.nr1.9.a: "The state survives."

chaosx.nr1.10.t: "Communist Uprising"
chaosx.nr1.10.d: "The emergency intervention has triggered open revolt. Communist militias seized local depots and declared a revolutionary government against the central authorities. Workers have turned nearby factories into supply points for the rebels."
chaosx.nr1.10.a: "Workers have joined the revolt."

chaosx.nr1.11.t: "Unstable Revolutionary Activity"
chaosx.nr1.11.d: "Communist cells have stopped following orders from party leaders. Local agitators test police patrols, raid supply stores, and choose their targets without warning."
chaosx.nr1.11.a: "The cells have stopped obeying their leaders."

chaosx.nr1.12.t: "Dark Worker Rituals"
chaosx.nr1.12.d: "Controlled workplaces have taken on stranger habits after the factory whistles fall silent. Workers gather behind locked gates, recite names of dead organizers, and swear oaths over broken tools and emptied cartridge boxes.\n\nThe ceremonies give the movement discipline, secrecy, and a language of sacrifice that spreads from shift to shift."
chaosx.nr1.12.a: "The night shift has changed."

chaosx.nr1.13.t: "Whispers of the World Revolution"
chaosx.nr1.13.d: "Captured pamphlets carry the same map, marked with factories and rail junctions across several countries. Exiles call for workers everywhere to rise together."
chaosx.nr1.13.a: "The same call is spreading across borders."

chaosx.nr1.14.t: "Surprise Revolt in [communist_evolution_state.GetName]"
chaosx.nr1.14.d: "Communist organizers in [communist_evolution_state.GetName] forced loyal police from several districts and called workers into the streets before the army could respond. Barricades now block the roads around the state capital."
chaosx.nr1.14.a: "Contain it before it spreads."

chaosx.nr1.15.t: "Worker Rituals in [communist_evolution_state.GetName]"
chaosx.nr1.15.d: "Informants in [communist_evolution_state.GetName] describe a night gathering inside a factory. Workers wrapped their tools in red cloth and swore that no factory would serve the old government when the signal came.\n\nThe machines started again at dawn, but the pledge had spread through the workshops."
chaosx.nr1.15.a: "The workshops have changed."

chaosx.nr1.16.t: "The World Revolution Is Whispered"
chaosx.nr1.16.d: "Communist couriers from [communist_evolution_state.GetName] have been intercepted carrying coded references to foreign cells, exile committees, and a future revolutionary front. Their incomplete plans place controlled states at the centre of a wider upheaval."
chaosx.nr1.16.a: "The courier network is real."

chaosx.nr1.17.t: "The Communist Insurgency Collapses"
chaosx.nr1.17.d: "The last organized communist networks have been broken. Local committees are scattered, authorities report no remaining revolutionary zones, and the communist party has lost the support needed to keep the insurgency alive. The fighting has ended, though sympathizers remain."
chaosx.nr1.17.a: "The state is secure."

chaosx.nr1.18.t: "Red Banner Over [communist_evolution_state.GetName]"
chaosx.nr1.18.d: "Before dawn, communist organizers in [communist_evolution_state.GetName] raised a red banner over the state capital and declared the surrounding districts liberated from central authority. Crowds blocked the roads with tram cars, factory carts, and commandeered trucks while loyal police withdrew.\n\nEvery local cell now has a symbol to rally around."
chaosx.nr1.18.a: "The banner has become a rallying symbol."

chaosx.nr1.19.t: "The Governor Vanishes"
chaosx.nr1.19.d: "The governor of [communist_evolution_state.GetName] disappeared hours before a security sweep. Communist patrols appeared across the city before the army could assemble, and factory workers followed them into the streets."
chaosx.nr1.19.a: "The local guards have changed sides."

chaosx.nr1.27.t: "The Red Choir"
chaosx.nr1.27.d: "A factory shift in [communist_evolution_state.GetName] refused to leave after the whistle. Through the night, workers chanted in rhythm with idle machinery and called themselves the Red Choir. Soldiers sent to disperse them heard every order repeated in perfect unison until the officers withdrew, and by dawn the name had spread."
chaosx.nr1.27.a: "The whole shift joined the chant."

chaosx.nr1.28.t: "The Machines Keep Running"
chaosx.nr1.28.d: "Communist organizers seized a factory yard in [communist_evolution_state.GetName]. The power was cut, but the machines kept turning for nearly an hour. Workers outside the gates said the factory had chosen the revolution.\n\nBy morning, no one could explain what kept the machines moving."
chaosx.nr1.28.a: "Something kept the machines running."

chaosx.nr1.29.t: "Symbols in Oil and Red Dye"
chaosx.nr1.29.d: "Police in [communist_evolution_state.GetName] found burned papers arranged in a circle on a factory floor. Slogans in oil and red dye promised to feed the old government into its own machines.\n\nWorkers who saw the gathering refuse to speak."
chaosx.nr1.29.a: "The workers saw the symbols."

chaosx.nr1.30.t: "The Hidden Portrait"
chaosx.nr1.30.d: "Informants in [communist_evolution_state.GetName] report that workers gathered around a hidden portrait of Lenin and chanted that he is coming. Young organizers have begun repeating the phrase across controlled workshops.\n\nRumor and propaganda are carrying the same message: the revolution is waiting for a returned leader."
chaosx.nr1.30.a: "Lenin's name is spreading."

chaosx.nr1.31.t: "A Voice Through the Machines"
chaosx.nr1.31.d: "A night shift in [communist_evolution_state.GetName] claims Lenin's voice came through the factory machinery after midnight. Static burst from the public-address system with instructions, promises, and a command to prepare for the World Revolution, and pamphlets quoting the voice appeared before sunrise."
chaosx.nr1.31.a: "This is coordinated hysteria."

chaosx.nr1.32.t: "He Has Returned"
chaosx.nr1.32.d: "Red pamphlets have appeared across [communist_evolution_state.GetName] with three words beneath Lenin's face: He has returned. Captured couriers carried the same route map toward other controlled districts.\n\nThe phrase is spreading with the maps."
chaosx.nr1.32.a: "The message has reached other districts."

communism_national_counter_agitation: "Disrupt Communist Organizing"
communism_national_counter_agitation_desc: "Over 30 days, police files, informants, radio addresses, and pressure on party organizers reduce national communist support. The operation costs more for every controlled state and reduces stability by 1 point when it begins. When it ends, communist support falls by 2 percentage points plus 1 for each controlled state."
