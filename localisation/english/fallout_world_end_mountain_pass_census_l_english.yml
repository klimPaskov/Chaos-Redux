chaosx.fallout.635.t: "The Mountain Pass Census"
chaosx.fallout.635.d: "A highland shelter above the dry valleys has become a register office, clinic, and guarded storehouse at once. Refugee families arrive by mule track while a continuity cabinet, a convoy chief, and the local garrison each bring a different list of who may sleep behind the stone wall. The first winter census must decide whether the settlement belongs to its residents, to those returning below, to the soldiers who hold the road, or to everyone who can still reach the pass."
chaosx.fallout.635.a: "Register local citizenship"
chaosx.fallout.635.a.tt: "Spend Food 3, Shelter Capacity 4, and Recognition 2. After 35 days, household trust, medicine, shelter, and the highland state ledgers will decide whether residents and refugees receive one register."
chaosx.fallout.635.b: "Issue a return plan"
chaosx.fallout.635.b.tt: "Spend Food 2, Fuel 3, and Recognition 2. After 35 days, escorted winter permits will be judged against return readiness, supply access, and the exposure risk below the pass."
chaosx.fallout.635.c: "Build a military colony"
chaosx.fallout.635.c.tt: "Spend Fuel 3, Support Equipment 2, and Command Power 10. After 35 days, a permanent garrison will be weighed against war conditions, route strain, and local cohesion."
chaosx.fallout.635.open.a: "Keep the pass open"
chaosx.fallout.635.open.a.tt: "Spend Food 4, Clean Water 3, and Medicine 2. After 35 days, the open road will be judged against disease pressure, clinic stores, and the number of families waiting outside."
chaosx.fallout.637.t: "The First Pass Count"
chaosx.fallout.637.local.success.d: "The local register survived the arguments in the shelter hall. Families who arrived before the last snow are recorded beside those who came up the mule track, and the clinic has one list for medicine, rations, and sleeping space. The continuity government can now answer a household claim without sending a guard to the door."
chaosx.fallout.637.local.partial.d: "The shelter hall has one register, but several pages still carry separate marks from the convoy and the garrison. Food and medicine reached the busiest rooms, yet the next cold night will test whether the new civic count can include those still waiting outside."
chaosx.fallout.637.local.failure.d: "The local register broke when the household lists could not be reconciled. Shelter stores were spent without a common count, the clinic has begun rationing its last doses, and the first losses have entered the Fallout winter death ledger."
chaosx.fallout.637.return.success.d: "The return plan placed escorts at the lower trail and issued permits one household at a time. Fuel stores reached the watch posts, the first travelers left before the pass iced over, and the return authority has a count that does not erase those who remain in the highland shelter."
chaosx.fallout.637.return.partial.d: "The permit desk opened and a few families began the descent, but the lower road could not carry every claimant. The return authority has reduced the waiting list while exposure rises for those who must choose between the pass and an unheated valley."
chaosx.fallout.637.return.failure.d: "The return plan consumed fuel and paper without producing a safe departure order. Escorts argued over the lower trail, the waiting families lost trust in the permit desk, and the damaged road now offers fewer choices than the census promised."
chaosx.fallout.637.military.success.d: "The garrison moved its stores into the shelter without closing the household ledger. A permanent watch now guards the mountain road, soldiers receive a counted ration, and the war cabinet can hold the pass without pretending that families below have vanished."
chaosx.fallout.637.military.partial.d: "The garrison secured the stores and posted a watch, but the new colony has not settled the civilian count. Fuel and equipment keep the road guarded while local cohesion gives way to quiet resentment around the barracks."
chaosx.fallout.637.military.failure.d: "The garrison took the pass before the census was signed. Equipment disappeared into separate depots, the road works were damaged during the seizure, and the shelter hall now records military settlement as another name for exclusion."
chaosx.fallout.637.open.success.d: "The pass remained open through the first frost. Convoy families, local residents, and clinic workers shared the road rules, clean water reached the outer rooms, and the settlement has enough authority to keep trade moving without a new wall."
chaosx.fallout.637.open.partial.d: "The open road carried food and a few families through the frost, but the clinic list still trails the arrivals. Disease pressure has eased in the inner shelter while the outer rooms ask whether open access can survive the next shortage."
chaosx.fallout.637.open.failure.d: "The open pass became a queue without a common clinic count. Medicine ran short, families crowded the sleeping rooms, and the first thaw will expose a road whose welcome was wider than its shelter capacity."
chaosx.fallout.637.a: "Record the first pass count"
chaosx.fallout.637.a.tt: "Apply the authenticated 35-day Mountain Pass Census result and continue to the delayed thaw review."
chaosx.fallout.639.t: "The Thaw Road Review"
chaosx.fallout.639.success.d: "Two hundred and ten days later, the first thaw has opened the mule track again. The pass still knows which households received shelter, which families left under escort, and which stores belong to the clinic or the garrison. The census has become a living rule for the highland road."
chaosx.fallout.639.partial.d: "The thaw road is open, but the pass carries two memories of the winter count. Some permits, clinic marks, and ration claims survived, while the remaining households still wait for an authority that can read every page together."
chaosx.fallout.639.failure.d: "The thaw review finds a shelter with broken pages and a road no office can promise to protect. Disease, exposure, and damaged works have narrowed the highland settlement, and the delayed census leaves every valley below without a trusted count."
chaosx.fallout.639.a: "Close the thaw review"
chaosx.fallout.639.a.tt: "Apply the authenticated callback outcome, record the highland census memory, and close the delayed transaction without creating a new country."
