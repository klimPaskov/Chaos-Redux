fallout.event_log.mountain_pass_census.name: "The Mountain Pass Census"
fallout.event_log.mountain_pass_census.detail: "[GetFalloutEvent635EventLogDetail]"
fallout.event_log.mountain_pass_census.choice_local: "The country registered local citizenship for residents and refugee families at the highland shelter."
fallout.event_log.mountain_pass_census.choice_return: "The country issued escorted return permits for families waiting above the valley road."
fallout.event_log.mountain_pass_census.choice_military: "The country built a garrison colony around the mountain road and its counted stores."
fallout.event_log.mountain_pass_census.choice_open: "The country kept the pass open for residents, displaced families, and trade caravans."
fallout.event_log.mountain_pass_census.local_success: "The local register joined residents and refugees under one shelter and clinic count."
fallout.event_log.mountain_pass_census.local_partial: "The local register survived in the shelter hall while separate garrison and convoy marks remained."
fallout.event_log.mountain_pass_census.local_failure: "The local register broke over household lists and left the shelter with a recorded winter loss."
fallout.event_log.mountain_pass_census.return_success: "The return plan sent escorted families down the thaw road without erasing those who stayed."
fallout.event_log.mountain_pass_census.return_partial: "The return permits moved some families while exposure and waiting lists grew around the pass."
fallout.event_log.mountain_pass_census.return_failure: "The return plan consumed stores without producing a safe departure order."
fallout.event_log.mountain_pass_census.military_success: "The garrison held the pass while preserving a counted civilian ledger."
fallout.event_log.mountain_pass_census.military_partial: "The garrison secured the stores while civilian cohesion weakened around the barracks."
fallout.event_log.mountain_pass_census.military_failure: "The garrison seized the pass and turned the census into a record of exclusion."
fallout.event_log.mountain_pass_census.open_success: "The open road carried families and trade through the first frost with clinic authority intact."
fallout.event_log.mountain_pass_census.open_partial: "The open road carried some families while clinic records trailed the arrivals."
fallout.event_log.mountain_pass_census.open_failure: "The open pass became a queue without enough shelter or medicine for the outer rooms."
fallout.event_log.mountain_pass_census.callback_success: "The thaw review found a highland road whose household, clinic, and store marks could still be read together."
fallout.event_log.mountain_pass_census.callback_partial: "The thaw review preserved some permits and ration marks while leaving the census contested."
fallout.event_log.mountain_pass_census.callback_failure: "The thaw review found broken pages, disease pressure, and no reliable promise for the road."
fallout.event_log.mountain_pass_census.cancelled: "The Mountain Pass Census transaction was cancelled after its host, owner, target, or generation changed."
