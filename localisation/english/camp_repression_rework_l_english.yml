camp_gui_expand_selected_pool: "Expand"
camp_gui_expand_selected_pool_tt: "Generic route only. Activate an eligible selected pool or expand an existing site after paying political, manpower, command, equipment, and rail costs. Country kits use their bespoke directives."
camp_gui_start_labor_project: "Labor Works"
camp_gui_start_labor_project_tt: "Generic route only. Begin one bounded construction project in the selected active site. AI uses the matching labor-project decision."
camp_gui_allocate_guards: "Allocate Guards"
camp_gui_allocate_guards_tt: "Pay political power, manpower, infantry equipment, and command power to reduce immediate breakdown while increasing the guard establishment."
camp_gui_reduce_quotas: "Reduce Quotas"
camp_gui_reduce_quotas_tt: "Reduce labor output, monthly population-loss pressure, resistance, and overextension for a limited period."
camp_gui_inspect_selected_site: "Inspect"
camp_gui_inspect_selected_site_tt: "Freeze expansion, open the reform route, and expose the selected site's records to administrative review."
camp_gui_dismantle_selected_site: "Dismantle"
camp_gui_dismantle_selected_site_tt: "Begin a 365-day selected-site closure mission. Control loss cancels the work; evidence and responsibility remain."
camp_gui_destroy_evidence: "Destroy Records"
camp_gui_destroy_evidence_tt: "Only available when enemy proximity threatens an undiscovered site. Costs manpower, support equipment, command power, and political power; deep evidence can make the attempt fail catastrophically."
camp_gui_chemical_method: "Chemical Contract"
camp_gui_chemical_method_tt: "Authorize the strongest available chemical method at the selected eligible site. Initial and monthly stockpile costs apply; shortage ends the method but preserves evidence."
camp_gui_biological_method: "Biological Contract"
camp_gui_biological_method_tt: "Authorize the strongest available biological method at the selected eligible site. Facility, technology, stockpile, accident, outbreak, and evidence requirements apply."

