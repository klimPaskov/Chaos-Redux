repression_ledger_overview_burden: "§YGuard & Transport Burden§!\nGuards [?display_camp_guard_burden|1] | Rail [?display_camp_rail_burden|1]\nSupply [?display_camp_supply_burden|1]\nConvoys [?display_camp_convoy_burden|1]"
