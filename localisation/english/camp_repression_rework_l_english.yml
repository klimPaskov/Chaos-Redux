repression_ledger_reach_card_tt: "Network reach counts registered active sites and their administrative weight. The breakdown shows detention, gulag, radicalized, experiment-linked, and contaminated-evidence sites. Dormant markers are excluded."
repression_ledger_output_card_tt: "Labor output and coercive control summarize current state contributions after allocation and overextension pressure. Severe overstretch reduces usable output."
repression_ledger_damage_card_tt: "Population-loss pressure, stability strain, and resistance describe the current human and political consequences. Exact recorded losses remain in the Chaos Meter Deaths tab."
repression_ledger_burden_card_tt: "Guard, rail, supply, and convoy burdens reflect manpower, equipment, trains, trucks, fuel, and shipping committed to the network."
repression_ledger_evidence_card_tt: "Evidence risk combines surviving records, failed concealment, foreign visibility, liberated sites, and contaminated traces."
repression_ledger_reform_card_tt: "Reform pressure combines inspections, court review, regime change, dismantlement, redress, and public discovery obligations."

