sp_japan_pingfang_records_office: "Pingfang Records Office"
sp_japan_pingfang_records_office_desc: "A sealed bureau at the center of the occupation research network will combine prisoner files, laboratory reports, and epidemic observations under one military archive. Its work strengthens Shiro Ishii's position while making the program harder to conceal."
sp_japan_pingfang_records_office_completed_tt: "Opens the Pingfang project branch, raises §YIshii Influence§!, and records the first permanent layer of occupation evidence."
sp_japan_kwantung_medical_intelligence: "Kwantung Medical Intelligence"
sp_japan_kwantung_medical_intelligence_desc: "Kwantung Army medical officers will receive their own reporting channels, transport priority, and authority to bypass civilian review. Faster research comes with greater institutional autonomy and accident risk."
sp_japan_kwantung_medical_intelligence_completed_tt: "Raises §YKwantung Autonomy§! and §YBiological Project Pressure§!, and unlocks deeper occupation-research work."
sp_japan_occupation_test_ledger: "Occupation Test Ledger"
sp_japan_occupation_test_ledger_desc: "Experiment-linked sites across occupied China and Manchuria will be entered into a common ledger. The resulting data will accelerate the program while tying every participating site to a recoverable chain of responsibility."
sp_japan_occupation_test_ledger_completed_tt: "Expands §YOccupation Test Records§!, increases evidence, and opens the epidemic-mapping branch."
sp_japan_epidemic_mapping_bureau: "Epidemic Mapping Bureau"
sp_japan_epidemic_mapping_bureau_desc: "Field reports will be reorganized around containment, defensive medicine, and the movement of outbreaks. The bureau can reduce uncontrolled spread, but it cannot erase the records that made its work possible."
sp_japan_epidemic_mapping_bureau_completed_tt: "Reduces §YOutbreak Accident Risk§! and establishes a permanent containment route."
sp_japan_cherry_blossom_dossier: "Cherry Blossom Dossier"
sp_japan_cherry_blossom_dossier_desc: "A desperate wartime staff study will consolidate the network's most dangerous proposals, deepening Ishii's authority while increasing accident risk and future tribunal exposure."
sp_japan_cherry_blossom_dossier_completed_tt: "Greatly raises §YIshii Influence§!, §YBiological Project Pressure§!, §YOutbreak Risk§!, and tribunal severity."

japan_ishii.1.t: "A Bureau Beyond Inspection"
japan_ishii.1.d: "Reports from Pingfang no longer pass through the ordinary army medical chain. Transport officers accept laboratory seals without question, occupation authorities surrender prisoner files on demand, and Shiro Ishii's bureau has begun issuing instructions in its own name. The program now wields independent authority inside the Kwantung Army."
japan_ishii.1.a: "Recognize the bureau's authority."
japan_ishii.2.t: "The Kwantung Medical Channel"
japan_ishii.2.d: "Medical officers in Manchuria have created a protected line between field sites, railway commands, and Pingfang. Tokyo's inspectors receive summaries after the decisions have already been made. The arrangement promises speed, secrecy, and a growing body of evidence no central office fully controls."
japan_ishii.2.a: "Shield Ishii from the review."
japan_ishii.2.b: "Restore the army's right of inspection."
japan_ishii.3.t: "The Perimeter Fails"
japan_ishii.3.d: "An illness recorded inside an experiment-linked site has appeared beyond its guarded boundary. Railway stops and nearby settlements report the same symptoms. The network can attempt containment, classify the spread as further research, or submit to an army review before the outbreak reaches a larger population."
japan_ishii.3.a: "Open a containment office immediately."
japan_ishii.3.b: "Record the spread and continue the program."
japan_ishii.3.c: "Place the laboratories under army review."
japan_ishii.4.t: "The Pingfang Archives"
japan_ishii.4.d: "Advancing forces have recovered laboratory registers, transport orders, and named chains of command from the Pingfang network. The material connects occupied-state sites to the authorities that supplied them and preserves physical evidence of the program's biological work. Copies are reaching foreign governments and entering formal investigations."
japan_ishii.4.a: "The evidence enters the public record."
japan_ishii.5.t: "Records Before the Advance"
japan_ishii.5.d: "Enemy columns are approaching the Pingfang network. Staff demand transport, security officers request permission to burn the archives, and some administrators argue that surrendering the records is the only way to prevent a wider outbreak. There is time for one course."
japan_ishii.5.a: "Evacuate the staff and their selected files."
japan_ishii.5.b: "Destroy the records before the perimeter falls."
japan_ishii.5.c: "Surrender the archives and open the site."
japan_ishii.6.t: "The Occupation Research Dossier"
japan_ishii.6.d: "Captured files, witness statements, and surviving laboratory records have been assembled into a single case. They describe a military research structure that drew its subjects and sites from occupied China and Manchuria while reporting responsibility back to Japan. The tribunal now has names, orders, and locations."
japan_ishii.6.a: "No seal can close the dossier again."

soviet_gulag.1.t: "The Grain Reports Diverge"
soviet_gulag.1.d: "District reserves are empty, settlements are being abandoned, and prison-labor columns arrive without adequate rations as procurement quotas continue to drain the affected regions. Emergency relief could arrest the disaster. Concealment would preserve the quotas and deepen the suffering."
soviet_gulag.1.a: "Release grain and reduce the quotas."
soviet_gulag.1.b: "Seal the mortality reports."
soviet_gulag.2.t: "Famine Across the Administrative Borderlands"
soviet_gulag.2.d: "Grain extraction, transport failure, and forced-labor demands have converged into a national crisis. Local officials no longer distinguish between a missed quota and an empty district. Population losses are mounting in the states carrying the heaviest burden, and the Union Crisis is absorbing every grievance the center refuses to address."
soviet_gulag.2.a: "Order emergency relief at any cost."
soviet_gulag.2.b: "Defend the plan and conceal the losses."
soviet_gulag.2.c: "Admit that the administration has broken down."
soviet_gulag.3.t: "The Gulag Administration Fractures"
soviet_gulag.3.d: "Camp commands request guards they cannot supply, regional offices report prisoners who never reached their assigned projects, and grain officials blame the security apparatus for missing trains. Moscow may reinforce the NKVD's authority or concede that the network has exceeded its capacity."
soviet_gulag.3.a: "Give the NKVD emergency authority."
soviet_gulag.3.b: "Reduce the network before it collapses."
soviet_gulag.4.t: "Relief Reaches the Camps"
soviet_gulag.4.d: "Requisition trains have begun carrying food rather than prisoners and extraction orders. Mortality is falling in the first districts reached by the relief program. The political damage remains, but the immediate famine pressure is receding."
soviet_gulag.4.a: "Keep the relief corridors open."
soviet_gulag.5.t: "The Gulag Records Open"
soviet_gulag.5.d: "The collapse of central authority has left transport manifests, quota orders, and camp registers in local hands. Republic administrations and foreign observers are comparing the files, giving old-movement grievances dates, signatures, and named states."
soviet_gulag.5.a: "The Union will be judged by its own records."

sov_famine_pressure_state: "Famine Pressure"
sov_famine_pressure_state_desc: "Grain extraction, supply failure, and overextended forced-labor quotas are reducing local manpower and production while increasing resistance and the strain on already weakened supply lines."
