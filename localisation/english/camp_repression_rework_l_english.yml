l_english:
 camp_repression_network_category: "Repression Ledger"
camp_repression_network_category_desc: "Current phase: §Y[GetCampNetworkPhaseName]§!\nNetwork reach: §Y[?display_camp_network_reach|0]§! | Eligible pools: §Y[?display_camp_active_pool_count|0]§! | Active sites: §Y[?display_camp_active_site_count|0]§!\nLabor output: [GetCampLaborOutputDisplay] | Population-loss pressure: [GetCampPopulationLossPressureName]\nStability strain: §R[?display_camp_stability_drag|1]§! | Resistance pressure: [GetCampResistancePressureName]\nEvidence risk: [GetCampEvidenceBandName] | Guard and transport burden: [GetCampBurdenSummary]\nReform pressure: [GetCampReformPressureName]\n\nRoutine administration remains concealed. Expansion, breakdown, public evidence, and reform make the network visible. Population losses are recorded in the Chaos Meter Deaths tab."

 camp_repression_open_ledger: "Open the Repression Ledger"
 camp_repression_open_ledger_desc: "Inspect territorial pools, active sites, state damage, logistical burdens, evidence, foreign exposure, and reform obligations."
 camp_repression_close_ledger: "Close the Repression Ledger"
 camp_repression_close_ledger_desc: "Close the detailed ledger and clear its temporary state lists and selection."
 camp_repression_show_actions: "Expose Network Directives"
 camp_repression_show_actions_desc: "Display the operational and reform decisions attached to the network."
 camp_repression_hide_actions: "Conceal Network Directives"
 camp_repression_hide_actions_desc: "Hide routine directives while retaining the ledger and crisis notices."

 generic_activate_detention_network: "Activate Detention Administration in [FROM.GetName]"
 generic_activate_detention_network_desc: "Establish a territorial detention and coercive-labor administration. Its limited control value is paid for in manpower, equipment, population loss, evidence, and political liability."
 generic_activate_detention_network_effect_tt: "[FROM.GetName] becomes an active detention site and enters monthly Deaths, evidence, resistance, burden, and discovery processing."
 generic_expand_labor_quotas: "Expand Labor Quotas in [FROM.GetName]"
 generic_expand_labor_quotas_desc: "Increase coerced labor allocations and transport demands at an existing site. Output rises alongside population loss, resistance, evidence, and network overextension."
 generic_expand_labor_quotas_effect_tt: "[FROM.GetName] becomes an expanded labor site and suffers an immediate population-loss pulse through the Deaths system."
 generic_redirect_labor_to_construction: "Route Labor to Construction in [FROM.GetName]"
 generic_redirect_labor_to_construction_desc: "Commit transport and support equipment to a bounded construction cycle. Control, supply, and evidence conditions must hold until completion."
 generic_redirect_labor_to_resource_extraction: "Route Labor to Extraction in [FROM.GetName]"
 generic_redirect_labor_to_resource_extraction_desc: "Commit transport and support equipment to an extraction cycle. Local output comes with greater population damage, resistance, and evidence."
 generic_labor_project_cycle_started_tt: "A single labor project begins in [FROM.GetName]. Its result is resolved when the project mission ends."
 generic_allocate_additional_guards: "Allocate Additional Guards"
 generic_allocate_additional_guards_desc: "Divert manpower, infantry equipment, and command capacity to steady the network. Immediate resistance falls, but the guard establishment becomes another logistical burden."
 generic_allocate_additional_guards_effect_tt: "Temporarily reduces population-loss and breakdown multipliers while increasing the network's guard burden."
 generic_upgrade_existing_site_to_radicalized_atrocity_site: "Radicalize the Site in [FROM.GetName]"
 generic_upgrade_existing_site_to_radicalized_atrocity_site_desc: "Convert an existing detention site into a radicalized atrocity node. Fear and hardliner pressure increase at the cost of severe Deaths, resistance, evidence, instability, and tribunal exposure."
 generic_radicalized_atrocity_site_effect_tt: "[FROM.GetName] becomes a radicalized site and suffers a severe immediate Deaths pulse."
 generic_restricted_contaminated_site_escalation: "Authorize Restricted Methods in [FROM.GetName]"
 generic_restricted_contaminated_site_escalation_desc: "Apply the strongest available chemical or biological method at an eligible site. Stockpiles are consumed and population damage rises sharply; contamination, accidents, evidence, instability, and tribunal severity rise with the method tier."
 generic_restricted_contaminated_site_effect_tt: "Uses the strongest eligible stockpiled method. The affected state's owner records the population loss; this country remains responsible for evidence and condemnation."
 generic_destroy_evidence_before_retreat: "Destroy Records in [FROM.GetName]"
 generic_destroy_evidence_before_retreat_desc: "Attempt to erase records as enemy forces approach. Low evidence may be reduced, but the operation causes further deaths; deep evidence or enemy proximity exposes the failure and worsens discovery."
 generic_destroy_evidence_before_retreat_effect_tt: "Resolves the cover-up against current evidence depth and enemy proximity, without a random fallback."
 generic_dismantle_detention_network: "Dismantle the Site in [FROM.GetName]"
 generic_dismantle_detention_network_desc: "Freeze expansion and carry out a long closure operation. Output ends when the structures are removed; unresolved records remain available to discovery, review, and redress."
 generic_dismantle_detention_network_started_tt: "A long dismantlement operation begins in [FROM.GetName]. Losing control cancels the work without erasing responsibility or evidence."

 generic_labor_project_cycle: "Labor Project Cycle"
 generic_labor_project_cycle_desc: "Maintain control, transport, equipment, and the selected active site until the project resolves."
 generic_network_overstretch_crisis: "Network Overstretch Crisis"
 generic_network_overstretch_crisis_desc: "Reduce overextension by allocating guards, ending projects, lowering quotas, or dismantling sites. Failure exposes the crisis and converts hidden evidence into public condemnation."
 generic_retreat_evidence_crisis: "Retreat Evidence Crisis"
 generic_retreat_evidence_crisis_desc: "Enemy proximity threatens an active site. Act before a failed retreat exposes its records and stored responsibility."
 generic_reform_and_dismantlement: "Reform and Dismantlement Program"
 generic_reform_and_dismantlement_desc: "Close every active site while bearing the political, industrial, and security costs of transition. A surviving site prevents a clean settlement."

 camp_repression_network_overstretch: "Overstretched Repression Network"
 camp_repression_network_overstretch_desc: "Guard, rail, supply, resistance, and concealment demands have outgrown the administration's capacity."
 camp_democratic_legitimacy_crisis: "Democratic Legitimacy Crisis"
 camp_democratic_legitimacy_crisis_desc: "Detention policy and concealed population damage have become incompatible with public law, coalition unity, and institutional trust."
 camp_repression_reform_pressure: "Repression Reform Pressure"
 camp_repression_reform_pressure_desc: "Courts, inspections, regime change, liberated records, and postwar obligations demand closure and accountability."
 generic_detention_network_administration: "Detention Network Administration"
 generic_detention_network_administration_desc: "A modest coercive administration supplies limited construction support and political control while accumulating hidden damage."
 generic_expanded_labor_network: "Expanded Labor Network"
 generic_expanded_labor_network_desc: "Broader quotas produce more output, but rail consumption, supply strain, resistance, and evidence grow with them."
 generic_overextended_repression_network: "Overextended Repression Network"
 generic_overextended_repression_network_desc: "The network's costs now consume much of the output it was built to extract."
 generic_radicalized_atrocity_policy: "Radicalized Atrocity Policy"
 generic_radicalized_atrocity_policy_desc: "The state has bound coercive administration to systematic mass violence. Reversal requires regime change or a costly dismantlement program."
 generic_reform_pressure: "Legal and Institutional Review"
 generic_reform_pressure_desc: "Officials, courts, inspectors, and successor authorities are forcing the network toward closure."
 generic_reformed_legacy: "Dismantled Repression Legacy"
 generic_reformed_legacy_desc: "Active operations have ended. Surviving records and redress obligations remain part of the state's political memory."

generic_reduce_labor_quotas: "Reduce Labor Quotas"
generic_reduce_labor_quotas_desc: "Curtail coerced labor allocations across the active network. Output falls, but population-loss pressure, resistance, and overextension ease while the order remains in force."
generic_reduce_labor_quotas_effect_tt: "Temporarily reduces labor output and monthly population-loss pressure while easing resistance and overextension."
camp_gui_selected_dismantlement_mission: "Selected Site Dismantlement"
camp_gui_selected_dismantlement_mission_desc: "Keep control of the selected site, halt expansion, and carry the closure burden until the structures are removed. Evidence and responsibility remain on record."

