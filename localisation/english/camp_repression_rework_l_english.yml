repression_ledger_tab_overview: "Overview"
repression_ledger_tab_overview_tt: "Show reach, output, population-loss pressure, burdens, evidence, and reform obligations."
repression_ledger_tab_state_pools: "State Pools"
repression_ledger_tab_state_pools_tt: "Show bounded territorial pools without protected-class targeting."
repression_ledger_tab_sites: "Active Sites"
repression_ledger_tab_sites_tt: "Show up to six active registered sites from the bounded ledger array."
repression_ledger_tab_country: "Country System"
repression_ledger_tab_country_tt: "Show the values and pressures unique to this country's repression system."
repression_ledger_tab_discovery: "Discovery & Reform"
repression_ledger_tab_discovery_tt: "Show public evidence, condemnation, tribunal exposure, and reform work."
repression_ledger_refresh: "Refresh Ledger"
repression_ledger_refresh_tt: "Clean invalid registrations and rebuild the bounded ledger values and state rows."
repression_ledger_show_directives: "Show Directives"
repression_ledger_show_directives_tt: "Reveal this country's decision kit. AI countries use the same decisions and effects without opening the ledger."
camp_gui_close_window_tt: "Close the ledger and clear its selected state and temporary rows."

