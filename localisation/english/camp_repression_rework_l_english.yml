l_english:
chaosx_super_event.74.t: "The Evidence Crosses the Wire"
chaosx_super_event.74.q: "\"The things I saw beggar description.\"\n§Y-Dwight D. Eisenhower, letter to George C. Marshall, 15 April 1945§!"
chaosx_super_event.74.a: "I think people ought to know."
chaosx_super_event.74.d: "Advancing troops and investigators have entered a site whose registers, physical traces, and testimony identify the government that built and maintained the network. The evidence establishes its purpose and scale, while copied records already cross borders into foreign archives and newspapers."
chaosx_super_event.75.t: "The Empty Granaries"
chaosx_super_event.75.q: "\"Every Kolchosi [Kolkhoz or collective farm] is starving, it has not got a morsel of bread!\"\n§Y-Jerry Berman, letter of 3 February 1933§!"
chaosx_super_event.75.a: "Give us this day our daily bread."
chaosx_super_event.75.d: "Across the Soviet countryside, grain extraction, forced-labor quotas, political instability, and orders issued under fear have emptied reserves and driven entire districts into famine. Villages are losing people as hunger feeds every grievance already pulling at the Union.\n\nRelief, concealment, and an admission of collapse remain possible. The bread already taken cannot be restored."
chaosx_super_event.76.t: "The Pingfang Files"
chaosx_super_event.76.q: "\"There is no doubt that Unit 731 conducted experiments on human subjects that included Chinese, Koreans, and Russians.\"\n§Y-Daqing Yang, Researching Japanese War Crimes§!"
chaosx_super_event.76.a: "Heaven's net lets nothing escape."
chaosx_super_event.76.d: "Investigators have secured records and physical evidence from a Japanese biological-warfare site. Medical files, laboratory inventories, and surviving traces connect experiments in occupied territory to an army program whose evidence is now beyond Tokyo's control.\n\nWhether the trail began at Pingfang or one of its linked facilities, it no longer ends behind a military seal."
chaosx_super_event.77.t: "The Empire's Accounts"
chaosx_super_event.77.q: "\"The subjection of peoples to alien subjugation, domination and exploitation constitutes a denial of fundamental human rights.\"\n§Y-United Nations General Assembly Resolution 1514 (XV), 1960§!"
chaosx_super_event.77.a: "Let my people go."
chaosx_super_event.77.d: "A colonial government's files have passed into investigators' hands. Surviving evidence of detention, coerced labor, and local population loss has emerged through independence, regime change, lost territory, or a failed review. Former subjects and foreign governments are reading the same account, and the imperial record has become a public reckoning."

camp_repression_network_category: "Repression Ledger"
camp_repression_network_category_desc: "Country system: §Y[GetCampCountryPanelName]§! | Current phase: §Y[GetCampNetworkPhaseName]§!\nNetwork reach: §Y[?display_camp_network_reach|0]§! | Eligible pools: §Y[?display_camp_active_pool_count|0]§! | Active sites: §Y[?display_camp_active_site_count|0]§!\nLabor output: [GetCampLaborOutputDisplay] | Population-loss pressure: [GetCampPopulationLossPressureName]\nStability strain: §R[?display_camp_stability_drag|1]§! | Resistance and subject pressure: [GetCampResistancePressureName]\nEvidence risk: [GetCampEvidenceBandName] | Discovery: [GetCampDiscoveryStatusName]\nGuard and transport burden: [GetCampBurdenSummary] | Reform pressure: [GetCampReformPressureName]\n\nRoutine administration remains concealed. Expansion, breakdown, public evidence, and reform make the network visible. Population losses are recorded in the Chaos Meter Deaths tab."
repression_ledger_category_summary: "Reach §Y[?display_camp_network_reach|0]§!  |  Sites §Y[?display_camp_active_site_count|0]§!\nEvidence [GetCampEvidenceBandName]  |  Reform [GetCampReformPressureName]"
repression_ledger_category_open: "Open Ledger"
repression_ledger_category_open_tt: "Open the full Repression Ledger as a centered board. The decision column remains compact while the ledger is open."

camp_repression_open_ledger: "Open the Repression Ledger"
camp_repression_open_ledger_desc: "Inspect territorial pools, active sites, state damage, logistical burdens, evidence, foreign exposure, and reform obligations."
camp_repression_close_ledger: "Close the Repression Ledger"
camp_repression_close_ledger_desc: "Close the detailed ledger and return to the decisions overview."
camp_repression_show_actions: "Expose Network Directives"
camp_repression_show_actions_desc: "Display the administration, emergency, review, and reform directives attached to the network."
camp_repression_hide_actions: "Conceal Network Directives"
camp_repression_hide_actions_desc: "Hide routine directives while retaining the ledger and crisis notices."

generic_activate_detention_network: "Activate Detention Administration in [FROM.GetName]"
generic_activate_detention_network_desc: "Establish a territorial detention and coercive-labor administration. Its limited control value is paid for in manpower, equipment, population loss, evidence, and political liability."
generic_activate_detention_network_effect_tt: "[FROM.GetName] becomes an active detention site and enters monthly Deaths, evidence, resistance, burden, and discovery processing."
generic_expand_labor_quotas: "Expand Labor Quotas in [FROM.GetName]"
generic_expand_labor_quotas_desc: "Increase coerced labor allocations and transport demands at an existing site. Output rises alongside population loss, resistance, evidence, and network overextension."
generic_expand_labor_quotas_effect_tt: "[FROM.GetName] gains one concentration-camp level and becomes an expanded labor site. The immediate population loss is recorded in the Chaos Meter Deaths tab."
generic_redirect_labor_to_construction: "Route Labor to Construction in [FROM.GetName]"
generic_redirect_labor_to_construction_desc: "Commit transport and support equipment to a construction cycle at the selected site. Control, supply, and evidence conditions must hold until completion."
generic_redirect_labor_to_resource_extraction: "Route Labor to Extraction in [FROM.GetName]"
generic_redirect_labor_to_resource_extraction_desc: "Commit transport and support equipment to an extraction cycle. Local output comes with greater population damage, resistance, and evidence."
generic_labor_project_cycle_started_tt: "A single labor project begins in [FROM.GetName]. Its result is resolved when the project mission ends."
generic_labor_project_cycle_success_tt: "The selected site remains active and responsible, the required transport and support reserves remain available, and any construction work retains civilian factory capacity. The project completes."
generic_labor_project_cycle_failure_tt: "Loss of the selected site, transport or support reserves, eligible resources, or construction capacity defeats the project and exposes its coercive administration."
generic_allocate_additional_guards: "Allocate Additional Guards"
generic_allocate_additional_guards_desc: "Divert manpower, infantry equipment, and command capacity to steady the network. Immediate resistance falls, but the guard establishment becomes another logistical burden."
generic_allocate_additional_guards_effect_tt: "Temporarily reduces population-loss and breakdown multipliers while increasing the network's guard burden."
generic_upgrade_existing_site_to_radicalized_atrocity_site: "Radicalize the Site in [FROM.GetName]"
generic_upgrade_existing_site_to_radicalized_atrocity_site_desc: "Convert one concentration-camp level into one extermination-camp level at an existing detention site. Fear and hardliner pressure increase at the cost of severe Deaths, resistance, evidence, instability, and tribunal exposure."
generic_radicalized_atrocity_site_effect_tt: "[FROM.GetName] loses one concentration-camp level, gains one extermination-camp level, blocks further concentration-camp construction, and suffers a severe immediate Deaths pulse."
generic_restricted_contaminated_site_escalation: "Authorize Restricted Methods in [FROM.GetName]"
generic_restricted_contaminated_site_escalation_desc: "Escalate an existing site into a contaminated-evidence crisis. Population damage, instability, accident risk, evidence, and tribunal exposure rise sharply."
generic_restricted_contaminated_site_effect_tt: "Creates severe contamination and evidence pressure at the selected site. The affected state records the population loss, and this country remains responsible for condemnation."
generic_destroy_evidence_before_retreat: "Destroy Records in [FROM.GetName]"
generic_destroy_evidence_before_retreat_desc: "Attempt to erase records as enemy forces approach. The operation causes further deaths. Deep evidence or close enemy pressure can expose the failure and worsen discovery."
generic_destroy_evidence_before_retreat_effect_tt: "The success of the cover-up depends on the surviving evidence and the proximity of enemy forces."
generic_inspect_active_site: "Inspect the Site in [FROM.GetName]"
generic_inspect_active_site_desc: "Open the selected responsible site to a sustained administrative inspection. Expansion will halt during record preservation, assessment of the harm, and preparations for reform or closure."
generic_inspect_active_site_effect_tt: "Freezes network expansion, opens the reform route, places the selected site under inspection, and imposes a temporary political and civilian burden."
generic_dismantle_detention_network: "Dismantle the Site in [FROM.GetName]"
generic_dismantle_detention_network_desc: "Freeze expansion and carry out a long closure operation. Output ends when the structures are removed. Unresolved records remain available to discovery, review, and redress."
generic_dismantle_detention_network_started_tt: "A long dismantlement operation begins in [FROM.GetName]. Losing control cancels the work without erasing responsibility or evidence."

generic_labor_project_cycle: "Labor Project Cycle"
generic_labor_project_cycle_desc: "Maintain responsibility and control of the selected active site, preserve motorized, train, and support-equipment reserves, and retain civilian factory capacity for construction until the project resolves."
generic_network_overstretch_crisis: "Network Overstretch Crisis"
generic_network_overstretch_crisis_desc: "Reduce overextension by allocating guards, ending projects, lowering quotas, or dismantling sites. Failure exposes the crisis and converts hidden evidence into public condemnation."
generic_retreat_evidence_crisis: "Retreat Evidence Crisis"
generic_retreat_evidence_crisis_desc: "Enemy proximity threatens an active site. Act before a failed retreat exposes its records and stored responsibility."
generic_reform_and_dismantlement: "Reform and Dismantlement Program"
generic_reform_and_dismantlement_desc: "Close every active site while bearing the political, industrial, and security costs of transition. A surviving site prevents a clean settlement."

camp_repression_network_overstretch: "Overstretched Repression Network"
camp_repression_network_overstretch_desc: "Guard, rail, supply, resistance, and concealment demands have outgrown the administration's capacity."
camp_democratic_legitimacy_crisis: "Democratic Legitimacy Crisis"
camp_democratic_legitimacy_crisis_desc: "Detention policy and concealed population damage have become incompatible with public law, coalition unity, and institutional trust."
camp_repression_reform_pressure: "Repression Reform Pressure"
camp_repression_reform_pressure_desc: "Courts, inspections, regime change, liberated records, and postwar obligations demand closure and accountability."
generic_detention_network_administration: "Detention Network Administration"
generic_detention_network_administration_desc: "A modest coercive administration supplies limited construction support and political control while accumulating hidden damage."
generic_expanded_labor_network: "Expanded Labor Network"
generic_expanded_labor_network_desc: "Broader quotas produce more output, but rail consumption, supply strain, resistance, and evidence grow with them."
generic_overextended_repression_network: "Overextended Repression Network"
generic_overextended_repression_network_desc: "The network's costs now consume much of the output it was built to extract."
generic_radicalized_atrocity_policy: "Radicalized Atrocity Policy"
generic_radicalized_atrocity_policy_desc: "The state has bound coercive administration to systematic mass violence. Reversal requires regime change or a costly dismantlement program."
generic_reform_pressure: "Legal and Institutional Review"
generic_reform_pressure_desc: "Officials, courts, inspectors, and successor authorities are forcing the network toward closure."
camp_rework_site_inspection_burden: "Site Inspection Administration"
camp_rework_site_inspection_burden_desc: "Inspectors, record preservation, relief access, and closure planning consume civilian resources and political authority while the selected site remains under review."
generic_reformed_legacy: "Dismantled Repression Legacy"
generic_reformed_legacy_desc: "Active operations have ended. Surviving records and redress obligations remain part of the state's political memory."

generic_reduce_labor_quotas: "Reduce Labor Quotas"
generic_reduce_labor_quotas_desc: "Curtail coerced labor allocations across the active network. Output falls, but population-loss pressure, resistance, and overextension ease while the order remains in force."
generic_reduce_labor_quotas_effect_tt: "Temporarily reduces labor output and monthly population-loss pressure while easing resistance and overextension."
camp_gui_selected_dismantlement_mission: "Selected Site Dismantlement"
camp_gui_selected_dismantlement_mission_desc: "Keep control of the selected site, halt expansion, and carry the closure burden until the structures are removed. Evidence and responsibility remain on record."

