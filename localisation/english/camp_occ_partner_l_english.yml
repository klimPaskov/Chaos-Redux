l_english:
camp_occ_partner.3.t: "German Deportation Orders"
camp_occ_partner.3.slo.d: "Berlin asks our gendarmes to gather the Jewish families of Slovakia and hand them over at the border for deportation to occupied Poland. Our officials are waiting for the government's answer.\n\nWe can let the transports leave, delay them, or refuse the demand."
camp_occ_partner.3.cro.d: "German officials want the surviving Jewish families in our towns and camps handed over for deportation to occupied Poland. Our police are waiting for orders.\n\nWe can let the transports leave, delay them, or refuse the demand."
camp_occ_partner.3.bul.d: "Berlin demands the deportation of the Jewish communities in the Macedonian and Thracian territories we occupy. Our police and army units have been told to gather families for the trains.\n\nThe government can permit the transports, delay them, or stop them."
camp_occ_partner.3.vic.d: "German officials demand that our police hand over Jewish families from the unoccupied zone for deportation to occupied Poland. Our ministers must decide whether the transports will leave.\n\nWe can obey, delay the trains, or refuse the demand."
camp_occ_partner.3.a: "Permit the transports"
camp_occ_partner.3.a.tt: "The deportation trains leave during the current German order."
camp_occ_partner.3.b: "Delay the trains"
camp_occ_partner.3.b.tt: "Only [?constant:camp_occ_partner_table.delay_share|%0] of each month's transport capacity is used. Germany resents the delay."
camp_occ_partner.3.c: "Stop the deportations"
camp_occ_partner.3.e: "The order has ended"
camp_occ_partner.3.e.tt: "This report cannot change the government's answer or restart the transports."
camp_occ_partner.4.t: "Deportation Trains Stopped"
camp_occ_partner.4.d: "The government of [camp_occ_halted_partner.GetName] has refused to hand over any more families for deportation. Its police have been ordered to stop the trains.\n\nThose still waiting in its provinces will be released at home."
camp_occ_partner.4.a: "They have refused our demand"
camp_occ_partner.4.a.tt: "No further transports leave this country under the German order."
camp_occ_partner_halt_transports: "Stop Deportation Trains"
camp_occ_partner_halt_transports_desc: "Order the police to stop handing families over to German officials. Berlin will retaliate against our government."
camp_occ_partner_halt_transports_waiting_tt: "People are still waiting for deportation in our provinces."
camp_occ_extended_partner_halt_effect_tt: "Stability [?constant:camp_occ_partner_response.halt_stability|%0], war support [?constant:camp_occ_partner_response.halt_war_support|%0]. Germany lowers its opinion of our government. A German subject also loses autonomy.\n$camp_occ_partner_halt_release_tt$"
camp_occ_partner_obstructed_transports: "Deportation trains delayed"
camp_occ_partner_halted_transports: "Deportation trains stopped"
camp_occ_partner_halt_autonomy: "German pressure after the transports were stopped"
camp_admin_history_extended_partner_halt: "Deportation trains halted"
