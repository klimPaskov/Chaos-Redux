l_english:
chaosx.nr25.1.t: "Antarctica Race"
chaosx.nr25.2.t: "Antarctica Race"
chaosx.nr25.2.d: "A strange craft has crashed deep in Antarctica. Its unknown machinery has drawn governments, corporations, and secret organizations into a race to reach the wreck and claim its technology."
chaosx.nr25.2.a: "The race begins!"

chaosx.nr25.3.t: "Antarctica Race Over"
chaosx.nr25.3.d: "We have secured the alien technology!"
chaosx.nr25.3.a: "We secured Antarctica!"

chaosx.news.25.t: "Alien Technology in Antarctica"
chaosx.news.25.d: "Reports from Antarctica confirm the crash landing of an unidentified flying object. Governments are dispatching expeditions to secure the site, investigate the craft, and claim the alien technology. Several nations are also sending troops to establish sovereignty over Antarctica."
chaosx.news.25.a: "The discovery is significant."

chaosx.news.26.t: "Antarctica Race Over"
chaosx.news.26.d: "[FROM.GetName] has won the race to the Antarctic wreck and taken the alien technology. The country now controls the only confirmed cache of the craft's machinery."
chaosx.news.26.a: "With great tech comes great responsibility"
