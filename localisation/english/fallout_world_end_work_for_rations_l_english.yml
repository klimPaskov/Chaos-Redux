chaosx.event_name.675: "The First Harvest Review"
chaosx.event_name.676: "Work for Rations Cleanup"
chaosx.fallout.670.t: "Work for Rations"
chaosx.fallout.670.d: "The Food Compact's harvest ledger has reached the point where empty fields and empty shelters are competing for the same hands. The harvest state of [?fallout_event_dispatch_issued_target.GetName] still has a usable reserve, but Air Winter has narrowed the safe work window. A universal duty roster can spread the burden across households. Paid labor can protect skilled crews. A refugee work program can bring displaced families into supervised fields. Mechanized harvest can spare people by spending the power and support equipment that keep the machines alive."
chaosx.fallout.670.a: "Assign a universal duty roster"
chaosx.fallout.670.b: "Protect a paid labor cadre"
chaosx.fallout.670.c: "Open a refugee work program"
chaosx.fallout.670.d: "Divert machinery to the harvest"
chaosx.fallout.670.a.tt: "Spend Food 3, Fuel 1, Scrap 1, and Recognition 1. After 35 days the state is graded on its food reserve, supply access, adaptation, reclamation, exposure, and disease pressure."
chaosx.fallout.670.b.tt: "Spend Food 4, Fuel 1, and 4 Command Power. Skilled crews improve production and cohesion, but the wider labor pool remains exposed if the reserve falls short."
chaosx.fallout.670.c.tt: "Spend Food 5, Shelter Capacity 3, Medicine 2, and Recognition 1. Displaced families gain a supervised work route that can improve integration and harvest recovery."
chaosx.fallout.670.d.tt: "Spend Fuel 6, Scrap 2, Power 4, and 2 Support Equipment. Machines reduce exposure and raise production resilience. When the harvest state's Adaptation is low, the result also adds maintenance pressure."
chaosx.fallout.672.t: "The Harvest Ledger Answers"
chaosx.fallout.672.universal.success.d: "The universal roster filled its morning and evening rotations in [?fallout_event_dispatch_issued_target.GetName]. Families shared the exposed rows, the Food Compact kept the field shelters supplied, and the first harvest arrived before the ash-dark frost closed the road."
chaosx.fallout.672.universal.partial.d: "The universal roster filled only the sheltered rows in [?fallout_event_dispatch_issued_target.GetName]. The Food Compact kept a reduced harvest, but the outer fields remained short of hands and the next weather window will be harder."
chaosx.fallout.672.universal.failure.d: "The universal roster broke apart in [?fallout_event_dispatch_issued_target.GetName]. Households refused the exposed rotation, the reserve was spoiled in storage, and the Deaths register records the shortage."
chaosx.fallout.672.paid.success.d: "The paid crews in [?fallout_event_dispatch_issued_target.GetName] held their tools through the cold shift. Their foremen protected the skilled work, the Food Compact received a reliable harvest, and the wider settlement accepted the wage ledger."
chaosx.fallout.672.paid.partial.d: "The paid crews in [?fallout_event_dispatch_issued_target.GetName] finished the sheltered rows but lost the night shift. Production held at a reduced rate, while unprotected households carried the remaining exposure."
chaosx.fallout.672.paid.failure.d: "The paid labor ledger in [?fallout_event_dispatch_issued_target.GetName] ran out before the field shelters could be staffed. The crews left the rows, the reserve fell, and the Deaths register records the shortage."
chaosx.fallout.672.refugee.success.d: "The refugee work program in [?fallout_event_dispatch_issued_target.GetName] turned the shelter queue into a harvest crew. Displaced families received food and medicine, the state gained a durable integration memory, and the Food Compact reopened its field route."
chaosx.fallout.672.refugee.partial.d: "The refugee work program in [?fallout_event_dispatch_issued_target.GetName] admitted families to the inner fields but could not staff the outer rows. Integration improved unevenly and the next ration call will test the agreement."
chaosx.fallout.672.refugee.failure.d: "The refugee work program in [?fallout_event_dispatch_issued_target.GetName] collapsed at the shelter gate. Medicine ran short, the work crews dispersed, and the Deaths register records the lost harvest."
chaosx.fallout.672.mechanized.success.d: "The machines reached the fields of [?fallout_event_dispatch_issued_target.GetName] before the frost. Power and support crews kept the harvest line moving, fewer people entered the exposed rows, and the Food Compact gained a stronger production reserve."
chaosx.fallout.672.mechanized.partial.d: "The machines reached only the sheltered fields of [?fallout_event_dispatch_issued_target.GetName]. The harvest line survived. When the harvest state's Adaptation is low, the next season inherits a maintenance burden."
chaosx.fallout.672.mechanized.failure.d: "The harvest machines in [?fallout_event_dispatch_issued_target.GetName] failed under ash and cold. Fuel and support equipment were spent without a stable crop, and the Deaths register records the shortage."
chaosx.fallout.672.a: "Record the harvest result"
chaosx.fallout.672.a.tt: "Carry this branch into the Food Compact's labor and Air Winter ledgers, then open the 270-day harvest review."
chaosx.fallout.674.t: "The First Harvest Review"
chaosx.fallout.674.success.d: "The first review in [?fallout_event_dispatch_issued_target.GetName] finds the harvest route still operating. The state has enough supply and reserve to preserve the work memory, although the next ash fall can still close the road."
chaosx.fallout.674.partial.d: "The first review in [?fallout_event_dispatch_issued_target.GetName] finds a reduced harvest route. Sheltered fields remain active, but disease pressure and supply gaps keep the outer work crews contested."
chaosx.fallout.674.failure.d: "The first review in [?fallout_event_dispatch_issued_target.GetName] finds the harvest route broken. The Food Compact keeps the branch record, but the field agreement is contested and the Deaths register records another bounded shortage."
chaosx.fallout.674.a: "Close the review"
chaosx.fallout.674.a.tt: "Settle the harvest review, preserve its branch memory, and close the work ledger."
fallout.event_log.work_for_rations.name: "Work for Rations"
fallout.event_log.work_for_rations.detail: "[GetFalloutEvent670EventLogDetail]"
fallout.event_log.work_for_rations.detail.universal_duty_success: "The universal duty roster filled the Food Compact's harvest rotations in the selected state."
fallout.event_log.work_for_rations.detail.universal_duty_partial: "The universal duty roster held only the sheltered harvest rows in the selected state."
fallout.event_log.work_for_rations.detail.universal_duty_failure: "The universal duty roster failed and the selected state's Deaths register recorded a harvest shortage."
fallout.event_log.work_for_rations.detail.paid_labor_success: "Paid crews protected the skilled harvest work and improved production in the selected state."
fallout.event_log.work_for_rations.detail.paid_labor_partial: "Paid crews held a reduced harvest while unprotected households carried the remaining exposure."
fallout.event_log.work_for_rations.detail.paid_labor_failure: "The paid labor ledger failed before the selected state's field shelters could be staffed."
fallout.event_log.work_for_rations.detail.refugee_work_program_success: "A refugee work program turned the shelter queue into a durable Food Compact harvest crew."
fallout.event_log.work_for_rations.detail.refugee_work_program_partial: "A refugee work program admitted families to the inner fields but left the outer rows short of hands."
fallout.event_log.work_for_rations.detail.refugee_work_program_failure: "The refugee work program collapsed at the shelter gate and the harvest route was lost."
fallout.event_log.work_for_rations.detail.mechanized_harvest_success: "Mechanized harvest reduced exposure and strengthened the selected state's production reserve."
fallout.event_log.work_for_rations.detail.mechanized_harvest_partial: "Mechanized harvest kept the sheltered fields operating. Maintenance pressure grows only when the harvest state's Adaptation is low."
fallout.event_log.work_for_rations.detail.mechanized_harvest_failure: "Mechanized harvest failed under ash and cold and the Deaths register recorded the shortage."
fallout.event_log.work_for_rations.detail.callback_success: "The first harvest review preserved the Work for Rations memory."
fallout.event_log.work_for_rations.detail.callback_partial: "The first harvest review left a reduced and contested Work for Rations route."
fallout.event_log.work_for_rations.detail.callback_failure: "The first harvest review failed and recorded another bounded shortage."
fallout.event_log.work_for_rations.detail.choice_universal_duty: "The country assigned a universal duty roster to the selected harvest state."
fallout.event_log.work_for_rations.detail.choice_paid_labor: "The country protected a paid labor cadre in the selected harvest state."
fallout.event_log.work_for_rations.detail.choice_refugee_work_program: "The country opened a refugee work program in the selected harvest state."
fallout.event_log.work_for_rations.detail.choice_mechanized_harvest: "The country diverted machinery to the selected harvest state."
fallout.event_log.work_for_rations.detail.cancelled: "The Work for Rations record was cancelled after its authenticated state or owner changed."
fallout.event_log.work_for_rations.detail.unknown: "The Work for Rations record has no recognized harvest outcome."
