l_english:
chaosx.fallout.296.t: "The Empty Ward"
chaosx.fallout.296.d: "The fever dormitory is quiet now, but its beds, drains, and cracked observation windows still occupy the country's scarce shelter space. [ROOT.GetAirWinterGovernmentAuthority] must decide whether the ward becomes a home for veterans, a research clinic, a memorial hall, or an empty room kept ready for the next emergency."
chaosx.fallout.296.a: "Give the ward to veterans"
chaosx.fallout.296.b: "Make it a research clinic"
chaosx.fallout.296.c: "Keep a memorial hall"
chaosx.fallout.296.d_option: "Leave the ward open and unused"
chaosx.fallout.296.a.tt: "Spend [?constant:fallout_event_296_cost.veteran_food|0] Food, [?constant:fallout_event_296_cost.veteran_medicine|0] Medicine, and [?constant:fallout_event_296_cost.veteran_scrap|0] Scrap. The delayed result weighs Cohesion, Medicine, Shelter, and the Deaths ledger."
chaosx.fallout.296.b.tt: "Spend [?constant:fallout_event_296_cost.research_medicine|0] Medicine, [?constant:fallout_event_296_cost.research_power|0] Power, and [?constant:fallout_event_296_cost.research_recognition|0] Recognition. The clinic can build research capacity while exposing the institution to scrutiny."
chaosx.fallout.296.c.tt: "Spend [?constant:fallout_event_296_cost.memorial_food|0] Food, [?constant:fallout_event_296_cost.memorial_medicine|0] Medicine, and [?constant:fallout_event_296_cost.memorial_recognition|0] Recognition. The memorial can give families a common room without erasing the fever memory."
chaosx.fallout.296.d_option.tt: "Spend [?constant:fallout_event_296_cost.leave_medicine|0] Medicine, [?constant:fallout_event_296_cost.leave_shelter|0] Shelter, and [?constant:fallout_event_296_cost.leave_scrap|0] Scrap. Keeping the ward open preserves capacity while asking the country to accept a quiet cost."

chaosx.fallout.298.t: "The Ward Finds Its Purpose"
chaosx.fallout.298.veteran.success.d: "The veterans scrubbed the dormitory, repaired the bed frames, and posted a duty roster beside the old fever chart. The ward now gives injured crews a place to recover without asking them to disappear from public life."
chaosx.fallout.298.veteran.partial.d: "The veteran home has a roof, a roster, and several repaired beds, but medicine could not cover every old injury. The country has made room for service while leaving the hardest cases in the queue."
chaosx.fallout.298.veteran.failure.d: "The veteran home opened before the drains and supply route were ready. A former patrol leader left with a sealed file and a public accusation that the country had turned service into another ration promise."
chaosx.fallout.298.research.success.d: "The clinic kept the fever records beside clean instruments and a working lamp. Its staff can compare exposure, sanitation, and recovery without turning the former dormitory into a private archive."
chaosx.fallout.298.research.partial.d: "The research clinic secured one bench and a narrow medicine cabinet. Its notes are useful, but power and recognition limits leave the outer shelters waiting for a result they can trust."
chaosx.fallout.298.research.failure.d: "The clinic treated its records as proof before it could treat the people who carried them. A failed test, a dark lamp, and a missing medicine crate have made the ward a warning about research without a public duty."
chaosx.fallout.298.memorial.success.d: "Families placed names, blankets, and the last clean ward chart in the same hall. The memorial does not promise that the fever will be forgotten. It gives the living one room where grief does not have to compete with a ration line."
chaosx.fallout.298.memorial.partial.d: "The memorial hall is open in the central shelter and closed in the outer rooms. Recognition has begun to gather around a common wall, while several families still carry their own list beyond the door."
chaosx.fallout.298.memorial.failure.d: "The memorial hall became a contest over whose fever memory deserved the first stone. The old ward remains standing, but the room has lost the trust needed to hold a country together."
chaosx.fallout.298.leave.success.d: "The ward stays empty, clean enough to receive a future emergency, and visible enough that no official can quietly claim the beds for a private faction. The country has chosen capacity over ceremony."
chaosx.fallout.298.leave.partial.d: "The ward is open on paper and dark in practice. Some beds are ready, but the outer shelters cannot rely on the supply route when the next fever or winter injury arrives."
chaosx.fallout.298.leave.failure.d: "Leaving the ward untouched preserved its walls and lost its purpose. Dust, disputed keys, and a silent medicine cabinet have turned emergency capacity into another source of suspicion."
chaosx.fallout.298.a: "Record the ward decision"
chaosx.fallout.298.a.tt: "Apply the selected ward result, write one Event Log memory, and schedule the institution callback after [?constant:fallout_event_296_timing.callback_delay_days|0] days. Failure uses the Deaths contract."

chaosx.fallout.300.t: "The Ward After One Season"
chaosx.fallout.300.success.d: "The former dormitory has become an institution the country can name. Its doors have a keeper, its records have a home, and the next emergency will not begin with a room that everyone remembers but nobody owns."
chaosx.fallout.300.partial.d: "The ward has a durable purpose in the central shelter, although the outer rooms still borrow its records and supplies. The institution exists, yet the country has not finished making it common."
chaosx.fallout.300.failure.d: "The callback found the ward without a stable keeper or a dependable supply route. The fever memory remains, but the empty beds have become another promise that scarcity can break."
chaosx.fallout.300.a: "Close the institution record"
chaosx.fallout.300.a.tt: "Apply the ward callback, record durable institution memory, and release both delayed Fallout receipts. Failure uses the callback Deaths contract."

fallout.event_log.empty_ward.name: "The Empty Ward"
fallout.event_log.empty_ward.detail: "[GetFalloutEvent296EventLogDetail]"
fallout.event_log.empty_ward.detail.veteran_success: "A veteran home gave injured crews a staffed place to recover beside the former fever dormitory."
fallout.event_log.empty_ward.detail.veteran_partial: "A veteran home opened with repaired beds but left the hardest injuries in the medicine queue."
fallout.event_log.empty_ward.detail.veteran_failure: "A veteran home opened before its drains and supply route were ready, turning service into a public accusation."
fallout.event_log.empty_ward.detail.research_success: "A research clinic kept fever records beside clean instruments and a public duty to the shelters."
fallout.event_log.empty_ward.detail.research_partial: "A research clinic secured one bench while power and recognition limits left outer shelters waiting."
fallout.event_log.empty_ward.detail.research_failure: "A failed test and a missing medicine crate made the research clinic a warning about private proof."
fallout.event_log.empty_ward.detail.memorial_success: "A memorial hall gave families one room where grief did not compete with a ration line."
fallout.event_log.empty_ward.detail.memorial_partial: "A memorial hall gathered names in the central shelter while outer families kept separate lists."
fallout.event_log.empty_ward.detail.memorial_failure: "A memorial hall became a contest over whose fever memory deserved the first stone."
fallout.event_log.empty_ward.detail.leave_success: "An empty ward stayed clean, visible, and ready for a future emergency."
fallout.event_log.empty_ward.detail.leave_partial: "An open ward kept some beds ready, but outer shelters could not trust its supply route."
fallout.event_log.empty_ward.detail.leave_failure: "An untouched ward lost its purpose to dust, disputed keys, and a silent medicine cabinet."
fallout.event_log.empty_ward.detail.callback_success: "The former dormitory became an institution with a keeper, records, and a place in the next emergency plan."
fallout.event_log.empty_ward.detail.callback_partial: "The ward gained a durable purpose in the central shelter while outer rooms still borrowed its supplies."
fallout.event_log.empty_ward.detail.callback_failure: "The callback found the ward without a stable keeper or dependable supply route."

fallout_empty_ward_veteran: "Veteran Ward"
fallout_empty_ward_veteran_desc: "A staffed veteran home turns an empty fever ward into a public recovery institution."
fallout_empty_ward_research: "Ward Research Clinic"
fallout_empty_ward_research_desc: "A research clinic keeps exposure and sanitation records beside a public medical duty."
fallout_empty_ward_memorial: "Ward Memorial Hall"
fallout_empty_ward_memorial_desc: "A memorial hall gives families a common room for names and grief."
fallout_empty_ward_leave: "Reserved Empty Ward"
fallout_empty_ward_leave_desc: "An empty ward remains clean and visible as emergency capacity."
fallout_empty_ward_maintained: "Maintained Ward Institution"
fallout_empty_ward_maintained_desc: "A maintained institution gives the next emergency a keeper, records, and a supply route."
fallout_empty_ward_failed: "Ward Institution Strain"
fallout_empty_ward_failed_desc: "A strained institution leaves beds, records, and medicine exposed to another public failure."
