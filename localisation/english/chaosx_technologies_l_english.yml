# Individual Technologies
anthrax_bomb_delivery_systems: "Anthrax Bomb Delivery Systems"
anthrax_bomb_delivery_systems_short: "Anthrax Bombs"
anthrax_bomb_delivery_systems_desc: "Facility-led anthrax weaponization programs finalize munitions-compatible payload integration and deployment doctrine. This technology is unlocked through biowarfare special projects."

plague_bomb_delivery_systems: "Plague Bomb Delivery Systems"
plague_bomb_delivery_systems_short: "Plague Bombs"
plague_bomb_delivery_systems_desc: "Advanced containment and dispersal engineering for plague payloads, intended for dedicated strategic delivery. This technology is unlocked through biowarfare special projects."

tularemia_bomb_delivery_systems: "Tularemia Bomb Delivery Systems"
tularemia_bomb_delivery_systems_short: "Tularemia Bombs"
tularemia_bomb_delivery_systems_desc: "Specialized tularemia payload preparation and release standards for battlefield and strategic employment. This technology is unlocked through biowarfare special projects."

smallpox_bomb_delivery_systems: "Smallpox Bomb Delivery Systems"
smallpox_bomb_delivery_systems_short: "Smallpox Bombs"
smallpox_bomb_delivery_systems_desc: "Highly restricted smallpox payload handling and deployment protocols with strict strategic controls. This technology is unlocked through biowarfare special projects."
chaos_battalion_tech: "Chaos Assault Battalion"
chaos_battalion_tech_desc: "Protected assault training, respirator discipline, route marking, and specialist logistics make the Chaos Assault Battalion available. The formation carries no universal chemical or biological payload. Offensive CBRN effects remain prepared operations."

chaos_battalion_1939: "Chaos Assault Battalion"
chaos_battalion_1939_desc: "The protected assault framework coordinates specialist infantry, respirator issue, decontamination teams, and mobile detection without treating the battalion itself as an agent stockpile."

chaos_battalion_1942: "Improved Chaos Assault Equipment"
chaos_battalion_1942_desc: "Late-war assault drills and breaching equipment improve Chaos Assault Battalion organization and breakthrough."

hazard_pioneer_formation: "Hazard Pioneer Training"
hazard_pioneer_formation_desc: "Engineer training prepares CBRN Protection Companies to mark contaminated lanes and support assaults through defended urban and fortified terrain."

chemical_artillery_shells: "Chemical Artillery Shells"
chemical_artillery_shells_desc: "Filling, sealing, transport, and firing standards organize chemical shell lots and make Chemical Ammunition Trains available. Agent stock remains a separate operational payload."

persistent_agent_shell_filling: "Persistent Agent Shell Filling"
persistent_agent_shell_filling_desc: "Sealing, filling, and handling standards make prepared persistent-agent fire plans possible. Each authorized plan selects and draws its chosen agent from the national arsenal."

armored_agent_delivery: "Armored Agent Delivery"
armored_agent_delivery_desc: "Protected fittings and release equipment make light, medium, and heavy flame-role chassis available as consolidated armored chemical-delivery detachments. Payload selection remains an operation-level decision."

sealed_tank_crews: "Sealed Tank Crews"
sealed_tank_crews_desc: "Filtered crew compartments, respirator drills, and protected maintenance routines reduce friendly crew exposure during authorized armored chemical-delivery operations, but increase the protective-equipment burden of sealed operations."

nerve_agent_suppression_formation: "Nerve Agent Delivery Certification"
nerve_agent_suppression_formation_desc: "Specialist certification prepares protected delivery and security formations for authorized nerve-agent operations. Each operation draws a selected agent and records deaths, contamination, trauma, evidence, attribution, and diplomatic consequences."

field_epidemiology_teams: "Field Epidemiology Teams"
field_epidemiology_teams_desc: "Mobile sampling, case tracing, and quarantine training make CBRN Field Medical Companies available for outbreak detection and protected treatment."

mobile_cbrn_hospitals: "Mobile CBRN Hospitals"
mobile_cbrn_hospitals_desc: "Protected treatment stations, transport, and mass-casualty sorting improve the recovery and experience retention of CBRN Field Medical Companies during chemical and biological emergencies."

biological_security_assault_formation: "Biological Security Assault Formation"
biological_security_assault_formation_desc: "Specialist training makes Biological Security Assault Detachments available to enter suspect laboratories and stockpiles, preserve evidence, isolate hazards, and prevent a capture operation from releasing an agent."

pathogen_handling_protocols: "Pathogen Handling Protocols"
pathogen_handling_protocols_desc: "Standardized handling and sterilization procedures reduce accidents in storage and preparation.\n\nBioweapon stockpile lab accident chance: §G-50%§!."

sealed_containment_laboratories: "Sealed Containment Laboratories"
sealed_containment_laboratories_desc: "Sealed workspaces, restricted access, and systematic decontamination sharply reduce containment failures.\n\nBioweapon stockpile lab accident chance: §G-75%§!."

fail_safe_containment_facilities: "Fail-Safe Containment Facilities"
fail_safe_containment_facilities_desc: "Purpose-built containment complexes with fail-safe isolation measures. Stockpile accidents are prevented entirely.\n\nBioweapon stockpile lab accidents: §GImpossible§!."

bio_surveillance_networks: "Bio-Surveillance Networks"
bio_surveillance_networks_desc: "National disease reporting networks and standardized incident monitoring improve early detection and local response coordination.\n\nOutbreak chance: §GReduced slightly§!."

rapid_outbreak_response: "Rapid Outbreak Response"
rapid_outbreak_response_desc: "Specialized response units, quarantine drills, and emergency logistics improve containment during first-wave outbreaks.\n\nOutbreak chance: §GReduced§!."

integrated_epidemic_control: "Integrated Epidemic Control"
integrated_epidemic_control_desc: "Integrated national response doctrine unifies surveillance, medical triage, and rapid intervention into a stable anti-epidemic framework.\n\nOutbreak chance: §GReduced significantly§!."

zombie_disease_bomb_delivery_systems: "Weaponized Zombie Delivery Systems"
zombie_disease_bomb_delivery_systems_desc: "Dedicated dispersal systems, storage protocols, and delivery casings for the deployment of tailored zombie payloads. Completing the project unlocks production of weaponized zombie bombs for raid use."

# Livens Projector Technologies
livens_projector_tech: "Livens Projector"
livens_projector_tech_desc: "Captain William Livens developed this simple but effective mortar-like weapon in 1916. Standardized launch equipment makes a consolidated Chemical Projector Battery available. A prepared operation selects and draws its agent payload."

improved_livens_projector: "Improved Livens Projector"
improved_livens_projector_desc: "Enhanced Livens projector design with better electrical firing mechanisms and improved range. These improvements were developed during 1918 after extensive battlefield experience showed the weapon's effectiveness."

advanced_livens_projector: "Advanced Livens Projector"  
advanced_livens_projector_desc: "Modern refinements to the Livens projector system using improved materials and precision manufacturing. These advanced projectors offer superior reliability and accuracy for chemical warfare operations."

# Choking Agents
chlorine_gas: "Chlorine Gas"
chlorine_gas_desc: "One of the first chemical weapons used in World War I. Chlorine gas causes severe respiratory damage and was first deployed by German forces in 1915 at the Second Battle of Ypres.\n\nUnlocks chlorine payload production and eligible delivery modules. Consolidated delivery formations select chlorine only when a prepared operation reserves and consumes it."

phosgene: "Phosgene"
phosgene_desc: "A highly toxic choking agent that was responsible for about 85% of chemical weapon deaths in World War I. Phosgene is more deadly than chlorine but less detectable.\n\nUnlocks phosgene payload production and eligible delivery modules. Consolidated delivery formations select phosgene only when a prepared operation reserves and consumes it."

# Blister Agents
mustard_gas: "Mustard Gas"
mustard_gas_desc: "A powerful chemical weapon that causes severe chemical burns and blistering. First used by Germany in 1917, mustard gas became one of the most feared weapons of World War I.\n\nUnlocks mustard payload production and eligible delivery modules. Consolidated delivery formations select mustard only when a prepared operation reserves and consumes it."

lewisite: "Lewisite"
lewisite_desc: "An organoarsenic chemical weapon developed near the end of World War I. Lewisite causes immediate pain and tissue damage, making it both a blister and systemic agent.\n\nUnlocks lewisite payload production and eligible delivery modules. Consolidated delivery formations select lewisite only when a prepared operation reserves and consumes it."

dimercaprol: "Dimercaprol"
dimercaprol_desc: "Emergency chelation treatment protocols improve survival after arsenical and blister-agent exposure. Dimercaprol reduces deaths from every accepted chemical exposure by §G15%§! and medical saturation by §G15%§!. Against blister agents such as Mustard and Lewisite, the remaining death toll is reduced by a further §G20%§!."

# Nerve Agents
tabun: "Tabun (GA)"
tabun_name: "Tabun (GA)"
tabun_desc: "$tabun_name$\n\nGateway prerequisite for the G-series special-project branch. This project represents foundational work on $tabun_name$ and is required before sarin (GB) development can begin. It does not provide direct battlefield unlocks."

sarin: "Sarin"
sarin_desc: "A second-generation G-series nerve agent (GB) available only through dedicated facility special-project research. Sarin is extremely potent but non-persistent, emphasizing tactical short-window effects.\n\nUnlocks sarin payload production and eligible delivery modules. Any employment requires an authorized prepared operation and produces a severe consequence record."

soman: "Soman"
soman_desc: "An advanced G-series nerve agent (GD) available only through late-war facility special-project research. Soman offers the strongest immediate tactical impact while remaining short-lived in open conditions.\n\nUnlocks soman payload production and eligible delivery modules. Any employment requires an authorized prepared operation and produces a severe consequence record."

