l_english:
chaosx.fallout.164.t: "The Animal Feed Debate"
chaosx.fallout.164.d: "The sealed feed room in the selected state holds one of the last measurable Air Winter reserves. [ROOT.GetAirWinterGovernmentOfficial] can release it to the kitchens, protect breeding stock for the next season, or divide the sacks between regional depots. [ROOT.GetAirWinterGovernmentAuthority] will have to answer for the districts that receive only a promise."
chaosx.fallout.164.a: "Feed the kitchens first"
chaosx.fallout.164.a.tt: "Spend §Y[?constant:fallout_event_164_cost.feed_people|0]§! Food Security and review the kitchen issue after §Y[?constant:fallout_event_164_timing.result_delay_days|0] days§!. A strong result improves the food ledger and records a conversion memory in [?fallout_event_164_feed_state_id.GetName]."
chaosx.fallout.164.b: "Protect breeding stock"
chaosx.fallout.164.b.tt: "Spend §Y[?constant:fallout_event_164_cost.preserve_breeding|0]§! Food Security to reserve animals and seed stock. The result depends on adaptation in [?fallout_event_164_feed_state_id.GetName], then returns for a first-harvest review."
chaosx.fallout.164.c: "Divide the reserve by region"
chaosx.fallout.164.c.tt: "Spend §Y[?constant:fallout_event_164_cost.divide_by_region|0]§! Food Security and split the feed between regional depots. A strong division uses reclamation work to keep the first harvest supplied."

chaosx.fallout.166.t: "The Kitchen Feed Review"
chaosx.fallout.166.success.d: "The kitchens in [?fallout_event_164_feed_state_id.GetName] received a measured share before the frost closed the road. [ROOT.GetAirWinterGovernmentOfficial] tied each issue to a household count, and [ROOT.GetAirWinterGovernmentAuthority] can show where the reserve became food rather than a guarded sack."
chaosx.fallout.166.partial.d: "The kitchen issue in [?fallout_event_164_feed_state_id.GetName] reached the central wards, but the outer shelters received thinner bowls. The conversion ledger is real, although district clerks disagree about who was counted first."
chaosx.fallout.166.failure.d: "The feed room in [?fallout_event_164_feed_state_id.GetName] lost its measure before the kitchens could organize. Empty tins and a short ration line are now entered beside the deaths ledger, while [ROOT.GetAirWinterGovernmentAuthority] faces a grievance that will not thaw with the road."
chaosx.fallout.166.a: "Open the breeding and harvest review"
chaosx.fallout.166.a.tt: "Resolve the kitchen feed result, preserve its memory, and schedule a first-harvest callback in §Y[?constant:fallout_event_164_timing.callback_delay_days|0] days§!."

chaosx.fallout.167.t: "The Breeding Reserve Review"
chaosx.fallout.167.success.d: "The breeding reserve in [?fallout_event_164_feed_state_id.GetName] survived the first cold cycle. Handlers kept enough animals and seed stock apart from the emergency kitchens, and [ROOT.GetAirWinterGovernmentOfficial] has a list that can support a second season."
chaosx.fallout.167.partial.d: "The breeding reserve in [?fallout_event_164_feed_state_id.GetName] protected the strongest stock, but several shelters received feed only after their animals had failed. The reserve is not empty, though the district bargain has become visible."
chaosx.fallout.167.failure.d: "The breeding plan in [?fallout_event_164_feed_state_id.GetName] consumed its reserve without preserving a viable herd. The kitchen line shortened for one night, then the losses reached the shelters and the Deaths ledger recorded the cost."
chaosx.fallout.167.a: "Send the stock list to the harvest review"
chaosx.fallout.167.a.tt: "Resolve the breeding result, preserve its memory, and schedule the first-harvest callback."

chaosx.fallout.168.t: "The Regional Feed Review"
chaosx.fallout.168.success.d: "The divided depots in [?fallout_event_164_feed_state_id.GetName] shared a common measure. Reclamation crews moved sacks along the thawing route, and [ROOT.GetAirWinterGovernmentAuthority] can compare each regional issue without hiding the distance."
chaosx.fallout.168.partial.d: "The regional split in [?fallout_event_164_feed_state_id.GetName] kept two depots open and left the third to barter. The map is more honest than the ration promise, and the first harvest will inherit that uneven start."
chaosx.fallout.168.failure.d: "The divided reserve in [?fallout_event_164_feed_state_id.GetName] became three short ledgers before the convoy could return. The outer depot lost people to the shortage, while [ROOT.GetAirWinterGovernmentOfficial] marked the route as a failed reclamation claim."
chaosx.fallout.168.a: "Carry the depot result into the harvest review"
chaosx.fallout.168.a.tt: "Resolve the regional feed result, preserve its memory, and schedule the first-harvest callback."

chaosx.fallout.172.t: "The First Harvest Callback"
chaosx.fallout.172.success.d: "The first harvest in [?fallout_event_164_feed_state_id.GetName] produced enough to repay the feed decision. [ROOT.GetAirWinterGovernmentOfficial] can reopen the reserve book, and [ROOT.GetAirWinterGovernmentAuthority] has a food policy that the surviving districts recognize."
chaosx.fallout.172.partial.d: "The first harvest in [?fallout_event_164_feed_state_id.GetName] produced a usable crop, but the return was too narrow to erase the winter dispute. The reserve can continue, although every district now knows which promise was not met."
chaosx.fallout.172.failure.d: "The first harvest in [?fallout_event_164_feed_state_id.GetName] failed under frost, ash, or an empty breeding line. The last feed ledger is closed with another food loss, and [ROOT.GetAirWinterGovernmentAuthority] must carry that memory into the next ration choice."
chaosx.fallout.172.a: "Seal the feed decision in the state books"
chaosx.fallout.172.a.tt: "Resolve the first-harvest callback, record the final Fallout memory, and release the delayed cleanup receipt."

fallout.event_log.animal_feed.name: "The Animal Feed Debate"
fallout.event_log.animal_feed.detail: "[GetFalloutEvent164EventLogDetail]"
fallout.event_log.animal_feed.detail.people_success: "Kitchen crews converted the state feed reserve into measured meals before the first hard frost."
fallout.event_log.animal_feed.detail.people_partial: "Kitchen crews reached the central wards, but thinner bowls and disputed counts left a food grievance."
fallout.event_log.animal_feed.detail.people_failure: "The kitchen issue failed before the reserve could be measured, and deaths entered the feed ledger."
fallout.event_log.animal_feed.detail.breeding_success: "Handlers protected breeding stock and seed, giving the state a credible second-season plan."
fallout.event_log.animal_feed.detail.breeding_partial: "The strongest stock survived, while outer shelters paid for the reserve kept apart from the kitchens."
fallout.event_log.animal_feed.detail.breeding_failure: "The breeding reserve failed to produce a viable line, and the shortage reached the shelters."
fallout.event_log.animal_feed.detail.division_success: "Regional depots shared one measure and used reclamation routes to keep the first harvest supplied."
fallout.event_log.animal_feed.detail.division_partial: "Two depots stayed open while a third bargained for feed, leaving a visible regional split."
fallout.event_log.animal_feed.detail.division_failure: "The divided reserve became three short ledgers, and the outer depot recorded deaths before the convoy returned."
fallout.event_log.animal_feed.detail.callback_success: "The first harvest repaid the feed decision and reopened a recognized state reserve book."
fallout.event_log.animal_feed.detail.callback_partial: "The first harvest was usable but too narrow to erase the winter dispute between districts."
fallout.event_log.animal_feed.detail.callback_failure: "The first harvest failed and left a food loss that the government must carry into the next ration choice."
