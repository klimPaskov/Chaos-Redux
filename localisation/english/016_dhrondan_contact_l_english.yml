l_english:
sp_dhrondan_envoy_craft: "D’Rhondan Envoy Craft"
sp_dhrondan_envoy_craft_desc: "Plans recovered with the impossible alloys describe a vessel capable of following the D’Rhondan signal beyond Earth. Building it requires operational command of alien arms, rocketry, advanced materials, high-energy systems, and computation."
dhrondan_envoy_craft_complete_tt: "The D’Rhondan envoy craft is ready for an interstellar expedition."

dhrondan_contact_category: "The D’Rhondan Accord"
dhrondan_contact_category_desc: "The pact has brought alien cohorts into our territory. Each arrival strengthens their presence and tests the terms that hold the alliance together."
dhrondan_contact_status_header: "Alien Presence: [?dhrondan_alien_presence|0]  |  Pact Strain: [?dhrondan_pact_strain|0]"
dhrondan_contact_status_header_desc: "Successful landings increase Alien Presence and Pact Strain. If enough cohorts arrive while the world descends into chaos, the D’Rhondan host may decide that our authority has become an obstacle."

dhrondan_send_kruger_to_dhronda: "Send Kruger to D’Rhonda"
dhrondan_send_kruger_to_dhronda_desc: "Authorize Doctor Warren Kruger to follow the envoy craft to the D’Rhondan homeworld. The 180-day expedition costs £pol_power §Y50§! Political Power and £fuel_texticon §Y500§! fuel. Kruger will leave every public and scientific post until he returns."
dhrondan_send_mengele_to_dhronda: "Send the Directorate Envoy to D’Rhonda"
dhrondan_send_mengele_to_dhronda_desc: "Send a Directorate delegation through the recovered corridor. The 180-day expedition costs £pol_power §Y50§! Political Power and £fuel_texticon §Y500§! fuel, and its agreement will remain independent of Kruger."
dhrondan_expedition_fuel_cost_tt: "Requires at least £fuel_texticon §Y500§!."
dhrondan_send_kruger_to_dhronda_effect_tt: "Kruger leaves his posts for a §Y180-day§! expedition. The Directorate gains §Y10 Mandate§!, §Y10 Dependence§!, §Y5 Exposure§!, and §Y10 Independent Capacity§!, while §YGrievance falls by 5§!."
dhrondan_send_mengele_to_dhronda_effect_tt: "The Directorate envoy departs for §Y180 days§!. Kruger and his Directorate measures remain unchanged."

dhrondan_kruger_expedition_mission: "Kruger’s D’Rhondan Expedition"
dhrondan_kruger_expedition_mission_desc: "Kruger and the rebuilt craft are crossing a route known only through alien telemetry. If he returns after 180 days, he will resume his posts and present the D’Rhondan pact."
dhrondan_mengele_expedition_mission: "The Directorate’s D’Rhondan Expedition"
dhrondan_mengele_expedition_mission_desc: "The Directorate delegation is crossing the alien route under its own authority. If it returns after 180 days, the Directorate will hold an agreement independent of Kruger."

dhrondan_honor_accord: "Honor the D’Rhondan Accord"
dhrondan_honor_accord_desc: "Spend £pol_power §Y75§! Political Power to release disputed stores, recognize the landing enclaves, and settle the latest breach of protocol."
dhrondan_honor_accord_effect_tt: "Reduce §YPact Strain§! by §G10§!. This action cannot be repeated for §Y180 days§!."

dhrondan_rebellion_pulse_mission: "D’Rhondan Allegiance in Question"
dhrondan_rebellion_pulse_mission_desc: "The cohorts will decide within 90 days. Revolt chance is §Y10%§! at six or seven arrivals with Chaos 600–799. It rises to §Y20%§! at eight or nine arrivals, Pact Strain 50, or Chaos 800+. Ten or more arrivals with Chaos 800+ raise it to §R40%§!."

chaosx.nr16.40.t: "A Craft for the Far Signal"
chaosx.nr16.40.d: "The final hull closes around a machine that resembles no aircraft built on Earth. Its instruments have found the D’Rhondan signal and traced a corridor beyond the known sky. The craft can carry an envoy, but the journey will take its passenger away from every earthly office."
chaosx.nr16.40.a: "Prepare the expedition."
chaosx.nr16.40.a.tt: "We may authorize a 180-day D’Rhondan expedition for £pol_power §Y50§! Political Power and £fuel_texticon §Y500§! fuel."

chaosx.nr16.41.t: "Beyond the Last Station"
chaosx.nr16.41.kruger.d: "Kruger surrendered his papers, closed his laboratory office, and boarded the rebuilt craft before dawn. The vessel rose without contrail or engine thunder, then vanished from every tracking screen at the same instant. For the next 180 days, the Directorate must continue without him."
chaosx.nr16.41.mengele.d: "The Directorate sealed its delegation aboard the rebuilt craft and erased the launch schedule from ordinary channels. The vessel crossed the upper atmosphere in silence, leaving only a brief distortion on the tracking screens. The delegation must secure an agreement under its own authority."
chaosx.nr16.41.a: "Watch the silent sky."

chaosx.nr16.42.t: "Audience Beneath Two Suns"
chaosx.nr16.42.kruger.d: "Kruger’s transmission arrives with the light of an unfamiliar double star behind him. The D’Rhondan court has recognized his mandate and accepted the terms carried from Earth. Their answer is formal, guarded, and unmistakably favorable. The envoy craft has already begun its return."
chaosx.nr16.42.mengele.d: "The Directorate’s transmission opens on a hall cut from black crystalline stone. D’Rhondan witnesses have accepted the delegation’s terms and recognized its authority independently of Kruger. The envoy craft is returning with the sealed articles of agreement."
chaosx.nr16.42.a: "Receive the pact."
chaosx.nr16.42.a.tt: "The D’Rhondan pact is established, unlocking alien laser production and controlled landings."

chaosx.nr16.43.t: "The Envoy Returns"
chaosx.nr16.43.kruger.d: "The craft descends into its sealed field with Kruger standing behind the forward glass. He returns to the same offices he left, carrying a pact that permits alien laser production and controlled D’Rhondan landings. The Directorate gains 5 Mandate, 5 Dependence, and 5 Independent Capacity."
chaosx.nr16.43.mengele.d: "The craft returns with the Directorate delegation and a sealed D’Rhondan pact independent of Kruger. Alien laser production and controlled landings may begin under its terms."
chaosx.nr16.43.a: "Open the landing protocols."
chaosx.nr16.43.a.tt: "Unlock alien laser production and controlled D’Rhondan landings."

chaosx.nr16.44.t: "A Cohort from the Burning Sky"
chaosx.nr16.44.d: "The descending craft turns the night above the selected state into a sheet of white fire. When the glare recedes, a full D’Rhondan cohort stands in ordered ranks beside the cooling hull. Their weapons face the horizon as their officers record the ground among the pact’s landing enclaves."
chaosx.nr16.44.a: "Record the landing."
chaosx.nr16.44.a.tt: "The cohort joins our forces. Alien Presence rises by 1 and Pact Strain rises by 5."

chaosx.nr16.45.t: "The Corridor Closes"
chaosx.nr16.45.kruger.d: "The expedition’s last signal breaks apart before it reaches the far end of the corridor. Recovery instruments find no surviving path and no D’Rhondan reply. Kruger resumes his former roles where possible, and the pact remains unsigned."
chaosx.nr16.45.mengele.d: "The Directorate’s signal dissolves into static before the delegation reaches a recognized audience. No agreement returns through the failed corridor, and Kruger remains unaffected."
chaosx.nr16.45.a: "Close the expedition file."
chaosx.nr16.45.a.tt: "This expedition grants no D’Rhondan pact or alien-contact access."

chaosx.nr16.46.t: "Terms Spoken in Formation"
chaosx.nr16.46.d: "D’Rhondan officers have stopped sending routine acknowledgements through the pact channels. Their cohorts gather at the edges of the landing grounds and compare our orders against clauses written beneath another sun. In a world already bent by chaos, they may soon decide that obedience is no longer required."
chaosx.nr16.46.a: "Count every cohort."
chaosx.nr16.46.a.tt: "D’Rhondan allegiance will be tested in 90 days while at least six cohorts have landed, Pact Strain is at least 30, and global chaos is at least 600."

chaosx.nr16.47.t: "The Host Rejects Our Authority"
chaosx.nr16.47.d: "The answer arrives through every alien command channel at once. D’Rhondan formations turn their weapons toward our depots, landing enclaves raise the imperial standard, and the pact’s language is recited as a declaration of sovereignty. The Empire of D’Rhonda has begun its revolt."
chaosx.nr16.47.a: "The pact has become a border."
chaosx.nr16.47.a.tt: "D’Rhonda takes every marked landing state we still own. Occupied enclaves become D’Rhondan claims."
