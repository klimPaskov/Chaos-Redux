l_english:
 bio_sabotage_anthrax: "Seed Anthrax Through Public Supply Chains"
 bio_sabotage_anthrax_desc: "Compartmentalized teams will penetrate food depots, water handling points, and medical distribution routes in [FROM.GetName]. Anthrax favors durable contamination around industrial and logistical systems. A failed penetration can still leave evidence behind."
 bio_sabotage_plague: "Seed Plague Through Public Supply Chains"
 bio_sabotage_plague_desc: "Compartmentalized teams will seed plague through food, water, and medical distribution routes in [FROM.GetName]. Dense population centers offer the strongest transmission conditions, but any discovery will carry grave political consequences."
 bio_sabotage_tularemia: "Seed Tularemia Through Public Supply Chains"
 bio_sabotage_tularemia_desc: "Compartmentalized teams will introduce tularemia into food, water, and medical supply routes serving [FROM.GetName]. Military concentrations and supply corridors are especially vulnerable to disruption and delayed detection."
 bio_sabotage_smallpox: "Seed Smallpox Through Public Supply Chains"
 bio_sabotage_smallpox_desc: "Compartmentalized teams will penetrate food, water, and medical distribution routes in [FROM.GetName] with smallpox material. Large urban populations offer catastrophic spread potential and severe blowback if attribution is established."

 bio_sabotage_anthrax_target_tt: "Select a populated foreign state with a viable industrial, port, supply, or biological-research network and no active anthrax episode. Allies, subjects, wastelands, and zombie-controlled states are excluded."
 bio_sabotage_plague_target_tt: "Select a populated foreign capital or major urban state with no active plague episode. Allies, subjects, wastelands, and zombie-controlled states are excluded."
 bio_sabotage_tularemia_target_tt: "Select a populated foreign state containing divisions or a supply node and no active tularemia episode. Allies, subjects, wastelands, and zombie-controlled states are excluded."
 bio_sabotage_smallpox_target_tt: "Select a populous foreign capital or metropolitan state with no active smallpox episode. Allies, subjects, wastelands, and zombie-controlled states are excluded."

 bio_sabotage_anthrax_requirements_tt: "Requires the Anthrax Bomb project, Operational Chemical Readiness, authorized biological use policy, an authenticated CBRN program, 10 Anthrax Payloads, 40 Support Equipment, 12 Command Power, and no other sabotage operation or cooldown."
 bio_sabotage_plague_requirements_tt: "Requires the Plague Bomb project, Operational Chemical Readiness, authorized biological use policy, an authenticated CBRN program, 12 Plague Payloads, 50 Support Equipment, 15 Command Power, and no other sabotage operation or cooldown."
 bio_sabotage_tularemia_requirements_tt: "Requires the Tularemia Bomb project, Operational Chemical Readiness, authorized biological use policy, an authenticated CBRN program, 10 Tularemia Payloads, 40 Support Equipment, 12 Command Power, and no other sabotage operation or cooldown."
 bio_sabotage_smallpox_requirements_tt: "Requires the Smallpox Bomb project, Operational Chemical Readiness, authorized biological use policy, an authenticated CBRN program, 8 Smallpox Payloads, 60 Support Equipment, 20 Command Power, and no other sabotage operation or cooldown."

 bio_sabotage_anthrax_begin_tt: "Commit 10 Anthrax Payloads, 40 Support Equipment, and 12 Command Power immediately. The material cannot be recovered if the operation fails or is cancelled."
 bio_sabotage_plague_begin_tt: "Commit 12 Plague Payloads, 50 Support Equipment, and 15 Command Power immediately. The material cannot be recovered if the operation fails or is cancelled."
 bio_sabotage_tularemia_begin_tt: "Commit 10 Tularemia Payloads, 40 Support Equipment, and 12 Command Power immediately. The material cannot be recovered if the operation fails or is cancelled."
 bio_sabotage_smallpox_begin_tt: "Commit 8 Smallpox Payloads, 60 Support Equipment, and 20 Command Power immediately. The material cannot be recovered if the operation fails or is cancelled."

 bio_sabotage_cancelled_tt: "The penetration network is abandoned. Every committed payload and item of support equipment is lost, the spent Command Power is not returned, and traces of the attempt may survive."
 bio_sabotage_resolution_success_tt: "The supply-chain penetration succeeds. The selected state enters the biological incubation, detection, attribution, spread, treatment, death, contamination, medical-saturation, evidence, and Condemnation system."
 bio_sabotage_resolution_partial_tt: "Only part of the payload reaches the selected state's public supply chains. A weaker biological episode enters the full lifecycle, while evidence and political consequences remain possible."
 bio_sabotage_resolution_failed_tt: "The release fails before a viable episode is established. All committed material is lost, and investigators may still accumulate evidence of the attempt."
 bio_sabotage_resolution_rejected_tt: "The exact operation record cannot support a release. No state is substituted and no biological episode is created; all committed material remains lost."
