 chaosx.fallout.527.t: "The Missing Patrol"
 chaosx.fallout.527.intro: "The patrol left the ash cut before dawn and never reached the border road. Its last radio fragment named a collapsed watchtower and a light moving below the snow line. The government of [This.GetName] must decide whether to search, retaliate, keep the disappearance quiet, or wait for contact."
 chaosx.fallout.527.a: "Search the ruins"
 chaosx.fallout.527.a.tt: "Spend Fuel, Equipment, and Scrap to send a protected team through the ash cut. The 60-day report will grade the radio trail, route repair, and civilian risk."
 chaosx.fallout.527.b: "Retaliate at the border"
 chaosx.fallout.527.b.tt: "Spend Fuel and Equipment to order a limited response without declaring a war. The 60-day report will grade the road, the army, and the cost of a visible threat."
 chaosx.fallout.527.c: "Keep the disappearance quiet"
 chaosx.fallout.527.c.tt: "Spend Food and Recognition to contain the story. The state may keep short-term order, but hidden fear and lost intelligence will shape the command review."
 chaosx.fallout.527.d: "Wait for contact"
 chaosx.fallout.527.d.tt: "Spend Food and Fuel to hold the road and listen. The 60-day report will grade the return signal, exposure, and the patience of the exposed state."
 chaosx.fallout.529.t: "The Patrol Report"
 chaosx.fallout.529.search_ruins.success.d: "The search team found the patrol under the watchtower. Two soldiers were alive beside a hand-cranked radio, and the crew marked a dry route through the ash. The state can name what happened without pretending the road is safe."
 chaosx.fallout.529.search_ruins.partial.d: "The search team recovered a radio fragment and one blood-marked map, but the watchtower floor collapsed before the patrol could be found. The route is open for one guarded convoy and the missing ledger remains active."
 chaosx.fallout.529.search_ruins.failure.d: "The search team entered the ash cut after the frost shelf gave way. The radio truck and a workshop shed are damaged, and families in [This.GetName] receive no answer from the patrol. The Deaths ledger records the cost of looking."
 chaosx.fallout.529.retaliate_border.success.d: "The limited response reached the border road, forced the raiders away from the marker, and returned before the ash wind rose. The army has a victory to record, though the state now carries a louder threat memory and no automatic war has begun."
 chaosx.fallout.529.retaliate_border.partial.d: "The response reached the border road and found fresh tracks, but the column withdrew when the frost bridge cracked. The patrol remains missing, the standoff is public, and every future convoy will travel under a harder escort rule."
 chaosx.fallout.529.retaliate_border.failure.d: "The retaliatory column crossed the marker without a second radio. It returned with damaged vehicles, a broken supply line, and soldiers who cannot agree on what they saw. The Deaths ledger records a border order that became a winter loss."
 chaosx.fallout.529.cover_up.success.d: "The council publishes a short training notice and keeps the patrol name out of the public register. The road stays quiet for now, but the missing ledger is thinner than the official account and the families keep their own record."
 chaosx.fallout.529.cover_up.partial.d: "The cover story holds in the capital and fails in the exposed wards. A quartermaster quietly removes the patrol from the next roster, while the radio fragments circulate through the shelter schools."
 chaosx.fallout.529.cover_up.failure.d: "The council's story collapses when a damaged beacon is found beside the route. Recognition falls, a civilian workshop is damaged in the panic, and families learn that the patrol was left without a relief plan. The Deaths ledger records the scandal."
 chaosx.fallout.529.wait_for_contact.success.d: "A return signal arrives from the old watchtower during the third cold night. One patrol member leads the survivors to a marked shelter, and the state can lower exposure without closing the road to every later convoy."
 chaosx.fallout.529.wait_for_contact.partial.d: "The radio answers once and then falls silent. The state holds the marker and sends no second column, but the weak contact is enough to keep the patrol memory open through the next winter review."
 chaosx.fallout.529.wait_for_contact.failure.d: "The road marker is buried before the signal returns. A fuel team disappears in the same cut, the exposed state loses route access, and families in [This.GetName] absorb the casualties through the Deaths system."
 chaosx.fallout.529.a: "File the patrol report and await the command review"
 chaosx.fallout.529.a.tt: "Resolve the delayed report, apply its military and Air Winter effects, and schedule the 180-day patrol review callback."
 chaosx.fallout.531.t: "The Patrol Command Review"
 chaosx.fallout.531.success.d: "The review board matches the radio fragment, the route map, and the shelter ledger. The missing patrol has a named cause memory, and the state can reopen the road under a written search and relief rule."
 chaosx.fallout.531.partial.d: "The review board finds a usable route with one missing signature and two versions of the last signal. The patrol memory stays open, so the next convoy must carry a second radio and a civilian witness."
 chaosx.fallout.531.failure.d: "The review board finds that the radio, route, and casualty ledger describe different operations. The marker is lost again, a state facility is damaged, and the remaining patrol roster loses people in the confusion through the Deaths system."
 chaosx.fallout.531.a: "Close the patrol command review"
 chaosx.fallout.531.a.tt: "Resolve the callback, record the cause memory, and release the exact result and callback cleanup receipts."
 fallout.event_log.missing_patrol.name: "The Missing Patrol"
 fallout.event_log.missing_patrol.detail: "The missing patrol chain resolved through a deterministic Air Winter state. The result and command review updated intelligence, fear, reputation, contact memory, Supply Access, military readiness, exposure, reclamation, buildings, and Deaths consequences."
 fallout.event_log.missing_patrol.search_ruins_success: "Search the ruins succeeded and recovered a named patrol memory."
 fallout.event_log.missing_patrol.search_ruins_partial: "Search the ruins returned a radio fragment and left the patrol memory open."
 fallout.event_log.missing_patrol.search_ruins_failure: "Search the ruins failed and recorded a Deaths-backed winter loss."
 fallout.event_log.missing_patrol.retaliate_border_success: "The limited border retaliation succeeded without an automatic war declaration."
 fallout.event_log.missing_patrol.retaliate_border_partial: "The border response became a public standoff memory."
 fallout.event_log.missing_patrol.retaliate_border_failure: "The retaliatory column failed and recorded a Deaths-backed military loss."
 fallout.event_log.missing_patrol.cover_up_success: "The cover story held while intelligence and reputation narrowed."
 fallout.event_log.missing_patrol.cover_up_partial: "The cover story held in the capital and failed in exposed wards."
 fallout.event_log.missing_patrol.cover_up_failure: "The cover story collapsed into a civilian scandal and Deaths-backed loss."
 fallout.event_log.missing_patrol.wait_for_contact_success: "Waiting for contact recovered survivors and lowered exposure."
 fallout.event_log.missing_patrol.wait_for_contact_partial: "Waiting for contact preserved a weak signal and an open memory."
 fallout.event_log.missing_patrol.wait_for_contact_failure: "Waiting for contact lost the marker and recorded a Deaths-backed loss."
 fallout.event_log.missing_patrol.callback_success: "The patrol command review closed the cause memory under a written relief rule."
 fallout.event_log.missing_patrol.callback_partial: "The patrol command review kept a second-radio and witness rule active."
 fallout.event_log.missing_patrol.callback_failure: "The patrol command review failed and reopened the route loss memory."
