l_english:
  independence_wave_evolution_incident_category: "Evolution Incidents"
  independence_wave_evolution_incident_category_desc: "A rotating set of strategic incidents that turn the Independence Wave's shared institutions into lasting evolutions."
  independence_wave_replicable_institutions_incident: "Reconcile the copied declarations"
  independence_wave_replicable_institutions_incident_desc: "The first wave of independence has borrowed offices, seals, and constitutional language from older states. We must decide whether to build a working administration from those fragments or spend the opening on a recognition campaign."
  independence_wave_dormant_identity_incident: "Settle the dormant identity"
  independence_wave_dormant_identity_incident_desc: "Old charters, language claims, and competing historical authorities now demand a settlement. A common civic charter can stabilize the state, while a pluralist compact buys wider recognition at the cost of a more contentious government."
  independence_wave_armed_border_incident: "Resolve the armed opening"
  independence_wave_armed_border_incident_desc: "The new state's borders have become a military question. A civilian chain of command can keep the army subordinate, while frontier mobilization offers immediate security but risks a permanent war with the former host."
  independence_wave_congress_charter_incident: "Answer the sovereign congress"
  independence_wave_congress_charter_incident_desc: "The independence network has reached its congress phase. Members can protect equal rights through a stronger charter, or concentrate the secretariat and accept patron influence in exchange for administrative reach."
  independence_wave_open_sovereignty_incident: "Choose the open-sovereignty posture"
  independence_wave_open_sovereignty_incident_desc: "Open sovereignty turns local claims into a regional question. Synchronized demands can make the league revisionist and force a former host to react, while containment diplomacy trades momentum for recognition and breathing room."
  chaosx.nr6.360.t: "Declarations without a state"
  chaosx.nr6.360.d: "Copied declarations and borrowed constitutional drafts have given the independence wave a common language. The council must decide what the first institutions will serve."
  chaosx.nr6.360.a: "Build institutions before the next proclamation"
  chaosx.nr6.360.b: "Spend the opening on recognition"
  chaosx.nr6.361.t: "The old seal and the new country"
  chaosx.nr6.361.d: "Competing claimants, schools, and historic seals are being used to define who belongs. The settlement will shape the identity of the country long after the emergency passes."
  chaosx.nr6.361.a: "Ratify a civic charter"
  chaosx.nr6.361.b: "Guarantee a pluralist compact"
  chaosx.nr6.362.t: "The border answers back"
  chaosx.nr6.362.d: "Militias, former-host garrisons, and improvised commanders have turned the frontier into a test of sovereignty. The council must choose civilian control or a deliberate armed opening."
  chaosx.nr6.362.a: "Put the armed groups under civilian command"
  chaosx.nr6.362.b: "Mobilize the frontier"
  chaosx.nr6.363.t: "A congress of unequal states"
  chaosx.nr6.363.d: "The congress must choose whether equal rights or a concentrated secretariat will govern its bargain with patrons. The decision will shape the league's confidence and cohesion."
  chaosx.nr6.363.a: "Protect equal rights in the charter"
  chaosx.nr6.363.b: "Concentrate the secretariat"
  chaosx.nr6.364.t: "Sovereignty without a ceiling"
  chaosx.nr6.364.d: "A successful formable and several synchronized territorial demands have made the independence wave impossible to contain as a local affair. The next move will decide whether the league becomes a claimant bloc or a diplomatic shelter."
  chaosx.nr6.364.a: "Synchronize the territorial claims"
  chaosx.nr6.364.b: "Build a containment and recognition bloc"
