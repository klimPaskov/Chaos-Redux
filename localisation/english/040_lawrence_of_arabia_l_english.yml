lawrence_target_category_desc: "Lawrence's Influence: §Y[?global.lawrence_pub_influence|0]§! ([GetLawrenceBand]), [GetLawrenceTrend]. [GetLawrenceNextThreshold]\nMain pull: [GetLawrenceCause].\n[GetLawrenceStatusLine]"
lawrence_british_category: "The Arabian Mission"
lawrence_british_category_desc: "Target: §Y[?global.lawrence_target.GetNameDef]§!. Lawrence's Influence there: §Y[?global.lawrence_pub_influence|0]§! ([GetLawrenceBand]), [GetLawrenceTrend]. [GetLawrenceNextThreshold]\nMain pull: [GetLawrenceCause].\n[GetLawrenceBritishLine]"
lawrence_of_arabia.event_details.description: "Britain recalls T. E. Lawrence, reported dead after a motorcycle crash, and sends him into one Arabian government that is weak, useful or willing to bargain. The government decides how far the mission may go, officers and ministries take sides, and Britain pays for every shipment in real equipment. Each government ends in a settlement of its own, from a protectorate to an alliance, an armed partnership, a quiet withdrawal or an expulsion. Later governments follow after months of delay and remember what happened to the ones before."
chaosx.events_log.events.na_reason.lawrence_sponsor: "\n§RUnavailable: Britain cannot support a foreign mission.§!"
chaosx.events_log.events.na_reason.lawrence_target: "\n§RUnavailable: no Arabian government can receive the mission.§!"
chaos_meter.history.reason.special.lawrence_defection: "Lawrence leaves British service"

