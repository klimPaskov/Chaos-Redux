# ---------------------------------------------------------------------------
# Events
# ---------------------------------------------------------------------------
chaosx.nr40.1.t: "Lawrence of Arabia"
chaosx.nr40.2.t: "A British Mission Arrives"
chaosx.nr40.2.d: "A delegation with letters from London reached the capital this week. Its officers asked for the Ministry of War, the Foreign Ministry and the telegraph office before they asked for lodgings. The man who leads the liaison staff keeps his name off every list. He speaks the dialect of the northern tribes without an accent, and the ministers who have met him say he knows the roads better than their own surveyors.\n\nThe British offer arms, money and advisers. What they will want in return has not been put in writing."
chaosx.nr40.2.a: "Receive the delegation."
chaosx.nr40.2.a_tt: "The mission is open. §YLawrence's Influence§! is shown in the §YThe British Mission§! category and the terms of access are the first decision."
chaosx.nr40.3.t: "A Man Believed Dead"
chaosx.nr40.3.d: "Newspapers announced the death of T. E. Lawrence after a motorcycle crash near Clouds Hill, and the country mourned him. A small circle at the War Office and the Foreign Office knew that the man taken from the road was alive, and kept him in a house in Dorset until he could walk.\n\nHe has asked for work. The Arabian governments have never been so short of friends or so rich in rivals, and a ministry car now takes him south with a letter in the Foreign Secretary's hand. The first government on the list is [?global.lawrence_target.GetNameDef]."
chaosx.nr40.3.a: "Send him south."
chaosx.nr40.3.a_tt: "Lawrence travels to §Y[?global.lawrence_target.GetNameDef]§!. Britain's actions are in the §YThe Arabian Mission§! category."
chaosx.nr40.4.t: "Terms for the British Mission"
chaosx.nr40.4.d: "The British delegation waits for an answer. The Ministry of War wants to know whether the liaison officer may visit officers' messes, whether he may meet tribal leaders outside the capital, and who reads the cables he sends. A cabinet that gives London everything gets arms quickly. A cabinet that gives it nothing may find that arms arrive by other roads."
chaosx.nr40.4.a: "Admit the mission under a government invitation."
chaosx.nr40.4.a_tt: "§YLawrence's Influence§! rises by §Y4§! and Lawrence has broad access to officers and ministries. British support runs for §Y60§! days."
chaosx.nr40.4.b: "Limit the mission to military liaison."
chaosx.nr40.4.b_tt: "Influence stays where it is. Lawrence deals with the army staff only. British support runs for §Y40§! days."
chaosx.nr40.4.c: "Allow travel only under escort."
chaosx.nr40.4.c_tt: "§YLawrence's Influence§! falls by §Y3§! and Lawrence's trust in the government falls. The escort lasts for the whole mission."
chaosx.nr40.4.e: "Refuse the mission."
chaosx.nr40.4.e_tt: "The mission leaves at once. This answer is open only while Influence is below §Y60§!."
chaosx.nr40.5.t: "The British Mission"
chaosx.nr40.6.t: "The Arabian Mission"
chaosx.nr40.27.t: "The Arabian Mission"
chaosx.nr40.7.t: "British Officers in the Staff Rooms"
chaosx.nr40.7.d: "The liaison office keeps a desk at the General Staff now. Orders for the southern garrisons pass through an officer who answers to London as often as to the Minister of War, and the Ministry of Finance has begun paying a second payroll that no minister signed. Staff officers say the mission is useful. A few of them say it is also in the way."
chaosx.nr40.7.a: "Keep watch."
chaosx.nr40.7.a_tt: "The British mission is now §OEmbedded§!. Its penalties to stability, political power and command power rise."
chaosx.nr40.8.t: "A Government with Two Chains of Command"
chaosx.nr40.8.d: "Telegrams from the garrisons now arrive at two addresses, and commanders in the provinces choose between them. In the capital the British consul and the Chief of Staff are seen together more often than the cabinet is seen with either. A protectorate has not been mentioned, and drafts of one are said to exist."
chaosx.nr40.8.a: "The question is now open."
chaosx.nr40.8.a_tt: "Influence is near the top of the scale. If it holds for long enough Britain can offer protectorate terms."
chaosx.nr40.9.t: "Protectorate Terms"
chaosx.nr40.9.d: "London has put its terms in writing. Britain will arm and train the army, build the roads and the telegraph line, and guarantee the borders. In return it will keep a resident adviser at the palace, station troops where it chooses and sign treaties on the government's behalf. The officers whom the mission trained are waiting to hear that the cabinet agrees."
chaosx.nr40.9.a: "Ask for more time."
chaosx.nr40.9.a_tt: "No decision. The terms return only if Influence stays high, and not for §Y60§! days."
chaosx.nr40.9.b: "Accept the protection of Britain."
chaosx.nr40.9.b_tt: "The country becomes a British client. It receives the promised package and Britain gains a durable hold on its foreign policy."
chaosx.nr40.9.c: "Insist on an alliance between equals."
chaosx.nr40.9.c_tt: "The country stays sovereign. Britain gains negotiated access and the country becomes an independent British ally."
chaosx.nr40.9.e: "Refuse the terms."
chaosx.nr40.9.e_tt: "§YLawrence's Influence§! falls by §Y15§! and British credibility falls by §Y3§!. The terms cannot return for §Y120§! days."
chaosx.nr40.10.t: "A Treaty Between Sovereign Governments"
chaosx.nr40.10.d: "[?global.lawrence_target.GetNameDef] asks for a treaty. It will accept British arms and training and give Britain the right to cross its territory in war. It declines an adviser at the palace and a British voice in its foreign policy. Lawrence thinks the offer is the most Britain can get without a garrison, and the Treasury notes that it is also the cheapest."
chaosx.nr40.10.a: "Sign the treaty."
chaosx.nr40.10.a_tt: "The country becomes an independent British ally. Britain and the country gain military access to each other and Britain guarantees its independence."
chaosx.nr40.10.b: "Decline for now."
chaosx.nr40.10.b_tt: "The request is withdrawn. A new request cannot be made for §Y120§! days."
chaosx.nr40.11.t: "Terms Prepared for a Protectorate"
chaosx.nr40.11.d: "The draft of protectorate terms for [?global.lawrence_target.GetNameDef] is on the table. If the cabinet there accepts, Britain takes on the cost of the garrisons, the subsidies and the officers' pay. The Treasury would like the figures before anything is signed."
chaosx.nr40.11.a: "Await the answer."
chaosx.nr40.11.a_tt: "The government decides whether to accept, ask for an alliance, delay or refuse."
chaosx.nr40.12.t: "A Convoy on the Road"
chaosx.nr40.12.d: "A British shipment of rifles, radios and cash for the mission's payroll is on its way. Customs officers in the border districts have received no instructions about it, and the depot commanders have received contradictory ones."
chaosx.nr40.12.a: "We will watch the road."
chaosx.nr40.12.a_tt: "The shipment arrives in a few weeks. The government can take custody of it with §YTake Custody of the Shipment§!."
chaosx.nr40.13.t: "The Crates Are Counted"
chaosx.nr40.13.d: "The convoy has reached its depots. Some of the crates were opened in front of government inspectors. Others were carried off by officers who did not wait for an inventory, and nobody has said where they went."
chaosx.nr40.13.a: "Count what was delivered."
chaosx.nr40.13.a_tt: "The government keeps its share of the equipment. The remainder reached officers and local leaders who follow the mission, and Influence rises."
chaosx.nr40.15.t: "Aid in Return for Bases"
chaosx.nr40.15.d: "Britain offers a large shipment of rifles and radios, delivered within weeks. In return British forces would use the harbor and the airfield, and the garrisons along the road would pass British vehicles without inspection. The minister who read the draft to the cabinet remarked that nothing in it was unclear."
chaosx.nr40.15.a: "Accept the bases and the aid."
chaosx.nr40.15.a_tt: "The package arrives at once and §YLawrence's Influence§! rises by §Y8§!. Britain gains military access. Stability and political power gain stay lower for as long as the mission lasts."
chaosx.nr40.15.b: "Decline the offer."
chaosx.nr40.15.b_tt: "Britain takes the package back. Lawrence's trust in the government rises by §Y3§!."
chaosx.nr40.16.t: "The Price of a Prisoner"
chaosx.nr40.16.d: "A British envoy carries an offer for the officer held in the fortress. Britain will deliver rifles and medical supplies, and will say in public that the arrest was lawful, if the government releases him quietly. The cabinet can also keep him and wait, or publish the terms and let the other capitals judge them."
chaosx.nr40.16.a: "Release him in return for the package."
chaosx.nr40.16.a_tt: "The shipment arrives once. Lawrence returns to British service and his network restarts from a low base. This government can never detain him again."
chaosx.nr40.16.b: "Hold out for recognition."
chaosx.nr40.16.b_tt: "Britain keeps its package. Lawrence stays in custody and Britain can make another offer after §Y90§! days."
chaosx.nr40.16.c: "Publish the terms and release him."
chaosx.nr40.16.c_tt: "As above, and British credibility falls by §Y10§! across the region. Neighbouring governments grow more watchful."
chaosx.nr40.17.t: "A Courier Changes Hands"
chaosx.nr40.17.d: "A clerk who carried British letters between the legation and three provincial governors has agreed to work for the security service, in return for his family's safety. He now copies every letter before he delivers it, and the service has told him to change nothing in his habits."
chaosx.nr40.17.a: "He keeps his routine."
chaosx.nr40.17.a_tt: "The contact is turned. §YFeed Controlled Intelligence§! opens and evidence grows by §Y1§!."
chaosx.nr40.18.t: "The Clerk Talks to the Wrong Man"
chaosx.nr40.18.d: "The approach to the courier was seen. By the next morning he had told his employer, and the legation changed its couriers, its codes and the hours of its meetings. The officers who work with Lawrence know now that the security service is watching them."
chaosx.nr40.18.a: "Close the file for now."
chaosx.nr40.18.a_tt: "Influence rises by §Y4§! and evidence falls by §Y1§!. The attempt can be repeated after §Y120§! days."
chaosx.nr40.19.t: "The False Letters Are Found Out"
chaosx.nr40.19.d: "One of the letters the security service planted contained a date that only the service could have known. The legation traced it to the clerk within a day and he has left the capital. The network now knows which of its secrets were read and which were invented."
chaosx.nr40.19.a: "Start again."
chaosx.nr40.19.a_tt: "Influence rises by §Y5§!, the turned contact is lost and the double game restarts from the beginning."
chaosx.nr40.20.t: "The Fortress Is Empty"
chaosx.nr40.20.d: "A guard changed at night, a gate was opened, and a car with diplomatic plates left by the eastern road before the garrison counted its prisoners. The prisoner is out of the country. The commandant is explaining how it happened to a board of inquiry."
chaosx.nr40.20.a: "Open an inquiry."
chaosx.nr40.20.a_tt: "Lawrence is free and back in British service. The network restarts from a low base."
chaosx.nr40.21.t: "He Is Out"
chaosx.nr40.21.d: "The operation worked. Lawrence reached the coast in the back of a truck and reported to the legation at dawn. The embassy says he is tired and well, and he has asked to see the files."
chaosx.nr40.21.a: "Welcome him back."
chaosx.nr40.21.a_tt: "Lawrence is free again. Britain's position in the target is weak and must be rebuilt."
chaosx.nr40.22.t: "A Raid on the Fortress Fails"
chaosx.nr40.22.d: "A party of armed men reached the outer gate before the sentries fired. Two of the attackers were taken alive. They carried British equipment, and the cabinet now has proof to put before the regional press."
chaosx.nr40.22.a: "Hold the prisoner and the evidence."
chaosx.nr40.22.a_tt: "Lawrence stays in custody. British credibility falls by §Y10§! and neighbouring governments grow more watchful."
chaosx.nr40.23.t: "The Rescue Fails"
chaosx.nr40.23.d: "The operation did not reach the prisoner. Two of the men are in custody and the rest crossed back, and the foreign ministry of [?global.lawrence_target.GetNameDef] has already shown their rifles to the press."
chaosx.nr40.23.a: "Count the cost."
chaosx.nr40.23.a_tt: "Lawrence is still held. British credibility falls by §Y10§!. Another attempt needs a new plan and §Y120§! days."
chaosx.nr40.24.t: "The Mission Is Under Arrest"
chaosx.nr40.24.d: "At dawn the police closed the legation annex and took the liaison officer from his house under escort. His papers were seized and his staff confined to their quarter. The government has not yet decided whether he will be tried, exchanged or sent home, and neither has London."
chaosx.nr40.24.a: "Hold him."
chaosx.nr40.24.a_tt: "Lawrence is in custody. British support is closed and the network decays. This government cannot detain him again."
chaosx.nr40.25.t: "Lawrence Is in Custody"
chaosx.nr40.25.d: "A telegram from the legation reports that [?global.lawrence_target.GetNameDef] has arrested Lawrence and sealed his papers. The man the newspapers buried is now the guest of a foreign interior ministry, and the Foreign Secretary has asked what can be done quietly."
chaosx.nr40.25.a: "Weigh the options."
chaosx.nr40.25.a_tt: "Recovery, an exchange and disavowal are now open. Ordinary British support is closed."
chaosx.nr40.26.t: "No Lawrence"
chaosx.nr40.26.d_dead: "News of Lawrence's death has reached London. The Arabian network he built still has its couriers, its paymasters and a handful of officers who answer to the legation. The Foreign Office asks whether the work should continue without him."
chaosx.nr40.26.d_defected: "Lawrence has left British service and joined the government he was sent to influence. The Arabian network he built still has its couriers, its paymasters and a handful of officers who answer to the legation. The Foreign Office asks whether the work should continue without him."
chaosx.nr40.26.a: "Continue through local agents."
chaosx.nr40.26.a_tt: "The mission goes on at reduced strength. British gains in Influence are halved and Lawrence's personal actions stay closed. A new target is chosen after the usual delay."
chaosx.nr40.26.b: "End the mission."
chaosx.nr40.26.b_tt: "The campaign ends. Existing settlements and Lawrence's fate stand as they are."
chaosx.nr40.28.t: "The Arabian Mission Ends"
chaosx.nr40.28.d: "The legation has stopped sending reports. The files go to the archive, the couriers are reassigned and the account at the bank in Jeddah is closed. What the mission built or failed to build is a matter for the governments that outlived it."
chaosx.nr40.28.a: "File the papers."
chaosx.nr40.28.a_tt: "The campaign is over and no further targets are chosen."
chaosx.nr40.30.t: "Lawrence Asks for His Release"
chaosx.nr40.30.d: "Lawrence has written to the Foreign Office and to the cabinet of [ROOT.GetNameDef] on the same day. He asks to be released from his commission and to serve a charter that [ROOT.GetNameDef] and its neighbours would write themselves. The British consul has not been told. The cabinet can accept him as an adviser to a sovereign project, or return the letter and leave him to London."
chaosx.nr40.30.a: "Receive him as an adviser to the charter."
chaosx.nr40.30.a_tt: "Lawrence leaves British service for good and joins this government. Chaos rises slightly. Britain decides whether local agents continue."
chaosx.nr40.30.b: "Return the letter."
chaosx.nr40.30.b_tt: "Lawrence stays in British service. His trust in the government falls by §Y15§! and the charter lapses."
chaosx.nr40.40.t: "Lawrence of Arabia"
chaosx.nr40.40.d_revealed: "An Arabian government has published the ledgers, courier letters and payroll of a British mission that has worked inside the country for months. They name an officer who was reported dead after a motorcycle crash. The Foreign Office has declined to comment, and the newspapers in Cairo, Baghdad and Damascus have found nothing else to print."
chaosx.nr40.40.d_detained: "Police in an Arabian capital have arrested a British liaison officer and sealed his papers. People who have seen the prisoner say he is T. E. Lawrence, whom the newspapers reported dead after a motorcycle crash. London has neither confirmed nor denied it."
chaosx.nr40.40.d_died: "T. E. Lawrence has died during an attempt to free him from the Arabian government that held him. Those who knew him say the man who died is the same man the newspapers reported dead after a motorcycle crash. The Foreign Office has said nothing."
chaosx.nr40.40.d_dismantled: "An Arabian government has announced that its security service closed every office, bank account and courier route of a British mission. Ministers say the files will be shown to neighbouring governments. Britain has not said how many officers it had in the region."
chaosx.nr40.40.d_defected: "T. E. Lawrence, reported dead after a motorcycle crash, has left British service. He is now in the capital of an Arabian government and has put his name to a statement written by its ministers. The statement speaks of a charter and says little about Britain."
chaosx.nr40.40.a: "The region reads on."
chaosx.nr40.45.t: "Britain Answers a Double Game"
chaosx.nr40.45.d: "[?global.lawrence_retaliation_target.GetNameDef] took British rifles and gave the legation false papers in return. Its ministers now describe the arrangement as a successful defense of national interests. The Treasury would like to remind the cabinet who paid for the rifles."
chaosx.nr40.45.a: "Withdraw British goodwill."
chaosx.nr40.45.a_tt: "The two governments lose opinion of each other for a long time."
chaosx.nr40.45.b: "Let it pass."
chaosx.nr40.45.b_tt: "No action is taken and the matter closes."
chaosx.nr40.50.t: "A Foreign Mission Next Door"
chaosx.nr40.50.d: "Governments along the border are comparing notes on a British mission that ran its course in a neighbouring country. Its methods, its couriers and its payroll are described in the newspapers, and the General Staff has asked what would stop the same officers from arriving here."
chaosx.nr40.50.a: "Tighten counterintelligence."
chaosx.nr40.50.a_tt: "Regional preparedness rises. This country becomes a harder target and a British mission here would find less access."
chaosx.nr40.50.b: "Ask London for guarantees."
chaosx.nr40.50.b_tt: "This country becomes more likely to be the next British target and a mission here would start with more access."
chaosx.nr40.51.t: "A Neighbour Under British Protection"
chaosx.nr40.51.d: "A neighbouring government has settled its relations with Britain, and its officers report new rifles, radios and roads. Officials in the capital ask whether the same arrangements would be offered here, and what they would cost."
chaosx.nr40.51.a: "Ask Britain what it would offer."
chaosx.nr40.51.a_tt: "This country becomes more likely to be the next British target and a mission here would start with more access."
chaosx.nr40.51.b: "Stay clear of London."
chaosx.nr40.51.b_tt: "Regional preparedness rises and a British mission here would find less access."
chaosx.nr40.60.t: "The Payroll Does Not Add Up"
chaosx.nr40.60.d: "The paymaster of the Ministry of War has reported a shortfall in the officers' payroll. The accounts for the month show gold coming into the Ministry from a bank that has no other business with it, and a number of officers drawing two salaries. The shortfall is small, and a clerk has drawn up a list of the officers who appear twice."
chaosx.nr40.60.a: "Open a quiet inquiry."
chaosx.nr40.60.a_tt: "A strong security service finds the source and adds evidence. A weak one loses the trail and Influence rises."
chaosx.nr40.60.b: "Let the accounts close."
chaosx.nr40.60.b_tt: "Influence rises by §Y4§! as the payments continue."
chaosx.nr40.61.t: "A Commander Refuses His Transfer"
chaosx.nr40.61.d: "The commander of a provincial garrison has declined a transfer to the capital and told the General Staff that his regiment will stay where it is. He holds a letter from the British legation thanking him for his advice on the roads. The General Staff asks the cabinet whether to insist."
chaosx.nr40.61.a: "Replace the commander."
chaosx.nr40.61.a_tt: "Stability falls by §Y2§!. If pro-British officers are strong the replacement is resisted and Influence rises by §Y5§!. Otherwise the share of officers who follow the mission falls and Influence falls by §Y3§!."
chaosx.nr40.61.b: "Accept his refusal."
chaosx.nr40.61.b_tt: "More officers follow the mission and Influence rises by §Y3§!."
chaosx.nr40.62.t: "A Courier Is Stopped on the Road"
chaosx.nr40.62.d: "Customs officers at a river crossing stopped a rider with a sealed bag addressed to a landholder who has no business with the legation. The bag holds cash, a list of village headmen and a letter in an English hand. The officer in charge asks whether to open it in public."
chaosx.nr40.62.a: "Hold the courier and open the bag."
chaosx.nr40.62.a_tt: "Evidence grows by §Y1§! and Influence falls by §Y2§!. A shipment on its way is delayed by §Y14§! days."
chaosx.nr40.62.b: "Let the courier go."
chaosx.nr40.62.b_tt: "Influence rises by §Y3§! and exposure rises."

# Settlement reports
chaosx.nr40.71.t: "A British Protectorate"
chaosx.nr40.71.d: "The protocol was signed in the afternoon. British officers took over the training camps the next morning and a resident adviser moved into rooms at the palace. The new roads and the telegraph line are on the schedule, and the first British engineers arrived by the same train as the Treasury's first payment."
chaosx.nr40.71.d_britain: "[?global.lawrence_last_target.GetNameDef] is now a British client. The cost of its garrisons, subsidies and roads falls on the Treasury, and the resident adviser reports that its officers are glad of the pay. Britain has a foothold on the coast road and a government that will sign what the legation drafts."
chaosx.nr40.71.a: "Governed by contract."
chaosx.nr40.71.a_tt: "The mission ends in a British protectorate."
chaosx.nr40.72.t: "A Treaty of Alliance"
chaosx.nr40.72.d: "The treaty was signed in the presence of both cabinets. Britain receives the right to cross the country in war and to use its harbors, and the country keeps its own foreign ministry, its own army and the arms it was sent. The British officers who remain are guests."
chaosx.nr40.72.d_britain: "[?global.lawrence_last_target.GetNameDef] signed a treaty as a sovereign ally. Britain has access to its ports and roads in war and no say in its cabinet. The legation's report describes Lawrence as satisfied, which the Foreign Office finds hard to believe."
chaosx.nr40.72.a: "Allies, and equals."
chaosx.nr40.72.a_tt: "The mission ends in an independent alliance."
chaosx.nr40.73.t: "Arms Under a National Lock"
chaosx.nr40.73.d: "The army took the last British rifles into its own depots and put its own officers in charge of the training camps. The liaison office keeps one clerk and a copy of every agreement. The government says the arrangement serves the country, and the British say they never asked for more."
chaosx.nr40.73.d_britain: "[?global.lawrence_last_target.GetNameDef] kept the arms and the training and declined every other British proposal. The mission leaves a liaison office with one clerk and no authority, and London has marked the file closed."
chaosx.nr40.73.a: "The arms stay in the country's hands."
chaosx.nr40.73.a_tt: "The mission ends in a sovereign armed partnership."
chaosx.nr40.74.t: "The Mission Runs Out"
chaosx.nr40.74.d: "The mission has reached the end of what it can do here. A few couriers still carry letters to the legation and a few officers still dine with the staff, but nobody in the cabinet expects either side to ask more of the other. The government has agreed to let the matter lapse."
chaosx.nr40.74.d_britain: "The mission in [?global.lawrence_last_target.GetNameDef] has stalled. Britain keeps a small circle of contacts and no client, and the Treasury has been told to expect no further requests."
chaosx.nr40.74.a: "Let the matter lapse."
chaosx.nr40.74.a_tt: "The mission ends without a settlement. A small British contact network and some suspicion remain."
chaosx.nr40.75.t: "The Mission Is Sent Home"
chaosx.nr40.75.d: "The liaison officer and his staff were escorted to the frontier with their papers in order. The cabinet announced that the mission had completed its work, and the army ministry has put its own officers in the posts where the British advisers sat."
chaosx.nr40.75.d_disorder: "The expulsion order was read to the garrison commanders at dawn, and by evening half of them disputed it. Demonstrations filled the market quarter and a depot changed hands for a day. The British staff left the capital under guard, and their friends in the army argued with the Chief of Staff."
chaosx.nr40.75.d_britain: "[?global.lawrence_last_target.GetNameDef] expelled the mission. Lawrence has returned to London with his reports and his opinion of the cabinet, and the Foreign Office is reviewing which of its other contacts in the region are known."
chaosx.nr40.75.a: "The legation closes its doors."
chaosx.nr40.75.a_tt: "The mission ends in an expulsion."
chaosx.nr40.76.t: "The Network Is Closed"
chaosx.nr40.76.d: "Over a single week the security service closed the legation's accounts, arrested the couriers who carried them and opened the strongroom where the payroll was kept. The Minister of the Interior has offered the files to every neighbouring government, and the British officers have been told to leave."
chaosx.nr40.76.d_britain: "The mission in [?global.lawrence_last_target.GetNameDef] has been dismantled. The paymasters, the couriers and the contacts in the army are gone or in prison, and the files are being passed around the region. London's offers will be harder to believe in the next capital."
chaosx.nr40.76.a: "The files go on circulating."
chaosx.nr40.76.a_tt: "The mission ends with its network dismantled. Neighbouring governments are better prepared and British credibility falls."
chaosx.nr40.77.t: "The Guest Who Read the Mail"
chaosx.nr40.77.d: "The cabinet accepted British rifles for a year, and its security service copied every letter that came with them. When the legation expected to be offered a protectorate the cabinet thanked London, published nothing and kept the arms. The British consul has asked to see the Minister of the Interior more than once."
chaosx.nr40.77.d_britain: "[?global.lawrence_last_target.GetNameDef] took the arms and gave the legation false papers. The cabinet has kept the rifles and the leverage and has offered nothing in return. The Treasury will remember the figures."
chaosx.nr40.77.a: "The arms were well spent."
chaosx.nr40.77.a_tt: "The mission ends in a double-game victory for the target. British credibility falls and Britain may retaliate."
chaosx.nr40.78.t: "Lawrence Joins the Charter"
chaosx.nr40.78.d: "Lawrence has taken a seat among the officials who are writing the charter. He speaks rarely and the ministers speak first. The British consul came to the palace, was received politely and left without the man he came to see."
chaosx.nr40.78.d_britain: "Lawrence has left British service and joined the government of [?global.lawrence_last_target.GetNameDef]. The charter he joined says little about Britain, and the Foreign Office has no one to send who knows the roads as he did."
chaosx.nr40.78.a: "A charter for the region."
chaosx.nr40.78.a_tt: "Lawrence leaves British service and serves the target's independent charter."

# ---------------------------------------------------------------------------
# Ideas
# ---------------------------------------------------------------------------
lawrence_british_mission: "British Mission"
lawrence_british_mission_desc: "Officers of a British mission sit in the ministries and the garrisons. Their advice is useful and their loyalties are divided."
lawrence_embedded_mission: "Embedded British Mission"
lawrence_embedded_mission_desc: "British officers hold desks at the General Staff and the Treasury, and orders for the garrisons pass through them."
lawrence_liaison_office: "Arab Liaison Office"
lawrence_liaison_office_desc: "Every contact with the British mission goes through one office with its own records and a director who answers to the cabinet."
lawrence_bases_agreement: "Base Agreement"
lawrence_bases_agreement_desc: "British forces use the harbor, the airfield and the roads under a signed agreement. The garrisons along the roads pass British vehicles without inspection."
lawrence_cadre_commitment: "Officer Cadres Abroad"
lawrence_cadre_commitment_desc: "Staff officers and training specialists serve in an Arabian mission and are missing from their units at home."
lawrence_british_protectorate: "British Protectorate"
lawrence_british_protectorate_desc: "The country is a British client. British engineers, advisers and money arrive together with a resident adviser who reads the cabinet's drafts."
lawrence_british_alliance: "Treaty of Alliance with Britain"
lawrence_british_alliance_desc: "The country is a sovereign ally of Britain. British arms and training come in return for access in war."
lawrence_armed_partnership: "Armed Partnership"
lawrence_armed_partnership_desc: "The army took British weapons and training under its own laws and declined every other British proposal."
lawrence_british_contacts: "British Contacts"
lawrence_british_contacts_desc: "A few couriers, paymasters and friendly officers remain from a mission that ended without a settlement. The cabinet watches them."
lawrence_anti_intervention_confidence: "Confidence After the Mission"
lawrence_anti_intervention_confidence_desc: "The cabinet sent a foreign mission home and the army stood by it. Ministers and officers know it can be done."
lawrence_expulsion_disorder: "Disorder After the Expulsion"
lawrence_expulsion_disorder_desc: "Garrisons disputed the expulsion order and the market quarter held demonstrations for days."
lawrence_exposed_network: "Exposed Network"
lawrence_exposed_network_desc: "The security service closed a foreign network and kept its files. Its methods are being copied elsewhere."
lawrence_double_game_gains: "Fruits of the Double Game"
lawrence_double_game_gains_desc: "The security service read a foreign mission's mail for a year and kept the weapons that mission paid for."
lawrence_independent_charter: "Independent Charter"
lawrence_independent_charter_desc: "The cabinet wrote a charter of sovereignty and regional cooperation with a former British officer among its advisers."

# ---------------------------------------------------------------------------
# Target decisions
# ---------------------------------------------------------------------------
lawrence_set_terms: "Set the Mission's Terms"
lawrence_set_terms_desc: "The government decides how far the British liaison officer may travel, whom he may meet and which offices he may enter."
lawrence_set_terms_tt: "Opens the terms of access. British support, Influence and the actions below depend on the answer."
lawrence_take_custody: "Take Custody of the Shipment"
lawrence_take_custody_desc: "The government sends inspectors and a guard to the border depot and takes the crates into its own stores."
lawrence_take_custody_tt: "The next shipment goes to government depots. Its equipment arrives in full and Influence grows by less. A small training detail adds army experience. If pro-British officers hold the depots, part of the shipment is diverted."
lawrence_open_liaison_office: "Open an Arab Liaison Office"
lawrence_open_liaison_office_desc: "The government puts every contact with the mission under one office, with its own seal, its own records and a director who answers to the cabinet."
lawrence_open_office_tt: "A liaison office opens. Influence falls by §Y5§!, the mission's reach into the officer corps shrinks and the office adds counterintelligence strength. If pro-British officers already control the staff, the office serves the mission and Influence rises by §Y6§!. The office burdens consumer goods."
lawrence_place_under_escort: "Place Lawrence Under Escort"
lawrence_place_under_escort_desc: "A detachment of military police goes everywhere the liaison officer goes. It reports the names of the people he meets, and some of those people stop calling."
lawrence_place_under_escort_tt: "For §Y150§! days Lawrence travels under escort. Influence falls by §Y3§!, exposure falls and the mission's reach shrinks while the escort lasts. Lawrence's trust in the government falls."
lawrence_escort_ended_tt: "The escort is withdrawn."
lawrence_build_counterintelligence_file: "Build a Counterintelligence File"
lawrence_build_counterintelligence_file_desc: "The security service opens a dossier on the legation's couriers, paymasters and local friends and begins to record who meets whom."
lawrence_build_file_tt: "The file takes §Y45§! days. When it is complete, evidence rises by §Y1§! and by §Y2§! if the service is strong. The file opens the audit, the turned contact and the exposure."
lawrence_build_file_done_tt: "The counterintelligence file is complete."
lawrence_audit_gold_ledger: "Audit the Gold Ledger"
lawrence_audit_gold_ledger_desc: "Treasury inspectors take over the books of every bank and customs house that handled British money."
lawrence_audit_ledger_tt: "Starts the §YTrace the Gold Ledger§! mission. Hold the capital and the main port with divisions for §Y42§! days to seize the records."
lawrence_turn_a_contact: "Turn a Contact"
lawrence_turn_a_contact_desc: "The service picks one courier from the file and makes him an offer that includes his family."
lawrence_turn_contact_tt: "The attempt succeeds or fails according to the strength of the security service. Success turns the contact and adds evidence. Failure warns the network and Influence rises. Can be repeated every §Y120§! days."
lawrence_feed_controlled_intelligence: "Feed Controlled Intelligence"
lawrence_feed_controlled_intelligence_desc: "The turned courier carries letters the security service has written for him."
lawrence_feed_intelligence_tt: "Influence falls by §Y3§! and British credibility falls by §Y3§!. After §Y3§! successful uses the double game is ready. A weak service risks discovery, which costs Influence and the contact."
lawrence_expose_the_network: "Expose the Network"
lawrence_expose_the_network_desc: "The Ministry of the Interior prepares a dossier of ledgers, letters and names for publication."
lawrence_expose_network_tt: "Starts the §YExpose the Network§! mission. Evidence must reach §Y3§!. Public exposure reveals the mission to the region."
lawrence_dismantle_the_contact_network: "Dismantle the Contact Network"
lawrence_dismantle_the_contact_network_desc: "Arrests, searches and closures sweep the capital, the port and the roads where the legation's friends live."
lawrence_dismantle_network_tt: "Starts the §YDismantle the Contact Network§! mission. Hold the capital, the port and the route state for §Y56§! days."
lawrence_secure_the_officer_corps: "Secure the Officer Corps"
lawrence_secure_the_officer_corps_desc: "The General Staff rewrites oaths, rotations and pay scales for the officers who dine with the legation."
lawrence_secure_officers_tt: "Starts the §YSecuring the Officer Corps§! mission. While the capital is held with divisions, the share of officers who follow the mission falls every week."
lawrence_expel_the_mission: "Expel the Mission"
lawrence_expel_the_mission_desc: "The foreign minister hands the British legation a note and a train timetable."
lawrence_expel_clean_tt: "Lawrence and the British staff leave. Influence is low, so the departure is orderly and the government gains confidence."
lawrence_expel_reckless_tt: "Lawrence leaves, but the network is strong. Garrisons dispute the order and demonstrations follow, costing stability and war support for a long time."
lawrence_detain_the_mission: "Detain the Mission"
lawrence_detain_the_mission_desc: "Soldiers close the annex and the police take the liaison officer from his house."
lawrence_detain_mission_tt: "Lawrence is held. British actions close and the network decays. Britain can attempt a recovery, offer an exchange or disavow him."
lawrence_detain_evidence_tt: "The security service holds evidence of at least §Y2§!"
lawrence_play_britain_against_a_rival: "Play Britain Against a Rival"
lawrence_play_britain_against_a_rival_desc: "The cabinet tells the legation that a neighbouring power has made an offer, and asks what London will pay to see it refused."
lawrence_play_rival_tt: "Britain guarantees this country's independence, Influence rises by §Y6§! and British support intensifies for §Y60§! days. Can be used once."
lawrence_balance_foreign_sponsors: "Balance Foreign Sponsors"
lawrence_balance_foreign_sponsors_desc: "The cabinet receives an envoy from a second power and lets the legation know it."
lawrence_balance_sponsors_tt: "A real patron with access to this country grants military access and goodwill. Influence falls by §Y8§!. Can be used once."
lawrence_preserve_national_custody: "Preserve National Custody"
lawrence_preserve_national_custody_desc: "The army takes the arms, the officers and the liaison office under its own laws and tells London so."
lawrence_preserve_custody_tt: "The mission ends as a sovereign armed partnership. The country keeps the arms and the training and accepts no British authority at home."
lawrence_seek_an_independent_treaty: "Seek an Independent Treaty"
lawrence_seek_an_independent_treaty_desc: "The cabinet proposes a treaty between equals: arms and training from Britain, access in war and no adviser at the palace."
lawrence_seek_treaty_tt: "Britain answers the proposal. If it accepts, the country becomes an independent British ally. Available once Influence has held between §Y40§! and §Y80§! for §Y60§! days."
lawrence_offer_an_independent_charter: "Offer an Independent Charter"
lawrence_offer_an_independent_charter_desc: "Ministers and local leaders write a program of sovereignty, accountable aid and regional cooperation, and invite Lawrence to read it."
lawrence_offer_charter_tt: "Lawrence's trust in the government rises by §Y10§!. If trust, success and British overreach are great enough, Lawrence may ask to join the charter."

# Missions
lawrence_trace_ledger_mission: "Trace the Gold Ledger"
lawrence_trace_ledger_mission_desc: "Seize the ledgers of the banks and customs houses that handled British money before the network cleans its accounts."
lawrence_ledger_hold_tt: "Hold the capital and the main port with at least §Y[?lawrence_garrison_need|0]§! divisions each for §Y42§! days. Held so far: §Y[?lawrence_ledger_hold_days|0]§! days."
lawrence_ledger_success_tt: "Evidence grows by §Y1§!, Influence falls by §Y8§! and exposure falls. The main nodes stay secured."
lawrence_ledger_partial_tt: "Evidence grows by §Y1§!. The records were only partly seized."
lawrence_ledger_failure_tt: "The investigators are exposed. Influence rises by §Y4§! and exposure rises. The audit cannot be repeated for §Y90§! days."
lawrence_secure_officers_mission: "Securing the Officer Corps"
lawrence_secure_officers_mission_desc: "Keep the capital garrisoned until the officers who follow the mission are a minority."
lawrence_officers_secured_tt: "At most §Y30§! of every hundred officers follow the mission. Now: §Y[?lawrence_officers|0]§!. The share falls each week the capital is held."
lawrence_officers_success_tt: "Influence falls by §Y10§! and the officers stay loyal to the government."
lawrence_officers_failure_tt: "Officers defect and the command divides. Stability falls by §Y4§! and Influence rises by §Y5§!. The mission cannot be repeated for §Y90§! days."
lawrence_expose_network_mission: "Expose the Network"
lawrence_expose_network_mission_desc: "Gather enough evidence of the legation's paymasters, couriers and officers to put before the region."
lawrence_expose_evidence_tt: "The security service holds evidence of at least §Y3§! (now §Y[?lawrence_evidence|0]§!)"
lawrence_expose_success_tt: "The mission is exposed in public. Influence falls by §Y25§! and British credibility falls by §Y15§!. Neighbouring governments prepare."
lawrence_expose_partial_tt: "The evidence is kept as private leverage. Influence falls by §Y8§! and British credibility falls by §Y5§!."
lawrence_expose_double_tt: "With the turned contact ready, the cabinet keeps the arms and denies Britain the settlement. The mission ends in a double-game victory."
lawrence_expose_failure_tt: "Witnesses disappear and the files are discredited. Stability falls by §Y3§!, Influence rises by §Y5§! and evidence falls."
lawrence_dismantle_mission: "Dismantle the Contact Network"
lawrence_dismantle_mission_desc: "Hold the capital, the port and the road long enough to arrest the couriers and close the accounts."
lawrence_dismantle_hold_tt: "Hold the capital, the port and the route state with at least §Y[?lawrence_garrison_need|0]§! divisions each for §Y56§! days. Held so far: §Y[?lawrence_dismantle_hold_days|0]§! days."
lawrence_dismantle_success_tt: "The network is dismantled and the mission ends. Neighbouring governments learn the methods and British credibility falls."
lawrence_dismantle_partial_tt: "Part of the network is closed. Influence falls by §Y12§!. The cleanup cannot be repeated for §Y90§! days."
lawrence_dismantle_failure_tt: "The network recovers. Influence rises by §Y6§! and the evidence is discredited."

# ---------------------------------------------------------------------------
# British decisions
# ---------------------------------------------------------------------------
lawrence_authorize_gold_and_arms: "Authorize Gold and Arms"
lawrence_authorize_gold_and_arms_desc: "The Treasury and the War Office release a convoy of rifles, radios and sovereigns for the mission's payroll."
lawrence_authorize_arms_tt: "A shipment is dispatched to the target and arrives in a few weeks, unless the security service seizes it. Influence rises when it arrives, by more if the government does not take custody. British support runs for §Y70§! days. Costs rise with the size of the target."
lawrence_no_shipment_pending_tt: "No shipment is waiting for arrival"
lawrence_send_officer_cadres: "Send Officer Cadres"
lawrence_send_officer_cadres_desc: "Training officers and staff specialists leave for the legation."
lawrence_send_cadres_tt: "The target's army gains experience, the share of its officers who follow the mission rises by §Y15§! and Influence rises by §Y4§!. Exposure rises. Britain carries a personnel commitment for §Y120§! days that lowers its command power gain and army experience gain."
lawrence_secure_the_red_sea_route: "Secure the Red Sea Route"
lawrence_secure_the_red_sea_route_desc: "Escorts, tankers and port agents are assigned to the sea road to the mission."
lawrence_secure_sea_route_tt: "For §Y180§! days shipments travel §Y15§! days faster and cannot be seized. Starts the §YKeep the Arms Route Open§! mission."
lawrence_british_base_tt: "Britain holds a base in the region"
lawrence_repair_the_rail_and_telegraph_link: "Repair the Rail and Telegraph Link"
lawrence_repair_the_rail_and_telegraph_link_desc: "British engineers repair the line and the wire that connect the legation to the capital and the coast."
lawrence_repair_rail_tt: "The capital and one route state gain §Y1§! infrastructure level. Shipments travel §Y10§! days faster and cannot be seized. Starts the §YKeep the Arms Route Open§! mission."
lawrence_expand_the_radio_and_press_network: "Expand the Radio and Press Network"
lawrence_expand_the_radio_and_press_network_desc: "Newspapers, radio sets and public meetings carry the legation's argument to a wider audience."
lawrence_expand_press_tt: "Influence rises by §Y4§! at once and the network adds to it every week for §Y150§! days. It is less effective when the target holds a counterintelligence file or has a strong security service. Exposure rises."
lawrence_press_ended_tt: "The press network is no longer funded."
lawrence_promise_constitutional_guarantees: "Promise Constitutional Guarantees"
lawrence_promise_constitutional_guarantees_desc: "London tells the cabinet in writing that its internal government will remain its own."
lawrence_promise_guarantees_tt: "Influence rises by §Y3§! and British credibility rises by §Y5§!. The promise is registered. A protectorate agreed later breaks it and costs credibility across the region."
lawrence_tie_aid_to_bases_and_access: "Tie Aid to Bases and Access"
lawrence_tie_aid_to_bases_and_access_desc: "A larger package is offered to the cabinet in return for the use of harbors, airfields and roads."
lawrence_offer_bases_tt: "The package is committed and the target decides. If it accepts, it receives the equipment, Britain gains military access and Influence rises by §Y8§!. If it declines, the equipment returns and the political power stays spent."
lawrence_disavow_the_mission: "Disavow the Mission"
lawrence_disavow_the_mission_desc: "The Foreign Secretary tells the House that Lawrence acts without authority."
lawrence_disavow_tt: "Lawrence leaves British service. Influence in the target falls by §Y15§! and British credibility falls by §Y8§!. Lawrence's trust in critics of Britain rises. Local agents carry on at half strength."
lawrence_attempt_a_recovery_operation: "Attempt a Recovery Operation"
lawrence_attempt_a_recovery_operation_desc: "A small party prepares to free the prisoner from the fortress."
lawrence_recovery_tt: "Success needs contacts among the officers, an open route and a weak security service. Failure costs British credibility and can cost Lawrence his life. Can be tried every §Y120§! days."
lawrence_negotiate_an_exchange: "Negotiate an Exchange"
lawrence_negotiate_an_exchange_desc: "An envoy carries London's offer to the prisoner's captors."
lawrence_exchange_tt: "The package is committed and the target decides. If it accepts, it receives the package once and Lawrence returns. If it holds out, the package returns."
lawrence_exchange_once_tt: "No exchange offer is already open"
lawrence_arms_route_mission: "Keep the Arms Route Open"
lawrence_arms_route_mission_desc: "Keep the route to the mission open until a shipment arrives by it."
lawrence_route_delivered_tt: "A British shipment reaches the target while the route is held"
lawrence_route_success_tt: "British credibility rises by §Y3§! and Influence rises by §Y3§!. British support continues for §Y60§! days."
lawrence_route_failure_tt: "The route is lost and British credibility falls by §Y3§!."

