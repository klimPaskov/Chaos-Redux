l_english:
chaos_redux_032_achievement_eligible_tooltip: "Available to an established country that remains in existence and completes every required stage of the Missile Age without outside intervention."
chaosx_032_achievement_locked_tooltip: "The missile command record has not met the required chain of operations."

chaos_redux_032_exact_distance_NAME: "Exact Distance"
chaos_redux_032_exact_distance_DESC: "Deliver twelve precise conventional strikes across twelve states in four enemy countries without losing command of any operation."
chaos_redux_032_exact_distance_tooltip: "Record 12 on-target or limited-success conventional precision strikes in 12 different strategic states across 4 enemy countries. None may drift onto a neutral country, hit your own territory, carry a special payload, use a command or broad civilian target profile, or cause excessive civilian deaths."
chaos_redux_032_exact_distance_locked: "The precision strike record is incomplete."

chaos_redux_032_still_on_the_line_NAME: "Still on the Line"
chaos_redux_032_still_on_the_line_DESC: "Keep three hardened launch sites secure, survive an enemy strike with at least two intact, and repair the damaged site within the deadline."
chaos_redux_032_still_on_the_line_tooltip: "Maintain 3 hardened, secure launch sites in 3 regions with readiness and command control at 85 or higher, keep at least 2 sites after enemy damage, and repair the damaged site within 180 days."
chaos_redux_032_still_on_the_line_locked: "The launch line has not held through damage and repair."

chaos_redux_032_break_the_chain_NAME: "Break the Chain"
chaos_redux_032_break_the_chain_DESC: "Stop a retaliation chain before anyone launches, then hold the peace for ninety days."
chaos_redux_032_break_the_chain_tooltip: "Resolve a retaliation exchange that has reached its second round and involves 4 countries. Prevent both a retaliatory launch and any special-payload use, then survive for 90 days after the crisis closes."
chaos_redux_032_break_the_chain_locked: "The retaliation chain remains unbroken."

chaos_redux_032_keys_returned_NAME: "Keys Returned"
chaos_redux_032_keys_returned_DESC: "Retake control of a rogue missile site without a launch, scuttling, or foreign seizure."
chaos_redux_032_keys_returned_tooltip: "Recover a rogue missile site with a reserve or prepared operation, prevent an unauthorized launch, avoid scuttling and foreign seizure, restore security, and return command control to 75 or higher."
chaos_redux_032_keys_returned_locked: "The rogue command has not been recovered cleanly."

chaos_redux_032_no_second_sun_NAME: "No Second Sun"
chaos_redux_032_no_second_sun_DESC: "Endure an enemy nuclear or thermonuclear strike, win the war, and never answer in kind."
chaos_redux_032_no_second_sun_tooltip: "Survive an incoming enemy nuclear or thermonuclear missile strike during a war, retain a qualifying delivery option, win the war, and use no nuclear or thermonuclear missile yourself."
chaos_redux_032_no_second_sun_locked: "The war has not ended without nuclear retaliation."

chaos_redux_032_empty_the_silos_NAME: "Empty the Silos"
chaos_redux_032_empty_the_silos_DESC: "Strip an enemy missile force from the map with conventional counterforce, then win the war."
chaos_redux_032_empty_the_silos_tooltip: "Begin a war against an enemy with at least 3 active launch sites, destroy every one of them with conventional counterforce strikes, prevent rebuilding, and win the war or force a favorable surrender."
chaos_redux_032_empty_the_silos_locked: "The enemy silos are not empty."

chaos_redux_032_sky_full_of_steel_NAME: "Sky Full of Steel"
chaos_redux_032_sky_full_of_steel_DESC: "Carry out five conventional saturation operations and win the war within a year of the first one."
chaos_redux_032_sky_full_of_steel_tooltip: "Complete 5 conventional saturation operations in one war across 10 enemy states, do enough strategic damage to cripple the enemy, hold Command Control at 35 or higher through the final launch, and win within 365 days of the first operation."
chaos_redux_032_sky_full_of_steel_locked: "The saturation campaign has not yet broken the enemy."

chaos_redux_032_long_reach_NAME: "Long Reach"
chaos_redux_032_long_reach_DESC: "Keep a mature missile line at peak readiness through a war with a major power and complete every operational role."
chaos_redux_032_long_reach_tooltip: "Complete the missile technology line. While at war with a major power, hold 3 secure sites in 3 regions with the mature reserve and with readiness and command control at 90 or higher for 180 days, complete precision, strategic barrage, and counterforce operations, and retain 2 sites."
chaos_redux_032_long_reach_locked: "The mature missile line has not held its reach."
