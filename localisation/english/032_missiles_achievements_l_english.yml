l_english:
 chaosx_032_achievement_eligible_tooltip: "Available to an ordinary country in a natural Event 32 campaign. SCN-015, force or debug bypasses, a ceased country, and a disabled required evolution make the campaign ineligible."
 chaosx_032_achievement_locked_tooltip: "The missile command record has not met the required chain of operations."

 chaos_redux_032_exact_distance_NAME: "Exact Distance"
 chaos_redux_032_exact_distance_DESC: "Deliver twelve precise conventional strikes across twelve states in four enemy countries, and keep every receipt clean."
 chaos_redux_032_exact_distance_tooltip: "Record 12 on-target or limited-success conventional precision strikes in 12 distinct strategic states across 4 enemy countries, with no neutral drift, self-strike, special payload, command profile, broad civilian profile, or excessive civilian deaths."
 chaos_redux_032_exact_distance_locked: "The precision ledger is incomplete."

 chaos_redux_032_still_on_the_line_NAME: "Still on the Line"
 chaos_redux_032_still_on_the_line_DESC: "Keep three hardened launch sites secure, absorb a damaging strike, and bring the line back within the deadline."
 chaos_redux_032_still_on_the_line_tooltip: "Maintain 3 hardened and secure launch sites in 3 regions with readiness and command control at 85 or higher, retain at least 2 sites after enemy damage, and repair the damaged site within 180 days."
 chaos_redux_032_still_on_the_line_locked: "The launch line has not held through damage and repair."

 chaos_redux_032_break_the_chain_NAME: "Break the Chain"
 chaos_redux_032_break_the_chain_DESC: "Stop a retaliation chain before warning becomes launch, then live with the decision for ninety days."
 chaos_redux_032_break_the_chain_tooltip: "Resolve a retaliation incident at chain depth 2 or higher involving 4 countries, with an actionable warning, no retaliatory launch or special payload, and 90 days of survival after closure."
 chaos_redux_032_break_the_chain_locked: "The retaliation chain remains unbroken."

 chaos_redux_032_keys_returned_NAME: "Keys Returned"
 chaos_redux_032_keys_returned_DESC: "Recover a rogue command without launching, scuttling, or surrendering control."
 chaos_redux_032_keys_returned_tooltip: "Recover a rogue missile site with a reserve or prepared operation, prevent an unauthorized launch, avoid scuttling and foreign seizure, restore security, and return command control to 75 or higher."
 chaos_redux_032_keys_returned_locked: "The rogue command has not been recovered cleanly."

 chaos_redux_032_no_second_sun_NAME: "No Second Sun"
 chaos_redux_032_no_second_sun_DESC: "Endure an enemy nuclear or thermonuclear strike, win the war, and never answer in kind."
 chaos_redux_032_no_second_sun_tooltip: "Survive an incoming enemy nuclear or thermonuclear missile strike during a war, retain a qualifying delivery option, win the war, and use no nuclear or thermonuclear missile yourself."
 chaos_redux_032_no_second_sun_locked: "The war has not ended beneath an unbroken restraint."

 chaos_redux_032_empty_the_silos_NAME: "Empty the Silos"
 chaos_redux_032_empty_the_silos_DESC: "Strip an enemy missile force from the map with conventional counterforce, then win the war."
 chaos_redux_032_empty_the_silos_tooltip: "Begin a qualifying war against an enemy with at least 3 active launch sites, remove every opening site through credited conventional counterforce, prevent rebuilding, and win or force a favorable surrender."
 chaos_redux_032_empty_the_silos_locked: "The enemy silos are not empty."

 chaos_redux_032_sky_full_of_steel_NAME: "Sky Full of Steel"
 chaos_redux_032_sky_full_of_steel_DESC: "Fill the sky with five conventional saturation operations and bring a strategic war to victory within a year."
 chaos_redux_032_sky_full_of_steel_tooltip: "Complete 5 conventional saturation operations in one war across 10 enemy strategic states, meet the required strategic damage threshold, hold command control at 35 or higher through the final launch, and win within 365 days of the first operation."
 chaos_redux_032_sky_full_of_steel_locked: "The saturation campaign has not reached its decisive limit."

 chaos_redux_032_long_reach_NAME: "Long Reach"
 chaos_redux_032_long_reach_DESC: "Hold a mature missile line at peak readiness while a major power is at war, then prove every operational role."
 chaos_redux_032_long_reach_tooltip: "Complete the missile technology line, maintain 3 secure sites in 3 regions with the mature reserve and readiness and command control at 90 or higher for 180 days at war with a major, complete precision, strategic barrage, and counterforce operations, and retain 2 sites."
 chaos_redux_032_long_reach_locked: "The mature missile line has not held its reach."
