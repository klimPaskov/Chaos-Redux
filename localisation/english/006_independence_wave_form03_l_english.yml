# Charter idea lifecycle
independence_wave_form03_provisional_charter: "Provisional Charter of Languages and Works"
independence_wave_form03_provisional_charter_desc: "Temporary service schedules and divided works boards keep the confederation operating while the permanent charter is drafted. The unsettled arrangement weighs on public confidence, consumer supply, and factory coordination."
independence_wave_form03_charter_without_works: "Charter Without Works"
independence_wave_form03_charter_without_works_desc: "The public-service settlement is durable enough to steady the confederation, but incomplete common works leave households carrying the cost of divided transport and industrial administration."
independence_wave_form03_industrial_directorate: "Industrial Directorate"
independence_wave_form03_industrial_directorate_desc: "Common works and production standards have advanced ahead of the constitutional settlement. Factories benefit from central coordination while unresolved service rights erode political stability."
independence_wave_form03_dual_compromise: "Dual Compromise"
independence_wave_form03_dual_compromise_desc: "Both charter pillars remain workable, though neither has reached ratification. Layered service schedules and provisional works protocols add a modest burden to civilian consumption."
independence_wave_form03_ratified_confederation: "Ratified Confederation"
independence_wave_form03_ratified_confederation_desc: "A ratified language settlement and industrial compact give the confederation a durable constitutional basis. Stable service guarantees, coordinated production, and recognized trade procedures support the whole association."
independence_wave_form03_charter_rupture: "Charter Rupture"
independence_wave_form03_charter_rupture_desc: "The constitutional bargain has broken below a working settlement. Conflicting service rules, suspended works, and public uncertainty will persist until formal talks reopen."

# Bounded state corridor modifiers
independence_wave_form03_sambre_meuse_corridor_modifier: "Sambre-Meuse Corridor Authority"
independence_wave_form03_sambre_meuse_corridor_modifier_desc: "Published transfer schedules, connected depots, and a common works authority improve local resources, supplies, and infrastructure construction along the Sambre-Meuse industrial corridor."
independence_wave_form03_frisian_waterway_modifier: "Northern Waterway Standards Board"
independence_wave_form03_frisian_waterway_modifier_desc: "Municipal engineers, water boards, Dutch-language services, and West Frisian community representatives coordinate navigation and pumping standards across the northern waterway district, improving local supplies and infrastructure construction."
independence_wave_form03_associate_corridor_modifier: "Sovereign Associate Corridor"
independence_wave_form03_associate_corridor_modifier_desc: "The owning sovereign government administers a ratified corridor protocol that improves local supplies and infrastructure construction."

# Event 6 FORM-03 post-charter chain
chaosx.nr6.300.t: "A Confederation on Provisional Terms"
chaosx.nr6.300.d: "The founding act has opened federal offices, joined two regional mandates, and offered sovereign neighbors a treaty association. Delegates must still decide how residents are served across languages and how rail, river, port, and waterway authorities share their burdens.\n\nThe provisional charter begins with §CFederal Accommodation§! at [GetIndependenceWaveForm03AccommodationBand] and §OIndustrial Integration§! at [GetIndependenceWaveForm03IntegrationBand]. Delegates must turn both into institutions before a durable compact can be ratified. Belgium, the Netherlands, and Luxembourg retain their own governments, territory, armed forces, and diplomacy under any association they choose."
chaosx.nr6.300.a: "Put languages and works before the delegates."
chaosx.nr6.300.a.tt: "The §YCharter of Languages and Works§! progression is active. Its two public values begin at §Y[?constant:independence_wave_form03_value.initial_accommodation|0]§! and §Y[?constant:independence_wave_form03_value.initial_integration|0]§!."

chaosx.nr6.301.t: "A Language for Federal Service"
chaosx.nr6.301.d: "The convention has reached the question that no temporary circular can settle. Federal offices need a service model that residents can use, officials can administer, and sovereign associates can adopt through their own institutions.\n\nParallel services promise the broadest common guarantee at a continuing administrative cost. Territorial administration protects regional practice through a federal appeal. A common working register moves files quickly, provided protected local services receive later investment."
chaosx.nr6.301.a: "Maintain parallel federal services."
chaosx.nr6.301.a.tt: "Adopt §Y$independence_wave_form03_language_model_parallel_services$§!.\n§CFederal Accommodation§!: §G+[?constant:independence_wave_form03_delta.parallel_services|0]§!\n§YLegitimacy§!: §G+[?constant:independence_wave_value.standard_gain|0]§!\n§YRecognition§!: §G+[?constant:independence_wave_value.minor_gain|0]§!\n§YAdministrative Capacity§!: §R[?constant:independence_wave_value.minor_loss|0]§!\nUnlocks multilingual examinations and member language codes."
chaosx.nr6.301.b: "Let districts administer, with a federal appeal."
chaosx.nr6.301.b.tt: "Adopt §Y$independence_wave_form03_language_model_territorial_administration$§!.\n§CFederal Accommodation§!: §G+[?constant:independence_wave_form03_delta.territorial_administration|0]§!\n§YLegitimacy§!: §G+[?constant:independence_wave_value.standard_gain|0]§!\n§YAdministrative Capacity§!: §G+[?constant:independence_wave_value.minor_gain|0]§!\n§RInstability§!: §G[?constant:independence_wave_value.minor_loss|0]§!\nUnlocks member language codes and the federal appeals office."
chaosx.nr6.301.c: "Use one register and protect local services."
chaosx.nr6.301.c.tt: "Adopt §Y$independence_wave_form03_language_model_working_register$§!.\n§CFederal Accommodation§!: §G+[?constant:independence_wave_form03_delta.working_register|0]§!\n§YLegitimacy§!: §R[?constant:independence_wave_value.minor_loss|0]§!\n§YAdministrative Capacity§!: §G+[?constant:independence_wave_value.standard_gain|0]§!\n§RInstability§!: §R+[?constant:independence_wave_value.standard_gain|0]§!\nUnlocks examinations, member language codes, and the protected-service extension."

chaosx.nr6.302.t: "The Charter Requests Our Answer"
chaosx.nr6.302.d: "The confederal convention has adopted §Y[GetIndependenceWaveForm03LanguageModelText]§! and asks us to define our place in the constitutional settlement.\n\nFull accession requires a separate [?constant:independence_wave_decision_duration.long|0]-day program in our own administration. Limited association preserves economic participation without making us a constitutional signatory. We may also withhold our language guarantees. Every course preserves our government, territory, armed forces, and diplomatic authority."
chaosx.nr6.302.a: "Request full constitutional accession."
chaosx.nr6.302.a.tt: "Our status remains unresolved until we complete §Y$independence_wave_form03_implement_member_language_guarantees$§!. We pay and administer that work ourselves."
chaosx.nr6.302.b: "Remain a limited economic associate."
chaosx.nr6.302.b.tt: "We retain autonomous membership and may consider a sovereign corridor protocol. Our status remains outside the constitutional signatory ledger, and the carrier's universal settlement proceeds independently."
chaosx.nr6.302.c: "Withhold constitutional participation."
chaosx.nr6.302.c.tt: "Our language status is recorded as withheld. Corridor participation remains a separate sovereign choice."

chaosx.nr6.303.t: "A Sovereign Corridor Protocol"
chaosx.nr6.303.d: "The confederal works board offers a protocol for one corridor in a state that we own and control. We would choose the eligible site, spend our own resources, and administer the completed authority. The protocol leaves our laws, territory, and infrastructure under our government."
chaosx.nr6.303.a: "We will select and fund our own corridor."
chaosx.nr6.303.a.tt: "Unlock §Y$independence_wave_form03_fund_associate_corridor_share$§!. Completion adds §G+[?constant:independence_wave_form03_delta.associate_corridor|0] Industrial Integration§! to the carrier once and establishes a durable modifier in our selected state."
chaosx.nr6.303.b: "Keep our works outside the protocol."
chaosx.nr6.303.b.tt: "Record our industrial terms as withheld. Our territory and infrastructure remain entirely under our existing administration."

chaosx.nr6.304.t: "Accession After Ratification"
chaosx.nr6.304.d: "The confederal carrier has already ratified its compact, but its charter permits a sovereign associate to define later terms. Full constitutional accession requires us to implement the adopted language model through our own offices. Limited economic association and explicit withholding remain available.\n\nOur answer cannot revoke the carrier's completed settlement, and every option preserves our sovereignty."
chaosx.nr6.304.a: "Begin full constitutional accession."
chaosx.nr6.304.a.tt: "Unlock §Y$independence_wave_form03_implement_member_language_guarantees$§! as our own pending work. The carrier's completed compact remains in force."
chaosx.nr6.304.b: "Accept limited economic association."
chaosx.nr6.304.b.tt: "Enter as a limited sovereign associate without becoming a constitutional signatory."
chaosx.nr6.304.c: "Withhold constitutional participation."
chaosx.nr6.304.c.tt: "Record our constitutional status as withheld without disturbing the ratified carrier settlement."

chaosx.nr6.305.t: "A Sovereign Member Reports"
chaosx.nr6.305.d: "§Y[independence_wave_form03_reporting_member.GetNameDefCap]§! has reported its charter position: §Y[independence_wave_form03_reporting_member.GetIndependenceWaveForm03MemberStatusText]§!.\n\nThe report updates the confederal record while that government retains authority over its own territory, armed forces, administration, and diplomacy."
chaosx.nr6.305.a: "Enter the sovereign decision in the charter record."

chaosx.nr6.306.t: "The Charter of Languages and Works"
chaosx.nr6.306.d: "The delegates have signed a compact supported by public-service codes, an appeals or protection structure suited to the adopted model, and funded common works. §CFederal Accommodation§! stands at [GetIndependenceWaveForm03AccommodationBand], while §OIndustrial Integration§! stands at [GetIndependenceWaveForm03IntegrationBand].\n\nThe confederation can coordinate its federal institutions without absorbing its sovereign associates. Every Belgian, Dutch, or Luxembourgish participant keeps its government, territory, armed forces, and diplomacy according to the terms it ratified."
chaosx.nr6.306.a: "Seal the compact."
chaosx.nr6.306.a.tt: "Establish §Y$independence_wave_form03_ratified_confederation$§! and complete the post-charter progression."

chaosx.nr6.307.t: "The Charter Settles at [GetIndependenceWaveForm03OutcomeText]"
chaosx.nr6.307.d: "The ratification period has ended with §CFederal Accommodation§! at [GetIndependenceWaveForm03AccommodationBand] and §OIndustrial Integration§! at [GetIndependenceWaveForm03IntegrationBand]. The surviving settlement remains open to repair and resubmission."
chaosx.nr6.307.charter_without_works.d: "The language settlement has secured a ratifiable constitutional basis, but the common works remain below the required standard. Public-service guarantees enter durable operation while divided industrial obligations keep the compact incomplete.\n\n§CFederal Accommodation§!: [GetIndependenceWaveForm03AccommodationBand]\n§OIndustrial Integration§!: [GetIndependenceWaveForm03IntegrationBand]"
chaosx.nr6.307.industrial_directorate.d: "The rail, waterway, and corridor authorities have secured a ratifiable industrial basis, but the language settlement remains incomplete. A works directorate can operate while delegates repair the constitutional guarantees.\n\n§CFederal Accommodation§!: [GetIndependenceWaveForm03AccommodationBand]\n§OIndustrial Integration§!: [GetIndependenceWaveForm03IntegrationBand]"
chaosx.nr6.307.dual_compromise.d: "Neither charter pillar has reached ratification, yet both remain above the threshold for a working bargain. Temporary service codes and common-works protocols continue while delegates prepare a stronger submission.\n\n§CFederal Accommodation§!: [GetIndependenceWaveForm03AccommodationBand]\n§OIndustrial Integration§!: [GetIndependenceWaveForm03IntegrationBand]"
chaosx.nr6.307.a: "Preserve the settlement and prepare its repair."
chaosx.nr6.307.a.tt: "Install the lifecycle idea for §Y[GetIndependenceWaveForm03OutcomeText]§!. Completed one-time projects remain recognized, and the deficient pillar can be repaired before resubmission."

chaosx.nr6.308.t: "The Charter Breaks at the Threshold"
chaosx.nr6.308.d: "The ratification period has closed with at least one pillar below a working compromise. Federal offices return to provisional schedules, common works lose their shared political authority, and public confidence falls.\n\nThe confederation and its sovereign associations remain in existence. A formal reopening can restore §CFederal Accommodation§! and §OIndustrial Integration§! to a repairable minimum without undoing completed physical infrastructure."
chaosx.nr6.308.a: "Prepare the terms for reopening."
chaosx.nr6.308.a.tt: "Establish §Y$independence_wave_form03_charter_rupture$§!. §Y$independence_wave_form03_reopen_charter_talks$§! can restore a repairable compromise at its full strategic cost."
