# Charter phases
independence_wave_form03_phase_none: "No Active Charter"
independence_wave_form03_phase_none_desc: "The post-charter settlement has not begun."
independence_wave_form03_phase_provisional: "Provisional Charter"
independence_wave_form03_phase_provisional_desc: "The confederation is operating under temporary service and works arrangements."
independence_wave_form03_phase_drafting: "Charter Drafting"
independence_wave_form03_phase_drafting_desc: "Delegates are writing the language settlement and the works boards are preparing common standards."
independence_wave_form03_phase_ratification: "Ratification Window"
independence_wave_form03_phase_ratification_desc: "The compact is open for final ratification and every sovereign-member status must be resolved."
independence_wave_form03_phase_complete: "Ratified Compact"
independence_wave_form03_phase_complete_desc: "The language settlement and industrial compact have entered durable operation."
independence_wave_form03_phase_compromise: "Repairable Compromise"
independence_wave_form03_phase_compromise_desc: "One or both charter pillars need further work before resubmission."
independence_wave_form03_phase_rupture: "Charter Rupture"
independence_wave_form03_phase_rupture_desc: "The settlement has broken down and formal talks must be reopened."

# Language models
independence_wave_form03_language_model_none: "No Model Selected"
independence_wave_form03_language_model_none_desc: "The convention has not adopted a federal service arrangement."
independence_wave_form03_language_model_parallel_services: "Parallel Federal Services"
independence_wave_form03_language_model_parallel_services_desc: "Federal offices maintain parallel Dutch and French services. West Frisian and German-language guarantees are written for participating communities through negotiated local schedules."
independence_wave_form03_language_model_territorial_administration: "Territorial Administration with Federal Appeal"
independence_wave_form03_language_model_territorial_administration_desc: "Local administrations use the arrangements adopted for their districts and residents may carry service disputes to a federal appeals office. Sovereign associates retain authority over their own administrations."
independence_wave_form03_language_model_working_register: "Common Working Register with Protected Local Services"
independence_wave_form03_language_model_working_register_desc: "A common register handles confederal records. Participating authorities maintain protected Dutch, French, West Frisian, or German-language services wherever the communities concerned adopt them."

# Sovereign-member status
independence_wave_form03_member_status_carrier_resolved: "No sovereign-member vote is outstanding"
independence_wave_form03_member_status_carrier_pending: "At least one sovereign-member vote remains unresolved"
independence_wave_form03_member_status_not_associated: "Outside the charter association"
independence_wave_form03_member_status_awaiting_convention: "Sovereign member awaiting the federal language model"
independence_wave_form03_member_status_awaiting_vote: "Sovereign member considering its constitutional status"
independence_wave_form03_member_status_full_accession_pending: "Full accession requested, local guarantees pending"
independence_wave_form03_member_status_full_signatory: "Full constitutional signatory"
independence_wave_form03_member_status_limited_associate: "Limited economic associate"
independence_wave_form03_member_status_withheld: "Language guarantees withheld"
independence_wave_form03_member_status_full_and_corridor: "Full signatory and sovereign corridor partner"
independence_wave_form03_member_status_limited_and_corridor: "Limited associate and sovereign corridor partner"
independence_wave_form03_member_status_withheld_and_corridor: "Language guarantees withheld, corridor protocol completed"
independence_wave_form03_member_status_withdrawn: "Withdrawn under the present charter"

# Stored outcomes
independence_wave_form03_outcome_none: "No Final Outcome"
independence_wave_form03_outcome_none_desc: "The charter remains in preparation."
independence_wave_form03_outcome_full_compact: "Charter of Languages and Works"
independence_wave_form03_outcome_full_compact_desc: "The public-service settlement and industrial compact have both been ratified."
independence_wave_form03_outcome_charter_without_works: "Charter Without Works"
independence_wave_form03_outcome_charter_without_works_desc: "The language settlement is ratifiable and the industrial compact remains incomplete."
independence_wave_form03_outcome_industrial_directorate: "Industrial Directorate"
independence_wave_form03_outcome_industrial_directorate_desc: "The common works are ratifiable and the language settlement remains incomplete."
independence_wave_form03_outcome_dual_compromise: "Dual Compromise"
independence_wave_form03_outcome_dual_compromise_desc: "Both charter pillars survive as working arrangements below the ratification threshold."
independence_wave_form03_outcome_charter_rupture: "Charter Rupture"
independence_wave_form03_outcome_charter_rupture_desc: "The settlement has fallen below a durable compromise and requires formal reopening."

# Six-focus post-charter branch
independence_wave_form03_open_charter_convention: "Open the Charter Convention"
independence_wave_form03_open_charter_convention_desc: "The provisional charter leaves federal offices without a settled service arrangement and the new corridors without a common works authority. Carrier delegates and sovereign associates will place both questions before a public convention."
independence_wave_form03_open_charter_convention_tt: "The §YConvene the Language Convention§! decision becomes available and the charter enters drafting."
independence_wave_form03_open_charter_convention_effect_tt: "The §YConvene the Language Convention§! decision becomes available and the charter enters drafting."
independence_wave_form03_define_public_service_guarantees: "Define Public-Service Guarantees"
independence_wave_form03_define_public_service_guarantees_desc: "Federal clerks, municipal officers, schools, courts, and transport desks need rules suited to the communities they actually serve. The charter will protect negotiated Dutch, French, West Frisian, and German-language services without assigning one language to every district."
independence_wave_form03_define_public_service_guarantees_tt: "The first model-specific language actions become available after the convention selects a service arrangement."
independence_wave_form03_define_public_service_guarantees_effect_tt: "The first model-specific language actions become available after the convention selects a service arrangement."
independence_wave_form03_establish_delta_works_board: "Establish the Delta Works Board"
independence_wave_form03_establish_delta_works_board_desc: "Rail schedules, river traffic, pumping boards, and port approaches cross the founding territories. A joint works board can coordinate them through funded projects and published standards."
independence_wave_form03_establish_delta_works_board_tt: "The carrier may begin the Sambre-Meuse industrial-corridor and northern-waterway works projects. Each project requires ownership, control, transport equipment, command attention, and committed civilian factories."
independence_wave_form03_establish_delta_works_board_effect_tt: "The carrier may begin the Sambre-Meuse industrial-corridor and northern-waterway works projects. Each project requires ownership, control, transport equipment, command attention, and committed civilian factories."
independence_wave_form03_build_federal_appeals_and_examinations: "Build Federal Appeals and Examinations"
independence_wave_form03_build_federal_appeals_and_examinations_desc: "A language guarantee needs trained officials and a place where residents can challenge a service failure. Examinations and appeals will turn the adopted model into ordinary administration."
independence_wave_form03_build_federal_appeals_and_examinations_tt: "The second constitutional action for the selected language model becomes available."
independence_wave_form03_build_federal_appeals_and_examinations_effect_tt: "The second constitutional action for the selected language model becomes available."
independence_wave_form03_harmonize_corridor_standards: "Harmonize Corridor Standards"
independence_wave_form03_harmonize_corridor_standards_desc: "Common manifests and engineering tolerances can shorten transfers across agreed crossings. Belgium, the Netherlands, and Luxembourg will fund and administer any sovereign corridor share they accept."
independence_wave_form03_harmonize_corridor_standards_tt: "Common manifests, sovereign corridor invitations, and Development Compact technical work become available."
independence_wave_form03_harmonize_corridor_standards_effect_tt: "Common manifests, sovereign corridor invitations, and Development Compact technical work become available."
independence_wave_form03_submit_low_countries_compact: "Submit the Low Countries Compact"
independence_wave_form03_submit_low_countries_compact_desc: "The service code and works protocols are ready for a final test. Ratification needs resolved sovereign-member statuses, a genuine federal language scope, and enough progress in both public values."
independence_wave_form03_submit_low_countries_compact_tt: "Begins a §Y[?constant:independence_wave_decision_duration.integration|0]-day ratification window§!. Full ratification requires at least §C[?constant:independence_wave_form03_value.ratified|0] Federal Accommodation§! and §O[?constant:independence_wave_form03_value.ratified|0] Industrial Integration§!, resolved sovereign-member statuses, and a real federal language scope."
independence_wave_form03_submit_low_countries_compact_effect_tt: "Begins a §Y[?constant:independence_wave_decision_duration.integration|0]-day ratification window§!. Full ratification requires at least §C[?constant:independence_wave_form03_value.ratified|0] Federal Accommodation§! and §O[?constant:independence_wave_form03_value.ratified|0] Industrial Integration§!, resolved sovereign-member statuses, and a real federal language scope."

# Carrier decisions and ratification mission
independence_wave_form03_convene_language_convention: "Convene the Language Convention"
independence_wave_form03_convene_language_convention_desc: "Reserve a civilian factory and commit the administrative staff needed for a [?constant:independence_wave_decision_duration.long|0]-day convention. Delegates will select one federal service model when the work concludes. Cancellation before completion changes Federal Accommodation by §R[?constant:independence_wave_form03_delta.project_cancellation|0]§!."
independence_wave_form03_convene_language_convention_effect_tt: "Opens the §YLanguage Convention§! and presents every authored service model."
independence_wave_form03_open_multilingual_service_examinations: "Open Multilingual Service Examinations"
independence_wave_form03_open_multilingual_service_examinations_desc: "Over [?constant:independence_wave_decision_duration.founding|0] days, federal examiners will train and certify officials for the selected service model. Parallel services gain the strongest constitutional result and additional administrative capacity. A common working register gains a smaller constitutional result."
independence_wave_form03_open_multilingual_service_examinations_effect_tt: "§YParallel Federal Services§!: §G+[?constant:independence_wave_form03_delta.parallel_examinations|0] Federal Accommodation§! and §G+[?constant:independence_wave_value.standard_gain|0] Administrative Capacity§!.\n§YCommon Working Register§!: §G+[?constant:independence_wave_form03_delta.working_examinations|0] Federal Accommodation§!."
independence_wave_form03_publish_member_language_codes: "Publish Member Language Codes"
independence_wave_form03_publish_member_language_codes_desc: "A [?constant:independence_wave_decision_duration.standard|0]-day drafting commission will publish the service schedules that participating authorities can ratify. Each schedule follows the selected language model and leaves sovereign associates in charge of their own administrations."
independence_wave_form03_publish_member_language_codes_effect_tt: "§YParallel Federal Services§!: §G+[?constant:independence_wave_form03_delta.parallel_language_codes|0] Federal Accommodation§! and §G+[?constant:independence_wave_value.minor_gain|0] Legitimacy§!.\n§YTerritorial Administration§!: §G+[?constant:independence_wave_form03_delta.territorial_language_codes|0] Federal Accommodation§! and §G+[?constant:independence_wave_value.minor_gain|0] Legitimacy§!.\n§YCommon Working Register§!: §G+[?constant:independence_wave_form03_delta.working_language_codes|0] Federal Accommodation§!."
independence_wave_form03_establish_federal_language_appeals: "Establish Federal Language Appeals"
independence_wave_form03_establish_federal_language_appeals_desc: "For [?constant:independence_wave_decision_duration.long|0] days, jurists and municipal officers will establish a federal remedy for residents denied the public services promised by the territorial model. The appeals office reviews confederal obligations while sovereign authorities continue to administer their own institutions."
independence_wave_form03_establish_federal_language_appeals_effect_tt: "Gain §G+[?constant:independence_wave_form03_delta.federal_appeals|0] Federal Accommodation§! and reduce §RInstability§! by §G[?constant:independence_wave_value.minor_gain|0]§!."
independence_wave_form03_extend_protected_local_services: "Extend Protected Local Services"
independence_wave_form03_extend_protected_local_services_desc: "The common register needs a costly [?constant:independence_wave_decision_duration.long|0]-day protection program before it can support a durable settlement. Offices serving participating Dutch, French, West Frisian, and German-speaking communities will receive trained staff and published local schedules."
independence_wave_form03_extend_protected_local_services_effect_tt: "Gain §G+[?constant:independence_wave_form03_delta.protected_service_extension|0] Federal Accommodation§!."

independence_wave_form03_reconnect_sambre_meuse_corridor: "Reconnect the Sambre-Meuse Corridor"
independence_wave_form03_reconnect_sambre_meuse_corridor_desc: "Assign [?constant:independence_wave_decision_cost.civilian_factory_major|0] civilian factories, [?constant:independence_wave_decision_cost.train_major|0] trains, and command staff to a [?constant:independence_wave_decision_duration.long|0]-day Sambre-Meuse works program. Completion establishes a durable corridor authority and queues an infrastructure extension where the network can accept it. Loss of ownership or control cancels the works and changes Industrial Integration by §R[?constant:independence_wave_form03_delta.project_cancellation|0]§!."
independence_wave_form03_reconnect_sambre_meuse_corridor_effect_tt: "Gain §G+[?constant:independence_wave_form03_delta.anchor_works|0] Industrial Integration§!, apply §Y$independence_wave_form03_sambre_meuse_corridor_modifier$§! to the Sambre-Meuse industrial corridor, and queue §G[?constant:independence_wave_decision_effect.construction_infrastructure|0]§! non-instant infrastructure level where possible. A Walloon-origin carrier also strengthens its industrial continuity."
independence_wave_form03_coordinate_frisian_waterway_standards: "Coordinate Northern Waterway Standards"
independence_wave_form03_coordinate_frisian_waterway_standards_desc: "Municipal engineers, water boards, Dutch-language services, and West Frisian community representatives in the northern waterway district will coordinate gauges, pumping schedules, and navigational rules for [?constant:independence_wave_decision_duration.long|0] days. The program requires [?constant:independence_wave_decision_cost.civilian_factory_major|0] civilian factories, [?constant:independence_wave_decision_cost.train_standard|0] trains, [?constant:independence_wave_decision_cost.convoy_light|0] convoys, and command staff. Loss of ownership or control cancels the works and changes Industrial Integration by §R[?constant:independence_wave_form03_delta.project_cancellation|0]§!."
independence_wave_form03_coordinate_frisian_waterway_standards_effect_tt: "Gain §G+[?constant:independence_wave_form03_delta.anchor_works|0] Industrial Integration§!, apply §Y$independence_wave_form03_frisian_waterway_modifier$§! to the northern waterway district, and queue §G[?constant:independence_wave_decision_effect.construction_infrastructure|0]§! non-instant infrastructure level where possible. A Frisian-origin carrier also strengthens waterline and coastal security."
independence_wave_form03_standardize_rail_and_customs_manifests: "Standardize Rail and Customs Manifests"
independence_wave_form03_standardize_rail_and_customs_manifests_desc: "A [?constant:independence_wave_decision_duration.long|0]-day administrative program will align timetables, cargo forms, and transfer records across agreed crossings. Each sovereign associate continues to issue and enforce its own customs orders."
independence_wave_form03_standardize_rail_and_customs_manifests_effect_tt: "Gain §G+[?constant:independence_wave_form03_delta.shared_manifests|0] Industrial Integration§!."
independence_wave_form03_request_development_compact_technical_mission: "Request a Development Compact Technical Mission"
independence_wave_form03_request_development_compact_technical_mission_desc: "Change shared League Reserve by §R[?constant:independence_wave_form03_league.technical_mission_reserve_cost|0]§! at selection and assign a civilian factory to a [?constant:independence_wave_decision_duration.long|0]-day technical mission. The League must hold at least [?constant:independence_wave_form03_league.technical_mission_minimum_reserve|0] reserve before the commitment. Cancellation returns [?constant:independence_wave_form03_league.technical_mission_cancel_refund|0] reserve, while the remainder pays for work already commissioned."
independence_wave_form03_request_development_compact_technical_mission_effect_tt: "Gain §G+[?constant:independence_wave_form03_delta.compact_technical_mission|0] Industrial Integration§!, §G+[?constant:independence_wave_value.standard_gain|0] Administrative Capacity§!, §G+[?constant:independence_wave_form03_league.contribution_gain|0]§! own League Contribution, §G+[?constant:independence_wave_form03_league.confidence_gain|0]§! own League Confidence, and §G+[?constant:independence_wave_decision_effect.league_minor|0]§! League Cohesion and Common Cause."
independence_wave_form03_invite_sovereign_corridor_partners: "Invite Sovereign Corridor Partners"
independence_wave_form03_invite_sovereign_corridor_partners_desc: "Prepare individual corridor protocols for eligible Belgian, Dutch, and Luxembourgish associates over [?constant:independence_wave_decision_duration.long|0] days. Every invited government decides whether to fund a project in one of its own eligible states."
independence_wave_form03_invite_sovereign_corridor_partners_effect_tt: "Eligible sovereign associates receive a corridor protocol. Acceptance unlocks a project paid for, selected, and administered by that member."

independence_wave_form03_ratify_confederal_charter: "Ratify the Confederal Charter"
independence_wave_form03_ratify_confederal_charter_desc: "The charter remains before the delegates for [?constant:independence_wave_decision_duration.integration|0] days. It can be ratified once both public values reach §Y[?constant:independence_wave_form03_value.ratified|0]§!, every sovereign-member status is resolved, and a genuine federal language scope exists. If time expires, the stored values determine a constitutional compromise or a rupture."
independence_wave_form03_ratify_confederal_charter_effect_tt: "Ratify the §YCharter of Languages and Works§! and establish the durable confederal settlement."
independence_wave_form03_ratify_confederal_charter_timeout_tt: "The charter is judged from its live values. A ratifiable language pillar produces §YCharter Without Works§!, a ratifiable industrial pillar produces an §YIndustrial Directorate§!, two working pillars produce a §YDual Compromise§!, and either pillar below §Y[?constant:independence_wave_form03_value.compromise|0]§! produces §RCharter Rupture§!."
independence_wave_form03_resubmit_confederal_charter: "Resubmit the Confederal Charter"
independence_wave_form03_resubmit_confederal_charter_desc: "Return a repairable settlement to the delegates after [?constant:independence_wave_decision_duration.long|0] days of renewed diplomatic work. The same constitutional, industrial, member-status, and language-scope gates apply, while completed one-time projects remain recognized."
independence_wave_form03_resubmit_confederal_charter_effect_tt: "Ratify the §YCharter of Languages and Works§! without repeating completed charter projects."
independence_wave_form03_reopen_charter_talks: "Reopen Charter Talks"
independence_wave_form03_reopen_charter_talks_desc: "A rupture can be answered by a [?constant:independence_wave_decision_duration.integration|0]-day constitutional conference backed by [?constant:independence_wave_decision_cost.civilian_factory_major|0] civilian factories and a full strategic commitment. Reopening restores each public value to a working minimum and permits one new repair cycle."
independence_wave_form03_reopen_charter_talks_effect_tt: "Raise §CFederal Accommodation§! and §OIndustrial Integration§! to at least §Y[?constant:independence_wave_form03_value.compromise|0]§!, clear the present repair locks, and establish a repairable compromise."
independence_wave_form03_repair_language_settlement: "Repair the Language Settlement"
independence_wave_form03_repair_language_settlement_desc: "A [?constant:independence_wave_decision_duration.long|0]-day commission will address the unresolved service guarantees that prevented ratification. This repair is available once in the present failure cycle while Federal Accommodation remains below the ratification threshold."
independence_wave_form03_repair_language_settlement_effect_tt: "Gain §G+[?constant:independence_wave_form03_delta.repair|0] Federal Accommodation§!."
independence_wave_form03_repair_industrial_compact: "Repair the Industrial Compact"
independence_wave_form03_repair_industrial_compact_desc: "Assign [?constant:independence_wave_decision_cost.civilian_factory_major|0] civilian factories, [?constant:independence_wave_decision_cost.train_major|0] trains, and command staff to a [?constant:independence_wave_decision_duration.extended|0]-day program that resolves the remaining common-works obligations. This repair is available once in the present failure cycle while Industrial Integration remains below the ratification threshold."
independence_wave_form03_repair_industrial_compact_effect_tt: "Gain §G+[?constant:independence_wave_form03_delta.repair|0] Industrial Integration§!."

# Sovereign-member decisions
independence_wave_form03_implement_member_language_guarantees: "Implement the Member Language Guarantees"
independence_wave_form03_implement_member_language_guarantees_desc: "As a full constitutional applicant, we will spend [?constant:independence_wave_decision_duration.long|0] days adapting our own public-service schedules to the selected charter model. Our government, territory, armed forces, and diplomacy remain under our authority throughout the work."
independence_wave_form03_implement_member_language_guarantees_effect_tt: "Complete our constitutional accession, record the selected guarantees in our administration, and report our ratification to the confederal carrier."
independence_wave_form03_fund_associate_corridor_share: "Fund an Associate Corridor Share"
independence_wave_form03_fund_associate_corridor_share_desc: "Choose one eligible state that we own and control, then fund a [?constant:independence_wave_decision_duration.long|0]-day corridor project there. We select the site, pay the cost, retain full sovereignty, and administer the completed works."
independence_wave_form03_fund_associate_corridor_share_effect_tt: "Apply §Y$independence_wave_form03_associate_corridor_modifier$§! to the selected state, queue §G[?constant:independence_wave_decision_effect.construction_infrastructure|0]§! non-instant infrastructure level where possible, and add §G+[?constant:independence_wave_form03_delta.associate_corridor|0] Industrial Integration§! to the carrier once."
independence_wave_form03_withdraw_from_autonomous_membership: "Withdraw from Autonomous Membership"
independence_wave_form03_withdraw_from_autonomous_membership_desc: "End our participation under the present charter after [?constant:independence_wave_decision_duration.standard|0] days of diplomatic notice. Our sovereignty remains intact. Withdrawal closes re-accession for this charter lifecycle and removes only our active association rights and duties."
independence_wave_form03_withdraw_from_autonomous_membership_effect_tt: "Record a final withdrawal under the present charter. During drafting or ratification, the carrier's Federal Accommodation, Industrial Integration, and Legitimacy each change by §R-[?constant:independence_wave_decision_effect.bilateral_minor|0]§!. A withdrawing League member's own League Confidence changes by §R[?constant:independence_wave_form03_league.failure_loss|0]§!."

