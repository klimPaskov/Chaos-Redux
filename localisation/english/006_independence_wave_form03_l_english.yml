# EVENT 006 FORM-03 - CHARTER OF LANGUAGES AND WORKS
# ============================================================================

# Category and visible charter state
independence_wave_form03_low_countries_category: "Charter of Languages and Works"
independence_wave_form03_low_countries_category_desc: "Founding delegates can establish the Confederation of the Low Countries and sovereign neighbors can enter by treaty. Once the charter is active, public-service guarantees and common works require their own negotiated settlement.\n\n§CFederal Accommodation:§! [GetIndependenceWaveForm03AccommodationBand]\n§OIndustrial Integration:§! [GetIndependenceWaveForm03IntegrationBand]\n§YCharter Phase:§! [GetIndependenceWaveForm03PhaseText]\n§YLanguage Model:§! [GetIndependenceWaveForm03LanguageModelText]\n§YMember Status:§! [GetIndependenceWaveForm03MemberStatusText]\n§YCharter Outcome:§! [GetIndependenceWaveForm03OutcomeText]\n\n§gBelgium, the Netherlands, and Luxembourg remain sovereign associates. Their governments, capitals, armies, territory, and diplomatic authority stay under their own control.§!"

