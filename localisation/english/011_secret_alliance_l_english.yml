# Visible decision and mission requirements
secret_alliance_investigation_requirements_tt: "Requires an open investigation slot and the displayed command, support-equipment, and stability commitment."
secret_alliance_investigation_envoy_requirements_tt: "Requires an open investigation slot, the displayed investigation package, and an owned and controlled coastal state for the extraction."
secret_alliance_investigation_transport_requirements_tt: "Requires an open investigation slot, the displayed command and support package, and the listed trains or convoys."
secret_alliance_investigation_circuit_requirements_tt: "Requires an open investigation slot, at least a partial dossier, a mature incident pattern, and the displayed investigation package."
secret_alliance_protection_requirements_tt: "Requires an open protection slot and the displayed command, army-experience, and support-equipment package."
secret_alliance_protection_transport_requirements_tt: "Requires an open protection slot, the standard protection package, and the listed trains or trucks."
secret_alliance_protection_manpower_requirements_tt: "Requires an open protection slot, the standard protection package, and the listed manpower reserve."
secret_alliance_protection_overseas_requirements_tt: "Requires an open protection slot, a coastal state, and the displayed fuel and convoy package."
secret_alliance_protection_continuity_requirements_tt: "Requires an open protection slot, elevated War Pressure, and the displayed continuity package."
secret_alliance_diplomacy_requirements_tt: "Requires a selected plausible suspect, an open diplomatic slot, sufficient stability, and the displayed political and command resources."
secret_alliance_diplomacy_guarantee_requirements_tt: "Requires the normal diplomatic package and a selected government that is not already guaranteed by us."
secret_alliance_diplomacy_sponsor_requirements_tt: "Requires the normal diplomatic package, a confirmed major suspect, and at least a partial dossier."
secret_alliance_diplomacy_confirmed_requirements_tt: "Requires the normal diplomatic package and a corroborated confirmed suspect."
secret_alliance_allied_consultation_requirements_tt: "Requires faction partners, an open diplomatic slot, sufficient stability, and the displayed political and command resources."
secret_alliance_neutral_inquiry_requirements_tt: "Requires enough Evidence, an open diplomatic slot, sufficient stability, and the displayed political and command resources."
secret_alliance_offensive_requirements_tt: "Requires a Credible selected suspect, an open offensive slot, and the displayed command, experience, equipment, and train package."
secret_alliance_false_plan_requirements_tt: "Requires a preserved turned or compromised channel, a Credible selected suspect, an open offensive slot, and the displayed command, experience, equipment, and train package."
secret_alliance_offensive_shipment_requirements_tt: "Requires the standard offensive package and the listed trucks."
secret_alliance_offensive_network_requirements_tt: "Requires the standard offensive package and a network broad enough for competing commitments to matter."
secret_alliance_offensive_turn_requirements_tt: "Requires the standard offensive package, naming-level Evidence, and a corroborated confirmed suspect."
secret_alliance_offensive_depot_requirements_tt: "Requires the standard offensive package and the listed fuel reserve."
secret_alliance_offensive_conference_requirements_tt: "Requires the standard offensive package and naming-level Evidence."
secret_alliance_offensive_route_requirements_tt: "Requires the standard offensive package plus the displayed fuel and convoy commitment."
secret_alliance_border_action_requirements_tt: "Requires a selected neighboring suspect, an open border slot, a valid crossing between territory controlled by us and the suspect, and the displayed offensive package."
secret_alliance_border_crossing_setup_requirements_tt: "Requires reinforced patrols at the selected crossing and an open border objective slot."
secret_alliance_border_conflict_requirements_tt: "Requires a corroborated confirmed neighbor, divisions in both named border states, railway supply in both states, and the displayed equipment and manpower."
secret_alliance_border_escalation_requirements_tt: "Requires a corroborated confirmed opponent and the displayed War Support. Escalation begins a normal war and reveals the network."
secret_alliance_border_negotiation_requirements_tt: "Requires the normal diplomatic package while the exact border conflict remains active."
secret_alliance_partial_dossier_requirements_tt: "Requires partial-dossier Evidence, sufficient stability, and the displayed political-power commitment."
secret_alliance_name_member_requirements_tt: "Requires naming-level Evidence, a Credible suspect, four independent evidence classes on that suspect, and the displayed political power."
secret_alliance_coalition_case_requirements_tt: "Requires coalition-case Evidence, five independent global evidence classes, a corroborated confirmed participant, no unresolved false accusation, and the displayed political power."
secret_alliance_expose_sponsor_requirements_tt: "Requires a corroborated confirmed major participant and the displayed political power."
secret_alliance_inspection_requirements_tt: "Requires naming-level Evidence, a failed public case, and the displayed political power."
secret_alliance_emergency_requirements_tt: "Requires an open emergency slot and the displayed command, equipment, manpower, fuel, and stability commitment."
secret_alliance_emergency_transport_requirements_tt: "Requires the standard emergency package and the listed trains."
secret_alliance_emergency_overseas_requirements_tt: "Requires the standard emergency package, a coastal state, and the listed convoys."
secret_alliance_final_warning_requirements_tt: "Requires a corroborated confirmed suspect and the normal diplomatic package."
secret_alliance_preemption_requirements_tt: "Requires coalition-case Evidence, full corroboration, a confirmed suspect, the standard emergency package, and at least [?secret_alliance_gate_preemption_war_support|%0] War Support. The displayed War Support strain is spent. Stronger Evidence reduces that strain."
secret_alliance_public_member_selection_requirements_tt: "Select a valid public coalition member that has not withdrawn or fractured from the war."
secret_alliance_war_action_requirements_tt: "Requires the public coalition war and the displayed command, support-equipment, and fuel package."
secret_alliance_war_depot_requirements_tt: "Requires the standard war package and the listed army experience."
secret_alliance_separate_terms_requirements_tt: "Requires a selected active enemy member, an open diplomatic slot, sufficient stability, and the displayed political and command resources."
secret_alliance_public_war_aims_requirements_tt: "Requires sufficient stability and the displayed political-power commitment."
secret_alliance_member_opposition_requirements_tt: "Requires a selected active enemy member and the displayed war package plus trucks."
secret_alliance_sponsor_accountability_requirements_tt: "Requires a selected major coalition member that has capitulated and the normal wartime diplomatic package."
secret_alliance_counteroffensive_requirements_tt: "Requires faction partners, guarded target defenses, and the displayed war package."
secret_alliance_liaison_objective_requirements_tt: "Maintain control of [secret_alliance_liaison_objective_state.GetName] until the liaison route is verified."
secret_alliance_courier_objective_requirements_tt: "Maintain control of [secret_alliance_courier_objective_state.GetName] until the courier route is verified."
secret_alliance_clerk_objective_requirements_tt: "Maintain control of [secret_alliance_clerk_objective_state.GetName] until the recruited clerk is secured."
secret_alliance_envoy_objective_requirements_tt: "Maintain control of [secret_alliance_envoy_objective_state.GetName] until the envoy is extracted."
secret_alliance_safehouse_objective_requirements_tt: "Maintain control of [secret_alliance_safehouse_objective_state.GetName] until the safehouse network is broken."
secret_alliance_manhunt_objective_requirements_tt: "Maintain control of [secret_alliance_manhunt_objective_state.GetName] until the manhunt is completed."
secret_alliance_rumor_objective_requirements_tt: "Maintain control of [secret_alliance_rumor_objective_state.GetName] until the rumor channel is redirected."
secret_alliance_crossing_objective_requirements_tt: "Maintain divisions and railway supply in [?secret_alliance_border_attacker_state.GetName] and [?secret_alliance_border_defender_state.GetName] until the crossing is secured."

# Investigation and mission tooltips
secret_alliance_compare_diplomatic_traffic_tt: "Begins §YWatch the Liaison Route§! at a named state. Full completion adds a corroborated source and known-plans Preparedness. Expiry can produce partial evidence or a source loss."
secret_alliance_audit_foreign_funding_tt: "Begins §YControl the Rumor Channel§! and marks the funding audit as its named requirement."
secret_alliance_inspect_foreign_missions_tt: "Begins §YProtect the Defecting Envoy§! at a named state."
secret_alliance_compare_sabotage_signatures_tt: "Begins §YBreak the Safehouse Network§! and preserves the sabotage comparison as an objective requirement."
secret_alliance_trace_courier_route_tt: "Begins §YSeize the Compromised Courier§! at a named state and consumes the additional train cost."
secret_alliance_question_intermediary_tt: "Begins §YTurn the Recruited Clerk§!. The intermediary must survive the operation."
secret_alliance_inspect_military_access_talks_tt: "Begins a courier objective based on military-access schedules and mapped border routes."
secret_alliance_reconstruct_meeting_circuit_tt: "Begins the liaison objective after combining multiple independent evidence classes."
secret_alliance_watch_liaison_route_success_tt: "Full success records a new independent clue, increases suspect confidence, and adds maintained known-plans Preparedness."
secret_alliance_watch_liaison_route_expiry_tt: "Expiry resolves through the shared confidence model. Partial progress may preserve a clue. Failure raises Alertness and records a source loss."
secret_alliance_seize_compromised_courier_success_tt: "Full success captures courier material, disrupts its route, and records a corroborated communications clue."
secret_alliance_seize_compromised_courier_expiry_tt: "Expiry may preserve partial route evidence. Failure allows the courier network to relocate."
secret_alliance_turn_recruited_clerk_success_tt: "Full success establishes a controlled clerk channel and improves both confidence and known-plan defenses."
secret_alliance_turn_recruited_clerk_expiry_tt: "Expiry may retain incomplete testimony. Failure exposes the approach and raises network Alertness."
secret_alliance_protect_defecting_envoy_success_tt: "Full success extracts the envoy, confirms a human-source class, and preserves the testimony."
secret_alliance_protect_defecting_envoy_expiry_tt: "Expiry may produce a partial statement. Failure forces the envoy to recant."
secret_alliance_break_safehouse_network_success_tt: "Full success captures the cell, adds a method-class source, and disrupts hostile preparations."
secret_alliance_break_safehouse_network_expiry_tt: "Expiry may delay the safehouse network. Failure allows it to disperse."
secret_alliance_national_manhunt_success_tt: "Full success captures the political cell and records financial or human corroboration."
secret_alliance_national_manhunt_expiry_tt: "Expiry may protect officials without breaking the cell. Failure strengthens the hidden pressure campaign."
secret_alliance_control_rumor_channel_success_tt: "Full success turns a media contact and converts the rumor campaign into an evidence source."
secret_alliance_control_rumor_channel_expiry_tt: "Expiry may reduce rumor pressure. Failure costs credibility and increases Alertness."

# Protection tooltips
secret_alliance_compartmentalize_staff_plans_tt: "Starts a timed §YStaff Security§! project. Its Preparedness exists only while the project is maintained."
secret_alliance_rotate_ciphers_and_couriers_tt: "Starts a timed §YStaff Security§! project and fulfills cipher requirements for named investigations."
secret_alliance_secure_industrial_choke_points_tt: "Select an owned and controlled state with factories, dockyards, or infrastructure. Starts a timed §YIndustrial Security§! project there with a temporary output burden and can deny sabotage against that exact surface."
secret_alliance_disperse_critical_stockpiles_tt: "Select an owned and controlled state with infrastructure. Starts a timed §YTransport Security§! project there with a temporary supply burden and can deny sabotage against that exact surface."
secret_alliance_guard_political_cabinet_tt: "Starts a timed §YContinuity§! project and fulfills cabinet requirements for the manhunt."
secret_alliance_harden_border_communications_tt: "Select an owned and controlled state adjoining foreign territory. Starts a timed §YBorder Defense§! project there with a temporary movement burden."
secret_alliance_protect_ports_and_airfields_tt: "Select an owned and controlled coastal state or one with an air base. Starts a timed §YTransport Security§! project for that access point."
secret_alliance_establish_continuity_sites_tt: "Select the controlled capital or an owned and controlled state with factories or dockyards. Starts the longest §YContinuity§! project there and prepares the government to survive a hostile opening."
secret_alliance_close_disproved_lead_tt: "Archives this weak false lead, removes its planted material from the dossier, and withdraws any Evidence class supported only by that source."

# Diplomacy and counteraction tooltips
secret_alliance_quietly_approach_suspect_tt: "Tests the selected country's position. An actual participant may defect. A mistaken approach creates an innocent-government consequence."
secret_alliance_offer_security_guarantee_tt: "Most effective when fear drives an actual participant. Other purposes may only delay its commitment."
secret_alliance_open_grievance_settlement_tt: "Most effective when grievance drives an actual participant and may break its commitment."
secret_alliance_expose_sponsor_pressure_privately_tt: "Requires substantial Evidence. Success weakens confidence among the foreign planners and delays the selected participant's commitment."
secret_alliance_request_allied_consultation_tt: "Adds an Allied Coordination Preparedness component and limited command capacity."
secret_alliance_convene_neutral_inquiry_tt: "Creates a diplomatic-source clue. A complete clean case can force public reveal."
secret_alliance_demand_explanation_tt: "An actual participant may break away, refuse, or defect. A false accusation damages credibility and can aid recruitment against us."
secret_alliance_feed_false_mobilization_plans_tt: "Preserves a false plan through public disclosure. If the foreign planners accept it, their opening coordination is reduced."
secret_alliance_run_controlled_shipment_tt: "The operation may fully succeed, partly succeed, or fail. Any useful result exposes a safehouse route."
secret_alliance_plant_false_faction_dispute_tt: "Success provokes disagreements among the foreign planners. Failure lets them identify our manipulation."
secret_alliance_turn_pact_member_tt: "Turns the selected confirmed participant, preserves a controlled channel, and delays its public commitment."
secret_alliance_sabotage_forward_depot_tt: "Success disrupts hostile preparations and exposes a depot. Failure raises War Pressure."
secret_alliance_disrupt_planning_conference_tt: "Full success captures the conference records and forces public disclosure. Partial success disrupts confidence among the foreign planners."
secret_alliance_conduct_border_reconnaissance_raid_tt: "Identifies a passable crossing along the suspect's frontier, commits reinforced patrols, and opens the contested-crossing mission. No cost is paid if no valid crossing exists."
secret_alliance_seize_courier_aircraft_or_vessel_tt: "Full success captures enemy plans and registers a communications-class source."

# Border and public-action tooltips
secret_alliance_reinforce_border_patrols_tt: "Commits patrol strength to the named crossing and improves the crossing objective."
secret_alliance_intercept_survey_team_tt: "Attempts to capture the survey team before the crossing escalates."
secret_alliance_secure_contested_crossing_action_tt: "Opens the timed objective at the named crossing. The later limited-conflict decision remains separate."
secret_alliance_begin_limited_border_conflict_tt: "Starts the border war between [?secret_alliance_border_attacker_state.GetName] and [?secret_alliance_border_defender_state.GetName]. The wider coordination remains concealed."
secret_alliance_escalate_or_withdraw_border_conflict_tt: "Escalates to normal war. The wider coordination becomes public. Every surviving participant still bound to the pact enters the war against us."
secret_alliance_withdraw_from_border_conflict_tt: "Cancels the border war and lowers War Pressure."
secret_alliance_negotiate_border_standdown_tt: "Cancels the border war, reduces War Pressure, and weakens confidence among the foreign planners."
secret_alliance_secure_contested_crossing_success_tt: "Secures the prepared crossing, disrupts hostile preparations, and improves our knowledge of likely plans."
secret_alliance_secure_contested_crossing_failure_tt: "Loses the staging route and increases both hostile preparation and War Pressure."
secret_alliance_release_partial_dossier_tt: "Publishes verified methods and withholds unconfirmed participant names. Adds a corroborated clue and improves institutional awareness."
secret_alliance_name_first_member_tt: "A true participant is confirmed and named. A false accusation causes stability loss, diplomatic damage, and possible counter-recruitment."
secret_alliance_present_coalition_case_tt: "A complete case with no unresolved false accusation forces public disclosure. Failure strengthens the hostile coordination."
secret_alliance_expose_major_sponsor_tt: "A confirmed major backer is publicly exposed and its partners lose confidence. A mistaken accusation receives the full false-accusation penalty."
secret_alliance_demand_international_inspections_tt: "Success disrupts hostile preparations. Failure introduces planted evidence that harms later investigations."

# Emergency and war tooltips
secret_alliance_emergency_mobilization_tt: "Adds staff-security Preparedness and War Support while reserving emergency-response capacity."
secret_alliance_fortify_exposed_approaches_tt: "Adds a maintained border-defense component against mapped hostile routes."
secret_alliance_recall_overseas_assets_tt: "Adds transport Preparedness and immediate Command Power."
secret_alliance_issue_final_private_warning_tt: "Attempts one last motive-based defection or delayed call from the selected suspect."
secret_alliance_preempt_coalition_tt: "Declares normal war on the selected confirmed participant, reveals the wider coordination, creates its public faction, and resolves immediate calls, delayed commitments, turned channels, and withdrawals."
secret_alliance_seek_defensive_alliance_tt: "Adds Allied Coordination Preparedness and reduces War Pressure."
secret_alliance_evacuate_critical_leadership_tt: "Adds Continuity Preparedness at a stability cost."
secret_alliance_coalition_countdown_early_tt: "Integrated defenses can buy one final delay, reducing foreign preparation and confrontation pressure. Otherwise the hidden coordination becomes public under the consequences of its estimated unity, preparation, accumulated Evidence, internal disputes, and exposed backers."
secret_alliance_coalition_countdown_timeout_tt: "Integrated defenses can buy one final delay. Otherwise the hidden coordination forms a public faction. Estimated unity, preparation, accumulated Evidence, internal disputes, and exposed backers determine whether its opening is controlled, weakened, forced, or fractured."
secret_alliance_public_offensive_countdown_tt: "On timeout, surviving public members coordinate a renewed offensive according to Coalition Resolve."
secret_alliance_exploit_exposed_liaison_map_tt: "Reduces Coalition Resolve by exploiting revealed command channels."
secret_alliance_strike_known_forward_depots_tt: "Reduces public coalition logistics and Resolve through known depot locations."
secret_alliance_offer_separate_terms_tt: "May remove the selected member from the target war according to motive and commitment."
secret_alliance_publicize_conflicting_war_aims_tt: "Records conflicting promises and reduces Coalition Resolve."
secret_alliance_support_member_opposition_tt: "Weakens the selected member's willingness and ability to sustain the coalition war."
secret_alliance_demand_sponsor_accountability_tt: "Creates a sponsor accountability crisis that can determine the final settlement."
secret_alliance_coordinate_allied_counteroffensive_tt: "Converts known weaknesses and maintained defenses into a coordinated counteroffensive."
