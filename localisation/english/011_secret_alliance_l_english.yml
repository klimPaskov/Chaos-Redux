secret_alliance_harden_ports_and_cables_mission_timeout_tt: "Coastal routes stay exposed, and compromised ministries lose another thread."
secret_alliance_secure_capital_command_mission_success_tt: "Capital command remains coherent through the crisis."
secret_alliance_secure_capital_command_mission_timeout_tt: "Capital command stays vulnerable, and hostile pressure rises."
secret_alliance_frontier_watch_mission_success_tt: "Exposed borders are watched before the compact can choose the first incident."
secret_alliance_frontier_watch_mission_timeout_tt: "The frontier remains uncovered, disqualifying prepared-border tracking and forcing the crisis toward daylight."
secret_alliance_prepare_exposed_border_mission_success_tt: "Exposed borders are covered and eligible for prepared-border achievement tracking."
secret_alliance_prepare_exposed_border_mission_timeout_tt: "Uncovered exposed borders force the crisis toward the open."
secret_alliance_final_crisis_mission_success_tt: "A full dossier and strong preparedness may dissolve the compact before war."
secret_alliance_final_crisis_mission_timeout_tt: "The compact reveals itself as the crisis window closes."
secret_alliance_unexplained_friction: "Unexplained Friction"
secret_alliance_unexplained_friction_desc: "Diplomats answer routine questions slowly, newspapers repeat hostile phrases, and border offices feel pressure no one will sign."
secret_alliance_counter_pact_bureau: "Counter-Pact Bureau"
secret_alliance_counter_pact_bureau_desc: "A shared desk links military intelligence, customs, rail security, and diplomacy around the hidden compact file."
secret_alliance_prepared_security_network: "Prepared Security Network"
secret_alliance_prepared_security_network_desc: "Rail offices, command rooms, border desks, and factory guards have learned to pass warnings before the compact can isolate them."
secret_alliance_compromised_ministries: "Compromised Ministries"
secret_alliance_compromised_ministries_desc: "Failed security work leaves ministries chasing missing files, nervous clerks, and liaison channels the compact already knows how to touch."
secret_alliance_hidden_compact_discipline: "Hidden Compact Discipline"
secret_alliance_hidden_compact_discipline_desc: "Private commitments, courier discipline, and common planning hold the compact together while it remains deniable."
secret_alliance_exposed_pact_government: "Exposed Pact Government"
secret_alliance_exposed_pact_government_desc: "Evidence ties this government to the compact. Its denials cost more, its partners hesitate, and its room for quiet pressure narrows."
secret_alliance_patron_shield: "Patron Shield"
secret_alliance_patron_shield_desc: "A larger backer gives the compact confidence, credit, and a sense that risk can be shared."
secret_alliance_revealed_compact: "Revealed Compact"
secret_alliance_revealed_compact_desc: "The compact has stepped into daylight and turned private pressure into organized confrontation."
secret_alliance_public_war_command: "Public War Command"
secret_alliance_public_war_command_desc: "The counter-pact desk has become a war command, carrying evidence, plans, and emergency authority into the open conflict."
chaosx.events_log.window.event_details.secret_alliance: "Secret Alliance creates a hidden anti-target compact that begins without a public faction. The target sees pressure through reports, evidence, and suspicious operations rather than member lists.\n\nAs the file grows, the target can answer with counterintelligence, preparedness, border vigilance, and diplomacy while deciding how much of the pattern can safely be named.\n\nIf a valid compact member enters war with the target before the matter is resolved, the compact reveals itself immediately and valid core members join the war."
chaosx.events_log.evolution.type.secret_alliance: "Secret Alliance"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_1: "More Signatures"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_2: "Outside Guarantee"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_3: "Open Crisis"
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_1: "The hidden compact grows beyond its opening circle. The target sees more courier overlap, more repeated border behavior, and a broader set of deniable pressures."
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_2: "The compact gains stronger backing. The target can build a formal counter-pact desk, gather evidence, improve preparedness, and pressure exposed links without naming what remains unproven."
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_3: "The compact begins testing public confrontation. Border pressure, public language, diplomacy, and crisis timing determine whether the matter collapses on paper or becomes open war."
chaosx.events_log.window.evolution_details.secret_alliance.body.event_detail: "Secret Alliance evolves from hidden coordination into wider pressure, stronger backing, and a public crisis if the target cannot dissolve or expose the compact first."
sa_every_thread_named_NAME: "Every Thread Named"
sa_every_thread_named_DESC: "Expose every active compact member before the compact reveals itself."
sa_every_thread_named_tooltip: "Expose every active compact member before public reveal or war-trigger reveal."
sa_paper_collapse_NAME: "Paper Collapse"
sa_paper_collapse_DESC: "Dissolve the compact through diplomacy before faction war begins."
sa_paper_collapse_tooltip: "Dissolve the compact through diplomacy before the revealed compact becomes a faction war."
sa_turn_the_knife_NAME: "Turn the Knife"
sa_turn_the_knife_DESC: "Secure a defector and use their evidence to expose another compact link."
sa_turn_the_knife_tooltip: "Convince a compact participant or associate to defect, then use their evidence to expose another compact link."
sa_prepared_for_every_border_NAME: "Prepared for Every Border"
sa_prepared_for_every_border_DESC: "Enter the public crisis with strong preparedness and exposed borders covered."
sa_prepared_for_every_border_tooltip: "Prepare exposed compact-facing borders and keep preparedness high when the public crisis arrives."
sa_small_country_large_shadow_NAME: "Small Country, Large Shadow"
sa_small_country_large_shadow_DESC: "As a minor target, defeat or force the surrender of a revealed compact with major backing."
sa_small_country_large_shadow_tooltip: "As a minor target, defeat or force the surrender of a revealed compact that includes major backing, without joining a major faction first."
sa_ten_signatures_NAME: "Ten Signatures"
sa_ten_signatures_DESC: "Finish a compact that reached ten active or exposed signatures."
sa_ten_signatures_tooltip: "Defeat, dissolve, or split a compact after it reaches at least ten active or exposed signatures."
sa_bad_evidence_backfire_NAME: "Bad Evidence Backfire"
sa_bad_evidence_backfire_DESC: "Recover from a failed accusation and later expose the true compact."
sa_bad_evidence_backfire_tooltip: "Recover from a failed public accusation, later expose the true compact, and avoid capitulation before the crisis ends."
sa_no_factory_lost_NAME: "Unbroken Workshops"
sa_no_factory_lost_DESC: "Complete the chain after the counter-pact desk opens without major factory sabotage succeeding."
sa_no_factory_lost_tooltip: "After the counter-pact desk opens, complete the chain without successful major industrial sabotage."
