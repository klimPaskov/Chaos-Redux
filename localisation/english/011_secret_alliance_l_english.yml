# Event 011 - Secret Alliance
chaosx.nr11.1.t: "Secret Alliance"
chaosx.nr11.1.d: "A courier packet reaches the capital without a seal, a return address, or a single official signature. Inside are copied timetables, coded bank drafts, and three names that should not be speaking to one another. None of them are at war with us. All of them have begun moving around us as if a war already has a date."
chaosx.nr11.1.a: "Trace every courier."
chaosx.nr11.1.b: "Guard the rails and depots."
chaosx.nr11.1.c: "Let them wonder what we know."
chaosx.nr11.11.t: "The Couriers Agree"
chaosx.nr11.11.d: "The separate trails begin to share habits: the same cipher groups, the same hotel registers, the same unsigned invoices. Minor offices deny coordination with practiced timing. The pact is still deniable, but it is no longer quiet."
chaosx.nr11.11.a: "Keep the file open."
chaosx.nr11.21.t: "A Patron's Shadow"
chaosx.nr11.21.d: "The dossier widens beyond the first three signatories. Military attaches travel under commercial cover, loan desks approve impossible credit, and a larger power begins listening at the edge of the room. Countermeasures can be taken in public now, if we can pay the cost."
chaosx.nr11.21.a: "Open the counter-network."
chaosx.nr11.31.t: "The Protocol Is Public"
chaosx.nr11.31.d: "The secret protocol has reached daylight. The signatories answer the exposure by standing together, not by denying the paper. Their pact has a calendar, a leader, and a public name built around one purpose: pressure on us."
chaosx.nr11.31.a: "Then we answer it in daylight."
chaosx.nr11.40.t: "The Pact Steps Forward"
chaosx.nr11.40.d: "Foreign ministries that once misplaced every query now publish carefully matched statements. The pact claims it exists only to prevent our aggression. Its signatories have already compared mobilisation tables."
chaosx.nr11.40.a: "Every name goes into the file."
chaosx.nr11.50.t: "The Secret Ends in War"
chaosx.nr11.50.d: "The first signatory has crossed the line. By evening the hidden pact is no longer an inference but an order of battle, with every live member pulled toward the same front. What was arranged in quiet rooms is now printed on maps."
chaosx.nr11.50.a: "So be it."
chaosx.nr11.90.t: "Secret Alliance Pulse"

