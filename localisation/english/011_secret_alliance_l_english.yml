# Visible decision and mission requirements
secret_alliance_investigation_requirements_tt: "Requires an open investigation slot and the displayed Command Power, support equipment, and Stability costs."
secret_alliance_investigation_envoy_requirements_tt: "Requires an open investigation slot, the displayed costs, and one of your coastal states for the extraction."
secret_alliance_investigation_transport_requirements_tt: "Requires an open investigation slot and the displayed costs. The operation also costs £stability_texticon [?secret_alliance_cost_investigation_stability|%1]."
secret_alliance_investigation_circuit_requirements_tt: "Requires an open investigation slot, Evidence of at least [?constant:secret_alliance_band.evidence_partial_dossier|0], a mature incident pattern, and the displayed costs."
secret_alliance_protection_requirements_tt: "Requires an open protection slot and the displayed Command Power, army experience, and support equipment costs."
secret_alliance_protection_transport_requirements_tt: "Requires an open protection slot and the displayed costs. Cipher rotation and border hardening also cost £GFX_train_texticon [?secret_alliance_cost_trains|0], and stockpile dispersal costs £GFX_motorized_equipment_text_icon [?secret_alliance_cost_trucks|0]."
secret_alliance_protection_manpower_requirements_tt: "Requires an open protection slot and the displayed costs. The cabinet guard also costs £manpower_texticon [?secret_alliance_cost_manpower|0]."
secret_alliance_protection_overseas_requirements_tt: "Requires an open protection slot, a coastal or air base state to protect, and the displayed costs. The project also costs £GFX_fuel_texticon [?secret_alliance_cost_fuel|0]."
secret_alliance_protection_continuity_requirements_tt: "Requires an open protection slot, the displayed costs, and £GFX_train_texticon [?secret_alliance_cost_trains|0]. Becomes available once War Pressure reaches [?constant:secret_alliance_band.war_pressure_warning|0]."
secret_alliance_diplomacy_stability_floor_requirement: "Stability of at least [?constant:secret_alliance_decision_gate.diplomacy_stability|%0]"
secret_alliance_diplomacy_requirements_tt: "Requires a selected suspect with at least Plausible confidence and an open diplomatic slot. $secret_alliance_diplomacy_stability_floor_requirement$ and the displayed costs must be met."
secret_alliance_diplomacy_guarantee_requirements_tt: "Requires a selected government that is not already guaranteed by us. $secret_alliance_diplomacy_stability_floor_requirement$ and the displayed costs must be met."
secret_alliance_diplomacy_sponsor_requirements_tt: "Requires a confirmed major power as the selected suspect and Evidence of at least [?constant:secret_alliance_band.evidence_partial_dossier|0]. $secret_alliance_diplomacy_stability_floor_requirement$ and the displayed costs must be met."
secret_alliance_diplomacy_confirmed_requirements_tt: "Requires a corroborated confirmed suspect. $secret_alliance_diplomacy_stability_floor_requirement$ and the displayed costs must be met."
secret_alliance_allied_consultation_requirements_tt: "Requires faction partners and an open diplomatic slot. $secret_alliance_diplomacy_stability_floor_requirement$ and the displayed costs must be met."
secret_alliance_neutral_inquiry_requirements_tt: "Requires Evidence of at least [?constant:secret_alliance_band.evidence_name_member|0] and an open diplomatic slot. $secret_alliance_diplomacy_stability_floor_requirement$ and the displayed costs must be met."
secret_alliance_offensive_requirements_tt: "Requires a Credible selected suspect, an open offensive slot, and the displayed Command Power, army experience, and support equipment costs plus £GFX_train_texticon [?secret_alliance_cost_trains|0]."
secret_alliance_false_plan_requirements_tt: "Requires a preserved turned or compromised channel, a Credible selected suspect, an open offensive slot, and the displayed costs plus £GFX_train_texticon [?secret_alliance_cost_trains|0]."
secret_alliance_offensive_shipment_requirements_tt: "Requires an open offensive slot, a Credible suspect, and the displayed costs plus £GFX_motorized_equipment_text_icon [?secret_alliance_cost_trucks|0]."
secret_alliance_offensive_network_requirements_tt: "Requires an open offensive slot, a Credible suspect, a network broad enough for competing commitments to matter, and the displayed costs plus £GFX_train_texticon [?secret_alliance_cost_trains|0]."
secret_alliance_offensive_turn_requirements_tt: "Requires an open offensive slot, a corroborated confirmed suspect, Evidence of at least [?constant:secret_alliance_band.evidence_name_member|0], and the displayed costs plus £GFX_train_texticon [?secret_alliance_cost_trains|0]."
secret_alliance_offensive_depot_requirements_tt: "Requires an open offensive slot, a Credible suspect, and the displayed costs plus £GFX_fuel_texticon [?secret_alliance_cost_fuel|0]."
secret_alliance_offensive_conference_requirements_tt: "Requires an open offensive slot, Evidence of at least [?constant:secret_alliance_band.evidence_name_member|0], and the displayed costs plus £GFX_train_texticon [?secret_alliance_cost_trains|0]."
secret_alliance_offensive_route_requirements_tt: "Requires an open offensive slot, a Credible suspect, and the displayed costs plus £GFX_fuel_texticon [?secret_alliance_cost_fuel|0]."
secret_alliance_border_action_requirements_tt: "Requires a selected neighboring suspect, an open border slot, a crossing between territory controlled by us and by the suspect, and the displayed costs plus £GFX_train_texticon [?secret_alliance_cost_trains|0]."
secret_alliance_border_intercept_requirements_tt: "Requires mapped border routes, a Credible neighboring suspect, an open border slot, a valid crossing, and the displayed costs plus £GFX_train_texticon [?secret_alliance_cost_trains|0]."
secret_alliance_border_crossing_setup_requirements_tt: "Requires reinforced patrols at the selected crossing, an open border slot, and the displayed costs plus £GFX_train_texticon [?secret_alliance_cost_trains|0]."
secret_alliance_border_conflict_requirements_tt: "Requires a corroborated confirmed neighbor, divisions on both sides of the named border, railways in both border states, and the displayed costs plus £manpower_texticon [?secret_alliance_cost_manpower|0]."
secret_alliance_border_escalation_requirements_tt: "Requires a corroborated confirmed opponent and the displayed War Support. Escalation begins a normal war and reveals the network."
secret_alliance_border_negotiation_requirements_tt: "Requires an active border conflict, a selected suspect with at least Plausible confidence, and an open diplomatic slot. $secret_alliance_diplomacy_stability_floor_requirement$ and the displayed costs must be met."
secret_alliance_partial_dossier_requirements_tt: "Requires Evidence of at least [?constant:secret_alliance_band.evidence_partial_dossier|0]. $secret_alliance_diplomacy_stability_floor_requirement$ and the displayed Political Power and Stability costs must be met."
secret_alliance_name_member_requirements_tt: "Requires Evidence of at least [?constant:secret_alliance_band.evidence_name_member|0], a Credible suspect backed by four independent kinds of evidence, and the displayed Political Power."
secret_alliance_coalition_case_requirements_tt: "Requires Evidence of at least [?constant:secret_alliance_band.evidence_coalition_case|0], five independent kinds of evidence overall, a corroborated confirmed participant, no unresolved false accusation, and the displayed Political Power."
secret_alliance_expose_sponsor_requirements_tt: "Requires a corroborated confirmed major participant and the displayed political power."
secret_alliance_inspection_requirements_tt: "Requires Evidence of at least [?constant:secret_alliance_band.evidence_name_member|0], a failed public case, and the displayed Political Power."
secret_alliance_emergency_requirements_tt: "Requires an open emergency slot and the displayed costs. The decision also costs £stability_texticon [?secret_alliance_cost_emergency_stability|%0]."
secret_alliance_emergency_transport_requirements_tt: "Requires an open emergency slot and the displayed costs. The decision also costs £GFX_train_texticon [?secret_alliance_cost_trains|0]."
secret_alliance_emergency_overseas_requirements_tt: "Requires an open emergency slot, a coastal state, and the displayed costs. The decision also costs £convoy_texticon [?secret_alliance_cost_convoys|0]."
secret_alliance_final_warning_requirements_tt: "Requires a corroborated confirmed suspect and an open diplomatic slot. $secret_alliance_diplomacy_stability_floor_requirement$ and the displayed costs must be met."
secret_alliance_preemption_requirements_tt: "Requires Evidence of at least [?constant:secret_alliance_band.evidence_coalition_case|0], full corroboration, a confirmed suspect, and at least [?secret_alliance_gate_preemption_war_support|%0] War Support. The decision also spends £GFX_war_support_icon [?secret_alliance_cost_preemption_war_support|%0] War Support, and stronger Evidence lowers that amount."
secret_alliance_public_member_selection_requirements_tt: "Select a valid public coalition member that has not withdrawn or fractured from the war."
secret_alliance_war_action_requirements_tt: "Requires the public coalition war and the displayed command, support-equipment, and fuel package."
secret_alliance_war_depot_requirements_tt: "Requires the public coalition war, the displayed costs, and £army_experience [?secret_alliance_cost_army_experience|0]."
secret_alliance_separate_terms_requirements_tt: "Requires a selected active enemy member and an open diplomatic slot. $secret_alliance_diplomacy_stability_floor_requirement$ and the displayed costs must be met."
secret_alliance_public_war_aims_requirements_tt: "Requires $secret_alliance_diplomacy_stability_floor_requirement$ and the displayed Political Power and Stability costs."
secret_alliance_member_opposition_requirements_tt: "Requires a selected active enemy member and the displayed war costs plus £GFX_motorized_equipment_text_icon [?secret_alliance_cost_trucks|0]."
secret_alliance_sponsor_accountability_requirements_tt: "Requires a selected major coalition member that has capitulated and an open diplomatic slot. $secret_alliance_diplomacy_stability_floor_requirement$ and the displayed costs must be met."
secret_alliance_counteroffensive_requirements_tt: "Requires faction partners, guarded target defenses, and the displayed costs."
secret_alliance_liaison_objective_requirements_tt: "Hold [secret_alliance_liaison_objective_state.GetName] with rotated ciphers in force and no source lost until the liaison route is verified."
secret_alliance_courier_objective_requirements_tt: "Hold [secret_alliance_courier_objective_state.GetName] with a division stationed there and the border routes mapped until the courier route is verified."
secret_alliance_clerk_objective_requirements_tt: "Hold [secret_alliance_clerk_objective_state.GetName] with the intermediary questioned, ciphers rotated, no source lost, and the network not on alert until the recruited clerk is secured."
secret_alliance_envoy_objective_requirements_tt: "Hold [secret_alliance_envoy_objective_state.GetName] with a division stationed there, allied consultation active, and Stability of at least [?constant:secret_alliance_decision_gate.rumor_stability|%0] until the envoy is extracted."
secret_alliance_safehouse_objective_requirements_tt: "Hold [secret_alliance_safehouse_objective_state.GetName] with a division stationed there, a known safehouse route, and the industrial security project running until the safehouse network is broken."
secret_alliance_manhunt_objective_requirements_tt: "Hold [secret_alliance_manhunt_objective_state.GetName] with two or more divisions, a guarded cabinet, at least [?constant:secret_alliance_decision_gate.serious_incident_command_power|0] Command Power, and Stability of at least [?constant:secret_alliance_decision_gate.manhunt_stability|%0] until the manhunt is completed."
secret_alliance_rumor_objective_requirements_tt: "Hold [secret_alliance_rumor_objective_state.GetName] with a turned media contact or active funding audit, Stability of at least [?constant:secret_alliance_decision_gate.rumor_stability|%0], and no failed public case until the rumor channel is redirected."
secret_alliance_crossing_objective_requirements_tt: "Maintain divisions and railway supply in [?secret_alliance_border_attacker_state.GetName] and [?secret_alliance_border_defender_state.GetName], with Preparedness of at least [?constant:secret_alliance_band.preparedness_guarded|0], until the crossing is secured."

# Investigation and mission tooltips
secret_alliance_compare_diplomatic_traffic_tt: "Begins the §YWatch the Liaison Route§! mission at a named state. Completing it adds a corroborated source and Known Plans Preparedness. If time runs out, it can yield partial evidence or lose the source."
secret_alliance_audit_foreign_funding_tt: "Begins the §YControl the Rumor Channel§! mission, with the funding audit as one of its requirements."
secret_alliance_inspect_foreign_missions_tt: "Begins the §YProtect the Defecting Envoy§! mission at a named state."
secret_alliance_compare_sabotage_signatures_tt: "Begins the §YBreak the Safehouse Network§! mission. It needs a known safehouse route and an active industrial security project."
secret_alliance_trace_courier_route_tt: "Begins the §YSeize the Compromised Courier§! mission at a named state. It needs the border routes to be mapped."
secret_alliance_question_intermediary_tt: "Begins the §YTurn the Recruited Clerk§! mission. It needs the cipher rotation to be in force."
secret_alliance_inspect_military_access_talks_tt: "Begins the §YSeize the Compromised Courier§! mission, built on military-access schedules and mapped border routes."
secret_alliance_reconstruct_meeting_circuit_tt: "Compares independent evidence to reconstruct the meeting circuit. A full success identifies a participant, a partial success points to a suspect, and a failure alerts the network."
secret_alliance_watch_liaison_route_success_tt: "Success uncovers an independent clue, strengthens the case against the suspect, and improves defenses against known enemy plans."
secret_alliance_watch_liaison_route_expiry_tt: "When time runs out, partial progress may preserve a clue. Failure loses the source and makes the network more alert."
secret_alliance_seize_compromised_courier_success_tt: "Success captures material carried by the courier, disrupts the route, and corroborates intercepted communications."
secret_alliance_seize_compromised_courier_expiry_tt: "Expiry may preserve partial route evidence. Failure allows the courier network to relocate."
secret_alliance_turn_recruited_clerk_success_tt: "Success recruits the clerk to pass controlled messages, strengthens the case against the suspect, and improves defenses against known enemy plans."
secret_alliance_turn_recruited_clerk_expiry_tt: "Expiry may retain incomplete testimony. Failure exposes the approach and raises network Alertness."
secret_alliance_protect_defecting_envoy_success_tt: "Success brings the envoy to safety and preserves independent witness testimony."
secret_alliance_protect_defecting_envoy_expiry_tt: "Expiry may produce a partial statement. Failure forces the envoy to recant."
secret_alliance_break_safehouse_network_success_tt: "Success captures the cell, corroborates its methods, and disrupts hostile preparations."
secret_alliance_break_safehouse_network_expiry_tt: "Expiry may delay the safehouse network. Failure allows it to disperse."
secret_alliance_national_manhunt_success_tt: "Success captures the political cell and corroborates the financial evidence."
secret_alliance_national_manhunt_expiry_tt: "Expiry may protect officials without breaking the cell. Failure strengthens the hidden pressure campaign."
secret_alliance_control_rumor_channel_success_tt: "Full success turns a media contact and converts the rumor campaign into an evidence source."
secret_alliance_control_rumor_channel_expiry_tt: "Expiry may reduce rumor pressure. Failure costs credibility and increases Alertness."

# Protection tooltips
secret_alliance_compartmentalize_staff_plans_tt: "Starts a [?constant:secret_alliance_preparedness.project_days|0]-day §YStaff Security§! project that adds Preparedness and slows planning."
secret_alliance_rotate_ciphers_and_couriers_tt: "Starts a [?constant:secret_alliance_preparedness.known_plans_days|0]-day §YStaff Security§! project that adds Preparedness, slows planning, and satisfies the cipher requirement of named investigations."
secret_alliance_secure_industrial_choke_points_tt: "Choose one of your states with factories, dockyards, or infrastructure. Starts a [?constant:secret_alliance_preparedness.project_days|0]-day §YIndustrial Security§! project there. Factory output falls while it lasts, and sabotage against the chosen state can be denied."
secret_alliance_disperse_critical_stockpiles_tt: "Choose one of your states with infrastructure. Starts a [?constant:secret_alliance_preparedness.project_days|0]-day §YTransport Security§! project there. Supply consumption rises while it lasts, and sabotage against the chosen state can be denied."
secret_alliance_guard_political_cabinet_tt: "Starts a [?constant:secret_alliance_preparedness.project_days|0]-day §YContinuity§! project, lowers Political Power gain, and satisfies the cabinet requirement of the National Manhunt."
secret_alliance_harden_border_communications_tt: "Choose one of your states bordering foreign territory. Starts a [?constant:secret_alliance_preparedness.project_days|0]-day §YBorder Defense§! project there. Army movement slows while it lasts."
secret_alliance_protect_ports_and_airfields_tt: "Choose one of your coastal states or a state with an air base. Starts a [?constant:secret_alliance_preparedness.project_days|0]-day §YTransport Security§! project for that access point. Supply consumption rises while it lasts."
secret_alliance_establish_continuity_sites_tt: "Choose your capital or a state with factories or dockyards. Starts the longest §YContinuity§! project, [?constant:secret_alliance_preparedness.continuity_days|0] days, and prepares the government to survive a hostile opening."
secret_alliance_close_disproved_lead_tt: "Archives this weak lead, removes its planted material from the dossier, withdraws any Evidence class supported only by that source, and recovers a little Stability."

# Diplomacy and counteraction tooltips
secret_alliance_quietly_approach_suspect_tt: "Tests the selected government's position. A participant may defect. An innocent government resents the approach."
secret_alliance_offer_security_guarantee_tt: "Most effective when fear drives an actual participant. Other purposes may only delay its commitment."
secret_alliance_open_grievance_settlement_tt: "Most effective when grievance drives an actual participant and may break its commitment."
secret_alliance_expose_sponsor_pressure_privately_tt: "Requires substantial Evidence. Success weakens confidence among the foreign planners and delays the selected participant's commitment."
secret_alliance_request_allied_consultation_tt: "Adds Allied Coordination Preparedness for [?constant:secret_alliance_mission.diplomacy_commitment_days|0] days and [?constant:secret_alliance_action_value.allied_consultation_command_power|0] Command Power."
secret_alliance_convene_neutral_inquiry_tt: "Produces a diplomatic clue. If the Evidence is overwhelming, the inquiry forces the pact into public view."
secret_alliance_demand_explanation_tt: "An actual participant may break away, refuse, or defect. A false accusation damages credibility and can aid recruitment against us."
secret_alliance_feed_false_mobilization_plans_tt: "Passes a false plan through the preserved channel and keeps it hidden through public disclosure. If the foreign planners accept it, their opening coordination is reduced."
secret_alliance_run_controlled_shipment_tt: "The operation may fully succeed, partly succeed, or fail. Any useful result exposes a safehouse route."
secret_alliance_plant_false_faction_dispute_tt: "Success provokes disagreements among the foreign planners. A partial result lets them close ranks, and failure lets them identify our manipulation."
secret_alliance_turn_pact_member_tt: "Turns the selected confirmed participant, preserves a controlled channel, and delays its public commitment."
secret_alliance_sabotage_forward_depot_tt: "Full success disrupts hostile preparations and exposes a depot. A partial result raises War Pressure, and failure alerts the network."
secret_alliance_disrupt_planning_conference_tt: "Full success captures the conference papers and forces public disclosure. Partial success sows distrust among the foreign planners, and failure raises War Pressure."
secret_alliance_conduct_border_reconnaissance_raid_tt: "Identifies a passable crossing along the suspect's frontier, commits reinforced patrols, and opens the contested-crossing mission. No cost is paid if no valid crossing exists."
secret_alliance_seize_courier_aircraft_or_vessel_tt: "Full success captures enemy plans and adds a source based on intercepted communications."

# Border and public-action tooltips
secret_alliance_reinforce_border_patrols_tt: "Commits patrols to the named crossing and adds border Preparedness for [?constant:secret_alliance_mission.offensive_commitment_days|0] days."
secret_alliance_intercept_survey_team_tt: "Attempts to capture the survey team before the crossing escalates."
secret_alliance_secure_contested_crossing_action_tt: "Opens the timed §YSecure the Contested Crossing§! mission at the named crossing."
secret_alliance_begin_limited_border_conflict_tt: "Starts the border war between [?secret_alliance_border_attacker_state.GetName] and [?secret_alliance_border_defender_state.GetName] and raises War Pressure. The wider coordination remains concealed."
secret_alliance_escalate_or_withdraw_border_conflict_tt: "Escalates to normal war. The wider coordination becomes public. Every surviving participant still bound to the pact enters the war against us."
secret_alliance_withdraw_from_border_conflict_tt: "Cancels the border war and lowers War Pressure."
secret_alliance_negotiate_border_standdown_tt: "Cancels the border war, reduces War Pressure, and weakens confidence among the foreign planners."
secret_alliance_secure_contested_crossing_success_tt: "Secures the prepared crossing, disrupts hostile preparations, and improves our knowledge of likely plans."
secret_alliance_secure_contested_crossing_failure_tt: "Loses the staging route and increases both hostile preparation and War Pressure."
secret_alliance_release_partial_dossier_tt: "Publishes verified methods and withholds unconfirmed participant names. Adds a corroborated clue and some Known Plans Preparedness, and puts the network on alert."
secret_alliance_name_first_member_tt: "A true participant is confirmed and named, and War Pressure rises. A false accusation costs Stability and credibility, damages relations with the accused government, and may drive it toward our opponents."
secret_alliance_present_coalition_case_tt: "A complete case with no unresolved false accusation forces public disclosure. Failure costs Stability and strengthens the hostile coordination."
secret_alliance_expose_major_sponsor_tt: "A confirmed major backer is publicly exposed and its partners lose confidence. A mistaken accusation brings the penalties of a false accusation."
secret_alliance_demand_international_inspections_tt: "Success disrupts hostile preparations. Failure introduces planted evidence that harms later investigations."

# Emergency and war tooltips
secret_alliance_emergency_mobilization_tt: "Adds staff-security Preparedness and War Support. Occupies the emergency slot for [?constant:secret_alliance_mission.emergency_commitment_days|0] days."
secret_alliance_fortify_exposed_approaches_tt: "Adds border Preparedness against mapped hostile routes. Occupies the emergency slot for [?constant:secret_alliance_mission.emergency_commitment_days|0] days."
secret_alliance_recall_overseas_assets_tt: "Adds transport Preparedness and immediate Command Power. Occupies the emergency slot for [?constant:secret_alliance_mission.emergency_commitment_days|0] days."
secret_alliance_issue_final_private_warning_tt: "Attempts one last motive-based defection or delayed call from the selected suspect."
secret_alliance_preempt_coalition_tt: "Declares war on the selected confirmed participant and reveals the pact as a public faction. Firm partners join the war. Compromised or doubtful partners may delay, withdraw, or break away. A mistaken accusation also costs Stability."
secret_alliance_seek_defensive_alliance_tt: "Adds Allied Coordination Preparedness and reduces War Pressure. Occupies the emergency slot for [?constant:secret_alliance_mission.emergency_commitment_days|0] days."
secret_alliance_evacuate_critical_leadership_tt: "Moves the government to protected command sites, costs some Stability, and adds Continuity Preparedness. Occupies the emergency slot for [?constant:secret_alliance_mission.emergency_commitment_days|0] days."
secret_alliance_coalition_countdown_early_tt: "Strong defenses can buy one final delay and reduce the foreign preparations and War Pressure. Otherwise the pact steps into the open, and how it does so depends on its unity, its preparation, the Evidence gathered, its internal disputes, and any exposed backers."
secret_alliance_coalition_countdown_timeout_tt: "Strong defenses can buy one final delay. Otherwise the pact forms a public faction, and its unity, preparation, the Evidence gathered, its internal disputes, and any exposed backers decide whether its opening is controlled, weakened, forced, or fractured."
secret_alliance_public_offensive_countdown_tt: "On timeout, surviving public members coordinate a renewed offensive according to Coalition Resolve."
secret_alliance_exploit_exposed_liaison_map_tt: "Reduces Coalition Resolve by exploiting revealed command channels."
secret_alliance_strike_known_forward_depots_tt: "Reduces Coalition Resolve and coordination when a depot has been exposed or a false plan accepted. Otherwise the strike costs some War Support."
secret_alliance_offer_separate_terms_tt: "May remove the selected member from the target war according to motive and commitment."
secret_alliance_publicize_conflicting_war_aims_tt: "Exposes conflicting promises and reduces Coalition Resolve. The release backfires when the coalition's promises do not conflict."
secret_alliance_support_member_opposition_tt: "Weakens the selected member's willingness and ability to sustain the coalition war."
secret_alliance_demand_sponsor_accountability_tt: "Creates a sponsor accountability crisis that can determine the final settlement."
secret_alliance_coordinate_allied_counteroffensive_tt: "Reduces Coalition Resolve and restores some Command Power and War Support by turning known weaknesses and maintained defenses into a joint counteroffensive."
