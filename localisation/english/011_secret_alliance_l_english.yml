chaosx.events_log.window.evolution_details.secret_alliance.title.event_detail: "Secret Alliance"
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_1: "The first signatories move as a coordinated minor bloc. Couriers, payment houses, and border offices begin sharing a hidden calendar."
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_2: "The pact opens to more members and can attract one major patron. Counterplay becomes public enough for the target to decode, pressure, and split the network."
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_3: "The protocol is public. A formal Anti-Target Pact can form, and a war by any live member reveals the whole arrangement."
chaosx.events_log.window.evolution_details.secret_alliance.body.event_detail: "A secret pact forms around the target through couriers, payment houses, liaison offices, and military timetables. The target can trace the network, guard vulnerable routes, pressure wavering signatories, and decide whether the pact collapses in private or answers in public."
chaosx.events_log.window.event_details.secret_alliance: "A hidden pact begins building around the target. Investigation, rail protection, backchannels, false leaks, public exposure, and wartime countermeasures decide whether the network fractures or becomes an Anti-Target Pact."

