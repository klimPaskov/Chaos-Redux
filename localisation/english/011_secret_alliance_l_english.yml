l_english:

# Event reports
chaosx.nr11.3.t: "The Same Mistake Three Times"
chaosx.nr11.3.d: "A port clerk stopped a shipment moved on an order nobody remembers signing. By noon, two ministries had found altered schedules in the same unfamiliar hand. Someone has learned which papers make our officials move and is trying the lesson again."
chaosx.nr11.3.a: "Keep the reports together and the names off the page."
chaosx.nr11.3.b: "Put officers from each ministry in the same room."
chaosx.nr11.4.t: "They Push Too Far"
chaosx.nr11.4.d: "Money from a harmless-looking charity paid for today's marches. The crowd knew a cabinet schedule changed that morning, and its leaflets answered a speech that had yet to be delivered. Separate troublemakers are following the same instructions."
chaosx.nr11.4.a: "Follow the money back to its handlers."
chaosx.nr11.4.b: "Give the security services the men they need."
chaosx.nr11.5.t: "Footprints Above the Road"
chaosx.nr11.5.d: "A patrol found fresh stakes driven into the ground above a frontier road. Pencil marks on a stolen map give the width of every bridge and the turning room at every bend. The men who made them had already gone, but their boot prints lead toward the border."
chaosx.nr11.5.a: "Move the checkpoints and guard the pass."
chaosx.nr11.5.b: "Show the maps to the country."
chaosx.nr11.6.t: "The Missing Courier"
chaosx.nr11.6.d: "A diplomatic courier missed the evening train and never reached the next station. His pouch turned up beneath a luggage cart with the sealing wax warmed and the cipher sheets missing. Whoever took him knew the route well enough to choose the one platform the guards could not see."
chaosx.nr11.6.a: "Shut the route and follow whoever comes looking."
chaosx.nr11.6.b: "Replace the papers and keep the trains running."
chaosx.nr11.7.t: "Machines Fail Together"
chaosx.nr11.7.d: "Mechanics at factories hundreds of miles apart have found the same filed notch in their engine governors. The spare parts meant to fix them were waiting at the wrong depots. Whoever planned this understands both the machines and the freight network carrying their replacements."
chaosx.nr11.7.a: "Lock the spare stores and inspect every governor."
chaosx.nr11.7.b: "Make the repairs and keep production moving."
chaosx.nr11.8.t: "Lines Measured in Silence"
chaosx.nr11.8.d: "A shepherd found rolled sketches hidden in a drainage pipe near the frontier. The pages ignore villages and farms, marking only the bridges, rail sidings, and road widths an army column would need. Someone has already walked the routes our troops would use."
chaosx.nr11.8.a: "Move our routes and give the watchers bad distances."
chaosx.nr11.8.b: "Put troops on the roads they marked."
chaosx.nr11.9.t: "The Same Rumor, Everywhere"
chaosx.nr11.9.d: "Three towns woke to the same story about the government, printed under three different bylines. Editors say the copy arrived from unrelated messengers, yet each version repeats the same peculiar error. The lie is moving along a route of its own."
chaosx.nr11.9.a: "Answer it today with names and evidence."
chaosx.nr11.9.b: "Find who paid the printers and radio men."
chaosx.nr11.10.t: "A Week of Scandal"
chaosx.nr11.10.d: "Forged cabinet minutes reached the newspapers as demonstrators gathered outside the homes of two ministers. Every fresh allegation pulls the government into another denial and another angry crowd. The people arranging this want the cabinet chasing smoke all week."
chaosx.nr11.10.a: "Guard the ministers and take the handlers alive."
chaosx.nr11.10.b: "Keep governing and refuse to chase every provocation."
chaosx.nr11.11.t: "Someone Warned the Room"
chaosx.nr11.11.d: "Police broke into a rented room near the government quarter and found a radio still warm on the desk. The cupboards had been cleared. A neighbor saw the tenant leave ten minutes after a sealed search order left our office."
chaosx.nr11.11.a: "Close the exits and search block by block."
chaosx.nr11.11.b: "Leave the door alone and watch who checks it."
chaosx.nr11.12.t: "A Quarrel We Can Use"
chaosx.nr11.12.d: "Foreign missions that usually travel together have cancelled their trains and staff meetings after a private quarrel. For once, their timing has slipped badly enough to show which desks expected to move in step."
chaosx.nr11.12.a: "Lay every cancellation beside our case file."
chaosx.nr11.13.t: "A Frightened Man at the Door"
chaosx.nr11.13.d: "A trembling intermediary arrived at a police door with an unsigned note sewn into his coat. He knows the phrases used at the handoff and the place where the next packet should appear. His story touches incidents we had never connected."
chaosx.nr11.13.a: "Give him a safe bed and test the next drop."
chaosx.nr11.14.t: "One of Them Wants Out"
chaosx.nr11.14.d: "A foreign official crossed into our care carrying meeting times and names used at the door. He promises the rest once his family is safe. If the papers hold up, one government has been sitting much closer to the plot than it admits."
chaosx.nr11.14.a: "Get his family clear and hear the rest."
chaosx.nr11.15.t: "The Papers Did Not Burn"
chaosx.nr11.15.d: "Security officers reached a hidden radio room as its occupants kicked over a brazier. Half-burned schedules still show meeting times, courier routes, and military shorthand. The next address is readable in the ash."
chaosx.nr11.15.a: "Copy every page and raid the next address tonight."
chaosx.nr11.16.t: "Their Radio Is Ours"
chaosx.nr11.16.d: "A captured operator has agreed to keep sending on his usual key. Each reply will show which desks answer quickly, which habits they share, and which false routes they are ready to trust."
chaosx.nr11.16.a: "Keep him on the key and write his next message."
chaosx.nr11.18.t: "A New Door Opens"
chaosx.nr11.18.d: "A familiar courier entered a foreign mission carrying a blank leather folder. The next night, several coded desks sent hurried bursts outside their usual hours. Whatever answer passed between them, the approach made their network move."
chaosx.nr11.18.a: "Keep the new frequencies under watch."
chaosx.nr11.19.t: "A Patron in the Traffic"
chaosx.nr11.19.d: "The intercepted request asks for fuel, guarantees, and access to a military cipher network. It reached a government with the means to support a much wider campaign. We have yet to catch its reply."
chaosx.nr11.19.a: "Track every signal on the military circuit."
chaosx.nr11.20.t: "A Quiet Offer"
chaosx.nr11.20.d: "A trusted go-between asks whether we will help contain [GetSecretAllianceTargetNameDef]. The other partners will share intelligence, protect our couriers, and give us a voice in the peace they expect to write. They will reveal their names once we take the seat."
chaosx.nr11.20.a: "Take the seat and state our terms."
chaosx.nr11.20.f: "We join when our private demand is accepted."
chaosx.nr11.20.b: "Refuse and end the contact."
chaosx.nr11.20.c: "Refuse, then let the rumor spread."
chaosx.nr11.20.e: "Tell [GetSecretAllianceTargetNameDef] who came calling."
chaosx.nr11.21.t: "Shots at the Cabinet Motorcade"
chaosx.nr11.21.d: "The cabinet cars turned onto a narrow street after a forged order changed their route, and gunmen opened fire from the windows above. The ministers survived, and the attackers left foreign weapons and a list of safe addresses behind. Their partners are already burning the rest."
chaosx.nr11.21.a: "Lock down the capital and take the cell alive."
chaosx.nr11.21.a.tt: "A full manhunt costs Command Power, recovers part of the first Stability loss, and exposes more of the operation. A guarded cabinet also reduces the opening shock."
chaosx.nr11.21.b: "Get the government to safety and ride out the panic."
chaosx.nr11.21.b.tt: "The country loses more Stability and War Support as the cell escapes with much of its network intact."

# Settlements and public news
chaosx.nr11.191.t: "The Last Delegation Leaves"
chaosx.nr11.191.d: "The common timetable is gone. One capital recalled its mission, another blamed its neighbors, and the remaining officers packed their trunks. Nobody is taking orders in the coalition's name."
chaosx.nr11.191.a: "Let them explain the empty chairs."
chaosx.nr11.192.t: "Peace on Their Terms"
chaosx.nr11.192.d: "Coalition armies have won the campaign and brought their promises to the peace table. Each member is collecting the guarantee, restriction, or reward it was offered when the pact was still secret."
chaosx.nr11.192.a: "We will remember every signature."
chaosx.nr11.193.t: "Everyone Makes a Separate Peace"
chaosx.nr11.193.d: "Private talks and withdrawals have brought the coalition war to an untidy end. Some governments leave with guarantees, others with concessions, and several bring home little more than casualty lists."
chaosx.nr11.193.a: "So much for their common cause."
chaosx.nr11.194.t: "The Phones Go Dead"
chaosx.nr11.194.d: "Couriers have stopped coming to the watched rooms. Known intermediaries have vanished, and yesterday's codes draw no answer. The governments behind the scheme are saving themselves and leaving the pact to die in the dark."
chaosx.nr11.194.a: "Show the public what we can prove."
chaosx.nr11.194.a.tt: "Publish the surviving dossier. Confirmed participants turn against one another, and stronger Evidence brings a larger Political Power and War Support recovery."
chaosx.nr11.194.b: "Lock the files away."
chaosx.nr11.194.b.tt: "Keep the affair secret and recover Stability and political control."
chaosx.nr11.194.c: "Clear the innocent names."
chaosx.nr11.194.c.tt: "Repair relations with suspects cleared by the evidence and recover some Stability."
chaosx.nr11.194.e: "Keep the tradecraft and bury the accusations."
chaosx.nr11.194.e.tt: "Turn the captured methods into a temporary counterintelligence advantage. Greater Preparedness extends its duration, up to two years."
chaosx.nr11.195.t: "The Sponsors Stand Alone"
chaosx.nr11.195.d: "The great powers still have armies in the field. Their smaller partners have walked away from the common command, leaving each sponsor to bargain for itself."
chaosx.nr11.195.a: "Their power could not hold the pact together."
chaosx.nr11.196.t: "A Smaller Pact Survives"
chaosx.nr11.196.d: "The surviving members have kept their liaison offices open and turned wartime guarantees into a regional council. It has fewer seats, a shorter frontier to guard, and enough purpose to stay together."
chaosx.nr11.196.a: "We will have to live with their council."
chaosx.nr11.197.t: "The Winners Pack Up"
chaosx.nr11.197.d: "With the treaty signed, liaison officers are closing their desks and delegates are going home. The guarantees they won remain in force. The common command has finished its work."
chaosx.nr11.197.a: "They won their war and ended their pact."
chaosx.nr11.198.t: "The Victory Feast Turns Sour"
chaosx.nr11.198.d: "At the first settlement meeting, two sponsors demanded the same prize and smaller members produced promises that contradicted one another. By nightfall, the delegates were bargaining in separate rooms."
chaosx.nr11.198.a: "They divided us better than they divided the spoils."

secret_alliance_retained_counterintelligence: "Lessons of the Empty Chairs"
secret_alliance_retained_counterintelligence_desc: "The collapsed network left behind route maps, source-handling lessons, and a clearer picture of how foreign services concealed common work. The files will remain useful for a limited time."
chaosx.nr11.200.t: "The Secret Pact Steps Into Daylight"
chaosx.nr11.200.d: "[secret_alliance_presentation_leader.GetNameDefCap] has called [GetSecretAlliancePresentationFactionName] into the open. Its members are sending military missions and placing their forces under a shared plan against [secret_alliance_presentation_target.GetNameDef]. The scattered attacks around [secret_alliance_presentation_target.GetNameDef] were preparation for one campaign."
chaosx.nr11.200.a: "So the whispers had a name."
chaosx.nr11.201.t: "The Last Empty Chair Fills"
chaosx.nr11.201.d: "The coalition has taken in every government able to answer its call safely. It now counts [?secret_alliance_scenario_achieved_members|0] members, including [?secret_alliance_scenario_achieved_majors|0] major powers. Its recruiters have nowhere left to turn."
chaosx.nr11.201.a: "Then every card is on the table."

