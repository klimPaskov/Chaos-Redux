# Decision categories
secret_alliance_foreign_interference: "Foreign Interference"
secret_alliance_foreign_interference_desc: "Build evidence from independent sources, protect exposed systems, and act against developed leads. Evidence identifies the network. Preparedness determines how much of its opening plan can be blunted."
secret_alliance_coalition_crisis: "[GetSecretAllianceCrisisCategoryName]"
secret_alliance_coalition_crisis_desc: "[GetSecretAllianceCrisisCategoryDescription]"
secret_alliance_crisis_category_concealed: "Confrontation Crisis"
secret_alliance_crisis_category_revealed: "Coalition Crisis"
secret_alliance_crisis_category_desc_concealed: "The organized interference is nearing public action. Confirmed leads can be pressured, border preparations contested, and the common timetable disrupted before the countdown expires."
secret_alliance_crisis_category_desc_revealed: "The public coalition is at war. Use exposed channels, known weaknesses, member disputes, and target defenses to break its campaign and shape the settlement."

# Faction presentation
secret_alliance_anti_target_pact_name: "[GetSecretAllianceFactionName]"
secret_alliance_faction_name_adjective: "Anti-[secret_alliance_target.GetAdjective] Pact"
secret_alliance_faction_name_country: "Anti-[secret_alliance_target.GetName] Pact"
secret_alliance_faction_manifest_name: "Common Security Declaration"
secret_alliance_faction_manifest_desc: "The signatories commit military liaison staffs, protected supply routes, and coordinated action against [secret_alliance_target.GetNameDef]. Coalition Resolve measures whether those public obligations can survive war and settlement."
secret_alliance_postwar_bloc_name: "Coalition Security Council"
secret_alliance_postwar_security_manifest_name: "Postwar Security Charter"
secret_alliance_postwar_security_manifest_desc: "The surviving governments retain liaison offices, mutual consultation, and a limited regional security council after the original coalition campaign has ended."
secret_alliance_postwar_joining_rule: "Founding Members Only"
secret_alliance_postwar_war_declaration_rule: "Faction Leader Declarations"
secret_alliance_postwar_call_to_war_rule: "Security Charter Coordination"
secret_alliance_postwar_change_leader_rule: "All Charter Members Eligible"
secret_alliance_goal_containment_name: "Contain [secret_alliance_target.GetNameDef]"
secret_alliance_goal_containment_desc: "End the immediate threat through guarantees, restrictions, and a negotiated security settlement."
secret_alliance_goal_punitive_name: "Impose the Reckoning"
secret_alliance_goal_punitive_desc: "Break the target's capacity to threaten the pact and secure the grievances carried by its members."
secret_alliance_goal_regime_pressure_name: "Force Political Realignment"
secret_alliance_goal_regime_pressure_desc: "Use military pressure and domestic opposition to alter the target's political course."
secret_alliance_goal_spoils_name: "Secure the Promised Shares"
secret_alliance_goal_spoils_desc: "Advance far enough to make the coalition's private territorial and economic promises enforceable."
secret_alliance_goal_postwar_security_name: "Maintain the Regional Council"
secret_alliance_goal_postwar_security_desc: "Preserve a narrower liaison and guarantee system after the coalition war ends."
secret_alliance_joining_rule: "Declared Signatories Only"
secret_alliance_war_declaration_rule: "War against the Named Target"
secret_alliance_call_to_war_rule: "Honor the Public Commitment"
secret_alliance_change_leader_rule: "Founder and Sponsor Leadership"

# Ideas
secret_alliance_unexplained_interference: "Unexplained Interference"
secret_alliance_unexplained_interference_desc: "Administrative failures and coordinated pressure consume attention without revealing a single responsible government."
secret_alliance_compromised_channels: "Compromised Channels"
secret_alliance_compromised_channels_desc: "Hostile access to schedules, communications, and planning routines slows national coordination."
secret_alliance_hardened_networks: "Hardened Networks"
secret_alliance_hardened_networks_desc: "Independent protection projects make the state harder to surprise. Each project ties down scarce staff and matériel."
secret_alliance_staff_security_burden: "Compartmentalized Staff Work"
secret_alliance_staff_security_burden_desc: "Smaller planning circles protect secrets at the cost of slower coordination."
secret_alliance_industrial_security_burden: "Industrial Security Inspections"
secret_alliance_industrial_security_burden_desc: "Controlled access and parts inspections reduce output while the project remains active."
secret_alliance_transport_security_burden: "Dispersed Transport System"
secret_alliance_transport_security_burden_desc: "Protected routes and split stockpiles improve security at the cost of efficiency."
secret_alliance_border_security_burden: "Hardened Border Communications"
secret_alliance_border_security_burden_desc: "Redundant posts and guarded lines improve resilience while slowing movement."
secret_alliance_continuity_burden: "Continuity Administration"
secret_alliance_continuity_burden_desc: "Duplicate command sites consume political capacity to preserve government under attack."
secret_alliance_allied_coordination_burden: "Allied Coordination Staff"
secret_alliance_allied_coordination_burden_desc: "Standing consultations consume command attention while aligning defensive plans."
secret_alliance_public_coalition_pressure: "Coordinated War Pressure"
secret_alliance_public_coalition_pressure_desc: "Organized foreign pressure concentrates international and domestic strain on the target."
secret_alliance_known_enemy_plans: "Known Coalition Plans"
secret_alliance_known_enemy_plans_desc: "Captured routes, schedules, and controlled channels expose the coalition's opening concept."
secret_alliance_known_enemy_plans_low: "Fragments of Coalition Plans"
secret_alliance_known_enemy_plans_low_desc: "A few verified details provide limited warning of the coalition's opening."
secret_alliance_known_enemy_plans_medium: "Mapped Coalition Plans"
secret_alliance_known_enemy_plans_medium_desc: "Several corroborated channels reveal the main shape of the coalition's opening."
secret_alliance_coalition_opening_coordination: "Coalition Opening Coordination"
secret_alliance_coalition_opening_coordination_desc: "The pact enters war with established staffs, routes, and a common operational timetable."
secret_alliance_coalition_opening_coordination_low: "Loose Opening Coordination"
secret_alliance_coalition_opening_coordination_low_desc: "Public commitments exist. Hidden disputes and disrupted routes limit the first campaign."
secret_alliance_coalition_opening_coordination_medium: "Established Opening Coordination"
secret_alliance_coalition_opening_coordination_medium_desc: "Liaison staffs and supply arrangements give the coalition a coherent opening."
secret_alliance_target_defenses_low: "Partial Counter-Network Defenses"
secret_alliance_target_defenses_low_desc: "A few maintained projects blunt the most obvious points of attack."
secret_alliance_target_defenses_medium: "Integrated Counter-Network Defenses"
secret_alliance_target_defenses_medium_desc: "Protected staffs, routes, and continuity measures absorb much of the coalition's first move."
secret_alliance_fractured_coalition: "Fractured Coalition"
secret_alliance_fractured_coalition_desc: "Withdrawals, delayed calls, and conflicting promises impair common operations."

# Reveal super-event
chaosx_super_event.73.t: "THE PACT UNMASKED"
chaosx_super_event.73.d: "[This.GetSecretAllianceSuperEventDescription]"
chaosx_super_event.73.q: "\"All warfare is based on deception.\"\n§YSun Tzu, The Art of War, trans. Lionel Giles§!"
chaosx_super_event.73.a: "Look about you."
super_event_73_desc_hostile_war: "The entry of one pact government into open war has activated commitments prepared in secret. [secret_alliance_presentation_leader.GetNameDefCap] has called [?secret_alliance_presentation_target.secret_alliance_reveal_member_count_snapshot|0] governments into [GetSecretAlliancePresentationFactionName] against [secret_alliance_presentation_target.GetNameDef]. Military missions, supply agreements, and earlier disturbances now serve one campaign."
super_event_73_desc_pact_controlled: "At a public conference, [secret_alliance_presentation_leader.GetNameDefCap] has announced [GetSecretAlliancePresentationFactionName] as a common front against [secret_alliance_presentation_target.GetNameDef]. [?secret_alliance_presentation_target.secret_alliance_reveal_member_count_snapshot|0] governments have signed the declaration, opened military liaison offices, and placed their preparations under a single command. The coalition's offensive timetable has entered public view."
super_event_73_desc_player_forced: "Evidence released by [secret_alliance_presentation_target.GetNameDef] has exposed the governments coordinating against it. [secret_alliance_presentation_leader.GetNameDefCap] has held [?secret_alliance_presentation_target.secret_alliance_reveal_member_count_snapshot|0] members together under the name [GetSecretAlliancePresentationFactionName]. The exposed coalition has compromised routes, known contacts, and contested commitments that leave its first military plans open to interference."
super_event_73_desc_fractured: "[?secret_alliance_presentation_target.secret_alliance_reveal_member_count_snapshot|0] governments have entered [GetSecretAlliancePresentationFactionName] under [secret_alliance_presentation_leader.GetNameDef] against [secret_alliance_presentation_target.GetNameDef]. Old grievances are already splitting the declaration. A threatened withdrawal, delayed signatures, and unsigned operational orders may empty chairs before the first joint action. Liaison offices are open. Whether every delegation answers the call remains unsettled."
super_event_73_desc_weakened: "[secret_alliance_presentation_leader.GetNameDefCap] has announced [GetSecretAlliancePresentationFactionName] against [secret_alliance_presentation_target.GetNameDef]. Disrupted schedules and defensive preparations have forced the delegates into a hurried opening. [?secret_alliance_presentation_target.secret_alliance_reveal_member_count_snapshot|0] governments have signed the declaration. Liaison staffs are revising routes, calls, and deployment plans already under strain."
secret_alliance_presentation_faction_name_adjective: "Anti-[secret_alliance_presentation_target.GetAdjective] Pact"
secret_alliance_presentation_faction_name_country: "Anti-[secret_alliance_presentation_target.GetName] Pact"

# Triggerable scenario
chaosx.scenarios.secret_alliance.name: "Coalition Unmasked"
chaosx.scenarios.entry.id.secret_alliance: "Event 011: Coalition Unmasked"
chaosx.scenarios.secret_alliance.desc.random_coalition: "Build a valid AI coalition from the full eligible pool and reveal it against the selected human target."
chaosx.scenarios.secret_alliance.desc.regional_ring: "Prefer neighboring and same-continent minors able to form a credible regional ring."
chaosx.scenarios.secret_alliance.desc.ideological_front: "Prefer governments politically opposed to the target and give the pact a regime-pressure doctrine."
chaosx.scenarios.secret_alliance.desc.great_power_sponsor: "Require a strategically valid major sponsor and organize the coalition around its support."
chaosx.scenarios.secret_alliance.desc.unlikely_coalition: "Assemble distant or politically mismatched partners whose conflicting promises weaken their opening resolve."
chaosx.scenarios.type.secret_alliance.random_coalition: "Random Coalition"
chaosx.scenarios.type.secret_alliance.regional_ring: "Regional Ring"
chaosx.scenarios.type.secret_alliance.ideological_front: "Ideological Front"
chaosx.scenarios.type.secret_alliance.great_power_sponsor: "Great-Power Sponsor"
chaosx.scenarios.type.secret_alliance.unlikely_coalition: "Unlikely Coalition"
chaosx.scenarios.secret_alliance.impact.low: "Low: a compact coalition of three governments enters the crisis with limited stockpiles. A great-power-backed coalition is led by one major with two minor partners. Every other formation draws all three members from minor governments."
chaosx.scenarios.secret_alliance.impact.medium: "Medium: five governments enter with established liaison and logistics. A great-power-backed coalition gives one seat to its major sponsor. Every other formation draws all five members from minor governments."
chaosx.scenarios.secret_alliance.impact.high: "High: one major and six minor governments with coordinated logistics and advanced preparations."
chaosx.scenarios.secret_alliance.impact.maximum: "Maximum: up to twelve safe valid governments and up to two eligible majors, with full war pressure and challenge eligibility when the requested roster or the entire safe pool is used."

# Event log and evolution details
chaosx.events_log.window.event_details.secret_alliance: "[GetSecretAllianceEventLogDetails]"
chaosx.events_log.evolution.type.secret_alliance: "[GetSecretAllianceEvolutionTypeName]"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_1: "Repeating Methods"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_2: "Coordinated Interference"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_3: "Approaching Confrontation"
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_1: "[GetSecretAllianceEvolutionOneBody]"
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_2: "[GetSecretAllianceEvolutionTwoBody]"
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_3: "[GetSecretAllianceEvolutionThreeBody]"
chaosx.events_log.window.evolution_details.secret_alliance.body.event_detail: "[GetSecretAllianceEventLogDetails]"
secret_alliance_event_log_name_concealed: "Unexplained Foreign Incidents"
secret_alliance_event_log_name_coordinated: "Coordinated Foreign Interference"
secret_alliance_event_log_name_revealed: "Secret Alliance"
secret_alliance_event_log_details_concealed: "Strangers keep meeting in the wrong places. Couriers vanish, equipment fails, and the same quiet methods turn up in distant incidents. Following the trail can expose the pattern, and a few sensible precautions may blunt whatever comes next."
secret_alliance_event_log_details_coordinated: "The loose trail has become a real case. Foreign agents share routes, resources, and targets, though the governments behind them remain hard to name. Better sources and stronger defenses give the country a chance to expose the scheme before it breaks into the open."
secret_alliance_event_log_details_revealed: "The hidden partners have stepped into public view as a coalition aimed at one country. Every clue found and every defense prepared now matters as the secret campaign becomes an open confrontation."
secret_alliance_evolution_type_concealed: "Incident Pattern"
secret_alliance_evolution_type_coordinated: "Foreign Interference"
secret_alliance_evolution_type_revealed: "Secret Alliance"
secret_alliance_evolution_one_body_concealed: "The same routes, tricks, and timings are turning up far beyond the first incidents. Leaks and defections reveal pieces of the connection, even if the full list of partners stays hidden."
secret_alliance_evolution_one_body_revealed: "The first repeated methods were the earliest sign of the coalition. Leaks, quarrels, and defections gave investigators the links they needed."
secret_alliance_evolution_two_body_concealed: "The incidents now point to an organized foreign campaign. Covert attacks are growing bolder, and the country must decide whom to suspect, which sources to trust, and how much to prepare."
secret_alliance_evolution_two_body_revealed: "Foreign support turned scattered interference into a deliberate campaign. The investigation and the defenses built along the way shaped the coalition's public reveal."
secret_alliance_evolution_three_body_concealed: "Border pressure, military precautions, and nervous public warnings are piling up. The hidden crisis is close to becoming an open confrontation, but the opening moves can still be changed."
secret_alliance_evolution_three_body_revealed: "The last secret preparations ended with a public coalition and the threat of war. Old promises and covert plans became the coalition's opening campaign."

# Investigations and named missions
secret_alliance_compare_diplomatic_traffic: "Compare Diplomatic Traffic"
secret_alliance_compare_diplomatic_traffic_desc: "Cross-reference mission schedules and encrypted traffic, then watch the liaison route centered on [secret_alliance_liaison_objective_state.GetName]."
secret_alliance_audit_foreign_funding: "Audit Foreign Funding"
secret_alliance_audit_foreign_funding_desc: "Follow synchronized payments through printers, associations, and commercial intermediaries."
secret_alliance_inspect_foreign_missions: "Inspect Foreign Missions"
secret_alliance_inspect_foreign_missions_desc: "Use customs, rail, and security records to identify an envoy willing to leave the network."
secret_alliance_compare_sabotage_signatures: "Compare Sabotage Signatures"
secret_alliance_compare_sabotage_signatures_desc: "Match tools, parts, and shipping errors until a repeat safehouse circuit emerges."
secret_alliance_trace_courier_route: "Trace a Courier Route"
secret_alliance_trace_courier_route_desc: "Shadow one compromised route toward [secret_alliance_courier_objective_state.GetName] and prepare an interception."
secret_alliance_question_intermediary: "Question an Intermediary"
secret_alliance_question_intermediary_desc: "Turn a broker between respectable institutions and the hidden network, then protect the resulting channel."
secret_alliance_inspect_military_access_talks: "Inspect Access Talks"
secret_alliance_inspect_military_access_talks_desc: "Compare transit negotiations, staff visits, and border schedules for common military planning."
secret_alliance_reconstruct_meeting_circuit: "Reconstruct the Meeting Circuit"
secret_alliance_reconstruct_meeting_circuit_desc: "Combine independent source classes into a map of recurring couriers, rooms, and liaison intervals."
secret_alliance_watch_liaison_route: "Watch the Liaison Route"
secret_alliance_watch_liaison_route_desc: "Keep control of [secret_alliance_liaison_objective_state.GetName], maintain rotated ciphers, and avoid a source loss until the route yields a full pattern."
secret_alliance_seize_compromised_courier: "Seize the Compromised Courier"
secret_alliance_seize_compromised_courier_desc: "Control [secret_alliance_courier_objective_state.GetName], station a division there, and use the mapped route to capture the courier intact."
secret_alliance_turn_recruited_clerk: "Turn the Recruited Clerk"
secret_alliance_turn_recruited_clerk_desc: "Hold [secret_alliance_clerk_objective_state.GetName], keep the intermediary and cipher project active, and protect the source from detection."
secret_alliance_protect_defecting_envoy: "Protect the Defecting Envoy"
secret_alliance_protect_defecting_envoy_desc: "Secure [secret_alliance_envoy_objective_state.GetName] with troops and allied consultation until the envoy can be extracted."
secret_alliance_break_safehouse_network: "Break the Safehouse Network"
secret_alliance_break_safehouse_network_desc: "Control and garrison [secret_alliance_safehouse_objective_state.GetName], preserve the identified premises, and exploit industrial security records."
secret_alliance_national_manhunt: "National Manhunt"
secret_alliance_national_manhunt_desc: "Hold [secret_alliance_manhunt_objective_state.GetName] with a reinforced security presence and guarded cabinet until the political cell is contained."
secret_alliance_control_rumor_channel: "Control the Rumor Channel"
secret_alliance_control_rumor_channel_desc: "Keep control of [secret_alliance_rumor_objective_state.GetName] and preserve either the turned media contact or funding audit long enough to redirect the campaign."

# Suspect selection
secret_alliance_select_suspect: "Select [FROM.GetNameDef]"
secret_alliance_select_suspect_desc: "Make this developed lead the subject of diplomacy, counteraction, or public accusation. Confidence is not proof of involvement."
secret_alliance_clear_selected_suspect: "Clear Selected Suspect"
secret_alliance_clear_selected_suspect_desc: "Remove the current country from the action slot without changing its accumulated confidence."
secret_alliance_close_disproved_lead: "Close Disproved Lead: [FROM.GetNameDef]"
secret_alliance_close_disproved_lead_desc: "Archive a weak lead traced to planted or disproved traffic. This country leaves the visible suspect board, and the investigation recovers some credibility."
secret_alliance_select_public_member: "Select [FROM.GetNameDef]"
secret_alliance_select_public_member_desc: "Choose this declared coalition member as the subject of a wartime political or military action."

# Protection projects
secret_alliance_compartmentalize_staff_plans: "Compartmentalize Staff Plans"
secret_alliance_compartmentalize_staff_plans_desc: "Split operational work into controlled cells. The maintained project adds staff-security Preparedness while burdening planning."
secret_alliance_rotate_ciphers_and_couriers: "Rotate Ciphers and Couriers"
secret_alliance_rotate_ciphers_and_couriers_desc: "Replace exposed codes and routes on a fixed schedule, strengthening staff security at a transport cost."
secret_alliance_secure_industrial_choke_points: "Secure Industrial Choke Points"
secret_alliance_secure_industrial_choke_points_desc: "Select an owned and controlled state with factories, dockyards, or infrastructure, then inspect access, parts, and loading records there. The project adds industrial-security Preparedness while reducing output."
secret_alliance_disperse_critical_stockpiles: "Disperse Critical Stockpiles"
secret_alliance_disperse_critical_stockpiles_desc: "Select an owned and controlled state with infrastructure, then move reserves through guarded depots and alternate routes there, gaining transport Preparedness at an efficiency cost."
secret_alliance_guard_political_cabinet: "Guard the Political Cabinet"
secret_alliance_guard_political_cabinet_desc: "Protect ministers, archives, and emergency authority as one continuity project."
secret_alliance_harden_border_communications: "Harden Border Communications"
secret_alliance_harden_border_communications_desc: "Select an owned and controlled state adjoining foreign territory, then build redundant lines and protected posts along that approach."
secret_alliance_protect_ports_and_airfields: "Protect Ports and Airfields"
secret_alliance_protect_ports_and_airfields_desc: "Select an owned and controlled coastal state or one with an air base, then screen manifests, fuel access, and maintenance staff at those exposed hubs."
secret_alliance_establish_continuity_sites: "Establish Continuity Sites"
secret_alliance_establish_continuity_sites_desc: "Select the controlled capital or an owned and controlled state with factories or dockyards, then prepare alternate command posts and evacuation routes there."

# Diplomacy
secret_alliance_quietly_approach_suspect: "Quietly Approach the Suspect"
secret_alliance_quietly_approach_suspect_desc: "Test the selected government's position through an unofficial channel. An actual participant may defect or expose more evidence. An innocent government will resent the approach."
secret_alliance_offer_security_guarantee: "Offer a Security Guarantee"
secret_alliance_offer_security_guarantee_desc: "Offer protection to a selected country that may be acting from fear. If its purpose lies elsewhere, the offer may only delay its response."
secret_alliance_open_grievance_settlement: "Open Grievance Settlement"
secret_alliance_open_grievance_settlement_desc: "Offer a concrete settlement if grievance drives the selected government. A mistaken approach still changes relations."
secret_alliance_expose_sponsor_pressure_privately: "Expose External Pressure Privately"
secret_alliance_expose_sponsor_pressure_privately_desc: "Use substantial Evidence to separate a suspected participant from the government underwriting its activity."
secret_alliance_request_allied_consultation: "Request Allied Consultation"
secret_alliance_request_allied_consultation_desc: "Create a maintained allied-coordination component and share defensive warning without naming unconfirmed governments."
secret_alliance_convene_neutral_inquiry: "Convene a Neutral Inquiry"
secret_alliance_convene_neutral_inquiry_desc: "Invite neutral investigators to corroborate an independent diplomatic source class. A complete case may force public exposure."
secret_alliance_demand_explanation: "Demand an Explanation"
secret_alliance_demand_explanation_desc: "Confront the selected country. An actual participant may break with its partners, refuse, or defect. A false accusation helps the hostile coordination hold together."

# Deception and counteraction
secret_alliance_feed_false_mobilization_plans: "Feed False Mobilization Plans"
secret_alliance_feed_false_mobilization_plans_desc: "Use a preserved channel to pass a convincing false opening plan. If foreign planners accept it, their later deployment will follow the deception."
secret_alliance_run_controlled_shipment: "Run a Controlled Shipment"
secret_alliance_run_controlled_shipment_desc: "Offer a watched matériel route as bait. The result depends on the quality of the case, protected channels, and whether the watchers are detected."
secret_alliance_plant_false_faction_dispute: "Plant Conflicting Instructions"
secret_alliance_plant_false_faction_dispute_desc: "Introduce incompatible instructions into the foreign network. Success provokes disagreement. Failure exposes our manipulation."
secret_alliance_turn_pact_member: "Turn a Confirmed Participant"
secret_alliance_turn_pact_member_desc: "Recruit the selected confirmed participant as a controlled channel. It delays a later public commitment and can preserve false-plan consequences."
secret_alliance_sabotage_forward_depot: "Sabotage a Forward Depot"
secret_alliance_sabotage_forward_depot_desc: "Attack a mapped logistics site. Success disrupts preparations. Failure raises the danger of open confrontation."
secret_alliance_disrupt_planning_conference: "Disrupt a Planning Conference"
secret_alliance_disrupt_planning_conference_desc: "Strike the meeting circuit. A full success captures the conference and forces public disclosure. Lesser outcomes disrupt planning or hasten confrontation."
secret_alliance_conduct_border_reconnaissance_raid: "Conduct Border Reconnaissance"
secret_alliance_conduct_border_reconnaissance_raid_desc: "Map an exact passable approach, reinforce its patrols, and open the contested-crossing objective without beginning a normal war."
secret_alliance_seize_courier_aircraft_or_vessel: "Seize a Courier Aircraft or Vessel"
secret_alliance_seize_courier_aircraft_or_vessel_desc: "Intercept a long-range courier platform. A full success captures plans and an independent communications clue."

# Border chain
secret_alliance_reinforce_border_patrols: "Reinforce Border Patrols"
secret_alliance_reinforce_border_patrols_desc: "Commit forces between [?secret_alliance_border_attacker_state.GetName] and [?secret_alliance_border_defender_state.GetName], and reduce the survey team's freedom of action."
secret_alliance_intercept_survey_team: "Intercept the Survey Team"
secret_alliance_intercept_survey_team_desc: "Seize personnel and maps at the named crossing before they can withdraw."
secret_alliance_secure_contested_crossing_action: "Secure the Contested Crossing"
secret_alliance_secure_contested_crossing_action_desc: "Commit the prepared states to a named crossing objective. Holding the crossing disrupts the surveyed route. Losing it opens a staging approach to the foreign planners."
secret_alliance_begin_limited_border_conflict: "Begin Limited Border Conflict"
secret_alliance_begin_limited_border_conflict_desc: "Start a bounded border war between [?secret_alliance_border_attacker_state.GetName] and [?secret_alliance_border_defender_state.GetName]. This alone does not reveal the wider coordination."
secret_alliance_escalate_or_withdraw_border_conflict: "Escalate the Border Conflict"
secret_alliance_escalate_or_withdraw_border_conflict_desc: "Convert the limited clash into normal war. The wider coordination becomes public and its surviving commitments activate."
secret_alliance_withdraw_from_border_conflict: "Withdraw from the Border Conflict"
secret_alliance_withdraw_from_border_conflict_desc: "End the limited clash, accept political cost, and reduce immediate War Pressure."
secret_alliance_negotiate_border_standdown: "Negotiate a Border Standdown"
secret_alliance_negotiate_border_standdown_desc: "End the limited clash through intermediaries, lowering War Pressure and confidence among the foreign planners."
secret_alliance_secure_contested_crossing: "Secure the Contested Crossing"
secret_alliance_secure_contested_crossing_desc: "Keep units on both sides of [?secret_alliance_border_attacker_state.GetName] and [?secret_alliance_border_defender_state.GetName], retain local supply access, and hold until the crossing is secured."

# Public exposure
secret_alliance_release_partial_dossier: "Release a Partial Dossier"
secret_alliance_release_partial_dossier_desc: "Publish corroborated methods without naming every actor. The release warns institutions, exposes observed methods, and invites outside scrutiny."
secret_alliance_name_first_member: "Name the First Participant"
secret_alliance_name_first_member_desc: "Publicly accuse the selected country. A true lead is confirmed. A false accusation damages credibility and may drive the innocent government toward our opponents."
secret_alliance_present_coalition_case: "Present the Coordinated-Interference Case"
secret_alliance_present_coalition_case_desc: "Use a complete, untainted body of evidence to force public disclosure. A weak or polluted case helps the hostile coordination withstand scrutiny."
secret_alliance_expose_major_sponsor: "Expose Major Backing"
secret_alliance_expose_major_sponsor_desc: "Name a confirmed major backer and force its private commitments into public view. A false accusation carries the full consequence."
secret_alliance_demand_international_inspections: "Demand International Inspections"
secret_alliance_demand_international_inspections_desc: "Use neutral access to expose depots and liaison sites. Failure may introduce planted evidence."

# Emergency response
secret_alliance_emergency_mobilization: "Emergency Mobilization"
secret_alliance_emergency_mobilization_desc: "Mobilize guarded staffs and reserve formations. The temporary commitment consumes manpower, equipment, fuel, and command capacity."
secret_alliance_fortify_exposed_approaches: "Fortify Exposed Approaches"
secret_alliance_fortify_exposed_approaches_desc: "Turn mapped hostile routes into a maintained border-defense component."
secret_alliance_recall_overseas_assets: "Recall Overseas Assets"
secret_alliance_recall_overseas_assets_desc: "Withdraw vulnerable missions and courier teams, adding transport Preparedness and immediate command capacity."
secret_alliance_issue_final_private_warning: "Issue a Final Private Warning"
secret_alliance_issue_final_private_warning_desc: "Give the selected suspect one final chance to defect or delay its commitment before the crisis becomes public."
secret_alliance_preempt_coalition: "Preempt the Coordinated Threat"
secret_alliance_preempt_coalition_desc: "Declare normal war on the selected confirmed participant and force the wider coordination into public view. The declaration tests every foreign commitment at once. Firm governments enter the war. Compromised or doubtful partners may hesitate, withdraw, or break away."
secret_alliance_seek_defensive_alliance: "Seek a Defensive Alliance"
secret_alliance_seek_defensive_alliance_desc: "Build allied-coordination Preparedness and reduce immediate War Pressure through public deterrence."
secret_alliance_evacuate_critical_leadership: "Evacuate Critical Leadership"
secret_alliance_evacuate_critical_leadership_desc: "Move the continuity government before a threatened opening, accepting disruption for durable Preparedness."
secret_alliance_coalition_countdown: "Countdown to Open Confrontation"
secret_alliance_coalition_countdown_desc: "The foreign coordination is completing military commitments. Reduce War Pressure, break suspect governments away, preempt, or prepare for public confrontation."
secret_alliance_public_offensive_countdown: "Public Offensive Timetable"
secret_alliance_public_offensive_countdown_desc: "The declared coalition is aligning its next campaign. Coalition Resolve and surviving preparations shape the result."

# Revealed-war actions
secret_alliance_exploit_exposed_liaison_map: "Exploit the Liaison Map"
secret_alliance_exploit_exposed_liaison_map_desc: "Use captured channels to disrupt public coalition coordination."
secret_alliance_strike_known_forward_depots: "Strike Known Forward Depots"
secret_alliance_strike_known_forward_depots_desc: "Attack the coalition's exposed logistics network and reduce its ability to sustain the opening."
secret_alliance_offer_separate_terms: "Offer Separate Terms"
secret_alliance_offer_separate_terms_desc: "Approach the selected public member according to its motive and private commitment. A successful exit lowers Coalition Resolve."
secret_alliance_publicize_conflicting_war_aims: "Publicize Conflicting War Aims"
secret_alliance_publicize_conflicting_war_aims_desc: "Reveal incompatible promises made to the coalition's members and increase internal pressure."
secret_alliance_support_member_opposition: "Support Member Opposition"
secret_alliance_support_member_opposition_desc: "Use the selected member's domestic fault lines to weaken its willingness to continue the war."
secret_alliance_demand_sponsor_accountability: "Demand Sponsor Accountability"
secret_alliance_demand_sponsor_accountability_desc: "Turn failed offensives and private promises against the coalition's major sponsors."
secret_alliance_coordinate_allied_counteroffensive: "Coordinate Allied Counteroffensive"
secret_alliance_coordinate_allied_counteroffensive_desc: "Spend command capacity, equipment, and fuel to convert known weaknesses into a joint response."

