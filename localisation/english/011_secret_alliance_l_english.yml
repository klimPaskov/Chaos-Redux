l_english:
chaosx.nr11.1.t: "Unrelated Frictions"
chaosx.nr11.1.d: "Diplomatic pouches, rail manifests, and embassy calendars no longer agree with one another. None of the fragments prove a public coalition, but too many offices are moving around [ROOT.GetNameDef] as if a shared private line already exists."
chaosx.nr11.1.a: "Open the quiet files."
chaosx.nr11.1.a.tt: "The pattern is marked for quiet observation before any public accusation is made."
chaosx.nr11.21.t: "The Counter-Pact Desk"
chaosx.nr11.21.d: "The dossier has grown too large for ordinary foreign-ministry notes. Couriers repeat old routes under new covers, customs clerks flag matching invoices, and military offices want a single counter-pact desk before the trail turns public."
chaosx.nr11.21.a: "Give the desk authority."
chaosx.nr11.21.a.tt: "Counter-pact decisions, missions, evidence work, preparedness, and diplomatic pressure become available."
chaosx.nr11.22.t: "More Hands on the Ledger"
chaosx.nr11.22.d: "The pattern has widened. More signatures pass through cutouts, more border offices receive the same quiet instructions, and the pressure around [ROOT.GetNameDef] looks less like gossip and more like a compact with discipline."
chaosx.nr11.22.a: "Mark the pattern."
chaosx.nr11.22.a.tt: "The pressure pattern grows broader and better coordinated."
chaosx.nr11.23.t: "An Outside Guarantee"
chaosx.nr11.23.d: "The latest papers carry a heavier shadow. Procurement channels that smaller states could not sustain alone now have credit, cover, and military confidence behind them."
chaosx.nr11.23.a: "Follow the guarantee."
chaosx.nr11.23.a.tt: "The compact gains stronger backing, and the counter-pact response becomes active."
chaosx.nr11.24.t: "The Open Table"
chaosx.nr11.24.d: "The compact is close to the surface. Its envoys are no longer only hiding routes. They are testing public language, border incidents, and war plans that can survive daylight."
chaosx.nr11.24.a: "Prepare for the open break."
chaosx.nr11.24.a.tt: "Public confrontation, war choices, and the final crisis window become active."
chaosx.nr11.30.t: "The Compact Breaks Cover"
chaosx.nr11.30.d: "The hidden papers have become public commitments. The anti-[ROOT.GetAdjective] compact has declared itself, tied its members to a common front, and opened the road from intelligence work to war."
chaosx.nr11.30.a: "The private war has a flag."
chaosx.nr11.30.a.tt: "The compact reveals itself, forms a public coalition where possible, and valid core members enter war against [ROOT.GetNameDef]."
chaosx.nr11.31.t: "Paper Collapse"
chaosx.nr11.31.d: "The compact's private confidence gives way under public pressure. Its couriers stop carrying common instructions, its guarantees are denied in sequence, and the signatures that once circled [ROOT.GetNameDef] are left without a table."
chaosx.nr11.31.a: "File every unsigned page."
chaosx.nr11.31.a.tt: "The compact dissolves before it can become a public war coalition."
chaosx.nr11.report.a: "Add it to the board."
chaosx.nr11.40.t: "Provocation by Appointment"
chaosx.nr11.40.d: "A border argument arrives with suspicious timing. Local officers call it routine. The foreign ministry notes that several offices were warned before the first patrol moved."
chaosx.nr11.40.a.tt: "Suspicion and hostility rise."
chaosx.nr11.41.t: "Money Through the Press Offices"
chaosx.nr11.41.d: "Paid notices, friendly editorials, and charitable committees carry the same phrasing in different capitals. The money does not point to one sender, but it points in one direction."
chaosx.nr11.41.a.tt: "Evidence increases and compact secrecy weakens."
chaosx.nr11.42.t: "Courier Pattern"
chaosx.nr11.42.d: "Three routes cross the same rail offices on the same week with different names and identical habits. The board gains another thread."
chaosx.nr11.42.a.tt: "Evidence and suspicion increase."
chaosx.nr11.43.t: "Supply Nuisance"
chaosx.nr11.43.d: "A warehouse delay becomes a customs delay, then a missing seal, then a vanished shipping notice. The damage is small, but the choreography is not."
chaosx.nr11.43.a.tt: "Preparedness and hostility rise."
chaosx.nr11.44.t: "Border Test"
chaosx.nr11.44.d: "A patrol crosses close enough to be seen and far enough to be denied. Staff officers quietly update the frontier map."
chaosx.nr11.44.a.tt: "Suspicion and pact readiness rise."
chaosx.nr11.45.t: "Another Signature"
chaosx.nr11.45.d: "A fresh set of intermediaries enters the paper trail. No government admits to joining anything, but the compact's reach has widened."
chaosx.nr11.45.a.tt: "The compact attempts to add another valid minor member."
chaosx.nr11.46.t: "Factory Night"
chaosx.nr11.46.d: "A controlled accident hits an industrial district before dawn. The saboteurs leave no flag, only missing tools, confused guards, and a timetable that matches the older evidence."
chaosx.nr11.46.a.tt: "Industrial sabotage succeeds, increasing suspicion and hostility."
chaosx.nr11.47.t: "Officer Threat"
chaosx.nr11.47.d: "An officer's family receives a warning written with careful diplomatic grammar. The threat is not public, but the staff room understands it."
chaosx.nr11.47.a.tt: "Suspicion and pact readiness rise."
chaosx.nr11.48.t: "Rail Interference"
chaosx.nr11.48.d: "Switching orders disappear from a junction office. The trains move again, but the file cabinet says someone knew exactly which drawer mattered."
chaosx.nr11.48.a.tt: "Suspicion and hostility rise."
chaosx.nr11.49.t: "Patron Funding"
chaosx.nr11.49.d: "The compact's smaller channels suddenly stop acting poor. Procurement, legal cover, and liaison travel all improve at once."
chaosx.nr11.49.a.tt: "Compact cohesion, readiness, and suspicion rise."
chaosx.nr11.50.t: "Public Communique"
chaosx.nr11.50.d: "A statement appears without naming the compact, but every sentence tests a future accusation against [ROOT.GetNameDef]."
chaosx.nr11.50.a.tt: "Suspicion and hostility rise sharply."
chaosx.nr11.51.t: "War Council Rumor"
chaosx.nr11.51.d: "Attaches deny that a war council met. Their hotel bills, rail tickets, and identical absences say otherwise."
chaosx.nr11.51.a.tt: "Pact readiness and hostility rise."
chaosx.nr11.52.t: "Defector Panic"
chaosx.nr11.52.d: "A courier changes sides, or someone believes one has. The compact tightens its rules, and the counter-pact board gains names it can finally test."
chaosx.nr11.52.a.tt: "Evidence rises, cohesion falls, and another compact link may be exposed."
chaosx.news.11.t: "Anti-[ROOT.GetAdjective] Compact Revealed"
chaosx.news.11.d: "The private front against [ROOT.GetNameDef] has become public. After weeks of courier trails, border incidents, and diplomatic denials, the compact has presented itself as a common security answer. Its members claim necessity. [ROOT.GetAdjective] officials call it preparation for war."
chaosx.news.11.a: "The map has another line on it."
