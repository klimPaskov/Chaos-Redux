l_english:

# Event reports
chaosx.nr11.3.t: "A Pattern in the Margins"
chaosx.nr11.3.d: "Intercepted diplomatic summaries, altered shipping schedules, and a cluster of identical administrative errors have reached three separate ministries. None is decisive alone. Together, they suggest that someone is testing how quickly our government notices pressure applied without a signature."
chaosx.nr11.3.a: "Record the pattern and keep the circle small."
chaosx.nr11.3.b: "Assign a joint staff to compare the files."
chaosx.nr11.4.t: "The Pressure Becomes Deliberate"
chaosx.nr11.4.d: "A coordinated political attack has struck several institutions at once. Money moved through respectable intermediaries, a secure schedule reached hostile hands, and street organizers repeated claims prepared abroad. The incidents can no longer be treated as coincidence."
chaosx.nr11.4.a: "Open a national counter-network inquiry."
chaosx.nr11.4.b: "Put the security services on a war footing."
chaosx.nr11.5.t: "Surveyors at the Frontier"
chaosx.nr11.5.d: "Patrols have found concealed observation posts, corrected road maps, and fresh measurements along approaches to our territory. The work was careful enough to serve a future military staff. The surveyors left no flag behind."
chaosx.nr11.5.a: "Prepare the threatened approaches."
chaosx.nr11.5.b: "Let the country know we are being tested."
chaosx.nr11.6.t: "The Missing Courier"
chaosx.nr11.6.d: "A courier carrying routine diplomatic traffic disappeared between two controlled stops. Copies of the pouch surfaced later with selected pages removed and harmless papers resealed. The route itself appears to have been studied for weeks."
chaosx.nr11.6.a: "Close the route and follow the watchers."
chaosx.nr11.6.b: "Replace the pouch and preserve the schedule."
chaosx.nr11.7.t: "Machines Fail Together"
chaosx.nr11.7.d: "Breakdowns at distant workshops share the same small alterations: filed governors, contaminated lubricants, and replacement parts sent to the wrong depots. The method points to trained hands using ordinary freight channels."
chaosx.nr11.7.a: "Issue guarded parts and compare every failure."
chaosx.nr11.7.b: "Keep production moving and absorb the losses."
chaosx.nr11.8.t: "Lines Measured in Silence"
chaosx.nr11.8.d: "Military police have recovered sketches of bridges, rail sidings, and mobilization roads near our frontier. The drawings omit civilian landmarks and mark only the features needed to move formations quickly."
chaosx.nr11.8.a: "Change the routes and seed false measurements."
chaosx.nr11.8.b: "Reinforce the obvious approaches."
chaosx.nr11.9.t: "The Same Rumor, Everywhere"
chaosx.nr11.9.d: "A story damaging to the government appeared in provincial newspapers, foreign broadcasts, and union circulars within the same week. Its wording changes across outlets. Its errors and sequence remain identical."
chaosx.nr11.9.a: "Answer publicly before it hardens."
chaosx.nr11.9.b: "Trace the printers, brokers, and transmitters."
chaosx.nr11.10.t: "Pressure on the Cabinet"
chaosx.nr11.10.d: "Private correspondence has been published beside forged minutes and carefully timed demonstrations. The campaign aims to consume the government's attention. Every response buys time for preparations elsewhere."
chaosx.nr11.10.a: "Protect the institutions and arrest the handlers."
chaosx.nr11.10.b: "Weather the attack without exposing our methods."
chaosx.nr11.11.t: "A Door Left Open"
chaosx.nr11.11.d: "A rented room, unused radio parts, and a ledger of coded appointments have been found near a government district. The premises were abandoned hours before the search, suggesting warning from inside the cordon."
chaosx.nr11.11.a: "Seal the district and work outward."
chaosx.nr11.11.b: "Watch the room and see who returns."
chaosx.nr11.12.t: "The Calendar Slips"
chaosx.nr11.12.d: "Several foreign missions have postponed travel and staff talks after a dispute that never reached the press. The interruption offers a brief glimpse of competing priorities behind otherwise synchronized activity."
chaosx.nr11.12.a: "Compare the cancellations with our open files."
chaosx.nr11.13.t: "A Fragment from the Network"
chaosx.nr11.13.d: "An unsigned memorandum has reached our services through a frightened intermediary. Its terminology matches earlier incidents, while its routing marks connect a fresh source to an existing class of evidence."
chaosx.nr11.13.a: "Protect the source and test every detail."
chaosx.nr11.14.t: "An Empty Chair"
chaosx.nr11.14.d: "A foreign official has broken with the arrangement surrounding our country and supplied material that makes direct participation likely. The source demands protection while other records are tested for independent corroboration."
chaosx.nr11.14.a: "Secure the witness and preserve the documents."
chaosx.nr11.15.t: "The Safehouse Broken"
chaosx.nr11.15.d: "Security forces have entered a communications site before its records could be destroyed. Meeting times, route marks, and military shorthand now connect separate incidents to one working structure."
chaosx.nr11.15.a: "Exploit the breach before the network moves."
chaosx.nr11.16.t: "A Channel Turned"
chaosx.nr11.16.d: "A controlled contact has agreed to continue transmitting under our direction. The channel can expose authentic habits, carry false plans, and test which foreign desks react."
chaosx.nr11.16.a: "Feed it carefully."
chaosx.nr11.18.t: "Traffic after Midnight"
chaosx.nr11.18.d: "Fresh diplomatic traffic has followed a discreet invitation sent somewhere beyond our confirmed leads. The response remains concealed. The network's attempt to widen its reach has left another pattern to study."
chaosx.nr11.18.a: "Add it to the board."
chaosx.nr11.19.t: "A Heavier Hand"
chaosx.nr11.19.d: "The latest intercepts use military ciphers, long-range logistics estimates, and language associated with a government able to underwrite a wider campaign. Whether the approach succeeded remains uncertain."
chaosx.nr11.19.a: "Find the patron before the patron finds us."
chaosx.nr11.20.t: "An Offer without Letterhead"
chaosx.nr11.20.d: "Trusted intermediaries propose confidential coordination against [secret_alliance_target.GetNameDef]. They promise shared intelligence, protected channels, and a place in any future settlement. Acceptance would bind us to an arrangement whose other participants remain undisclosed."
chaosx.nr11.20.a: "Join and define our private terms."
chaosx.nr11.20.f: "Join only if our existing private demand is honored."
chaosx.nr11.20.b: "Refuse and close the channel."
chaosx.nr11.20.c: "Refuse, then leak enough to frighten them."
chaosx.nr11.20.e: "Expose the approach to [secret_alliance_target.GetNameDef]."
chaosx.nr11.21.t: "Shots at the Cabinet Motorcade"
chaosx.nr11.21.d: "Gunfire tears through the cabinet motorcade after its route is changed by a forged security order. The ministers survive. Captured weapons, safe houses, and transport records show a disciplined foreign-backed attempt to kill the government leadership. The surviving cell is already dispersing."
chaosx.nr11.21.a: "Seal the capital and hunt the surviving cell."
chaosx.nr11.21.a.tt: "Spend Command Power to contain the attempt, recover part of the immediate Stability shock, expose operational traces, and begin the National Manhunt even if ordinary investigation capacity is already committed. A guarded cabinet reduces the initial shock."
chaosx.nr11.21.b: "Preserve the government and absorb the shock."
chaosx.nr11.21.b.tt: "The attack inflicts further Stability and War Support losses. The foreign planners gain a major operational success and retain compromised access."

# Settlements and public news
chaosx.nr11.191.t: "The Coalition Comes Apart"
chaosx.nr11.191.d: "Capitals that once accepted a common timetable now issue separate denials and recall their missions. Conflicting promises, abandoned timetables, and withdrawals have left no government able to command the coalition."
chaosx.nr11.191.a: "Their unity was never permanent."
chaosx.nr11.192.t: "The Coalition Dictates the Peace"
chaosx.nr11.192.d: "The campaign against us has ended on terms written by the coalition. Its members divide political guarantees, military restrictions, and rewards according to the commitments they carried into the war."
chaosx.nr11.192.a: "We will remember every signature."
chaosx.nr11.193.t: "Separate Terms Become a Settlement"
chaosx.nr11.193.d: "Withdrawals and private negotiations have ended the coalition war without a common victory. Several participants keep guarantees or concessions. The rest leave with nothing beyond the cost of their mobilization."
chaosx.nr11.193.a: "The table is divided."
chaosx.nr11.194.t: "The Meetings Stop"
chaosx.nr11.194.d: "The suspicious traffic has thinned, intermediaries have disappeared, and the remaining channels no longer answer one another. The concealed arrangement has collapsed before it could take a public form."
chaosx.nr11.194.a: "Publish the case we can prove."
chaosx.nr11.194.a.tt: "Release the surviving dossier. Identified participants suffer mutual diplomatic damage. The strength of the preserved Evidence determines the Political Power return and the gain in War Support."
chaosx.nr11.194.b: "Seal the files."
chaosx.nr11.194.b.tt: "Keep the failed network secret and recover political control and Stability."
chaosx.nr11.194.c: "Clear the innocent names."
chaosx.nr11.194.c.tt: "Repair relations with surviving suspects cleared of pact involvement and recover some Stability."
chaosx.nr11.194.e: "Keep the methods and seal the accusations."
chaosx.nr11.194.e.tt: "Retain a counterintelligence benefit whose duration scales with preserved Preparedness, for as long as two years."
chaosx.nr11.195.t: "Sponsors without Followers"
chaosx.nr11.195.d: "The coalition's leading governments survived the war. Their rival commands and incompatible promises destroyed the authority of the common pact. Its former members now bargain alone."
chaosx.nr11.195.a: "Power could not substitute for agreement."
chaosx.nr11.196.t: "A Bloc Remains"
chaosx.nr11.196.d: "The war has ended. The coalition's surviving containment members retain liaison offices, guarantees, and a regional security council. Their public pact continues with narrower aims."
chaosx.nr11.196.a: "The frontier will remain political."
chaosx.nr11.197.t: "The Victors Close the Secretariat"
chaosx.nr11.197.d: "The coalition imposed its terms. Its common machinery has outlived the purpose its members accepted. Guarantees and restrictions remain in the peace as liaison offices close and national delegations return home."
chaosx.nr11.197.a: "Their victory did not make them permanent."
chaosx.nr11.198.t: "The Spoils Break the Table"
chaosx.nr11.198.d: "Victory exposed promises that could not all be honored. Sponsors contest leadership, smaller members defend incompatible claims, and the public coalition separates into national bargains before it can become a lasting bloc."
chaosx.nr11.198.a: "They found an enemy and lost the peace."

secret_alliance_retained_counterintelligence: "Lessons of the Empty Chairs"
secret_alliance_retained_counterintelligence_desc: "The collapsed network left behind route maps, source-handling lessons, and a clearer picture of how foreign services concealed common work. The files will remain useful for a limited time."
chaosx.nr11.200.t: "Secret Coalition Declares Its Pact"
chaosx.nr11.200.d: "[secret_alliance_presentation_leader.GetNameDefCap] has publicly announced [GetSecretAlliancePresentationFactionName] against [secret_alliance_presentation_target.GetNameDef]. Governments once connected only by unexplained incidents now exchange military missions and recognize a common command."
chaosx.nr11.200.a: "The hidden commitments have names."
chaosx.nr11.201.t: "The Coalition at Its Limit"
chaosx.nr11.201.d: "Every eligible government that can safely answer the call has been included. The coalition reached [?secret_alliance_scenario_achieved_members|0] members, including [?secret_alliance_scenario_achieved_majors|0] major powers. No additional valid government existed within the selected scenario rules. This achieved composition remains eligible for the maximum-intensity challenge."
chaosx.nr11.201.a: "Then this is the whole ring."

