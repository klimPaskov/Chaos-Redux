# Super-event 111
chaosx_super_event.111.t: "The Pact Made Public"
chaosx_super_event.111.q: "\"No Treaty of Peace Shall Be Held Valid in Which There Is Tacitly Reserved Matter for a Future War\"\n- Immanuel Kant, Perpetual Peace"
chaosx_super_event.111.a: "Openly arrived at."
chaosx_super_event.111.d: "The hidden pact has crossed from rumor into war. Its signatories no longer pretend their timetables, credit lines, and courier routes were coincidences. A private reservation for future war has become a public front."

# Event log and evolutions
