independence_wave_ambition_american_caribbean: "Survey the American-Caribbean Settlement"
independence_wave_power_first_civilian: "Entrench Civilian Authority"
independence_wave_power_first_central: "Strengthen the Central Ministries"
independence_wave_power_first_traditional: "Uphold Traditional Authority"
independence_wave_power_first_cabinet: "Defend the Domestic Cabinet"
independence_wave_power_first_labor: "Empower the Labor Councils"
independence_wave_power_first_internationalist: "Commit to League Internationalism"
independence_wave_power_first_court: "Restore Court Authority"
independence_wave_power_second_army: "Grant the Army Autonomy"
independence_wave_power_second_provincial: "Guarantee Provincial Power"
independence_wave_power_second_assembly: "Entrench the Assembly"
independence_wave_power_second_patron: "Admit Patron Supervision"
independence_wave_power_second_ministries: "Entrench the Ministries"
independence_wave_power_second_isolationist: "Defend National Isolation"
independence_wave_power_second_guardians: "Empower the Military Guardians"

independence_wave_prepare_capital_administration: "Prepare the Capital Administration"
independence_wave_prepare_capital_administration_desc: "The capital must function before it can command. Clerks, guards, and emergency offices will give the state a working center."
independence_wave_prepare_capital_administration_tt: "Improves state capacity and security while reducing instability."
independence_wave_name_provisional_authority: "Name the Provisional Authority"
independence_wave_name_provisional_authority_desc: "A government without a name invites every rival committee to claim the state."
independence_wave_name_provisional_authority_tt: "Strengthens legitimacy and establishes the provisional authority."
independence_wave_inventory_the_state: "Inventory the State"
independence_wave_inventory_the_state_desc: "Treasuries, depots, workshops, and records must be counted before they can be governed."
independence_wave_inventory_the_state_tt: "Strengthens administrative capacity and identifies the inherited state apparatus."
independence_wave_bind_the_first_oath: "Bind the First Oath"
independence_wave_bind_the_first_oath_desc: "Officials and armed formations will swear to the new state rather than to vanished commands."
independence_wave_bind_the_first_oath_tt: "Improves legitimacy and security and reduces instability."
independence_wave_establish_permanent_ministries: "Establish Permanent Ministries"
independence_wave_establish_permanent_ministries_desc: "Emergency offices will become ministries with stable jurisdictions and accountable records."
independence_wave_establish_permanent_ministries_tt: "Substantially improves state capacity and adds administrative stability."
independence_wave_restore_regional_communications: "Restore Regional Communications"
independence_wave_restore_regional_communications_desc: "Provincial authorities cannot obey orders that never reach them."
independence_wave_restore_regional_communications_tt: "Improves capacity and restores infrastructure in the founding region."
independence_wave_integrate_provinces_and_councils: "Integrate Provinces and Councils"
independence_wave_integrate_provinces_and_councils_desc: "Local bodies will be bound into a common hierarchy without erasing the sources of our legitimacy."
independence_wave_integrate_provinces_and_councils_tt: "Improves legitimacy, capacity, and public stability."
independence_wave_complete_founding_settlement: "Complete the Founding Settlement"
independence_wave_complete_founding_settlement_desc: "With the capital secured and the first administration functioning, the provisional state can declare its founding phase complete."
independence_wave_complete_founding_settlement_tt: "Completes the founding phase and opens a permanent government settlement, former-host policy, and wider state-building program."

independence_wave_map_internal_power_centers: "Map the Two Centers of Power"
independence_wave_map_internal_power_centers_desc: "This country's founding coalition contains two credible centers of authority. Their rivalry must be made legible before it tears through the government."
independence_wave_map_internal_power_centers_tt: "Reveals the country's two credible centers of authority and opens a settlement between them."
independence_wave_favor_first_power_center: "[ROOT.GetIndependenceWaveFirstPowerCenterFocusTitle]"
independence_wave_favor_first_power_center_desc: "One side of the founding coalition will receive the institutions needed to dominate the settlement."
independence_wave_favor_first_power_center_tt: "Shifts the internal balance toward the first center of authority and makes its predominance durable."
independence_wave_broker_internal_power_compromise: "Broker an Internal Compromise"
independence_wave_broker_internal_power_compromise_desc: "Neither center can govern securely by destroying the other. A written division of authority may preserve both."
independence_wave_broker_internal_power_compromise_tt: "Settles the internal balance at the midpoint and substantially reduces instability."
independence_wave_favor_second_power_center: "[ROOT.GetIndependenceWaveSecondPowerCenterFocusTitle]"
independence_wave_favor_second_power_center_desc: "The rival side of the founding coalition will receive the institutions needed to dominate the settlement."
independence_wave_favor_second_power_center_tt: "Shifts the internal balance toward the second center of authority and makes its predominance durable."

independence_wave_establish_emergency_revenue: "Establish Emergency Revenue"
independence_wave_establish_emergency_revenue_desc: "A modest and legible revenue system is worth more than arbitrary seizures that destroy confidence."
independence_wave_establish_emergency_revenue_tt: "Improves administrative capacity and stabilizes the public economy."
independence_wave_secure_food_and_fuel: "Secure Food and Fuel"
independence_wave_secure_food_and_fuel_desc: "The state will coordinate essential stocks before shortages become a second rebellion."
independence_wave_secure_food_and_fuel_tt: "Adds fuel reserves and improves capacity and stability."
independence_wave_build_regional_transport_authority: "[ROOT.GetIndependenceWaveTransportFocusTitle]"
independence_wave_build_regional_transport_authority_desc: "Our geography decides which roads, rails, ports, rivers, and corridors can hold the country together."
independence_wave_build_regional_transport_authority_tt: "Builds infrastructure in the administrative heartland and establishes a transport program suited to the region."
independence_wave_establish_customs_service: "Establish the Customs Service"
independence_wave_establish_customs_service_desc: "Recognized borders require officials who can regulate what crosses them."
independence_wave_establish_customs_service_tt: "Improves recognition and capacity and establishes the customs service."
independence_wave_activate_package_economic_program: "[ROOT.GetIndependenceWaveEconomicProgramFocusTitle]"
independence_wave_activate_package_economic_program_desc: "The economic program will follow the actual settlements, industries, routes, and terrain inherited by this state."
independence_wave_activate_package_economic_program_tt: "Builds a concrete economic program around the country's inherited settlements, industries, routes, and terrain."
independence_wave_create_independent_treasury: "Create an Independent Treasury"
independence_wave_create_independent_treasury_desc: "A sovereign budget must answer to our institutions rather than to the remnants of the former host."
independence_wave_create_independent_treasury_tt: "Establishes an independent treasury, improves capacity and stability, and unlocks a repeatable treasury-backed public-works programme when the capital and strategic budget can support it."

independence_wave_integrate_militia_commands: "Integrate Militia Commands"
independence_wave_integrate_militia_commands_desc: "Local defenders must share orders, supply, and a lawful chain of command."
independence_wave_integrate_militia_commands_tt: "Adds army experience and improves national security."
independence_wave_secure_national_depots: "Secure National Depots"
independence_wave_secure_national_depots_desc: "Weapons scattered among rival committees cannot defend a state."
independence_wave_secure_national_depots_tt: "Adds infantry and support equipment and improves security."
independence_wave_recall_and_vet_officers: "Recall and Vet Officers"
independence_wave_recall_and_vet_officers_desc: "Experienced officers will be welcomed, but their loyalties and wartime conduct will be examined."
independence_wave_recall_and_vet_officers_tt: "Adds command power and army experience while strengthening the chain of command."
independence_wave_form_border_guard: "Form the Border Guard"
independence_wave_form_border_guard_desc: "A visible frontier service turns a line on a proclamation into governed territory."
independence_wave_form_border_guard_tt: "Improves security, provides infantry equipment, and establishes the border guard."
independence_wave_adopt_military_archetype_program: "[ROOT.GetIndependenceWaveMilitaryProgramFocusTitle]"
independence_wave_adopt_military_archetype_program_desc: "Our defense system will be built around the personnel, terrain, coastlines, and military inheritance that actually exist."
independence_wave_adopt_military_archetype_program_tt: "Builds equipment, training, and command institutions around the country's actual starting forces."
independence_wave_found_professional_defense_institution: "Found the Professional Defense Institution"
independence_wave_found_professional_defense_institution_desc: "Doctrine, training, and civilian authority will outlast the improvised commands of independence."
independence_wave_found_professional_defense_institution_tt: "Establishes a durable defense institution, opens continuing professionalization measures, and grants a doctrine reduction."
independence_wave_confirm_civilian_control: "Confirm Civilian Control"
independence_wave_confirm_civilian_control_desc: "The armed forces will answer to lawful civilian institutions even when emergency conditions persist."
independence_wave_confirm_civilian_control_tt: "Chooses civilian control over military autonomy and strengthens the public settlement."
independence_wave_grant_military_autonomy: "Grant Military Autonomy"
independence_wave_grant_military_autonomy_desc: "Operational command will be insulated from unstable ministries so the army can respond without delay."
independence_wave_grant_military_autonomy_tt: "Chooses military autonomy over civilian control and grants army experience and security."
independence_wave_raise_mass_reserve: "Raise a Mass Reserve"
independence_wave_raise_mass_reserve_desc: "A broad territorial reserve will make the country's limited equipment serve a much larger defense."
independence_wave_raise_mass_reserve_tt: "Chooses mass mobilization over a small professional core and provides infantry equipment."
independence_wave_build_professional_core: "Build a Professional Core"
independence_wave_build_professional_core_desc: "A smaller cadre of trained officers and regulars will preserve standards through future mobilizations."
independence_wave_build_professional_core_tt: "Chooses a professional core over mass mobilization and grants army experience and command power."
independence_wave_fund_domestic_arsenals: "Fund Domestic Arsenals"
independence_wave_fund_domestic_arsenals_desc: "The state will accept a slower buildup in exchange for control over its own sources of arms."
independence_wave_fund_domestic_arsenals_tt: "Chooses domestic production over foreign arms and grants an infantry weapons research bonus."
independence_wave_accept_foreign_arms: "Accept Foreign Arms"
independence_wave_accept_foreign_arms_desc: "Patron channels can fill our depots quickly, though every shipment adds another diplomatic obligation."
independence_wave_accept_foreign_arms_tt: "Chooses foreign supply over domestic arsenals and provides infantry and support equipment."
independence_wave_adopt_border_defense: "Adopt Border Defense"
independence_wave_adopt_border_defense_desc: "Fortified centers, controlled crossings, and prepared reserves will deny the former host an easy return."
independence_wave_adopt_border_defense_tt: "Chooses defensive border doctrine over reclamation and fortifies the capital."
independence_wave_adopt_reclamation_doctrine: "Adopt Reclamation Doctrine"
independence_wave_adopt_reclamation_doctrine_desc: "The army will prepare to enforce unsettled claims rather than wait behind the founding frontier."
independence_wave_adopt_reclamation_doctrine_tt: "Chooses reclamation over defensive border doctrine and grants army experience and ambition."
independence_wave_standardize_with_league: "Standardize with the League"
independence_wave_standardize_with_league_desc: "Shared training and doctrine can make the independence network's small armies function as one defense."
independence_wave_standardize_with_league_tt: "Chooses league standardization over independent command and grants network and doctrine benefits."
independence_wave_preserve_independent_command: "Preserve Independent Command"
independence_wave_preserve_independent_command_desc: "No external council will decide how the country's forces are organized or employed."
independence_wave_preserve_independent_command_tt: "Chooses independent command over league standardization and grants command power and stability."

independence_wave_establish_foreign_office: "Establish the Foreign Office"
independence_wave_establish_foreign_office_desc: "Recognition begins with officials able to speak consistently in the name of the state."
independence_wave_establish_foreign_office_tt: "Improves recognition and administrative capacity."
independence_wave_send_first_missions: "Send the First Missions"
independence_wave_send_first_missions_desc: "Delegations will carry our case to neighbors, patrons, and distant capitals."
independence_wave_send_first_missions_tt: "Improves recognition and establishes the first diplomatic missions."
independence_wave_seek_neighbor_recognition: "Seek Neighbor Recognition"
independence_wave_seek_neighbor_recognition_desc: "Recognition from those who share our borders gives every later treaty greater weight."
independence_wave_seek_neighbor_recognition_tt: "Improves recognition and independence network standing."
independence_wave_declare_entrenched_neutrality: "Declare Entrenched Neutrality"
independence_wave_declare_entrenched_neutrality_desc: "We will survive by denying every patron an exclusive claim upon our future."
independence_wave_declare_entrenched_neutrality_tt: "Strengthens legitimacy and stability while keeping the patron-client route closed."
independence_wave_balance_the_first_patrons: "Balance the First Patrons"
independence_wave_balance_the_first_patrons_desc: "Competing foreign offers can preserve room for decision if none becomes indispensable."
independence_wave_balance_the_first_patrons_tt: "Strengthens the public settlement and supports patron-balancing choices without committing to one guarantor."
independence_wave_become_treaty_backed_state: "Become a Treaty-Backed State"
independence_wave_become_treaty_backed_state_desc: "A network of written understandings will give our independence a life beyond the founding proclamation."
independence_wave_become_treaty_backed_state_tt: "Substantially improves recognition and establishes treaty-backed statehood."
independence_wave_focus_build_permanent_foreign_service: "Build the Permanent Foreign Service"
independence_wave_focus_build_permanent_foreign_service_desc: "Career diplomats and stable archives will preserve policy through every change of ministry."
independence_wave_build_permanent_foreign_service_tt: "Establishes a permanent diplomatic service and opens continuing foreign-service measures."

independence_wave_prepare_first_assembly: "Prepare the First Assembly"
independence_wave_prepare_first_assembly_desc: "Delegates must be chosen and protected before they can give the state a constitution."
independence_wave_prepare_first_assembly_tt: "Makes it possible to convene the First Assembly and improves administrative capacity."
independence_wave_ratify_constitution: "Ratify the Constitution"
independence_wave_ratify_constitution_desc: "The assembly's settlement will bind executive power, provinces, and citizens beneath one law."
independence_wave_ratify_constitution_tt: "Commits the country to the Constitutional Republic route and closes every rival government settlement."
independence_wave_define_equal_citizenship: "Define Equal Citizenship"
independence_wave_define_equal_citizenship_desc: "The state will recognize citizens by law rather than by their place in the former host."
independence_wave_define_equal_citizenship_tt: "Improves legitimacy, recognition, and stability."
independence_wave_limit_emergency_powers: "Limit Emergency Powers"
independence_wave_limit_emergency_powers_desc: "Authorities created for the independence crisis must return their powers to constitutional institutions."
independence_wave_limit_emergency_powers_tt: "Substantially reduces instability and strengthens constitutional administration."
independence_wave_consolidate_constitutional_state: "Consolidate the Constitutional State"
independence_wave_consolidate_constitutional_state_desc: "Courts, ministries, and elected institutions will make the constitutional settlement durable."
independence_wave_consolidate_constitutional_state_tt: "Completes the Constitutional Republic settlement and grants a major statehood improvement."
independence_wave_organize_popular_councils: "Organize the Popular Councils"
independence_wave_organize_popular_councils_desc: "Local councils that carried the independence struggle will become the organs of a common state."
independence_wave_organize_popular_councils_tt: "Commits the country to the Popular Council route and closes every rival government settlement."
independence_wave_build_cooperative_administration: "Build Cooperative Administration"
independence_wave_build_cooperative_administration_desc: "Public offices and cooperative bodies will share the work of provision, records, and local rule."
independence_wave_build_cooperative_administration_tt: "Improves capacity, legitimacy, and stability."
independence_wave_arm_public_guard: "Arm the Public Guard"
independence_wave_arm_public_guard_desc: "The councils will defend the settlement through a disciplined guard answerable to public authority."
independence_wave_arm_public_guard_tt: "Provides infantry equipment and army experience and improves security."
independence_wave_proclaim_council_commonwealth: "Proclaim the Council Commonwealth"
independence_wave_proclaim_council_commonwealth_desc: "The councils will enter a permanent compact as the sovereign institutions of the country."
independence_wave_proclaim_council_commonwealth_tt: "Completes the Popular Council settlement and grants a major statehood improvement."
independence_wave_prepare_traditional_confirmation: "Prepare Traditional Confirmation"
independence_wave_prepare_traditional_confirmation_desc: "Customary authorities and regional notables will be summoned to test a claim of legitimate continuity."
independence_wave_prepare_traditional_confirmation_tt: "Makes it possible to confirm Traditional Authority and improves administrative capacity."
independence_wave_restore_legitimate_authority: "Restore Legitimate Authority"
independence_wave_restore_legitimate_authority_desc: "A recognized house, council of elders, or customary office will embody the state's lawful continuity."
independence_wave_restore_legitimate_authority_tt: "Commits the country to the Traditional Restoration route and closes every rival government settlement."
independence_wave_bind_court_and_ministries: "Bind Court and Ministries"
independence_wave_bind_court_and_ministries_desc: "Restored authority must govern through durable offices rather than private favor."
independence_wave_bind_court_and_ministries_tt: "Substantially improves administrative capacity and reduces instability."
independence_wave_recruit_regional_notables: "Recruit Regional Notables"
independence_wave_recruit_regional_notables_desc: "Local authority will be drawn into the state through service, obligation, and visible honors."
independence_wave_recruit_regional_notables_tt: "Improves legitimacy, public stability, and regional integration."
independence_wave_crown_the_restored_state: "Crown the Restored State"
independence_wave_crown_the_restored_state_desc: "Ritual and administration will together make the restored settlement a living state."
independence_wave_crown_the_restored_state_tt: "Completes the Traditional Restoration settlement and grants a major statehood improvement."
independence_wave_establish_emergency_command: "Establish Emergency Command"
independence_wave_establish_emergency_command_desc: "When institutions cannot secure the country, a unified command will hold the frontier and the capital."
independence_wave_establish_emergency_command_tt: "Commits the country to the Emergency Military route and closes every rival government settlement."
independence_wave_subordinate_militias: "Subordinate the Militias"
independence_wave_subordinate_militias_desc: "Independent formations will enter a national chain of command or surrender their arms."
independence_wave_subordinate_militias_tt: "Adds army experience and command power and substantially improves security."
independence_wave_build_military_economy: "Build the Military Economy"
independence_wave_build_military_economy_desc: "The emergency state will ensure that its anchor region can sustain arms production."
independence_wave_build_military_economy_tt: "Adds an arms factory and building capacity in the administrative heartland and improves state capacity."
independence_wave_entrench_emergency_state: "Entrench the Emergency State"
independence_wave_entrench_emergency_state_desc: "Command institutions will become the permanent skeleton of government."
independence_wave_entrench_emergency_state_tt: "Completes the Emergency Military settlement and grants a major statehood improvement."
independence_wave_open_guarantor_talks: "Open Guarantor Talks"
independence_wave_open_guarantor_talks_desc: "A patron may secure the state faster than our institutions can mature, but the bargain will define our sovereignty."
independence_wave_open_guarantor_talks_tt: "Opens a binding guarantor settlement and improves recognition."
independence_wave_accept_protected_future: "Accept a Protected Future"
independence_wave_accept_protected_future_desc: "The guarantor settlement has been chosen. We will build institutions inside its limits."
independence_wave_accept_protected_future_tt: "Confirms the Patron-Client settlement and closes every rival government route."
independence_wave_accept_advisers_and_credits: "Accept Advisers and Credits"
independence_wave_accept_advisers_and_credits_desc: "Foreign expertise and finance will accelerate construction while deepening the patron's place in our affairs."
independence_wave_accept_advisers_and_credits_tt: "Improves recognition, capacity, and security and grants an industry research bonus."
independence_wave_become_loyal_guarantor_state: "Become a Loyal Guarantor State"
independence_wave_become_loyal_guarantor_state_desc: "Reliability toward the guarantor will become the foundation of policy and security."
independence_wave_become_loyal_guarantor_state_tt: "Completes the Patron-Client settlement as a loyal guarantor state."
independence_wave_become_bargaining_client: "Become a Bargaining Client"
independence_wave_become_bargaining_client_desc: "The guarantee will be honored, but every concession must purchase room for independent action."
independence_wave_become_bargaining_client_tt: "Completes the Patron-Client settlement with greater domestic capacity and bargaining room."
independence_wave_reject_inherited_borders: "Reject Inherited Borders"
independence_wave_reject_inherited_borders_desc: "The partition left by the former order cannot bind a sovereignty born from its collapse."
independence_wave_reject_inherited_borders_tt: "Commits the country to Radical Sovereignty and closes every rival government settlement."
independence_wave_mobilize_founding_myth: "Mobilize the Founding Myth"
independence_wave_mobilize_founding_myth_desc: "The story of rupture will become a call to remake every frontier that denies our community."
independence_wave_mobilize_founding_myth_tt: "Raises war support and increases legitimacy, security, and instability."
independence_wave_arm_aligned_movements: "Arm Aligned Movements"
independence_wave_arm_aligned_movements_desc: "Those beyond our borders who share the founding cause will receive weapons and organization."
independence_wave_arm_aligned_movements_tt: "Provides infantry equipment and army experience and deepens radical mobilization."
independence_wave_proclaim_radical_sovereignty: "Proclaim Radical Sovereignty"
independence_wave_proclaim_radical_sovereignty_desc: "Our sovereignty will be measured by what it can overturn, not by what the old order is willing to recognize."
independence_wave_proclaim_radical_sovereignty_tt: "Completes the Radical Sovereignty settlement and prepares high-chaos ambitions."

independence_wave_define_former_host_policy: "Define Former-Host Policy"
independence_wave_define_former_host_policy_desc: "Property, citizens, borders, obligations, and fear still bind us to the state from which we emerged."
independence_wave_define_former_host_policy_tt: "Opens the former-host settlements that fit the country's claims, institutions, and surviving relationship."
independence_wave_open_separation_talks: "Open Separation Talks"
independence_wave_open_separation_talks_desc: "Negotiators will turn the facts of independence into a settlement both sides can administer."
independence_wave_open_separation_talks_tt: "Chooses negotiated separation and improves relations with the former host across every unsettled issue."
independence_wave_settle_property_and_citizenship: "Settle Property and Citizenship"
independence_wave_settle_property_and_citizenship_desc: "Families, assets, pensions, and public records must not remain hostages to an unsettled frontier."
independence_wave_settle_property_and_citizenship_tt: "Reduces property, population, obligation, and hostility disputes with the former host."
independence_wave_recognize_the_frontier: "Recognize the Frontier"
independence_wave_recognize_the_frontier_desc: "Mutual recognition of the frontier will close the founding quarrel without erasing every future disagreement."
independence_wave_recognize_the_frontier_tt: "Commits both states to Recognized Separation and settles former-host policy."
independence_wave_fortify_former_host_frontier: "Fortify the Former-Host Frontier"
independence_wave_fortify_former_host_frontier_desc: "Negotiations mean little while the former host can cross an undefended line at will."
independence_wave_fortify_former_host_frontier_tt: "Chooses a guarded frontier, fortifies the capital, and improves security and border control."
independence_wave_establish_armed_coexistence: "Establish Armed Coexistence"
independence_wave_establish_armed_coexistence_desc: "A defended border and controlled channels can contain hostility without pretending it has vanished."
independence_wave_establish_armed_coexistence_tt: "Commits both states to Guarded Coexistence and settles former-host policy."
independence_wave_convene_association_conference: "Convene an Association Conference"
independence_wave_convene_association_conference_desc: "A voluntary association may preserve useful ties without restoring the former hierarchy."
independence_wave_convene_association_conference_tt: "Chooses voluntary association and reduces hostility, obligations, and reconquest fear."
independence_wave_submit_union_question: "Submit the Union Question"
independence_wave_submit_union_question_desc: "The proposed association will be placed before the institutions that must live beneath it."
independence_wave_submit_union_question_tt: "Commits the state to an Autonomy Offer and settles former-host policy."
independence_wave_document_unsettled_claims: "Document Unsettled Claims"
independence_wave_document_unsettled_claims_desc: "Maps, petitions, and wartime records will define what we believe the separation left unresolved."
independence_wave_document_unsettled_claims_tt: "Chooses reclamation and increases claim pressure on the former host."
independence_wave_prepare_reclamation_command: "Prepare the Reclamation Command"
independence_wave_prepare_reclamation_command_desc: "Diplomatic demands require a command structure able to survive their failure."
independence_wave_prepare_reclamation_command_tt: "Opens measures to force recognition, adds army experience, and increases pressure on the former host."
independence_wave_demand_recognition_or_conflict: "Demand Recognition or Conflict"
independence_wave_demand_recognition_or_conflict_desc: "The former host must accept our claims or answer for them at the frontier."
independence_wave_demand_recognition_or_conflict_tt: "Commits the state to Reclamation Conflict and settles former-host policy."
independence_wave_inherit_successor_ledger: "Inherit the Successor Ledger"
independence_wave_inherit_successor_ledger_desc: "The former host has ceased to function, leaving records and obligations without an answering government."
independence_wave_inherit_successor_ledger_tt: "Chooses the host-collapse settlement and strengthens the administration."
independence_wave_settle_empty_claim: "Settle the Empty Claim"
independence_wave_settle_empty_claim_desc: "We will close claims that no living former host can negotiate and govern the consequences ourselves."
independence_wave_settle_empty_claim_tt: "Recognizes Host Collapse and settles former-host policy without a living counterpart."

independence_wave_survey_regional_ambition: "[ROOT.GetIndependenceWaveAmbitionFocusTitle]"
independence_wave_survey_regional_ambition_desc: "Our regional history and geography define ambitions more precisely than a universal list of claims ever could."
independence_wave_survey_regional_ambition_tt: "Opens the country's regional ambition and border measures. In World Collapse, this can begin before recognition and exerts stronger pressure."
independence_wave_support_local_committees: "Support Local Committees"
independence_wave_support_local_committees_desc: "Friendly civic bodies across the regional space can turn cultural affinity into organized political support."
independence_wave_support_local_committees_tt: "Improves legitimacy, recognition, capacity, and security while increasing ambition pressure."
independence_wave_call_regional_congress: "Call a Regional Congress"
independence_wave_call_regional_congress_desc: "Delegates from the claimed political space will define the principles of any wider settlement."
independence_wave_call_regional_congress_tt: "Establishes the regional congress and improves diplomatic recognition."
independence_wave_build_postwar_integration_authority: "Build the Integration Authority"
independence_wave_build_postwar_integration_authority_desc: "Future territorial change must have administrators ready to integrate services, records, and representation."
independence_wave_build_postwar_integration_authority_tt: "Establishes the postwar integration authority and substantially improves capacity."
independence_wave_open_signature_extension: "Claim a Distinct National Purpose"
independence_wave_open_signature_extension_desc: "Beyond the common work of survival, our history offers an institution, ambition, or political cause that belongs to this country alone."
independence_wave_open_signature_extension_tt: "Opens the country's distinctive national program."

independence_wave_recognize_fellow_new_states: "Recognize Fellow New States"
independence_wave_recognize_fellow_new_states_desc: "Mutual recognition among the new states gives each of us a stronger defense against diplomatic erasure."
independence_wave_recognize_fellow_new_states_tt: "Improves recognition, independence network standing, league cohesion, common cause, reserves, and confidence."
independence_wave_exchange_civil_servants: "Exchange Civil Servants"
independence_wave_exchange_civil_servants_desc: "Officials who solved one founding crisis can carry their methods to another new administration."
independence_wave_exchange_civil_servants_tt: "Improves network cooperation, capacity, and industry research."
independence_wave_establish_aid_corridor: "Establish an Aid Corridor"
independence_wave_establish_aid_corridor_desc: "A working route for food, fuel, and matériel will make solidarity visible in every member capital."
independence_wave_establish_aid_corridor_tt: "Builds infrastructure in the administrative heartland and improves network and league cooperation."
independence_wave_propose_network_arbitration: "Propose Network Arbitration"
independence_wave_propose_network_arbitration_desc: "New states should settle disputes before former hosts and patrons turn them into weapons."
independence_wave_propose_network_arbitration_tt: "Substantially improves network standing and strengthens the public settlement."
independence_wave_draft_league_charter: "Draft the League Charter"
independence_wave_draft_league_charter_desc: "An informal network can endure only if its members define the obligations they are willing to share."
independence_wave_draft_league_charter_tt: "Opens regional conferences, registers the founder, and advances league cooperation."
independence_wave_gather_founding_members: "Gather the Founding Members"
independence_wave_gather_founding_members_desc: "States willing to bind themselves to the charter will be brought into one preparatory congress."
independence_wave_gather_founding_members_tt: "Completes congress preparation when the league state machine permits it."
independence_wave_convene_league_congress: "Convene the League Congress"
independence_wave_convene_league_congress_desc: "The prepared members will assemble to choose whether the network becomes an institution."
independence_wave_convene_league_congress_tt: "Opens the League Congress and allows the country to place a charter proposal before the founders."
independence_wave_propose_defensive_congress: "Propose a Defensive Congress"
independence_wave_propose_defensive_congress_desc: "The league should first guarantee that no new state faces reconquest alone."
independence_wave_propose_defensive_congress_tt: "Publishes the Defensive Congress proposal and improves cohesion, common cause, reserves, and confidence."
independence_wave_propose_development_compact: "Propose a Development Compact"
independence_wave_propose_development_compact_desc: "Shared infrastructure, credit, and technical assistance can make independence materially durable."
independence_wave_propose_development_compact_tt: "Publishes the Development Compact proposal and substantially increases shared reserves and confidence."
independence_wave_propose_sovereign_equality: "Propose Sovereign Equality"
independence_wave_propose_sovereign_equality_desc: "Every member, regardless of size or patron, must possess an equal voice in the league."
independence_wave_propose_sovereign_equality_tt: "Publishes the Sovereign Equality proposal and reduces patron capture while improving cohesion and confidence."
independence_wave_propose_armed_liberation: "Propose Armed Liberation"
independence_wave_propose_armed_liberation_desc: "The league should defend not only existing members but communities still denied a sovereign settlement."
independence_wave_propose_armed_liberation_tt: "Publishes the Armed Liberation proposal, raises war support, and increases revisionist pressure."
independence_wave_propose_revisionist_charter: "Propose a Revisionist Charter"
independence_wave_propose_revisionist_charter_desc: "In a collapsing world, the league can become an instrument for rewriting the inherited map."
independence_wave_propose_revisionist_charter_tt: "Publishes the Radical Revisionist proposal and increases high-chaos league pressure."

independence_wave_focus_discover_regional_identity: "Discover the Regional Identity"
independence_wave_focus_discover_regional_identity_desc: "A wider political identity must be documented before it can become a legitimate union."
independence_wave_discover_regional_identity_tt: "Opens the country's historically grounded regional union."
independence_wave_prepare_union_congress: "Prepare the Union Congress"
independence_wave_prepare_union_congress_desc: "Delegates, rules, and representation will be agreed before the union question reaches a vote."
independence_wave_prepare_union_congress_tt: "Prepares the regional union congress and improves recognition."
independence_wave_write_formation_terms: "Write the Formation Terms"
independence_wave_write_formation_terms_desc: "The future union requires a clear division of rights, debts, representation, and administrative authority."
independence_wave_write_formation_terms_tt: "Records the formation terms and strengthens the public settlement."
independence_wave_establish_integration_commission: "Establish the Integration Commission"
independence_wave_establish_integration_commission_desc: "A permanent commission will prepare the administrative work required to establish the wider union."
independence_wave_establish_integration_commission_tt: "Completes preparations for regional integration and substantially improves capacity."

independence_wave_sponsor_further_ruptures: "Sponsor Further Ruptures"
independence_wave_sponsor_further_ruptures_desc: "The wave of independence need not end at our frontier. We can give its next claimants organization and purpose."
independence_wave_sponsor_further_ruptures_tt: "Permits direct support for further ruptures and adds revisionist pressure. In World Collapse, this does not require a Radical Sovereignty government."
independence_wave_focus_coordinate_reclamation_fronts: "Coordinate Reclamation Fronts"
independence_wave_focus_coordinate_reclamation_fronts_desc: "Separate border movements will receive common matériel, doctrine, and political direction."
independence_wave_coordinate_reclamation_fronts_tt: "Authorizes the paid Coordinate Reclamation Fronts mission. Provides equipment and army experience and adds revisionist pressure. World Collapse makes that pressure substantially stronger."
independence_wave_proclaim_open_sovereignty: "Proclaim Open Sovereignty"
independence_wave_proclaim_open_sovereignty_desc: "Any community able to sustain self-rule may appeal to a sovereignty that refuses inherited partitions."
independence_wave_proclaim_open_sovereignty_tt: "Raises war support, strengthens ambition, and adds revisionist pressure."
independence_wave_rewrite_charter_of_borders: "Rewrite the Charter of Borders"
independence_wave_rewrite_charter_of_borders_desc: "The inherited frontier system will be replaced by a revisionist doctrine backed by organized states."
independence_wave_rewrite_charter_of_borders_tt: "Makes open sovereignty a permanent doctrine and adds exceptionally strong revisionist pressure."

independence_wave_secure_durable_sovereignty: "Secure Durable Sovereignty"
independence_wave_secure_durable_sovereignty_desc: "A settled government, functioning economy, professional defense, recognized diplomacy, and resolved former-host policy can carry the state beyond its founding crisis."
independence_wave_secure_durable_sovereignty_tt: "Makes the founding settlement durable and grants major improvements to every measure of statehood and public stability."

independence_wave_overlay_take_stock_of_independence: "Take Stock of Independence"
independence_wave_overlay_take_stock_of_independence_desc: "Our established national institutions must account for the pressures created by the new settlement."
independence_wave_overlay_take_stock_of_independence_tt: "Brings the country's established institutions into the work of securing independence."
independence_wave_overlay_secure_state_services: "Secure State Services"
independence_wave_overlay_secure_state_services_desc: "Existing ministries will absorb the records, obligations, and service gaps left by separation."
independence_wave_overlay_secure_state_services_tt: "Substantially improves state capacity and reduces instability."
independence_wave_overlay_integrate_release_forces: "Integrate the Release Forces"
independence_wave_overlay_integrate_release_forces_desc: "Formations created by the separation will enter the country's established military system."
independence_wave_overlay_integrate_release_forces_tt: "Adds army experience and improves national security."
independence_wave_overlay_open_foreign_desk: "Open the Independence Foreign Desk"
independence_wave_overlay_open_foreign_desk_desc: "The foreign service will coordinate recognition, former-host relations, and new-state diplomacy."
independence_wave_overlay_open_foreign_desk_tt: "Improves recognition and administrative capacity."
independence_wave_overlay_address_former_host: "Address the Former Host"
independence_wave_overlay_address_former_host_desc: "The existing government will define how its wider national program handles the unfinished separation."
independence_wave_overlay_address_former_host_tt: "Opens a former-host policy and strengthens the public settlement."
independence_wave_overlay_join_network: "Join the Independence Network"
independence_wave_overlay_join_network_desc: "Our national program can cooperate with the new-state network without surrendering its own diplomatic identity."
independence_wave_overlay_join_network_tt: "Improves network standing, league cohesion, common cause, reserves, and confidence. If the country can pursue league formation, it may also contribute to the founding congress."
independence_wave_overlay_open_regional_ambition: "Open the Regional Ambition"
independence_wave_overlay_open_regional_ambition_desc: "The country's history and geography define a regional ambition that can coexist with its established national program."
independence_wave_overlay_open_regional_ambition_tt: "Opens the country's regional ambition and border measures. In World Collapse, it also exerts stronger pressure and opens high-chaos actions."
independence_wave_overlay_mature_independence: "Mature Independence"
independence_wave_overlay_mature_independence_desc: "The country's established institutions have absorbed the pressures of the Independence Wave and made the settlement durable."
independence_wave_overlay_mature_independence_tt: "Makes the independence settlement durable and grants a major statehood improvement."
