independence_wave_kc_foundation_failure_effect_tt: "Both founding values fall. Legitimacy, recognition, capacity, security, and stability fall, instability rises, and the foundation crisis advances one tier."
independence_wave_kar_railheads_effect_tt: "Forest Supply rises by [?constant:independence_wave_karelia_crimea_pressure.standard_gain|0], Civic Mandate by [?constant:independence_wave_karelia_crimea_pressure.minor_gain|0], Legitimacy by [?constant:independence_wave_value.minor_gain|0], and Capacity by [?constant:independence_wave_value.standard_gain|0]. Instability falls by [?constant:independence_wave_value.minor_gain|0]."
independence_wave_kar_ski_guard_effect_tt: "Forest Supply rises by [?constant:independence_wave_karelia_crimea_pressure.standard_gain|0], Civic Mandate by [?constant:independence_wave_karelia_crimea_pressure.minor_gain|0], Legitimacy by [?constant:independence_wave_value.minor_gain|0], and Security by [?constant:independence_wave_value.standard_gain|0]. Instability falls by [?constant:independence_wave_value.minor_gain|0]."
independence_wave_kar_language_commission_effect_tt: "Forest Supply rises by [?constant:independence_wave_karelia_crimea_pressure.minor_gain|0], Civic Mandate by [?constant:independence_wave_karelia_crimea_pressure.major_gain|0], Legitimacy and Capacity by [?constant:independence_wave_value.standard_gain|0], and Recognition by [?constant:independence_wave_value.minor_gain|0]."
independence_wave_kar_border_transit_effect_tt: "Forest Supply and Civic Mandate rise by [?constant:independence_wave_karelia_crimea_pressure.standard_gain|0]. Recognition and Network Standing rise by [?constant:independence_wave_value.standard_gain|0], while Legitimacy and Capacity rise by [?constant:independence_wave_value.minor_gain|0]."
independence_wave_cri_land_claims_effect_tt: "Return Capacity rises by [?constant:independence_wave_karelia_crimea_pressure.minor_gain|0], Land Settlement by [?constant:independence_wave_karelia_crimea_pressure.standard_gain|0], Legitimacy and Capacity by [?constant:independence_wave_value.standard_gain|0], and Recognition by [?constant:independence_wave_value.minor_gain|0]."
independence_wave_cri_return_commission_effect_tt: "Return Capacity rises by [?constant:independence_wave_karelia_crimea_pressure.standard_gain|0], Land Settlement by [?constant:independence_wave_karelia_crimea_pressure.minor_gain|0], Recognition by [?constant:independence_wave_value.standard_gain|0], and Legitimacy and Capacity by [?constant:independence_wave_value.minor_gain|0]. Instability falls by [?constant:independence_wave_value.minor_gain|0]."
independence_wave_cri_services_effect_tt: "Return Capacity rises by [?constant:independence_wave_karelia_crimea_pressure.standard_gain|0], Land Settlement by [?constant:independence_wave_karelia_crimea_pressure.minor_gain|0], Security by [?constant:independence_wave_value.standard_gain|0], and Legitimacy by [?constant:independence_wave_value.minor_gain|0]. Instability falls by [?constant:independence_wave_value.minor_gain|0]."
independence_wave_cri_customs_effect_tt: "Return Capacity and Land Settlement rise by [?constant:independence_wave_karelia_crimea_pressure.minor_gain|0]. Recognition, Capacity, Security, and Network Standing rise by [?constant:independence_wave_value.standard_gain|0]."
independence_wave_kc_host_settlement_effect_tt: "Border settlement improves. The former host's claims, hostility, obligations, property disputes, political pressure, and fear of reconquest all decline."
independence_wave_kc_route_effect_tt: "The selected government takes office, replaces the provisional administration, and changes Legitimacy, Recognition, Capacity, Security, and Instability according to its route."
independence_wave_kc_network_effect_tt: "Network Standing, League Cohesion, Common Cause, Shared Reserve, and Member Confidence rise."
independence_wave_kar_durable_sovereignty_effect_tt: "Strategic reserves are committed. Karelian sovereignty is codified, and the durable-state focus reward is recorded."
independence_wave_cri_durable_sovereignty_effect_tt: "Strategic reserves are committed. Crimean sovereignty is codified, and the durable-state focus reward is recorded."
