kar_contested_forest_administration: "Contested Forest Administration"
kar_contested_forest_administration_desc: "Railheads, village councils, and the opening force still answer to different authorities. Every convoy is a political decision."
kar_forest_state_compact: "Forest State Compact"
kar_forest_state_compact_desc: "A written compact binds Karelia's railheads, language communities, and frontier detachments to one public authority."
kar_constitutional_mandate: "Constitutional Mandate"
kar_constitutional_mandate_desc: "An elected civic mandate gives the forest state a negotiable public voice."
kar_workers_council: "Forest Workers' Council"
kar_workers_council_desc: "Workshop and rail crews direct scarce production toward the roads and formations that hold the border."
kar_frontier_authority: "Frontier Authority"
kar_frontier_authority_desc: "Local customary authority survives through obligations to the villages and officers guarding the forest frontier."
kar_frontier_command: "Frontier Command"
kar_frontier_command_desc: "An emergency command concentrates officers, trains, and equipment on the routes most likely to be cut."
cri_contested_peninsula_administration: "Contested Peninsula Administration"
cri_contested_peninsula_administration_desc: "The peninsula's return claims, ports, and security services remain divided while the new state searches for a common authority."
cri_return_state_compact: "Return State Compact"
cri_return_state_compact_desc: "A compact joins the peninsula's return commissions, land registers, and coastal defenses."
cri_constitutional_mandate: "Constitutional Mandate"
cri_constitutional_mandate_desc: "A civic mandate makes return claims legible to neighbors and to the former host."
cri_workers_council: "Return Workers' Council"
cri_workers_council_desc: "Dockworkers, farmers, and workshops coordinate the material work of rebuilding a returned state."
cri_return_authority: "Return Authority"
cri_return_authority_desc: "Traditional institutions arbitrate land and population claims while the peninsula rebuilds its public order."
cri_coastal_command: "Coastal Command"
cri_coastal_command_desc: "An emergency command protects the Black Sea approaches and concentrates the opening force around the peninsula's ports."

independence_wave_karelia_crimea_category: "Founding the New State"
independence_wave_karelia_crimea_category_desc: "Secure the capital, establish a government, supply the founding force, and settle relations with the former host."
independence_wave_kar_hold_statehood_foundation: "Hold the Karelian Foundation"
independence_wave_kar_hold_statehood_foundation_desc: "Raise Forest Supply and Civic Mandate to the required level, choose a government, and keep Karelia under our control as the capital. Forest Supply: [?independence_wave_kar_forest_supply_integrity|0]/[?constant:independence_wave_karelia_crimea_pressure.stable|0]. Civic Mandate: [?independence_wave_kar_civic_mandate|0]/[?constant:independence_wave_karelia_crimea_pressure.stable|0]."
independence_wave_cri_hold_statehood_foundation: "Hold the Crimean Foundation"
independence_wave_cri_hold_statehood_foundation_desc: "Raise Return Capacity and Land Settlement to the required level, choose a government, and keep Crimea under our control as the capital. Return Capacity: [?independence_wave_cri_return_capacity|0]/[?constant:independence_wave_karelia_crimea_pressure.stable|0]. Land Settlement: [?independence_wave_cri_land_settlement|0]/[?constant:independence_wave_karelia_crimea_pressure.stable|0]."
independence_wave_kar_reopen_forest_railheads: "Reopen the Forest Railheads"
independence_wave_kar_reopen_forest_railheads_desc: "Restore the railheads that carry food, equipment, and orders between the surviving Karelian anchor and the frontier."
independence_wave_kar_form_ski_guard: "Form the Ski Guard"
independence_wave_kar_form_ski_guard_desc: "A trained ski guard can move across the forest faster than a conventional column, but it consumes scarce arms and command attention."
independence_wave_kar_convene_language_commission: "Convene the Language Commission"
independence_wave_kar_convene_language_commission_desc: "Give Karelian and Finnish-speaking communities one register for schools, orders, and public claims."
independence_wave_kar_negotiate_border_transit: "Negotiate Border Transit"
independence_wave_kar_negotiate_border_transit_desc: "Trade a controlled transit regime for a less hostile former host and a safer frontier supply line."
independence_wave_cri_survey_land_claims: "Survey the Land Claims"
independence_wave_cri_survey_land_claims_desc: "Map the peninsula's land claims before return commissions turn them into an open conflict."
independence_wave_cri_organize_return_commission: "Organize the Return Commission"
independence_wave_cri_organize_return_commission_desc: "Create a public commission that can process displaced families, property files, and local testimony."
independence_wave_cri_screen_peninsular_services: "Screen the Peninsular Services"
independence_wave_cri_screen_peninsular_services_desc: "Screen the security services and place reliable officers inside the opening force."
independence_wave_cri_open_black_sea_customs: "Open Black Sea Customs"
independence_wave_cri_open_black_sea_customs_desc: "Use the ports to turn recognition and convoy capacity into a functioning customs network."
independence_wave_kc_negotiate_former_host: "Negotiate the Former Host Settlement"
independence_wave_kc_negotiate_former_host_desc: "Settle border, property, population, and recognition claims with the state that released the new country."
independence_wave_kar_ratify_constitutional_mandate: "Ratify the Civic Mandate"
independence_wave_kar_ratify_constitutional_mandate_desc: "Make the assembly the public face of Karelia's forest compact."
independence_wave_kar_convene_workers_council: "Convene the Forest Workers' Council"
independence_wave_kar_convene_workers_council_desc: "Place workshops, carriers, and depot crews under a council that can meet the opening force's material demands."
independence_wave_kar_restore_frontier_authority: "Restore Frontier Authority"
independence_wave_kar_restore_frontier_authority_desc: "Renew local obligations to the villages and officers that keep the frontier open."
independence_wave_kar_establish_frontier_command: "Establish the Frontier Command"
independence_wave_kar_establish_frontier_command_desc: "Put an emergency chain of command above local rivalries before the first hard frontier test."
independence_wave_cri_ratify_constitutional_mandate: "Ratify the Civic Return Union"
independence_wave_cri_ratify_constitutional_mandate_desc: "Give return claims a public authority capable of bargaining for recognition."
independence_wave_cri_convene_workers_council: "Convene the Return Workers' Council"
independence_wave_cri_convene_workers_council_desc: "Place dockyards, farms, and workshops under a council that can sustain the peninsula's reconstruction."
independence_wave_cri_restore_return_authority: "Restore Return Authority"
independence_wave_cri_restore_return_authority_desc: "Renew the institutions that arbitrate land, population, and local security claims."
independence_wave_cri_establish_coastal_command: "Establish the Coastal Command"
independence_wave_cri_establish_coastal_command_desc: "Concentrate the opening force around the Black Sea approaches and the peninsula's ports."
independence_wave_kar_codify_durable_sovereignty: "Codify Karelian Sovereignty"
independence_wave_kar_codify_durable_sovereignty_desc: "A stable compact, a recognized border, and a functioning forest force can turn liberation into durable sovereignty."
independence_wave_cri_codify_durable_sovereignty: "Codify Crimean Sovereignty"
independence_wave_cri_codify_durable_sovereignty_desc: "A stable return settlement, a recognized border, and a functioning coastal force can secure the peninsula."
independence_wave_kc_open_regional_network: "Open the Regional Network Corridor"
independence_wave_kc_open_regional_network_desc: "Exchange supplies, officers, and recognition with other states that survived the wave."

