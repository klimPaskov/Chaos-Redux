l_english:
 chaosx.fallout.415.t: "The Refugee Train at the Border"
 chaosx.fallout.415.d: "The train has crossed the ash flats with families, fever cases, and people who know how to keep a dead railway moving. [This.GetName] must decide whether the arrival becomes a welcome, a diversion, a quarantine, or a bargain for skilled hands."
 chaosx.fallout.415.a: "Admit the families"
 chaosx.fallout.415.b: "Redirect the column"
 chaosx.fallout.415.c: "Quarantine the train"
 chaosx.fallout.415.d: "Recruit the specialists"
 chaosx.fallout.415.a.tt: "Spend food, recognition, and cohesion to bring the families through the shelter gates."
 chaosx.fallout.415.b.tt: "Spend food, recognition, and cohesion to route the column toward a safer rail yard."
 chaosx.fallout.415.c.tt: "Spend food, recognition, and cohesion to hold the train outside the settlement until medicine teams clear it."
 chaosx.fallout.415.d.tt: "Spend food, recognition, and cohesion to bind engineers and clinicians to the receiving state."
 chaosx.fallout.417.t: "The Train Reaches the Yard"
 chaosx.fallout.417.admit_families.success.d: "The families receive blankets, names, and a place in the ration ledger. Their arrival fills empty rooms without making the old residents pretend that food is plentiful."
 chaosx.fallout.417.admit_families.partial.d: "The first cars enter, while the last families wait beside the frost line. The receiving shelters gain hands and stories, but the border still feels provisional."
 chaosx.fallout.417.admit_families.failure.d: "The gates remain closed after the first argument over beds. The train leaves with its families intact, and the empty platforms become a grievance that neighboring councils can use."
 chaosx.fallout.417.redirect_column.success.d: "The column reaches an intact yard beyond the damaged bridge. Rail crews keep the route open, and the receiving government earns a partner instead of a crowd at its capital."
 chaosx.fallout.417.redirect_column.partial.d: "The detour saves the locomotives but separates families from the crews who promised to guide them. Both groups survive, though they now speak of the border as a bargain."
 chaosx.fallout.417.redirect_column.failure.d: "The detour collapses at a frozen junction. Wagons are stripped for shelter, the rail map loses another line, and the sending settlements call the failure a betrayal."
 chaosx.fallout.417.quarantine_train.success.d: "The clinic cars are isolated, tested, and released in order. The quarantine becomes a bilateral compact that protects the town without turning every newcomer into a suspect."
 chaosx.fallout.417.quarantine_train.partial.d: "The fever stays inside the cars, but the cordon consumes the medicine reserve. The town accepts the ledger, yet families wait for a citizenship decision that no doctor can make."
 chaosx.fallout.417.quarantine_train.failure.d: "The cordon breaks after a night of cold and hunger. Patients reach the market before the medics, and the receiving government inherits both deaths and a lasting accusation."
 chaosx.fallout.417.recruit_specialists.success.d: "Engineers repair the signal tower while clinicians train a ward team. The arrivals keep their own memories, but their work becomes part of the receiving state's survival plan."
 chaosx.fallout.417.recruit_specialists.partial.d: "A few specialists accept contracts, while others demand a council of their own. The receiving state gains expertise and a new faction that will test its promises."
 chaosx.fallout.417.recruit_specialists.failure.d: "The specialists refuse the contract and board the last carriage. The town keeps the families but loses the route knowledge that could have linked the border settlements."
 chaosx.fallout.417.a: "Register the arrivals and prepare the next crossing"
 chaosx.fallout.417.a.tt: "Apply the train result, record the bilateral memory, and schedule the first anniversary review."
 chaosx.fallout.419.t: "The First Anniversary"
 chaosx.fallout.419.success.d: "A year later, the chosen date survives the queue, the schoolroom, and the memorial wall. Children learn it as a beginning rather than a wound, and the country can measure recovery without forgetting the cost."
 chaosx.fallout.419.partial.d: "The anniversary is observed, though every district adds its own names and weather marks. The refugee has become a habit, but it has not yet become a shared history."
 chaosx.fallout.419.failure.d: "The anniversary collapses into rival ceremonies. The date remains in the archive, but public life returns to older names that no longer promise a common future."
 chaosx.fallout.419.a: "Close the refugee record"
 chaosx.fallout.419.a.tt: "Resolve the anniversary, retain its memory, and release the scheduler cleanup receipt."
 fallout.event_log.refugee_train.name: "The Refugee Train"
 fallout.event_log.refugee_train.detail: "[This.GetName] chose what the train would mean to the border and the settlements beyond it."
 fallout.event_log.refugee_train.admit_families_success: "Families crossed the gates and the receiving state recorded them as neighbors."
 fallout.event_log.refugee_train.admit_families_partial: "Families entered in waves while several shelters kept their doors barred."
 fallout.event_log.refugee_train.admit_families_failure: "The gates stayed shut and the train became a grievance at the border."
 fallout.event_log.refugee_train.redirect_column_success: "The column reached a safer rail yard and kept the corridor open."
 fallout.event_log.refugee_train.redirect_column_partial: "The train moved, but families and crews were separated by the detour."
 fallout.event_log.refugee_train.redirect_column_failure: "The diversion failed and the damaged line became a new border."
 fallout.event_log.refugee_train.quarantine_train_success: "Medicine teams cleared the cars and the quarantine became a trusted compact."
 fallout.event_log.refugee_train.quarantine_train_partial: "The quarantine held, though fear kept families apart from the town."
 fallout.event_log.refugee_train.quarantine_train_failure: "The quarantine broke and sickness followed the train into the market."
 fallout.event_log.refugee_train.recruit_specialists_success: "Engineers and clinicians joined the receiving state and taught its crews."
 fallout.event_log.refugee_train.recruit_specialists_partial: "A few specialists stayed while the rest demanded a separate charter."
 fallout.event_log.refugee_train.recruit_specialists_failure: "The specialists left with the train and took their route knowledge with them."
 fallout.event_log.refugee_train.callback_success: "A year later the arrivals had homes, work, and a place in the public ledger."
 fallout.event_log.refugee_train.callback_partial: "The anniversary found a functioning border with an unfinished citizenship question."
 fallout.event_log.refugee_train.callback_failure: "The anniversary reopened the border quarrel and drove new families away."
