l_english:
  chaosx.fallout.565.t: "The River Ration League"
  chaosx.fallout.565.desc: "The Danube has become a chain of guarded crossings, grain rooms, pump stations, and winter camps. In [?fallout_event_565_target_state_id.GetName], upstream stores hold the first barges. In [?fallout_event_565_downstream_state_id.GetName], ration councils wait for a delivery that no longer has a sovereign route. Bridge militias demand tolls while flood crews warn that a locked gate can drown the lower bank. The river can carry a compact, a privilege, a customs cordon, or an emergency flood authority."
  chaosx.fallout.565.a: "Write a joint barge law"
  chaosx.fallout.565.a.tt: "Spend Food 6, Fuel 4, and Recognition 3. Recheck the two named states after 42 days. A shared law may raise trust while leaving both councils able to veto a convoy."
  chaosx.fallout.565.b: "Give the upstream depots priority"
  chaosx.fallout.565.b.tt: "Spend Food 4, Fuel 3, and Recognition 2. Recheck the two named states after 42 days. A full upstream store can move grain quickly, but the lower bank may remember the shortage as a border claim."
  chaosx.fallout.565.c: "Arm the customs bridges"
  chaosx.fallout.565.c.tt: "Spend Scrap 4, Fuel 6, and Recognition 2. Recheck the two named states after 42 days. Searches can stop theft and contamination, but every toll makes the river a military frontier."
  chaosx.fallout.565.d: "Put the pumps under flood authority"
  chaosx.fallout.565.d.tt: "Spend Clean Water 4, Scrap 7, and Power 6. Recheck the two named states after 42 days. Dredging and emergency closures protect the lower bank, though local councils lose control of the gates."
  chaosx.fallout.566.t: "River Ration League orders"
  chaosx.fallout.567.t: "The River Ledger Returns"
  chaosx.fallout.567.barge.success.d: "The first joint convoy passed from [?fallout_event_565_target_state_id.GetName] toward [?fallout_event_565_downstream_state_id.GetName] under one manifest. Grain, filtered water, and bridge repairs were counted at both banks. The law is narrow, yet the two councils can now name the same measure."
  chaosx.fallout.567.barge.partial.d: "The joint convoy reached the lower river with a shorter manifest than promised. [?fallout_event_565_target_state_id.GetName] kept the pumps running and [?fallout_event_565_downstream_state_id.GetName] received a measured allotment, but the appeal clause remains disputed."
  chaosx.fallout.567.barge.failure.d: "The first joint convoy stopped at a bridge where two manifests claimed the same sacks. The barges returned upstream, the lower ration rooms closed their shutters, and both banks now treat the written compact as a broken promise."
  chaosx.fallout.567.upstream.success.d: "The upstream depots in [?fallout_event_565_target_state_id.GetName] filled the barges before the thaw and sent a guarded share downstream. The upper bank gained a stronger route and the lower bank received enough food to keep its pumps staffed, although the order of need is now political."
  chaosx.fallout.567.upstream.partial.d: "The upstream priority order moved grain through [?fallout_event_565_target_state_id.GetName], but the lower bank in [?fallout_event_565_downstream_state_id.GetName] received less than its winter ledger showed. The route survives with a visible debt between the depots."
  chaosx.fallout.567.upstream.failure.d: "The upstream stores protected their own doors and lost the barge crews to a frozen lock. [?fallout_event_565_downstream_state_id.GetName] received no scheduled allotment, while [?fallout_event_565_target_state_id.GetName] discovered that priority without a working route is only a claim."
  chaosx.fallout.567.customs.success.d: "Bridge inspectors in [?fallout_event_565_target_state_id.GetName] and [?fallout_event_565_downstream_state_id.GetName] agreed on sealed cargo marks and a single passage book. The customs cordon slows every barge, but it has stopped the thefts that were feeding the river quarrel."
  chaosx.fallout.567.customs.partial.d: "The armed customs line held at the main bridge and failed at two winter tracks. Cargo now moves under a rule that the central depots understand, while the outer villages trade around the inspections and resent the toll."
  chaosx.fallout.567.customs.failure.d: "The customs bridge in [?fallout_event_565_target_state_id.GetName] became a queue of empty wagons and searched sacks. A patrol in [?fallout_event_565_downstream_state_id.GetName] broke the passage book, and the river route lost more trust than it gained in fuel or scrap."
  chaosx.fallout.567.flood.success.d: "Pump crews took the levee keys and kept the lower bank open while barges crossed. [?fallout_event_565_target_state_id.GetName] accepted the emergency closures, and [?fallout_event_565_downstream_state_id.GetName] gained a safer outlet without losing its ration rooms."
  chaosx.fallout.567.flood.partial.d: "The flood authority cleared the worst silt and held the main gate, but two feeder channels remained closed. The lower bank in [?fallout_event_565_downstream_state_id.GetName] has a usable water route, although the local councils still contest who can issue the next warning."
  chaosx.fallout.567.flood.failure.d: "The emergency gate at [?fallout_event_565_downstream_state_id.GetName] jammed under ice and silt. Water stocks fell, the pump crews abandoned one section of the levee, and the flood authority now carries a damaged bridge between the two banks."
  chaosx.fallout.567.a: "Enter the result in the river ledger"
  chaosx.fallout.567.a.tt: "Apply the branch grade to food, water, fuel, power, scrap, recognition, cohesion, Supply Access, trust, and border tension. The 180-day institutional review is scheduled after the entry is accepted."
  chaosx.fallout.568.t: "River Ration League result"
  chaosx.fallout.569.t: "The River Compact Review"
  chaosx.fallout.569.barge.success.d: "The review in [?fallout_event_565_target_state_id.GetName] found that the joint manifest had survived a full season. [?fallout_event_565_downstream_state_id.GetName] accepted the appeal rule and both banks restored a little more trust to the compact."
  chaosx.fallout.569.barge.partial.d: "The review found a joint law that can be copied, but not yet trusted. The two banks kept one useful clause and left the harder question of emergency priority for another council."
  chaosx.fallout.569.barge.failure.d: "The review found two ledgers where the compact promised one. The upstream and downstream councils still exchange cargo, yet every exception now adds to the border tension recorded beside the river."
  chaosx.fallout.569.upstream.success.d: "The upstream priority order kept the granaries in [?fallout_event_565_target_state_id.GetName] open and sent one extra food issue downstream. The lower bank accepted the delivery, but its council now treats the river as a negotiation over first claim."
  chaosx.fallout.569.upstream.partial.d: "The review left the upstream order in place and added a small lower-bank allotment. It is enough to keep the route alive, not enough to end the argument over who is counted first."
  chaosx.fallout.569.upstream.failure.d: "The review found that upstream priority had become a closed gate. [?fallout_event_565_downstream_state_id.GetName] raised its own tolls, and [?fallout_event_565_target_state_id.GetName] must now reopen a route that its first order narrowed."
  chaosx.fallout.569.customs.success.d: "The bridge books in both states survived inspection and the sealed cargo marks are now recognized by the river crews. The customs line remains armed, but it has a rule that a civilian barge can read before it reaches the gate."
  chaosx.fallout.569.customs.partial.d: "The review kept the central customs bridge orderly and left the feeder tracks under local guards. The route is safer at its centre, while every outer village still asks whether the toll protects it or merely records it."
  chaosx.fallout.569.customs.failure.d: "The review found that armed customs had become a second border. Patrols in both states demand different papers, and the river crews carry more fear than cargo through the winter queue."
  chaosx.fallout.569.flood.success.d: "The pump authority returned the levee keys with a working warning schedule. [?fallout_event_565_target_state_id.GetName] and [?fallout_event_565_downstream_state_id.GetName] gained a little more water access, and the lower bank can plan a repair instead of waiting for a breach."
  chaosx.fallout.569.flood.partial.d: "The review kept the main gate open and left the feeder channels under local watch. The authority is useful in a crisis, although the councils still want their own hands on the warning bell."
  chaosx.fallout.569.flood.failure.d: "The review found a flood authority with no spare water and a damaged lower route. [?fallout_event_565_downstream_state_id.GetName] has closed one infrastructure section, and the next barge will need a different crossing."
  chaosx.fallout.569.a: "Close the institutional review"
  chaosx.fallout.569.a.tt: "Apply the 180-day callback to the river ledgers, preserve the branch and grade memory, seed the resulting federation or barge-war arc when its thresholds are met, and release both delayed receipts."
  chaosx.fallout.570.t: "River Compact review"
  chaosx.fallout.571.t: "River Ration League cleanup"
  fallout.event_log.river_ration_league.name: "River Ration League"
  fallout.event_log.river_ration_league.detail: "[GetFalloutEvent565EventLogDetail]"
  fallout.event_log.river_ration_league.detail.choice_joint: "The two river banks chose a joint barge law."
  fallout.event_log.river_ration_league.detail.choice_upstream: "The upstream depots received priority over the lower river."
  fallout.event_log.river_ration_league.detail.choice_customs: "The river bridges received an armed customs cordon."
  fallout.event_log.river_ration_league.detail.choice_flood: "The pumps and levees passed to a flood authority."
  fallout.event_log.river_ration_league.detail.barge_success: "A joint barge law secured a shared river ledger."
  fallout.event_log.river_ration_league.detail.barge_partial: "A joint barge law held at the main crossings but left a contested margin."
  fallout.event_log.river_ration_league.detail.barge_failure: "The joint barge law failed when the bridge manifests diverged."
  fallout.event_log.river_ration_league.detail.upstream_success: "Upstream priority kept the granaries open and sent a guarded share downstream."
  fallout.event_log.river_ration_league.detail.upstream_partial: "Upstream priority moved a smaller share and left a lower-bank debt."
  fallout.event_log.river_ration_league.detail.upstream_failure: "Upstream priority closed the route without a reliable barge schedule."
  fallout.event_log.river_ration_league.detail.customs_success: "Armed customs secured sealed cargo marks and one passage book."
  fallout.event_log.river_ration_league.detail.customs_partial: "Armed customs held the central bridge and lost the feeder tracks."
  fallout.event_log.river_ration_league.detail.customs_failure: "Armed customs turned the bridge into a second border."
  fallout.event_log.river_ration_league.detail.flood_success: "Flood authority kept the main gate open and restored a safer outlet."
  fallout.event_log.river_ration_league.detail.flood_partial: "Flood authority cleared the main channel while feeder routes remained contested."
  fallout.event_log.river_ration_league.detail.flood_failure: "Flood authority lost a lower infrastructure section under ice and silt."
  fallout.event_log.river_ration_league.detail.callback_joint_success: "The joint river compact survived its institutional review."
  fallout.event_log.river_ration_league.detail.callback_joint_partial: "The joint river compact survived with an unresolved emergency clause."
  fallout.event_log.river_ration_league.detail.callback_joint_failure: "The joint river compact left two ledgers and a rising border tension."
  fallout.event_log.river_ration_league.detail.callback_upstream_success: "The upstream order stayed open while the lower bank received an added issue."
  fallout.event_log.river_ration_league.detail.callback_upstream_partial: "The upstream order kept the route alive without ending the first-claim dispute."
  fallout.event_log.river_ration_league.detail.callback_upstream_failure: "The upstream order hardened into a closed gate at review."
  fallout.event_log.river_ration_league.detail.callback_customs_success: "The customs line gained a passage rule the river crews could read."
  fallout.event_log.river_ration_league.detail.callback_customs_partial: "The central customs bridge held while feeder tracks remained local."
  fallout.event_log.river_ration_league.detail.callback_customs_failure: "The customs line became a second border between the two banks."
  fallout.event_log.river_ration_league.detail.callback_flood_success: "The flood authority returned a working warning schedule and safer water route."
  fallout.event_log.river_ration_league.detail.callback_flood_partial: "The flood authority kept the main gate open while councils contested the warning bell."
  fallout.event_log.river_ration_league.detail.callback_flood_failure: "The flood review closed one damaged infrastructure section."
  fallout.event_log.river_ration_league.detail.cancelled: "The river receipt was cancelled before both banks could be revalidated."
