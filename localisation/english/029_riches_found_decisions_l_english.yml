decision_riches_found_account_pay_material: "Pay the Material Claim"
decision_riches_found_account_pay_material_desc: "Meet the current promise with supplies and fuel rather than public authority or lives. Each payment settles one term; the ledger accepts at most [?constant:riches_found_account_limit.maximum_paid_terms|0]."
decision_riches_found_account_pay_material_tt: "Settle one current obligation through material and strengthen the mine's receipts. No further payment can begin for [?constant:riches_found_account_limit.payment_cooldown_days|0] days.\nExtraction Pressure: §G[?constant:riches_found_action_delta.negative_4|0]§!"
