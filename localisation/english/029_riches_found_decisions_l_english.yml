decision_riches_found_gilded_revoke_charter_desc: "Strip the chartered board of its legal authority over the mine district."
decision_riches_found_gilded_revoke_charter_tt: "Revenue Legitimacy: §G+[?constant:riches_found_action_delta.positive_8|0]§!  Extraction Pressure: §R+[?constant:riches_found_action_delta.positive_8|0]§!"
