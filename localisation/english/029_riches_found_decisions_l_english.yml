decision_riches_found_account_bind_terms: "Bind the Account"
decision_riches_found_account_bind_terms_desc: "Use completed assistance and controlled entrances to end further payments and confine extraction to supervised upper workings."
decision_riches_found_account_bind_terms_tt: "Further obligations end. The opened depths are contained and upper workings retain reduced output.\nRevenue Legitimacy: §G+[?constant:riches_found_action_delta.positive_5|0]§!"
