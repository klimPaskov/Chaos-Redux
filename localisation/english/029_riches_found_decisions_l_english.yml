decision_riches_found_account_close: "Close the Account"
decision_riches_found_account_close_desc: "Prepare containment and refuse further terms. The existing promise remains enforceable until engineers secure the entrances. An evacuation already underway continues."
decision_riches_found_account_close_tt: "Extraction stops. Controlled entrances are permanently sealed; otherwise containment awaits security. Existing breaches and unpaid promises are not erased.\nExtraction Pressure: §G[?constant:riches_found_action_delta.negative_25|0]§!"
