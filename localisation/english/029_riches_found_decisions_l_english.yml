decision_riches_found_return_to_mine_list: "Return to the Mine List"
decision_riches_found_return_to_mine_list_desc: "Clear the current mine selection and choose another controlled site on the map."
riches_found_country_can_start_secure_rush_mission: "A Secure the Rush mission is not already active and a mission slot is free"
riches_found_country_can_start_open_railhead_mission: "An Open the Railhead mission is not already active and a mission slot is free"
riches_found_country_can_start_protect_pay_train_mission: "A Protect the Pay Train mission is not already active and a mission slot is free"
riches_found_country_can_start_break_claim_war_mission: "A Break the Claim War mission is not already active and a mission slot is free"
riches_found_country_can_start_restore_shaft_mission: "A Restore the Shaft mission is not already active and a mission slot is free"
riches_found_country_can_start_hold_mine_mission: "A Hold the Mine mission is not already active and a mission slot is free"
riches_found_country_can_start_public_settlement_mission: "A Public Settlement mission is not already active and a mission slot is free"
riches_found_country_can_start_audit_concession_mission: "An Audit the Concession mission is not already active and a mission slot is free"
riches_found_country_can_start_evacuate_workforce_mission: "An Evacuate the Workforce mission is not already active and a mission slot is free"

mission_riches_found_secure_rush: "Secure the Rush"
mission_riches_found_secure_rush_desc: "Build a camp administration, settle the disputed claims, and keep Local Order above [?constant:riches_found_decision_threshold.order_floor|0]."
mission_riches_found_secure_rush_complete_tt: "§GSuccess:§! The camp is registered, patrolled, and brought under the mine administration."
mission_riches_found_secure_rush_partial_tt: "§YPartial success:§! The main approaches are secured, but disorder continues beyond the marked claims."
mission_riches_found_secure_rush_failure_tt: "§RFailure:§! Rival claimants entrench themselves and the rush escapes public control."

mission_riches_found_open_railhead: "Open the Railhead"
mission_riches_found_open_railhead_desc: "Complete the rail or port connection, repair mine damage, and raise Mine Development above [?constant:riches_found_decision_threshold.development_ready|0]."
mission_riches_found_open_railhead_complete_tt: "§GSuccess:§! The mine gains a dependable railhead or port connection."
mission_riches_found_open_railhead_partial_tt: "§YPartial success:§! The route opens with delays and continuing transport pressure."
mission_riches_found_open_railhead_failure_tt: "§RFailure:§! The transport project fails and the mine remains isolated."

mission_riches_found_protect_pay_train: "Protect the Pay Train"
mission_riches_found_protect_pay_train_desc: "Keep supplied troops on the threatened shipment route and Local Order above [?constant:riches_found_decision_threshold.order_floor|0]. Prevent a robbery until safe passage is established."
mission_riches_found_protect_pay_train_complete_tt: "§GSuccess:§! The shipment arrives intact and the route is secured."
mission_riches_found_protect_pay_train_partial_tt: "§YPartial success:§! Part of the shipment arrives, but raiders retain access to the route."
mission_riches_found_protect_pay_train_failure_tt: "§RFailure:§! Raiders take the shipment and undermine order around the mine."

mission_riches_found_break_claim_war: "Break the Claim War"
mission_riches_found_break_claim_war_desc: "Resolve the competing claims, remove armed claimants from the workings, and keep Local Order above [?constant:riches_found_decision_threshold.order_floor|0]."
mission_riches_found_break_claim_war_complete_tt: "§GSuccess:§! The claim war ends under an enforceable court settlement."
mission_riches_found_break_claim_war_partial_tt: "§YPartial success:§! The worst fighting ends, but several claims remain disputed."
mission_riches_found_break_claim_war_failure_tt: "§RFailure:§! The court fails and armed claimants return to the field."

mission_riches_found_restore_shaft: "Restore the Shaft"
mission_riches_found_restore_shaft_desc: "Keep a rail or port route open to the mine until the repair crews finish their works."
mission_riches_found_restore_shaft_complete_tt: "§GSuccess:§! The damaged shaft returns to safe operation. A collapsed mine reopens under regulated terms."
mission_riches_found_restore_shaft_partial_tt: "§YPartial success:§! Crews recover part of the workings. A collapsed mine reopens its upper workings while the deep sections stay sealed."
mission_riches_found_restore_shaft_failure_tt: "§RFailure:§! The shaft fails again and the collapse deepens."

mission_riches_found_hold_mine: "Hold the Mine"
mission_riches_found_hold_mine_desc: "Retain control of the mine, maintain a security presence, and keep Local Order above [?constant:riches_found_decision_threshold.order_floor|0]."
mission_riches_found_hold_mine_complete_tt: "§GSuccess:§! The mine remains under secure public control."
mission_riches_found_hold_mine_partial_tt: "§YPartial success:§! The mine is held, but extraction pressure grows during the defense."
mission_riches_found_hold_mine_failure_tt: "§RFailure:§! Control breaks down and the security crisis worsens."

mission_riches_found_public_settlement: "Build a Public Settlement"
mission_riches_found_public_settlement_desc: "Complete a public project and pay the agreed revenue share. Keep Local Order above [?constant:riches_found_decision_threshold.order_floor|0] and Revenue Legitimacy above [?constant:riches_found_decision_threshold.legitimacy_floor|0]."
mission_riches_found_public_settlement_complete_tt: "§GSuccess:§! A durable public settlement takes root around the mine."
mission_riches_found_public_settlement_partial_tt: "§YPartial success:§! Some public works endure, but the settlement remains divided."
mission_riches_found_public_settlement_failure_tt: "§RFailure:§! The project fails and confidence in the mine administration collapses."

mission_riches_found_audit_concession: "Audit the Concession"
mission_riches_found_audit_concession_desc: "Recover and preserve the concession's records, identify its owners, and complete the audit."
mission_riches_found_audit_concession_complete_tt: "§GSuccess:§! The audit exposes the concession's ownership and restores public oversight."
mission_riches_found_audit_concession_partial_tt: "§YPartial success:§! Useful records survive, but the full ownership chain remains concealed."
mission_riches_found_audit_concession_failure_tt: "§RFailure:§! The audit fails and private capture deepens."

mission_riches_found_evacuate_workforce: "Evacuate the Workforce"
mission_riches_found_evacuate_workforce_desc: "Keep the evacuation's rail or port route open until the workers and nearby households leave. A severe collapse stops the evacuation."
mission_riches_found_evacuate_workforce_complete_tt: "§GSuccess:§! The workforce and threatened households leave through the protected route."
mission_riches_found_evacuate_workforce_partial_tt: "§YPartial success:§! Some people escape, but the route closes before the evacuation is complete."
mission_riches_found_evacuate_workforce_failure_tt: "§RFailure:§! The route fails and the district remains exposed to the opened depths."
decision_riches_found_demons_make_agreement: "Strike an Infernal Bargain"
decision_riches_found_demons_make_agreement_desc: "Accept a material pledge from the force below. If the account opens, each demand has [?constant:riches_found_account_limit.obligation_days|0] days to be met. Material can substitute for harsher terms; broken promises can destroy the works or close the entrances."
decision_riches_found_demons_make_agreement_tt: "Extraction Pressure: §R+[?constant:riches_found_action_delta.positive_10|0]§!  Revenue Legitimacy: §R[?constant:riches_found_action_delta.negative_12|0]§!"
