riches_found_cost_demons_make_agreement_tooltip: "[This.GetRichesFoundCostPpHeavy] Political power\n[This.GetRichesFoundCostCommandStandard] Command power\n[This.GetRichesFoundCostSupportStandard] Support equipment"

