mission_riches_found_secure_rush: "Secure the Rush"
mission_riches_found_secure_rush_desc: "Establish patrols and registered access before rival claimants seize the camp."
mission_riches_found_secure_rush_complete_tt: "§GSuccess:§! The camp is registered, patrolled, and brought under the mine administration."
mission_riches_found_secure_rush_partial_tt: "§YPartial success:§! The main approaches are secured, but disorder continues beyond the marked claims."
mission_riches_found_secure_rush_failure_tt: "§RFailure:§! Rival claimants entrench themselves and the rush escapes public control."

mission_riches_found_open_railhead: "Open the Railhead"
mission_riches_found_open_railhead_desc: "Keep the mine route supplied until the railhead or port connection opens."
mission_riches_found_open_railhead_complete_tt: "§GSuccess:§! The mine gains a dependable railhead or port connection."
mission_riches_found_open_railhead_partial_tt: "§YPartial success:§! The route opens with delays and continuing transport pressure."
mission_riches_found_open_railhead_failure_tt: "§RFailure:§! The transport project fails and the mine remains isolated."

mission_riches_found_protect_pay_train: "Protect the Pay Train"
mission_riches_found_protect_pay_train_desc: "Guard a threatened wage and bullion shipment along the mine route."
mission_riches_found_protect_pay_train_complete_tt: "§GSuccess:§! The shipment arrives intact and the route is secured."
mission_riches_found_protect_pay_train_partial_tt: "§YPartial success:§! Part of the shipment arrives, but raiders retain access to the route."
mission_riches_found_protect_pay_train_failure_tt: "§RFailure:§! Raiders take the shipment and undermine order around the mine."

mission_riches_found_break_claim_war: "Break the Claim War"
mission_riches_found_break_claim_war_desc: "Keep the claims court operating until rival title holders accept a settlement."
mission_riches_found_break_claim_war_complete_tt: "§GSuccess:§! The claim war ends under an enforceable court settlement."
mission_riches_found_break_claim_war_partial_tt: "§YPartial success:§! The worst fighting ends, but several claims remain disputed."
mission_riches_found_break_claim_war_failure_tt: "§RFailure:§! The court fails and armed claimants return to the field."

mission_riches_found_restore_shaft: "Restore the Shaft"
mission_riches_found_restore_shaft_desc: "Stabilize the damaged workings and keep repair crews supplied."
mission_riches_found_restore_shaft_complete_tt: "§GSuccess:§! The damaged shaft returns to safe operation."
mission_riches_found_restore_shaft_partial_tt: "§YPartial success:§! Crews recover part of the workings, but major damage remains."
mission_riches_found_restore_shaft_failure_tt: "§RFailure:§! The shaft fails again and the collapse deepens."

mission_riches_found_hold_mine: "Hold the Mine"
mission_riches_found_hold_mine_desc: "Maintain control and public order at the mine through the crisis."
mission_riches_found_hold_mine_complete_tt: "§GSuccess:§! The mine remains under secure public control."
mission_riches_found_hold_mine_partial_tt: "§YPartial success:§! The mine is held, but extraction pressure grows during the defense."
mission_riches_found_hold_mine_failure_tt: "§RFailure:§! Control breaks down and the security crisis worsens."

mission_riches_found_public_settlement: "Build a Public Settlement"
mission_riches_found_public_settlement_desc: "Complete public works and keep the mine settlement orderly and legitimate."
mission_riches_found_public_settlement_complete_tt: "§GSuccess:§! A durable public settlement takes root around the mine."
mission_riches_found_public_settlement_partial_tt: "§YPartial success:§! Some public works endure, but the settlement remains divided."
mission_riches_found_public_settlement_failure_tt: "§RFailure:§! The project fails and confidence in the mine administration collapses."

mission_riches_found_audit_concession: "Audit the Concession"
mission_riches_found_audit_concession_desc: "Recover the records, identify the owners, and complete a public audit."
mission_riches_found_audit_concession_complete_tt: "§GSuccess:§! The audit exposes the concession's ownership and restores public oversight."
mission_riches_found_audit_concession_partial_tt: "§YPartial success:§! Useful records survive, but the full ownership chain remains concealed."
mission_riches_found_audit_concession_failure_tt: "§RFailure:§! The audit fails and private capture deepens."

mission_riches_found_evacuate_workforce: "Evacuate the Workforce"
mission_riches_found_evacuate_workforce_desc: "Keep the evacuation route open until workers and nearby households escape."
mission_riches_found_evacuate_workforce_complete_tt: "§GSuccess:§! The workforce and threatened households leave through the protected route."
mission_riches_found_evacuate_workforce_partial_tt: "§YPartial success:§! Some people escape, but the route closes before the evacuation is complete."
mission_riches_found_evacuate_workforce_failure_tt: "§RFailure:§! The route fails and the district remains exposed to the opened depths."
