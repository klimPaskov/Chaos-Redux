# Event 012 priority-member sovereigns and settlement parties.

africa_priority_crowned_sovereign_trait: "Crowned Stewardship"
africa_priority_crowned_sovereign_trait_desc: "A decorated African sovereign carries customary legitimacy into a modern state, balancing ceremony, consent, and the obligations written into the Charter."

africa_priority_asante_sovereign: "The Asantehene"
africa_priority_asante_sovereign_desc: "The Asantehene bears the Golden Stool's authority, while the compact binds the crown to constituent stools, public revenue, and Kumasi's constitutional settlement."
africa_priority_asante_council_party: "Stool Court"
africa_priority_asante_council_party_long: "Asante Stool Court Government"
africa_priority_asante_civic_party: "Revenue Board"
africa_priority_asante_civic_party_long: "Asante Civic Revenue Board"
africa_priority_asante_producer_party: "Producer Compact"
africa_priority_asante_producer_party_long: "Asante Producer Revenue Compact"

africa_priority_oyo_sovereign: "The Alaafin of Oyo"
africa_priority_oyo_sovereign_desc: "The Alaafin holds Oyo's restored crown under a settlement with the city governments, market authorities, Ife, and the corridor communities."
africa_priority_oyo_council_party: "Alaafin Court"
africa_priority_oyo_council_party_long: "Oyo Alaafin and City Court"
africa_priority_oyo_civic_party: "Corridor Federation"
africa_priority_oyo_civic_party_long: "Oyo Corridor Federation"
africa_priority_oyo_producer_party: "Producer Compact"
africa_priority_oyo_producer_party_long: "Oyo Urban Producer Compact"

africa_priority_sokoto_sovereign: "The Sultan of Sokoto"
africa_priority_sokoto_sovereign_desc: "The Sultan carries Sokoto's restored authority through an emirate compact that protects consultation, scholarship, pastoral access, and the rights of communities beyond the court."
africa_priority_sokoto_council_party: "Consultative Chamber"
africa_priority_sokoto_council_party_long: "Sokoto Emirate Consultative Chamber"
africa_priority_sokoto_civic_party: "Federal Chamber"
africa_priority_sokoto_civic_party_long: "Sokoto Reformist Federal Chamber"
africa_priority_sokoto_producer_party: "Pastoral Compact"
africa_priority_sokoto_producer_party_long: "Sokoto Pastoral Producer Compact"

africa_priority_kanem_bornu_sovereign: "Shehu Sanda Kura of Borno"
africa_priority_kanem_bornu_sovereign_desc: "Shehu Sanda Kura carries Borno's court authority in a wrapped turban, embroidered robe, and ceremonial star, while the Lake Covenant binds the court to wells, fisheries, pasture, caravan towns, and the basin's divided communities."
africa_priority_kanem_bornu_council_party: "Lake Covenant Court"
africa_priority_kanem_bornu_council_party_long: "Kanem-Bornu Lake Covenant Court"
africa_priority_kanem_bornu_civic_party: "Lake Chad Commission"
africa_priority_kanem_bornu_civic_party_long: "Kanem-Bornu Lake Chad Commission"
africa_priority_kanem_bornu_producer_party: "Water Compact"
africa_priority_kanem_bornu_producer_party_long: "Kanem-Bornu Pastoral Water Compact"

africa_priority_manden_sovereign: "The Mansa of Manden"
africa_priority_manden_sovereign_desc: "The Mansa embodies the restored Manden crown while local authorities, scholars, producer bodies, and corridor partners retain their negotiated place in the realm."
africa_priority_manden_council_party: "Restoration Assembly"
africa_priority_manden_council_party_long: "Manden Restoration Assembly"
africa_priority_manden_civic_party: "River Federation"
africa_priority_manden_civic_party_long: "Manden River Federal Assembly"
africa_priority_manden_producer_party: "Producer Assembly"
africa_priority_manden_producer_party_long: "Manden Inland Producer Assembly"

africa_priority_kongo_sovereign: "Pedro VII Afonso of Kongo"
africa_priority_kongo_sovereign_desc: "Pedro VII Afonso leads a restored court in a plume-capped hat, ceremonial cape, embroidered robe, and staff. Its authority depends on church, civic, provincial, and river communities, and it does not extend automatically to every former border."
africa_priority_kongo_council_party: "Court-Civic Congress"
africa_priority_kongo_council_party_long: "Kongo Court-Civic Congress"
africa_priority_kongo_civic_party: "Cross-Border Commonwealth"
africa_priority_kongo_civic_party_long: "Kongo Cross-Border Commonwealth"
africa_priority_kongo_producer_party: "River Community Union"
africa_priority_kongo_producer_party_long: "Kongo River Community Union"

africa_priority_buganda_sovereign: "The Kabaka of Buganda"
africa_priority_buganda_sovereign_desc: "The Kabaka reigns through a compact with the Lukiiko, clan institutions, land reformers, and the wider Ugandan settlement."
africa_priority_buganda_council_party: "Crown Compact"
africa_priority_buganda_council_party_long: "Buganda Kabaka-Lukiiko Compact"
africa_priority_buganda_civic_party: "Federal Balance"
africa_priority_buganda_civic_party_long: "Buganda-Uganda Federal Balance"
africa_priority_buganda_producer_party: "Land Reform Compact"
africa_priority_buganda_producer_party_long: "Buganda Cotton and Land Reform Compact"

africa_priority_aksum_sovereign: "The Queen of Aksum"
africa_priority_aksum_sovereign_desc: "The Queen personifies Aksum's restored dignity while the highland settlement keeps sacred heritage, civic authority, and territorial consent distinct."
africa_priority_aksum_council_party: "Heritage Court"
africa_priority_aksum_council_party_long: "Aksum Highland Heritage Court"
africa_priority_aksum_civic_party: "Federal Commonwealth"
africa_priority_aksum_civic_party_long: "Aksum Highland Federal Commonwealth"
africa_priority_aksum_producer_party: "Development Compact"
africa_priority_aksum_producer_party_long: "Aksum Civic Development Compact"

africa_priority_harar_sovereign: "Emir Abdullahi of Harar"
africa_priority_harar_sovereign_desc: "Emir Abdullahi guards Harar's court and walls in a wrapped turban and broad white robe, under a compact with municipal institutions, merchants, endowments, and the communities controlling its water and corridors."
africa_priority_harar_council_party: "Municipal-Court Compact"
africa_priority_harar_council_party_long: "Harar Municipal-Court Compact"
africa_priority_harar_civic_party: "Mercantile Government"
africa_priority_harar_civic_party_long: "Harar Mercantile City Government"
africa_priority_harar_producer_party: "Market Compact"
africa_priority_harar_producer_party_long: "Harar Hinterland Market Compact"

africa_priority_kilwa_sovereign: "The Sultan of Kilwa"
africa_priority_kilwa_sovereign_desc: "The Sultan presides over Kilwa's restored court, but every common tariff, patrol, and maritime judgment still requires the coastal and island compact."
africa_priority_kilwa_council_party: "Coastal-Island Court"
africa_priority_kilwa_council_party_long: "Kilwa Coastal-Island Court"
africa_priority_kilwa_civic_party: "Maritime Federation"
africa_priority_kilwa_civic_party_long: "Kilwa Maritime Federation"
africa_priority_kilwa_producer_party: "Maritime Union"
africa_priority_kilwa_producer_party_long: "Kilwa People's Maritime Union"

africa_priority_nubia_sovereign: "The Kandake of Nubia"
africa_priority_nubia_sovereign_desc: "The Kandake carries the Nile crown while upstream and downstream communities retain their water rights, civic representation, and separate historical memories."
africa_priority_nubia_council_party: "Dual Recognition Court"
africa_priority_nubia_council_party_long: "Nubia Dual Recognition Court"
africa_priority_nubia_civic_party: "River Federation"
africa_priority_nubia_civic_party_long: "Nubia Autonomous River Federation"
africa_priority_nubia_producer_party: "River Union"
africa_priority_nubia_producer_party_long: "Nubia Workers' River Union"

africa_priority_luba_sovereign: "The Mulopwe of Luba"
africa_priority_luba_sovereign_desc: "The Mulopwe holds the Luba crown under a public settlement with civic authorities, mining communities, labour organisations, and the corridor districts."
africa_priority_luba_council_party: "Claimant-Civic Court"
africa_priority_luba_council_party_long: "Luba Claimant-Civic Court"
africa_priority_luba_civic_party: "Mining Federation"
africa_priority_luba_civic_party_long: "Luba Mining Federal Government"
africa_priority_luba_producer_party: "Processing Union"
africa_priority_luba_producer_party_long: "Luba Public Processing Union"

africa_priority_lunda_sovereign: "The Mwaant Yaav of Lunda"
africa_priority_lunda_sovereign_desc: "The Mwaant Yaav leads Lunda through a cross-border compact that subjects royal claims, corridor access, and mining revenue to local consent."
africa_priority_lunda_council_party: "Cross-Border Court"
africa_priority_lunda_council_party_long: "Lunda Cross-Border Court"
africa_priority_lunda_civic_party: "Corridor Confederation"
africa_priority_lunda_civic_party_long: "Lunda Corridor Confederation"
africa_priority_lunda_producer_party: "Resource Union"
africa_priority_lunda_producer_party_long: "Lunda Resource Corridor Union"

africa_priority_great_zimbabwe_sovereign: "The King of Great Zimbabwe"
africa_priority_great_zimbabwe_sovereign_desc: "The King bears the restoration mandate while heritage custodians, rural communities, civic institutions, and mine settlements determine the realm's lawful reach."
africa_priority_great_zimbabwe_council_party: "Restoration Court"
africa_priority_great_zimbabwe_council_party_long: "Great Zimbabwe Restoration Court"
africa_priority_great_zimbabwe_civic_party: "Federal Government"
africa_priority_great_zimbabwe_civic_party_long: "Great Zimbabwe Federal Government"
africa_priority_great_zimbabwe_producer_party: "Agrarian-Mining Union"
africa_priority_great_zimbabwe_producer_party_long: "Great Zimbabwe Agrarian-Mining Union"

africa_priority_merina_sovereign: "Queen Ranavalona III"
africa_priority_merina_sovereign_desc: "Queen Ranavalona III holds the highland crown in a lace-collared embroidered gown with braided hair, a head ornament, and a white fan, under an island compact that protects coastal representation, land reform, labour rights, and Malagasy citizenship."
africa_priority_merina_council_party: "Crown Assembly"
africa_priority_merina_council_party_long: "Merina Crown Assembly"
africa_priority_merina_civic_party: "Malagasy Federation"
africa_priority_merina_civic_party_long: "Merina-Malagasy Federation"
africa_priority_merina_producer_party: "Island Union"
africa_priority_merina_producer_party_long: "Merina People's Island Union"

africa_priority_zulu_sovereign: "The King of the Zulu"
africa_priority_zulu_sovereign_desc: "The Zulu crown awaits an eligible sovereign whose authority depends on lawful land settlement, rural and urban consent, and a professional territorial force."
africa_priority_zulu_council_party: "Crown Assembly"
africa_priority_zulu_council_party_long: "Zulu Crown Assembly"
africa_priority_zulu_civic_party: "Federal State"
africa_priority_zulu_civic_party_long: "Zulu South African Federal State"
africa_priority_zulu_producer_party: "Land-Labour Union"
africa_priority_zulu_producer_party_long: "Zulu Land-Labour Union"

