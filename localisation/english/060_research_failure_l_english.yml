chaosx.nr60.1.t: "Research failure"

chaosx.nr60.2.t: "Research failure"
chaosx.nr60.2.d: "A research project has failed to produce the expected result. Our scientists are examining the data and deciding whether to abandon the work or try again."
chaosx.nr60.2.a: "Failure is part of progress."
chaosx.nr60.2.b: "Let Kruger salvage the programme."
brilliant_scientist_research_failure_prevented_tt: "Doctor Warren Kruger preserves the current research-slot total at the cost of 50 Political Power. Mandate rises by 10 and Dependence by 15. Exposure rises by 10, Project Capacity falls by 5, Independent Capacity falls by 10, and Grievance rises by 10. This intervention can be used once by the active Directorate."

chaosx.news.68.t: "Research failure"
chaosx.news.68.d: "[FROM.GetName] has suffered a research failure. The setback has delayed its laboratories and forced officials to reconsider how they fund scientific work."
chaosx.news.68.a: "I have not failed. I've just found 10,000 ways that won't work."
