l_english:
brilliant_scientist_launch_predictive_campaign: "Launch a Predictive Campaign"
brilliant_scientist_launch_predictive_campaign_desc: "The computational directorate can continuously revise operational plans against intercepted traffic, logistics reports, and the enemy's observed reactions. The resulting campaign is not a forecast but a rolling command system that keeps the army several decisions ahead."
brilliant_scientist_predictive_campaign_cost_tt: "Requires §Y25 Command Power§!, §Y100 Support Equipment§!, §Y50 Trucks§!, §Y500 Fuel§!, §Y1,000 Manpower§!, and two available Civilian Factories."
brilliant_scientist_predictive_campaign_effect_tt: "For ninety days, planning, intelligence-network growth, decryption, and reinforcement speed receive overwhelming computational support."
brilliant_scientist_saturate_sensor_region: "Saturate a Sensor Region"
brilliant_scientist_saturate_sensor_region_desc: "Concentrated emitters, receivers, decoys, and predictive filtering will turn the selected radar-air-defense complex into the anchor of a saturated detection region."
brilliant_scientist_sensor_saturation_cost_tt: "Requires §Y20 Command Power§!, §Y75 Support Equipment§!, §Y250 Fuel§!, and two available Civilian Factories."
brilliant_scientist_sensor_saturation_effect_tt: "For ninety days, the national interception network receives overwhelming detection, mission-efficiency, and anti-air targeting advantages. The selected state is recorded as a saturation anchor."
brilliant_scientist_construct_state_synthesis_works: "Construct State Synthesis Works"
brilliant_scientist_construct_state_synthesis_works_desc: "An industrial core can be rebuilt around self-propagating materials processes. The works consume a major initial stock of instruments and transport but permanently synthesize one strategic resource at industrial scale."
brilliant_scientist_materials_synthesis_cost_tt: "Requires §Y25 Command Power§!, §Y100 Support Equipment§!, §Y50 Trucks§!, §Y500 Fuel§!, §Y1,000 Manpower§!, and three available Civilian Factories."
brilliant_scientist_materials_synthesis_effect_tt: "The selected state permanently gains §Y8§! units of Aluminium, Tungsten, Chromium, or Rubber and is recorded as a synthesis site."
brilliant_scientist_activate_high_speed_strike_network: "Activate the High-Speed Strike Network"
brilliant_scientist_activate_high_speed_strike_network_desc: "Specialized propulsion, heat-resistant materials, and instrumented delivery tables can sustain a national high-speed strike cycle far beyond ordinary rocket and aviation doctrine."
brilliant_scientist_high_speed_strike_cost_tt: "Requires §Y40 Command Power§!, §Y200 Support Equipment§!, §Y100 Trucks§!, §Y1,500 Fuel§!, §Y2,000 Manpower§!, three available Civilian Factories, and an operating military industry."
brilliant_scientist_high_speed_strike_effect_tt: "For ninety days, air range is tripled while strategic bombing, air efficiency, and land attack receive extreme bonuses."
brilliant_scientist_launch_long_range_delivery_strike: "Launch a Long-Range Delivery Strike"
brilliant_scientist_launch_long_range_delivery_strike_desc: "A concentrated wave of guided rockets, exotic propulsion stages, and hardened penetrators can collapse an enemy state's industrial and air-defense network before conventional bombers enter range."
brilliant_scientist_long_range_delivery_cost_tt: "Requires §Y40 Command Power§!, §Y200 Support Equipment§!, §Y100 Trucks§!, §Y1,500 Fuel§!, §Y2,000 Manpower§!, three available Civilian Factories, and an operating military industry."
brilliant_scientist_long_range_delivery_effect_tt: "After fourteen days, factories, infrastructure, air bases, radar, and anti-air installations in the selected enemy state suffer severe damage and repair at one quarter of normal speed. The same state cannot be targeted again for 180 days."
brilliant_scientist_raise_field_projectors: "Raise the Field Projectors"
brilliant_scientist_raise_field_projectors_desc: "A national projector grid can divert reactor output into layered defensive fields and coherent anti-air fire. The grid is ruinously hungry for fuel and precision components, but it can make a conventional assault almost irrelevant."
brilliant_scientist_field_projector_cost_tt: "Requires §Y40 Command Power§!, §Y200 Support Equipment§!, §Y100 Trucks§!, §Y1,500 Fuel§!, §Y2,000 Manpower§!, three available Civilian Factories, and an operating military industry."
brilliant_scientist_field_projector_effect_tt: "For ninety days, national defense, air-superiority support, anti-air hit chance, and nuclear output receive extreme bonuses."
brilliant_scientist_order_emergency_regeneration: "Order Emergency Regeneration"
brilliant_scientist_order_emergency_regeneration_desc: "Mobile growth media, transfusion banks, and accelerated tissue repair can be pushed into the field army. The medical burden is immense, but entire formations can recover before an ordinary replacement system has counted its losses."
brilliant_scientist_emergency_regeneration_cost_tt: "Requires §Y40 Command Power§!, §Y200 Support Equipment§!, §Y100 Trucks§!, §Y1,500 Fuel§!, §Y2,000 Manpower§!, three available Civilian Factories, and an operating military industry."
brilliant_scientist_emergency_regeneration_effect_tt: "For ninety days, reinforcement and recovery are doubled, experience losses are almost eliminated, and supply demand is sharply reduced."
brilliant_scientist_order_epidemic_control: "Order Epidemic Control"
brilliant_scientist_order_epidemic_control_desc: "The Directorate will sequence the outbreak, distribute tailored countermeasures, and redirect the national medical network before conventional authorities can finish naming the pathogen."
brilliant_scientist_epidemic_control_cost_tt: "Requires §Y25 Command Power§!, §Y100 Support Equipment§!, §Y50 Trucks§!, §Y500 Fuel§!, §Y1,000 Manpower§!, and two available Civilian Factories."
brilliant_scientist_epidemic_control_effect_tt: "For ninety days, biomedical research, stability, logistics, and reinforcement receive extreme support."
brilliant_scientist_technology_action_cancelled_tt: "The project became unavailable before activation. No equipment, fuel, manpower, or Command Power was spent."
brilliant_scientist_predictive_campaign_active: "Predictive Campaign"
brilliant_scientist_predictive_campaign_active_desc: "Operational planning and intelligence are being continuously recomputed against the enemy's observed reactions."
brilliant_scientist_sensor_saturation_active: "Sensor Saturation"
brilliant_scientist_sensor_saturation_active_desc: "A saturated detection and interception network dominates the approaches to the country."
brilliant_scientist_high_speed_strike_active: "High-Speed Strike Network"
brilliant_scientist_high_speed_strike_active_desc: "Specialized long-range delivery systems are operating at maximum tempo."
brilliant_scientist_field_projectors_active: "Field Projector Grid"
brilliant_scientist_field_projectors_active_desc: "Reactor output is sustaining layered defensive fields and coherent anti-air fire."
brilliant_scientist_emergency_regeneration_active: "Emergency Regeneration"
brilliant_scientist_emergency_regeneration_active_desc: "Accelerated tissue repair and replacement systems are supporting the field army."
brilliant_scientist_epidemic_control_active: "Epidemic Control"
brilliant_scientist_epidemic_control_active_desc: "Sequencing, tailored countermeasures, and a centralized medical network are suppressing biological crises."
