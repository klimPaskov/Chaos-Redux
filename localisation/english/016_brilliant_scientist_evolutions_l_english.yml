l_english:
brilliant_scientist.evolution.type: "The Kruger Directorate"
brilliant_scientist.evolution.summary: "One brilliant appointment grows into a national institution, an international rivalry, and a fight over who really commands the laboratories."
brilliant_scientist.evolution.1.title: "National Scientific Ascendancy"
brilliant_scientist.evolution.1.desc: "Kruger's laboratory has become part of national life. His methods are spreading through universities, factories, hospitals, and military planning."
brilliant_scientist.evolution.2.title: "The International Scientific Contest"
brilliant_scientist.evolution.2.desc: "Foreign governments are courting Kruger, copying his work, and sending people to steal it. The scientific race is becoming a struggle between states."
brilliant_scientist.evolution.3.title: "Forbidden and Autonomous Science"
brilliant_scientist.evolution.3.desc: "The Directorate is repeating experiments that ordinary ministries can barely understand, much less supervise. Every dangerous success draws more people and facilities into Kruger's private network."
brilliant_scientist.evolution.4.title: "Sovereign Science"
brilliant_scientist.evolution.4.desc: "Kruger has stopped asking permission. He arrives with a demand for political authority and the backing of laboratories, staff, and machines that answer to him."
chaosx.events_log.window.event_details.brilliant_scientist: "Doctor Warren Kruger arrives with working results in fields that rarely fit inside one career, much less one mind. A government can hire him openly, hide him inside a Directorate, or point his talents somewhere else. Wherever he settles, universities, factories, armies, and foreign spies gather around the same guarded rooms.\n\nKruger's laboratory soon becomes an institution with secrets and ambitions of its own. Everyone accepts that he is brilliant. The government must still prove it can command what his brilliance creates."

chaosx.nr16.21.t: "A Nation Rebuilt Around the Laboratory"
chaosx.nr16.21.d: "The first project reports have circulated far beyond Kruger's rooms. Universities reorganize their courses around his notes. Industrial ministries reserve machinery for his trials. General staffs ask what his methods could do under wartime pressure. The Directorate can no longer be treated as one appointment among many. The government must decide how national scientific ascendancy will be governed. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.21.a: "Publish the methods through national lecture circuits."
chaosx.nr16.21.b: "Concentrate the work in one strategic laboratory."
chaosx.nr16.21.c: "Bind every project to an industrial timetable."
chaosx.nr16.21.d_option: "Form a confederation of universities around Kruger."
brilliant_scientist_evolution_i_open_methods_tt: "Spend §R25§! Political Power. Mandate rises by §G15§!, Exposure rises by §R15§!, and Capacity rises by §G5§!. Dependence falls by §G5§!. Open methods widen peer review and ease pressure around the staff."
brilliant_scientist_evolution_i_strategic_laboratory_tt: "Spend §R50§! Political Power. Mandate rises by §G5§!, Dependence rises by §R15§!, Capacity rises by §G15§!, and Exposure falls by §G5§!. Concentrated control narrows public access while hardening pressure inside the Directorate."
brilliant_scientist_evolution_i_industrial_timetable_tt: "Stability and War Support each fall by §R1%§!. Mandate and Exposure rise by §G5§!, Dependence rises by §R10§!, and Capacity rises by §G20§!. Industrial scheduling expands the programme while increasing pressure around the Directorate."
brilliant_scientist_evolution_i_university_confederation_tt: "Spend §R50§! Political Power. Mandate rises by §G15§!, Exposure and Capacity rise by §R10§!, and Dependence falls by §G10§!. A university confederation broadens replication and eases pressure around the staff."

chaosx.nr16.22.t: "Every Embassy Wants the Same Man"
chaosx.nr16.22.d: "Scientific delegations arrive with scholarships, trade concessions, and carefully worded invitations. Intelligence services arrive less openly. Kruger dismisses the attention as proof that the work matters, but his assistants have already begun receiving private offers. The Directorate needs a security posture before observation becomes theft and recruitment becomes extraction. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.22.a: "Place the Directorate under ordinary state security."
chaosx.nr16.22.b: "Assign a permanent military guard."
chaosx.nr16.22.c: "Permit Kruger to maintain his own guard service."
chaosx.nr16.22.d_option: "Ask our allies to share the burden."
chaosx.nr16.22.e: "Keep the laboratories open and disperse the work."
brilliant_scientist_evolution_ii_state_security_tt: "Spend §R25§! Political Power. Mandate, Dependence, and Capacity rise by §R5§!. Exposure falls by §G10§!. State security narrows Kruger's private reach while hardening pressure inside the staff."
brilliant_scientist_evolution_ii_military_guard_tt: "War Support falls by §R1%§!. Mandate rises by §G5§!, Dependence and Capacity rise by §R10§!, and Exposure falls by §G15§!. Military protection narrows private reach while increasing pressure around the Directorate."
brilliant_scientist_evolution_ii_private_guard_tt: "Spend §R50§! Political Power. Dependence rises by §R15§!, Capacity rises by §G10§!, and Mandate and Exposure fall by §G5§!. A private guard expands Kruger's reach while easing immediate pressure around the staff."
brilliant_scientist_evolution_ii_allied_protection_tt: "Spend §R25§! Political Power. Mandate, Exposure, and Capacity rise by §G10§!, and Dependence falls by §G5§!. Allied protection opens the programme while expanding Kruger's private reach and easing staff pressure."
brilliant_scientist_evolution_ii_open_science_tt: "Stability falls by §R1%§!. Mandate rises by §G15§!, Exposure rises by §R20§!, and Capacity rises by §G10§!. Dependence falls by §G10§!. Open science broadens replication and eases pressure around the staff."

chaosx.nr16.23.t: "The Work Continues Without Permission"
chaosx.nr16.23.d: "A sealed chamber has produced results that no approved program requested. The instruments are Directorate property, the staff answer to Kruger, and the surviving records omit the ministry countersignature. Closing the chamber would halt a dangerous line of research. Leaving it open would acknowledge that the Directorate can decide what may be attempted. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.23.a: "Return the Directorate to safe public science."
chaosx.nr16.23.b: "Authorize the secret projects and accept the risk."
chaosx.nr16.23.c: "Negotiate limits directly with Kruger."
brilliant_scientist_evolution_iii_safe_public_science_tt: "Spend §R50§! Political Power. Mandate rises by §G15§!, Exposure rises by §R10§!, Dependence falls by §G10§!, and Capacity falls by §R5§!. Public oversight restrains private reach while pressure builds around the restrictions. Forbidden weaponization is blocked."
brilliant_scientist_evolution_iii_secret_projects_tt: "Stability falls by §R3%§!. Dependence rises by §R20§!, Exposure and Capacity rise by §R15§!, and Mandate falls by §R10§!. Secret projects expand private reach while easing immediate pressure around the staff. Forbidden weaponization is authorized."
brilliant_scientist_evolution_iii_negotiated_limits_tt: "Spend §R25§! Political Power. Mandate rises by §G10§!, Dependence, Exposure, and Capacity rise by §R5§!. Negotiated limits share authority, leave Kruger's private reach room to grow, and ease pressure around the staff. Dangerous work remains subject to negotiated limits."

chaosx.nr16.24.t: "Kruger Demands a Sovereign Mandate"
chaosx.nr16.24.d: "Kruger places a drafted charter on the cabinet table. It grants his Directorate control over laboratories, security, project approval, and the territory needed to sustain them. He claims the state has already accepted these powers in practice. The officials behind him do not look surprised. The answer given today will govern the coming containment crisis. [This.GetBrilliantScientistHostFlavorClause]"
chaosx.nr16.24.a: "Conclude a supervised regional science compact."
chaosx.nr16.24.b: "Grant the Directorate a binding charter."
chaosx.nr16.24.c: "Concede the authority it already exercises."
chaosx.nr16.24.d_option: "Order the military to seize the laboratories."
chaosx.nr16.24.e: "Invite allied services to organize containment."
chaosx.nr16.24.f: "Reject every sovereign claim."
brilliant_scientist_evolution_iv_safe_regional_compact_available_tt: "§YSupervised Regional Compact§! requires either a closed forbidden-science route or §GStable Control§!, §GHigh Mandate§!, §GLow Dependence§!, at least §Y[?constant:brilliant_scientist_evolution_runtime.supervised_compact_replication_families|0] independently replicated project families§!, a safe or negotiated Evolution III doctrine, and no forbidden Weaponization or proven institutional capture."
brilliant_scientist_evolution_iv_safe_regional_compact_tt: "Mandate rises by §G15§!, Capacity rises by §G10§!, Exposure rises by §R5§!, and Dependence falls by §G10§!. A supervised compact binds private reach and eases pressure around the staff. Forbidden autonomy and rebellion remain blocked."
brilliant_scientist_evolution_iv_charter_tt: "Spend §R50§! Political Power. Mandate rises by §G5§!, Dependence rises by §R15§!, and Exposure and Capacity rise by §R10§!. A binding charter enlarges Kruger's private reach while easing immediate pressure. The sovereignty deadline begins."
brilliant_scientist_evolution_iv_concession_tt: "Stability falls by §R3%§!. Mandate falls by §R15§!, Dependence rises by §R20§!, Exposure rises by §R10§!, and Capacity rises by §G15§!. A concession expands private reach while easing immediate pressure. The sovereignty deadline begins."
brilliant_scientist_evolution_iv_military_seizure_tt: "War Support falls by §R3%§!. Mandate and Exposure rise by §G15§!, Dependence falls by §G10§!, and Capacity falls by §R5§!. Seizure constrains private reach but sharply increases pressure inside the Directorate. The sovereignty deadline begins."
brilliant_scientist_evolution_iv_foreign_containment_tt: "Spend §R50§! Political Power. Mandate rises by §G10§!, Exposure rises by §R20§!, Capacity rises by §G5§!, and Dependence falls by §G5§!. Foreign containment limits private reach while increasing pressure around the programme. The sovereignty deadline begins."
brilliant_scientist_evolution_iv_refusal_tt: "Stability falls by §R3%§!. Mandate rises by §G15§!, Exposure rises by §R10§!, and Dependence and Capacity fall by §G5§!. Refusal leaves Kruger more independent and raises pressure around the programme. The sovereignty deadline begins."

brilliant_scientist_sovereignty_deadline_mission: "The Directorate Sovereignty Deadline"
brilliant_scientist_sovereignty_deadline_mission_desc: "The government has [?brilliant_scientist_sovereignty_deadline_days|0] days to turn its declared response into a viable settlement or containment plan. The available time reflects the Directorate's Mandate, dangerous project portfolio, the country's war state, its record of good-faith cooperation, and recent dangerous incidents. When the deadline expires, the result will be determined by authority, dependence, facilities, dangerous projects, the security record, and the unresolved pressure inside the Directorate."
brilliant_scientist_sovereignty_deadline_timeout_tt: "The containment resolution is requested. Prior Directorate choices and material capabilities will determine whether coercion, release, arrest, exile, shutdown, or sovereign separation remains possible."
