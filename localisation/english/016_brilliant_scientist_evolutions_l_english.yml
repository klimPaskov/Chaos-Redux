l_english:
brilliant_scientist.evolution.type: "The Kruger Directorate"
brilliant_scientist.evolution.summary: "One scientist's appointment becomes an institution, an international contest, and finally a struggle over whether scientific authority can remain subordinate to the state."
brilliant_scientist.evolution.1.title: "National Scientific Ascendancy"
brilliant_scientist.evolution.1.desc: "Kruger's laboratory has become a national institution. Its methods now shape universities, factories, and military planning across the country."
brilliant_scientist.evolution.2.title: "The International Scientific Contest"
brilliant_scientist.evolution.2.desc: "Foreign governments have begun to court, copy, and threaten the Directorate. Security policy will determine whether the contest remains scientific."
brilliant_scientist.evolution.3.title: "Forbidden and Autonomous Science"
brilliant_scientist.evolution.3.desc: "The Directorate can reproduce work that ordinary ministries can no longer supervise. Every dangerous success enlarges Kruger's independent network."
brilliant_scientist.evolution.4.title: "Sovereign Science"
brilliant_scientist.evolution.4.desc: "Kruger no longer speaks as an adviser asking permission. He presents a constitutional demand backed by laboratories, personnel, and machines loyal to his command."
chaosx.events_log.window.event_details.brilliant_scientist: "Doctor Warren Kruger arrives with working results in disciplines that rarely share a laboratory, much less one mind. A government may appoint him openly, conceal his work inside a Directorate, or direct his application elsewhere. Wherever he settles, his methods draw universities, factories, armed forces, and foreign services toward the same guarded rooms.\n\nAs the Directorate grows, questions of publication, security, dangerous research, and institutional authority become inseparable. Kruger remains one man, but the facilities, personnel, and projects organized around him may acquire interests of their own."

chaosx.nr16.21.t: "A Nation Rebuilt Around the Laboratory"
chaosx.nr16.21.d: "The first project reports have circulated far beyond Kruger's rooms. Universities reorganize their courses around his notes. Industrial ministries reserve machinery for his trials. General staffs ask what his methods could do under wartime pressure. The Directorate can no longer be treated as one appointment among many. The government must decide how national scientific ascendancy will be governed."
chaosx.nr16.21.a: "Publish the methods through national lecture circuits."
chaosx.nr16.21.b: "Concentrate the work in one strategic laboratory."
chaosx.nr16.21.c: "Bind every project to an industrial timetable."
chaosx.nr16.21.d_option: "Form a confederation of universities around Kruger."
brilliant_scientist_evolution_i_open_methods_tt: "Spend §R25§! Political Power. Mandate rises by §G15§!, Exposure rises by §R15§!, Capacity rises by §G5§!, Independent Capacity rises by §R10§!, Dependence falls by §G5§!, and Grievance falls by §G5§!."
brilliant_scientist_evolution_i_strategic_laboratory_tt: "Spend §R50§! Political Power. Mandate rises by §G5§!, Dependence rises by §R15§!, Capacity rises by §G15§!, Independent Capacity rises by §R5§!, Grievance rises by §R5§!, and Exposure falls by §G5§!."
brilliant_scientist_evolution_i_industrial_timetable_tt: "Stability and War Support each fall by §R1%§!. Mandate and Exposure rise by §G5§!, Dependence and Grievance rise by §R10§!, Capacity rises by §G20§!, and Independent Capacity rises by §R10§!."
brilliant_scientist_evolution_i_university_confederation_tt: "Spend §R50§! Political Power. Mandate and Independent Capacity rise by §G15§!, Exposure and Capacity rise by §R10§!, Dependence falls by §G10§!, and Grievance falls by §G5§!."

chaosx.nr16.22.t: "Every Embassy Wants the Same Man"
chaosx.nr16.22.d: "Scientific delegations arrive with scholarships, trade concessions, and carefully worded invitations. Intelligence services arrive less openly. Kruger dismisses the attention as proof that the work matters, but his assistants have already begun receiving private offers. The Directorate needs a security posture before observation becomes theft and recruitment becomes extraction."
chaosx.nr16.22.a: "Place the Directorate under ordinary state security."
chaosx.nr16.22.b: "Assign a permanent military guard."
chaosx.nr16.22.c: "Permit Kruger to maintain his own guard service."
chaosx.nr16.22.d_option: "Ask our allies to share the burden."
chaosx.nr16.22.e: "Keep the laboratories open and disperse the work."
brilliant_scientist_evolution_ii_state_security_tt: "Spend §R25§! Political Power. Mandate, Dependence, Capacity, and Grievance rise by §R5§!. Exposure falls by §G10§! and Independent Capacity falls by §G5§!."
brilliant_scientist_evolution_ii_military_guard_tt: "War Support falls by §R1%§!. Mandate rises by §G5§!, Dependence and Capacity rise by §R10§!, Grievance rises by §R15§!, Exposure falls by §G15§!, and Independent Capacity falls by §G10§!."
brilliant_scientist_evolution_ii_private_guard_tt: "Spend §R50§! Political Power. Dependence rises by §R15§!, Capacity rises by §G10§!, Independent Capacity rises by §R20§!, Mandate and Exposure fall by §G5§!, and Grievance falls by §G10§!."
brilliant_scientist_evolution_ii_allied_protection_tt: "Spend §R25§! Political Power. Mandate, Exposure, and Capacity rise by §G10§!, Independent Capacity rises by §R5§!, Dependence falls by §G5§!, and Grievance falls by §G5§!."
brilliant_scientist_evolution_ii_open_science_tt: "Stability falls by §R1%§!. Mandate rises by §G15§!, Exposure rises by §R20§!, Capacity and Independent Capacity rise by §G10§!, Dependence falls by §G10§!, and Grievance falls by §G10§!."

chaosx.nr16.23.t: "The Work Continues Without Permission"
chaosx.nr16.23.d: "A sealed chamber has produced results that no approved program requested. The instruments are Directorate property, the staff answer to Kruger, and the surviving records omit the ministry countersignature. Closing the chamber would halt a dangerous line of research. Leaving it open would acknowledge that the Directorate can decide what may be attempted."
chaosx.nr16.23.a: "Return the Directorate to safe public science."
chaosx.nr16.23.b: "Authorize the secret projects and accept the risk."
chaosx.nr16.23.c: "Negotiate limits directly with Kruger."
brilliant_scientist_evolution_iii_safe_public_science_tt: "Spend §R50§! Political Power. Mandate and Grievance rise by §G15§!, Exposure rises by §R10§!, Dependence falls by §G10§!, Capacity falls by §R5§!, and Independent Capacity falls by §G15§!. Forbidden weaponization is blocked."
brilliant_scientist_evolution_iii_secret_projects_tt: "Stability falls by §R3%§!. Dependence rises by §R20§!, Exposure and Capacity rise by §R15§!, Independent Capacity rises by §R25§!, Mandate falls by §R10§!, and Grievance falls by §G10§!. Forbidden weaponization is authorized."
brilliant_scientist_evolution_iii_negotiated_limits_tt: "Spend §R25§! Political Power. Mandate and Independent Capacity rise by §G10§!, Dependence, Exposure, and Capacity rise by §R5§!, and Grievance falls by §G5§!. Dangerous work remains subject to negotiated limits."

chaosx.nr16.24.t: "Kruger Demands a Sovereign Mandate"
chaosx.nr16.24.d: "Kruger places a drafted charter on the cabinet table. It grants his Directorate control over laboratories, security, project approval, and the territory needed to sustain them. He claims the state has already accepted these powers in practice. The officials behind him do not look surprised. The answer given today will govern the coming containment crisis."
chaosx.nr16.24.a: "Conclude a supervised regional science compact."
chaosx.nr16.24.b: "Grant the Directorate a binding charter."
chaosx.nr16.24.c: "Concede the authority it already exercises."
chaosx.nr16.24.d_option: "Order the military to seize the laboratories."
chaosx.nr16.24.e: "Invite allied services to organize containment."
chaosx.nr16.24.f: "Reject every sovereign claim."
