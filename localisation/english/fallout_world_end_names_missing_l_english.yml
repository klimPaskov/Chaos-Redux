l_english:
chaosx.fallout.269.t: "Names for the Missing"
chaosx.fallout.269.d: "[ROOT.GetAirWinterGovernmentAuthority] has a death register with more entries than the shelter office can verify. Families bring scraps of paper to the cold census room, while the military archive marks entire streets as unresolved. Recognition remains low enough that the country can still choose what the public will inherit."
chaosx.fallout.269.a: "Publish the names"
chaosx.fallout.269.b: "Maintain military secrecy"
chaosx.fallout.269.c: "Permit community memorials"
chaosx.fallout.269.d_option: "Delegate to local clerks"
chaosx.fallout.269.a.tt: "Spend [?constant:fallout_event_269_cost.publish_scrap|0] Scrap and [?constant:fallout_event_269_cost.publish_power|0] Power. After [?constant:fallout_event_269_timing.result_delay_days|0] days, the public register is checked against the Deaths ledger, with a follow-up after [?constant:fallout_event_269_timing.callback_delay_days|0] days."
chaosx.fallout.269.b.tt: "Spend [?constant:fallout_event_269_cost.secrecy_scrap|0] Scrap and [?constant:fallout_event_269_cost.secrecy_power|0] Power. The archive keeps the names restricted while officers verify the records over [?constant:fallout_event_269_timing.result_delay_days|0] days."
chaosx.fallout.269.c.tt: "Spend [?constant:fallout_event_269_cost.memorial_food|0] Food and [?constant:fallout_event_269_cost.memorial_scrap|0] Scrap. Community rooms will carry the names through the cold season, with a formal review after [?constant:fallout_event_269_timing.result_delay_days|0] days."
chaosx.fallout.269.d_option.tt: "Spend [?constant:fallout_event_269_cost.clerks_scrap|0] Scrap and [?constant:fallout_event_269_cost.clerks_recognition|0] Recognition. Local clerks reconcile household lists before the register receives a follow-up after [?constant:fallout_event_269_timing.callback_delay_days|0] days."

chaosx.fallout.271.t: "The public register"
chaosx.fallout.271.success.d: "The published register reached the shelter kitchens with names, districts, and the last verified household mark. Families can challenge an entry without reopening the entire ledger, and Recognition has begun to recover."
chaosx.fallout.271.partial.d: "The published register reached the market square with gaps between the Deaths ledger and the family papers. The country has a visible record, but every correction now carries a dispute over who was counted first."
chaosx.fallout.271.failure.d: "The published register broke under the weight of unverified entries. Power failed in the census room, the Deaths ledger lost its cross-check, and the missing names became another source of public fear."
chaosx.fallout.271.a: "Read the register report"
chaosx.fallout.271.a.tt: "Record the public register result and schedule its follow-up. Failure enters losses through the Deaths contract."

chaosx.fallout.272.t: "The restricted archive"
chaosx.fallout.272.success.d: "The military archive sealed the raw lists, assigned each district a custodian, and stopped duplicate claims from taking food tickets twice. The officers have a coherent record, though the public receives only verified totals."
chaosx.fallout.272.partial.d: "The restricted archive kept the lists dry and powered, but the first district returns arrived without household witnesses. Recognition fell as families learned that a complete file could still remain out of reach."
chaosx.fallout.272.failure.d: "The restricted archive lost its intake route when power and clerks failed together. Unverified names were folded into the military file, and the Deaths ledger records the people who waited for a confirmation that never came."
chaosx.fallout.272.a: "Read the archive report"
chaosx.fallout.272.a.tt: "Record the restricted archive result and schedule its follow-up. Failure enters losses through the Deaths contract."

chaosx.fallout.273.t: "The memorial rooms"
chaosx.fallout.273.success.d: "The community memorial rooms kept the names beside the winter ration tables. Neighbors compared family marks, volunteers corrected the first list, and the country gained a shared account of which streets had gone quiet."
chaosx.fallout.273.partial.d: "The memorial rooms opened before the clerks could verify every paper. The gatherings kept the names visible, yet food and scrap ran short when two districts claimed the same shelter places."
chaosx.fallout.273.failure.d: "The memorial rooms became a queue without enough heat or paper. Rival lists were read aloud as accusations, the Deaths ledger gained new entries, and the country lost the common room that had been meant to hold its memory."
chaosx.fallout.273.a: "Read the memorial report"
chaosx.fallout.273.a.tt: "Record the community memorial result and schedule its follow-up. Failure enters losses through the Deaths contract."

chaosx.fallout.274.t: "The local clerks"
chaosx.fallout.274.success.d: "Local clerks carried household sheets from shelter to shelter and returned one signed list to the capital. Their work left the losses intact and made the living legible enough for food, medicine, and a name to meet again."
chaosx.fallout.274.partial.d: "Local clerks reconciled the largest shelters and left the outlying roads unresolved. The central ledger has a usable spine, while Recognition remains uneven wherever the winter patrols cannot reach."
chaosx.fallout.274.failure.d: "Local clerks ran out of power and paper before the outer districts were visited. The central list contradicts the shelter rolls, families lose access to the correction desk, and the Deaths ledger records the resulting shortages."
chaosx.fallout.274.a: "Read the clerks report"
chaosx.fallout.274.a.tt: "Record the local clerks result and schedule its follow-up. Failure enters losses through the Deaths contract."

chaosx.fallout.279.t: "The names after winter"
chaosx.fallout.279.success.d: "The follow-up found a country that can carry its missing names into the next season. The register has a custodian, the shelter rolls share one correction route, and [ROOT.GetAirWinterGovernmentOfficial] can answer a family without opening three separate ledgers."
chaosx.fallout.279.partial.d: "The follow-up found a register that works in the capital and breaks at the edges. The names survive as contested memory, while the country must still decide which local roll will govern the next ration issue."
chaosx.fallout.279.failure.d: "The follow-up found the register room without a working correction route. The Deaths ledger has reopened, families carry duplicate papers through the cold, and [ROOT.GetAirWinterGovernmentAuthority] cannot promise that the next list will be more complete."
chaosx.fallout.279.a: "Close the census review"
chaosx.fallout.279.a.tt: "Record the lasting names memory and release the delayed Fallout receipts."

fallout.event_log.names_missing.name: "Names for the Missing"
fallout.event_log.names_missing.detail: "[GetFalloutEvent269EventLogDetail]"
fallout.event_log.names_missing.detail.publish_success: "The public register linked verified names to the Deaths ledger and restored a measure of Recognition."
fallout.event_log.names_missing.detail.publish_partial: "The public register was visible but left disputes between the Deaths ledger and household papers."
fallout.event_log.names_missing.detail.publish_failure: "The public register failed under a power and verification shortage, leaving the missing names exposed."
fallout.event_log.names_missing.detail.secrecy_success: "The military archive kept a coherent restricted list and prevented duplicate claims."
fallout.event_log.names_missing.detail.secrecy_partial: "The restricted archive held the lists but left families outside the verification route."
fallout.event_log.names_missing.detail.secrecy_failure: "The restricted archive lost its intake route and folded unverified losses into the file."
fallout.event_log.names_missing.detail.memorial_success: "Community memorial rooms kept the names visible and built a shared district record."
fallout.event_log.names_missing.detail.memorial_partial: "Community memorial rooms opened with visible names and unresolved food and shelter claims."
fallout.event_log.names_missing.detail.memorial_failure: "The memorial rooms became a cold queue and the Deaths ledger recorded new losses."
fallout.event_log.names_missing.detail.clerks_success: "Local clerks reconciled shelter rolls into a usable correction route for the country."
fallout.event_log.names_missing.detail.clerks_partial: "Local clerks built a central ledger while leaving outlying roads unresolved."
fallout.event_log.names_missing.detail.clerks_failure: "Local clerks lost their paper and power before the outer districts were recorded."

fallout_names_missing_public_register: "Public Register"
fallout_names_missing_public_register_desc: "A visible register links verified names to ration claims and gives families a route to correct the country's first list."
fallout_names_missing_military_archive: "Military Archive"
fallout_names_missing_military_archive_desc: "A restricted archive protects the raw lists and assigns custodians to districts where duplicate claims threaten scarce supplies."
fallout_names_missing_community_memorial: "Community Memorial Rooms"
fallout_names_missing_community_memorial_desc: "Memorial rooms keep names beside winter ration tables while neighbors compare marks and rebuild a shared district record."
fallout_names_missing_local_clerks: "Local Clerk Network"
fallout_names_missing_local_clerks_desc: "Local clerks carry household sheets between shelters and return signed corrections to the central ledger."
fallout_names_missing_ledger_maintained: "Maintained Names Ledger"
fallout_names_missing_ledger_maintained_desc: "A maintained ledger keeps shelter rolls, food tickets, and correction desks aligned after the first census."
fallout_names_missing_register_backlog: "Names Register Backlog"
fallout_names_missing_register_backlog_desc: "Unverified names remain in a growing backlog, leaving food claims and family corrections exposed to the next shortage."
fallout.event_log.names_missing.detail.callback_success: "The follow-up left one correction route for names, shelter rolls, and ration records."
fallout.event_log.names_missing.detail.callback_partial: "The follow-up left a working capital register and contested local memory."
fallout.event_log.names_missing.detail.callback_failure: "The follow-up reopened the Deaths ledger and left families carrying duplicate papers."
