l_english:
chaosx_nr21_external_2_title: "A New External War"
chaosx_nr21_external_2_desc: "The former government's foreign war has ended. Any new declaration stands on its own and requires territory the opposing government still holds that we recognize as ours. If no such claim remains, this matter can be set aside."
chaosx_nr21_external_2_core: "Declare war for our core territory"
chaosx_nr21_external_2_claim: "Declare war for our claimed territory"
chaosx_nr21_external_2_decline: "Dismiss the notice"
chaosx_nr21_external_2_core_tt: "Begin a new war against [?random_civil_war_external_prompt_opponent_scope.GetNameDef] for territory they own and control that is a core of ours."
chaosx_nr21_external_2_claim_tt: "Begin a new war against [?random_civil_war_external_prompt_opponent_scope.GetNameDef] for territory they own and control that we claim."
