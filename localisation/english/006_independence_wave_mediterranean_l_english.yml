independence_wave_cor_customs_project_tt: "Maritime Access improves. The customs register strengthens state capacity and reduces founding instability."
independence_wave_cor_post_road_project_tt: "Maritime Access improves. The secured road strengthens island security and reduces founding instability."
independence_wave_cor_communes_project_tt: "Maritime Access improves. The communal register advances the wider founding settlement."
independence_wave_cor_government_project_tt: "The chosen settlement establishes Corsica's government and its enduring national institutions."
independence_wave_arx_crisis_failure_tt: "The island authority fractures further. State authority and security decline while founding instability rises."
independence_wave_arx_ledgers_project_tt: "Civic Cohesion improves. Reconciled accounts strengthen state capacity and reduce founding instability."
independence_wave_arx_shipping_project_tt: "Civic Cohesion improves. The restored shipping office strengthens foreign recognition and reduces founding instability."
independence_wave_arx_guards_project_tt: "Civic Cohesion improves. The mountain guards strengthen island security and reduce founding instability."
independence_wave_arx_government_project_tt: "The chosen settlement establishes Sardinia's government and its enduring national institutions."
independence_wave_asx_crisis_failure_tt: "The port authority breaks into rival commands. State authority and security decline while founding instability rises."
independence_wave_asx_port_books_project_tt: "Port Authority improves. Unified port books strengthen state capacity and reduce founding instability."
independence_wave_asx_grain_routes_project_tt: "Port Authority improves. Secured grain routes strengthen state capacity and reduce founding instability."
independence_wave_asx_garrisons_project_tt: "Port Authority improves. Integrated garrisons strengthen island security and reduce founding instability."
independence_wave_asx_italian_property_project_tt: "The property settlement reduces claims, obligations, hostility, and reconquest fears between Sicily and its former host."
independence_wave_asx_government_project_tt: "The chosen settlement establishes Sicily's government and its enduring national institutions."
independence_wave_mediterranean_congress_project_tt: "The island delegation gains a formal mandate, advances its Mediterranean ambition, and begins preparation for a shared maritime charter."

# Corsican focus branch
independence_wave_cor_reopen_ajaccio_customs_focus: "Reopen Ajaccio Customs"
independence_wave_cor_reopen_ajaccio_customs_focus_desc: "The ledgers rescued from Ajaccio's customs house record the obligations of every merchant and commune, yet no island office can enforce them. Reopening the house will give Corsica one place to clear cargoes, hear appeals, and publish lawful tariffs."
independence_wave_cor_reopen_ajaccio_customs_tt: "Maritime Access improves substantially. The customs register strengthens state capacity and reduces founding instability."
independence_wave_cor_secure_mountain_post_road_focus: "Secure the Mountain Post Road"
independence_wave_cor_secure_mountain_post_road_focus_desc: "A government confined to the coast cannot govern Corsica. Repair crews, guarded relays, and inland depots will keep official orders and emergency supplies moving between Ajaccio and the mountain communes."
independence_wave_cor_secure_mountain_post_road_tt: "Maritime Access improves. The secured road strengthens island security and reduces founding instability."
independence_wave_cor_register_coastal_communes_focus: "Register the Coastal Communes"
independence_wave_cor_register_coastal_communes_focus_desc: "Each coastal commune brings its own wharves, storehouses, and customs warrants into independence. A common register will preserve municipal ownership while making those assets legible to the island government."
independence_wave_cor_register_coastal_communes_tt: "Maritime Access improves substantially. The communal register advances legitimacy, recognition, capacity, and security while reducing founding instability."
independence_wave_cor_settle_french_maritime_accounts_focus: "Settle the French Maritime Accounts"
independence_wave_cor_settle_french_maritime_accounts_focus_desc: "French records still govern claims on port buildings, patrol stores, debts, and shipping contracts. A negotiated account will separate Corsican property from former obligations and replace uncertainty with an enforceable frontier settlement."
independence_wave_cor_settle_french_maritime_accounts_tt: "Maritime property, obligations, claims, hostility, and reconquest fears move toward settlement with the former host. Corsican recognition improves and founding instability falls."
independence_wave_cor_authorize_form05_delegation_focus: "Authorize the Maritime Delegation"
independence_wave_cor_authorize_form05_delegation_focus_desc: "Corsica has secured the offices needed to negotiate beyond its own coast. A sovereign delegation will carry convoy guarantees, defense articles, and customs schedules to the other island governments."
independence_wave_cor_authorize_form05_delegation_tt: "Corsica authorizes a delegation to the Mediterranean charter congress, gains standing in the independence network, and advances its regional ambition."

# Sardinian focus branch
independence_wave_arx_reconcile_municipal_ledgers_focus: "Reconcile the Municipal Ledgers"
independence_wave_arx_reconcile_municipal_ledgers_focus_desc: "The municipal books disagree over taxes, maintenance obligations, and property inherited from the old administration. A common register will let Sardinia collect what it is owed without treating every district account as an act of defiance."
independence_wave_arx_reconcile_municipal_ledgers_tt: "Civic Cohesion improves substantially. Reconciled accounts strengthen state capacity and reduce founding instability."
independence_wave_arx_restore_cagliari_shipping_office_focus: "Restore the Cagliari Shipping Office"
independence_wave_arx_restore_cagliari_shipping_office_focus_desc: "Cagliari's shipping office once matched cargoes with berths, repair yards, and convoy schedules. Restored under Sardinian law, it can connect the island's municipal ports to foreign markets without swallowing their local authority."
independence_wave_arx_restore_cagliari_shipping_office_tt: "Civic Cohesion improves. The shipping office strengthens foreign recognition and reduces founding instability."
independence_wave_arx_organize_mountain_guards_focus: "Organize the Mountain Guards"
independence_wave_arx_organize_mountain_guards_focus_desc: "The interior is defended by local watches that know every pass but share neither signals nor reserves. Common sectors and supply tables will turn that knowledge into an island defense."
independence_wave_arx_organize_mountain_guards_tt: "Civic Cohesion improves. The mountain guards strengthen island security and reduce founding instability."
independence_wave_arx_settle_italian_property_focus: "Settle Italian Property"
independence_wave_arx_settle_italian_property_focus_desc: "Archives, port facilities, military stores, and transport property remain burdened by Italian claims. A negotiated settlement will define what belongs to Sardinia and close the accounts that keep reconstruction hostage to the past."
independence_wave_arx_settle_italian_property_tt: "Property, obligations, claims, hostility, and reconquest fears move toward settlement with the former host. The agreement advances Sardinia's wider founding settlement."
independence_wave_arx_convene_island_settlement_focus: "Convene the Island Settlement"
independence_wave_arx_convene_island_settlement_focus_desc: "Municipal delegates, mountain districts, shipping officials, and the chosen government must place their separate bargains into one public statute. The settlement will define the authority that reconstruction has already forced them to share."
independence_wave_arx_convene_island_settlement_tt: "Civic Cohesion improves substantially. The settlement advances legitimacy, recognition, capacity, and security while reducing founding instability."
independence_wave_arx_authorize_form05_delegation_focus: "Authorize the Maritime Delegation"
independence_wave_arx_authorize_form05_delegation_focus_desc: "Sardinia's reconciled districts and shipping offices can support a policy beyond the island. A sovereign delegation will carry convoy guarantees, defense articles, and customs schedules to the other island governments."
independence_wave_arx_authorize_form05_delegation_tt: "Sardinia authorizes a delegation to the Mediterranean charter congress, gains standing in the independence network, and advances its regional ambition."

# Sicilian focus branch
independence_wave_asx_unify_palermo_port_books_focus: "Unify the Palermo Port Books"
independence_wave_asx_unify_palermo_port_books_focus_desc: "Rival manifests and tariff schedules leave the government unable to say which cargoes have paid, cleared quarantine, or received priority. Palermo will publish one civil port book for the whole island."
independence_wave_asx_unify_palermo_port_books_tt: "Port Authority improves substantially. Unified port books strengthen state capacity and reduce founding instability."
independence_wave_asx_secure_interior_grain_routes_focus: "Secure the Interior Grain Routes"
independence_wave_asx_secure_interior_grain_routes_focus_desc: "Sicily's cities and harbors depend on grain moving out of the interior, yet every broken schedule invites seizure and speculation. Guarded routes and accountable depots will make the supply chain a public institution."
independence_wave_asx_secure_interior_grain_routes_tt: "Port Authority improves. Secured grain routes strengthen state capacity and reduce founding instability."
independence_wave_asx_integrate_straits_garrisons_focus: "Integrate the Straits Garrisons"
independence_wave_asx_integrate_straits_garrisons_focus_desc: "The batteries and garrisons around Messina see the same waters but answer through separate commands. Shared warnings, reserve timetables, and reinforcement routes will close the straits as one defensive front."
independence_wave_asx_integrate_straits_garrisons_tt: "Port Authority improves. Integrated garrisons strengthen island security and reduce founding instability."
independence_wave_asx_establish_island_administration_focus: "Establish the Island Administration"
independence_wave_asx_establish_island_administration_focus_desc: "Port ledgers, grain routes, and garrison orders have created a state in practice. A formal island administration will define Palermo's authority and the municipal guarantees that make it lawful."
independence_wave_asx_establish_island_administration_tt: "Port Authority improves substantially. The island administration advances legitimacy, recognition, capacity, and security while reducing founding instability."
independence_wave_asx_settle_italian_state_property_focus: "Settle Italian State Property"
independence_wave_asx_settle_italian_state_property_focus_desc: "Port buildings, military stores, archives, debts, and transport property remain entangled with the former Italian state. Negotiation can convert disputed possession into recognized Sicilian authority."
independence_wave_asx_settle_italian_state_property_tt: "Property, obligations, claims, hostility, and reconquest fears move toward settlement with the former host. Sicilian recognition improves and founding instability falls."
independence_wave_asx_commission_straits_customs_service_focus: "Commission the Straits Customs Service"
independence_wave_asx_commission_straits_customs_service_focus_desc: "The straits are both Sicily's gate and its most exposed frontier. A customs service linking harbor inspectors, pilots, and coastal signals will protect lawful traffic while giving the island a credible maritime border."
independence_wave_asx_commission_straits_customs_service_tt: "Port Authority improves. The customs service strengthens foreign recognition and reduces founding instability."
independence_wave_asx_prepare_two_sicilies_dossier_focus: "Prepare the Two Sicilies Dossier"
independence_wave_asx_prepare_two_sicilies_dossier_focus_desc: "The crown council argues that Sicily cannot be secure while the old kingdom's mainland inheritance lies beyond its authority. Archivists, diplomats, and officers will assemble the claims and plans for a staged restoration."
independence_wave_asx_prepare_two_sicilies_dossier_tt: "Sicily adopts the Two Sicilies restoration program, records claims on Campania and Calabria, and advances its regional ambition."
independence_wave_asx_commit_mediterranean_republic_focus: "Commit to the Mediterranean Republic"
independence_wave_asx_commit_mediterranean_republic_focus_desc: "Sicily can seek influence through islands and sea lanes instead of mainland restoration. A republican maritime mandate will place convoy guarantees, common defense, and a customs league at the center of national policy."
independence_wave_asx_commit_mediterranean_republic_tt: "Sicily authorizes a delegation to the Mediterranean charter congress, gains standing in the independence network, and advances its regional ambition."

# Mediterranean island incidents
chaosx.nr6.21.t: "The Warrants at Ajaccio"
chaosx.nr6.21.d: "Merchants crowd the reopened customs house with warrants issued by communes, French officials, harbor masters, and the Island Guard. All claim legal priority over the same warehouses and cargoes. The first ruling will decide whether Corsica's maritime law grows from communal consent or military necessity."
chaosx.nr6.21.a: "Honor the municipal customs warrants"
chaosx.nr6.21.a.tt: "Maritime Access improves. Respect for the communal books strengthens recognition and reduces founding instability."
chaosx.nr6.21.b: "Give the Island Guard requisition priority"
chaosx.nr6.21.b.tt: "Maritime Access improves modestly. Guard priority strengthens island security and reduces founding instability."

chaosx.nr6.22.t: "Who Keeps Sardinia's Books"
chaosx.nr6.22.d: "The first reconciled ledgers arrive in Cagliari under municipal seals and mountain-guard escort. District clerks insist that civilian accounts must govern every levy. The guards answer that an island under threat cannot wait for each municipality to release food, fuel, and transport in turn."
chaosx.nr6.22.a: "Keep the municipal books in civil hands"
chaosx.nr6.22.a.tt: "Civic Cohesion improves. Civil control strengthens state capacity and reduces founding instability."
chaosx.nr6.22.b: "Give the guards control of emergency supply"
chaosx.nr6.22.b.tt: "Civic Cohesion improves modestly. Guard control strengthens island security and reduces founding instability."

chaosx.nr6.23.t: "The Keys to Palermo's Quays"
chaosx.nr6.23.d: "Palermo's port prefects offer the provisional government their manifests, seals, and experienced clerks, but the straits command demands authority over every military cargo. The quays cannot obey two chains of command. Whichever office receives the keys will shape the island state now forming behind them."
chaosx.nr6.23.a: "Retain the civil port prefects"
chaosx.nr6.23.a.tt: "Port Authority improves. Civil administration strengthens state capacity and reduces founding instability."
chaosx.nr6.23.b: "Place strategic cargo under straits command"
chaosx.nr6.23.b.tt: "Port Authority improves modestly. Command priority strengthens island security and reduces founding instability."

chaosx.nr6.24.t: "Appeals at the Customs Barrier"
chaosx.nr6.24.d: "The new customs schedules have reached the communal harbors, followed immediately by appeals against valuations, exemptions, and requisitions. Municipal delegates demand the right to hear each case where the cargo landed. Guard officers warn that separate judgments will reopen every gap the island customs service was built to close."
chaosx.nr6.24.a: "Let the communes hear the appeals"
chaosx.nr6.24.a.tt: "Maritime Access declines modestly while communal appeals are heard. The settlement strengthens recognition and reduces founding instability."
chaosx.nr6.24.b: "Issue one island customs command"
chaosx.nr6.24.b.tt: "Maritime Access improves. A unified command strengthens island security and reduces founding instability."

chaosx.nr6.25.t: "The District Guarantees"
chaosx.nr6.25.d: "Sardinia's government has asked every district to recognize the reconstruction schedule. The municipalities will sign if their control of local accounts, roads, and relief stores is guaranteed in print. Shipping officials answer that a central decree would be faster and leave no room for obstruction at the ports."
chaosx.nr6.25.a: "Publish guarantees for every district"
chaosx.nr6.25.a.tt: "Civic Cohesion improves. The guarantees advance legitimacy, recognition, capacity, and security while reducing founding instability."
chaosx.nr6.25.b: "Bind the island through a shipping decree"
chaosx.nr6.25.b.tt: "Civic Cohesion improves modestly. Central direction strengthens island security and reduces founding instability."

chaosx.nr6.26.t: "Orders Across the Strait"
chaosx.nr6.26.d: "A disputed cargo at Messina has drawn warrants from Palermo, the municipal port office, and the straits command. Local officials ask for a public review before the manifests are changed. The garrison commanders demand a binding decree that will carry across every Sicilian harbor in time of danger."
chaosx.nr6.26.a: "Convene a municipal port review"
chaosx.nr6.26.a.tt: "Port Authority improves. The public review advances legitimacy, recognition, capacity, and security while reducing founding instability."
chaosx.nr6.26.b: "Issue a binding straits decree"
chaosx.nr6.26.b.tt: "Port Authority improves modestly. The decree strengthens island security and reduces founding instability."

chaosx.nr6.27.t: "The Horizon Beyond Messina"
chaosx.nr6.27.d: "Sicily's ports are secure enough to carry a policy beyond the island. One dossier looks north toward Naples and the mainland inheritance of the Two Sicilies. The other looks across the sea toward sovereign island republics joined by convoy guarantees, common warnings, and a maritime charter."
chaosx.nr6.27.a: "Stage the restoration through the mainland ports"
chaosx.nr6.27.a.tt: "The restoration program strains Port Authority, legitimacy, and recognition while raising security and founding instability. Sicily retains its mainland claims."
chaosx.nr6.27.b: "Take the charter to the island republics"
chaosx.nr6.27.b.tt: "Port Authority and recognition improve. Sicily gains standing in the independence network and receives a mandate for the maritime congress."

