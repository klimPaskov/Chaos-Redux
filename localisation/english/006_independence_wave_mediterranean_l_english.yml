l_english:
# Characters
COR_adolphe_landry: "Adolphe Landry"
COR_adolphe_landry_desc: "A Corsican deputy, economist, and former minister, Landry brings parliamentary experience and Ajaccio's municipal interests into the provisional congress."
COR_jean_chiappe: "Jean Chiappe"
COR_paolo_pietri: "Paolo Pietri"
COR_paolo_pietri_desc: "Pietri reconciles municipal tariff books, harbor warrants, and disputed cargo records so that each commune can trade through a single island customs service."
COR_antone_rocchi: "Antone Rocchi"
COR_antone_rocchi_desc: "Rocchi links mountain depots, post roads, and coastal reserve positions into one defensive plan suited to Corsica's difficult interior."
ARX_emilio_lussu: "Emilio Lussu"
ARX_luigi_mella_santelia: "Luigi Arborio Mella di Sant'Elia"
ARX_vittorio_verne: "Vittorio Verne"
ARX_michele_corda: "Michele Corda"
ARX_michele_corda_desc: "Corda gives Cagliari's shipping offices a national remit, coordinating dock allocations, convoy schedules, and repairs without silencing the island's municipal ports."
ARX_efisio_satta: "Efisio Satta"
ARX_efisio_satta_desc: "Satta brings municipal ledgers, district obligations, and customs receipts into a common treasury while preserving the accounts on which local government depends."
ASX_luigi_sturzo: "Luigi Sturzo"
ASX_pietro_lanza_di_scalea: "Pietro Lanza di Scalea"
ASX_luigi_rizzo: "Luigi Rizzo"
ASX_vincenzo_di_benedetto: "Vincenzo Di Benedetto"
ASX_vincenzo_di_benedetto_desc: "A retired Sicilian general recalled for the synchronized independence emergency, Di Benedetto brings a veteran staff officer's discipline to the island's newly assembled field command."
ASX_giuseppe_lo_giudice: "Giuseppe Lo Giudice"
ASX_giuseppe_lo_giudice_desc: "Lo Giudice unifies Palermo's manifests, tariff schedules, and quarantine rules so that the island's ports answer to a coherent civil authority."
ASX_leone_messina: "Leone Messina"
ASX_leone_messina_desc: "Messina divides the island and the straits into common defensive sectors, with reserve timetables and coastal warning posts shared by every garrison."

