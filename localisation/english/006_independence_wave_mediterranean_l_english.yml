# Package values and national spirits
independence_wave_cor_maritime_access: "Maritime Access"
independence_wave_arx_civic_cohesion: "Civic Cohesion"
independence_wave_asx_port_authority: "Port Authority"

cor_exposed_island_supply: "Exposed Island Supply"
cor_exposed_island_supply_desc: "Corsica's ports, mountain roads, and municipal stores still answer to separate warrants. Convoys wait for clearance while isolated garrisons draw heavily on supplies that the young state can barely replace."
cor_civic_coastal_compact: "Civic Coastal Compact"
cor_civic_coastal_compact_desc: "The communes have reconciled their customs books and supply warrants. Harbors, post roads, and inland depots support one another through an island compact that keeps authority close to the communities it serves."
cor_constitutional_communes: "Constitutional Communes"
cor_constitutional_communes_desc: "Corsica's communes govern through a representative settlement that binds municipal liberties to a common treasury, customs service, and elected island authority."
cor_mountain_communes: "Mountain Communes"
cor_mountain_communes_desc: "The mountain communes retain their customary voice while coordinating workshops, militia rolls, and inland supply through a traditional island congress."
cor_island_guard_mandate: "Island Guard Mandate"
cor_island_guard_mandate_desc: "The Island Guard commands coastal watches, mountain approaches, and emergency requisitions until Corsica's exposed position can be secured."
cor_protected_customs_mandate: "Protected Customs Mandate"
cor_protected_customs_mandate_desc: "A customs authority backed by outside guarantees keeps Corsican cargo moving and attracts contracts, though its leaders must defend the island's freedom of action in every negotiation."

arx_fragmented_island_authority: "Fragmented Island Authority"
arx_fragmented_island_authority_desc: "Municipal books, mountain districts, and Cagliari's shipping offices recognize no settled chain of authority. Roads decay between jurisdictions while escorts and cargoes wait for orders that no single office can issue."
arx_sardinian_reconstruction_council: "Sardinian Reconstruction Council"
arx_sardinian_reconstruction_council_desc: "District delegates, shipping officials, engineers, and municipal clerks share a reconstruction schedule. The council directs roads and docks through reconciled accounts without erasing the island's local institutions."
arx_island_constitution: "Sardinian Island Constitution"
arx_island_constitution_desc: "An elected island assembly balances the authority of Cagliari with guarantees for the municipalities and mountain districts."
arx_sardinian_labor_compact: "Sardinian Labor Compact"
arx_sardinian_labor_compact_desc: "Dockworkers, miners, transport crews, and municipal labor chambers coordinate production and representation through a common island compact."
arx_crown_consultative_state: "Crown Consultative State"
arx_crown_consultative_state_desc: "A crown council presides over Sardinia through district consultation, inherited institutions, and a carefully limited central administration."
arx_mountain_guard_directorate: "Mountain Guard Directorate"
arx_mountain_guard_directorate_desc: "Mountain guards, coastal posts, and reserve columns answer to a single emergency directorate built to defend a divided island with little warning."

asx_contested_port_authority: "Contested Port Authority"
asx_contested_port_authority_desc: "Palermo's prefects, eastern harbors, inland grain offices, and the straits garrisons issue rival orders. Cargo stalls at the quays while food and military supplies move through uncertain chains of command."
asx_trinacrian_state_compact: "Trinacrian State Compact"
asx_trinacrian_state_compact_desc: "Port prefects, municipal delegates, grain offices, and the straits command have accepted one island compact. Sicily's harbors can trade and defend themselves through institutions recognized from Palermo to Messina."
asx_palermo_constitution: "Palermo Constitution"
asx_palermo_constitution_desc: "A constitutional assembly in Palermo makes the port authority answerable to elected municipalities and a representative island government."
asx_chambers_of_labor_compact: "Chambers of Labor Compact"
asx_chambers_of_labor_compact_desc: "The island's dock, transport, agricultural, and industrial chambers share authority through a compact that joins production to popular representation."
asx_two_sicilies_crown_council: "Two Sicilies Crown Council"
asx_two_sicilies_crown_council_desc: "A consultative crown council claims continuity with the kingdom that once joined Palermo and Naples, giving Sicily an old language for its new ambitions."
asx_straits_security_directorate: "Straits Security Directorate"
asx_straits_security_directorate_desc: "The straits garrisons, coastal batteries, and island reserves answer to a security directorate that treats every harbor approach as part of one defensive front."
asx_protected_mediterranean_mandate: "Protected Mediterranean Mandate"
asx_protected_mediterranean_mandate_desc: "External contracts and guarantees sustain Sicily's ports and factories under a protected mandate whose ministers bargain constantly to preserve the island's sovereignty."

# Decision categories
independence_wave_cor_corsica_category: "The Corsican Coastal Compact"
independence_wave_cor_corsica_category_desc: "§YMaritime Access:§! [?independence_wave_cor_maritime_access|0]/[?constant:independence_wave_mediterranean_pressure.maximum|0]\n\nCorsica must make its municipal customs houses, mountain post roads, coastal communes, and island guard serve one state. Projects commit real administrative, diplomatic, or military resources. Interrupted work weakens the founding settlement."
independence_wave_arx_sardinia_category: "The Sardinian Reconstruction"
independence_wave_arx_sardinia_category_desc: "§YCivic Cohesion:§! [?independence_wave_arx_civic_cohesion|0]/[?constant:independence_wave_mediterranean_pressure.maximum|0]\n\nSardinia's municipalities, mountain districts, and Cagliari shipping offices must accept a common public authority. Projects commit real administrative, diplomatic, or military resources. Interrupted work deepens the island's divisions."
independence_wave_asx_sicily_category: "The Trinacrian Settlement"
independence_wave_asx_sicily_category_desc: "§YPort Authority:§! [?independence_wave_asx_port_authority|0]/[?constant:independence_wave_mediterranean_pressure.maximum|0]\n\nPalermo, the inland grain offices, the eastern ports, and the straits command must be joined by institutions that all Sicily can obey. Projects commit real administrative, diplomatic, or military resources. Interrupted work leaves the ports divided."

# Corsican decisions and mission
independence_wave_cor_hold_island_supply_together: "Hold the Island Supply System Together"
independence_wave_cor_hold_island_supply_together_desc: "Customs warrants, convoy schedules, mountain depots, and municipal stores are drifting apart. Restore enough Maritime Access before the emergency deadline. Losing the capital or allowing the deadline to expire will deepen the founding crisis."
independence_wave_cor_reopen_ajaccio_customs_house: "Reopen the Ajaccio Customs House"
independence_wave_cor_reopen_ajaccio_customs_house_desc: "Reconcile harbor warrants, tariff books, and disputed cargo records under an island customs office. If Ajaccio falls before the work is complete, the scattered records will leave Maritime Access worse than before."
independence_wave_cor_secure_mountain_post_road: "Secure the Mountain Post Road"
independence_wave_cor_secure_mountain_post_road_desc: "Place repair crews, guards, and reserve stores along the road that connects the coastal offices with the mountain communes. Losing the capital during the operation will break the new supply schedule."
independence_wave_cor_register_coastal_communes: "Register the Coastal Communes"
independence_wave_cor_register_coastal_communes_desc: "Bring municipal wharves, storehouses, and customs warrants into a single public register without extinguishing communal ownership. The completed register will give the island state a reliable civil foundation."
independence_wave_cor_constitutional_communes: "Form the Constitutional Communes"
independence_wave_cor_constitutional_communes_desc: "Entrust Adolphe Landry with a representative settlement that protects communal liberties while binding customs, finance, and foreign affairs to an elected island authority."
independence_wave_cor_mountain_communes: "Convene the Mountain Communes"
independence_wave_cor_mountain_communes_desc: "Entrust Adolphe Landry with a traditional congress of mountain and coastal communes responsible for supply, militia obligations, and the island's common affairs."
independence_wave_cor_island_guard_mandate: "Grant the Island Guard Mandate"
independence_wave_cor_island_guard_mandate_desc: "Give Jean Chiappe temporary authority over coastal watches, mountain approaches, reserve columns, and emergency requisitions."
independence_wave_cor_protected_customs_mandate: "Establish the Protected Customs Mandate"
independence_wave_cor_protected_customs_mandate_desc: "Authorize Adolphe Landry to accept external guarantees and commercial contracts through a protected customs authority that remains answerable for Corsican sovereignty."
independence_wave_cor_prepare_maritime_congress: "Prepare the Maritime Congress"
independence_wave_cor_prepare_maritime_congress_desc: "Prepare Corsican shipping guarantees, defense articles, and customs schedules for negotiation with the other island governments. The delegation requires secure Maritime Access, recognition, and a place in the independence network."

# Sardinian decisions and mission
independence_wave_arx_hold_island_authority_together: "Hold the Island Authority Together"
independence_wave_arx_hold_island_authority_together_desc: "Municipal ledgers, mountain districts, and Cagliari's shipping offices still pull in different directions. Restore enough Civic Cohesion before the emergency deadline. Losing the capital or allowing the deadline to expire will deepen the founding crisis."
independence_wave_arx_reconcile_municipal_ledgers: "Reconcile the Municipal Ledgers"
independence_wave_arx_reconcile_municipal_ledgers_desc: "Bring district obligations, tax receipts, and municipal accounts into a common register. If Cagliari falls before the work is complete, disputed books will further divide the island authority."
independence_wave_arx_restore_cagliari_shipping_office: "Restore the Cagliari Shipping Office"
independence_wave_arx_restore_cagliari_shipping_office_desc: "Reopen the office that assigns berths, convoy schedules, repairs, and island cargo priorities. Its records will connect Sardinia's municipal ports without placing every wharf under direct rule from Cagliari."
independence_wave_arx_organize_mountain_guards: "Organize the Mountain Guards"
independence_wave_arx_organize_mountain_guards_desc: "Combine local guards, road watches, and reserve detachments under common sectors and supply tables suited to the island's interior."
independence_wave_arx_form_island_constitution: "Form the Island Constitution"
independence_wave_arx_form_island_constitution_desc: "Entrust Emilio Lussu with a representative constitution that balances Cagliari's national authority with guarantees for the municipalities and mountain districts."
independence_wave_arx_ratify_labor_compact: "Ratify the Sardinian Labor Compact"
independence_wave_arx_ratify_labor_compact_desc: "Entrust Emilio Lussu with a compact joining dockworkers, miners, transport crews, and municipal labor chambers in the island government."
independence_wave_arx_seat_crown_council: "Seat the Crown Consultative Council"
independence_wave_arx_seat_crown_council_desc: "Invite Luigi Arborio Mella di Sant'Elia, a Sassari-born royal-court statesman, to preside over a consultative state that joins inherited authority to district guarantees and a limited central administration."
independence_wave_arx_install_mountain_guard: "Install the Mountain Guard Directorate"
independence_wave_arx_install_mountain_guard_desc: "Place Vittorio Verne, a Sardinia-linked Italian commander, at the head of an emergency directorate unifying mountain guards, coastal posts, and reserve columns."
independence_wave_arx_prepare_maritime_congress: "Prepare the Maritime Congress"
independence_wave_arx_prepare_maritime_congress_desc: "Prepare Sardinian shipping guarantees, defense articles, and customs schedules for negotiation with the other island governments. The delegation requires secure Civic Cohesion, recognition, and a place in the independence network."

# Sicilian decisions and mission
independence_wave_asx_hold_port_authority_together: "Hold the Port Authority Together"
independence_wave_asx_hold_port_authority_together_desc: "Palermo's prefects, the eastern ports, inland grain offices, and the straits garrisons continue to issue rival orders. Restore enough Port Authority before the emergency deadline. Losing the capital or allowing the deadline to expire will deepen the founding crisis."
independence_wave_asx_unify_palermo_port_books: "Unify the Palermo Port Books"
independence_wave_asx_unify_palermo_port_books_desc: "Reconcile manifests, tariffs, quarantine rules, and cargo claims through a civil office in Palermo. If the capital falls before the books are closed, the ports will return to rival procedures."
independence_wave_asx_secure_interior_grain_routes: "Secure the Interior Grain Routes"
independence_wave_asx_secure_interior_grain_routes_desc: "Assign administrators, transport crews, and guards to the roads and rail links that carry grain from the interior to Sicily's cities and harbors."
independence_wave_asx_integrate_straits_garrisons: "Integrate the Straits Garrisons"
independence_wave_asx_integrate_straits_garrisons_desc: "Give the Messina approaches, coastal batteries, and island reserves a common warning system, reinforcement schedule, and chain of command."
independence_wave_asx_settle_italian_state_property: "Settle Italian State Property"
independence_wave_asx_settle_italian_state_property_desc: "Negotiate port buildings, military stores, archives, debts, and transport property with our former host. War or the loss of Palermo will end the talks before an enforceable settlement can be reached."
independence_wave_asx_form_palermo_constitution: "Form the Palermo Constitution"
independence_wave_asx_form_palermo_constitution_desc: "Entrust Luigi Sturzo with a constitutional assembly that makes Palermo's port authority answerable to elected municipalities and a representative island government."
independence_wave_asx_ratify_labor_compact: "Ratify the Chambers of Labor Compact"
independence_wave_asx_ratify_labor_compact_desc: "Entrust Luigi Sturzo with a compact joining dock, transport, agricultural, and industrial chambers in the government of the island."
independence_wave_asx_seat_crown_council: "Seat the Two Sicilies Crown Council"
independence_wave_asx_seat_crown_council_desc: "Invite Pietro Lanza di Scalea to preside over a consultative council that claims institutional continuity with the old kingdom of Palermo and Naples."
independence_wave_asx_install_security_directorate: "Install the Straits Security Directorate"
independence_wave_asx_install_security_directorate_desc: "Place Luigi Rizzo at the head of a directorate unifying the straits garrisons, coastal defenses, and island reserves."
independence_wave_asx_install_patron_mandate: "Install the Protected Mediterranean Mandate"
independence_wave_asx_install_patron_mandate_desc: "Authorize Luigi Sturzo to accept external guarantees and commercial contracts through a protected authority charged with defending Sicily's sovereignty."
independence_wave_asx_prepare_maritime_congress: "Prepare the Maritime Congress"
independence_wave_asx_prepare_maritime_congress_desc: "Prepare Sicilian shipping guarantees, defense articles, and customs schedules for negotiation with the other island governments. The delegation requires secure Port Authority, recognition, and a place in the independence network."

