l_english:
# Participant reports and public news for the Antarctic expedition race.
chaosx.nr25.10.t: "South Across the Ocean"
chaosx.nr25.10.d: "The expedition's stores are loaded and its route is fixed. The ships of the southern crossing are [This.GetChaosxNr25DepartureShipping]. From here on, weather, ice and rival expeditions decide how much of the expedition reaches the gateway."
chaosx.nr25.10.a: "Fair winds."
chaosx_nr25_departure_owned: "our own"
chaosx_nr25_departure_chartered: "neutral vessels chartered for the voyage"
chaosx.nr25.12.t: "The Gateway Closes"
chaosx.nr25.12.d: "Our expedition could not keep its planned gateway open. Pack ice, storms and lost stores forced the crews onto an improvised inland route. They are still moving, but slower and with less margin than planned."
chaosx.nr25.12.a: "Keep moving."
chaosx.nr25.14.t: "The Expedition Comes Home"
chaosx.nr25.14.d: "Our evacuation has brought the expedition home with its verified survey and fragment records. Our part in the race is over, but what the expedition learned stays with us."
chaosx.nr25.14.t_failed: "The Evacuation Breaks Down"
chaosx.nr25.14.d_failed: "The evacuation window closed before the last of the expedition could reach the ships. [This.GetChaosxNr25FieldCasualtyLine] The survivors are home with whatever verified records they could carry, and our part in the race is over."
chaosx.nr25.14.a: "Close the expedition's file."
chaosx_nr25_evacuation_report_tt: "Our verified survey and fragment records stay with us. We cannot rejoin this race."
chaosx.nr25.20.t: "A Camp on the Ice"
chaosx.nr25.20.d: "Our expedition has raised its first permanent camp on the Antarctic ice. Radio masts, fuel dumps and survey huts now give the crews a base for the search."
chaosx.nr25.20.a: "Hold the camp."
chaosx.nr25.21.t: "The Camp Is Lost"
chaosx.nr25.21.d: "Our Antarctic camp has been lost. Its security has collapsed, the crews have pulled back, and the expedition has lost ground in the race."
chaosx.nr25.21.a: "We will take it back."
chaosx_nr25_outpost_lost_tt: "Reinforcing the outpost restores it."
chaosx.nr25.22.t: "The Camp Is Restored"
chaosx.nr25.22.d: "Fresh crews and stores have reopened our Antarctic camp. The flag is back on the mast, and the survey teams have somewhere to return to."
chaosx.nr25.22.a: "Good work."
chaosx.nr25.30.t: "A Probable Site"
chaosx.nr25.30.d: "Our survey teams have found readings that point to the buried core. The evidence is not yet conclusive, but the expedition now knows where to dig."
chaosx.nr25.30.a: "Focus the survey."
chaosx_nr25_probable_site_tt: "The sector is marked as probable on our Expedition Board. Confirming it opens the final recovery."
chaosx.nr25.31.t: "The Site Is Confirmed"
chaosx.nr25.31.d: "Our crews have confirmed the location of the buried core. The expedition can now prepare the final recovery."
chaosx.nr25.31.a: "Prepare the recovery."
chaosx_nr25_site_confirmed_tt: "The final recovery phase opens once the expedition's other preparations are in place."
chaosx.nr25.32.t: "A False Lead"
chaosx.nr25.32.d: "Our signal teams have found that the coordinates guiding part of our survey were wrong from the start. Someone altered them. The search must start again in that sector."
chaosx.nr25.32.a: "Check every map."
chaosx.nr25.40.t: "A Fragment Recovered"
chaosx.nr25.40.d: "Our teams have recovered an exclusive fragment of the alien-derived wreck. No other expedition can claim it while it remains in our custody."
chaosx.nr25.40.a: "Send it to the laboratories."
chaosx.nr25.41.t: "A Fragment Lost"
chaosx.nr25.41.d: "Our government no longer controls the laboratory that held our fragment of the alien-derived wreck. The material has been lost, and any expedition may now claim it."
chaosx.nr25.41.a: "It is out of our hands."
chaosx.nr25.50.t: "Rescued on the Ice"
chaosx.nr25.50.d: "When our expedition faced the loss of its crews, [From.GetNameDefCap] sent its own teams across the ice to bring them out. Our people are safe."
chaosx.nr25.50.a: "We will not forget this."
chaosx_nr25_rescue_received_tt: "Our opinion of [From.GetNameDef] improves."
chaosx.nr25.51.t: "The Rescue Succeeds"
chaosx.nr25.51.d: "Our teams have brought [From.GetNameDef]'s stranded crews out of danger. Whatever the race brings, that debt will be remembered."
chaosx.nr25.51.a: "Back to the work."
chaosx.nr25.60.t: "Something Went Wrong at the Camp"
chaosx.nr25.60.d: "[This.GetChaosxNr25SabotageKindText] Our people suspect deliberate interference, but nobody can say who was responsible."
chaosx.nr25.60.a: "Tighten security."
chaosx_nr25_sabotage_countermeasure_tt: "A countermeasure can prepare the expedition against the next attempt."
chaosx.nr25.61.t: "Sabotage Identified"
chaosx.nr25.61.d: "[This.GetChaosxNr25SabotageKindText] Our security officers have traced the operation to [From.GetNameDef]."
chaosx.nr25.61.a: "Accuse them before the world."
chaosx.nr25.61.b: "Keep it quiet, and remember."
chaosx_nr25_accuse_publicly_tt: "We present the evidence publicly, which raises world tension. [From.GetNameDefCap] must deny it, compensate us or admit a limited operation."
chaosx_nr25_keep_quiet_tt: "No public incident. Our expedition keeps what its security officers learned: Intelligence §G+[?constant:chaosx_nr25_incident.quiet_intelligence|0]§!."
chaosx_nr25_sabotage_attributed_tt: "Our opinion of [From.GetNameDef] worsens."
chaosx_nr25_sabotage_kind_survey: "Survey records were copied from our field stations."
chaosx_nr25_sabotage_kind_coordinates: "An attempt was made to alter the coordinates our surveys rely on."
chaosx_nr25_sabotage_kind_stores: "Our camp's stores were spoiled overnight."
chaosx_nr25_sabotage_kind_convoy: "A supply convoy bound for our expedition was intercepted."
chaosx_nr25_sabotage_kind_equipment: "Equipment at our camps was wrecked."
chaosx.nr25.165.t: "An Armed Incident in Antarctica"
chaosx.nr25.165.d: "[From.GetNameDefCap] has turned its guns on our expedition. [This.GetChaosxNr25ClashKindText][This.GetChaosxNr25ClashCasualtyLine] No war has been declared, but the race has turned violent."
chaosx.nr25.165.a: "Protest it before the world."
chaosx.nr25.165.b: "Offer them a demilitarised corridor."
chaosx.nr25.165.c: "Reinforce the camp."
chaosx.nr25.165.e: "Demand our people and our records back."
chaosx_nr25_clash_demand_tt: "[From.GetNameDefCap] is asked to release our detained crews and return the survey records and the fragment it carried off. It may refuse."
chaosx_nr25_clash_protest_tt: "The incident goes on the public record and world tension rises. For §Y[?constant:chaosx_nr25_militarisation.protest_days|0]§! days the attacking government thinks twice before another armed action against us."
chaosx_nr25_clash_negotiate_tt: "[From.GetNameDefCap] is offered a demilitarised corridor and decides whether to accept it."
chaosx_nr25_clash_reinforce_tt: "Outpost security §G+[?constant:chaosx_nr25_militarisation.reinforce_security|0]§! and Logistics Readiness §G+[?constant:chaosx_nr25_militarisation.reinforce_readiness|0]§!; the camp becomes a security zone and the ice grows more militarised."
chaosx_nr25_clash_opinion_tt: "Our opinion of [From.GetNameDef] worsens."
chaosx_nr25_clash_kind_blockade: "Its warships blockaded our approach."
chaosx_nr25_clash_kind_seize: "Its troops landed at our camp and seized it."
chaosx_nr25_clash_kind_intercept: "Its patrols intercepted our field teams."
chaosx.nr25.90.t: "Expeditions Take Hold in Antarctica"
chaosx.nr25.90.d: "[chaosx_nr25_milestone_actor.GetNameDefCap] [This.GetChaosxNr25FirstMilestoneText] Observers say the race for the alien-derived wreck has moved from the ships to the ice itself."
chaosx.nr25.90.a: "The race is on."
chaosx_nr25_news_milestone_outpost: "has raised the first permanent camp near the buried wreck."
chaosx_nr25_news_milestone_fragment: "has recovered the first verified fragment of the buried wreck."
chaosx.nr25.91.t: "Shots Fired on the Ice"
chaosx.nr25.91.d: "Forces of [chaosx_nr25_clash_actor.GetNameDef] have clashed with a rival expedition in Antarctica. Governments insist the incident is local, but the expeditions are arming."
chaosx.nr25.91.a: "A dangerous turn."
chaosx.nr25.92.t: "Accident at an Alien Research Site"
chaosx.nr25.92.d: "[chaosx_nr25_crisis_actor.GetNameDefCap] has admitted a fatal accident in its programme to study alien-derived material. Survivors describe operators who kept following the system's cues after they were ordered to stop."
chaosx.nr25.92.a: "What are they keeping?"
chaosx.nr25.93.t: "A Hidden Programme Revealed"
chaosx.nr25.93.d: "The handover of alien-derived material has exposed a programme [chaosx_nr25_exposed_actor.GetNameDef] had kept secret. Its scale and its accidents are now public."
chaosx.nr25.93.a: "Secrets do not keep."
chaosx.nr25.89.t: "The Expedition Is Recalled"
chaosx.nr25.89.d: "Our Antarctic expedition has gone §Y[?constant:chaosx_nr25_stall.phase_stall_days|0]§! days without reaching a new stage or launching a new operation. The government has recalled the crews. The survey notes and fragments they verified remain ours, but the expedition has left the race."
chaosx.nr25.89.a: "Bring them home."
chaosx.nr25.13.t: "Our Antarctic Route Is Cut"
chaosx.nr25.13.d: "Every port on our expedition's gateway route is now held by a country at war with us. Supply ships turn back, the stores waiting on the quays are seized, and the crews in the south have to stretch what they carry. Logistics Readiness falls by §R[?constant:chaosx_nr25_gateway.interruption_readiness_loss|0]§!. We can chart an alternate landing or hire neutral ships to restore the route."
chaosx.nr25.13.a: "Find another way south."
chaosx.nr25.301.t: "Pack Ice Closes the Channel"
chaosx.nr25.301.d: "Pack ice drove into the channel our supply ships use and pinned two of them for weeks. Stores had to be hauled across the floes by hand, and the survey parties waited on the coast for cargo that never came.\n\nEscorted convoys, or a gateway port we hold ourselves, would have kept the channel open."
chaosx.nr25.301.d_prepared: "Pack ice drove into the supply channel, but with escorts at sea or a port of our own close by, the ships came in late rather than not at all. The delay cost half of what it could have."
chaosx.nr25.301.a: "Haul what we can."
chaosx_nr25_hazard_pack_ice_tt: "Expedition Progress §R-[?chaosx_nr25_hazard_progress_loss|0]§!, Logistics Readiness §R-[?chaosx_nr25_hazard_readiness_loss|0]§!."
chaosx.nr25.302.t: "Whiteout on the Plateau"
chaosx.nr25.302.d: "A whiteout swallowed the camp for nine days. Field parties lost the flag lines, a tractor drove in circles until its tank ran dry, and the search for the missing kept everyone out in the open.\n\nA recruited polar crew, used to travelling blind, would have kept the parties together."
chaosx.nr25.302.d_prepared: "A whiteout swallowed the camp, but the polar crew we recruited kept the parties roped together and brought everyone in along the flag lines. We lost days, not people."
chaosx.nr25.302.a: "Wait for the light."
chaosx_nr25_hazard_whiteout_tt: "Exposure Risk §R+[?chaosx_nr25_hazard_exposure_gain|0]§!, Logistics Readiness §R-[?chaosx_nr25_hazard_readiness_loss|0]§!."
chaosx.nr25.303.t: "A Crevasse Field Opens"
chaosx.nr25.303.d: "A traverse party crossed a snow bridge that gave way beneath the second sledge. The rescue took two days, [?constant:chaosx_nr25_casualty.hazard|0] members of the expedition were lost, and the route had to be abandoned.\n\nAn aerial survey of the route would have marked the crevasse field before anyone set foot on it."
chaosx.nr25.303.d_prepared: "A traverse party reached a crevasse field our aerial survey had marked. They roped up, probed every step and turned back with their sledges intact."
chaosx.nr25.303.a: "Find another way round."
chaosx_nr25_hazard_crevasse_tt: "Logistics Readiness §R-[?chaosx_nr25_hazard_readiness_loss|0]§!. Field crews lost: §R[?chaosx_nr25_hazard_crew_loss|0]§!."
chaosx.nr25.304.t: "The Radios Go Silent"
chaosx.nr25.304.d: "A magnetic storm and a burnt-out generator cut the camp off from the coast and from home. For two weeks survey notes piled up unsent, and stories about our silence spread among the other expeditions.\n\nA radio net with relay stations would have kept a channel open."
chaosx.nr25.304.d_prepared: "A magnetic storm knocked out the camp's main set, but the relay stations of our radio net kept a slower channel open and most of the survey notes got through."
chaosx.nr25.304.a: "Get the generator running."
chaosx_nr25_hazard_radio_loss_tt: "Intelligence §R-[?chaosx_nr25_hazard_intelligence_loss|0]§!, Exposure Risk §R+[?chaosx_nr25_hazard_exposure_gain|0]§!."
chaosx.nr25.305.t: "Engines Fail in the Cold"
chaosx.nr25.305.d: "Cold-soaked engines cracked their blocks on the morning start. Aircraft and tractors stood idle while replacement parts and fresh fuel were shipped south at our expense.\n\nThe spares of a forward depot would have kept most of them running."
chaosx.nr25.305.d_prepared: "Cold-soaked engines cracked on the morning start, but the forward depot's spares had most of them running again within days."
chaosx.nr25.305.a: "Ship the parts."
chaosx_nr25_hazard_engines_tt: "Logistics Readiness §R-[?chaosx_nr25_hazard_readiness_loss|0]§!, £GFX_fuel_texticon §R-[?chaosx_nr25_hazard_fuel_loss|0]§!."
chaosx.nr25.306.t: "Sledges and Tractors Lost"
chaosx.nr25.306.d: "A storm buried the sledge park, and two tractors went through rotten sea ice on the way back. The survey parties lost their transport and their timetable with it.\n\nA camp run as a logistics depot or a traverse camp would have kept spare sledges and vehicles at hand."
chaosx.nr25.306.d_prepared: "A storm buried the sledge park, but the camp kept spare sledges and vehicles for exactly this, and the parties were moving again within the week."
chaosx.nr25.306.a: "Dig them out."
chaosx_nr25_hazard_sledges_tt: "Expedition Progress §R-[?chaosx_nr25_hazard_progress_loss|0]§!, Logistics Readiness §R-[?chaosx_nr25_hazard_readiness_loss|0]§!."
chaosx.nr25.307.t: "Sickness in the Camp"
chaosx.nr25.307.d: "A sickness ran through the camp. The medical stores ran short, the field parties were called in, and [?constant:chaosx_nr25_casualty.hazard|0] members of the expedition could not be saved.\n\nA crew rotated home in good time would have kept the camp healthy."
chaosx.nr25.307.d_prepared: "A sickness ran through the camp, but the fresh crew rotated in this season shook it off and the medical stores held. The field parties lost only a few days."
chaosx.nr25.307.a: "Send for more medicine."
chaosx_nr25_hazard_medical_tt: "Logistics Readiness §R-[?chaosx_nr25_hazard_readiness_loss|0]§!. Field crews lost: §R[?chaosx_nr25_hazard_crew_loss|0]§!."
chaosx.nr25.311.t: "An Abandoned Camp"
chaosx.nr25.311.d: "Our field party found huts half-buried in drift: a camp left by an expedition decades ago. The stores are frozen but sound, and the leader's logbooks lie on the table where he left them, full of soundings and sketches of the ice. Moving the stores would disturb the site and draw attention; copying the logbooks would cost the party time."
chaosx.nr25.311.a: "Salvage the stores."
chaosx.nr25.311.a.tt: "Logistics Readiness §G+[?constant:chaosx_nr25_incident.camp_salvage_readiness|0]§!, Exposure Risk §R+[?constant:chaosx_nr25_incident.camp_salvage_exposure|0]§!."
chaosx.nr25.311.b: "Copy the logbooks."
chaosx.nr25.311.b.tt: "Intelligence §G+[?constant:chaosx_nr25_incident.camp_logs_intelligence|0]§!, Expedition Progress §R-[?constant:chaosx_nr25_incident.camp_logs_progress|0]§!."
chaosx.nr25.312.t: "A Call for Help"
chaosx.nr25.312.d: "A radio message from the [?chaosx_nr25_incident_rival.GetAdjective] expedition: a field party is overdue, their camp is short of fuel, and they ask anyone in range for help. Our relief party could reach them, but whatever it carries comes out of our own stores."
chaosx.nr25.312.a: "Send a relief party."
chaosx.nr25.312.a.tt: "£support_equipment_text_icon §R-[?constant:chaosx_nr25_incident.rescue_support|0]§! £GFX_fuel_texticon §R-[?constant:chaosx_nr25_incident.rescue_fuel|0]§!, Logistics Readiness §R-[?constant:chaosx_nr25_incident.rescue_readiness_cost|0]§!. Their Logistics Readiness rises by [?constant:chaosx_nr25_incident.rescue_rival_readiness|0] and they will remember who came."
chaosx.nr25.312.b: "Relay weather and bearings."
chaosx.nr25.312.b.tt: "£pol_power §R-[?constant:chaosx_nr25_incident.relay_pp|0]§!. Their Logistics Readiness rises by [?constant:chaosx_nr25_incident.relay_rival_readiness|0]."
chaosx.nr25.312.c: "Keep our crews on task."
chaosx.nr25.312.c.tt: "Expedition Progress §G+[?constant:chaosx_nr25_incident.rescue_focus_progress|0]§!."
chaosx.nr25.313.t: "Wreckage That Was Not"
chaosx.nr25.313.d: "A survey party radioed in a find: blackened metal half-buried in blue ice. Our geologists suspect it is only a meteorite, if an unusually large one. Studying it properly would take the party off its grid; the press at home would make a sensation of it either way."
chaosx.nr25.313.a: "Send the geologists."
chaosx.nr25.313.a.tt: "Expedition Progress §R-[?constant:chaosx_nr25_incident.meteorite_study_progress|0]§!, Scientific Capacity §G+[?constant:chaosx_nr25_incident.meteorite_study_capacity|0]§!, Intelligence §G+[?constant:chaosx_nr25_incident.meteorite_study_intelligence|0]§!."
chaosx.nr25.313.b: "Announce a find to the press."
chaosx.nr25.313.b.tt: "£pol_power §G+[?constant:chaosx_nr25_incident.meteorite_press_pp|0]§!, Exposure Risk §R+[?constant:chaosx_nr25_incident.meteorite_press_exposure|0]§!."
chaosx.nr25.314.t: "A Clear Weather Window"
chaosx.nr25.314.d: "The meteorologists report a rare window: a week of calm, clear weather over our sectors before the next front arrives. The camp can only use it once."
chaosx.nr25.314.a: "Push the survey parties forward."
chaosx.nr25.314.a.tt: "Expedition Progress §G+[?constant:chaosx_nr25_incident.corridor_push_progress|0]§!, Logistics Readiness §R-[?constant:chaosx_nr25_incident.corridor_push_readiness|0]§!."
chaosx.nr25.314.b: "Fly in supplies."
chaosx.nr25.314.b.tt: "Logistics Readiness §G+[?constant:chaosx_nr25_incident.corridor_supply_readiness|0]§!, £GFX_fuel_texticon §R-[?constant:chaosx_nr25_incident.corridor_supply_fuel|0]§!."
chaosx.nr25.314.c: "Rest the crews."
chaosx.nr25.314.c.tt: "Field crews §G+[?constant:chaosx_nr25_incident.corridor_rest_crew|0]§!, Exposure Risk §G-[?constant:chaosx_nr25_incident.corridor_rest_exposure|0]§!."
chaosx.nr25.315.t: "A Neutral Ship Offers Passage"
chaosx.nr25.315.d: "The master of a neutral supply ship working the southern stations offers to carry our cargo for a fee, no questions asked. If our own route has been cut or has collapsed into an improvised landing, his ship could become our route."
chaosx.nr25.315.a: "Hire the ship."
chaosx.nr25.315.a.tt: "£pol_power §R-[?constant:chaosx_nr25_incident.ship_hire_pp|0]§!, Logistics Readiness §G+[?constant:chaosx_nr25_incident.ship_hire_readiness|0]§!. A cut or improvised route becomes a chartered route."
chaosx.nr25.315.b: "Buy the stores in his hold."
chaosx.nr25.315.b.tt: "£pol_power §R-[?constant:chaosx_nr25_incident.ship_stores_pp|0]§!, Logistics Readiness §G+[?constant:chaosx_nr25_incident.ship_stores_readiness|0]§!."
chaosx.nr25.315.c: "Decline."
chaosx.nr25.315.c.tt: "The ship sails on without our cargo."
chaosx.nr25.316.t: "A Wrecked Survey Aircraft"
chaosx.nr25.316.d: "A field party found a survey aircraft that came down on a glacier, its crew long since rescued. Its cameras still hold rolls of film shot over our sectors, and its tanks are not empty."
chaosx.nr25.316.a: "Recover the film."
chaosx.nr25.316.a.tt: "Intelligence §G+[?constant:chaosx_nr25_incident.aircraft_film_intelligence|0]§!, £GFX_fuel_texticon §R-[?constant:chaosx_nr25_incident.aircraft_film_fuel|0]§!, Exposure Risk §R+[?constant:chaosx_nr25_incident.aircraft_film_exposure|0]§!."
chaosx.nr25.316.b: "Salvage the fuel and engines."
chaosx.nr25.316.b.tt: "£GFX_fuel_texticon §G+[?constant:chaosx_nr25_incident.aircraft_salvage_fuel|0]§!, Logistics Readiness §G+[?constant:chaosx_nr25_incident.aircraft_salvage_readiness|0]§!."
chaosx.nr25.317.t: "The Scientists Fall Out"
chaosx.nr25.317.d: "The field geologists and the signal physicists no longer agree on where the wreck lies, and the quarrel has stopped work in the mess hut and the map room alike. Someone has to decide."
chaosx.nr25.317.a: "Back the field geologists."
chaosx.nr25.317.a.tt: "Expedition Progress §G+[?constant:chaosx_nr25_incident.dispute_field_progress|0]§!, Intelligence §R-[?constant:chaosx_nr25_incident.dispute_field_intelligence|0]§!."
chaosx.nr25.317.b: "Back the signal physicists."
chaosx.nr25.317.b.tt: "Intelligence §G+[?constant:chaosx_nr25_incident.dispute_signal_intelligence|0]§!, Scientific Capacity §G+[?constant:chaosx_nr25_incident.dispute_signal_capacity|0]§!, Expedition Progress §R-[?constant:chaosx_nr25_incident.dispute_signal_progress|0]§!."
chaosx.nr25.317.c: "Send both leaders home."
chaosx.nr25.317.c.tt: "£pol_power §R-[?constant:chaosx_nr25_incident.dispute_replace_pp|0]§!, Logistics Readiness §G+[?constant:chaosx_nr25_incident.dispute_replace_readiness|0]§!."
chaosx.nr25.318.t: "The Fragment and the Battery"
chaosx.nr25.318.d: "A technician testing a field battery brushed its leads against one of our recovered fragments. The piece warmed, hummed and drew more current than the battery could give, then fell silent when the leads came away. The hut crew want it crated; the scientists want more batteries."
chaosx.nr25.318.a: "Run controlled tests."
chaosx.nr25.318.a.tt: "Intelligence §G+[?constant:chaosx_nr25_incident.current_test_intelligence|0]§!, Exposure Risk §R+[?constant:chaosx_nr25_incident.current_test_exposure|0]§!."
chaosx.nr25.318.b: "Shield it and crate it."
chaosx.nr25.318.b.tt: "£support_equipment_text_icon §R-[?constant:chaosx_nr25_incident.current_shield_support|0]§!, Exposure Risk §G-[?constant:chaosx_nr25_incident.current_shield_exposure|0]§!."
chaosx.nr25.318.c: "Report it home."
chaosx.nr25.318.c.tt: "Scientific Capacity §G+[?constant:chaosx_nr25_incident.current_report_capacity|0]§!, Exposure Risk §R+[?constant:chaosx_nr25_incident.current_report_exposure|0]§!."

# Active Signal: strong pulses, jamming and broadcast replies
chaosx.nr25.321.t: "The Signal Burns Out the Radios"
chaosx.nr25.321.d: "[GetChaosxNr25PulseCause]A pulse from under the ice ran through every aerial in the camp at once. Valves burst, two receivers caught fire, and the set that links us to the coast now gives only static. Until the spares arrive, the radio net no longer covers for a lost field set.\n\nShielded instruments or a listening post kept away from the wreck would have taken the worst of it."
chaosx.nr25.321.d_prepared: "[GetChaosxNr25PulseCause]A pulse from under the ice ran through the aerials, but the screened sets and the distant listening post took the brunt. We lost several receivers and the radio net's spare capacity for a while, and nobody was hurt."
chaosx.nr25.321.a: "Strip the spares from the tractors."
chaosx_nr25_pulse_radio_tt: "Logistics Readiness §R-[?chaosx_nr25_pulse_readiness_loss|0]§!, Intelligence §R-[?chaosx_nr25_pulse_intelligence_loss|0]§!. For §Y[?constant:chaosx_nr25_signal.radio_damage_days|0]§! days the radio net no longer protects against radio failures."
chaosx.nr25.322.t: "A Pulse Drains the Camp"
chaosx.nr25.322.d: "[GetChaosxNr25PulseCause]The generators stalled together when the pulse passed, and the batteries were flat by morning. Heaters, pumps and the tractor engines all had to be coaxed back to life, and the stores burned while the camp stood still.\n\nShielded equipment would have kept most of it running."
chaosx.nr25.322.d_prepared: "[GetChaosxNr25PulseCause]The pulse stalled the generators, but the screened sets and the distant receivers kept the camp in contact while the engines were restarted. We lost days of stores, not more."
chaosx.nr25.322.a: "Get the engines turning."
chaosx_nr25_pulse_readiness_tt: "Logistics Readiness §R-[?chaosx_nr25_pulse_readiness_loss|0]§!."
chaosx.nr25.323.t: "A Pulse Injures the Field Crews"
chaosx.nr25.323.d: "[GetChaosxNr25PulseCause]The field party at the instruments was closest when the pulse came. Men fell where they stood, some with burns from their own equipment, and the medical officer could not save all of them.\n\nCrews listening from a distance, or behind shielded instruments, would have been out of its reach."
chaosx.nr25.323.d_prepared: "[GetChaosxNr25PulseCause]The pulse struck the instrument line while the crews were back behind the screens or at the distant post. The equipment suffered; the people did not."
chaosx.nr25.323.a: "Bring the wounded in."
chaosx_nr25_pulse_injury_tt: "Logistics Readiness §R-[?chaosx_nr25_pulse_readiness_loss|0]§!. Field crews lost: §R[?chaosx_nr25_pulse_crew_loss|0]§!."
chaosx.nr25.324.t: "Survey Records Corrupted"
chaosx.nr25.324.d: "[GetChaosxNr25PulseCause]The pulse passed through the recording drums and the magnetic charts. Weeks of survey readings came back as noise, and some of the sector notes no longer agree with each other.\n\nShielded recorders would have saved most of the work."
chaosx.nr25.324.d_prepared: "[GetChaosxNr25PulseCause]The pulse scrambled part of the recording drums, but the screened copies and the distant post's duplicate logs let us rebuild most of the survey."
chaosx.nr25.324.a: "Survey it again."
chaosx_nr25_pulse_data_tt: "Survey evidence §R-[?chaosx_nr25_pulse_evidence_loss|0]§!."
chaosx.nr25.325.t: "The Pulse Lights Up Our Camp"
chaosx.nr25.325.d: "[GetChaosxNr25PulseCause]For a few seconds every metal mast in the camp rang with the signal and re-broadcast it across the ice. Any rival listening now knows exactly where we are working, and our quiet departure no longer hides us.\n\nShielded masts would have kept the echo faint."
chaosx.nr25.325.d_prepared: "[GetChaosxNr25PulseCause]The screened masts kept the echo faint, but for a moment our camp answered the signal. Rival listeners have a bearing on us, though a weak one."
chaosx.nr25.325.a: "Let them look."
chaosx_nr25_pulse_reveal_tt: "Exposure Risk §R+[?chaosx_nr25_pulse_exposure_gain|0]§!. Every rival camp on the ice gains §R[?constant:chaosx_nr25_signal.reveal_rival_intelligence|0]§! Intelligence on our position."
chaosx_nr25_pulse_cause_broadcast: "Our reply was answered within the hour. "
chaosx_nr25_pulse_cause_none: ""
chaosx.nr25.326.t: "Our Receivers Are Drowned Out"
chaosx.nr25.326.d: "A wall of noise has settled over the carrier our receivers follow. Someone is jamming the signal around our camp, and until it lifts our listening, tracking and replies bring back only part of what they should."
chaosx.nr25.326.d_identified: "A wall of noise has settled over the carrier our receivers follow. Our signals officers traced the jamming to §Y[?chaosx_nr25_jammer_id.GetName]§!'s expedition. Until it lifts, our listening, tracking and replies bring back only part of what they should."
chaosx.nr25.326.a: "Work through the noise."
chaosx_nr25_signal_jammed_tt: "For §Y[?constant:chaosx_nr25_signal.jam_days|0]§! days our signal responses give only part of their usual gains."
chaosx.nr25.327.t: "The Reply Is Answered"
chaosx.nr25.327.d: "The probe sequence went out, and the ice answered with echoes rather than a pulse. Mapped against our receivers, they rule out the §Y[GetChaosxNr25BroadcastSectorName]§! sector as the resting place of the wreck's core. The survey parties can strike it off and move on."
chaosx.nr25.327.d_none: "The probe sequence went out, and the ice answered with echoes rather than a pulse. Every sector the echoes could clear is already on our charts; what remains is the ground the signal itself guards."
chaosx.nr25.327.a: "Mark the charts."

# Something Survived: visible evidence, capture and a trace turned on a rival
chaosx.nr25.331.t: "Tracks Beyond the Camp"
chaosx.nr25.331.d: "The morning patrol found a line of marks crossing the snow between the instrument huts. They match none of our sledges, tractors or boots, and they stop at the edge of the pressure ridge as if whatever made them simply went down into the ice.\n\nThe survey chiefs argue over what the marks mean. Nobody wants to follow them alone."
chaosx.nr25.331.a: "Photograph them and post a watch."
chaosx_nr25_survivor_tracks_tt: "Exposure Risk §R+[?chaosx_nr25_survivor_exposure_gain|0]§!, Intelligence §G+[?chaosx_nr25_survivor_intelligence_gain|0]§!."
chaosx.nr25.332.t: "Compartments Opened in the Night"
chaosx.nr25.332.d: "Panels on the exposed hull that our engineers could not shift for weeks were standing open when the shift changed. Nothing of ours was used to open them. Inside, the cavities are empty, and the frost on their edges has been disturbed from within.\n\nThe survey teams have new surfaces to study, and fewer reasons to sleep."
chaosx.nr25.332.a: "Study what was left open."
chaosx_nr25_survivor_compartments_tt: "Survey evidence §G+[?chaosx_nr25_survivor_evidence_change|0]§!, Exposure Risk §R+[?chaosx_nr25_survivor_exposure_gain|0]§!."
chaosx.nr25.333.t: "A Field Party Does Not Return"
chaosx.nr25.333.d: "A survey party went out to the eastern stakes and did not come back. The search found their sledge upright, their tent pitched and their stove still warm, and no trace of the men beyond a few metres of churned snow.\n\nEscorts with every party would have given them a chance."
chaosx.nr25.333.d_guarded: "A survey party lost contact at the eastern stakes, but the escort with it held them together through the night and brought everyone back. Whatever circled their tent left only churned snow and a frightened crew."
chaosx.nr25.333.a: "Keep the parties together."
chaosx_nr25_survivor_missing_tt: "Logistics Readiness §R-[?chaosx_nr25_survivor_readiness_loss|0]§!. Field crews lost: §R[?chaosx_nr25_survivor_crew_loss|0]§!."
chaosx.nr25.334.t: "Cables Cut and Rearranged"
chaosx.nr25.334.d: "The power cables between the generator hut and the instruments were cut overnight, cleanly, and then joined again in a different order. Half the camp ran on the wrong circuits for two days before the engineers found every splice.\n\nGuards on the lines would have caught the work in progress."
chaosx.nr25.334.d_guarded: "The guards on the cable runs saw the lights flicker and found two lines cut and rejoined in a different order. The engineers had the circuits right by noon."
chaosx.nr25.334.a: "Rewire the camp."
chaosx_nr25_survivor_cables_tt: "Logistics Readiness §R-[?chaosx_nr25_survivor_readiness_loss|0]§!."
chaosx.nr25.335.t: "Fragments Moved Between Visits"
chaosx.nr25.335.d: "When the survey party returned to the marked debris field, the stakes were still in place but the pieces were not. Several had been carried off, and others lay where none had been charted. Weeks of measurements no longer describe the ground.\n\nA watch on the field would have kept most of the record good."
chaosx.nr25.335.d_guarded: "The watch on the debris field saw something moving among the stakes and drove it off before dawn. A few pieces were shifted, and a few measurements must be taken again."
chaosx.nr25.335.a: "Survey the field again."
chaosx_nr25_survivor_fragments_tt: "Survey evidence §R[?chaosx_nr25_survivor_evidence_change|0]§!."
chaosx.nr25.336.t: "The Camp Damaged in the Night"
chaosx.nr25.336.d: "Huts were torn open, stores scattered and a mast pulled down while the camp slept. There are no footprints, no tracks of a rival's vehicles, and no sign of who or what did it.\n\nSentries around the camp would have limited the damage."
chaosx.nr25.336.d_guarded: "Sentries raised the alarm when the first hut was torn open, and whatever was in the camp withdrew before it reached the stores. The damage is real but limited."
chaosx.nr25.336.a: "Repair what we can."
chaosx_nr25_survivor_outpost_tt: "Outpost security §R-[?chaosx_nr25_survivor_security_loss|0]§!."
chaosx_nr25_survivor_camp_readiness_tt: "Logistics Readiness §R-[?chaosx_nr25_survivor_readiness_loss|0]§!."
chaosx.nr25.337.t: "Something Answers on the Radio"
chaosx.nr25.337.d: "For an hour the field sets picked up a reply on our own frequencies: fragments of our call signs, repeated back in the wrong order, the bearing shifting as if the sender were walking across the ice. Then it stopped.\n\nThe signals officers have the recording. They cannot agree on what it is."
chaosx.nr25.337.a: "Log every bearing."
chaosx_nr25_survivor_radio_tt: "Intelligence §G+[?chaosx_nr25_survivor_intelligence_gain|0]§!, Exposure Risk §R+[?chaosx_nr25_survivor_exposure_gain|0]§!."
chaosx.nr25.338.t: "The Survivor Is Contained"
chaosx.nr25.338.d: "After weeks of tracks, cut lines and empty tents, our teams have it. Whatever came out of the wreck is now behind steel and frost in a sealed hut at our camp, under guard day and night. The other expeditions will find no more traces on the ice.\n\nWhat it is remains a matter for the analysts. What we hold gives them something no other government has: a living point of comparison for everything recovered from the wreck."
chaosx.nr25.338.a: "Seal the hut."
chaosx_nr25_survivor_captured_tt: "Expedition Progress §G+[?constant:chaosx_nr25_survivor.capture_progress|0]§!, Intelligence §G+[?constant:chaosx_nr25_survivor.capture_intelligence|0]§!, Scientific Capacity §G+[?constant:chaosx_nr25_survivor.capture_capacity|0]§!, Exposure Risk §R+[?constant:chaosx_nr25_survivor.capture_exposure|0]§!.\nNo expedition meets survivor incidents again, and if we hold recovered material later, containment works faster."
chaosx.nr25.339.t: "The Capture Fails"
chaosx.nr25.339.d: "The capture team closed the net at the pressure ridge, and the ridge closed on them. When the survivors dragged themselves back to camp, they could not say what they had seen, only that it had been waiting for them.\n\nWhatever survived the wreck is still out there, and now it knows how we hunt."
chaosx.nr25.339.a: "Count the missing."
chaosx_nr25_survivor_capture_failed_tt: "Logistics Readiness §R-[?constant:chaosx_nr25_survivor.capture_failure_readiness|0]§!. Field crews lost: §R[?constant:chaosx_nr25_survivor.capture_failure_crew|0]§!."
chaosx.nr25.340.t: "Something Came Through Our Lines"
chaosx.nr25.340.d: "The thing that has been haunting the ice came straight at our camp, as if driven. Huts and stores were wrecked before it moved on. The trail it left runs back toward another expedition's lines, but our people cannot prove that anyone sent it."
chaosx.nr25.340.d_identified: "The thing that has been haunting the ice came straight at our camp, and this time our observers saw why: lure lines, flares and a broadcast pattern laid out by §Y[?chaosx_nr25_survivor_turner_id.GetName]§!'s expedition to drive it toward us."
chaosx.nr25.340.a: "Rebuild, and remember."
chaosx_nr25_survivor_turned_on_us_tt: "Outpost security §R-[?chaosx_nr25_survivor_security_loss|0]§!."
chaosx.nr25.341.t: "The Trace Turned Toward a Rival"
chaosx.nr25.341.d: "The lure lines worked. The trace left our sectors and fell on §Y[?chaosx_nr25_last_turn_target.GetName]§!'s camp, and as far as our people can tell nobody saw who laid the lines."
chaosx.nr25.341.d_traced: "The lure lines worked, and the trace fell on §Y[?chaosx_nr25_last_turn_target.GetName]§!'s camp, but their observers followed the flares back to our teams. They know what we did."
chaosx.nr25.341.a: "Understood."

# Militarised Antarctica: corridor compacts and seizures
chaosx.nr25.166.t: "An Offer of a Demilitarised Corridor"
chaosx.nr25.166.d: "[From.GetNameDefCap] proposes a demilitarised corridor between our expeditions: no warships on each other's approaches, no landings at each other's camps, no patrols across each other's survey lines, for as long as the race lasts or until the terms lapse. The offer is public, and so will be our answer."
chaosx.nr25.166.a: "Accept the corridor."
chaosx.nr25.166.b: "Refuse it."
chaosx_nr25_compact_accept_tt: "For §Y[?constant:chaosx_nr25_militarisation.compact_days|0]§! days neither country can blockade, seize from or intercept the other. Both expeditions gain §G[?constant:chaosx_nr25_militarisation.compact_readiness|0]§! Logistics Readiness and a better opinion of each other, and the ice grows less militarised."
chaosx_nr25_compact_refuse_tt: "The ice grows slightly more militarised, and [From.GetNameDef] stays free to act against us, as we against them."
chaosx.nr25.167.t: "The Corridor Answer"
chaosx.nr25.167.d_accepted: "[From.GetNameDefCap] has accepted our demilitarised corridor. Neither of us will turn guns on the other's expedition while the terms hold, and both camps can spend their guards on the ice instead."
chaosx.nr25.167.d_refused: "[From.GetNameDefCap] has refused our demilitarised corridor. Its warships and patrols remain free to act, and so do ours."
chaosx.nr25.167.a: "Noted."
chaosx.nr25.168.t: "The Rival Camp Is Ours"
chaosx.nr25.168.d: "Our troops hold [?chaosx_nr25_last_seizure_target.GetAdjective] camp. Its survey records came with it; its fragment stores were empty or already moved."
chaosx.nr25.168.d_fragment: "Our troops hold [?chaosx_nr25_last_seizure_target.GetAdjective] camp. Its survey records came with it, and so did a crated fragment from its stores, now in our custody."
chaosx.nr25.168.a: "Hold what we took."
chaosx_nr25_seizure_taken_tt: "Survey evidence carried off: §G[?chaosx_nr25_last_seized_evidence|0]§!."

# The Wreck Is Breaking Apart: lost sites, the hull break, contaminated pieces
chaosx.nr25.344.t: "A Fragment Field Is Lost"
chaosx.nr25.344.d: "The ice shifted under the §Y[GetChaosxNr25LostSiteName]§! field overnight. Where our survey stakes stood there is now a pressure ridge and a sheet of fresh snow, and whatever lay in that field lies under it. No expedition can dig it out now.\n\nThe survey records we took there are all that remains of it."
chaosx.nr25.344.d_destroyed: "Something in the §Y[GetChaosxNr25LostSiteName]§! field failed in the night. The flash was seen from three camps, and by morning the debris there was slag and ash. Nothing in that field can be recovered now.\n\nThe survey records we took there are all that remains of it."
chaosx.nr25.344.a: "Strike it from the charts."
chaosx_nr25_site_lost_tt: "The §Y[GetChaosxNr25LostSiteName]§! field is lost on every expedition's charts; nobody can recover a fragment there."
chaosx.nr25.345.t: "The Hull Breaks"
chaosx.nr25.345.d: "The wreck has come apart. The outer hull split along its length, and the sections that held the fragment fields together are sliding into the ice. One part still stands: the command core, sealed and heavy, where the strongest readings have always come from.\n\nWhatever the governments wanted from this wreck, it is now in that core, and the race is for it alone."
chaosx.nr25.345.a: "Everything on the core."
chaosx_nr25_hull_broken_tt: "The command core remains the race's prize: the final recovery can still be won. Unrecovered fragment fields are lost faster from now on."
chaosx.nr25.346.t: "A Contaminated Fragment"
chaosx.nr25.346.d: "The cutting team brought the piece out, but the hull was too far gone. The fragment came away fused with frozen coolant and something that still gives off heat, and the men who handled it are being watched by the doctors. It is ours, but it is worth less than it should be, and it is dangerous to keep.\n\nA stabilised hull would have let us cut it clean."
chaosx.nr25.346.a: "Crate it carefully."
chaosx_nr25_contaminated_fragment_tt: "The fragment is in our custody, but it brought only part of the usual progress and raised our Exposure Risk by §R[?constant:chaosx_nr25_wreck.contaminated_exposure|0]§!."

# Diplomatic incidents: public accusations and seizure demands
chaosx.nr25.171.t: "Accused of Antarctic Sabotage"
chaosx.nr25.171.d: "[From.GetNameDefCap] has gone public with evidence that our expedition interfered with its camp. The papers have the photographs, and foreign ministries are asking for our answer."
chaosx.nr25.171.a: "Deny everything."
chaosx.nr25.171.b: "Pay compensation."
chaosx.nr25.171.c: "Admit a limited operation."
chaosx_nr25_answer_deny_tt: "Costs nothing now, but [From.GetNameDef] will think worse of us."
chaosx_nr25_answer_compensate_tt: "£pol_power §R-[?constant:chaosx_nr25_incident.compensation_pp|0]§!. [From.GetNameDefCap] gains §G[?constant:chaosx_nr25_incident.compensation_readiness|0]§! Logistics Readiness and §G[?constant:chaosx_nr25_incident.compensation_evidence|0]§! survey evidence, and its suspicion of us turns into goodwill."
chaosx_nr25_answer_admit_tt: "£pol_power §R-[?constant:chaosx_nr25_incident.admit_pp|0]§! and Exposure Risk §R+[?constant:chaosx_nr25_incident.admit_exposure|0]§!. [From.GetNameDefCap]'s suspicion of us gives way to a milder grudge."
chaosx.nr25.172.t: "An Answer to Our Accusation"
chaosx.nr25.172.d_denied: "[From.GetNameDefCap] denies any part in the operation against our camp and calls our evidence a fabrication. Nobody abroad is convinced either way."
chaosx.nr25.172.d_compensated: "[From.GetNameDefCap] has chosen to pay rather than argue. Stores and survey copies are on their way to our camp, and the matter is closed."
chaosx.nr25.172.d_admitted: "[From.GetNameDefCap] admits that its people carried out a limited operation against our camp and promises it will not happen again. The admission costs them more at home than abroad."
chaosx.nr25.172.a: "So be it."
chaosx.nr25.173.t: "A Demand to Return a Seized Camp"
chaosx.nr25.173.d: "[From.GetNameDefCap] demands the release of the crews our troops detained when they took its camp, and the return of the survey records and any fragment they carried off. The demand is public; so will be our answer."
chaosx.nr25.173.a: "Return them."
chaosx.nr25.173.b: "Refuse."
chaosx_nr25_seizure_accept_tt: "The detained crews go home, and the survey evidence and the fragment we took return to [From.GetNameDef]. Both governments think better of each other and the ice grows less militarised."
chaosx_nr25_seizure_refuse_tt: "The refusal is public and raises world tension. [From.GetNameDefCap] will hold it against us and the ice grows more militarised."
chaosx.nr25.174.t: "An Answer About the Seized Camp"
chaosx.nr25.174.d_accepted: "[From.GetNameDefCap] has released our people and returned what its troops carried off. The crews are back at work and the incident is settled."
chaosx.nr25.174.d_refused: "[From.GetNameDefCap] refuses to release our people or return what its troops took. The refusal is on the record for every government to see."
chaosx.nr25.174.a: "Understood."
chaosx_nr25_seizure_answer_tt: "Survey evidence returned: §G[?chaosx_nr25_returned_evidence_record|0]§!."
chaosx_nr25_seizure_fragment_back_tt: "The fragment its troops carried off is back in our custody."
