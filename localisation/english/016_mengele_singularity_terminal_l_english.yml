l_english:
mengele_event016_authorize_singularity_detonation: "Authorize the Strategic Singularity"
mengele_event016_authorize_singularity_detonation_desc: "The Directorate can release its completed architecture into the world. The resulting rupture will drive Chaos beyond the final threshold and open the Fallout transition."
mengele_event016_singularity_terminal_requirements_tt: "Requires the completed Singularity programme, at least [?constant:brilliant_scientist_singularity.minimum_facilities|0] owned and controlled qualifying facilities, [?constant:brilliant_scientist_singularity.minimum_live_command_nodes|0] intact command nodes, [?constant:brilliant_scientist_singularity.minimum_power_links|0] intact power links, and no other Fallout catastrophe already under way. When the Singularity was built from component special projects, all six components must be complete. The Singularity scenario and Chaos Meter must be enabled, with no active incident or competing world-end outcome."
mengele_event016_singularity_terminal_authorized_tt: "The Directorate has submitted its Strategic Singularity request. If another request holds the Fallout channel, the Directorate will retry while its programme and physical network remain intact."
