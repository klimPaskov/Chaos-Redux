chaosx.nr92.1.t: "Greenland sale"
chaosx.nr92.2.t: "Sell Greenland?"
chaosx.nr92.2.d: ""
chaosx.nr92.2.a: "Put Greenland on sale"
chaosx.nr92.2.b: "Keep Greenland!"

chaosx.nr92.3.t: "Greenland sale"
chaosx.nr92.3.d: "Greenland is on the market, and our government must decide whether to seize the island before another buyer does."
chaosx.nr92.3.a: "Unexpected"

chaosx.nr92.4.t: "Greenland sold"
chaosx.nr92.4.d: "Our country has completed the purchase of Greenland. The island gives us new ports, territory, and opportunities in the North Atlantic."
chaosx.nr92.4.a: "Hippity Hoppity"

chaosx.news.73.t: "Greenland sold to [FROM.GetName]"
chaosx.news.73.d: "Greenland, the world's largest island, has been sold to [FROM.GetName]. The purchase gives [FROM.GetName] new territory and ports in the North Atlantic."
chaosx.news.73.a: "Who needs ice?"
