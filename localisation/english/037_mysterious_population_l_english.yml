mysterious_people_housing_start_tt: "The civilian factories stay committed until the houses are finished in 90 days."
mysterious_people_housing_done_tt: "30% of the newcomers without homes in [FROM.GetName] move in, and newcomers there settle §G25%§! faster from then on."
