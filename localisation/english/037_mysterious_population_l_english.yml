mysterious_people_new_city: "Build a New City in [FROM.GetName]"
mysterious_people_new_city_desc: "Planners lay out a whole new city beside the crowded districts of [FROM.GetName], with its own streets, mills and markets."
mysterious_people_city_start_tt: "The civilian factories stay committed until the city is finished in 300 days."
mysterious_people_city_done_tt: "Half of the newcomers without homes in [FROM.GetName] move into the new city.\n[FROM.GetName] gains §G+1§! infrastructure, §G+1§! civilian factory and §G+1§! building slot, and newcomers there settle §G50%§! faster from then on."
