mysterious_people_newcomers: "Newcomers"
mysterious_people_newcomers_desc: "Settled newcomers add hands to building sites and factories while crowding stays low. Crowded countries lose stability and building speed, and newcomers without homes are not yet available to recruit."
mysterious_people_projects: "Newcomer Housing Works"
mysterious_people_projects_desc: "Civilian factories are building homes, roads and cities for the newcomers."
mysterious_people_unrest: "Unrest over the Newcomers"
mysterious_people_unrest_desc: "Hard choices about the newcomers have angered part of the country."
mysterious_people_calm: "Calm over the Newcomers"
mysterious_people_calm_desc: "Recent choices about the newcomers have reassured the public."
