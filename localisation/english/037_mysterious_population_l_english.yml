mysterious_people_stance_open_desc: "Newcomers register where they live, and towns are told to treat them as residents."
mysterious_people_stance_open_tt: "Newcomers settle §G25%§! faster.\nCrowding costs the full stability penalty.\nThe stance can change again after 180 days."
