l_english:
# Event 037 Mysterious People. Report and news text stays plain.
chaosx.nr37.1.t: "Mysterious People"
chaosx.nr37.6.t: "Mysterious People Monthly Settlement"
chaosx.nr37.7.t: "Mysterious People Local Scene"
chaosx.nr37.8.t: "Mysterious People Workforce"

chaosx.nr37.2.t: "Mysterious People"
chaosx.nr37.2.d.first: "Overnight, [ROOT.GetNameDef] has gained [ROOT.GetMysteriousPeopleCreated] people who say they have always lived here, and their neighbours cannot remember otherwise. A village stands where the county map shows open fields, and its pear trees are older than anyone in the district. Children walk to a school the town never built, and the teacher greets every family by name. Market women swear these strangers danced at their weddings.\n\nThe same thing has happened in every inhabited land on earth. About [ROOT.GetMysteriousPeopleWorldCreated] people have appeared across [?global.mysterious_people_last_states|0] regions, each with a house, a trade and a family that knows them.\n\n[ROOT.GetMysteriousPeopleReportCrowding]"
chaosx.nr37.2.d.baseline: "It has happened again. [ROOT.GetNameDefCap] woke to [ROOT.GetMysteriousPeopleCreated] more people who remember growing up here, and their landlords remember them too. [ROOT.GetMysteriousPeopleWaveComparison]\n\nAcross the world about [ROOT.GetMysteriousPeopleWorldCreated] people appeared in [?global.mysterious_people_last_states|0] regions, and the newcomers now living on earth number [ROOT.GetMysteriousPeopleWorldNewcomers].\n\n[ROOT.GetMysteriousPeopleReportCrowding]"
chaosx.nr37.2.d.evolution_i: "This time the newcomers came by whole streets. [ROOT.GetNameDefCap] counts [ROOT.GetMysteriousPeopleCreated] new residents, and families are already nailing extensions onto houses that were full a week ago. Every lumber yard has sold out, and contractors hire bricklayers on the station platform. [ROOT.GetMysteriousPeopleWaveComparison]\n\nAcross the world about [ROOT.GetMysteriousPeopleWorldCreated] people appeared, and the newcomers now living on earth number [ROOT.GetMysteriousPeopleWorldNewcomers].\n\n[ROOT.GetMysteriousPeopleReportCrowding]"
chaosx.nr37.2.d.evolution_ii: "Bread runs out by noon in towns that fed themselves easily last season. [ROOT.GetNameDefCap] has [ROOT.GetMysteriousPeopleCreated] more mouths to feed this morning, and the queues outside the bakeries hold faces nobody can place. Grocers ration flour without being told to. [ROOT.GetMysteriousPeopleWaveComparison]\n\nAcross the world about [ROOT.GetMysteriousPeopleWorldCreated] people appeared, and the newcomers now living on earth number [ROOT.GetMysteriousPeopleWorldNewcomers].\n\n[ROOT.GetMysteriousPeopleReportCrowding]"
chaosx.nr37.2.d.evolution_iii: "The cities of [ROOT.GetNameDef] have spilled past their tram lines overnight. [ROOT.GetMysteriousPeopleCreated] new residents fill parks, stations and church halls, and new districts stand where the farms used to begin. Some people have started asking each other which of them were here first. [ROOT.GetMysteriousPeopleWaveComparison]\n\nAcross the world about [ROOT.GetMysteriousPeopleWorldCreated] people appeared, and the newcomers now living on earth number [ROOT.GetMysteriousPeopleWorldNewcomers].\n\n[ROOT.GetMysteriousPeopleReportCrowding]"
chaosx.nr37.2.a: "Find them homes."
chaosx.nr37.2.b: "Let them settle."
chaosx.nr37.2.crowded_tt: "[ROOT.GetMysteriousPeopleUnsettled] newcomers still have no home or work. Housing, roads and a registration drive in the §YMysterious People§! decisions will settle them faster."
chaosx.nr37.2.calm_tt: "Most of the newcomers will find rooms and work on their own within a few months."
mysterious_people_report_crowding: "Many of the newcomers still sleep in barns, schools and railway sheds. The worst crowding is in [ROOT.mysterious_people_top_hotspot.GetName]."
mysterious_people_report_settling: "Most of the newcomers have already found rooms and work, and the towns are taking them in without much trouble."
mysterious_people_wave_larger: "Clerks counting the arrivals say this wave was larger than the last one."
mysterious_people_wave_smaller: "Clerks counting the arrivals say this wave was smaller than the last one."

chaosx.nr37.3.t: "Rooms for Relatives"
chaosx.nr37.3.d: "Families from the last manifestation have begun clearing rooms for relatives they say are on their way. They describe these cousins and aunts in detail and cannot explain how they know they are coming. Builders in many countries report that their yards have sold every plank and nail."
chaosx.nr37.3.a: "Then we build."
chaosx.nr37.4.t: "Queues at Dawn"
chaosx.nr37.4.d: "Bread queues now form before dawn in towns that fed themselves easily a year ago. Newcomer families speak of more relatives still to come, and in crowded districts the soup kitchens close their doors by midday."
chaosx.nr37.4.a: "Feed who we can."
chaosx.nr37.5.t: "Humanity Multiplies"
chaosx.nr37.5.d: "Each manifestation now fills whole cities, and the cities it reaches overflow within a week. Farmland disappears under new districts, and the newcomers outnumber the old residents in places that were quiet market towns a few years ago. In several countries ministers have begun asking aloud who these people really are."
chaosx.nr37.5.a: "They live here now."

chaosx.nr37.10.t: "The Village with Old Foundations"
chaosx.nr37.10.d: "A complete village stands in [mysterious_people_flavour_state.GetName] where the county survey shows only open fields. Its walls are weathered, its orchards are decades old, and its families are already bringing in the harvest. The villagers have walked to the district office to ask why their post stopped coming."
chaosx.nr37.10.a: "Register the village and connect it to the district."
chaosx.nr37.10.a.tt: "15% of the newcomers without homes in [mysterious_people_flavour_state.GetName] settle at once."
chaosx.nr37.10.b: "Leave it to the county."
chaosx.nr37.10.b.tt: "Nothing changes."
chaosx.nr37.11.t: "The School Nobody Opened"
chaosx.nr37.11.d: "A teacher has opened a school in [mysterious_people_flavour_state.GetName] with forty pupils, and she knows every family in the district by name. The town never built a school on that street, yet the benches are worn smooth and the children's initials are carved into the desks."
chaosx.nr37.11.a: "Keep the school open and pay the teacher."
chaosx.nr37.11.a.tt: "Newcomers in [mysterious_people_flavour_state.GetName] settle 25% faster for 180 days."
chaosx.nr37.11.b: "Close it until the children are registered."
chaosx.nr37.11.b.tt: "Under Open Integration, stability §R-1%§! for 60 days."
chaosx.nr37.12.t: "The Unknown Relative"
chaosx.nr37.12.d: "Across [mysterious_people_flavour_state.GetName], families are opening their doors to cousins and aunts who remember shared holidays that only one side recalls. Most hosts are frightened at first, and then they set another place at the table."
chaosx.nr37.12.a: "Let families take them in."
chaosx.nr37.12.a.tt: "10% of the newcomers without homes in [mysterious_people_flavour_state.GetName] settle at once."
chaosx.nr37.12.b: "Ask the police to check every visitor."
chaosx.nr37.12.b.tt: "Newcomers in [mysterious_people_flavour_state.GetName] settle 25% slower for 90 days.\nUnder Restricted Registration, stability §G+1%§! for 90 days."
chaosx.nr37.13.t: "The Road Everyone Uses"
chaosx.nr37.13.d: "Carters and lorry drivers in [mysterious_people_flavour_state.GetName] use a paved road to the new settlements as if they had driven it for years. It appears on no survey, and moss covers its milestones."
chaosx.nr37.13.a: "Add it to the national road plan."
chaosx.nr37.13.a.tt: "The next Roads and Water project in [mysterious_people_flavour_state.GetName] needs half the usual political power and civilian factories."
chaosx.nr37.13.b: "Close it until it is surveyed."
chaosx.nr37.13.b.tt: "Nothing changes."
chaosx.nr37.14.t: "The Factory Shift"
chaosx.nr37.14.d: "A full shift walked into a factory in [mysterious_people_flavour_state.GetName] this morning, clocked in and started the line. The foreman remembers hiring every one of them, and none of them has anywhere to sleep tonight."
chaosx.nr37.14.a: "Keep the line running."
chaosx.nr37.14.a.tt: "Factory output §G+3%§! for 90 days.\nNewcomers in [mysterious_people_flavour_state.GetName] settle 25% slower for 90 days while the workers live on the factory floor."
chaosx.nr37.14.b: "Turn the shift away until housing is found."
chaosx.nr37.14.b.tt: "Nothing changes."
chaosx.nr37.15.t: "Graves for Living Families"
chaosx.nr37.15.d: "The cemetery in [mysterious_people_flavour_state.GetName] holds generations of graves belonging to families who arrived last month. The stones are as worn as their neighbours', and the families tend them every Sunday after church."
chaosx.nr37.15.a: "Leave the graves in peace."
chaosx.nr37.15.a.tt: "10% of the newcomers without homes in [mysterious_people_flavour_state.GetName] settle at once."
chaosx.nr37.15.b: "Exhume and examine them."
chaosx.nr37.15.b.tt: "Stability §R-2%§! for 90 days.\nThe examinations explain nothing."
chaosx.nr37.16.t: "Two Families, One House"
chaosx.nr37.16.d: "In [mysterious_people_flavour_state.GetName], two unrelated families hold keys to the same house. Each has photographs of their children growing up in its rooms, and neither will leave."
chaosx.nr37.16.a: "Split the house and pay for a second one."
chaosx.nr37.16.a.tt: "The next Emergency Housing in [mysterious_people_flavour_state.GetName] needs half the usual political power and civilian factories."
chaosx.nr37.16.b: "Rule for the older family."
chaosx.nr37.16.b.tt: "Stability §R-1%§! for 60 days."
chaosx.nr37.17.t: "The Wedding Guests from Abroad"
chaosx.nr37.17.d: "Families in [ROOT.GetNameDef] and [mysterious_people_flavour_country.GetNameDef] have recognized each other in newsreel footage. They swear they danced at the same wedding years ago, and they have started writing to each other to compare their memories."
chaosx.nr37.17.a: "Let the families write and visit."
chaosx.nr37.17.b: "Censor the newsreel."
chaosx.nr37.17.b.tt: "Nothing changes."
chaosx.nr37.18.t: "New Districts by Morning"
chaosx.nr37.18.d: "Whole streets of shops and flats filled the empty lots on the edge of [mysterious_people_flavour_state.GetName] overnight. The trams stop short of them, and thousands walk into town before dawn to look for work."
chaosx.nr37.18.a: "Extend the tram lines."
chaosx.nr37.18.a.tt: "Newcomers in [mysterious_people_flavour_state.GetName] settle 25% faster for 180 days."
chaosx.nr37.18.b: "Let the districts fend for themselves."
chaosx.nr37.18.b.tt: "Nothing changes."
chaosx.nr37.19.t: "Work Without Homes"
chaosx.nr37.19.d: "The factories of [mysterious_people_flavour_state.GetName] have hired every newcomer who asked, and their families now sleep in warehouses and rail yards between shifts."
chaosx.nr37.19.a: "Keep production first."
chaosx.nr37.19.a.tt: "Factory output §G+3%§! and stability §R-1%§! for 90 days."
chaosx.nr37.19.b: "Open the warehouses as dormitories."
chaosx.nr37.19.b.tt: "15% of the newcomers without homes in [mysterious_people_flavour_state.GetName] settle at once.\nFactory output §R-2%§! for 60 days."
chaosx.nr37.20.t: "Grain for People Who Were Not Here"
chaosx.nr37.20.d: "Bakeries in [mysterious_people_flavour_state.GetName] run out by mid-morning. The queues include families nobody in the district remembers, and fights break out over who has the right to buy first."
chaosx.nr37.20.a: "Ration everyone equally."
chaosx.nr37.20.a.tt: "Stability §R-2%§! for 90 days."
chaosx.nr37.20.b: "Feed long-time residents first."
chaosx.nr37.20.b.tt: "Stability §G+1%§! for 90 days.\nNewcomers in [mysterious_people_flavour_state.GetName] settle at half speed for 180 days."
chaosx.nr37.21.t: "The Station Never Empties"
chaosx.nr37.21.d: "Families crowd the main station of [mysterious_people_flavour_state.GetName] faster than the trains can carry them away. Many of them hold tickets stamped with dates from years ago."
chaosx.nr37.21.a: "Run extra trains."
chaosx.nr37.21.a.tt: "For 30 days, twice as many people try to leave [mysterious_people_flavour_state.GetName]."
chaosx.nr37.21.b: "Close the station."
chaosx.nr37.21.b.tt: "For 60 days nobody leaves [mysterious_people_flavour_state.GetName] to escape the crowding, so the backlog stays."
chaosx.nr37.22.t: "A City Asks for Entry Limits"
chaosx.nr37.22.d: "The mayor of the largest city in [mysterious_people_flavour_state.GetName] asks for the power to turn newcomers away at the city limits. His police already stop handcarts at the bridges."
chaosx.nr37.22.a: "Grant the limits."
chaosx.nr37.22.a.tt: "Stability §G+2%§! for 180 days.\nNewcomers in [mysterious_people_flavour_state.GetName] settle at half speed for 180 days."
chaosx.nr37.22.b: "Fund the city instead."
chaosx.nr37.22.b.tt: "20% of the newcomers without homes in [mysterious_people_flavour_state.GetName] settle at once."
chaosx.nr37.22.c: "Refuse."
chaosx.nr37.22.c.tt: "Stability §R-2%§! for 60 days."
chaosx.nr37.23.t: "The Majority Nobody Remembers Meeting"
chaosx.nr37.23.d: "Most families in [mysterious_people_flavour_state.GetName] now belong to households that arrived with the manifestations. The older residents cannot say when that happened, and the local council can no longer agree on whom it represents."
chaosx.nr37.23.a: "Hold local elections on the new rolls."
chaosx.nr37.23.a.tt: "Newcomers in [mysterious_people_flavour_state.GetName] settle 50% faster for 180 days.\nStability §R-1%§! for 60 days."
chaosx.nr37.23.b: "Suspend the local council."
chaosx.nr37.23.b.tt: "Stability §G+1%§! for 60 days.\nNewcomers in [mysterious_people_flavour_state.GetName] settle at half speed for 180 days."
chaosx.nr37.24.t: "A Government Counts Origins"
chaosx.nr37.24.d: "Ministers in [ROOT.GetNameDef] propose marking every household by whether it arrived with the manifestations. The forms are already printed, and in some towns neighbours have started telling the police who came last."
chaosx.nr37.24.a: "Reject the register."
chaosx.nr37.24.a.tt: "Stability §R-3%§! for 90 days."
chaosx.nr37.24.b: "Adopt the register."
chaosx.nr37.24.b.tt: "The country adopts §YRestricted Registration§! at once without paying for it.\nStability §G+3%§! for 90 days.\nTogether with Restricted Registration, newcomers everywhere settle at half speed for a year."
chaosx.nr37.24.threat: "A government registers households by origin"
chaosx.nr37.25.t: "The Second Capital"
chaosx.nr37.25.d: "A complete government quarter has appeared beside [mysterious_people_flavour_state.GetName]. Its clerks insist the ministries have always worked from there, and every morning they arrive at their desks with their lunches wrapped in newspaper."
chaosx.nr37.25.a: "Put the quarter to work."
chaosx.nr37.25.a.tt: "25% of the newcomers without homes in [mysterious_people_flavour_state.GetName] settle at once."
chaosx.nr37.25.b: "Clear it."
chaosx.nr37.25.b.tt: "Stability §R-3%§! for 90 days."
chaosx.nr37.26.t: "The Country That Managed"
chaosx.nr37.26.d: "The cities, farms and schools built for the newcomers in [ROOT.GetNameDef] now run like any others. Children of old and new families share the classrooms, and few people still ask who arrived when."
chaosx.nr37.26.a: "We made room."
chaosx.nr37.26.a.tt: "Stability §G+5%§! for a year.\nThe workforce bonus from settled newcomers is doubled for a year."

chaosx.news.42.t: "Strangers Everyone Remembers"
chaosx.news.42.d: "Newspapers around the world carry the same story this morning. In towns on every continent, families have appeared overnight with houses, furniture and neighbours who swear they have known them for years. Priests, statisticians and police chiefs offer explanations, and no two of them agree."
chaosx.news.42.a: "Who are they?"

