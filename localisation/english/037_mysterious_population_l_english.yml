mysterious_people_roads_start_tt: "The civilian factories stay committed until the work is finished in 150 days."
mysterious_people_roads_done_tt: "[FROM.GetName] gains §G+1§! infrastructure, and newcomers there settle §G25%§! faster from then on."
mysterious_people_roads_cost: "[?FROM.mysterious_people_quote_roads_pp|0] £pol_power [?FROM.mysterious_people_quote_roads|0] £civ_factory"
mysterious_people_roads_cost_blocked: "§R[?FROM.mysterious_people_quote_roads_pp|0]§! £pol_power §R[?FROM.mysterious_people_quote_roads|0]§! £civ_factory"
