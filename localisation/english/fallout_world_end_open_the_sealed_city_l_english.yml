chaosx.fallout.740.t: "Open the Sealed City"
chaosx.fallout.740.opening.d: "The Quarantine council has kept the East Gate shut since the inspection crisis. Behind it, the Ash Ward blocks are dry enough for a measured return, but the old clinic, the archive vault, and the military depot all claim the same first corridor. The state can reopen one part of the city, and the choice will decide who owns its memory."
chaosx.fallout.740.a: "Reopen the civic blocks"
chaosx.fallout.740.a.tt: "Spend Food 5, Scrap 3, and Recognition 3. After 35 days, the civic reopening is graded against the sealed zone's shelter, reclamation, supply, and public trust."
chaosx.fallout.740.b: "Grant scientific access"
chaosx.fallout.740.b.tt: "Spend Food 4, Power 4, Scrap 2, and Recognition 2. After 35 days, a research team will test the sealed rooms and record whether its access protects medicine or strips the city for samples."
chaosx.fallout.740.c: "Send a salvage command"
chaosx.fallout.740.c.tt: "Spend Food 4, Fuel 2, Support Equipment 3, and Command Power 12. After 35 days, a controlled salvage column will be graded against the city's infrastructure, security, and the Quarantine government's cohesion."
chaosx.fallout.740.d: "Build a permanent memorial district"
chaosx.fallout.740.d.tt: "Spend Food 6, Medicine 3, Fuel 3, and Recognition 1. After 35 days, the memorial plan will be graded against shelter, disease pressure, exposure, and the families who still hold the sealed keys."
chaosx.fallout.742.t: "The First Rooms Open"
chaosx.fallout.742.reopen.success.d: "The civic blocks reopened under named ward stewards. The North Gate register now records families, clinic shifts, and repair crews, while the Quarantine council keeps the first public key."
chaosx.fallout.742.reopen.partial.d: "A civic corridor opened with a narrow register. The Ash Ward can receive families on fixed days, but the closed rooms still answer to the old inspection office."
chaosx.fallout.742.reopen.failure.d: "The civic reopening broke on the first key list. The East Gate stayed shut, the ward stewards lost trust in the council, and the sealed city gained another locked register."
chaosx.fallout.742.scientific.success.d: "The research team entered through the clinic service tunnel and returned with clean water samples, intact dosage records, and a map of rooms that can be treated without disturbing the memorial vault."
chaosx.fallout.742.scientific.partial.d: "The research team secured the clinic and one archive room. Its findings will help the Ash Ward, though the sample ledger is incomplete and the public still cannot see who approved the work."
chaosx.fallout.742.scientific.failure.d: "The sample team opened a contaminated service room and lost its chain of custody. Medicine was diverted to containment, and the Quarantine council now faces a renewed outbreak memory."
chaosx.fallout.742.salvage.success.d: "The salvage column cleared the depot without stripping the clinic. Filters, pumps, and a working power relay now serve the state, while a civilian inspector records every crate taken from the sealed city."
chaosx.fallout.742.salvage.partial.d: "The depot yielded filters and tools, but the column left the archive doors damaged. The military command has material to defend the corridor, and the ward council has a list of what it lost."
chaosx.fallout.742.salvage.failure.d: "The salvage command treated the city as an empty magazine. A fire in the depot ruined medicine stores, guards closed the East Gate again, and the council recorded deaths that cannot be repaired with scrap."
chaosx.fallout.742.memorial.success.d: "Families entered the memorial district in measured groups. The clinic kept a living register beside the names of the dead, and the sealed keys became a public trust instead of a private inheritance."
chaosx.fallout.742.memorial.partial.d: "The memorial district opened around the safest rooms. Families received medicine and a place to leave names, but high exposure kept the lower blocks closed through the first review."
chaosx.fallout.742.memorial.failure.d: "The memorial plan ran out of filters before the families could gather. The council sealed the lower blocks again, and the new register begins with an absence rather than a ceremony."
chaosx.fallout.742.a: "Review the opened rooms"
chaosx.fallout.742.a.tt: "Apply the authenticated 35-day result and continue the sealed-city transaction toward its delayed recovery review."
chaosx.fallout.744.t: "The City Keeps Its Key"
chaosx.fallout.744.success.d: "The recovery review finds a Quarantine state that can protect the reopened rooms and still answer to its wider population. The East Gate has a public custodian, the clinics share records, and the city's first memory is no longer hidden."
chaosx.fallout.744.partial.d: "The recovery review preserves the opened corridor, but its authority remains divided between the ward register, the clinic, and the depot command. A later health compact will decide whether the city becomes a regional service or a guarded exception."
chaosx.fallout.744.failure.d: "The recovery review finds another sealed boundary inside the city. The registry, the clinic, and the salvage command keep separate accounts, and the Quarantine government cannot claim that the rooms are open to everyone."
chaosx.fallout.744.a: "Record the recovery review"
chaosx.fallout.744.a.tt: "Apply the authenticated callback outcome and close the sealed-city transaction without creating a recurring decision or a new country tag."
