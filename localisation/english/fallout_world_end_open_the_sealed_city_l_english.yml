fallout.event_log.open_the_sealed_city.name: "Open the Sealed City"
fallout.event_log.open_the_sealed_city.detail: "A Quarantine state recorded the reopening of a closed urban zone, its delayed result, and the recovery review that followed."
fallout.event_log.open_the_sealed_city.choice_reopen: "The council reopened civic rooms under named ward stewards."
fallout.event_log.open_the_sealed_city.choice_science: "The council granted the clinic and archive team controlled scientific access."
fallout.event_log.open_the_sealed_city.choice_salvage: "The council sent a civilian-inspected salvage column into the sealed depot."
fallout.event_log.open_the_sealed_city.choice_memorial: "The council built a permanent memorial district for families holding the sealed keys."
fallout.event_log.open_the_sealed_city.reopen_success: "Civic rooms reopened under a public register and a Quarantine custodian."
fallout.event_log.open_the_sealed_city.reopen_partial: "A narrow civic corridor opened while the inspection office kept the lower rooms."
fallout.event_log.open_the_sealed_city.reopen_failure: "The civic key list failed and the East Gate gained another locked register."
fallout.event_log.open_the_sealed_city.science_success: "The clinic team returned clean samples and a safe map of the sealed rooms."
fallout.event_log.open_the_sealed_city.science_partial: "The clinic and one archive room opened, but the sample ledger remained incomplete."
fallout.event_log.open_the_sealed_city.science_failure: "A contaminated service room broke the chain of custody and consumed medicine."
fallout.event_log.open_the_sealed_city.salvage_success: "Filters, pumps, and a power relay left the depot under civilian inspection."
fallout.event_log.open_the_sealed_city.salvage_partial: "The depot yielded equipment while damaged archive doors became a ward grievance."
fallout.event_log.open_the_sealed_city.salvage_failure: "A depot fire ruined medicine and forced the East Gate closed again."
fallout.event_log.open_the_sealed_city.memorial_success: "Families entered a living memorial district whose keys became a public trust."
fallout.event_log.open_the_sealed_city.memorial_partial: "The memorial district opened around safe rooms while exposure kept lower blocks closed."
fallout.event_log.open_the_sealed_city.memorial_failure: "The memorial plan ran out of filters before the families could gather."
fallout.event_log.open_the_sealed_city.callback_success: "The recovery review found a public custodian, shared clinics, and an open first memory."
fallout.event_log.open_the_sealed_city.callback_partial: "The recovery review preserved the corridor but left the ward, clinic, and depot authority divided."
fallout.event_log.open_the_sealed_city.callback_failure: "The recovery review found separate accounts and another sealed boundary inside the city."
fallout.event_log.open_the_sealed_city.cancelled: "The sealed-city transaction was cancelled after its state, owner, or generation changed."
