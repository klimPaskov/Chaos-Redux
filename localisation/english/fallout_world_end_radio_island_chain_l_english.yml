l_english:
  chaosx.fallout.600.t: "The Radio Island Chain"
  chaosx.fallout.600.d: "A salt-stained radio station on the outer islands has kept a mast, a harbor receiver, and a cold-weather log alive through the ash years. Its operators can warn shelters and boats before a frozen squall closes the channel, but the batteries and the watch cannot serve every claimant. [ROOT.GetName] must decide who receives the signal."
  chaosx.fallout.600.a: "Open a public relay"
  chaosx.fallout.600.a.tt: "Spend Power, Fuel, Filters, and Recognition to keep island observers on a civilian schedule. Shelter warnings and local supply improve while the relay remains accountable to the public."
  chaosx.fallout.600.b: "Build a maritime defense net"
  chaosx.fallout.600.b.tt: "Spend Power, Fuel, Command Power, and War Support to place the transmitter under guarded patrol control. Convoys receive earlier warnings, while clinics receive a narrower service."
  chaosx.fallout.600.c: "Join the harbor subscription"
  chaosx.fallout.600.c.tt: "Spend Fuel, Scrap, and Recognition while committing enough Power to copy the current signal table into neighboring harbors. The chain gains outside contact, but its records no longer belong to one country."
  chaosx.fallout.600.d_option: "Form an island federation"
  chaosx.fallout.600.d_option.tt: "Spend Food, Power, Recognition, and Cohesion to seal the station under a local federation. The current government receives no exclusive broadcast, but a future island council inherits the archive."

  chaosx.fallout.602.t: "The island signal reaches the coast"
  chaosx.fallout.602.public_relay.success.d: "The crew replaced a corroded feeder line, dried the battery room, and moved the warning board into the clinic foyer. Boats and shelters received the cold-front notice before the channel froze. The public relay now names every island that answered."
  chaosx.fallout.602.public_relay.partial.d: "The mast came back before the harbor generator did. The capital and two anchorages received the warning, while outer villages marked the frost by sight and sound. The relay works, with its gaps written into the next watch."
  chaosx.fallout.602.public_relay.failure.d: "A salt storm ruined the replacement coils before they reached the tower. The radio room lost its readings and the clinic heard of the cold front from a fishing crew. The public schedule failed at the moment it was needed."
  chaosx.fallout.602.maritime_defense_net.success.d: "Patrol commanders learned the station code and moved fuel boats before the ash rain. Guarded channels carried the warning across the island chain, while observers kept a civilian copy for the harbor clinics."
  chaosx.fallout.602.maritime_defense_net.partial.d: "The patrol watch is staffed, but its schedule follows cutters before clinics. Convoys leave with useful warning, while villages learn of the same frozen squall when the roofs begin to glaze."
  chaosx.fallout.602.maritime_defense_net.failure.d: "The transmitter became a checkpoint before the mast was repaired. A patrol took the dry cells, the observers stopped signing the log, and the island chain lost the one voice trusted by both boats and shelters."
  chaosx.fallout.602.harbor_subscription.success.d: "Copies of the current signal table crossed three harbor relays before the next front arrived. Neighboring islands returned their own readings, and the shared map showed a storm corridor instead of a border. Couriers now have a reason to keep the channel open."
  chaosx.fallout.602.harbor_subscription.partial.d: "The chain released its older logs but held back the live wind table. Neighboring harbors answered with fragments, enough to mark a cold corridor but not enough to protect every boat. The subscription has begun with a line still withheld."
  chaosx.fallout.602.harbor_subscription.failure.d: "The copied table reached a rival receiver with its verification page missing. Two harbors broadcast different warnings, and the island crew spent its filters proving which thermometer had survived the ash."
  chaosx.fallout.602.island_federation.success.d: "The station crew sealed the cells, wrapped the signal books in waxed cloth, and marked the safe approach through the frozen inlet. No government owns the broadcast, yet the next island council will inherit a trustworthy record."
  chaosx.fallout.602.island_federation.partial.d: "The mast is quiet and the tower door is chained. One automatic receiver still records pressure, leaving a narrow thread for anyone who can reach it before the next hard freeze."
  chaosx.fallout.602.island_federation.failure.d: "The federation crew left the tower unsecured. Wind tore pages from the signal ledger, a salvage fire ruined the batteries, and the island chain became a blank space on every surviving harbor chart."
  chaosx.fallout.602.a: "Keep the signal ledger open"
  chaosx.fallout.602.a.tt: "Resolve the island signal and schedule the later harbor review."

  chaosx.fallout.604.t: "The harbor review returns"
  chaosx.fallout.604.success.d: "The scheduled review contains a full pressure series, a repaired feeder line, and acknowledgements from distant shelters. The island relay now carries a memory of every harbor that answered."
  chaosx.fallout.604.partial.d: "The review confirms one useful warning and one silent outpost. The station can continue, but each relay must name its missing readings and every boat needs a second route."
  chaosx.fallout.604.failure.d: "The review arrived with a torn seal and no current readings. The tower still stands, yet no one can tell whether its next transmission is weather or a claimant's message."
  chaosx.fallout.604.a: "Close the signal ledger"
  chaosx.fallout.604.a.tt: "Record the harbor review, release delayed cleanup, and close the island memory."

  fallout.event_log.radio_island_chain.name: "The Radio Island Chain"
  fallout.event_log.radio_island_chain.detail: "[This.GetName] chose who would keep a remote island radio, harbor receiver, and cold-weather ledger alive. The decision changed shelter warnings, maritime patrols, outside contact, and the station's place in the region's recovery."
  fallout.event_log.radio_island_chain.public_relay_success: "Opened a public island relay"
  fallout.event_log.radio_island_chain.public_relay_partial: "Kept a public relay with marked gaps"
  fallout.event_log.radio_island_chain.public_relay_failure: "Lost the public warning schedule"
  fallout.event_log.radio_island_chain.maritime_defense_net_success: "Built a guarded maritime warning net"
  fallout.event_log.radio_island_chain.maritime_defense_net_partial: "Held a patrol net that left clinics waiting"
  fallout.event_log.radio_island_chain.maritime_defense_net_failure: "Turned the transmitter into an empty checkpoint"
  fallout.event_log.radio_island_chain.harbor_subscription_success: "Opened a working harbor signal exchange"
  fallout.event_log.radio_island_chain.harbor_subscription_partial: "Shared old signal tables while holding the live one"
  fallout.event_log.radio_island_chain.harbor_subscription_failure: "Lost the verification chain in a harbor dispute"
  fallout.event_log.radio_island_chain.island_federation_success: "Sealed an island archive for a future council"
  fallout.event_log.radio_island_chain.island_federation_partial: "Left one automatic receiver behind"
  fallout.event_log.radio_island_chain.island_federation_failure: "Lost the signal archive to wind and salvage fire"
  fallout.event_log.radio_island_chain.callback_success: "Received a complete harbor review"
  fallout.event_log.radio_island_chain.callback_partial: "Received a partial island review"
  fallout.event_log.radio_island_chain.callback_failure: "Closed the station after a failed review"
  fallout.event_log.radio_island_chain.cancelled: "Cancelled the island chain before delivery"
