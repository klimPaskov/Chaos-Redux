brilliant_scientist_release_kruger_effect_tt: "When preparations finish, current authority, dependence, facilities, and autonomous project capacity are checked again. A valid release ends the hosted Directorate without erasing independently reproduced research history."
brilliant_scientist_exile_kruger_effect_tt: "When preparations finish, Kruger departs only if the named recipient remains valid. A failed transfer leaves him in present custody and returns the question to the board."
brilliant_scientist_arrest_kruger_effect_tt: "When the operation begins, government strength is measured against Kruger's live institutional and military strength. Arrest can succeed, provoke defection, or trigger an uprising."
brilliant_scientist_shutdown_directorate_effect_tt: "When the operation begins, government strength is measured against Kruger's live institutional and military strength. Closure can succeed or provoke organized resistance."
brilliant_scientist_ratify_sovereign_charter_effect_tt: "At ratification, every selected state is rechecked. Invalid land is never transferred, and the sovereignty board reopens instead."
brilliant_scientist_launch_military_seizure_effect_tt: "The final operation compares state security and military preparation with facilities, guards, dangerous projects, Dependence, and the Directorate's remaining private reach."
brilliant_scientist_request_foreign_containment_effect_tt: "The final operation includes faction support but also tests whether foreign contacts give Kruger a viable escape route."
brilliant_scientist_concede_institutional_authority_effect_tt: "The host becomes the Kruger State only if the Directorate already commands the institutions required for a nonterritorial takeover."

chaosx.nr16.30.t: "The Sovereignty Deadline Expires"
chaosx.nr16.30.d: "The final hour passes without a completed settlement. Directorate offices cease answering routine ministry orders. Security commanders request written authority to act, while Kruger's representatives insist that the government's earlier response already determines the constitutional course. The confrontation will now be resolved by that commitment and by the power each side actually assembled. [This.GetBrilliantScientistHostFlavorClause] [This.GetBrilliantScientistCountryFlavorClause] [This.GetBrilliantScientistSovereigntyPolicyClause]"
chaosx.nr16.30.a: "Put the recorded policy into effect."
brilliant_scientist_sovereignty_deadline_resolution_tt: "Resolve the crisis from the response selected during Sovereign Science and the Directorate's current causal state."

chaosx.nr16.31.t: "The Directorate Settlement"
chaosx.nr16.31.released.d: "The government revokes Kruger's commission and opens the gates. His immediate entourage leaves state service, while the ministries retain only work that their own institutions had learned to reproduce. The Directorate ends without a battle. [This.GetBrilliantScientistHostFlavorClause] [This.GetBrilliantScientistCountryFlavorClause] [This.GetBrilliantScientistSovereigntyPolicyClause]"
chaosx.nr16.31.exiled.d: "The guarded train departs under sealed orders and reaches foreign custody without incident. Kruger crosses the frontier carrying the personal records and scientific history accumulated during his service. [This.GetBrilliantScientistHostFlavorClause] [This.GetBrilliantScientistCountryFlavorClause] [This.GetBrilliantScientistSovereigntyPolicyClause]"
chaosx.nr16.31.confined.d: "Security units secure the laboratories before their guards can coordinate. Kruger is removed from public and scientific command, and the state takes custody of the remaining sites. The outcome owes as much to earlier limits on his independence as to the arrest order itself. [This.GetBrilliantScientistHostFlavorClause] [This.GetBrilliantScientistCountryFlavorClause] [This.GetBrilliantScientistSovereigntyPolicyClause]"
chaosx.nr16.31.shutdown.d: "The final machinery is disconnected under guard. Staff disperse, registered sites are shuttered, and Kruger's appointment ends. Research already reproduced by national institutions survives as history. The personal Directorate does not. [This.GetBrilliantScientistHostFlavorClause] [This.GetBrilliantScientistCountryFlavorClause] [This.GetBrilliantScientistSovereigntyPolicyClause]"
chaosx.nr16.31.foreign_defection.d: "The containment cordon closes too slowly. Foreign contacts prepared during the international contest extract Kruger before state security reaches him. His papers, loyalties, and accumulated scientific history pass intact into another government's custody. [This.GetBrilliantScientistHostFlavorClause] [This.GetBrilliantScientistCountryFlavorClause] [This.GetBrilliantScientistSovereigntyPolicyClause]"
chaosx.nr16.31.laboratory_uprising.d: "The seizure fails at the laboratory perimeter. A compact enclave rallies around the viable sites that Kruger's guards and independent workshops can hold, while the former host retains enough territory to survive. The new frontier follows surviving facilities and prior investment, with no arbitrary territorial grant. [This.GetBrilliantScientistHostFlavorClause] [This.GetBrilliantScientistCountryFlavorClause] [This.GetBrilliantScientistSovereigntyPolicyClause]"
chaosx.nr16.31.kruger_state_rebellion.d: "Orders to submit are answered by coordinated seizures of laboratories, depots, and communications nodes. Kruger's independent network becomes a state because it possessed the territory, production, personnel, and dangerous projects to survive the attempt at coercion. [This.GetBrilliantScientistHostFlavorClause] [This.GetBrilliantScientistCountryFlavorClause] [This.GetBrilliantScientistSovereigntyPolicyClause]"
chaosx.nr16.31.kruger_state_charter.d: "The charter is signed and the verified laboratory territory passes under a separate scientific administration. The settlement preserves a viable former host while giving Kruger's facilities and staff the sovereignty promised by the government's earlier choice. [This.GetBrilliantScientistHostFlavorClause] [This.GetBrilliantScientistCountryFlavorClause] [This.GetBrilliantScientistSovereigntyPolicyClause]"
chaosx.nr16.31.institutional_takeover.d: "No frontier is drawn. Ministries, guards, laboratories, and dependent production already answer to the Directorate, and the government acknowledges the fact. The host state becomes Kruger's instrument through institutional capture, with no territorial secession. [This.GetBrilliantScientistHostFlavorClause] [This.GetBrilliantScientistCountryFlavorClause] [This.GetBrilliantScientistSovereigntyPolicyClause]"
chaosx.nr16.31.noncountry_crisis.d: "The coercive operation destroys the possibility of an orderly settlement but fails to produce a viable state. Kruger escapes into dispersed cells around surviving sites. The Directorate remains a persistent security crisis and receives no territory it cannot actually hold. [This.GetBrilliantScientistHostFlavorClause] [This.GetBrilliantScientistCountryFlavorClause] [This.GetBrilliantScientistSovereigntyPolicyClause]"
chaosx.nr16.31.a: "The settlement enters the record."
chaosx.nr16.31.b: "Continue as the Kruger State."

chaosx.nr16.32.t: "The Settlement Map Is No Longer Valid"
chaosx.nr16.32.d: "The legal and territorial facts changed during preparation. A selected laboratory is no longer owned or controlled, the proposed enclave cannot sustain itself, the former host would be left nonviable, or the promised recipient can no longer accept Kruger. No land or character has moved. The government must choose an outcome that the present world can support. [This.GetBrilliantScientistHostFlavorClause] [This.GetBrilliantScientistCountryFlavorClause] [This.GetBrilliantScientistSovereigntyPolicyClause]"
chaosx.nr16.32.a: "Return the question to the sovereignty board."

brilliant_scientist_sovereignty_policy_clause_safe_compact: "The recorded compact still favors supervised regional science over a break with the host."
brilliant_scientist_sovereignty_policy_clause_charter: "The binding charter made the Directorate's claim a constitutional promise before the deadline arrived."
brilliant_scientist_sovereignty_policy_clause_concession: "The concession left the government dependent on the institution it meant to contain."
brilliant_scientist_sovereignty_policy_clause_military_seizure: "The seizure order made the confrontation a test of force and left no room for negotiation."
brilliant_scientist_sovereignty_policy_clause_foreign_containment: "The foreign-containment policy placed the laboratory inside an international bargain with its own price."
brilliant_scientist_sovereignty_policy_clause_refusal: "The refusal preserved the state's legal claim while leaving Kruger's network room to resist it."
brilliant_scientist_sovereignty_policy_clause_unrecorded: "No Evolution IV sovereignty policy remains recorded, so the report follows the surviving containment facts."
brilliant_scientist_invalidated_contract_reopens_board_tt: "The board remains open. No alternate settlement, land transfer, or change of custody has occurred."
