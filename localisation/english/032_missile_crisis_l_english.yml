l_english:
chaosx.nr32.1.t: "Missiles"

chaosx.nr32.2.t: "A Program Takes Shape"
chaosx.nr32.2.d: "A controlled launch site has entered the command ledger. Crews, codes, and stored missiles are now part of a real weapons programme whose safety depends on readiness, custody, and restraint."
chaosx.nr32.2.a: "Secure the programme."

chaosx.nr32.3.t: "The Missile Age"
chaosx.nr32.3.d: "Across several continents, new launch structures are being sealed behind military cordons. Canisters move under guard, range crews report test plumes, and foreign observers find the same unexplained pattern in every capital."
chaosx.nr32.3.a: "The world takes note."

chaosx.nr32.4.t: "The Missile Age Stalls"
chaosx.nr32.4.desc: "The selected Missile Age setup could not be completed. [GetMissilesScenarioFailureReason] No programme, site, reserve, incident, or posture was committed by the failed preflight."
chaosx.nr32.4.a: "Review the launch conditions."

missiles.scenario.failure.none: "No failure was recorded."
missiles.scenario.failure.invalid_selection: "The selected profile or intensity was invalid."
missiles.scenario.failure.no_profile_pool: "The profile has no eligible country pool."
missiles.scenario.failure.profile_gate_disabled: "A required evolution or scenario gate is disabled."
missiles.scenario.failure.missing_site_plan: "At least one selected country lacks a valid launch-site state."
missiles.scenario.failure.missing_existing_war: "Saturation War requires a safe existing war between eligible countries."
missiles.scenario.failure.missing_payload_owner: "Special Payload Crisis requires an eligible existing payload owner."
missiles.scenario.failure.missing_retaliation_participants: "Retaliation Network could not assemble its bounded participant group."
missiles.scenario.failure.package_failure: "A selected country could not receive a valid programme package."
missiles.scenario.failure.duplicate_launch: "The Missile Age has already been launched in this campaign."
missiles.scenario.failure.missing_breakdown_candidate: "Command Breakdown could not find an eligible vulnerable command structure."

chaosx.nr32.30.t: "Special Payload Integration"
chaosx.nr32.30.desc: "The command staff can fit a special payload only when the country already controls the weapon, stockpile, and secure launch site. A conventional warhead remains available if no special payload can be authorised."
chaosx.nr32.30.a: "Integrate a chemical payload."
chaosx.nr32.30.b: "Integrate a biological payload."
chaosx.nr32.30.c: "Integrate a nuclear payload."
chaosx.nr32.30.d: "Integrate a thermonuclear payload."
chaosx.nr32.30.e: "Keep the next operation conventional."

chaosx.nr32.31.t: "Select the Payload"
chaosx.nr32.31.desc: "The launch order needs one warhead. Command lists only payloads that remain in secure custody and are authorised for use."
chaosx.nr32.31.a: "Use a conventional warhead."
chaosx.nr32.31.b: "Use a chemical warhead."
chaosx.nr32.31.c: "Use a biological warhead."
chaosx.nr32.31.d: "Use a nuclear warhead."
chaosx.nr32.31.e: "Use a thermonuclear warhead."

chaosx.nr32.32.t: "Payload Employment Policy"
chaosx.nr32.32.desc: "The missile command needs standing orders for chemical, biological, nuclear, and thermonuclear warheads. The chosen policy will determine when officers may authorise their use."
chaosx.nr32.32.a: "Prohibit special payloads."
chaosx.nr32.32.b: "Reserve them for retaliation."
chaosx.nr32.32.c: "Limit them to military targets."
chaosx.nr32.32.d: "Permit them in wartime."
chaosx.nr32.32.e: "Delegate emergency authority."

chaosx.nr32.40.t: "Retaliation Posture"
chaosx.nr32.40.desc: "Warning reports now reach the missile command. The government can supervise every response, delegate limited authority, or permit an automatic response when the network is secure and ready."
chaosx.nr32.40.a: "Keep retaliation off."
chaosx.nr32.40.b: "Keep retaliation supervised."
chaosx.nr32.40.c: "Delegate a response."
chaosx.nr32.40.d: "Adopt automatic retaliation."

chaosx.nr32.60.t: "Rogue Launch Commands"
chaosx.nr32.60.desc: "A compromised command channel has cut one launch site off from lawful authority. The government can rotate codes, isolate the site, negotiate, send loyal forces, or destroy the installation, but the rogue crews still control the missiles stored there."
chaosx.nr32.60.a: "Review the crisis."
chaosx.nr32.60.b: "Rotate emergency codes."
chaosx.nr32.60.c: "Isolate the rogue site."
chaosx.nr32.60.d: "Negotiate with the command."
chaosx.nr32.60.e: "Scuttle the site."
chaosx.nr32.60.f: "Permit the rogue launch."
chaosx.nr32.60.g: "Wait for more evidence."

chaosx.nr32.80.t: "Warning at the Line"
chaosx.nr32.80.desc: "Missile command has received a warning that may demand retaliation. Officers can verify the report, delay the response, sever the network, or accept the launch order."
chaosx.nr32.80.a: "Verify the warning."
chaosx.nr32.80.b: "Delay retaliation."
chaosx.nr32.80.c: "Sever the network."
chaosx.nr32.80.d: "Accept the response."
chaosx.nr32.80.e: "Hold."

missiles.event_log.detail: "Missile programmes have spread across the world. Countries can build and harden launch sites, stock operational missiles, improve guidance, and secure the officers and codes that control them. Heavier arsenals, guidance failures, special warheads, rogue commands, and automatic retaliation can transform the crisis."
missiles.event_log.history.row: "Missile Age: [?global.events_log_view_payload_entries^events_log_history_index|0] national programmes established or expanded."

missiles.evolution.saturation.type: "Saturation Arsenals"
missiles.evolution.saturation.title: "Saturation Arsenals"
missiles.evolution.saturation.body: "Growing reserves and larger launch sites can support massed salvos. Saturation attacks can overwhelm defences, but they consume many missiles and strain readiness and command control."
missiles.evolution.unreliable_guidance.type: "Unreliable Guidance"
missiles.evolution.unreliable_guidance.title: "Unreliable Guidance"
missiles.evolution.unreliable_guidance.body: "Faulty guidance can send missiles away from their intended targets. Drift, false warnings, interception, and damage to launch sites force commanders to investigate failures and contain their consequences."
missiles.evolution.special_warheads.type: "Special Warheads"
missiles.evolution.special_warheads.title: "Special Warheads"
missiles.evolution.special_warheads.body: "Countries that already possess chemical, biological, nuclear, or thermonuclear weapons can adapt them for missile delivery. Each launch still requires an authorised warhead held in secure custody."
missiles.evolution.rogue_commands.type: "Rogue Launch Commands"
missiles.evolution.rogue_commands.title: "Rogue Launch Commands"
missiles.evolution.rogue_commands.body: "A compromised launch site can break from lawful authority while its crews still hold missiles and warheads. The government must regain control through new codes, isolation, negotiation, loyal forces, or the destruction of the site."
missiles.evolution.automatic_retaliation.type: "Automatic Retaliation"
missiles.evolution.automatic_retaliation.title: "Automatic Retaliation"
missiles.evolution.automatic_retaliation.body: "Governments can delegate retaliation to officers or automatic warning systems. A disputed alert may be verified, delayed, or stopped by severing the network before missiles leave their sites."
missiles.evolution.summary: "The Missile Age may bring heavier arsenals, unreliable guidance, special warheads, rogue command crises, and automatic retaliation. Each danger changes how countries build, protect, and use their missile forces."

chaosx.scenarios.missile_age.name: "Missile Age"
chaosx.scenarios.missile_age.desc.global_proliferation: "Establishes or expands missile programmes across eligible countries. Higher intensity grants stronger technology, larger reserves, more launch capacity, and better readiness without choosing a future crisis."
chaosx.scenarios.missile_age.desc.saturation_war: "Turns an existing war between missile powers into an arms race. The belligerents gain larger arsenals and the ability to prepare saturation attacks, while neutral countries retain ordinary programmes."
chaosx.scenarios.missile_age.desc.command_breakdown: "Exposes vulnerable missile powers to guidance failures and rogue launch commands. Control may weaken and launch sites may defect, but the crisis does not begin with an immediate strike."
chaosx.scenarios.missile_age.desc.special_payload_crisis: "Allows countries that already possess special warheads and stockpiles to adapt them for missile delivery. The scenario grants no chemical, biological, nuclear, or thermonuclear weapon by itself."
chaosx.scenarios.missile_age.desc.retaliation_network: "Builds retaliation networks with warning systems and national response postures. Lower intensities avoid an immediate launch, while higher intensities place more pressure on the warning chain."
chaosx.scenarios.missile_age.impact.low: "§RStarts the Missile Age immediately.§! A limited group receives early missile technology, modest reserves, one launch site, and secure command."
chaosx.scenarios.missile_age.impact.medium: "§RStarts the Missile Age immediately.§! More countries receive stronger reserves and secondary launch sites, and missile crises may begin to develop."
chaosx.scenarios.missile_age.impact.high: "§RStarts the Missile Age immediately.§! Most eligible countries receive mature regional programmes, larger reserves, advanced sites, and a greater risk of crisis."
chaosx.scenarios.missile_age.impact.maximum: "§RStarts the Missile Age immediately.§! Every eligible country receives the strongest supported programme and faces the full range of missile risks. The campaign continues."
