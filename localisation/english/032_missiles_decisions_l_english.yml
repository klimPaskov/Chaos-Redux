missiles_secondary_site_mission_cancelled_tt: "Secondary-site construction is cancelled before the expansion phase ends."
missiles_secondary_site_mission_timeout_tt: "Secondary-site construction fails before the deadline."
missiles_site_repair_mission_success_tt: "The damaged site returns to the recovery pipeline."
missiles_site_repair_mission_cancelled_tt: "Site recovery is cancelled because the incident context is no longer valid."
missiles_site_repair_mission_timeout_tt: "Site recovery fails before the damaged site can be restored."
missiles_site_recovery_mission_success_tt: "The compromised site is recovered by loyal forces."
missiles_site_recovery_mission_cancelled_tt: "The site-recovery operation is cancelled because the rogue crisis has ended."
missiles_site_recovery_mission_timeout_tt: "The rogue site is not secured before the recovery deadline."
missiles_precision_preparation_success_tt: "The precision operation is ready for a final launch decision."
missiles_strategic_preparation_success_tt: "The strategic barrage is ready for a final launch decision."
missiles_saturation_preparation_success_tt: "The saturation barrage is ready for a final launch decision."
missiles_counterforce_preparation_success_tt: "The counterforce operation is ready for a final launch decision."
missiles_preparation_cancelled_tt: "Preparation is cancelled; the operation receipt is aborted and cleaned up."
missiles_preparation_timeout_tt: "Preparation expires; the operation receipt is aborted and cleaned up."
missiles_warning_verification_success_tt: "The warning evidence is reconciled with the active incident root."
missiles_warning_verification_cancelled_tt: "Warning verification ends because the emergency is no longer active."
missiles_warning_verification_timeout_tt: "The warning window closes before verification is complete."
missiles_network_restoration_success_tt: "The retaliation network is restored under secure command."
missiles_network_restoration_cancelled_tt: "Network restoration is cancelled because the program or emergency is no longer valid."
missiles_network_restoration_timeout_tt: "Network restoration fails before the deadline."
