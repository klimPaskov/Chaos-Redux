missiles_program_management_category_desc_live: "Missile command controls the country's launch sites, operational weapons, crews, and codes.\n\n§Y£GFX_032_missiles_operational_reserve_texticon Operational Reserve:§! [?missiles_operational_reserve|0]  §Y£GFX_032_missiles_launch_readiness_texticon Launch Readiness:§! [?missiles_launch_readiness|0]/100  §Y£GFX_032_missiles_command_control_texticon Command Control:§! [?missiles_command_control|0]/100\n§YTechnology:§! [This.GetMissilesProgramStageName]  §YSites:§! [?missiles_active_site_count|0]  §YGuidance:§! [This.GetMissilesGuidanceGradeName]\n§YTarget:§! [This.GetMissilesCategoryTargetName]  §YRetaliation:§! [This.GetMissilesCategoryRetaliationLine]\n§YCrisis:§! [This.GetMissilesCategoryCrisisName]\n\nPreparing an operation requires an operational site, sufficient reserve, a valid target, and secure command."
