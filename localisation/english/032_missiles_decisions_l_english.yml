missiles_secondary_site_construction_mission: "Secondary-Site Construction"
missiles_secondary_site_construction_mission_desc: "Construction crews are building a redundant launch site in the selected state."
missiles_site_repair_mission: "Launch-Site Recovery"
missiles_site_repair_mission_desc: "Crews are restoring a damaged site before it can rejoin the launch network."
missiles_site_recovery_mission: "Rogue-Site Recovery"
missiles_site_recovery_mission_desc: "Loyal forces must secure the compromised site before its command can launch independently."
missiles_precision_strike_preparation_mission: "Precision-Strike Preparation"
missiles_precision_strike_preparation_mission_desc: "The selected site, target state, reserve receipt, and command chain must remain valid until preparation completes."
missiles_strategic_barrage_preparation_mission: "Strategic-Barrage Preparation"
missiles_strategic_barrage_preparation_mission_desc: "The strategic barrage is being assembled against its recorded target."
missiles_saturation_barrage_preparation_mission: "Saturation-Barrage Preparation"
missiles_saturation_barrage_preparation_mission_desc: "A large salvo is being assembled; interruption can strand its reserved capacity."
missiles_counterforce_strike_preparation_mission: "Counterforce Preparation"
missiles_counterforce_strike_preparation_mission_desc: "The counterforce package is being aligned against a proven enemy facility."
missiles_warning_verification_mission: "Warning Verification"
missiles_warning_verification_mission_desc: "The warning window remains open while the command compares the incident root with available evidence."
missiles_retaliation_network_restoration_mission: "Retaliation-Network Restoration"
missiles_retaliation_network_restoration_mission_desc: "Secure codes, functioning sites, and command control must be restored before automatic response can return."

