missiles_program_experimental: "Experimental Missile Programme"
missiles_program_experimental_desc: "Test ranges, prototype rockets, and a new command staff are turning missile research into an operational weapons programme."
missiles_program_operational: "Operational Missile Programme"
missiles_program_operational_desc: "Established launch sites, trained crews, and secure command links support regular missile operations."
missiles_program_compromised: "Compromised Missile Programme"
missiles_program_compromised_desc: "Damaged command links and contested launch authority have weakened public confidence and the reliability of the missile force."

missiles_launch_site_active: "Active Missile Launch Site"
missiles_launch_site_active_desc: "This state hosts an operational missile launch site with working supply and maintenance links."
missiles_launch_site_hardened: "Hardened Missile Launch Site"
missiles_launch_site_hardened_desc: "Reinforced shelters and redundant command links protect this launch site and support local forces."
missiles_launch_site_damaged: "Damaged Missile Launch Site"
missiles_launch_site_damaged_desc: "Damage to the launch site disrupts supplies, repairs, and military organisation in this state."
missiles_launch_site_compromised: "Compromised Missile Launch Site"
missiles_launch_site_compromised_desc: "Security failures and uncertain command authority are disrupting the launch site and the surrounding state."
missiles_launch_site_rogue: "Rogue Missile Launch Site"
missiles_launch_site_rogue_desc: "The launch crews no longer answer lawful command and are drawing supplies away from loyal forces."

missiles_neutral_accident_compensation: "Compensation for Missile Accident"
missiles_neutral_accident_denial: "Denied Missile Accident"

missiles_survey_launch_state: "Survey a Launch State"
missiles_survey_launch_state_desc: "Commit a survey team to a controlled state with the infrastructure and strategic depth to host a launch site."
missiles_establish_command_authority: "Establish Command Authority"
missiles_establish_command_authority_desc: "Create the first secure chain of custody for missile crews, codes, and launch orders."
missiles_guard_captured_site: "Guard the Captured Launch Site"
missiles_guard_captured_site_desc: "Place loyal guards around a captured launch site and isolate its crews, weapons, and codes from outside interference."
missiles_study_captured_site: "Study the Captured Launch Site"
missiles_study_captured_site_desc: "Inspect a captured launch site for usable guidance equipment, command records, and maintenance procedures."
missiles_integrate_captured_site: "Integrate the Captured Launch Site"
missiles_integrate_captured_site_desc: "Bring a captured launch site under national command and connect its surviving equipment to the missile network."
missiles_scuttle_captured_site: "Scuttle the Captured Launch Site"
missiles_scuttle_captured_site_desc: "Destroy a captured launch site before its weapons, equipment, or codes can be recovered by another power."
missiles_replenish_operational_reserve: "Replenish Operational Reserve"
missiles_replenish_operational_reserve_desc: "Commit fuel, components, and trained personnel to assemble another operational missile batch."
missiles_restore_launch_readiness: "Restore Launch Readiness"
missiles_restore_launch_readiness_desc: "Run fueling, communications, and crew drills to bring the network back toward its working threshold."
missiles_improve_guidance_and_maintenance: "Improve Guidance and Maintenance"
missiles_improve_guidance_and_maintenance_desc: "Replace guidance components and retrain crews before the next operation exposes the program's limits."
missiles_secure_launch_authority: "Secure Launch Authority"
missiles_secure_launch_authority_desc: "Rotate access, inspect crews, and narrow delegated authority across the launch network."
missiles_harden_launch_site: "Harden the Launch Site"
missiles_harden_launch_site_desc: "Reinforce a controlled launch site against bombardment, sabotage, and the loss of stored reserve."
missiles_expand_launch_capacity: "Expand Launch Capacity"
missiles_expand_launch_capacity_desc: "Increase the number of missiles that a controlled site can prepare for one operation."
missiles_establish_secondary_launch_site: "Establish a Secondary Launch Site"
missiles_establish_secondary_launch_site_desc: "Build redundancy in a valid controlled state so one damaged site cannot ground the entire program."
missiles_select_target_country: "Select Missile Target"
missiles_select_target_country_desc: "Bind the command network to one valid enemy country before choosing an exact target state."
missiles_prepare_precision_strike: "Prepare Precision Strike"
missiles_prepare_precision_strike_desc: "Reserve a controlled site and prepare a limited strike against the selected enemy target."
missiles_prepare_strategic_barrage: "Prepare Strategic Barrage"
missiles_prepare_strategic_barrage_desc: "Prepare a heavier operation against a selected enemy target at the cost of readiness and reserve."
missiles_prepare_saturation_barrage: "Prepare Saturation Barrage"
missiles_prepare_saturation_barrage_desc: "Prepare a broad missile salvo that trades reserve and command stability for overwhelming pressure."
missiles_prepare_counterforce_strike: "Prepare Counterforce Strike"
missiles_prepare_counterforce_strike_desc: "Prepare a strike against a proven enemy launch or special-payload facility."
missiles_integrate_special_payload: "Integrate Special Payload"
missiles_integrate_special_payload_desc: "Bind an available special payload to the next prepared operation and accept its wider consequences."
missiles_select_special_payload: "Select Special Payload"
missiles_select_special_payload_desc: "Choose which authorised warhead missile command will reserve for the next operation."
missiles_set_special_payload_policy: "Set Special-Payload Policy"
missiles_set_special_payload_policy_desc: "Issue standing orders that govern when missile command may use chemical, biological, nuclear, or thermonuclear warheads."
missiles_set_retaliation_posture: "Set Retaliation Posture"
missiles_set_retaliation_posture_desc: "Choose how much launch authority the government will delegate when the warning network reports an attack."
missiles_launch_prepared_operation: "Launch Prepared Operation"
missiles_launch_prepared_operation_desc: "Commit the prepared operation against its recorded country, state, profile, and payload."
missiles_abort_prepared_operation: "Abort Prepared Operation"
missiles_abort_prepared_operation_desc: "Stand down before commitment and let the command network reconcile reserved missiles and sites."
missiles_inspect_incident: "Inspect the Incident"
missiles_inspect_incident_desc: "Review the current incident record, evidence, attribution, and damage before choosing a response."
missiles_accelerate_incident_recovery: "Accelerate Incident Recovery"
missiles_accelerate_incident_recovery_desc: "Send fuel and replacement equipment to restore damaged launch systems before the incident worsens."
missiles_compensate_neutral_victim: "Compensate the Neutral Victim"
missiles_compensate_neutral_victim_desc: "Accept responsibility for an accidental neutral strike and commit material aid to the affected country."
missiles_deny_incident_responsibility: "Deny Responsibility"
missiles_deny_incident_responsibility_desc: "Reject an uncertain accusation and spend political influence to challenge the evidence."
missiles_emergency_guidance_recalibration: "Recalibrate Guidance Systems"
missiles_emergency_guidance_recalibration_desc: "Replace damaged guidance components and retest the network after a guidance failure."
missiles_investigate_debris: "Investigate the Debris"
missiles_investigate_debris_desc: "Recover missile debris from the affected state and examine it for evidence of the launch and its failure."
missiles_suspend_damaged_site: "Suspend the Damaged Site"
missiles_suspend_damaged_site_desc: "Remove a damaged site from launch planning while crews begin a limited repair programme."
missiles_rotate_emergency_codes: "Rotate Emergency Codes"
missiles_rotate_emergency_codes_desc: "Invalidate compromised launch authority before a rogue command can turn preparation into a launch."
missiles_isolate_rogue_site: "Isolate the Rogue Site"
missiles_isolate_rogue_site_desc: "Cut a compromised site's communications and remove its capacity from the active network."
missiles_send_loyal_forces: "Send Loyal Forces"
missiles_send_loyal_forces_desc: "Commit supplied forces to recover a compromised site before its command can act independently."
missiles_negotiate_with_command: "Negotiate with the Command"
missiles_negotiate_with_command_desc: "Buy time through a command settlement that may preserve the site while conceding authority or amnesty."
missiles_scuttle_rogue_site: "Scuttle the Rogue Site"
missiles_scuttle_rogue_site_desc: "Destroy the compromised site and its local reserve rather than risk an unauthorized launch."
missiles_allow_rogue_launch: "Allow the Rogue Launch"
missiles_allow_rogue_launch_desc: "Stand aside and let the rogue command fire the missiles held at its launch site."
missiles_verify_warning: "Verify the Warning"
missiles_verify_warning_desc: "Use the remaining warning window to compare the alert with radar, intelligence, and the functioning command network."
missiles_delay_retaliation: "Delay Retaliation"
missiles_delay_retaliation_desc: "Extend the warning window once, accepting a readiness penalty while evidence is gathered."
missiles_sever_retaliation_network: "Sever the Retaliation Network"
missiles_sever_retaliation_network_desc: "Stop automatic launch authority across the network and accept the burden of restoring it later."
missiles_isolate_retaliation_site: "Isolate One Retaliation Site"
missiles_isolate_retaliation_site_desc: "Cut one site's response channel while preserving the rest of the network."
missiles_accept_retaliation_response: "Accept the Current Response"
missiles_accept_retaliation_response_desc: "Confirm the recorded response and commit the prepared retaliation."
missiles_restore_retaliation_network: "Restore the Retaliation Network"
missiles_restore_retaliation_network_desc: "Rebuild secure warning and launch links after a deliberate network severance."

missiles_survey_requirements_tt: "A controlled state must pass the launch-site survey and support the required installation."
missiles_command_authority_requirements_tt: "The command staff must have enough authority to create a secure launch chain."
missiles_site_upgrade_requirements_tt: "The selected site must be an active controlled missile launch site."
missiles_launch_requirements_tt: "The assigned launch site, target, weapon reserve, and operation order must still be valid."

missiles_survey_effect_tt: "Begins a survey mission in the selected state. The state must remain controlled and suitable for a launch site."
missiles_command_authority_effect_tt: "Command Control is established through a secure code and crew chain."
missiles_guard_captured_site_effect_tt: "Loyal guards secure the captured site and prevent its immediate seizure or use."
missiles_study_captured_site_effect_tt: "Engineers study the captured site and record what its equipment reveals."
missiles_integrate_captured_site_effect_tt: "The captured site joins the national missile network under secure command."
missiles_scuttle_captured_site_effect_tt: "The captured launch site and the missiles stored there are destroyed."
missiles_replenish_effect_tt: "The programme receives a limited reserve replenishment scaled to its current stage and capacity."
missiles_readiness_effect_tt: "Launch Readiness is restored and the maintenance backlog is reduced."
missiles_guidance_effect_tt: "Guidance pressure is reduced and the next operation receives better maintenance conditions."
missiles_secure_codes_effect_tt: "Compromised access is invalidated and Command Control is strengthened."
missiles_harden_site_effect_tt: "The selected site's hardening band rises and its damage risk is reduced."
missiles_expand_capacity_effect_tt: "The selected site's operation capacity rises and its maintenance burden is refreshed."
missiles_secondary_site_effect_tt: "A long construction mission begins for the selected secondary site."
missiles_select_target_effect_tt: "The selected enemy is bound to the missile command's target desk."
missiles_precision_strike_effect_tt: "A precision operation receives its launch order and begins preparation."
missiles_strategic_barrage_effect_tt: "A strategic barrage receives its launch order and begins preparation."
missiles_saturation_barrage_effect_tt: "A saturation barrage receives its launch order and begins preparation."
missiles_counterforce_strike_effect_tt: "A counterforce operation receives its launch order and begins preparation."
missiles_special_payload_effect_tt: "The selected special payload is integrated into the next operation."
missiles_select_payload_effect_tt: "Opens the payload list and records the selected warhead for the next operation."
missiles_set_payload_policy_effect_tt: "Opens the special-payload policy choices for missile command."
missiles_set_posture_effect_tt: "Opens the retaliation-posture choices for the warning network."
missiles_launch_prepared_effect_tt: "The prepared operation is committed to its selected target and delivery plan."
missiles_abort_operation_effect_tt: "The operation is cancelled and its reserved resources are returned."
missiles_inspect_incident_effect_tt: "The active incident record is displayed for command review."
missiles_accelerate_recovery_effect_tt: "Fuel and replacement equipment shorten the active incident recovery."
missiles_compensate_effect_tt: "Material compensation reduces the diplomatic damage without erasing the incident record."
missiles_deny_responsibility_effect_tt: "The government disputes the accusation and challenges the available evidence."
missiles_emergency_recalibration_effect_tt: "Guidance systems are recalibrated for the next launch, at a small cost to Launch Readiness."
missiles_investigate_debris_effect_tt: "Investigators recover debris and improve the evidence and attribution record."
missiles_suspend_site_effect_tt: "The damaged site is removed from active launch planning and recovery begins."
missiles_rotate_codes_effect_tt: "Emergency codes are rotated before the compromised authority can act."
missiles_isolate_site_effect_tt: "The selected site is isolated from the command network."
missiles_loyal_forces_effect_tt: "A site-recovery operation begins with supplied loyal forces."
missiles_negotiate_command_effect_tt: "Negotiations buy time with the compromised command."
missiles_scuttle_site_effect_tt: "The selected rogue site and its local reserve are destroyed."
missiles_allow_rogue_launch_effect_tt: "The rogue command launches the missiles held at its site."
missiles_verify_warning_effect_tt: "Warning verification begins against the active incident root."
missiles_delay_retaliation_effect_tt: "The retaliation countdown is extended once and readiness is reduced."
missiles_sever_network_effect_tt: "Automatic retaliation is disabled and a restoration mission becomes available."
missiles_isolate_retaliation_site_effect_tt: "The selected site is removed from the retaliation response."
missiles_accept_retaliation_effect_tt: "Missile command accepts the current retaliation order and begins launch preparation."
missiles_restore_network_effect_tt: "A restoration mission begins for the severed retaliation network."

