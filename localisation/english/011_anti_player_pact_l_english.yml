chaosx_super_event.28.t: "Anti-[secret_alliance_target.GetName] Pact"
chaosx_super_event.28.q: "\"The real cause I consider to be the one which was formally most kept out of sight. The growth of the power of Athens, and the alarm which this inspired in Lacedaemon, made war inevitable.\"\n- Thucydides, The History of the Peloponnesian War"
chaosx_super_event.28.a: "The agreement has left the private room."
chaosx_super_event.28.d: "The hidden compact has stepped into public view. Embassies sharing the same private line sit at one table with one seal and one promise to contain [secret_alliance_target.GetNameDef]. Every government in the room must decide how much daylight its signature can bear."

chaosx.events_log.window.event_details.secret_alliance: "Secret Alliance begins with foreign coldness around one target country. Couriers change routes, embassy language starts to match, and minor governments learn how private distance can become shared pressure.\n\nAs the pattern grows, the room gains more chairs, a larger sponsor, and a public pact that names the target country. War with a hidden member can tear the deniable phase open and turn the compact into a named coalition."
chaosx.events_log.evolution.type.secret_alliance: "Secret Alliance"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_1: "Minor Expansion"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_2: "Major Patron"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_3: "Public Pact"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_4: "First Shots Open the File"
chaosx.events_log.window.evolution_details.secret_alliance.body.event_detail: "Secret Alliance evolutions follow a private diplomatic pattern as it grows into a public compact. Each stage leaves more traces on the table."
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_1: "Minor Expansion carries the same cold language beyond the first capitals. More governments echo the line, and courier routes leave clearer traces behind them."
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_2: "Major Patron brings a larger sponsor into the file. Industrial contacts, staff rumors, and protected channels point toward the hand behind the room."
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_3: "The public pact turns private coordination into a coalition that names the target country. Signatures move into public view, and every member must decide how much daylight it can bear."
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_4: "When fighting starts, the private room loses control of the hour. The signatures surface in the shock of war, and the compact becomes a public war table."
