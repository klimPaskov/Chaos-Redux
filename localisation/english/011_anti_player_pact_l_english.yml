l_english:
chaosx.nr11.1.t: "Secret Alliance"
chaosx.nr11.2.t: "The Empty Chairs"
chaosx.nr11.2.d: "Embassy staff are reporting the same small absences in too many capitals. Invitations go unanswered, commercial attaches cancel routine meetings, and military observers who once lingered after receptions now leave in pairs. No government has accused us of anything. No government has admitted a common line. The pattern is too neat to be weather."
chaosx.nr11.2.a: "Open a quiet file."
chaosx.nr11.10.t: "The Compact Moves"
chaosx.nr11.20.t: "The Compact Widens"
chaosx.nr11.21.t: "A Courier Changes Trains"
chaosx.nr11.21.d: "A railway clerk noticed the same sealed pouch moving through three countries under three embassy seals. The route does not reach us directly, but every stop touches a capital that has recently cooled toward our diplomats. The pouch vanished before police arrived. Its schedule did not."
chaosx.nr11.21.a: "Trace the route."
chaosx.nr11.30.t: "A Patron Behind the Room"
chaosx.nr11.31.t: "The Hand With Longer Reach"
chaosx.nr11.31.d: "Industrial surveys, staff rumors, and embassy cables now point toward a larger sponsor behind the compact. Minor governments still take the visible risks, but a major power appears to be supplying coordination, protection, and money. The file is no longer a diplomatic nuisance. It is a counter-conspiracy problem."
chaosx.nr11.31.a: "Bring the board into the light."
chaosx.nr11.40.t: "The Pact Breaks Cover"
chaosx.nr11.41.t: "Anti-[Root.GetName] Pact"
chaosx.nr11.41.d: "The delegations signed in public after weeks of denials. Their communique names us as the source of instability, arms pressure, and regional fear. The hidden compact has become the Anti-[Root.GetName] Pact, and every exposed member is choosing whether to stand behind the signature."
chaosx.nr11.41.a: "Then every signature matters."
chaosx.nr11.42.t: "War Opens the File"
chaosx.nr11.42.d: "A hidden member has entered war against us, and the room could no longer remain closed. Within hours, the remaining members issued declarations of solidarity and hurried their private commitments into a public pact. The first shots have turned suspicion into a named coalition."
chaosx.nr11.42.a: "Count the chairs."
chaosx.nr11.50.t: "The Factory Gate Opens Wrong"
chaosx.nr11.50.d: "A guarded industrial site reported damaged lines, missing inspection cards, and a foreign visitor list that no office will confirm. The damage can be repaired, but the route into the plant points back to the same diplomatic shadows already marked on the board."
chaosx.nr11.50.a: "Add it to the file."
chaosx.nr11.51.t: "A Staff Car Vanishes"
chaosx.nr11.51.d: "Security officers intercepted a confused trail around one of our senior offices. A car was borrowed under a false authorisation, a staff aide was delayed, and an unfamiliar courier escaped through a service entrance. The attempt failed to settle into a clean story, which may be the point."
chaosx.nr11.51.a: "Lock down the ministries."
chaosx.nr11.52.t: "A Border Post Sends Two Reports"
chaosx.nr11.52.d: "Patrol officers near the frontier filed two accounts of the same incident. One says a courier crossed under diplomatic cover. The other says our own guards were lured into a confrontation near a marker post. Both reports name a neighbor already sitting too close to the file."
chaosx.nr11.52.a: "Mark the crossing."
chaosx.nr11.53.t: "A Refusal Leaves Paper"
chaosx.nr11.53.d: "One government declined a private approach and did not keep the whole conversation private. The note is careful, unsigned, and incomplete, but it gives our analysts a route, a date, and the kind of language only a coordinated invitation would use."
chaosx.nr11.53.a: "A refusal can still testify."
chaosx.nr11.54.t: "A Message Arrives Before Dawn"
chaosx.nr11.54.d: "A foreign official requested an hour with our embassy before the morning cables went out. The message was guarded and self-protective, but it named a private room, a sealed courier route, and a list of governments being asked to choose a side."
chaosx.nr11.54.a: "Open the board."
chaosx.news.11.t: "Anti-[secret_alliance_target.GetName] Pact Announced"
chaosx.news.11.d: "Foreign delegations have announced the Anti-[secret_alliance_target.GetName] Pact after a period of private coordination and mounting diplomatic tension. The signatories claim the arrangement is defensive, while officials in [secret_alliance_target.GetNameDef] describe it as a planned encirclement campaign. Neutral observers expect more governments to choose sides as the pact begins testing its public commitments."
chaosx.news.11.a: "The room has opened."

