l_english:
chaosx.nr11.1.t: "Secret Alliance"
chaosx.nr11.2.t: "The Empty Chairs"
chaosx.nr11.2.d: "Embassy staff report the same small absences in too many capitals. Invitations go unanswered, commercial attaches cancel routine meetings, and military observers who once lingered after receptions now leave in pairs. Their language narrows around the same private line, each phrase colder than the last."
chaosx.nr11.2.a: "Open a quiet file."
chaosx.nr11.10.t: "The Compact Moves"
chaosx.nr11.20.t: "The Compact Widens"
chaosx.nr11.21.t: "A Courier Changes Trains"
chaosx.nr11.21.d: "A railway clerk noticed the same sealed pouch moving through three countries under three embassy seals. Its route skirts our offices and touches capitals that recently cooled toward our diplomats. Police arrived to an empty platform, with only a schedule still pointing from capital to capital."
chaosx.nr11.21.a: "Trace the route."
chaosx.nr11.30.t: "A Patron Behind the Room"
chaosx.nr11.31.t: "The Hand With Longer Reach"
chaosx.nr11.31.d: "Industrial surveys, staff rumors, and embassy cables now point toward a larger sponsor behind the compact. Minor governments still take the visible risks as a major power appears to supply coordination, protection, and money. The file has grown from diplomatic nuisance into a counter-conspiracy problem."
chaosx.nr11.31.a: "Bring the board into the light."
chaosx.nr11.40.t: "The Pact Breaks Cover"
chaosx.nr11.41.t: "Anti-[Root.GetName] Pact"
chaosx.nr11.41.d: "The delegations signed in public after weeks of matched silence. Their communique names us as the source of instability, arms pressure, and regional fear. The hidden compact has become the Anti-[Root.GetName] Pact, and every exposed member now chooses how much weight to put behind the signature."
chaosx.nr11.41.a: "Then every signature matters."
chaosx.nr11.42.t: "War Opens the File"
chaosx.nr11.42.d: "A hidden member has entered war against us, forcing the private room into the open. Within hours, every valid member still willing to answer issued declarations of solidarity and hurried its private commitments into a public pact. The first shots have turned suspicion into a named coalition."
chaosx.nr11.42.a: "Count the chairs."
chaosx.nr11.50.t: "The Factory Gate Opens Wrong"
chaosx.nr11.50.d: "A guarded industrial site reported damaged lines, missing inspection cards, and a foreign visitor list that no office will confirm. Repair crews can restore the machinery, and the route into the plant points back to the same diplomatic shadows already marked on the board."
chaosx.nr11.50.a: "Add it to the file."
chaosx.nr11.51.t: "A Staff Car Vanishes"
chaosx.nr11.51.d: "Security officers intercepted a confused trail around one of our senior offices. A car was borrowed under a false authorisation, a staff aide was delayed, and an unfamiliar courier escaped through a service entrance. The attempt left too many mismatched details to dismiss as ordinary confusion."
chaosx.nr11.51.a: "Lock down the ministries."
chaosx.nr11.52.t: "A Border Post Sends Two Reports"
chaosx.nr11.52.d: "Patrol officers near the frontier filed two accounts of the same incident. One account places a courier under diplomatic cover, and the other puts our guards inside a staged confrontation near a marker post. Each report names a neighbor already sitting too close to the file."
chaosx.nr11.52.a: "Mark the crossing."
chaosx.nr11.53.t: "A Refusal Leaves Paper"
chaosx.nr11.53.d: "One government declined a private approach and let part of the conversation escape. The careful, unsigned note gives our analysts a route, a date, and the kind of language only a coordinated invitation would use."
chaosx.nr11.53.a: "A refusal can still testify."
chaosx.nr11.54.t: "A Message Arrives at Dawn"
chaosx.nr11.54.d: "A foreign official requested an hour with our embassy as the morning cables gathered on the desk. The guarded, self-protective message named a private room, a sealed courier route, and a list of governments being asked to choose a side."
chaosx.nr11.54.a: "Open the board."
chaosx.news.11.t: "Anti-[secret_alliance_target.GetName] Pact Announced"
chaosx.news.11.d: "Foreign delegations have announced the Anti-[secret_alliance_target.GetName] Pact after a period of private coordination and mounting diplomatic tension. The pact's communique calls the arrangement defensive and names [secret_alliance_target.GetNameDef] as the source of regional fear. Ministries in [secret_alliance_target.GetNameDef] read the text as a planned encirclement campaign, and neutral observers expect more governments to choose sides as the public commitments are tested."
chaosx.news.11.a: "The room has opened."

