chaosx_super_event.28.t: "Anti-[secret_alliance_target.GetName] Pact"
chaosx_super_event.28.q: "\"The real cause I consider to be the one which was formally most kept out of sight. The growth of the power of Athens, and the alarm which this inspired in Lacedaemon, made war inevitable.\"\n- Thucydides, The History of the Peloponnesian War"
chaosx_super_event.28.a: "The understanding is now public."
chaosx_super_event.28.d: "The hidden compact has stepped into public view. Embassies that denied a common line now share a table, a seal, and a promise to contain [secret_alliance_target.GetNameDef]. Every government in the room must decide whether its private signature can survive open daylight."

chaosx.events_log.window.event_details.secret_alliance: "Secret Alliance begins as a pattern of foreign coldness around one target country. Couriers change routes, embassy language starts to match, and minor governments discover that private distance can become shared pressure.\n\nIf the pattern survives long enough, the room gains more chairs, a larger sponsor, and finally a public pact naming the target country. Once the first shots are fired, the deniable phase can collapse into a named coalition."
chaosx.events_log.evolution.type.secret_alliance: "Secret Alliance"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_1: "Minor Expansion"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_2: "Major Patron"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_3: "Public Pact"
chaosx.events_log.window.evolution_details.secret_alliance.title.stage_4: "First Shots Open the File"
chaosx.events_log.window.evolution_details.secret_alliance.body.event_detail: "Secret Alliance evolutions follow a private diplomatic pattern as it becomes a public compact. Each stage makes the room easier to see and harder to ignore."
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_1: "Minor Expansion means the same cold language is no longer coming from only the first capitals. More governments begin to echo the line, and courier routes leave clearer traces behind them."
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_2: "Major Patron means the minor signatures no longer look self-funded. Industrial contacts, staff rumors, and protected channels point toward a larger hand behind the room."
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_3: "The public pact turns private coordination into a coalition that names the target country. Denials end, signatures appear, and every member must decide how much daylight it can bear."
chaosx.events_log.window.evolution_details.secret_alliance.body.stage_4: "When fighting starts, the private room loses its denials. The signatures become public faster than the compact can choose its own hour."
