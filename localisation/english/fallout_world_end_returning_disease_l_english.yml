l_english:
  chaosx.fallout.712.t: "The Returning Disease"
  chaosx.fallout.712.d: "A fever has returned to Ash Ward Hospital after the last quarantine charter closed. North Gate clinic reports the same cough, yet its ward register carries no names from the first outbreak. The public health office must decide whether to close the district, send teams to the sickest blocks, ask a foreign convoy for medicine, or keep the outbreak out of the ledger."
  chaosx.fallout.712.a: "Seal the infected district"
  chaosx.fallout.712.a.tt: "Spend Food, Medicine, and Recognition to close North Gate and move every patient through one ward register. A strong settlement lowers disease and exposure, but the sealed roads weaken supply and trust."
  chaosx.fallout.712.b: "Send targeted care teams"
  chaosx.fallout.712.b.tt: "Spend Medicine, Fuel, and Recognition to send mobile teams to the hospital blocks with the highest fever pressure. The teams can protect treatment capacity, but their routes consume fuel and draw inspectors away from the border."
  chaosx.fallout.712.c: "Request the aid convoy"
  chaosx.fallout.712.c.tt: "Spend Food, Scrap, and Recognition to open the eastern checkpoint to an aid convoy. The convoy can restore medicine and trust, while a weak agreement leaves the Quarantine State dependent on outside schedules."
  chaosx.fallout.712.d: "Keep the outbreak off the books"
  chaosx.fallout.712.d.tt: "Spend Medicine, Fuel, and Power to hide the fever from the public register while the ward clerks work at night. This can buy time for shelter and adaptation, but a discovered ledger damages public health and credibility."
  chaosx.fallout.714.t: "The Ward Registers Answer"
  chaosx.fallout.714.lock.success.d: "The sealed district held. Ash Ward Hospital received every fever patient through the same red door, and the Quarantine State reduced exposure before the road patrols ran out of food. North Gate now has one register and one accountable clinic chief."
  chaosx.fallout.714.lock.partial.d: "The district closure held around North Gate but failed at the river road. The hospital reduced the first wave of fever, while outer ward clerks kept their own lists and made the border rule harder to enforce."
  chaosx.fallout.714.lock.failure.d: "The seal broke before the last patients were counted. Road guards left their posts for food, the hospital register lost two pages, and fever crossed the checkpoint without a name or a treatment order."
  chaosx.fallout.714.targeted.success.d: "The mobile teams reached the three blocks named in the fever map. Ash Ward Hospital kept its beds open, the North Gate clinic shared its medicine stores, and the Quarantine State lowered disease without closing the eastern road."
  chaosx.fallout.714.targeted.partial.d: "The care teams treated the central wards but could not reach the frozen river houses. Treatment capacity improved where the teams worked, while disease and exposure remained high beyond the lamps."
  chaosx.fallout.714.targeted.failure.d: "The care teams ran out of fuel at the old rail cut. Their medicine crates were counted twice, the fever map became a list of missing streets, and both clinics blamed the public health office for the empty beds."
  chaosx.fallout.714.aid.success.d: "The eastern convoy arrived under a witnessed checkpoint order. Its medicine reached Ash Ward Hospital, its food stores reopened the clinic kitchens, and the Quarantine State signed a compact that gave the convoy a date to leave."
  chaosx.fallout.714.aid.partial.d: "The convoy reached North Gate with medicine but lost the food wagons on the ash road. The clinics can treat more patients, though the aid compact now gives the convoy leverage over the next border inspection."
  chaosx.fallout.714.aid.failure.d: "The aid convoy turned back when the checkpoint could not name its receiving officer. Ash Ward Hospital received no new medicine, the clinic kitchens closed early, and the public health office must explain why an open road brought no relief."
  chaosx.fallout.714.conceal.success.d: "The night clerks kept the fever out of the public register long enough to isolate the first ward. The hidden treatment schedule protected the clinic beds, yet the Quarantine State now carries a cause memory that depends on silence."
  chaosx.fallout.714.conceal.partial.d: "The concealed register protected the central wards but was discovered in the river district. Fever pressure eased where the night clerks worked, while the exposed pages made every later inspection more hostile."
  chaosx.fallout.714.conceal.failure.d: "The missing names were found in a clerk's stove after the fever reached the market shelter. The public health office lost its credibility, the clinics stopped sharing their ledgers, and the disease now travels faster than the quarantine order."
  chaosx.fallout.714.a: "Record the ward decision"
  chaosx.fallout.714.a.tt: "Record the result in the Quarantine State's cause memory and begin a delayed review of treatment capacity, border trust, aid dependence, and concealment pressure."
  chaosx.fallout.716.t: "The Second Winter Review"
  chaosx.fallout.716.success.d: "Two hundred and ten days later, the returning fever has a stable treatment route. Ash Ward Hospital and North Gate clinic share a border ledger, the aid convoy follows its compact, and the Quarantine State can respond without reopening the old medical dispute."
  chaosx.fallout.716.partial.d: "The second winter review found a workable route in the central wards and a brittle one along the river. Treatment capacity survived, but private clinic lists and outside aid still decide which border orders are obeyed."
  chaosx.fallout.716.failure.d: "The second winter review found the fever route broken. Patients wait outside Ash Ward Hospital, the border ledger no longer matches the clinic books, and deaths are recorded before the public health office can assign a cause."
  chaosx.fallout.716.a: "Close the winter review"
  chaosx.fallout.716.a.tt: "Release the delayed cleanup receipt and preserve the Quarantine State's memory of the returning disease."
  fallout.event_log.returning_disease.name: "The Returning Disease"
  fallout.event_log.returning_disease.detail: "[GetFalloutEvent712EventLogDetail]"
  fallout.event_log.returning_disease.detail.choice_lock_down: "The Quarantine State sealed North Gate and placed the returning fever under one ward register."
  fallout.event_log.returning_disease.detail.choice_targeted_response: "The Quarantine State sent mobile care teams to the blocks named in the fever map."
  fallout.event_log.returning_disease.detail.choice_request_aid: "The Quarantine State opened its eastern checkpoint to an aid convoy."
  fallout.event_log.returning_disease.detail.choice_conceal_outbreak: "The Quarantine State hid the returning fever from its public register."
  fallout.event_log.returning_disease.detail.lock_down_success: "The district seal held, and the hospital reduced disease before the road patrols ran out of food."
  fallout.event_log.returning_disease.detail.lock_down_partial: "The district seal held at North Gate but failed along the river road."
  fallout.event_log.returning_disease.detail.lock_down_failure: "The seal broke before the hospital could count every patient."
  fallout.event_log.returning_disease.detail.targeted_response_success: "Mobile care teams kept Ash Ward Hospital open and lowered disease without closing the eastern road."
  fallout.event_log.returning_disease.detail.targeted_response_partial: "Mobile care teams treated the central wards while the frozen river houses remained exposed."
  fallout.event_log.returning_disease.detail.targeted_response_failure: "The care teams ran out of fuel at the old rail cut and returned with empty treatment routes."
  fallout.event_log.returning_disease.detail.request_aid_success: "The aid convoy arrived under a witnessed order and signed a compact with the Quarantine State."
  fallout.event_log.returning_disease.detail.request_aid_partial: "The aid convoy delivered medicine but lost its food wagons on the ash road."
  fallout.event_log.returning_disease.detail.request_aid_failure: "The checkpoint could not name a receiving officer, and the aid convoy turned back."
  fallout.event_log.returning_disease.detail.conceal_outbreak_success: "Night clerks kept the fever out of the register long enough to isolate the first ward."
  fallout.event_log.returning_disease.detail.conceal_outbreak_partial: "The hidden register protected the central wards but was discovered in the river district."
  fallout.event_log.returning_disease.detail.conceal_outbreak_failure: "The missing names were found after fever reached the market shelter."
  fallout.event_log.returning_disease.detail.callback_success: "The second winter review found one stable treatment route and a shared border ledger."
  fallout.event_log.returning_disease.detail.callback_partial: "The central wards kept a workable route while river clinics and outside aid remained brittle."
  fallout.event_log.returning_disease.detail.callback_failure: "The second winter review found the fever route broken and deaths ahead of the cause register."
  fallout.event_log.returning_disease.detail.cancelled: "The returning disease chain was cancelled before its delayed review and its reserved memory was released."
  fallout_returning_disease_result_success: "Returning disease contained"
  fallout_returning_disease_result_partial: "Returning disease contested"
  fallout_returning_disease_result_failed: "Returning disease uncontrolled"
  fallout_returning_disease_callback_settled: "Winter treatment route stable"
  fallout_returning_disease_callback_partial: "Winter treatment route divided"
