camp_admin_option_priority_industry: "Industrial Production"
camp_admin_option_priority_industry_tt: "Allocate supported labor to industrial contracts. Benefits depend on participating military industry.\nAdministrative order: [?camp_admin_policy_quote_pp|.1] £pol_power.\nThe current policy, authority and available political power must permit this order."
camp_admin_option_priority_works: "Construction and Logistics"
camp_admin_option_priority_works_tt: "Allocate labor to supported infrastructure projects. Completed infrastructure remains usable.\nAdministrative order: [?camp_admin_policy_quote_pp|.1] £pol_power.\nThe current policy, authority and available political power must permit this order."
camp_admin_option_priority_extraction: "Resource Extraction"
camp_admin_option_priority_extraction_tt: "Allocate labor to existing mines and resource production. Empty resource sites receive no benefit.\nAdministrative order: [?camp_admin_policy_quote_pp|.1] £pol_power.\nThe current policy, authority and available political power must permit this order."
camp_admin_option_budget_maintenance: "Maintenance Only"
camp_admin_option_budget_maintenance_tt: "Fund existing obligations and defer additional development.\nAdministrative order: [?camp_admin_policy_quote_pp|.1] £pol_power.\nThe current policy, authority and available political power must permit this order."
camp_admin_option_budget_development: "Controlled Development"
camp_admin_option_budget_development_tt: "Maintain existing obligations and fund a limited development allowance.\nAdministrative order: [?camp_admin_policy_quote_pp|.1] £pol_power.\nThe current policy, authority and available political power must permit this order."
camp_admin_option_budget_priority: "Priority Development"
camp_admin_option_budget_priority_tt: "Maintain existing obligations and make a larger development allowance available while protecting military reserves.\nAdministrative order: [?camp_admin_policy_quote_pp|.1] £pol_power.\nThe current policy, authority and available political power must permit this order."
camp_admin_option_mandate_custody: "Custody and Review"
camp_admin_option_mandate_custody_tt: "Restrict the administration to custody and institutional review. Forced productive assignments cease.\nAdministrative order: [?camp_admin_mandate_quote_pp|.1] £pol_power.\nThe current policy, authority and available political power must permit this order."
camp_admin_option_mandate_coercive: "Intensified Coercion"
camp_admin_option_mandate_coercive_tt: "Permit forced-labor assignments under the applicable institution. Conditions, supplies and mortality affect sustained output.\nAdministrative order: [?camp_admin_mandate_quote_pp|.1] £pol_power.\nThe current policy, authority and available political power must permit this order."
camp_admin_option_mandate_radical: "Authorize Radical Policy"
camp_admin_option_mandate_radical_tt: "Authorize the historically eligible radical policy. Killing-center conversion remains a separate deliberate decision, with loss of productive capacity and lasting human consequences.\nAdministrative order: [?camp_admin_mandate_quote_pp|.1] £pol_power.\nThe current policy, authority and available political power must permit this order."
camp_admin_option_role_custody: "Detention or Internment"
camp_admin_option_role_custody_tt: "End productive assignments and retain custody under the current mandate.\nAdministrative order: [?camp_admin_role_quote_pp|.1] £pol_power.\nThe current policy, authority and available political power must permit this order."
camp_admin_option_role_labor: "Forced Labor"
camp_admin_option_role_labor_tt: "Assign surviving detainees to the national economic priority under an authorized coercive mandate.\nAdministrative order: [?camp_admin_role_quote_pp|.1] £pol_power.\nThe current policy, authority and available political power must permit this order."
camp_admin_option_role_penal: "Penal Labor"
camp_admin_option_role_penal_tt: "Use the eligible Soviet penal-labor institution and its national economic assignment.\nAdministrative order: [?camp_admin_role_quote_pp|.1] £pol_power.\nThe current policy, authority and available political power must permit this order."
camp_admin_option_role_killing: "Convert to Killing Center"
camp_admin_option_role_killing_tt: "Change this institution into a killing center under the authorized radical mandate. Productive assignments end; deaths, evidence and responsibility remain recorded.\nAdministrative order: [?camp_admin_role_quote_pp|.1] £pol_power.\nThe current policy, authority and available political power must permit this order."
camp_admin_option_filter_all: "All Locations"
camp_admin_option_filter_all_tt: "Show all registered locations."
camp_admin_option_filter_labor: "Labor Assignments"
camp_admin_option_filter_labor_tt: "Show forced-labor and penal-labor institutions."
camp_admin_option_filter_custody: "Custody Institutions"
camp_admin_option_filter_custody_tt: "Show detention and internment institutions."
camp_admin_option_filter_attention: "Needs Attention"
camp_admin_option_filter_attention_tt: "Show suspended work and locations with inadequate support."
camp_admin_picker_priority_title: "Choose Economic Priority"
camp_admin_picker_priority_help: "Assign the available productive workforce to one national priority. Reallocation follows funded work and cannot duplicate assignments."
camp_admin_picker_budget_title: "Choose Spending Ceiling"
camp_admin_picker_budget_help: "Maintenance is funded before development. Equipment reserves remain protected and ordinary operation does not require repeated purchases."
camp_admin_picker_mandate_title: "Set the Repression Mandate"
camp_admin_picker_mandate_help: "This is a deliberate political commitment. Changes of site purpose and institutional research require their own authorization."
camp_admin_picker_role_title: "Change Institutional Purpose"
camp_admin_picker_role_help: "A site has one primary purpose. Research attachments remain separate, and the same people cannot be counted in two assignments."
camp_admin_picker_filter_title: "Choose Location Filter"
camp_admin_picker_filter_help: "Select the locations relevant to the current review."
