camp_admin_records_losses: "Cumulative deaths under this authority\n\nCustody: [?camp_admin_total_custody_deaths_k|.3] thousand\nForced labor: [?camp_admin_total_labor_deaths_k|.3] thousand\nSite violence: [?camp_admin_total_violence_deaths_k|.3] thousand\nInstitutional programs: [?camp_admin_total_institutional_deaths_k|.3] thousand\nOccupation violence: [?camp_occ_total_deaths_k|.3] thousand"
camp_admin_records_losses_tt: "Occupation violence counts measured campaign deaths separately from camp custody and institutional losses. Territorial losses with no identified cohort do not create a camp death record or transfer responsibility.[GetCampOccEscapeNote][GetCampAdminUnknownOriginNote]"
camp_admin_records_escaped_note: "\n\n[?camp_occ_total_escaped_k|.3] thousand people escaped beyond our control to neutral territory. No death is recorded for them."
camp_admin_records_unknown_origin_note: "\n\n[?camp_admin_gui_uncertain_locations|0] locations have incomplete survivor records. Orders that depend on known survivor numbers are paused there while they operate. When reform closes them, survivors there are released without complete origin records. Their last known origins and original responsibility remain on file."
