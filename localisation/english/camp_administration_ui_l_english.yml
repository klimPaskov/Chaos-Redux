camp_admin_site_work_tt: "Pause or resume productive assignments for living labor or penal custody under a coercive mandate.\nNo immediate payment. Custody and maintenance obligations continue while work is paused."
camp_admin_site_work_locked_tt: "Work cannot be changed because this location is not operating under our authority.\nNo payment or assignment change occurs. Past records remain."
camp_admin_site_work_locked_empty_tt: "No living detainees remain here to assign or pause.\nNo payment or assignment change occurs. Past losses remain recorded."
camp_admin_site_work_locked_purpose_tt: "This site's current purpose does not permit a forced-labor assignment.\nChange its purpose under a valid order before productive work can be toggled. No payment occurs here."
camp_admin_site_work_locked_mandate_tt: "The national mandate does not permit productive detention labor.\nAuthorize a coercive mandate before changing this site's work assignment. No payment occurs here."
camp_admin_site_role: "Change Purpose"
camp_admin_site_role_tt: "Review the institution's primary purpose. A research attachment is separate.\nAdministrative order: [?camp_admin_role_quote_pp|.1] £pol_power. A killing center requires explicit authorization and loses its productive workforce."
camp_admin_site_role_locked_tt: "Purpose cannot be changed because this location is not operating under our authority.\nNo political power is paid. Its recorded history remains."
