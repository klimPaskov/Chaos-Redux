camp_admin_priority_tt: "Choose the work that receives available staff and support. Reallocation follows the next funded administration cycle.\nAdministrative order: [?camp_admin_policy_quote_pp|.1] £pol_power. Existing commitments and military reserves remain protected."
camp_admin_mandate_tt: "Set the institution's permitted policy. Economic orders do not authorize killing-center conversion.\nAdministrative order: [?camp_admin_mandate_quote_pp|.1] £pol_power. Changes remain subject to the current government and institution."
camp_admin_budget_tt: "Maintenance is funded before development. The ceiling controls additional project spending; insufficient stock pauses work.\nAdministrative order: [?camp_admin_policy_quote_pp|.1] £pol_power. Changing the ceiling does not replenish money or equipment already spent."
