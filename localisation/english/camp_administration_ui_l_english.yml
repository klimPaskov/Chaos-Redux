camp_admin_site_dismantle_locked_resources: "Closure Locked"
camp_admin_site_dismantle_tt: "Order this site's physical closure. Any recorded survivors leave custody when work begins. Camp buildings are removed only after the timed mission succeeds. Losses, evidence, and original responsibility remain recorded.\n\nPaid on order: $camp_ui_cost_dismantle_selected_site$\nRequires reform authority, current site control, reconciled custody, and no other closure in progress."
camp_admin_site_dismantle_locked_site_tt: "Select an eligible site before ordering its closure. No payment occurs."
camp_admin_site_dismantle_locked_route_tt: "National reform authority is absent or another national closure is underway.\nCurrent quote: $camp_ui_cost_dismantle_selected_site$\nNo payment occurs."
camp_admin_site_dismantle_locked_progress_tt: "A closure mission is already underway at this site or another selected site.\nCurrent quote: $camp_ui_cost_dismantle_selected_site$\nNo second payment occurs."
camp_admin_site_dismantle_locked_custody_tt: "This site was already closed under another order, its authority has changed, or its living custody records do not reconcile. A physical closure cannot start or resume here.\nCurrent quote: $camp_ui_cost_dismantle_selected_site$\nNo payment occurs."
camp_admin_site_dismantle_locked_resources_tt: "Political Power, manpower, or support equipment is below the current quote.\nCurrent quote: $camp_ui_cost_dismantle_selected_site$\nNo payment occurs."
camp_admin_site_release_tt: "Release the surviving detainees at this location, end its assignments and close further intake.\nNo immediate payment. Government and institutional authority must permit release, and the living custody records must reconcile. Civilian replacement work requires a funded conversion program."
camp_admin_site_release_locked_tt: "Release authority is absent. A non-fascist government, an opened reform route, or exposed evidence can authorize it.\nNo payment or custody change occurs."
camp_admin_site_release_locked_site_tt: "This location is not operating under our authority, so its custody cannot be released here.\nNo payment or population change occurs. Its existing record remains."
camp_admin_site_release_locked_empty_tt: "No living detainees remain at this operating location.\nThere is no payment or population change. Recorded losses remain."
camp_admin_site_release_locked_records_tt: "Living custody records at this location do not reconcile. No survivors can be released until the records are consistent.\nNo payment, population change, or release entry occurs."
