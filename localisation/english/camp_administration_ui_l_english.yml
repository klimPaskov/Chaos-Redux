camp_admin_site_pause: "Pause Work"
camp_admin_site_resume: "Resume Work"
camp_admin_site_work_tt: "Pause or resume productive assignments at this location.\nNo immediate payment. Custody and maintenance obligations continue while work is paused."
camp_admin_site_role: "Change Purpose"
camp_admin_site_role_tt: "Review the institution's primary purpose. A research attachment is separate.\nAdministrative order: [?camp_admin_role_quote_pp|.1] £pol_power. A killing center requires explicit authorization and loses its productive workforce."
camp_admin_site_release: "Release Survivors"
camp_admin_site_release_tt: "Release the surviving detainees at this location and stop its productive assignments.\nNo immediate payment. Government and institutional authority must permit release. Civilian replacement work requires a funded conversion program."
camp_admin_records_heading: "Human Consequences"
camp_admin_records_losses: "Cumulative deaths under this authority\n\nCustody: [?camp_admin_total_custody_deaths_k|.3] thousand\nForced labor: [?camp_admin_total_labor_deaths_k|.3] thousand\nKilling centers: [?camp_admin_total_violence_deaths_k|.3] thousand\nInstitutional programs: [?camp_admin_total_institutional_deaths_k|.3] thousand\nWider persecution: [?camp_occ_total_deaths_k|.3] thousand"
camp_admin_records_losses_tt: "Each cause records accepted population losses once. Wider persecution excludes the people counted in camp custody. Liberation does not transfer responsibility to the liberating country. Deaths from unrelated territorial causes are not attributed to this administration."
camp_admin_records_aftermath: "Surviving records retain responsibility after closure.\n\n[GetCampDiscoveryStatusName]\n[GetCampAdminInstitutionSummary]"
