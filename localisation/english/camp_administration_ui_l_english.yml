camp_admin_option_priority_industry: "Industrial Production"
camp_admin_option_priority_industry_tt: "Allocate supported workers to industrial contracts. Output requires participating military factories and a supplied site.\nOrder cost: [?camp_admin_policy_quote_pp|.1] £pol_power. Requires valid authority, an administration outside reform, and a different current priority."
camp_admin_option_priority_works: "Construction and Logistics"
camp_admin_option_priority_works_tt: "Allocate supported workers to infrastructure projects. Completed infrastructure remains usable.\nOrder cost: [?camp_admin_policy_quote_pp|.1] £pol_power. Requires valid authority, an administration outside reform, and a different current priority."
camp_admin_option_priority_extraction: "Resource Extraction"
camp_admin_option_priority_extraction_tt: "Allocate supported workers to local extraction. A site without resources receives no benefit.\nOrder cost: [?camp_admin_policy_quote_pp|.1] £pol_power. Requires valid authority, an administration outside reform, and a different current priority."
camp_admin_option_budget_maintenance: "Maintenance Only"
camp_admin_option_budget_maintenance_tt: "Fund existing obligations and defer additional development.\nChanging the ceiling costs [?camp_admin_policy_quote_pp|.1] £pol_power. Reaffirming this ceiling resumes paused development at no cost.\nThe current authority and available political power must permit a change."
camp_admin_option_budget_development: "Controlled Development"
camp_admin_option_budget_development_tt: "Maintain existing obligations and fund a limited development allowance.\nChanging the ceiling costs [?camp_admin_policy_quote_pp|.1] £pol_power. Reaffirming this ceiling resumes paused development at no cost.\nThe current authority and available political power must permit a change."
camp_admin_option_budget_priority: "Priority Development"
camp_admin_option_budget_priority_tt: "Maintain existing obligations and make a larger development allowance available while protecting military reserves.\nChanging the ceiling costs [?camp_admin_policy_quote_pp|.1] £pol_power. Reaffirming this ceiling resumes paused development at no cost.\nThe current authority and available political power must permit a change."
camp_admin_option_mandate_custody: "Custody and Review"
camp_admin_option_mandate_custody_tt: "Restrict the administration to custody and institutional review. Forced productive assignments cease.\nOrder cost: [?camp_admin_mandate_quote_pp|.1] £pol_power. Requires valid authority, no active reform, and a different current mandate."
camp_admin_option_mandate_coercive: "Intensified Coercion"
camp_admin_option_mandate_coercive_tt: "Permit forced-labor assignments under the applicable institution. Conditions, supplies and mortality affect sustained output.\nOrder cost: [?camp_admin_mandate_quote_pp|.1] £pol_power. Requires valid authority, no active reform, and a different current mandate."
camp_admin_option_mandate_radical: "Authorize Systematic Killing"
camp_admin_option_mandate_radical_tt: "Permit systematic killing under this administration. Converting an eligible camp into a killing center requires a separate order and ends its productive work.\nOrder cost: [?camp_admin_mandate_quote_pp|.1] £pol_power. Requires the applicable government and date, no active reform, and a different mandate."
camp_admin_option_role_custody: "Detention or Internment"
camp_admin_option_role_custody_tt: "End productive assignments and retain custody.\nOrder cost: [?camp_admin_role_quote_pp|.1] £pol_power. Requires a controlled operating site with a different purpose and no killing-center building."
camp_admin_option_role_labor: "Forced Labor"
camp_admin_option_role_labor_tt: "Assign surviving detainees to the national economic priority. Work depends on local capacity, supplies and opportunity.\nOrder cost: [?camp_admin_role_quote_pp|.1] £pol_power. Requires a controlled operating site, a coercive mandate and no killing-center building."
camp_admin_option_role_penal: "Penal Labor"
camp_admin_option_role_penal_tt: "Use a Soviet penal-labor institution. Productive work requires a coercive mandate, supplies and local opportunity.\nOrder cost: [?camp_admin_role_quote_pp|.1] £pol_power. Requires Soviet communist authority, a controlled operating site and no killing-center building."
camp_admin_option_role_killing: "Convert to Killing Center"
camp_admin_option_role_killing_locked: "Killing Center Unavailable"
camp_admin_option_role_killing_tt: "Convert a concentration-camp level into a killing center under a separately authorized radical mandate. Productive assignments end. The order harms stability and increases resistance, evidence and foreign condemnation. Later deaths remain recorded against the original authority.\nCost: [?camp_admin_role_quote_pp|.1] £pol_power, paid only on a valid conversion."
camp_admin_option_role_killing_mandate_tt: "Enact the radical mandate before converting this site into a killing center. Productive assignments end and evidence and resistance rise.\nConversion cost: [?camp_admin_role_quote_pp|.1] £pol_power."
camp_admin_option_role_killing_site_tt: "Select an operating camp site under this authority. A killing center ends productive assignments and raises resistance and evidence.\nConversion cost: [?camp_admin_role_quote_pp|.1] £pol_power."
camp_admin_option_role_killing_existing_tt: "This site is already designated for killing or contains a killing-center level, so no second conversion is available. Recorded responsibility remains.\nNo conversion cost is charged."
camp_admin_option_role_killing_level_tt: "This site needs an existing concentration-camp level before a killing-center conversion can be ordered. Productive assignments would end.\nConversion cost: [?camp_admin_role_quote_pp|.1] £pol_power."
camp_admin_option_role_killing_funds_tt: "Political power is below the current conversion quote. A funded order ends productive assignments and raises resistance and evidence.\nRequires [?camp_admin_role_quote_pp|.1] £pol_power."
camp_admin_option_role_killing_other_tt: "Current site or authority conditions prevent this conversion. Killing-center work ends productive assignments and raises resistance and evidence.\nConversion cost, if authorized: [?camp_admin_role_quote_pp|.1] £pol_power."
