BAX_independence_wave_corridor_workers_long: "Thracian Corridor Workers' Council"
BAX_independence_wave_community_compact: "Community Autonomy Compact"
BAX_independence_wave_community_compact_long: "Thracian Community Autonomy Compact"
BAX_independence_wave_emergency_commission: "Corridor Defence Commission"
BAX_independence_wave_emergency_commission_long: "Thracian Corridor Defence Commission"
