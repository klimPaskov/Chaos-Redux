BAX_independence_wave_patron_strait_compact_long: "Thrace Straits Patron Compact"

bax_divided_thrace_authority: "Divided Thrace Authority"
bax_divided_thrace_authority_desc: "Municipal delegates, veteran networks, and inherited offices still dispute who may speak for the released state. Supplies and corridor defence suffer while the compact remains unsettled."
bax_thrace_compact: "Thrace Compact"
bax_thrace_compact_desc: "A negotiated civic compact joins the Thrace municipalities to screened corridor formations and gives the new state a durable administrative centre."
bax_municipal_charter: "Municipal Charter"
bax_municipal_charter_desc: "A published charter gives municipalities a share of taxation, recognition, and public-service authority while the central government builds capacity."
bax_corridor_workers_council: "Corridor Workers' Council"
bax_corridor_workers_council_desc: "Workshops, miners, and railway crews coordinate production and transport through a council that answers to the released state."
bax_community_autonomy_compact: "Community Autonomy Compact"
bax_community_autonomy_compact_desc: "Community councils keep local obligations and food routes visible to the central government, improving stability and recruiting power."
bax_corridor_defence_commission: "Corridor Defence Commission"
bax_corridor_defence_commission_desc: "A central commission screens armed formations and concentrates scarce equipment on the Thrace approaches."
bax_patron_strait_compact: "Straits Patron Compact"
bax_patron_strait_compact_desc: "A negotiated patron relationship opens Aegean port access, rail supplies, and recognition while imposing obligations on the new government."

independence_wave_bax_thrace_council_category: "Thrace Civic Council"
independence_wave_bax_thrace_council_category_desc: "The council coordinates municipal rights, veteran networks, corridor defence, and the former-host settlement while the compact remains fragile."
independence_wave_bax_hold_thrace_council_together: "Hold the Thrace Council Together"
independence_wave_bax_hold_thrace_council_together_desc: "The first council must keep municipal delegates, railway officials, and corridor veterans inside one provisional authority."
independence_wave_bax_reopen_thrace_depots: "Reopen the Thrace Depots"
independence_wave_bax_reopen_thrace_depots_desc: "Recover stores along the anchor's roads and place them under a common register. Administrative capacity and a civilian-factory commitment are required."
independence_wave_bax_screen_veteran_networks: "Screen the Veteran Networks"
independence_wave_bax_screen_veteran_networks_desc: "Vetted veterans can strengthen the opening force, but every formation must accept the defence commission before receiving the compact's supplies."
independence_wave_bax_convene_community_council: "Convene the Community Council"
independence_wave_bax_convene_community_council_desc: "Bring the region's communities into one council with explicit rights and a shared rail and tax register."
independence_wave_bax_settle_greek_ledgers: "Settle Relations with [independence_wave_former_host.GetNameDef]"
independence_wave_bax_settle_greek_ledgers_desc: "Negotiate borders, property claims, population obligations, and recognition with [independence_wave_former_host.GetNameDef]. The talks cannot continue if war begins."
independence_wave_bax_ratify_municipal_charter: "Ratify the Municipal Charter"
independence_wave_bax_ratify_municipal_charter_desc: "Give the municipalities a constitutional voice and make the central government responsible to the Thrace compact."
independence_wave_bax_convene_corridor_workers: "Convene the Corridor Workers' Council"
independence_wave_bax_convene_corridor_workers_desc: "Place workshops and railway crews under a council that can meet the army's material demands without dissolving local authority."
independence_wave_bax_restore_community_autonomy: "Restore Community Autonomy"
independence_wave_bax_restore_community_autonomy_desc: "Renew local compacts that protect food routes and keep corridor communities supplied through a traditional settlement."
independence_wave_bax_establish_corridor_commission: "Establish the Corridor Commission"
independence_wave_bax_establish_corridor_commission_desc: "Put the emergency chain of command above factional units and prepare the compact for a hard border war."
independence_wave_bax_accept_strait_patron_compact: "Accept the Thrace Straits Compact"
independence_wave_bax_accept_strait_patron_compact_desc: "Trade a measure of sovereignty for Aegean port access, rail supplies, recognition, and a foreign guarantor's obligations."
independence_wave_bax_codify_thrace_settlement: "Codify the Thrace Settlement"
independence_wave_bax_codify_thrace_settlement_desc: "A stable authority, a recognised border, and an integrated corridor force can turn the liberation into a durable state."
independence_wave_bax_open_aegean_network: "Open the Aegean Network"
independence_wave_bax_open_aegean_network_desc: "Use the league's channels to exchange supplies, officers, and recognition with other states that survived the wave."

independence_wave_bax_project_failure_effect_tt: "The civic and corridor-defence ledgers fall as the provisional authority loses control of the compact."
independence_wave_bax_depots_effect_tt: "Reopened depots improve the Thrace civic mandate and corridor-defence readiness."
independence_wave_bax_networks_effect_tt: "Screened veteran networks strengthen the opening force and improve defence readiness."
independence_wave_bax_community_effect_tt: "The community council raises the civic mandate and gives the compact a public settlement."
independence_wave_bax_host_ledgers_effect_tt: "[independence_wave_former_host.GetNameDefCap] reduces its claims, hostility, obligations, and property demands while accepting firmer borders."
independence_wave_bax_route_effect_tt: "The selected government route becomes the active authority and changes the Thrace ledgers."
independence_wave_bax_sovereignty_effect_tt: "Thrace secures durable sovereignty. Legitimacy, recognition, capacity, and security rise as instability falls."
independence_wave_bax_network_effect_tt: "The Aegean network strengthens league standing, common cause, and member confidence."

BAX_independence_wave_thrace_council: "Hristo Silyanov"
BAX_independence_wave_thrace_council_desc: "Hristo Silyanov was a Bulgarian revolutionary, historian, and memoirist associated with the Internal Macedonian-Adrianople Revolutionary Organization. In Thrace's provisional government, his office coordinates municipal delegates, veteran networks, and border defence."

