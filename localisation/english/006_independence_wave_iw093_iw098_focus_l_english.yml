l_english:
independence_wave_iw093_seat_kumasi_administration: "Seat the Kumasi Administration"
independence_wave_iw093_seat_kumasi_administration_desc: "Place the restored confederacy's records and treasury under a working Kumasi administration."
independence_wave_iw093_seat_kumasi_administration_tt: "Establishes the Kumasi administrative seat and improves confederated authority."
independence_wave_iw093_register_stool_delegations: "Register Stool Delegations"
independence_wave_iw093_register_stool_delegations_desc: "Bring the member stools back into a common register without erasing their customary authority."
independence_wave_iw093_register_stool_delegations_tt: "Opens the member register and strengthens confederated authority."
independence_wave_iw093_forest_guard_compact: "Write the Forest Guard Compact"
independence_wave_iw093_forest_guard_compact_desc: "Set the terms for a disciplined forest guard before the first emergency order is issued."
independence_wave_iw093_forest_guard_compact_tt: "Unlocks the paid Forest Guard training decision."
independence_wave_iw093_audit_cocoa_ledger: "Audit the Cocoa Ledger"
independence_wave_iw093_audit_cocoa_ledger_desc: "Reconcile cocoa receipts, rail manifests, and the obligations attached to Kumasi's depots."
independence_wave_iw093_audit_cocoa_ledger_tt: "Raises cocoa and rail throughput and records a constitutional ledger."
independence_wave_iw093_convene_court_cabinet_conference: "Convene the Court and Cabinet"
independence_wave_iw093_convene_court_cabinet_conference_desc: "Prepare one paid conference docket on which the restored state can choose its governing settlement."
independence_wave_iw093_convene_court_cabinet_conference_tt: "Unlocks the Royal Confederacy, Constitutional Cabinet, and Veterans Emergency decisions."
independence_wave_iw093_choose_royal_confederacy: "Consolidate the Royal Confederacy"
independence_wave_iw093_choose_royal_confederacy_desc: "Give the restored court a durable place inside a confederacy of member stools."
independence_wave_iw093_choose_royal_confederacy_tt: "Consolidates the Royal Confederacy decision route."
independence_wave_iw093_choose_constitutional_cabinet: "Consolidate the Constitutional Cabinet"
independence_wave_iw093_choose_constitutional_cabinet_desc: "Bind the cabinet to a written settlement while retaining the authority of the Golden Stool."
independence_wave_iw093_choose_constitutional_cabinet_tt: "Consolidates the Constitutional Cabinet decision route."
independence_wave_iw093_choose_veterans_emergency: "Consolidate Veterans' Emergency Rule"
independence_wave_iw093_choose_veterans_emergency_desc: "Give experienced field commanders a temporary mandate while the host threat remains severe."
independence_wave_iw093_choose_veterans_emergency_tt: "Consolidates the Veterans Emergency decision route."
independence_wave_iw093_secure_cocoa_depots: "Reopen the Cocoa Depots"
independence_wave_iw093_secure_cocoa_depots_desc: "Prepare the depot books and security receipt before civilian capacity is committed to rebuilding."
independence_wave_iw093_secure_cocoa_depots_tt: "Unlocks the paid Cocoa Depot rebuilding decision."
independence_wave_iw093_close_cocoa_depots: "Close the Cocoa Depot Ledger"
independence_wave_iw093_close_cocoa_depots_desc: "Accept the completed depot work into the national ledger."
independence_wave_iw093_close_cocoa_depots_tt: "Requires the completed Cocoa Depot decision receipt and records the focus milestone."
independence_wave_iw093_fund_kumasi_rail_repair: "Relay the Kumasi Railway"
independence_wave_iw093_fund_kumasi_rail_repair_desc: "Move the audited depot settlement onto the railway ledger that connects Kumasi to its cocoa hinterland."
independence_wave_iw093_fund_kumasi_rail_repair_tt: "Unlocks the paid Kumasi Railway relay decision."
independence_wave_iw093_close_kumasi_rail_repair: "Close the Kumasi Railway Ledger"
independence_wave_iw093_close_kumasi_rail_repair_desc: "Only a completed railway receipt can close this chapter of the cocoa account."
independence_wave_iw093_close_kumasi_rail_repair_tt: "Requires the completed Kumasi Railway decision receipt."
independence_wave_iw093_screen_colonial_veterans: "Screen Colonial Veterans"
independence_wave_iw093_screen_colonial_veterans_desc: "Screen experienced soldiers for command and supply roles in the restored confederacy's existing forces."
independence_wave_iw093_screen_colonial_veterans_tt: "Requires the durable Forest Guard upgrade receipt and improves existing-force organization."
independence_wave_iw093_organize_forest_supply_patrols: "Organize Forest Supply Patrols"
independence_wave_iw093_organize_forest_supply_patrols_desc: "Keep the forest roads, cocoa sidings, and garrison stores moving without raising a second free army."
independence_wave_iw093_organize_forest_supply_patrols_tt: "Improves existing-force supply coordination, command power, and army experience."
independence_wave_iw093_open_railway_stock_negotiations: "Open Railway Stock Negotiations"
independence_wave_iw093_open_railway_stock_negotiations_desc: "Put railway stock and former-host property on the same negotiating table."
independence_wave_iw093_open_railway_stock_negotiations_tt: "Unlocks the paid former-host settlement decision."
independence_wave_iw093_settle_debt_customs_and_property: "Settle Debt, Customs, and Property"
independence_wave_iw093_settle_debt_customs_and_property_desc: "Give the settlement receipt a clear account of debt, customs, and property claims."
independence_wave_iw093_settle_debt_customs_and_property_tt: "Requires the completed host-settlement decision receipt and consolidates its ledger."
independence_wave_iw093_ratify_border_policing: "Ratify Border Policing"
independence_wave_iw093_ratify_border_policing_desc: "Turn the negotiated border rules into an enforceable obligation between the new state and its former host."
independence_wave_iw093_ratify_border_policing_tt: "Completes the Asante host-settlement lane."
independence_wave_iw093_proclaim_sovereign_asante_confederacy: "Proclaim the Sovereign Asante Confederacy"
independence_wave_iw093_proclaim_sovereign_asante_confederacy_desc: "The member stools and the Kumasi court now proclaim a sovereign confederacy."
independence_wave_iw093_proclaim_sovereign_asante_confederacy_tt: "Requires the Royal Confederacy route, host settlement receipt, and forest supply work; locks the founding route."
independence_wave_iw093_ratify_constitutional_asante_cabinet: "Ratify the Asante Constitutional Cabinet"
independence_wave_iw093_ratify_constitutional_asante_cabinet_desc: "Ratify a cabinet that can speak for the confederacy while preserving its customary foundations."
independence_wave_iw093_ratify_constitutional_asante_cabinet_tt: "Requires the Constitutional Cabinet route and host settlement receipt."
independence_wave_iw093_authorize_veterans_guardianship: "Authorize Veterans' Guardianship"
independence_wave_iw093_authorize_veterans_guardianship_desc: "Place the emergency guard under a bounded guardianship mandate rather than a permanent free command."
independence_wave_iw093_authorize_veterans_guardianship_tt: "Requires the Veterans Emergency route and records its terminal guardianship settlement."
independence_wave_iw093_prepare_form24_west_african_federation: "Prepare the FORM-24 Congress Docket"
independence_wave_iw093_prepare_form24_west_african_federation_desc: "Prepare the West African federation docket for a later congress decision once the consent ledger is complete."
independence_wave_iw093_prepare_form24_west_african_federation_tt: "Unlocks the paid FORM-24 congress decision; the decision writes preparation completion."

independence_wave_iw098_reconvene_emirate_council: "Reconvene the Emirate Council"
independence_wave_iw098_reconvene_emirate_council_desc: "Bring the emirates back to a council that can administer the restored Sokoto state."
independence_wave_iw098_reconvene_emirate_council_tt: "Establishes the council and improves the emirate compact."
independence_wave_iw098_register_native_administration: "Register Native Administration"
independence_wave_iw098_register_native_administration_desc: "Record the native administrations that must carry law, taxation, and local responsibility."
independence_wave_iw098_register_native_administration_tt: "Opens the native-administration register and strengthens the compact."
independence_wave_iw098_secure_caravan_approaches: "Secure the Caravan Approaches"
independence_wave_iw098_secure_caravan_approaches_desc: "Protect the approaches to the capital where caravan roads, frontier patrols, and local authority meet."
independence_wave_iw098_secure_caravan_approaches_tt: "Improves caravan network and frontier security and strengthens the capital approach."
independence_wave_iw098_map_caravan_wells: "Map the Caravan Wells"
independence_wave_iw098_map_caravan_wells_desc: "Map the wells that turn a seasonal caravan road into a dependable network."
independence_wave_iw098_map_caravan_wells_tt: "Unlocks the paid caravan-wells decision."
independence_wave_iw098_convene_emirate_compact: "Convene the Emirate Compact"
independence_wave_iw098_convene_emirate_compact_desc: "Prepare one paid compact conference for the sultanic, constitutional, and frontier settlements."
independence_wave_iw098_convene_emirate_compact_tt: "Unlocks the Sultanic Federal, Northern Constitution, and Frontier Command decisions."
independence_wave_iw098_choose_sultanic_federal_route: "Consolidate the Sultanic Federation"
independence_wave_iw098_choose_sultanic_federal_route_desc: "Give the emirates a federal compact under the sultan's religious and civic mandate."
independence_wave_iw098_choose_sultanic_federal_route_tt: "Consolidates the Sultanic Federal decision route."
independence_wave_iw098_choose_northern_constitution: "Consolidate the Northern Constitution"
independence_wave_iw098_choose_northern_constitution_desc: "Bind northern administrations to a written constitution and a civic balance."
independence_wave_iw098_choose_northern_constitution_tt: "Consolidates the Northern Constitution decision route."
independence_wave_iw098_choose_frontier_command: "Consolidate Frontier Command"
independence_wave_iw098_choose_frontier_command_desc: "Give the frontier a bounded command mandate while a severe host threat presses the emirates."
independence_wave_iw098_choose_frontier_command_tt: "Consolidates the Frontier Command decision route."
independence_wave_iw098_fund_caravan_route_guards: "Fund Caravan Route Guards"
independence_wave_iw098_fund_caravan_route_guards_desc: "Set the completed wells receipt into a guard account that can be audited before the next market opens."
independence_wave_iw098_fund_caravan_route_guards_tt: "Records the completed caravan-wells decision receipt for the route lane."
independence_wave_iw098_close_caravan_route_guards: "Close the Route-Guard Ledger"
independence_wave_iw098_close_caravan_route_guards_desc: "Close the route-guard ledger only after the paid wells project has reported."
independence_wave_iw098_close_caravan_route_guards_tt: "Requires the completed caravan-wells decision receipt."
independence_wave_iw098_fund_livestock_markets: "Open the Livestock Market Ledger"
independence_wave_iw098_fund_livestock_markets_desc: "Prepare the livestock market account so the next paid project can reach both emirates and caravans."
independence_wave_iw098_fund_livestock_markets_tt: "Unlocks the paid livestock-market decision."
independence_wave_iw098_close_livestock_markets: "Close the Livestock Market Ledger"
independence_wave_iw098_close_livestock_markets_desc: "Accept the completed market project into the emirate's civic and commercial accounts."
independence_wave_iw098_close_livestock_markets_tt: "Requires the completed livestock-market decision receipt."
independence_wave_iw098_reorganize_cavalry_staff: "Reorganize the Cavalry Staff"
independence_wave_iw098_reorganize_cavalry_staff_desc: "Prepare a staff receipt for cavalry and frontier infantry without creating a free formation."
independence_wave_iw098_reorganize_cavalry_staff_tt: "Unlocks the paid cavalry reorganization decision."
independence_wave_iw098_integrate_frontier_infantry: "Integrate Frontier Infantry"
independence_wave_iw098_integrate_frontier_infantry_desc: "Bring the durable cavalry receipt and frontier infantry command into one field system."
independence_wave_iw098_integrate_frontier_infantry_tt: "Requires the completed cavalry reorganization receipt and improves existing forces."
independence_wave_iw098_establish_emirate_civic_defence_staff: "Establish Civic Defence Staff"
independence_wave_iw098_establish_emirate_civic_defence_staff_desc: "Give local officials and frontier commanders a shared civic-defence staff."
independence_wave_iw098_establish_emirate_civic_defence_staff_tt: "Improves frontier security and records the existing-force defence receipt."
independence_wave_iw098_audit_native_administration_accounts: "Audit Native Administration Accounts"
independence_wave_iw098_audit_native_administration_accounts_desc: "Reconcile tax, customs, and local security accounts before the former-host settlement."
independence_wave_iw098_audit_native_administration_accounts_tt: "Unlocks the paid native-administration settlement decision."
independence_wave_iw098_open_railway_customs_protocol: "Open the Railway Customs Protocol"
independence_wave_iw098_open_railway_customs_protocol_desc: "Put railway customs and the host settlement receipt under a single protocol."
independence_wave_iw098_open_railway_customs_protocol_tt: "Requires the host settlement receipt and records the railway-customs protocol."
independence_wave_iw098_settle_frontier_security_account: "Settle the Frontier Security Account"
independence_wave_iw098_settle_frontier_security_account_desc: "Make the frontier security obligation legible to both Sokoto and its former host."
independence_wave_iw098_settle_frontier_security_account_tt: "Requires the host settlement receipt and completes the host lane."
independence_wave_iw098_proclaim_sultanic_federal_settlement: "Proclaim the Sultanic Federal Settlement"
independence_wave_iw098_proclaim_sultanic_federal_settlement_desc: "Proclaim a federal emirate settlement that can still carry a wider Sahelian consent docket."
independence_wave_iw098_proclaim_sultanic_federal_settlement_tt: "Requires the Sultanic Federal route, host settlement receipt, and civic-defence staff."
independence_wave_iw098_ratify_northern_constitution: "Ratify the Northern Constitution"
independence_wave_iw098_ratify_northern_constitution_desc: "Ratify a northern constitutional settlement within the emirate tradition."
independence_wave_iw098_ratify_northern_constitution_tt: "Requires the Northern Constitution route, host settlement receipt, and market ledger."
independence_wave_iw098_authorize_frontier_command: "Authorize Frontier Command"
independence_wave_iw098_authorize_frontier_command_desc: "Authorize the frontier command as a bounded emergency settlement for a state under pressure."
independence_wave_iw098_authorize_frontier_command_tt: "Requires the Frontier Command route and civic-defence staff; locks the terminal command settlement."
independence_wave_iw098_prepare_form25_sahel_confederation: "Prepare the FORM-25 Congress Docket"
independence_wave_iw098_prepare_form25_sahel_confederation_desc: "Prepare the Sahelian confederation docket for a later congress decision once the consent ledger is complete."
independence_wave_iw098_prepare_form25_sahel_confederation_tt: "Unlocks the paid FORM-25 congress decision; the decision writes preparation completion."
