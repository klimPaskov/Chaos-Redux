# League of Places
decision_utopia_initialize_league: "Initialize the League of Places"
decision_utopia_initialize_league_desc: "Turn recognized partners and common obligations into a formal League whose members remain distinct places."
decision_utopia_send_surplus_abroad: "Send Material Aid Abroad"
decision_utopia_send_surplus_abroad_desc: "Send real support equipment to §Y[FROM.GetNameDef]§! and record the contribution in the League. Sympathy alone does not count as aid."
decision_utopia_send_technical_mission: "Send a Technical Mission"
decision_utopia_send_technical_mission_desc: "Send tools, transport, and specialists to §Y[FROM.GetNameDef]§! for a bounded cooperative mission."
mission_utopia_technical_mission: "Technical Mission to [FROM.GetNameDef]"
mission_utopia_technical_mission_desc: "The technical mission must remain at peace with its host and inside a functioning League. Cancellation ends the undertaking for both countries and records a League failure."
decision_utopia_open_reserve_compact: "Open a Reserve Compact"
decision_utopia_open_reserve_compact_desc: "Invite §Y[FROM.GetNameDef]§! to join a reciprocal reserve compact backed by actual stores and transport."
mission_utopia_reserve_compact_answer: "Await the Reserve Compact Answer"
mission_utopia_reserve_compact_answer_desc: "The invited country is considering the compact. Acceptance, refusal, cancellation, and silence all conclude the invitation and permit another League undertaking."
decision_utopia_invite_to_league: "Invite a Place to the League"
decision_utopia_invite_to_league_desc: "Offer §Y[FROM.GetNameDef]§! membership, observation, reserve cooperation, or defense partnership under the League charter."
mission_utopia_league_invitation_answer: "Await the League Invitation"
mission_utopia_league_invitation_answer_desc: "The invitation remains open for between §Y90 and 330 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Every answer or silence concludes the invitation and permits another League undertaking."
decision_utopia_prove_league_not_mask: "Prove the League Is Not a Mask"
decision_utopia_prove_league_not_mask_desc: "Keep the external network stable and the country at peace long enough to prove that the League is a cooperative institution."
mission_utopia_prove_league_not_mask: "Prove the League's Legitimacy"
mission_utopia_prove_league_not_mask_desc: "League stability and peace must survive for between §Y180 and 660 days§!, twice the ordinary League term. War and a larger country lengthen the underlying term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Failure records that the mask has slipped."
decision_utopia_pool_reconstruction_brigades: "Pool Reconstruction Brigades"
decision_utopia_pool_reconstruction_brigades_desc: "Send personnel, transport, and support equipment to a League member as an accountable reconstruction contribution."
decision_utopia_call_mutual_defense_council: "Call the Mutual Defense Council"
decision_utopia_call_mutual_defense_council_desc: "Consult a threatened League member and record a mutual defense relationship without imposing a single command."
utopia_manifesto_commonwealth_league: "The Commonwealth League"
decision_utopia_accept_league_sponsorship: "Request League Sponsorship"
decision_utopia_accept_league_sponsorship_desc: "Ask §Y[FROM.GetNameDef]§! to choose between technical sponsorship, a defensive guarantee, or refusal. No sponsorship or guarantee exists until its answer is accepted."
mission_utopia_league_sponsorship_answer: "Await the Sponsorship Answer"
mission_utopia_league_sponsorship_answer_desc: "The request remains open for between §Y90 and 330 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. The selected power alone decides whether technical help, a guarantee, or no sponsorship will follow."
decision_utopia_expel_exploitative_member: "Expel an Exploitative Member"
decision_utopia_expel_exploitative_member_desc: "Remove a member that has breached its obligation or made war on us, then record the exit in the League's public history."
decision_utopia_initialize_league_effect_tt: "Convenes the League, recognizes its current partners and candidates, assesses cohesion and external ties, and opens the League's public undertakings."
decision_utopia_send_surplus_abroad_effect_tt: "Transfers £support_equipment_text_icon §Y100§! to §Y[FROM.GetNameDef]§!, records League aid, lowers Plenty, raises Concord, and opens the first material-aid report once."
decision_utopia_send_technical_mission_effect_tt: "Begins a technical mission in §Y[FROM.GetNameDef]§! lasting between §Y90 and 330 days§!. War and a larger country lengthen it. Stable Plenty, trusted Concord, and relevant public offices shorten it. No other League undertaking can begin until success or cancellation."
mission_utopia_technical_mission_success_tt: "Concludes the technical mission for both countries, permits another League undertaking, grants the host a Partnership opinion of us, and records the host as a recipient of League aid."
decision_utopia_open_reserve_compact_effect_tt: "Sends a reserve-compact invitation to §Y[FROM.GetNameDef]§! and opens a response term lasting between §Y90 and 330 days§!. War and a larger country lengthen it. Stable Plenty, trusted Concord, and relevant public offices shorten it. No other League undertaking can begin until the invitation ends."
mission_utopia_reserve_compact_answer_failure_tt: "Treats silence as refusal, concludes the invitation, permits another League undertaking, and records §Y[FROM.GetNameDef]§! as having refused the compact."
decision_utopia_invite_to_league_effect_tt: "Sends the League invitation to §Y[FROM.GetNameDef]§! and opens a response term lasting between §Y90 and 330 days§!. War and a larger country lengthen it. Stable Plenty, trusted Concord, and relevant public offices shorten it. No other League undertaking can begin until the invitation ends."
mission_utopia_league_invitation_answer_failure_tt: "Treats silence as refusal, concludes the invitation, permits another League undertaking, and records §Y[FROM.GetNameDef]§! as having refused the League."
decision_utopia_prove_league_not_mask_effect_tt: "Begins a League-legitimacy mission lasting between §Y180 and 660 days§!, twice the ordinary League term. War and a larger country lengthen the underlying term. Stable Plenty, trusted Concord, and relevant public offices shorten it. War, collapse of the League, or loss of stability fails the proof and concludes the League undertaking."
mission_utopia_prove_league_not_mask_success_tt: "Records League legitimacy and broad recognition, raises League cohesion, raises Plenty and Concord, moves Choice versus Assignment toward Choice, concludes the League undertaking, and reassesses formation proof."
decision_utopia_pool_reconstruction_brigades_effect_tt: "Transfers £support_equipment_text_icon §Y50§! to §Y[FROM.GetNameDef]§! and records another real League aid contribution. The manpower and motor transport shown in the cost are consumed by the brigade effort."
decision_utopia_call_mutual_defense_council_effect_tt: "Records §Y[FROM.GetNameDef]§! as a League defense partner, reassesses the public defense and formation proofs, and creates no master command or territorial right."
decision_utopia_accept_league_sponsorship_effect_tt: "Sends §Y[FROM.GetNameDef]§! a targeted sponsorship request and opens a response term lasting between §Y90 and 330 days§!. No sponsor or guarantee is installed before that country answers."
mission_utopia_league_sponsorship_answer_failure_tt: "Treats silence as refusal, closes the exact request without recording a sponsor or creating a guarantee, and permits another League undertaking."
decision_utopia_expel_exploitative_member_effect_tt: "Removes §Y[FROM.GetNameDef]§! from the League, records its exit, reassesses cohesion and the remaining external network, and opens the expulsion report."
