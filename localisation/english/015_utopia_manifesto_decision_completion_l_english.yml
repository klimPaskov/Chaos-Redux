# Necessary Ground
decision_utopia_select_necessary_ground_target: "Select a Necessary Ground Partner"
decision_utopia_select_necessary_ground_target_desc: "Select one eligible country for a possible case of Need. Selection records a diplomatic target only and creates no claim, core, or territorial right."
decision_utopia_clear_necessary_ground_target: "Withdraw the Necessary Ground Partner"
decision_utopia_clear_necessary_ground_target_desc: "Withdraw the current selection before a case opens and prepare the list of eligible countries again."
decision_utopia_survey_domestic_alternatives: "Survey Domestic Alternatives"
decision_utopia_survey_domestic_alternatives_desc: "Test whether the dominant deficit can be relieved at home before writing another country into a case of Need."
mission_utopia_survey_domestic_alternatives: "Complete the Domestic Review"
mission_utopia_survey_domestic_alternatives_desc: "The review compares domestic capacity with current Plenty and Concord. Abandoning the Ledger ends the review and records a failed survey."
decision_utopia_draft_need_case: "Draft a Case of Need"
decision_utopia_draft_need_case_desc: "Open one documented case against the selected country after the matching domestic review. The case carries integrity, local support, a selected family, and a fixed expiry."
decision_utopia_select_need_case_state: "Select the Case State"
decision_utopia_select_need_case_state_desc: "Select the eligible state that the active case concerns. This records scope for offers and settlement without creating a claim or core."
mission_utopia_need_case_expiry: "Expiry of the Case of Need"
mission_utopia_need_case_expiry_desc: "The current case has [?utopia_manifesto_case_expiry_days|0] days to reach a valid settlement or enforcement stage. Expiry immediately removes its foreign response and any case wargoal, then preserves the exact partner, state, integrity, and conduct record for a public choice between renunciation, a bilateral limited treaty, or justified continuation at political cost."
decision_utopia_offer_purchase: "Offer Purchase"
decision_utopia_offer_purchase_desc: "Offer the selected partner a paid purchase settlement for the active case state. Their answer is resolved through a timed diplomatic response."
decision_utopia_offer_long_supply_contract: "Offer a Long Supply Contract"
decision_utopia_offer_long_supply_contract_desc: "Replace territorial demand with a long resource and transport compact. Acceptance must be sustained through its own contract mission."
decision_utopia_request_lease: "Request a Lease"
decision_utopia_request_lease_desc: "Request temporary use of the selected state under a recorded lease. Ownership, cores, and claims remain unchanged."
decision_utopia_offer_settlement_agreement: "Offer a Settlement Agreement"
decision_utopia_offer_settlement_agreement_desc: "Offer migration and settlement cooperation without territorial transfer. Acceptance creates a long obligation that both partners must keep valid."
decision_utopia_propose_joint_administration: "Propose Joint Administration"
decision_utopia_propose_joint_administration_desc: "Propose a shared administration over the selected state while ownership remains with the partner and the settlement enters stewardship."
decision_utopia_invite_associate_municipality: "Invite an Associate Municipality"
decision_utopia_invite_associate_municipality_desc: "Offer association under a local charter, retained autonomy, and reciprocal duties. Recognition follows only after the duties are proven."
mission_utopia_wait_for_need_answer: "Await the Partner's Answer"
mission_utopia_wait_for_need_answer_desc: "The selected partner is considering the current offer or ultimatum. Acceptance, refusal, counteroffer, cancellation, and silence all conclude the response."
mission_utopia_fulfil_settlement_agreement: "Fulfil the Settlement Agreement"
mission_utopia_fulfil_settlement_agreement_desc: "Keep the accepted migration and settlement compact valid through its full term. The timetable begins at §Y365 days§! and cannot exceed §Y540 days§! before relevant public offices shorten it. War and a larger country lengthen it. Stable Plenty and trusted Concord shorten it. Cancellation reverses its relief and ends the compact."
mission_utopia_fulfil_long_supply_contract: "Fulfil the Long Supply Contract"
mission_utopia_fulfil_long_supply_contract_desc: "Keep the accepted resource compact and its state access valid through its full term. The timetable begins at §Y540 days§! and cannot exceed §Y720 days§! before relevant public offices shorten it. War and a larger country lengthen it. Stable Plenty and trusted Concord shorten it. Failure removes the temporary resource rights and access granted by the compact."
mission_utopia_prove_association_duties: "Prove the Association Duties"
mission_utopia_prove_association_duties_desc: "Maintain the associate charter, access, guarantee, and reciprocal obligations through the full term. The timetable begins at §Y365 days§! and cannot exceed §Y540 days§! before relevant public offices shorten it. War and a larger country lengthen it. Stable Plenty and trusted Concord shorten it. Failure ends the temporary relations and charter."
decision_utopia_revise_need_offer: "Revise the Offer"
decision_utopia_revise_need_offer_desc: "Answer a counteroffer with a revised version of the same peaceful method, then reopen the timed response."
decision_utopia_issue_need_ultimatum: "Issue the Necessary Ground Ultimatum"
decision_utopia_issue_need_ultimatum_desc: "Demand a final answer under the coercive case doctrine. The ultimatum consumes arms and command capacity, removes Stability and War Support, and still transfers no territory by itself."
decision_utopia_enforce_need_case: "Enforce the Case of Need"
decision_utopia_enforce_need_case_desc: "Escalate a refused ultimatum into an explicit case wargoal. The action consumes a major military and constitutional reserve, but grants no immediate ownership, core, or claim."
decision_utopia_renounce_need_case: "Renounce the Case of Need"
decision_utopia_renounce_need_case_desc: "Admit that the case is obsolete, false, refused, or no longer worth carrying. Renunciation restores stewardship ground where required and closes the case in full."
decision_utopia_convert_case_to_lease: "Convert the Case to a Lease"
decision_utopia_convert_case_to_lease_desc: "Withdraw coercive escalation and restore a peaceful lease offer for the same target and state."
decision_utopia_convert_case_to_joint_administration: "Convert the Case to Joint Administration"
decision_utopia_convert_case_to_joint_administration_desc: "Withdraw coercive escalation and restore a peaceful joint-administration offer for the same target and state."
decision_utopia_select_necessary_ground_target_effect_tt: "Records §Y[FROM.GetNameDef]§! as the selected country for a possible case and replaces any prior selection. No claim, core, wargoal, or ownership change is created."
decision_utopia_clear_necessary_ground_target_effect_tt: "Withdraws the selected country and prepares the candidate list again. This action cannot close a case, foreign response, or stewardship already underway."
decision_utopia_survey_domestic_alternatives_effect_tt: "Begins a domestic review lasting between §Y90 and 180 days§! for the dominant deficit. War and a larger country lengthen the review. Stable Plenty, trusted Concord, and relevant public offices shorten it. Completion records full, partial, or unavailable domestic relief, adjusts all relevant Ledger values, and updates the eligible case partners."
mission_utopia_survey_domestic_alternatives_outcome_tt: "Resolves the domestic review. Full relief sharply lowers Need, partial relief lowers it modestly, and no alternative establishes an honest basis for an external case. Every outcome concludes the review."
decision_utopia_draft_need_case_effect_tt: "Opens one case against §Y[FROM.GetNameDef]§!, consumes the matching domestic review, initializes integrity and local support, and activates the expiry mission. The current Need law sets a 120-, 180-, or 240-day limit. No territorial right is created."
decision_utopia_select_need_case_state_effect_tt: "Records §Y[FROM.GetName]§! as the active case state and opens its state report. Ownership, cores, and claims remain unchanged."
mission_utopia_need_case_expiry_failure_tt: "Suspends the current case, removes its ultimatum and case wargoal immediately, and opens a public review. Renunciation clears the record. Treaty conversion requires the recorded partner's consent. Continuation is available only while the original deficit and relevant ground remain live and begins a shorter term with integrity, local-support, Concord, and Assignment costs."
decision_utopia_offer_purchase_effect_tt: "Sends a purchase offer to §Y[FROM.GetNameDef]§! and opens a response term lasting between §Y90 and 180 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Acceptance, counteroffer, refusal, or silence determines the next case stage."
decision_utopia_offer_long_supply_contract_effect_tt: "Sends a long supply-contract offer to §Y[FROM.GetNameDef]§! and opens a response term lasting between §Y90 and 180 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Acceptance creates a separate long-term fulfilment mission."
decision_utopia_request_lease_effect_tt: "Sends a lease request to §Y[FROM.GetNameDef]§! and opens a response term lasting between §Y90 and 180 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Acceptance creates temporary lease stewardship without changing ownership, cores, or claims."
decision_utopia_offer_settlement_agreement_effect_tt: "Sends a migration and settlement agreement to §Y[FROM.GetNameDef]§! and opens a response term lasting between §Y90 and 180 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Acceptance creates a separate settlement obligation without transferring territory."
decision_utopia_propose_joint_administration_effect_tt: "Sends a joint-administration proposal to §Y[FROM.GetNameDef]§! and opens a response term lasting between §Y90 and 180 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Acceptance begins shared stewardship while the partner retains ownership."
decision_utopia_invite_associate_municipality_effect_tt: "Sends an association charter to §Y[FROM.GetNameDef]§! and opens a response term lasting between §Y90 and 180 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Acceptance begins reciprocal duties without annexation or territorial transfer."
mission_utopia_wait_for_need_answer_refusal_tt: "Treats silence as refusal, concludes the response, and records the rejected settlement. The case remains open for revision, renunciation, conversion, or lawful escalation."
mission_utopia_fulfil_settlement_agreement_failure_tt: "Records the settlement agreement as failed, reverses its temporary deficit relief, raises Need, lowers Plenty and Concord, ends the agreement, and reassesses League and formation proof."
mission_utopia_fulfil_settlement_agreement_success_tt: "Recognizes the partner and compact, records a peaceful external case, relieves the matching deficit, lowers Need, raises Plenty and Concord, concludes the agreement, and reassesses League and formation proof."
mission_utopia_fulfil_long_supply_contract_failure_tt: "Records the supply contract as failed, removes its resource rights and selected-state access, reverses relief, raises Need, lowers Plenty and Concord, and ends the contract."
mission_utopia_fulfil_long_supply_contract_success_tt: "Recognizes the partner and compact, records a peaceful external case, relieves the matching deficit, lowers Need, raises Plenty and Concord, removes temporary contract rights, and reassesses League and formation proof."
mission_utopia_prove_association_duties_failure_tt: "Records association failure, removes temporary access and guarantees, ends the charter and partnership arrangements, raises Need, lowers Plenty and Concord, and moves Choice versus Assignment toward Assignment."
mission_utopia_prove_association_duties_success_tt: "Recognizes an autonomous associate, schedules periodic review, records a peaceful external case, lowers Need, raises Concord, moves Choice versus Assignment toward Choice, and reassesses League and formation proof."
decision_utopia_revise_need_offer_effect_tt: "Restores the current peaceful method after a counteroffer and opens another response term against §Y[FROM.GetNameDef]§!, lasting between §Y90 and 180 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it."
decision_utopia_issue_need_ultimatum_effect_tt: "Records an ultimatum against §Y[FROM.GetNameDef]§! and opens a final response term lasting between §Y90 and 180 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Acceptance, refusal, counteroffer, and silence remain explicit case outcomes."
decision_utopia_enforce_need_case_effect_tt: "Enforces the active case against §Y[FROM.GetNameDef]§!, grants its explicit case wargoal, and opens the enforcement report. It does not transfer ownership or create a core or claim."
decision_utopia_renounce_need_case_effect_tt: "Removes £stability_texticon §Y2%§! in addition to the displayed £pol_power §Y25§!. Renunciation removes any case wargoal, restores unresolved stewardship ground, closes the response and case, raises Concord, and moves Choice versus Assignment toward Choice."
decision_utopia_convert_case_to_lease_effect_tt: "Withdraws the ultimatum, restores a lease offer, and opens a response term against §Y[FROM.GetNameDef]§! lasting between §Y90 and 180 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it."
decision_utopia_convert_case_to_joint_administration_effect_tt: "Withdraws the ultimatum, restores a joint-administration offer, and opens a response term against §Y[FROM.GetNameDef]§! lasting between §Y90 and 180 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it."
