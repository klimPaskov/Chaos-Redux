utopia_manifesto_cost_auxiliary_contract: "£support_equipment_text_icon §Y50§!  £GFX_motorized_equipment_text_icon §Y50§!  £convoy_texticon §Y20§!"
utopia_manifesto_cost_auxiliary_contract_blocked: "£support_equipment_text_icon §R50§!  £GFX_motorized_equipment_text_icon §R50§!  £convoy_texticon §R20§!"
utopia_manifesto_cost_auxiliary_contract_tooltip: "Requires and consumes £support_equipment_text_icon §Y50§!, £GFX_motorized_equipment_text_icon §Y50§!, and £convoy_texticon §Y20§! in addition to the displayed £pol_power §Y60§!. The separate state-scaled formation cost shown in the effect tooltip is also paid before the auxiliary unit is created, and both Support Equipment obligations must be affordable together."
