# Prefire evolution obligations
mission_utopia_prefire_perfect_store_deadline: "The Perfect Storehouse Deadline"
mission_utopia_prefire_perfect_store_deadline_desc: "The Perfect Island opening promises a capital store within §Y180 to 360 days§!. War adds §Y10 days§!, while severe Need removes §Y10 days§!. Completing the store ends the deadline without penalty."
mission_utopia_prefire_perfect_island_deadline: "The Perfect Island Deadline"
mission_utopia_prefire_perfect_island_deadline_desc: "Once an island plan is selected, the Perfect Island opening demands material completion within §Y540 to 900 days§!. War adds §Y10 days§!, while severe Need removes §Y10 days§!. Completing the project ends the deadline without penalty."
decision_utopia_prefire_domestic_shore_repair: "Repair the Necessary Shore at Home"
decision_utopia_prefire_domestic_shore_repair_desc: "Answer the opening shore deficit through domestic civic works and maritime repair before turning it into an external case."
mission_utopia_prefire_domestic_shore_repair: "Complete the Domestic Shore Repair"
mission_utopia_prefire_domestic_shore_repair_desc: "The project must retain the Necessary Shores opening, the Ledger, a current deficit, and constitutional order. Cancellation ends the work without granting relief."
mission_utopia_prefire_perfect_store_deadline_timeout_tt: "The capital-store deadline fails and ends. Need rises by 10, Plenty falls by 5, Concord falls by 10, and the failure remains recorded."
mission_utopia_prefire_perfect_island_deadline_timeout_tt: "The island deadline fails and ends. Need rises by 10, Plenty falls by 10, Concord falls by 10, and the failure remains recorded."
decision_utopia_prefire_domestic_shore_repair_effect_tt: "Begins a domestic repair lasting between §Y90 and 210 days§!. War and a larger country lengthen the work. Stable Plenty and trusted Concord shorten it. Cancellation grants no relief."
mission_utopia_prefire_domestic_shore_repair_timeout_tt: "Completes the domestic repair, reduces both Civic Works and Maritime and Settlement shortages by 20, lowers Need by 10, raises Concord by 5, ends the repair, and updates the eligible Necessary Ground partners."
utopia_manifesto_cost_prefire_domestic_shore_repair: "£support_equipment_text_icon §Y50§!  £GFX_train_texticon §Y5§!"
utopia_manifesto_cost_prefire_domestic_shore_repair_blocked: "£support_equipment_text_icon §R50§!  £GFX_train_texticon §R5§!"
utopia_manifesto_cost_prefire_domestic_shore_repair_tooltip: "Requires and consumes £support_equipment_text_icon §Y50§! and £GFX_train_texticon §Y5§! in addition to the displayed £pol_power §Y40§!."
utopia_manifesto_case_target_survival_required_tt: "The selected country must retain at least one owned state after the proposed transfer."

# Player-readable decision and response-mission availability
decision_utopia_count_houses_and_hands_requirements_tt: "The capital must remain under national control, and no constitutional crisis may be active."
decision_utopia_recount_the_country_requirements_tt: "The foundation census must be complete, and no constitutional crisis may be active."
decision_utopia_publish_the_accounts_requirements_tt: "The Commonwealth Ledger must remain open."
decision_utopia_establish_capital_store_requirements_tt: "The capital must remain under national control."
decision_utopia_fill_seasonal_reserve_requirements_tt: "The Common Reserve must still be below its secure level."
decision_utopia_rotate_old_stores_requirements_tt: "Plenty must be stable enough to rotate old stores."
decision_utopia_release_emergency_stores_requirements_tt: "Need must be severe, and the Common Reserve must be secure."
decision_utopia_two_years_against_hunger_requirements_tt: "Reserve policy must be available, Plenty must be abundant, and the Common Reserve must meet the two-year level."
decision_utopia_select_provisioning_calling_requirements_tt: "No calling assignment may be underway, and Provisioning must face a live shortage or have agricultural training ready."
decision_utopia_select_workshops_calling_requirements_tt: "No calling assignment may be underway, and Workshops and Arsenal must face a live shortage or have social workshops ready."
decision_utopia_select_civic_works_calling_requirements_tt: "No calling assignment may be underway, and Civic Works and Transport must face a live shortage or have common transport works ready."
decision_utopia_select_learning_and_care_calling_requirements_tt: "No calling assignment may be underway, and Learning and Care must face a live shortage or have funded public lectures ready."
decision_utopia_select_maritime_and_settlement_calling_requirements_tt: "No calling assignment may be underway, and Maritime and Settlement must face a live shortage or have a bounded-center plan ready."
decision_utopia_select_defense_and_watches_calling_requirements_tt: "No calling assignment may be underway, and Defense and Watches must face a live shortage or have a Citizen Watch ready."
decision_utopia_issue_open_call_requirements_tt: "A calling must be selected and ready, no calling obligation may be active, and the Closed Island route cannot issue an Open Call."
decision_utopia_guarantee_placement_requirements_tt: "A calling must be selected and ready, and no calling obligation may already be active."
decision_utopia_set_assignment_quota_requirements_tt: "A calling must be selected and ready, no calling obligation may be active, and Assignment Quotas require Common Table, Guardians of Measure, Closed Island, or severe Need."
decision_utopia_emergency_calling_levy_requirements_tt: "A calling must be selected and ready, Need must be existential, no calling obligation or levy may be active, and the previous levy must have expired."
decision_utopia_extend_emergency_calling_levy_requirements_tt: "The emergency levy must still be active, and one of its permitted extensions must remain unused."
decision_utopia_prove_every_calling_chosen_requirements_tt: "Consent of Households or The Joke Understood must guide the country, every calling shortage must be covered, Concord and Plenty must be strong, Choice must remain voluntary, and no calling review may already be active."
decision_utopia_learn_second_trade_requirements_tt: "No second-trade program or calling obligation may already be active."
decision_utopia_suspend_the_short_day_requirements_tt: "Need must be severe, and the previous short-day suspension must have expired."
decision_utopia_register_public_land_requirements_tt: "No constitutional crisis may be active."
decision_utopia_convert_estate_to_land_trust_requirements_tt: "No property transfer project may already be active."
decision_utopia_transfer_factory_to_worker_council_requirements_tt: "No property transfer project may already be active."
decision_utopia_assign_productive_tenure_requirements_tt: "No property transfer project may already be active."
decision_utopia_revoke_idle_grant_requirements_tt: "No property transfer project may already be active."
decision_utopia_survey_district_site_requirements_tt: "The selected state must be an owned, controlled core suitable for district review, and no district survey, construction project, or charter review may already be active."
decision_utopia_found_market_garden_district_requirements_tt: "The selected surveyed state must remain suitable for a Market Garden District, and no district survey, construction project, or charter review may be active."
decision_utopia_found_industrial_housing_district_requirements_tt: "Homes Near Work and a live housing emergency are required, the selected surveyed state must remain suitable, and no district project or charter review may be active."
decision_utopia_found_rail_junction_town_requirements_tt: "Common Transport Ground is required, the selected surveyed state must remain suitable, and no district project or charter review may be active."
decision_utopia_found_refugee_municipality_requirements_tt: "Live migration or housing pressure must persist, the selected surveyed state must remain suitable, the Common Reserve must be at least 30, and no district project or charter review may be active."
decision_utopia_attach_penal_works_to_district_requirements_tt: "The selected district project must permit Penal Works, the listed manpower and equipment must be available, and the Common Reserve must be at least 30."
decision_utopia_complete_district_charter_requirements_tt: "The selected completed district must remain valid, Concord must be cooperative, and no charter review may already be active."
decision_utopia_adopt_existing_island_capital_requirements_tt: "The capital must be an owned, controlled island core suitable for the bounded center."
decision_utopia_adopt_coastal_refuge_requirements_tt: "At least one owned, controlled coastal core must be available for the bounded center."
decision_utopia_adopt_inland_island_requirements_tt: "The country must be landlocked, and its capital must remain an owned, controlled core."
decision_utopia_adopt_archipelago_network_requirements_tt: "At least three distinct owned, controlled island cores must be available for the Archipelago Network."
decision_utopia_adopt_leased_island_requirements_tt: "Maritime and Settlement must face a live uncovered shortage, and an eligible neighboring or continental partner must control an island suitable for lease."
decision_utopia_mark_archipelago_project_site_requirements_tt: "The selected state must be an unregistered owned island core in the Archipelago Network, and no site survey may already be active."
decision_utopia_secure_island_site_requirements_tt: "The selected project site must remain valid, and no island construction stage may already be active."
decision_utopia_build_common_harbor_requirements_tt: "The selected island plan and every required project site must be ready, and no island construction stage may already be active."
decision_utopia_build_inland_terminal_requirements_tt: "The selected island plan and every required project site must be ready, and no island construction stage may already be active."
decision_utopia_complete_capital_provision_ring_requirements_tt: "Every required project site must be ready, the Common Reserve must be secure, and no island construction stage may already be active."
decision_utopia_fortify_without_sealing_requirements_tt: "Every required project site must be ready, and no island construction stage may already be active."
decision_utopia_close_the_gates_requirements_tt: "Every required project site must be ready, and no island construction stage may already be active."
decision_utopia_propose_island_lease_renewal_requirements_tt: "The leased-island term must still be active, and the recorded lessor, island, and lawful control must remain valid."
decision_utopia_make_an_island_requirements_tt: "Every required project site and any island lease must remain valid, the Common Reserve must be strong, and Concord must be cooperative."
decision_utopia_select_necessary_ground_target_requirements_tt: "The selected country must be an eligible Necessary Ground partner and must not be at war with this country."
decision_utopia_clear_necessary_ground_target_requirements_tt: "No Necessary Ground case or pending foreign response may be active."
decision_utopia_survey_domestic_alternatives_requirements_tt: "A live calling deficit must exist, constitutional order must hold, no external Necessary Ground term may be active, and Closed Island must still owe a domestic review."
decision_utopia_draft_need_case_requirements_tt: "The domestic review must authorize a live deficit, Need must be pressing, and no external case, unresolved stewardship failure, or stewardship revolt may remain active."
decision_utopia_select_need_case_state_requirements_tt: "The selected state must match the prepared Necessary Ground case, remain owned and controlled by the selected partner, and pass the case-specific public test."
decision_utopia_offer_purchase_requirements_tt: "A domestic alternative must be recorded, the active case must permit purchase, and the selected country must be at peace with this country."
decision_utopia_offer_long_supply_contract_requirements_tt: "A domestic alternative must be recorded, the active case must permit a long supply contract, and the selected country must be at peace with this country."
decision_utopia_request_lease_requirements_tt: "A domestic alternative must be recorded, the active case must permit a lawful lease, and the selected state and partner must remain eligible."
decision_utopia_offer_settlement_agreement_requirements_tt: "A domestic alternative must be recorded, the case must permit settlement, the selected partner must be at peace, Concord must be cooperative, and no settlement agreement may already be active."
decision_utopia_propose_joint_administration_requirements_tt: "A domestic alternative must be recorded, the case must permit joint administration, Concord must be cooperative, and the Common Reserve must be secure."
decision_utopia_invite_associate_municipality_requirements_tt: "A domestic alternative must be recorded, the case must permit association, local support must meet the stewardship threshold, Concord must be trusted, and the Common Reserve must be secure."
decision_utopia_revise_need_offer_requirements_tt: "The active Necessary Ground case must already have a peaceful offer."
decision_utopia_issue_need_ultimatum_requirements_tt: "A peaceful offer must already exist, the case must permit escalation, Necessary Victory must be in force, and no constitutional restriction on war or coercion may block the ultimatum."
decision_utopia_enforce_need_case_requirements_tt: "Necessary Victory must be in force, no strict-war restriction or foreign response may be active, and this country must not already be at war with the selected target."
decision_utopia_renounce_need_case_requirements_tt: "No foreign response may be pending, and the case must be disproven, resolved, or refused by the selected partner."
decision_utopia_convert_case_to_lease_requirements_tt: "A domestic alternative must be recorded, the case must permit a lease, and no foreign response may be pending."
decision_utopia_convert_case_to_joint_administration_requirements_tt: "A domestic alternative must be recorded, the case must permit joint administration, the peaceful ladder must have reached lease or settlement unless a lawful exception applies, Concord must be cooperative, and no foreign response may be pending."
mission_utopia_wait_for_need_answer_requirements_tt: "The selected partner must have accepted, countered, or refused the pending Necessary Ground proposal."
decision_utopia_confirm_stewardship_obligation_requirements_tt: "The active stewardship must retain its founder, selected state, partner, and lawful case record."
decision_utopia_begin_emergency_provision_requirements_tt: "The active stewardship must remain valid, and the Common Reserve must be secure."
decision_utopia_restore_stewardship_route_requirements_tt: "The active stewardship must retain its founder, selected state, partner, and lawful case record."
decision_utopia_convene_local_charter_requirements_tt: "Emergency provision and route restoration must be complete, and Concord must be cooperative."
decision_utopia_impose_assigned_administration_requirements_tt: "The active stewardship must remain valid, and no local charter may already be recorded."
decision_utopia_hold_charter_period_requirements_tt: "Emergency provision and route restoration must be complete, and the stewardship must not have failed."
decision_utopia_hold_stewardship_status_vote_requirements_tt: "A status vote must be authorized, and the stewardship must meet its current provision, route, charter, support, and integrity proof."
decision_utopia_offer_stewardship_autonomy_requirements_tt: "The stewardship must have an associate partnership, a prior autonomy choice, or a public sunset review."
decision_utopia_return_stewardship_requirements_tt: "No long integration may already be active."
decision_utopia_begin_long_integration_requirements_tt: "The stewardship route must be restored, and either long integration must have been selected or the Closed Island route must require it."
decision_utopia_clean_up_stewardship_revolt_requirements_tt: "The selected stewardship revolt must still be recorded and must not already be at war with this country."
decision_utopia_initialize_league_requirements_tt: "The country must satisfy the League's public entry conditions and have established a compact, charter, technical mission, practical reform, or first material-aid offer."
decision_utopia_send_surplus_abroad_requirements_tt: "The country must hold exportable stores, and the selected partner must not be at war with this country."
decision_utopia_send_technical_mission_requirements_tt: "The selected partner must remain eligible for technical assistance and must not be at war with this country."
decision_utopia_open_reserve_compact_requirements_tt: "The Common Reserve must be secure, and the selected partner must remain eligible for a reserve compact."
mission_utopia_reserve_compact_answer_requirements_tt: "The selected partner must have joined the reserve compact or refused its invitation."
decision_utopia_invite_to_league_requirements_tt: "The League's public entry conditions must be met, and the selected country must not be at war with this country."
mission_utopia_league_invitation_answer_requirements_tt: "The selected partner must have accepted a League role or refused the invitation."
decision_utopia_prove_league_not_mask_requirements_tt: "A functioning external network and stable League cohesion are required."
decision_utopia_pool_reconstruction_brigades_requirements_tt: "The selected League partner must remain eligible for reconstruction work and must not be at war with this country."
