# Constitutional correction
decision_utopia_open_constitutional_correction: "Open Constitutional Correction"
decision_utopia_open_constitutional_correction_desc: "Open a bounded correction period in which one route institution must answer the active constitutional crisis before the deadline."
mission_utopia_constitutional_correction: "Complete Constitutional Correction"
mission_utopia_constitutional_correction_desc: "The country must adopt one valid correction while the capital and Ledger remain secure. Reaching the deadline without one records a failed correction."
decision_utopia_call_a_household_referendum: "Call a Household Referendum"
decision_utopia_call_a_household_referendum_desc: "Let households judge the constitutional settlement directly. During a correction, this resolves the crisis through Consent of Households."
decision_utopia_convene_the_calling_councils: "Convene the Calling Councils"
decision_utopia_convene_the_calling_councils_desc: "Seat the Callings in common council. During a correction, this resolves the crisis through the Common Table."
decision_utopia_request_a_new_forecast: "Request a New Forecast"
decision_utopia_request_a_new_forecast_desc: "Rebuild the national forecast from transport and field evidence. During a correction, this resolves the crisis through the Guardians of Measure."
decision_utopia_extend_the_service_register: "Extend the Service Register"
decision_utopia_extend_the_service_register_desc: "Extend compulsory service and record the burden openly. During a correction, this resolves the crisis through the Closed Island."
decision_utopia_add_a_sunset_clause: "Add a Sunset Clause"
decision_utopia_add_a_sunset_clause_desc: "Bind emergency institutions to an expiry and public review. During a correction, this resolves the crisis through the Joke Understood."
decision_utopia_publish_corrected_tenure_tables: "Publish Corrected Tenure Tables"
decision_utopia_publish_corrected_tenure_tables_desc: "Pay for a full correction of the Productive Tenure data scandal and resolve the disputed figures through an audited revision."
decision_utopia_negotiate_district_appeals: "Negotiate the District Appeals"
decision_utopia_negotiate_district_appeals_desc: "Hear the district revolt's appeals, fund a real settlement, and repair the Assignment imposed through failed measurement."
decision_utopia_open_constitutional_correction_effect_tt: "Begins a constitutional correction lasting between §Y90 and 240 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. A valid route institution completes the correction. Cancellation or timeout records failure, raises Need, lowers Plenty and Concord, and moves Choice versus Assignment toward Assignment."
mission_utopia_constitutional_correction_failed_tt: "The correction fails, ends the attempt, raises Need, lowers Plenty and Concord, moves Choice versus Assignment toward Assignment, and opens the failure report. The constitutional crisis remains unresolved."
decision_utopia_call_a_household_referendum_effect_tt: "Records a household referendum, lowers Need, raises Concord, and moves Choice versus Assignment toward Choice. During a constitutional correction it establishes Consent of Households, resolves the crisis, ends the correction, and reassesses formation proof."
decision_utopia_convene_the_calling_councils_effect_tt: "Records the Calling councils, lowers Need, raises Plenty and Concord, and moves Choice versus Assignment slightly toward Assignment. During an active correction it selects the Common Table and resolves the crisis."
decision_utopia_request_a_new_forecast_effect_tt: "Records a revised forecast, lowers Need, raises Plenty, lowers Concord, and moves Choice versus Assignment toward Assignment. During an active correction it selects the Guardians of Measure and resolves the crisis."
decision_utopia_extend_the_service_register_effect_tt: "Records an extended service register, lowers Need, raises Plenty, lowers Concord, and moves Choice versus Assignment sharply toward Assignment. During an active correction it selects the Closed Island and resolves the crisis."
decision_utopia_add_a_sunset_clause_effect_tt: "Records a sunset clause, lowers Need, raises Concord, and moves Choice versus Assignment sharply toward Choice. During an active correction it selects the Joke Understood and resolves the crisis."
decision_utopia_publish_corrected_tenure_tables_effect_tt: "Ends the data scandal, records corrected tables, lowers Need and Plenty, raises Concord, moves Choice versus Assignment toward Choice, opens the revised-forecast report, and reassesses formation proof."
decision_utopia_negotiate_district_appeals_effect_tt: "Ends the Assignment revolt, records the negotiated settlement, lowers Need and Plenty, raises Concord sharply, moves Choice versus Assignment toward Choice, opens the household-appeal report, and reassesses formation proof."
