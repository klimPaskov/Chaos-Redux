# Defense and paid formations
decision_utopia_guard_the_common_stores: "Guard the Common Stores"
decision_utopia_guard_the_common_stores_desc: "Hold the capital store for between §Y90 and 240 days§! with a real division or a trained citizen watch. War and a larger country lengthen the watch. Stable Plenty, trusted Concord, and relevant public offices shorten it."
mission_utopia_guard_the_common_stores: "The Common Stores Guarded"
mission_utopia_guard_the_common_stores_desc: "The capital must remain controlled. At the deadline, a division in the capital or a trained watch can prove the guard, while an empty defense records failure."
decision_utopia_raise_a_citizen_watch: "Raise a Citizen Watch"
decision_utopia_raise_a_citizen_watch_desc: "Train a watch formation suited to the chosen interpretation. The unit is created only if the formation cost based on controlled states can still be paid at completion."
mission_utopia_raise_a_citizen_watch: "Train the Citizen Watch"
mission_utopia_raise_a_citizen_watch_desc: "Training lasts between §Y90 and 240 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. The final formation cost scales with controlled states and is charged only if the unit can be created."
decision_utopia_form_engineer_companies: "Form Engineer Companies"
decision_utopia_form_engineer_companies_desc: "Prepare transport and train a paid engineer formation for route repair and national defense."
mission_utopia_form_engineer_companies: "Train the Engineer Companies"
mission_utopia_form_engineer_companies_desc: "Engineer training lasts between §Y90 and 240 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. The final formation cost scales with controlled states and is charged only if the unit can be created."
decision_utopia_hire_auxiliary_contracts: "Hire Auxiliary Contracts"
decision_utopia_hire_auxiliary_contracts_desc: "Hire one auxiliary column from §Y[FROM.GetNameDef]§!. The contract pays both its listed transfer cost and the formation cost based on controlled states, then creates an explicit dependency."
decision_utopia_end_the_auxiliary_contract: "End the Auxiliary Contract"
decision_utopia_end_the_auxiliary_contract_desc: "Begin a paid demobilization and settle the auxiliary dependency."
mission_utopia_end_the_auxiliary_contract: "Demobilize the Auxiliaries"
mission_utopia_end_the_auxiliary_contract_desc: "Peace permits clean demobilization. During war, trusted Concord and trained engineers can secure partial integration, while other outcomes record betrayal and leave the contract active."
decision_utopia_guard_the_common_stores_effect_tt: "Begins a store guard lasting between §Y90 and 240 days§!. War and a larger country lengthen the watch. Stable Plenty, trusted Concord, and relevant public offices shorten it. Loss of the capital or the Ledger records failure and ends the watch."
mission_utopia_guard_the_common_stores_outcome_tt: "A division in the capital completes the guard. A trained citizen watch can complete it as understrength. Success raises Plenty and Concord, while failure raises Need, lowers Plenty and Concord, and moves Choice versus Assignment toward Assignment."
decision_utopia_raise_a_citizen_watch_effect_tt: "Begins training lasting between §Y90 and 240 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. At completion, creating the formation consumes £manpower_texticon §Y[?utopia_manifesto_military_manpower_cost_foundation|0]§!, £infantry_equipment_text_icon §Y[?utopia_manifesto_military_infantry_equipment_cost_foundation|0]§!, £support_equipment_text_icon §Y[?utopia_manifesto_military_support_equipment_cost_foundation|0]§!, and £army_experience §Y[?utopia_manifesto_military_army_experience_cost_foundation|0]§!. The displayed £pol_power §Y25§! is paid when training begins."
mission_utopia_raise_a_citizen_watch_outcome_tt: "At the deadline, controlled states determine the formation cost. If it can be paid, one watch formation suited to the chosen interpretation is created and Concord rises. Otherwise no unit or formation resources are consumed, and an understrength outcome raises Need and lowers Plenty and Concord."
decision_utopia_form_engineer_companies_effect_tt: "Consumes the displayed £GFX_motorized_equipment_text_icon §Y50§! and begins training lasting between §Y90 and 240 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. At completion, creating the formation also consumes £manpower_texticon §Y[?utopia_manifesto_military_manpower_cost_foundation|0]§!, £infantry_equipment_text_icon §Y[?utopia_manifesto_military_infantry_equipment_cost_foundation|0]§!, £support_equipment_text_icon §Y[?utopia_manifesto_military_support_equipment_cost_foundation|0]§!, and £army_experience §Y[?utopia_manifesto_military_army_experience_cost_foundation|0]§!."
mission_utopia_form_engineer_companies_outcome_tt: "At the deadline, controlled states determine the formation cost. If it can be paid, one engineer formation is created, Plenty rises, and the engineer report opens. Otherwise no unit or formation resources are consumed, and limited cadres raise Need and lower Plenty."
decision_utopia_hire_auxiliary_contracts_effect_tt: "Consumes the listed contract materials and the state-scaled formation cost of £manpower_texticon §Y[?utopia_manifesto_military_manpower_cost_foundation|0]§!, £infantry_equipment_text_icon §Y[?utopia_manifesto_military_infantry_equipment_cost_foundation|0]§!, £support_equipment_text_icon §Y[?utopia_manifesto_military_support_equipment_cost_foundation|0]§!, and £army_experience §Y[?utopia_manifesto_military_army_experience_cost_foundation|0]§!. Both Support Equipment obligations must be held together before the contract can be signed. It transfers 50 Support Equipment and 50 Motorized Equipment to §Y[FROM.GetNameDef]§!, creates one paid auxiliary column, and records dependency and auxiliary conduct."
decision_utopia_end_the_auxiliary_contract_effect_tt: "Begins demobilization lasting between §Y90 and 240 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Cancellation ends only the demobilization attempt and records betrayal, while the auxiliary contract remains in force."
mission_utopia_end_the_auxiliary_contract_outcome_tt: "Peace ends the contract and dependency cleanly. During war, trusted Concord and formed engineers permit partial integration before the same settlement. Otherwise the demobilization fails, the contract remains in force, Concord falls sharply, and Choice versus Assignment moves toward Assignment."
