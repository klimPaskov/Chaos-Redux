# Stewardship and Assigned Colonies
decision_utopia_confirm_stewardship_obligation: "Confirm the Stewardship Obligation"
decision_utopia_confirm_stewardship_obligation_desc: "A peaceful settlement creates duties before it creates rights. Confirm the obligation and open its provision, route, charter, and status work."
decision_utopia_begin_emergency_provision: "Begin Emergency Provision"
decision_utopia_begin_emergency_provision_desc: "Supply the active stewardship state before administration turns scarcity into revolt."
mission_utopia_emergency_provision: "Provision the Stewardship"
mission_utopia_emergency_provision_desc: "The selected state is receiving emergency stores. Loss of the case or stewardship obligation cancels the project, records failure, and can trigger revolt."
decision_utopia_restore_stewardship_route: "Restore the Stewardship Route"
decision_utopia_restore_stewardship_route_desc: "Rebuild the transport route that connects the selected stewardship state to its provisions and partner."
mission_utopia_restore_stewardship_route: "Restore the Common Route"
mission_utopia_restore_stewardship_route_desc: "Engineers and carriers are restoring the selected state's route. Loss of the case or stewardship obligation ends the work and records failure."
decision_utopia_convene_local_charter: "Convene a Local Charter"
decision_utopia_convene_local_charter_desc: "Bring local petitions, provision records, and restored routes into one charter that can support an honest status settlement."
decision_utopia_impose_assigned_administration: "Impose Assigned Administration"
decision_utopia_impose_assigned_administration_desc: "Replace local charter work with a compulsory Assigned Colony administration. Local Supplies fall by §R10%§!, Required Garrisons rise by §R25%§!, and the Resistance Target rises by §R8%§!. The coercion remains part of the country's record."
decision_utopia_hold_charter_period: "Hold the Charter Period"
decision_utopia_hold_charter_period_desc: "Keep provision, routes, and local obligations valid through a sustained charter term before status can be settled."
mission_utopia_hold_charter_period: "Sustain the Charter Period"
mission_utopia_hold_charter_period_desc: "The charter is being tested for between §Y180 and 660 days§!, twice the ordinary stewardship term. War and a larger country lengthen the underlying term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Failed provision, failed routes, existential Need, or the end of stewardship can trigger revolt."
decision_utopia_hold_stewardship_status_vote: "Hold the Stewardship Status Vote"
decision_utopia_hold_stewardship_status_vote_desc: "Let the proven stewardship settlement face a public choice over association, autonomy, return, or integration."
decision_utopia_offer_stewardship_autonomy: "Ratify the Chosen Status"
decision_utopia_offer_stewardship_autonomy_desc: "Carry the status ballot into law. An association restores the state under a reviewed municipal charter with access and defense obligations. An autonomy pact restores it under independent government and a defensive guarantee without access."
decision_utopia_return_stewardship: "Return the Stewardship"
decision_utopia_return_stewardship_desc: "Return the selected state when the obligation has failed or Need has ended, then close the case and stewardship obligations."
decision_utopia_begin_long_integration: "Begin Long Integration"
decision_utopia_begin_long_integration_desc: "Sustain a proven stewardship settlement through a long integration term before ownership can transfer. Completion creates no core."
mission_utopia_long_integration: "Complete Long Integration"
mission_utopia_long_integration_desc: "The selected state is passing through an integration term lasting between §Y270 and 990 days§!, three times the ordinary stewardship term. War and a larger country lengthen the underlying term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Failed proof or existential Need can trigger revolt and end the attempt."
decision_utopia_clean_up_stewardship_revolt: "End the Assigned Revolt Administration"
decision_utopia_clean_up_stewardship_revolt_desc: "Return control of the revolt states to their recorded partner, end Assigned Colony rule, and settle the unresolved stewardship burden."
decision_utopia_confirm_stewardship_obligation_effect_tt: "Confirms the active stewardship obligation, unlocks its decisions, and opens the first stewardship report if it has not already been seen."
decision_utopia_begin_emergency_provision_effect_tt: "Begins a stewardship provision project lasting between §Y90 and 330 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it. Cancellation after the obligation fails records failure, ends the current stewardship projects, can trigger revolt, and opens the failure report."
mission_utopia_emergency_provision_success_tt: "Completes provision in the selected case state, concludes the current stewardship projects, lowers Need and Plenty, raises Concord, records common-use relief, and opens the provision report."
decision_utopia_restore_stewardship_route_effect_tt: "Begins a route-restoration project for the selected case state lasting between §Y90 and 330 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it. Cancellation ends the current stewardship projects and records failure."
mission_utopia_restore_stewardship_route_success_tt: "Restores the provision route in the selected case state, concludes the current stewardship projects, lowers Need, raises Plenty and Concord, and opens the engineer outcome."
decision_utopia_convene_local_charter_effect_tt: "Grants the local charter to the selected case state, raises local support, records the charter, and opens the local petition and charter reports."
decision_utopia_impose_assigned_administration_effect_tt: "Applies Assigned Colony administration to the active case state and records colonial conduct. Need falls and Plenty rises, while Concord falls sharply and Choice versus Assignment moves toward Assignment. No core is created."
decision_utopia_hold_charter_period_effect_tt: "Begins a stewardship charter period lasting between §Y180 and 660 days§!, twice the ordinary term. War and a larger country lengthen the underlying term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Provision, route restoration, and a valid obligation must survive until the deadline."
mission_utopia_hold_charter_period_success_tt: "Completes the charter period, concludes the current stewardship projects, renews stewardship proof, lowers Need, raises Plenty and Concord, and moves Choice versus Assignment toward Choice."
decision_utopia_hold_stewardship_status_vote_effect_tt: "Records one stewardship status vote and opens its event. The event resolves integration, association, autonomy, or return according to the live settlement and public choice."
decision_utopia_offer_stewardship_autonomy_effect_tt: "Ratifies the live ballot result. Association returns the state, installs a durable reviewed association charter, and records attributed access and guarantee diplomacy. Autonomy returns the state under a distinct independence pact with only an attributed defensive guarantee. Both end stewardship, close the case, raise Concord, move Choice versus Assignment toward Choice, and count as a real external relationship. Neither grants a core nor annexes the partner."
decision_utopia_return_stewardship_effect_tt: "Returns the selected state to its recorded partner, removes the case wargoal, ends temporary stewardship, closes the case, raises Need slightly, raises Concord, and moves Choice versus Assignment toward Choice."
decision_utopia_begin_long_integration_effect_tt: "Begins an integration mission lasting between §Y270 and 990 days§!, three times the ordinary stewardship term. War and a larger country lengthen the underlying term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Loss of proof or existential Need can fail the project and trigger revolt."
mission_utopia_long_integration_success_tt: "Transfers ownership of the selected case state, establishes integrated commonwealth administration, records a peaceful case, lowers Need, raises Plenty and Concord, closes the case and stewardship obligations, and reassesses formation proof. No core is created."
decision_utopia_clean_up_stewardship_revolt_effect_tt: "Returns control of each revolt state to §Y[FROM.GetNameDef]§! where ownership still matches, ends Assigned Colony and revolt administration, resolves the stewardship burden, lowers Need and Plenty, and raises Concord."
utopia_manifesto_cost_stewardship_provision: "£support_equipment_text_icon §Y100§!  £GFX_train_texticon §Y10§!  £convoy_texticon §Y20§!"
