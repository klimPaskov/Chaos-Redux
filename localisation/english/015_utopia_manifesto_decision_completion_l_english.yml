# Callings and the short day
decision_utopia_select_provisioning_calling: "Select Provisioning"
decision_utopia_select_provisioning_calling_desc: "Make food, stores, and local distribution the Calling that must be answered."
decision_utopia_select_workshops_calling: "Select Workshops"
decision_utopia_select_workshops_calling_desc: "Make workshops, repair, and apprenticeship the Calling that must be answered."
decision_utopia_select_civic_works_calling: "Select Civic Works"
decision_utopia_select_civic_works_calling_desc: "Make roads, public works, and common transport the Calling that must be answered."
decision_utopia_select_learning_and_care_calling: "Select Learning and Care"
decision_utopia_select_learning_and_care_calling_desc: "Make teaching, medicine, and household care the Calling that must be answered."
decision_utopia_select_maritime_and_settlement_calling: "Select Maritime and Settlement Work"
decision_utopia_select_maritime_and_settlement_calling_desc: "Make harbors, shipping, settlement, and island work the Calling that must be answered."
decision_utopia_select_defense_and_watches_calling: "Select Defense and Watches"
decision_utopia_select_defense_and_watches_calling_desc: "Make local defense, watches, and emergency readiness the Calling that must be answered."
decision_utopia_issue_open_call: "Issue an Open Call"
decision_utopia_issue_open_call_desc: "Ask households to answer the selected shortage freely. The result depends on current Plenty and Concord."
decision_utopia_guarantee_placement: "Guarantee Placement"
decision_utopia_guarantee_placement_desc: "Back the selected Calling with transport, tools, and a guaranteed place to live and work."
decision_utopia_set_assignment_quota: "Set an Assignment Quota"
decision_utopia_set_assignment_quota_desc: "Fill the selected Calling through a compulsory quota. This can answer Need quickly, but it moves Choice versus Assignment toward Assignment and tests Concord."
decision_utopia_emergency_calling_levy: "Issue an Emergency Calling Levy"
decision_utopia_emergency_calling_levy_desc: "Use an expiring emergency warrant to cover an existential shortage. The levy consumes lives and arms, removes Stability, and remains subject to a separate sunset mission."
mission_utopia_fill_unpopular_calling: "Fill the Unpopular Calling"
mission_utopia_fill_unpopular_calling_desc: "The selected Calling is being filled through the chosen method. The deadline judges it against live Need, Plenty, Concord, and Choice versus Assignment."
decision_utopia_prove_every_calling_chosen: "Prove Every Calling Chosen"
decision_utopia_prove_every_calling_chosen_desc: "Keep every Calling free of shortage long enough to prove that sustained choice can carry the common work."
mission_utopia_sustain_every_calling_chosen: "Sustain Every Calling Chosen"
mission_utopia_sustain_every_calling_chosen_desc: "Every Calling must remain free of shortage throughout the proof. Its planning band runs from §Y365 to 540 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. A renewed shortage ends the attempt and permits another Calling undertaking."
decision_utopia_learn_second_trade: "Learn a Second Trade"
decision_utopia_learn_second_trade_desc: "Train households across a second useful trade so one shortage cannot trap the country in permanent Assignment."
mission_utopia_learn_second_trade: "Train the Second Trade"
mission_utopia_learn_second_trade_desc: "Training lasts between §Y90 and 210 days§!. War and a larger country lengthen it. Stable Plenty, trusted Concord, and relevant public offices shorten it. Abandoning the Ledger ends the training and permits another Calling undertaking."
decision_utopia_suspend_the_short_day: "Suspend the Short Day"
decision_utopia_suspend_the_short_day_desc: "Temporarily suspend the six-hour day under severe Need. Output rises, but Concord falls and Choice versus Assignment moves sharply toward Assignment."
mission_utopia_short_day_suspension: "The Short Day Suspended"
mission_utopia_short_day_suspension_desc: "The emergency extension remains in force until its timed warrant ends. Completion or cancellation restores the ordinary short day."
decision_utopia_issue_open_call_effect_tt: "Begins a Calling mission lasting between §Y90 and 210 days§! for the selected shortage. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. A free call can bring full or partial relief, or fail with greater Need and lower Concord."
decision_utopia_guarantee_placement_effect_tt: "Begins a Calling mission lasting between §Y90 and 210 days§!, backed by guaranteed placement. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Stable Plenty supports full resolution, while weaker conditions can bring partial relief or failure."
decision_utopia_set_assignment_quota_effect_tt: "Begins a quota mission lasting between §Y90 and 210 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Full resolution lowers Need and Concord and moves Choice versus Assignment toward Assignment. Using a quota outside severe Need records coercive assignment."
decision_utopia_emergency_calling_levy_effect_tt: "Begins an emergency Calling mission for [?utopia_manifesto_calling_days|0] days. Full resolution covers the shortage temporarily, lowers Concord, moves Choice versus Assignment toward Assignment, and starts the separate levy-expiry mission."
mission_utopia_fill_unpopular_calling_outcome_tt: "Resolves the selected Calling against the chosen method and current Ledger. Success, partial relief, or failure adjusts Need, Plenty, Concord, and Choice versus Assignment, concludes the common undertaking, and records when the method may be used again."
decision_utopia_prove_every_calling_chosen_effect_tt: "Begins a Calling-sustainment mission with a §Y365 to 540 day§! planning band. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. No other Calling undertaking can begin until it ends, and every Calling must remain free of shortage until the deadline."
mission_utopia_sustain_every_calling_chosen_success_tt: "Completes the sustained-choice proof, concludes the common Calling undertaking, raises Concord, and records that every Calling remained chosen."
decision_utopia_learn_second_trade_effect_tt: "Begins second-trade training lasting between §Y90 and 210 days§!. War and a larger country lengthen it. Stable Plenty, trusted Concord, and relevant public offices shorten it. No other Calling undertaking can begin until the training ends. Cancellation grants no completion."
mission_utopia_learn_second_trade_success_tt: "Completes second-trade training, concludes the common Calling undertaking, lowers Need, raises Plenty and Concord, and moves Choice versus Assignment toward Choice."
decision_utopia_suspend_the_short_day_effect_tt: "Suspends the short day for [?utopia_manifesto_calling_days|0] days. Need falls and Plenty rises, while Concord falls and Choice versus Assignment moves toward Assignment."
mission_utopia_short_day_suspension_end_tt: "Restores the short day and ends the emergency extension. Plenty falls slightly, Concord rises, and Choice versus Assignment moves toward Choice."
