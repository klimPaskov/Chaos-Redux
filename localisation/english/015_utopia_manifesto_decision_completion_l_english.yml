# Formation and post-formation work
decision_utopia_prove_the_commonwealth: "Prove the Commonwealth"
decision_utopia_prove_the_commonwealth_desc: "Test the resolved interpretation against its live stores, districts, defense, stewardship, League, and constitutional obligations before proclamation."
mission_utopia_prove_the_commonwealth: "The Commonwealth Under Proof"
mission_utopia_prove_the_commonwealth_desc: "The country's full formation proof is being tested. Its planning band runs from §Y365 to 540 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Loss of the Ledger, a constitutional crisis, or failed stewardship ends the attempt."
decision_utopia_proclaim_the_commonwealth: "Proclaim the Commonwealth"
decision_utopia_proclaim_the_commonwealth_desc: "Call the route-aware proclamation after full proof. The identity event remains the sole writer of the formed country and its public name."
decision_utopia_integrate_post_formation_institutions: "Integrate the Commonwealth Institutions"
decision_utopia_integrate_post_formation_institutions_desc: "Fund one post-formation institutional expansion whose manpower, support equipment, and political cost scales with the controlled country."
decision_utopia_reinforce_post_formation_defense: "Reinforce the Commonwealth Defense"
decision_utopia_reinforce_post_formation_defense_desc: "Fund one post-formation Commonwealth Guard whose manpower, equipment, and experience cost scales with the controlled country."
decision_utopia_refresh_post_formation_charters: "Refresh the Commonwealth Charters"
decision_utopia_refresh_post_formation_charters_desc: "Renew the external charters, transport obligations, and common stores that keep a formed Commonwealth answerable to its partners."
decision_utopia_prove_the_commonwealth_effect_tt: "Begins a formation proof with a §Y365 to 540 day§! planning band. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Cancellation records failure, raises Need, and lowers Plenty and Concord."
mission_utopia_prove_the_commonwealth_outcome_tt: "Reviews every current formation condition. Full proof records the Commonwealth ready, lowers Need, and raises Plenty and Concord. Partial proof records the missing foundation, raises Need, and lowers Plenty and Concord. Either result concludes the proof."
decision_utopia_proclaim_the_commonwealth_effect_tt: "Opens the route-aware proclamation event. The selected interpretation applies its canonical country identity and records formation through the shared identity writer. This decision does not create a second formation path."
decision_utopia_integrate_post_formation_institutions_effect_tt: "Consumes the displayed £pol_power §Y40§! plus the live institutional cost of £manpower_texticon §Y[?utopia_manifesto_institutional_manpower_cost_foundation|0]§!, £support_equipment_text_icon §Y[?utopia_manifesto_institutional_support_equipment_cost_foundation|0]§!, and £pol_power §Y[?utopia_manifesto_institutional_political_power_cost_foundation|0]§!. Payment applies one foundation-tier institutional expansion and records it once."
decision_utopia_reinforce_post_formation_defense_effect_tt: "Consumes the displayed £pol_power §Y40§! plus the live formation cost of £manpower_texticon §Y[?utopia_manifesto_military_manpower_cost_foundation|0]§!, £infantry_equipment_text_icon §Y[?utopia_manifesto_military_infantry_equipment_cost_foundation|0]§!, £support_equipment_text_icon §Y[?utopia_manifesto_military_support_equipment_cost_foundation|0]§!, and £army_experience §Y[?utopia_manifesto_military_army_experience_cost_foundation|0]§!. Payment creates one Commonwealth Guard and records the reinforcement once."
decision_utopia_refresh_post_formation_charters_effect_tt: "Records the charter renewal once, reassesses stewardship and formation proof, and preserves the existing external network. It transfers no state and creates no claim or core."
