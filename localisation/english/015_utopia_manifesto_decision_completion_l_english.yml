l_english:
# Event 015 decision and mission completion

# Categories
utopia_manifesto_necessary_ground_category: "Necessary Ground"
utopia_manifesto_necessary_ground_category_desc: "Test domestic alternatives, record one active case of Need, and pursue purchase, supply, lease, association, joint administration, renunciation, or enforcement without creating hidden claims."
utopia_manifesto_necessary_ground_take_state: "Enforce the Necessary Ground Case"
utopia_manifesto_necessary_ground_take_state_desc: "Secure $STATE|Y$ from $TARGET|Y$ only as the marked Necessary Ground case."
UTOPIA_MANIFESTO_NECESSARY_GROUND_WAR_NAME: "$ORDER$$FIRST$ Necessary Ground War for $STATE$"
utopia_manifesto_stewardship_category: "Stewardship"
utopia_manifesto_stewardship_category_desc: "Provision and administer ground placed under our care, restore its routes, settle its charter, and resolve its status through autonomy, return, integration, or a settlement after revolt."
utopia_manifesto_league_category: "The League of Places"
utopia_manifesto_league_category_desc: "Found a league of equal places, send real aid, negotiate reserve and defense compacts, admit members, and prove that the League is a cooperative institution."
utopia_manifesto_defense_category: "Defense of the Common Stores"
utopia_manifesto_defense_category_desc: "Guard the stores, train citizen watches and engineers, and manage any auxiliary contract through a paid and accountable lifecycle."
utopia_manifesto_governance_category: "Constitutional Correction"
utopia_manifesto_governance_category_desc: "Answer a constitutional crisis through the institutions promised by the chosen interpretation, or repair the data and district failures produced in its name."
utopia_manifesto_formation_category: "Prove the Commonwealth"
utopia_manifesto_formation_category_desc: "Test the country's institutions, defense, districts, stores, and external obligations before proclamation, then renew the structures that must survive it."

# Survey and accounts
decision_utopia_count_houses_and_hands: "Count Houses and Hands"
decision_utopia_count_houses_and_hands_desc: "A common account begins with households, stores, trades, and unmet work. The first national survey will establish the evidence behind Need, Plenty, Concord, and Choice versus Assignment."
mission_utopia_count_houses_and_hands: "The National Count"
mission_utopia_count_houses_and_hands_desc: "Surveyors are reconciling household rolls, store records, and local reports. Losing the capital or abandoning the Ledger ends the count and leaves the figures disputed."
decision_utopia_recount_the_country: "Recount the Country"
decision_utopia_recount_the_country_desc: "A mature Ledger still needs fresh evidence. Repeating the national count will replace confidence built on old figures with a current measure of the country."
decision_utopia_publish_the_accounts: "Publish the Accounts"
decision_utopia_publish_the_accounts_desc: "Open accounts let households test the Ledger against their own lives. Publication strengthens Concord and moves Choice versus Assignment toward Choice."
decision_utopia_count_houses_and_hands_effect_tt: "Begins a national survey lasting between §Y90 and 210 days§!. War and a larger country lengthen the survey. Stable Plenty, trusted Concord, and relevant public offices shorten it. Completion establishes the founding survey, refreshes Need, Plenty, Concord, and Choice versus Assignment, and opens the first survey report."
mission_utopia_count_houses_and_hands_success_tt: "Completes the national survey, closes its work, refreshes all four Ledger values, and opens the founding report if it has not already been seen."
decision_utopia_recount_the_country_effect_tt: "Begins another national survey lasting between §Y90 and 210 days§!. War and a larger country lengthen the survey. Stable Plenty, trusted Concord, and relevant public offices shorten it. The first-survey report remains one-time."
decision_utopia_publish_the_accounts_effect_tt: "Publishes the current accounts for 90 days. Concord rises and Choice versus Assignment moves toward Choice."
utopia_manifesto_cost_survey_transport: "£GFX_train_texticon §Y5§!  £GFX_motorized_equipment_text_icon §Y25§!"
utopia_manifesto_cost_survey_transport_blocked: "£GFX_train_texticon §R5§!  £GFX_motorized_equipment_text_icon §R25§!"
utopia_manifesto_cost_survey_transport_tooltip: "Requires and consumes £GFX_train_texticon §Y5§! and £GFX_motorized_equipment_text_icon §Y25§! in addition to the displayed £pol_power §Y25§!."
utopia_manifesto_cost_recount_transport: "£GFX_train_texticon §Y10§!  £GFX_motorized_equipment_text_icon §Y50§!"
utopia_manifesto_cost_recount_transport_blocked: "£GFX_train_texticon §R10§!  £GFX_motorized_equipment_text_icon §R50§!"
utopia_manifesto_cost_recount_transport_tooltip: "Requires and consumes £GFX_train_texticon §Y10§! and £GFX_motorized_equipment_text_icon §Y50§! in addition to the displayed £pol_power §Y40§!."

# Common stores
decision_utopia_establish_capital_store: "Establish the Capital Store"
decision_utopia_establish_capital_store_desc: "A national reserve needs a storehouse that households can inspect and trains can reach. The project will bind the capital to the Ledger's first durable reserve."
mission_utopia_establish_capital_store: "Build the Capital Store"
mission_utopia_establish_capital_store_desc: "The capital store is under construction. Loss of the capital or abandonment of the Ledger cancels the work and records a failed store project."
decision_utopia_fill_seasonal_reserve: "Fill the Seasonal Reserve"
decision_utopia_fill_seasonal_reserve_desc: "Move tools and seasonal goods into the common stores before scarcity writes the next account for us."
mission_utopia_fill_seasonal_reserve: "Stock the Seasonal Reserve"
mission_utopia_fill_seasonal_reserve_desc: "The reserve network is receiving its seasonal stock. Abandoning the Ledger cancels the operation and records the shortfall."
decision_utopia_rotate_old_stores: "Rotate the Old Stores"
decision_utopia_rotate_old_stores_desc: "Move aging stocks through the country while they still serve a use. Honest rotation protects the reserve and exposes how each interpretation treats abundance."
decision_utopia_release_emergency_stores: "Release the Emergency Stores"
decision_utopia_release_emergency_stores_desc: "Open the reserves where Need is severe. Relief draws down Plenty, but public provision can strengthen Concord."
decision_utopia_two_years_against_hunger: "Two Years Against Hunger"
decision_utopia_two_years_against_hunger_desc: "Turn the reserve into a national promise that can survive two harvests, transport failures, and political temptation."
mission_utopia_two_years_against_hunger: "Secure Two Years Against Hunger"
mission_utopia_two_years_against_hunger_desc: "The country is sustaining a long reserve effort. Existential Need, an insecure reserve, or the end of the Ledger converts the attempt into partial proof."
decision_utopia_establish_capital_store_effect_tt: "Begins a capital-store project lasting between §Y90 and 270 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it. Completion adds 20 Common Reserve points, lowers Need, raises Plenty and Concord, and opens the first store report."
mission_utopia_establish_capital_store_success_tt: "Completes the capital store, concludes its construction, adds 20 Common Reserve points, lowers Need, and raises Plenty and Concord."
decision_utopia_fill_seasonal_reserve_effect_tt: "Begins a seasonal reserve operation lasting between §Y90 and 270 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it. Completion adds 20 Common Reserve points, lowers Need, and raises Plenty and Concord."
mission_utopia_fill_seasonal_reserve_success_tt: "Completes the seasonal reserve, closes the operation, adds 20 Common Reserve points, lowers Need, and raises Plenty and Concord."
decision_utopia_rotate_old_stores_effect_tt: "Adds 5 Common Reserve points and refreshes the Ledger. The public outcome follows current Concord and the resolved interpretation."
decision_utopia_release_emergency_stores_effect_tt: "Consumes 20 Common Reserve points. Need and Plenty fall, Concord rises, and the provision is recorded as common-use relief."
decision_utopia_two_years_against_hunger_effect_tt: "Begins a reserve mission lasting between §Y270 and 810 days§!, three times the ordinary reserve term. War and a larger country lengthen the underlying term. Stable Plenty, trusted Concord, and relevant public offices shorten it."
mission_utopia_two_years_against_hunger_success_tt: "Secures the highest Common Reserve band, lowers Need, raises Plenty and Concord, records the completed two-year reserve, and renews the country's formation proof."
