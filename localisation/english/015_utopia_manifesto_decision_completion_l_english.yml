utopia_manifesto_cost_store_guard_blocked: "£infantry_equipment_text_icon §R500§!  £support_equipment_text_icon §R50§!"
utopia_manifesto_cost_store_guard_tooltip: "Requires and consumes £infantry_equipment_text_icon §Y500§! and £support_equipment_text_icon §Y50§! in addition to the displayed £pol_power §Y40§!."
