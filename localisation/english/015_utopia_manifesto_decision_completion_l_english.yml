# Property transition
decision_utopia_register_public_land: "Register the Public Land"
decision_utopia_register_public_land_desc: "Survey public land, disputed grants, and productive obligations before any route writes its property settlement into the states."
mission_utopia_register_public_land: "Complete the Public Land Register"
mission_utopia_register_public_land_desc: "The national register is being reconciled. Abandoning the Ledger ends the work and records the register as disputed."
decision_utopia_convert_estate_to_land_trust: "Convert an Estate to a Land Trust"
decision_utopia_convert_estate_to_land_trust_desc: "Place an estate in a public land trust in §Y[FROM.GetName]§!, then test the arrangement through a project lasting between §Y90 and 270 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it."
decision_utopia_transfer_factory_to_worker_council: "Transfer a Factory to a Worker Council"
decision_utopia_transfer_factory_to_worker_council_desc: "Transfer a factory in §Y[FROM.GetName]§! to a worker council and carry the transition through a project lasting between §Y90 and 270 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it."
decision_utopia_assign_productive_tenure: "Assign Productive Tenure"
decision_utopia_assign_productive_tenure_desc: "Grant tenure in §Y[FROM.GetName]§! against measured productive obligations. Failure can expose the data scandal beneath the assignment."
decision_utopia_revoke_idle_grant: "Revoke an Idle Grant"
decision_utopia_revoke_idle_grant_desc: "Revoke an idle grant in §Y[FROM.GetName]§! and place the site under direct productive use."
mission_utopia_property_transition: "Complete the Property Transition"
mission_utopia_property_transition_desc: "The selected state is carrying one property settlement. Loss of control or abandonment of the Ledger ends the work and leaves the transition disputed."
decision_utopia_register_public_land_effect_tt: "Begins a public-land register lasting between §Y90 and 270 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it. Completion lowers Need, raises Plenty and Concord, and opens the route property projects."
mission_utopia_register_public_land_success_tt: "Completes the public-land register, closes the survey, lowers Need, and raises Plenty and Concord."
decision_utopia_convert_estate_to_land_trust_effect_tt: "Begins a §Y90 to 270 day§! project in §Y[FROM.GetName]§!. War and a larger country lengthen it. Stable Plenty, trusted Concord, and relevant public offices shorten it. Success establishes the land trust, adds 1 Infrastructure, lowers Need, and raises Plenty and Concord."
decision_utopia_transfer_factory_to_worker_council_effect_tt: "Begins a §Y90 to 270 day§! project in §Y[FROM.GetName]§!. War and a larger country lengthen it. Stable Plenty, trusted Concord, and relevant public offices shorten it. Success establishes the worker council, adds 1 shared building slot and 1 Civilian Factory, lowers Need, and raises Plenty and Concord."
decision_utopia_assign_productive_tenure_effect_tt: "Begins a §Y90 to 270 day§! project in §Y[FROM.GetName]§!. War and a larger country lengthen it. Stable Plenty, trusted Concord, and relevant public offices shorten it. Success establishes Productive Tenure and adds 1 Infrastructure, while Concord falls and Choice versus Assignment moves toward Assignment."
decision_utopia_revoke_idle_grant_effect_tt: "Begins a §Y90 to 270 day§! project in §Y[FROM.GetName]§!. War and a larger country lengthen it. Stable Plenty, trusted Concord, and relevant public offices shorten it. Success revokes the grant, adds 1 shared building slot and 1 Military Factory, while Concord falls and Choice versus Assignment moves toward Assignment."
mission_utopia_property_transition_success_tt: "Completes the selected property settlement in §Y[FROM.GetName]§!, grants its building and Ledger outcome, records one completed property project, and concludes the transition."
