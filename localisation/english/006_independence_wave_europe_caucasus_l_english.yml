# Europe and Caucasus framework packages.
independence_wave_atx_institution: "Assembly of Venice"
independence_wave_atx_institution_long: "Assembly of Venice"
independence_wave_icx_institution: "Municipal Council"
independence_wave_icx_institution_long: "Municipal Council of Trieste"
independence_wave_bjx_institution: "Provincial Assembly"
independence_wave_bjx_institution_long: "Courland Provincial Assembly"
independence_wave_bkx_institution: "Provincial Council"
independence_wave_bkx_institution_long: "Polesian Provincial Council"
independence_wave_cjx_institution: "Provincial Anjoman"
independence_wave_cjx_institution_long: "Provincial Anjoman of Khuzestan"
