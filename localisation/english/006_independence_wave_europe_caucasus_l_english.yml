# Venice
independence_wave_atx_venice_category: "The Assembly of Venice"
independence_wave_atx_venice_category_desc: "Venice governs itself again, as it did in 1848. The old lagoon city lives on its port, glassworks, and visitors, while Marghera and Mestre grow on the mainland."
independence_wave_atx_convene_assembly_of_venice: "Convene the Assembly of Venice"
independence_wave_atx_convene_assembly_of_venice_desc: "Call elected members from the lagoon city and the mainland towns to sit together in the Doge's Palace."
independence_wave_atx_convene_assembly_of_venice_tt: "Replaces §YThe Lagoon and the Mainland§! with §YThe Assembly of Venice§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_atx_charter_marghera_works: "Charter the Marghera Works"
independence_wave_atx_charter_marghera_works_desc: "Give the industrial port at Marghera a state charter, new berths and a share of the customs revenue."
independence_wave_atx_charter_marghera_works_tt: "Adds §YThe Marghera Works§! and raises §YCapacity§!."
independence_wave_atx_restore_the_arsenale: "Restore the Arsenale"
independence_wave_atx_restore_the_arsenale_desc: "Reopen the old shipyards of the Arsenale to build and refit ships for the new state."
independence_wave_atx_restore_the_arsenale_tt: "Adds §YThe Arsenale§! and raises §YSecurity§!."
independence_wave_atx_lagoon_and_mainland: "The Lagoon and the Mainland"
independence_wave_atx_lagoon_and_mainland_desc: "The old city and the industrial mainland each want the new government to serve them first."
independence_wave_atx_assembly_of_venice: "The Assembly of Venice"
independence_wave_atx_assembly_of_venice_desc: "Members from the lagoon and the mainland sit together in the Doge's Palace."
independence_wave_atx_marghera_works: "The Marghera Works"
independence_wave_atx_marghera_works_desc: "Refineries, chemical plants and shipyards line the canals of Marghera."
independence_wave_atx_arsenale: "The Arsenale"
independence_wave_atx_arsenale_desc: "The old shipyards of Venice build ships again."
independence_wave_atx_assembly_convened: "The Assembly of Venice has been convened"

# Circassia
independence_wave_clx_circassia_category: "The Circassian Khase"
independence_wave_clx_circassia_category_desc: "Circassia governs itself again in Kabarda. Most Circassians have lived in exile since the 1860s, but those who stayed keep the old councils and the Adyghe language."
independence_wave_clx_convene_the_khase: "Convene the Khase"
independence_wave_clx_convene_the_khase_desc: "Call the elders, the village councils and the elected members of Kabarda and the Adyghe districts to sit as the Khase."
independence_wave_clx_convene_the_khase_tt: "Adds §YThe Circassian Khase§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_clx_invite_diaspora_home: "Invite the Diaspora Home"
independence_wave_clx_invite_diaspora_home_desc: "Offer land, citizenship and passage home to the Circassian families of Anatolia, Syria and Transjordan."
independence_wave_clx_invite_diaspora_home_tt: "Replaces §YThe Scattered Nation§! with §YThe Returning Families§!, raises §YLegitimacy§! and §YRecognition§!."
independence_wave_clx_raise_kabardian_horse: "Raise the Kabardian Horse"
independence_wave_clx_raise_kabardian_horse_desc: "Form mounted squadrons from the horse-breeding villages of Kabarda."
independence_wave_clx_raise_kabardian_horse_tt: "Adds §YThe Kabardian Horse§! and raises §YSecurity§!."
independence_wave_clx_scattered_nation: "The Scattered Nation"
independence_wave_clx_scattered_nation_desc: "Most Circassians live abroad, and the homeland has too few people to fill its villages."
independence_wave_clx_circassian_khase: "The Circassian Khase"
independence_wave_clx_circassian_khase_desc: "Elders, village councils and elected members govern together in the Khase."
independence_wave_clx_returning_families: "The Returning Families"
independence_wave_clx_returning_families_desc: "Families from the diaspora settle in the villages their ancestors left."
independence_wave_clx_kabardian_horse: "The Kabardian Horse"
independence_wave_clx_kabardian_horse_desc: "Mounted squadrons of Kabardian horsemen guard the passes and the plain."
independence_wave_clx_khase_convened: "The Khase has been convened"

# Chechnya
independence_wave_cin_chechnya_category: "The Mekhk-Khel"
independence_wave_cin_chechnya_category_desc: "Chechnya governs itself again. The mountain clans keep their own customs and elders' judgement, while Grozny's oil fields belong to the modern world below the hills."
independence_wave_cin_convene_mekhk_khel: "Convene the Mekhk-Khel"
independence_wave_cin_convene_mekhk_khel_desc: "Call the Mekhk-Khel, the council of the nation, with elders from every clan and elected members from the towns."
independence_wave_cin_convene_mekhk_khel_tt: "Replaces §YThe Mountain Feuds§! with §YThe Mekhk-Khel§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_cin_take_over_grozny_oil: "Take Over the Grozny Oil Fields"
independence_wave_cin_take_over_grozny_oil_desc: "Place the oil fields, the pipeline and the refineries of Grozny under a state oil board."
independence_wave_cin_take_over_grozny_oil_tt: "Adds §YThe Grozny Oil Fields§!, raises §YCapacity§! and lowers §YRecognition§!."
independence_wave_cin_raise_mountain_guard: "Raise the Mountain Guard"
independence_wave_cin_raise_mountain_guard_desc: "Form a guard from the mountain villages to hold the gorges and the roads to the plain."
independence_wave_cin_raise_mountain_guard_tt: "Adds §YThe Mountain Guard§! and raises §YSecurity§!."
independence_wave_cin_mountain_feuds: "The Mountain Feuds"
independence_wave_cin_mountain_feuds_desc: "Blood feuds between families and clans divide the mountain villages."
independence_wave_cin_mekhk_khel: "The Mekhk-Khel"
independence_wave_cin_mekhk_khel_desc: "Clan elders and town members sit together in the council of the nation."
independence_wave_cin_grozny_oil_fields: "The Grozny Oil Fields"
independence_wave_cin_grozny_oil_fields_desc: "A state oil board runs the wells, the pipeline and the refineries of Grozny."
independence_wave_cin_mountain_guard: "The Mountain Guard"
independence_wave_cin_mountain_guard_desc: "Village companies hold the gorges and the mountain roads."
independence_wave_cin_mekhk_khel_convened: "The Mekhk-Khel has been convened"

# Dagestan
independence_wave_dag_dagestan_category: "The Dagestan Federation"
independence_wave_dag_dagestan_category_desc: "Dagestan governs itself again as a federation of many peoples. Avars, Dargins, Kumyks, Lezgins, Laks, and smaller communities each keep their own language and law."
independence_wave_dag_seat_federal_assembly: "Seat the Federal Assembly"
independence_wave_dag_seat_federal_assembly_desc: "Seat a federal assembly in which every people of Dagestan sends its own members, and no single people holds a majority."
independence_wave_dag_seat_federal_assembly_tt: "Replaces §YThe Many Peoples§! with §YThe Federal Assembly§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_dag_fix_languages_of_state: "Fix the Languages of State"
independence_wave_dag_fix_languages_of_state_desc: "Give the main languages of Dagestan equal standing in the courts, the schools and the assembly."
independence_wave_dag_fix_languages_of_state_tt: "Adds §YThe Languages of State§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_dag_open_caspian_ports: "Open the Caspian Ports"
independence_wave_dag_open_caspian_ports_desc: "Open Makhachkala and Derbent to Caspian shipping under Dagestan's own harbour dues."
independence_wave_dag_open_caspian_ports_tt: "Adds §YThe Caspian Ports§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_dag_many_peoples: "The Many Peoples"
independence_wave_dag_many_peoples_desc: "Each people of Dagestan fears that another will govern it, and none trusts a single centre."
independence_wave_dag_federal_assembly: "The Federal Assembly"
independence_wave_dag_federal_assembly_desc: "Every people of Dagestan sends its own members, and laws need a majority across them."
independence_wave_dag_languages_of_state: "The Languages of State"
independence_wave_dag_languages_of_state_desc: "The main languages of Dagestan have equal standing in the courts, schools and assembly."
independence_wave_dag_caspian_ports: "The Caspian Ports"
independence_wave_dag_caspian_ports_desc: "Makhachkala and Derbent trade across the Caspian under Dagestan's own dues."
independence_wave_dag_assembly_seated: "The Federal Assembly has been seated"

# Incidents
chaosx.nr6.280.t: "Acqua Alta"
chaosx.nr6.280.d: "An autumn high tide has flooded Saint Mark's Square and the ground floors of half the city. The parishes ask for the lagoon walls to be raised."
chaosx.nr6.280.a: "Fund the lagoon defences"
chaosx.nr6.280.b: "Leave the repairs to the parishes"
chaosx.nr6.281.t: "The Festival on the Lido"
chaosx.nr6.281.d: "The film festival on the Lido draws studios and stars from abroad. Its organisers ask whether to open it to every country or keep it a showcase for Venetian and Italian work."
chaosx.nr6.281.a: "Invite the foreign studios"
chaosx.nr6.281.b: "Keep it a showcase of our own"
chaosx.nr6.282.t: "The Stud Farms of Kabarda"
chaosx.nr6.282.d: "Army buyers from abroad offer high prices for Kabardian horses. The guard wants the best of them kept at home."
chaosx.nr6.282.a: "Keep the horses for the guard"
chaosx.nr6.282.b: "Sell the horses abroad"
chaosx.nr6.283.t: "The Adyghe Schools"
chaosx.nr6.283.d: "Teachers ask for the village schools to teach in Adyghe and Kabardian. Russian-trained officials say Russian keeps the state running."
chaosx.nr6.283.a: "Teach in Adyghe and Kabardian"
chaosx.nr6.283.b: "Keep Russian in the schools"
chaosx.nr6.284.t: "A Blood Feud in the Mountains"
chaosx.nr6.284.d: "A killing at a wedding has started a blood feud between two clans of the upper Argun. The elders offer to reconcile the families; the guard offers to disarm them."
chaosx.nr6.284.a: "Let the elders reconcile the families"
chaosx.nr6.284.b: "Send the guard"
chaosx.nr6.285.t: "The Refinery Workers"
chaosx.nr6.285.d: "The refinery workers of Grozny demand higher pay and safer plants. The oil board warns that a strike would halt the pipeline."
chaosx.nr6.285.a: "Raise the refinery wages"
chaosx.nr6.285.b: "Keep the refineries running"
chaosx.nr6.286.t: "The Winter Pastures"
chaosx.nr6.286.d: "Highland herders drive their flocks down to the lowland plains each winter, as they always have. The Kumyk farmers of the plains want the land for fields."
chaosx.nr6.286.a: "Guarantee the winter pastures"
chaosx.nr6.286.b: "Open the plains to farming"
chaosx.nr6.287.t: "The Silversmiths of Kubachi"
chaosx.nr6.287.d: "The silversmiths of Kubachi, famous across the Caucasus, ask for a craft school and a buyers' market in Makhachkala."
chaosx.nr6.287.a: "Fund the craft school"
chaosx.nr6.287.b: "Tax the silver trade"
