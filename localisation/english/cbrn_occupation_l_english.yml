l_english:
cbrn_occupation_measures_category: "Occupation CBRN Measures"
cbrn_occupation_measures_category_desc: "Set protective or coercive occupation policy, supply civilians under foreign occupation, and answer the forensic consequences of chemical suppression. Nerve-agent use consumes real payload and protective equipment, kills exposed civilians and troops, contaminates the selected state, and leaves evidence and resistance trauma."

cbrn_authorize_coercive_security: "Authorize CBRN Coercive Security"
cbrn_authorize_coercive_security_desc: "Empower occupation commands to adopt CBRN Coercive Security where armored delivery doctrine, a completed nerve-agent program, and advanced protective equipment support it. Authorization permits the occupation law and targeted suppression preparations without releasing an agent by itself."
cbrn_authorize_coercive_security_requirements_tt: "Requires §YMobile Nerve Suppression§!, §YArmored Agent Delivery§!, a completed nerve-agent special project, and advanced military CBRN protection."
cbrn_authorize_coercive_security_effect_tt: "Unlocks §YCBRN Coercive Security§! in the occupation-law interface and permits exact-state nerve-suppression preparations when every policy, payload, protection, unit, forecast, and target condition is met."

cbrn_adopt_protected_occupation: "Authorize Protected Occupation Administration"
cbrn_adopt_protected_occupation_desc: "Establish a defensive occupation framework for contaminated territory. Protected administrations equip garrisons and local services, reduce resistance damage, improve compliance, and prohibit offensive nerve-agent suppression in states using the policy."
cbrn_adopt_protected_occupation_requirements_tt: "Requires §YBasic Service Respirators§! and advanced military CBRN protection."
cbrn_adopt_protected_occupation_effect_tt: "Unlocks §YProtected Occupation Administration§! in the occupation-law interface."

cbrn_nerve_suppression_sarin: "Prepare Sarin Suppression in [FROM.GetName]"
cbrn_nerve_suppression_sarin_desc: "Prepare a controlled Sarin release against resistance networks in [FROM.GetName]. The operation uses the shared chemical exposure process: payload is consumed first, protection and exact conditions shape exposure, and the result records disruption, deaths, contamination, medical saturation, evidence, attribution, Condemnation, trauma, and delayed backlash."
cbrn_nerve_suppression_soman: "Prepare Soman Suppression in [FROM.GetName]"
cbrn_nerve_suppression_soman_desc: "Prepare a persistent Soman release against resistance networks in [FROM.GetName]. Soman's longer hazard profile can intensify contamination and aftermath. Delivery eligibility and preparation standards remain as strict as for Sarin."
cbrn_nerve_suppression_operation_cost: "Operation stock: [?constant:cbrn_payload_route_cost.nerve_suppression|.0] nerve-agent lot, [?constant:cbrn_occupation_cost.gas_masks|.0] gas masks, [?constant:cbrn_occupation_cost.decontamination_equipment|.0] decontamination sets, [?constant:cbrn_occupation_cost.cbrn_instruments|.0] CBRN instruments, [?constant:cbrn_occupation_cost.support_equipment|.0] support equipment, [?constant:cbrn_occupation_cost.motorized_equipment|.0] trucks, [?constant:cbrn_occupation_cost.command_power|.0] Command Power"
cbrn_nerve_suppression_operation_cost_blocked: "§RThe complete payload, protection, support, transport, or Command Power package is unavailable§!"
cbrn_nerve_suppression_operation_cost_tooltip: "Required stock is consumed only when the release passes its final exact-state check. Current reserves: [?ROOT.num_equipment@gas_mask_equipment|.0] gas masks, [?ROOT.num_equipment@decontamination_equipment|.0] decontamination sets, [?ROOT.num_equipment@cbrn_instrument_equipment|.0] CBRN instruments, [?ROOT.num_equipment@support_equipment|.0] support equipment, and [?ROOT.num_equipment@motorized_equipment|.0] trucks."
cbrn_nerve_suppression_sarin_requirements_tt: "Requires §YCBRN Coercive Security§! in [FROM.GetName], Resistance above [?constant:cbrn_occupation_target.minimum_resistance|.0], a ready Nerve Suppression Detachment physically present, no allied force at risk, a clear state cooldown, Sarin technology and project completion, [?constant:cbrn_occupation_target.minimum_chemical_readiness|.0] Chemical Readiness, advanced protection, extreme-use policy, a verified hold forecast, and complete target-specific weather, terrain, density, command, evidence-control, and friendly-risk inputs. Available Sarin lots: [?ROOT.num_equipment@sarin_agent_lot_1|.0]."
cbrn_nerve_suppression_soman_requirements_tt: "Requires §YCBRN Coercive Security§! in [FROM.GetName], Resistance above [?constant:cbrn_occupation_target.minimum_resistance|.0], a ready Nerve Suppression Detachment physically present, no allied force at risk, a clear state cooldown, Soman technology and project completion, [?constant:cbrn_occupation_target.minimum_chemical_readiness|.0] Chemical Readiness, advanced protection, extreme-use policy, a verified hold forecast, and complete target-specific weather, terrain, density, command, evidence-control, and friendly-risk inputs. Available Soman lots: [?ROOT.num_equipment@soman_agent_lot_1|.0]."
cbrn_nerve_suppression_preparation_tt: "Begins a [?constant:cbrn_occupation_timing.operation_preparation_days|.0]-day exact-state preparation. Only one suppression preparation can reserve the state at a time. Target control, occupation law, detachment strength, payload, protection, policy, forecast, and condition data are rechecked before release."
cbrn_nerve_suppression_sarin_effect_tt: "On a valid release, consumes the complete Sarin operation package and sharply reduces Resistance for [?constant:cbrn_occupation_timing.active_days|.0] days. The expected envelope exposes roughly §Y2–10%§! of the state population, produces §Y5–25 contamination§!, and creates §Y10–35 base chemical Condemnation§! when attributed, plus bounded atrocity or coverup context. Protection, medical response, exact conditions, repetition, and doctrine determine the realized deaths and political impact. Evidence, attribution, deaths, contamination, trauma, and use history remain recorded."
cbrn_nerve_suppression_soman_effect_tt: "On a valid release, consumes the complete Soman operation package and sharply reduces Resistance for [?constant:cbrn_occupation_timing.active_days|.0] days. The expected envelope exposes roughly §Y2–10%§! of the state population, produces §Y5–25 contamination§!, and creates §Y10–35 base chemical Condemnation§! when attributed, plus bounded atrocity or coverup context. Soman's persistence can worsen the realized aftermath. Doctrine can reduce Condemnation without erasing evidence, attribution, deaths, contamination, trauma, or use history."

cbrn_deploy_protective_aid: "Deploy Protective Aid to [FROM.GetName]"
cbrn_deploy_protective_aid_desc: "Move respirator crates from [ROOT.GetNameDef]'s real reserve into the civilian ledger of [FROM.GetName], despite foreign occupation. Population, infrastructure, occupation conditions, fitting quality, filter condition, and the supplier's civil-defence institutions determine the stock consumed and protection delivered."
cbrn_deploy_protective_aid_requirements_tt: "Requires an established CBRN protection program, respirators in reserve, [?constant:cbrn_occupation_decision_cost.protective_aid_factories|.0] available Civilian Factories, and a foreign-occupied non-core state below its occupied-population protection target. Current respirator reserve: [?ROOT.num_equipment@gas_mask_equipment|.0]."
cbrn_deploy_protective_aid_begin_tt: "Reserves [?constant:cbrn_occupation_decision_cost.protective_aid_factories|.0] Civilian Factories for a [?constant:cbrn_occupation_timing.protective_aid_days|.0]-day protected delivery."
cbrn_deploy_protective_aid_complete_tt: "Consumes the oldest available respirator models from [ROOT.GetNameDef]'s stock and raises effective civilian protection in [FROM.GetName] toward [?constant:cbrn_protection_program_effect.occupied_distribution_target_percent|.0]%. The exact consumed and delivered amounts scale with the population and local delivery conditions. No equipment is created."

cbrn_seal_state: "Seal [FROM.GetName]"
cbrn_seal_state_desc: "Close roads, hospitals, archives, and contaminated districts to outside observation. A seal can suppress short-term evidence spread. It also disrupts production, raises Resistance, creates hidden coverup liability, and leaves a record that can be exposed by inspection or liberation."
cbrn_seal_state_requirements_tt: "Requires control of [FROM.GetName], responsibility for its exact nerve-suppression record, and no prior concealment, admission, inspection, or liberation discovery."
cbrn_seal_state_effect_tt: "Reduces the exact operation record's evidence by up to [?constant:cbrn_occupation_coverup.seal_evidence_suppression|.0], raises Resistance by [?constant:cbrn_occupation_coverup.coverup_pressure_seal|.0], and for [?constant:cbrn_occupation_timing.sealed_state_days|.0] days reduces local factories by [?constant:cbrn_occupation_state_modifier.sealed_local_factories|%0] and resources by [?constant:cbrn_occupation_state_modifier.sealed_local_resources|%0]. Hidden coverup Condemnation and a permanent concealment record remain discoverable."

cbrn_destroy_contaminated_records: "Destroy the Contaminated Records of [FROM.GetName]"
cbrn_destroy_contaminated_records_desc: "Burn orders, hospital lists, transport manifests, and sampling records tied to the exact nerve-suppression action. The immediate evidence reduction is larger than a seal, and destroyed records create stronger resistance and major hidden coverup liability."
cbrn_destroy_contaminated_records_requirements_tt: "Requires control of [FROM.GetName], responsibility for its exact nerve-suppression record, and no prior concealment, admission, inspection, or liberation discovery."
cbrn_destroy_contaminated_records_effect_tt: "Reduces the exact operation record's evidence by up to [?constant:cbrn_occupation_coverup.destroy_records_evidence_suppression|.0], raises Resistance by [?constant:cbrn_occupation_coverup.coverup_pressure_destroy_records|.0], and records major hidden coverup liability. Later inspection or liberation can expose that liability and advance the same chemical record. Deaths, contamination, trauma, attribution, and use history are never removed."

cbrn_admit_accidental_release: "Admit an Accidental Release in [FROM.GetName]"
cbrn_admit_accidental_release_desc: "Publicly acknowledge the exact toxic-release record, describe the action as an accident, and open medical access. Admission confirms responsibility without converting deliberate-use history into non-use or erasing the state's casualties and contamination."
cbrn_admit_accidental_release_requirements_tt: "Requires responsibility for an undisclosed exact nerve-suppression record in [FROM.GetName]. Admission remains possible after an attempted seal or record destruction, unless inspection or liberation has already resolved the record."
cbrn_admit_accidental_release_effect_tt: "Advances the exact chemical record to confirmed attribution, exposes its hidden chemical liability, adds [?constant:cbrn_occupation_condemnation.admission_chemical_context_gain|.0] public chemical context before doctrine mitigation, exposes any self-disclosed coverup, ends an active seal, clears coverup pressure, and records bounded atrocity context when civilian targeting is confirmed. Evidence, deaths, contamination, trauma, and use history remain."

cbrn_permit_inspection: "Permit Inspection in [FROM.GetName]"
cbrn_permit_inspection_desc: "Allow inspectors and medical teams to examine [FROM.GetName], its casualties, samples, treatment records, and contaminated sites. Credible inspection can reduce long-term suspicion, advance the exact operation record, and expose concealment and stockpile restrictions."
cbrn_permit_inspection_requirements_tt: "Requires control of [FROM.GetName], responsibility for its exact nerve-suppression record, and no completed inspection or liberation discovery."
cbrn_permit_inspection_effect_tt: "Adds [?constant:cbrn_occupation_coverup.inspection_evidence_gain|.0] evidence to the exact chemical record, exposes discoverable coverup liability, ends an active seal, activates the national inspection framework, clears coverup pressure, and records bounded atrocity context if attribution becomes confirmed. No historical record is erased."

cbrn_nerve_suppression_active_state: "Active Nerve Suppression"
cbrn_nerve_suppression_active_state_desc: "Toxic barriers, sealed patrols, and protected detachments have broken resistance activity for a short period. Garrison manpower and immediate damage fall, and local output, movement, and supply suffer."
cbrn_nerve_suppression_trauma_state: "Nerve-Suppression Trauma"
cbrn_nerve_suppression_trauma_state_desc: "Deaths, contamination, fear, and remembered coercion sustain resistance growth, obstruct compliance, and strengthen future discovery and liberation reactions. The memory decays slowly and is never removed by doctrine."
cbrn_occupation_backlash_state: "Organized Occupation Backlash"
cbrn_occupation_backlash_state_desc: "Resistance networks have reorganized after the initial toxic shock. Sabotage, recruitment, garrison losses, and local disruption rise, with severe actions capable of spreading pressure into a neighboring occupied state."
cbrn_occupation_state_sealed_modifier: "Sealed Contaminated Districts"
cbrn_occupation_state_sealed_modifier_desc: "Roadblocks, quarantined hospitals, closed archives, and restricted industrial movement suppress observation at the cost of local output and rising resistance organization."

condemnation.context.nerve_suppression: "Nerve Suppression in Occupied Territory"
