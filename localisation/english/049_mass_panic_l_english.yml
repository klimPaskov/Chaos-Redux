l_english:
chaosx.nr49.1.t: "Mass Panic"

chaosx.nr49.2.t: "Mass Panic"
chaosx.nr49.2.d: "Our country and much of the world are gripped by panic after scientists predict that colliding galaxies will devastate the planet. Industries are slowing as citizens abandon work and shelter in fear. Research teams are testing the prediction."
chaosx.nr49.2.a: "Oh dear"

chaosx.nr49.3.t: "Mass panic subsides!"
chaosx.nr49.3.d: "Government broadcasts and emergency crews have calmed the panic. Shops are reopening, citizens are returning to work, and communities are repairing the damage."
chaosx.nr49.3.a: "A relief!"

chaosx.nr49.4.t: "Mass Panic Critical!"
chaosx.nr49.4.d: "Mass Panic has reached a critical level. Unless the government acts, fear will paralyze the nation."
chaosx.nr49.4.a: "This is still fixable!"
