l_english:
cbrn_battlefield_cycle_agent: "Select Chemical Agent"
cbrn_battlefield_cycle_agent_desc: "Choose the agent prepared for the next battlefield operation. The selected agent must be researched and authorized before release."
cbrn_battlefield_cycle_agent_tt: "Cycle the selected agent. Current selection: [This.GetCbrnBattlefieldSelectedAgent]."
cbrn_battlefield_agent_chlorine: "Chlorine"
cbrn_battlefield_agent_phosgene: "Phosgene"
cbrn_battlefield_agent_mustard: "Mustard agent"
cbrn_battlefield_agent_lewisite: "Lewisite"
cbrn_battlefield_agent_tabun: "Tabun"
cbrn_battlefield_agent_sarin: "Sarin"
cbrn_battlefield_agent_soman: "Soman"
cbrn_battlefield_agent_malodor: "Malodor agent"
cbrn_battlefield_agent_behavioral: "Behavioral agent"
cbrn_battlefield_agent_unselected: "No agent selected"
cbrn_battlefield_selected_agent_label: "Selected agent"
cbrn_battlefield_cylinder_release: "Release Gas Cylinders"
cbrn_battlefield_cylinder_release_desc: "Commit an Army Headquarters order to release chemical cylinders into a selected enemy state after preparation."
cbrn_battlefield_cylinder_target_tt: "Target a selected enemy state with a supply node or enemy divisions."
cbrn_battlefield_cylinder_requirements_tt: "Requires an active Army Headquarters chemical operation plan, operational readiness, the selected agent, gas masks, decontamination equipment, instruments, support equipment, payload, Command Power, and a valid battlefield-use policy. Shortages reduce release efficiency and increase friendly risk."
cbrn_battlefield_cylinder_begin_tt: "Commit the cylinder release to the selected state. Payload, route equipment, Command Power, and Chemical Readiness are spent when the order is accepted."
cbrn_battlefield_projector_barrage: "Fire Projector Barrage"
cbrn_battlefield_projector_barrage_desc: "Commit a Livens projector barrage against a selected enemy state with a city, fortification, supply node, or prepared concentration of forces."
cbrn_battlefield_projector_target_tt: "Target a selected enemy state with a city, fortification, supply node, or enemy divisions."
cbrn_battlefield_projector_requirements_tt: "Requires an active Army Headquarters chemical operation plan, Livens projector technology, projector equipment, operational readiness, the selected agent, gas masks, decontamination equipment, instruments, support equipment, payload, Command Power, and a valid battlefield-use policy."
cbrn_battlefield_projector_begin_tt: "Commit the projector barrage to the selected state. Payload, projector equipment, route stores, Command Power, and Chemical Readiness are spent when the order is accepted."
cbrn_battlefield_artillery_fire_plan: "Execute Chemical Artillery Fire Plan"
cbrn_battlefield_artillery_fire_plan_desc: "Commit a chemical artillery fire plan against enemy divisions in a selected state. The shell-filling profile determines the authorized agent for this route."
cbrn_battlefield_artillery_target_tt: "Target a selected enemy state containing enemy divisions."
cbrn_battlefield_artillery_requirements_tt: "Requires chemical artillery shell technology, a matching researched shell-filling agent, an active Army Headquarters chemical operation plan, operational readiness, gas masks, decontamination equipment, instruments, support equipment, payload, Command Power, and a valid battlefield-use policy."
cbrn_battlefield_artillery_begin_tt: "Commit the chemical artillery fire plan to the selected state. Payload, artillery stores, route equipment, Command Power, and Chemical Readiness are spent when the order is accepted."
cbrn_battlefield_armored_delivery: "Advance Armored Chemical Detachment"
cbrn_battlefield_armored_delivery_desc: "Commit a sealed armored chemical-delivery detachment against enemy divisions in a selected urban, industrial, or supply-connected state."
cbrn_battlefield_armored_target_tt: "Target a selected enemy state containing enemy divisions and an urban or supply-connected objective."
cbrn_battlefield_armored_requirements_tt: "Requires sealed tank crews, medium armored chassis, motorized equipment, fuel, an active Army Headquarters chemical operation plan, operational readiness, gas masks, decontamination equipment, instruments, support equipment, payload, Command Power, and a valid battlefield-use policy."
cbrn_battlefield_armored_begin_tt: "Commit the armored chemical delivery to the selected state. Payload, armored stores, fuel, route equipment, Command Power, and Chemical Readiness are spent when the order is accepted."
cbrn_battlefield_operation_cancelled_tt: "The operation was canceled because its command, target, war, or policy context was no longer valid. Committed payload and route stores are not restored."
cbrn_battlefield_resolution_success_tt: "The chemical operation accounted for protection, disruption, deaths, contamination, medical saturation, evidence, attribution, Condemnation, and cleanup."
cbrn_battlefield_resolution_rejected_tt: "The chemical operation could not resolve because its target, policy, protection, payload, or battlefield conditions were no longer valid. The release was not redirected to another state."
