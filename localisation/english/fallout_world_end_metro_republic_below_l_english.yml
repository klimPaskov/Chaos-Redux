chaosx.fallout.614.t: "The Metro Republic Below"
chaosx.fallout.614.opening.d: "The capital's lower districts have survived behind sealed gates, ration ledgers, and a ventilation system that cannot carry every ward at once. Surface clerks, tunnel delegates, soldiers, and families have arrived at the same control room with different ideas about what the republic still means."
chaosx.fallout.614.a: "Open a surface council"
chaosx.fallout.614.a.tt: "Spend Food 5, Scrap 3, and Recognition 3. After 35 days, a public council will be graded against the shelter's frozen capacity and the country's Cohesion."
chaosx.fallout.614.b: "Keep the wards autonomous"
chaosx.fallout.614.b.tt: "Spend Food 4, Power 4, Scrap 2, and Recognition 2. After 35 days, ward autonomy will be graded against shelter, Power, and the condition of the host state."
chaosx.fallout.614.c: "Integrate the military corridor"
chaosx.fallout.614.c.tt: "Spend Food 4, Fuel 2, Support Equipment 3, and Command Power 12. After 35 days, corridor security will be graded. Success may add War Support while reducing Cohesion by one."
chaosx.fallout.614.d: "Evacuate the lower districts"
chaosx.fallout.614.d.tt: "Spend Food 6, Medicine 3, Fuel 3, and Recognition 1. After 35 days, the evacuation will be graded against shelter, Exposure, and Disease Pressure."
chaosx.fallout.616.t: "A Republic in Separate Levels"
chaosx.fallout.616.surface.success.d: "The surface council has reopened a guarded hatch and published a district register. Delegates still argue, but the arguments now end in a ration schedule instead of a locked door."
chaosx.fallout.616.surface.partial.d: "The council has a chair, a register, and a public queue. The lower wards accept the arrangement for now, though every missing repair part is already being counted as a political debt."
chaosx.fallout.616.surface.failure.d: "The surface council broke over access lists and repair claims. The hatch remains watched, the districts mistrust the register, and the ventilation crews have reduced their surface shifts."
chaosx.fallout.616.tunnel.success.d: "The ward delegates kept local control of rations and vents while accepting a common emergency ledger. The lower levels have not become independent, but their authority is now recognized."
chaosx.fallout.616.tunnel.partial.d: "The ward compact holds together through personal promises and hand-marked schedules. It is enough to keep the lights and air moving, though no district believes the arrangement is permanent."
chaosx.fallout.616.tunnel.failure.d: "The autonomous wards stopped sharing their registers. Ventilation crews now protect their own levels first, and the common stores are shrinking behind a new set of internal doors."
chaosx.fallout.616.military.success.d: "The military corridor is secure enough to move filters and food between levels. A civilian inspection board has kept the guards from taking the republic's last public office, but the new order is less gentle than the old one."
chaosx.fallout.616.military.partial.d: "The guards have restored a route through the lower stations and accepted a short inspection schedule. The republic has gained order at the price of a quieter and narrower civic life."
chaosx.fallout.616.military.failure.d: "The corridor command seized the stores before the inspection board could meet. A ward resisted, a ventilation crew was caught between orders, and the republic has recorded the first deaths of its crackdown."
chaosx.fallout.616.evacuation.success.d: "The lower wards have moved toward safer levels in measured groups. Clinic workers, families, and repair crews made the journey without turning the stairwells into a panic, and the empty districts remain marked for later salvage."
chaosx.fallout.616.evacuation.partial.d: "The evacuation moved the most exposed families and left the rest behind. The safer levels are crowded, but a workable list of names and needs has survived the transfer."
chaosx.fallout.616.evacuation.failure.d: "The lower-district evacuation ran out of filters and orderly transport. Some families returned to sealed rooms, while the republic records a loss that the next register cannot quietly erase."
chaosx.fallout.616.a: "Review the district result"
chaosx.fallout.616.a.tt: "Apply the authenticated 35-day result and continue the Metro Republic transaction toward its delayed district review."
chaosx.fallout.618.t: "The Metro Republic's First Review"
chaosx.fallout.618.success.d: "Months later, the district review finds a republic that can still move food, air, and people through the same institution. The metro has not forgotten its divisions, but its levels now answer to a shared memory."
chaosx.fallout.618.partial.d: "The district review preserves the shelter and its records, though the republic remains a contested arrangement. Its next crisis will test whether the council, wards, guards, or evacuation office has the stronger claim."
chaosx.fallout.618.failure.d: "The district review finds separate corridors, rival registers, and too little trust to call the shelter one republic. The lower levels remain inhabited, but the common authority has failed."
chaosx.fallout.618.a: "Record the district review"
chaosx.fallout.618.a.tt: "Apply the authenticated callback outcome and close the Metro Republic transaction without creating a recurring decision or a new country tag."
