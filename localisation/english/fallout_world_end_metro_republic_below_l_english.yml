fallout.event_log.metro_republic_below.tunnel_failure: "The autonomous wards stopped sharing their registers."
fallout.event_log.metro_republic_below.military_success: "The military corridor moved supplies while a civilian board retained inspection rights."
fallout.event_log.metro_republic_below.military_partial: "The guards restored a route while civic life narrowed."
fallout.event_log.metro_republic_below.military_failure: "A corridor crackdown seized stores and caused recorded deaths."
