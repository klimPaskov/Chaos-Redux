CBRN_BALANCED_CHAOS_WARFARE_DESC: "Protected formations, payload stores and a CBRN Headquarters support four tracks: assault, armored delivery, fire support and integrated command. Chemical release requires policy authority, available payloads and a prepared operation. Unprotected troops and civilians bear the consequences."
CBRN_BALANCED_HAZARD_ASSAULT_DESC: "Protection companies, chemical reconnaissance, field medical support, biosecurity assault and Chaos Battalions train for protected advances. Reliable protection supports the first formations; dedicated assault training strengthens the battalion when its equipment and theater requirements are met."
CBRN_BALANCED_TOXIC_ARMOR_DESC: "Light, medium and heavy armored delivery detachments gain breakthrough and sealed-crew reliability. Their specialist vehicles, training and supply remain necessary for hazardous approaches. Release requires the appropriate stock, policy and operation."
CBRN_BALANCED_CONTAMINANT_FIRE_DESC: "Projector batteries, chemical ammunition trains and field medical companies sustain protected fire plans. Fire control strengthens conventional artillery, while projector crews gain specialist organization. Delivery still needs equipment, maintained payload stores and an authorized operation."
CBRN_BALANCED_INTEGRATED_COMMAND_DESC: "The three CBRN Headquarters sections train alongside field protection, chemical reconnaissance and medical companies. Coordinated reconnaissance supports the first operations; deeper mastery develops intelligence, reinforcement, cleanup and battlefield care."
