CBRN_BALANCED_CHAOS_WARFARE_DESC: "Protected formations, accountable payload stores, and a CBRN Headquarters support four tracks: assault, armored delivery, fire support, and integrated command. Chemical release requires policy authority, available payloads, and a paid operation that records its consequences."
CBRN_BALANCED_HAZARD_ASSAULT_DESC: "Mask companies and assault battalions train for contaminated approaches. Their field exercises consume protective equipment and Army Experience, while dedicated assault formations gain the strongest breakthrough benefits. Conventional infantry retain their established doctrine training."
CBRN_BALANCED_TOXIC_ARMOR_DESC: "Sealed crews and armored delivery detachments carry protected formations through hazardous approaches. Specialized vehicles demand equipment and supply, while their mastery improves seals, movement, and delivery coordination. Release still requires the appropriate stock, policy, and operation."
CBRN_BALANCED_CONTAMINANT_FIRE_DESC: "Projector batteries and chemical ammunition trains coordinate protected fire plans. Conventional artillery receives a limited fire-control benefit; the larger gains require dedicated CBRN equipment, maintained payload stores, and a paid delivery action."
CBRN_BALANCED_INTEGRATED_COMMAND_DESC: "The operations, protective logistics, and medical sections of CBRN Headquarters coordinate reconnaissance, decontamination, and battlefield care. They join the four tracks and qualify exact-state operations. Their planning and reinforcement benefits depend on an established command network."
