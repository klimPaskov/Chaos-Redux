l_english:
chaosx.nr31.1.t: "Terrorists"

chaosx.nr31.2.t: "Terrorist attacks!"
chaosx.nr31.2.d: "A wave of violent terrorist attacks has swept through our nation, targeting civilians, government institutions, and security forces. The attacks have disrupted daily life and sent citizens into hiding as police search for the perpetrators."
chaosx.nr31.2.a: "Protect the population."

chaosx.news.36.t: "Violent Terrorist Attacks"
chaosx.news.36.d: "A spate of bombings and shootings is tearing through [From.GetName]. Security forces are struggling to contain the attacks, and civilians are demanding action as the violence spreads."
chaosx.news.36.a: "The attacks are horrific."
