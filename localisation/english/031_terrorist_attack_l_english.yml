# National focuses
random_terror_founding_crisis: "Founding Crisis"
random_terror_founding_crisis_desc: "A shattered chain of command leaves the enclave fighting for territory, supplies, and a reason to endure."
random_terror_hold_the_enclave: "Hold the Enclave"
random_terror_hold_the_enclave_desc: "Defend the first refuge long enough to turn a temporary foothold into a functioning base."
random_terror_restore_supply: "Restore Supply"
random_terror_restore_supply_desc: "Recover stores and reopen local routes before hunger and ammunition shortages break the command."
random_terror_secure_command_center: "Secure the Command Center"
random_terror_secure_command_center_desc: "Concentrate communications and staff in a headquarters that can direct the surrounding territory."
random_terror_define_leadership: "Define the Leadership"
random_terror_define_leadership_desc: "Resolve who gives orders before rival commanders divide the enclave."
random_terror_restore_the_workshops: "Restore the Workshops"
random_terror_restore_the_workshops_desc: "Put captured tools and skilled labor back to work repairing the movement's equipment."
random_terror_secure_forward_depots: "Secure Forward Depots"
random_terror_secure_forward_depots_desc: "Disperse protected stores along the front to keep isolated formations supplied."
random_terror_fortify_the_headquarters: "Fortify the Headquarters"
random_terror_fortify_the_headquarters_desc: "Turn the command center into a defended position able to survive a direct assault."
random_terror_relocate_the_command: "Relocate the Command"
random_terror_relocate_the_command_desc: "Move the headquarters away from exposed routes before the enemy can encircle it."
random_terror_stabilize_the_capital: "Stabilize the Capital"
random_terror_stabilize_the_capital_desc: "Restore order and essential services in the occupied capital before resistance spreads."
random_terror_shadow_network_directorate: "Shadow Network Directorate"
random_terror_shadow_network_directorate_desc: "Place couriers, cells, and safehouses under a concealed council built to survive decapitation."
random_terror_seal_the_inner_circle: "Seal the Inner Circle"
random_terror_seal_the_inner_circle_desc: "Restrict sensitive plans to trusted members and close the easiest paths for infiltration."
random_terror_distribute_the_cells: "Distribute the Cells"
random_terror_distribute_the_cells_desc: "Give local cells enough independence to continue operating when contact is lost."
random_terror_layered_safehouses: "Layered Safehouses"
random_terror_layered_safehouses_desc: "Build overlapping shelters and fallback routes so one discovery does not expose the network."
random_terror_intelligence_by_whisper: "Intelligence by Whisper"
random_terror_intelligence_by_whisper_desc: "Turn local contacts, rumor, and discreet observation into an early warning system."
random_terror_hidden_radio_net: "Hidden Radio Net"
random_terror_hidden_radio_net_desc: "Link scattered commands through concealed transmitters and disciplined schedules."
random_terror_foreign_cell_channels: "Foreign Cell Channels"
random_terror_foreign_cell_channels_desc: "Establish secure couriers and signals with aligned cells beyond the border."
random_terror_foreign_cell_support: "Support the Foreign Cells"
random_terror_foreign_cell_support_desc: "Send equipment and organizers abroad to preserve the network's distant branches."
random_terror_protect_the_council: "Protect the Council"
random_terror_protect_the_council_desc: "Separate the movement's leadership from exposed operations and known meeting places."
random_terror_continuity_protocol: "Continuity Protocol"
random_terror_continuity_protocol_desc: "Prepare successors, sealed orders, and fallback headquarters before a leadership loss."
random_terror_relocate_the_network: "Relocate the Network"
random_terror_relocate_the_network_desc: "Shift personnel and stores away from compromised centers without breaking contact between cells."
random_terror_protect_the_route: "Protect the Route"
random_terror_protect_the_route_desc: "Guard the couriers and concealed crossings that bind the distributed network together."
random_terror_field_command_board: "Field Command Board"
random_terror_field_command_board_desc: "Give operational authority to commanders who can unite scattered armed formations."
random_terror_appoint_the_directorate: "Appoint the Directorate"
random_terror_appoint_the_directorate_desc: "Create a permanent military directorate with clear responsibility for planning and supply."
random_terror_command_the_front: "Command the Front"
random_terror_command_the_front_desc: "Coordinate neighboring sectors under one plan instead of separate local battles."
random_terror_capture_regular_formations: "Capture Regular Formations"
random_terror_capture_regular_formations_desc: "Force isolated regular units to surrender with their equipment and organization intact."
random_terror_standardize_captured_formations: "Standardize Captured Formations"
random_terror_standardize_captured_formations_desc: "Replace incompatible tables and procedures with a common structure across the armed force."
random_terror_field_radio_discipline: "Field Radio Discipline"
random_terror_field_radio_discipline_desc: "Impose secure radio practice so operational orders reach units without exposing headquarters."
random_terror_arm_the_territorial_brigades: "Arm the Territorial Brigades"
random_terror_arm_the_territorial_brigades_desc: "Issue captured weapons to locally raised brigades charged with holding the enclave."
random_terror_harden_the_defensive_line: "Harden the Defensive Line"
random_terror_harden_the_defensive_line_desc: "Prepare fieldworks and reserves along the approaches most likely to face attack."
random_terror_prepare_the_parent_offensive: "Prepare the Parent Offensive"
random_terror_prepare_the_parent_offensive_desc: "Gather fuel, ammunition, and intelligence for a deliberate strike against the parent government."
random_terror_command_the_armed_movement: "Command the Armed Movement"
random_terror_command_the_armed_movement_desc: "Bind the movement's brigades to a unified campaign and a single operational command."
random_terror_expand_the_force: "Expand the Force"
random_terror_expand_the_force_desc: "Raise additional formations from the population and equip them for sustained fighting."
random_terror_unify_the_brigades: "Unify the Brigades"
random_terror_unify_the_brigades_desc: "Merge local armed groups into a common order of battle with shared standards."
random_terror_convene_the_cadre: "Convene the Cadre"
random_terror_convene_the_cadre_desc: "Gather political organizers to settle doctrine, leadership, and the movement's public program."
random_terror_establish_political_offices: "Establish Political Offices"
random_terror_establish_political_offices_desc: "Create local offices able to recruit, administer, and enforce the cadre's decisions."
random_terror_codify_the_doctrine: "Codify the Doctrine"
random_terror_codify_the_doctrine_desc: "Turn competing slogans into a formal program that cadres can teach and enforce."
random_terror_disciplined_ranks: "Disciplined Ranks"
random_terror_disciplined_ranks_desc: "Make cadres answerable for recruitment, conduct, and obedience within their formations."
random_terror_authority_through_service: "Authority Through Service"
random_terror_authority_through_service_desc: "Earn compliance by protecting communities and maintaining the services the old state abandoned."
random_terror_claim_revolutionary_authority: "Claim Revolutionary Authority"
random_terror_claim_revolutionary_authority_desc: "Present the cadre as the sole political authority over the territory it controls."
random_terror_establish_forced_rule: "Establish Forced Rule"
random_terror_establish_forced_rule_desc: "Use surveillance and coercion to impose obedience where consent has failed."
random_terror_purge_the_hardliners: "Purge the Hardliners"
random_terror_purge_the_hardliners_desc: "Remove commanders whose violence threatens the cadre's control and public support."
random_terror_enthrone_the_ideological_state: "Enthrone the Ideological State"
random_terror_enthrone_the_ideological_state_desc: "Place every military and civil institution under the cadre's doctrine."
random_terror_smuggling_and_external_supply: "Smuggling and External Supply"
random_terror_smuggling_and_external_supply_desc: "Build concealed foreign routes that can carry equipment past guarded borders."
random_terror_open_the_border_corridor: "Open the Border Corridor"
random_terror_open_the_border_corridor_desc: "Secure a crossing and the local contacts needed to move supplies through it."
random_terror_secure_truck_convoys: "Secure Truck Convoys"
random_terror_secure_truck_convoys_desc: "Protect drivers, fuel, and vehicles on the roads feeding the enclave."
random_terror_salvage_the_rail_spur: "Salvage the Rail Spur"
random_terror_salvage_the_rail_spur_desc: "Repair a captured rail connection and recover rolling stock from the fighting."
random_terror_coerced_extraction: "Coerced Extraction"
random_terror_coerced_extraction_desc: "Seize food, fuel, and labor from controlled communities regardless of the political cost."
random_terror_control_the_market: "Control the Market"
random_terror_control_the_market_desc: "Bring trade and rationing under command supervision to direct scarce goods toward the war effort."
random_terror_secure_the_fuel_stores: "Secure the Fuel Stores"
random_terror_secure_the_fuel_stores_desc: "Guard captured reserves and organize distribution to vehicles and generators."
random_terror_administer_the_lost_state: "Administer the Lost State"
random_terror_administer_the_lost_state_desc: "Extend routine government into captured territory before armed factions fill the vacuum."
random_terror_build_the_regional_state: "Build the Regional State"
random_terror_build_the_regional_state_desc: "Join local offices into a territorial administration with a common budget and command."
random_terror_foreign_sponsorship: "Foreign Sponsorship"
random_terror_foreign_sponsorship_desc: "Seek a foreign patron willing to exchange equipment and advice for influence."
random_terror_identify_the_sponsor: "Identify the Sponsor"
random_terror_identify_the_sponsor_desc: "Determine which outside power can supply the enclave without immediately controlling it."
random_terror_align_with_the_patron: "Align with the Patron"
random_terror_align_with_the_patron_desc: "Adapt strategy and diplomacy to secure continued support from the chosen sponsor."
random_terror_patron_development: "Patron Development"
random_terror_patron_development_desc: "Use foreign advisers and material to expand infrastructure and administrative capacity."
random_terror_recruit_from_the_enclave: "Recruit from the Enclave"
random_terror_recruit_from_the_enclave_desc: "Draw volunteers and conscripts from the territory already under command."
random_terror_mobile_cell_columns: "Mobile Cell Columns"
random_terror_mobile_cell_columns_desc: "Organize light columns able to disperse, regroup, and strike beyond fixed lines."
random_terror_convert_the_militia: "Convert the Militia"
random_terror_convert_the_militia_desc: "Train irregular guards as territorial units capable of sustained combat."
random_terror_foreign_fighters: "Foreign Fighters"
random_terror_foreign_fighters_desc: "Bring experienced foreign volunteers through the network and place them under local command."
random_terror_map_the_network: "Map the Network"
random_terror_map_the_network_desc: "Identify every aligned cell, safe haven, corridor, and rival command within reach."
random_terror_protect_safe_havens: "Protect Safe Havens"
random_terror_protect_safe_havens_desc: "Defend the settlements and concealed sites that shelter personnel between operations."
random_terror_bargain_with_rivals: "Bargain with Rivals"
random_terror_bargain_with_rivals_desc: "Trade access, supplies, and recognition to prevent a destructive struggle between enclaves."
random_terror_merge_the_enclaves: "Merge the Enclaves"
random_terror_merge_the_enclaves_desc: "Unite compatible territorial commands under shared institutions and military planning."
random_terror_reconcile_the_factions: "Reconcile the Factions"
random_terror_reconcile_the_factions_desc: "Settle leadership and resource disputes before they divide the wider movement."
random_terror_event_31_faction_route: "A Common Front"
random_terror_event_31_faction_route_desc: "Turn a network of enclaves into a faction able to coordinate war and diplomacy."
random_terror_secure_recognition: "Secure Recognition"
random_terror_secure_recognition_desc: "Win external acceptance for the enclave's borders and governing authority."
random_terror_form_the_confederation: "Form the Confederation"
random_terror_form_the_confederation_desc: "Bind participating enclaves through a negotiated division of civil and military power."
random_terror_absorb_compatible_enclave: "Absorb a Compatible Enclave"
random_terror_absorb_compatible_enclave_desc: "Integrate a weaker aligned command without destroying its forces or local administration."
random_terror_trace_the_border_corridors: "Trace the Border Corridors"
random_terror_trace_the_border_corridors_desc: "Follow couriers and supply traffic to reveal the network's concealed crossings."
random_terror_claim_the_transport_hub: "Claim the Transport Hub"
random_terror_claim_the_transport_hub_desc: "Seize the junction that controls movement between neighboring regions."
random_terror_open_the_next_front: "Open the Next Front"
random_terror_open_the_next_front_desc: "Commit forces beyond the enclave to pressure another vulnerable sector."
random_terror_seize_the_urban_district: "Seize the Urban District"
random_terror_seize_the_urban_district_desc: "Capture the district's roads, depots, and administrative buildings before defenders regroup."
random_terror_prepare_the_state_offensive: "Prepare the State Offensive"
random_terror_prepare_the_state_offensive_desc: "Concentrate formations and supplies for an attack on an adjacent government-held state."
random_terror_break_the_parent_government: "Break the Parent Government"
random_terror_break_the_parent_government_desc: "Strike at the institutions and field forces still binding the parent state together."
random_terror_consolidate_captured_territory: "Consolidate Captured Territory"
random_terror_consolidate_captured_territory_desc: "Secure roads, stores, and administration before advancing farther."
random_terror_break_the_last_corridor: "Break the Last Corridor"
random_terror_break_the_last_corridor_desc: "Cut the final route linking the parent government to its isolated territory."
random_terror_leadership_split: "Leadership Split"
random_terror_leadership_split_desc: "The unresolved succession divides commanders and leaves every order open to challenge."
random_terror_negotiated_enclave: "Negotiated Enclave"
random_terror_negotiated_enclave_desc: "Trade disarmament guarantees and local autonomy for a political settlement."
random_terror_return_from_the_crisis: "Return from the Crisis"
random_terror_return_from_the_crisis_desc: "Rebuild command and public order after the movement survives its internal rupture."
random_terror_accept_the_international_claim: "Accept the International Claim"
random_terror_accept_the_international_claim_desc: "Recognize a militant authority that claims religious sanction and is opposed by Muslim governments, communities, clerics, and soldiers."
random_terror_fictional_religious_councils: "Compliant Religious Councils"
random_terror_fictional_religious_councils_desc: "Create compliant councils to manufacture support for the international command's disputed claim."
random_terror_forge_the_fictional_seal: "Forge the Seal"
random_terror_forge_the_fictional_seal_desc: "Fabricate a ceremonial mark to present the command's claim as settled authority."
random_terror_join_the_jihadist_international: "Join the Jihadist International"
random_terror_join_the_jihadist_international_desc: "Enter the militant coalition and submit forces to its shared campaign."
random_terror_unify_the_jihadist_cells: "Unify the Jihadist Cells"
random_terror_unify_the_jihadist_cells_desc: "Bring dispersed militant cells under one transnational chain of command."
random_terror_reconcile_the_jihadists: "Reconcile the Jihadists"
random_terror_reconcile_the_jihadists_desc: "Settle disputes among the coalition's militant commands before rivalry destroys it."
random_terror_command_the_international: "Command the International"
random_terror_command_the_international_desc: "Take control of the coalition's planning, supplies, and cross-border operations."
random_terror_lead_the_coordination_structure: "Lead the Coordination Structure"
random_terror_lead_the_coordination_structure_desc: "Direct the couriers and regional commands that connect the international movement."
random_terror_challenge_rival_governments: "Challenge Rival Governments"
random_terror_challenge_rival_governments_desc: "Turn coordinated pressure against states already facing organized armed cells."
random_terror_prepare_the_global_uprising: "Prepare the Global Uprising"
random_terror_prepare_the_global_uprising_desc: "Stockpile supplies and synchronize cells in countries where the network has established real reach."
random_terror_open_the_worldwide_uprising: "Open the Worldwide Uprising"
random_terror_open_the_worldwide_uprising_desc: "Order prepared cells to rise where organization and Terror Pressure can sustain armed action."
random_terror_synchronize_the_columns: "Synchronize the Columns"
random_terror_synchronize_the_columns_desc: "Coordinate territorial forces and distant cells so their offensives begin together."
random_terror_lead_the_final_jihad: "Lead the Final Jihad"
random_terror_lead_the_final_jihad_desc: "Claim command of the coalition's final global campaign against opposing governments and communities."
random_terror_contest_the_final_claim: "Contest the Final Claim"
random_terror_contest_the_final_claim_desc: "Challenge the authority behind the final global campaign before the coalition submits completely."
random_terror_seal_the_final_command: "Seal the Final Command"
random_terror_seal_the_final_command_desc: "Concentrate every surviving chain of command around the entity's disputed claim."
random_terror_secure_the_capital_approach: "Secure the Capital Approach"
random_terror_secure_the_capital_approach_desc: "Clear the routes and staging grounds needed to reach the enemy capital."
random_terror_fracture_the_sky: "Fracture the Sky"
random_terror_fracture_the_sky_desc: "Force an unexplained rupture that leaves witnesses uncertain whether they saw a weapon, an illusion, or something else."
random_terror_deny_the_false_revelation: "Deny the False Revelation"
random_terror_deny_the_false_revelation_desc: "Reject the entity's claim and rally those who refuse to mistake power for divinity."
random_terror_accelerate_the_revelation: "Accelerate the Revelation"
random_terror_accelerate_the_revelation_desc: "Commit the final command's authority and supplies to the entity's unverified promise."
random_terror_ambiguous_light: "Ambiguous Light"
random_terror_ambiguous_light_desc: "A radiance without a trusted source spreads across the battlefield and leaves no proof of what caused it."
random_terror_seize_the_command_capitals: "Seize the Command Capitals"
random_terror_seize_the_command_capitals_desc: "Capture the remaining centers of government and force the terminal struggle into the open."
# Actor focus reward tooltips.
random_terror_focus_opens_shadow_council_decisions_tt: "Opens the Shadow Council's command decisions, including §YRelocate the Network§!."
random_terror_focus_opens_war_directorate_decisions_tt: "Opens the War Directorate's command decisions, including §YConvert the Militia§!, §YPrepare a State Offensive§!, §YBuild a Civil Administration§! and §YForce Local Extraction§!."
random_terror_focus_opens_ideological_secretariat_decisions_tt: "Opens the Ideological Secretariat's command decisions, including §YOpen an External Corridor§!, §YBegin Ideological Mobilization§! and §YRecruit Foreign Fighters§!."
random_terror_focus_opens_jihadist_international_decisions_tt: "Opens §YCall a Coordinated Uprising§! to the command once The Final Jihad has begun."
random_terror_continuity_protocol_reward_tt: "Fallback bunkers are built in the key towns of the command's seat.\n§YRelocate the Network§! no longer costs Territorial Control.\nNetwork Authority rises."
random_terror_establish_political_offices_reward_tt: "The command's seat becomes a §Ycore state§!.\n§YBuild a Civil Administration§! opens to the command once the Territorial Insurgency has begun.\nNetwork Authority rises."
random_terror_trace_the_border_corridors_reward_tt: "The command gains §Yclaims§! on every crisis state that borders its territory and that it does not own.\nNetwork Reach rises."
random_terror_open_the_next_front_reward_tt: "One regular formation musters in an owned state facing a claimed state the command does not hold. At its division limit the command takes the formation's rifles into its stockpile instead.\nThe cells in that claimed state step up their activity, and Territorial Control rises."
random_terror_break_the_last_corridor_reward_tt: "Every claimed state the command holds, other than a national capital, passes into its §Yownership§!.\nTerritorial Control and Network Reach rise."
random_terror_forge_the_fictional_seal_reward_tt: "Every state the command owns and holds becomes a §Ycore state§!.\nInternational Unity and Network Authority rise."
random_terror_lead_the_coordination_structure_reward_tt: "If the command stands outside any faction or leads its own, it founds or keeps §YThe Jihadist International§!, takes the network leadership when no other command holds it, and brings in every International command that stands outside any faction, is at peace with it and accepts its lead, except an independent command.\nIf the command serves in another faction, couriers deliver §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§! support equipment and §Y[?constant:random_terror_cost.actor_corridor_convoys|0]§! convoys instead.\nInternational Unity and Network Authority rise."
random_terror_challenge_rival_governments_reward_tt: "The cells in every crisis state of another government that borders the command's territory step up their activity.\nThe command gains a war goal to §Ytopple the government§! of one such neighbour it is not already fighting, preferring a government facing an armed insurgency.\nInternational Unity rises."
random_terror_synchronize_the_columns_reward_tt: "The command and every command fighting in its faction gain §YSynchronized Offensive§! for §Y[?constant:random_terror_focus_reward.synchronized_offensive_days|0]§! days: division attack §G+[?constant:random_terror_focus_reward.synchronized_offensive_attack|%0]§! and division speed §G+[?constant:random_terror_focus_reward.synchronized_offensive_speed|%0]§!.\nTerritorial Control, External Supply and International Unity rise."
random_terror_secure_the_capital_approach_reward_tt: "The command gains §Yclaims§! on the capital state of every neighbour at war with it.\nRoads improve in one owned state facing the enemy.\nTerritorial Control and External Supply rise."
random_terror_fracture_the_sky_reward_tt: "Every neighbour at war with the command suffers §YSky Fracture Shock§! for §Y[?constant:random_terror_focus_reward.sky_fracture_days|0]§! days: war support §R[?constant:random_terror_focus_reward.sky_fracture_war_support|%0]§! and stability §R[?constant:random_terror_focus_reward.sky_fracture_stability|%0]§!."
random_terror_synchronized_offensive: "Synchronized Offensive"
random_terror_mobilized_cadres: "Mobilized Cadres"
random_terror_codify_the_doctrine_reward_tt: "§YBegin Ideological Mobilization§! raises a second disciplined formation.\nNetwork Authority rises."
random_terror_ideological_mobilization_focus_reward_tt: "Two disciplined formations muster in the command's territory, within its division limit.\nFor §Y[?constant:random_terror_mobilization.mobilization_days|0]§! days the command gains §YMobilized Cadres§!: recruitable population §G+[?constant:random_terror_mobilization.recruitment|%0]§! and stability §R[?constant:random_terror_mobilization.stability|%0]§!. §YBegin Ideological Mobilization§! stays closed while it lasts."
random_terror_territorial_control_rises_tt: "Territorial Control rises."
random_terror_network_authority_rises_tt: "Network Authority rises."
random_terror_international_unity_rises_tt: "International Unity rises."
random_terror_reach_and_authority_rise_tt: "Network Reach and Network Authority rise."
random_terror_control_and_authority_rise_tt: "Territorial Control and Network Authority rise."
random_terror_hold_the_enclave_reward_tt: "One under-strength militia formation musters in the command's territory.\nTerritorial Control rises."
random_terror_restore_supply_reward_tt: "A damaged depot is rebuilt as a §Ymilitary factory§!, or as road and rail capacity when no factory slot is free.\nExternal Supply rises."
random_terror_secure_command_center_reward_tt: "The seat gains §Yanti-air defences§!, and the command receives §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§! support equipment.\nNetwork Authority rises."
random_terror_restore_the_workshops_reward_tt: "One §Ymilitary factory§! is built in the command's territory, with a new building slot in the seat when no slot is free."
random_terror_seal_the_inner_circle_reward_tt: "Exposed members are cut off, ending §YCompromised Network§! if the command suffers it.\nUp to §Y[?constant:random_terror_focus_reward.protected_cell_count|0]§! cells abroad that their government has swept go to ground, so the next raid there finds only empty safe houses.\nNetwork Authority rises."
random_terror_layered_safehouses_reward_tt: "§YBunkers§! are built in the key towns of every state the command holds outside its seat, or in the seat when it holds no other state.\nNetwork Reach rises."
random_terror_protect_the_route_reward_tt: "Roads improve in a border state, §Y[?constant:random_terror_cost.actor_corridor_convoys|0]§! convoys arrive, and an external corridor opens that opponents can later disrupt.\nExternal Supply rises."
random_terror_appoint_the_directorate_reward_tt: "One experienced regular formation musters as the directorate's guard. At its division limit the command takes the formation's rifles into its stockpile instead.\nNetwork Authority rises."
random_terror_field_radio_discipline_reward_tt: "The command receives §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§! support equipment and gains §YField Radio Discipline§! for §Y[?constant:random_terror_focus_reward.radio_discipline_days|0]§! days: planning speed §G+[?constant:random_terror_focus_reward.radio_discipline_planning|%0]§! and division organization §G+[?constant:random_terror_focus_reward.radio_discipline_org|%0]§!.\nNetwork Authority rises."
random_terror_harden_the_defensive_line_reward_tt: "§YBunkers§! are built along the border provinces of a state facing the enemy, or of a border state when the command is at peace."
random_terror_unify_the_brigades_reward_tt: "Two regular territorial formations muster in the command's territory, within its division limit.\nTerritorial Control rises."
random_terror_claim_revolutionary_authority_reward_tt: "§YEnthrone the Ideological State§! can be completed once its other requirements are met.\nNetwork Authority rises."
random_terror_establish_forced_rule_reward_tt: "Territorial Control rises, and the forced rule draws public condemnation."
random_terror_smuggling_and_external_supply_reward_tt: "An external corridor opens that opponents can later disrupt.\nExternal Supply rises."
random_terror_coerced_extraction_reward_tt: "Seized stocks raise External Supply, and the extraction draws public condemnation."
random_terror_directed_war_economy_reward_tt: "One §Ymilitary factory§! is built in the command's territory, with a new building slot in the seat when no slot is free."
random_terror_civil_administration_focus_reward_tt: "Roads and rail are rebuilt in the seat.\nTerritorial Control and Network Authority rise."
random_terror_build_the_regional_state_reward_tt: "One §Ycivilian factory§! is built in the command's territory, with a new building slot in the seat when no slot is free.\nTerritorial Control rises."
random_terror_align_with_the_patron_reward_tt: "The patron's instructors give one §Y[?constant:random_terror_focus_reward.patron_training_bonus|%0]§! research bonus to infantry weapons.\nExternal Supply rises."
random_terror_patron_development_reward_tt: "One §Ycivilian factory§! is built in the command's territory, with a new building slot in the seat when no slot is free."
random_terror_reconcile_the_jihadists_reward_tt: "The command makes a white peace with every International command it is fighting whose leaders accept terms.\nNetwork Authority and International Unity rise."
random_terror_network_reach_rises_tt: "Network Reach rises."
random_terror_territorial_control_falls_tt: "Territorial Control falls."
random_terror_network_authority_falls_tt: "Network Authority falls."
random_terror_network_reach_falls_tt: "Network Reach falls."
random_terror_external_supply_rises_tt: "External Supply rises."
random_terror_define_leadership_reward_tt: "The command now chooses how it will rule: the §YShadow Council§!, the §YWar Directorate§! or the §YIdeological Secretariat§!.\nTerritorial Control and Network Authority rise."
random_terror_secure_forward_depots_reward_tt: "Roads improve in a state facing the enemy, or on the border, and a §Yfuel silo§! is built there when a slot is free. §Y[?constant:random_terror_focus_reward.forward_depot_fuel|0]§! fuel reaches the stores.\nExternal Supply and Territorial Control rise."
random_terror_relocate_the_command_reward_tt: "A fallback seat is prepared in another held state with §Ybunkers§! in its key towns and §Yanti-air defences§!, or the seat gains anti-air when the command holds no other state.\nNetwork Authority and External Supply rise."
random_terror_distribute_the_cells_reward_tt: "Up to §Y[?constant:random_terror_focus_reward.cell_select_count|0]§! active cells abroad, those bordering the command first, join the network and step up their activity.\nNetwork Reach and Network Authority rise."
random_terror_foreign_cell_channels_reward_tt: "Couriers link up to §Y[?constant:random_terror_focus_reward.cell_select_count|0]§! active cells abroad to the network, and §Y[?constant:random_terror_cost.actor_corridor_convoys|0]§! convoys arrive.\nExternal Supply and Network Reach rise."
random_terror_foreign_cell_support_reward_tt: "Up to §Y[?constant:random_terror_focus_reward.cell_select_count|0]§! linked cells abroad receive money and weapons and step up their activity.\nNetwork Authority rises."
random_terror_relocate_cell_focus_reward_tt: "One cell abroad that its government has swept moves before the next raid, which then finds only empty safe houses. Unless the Continuity Protocol is in force, the move costs some Territorial Control.\nNetwork Reach rises."
random_terror_command_the_front_reward_tt: "The command gains §YSynchronized Offensive§! for §Y[?constant:random_terror_focus_reward.synchronized_offensive_days|0]§! days: division attack §G+[?constant:random_terror_focus_reward.synchronized_offensive_attack|%0]§! and division speed §G+[?constant:random_terror_focus_reward.synchronized_offensive_speed|%0]§!.\nTerritorial Control rises."
random_terror_integrate_defectors_focus_reward_tt: "One seasoned formation forms from the defectors, within the command's division limit.\nTerritorial Control rises."
random_terror_prepare_the_parent_offensive_reward_tt: "The command §Yclaims§! every populated state of its parent government or another enemy that borders its territory, and the cells there step up their activity.\nTerritorial Control rises."
random_terror_command_the_armed_movement_reward_tt: "One regular territorial formation musters, within the command's division limit.\nTerritorial Control rises."
random_terror_open_the_border_corridor_reward_tt: "An external corridor opens that opponents can later disrupt, roads improve in a border state, and §Y[?constant:random_terror_focus_reward.forward_depot_fuel|0]§! fuel comes through.\nExternal Supply and Network Reach rise."
random_terror_salvage_the_rail_spur_reward_tt: "A §Yrailway§! is laid from the seat to a border state, and roads improve there.\nExternal Supply rises."
random_terror_control_the_market_reward_tt: "Market stocks are seized: §Y[?constant:random_terror_focus_reward.market_infantry_equipment|0]§! infantry equipment and §Y[?constant:random_terror_focus_reward.market_fuel|0]§! fuel. The seizure draws public condemnation.\nExternal Supply and Territorial Control rise."
random_terror_secure_the_fuel_stores_reward_tt: "§Y[?constant:random_terror_focus_reward.fuel_stores_fuel|0]§! fuel is secured, and a §Yfuel silo§! is built in the seat when a slot is free.\nExternal Supply rises."
random_terror_identify_the_sponsor_reward_tt: "The command asks a country that could back it, a neighbour first, to become its sponsor. That country decides whether to send political support and equipment.\nNetwork Authority rises."
random_terror_convert_the_militia_focus_reward_tt: "One regular formation is trained, within the command's division limit.\nTerritorial Control rises."
random_terror_map_the_network_reward_tt: "The command gives §Ymilitary access§! to every other command at peace with it, and every such command run by its own leaders opens its territory in return.\nNetwork Reach and Network Authority rise."
random_terror_protect_safe_havens_reward_tt: "Up to §Y[?constant:random_terror_focus_reward.protected_cell_count|0]§! cells abroad that their government has swept go to ground, so the next raid there finds only empty safe houses.\nNetwork Reach rises."
random_terror_bargain_with_rivals_reward_tt: "The command signs a §Ynon-aggression pact§! with every rival command at peace with it outside its faction whose leaders accept terms.\nNetwork Authority and International Unity rise."
random_terror_merge_the_enclaves_reward_tt: "The command offers a merger to a weaker command at peace with it, a neighbour first. If that command accepts, its territory passes to the command.\nNetwork Authority rises."
random_terror_event_31_faction_route_reward_tt: "The command §Yguarantees§! every rival command at peace with it whose leaders accept the front, except a command that stays independent.\nInternational Unity and Network Authority rise."
random_terror_form_the_confederation_reward_tt: "When the command leads the new faction, every command at peace with it that stands outside any faction, accepts the front and does not serve the Jihadist International joins it.\nInternational Unity rises."
random_terror_absorb_compatible_enclave_reward_tt: "The command offers a merger to a weaker command, one in its own faction first. If that command accepts, its territory passes to the command.\nTerritorial Control rises."
random_terror_claim_the_transport_hub_reward_tt: "The command §Yclaims§! a neighbouring state, one with good roads first, and improves the roads in its own state facing it.\nTerritorial Control rises."
random_terror_seize_the_urban_district_reward_tt: "The command §Yclaims§! a neighbouring state the enemy holds, a large city first, and the cells there step up their activity sharply.\nTerritorial Control rises."
random_terror_prepare_the_state_offensive_reward_tt: "The command §Yclaims§! one neighbouring state the enemy holds, and the cells there step up their activity ahead of the assault.\nTerritorial Control rises."
random_terror_break_the_parent_government_reward_tt: "The parent government suffers stability §R[?constant:random_terror_focus_reward.parent_stability_loss|%0]§! and war support §R[?constant:random_terror_focus_reward.parent_war_support_loss|%0]§!, its Terror Pressure rises, and the cells in its crisis states step up their activity.\nTerritorial Control rises."
random_terror_join_the_jihadist_international_reward_tt: "The command asks the command that leads the Jihadist International to admit it. That command decides whether to bring it into its faction.\nIf no other command leads the International, the command founds it, or takes its leadership in the faction it already leads."
random_terror_unify_the_jihadist_cells_reward_tt: "Up to §Y[?constant:random_terror_focus_reward.cell_select_count|0]§! active cells abroad, those bordering the command first, come under the International's chain of command and step up their activity.\nInternational Unity rises."
random_terror_command_the_international_reward_tt: "One experienced International column musters, within the command's division limit.\nInternational Unity rises."
random_terror_prepare_the_global_uprising_reward_tt: "Up to §Y[?constant:random_terror_focus_reward.cell_select_count|0]§! linked cells abroad step up their activity, and each government holding them faces §Y[?constant:random_terror_focus_reward.uprising_pressure_gain|0]§! more Terror Pressure."
random_terror_open_the_worldwide_uprising_reward_tt: "Once §YThe Final Jihad§! has begun, one linked cell abroad whose government is under heavy Terror Pressure rises at once, as with §YCall a Coordinated Uprising§!, and that government must stop it.\nBefore then, or without such a cell, linked cells abroad prepare instead and their governments face more Terror Pressure."
random_terror_lead_the_final_jihad_reward_tt: "The command takes the network leadership if no other command holds it, and one veteran formation musters within its division limit.\nInternational Unity rises."
random_terror_contest_the_final_claim_reward_tt: "If another command leads the network, the command challenges it as with §YContest the Network Leader§!: it wins the leadership only with more Network Authority, and a lost contest costs Network Authority and can split its faction.\nWith no leader, the command takes the leadership.\nTerritorial Control rises."
random_terror_accelerate_the_revelation_reward_tt: "The command stakes its authority and supplies on the entity's promise: if its conditions still hold, the claim comes to a head sooner."
random_terror_ambiguous_light_reward_tt: "One veteran formation gathers around the final command, within its division limit."
random_terror_seize_the_command_capitals_reward_tt: "The final command forms its own faction, every command that submitted to it joins, and the last struggle for the world begins."
random_terror_sky_fracture_shock: "Sky Fracture Shock"
