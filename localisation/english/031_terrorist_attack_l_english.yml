random_terror_evolution_organized_cells: "Organized Cells"
random_terror_evolution_organized_cells_desc: "Local attackers adopt durable cells, shared training, and planned supply caches."
random_terror_evolution_transnational_network: "Transnational Terror Network"
random_terror_evolution_transnational_network_desc: "Couriers, sponsors, and safe havens connect organizations across national borders."
random_terror_evolution_territorial_insurgency: "Territorial Insurgency"
random_terror_evolution_territorial_insurgency_desc: "Armed organizations seize and administer populated territory."
random_terror_evolution_jihadist_international: "The Jihadist International"
random_terror_evolution_jihadist_international_desc: "An extremist jihadist current forms an international command opposed by Muslim governments and communities as well as other states."
random_terror_evolution_final_jihad: "The Final Jihad"
random_terror_evolution_final_jihad_desc: "The international command begins synchronized uprisings and territorial offensives."
random_terror_event_details_title: "Random Terror"
random_terror_event_details_desc: "Repeatable attacks can build organized cells, foreign corridors, and territorial insurgencies when governments fail to protect civilians and restore lawful authority."
random_terror_world_end_title: "The False Revelation"
random_terror_world_end_desc: "A final territorial command gathers around an unexplained presence and launches a worldwide campaign. Its followers' divine claim remains unconfirmed, and organized resistance can still break its capitals, corridors, and authority."

