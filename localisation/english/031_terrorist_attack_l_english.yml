random_terror_establish_response_cell_effect_tt: "Creates the response cell and begins Contain the Attack Wave. Response Capacity rises by §G[?constant:random_terror_capacity.response_cell_gain|0]§! on top of the §G[?constant:random_terror_tuning.response_capacity_gain|0]§! every response adds, until the crisis closes. Each point, up to §Y[?constant:random_terror_capacity.effective_cap|0]§!, makes a clean Targeted Raid more likely and lets an Intelligence Sweep remove §Y[?constant:random_terror_capacity.sweep_activity_per_point|0]§! more activity."

