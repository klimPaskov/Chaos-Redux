random_terror_protect_transport_desc: "Guard stations, repair routes, and keep emergency traffic moving through [FROM.GetName]."
random_terror_protect_transport_requirements_tt: "[FROM.GetName] must be controlled, affected by the crisis, and have transport worth protecting."
