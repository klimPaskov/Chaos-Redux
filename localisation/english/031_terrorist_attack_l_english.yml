l_english:
chaosx.nr31.1.t: "Random Terror"

chaosx.nr31.2.t: "Terror in [?random_terror_last_report_state.GetName]"
chaosx.nr31.2.d: "[GetRandomTerrorIncidentReportDesc][GetRandomTerrorIncidentReportOrigin][GetRandomTerrorIncidentReportLoss]"
chaosx.nr31.2.a: "Protect the population."
chaosx.nr31.2.protection: "Guard the stations, markets and roads."
chaosx.nr31.2.intelligence: "Find the cell behind this."
chaosx.nr31.2.victims: "The wounded and the bereaved come first."
chaosx.nr31.2.coercion: "Send the troops in now."
random_terror_incident_report_transport: "Saboteurs have brought down a rail bridge and torn up the roads around [?random_terror_last_report_state.GetName]. Trains stand idle, supply convoys are stranded, and engineers wait for soldiers to clear the wreckage before repairs can begin."
random_terror_incident_report_crowd: "An attack on a crowded station in [?random_terror_last_report_state.GetName] has left the platforms strewn with debris. Families are searching the evacuation points for their relatives, and the city is bracing for another strike."
random_terror_incident_report_relief: "Hospitals and relief stations in [?random_terror_last_report_state.GetName] can no longer cope with the wounded and the displaced from the latest attacks. Medics are working in corridors, and supplies are running short."
random_terror_incident_report_depot: "Armed men have stormed a military depot in [?random_terror_last_report_state.GetName], set its stores on fire and driven off with weapons and ammunition. Investigators fear those weapons will be used in the next attack."
random_terror_incident_report_documents: "Security forces have raided hideouts in [?random_terror_last_report_state.GetName]. Seized ledgers, letters and foreign money point to a wider network behind the attacks, though some of its members escaped before the doors were broken down."
random_terror_incident_report_corridor: "Couriers are moving weapons, money and recruits through [?random_terror_last_report_state.GetName] along hidden routes, harbours and remote camps. Border posts report armed groups crossing at night."
random_terror_incident_report_defection: "Soldiers and militants in [?random_terror_last_report_state.GetName] are changing sides. Weapons have vanished from barracks, and the network now recruits men who know how the security forces work."
random_terror_incident_report_rivals: "Rival armed groups have clashed in [?random_terror_last_report_state.GetName]. Their fighting has emptied whole streets, and neither side shows any concern for the civilians caught between them."
random_terror_incident_report_public_building: "Gunmen have stormed a public building in [?random_terror_last_report_state.GetName]. Officials, guards and visitors were caught inside, and armed police now surround the district."
random_terror_incident_report_claim: "Leaflets, broadcasts and armed patrols across [?random_terror_last_report_state.GetName] proclaim that a terrorist network now rules the district. Residents keep their doors shut as the movement's men question passers-by."
random_terror_advanced_research_slot_tt: "Our command rises to §Y[?constant:random_terror_tuning.actor_research_slots_advanced|0]§! research slots."
random_terror_seal_final_command_strength_tt: "Presence of the Entity gains §G[?constant:random_terror_terminal_strength.sealed_command_points|0]§! points."
random_terror_incident_report_cannibal: "Cannibal warbands from across the border have fought the network's fighters in [?random_terror_last_report_state.GetName]. Neither side spared the villages between them, and neither will make peace with the other."
random_terror_incident_report_rejection: "Residents of [?random_terror_last_report_state.GetName] have turned against the armed men in their streets. Shopkeepers and elders are giving the police the names of cell members, and the network has answered with threats and night patrols."
random_terror_incident_report_loss: "\n\nOfficials have confirmed §R[?random_terror_last_report_loss|0]§! civilian deaths."
random_terror_incident_report_no_loss: ""
random_terror_incident_report_origin_survivors: "\n\nThe attackers are survivors of the cell broken up in §Y[?random_terror_last_report_origin.GetName]§!. They slipped away before the cordon closed and have found a new base here."
random_terror_incident_report_origin_corridor: "\n\nThe weapons and recruits came down the smuggling routes from §Y[?random_terror_last_report_origin.GetName]§!."
random_terror_incident_report_origin_transport: "\n\nThe cell came along the damaged rail and road links from §Y[?random_terror_last_report_origin.GetName]§!."
random_terror_incident_report_origin_port: "\n\nThe attackers came by boat from the disrupted harbours of §Y[?random_terror_last_report_origin.GetName]§!."
random_terror_incident_report_origin_training: "\n\nThe attackers were trained in the hidden camps of §Y[?random_terror_last_report_origin.GetName]§!."
random_terror_incident_report_origin_copycat: "\n\nThe attack copies the methods first seen in §Y[?random_terror_last_report_origin.GetName]§!, down to the last detail."
random_terror_incident_report_origin_actor: "\n\nThe attackers crossed over from §Y[?random_terror_last_report_origin.GetName]§!, which borders territory held by an armed movement."
random_terror_incident_report_origin_distant: "\n\nNo cell was known to operate here. The attack was planned and directed from abroad by a network whose reach goes far beyond its own bases."
random_terror_incident_report_no_origin: ""
random_terror_spread_status_restricted: "Spread: §GMovement restrictions hold the cells in place.§!"
random_terror_spread_status_window: "Spread: no new crisis state is expected before §Y[?random_terror_spread_ready_date.GetDateStringNoHour]§!."
random_terror_spread_status_survivors: "Spread: §RSurvivors of a broken cell are looking for a new base next to their old one.§!"
random_terror_spread_status_open: "Spread: §RA cell can move into a neighbouring state§! along damaged routes, smuggling routes, copycat attacks, training camps or a nearby armed movement."
random_terror_spread_status_none: "Spread: no cell has a reason to move."
random_terror_emphasis_protection_tt: "For §Y[?constant:random_terror_emphasis.days|0]§! days, guards stand at stations, markets and roads across the country, and some attacks on crowds and routes strike them instead. Local pressure in §Y[?random_terror_last_report_state.GetName]§! falls by §Y[?constant:random_terror_tuning.protected_pressure_reduction|0]§!.\nGain §YProtective Cordons§! for §Y[?constant:random_terror_emphasis.days|0]§! days: war support §G+[?constant:random_terror_emphasis.protection_war_support|%0]§!, conscription §R[?constant:random_terror_emphasis.protection_conscription|%0]§!."
random_terror_emphasis_intelligence_tt: "For §Y[?constant:random_terror_emphasis.days|0]§! days, Intelligence Sweep is open without a response cell, and the first Targeted Raid of this period draws on better information.\nGain §YIntelligence Priority§! for §Y[?constant:random_terror_emphasis.days|0]§! days: civilian intelligence §G+[?constant:random_terror_emphasis.intelligence_civilian_intel|%0]§!, political power gain §R[?constant:random_terror_emphasis.intelligence_political_power|%0]§!."
random_terror_emphasis_victims_tt: "Response Legitimacy rises by §G[?constant:random_terror_tuning.response_legitimacy_gain|0]§!. For §Y[?constant:random_terror_emphasis.days|0]§! days, Support Victims stays open beside a response cell and also weakens active cells where it lands.\nGain §YRelief First§! for §Y[?constant:random_terror_emphasis.days|0]§! days: stability §G+[?constant:random_terror_emphasis.victims_stability|%0]§!, construction speed §R[?constant:random_terror_emphasis.victims_construction|%0]§!."
random_terror_emphasis_coercion_tt: "Troops pour into §Y[?random_terror_last_report_state.GetName]§!: its terrorist activity falls by §G[?constant:random_terror_tuning.state_activity_loss|0]§!, but Response Legitimacy drops by §R[?constant:random_terror_emphasis.coercion_legitimacy_loss|0]§!. For §Y[?constant:random_terror_emphasis.days|0]§! days, each Security Surge hits the cell harder.\nGain §YRapid Crackdown§! for §Y[?constant:random_terror_emphasis.days|0]§! days: war support §G+[?constant:random_terror_emphasis.coercion_war_support|%0]§!, stability §R[?constant:random_terror_emphasis.coercion_stability|%0]§!."
random_terror_emphasis_protection: "Protective Cordons"
random_terror_emphasis_protection_desc: "Police and soldiers guard stations, markets and roads against the next attack."
random_terror_emphasis_intelligence: "Intelligence Priority"
random_terror_emphasis_intelligence_desc: "Investigators, informants and analysts take priority over every other demand on the government."
random_terror_emphasis_victims: "Relief First"
random_terror_emphasis_victims_desc: "Medical teams, relief trains and support for the bereaved come before every other task."
random_terror_emphasis_coercion: "Rapid Crackdown"
random_terror_emphasis_coercion_desc: "Troops, curfews and mass searches flood the districts where the attacks began."

chaosx.news.36.t: "Violent Terrorist Attacks"
chaosx.news.36.d: "A spate of bombings and shootings is tearing through [From.GetName]. Security forces are struggling to contain the attacks, and civilians are demanding action as the violence spreads."
chaosx.news.36.a: "The attacks are horrific."

031_no_second_blast_NAME: "No Second Blast"
031_no_second_blast_DESC: "End a severe, widespread terror crisis within six months without allowing another state to ignite or sacrificing civilians to the response."
031_no_second_blast_tooltip: "Within 180 days, clear every state affected by the first wave and reduce Terror Pressure to zero. Do not let another state become active, lose territory, abuse civilians, or cause civilian deaths. Remain with the same country."

031_the_long_watch_NAME: "The Long Watch"
031_the_long_watch_DESC: "Survive and clear five separate terror waves without losing a state, suffering a coup, or abandoning lawful public confidence."
031_the_long_watch_tooltip: "Clear five separate outbreaks in this country and finish the fifth with zero Terror Pressure. Never lose a state or suffer a successful coup, and keep Response Legitimacy at 50 or higher."

031_the_city_still_stands_NAME: "The City Still Stands"
031_the_city_still_stands_DESC: "Hold the capital at the height of an insurgent war, then force the national crisis back from the brink."
031_the_city_still_stands_tooltip: "Begin Prevent Capital Seizure at 80 or more Terror Pressure while at war and with a non-capital state at Armed Insurgency or worse. Succeed, then reduce Terror Pressure below 60 during the recovery window."

031_cut_every_route_NAME: "Cut Every Route"
031_cut_every_route_DESC: "Dismantle a transnational network by breaking its corridors, sponsor, refuge, and domestic cells in one connected campaign."
031_cut_every_route_tooltip: "Break three distinct corridors, expose or neutralize a sponsor, eliminate a safe haven, reduce Network Reach by a major stage, and clear every domestic terrorist stronghold through material actions."

031_the_false_claim_rejected_NAME: "The False Claim Rejected"
031_the_false_claim_rejected_DESC: "Lead a Muslim-majority government in public and military opposition to the Jihadist International's claim, protect threatened communities, and defeat its leader."
031_the_false_claim_rejected_eligible_tooltip: "Available to a Muslim-majority government that stays outside the Jihadist International and openly opposes its claim."
031_the_false_claim_rejected_tooltip: "After The Jihadist International begins, complete public rejection and opposition, protect every threatened community objective, maintain at least 70 Response Legitimacy, defeat or secure the surrender of the current faction leader, and remain independent."

031_no_collective_punishment_NAME: "No Collective Punishment"
031_no_collective_punishment_DESC: "Defeat a territorial organization while preserving public legitimacy, restrained operations, and civil restoration in every recovered state."
031_no_collective_punishment_tooltip: "Materially defeat or secure the surrender of a terrorist command, keep Response Legitimacy at 70 or higher after the war begins, avoid extended restrictions, abusive failures, atrocities, and cover-ups, and complete Restore Civil Authority in every recaptured state."

031_enemy_of_my_enemy_NAME: "The Enemy of My Enemy Is Still My Enemy"
031_enemy_of_my_enemy_DESC: "Help defeat both a territorial terror organization and a cannibal warlord that contested the same frontier without cooperating with either."
031_enemy_of_my_enemy_eligible_tooltip: "Available to ordinary governments and territorial actors that face both an armed enclave and a cannibal warlord along the same frontier."
031_enemy_of_my_enemy_tooltip: "Make a material contribution against both enemies after their forces share a border or contest the same state. Never ally with, join, volunteer for, or sponsor either target."

031_fracture_from_within_NAME: "Fracture from Within"
031_fracture_from_within_DESC: "Break the Jihadist International's claim from inside its own territorial network and preserve an independent command."
031_fracture_from_within_eligible_tooltip: "Revealed while the player controls an eligible territorial actor."
031_fracture_from_within_tooltip: "After The Jihadist International forms, enter its route and reject the dominant leader. Win the leadership struggle, split three members away, or drive International Unity below its lowest active stage. Remain independent and never submit to the final command."

031_maximum_survivor_NAME: "Maximum Survivor"
031_maximum_survivor_DESC: "Launch Global Jihad at Maximum intensity and bring the selected country through every domestic, territorial, and terminal threat."
031_maximum_survivor_eligible_tooltip: "Available to the player country selected by a valid Global Jihad scenario launch."
031_maximum_survivor_tooltip: "Launch Global Jihad through the scenario interface at Maximum intensity, remain in the same country, preserve or restore the original capital, clear domestic Terror Pressure, defeat or secure the surrender of every terrorist command, and resolve The False Revelation."

031_false_revelation_denied_NAME: "The False Revelation Denied"
031_false_revelation_denied_DESC: "Help dismantle the entity state's command, supply, uprisings, and final territorial existence."
031_false_revelation_denied_eligible_tooltip: "Revealed when The False Revelation begins."
031_false_revelation_denied_tooltip: "Materially help recapture a command capital, sever a strategic corridor, restore a high-pressure country or defeat a major uprising, and participate in the final state's defeat. Survive without joining or submitting to it."

031_victims_before_victory_NAME: "Victims Before Victory"
031_victims_before_victory_DESC: "Put civilian recovery ahead of triumph by completing support, transport, and relief work before the connected organization is defeated."
031_victims_before_victory_tooltip: "In every state with major terrorist-caused civilian losses, complete victim support, restore critical transport, and protect relief access. Finish the responsible command's defeat or surrender with at least 80 Response Legitimacy and no later abusive failure."

031_war_without_a_capital_NAME: "War Without a Capital"
031_war_without_a_capital_DESC: "Continue governing after the original capital falls, retake it, and restore civil authority before a year passes."
031_war_without_a_capital_eligible_tooltip: "Revealed when a terrorist command takes the country's original capital without forcing capitulation."
031_war_without_a_capital_tooltip: "Establish a valid backup capital, continue the war, retake the original capital, complete Restore Civil Authority there within one year, preserve the government, and reduce Terror Pressure below 40."

031_random_terror_government_achievement_eligible_tooltip: "Available to an established government that completes the listed actions without changing regimes."

random_terror_terminal_counteroffensive: "Coordinate the Terminal Counteroffensive"
random_terror_terminal_counteroffensive_desc: "Commit command staff and field communications to the coalition effort against the final state's territorial control, authority, and supply network."
random_terror_terminal_counteroffensive_requirements_tt: "The coalition's final offensive must be underway, and this government must be directly threatened and not already committed to a final counteroffensive."
random_terror_terminal_counteroffensive_cost: "£command_power §Y[?constant:random_terror_cost.security_command_power|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.security_support_equipment|0]§!"
random_terror_terminal_counteroffensive_cost_blocked: "£command_power §R[?constant:random_terror_cost.security_command_power|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.security_support_equipment|0]§!"
random_terror_terminal_counteroffensive_cost_tooltip: "Spends £command_power §Y[?constant:random_terror_cost.security_command_power|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.security_support_equipment|0]§!."
random_terror_terminal_counteroffensive_effect_tt: "Weakens the final state's territorial control, authority, and external supply and records one of §Y[?constant:random_terror_cost.terminal_counteroffensive_required_contributions|0]§! coalition contributions required to deny the claim once the final command is objectively defeat-ready.\nThe final command's strengths stand at Presence of the Entity §Y[?global.random_terror_presence_score|0]§!, World in Revolt §Y[?global.random_terror_revolt_score|0]§! and Supply Through Ruin §Y[?global.random_terror_ruin_score|0]§! out of §Y[?constant:random_terror_terminal_strength.score_cap|0]§!. Retaking its command capital and breaking International Unity weaken Presence of the Entity; bringing the worst-hit countries below §Y[?constant:random_terror_terminal_strength.high_pressure_gate|0]§! Terror Pressure and destroying its surviving commands weaken World in Revolt; taking its ports and developed states and cutting its External Supply weaken Supply Through Ruin."

# Current Event 31 reports and news
chaosx.nr31.3.t: "A Network Without Borders"
chaosx.nr31.3.d: "Seized correspondence links local cells to couriers, safe houses, and supply routes abroad. The organizations still use separate names, but their money, weapons, and instructions now cross frontiers with practiced ease."
chaosx.nr31.3.a: "Trace every connection."
chaosx.nr31.4.t: "An Enclave Takes Shape"
chaosx.nr31.4.d: "An armed organization has driven the authorities from a settled district and begun ruling from captured public buildings. Residents face checkpoints, requisitions, and forced obedience as government forces prepare to retake the lost ground."
chaosx.nr31.4.a: "The enclave cannot be allowed to endure."
chaosx.nr31.5.t: "The Jihadist International"
chaosx.nr31.5.d: "An extremist current has gathered several territorial commands beneath a single international claim. Muslim governments, soldiers, clerics, and civic organizations have rejected it and are organizing to defend threatened communities."
chaosx.nr31.5.a: "Opposition must be united."
chaosx.nr31.6.t: "The Claim Rejected"
chaosx.nr31.6.d: "Mosques, civic halls, and barracks have become centers of resistance to the Jihadist International. Muslim religious authorities denounce its claim, soldiers guard threatened neighborhoods, and local volunteers keep relief routes open under attack."
chaosx.nr31.6.a: "Stand with those who resist."
chaosx.nr31.7.t: "An Unanswered Presence"
chaosx.nr31.7.d: "Witnesses at the final command report light without a source, shadows that fall in different directions, and orders heard before anyone speaks. The movement calls the presence divine. Rival commanders, Muslim authorities, and civilian survivors reject that claim as uprisings spread."
chaosx.nr31.7.a: "Hold the final command together."
chaosx.nr31.7.b: "Submit to the final command."
chaosx.nr31.7.c: "Preserve an independent command."
chaosx.nr31.7.d_option: "A claim is not proof."
chaosx.nr31.8.t: "The Command Is Broken"
chaosx.nr31.8.d: "The final command centers have fallen. Prisoners and displaced families fill the roads while relief trains enter ruined districts, yet surviving cells remain scattered and the presence has left no explanation behind."
chaosx.nr31.8.a: "Rebuild, remember, and remain watchful."
chaosx.nr31.9.t: "The Crisis Recedes"
chaosx.nr31.9.d: "No organized cell remains active in [Root.GetName]. The last damaged districts have reopened and public fear has eased after §Y[?random_terror_last_cycle_incidents|0]§! attacks during the crisis. Response Legitimacy ended the crisis at §Y[?random_terror_last_cycle_legitimacy|0]§!.\n\n[GetRandomTerrorRecoveryReportDetail]"
chaosx.nr31.9.a: "Remember the victims and stay watchful."
random_terror_recovery_report_reformed: "The reformed security services expect a quiet period of about §Y[?constant:random_terror_recovery.reformed_cooldown_days|0]§! days before any network can rebuild here."
random_terror_recovery_report_plain: "The security services expect a quiet period of about §Y[?constant:random_terror_recovery.cooldown_days|0]§! days before any network can rebuild here."
chaosx.nr31.40.t: "An Ally Requests Intelligence"
chaosx.nr31.40.d: "An allied government asks us to share intercepted traffic, border records, and support equipment for an exact state under pressure. The request names the operation and its material requirements; cooperation remains our choice."
chaosx.nr31.40.a: "Commit £command_power §Y[?constant:random_terror_cost.partner_intelligence_command_power|0]§! and £support_equipment_text_icon §Y[?constant:random_terror_cost.partner_intelligence_support_equipment|0]§!."
chaosx.nr31.40.b: "Keep our resources at home."
chaosx.nr31.41.t: "A Partner Requests Intervention"
chaosx.nr31.41.d: "An allied government asks for staff officers, transport, and field equipment to contest an armed enclave in a named state. Accepting will spend our resources and materially support that operation."
chaosx.nr31.41.a: "Commit £command_power §Y[?constant:random_terror_cost.partner_intervention_command_power|0]§!, £convoy_texticon §Y[?constant:random_terror_cost.partner_intervention_convoys|0]§!, and £support_equipment_text_icon §Y[?constant:random_terror_cost.partner_intervention_support_equipment|0]§!."
chaosx.nr31.41.b: "Decline the intervention."
chaosx.nr31.42.t: "A Clandestine Sponsorship Offer"
chaosx.nr31.42.d: "A territorial organization offers access and influence in exchange for weapons, support equipment, and diplomatic cover. The arrangement would leave evidence that its opponents could expose."
chaosx.nr31.42.a: "Spend £pol_power §Y[?constant:random_terror_cost.partner_sponsor_political_power|0]§!, £infantry_equipment_text_icon §Y[?constant:random_terror_cost.partner_sponsor_infantry_equipment|0]§!, and £support_equipment_text_icon §Y[?constant:random_terror_cost.partner_sponsor_support_equipment|0]§!."
chaosx.nr31.42.b: "Reject the clandestine arrangement."
chaosx.nr31.43.t: "A Rival Demands Absorption"
chaosx.nr31.43.d: "Another territorial command proposes to absorb our territory, forces, and surviving institutions. Acceptance ends this command as an independent actor; refusal preserves it and the rivalry between us."
chaosx.nr31.43.a: "Accept the merger and transfer our territory."
chaosx.nr31.43.b: "Refuse and preserve our command."
chaosx.nr31.44.t: "A Membership Petition"
chaosx.nr31.44.d: "A territorial actor asks to enter the Jihadist International and accept its shared command. The petition can strengthen the network, but its decision remains ours."
chaosx.nr31.44.a: "Admit the applicant to the international command."
chaosx.nr31.44.b: "Reject the petition."
chaosx.nr31.90.t: "Global Jihad Begins"
chaosx.nr31.90.d: "The selected crisis pattern has opened armed fronts, clandestine networks, and coordinated uprisings across several countries. Ordinary governments and communities stand against the movement, including Muslim authorities threatened by its claim."
chaosx.nr31.90.a: "The world enters the crisis."
chaosx.nr31.91.t: "The Scenario Cannot Begin"
chaosx.nr31.91.d: "The requested deployment cannot form a valid set of countries, states, and available territorial carriers. No crisis state has been created."
chaosx.nr31.91.a: "Return to the scenario settings."
chaosx.nr31.92.t: "Random Terror Evolution Candidate"
chaosx.nr31.94.t: "The False Revelation Candidate"
chaosx.nr31.95.t: "The False Revelation"
chaosx.nr31.96.t: "Renewed Attacks"
chaosx.nr31.97.t: "Recovery Review"
chaosx.nr31.45.t: "A Demand Over the Safe Haven"
chaosx.nr31.45.d: "[From.GetName] has sent us a formal demand. Its investigators say the network behind its attacks trains, rests and stores weapons on our territory, and it wants the camps closed and the cells handed over. Refusing will be noticed far beyond its borders."
chaosx.nr31.45.a: "Close the camps and break up the cells."
chaosx.nr31.45.b: "Our territory is our own affair."
random_terror_haven_demand_accept_tt: "Our active crisis states lose §G[?constant:random_terror_safe_haven.accept_activity_reduction|0]§! activity, Network Reach falls by §G[?constant:random_terror_safe_haven.accept_reach_reduction|0]§!, we are no longer a §YTerrorist Safe Haven§!, and stability changes by §R[?constant:random_terror_safe_haven.accept_host_stability|%0]§!. [From.GetName] gains Response Legitimacy and a better opinion of us."
random_terror_haven_demand_refuse_tt: "We remain a §YTerrorist Safe Haven§!, draw public condemnation for sheltering the network, and [From.GetName] thinks worse of us."
random_terror_safe_haven: "Terrorist Safe Haven"
random_terror_safe_haven_desc: "Armed networks train, rest and store weapons on this territory, and other governments hold its rulers responsible. Each safe haven raises Network Reach."
random_terror_safe_haven_cooperation: "Closed a terrorist safe haven"
random_terror_safe_haven_refusal: "Refused to close a terrorist safe haven"
random_terror_press_safe_haven: "Press [FROM.GetName] to Close Its Safe Haven"
random_terror_press_safe_haven_desc: "Present the evidence that the network behind our attacks shelters in [FROM.GetName], and demand that its government close the camps and hand over the cells."
random_terror_press_safe_haven_requirements_tt: "[FROM.GetName] must be a Terrorist Safe Haven whose territory or support fed our crisis, must not be an armed command itself, and must not have been pressed by us in the last §Y[?constant:random_terror_safe_haven.memory_days|0]§! days. No other demand of ours may be waiting for an answer."
random_terror_press_safe_haven_cost: "£pol_power §Y[?constant:random_terror_safe_haven.political_power|0]§!"
random_terror_press_safe_haven_cost_blocked: "£pol_power §R[?constant:random_terror_safe_haven.political_power|0]§!"
random_terror_press_safe_haven_cost_tooltip: "Spends £pol_power §Y[?constant:random_terror_safe_haven.political_power|0]§!."
random_terror_press_safe_haven_effect_tt: "[FROM.GetName] decides whether to close the safe haven. If it agrees, its sheltered cells weaken and Network Reach falls by §G[?constant:random_terror_safe_haven.accept_reach_reduction|0]§!; if it refuses, it draws public condemnation and we think worse of it."
chaosx.nr31.98.t: "The Final Command's Strength"
chaosx.nr31.99.t: "The Last Dispatch Is Closed"

chaosx.news.310.t: "Coordinated Attacks Cross Borders"
chaosx.news.310.d: "Bombings, ambushes, and transport attacks have struck several countries within days of one another. Investigators have found shared methods and supply links, while relief workers and security forces struggle to protect civilians."
chaosx.news.310.a: "The victims need protection."
chaosx.news.311.t: "A Transnational Terror Network Emerges"
chaosx.news.311.d: "Captured records reveal that formerly separate cells exchange couriers, money, weapons, and intelligence across borders. Governments are pooling information as the network searches for new corridors and safe havens."
chaosx.news.311.a: "Every route leaves a trace."
chaosx.news.312.t: "Armed Enclave Defies Its Government"
chaosx.news.312.d: "An extremist organization has seized lasting control of populated territory and proclaimed its own command. The parent government is preparing a counteroffensive while civilians flee requisitions and street fighting."
chaosx.news.312.a: "The crisis has become a war."
chaosx.news.313.t: "The Final Jihad"
chaosx.news.313.d: "The Jihadist International has ordered synchronized uprisings and territorial offensives against rival governments. Muslim states, clerics, soldiers, and community organizations are among its declared enemies and have called for determined resistance."
chaosx.news.313.a: "Defeat the final command."
chaosx.news.314.t: "The Broken Claim"
chaosx.news.314.d: "The final state has lost its command capitals, corridors, and territorial hold. Survivors are returning to shattered towns, though scattered cells and conflicting accounts of the vanished presence deny the world an easy peace."
chaosx.news.314.a: "We will remember them."
chaosx.news.315.t: "A Terror Network Collapses"
chaosx.news.315.d: "Government forces and local opponents have dismantled a major territorial network. Recovered towns now face the slower work of restoring services, accounting for the missing, and preventing surviving cells from returning."
chaosx.news.315.a: "Recovery begins with the living."

# Triggerable scenario
chaosx.scenarios.entry.id.global_jihad: "#016"
chaosx.scenarios.global_jihad.name: "Global Jihad"
chaosx.scenarios.global_jihad.desc: "Launch a worldwide crisis led by a wholly fictional jihadist movement. Choose how its networks deploy and how widely the initial wave spreads. Muslim governments and communities remain ordinary targets and determined opponents, never default supporters or recruits."
chaosx.scenarios.global_jihad.desc.dispersed_networks: "More countries gain active cells while few hold territory. Attacks reach cities, transport, borders, and capitals. Coordination starts strong and territorial control stays weak."
chaosx.scenarios.global_jihad.desc.border_corridors: "Smaller bands gather around connected borders, ports, rail routes, and vulnerable neighbors, with stronger outside supply and regional war pressure."
chaosx.scenarios.global_jihad.desc.capital_uprisings: "High-pressure cells form in capitals and administrative centers and open seizure missions, coup attempts, and short civil wars."
chaosx.scenarios.global_jihad.desc.territorial_fronts: "Large contiguous territories fall under militant control and conventional wars begin, with retaking, blockade, relief, and coalition objectives open at once."
chaosx.scenarios.global_jihad.desc.random_pattern: "A mixture of all four patterns is spread across the world, limited by the chosen intensity and by what each country can sustain."
chaosx.scenarios.type.global_jihad.dispersed_networks: "Scattered Cells"
chaosx.scenarios.type.global_jihad.border_corridors: "Border Corridors"
chaosx.scenarios.type.global_jihad.capital_uprisings: "Capital Uprisings"
chaosx.scenarios.type.global_jihad.territorial_fronts: "Territorial Fronts"
chaosx.scenarios.type.global_jihad.random_pattern: "Random Pattern"
chaosx.scenarios.global_jihad.impact.low: "A limited international crisis begins with a few active countries, one or two small territorial commands, weak coordination, and no immediate Final Jihad."
chaosx.scenarios.global_jihad.impact.medium: "Several countries receive active cells, territorial actors, and a connected international network."
chaosx.scenarios.global_jihad.impact.high: "Large territorial footholds, civil wars, active foreign routes, and coordinated offensives open across several regions."
chaosx.scenarios.global_jihad.impact.maximum: "A worldwide crisis begins with widespread cells, multiple territorial fronts, and The Final Jihad active. The False Revelation still requires its normal world-end conditions."
chaosx.scenarios.global_jihad.impact.active: "Global Jihad is already active."
chaosx.scenarios.launch_status.global_jihad.world_end: "Unavailable after a world-end scenario has begun."
chaosx.scenarios.launch_status.global_jihad.setup_in_progress: "The previous Global Jihad launch is still underway."
chaosx.scenarios.launch_status.global_jihad.already_launched: "Global Jihad has already been launched."
chaosx.scenarios.launch_status.global_jihad.unavailable: "No valid combination of countries, states, and territorial carriers is available."

# Super-events. The quotation wording is preserved exactly from the verified research package.
chaosx_super_event.114.t: "The False Revelation"
chaosx_super_event.114.d: "At the movement's command hall, witnesses report light without a source, shadows that do not agree, and orders transmitted before anyone admits to giving them. Extremist commanders proclaim the presence divine as rivals flee or turn their weapons against the claim. Governments, civic leaders, and Muslim religious authorities organize resistance while uprisings spread across the world."
chaosx_super_event.114.q: "\"There are more things in heaven and earth, Horatio, Than are dreamt of in your philosophy.\"\n- William Shakespeare, Hamlet"
chaosx_super_event.114.a: "All that glisters is not gold."
chaosx_super_event.115.t: "The Broken Claim"
chaosx_super_event.115.d: "Command centers have fallen, and the roads beyond them are filling with prisoners, displaced families, and survivors. Relief trains enter ruined districts as public life returns. The remaining cells have scattered, and no witness can explain whether the presence vanished, withdrew, or was ever what its followers claimed."
chaosx_super_event.115.q: "\"Those who cannot remember the past are condemned to repeat it.\"\n- George Santayana, The Life of Reason"
chaosx_super_event.115.a: "We will remember them."

