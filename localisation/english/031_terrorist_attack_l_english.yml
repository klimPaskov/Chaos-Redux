random_terror_seek_sponsor: "Seek a Foreign Sponsor"
random_terror_seek_sponsor_desc: "Offer access and influence in exchange for equipment, money, and diplomatic cover."
random_terror_seek_sponsor_requirements_tt: "Our command must be ready to act, must not be the final command, and must hold more than §Y[?constant:random_terror_value.low|0]§! Territorial Control. [FROM.GetName] must border us or share our faction, be at peace with us, not be the government we rose against, not be a cannibal power, have no other offer pending, and hold more than £pol_power §Y[?constant:random_terror_cost.partner_sponsor_political_power|0]§!, £infantry_equipment_text_icon §Y[?constant:random_terror_cost.partner_sponsor_infantry_equipment|0]§! and £support_equipment_text_icon §Y[?constant:random_terror_cost.partner_sponsor_support_equipment|0]§!."
random_terror_seek_sponsor_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_sponsor_authority|0]§!  £command_power §Y[?constant:random_terror_cost.allied_command_power|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_seek_sponsor_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_sponsor_authority|0]§!  £command_power §R[?constant:random_terror_cost.allied_command_power|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_seek_sponsor_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_sponsor_authority|0]§! Network Authority, £command_power §Y[?constant:random_terror_cost.allied_command_power|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!."
random_terror_seek_sponsor_effect_tt: "Searches for a sponsor and can establish an external support relationship."

random_terror_support_foreign_cell: "Support a Foreign Cell"
random_terror_support_foreign_cell_desc: "Send couriers, equipment, and instructions to a connected cell abroad."
random_terror_support_foreign_cell_requirements_tt: "A reachable foreign cell and sufficient Network Authority are required."
random_terror_support_foreign_cell_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_foreign_cell_authority|0]§!  £convoy_texticon §Y[?constant:random_terror_cost.actor_corridor_convoys|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.intelligence_support_equipment|0]§!"
random_terror_support_foreign_cell_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_foreign_cell_authority|0]§!  £convoy_texticon §R[?constant:random_terror_cost.actor_corridor_convoys|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.intelligence_support_equipment|0]§!"
random_terror_support_foreign_cell_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_foreign_cell_authority|0]§! Network Authority, £convoy_texticon §Y[?constant:random_terror_cost.actor_corridor_convoys|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.intelligence_support_equipment|0]§!."
random_terror_support_foreign_cell_effect_tt: "Strengthens the foreign cell and expands Network Reach."

random_terror_relocate_network: "Relocate the Network"
random_terror_relocate_network_desc: "Move a cell and its stores out of a district the government has started to search."
random_terror_relocate_network_requirements_tt: "A crisis state outside the actor's control must have been swept by its government, and its cell must not have moved already."
random_terror_relocate_network_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_relocate_authority|0]§!  £GFX_fuel_texticon §Y[?constant:random_terror_cost.military_reinforcement_fuel|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.security_support_equipment|0]§!"
random_terror_relocate_network_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_relocate_authority|0]§!  £GFX_fuel_texticon §R[?constant:random_terror_cost.military_reinforcement_fuel|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.security_support_equipment|0]§!"
random_terror_relocate_network_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_relocate_authority|0]§! Network Authority, £GFX_fuel_texticon §Y[?constant:random_terror_cost.military_reinforcement_fuel|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.security_support_equipment|0]§!."
random_terror_relocate_network_effect_tt: "The next government raid in [FROM.GetName] finds only empty safe houses and can at best partly succeed. Unless the Continuity Protocol is in force, the move costs some Territorial Control."

random_terror_convert_militia: "Convert the Militia"
random_terror_convert_militia_desc: "Reorganize irregular forces into trained territorial formations."
random_terror_convert_militia_requirements_tt: "The actor must control militia forces and have enough experience, equipment, and Network Authority."
random_terror_convert_militia_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_convert_experience|0]§!  £army_experience §Y[?constant:random_terror_cost.actor_convert_experience|0]§!  £infantry_equipment_text_icon §Y[?constant:random_terror_cost.actor_militia_equipment|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_convert_militia_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_convert_experience|0]§!  £army_experience §R[?constant:random_terror_cost.actor_convert_experience|0]§!  £infantry_equipment_text_icon §R[?constant:random_terror_cost.actor_militia_equipment|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_convert_militia_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_convert_experience|0]§! Network Authority, £army_experience §Y[?constant:random_terror_cost.actor_convert_experience|0]§!, £infantry_equipment_text_icon §Y[?constant:random_terror_cost.actor_militia_equipment|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!."
random_terror_convert_militia_effect_tt: "Retires the militia raised in [FROM.GetName] and trains it into one regular formation, raising Territorial Control."

random_terror_ideological_mobilization: "Begin Ideological Mobilization"
random_terror_ideological_mobilization_desc: "Expand recruitment and political control through the actor's declared program."
random_terror_ideological_mobilization_requirements_tt: "The ideological route and sufficient Network Authority are required."
random_terror_ideological_mobilization_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_foreign_cell_authority|0]§!  £manpower_texticon §Y[?constant:random_terror_cost.actor_mobilization_manpower|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_ideological_mobilization_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_foreign_cell_authority|0]§!  £manpower_texticon §R[?constant:random_terror_cost.actor_mobilization_manpower|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_ideological_mobilization_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_foreign_cell_authority|0]§! Network Authority, £manpower_texticon §Y[?constant:random_terror_cost.actor_mobilization_manpower|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!."
random_terror_ideological_mobilization_effect_tt: "One disciplined formation musters in [FROM.GetName], and a second one once the doctrine is codified.\nFor §Y[?constant:random_terror_mobilization.mobilization_days|0]§! days the command gains §YMobilized Cadres§!: recruitable population §G+[?constant:random_terror_mobilization.recruitment|%0]§! and stability §R[?constant:random_terror_mobilization.stability|%0]§!. The mobilization can be called again once it ends."

random_terror_absorb_actor: "Absorb a Rival Actor"
random_terror_absorb_actor_desc: "Merge a compatible territorial command, its forces, and its stockpiles into this actor."
random_terror_absorb_actor_requirements_tt: "[FROM.GetName] must be a compatible command with no merger offer pending that has never refused one from us, and this command needs enough Network Authority."
random_terror_absorb_actor_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_absorb_authority|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!  £GFX_fuel_texticon §Y[?constant:random_terror_cost.military_reinforcement_fuel|0]§!"
random_terror_absorb_actor_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_absorb_authority|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.actor_depot_support_equipment|0]§!  £GFX_fuel_texticon §R[?constant:random_terror_cost.military_reinforcement_fuel|0]§!"
random_terror_absorb_actor_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_absorb_authority|0]§! Network Authority, £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!, £GFX_fuel_texticon §Y[?constant:random_terror_cost.military_reinforcement_fuel|0]§!."
random_terror_absorb_actor_effect_tt: "Transfers the valid territory and resources without duplicating forces."

random_terror_contest_network_leader: "Contest the Network Leader"
random_terror_contest_network_leader_desc: "Challenge the dominant transnational command for control of the network."
random_terror_contest_network_leader_requirements_tt: "[FROM.GetName] must lead the network and must not have faced a challenge from us before, and this command needs enough Network Authority to sustain the challenge."
random_terror_contest_network_leader_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_contest_authority|0]§!  £command_power §Y[?constant:random_terror_cost.allied_command_power|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_contest_network_leader_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_contest_authority|0]§!  £command_power §R[?constant:random_terror_cost.allied_command_power|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_contest_network_leader_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_contest_authority|0]§! Network Authority, £command_power §Y[?constant:random_terror_cost.allied_command_power|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!."
random_terror_contest_network_leader_effect_tt: "Opens a leadership struggle and weakens the current leader if the contest succeeds."

random_terror_prepare_state_offensive: "Prepare a State Offensive"
random_terror_prepare_state_offensive_desc: "Plan an operation against an adjacent government-held state."
random_terror_prepare_state_offensive_requirements_tt: "A valid neighboring target and sufficient experience and Network Authority are required."
random_terror_prepare_state_offensive_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_offensive_experience|0]§!  £army_experience §Y[?constant:random_terror_cost.actor_offensive_experience|0]§!  £GFX_fuel_texticon §Y[?constant:random_terror_cost.military_reinforcement_fuel|0]§!  £infantry_equipment_text_icon §Y[?constant:random_terror_tuning.government_military_equipment|0]§!"
random_terror_prepare_state_offensive_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_offensive_experience|0]§!  £army_experience §R[?constant:random_terror_cost.actor_offensive_experience|0]§!  £GFX_fuel_texticon §R[?constant:random_terror_cost.military_reinforcement_fuel|0]§!  £infantry_equipment_text_icon §R[?constant:random_terror_tuning.government_military_equipment|0]§!"
random_terror_prepare_state_offensive_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_offensive_experience|0]§! Network Authority, £army_experience §Y[?constant:random_terror_cost.actor_offensive_experience|0]§!, £GFX_fuel_texticon §Y[?constant:random_terror_cost.military_reinforcement_fuel|0]§!, £infantry_equipment_text_icon §Y[?constant:random_terror_tuning.government_military_equipment|0]§!."
random_terror_prepare_state_offensive_effect_tt: "Claims [FROM.GetName], raises cell activity there ahead of the assault, and strengthens Territorial Control."

random_terror_build_civil_administration: "Build a Civil Administration"
random_terror_build_civil_administration_desc: "Replace improvised coercion with offices able to distribute supplies and maintain services."
random_terror_build_civil_administration_requirements_tt: "The actor must follow the War Directorate or have established Political Offices, control settled territory and retain enough Network Authority."
random_terror_build_civil_administration_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_administration_civilian_factories|0]§!  £manpower_texticon §Y[?constant:random_terror_tuning.government_military_manpower|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_build_civil_administration_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_administration_civilian_factories|0]§!  £manpower_texticon §R[?constant:random_terror_tuning.government_military_manpower|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_build_civil_administration_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_administration_civilian_factories|0]§! Network Authority, £manpower_texticon §Y[?constant:random_terror_tuning.government_military_manpower|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!."
random_terror_build_civil_administration_effect_tt: "Rebuilds roads and rail in [FROM.GetName] and raises Territorial Control and Network Authority."

random_terror_force_extraction: "Force Local Extraction"
random_terror_force_extraction_desc: "Seize food, fuel, and labor from the population under actor control."
random_terror_force_extraction_requirements_tt: "The actor must control a populated state and accept the legitimacy cost."
random_terror_force_extraction_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_extraction_legitimacy|0]§!  £manpower_texticon §Y[?constant:random_terror_tuning.government_military_manpower|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_force_extraction_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_extraction_legitimacy|0]§!  £manpower_texticon §R[?constant:random_terror_tuning.government_military_manpower|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_force_extraction_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_extraction_legitimacy|0]§! Network Authority, £manpower_texticon §Y[?constant:random_terror_tuning.government_military_manpower|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!."
random_terror_force_extraction_effect_tt: "Raises supply at the cost of local legitimacy and public condemnation."

random_terror_recruit_foreign_fighters: "Recruit Foreign Fighters"
random_terror_recruit_foreign_fighters_desc: "Move volunteers and experienced militants through the international network."
random_terror_recruit_foreign_fighters_requirements_tt: "The jihadist route, an open corridor, sufficient Network Authority, and fewer than §Y[?constant:random_terror_tuning.actor_division_cap|0]§! divisions are required. A new intake can follow §Y[?constant:random_terror_tuning.foreign_fighters_cooldown_days|0]§! days after the last."
random_terror_recruit_foreign_fighters_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_foreign_fighters_authority|0]§!  £convoy_texticon §Y[?constant:random_terror_cost.actor_corridor_convoys|0]§!  £infantry_equipment_text_icon §Y[?constant:random_terror_cost.actor_foreign_fighters_equipment|0]§!"
random_terror_recruit_foreign_fighters_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_foreign_fighters_authority|0]§!  £convoy_texticon §R[?constant:random_terror_cost.actor_corridor_convoys|0]§!  £infantry_equipment_text_icon §R[?constant:random_terror_cost.actor_foreign_fighters_equipment|0]§!"
random_terror_recruit_foreign_fighters_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_foreign_fighters_authority|0]§! Network Authority, £convoy_texticon §Y[?constant:random_terror_cost.actor_corridor_convoys|0]§!, £infantry_equipment_text_icon §Y[?constant:random_terror_cost.actor_foreign_fighters_equipment|0]§!."
random_terror_recruit_foreign_fighters_effect_tt: "Adds §Y[?constant:random_terror_tuning.foreign_fighter_manpower|0]§! manpower, §Y[?constant:random_terror_tuning.foreign_fighter_equipment|0]§! infantry equipment and one experienced volunteer formation, and extends Network Reach."

random_terror_join_jihadist_international: "Join the Jihadist International"
random_terror_join_jihadist_international_desc: "Submit this actor to the Jihadist International and its shared campaign."
random_terror_join_jihadist_international_requirements_tt: "[FROM.GetName] must lead the Jihadist International and must not have rejected us before, and this command must follow the jihadist route, stand outside the International and have no petition pending."
random_terror_join_jihadist_international_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_jihad_membership_authority|0]§!  £command_power §Y[?constant:random_terror_cost.allied_command_power|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_join_jihadist_international_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_jihad_membership_authority|0]§!  £command_power §R[?constant:random_terror_cost.allied_command_power|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_join_jihadist_international_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_jihad_membership_authority|0]§! Network Authority, £command_power §Y[?constant:random_terror_cost.allied_command_power|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!."
random_terror_join_jihadist_international_effect_tt: "Joins the international faction and contributes to International Unity."

random_terror_call_coordinated_uprising: "Call a Coordinated Uprising"
random_terror_call_coordinated_uprising_desc: "Order connected cells to rise where Terror Pressure and organization already support armed action."
random_terror_call_coordinated_uprising_requirements_tt: "The Final Jihad must be active, and our command must follow the Jihadist International or the False Revelation with enough Network Authority. [FROM.GetName] must be a linked crisis state outside our control, held by a government with Terror Pressure above §Y[?constant:random_terror_value.minimum_pressure_for_uprising|0]§! and no other emergency mission, with no rising under way and none in the last §Y[?constant:random_terror_tuning.state_cooldown_days|0]§! days."
random_terror_call_coordinated_uprising_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_uprising_authority|0]§!  £convoy_texticon §Y[?constant:random_terror_cost.actor_corridor_convoys|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.security_support_equipment|0]§!"
random_terror_call_coordinated_uprising_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_uprising_authority|0]§!  £convoy_texticon §R[?constant:random_terror_cost.actor_corridor_convoys|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.security_support_equipment|0]§!"
random_terror_call_coordinated_uprising_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_uprising_authority|0]§! Network Authority, £convoy_texticon §Y[?constant:random_terror_cost.actor_corridor_convoys|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.security_support_equipment|0]§!."
random_terror_call_coordinated_uprising_effect_tt: "Starts pressure-grounded uprisings without creating forces in peaceful states."

random_terror_accelerate_revelation: "Accelerate the Revelation"
random_terror_accelerate_revelation_desc: "Commit authority and supplies to the final command's disputed claim."
random_terror_accelerate_revelation_requirements_tt: "A viable Final Jihad command must satisfy every False Revelation requirement, including 1000 Chaos, and retain enough Network Authority."
random_terror_accelerate_revelation_cost: "£random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_revelation_authority|0]§!  £infantry_equipment_text_icon §Y[?constant:random_terror_cost.actor_foreign_fighters_equipment|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_accelerate_revelation_cost_blocked: "£random_terror_network_authority_texticon §R[?constant:random_terror_cost.actor_revelation_authority|0]§!  £infantry_equipment_text_icon §R[?constant:random_terror_cost.actor_foreign_fighters_equipment|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.actor_depot_support_equipment|0]§!"
random_terror_accelerate_revelation_cost_tooltip: "Spends £random_terror_network_authority_texticon §Y[?constant:random_terror_cost.actor_revelation_authority|0]§! Network Authority, £infantry_equipment_text_icon §Y[?constant:random_terror_cost.actor_foreign_fighters_equipment|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.actor_depot_support_equipment|0]§!."
random_terror_accelerate_revelation_effect_tt: "Accelerates the coalition's final revelation. Its Chaos, territorial, and military-readiness requirements must still be met."

# Missions
random_terror_contain_attack_wave: "Contain the Attack Wave"
random_terror_contain_attack_wave_desc: "Contain the attack wave in §Y[?random_terror_mission_target_containment.GetName]§! before the cells reorganize."
random_terror_contain_attack_wave_objective_tt: "Lower activity in §Y[?random_terror_mission_target_containment.GetName]§! by §Y[?constant:random_terror_tuning.mission_containment_activity_target|0]§! or clear its cells, while no other state of ours becomes an active crisis."
random_terror_contain_attack_wave_complete_tt: "The attack wave is contained and Terror Pressure falls."
random_terror_contain_attack_wave_partial_tt: "The wave subsides, but surviving cells preserve part of their network."
random_terror_contain_attack_wave_failure_tt: "The cells regroup and Terror Pressure rises."
random_terror_protect_transport_network: "Protect the Transport Network"
random_terror_protect_transport_network_desc: "Keep the transport network in §Y[?random_terror_mission_target_transport.GetName]§! open until the threat passes."
random_terror_protect_transport_network_objective_tt: "The mission fails if §Y[?random_terror_mission_target_transport.GetName]§! leaves our control, slips out of local control, or suffers §Y[?constant:random_terror_tuning.mission_transport_failure_disruptions|0]§! more attacks on its transport. One attack leaves only a partial result."
random_terror_protect_transport_network_complete_tt: "The corridor remains open and public confidence improves."
random_terror_protect_transport_network_partial_tt: "Traffic resumes after limited disruption."
random_terror_protect_transport_network_failure_tt: "The corridor is severed and the attackers exploit the disruption."
random_terror_break_cross_border_corridor: "Break the Cross-Border Corridor"
random_terror_break_cross_border_corridor_desc: "Dismantle the cross-border route through §Y[?random_terror_mission_target_corridor.GetName]§! carrying personnel and equipment."
random_terror_break_cross_border_corridor_objective_tt: "Keep the smuggling route through §Y[?random_terror_mission_target_corridor.GetName]§! closed while it stays under our control, and lower its activity by another §Y[?constant:random_terror_tuning.mission_corridor_activity_target|0]§!."
random_terror_break_cross_border_corridor_complete_tt: "The corridor is broken and the network loses reach."
random_terror_break_cross_border_corridor_partial_tt: "The corridor is damaged, but some traffic escapes detection."
random_terror_break_cross_border_corridor_failure_tt: "The route remains open and foreign support continues to arrive."
random_terror_prevent_capital_seizure: "Prevent the Capital's Seizure"
random_terror_prevent_capital_seizure_desc: "Hold §Y[?random_terror_mission_target_capital.GetName]§! and protect government continuity before the assault reaches the capital."
random_terror_prevent_capital_seizure_objective_tt: "The mission fails if §Y[?random_terror_mission_target_capital.GetName]§! leaves our control or slips out of local control. A new attack on the capital or a lost state leaves only a partial result."
random_terror_prevent_capital_seizure_complete_tt: "The capital holds and the uprising loses momentum."
random_terror_prevent_capital_seizure_partial_tt: "The capital remains under government control, but fighting damages its institutions."
random_terror_prevent_capital_seizure_failure_tt: "The capital falls into armed disorder and the government's authority collapses."
random_terror_retake_lost_state: "Retake the Lost State"
random_terror_retake_lost_state_desc: "Restore government control in §Y[?random_terror_mission_target_retake.GetName]§! before the enclave consolidates."
random_terror_retake_lost_state_objective_tt: "Take military control of §Y[?random_terror_mission_target_retake.GetName]§!."
random_terror_retake_lost_state_complete_tt: "Government forces recover the state and dismantle the enclave."
random_terror_retake_lost_state_partial_tt: "The state is recovered, but organized cells escape."
random_terror_retake_lost_state_failure_tt: "The enclave entrenches itself and claims lasting authority."
random_terror_restore_civil_authority: "Restore Civil Authority"
random_terror_restore_civil_authority_desc: "Reopen administration and services in §Y[?random_terror_mission_target_restore.GetName]§! before coercive rule takes hold."
random_terror_restore_civil_authority_objective_tt: "Lower activity in §Y[?random_terror_mission_target_restore.GetName]§! by §Y[?constant:random_terror_tuning.mission_restore_activity_target|0]§! and to no more than §Y[?constant:random_terror_tuning.state_activity_active_threshold|0]§! while it stays under our control."
random_terror_restore_civil_authority_complete_tt: "Civil administration resumes and local legitimacy recovers."
random_terror_restore_civil_authority_partial_tt: "Essential services return, though public trust remains fragile."
random_terror_restore_civil_authority_failure_tt: "Civil authority fails to return and local resistance deepens."
random_terror_hostage_deadline: "The Hostage Deadline"
random_terror_hostage_deadline_desc: "Recover the captives in §Y[?random_terror_mission_target_hostage.GetName]§! before their captors carry out the threat."
random_terror_hostage_deadline_objective_tt: "Free the captives in §Y[?random_terror_mission_target_hostage.GetName]§! with a security surge or a raid on the site."
random_terror_hostage_deadline_complete_tt: "The captives are recovered and the cell loses leverage."
random_terror_hostage_deadline_partial_tt: "Some captives are freed, but the cell's leaders escape and the deadline ends in bloodshed."
random_terror_hostage_deadline_failure_tt: "The deadline passes with the captives still in enemy hands."
random_terror_stop_coordinated_uprising: "Stop the Coordinated Uprising"
random_terror_stop_coordinated_uprising_desc: "Stop the uprising in §Y[?random_terror_mission_target_uprising.GetName]§! before the cells consolidate their territory."
random_terror_stop_coordinated_uprising_objective_tt: "Keep §Y[?random_terror_mission_target_uprising.GetName]§! under our control and break the uprising with a security surge or a raid, or lower its activity by §Y[?constant:random_terror_tuning.mission_uprising_activity_target|0]§!."
random_terror_stop_coordinated_uprising_complete_tt: "The uprisings are defeated and their coordination breaks down."
random_terror_stop_coordinated_uprising_partial_tt: "Most uprisings fail, but several armed pockets survive."
random_terror_stop_coordinated_uprising_failure_tt: "The uprisings seize lasting ground and reinforce one another."

# State map mode
MAPMODE_RANDOM_TERROR_STATE_MAP_MODE: "§Y$MAPMODE_RANDOM_TERROR_STATE_MAP_MODE_NAME$§! map mode"
MAPMODE_RANDOM_TERROR_STATE_MAP_MODE_NAME: "Terror Activity"
MAPMODE_RANDOM_TERROR_STATE_MAP_MODE_DESCRIPTION: "Shows where terror cells operate. Pale yellow, orange, dark orange, red and dark red mark Dormant, Active, Entrenched, Armed Insurgency and Lost Local Control, and borders grow thicker with each stage. Your own priority crisis state and mission states pulse."
random_terror_state_map_mode_tooltip: "§Y[FROM.GetName]§!"
random_terror_state_map_mode_tooltip_delayed: "[FROM.GetRandomTerrorStateMapModeDetail]"
random_terror_map_detail_clear: "No active terror cells."
random_terror_map_detail_dormant: "Stage: §YDormant Cells§!\nOur response: [FROM.GetRandomTerrorStateMapModeMission]\nNext risk: a new attack would turn the hidden contacts into an active cell."
random_terror_map_detail_active: "Stage: §OActive Cells§!\nOur response: [FROM.GetRandomTerrorStateMapModeMission]\nNext risk: repeated attacks can entrench the network here."
random_terror_map_detail_entrenched: "Stage: §OEntrenched Network§!\nOur response: [FROM.GetRandomTerrorStateMapModeMission]\nNext risk: recruits and stores can arm the cells."
random_terror_map_detail_armed: "Stage: §RArmed Insurgency§!\nOur response: [FROM.GetRandomTerrorStateMapModeMission]\nNext risk: armed formations can take the state out of government control."
random_terror_map_detail_lost: "Stage: §RLost Local Control§!\nOur response: [FROM.GetRandomTerrorStateMapModeMission]\nNext risk: the state can pass to a terrorist command or spread the crisis to its neighbours."
