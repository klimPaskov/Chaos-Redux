# National focuses
random_terror_founding_crisis: "Founding Crisis"
random_terror_founding_crisis_desc: "A shattered chain of command leaves the enclave fighting for territory, supplies, and a reason to endure."
random_terror_hold_the_enclave: "Hold the Enclave"
random_terror_hold_the_enclave_desc: "Defend the first refuge long enough to turn a temporary foothold into a functioning base."
random_terror_restore_supply: "Restore Supply"
random_terror_restore_supply_desc: "Recover stores and reopen local routes before hunger and ammunition shortages break the command."
random_terror_secure_command_center: "Secure the Command Center"
random_terror_secure_command_center_desc: "Concentrate communications and staff in a headquarters that can direct the surrounding territory."
random_terror_define_leadership: "Define the Leadership"
random_terror_define_leadership_desc: "Resolve who gives orders before rival commanders divide the enclave."
random_terror_restore_the_workshops: "Restore the Workshops"
random_terror_restore_the_workshops_desc: "Put captured tools and skilled labor back to work repairing the movement's equipment."
random_terror_secure_forward_depots: "Secure Forward Depots"
random_terror_secure_forward_depots_desc: "Disperse protected stores along the front to keep isolated formations supplied."
random_terror_fortify_the_headquarters: "Fortify the Headquarters"
random_terror_fortify_the_headquarters_desc: "Turn the command center into a defended position able to survive a direct assault."
random_terror_relocate_the_command: "Relocate the Command"
random_terror_relocate_the_command_desc: "Move the headquarters away from exposed routes before the enemy can encircle it."
random_terror_stabilize_the_capital: "Stabilize the Capital"
random_terror_stabilize_the_capital_desc: "Restore order and essential services in the occupied capital before resistance spreads."
random_terror_shadow_network_directorate: "Shadow Network Directorate"
random_terror_shadow_network_directorate_desc: "Place couriers, cells, and safehouses under a concealed council built to survive decapitation."
random_terror_seal_the_inner_circle: "Seal the Inner Circle"
random_terror_seal_the_inner_circle_desc: "Restrict sensitive plans to trusted members and close the easiest paths for infiltration."
random_terror_distribute_the_cells: "Distribute the Cells"
random_terror_distribute_the_cells_desc: "Give local cells enough independence to continue operating when contact is lost."
random_terror_layered_safehouses: "Layered Safehouses"
random_terror_layered_safehouses_desc: "Build overlapping shelters and fallback routes so one discovery does not expose the network."
random_terror_intelligence_by_whisper: "Intelligence by Whisper"
random_terror_intelligence_by_whisper_desc: "Turn local contacts, rumor, and discreet observation into an early warning system."
random_terror_hidden_radio_net: "Hidden Radio Net"
random_terror_hidden_radio_net_desc: "Link scattered commands through concealed transmitters and disciplined schedules."
random_terror_foreign_cell_channels: "Foreign Cell Channels"
random_terror_foreign_cell_channels_desc: "Establish secure couriers and signals with aligned cells beyond the border."
random_terror_foreign_cell_support: "Support the Foreign Cells"
random_terror_foreign_cell_support_desc: "Send equipment and organizers abroad to preserve the network's distant branches."
random_terror_protect_the_council: "Protect the Council"
random_terror_protect_the_council_desc: "Separate the movement's leadership from exposed operations and known meeting places."
random_terror_continuity_protocol: "Continuity Protocol"
random_terror_continuity_protocol_desc: "Prepare successors, sealed orders, and fallback headquarters before a leadership loss."
random_terror_relocate_the_network: "Relocate the Network"
random_terror_relocate_the_network_desc: "Shift personnel and stores away from compromised centers without breaking contact between cells."
random_terror_protect_the_route: "Protect the Route"
random_terror_protect_the_route_desc: "Guard the couriers and concealed crossings that bind the distributed network together."
random_terror_field_command_board: "Field Command Board"
random_terror_field_command_board_desc: "Give operational authority to commanders who can unite scattered armed formations."
random_terror_appoint_the_directorate: "Appoint the Directorate"
random_terror_appoint_the_directorate_desc: "Create a permanent military directorate with clear responsibility for planning and supply."
random_terror_command_the_front: "Command the Front"
random_terror_command_the_front_desc: "Coordinate neighboring sectors under one plan instead of separate local battles."
random_terror_capture_regular_formations: "Capture Regular Formations"
random_terror_capture_regular_formations_desc: "Force isolated regular units to surrender with their equipment and organization intact."
random_terror_standardize_captured_formations: "Standardize Captured Formations"
random_terror_standardize_captured_formations_desc: "Replace incompatible tables and procedures with a common structure across the armed force."
random_terror_field_radio_discipline: "Field Radio Discipline"
random_terror_field_radio_discipline_desc: "Impose secure radio practice so operational orders reach units without exposing headquarters."
random_terror_arm_the_territorial_brigades: "Arm the Territorial Brigades"
random_terror_arm_the_territorial_brigades_desc: "Issue captured weapons to locally raised brigades charged with holding the enclave."
random_terror_harden_the_defensive_line: "Harden the Defensive Line"
random_terror_harden_the_defensive_line_desc: "Prepare fieldworks and reserves along the approaches most likely to face attack."
random_terror_prepare_the_parent_offensive: "Prepare the Parent Offensive"
random_terror_prepare_the_parent_offensive_desc: "Gather fuel, ammunition, and intelligence for a deliberate strike against the parent government."
random_terror_command_the_armed_movement: "Command the Armed Movement"
random_terror_command_the_armed_movement_desc: "Bind the movement's brigades to a unified campaign and a single operational command."
random_terror_expand_the_force: "Expand the Force"
random_terror_expand_the_force_desc: "Raise additional formations from the population and equip them for sustained fighting."
random_terror_unify_the_brigades: "Unify the Brigades"
random_terror_unify_the_brigades_desc: "Merge local armed groups into a common order of battle with shared standards."
random_terror_convene_the_cadre: "Convene the Cadre"
random_terror_convene_the_cadre_desc: "Gather political organizers to settle doctrine, leadership, and the movement's public program."
random_terror_establish_political_offices: "Establish Political Offices"
random_terror_establish_political_offices_desc: "Create local offices able to recruit, administer, and enforce the cadre's decisions."
random_terror_codify_the_doctrine: "Codify the Doctrine"
random_terror_codify_the_doctrine_desc: "Turn competing slogans into a formal program that cadres can teach and enforce."
random_terror_disciplined_ranks: "Disciplined Ranks"
random_terror_disciplined_ranks_desc: "Make cadres answerable for recruitment, conduct, and obedience within their formations."
random_terror_authority_through_service: "Authority Through Service"
random_terror_authority_through_service_desc: "Earn compliance by protecting communities and maintaining the services the old state abandoned."
random_terror_claim_revolutionary_authority: "Claim Revolutionary Authority"
random_terror_claim_revolutionary_authority_desc: "Present the cadre as the sole political authority over the territory it controls."
random_terror_establish_forced_rule: "Establish Forced Rule"
random_terror_establish_forced_rule_desc: "Use surveillance and coercion to impose obedience where consent has failed."
random_terror_purge_the_hardliners: "Purge the Hardliners"
random_terror_purge_the_hardliners_desc: "Remove commanders whose violence threatens the cadre's control and public support."
random_terror_enthrone_the_ideological_state: "Enthrone the Ideological State"
random_terror_enthrone_the_ideological_state_desc: "Place every military and civil institution under the cadre's doctrine."
random_terror_smuggling_and_external_supply: "Smuggling and External Supply"
random_terror_smuggling_and_external_supply_desc: "Build concealed foreign routes that can carry equipment past guarded borders."
random_terror_open_the_border_corridor: "Open the Border Corridor"
random_terror_open_the_border_corridor_desc: "Secure a crossing and the local contacts needed to move supplies through it."
random_terror_secure_truck_convoys: "Secure Truck Convoys"
random_terror_secure_truck_convoys_desc: "Protect drivers, fuel, and vehicles on the roads feeding the enclave."
random_terror_salvage_the_rail_spur: "Salvage the Rail Spur"
random_terror_salvage_the_rail_spur_desc: "Repair a captured rail connection and recover rolling stock from the fighting."
random_terror_coerced_extraction: "Coerced Extraction"
random_terror_coerced_extraction_desc: "Seize food, fuel, and labor from controlled communities regardless of the political cost."
random_terror_control_the_market: "Control the Market"
random_terror_control_the_market_desc: "Bring trade and rationing under command supervision to direct scarce goods toward the war effort."
random_terror_secure_the_fuel_stores: "Secure the Fuel Stores"
random_terror_secure_the_fuel_stores_desc: "Guard captured reserves and organize distribution to vehicles and generators."
random_terror_administer_the_lost_state: "Administer the Lost State"
random_terror_administer_the_lost_state_desc: "Extend routine government into captured territory before armed factions fill the vacuum."
random_terror_build_the_regional_state: "Build the Regional State"
random_terror_build_the_regional_state_desc: "Join local offices into a territorial administration with a common budget and command."
random_terror_foreign_sponsorship: "Foreign Sponsorship"
random_terror_foreign_sponsorship_desc: "Seek a foreign patron willing to exchange equipment and advice for influence."
random_terror_identify_the_sponsor: "Identify the Sponsor"
random_terror_identify_the_sponsor_desc: "Determine which outside power can supply the enclave without immediately controlling it."
random_terror_align_with_the_patron: "Align with the Patron"
random_terror_align_with_the_patron_desc: "Adapt strategy and diplomacy to secure continued support from the chosen sponsor."
random_terror_patron_development: "Patron Development"
random_terror_patron_development_desc: "Use foreign advisers and material to expand infrastructure and administrative capacity."
random_terror_recruit_from_the_enclave: "Recruit from the Enclave"
random_terror_recruit_from_the_enclave_desc: "Draw volunteers and conscripts from the territory already under command."
random_terror_mobile_cell_columns: "Mobile Cell Columns"
random_terror_mobile_cell_columns_desc: "Organize light columns able to disperse, regroup, and strike beyond fixed lines."
random_terror_convert_the_militia: "Convert the Militia"
random_terror_convert_the_militia_desc: "Train irregular guards as territorial units capable of sustained combat."
random_terror_foreign_fighters: "Foreign Fighters"
random_terror_foreign_fighters_desc: "Bring experienced foreign volunteers through the network and place them under local command."
random_terror_map_the_network: "Map the Network"
random_terror_map_the_network_desc: "Identify every aligned cell, safe haven, corridor, and rival command within reach."
random_terror_protect_safe_havens: "Protect Safe Havens"
random_terror_protect_safe_havens_desc: "Defend the settlements and concealed sites that shelter personnel between operations."
random_terror_bargain_with_rivals: "Bargain with Rivals"
random_terror_bargain_with_rivals_desc: "Trade access, supplies, and recognition to prevent a destructive struggle between enclaves."
random_terror_merge_the_enclaves: "Merge the Enclaves"
random_terror_merge_the_enclaves_desc: "Unite compatible territorial commands under shared institutions and military planning."
random_terror_reconcile_the_factions: "Reconcile the Factions"
random_terror_reconcile_the_factions_desc: "Settle leadership and resource disputes before they divide the wider movement."
random_terror_event_31_faction_route: "A Common Front"
random_terror_event_31_faction_route_desc: "Turn a network of enclaves into a faction able to coordinate war and diplomacy."
random_terror_secure_recognition: "Secure Recognition"
random_terror_secure_recognition_desc: "Win external acceptance for the enclave's borders and governing authority."
