random_terror_support_victims_cost_tooltip: "Spends £support_equipment_text_icon §Y[?constant:random_terror_cost.victim_support_equipment|0]§!, £GFX_train_texticon §Y[?constant:random_terror_cost.transport_trains|0]§!, £manpower_texticon §Y[?constant:random_terror_tuning.government_military_manpower|0]§!."
