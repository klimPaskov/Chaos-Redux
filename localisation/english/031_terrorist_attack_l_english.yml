random_terror_establish_response_cell: "Establish a Response Cell"
random_terror_establish_response_cell_desc: "Create a joint command to coordinate investigators, relief services, and local security during the current attack wave."
random_terror_establish_response_cell_requirements_tt: "An affected country must hold an Active or worse crisis state and an open mission slot, and must not already run a response cell in this crisis."
random_terror_establish_response_cell_cost: "£command_power §Y[?constant:random_terror_cost.response_cell_command_power|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.response_cell_support_equipment|0]§!"
