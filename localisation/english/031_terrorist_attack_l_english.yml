random_terror_intelligence_sweep: "Conduct an Intelligence Sweep"
random_terror_intelligence_sweep_desc: "Coordinate investigators and local sources to identify cells, couriers, and stored weapons."
random_terror_intelligence_sweep_requirements_tt: "[FROM.GetName] must be an Active or Entrenched crisis state we control. We need a response cell or the Intelligence Priority emphasis and no intelligence breakthrough yet, and the attacks must not have exposed a wider network through sponsor evidence, smuggling routes, defections or community rejection, or pushed Terror Pressure above §Y[?constant:random_terror_value.high|0]§!."
random_terror_intelligence_sweep_cost: "£command_power §Y[?constant:random_terror_cost.intelligence_command_power|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.intelligence_support_equipment|0]§!"
random_terror_intelligence_sweep_cost_blocked: "£command_power §R[?constant:random_terror_cost.intelligence_command_power|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.intelligence_support_equipment|0]§!"
random_terror_intelligence_sweep_cost_tooltip: "Spends £command_power §Y[?constant:random_terror_cost.intelligence_command_power|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.intelligence_support_equipment|0]§!."
random_terror_intelligence_sweep_effect_tt: "Reveals network activity and can weaken active cells without a public crackdown. Each point of Response Capacity, up to §Y[?constant:random_terror_capacity.effective_cap|0]§!, removes §Y[?constant:random_terror_capacity.sweep_activity_per_point|0]§! more activity in [FROM.GetName]."

random_terror_security_surge: "Deploy a Security Surge"
random_terror_security_surge_desc: "Send mobile security teams to reinforce the most exposed crisis area."
random_terror_security_surge_requirements_tt: "An active crisis state must be available for reinforcement."
random_terror_security_surge_cost: "£command_power §Y[?constant:random_terror_cost.security_command_power|0]§!  £GFX_fuel_texticon §Y[?constant:random_terror_cost.security_fuel|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.security_support_equipment|0]§!"
random_terror_security_surge_cost_blocked: "£command_power §R[?constant:random_terror_cost.security_command_power|0]§!  £GFX_fuel_texticon §R[?constant:random_terror_cost.security_fuel|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.security_support_equipment|0]§!"
random_terror_security_surge_cost_tooltip: "Spends £command_power §Y[?constant:random_terror_cost.security_command_power|0]§!, £GFX_fuel_texticon §Y[?constant:random_terror_cost.security_fuel|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.security_support_equipment|0]§!."
random_terror_security_surge_effect_tt: "Strengthens local security, lowers immediate attack pressure, and begins Contain the Attack Wave. Without an intelligence breakthrough, a defection channel or allied intelligence, the surviving cell members scatter and can open a new crisis in a neighbouring state."
random_terror_security_surge_emergency_effect_tt: "Storms the hostage site or the uprising in [FROM.GetName]. Against an armed insurgency only some of the captives get out."

random_terror_targeted_raid: "Raid the Cell in [FROM.GetName]"
random_terror_targeted_raid_desc: "Strike a verified site in [FROM.GetName] with trained personnel and prepared detention teams."
random_terror_targeted_raid_requirements_tt: "[FROM.GetName] must be controlled and contain an active or entrenched organization."
random_terror_targeted_raid_cost: "£command_power §Y[?constant:random_terror_cost.targeted_raid_command_power|0]§!  £army_experience §Y[?constant:random_terror_cost.targeted_raid_army_experience|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.targeted_raid_support_equipment|0]§!"
random_terror_targeted_raid_cost_blocked: "£command_power §R[?constant:random_terror_cost.targeted_raid_command_power|0]§!  £army_experience §R[?constant:random_terror_cost.targeted_raid_army_experience|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.targeted_raid_support_equipment|0]§!"
random_terror_targeted_raid_cost_tooltip: "Spends £command_power §Y[?constant:random_terror_cost.targeted_raid_command_power|0]§!, £army_experience §Y[?constant:random_terror_cost.targeted_raid_army_experience|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.targeted_raid_support_equipment|0]§!."
random_terror_targeted_raid_effect_tt: "Attempts to reduce local activity and can free captives or break an uprising. Poor preparation can raise pressure, harm civilians, and damage legitimacy. Each point of Response Capacity, up to §Y[?constant:random_terror_capacity.effective_cap|0]§!, makes a clean raid more likely. A partial or costly raid scatters the survivors, who can open a new crisis in a neighbouring state unless a defection channel or allied intelligence keeps track of them."

random_terror_disrupt_support: "Disrupt the Corridor Through [FROM.GetName]"
random_terror_disrupt_support_desc: "Interdict couriers, cargo, and communications moving through [FROM.GetName]."
random_terror_disrupt_support_requirements_tt: "[FROM.GetName] must contain a recorded corridor or foreign-support route."
random_terror_disrupt_support_cost: "£convoy_texticon §Y[?constant:random_terror_cost.disrupt_convoys|0]§!  £command_power §Y[?constant:random_terror_cost.disrupt_command_power|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.intelligence_support_equipment|0]§!"
random_terror_disrupt_support_cost_blocked: "£convoy_texticon §R[?constant:random_terror_cost.disrupt_convoys|0]§!  £command_power §R[?constant:random_terror_cost.disrupt_command_power|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.intelligence_support_equipment|0]§!"
random_terror_disrupt_support_cost_tooltip: "Spends £convoy_texticon §Y[?constant:random_terror_cost.disrupt_convoys|0]§!, £command_power §Y[?constant:random_terror_cost.disrupt_command_power|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.intelligence_support_equipment|0]§!."
random_terror_disrupt_support_effect_tt: "Strikes the corridor now, weakening external supply and Network Reach, then begins Break the Cross-Border Corridor."

random_terror_request_allied_intelligence: "Request Allied Intelligence"
random_terror_request_allied_intelligence_desc: "Ask allies to pool intercepted traffic, border records, and known courier identities."
random_terror_request_allied_intelligence_requirements_tt: "An allied country and an active transnational threat are required."
random_terror_request_allied_intelligence_cost: "£command_power §Y[?constant:random_terror_cost.allied_command_power|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.intelligence_support_equipment|0]§!"
random_terror_request_allied_intelligence_cost_blocked: "£command_power §R[?constant:random_terror_cost.allied_command_power|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.intelligence_support_equipment|0]§!"
random_terror_request_allied_intelligence_cost_tooltip: "Spends £command_power §Y[?constant:random_terror_cost.allied_command_power|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.intelligence_support_equipment|0]§!."
random_terror_request_allied_intelligence_effect_tt: "Improves the intelligence picture and weakens Network Reach."

random_terror_offer_defection_channel: "Open a Defection Channel"
random_terror_offer_defection_channel_desc: "Guarantee a controlled surrender route for frightened members, coerced recruits, and compromised security personnel."
random_terror_offer_defection_channel_requirements_tt: "The crisis must have produced a plausible defection opportunity."
random_terror_offer_defection_channel_cost: "£command_power §Y[?constant:random_terror_cost.defection_command_power|0]§!  £manpower_texticon §Y[?constant:random_terror_tuning.government_military_manpower|0]§!  £support_equipment_text_icon §Y[?constant:random_terror_cost.intelligence_support_equipment|0]§!"
random_terror_offer_defection_channel_cost_blocked: "£command_power §R[?constant:random_terror_cost.defection_command_power|0]§!  £manpower_texticon §R[?constant:random_terror_tuning.government_military_manpower|0]§!  £support_equipment_text_icon §R[?constant:random_terror_cost.intelligence_support_equipment|0]§!"
random_terror_offer_defection_channel_cost_tooltip: "Spends £command_power §Y[?constant:random_terror_cost.defection_command_power|0]§!, £manpower_texticon §Y[?constant:random_terror_tuning.government_military_manpower|0]§!, £support_equipment_text_icon §Y[?constant:random_terror_cost.intelligence_support_equipment|0]§!."
random_terror_offer_defection_channel_effect_tt: "Can remove local organization strength and provide intelligence at a real security cost."

random_terror_movement_restrictions: "Impose Temporary Movement Restrictions"
random_terror_movement_restrictions_desc: "Restrict movement in the affected area while security teams search routes and public buildings."
random_terror_movement_restrictions_requirements_tt: "A severe active crisis must justify the restrictions."
random_terror_movement_restrictions_cost: "£stability_texticon §Y[?random_terror_movement_stability_cost|%0]§!  £support_equipment_text_icon §Y[?random_terror_movement_equipment_cost|0]§!  £manpower_texticon §Y[?constant:random_terror_tuning.government_military_manpower|0]§!"
random_terror_movement_restrictions_cost_blocked: "£stability_texticon §R[?random_terror_movement_stability_cost|%0]§!  £support_equipment_text_icon §R[?random_terror_movement_equipment_cost|0]§!  £manpower_texticon §R[?constant:random_terror_tuning.government_military_manpower|0]§!"
random_terror_movement_restrictions_cost_tooltip: "Spends £stability_texticon §Y[?random_terror_movement_stability_cost|%0]§!, £support_equipment_text_icon §Y[?random_terror_movement_equipment_cost|0]§!, £manpower_texticon §Y[?constant:random_terror_tuning.government_military_manpower|0]§!."
random_terror_movement_restrictions_effect_tt: "Suppresses local activity and stops cells from moving into new states while the restrictions last, but consumes manpower, equipment, and public trust. Each later use costs more Stability and support equipment, and repeated restrictions draw public condemnation."

random_terror_protect_community_sites: "Protect Community Sites"
random_terror_protect_community_sites_desc: "Guard vulnerable places of worship, relief centers, schools, and civic halls against attack."
