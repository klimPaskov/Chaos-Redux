random_terror_map_mission_none: "none"

# Staged state modifiers
random_terror_state_dormant: "Dormant Terror Cells"
random_terror_state_dormant_desc: "Hidden contacts and safe houses slow local work while the cells wait."
random_terror_state_active: "Active Terror Cells"
random_terror_state_active_desc: "Attacks on sites, routes and offices disrupt local production and construction."
random_terror_state_entrenched: "Entrenched Terror Network"
random_terror_state_entrenched_desc: "Recruiters, stores and hiding places reach into the population, draining output and recruits."
random_terror_state_armed_insurgency: "Armed Insurgency"
random_terror_state_armed_insurgency_desc: "Armed formations contest roads and towns, cutting output, recruitment and movement."
random_terror_state_lost_local_control: "Lost Local Control"
random_terror_state_lost_local_control_desc: "The authorities no longer hold the state; production, recruitment and movement collapse."

# National spirits
random_terror_improvised_command: "Improvised Command"
random_terror_improvised_command_desc: "Field leaders issue orders through fragile personal links and borrowed communications."
random_terror_captured_economy: "Captured Economy"
random_terror_captured_economy_desc: "Workshops and stores taken in the fighting keep the enclave supplied, but production remains disordered."
random_terror_contested_legitimacy: "Contested Legitimacy"
random_terror_contested_legitimacy_desc: "Rival authorities demand obedience while civilians judge them by security, food, and public conduct."
random_terror_distributed_command: "Distributed Command"
random_terror_distributed_command_desc: "Independent cells can survive the loss of a headquarters, though coordination suffers."
random_terror_network_directorate: "Network Directorate"
random_terror_network_directorate_desc: "A secretive council coordinates couriers, safehouses, and foreign contacts."
random_terror_unified_field_command: "Unified Field Command"
random_terror_unified_field_command_desc: "A single operational staff directs the armed movement and concentrates its forces."
random_terror_directorate_general_staff: "Directorate General Staff"
random_terror_directorate_general_staff_desc: "Captured officers and veteran commanders impose regular planning on irregular formations."
random_terror_cadre_authority: "Cadre Authority"
random_terror_cadre_authority_desc: "Political cadres bind local commands to a common program and enforce discipline."
random_terror_ideological_state: "Ideological State"
random_terror_ideological_state_desc: "The ruling cadre subjects administration, recruitment, and public life to its doctrine."
random_terror_compromised_network: "Compromised Network"
random_terror_compromised_network_desc: "Arrests and intercepted couriers expose cells that once operated unseen."
random_terror_rival_warlords: "Rival Warlords"
random_terror_rival_warlords_desc: "Local commanders hoard supplies and challenge every attempt at central control."
random_terror_doctrinal_schism: "Doctrinal Schism"
random_terror_doctrinal_schism_desc: "A dispute over purpose and authority divides the movement's cadres."
random_terror_external_supply_system: "External Supply System"
random_terror_external_supply_system_desc: "Smugglers and foreign cells move equipment through concealed border corridors."
random_terror_directed_war_economy: "Directed War Economy"
random_terror_directed_war_economy_desc: "The command allocates labor, fuel, and captured industry according to military need."
random_terror_civil_administration: "Civil Administration"
random_terror_civil_administration_desc: "Local offices distribute supplies, maintain services, and replace improvised coercion with routine rule."
random_terror_patron_development_mission: "Patron Development Mission"
random_terror_patron_development_mission_desc: "Foreign advisers and material aid expand the enclave's capacity while advancing the patron's influence."
random_terror_looting_spiral: "Looting Spiral"
random_terror_looting_spiral_desc: "Uncontrolled seizures destroy the markets and stores on which the armed movement depends."
random_terror_famine: "Famine"
random_terror_famine_desc: "Food systems have collapsed, leaving soldiers and civilians to compete for dwindling stocks."
random_terror_sponsor_dependency: "Sponsor Dependency"
random_terror_sponsor_dependency_desc: "Foreign aid sustains the command, but its patron can dictate priorities and withhold essential supplies."
random_terror_security_state: "Security State"
random_terror_security_state_desc: "Surveillance, checkpoints, and emergency powers reach into every part of public life."
random_terror_claimed_authority: "Claimed Authority"
random_terror_claimed_authority_desc: "The enclave presents itself as a government before its institutions or borders are secure."
random_terror_recognized_enclave: "Recognized Enclave"
random_terror_recognized_enclave_desc: "External recognition gives the territorial command diplomatic standing and firmer access to trade."
random_terror_international_mandate: "International Mandate"
random_terror_international_mandate_desc: "Foreign backing supports reconstruction and security while constraining independent action."
random_terror_local_revolt: "Local Revolt"
random_terror_local_revolt_desc: "Residents resist armed rule through strikes, sabotage, and open defiance."
random_terror_mass_defection: "Mass Defection"
random_terror_mass_defection_desc: "Whole formations walk away from the command with their weapons, and the units that stay no longer trust their officers."
random_terror_failed_rule: "Failed Rule"
random_terror_failed_rule_desc: "The armed authority can neither provide security nor command obedience beyond its checkpoints."
random_terror_presence_of_the_entity: "Presence of the Entity"
random_terror_presence_of_the_entity_desc: "An unexplained presence bends perception and command around a claim that no witness can verify."
random_terror_world_in_revolt: "World in Revolt"
random_terror_world_in_revolt_desc: "Coordinated uprisings force governments to defend capitals, corridors, and isolated garrisons at once."
random_terror_supply_through_ruin: "Supply Through Ruin"
random_terror_supply_through_ruin_desc: "The final command feeds its armies by stripping devastated territory of whatever remains."
random_terror_entity_presence: "Presence of the Entity"
random_terror_entity_presence_desc: "An unexplained presence bends perception and command around a claim that no witness can verify. Its hold weakens when the command capital falls, when the surviving commands are destroyed, and when International Unity breaks."
random_terror_entity_revolt: "World in Revolt"
random_terror_entity_revolt_desc: "Coordinated uprisings force governments to defend capitals, corridors, and isolated garrisons at once. The revolt fades as the worst-hit countries restore order and the surviving commands are destroyed."
random_terror_entity_ruin: "Supply Through Ruin"
random_terror_entity_ruin_desc: "The final command feeds its armies by stripping devastated territory of whatever remains. Every port, developed state and outside supply line it loses leaves its armies hungrier."
random_terror_ambiguous_light_strength_tt: "Presence of the Entity, World in Revolt and Supply Through Ruin each gain §G[?constant:random_terror_terminal_strength.focus_overlay_points|0]§! points."

