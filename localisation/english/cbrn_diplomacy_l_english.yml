l_english:
cbrn_international_response_category: "CBRN International Response"
cbrn_international_response_category_desc: "Inspections, forensic samples and relief supplies can establish responsibility for an unconventional attack and reduce the harm left on the ground."

cbrn_demand_inspections: "Demand Inspections of [FROM.GetNameDef]"
cbrn_demand_inspections_desc: "Demand access for a technically equipped inspection team. The condemned government must open its stockpiles and restricted facilities or refuse. Letting the deadline pass counts as public obstruction."
cbrn_demand_inspections_cost: "§Y[?black_friday_cbrn_inspection_instrument_cost|0]§! £cbrn_instruments_texticon §Y[?black_friday_cbrn_inspection_support_cost|0]§! £support_equipment_text_icon"
cbrn_demand_inspections_cost_blocked: "§R[?black_friday_cbrn_inspection_instrument_cost|0]§! £cbrn_instruments_texticon §R[?black_friday_cbrn_inspection_support_cost|0]§! £support_equipment_text_icon"
cbrn_demand_inspections_cost_tooltip: "The displayed instruments and support equipment are consumed when the demand is issued."
cbrn_demand_inspections_requirements_tt: "The target must be a foreign government at Formal Censure or above that we are sanctioning. It must not be at war with us or have an active inspection, a refused-inspection policy or a pending CBRN inspection demand. The inspection-demand cooldown must have ended."
cbrn_demand_inspections_tt: "[FROM.GetNameDef] gets a §Y[This.GetCbrnDiplomacyValueDurationInspectionResponseDays]-day§! inspection deadline. Acceptance admits international inspectors. Refusal or silence adds public Cover-up pressure. The listed equipment is used up immediately."

cbrn_answer_inspection_demand_mission: "Answer the Inspection Demand"
cbrn_answer_inspection_demand_mission_desc: "[?cbrn_inspection_demand_source.GetNameDef] has demanded access to our military depots, unconventional stockpiles, and restricted facilities. We must use §YAccept International Inspections§! or §YRefuse the Inspectors§! in the §YCondemnation Response§! category before the deadline."
cbrn_answer_inspection_demand_timeout_tt: "Silence counts as refusal while the demanding country exists. Inspectors and observers withdraw and public Cover-up pressure rises. If the demanding government is gone, the deadline lapses without penalty."

cbrn_share_forensic_evidence: "Publish Evidence: [FROM.GetName]"
cbrn_share_forensic_evidence_desc: "Authenticate a preserved sample, device fragment or laboratory paper from a chemical attack or detected ordinary biological outbreak in this state."
cbrn_share_forensic_evidence_cost: "§Y[?black_friday_cbrn_forensic_instrument_cost|0]§! £cbrn_instruments_texticon §Y[?black_friday_cbrn_forensic_support_cost|0]§! £support_equipment_text_icon §Y[This.GetCbrnDiplomacyValueFactoryUseForensicPublication]§! £civ_factory"
cbrn_share_forensic_evidence_cost_blocked: "§R[?black_friday_cbrn_forensic_instrument_cost|0]§! £cbrn_instruments_texticon §R[?black_friday_cbrn_forensic_support_cost|0]§! £support_equipment_text_icon §R[This.GetCbrnDiplomacyValueFactoryUseForensicPublication]§! £civ_factory"
cbrn_share_forensic_evidence_cost_tooltip: "The displayed instruments and support equipment are spent at dispatch. The listed civilian factories stay assigned during authentication."
cbrn_share_forensic_evidence_requirements_tt: "Requires an intelligence agency, Chemical Detection Paper or Field Epidemiology Teams, and control of a state with an open chemical attack or detected ordinary-pathogen outbreak. Chemical evidence can still be published after the responsible country is gone, and no successor or proxy inherits its penalties."
cbrn_share_forensic_evidence_begin_tt: "A forensic team picks the strongest eligible chemical attack or detected ordinary-pathogen outbreak in [FROM.GetName] and spends §Y[This.GetCbrnDiplomacyValueDurationForensicPublicationDays] days§! authenticating its evidence. Later attacks or outbreaks cannot replace the chosen case. The assigned civilian factories support the examination."
cbrn_share_forensic_evidence_complete_tt: "The chosen case gains §Y[This.GetCbrnDiplomacyValueEvidenceForensicPublicationAdd] evidence§!. An attributed chemical attack adds only the condemnation not yet charged for it. A biological outbreak advances only while it is still the chosen outbreak. If the responsible country is gone, its confirmed attack is closed and no penalty passes to another country. Delivery odds, deaths, contamination and use history do not change."

cbrn_sponsor_decontamination_mission: "Sponsor Cleanup: [FROM.GetName]"
cbrn_sponsor_decontamination_mission_desc: "Send protected wash columns and transport crews into a consenting foreign-controlled contaminated state."
cbrn_sponsor_decontamination_mission_cost: "§Y[?black_friday_cbrn_decon_masks_cost|0]§! £GFX_archetype_gas_mask_equipment_medium §Y[?black_friday_cbrn_decon_equipment_cost|0]§! £GFX_decontamination_equipment_1_medium §Y[?black_friday_cbrn_decon_trucks_cost|0]§! £GFX_motorized_equipment_text_icon"
cbrn_sponsor_decontamination_mission_cost_blocked: "§R[?black_friday_cbrn_decon_masks_cost|0]§! £GFX_archetype_gas_mask_equipment_medium §R[?black_friday_cbrn_decon_equipment_cost|0]§! £GFX_decontamination_equipment_1_medium §R[?black_friday_cbrn_decon_trucks_cost|0]§! £GFX_motorized_equipment_text_icon"
cbrn_sponsor_decontamination_mission_cost_tooltip: "The displayed equipment is consumed at dispatch. £civ_factory §Y[?black_friday_cbrn_decon_factory_cost|0]§! remains assigned for [This.GetCbrnDiplomacyValueDurationDeconMissionDays] days."
cbrn_sponsor_decontamination_mission_requirements_tt: "Requires Field Decontamination Kits. The selected chemically contaminated foreign state must be controlled by an ally, subject, inspection partner, observer host, or designated humanitarian CBRN corridor partner. Its controller must not be at war with us."
cbrn_sponsor_decontamination_mission_begin_tt: "A [This.GetCbrnDiplomacyValueDurationDeconMissionDays]-day foreign cleanup mission begins. Assigned civilian factories remain committed until it ends. Access must remain open and the selected state must stay under the partner's control."
cbrn_sponsor_decontamination_mission_complete_tt: "If contamination remains, the mission removes §Y[This.GetCbrnDiplomacyValueDeconTraceOrLocalCleanup]/[This.GetCbrnDiplomacyValueDeconSeriousCleanup]/[This.GetCbrnDiplomacyValueDeconSevereCleanup]/[This.GetCbrnDiplomacyValueDeconCatastrophicCleanup] points§! at Trace-or-Local/Serious/Severe/Catastrophic severity and lowers Medical Saturation by §Y[This.GetCbrnDiplomacyValueDeconMedicalSaturationReduction]§!. International Medical Mission improves cleanup by §G[This.GetCbrnDiplomacyValueDeconInternationalMedicalMissionMult]§!. Open chemical evidence is reviewed while crews are working. If the state is already clear, they stand down without another cleanup. Deaths and responsibility remain."
cbrn_sponsor_decontamination_mission_cancel_tt: "Loss of diplomatic access ends the mission. Committed consumables and transport are not returned, and no cleanup is applied."

cbrn_inspection_demanded: "Demanded CBRN Inspections"
cbrn_international_decontamination_aid: "Sponsored Decontamination Relief"

condemnation.context.forensic_disclosure: "CBRN forensic evidence published"

