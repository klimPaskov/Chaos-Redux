l_english:
cbrn_international_response_category: "CBRN International Response"
cbrn_international_response_category_desc: "Inspection pressure, preserved forensic records, and material relief can turn a hidden unconventional attack into an attributable act while reducing the harm that remains on the ground."

cbrn_demand_inspections: "Demand Inspections of [FROM.GetNameDef]"
cbrn_demand_inspections_desc: "Send a technically equipped inspection demand to the condemned government. It must open its stockpiles and restricted facilities, refuse access, or let the deadline expire as a public obstruction."
cbrn_demand_inspections_cost: "§Y[?constant:cbrn_diplomacy_cost.inspection_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.inspection_support|0]§!"
cbrn_demand_inspections_cost_blocked: "§R[?constant:cbrn_diplomacy_cost.inspection_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §R[?constant:cbrn_diplomacy_cost.inspection_support|0]§!"
cbrn_demand_inspections_cost_tooltip: "§Y[?constant:cbrn_diplomacy_cost.inspection_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.inspection_support|0]§!"
cbrn_demand_inspections_requirements_tt: "Requires a foreign government at Formal Censure or above that is not at war with us and has no active international inspection, refused-inspection policy, or CBRN inspection demand. The displayed equipment must be available."
cbrn_demand_inspections_tt: "[FROM.GetNameDef] receives a §Y[?constant:cbrn_diplomacy_duration.inspection_response_days|0]-day§! inspection deadline. Acceptance grants international inspectors access. Refusal or silence creates public Coverup pressure. The inspection team consumes the listed equipment immediately."

cbrn_answer_inspection_demand_mission: "Answer the Inspection Demand"
cbrn_answer_inspection_demand_mission_desc: "[?cbrn_inspection_demand_source.GetNameDef] has demanded access to our military depots, unconventional stockpiles, and restricted facilities. We must accept international inspections or refuse them before the deadline."
cbrn_answer_inspection_demand_timeout_tt: "Silence is recorded as a refused inspection while the demanding country remains active. Active inspections and observers are withdrawn, and public Coverup pressure is added. If the demander no longer exists, the expired demand simply clears."

cbrn_share_forensic_evidence: "Publish CBRN Evidence from [FROM.GetName]"
cbrn_share_forensic_evidence_desc: "Authenticate a preserved sample, device fragment, laboratory record, or chain-of-custody file tied to a recorded chemical attack or detected ordinary biological episode in this state."
cbrn_share_forensic_evidence_cost: "§Y[?constant:cbrn_diplomacy_cost.forensic_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.forensic_support|0]§!  £civ_factory §Y[?constant:cbrn_diplomacy_factory_use.forensic_publication|0]§!"
cbrn_share_forensic_evidence_cost_blocked: "§R[?constant:cbrn_diplomacy_cost.forensic_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §R[?constant:cbrn_diplomacy_cost.forensic_support|0]§!  £civ_factory §R[?constant:cbrn_diplomacy_factory_use.forensic_publication|0]§!"
cbrn_share_forensic_evidence_cost_tooltip: "§Y[?constant:cbrn_diplomacy_cost.forensic_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.forensic_support|0]§!  £civ_factory §Y[?constant:cbrn_diplomacy_factory_use.forensic_publication|0]§! while the publication is active"
cbrn_share_forensic_evidence_requirements_tt: "Requires an intelligence agency, Chemical Detection Paper, or Field Epidemiology Teams; the displayed resources and civilian factory; and a state we control with an unshared chemical action or detected ordinary-pathogen episode whose recorded actor still exists."
cbrn_share_forensic_evidence_begin_tt: "A forensic team spends §Y[?constant:cbrn_diplomacy_duration.forensic_publication_days|0] days§! authenticating the strongest unpublished record in [FROM.GetName]. One Civilian Factory supports the examination."
cbrn_share_forensic_evidence_complete_tt: "The selected record gains §Y[?constant:cbrn_diplomacy_evidence.forensic_publication_add|0] evidence§!. Chemical responsibility exposes only the additional unpaid liability of this exact action justified by its resulting attribution band; a biological record advances its own attribution. Delivery odds, deaths, contamination, and use history are unchanged."

cbrn_sponsor_decontamination_mission: "Sponsor Decontamination in [FROM.GetName]"
cbrn_sponsor_decontamination_mission_desc: "Send protected wash columns, detection teams, transport, and relief stores into a consenting foreign-controlled contaminated state."
cbrn_sponsor_decontamination_mission_cost: "£civ_factory §Y[?constant:cbrn_diplomacy_factory_use.decon_mission|0]§!  §YRelief Package§!"
cbrn_sponsor_decontamination_mission_cost_blocked: "£civ_factory §R[?constant:cbrn_diplomacy_factory_use.decon_mission|0]§!  §RRelief Package§!"
cbrn_sponsor_decontamination_mission_cost_tooltip: "§Y[?constant:cbrn_diplomacy_cost.decon_masks|0] Masks§!  §Y[?constant:cbrn_diplomacy_cost.decon_equipment|0] Decontamination Sets§!  §Y[?constant:cbrn_diplomacy_cost.decon_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.decon_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.decon_trucks|0]§!  £GFX_topbar_convoys §Y[?constant:cbrn_diplomacy_cost.decon_convoys|0]§!  £civ_factory §Y[?constant:cbrn_diplomacy_factory_use.decon_mission|0]§! while the mission is active"
cbrn_sponsor_decontamination_mission_requirements_tt: "Requires Field Decontamination Kits, the displayed relief package and civilian factories, and a chemically contaminated foreign state whose controller is an ally, subject, inspection partner, or observer host. The controller must not be at war with us."
cbrn_sponsor_decontamination_mission_begin_tt: "The listed equipment is consumed and two Civilian Factories support a §Y[?constant:cbrn_diplomacy_duration.decon_mission_days|0]-day§! foreign mission. Access must remain open and the state must not enter war against us."
cbrn_sponsor_decontamination_mission_complete_tt: "The mission removes §Y12/10/8/5 contamination points§! from a Trace-or-Local/Serious/Severe/Catastrophic state and lowers Medical Saturation by §Y[?constant:cbrn_diplomacy_decon.medical_saturation_reduction|0]§!. An International Medical Mission designer strengthens cleanup by §G25%§!. If the state still holds observable chemical evidence, foreign observers can raise that exact action to its next attribution band once. Recorded deaths and responsibility remain."
cbrn_sponsor_decontamination_mission_cancel_tt: "Loss of diplomatic access ends the mission. Committed consumables and transport are not returned, and no cleanup is applied."

cbrn_inspection_demanded: "Demanded CBRN Inspections"
cbrn_international_decontamination_aid: "Sponsored Decontamination Relief"

condemnation.context.forensic_disclosure: "CBRN forensic evidence published"
