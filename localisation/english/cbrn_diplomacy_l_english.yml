l_english:
cbrn_international_response_category: "CBRN International Response"
cbrn_international_response_category_desc: "Inspection pressure, preserved forensic records, and material relief can turn a hidden unconventional attack into an attributable act and reduce the harm that remains on the ground."

cbrn_demand_inspections: "Demand Inspections of [FROM.GetNameDef]"
cbrn_demand_inspections_desc: "Send a technically equipped inspection demand to the condemned government. It must open its stockpiles and restricted facilities, refuse access, or let the deadline expire as a public obstruction."
cbrn_demand_inspections_cost: "§Y[This.GetCbrnDiplomacyValueCostInspectionInstruments]§! £cbrn_instruments_texticon £support_equipment_text_icon §Y[This.GetCbrnDiplomacyValueCostInspectionSupport]§!"
cbrn_demand_inspections_cost_blocked: "§R[This.GetCbrnDiplomacyValueCostInspectionInstruments]§! £cbrn_instruments_texticon £support_equipment_text_icon §R[This.GetCbrnDiplomacyValueCostInspectionSupport]§!"
cbrn_demand_inspections_cost_tooltip: "The displayed instruments and support equipment are consumed when the demand is issued."
cbrn_demand_inspections_requirements_tt: "Requires a foreign government at Formal Censure or above whose active sanctions participants include us. The target must not be at war with us or have an active international inspection, refused-inspection policy, or CBRN inspection demand. The inspection-demand cooldown must have ended."
cbrn_demand_inspections_tt: "[FROM.GetNameDef] receives a §Y[This.GetCbrnDiplomacyValueDurationInspectionResponseDays]-day§! inspection deadline. Acceptance grants international inspectors access. Refusal or silence creates public Coverup pressure. The inspection team consumes the listed equipment immediately."

cbrn_answer_inspection_demand_mission: "Answer the Inspection Demand"
cbrn_answer_inspection_demand_mission_desc: "[?cbrn_inspection_demand_source.GetNameDef] has demanded access to our military depots, unconventional stockpiles, and restricted facilities. We must use §YAccept International Inspections§! or §YRefuse the Inspectors§! in the §YCondemnation Response§! category before the deadline."
cbrn_answer_inspection_demand_timeout_tt: "Silence is recorded as a refused inspection while the demanding country remains active. Active inspections and observers are withdrawn, and public Coverup pressure is added. If the demander no longer exists, the expired demand simply clears."

cbrn_share_forensic_evidence: "Publish CBRN Evidence from [FROM.GetName]"
cbrn_share_forensic_evidence_desc: "Authenticate a preserved sample, device fragment, laboratory record, or chain-of-custody file tied to a recorded chemical attack or detected ordinary biological episode in this state."
cbrn_share_forensic_evidence_cost: "§Y[This.GetCbrnDiplomacyValueCostForensicInstruments]§! £cbrn_instruments_texticon £support_equipment_text_icon §Y[This.GetCbrnDiplomacyValueCostForensicSupport]§! £civ_factory §Y[This.GetCbrnDiplomacyValueFactoryUseForensicPublication]§!"
cbrn_share_forensic_evidence_cost_blocked: "§R[This.GetCbrnDiplomacyValueCostForensicInstruments]§! £cbrn_instruments_texticon £support_equipment_text_icon §R[This.GetCbrnDiplomacyValueCostForensicSupport]§! £civ_factory §R[This.GetCbrnDiplomacyValueFactoryUseForensicPublication]§!"
cbrn_share_forensic_evidence_cost_tooltip: "The displayed instruments and support equipment are spent at dispatch. The listed civilian factories stay assigned during authentication."
cbrn_share_forensic_evidence_requirements_tt: "Requires an intelligence agency, Chemical Detection Paper, or Field Epidemiology Teams, and control of a state with an open case of a chemical attack or detected ordinary-pathogen episode. Chemical evidence remains publishable when the responsible country no longer exists, and no successor or proxy inherits its penalties."
cbrn_share_forensic_evidence_begin_tt: "A forensic team selects the strongest eligible chemical attack or detected ordinary-pathogen outbreak in [FROM.GetName], then spends §Y[This.GetCbrnDiplomacyValueDurationForensicPublicationDays] days§! authenticating its evidence. Later attacks or outbreaks cannot replace the selected case. The assigned civilian factories support the examination."
cbrn_share_forensic_evidence_complete_tt: "The selected case gains §Y[This.GetCbrnDiplomacyValueEvidenceForensicPublicationAdd] evidence§!. An attributed chemical attack exposes only condemnation not already charged for that attack. A biological outbreak advances only if it remains the selected outbreak. If the responsible country no longer exists, its confirmed chemical attack is closed without transferring penalties to another country. Delivery odds, deaths, contamination, and use history are unchanged."

cbrn_sponsor_decontamination_mission: "Sponsor Decontamination in [FROM.GetName]"
cbrn_sponsor_decontamination_mission_desc: "Send protected wash columns and transport crews into a consenting foreign-controlled contaminated state."
cbrn_sponsor_decontamination_mission_cost: "§Y[This.GetCbrnDiplomacyValueCostDeconMasks]§! £GFX_gas_mask_equipment_1_medium §Y[This.GetCbrnDiplomacyValueCostDeconEquipment]§! £GFX_decontamination_equipment_1_medium §Y[This.GetCbrnDiplomacyValueCostDeconTrucks]§! £GFX_motorized_equipment_text_icon"
cbrn_sponsor_decontamination_mission_cost_blocked: "§R[This.GetCbrnDiplomacyValueCostDeconMasks]§! £GFX_gas_mask_equipment_1_medium §R[This.GetCbrnDiplomacyValueCostDeconEquipment]§! £GFX_decontamination_equipment_1_medium §R[This.GetCbrnDiplomacyValueCostDeconTrucks]§! £GFX_motorized_equipment_text_icon"
cbrn_sponsor_decontamination_mission_cost_tooltip: "The equipment is consumed when dispatched. £civ_factory §Y[This.GetCbrnDiplomacyValueFactoryUseDeconMission]§! remain assigned for [This.GetCbrnDiplomacyValueDurationDeconMissionDays] days."
cbrn_sponsor_decontamination_mission_requirements_tt: "Requires Field Decontamination Kits. The selected chemically contaminated foreign state must be controlled by an ally, subject, inspection partner, observer host, or designated humanitarian CBRN corridor partner. Its controller must not be at war with us."
cbrn_sponsor_decontamination_mission_begin_tt: "A [This.GetCbrnDiplomacyValueDurationDeconMissionDays]-day foreign cleanup mission begins. [This.GetCbrnDiplomacyValueFactoryUseDeconMission] civilian factories remain assigned until it ends. Access must remain open and the selected state must stay under the partner's control."
cbrn_sponsor_decontamination_mission_complete_tt: "The mission removes §Y[This.GetCbrnDiplomacyValueDeconTraceOrLocalCleanup]/[This.GetCbrnDiplomacyValueDeconSeriousCleanup]/[This.GetCbrnDiplomacyValueDeconSevereCleanup]/[This.GetCbrnDiplomacyValueDeconCatastrophicCleanup] contamination points§! from a Trace-or-Local/Serious/Severe/Catastrophic state and lowers Medical Saturation by §Y[This.GetCbrnDiplomacyValueDeconMedicalSaturationReduction]§!. An International Medical Mission designer multiplies cleanup by §G[This.GetCbrnDiplomacyValueDeconInternationalMedicalMissionMult]§!. If the state still holds observable chemical evidence, foreign observers advance the strongest still-open chemical attack case. Recorded deaths and responsibility remain."
cbrn_sponsor_decontamination_mission_cancel_tt: "Loss of diplomatic access ends the mission. Committed consumables and transport are not returned, and no cleanup is applied."

cbrn_inspection_demanded: "Demanded CBRN Inspections"
cbrn_international_decontamination_aid: "Sponsored Decontamination Relief"

condemnation.context.forensic_disclosure: "CBRN forensic evidence published"

