l_english:
cbrn_international_response_category: "CBRN International Response"
cbrn_international_response_category_desc: "Inspection pressure, preserved forensic records, and material relief can turn a hidden unconventional attack into an attributable act while reducing the harm that remains on the ground."

cbrn_demand_inspections: "Demand Inspections of [FROM.GetNameDef]"
cbrn_demand_inspections_desc: "Send a technically equipped inspection demand to the condemned government. It must open its stockpiles and restricted facilities, refuse access, or let the deadline expire as a public obstruction."
cbrn_demand_inspections_cost: "§Y[?constant:cbrn_diplomacy_cost.inspection_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.inspection_support|0]§!"
cbrn_demand_inspections_cost_blocked: "§R[?constant:cbrn_diplomacy_cost.inspection_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §R[?constant:cbrn_diplomacy_cost.inspection_support|0]§!"
cbrn_demand_inspections_cost_tooltip: "§Y[?constant:cbrn_diplomacy_cost.inspection_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.inspection_support|0]§!"
cbrn_demand_inspections_requirements_tt: "Requires a foreign government at Formal Censure or above whose active sanctions participants include us. The target must not be at war with us or have an active international inspection, refused-inspection policy, or CBRN inspection demand. We must have the displayed equipment and no inspection-demand cooldown."
cbrn_demand_inspections_tt: "[FROM.GetNameDef] receives a §Y[?constant:cbrn_diplomacy_duration.inspection_response_days|0]-day§! inspection deadline. Acceptance grants international inspectors access. Refusal or silence creates public Coverup pressure. The inspection team consumes the listed equipment immediately."

cbrn_answer_inspection_demand_mission: "Answer the Inspection Demand"
cbrn_answer_inspection_demand_mission_desc: "[?cbrn_inspection_demand_source.GetNameDef] has demanded access to our military depots, unconventional stockpiles, and restricted facilities. We must use §YAccept International Inspections§! or §YRefuse the Inspectors§! in the §YCondemnation Response§! category before the deadline."
cbrn_answer_inspection_demand_timeout_tt: "Silence is recorded as a refused inspection while the demanding country remains active. Active inspections and observers are withdrawn, and public Coverup pressure is added. If the demander no longer exists, the expired demand simply clears."

cbrn_share_forensic_evidence: "Publish CBRN Evidence from [FROM.GetName]"
cbrn_share_forensic_evidence_desc: "Authenticate a preserved sample, device fragment, laboratory record, or chain-of-custody file tied to a recorded chemical attack or detected ordinary biological episode in this state."
cbrn_share_forensic_evidence_cost: "§Y[?constant:cbrn_diplomacy_cost.forensic_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.forensic_support|0]§!  £civ_factory §Y[?constant:cbrn_diplomacy_factory_use.forensic_publication|0]§!"
cbrn_share_forensic_evidence_cost_blocked: "§R[?constant:cbrn_diplomacy_cost.forensic_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §R[?constant:cbrn_diplomacy_cost.forensic_support|0]§!  £civ_factory §R[?constant:cbrn_diplomacy_factory_use.forensic_publication|0]§!"
cbrn_share_forensic_evidence_cost_tooltip: "§Y[?constant:cbrn_diplomacy_cost.forensic_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.forensic_support|0]§!  £civ_factory §Y[?constant:cbrn_diplomacy_factory_use.forensic_publication|0]§! while the publication is active"
cbrn_share_forensic_evidence_requirements_tt: "Requires an intelligence agency, Chemical Detection Paper, or Field Epidemiology Teams; the displayed resources and civilian factory; and a state we control with an open exact chemical-action record or detected ordinary-pathogen episode. A chemical record remains publishable when its historical actor no longer exists; no successor or proxy inherits its penalties."
cbrn_share_forensic_evidence_begin_tt: "A forensic team locks the strongest eligible exact chemical-action row or ordinary-pathogen seed in [FROM.GetName], then spends §Y[?constant:cbrn_diplomacy_duration.forensic_publication_days|0] days§! authenticating that record. Later attacks or outbreaks cannot replace it. One Civilian Factory supports the examination."
cbrn_share_forensic_evidence_complete_tt: "The locked record gains §Y[?constant:cbrn_diplomacy_evidence.forensic_publication_add|0] evidence§!. Chemical responsibility exposes only the additional unpaid liability of that exact action justified by its resulting attribution band; a biological record advances only if its locked seed is still current. A confirmed inactive historical chemical actor is recorded and closed without transferring penalties to another country. Delivery odds, deaths, contamination, and use history are unchanged."

cbrn_sponsor_decontamination_mission: "Sponsor Decontamination in [FROM.GetName]"
cbrn_sponsor_decontamination_mission_desc: "Send protected wash columns, detection teams, transport, and relief stores into a consenting foreign-controlled contaminated state."
cbrn_sponsor_decontamination_mission_cost: "§Y[?constant:cbrn_diplomacy_cost.decon_masks|0] Masks§!  §Y[?constant:cbrn_diplomacy_cost.decon_equipment|0] Decon Sets§!  §Y[?constant:cbrn_diplomacy_cost.decon_instruments|0] Instruments§!  £support_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.decon_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.decon_trucks|0]§!  £GFX_topbar_convoys §Y[?constant:cbrn_diplomacy_cost.decon_convoys|0]§!  £civ_factory §Y[?constant:cbrn_diplomacy_factory_use.decon_mission|0]§!"
cbrn_sponsor_decontamination_mission_cost_blocked: "§R[?constant:cbrn_diplomacy_cost.decon_masks|0] Masks§!  §R[?constant:cbrn_diplomacy_cost.decon_equipment|0] Decon Sets§!  §R[?constant:cbrn_diplomacy_cost.decon_instruments|0] Instruments§!  £support_equipment_text_icon §R[?constant:cbrn_diplomacy_cost.decon_support|0]§!  £GFX_motorized_equipment_text_icon §R[?constant:cbrn_diplomacy_cost.decon_trucks|0]§!  £GFX_topbar_convoys §R[?constant:cbrn_diplomacy_cost.decon_convoys|0]§!  £civ_factory §R[?constant:cbrn_diplomacy_factory_use.decon_mission|0]§!"
cbrn_sponsor_decontamination_mission_cost_tooltip: "§Y[?constant:cbrn_diplomacy_cost.decon_masks|0] Masks§!  §Y[?constant:cbrn_diplomacy_cost.decon_equipment|0] Decontamination Sets§!  §Y[?constant:cbrn_diplomacy_cost.decon_instruments|0] CBRN Instruments§!  £support_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.decon_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.decon_trucks|0]§!  £GFX_topbar_convoys §Y[?constant:cbrn_diplomacy_cost.decon_convoys|0]§!  £civ_factory §Y[?constant:cbrn_diplomacy_factory_use.decon_mission|0]§! while the mission is active"
cbrn_sponsor_decontamination_mission_requirements_tt: "Requires Field Decontamination Kits; §Y[?constant:cbrn_diplomacy_cost.decon_masks|0] Masks§!, §Y[?constant:cbrn_diplomacy_cost.decon_equipment|0] Decontamination Sets§!, §Y[?constant:cbrn_diplomacy_cost.decon_instruments|0] CBRN Instruments§!, £support_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.decon_support|0]§!, £GFX_motorized_equipment_text_icon §Y[?constant:cbrn_diplomacy_cost.decon_trucks|0]§!, £GFX_topbar_convoys §Y[?constant:cbrn_diplomacy_cost.decon_convoys|0]§!, and £civ_factory §Y[?constant:cbrn_diplomacy_factory_use.decon_mission|0]§!; and a chemically contaminated foreign state whose controller is an ally, subject, inspection partner, observer host, or exact humanitarian CBRN corridor partner. The controller must not be at war with us."
cbrn_sponsor_decontamination_mission_begin_tt: "The listed equipment is consumed and §Y[?constant:cbrn_diplomacy_factory_use.decon_mission|0] Civilian Factories§! support a §Y[?constant:cbrn_diplomacy_duration.decon_mission_days|0]-day§! foreign mission. Access must remain open and the state must not enter war against us."
cbrn_sponsor_decontamination_mission_complete_tt: "The mission removes §Y[?constant:cbrn_diplomacy_decon.trace_or_local_cleanup|0]/[?constant:cbrn_diplomacy_decon.serious_cleanup|0]/[?constant:cbrn_diplomacy_decon.severe_cleanup|0]/[?constant:cbrn_diplomacy_decon.catastrophic_cleanup|0] contamination points§! from a Trace-or-Local/Serious/Severe/Catastrophic state and lowers Medical Saturation by §Y[?constant:cbrn_diplomacy_decon.medical_saturation_reduction|0]§!. An International Medical Mission designer multiplies cleanup by §G[?constant:cbrn_diplomacy_decon.international_medical_mission_mult|%0]§!. If the state still holds observable chemical evidence, foreign observers advance the strongest open exact chemical-action record. Recorded deaths and responsibility remain."
cbrn_sponsor_decontamination_mission_cancel_tt: "Loss of diplomatic access ends the mission. Committed consumables and transport are not returned, and no cleanup is applied."

