l_english:
 chaosx.fallout.401.t: "Year Zero"
 chaosx.fallout.401.d: "The old calendar still hangs above the ration office, but its dates belong to a country that no longer exists. [This.GetName] must decide which day will be remembered as the beginning of the life that follows the ash."
 chaosx.fallout.401.a: "Keep the old calendar"
 chaosx.fallout.401.b: "Declare Year Zero"
 chaosx.fallout.401.c: "Let each region keep its count"
chaosx.fallout.401.e: "Set the year by sacred observance"
 chaosx.fallout.401.a.tt: "Spend food, recognition, and cohesion to preserve the dates survivors still know."
 chaosx.fallout.401.b.tt: "Spend food, recognition, and cohesion to make the rewrite a public founding date."
 chaosx.fallout.401.c.tt: "Spend food, recognition, and cohesion to let each region count recovery in its own seasons."
 chaosx.fallout.401.d.tt: "Spend food, recognition, and cohesion to bind the calendar to sacred observance."
 chaosx.fallout.403.t: "A Date for the Ashes"
 chaosx.fallout.403.old_calendar.success.d: "The old dates return to the walls beside the new ration tables. The clerks can compare lost records with living names, and families do not have to surrender every birthday to the ash."
 chaosx.fallout.403.old_calendar.partial.d: "The old dates remain in the capital, while outer settlements mark the weather and the harvest instead. The calendar survives, but it no longer speaks with one voice."
 chaosx.fallout.403.old_calendar.failure.d: "The old calendar cannot carry the missing records. The office keeps its dates, yet every correction makes the previous country feel less real."
 chaosx.fallout.403.year_zero.success.d: "The council writes one date across the ration books and the first memorial stone. The declaration gives survivors a common beginning, and officials can name their duties without borrowing a dead state's authority."
 chaosx.fallout.403.year_zero.partial.d: "Year Zero is announced, but half the settlements continue to write the old year in the margins. The new date has a voice, though it must still earn its place at every table."
 chaosx.fallout.403.year_zero.failure.d: "The declaration becomes a quarrel over who is allowed to begin again. The new date is painted over before the ink dries, and the old authority returns as accusation."
 chaosx.fallout.403.regional_calendar.success.d: "The regions agree to publish their seasons together. A winter count from the ridge can now be compared with a river harvest, and the country gains a language for uneven recovery."
 chaosx.fallout.403.regional_calendar.partial.d: "Regional counts make the harvest records useful, but the border districts refuse the same anniversaries. The settlement has a practical calendar and a divided memory."
 chaosx.fallout.403.regional_calendar.failure.d: "Every district keeps a different beginning and the old road signs become useless. The calendar no longer joins the country when the next ration dispute arrives."
 chaosx.fallout.403.religious_calendar.success.d: "The first year is measured by a shared observance that survived the shelters. Priests, clerks, and families agree on the date, and the ritual becomes a promise that the dead are still part of the record."
 chaosx.fallout.403.religious_calendar.partial.d: "The observance draws the settlements together for one winter, but dissenting congregations keep separate counts. The sacred year holds the memory while leaving the law unsettled."
 chaosx.fallout.403.religious_calendar.failure.d: "The observance turns into a contest over which survivors may speak for the dead. The calendar loses its common meaning, and the next ceremony is held behind guarded doors."
 chaosx.fallout.403.a: "Record the date and plan its anniversary"
 chaosx.fallout.403.a.tt: "Apply the calendar result, record its memory, and schedule the first anniversary callback."
 chaosx.fallout.405.t: "The First Anniversary"
 chaosx.fallout.405.success.d: "A year later, the chosen date survives the queue, the schoolroom, and the memorial wall. Children learn it as a beginning rather than a wound, and the country can measure recovery without forgetting the cost."
 chaosx.fallout.405.partial.d: "The anniversary is observed, though every district adds its own names and weather marks. The calendar has become a habit, but it has not yet become a shared history."
 chaosx.fallout.405.failure.d: "The anniversary collapses into rival ceremonies. The date remains in the archive, but public life returns to older names that no longer promise a common future."
 chaosx.fallout.405.a: "Close the calendar record"
 chaosx.fallout.405.a.tt: "Resolve the anniversary, retain its memory, and release the scheduler cleanup receipt."
 fallout.event_log.year_zero.name: "Year Zero"
 fallout.event_log.year_zero.detail: "[This.GetName] chose how the first post-ash year would be remembered."
 fallout.event_log.year_zero.old_calendar_success: "The old calendar remained legible beside the new ration records."
 fallout.event_log.year_zero.old_calendar_partial: "The old calendar survived in the capital but not in every settlement."
 fallout.event_log.year_zero.old_calendar_failure: "The old calendar could not carry the missing records."
 fallout.event_log.year_zero.year_zero_success: "Year Zero became a common beginning for the rewritten country."
 fallout.event_log.year_zero.year_zero_partial: "Year Zero was announced while several settlements kept the old year."
 fallout.event_log.year_zero.year_zero_failure: "The Year Zero declaration became a fight over who could begin again."
 fallout.event_log.year_zero.regional_calendar_success: "Regional seasons were published as one practical recovery count."
 fallout.event_log.year_zero.regional_calendar_partial: "Regional counts worked for harvests but divided public memory."
 fallout.event_log.year_zero.regional_calendar_failure: "Separate regional beginnings broke the calendar's public use."
 fallout.event_log.year_zero.religious_calendar_success: "A shared observance became the country's first common year."
 fallout.event_log.year_zero.religious_calendar_partial: "A sacred year held memory while leaving the law unsettled."
 fallout.event_log.year_zero.religious_calendar_failure: "The sacred observance became a guarded contest over the dead."
 fallout.event_log.year_zero.callback_success: "The first anniversary made the chosen date a durable public habit."
 fallout.event_log.year_zero.callback_partial: "The first anniversary survived with separate district additions."
 fallout.event_log.year_zero.callback_failure: "Rival anniversary ceremonies broke the calendar's common meaning."
