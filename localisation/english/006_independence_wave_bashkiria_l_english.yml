bsk_fragmented_frontier_mandate: "Fragmented Frontier Mandate"
bsk_fragmented_frontier_mandate_desc: "Oilfield communities, villages, railway workers, and mounted frontier detachments recognize the provisional authority without yet accepting one settlement."
bsk_bashkiria_frontier_compact: "Bashkir Frontier Compact"
bsk_bashkiria_frontier_compact_desc: "A congress charter and common frontier command bind Bashkiria's oilfields, settlements, and routes to one civil authority."
bsk_bashkir_frontier_compact: "Bashkir Frontier Compact"
bsk_bashkir_frontier_compact_desc: "A congress charter and common frontier command bind Bashkiria's oilfields, settlements, and routes to one civil authority."
bsk_congress_charter: "Bashkir Congress Charter"
bsk_congress_charter_desc: "The congress establishes elected civic administration and guarantees representation for Bashkiria's frontier communities."
bsk_oilfield_council: "Oilfield Communities Council"
bsk_oilfield_council_desc: "Oilfield workers, engineers, and local delegates coordinate extraction, rail access, and civic revenue."
bsk_agrarian_land_compact: "Agrarian Land Compact"
bsk_agrarian_land_compact_desc: "Village delegates and cooperatives protect food, remounts, and local administration across the frontier."
bsk_steppe_land_compact: "Agrarian Land Compact"
bsk_steppe_land_compact_desc: "Village delegates and cooperatives protect food, remounts, and local administration across the frontier."
bsk_frontier_workers_council: "Frontier Workers' Council"
bsk_frontier_workers_council_desc: "Railway crews, oilfield workers, and municipal committees coordinate production and transport through a common council."
bsk_oilfield_workers_council: "Frontier Workers' Council"
bsk_oilfield_workers_council_desc: "Railway crews, oilfield workers, and municipal committees coordinate production and transport through a common council."
bsk_emergency_frontier_command: "Emergency Frontier Command"
bsk_emergency_frontier_command_desc: "A unified staff directs mounted guards and depot reserves while civil councils preserve supply and relief."
bsk_frontier_emergency_command: "Emergency Frontier Command"
bsk_frontier_emergency_command_desc: "A unified staff directs mounted guards and depot reserves while civil councils preserve supply and relief."

independence_wave_bashkiria_frontier_compact_category: "Bashkir Frontier Compact"
independence_wave_bashkiria_frontier_compact_category_desc: "Congress Cohesion: §Y[?independence_wave_bsk_congress_cohesion|0]§! / [?constant:independence_wave_bashkiria_pressure.maximum|0]\nFrontier Readiness: §Y[?independence_wave_bsk_frontier_readiness|0]§! / [?constant:independence_wave_bashkiria_pressure.maximum|0]\nReach [?constant:independence_wave_bashkiria_pressure.stable|0] in both values to stabilize the compact."
independence_wave_bsk_hold_frontier_congress: "Hold the Bashkir Frontier Congress Together"
independence_wave_bsk_hold_frontier_congress_desc: "Within [?constant:independence_wave_bashkiria_duration.founding_crisis|0] days, install a government, raise both compact values to [?constant:independence_wave_bashkiria_pressure.stable|0], and keep Ufa owned and controlled."
independence_wave_bsk_integrate_frontier_guards: "Integrate the Frontier Guards"
independence_wave_bsk_integrate_frontier_guards_desc: "Unify mounted detachments and local guards under a frontier staff while preserving the community guarantees that sustain them."
independence_wave_bsk_settle_former_host_ledgers: "Settle the Former Host Ledgers"
independence_wave_bsk_settle_former_host_ledgers_desc: "Close the property, border, population, and recognition claims inherited from the former administration. If talks fail, Bashkiria will settle them locally."
independence_wave_bsk_ratify_constitutional_autonomy: "Ratify Constitutional Autonomy"
independence_wave_bsk_ratify_constitutional_autonomy_desc: "Give the provisional congress a binding charter of self-government and protections for frontier communities."
independence_wave_bsk_adopt_agrarian_compact: "Adopt the Agrarian Compact"
independence_wave_bsk_adopt_agrarian_compact_desc: "Entrust village delegates and cooperatives with food, remounts, recruitment, and local administration."
independence_wave_bsk_convene_socialist_councils: "Convene the Socialist Councils"
independence_wave_bsk_convene_socialist_councils_desc: "Place the oilfields, railways, workshops, and municipal services under a common workers' council."
independence_wave_bsk_codify_durable_sovereignty: "Codify Durable Sovereignty"
independence_wave_bsk_codify_durable_sovereignty_desc: "A resolved founding crisis, stable ledgers, and a functioning government can turn liberation into a durable Bashkir state."
independence_wave_bsk_secure_frontier_depots_desc: "Place the Ufa oilfield stores, rail registers, and depot guards under a civil authority able to supply the compact."
independence_wave_bsk_secure_frontier_depots: "Secure the Frontier Depots"
independence_wave_bsk_register_bashkir_communities_desc: "Record the rights, obligations, and representation of every oilfield district, village, railway town, and recognized community."
independence_wave_bsk_register_bashkir_communities: "Register the Bashkir Communities"
independence_wave_bsk_establish_frontier_emergency_command_desc: "Put the mounted guards under one emergency staff and secure the passes before neighboring armies test the compact."
independence_wave_bsk_establish_frontier_emergency_command: "Establish the Frontier Emergency Command"
independence_wave_bsk_open_ural_network_corridor_desc: "After the founding settlement, exchange supplies, officers, and diplomatic access along the Volga–Ural network with the other states that survived the wave."
independence_wave_bsk_open_ural_network_corridor: "Open the Volga–Ural Network Corridor"
independence_wave_bsk_depots_effect_tt: "Congress Cohesion and Frontier Readiness improve, while Legitimacy and State Capacity rise."
independence_wave_bsk_guards_effect_tt: "Frontier Readiness improves sharply and the security administration gains Legitimacy and Security."
independence_wave_bsk_communities_effect_tt: "Congress Cohesion improves sharply, Recognition and State Capacity rise, and the compact absorbs a measured instability cost."
independence_wave_bsk_host_ledgers_effect_tt: "Congress Cohesion and Frontier Readiness improve. Former-host property, border, population, and recognition ledgers are settled through negotiation."
independence_wave_bsk_host_loss_effect_tt: "The former-host ledger closes locally. Congress Cohesion and Frontier Readiness improve, and no bilateral host values change."
independence_wave_bsk_constitutional_route_effect_tt: "The Bashkir Civic Assembly takes office under the constitutional standard. Congress Cohesion and Frontier Readiness improve, with gains to Legitimacy and State Capacity."
independence_wave_bsk_agrarian_route_effect_tt: "The Bashkir Land Compact takes office under the agrarian standard. Congress Cohesion and Frontier Readiness improve, with gains to Legitimacy and Recognition."
independence_wave_bsk_socialist_route_effect_tt: "The Bashkir Oilfield Workers' Council takes office under the socialist standard. Frontier Readiness improves sharply while the railway and oilfield economy are reorganized."
independence_wave_bsk_emergency_route_effect_tt: "The Frontier Command Directorate takes office under the emergency standard. Frontier Readiness rises sharply while Congress Cohesion pays the cost of emergency rule."
independence_wave_bsk_sovereignty_effect_tt: "Legitimacy, Recognition, and State Capacity rise, and the compact gains Security."
independence_wave_bsk_network_effect_tt: "Congress Cohesion and Frontier Readiness improve. Network Standing, League Cohesion, Common Cause, Shared Reserve, and Member Confidence rise."
independence_wave_bsk_focus_integrate_frontier_guards: "Integrate the Frontier Guards"
independence_wave_bsk_focus_open_ural_network_corridor: "Open the Volga–Ural Network Corridor"
independence_wave_bsk_focus_register_bashkir_communities: "Register the Bashkir Communities"
independence_wave_bsk_focus_secure_frontier_depots: "Secure the Frontier Depots"
independence_wave_bsk_focus_settle_former_host_ledgers: "Settle the Former Host Ledgers"

independence_wave_bsk_project_failure_effect_tt: "Congress Cohesion and Frontier Readiness each fall by [?constant:independence_wave_bashkiria_pressure.standard_loss|0]. Legitimacy, Recognition, State Capacity, and Security fall. Instability rises."
