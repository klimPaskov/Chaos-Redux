biowarfare.1.t: "Auschwitz Human Experimentation"
biowarfare.1.d: "Our concentration camps in Auschwitz provide us with an opportunity to conduct human experimentation on a large scale. We can test various biological agents and their effects on human subjects, gathering invaluable data for our biowarfare program."
biowarfare.1.a: "Make use of this opportunity"
biowarfare.1.b: "We must proceed with caution and ethics"

biowarfare.4.t: "Franciszek Witaszek executed!"
biowarfare.4.d: "Our biowarfare scientist, Franciszek Witaszek, has been captured by the Nazi occupiers and executed."
biowarfare.4.a: "Tragic" 



chaosx_contamination.1.t: "Atmospheric Contamination Reaches 25%"
chaosx_contamination.1.d: "Global contamination has reached a level where disease outbreaks spread more easily across regions. Environmental stress now shapes wider strategic conditions."
chaosx_contamination.1.a: "The air is changing."

chaosx_contamination.2.t: "Atmospheric Contamination Reaches 50%"
chaosx_contamination.2.d: "Contamination has crossed a critical midpoint. Climate instability now includes the possibility of recurring nuclear-winter periods, worsening worldwide living and combat conditions."
chaosx_contamination.2.a: "This is no longer temporary."

chaosx_contamination.3.t: "Atmospheric Contamination Reaches 75%"
chaosx_contamination.3.d: "Severe atmospheric degradation is now entrenched. Extreme winter episodes can strike with much greater force, and global recovery capacity is rapidly shrinking."
chaosx_contamination.3.a: "The world is entering collapse weather."

chaosx_contamination.4.t: "Atmospheric Contamination Reaches 100%"
chaosx_contamination.4.d: "The contamination threshold has passed into irreversibility. Cleanup cannot restore the atmosphere, and compounding degradation is pushing regions toward long-term wasteland conditions."
chaosx_contamination.4.a: "There is no return."

chaosx_contamination.5.t: "Nuclear Winter Period Begins"
chaosx_contamination.5.d: "A new nuclear winter period has begun. Atmospheric particulates and toxic fallout are suppressing stability and accelerating contamination pressure."
chaosx_contamination.5.a: "Brace for the cold ash."

chaosx_contamination.6.t: "Severe Nuclear Winter Begins"
chaosx_contamination.6.d: "A severe nuclear winter has formed. Massive fallout circulation is intensifying contamination and driving harsh global deterioration."
chaosx_contamination.6.a: "The sky has turned against us."

chaosx_contamination.7.t: "The Air Cleanliness Treaty"
chaosx_contamination.7.d: "[Root.GetNameDef] has opened an international atmospheric office as crop stations report sustained dimming. Signatories will exchange sampling records, prohibit unconventional weapons, and maintain relief depots for the hardest winter districts. Embargoes are reserved for members that break the prohibition."
chaosx_contamination.7.a: "Record every reading."

chaosx_contamination.8.t: "Air Cleanliness Treaty Violated"
chaosx_contamination.8.d: "[Root.GetNameDef] has deployed an unconventional weapon after signing the Air Cleanliness Treaty. Member offices have struck its credentials from the sampling exchange, recalled active filter routes, and opened coordinated embargo files."
chaosx_contamination.8.a: "Close the treaty depots to them."

chaosx_contamination.9.t: "Invitation: Air Cleanliness Treaty"
chaosx_contamination.9.d: "[air_cleanliness_treaty_founder.GetNameDef] has invited our weather service and logistics ministry into the Air Cleanliness Treaty. Membership grants access to shared sampling records and filter convoys. It also binds us to the prohibition on unconventional weapons and the sanctions ledger for violators."
chaosx_contamination.9.a: "Sign and open our records."
chaosx_contamination.9.b: "Keep our depots outside the treaty."

chaosx_contamination.10.t: "Air Cleanliness Treaty Formed"
chaosx_contamination.10.d: "Our atmospheric office holds the founding sampling ledger. Invitations have gone to governments whose records remain clear of unconventional attacks. The first joint depot plan sends sealed filters and convoy escorts to rail yards, clinics, and shelters losing ground to ash and deep cold."
chaosx_contamination.10.a: "Open the treaty office."

chaosx_contamination.11.t: "Global Cleaning Day"
chaosx_contamination.11.d: "Treaty rail yards, port crews, and municipal filter stations have completed a synchronized maintenance cycle. Fresh cartridges are operating across member networks while ash traps and sealed storage sites reduce the material still entering the shared air."
chaosx_contamination.11.a: "Keep the depots supplied."

chaosx_air_treaty.1.t: "Filter Convoy Dispatched"
chaosx_air_treaty.1.d: "Sealed filter housings, replacement cartridges, and convoy escorts have left our depots for [air_cleanliness_treaty_convoy_recipient.GetNameDef]. Their route terminates at [air_cleanliness_treaty_convoy_state.GetName], where local authorities have reserved warehouses and repair crews."
chaosx_air_treaty.1.a: "Hold the route open."

chaosx_air_treaty.2.t: "Treaty Filters Reach [air_cleanliness_treaty_convoy_state.GetName]"
chaosx_air_treaty.2.d: "A convoy from [air_cleanliness_treaty_convoy_donor.GetNameDef] has reached [air_cleanliness_treaty_convoy_state.GetName]. Crews are fitting sealed intakes to shelters and clinics, issuing cartridges to exposed workers, and maintaining a protected supply route for up to six months while ownership, control, membership, and peace conditions hold."
chaosx_air_treaty.2.a: "Put the filters into service."

chaosx_air_treaty.3.t: "The Treaty Secretariat Moves Here"
chaosx_air_treaty.3.d: "Treaty delegates have transferred the sampling archive, convoy register, and sanctions ledger to our atmospheric office. Our clerks now certify member readings and authorize shared relief routes until another succession is required."
chaosx_air_treaty.3.a: "Secure the archive."

chaosx_air_treaty.4.t: "Filter Convoy Route Withdrawn"
chaosx_air_treaty.4.d: "The clearances for [air_cleanliness_treaty_convoy_state.GetName] were withdrawn before our convoy could unload. The assigned filters and escorts cannot be recovered from the disrupted route, and the destination receives no treaty guarantee."
chaosx_air_treaty.4.a: "Close the dispatch file."

chaosx_air_treaty.5.t: "Cleaning Charter Lapses"
chaosx_air_treaty.5.d: "Our treaty authorization lapsed before the synchronized filter works could be completed. Equipment already released from the depots cannot be recalled, and no atmospheric reduction will be certified from this attempt."
chaosx_air_treaty.5.a: "Return the remaining crews."

chaosx_air_treaty.6.t: "Treaty Inspectors at the Border"
chaosx_air_treaty.6.democratic.d: "The verification convoy from [air_cleanliness_treaty_inspection_inspector.GetNameDef] has reached our frontier with sealed calibration cases and a request for access to municipal samplers, filter depots, and atmospheric ledgers. Parliamentary committees can admit the technicians under published rules, release certified copies without opening the depots, or reject the mission and accept a formal dispute."
chaosx_air_treaty.6.communism.d: "The verification convoy from [air_cleanliness_treaty_inspection_inspector.GetNameDef] has reached our frontier with sealed calibration cases and a request for access to workers' monitoring boards, filter depots, and ministry ledgers. The central committee can open the facilities, provide certified records under state supervision, or refuse entry and face a formal dispute among the signatories."
chaosx_air_treaty.6.fascism.d: "The treaty secretariat in [air_cleanliness_treaty_inspection_inspector.GetNameDef] has sent technicians to examine state samplers, protected filter depots, and industrial readings. Security offices can escort them through every facility, issue selected records while keeping restricted sites closed, or turn the convoy away and force the dispute into the member register."
chaosx_air_treaty.6.neutrality.d: "A verification convoy from [air_cleanliness_treaty_inspection_inspector.GetNameDef] waits at the frontier with calibration instruments and a request for access to provincial samplers, filter stores, and government ledgers. The cabinet can admit the full mission, release certified records under local supervision, or refuse entry and leave the secretariat to publish the dispute."
chaosx_air_treaty.6.a: "Open the depots and publish the readings."
chaosx_air_treaty.6.a.tt: "Consumes §Y30 support equipment§! and §Y5 trains§!. The verification file returns to the secretariat after exactly §Y7 days§!. If both countries remain treaty members at peace with each other and the same secretariat stays in office, treaty members gain §G20 opinion§! of us for up to §Y12 months§!."
chaosx_air_treaty.6.b: "Release the ledgers under our own seal."
chaosx_air_treaty.6.b.tt: "Consumes §Y12 support equipment§! and §Y2 trains§!. The verification file returns to the secretariat after exactly §Y7 days§!. If both countries remain treaty members at peace with each other and the same secretariat stays in office, treaty members lose §R15 opinion§! of us for up to §Y9 months§!."
chaosx_air_treaty.6.c: "Keep the mission outside."
chaosx_air_treaty.6.c.tt: "The refusal notice returns to the secretariat after exactly §Y7 days§!. If both countries remain treaty members at peace with each other and the same secretariat stays in office, treaty members lose §R40 opinion§! of us for up to §Y18 months§!. Refusal also expels us, closes treaty relief access, and opens treaty-owned embargoes and the standing violator penalty."

chaosx_air_treaty.7.t: "The Verification File Returns"
chaosx_air_treaty.7.full_access.d: "Our technicians have returned from [air_cleanliness_treaty_inspection_subject.GetNameDef] with matched sampler readings, depot inventories, and signed calibration sheets. Municipal and national records agree closely enough for the secretariat to certify full access."
chaosx_air_treaty.7.records_only.d: "Officials in [air_cleanliness_treaty_inspection_subject.GetNameDef] delivered certified sampler ledgers and depot summaries but did not admit our technicians to the facilities. The figures can enter the treaty archive, while the limits of the visit remain attached to every copy."
chaosx_air_treaty.7.refused.d: "Authorities in [air_cleanliness_treaty_inspection_subject.GetNameDef] turned the verification convoy away before its instruments crossed the frontier. The secretariat has prepared an expulsion notice, orders closing treaty relief routes, and coordinated embargo files for the remaining members."
chaosx_air_treaty.7.a: "Certify full access."
chaosx_air_treaty.7.a.tt: "Full access enters both governments' treaty records. Current treaty members gain §G20 opinion§! of [air_cleanliness_treaty_inspection_subject.GetNameDef] for up to §Y12 months§!."
chaosx_air_treaty.7.b: "File the records with their restrictions."
chaosx_air_treaty.7.b.tt: "Restricted access enters both governments' treaty records. Current treaty members lose §R15 opinion§! of [air_cleanliness_treaty_inspection_subject.GetNameDef] for up to §Y9 months§!."
chaosx_air_treaty.7.c: "Publish the refusal notice."
chaosx_air_treaty.7.c.tt: "The refusal enters both governments' treaty records. Current treaty members lose §R40 opinion§! of [air_cleanliness_treaty_inspection_subject.GetNameDef] for up to §Y18 months§!. The treaty expels the refusing government, closes its relief access, and adds treaty-owned embargoes and the standing violator penalty."

chaosx_air_treaty.8.t: "The Depot Count Has Changed"
chaosx_air_treaty.8.democratic.d: "While the cabinet considered the verification request, parliamentary supply clerks recorded new withdrawals from the support stores and railway pool. The published count no longer covers the response placed before the chamber, so the available terms must be read again."
chaosx_air_treaty.8.communism.d: "While the central committee considered the verification request, transport commissars reassigned trains and depot crews to urgent state deliveries. The ministry count no longer covers the selected response, so the committee must answer from the stores that remain."
chaosx_air_treaty.8.fascism.d: "While the security offices considered the verification request, military requisitions removed trains and equipment from the ministry allotment. The authorized count no longer covers the selected response, so the government must issue a reply against the revised depot ledger."
chaosx_air_treaty.8.neutrality.d: "While the cabinet considered the verification request, the rail directorate and army quartermasters entered fresh withdrawals against the national stores. The certified count no longer covers the selected response, so the ministers must answer from the revised ledger."
chaosx_air_treaty.8.a: "Recount the stores and answer again."
chaosx_air_treaty.8.a.tt: "The inspection request remains open. Only responses that the current support stores and railway pool can supply will be offered again."












