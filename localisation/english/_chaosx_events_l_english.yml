chaosx.news.79.d: ""

chaosx_genocide.1.t: "Camp Evidence Recovered"
chaosx_genocide.1.d: "Troops entering [genocide_discovered_state.GetName] have found files, survivors, grave sites, transport records, and camp infrastructure tied to [genocide_responsible_country.GetNameDef]. The discovery gives foreign ministries proof that the system was organized by the state, not by scattered local units."
chaosx_genocide.1.a: "Send the evidence to every capital."
chaosx_genocide.2.t: "The Camp System Is Exposed"
chaosx_genocide.2.d: "Enemy forces have reached [genocide_discovered_state.GetName] and recovered evidence from the camp network. Diplomatic posts, exile groups, and hostile newspapers now have enough records to name [ROOT.GetNameDef] as the responsible state."
chaosx_genocide.2.a: "Control what records remain."
chaosx_genocide.3.t: "Evidence of Mass Atrocities"
chaosx_genocide.3.d: "Reports from [genocide_discovered_state.GetName] describe an extermination site tied to [genocide_responsible_country.GetNameDef]. The evidence includes camp infrastructure, transport ledgers, witness statements, and official orders. Neutral governments can no longer treat the accounts as rumor."
chaosx_genocide.3.a: "The file reaches the world."
chaosx_genocide.5.t: "Survivors Cross the Border"
chaosx_genocide.5.d: "Refugees and survivors have reached [ROOT.GetNameDef]. Their accounts describe forced transfers, camp labor, and mass death under [FROM.GetNameDef]. Relief committees want permission to gather testimony before the trail goes cold."
chaosx_genocide.5.a: "Record every statement."
chaosx_genocide.10.t: "Foreign Newspapers Name the Camps"
chaosx_genocide.10.d: "Foreign newspapers have started naming the camp system and linking it to [ROOT.GetNameDef]. The articles are uneven, but each report makes denial harder and gives opposition diplomats a common language."
chaosx_genocide.10.a: "The embassies will answer."
chaosx_genocide.11.t: "Refugees Become Witnesses"
chaosx_genocide.11.d: "Survivors, escaped laborers, and displaced families are crossing borders with accounts that match the recovered records. The state can still dispute numbers, but it can no longer contain the story."
chaosx_genocide.11.a: "Contain the diplomatic damage."
chaosx_genocide.12.t: "Censure Over Camp Evidence"
chaosx_genocide.12.d: "The discovery record has reached the point where foreign governments can defend formal censure in public. Foreign ministries are circulating the evidence, naming responsible offices, and preparing stronger measures if the record grows."
chaosx_genocide.12.a: "The diplomatic case hardens."
chaosx_genocide.13.t: "Tribunal Files Open"
chaosx_genocide.13.d: "Captured records, survivor testimony, and diplomatic archives are being organized for postwar prosecution. The question is no longer whether the camp system existed, but how much of the state can be tied to it."
chaosx_genocide.13.a: "The records will outlive the regime."
chaosx_genocide.30.t: "Tribunal Preparation Begins"
chaosx_genocide.30.d: "With [ROOT.GetNameDef] defeated, captured camp files are moving from intelligence offices to legal archives. The records connect sites, transport orders, labor directives, killings, and cover-up attempts into a single case."
chaosx_genocide.30.a: "The case is assembled."
chaosx_genocide.40.t: "Camp Registers Reviewed"
chaosx_genocide.40.d: "Existing detention and labor offices are now in the state register. They remain an administrative burden for the moment. Ministries can escalate selected sites into extermination infrastructure if policy permits."
chaosx_genocide.40.a: "File the register."
