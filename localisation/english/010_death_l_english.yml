death_quiet_quarantine_notice: "Issue Quiet Quarantine Notices"
death_quiet_quarantine_notice_desc: "Harbor masters can close lanes without naming the thing behind the silence."
death_quiet_quarantine_notice_tt: "A temporary quiet quarantine lowers the spread pressure before public reveal."
