death_take_black_oath: "§RTake the Black Oath§!"
death_take_black_oath_desc: "The signature leaves the living response and enters a covenant with Zol. The country remains on the map because Zol allows it."
death_take_black_oath_tt: "This country becomes a Herald of Zol, leaves the Living Compact and the Death war, gains the Black Oath national spirit, and begins to accrue Name Debt. Unpaid Name Debt costs states or invites Death's war. Living Compact members declare war on this country."
death_take_black_oath_cost_text: "£pol_power §Y[?global.black_friday_price_death_decision_cost_take_black_oath_pp|0]§!  £stability_texticon §Y[?global.black_friday_price_death_decision_cost_take_black_oath_stability|%0]§!  £GFX_war_support_icon §Y[?global.black_friday_price_death_decision_cost_take_black_oath_war_support|%0]§!"
