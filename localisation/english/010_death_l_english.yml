chaosx_super_event.62.t: "Death"
chaosx_super_event.62.q: "\"Men fear death, as children fear to go in the dark.\"\n §Y-Francis Bacon-§!"
chaosx_super_event.62.a: "For the living there is hope."
chaosx_super_event.62.d: "Death has shown enough of itself to be named. It enters a place by taking every living person from it at once, stripping the land of use, and leaving only the rule of Zol behind.\n\nDeath waits, chooses a place, empties it, and searches for the next name."
chaosx_super_event.63.t: "The Census of Zol"
chaosx_super_event.63.q: "\"And we are here as on a darkling plain,\nSwept with confused alarms of struggle and flight.\"\n §Y-Matthew Arnold-§!"
chaosx_super_event.63.a: "The sea gave up the dead which were in it."
chaosx_super_event.63.d: "A consumed continent reveals the shape of Death's work. Islands, mainland hunger, and ghost hosts form one design: empty the living, ruin the ground beneath them, and use the dead land to reach the next population.\n\nZol's hosts gather with clearer purpose. They move like a census that means to finish its own list."
chaosx_super_event.64.t: "The Unfinished Work"
chaosx_super_event.64.q: "\"It is for us the living, rather, to be dedicated here to the unfinished work.\"\n §Y-Abraham Lincoln-§!"
chaosx_super_event.64.a: "We will remember them."
chaosx_super_event.64.d: "The last state held by Death has been retaken. The dead land still explains how the killing worked: whole populations were removed, buildings were stripped of use, supply was hollowed out, and surviving records point back to Zol's ledger.\n\nThe living have stopped this plan for now. They have not learned what first chose the islands, or why the pattern waited before it moved."
chaosx_super_event.65.t: "No Witness Remains"
chaosx_super_event.65.q: "\"Creation sleeps. 'Tis as the general pulse\nOf life stood still, and nature made a pause.\"\n §Y-Edward Young-§!"
chaosx_super_event.65.a: "The rest is silence."
chaosx_super_event.65.d: "Death's plan has reached its simplest form. No living population remains to count, command, bury, or remember. Every place that could hold a name has been emptied and folded into Zol's silence.\n\nThe end came as a sequence of choices, each one followed by silence. Death consumed, raised the dead to guard the emptiness, and continued until no witness remained."
chaosx_super_event.66.t: "A Covenant with Death"
chaosx_super_event.66.q: "\"We have made a covenant with death.\"\n §Y-Isaiah 28:15, KJV-§!"
chaosx_super_event.66.a: "We are at agreement."
chaosx_super_event.66.d: "[death_black_oath_herald.GetOldNameDefCap] has entered Zol's ledger by choice. The oath gives Death more than obedience: it gives names, prisons, records, and doors opened from the inside.\n\nThe Herald government stands inside the plan. It helps choose which names are crossed out first, while its own debt waits in the same book."
