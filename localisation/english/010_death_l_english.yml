death_last_shores_response: "Last Shores Response"
death_last_shores_response_desc: "Every coast has become a front, and the last mobile reserves must be sent where the lamps still burn."
death_last_shores_response_tt: "Activates a temporary Last Shores response, marks this country as a responder, and raises global front readiness."
death_last_shores_response_cost_text: "£command_power §Y50§!  £army_experience §Y40§!  £GFX_fuel_texticon §Y800§!  £convoy_texticon §Y20§!  £support_equipment_text_icon §Y300§!  £GFX_motorized_equipment_text_icon §Y150§!"
