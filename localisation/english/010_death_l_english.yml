death_build_dead_zone_outpost: "Build Dead-Zone Outpost"
death_build_dead_zone_outpost_desc: "A surveyed dead zone can receive a lit room, clean filters, a guarded road, and a permanent office for land that cannot be restored."
death_build_dead_zone_outpost_tt: "Requires one of your divisions in the surveyed state §Y[FROM.GetName]§!. The field crew uses the listed stores to establish a guarded outpost. The first outpost in a state adds one custodial capacity, which stays if Death retakes the state. After Death is defeated, the outpost can receive one permanent custodial policy."
death_outpost_field_division_required: "A division under your command must be stationed in the selected state."
death_dead_zone_outpost_cost_text: "£army_experience §Y[?global.black_friday_price_death_decision_cost_outpost_army_xp|0]§!  £support_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_outpost_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_outpost_truck|0]§!"
