chaosx_super_event.62.t: "His Name Was Death"
chaosx_super_event.62.q: "\"Men fear death, as children fear to go in the dark.\"\n §Y-Francis Bacon-§!"
chaosx_super_event.62.a: "For the living there is hope."
chaosx_super_event.62.d: "The first mainland state has fallen silent. The reports no longer describe missing boats or empty islands. They describe a country on the map, black at the borders and absent at the center, governed by Zol and called Death.\n\nThe living now have a name for what has been reaching out from the sea."
chaosx_super_event.63.t: "No More Life"
chaosx_super_event.63.q: "\"And we are here as on a darkling plain,\nSwept with confused alarms of struggle and flight.\"\n §Y-Matthew Arnold-§!"
chaosx_super_event.63.a: "The sea gave up the dead which were in it."
chaosx_super_event.63.d: "A continent has gone black, and Chaos has climbed past the last ordinary thresholds. New footholds appear on distant coasts as if the oceans have stopped separating the world and started delivering it.\n\nDeath is no longer a border crisis. It is a terminal shore."
chaosx_super_event.64.t: "The Unfinished Work"
chaosx_super_event.64.q: "\"It is for us the living, rather, to be dedicated here to the unfinished work.\"\n §Y-Abraham Lincoln-§!"
chaosx_super_event.64.a: "We will remember them."
chaosx_super_event.64.d: "The last Death-controlled state has been taken back. The black country has no ordinary surrender to sign and no capital from which to speak; it leaves only wastelands, empty ledgers, and names that cannot answer.\n\nThe living have survived the shape of Death. The work after it is not victory. It is memory, quarantine, and rebuilding."
chaosx_super_event.65.t: "There Was No Man"
chaosx_super_event.65.q: "\"Creation sleeps. 'Tis as the general pulse\nOf life stood still, and nature made a pause.\"\n §Y-Edward Young-§!"
chaosx_super_event.65.a: "The rest is silence."
chaosx_super_event.65.d: "There are no receiving stations left, no front lines, no governments counting losses, and no harbor lights to mark a return. The map has become one black absence.\n\nDeath has consumed the world, and no witness remains inside it."
chaosx_super_event.66.t: "A Covenant with Death"
chaosx_super_event.66.q: "\"We have made a covenant with death, and with hell are we at agreement.\"\n §Y-Isaiah 28:15, KJV-§!"
chaosx_super_event.66.a: "We are at agreement."
chaosx_super_event.66.d: "A living government has signed itself into Zol's ledger. Its communiques call the act containment, accommodation, and survival. Its neighbors call it betrayal.\n\nDeath has accepted a Herald. The covenant does not spare the signer from the black map; it only changes which names are collected first."
