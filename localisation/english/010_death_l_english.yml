death_black_atlas_gui_values_left: "Stage: §Y[GetDeathAtlasStage]§!\nConsumed states: §Y[?global.death_consumed_states|0]§!\nConsumed population: §Y[GetDeathConsumedPopulation]§!\nCoasts: §Y[GetDeathAtlasCoastRisk]§!\nWatch network: §Y[?global.death_watch_network|0]§!"
death_black_atlas_gui_values_right: "Line: §Y[GetDeathAtlasLineStatus]§!\nCompact: §Y[GetDeathAtlasCompactStatus]§!\nFront readiness: §Y[?global.death_front_readiness|0]§!\nWorld footholds: §Y[?global.death_world_end_footholds|0]§!"
