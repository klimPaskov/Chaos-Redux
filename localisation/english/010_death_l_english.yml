death_island_spread_soul_cost_text_blocked: "£GFX_death_soul_power_texticon Soul power §R[?global.death_island_spread_soul_cost|2]§!"
death_island_spread_soul_cost_text_tooltip: "£GFX_death_soul_power_texticon Soul power §Y[?global.death_island_spread_soul_cost|2]§!\nSpends the displayed soul power only when Death consumes an eligible island."
death_press_to_mainland: "Press Toward the Mainland"
death_press_to_mainland_desc: "Death spends soul power to force a jump across a mainland coast."
death_press_to_mainland_tt: "Requires the Mainland Smell focus, the Mainland Hunger stage, and an open mainland coast. The standard route also needs enough chaos, consumed states, and spread pressure, and a declared war with a living country after Second Shore can replace those requirements. Spends the listed soul power only when a state is consumed, and each success raises the base cost by §Y2§!. A maximum watch network blocks the jump unless Death has §YNo Ferry Returns§! or Last Shores has begun."
death_mainland_spread_soul_cost_text: "£GFX_death_soul_power_texticon Soul power §Y[?global.death_mainland_spread_soul_cost|2]§!"
death_mainland_spread_soul_cost_text_blocked: "£GFX_death_soul_power_texticon Soul power §R[?global.death_mainland_spread_soul_cost|2]§!"
death_mainland_spread_soul_cost_text_tooltip: "£GFX_death_soul_power_texticon Soul power §Y[?global.death_mainland_spread_soul_cost|2]§!\nSpends the displayed soul power only when Death consumes an eligible mainland state."
death_raise_passive_hosts: "Raise Weak Ghost Hosts"
death_raise_passive_hosts_desc: "The first hosts are thin and passive. They can hold a border and cannot win a major attack."
death_raise_passive_hosts_tt: "Spends §Y[?global.death_passive_host_soul_cost|2]§! soul power and raises one weak ghost host in a Death wasteland state. Each host raised adds §Y0.25§! soul power to future host costs."
