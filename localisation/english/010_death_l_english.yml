death_file_under_weather: "File It Under Weather"
death_file_under_weather_desc: "The report can be folded into storms, damaged radios, and navigation errors."
death_file_under_weather_tt: "The report is buried. The spread pressure increases."
death_recognize_death_war: "Recognize the Death War"
death_recognize_death_war_desc: "The black country is not a disaster zone. It is a hostile power on the map."
death_recognize_death_war_tt: "Enter war with Death if a valid war declaration path exists."
