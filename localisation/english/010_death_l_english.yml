death_offer_prison_census: "§ROffer a Prison Census§!"
death_offer_prison_census_desc: "A Herald can offer names it claims the living world has already condemned."
death_offer_prison_census_tt: "Raises one Herald Census Host, adds §Y2§! Black Favor, and increases Name Debt and Living Disgust by §Y1§!."
death_offer_prison_census_cost_text: "£pol_power §Y[?global.black_friday_price_death_decision_cost_offer_prison_census_pp|0]§!  £stability_texticon §Y[?global.black_friday_price_death_decision_cost_offer_prison_census_stability|%0]§!  £manpower_texticon §Y[?global.black_friday_price_death_decision_cost_offer_prison_census_manpower|0]§!"
