death_last_shores_response_cost_text_tooltip: "£command_power §Y50§!  £army_experience §Y40§!  £GFX_fuel_texticon §Y800§!  £convoy_texticon §Y20§!  £support_equipment_text_icon §Y300§!  £GFX_motorized_equipment_text_icon §Y150§!"
death_strengthen_quarantine_line: "Strengthen Quarantine Line"
death_strengthen_quarantine_line_desc: "A controlled state touching the wasteland can be given barriers, signal posts, and relief depots."
death_strengthen_quarantine_line_tt: "Adds a temporary Quarantine Line modifier to §Y[FROM.GetName]§!, raises global front readiness, and starts a hold-line mission."
death_quarantine_line_cost_text: "£command_power §Y15§!  £infantry_equipment_text_icon §Y500§!  £support_equipment_text_icon §Y100§!"
death_quarantine_line_cost_text_blocked: "£command_power §R15§!  £infantry_equipment_text_icon §R500§!  £support_equipment_text_icon §R100§!"
death_quarantine_line_cost_text_tooltip: "£command_power §Y15§!  £infantry_equipment_text_icon §Y500§!  £support_equipment_text_icon §Y100§!"
death_hold_quarantine_line_mission: "Hold the Quarantine Line"
death_hold_quarantine_line_mission_desc: "Keep at least one fortified border state next to the wasteland until the holding period ends."
death_hold_quarantine_line_success_tt: "The line holds. Global front readiness improves and Death's next spread is slowed."
death_hold_quarantine_line_failure_tt: "The line fails before the holding period ends. Death's spread pressure rises."
death_hide_port_lit_decisions: "Hide Port Watch Decisions"
death_hide_port_lit_decisions_desc: "Hide the state list for ports that can still be kept under watch."
death_hide_port_lit_decisions_tt: "Hides §YKeep the Port Lit§! state decisions from this country's decision list."
death_show_port_lit_decisions: "Show Port Watch Decisions"
death_show_port_lit_decisions_desc: "Show the state list for ports that can still be kept under watch."
death_show_port_lit_decisions_tt: "Shows §YKeep the Port Lit§! state decisions for this country."
death_keep_port_lit: "Keep the Port Lit"
death_keep_port_lit_desc: "A watched port keeps lamps burning, signal crews awake, and evacuation lists close at hand."
death_keep_port_lit_tt: "[GetDeathKeepPortLitTooltip]"
death_keep_port_lit_unknown_tt: "Adds §YCoastal Watch§! to §Y[FROM.GetName]§! for 120 days and raises the watch network by §Y1§!, up to §Y[?global.death_watch_network_max_display|0]§!. The unknown route cannot enter this state through an ordinary sea crossing while the watch lasts. Each network point increases the effort required to force an ordinary sea crossing, and a fully staffed network blocks such crossings."
death_keep_port_lit_confirmed_tt: "Adds §YCoastal Watch§! to §Y[FROM.GetName]§! for 120 days and raises the global watch network by §Y1§!, up to §Y[?global.death_watch_network_max_display|0]§!. Death cannot choose this state for a normal coastal jump while the watch lasts, but §YNo Ferry Returns§! lets Death ignore that state protection. Each network point raises Death's forced island and mainland jump costs by §Y[?global.death_watch_network_cost_step_percent_display|0]%§!. At maximum strength, sea jumps are blocked unless Death has §YNo Ferry Returns§! or world end has begun."
death_coastal_watch_cost_text: "£command_power §Y5§!  £GFX_fuel_texticon §Y20000§!  £convoy_texticon §Y8§!"
death_coastal_watch_cost_text_blocked: "£command_power §R5§!  £GFX_fuel_texticon §R20000§!  £convoy_texticon §R8§!"
death_coastal_watch_cost_text_tooltip: "£command_power §Y5§!  £GFX_fuel_texticon §Y20000§!  £convoy_texticon §Y8§!"
death_survey_the_wasteland: "Survey the Wasteland"
death_survey_the_wasteland_desc: "Recovered dead land must be mapped by road, well, depot, and night shelter before teams can work inside it."
death_survey_the_wasteland_tt: "Records §Y[FROM.GetName]§! as a Surveyed Dead Zone and applies temporary Wasteland Entry Gear, reducing attrition and improving movement there. The first survey in this state grants §Y1§! custodial capacity. Reconsumption and control transfer never recreate that contribution."
death_wasteland_survey_cost_text: "£army_experience §Y10§!  £support_equipment_text_icon §Y100§!  £GFX_motorized_equipment_text_icon §Y50§!"
death_wasteland_survey_cost_text_blocked: "£army_experience §R10§!  £support_equipment_text_icon §R100§!  £GFX_motorized_equipment_text_icon §R50§!"
death_wasteland_survey_cost_text_tooltip: "£army_experience §Y10§!  £support_equipment_text_icon §Y100§!  £GFX_motorized_equipment_text_icon §Y50§!"
death_build_dead_zone_outpost: "Build Dead-Zone Outpost"
death_build_dead_zone_outpost_desc: "A surveyed dead zone can receive a lit room, clean filters, a guarded road, and a permanent office for land that cannot be restored."
death_build_dead_zone_outpost_tt: "Adds a permanent Dead-Zone Outpost to §Y[FROM.GetName]§!. The first outpost in this state grants §Y1§! custodial capacity. Reconsumption and control transfer never recreate that contribution. After Death is defeated, the outpost can receive one irreversible custodial policy."
death_dead_zone_outpost_cost_text: "£army_experience §Y25§!  £support_equipment_text_icon §Y300§!  £GFX_motorized_equipment_text_icon §Y120§!  £GFX_train_texticon §Y8§!"
death_dead_zone_outpost_cost_text_blocked: "£army_experience §R25§!  £support_equipment_text_icon §R300§!  £GFX_motorized_equipment_text_icon §R120§!  £GFX_train_texticon §R8§!"
death_dead_zone_outpost_cost_text_tooltip: "£army_experience §Y25§!  £support_equipment_text_icon §Y300§!  £GFX_motorized_equipment_text_icon §Y120§!  £GFX_train_texticon §Y8§!"
death_select_sealed_exclusion: "Impose Sealed Exclusion"
death_select_sealed_exclusion_desc: "The outpost becomes a closed boundary office. Patrols defend marked approaches, keep civilians out, and accept that the state will remain inaccessible."
death_select_sealed_exclusion_tt: "Spends §Y1§! custodial capacity and assigns §Y[FROM.GetName]§! to permanent Sealed Exclusion. Containment and defense improve while access and construction remain tightly restricted. The erased population, factories, and resources do not return."
death_custodial_sealed_exclusion_cost_text: "Custodial capacity §Y1§!"
death_custodial_sealed_exclusion_cost_text_blocked: "Custodial capacity §R1§!"
death_custodial_sealed_exclusion_cost_text_tooltip: "Requires one available custodial office."
death_select_memorial_stewardship: "Establish Memorial Stewardship"
death_select_memorial_stewardship_desc: "The outpost keeps the names, maps the empty settlements, and receives mourners under guard. The state becomes a national obligation rather than a productive district."
death_select_memorial_stewardship_tt: "Spends §Y2§! custodial capacity and assigns §Y[FROM.GetName]§! to permanent Memorial Stewardship. The first memorial program established by this country grants §G+3%§! stability and reduces mourning debt by up to §Y2§!. That national benefit can be received only once. Production, resources, and population remain erased."
death_custodial_memorial_stewardship_cost_text: "Custodial capacity §Y2§!"
death_custodial_memorial_stewardship_cost_text_blocked: "Custodial capacity §R2§!"
death_custodial_memorial_stewardship_cost_text_tooltip: "Requires two available custodial offices."
death_select_transit_custodianship: "Open a Custodial Transit Corridor"
death_select_transit_custodianship_desc: "Guarded convoys can cross the dead land on one maintained route. Every timetable depends on filters, escorts, spare engines, and a command staff that cannot be withdrawn."
death_select_transit_custodianship_tt: "Spends §Y3§! custodial capacity and the listed service stores to assign §Y[FROM.GetName]§! to permanent Transit Custodianship. A maintained corridor improves movement and supply for §Y180 days§!. Its active benefits require renewed upkeep. Nothing living or productive is recreated."
death_custodial_transit_custodianship_cost_text: "Custodial capacity §Y3§!  £command_power §Y20§!  £support_equipment_text_icon §Y200§!  £GFX_motorized_equipment_text_icon §Y100§!  £GFX_train_texticon §Y6§!  £GFX_fuel_texticon §Y400§!"
death_custodial_transit_custodianship_cost_text_blocked: "Custodial capacity §R3§!  £command_power §R20§!  £support_equipment_text_icon §R200§!  £GFX_motorized_equipment_text_icon §R100§!  £GFX_train_texticon §R6§!  £GFX_fuel_texticon §R400§!"
death_custodial_transit_custodianship_cost_text_tooltip: "Requires three custodial offices and enough command, equipment, trains, and fuel to open the corridor."
death_maintain_transit_custodianship: "Maintain the Custodial Corridor"
death_maintain_transit_custodianship_desc: "Filters expire, engines fail, and route markers vanish unless the transit office receives another service allotment."
death_maintain_transit_custodianship_tt: "Pays the listed upkeep and restores the maintained transit benefits in §Y[FROM.GetName]§! for §Y180 days§!. The underlying custodial policy remains even when active maintenance lapses."
death_custodial_transit_upkeep_cost_text: "£command_power §Y10§!  £support_equipment_text_icon §Y100§!  £GFX_motorized_equipment_text_icon §Y50§!  £GFX_train_texticon §Y3§!  £GFX_fuel_texticon §Y250§!"
death_custodial_transit_upkeep_cost_text_blocked: "£command_power §R10§!  £support_equipment_text_icon §R100§!  £GFX_motorized_equipment_text_icon §R50§!  £GFX_train_texticon §R3§!  £GFX_fuel_texticon §R250§!"
death_custodial_transit_upkeep_cost_text_tooltip: "Requires command attention, service equipment, trucks, trains, and fuel for another maintenance cycle."
death_open_black_atlas: "Open the Black Atlas"
death_open_black_atlas_desc: "The response office can show the current Death map, including consumed states, watch strength, compact status, and front readiness."
death_open_black_atlas_tt: "Opens the §YBlack Atlas§! dashboard in the Death decisions."
death_open_black_book: "§ROpen the Black Book§!"
death_open_black_book_desc: "The censuses recovered from the dead land can be indexed, studied, and used. The office cannot survive public scrutiny."
death_open_black_book_tt: "Opens the forbidden Black Book path, adds Black Book Offices, and raises exposure."
death_open_black_book_cost_text: "£pol_power §Y60§!  £stability_texticon §Y8%§!"
death_open_black_book_cost_text_blocked: "£pol_power §R60§!  £stability_texticon §R8%§!"
death_open_black_book_cost_text_tooltip: "£pol_power §Y60§!  £stability_texticon §Y8%§!"
death_bind_the_unburied: "§RBind the Unburied§!"
death_bind_the_unburied_desc: "Names taken from the black register can be bound into weak bodies that stand where living troops cannot remain."
death_bind_the_unburied_tt: "Creates one weak Bound Shade division and raises Black Book exposure and mourning debt."
death_bind_unburied_cost_text: "£army_experience §Y15§!  £support_equipment_text_icon §Y120§!  £manpower_texticon §Y500§!"
death_bind_unburied_cost_text_blocked: "£army_experience §R15§!  £support_equipment_text_icon §R120§!  £manpower_texticon §R500§!"
death_bind_unburied_cost_text_tooltip: "£army_experience §Y15§!  £support_equipment_text_icon §Y120§!  £manpower_texticon §Y500§!"
death_interrogate_empty_road: "§RInterrogate the Empty Road§!"
death_interrogate_empty_road_desc: "The Black Book office can compare wasteland patrol reports against the names and places that vanished."
death_interrogate_empty_road_tt: "Improves the global watch network, slows Death's next spread, and raises Black Book exposure."
death_interrogate_empty_road_cost_text: "£pol_power §Y25§!  £command_power §Y10§!"
death_interrogate_empty_road_cost_text_blocked: "£pol_power §R25§!  £command_power §R10§!"
death_interrogate_empty_road_cost_text_tooltip: "£pol_power §Y25§!  £command_power §Y10§!"
death_seal_names_in_iron: "§RSeal Names in Iron§!"
death_seal_names_in_iron_desc: "The bound ledgers can be locked away before too many offices learn how the names were used."
death_seal_names_in_iron_tt: "Reduces Black Book exposure and mourning debt after bound names have been used."
death_seal_names_cost_text: "£pol_power §Y35§!  £support_equipment_text_icon §Y150§!"
death_seal_names_cost_text_blocked: "£pol_power §R35§!  £support_equipment_text_icon §R150§!"
death_seal_names_cost_text_tooltip: "£pol_power §Y35§!  £support_equipment_text_icon §Y150§!"
death_burn_black_book: "§RBurn the Black Book§!"
death_burn_black_book_desc: "The ledgers can be destroyed before the office becomes another door to the black map."
death_burn_black_book_tt: "Closes the Black Book, removes its offices and scandal, and preserves a clean record if exposure is still low."
death_burn_black_book_cost_text: "£pol_power §Y20§!"
death_burn_black_book_cost_text_blocked: "£pol_power §R20§!"
death_burn_black_book_cost_text_tooltip: "£pol_power §Y20§!"
death_close_black_book: "§RClose the Black Book§!"
death_close_black_book_desc: "The office can lock the recovered ledgers away while they have only been opened and indexed."
death_close_black_book_tt: "Closes the Black Book for free because no forbidden method has been used."
death_whisper_to_zol: "§RWhisper to Zol§!"
death_whisper_to_zol_desc: "A desperate government can ask whether Zol accepts signatures as well as bodies."
death_whisper_to_zol_tt: "Requests a private answer from Zol. If Zol answers, the Black Oath decision unlocks."
death_whisper_to_zol_cost_text: "£pol_power §Y10§!  £stability_texticon §Y5%§!"
death_whisper_to_zol_cost_text_blocked: "£pol_power §R10§!  £stability_texticon §R5%§!"
death_whisper_to_zol_cost_text_tooltip: "£pol_power §Y10§!  £stability_texticon §Y5%§!"
death_take_black_oath: "§RTake the Black Oath§!"
death_take_black_oath_desc: "The signature leaves the living response and enters a covenant with Zol. The country remains on the map because Zol allows it."
death_take_black_oath_tt: "This country becomes a Herald of Zol, leaves the Living Compact, leaves the Death war, gains the Black Oath national spirit, and begins name debt."
death_take_black_oath_cost_text: "£pol_power §Y100§!  £stability_texticon §Y12%§!  £GFX_war_support_icon §Y8%§!"
death_take_black_oath_cost_text_blocked: "£pol_power §R100§!  £stability_texticon §R12%§!  £GFX_war_support_icon §R8%§!"
death_take_black_oath_cost_text_tooltip: "£pol_power §Y100§!  £stability_texticon §Y12%§!  £GFX_war_support_icon §Y8%§!"
death_offer_prison_census: "§ROffer a Prison Census§!"
death_offer_prison_census_desc: "A Herald can offer names it claims the living world has already condemned."
death_offer_prison_census_tt: "Creates one Herald Census Host and changes black favor, name debt, and living disgust."
death_offer_prison_census_cost_text: "£pol_power §Y25§!  £stability_texticon §Y3%§!  £manpower_texticon §Y1000§!"
death_offer_prison_census_cost_text_blocked: "£pol_power §R25§!  £stability_texticon §R3%§!  £manpower_texticon §R1000§!"
death_offer_prison_census_cost_text_tooltip: "£pol_power §Y25§!  £stability_texticon §Y3%§!  £manpower_texticon §Y1000§!"
death_open_dead_port: "§ROpen a Dead Port§!"
death_open_dead_port_desc: "A Herald can prepare a non-capital coastal state for a black arrival."
death_open_dead_port_tt: "Marks §Y[FROM.GetName]§! as a temporary Dead Port, raises black favor, raises name debt, and may trigger a Death coastal jump."
death_open_dead_port_cost_text: "£command_power §Y20§!  £GFX_fuel_texticon §Y300§!  £convoy_texticon §Y12§!"
death_open_dead_port_cost_text_blocked: "£command_power §R20§!  £GFX_fuel_texticon §R300§!  £convoy_texticon §R12§!"
death_open_dead_port_cost_text_tooltip: "£command_power §Y20§!  £GFX_fuel_texticon §Y300§!  £convoy_texticon §Y12§!"
death_feed_border_to_death: "§RFeed the Border§!"
death_feed_border_to_death_desc: "A Herald can settle part of its debt by surrendering a non-capital border or coastal state to Death."
death_feed_border_to_death_tt: "Death consumes §Y[FROM.GetName]§!, black favor rises, name debt falls, and living disgust rises."
death_feed_border_cost_text: "£command_power §Y15§!  £pol_power §Y25§!  £stability_texticon §Y5%§!  £manpower_texticon §Y2000§!"
death_feed_border_cost_text_blocked: "£command_power §R15§!  £pol_power §R25§!  £stability_texticon §R5%§!  £manpower_texticon §R2000§!"
death_feed_border_cost_text_tooltip: "£command_power §Y15§!  £pol_power §Y25§!  £stability_texticon §Y5%§!  £manpower_texticon §Y2000§!"
death_break_black_oath: "§RBreak the Black Oath§!"
death_break_black_oath_desc: "The signature can be torn up, but Zol remembers which hand held the pen."
death_break_black_oath_tt: "Ends the Herald status, removes the Black Oath national spirit, returns the country to the living side, and restores war with Death when possible."
death_break_black_oath_cost_text: "£pol_power §Y120§!  £command_power §Y40§!  £stability_texticon §Y10%§!"
death_break_black_oath_cost_text_blocked: "£pol_power §R120§!  £command_power §R40§!  £stability_texticon §R10%§!"
death_break_black_oath_cost_text_tooltip: "£pol_power §Y120§!  £command_power §Y40§!  £stability_texticon §Y10%§!"
death_form_black_apostolate: "§RProclaim the Black Apostolate§!"
death_form_black_apostolate_desc: "A Herald that has served long enough can turn its covenant with Zol into a permanent state order."
death_form_black_apostolate_tt: "Changes the country into the Black Apostolate, leaves factions and the Living Compact, and exits the Death war."

death_active_wasteland_state: "Black Wasteland"
death_active_wasteland_state_desc: "Death controls this state. Manpower, factories, resources, and usable supply collapse. Enemy formations inside suffer severe attrition and movement penalties."
death_recaptured_wasteland_state: "Recaptured Wasteland"
death_recaptured_wasteland_state_desc: "The land has been taken back from Death, but its roads, depots, wells, and offices remain badly damaged."
death_border_wither_state: "Border Withering"
death_border_wither_state_desc: "The state touches a Death wasteland. Supply, movement, and recovery are weakened along the border."
death_quarantine_line_state: "Quarantine Line"
death_quarantine_line_state_desc: "Emergency barriers, watches, and signal posts improve local supply and recovery near the wasteland border."
death_coastal_watch_state: "Coastal Watch"
death_coastal_watch_state_desc: "The port has extra signal crews, evacuation lists, and patrol fuel, giving it better supply and lower attrition."
death_wasteland_entry_gear_state: "Wasteland Entry Gear"
death_wasteland_entry_gear_state_desc: "Survey teams and front units have filters, route books, and motor spares that reduce attrition and improve movement."
death_dead_zone_outpost_state: "Dead-Zone Outpost"
death_dead_zone_outpost_state_desc: "A hardened outpost improves supply, movement, and recovery inside recaptured wasteland."
death_custodial_sealed_exclusion_state: "Sealed Exclusion"
death_custodial_sealed_exclusion_state_desc: "Permanent boundary posts harden the approaches and lower operating risk, but preserve severe limits on access and construction."
death_custodial_memorial_stewardship_state: "Memorial Stewardship"
death_custodial_memorial_stewardship_state_desc: "Guarded memorial offices preserve names and receive mourners without pretending the empty settlements can become productive again."
death_custodial_transit_custodianship_state: "Transit Custodianship"
death_custodial_transit_custodianship_state_desc: "A permanent corridor office marks the one route that can be maintained across the dead land."
death_custodial_transit_maintenance_state: "Maintained Custodial Corridor"
death_custodial_transit_maintenance_state_desc: "Fresh filters, escorts, spare engines, and route crews improve supply and movement through the custodial corridor."
death_herald_dead_port_state: "Dead Port"
death_herald_dead_port_state_desc: "A Herald has prepared this harbor for Death. Local supply and recovery are weakened, and units stationed here suffer more attrition."

death_black_atlas_gui_header: "BLACK ATLAS"
death_black_atlas_gui_values_left: "Stage: §Y[GetDeathAtlasStage]§!\nConsumed states: §Y[?global.death_consumed_states|0]§!\nConsumed population: §Y[GetDeathConsumedPopulation]§!\nCoasts: §Y[GetDeathAtlasCoastRisk]§!\nWatch network: §Y[?global.death_watch_network|0]§!/§Y[?global.death_watch_network_max_display|0]§!\nJump surcharge: §Y[?global.death_watch_network_jump_cost_percent_display|0]%§!"
death_black_atlas_gui_values_right: "Line: §Y[GetDeathAtlasLineStatus]§!\nCompact: §Y[GetDeathAtlasCompactStatus]§!\nFront readiness: §Y[?global.death_front_readiness|0]§!\nWorld footholds: §Y[?global.death_world_end_footholds|0]§!"
death_black_atlas_gui_forbidden_values: "Restricted office: §Y[GetDeathAtlasForbiddenStatus]§!"
death_black_atlas_gui_footer: "The Atlas tracks Death's consumed states, threatened coasts, compact strength, and front readiness. The watch network raises Death's forced sea-jump costs, delays low-pressure jumps when strong, and blocks sea jumps at maximum strength unless Death has its bypass or world end has begun."
