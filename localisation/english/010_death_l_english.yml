death_compact_war_declaration: "Compact War Declaration"
death_compact_war_declaration_desc: "Compact members that are threatened or have confirmed the danger can enter the Death war together."
death_compact_war_declaration_tt: "Every eligible compact member that is not at war with Death enters the war. Members outside the danger area or without confirmed warning are skipped."
death_joint_coastal_patrol_plan: "Joint Coastal Patrol Plan"
death_joint_coastal_patrol_plan_desc: "Shared patrol routes let threatened coasts compare signals, fuel use, and missing ships before another shore goes silent."
death_joint_coastal_patrol_plan_tt: "Raises the global watch network by §Y2§!, up to §Y[?global.death_watch_network_max_display|0]§!, and lowers Death's spread pressure by §Y2§!. Each network point raises Death's forced island and mainland jump costs by §Y[?global.death_watch_network_cost_step_percent_display|0]%§!. A strong network can delay one normal low-pressure coastal jump by spending §Y[?global.death_watch_network_intercept_spend_display|0]§! network strength. At maximum strength, sea jumps are blocked unless Death has §YNo Ferry Returns§! or Last Shores has begun."
