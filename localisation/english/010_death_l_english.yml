death_patrol_cost_text_tooltip: "Requires £command_power §Y20§!, £GFX_fuel_texticon §Y300§!, £convoy_texticon §Y10§!, £GFX_train_texticon §Y5§!, and £support_equipment_text_icon §Y100§!."
death_authorize_wasteland_entry_gear: "Authorize Wasteland Entry Gear"
death_authorize_wasteland_entry_gear_desc: "The dead land eats engines, boots, filters, and nerves. Entry teams need gear made for absence."
death_authorize_wasteland_entry_gear_tt: "Grants temporary wasteland-entry readiness and improves front preparedness."
death_wasteland_gear_cost_text: "£army_experience §Y20§!  £GFX_fuel_texticon §Y250§!  £support_equipment_text_icon §Y200§!  £GFX_motorized_texticon §Y75§!"
death_wasteland_gear_cost_text_blocked: "£army_experience §R20§!  £GFX_fuel_texticon §R250§!  £support_equipment_text_icon §R200§!  £GFX_motorized_texticon §R75§!"
death_wasteland_gear_cost_text_tooltip: "Requires £army_experience §Y20§!, £GFX_fuel_texticon §Y250§!, £support_equipment_text_icon §Y200§!, and £GFX_motorized_texticon §Y75§!."
death_share_wasteland_entry_gear: "Share Wasteland Entry Gear"
death_share_wasteland_entry_gear_desc: "The compact survives if the gear does not stop at one border."
death_share_wasteland_entry_gear_tt: "Shares wasteland-entry readiness with compact members and improves cohesion."
death_share_gear_cost_text: "£command_power §Y20§!  £GFX_fuel_texticon §Y300§!  £support_equipment_text_icon §Y250§!  £GFX_motorized_texticon §Y100§!"
death_share_gear_cost_text_blocked: "£command_power §R20§!  £GFX_fuel_texticon §R300§!  £support_equipment_text_icon §R250§!  £GFX_motorized_texticon §R100§!"
death_share_gear_cost_text_tooltip: "Requires £command_power §Y20§!, £GFX_fuel_texticon §Y300§!, £support_equipment_text_icon §Y250§!, and £GFX_motorized_texticon §Y100§!."
death_last_shores_response: "Last Shores Response"
death_last_shores_response_desc: "Every coast is now a front. The living must answer with the last reserves that can still move."
death_last_shores_response_tt: "Marks this country as a Last Shores responder and improves global front readiness."
death_last_shores_response_cost_text: "£command_power §Y50§!  £army_experience §Y40§!  £GFX_fuel_texticon §Y800§!  £convoy_texticon §Y20§!  £support_equipment_text_icon §Y300§!  £GFX_motorized_texticon §Y150§!"
death_last_shores_response_cost_text_blocked: "£command_power §R50§!  £army_experience §R40§!  £GFX_fuel_texticon §R800§!  £convoy_texticon §R20§!  £support_equipment_text_icon §R300§!  £GFX_motorized_texticon §R150§!"
death_last_shores_response_cost_text_tooltip: "Requires £command_power §Y50§!, £army_experience §Y40§!, £GFX_fuel_texticon §Y800§!, £convoy_texticon §Y20§!, £support_equipment_text_icon §Y300§!, and £GFX_motorized_texticon §Y150§!."
death_strengthen_quarantine_line: "Strengthen Quarantine Line"
death_strengthen_quarantine_line_desc: "A controlled state touching the wasteland can be fortified against withering."
death_strengthen_quarantine_line_tt: "Applies a temporary quarantine-line modifier to §Y[FROM.GetName]§! and begins a hold-line mission."
death_quarantine_line_cost_text: "£command_power §Y15§!  £infantry_equipment_text_icon §Y500§!  £support_equipment_text_icon §Y100§!"
death_quarantine_line_cost_text_blocked: "£command_power §R15§!  £infantry_equipment_text_icon §R500§!  £support_equipment_text_icon §R100§!"
death_quarantine_line_cost_text_tooltip: "Requires £command_power §Y15§!, £infantry_equipment_text_icon §Y500§!, and £support_equipment_text_icon §Y100§!."
death_hold_quarantine_line_mission: "Hold the Quarantine Line"
death_hold_quarantine_line_mission_desc: "A fortified border must remain in living hands long enough for the line to mean something."
death_hold_quarantine_line_success_tt: "The line holds. Front readiness improves and the spread pressure falls."
death_hold_quarantine_line_failure_tt: "The line fails before the holding period ends. The spread pressure rises."
death_keep_port_lit: "Keep the Port Lit"
death_keep_port_lit_desc: "A watched port is harder for Death to take by surprise."
death_keep_port_lit_tt: "Applies a coastal-watch modifier to §Y[FROM.GetName]§!. If the state is threatened and Death later consumes it, the evacuation record is preserved."
death_coastal_watch_cost_text: "£command_power §Y5§!  £GFX_fuel_texticon §Y20000§!  £convoy_texticon §Y8§!"
death_coastal_watch_cost_text_blocked: "£command_power §R5§!  £GFX_fuel_texticon §R20000§!  £convoy_texticon §R8§!"
death_coastal_watch_cost_text_tooltip: "Requires £command_power §Y5§!, £GFX_fuel_texticon §Y20000§!, and £convoy_texticon §Y8§!."
death_survey_the_wasteland: "Survey the Wasteland"
death_survey_the_wasteland_desc: "Recovered dead land must be mapped before anyone can work inside it."
death_survey_the_wasteland_tt: "Temporarily improves movement and attrition inside §Y[FROM.GetName]§!."
death_wasteland_survey_cost_text: "£army_experience §Y10§!  £support_equipment_text_icon §Y100§!  £GFX_motorized_texticon §Y50§!"
death_wasteland_survey_cost_text_blocked: "£army_experience §R10§!  £support_equipment_text_icon §R100§!  £GFX_motorized_texticon §R50§!"
death_wasteland_survey_cost_text_tooltip: "Requires £army_experience §Y10§!, £support_equipment_text_icon §Y100§!, and £GFX_motorized_texticon §Y50§!."
death_build_dead_zone_outpost: "Build Dead-Zone Outpost"
death_build_dead_zone_outpost_desc: "The outpost does not restore the state. It makes the living able to stand there."
death_build_dead_zone_outpost_tt: "Builds a permanent outpost in §Y[FROM.GetName]§!. Post-defeat outpost records are preserved."
death_dead_zone_outpost_cost_text: "£army_experience §Y25§!  £support_equipment_text_icon §Y300§!  £GFX_motorized_texticon §Y120§!  £GFX_train_texticon §Y8§!"
death_dead_zone_outpost_cost_text_blocked: "£army_experience §R25§!  £support_equipment_text_icon §R300§!  £GFX_motorized_texticon §R120§!  £GFX_train_texticon §R8§!"
death_dead_zone_outpost_cost_text_tooltip: "Requires £army_experience §Y25§!, £support_equipment_text_icon §Y300§!, £GFX_motorized_texticon §Y120§!, and £GFX_train_texticon §Y8§!."
death_open_black_atlas: "Open the Black Atlas"
death_open_black_atlas_desc: "The Death response office can assemble the current reports into one black map."
death_open_black_atlas_tt: "Opens the §YBlack Atlas§! dashboard in the Death Country decisions."
death_open_black_book: "§ROpen the Black Book§!"
death_open_black_book_desc: "The censuses recovered from the dead land can be indexed, studied, and used. The office will not survive public scrutiny."
death_open_black_book_tt: "Opens the §YDark Methods§! branch, adding exposure and a national office for forbidden census work."
death_open_black_book_cost_text: "£pol_power §Y60§!  £stability_texticon §Y8%§!"
death_open_black_book_cost_text_blocked: "£pol_power §R60§!  £stability_texticon §R8%§!"
death_open_black_book_cost_text_tooltip: "Requires £pol_power §Y60§! and consumes £stability_texticon §Y8%§!, even if stability is lower."
death_bind_the_unburied: "§RBind the Unburied§!"
death_bind_the_unburied_desc: "Names taken from the black register can be bound into weak bodies that stand where living troops cannot."
death_bind_the_unburied_tt: "Creates a locked weak §YBound Shade§! division and raises Black Book exposure and mourning debt."
death_bind_unburied_cost_text: "£army_experience §Y15§!  £support_equipment_text_icon §Y120§!  £manpower_texticon §Y500§!"
death_bind_unburied_cost_text_blocked: "£army_experience §R15§!  £support_equipment_text_icon §R120§!  £manpower_texticon §R500§!"
death_bind_unburied_cost_text_tooltip: "Requires £army_experience §Y15§!, £support_equipment_text_icon §Y120§!, and £manpower_texticon §Y500§!."
death_interrogate_empty_road: "§RInterrogate the Empty Road§!"
death_interrogate_empty_road_desc: "Patrol reports from the wasteland can be cross-examined until the next black route becomes a little less surprising."
death_interrogate_empty_road_tt: "Improves watch reporting and lowers spread pressure, but adds Black Book exposure."
death_interrogate_empty_road_cost_text: "£pol_power §Y25§!  £command_power §Y10§!"
death_interrogate_empty_road_cost_text_blocked: "£pol_power §R25§!  £command_power §R10§!"
death_interrogate_empty_road_cost_text_tooltip: "Requires £pol_power §Y25§! and £command_power §Y10§!."
death_seal_names_in_iron: "§RSeal Names in Iron§!"
death_seal_names_in_iron_desc: "The bound ledgers can be locked behind iron seals before they begin answering too many questions."
death_seal_names_in_iron_tt: "Reduces exposure and mourning debt for a country that has bound names."
death_seal_names_cost_text: "£pol_power §Y35§!  £support_equipment_text_icon §Y150§!"
death_seal_names_cost_text_blocked: "£pol_power §R35§!  £support_equipment_text_icon §R150§!"
death_seal_names_cost_text_tooltip: "Requires £pol_power §Y35§! and £support_equipment_text_icon §Y150§!."
death_burn_black_book: "§RBurn the Black Book§!"
death_burn_black_book_desc: "The ledgers can be destroyed before the office becomes another name for surrender."
death_burn_black_book_tt: "Closes the Dark Methods branch. If names were bound and exposure stayed below scandal levels, the clean-burning record is preserved."
death_burn_black_book_cost_text: "£pol_power §Y20§!"
death_burn_black_book_cost_text_blocked: "£pol_power §R20§!"
death_burn_black_book_cost_text_tooltip: "Requires £pol_power §Y20§!."
death_whisper_to_zol: "§RWhisper to Zol§!"
death_whisper_to_zol_desc: "A government can ask whether Death accepts signatures as well as bodies."
death_whisper_to_zol_tt: "Opens the Black Oath path, gaining black favor and living disgust without yet becoming a Herald."
death_whisper_to_zol_cost_text: "£pol_power §Y50§!  £stability_texticon §Y5%§!"
death_whisper_to_zol_cost_text_blocked: "£pol_power §R50§!  £stability_texticon §R5%§!"
death_whisper_to_zol_cost_text_tooltip: "Requires £pol_power §Y50§! and consumes £stability_texticon §Y5%§!, even if stability is lower."
death_take_black_oath: "§RTake the Black Oath§!"
death_take_black_oath_desc: "The signature leaves the living compact and enters a covenant with Zol. It does not make the country safe."
death_take_black_oath_tt: "Becomes a §YHerald of Zol§!, leaves living containment structures, takes heavy political penalties, and begins name-debt collection."
death_take_black_oath_cost_text: "£pol_power §Y100§!  £stability_texticon §Y12%§!  £GFX_war_support_icon §Y8%§!"
death_take_black_oath_cost_text_blocked: "£pol_power §R100§!  £stability_texticon §R12%§!  £GFX_war_support_icon §R8%§!"
death_take_black_oath_cost_text_tooltip: "Requires £pol_power §Y100§! and £GFX_war_support_icon §Y8%§!, and consumes £stability_texticon §Y12%§! even if stability is lower."
death_offer_prison_census: "§ROffer a Prison Census§!"
death_offer_prison_census_desc: "A Herald can offer names it claims the living world has already condemned."
death_offer_prison_census_tt: "Gains black favor, raises name debt and living disgust, and creates a weak §YCensus Host§! division."
death_offer_prison_census_cost_text: "£pol_power §Y25§!  £stability_texticon §Y3%§!  £manpower_texticon §Y1000§!"
death_offer_prison_census_cost_text_blocked: "£pol_power §R25§!  £stability_texticon §R3%§!  £manpower_texticon §R1000§!"
death_offer_prison_census_cost_text_tooltip: "Requires £pol_power §Y25§! and £manpower_texticon §Y1000§!, and consumes £stability_texticon §Y3%§! even if stability is lower."
death_open_dead_port: "§ROpen a Dead Port§!"
death_open_dead_port_desc: "A Herald can leave a watched harbor ready for a black arrival."
death_open_dead_port_tt: "Marks §Y[FROM.GetName]§! as a dead port, gaining black favor and increasing Death coastal pressure."
death_open_dead_port_cost_text: "£command_power §Y20§!  £GFX_fuel_texticon §Y300§!  £convoy_texticon §Y12§!"
death_open_dead_port_cost_text_blocked: "£command_power §R20§!  £GFX_fuel_texticon §R300§!  £convoy_texticon §R12§!"
death_open_dead_port_cost_text_tooltip: "Requires £command_power §Y20§!, £GFX_fuel_texticon §Y300§!, and £convoy_texticon §Y12§!."
death_feed_border_to_death: "§RFeed the Border§!"
death_feed_border_to_death_desc: "A Herald can settle a debt by handing Death a living border state."
death_feed_border_to_death_tt: "Consumes §Y[FROM.GetName]§! through the normal Death consumption logic, lowering name debt and raising black favor."
death_feed_border_cost_text: "£command_power §Y15§!  £pol_power §Y25§!  £stability_texticon §Y5%§!  £manpower_texticon §Y2000§!"
death_feed_border_cost_text_blocked: "£command_power §R15§!  £pol_power §R25§!  £stability_texticon §R5%§!  £manpower_texticon §R2000§!"
death_feed_border_cost_text_tooltip: "Requires £command_power §Y15§!, £pol_power §Y25§!, and £manpower_texticon §Y2000§!, and consumes £stability_texticon §Y5%§! even if stability is lower."
death_break_black_oath: "§RBreak the Black Oath§!"
death_break_black_oath_desc: "The signature can be torn up, but Zol remembers which hand held the pen."
death_break_black_oath_tt: "Ends Herald status, removes Black Oath effects, and invites Death retaliation if it can still wage war."
death_break_black_oath_cost_text: "£pol_power §Y120§!  £command_power §Y40§!  £stability_texticon §Y10%§!"
death_break_black_oath_cost_text_blocked: "£pol_power §R120§!  £command_power §R40§!  £stability_texticon §R10%§!"
death_break_black_oath_cost_text_tooltip: "Requires £pol_power §Y120§! and £command_power §Y40§!, and consumes £stability_texticon §Y10%§! even if stability is lower."
death_form_black_apostolate: "§RProclaim the Black Apostolate§!"
death_form_black_apostolate_desc: "A Herald that has served long enough can stop pretending it remains a normal state."
death_form_black_apostolate_tt: "Takes the §YBlack Apostolate§! cosmetic identity, accepts permanent isolation, and deepens the Black Oath route."

death_active_wasteland_state: "Death Wasteland"
death_active_wasteland_state_desc: "The state has been consumed. Supply, recovery, movement, and machinery have collapsed, and living formations inside are worn down day by day."
death_recaptured_wasteland_state: "Recaptured Death Wasteland"
death_recaptured_wasteland_state_desc: "The state is no longer controlled by Death, but the land remains empty, broken, starved of supply, and punishing to cross."
death_border_wither_state: "Death Border Withering"
death_border_wither_state_desc: "The state borders a Death wasteland. Supply, movement, recovery, and idle formations are slowly being worn down even before the border gives way."
death_quarantine_line_state: "Death Quarantine Line"
death_quarantine_line_state_desc: "Emergency barriers, watches, and signal posts slow the wasteland's pressure across the border."
death_coastal_watch_state: "Death Coastal Watch"
death_coastal_watch_state_desc: "The port is kept under constant watch against sudden black-shore reports."
death_wasteland_entry_gear_state: "Wasteland Entry Gear"
death_wasteland_entry_gear_state_desc: "Survey teams and front units have gear prepared for movement through recaptured dead land."
death_dead_zone_outpost_state: "Dead-Zone Outpost"
death_dead_zone_outpost_state_desc: "A hardened outpost lets the living stand in the recovered wasteland without pretending it is restored."
death_herald_dead_port_state: "Dead Port"
death_herald_dead_port_state_desc: "The harbor remains on the map, but its lights and records have been prepared for Death."

