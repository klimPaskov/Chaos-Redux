death_the_first_silence_focus: "The First Silence"
death_the_first_silence_focus_desc: "Death begins on one remote island while outside governments see only lost mail and silent ports."
death_the_first_silence_focus_tt: "Lowers Death spread pressure by §Y1§!."
death_country_on_the_island: "A Country on the Island"
death_country_on_the_island_desc: "The first consumed island becomes Death's anchor. It stays quiet until the silence can reach another shore."
death_country_on_the_island_tt: "Creates the Death country if needed and raises Death spread pressure by §Y1§!."
death_shroud_focus_available_tt: "Death must be hidden, at peace, and no later than Gathering Storm. A living-country survey war must not have started."
death_shroud_whispers: "Shroud Whispers"
death_shroud_whispers_desc: "Missed boats, failed radio replies, and late cargo manifests reach different offices before anyone connects them."
death_shroud_whispers_tt: "Starts the Shroud lane and lowers Death spread pressure by §Y1§!."
death_no_mail_before_spring: "No Mail Before Spring"
death_no_mail_before_spring_desc: "Ordinary delays and storm excuses keep the first reports from becoming a public crisis."
death_no_mail_before_spring_tt: "Delays missing-island reports and lowers Death spread pressure by §Y2§!."
death_weather_on_paper: "Weather on Paper"
death_weather_on_paper_desc: "Bad weather and broken radios take the blame, giving Death more time before governments act."
death_weather_on_paper_tt: "Treats early reports as routine weather notices and lowers Death's spread pressure by 1."
death_island_pattern: "The Island Pattern"
death_island_pattern_desc: "The missing-island reports begin to match, and Death can start looking for another small shore."
death_island_pattern_tt: "Lets Death use this branch for future island spread and raises Death spread pressure by §Y1§!. If island spread is already active, Death also attempts to consume one valid island state."
death_hunger_shore: "Hunger Shore"
death_hunger_shore_desc: "Death searches for poorly defended islands before larger coasts understand the pattern."
death_hunger_shore_tt: "Raises Death spread pressure by §Y2§! and attempts to consume one valid island state."
death_lowest_names_first: "Lowest Names First"
death_lowest_names_first_desc: "The next choices favor smaller populations and weak garrisons."
death_lowest_names_first_tt: "Raises Death spread pressure by §Y1§!. Future island spread prefers states with fewer than §Y50K§! people."
death_ports_without_voices: "Ports Without Voices"
death_ports_without_voices_desc: "More island ports stop answering, and the reports begin to arrive closer together."
death_ports_without_voices_tt: "Raises Death spread pressure by §Y2§!."
death_mainland_smell: "The Mainland Smell"
death_mainland_smell_desc: "Death can begin reaching for a mainland coast. A successful mainland jump will make the country public."
death_mainland_smell_tt: "Raises Death's spread pressure by 3 and attempts one mainland jump. A qualifying war can open the route before the usual Chaos threshold."
death_black_census_focus: "Black Census"
death_black_census_focus_desc: "Every consumed state adds names to the register used to raise ghost hosts."
death_black_census_focus_tt: "Adds §YBlack Census§! if Death does not have it and raises Death spread pressure by §Y1§!."
death_no_graves_needed: "No Graves Needed"
death_no_graves_needed_desc: "The dead can hold ruined ground where the living cannot stay."
death_no_graves_needed_tt: "Adds soul power equal to the current cost of one weak ghost host to Death's shared pool."
death_first_ghost_muster: "First Ghost Muster"
death_first_ghost_muster_desc: "Weak ghost hosts gather in the wasteland. They are passive border holders and weaker than infantry."
death_first_ghost_muster_tt: "Spends available ghost-host budget. At §Y600§! chaos or higher, Death can spawn one weak ghost host."
death_public_death_focus: "Public Death"
death_public_death_focus_desc: "The mainland coast has fallen. Death can no longer be mistaken for a handful of lost ships."
death_public_death_focus_tt: "Makes Death a major power, replaces its hidden spirit with Public Death, and declares war on eligible neighbors. Death becomes a world threat after it consumes a continent."
death_tide_learns_roads: "The Tide Learns Roads"
death_tide_learns_roads_desc: "After the mainland reveal, Death can use land routes as well as sea routes to keep spreading."
death_tide_learns_roads_tt: "Raises Death spread pressure by §Y1§! and attempts one coastal jump."
death_another_shoreline: "Another Shoreline"
death_another_shoreline_desc: "Containment must watch more than one coast because the next black landing can come from another shore."
death_another_shoreline_tt: "Raises Death spread pressure by §Y2§! and attempts one coastal jump."
death_no_ferry_returns: "No Ferry Returns"
death_no_ferry_returns_desc: "Death crosses guarded waters and reaches shores whose lights still burn."
death_no_ferry_returns_tt: "Raises Death spread pressure by §Y2§! and attempts one coastal jump. Future coastal jumps can ignore §YCoastal Watch§!."
death_wasteland_roads: "Wasteland Roads"
death_wasteland_roads_desc: "Death's advance reaches farther through the dead land and closes on the next border."
death_wasteland_roads_tt: "Raises Death's spread pressure by §Y2§! and adds withering progress to an eligible border state during each spread pulse."
death_every_road_slows: "Every Road Slows"
death_every_road_slows_desc: "The next border settlement falls faster as every road out of the dead zone fails."
death_every_road_slows_tt: "Raises Death's spread pressure by §Y1§! and adds withering progress to one eligible border state during the next spread pulse."
death_empty_supply: "The Empty Supply"
death_empty_supply_desc: "Captured hubs, rails, ports, and depots remain marked on the map, but they stop serving living armies."
death_empty_supply_tt: "Removes or damages buildings in every active wasteland controlled by Death."
death_state_without_state: "State Without State"
death_state_without_state_desc: "Recaptured wasteland needs surveys and outposts before it can support troops again."
death_state_without_state_tt: "Raises Death spread pressure by §Y2§!, adds withering progress to one valid neighboring state, and gives future withering attempts §Y1§! extra progress."
death_mourning_host: "Mourning Host"
death_mourning_host_desc: "The first ghost hosts hold ground, but they have low organization and weak combat power."
death_mourning_host_tt: "Spends available ghost-host budget. At §Y600§! chaos or higher, Death can spawn one weak ghost host."
death_ruin_host: "Ruin Host"
death_ruin_host_desc: "More ghost hosts gather and become steadier, but they remain weaker than normal infantry."
death_ruin_host_tt: "Spends available ghost-host budget. At §Y800§! chaos or higher, Death can spawn up to two hollow ghost hosts."
death_orders_without_breath: "Orders Without Breath"
death_orders_without_breath_desc: "At the final stage, ghost hosts are strong enough to attack instead of only holding borders."
death_orders_without_breath_tt: "Spends available ghost-host budget. During the world-end stage, Death also attempts four last-shore ghost-host spawns."
death_last_shores_focus: "Last Shores"
death_last_shores_focus_desc: "After a continent is consumed, Death can open footholds on every remaining continent."
death_last_shores_focus_tt: "Raises Death spread pressure by §Y5§!. If Death can start the world-end stage, it starts it. If the stage has already started, it creates new world-end footholds."
death_world_consumed_focus: "World Consumed"
death_world_consumed_focus_desc: "Every eligible populated state has been consumed, and no living country remains to fight Death."
death_world_consumed_focus_tt: "Fires the §YNo Witness Remains§! super event if it has not already fired."

death_weak_ghost_host: "Weak Ghost Host"
death_weak_ghost_host_desc: "A brittle host that can hold ruined ground and breaks quickly under prepared attack."
death_hollow_ghost_host: "Hollow Ghost Host"
death_hollow_ghost_host_desc: "A denser host with more bodies in the line, still weaker than ordinary infantry."
death_last_shore_ghost_host: "Last Shore Host"
death_last_shore_ghost_host_desc: "A last-shore host raised to meet ordinary infantry on the final coast."

