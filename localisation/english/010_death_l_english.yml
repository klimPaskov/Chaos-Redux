death_file_under_weather: "File It Under Weather"
death_file_under_weather_desc: "The ministry can close the file as weather, damaged radio, and bad navigation."
death_file_under_weather_tt: "Reduces case confidence by §R3§!, closes this country's quiet investigation, and speeds the unknown route's spread. A scheduled second report can reopen a file dismissed after the first report."
death_recognize_death_war: "Declare the Death War"
death_recognize_death_war_desc: "This government has enough proof, or enough danger on its border, to name the enemy and enter the war."
death_recognize_death_war_tt: "Declares war on Death, or lets Death declare war on this country. Requires a state bordering a Death wasteland, or a coastal state together with an established warning about Death. Countries already at war with Death cannot use it."
