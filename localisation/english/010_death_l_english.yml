death_open_dead_port: "§ROpen a Dead Port§!"
death_open_dead_port_desc: "A Herald can prepare a non-capital coastal state for a black arrival."
death_open_dead_port_tt: "Marks §Y[FROM.GetName]§! as a Dead Port for §Y90§! days, raises Black Favor by §Y2§!, Name Debt by §Y1§!, and Living Disgust by §Y1§!, and can trigger a Death coastal jump."
death_open_dead_port_cost_text: "£command_power §Y[?global.black_friday_price_death_decision_cost_open_dead_port_cp|0]§!  £GFX_fuel_texticon §Y[?global.black_friday_price_death_decision_cost_open_dead_port_fuel|0]§!  £convoy_texticon §Y[?global.black_friday_price_death_decision_cost_open_dead_port_convoy|0]§!"
