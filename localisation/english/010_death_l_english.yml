death_hold_quarantine_line_mission: "Hold the Quarantine Line"
death_hold_quarantine_line_mission_desc: "Keep at least one quarantine-line state next to the wasteland until the holding period ends."
death_hold_quarantine_line_success_tt: "The line holds. Global front readiness rises by §Y1§! and Death's spread pressure falls by §Y2§!."
death_hold_quarantine_line_failure_tt: "No quarantine-line state borders the wasteland any longer, and Death's spread pressure rises by §Y1§!."
death_hide_port_lit_decisions: "Hide Port Watch Decisions"
death_hide_port_lit_decisions_desc: "Hide the state list for ports that can still be kept under watch."
death_hide_port_lit_decisions_tt: "Hides §YKeep the Port Lit§! state decisions from this country's decision list."
death_show_port_lit_decisions: "Show Port Watch Decisions"
death_show_port_lit_decisions_desc: "Show the state list for ports that can still be kept under watch."
death_show_port_lit_decisions_tt: "Shows §YKeep the Port Lit§! state decisions for this country."
death_keep_port_lit: "Keep the Port Lit"
death_keep_port_lit_desc: "A watched port keeps lamps burning, signal crews awake, and evacuation lists close at hand."
death_keep_port_lit_tt: "[GetDeathKeepPortLitTooltip]"
death_keep_port_lit_unknown_tt: "Adds §YCoastal Watch§! to §Y[FROM.GetName]§! for §Y120§! days and raises the watch network by §Y1§!, up to §Y[?global.death_watch_network_max_display|0]§!. The unknown route cannot enter this state through an ordinary sea crossing while the watch lasts. Each network point makes forced sea crossings harder, and a network at maximum strength blocks them."
death_keep_port_lit_confirmed_tt: "Adds §YCoastal Watch§! to §Y[FROM.GetName]§! for §Y120§! days and raises the global watch network by §Y1§!, up to §Y[?global.death_watch_network_max_display|0]§!. Death cannot choose this state for a normal coastal jump while the watch lasts. Each network point raises Death's forced island and mainland jump costs by §Y[?global.death_watch_network_cost_step_percent_display|0]%§!. At maximum strength, sea jumps are blocked. §YNo Ferry Returns§! and Last Shores let Death ignore both protections."
death_coastal_watch_cost_text: "£command_power §Y[?global.black_friday_price_death_decision_cost_coastal_watch_cp|0]§!  £GFX_fuel_texticon §Y[?global.black_friday_price_death_decision_cost_coastal_watch_fuel|0]§!  £convoy_texticon §Y[?global.black_friday_price_death_decision_cost_coastal_watch_convoy|0]§!"
death_coastal_watch_cost_text_blocked: "£command_power §R[?global.black_friday_price_death_decision_cost_coastal_watch_cp|0]§!  £GFX_fuel_texticon §R[?global.black_friday_price_death_decision_cost_coastal_watch_fuel|0]§!  £convoy_texticon §R[?global.black_friday_price_death_decision_cost_coastal_watch_convoy|0]§!"
death_coastal_watch_cost_text_tooltip: "£command_power §Y[?global.black_friday_price_death_decision_cost_coastal_watch_cp|0]§!  £GFX_fuel_texticon §Y[?global.black_friday_price_death_decision_cost_coastal_watch_fuel|0]§!  £convoy_texticon §Y[?global.black_friday_price_death_decision_cost_coastal_watch_convoy|0]§!"
death_survey_the_wasteland: "Survey the Wasteland"
death_survey_the_wasteland_desc: "A field division escorts survey crews as they map roads, wells, depots, and shelter in the dead zone."
death_survey_the_wasteland_tt: "Requires one of your divisions in §Y[FROM.GetName]§!. The survey marks the state as surveyed, adds one custodial capacity the first time, and grants Wasteland Entry Gear there for §Y180§! days. The gear ends if Death retakes the state."
death_survey_field_division_required: "A division under your command must be stationed in the selected state."
death_wasteland_survey_cost_text: "£army_experience §Y[?global.black_friday_price_death_decision_cost_wasteland_survey_army_xp|0]§!  £support_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_wasteland_survey_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_wasteland_survey_truck|0]§!"
death_wasteland_survey_cost_text_blocked: "£army_experience §R[?global.black_friday_price_death_decision_cost_wasteland_survey_army_xp|0]§!  £support_equipment_text_icon §R[?global.black_friday_price_death_decision_cost_wasteland_survey_support|0]§!  £GFX_motorized_equipment_text_icon §R[?global.black_friday_price_death_decision_cost_wasteland_survey_truck|0]§!"
