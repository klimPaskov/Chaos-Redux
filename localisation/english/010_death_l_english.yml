death_select_sealed_exclusion: "Impose Sealed Exclusion"
death_select_sealed_exclusion_desc: "The outpost becomes a closed boundary office. Patrols defend marked approaches, keep civilians out, and accept that the state will remain inaccessible."
death_select_sealed_exclusion_tt: "Spends £GFX_death_custodial_capacity_texticon §Y[?global.death_custodial_sealed_exclusion_cost_display|0]§! capacity to assign §Y[FROM.GetName]§! to permanent Sealed Exclusion. Containment and defense improve while access and construction remain restricted. The erased population, factories, and resources do not return."
death_custodial_sealed_exclusion_cost_text: "£GFX_death_custodial_capacity_texticon §Y[?global.death_custodial_sealed_exclusion_cost_display|0]§!"
death_custodial_sealed_exclusion_cost_text_blocked: "£GFX_death_custodial_capacity_texticon §R[?global.death_custodial_sealed_exclusion_cost_display|0]§!"
death_custodial_sealed_exclusion_cost_text_tooltip: "Spends £GFX_death_custodial_capacity_texticon §Y[?global.death_custodial_sealed_exclusion_cost_display|0]§! custodial capacity."
death_select_memorial_stewardship: "Establish Memorial Stewardship"
death_select_memorial_stewardship_desc: "The outpost keeps the names, maps the empty settlements, and receives mourners under guard. The state becomes a national obligation rather than a productive district."
death_select_memorial_stewardship_tt: "Spends £GFX_death_custodial_capacity_texticon §Y[?global.death_custodial_memorial_stewardship_cost_display|0]§! capacity to assign §Y[FROM.GetName]§! to permanent Memorial Stewardship. The first memorial program in a country grants §G+3%§! stability and reduces mourning debt by up to §Y2§!. A country receives this benefit once. Production, resources, and population remain erased."
death_custodial_memorial_stewardship_cost_text: "£GFX_death_custodial_capacity_texticon §Y[?global.death_custodial_memorial_stewardship_cost_display|0]§!"
death_custodial_memorial_stewardship_cost_text_blocked: "£GFX_death_custodial_capacity_texticon §R[?global.death_custodial_memorial_stewardship_cost_display|0]§!"
death_custodial_memorial_stewardship_cost_text_tooltip: "Spends £GFX_death_custodial_capacity_texticon §Y[?global.death_custodial_memorial_stewardship_cost_display|0]§! custodial capacity."
death_select_transit_custodianship: "Open a Custodial Transit Corridor"
death_select_transit_custodianship_desc: "A guarded corridor carries support stores and fuel across the dead land. Its custodial office must remain staffed to keep the route open."
death_select_transit_custodianship_tt: "Spends £GFX_death_custodial_capacity_texticon §Y[?global.death_custodial_transit_custodianship_cost_display|0]§! capacity and the listed service stores to assign §Y[FROM.GetName]§! to permanent Transit Custodianship. A maintained corridor improves movement and supply for §Y180 days§!. Renew its upkeep to restore those benefits. The erased population, factories, and resources do not return."
death_custodial_transit_custodianship_cost_text: "£support_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_custodial_transit_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_custodial_transit_truck|0]§!  £GFX_fuel_texticon §Y[?global.black_friday_price_death_decision_cost_custodial_transit_fuel|0]§!"
death_custodial_transit_custodianship_cost_text_blocked: "£support_equipment_text_icon §R[?global.black_friday_price_death_decision_cost_custodial_transit_support|0]§!  £GFX_motorized_equipment_text_icon §R[?global.black_friday_price_death_decision_cost_custodial_transit_truck|0]§!  £GFX_fuel_texticon §R[?global.black_friday_price_death_decision_cost_custodial_transit_fuel|0]§!"
death_custodial_transit_custodianship_cost_text_tooltip: "£GFX_death_custodial_capacity_texticon §Y[?global.death_custodial_transit_custodianship_cost_display|0]§!  £support_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_custodial_transit_support|0]§!\n£GFX_motorized_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_custodial_transit_truck|0]§!  £GFX_fuel_texticon §Y[?global.black_friday_price_death_decision_cost_custodial_transit_fuel|0]§!"
death_maintain_transit_custodianship: "Maintain the Custodial Corridor"
death_maintain_transit_custodianship_desc: "Filters wear out and route markers vanish unless the transit office receives another service allotment."
death_maintain_transit_custodianship_tt: "Pays the listed upkeep and restores the maintained transit benefits in §Y[FROM.GetName]§! for §Y180 days§!. The underlying custodial policy remains even when active maintenance lapses."
death_custodial_transit_upkeep_cost_text: "£support_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_custodial_transit_upkeep_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_custodial_transit_upkeep_truck|0]§!  £GFX_fuel_texticon §Y[?global.black_friday_price_death_decision_cost_custodial_transit_upkeep_fuel|0]§!"
death_custodial_transit_upkeep_cost_text_blocked: "£support_equipment_text_icon §R[?global.black_friday_price_death_decision_cost_custodial_transit_upkeep_support|0]§!  £GFX_motorized_equipment_text_icon §R[?global.black_friday_price_death_decision_cost_custodial_transit_upkeep_truck|0]§!  £GFX_fuel_texticon §R[?global.black_friday_price_death_decision_cost_custodial_transit_upkeep_fuel|0]§!"
death_custodial_transit_upkeep_cost_text_tooltip: "£support_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_custodial_transit_upkeep_support|0]§!  £GFX_motorized_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_custodial_transit_upkeep_truck|0]§!  £GFX_fuel_texticon §Y[?global.black_friday_price_death_decision_cost_custodial_transit_upkeep_fuel|0]§!\nThe service allotment renews the corridor's maintained benefits for 180 days."
death_open_black_atlas: "Open the Black Atlas"
death_open_black_atlas_desc: "The response office can show the current Death map, including consumed states, watch strength, compact status, and front readiness."
death_open_black_atlas_tt: "Opens the §YBlack Atlas§! dashboard in the Death decisions."
death_open_black_book: "§ROpen the Black Book§!"
death_open_black_book_desc: "The censuses recovered from the dead land can be indexed, studied, and used. The office will not survive public scrutiny."
death_open_black_book_tt: "Opens the Black Book, adds the Black Book Offices spirit, and raises Black Book exposure by §Y2§!."
death_open_black_book_cost_text: "£pol_power §Y[?global.black_friday_price_death_decision_cost_open_black_book_pp|0]§!  £stability_texticon §Y[?global.black_friday_price_death_decision_cost_open_black_book_stability|%0]§!"
death_open_black_book_cost_text_blocked: "£pol_power §R[?global.black_friday_price_death_decision_cost_open_black_book_pp|0]§!  £stability_texticon §R[?global.black_friday_price_death_decision_cost_open_black_book_stability|%0]§!"
death_open_black_book_cost_text_tooltip: "£pol_power §Y[?global.black_friday_price_death_decision_cost_open_black_book_pp|0]§!  £stability_texticon §Y[?global.black_friday_price_death_decision_cost_open_black_book_stability|%0]§!"
death_bind_the_unburied: "§RBind the Unburied§!"
death_bind_the_unburied_desc: "Names taken from the black register can be bound into weak bodies that stand where living troops cannot remain."
death_bind_the_unburied_tt: "Raises one weak Bound Shade division, raises Black Book exposure by §Y2§!, and adds §Y2§! mourning debt."
death_bind_unburied_cost_text: "£army_experience §Y[?global.black_friday_price_death_decision_cost_bind_unburied_army_xp|0]§!  £support_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_bind_unburied_support|0]§!  £manpower_texticon §Y[?global.black_friday_price_death_decision_cost_bind_unburied_manpower|0]§!"
death_bind_unburied_cost_text_blocked: "£army_experience §R[?global.black_friday_price_death_decision_cost_bind_unburied_army_xp|0]§!  £support_equipment_text_icon §R[?global.black_friday_price_death_decision_cost_bind_unburied_support|0]§!  £manpower_texticon §R[?global.black_friday_price_death_decision_cost_bind_unburied_manpower|0]§!"
death_bind_unburied_cost_text_tooltip: "£army_experience §Y[?global.black_friday_price_death_decision_cost_bind_unburied_army_xp|0]§!  £support_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_bind_unburied_support|0]§!  £manpower_texticon §Y[?global.black_friday_price_death_decision_cost_bind_unburied_manpower|0]§!"
death_interrogate_empty_road: "§RInterrogate the Empty Road§!"
death_interrogate_empty_road_desc: "The Black Book office compares patrol sightings and coastal warnings to identify routes Death can reach."
death_interrogate_empty_road_tt: "Current route assessment: [GetDeathInterrogationTargetBand] The assessment points to a broad route and never to a single state. The inquiry adds §Y[?global.death_interrogate_watch_gain_display|0]§! to the watch network, lowers spread pressure by §Y[?global.death_interrogate_pressure_reduction_display|0]§!, and raises Black Book exposure by §Y[?global.death_interrogate_exposure_gain_display|0]§!. Exposure of §Y6§! brings Black Book scandal and reduces compact cohesion. Lower pressure slows Death only when it drops below a pressure band."
death_interrogate_band_world_end: "Death's Last Shores campaign is active. A routine inquiry cannot identify its next foothold."
death_interrogate_band_coastal_extreme: "A coastal jump is currently available, and spread pressure is at its highest band."
death_interrogate_band_coastal_high: "A coastal jump is currently available, and spread pressure is high."
death_interrogate_band_coastal: "At least one coastal jump target is currently available."
death_interrogate_band_frontier_extreme: "A frontier is open to land withering, and spread pressure is at its highest band."
death_interrogate_band_frontier: "A frontier is open to land withering."
death_interrogate_band_quiet: "No coastal jump or land-withering target is currently available."
death_interrogate_empty_road_cost_text: "£pol_power §Y[?global.black_friday_price_death_decision_cost_interrogate_empty_road_pp|0]§!  £command_power §Y[?global.black_friday_price_death_decision_cost_interrogate_empty_road_cp|0]§!"
death_interrogate_empty_road_cost_text_blocked: "£pol_power §R[?global.black_friday_price_death_decision_cost_interrogate_empty_road_pp|0]§!  £command_power §R[?global.black_friday_price_death_decision_cost_interrogate_empty_road_cp|0]§!"
death_interrogate_empty_road_cost_text_tooltip: "£pol_power §Y[?global.black_friday_price_death_decision_cost_interrogate_empty_road_pp|0]§!  £command_power §Y[?global.black_friday_price_death_decision_cost_interrogate_empty_road_cp|0]§!"
death_seal_names_in_iron: "§RSeal Names in Iron§!"
death_seal_names_in_iron_desc: "The Black Book office seals one recaptured border state against Death's slow advance."
death_seal_names_in_iron_tt: "Blocks Death's border wither in §Y[FROM.GetName]§! for §Y[?global.death_seal_names_protection_days_display|0]§! days and protects its divisions from daily damage. The state cannot be sealed again for §Y[?global.death_seal_names_cooldown_days_display|0]§! days. A landing or military attack can still retake it, and if Death does so while the seal holds, spread pressure rises by §Y[?global.death_seal_names_reconsumption_pressure_display|0]§!. Black Book exposure falls by §Y[?global.death_seal_names_exposure_reduction_display|0]§! and mourning debt falls by §Y[?global.death_seal_names_mourning_debt_reduction_display|0]§!."
death_seal_names_cost_text: "£pol_power §Y[?global.black_friday_price_death_decision_cost_seal_names_pp|0]§!  £support_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_seal_names_support|0]§!  £GFX_train_texticon §Y[?global.black_friday_price_death_decision_cost_seal_names_train|0]§!"
death_seal_names_cost_text_blocked: "£pol_power §R[?global.black_friday_price_death_decision_cost_seal_names_pp|0]§!  £support_equipment_text_icon §R[?global.black_friday_price_death_decision_cost_seal_names_support|0]§!  £GFX_train_texticon §R[?global.black_friday_price_death_decision_cost_seal_names_train|0]§!"
death_seal_names_cost_text_tooltip: "£pol_power §Y[?global.black_friday_price_death_decision_cost_seal_names_pp|0]§!  £support_equipment_text_icon §Y[?global.black_friday_price_death_decision_cost_seal_names_support|0]§!  £GFX_train_texticon §Y[?global.black_friday_price_death_decision_cost_seal_names_train|0]§!"
death_burn_black_book: "§RBurn the Black Book§!"
death_burn_black_book_desc: "The office can be closed before forbidden work reaches the streets."
death_burn_black_book_tt: "Closes the Black Book and removes the Black Book Offices spirit and any scandal. Bound Shades already raised stay in service."
death_burn_black_book_cost_text: "£pol_power §Y[?global.black_friday_price_death_decision_cost_burn_black_book_pp|0]§!"
death_burn_black_book_cost_text_blocked: "£pol_power §R[?global.black_friday_price_death_decision_cost_burn_black_book_pp|0]§!"
death_burn_black_book_cost_text_tooltip: "£pol_power §Y[?global.black_friday_price_death_decision_cost_burn_black_book_pp|0]§!"
death_close_black_book: "§RClose the Black Book§!"
death_close_black_book_desc: "The office closes without cost as long as no forbidden method has been used."
death_close_black_book_tt: "Closes the Black Book at no cost."
death_whisper_to_zol: "§RWhisper to Zol§!"
death_whisper_to_zol_desc: "A desperate government can ask whether Zol accepts signatures as well as bodies."
death_whisper_to_zol_tt: "Requests a private answer from Zol and adds §Y1§! Black Favor and §Y1§! Living Disgust. The Black Oath decision unlocks once Zol answers."
death_whisper_to_zol_cost_text: "£pol_power §Y[?global.black_friday_price_death_decision_cost_whisper_to_zol_pp|0]§!  £stability_texticon §Y[?global.black_friday_price_death_decision_cost_whisper_to_zol_stability|%0]§!"
