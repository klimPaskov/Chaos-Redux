chaosx_super_event.62.t: "Death"
chaosx_super_event.62.q: "\"Men fear death, as children fear to go in the dark.\"\n §Y-Francis Bacon-§!"
chaosx_super_event.62.a: "For the living there is hope."
chaosx_super_event.62.d: "Death has shown enough of itself to be named. It takes every living person from a place at once, strips the land of use, and leaves only the rule of Zol behind.\n\nIt chooses its next place the same way, and the search for the next name has already begun."
chaosx_super_event.63.t: "The Census of Zol"
chaosx_super_event.63.q: "\"And we are here as on a darkling plain,\nSwept with confused alarms of struggle and flight.\"\n §Y-Matthew Arnold-§!"
chaosx_super_event.63.a: "The sea gave up the dead which were in it."
chaosx_super_event.63.d: "A consumed continent shows what Death has been doing all along. The islands, the mainland hunger, and the ghost hosts were one design, which empties the living, ruins the ground beneath them, and uses the dead land to reach the next population.\n\nZol's hosts now gather with a clear purpose. They move like a census that means to finish its list."
chaosx_super_event.64.t: "The Unfinished Work"
chaosx_super_event.64.q: "\"It is for us the living, rather, to be dedicated here to the unfinished work.\"\n §Y-Abraham Lincoln-§!"
chaosx_super_event.64.a: "We will remember them."
chaosx_super_event.64.d: "Death has been driven from its last state. Empty towns, dead ports, and broken supply roads remain across the world.\n\nThe first island's silence still has no answer."
chaosx_super_event.65.t: "No Witness Remains"
chaosx_super_event.65.q: "\"Creation sleeps. 'Tis as the general pulse\nOf life stood still, and nature made a pause.\"\n §Y-Edward Young-§!"
chaosx_super_event.65.a: "The rest is silence."
chaosx_super_event.65.d: "No human voice remains anywhere. Every home, port, and field lies empty under Zol's silence.\n\nThe last refuge has fallen, and no one is left to bear witness."
chaosx_super_event.66.t: "A Covenant with Death"
chaosx_super_event.66.q: "\"We have made a covenant with death.\"\n §Y-Isaiah 28:15, KJV-§!"
chaosx_super_event.66.a: "We are at agreement."
chaosx_super_event.66.d: "[death_black_oath_herald.GetOldNameDefCap] has chosen Zol's oath. Its ministers surrender names, open prison doors, and let Death enter through their own walls.\n\nThe Heralds carry Death's reach into the living world, bound to Zol by the names they gave him."
