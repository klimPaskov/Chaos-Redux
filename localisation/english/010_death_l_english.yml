death_feed_border_to_death: "§RFeed the Border§!"
death_feed_border_to_death_desc: "A Herald can settle part of its debt by surrendering a non-capital border or coastal state to Death."
death_feed_border_to_death_tt: "Death consumes §Y[FROM.GetName]§!. Black Favor rises by §Y3§!, Name Debt falls by §Y3§!, and Living Disgust rises by §Y1§!."
death_feed_border_cost_text: "£command_power §Y[?global.black_friday_price_death_decision_cost_feed_border_cp|0]§!  £pol_power §Y[?global.black_friday_price_death_decision_cost_feed_border_pp|0]§!  £stability_texticon §Y[?global.black_friday_price_death_decision_cost_feed_border_stability|%0]§!"
