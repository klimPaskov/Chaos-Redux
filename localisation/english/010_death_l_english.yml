death_the_first_silence_focus: "The First Silence"
death_the_first_silence_focus_desc: "The country begins as a correction in ledgers and sea charts, not as a proclamation."
death_country_on_the_island: "A Country on the Island"
death_country_on_the_island_desc: "The black administration is fixed to its first shore while the world still lacks a public name for it."
death_shroud_whispers: "Shroud Whispers"
death_shroud_whispers_desc: "Harbor records, failed replies, and late manifests are made harder to join into one answer."
death_no_mail_before_spring: "No Mail Before Spring"
death_no_mail_before_spring_desc: "The missing routes become ordinary delay, bad weather, and clerical silence for as long as the shroud can hold."
death_weather_on_paper: "Weather on Paper"
death_weather_on_paper_desc: "Storms, fog, and dead radios take the blame for what the sea is carrying from island to island."
death_island_pattern: "The Island Pattern"
death_island_pattern_desc: "The reports begin to rhyme across harbors, but they still do not speak the name."
death_hunger_shore: "Hunger Shore"
death_hunger_shore_desc: "Low islands and empty docks teach Death to choose the smallest names first."
death_lowest_names_first: "Lowest Names First"
death_lowest_names_first_desc: "The early spread bends toward the least defended populations before larger coasts understand the pattern."
death_ports_without_voices: "Ports Without Voices"
death_ports_without_voices_desc: "Piers, fuel books, and coastal offices vanish from the record before their absence reaches the capitals."
death_mainland_smell: "The Mainland Smell"
death_mainland_smell_desc: "The hunger that learned the islands begins to press toward a mainland shore."
death_black_census_focus: "Black Census"
death_black_census_focus_desc: "Every consumed place becomes a register, and the register begins to matter to the hosts."
death_no_graves_needed: "No Graves Needed"
death_no_graves_needed_desc: "The book does not bury the names. It keeps them as numbers that can stand where people cannot."
death_first_ghost_muster: "First Ghost Muster"
death_first_ghost_muster_desc: "When Chaos is high enough, the first weak hosts gather in the wasteland and hold the line."
death_public_death_focus: "Public Death"
death_public_death_focus_desc: "The mainland reveal gives the world a name, a border, and a war it cannot call a disaster."
death_tide_learns_roads: "The Tide Learns Roads"
death_tide_learns_roads_desc: "After public reveal, the sea is no longer only water; it is a road back to the living map."
death_another_shoreline: "Another Shoreline"
death_another_shoreline_desc: "Containment cannot trust one coast when the next black landing can answer from elsewhere."
death_no_ferry_returns: "No Ferry Returns"
death_no_ferry_returns_desc: "Lights and patrols still matter, but no watched pier is certain once the tide has learned the route."
death_wasteland_roads: "Wasteland Roads"
death_wasteland_roads_desc: "The black state learns to move through territory that has no economy, no shelter, and no answer."
death_every_road_slows: "Every Road Slows"
death_every_road_slows_desc: "The wasteland turns roads into traps and delays every living formation that crosses the border."
death_empty_supply: "The Empty Supply"
death_empty_supply_desc: "Hubs, rails, ports, and depots are kept as shapes on the map while their use is stripped away."
death_state_without_state: "State Without State"
death_state_without_state_desc: "A recovered wasteland remains a dead administrative fact unless the living build hard points inside it."
death_mourning_host: "Mourning Host"
death_mourning_host_desc: "The first hosts do not conquer like armies. They stand where the living cannot remain."
death_ruin_host: "Ruin Host"
death_ruin_host_desc: "As Chaos climbs, the hosts gather in greater number while still falling short of living infantry."
death_orders_without_breath: "Orders Without Breath"
death_orders_without_breath_desc: "At the edge of world-end, the hosts learn to move from holding a border to pressing it."
death_last_shores_focus: "Last Shores"
death_last_shores_focus_desc: "Once the sea stops being a barrier, every remaining continent receives a shore of Death."
death_world_consumed_focus: "World Consumed"
death_world_consumed_focus_desc: "No witness, no state, and no coast remains outside the black map."

