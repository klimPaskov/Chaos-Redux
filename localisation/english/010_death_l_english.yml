death_share_wasteland_entry_gear: "Share Wasteland Entry Gear"
death_share_wasteland_entry_gear_desc: "The compact needs kits, filters, and route books that do not stop at one frontier."
death_share_wasteland_entry_gear_tt: "Gives temporary wasteland-entry gear to Living Compact members and increases compact cohesion."
death_share_gear_cost_text: "£command_power §Y20§!  £GFX_fuel_texticon §Y300§!  £support_equipment_text_icon §Y250§!  £GFX_motorized_equipment_text_icon §Y100§!"
