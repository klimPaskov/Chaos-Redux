death_call_living_conference: "Call the Living Conference"
death_call_living_conference_desc: "Governments facing direct danger or confirmed coastal evidence can coordinate watches, border work, and wasteland entry under one table."
death_call_living_conference_tt: "Forms the Living Compact, makes this country its leader, invites eligible countries that are threatened or have confirmed the danger, and starts compact cohesion."
