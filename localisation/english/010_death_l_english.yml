chaosx.nr10.1.t: "Death"
chaosx.nr10.2.t: "The Missing Island"
chaosx.nr10.2.d: "The first report is not a declaration and not a warning. It is a correction to maps, shipping notices, and port ledgers.\n\nAn island appears to have gone missing from the practical world. Harbors list no arrivals from it. Radios find no reply. Pilots returning over the water disagree on whether they saw coastline, fog, or nothing at all.\n\nNo government has named an enemy. No survivor has reached a dock."
chaosx.nr10.2.a: "File the report."
chaosx.nr10.3.t: "More Empty Harbors"
chaosx.nr10.3.d: "The second report is harder to bury. Fishing fleets avoid a marked passage. A lighthouse fails without a storm. Relief crews sent toward a low island return with their manifests intact and their questions changed.\n\nOfficials call it a navigational emergency. The papers call it a maritime failure. The families waiting on the quays call it by no official name."
chaosx.nr10.3.a: "The sea keeps poor records."
chaosx.nr10.10.t: "Death Pulse"

death_missing_island_category: "Missing Island"
death_missing_island_category_desc: "Reports describe missing harbors, unanswered radios, and islands whose records no longer agree with the sea. The source is not yet public."
death_country_containment_category: "Death Country"
death_country_containment_category_desc: "Death has been named. Containment now depends on war, coastal watch, compact coordination, and work inside the wasteland."
death_focus_tree: "Death"
death_send_survey_boat: "Send a Survey Boat"
death_send_survey_boat_desc: "A small naval survey can follow the broken shipping route before the mainland understands what is missing."
death_send_survey_boat_tt: "A survey boat attempts to identify the missing-island pattern and forces an early containment war if the source can be found."
