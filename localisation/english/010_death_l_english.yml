death_break_black_oath: "§RBreak the Black Oath§!"
death_break_black_oath_desc: "The signature can be torn up, but Zol remembers which hand held the pen."
death_break_black_oath_tt: "Ends Herald status, removes the Black Oath national spirit and any Census Hosts, and lets Death declare war on this country if it can."
death_break_black_oath_cost_text: "£pol_power §Y[?global.black_friday_price_death_decision_cost_break_oath_pp|0]§!  £command_power §Y[?global.black_friday_price_death_decision_cost_break_oath_cp|0]§!  £stability_texticon §Y[?global.black_friday_price_death_decision_cost_break_oath_stability|%0]§!"
