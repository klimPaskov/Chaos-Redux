death_raise_hollow_hosts: "Raise Hollow Hosts"
death_raise_hollow_hosts_desc: "Hollow hosts are denser than the first hosts and still weaker than living infantry."
death_raise_hollow_hosts_tt: "Spends §Y[?global.death_stronger_host_soul_cost|2]§! soul power for each host raised and raises up to two hollow ghost host divisions in Death wasteland states. Each host raised adds §Y0.25§! soul power to future host costs."
death_hollow_host_soul_cost_text: "£GFX_death_soul_power_texticon Soul power §Y[?global.death_stronger_host_soul_cost|2]§!"
death_hollow_host_soul_cost_text_blocked: "£GFX_death_soul_power_texticon Soul power §R[?global.death_stronger_host_soul_cost|2]§!"
death_hollow_host_soul_cost_text_tooltip: "£GFX_death_soul_power_texticon Soul power §Y[?global.death_stronger_host_soul_cost|2]§!\nSpends the displayed soul power only when a hollow ghost host is raised."
death_raise_last_shore_hosts: "Raise Last-Shore Hosts"
death_raise_last_shore_hosts_desc: "Last-shore hosts attack living positions in the territories Death has taken."
death_raise_last_shore_hosts_tt: "Spends §Y[?global.death_world_end_host_soul_cost|2]§! soul power for each host raised and raises up to four last-shore hosts in Death wasteland states. Each host raised adds §Y0.25§! soul power to future host costs."
