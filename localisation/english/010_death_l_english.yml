death_share_wasteland_entry_gear_desc: "The compact needs kits, filters, and route books that do not stop at one frontier."
death_share_wasteland_entry_gear_tt: "Equips the entry teams of every Living Compact member for §Y180§! days and raises compact cohesion by §Y1§!."
