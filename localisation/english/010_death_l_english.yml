l_english:
chaosx.nr10.1.t: "Death"
chaosx.nr10.2.t: "The Missing Island"
chaosx.nr10.2.d: "The first report arrives as a correction to maps, shipping notices, and port ledgers.\n\nAn island appears to have gone missing from the practical world. Harbors list no arrivals from it. Radios find no reply. Pilots returning over the water disagree on whether they saw coastline, fog, or nothing at all.\n\nNo government has named an enemy. No survivor has reached a dock."
chaosx.nr10.2.a: "File the report."
chaosx.nr10.2.tt: "The report is recorded. Missing Island decisions become available for this country."
chaosx.nr10.3.t: "More Empty Harbors"
chaosx.nr10.3.d: "The second report is harder to bury. Fishing fleets avoid a marked passage. A lighthouse fails without a storm. Relief crews sent toward a low island return with their manifests intact and their questions changed.\n\nOfficials call it a navigational emergency. The papers call it a maritime failure. The families waiting on the quays call it by no official name."
chaosx.nr10.3.a: "The sea keeps poor records."
chaosx.nr10.3.tt: "The second report is recorded and keeps the quiet investigation decisions visible. Death remains unnamed."
chaosx.nr10.10.t: "Death Pulse"
chaosx.nr10.20.t: "A Reply Without Breath"
chaosx.nr10.20.d: "The office receives no letter, no envoy, and no seal from Death. The answer arrives as a correction inside the census books: a page that had been blank now lists the ministry by name, the cabinet by title, and the country as a debt not yet collected.\n\nZol has heard."
chaosx.nr10.20.a: "The room has grown colder."
chaosx.nr10.20.tt: "The Black Oath path is open. This country has gained black favor and living disgust, and may sign the oath if it can pay the cost."
chaosx.nr10.21.t: "The Black Oath"
chaosx.nr10.21.d: "The signature is entered without ceremony. The ministers call it an arrangement, a delay, a necessary correspondence with the border that eats maps.\n\nBeyond the living world, Zol accepts the country as Herald. The name-debt begins at once."
chaosx.nr10.21.a: "We are at agreement."
chaosx.nr10.21.tt: "This country becomes a Herald of Zol, leaves living containment structures, gains the Black Oath national spirit, and begins name-debt collection."
chaosx.nr10.24.t: "Friend of Zol"

death_missing_island_category: "Missing Island"
death_missing_island_category_desc: "Reports describe missing harbors, unanswered radios, and islands whose records no longer agree with the sea. The source is not yet public."
death_country_containment_category: "Death Country"
death_country_containment_category_desc: "Death has been named. Containment now depends on war, coastal watch, compact coordination, and work inside the wasteland."
death_focus_tree: "Death"
death_send_survey_boat: "Send a Survey Boat"
death_send_survey_boat_desc: "A small naval survey can follow the broken shipping route before the mainland understands what is missing."
death_send_survey_boat_tt: "A survey boat attempts to identify the missing-island pattern and forces an early containment war if the source can be found."
death_survey_boat_cost_text: "£command_power §Y20§!  £GFX_fuel_texticon §Y250§!  £convoy_texticon §Y6§!"
death_survey_boat_cost_text_blocked: "£command_power §R20§!  £GFX_fuel_texticon §R250§!  £convoy_texticon §R6§!"
death_survey_boat_cost_text_tooltip: "Requires £command_power §Y20§!, £GFX_fuel_texticon §Y250§!, and £convoy_texticon §Y6§!."
death_check_telegraph_office: "Check the Telegraph Office"
death_check_telegraph_office_desc: "The last ordinary records may still show when the island stopped answering."
death_check_telegraph_office_tt: "The census and telegraph trail is preserved, slowing spread pressure and improving later name-ledger work."
death_telegraph_cost_text: "£pol_power §Y30§!  £command_power §Y5§!"
death_telegraph_cost_text_blocked: "£pol_power §R30§!  £command_power §R5§!"
death_telegraph_cost_text_tooltip: "Requires £pol_power §Y30§! and £command_power §Y5§!."
death_quiet_quarantine_notice: "Issue Quiet Quarantine Notices"
death_quiet_quarantine_notice_desc: "Harbor masters can close lanes without naming the thing behind the silence."
death_quiet_quarantine_notice_tt: "A temporary quiet quarantine lowers the spread pressure before public reveal."
death_quiet_quarantine_cost_text: "£command_power §Y25§!  £GFX_fuel_texticon §Y400§!  £convoy_texticon §Y12§!  £support_equipment_text_icon §Y150§!"
death_quiet_quarantine_cost_text_blocked: "£command_power §R25§!  £GFX_fuel_texticon §R400§!  £convoy_texticon §R12§!  £support_equipment_text_icon §R150§!"
death_quiet_quarantine_cost_text_tooltip: "Requires £command_power §Y25§!, £GFX_fuel_texticon §Y400§!, £convoy_texticon §Y12§!, and £support_equipment_text_icon §Y150§!."
death_file_under_weather: "File It Under Weather"
death_file_under_weather_desc: "The report can be folded into storms, damaged radios, and navigation errors."
death_file_under_weather_tt: "The report is buried. The spread pressure increases."
death_recognize_death_war: "Recognize the Death War"
death_recognize_death_war_desc: "The black country is not a disaster zone. It is a hostile power on the map."
death_recognize_death_war_tt: "Enter war with Death if a valid war declaration path exists."
death_recognize_war_cost_text: "£command_power §Y30§!  £GFX_war_support_icon §Y3%§!"
death_recognize_war_cost_text_blocked: "£command_power §R30§!  £GFX_war_support_icon §R3%§!"
death_recognize_war_cost_text_tooltip: "Requires £command_power §Y30§! and £GFX_war_support_icon §Y3%§!."
death_call_living_conference: "Call the Living Conference"
death_call_living_conference_desc: "The countries still able to answer should coordinate while they still have ports, maps, and names."
death_call_living_conference_tt: "Forms the §YLiving Compact§!, invites threatened countries, and begins compact cohesion tracking."
death_call_compact_cost_text: "£pol_power §Y75§!  £command_power §Y25§!"
death_call_compact_cost_text_blocked: "£pol_power §R75§!  £command_power §R25§!"
death_call_compact_cost_text_tooltip: "Requires £pol_power §Y75§! and £command_power §Y25§!."
death_join_living_compact: "Join the Living Compact"
death_join_living_compact_desc: "The compact is not a faction. It is a shared refusal to let Death define the coastline alone."
death_join_living_compact_tt: "Joins the §YLiving Compact§!, increasing member count and cohesion."
death_join_compact_cost_text: "£pol_power §Y35§!"
death_join_compact_cost_text_blocked: "£pol_power §R35§!"
death_join_compact_cost_text_tooltip: "Requires £pol_power §Y35§!."
death_compact_war_declaration: "Compact War Declaration"
death_compact_war_declaration_desc: "Compact members that still hesitate can be brought into the Death war together."
death_compact_war_declaration_tt: "Every eligible compact member enters war with Death."
death_joint_coastal_patrol_plan: "Joint Coastal Patrol Plan"
death_joint_coastal_patrol_plan_desc: "Coasts need light, fuel, signal books, and ships that still return."
death_joint_coastal_patrol_plan_tt: "Builds the global coastal watch network and slows spread pressure."
death_patrol_cost_text: "£command_power §Y20§!  £GFX_fuel_texticon §Y300§!  £convoy_texticon §Y10§!  £GFX_train_texticon §Y5§!  £support_equipment_text_icon §Y100§!"
