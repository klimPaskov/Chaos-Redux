l_english:
chaosx.nr10.1.t: "Death"
chaosx.nr10.2.t: "No Answer from [GetDeathMissingIslandName]"
chaosx.nr10.2.d: "Mail and wireless calls to [GetDeathMissingIslandName] have gone unanswered. The last mail boat never came back, and no harbor has reported a landing.\n\nFishermen on the nearest coast say the water around the island has gone quiet. A survey boat could still follow the route and find out why."
chaosx.nr10.2.a: "Open the file."
chaosx.nr10.2.tt: "Opens the Missing Island Reports case and raises case confidence by §Y2§!."
chaosx.nr10.3.t: "Another Quiet Route"
chaosx.nr10.3.d: "More ships have vanished from another coast. Fishing crews have stopped using one route, a lighthouse has gone without supplies, and island traffic has thinned along the whole stretch.\n\nSeveral ports describe the same silence, and the harbor offices have begun comparing their logs."
chaosx.nr10.3.a: "Keep the file open."
chaosx.nr10.3.tt: "Raises case confidence by §Y3§! and reopens a case dismissed after the first report."
chaosx.nr10.10.t: "Death Pulse"
chaosx.nr10.4.t: "Death Reaches the Mainland"
chaosx.nr10.4.d: "Death has come ashore on the mainland at [death_current_reveal_state.GetName]. It has emptied [?global.death_consumed_states|0] states and consumed [GetDeathConsumedPopulation] people so far.\n\nThe silence that began with the missing islands now has a name: Death."
chaosx.nr10.4.a: "Now we know what we are facing."
chaosx.nr10.5.t: "The Outbreak Has Not Begun"
chaosx.nr10.5.d: "[GetDeathInstantOutbreakFailure]"
chaosx.nr10.5.d.world_end: "Another world-ending crisis is already under way, and Death cannot take its place."
chaosx.nr10.5.d.defeated: "Death has already been driven back, so there is no outbreak to resume."
chaosx.nr10.5.d.active: "Death already holds territory, so the outbreak cannot begin again."
chaosx.nr10.5.d.no_candidates: "Death found no island it could reach, and no territory changed hands."
chaosx.nr10.5.a: "Understood."
chaosx.nr10.20.t: "A Reply Without Breath"
chaosx.nr10.20.d: "A blank census page lies open on the desk. Overnight it has filled with the names of the ministry, the cabinet, and the country, written in a hand no one in the office knows.\n\nA cold voice answers from beyond the room, unhurried and certain. Zol has heard the request."
chaosx.nr10.20.a: "The room has grown colder."
chaosx.nr10.20.tt: "Zol has answered. The country can still hold to the living response or sign his oath."
chaosx.nr10.21.t: "The Black Oath"
chaosx.nr10.21.d: "The government signs Zol's oath and becomes his Herald. Its new authority comes with a debt, and the debt grows with every name it surrenders."
chaosx.nr10.21.a: "We are at agreement."
chaosx.nr10.21.tt: "This country becomes a Herald of Zol, leaves the Living Compact and the Death war, and gains the Black Oath spirit. Living Compact members declare war on it."
chaosx.nr10.24.t: "Friend of Zol"

death_missing_island_category: "Missing Island Reports"
death_missing_island_category_desc: "An island has stopped answering mail and radio.\n\nCase confidence: [GetDeathMaritimeCaseStatus]\n[GetDeathMaritimeInvestigationAdvice]"
death_maritime_case_status_none: "No connected case"
death_maritime_case_status_fragmentary: "Isolated sightings"
death_maritime_case_status_pattern: "A connected route pattern"
death_maritime_case_status_probable: "A probable common cause"
death_maritime_case_status_independently_confirmed: "Confirmed hostile erasure"
death_maritime_case_status_publicly_confirmed: "Confirmed as Death's approach"
death_maritime_case_advice_none: "The ministry has no preserved evidence tying one silence to another."
death_maritime_case_advice_fragmentary: "One route has gone silent. Registry work can show when ships, mail, and wireless traffic stopped matching."
death_maritime_case_advice_pattern: "Harbor reports point to one sea lane. A survey can seek direct proof."
death_maritime_case_advice_probable: "The case is strong enough to justify a dangerous survey. Nothing yet gives a public name to whatever follows the route."
death_maritime_case_advice_confirmed: "The evidence now shows an enemy behind the missing ships, damaged radios, and empty routes."
death_country_containment_category: "[GetDeathContainmentCategoryTitle]"
death_country_containment_category_unknown: "Coastal Precautions"
death_country_containment_category_confirmed: "The Black Country"
death_country_containment_category_aftermath: "Custody of the Empty Land"
death_country_containment_category_desc: "[GetDeathContainmentCategoryDescription]"
death_country_containment_category_unknown_desc: "Signal crews, lit ports, patrol fuel, and evacuation lists protect exposed coasts while the cause remains unnamed."
death_country_containment_category_active_desc: "Death has a ruler, a border, and states on the map. Fight it directly, reinforce threatened coasts, and coordinate through the Living Compact."
death_country_containment_category_aftermath_desc: "Death has been driven from the map, and the consumed states remain empty. Survey each dead zone, build an outpost, and choose a permanent burden for it.[GetDeathContainmentAftermathStatus]"
death_custodial_category_status: "\n\n§YCustodial capacity:§! £GFX_death_custodial_capacity_texticon [?death_custodial_capacity|0]\n§gThe first survey and the first outpost in each state add one capacity each, and Compact service and Death's defeat can add more. Policies spend capacity. Erased people, factories, and resources do not return.§!"
death_custodial_category_status_hidden: ""
