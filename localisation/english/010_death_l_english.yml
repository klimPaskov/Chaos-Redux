death_join_living_compact: "Join the Living Compact"
death_join_living_compact_desc: "The compact gives threatened and warned governments a shared table for patrols, border work, and wasteland entry."
death_join_living_compact_tt: "Joins the Living Compact and increases compact membership and cohesion."
death_join_compact_cost_text: "£pol_power §Y[?global.black_friday_price_death_decision_cost_join_compact_pp|0]§!"
