super_event.62.t: "His Name Was Death"
super_event.62.q: "\"Men fear death, as children fear to go in the dark.\"\n §Y-Francis Bacon-§!"
super_event.62.a: "For the living there is hope."
super_event.62.d: "The first mainland state has fallen silent. The reports no longer describe missing boats or empty islands. They describe a country on the map, black at the borders and absent at the center, governed by Zol and called Death.\n\nThe living now have a name for what has been reaching out from the sea."
super_event.63.t: "No More Sea"
super_event.63.q: "\"And we are here as on a darkling plain,\nSwept with confused alarms of struggle and flight.\"\n §Y-Matthew Arnold-§!"
super_event.63.a: "The sea gave up the dead which were in it."
super_event.63.d: "A continent has gone black, and Chaos has climbed past the last ordinary warnings. New footholds appear on distant coasts as if the oceans have stopped separating the world and started delivering it.\n\nDeath is no longer a border crisis. It is a terminal shore."
super_event.64.t: "The Unfinished Work"
super_event.64.q: "\"It is for us the living, rather, to be dedicated here to the unfinished work.\"\n §Y-Abraham Lincoln-§!"
super_event.64.a: "We will remember them."
super_event.64.d: "The last Death-controlled state has been taken back. The black country has no ordinary surrender to sign and no capital from which to speak; it leaves only wastelands, empty ledgers, and names that cannot answer.\n\nThe living have survived the shape of Death. The work after it is not victory. It is memory, quarantine, and rebuilding."
super_event.65.t: "There Was No Man"
super_event.65.q: "\"Creation sleeps. 'Tis as the general pulse\nOf life stood still, and nature made a pause.\"\n §Y-Edward Young-§!"
super_event.65.a: "The rest is silence."
super_event.65.d: "There are no receiving stations left, no front lines, no governments counting losses, and no harbor lights to mark a return. The map has become one black absence.\n\nDeath has consumed the world, and no witness remains inside it."
