l_english:
chaosx.nr10.1.t: "Death"
chaosx.nr10.2.t: "No Answer from [GetDeathMissingIslandName]"
chaosx.nr10.2.d: "[GetDeathMissingIslandName] has not answered routine mail, wireless checks, or harbor traffic for quite some time. The last mail boat did not return, and the most recent port record has no confirmed arrival from the island.\n\nMaybe something is going on there. The file is still small enough for a quiet investigation, and a survey boat might find the problem before anyone outside the ministry notices."
chaosx.nr10.2.a: "Open the file."
chaosx.nr10.2.tt: "Opens a §YMissing Island Reports§! case file and raises case confidence by §Y2§!."
chaosx.nr10.3.t: "Another Quiet Route"
chaosx.nr10.3.d: "A second coastal packet reaches the ministry after several weeks of delay. Fishing crews are avoiding a marked route, a lighthouse contractor says the last supply order was never received, and relief cargo meant for a small island has no confirmed landing.\n\nThe records no longer look like one bad radio set. The country can still act quietly, but waiting will leave fewer routes to check."
chaosx.nr10.3.a: "Keep the file open."
chaosx.nr10.3.tt: "Raises case confidence by §Y3§!. A file dismissed after the first report is reopened for quiet investigation."
chaosx.nr10.10.t: "Death Pulse"
chaosx.nr10.20.t: "A Reply Without Breath"
chaosx.nr10.20.d: "No courier enters the building, and no seal is left on the ministerial desk. The answer appears inside the census books, where a page that had been blank lists the ministry by name, the cabinet by title, and the country as an item still waiting for collection.\n\nZol has heard the request."
chaosx.nr10.20.a: "The room has grown colder."
chaosx.nr10.20.tt: "Zol has answered. The Black Oath decision can now be taken if this country chooses to leave the living response."
chaosx.nr10.21.t: "The Black Oath"
chaosx.nr10.21.d: "The signature is entered without ceremony. The ministers call it an arrangement, a delay, and a necessary correspondence with the border that eats maps.\n\nBeyond the living world, Zol accepts the country as Herald. The name debt begins at once."
chaosx.nr10.21.a: "We are at agreement."
chaosx.nr10.21.tt: "This country becomes a Herald of Zol, leaves the Living Compact, leaves the Death war, and gains the Black Oath national spirit."
chaosx.nr10.24.t: "Friend of Zol"

death_missing_island_category: "Missing Island Reports"
death_missing_island_category_desc: "A named island has stopped answering mail, radio, and shipping traffic. The file can still be handled quietly by checking records, sending a survey boat, restricting suspect routes, or dismissing the reports.\n\n§YCase confidence:§! [GetDeathMaritimeCaseStatus]\n§g[GetDeathMaritimeInvestigationAdvice]§!"
death_maritime_case_status_none: "No connected case"
death_maritime_case_status_fragmentary: "Fragmentary records"
death_maritime_case_status_pattern: "A connected route pattern"
death_maritime_case_status_probable: "A probable common cause"
death_maritime_case_status_independently_confirmed: "Confirmed hostile erasure"
death_maritime_case_status_publicly_confirmed: "Confirmed as Death's approach"
death_maritime_case_advice_none: "The ministry has no preserved evidence tying one silence to another."
death_maritime_case_advice_fragmentary: "One route is silent. Registry work can establish when ships, mail, and wireless traffic stopped agreeing."
death_maritime_case_advice_pattern: "Separate records now point toward one maritime pattern. Harbor restrictions can buy time while a survey seeks direct proof."
death_maritime_case_advice_probable: "The case is strong enough to justify a dangerous survey, but the world still has no public name for what follows the route."
death_maritime_case_advice_confirmed: "The survey has found an enemy where the ministry expected weather and damaged radios. The case no longer depends on inference."
death_country_containment_category: "[GetDeathContainmentCategoryTitle]"
death_country_containment_category_unknown: "Coastal Precautions"
death_country_containment_category_confirmed: "The Black Country"
death_country_containment_category_aftermath: "Custody of the Empty Land"
death_country_containment_category_desc: "[GetDeathContainmentCategoryDescription]"
death_country_containment_category_unknown_desc: "An unanswered maritime route justifies quiet signal crews, lit ports, patrol fuel, and evacuation lists. These precautions protect exposed coasts without giving the unknown cause a public name."
death_country_containment_category_active_desc: "Death has a ruler, a border, and states on the map. Fight it directly, reinforce threatened coasts, coordinate through the Living Compact, and prepare recaptured wasteland for the burden that follows."
death_country_containment_category_aftermath_desc: "Death has been driven from the map, but every consumed state remains empty. Survey each dead zone, establish an outpost, and choose which permanent burden the country will accept.[GetDeathContainmentAftermathStatus]"
death_custodial_category_status: "\n\n§YCustodial capacity:§! [?death_custodial_capacity|0]\n§gThe first survey and first outpost in each state contribute 1 capacity each. Compact service at defeat contributes 2, and qualifying participation in Death's defeat contributes 2. Reconsumption and control transfer never recreate a state's spent contributions. A permanent policy spends this capacity. Population, factories, resources, and the wasteland state category never return.§!"
death_custodial_category_status_hidden: ""
death_black_ledger_category: "The Black Ledger"
death_black_ledger_category_desc: "Consumed states: §Y[?global.death_consumed_states|0]§!  Islands: §Y[?global.death_consumed_island_states|0]§!  Mainland states: §Y[?global.death_mainland_consumed_states|0]§!\nConsumed population: §Y[GetDeathConsumedPopulation]§!\nSpread pressure: §Y[?global.death_spread_pressure|0]§!. Mainland route at §Y[?global.death_mainland_pressure_threshold_display|0]§!. Withering grows faster at §Y[?global.death_high_pressure_threshold_display|0]§! and §Y[?global.death_extreme_pressure_threshold_display|0]§!. Coastal jumps widen at §Y[?global.death_coastal_jump_pressure_threshold_display|0]§!.\nWatch network: §Y[?global.death_watch_network|0]§!/§Y[?global.death_watch_network_max_display|0]§!. Each point raises forced island and mainland jump costs by §Y[?global.death_watch_network_cost_step_percent_display|0]%§!. Current surcharge: §Y[?global.death_watch_network_jump_cost_percent_display|0]%§!. At maximum strength, sea jumps are blocked unless Death has §YNo Ferry Returns§! or world end has begun.\nSoul power: §Y[GetDeathSoulPowerAvailable]§! usable  §Y[GetDeathSoulPowerSpent]§! spent  §Y[GetDeathSoulPowerTotal]§! generated. Soul power can keep growing.\nSource: +§Y1§! per consumed state  +§Y1§! per §Y[?global.death_soul_power_population_step_k|0]K§! consumed people  +§Y[?global.death_world_end_foothold_soul_points|0]§! per last-shore foothold after world end.\nCurrent costs: island §Y[?global.death_island_spread_soul_cost|2]§!, mainland §Y[?global.death_mainland_spread_soul_cost|2]§!, weak host §Y[?global.death_passive_host_soul_cost|2]§!, hollow host §Y[?global.death_stronger_host_soul_cost|2]§!, last-shore host §Y[?global.death_world_end_host_soul_cost|2]§!.\nIsland spread: §Y[GetDeathIslandSpreadStatus]§!  Mainland route: §Y[GetDeathMainlandSpreadStatus]§!  Ghost hosts: §Y[GetDeathGhostHostStatus]§!\nHosts raised: §Y[?global.death_passive_hosts_spawned|0]§! weak, §Y[?global.death_stronger_hosts_spawned|0]§! hollow, §Y[?global.death_world_end_hosts_spawned|0]§! last-shore."
