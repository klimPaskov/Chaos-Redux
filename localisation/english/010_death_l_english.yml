death_focus_tree: "Death"
death_consume_another_island: "Consume Another Island"
death_consume_another_island_desc: "Death spends stored soul power to consume a valid island. The watch network makes forced sea jumps more expensive, and each successful island raises the next island base cost."
death_consume_another_island_tt: "Spends §Y[?global.death_island_spread_soul_cost|2]§! soul power and consumes one valid island if a target remains. The island must have no stationed divisions. Each success raises the island base cost by §Y1§! soul power. A maximum watch network blocks this sea jump unless Death has §YNo Ferry Returns§! or world end has begun."
death_island_spread_soul_cost_text: "Soul power §Y[?global.death_island_spread_soul_cost|2]§!"
death_island_spread_soul_cost_text_blocked: "Soul power §R[?global.death_island_spread_soul_cost|2]§!"
death_press_to_mainland: "Press Toward the Mainland"
death_press_to_mainland_desc: "Death spends soul power to force a mainland coastal state into the ledger."
death_press_to_mainland_tt: "Spends §Y[?global.death_mainland_spread_soul_cost|2]§! soul power and tries to consume one valid mainland coastal state. Each success raises the mainland base cost by §Y2§! soul power. The route still needs the mainland focus, enough pressure, or the living-war bypass after Second Shore. A maximum watch network blocks this sea jump unless Death has §YNo Ferry Returns§! or world end has begun."
death_mainland_spread_soul_cost_text: "Soul power §Y[?global.death_mainland_spread_soul_cost|2]§!"
death_mainland_spread_soul_cost_text_blocked: "Soul power §R[?global.death_mainland_spread_soul_cost|2]§!"
death_raise_passive_hosts: "Raise Weak Ghost Hosts"
death_raise_passive_hosts_desc: "The first hosts are thin and passive, useful for holding a border rather than winning one."
death_raise_passive_hosts_tt: "Spends §Y[?global.death_passive_host_soul_cost|2]§! soul power and raises one weak ghost host in a Death wasteland state. Each host raised increases future host costs by §Y0.25§! soul power."
death_passive_host_soul_cost_text: "Soul power §Y[?global.death_passive_host_soul_cost|2]§!"
death_passive_host_soul_cost_text_blocked: "Soul power §R[?global.death_passive_host_soul_cost|2]§!"
death_raise_hollow_hosts: "Raise Hollow Hosts"
death_raise_hollow_hosts_desc: "The later hosts are still weaker than living infantry, but they can hold more ground."
death_raise_hollow_hosts_tt: "Spends §Y[?global.death_stronger_host_soul_cost|2]§! soul power for each host raised and can raise up to two hollow ghost host divisions in Death wasteland states. Each host raised increases future host costs by §Y0.25§! soul power."
death_hollow_host_soul_cost_text: "Soul power §Y[?global.death_stronger_host_soul_cost|2]§!"
death_hollow_host_soul_cost_text_blocked: "Soul power §R[?global.death_stronger_host_soul_cost|2]§!"
death_raise_last_shore_hosts: "Raise Last-Shore Hosts"
death_raise_last_shore_hosts_desc: "World-end hosts can fight as a real army."
death_raise_last_shore_hosts_tt: "Spends §Y[?global.death_world_end_host_soul_cost|2]§! soul power for each host raised and calls several last-shore hosts into Death wasteland states. Each host raised increases future host costs by §Y0.25§! soul power."
death_last_shore_host_soul_cost_text: "Soul power §Y[?global.death_world_end_host_soul_cost|2]§!"
death_last_shore_host_soul_cost_text_blocked: "Soul power §R[?global.death_world_end_host_soul_cost|2]§!"
death_send_survey_boat: "Send a Survey Boat"
death_send_survey_boat_desc: "A small naval survey can follow the missing route while the case is still confined to quiet ministry files."
death_send_survey_boat_tt: "[GetDeathSurveyBoatTooltip]"
death_send_survey_boat_unknown_tt: "Sends a survey boat beyond the last reliable port record. The voyage can confirm the common cause, slow its movement along the route, and force this country to answer whatever the crew finds."
death_send_survey_boat_confirmed_tt: "Sends a survey boat toward the confirmed Death route, reduces its spread pressure by §Y2§!, and attempts to enter an early containment war."
death_survey_boat_cost_text: "£command_power §Y20§!  £GFX_fuel_texticon §Y250§!  £convoy_texticon §Y6§!"
death_survey_boat_cost_text_blocked: "£command_power §R20§!  £GFX_fuel_texticon §R250§!  £convoy_texticon §R6§!"
death_survey_boat_cost_text_tooltip: "£command_power §Y20§!  £GFX_fuel_texticon §Y250§!  £convoy_texticon §Y6§!"
death_check_telegraph_office: "Check the Telegraph Office"
death_check_telegraph_office_desc: "Telegraph, mail, port, and census records can show when the island stopped answering."
death_check_telegraph_office_tt: "Raises case confidence by §Y2§!, preserves verified port, mail, and wireless records, and slows the unknown route's spread."
death_telegraph_cost_text: "£pol_power §Y30§!  £command_power §Y5§!"
death_telegraph_cost_text_blocked: "£pol_power §R30§!  £command_power §R5§!"
death_telegraph_cost_text_tooltip: "£pol_power §Y30§!  £command_power §Y5§!"
death_quiet_quarantine_notice: "Issue Harbor Sanitation Notices"
death_quiet_quarantine_notice_desc: "Harbor masters can quietly restrict traffic from suspect routes under routine health and customs authority."
death_quiet_quarantine_notice_tt: "The first notice raises case confidence by §Y1§!. Every use temporarily restricts sea traffic and lowers the chance that another island goes silent without making the case public."
death_quiet_quarantine_cost_text: "£command_power §Y25§!  £GFX_fuel_texticon §Y400§!  £convoy_texticon §Y12§!  £support_equipment_text_icon §Y150§!"
death_quiet_quarantine_cost_text_blocked: "£command_power §R25§!  £GFX_fuel_texticon §R400§!  £convoy_texticon §R12§!  £support_equipment_text_icon §R150§!"
death_quiet_quarantine_cost_text_tooltip: "£command_power §Y25§!  £GFX_fuel_texticon §Y400§!  £convoy_texticon §Y12§!  £support_equipment_text_icon §Y150§!"
death_file_under_weather: "File It Under Weather"
death_file_under_weather_desc: "The ministry can close the file as weather, damaged radio, and bad navigation."
death_file_under_weather_tt: "Reduces case confidence by §R3§! and closes this country's quiet investigation. A scheduled second report can reopen a file dismissed after the first report."
death_recognize_death_war: "Declare the Death War"
death_recognize_death_war_desc: "This government has enough proof, or enough danger on its border, to name the enemy and enter the war."
death_recognize_death_war_tt: "Declares war on Death if this country can legally enter the war. The decision is limited to countries that border a Death wasteland, already have direct contact with Death, or hold a confirmed coastal warning."
death_recognize_war_cost_text: "£command_power §Y30§!  £GFX_war_support_icon §Y3%§!"
death_recognize_war_cost_text_blocked: "£command_power §R30§!  £GFX_war_support_icon §R3%§!"
death_recognize_war_cost_text_tooltip: "£command_power §Y30§!  £GFX_war_support_icon §Y3%§!"
death_call_living_conference: "Call the Living Conference"
death_call_living_conference_desc: "Governments with direct danger or confirmed coastal warnings can coordinate watches, border work, and wasteland entry under one table."
death_call_living_conference_tt: "Forms the Living Compact, makes this country its leader, invites eligible countries that are threatened or have confirmed the danger, and starts compact cohesion."
death_call_compact_cost_text: "£pol_power §Y75§!  £command_power §Y25§!"
death_call_compact_cost_text_blocked: "£pol_power §R75§!  £command_power §R25§!"
death_call_compact_cost_text_tooltip: "£pol_power §Y75§!  £command_power §Y25§!"
death_join_living_compact: "Join the Living Compact"
death_join_living_compact_desc: "The compact gives threatened and warned governments a shared table for patrols, border work, and wasteland entry."
death_join_living_compact_tt: "Joins the Living Compact and increases compact membership and cohesion."
death_join_compact_cost_text: "£pol_power §Y35§!"
death_join_compact_cost_text_blocked: "£pol_power §R35§!"
death_join_compact_cost_text_tooltip: "£pol_power §Y35§!"
death_compact_war_declaration: "Compact War Declaration"
death_compact_war_declaration_desc: "Compact members that are threatened or have confirmed the danger can enter the Death war together."
death_compact_war_declaration_tt: "Every eligible compact member that is not at war with Death enters the war. Members outside the danger area or without confirmed warning are skipped."
death_joint_coastal_patrol_plan: "Joint Coastal Patrol Plan"
death_joint_coastal_patrol_plan_desc: "Shared patrol routes let threatened coasts compare signals, fuel use, and missing ships before another shore goes silent."
death_joint_coastal_patrol_plan_tt: "Activates a temporary coastal patrol plan and raises the global watch network by §Y2§!, up to §Y[?global.death_watch_network_max_display|0]§!. Each network point raises Death's forced island and mainland jump costs by §Y[?global.death_watch_network_cost_step_percent_display|0]%§!. A strong network can delay one normal low-pressure coastal jump by spending §Y[?global.death_watch_network_intercept_spend_display|0]§! network strength. At maximum strength, sea jumps are blocked unless Death has §YNo Ferry Returns§! or world end has begun."
death_patrol_cost_text: "£command_power §Y20§!  £GFX_fuel_texticon §Y300§!  £convoy_texticon §Y10§!  £GFX_train_texticon §Y5§!  £support_equipment_text_icon §Y100§!"
death_patrol_cost_text_blocked: "£command_power §R20§!  £GFX_fuel_texticon §R300§!  £convoy_texticon §R10§!  £GFX_train_texticon §R5§!  £support_equipment_text_icon §R100§!"
death_patrol_cost_text_tooltip: "£command_power §Y20§!  £GFX_fuel_texticon §Y300§!  £convoy_texticon §Y10§!  £GFX_train_texticon §Y5§!  £support_equipment_text_icon §Y100§!"
death_authorize_wasteland_entry_gear: "Authorize Wasteland Entry Gear"
death_authorize_wasteland_entry_gear_desc: "Recaptured wasteland ruins engines, boots, filters, and nerves. Entry teams need gear made for roads with no working services."
death_authorize_wasteland_entry_gear_tt: "Activates temporary wasteland-entry gear for this country and raises global front readiness."
death_wasteland_gear_cost_text: "£army_experience §Y20§!  £GFX_fuel_texticon §Y250§!  £support_equipment_text_icon §Y200§!  £GFX_motorized_equipment_text_icon §Y75§!"
