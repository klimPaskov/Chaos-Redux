death_focus_tree: "Death"
death_consume_another_island: "Consume Another Island"
death_consume_another_island_desc: "Death spends stored soul power to consume an island. A stronger watch network makes each sea jump costlier, and every success raises the base cost."
death_consume_another_island_tt: "Spends §Y[?global.death_island_spread_soul_cost|2]§! soul power and consumes one valid island if a target remains. The island must have no stationed divisions. Each success raises the island base cost by §Y1§! soul power. A maximum watch network blocks this sea jump unless Death has §YNo Ferry Returns§! or Last Shores has begun."
