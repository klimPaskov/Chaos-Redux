death_send_survey_boat: "Send a Survey Boat"
death_send_survey_boat_desc: "A small naval survey can follow the missing route while the case is still confined to quiet ministry files."
death_send_survey_boat_tt: "[GetDeathSurveyBoatTooltip]"
death_send_survey_boat_unknown_tt: "Sends a survey boat beyond the last reliable harbor. The crew confirms the common cause behind the silence and slows its movement along the route, and the force behind it may declare war on this country."
death_send_survey_boat_confirmed_tt: "Sends a survey boat toward the confirmed Death route, lowers its spread pressure by §Y2§!, and lets Death declare war on this country if it can."
