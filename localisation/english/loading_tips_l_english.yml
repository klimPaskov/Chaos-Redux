l_english:
LOADING_TIP_0: "A ration ledger is only as honest as the officer who closes it."
LOADING_TIP_1: "The first warning from an isolated garrison is often the silence after its scheduled report."
LOADING_TIP_2: "All of our endings can be found in our beginnings. History repeats itself, and there is no escape."
LOADING_TIP_3: "A broken railway can defeat an army long before the enemy reaches its trenches."
LOADING_TIP_4: "Burial details guard the truth of a battle as carefully as sentries guard the line."
LOADING_TIP_5: "Every sealed archive creates a second front for the investigators who survive."
LOADING_TIP_6: "A convoy lost at sea can become a crisis months before its absence is admitted."
LOADING_TIP_7: "Command fails twice: first when the order is ignored, and again when the report is altered."
LOADING_TIP_8: "An occupied road belongs to whoever can keep food, fuel, and witnesses moving along it."
LOADING_TIP_9: "When a remote island stops asking for supplies, assume neither victory nor peace."
LOADING_TIP_10: "A frightened recruit can be recovered; an institution that rewards fear is harder to save."
LOADING_TIP_11: "Adaptation without discipline is merely another name for collapse."
LOADING_TIP_12: "He who sups with the devil needs a long spoon."
LOADING_TIP_13: "No emergency ration can replace the names erased from a muster roll."
LOADING_TIP_14: "Cruelty becomes policy one signature before it becomes routine."
LOADING_TIP_15: "The living return from a disaster slowly; the records must be ready to receive them."
LOADING_TIP_16: "Evil often presents itself as reasonable, necessary, and temporary."
LOADING_TIP_17: "Chaos was the law of nature; Order was the dream of man."
