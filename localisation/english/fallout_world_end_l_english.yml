l_english:
fallout_world_end_blackout_display: "[GetFalloutWorldEndBlackoutText]"
fallout_world_end_blackout_text_snapshot: "Across every frequency, the same dead carrier tone has replaced the morning bulletins."
fallout_world_end_blackout_text_state_grading: "Hospitals are counting the living by the heat left in sealed wards."
fallout_world_end_blackout_text_population_loss: "Roads end where fuel columns stopped beneath snow darkened by ash."
fallout_world_end_blackout_text_physical_collapse: "Orders still leave ministries, but whole provinces no longer answer."
fallout_world_end_blackout_text_government_sorting: "The sky has become the border that every patrol must obey."
fallout_world_end_blackout_text_survivor_allocation: "In mines, tunnels, ships, and mountain stores, locked doors are opening."
fallout_world_end_blackout_text_player_continuation: "Local councils are marking authority with fuel drums, radio towers, and guarded wells."
fallout_world_end_blackout_text_map_return: "Survey clerks have begun naming the places that can carry a government."
fallout_world_end_blackout_text_peace_conference: "Delegations remain sealed in distant rooms while armies outside their doors have lost every line of command."
fallout_world_end_blackout_text_diplomacy_hold: "Old orders still move through trade offices, intelligence posts, and foreign commands that no surviving cabinet can reliably close."
fallout_world_end_blackout_text_player_hold: "Several surviving administrations claim the same shelters, ports, and radio towers. None can yet carry uncontested authority."
fallout_world_end_blackout_text_error: "The survey net has stopped transmitting. No authority will reopen the map while capitals and garrisons disagree."

