fallout_grade_1_state: "Scarred Province"
fallout_grade_1_state_desc: "Ash enters machinery and storehouses while damaged roads slow repair crews and military columns."
fallout_grade_2_state: "Ash Zone"
fallout_grade_2_state_desc: "Dense deposits foul wells, choke engines, and force supply traffic onto a shrinking set of cleared routes."
fallout_grade_3_state: "Dead City"
fallout_grade_3_state_desc: "Municipal services have failed across abandoned districts where shelters, depots, and intact bridges decide who can remain."
fallout_grade_4_state: "Wasteland"
fallout_grade_4_state_desc: "Settlement survives only around guarded water, sealed stores, and routes that can still carry fuel."
fallout_grade_5_state: "Vitrified Zone"
fallout_grade_5_state_desc: "Heat and blast have erased the old transport web, leaving isolated worksites amid ruins that cannot support ordinary administration."
fallout_altered_biosphere_state: "Altered Biosphere"
fallout_altered_biosphere_state_desc: "Fictional high-chaos organisms and contaminated refuges have replaced ordinary settlement patterns across this state."

chaos_meter.deaths.cause.fallout_aftermath: "Fallout aftermath"

chaosx.fallout.100.t: "The Last Inventory"
chaosx.fallout.100.d: "The inventory clerks have counted the sealed grain, dried beans, and fuel for the pressure cookers. The figures do not cover a month. District delegates want a public ledger. Households with private cellars want silence. The guard commander has already marked three warehouses as disputed."
chaosx.fallout.100.a: "Publish strict rations"
chaosx.fallout.100.a.tt: "Publish the warehouse figures, issue measured rations, and accept the political cost of making every shortage visible."
chaosx.fallout.100.b: "Protect household caches"
chaosx.fallout.100.b.tt: "Keep the public ledger narrow and protect private stores, even if district officials begin to doubt the count."
chaosx.fallout.100.c: "Requisition private stores"
chaosx.fallout.100.c.tt: "Put the guard behind a single requisition order and take disputed stores before local councils move them."

chaosx.fallout.102.t: "The Ration Ledger"
chaosx.fallout.102.success.d: "The public ledger survives the first audit. Grain clerks in the rail district now issue the same measure, and the guard has stopped marking private cellars as enemy property. The ration law is severe, but people can plan around it."
chaosx.fallout.102.partial.d: "The ledger is posted, but two warehouse districts report missing sacks before the second count. The ration law is understood, although every late delivery is now treated as proof of a hidden reserve."
chaosx.fallout.102.failure.d: "The public figures reach the queue before the sacks do. Bakers in three districts close their doors, and the guard is forced to escort clerks through crowds that no longer believe the published count."
chaosx.fallout.102.a: "Open the first ration review"
chaosx.fallout.102.a.tt: "Record the public ration decision and schedule the first winter review."

chaosx.fallout.103.t: "Cellars Behind Closed Doors"
chaosx.fallout.103.success.d: "Household committees keep the private caches quiet long enough to make a second harvest plan. The central ledger is incomplete, but the neighborhoods that hold food now have a reason to keep their doors open to the ration teams."
chaosx.fallout.103.partial.d: "The hidden stores buy a few days. When the first cellar list leaks, district clerks demand their share and the households that carried the reserve begin to bargain as a separate power."
chaosx.fallout.103.failure.d: "The shortage remains hidden until the market stalls are empty. A cache opened on the wrong street becomes a public accusation, and every household with a locked door is treated as a hoarder."
chaosx.fallout.103.a: "Open the first ration review"
chaosx.fallout.103.a.tt: "Record the household cache decision and schedule the first winter review."

chaosx.fallout.104.t: "The Warehouse Line"
chaosx.fallout.104.success.d: "The requisition teams take the marked warehouses before the private guards can scatter the stock. The stores are enough to keep the field kitchens working, although the order has made every district council measure its distance from the government."
chaosx.fallout.104.partial.d: "The guard secures the largest depot, then loses the road to two smaller stores. Officials call the operation a success while local councils count the empty trucks and prepare their own claims."
chaosx.fallout.104.failure.d: "The requisition order arrives after the private stores have moved. A winter of short meals begins in the districts that trusted the convoy schedule, and the first deaths are recorded through the civil register rather than hidden in a warehouse report."
chaosx.fallout.104.a: "Open the first ration review"
chaosx.fallout.104.a.tt: "Record the requisition decision and schedule the first winter review."

chaosx.fallout.105.t: "First Winter Ration Review"
chaosx.fallout.105.public.d: "The first ration review compares the public ledger with the kitchens that actually served food. The measure is still harsh, but the districts know which office owns the missing sacks and which convoy is expected next."
chaosx.fallout.105.household.d: "The first ration review follows the household cache lists from cellar to street kitchen. Some families have kept their neighbors alive. Others have built a private authority that the ration office cannot ignore."
chaosx.fallout.105.requisition.d: "The first ration review counts the stores taken under guard and the roads that failed to carry them. Commanders want another requisition order. District councils want the authority to refuse it."
chaosx.fallout.105.a: "Close the inventory review"
chaosx.fallout.105.a.tt: "Commit the first winter memory and clear the Fallout delayed receipt."

chaosx.fallout.107.t: "River Intake at Dawn"
chaosx.fallout.107.d: "Ash has settled in the intake screens before the morning shift can clear them. The state water register still shows a guarded river, but the pumps upstream answer to a committee whose authority ends at the next bridge. We can close the gate, spend filters on a measured flow, take the pumps under guard, or let foreign technicians test the water while they write the first terms of a compact."
chaosx.fallout.107.a: "Close the intake"
chaosx.fallout.107.a.tt: "Seal the river gate, protect the settling tanks, and buy time for a cleaner source. This reduces immediate flow while the intake remains under inspection."
chaosx.fallout.107.b: "Ration filtered flow"
chaosx.fallout.107.b.tt: "Use filters and medicine to keep a controlled flow moving through clinics and kitchens. The state will spend stock to preserve the intake."
chaosx.fallout.107.c: "Seize upstream pumps"
chaosx.fallout.107.c.tt: "Send a guarded pump column over the bridge and place the upstream works under national authority. The order improves military readiness but turns local control into a dispute."
chaosx.fallout.107.d_option: "Accept foreign testing"
chaosx.fallout.107.d_option.tt: "Let foreign technicians inspect the intake, trade access for medicine, and record the first water compact in the diplomatic ledger."

chaosx.fallout.109.t: "The Gate Holds"
chaosx.fallout.109.success.d: "The intake gate closes before the ash reaches the settling tanks. A water board posts a measured reopening date, and the state keeps its last clean reserve under guard."
chaosx.fallout.109.partial.d: "The gate closes unevenly. One district draws from the settling tanks while another carries containers from a well that has not been tested. The closure buys time, but the water office inherits a new queue."
chaosx.fallout.109.failure.d: "The gate jams under the first pressure surge. Ash and river water enter the lower tanks together, and the clinic register records the first deaths from a source that was supposed to be sealed."
chaosx.fallout.109.a: "Open the next water review"
chaosx.fallout.109.a.tt: "Record the gate decision and wait for the water compact or epidemic review."

chaosx.fallout.110.t: "Measured Flow"
chaosx.fallout.110.success.d: "Filter teams keep the river moving through the clinic line and the kitchen cisterns. The stock ledger is thinner, but every district receives the same stamped measure."
chaosx.fallout.110.partial.d: "The filters catch the worst of the ash, then begin to clog. Clinics receive clean water first, while household queues learn that the measure changes with every replacement cartridge."
chaosx.fallout.110.failure.d: "The filter room runs out of usable cartridges before the night shift ends. The water office keeps its seals, but the first unfiltered barrels reach the shelter blocks."
chaosx.fallout.110.a: "Open the next water review"
chaosx.fallout.110.a.tt: "Record the filter ration and wait for the water compact or epidemic review."

chaosx.fallout.111.t: "The Pump Column"
chaosx.fallout.111.success.d: "The pump column reaches the upstream works before the local guards can drain the reserve. Engineers restart one intake under armed supervision, and the army receives a reliable route for its water columns."
chaosx.fallout.111.partial.d: "The pump column secures the main station but leaves two feeder works outside the order. Water begins to move again, although every convoy now travels with a written claim and an armed escort."
chaosx.fallout.111.failure.d: "The bridge checkpoint turns the pump column back. Upstream crews dismantle the intake controls, and the state has spent fuel and lives to inherit a river dispute instead of water."
chaosx.fallout.111.a: "Open the next water review"
chaosx.fallout.111.a.tt: "Record the pump seizure and wait for the water compact or epidemic review."

chaosx.fallout.121.t: "Foreign Water Test"
chaosx.fallout.121.success.d: "Foreign technicians sample the river beside the state chemists. Their report names the ash, the upstream leak, and the repairs that can be shared. Medicine arrives with the samples, and the first compact gives the country a reason to keep the border open."
chaosx.fallout.121.partial.d: "The foreign test produces a usable sample and a disputed report. Medicine reaches the clinics, but the visiting technicians leave with copies of the intake ledger and no agreement about who owns the next repair."
chaosx.fallout.121.failure.d: "The test boat never reaches the intake. A foreign report is issued from the far bank, while the state medicine stores run down and the river office is left to defend a result it cannot verify."
chaosx.fallout.121.a: "Open the next water review"
chaosx.fallout.121.a.tt: "Record the foreign test and wait for the water compact or epidemic review."

chaosx.fallout.112.t: "Water Compact or Epidemic"
chaosx.fallout.112.success.d: "The second review closes around a written water compact. The intake authority, clinic board, and upstream crews now share a repair calendar, and foreign observers have a reason to return without taking the ledger away."
chaosx.fallout.112.partial.d: "The water review closes with an unequal queue. The compact exists on paper, but districts that received less water are already naming the offices that will answer for the next illness."
chaosx.fallout.112.failure.d: "The clinic register becomes an epidemic ledger. The intake is still open, but medicine, water, and trust now move through separate queues, each guarded by a different authority."
chaosx.fallout.112.a: "Close the water file"
chaosx.fallout.112.a.tt: "Commit the intake memory and release the Fallout delayed receipt."

fallout_water_intake_closed: "Closed intake"
fallout_water_intake_closed_desc: "The river gate is sealed while settling tanks and alternate wells are inspected. Water moves more slowly, but the contaminated intake is not allowed to run unchecked."
fallout_water_filtered_flow: "Filtered river flow"
fallout_water_filtered_flow_desc: "Filters and clinic crews are keeping a measured river flow alive while ash clogs the ordinary intake."
fallout_water_pump_authority: "Upstream pump authority"
fallout_water_pump_authority_desc: "Guarded pump columns have turned an upstream water works into a military logistics route. The army can move more reliably, but neighboring authorities now measure every convoy."
fallout_water_foreign_testing: "Foreign water testing"
fallout_water_foreign_testing_desc: "Foreign technicians and domestic chemists share water samples, medicine stores, and the first terms of a river compact."
fallout_water_unequal_access: "Unequal water access"
fallout_water_unequal_access_desc: "The intake review left districts with different measures, and each queue now carries its own grievance into the next clinic report."
fallout_water_intake_contaminated: "Contaminated intake"
fallout_water_intake_contaminated_desc: "Ash and river water entered a live intake before the gate, filter room, or pump column could hold the line."
fallout_water_compact: "River water compact"
fallout_water_compact_desc: "A written repair calendar links the intake authority, clinic board, upstream works, and foreign observers."
fallout_water_epidemic_aftershock: "Water epidemic aftershock"
fallout_water_epidemic_aftershock_desc: "The water review failed to contain the intake, and clinics are carrying an epidemic ledger beside the ordinary ration book."

fallout.event_log.river_intake.name: "River Intake at Dawn"
fallout.event_log.river_intake.detail: "[GetFalloutEvent107EventLogDetail]"
fallout.event_log.river_intake.detail.close_success: "The gate held long enough to protect the settling tanks and preserve a guarded clean reserve."
fallout.event_log.river_intake.detail.close_partial: "The gate closed unevenly and bought time at the cost of an unequal water queue."
fallout.event_log.river_intake.detail.close_failure: "The gate failed under pressure, and the lower tanks received ash before the intake could be isolated."
fallout.event_log.river_intake.detail.ration_success: "Filter teams kept the river moving through clinics and kitchens with one stamped measure."
fallout.event_log.river_intake.detail.ration_partial: "Filters caught the worst ash, but the replacement ledger began to divide districts by access."
fallout.event_log.river_intake.detail.ration_failure: "The filter room ran dry before the night shift ended, and unfiltered barrels reached the shelters."
fallout.event_log.river_intake.detail.seizure_success: "A guarded pump column secured the upstream works and gave the army a reliable water route."
fallout.event_log.river_intake.detail.seizure_partial: "The main station was secured, but feeder works remained outside the order and convoys needed escorts."
fallout.event_log.river_intake.detail.seizure_failure: "The bridge checkpoint turned the pump column back, leaving fuel, deaths, and a river dispute."
fallout.event_log.river_intake.detail.foreign_success: "Foreign and domestic technicians produced a shared water report, medicine delivery, and the first compact."
fallout.event_log.river_intake.detail.foreign_partial: "The foreign test produced a disputed report and medicine, but no shared repair authority."
fallout.event_log.river_intake.detail.foreign_failure: "The test boat never reached the intake, and the state was left with a report it could not verify."
fallout.event_log.river_intake.detail.callback_success: "The follow-up review closed around a written water compact and a shared repair calendar."
fallout.event_log.river_intake.detail.callback_partial: "The follow-up review left an unequal queue and districts already naming the offices responsible."
fallout.event_log.river_intake.detail.callback_failure: "The follow-up review became an epidemic ledger beside the ordinary ration book."

chaosx.fallout.114.t: "Rail Crew Twenty-Seven"
chaosx.fallout.114.d: "The Ashline dispatch office has lost the eastern signal posts. Rail Crew Twenty-Seven is still under the viaduct with two repair trains, a fuel ledger, and enough sealed tools to restore one corridor. The line crosses a state where the winter register is already below its safe phase. We can send a protected crew, put labor battalions on the sleepers, abandon the line before the bridge gives way, or ask the neighboring authority to share access under a written dispatch rule."
chaosx.fallout.114.a: "Send protected crews"
chaosx.fallout.114.a.tt: "Spend fuel and scrap to give Rail Crew Twenty-Seven a guarded repair window. Success restores rail capacity and leaves the crew with a protected corridor mandate."
chaosx.fallout.114.b: "Use forced labor"
chaosx.fallout.114.b.tt: "Put the repair line under military labor orders. The trains move faster when the order holds, but the country records an atrocity memory if the crews return to tell the story."
chaosx.fallout.114.c: "Abandon the line"
chaosx.fallout.114.c.tt: "Withdraw the crews and preserve what fuel remains. A clean withdrawal may save stores, while a failed retreat damages the line and records deaths in the corridor state."
chaosx.fallout.114.d_option: "Request neighbor access"
chaosx.fallout.114.d_option.tt: "Ask the neighboring authority to open its dispatch room and share the line. The pilot records a state access agreement, not a full bilateral partnership."

chaosx.fallout.116.t: "The Protected Repair Window"
chaosx.fallout.116.success.d: "The guard cordon holds through three frozen shifts. Rail Crew Twenty-Seven replaces the signal relays, clears the viaduct, and sends two trains toward the ash depot before the next cold front closes the cut. The state now has a protected corridor and a repair calendar the quartermaster can read."
chaosx.fallout.116.partial.d: "The protected window lasts through one shift. The crew repairs the signal room and a short length of track, but fuel runs short before the viaduct can be reopened. Rail traffic returns in fragments, and the state marks the corridor for another guarded repair."
chaosx.fallout.116.failure.d: "The guard detail reaches the viaduct after the frozen ash has taken the access road. Rail Crew Twenty-Seven loses the repair window, and the failed attempt damages the remaining infrastructure while workers and sentries die in the cold."
chaosx.fallout.116.a: "Open the crew review"
chaosx.fallout.116.a.tt: "Record the protected repair result and wait seven days for the crew review."

chaosx.fallout.117.t: "Orders on the Sleepers"
chaosx.fallout.117.success.d: "The labor order reaches the line before the dispatch office closes. The crews move sleepers and rail through the night, restoring a usable corridor and sending three trains toward the fuel yards. The work is efficient, but every district clerk has copied the order into the government record."
chaosx.fallout.117.partial.d: "The labor battalions repair the signal room and the nearest bridge span, then lose the fuel convoy. A thin rail service returns, though the country has paid in cohesion and the corridor state reports deaths among the forced crews."
chaosx.fallout.117.failure.d: "The labor order breaks at the viaduct. Fuel, tools, and workers are lost in a repair attempt that never reaches the signal room. Rail Crew Twenty-Seven leaves a damaged line behind, and the country keeps the atrocity in its memory."
chaosx.fallout.117.a: "Open the labor review"
chaosx.fallout.117.a.tt: "Record the labor order and wait seven days for the crew review."

chaosx.fallout.118.t: "The Line Goes Quiet"
chaosx.fallout.118.success.d: "Rail Crew Twenty-Seven withdraws before the bridge freezes solid. The dispatch office saves enough tools and scrap to keep a smaller route open elsewhere, while the abandoned corridor is marked clearly for a later reclamation crew."
chaosx.fallout.118.partial.d: "The retreat clears the signal room but leaves the viaduct and its fuel siding behind. The line goes quiet without an immediate loss of life, yet the corridor state has no reliable route for the next convoy."
chaosx.fallout.118.failure.d: "The withdrawal order arrives after the ash has sealed the access road. The crew loses its stores at the bridge, and deaths in the corridor turn an abandoned line into a route that neighboring councils no longer trust."
chaosx.fallout.118.a: "Open the withdrawal review"
chaosx.fallout.118.a.tt: "Record the abandoned line and wait seven days for the crew review."

chaosx.fallout.122.t: "Shared Dispatch"
chaosx.fallout.122.success.d: "The neighboring authority opens its dispatch room and assigns a signal officer to the crossing. Rail Crew Twenty-Seven moves one train through the shared timetable, and the agreement puts a small repair reserve behind the line without surrendering the state government."
chaosx.fallout.122.partial.d: "A neighboring signal officer opens one crossing, but the dispatch rules stop at the first fuel siding. The corridor gains a narrow access window and a written grievance for the next convoy."
chaosx.fallout.122.failure.d: "The neighboring authority keeps the signal room closed while its own trains pass the crossing. The request spends fuel and recognition without opening the line, and deaths in the corridor leave the route fragmented."
chaosx.fallout.122.a: "Open the dispatch review"
chaosx.fallout.122.a.tt: "Record the shared access request and wait seven days for the crew review."

chaosx.fallout.119.t: "The Crew Returns"
chaosx.fallout.119.success.d: "The follow-up train reaches the Ashline depot with a signed crew roll and a usable repair calendar. Rail Crew Twenty-Seven has become a public institution rather than a dispatch rumor, and the government can name the corridor officers who kept the line open."
chaosx.fallout.119.partial.d: "The follow-up train returns with half the promised tools and a dispatch book marked by local exceptions. The corridor still functions, but each repair crew now carries a separate claim to the line."
chaosx.fallout.119.failure.d: "The follow-up train never reaches the depot. The corridor review closes with another fuel loss and a route fragmented between signal rooms, local guards, and a government that can no longer promise a single timetable."
chaosx.fallout.119.a: "Close the crew file"
chaosx.fallout.119.a.tt: "Commit the Rail Crew Twenty-Seven memory and release the Fallout delayed receipt."

fallout_rail_protected_corridor: "Protected rail corridor"
fallout_rail_protected_corridor_desc: "A guarded repair timetable keeps a frozen rail corridor open for fuel, food, and military traffic."
fallout_rail_forced_labor_corridor: "Forced labor rail corridor"
fallout_rail_forced_labor_corridor_desc: "Military labor orders have restored a rail line while damaging cohesion and leaving a contested record of the work."
fallout_rail_abandoned_corridor: "Abandoned rail corridor"
fallout_rail_abandoned_corridor_desc: "The rail line has been withdrawn from ordinary service while tools and scrap are redirected to a route that can still be guarded."
fallout_rail_neighbor_access: "Neighbor dispatch access"
fallout_rail_neighbor_access_desc: "A neighboring signal room shares a narrow timetable with the state rail office. The arrangement remains local and conditional."
fallout_rail_route_fragmented: "Fragmented rail route"
fallout_rail_route_fragmented_desc: "Signal rooms, guards, and repair crews no longer share one timetable, so supplies and military traffic move with added losses."
fallout_rail_heroic_crew: "Rail crew tradition"
fallout_rail_heroic_crew_desc: "Rail Crew Twenty-Seven has become a public tradition that gives repair orders and convoy crews a name people recognize."
fallout_rail_atrocity_memory: "Rail labor atrocity memory"
fallout_rail_atrocity_memory_desc: "The labor order remains in the government record, and every later rail requisition is judged against the crews who were forced to work it."

fallout.event_log.rail_crew.name: "Rail Crew Twenty-Seven"
fallout.event_log.rail_crew.detail: "[GetFalloutEvent114EventLogDetail]"
fallout.event_log.rail_crew.detail.protected_success: "Protected crews restored the Ashline signal room, cleared the viaduct, and returned a guarded rail corridor to service."
fallout.event_log.rail_crew.detail.protected_partial: "The protected repair window restored signals and part of the line, but fuel ended before the viaduct could fully reopen."
fallout.event_log.rail_crew.detail.protected_failure: "The protected crew missed the repair window, and deaths at the frozen viaduct left the remaining infrastructure damaged."
fallout.event_log.rail_crew.detail.forced_success: "A forced labor order restored a usable corridor and moved trains toward the fuel yards, leaving a permanent government record."
fallout.event_log.rail_crew.detail.forced_partial: "Forced crews repaired the signal room and one bridge span before the fuel convoy failed, with deaths recorded in the corridor state."
fallout.event_log.rail_crew.detail.forced_failure: "The labor order failed at the viaduct, costing fuel, tools, and workers while preserving the atrocity in government memory."
fallout.event_log.rail_crew.detail.abandon_success: "The crew withdrew before the bridge froze solid and redirected tools and scrap to a route that could still be guarded."
fallout.event_log.rail_crew.detail.abandon_partial: "The retreat cleared the signal room but left the viaduct and fuel siding outside reliable convoy service."
fallout.event_log.rail_crew.detail.abandon_failure: "The withdrawal failed at the ash-sealed bridge, and deaths turned the abandoned line into a route that councils no longer trusted."
fallout.event_log.rail_crew.detail.neighbor_success: "A neighboring signal room shared a timetable, one train crossed the line, and a repair reserve entered the corridor agreement."
fallout.event_log.rail_crew.detail.neighbor_partial: "The neighbor opened one crossing but stopped at the fuel siding, leaving a narrow access window and a written grievance."
fallout.event_log.rail_crew.detail.neighbor_failure: "The neighbor kept the signal room closed, and the request spent fuel and recognition while the corridor became fragmented."
fallout.event_log.rail_crew.detail.callback_success: "The follow-up train returned with a signed crew roll and a repair calendar that made the corridor a public institution."
fallout.event_log.rail_crew.detail.callback_partial: "The follow-up train returned with missing tools and local exceptions in the dispatch book, leaving several claims to the line."
fallout.event_log.rail_crew.detail.callback_failure: "The follow-up train never reached the depot, and the corridor review closed with another fuel loss and a fragmented timetable."

fallout_food_public_ration_law: "Public ration law"
fallout_food_public_ration_law_desc: "A visible ledger and measured ration law keep the kitchens aligned, but every short delivery damages trust."
fallout_food_household_cache_network: "Household cache network"
fallout_food_household_cache_network_desc: "Private cellars and neighborhood committees keep food moving outside the central ledger."
fallout_food_requisition_authority: "Requisition authority"
fallout_food_requisition_authority_desc: "Guarded stores improve the official supply line while councils question who may seize food."
fallout_food_grievance_aftershock: "Food grievance aftershock"
fallout_food_grievance_aftershock_desc: "A failed inventory decision has turned every locked storehouse into a test of government legitimacy."

fallout.event_log.last_inventory.name: "The Last Inventory"
fallout.event_log.last_inventory.detail: "[GetFalloutEvent100EventLogDetail]"
fallout.event_log.last_inventory.detail.public_success: "The public ration ledger held through the first review. The country published strict measures and kept the warehouse count legible."
fallout.event_log.last_inventory.detail.public_partial: "The public ration ledger opened the stores to inspection, but late deliveries and missing sacks weakened the promise."
fallout.event_log.last_inventory.detail.public_failure: "The public ration ledger failed to reach the kitchens before the shortage did. The decision left a lasting grievance."
fallout.event_log.last_inventory.detail.household_success: "Household caches carried the first review. Neighborhood committees kept enough food moving to preserve a second harvest plan."
fallout.event_log.last_inventory.detail.household_partial: "Household caches bought a few days, then leaked into a new bargaining power between families and ration clerks."
fallout.event_log.last_inventory.detail.household_failure: "Hidden stores became an accusation when the market stalls emptied. Private caches no longer looked like a shared reserve."
fallout.event_log.last_inventory.detail.requisition_success: "Guarded requisition secured the marked warehouses and kept field kitchens supplied, at the cost of council authority."
fallout.event_log.last_inventory.detail.requisition_partial: "The guard secured one depot while smaller stores escaped. Officials kept the order, but districts began preparing their own claims."
fallout.event_log.last_inventory.detail.requisition_failure: "The requisition order arrived after the stores moved. The failed operation left a documented winter loss and a government grievance."
fallout.event_log.last_inventory.detail.callback_success: "The first winter review closed with enough food and recognition to keep the ration chain open."
fallout.event_log.last_inventory.detail.callback_partial: "The first winter review closed with a narrow reserve and a visible cost to cooperation."
fallout.event_log.last_inventory.detail.callback_failure: "The first winter review closed with another food loss and a government that could no longer make every district wait quietly."

fallout_event_100_ration_law: "Enforce the ration law"
fallout_event_100_ration_law_desc: "Clerks and kitchen captains will compare the public ledger, filter stock, and the food actually served. The review takes three weeks and consumes part of the reserve before it can restore order."
fallout_food_security_category: "Food Security"
fallout_food_security_category_desc: "The first inventory review has opened a ration office and a hunger mission. Both spend scarce stores to make the winter ledger answer to kitchens, clinics, and district councils."
fallout.event_log.last_inventory.ration_law_cost: "Commits food and filter stock until the ration review closes"
fallout_event_100_first_hunger_mission: "Run the first hunger mission"
fallout_event_100_first_hunger_mission_desc: "Medicine teams will trace the first hunger cases through kitchens and shelter blocks. The mission takes two weeks and spends food and medicine to keep the register honest."
fallout.event_log.last_inventory.hunger_mission_cost: "Commits food and medicine until the hunger mission closes"
