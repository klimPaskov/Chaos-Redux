fallout.event_log.canal_schedule.name: "The Canal Schedule"
fallout.event_log.canal_schedule.detail: "A South Asian agricultural state has recorded a water release policy, its first season, and the review that followed."
fallout.event_log.canal_schedule.choice_joint: "The country signed a joint schedule for the South Asian water release."
fallout.event_log.canal_schedule.choice_upstream: "The country prioritized the upper works and their immediate field delivery."
fallout.event_log.canal_schedule.choice_guard: "The country placed the gates under guard with civilian inspection rights."
fallout.event_log.canal_schedule.choice_council: "The country let local water councils write the release schedule."
fallout.event_log.canal_schedule.joint_success: "The joint schedule opened measured gates and recorded water as a public duty."
fallout.event_log.canal_schedule.joint_partial: "The joint schedule reached some fields while upstream crews kept private counts."
fallout.event_log.canal_schedule.joint_failure: "The joint schedule broke over field lists and gate records."
fallout.event_log.canal_schedule.upstream_success: "The upper works delivered a clean release before the ash settled again."
fallout.event_log.canal_schedule.upstream_partial: "The upper works moved water late while downstream grievance grew."
fallout.event_log.canal_schedule.upstream_failure: "The upper works consumed fuel without producing a reliable release."
fallout.event_log.canal_schedule.guard_success: "The gate guards protected the release point without replacing the village ledgers."
fallout.event_log.canal_schedule.guard_partial: "The guards opened one controlled release while the command post gained authority."
fallout.event_log.canal_schedule.guard_failure: "The guard command seized the control point and damaged the gate works."
fallout.event_log.canal_schedule.council_success: "The water councils reconciled village lists and opened the gates by agreement."
fallout.event_log.canal_schedule.council_partial: "The councils kept water moving while the central register lagged behind."
fallout.event_log.canal_schedule.council_failure: "The councils failed to agree which fields were still occupied."
fallout.event_log.canal_schedule.callback_success: "The seasonal review found a water arrangement that could answer new claims."
fallout.event_log.canal_schedule.callback_partial: "The seasonal review preserved some releases while leaving the arrangement contested."
fallout.event_log.canal_schedule.callback_failure: "The seasonal review found broken records, damaged works, and no promise for the next release."
fallout.event_log.canal_schedule.cancelled: "The Canal Schedule transaction was cancelled after its host, owner, target, or generation changed."
