chaosx.fallout.628.t: "The Canal Schedule"
chaosx.fallout.628.d: "In the South Asian plain, the first thaw has filled the old irrigation cuts with gray meltwater and ash. The field councils have enough clean water for one release pattern, but not enough to promise every district a full season. Upstream keepers, gate guards, and village delegates have brought separate lists of fields and households to the same embankment. The next opening will decide who receives the water and who is asked to wait."
chaosx.fallout.628.a: "Sign a joint schedule"
chaosx.fallout.628.a.tt: "Spend Clean Water 3, Food 4, and Recognition 2. After 42 days, allocation trust, water reserves, and the target state's winter ledgers will decide whether a shared release begins."
chaosx.fallout.628.b: "Prioritize the upper works"
chaosx.fallout.628.b.tt: "Spend Power 3, Fuel 3, and Recognition 2. After 42 days, field delivery and gate maintenance will be weighed against downstream grievance."
chaosx.fallout.628.c: "Put the gates under guard"
chaosx.fallout.628.c.tt: "Spend Fuel 3, Support Equipment 2, and Command Power 10. After 42 days, war conditions, military control, and public trust will decide whether the release stays open."
chaosx.fallout.628.e: "Let the water councils decide"
chaosx.fallout.628.d.tt: "Spend Food 3, Medicine 2, and Recognition 2. After 42 days, local authority, disease pressure, and the target state's food reserve will decide whether the villages can keep the schedule."
chaosx.fallout.630.t: "The First Release"
chaosx.fallout.630.joint.success.d: "The joint schedule has survived the first arguments on the embankment. Upstream keepers have opened measured gates, village crews have marked the downstream fields, and the shared register now records water as a public duty rather than a private claim."
chaosx.fallout.630.joint.partial.d: "The joint schedule exists on paper and water has reached some downstream fields. Two upstream crews still keep their own counts, so the next release will depend on whether the public register can outlast the first shortage."
chaosx.fallout.630.joint.failure.d: "The joint schedule broke when the field lists did not match the gate records. Water remains trapped behind a damaged control point, the downstream villages have begun rationing, and the first losses are recorded through the winter death ledger."
chaosx.fallout.630.upstream.success.d: "The upper works have delivered a clean first release. Power crews kept the pumps steady and the main channels reached the fields before the ash settled again, although downstream delegates have demanded a place in the next count."
chaosx.fallout.630.upstream.partial.d: "The upper works sent water through the main channel, but the release arrived late in the lower fields. The upstream priority has kept the pumps alive while downstream grievance grows around each closed gate."
chaosx.fallout.630.upstream.failure.d: "The upper works consumed power and fuel without producing a reliable release. The gates remain contested, downstream crews are taking water at night, and a damaged infrastructure level has made the next repair harder."
chaosx.fallout.630.guard.success.d: "The gate guards held the release point without closing the village ledgers. Escorts kept the pumps and stores intact, and the water moved under inspection while the embankment remained a military position with a civilian schedule."
chaosx.fallout.630.guard.partial.d: "The guards opened one controlled release and stopped the first seizure attempt. The lower fields received water, but the command post now speaks louder than the councils and every further gate will need another escort."
chaosx.fallout.630.guard.failure.d: "The guard command seized the control point before the release register was signed. Fuel and stores vanished into separate depots, the gate works were damaged, and the lower fields have begun to count their dead before the next thaw."
chaosx.fallout.630.council.success.d: "The water councils reconciled the village lists and opened the gates by local agreement. Medicine crews treated the first contamination cases, field hands shared the clean reserve, and the South Asian plain has a schedule that can be read without a uniform."
chaosx.fallout.630.council.partial.d: "The councils kept water moving through several villages, but the central register still lags behind the field marks. Disease pressure has eased in the best-served hamlets while the remaining districts ask why their turn has not arrived."
chaosx.fallout.630.council.failure.d: "The councils could not agree which fields were still occupied. Medicine stores ran low, night diversions opened along the embankment, and the failed schedule has left both water and trust below the level needed for the next season."
chaosx.fallout.630.a: "Record the first release"
chaosx.fallout.630.a.tt: "Apply the authenticated 42-day Canal Schedule result and continue to the delayed seasonal review."
chaosx.fallout.632.t: "The Seasonal Water Review"
chaosx.fallout.632.success.d: "Two hundred and forty days later, the target state still knows which gate serves which field. The first release has become a habit of measured work, and the councils, keepers, or guards can answer a water claim without reopening the whole dispute."
chaosx.fallout.632.partial.d: "The seasonal review finds water moving through a contested arrangement. Some field marks survived the winter, but the next dry month will expose every missing count and every household left outside the schedule."
chaosx.fallout.632.failure.d: "The seasonal review finds broken gate records and a state that cannot promise the next release. Disease, damaged works, and private diversions have turned the first schedule into a warning carried from one dry field to another."
chaosx.fallout.632.a: "Close the seasonal review"
chaosx.fallout.632.a.tt: "Apply the authenticated callback outcome, record the target state's Canal Schedule memory, and close the delayed transaction without creating a new country."
