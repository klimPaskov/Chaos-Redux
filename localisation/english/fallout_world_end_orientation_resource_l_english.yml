l_english:
chaosx.fallout.70.t: "The Four-Day Survival Order"
chaosx.fallout.70.d: "[This.GetFalloutOrientationImmediateResourceCountryText]\n\nThe current register identifies [This.GetFalloutOrientationCrisisResourceName] as the immediate crisis at [?fallout_orientation_frozen_crisis_value|0]. The [This.GetFalloutOrientationArchetypeName] must issue an order that district counters, protected stores, route crews, and the assigned capital can carry for four days."
chaosx.fallout.70.a: "Publish a strict public ration ledger."
chaosx.fallout.70.a.tt: "Commit §Y[?constant:fallout_orientation_cost.resource_ration_cohesion|0] Cohesion§!. A strong result raises [This.GetFalloutOrientationCrisisResourceName] by §Y[?constant:fallout_orientation_result.resource_ration_success_crisis|0]§! and Recognition by §Y[?constant:fallout_orientation_result.resource_ration_success_recognition|0]§!. A contested result raises [This.GetFalloutOrientationCrisisResourceName] by §Y[?constant:fallout_orientation_result.resource_ration_partial_crisis|0]§! and Recognition by §Y[?constant:fallout_orientation_result.resource_ration_partial_recognition|0]§!, then lowers Cohesion by another §R[?constant:fallout_orientation_result.resource_ration_partial_cohesion|0]§!. Failure lowers Recognition by §R[?constant:fallout_orientation_result.resource_ration_failure_recognition|0]§! and creates ration queue unrest for §R[?constant:fallout_orientation_duration.ration_unrest_days|0] days§!."
chaosx.fallout.70.b: "Open the protected stores by emergency warrant."
chaosx.fallout.70.b.tt: "Commit §Y[?constant:fallout_orientation_cost.resource_requisition_recognition|0] Recognition§! and §Y[?constant:fallout_orientation_cost.resource_requisition_cohesion|0] Cohesion§!. A strong result raises [This.GetFalloutOrientationCrisisResourceName] by §Y[?constant:fallout_orientation_result.resource_requisition_success_crisis|0]§!. A contested result raises it by §Y[?constant:fallout_orientation_result.resource_requisition_partial_crisis|0]§! and lowers Recognition by another §R[?constant:fallout_orientation_result.resource_requisition_partial_recognition|0]§!. Failure lowers Recognition by another §R[?constant:fallout_orientation_result.resource_requisition_failure_recognition|0]§! and records civilian Deaths equal to fifteen people per ten thousand from the surviving population counted when the order opened."
chaosx.fallout.70.c: "[This.GetFalloutOrientationTailoredResourceResponse]."
chaosx.fallout.70.c.tt: "Commit §Y[?constant:fallout_orientation_cost.resource_tailored_scrap|0] Scrap§! and §Y[?constant:fallout_orientation_cost.resource_tailored_support|0] [This.GetFalloutOrientationTailoredSupportResourceName]§!. A strong result raises [This.GetFalloutOrientationCrisisResourceName] by §Y[?constant:fallout_orientation_result.resource_tailored_success_crisis|0]§! and Reclamation in the assigned capital by §Y[?constant:fallout_orientation_result.resource_tailored_success_reclamation|0]§!. A contested result raises [This.GetFalloutOrientationCrisisResourceName] by §Y[?constant:fallout_orientation_result.resource_tailored_partial_crisis|0]§! and Reclamation by §Y[?constant:fallout_orientation_result.resource_tailored_partial_reclamation|0]§!. Failure grants no crisis resource, consumes another §R[?constant:fallout_orientation_result.resource_tailored_failure_scrap|0] Scrap§!, and damages one surviving infrastructure level in the assigned capital when available."

chaosx.fallout.72.t: "The Four-Day Return"
chaosx.fallout.72.ration.success.d: "[This.GetFalloutOrientationResourceCountryResultText] The published ration list reached district counters with the promised loads. Families could see the same [This.GetFalloutOrientationLastCrisisResourceName] allotment as guards and work crews, and the government gained authority by keeping the queue legible."
chaosx.fallout.72.ration.partial.d: "[This.GetFalloutOrientationResourceCountryResultText] The ration counters opened, but several districts corrected the public list after the loads had already moved. More [This.GetFalloutOrientationLastCrisisResourceName] reached the shelters, while the disputed changes weakened the compact that carried the order."
chaosx.fallout.72.ration.failure.d: "[This.GetFalloutOrientationResourceCountryResultText] The published list promised [This.GetFalloutOrientationLastCrisisResourceName] that the counters could not deliver. Families remained in line after dark as guards and clerks accused one another of diverting the missing allotments."
chaosx.fallout.72.requisition.success.d: "[This.GetFalloutOrientationResourceCountryResultText] Protected doors opened under named warrants, and every removed load received a destination and custodian. The concentrated release moved [This.GetFalloutOrientationLastCrisisResourceName] into the shelters before private guards could close the stores again."
chaosx.fallout.72.requisition.partial.d: "[This.GetFalloutOrientationResourceCountryResultText] The emergency warrants opened part of the protected reserve, but several custodians concealed keys or disputed the quantities on record. [This.GetFalloutOrientationLastCrisisResourceName] reached the public counters at the cost of another visible breach in authority."
chaosx.fallout.72.requisition.failure.d: "[This.GetFalloutOrientationResourceCountryResultText] Store guards resisted the warrants and the collection teams forced entry without securing the loads. [This.GetFalloutOrientationLastCrisisResourceName] did not increase, Recognition fell, and the Deaths ledger recorded [?fallout_orientation_last_deaths_applied|0] civilians killed during the failed seizures."
chaosx.fallout.72.tailored.success.d: "[This.GetFalloutOrientationResourceCountryResultText] The named crews kept their assigned route and equipment working for all four days. [This.GetFalloutOrientationLastCrisisResourceName] reached the receiving counters, and the assigned capital recovered usable ground around the route."
chaosx.fallout.72.tailored.partial.d: "[This.GetFalloutOrientationResourceCountryResultText] The local measure held on its main route, but equipment shortages and disputed custody excluded several outer wards. [This.GetFalloutOrientationLastCrisisResourceName] improved, and the assigned capital retained a smaller reclamation gain."
chaosx.fallout.72.tailored.failure.d: "[This.GetFalloutOrientationResourceCountryResultText] The ordered route failed after crews lost access, equipment, or the supporting supply. No additional [This.GetFalloutOrientationLastCrisisResourceName] reached the public counters, and more Scrap disappeared into the abandoned work.[This.GetFalloutOrientationTailoredDamageClause]"
chaosx.fallout.72.a: "File the four-day return."
chaosx.fallout.72.a.tt: "The four-day return enters the public record with the chosen authority, civilian losses, and the condition of the assigned capital."
