chaosx.nr50.1.t: "The Great Embargo"

chaosx.nr50.2.t: "The Great Embargo"
chaosx.nr50.2.d: "Every country has imposed an embargo on us, cutting trade and diplomatic ties. Factories are losing supplies, prices are rising, and the government must find new routes for food and fuel."
chaosx.nr50.2.a: "They are hurting only themselves."

chaosx.news.52.t: "The Great Embargo"
chaosx.news.52.d: "Every nation has joined the embargo against [From.GetName]. Trade is halted, diplomatic channels are closed, and essential resources are no longer reaching its ports."
chaosx.news.52.a: "Interesting development"
