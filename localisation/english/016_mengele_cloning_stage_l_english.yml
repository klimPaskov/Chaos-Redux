mengele_event016_cloning_theory_requirements_tt: "The Directorate's research program is active and Cloning Theory remains unfinished."
mengele_event016_cloning_prototype_requirements_tt: "Cloning Theory is complete. The Directorate can fund a first living clone."
mengele_event016_cloning_deployment_requirements_tt: "The Clone Prototype has been recorded under Mengele's program."
mengele_event016_cloning_weaponization_requirements_tt: "Clone cohorts have been deployed under Mengele's program."
mengele_event016_cloning_theory_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStageCloningTheoryCivilianFactories]§! until the stage ends. Political Power and Support Equipment are paid when the stage begins."
mengele_event016_cloning_prototype_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueFallbackCloningCivilianFactories]§! until the stage ends. Political Power, Support Equipment, and Fuel are paid when the stage begins."
mengele_event016_cloning_deployment_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStageCloningDeploymentCivilianFactories]§! until the stage ends. Political Power, Support Equipment, and Fuel are paid when the stage begins."
mengele_event016_cloning_weaponization_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStageCloningWeaponizationCivilianFactories]§! until the stage ends. Political Power, Support Equipment, and Fuel are paid when the stage begins."

mengele_event016_cloning_stage_started_tt: "The listed stores are spent. The civilian factories stay assigned until the work ends."
mengele_event016_cloning_stage_cancel_trigger_tt: "Mengele's program can no longer carry out this work."
mengele_event016_cloning_stage_cancelled_tt: "The work is cancelled. Recorded payments are returned and the civilian factories are released."
mengele_event016_cloning_theory_effect_tt: "Cloning Theory is established."
mengele_event016_cloning_prototype_effect_tt: "A viable clone prototype is complete. Clone equipment production and formations are available. An active German program may provoke a laboratory revolt."
mengele_event016_cloning_deployment_effect_tt: "Clone cohorts are ready for sustained operations. Each biological warfare facility in a state you own and control supplies §G[This.GetMengeleCloningDeploymentWeeklyBonus]§! additional §Y$clone_equipment$§! each week while Mengele's cloning program operates."
mengele_event016_cloning_weaponization_effect_tt: "Clone formations and equipment are ready for battlefield service."

