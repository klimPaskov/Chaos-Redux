l_english:
mengele_event016_cloning_theory: "Establish Cloning Theory"
mengele_event016_cloning_theory_desc: "Study viable cell lines, gestation, and identity stability before raising clone cohorts."
mengele_event016_cloning_prototype: "Raise a Clone Prototype"
mengele_event016_cloning_prototype_desc: "Produce a viable clone and test its health, memory, and stability under laboratory care."
mengele_event016_cloning_deployment: "Deploy Clone Cohorts"
mengele_event016_cloning_deployment_desc: "Organize growth facilities, training, equipment, and care for sustained clone operations."
mengele_event016_cloning_weaponization: "Arm the Clone Cohorts"
mengele_event016_cloning_weaponization_desc: "Prepare clone formations and their equipment for coordinated battlefield service."

mengele_event016_cloning_theory_cost: "£pol_power §Y[This.GetMengeleStageValueStageCloningTheoryPoliticalPower]§!  £support_equipment_text_icon §Y[This.GetMengeleStageValueStageCloningTheorySupportEquipment]§!"
mengele_event016_cloning_prototype_cost: "£pol_power §Y[This.GetMengeleStageValueFallbackCloningPoliticalPower]§!  £support_equipment_text_icon §Y[This.GetMengeleStageValueFallbackCloningSupportEquipment]§!  £GFX_fuel_texticon §Y[This.GetMengeleStageValueFallbackCloningFuel]§!"
mengele_event016_cloning_deployment_cost: "£pol_power §Y[This.GetMengeleStageValueStageCloningDeploymentPoliticalPower]§!  £support_equipment_text_icon §Y[This.GetMengeleStageValueStageCloningDeploymentSupportEquipment]§!  £GFX_fuel_texticon §Y[This.GetMengeleStageValueStageCloningDeploymentFuel]§!"
mengele_event016_cloning_weaponization_cost: "£pol_power §Y[This.GetMengeleStageValueStageCloningWeaponizationPoliticalPower]§!  £support_equipment_text_icon §Y[This.GetMengeleStageValueStageCloningWeaponizationSupportEquipment]§!  £GFX_fuel_texticon §Y[This.GetMengeleStageValueStageCloningWeaponizationFuel]§!"

mengele_event016_cloning_theory_requirements_tt: "The Directorate's research programme is active and Cloning Theory remains unfinished."
mengele_event016_cloning_prototype_requirements_tt: "Cloning Theory is complete. The Directorate can support a living prototype."
mengele_event016_cloning_deployment_requirements_tt: "The Clone Prototype has been recorded under Mengele's programme."
mengele_event016_cloning_weaponization_requirements_tt: "Clone cohorts have been deployed under Mengele's programme."
mengele_event016_cloning_theory_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStageCloningTheoryCivilianFactories]§! until the stage ends. Political Power and Support Equipment are paid when the stage begins."
mengele_event016_cloning_prototype_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueFallbackCloningCivilianFactories]§! until the stage ends. Political Power, Support Equipment, and Fuel are paid when the stage begins."
mengele_event016_cloning_deployment_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStageCloningDeploymentCivilianFactories]§! until the stage ends. Political Power, Support Equipment, and Fuel are paid when the stage begins."
mengele_event016_cloning_weaponization_costs_tt: "Assign £civ_factory §Y[This.GetMengeleStageValueStageCloningWeaponizationCivilianFactories]§! until the stage ends. Political Power, Support Equipment, and Fuel are paid when the stage begins."

mengele_event016_cloning_stage_started_tt: "The listed stores are committed. Civilian factories remain assigned until this work ends."
mengele_event016_cloning_stage_cancel_trigger_tt: "The programme has lost authority over this work."
mengele_event016_cloning_stage_cancelled_tt: "The work is cancelled. Committed stores return and civilian factories are released."
mengele_event016_cloning_theory_effect_tt: "Cloning Theory is established."
mengele_event016_cloning_prototype_effect_tt: "A viable clone prototype is complete. Clone equipment production and formations are available; an active German programme may provoke a laboratory revolt."
mengele_event016_cloning_deployment_effect_tt: "Clone cohorts are ready for sustained operations."
mengele_event016_cloning_weaponization_effect_tt: "Clone formations and equipment are ready for battlefield service."

