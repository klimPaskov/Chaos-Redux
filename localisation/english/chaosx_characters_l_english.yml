# Scientists
JAP_shiro_ishii: "Shiro Ishii"
JAP_shiro_ishii_desc: "Japanese Army physician who commanded Unit 731 and directed biological-warfare experiments on prisoners."

JAP_masaji_kitano: "Masaji Kitano"
JAP_masaji_kitano_desc: "Japanese Army physician who succeeded Ishii in directing Unit 731's biological-warfare program."

JAP_chikahiko_koizumi: "Chikahiko Koizumi"
JAP_chikahiko_koizumi_desc: "Japanese Army physician and medical administrator who backed Ishii and helped establish Japan's biological-warfare program."

GER_gerhard_schrader: "Gerhard Schrader"
GER_gerhard_schrader_desc: "German industrial chemist whose insecticide research led to the discovery of tabun and sarin."

GER_kurt_blome: "Kurt Blome"
GER_kurt_blome_desc: "German physician who directed wartime biological-warfare research while publicly framing the program as defensive."

GER_walter_schreiber: "Walter Schreiber"
GER_walter_schreiber_desc: "German Army physician who planned epidemic defence and later testified about German biological-warfare deliberations."

GER_erich_traub: "Erich Traub"
GER_erich_traub_desc: "German veterinarian and virologist whose animal-virus and vaccine research had dual-use relevance to biological warfare."

GER_kurt_gutzeit: "Kurt Gutzeit"
GER_kurt_gutzeit_desc: "German physician who organized coercive hepatitis research involving prisoners and occupied medical networks."

GER_sigmund_rascher: "Sigmund Rascher"
GER_sigmund_rascher_desc: "German SS physician who conducted lethal altitude and hypothermia experiments on prisoners."

GER_josef_mengele: "Josef Mengele"
GER_josef_mengele_desc: "German SS physician at Auschwitz who conducted racist selections and lethal experiments on prisoners."

ENG_paul_fildes: "Paul Fildes"
ENG_paul_fildes_desc: "British bacteriologist who directed Porton Down biological-warfare research, including anthrax and botulinum studies."

ENG_alexander_fleming: "Alexander Fleming"
ENG_alexander_fleming_desc: "Scottish bacteriologist whose penicillin discovery helped establish modern antibacterial treatment."

ENG_ernst_chain: "Ernst Chain"
ENG_ernst_chain_desc: "German-born British biochemist who worked with Florey and Fleming to develop penicillin for clinical production."

AST_howard_florey: "Howard Walter Florey"
AST_howard_florey_desc: "Australian pathologist who helped turn penicillin research into a clinically usable treatment and organized its wartime production."

USA_frank_olson: "Frank Olson"
USA_frank_olson_desc: "American microbiologist and aerobiology specialist who worked at Camp Detrick's Special Operations Division."

USA_ira_baldwin: "Ira Baldwin"
USA_ira_baldwin_desc: "American microbiologist who directed the Camp Detrick biological-warfare laboratories."

USA_murray_sanders: "Murray Sanders"
USA_murray_sanders_desc: "American bacteriologist who led Camp Detrick projects and later investigated Japan's biological-warfare records."

POL_franciszek_witaszek: "Franciszek Witaszek"
POL_franciszek_witaszek_desc: "Polish physician and microbiologist who organized resistance chemical and biological sabotage under German occupation."

SOV_lavrentiy_pavlovich_beria: "Lavrentiy Pavlovich Beria"
SOV_lavrentiy_pavlovich_beria_desc: "Soviet political and secret-police chief who exercised administrative authority over secret state weapons programs."

SOV_grigory_mairanovsky: "Grigory Mairanovsky"
SOV_grigory_mairanovsky_desc: "Soviet biochemist who directed secret-police poison testing and conducted lethal human experiments."

SOV_ivan_mikhailovich_velikanov: "Ivan Mikhailovich Velikanov"
SOV_ivan_mikhailovich_velikanov_desc: "Soviet microbiologist and Red Army general who led the early offensive biological-warfare program."

AST_charles_kellaway: "Charles Kellaway"
AST_charles_kellaway_desc: "Australian pharmacologist who chaired the Chemical Defence Board and studied the medical effects of chemical agents."

AST_frank_macfarlane_burnet: "Frank Macfarlane Burnet"
AST_frank_macfarlane_burnet_desc: "Australian virologist whose influenza research and later infectious-disease work informed wartime biological medicine."

CAN_otto_maass: "Otto Maass"
CAN_otto_maass_desc: "Canadian chemist who administered chemical-defence research and advised on wartime protective measures."

CAN_frederick_banting: "Frederick Banting"
CAN_frederick_banting_desc: "Canadian physician who researched mustard-gas injuries and led wartime aviation-medicine studies."

CAN_claude_e_dolman: "Claude E. Dolman"
CAN_claude_e_dolman_desc: "English-born Canadian microbiologist who researched botulism, cholera vaccines, and other infectious diseases."

ENG_charles_lovatt_evans: "Charles Lovatt Evans"
ENG_charles_lovatt_evans_desc: "British physiologist who conducted Porton research on gas effects and chemical-defence physiology."

ENG_harold_hartley: "Harold Hartley"
ENG_harold_hartley_desc: "British physical chemist prominent in chemical-warfare and defence planning."

ENG_john_scott_haldane: "John Scott Haldane"
ENG_john_scott_haldane_desc: "British physiologist who applied respiratory research to gas exposure and chemical-defence protection."

ENG_joseph_barcroft: "Joseph Barcroft"
ENG_joseph_barcroft_desc: "British physiologist who studied oxygen transport and respiratory responses relevant to gas protection."

ENG_rudolph_peters: "Rudolph Peters"
ENG_rudolph_peters_desc: "British biochemist whose Porton work investigated biochemical injury and chemical-warfare countermeasures."

ENG_edward_abraham: "Edward Abraham"
ENG_edward_abraham_desc: "British biochemist who helped develop penicillin and later studied antibiotic chemistry."

ENG_norman_heatley: "Norman Heatley"
ENG_norman_heatley_desc: "British biochemist whose technical work enabled large-scale penicillin extraction and production."

ENG_patrick_laidlaw: "Patrick Laidlaw"
ENG_patrick_laidlaw_desc: "Scottish virologist who helped isolate the human influenza virus and advanced infectious-disease research."

ENG_b_c_j_g_knight: "B. C. J. G. Knight"
ENG_b_c_j_g_knight_desc: "British bacteriologist known for work on bacterial nutrition and laboratory cultivation methods."

ENG_david_w_w_henderson: "David W. W. Henderson"
ENG_david_w_w_henderson_desc: "British bacteriologist involved in Porton Down biological-warfare research and aerosol studies."

ENG_donald_d_woods: "Donald D. Woods"
ENG_donald_d_woods_desc: "British biochemist whose research on bacterial metabolism supported antibiotic and biological-defence work."

FRA_charles_dufraisse: "Charles Dufraisse"
FRA_charles_dufraisse_desc: "French chemist who researched combat gases and antioxidant chemistry for chemical protection."

FRA_paul_lebeau: "Paul Lebeau"
FRA_paul_lebeau_desc: "French chemist who worked on gas-mask materials and chemical defence against arsine and related agents."

GER_august_hirt: "August Hirt"
GER_august_hirt_desc: "German anatomist who selected concentration-camp prisoners for murder in a racist anatomical collection."

GER_ferdinand_flury: "Ferdinand Flury"
GER_ferdinand_flury_desc: "German toxicologist who studied chemical agents and military toxicology."

GER_otto_ambros: "Otto Ambros"
GER_otto_ambros_desc: "German chemist who directed nerve-agent production and industrial projects using forced labor."

GER_otto_bickenbach: "Otto Bickenbach"
GER_otto_bickenbach_desc: "German physician who conducted phosgene experiments on prisoners."

GER_richard_kuhn: "Richard Kuhn"
GER_richard_kuhn_desc: "German chemist who helped develop soman during wartime research into tabun and sarin."

GER_gerhard_rose: "Gerhard Rose"
GER_gerhard_rose_desc: "German physician who conducted malaria experiments and helped organize lethal typhus experiments on prisoners."

GER_joachim_mrugowsky: "Joachim Mrugowsky"
GER_joachim_mrugowsky_desc: "German SS physician who headed the SS Hygiene Institute and coordinated lethal experiments on prisoners."

GER_erwin_ding_schuler: "Erwin Ding-Schuler"
GER_erwin_ding_schuler_desc: "German SS physician who directed typhus experiments on prisoners at Buchenwald."

JAP_ryoichi_naito: "Ryoichi Naito"
JAP_ryoichi_naito_desc: "Japanese Army physician who directed Unit 9420 and investigated blood plasma and biological warfare."

POL_rudolf_weigl: "Rudolf Weigl"
POL_rudolf_weigl_desc: "Polish biologist who developed a major typhus vaccine program under occupation."

POL_ludwik_fleck: "Ludwik Fleck"
POL_ludwik_fleck_desc: "Polish-Jewish bacteriologist whose typhus research and vaccine work continued under occupation and imprisonment."

SOV_georgy_gause: "Georgy Gause"
SOV_georgy_gause_desc: "Soviet microbiologist who developed the antibiotic Gramicidin S and worked in wartime medical research."

SOV_nikolai_ginsburg: "Nikolai Ginsburg"
SOV_nikolai_ginsburg_desc: "Soviet scientist involved in early Red Army biological-warfare research and vaccine development."

SOV_sergei_muromtsev: "Sergei Muromtsev"
SOV_sergei_muromtsev_desc: "Soviet microbiologist and former security officer who worked in state bacteriological research."

SOV_zinaida_yermolyeva: "Zinaida Yermolyeva"
SOV_zinaida_yermolyeva_desc: "Soviet physician and microbiologist who researched cholera and helped develop penicillin production."

SOV_nikolay_zelinsky: "Nikolay Zelinsky"
SOV_nikolay_zelinsky_desc: "Soviet chemist whose activated-charcoal gas mask became a major chemical-protection design."

SOV_yakov_fishman: "Yakov Fishman"
SOV_yakov_fishman_desc: "Soviet military chemist who directed chemical service and biological-defence research."

USA_stanhope_bayne_jones: "Stanhope Bayne-Jones"
USA_stanhope_bayne_jones_desc: "American physician and public-health administrator who advised wartime preventive-medicine and biological-defence programs."

USA_william_a_hagan: "William A. Hagan"
USA_william_a_hagan_desc: "American veterinarian and bacteriologist contracted to research botulinum toxin for the wartime biological-warfare program."

USA_karl_friedrich_meyer: "Karl Friedrich Meyer"
USA_karl_friedrich_meyer_desc: "Swiss-born American veterinarian and microbiologist who advanced plague control and research on other infectious diseases."

USA_theodor_rosebury: "Theodor Rosebury"
USA_theodor_rosebury_desc: "American microbiologist who researched airborne pathogens and biological aerosol transmission."

USA_edwin_broun_fred: "Edwin Broun Fred"
USA_edwin_broun_fred_desc: "American bacteriologist who chaired the scientific study that preceded the wartime biological-warfare program."

USA_george_w_merck: "George W. Merck"
USA_george_w_merck_desc: "American pharmaceutical executive who directed the War Research Service and oversaw the wartime biological-warfare program."

USA_james_stevens_simmons: "James Stevens Simmons"
USA_james_stevens_simmons_desc: "American physician and epidemiologist who advised preventive medicine and military biological-defence programs."

USA_cornelius_p_rhoads: "Cornelius P. Rhoads"
USA_cornelius_p_rhoads_desc: "American physician whose wartime work included gas-casualty medicine and chemical-defence research."

USA_dean_s_tarbell: "Dean S. Tarbell"
USA_dean_s_tarbell_desc: "American chemist who developed mustard-agent detection methods for chemical defense."

USA_james_b_conant: "James B. Conant"
USA_james_b_conant_desc: "American chemist who chaired the NDRC and coordinated wartime chemical research."

USA_winford_lee_lewis: "Winford Lee Lewis"
USA_winford_lee_lewis_desc: "American chemist who developed lewisite and worked on chemical-agent research."

# Historical Chaos Warfare theorists and CBRN advisors
chaos_warfare_chemical_theorist_trait: "Chemical Warfare Theorist"
chaos_warfare_chemical_theorist_trait_desc: "A specialist in military toxicology, agent formulation, and operational chemical doctrine."
chaos_warfare_chemical_theorist_operational_tt: "Chemical operations gain §G+30%§! delivered dose, §G+25%§! contamination, and §G+35%§! Chemical Readiness gains. Readiness expenditure is reduced by §G30%§! and resulting Condemnation by §G18%§!. Evidence and attribution are unchanged."

chaos_warfare_biological_theorist_trait: "Biological Warfare Theorist"
chaos_warfare_biological_theorist_trait_desc: "A program architect able to turn laboratory knowledge into battlefield-scale biological doctrine."
chaos_warfare_biological_theorist_operational_tt: "Biological deployments gain §G+30%§! initial potency, §G+20%§! growth, and §G+25%§! spread and deaths. Resulting Condemnation is reduced by §G18%§!. Evidence and attribution are unchanged."

chaos_warfare_weaponization_theorist_trait: "Chaos Weaponization Theorist"
chaos_warfare_weaponization_theorist_trait_desc: "An advocate of unrestricted biological weaponization, mass dissemination, and deliberate epidemic warfare."
chaos_warfare_weaponization_theorist_operational_tt: "Biological deployments gain §G+40%§! initial potency, spread, and deaths, §G+35%§! growth, and §G+30%§! medical saturation. Resulting Condemnation is reduced by §G30%§!. Evidence and attribution are unchanged."

cbrn_medical_countermeasure_pioneer_trait: "Medical Countermeasure Pioneer"
cbrn_medical_countermeasure_pioneer_trait_desc: "A medical researcher capable of turning laboratory advances into national treatment, antibiotic, and emergency-response programs."
cbrn_medical_countermeasure_pioneer_operational_tt: "Enemy chemical attacks cause §G30% fewer deaths§! and §G30% less medical saturation§!. Biological outbreaks cause §G30% fewer deaths§!, §G35% less medical saturation§!, and gain §G+15§! detection chance."

cbrn_biological_program_director_trait: "Biological Program Director"
cbrn_biological_program_director_trait_desc: "An experienced administrator of biological research, testing, and military production programs."
cbrn_biological_program_director_operational_tt: "Biological deployments gain §G+20%§! initial potency and growth. Resulting Condemnation is reduced by §G12%§!. Evidence and attribution are unchanged."

cbrn_biological_weaponization_director_trait: "Biological Weaponization Director"
cbrn_biological_weaponization_director_trait_desc: "A director prepared to transform pathogen research into systematic offensive weaponization."
cbrn_biological_weaponization_director_operational_tt: "Biological deployments gain §G+30%§! initial potency, spread, and deaths and §G+25%§! growth. Resulting Condemnation is reduced by §G22%§!. Evidence and attribution are unchanged."

cbrn_toxicological_weaponization_director_trait: "Toxicological Weaponization Director"
cbrn_toxicological_weaponization_director_trait_desc: "A poison specialist able to connect toxicological research with military delivery, concealment, and mass exposure."
cbrn_toxicological_weaponization_director_operational_tt: "Chemical operations gain §G+30%§! delivered dose, §G+25%§! deaths, §G+30%§! contamination, and §G+30%§! Chemical Readiness gains. Readiness expenditure and resulting Condemnation are reduced by §G25%§! and §G22%§! respectively. Evidence and attribution are unchanged."

cbrn_resistance_biological_sabotage_director_trait: "Resistance Biological Saboteur"
cbrn_resistance_biological_sabotage_director_trait_desc: "A clandestine physician-scientist experienced in underground organization and controlled biological sabotage against an occupying power."
cbrn_resistance_biological_sabotage_director_operational_tt: "Biological deployments gain §G+25%§! initial potency and spread. Resulting Condemnation is reduced by §G15%§!. Evidence and attribution are unchanged."
