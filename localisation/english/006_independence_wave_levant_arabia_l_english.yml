l_english:
# Levant and Arabia framework packages: Hejaz, the Imamate of Oman, Lebanon and Palestine.
independence_wave_levant_peaceful_former_host_tt: "Our former host still exists and is not at war with us."

# Hejaz
independence_wave_cux_hejaz_category: "The Hejaz Settlement"
independence_wave_cux_hejaz_category_desc: "Mecca, Medina and Jeddah govern themselves again, but the treasury still lives from one pilgrimage season to the next. The provisional council must keep the pilgrim roads open, seat a council the notables of the holy cities will accept, and put the port of Jeddah back to work."
independence_wave_cux_seat_consultative_council: "Seat the Consultative Council of Mecca"
independence_wave_cux_seat_consultative_council_desc: "Call the merchants, scholars and quarter notables of Mecca, Medina and Jeddah into a consultative council that approves the budget and the pilgrim dues."
independence_wave_cux_seat_consultative_council_tt: "Raises §YLegitimacy§! and lowers §YInstability§!. The council can then reopen the Jeddah customs house."
independence_wave_cux_guarantee_hajj_routes: "Guarantee the Hajj Routes"
independence_wave_cux_guarantee_hajj_routes_desc: "Post guards at the wells and caravan stations between Jeddah, Mecca and Medina, so that every pilgrim nation sees the Hejaz keep the roads safe."
independence_wave_cux_guarantee_hajj_routes_tt: "Replaces §YLiving on the Pilgrimage§! with §YGuardians of the Hajj§! and greatly raises §YRecognition§!."
independence_wave_cux_reopen_jeddah_customs: "Reopen the Jeddah Customs House"
independence_wave_cux_reopen_jeddah_customs_desc: "Restore the customs house at Jeddah under the council's own tariff, so that the port earns between pilgrim seasons."
independence_wave_cux_reopen_jeddah_customs_tt: "Adds §YThe Jeddah Customs House§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_cux_pilgrim_dependence: "Living on the Pilgrimage"
independence_wave_cux_pilgrim_dependence_desc: "The pilgrim dues are the treasury. A poor season or a closed road empties it, and the holy cities have no other income to fall back on."
independence_wave_cux_hajj_guardianship: "Guardians of the Hajj"
independence_wave_cux_hajj_guardianship_desc: "The roads to the holy cities are guarded and the pilgrim nations know it. Their governments deal with the Hejaz as the keeper of the Hajj."
independence_wave_cux_jeddah_customs: "The Jeddah Customs House"
independence_wave_cux_jeddah_customs_desc: "Jeddah collects its own customs again and trades all year, not only in the pilgrim season."
independence_wave_cux_council_seated: "The Consultative Council of Mecca has been seated"

# Imamate of Oman
independence_wave_imo_imamate_category: "The Imamate Council"
independence_wave_imo_imamate_category_desc: "The Imam at Nizwa rules the interior through the shaykhs of the tribes. The Treaty of Seeb once kept the peace with the coast; now the Imamate must decide whether to renew it or to stand alone in the mountains."
independence_wave_imo_convene_shaykhs_at_nizwa: "Convene the Shaykhs at Nizwa"
independence_wave_imo_convene_shaykhs_at_nizwa_desc: "Summon the shaykhs of the interior to Nizwa to swear allegiance to the Imam and agree on the defence of the wadis."
independence_wave_imo_convene_shaykhs_at_nizwa_tt: "Raises §YLegitimacy§! and §YSecurity§!. The Imamate can then settle its relations with the coast."
independence_wave_imo_renew_treaty_of_seeb: "Renew the Treaty of Seeb"
independence_wave_imo_renew_treaty_of_seeb_desc: "Send envoys to the coast to renew the 1920 treaty: the interior governs itself, and its merchants trade freely through the coastal ports."
independence_wave_imo_renew_treaty_of_seeb_tt: "Replaces §YThe Treaty of Seeb Unsettled§! with §YThe Treaty of Seeb§!, raises §YRecognition§! and §YCapacity§!, and eases relations with our former host."
independence_wave_imo_close_the_coast_road: "Close the Coast Road"
independence_wave_imo_close_the_coast_road_desc: "Seal the passes to the coast, arm the tribes and live from the interior's own wells, dates and markets."
independence_wave_imo_close_the_coast_road_tt: "Replaces §YThe Treaty of Seeb Unsettled§! with §YThe Interior Stands Alone§!, raises §YSecurity§! and §YLegitimacy§!, and angers our former host."
independence_wave_imo_open_caravan_routes: "Open the Interior Caravan Routes"
independence_wave_imo_open_caravan_routes_desc: "Fund wells, guards and market rights along the caravan routes from Nizwa to the desert and the sea."
independence_wave_imo_open_caravan_routes_tt: "Raises §YCapacity§! and §YRecognition§!."
independence_wave_imo_seeb_unsettled: "The Treaty of Seeb Unsettled"
independence_wave_imo_seeb_unsettled_desc: "Nobody knows whether the old settlement with the coast still holds. Caravans wait at the passes and the tribes argue about who should guard them."
independence_wave_imo_treaty_of_seeb: "The Treaty of Seeb"
independence_wave_imo_treaty_of_seeb_desc: "The interior governs itself under the Imam, and its trade passes freely through the coastal ports."
independence_wave_imo_interior_self_reliance: "The Interior Stands Alone"
independence_wave_imo_interior_self_reliance_desc: "The passes are closed and the tribes stand guard. The Imamate trades less, but nobody on the coast decides its affairs."
independence_wave_imo_shaykhs_convened: "The shaykhs have sworn allegiance at Nizwa"
independence_wave_imo_seeb_settled: "Relations with the coast are settled"

# Lebanon
independence_wave_leb_settlement_category: "The Lebanese Settlement"
independence_wave_leb_settlement_category_desc: "The republic has a constitution but no agreement on who holds its offices. Before Beirut can live from its port and its banks, the communities of the Mountain and the coast must agree on how they share the state."
independence_wave_leb_apportion_great_offices: "Apportion the Great Offices"
independence_wave_leb_apportion_great_offices_desc: "Agree that the presidency, the premiership and the chair of the chamber are shared among the largest communities, and that seats in the chamber follow the same balance."
independence_wave_leb_apportion_great_offices_tt: "Replaces §YThe Unwritten Pact§! with §YThe National Pact§!, raises §YLegitimacy§! and §YRecognition§!, and lowers §YInstability§!."
independence_wave_leb_open_offices_to_every_citizen: "Open the Offices to Every Citizen"
independence_wave_leb_open_offices_to_every_citizen_desc: "Abolish the community quotas and fill every office by election and merit. The communities that counted on their shares will not accept it quietly."
independence_wave_leb_open_offices_to_every_citizen_tt: "Replaces §YThe Unwritten Pact§! with §YThe Civic Charter§!, greatly raises §YLegitimacy§!, raises §YRecognition§! and raises §YInstability§!."
independence_wave_leb_proclaim_free_port_of_beirut: "Proclaim the Free Port of Beirut"
independence_wave_leb_proclaim_free_port_of_beirut_desc: "Open Beirut to the trade of the whole Levant without duties, and let its banks and warehouses carry the economy."
independence_wave_leb_proclaim_free_port_of_beirut_tt: "Adds §YThe Free Port of Beirut§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_leb_settle_mandate_accounts: "Settle the Mandate Accounts"
independence_wave_leb_settle_mandate_accounts_desc: "Agree with our former host how the debts, the railway shares and the public property of the mandate years are divided."
independence_wave_leb_settle_mandate_accounts_tt: "Raises §YRecognition§! and eases hostility, obligations and property disputes with our former host."
independence_wave_leb_unwritten_pact: "The Unwritten Pact"
independence_wave_leb_unwritten_pact_desc: "Every community expects a share of the state, but nobody has written down which share. Each appointment becomes a quarrel."
independence_wave_leb_national_pact: "The National Pact"
independence_wave_leb_national_pact_desc: "The great offices are shared among the largest communities. The balance is rigid, but every community knows its place in the state."
independence_wave_leb_civic_charter: "The Civic Charter"
independence_wave_leb_civic_charter_desc: "Offices are filled by election and merit, not by community. The schools and the press of Beirut back the charter; the old notables do not."
independence_wave_leb_free_port: "The Free Port of Beirut"
independence_wave_leb_free_port_desc: "Goods move through Beirut without duties, and its banks finance the trade of the whole Levant."
independence_wave_leb_pact_settled: "The offices of the state have been settled"

# Palestine
independence_wave_pal_mandate_end_category: "The Mandate's End"
independence_wave_pal_mandate_end_category_desc: "The mandate is gone, but its divided administration remains. Arab and Jewish towns keep separate councils, land titles are disputed, and the holy places draw the attention of every faith. The provisional government must build institutions both peoples can live with."
independence_wave_pal_convene_legislative_council: "Convene the Legislative Council"
independence_wave_pal_convene_legislative_council_desc: "Seat an elected legislative council with members from every community, as was proposed and never realised under the mandate."
independence_wave_pal_convene_legislative_council_tt: "Replaces §YDivided Municipalities§! with §YThe Legislative Council§!, raises §YLegitimacy§! and §YRecognition§!, and lowers §YInstability§!."
independence_wave_pal_appoint_land_commission: "Appoint the Land Registry Commission"
independence_wave_pal_appoint_land_commission_desc: "Appoint a commission to register titles village by village and to hear the cases of tenants who lost their land through sales."
independence_wave_pal_appoint_land_commission_tt: "Raises §YCapacity§! and §YLegitimacy§! and lowers §YInstability§!."
independence_wave_pal_seek_holy_places_guarantee: "Seek Guarantees for the Holy Places"
independence_wave_pal_seek_holy_places_guarantee_desc: "Invite foreign governments to guarantee free access to the holy places of Jerusalem, Bethlehem and Hebron under our protection."
independence_wave_pal_seek_holy_places_guarantee_tt: "Adds §YGuarantees for the Holy Places§! and greatly raises §YRecognition§!."
independence_wave_pal_divided_municipalities: "Divided Municipalities"
independence_wave_pal_divided_municipalities_desc: "Each community runs its own councils, schools and police posts. The provisional government has authority on paper and very little in the towns."
independence_wave_pal_legislative_council: "The Legislative Council"
independence_wave_pal_legislative_council_desc: "Members from every community sit in one council and pass one budget. Their quarrels now happen in the chamber rather than in the street."
independence_wave_pal_holy_places_guarantee: "Guarantees for the Holy Places"
independence_wave_pal_holy_places_guarantee_desc: "Foreign governments guarantee free access to the holy places, and in doing so recognize the government that protects them."
independence_wave_pal_council_convened: "The Legislative Council has been convened"

# Incidents
chaosx.nr6.200.t: "The Silk Mills of Mount Lebanon"
chaosx.nr6.200.d: "The silk mills of the Mountain are closing one after another. Lyon pays less every year for raw silk, and whole villages that lived from the cocoons are thinking of emigrating."
chaosx.nr6.200.a: "Buy the cocoons for the state"
chaosx.nr6.200.b: "Let Lyon set the price"
chaosx.nr6.201.t: "Letters from the Mahjar"
chaosx.nr6.201.d: "Lebanese emigrants in New York, Sao Paulo and Buenos Aires write that they will support the new republic, if the republic remembers them."
chaosx.nr6.201.a: "Give the emigrants a vote"
chaosx.nr6.201.b: "Ask the emigrants for a loan"
chaosx.nr6.202.t: "The General Strike"
chaosx.nr6.202.d: "A strike committee has closed the shops, the buses and the port of Jaffa until its demands on land and immigration are heard. Every day the strike lasts, the new government looks weaker."
chaosx.nr6.202.a: "Negotiate with the strike committee"
chaosx.nr6.202.b: "Reopen the ports under emergency rule"
chaosx.nr6.203.t: "Two Harbours on One Coast"
chaosx.nr6.203.d: "During the strike, Tel Aviv built a jetty of its own. Jaffa's lightermen want it closed; Tel Aviv's merchants want it licensed as a full harbour."
chaosx.nr6.203.a: "Keep Jaffa as the national harbour"
chaosx.nr6.203.b: "License the Tel Aviv harbour too"
chaosx.nr6.204.t: "The Date Harvest Tithe"
chaosx.nr6.204.d: "The date harvest is in. The Imam's treasurers want the tithe sent to Nizwa; the shaykhs say it has always stayed with the tribes that guard the groves."
chaosx.nr6.204.a: "Collect the tithe for the treasury"
chaosx.nr6.204.b: "Leave the tithe with the tribes"
chaosx.nr6.205.t: "Surveyors at Fahud"
chaosx.nr6.205.d: "A party of oil surveyors with a foreign company's papers has been stopped at the edge of the desert near Fahud. They offer payment for the right to search for oil."
chaosx.nr6.205.a: "Admit them on the Imam's terms"
chaosx.nr6.205.b: "Turn them back at the wadi"
chaosx.nr6.206.t: "The Pilgrim Ships from Java"
chaosx.nr6.206.d: "The pilgrim ships from the East Indies must stop at the quarantine station on Kamaran island, which a foreign power runs and taxes. The ship owners ask whether the Hejaz will run its own quarantine at Jeddah."
chaosx.nr6.206.a: "Build our own quarantine station at Jeddah"
chaosx.nr6.206.b: "Rely on the Kamaran station"
chaosx.nr6.207.t: "The Hashemite Question"
chaosx.nr6.207.d: "Letters from Baghdad and Amman ask whether the family of the last King of the Hejaz may return. Many notables of Mecca would welcome them; others want the council to remain in charge."
chaosx.nr6.207.a: "Invite the Hashemite family home"
chaosx.nr6.207.b: "Keep the council in charge"
