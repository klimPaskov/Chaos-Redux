l_english:
# West and Central Africa framework packages: Oyo and Kanem-Bornu.
# Oyo
independence_wave_dsx_oyo_category: "The Oyo Settlement"
independence_wave_dsx_oyo_category_desc: "Oyo governs itself again, but the balance between the Alaafin and the Oyo Mesi has not been restored. Ibadan, now richer than Oyo itself, follows its own interests."
independence_wave_dsx_seat_oyo_mesi: "Seat the Oyo Mesi in Council"
independence_wave_dsx_seat_oyo_mesi_desc: "Restore the Oyo Mesi as a council that confirms the Alaafin's ministers and approves the budget, beside a modern cabinet."
independence_wave_dsx_seat_oyo_mesi_tt: "Replaces §YThe Oyo Mesi Deadlock§! with §YThe Oyo Mesi in Council§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_dsx_reconcile_ibadan: "Reconcile Ibadan"
independence_wave_dsx_reconcile_ibadan_desc: "Give Ibadan's chiefs and merchants seats in the cabinet and a share of the customs, so the largest city works with the state instead of around it."
independence_wave_dsx_reconcile_ibadan_tt: "Raises §YCapacity§! and §YRecognition§!. The Yoruba towns can then be convened."
independence_wave_dsx_raise_horse_guard: "Raise the Alaafin's Horse Guard"
independence_wave_dsx_raise_horse_guard_desc: "Revive the mounted guard of the old Oyo cavalry as a modern regiment of the state army."
independence_wave_dsx_raise_horse_guard_tt: "Adds §YThe Alaafin's Horse Guard§! and raises §YSecurity§!."
independence_wave_dsx_convene_yoruba_towns: "Convene the Yoruba Towns"
independence_wave_dsx_convene_yoruba_towns_desc: "Invite the rulers and councils of the Yoruba towns to a congress at Oyo on trade, roads and common defence, without demanding their submission."
independence_wave_dsx_convene_yoruba_towns_tt: "Raises §YRecognition§! and §YLegitimacy§!."
independence_wave_dsx_oyo_mesi_deadlock: "The Oyo Mesi Deadlock"
independence_wave_dsx_oyo_mesi_deadlock_desc: "The Alaafin's officials and the kingmakers of the Oyo Mesi each claim the right to name ministers. Decrees are issued twice or not at all."
independence_wave_dsx_oyo_mesi_council: "The Oyo Mesi in Council"
independence_wave_dsx_oyo_mesi_council_desc: "The Oyo Mesi confirms ministers and approves the budget, and the Alaafin governs through a cabinet the council accepts."
independence_wave_dsx_horse_guard: "The Alaafin's Horse Guard"
independence_wave_dsx_horse_guard_desc: "A mounted regiment in the tradition of the Oyo cavalry guards the capital and the northern roads."
independence_wave_dsx_ibadan_reconciled: "Ibadan has been reconciled with the state"

# Kanem-Bornu
independence_wave_dux_bornu_category: "The Bornu Settlement"
independence_wave_dux_bornu_category_desc: "Bornu governs itself from Maiduguri. The Shehu's court still commands respect, but the Lake Chad trade has dwindled, and the state needs both council and caravans."
independence_wave_dux_seat_shehus_council: "Seat Shehu's Council at Maiduguri"
independence_wave_dux_seat_shehus_council_desc: "Form a council of the Shehu's officials, the district heads and the scholars of Kukawa to govern beside a provisional cabinet."
independence_wave_dux_seat_shehus_council_tt: "Raises §YLegitimacy§! and lowers §YInstability§!. The council can then reopen the lake routes."
independence_wave_dux_reopen_lake_chad_routes: "Reopen the Lake Chad Routes"
independence_wave_dux_reopen_lake_chad_routes_desc: "Restore the markets, boats and caravan stations that tied Bornu to Kanem, Bagirmi and the desert across Lake Chad."
independence_wave_dux_reopen_lake_chad_routes_tt: "Replaces §YThe Lake Trade in Decline§! with §YThe Lake Chad Trade§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_dux_raise_kanembu_horse: "Raise the Kanembu Horse"
independence_wave_dux_raise_kanembu_horse_desc: "Form mounted regiments from the Kanembu and Shuwa Arab horsemen who once guarded the Shehu's court."
independence_wave_dux_raise_kanembu_horse_tt: "Adds §YThe Kanembu Horse§! and raises §YSecurity§!."
independence_wave_dux_lake_trade_decline: "The Lake Trade in Decline"
independence_wave_dux_lake_trade_decline_desc: "The caravans that once crossed Lake Chad have dwindled. Maiduguri's markets depend on routes nobody guards."
independence_wave_dux_lake_chad_trade: "The Lake Chad Trade"
independence_wave_dux_lake_chad_trade_desc: "Boats, markets and caravan stations tie Bornu to the whole Lake Chad basin again."
independence_wave_dux_kanembu_horse: "The Kanembu Horse"
independence_wave_dux_kanembu_horse_desc: "Mounted regiments of Kanembu and Shuwa Arab horsemen guard the plains of Bornu."
independence_wave_dux_shehus_council_seated: "The Shehu's council has been seated"

# Incidents
chaosx.nr6.210.t: "The Ibadan Toll Gates"
chaosx.nr6.210.d: "Ibadan's chiefs still collect tolls on every load that passes through the city on its way to Oyo. The traders of Oyo ask the government to abolish them."
chaosx.nr6.210.a: "Buy out the tolls"
chaosx.nr6.210.b: "Leave the tolls to Ibadan"
chaosx.nr6.211.t: "The Cocoa Buyers"
chaosx.nr6.211.d: "The foreign firms that buy the cocoa crop have agreed to pay one price among themselves. The farmers want to hold back their cocoa until the buyers give way."
chaosx.nr6.211.a: "Back the farmers' hold-up"
chaosx.nr6.211.b: "Sell through the buying pool"
chaosx.nr6.212.t: "The Scholars of Kukawa"
chaosx.nr6.212.d: "The Quranic scholars of Kukawa ask the government to fund their schools. The cabinet would rather open state schools in Maiduguri."
chaosx.nr6.212.a: "Fund the Kukawa schools"
chaosx.nr6.212.b: "Open state schools in Maiduguri"
chaosx.nr6.213.t: "Salt from Bilma"
chaosx.nr6.213.d: "The salt caravans from the oasis of Bilma have reached the edge of Lake Chad. Their leaders ask whether Bornu will let them pass free, as in the old days."
chaosx.nr6.213.a: "Let the caravans pass free"
chaosx.nr6.213.b: "Tax the caravans at the lake"
