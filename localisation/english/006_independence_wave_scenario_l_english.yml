independence_wave_scenario_reject_living_tag: "Rejected because the assigned tag is already alive. Event 6 never overwrites a living country or the content that created it."
independence_wave_scenario_reject_package_unready: "Rejected because its researched playable package or exact force mapping is not ready. Registry membership alone does not authorize shallow release content."
independence_wave_scenario_reject_mode_excluded: "Rejected because this package's accepted disposition does not permit direct release in the selected mode."
independence_wave_scenario_reject_missing_anchor: "Rejected because no unique valid anchor survived the current ownership and map checks."
independence_wave_scenario_reject_state_reserved: "Rejected because its required anchor was already reserved by a higher-priority package in this same frozen plan."
independence_wave_scenario_reject_reservation_group_taken: "Rejected because another package already claimed its mutually exclusive reservation group."
independence_wave_scenario_reject_event5_collision: "Rejected because Soviet Collapse reserved the same tag or state first during a joint Liberation incident."
independence_wave_scenario_reject_host_survival: "Rejected because releasing the anchor would leave a host without its protected surviving state."
independence_wave_scenario_reject_unsafe_instantiation: "Rejected at the final live validation barrier because safe country creation could not be proven."
independence_wave_scenario_reject_invalid_scope: "Rejected because its country, anchor, or former-host scope was invalid when the plan was built."
independence_wave_scenario_reject_stale_plan: "Rejected because the release plan no longer owned the active transaction."
independence_wave_scenario_reject_aligned_array_failure: "Rejected because the package metadata no longer aligned with the frozen country and state rows."
independence_wave_scenario_reject_insufficient_pool: "Rejected because no safe, complete candidate remained for the requested plan."
independence_wave_scenario_reject_protected_state_mismatch: "Rejected because a host's protected remnant no longer matched the live ownership proof."
independence_wave_scenario_reject_package_already_selected: "Rejected because the same package was already present in this frozen plan."
independence_wave_scenario_reject_unbound_current_map: "Disabled because the installed map has no exact accepted state for this identity. No nearby broad state or generic substitute was used."
independence_wave_scenario_reject_unknown: "Rejected by an unclassified transaction proof. The package remains disabled rather than being released without a safe explanation."
