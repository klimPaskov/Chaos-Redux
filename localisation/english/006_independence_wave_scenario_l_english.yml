chaosx.scenarios.independence_wave.desc.sovereign_scatter: "Every viable movement is attempted. Each release keeps a protected former-host remnant and unique anchor. States stay outside pre-formed leagues and release-created factions. Intensity changes territory, forces, institutions, and pressure."
chaosx.scenarios.independence_wave.desc.common_congress: "Every viable movement is attempted under protected hosts and unique anchors. New states join an informal congress network. Higher intensity strengthens its charter and shared reserve."
chaosx.scenarios.independence_wave.desc.wars_of_separation: "Every viable movement is attempted. A country that can lawfully confront its surviving former host may open one separation war. Others receive a regional threat mission."
chaosx.scenarios.independence_wave.desc.universal_former_hosts: "Every viable movement is attempted. Each new country may face one bounded former-host conflict. Invalid declarations become regional threat missions. Host remnants and homelands are secured first."
chaosx.scenarios.independence_wave.desc.universal_neighboring_releases: "Every viable movement is attempted. Each new country may open one bounded war against one neighboring release from the same incident. One-time targets prevent an all-against-all cascade."
chaosx.scenarios.independence_wave.desc.universal_nearby_nonleague: "Every viable movement is attempted. Each new country may open one bounded war against one nearby independent state outside the League and every faction. Distance and one-time targets keep the crisis regional."
chaosx.scenarios.independence_wave.desc.patron_worlds: "Every viable movement is attempted. Each new country seeks one reachable major patron, preferring ideological affinity and regional proximity. Intensity scales influence, aid, recognition, and capacity."
chaosx.scenarios.independence_wave.desc.great_partition: "Every viable movement is attempted. Hosts retain a protected remnant state, favoring a core or capital. Intensity grants the next non-overlapping tier, with stronger border pressure, host claims, ambitions, and formables."

chaosx.scenarios.independence_wave.impact.low: "All viable candidates are still attempted. Each valid release receives only its anchor, fragile local defense, scarce stocks, weak institutions, low recognition, and severe opening instability."
chaosx.scenarios.independence_wave.impact.medium: "All viable candidates are still attempted. Valid releases receive compact territory, viable militia and border formations, baseline institutions, and ordinary route access."
chaosx.scenarios.independence_wave.impact.high: "All viable candidates are still attempted. Valid releases receive extended territory where collisions permit, armed forces, stronger depots and officers, firmer institutions, faster league development, and accelerated ambitions."
chaosx.scenarios.independence_wave.impact.maximum: "All viable candidates are still attempted. Valid releases receive the strongest non-overlapping territory and forces, rare support where their researched route permits it, high-chaos access, early formable discovery, and aggressive AI pressure."

chaosx.scenarios.launch_status.independence_wave.world_end: "Unavailable: the world has already entered a terminal state."
chaosx.scenarios.launch_status.independence_wave.presentation_pending: "Unavailable: a synchronized Liberation incident is awaiting presentation."
chaosx.scenarios.launch_status.independence_wave.transaction_busy: "Unavailable: a Liberation release plan currently owns the transaction barrier."
chaosx.scenarios.launch_status.independence_wave.ready: "Ready: SCN-008 will rank and attempt every independence movement with a unique accepted homeland. Other identities and route overlays remain outside the countries that can emerge and are reported separately."

chaosx.triggerable_scenarios.80.t: "Every Banner Rises"
chaosx.triggerable_scenarios.80.d: "[GetIndependenceWaveScenarioSummaryOutcome]\nOutcome: [GetIndependenceWaveScenarioFailureReason]\n\nCountries released: [?global.independence_wave_scenario_released_count|0]\nBound movements turned away: [?global.independence_wave_scenario_bound_blocked_count|0]\nIdentities without a safe homeland: [?global.independence_wave_scenario_disabled_unbound_count|0]\nFormer hosts protected: [?global.independence_wave_scenario_host_count|0]\nScenario type: [GetIndependenceWaveScenarioLastTypeName]\nIntensity: [GetIndependenceWaveScenarioLastIntensityName]\nLeague members: [?global.independence_wave_scenario_league_member_count|0]\nActive opening wars: [?global.independence_wave_scenario_active_war_count|0]\nTerritory: [GetIndependenceWaveScenarioTerritoryName]\nForces: [GetIndependenceWaveScenarioForceName]\n\nThe incident record preserves every movement that could not safely emerge and the reason its homeland or political route was unavailable."
