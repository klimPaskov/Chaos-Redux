chaosx.scenarios.independence_wave.desc.sovereign_scatter: "Every viable independence movement breaks away. Hosts keep a protected remnant, each new state gets its own starting territory, and none joins a league or faction. Intensity changes territory, forces, and pressure."
chaosx.scenarios.independence_wave.desc.common_congress: "Every viable independence movement breaks away from a protected host. The new states join an informal congress, and higher intensity strengthens its charter and shared reserve."
chaosx.scenarios.independence_wave.desc.wars_of_separation: "Every viable independence movement breaks away. A new state able to confront its former host may open one war of separation. The others receive a regional threat mission."
chaosx.scenarios.independence_wave.desc.universal_former_hosts: "Every viable independence movement breaks away. Each new state may open one war against its former host. Hosts keep their homelands, and wars that cannot start become regional threat missions."
chaosx.scenarios.independence_wave.desc.universal_neighboring_releases: "Every viable independence movement breaks away. Each new state may open one war against a neighboring state released in the same crisis. Each state is targeted once, so no all-against-all cascade follows."
chaosx.scenarios.independence_wave.desc.universal_nearby_nonleague: "Every viable independence movement breaks away. Each new state may open one war against a nearby independent state outside the League and every faction. Each target is chosen once and distance keeps the crisis regional."
chaosx.scenarios.independence_wave.desc.patron_worlds: "Every viable independence movement breaks away. Each new state seeks one reachable major patron, favoring shared ideology and regional proximity. Intensity scales influence, aid, and recognition."
chaosx.scenarios.independence_wave.desc.great_partition: "Every viable independence movement breaks away. Each host keeps one protected remnant, preferring its capital, then a safe core state. Higher intensity adds the next tier of territory, border pressure, claims, and ambitions."

chaosx.scenarios.independence_wave.impact.low: "Each release gets only its starting territory, fragile defenses, scarce stocks, weak institutions, low recognition, and severe instability."
chaosx.scenarios.independence_wave.impact.medium: "Releases receive compact territory, militia and border formations, baseline institutions, and ordinary route access."
chaosx.scenarios.independence_wave.impact.high: "Releases receive wider territory where borders allow, armed forces, stronger depots and officers, firmer institutions, and faster ambitions."
chaosx.scenarios.independence_wave.impact.maximum: "Releases receive the largest territory and forces, rare support where their route allows it, high-chaos access, early formable discovery, and aggressive AI."

chaosx.scenarios.launch_status.independence_wave.world_end: "Unavailable: a world-ending scenario is already active."
chaosx.scenarios.launch_status.independence_wave.presentation_pending: "Unavailable: the previous Liberation declarations are still being announced."
chaosx.scenarios.launch_status.independence_wave.transaction_busy: "Unavailable: another wave of Liberation declarations is already in progress."
chaosx.scenarios.launch_status.independence_wave.ready: "Ready: every viable independence movement with a distinct homeland will attempt to establish a state. Movements without safe territory will be listed separately."

chaosx.triggerable_scenarios.80.t: "Every Banner Rises"
chaosx.triggerable_scenarios.80.d: "[GetIndependenceWaveScenarioSummaryOutcome]\nOutcome: [GetIndependenceWaveScenarioCommitStatus]\n\nCountries released: [?global.independence_wave_scenario_released_count|0]\nMovements turned away: [?global.independence_wave_scenario_bound_blocked_count|0]\nMovements without a safe homeland: [?global.independence_wave_scenario_disabled_unbound_count|0]\nFormer hosts protected: [?global.independence_wave_scenario_host_count|0]\nScenario type: [GetIndependenceWaveScenarioLastTypeName]\nIntensity: [GetIndependenceWaveScenarioLastIntensityName]\nLeague members: [?global.independence_wave_scenario_league_member_count|0]\nActive opening wars: [?global.independence_wave_scenario_active_war_count|0]\nTerritory: [GetIndependenceWaveScenarioTerritoryName]\nForces: [GetIndependenceWaveScenarioForceName]\n\nThe report names every movement turned away and explains why its homeland or political route was unavailable."
chaosx.triggerable_scenarios.80.a: "Review the declarations."
chaosx.triggerable_scenarios.81.t: "No Banner Rises"
chaosx.triggerable_scenarios.81.d: "The movements that were ready to declare independence stood down before any of them took power. No country was released, and the old borders hold.\n\n[GetIndependenceWaveScenarioFailureReason]"
chaosx.triggerable_scenarios.81.d_unfinished: "Several movements seized their homelands, but their new governments could not be completed. The declarations have stalled with the land already changing hands."
chaosx.triggerable_scenarios.81.a: "The old borders stand."
independence_wave_scenario_failure_reason_called_off: "Another wave of declarations or a world-ending crisis was already under way when the launch came due, so it was called off."
independence_wave_scenario_failure_reason_insufficient_pool: "No movement had both a government ready to rule and a homeland it could safely hold under the present borders."
independence_wave_scenario_failure_reason_invalid_scope: "One movement could no longer show which government, homeland or former ruler it answered to, and every declaration was withdrawn with it."
independence_wave_scenario_failure_reason_aligned_array_failure: "One homeland no longer matched the land promised to its government, and every declaration was withdrawn with it."
independence_wave_scenario_failure_reason_stale_plan: "Borders shifted while the declarations were being prepared, and the agreed settlement no longer held."
independence_wave_scenario_failure_reason_unsafe_instantiation: "One new government could not take the land promised to it, and every declaration was withdrawn with it."
independence_wave_scenario_failure_reason_protected_state_mismatch: "One former ruler would have been left without a protected heartland, and every declaration was withdrawn."
independence_wave_scenario_failure_reason_unknown: "The movements could not agree on a safe and coherent set of new states."
independence_wave_scenario_summary_outcome_committed: "The independence wave began. The chosen diplomatic and military order followed the first declarations."
