independence_wave_scenario_reject_living_tag: "Rejected because the assigned tag is already alive. This incident never overwrites a living country or the content that created it."
independence_wave_scenario_reject_package_unready: "Rejected because the proposed state lacks the institutions and opening defenses required for a safe release. It remains closed until its government and local defense are ready."
independence_wave_scenario_reject_mode_excluded: "Rejected because this movement cannot emerge directly in the chosen scenario."
independence_wave_scenario_reject_missing_anchor: "Rejected because no unique valid anchor survived the current ownership and map checks."
independence_wave_scenario_reject_state_reserved: "Rejected because its required homeland was already claimed by an earlier movement in this incident."
independence_wave_scenario_reject_reservation_group_taken: "Rejected because another movement already claimed the same mutually exclusive regional identity."
independence_wave_scenario_reject_event5_collision: "Rejected because Soviet Collapse reserved the same tag or state first during a joint Liberation incident."
independence_wave_scenario_reject_host_survival: "Rejected because releasing the anchor would leave a host without its protected surviving state."
independence_wave_scenario_reject_unsafe_instantiation: "Rejected because the final safety check could not prove that a new country could emerge without damaging the living world."
independence_wave_scenario_reject_invalid_scope: "Rejected because its country, anchor, or former-host scope was invalid when the plan was built."
independence_wave_scenario_reject_stale_plan: "Rejected because the release plan no longer owned the active transaction."
independence_wave_scenario_reject_aligned_array_failure: "Rejected because the country's homeland and political record no longer matched the territory prepared for it."
independence_wave_scenario_reject_insufficient_pool: "Rejected because no safe, complete independence movement remained for the requested wave."
independence_wave_scenario_reject_protected_state_mismatch: "Rejected because a host's protected remnant no longer matched the live ownership proof."
independence_wave_scenario_reject_package_already_selected: "Rejected because the same movement was already selected for this incident."
independence_wave_scenario_reject_unbound_current_map: "Disabled because the current map has no accepted homeland for this identity. The movement remains closed until a defensible homeland is available."
independence_wave_scenario_reject_unknown: "Rejected because the available evidence could not explain a safe release. The movement remains closed until a defensible reason is recorded."
