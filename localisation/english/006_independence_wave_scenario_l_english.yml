chaosx.scenarios.independence_wave.desc.sovereign_scatter: "The release planner attempts every researched, map-bound Event 6 package, protects one surviving state for each host, resolves anchor collisions, and commits all valid countries together. Every released country begins sovereign and outside any faction. Intensity changes territory, forces, institutions, and route pressure; it never reduces the candidate attempt set."
chaosx.scenarios.independence_wave.desc.common_congress: "The release planner attempts every researched, map-bound Event 6 package under the same host-survival and unique-anchor covenant. Valid countries enter the informal network and convene a common congress; higher intensities strengthen its charter and shared reserve. Blocked packages remain recorded with their rejection reasons."
chaosx.scenarios.independence_wave.desc.wars_of_separation: "Every viable Event 6 package is attempted in one frozen plan. After release, every country that can lawfully confront its surviving former host opens a separation war against that host. Countries without a valid declaration receive a regional threat mission instead."
chaosx.scenarios.independence_wave.desc.universal_former_hosts: "Every viable package is attempted. Each released country then faces at most one bounded conflict with its surviving former host; invalid host wars become regional threat missions. The planner still reserves host remnants and unique anchors before any ownership changes."
chaosx.scenarios.independence_wave.desc.universal_neighboring_releases: "Every viable package is attempted. Each released country may open one bounded war against a neighboring country created by this same incident. Targets are reserved once, preventing an unbounded all-against-all cascade."
chaosx.scenarios.independence_wave.desc.universal_nearby_nonleague: "Every viable package is attempted. Each released country may open one bounded war against a nearby independent state outside the Event 6 league and outside any faction. Targets are reserved once and distance-limited."
chaosx.scenarios.independence_wave.desc.patron_worlds: "Every viable package is attempted. After the synchronized release, each country seeks one reachable major patron, preferring ideological affinity and regional proximity before global reach. Patron influence, aid, recognition, and capacity scale with intensity."
chaosx.scenarios.independence_wave.desc.great_partition: "Every viable package is attempted under the strictest anchor and host-remnant validation. The selected intensity's territory package advances by one tier, never beyond the accepted non-overlapping extension; released states also receive immediate border-settlement pressure, stronger host claims, and early access to researched regional ambitions and formable discovery."

chaosx.scenarios.independence_wave.impact.low: "All viable candidates are still attempted. Each valid release receives only its anchor, fragile local defense, scarce stocks, weak institutions, low recognition, and severe opening instability."
chaosx.scenarios.independence_wave.impact.medium: "All viable candidates are still attempted. Valid releases receive compact territory, viable militia and border formations, baseline institutions, and ordinary route access."
chaosx.scenarios.independence_wave.impact.high: "All viable candidates are still attempted. Valid releases receive extended territory where collisions permit, armed forces, stronger depots and officers, firmer institutions, faster league development, and accelerated ambitions."
chaosx.scenarios.independence_wave.impact.maximum: "All viable candidates are still attempted. Valid releases receive the strongest non-overlapping territory and force packages, rare support where their researched package permits it, high-chaos route access, early formable discovery, and aggressive AI pressure."

chaosx.scenarios.launch_status.independence_wave.world_end: "Unavailable: the world has already entered a terminal state."
chaosx.scenarios.launch_status.independence_wave.presentation_pending: "Unavailable: a synchronized Liberation incident is awaiting presentation."
chaosx.scenarios.launch_status.independence_wave.transaction_busy: "Unavailable: another Liberation release plan owns the transaction barrier."
chaosx.scenarios.launch_status.independence_wave.ready: "Ready: SCN-008 will rank and attempt all 149 current-map-bound registry packages. The 57 packages without unique current-map bindings remain disabled and will be reported separately."

