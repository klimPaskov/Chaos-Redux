chaosx.triggerable_scenarios.80.d: "[GetIndependenceWaveScenarioSummaryOutcome]\nOutcome: [GetIndependenceWaveScenarioFailureReason]\n\nCountries released: [?global.independence_wave_scenario_released_count|0]\nMovements turned away: [?global.independence_wave_scenario_bound_blocked_count|0]\nMovements without a safe homeland: [?global.independence_wave_scenario_disabled_unbound_count|0]\nFormer hosts protected: [?global.independence_wave_scenario_host_count|0]\nScenario type: [GetIndependenceWaveScenarioLastTypeName]\nIntensity: [GetIndependenceWaveScenarioLastIntensityName]\nLeague members: [?global.independence_wave_scenario_league_member_count|0]\nActive opening wars: [?global.independence_wave_scenario_active_war_count|0]\nTerritory: [GetIndependenceWaveScenarioTerritoryName]\nForces: [GetIndependenceWaveScenarioForceName]\n\nThe incident record preserves every movement that could not safely emerge and the reason its homeland or political route was unavailable."
