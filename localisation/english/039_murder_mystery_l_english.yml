MURDER_MYSTERY_FOREIGN_EMERGENCY_SUCCESSOR_NAME: "The Acting Successor"
MURDER_MYSTERY_FOREIGN_EMERGENCY_SUCCESSOR_DESC: "A verified emergency officeholder installed before the foreign leader's death is entered into the case ledger."
MURDER_MYSTERY_CELLS_WITHOUT_MASTERS_NAME: "The Cell Councils"
