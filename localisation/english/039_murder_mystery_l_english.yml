l_english:
chaosx.nr39.1.t: "Murder Mystery"

chaosx.nr39.2.t: "Our Country Leader has been assassinated!"
chaosx.nr39.2.d: "Under unknown circumstances our country leader has been assassinated. [From.GetLeader] has taken over. The mysterious villain has proved elusive as we are unable to uncover the details of the murder."
chaosx.nr39.2.a: "Protect the succession."

# Triggerable scenario presentation
chaosx.scenarios.assassin_network.name: "Assassin Network"
chaosx.scenarios.assassin_network.desc: "Begins the fictional Assassin Network crisis in an eligible government. The host suffers an opening succession shock and begins investigating a movement whose reach and cohesion grow with the selected intensity. Later discoveries may reveal threats beyond the original murder, while uninvolved countries retain their existing leadership."
chaosx.scenarios.assassin_network.impact.low: "§RStarts Assassin Network immediately.§! Low intensity opens a compact investigation with low reach and no foreign cell seed."
chaosx.scenarios.assassin_network.impact.medium: "§RStarts Assassin Network immediately.§! Medium intensity opens a capable investigation with two foreign cells and a viable path toward the Murder Cult."
chaosx.scenarios.assassin_network.impact.high: "§RStarts Assassin Network immediately.§! High intensity opens a mature network with five cells and stronger Brotherhood cohesion, while later evolutions remain unavailable."
chaosx.scenarios.assassin_network.impact.maximum: "§RStarts Assassin Network immediately.§! Maximum intensity opens a wide network with eight cells, high reach, and a prepared path toward the territorial movement."
chaosx.scenarios.type.assassin_network: "Clandestine network"
chaosx.scenarios.entry.id.assassin_network: "#014"
chaosx.scenarios.launch_status.assassin_network.world_end: "Unavailable while a world-ending scenario is active."
chaosx.scenarios.launch_status.assassin_network.setup_in_progress: "Preparing the Assassin Network opening."
chaosx.scenarios.launch_status.assassin_network.already_launched: "Assassin Network is already active."
chaosx.scenarios.launch_status.assassin_network.unavailable: "No eligible country can currently host the Assassin Network succession crisis."

chaosx.news.44.t: "Murder Mystery"
chaosx.news.44.d: "The leader of [From.GetName], [From.GetLeader] has been assassinated under mysterious circumstances, sending shockwaves through the nation and the international community. Their beloved leader, known for his charisma and leadership, was targeted in a brazen attack that has left authorities scrambling for answers.\nDetails surrounding the assassination remain scarce, with speculation running rampant about the identity and motives of the assailant. As investigations intensify, conspiracy theories abound, fueling uncertainty and fear among the populace."
chaosx.news.44.a: "The assassination is disturbing."

# Event 039 reports and outcomes
chaosx.nr39.3.t: "The Empty Chair"
chaosx.nr39.3.d: "The first hours after the murder are a test of the state. The emergency successor has taken the oath, but every office knows that a second shock could turn a succession into a collapse. The case command must secure the government before it begins to chase shadows."
chaosx.nr39.3.a: "Hold the institutions together."
chaosx.nr39.3.b: "Put the security services in command."
chaosx.nr39.3.c: "Declare an emergency cordon."
chaosx.nr39.4.t: "Evidence Under Seal"
chaosx.nr39.4.d: "The scene has been secured and the first records have been copied. What remains is fragile: a witness statement, a route, a payment trail, or a fragment of correspondence that can survive both panic and deliberate destruction."
chaosx.nr39.4.a: "Preserve every trace."
chaosx.nr39.5.t: "A Thread Beyond the Border"
chaosx.nr39.5.d: "The case no longer ends at the edge of [From.GetName]. Contacts, routes, and coded messages point toward a wider network. The evidence is incomplete, but the investigation must now decide whether the foreign thread is a lead or a carefully planted lure."
chaosx.nr39.5.a: "Follow the network."
chaosx.nr39.6.t: "The Witness Is Gone"
chaosx.nr39.6.d: "A witness has disappeared before the case team could secure a full account. The loss does not prove the lead false, but it gives the killer time to alter routes and teaches the investigators that protection is part of the investigation."
chaosx.nr39.6.a: "Keep the case alive."
chaosx.nr39.7.t: "A Cell Exposed"
chaosx.nr39.7.d: "A safe house, courier route, or coded ledger has been exposed. The discovery may open the way to an arrest, yet a cornered cell can destroy evidence and strike at another office before it is dismantled."
chaosx.nr39.7.a: "Close the net carefully."
chaosx.nr39.8.t: "The Capture Window Closes"
chaosx.nr39.8.d: "The final operation has failed to secure the murderer. Some evidence survives, but the network has learned the shape of the trap. The next attempt will require better protection, more reliable intelligence, or a willingness to bait the target."
chaosx.nr39.8.a: "There will be another chance."
chaosx.nr39.20.t: "The Murderer in Custody"
chaosx.nr39.20.d: "The final operation has secured the central case. The first murder remains a wound in the national record, but the immediate network has been broken and the government can begin a permanent settlement without surrendering its institutions."
chaosx.nr39.20.a: "Seal the case."
chaosx.nr39.21.t: "A Partial Capture"
chaosx.nr39.21.d: "The operation has taken part of the network, not its center. The government has bought time and recovered useful evidence, while the surviving conspirators retreat behind new names and unfamiliar routes."
chaosx.nr39.21.a: "Rebuild the investigation."
chaosx.nr39.22.t: "The Assassin Escapes"
chaosx.nr39.22.d: "The target escaped the cordon, leaving behind enough evidence to prove that the threat is real and enough uncertainty to keep the case open. Every later protection decision will carry the memory of this failure."
chaosx.nr39.22.a: "Protect the next target."
chaosx.nr39.23.t: "A Movement Seeking Inheritance"
chaosx.nr39.23.d: "The surviving movement has offered a limited succession of its own. It is a dangerous compromise: one successor, one office, and one transfer of authority that must be publicly recognized before the old leadership can be removed."
chaosx.nr39.23.a: "Test the inheritance."
chaosx.nr39.24.t: "The Inheritance Is Settled"
chaosx.nr39.24.d: "The movement's proposed succession has been recognized, and the former office has been removed under the settlement. This narrow accord grants no pardon and leaves the wider movement subject to the same limits as before."
chaosx.nr39.24.a: "Keep the settlement narrow."
chaosx.nr39.25.t: "No Successor Can Be Recognized"
chaosx.nr39.25.d: "The proposed succession could not establish a credible chain of authority. No office was transferred, no claimant was removed, and the wider movement remains without a recognized successor."
chaosx.nr39.25.a: "Close the unproven file."
chaosx.nr39.26.t: "The Protected Office Survives"
chaosx.nr39.26.d: "A mature local cell has attempted a high-value operation against a protected office. The intended leader remains alive, but a staff officer is dead or an archive has been breached, and the surviving evidence has opened a secondary investigation into the network's local routes."
chaosx.nr39.26.a: "Secure the office and follow the route."
chaosx.nr39.27.t: "The High-Value Operation Is Exposed"
chaosx.nr39.27.d: "Security services have exposed a major operation before it reached its intended office. The cell has lost personnel, methods, and safe routes, while investigators have gained a clearer view of the foreign command behind it."
chaosx.nr39.27.a: "Turn the failure into evidence."
chaosx.nr39.30.t: "The Murder Cult"
chaosx.nr39.30.d: "The case has revealed more than a hidden killer. It has uncovered a doctrine that treats leadership as a vulnerability and murder as a method of organization. The cells remain limited in reach, but their purpose is no longer merely to hide."
chaosx.nr39.30.a: "Name the new danger."
chaosx.nr39.31.t: "The International Network"
chaosx.nr39.31.d: "The movement has crossed another threshold. Foreign cells now share methods, evidence, and supplies, while each local government must decide whether to dismantle its own thread or wait for the central case team."
chaosx.nr39.31.a: "Share the evidence."
chaosx.nr39.32.t: "The Hidden Hand Takes Territory"
chaosx.nr39.32.d: "The movement has attempted a transactional break from [From.GetName]. It claims to reject the old state while keeping enough of its offices, depots, and trained cadres to survive. The new country will be judged by whether its territory and institutions can actually function."
chaosx.nr39.32.a: "The state has become the suspect."
chaosx.nr39.33.t: "A Foreign Revolt"
chaosx.nr39.33.d: "A foreign cell has attempted to become a territorial movement. Its success depends on more than surprise: the revolt needs a capital, a supply line, an administration, and a population that can survive the first counterattack."
chaosx.nr39.33.a: "Watch the borders."
chaosx.nr39.34.t: "The Command Settlement"
chaosx.nr39.34.d: "The movement has reached the point where its contradiction can no longer be hidden. Someone must coordinate the cells, protect the surviving leaders, and decide whether the campaign is ready to challenge every remaining government."
chaosx.nr39.34.a: "Prepare the final command."
chaosx.nr39.40.t: "The Hidden Hand Becomes a State"
chaosx.nr39.40.d: "The suspected murderer has appeared as the leader of [murder_mystery_assassin_state.GetName], an organized territorial movement carved from [This.GetName]. Disciplined cadres hold a real frontier, foreign cells answer to the new state, and open war has made the old uncertainty impossible to maintain. The movement still insists that leadership is the crime; it has simply given the crime a government."
chaosx.nr39.40.a: "Keep faith with the surviving government."
chaosx.nr39.40.b: "Take command of the Assassin State."
chaosx.nr39.50.t: "World of Anarchy"
chaosx.nr39.50.d: "The Assassin movement has declared organized leadership itself to be the target. Its command has begun a coordinated campaign across governments, cells, and subjects, while every order carries the contradiction that someone still had to give it. The world has not yet fallen, but its offices are now the battlefield."
chaosx.nr39.50.a: "Someone gave the order."
chaosx.nr39.60.t: "The Network Breaks"
chaosx.nr39.60.d: "The movement reached across borders and offices before its command finally broke. The restoration that follows is not clean: records are missing, survivors remember different orders, and every returning institution must prove that it is not merely wearing the old mask."
chaosx.nr39.60.a: "Rebuild under watch."
chaosx.nr39.61.t: "The Assassin State Is Defeated"
chaosx.nr39.61.d: "The central movement has lost its territory and its command. Its defeat does not erase the cells, compromises, or offices left behind, but it gives the remaining governments a chance to settle the crisis before the network finds another center."
chaosx.nr39.61.a: "Secure the surviving governments."
chaosx.nr39.62.t: "The Offices Reopen"
chaosx.nr39.62.d: "Successor administrations have been installed where the war left empty offices. The settlements preserve the people and institutions that can still govern, while the surviving records remain under protection until the wider investigation is complete."
chaosx.nr39.62.a: "Let the institutions work."

# Event 039 news
chaosx.news.4401.t: "A Leader Murdered in [From.GetName]"
chaosx.news.4401.d: "The national leader of [From.GetName] has been assassinated, and an emergency successor has taken the oath while investigators search for a motive. No group has claimed responsibility. The government has opened a case whose first task is to keep the empty chair from becoming a second crisis."
chaosx.news.4401.a: "The world is watching."
chaosx.news.4402.t: "The Murderer Is Captured"
chaosx.news.4402.d: "After a sustained investigation, authorities in [From.GetName] have captured the central figure in the murder case. The operation recovered evidence and broke the immediate network, though the motive and the full reach of the conspiracy remain subjects of public debate."
chaosx.news.4402.a: "The case has a prisoner."
chaosx.news.4403.t: "The Assassin State Appears"
chaosx.news.4403.d: "An organized movement calling itself the Assassin State has emerged from the crisis in [From.GetName]. It holds territory, fields disciplined cadres, and claims to oppose leadership while appointing its own command. The original government now faces an open war against the network it once tried to investigate."
chaosx.news.4403.a: "The contradiction is visible."
chaosx.news.4404.t: "A Foreign Cell Rises"
chaosx.news.4404.d: "A foreign cell linked to the Assassin movement has seized enough territory to declare a local administration. The revolt is small, but its survival would give the network a second frontier and force another government to fight a war that began as an investigation."
chaosx.news.4404.a: "Another chair is under threat."
chaosx.news.4405.t: "The Assassin State Is Broken"
chaosx.news.4405.d: "The Assassin State has been defeated after a campaign that reached beyond its original frontier. Governments are reopening offices and securing records, but surviving cells and compromised institutions ensure that the aftermath will be a settlement rather than a return to yesterday."
chaosx.news.4405.a: "Victory needs a ledger."
chaosx.news.4406.t: "A Second Leader Is Murdered"
chaosx.news.4406.d: "A mature cell linked to the Assassin movement has murdered the national leader of [From.GetName]. A verified emergency successor has assumed the office, but the attack has transformed a foreign investigation into an international crisis and proved that the network can reach protected governments beyond its first frontier."
chaosx.news.4406.a: "The network has crossed another border."

# Event 039 world-end and event-log presentation
murder_mystery_world_end_name: "World of Anarchy"
chaosx.events_log.world_end.murder_mystery_world_of_anarchy.title: "World of Anarchy"
chaosx.events_log.world_end.murder_mystery_world_of_anarchy.details: "The Assassin movement has opened a global campaign against organized leadership. Campaign sectors, protected offices, successor administrations, and the movement's own command contradiction now determine whether the world is dismantled, restored, or forced into a new political settlement."

# Event 039 super-events
chaosx_super_event.111.t: "The Hidden Hand Becomes a State"
chaosx_super_event.111.q: "Uneasy lies the head that wears a crown. — William Shakespeare, Henry IV, Part 2"
chaosx_super_event.111.a: "An empty chair has gained a flag."
chaosx_super_event.111.d: "The suspected murderer has appeared as the leader of an organized territorial movement inside [From.GetName]. Disciplined cadres hold a frontier, foreign cells answer to the new state, and the investigation has become an open war. The movement still calls leadership a crime, yet its territory has produced a command."
chaosx_super_event.112.t: "World of Anarchy"
chaosx_super_event.112.q: "The terrorist and the policeman both come from the same basket. — Joseph Conrad, The Secret Agent"
chaosx_super_event.112.a: "Someone gave the order."
chaosx_super_event.112.d: "The Assassin movement has declared organized leadership itself to be the target and begun a coordinated campaign across governments, cells, and subjects. The world has not yet fallen, but its offices are now the battlefield and every movement order exposes the contradiction at its center."
chaosx_super_event.113.t: "The Network Breaks"
chaosx_super_event.113.q: "Revenge is a kind of wild justice; which the more man's nature runs to, the more ought law to weed it out. — Francis Bacon, Of Revenge"
chaosx_super_event.113.a: "Rebuild under watch."
chaosx_super_event.113.d: "The movement reached across borders and offices before its command finally broke. Captured archives, guarded survivors, and returning institutions now shape a costly restoration. The network is defeated, but its records and methods remain a warning against mistaking silence for repair."

# Fictional Event 039 movement characters and route leaders
