murder_mystery_first_knife_desc: "The concealed founder of the movement, known only through a chain of orders and witnesses."
murder_mystery_hidden_hand_route_leader: "The Directorate"
murder_mystery_hidden_hand_route_leader_desc: "A disciplined central command that turns cells into a territorial instrument."
murder_mystery_cells_without_masters_route_leader: "The Cell Councils"
murder_mystery_cells_without_masters_route_leader_desc: "A federation of local voices that refuses to place one chair above the others."
