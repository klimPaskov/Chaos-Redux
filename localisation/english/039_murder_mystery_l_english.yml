murder_mystery_cells_without_masters_route_leader: "The Cell Councils"
murder_mystery_cells_without_masters_route_leader_desc: "A federation of local voices that refuses to place one chair above the others."
murder_mystery_necessary_mask_route_leader: "The Necessary Administrator"
murder_mystery_necessary_mask_route_leader_desc: "A pragmatic steward who treats government as a temporary tool."
murder_mystery_shadow_commander: "Elias Varn"
murder_mystery_silent_guard_commander: "Mira Dast"
