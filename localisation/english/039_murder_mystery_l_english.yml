murder_mystery_incident_role_intelligence: "An intelligence officer who ran the informant network"
murder_mystery_incident_role_unknown: "A government official"
chaosx.nr39.20.t: "The Murderer in Custody"
chaosx.nr39.20.d: "The final operation has secured the central case. The first murder remains a wound in the national record, but the immediate network has been broken and the government can begin a permanent settlement without surrendering its institutions."
chaosx.nr39.20.a: "Seal the case."
chaosx.nr39.21.t: "A Partial Capture"
chaosx.nr39.21.d: "The operation has taken part of the network, not its center. The government has bought time and recovered useful evidence, while the surviving conspirators retreat behind new names and unfamiliar routes."
chaosx.nr39.21.a: "Rebuild the investigation."
chaosx.nr39.22.t: "The Assassin Escapes"
chaosx.nr39.22.d: "The target escaped the cordon, leaving behind enough evidence to prove that the threat is real and enough uncertainty to keep the case open. Every later protection decision will carry the memory of this failure."
chaosx.nr39.22.a: "Protect the next target."
chaosx.nr39.23.t: "The Movement Seeks a New Center"
chaosx.nr39.23.d: "With its center broken, the movement's surviving commanders are testing who can still hold the network together. A foreign revolt may claim the command, mature cells may go underground, or the network may finally come apart."
chaosx.nr39.23.a: "Watch who answers."
chaosx.nr39.24.t: "A New Center Rises"
chaosx.nr39.24.d: "[murder_mystery_assassin_state.GetName] has taken command of the movement. It holds the central network and the loyalty of the revolts that stayed with it, though the change of command has cost it cohesion and reach. The revolts that refused it now fight alone."
chaosx.nr39.24.a: "The war is not over."
chaosx.nr39.25.t: "The Network Goes Underground"
chaosx.nr39.25.d: "No territorial successor can hold the movement together, but its mature cells survive. Without a center they keep recruiting, hiding and killing on their own, and the case stays open until every one of them is dismantled."
chaosx.nr39.25.a: "Hunt the remaining cells."
chaosx.nr39.26.t: "The Protected Office Survives"
chaosx.nr39.26.d: "A mature local cell has attempted a high-value operation against a protected office. The intended leader remains alive, but a staff officer is dead or an archive has been breached, and the surviving evidence has opened a secondary investigation into the network's local routes."
chaosx.nr39.26.a: "Secure the office and follow the route."
chaosx.nr39.27.t: "The High-Value Operation Is Exposed"
chaosx.nr39.27.d: "Security services have exposed a major operation before it reached its intended office. The cell has lost personnel, methods, and safe routes, while investigators have gained a clearer view of the foreign command behind it."
chaosx.nr39.27.a: "Turn the failure into evidence."
chaosx.nr39.30.t: "The Murder Cult"
chaosx.nr39.30.d: "The case has revealed more than a hidden killer. It has uncovered a doctrine that treats leadership as a vulnerability and murder as a method of organization. The cells remain limited in reach, but their purpose is no longer merely to hide."
chaosx.nr39.30.a: "Name the new danger."
chaosx.nr39.31.t: "The International Network"
chaosx.nr39.31.d: "The movement has crossed another threshold. Foreign cells now share methods, evidence, and supplies, while each local government must decide whether to dismantle its own thread or wait for the central case team."
chaosx.nr39.31.a: "Share the evidence."
chaosx.nr39.32.t: "The Hidden Hand Takes Territory"
chaosx.nr39.32.d: "The movement has attempted a calculated break from [From.GetName]. It claims to reject the old state while keeping enough of its offices, depots, and trained cadres to survive. The new country will be judged by whether its territory and institutions can actually function."
chaosx.nr39.32.a: "The state has become the suspect."
chaosx.nr39.33.t: "A Foreign Revolt"
chaosx.nr39.33.d: "A foreign cell has attempted to become a territorial movement. Its success depends on more than surprise: the revolt needs a capital, a supply line, an administration, and a population that can survive the first counterattack."
chaosx.nr39.33.a: "Watch the borders."
chaosx.nr39.34.t: "The Command Settlement"
chaosx.nr39.34.d: "The movement has reached the point where its contradiction can no longer be hidden. Someone must coordinate the cells, protect the surviving leaders, and decide whether the campaign is ready to challenge every remaining government."
chaosx.nr39.34.a: "Prepare the final command."
chaosx.nr39.40.t: "The Hidden Hand Becomes a State"
chaosx.nr39.40.d: "The suspected murderer has appeared as the leader of [murder_mystery_assassin_state.GetName], an organized territorial movement carved from [This.GetName]. Disciplined cadres hold a real frontier, foreign cells answer to the new state, and open war has made the old uncertainty impossible to maintain. The movement still insists that leadership is the crime; it has simply given the crime a government."
chaosx.nr39.40.a: "Keep faith with the surviving government."
chaosx.nr39.40.b: "Take command of the Assassin State."
chaosx.nr39.50.t: "World of Anarchy"
chaosx.nr39.50.d: "The Assassin movement has declared organized leadership itself to be the target. Its command has begun a coordinated campaign across governments, cells, and subjects, while every order carries the contradiction that someone still had to give it. The world has not yet fallen, but its offices are now the battlefield."
chaosx.nr39.50.a: "Someone gave the order."
chaosx.nr39.60.t: "The Last Chair Empties"
chaosx.nr39.60.d: "No ordinary government remains outside our reach. The last cabinets have fled, surrendered or been replaced by administrations that answer to the movement, and the war that began with one murder has emptied every chair it set out to empty.\n\nThe cells cheer the end of rulers. The officers who planned the campaign are already asking who will rule now."
chaosx.nr39.60.a: "Now we must keep our promise."
chaosx.nr39.61.t: "The Assassin State Is Defeated"
chaosx.nr39.61.d: "The central movement has lost its territory and its command. Its defeat does not erase the cells, compromises, or offices left behind, but it gives the remaining governments a chance to settle the crisis before the network finds another center."
chaosx.nr39.61.a: "Secure the surviving governments."
chaosx.nr39.61.d_local: "The central movement has lost its territory and its command. The war was short and the movement never grew beyond a few provinces and cells, so the governments that defeated it face a police task rather than a world to rebuild: hunting the last cadres, reopening offices, and deciding which compromises to forgive."
chaosx.nr39.62.t: "The Offices Reopen"
chaosx.nr39.62.d: "With the movement broken, governments are reopening the offices it emptied. Surviving records stay under protection while the last remnants are hunted down, and every returning official must prove that the old mask is gone."
chaosx.nr39.62.a: "Let the institutions work."
chaosx.nr39.66.t: "The Command Promise"
chaosx.nr39.66.d: "Throughout the war the movement promised that its command was temporary: that once the last government fell, the council would dissolve and the cells would govern themselves. The war is over. The cadres, the subjects and the conquered cities are waiting to see what that promise was worth."
chaosx.nr39.66.a: "The command stays hidden, and the world answers to it."
chaosx.nr39.66.b: "The councils dissolve into the cells, as promised."
chaosx.nr39.66.c: "The temporary state is not ready to dissolve."
chaosx.nr39.66.e: "Keep strategic command, give local rule away."
chaosx.nr39.67.t: "The Convoy Never Arrived"
chaosx.nr39.67.d: "The investigators and vehicles we sent to [murder_mystery_supported_partner.GetNameDef] were stopped on the road. The movement knew the route, the departure time and the names on the manifest. Our partner gets nothing, and our own investigators now know they are being watched."
chaosx.nr39.67.a: "Someone talked."
chaosx.nr39.65.t: "[murder_mystery_terminal_choice.GetName] Has Fallen"
chaosx.nr39.65.d: "[murder_mystery_terminal_choice.GetNameDefCap] can no longer resist the campaign. Its ministries are emptied, its army is broken or surrendered, and its people wait to learn who will give the orders now.\n\nThe movement promised a world without rulers. Here, as everywhere, somebody must still decide who keeps the archives, pays the police and feeds the cities."
chaosx.nr39.65.a: "It will answer to us through an acting cabinet."
chaosx.nr39.65.b: "Its cells will govern it themselves."
chaosx.nr39.65.c: "We take the capital and the factories."
chaosx.nr39.63.t: "The Government Falls"
chaosx.nr39.63.d: "[murder_mystery_fallen_host.GetName] has fallen to [murder_mystery_assassin_state.GetName]. The movement that began with one murder now holds the field against the government that tried to investigate it, and its cadres are moving into ministries, depots and police stations that answered to the old state a week ago."
chaosx.nr39.63.a: "Keep resisting from what remains."
chaosx.nr39.63.b: "The old government is finished."
murder_mystery_evolution_v_committed_tt: "The movement has reached Evolution V, A World Without Leaders."

# Event 039 news
chaosx.news.4401.t: "A Leader Murdered in [From.GetName]"
chaosx.news.4401.d: "The national leader of [From.GetName] has been assassinated, and an emergency government has taken office while investigators search for a motive. No group has claimed responsibility. The government has opened a case whose first task is to keep the empty chair from becoming a second crisis."
chaosx.news.4401.a: "The world is watching."
chaosx.news.4402.t: "The Murderer Is Captured"
chaosx.news.4402.d: "After a sustained investigation, authorities in [From.GetName] have captured the central figure in the murder case. The operation recovered evidence and broke the immediate network, though the motive and the full reach of the conspiracy remain subjects of public debate."
chaosx.news.4402.a: "The case has a prisoner."
chaosx.news.4403.t: "The Assassin State Appears"
chaosx.news.4403.d: "An organized movement calling itself the Assassin State has emerged from the crisis in [From.GetName]. It holds territory, fields disciplined cadres, and claims to oppose leadership while appointing its own command. The original government now faces an open war against the network it once tried to investigate."
chaosx.news.4403.a: "The contradiction is visible."
chaosx.news.4404.t: "A Foreign Cell Rises"
chaosx.news.4404.d: "A foreign cell linked to the Assassin movement has seized enough territory to declare a local administration. The revolt is small, but its survival would give the network a second frontier and force another government to fight a war that began as an investigation."
chaosx.news.4404.a: "Another chair is under threat."
chaosx.news.4405.t: "The Assassin State Is Broken"
chaosx.news.4405.d: "The Assassin State has been defeated after a campaign that reached beyond its original frontier. Governments are reopening offices and securing records, but surviving cells and compromised institutions ensure that the aftermath will be a settlement rather than a return to yesterday."
chaosx.news.4405.a: "Now count what it cost."
chaosx.news.4406.t: "A Second Leader Is Murdered"
chaosx.news.4406.d: "A mature cell linked to the Assassin movement has murdered the national leader of [From.GetName]. An acting cabinet has taken over the government, but the attack has transformed a foreign investigation into an international crisis and proved that the network can reach protected governments beyond its first frontier."
chaosx.news.4406.a: "The network has crossed another border."

# Event 039 world-end and event-log presentation
murder_mystery_world_end_name: "World of Anarchy"
chaosx.events_log.world_end.murder_mystery_world_of_anarchy.title: "World of Anarchy"
chaosx.events_log.world_end.murder_mystery_world_of_anarchy.details: "The Assassin movement has opened a global campaign against organized leadership. Campaign sectors, protected offices, successor administrations, and the movement's own command contradiction now determine whether the world is dismantled, restored, or forced into a new political settlement."

# Event 039 super-events
chaosx_super_event.111.t: "The Hidden Hand Becomes a State"
chaosx_super_event.111.q: "Uneasy lies the head that wears a crown.\n§Y-William Shakespeare, Henry IV, Part 2-§!"
chaosx_super_event.111.a: "An empty chair has gained a flag."
chaosx_super_event.111.d: "The suspected murderer has appeared as the leader of an organized territorial movement inside [From.GetName]. Disciplined cadres hold a frontier, foreign cells answer to the new state, and the investigation has become an open war. The movement still calls leadership a crime, and its territory now has a commander."
chaosx_super_event.112.t: "World of Anarchy"
chaosx_super_event.112.q: "The terrorist and the policeman both come from the same basket.\n§Y-Joseph Conrad, The Secret Agent-§!"
chaosx_super_event.112.a: "Someone gave the order."
chaosx_super_event.112.d: "The Assassin movement has declared organized leadership itself its target and opened a coordinated campaign against governments, rival cells, and subject states. Every office in the world is now a battlefield, and every order the movement gives contradicts what it preaches."
chaosx_super_event.113.t: "The Network Breaks"
chaosx_super_event.113.q: "Revenge is a kind of wild justice; which the more man's nature runs to, the more ought law to weed it out.\n§Y-Francis Bacon, Of Revenge-§!"
chaosx_super_event.113.a: "Rebuild under watch."
chaosx_super_event.113.d: "The movement's command has finally broken after years of reaching across borders and into government offices. Captured archives, guarded survivors, and returning institutions now shape a costly restoration. The network is beaten, and its records and methods remain as a lesson that silence is not repair."

