MURDER_MYSTERY_CELLS_WITHOUT_MASTERS_SUCCESSOR_NAME: "The Council Successor"
MURDER_MYSTERY_CELLS_WITHOUT_MASTERS_SUCCESSOR_DESC: "A successor chosen to keep local councils aligned without restoring a single master."
MURDER_MYSTERY_NECESSARY_MASK_SUCCESSOR_NAME: "The Necessary Administrator"
MURDER_MYSTERY_NECESSARY_MASK_SUCCESSOR_DESC: "A successor who accepts the temporary office required to keep a pragmatic movement alive."

