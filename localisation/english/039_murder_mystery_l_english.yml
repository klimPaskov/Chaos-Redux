l_english:
chaosx.nr39.1.t: "Murder Mystery"
murder_mystery_ruling_selection_anchor: "National leadership"
murder_mystery_ruling_selection_anchor_desc: "The sitting head of government."

chaosx.nr39.2.t: "The Head of Government Is Dead"
chaosx.nr39.2.d: "The head of government of [ROOT.GetNameDef] has been shot dead on the way to a cabinet meeting. [ROOT.GetLeader] has taken charge of the government. The killer escaped, the police have no name, and every office in the capital is asking whether the murder was the end of something or the beginning."
chaosx.nr39.2.a: "Protect the succession."

# Triggerable scenario presentation
chaosx.scenarios.assassin_network.name: "Assassin Network"
chaosx.scenarios.assassin_network.desc: "A murder shakes the succession of an eligible government and opens an investigation into a hidden movement. Higher intensity gives it more reach and cohesion, and later discoveries may reveal threats beyond the first killing."

chaosx.scenarios.assassin_network.impact.low: "§RStarts Assassin Network immediately.§! Low intensity opens a Murder Cult investigation with low reach and a small foreign network. No Assassin State exists at launch."
chaosx.scenarios.assassin_network.impact.medium: "§RStarts Assassin Network immediately.§! Medium intensity opens a mature international network and a stronger investigation. The host can still prevent the Assassin State split."
chaosx.scenarios.assassin_network.impact.high: "§RStarts Assassin Network immediately.§! High intensity opens the Assassin State war and a strong foreign network."
chaosx.scenarios.assassin_network.impact.maximum: "§RStarts Assassin Network immediately.§! Maximum intensity opens Evolution IV, the Assassin State war, and foreign operations. World of Anarchy still needs its usual end conditions."
chaosx.scenarios.type.assassin_network: "Hidden Network"
chaosx.scenarios.entry.id.assassin_network: "#019"
chaosx.scenarios.launch_status.assassin_network.world_end: "Unavailable while a world-ending scenario is active."
chaosx.scenarios.launch_status.assassin_network.setup_in_progress: "Preparing the Assassin Network opening."
chaosx.scenarios.launch_status.assassin_network.already_launched: "Assassin Network is already active."
chaosx.scenarios.launch_status.assassin_network.resolved: "The Assassin Network crisis has concluded."
chaosx.scenarios.launch_status.assassin_network.unavailable: "No eligible country can currently host the Assassin Network succession crisis."

# Events Log availability
chaosx.events_log.events.na_reason.murder_mystery_active: "\n§RUnavailable: the Murder Mystery investigation is already under way.§!"
chaosx.events_log.events.na_reason.murder_mystery_resolved: "\n§RUnavailable: the Murder Mystery case has been closed.§!"
chaosx.events_log.events.na_reason.murder_mystery_world_end: "\n§RUnavailable: the world has ended.§!"
chaosx.events_log.events.na_reason.murder_mystery_host: "\n§RUnavailable: no major power or player government has a sitting leader and enough territory to host the murder.§!"

# Event 039 reports and outcomes
chaosx.nr39.3.t: "The Empty Chair"
chaosx.nr39.3.d: "The first hours after the murder are a test of the state. The emergency government has taken office, but every office knows that a second shock could turn a succession into a collapse. The case command must secure the government before it begins to chase shadows."
chaosx.nr39.3.a: "Hold the institutions together."
chaosx.nr39.3.b: "Put the security services in command."
chaosx.nr39.3.c: "Declare an emergency cordon."
chaosx.nr39.4.t: "Evidence Under Seal"
chaosx.nr39.4.d: "The scene has been secured and the first records have been copied. What remains is fragile: a witness statement, a route, a payment trail, or a fragment of correspondence that can survive both panic and deliberate destruction."
chaosx.nr39.4.a: "Preserve every trace."
chaosx.nr39.5.t: "A Thread Beyond the Border"
chaosx.nr39.5.d: "The case no longer ends at the edge of [From.GetName]. Contacts, routes, and coded messages point toward a wider network. The evidence is incomplete, but the investigation must now decide whether the foreign thread is a lead or a carefully planted lure."
chaosx.nr39.5.a: "Follow the network."
chaosx.nr39.6.t: "The Witness Is Gone"
chaosx.nr39.6.d: "A witness has disappeared before the case team could secure a full account. The loss does not prove the lead false, but it gives the killer time to alter routes and teaches the investigators that protection is part of the investigation."
chaosx.nr39.6.a: "Keep the case alive."
chaosx.nr39.7.t: "A Cell Exposed"
chaosx.nr39.7.d: "A safe house, courier route, or coded notebook has been exposed. The discovery may open the way to an arrest, yet a cornered cell can destroy evidence and strike at another office before it is dismantled."
chaosx.nr39.7.a: "Close the net carefully."
chaosx.nr39.8.t: "The Capture Window Closes"
chaosx.nr39.8.d: "The final operation has failed to secure the murderer. Some evidence survives, but the network has learned the shape of the trap. The next attempt will require better protection, more reliable intelligence, or a willingness to bait the target."
chaosx.nr39.8.a: "There will be another chance."
chaosx.nr39.9.t: "Another Office Falls"
chaosx.nr39.9.d: "[ROOT.GetMurderMysteryIncidentRole] has been killed. The method matches the earlier murders closely enough that no investigator believes in coincidence, and every office that handled the case is now asking who will be next."
chaosx.nr39.9.a: "Bury our dead and keep working."
chaosx.nr39.10.t: "The Local Cell Is Broken"
chaosx.nr39.10.d: "Our security services have broken the cell the movement planted in [ROOT.GetNameDef]. Its safe houses are closed and its couriers are in custody. The people who recruited them are still out there, and the network will look elsewhere for a foothold."
chaosx.nr39.10.a: "Keep the borders watched."
chaosx.nr39.11.t: "An Attack Is Stopped"
chaosx.nr39.11.d: "The movement tried to kill again, and this time the protection held. The attacker was taken alive, and the first interrogation has already given investigators new names and a safe house to watch."
chaosx.nr39.11.a: "The protection works."
