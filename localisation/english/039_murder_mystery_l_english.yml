# Shared categories, focus navigation, and action tooltips
murder_mystery_investigation_category: "Murder Mystery Investigation"
murder_mystery_investigation_category_desc: "Secure the succession, preserve evidence, map the network, protect likely targets, break cells, and conduct the final operation."
murder_mystery_foreign_cell_investigation_category: "Foreign Cell Investigations"
murder_mystery_foreign_cell_investigation_category_desc: "Share evidence across borders, trace foreign routes, and dismantle clandestine cells before they become territorial movements."
murder_mystery_brotherhood_operations_category: "Brotherhood Operations"
murder_mystery_brotherhood_operations_category_desc: "Direct the Assassin movement's cells, supplies, raids, command settlement, and territorial preparations."
murder_mystery_cell_administration_category: "Cell Administration"
murder_mystery_cell_administration_category_desc: "Maintain local cadres, protect revolt capitals, negotiate settlements, and keep derivative administrations viable."
murder_mystery_world_without_leaders_category: "World Without Leaders"
murder_mystery_world_without_leaders_category_desc: "Prepare the movement's campaign sectors and decide whether its command contradiction can survive the final war."
murder_mystery_action_commitment_tt: "The case team will commit resources to this action. Its result will depend on the current evidence, protection, intelligence, and killer adaptation."
murder_mystery_assassin_state_prepare_tt: "Prepare the territorial separation without altering the host government until every transfer is ready."
murder_mystery_assassin_state_commit_tt: "Proclaim the Assassin State if its territory, capital, population, supply, forces, and successor administration all remain viable."
murder_mystery_cell_selection_tt: "Select one established foreign route. A protected or immune country cannot be selected."
murder_mystery_evolution_commitment_tt: "Commit the next evolution only when its readiness threshold and dynamic pacing checks are satisfied."
murder_mystery_mission_success_tt: "Completing this mission improves the current phase and records the action in the case ledger."
murder_mystery_mission_timeout_tt: "The deadline has passed. The case records a setback and the network adapts to the lost opportunity."
murder_mystery_mission_cancelled_tt: "The mission is cancelled without deleting a character or leaving an active case target behind."
murder_mystery_terminal_operation_tt: "This operation advances one campaign sector and can change its protected offices, supply lines, and successor administration."
murder_mystery_terminal_sector_tt: "This sector is part of the World of Anarchy campaign."
murder_mystery_terminal_settlement_tt: "A viable settlement preserves the institutions and characters that can still govern."
murder_mystery_terminal_victory_tt: "Final victory ends the campaign while preserving the surviving administrations."

# Government and movement decisions
murder_mystery_establish_case_command: "Establish the Case Command"
murder_mystery_establish_case_command_desc: "Bring the succession, evidence, and protection offices under one accountable case command."
murder_mystery_secure_government_quarter: "Secure the Government Quarter"
murder_mystery_secure_government_quarter_desc: "Protect the emergency successor and the offices that keep the government functioning."
murder_mystery_preserve_first_evidence: "Preserve the First Evidence"
murder_mystery_preserve_first_evidence_desc: "Seal the scene, copy the records, and keep the first lead from disappearing."
murder_mystery_commit_case_team: "Commit the Case Team"
murder_mystery_commit_case_team_desc: "Assign investigators, communications officers, and analysts to the murder case."
murder_mystery_audit_communications: "Audit Communications"
murder_mystery_audit_communications_desc: "Compare messages, call routes, and dead drops for a pattern that survives the false leads."
murder_mystery_trace_movement_logistics: "Trace Movement Logistics"
murder_mystery_trace_movement_logistics_desc: "Follow the money, transport, and supply routes that connect the local incident to the wider network."
murder_mystery_protect_witnesses: "Protect Witnesses"
murder_mystery_protect_witnesses_desc: "Move witnesses through guarded routes and preserve their testimony before the network can reach them."
murder_mystery_choose_protection_priority: "Choose a Protection Priority"
murder_mystery_choose_protection_priority_desc: "Give one exposed office priority protection while the case team covers the remaining institutions."
murder_mystery_replace_compromised_office: "Replace a Compromised Office"
murder_mystery_replace_compromised_office_desc: "Remove a compromised official from the investigation without endangering a protected witness or recognized successor."
murder_mystery_raid_identified_cell: "Raid an Identified Cell"
murder_mystery_raid_identified_cell_desc: "Strike a mapped safe house or route while its evidence and witnesses can still be recovered."
murder_mystery_prepare_final_operation: "Prepare the Final Operation"
murder_mystery_prepare_final_operation_desc: "Assemble the evidence, protection, and resources required to close the central case."
murder_mystery_silent_arrest: "Silent Arrest"
murder_mystery_silent_arrest_desc: "Use a narrow arrest operation built around a verified target and a quiet cordon."
murder_mystery_coordinated_raids: "Coordinated Raids"
murder_mystery_coordinated_raids_desc: "Hit several linked locations at once before the network can warn its remaining cells."
murder_mystery_baited_target: "Baited Target"
murder_mystery_baited_target_desc: "Offer the movement a controlled opportunity and close the trap when it commits an operative."
murder_mystery_foreign_interception: "Foreign Interception"
murder_mystery_foreign_interception_desc: "Use liaison channels to intercept the movement beyond the original border."
murder_mystery_commit_next_evolution: "Commit the Next Evolution"
murder_mystery_commit_next_evolution_desc: "Let the case change shape only after its threshold and readiness conditions are met."
murder_mystery_prepare_assassin_state: "Prepare a Territorial Break"
murder_mystery_prepare_assassin_state_desc: "Survey a compact territory, capital, supply line, and cadre package for a viable new state."
murder_mystery_commit_assassin_state: "Commit the Assassin State"
murder_mystery_commit_assassin_state_desc: "Open the transactional war only when both the movement and the remnant can survive the split."
murder_mystery_join_evidence_exchange: "Join the Evidence Exchange"
murder_mystery_join_evidence_exchange_desc: "Share a useful case file with another government without surrendering control of the local investigation."
murder_mystery_request_original_case_file: "Request the Original Case File"
murder_mystery_request_original_case_file_desc: "Ask the original host for the evidence that first mapped the movement."
murder_mystery_harden_target_group: "Harden a Target Group"
murder_mystery_harden_target_group_desc: "Protect a leader, commander, cabinet, intelligence office, judiciary, or investigator group."
murder_mystery_interdict_known_route: "Interdict a Known Route"
murder_mystery_interdict_known_route_desc: "Close one mapped border, port, rail, or convoy route before it can carry a cell or its supplies."
murder_mystery_dismantle_local_cell: "Dismantle a Local Cell"
murder_mystery_dismantle_local_cell_desc: "Break a local cell and close its case after the government has secured the evidence."
murder_mystery_select_foreign_cell: "Select a Foreign Cell"
murder_mystery_select_foreign_cell_desc: "Choose one concrete foreign route for investigation, support, or containment."
murder_mystery_reconcile_command_dispute: "Reconcile the Command Dispute"
murder_mystery_reconcile_command_dispute_desc: "Settle the contradiction between local initiative and a movement that still needs someone to coordinate it."
murder_mystery_supply_selected_cell: "Supply the Selected Cell"
murder_mystery_supply_selected_cell_desc: "Send a limited package of equipment and intelligence to one selected cell."
murder_mystery_order_high_value_operation: "Order a High-Value Operation"
murder_mystery_order_high_value_operation_desc: "Spend scarce reach and cadres on a short operation against a strategically important office or route."
murder_mystery_prepare_territorial_revolt: "Prepare a Territorial Revolt"
murder_mystery_prepare_territorial_revolt_desc: "Build the capital, supply, local government, and force package required for a defensible revolt."
murder_mystery_dispatch_shadow_company: "Dispatch a Shadow Company"
murder_mystery_dispatch_shadow_company_desc: "Move a mobile company to the selected sector for reconnaissance, raids, and short attacks."
murder_mystery_discipline_unauthorized_cell: "Discipline an Unauthorized Cell"
murder_mystery_discipline_unauthorized_cell_desc: "Cut off a cell that threatens the movement's command discipline or chosen strategy."
murder_mystery_create_derivative_cell: "Create a Derivative Administration"
murder_mystery_create_derivative_cell_desc: "Turn a prepared foreign cell into a viable local subject without exceeding the movement's capacity."
murder_mystery_complete_terminal_command_settlement: "Complete the Command Settlement"
murder_mystery_complete_terminal_command_settlement_desc: "Choose the command structure that will carry the movement into its final campaign."
murder_mystery_activate_world_of_anarchy: "Activate World of Anarchy"
murder_mystery_activate_world_of_anarchy_desc: "Open the final campaign once the Brotherhood has united its foreign cells and prepared every campaign sector."
murder_mystery_secure_revolt_capital: "Secure the Revolt Capital"
murder_mystery_secure_revolt_capital_desc: "Hold the local capital long enough to install a successor administration."
murder_mystery_raise_local_assassin_cadres: "Raise Local Assassin Cadres"
murder_mystery_raise_local_assassin_cadres_desc: "Recruit a limited force from the local population and route network."
murder_mystery_seize_depot_rail: "Seize a Depot or Rail Hub"
murder_mystery_seize_depot_rail_desc: "Capture one logistical node without outrunning the supply capacity of the new administration."
murder_mystery_request_central_support: "Request Central Support"
murder_mystery_request_central_support_desc: "Ask the central movement for a limited reinforcement or equipment package."
murder_mystery_integrate_local_cells: "Integrate Local Cells"
murder_mystery_integrate_local_cells_desc: "Bring several local cells into a single subject or compact while preserving their negotiated obligations."
murder_mystery_manage_captured_officials: "Manage Captured Officials"
murder_mystery_manage_captured_officials_desc: "Protect, release, or administer captured officials according to the settlement's guarantees."
murder_mystery_negotiate_local_settlement: "Negotiate a Local Settlement"
murder_mystery_negotiate_local_settlement_desc: "Trade autonomy, protection, and supplies for a stable local administration."
murder_mystery_synchronize_uprisings: "Synchronize the Uprisings"
murder_mystery_synchronize_uprisings_desc: "Coordinate campaign sectors so that one revolt does not exhaust the movement's supply."
murder_mystery_select_campaign_sector_two: "Select a Second Campaign Sector"
murder_mystery_select_campaign_sector_two_desc: "Open another sector after the first sector has a viable command and supply line."
murder_mystery_select_campaign_sector_three: "Select a Third Campaign Sector"
murder_mystery_select_campaign_sector_three_desc: "Extend the final campaign to a third sector only when the movement can sustain it."
murder_mystery_break_command_spine: "Break the Command Spine"
murder_mystery_break_command_spine_desc: "Disrupt the central coordination that holds the movement's apparently leaderless organization together."
murder_mystery_establish_successor_administration: "Establish a Successor Administration"
murder_mystery_establish_successor_administration_desc: "Install a safe, viable administration where the final campaign has emptied an office."
murder_mystery_reconstitute_campaign_council: "Reconstitute the Campaign Council"
murder_mystery_reconstitute_campaign_council_desc: "Restore a regional council after a command loss without inventing a universal government."
murder_mystery_resolve_world_without_leaders_victory: "Resolve the Leaderless World"
murder_mystery_resolve_world_without_leaders_victory_desc: "End the campaign after every surviving government has been dismantled, absorbed, or spared under the movement's final settlement."

