# Assassin State national focus descriptions
murder_mystery_secure_the_empty_chair_desc: "Protect the emergency government and the offices that keep the investigation from becoming a second collapse."
murder_mystery_guard_the_constitution_desc: "Keep the state's legal chain intact while the case command learns who can still issue orders."
murder_mystery_inventory_the_captured_state_desc: "Map the surviving ministries, depots, records, and personnel before the movement can exploit their gaps."
murder_mystery_ration_the_front_desc: "Limit the first cadres to operations the movement can supply and withdraw from safely."
murder_mystery_organize_first_cadres_desc: "Gather small, mobile teams whose reconnaissance and night work can support the opening case."
murder_mystery_protect_the_case_team_desc: "Place investigators, witnesses, and evidence under a protection plan with a visible cost."
murder_mystery_focus_establish_case_command_desc: "Give the investigation a temporary command that can be revoked without creating a permanent throne."
murder_mystery_open_brotherhood_operations_desc: "Authorize targeted operations against routes and safe houses linked to the murder."
murder_mystery_map_the_first_routes_desc: "Trace the roads, couriers, and depots that connect the first evidence to the wider network."
murder_mystery_choose_the_public_mask_desc: "Decide how much of the movement's hidden work can be presented as ordinary administration."
murder_mystery_write_revocable_orders_desc: "Make every early order auditable and reversible before the cells begin to coordinate."
murder_mystery_focus_leadership_is_a_crime_desc: "Turn the movement's hostility to leaders into a doctrine that still has to answer for its orders."
murder_mystery_settle_the_command_dispute_desc: "Resolve who may coordinate the case without allowing one office to become untouchable."
murder_mystery_protect_the_first_knife_desc: "Preserve the movement's most valuable operator through disciplined protection rather than myth."
murder_mystery_mandate_the_subjects_desc: "Set narrow obligations for local administrations that depend on the central network."
murder_mystery_three_answers_to_power_desc: "Present central command, federated cells, and pragmatic administration as distinct political futures."
murder_mystery_choose_hidden_hand_desc: "Choose a disciplined directorate that can turn scattered cells into a single territorial instrument."
murder_mystery_centralize_the_directorate_desc: "Concentrate archives, orders, and subject obligations around a command that can be held responsible."
murder_mystery_secure_the_inner_circle_desc: "Protect the small group that carries the most sensitive evidence and operational knowledge."
murder_mystery_strengthen_the_first_knife_desc: "Expand the elite cadre without removing the cap that keeps it from becoming a conventional army."
murder_mystery_command_the_subjects_desc: "Use negotiated demands to keep derivative administrations supplied and politically legible."
murder_mystery_choose_cells_without_masters_desc: "Choose a federation of local councils that refuses to place one chair above the others."
murder_mystery_federate_the_cell_councils_desc: "Give autonomous cells common procedures while leaving their local authorities intact."
murder_mystery_arm_local_autonomy_desc: "Equip local cadres for raids and protection without promising them a limitless front."
murder_mystery_share_the_case_file_desc: "Exchange evidence across councils so a captured route does not erase the investigation."
murder_mystery_survive_without_a_chair_desc: "Build institutions that can continue when no single leader can claim the movement."
murder_mystery_choose_necessary_mask_desc: "Choose a pragmatic public state that treats offices as tools for survival rather than sacred authority."
murder_mystery_formalize_the_ministries_desc: "Give the public administration enough structure to move supplies and answer foreign pressure."
murder_mystery_recognize_the_public_state_desc: "Ask outside governments to deal with the movement's visible administration on limited terms."
murder_mystery_negotiate_the_contracts_desc: "Trade autonomy, protection, and supplies through agreements that can be reopened when conditions change."
murder_mystery_return_the_mask_desc: "Use diplomacy and commerce to hide the movement's origins without denying its obligations."
murder_mystery_build_clandestine_workshops_desc: "Create dispersed workshops that keep the cells equipped while avoiding a single vulnerable factory."
murder_mystery_disperse_the_tools_desc: "Spread tools and ammunition through local caches so one raid cannot disarm the movement."
murder_mystery_local_repair_corps_desc: "Train repair teams to keep mobile formations moving after short attacks and forced withdrawals."
murder_mystery_hide_the_supply_lines_desc: "Separate the movement's routes so an exposed depot does not reveal the entire logistics chain."
murder_mystery_workshop_economy_desc: "Make local production carry the movement's equipment burden before formal industry is secure."
murder_mystery_seize_state_industry_desc: "Capture selected factories only when the new administration can staff and supply them."
murder_mystery_capture_the_depots_desc: "Secure depots as campaign objectives while preserving a route for the next withdrawal."
murder_mystery_rebuild_the_rail_grid_desc: "Restore rail links that connect the movement's dispersed workshops to its operational sectors."
murder_mystery_convert_the_heavy_shops_desc: "Adapt heavy industry for limited vehicles and tools without pretending the movement can sustain a long war."
murder_mystery_industry_board_desc: "Coordinate production, repairs, and captured industry through a board with limited authority."
murder_mystery_pragmatic_contracts_desc: "Use temporary contracts to fill shortages while keeping the public administration answerable."
murder_mystery_neutral_imports_desc: "Buy essential equipment through neutral channels without granting foreign powers control of the network."
murder_mystery_vehicle_licenses_desc: "Authorize a small vehicle pool for reconnaissance, raids, and emergency logistics."
murder_mystery_production_board_desc: "Set priorities for kits, fuel, and repairs before the campaign consumes the reserve."
murder_mystery_trade_without_recognition_desc: "Keep goods moving even when foreign governments refuse to recognize the movement's state."
murder_mystery_cadre_training_desc: "Standardize the basic cadre so reconnaissance and night attacks do not depend on one school."
murder_mystery_night_doctrine_desc: "Make darkness an operational advantage while keeping attacks brief enough to disengage."
murder_mystery_saboteur_cells_desc: "Attach small sabotage teams to operations without turning them into a substitute for firepower."
murder_mystery_shadow_companies_desc: "Form mobile companies for raids and rapid withdrawal instead of holding exposed fronts."
murder_mystery_silent_guard_desc: "Assign a defensive guard to capitals, offices, protected witnesses, and recognized successors."
murder_mystery_conventional_adaptation_desc: "Teach the movement to survive contact with ordinary armies without abandoning its asymmetric strengths."
murder_mystery_force_standards_desc: "Set reinforcement and training limits that keep specialized formations from overrunning their supply."
murder_mystery_master_cadre_desc: "Train a rare master cadre for decisive operations under a strict numerical cap."
murder_mystery_focus_mechanized_infiltration_desc: "Use a limited mechanized force to cross open ground and strike a narrow objective before fuel runs out."
murder_mystery_elite_force_caps_desc: "Keep elite formations scarce enough that every loss matters to the movement's future."
murder_mystery_intelligence_registry_desc: "Bring evidence, witnesses, routes, and target protections together under one accountable intelligence office."
murder_mystery_secure_comms_desc: "Protect orders and reports as they pass between cells, subjects, and the central command."
murder_mystery_evidence_exchange_desc: "Share corroborated evidence without exposing every witness or safe house."
murder_mystery_foreign_contacts_desc: "Open cautious contact with governments and cells beyond the original investigation."
murder_mystery_foreign_cells_desc: "Permit only a limited number of foreign cells, each with a commander, a route, and a withdrawal plan."
murder_mystery_counterintelligence_desc: "Reduce exposure by teaching the network to detect planted evidence and compromised couriers."
murder_mystery_cell_immunity_desc: "Offer narrow immunity to cells that surrender records and accept the settlement's protections."
murder_mystery_international_operations_desc: "Coordinate foreign operations while keeping their reach below the movement's ability to supply them."
murder_mystery_insurgency_preparation_desc: "Prepare local revolts with capitals, supply links, and successor plans instead of a commandless uprising."
murder_mystery_recognize_movement_desc: "Turn external pressure into a limited claim that the movement can administer territory."
murder_mystery_provisional_administration_desc: "Install a provisional office that can govern a derivative without erasing its local identity."
murder_mystery_subject_compact_desc: "Write the obligations that bind subjects to the center while preserving their viable institutions."
murder_mystery_campaign_sectors_desc: "Divide the final campaign into sectors so each war has a clear command and supply boundary."
murder_mystery_protect_derivatives_desc: "Protect derivative administrations whose survival keeps the movement from becoming a single point of failure."
murder_mystery_central_demands_desc: "Make the center's demands measurable before asking subjects to commit troops or resources."
murder_mystery_staged_integration_desc: "Integrate foreign administrations in stages, with a rollback at each handoff."
murder_mystery_host_archive_desc: "Preserve the original host's archives before the movement's territorial ambitions can consume them."
murder_mystery_host_capital_desc: "Secure the host capital as an objective and keep its successor administration viable."
murder_mystery_necessary_compromise_desc: "Accept a narrow compromise that keeps the state alive without pretending the contradiction is solved."
murder_mystery_prepare_world_collapse_desc: "Prepare the final campaign only after the movement can account for every protected office and sector."
murder_mystery_command_settlement_v_desc: "Settle the fifth command question and make the movement's final authority temporary and reviewable."
murder_mystery_terminal_recruitment_desc: "Recruit only the forces needed for the final campaign and preserve a reserve for its aftermath."
murder_mystery_leadership_dossiers_desc: "Complete the dossiers that identify offices, successors, protections, and lawful targets."
murder_mystery_focus_synchronize_uprisings_desc: "Coordinate the campaign sectors so one revolt does not exhaust the entire movement."
murder_mystery_dismantle_governments_desc: "Break command spines through identified targets while leaving viable successor administrations behind."
murder_mystery_terminal_logistics_desc: "Stock the rail, fuel, kits, and repair capacity required for short final campaigns."
murder_mystery_focus_activate_world_of_anarchy_desc: "Open the final campaign once the Brotherhood has united its foreign cells and prepared every campaign sector."

# Ideas and national spirits
murder_mystery_case_dossier: "Case Dossier"
murder_mystery_case_dossier_desc: "A living record of evidence, witnesses, routes, and decisions made during the investigation."
murder_mystery_succession_crisis: "Succession Crisis"
murder_mystery_succession_crisis_desc: "The empty chair strains every office until the verified successor can establish continuity."
murder_mystery_protected_leadership_system: "Protected Leadership Network"
murder_mystery_protected_leadership_system_desc: "A deliberate protection protocol keeps the most exposed offices alive during the case."
murder_mystery_institutional_memory_after_capture: "Institutional Memory After Capture"
murder_mystery_institutional_memory_after_capture_desc: "The government retains the evidence and procedures learned during a permanent resolution."
murder_mystery_underground_becomes_government: "The Underground Becomes Government"
murder_mystery_underground_becomes_government_desc: "A movement built from cells must now provide offices, supply, and a public administration."
murder_mystery_cells_under_arms: "Cells Under Arms"
murder_mystery_cells_under_arms_desc: "Selected cells field mobile cadres while their supply remains deliberately limited."
murder_mystery_leadership_is_a_crime_desc: "The movement condemns leadership even as its campaigns expose the need for coordination."
murder_mystery_centralized_government: "Centralized Government"
murder_mystery_centralized_government_desc: "The Directorate concentrates orders, archives, and subject obligations around one command."
murder_mystery_decentralized_government: "Decentralized Government"
murder_mystery_decentralized_government_desc: "Local councils retain authority and accept only limited common obligations."
murder_mystery_pragmatic_government: "Pragmatic Government"
murder_mystery_pragmatic_government_desc: "The public state is treated as a temporary instrument for supply, diplomacy, and survival."
murder_mystery_centralized_cells_under_arms: "Centralized Cells Under Arms"
murder_mystery_centralized_cells_under_arms_desc: "The central movement can direct more cadres, but every order creates a visible command trail."
murder_mystery_decentralized_cells_under_arms: "Decentralized Cells Under Arms"
murder_mystery_decentralized_cells_under_arms_desc: "Autonomous cells are resilient and difficult to coordinate in a sustained conventional war."
murder_mystery_pragmatic_cells_under_arms: "Pragmatic Cells Under Arms"
murder_mystery_pragmatic_cells_under_arms_desc: "Cell forces are assigned according to immediate logistical and political need."
murder_mystery_centralized_leadership_contradiction: "Centralized Leadership Contradiction"
murder_mystery_centralized_leadership_contradiction_desc: "A movement against leaders has made its hidden directorate indispensable."
murder_mystery_decentralized_leadership_contradiction: "Decentralized Leadership Contradiction"
murder_mystery_decentralized_leadership_contradiction_desc: "No single chair rules the councils, yet every synchronized operation needs agreement."
murder_mystery_pragmatic_leadership_contradiction: "Pragmatic Leadership Contradiction"
murder_mystery_pragmatic_leadership_contradiction_desc: "Temporary offices accumulate permanence whenever the next convoy or campaign needs an order."
murder_mystery_mature_international_network: "Mature International Network"
murder_mystery_mature_international_network_desc: "Foreign cells share evidence and routes while remaining limited by the movement's capacity."
murder_mystery_foreign_derivative_administration: "Foreign Derivative Administration"
murder_mystery_foreign_derivative_administration_desc: "A local subject balances movement support with its own capital, population, and institutions."
murder_mystery_terminal_campaign_command: "World of Anarchy Command"
murder_mystery_terminal_campaign_command_desc: "The final campaign can coordinate several sectors, but it remains constrained by supply and protected offices."
murder_mystery_terminal_subject_administration: "Successor Administration"
murder_mystery_terminal_subject_administration_desc: "The old government is gone. An acting cabinet answers to the movement, and the ministries obey because the alternative is worse."
murder_mystery_command_spine_broken: "Command Spine Broken"
murder_mystery_command_spine_broken_desc: "Staff officers and ministers have been struck down in their offices. Their replacements are still learning whose orders still stand."
murder_mystery_campaign_council_reconstituting: "Campaign Council Reconstituting"
murder_mystery_campaign_council_reconstituting_desc: "The movement's campaign council is being rebuilt. Until it sits again, orders travel slowly and every front waits for confirmation."
murder_mystery_priority_spirit_obedience: "Answering to the Center"
murder_mystery_priority_spirit_obedience_desc: "Our administration takes its orders, its supplies and its inspectors from the central state."
murder_mystery_priority_spirit_autonomy: "Governing Ourselves"
murder_mystery_priority_spirit_autonomy_desc: "Our districts defend themselves and decide for themselves, whatever the center would prefer."
murder_mystery_priority_spirit_local_campaign: "Local Campaign"
murder_mystery_priority_spirit_local_campaign_desc: "Our cadres fight their own war against the government they rose against, at their own pace and on their own terms."
murder_mystery_promise_hidden_command: "The Hidden Command"
murder_mystery_promise_hidden_command_desc: "The council never dissolved. It simply stopped appearing in public, and the world it conquered answers to people no one is allowed to name."
murder_mystery_promise_dissolved_councils: "The Councils Dissolved"
murder_mystery_promise_dissolved_councils_desc: "The campaign councils kept their promise and broke themselves up. The cells govern their own districts, and the center coordinates only what they agree to share."
murder_mystery_promise_mask_stays: "The Mask Stays On"
murder_mystery_promise_mask_stays_desc: "The temporary state declared that the world is not yet safe enough for it to dissolve. Its factories run and its trains move, but its own cadres call it a betrayal."
murder_mystery_promise_mixed_settlement: "The Mixed Settlement"
murder_mystery_promise_mixed_settlement_desc: "Strategic command stays with the center; local rule passes to the cells and administrations. Nobody fully trusts the arrangement, which is why it holds."
murder_mystery_terminal_defeat_postwar_protection_compact: "Postwar Protection Compact"
murder_mystery_terminal_defeat_postwar_protection_compact_desc: "The defeat settlement protects viable administrations and preserves the records needed for repair."

# Technology, equipment, and formations
murder_mystery_clandestine_combat_training: "Clandestine Combat Training"
murder_mystery_clandestine_combat_training_desc: "Train small cadres for reconnaissance, night fighting, rough terrain, and short attacks."
murder_mystery_compartmented_logistics: "Compartmented Logistics"
murder_mystery_compartmented_logistics_desc: "Keep supplies moving through separated depots and routes, at the cost of sustained combat power."
murder_mystery_urban_rough_terrain_infiltration: "Urban and Rough-Terrain Infiltration"
murder_mystery_urban_rough_terrain_infiltration_desc: "Teach cells to exploit cities, hills, forests, and broken ground while avoiding open-field battles."
murder_mystery_shadow_operations_doctrine: "Shadow Operations Doctrine"
murder_mystery_shadow_operations_doctrine_desc: "Coordinate mobile companies for raids, reconnaissance, and rapid withdrawal."
murder_mystery_protected_command_doctrine: "Protected Command Doctrine"
murder_mystery_protected_command_doctrine_desc: "Build guards and fallback offices around the movement's most valuable leaders and planners."
murder_mystery_master_cadre_system: "Master Cadre Command"
murder_mystery_master_cadre_system_desc: "Train a small elite cadre for decisive operations without removing the force cap."
murder_mystery_mechanized_infiltration: "Mechanized Infiltration"
murder_mystery_mechanized_infiltration_desc: "Use a limited mechanized force to cross open ground and strike a narrow objective before fuel and supply run out."
assassin_operations_kit: "Assassin Operations Kit"
assassin_operations_kit_desc: "Specialized communications, demolition, medical, and reconnaissance equipment for clandestine formations."
assassin_operations_kit_1: "Improved Assassin Operations Kit"
assassin_operations_kit_1_desc: "A refined operations kit with better radios, tools, and field sustainment."
assassin_cadre: "Assassin Cadre"
assassin_cadre_desc: "A light formation trained for reconnaissance, night fighting, and short attacks."
shadow_company: "Shadow Company"
shadow_company_desc: "A mobile raiding formation that trades staying power for movement and surprise."
silent_guard: "Silent Guard"
silent_guard_desc: "A defensive formation assigned to capitals, offices, and protected command."
master_assassin: "Master Assassin"
master_assassin_desc: "A rare elite formation for high-value operations, kept under a strict cap."
mechanized_assassin: "Mechanized Assassin"
mechanized_assassin_desc: "A fuel-hungry mechanized formation that can attack across open ground but cannot sustain a long front."
saboteur_cell: "Saboteur Cell"
saboteur_cell_desc: "A support company that improves raids and infiltration while adding little conventional firepower."

# Event-log detail and evolution titles
murder_mystery.event_log.detail: "The assassination throws the country into a succession crisis. Investigators follow evidence, protect witnesses, and expose a clandestine network whose reach can grow beyond the original murder. Case Progress shows how close the authorities are to a breakthrough, while Network Reach shows how far the movement has spread. The Brotherhood's cohesion remains concealed until the movement reveals its strength."
murder_mystery.evolution.i.title: "The Murder Cult"
murder_mystery.evolution.ii.title: "Cells Beyond the Border"
murder_mystery.evolution.iii.title: "The Hidden Hand Takes Territory"
murder_mystery.evolution.iv.title: "The Veiled Compact"
murder_mystery.evolution.v.title: "World Without Leaders"
murder_mystery.evolution.type: "The Movement Grows"
murder_mystery.evolution.summary: "The movement grows in five stages: a national murder cult, an international network, a territorial Assassin State, a league of subject revolts, and a campaign against every government. A disabled stage stops the movement at the stage before it."
murder_mystery.evolution.i.body: "The murderer gains followers who shelter the killers, intimidate witnesses and destroy evidence. The investigation stays national, and capturing the core leadership still ends the case."
murder_mystery.evolution.ii.body: "Cells take root in other countries, and each affected government opens its own local case. Capturing the original murderer no longer ends the movement while a mature cell survives to inherit it."
murder_mystery.evolution.iii.body: "The movement seizes a connected block of the host's territory and proclaims the Assassin State. Its army goes to war with the host, and the investigation becomes a counterinsurgency."
murder_mystery.evolution.iv.body: "Mature foreign cells can rise in revolt and form subject states bound to the Assassin State. Ordinary governments gain wider cooperation against the cells."
murder_mystery.evolution.v.body: "The Assassin State opens its final route and elite units. A World of Anarchy campaign against organized leadership becomes possible, but it does not begin on its own."

# Achievement presentation
murder_mystery_achievement_eligible_tooltip: "Available in any campaign."
murder_mystery_achievement_natural_run_tooltip: "The Assassin Network must arise on its own rather than from the scenario menu."
murder_mystery_achievement_knife_breaks_eligible_tooltip: "The Assassin Network must arise on its own rather than from the scenario menu, and you must not take command of the Assassin State when it breaks away."
039_murder_mystery_no_second_victim_NAME: "No Second Victim"
039_murder_mystery_no_second_victim_DESC: "Capture the original murderer before another official dies."
039_murder_mystery_no_second_victim_tooltip: "As the country whose leader was murdered first, capture the original murderer in your own final operation and see the network end before it kills another official anywhere in the world."
039_murder_mystery_empty_chair_holds_NAME: "The Empty Chair Holds"
039_murder_mystery_empty_chair_holds_DESC: "Carry the government through the murder case without breaking its institutions."
039_murder_mystery_empty_chair_holds_tooltip: "As the country whose leader was murdered first, end the Assassin Network before it seizes territory. Keep the successor government in office, never choose emergency repression, never lose your original capital for more than about a month, and finish with at least §Y60%§! stability while holding that capital."
039_murder_mystery_net_without_knives_NAME: "A Net Without Knives"
039_murder_mystery_net_without_knives_DESC: "Dismantle the international network before any of its cells becomes a country."
039_murder_mystery_net_without_knives_tooltip: "As the country whose leader was murdered first, let the network reach its second evolution and at least §Yfive§! foreign cells at once, capture the original murderer, and end the movement without any cell breaking away as a new country or the movement passing to a successor."
039_murder_mystery_the_knife_breaks_NAME: "The Knife Breaks"
039_murder_mystery_the_knife_breaks_DESC: "Defeat the Assassin State as the government it broke away from."
039_murder_mystery_the_knife_breaks_tooltip: "Stay in command of the country whose leader was murdered first when the Assassin State breaks away. Defeat it yourself or complete at least §Ytwo§! case objectives after the split, then end the movement with no breakaway cell state, no successor movement, and no mature cell left."
039_murder_mystery_no_masters_above_us_NAME: "No Masters Above Us"
039_murder_mystery_no_masters_above_us_DESC: "Prove that the movement survives without central rule."
039_murder_mystery_no_masters_above_us_tooltip: "As the Assassin State on the §YCells Without Masters§! path, complete §YSurvive Without a Chair§!, defeat the government you broke away from, hold its former capital, and keep at least §Ythree§! self-governing cell states alive."
039_murder_mystery_necessary_hypocrisy_NAME: "Necessary Hypocrisy"
039_murder_mystery_necessary_hypocrisy_DESC: "Build an effective conventional state while calling its offices temporary."
039_murder_mystery_necessary_hypocrisy_tooltip: "As the Assassin State on §YThe Necessary Mask§! path, complete §YReturn the Mask§!, keep all three pragmatic national spirits, field a division made mostly of Mechanized Assassins, lead the Veiled Compact with at least §Yfour§! cell states bound to you, and hold Brotherhood Cohesion at §Y70§! or higher."
039_murder_mystery_every_chair_empty_NAME: "Every Chair Empty"
039_murder_mystery_every_chair_empty_DESC: "As the Assassin State or the movement's heir, win World of Anarchy."
039_murder_mystery_every_chair_empty_tooltip: "As the Assassin State or the movement's heir, launch World of Anarchy through its own campaign and win it, which requires every government drawn into the campaign to fall, surrender, or be placed under your administration."
039_murder_mystery_last_safe_cabinet_NAME: "The Last Safe Cabinet"
039_murder_mystery_last_safe_cabinet_DESC: "Stay an independent government through World of Anarchy and see the movement defeated."
039_murder_mystery_last_safe_cabinet_tooltip: "Be an independent government when World of Anarchy begins. Keep the same leader, lose no official to the movement, complete at least §Yone§! case objective during the war, and still be independent when the Assassin State falls."

# Case objective missions acquired from the opening investigation
murder_mystery_protect_witness_transfer: "Protect the Witness Transfer"
murder_mystery_protect_witness_transfer_desc: "The protected witnesses travel by rail from [?murder_mystery_objective_origin_state.GetName] to [?murder_mystery_objective_state.GetName]. Both states must stay fully under our control, with the line between them intact, until the transfer is complete."
murder_mystery_hold_government_quarter: "Hold the Government Quarter"
murder_mystery_hold_government_quarter_desc: "Keep the government quarter under your control and the successor administration operating."
murder_mystery_secure_evidence_convoy: "Secure the Evidence Convoy"
murder_mystery_secure_evidence_convoy_desc: "Secure the railway from [?murder_mystery_objective_origin_state.GetName] to [?murder_mystery_objective_state.GetName] and provide a train to carry the recovered evidence."
murder_mystery_guard_named_route: "Guard the Named Route"
murder_mystery_guard_named_route_desc: "Cover the named route and stop the movement from cutting the corridor."
murder_mystery_place_supplied_divisions: "Place Supplied Divisions"
murder_mystery_place_supplied_divisions_desc: "Deploy at least [?murder_mystery_objective_required_divisions|.0] divisions in [?murder_mystery_objective_state.GetName], secure its supply hub, and keep its railway to [?murder_mystery_objective_origin_state.GetName] in friendly hands."
murder_mystery_keep_capital_connected: "Keep the Capital Connected"
murder_mystery_keep_capital_connected_desc: "Restore the railway between [?murder_mystery_objective_origin_state.GetName] and [?murder_mystery_objective_state.GetName], retain control of both states, and provide a train for the connection."
murder_mystery_capture_safehouse_chain: "Capture the Safehouse Chain"
murder_mystery_capture_safehouse_chain_desc: "Take the linked safehouses before the network can move its records and cadres."
murder_mystery_preserve_target_attack_window: "Preserve the Attack Window"
murder_mystery_preserve_target_attack_window_desc: "Keep the target reachable and the assault option open until the window closes."
murder_mystery_prevent_revolt_preparation: "Prevent Revolt Preparation"
murder_mystery_prevent_revolt_preparation_desc: "Break the preparations for open revolt before the local committees are ready."
murder_mystery_secure_depots_rail_hubs: "Secure Depots and Rail Hubs"
murder_mystery_secure_depots_rail_hubs_desc: "Deploy at least [?murder_mystery_objective_required_divisions|.0] divisions in [?murder_mystery_objective_state.GetName] and secure its supply hub and railway to [?murder_mystery_objective_origin_state.GetName]."
murder_mystery_dismantle_local_recruitment: "Dismantle Local Recruitment"
murder_mystery_dismantle_local_recruitment_desc: "The cell in [?murder_mystery_objective_country.GetName] recruits faster than we arrest. Destroy it, or cut its strength to [?murder_mystery_objective_floor_value|0] before its next generation is ready."
murder_mystery_protect_local_government: "Protect the Local Government"
murder_mystery_protect_local_government_desc: "The government of [?murder_mystery_objective_country.GetName] is the movement's next target. Not one of its offices may fall to the movement while the crisis lasts."
murder_mystery_intercept_support_shipment: "Intercept the Support Shipment"
murder_mystery_objective_witness_route_broken_tt: "The rail route from §Y[?murder_mystery_objective_origin_state.GetName]§! to §Y[?murder_mystery_objective_state.GetName]§! is cut, or one of the two states is no longer fully under our control."
murder_mystery_objective_recruitment_broken_tt: "The cell in §Y[?murder_mystery_objective_country.GetName]§! is destroyed, or its strength falls to §Y[?murder_mystery_objective_floor_value|0]§! or below."
murder_mystery_objective_local_government_struck_tt: "The movement strikes an office in §Y[?murder_mystery_objective_country.GetName]§!, or its government falls."
murder_mystery_objective_shipment_resolved_tt: "The shipment to the cell in §Y[?murder_mystery_objective_country.GetName]§! is stopped by a raid or by the cell losing ground (success), or it arrives (failure)."
murder_mystery_intercept_support_shipment_desc: "A shipment of weapons and money is on its way to the cell in [?murder_mystery_objective_country.GetName]. Raid the cell or break its hold on the district before the shipment arrives."
murder_mystery_hold_parent_capital_revolt_border: "Hold the Parent Capital Border"
murder_mystery_hold_parent_capital_revolt_border_desc: "Hold the border districts that connect the parent capital to the revolt."
murder_mystery_survive_opening_war: "Survive the Opening War"
murder_mystery_survive_opening_war_desc: "Defend [?murder_mystery_objective_origin_state.GetName] through the opening war and preserve the movement's territorial government."
murder_mystery_complete_terminal_sector: "Complete the Terminal Sector"
murder_mystery_complete_terminal_sector_desc: "Force the governments assigned to Sector [?murder_mystery_objective_sector|.0] to capitulate or accept a subject settlement within the campaign mandate. A campaign that has defeated only part of the sector receives a partial outcome."
murder_mystery_objective_sector_complete_tt: "Every government assigned to Sector [?murder_mystery_objective_sector|.0] has capitulated, ceased to exist, or accepted our subject settlement."
murder_mystery_objective_rail_route_tt: "The railway between [?murder_mystery_objective_origin_state.GetName] and [?murder_mystery_objective_state.GetName] connects states fully under our control through friendly territory."
murder_mystery_agency_operation: "Run the Agency Operation"
murder_mystery_agency_operation_desc: "Our case team has a window before the network notices it is being watched. Push Case Progress to [?murder_mystery_objective_target_value|0] while Evidence Integrity stays at [?murder_mystery_objective_floor_value|0] or above. If Network Reach climbs past [?murder_mystery_objective_limit_value|0], the cell has moved and the operation fails. A completed operation sets the movement's cell in our country back."
murder_mystery_objective_agency_operation_tt: "Case Progress reaches [?murder_mystery_objective_target_value|0] with Evidence Integrity of at least [?murder_mystery_objective_floor_value|0]."
murder_mystery_contest_supply_route: "Contest the Supply Route"
murder_mystery_contest_supply_route_desc: "The government's army is fed through [?murder_mystery_objective_state.GetName]. Take the whole state and its supply hub. Holding only part of it when time runs out still counts for something."
murder_mystery_objective_state_taken_tt: "We control every province of [?murder_mystery_objective_state.GetName]."
murder_mystery_capture_host_archive: "Capture the Case Archive"
murder_mystery_capture_host_archive_desc: "The government keeps its case files and command staff in [?murder_mystery_objective_state.GetName]. Seize the state and the files burn with the investigation's best leads."
murder_mystery_objective_state_controlled_tt: "We control [?murder_mystery_objective_state.GetName]."
murder_mystery_keep_cell_supplied: "Keep the Cell Supplied"
murder_mystery_keep_cell_supplied_desc: "The cell in [?murder_mystery_objective_country.GetNameDef] is living on our shipments. Keep it alive until the deadline. If its government's case closes in first, the cell survives but is badly exposed."
murder_mystery_objective_cell_lost_tt: "The cell in [?murder_mystery_objective_country.GetNameDef] is destroyed."
murder_mystery_raise_cell_quietly: "Grow the Cell Quietly"
murder_mystery_raise_cell_quietly_desc: "Build the cell in [?murder_mystery_objective_country.GetNameDef] up to a maturity of [?murder_mystery_objective_target_value|0] without letting its exposure reach [?murder_mystery_objective_limit_value|0]. Growth without discretion only earns a partial result."
murder_mystery_objective_quiet_maturity_tt: "The cell in [?murder_mystery_objective_country.GetNameDef] reaches a maturity of [?murder_mystery_objective_target_value|0] while its exposure stays below [?murder_mystery_objective_limit_value|0]."
murder_mystery_prepare_revolt_cluster: "Prepare the Revolt Cluster"
murder_mystery_prepare_revolt_cluster_desc: "The cell in [?murder_mystery_objective_country.GetNameDef] is to become an insurrection around [?murder_mystery_objective_state.GetName]. Bring it to full revolt readiness. A cell that gets half way is still worth something."
murder_mystery_objective_revolt_ready_tt: "The cell in [?murder_mystery_objective_country.GetNameDef] is an insurrection cell ready to revolt."
murder_mystery_hold_subject_loyalty: "Hold the Subjects Together"
murder_mystery_hold_subject_loyalty_desc: "Our Cohesion is failing and the governments we created are watching. Keep every one of them under our settlement until the deadline."
murder_mystery_objective_subject_left_tt: "A government we created leaves our subject settlement."
murder_mystery_synchronized_operation: "Synchronize the Cells"
murder_mystery_synchronized_operation_desc: "One killing is a crime; several at once is a campaign. Bring [?murder_mystery_objective_target_value|0] cells to the insurrection stage before the foreign investigations adapt. [?global.murder_mystery_insurrection_cell_count|0] are ready now."
murder_mystery_objective_synchronized_cells_tt: "At least [?murder_mystery_objective_target_value|0] registered cells stand at the insurrection stage."
murder_mystery_dismantle_command_network: "Dismantle the Command Network"
murder_mystery_dismantle_command_network_desc: "[?murder_mystery_objective_country.GetNameDefCap] still directs the resistance in this sector from [?murder_mystery_objective_state.GetName]. Take its capital or force it to surrender."
murder_mystery_objective_command_network_tt: "We or one of our subjects hold the capital of [?murder_mystery_objective_country.GetNameDef], or it has surrendered."
murder_mystery_force_capitulation: "Force a Capitulation"
murder_mystery_force_capitulation_desc: "The campaign mandate needs a surrender to show the world. Force [?murder_mystery_objective_country.GetNameDef] to capitulate before the mandate expires."
murder_mystery_objective_target_defeated_tt: "[?murder_mystery_objective_country.GetNameDefCap] has capitulated, accepted our settlement or no longer exists."
murder_mystery_hold_sector_capitals: "Hold the Sector Capitals"
murder_mystery_hold_sector_capitals_desc: "We have broken the governments of Sector [?murder_mystery_objective_sector|0]. Keep their capitals in our hands or our subjects' until the deadline."
murder_mystery_objective_sector_capitals_lost_tt: "We and our subjects hold none of the Sector [?murder_mystery_objective_sector|0] capitals."
murder_mystery_protect_central_command: "Protect the Central Command"
murder_mystery_protect_central_command_desc: "Authority has been handed to the field councils. Hold [?murder_mystery_objective_origin_state.GetName] and keep Cohesion at [?murder_mystery_objective_floor_value|0] or above until the councils return it."
murder_mystery_objective_central_command_broken_tt: "We lose [?murder_mystery_objective_origin_state.GetName], or Cohesion falls below [?murder_mystery_objective_floor_value|0]."
murder_mystery_protect_derivative: "Protect the Successor Government"
murder_mystery_protect_derivative_desc: "A coalition is closing in on [?murder_mystery_objective_country.GetNameDef]. Keep it fighting and under our settlement until the deadline."
murder_mystery_objective_derivative_lost_tt: "[?murder_mystery_objective_country.GetNameDefCap] capitulates, leaves our settlement or is destroyed."
murder_mystery_reduce_sector_governments: "Reduce the Sector Governments"
murder_mystery_reduce_sector_governments_desc: "Break at least [?murder_mystery_objective_target_value|0] of the governments assigned to Sector [?murder_mystery_objective_sector|0]. [?murder_mystery_objective_progress_value|0] have fallen so far."
murder_mystery_objective_sector_reduced_tt: "At least [?murder_mystery_objective_target_value|0] Sector [?murder_mystery_objective_sector|0] governments have capitulated, accepted our settlement or ceased to exist."

# Dynamic route-leader and operations-kit callback text
MURDER_MYSTERY_HIDDEN_HAND_ROUTE_LEADER_NAME: "The Directorate"
MURDER_MYSTERY_HIDDEN_HAND_ROUTE_LEADER_DESC: "A disciplined field administrator who turns clandestine cells into a territorial instrument."
MURDER_MYSTERY_NECESSARY_MASK_ROUTE_LEADER_NAME: "The Necessary Administrator"
MURDER_MYSTERY_NECESSARY_MASK_ROUTE_LEADER_DESC: "A pragmatic steward who uses a temporary office to keep the movement supplied."
chaos_unit_family_524_name_loc: "Assassin Operations Kit"
chaos_unit_family_524_request_cost_loc: "The request consumes political power, command power, and a limited stock of operations kits."
chaos_unit_family_524_sustainment_cost_loc: "The formation consumes operations kits and supply while it remains in the field."
murder_mystery_action_requirements_tt: "Case Progress: [?murder_mystery_case_progress|.0]. Network Reach: [?murder_mystery_network_reach|.0]. The action also requires the listed resources."
