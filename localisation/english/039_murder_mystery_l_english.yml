039_murder_mystery_last_safe_cabinet: "The Last Safe Cabinet"
039_murder_mystery_last_safe_cabinet_desc: "Remain an independent government through the final war and help defeat the movement."
039_murder_mystery_last_safe_cabinet_tooltip: "Preserve the leader who faced the opening crisis and the safe cabinet, remain independent, complete a major campaign objective, and survive the Assassin State's defeat."


