# Shared categories, focus navigation, and action tooltips
murder_mystery_investigation_category: "Murder Mystery Investigation"
murder_mystery_investigation_category_desc: "Secure the succession, preserve evidence, map the network, protect likely targets, break cells, and conduct the final operation."
murder_mystery_foreign_cell_investigation_category: "Foreign Cell Investigations"
murder_mystery_foreign_cell_investigation_category_desc: "Share evidence across borders, trace foreign routes, and dismantle clandestine cells before they become territorial movements."
murder_mystery_brotherhood_operations_category: "Brotherhood Operations"
murder_mystery_brotherhood_operations_category_desc: "Direct the Assassin movement's cells, supplies, raids, command settlement, and territorial preparations."
murder_mystery_cell_administration_category: "Cell Administration"
murder_mystery_cell_administration_category_desc: "Maintain local cadres, protect revolt capitals, negotiate settlements, and keep derivative administrations viable."
murder_mystery_world_without_leaders_category: "World Without Leaders"
murder_mystery_world_without_leaders_category_desc: "Break the governments that still stand and decide who rules what they leave behind.\n\nStanding: §Y[?global.murder_mystery_terminal_open_total|0]§!  Home front: [?global.murder_mystery_terminal_open_sector_one|0]  Near sector: [?global.murder_mystery_terminal_open_sector_two|0]  Distant sector: [?global.murder_mystery_terminal_open_sector_three|0]"
murder_mystery_action_commitment_tt: "This action commits the listed resources. Its result depends on the evidence, protection and intelligence each side holds."
murder_mystery_cell_selection_tt: "Select one established foreign route. A protected or immune country cannot be selected."
murder_mystery_mission_success_tt: "Completing this mission carries out the action and moves the current phase forward."
murder_mystery_mission_timeout_tt: "The deadline has passed. The setback costs momentum, and the other side adapts to the lost opportunity."
murder_mystery_mission_cancelled_tt: "The mission is called off; nothing more is gained or lost from it."
murder_mystery_terminal_sector_two_tt: "We declare war on the governments of the near sector, those whose capitals lie beyond the home front but within reach of our command, a few at a time."
murder_mystery_terminal_sector_three_tt: "We declare war on the governments of the distant sector, a few at a time."
murder_mystery_break_command_spine_tt: "Our cadres strike the command staff of §Y[murder_mystery_terminal_target.GetNameDef]§!. If they succeed, its planning and organisation suffer for months, its stability and war support fall, and our Brotherhood Cohesion rises. Only defeat in the field will bring it down."
murder_mystery_command_spine_ready_tt: "§Y[murder_mystery_terminal_target.GetNameDefCap]§! is close to surrender and its command has not already been broken."
murder_mystery_establish_successor_administration_tt: "Within days we decide who governs §Y[From.GetNameDef]§!: our own subject administration, its local cells, or our direct rule over its capital and factories."
murder_mystery_successor_administration_defeated_tt: "§Y[From.GetNameDefCap]§! has surrendered to us, lost every state it holds, or become our subject."
murder_mystery_reconstitute_campaign_council_tt: "Brotherhood Cohesion rises sharply, but our command is exposed while the council is rebuilt."
murder_mystery_terminal_outcome_subject_tt: "§Y[murder_mystery_terminal_choice.GetNameDefCap]§! becomes our subject under an acting cabinet, and its ruler is removed unless protection stands in the way."
murder_mystery_terminal_outcome_cells_tt: "A cell territory loyal to the movement takes over every state of §Y[murder_mystery_terminal_choice.GetNameDef]§! and rules it with wide autonomy. Where a local revolt already holds part of the country, that revolt takes the rest. If the movement cannot raise another territory, the country becomes our subject instead."
murder_mystery_terminal_outcome_staged_tt: "The capital and the most industrial states of §Y[murder_mystery_terminal_choice.GetNameDef]§! join us directly. The rest stays our subject under an acting cabinet, or goes to the local revolt that rose against it."
murder_mystery_terminal_outcome_route_tt: "This is the settlement our route promised: Brotherhood Cohesion §G+[?global.murder_mystery_terminal_route_cohesion|0]§!."
murder_mystery_terminal_outcome_off_route_tt: "This breaks with the settlement our route promised: Brotherhood Cohesion §R[?global.murder_mystery_terminal_off_route_cohesion|0]§!."
murder_mystery_terminal_settlement_tt: "A workable settlement keeps the institutions and leaders that can still govern."
murder_mystery_terminal_victory_tt: "The campaign ends in victory. The movement keeps every administration it installed and must decide what its command becomes."
murder_mystery_terminal_victory_promise_tt: "We will decide what becomes of the movement's command."
murder_mystery_command_promise_tighten_tt: "Every subject administration loses autonomy."
murder_mystery_command_promise_dissolve_tt: "Every subject administration gains wide autonomy."
murder_mystery_command_promise_mask_tt: "The temporary state keeps its powers; its subjects keep their present autonomy."
murder_mystery_command_promise_loosen_tt: "Every subject administration gains some autonomy."
murder_mystery_command_promise_route_tt: "This keeps the promise our route made: Brotherhood Cohesion rises sharply."
murder_mystery_command_promise_off_route_tt: "This breaks the promise our route made: Brotherhood Cohesion falls sharply."
murder_mystery_command_promise_mixed_tt: "Neither faction of the movement is satisfied: Brotherhood Cohesion falls slightly."
murder_mystery_has_subject_administrations_tt: "We govern at least one subject administration."
murder_mystery_tighten_administrations_tt: "Every subject administration loses autonomy, and Brotherhood Cohesion falls as the cells see the old order return."
murder_mystery_return_authority_to_cells_tt: "Every subject administration gains autonomy, and Brotherhood Cohesion rises."
murder_mystery_autonomy_tightened: "The movement tightens its administration"
murder_mystery_autonomy_loosened: "The movement returns authority to the cells"
murder_mystery_autonomy_dissolved: "The campaign councils dissolve into the cells"

# Government and movement decisions
murder_mystery_establish_case_command: "Establish the Case Command"
murder_mystery_establish_case_command_desc: "Bring the succession, evidence, and protection offices under one accountable case command."
murder_mystery_secure_government_quarter: "Secure the Government Quarter"
murder_mystery_secure_government_quarter_desc: "Protect the emergency government and the offices that keep the government functioning."
murder_mystery_preserve_first_evidence: "Preserve the First Evidence"
murder_mystery_preserve_first_evidence_desc: "Seal the scene, copy the records, and keep the first lead from disappearing."
murder_mystery_commit_case_team: "Commit the Case Team"
murder_mystery_commit_case_team_desc: "Assign investigators, communications officers, and analysts to the murder case."
murder_mystery_audit_communications: "Audit Communications"
murder_mystery_audit_communications_desc: "Compare messages, call routes, and dead drops for a pattern that survives the false leads."
murder_mystery_trace_movement_logistics: "Trace Movement Logistics"
murder_mystery_trace_movement_logistics_desc: "Follow the money, transport, and supply routes that connect the local incident to the wider network."
murder_mystery_protect_witnesses: "Protect Witnesses"
murder_mystery_protect_witnesses_desc: "Move witnesses through guarded routes and preserve their testimony before the network can reach them."
murder_mystery_choose_protection_priority: "Choose a Protection Priority"
murder_mystery_choose_protection_priority_desc: "Give one exposed office priority protection while the case team covers the remaining institutions."
murder_mystery_replace_compromised_office: "Replace a Compromised Office"
murder_mystery_replace_compromised_office_desc: "Remove a compromised official from the investigation without endangering a protected witness or recognized successor."
murder_mystery_raid_identified_cell: "Raid an Identified Cell"
murder_mystery_raid_identified_cell_desc: "Strike a mapped safe house or route while its evidence and witnesses can still be recovered."
murder_mystery_prepare_final_operation: "Prepare the Final Operation"
murder_mystery_prepare_final_operation_desc: "Assemble the evidence, protection, and resources required to close the central case."
murder_mystery_silent_arrest: "Silent Arrest"
murder_mystery_silent_arrest_desc: "Use a narrow arrest operation built around a verified target and a quiet cordon."
murder_mystery_coordinated_raids: "Coordinated Raids"
murder_mystery_coordinated_raids_desc: "Hit several linked locations at once before the network can warn its remaining cells."
murder_mystery_baited_target: "Baited Target"
murder_mystery_baited_target_desc: "Offer the movement a controlled opportunity and close the trap when it commits an operative."
murder_mystery_foreign_interception: "Foreign Interception"
murder_mystery_foreign_interception_desc: "Use liaison channels to intercept the movement beyond the original border."
murder_mystery_join_evidence_exchange: "Join the Evidence Exchange"
murder_mystery_join_evidence_exchange_desc: "Share a useful case file with another government without surrendering control of the local investigation."
murder_mystery_request_original_case_file: "Request the Original Case File"
murder_mystery_request_original_case_file_desc: "Ask the original host for the evidence that first mapped the movement."
murder_mystery_harden_target_group: "Harden a Target Group"
murder_mystery_harden_target_group_desc: "Protect a leader, commander, cabinet, intelligence office, judiciary, or investigator group."
murder_mystery_interdict_known_route: "Interdict a Known Route"
murder_mystery_interdict_known_route_desc: "Close one mapped border, port, rail, or convoy route before it can carry a cell or its supplies."
murder_mystery_dismantle_local_cell: "Dismantle a Local Cell"
murder_mystery_dismantle_local_cell_desc: "Break a local cell and close its case after the government has secured the evidence."
murder_mystery_local_cell_registered_tt: "The movement still has an active cell in [ROOT.GetNameDef]."
murder_mystery_select_foreign_cell: "Select a Foreign Cell"
murder_mystery_select_foreign_cell_desc: "Choose one concrete foreign route for investigation, support, or containment."
murder_mystery_reconcile_command_dispute: "Reconcile the Command Dispute"
murder_mystery_reconcile_command_dispute_desc: "Settle the contradiction between local initiative and a movement that still needs someone to coordinate it."
murder_mystery_supply_selected_cell: "Supply the Selected Cell"
murder_mystery_supply_selected_cell_desc: "Arrange contacts and cover for one selected cell at once, and send it weapons and money by a slower route. The shipment arrives weeks later, unless a raid on the cell stops it first."
murder_mystery_order_high_value_operation: "Order a High-Value Operation"
murder_mystery_order_high_value_operation_desc: "Spend scarce reach and cadres on a short operation against a strategically important office or route."
murder_mystery_prepare_territorial_revolt: "Prepare a Territorial Revolt"
murder_mystery_prepare_territorial_revolt_desc: "Build the capital, supply, local government, and force package required for a defensible revolt."
murder_mystery_dispatch_shadow_company: "Dispatch a Shadow Company"
murder_mystery_dispatch_shadow_company_desc: "Move a mobile company to the selected sector for reconnaissance, raids, and short attacks."
murder_mystery_discipline_unauthorized_cell: "Discipline an Unauthorized Cell"
murder_mystery_discipline_unauthorized_cell_desc: "Cut off a cell that threatens the movement's command discipline or chosen strategy."
murder_mystery_create_derivative_cell: "Create a Derivative Administration"
murder_mystery_create_derivative_cell_desc: "Turn a prepared foreign cell into a viable local subject without exceeding the movement's capacity."
murder_mystery_complete_terminal_command_settlement: "Complete the Command Settlement"
murder_mystery_complete_terminal_command_settlement_desc: "Choose the command structure that will carry the movement into its final campaign."
murder_mystery_activate_world_of_anarchy: "Activate World of Anarchy"
murder_mystery_activate_world_of_anarchy_desc: "Open the final campaign once the Brotherhood has united its foreign cells and prepared every campaign sector."
murder_mystery_secure_revolt_capital: "Secure the Revolt Capital"
murder_mystery_secure_revolt_capital_desc: "Hold the local capital long enough to install a successor administration."
murder_mystery_raise_local_assassin_cadres: "Raise Local Assassin Cadres"
murder_mystery_raise_local_assassin_cadres_desc: "Recruit a limited force from the local population and route network."
murder_mystery_seize_depot_rail: "Seize a Depot or Rail Hub"
murder_mystery_seize_depot_rail_desc: "Capture one logistical node without outrunning the supply capacity of the new administration."
murder_mystery_request_central_support: "Request Central Support"
murder_mystery_request_central_support_desc: "Ask the central movement for a limited reinforcement or equipment package."
murder_mystery_integrate_local_cells: "Integrate Local Cells"
murder_mystery_integrate_local_cells_desc: "Bring several local cells into a single subject or compact while preserving their negotiated obligations."
murder_mystery_manage_captured_officials: "Manage Captured Officials"
murder_mystery_manage_captured_officials_desc: "Protect, release, or administer captured officials according to the settlement's guarantees."
murder_mystery_negotiate_local_settlement: "Negotiate a Local Settlement"
murder_mystery_negotiate_local_settlement_desc: "Trade autonomy, protection, and supplies for a stable local administration."
murder_mystery_synchronize_uprisings: "Synchronize the Uprisings"
murder_mystery_synchronize_uprisings_desc: "Open the home front, or raise the ready cells of the selected sector in one coordinated wave and carry the war to the next governments there."
murder_mystery_select_campaign_sector_two: "Open the Near Sector"
murder_mystery_select_campaign_sector_two_desc: "Carry the war to the [?global.murder_mystery_terminal_open_sector_two|0] governments whose capitals lie beyond the home front but within reach of our command."
murder_mystery_select_campaign_sector_three: "Open the Distant Sector"
murder_mystery_select_campaign_sector_three_desc: "Carry the war across the oceans to the [?global.murder_mystery_terminal_open_sector_three|0] most distant governments still standing."
murder_mystery_break_command_spine: "Break the Command Spine"
murder_mystery_break_command_spine_desc: "[murder_mystery_terminal_target.GetNameDefCap] is the largest government still fighting us. Its generals and ministers are close to breaking; our cadres can make sure they do."
murder_mystery_establish_successor_administration: "Successor Administration: [From.GetName]"
murder_mystery_establish_successor_administration_desc: "[From.GetNameDefCap] can no longer resist. Someone must govern it before its old ministers find their courage again."
murder_mystery_reconstitute_campaign_council: "Reconstitute the Campaign Council"
murder_mystery_reconstitute_campaign_council_desc: "Expansion and losses have strained the movement's command. The campaign council can be rebuilt, but while it meets, the front waits."
murder_mystery_support_threatened_partner: "Support [From.GetName]"
murder_mystery_support_threatened_partner_desc: "[From.GetNameDefCap] is fighting a cell of the movement on its own soil. Investigators, vehicles and protection details from our case command can strengthen its case, if they get through."
murder_mystery_support_threatened_partner_tt: "Our convoy raises §Y[From.GetNameDef]§!'s local case and the protection of its likely targets.\nWhile the movement's Network Reach is high, it may intercept the convoy: the partner then gains nothing, the movement grows, and our investigators are exposed."
murder_mystery_partner_route_access_tt: "We border §Y[From.GetNameDef]§!, share a faction with it, or have military access through it."
murder_mystery_reinforce_derivative: "Reinforce [From.GetName]"
murder_mystery_reinforce_derivative_desc: "[From.GetNameDefCap] holds territory for the movement but fights with what it could seize. Rifles, support equipment and trained recruits from our own depots can keep it standing."
murder_mystery_reinforce_derivative_tt: "We send §Y[From.GetNameDef]§! rifles, support equipment and recruits from our own stockpile and manpower."
murder_mystery_reinforce_derivative_far_tt: "[From.GetNameDefCap] does not border us and has not promised obedience: getting the shipment through costs twice as much."
murder_mystery_reinforce_derivative_strain_tt: "If we have already reinforced another derivative recently, the cells feel the center playing favourites and Brotherhood Cohesion falls."
murder_mystery_reinforce_stockpile_tt: "Our stockpile and manpower can cover the shipment and its transport."
murder_mystery_derivative_priority_obedience: "Answer to the Center"
murder_mystery_derivative_priority_obedience_desc: "We hold this territory because the movement sent us. Accepting its orders brings its supplies, and its supervision."
murder_mystery_derivative_priority_obedience_tt: "We give up autonomy and take the Answering to the Center spirit. The central state can reinforce us as cheaply as a neighbour, wherever we are."
murder_mystery_derivative_priority_autonomy: "Govern Ourselves"
murder_mystery_derivative_priority_autonomy_desc: "The center is far away and its orders arrive late. Our own districts, our own defences and our own judgment will have to do."
murder_mystery_derivative_priority_autonomy_tt: "We gain autonomy and take the Governing Ourselves spirit, which strengthens our defence."
murder_mystery_derivative_priority_local_campaign: "Fight Our Own War"
murder_mystery_derivative_priority_local_campaign_desc: "The government we rose against is still standing next door. Our cadres want to finish it themselves, whatever the center prefers."
murder_mystery_derivative_priority_local_campaign_tt: "We take the Local Campaign spirit, which strengthens our attacks. The central state's Brotherhood Cohesion falls as one more derivative chooses its own war."
murder_mystery_derivative_priority_cooldown_tt: "Our last change of priority has settled in."
murder_mystery_priority_obedience_autonomy: "The derivative answers to the center"
murder_mystery_priority_autonomy_autonomy: "The derivative governs itself"
murder_mystery_detain_suspected_cells: "Detain Suspected Cell Members"
murder_mystery_detain_suspected_cells_desc: "Our detention system can hold anyone the police suspect. Mass arrests will break up the cell, but confessions taken that way poison the evidence, and every family that loses someone is a family the movement can recruit."
murder_mystery_detain_suspected_cells_tt: "The cell on our soil loses strength and is exposed.\nOur stability and the integrity of our evidence fall, and the movement's Network Reach grows."
murder_mystery_tighten_administrations: "Tighten the Administrations"
murder_mystery_tighten_administrations_desc: "The acting cabinets drift, the cell territories bargain, and orders from the center arrive late or not at all. The command can remind them who won the war."
murder_mystery_return_authority_to_cells: "Return Authority to the Cells"
murder_mystery_return_authority_to_cells_desc: "The cells fought to end rulers, not to serve new ones. Handing local power back to them keeps faith with the cause, at the cost of control."
murder_mystery_resolve_world_without_leaders_victory: "Resolve the Leaderless World"
murder_mystery_resolve_world_without_leaders_victory_desc: "End the campaign after every surviving government has been dismantled, absorbed, or spared under the movement's final settlement."

