MURDER_MYSTERY_EMERGENCY_COUNCIL_DESC: "A council of ministers that took collective charge of the government in the hours after the head of government was murdered. It governs by committee until the crisis is over."
MURDER_MYSTERY_ACTING_CABINET_NAME: "[This.GetAdjective] Acting Cabinet"
MURDER_MYSTERY_ACTING_CABINET_DESC: "The surviving ministers who hold the government together after the head of government was murdered by a foreign cell."
murder_mystery_emergency_council: "Emergency Council"
murder_mystery_emergency_council_desc: "Collective rule by the surviving ministers after a murder at the top of the state."
murder_mystery_acting_cabinet: "Acting Cabinet"
murder_mystery_acting_cabinet_desc: "A caretaker cabinet holding office after the head of government was murdered."
MURDER_MYSTERY_CELLS_WITHOUT_MASTERS_NAME: "The Cell Councils"
MURDER_MYSTERY_CELLS_WITHOUT_MASTERS_DESC: "A decentralized administration that distributes authority among autonomous local councils."
MURDER_MYSTERY_HIDDEN_HAND_SUCCESSOR_NAME: "The Directorate Successor"
MURDER_MYSTERY_HIDDEN_HAND_SUCCESSOR_DESC: "A successor chosen to preserve the central command while the movement becomes territorial."
MURDER_MYSTERY_CELLS_WITHOUT_MASTERS_SUCCESSOR_NAME: "The Council Successor"
MURDER_MYSTERY_CELLS_WITHOUT_MASTERS_SUCCESSOR_DESC: "A successor chosen to keep local councils aligned without restoring a single master."
MURDER_MYSTERY_NECESSARY_MASK_SUCCESSOR_NAME: "The Necessary Administrator"
MURDER_MYSTERY_NECESSARY_MASK_SUCCESSOR_DESC: "A successor who accepts the temporary office required to keep a pragmatic movement alive."

