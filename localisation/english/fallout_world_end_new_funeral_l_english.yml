chaosx.fallout.541.t: "A New Funeral"
chaosx.fallout.541.d: "Snowmelt has made the cemetery walls unsafe. The Deaths ledger counts thousands, while families from three districts bring different prayers, songs, and names to one heated hall. [ROOT.GetAirWinterGovernmentAuthority] must decide whether a shared rite can carry the dead, whether communities keep separate grounds, whether the state claims the ceremony, or whether speed becomes the law."
chaosx.fallout.541.a: "Build one civic rite"
chaosx.fallout.541.b: "Keep the rites separate"
chaosx.fallout.541.c: "Let the state conduct the ceremony"
chaosx.fallout.541.d_option: "Pass a rapid burial law"
chaosx.fallout.541.a.tt: "Spend [?constant:fallout_event_541_cost.civic_scrap|0] Scrap and [?constant:fallout_event_541_cost.civic_power|0] Power. The common rite will be judged after [?constant:fallout_event_541_timing.result_delay_days|0] days, with a second review after [?constant:fallout_event_541_timing.callback_delay_days|0] days."
chaosx.fallout.541.b.tt: "Spend [?constant:fallout_event_541_cost.separate_scrap|0] Scrap and [?constant:fallout_event_541_cost.separate_power|0] Power. Separate grounds protect local rites while the winter register is checked after [?constant:fallout_event_541_timing.result_delay_days|0] days."
chaosx.fallout.541.c.tt: "Spend [?constant:fallout_event_541_cost.ceremony_food|0] Food and [?constant:fallout_event_541_cost.ceremony_scrap|0] Scrap. The state ceremony will be judged after [?constant:fallout_event_541_timing.result_delay_days|0] days, with a second review after [?constant:fallout_event_541_timing.callback_delay_days|0] days."
chaosx.fallout.541.d_option.tt: "Spend [?constant:fallout_event_541_cost.burial_scrap|0] Scrap and [?constant:fallout_event_541_cost.burial_recognition|0] Recognition. Burial crews will work under one law while the country waits [?constant:fallout_event_541_timing.callback_delay_days|0] days for the lasting result."

chaosx.fallout.543.t: "A Common Civic Rite"
chaosx.fallout.543.success.d: "The heated hall held a single reading for the dead. District singers kept their own verses inside the rite, and [ROOT.GetAirWinterGovernmentOfficial] accepted a family correction without asking which prayer had been spoken first. The shared grounds reduced disease pressure and gave the living one place to return."
chaosx.fallout.543.partial.d: "The common rite reached the largest shelters, but the outer districts arrived with different lists. Families accepted one ceremony for the season while religious elders kept a second record in the snowmelt towns."
chaosx.fallout.543.failure.d: "The hall lost heat during the reading and the lists were carried into the street. Families fought over names and burial places, while wet ground and crowded shelters increased disease pressure."
chaosx.fallout.543.a: "Read the civic rite report"
chaosx.fallout.543.a.tt: "The ceremony result will shape family trust, religious tension, disease pressure, and the next memorial review."

chaosx.fallout.544.t: "Separate Grounds"
chaosx.fallout.544.success.d: "The river district, the old barracks, and the hill villages each marked their own ground. Custodians exchanged verified names at the gate, and [ROOT.GetAirWinterGovernmentAuthority] preserved the rites without making one community speak for another."
chaosx.fallout.544.partial.d: "Separate grounds protected the strongest communities, yet the road between them stayed closed. Families in the outer shelters received a name and a burial place only after several weeks of argument over who could vouch for the dead."
chaosx.fallout.544.failure.d: "The separate grounds became rival borders. Custodians withheld names from one another, food was spent on guards instead of mourners, and the unmarked dead remained beside the thawing road."
chaosx.fallout.544.a: "Read the separate rites report"
chaosx.fallout.544.a.tt: "The separate rites result will shape family trust, religious tension, disease pressure, and the next memorial review."

chaosx.fallout.545.t: "The State Ceremony"
chaosx.fallout.545.success.d: "[ROOT.GetAirWinterGovernmentOfficial] stood beneath the cracked civic seal and read every district name that could be verified. The state accepted responsibility for the grounds, paid the keepers in food, and kept the ceremony open to families who had no surviving papers."
chaosx.fallout.545.partial.d: "The state ceremony made the capital legible, but its order stopped at the patrol roads. Provincial families heard their dead read as a single column and kept private rites when the official list left a household blank."
chaosx.fallout.545.failure.d: "The state seized the ceremony and lost control of the crowd. Religious leaders left the hall, the guard sealed the doors, and a public burial became a grievance that will outlast the thaw."
chaosx.fallout.545.a: "Read the state ceremony report"
chaosx.fallout.545.a.tt: "The state ceremony result will shape family trust, religious tension, disease pressure, and the next memorial review."

chaosx.fallout.546.t: "Rapid Burial Law"
chaosx.fallout.546.success.d: "The burial law gave crews a clear route through the frozen lanes. Each grave received a marked token and a district witness, so speed did not erase the names that families carried from shelter to shelter."
chaosx.fallout.546.partial.d: "The crews cleared the hospital yard and the station embankment, but the law reached the villages late. Families found tokens where they expected a service, and the local clerks kept a second list against the next audit."
chaosx.fallout.546.failure.d: "The law sent crews into ground that could not be opened safely. Markers vanished in the thaw, workers fell ill, and families returned to a field where the official count no longer matched the graves."
chaosx.fallout.546.a: "Read the burial law report"
chaosx.fallout.546.a.tt: "The rapid burial result will shape family trust, religious tension, disease pressure, and the next memorial review."

chaosx.fallout.551.t: "The Cemetery After Thaw"
chaosx.fallout.551.success.d: "The cemetery walls held through the thaw. One correction route now joins the shelter rolls, district witnesses, and the memorial stones, and [ROOT.GetAirWinterGovernmentOfficial] can answer a family without opening three separate ledgers."
chaosx.fallout.551.partial.d: "The follow-up found a working register in the capital and contested memory at the edges. The grounds are marked, yet the next winter will reopen every question that the road crews could not carry home."
chaosx.fallout.551.failure.d: "The follow-up found flooded graves and a correction desk without power. Families carried duplicate papers through the cold, disease pressure returned to the shelters, and [ROOT.GetAirWinterGovernmentAuthority] could not promise that the next list would be complete."
chaosx.fallout.551.a: "Close the funeral review"
chaosx.fallout.551.a.tt: "Record the lasting funeral memory and release the delayed Fallout receipts."

fallout.event_log.new_funeral.name: "A New Funeral"
fallout.event_log.new_funeral.detail: "[GetFalloutEvent541EventLogDetail]"
fallout.event_log.new_funeral.detail.civic_success: "A common civic rite linked district witnesses to the Deaths ledger and lowered disease pressure."
fallout.event_log.new_funeral.detail.civic_partial: "A common civic rite reached the largest shelters while local lists remained disputed."
fallout.event_log.new_funeral.detail.civic_failure: "A common civic rite failed in the cold and left families divided over names and graves."
fallout.event_log.new_funeral.detail.separate_success: "Separate grounds preserved local rites while custodians exchanged verified names."
fallout.event_log.new_funeral.detail.separate_partial: "Separate grounds protected the strongest communities but left outer shelters waiting for witnesses."
fallout.event_log.new_funeral.detail.separate_failure: "Separate grounds became rival borders and withheld names from one another."
fallout.event_log.new_funeral.detail.ceremony_success: "The state ceremony accepted responsibility for the grounds and opened the register to families without papers."
fallout.event_log.new_funeral.detail.ceremony_partial: "The state ceremony made the capital legible while provincial families kept private rites."
fallout.event_log.new_funeral.detail.ceremony_failure: "The state ceremony became a sealed grievance after the guard lost the crowd."
fallout.event_log.new_funeral.detail.burial_success: "A rapid burial law gave crews a marked route and preserved district witnesses."
fallout.event_log.new_funeral.detail.burial_partial: "Rapid crews cleared the largest yards while villages kept a second list for the next audit."
fallout.event_log.new_funeral.detail.burial_failure: "Rapid crews lost markers in the thaw and the official count no longer matched the graves."
fallout.event_log.new_funeral.detail.callback_success: "The thaw left one correction route for names, shelter rolls, and memorial stones."
fallout.event_log.new_funeral.detail.callback_partial: "The capital register worked while contested local memory remained at the edge of the roads."
fallout.event_log.new_funeral.detail.callback_failure: "Flooded graves and a powerless correction desk reopened disease pressure and family disputes."

fallout_new_funeral_civic_rite: "Common Civic Rite"
fallout_new_funeral_civic_rite_desc: "A shared rite gives families one heated hall, one correction route, and a public place to remember the dead."
fallout_new_funeral_separate_rites: "Separate Rites"
fallout_new_funeral_separate_rites_desc: "Separate grounds preserve local prayers and require custodians to exchange verified names at the gate."
fallout_new_funeral_state_ceremony: "State Ceremony"
fallout_new_funeral_state_ceremony_desc: "The state accepts responsibility for the grounds and keeps the ceremony open to families without papers."
fallout_new_funeral_rapid_burial: "Rapid Burial Law"
fallout_new_funeral_rapid_burial_desc: "Burial crews receive a marked route and a witness token so speed does not erase the dead."
fallout_new_funeral_ledger_maintained: "Maintained Funeral Ledger"
fallout_new_funeral_ledger_maintained_desc: "Shelter rolls, district witnesses, and memorial stones share one correction route after the thaw."
fallout_new_funeral_register_backlog: "Funeral Register Backlog"
fallout_new_funeral_register_backlog_desc: "Unverified names remain in a growing backlog while disease pressure and family disputes return to the shelters."
