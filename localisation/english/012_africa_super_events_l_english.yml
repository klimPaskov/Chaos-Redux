l_english:
 chaosx_super_event.101.t: "THE CONTINENT TAKES ITS SEAT"
 chaosx_super_event.101.q: "\"building up for themselves a great nation in Africa.\"\n §Y-Marcus Garvey, Africa for the Africans, Negro World, 22 April 1922-§!"
 chaosx_super_event.101.a: "The continent will answer for itself."
 chaosx_super_event.101.d: "[africa_host.GetNameDef] has brought every required region into a settled continental order. [africa_host.GetAfricaSuperEventConstitutionClause] [africa_host.GetAfricaSuperEventUnresolvedCostClause]"
 chaosx_super_event.102.t: "THE MAPMAKERS RETURN"
 chaosx_super_event.102.q: "\"to enable them, if need be, to make good any claims of their own.\"\n §Y-General Act of the Conference at Berlin, Article 34, 26 February 1885-§!"
 chaosx_super_event.102.a: "Africa answers through its own institutions."
 chaosx_super_event.102.d: "[africa_host.GetNameDef] has opened the Scramble docket. [africa_host.GetAfricaSuperEventScrambleResponseClause] Foreign governments must decide whether to recognise the African settlement, impose sanctions, issue an ultimatum, or prepare an expedition."
 chaosx_super_event.103.t: "CONTINENTS UNDER ARMS"
 chaosx_super_event.103.q: "\"War is a mere continuation of policy by other means.\"\n §Y-Carl von Clausewitz, On War, Book I, Chapter I, J. J. Graham translation-§!"
 chaosx_super_event.103.a: "The arguments have reached the front."
 chaosx_super_event.103.d: "Recognition did not end rivalry. [africa_host.GetAfricaSuperEventContinentalWarClause] The Charter League must defend a negotiated order while every other continent decides whether to bargain, arm, or build a competing one."
 chaosx_super_event.104.t: "ONE WORLD REMAINS"
 chaosx_super_event.104.q: "\"Nothing beside remains.\"\n §Y-Percy Bysshe Shelley, Ozymandias, first published 1818-§!"
 chaosx_super_event.104.a: "The last border is an archive."
 chaosx_super_event.104.d: "The terminal settlement has closed the last continental rivalries. [africa_host.GetNameDef] reached The World through [africa_host.GetAfricaSuperEventTerminalProtocolClause]. Its constitutional record, surviving obligations, and resolved package dispositions now define the final identity."

 africa_super_event_constitution_federal_union: "The Federal Union route gives member governments a written voice while sharing executive authority, resources, command, withdrawal, and crisis powers through ratified clauses."
 africa_super_event_constitution_continental_republic: "The Continental Republic route makes representation and public institutions the source of authority, with executive power and resource control answerable to a continent-wide settlement."
 africa_super_event_constitution_council_of_crowns: "The Council of Crowns route binds decorated sovereign houses into a negotiated concert, balancing royal executive power with member representation, withdrawal rights, and shared command."
 africa_super_event_constitution_peoples_union: "The People's Union route places popular representation and common resources at the centre, then tests executive command against withdrawal rights and public crisis safeguards."
 africa_super_event_constitution_military_continentalism: "The Military Continentalism route concentrates command and emergency authority, while its settlement records the representation, withdrawal, and crisis costs that concentration creates."
 africa_super_event_constitution_continental_confederation: "The Continental Confederation route keeps sovereignty with its members, exchanging a lighter executive for negotiated resources, common defence, withdrawal protection, and unanimity under crisis."
 africa_super_event_constitution_ancestral_covenant: "The Ancestral Covenant route treats living institutions, ecological duties, and inherited legitimacy as constitutional resources, binding command and integration to consent and repair."
 africa_super_event_constitution_uncommitted: "The constitutional route remains under public negotiation; no terminal identity can erase its unratified clauses."
 africa_super_event_cost_postwar_review: "A postwar constitutional review remains open, so the settlement still owes a public decision on emergency authority and the affected governments."
 africa_super_event_cost_autonomy_review: "An autonomy review remains open, leaving the distribution of local and continental powers subject to another recorded decision."
 africa_super_event_cost_sponsorship_overextension: "The sponsorship ledger is carrying an overextension burden, and its remaining obligations still demand visible payment or renegotiation."
 africa_super_event_cost_package_obligation: "At least one continental package still carries an obligation, successor review, or breakup docket that has not been closed."
 africa_super_event_cost_clean_ledger: "The remaining ledger is open, but no obligation is presently overdue."
 africa_super_event_scramble_expedition_named: "[africa_scramble_last_response_actor.GetNameDef] has moved from pressure to an expedition plan; [africa_host.GetNameDef] must answer with a defended settlement or war."
 africa_super_event_scramble_ultimatum_named: "[africa_scramble_last_response_actor.GetNameDef] has issued an ultimatum. [africa_host.GetNameDef] has the public choice between answering its terms and preparing the Charter League for intervention."
 africa_super_event_scramble_sanctions_named: "[africa_scramble_last_response_actor.GetNameDef] has joined the sanctions pressure. [africa_host.GetNameDef] is answering through recognition work, counter-trade, and an anti-sanctions network."
 africa_super_event_scramble_recognition_named: "[africa_scramble_last_response_actor.GetNameDef] has recognised the African settlement. [africa_host.GetNameDef] records that recognition while keeping the remaining foreign responses open."
 africa_super_event_scramble_open_named: "[africa_scramble_lead_participant.GetNameDef] is among the foreign capitals now testing [africa_host.GetNameDef]'s protection-first Charter League with recognition, sanctions, and demands."
 africa_super_event_scramble_open_unattributed: "Foreign capitals are testing [africa_host.GetNameDef]'s protection-first Charter League with recognition, sanctions, and demands."
 africa_super_event_continental_war_named: "[africa_world_last_continental_war_target.GetNameDef] is the recorded rival in a continental war whose objective and settlement remain written in the world-order ledger."
 africa_super_event_continental_war_rival_bloc: "A rival continental bloc has refused the negotiated order, and the resulting war is being fought over written union, autonomy, and settlement terms."
 africa_super_event_continental_war_open: "A continental war has opened around a recorded rival, with union, autonomy, and settlement terms still contested rather than erased."
 africa_super_event_terminal_unanimous_union: "a unanimous union protocol accepted by every required continental actor"
 africa_super_event_terminal_last_standing: "a last-standing settlement after the recorded continental rivals were defeated"
 africa_super_event_terminal_continental_campaign: "a continental campaign whose final war and settlement were entered into the public ledger"
 africa_super_event_terminal_protocol_recorded: "a recorded terminal protocol of consent, settlement, and proof"
