l_english:
 chaosx.fallout.422.t: "The Ship That Will Not Dock"
 chaosx.fallout.422.d: "A rust-streaked vessel lies outside the harbour chain with fever aboard, families below deck, and a manifest that names clinics, machine shops, and a coastal radio crew. [This.GetName] must decide whether the port becomes a refuge, a testing ground, a neutral tow, or a seizure."
 chaosx.fallout.422.a: "Dock under quarantine"
 chaosx.fallout.422.b: "Anchor and test"
 chaosx.fallout.422.c: "Tow it to neutral water"
 chaosx.fallout.422.d: "Seize the manifest"
 chaosx.fallout.422.a.tt: "Spend food, recognition, and cohesion to bring passengers into a sealed harbour ward while medicine teams work."
 chaosx.fallout.422.b.tt: "Spend food, recognition, and cohesion to test the vessel at anchor before any passenger enters the port."
 chaosx.fallout.422.c.tt: "Spend food, recognition, and cohesion to pay a neutral crew to tow the vessel away from the harbour approach."
 chaosx.fallout.422.d.tt: "Spend food, recognition, and cohesion to take the cargo list and force the vessel under state custody."
 chaosx.fallout.424.t: "The Harbour Decision"
 chaosx.fallout.424.dock_quarantine.success.d: "The harbour chain opens one berth at a time. Patients enter the sealed ward, families receive names in the ration book, and the crew keeps its radio log under joint custody."
 chaosx.fallout.424.dock_quarantine.partial.d: "The first berth holds, but the second ward runs out of filters before the last families disembark. The port gains workers and a promise that still depends on daily medicine."
 chaosx.fallout.424.dock_quarantine.failure.d: "A fever alarm closes the gangway after the first shift. The vessel leaves with its families and the harbour inherits a grievance that every coastal council can hear."
 chaosx.fallout.424.anchor_test.success.d: "The testing crews find a clean engine room and a contained ward. The vessel remains outside the breakwater, but the port opens a measured exchange of medicines and charts."
 chaosx.fallout.424.anchor_test.partial.d: "The samples are readable while the quarantine stores thin. The ship remains at anchor and the harbour learns to trust a timetable more than a promise."
 chaosx.fallout.424.anchor_test.failure.d: "The first samples contradict the second set. The captain weighs anchor before the laboratory can finish, leaving the port with an empty berth and a damaged reputation."
 chaosx.fallout.424.tow_neutral.success.d: "A neutral tug takes the vessel through the shoals to a sheltered roadstead. The harbour avoids an outbreak and earns a maritime compact that keeps the sea lane open."
 chaosx.fallout.424.tow_neutral.partial.d: "The tow reaches safer water after a cable failure. Cargo survives, passengers wait, and the port pays for distance with a colder relationship to the settlements offshore."
 chaosx.fallout.424.tow_neutral.failure.d: "The tug loses the channel lights in ash rain. The vessel drifts back toward the harbour, and the failed promise becomes a reason for armed patrols on both sides of the bay."
 chaosx.fallout.424.seize_manifest.success.d: "State officers take the manifest, secure the clinic crates, and assign the radio crew to a public board. The port gains tools and loses the presumption that foreign arrivals choose their own terms."
 chaosx.fallout.424.seize_manifest.partial.d: "The cargo ledger is secured, though several crates are missing before the seals dry. The government gains supplies and a coastal faction that remembers the seizure."
 chaosx.fallout.424.seize_manifest.failure.d: "The crew burns the manifest before the boarding party reaches the bridge. The ship escapes with its names and the harbour pays for a seizure that produced neither cargo nor trust."
 chaosx.fallout.424.a: "Record the harbour compact"
 chaosx.fallout.424.a.tt: "Apply the harbour result, record maritime memory, and schedule the first seasonal review."
 chaosx.fallout.426.t: "The First Harbour Review"
 chaosx.fallout.426.success.d: "Months later the berth ledger still matches the clinic roster. The radio crew trains local operators, the quarantine ward has a routine, and the coast can name what it owes the ship."
 chaosx.fallout.426.partial.d: "The review finds a working berth and an unfinished argument over cargo rights. The vessel changed the coast, but no council agrees whether that change was welcome."
 chaosx.fallout.426.failure.d: "The review finds empty berths and patrol orders where the compact should be. Families have scattered, the radio is silent, and the harbour remembers the ship as a warning."
 chaosx.fallout.426.a: "Close the harbour record"
 chaosx.fallout.426.a.tt: "Resolve the review, preserve its maritime memory, and release the scheduler cleanup receipt."
 fallout.event_log.ship_that_will_not_dock.name: "The Ship That Will Not Dock"
 fallout.event_log.ship_that_will_not_dock.detail: "[This.GetName] decided what the vessel and its manifest would mean to the coast."
 fallout.event_log.ship_that_will_not_dock.dock_quarantine_success: "The vessel entered a sealed berth and its families were recorded by the receiving port."
 fallout.event_log.ship_that_will_not_dock.dock_quarantine_partial: "The ship entered in stages while the quarantine stores narrowed."
 fallout.event_log.ship_that_will_not_dock.dock_quarantine_failure: "The gangway closed and the vessel carried its grievance back to sea."
 fallout.event_log.ship_that_will_not_dock.anchor_test_success: "Testing at anchor opened a measured exchange of charts and medicine."
 fallout.event_log.ship_that_will_not_dock.anchor_test_partial: "The samples held while the ship remained outside the breakwater."
 fallout.event_log.ship_that_will_not_dock.anchor_test_failure: "Contradictory samples sent the vessel away before the harbour could decide."
 fallout.event_log.ship_that_will_not_dock.tow_neutral_success: "A neutral tug moved the vessel and preserved the coastal sea lane."
 fallout.event_log.ship_that_will_not_dock.tow_neutral_partial: "The tow reached safety after a cable failure and a colder maritime bargain."
 fallout.event_log.ship_that_will_not_dock.tow_neutral_failure: "The failed tow returned the vessel to the harbour approach and hardened patrol lines."
 fallout.event_log.ship_that_will_not_dock.seize_manifest_success: "The state secured the manifest, clinic cargo, and radio crew under public custody."
 fallout.event_log.ship_that_will_not_dock.seize_manifest_partial: "The cargo ledger survived, though several crates disappeared before the seals dried."
 fallout.event_log.ship_that_will_not_dock.seize_manifest_failure: "The crew burned the manifest and left the harbour with its trust undone."
 fallout.event_log.ship_that_will_not_dock.callback_success: "The harbour review found a durable berth, clinic routine, and public radio compact."
 fallout.event_log.ship_that_will_not_dock.callback_partial: "The review found a working berth and an unresolved cargo-rights dispute."
 fallout.event_log.ship_that_will_not_dock.callback_failure: "The review found empty berths and patrol orders where the compact should have been."
