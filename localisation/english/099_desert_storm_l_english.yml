chaosx.nr99.1.t: "Sandstorm"

chaosx.nr99.2.t: "Sandstorm"
chaosx.nr99.2.d: "Dust is closing over the airfields and road columns. Local authorities are covering wells, grounding flights, and sending supply traffic toward marked routes before visibility fails."
chaosx.nr99.2.a: "Open the dust offices."
