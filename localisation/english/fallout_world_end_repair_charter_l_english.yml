chaosx.fallout.859.t: "The Repair Charter"
chaosx.fallout.859.opening.d: "The First Regional Standard made every table agree, but it did not tell a mechanic who pays for the journey. The Manchurian Reactor Keeps has four repair crews, three ash roads, and one winter of spare parts. A charter must decide whether crews travel as a public service, as licensed houses, under a council seal, or behind the perimeter corps."
chaosx.fallout.859.a: "Issue an open repair charter"
chaosx.fallout.859.a.tt: "Spend Food 2, Scrap 1, and Recognition 2 to let every trained crew use the shared repair tables. Open crews reach more settlements, but the Keeps cannot control every route."
chaosx.fallout.859.b: "Commission licensed repair houses"
chaosx.fallout.859.b.tt: "Spend Power 2, Scrap 2, and Recognition 1 to license workshops that meet the Keeps' measure and parts rules. Licensed houses protect quality, but each settlement must bargain for service."
chaosx.fallout.859.c: "Bind crews to a council charter"
chaosx.fallout.859.c.tt: "Spend Fuel 1, Medicine 2, and Recognition 2 to give eastern settlements a shared repair council. The council trains local crews, but every signatory can delay an urgent route."
chaosx.fallout.859.d: "Reserve the charter for perimeter corps"
chaosx.fallout.859.d.tt: "Spend Medicine 1, Fuel 2, and Recognition 2 to reserve the best crews for protected generators, clinics, and radio corridors. Perimeter repairs improve, while civilian roads wait."
chaosx.fallout.860.t: "The Repair Charter"
chaosx.fallout.861.t: "A Road for Every Repair"
chaosx.fallout.861.open_charter.success.d: "The Keeps issued a public repair charter and trained crews from the river settlements. Their stamped parts travelled with the winter convoys, and a clinic outside the walls received a pump before its old motor failed."
chaosx.fallout.861.open_charter.partial.d: "The public charter reached the nearest settlements, but two crews used different names for the same bearing. The Keeps kept the route open and sent a senior mechanic to teach the shared parts ledger."
chaosx.fallout.861.open_charter.failure.d: "Open crews left with public tables but no agreed route duty. A convoy spent its fuel searching for a missing workshop, and the outer settlements now ask for payment before they open their doors."
chaosx.fallout.861.licensed_houses.success.d: "Licensed repair houses returned sealed parts and clean service records to the Keeps. Their workshops earned a stable margin, while the rail depots received repairs that matched the regional table without another inspection."
chaosx.fallout.861.licensed_houses.partial.d: "The licensed houses protected the best tools, but one outer crew lost its permit when a convoy arrived late. The Keeps granted an emergency license and kept the main charter behind the workshop register."
chaosx.fallout.861.licensed_houses.failure.d: "A licensed house withheld a bearing record from a settlement that could not pay on time. The clinic pump failed during the dispute, and the neighboring councils now treat the Keeps as a toll gate on every repair road."
chaosx.fallout.861.council_charter.success.d: "The eastern repair council signed one charter for crew training, parts seals, and route duty. Each settlement can request a change, yet a common roster now sends the nearest qualified mechanic through the ash."
chaosx.fallout.861.council_charter.partial.d: "The council agreed on crew training and parts seals, but three settlements still keep private route rosters. The Keeps accepted the delay and sent a joint inspection crew before the next cold convoy."
chaosx.fallout.861.council_charter.failure.d: "The council spent its first session arguing over whose crew counted as qualified. No common roster reached the outer roads, and each settlement guarded its own tools while the winter stores waited."
chaosx.fallout.861.perimeter_corps.success.d: "Perimeter corps received a protected charter for generators, field clinics, and radio corridors. Their repair crews restored two guarded substations, while civilian mechanics received safe fragments of the parts ledger."
chaosx.fallout.861.perimeter_corps.partial.d: "The protected crews kept the radio corridor alive, but a civilian pump team could not obtain the matching service note. The Keeps released a narrow safety sheet and kept the remaining charter behind the gate."
chaosx.fallout.861.perimeter_corps.failure.d: "Secrecy hid a faulty parts tolerance from the crews expected to repair it. Two perimeter workshops blamed one another for the failure, and civilian councils now refuse any service they cannot inspect."
chaosx.fallout.861.a: "Record the repair charter"
chaosx.fallout.861.a.tt: "Record the delayed charter result, apply its Air Winter, Supply Access, route, and recognition effects, and open the later charter audit."
chaosx.fallout.862.t: "The Repair Charter"
chaosx.fallout.863.t: "The Charter Audit"
chaosx.fallout.863.success.d: "The audit found that the eastern crews could share a duty roster without erasing local repair practice. The Keeps kept a named charter board, and every revision will carry a visible crew and parts record."
chaosx.fallout.863.partial.d: "The audit saved the common parts seals and training notes, but one outer crew still follows a private route roster. The Technate accepted a narrow exception while the council prepares a conversion team."
chaosx.fallout.863.failure.d: "The audit found no trusted way to reconcile the private rosters with the public charter. The Keeps can still repair its own grid, but neighboring settlements now charge for every escort and parts conversion."
chaosx.fallout.863.a: "Close the charter audit"
chaosx.fallout.863.a.tt: "Apply the delayed audit, write the durable repair memory, and release the reserved state and neighboring receipts."
chaosx.fallout.864.t: "The Repair Charter"
