chaosx.fallout.880.t: "Clinic or Council"
chaosx.fallout.880.opening.d: "After the Congo Green Basin accepts a public name, its clinic board keeps the old triage slate while ward captains demand a voice. A foreign witness waits at the pump house with forms that assume one authority. The Basin must decide who may authorize care, publish intake rules, and answer for a refusal."
chaosx.fallout.880.a: "Give the clinic board oversight"
chaosx.fallout.880.a.tt: "Spend Food 1, Medicine 4, and Recognition 2 to let the clinic board publish binding care rules and keep one accountable medical register."
chaosx.fallout.880.b: "Elect a ward council"
chaosx.fallout.880.b.tt: "Spend Scrap 2, Power 2, and Recognition 3 to place care budgets under a ward ballot with a public ledger."
chaosx.fallout.880.c: "Bind board and council together"
chaosx.fallout.880.c.tt: "Spend Fuel 2 and Recognition 2, then accept a Cohesion cost, to issue paired clinic and ward seals for every care decision."
chaosx.fallout.880.d: "Reject the outside medicine office"
chaosx.fallout.880.d.tt: "Spend Food 3, Medicine 1, Fuel 1, and Recognition 1 to refuse the foreign office and build a Basin-only care register."
chaosx.fallout.881.t: "Clinic or Council"
chaosx.fallout.882.t: "The Basin Sets Its Care Rule"
chaosx.fallout.882.medical_oversight.success.d: "The clinic board publishes one intake slate and signs it beside the river pumps. Ward captains can appeal, but the board answers every appeal with a named clerk, a ration count, and a care record that the foreign witness can read."
chaosx.fallout.882.medical_oversight.partial.d: "The clinic board keeps the medicine ledger coherent in the central ward, while two outlying pumps continue to use older forms. The Basin has an accountable care office, though its authority still ends at the next flooded road."
chaosx.fallout.882.medical_oversight.failure.d: "The board took custody of the medicine stores but never agreed on an intake rule. Families queue under three competing slates, and the foreign witness records a clinic that can count supplies without deciding whom it serves."
chaosx.fallout.882.elected_council.success.d: "Ward delegates open the medicine ledger at the council table and tie every request to a named district. The clinic board keeps its skill, yet no outside office can claim that care belongs to one closed profession."
chaosx.fallout.882.elected_council.partial.d: "The ward ballot funds two clinics and leaves the pump-house board intact. The Basin gains a public care budget, but remote wards still send runners before their votes are counted."
chaosx.fallout.882.elected_council.failure.d: "The council turned every intake question into a boundary vote. Medicine stayed in its crates while delegates argued over whose ward deserved the first seal, and the foreign witness left with an empty form."
chaosx.fallout.882.joint_rule.success.d: "The paired seal works. A clinic clerk records the need, a ward delegate records consent, and both names travel with the supply cart. The Basin can answer the foreign witness without giving either office unchecked power."
chaosx.fallout.882.joint_rule.partial.d: "The paired rule holds in the river wards, but the hill clinic accepts only one signature. The Basin has a workable compromise and a visible exception that the next generation must settle."
chaosx.fallout.882.joint_rule.failure.d: "Two seals became two queues. The board blamed the council for delay, the council blamed the board for secrecy, and the same family carried its request between offices until the medicine spoiled."
chaosx.fallout.882.reject_outside_medicine.success.d: "The Basin rejects the foreign office without closing its doors to practical help. Its own register names supplies, consent, and duty in river terms, and the witness accepts a copy because every refusal has a recorded reason."
chaosx.fallout.882.reject_outside_medicine.partial.d: "The outside office is refused at the central pump, while two wards quietly copy its forms to keep deliveries moving. The Basin has its own care rule, but its independence still depends on paper it says it does not need."
chaosx.fallout.882.reject_outside_medicine.failure.d: "The refusal became a quarrel with every neighboring clerk. Local medicine still moves, yet no one can prove which ward authorized it, and the Basin's public name now arrives with a warning about care."
chaosx.fallout.882.a: "Enter the care rule"
chaosx.fallout.882.a.tt: "Apply the graded clinic result, record its care-governance memory, and schedule the delayed first-season review."
chaosx.fallout.884.t: "The Care Rule Faces Its First Season"
chaosx.fallout.884.success.d: "The delayed review finds clinic clerks and ward delegates using the same rule when the first cold rain closes the southern road. The Congo Green Basin can answer a foreign witness in its own voice, and care no longer depends on an unrecorded exception."
chaosx.fallout.884.partial.d: "The delayed review keeps a usable care rule alive, though the hill clinic and river wards still interpret one clause differently. The Basin has a public answer and a dispute that can be carried into the next generation."
chaosx.fallout.884.failure.d: "The delayed review finds the care rule split between board seals and council ledgers. The Basin remembers choosing its authority, but families now carry duplicate forms because no office trusts the other to close a case."
chaosx.fallout.884.a: "Close the care review"
chaosx.fallout.884.a.tt: "Apply the delayed first-season outcome, record the final care-governance memory, and release the reserved state and witness rows."
