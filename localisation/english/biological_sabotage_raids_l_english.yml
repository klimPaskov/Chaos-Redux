bio_sabotage_raid_failure_actor_tt: "The raid fails before a viable biological release. The reserved payload and support equipment are lost, and the attempt can still leave evidence."
bio_sabotage_raid_failure_target_tt: "The selected state avoids a viable biological release, but the failed penetration can still produce evidence and political consequences."
bio_sabotage_raid_partial_actor_tt: "The raid reaches only part of the selected supply-chain network. The agent enters its ordinary incubation, detection, spread, treatment, death, contamination, medical-saturation, evidence, attribution, and Condemnation lifecycle."
bio_sabotage_raid_partial_target_tt: "Part of the selected state's supply-chain network is contaminated. The biological lifecycle begins at reduced intensity."
bio_sabotage_raid_success_actor_tt: "The raid establishes a biological supply-chain release in the selected state. The agent's potency profile determines the resulting lifecycle; the native delivery odds are shared across agents."
bio_sabotage_raid_success_target_tt: "The selected state enters the biological incubation, detection, spread, treatment, death, contamination, medical-saturation, evidence, attribution, and Condemnation lifecycle."
bio_sabotage_raid_critical_actor_tt: "The raid achieves a highly effective supply-chain penetration. The selected agent enters the shared biological lifecycle at its highest ordinary delivery intensity."
bio_sabotage_raid_critical_target_tt: "The selected state suffers the strongest ordinary supply-chain penetration result for the raid, with agent potency determining the later biological effects."
