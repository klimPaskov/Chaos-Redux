biological_sabotage_raid_available_tooltip: "Requires Operational Chemical Readiness, a completed agent project, authorized biological use policy, an authenticated CBRN program, a valid enemy-held state, and no active biological sabotage cooldown or operation."
tooltip_raid_category_biological_sabotage_raids: "§YBiological Supply-Chain Raids§!\nArmy-led raids against an exact enemy-held state containing a viable supply-chain target. Tularemia, Anthrax, Plague, and Smallpox share the same native delivery odds; their potency changes the biological lifecycle after release. A raid reserves its listed payload and support equipment before preparation."
raid_target_name_biological_sabotage_state: "Supply-chain biological raid in $LOCATION$"

