l_english:
  chaosx.fallout.684.t: "The First Red Line"
  chaosx.fallout.684.desc: "The Quarantine State has marked a settlement at the edge of the ash belt. Its clinic reports fever, shelter crowding, and a supply road that cannot serve every household. The cordon must be a law people can live with, not a line that exists only on a map."
  chaosx.fallout.684.a: "Close the road and hold the cordon"
  chaosx.fallout.684.a.tt: "Spend medicine, fuel, and recognition to establish a strict exclusion zone. A strong result sharply reduces disease, but a breach will damage trust and the state's supply."
  chaosx.fallout.684.b: "Open medical checkpoints"
  chaosx.fallout.684.b.tt: "Spend medicine, scrap, and power to screen every crossing. A strong result improves public health and recognition while keeping the road in use."
  chaosx.fallout.684.c: "Move the exposed families under escort"
  chaosx.fallout.684.c.tt: "Spend medicine, fuel, and shelter capacity to move the most exposed households. A strong result protects shelter and supply, but a failed convoy leaves the settlement divided."
  chaosx.fallout.684.d: "Let each ward police its own street"
  chaosx.fallout.684.d.tt: "Spend food, medicine, and recognition on ward councils. A strong result builds local compliance and cohesion, though disease relief is slower."
  chaosx.fallout.686.t: "The Red Line Holds"
  chaosx.fallout.686.strict.success.d: "The cordon officers kept the ash road closed without abandoning the clinic. Fever reports fell, the quarantine ledger gained credibility, and the settlement's supply trucks reached the inner wards."
  chaosx.fallout.686.strict.partial.d: "The road was closed, but two night crossings and a shortage of masks weakened the order. The clinic has time to work, although the wards no longer agree on who bears the burden."
  chaosx.fallout.686.strict.failure.d: "The cordon broke before the second medical watch. Families slipped through the ash road, the clinic lost its medicine crates, and the settlement now treats the quarantine seal as a threat."
  chaosx.fallout.686.checkpoints.success.d: "The checkpoint teams made the road usable without making it careless. Nurses logged every fever case, the power board kept the lamps alive, and the Quarantine State earned recognition from its own wards."
  chaosx.fallout.686.checkpoints.partial.d: "The checkpoints caught the worst cases, but the scrap shortage forced long queues in the frost. The road remains open, though the guards and clinic staff now distrust one another."
  chaosx.fallout.686.checkpoints.failure.d: "The checkpoint lamps went dark and the registers froze in the ash. The road became a corridor for infection, while the clinic spent its last reserve repairing broken equipment."
  chaosx.fallout.686.evacuation.success.d: "The escorted move carried the exposed households into prepared shelter before the next cold front. The empty homes can be cleaned, the supply route is clearer, and the families still believe the order was made for them."
  chaosx.fallout.686.evacuation.partial.d: "The convoy moved many families, but not the ones from the lowest ward. Shelter gained breathing room, while the unfinished list now follows the Quarantine State through every council meeting."
  chaosx.fallout.686.evacuation.failure.d: "The convoy turned back at the frozen bridge. Fuel was lost, the receiving ward had no beds, and the exposed families returned to streets where no one accepts responsibility for the next case."
  chaosx.fallout.686.self_control.success.d: "Ward captains kept their own streets clean and shared names with the clinic before rumours could harden. The disease eased more slowly, but the people now treat the red line as a promise made by neighbours."
  chaosx.fallout.686.self_control.partial.d: "The ward councils held their meetings, but the outer lanes ignored two clinic notices. Cohesion survived, while the ash and fever continued to press against the settlement's limited shelter."
  chaosx.fallout.686.self_control.failure.d: "The ward councils became rival authorities. Medicine was hidden, the street lists contradicted one another, and the first red line dissolved into a series of private warnings."
  chaosx.fallout.686.a: "Read the clinic report"
  chaosx.fallout.686.a.tt: "The result is recorded in the Quarantine State's cause memory and a delayed callback will review whether the settlement kept the line."
  chaosx.fallout.688.t: "The Line's First Winter"
  chaosx.fallout.688.success.d: "Six months later the clinic still has a register, the road crews still know which gate to use, and the wards have turned the first cordon into a practical health law. The Quarantine State can now negotiate from memory instead of panic."
  chaosx.fallout.688.partial.d: "The cordon remains in place, but each new case reopens the old argument over movement and medicine. The settlement has learned a procedure, not yet a common purpose."
  chaosx.fallout.688.failure.d: "The red line has become a scar. The clinic is short of medicine, the supply road is distrusted, and ward captains now keep their own lists rather than answer the Quarantine State."
  chaosx.fallout.688.a: "Close the first case file"
  chaosx.fallout.688.a.tt: "Close the delayed memory and release the coordinator's cleanup receipt."
  fallout.event_log.first_red_line.name: "The First Red Line"
  fallout.event_log.first_red_line.detail: "[GetFalloutEvent684EventLogDetail]"
  fallout.event_log.first_red_line.detail.choice_strict: "The Quarantine State closed a winter road and held an internal exclusion zone around a fever-struck settlement."
  fallout.event_log.first_red_line.detail.choice_checkpoints: "The Quarantine State opened medical checkpoints so the ash road could carry supplies while nurses screened each crossing."
  fallout.event_log.first_red_line.detail.choice_evacuation: "The Quarantine State escorted exposed families toward prepared shelter before the next cold front."
  fallout.event_log.first_red_line.detail.choice_self_control: "The Quarantine State gave ward captains responsibility for street lists, clinic notices, and local compliance."
  fallout.event_log.first_red_line.detail.strict_success: "The strict cordon reduced disease and made the quarantine seal credible."
  fallout.event_log.first_red_line.detail.strict_partial: "The strict cordon held unevenly and left the wards divided over its cost."
  fallout.event_log.first_red_line.detail.strict_failure: "The strict cordon broke, causing disease pressure, supply loss, and a lasting breach of trust."
  fallout.event_log.first_red_line.detail.checkpoints_success: "Medical checkpoints reduced disease while keeping the supply road open."
  fallout.event_log.first_red_line.detail.checkpoints_partial: "Medical checkpoints caught some cases but left the road slow and contested."
  fallout.event_log.first_red_line.detail.checkpoints_failure: "Medical checkpoints failed in the ash and consumed the clinic's reserve."
  fallout.event_log.first_red_line.detail.evacuation_success: "The escorted move protected shelter and supply while preserving family trust."
  fallout.event_log.first_red_line.detail.evacuation_partial: "The escorted move relieved some wards but left an unfinished list of exposed households."
  fallout.event_log.first_red_line.detail.evacuation_failure: "The escorted move failed at a frozen bridge and returned the families to an unprepared ward."
  fallout.event_log.first_red_line.detail.self_control_success: "Ward councils built local compliance and kept the first red line meaningful."
  fallout.event_log.first_red_line.detail.self_control_partial: "Ward councils preserved cohesion but could not stop every outer-lane case."
  fallout.event_log.first_red_line.detail.self_control_failure: "Ward councils became rival authorities and broke the shared case register."
  fallout.event_log.first_red_line.detail.callback_success: "The first winter review turned the cordon into a durable health law."
  fallout.event_log.first_red_line.detail.callback_partial: "The first winter review preserved a procedure but not a common purpose."
  fallout.event_log.first_red_line.detail.callback_failure: "The first winter review left the red line as a scar between wards and the Quarantine State."
  fallout.event_log.first_red_line.detail.cancelled: "The first red line was not completed and its reserved memory was released."
  fallout_first_red_line_result_settled: "Cordon result settled"
  fallout_first_red_line_result_partial: "Cordon result contested"
  fallout_first_red_line_result_failed: "Cordon result failed"
  fallout_first_red_line_callback_settled: "Quarantine memory consolidated"
  fallout_first_red_line_callback_partial: "Quarantine memory unresolved"
  fallout_first_red_line_callback_failed: "Quarantine memory breached"
