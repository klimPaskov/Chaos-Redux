l_english:
brilliant_scientist_former_host_recovery_category: "Former-Host Recovery"
brilliant_scientist_former_host_recovery_category_desc: "Kruger's departure left a country with damaged institutions, abandoned facilities, and assistants who must decide whether knowledge belongs to a person or a public system. Recovery spends the material capacity to rebuild an independent research base."
brilliant_scientist_reconstruct_independent_research: "Reconstruct Independent Research"
brilliant_scientist_reconstruct_independent_research_desc: "Rebuild a research bench from surviving assistants and distributed records. The work consumes support equipment, manpower, and civilian factory time, and can lower the scientific vacuum while restoring independent capacity."
brilliant_scientist_reconstruct_independent_research_tt: "Independent research is reconstructed. Scientific capacity rises, grievance falls, and one recovery success is recorded."
brilliant_scientist_secure_abandoned_archive: "Secure Abandoned Archives"
brilliant_scientist_secure_abandoned_archive_desc: "Send a supplied security and engineering detachment to the selected former laboratory state. Hold the site through the recovery window before sabotage, theft, or corruption can erase the archive."
brilliant_scientist_secure_abandoned_archive_tt: "The selected archive is secured. Its surviving methods restore capacity, lower exposure, and record one recovery success."
brilliant_scientist_offer_amnesty_to_assistants: "Offer Amnesty to Assistants"
brilliant_scientist_offer_amnesty_to_assistants_desc: "Offer protection and a lawful place in the rebuilt research system to assistants who survived Kruger's departure. The offer can recover expertise and leave infiltration risk visible in the security record."
brilliant_scientist_offer_amnesty_to_assistants_tt: "The assistant amnesty succeeds. Capacity rises, grievance falls, infiltration risk is recorded, and one recovery success is added."
brilliant_scientist_request_international_inspection: "Request International Inspection"
brilliant_scientist_request_international_inspection_desc: "Invite foreign observers through an existing protection, alliance, or research channel to inspect the former laboratory belt. Openness costs time and equipment. It can reduce exposure and make the recovery credible."
brilliant_scientist_request_international_inspection_tt: "The international inspection is signed. Exposure falls, legitimacy improves through the diplomatic record, and one recovery success is added."
