l_english:
 chaosx.fallout.457.t: "The First Water Runs"
 chaosx.fallout.457.d: "The ice has opened across [This.GetName], but the meltwater is carrying soil, ash, and old winter refuse into the settlement cisterns. The clinic reports stomach illness before the fields can take a seed. Your government must decide whether to move people, cut channels, protect the wells, or risk the flood on new beds."
 chaosx.fallout.457.a: "Drain the settlement basin"
 chaosx.fallout.457.a.tt: "Spend food, medicine, and recognition to move the lowest homes and force the first surge away from the cisterns."
 chaosx.fallout.457.b: "Evacuate the low ground"
 chaosx.fallout.457.b.tt: "Spend stores to move families and field hospitals above the old flood line, even if the road closes for a season."
 chaosx.fallout.457.c: "Rebuild the channels"
 chaosx.fallout.457.c.tt: "Spend medicine and recognition to clear culverts, publish a water rota, and let local crews decide where the melt should go."
 chaosx.fallout.457.d: "Put the floodwater on the fields"
 chaosx.fallout.457.d.tt: "Spend a small reserve to risk new planting beds and use the thaw as a test of the settlement's authority."
 chaosx.fallout.459.t: "The Meltwater Ledger"
 chaosx.fallout.459.drain_settlement.success.d: "The basin crews opened the old diversion cut before the first wall of water arrived. The cisterns stayed clear, the lowest homes were emptied without a panic, and the drainage teams earned a place in the ration queue."
 chaosx.fallout.459.drain_settlement.partial.d: "The diversion cut carried part of the surge, but a collapsed culvert sent dirty water through two alleys. The clinic can work, though the settlement has lost a month of safe washing water."
 chaosx.fallout.459.drain_settlement.failure.d: "The basin crews opened the wrong gate and sent the melt through the clinic yard. Families now queue for boiled water while the flood pressure rises behind the broken embankment."
 chaosx.fallout.459.evacuate_low_ground.success.d: "The evacuation wardens moved families above the old flood line and kept a narrow road open for carts. The government has traded room and fuel for a clear boundary between shelter and water."
 chaosx.fallout.459.evacuate_low_ground.partial.d: "The high rooms are full and the lower lanes are marked, but several households returned for tools and grain. The first disease reports are contained, although the road watch cannot cover every crossing."
 chaosx.fallout.459.evacuate_low_ground.failure.d: "The evacuation order arrived after the water reached the lower clinic. The carts bogged down, the wardens lost their ledger, and the low-ground families have no trusted route out."
 chaosx.fallout.459.rebuild_channels.success.d: "Channel crews cleared three frozen culverts and posted a public water rota at the market wall. The first samples are safe enough for washing, and every district can see who received a turn."
 chaosx.fallout.459.rebuild_channels.partial.d: "The crews reopened two channels before medicine ran out. The north cistern is usable, yet the southern ward still depends on guarded barrels and an improvised disease watch."
 chaosx.fallout.459.rebuild_channels.failure.d: "The work teams found a buried break and spent their tools on the wrong branch. The next surge cut the supply road, and the clinic has no reliable count of contaminated water."
 chaosx.fallout.459.use_floodwater_fields.success.d: "The field council planted only behind the marked berms and kept the first melt off the drinking lines. The harvest is uncertain, but the public can point to a rule that belongs to the settlement rather than a private farm."
 chaosx.fallout.459.use_floodwater_fields.partial.d: "The new beds took some water and drowned the rest. A few families have green shoots, while the cistern ward accuses the field council of taking the cleanest hours for itself."
 chaosx.fallout.459.use_floodwater_fields.failure.d: "The fields took the surge without a berm. Mud covered the seed stores, the lower road disappeared, and the settlement has gained neither a crop nor a safe channel."
 chaosx.fallout.459.a: "Close the thaw report"
 chaosx.fallout.459.a.tt: "Resolve the first melt and schedule a later review of water safety, disease control, and the settlement memory."
 chaosx.fallout.461.t: "The Water Line Returns"
 chaosx.fallout.461.success.d: "The thaw review finds a working water line and a public rule for the next freeze. The clinic has a disease watch, the field council accepts the channel map, and [This.GetName] can move supplies without guessing which road will vanish."
 chaosx.fallout.461.partial.d: "The settlement kept one clean cistern and one passable road, but the low-ground dispute remains. Each faction remembers a different promise, and the next thaw will test whether the channel crews still have authority."
 chaosx.fallout.461.failure.d: "The review found broken markers, a silent clinic ledger, and families back in the old basin. The floodwater memory has become a grievance that turns every repair into a government question."
 chaosx.fallout.461.a: "Archive the water line"
 chaosx.fallout.461.a.tt: "Record the delayed result, keep the concrete state effects, and release every scheduler receipt."
 fallout.event_log.thaw_water.name: "The First Water Runs"
 fallout.event_log.thaw_water.detail: "[This.GetName] chose how its government would meet the first thaw after Air Winter."
 fallout.event_log.thaw_water.drain_settlement_success: "Drainage crews kept the first melt away from the cisterns."
 fallout.event_log.thaw_water.drain_settlement_partial: "Drainage crews diverted only part of the first surge."
 fallout.event_log.thaw_water.drain_settlement_failure: "A bad basin cut pushed dirty meltwater through the clinic yard."
 fallout.event_log.thaw_water.evacuate_low_ground_success: "Low-ground families moved above the flood line."
 fallout.event_log.thaw_water.evacuate_low_ground_partial: "The high rooms held, but the low lanes remained contested."
 fallout.event_log.thaw_water.evacuate_low_ground_failure: "The evacuation order arrived after the lower clinic flooded."
 fallout.event_log.thaw_water.rebuild_channels_success: "Cleared channels made a public water rota possible."
 fallout.event_log.thaw_water.rebuild_channels_partial: "Two channels reopened while the southern ward waited on barrels."
 fallout.event_log.thaw_water.rebuild_channels_failure: "A buried break cut the road before the crews found it."
 fallout.event_log.thaw_water.use_floodwater_fields_success: "Marked berms turned the thaw into a public field experiment."
 fallout.event_log.thaw_water.use_floodwater_fields_partial: "New beds took some water while the cistern ward protested."
 fallout.event_log.thaw_water.use_floodwater_fields_failure: "Unbermed fields lost seed stores and the lower road."
 fallout.event_log.thaw_water.callback_success: "The review left a working water line and a shared rule."
 fallout.event_log.thaw_water.callback_partial: "One cistern and one road survived, but the dispute remained."
 fallout.event_log.thaw_water.callback_failure: "The review found broken markers and a grievance in every repair."

