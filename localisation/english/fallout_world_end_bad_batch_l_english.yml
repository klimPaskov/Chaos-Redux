 chaosx.fallout.204.t: "The Greenhouse Lot at Sundown"
 chaosx.fallout.204.d: "The old greenhouse district kept three sealed crates through the Air Winter. The first leaves are alive, but their veins are mottled and the planting ledger names no safe answer. The food council must decide whether to destroy the batch, risk a full planting, keep it behind filters, or send samples to growers who can judge it beyond this state."
 chaosx.fallout.204.a: "Destroy the batch under guard"
 chaosx.fallout.204.b: "Plant the lot before the thaw"
 chaosx.fallout.204.c: "Isolate the experimental plots"
 chaosx.fallout.204.e: "Share samples with partner growers"
 chaosx.fallout.204.a.tt: "Medicine and scrap will be spent to burn and document the crates. A delayed inspection will measure whether the loss protects the next harvest."
 chaosx.fallout.204.b.tt: "Food will be spent on a full planting. A delayed inspection will decide whether the first leaves become a useful cultivar or a blighted field."
 chaosx.fallout.204.c.tt: "Filters will be spent to seal a smaller trial behind the shelter wall. A delayed inspection will measure whether the plots can be kept clean."
 chaosx.fallout.204.e.tt: "Recognition will be spent to send samples to partner growers. A delayed inspection will record whether trust brings a stable cultivar home."
 chaosx.fallout.206.t: "Ash on the Burn Pits"
 chaosx.fallout.206.success.d: "The medicine stores kept the burn crews sealed while scrap-fed furnaces reduced every crate to black husk. The river district lost a tempting harvest, but no mottled leaf reached the public beds."
 chaosx.fallout.206.partial.d: "The council destroyed the worst crates and saved a dry packet for comparison. The quarantine held in the rail district, although the next planting now depends on a smaller reserve."
 chaosx.fallout.206.failure.d: "The burn team opened a cracked crate without a second filter. Spores crossed the work yard before the furnace caught, and the southern plots now carry a crop warning beside the hospital tents."
 chaosx.fallout.206.a: "Give the agronomist one more season to review the ashes"
 chaosx.fallout.206.a.tt: "The callback will decide whether the burn record becomes a trusted safeguard or a warning about lost evidence."
 chaosx.fallout.207.t: "The First Greenhouse Furrows"
 chaosx.fallout.207.success.d: "The food compact planted every sheltered furrow before the thaw line broke. The leaves held their color, and the district ledger now names a cultivar that can feed the next ration cycle."
 chaosx.fallout.207.partial.d: "The planting crews chose the warmest beds and left the rest covered. Some rows took root, but the settlement will have to ration seed while the outer farms wait for a cleaner reading."
 chaosx.fallout.207.failure.d: "The first leaves curled after the thaw. The greenhouse walls trapped a gray blight, and the eastern shelter has lost both a season of food and the confidence to open its seed store."
 chaosx.fallout.207.a: "Keep the furrows under watch through the next frost"
 chaosx.fallout.207.a.tt: "The callback will classify the harvest as a stable cultivar, a contested trial, or a failed planting."
 chaosx.fallout.208.t: "Filters Around the Trial Beds"
 chaosx.fallout.208.success.d: "The shelter engineers sealed four trial beds behind clean filters and logged every hand that crossed the airlock. The hill capital can compare the leaves without exposing the public allotments."
 chaosx.fallout.208.partial.d: "The filter wall held around the best beds, but one service tunnel stayed open during the coldest week. The trial survives with a narrow harvest and a debt to the crews who kept watch."
 chaosx.fallout.208.failure.d: "The replacement filters arrived after the first inspection. Dust entered the trial chamber, workers fell ill, and the valley farms now carry a blight marker while the council closes its doors."
 chaosx.fallout.208.a: "Keep the quarantine ledger open until thaw"
 chaosx.fallout.208.a.tt: "The callback will record whether isolation produced a clean line or only delayed the crop warning."
 chaosx.fallout.209.t: "Packets Across the Ash Road"
 chaosx.fallout.209.success.d: "Partner growers received the samples in sealed tins and returned a planting note from the coast. The exchange gives the food compact a second reading and a route toward a cultivar that can cross the ash road."
 chaosx.fallout.209.partial.d: "The samples reached one cooperative, while the second convoy turned back at the burned bridge. The council gained a useful comparison, but the missing reply leaves the inland plots waiting."
 chaosx.fallout.209.failure.d: "The sample tins arrived without a clean chain of custody. The partner growers rejected the batch, the recognition ledger fell, and the greenhouse council must answer for a promise made too soon."
 chaosx.fallout.209.a: "Ask the growers for a final planting verdict"
 chaosx.fallout.209.a.tt: "The callback will turn the exchange into a stable partnership, a disputed sample, or a recorded trust failure."
 chaosx.fallout.214.t: "The Cultivar Review"
 chaosx.fallout.214.success.d: "The delayed review compared the greenhouse leaves with the ash-road notes. The state can now name a stable cultivar and assign its first beds without reopening the original hazard."
 chaosx.fallout.214.partial.d: "The review found a usable line, but the evidence remains divided between the shelter wall and the partner farms. The next planting will carry a public warning and a narrow license."
 chaosx.fallout.214.failure.d: "The final samples failed the review. The batch remains a memory of rushed hunger, and the state marks the old greenhouse as a closed hazard until a cleaner generation can test it."
 chaosx.fallout.214.a: "Record the verdict beside the food ledger"
 chaosx.fallout.214.a.tt: "The callback will preserve the cultivar verdict, release the scheduler receipts, and close the greenhouse chain."
 fallout.event_log.bad_batch.name: "The Bad Batch"
 fallout.event_log.bad_batch.detail: "[GetFalloutEvent204EventLogDetail]"
 fallout.event_log.bad_batch.detail.destroy_success: "The guarded burn destroyed the mottled seed batch before it reached public beds."
 fallout.event_log.bad_batch.detail.destroy_partial: "The guarded burn destroyed the worst crates and preserved one packet for comparison."
 fallout.event_log.bad_batch.detail.destroy_failure: "The burn failed to contain the mottled batch, leaving a crop warning near the work yard."
 fallout.event_log.bad_batch.detail.plant_success: "The full planting produced a stable cultivar in the sheltered greenhouse furrows."
 fallout.event_log.bad_batch.detail.plant_partial: "The planting saved a few warm rows while the outer beds remained under rationed seed."
 fallout.event_log.bad_batch.detail.plant_failure: "The first planting failed and left a blight marker on the greenhouse district."
 fallout.event_log.bad_batch.detail.isolate_success: "The sealed trial beds held behind clean filters and produced a controlled comparison."
 fallout.event_log.bad_batch.detail.isolate_partial: "The filter wall held around the best beds, but one service tunnel weakened the trial."
 fallout.event_log.bad_batch.detail.isolate_failure: "Dust entered the trial chamber and forced a blight warning across nearby farms."
 fallout.event_log.bad_batch.detail.share_success: "Partner growers returned a stable comparison and opened an ash-road route for the cultivar."
 fallout.event_log.bad_batch.detail.share_partial: "One partner cooperative answered while a second convoy failed to cross the burned bridge."
 fallout.event_log.bad_batch.detail.share_failure: "The partner growers rejected the samples after the chain of custody failed."
 fallout.event_log.bad_batch.detail.callback_success: "The delayed review certified a stable cultivar for the next ration cycle."
 fallout.event_log.bad_batch.detail.callback_partial: "The delayed review found a usable but disputed line under a narrow license."
 fallout.event_log.bad_batch.detail.callback_failure: "The delayed review closed the greenhouse as a hazard for the next generation."
