# Founding Charter repeal and aftermath
decision_utopia_repeal_the_founding_charter: "Repeal the Founding Charter"
decision_utopia_repeal_the_founding_charter_desc: "The constitutional crisis has made total repeal a live choice. Beginning the repeal consumes 90 Political Power, 5% Stability, 100 Support Equipment, and 10 Trains. A public winding-up lasting between §Y90 and 330 days§! follows. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. If the Ledger closes, the capital leaves our control, or the constitutional crisis ends before the deadline, the repeal is interrupted and the paid cost is not returned. Completion opens the final settlement of the domestic charter, the external League, administered ground, practical institutions, and the Manifesto itself."
decision_utopia_repeal_the_founding_charter_effect_tt: "Begins a repeal mission lasting between §Y90 and 330 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Completion opens the final choices that end the domestic Founding Charter and chosen interpretation. This decision can be taken only once."
mission_utopia_repeal_the_founding_charter: "Repeal the Founding Charter"
mission_utopia_repeal_the_founding_charter_desc: "Assemblies, ministries, and public offices are winding down the Founding Charter over §Y90 to 330 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Closing the Ledger, losing control of the capital, or resolving the constitutional crisis by another course interrupts the repeal."
mission_utopia_repeal_the_founding_charter_outcome_tt: "Opens the final settlement. We first choose ordinary dissolution, succession by a viable external League member if one exists, or abandonment without a practical legacy. Eligible settlements for administered ground, practical institutions, and the Manifesto then follow. The final choice ends the domestic charter and chosen interpretation, closes their undertakings, and dismisses their temporary authorities."
mission_utopia_repeal_the_founding_charter_cancel_tt: "The repeal is interrupted. Need rises by 3, Plenty falls by 3, Concord falls by 5, and Assignment rises by 3. Political Power, Stability, Support Equipment, and Trains already paid are not returned."
utopia_manifesto_total_repeal_warning_tt: "§RThis is a final constitutional course.§! When the repeal and its settlements are complete, the domestic Founding Charter, chosen interpretation, public offices, unfinished undertakings, and temporary authorities end. Only the legacies chosen during the final settlement survive."

# Garden Settlement district lifecycle
utopia_manifesto_district_category: "Garden Settlement Districts"
utopia_manifesto_district_category_desc: "Survey owned, controlled core states for four roles grounded in current population, infrastructure, building capacity, national pressures, stockpiles, and the Common Reserve. A chosen project must preserve separate housing, transport, and role-plan obligations until construction review. A completed district can then receive the charter of the country's public interpretation and lasting relief for two Calling families. If the state ceases to be owned, controlled, or core, construction ends and a completed district loses its recognized role, charter, Calling relief, and contribution to the district network. Buildings already constructed remain in the state."
decision_utopia_survey_district_site: "Survey a District Site"
decision_utopia_survey_district_site_desc: "Survey [FROM.GetName] for every district role that matches both the state and the country's current needs. The state must remain owned, controlled, and core, and still satisfy at least one role when the survey concludes."
decision_utopia_survey_district_site_effect_tt: "Begins a suitability survey in §Y[FROM.GetName]§! lasting between §Y90 and 330 days§!. War and a larger country lengthen the survey. Stable Plenty, trusted Concord, and relevant public offices shorten it. The final report records every role still supported by the state and country."
mission_utopia_survey_district_site: "District Suitability Survey"
mission_utopia_survey_district_site_desc: "Surveyors are measuring population, infrastructure, industrial room, transport links, housing pressure, migration pressure, stores, and current calling shortages in [FROM.GetName]. Closing the Ledger or losing ownership, control, or core status cancels the survey. If no role remains suitable at the final review, the site is refused and the shortfall is brought before the country."
mission_utopia_survey_district_site_success_tt: "Records every district role that remains suitable in §Y[FROM.GetName]§!. If no role remains suitable, the survey records a refusal and opens a public shortfall review."
decision_utopia_found_market_garden_district: "Found a Market-Garden District"
decision_utopia_found_market_garden_district_desc: "A surveyed state remains eligible while it has more than 200,000 residents, Infrastructure level 2 to 4, and either high Need, an insecure Common Reserve, or a Provisioning shortage. Completion adds 1 Infrastructure. Its charter later reduces Provisioning and Agriculture pressure by 10 and Civic Works and Transport pressure by 5."
decision_utopia_found_market_garden_district_effect_tt: "Begins construction in §Y[FROM.GetName]§! with live housing, transport, and market-garden role-plan obligations. Passing all three at review adds 1 Infrastructure."
decision_utopia_found_industrial_housing_district: "Found an Industrial Housing District"
decision_utopia_found_industrial_housing_district_desc: "Requires Homes Near Work and an unresolved national housing emergency. A surveyed state remains eligible while it has more than 400,000 residents, Infrastructure level 2 or higher, a Civilian or Military Factory, and a free Civilian Factory slot. Completion adds 1 shared building slot and 1 Civilian Factory. Its charter later reduces Workshops and Arsenal pressure by 10 and Civic Works and Transport pressure by 5."
decision_utopia_found_industrial_housing_district_effect_tt: "Begins construction in §Y[FROM.GetName]§! with live housing, transport, and industrial role-plan obligations. Passing all three at review adds 1 shared building slot and 1 Civilian Factory."
decision_utopia_found_rail_junction_town: "Found a Rail Junction Town"
decision_utopia_found_rail_junction_town_desc: "Requires Common Transport Ground. A surveyed state remains eligible while it has more than 100,000 residents, Infrastructure level 2 or 3, and a Supply Hub or Railway. Completion adds 2 Infrastructure. Its charter later reduces Civic Works and Transport pressure by 10 and Maritime and Settlement pressure by 5."
decision_utopia_found_rail_junction_town_effect_tt: "Begins construction in §Y[FROM.GetName]§! with live housing, transport, and rail-junction role-plan obligations. Passing all three at review adds 2 Infrastructure."
decision_utopia_found_refugee_municipality: "Found a Refugee Municipality"
decision_utopia_found_refugee_municipality_desc: "Requires live migration or housing pressure. A surveyed state remains eligible while it has more than 100,000 residents, Infrastructure level 2 or higher, a free Civilian Factory slot, and a Common Reserve score above 20. Starting the project requires a Common Reserve score of at least 30. Completion adds 1 shared building slot and 1 Civilian Factory. Its charter later reduces Maritime and Settlement pressure by 10 and Learning and Care pressure by 5."
decision_utopia_found_refugee_municipality_effect_tt: "Begins construction in §Y[FROM.GetName]§! with live housing, transport, and refugee role-plan obligations. Passing all three at review adds 1 shared building slot and 1 Civilian Factory."
decision_utopia_attach_penal_works_to_district: "Attach Penal Works to the District"
decision_utopia_attach_penal_works_to_district_desc: "The Ordered Island can attach coercive labor to its active district. The method spends 15 Political Power, 3,000 Manpower, 500 Infantry Equipment, 100 Support Equipment, and 10 Common Reserve points. It gives the state 25% faster building construction while reducing Local Supplies by 10%, raising Required Garrisons by 25%, and setting the initial Resistance Target to +12%. Penal Works substitutes for the role-plan obligation while active. Five hundred civilians die when the method begins, and another 1,000 die if the district completes under it. Every loss enters the shared Deaths record, and the historical conduct remains recorded after the method ends."
decision_utopia_attach_penal_works_to_district_effect_tt: "Consumes the displayed 15 Political Power, £manpower_texticon §Y3,000§!, £infantry_equipment_text_icon §Y500§!, £support_equipment_text_icon §Y100§!, and §Y10§! Common Reserve points. §R500 civilians die immediately§! and are entered in the shared Deaths record. Penal Works grants §G+25%§! Building Construction Speed, reduces Local Supplies by §R10%§!, raises Required Garrisons by §R25%§!, and sets an initial §R+12%§! Resistance Target. Penal Works satisfies the district's role-plan obligation. Successful district completion records §R1,000 further civilian deaths§! before the labor regime ends. The conduct remains recorded even if the method is halted."
mission_utopia_build_garden_district: "Build the Garden Settlement District"
mission_utopia_build_garden_district_desc: "Construction in [FROM.GetName] is judged against three live obligations at the deadline. Housing must retain the role's population, infrastructure, or building room. Transport must retain Infrastructure level 2 or higher and the role's required Trains or Motorized Equipment. The role plan must retain its factory, equipment, or reserve proof unless active Penal Works supplies the coercive substitute. Losing the Ledger, ownership, control, or core status cancels the project.\n\n§YHousing§!: [GetUtopiaManifestoDistrictHousingStatus]\n§YTransport§!: [GetUtopiaManifestoDistrictTransportStatus]\n§YRole plan§!: [GetUtopiaManifestoDistrictRolePlanStatus]"
mission_utopia_build_garden_district_success_tt: "At the deadline, every current obligation is reviewed. Passing all three grants the selected role's state construction and completes the district. Failure leaves an incomplete district with §R-5%§! Local Supplies, §R-10%§! Building Construction Speed, and §R+5%§! Resistance Target. If Penal Works remains in force on successful completion, §R1,000 civilians die§! through the shared Deaths record before the labor regime ends."
decision_utopia_complete_district_charter: "Complete the District Charter"
decision_utopia_complete_district_charter_desc: "Prepare a completed district for the charter of the country's resolved public interpretation. Cooperative Concord is required to begin. Continued ownership, control, core status, a valid built district, and the resolved public interpretation must survive until review. The Consent of Households route takes 30 additional days. Completion applies the route's state charter and lasting relief to two calling families. Losing ownership, control, or core status later removes that charter effect, relief, and contribution to the district network while leaving completed construction in place."
decision_utopia_complete_district_charter_effect_tt: "Begins a charter term in §Y[FROM.GetName]§! lasting between §Y90 and 330 days§!. War, a larger country, and the Consent of Households lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. The district must remain built, owned, controlled, core, and accepted while the country's public interpretation stays resolved."
mission_utopia_complete_district_charter: "Complete the District Charter"
mission_utopia_complete_district_charter_desc: "The district is assigning public duties, appeals, stores, and local authority under the country's route. Closing the Ledger or losing ownership, control, or core status cancels the charter. At review, the state must remain a completed district, no refusal may stand, and the public interpretation must remain resolved."
mission_utopia_complete_district_charter_success_tt: "Applies the route charter to §Y[FROM.GetName]§! and grants the selected role's calling relief. Consent of Households grants §R-1%§! Local Supplies and §G-5%§! Resistance Target. The Common Table grants §G+5%§! Local Supplies and §G+3%§! Local Resources. The Guardians grant §G+10%§! Building Construction Speed and §R+3%§! Resistance Target. The Closed Island grants §G+10%§! Local Supplies and begins with §R+8%§! Resistance Target. Humanist review grants §G+3%§! Local Supplies and §G-3%§! Resistance Target."

# Bounded-center plans and island construction
utopia_manifesto_island_category: "The Bounded Center"
utopia_manifesto_island_category_desc: "The chosen plan must be built with public funds, equipment, transport, and time. A completed center remains valid only while its required ground is held: three owned island cores for the archipelago, or continuing lawful control for a leased island. Replanning before completion abandons official recognition of the unfinished center, although physical works remain where they were built."
decision_utopia_adopt_existing_island_capital: "Replan Around the Existing Island"
decision_utopia_adopt_existing_island_capital_desc: "Before the center is made real, abandon the current survey and recommit the project to an owned island capital. Replanning withdraws official recognition of the unfinished center and strains the Ledger. Buildings already completed are not dismantled."
decision_utopia_adopt_existing_island_capital_effect_tt: "The bounded-center plan becomes §YThe Existing Island§!. Unfinished work is abandoned, and previously accepted sites must be surveyed again. Existing buildings remain in their states."
decision_utopia_adopt_coastal_refuge: "Replan Around a Coastal Refuge"
decision_utopia_adopt_coastal_refuge_desc: "Before the center is made real, recommit it to an owned coastal core. Replanning withdraws official recognition of the unfinished center and strains the Ledger. Completed physical works remain."
decision_utopia_adopt_coastal_refuge_effect_tt: "The bounded-center plan becomes §YThe Coastal Refuge§!. Unfinished work is abandoned, and previously accepted sites must be surveyed again. Existing buildings remain in their states."
decision_utopia_adopt_inland_island: "Replan Around the Inland Island"
decision_utopia_adopt_inland_island_desc: "Before the center is made real, recommit it to the capital ring and its rail approaches. Replanning withdraws official recognition of the unfinished center and strains the Ledger. Completed physical works remain."
decision_utopia_adopt_inland_island_effect_tt: "The bounded-center plan becomes §YThe Inland Island§!. Unfinished work is abandoned, and previously accepted sites must be surveyed again. Existing buildings remain in their states."
decision_utopia_adopt_archipelago_network: "Replan as an Archipelago Network"
decision_utopia_adopt_archipelago_network_desc: "Before the center is made real, divide it among three distinct owned island cores. Every site must be surveyed and retained. Replanning withdraws official recognition of the unfinished center and strains the Ledger."
decision_utopia_adopt_archipelago_network_effect_tt: "The bounded-center plan becomes §YThe Archipelago Network§!. Unfinished work is abandoned. Three distinct island sites must be surveyed again. Existing buildings remain in their states."
decision_utopia_adopt_leased_island: "Replan Around a Leased Island"
decision_utopia_adopt_leased_island_desc: "Before the center is made real, abandon the domestic plan and open a Necessary Ground case for one relevant foreign island. Only a peaceful fixed-term lease can satisfy this project."
decision_utopia_adopt_leased_island_effect_tt: "The bounded-center plan becomes §YThe Leased Island§!. Unfinished work is abandoned and a dedicated maritime case opens. Ownership, cores, and claims do not transfer."
decision_utopia_mark_archipelago_project_site: "Survey an Archipelago Site"
decision_utopia_mark_archipelago_project_site_desc: "Select a distinct owned, controlled island core and commit survey crews, landing craft, and civic stores. Three completed sites are required before national construction can begin."
decision_utopia_mark_archipelago_project_site_effect_tt: "Begins an island survey in §Y[FROM.GetName]§! lasting between §Y90 and 210 days§!. War and a larger country lengthen the survey. Stable Plenty, trusted Concord, and relevant public offices shorten it. The state is accepted only if it remains an owned, controlled island core at completion."
mission_utopia_secure_archipelago_project_site: "Secure the Archipelago Site"
mission_utopia_secure_archipelago_project_site_desc: "Surveyors, harbor crews, and storekeepers are proving that [FROM.GetName] can carry part of the national center. Loss of ownership, control, core status, or island geography cancels the site."
mission_utopia_secure_archipelago_project_site_success_tt: "Accepts §Y[FROM.GetName]§! as one of the three required archipelago sites."
decision_utopia_secure_island_site: "Secure the Project Site"
decision_utopia_secure_island_site_desc: "Commit survey teams, rail material, support stores, and guards to the exact state required by the selected plan."
decision_utopia_secure_island_site_effect_tt: "Begins the first construction stage in §Y[FROM.GetName]§!, lasting between §Y90 and 420 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it."
decision_utopia_build_common_harbor: "Build the Common Harbor"
decision_utopia_build_common_harbor_desc: "Commit convoys and engineering stores to connect every accepted maritime project site. The principal site receives the main harbor works."
decision_utopia_build_common_harbor_effect_tt: "Begins a harbor stage lasting between §Y90 and 420 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it. Every accepted project site receives harbor work, and the principal site receives the main installation."
decision_utopia_build_inland_terminal: "Build the Inland Terminal"
decision_utopia_build_inland_terminal_desc: "Commit trains, motor transport, and support stores to make the capital ring function as a bounded inland center."
decision_utopia_build_inland_terminal_effect_tt: "Begins a terminal project in §Y[FROM.GetName]§! lasting between §Y90 and 420 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it."
decision_utopia_complete_capital_provision_ring: "Complete the Provision Ring"
decision_utopia_complete_capital_provision_ring_desc: "Link the center's transport, stores, workshops, and emergency distribution. Every accepted site receives provision work. The principal site carries the national reserve."
decision_utopia_complete_capital_provision_ring_effect_tt: "Begins a provision-ring stage lasting between §Y90 and 420 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it. The project remains valid only while every required site is held."
decision_utopia_fortify_without_sealing: "Fortify Without Sealing"
decision_utopia_fortify_without_sealing_desc: "Build open defenses around the center without closing its civil routes or subordinating every household to the gates."
decision_utopia_fortify_without_sealing_effect_tt: "Begins an open-fortification stage across the accepted project sites."
decision_utopia_close_the_gates: "Close the Gates"
decision_utopia_close_the_gates_desc: "The Ordered Island can commit manpower, weapons, stores, and political stability to a sealed defense system."
decision_utopia_close_the_gates_effect_tt: "Begins a closed-gates fortification stage. The principal site receives the strongest works. Every secondary archipelago site receives a supporting line."
mission_utopia_build_island_stage: "Bounded-Center Construction"
mission_utopia_build_island_stage_desc: "Crews are carrying out the selected survey, harbor, terminal, provision, or fortification stage. The chosen ground must remain under lawful control. Later stages also require every accepted site to remain valid."
mission_utopia_build_island_stage_success_tt: "Completes the chosen construction stage and grants its buildings and public recognition."
mission_utopia_hold_island_project_lease: "The Island Lease Term"
mission_utopia_hold_island_project_lease_desc: "The foreign owner has granted temporary control of one island for the bounded-center project. The lease never transfers ownership, cores, or claims. When the term ends, control returns to the original owner where possible. Any buildings completed there remain with the state. A third-party occupier will not be displaced when control returns."
mission_utopia_hold_island_project_lease_timeout_tt: "The fixed lease expires. Lawful control returns to the original owner where possible, and the center can no longer rely on the island. A new peaceful case may be pursued if the maritime deficit remains real. Buildings are not removed."
decision_utopia_propose_island_lease_renewal: "Propose an Island-Lease Renewal"
decision_utopia_propose_island_lease_renewal_desc: "Pay for a single renewal negotiation with the original owner. They may extend the lease for three years, offer two years, or refuse."
decision_utopia_propose_island_lease_renewal_effect_tt: "[FROM.GetNameDef] receives a formal renewal proposal. Acceptance extends the current lease. Refusal leaves the original expiration unchanged."
decision_utopia_make_an_island: "Make the Center Real"
decision_utopia_make_an_island_desc: "Commit the final transport and support reserve to prove that the completed center can endure. All required sites and any foreign lease must remain valid until the mission ends."
decision_utopia_make_an_island_effect_tt: "Begins the final material proof. Without opening preparation it lasts between §Y180 and 840 days§!, twice the ordinary island term. The Perfect Island opening removes §Y30 days§! and bounds the shortened term at §Y420 days§!. War and a larger country lengthen the underlying term. Stable Plenty, trusted Concord, and relevant public offices shorten it. Completion recognizes the finished works without granting permanent ownership, claims, or cores."
mission_utopia_make_an_island: "Make an Island"
mission_utopia_make_an_island_desc: "The commonwealth is testing whether stores, routes, defenses, and public order can operate together. Losing a required project site or the lawful leased control cancels the proof."
mission_utopia_make_an_island_success_tt: "Recognizes the bounded center as materially complete, allowing §YThe Island Made Real§! while every required site remains valid."

