mission_utopia_emergency_calling_levy_expiry: "Sunset of the Emergency Levy"
mission_utopia_emergency_calling_levy_expiry_desc: "The emergency warrant ends when this term runs out. Its temporary coverage is removed, and any unfilled calling returns to the public pool."
mission_utopia_emergency_calling_levy_expiry_tt: "The emergency levy expires. Temporary coverage is removed, and the calling is measured again against the country's condition and lasting remedies."
