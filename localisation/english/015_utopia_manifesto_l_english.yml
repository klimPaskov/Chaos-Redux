decision_utopia_extend_emergency_calling_levy: "Renew the Emergency Calling Levy"
decision_utopia_extend_emergency_calling_levy_desc: "The levy has covered an urgent calling, and its warrant has a sunset. Renewing it keeps the temporary commitment in force at a further material and constitutional cost."
decision_utopia_extend_emergency_calling_levy_effect_tt: "The levy stays in force for another [?utopia_manifesto_emergency_levy_days|0] days. Need eases by 3, Concord falls by 5, and Assignment rises by 5, and the temporary shortage coverage is kept."
