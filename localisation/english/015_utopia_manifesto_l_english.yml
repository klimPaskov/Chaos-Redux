# Tooltips
utopia_household_census_available_tt: "Requires 15 Command Power and 40 Support Equipment."
utopia_household_census_tt: "Completes the first census, improves Vocation Balance, and reveals the ledger baseline."
utopia_common_storehouse_available_tt: "Requires project room, 80 Support Equipment, 2 Trains, and 8 Convoys."
utopia_common_storehouse_start_tt: "Begins a timed common storehouse project in the selected state."
utopia_common_storehouse_finish_tt: "Finishes the storehouse, improves supply, lowers Need, and raises Surplus."
utopia_storehouse_audit_tt: "Audits the stores and lowers Overreach."
utopia_open_stores_available_tt: "Requires stable Surplus and enough stability to open emergency stores."
utopia_open_stores_tt: "Opens emergency stores, lowering Need at the cost of stability and Surplus pressure."
utopia_collect_petitions_tt: "Household petitions raise Consent and record local objections."
utopia_fund_apprenticeships_available_tt: "Requires 55 Support Equipment."
utopia_fund_apprenticeships_tt: "Funds apprenticeship lots and raises Vocation Balance."
utopia_urgent_service_available_tt: "Requires 600 Manpower and enough stability for urgent service."
utopia_urgent_service_tt: "Urgent service answers Need but raises Overreach and can mark the vocation ledger as strained if overused."
utopia_rural_rotation_available_tt: "Requires 1 Train and 45 Support Equipment."
utopia_rural_rotation_start_tt: "Starts the harvest rotation mission."
utopia_harvest_rotation_timeout_tt: "The harvest rotation resolves. It lowers Need and improves Surplus if the ledger remains open, reserve trains and support equipment remain available, core states stay controlled, Need is not high, and Vocation Balance holds."
utopia_household_guard_available_tt: "Requires 450 Infantry Equipment, 1200 Manpower, and 8 Army Experience."
utopia_household_guard_tt: "Raises limited household guard divisions and improves the defensive ledger."
utopia_guard_shore_available_tt: "Requires 12 Convoys and 80 Support Equipment."
utopia_guard_shore_start_tt: "Starts a timed guard mission for sea roads and exposed stores."
utopia_guard_shore_timeout_tt: "The guard mission resolves. It raises Consent if Overreach stays safe and the patrol answers real defensive pressure. Otherwise Foreign Suspicion rises."
utopia_storehouse_engineers_available_tt: "Requires 120 Support Equipment, 40 Motorized Equipment, and 10 Army Experience."
utopia_storehouse_engineers_tt: "Forms limited storehouse engineer divisions for supply and reinforcement work."
utopia_just_cause_review_available_tt: "Requires at least 25% War Support before the review can spend 2%."
utopia_just_cause_review_tt: "Spends war support to lower Foreign Suspicion and mark military action as reviewed."
utopia_boundary_arbitration_target_tt: "Target must be a safe minor neighbor with a valid non-core controlled state."
utopia_boundary_arbitration_available_tt: "Requires 2 Trains, 20 Command Power, and a small stability cost."
utopia_boundary_arbitration_tt: "Begins witnessed arbitration. A claim is added only if Need remains proven, the target state is still valid, and the target accepts compensation or a guarantee-backed settlement charter when the mission resolves."
utopia_boundary_arbitration_timeout_tt: "Arbitration resolves. A stable ledger may produce a compensated settlement or a guarantee-backed charter and add a witnessed claim. Public refusal, invalid targets, or uncontrolled Overreach raise Need, Foreign Suspicion, and Overreach without adding a claim. High Suspicion can draw outside guarantees to the target."
utopia_mark_needed_district_target_tt: "Target must be a safe minor neighbor with land the manifesto can plausibly mark."
utopia_mark_needed_district_available_tt: "Requires the Marked Bounds branch or severe ledger pressure, plus enough stability to pay the survey cost."
utopia_mark_needed_district_tt: "Begins a Marked Bounds survey. A claim is added only if the target remains valid when the mission resolves."
utopia_marked_district_timeout_tt: "The marked survey resolves. Success requires the hard clause to remain open and the target-held state to remain valid. It adds a risky claim. Failure hardens Need and Foreign Suspicion without adding one."
utopia_boundary_wardens_available_tt: "Requires 320 Infantry Equipment and 12 Army Experience."
utopia_boundary_wardens_tt: "Deploys boundary wardens and raises a defensive formation."
utopia_common_administration_available_tt: "Requires a selected state with a local storehouse and household council, plus project room, 350 Infantry Equipment, 100 Support Equipment, and 800 Manpower."
utopia_common_administration_start_tt: "Begins a timed common administration project in the prepared selected state."
utopia_common_administration_finish_tt: "Finishes common administration, raising compliance and allowing core work only after local preparation and safe ledger conditions hold."
utopia_local_households_available_tt: "Requires 60 Support Equipment for councils and magistrates."
utopia_local_households_tt: "Seats household councils, improves compliance, and lowers resistance in the selected state."
utopia_storehouse_aid_available_tt: "Requires 12 Convoys, 80 Support Equipment, and enough war support for an aid commitment."
utopia_storehouse_aid_tt: "Sends aid, improves relations, and counts toward storehouses abroad."
utopia_send_magistrates_available_tt: "Requires 60 Support Equipment."
utopia_send_magistrates_tt: "Sends magistrates to a neighbor, improving relations while increasing Foreign Suspicion."
utopia_recognize_friend_tt: "Recognizes a neighbor as a friend of the ledger and raises Consent."
utopia_league_aid_corridor_available_tt: "Requires 18 Convoys, 2 Trains, and 120 Support Equipment."
utopia_league_aid_corridor_start_tt: "Starts a timed League aid corridor mission for the selected target."
utopia_league_aid_corridor_timeout_tt: "The aid corridor resolves, adding a League member if the target remains safe and the reserve convoys, trains, and support equipment are still available."
utopia_renunciation_vote_available_tt: "Requires high Overreach and enough stability to hold a national vote."
utopia_renunciation_vote_start_tt: "Starts a timed vote on renouncing the Marked Bounds clause."
utopia_renunciation_vote_timeout_tt: "The vote resolves. Stable Consent and contained Overreach renounce the hard clause. Failure leaves the ledger harsher."
