l_english:
chaosx.nr15.1.t: "The Utopia Manifesto"
chaosx.nr15.1.d: "A translated manuscript passes from reading room to workshop, then from workshop to the ministry. Its author describes no paradise of angels, only a country where every household is counted, every storehouse watched, every craft made useful, and every border judged by need.\n\nThe readers ask whether the state will test the book in earnest. Refusal would leave it as a curiosity. Acceptance would bind the country to public ledgers, visible duties, uneasy neighbors, and a promise that no citizen should stand outside the common store."
chaosx.nr15.1.a: "Put the manifesto before the country."
chaosx.nr15.1.b: "Keep it in the archives."
utopia_manifesto_accept_tree_warning_tt: "§RThe country's current national focus tree will be replaced by the Utopia Manifesto tree.§! Existing forces, territory, technology, leaders, parties, and the base flag remain in place. Later choices may establish new public institutions, leadership, and a cosmetic identity."
utopia_manifesto_reject_cleanup_tt: "The manuscript returns to the archives. The national focus tree remains unchanged, and no public offices or ledgers are created."
utopia_manifesto.availability.available: "§GAvailable.§! This country is small, secure, and institutionally unsettled enough to begin the experiment."
utopia_manifesto.availability.already_handled: "§YUnavailable.§! This country has already accepted or declined the manifesto."
utopia_manifesto.availability.terminal_identity: "§RUnavailable.§! A special, nonhuman, or world-ending actor cannot sustain the Commonwealth Ledger."
utopia_manifesto.availability.nonstandard_country: "§RUnavailable.§! This country lacks the ordinary civilian government required by the Commonwealth Ledger."
utopia_manifesto.availability.major: "§YUnavailable.§! A major power is too established and powerful for this small-country experiment."
utopia_manifesto.availability.non_generic_tree: "§YUnavailable.§! The country's existing political settlement is too distinct to displace without destroying established institutions."
utopia_manifesto.availability.active_event_package: "§YUnavailable.§! Another country-wide transformation is already unfolding here."
utopia_manifesto.availability.protected_package: "§YUnavailable.§! A protected or recent country transformation blocks replacement."
utopia_manifesto.availability.mature_tree: "§YUnavailable.§! The country's present political and national settlement is already too deeply established to displace."
utopia_manifesto.availability.civil_war: "§YUnavailable.§! A country in civil war cannot begin the founding survey."
utopia_manifesto.availability.offensive_war: "§YUnavailable.§! An active offensive war leaves no safe founding interval."
utopia_manifesto.availability.near_capitulation: "§YUnavailable.§! The country is too close to capitulation for a viable constitutional transformation."
utopia_manifesto.availability.insecure_capital: "§YUnavailable.§! The capital is not a controlled core from which the Ledger can operate."
utopia_manifesto.availability.faction_leader: "§YUnavailable.§! A faction leader cannot begin the experiment as a weak external commonwealth."
utopia_manifesto.availability.industrial_power: "§YUnavailable.§! The country's industrial strength is too great for an experiment intended for materially weak states."
utopia_manifesto.availability.subject_empire: "§YUnavailable.§! The country controls too many subjects for a small-place transformation."
utopia_manifesto.availability.extensive_occupation: "§YUnavailable.§! The country already carries an extensive occupation burden."
utopia_manifesto.availability.unsafe_subject: "§YUnavailable.§! The current subject relationship cannot support an independent constitutional transformation."
