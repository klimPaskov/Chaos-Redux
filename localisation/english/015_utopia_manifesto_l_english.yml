l_english:
chaosx.nr15.1.t: "The Utopia Manifesto"
chaosx.nr15.1.d: "A translated manuscript has passed from the reading rooms to the workshops and on to the ministry. Its author describes a country where every household is counted, the storehouses are guarded, every craft serves a public need, and every border answers to necessity.\n\nThe readers ask whether the state is willing to put the book to the test. If it is, the country takes on Common Provision, a list of public duties, and the suspicion of its neighbors, and it promises that no citizen will stand outside the common store. If it is not, the manuscript goes back to the archives as a curiosity."
chaosx.nr15.1.a: "Put the manifesto into practice."
chaosx.nr15.1.b: "Keep it in the archives."
utopia_manifesto_accept_tree_warning_tt: "§RThe country's national focus tree is replaced by the Utopia Manifesto tree.§! Forces, territory, technology, leaders, parties, and the flag stay as they are. Later choices can bring new public institutions, new leaders, and a new national identity."
utopia_manifesto_reject_cleanup_tt: "The manuscript returns to the archives. The current focus tree stays in place, and no public offices or common measures follow."
