utopia_manifesto_ledger_gui_status: "Route: §Y[GetUtopiaManifestoRoute]§!\nGeography: §Y[GetUtopiaManifestoGeography]§!\nProjects: Stores §Y[?utopia_manifesto_active_storehouse_projects|0]§!  Integration §Y[?utopia_manifesto_active_integration_projects|0]§!"
utopia_manifesto_ledger_gui_network: "League Confidence: §Y[?utopia_league_confidence_display|0]§!\nFriends: §Y[?utopia_manifesto_friend_count|0]§!  League: §Y[?utopia_manifesto_league_member_count|0]§!\nPressure: §Y[GetUtopiaManifestoPressure]§!"
utopia_manifesto_ledger_gui_warning: "High Need or Overreach can make boundary policy harsher. Low Consent or Surplus weakens peaceful integration."
utopia_manifesto_ledger_gui_footer: "Claims require proof, administration, and compliance."
