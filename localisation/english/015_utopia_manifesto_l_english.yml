# Founding Charter repeal and aftermath
decision_utopia_repeal_the_founding_charter: "Repeal the Founding Charter"
decision_utopia_repeal_the_founding_charter_desc: "The constitutional crisis has made a full repeal of the Founding Charter possible. A public winding-up settles the charter, the League, administered ground, and the Manifesto, and it can be started only once."
decision_utopia_repeal_the_founding_charter_effect_tt: "Begins the winding-up of the Founding Charter, lasting between §Y90 and 270 days§!. War and a larger country lengthen it. Stable Plenty, trusted Concord, and relevant public offices shorten it. If Common Provision ends, the capital is lost, or the crisis is resolved first, the repeal stops and what was paid is lost. Completion opens the final choices that end the Founding Charter and the chosen interpretation."
mission_utopia_repeal_the_founding_charter: "Winding Up the Founding Charter"
mission_utopia_repeal_the_founding_charter_desc: "Assemblies, ministries, and public offices are winding down the Founding Charter over §Y90 to 270 days§!. War and a larger country lengthen the term. Stable Plenty, trusted Concord, and relevant public offices shorten it. The repeal stops if Common Provision ends, the capital is lost, or the crisis is resolved another way."
mission_utopia_repeal_the_founding_charter_outcome_tt: "Opens the final settlement. The country chooses ordinary dissolution, succession by a viable League member, or abandonment without a legacy, and then settles its administered ground, its practical institutions, and the Manifesto. The final choice ends the Founding Charter and the chosen interpretation, closes their unfinished undertakings, and dismisses their temporary authorities."
mission_utopia_repeal_the_founding_charter_cancel_tt: "The repeal is interrupted. Need rises by 3, Plenty falls by 3, Concord falls by 5, and Assignment rises by 3. Political Power, Stability, Support Equipment, and Trains already paid are not returned."
utopia_manifesto_total_repeal_warning_tt: "§RThis is a final constitutional course.§! Once the repeal and its settlements are complete, the Founding Charter, the chosen interpretation, public offices, unfinished undertakings, and temporary authorities end. Only the legacies chosen during the final settlement survive."

# Garden Settlement district lifecycle
utopia_manifesto_district_category: "Garden Settlement Districts"
utopia_manifesto_district_category_desc: "Survey owned core states for four district roles. A project must meet housing, transport, and role-plan obligations. Losing the state voids the district and keeps its buildings."
decision_utopia_survey_district_site: "Survey a District Site"
decision_utopia_survey_district_site_desc: "Survey [FROM.GetName] to find which district roles suit both the state and the country's needs. The state must stay a controlled core state and still suit at least one role when the survey ends."
decision_utopia_survey_district_site_effect_tt: "Begins a suitability survey in §Y[FROM.GetName]§! lasting between §Y90 and 270 days§!. War and a larger country lengthen it. Stable Plenty, trusted Concord, and relevant public offices shorten it. The final report lists every role the state and country can still support."
mission_utopia_survey_district_site: "District Suitability Survey"
mission_utopia_survey_district_site_desc: "Surveyors measure population, infrastructure, industrial room, transport, housing, stores, and calling shortages in [FROM.GetName]. Losing control of the state or ending Common Provision cancels the survey. If no role suits the state at review, the site is refused and a public shortfall review opens."
mission_utopia_survey_district_site_success_tt: "Lists every district role that remains suitable in §Y[FROM.GetName]§!. If no role remains suitable, the survey refuses the site and opens a public shortfall review."
decision_utopia_found_market_garden_district: "Found a Market-Garden District"
decision_utopia_found_market_garden_district_desc: "A surveyed state with more than 200,000 residents and Infrastructure level 2 to 4 qualifies when Need is high, the Common Reserve is insecure, or Provisioning is short. Completion adds 1 Infrastructure, and the charter later eases Provisioning and Agriculture by 10 and Civic Works and Transport by 5."
decision_utopia_found_market_garden_district_effect_tt: "Begins construction in §Y[FROM.GetName]§! lasting between §Y90 and 270 days§!. Housing, transport, and market-garden role-plan obligations are checked at review, and passing all three adds 1 Infrastructure."
decision_utopia_found_industrial_housing_district: "Found an Industrial Housing District"
decision_utopia_found_industrial_housing_district_desc: "Needs Homes Near Work and a live housing shortage, in a surveyed state with more than 400,000 residents, Infrastructure level 2 or higher, a Civilian or Military Factory, and a free Civilian Factory slot. Completion adds 1 shared building slot and 1 Civilian Factory, and the charter later eases Workshops and Arsenal by 10 and Civic Works and Transport by 5."
decision_utopia_found_industrial_housing_district_effect_tt: "Begins construction in §Y[FROM.GetName]§! lasting between §Y90 and 270 days§!. Housing, transport, and industrial role-plan obligations are checked at review, and passing all three adds 1 shared building slot and 1 Civilian Factory."
decision_utopia_found_rail_junction_town: "Found a Rail Junction Town"
decision_utopia_found_rail_junction_town_desc: "Needs Common Transport Ground and a surveyed state with more than 100,000 residents, Infrastructure level 2 or 3, and a Supply Hub or Railway. Completion adds 2 Infrastructure, and the charter later eases Civic Works and Transport by 10 and Maritime and Settlement by 5."
decision_utopia_found_rail_junction_town_effect_tt: "Begins construction in §Y[FROM.GetName]§! lasting between §Y90 and 270 days§!. Housing, transport, and rail-junction role-plan obligations are checked at review, and passing all three adds 2 Infrastructure."
decision_utopia_found_refugee_municipality: "Found a Refugee Municipality"
decision_utopia_found_refugee_municipality_desc: "Needs live migration or housing pressure and a Common Reserve of at least 30, in a surveyed state with more than 100,000 residents, Infrastructure level 2 or higher, and a free Civilian Factory slot. Completion adds 1 shared building slot and 1 Civilian Factory, and the charter later eases Maritime and Settlement by 10 and Learning and Care by 5."
decision_utopia_found_refugee_municipality_effect_tt: "Begins construction in §Y[FROM.GetName]§! lasting between §Y90 and 270 days§!. Housing, transport, and refugee role-plan obligations are checked at review, and passing all three adds 1 shared building slot and 1 Civilian Factory."
decision_utopia_attach_penal_works_to_district: "Attach Penal Works to the District"
decision_utopia_attach_penal_works_to_district_desc: "The Closed Island can put forced labor to work in its active district. Penal Works covers the district's role plan and speeds construction, at the cost of civilian lives and lasting resistance."
decision_utopia_attach_penal_works_to_district_effect_tt: "§RCivilians die when the order begins§! and again if the district is completed under it. Penal Works grants §G+25%§! Building Construction Speed, lowers Local Supplies by §R10%§!, raises Required Garrisons by §R25%§!, and sets an initial §R+12%§! Resistance Target. It counts as the district's role plan. The coercion stays in the country's history even if the method is halted."
mission_utopia_build_garden_district: "Build the Garden Settlement District"
mission_utopia_build_garden_district_desc: "Construction in [FROM.GetName] is judged against three obligations at the deadline. Housing must keep the role's population and building room. Transport must keep Infrastructure level 2 or higher and the Trains or Motorized Equipment the role needs. The role plan must keep its factory, equipment, or reserve, unless active Penal Works covers it. Ending Common Provision or losing control of the state cancels the project.\n\n§YHousing§!: [GetUtopiaManifestoDistrictHousingStatus]\n§YTransport§!: [GetUtopiaManifestoDistrictTransportStatus]\n§YRole plan§!: [GetUtopiaManifestoDistrictRolePlanStatus]"
mission_utopia_build_garden_district_success_tt: "At the deadline, all three obligations are checked. Meeting them completes the district in its selected role. Failing leaves an incomplete district with §R-5%§! Local Supplies, §R-10%§! Building Construction Speed, and §R+5%§! Resistance Target. If Penal Works is active at completion, more civilians die."
decision_utopia_complete_district_charter: "Begin the District Charter"
decision_utopia_complete_district_charter_desc: "A completed district can receive a charter that follows the country's chosen interpretation, provided Concord is cooperative. The charter eases two calling families, and losing the state later removes the charter."
decision_utopia_complete_district_charter_effect_tt: "Begins a charter term in §Y[FROM.GetName]§! lasting between §Y90 and 270 days§!. War, a larger country, and the Consent of Households lengthen it. Stable Plenty, trusted Concord, and relevant public offices shorten it. The district must stay built and under control, and the chosen interpretation must stay settled."
mission_utopia_complete_district_charter: "District Charter Term"
mission_utopia_complete_district_charter_desc: "The district is settling its public duties, appeals, stores, and local authority under the country's chosen interpretation. Ending Common Provision or losing control of the state cancels the charter. At review the district must still be complete, with no refusal standing and the interpretation still settled."
mission_utopia_complete_district_charter_success_tt: "Applies the route charter to §Y[FROM.GetName]§! and grants the selected role's calling relief. Consent of Households grants §R-1%§! Local Supplies and §G-5%§! Resistance Target. The Common Table grants §G+5%§! Local Supplies and §G+3%§! Local Resources. The Guardians of Measure grant §G+10%§! Building Construction Speed and §R+3%§! Resistance Target. The Closed Island grants §G+10%§! Local Supplies and begins with §R+8%§! Resistance Target. The Joke Understood grants §G+3%§! Local Supplies and §G-3%§! Resistance Target."

# Bounded-center plans and island construction
utopia_manifesto_island_category: "The Island Project"
utopia_manifesto_island_category_desc: "Build the chosen island plan with equipment, transport, and time. The project stays valid only while its ground is held."
decision_utopia_adopt_existing_island_capital: "Replan Around the Existing Island"
decision_utopia_adopt_existing_island_capital_desc: "Before the island is built, abandon the current survey and commit the project to the capital's own island. Unfinished work loses its recognition, and completed buildings remain."
decision_utopia_adopt_existing_island_capital_effect_tt: "The island plan becomes §YThe Existing Island§!. Unfinished work is abandoned, and previously accepted sites must be surveyed again. Existing buildings stay in their states. Plenty and Concord fall by 3 and Assignment rises by 3."
decision_utopia_adopt_coastal_refuge: "Replan Around a Coastal Refuge"
decision_utopia_adopt_coastal_refuge_desc: "Before the island is built, commit the project to an owned coastal core. Unfinished work loses its recognition, and completed buildings remain."
decision_utopia_adopt_coastal_refuge_effect_tt: "The island plan becomes §YThe Coastal Refuge§!. Unfinished work is abandoned, and previously accepted sites must be surveyed again. Existing buildings stay in their states. Plenty and Concord fall by 3 and Assignment rises by 3."
decision_utopia_adopt_inland_island: "Replan Around the Inland Island"
decision_utopia_adopt_inland_island_desc: "Before the island is built, commit the project to the capital ring and its rail approaches. Unfinished work loses its recognition, and completed buildings remain."
decision_utopia_adopt_inland_island_effect_tt: "The island plan becomes §YThe Inland Island§!. Unfinished work is abandoned, and previously accepted sites must be surveyed again. Existing buildings stay in their states. Plenty and Concord fall by 3 and Assignment rises by 3."
decision_utopia_adopt_archipelago_network: "Replan as an Archipelago Network"
decision_utopia_adopt_archipelago_network_desc: "Before the island is built, divide the project among three owned island cores, each of which must be surveyed and kept. Unfinished work loses its recognition."
decision_utopia_adopt_archipelago_network_effect_tt: "The island plan becomes §YThe Archipelago Network§!. Unfinished work is abandoned, and three distinct island sites must be surveyed again. Existing buildings stay in their states. Plenty and Concord fall by 3 and Assignment rises by 3."
decision_utopia_adopt_leased_island: "Replan Around a Leased Island"
decision_utopia_adopt_leased_island_desc: "Before the island is built, give up the domestic plan and open a Necessary Ground case for one foreign island. Only a peaceful fixed-term lease can satisfy this plan."
decision_utopia_adopt_leased_island_effect_tt: "The island plan becomes §YThe Leased Island§!. Unfinished work is abandoned and a dedicated maritime case opens. Ownership, cores, and claims do not transfer. Plenty and Concord fall by 3 and Assignment rises by 3."
decision_utopia_mark_archipelago_project_site: "Survey an Archipelago Site"
decision_utopia_mark_archipelago_project_site_desc: "Commit survey crews, landing craft, and civic stores to a distinct island core that you own and control. Three completed sites are needed before construction can begin."
decision_utopia_mark_archipelago_project_site_effect_tt: "Begins an island survey in §Y[FROM.GetName]§! lasting between §Y90 and 210 days§!. War and a larger country lengthen the survey. Stable Plenty, trusted Concord, and relevant public offices shorten it. The state is accepted only if it remains an owned, controlled island core at completion."
mission_utopia_secure_archipelago_project_site: "Archipelago Site Survey"
mission_utopia_secure_archipelago_project_site_desc: "Surveyors, harbor crews, and storekeepers are testing whether [FROM.GetName] can carry part of the island project. Losing ownership, control, or core status of the state cancels the survey."
mission_utopia_secure_archipelago_project_site_success_tt: "Accepts §Y[FROM.GetName]§! as one of the three required archipelago sites."
decision_utopia_secure_island_site: "Secure the Project Site"
decision_utopia_secure_island_site_desc: "Commit survey teams, rail material, and guards to the state the chosen plan requires."
decision_utopia_secure_island_site_effect_tt: "Begins the first construction stage in §Y[FROM.GetName]§!, lasting between §Y90 and 330 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it."
decision_utopia_build_common_harbor: "Build the Common Harbor"
decision_utopia_build_common_harbor_desc: "Commit convoys and engineering stores to connect every accepted maritime site. The principal site receives the main harbor works."
decision_utopia_build_common_harbor_effect_tt: "Begins a harbor stage lasting between §Y90 and 330 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it. Every accepted project site receives harbor work, and the principal site receives the main installation."
decision_utopia_build_inland_terminal: "Build the Inland Terminal"
decision_utopia_build_inland_terminal_desc: "Commit trains, motor transport, and support stores to make the capital ring work as an inland island."
decision_utopia_build_inland_terminal_effect_tt: "Begins a terminal project in §Y[FROM.GetName]§! lasting between §Y90 and 330 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it."
decision_utopia_complete_capital_provision_ring: "Complete the Provision Ring"
decision_utopia_complete_capital_provision_ring_desc: "Link the island's transport, stores, workshops, and emergency distribution. Every accepted site receives provision work, and the principal site carries the national reserve."
decision_utopia_complete_capital_provision_ring_effect_tt: "Begins a provision-ring stage lasting between §Y90 and 330 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it. The project remains valid only while every required site is held."
decision_utopia_fortify_without_sealing: "Fortify Without Sealing"
decision_utopia_fortify_without_sealing_desc: "Build open defenses around the island without closing its civil routes or placing every household under the gates."
decision_utopia_fortify_without_sealing_effect_tt: "Begins an open-fortification stage across the accepted sites, lasting between §Y90 and 330 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it."
decision_utopia_close_the_gates: "Close the Gates"
decision_utopia_close_the_gates_desc: "The Closed Island can seal itself behind a defended perimeter and fortify its chosen approaches."
decision_utopia_close_the_gates_effect_tt: "Begins a closed-gates fortification stage, lasting between §Y90 and 330 days§!. War and a larger country lengthen the work. Stable Plenty, trusted Concord, and relevant public offices shorten it. The principal site receives the strongest works, and every secondary archipelago site receives a supporting line."
mission_utopia_build_island_stage: "Island Construction"
mission_utopia_build_island_stage_desc: "Crews are carrying out the selected survey, harbor, terminal, provision, or fortification stage. The chosen ground must remain under lawful control. Later stages also require every accepted site to remain valid."
mission_utopia_build_island_stage_success_tt: "Completes the chosen construction stage and grants its buildings and public recognition."
mission_utopia_hold_island_project_lease: "The Island Lease Term"
mission_utopia_hold_island_project_lease_desc: "The foreign owner has granted temporary control of one island for the island project. The lease never transfers ownership, cores, or claims. When the term ends, control returns to the original owner where possible, and any buildings completed there stay in place. A third-party occupier is not displaced when control returns."
mission_utopia_hold_island_project_lease_timeout_tt: "The fixed lease expires. Control returns to the original owner where possible, and the project can no longer rely on the island. A new peaceful case may be pursued if the maritime shortage remains. Buildings are not removed."
decision_utopia_propose_island_lease_renewal: "Propose an Island-Lease Renewal"
decision_utopia_propose_island_lease_renewal_desc: "Pay for a single renewal negotiation with the original owner. They may extend the lease for three years, offer two years, or refuse."
decision_utopia_propose_island_lease_renewal_effect_tt: "[FROM.GetNameDef] receives a formal renewal proposal. Acceptance extends the current lease. Refusal leaves the original expiration unchanged."
decision_utopia_make_an_island: "Make the Island Real"
decision_utopia_make_an_island_desc: "Commit the final transport and support reserve to prove that the completed island can endure. All required sites and any foreign lease must stay valid, and the Common Reserve must stay secure until the term ends."
decision_utopia_make_an_island_effect_tt: "Begins the final proof, lasting between §Y180 and 660 days§!, twice the ordinary island term. War and a larger country lengthen it. Stable Plenty, trusted Concord, and relevant public offices shorten it. The Perfect Island opening removes §Y30 days§! and caps the term at §Y420 days§!. Completion recognizes the finished works without granting permanent ownership, claims, or cores."
mission_utopia_make_an_island: "The Island Endures"
mission_utopia_make_an_island_desc: "The commonwealth is testing whether stores, routes, defenses, and public order can work together. Losing a required island site, the lawful leased control, or a secure Common Reserve cancels the proof."
mission_utopia_make_an_island_success_tt: "Recognizes the island as materially complete, allowing §YThe Island Made Real§! while every required site remains valid."

