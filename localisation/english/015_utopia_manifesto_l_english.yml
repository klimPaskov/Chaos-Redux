# Decisions and missions
decision_utopia_household_census: "Conduct the Household Census"
decision_utopia_household_census_desc: "Count households, skills, stores, and obligations before deeper policy begins."
decision_utopia_common_storehouse: "Build a Common Storehouse"
decision_utopia_common_storehouse_desc: "Choose a controlled state for a timed storehouse project. Completion improves local supply and Surplus."
decision_utopia_storehouse_audit: "Audit the Storehouse Ledger"
decision_utopia_storehouse_audit_desc: "Review store ledgers and reduce Overreach without direct material cost."
decision_utopia_open_stores: "Open the Emergency Stores"
decision_utopia_open_stores_desc: "Spend Surplus and stability to answer high Need before it becomes a political crisis."
decision_utopia_collect_petitions: "Collect Household Petitions"
decision_utopia_collect_petitions_desc: "Let households speak back to the ledger and recover Consent."
decision_utopia_fund_apprenticeships: "Fund Apprenticeship Lots"
decision_utopia_fund_apprenticeships_desc: "Spend support equipment to improve Vocation Balance through practical training."
decision_utopia_urgent_service: "Call Urgent Service"
decision_utopia_urgent_service_desc: "Use manpower and stability for emergency work. It answers Need but strains Consent and leaves a record of compulsion."
decision_utopia_rural_rotation: "Begin Rural Rotation"
decision_utopia_rural_rotation_desc: "Commit trains and support equipment to a timed rural mission that lowers Need after the harvest rotation completes."
mission_utopia_harvest_rotation: "Harvest Rotation"
mission_utopia_harvest_rotation_desc: "Rural stores, carts, and councils are moving labor through the harvest districts. Success requires the ledger to remain open, reserve trains and support equipment to remain available, core states to stay controlled, Need to stay below crisis, and Vocation Balance to hold."
decision_utopia_household_guard: "Raise the Household Guard"
decision_utopia_household_guard_desc: "Spend infantry equipment, manpower, and army experience to raise defensive household guard units."
decision_utopia_guard_shore: "Guard the Sea Roads"
decision_utopia_guard_shore_desc: "Send convoys and support equipment into a timed guard mission for sea roads and exposed stores."
mission_utopia_household_guard: "Sea-Road Guard"
mission_utopia_household_guard_desc: "Household guards patrol shore routes and supply crossings until the mission resolves. Success requires the ledger to remain open, Overreach to stay safe, and a real defensive pressure such as war, armed borders, or nearby conflict."
decision_utopia_storehouse_engineers: "Form Storehouse Engineers"
decision_utopia_storehouse_engineers_desc: "Spend support equipment, motorized equipment, and army experience to form limited storehouse engineer units."
decision_utopia_just_cause_review: "Hold a Just-Cause Review"
decision_utopia_just_cause_review_desc: "Spend war support to reduce Foreign Suspicion and record the limits of necessary force."
decision_utopia_boundary_arbitration: "Offer Boundary Arbitration"
decision_utopia_boundary_arbitration_desc: "Spend trains and command power to begin witnessed arbitration over a neighbor-held state. Settlement may require compensation, guarantees, or a public refusal."
mission_utopia_boundary_arbitration: "Boundary Arbitration"
mission_utopia_boundary_arbitration_desc: "Witnesses, storekeepers, and surveyors are testing whether the needful claim still holds. Success requires Need to remain proven, the selected state to stay safely owned and controlled by the target, and Overreach and Foreign Suspicion to remain answerable unless observer protections are in place. A stable ledger can settle the claim through compensation or a guarantee-backed charter. Refusal blocks the claim."
decision_utopia_mark_needed_district: "Mark a Needed District"
decision_utopia_mark_needed_district_desc: "Use the Marked Bounds doctrine to begin a hard survey of a needed district. Failure leaves the ledger harsher."
mission_utopia_marked_district_survey: "Marked District Survey"
mission_utopia_marked_district_survey_desc: "Surveyors and wardens are proving whether the marked district can be held under the hard clause. Success requires the Marked Bounds route to remain open and the selected state to remain safely owned and controlled by the target."
decision_utopia_boundary_wardens: "Deploy Boundary Wardens"
decision_utopia_boundary_wardens_desc: "Spend infantry equipment and army experience to guard contested lines and raise a household guard formation."
decision_utopia_common_administration: "Begin Common Administration"
decision_utopia_common_administration_desc: "Begin a timed integration project in a prepared controlled non-core or needful-land state. Local stores, councils, and compliance come before any core."
decision_utopia_local_households: "Seat Local Household Councils"
decision_utopia_local_households_desc: "Spend support equipment to seat local councils, improve compliance, and lower resistance."
decision_utopia_storehouse_aid: "Send Storehouse Aid"
decision_utopia_storehouse_aid_desc: "Spend convoys, support equipment, and war support to aid a neighbor and widen the ledger friendship count."
decision_utopia_send_magistrates: "Send Ledger Magistrates"
decision_utopia_send_magistrates_desc: "Spend support equipment to send magistrates, improving relations while raising suspicion of foreign bookkeeping."
decision_utopia_recognize_friend: "Recognize a Friend of the Ledger"
decision_utopia_recognize_friend_desc: "Recognize a neighbor as a friend of the ledger when Consent is stable."
decision_utopia_league_aid_corridor: "Open a League Aid Corridor"
decision_utopia_league_aid_corridor_desc: "Spend convoys, trains, and support equipment on a timed aid corridor for a League or friendly target."
mission_utopia_league_aid_corridor: "League Aid Corridor"
mission_utopia_league_aid_corridor_desc: "The League aid corridor is being guarded, counted, and delivered. Success requires the target to remain a safe friend, League member, or faction partner, and the country must still hold the reserve convoys, trains, and support equipment at the deadline."
decision_utopia_renunciation_vote: "Call a Renunciation Vote"
decision_utopia_renunciation_vote_desc: "Spend stability to ask the country whether the Marked Bounds clause should be renounced."
mission_utopia_renunciation_vote: "Renunciation Vote"
mission_utopia_renunciation_vote_desc: "Assemblies, storekeepers, and councils are voting on whether the hard clause still binds the commonwealth. Success requires stable Consent and contained Overreach at the deadline."

