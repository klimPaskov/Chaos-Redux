utopia_manifesto_ledger_category: "The Commonwealth Ledger"
utopia_manifesto_ledger_category_desc: "The public account records Need, Plenty, Concord, and the balance between Choice and Assignment. These values respond to shortages, provision, open conduct, compulsory service, local support, and the country's dealings with its neighbors."
