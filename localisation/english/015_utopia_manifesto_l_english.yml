# Focuses
utopia_manifesto_tree: "Utopian Manifesto"
utopia_manifesto_tree_desc: "The manifesto route measures Need, Consent, Surplus, Overreach, Vocation Balance, and Foreign Suspicion through focuses, projects, claims, and late proclamations."
utopia_open_the_manifesto: "Open the Manifesto"
utopia_open_the_manifesto_desc: "The first reading opens the Utopian Ledger and commits the country to visible stores, councils, duties, and doubts."
utopia_translate_the_old_hand: "Translate the Old Hand"
utopia_translate_the_old_hand_desc: "The old hand is copied into a language the ministries can use, opening the first ledger work without yet choosing a doctrine."
utopia_household_census: "Household Census"
utopia_household_census_desc: "Households, tools, mouths, and skills are counted together, giving Need and Vocation Balance a public baseline."
utopia_public_reading_halls: "Public Reading Halls"
utopia_public_reading_halls_desc: "Reading halls turn the manuscript into a public argument, raising Consent before the state claims to speak for anyone."
utopia_first_common_store: "First Common Store"
utopia_first_common_store_desc: "The first storehouse tests whether grain, tools, and ledgers can answer Need without becoming another ministry warehouse."
utopia_register_useful_arts: "Register Useful Arts"
utopia_register_useful_arts_desc: "The useful arts register names which skills answer household Need and which trades still drift outside the ledger."
utopia_measure_need: "Measure Need"
utopia_measure_need_desc: "Surveyors divide want from appetite, making Need high enough to justify action and visible enough to challenge it."
utopia_question_of_boundaries: "Question of Boundaries"
utopia_question_of_boundaries_desc: "The country asks whether land can be called needful without becoming conquest; future claims will answer under scrutiny."
utopia_four_readings: "Four Readings"
utopia_four_readings_desc: "Four public readings split the manifesto into civic, storehouse, guild, and island interpretations."
utopia_living_humanism: "Living Humanism"
utopia_living_humanism_desc: "Living Humanism chooses councils, mercy, and public care as the route's first answer to Need."
utopia_councils_before_ministers: "Councils before Ministers"
utopia_councils_before_ministers_desc: "Local councils receive the first right to object to the ledger, trading speed for Consent and public legitimacy."
utopia_six_hour_country: "Six Hour Country"
utopia_six_hour_country_desc: "The shorter working day makes useful labor a civic promise, improving Vocation Balance while testing Surplus."
utopia_free_sick_tables: "Free Sick Tables"
utopia_free_sick_tables_desc: "Care tables remove the sick from the idle rolls and make mercy part of household accounting."
utopia_consent_assemblies: "Consent Assemblies"
utopia_consent_assemblies_desc: "Assemblies review storehouse and service orders before Overreach can harden into habit."
utopia_mercy_in_the_registers: "Mercy in the Registers"
utopia_mercy_in_the_registers_desc: "The register gains exemptions, appeals, and sick-table witnesses so public duty does not swallow private hardship."
utopia_renounce_the_idle_clause: "Renounce the Idle Clause"
utopia_renounce_the_idle_clause_desc: "The harshest reading of idle land can be renounced by vote, closing a door before it becomes doctrine."
utopia_living_commonwealth: "Living Commonwealth"
utopia_living_commonwealth_desc: "The civic route binds councils, mercy, and shorter labor into a commonwealth that survives by consent."
utopia_common_store_state: "Common Store State"
utopia_common_store_state_desc: "The state commits to public stores as its main instrument, accepting bureaucracy in exchange for visible Surplus."
utopia_grain_without_owners: "Grain without Owners"
utopia_grain_without_owners_desc: "Grain reserves are separated from private hoards and tied to local Need reports."
utopia_standard_measures: "Standard Measures"
utopia_standard_measures_desc: "Weights, rations, and output books are standardized so one district cannot hide want behind another's units."
utopia_train_of_stores: "Train of Stores"
utopia_train_of_stores_desc: "Rail cars and depot crews become part of the storehouse network, moving reserve goods before crisis peaks."
utopia_surplus_without_gold: "Surplus without Gold"
utopia_surplus_without_gold_desc: "Surplus is measured in usable goods and delivered stores rather than the shine of idle reserves."
utopia_central_auditors: "Central Auditors"
utopia_central_auditors_desc: "Auditors gain teeth over storekeepers, lowering waste while adding another pressure point for Overreach."
utopia_crisis_rations: "Crisis Rations"
utopia_crisis_rations_desc: "Ration protocols open emergency stores before hunger becomes a revolt against the ledger."
utopia_store_state: "Store State"
utopia_store_state_desc: "The storehouse route becomes an administrative state with reserves, inspectors, and visible duties."
utopia_guild_commonwealth: "Guild Commonwealth"
utopia_guild_commonwealth_desc: "Guild Commonwealth lets workshops and masters carry the manifesto through skills, patents, and craft service."
utopia_congress_of_masters: "Congress of Masters"
utopia_congress_of_masters_desc: "Masters of craft are made answerable to public use, giving workshops a voice and an obligation."
utopia_apprentice_lots: "Apprentice Lots"
utopia_apprentice_lots_desc: "Apprentice lots spend tools and supervision to move idle hands into named trades."
utopia_second_trade_law: "Second Trade Law"
utopia_second_trade_law_desc: "A second trade is recorded for workers who can serve Need outside their first shop."
utopia_workshop_councils: "Workshop Councils"
utopia_workshop_councils_desc: "Workshops elect councils, unlock craft militia growth, and tie arms production to useful civic work."
utopia_engineer_guilds: "Engineer Guilds"
utopia_engineer_guilds_desc: "Engineer guilds turn repair crews and railway hands into storehouse engineers with clear equipment limits."
utopia_common_patents: "Common Patents"
utopia_common_patents_desc: "Useful inventions are licensed to the common store, speeding industry without letting masters seal knowledge away."
utopia_guild_charter: "Guild Charter"
utopia_guild_charter_desc: "The charter binds masters, apprentices, engineers, and craft militias into a guild commonwealth."
utopia_island_discipline: "Island Discipline"
utopia_island_discipline_desc: "The island reading treats every border as a guarded crossing, by sea where harbors exist and by rail rings where they do not."
utopia_count_the_harbors: "Count the Harbors"
utopia_count_the_harbors_desc: "Harbors are counted as storehouse mouths and invasion doors; inland countries count rail gates and raise the Ring Watch instead."
utopia_convoy_store: "Convoy Store"
utopia_convoy_store_desc: "Convoys become floating storehouses where the country has water; trains and carts take the same ledger role inland."
utopia_watch_the_sea_roads: "Watch the Sea Roads"
utopia_watch_the_sea_roads_desc: "Sea roads are patrolled as supply routes first. Inland rings receive watch posts, signal books, and guarded depots."
utopia_ring_councils: "Ring Councils"
utopia_ring_councils_desc: "Outer councils coordinate stores, warning posts, harbor duties, and inland gate watches around the capital ring."
utopia_shore_engineers: "Shore Engineers"
utopia_shore_engineers_desc: "Engineers harden ports where there is a shore, and rail spines where the compact must build its own island."
utopia_lighthouse_couriers: "Lighthouse Couriers"
utopia_lighthouse_couriers_desc: "Couriers, lights, and signal books make distant storehouses answer before the capital even hears the storm."
utopia_island_compact: "Island Compact"
utopia_island_compact_desc: "The compact turns isolation into discipline, raising store security without pretending the sea is harmless."
utopia_storehouse_spine: "Storehouse Spine"
utopia_storehouse_spine_desc: "A spine of depots, carts, and clerks connects the routes that every later project depends on."
utopia_local_bread_boards: "Local Bread Boards"
utopia_local_bread_boards_desc: "Bread boards compare household Need against local stores before the capital overwrites them."
utopia_civic_granaries: "Civic Granaries"
utopia_civic_granaries_desc: "Granaries are placed under civic watch, raising reserve capacity and public trust together."
utopia_rail_and_cart_routes: "Rail and Cart Routes"
utopia_rail_and_cart_routes_desc: "Rail lines and cart routes are mapped as relief arteries, not just industry lanes."
utopia_account_surplus: "Account Surplus"
utopia_account_surplus_desc: "Surplus is rounded, audited, and displayed so reserve claims can be challenged before they are spent."
utopia_audit_the_auditors: "Audit the Auditors"
utopia_audit_the_auditors_desc: "The auditors are audited in turn, keeping the storehouse route from confusing supervision with truth."
utopia_winter_reserve: "Winter Reserve"
utopia_winter_reserve_desc: "Winter reserves hold back enough for bad months, lowering Need at the cost of tighter store rules."
utopia_surplus_for_neighbors: "Surplus for Neighbors"
utopia_surplus_for_neighbors_desc: "Reserve goods are sent outward when domestic Need is controlled, turning Surplus into diplomacy."
utopia_common_store_network: "Common Store Network"
utopia_common_store_network_desc: "The local boards, rail routes, granaries, and audits become a single network of accountable stores."
utopia_vocation_balance: "Vocation Balance"
utopia_vocation_balance_desc: "The vocation ledger is balanced across farms, workshops, schools, civic service, and defense."
utopia_labor_day_register: "Labor Day Register"
utopia_labor_day_register_desc: "Labor days are recorded by skill and obligation, making emergency work easier to measure and harder to hide."
utopia_children_of_the_workshop: "Children of the Workshop"
utopia_children_of_the_workshop_desc: "Workshop schools turn learning into practical rotation, keeping young skill inside the useful arts."
utopia_rotation_without_idleness: "Rotation without Idleness"
utopia_rotation_without_idleness_desc: "Rotations move workers through needed trades before the idle clause tempts harsher answers."
utopia_useful_arts_colleges: "Useful Arts Colleges"
utopia_useful_arts_colleges_desc: "Colleges teach practical arts, giving research and vocation one public table."
utopia_healers_and_engineers: "Healers and Engineers"
utopia_healers_and_engineers_desc: "Healers and engineers share the same duty ledger, linking public health, repair, and useful training."
utopia_all_useful_arts: "All Useful Arts"
utopia_all_useful_arts_desc: "Every craft receives a public use, closing the vocation branch with skill balanced against Need."
utopia_just_war_review: "Just War Review"
utopia_just_war_review_desc: "War plans are reviewed against Need, defense, and foreign suspicion before the guard is allowed to grow."
utopia_household_guard: "Household Guard"
utopia_household_guard_desc: "Household Guard units defend stores and councils with limited, state-scaled growth."
utopia_storehouse_engineers: "Storehouse Engineers"
utopia_storehouse_engineers_desc: "Storehouse Engineers repair roads, guard depots, and turn support equipment into defensive logistics."
utopia_defensive_drill: "Defensive Drill"
utopia_defensive_drill_desc: "Defensive drills raise readiness while keeping offensive glory outside the ledger."
utopia_no_bloody_glory: "No Bloody Glory"
utopia_no_bloody_glory_desc: "The guard is honored for restraint, not conquest, preserving the path toward a clean defensive record."
utopia_reinforcement_paths: "Reinforcement Paths"
utopia_reinforcement_paths_desc: "Rail, trucks, and route families reinforce guards, engineers, craft militias, harbor watchmen, and League cadres as unlocked."
utopia_guard_the_ledger: "Guard the Ledger"
utopia_guard_the_ledger_desc: "The military branch closes by guarding the ledger itself: no claim, drill, or unit family outranks public Need."
utopia_need_not_conquest: "Need Not Conquest"
utopia_need_not_conquest_desc: "The country records that Need may justify claims only through proof, arbitration, and postwar administration."
utopia_neighbors_read_the_book: "Neighbors Read the Book"
utopia_neighbors_read_the_book_desc: "The first foreign copies travel with observers and gifts, making neighbors participants rather than targets."
utopia_arbitration_tables: "Arbitration Tables"
utopia_arbitration_tables_desc: "Arbitration tables give Needful Land claims a witnessed procedure instead of an instant border order."
utopia_storehouses_abroad: "Storehouses Abroad"
utopia_storehouses_abroad_desc: "Foreign aid corridors prove that a storehouse can be generous without becoming an empire."
utopia_friends_without_treaties: "Friends without Treaties"
utopia_friends_without_treaties_desc: "Friendship is counted by aid and recognition, not secret clauses or hidden guarantees."
utopia_league_of_need: "League of Need"
utopia_league_of_need_desc: "The League turns repeated help into a visible foreign policy watched by Surplus and Suspicion."
utopia_league_aid_corridors: "League Aid Corridors"
utopia_league_aid_corridors_desc: "Aid corridors use trains, convoys, and support equipment to turn friends into durable League members."
utopia_commonwealth_observers: "Commonwealth Observers"
utopia_commonwealth_observers_desc: "Observers keep the League credible by watching claims, stores, and suspicious acts abroad."
utopia_no_secret_empire: "No Secret Empire"
utopia_no_secret_empire_desc: "The diplomatic route swears off hidden empire, lowering suspicion when Needful Land tempts expansion."
utopia_needful_land_question: "Needful Land Question"
utopia_needful_land_question_desc: "The Needful Land question opens claims only as a problem to prove, arbitrate, occupy, and administer."
utopia_prove_need: "Prove Need"
utopia_prove_need_desc: "The claimant must show hunger, control, and supply need before even a paper claim can be made."
utopia_boundary_arbitration: "Boundary Arbitration"
utopia_boundary_arbitration_desc: "A neighbor-held state can enter a timed arbitration mission; proof may produce a claim, failure produces distrust."
utopia_settlement_charters: "Settlement Charters"
utopia_settlement_charters_desc: "Settlement charters set rules for local stores, household councils, and controlled migration after a claim."
utopia_mark_needed_districts: "Mark Needed Districts"
utopia_mark_needed_districts_desc: "Marked districts use the hard clause to seek claims, but every mark raises suspicion and settlement risk."
utopia_postwar_registers: "Postwar Registers"
utopia_postwar_registers_desc: "Postwar registers separate conquest, control, compliance, and real local administration."
utopia_local_storehouses: "Local Storehouses"
utopia_local_storehouses_desc: "Local storehouses add supply, compliance, and resistance relief before any state can be treated as integrated."
utopia_household_councils: "Household Councils"
utopia_household_councils_desc: "Local councils give occupied households a voice before common administration claims their consent."
utopia_common_administration: "Common Administration"
utopia_common_administration_desc: "Common administration starts the timed integration work, spending men and equipment instead of granting free cores."
utopia_integration_without_cores: "Integration without Cores"
utopia_integration_without_cores_desc: "Integration is measured by compliance, councils, stores, and resistance before the map changes its mind."
utopia_compliance_before_core: "Compliance before Core"
utopia_compliance_before_core_desc: "The ledger refuses a core until compliance, councils, and administration make the claim more than ink."
utopia_needful_land_commission: "Needful Land Commission"
utopia_needful_land_commission_desc: "The commission audits every claimed state and rewards peaceful integrations over forced settlement."
utopia_coastal_store_routes: "Coastal Store Routes"
utopia_coastal_store_routes_desc: "Coastal countries route stores through harbors and convoy depots instead of pretending every Need moves by rail."
utopia_landlocked_caravan_stores: "Landlocked Caravan Stores"
utopia_landlocked_caravan_stores_desc: "Landlocked countries build caravan stores and inland depots so geography does not trap Surplus."
utopia_subject_ledger: "Subject Ledger"
utopia_subject_ledger_desc: "Subject countries adapt the ledger around overlord limits, using Consent and Need where sovereignty is thin."
utopia_tiny_country_deep_ledger: "Tiny Country Deep Ledger"
utopia_tiny_country_deep_ledger_desc: "Tiny countries deepen accounting instead of widening bureaucracy, keeping small-state play viable."
utopia_adapt_the_commonwealth: "Adapt the Commonwealth"
utopia_adapt_the_commonwealth_desc: "The adaptation branch accepts coast, island, subject, landlocked, and tiny-country constraints as different routes through the same ledger."
utopia_marked_bounds_clause: "Marked Bounds Clause"
utopia_marked_bounds_clause_desc: "Marked Bounds Clause exposes the hard reading of the manifesto, where idle soil, guarded settlement, and necessary war raise Overreach as well as capability."
utopia_survey_idle_soil: "Survey Idle Soil"
utopia_survey_idle_soil_desc: "Survey Idle Soil exposes the hard reading of the manifesto, where idle soil, guarded settlement, and necessary war raise Overreach as well as capability."
utopia_hard_maps: "Hard Maps"
utopia_hard_maps_desc: "Hard Maps exposes the hard reading of the manifesto, where idle soil, guarded settlement, and necessary war raise Overreach as well as capability."
utopia_boundary_posts: "Boundary Posts"
utopia_boundary_posts_desc: "Boundary posts hold marked lines, raising security while making the claim harder to pretend innocent."
utopia_guarded_settlement: "Guarded Settlement"
utopia_guarded_settlement_desc: "Settlers and guards move together, making every hard claim more secure and more suspicious."
utopia_necessary_war_table: "Necessary War Table"
utopia_necessary_war_table_desc: "The hard route writes down when war is necessary and accepts the Overreach that follows."
utopia_marked_wardens: "Marked Wardens"
utopia_marked_wardens_desc: "Marked wardens expand household guards and craft militias around contested lines."
utopia_bounds_state: "Bounds State"
utopia_bounds_state_desc: "The state accepts the hard doctrine as policy, binding Needful Land to forceful administration."
utopia_no_idle_acre: "No Idle Acre"
utopia_no_idle_acre_desc: "No Idle Acre exposes the hard reading of the manifesto, where idle soil, guarded settlement, and necessary war raise Overreach as well as capability."
utopia_paper_utopia: "Paper Utopia"
utopia_paper_utopia_desc: "If the ledger is thin, the proclamation admits a paper promise and asks the country to recover through work."
utopia_new_utopia: "New Utopia"
utopia_new_utopia_desc: "With Consent, Surplus, and useful work aligned, the country proclaims a New Utopia without the hard clause."
utopia_necessary_commonwealth: "Necessary Commonwealth"
utopia_necessary_commonwealth_desc: "Necessary Commonwealth admits that need has outrun gentler proofs. The stores are guarded, the settlements are watched, and the country survives by recording every hard measure it takes."
utopia_marked_bounds_state: "Marked Bounds State"
utopia_marked_bounds_state_desc: "Marked Bounds State makes the surveyor's stake the first law of the commonwealth. Every idle acre is measured, every refusal is entered, and every border is taught to answer the ledger."
utopia_proclaim_the_common_store: "Proclaim the Common Store"
utopia_proclaim_the_common_store_desc: "The final proclamation names the common store as law, whether triumphant, strained, or chastened."
utopia_the_manifesto_survives: "The Manifesto Survives"
utopia_the_manifesto_survives_desc: "The manifesto survives because its route, costs, claims, and councils have become daily administration."

# Ideas
utopia_manifesto_found_manifesto: "Found Manifesto"
utopia_manifesto_found_manifesto_desc: "The translated book has become state business. It lifts public purpose, but every office now argues over what the promise requires."
utopia_manifesto_unproven_common_stores: "Unproven Common Stores"
utopia_manifesto_unproven_common_stores_desc: "The first stores exist on paper and in a few districts. Until they prove themselves, industry carries the cost of rearranged supply."
utopia_manifesto_vocation_confusion: "Vocation Confusion"
utopia_manifesto_vocation_confusion_desc: "Households, workshops, schools, and barracks are being counted together. The country has not yet learned how to rotate useful work cleanly."
utopia_manifesto_foreign_laughter: "Foreign Laughter"
utopia_manifesto_foreign_laughter_desc: "Foreign ministries treat the manifesto as a curiosity, a threat, or both. Trade and ideological defense suffer while the ledger is untested."
utopia_manifesto_living_humanism_councils: "Living Humanism Councils"
utopia_manifesto_living_humanism_councils_desc: "Assemblies and mercy registers give the commonwealth a human face, lowering resistance and turning compliance into consent."
utopia_manifesto_common_store_state: "Common Store State"
utopia_manifesto_common_store_state_desc: "Public stores, standard measures, and supply routes give the state a material answer to Need."
utopia_manifesto_guild_commonwealth: "Guild Commonwealth"
utopia_manifesto_guild_commonwealth_desc: "Guild offices bind skill, research, and production into a common register without leaving workshops idle."
utopia_manifesto_island_discipline: "Island Discipline"
utopia_manifesto_island_discipline_desc: "Harbors, convoys, rail rings, couriers, and watch councils teach the manifesto to survive through distance."
utopia_manifesto_marked_bounds_surveyors: "Marked Bounds Surveyors"
utopia_manifesto_marked_bounds_surveyors_desc: "Surveyors carry the harsh clause on idle soil. They can open claims, but the ledger records every rise in resistance and Overreach."
utopia_manifesto_public_storehouses: "Public Storehouses"
utopia_manifesto_public_storehouses_desc: "Storehouses extend supply and infrastructure, turning surplus into roads, depots, and visible local bread."
utopia_manifesto_useful_arts_bureaus: "Useful Arts Bureaus"
utopia_manifesto_useful_arts_bureaus_desc: "The useful arts bureaus improve research, efficiency, and resource discipline by recording skill where the ledger can see it."
utopia_manifesto_household_guard: "Household Guard"
utopia_manifesto_household_guard_desc: "The guard is raised for defense of stores and councils, improving organization, reinforcement, and mobilization."
utopia_manifesto_arbitration_tables: "Arbitration Tables"
utopia_manifesto_arbitration_tables_desc: "Boundary tables make neighbors answer Need with witnesses before force, improving diplomacy at the cost of slower claims."
utopia_manifesto_common_administration: "Common Administration"
utopia_manifesto_common_administration_desc: "Local councils, store registers, and magistrates make integration possible through compliance instead of instant incorporation."
utopia_manifesto_needful_land_commission: "Needful Land Commission"
utopia_manifesto_needful_land_commission_desc: "The commission proves Need, prepares postwar registers, and ties claims to infrastructure and administration."
utopia_manifesto_league_of_need: "League of Need"
utopia_manifesto_league_of_need_desc: "Aid corridors and observer ledgers make the manifesto a foreign policy rather than a solitary experiment."
utopia_manifesto_new_utopia: "New Utopia"
utopia_manifesto_new_utopia_desc: "The commonwealth stands on Consent, Surplus, and useful work. Foreign suspicion remains, but the ledger has become law."
utopia_manifesto_necessary_commonwealth: "Necessary Commonwealth"
utopia_manifesto_necessary_commonwealth_desc: "The manifesto survives in a harder form, armed by necessity and watched by citizens who know what the ledger has cost."
utopia_manifesto_paper_utopia: "Paper Utopia"
utopia_manifesto_paper_utopia_desc: "The country has not abandoned the book, but the stores and councils have fallen behind the promise. Recovery must be earned."

# Decisions and missions
decision_utopia_household_census: "Conduct the Household Census"
decision_utopia_household_census_desc: "Count households, skills, stores, and obligations before deeper policy begins."
decision_utopia_common_storehouse: "Build a Common Storehouse"
decision_utopia_common_storehouse_desc: "Choose a controlled state for a timed storehouse project. Completion improves local supply and Surplus."
decision_utopia_storehouse_audit: "Audit the Storehouse Ledger"
decision_utopia_storehouse_audit_desc: "Review store ledgers and reduce Overreach without direct material cost."
decision_utopia_open_stores: "Open the Emergency Stores"
decision_utopia_open_stores_desc: "Spend Surplus and stability to answer high Need before it becomes a political crisis."
decision_utopia_collect_petitions: "Collect Household Petitions"
decision_utopia_collect_petitions_desc: "Let households speak back to the ledger and recover Consent."
decision_utopia_fund_apprenticeships: "Fund Apprenticeship Lots"
decision_utopia_fund_apprenticeships_desc: "Spend support equipment to improve Vocation Balance through practical training."
decision_utopia_urgent_service: "Call Urgent Service"
decision_utopia_urgent_service_desc: "Use manpower and stability for emergency work. It answers Need but strains Consent and leaves a record of compulsion."
decision_utopia_rural_rotation: "Begin Rural Rotation"
decision_utopia_rural_rotation_desc: "Commit trains and support equipment to a timed rural mission that lowers Need after the harvest rotation completes."
mission_utopia_harvest_rotation: "Harvest Rotation"
mission_utopia_harvest_rotation_desc: "Rural stores, carts, and councils are moving labor through the harvest districts. Success requires the ledger to remain open, reserve trains and support equipment to remain available, core states to stay controlled, Need to stay below crisis, and Vocation Balance to hold."
decision_utopia_household_guard: "Raise the Household Guard"
decision_utopia_household_guard_desc: "Spend infantry equipment, manpower, and army experience to raise defensive household guard units."
decision_utopia_guard_shore: "Guard the Sea Roads"
decision_utopia_guard_shore_desc: "Send convoys and support equipment into a timed guard mission for sea roads and exposed stores."
mission_utopia_household_guard: "Sea-Road Guard"
mission_utopia_household_guard_desc: "Household guards patrol shore routes and supply crossings until the mission resolves. Success requires the ledger to remain open, Overreach to stay safe, and a real defensive pressure such as war, armed borders, or nearby conflict."
decision_utopia_storehouse_engineers: "Form Storehouse Engineers"
decision_utopia_storehouse_engineers_desc: "Spend support equipment, motorized equipment, and army experience to form limited storehouse engineer units."
decision_utopia_just_cause_review: "Hold a Just-Cause Review"
decision_utopia_just_cause_review_desc: "Spend war support to reduce Foreign Suspicion and record the limits of necessary force."
decision_utopia_boundary_arbitration: "Offer Boundary Arbitration"
decision_utopia_boundary_arbitration_desc: "Spend trains and command power to begin witnessed arbitration over a neighbor-held state. Settlement may require compensation, guarantees, or a public refusal."
mission_utopia_boundary_arbitration: "Boundary Arbitration"
mission_utopia_boundary_arbitration_desc: "Witnesses, storekeepers, and surveyors are testing whether the needful claim still holds. Success requires Need to remain proven, the selected state to stay safely owned and controlled by the target, and Overreach and Foreign Suspicion to remain answerable unless observer protections are in place. A stable ledger can settle the claim through compensation or a guarantee-backed charter; refusal blocks the claim."
decision_utopia_mark_needed_district: "Mark a Needed District"
decision_utopia_mark_needed_district_desc: "Use the Marked Bounds doctrine to begin a hard survey of a needed district. Failure leaves the ledger harsher."
mission_utopia_marked_district_survey: "Marked District Survey"
mission_utopia_marked_district_survey_desc: "Surveyors and wardens are proving whether the marked district can be held under the hard clause. Success requires the Marked Bounds route to remain open and the selected state to remain safely owned and controlled by the target."
decision_utopia_boundary_wardens: "Deploy Boundary Wardens"
decision_utopia_boundary_wardens_desc: "Spend infantry equipment and army experience to guard contested lines and raise a household guard formation."
decision_utopia_common_administration: "Begin Common Administration"
decision_utopia_common_administration_desc: "Begin a timed integration project in a prepared controlled non-core or needful-land state. Local stores, councils, and compliance come before any core."
decision_utopia_local_households: "Seat Local Household Councils"
decision_utopia_local_households_desc: "Spend support equipment to seat local councils, improve compliance, and lower resistance."
decision_utopia_storehouse_aid: "Send Storehouse Aid"
decision_utopia_storehouse_aid_desc: "Spend convoys, support equipment, and war support to aid a neighbor and widen the ledger friendship count."
decision_utopia_send_magistrates: "Send Ledger Magistrates"
decision_utopia_send_magistrates_desc: "Spend support equipment to send magistrates, improving relations while raising suspicion of foreign bookkeeping."
decision_utopia_recognize_friend: "Recognize a Friend of the Ledger"
decision_utopia_recognize_friend_desc: "Recognize a neighbor as a friend of the ledger when Consent is stable."
decision_utopia_league_aid_corridor: "Open a League Aid Corridor"
decision_utopia_league_aid_corridor_desc: "Spend convoys, trains, and support equipment on a timed aid corridor for a League or friendly target."
mission_utopia_league_aid_corridor: "League Aid Corridor"
mission_utopia_league_aid_corridor_desc: "The League aid corridor is being guarded, counted, and delivered. Success requires the target to remain a safe friend, League member, or faction partner, and the country must still hold the reserve convoys, trains, and support equipment at the deadline."
decision_utopia_renunciation_vote: "Call a Renunciation Vote"
decision_utopia_renunciation_vote_desc: "Spend stability to ask the country whether the Marked Bounds clause should be renounced."
mission_utopia_renunciation_vote: "Renunciation Vote"
mission_utopia_renunciation_vote_desc: "Assemblies, storekeepers, and councils are voting on whether the hard clause still binds the commonwealth. Success requires stable Consent and contained Overreach at the deadline."

