decision_utopia_extend_emergency_calling_levy: "Renew the Emergency Calling Levy"
decision_utopia_extend_emergency_calling_levy_desc: "The levy has covered an urgent calling, but its warrant carries a sunset. Renewing it keeps the temporary commitment in force at another material and constitutional cost."
decision_utopia_extend_emergency_calling_levy_effect_tt: "The levy remains in force for another [?utopia_manifesto_emergency_levy_days|0] days. Concord falls and Assignment rises while the temporary shortage coverage is preserved."
