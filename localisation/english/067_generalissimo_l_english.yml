l_english:
chaosx.nr67.1.t: "Generalissimo"

chaosx.nr67.2.t: "Generalissimo [?generalissimo.GetName]"
chaosx.nr67.2.d: "[?generalissimo.GetName] now holds the rank of Generalissimo and commands every branch of our armed forces. The appointment places the army, navy, and air force under one strategic authority."
chaosx.nr67.2.a: "Glorious day!"

chaosx.news.59.t: "Generalissimo [FROM.GetName] of [?global.generalissimo_country.GetName]"
chaosx.news.59.d: "The Generalissimo of this country has proclaimed himself the greatest general in history. Public speeches and press campaigns praise his victories, and many citizens now treat him as a symbol of national strength."
chaosx.news.59.a: "He is"
