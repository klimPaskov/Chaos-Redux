cbrn_first_chemical_shock_idea: "First Chemical Exposure"
cbrn_first_chemical_shock_idea_desc: "News from the contaminated state has outrun the warning procedures. Units across the country are tightening mask discipline, revising alarms, and learning to operate under a threat that is no longer theoretical. Casualties and disruption stay in the affected state. This brief national penalty reflects that first adjustment."
