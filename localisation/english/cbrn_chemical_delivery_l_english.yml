l_english:
chemical_agent_payload: "Strategic Chemical Agent Lots"
chemical_agent_payload_desc: "Sealed bulk stocks, handling equipment, and verified filling records used to prepare chemical delivery systems. Each agent remains a distinct stockpile model."
chlorine_agent_lot_1: "Chlorine Agent Lot"
chlorine_agent_lot_1_desc: "A low-cost choking-agent stock prepared for controlled transfer into cylinders, projector ammunition, or other authorized delivery systems."
phosgene_agent_lot_1: "Phosgene Agent Lot"
phosgene_agent_lot_1_desc: "A refined choking-agent stock requiring tighter handling and storage discipline than chlorine."
mustard_agent_lot_1: "Mustard Agent Lot"
mustard_agent_lot_1_desc: "A persistent blister-agent stock whose storage, filling, and cleanup burdens remain substantial even before use."
lewisite_agent_lot_1: "Lewisite Agent Lot"
lewisite_agent_lot_1_desc: "A specialized blister-agent stock with demanding sealing and handling requirements."
tabun_agent_lot_1: "Tabun Agent Lot"
tabun_agent_lot_1_desc: "An early nerve-agent stock requiring controlled facilities, protective handling, and strict accounting."
sarin_agent_lot_1: "Sarin Agent Lot"
sarin_agent_lot_1_desc: "A volatile nerve-agent stock whose preparation places heavy demands on safety, detection, and medical readiness."
soman_agent_lot_1: "Soman Agent Lot"
soman_agent_lot_1_desc: "An advanced nerve-agent stock with extreme handling risk and severe consequences if released or captured."
malodor_agent_lot_1: "Malodor Agent Lot"
malodor_agent_lot_1_desc: "An experimental incapacitating stock intended to disrupt movement and force evacuation rather than provide reliable lethal effect."
behavioral_agent_lot_1: "Behavioral Agent Lot"
behavioral_agent_lot_1_desc: "An experimental behavioral-agent stock with uncertain field reliability, difficult handling, and major political risk if exposed."

chemical_artillery_ammunition: "Chemical Artillery Ammunition"
chemical_artillery_ammunition_desc: "Prefilled shells and projector ammunition prepared under the current national filling profile."
chemical_shell_lot_1: "Chemical Shell Lot"
chemical_shell_lot_1_desc: "A tactical lot of filled chemical ammunition. Prepared fire plans consume these stocks and inherit the selected filling profile."

chemical_air_payload: "Chemical Air Payload Lots"
chemical_air_payload_desc: "Class-specific sealed payload assemblies reserved for explicit chemical air operations. Idle aircraft and ordinary air missions cannot consume or release them."
choking_chemical_air_payload_lot_1: "Choking-Agent Air Payload Lot"
choking_chemical_air_payload_lot_1_desc: "A prepared air-delivery lot for the selected choking agent. It is expended only by an explicit operation or raid."
blister_chemical_air_payload_lot_1: "Blister-Agent Air Payload Lot"
blister_chemical_air_payload_lot_1_desc: "A sealed air-delivery lot for the selected persistent blister agent."
nerve_chemical_air_payload_lot_1: "Nerve-Agent Air Payload Lot"
nerve_chemical_air_payload_lot_1_desc: "A tightly controlled air-delivery lot for the selected nerve agent, with extreme safety and attribution risk."
incapacitating_chemical_air_payload_lot_1: "Incapacitating-Agent Air Payload Lot"
incapacitating_chemical_air_payload_lot_1_desc: "An experimental air-delivery lot for the selected incapacitating agent, with uncertain operational reliability."

cbrn_shell_profile_change_in_progress: "Shell Filling Lines Reconfigured"
cbrn_air_profile_change_in_progress: "Air Payload Lines Reconfigured"
cbrn_payload_profile_change_in_progress_tt: "Chemical operations using this payload family remain unavailable until reconfiguration is complete. Prepared stock was lost during cleaning, refitting, and quality control."

cbrn_first_chemical_shock_idea: "First Chemical Exposure"
cbrn_first_chemical_shock_idea_desc: "Reports from the contaminated state have outrun established warning procedures. Units across the country are tightening mask discipline, revising alarms, and learning how to operate under a threat that is no longer theoretical. The immediate casualty and disruption effects remain confined to the affected state; this short national penalty represents the first adaptation cycle."
