l_english:
chaosx.nr28.1.t: "Asteroid Incoming"
chaosx.events_log.events.na_reason.asteroid_target_pool: "\n§RUnavailable: fewer than three countries have a populated impact state and a surviving state under their control.§!"
chaosx.events_log.events.na_reason.asteroid_transaction: "\n§RUnavailable: the asteroid's passage has already been selected.§!"
chaosx.nr28.1.board_desc: "[This.GetAsteroidIncomingOpeningDesc]"
chaosx.nr28.1.desc: "Astronomers have confirmed three possible impact coordinates and one safe passage. Each strike will erase its centre and damage three surrounding land rings. [This.GetAsteroidIncomingEvolutionWarning] Choose the forecast that will become reality."
chaosx.nr28.1.a: "Strike [asteroid_incoming_target_1_country.GetFlag] [asteroid_incoming_target_1_state.GetName], [asteroid_incoming_target_1_country.GetName] ([asteroid_incoming_target_1_state.GetContinent])[This.GetAsteroidIncomingTarget1CapitalClause]"
chaosx.nr28.1.b: "Strike [asteroid_incoming_target_2_country.GetFlag] [asteroid_incoming_target_2_state.GetName], [asteroid_incoming_target_2_country.GetName] ([asteroid_incoming_target_2_state.GetContinent])[This.GetAsteroidIncomingTarget2CapitalClause]"
chaosx.nr28.1.c: "Strike [asteroid_incoming_target_3_country.GetFlag] [asteroid_incoming_target_3_state.GetName], [asteroid_incoming_target_3_country.GetName] ([asteroid_incoming_target_3_state.GetContinent])[This.GetAsteroidIncomingTarget3CapitalClause]"
chaosx.nr28.1.d: "Choose the near miss: no impact or dust"
chaosx.nr28.1.na: "N/A: fewer than three valid target pairs"
chaosx.nr28.1.na.tt: "No complete set of three distinct valid country and state coordinates can be calculated. The object cannot be redirected."
chaosx.nr28.1.blocked_desc: "The observatories cannot identify three inhabited impact regions whose governments retain a surviving territory. No complete set of trajectories is available."
chaosx.nr28.8.a: "$chaosx.nr28.1.a$"
chaosx.nr28.8.b: "$chaosx.nr28.1.b$"
chaosx.nr28.8.c: "$chaosx.nr28.1.c$"
chaosx.nr28.8.d: "$chaosx.nr28.1.d$"
chaosx.nr28.8.na: "$chaosx.nr28.1.na$"

chaosx.nr28.1.warning.none: ""
chaosx.nr28.1.warning.fragmentation: "Global Fragmentation is active: additional fragments will strike elsewhere."
chaosx.nr28.1.warning.minerals: "Global Fragmentation and Extraordinary Minerals are active: additional fragments will strike elsewhere and crater control will improve land-armour performance."

chaosx.nr28.2.t: "Confirm the Trajectory"
chaosx.nr28.2.d: "The predicted course crosses [asteroid_incoming_candidate_country.GetFlag] [asteroid_incoming_candidate_state.GetName] in [asteroid_incoming_candidate_country.GetName], on [asteroid_incoming_candidate_state.GetContinent].[This.GetAsteroidIncomingCandidateCapitalClause] A strike will erase the centre, damage three surrounding land rings, and spread atmospheric dust. [This.GetAsteroidIncomingEvolutionWarning] Accept it to lock the coordinate for two days, or return to the same forecast board."
chaosx.nr28.2.a: "Lock this coordinate"
chaosx.nr28.2.b: "Reconsider the forecast"
chaosx.nr28.2.c: "The coordinate is no longer valid"

chaosx.nr28.3.t: "Prepare for the Impact"
chaosx.nr28.3.d: "The trajectory is locked on [asteroid_incoming_locked_country.GetFlag] [asteroid_incoming_locked_state.GetName] in [asteroid_incoming_locked_country.GetName]. Choose one national preparation before the impact."
chaosx.nr28.3.a: "Preserve command continuity"
chaosx.nr28.3.b: "Disperse transport and reserves"
chaosx.nr28.3.c: "Mobilize medical command"
chaosx.nr28.3.a.tt: "The government dislocation after the impact is shorter and milder."
chaosx.nr28.3.b.tt: "Whatever we choose, the impact destroys §Y[?constant:asteroid_incoming_cost.transport_loss_per_state|%0]§! of our trains, trucks and fuel for each state of the main impact zone we hold, up to §Y[?constant:asteroid_incoming_cost.transport_loss_cap|%0]§!. Dispersed transport keeps §Y[?constant:asteroid_incoming_cost.transport_dispersion_preserved_share|%0]§! of that loss, and our first emergency rail corridor and debris clearance cost less."
chaosx.nr28.3.c.tt: "Impact damage in our states is shorter, rescue deaths fall, and our first mobile hospitals cost less."

chaosx.nr28.5.t: "Asteroid Impact Report"
chaosx.nr28.5.d: "[This.GetName] Impact Summary\nWorst-hit state: [This.GetAsteroidIncomingReportWorstState] | Damage: [This.GetAsteroidIncomingWorstDamageProfile]\nCivilian deaths: [?asteroid_incoming_country_actual_deaths|0] | Affected states: [?asteroid_incoming_country_affected_state_count|0]\nLevels lost: [?asteroid_incoming_country_industry_levels_lost|0] industrial | [?asteroid_incoming_country_logistics_levels_lost|0] logistics | [?asteroid_incoming_country_strategic_levels_lost|0] strategic\nOpening rescue burden: [?asteroid_incoming_country_rescue_burden|0] state-months\nCapital relocations: [?asteroid_incoming_country_capital_relocated_count|0] ([This.GetAsteroidIncomingCapitalRelocationClause])[This.GetAsteroidIncomingTransportLossClause]\nDust: [This.GetAsteroidIncomingOpeningDustStage] at opening | [This.GetAsteroidIncomingCurrentDustStage] now\nProtection: [This.GetAsteroidIncomingNationalProtection] | Recovery: [This.GetAsteroidIncomingRecoveryPhase]"
chaosx.nr28.5.a: "Acknowledge the report"
chaosx.nr28.5.a.tt: "Close this national impact summary."

chaosx.nr28.6.t: "The Emergency Burden Ends"
chaosx.nr28.6.d: "The last timed impact-zone restrictions in [This.GetName] have been lifted. Rescue deaths have ended, damaged corridors can again be managed through ordinary administration, and no national recovery mission remains open. Permanent craters and the losses recorded around them remain part of the country."
chaosx.nr28.6.a: "Stand down the emergency response"
chaosx.nr28.6.a.tt: "The national recovery burden and its temporary restrictions end. Permanent crater conditions remain."

chaosx.nr28.7.t: "Fragment Impact Report"
chaosx.nr28.7.d: "[This.GetName] Fragment Summary\nWorst-hit state: [This.GetAsteroidIncomingReportWorstState] | Damage: [This.GetAsteroidIncomingWorstDamageProfile]\nCivilian deaths: [?asteroid_incoming_country_actual_deaths|0] | Affected states: [?asteroid_incoming_country_affected_state_count|0]\nLevels lost: [?asteroid_incoming_country_industry_levels_lost|0] industrial | [?asteroid_incoming_country_logistics_levels_lost|0] logistics | [?asteroid_incoming_country_strategic_levels_lost|0] strategic\nOpening rescue burden: [?asteroid_incoming_country_rescue_burden|0] state-months\nDust: [This.GetAsteroidIncomingOpeningDustStage] at opening | [This.GetAsteroidIncomingCurrentDustStage] now\nProtection: [This.GetAsteroidIncomingNationalProtection] | Recovery: [This.GetAsteroidIncomingRecoveryPhase]"
chaosx.nr28.7.a: "Acknowledge the fragment report"
chaosx.nr28.7.a.tt: "Close this consolidated fragment-impact summary."

chaosx.news.29.t: "Asteroid Incoming"
chaosx.news.29.d: "Scientists in [FROM.GetName] are racing to calculate where the asteroid will strike. Their instruments and mathematical models may identify the impact region before the sky changes."
chaosx.news.29.a: "The sky is being measured."

chaosx.news.30.t: "The Forecast Holds"
chaosx.news.30.d: "Observatories have locked the asteroid's course on [asteroid_incoming_original_target_state.GetName] in [asteroid_incoming_original_target_country.GetName], on [asteroid_incoming_original_target_state.GetContinent]. Impact is expected on [?global.asteroid_incoming_expected_impact_date.GetDateStringNoHour]. Governments are moving people, equipment, and records away from the predicted region while the final hours pass."
chaosx.news.30.a: "Every hour matters."

chaosx.news.96.t: "The Asteroid Passes"
chaosx.news.96.d: "The asteroid has passed Earth without impact. Observatory teams are refining its measured course and cataloguing the narrow passage, while emergency orders prepared during the forecast are stood down. No crater or atmospheric dust was created."
chaosx.news.96.a: "Keep watching the sky."

chaosx.news.97.t: "The Trajectory Breaks Apart"
chaosx.news.97.d: "The locked impact coordinate ceased to be a viable terrestrial target before the asteroid arrived. Tracking stations report a broken terminal course and no confirmed surface strike. No replacement coordinate was selected, and no impact aftermath has begun."
chaosx.news.97.a: "The forecast closes without a strike."

chaosx.news.32.t: "Asteroid Impact"
chaosx.news.32.d: "An asteroid struck [asteroid_incoming_super_event_main_state.GetName] in [asteroid_incoming_super_event_target_country.GetName], on [asteroid_incoming_super_event_main_state.GetContinent]. The centre is gone and three shock rings cross nearby borders. [?global.asteroid_incoming_total_deaths|0] civilians died across [?global.asteroid_incoming_affected_state_count|0] states in [?global.asteroid_incoming_affected_country_count|0] countries. Atmospheric dust has risen to [This.GetAsteroidIncomingOpeningDustStage]. [This.GetAsteroidIncomingNewsFragmentClause]"
chaosx.news.32.a: "The Earth remembers the blow."

chaosx.news.92.t: "Impact Winter Relents"
chaosx.news.92.d: "The atmospheric dust score has fallen below the impact-winter threshold. The cold remains dangerous, but transport and production are emerging from the worst disruption."
chaosx.news.92.a: "The light is returning."

chaosx.news.93.t: "Residual Haze"
chaosx.news.93.d: "The global dust veil has thinned to residual haze. Dirty air still hinders factories, supply routes, and aircraft, but the worldwide penalties are easing."
chaosx.news.93.a: "Keep the filters running."

chaosx.news.94.t: "The Dust Clears"
chaosx.news.94.d: "The atmospheric dust score has reached the clear stage. Craters and damaged states remain, but the worldwide production, supply, air, and weather penalties have ended."
chaosx.news.94.a: "Begin the next chapter."

asteroid_incoming.evolution.type: "Asteroid Incoming"
asteroid_incoming.evolution.fragmentation.title: "Global Fragmentation"
asteroid_incoming.evolution.minerals.title: "Extraordinary Minerals"
asteroid_incoming.evolution.fragmentation.body: "The altered trajectory breaks the asteroid apart. The main body still strikes the chosen state, while §Y[?constant:asteroid_incoming_runtime.fragment_site_goal_at_600|0]§! to §Y[?constant:asteroid_incoming_runtime.fragment_site_goal_at_900|0]§! smaller fragments, rising with Chaos, strike populated states elsewhere in the world. Each fragment leaves its own crater and two rings of damage, and adds to the atmospheric dust."
asteroid_incoming.evolution.fragmentation.summary: "The asteroid broke apart, and its fragments struck around the world."
asteroid_incoming.evolution.minerals.body: "The impact sites hold extraordinary material. The country controlling the main crater gains §G[?constant:asteroid_incoming_mineral.main_crater_armour_factor|%0]§! land-division armour, and each controlled fragment site adds §G[?constant:asteroid_incoming_mineral.fragment_site_armour_factor|%0]§!. Craters become military objectives with their own security, survey, fortification, and rival actions."
asteroid_incoming.evolution.minerals.summary: "The craters hold extraordinary material worth fighting over."
asteroid_incoming.event_details.description: "Astronomers identify three possible impact sites and one near-miss course. A strike destroys its centre, damages three surrounding land rings, spreads atmospheric dust, and opens national recovery work. Global Fragmentation adds further impact sites, while Extraordinary Minerals makes control of those sites strategically valuable. The near miss causes no physical damage."
asteroid_incoming.event.na_reason.target_pool: "Unavailable: fewer than three distinct country and state target pairs are valid."
asteroid_incoming.target.capital: ", current capital"
asteroid_incoming.target.capital_sentence: " This state is the country's current capital."
asteroid_incoming.target.not_capital: ""

asteroid_incoming.event_details.history.miss: "§YNear Miss§!\nClosest approach: §Y[?global.asteroid_incoming_close_passage_date.GetDateStringNoHour]§!\nOutcome: The asteroid passed Earth without impact. No crater, fragments, deaths, damage, or atmospheric dust were created."
asteroid_incoming.event_details.history.impact: "§YImpact§!\nImpact date: §Y[?global.asteroid_incoming_impact_date.GetDateStringNoHour]§!\nImpact site: §Y[asteroid_incoming_original_target_state.GetName]§!, §Y[asteroid_incoming_original_target_country.GetName]§![This.GetAsteroidIncomingImpactCapitalClause]\nAffected states: §Y[?global.asteroid_incoming_affected_state_count|0]§! in §Y[?global.asteroid_incoming_affected_country_count|0]§! countries\nCivilian deaths: §R[?global.asteroid_incoming_total_deaths|0]§!\nFragment sites: §Y[?global.asteroid_incoming_fragment_site_count|0]§!\nOpening dust stage: §Y[This.GetAsteroidIncomingOpeningDustStage]§!\nCurrent dust score: §Y[?global.asteroid_incoming_dust_score|1]§!\n\n[This.GetAsteroidIncomingCurrentControlSummary]"
asteroid_incoming.event_details.history.fail_closed: "§YTrajectory Unresolved§!\nForecast target: §Y[asteroid_incoming_original_target_state.GetName]§!, §Y[asteroid_incoming_original_target_country.GetName]§!\nOutcome: The targeting sequence closed without a valid locked trajectory. No impact effects were applied."

asteroid_incoming.history.row.opening: "#[?global.events_log_view_sequence_entries^events_log_history_index|0]  [?global.events_log_view_date_entries^events_log_history_index.GetDateStringNoHour]  Event ID: §Y[?global.events_log_view_event_id_entries^events_log_history_index|0]§!  Type: [GetEventsLogHistoryTypeView]\nActor: §Y[?global.events_log_view_actor_entries^events_log_history_index.GetName]§!\nOutcome: Three possible impact coordinates and a genuine near miss were presented for selection."
asteroid_incoming.history.row.impact: "#[?global.events_log_view_sequence_entries^events_log_history_index|0]  [?global.events_log_view_date_entries^events_log_history_index.GetDateStringNoHour]  Event ID: §Y[?global.events_log_view_event_id_entries^events_log_history_index|0]§!  Type: [GetEventsLogHistoryTypeView]\nActor: §Y[?global.events_log_view_actor_entries^events_log_history_index.GetName]§!\nTarget country: §Y[?global.events_log_view_secondary_actor_entries^events_log_history_index.GetName]§!\nOutcome: The asteroid struck §Y[asteroid_incoming_original_target_state.GetName]§!. §R[?global.asteroid_incoming_total_deaths|0]§! civilians died across §Y[?global.asteroid_incoming_affected_state_count|0]§! affected states."
asteroid_incoming.history.row.miss: "#[?global.events_log_view_sequence_entries^events_log_history_index|0]  [?global.events_log_view_date_entries^events_log_history_index.GetDateStringNoHour]  Event ID: §Y[?global.events_log_view_event_id_entries^events_log_history_index|0]§!  Type: [GetEventsLogHistoryTypeView]\nActor: §Y[?global.events_log_view_actor_entries^events_log_history_index.GetName]§!\nOutcome: The asteroid made its closest passage on §Y[?global.asteroid_incoming_close_passage_date.GetDateStringNoHour]§! and missed Earth."
asteroid_incoming.history.row.fail_closed: "#[?global.events_log_view_sequence_entries^events_log_history_index|0]  [?global.events_log_view_date_entries^events_log_history_index.GetDateStringNoHour]  Event ID: §Y[?global.events_log_view_event_id_entries^events_log_history_index|0]§!  Type: [GetEventsLogHistoryTypeView]\nActor: §Y[?global.events_log_view_actor_entries^events_log_history_index.GetName]§!\nOutcome: The targeting sequence closed without a valid trajectory, and no impact effects were applied."

asteroid_incoming_achievement_eligible_tooltip: "These achievements track persistent choices, territorial control, recovery, and disqualifying outcomes."
asteroid_incoming_preserve_the_near_miss: "Preserve the Near Miss"
asteroid_incoming_preserve_the_near_miss_NAME: "Preserve the Near Miss"
asteroid_incoming_preserve_the_near_miss_DESC: "With Chaos at [?constant:asteroid_incoming_runtime.minerals_chaos_threshold|0] or higher and both asteroid evolutions enabled, choose the near miss. The asteroid passes Earth with no impact, fragments, crater or dust."
asteroid_incoming_preserve_the_near_miss_tooltip: "Choose the near miss with Chaos at §Y[?constant:asteroid_incoming_runtime.minerals_chaos_threshold|0]§! or higher while both asteroid evolutions are enabled and eligible. No impact, fragment, crater or dust may follow."
asteroid_incoming_government_beyond_the_crater: "Government Beyond the Crater"
asteroid_incoming_government_beyond_the_crater_NAME: "Government Beyond the Crater"
asteroid_incoming_government_beyond_the_crater_DESC: "As the country whose capital takes the main impact, move the government to a surviving state. Within [?constant:asteroid_incoming_runtime.global_achievement_deadline_days|0] days of the impact, complete Reconnect the National Network and Restore the Outer Ring while the new capital stays yours."
asteroid_incoming_government_beyond_the_crater_tooltip: "As the country whose capital took the main impact, move the government to a surviving state, then complete §YReconnect the National Network§! and §YRestore the Outer Ring§! within §Y[?constant:asteroid_incoming_runtime.global_achievement_deadline_days|0]§! days of the impact while you still hold the new capital."
asteroid_incoming_collector_of_fallen_stars: "Collector of Fallen Stars"
asteroid_incoming_collector_of_fallen_stars_NAME: "Collector of Fallen Stars"
asteroid_incoming_collector_of_fallen_stars_DESC: "While Extraordinary Minerals is active, directly control the main crater and at least [?constant:asteroid_incoming_runtime.collector_minimum_controlled_fragments|0] fragment sites for [?constant:asteroid_incoming_runtime.collector_hold_days|0] days in a row. Sites held by your subjects do not count."
asteroid_incoming_collector_of_fallen_stars_tooltip: "While Extraordinary Minerals is active, directly control the main crater and at least §Y[?constant:asteroid_incoming_runtime.collector_minimum_controlled_fragments|0]§! fragment sites for §Y[?constant:asteroid_incoming_runtime.collector_hold_days|0]§! days in a row. Sites held by your subjects do not count."
asteroid_incoming_piercing_the_impossible: "Piercing the Impossible"
asteroid_incoming_piercing_the_impossible_NAME: "Piercing the Impossible"
asteroid_incoming_piercing_the_impossible_DESC: "While Extraordinary Minerals is active, capture the main crater in war from an enemy that draws armour from it, then hold it for [?constant:asteroid_incoming_runtime.main_capture_hold_days|0] days in a row."
asteroid_incoming_piercing_the_impossible_tooltip: "While Extraordinary Minerals is active, capture the main crater in war from an enemy that draws land-division armour from it, then hold it for §Y[?constant:asteroid_incoming_runtime.main_capture_hold_days|0]§! days in a row."
asteroid_incoming_world_reconnected: "A World Reconnected"
asteroid_incoming_world_reconnected_NAME: "A World Reconnected"
asteroid_incoming_world_reconnected_DESC: "After an impact whose dust opens at Impact Winter or worse, and without being its target, harden your factories, protect your transport reserves and join the observation network. Keep Hardened protection until the dust clears."
asteroid_incoming_world_reconnected_tooltip: "After an impact whose dust opens at §YImpact Winter§! or worse, and without being the original target, harden your factories, protect your transport reserves and join the observation network. Keep §YHardened§! dust protection until the dust has fully cleared."

asteroid_incoming_recovery_category: "Asteroid Recovery"
asteroid_incoming_recovery_category_desc: "Dust: §Y[This.GetAsteroidIncomingCurrentDustStage]§! | Protection: §Y[This.GetAsteroidIncomingNationalProtection]§! | Recovery: §Y[This.GetAsteroidIncomingRecoveryPhase]§![This.GetAsteroidIncomingCraterControlClause]"

decision_asteroid_incoming_deploy_mobile_hospitals: "Deploy Mobile Hospitals"
decision_asteroid_incoming_deploy_mobile_hospitals_desc: "Send medical columns to [FROM.GetName] to restore part of its lost infrastructure and supply capacity. $asteroid_incoming.cost.state_price_note$"
decision_asteroid_incoming_open_emergency_rail_corridor: "Open an Emergency Rail Corridor"
decision_asteroid_incoming_open_emergency_rail_corridor_desc: "Commit trains, fuel, and engineers to reopen transport through [FROM.GetName]. $asteroid_incoming.cost.state_price_note$"
decision_asteroid_incoming_clear_unstable_debris: "Clear Unstable Debris"
decision_asteroid_incoming_clear_unstable_debris_desc: "Clear dangerous wreckage from [FROM.GetName] and restore part of its lost infrastructure and industry. $asteroid_incoming.cost.state_price_note$"
decision_asteroid_incoming_distribute_emergency_filters: "Distribute Emergency Filters"
decision_asteroid_incoming_distribute_emergency_filters_desc: "Use [FROM.GetName] as the distribution point for a national dust-protection network. $asteroid_incoming.cost.state_price_note$"
decision_asteroid_incoming_rebuild_supply_spine: "Rebuild the Supply Spine"
decision_asteroid_incoming_rebuild_supply_spine_desc: "Reconnect [FROM.GetName] to the national network and end its local shock burden. $asteroid_incoming.cost.state_price_note$"
decision_asteroid_incoming_restore_outer_ring_industry: "Restore Outer-Ring Industry"
decision_asteroid_incoming_restore_outer_ring_industry_desc: "Reopen damaged factories and dockyards in [FROM.GetName] after securing the shock ring. $asteroid_incoming.cost.state_price_note$"
decision_asteroid_incoming_rehouse_displaced_workers: "Rehouse Displaced Workers"
decision_asteroid_incoming_rehouse_displaced_workers_desc: "Rehouse displaced workers in safe districts of [FROM.GetName] and restore part of the state's lost capacity. $asteroid_incoming.cost.state_price_note$"
decision_asteroid_incoming_harden_factories_against_dust: "Harden Factories Against Dust"
decision_asteroid_incoming_harden_factories_against_dust_desc: "Seal production sites against atmospheric dust, raise protection to Hardened, and add one point of global mitigation. $asteroid_incoming.cost.dust_price_note$"
decision_asteroid_incoming_protect_transport_reserves: "Protect Transport Reserves"
decision_asteroid_incoming_protect_transport_reserves_desc: "Disperse trains, fuel, and transport stores, raise protection to Organized, and add one point of global mitigation. $asteroid_incoming.cost.dust_price_note$"
decision_asteroid_incoming_join_observation_network: "Join the Observation Network"
decision_asteroid_incoming_join_observation_network_desc: "Share atmospheric readings through a global observation network and add one point of global mitigation. $asteroid_incoming.cost.dust_price_note$"
decision_asteroid_incoming_secure_crater_perimeter: "Secure the Crater Perimeter"
decision_asteroid_incoming_secure_crater_perimeter_desc: "Establish a defensive perimeter around [FROM.GetName], reduce garrison attrition, and prepare the site for a material survey."
decision_asteroid_incoming_survey_extraordinary_material: "Survey Extraordinary Material"
decision_asteroid_incoming_survey_extraordinary_material_desc: "Study the unusual material at [FROM.GetName] and record its structure for future industry research."
decision_asteroid_incoming_fortify_crater_access: "Fortify Crater Access"
decision_asteroid_incoming_fortify_crater_access_desc: "Build defences and improve supply in up to §Y[?constant:asteroid_incoming_crater.access_state_limit|0]§! controlled access states around [FROM.GetName]. The crater itself remains unusable for construction."
decision_asteroid_incoming_reconnoiter_crater_site: "Reconnoitre a Crater Site"
decision_asteroid_incoming_reconnoiter_crater_site_desc: "Map the hostile site controlled by [FROM.CONTROLLER.GetName] and report its military position."
decision_asteroid_incoming_disrupt_extraction_routes: "Disrupt Extraction Routes"
decision_asteroid_incoming_disrupt_extraction_routes_desc: "Interfere with the local supply of enemy-held access states around [FROM.GetName] for a limited period."
decision_asteroid_incoming_prepare_crater_offensive: "Prepare a Crater Offensive"
decision_asteroid_incoming_prepare_crater_offensive_desc: "Prepare an assault on the enemy-held [FROM.GetName]. The attack plan applies only to battles at the site."

decision_asteroid_incoming_deploy_mobile_hospitals_tt: "Restore emergency infrastructure and supply capacity in [FROM.GetName]. If fewer than §Y[?constant:asteroid_incoming_recovery.active_mission_limit|0]§! recovery missions are running, begin Keep the Rescue Route Open there."
decision_asteroid_incoming_open_emergency_rail_corridor_tt: "Restore emergency transport through [FROM.GetName] and protect national transport reserves. If fewer than §Y[?constant:asteroid_incoming_recovery.active_mission_limit|0]§! recovery missions are running, begin Keep the Rescue Route Open there."
decision_asteroid_incoming_clear_unstable_debris_tt: "Restore emergency infrastructure and industry in [FROM.GetName]. If fewer than §Y[?constant:asteroid_incoming_recovery.active_mission_limit|0]§! recovery missions are running, begin Stabilize the Damaged Zone in our two worst-hit states."
decision_asteroid_incoming_distribute_emergency_filters_tt: "Raise national dust protection to Basic and add one point of global mitigation."
decision_asteroid_incoming_rebuild_supply_spine_tt: "Restore network capacity in [FROM.GetName]. If fewer than §Y[?constant:asteroid_incoming_recovery.active_mission_limit|0]§! recovery missions are running, begin Reconnect the National Network."
decision_asteroid_incoming_restore_outer_ring_industry_tt: "Restore factories and dockyards in [FROM.GetName]. If fewer than §Y[?constant:asteroid_incoming_recovery.active_mission_limit|0]§! recovery missions are running, begin Restore the Outer Ring."
decision_asteroid_incoming_rehouse_displaced_workers_tt: "Restore housing capacity in [FROM.GetName]. If we were the original target and fewer than §Y[?constant:asteroid_incoming_recovery.active_mission_limit|0]§! recovery missions are running, begin Rebuild the Regional Economy."
decision_asteroid_incoming_harden_factories_against_dust_tt: "Raise national dust protection to Hardened and add one point of global mitigation."
decision_asteroid_incoming_protect_transport_reserves_tt: "Raise national dust protection to Organized, protect transport reserves, and add one point of global mitigation."
decision_asteroid_incoming_join_observation_network_tt: "Join the observation network and add one point of global mitigation."
decision_asteroid_incoming_secure_crater_perimeter_tt: "Establish the perimeter at [FROM.GetName]. While you control the site, its defenders gain §G[?constant:asteroid_incoming_crater.security_defence|%0]§! defence and your attrition there changes by §G[?constant:asteroid_incoming_crater.security_attrition|%0]§!. The material survey becomes available."
decision_asteroid_incoming_survey_extraordinary_material_tt: "Record the structural profile of [FROM.GetName] and gain §Y[?constant:asteroid_incoming_crater.survey_research_uses|0]§! industry research bonus of §G[?constant:asteroid_incoming_crater.survey_research_bonus|%0]§!."
decision_asteroid_incoming_fortify_crater_access_tt: "In up to §Y[?constant:asteroid_incoming_crater.access_state_limit|0]§! controlled access states next to [FROM.GetName], add §Y[?constant:asteroid_incoming_crater.access_building_levels|0]§! infrastructure level below level §Y[?constant:asteroid_incoming_crater.infrastructure_level_cap|0]§! and §Y[?constant:asteroid_incoming_crater.access_building_levels|0]§! fort level in every province below fort level §Y[?constant:asteroid_incoming_crater.bunker_level_cap|0]§!. The crater itself is untouched."
decision_asteroid_incoming_reconnoiter_crater_site_tt: "Gain §G[?constant:asteroid_incoming_crater.recon_army_intel|0]§! army intelligence on [FROM.CONTROLLER.GetName] by mapping [FROM.GetName]."
decision_asteroid_incoming_disrupt_extraction_routes_tt: "In up to §Y[?constant:asteroid_incoming_crater.access_state_limit|0]§! access states next to [FROM.GetName] held by countries at war with you, local supplies for the enemy controller change by §G[?constant:asteroid_incoming_crater.access_supply_disruption|%0]§! for §Y[?constant:asteroid_incoming_crater.operation_days|0]§! days."
decision_asteroid_incoming_prepare_crater_offensive_tt: "Your attacks into [FROM.GetName] gain §G[?constant:asteroid_incoming_crater.offensive_attack|%0]§! attack for §Y[?constant:asteroid_incoming_crater.operation_days|0]§! days."

