asteroid_incoming_crater_perimeter_security: "Secured Crater Perimeter"
asteroid_incoming_crater_perimeter_security_desc: "A defended cordon reduces the controller's attrition and improves local defence at this crater."
asteroid_incoming_crater_surveyed_material: "Surveyed Extraordinary Material"
asteroid_incoming_crater_surveyed_material_desc: "Survey teams have mapped the unusual structure and recoverable strata at this site. The profile remains available for later study."
asteroid_incoming_crater_access_supply_disruption: "Crater Access Supply Disruption"
asteroid_incoming_crater_access_supply_disruption_desc: "Interference near the crater has cut the local supplies available to this state's enemy controller."
asteroid_incoming_crater_offensive_plan: "Crater Offensive Plan"
asteroid_incoming_crater_offensive_plan_desc: "The prepared assault receives an attack advantage only in battles at this crater."
asteroid_incoming_crater_survey_bonus: "Surveyed Crater Material"

asteroid_incoming_rescue_route_mission: "Keep the Rescue Route Open"
asteroid_incoming_rescue_route_mission_desc: "Relief convoys must reach [This.GetAsteroidIncomingRescueMissionState] on rebuilt roads and rails. From §Y[?asteroid_incoming_rescue_mission_ready_date.GetDateStringNoHour]§!, the route is certified once the state has back at least §Y[?constant:asteroid_incoming_recovery.mission_repair_share|%0]§! of the infrastructure, railway and supply hubs it had before the impact and, if it was on our rail network then, a rail link to our capital."
asteroid_incoming_rescue_route_mission_hold_tt: "Relief work has run until §Y[?asteroid_incoming_rescue_mission_ready_date.GetDateStringNoHour]§!"
asteroid_incoming_rescue_route_mission_repair_tt: "[This.GetAsteroidIncomingRescueMissionState] has back at least §Y[?constant:asteroid_incoming_recovery.mission_repair_share|%0]§! of its pre-impact infrastructure, railway and supply hubs"
asteroid_incoming_rescue_route_mission_route_tt: "[This.GetAsteroidIncomingRescueMissionState] is linked by rail to our capital, if it was on our rail network before the impact"
asteroid_incoming_stabilize_damaged_zone_mission: "Stabilize the Damaged Zone"
asteroid_incoming_stabilize_damaged_zone_mission_desc: "The debris fields in [This.GetAsteroidIncomingStabilizeMissionStates] are still unsafe. From §Y[?asteroid_incoming_stabilize_mission_ready_date.GetDateStringNoHour]§!, the zone counts as stable once each named state has back at least §Y[?constant:asteroid_incoming_recovery.mission_repair_share|%0]§! of the infrastructure, railway and supply hubs it had before the impact."
asteroid_incoming_stabilize_damaged_zone_mission_hold_tt: "Stabilization work has run until §Y[?asteroid_incoming_stabilize_mission_ready_date.GetDateStringNoHour]§!"
asteroid_incoming_stabilize_damaged_zone_mission_state_one_tt: "[This.GetAsteroidIncomingStabilizeMissionStateOne] has back at least §Y[?constant:asteroid_incoming_recovery.mission_repair_share|%0]§! of its pre-impact infrastructure, railway and supply hubs"
asteroid_incoming_stabilize_damaged_zone_mission_state_two_tt: "[This.GetAsteroidIncomingStabilizeMissionStateTwoClause]"
asteroid_incoming_reconnect_national_network_mission: "Reconnect the National Network"
asteroid_incoming_reconnect_national_network_mission_desc: "Rebuilding the corridor through [This.GetAsteroidIncomingNetworkMissionState] is only the start. From §Y[?asteroid_incoming_network_mission_ready_date.GetDateStringNoHour]§!, the network counts as reconnected once every damaged state we hold that was on our rail network before the impact is linked by rail to our capital again, every damaged state we hold has back at least §Y[?constant:asteroid_incoming_recovery.mission_repair_share|%0]§! of its pre-impact infrastructure, and [This.GetAsteroidIncomingNetworkHubClause]."
asteroid_incoming_reconnect_national_network_mission_hold_tt: "Network repairs have run until §Y[?asteroid_incoming_network_mission_ready_date.GetDateStringNoHour]§!"
asteroid_incoming_reconnect_national_network_mission_links_tt: "Every damaged state we hold that was on our rail network before the impact is linked by rail to our capital"
asteroid_incoming_reconnect_national_network_mission_repair_tt: "Every damaged state we hold has back at least §Y[?constant:asteroid_incoming_recovery.mission_repair_share|%0]§! of its pre-impact infrastructure"
asteroid_incoming_reconnect_national_network_mission_hub_tt: "[This.GetAsteroidIncomingNetworkHubClause]"
asteroid_incoming_restore_outer_ring_mission: "Restore the Outer Ring"
asteroid_incoming_restore_outer_ring_mission_desc: "Factories in [This.GetAsteroidIncomingOuterMissionState] are running again, but the outer ring is not whole. From §Y[?asteroid_incoming_outer_mission_ready_date.GetDateStringNoHour]§!, it counts as restored once no state we hold still suffers outer-shock or light-fragment damage and every state of the major impact ring we hold has back at least §Y[?constant:asteroid_incoming_recovery.mission_repair_share|%0]§! of its pre-impact infrastructure, civilian factories and military factories."
asteroid_incoming_restore_outer_ring_mission_hold_tt: "Outer-ring repairs have run until §Y[?asteroid_incoming_outer_mission_ready_date.GetDateStringNoHour]§!"
asteroid_incoming_restore_outer_ring_mission_shock_tt: "No state we hold still suffers from an Outer Shock Zone or Light Fragment Damage"
asteroid_incoming_restore_outer_ring_mission_major_tt: "Every state of the major impact ring we hold has back at least §Y[?constant:asteroid_incoming_recovery.mission_repair_share|%0]§! of its pre-impact infrastructure, civilian factories and military factories"
asteroid_incoming_rebuild_regional_economy_mission: "Rebuild the Regional Economy"
asteroid_incoming_rebuild_regional_economy_mission_desc: "The region around the crater has to work again. From §Y[?asteroid_incoming_regional_economy_mission_ready_date.GetDateStringNoHour]§!, the damaged states we still hold must together have back at least §Y[?constant:asteroid_incoming_recovery.regional_capacity_share|%0]§! of the factories, infrastructure and railway that stood there before the impact. Progress is measured at each monthly recovery review.\nLast review: factories §Y[?asteroid_incoming_regional_factory_ratio|%0]§!, infrastructure §Y[?asteroid_incoming_regional_infrastructure_ratio|%0]§!, railway §Y[?asteroid_incoming_regional_railway_ratio|%0]§!."
asteroid_incoming_rebuild_regional_economy_mission_hold_tt: "Regional rebuilding has run until §Y[?asteroid_incoming_regional_economy_mission_ready_date.GetDateStringNoHour]§!"
asteroid_incoming_rebuild_regional_economy_mission_factories_tt: "Factories in our damaged states are back to at least §Y[?constant:asteroid_incoming_recovery.regional_capacity_share|%0]§! of their pre-impact total (last review: §Y[?asteroid_incoming_regional_factory_ratio|%0]§!)"
asteroid_incoming_rebuild_regional_economy_mission_infrastructure_tt: "Infrastructure in our damaged states is back to at least §Y[?constant:asteroid_incoming_recovery.regional_capacity_share|%0]§! of its pre-impact total (last review: §Y[?asteroid_incoming_regional_infrastructure_ratio|%0]§!)"
asteroid_incoming_rebuild_regional_economy_mission_railway_tt: "Railway in our damaged states is back to at least §Y[?constant:asteroid_incoming_recovery.regional_capacity_share|%0]§! of its pre-impact total (last review: §Y[?asteroid_incoming_regional_railway_ratio|%0]§!)"
asteroid_incoming_rescue_route_mission_success_tt: "The rescue route through [This.GetAsteroidIncomingRescueMissionState] is certified: more of its infrastructure, railway and supply hubs are rebuilt, its local emergency ends, and the national recovery burden gives way to a recovery legacy."
asteroid_incoming_rescue_route_mission_cancelled_tt: "If [This.GetAsteroidIncomingRescueMissionState] leaves our control, the mission ends without further effect."
asteroid_incoming_rescue_route_mission_timeout_tt: "If the route is not certified in time, [This.GetAsteroidIncomingRescueMissionState] $asteroid_incoming.mission_failure.local$. $asteroid_incoming.mission_failure.national$"
asteroid_incoming_stabilize_damaged_zone_mission_success_tt: "Stability returns to [This.GetAsteroidIncomingStabilizeMissionStates]: local emergencies there end so reconstruction can begin, and the national recovery burden gives way to a recovery legacy."
asteroid_incoming_stabilize_damaged_zone_mission_cancelled_tt: "If a named state leaves our control, the mission ends without further effect."
asteroid_incoming_stabilize_damaged_zone_mission_timeout_tt: "If the zone is not stable in time, each named state $asteroid_incoming.mission_failure.local$. $asteroid_incoming.mission_failure.national$"
asteroid_incoming_reconnect_national_network_mission_success_tt: "The national network is reconnected: [This.GetAsteroidIncomingNetworkMissionState] gains further repairs, emergency work ends in every damaged state we hold, and the national recovery burden gives way to a recovery legacy."
asteroid_incoming_reconnect_national_network_mission_cancelled_tt: "If [This.GetAsteroidIncomingNetworkMissionState] or the named industrial state leaves our control, the mission ends without further effect."
asteroid_incoming_reconnect_national_network_mission_timeout_tt: "If the network is not reconnected in time, [This.GetAsteroidIncomingNetworkMissionState] $asteroid_incoming.mission_failure.local$. $asteroid_incoming.mission_failure.national$"
asteroid_incoming_restore_outer_ring_mission_success_tt: "Industry and dockyards in [This.GetAsteroidIncomingOuterMissionState] are restored further, its local emergency ends, and the national recovery burden gives way to a recovery legacy."
asteroid_incoming_restore_outer_ring_mission_cancelled_tt: "If [This.GetAsteroidIncomingOuterMissionState] leaves our control, the mission ends without further effect."
asteroid_incoming_restore_outer_ring_mission_timeout_tt: "If the outer ring is not restored in time, [This.GetAsteroidIncomingOuterMissionState] $asteroid_incoming.mission_failure.local$. $asteroid_incoming.mission_failure.national$"
asteroid_incoming_rebuild_regional_economy_mission_success_tt: "The regional economy is restored beyond the crater: [This.GetAsteroidIncomingEconomyMissionState] gains further industrial repairs, its local emergency ends, and a lasting recovery legacy replaces the national burden."
asteroid_incoming_rebuild_regional_economy_mission_cancelled_tt: "If [This.GetAsteroidIncomingEconomyMissionState] leaves our control, the mission ends without further effect."
asteroid_incoming_rebuild_regional_economy_mission_timeout_tt: "If the regional economy is not rebuilt in time, [This.GetAsteroidIncomingEconomyMissionState] $asteroid_incoming.mission_failure.local$. $asteroid_incoming.mission_failure.national$"
asteroid_incoming.mission_failure.local: "loses up to §Y[?constant:asteroid_incoming_recovery_fraction.rescue_death_fraction|%0]§! of its people to failed relief (§Y[?constant:asteroid_incoming_recovery_fraction.rescue_death_fraction_heavy|%0]§! in the catastrophic ring or at a fragment centre, at most §Y[?constant:asteroid_incoming_recovery_fraction.rescue_death_cap_people|0]§! people), its ended impact damage returns for §Y[?constant:asteroid_incoming_recovery.mission_failure_recovery_days|0]§! days and reopens its local emergency, and it suffers renewed recovery pressure for §Y[?constant:asteroid_incoming_recovery.mission_failure_pressure_days|0]§! days"
asteroid_incoming.mission_failure.national: "The full national recovery burden returns for §Y[?constant:asteroid_incoming_recovery.mission_failure_pressure_days|0]§! days, setting aside any recovery legacy until then, and our repair prices rise by §Y[?constant:asteroid_incoming_cost.failure_surcharge|%0]§! for §Y[?constant:asteroid_incoming_cost.failure_surcharge_days|0]§! days."

asteroid_incoming_command_continuity: "Command Continuity"
asteroid_incoming_command_continuity_desc: "Prepared command structures preserve political control during the impact response."
asteroid_incoming_transport_dispersion: "Transport Dispersion"
asteroid_incoming_transport_dispersion_desc: "Dispersed transport reserves keep the national network moving under pressure."
asteroid_incoming_medical_mobilization: "Medical Mobilization"
asteroid_incoming_medical_mobilization_desc: "Medical teams and emergency services are ready for mass casualties."
asteroid_incoming_government_dislocation: "Government Dislocation"
asteroid_incoming_government_dislocation_desc: "The impact has scattered archives, communications, and public administration while a replacement command network is assembled."
asteroid_incoming_government_dislocation_prepared: "Prepared Government Continuity"
asteroid_incoming_government_dislocation_prepared_desc: "Dispersed archives and command staff have shortened the administrative crisis and limited its severity."
asteroid_incoming_residual_haze: "Residual Haze"
asteroid_incoming_residual_haze_desc: "A light atmospheric dust load still reduces production, supply efficiency, and air operations."
asteroid_incoming_global_dust_veil: "Global Dust Veil"
asteroid_incoming_global_dust_veil_desc: "A global veil of dust reduces production, strains supply, and worsens weather over every country."
asteroid_incoming_impact_winter: "Impact Winter"
asteroid_incoming_impact_winter_desc: "Impact dust has darkened the sky, cutting production, supply efficiency, and air operations."
asteroid_incoming_severe_impact_winter: "Severe Impact Winter"
asteroid_incoming_severe_impact_winter_desc: "A severe dust load has darkened the world and placed production, supply, and weather under extreme pressure."
