chaosx_super_event.116.t: "The Stone's Verdict"
chaosx_super_event.116.q: "Nature to be commanded must be obeyed\nFrancis Bacon"
chaosx_super_event.116.a: "The Moving Finger writes"
chaosx_super_event.116.d: "The asteroid struck [asteroid_incoming_super_event_main_state.GetName] in [asteroid_incoming_super_event_target_country.GetName], on [asteroid_incoming_super_event_main_state.GetContinent]. Its centre is gone, three surrounding rings are damaged, and the first rescue efforts begin under [This.GetAsteroidIncomingOpeningDustStage]. [This.GetAsteroidIncomingSuperEventFragmentClause]"
