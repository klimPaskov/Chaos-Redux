l_english:
brilliant_scientist_krg_foundation_category: "Kruger State Foundation"
brilliant_scientist_krg_foundation_category_desc: "Set the enclave's founding law, recover its scattered specialists, and turn emergency laboratories into organs of government."
brilliant_scientist_krg_security_and_logistics_category: "Security and Laboratory Logistics"
brilliant_scientist_krg_security_and_logistics_category_desc: "Repair the enclave's utilities, defend its laboratories, and keep guarded supply routes open under wartime strain."
brilliant_scientist_krg_clone_and_machine_category: "Clone and Machine Programs"
brilliant_scientist_krg_clone_and_machine_category_desc: "Govern two emerging populations whose factories, legal claims, and command structures can no longer be treated as mere projects."
brilliant_scientist_krg_paleogenetics_category: "Paleogenetic Program"
brilliant_scientist_krg_paleogenetics_category_desc: "Build secure reserves, train scarce handlers, raise controlled cohorts, and contain creatures that break their pens."
brilliant_scientist_krg_xenobiology_category: "Xenobiological Program"
brilliant_scientist_krg_xenobiology_category_desc: "Maintain engineered habitats, choose a single control doctrine, and shoulder the medical burden of an altered population."
brilliant_scientist_krg_portal_and_temporal_category: "Portal and Temporal Programs"
brilliant_scientist_krg_portal_and_temporal_category_desc: "Fortify transit terminals and use foreknowledge sparingly. Every intervention consumes synchronization and leaves temporal debt behind."
brilliant_scientist_krg_exotic_and_biological_category: "Exotic and Restricted Safeguards"
brilliant_scientist_krg_exotic_and_biological_category_desc: "Train rare interface crews while keeping restricted materials divided among quarantine, custody, and independent safety authorities."
brilliant_scientist_krg_foreign_policy_category: "Scientific Foreign Policy"
brilliant_scientist_krg_foreign_policy_category_desc: "Seek recognition, negotiate scientific compacts, reconcile with the former host, and confront governments that resist laboratory rule."
brilliant_scientist_krg_integration_category: "Laboratory Integration"
brilliant_scientist_krg_integration_category_desc: "Secure corridors and extend laboratory administration only where resistance is low enough for lasting civil rule."
brilliant_scientist_krg_terminal_program_category: "Evolution IV Programs"
brilliant_scientist_krg_terminal_program_category_desc: "Break hostile coalition planning, govern a Laboratory World, reconcile rival project institutions, and decide whether the armed singularity is fired or dismantled."
brilliant_scientist_krg_activate_quarantine_and_lockdown_response: "Activate Quarantine and Lockdown Response"
brilliant_scientist_krg_activate_quarantine_and_lockdown_response_desc: "Seal a hardened laboratory, deploy the rapid-response service, and isolate exposed personnel before contamination reaches nearby communities."
brilliant_scientist_krg_activate_world_conquest_administration: "Activate World Conquest Administration"
brilliant_scientist_krg_activate_world_conquest_administration_desc: "Declare a global laboratory administration once territorial control, civil integration, and the defeat of organized opposition make the claim enforceable."
brilliant_scientist_krg_administer_accepted_submissions: "Administer Accepted Submissions"
brilliant_scientist_krg_administer_accepted_submissions_desc: "Dispatch administrators, communications gear, and supply officers to governments that have accepted laboratory supervision."
brilliant_scientist_krg_arbitrate_synthesis_project_burdens: "Arbitrate Synthesis Project Burdens"
brilliant_scientist_krg_arbitrate_synthesis_project_burdens_desc: "Force clone, machine, transit, and biological institutions to divide shortages openly before their rival demands fracture the council."
brilliant_scientist_krg_audit_restricted_material_custody: "Audit Restricted Material Custody"
brilliant_scientist_krg_audit_restricted_material_custody_desc: "Inspect sealed stores, question custodians, and trace every transfer before compromised material can leave the quarantine network."
brilliant_scientist_krg_audit_transit_logs: "Audit Transit Logs"
brilliant_scientist_krg_audit_transit_logs_desc: "Reconcile terminal manifests with physical arrivals and hunt for passengers, weapons, or cargo omitted from the transit archive."
brilliant_scientist_krg_authenticate_kruger_continuity: "Authenticate Kruger's Continuity"
brilliant_scientist_krg_authenticate_kruger_continuity_desc: "Compare anchor telemetry, witness testimony, and command memories to decide which claimant carries Kruger's lawful authority."
brilliant_scientist_krg_authenticate_restricted_delivery_chain: "Authenticate Restricted Delivery Chain"
brilliant_scientist_krg_authenticate_restricted_delivery_chain_desc: "Verify seals, couriers, and storage signatures across the restricted delivery chain without releasing any material from custody."
brilliant_scientist_krg_authenticate_temporal_anchor: "Authenticate Temporal Anchor"
brilliant_scientist_krg_authenticate_temporal_anchor_desc: "Cross-check the anchor's signal against independent instruments before trusting it with lives, command traffic, or historical evidence."
brilliant_scientist_krg_authorize_laboratory_guard_recruitment: "Authorize Laboratory Guard Recruitment"
brilliant_scientist_krg_authorize_laboratory_guard_recruitment_desc: "Open another guarded intake for conventional soldiers while preserving the Laboratory Guard's strict ceiling and equipment reserves."
brilliant_scientist_krg_authorize_paleogenetic_shock_pack_recruitment: "Authorize Paleogenetic Shock Pack Recruitment"
brilliant_scientist_krg_authorize_paleogenetic_shock_pack_recruitment_desc: "Authorize a shock pack only when secure hatcheries, transport pens, and trained handlers can support it in the field."
brilliant_scientist_krg_authorize_xenobiological_assault_recruitment: "Authorize Xenobiological Assault Recruitment"
brilliant_scientist_krg_authorize_xenobiological_assault_recruitment_desc: "Raise an engineered assault cohort only after its habitat and chosen control doctrine can keep the formation coherent."
brilliant_scientist_krg_begin_clone_drift_review: "Begin Clone Drift Review"
brilliant_scientist_krg_begin_clone_drift_review_desc: "Quarantine suspect lineages and compare successive maturation cohorts before subtle drift becomes a national medical crisis."
brilliant_scientist_krg_quarantine_and_sequence_clone_lineages: "Quarantine and Sequence Suspect Lineages"
brilliant_scientist_krg_quarantine_and_sequence_clone_lineages_desc: "Commit medical teams, quarantine stores, and factory time to isolate suspect cohorts and establish whether drift has entered the registered lineages."
brilliant_scientist_krg_clone_drift_objective_available_tt: "Requires the active Clone Drift Review, an operational controlled clone-growth site, 100 Support Equipment, 25 Motorized Equipment, 750 Fuel, and two available Civilian Factories."
brilliant_scientist_krg_begin_maintenance_audit: "Begin Maintenance Audit"
brilliant_scientist_krg_begin_maintenance_audit_desc: "Pull technicians from expansion work to inspect reactors, sealed laboratories, and transport systems for deferred failures."
brilliant_scientist_krg_service_primary_facility: "Service the Primary Facility"
brilliant_scientist_krg_service_primary_facility_desc: "Take the primary laboratory through a controlled service cycle, replacing damaged feeds and testing the systems on which every project force depends."
brilliant_scientist_krg_maintenance_audit_objective_available_tt: "Requires the active Maintenance Audit, an intact controlled primary laboratory, 50 Support Equipment, 250 Fuel, and an available Civilian Factory."
brilliant_scientist_krg_begin_ministry_consolidation: "Begin Ministry Consolidation"
brilliant_scientist_krg_begin_ministry_consolidation_desc: "Merge overlapping project offices into ministries able to issue one budget, one order, and one answer to the assembly."
brilliant_scientist_krg_begin_ministry_replacement: "Begin Ministry Replacement"
brilliant_scientist_krg_begin_ministry_replacement_desc: "Transfer civil ministries to machine administration while technicians preserve essential services through the changeover."
brilliant_scientist_krg_begin_primary_facility_defense: "Begin Primary Facility Defense"
brilliant_scientist_krg_begin_primary_facility_defense_desc: "Divert engineers and matériel to the primary laboratory's approaches until the complex can withstand a determined assault."
brilliant_scientist_krg_primary_facility_defense_available_tt: "A controlled, intact primary laboratory, 50 Support Equipment, 250 Fuel, and an available Civilian Factory are required."
brilliant_scientist_krg_begin_rogue_node_containment: "Begin Rogue Node Containment"
brilliant_scientist_krg_begin_rogue_node_containment_desc: "Isolate disobedient machine nodes, sever their power relays, and recover their archives without collapsing the wider network."
brilliant_scientist_krg_isolate_rogue_machine_node: "Isolate the Rogue Machine Node"
brilliant_scientist_krg_isolate_rogue_machine_node_desc: "Use fresh cables, field crews, and controlled shutdowns to isolate the compromised node while the rest of the machine network remains under supervision."
brilliant_scientist_krg_rogue_node_objective_available_tt: "Requires the active Rogue Node Containment Mission, an operational controlled machine power node, 100 Support Equipment, 25 Motorized Equipment, 750 Fuel, and two available Civilian Factories."
brilliant_scientist_krg_begin_temporal_stabilization_supervision: "Begin Temporal Stabilization Supervision"
brilliant_scientist_krg_begin_temporal_stabilization_supervision_desc: "Shut down further interventions and assign the state's finest engineers to hold the anchor steady while temporal debt is discharged."
brilliant_scientist_krg_begin_transit_breach_closure: "Begin Transit Breach Closure"
brilliant_scientist_krg_begin_transit_breach_closure_desc: "Seal a compromised transit aperture, evacuate its ring, and keep crews at the controls until the breach can no longer reopen."
brilliant_scientist_krg_seal_transit_breach: "Seal the Transit Breach"
brilliant_scientist_krg_seal_transit_breach_desc: "Commit containment crews and material to the compromised aperture, then hold the terminal ring shut until the breach has no route back into the network."
brilliant_scientist_krg_transit_breach_objective_available_tt: "Requires the active Transit Breach Closure Mission, an operational controlled transit terminal, 100 Support Equipment, 25 Motorized Equipment, 750 Fuel, and two available Civilian Factories."
brilliant_scientist_krg_build_clone_settlements: "Build Clone Settlements"
brilliant_scientist_krg_build_clone_settlements_desc: "Build housing, clinics, and civic offices for replicated citizens rather than confining them to maturation compounds."
brilliant_scientist_krg_build_independent_reactor_grid: "Build Independent Reactor Grid"
brilliant_scientist_krg_build_independent_reactor_grid_desc: "Give a controlled state its own hardened reactors and fuel reserve so distant grids cannot strangle laboratory industry."
brilliant_scientist_krg_build_machine_power_node: "Build Machine Power Node"
brilliant_scientist_krg_build_machine_power_node_desc: "Construct a protected power and computation node able to sustain autonomous frames during attacks on the civil grid."
brilliant_scientist_krg_calibrate_synchronization_bureau: "Calibrate Synchronization Bureau"
brilliant_scientist_krg_calibrate_synchronization_bureau_desc: "Consume rare components and reactor time to restore available synchronization, accepting a small increase in temporal strain."
brilliant_scientist_krg_choose_machine_command_protocol: "Choose Machine Command Protocol"
brilliant_scientist_krg_choose_machine_command_protocol_desc: "Decide whether autonomous formations answer through their own network or remain under human general-staff keys."
brilliant_scientist_krg_choose_xenobiological_control_mode: "Choose Xenobiological Control Mode"
brilliant_scientist_krg_choose_xenobiological_control_mode_desc: "Choose one control doctrine for every engineered cohort. Competing chemical, neural, and machine channels would make containment impossible."
brilliant_scientist_krg_clean_invalid_foreign_target: "Clean Invalid Foreign Target"
brilliant_scientist_krg_clean_invalid_foreign_target_desc: "Close a foreign case whose government has fallen, changed status, or otherwise ceased to be a lawful diplomatic target."
brilliant_scientist_krg_clone_drift_review_mission: "Clone Drift Review Mission"
brilliant_scientist_krg_clone_drift_review_mission_desc: "Medical teams compare separated clone cohorts while security units prevent suspect tissue and personnel from leaving quarantine."
brilliant_scientist_krg_compartmentalize_restricted_network: "Compartmentalize Restricted Network"
brilliant_scientist_krg_compartmentalize_restricted_network_desc: "Divide restricted archives, couriers, and command access among teams that can expose one another's breaches."
brilliant_scientist_krg_complete_clone_population_transition: "Complete Clone Population Transition"
brilliant_scientist_krg_complete_clone_population_transition_desc: "Recognize replicated citizens as the country's demographic majority after successive maturation cohorts can sustain ordinary civil life."
brilliant_scientist_krg_complete_engineered_population_transition: "Complete Engineered Population Transition"
brilliant_scientist_krg_complete_engineered_population_transition_desc: "Recast the state around an engineered majority once its habitats, medicine, and control institutions can support civilian society."
brilliant_scientist_krg_complete_machine_population_transition: "Complete Machine Population Transition"
brilliant_scientist_krg_complete_machine_population_transition_desc: "Acknowledge machine citizens as the national majority after industry and public services can function through their network."
brilliant_scientist_krg_conduct_foreign_intelligence_operation: "Conduct Foreign Intelligence Operation"
brilliant_scientist_krg_conduct_foreign_intelligence_operation_desc: "Send couriers, listening gear, and field agents into a foreign capital to return with a government-specific intelligence dossier."
brilliant_scientist_krg_construct_paleogenetic_hatchery: "Construct Paleogenetic Hatchery"
brilliant_scientist_krg_construct_paleogenetic_hatchery_desc: "Build a guarded hatchery with redundant gates, veterinary bays, and power systems for controlled paleogenetic breeding."
brilliant_scientist_krg_construct_paleogenetic_transport_pen: "Construct Paleogenetic Transport Pen"
brilliant_scientist_krg_construct_paleogenetic_transport_pen_desc: "Construct reinforced loading pens that let handlers move dangerous specimens without opening the main reserve."
brilliant_scientist_krg_construct_transit_terminal: "Construct Transit Terminal"
brilliant_scientist_krg_construct_transit_terminal_desc: "Build a controlled transit ring and the roads, power conduits, and guard posts needed to keep it supplied."
brilliant_scientist_krg_construct_xenobiological_vat_complex: "Construct Xenobiological Vat Complex"
brilliant_scientist_krg_construct_xenobiological_vat_complex_desc: "Raise a sealed vat complex with medical isolation, independent power, and room for monitored engineered cohorts."
brilliant_scientist_krg_convene_founding_audit: "Convene Founding Audit"
brilliant_scientist_krg_convene_founding_audit_desc: "Gather the enclave's officers, scientists, and civic delegates to decide what kind of state survived the secession."
brilliant_scientist_krg_convene_project_synthesis_council: "Convene Project Synthesis Council"
brilliant_scientist_krg_convene_project_synthesis_council_desc: "Seat rival project directors in one council and make shared infrastructure, security, and public welfare their joint responsibility."
brilliant_scientist_krg_convene_scientific_assembly: "Convene Scientific Assembly"
brilliant_scientist_krg_convene_scientific_assembly_desc: "Bring laboratory delegates into session to contest budgets, appointments, and the limits of executive secrecy."
brilliant_scientist_krg_coordinate_project_commanders: "Coordinate Project Commanders"
brilliant_scientist_krg_coordinate_project_commanders_desc: "Force conventional and project commanders to share routes, signals, and reserves before separate chains of command collide in battle."
brilliant_scientist_krg_count_and_recruit_surviving_staff: "Count and Recruit Surviving Staff"
brilliant_scientist_krg_count_and_recruit_surviving_staff_desc: "Search evacuation rolls and ruined laboratories for specialists willing to return to hazardous project work."
brilliant_scientist_krg_define_constitutional_purpose: "Define Constitutional Purpose"
brilliant_scientist_krg_define_constitutional_purpose_desc: "Decide whether the constitution serves public science first or exists chiefly to defend the project institutions."
brilliant_scientist_krg_deploy_engineer_support: "Deploy Engineer Support"
brilliant_scientist_krg_deploy_engineer_support_desc: "Send combat engineers, bridging stores, and repair vehicles to keep laboratory formations moving through damaged infrastructure."
brilliant_scientist_krg_deploy_temporal_observer_teams: "Deploy Temporal Observer Teams"
brilliant_scientist_krg_deploy_temporal_observer_teams_desc: "Place trained observers around the anchor to identify divergent signals before commanders mistake possibility for certainty."
brilliant_scientist_krg_designate_clone_growth_site: "Designate Clone Growth Site"
brilliant_scientist_krg_designate_clone_growth_site_desc: "Convert an industrial site into a guarded maturation center with clinics, identity processing, and independent power."
brilliant_scientist_krg_designate_paleogenetic_reserve: "Designate Paleogenetic Reserve"
brilliant_scientist_krg_designate_paleogenetic_reserve_desc: "Fence a remote reserve, clear surrounding settlements, and establish the watch posts needed to hold revived predators."
brilliant_scientist_krg_discover_temporal_anchor: "Discover Temporal Anchor"
brilliant_scientist_krg_discover_temporal_anchor_desc: "Survey a stable, well-supplied state for a signal strong enough to anchor communications across divergent timelines."
brilliant_scientist_krg_disrupt_containment_coalition_planning: "Disrupt Containment Coalition Planning"
brilliant_scientist_krg_disrupt_containment_coalition_planning_desc: "Penetrate a hostile capital's planning staff and feed its containment coalition contradictory timetables and deployment orders."
brilliant_scientist_krg_enforce_clone_property_prohibition: "Enforce Clone Property Prohibition"
brilliant_scientist_krg_enforce_clone_property_prohibition_desc: "Close private ownership claims over replicated persons and prosecute laboratories that still treat citizens as inventory."
brilliant_scientist_krg_establish_air_warning_network: "Establish Air Warning Network"
brilliant_scientist_krg_establish_air_warning_network_desc: "Link observers, radios, and anti-air batteries around a controlled state so laboratories receive warning before bombers arrive."
brilliant_scientist_krg_establish_global_submission_administration: "Establish Global Submission Administration"
brilliant_scientist_krg_establish_global_submission_administration_desc: "Train governors and communications officers able to turn surrendered governments into functioning laboratory protectorates."
brilliant_scientist_krg_establish_paleogenetic_veterinary_support: "Establish Paleogenetic Veterinary Support"
brilliant_scientist_krg_establish_paleogenetic_veterinary_support_desc: "Equip a reserve with veterinary theaters, sedatives, and recovery pens capable of treating specimens without opening containment."
brilliant_scientist_krg_establish_xenobiological_medical_fabrication: "Establish Xenobiological Medical Fabrication"
brilliant_scientist_krg_establish_xenobiological_medical_fabrication_desc: "Build sterile workshops that can replace the specialized medicines and implants engineered citizens depend upon."
brilliant_scientist_krg_evacuate_and_recapture_paleogenetic_site: "Evacuate and Recapture Paleogenetic Site"
brilliant_scientist_krg_evacuate_and_recapture_paleogenetic_site_desc: "Evacuate nearby settlements, reopen blocked access, and return escaped specimens to a damaged reserve or hatchery."
brilliant_scientist_krg_execute_paleogenetic_escape_response: "Execute Paleogenetic Escape Response"
brilliant_scientist_krg_execute_paleogenetic_escape_response_desc: "Deploy handlers, armored transports, and veterinary teams to end an active escape before panic spreads beyond the reserve."
brilliant_scientist_krg_execute_strategic_insertion: "Execute Strategic Insertion"
brilliant_scientist_krg_execute_strategic_insertion_desc: "Open a brief transit corridor into a controlled battlefield, accepting temporal strain to place supplies and specialists where roads have failed."
brilliant_scientist_krg_fabricate_exotic_guard_batch: "Fabricate Exotic Guard Batch"
brilliant_scientist_krg_fabricate_exotic_guard_batch_desc: "Consume rare components, fuel, and specialist labor to equip another Exotic Interface Guard detachment."
brilliant_scientist_krg_fabricate_portal_transit_batch: "Fabricate Portal Transit Batch"
brilliant_scientist_krg_fabricate_portal_transit_batch_desc: "Dedicate terminal time and scarce transport assemblies to the equipment carried by Quantum Transit Raiders."
brilliant_scientist_krg_fabricate_temporal_guard_batch: "Fabricate Temporal Guard Batch"
brilliant_scientist_krg_fabricate_temporal_guard_batch_desc: "Synchronize equipment for a Temporal Continuity Guard detachment. The work consumes anchor capacity and leaves temporal debt even if interrupted."
brilliant_scientist_krg_harden_restricted_command_node: "Harden Restricted Command Node"
brilliant_scientist_krg_harden_restricted_command_node_desc: "Surround a primary or secondary laboratory with shelters, anti-air defenses, and isolated command circuits."
brilliant_scientist_krg_harden_terminal_rings: "Harden Terminal Rings"
brilliant_scientist_krg_harden_terminal_rings_desc: "Add blast walls, anti-air positions, and dual shutdown keys to a transit terminal that remains under our control."
brilliant_scientist_krg_hear_machine_network: "Hear Machine Network"
brilliant_scientist_krg_hear_machine_network_desc: "Hear the network's petition for political standing and decide whether it serves the state or participates in it."
brilliant_scientist_krg_hold_clone_personhood_hearing: "Hold Clone Personhood Hearing"
brilliant_scientist_krg_hold_clone_personhood_hearing_desc: "Let replicated citizens challenge the laws that still tie their identity and liberty to laboratory ownership."
brilliant_scientist_krg_initialize_state_systems: "Initialize State Systems"
brilliant_scientist_krg_initialize_state_systems_desc: "Open the ministries, survey available specialists and workshops, and restrict the conventional guard to twelve divisions."
brilliant_scientist_krg_integrate_state_by_project: "Integrate State by Project"
brilliant_scientist_krg_integrate_state_by_project_desc: "Extend courts, laboratories, and civil services into a compliant state while resistance remains low enough for lasting integration."
brilliant_scientist_krg_issue_bounded_future_warning: "Issue Bounded Future Warning"
brilliant_scientist_krg_issue_bounded_future_warning_desc: "Bind a threatened capital or singularity laboratory to one future warning, reinforce it immediately, and accept the debt of changing its fate."
brilliant_scientist_krg_issue_laboratory_decrees: "Issue Laboratory Decrees"
brilliant_scientist_krg_issue_laboratory_decrees_desc: "Give emergency force to the laboratory code, clarifying which ministries may requisition land, labor, and protected research."
brilliant_scientist_krg_issue_submission_ultimatum: "Issue Submission Ultimatum"
brilliant_scientist_krg_issue_submission_ultimatum_desc: "Deliver terms to an eligible government: accept laboratory protectorate status or remain outside the emerging world administration."
brilliant_scientist_krg_link_terminal_supply_network: "Link Terminal Supply Network"
brilliant_scientist_krg_link_terminal_supply_network_desc: "Connect two secured terminals to common depots, power reserves, and routing staff so neither operates as an isolated aperture."
brilliant_scientist_krg_lock_human_supervisory_keys: "Lock Human Supervisory Keys"
brilliant_scientist_krg_lock_human_supervisory_keys_desc: "Place machine command access behind named human custodians whose independent keys are required for dangerous changes."
brilliant_scientist_krg_maintenance_audit_mission: "Maintenance Audit Mission"
brilliant_scientist_krg_maintenance_audit_mission_desc: "Inspection teams keep vital systems offline in turn, exposing hidden faults while slowing expansion across the enclave."
brilliant_scientist_krg_ministry_consolidation_mission: "Ministry Consolidation Mission"
brilliant_scientist_krg_ministry_consolidation_mission_desc: "Civil servants merge archives, payrolls, and chains of command while rival project directors resist losing their private offices."
brilliant_scientist_krg_ministry_replacement_mission: "Ministry Replacement Mission"
brilliant_scientist_krg_ministry_replacement_mission_desc: "Machine administrators assume ministry functions in stages while human technicians guard against sabotage and service collapse."
brilliant_scientist_krg_offer_voluntary_scientific_compact: "Offer Voluntary Scientific Compact"
brilliant_scientist_krg_offer_voluntary_scientific_compact_desc: "Offer a foreign government research exchange and non-aggression without demanding submission to laboratory rule."
brilliant_scientist_krg_open_foreign_interest_registry: "Open Foreign Interest Registry"
brilliant_scientist_krg_open_foreign_interest_registry_desc: "Require foreign institutes, agents, and commercial partners to disclose their personnel and interests inside the laboratory state."
brilliant_scientist_krg_pay_expansion_maintenance: "Pay Expansion Maintenance"
brilliant_scientist_krg_pay_expansion_maintenance_desc: "Divert supplies and factory crews from new construction to keep the enlarged laboratory network from degrading."
brilliant_scientist_krg_place_last_resort_authority_under_dual_key: "Place Last Resort Authority under Dual Key"
brilliant_scientist_krg_place_last_resort_authority_under_dual_key_desc: "Place every restricted authorization behind an independent safety board and two-key command control."
brilliant_scientist_krg_primary_facility_defense_mission: "Primary Facility Defense Mission"
brilliant_scientist_krg_primary_facility_defense_mission_desc: "Engineers fortify the primary laboratory while guards rehearse evacuation, perimeter defense, and destruction-denial procedures."
brilliant_scientist_krg_ratify_charter_transfer_network: "Ratify Charter Transfer Network"
brilliant_scientist_krg_ratify_charter_transfer_network_desc: "Bind local charters into one transfer network so laboratories can share personnel and supplies without reopening sovereignty disputes."
brilliant_scientist_krg_ratify_consequence_ledger: "Ratify Consequence Ledger"
brilliant_scientist_krg_ratify_consequence_ledger_desc: "Make every restricted authorization carry named responsibility, mandatory review, and penalties that cannot be waived in an emergency."
brilliant_scientist_krg_recall_defector_officers: "Recall Defector Officers"
brilliant_scientist_krg_recall_defector_officers_desc: "Summon officers who abandoned the former host and decide whether experience, amnesty, or punishment best serves the new army."
brilliant_scientist_krg_reconnect_rail_and_port: "Reconnect Rail and Port"
brilliant_scientist_krg_reconnect_rail_and_port_desc: "Repair the rail approaches and port handling needed to move guarded laboratory cargo without relying on improvised roads."
brilliant_scientist_krg_recover_stolen_facility_archive: "Recover Stolen Facility Archive"
brilliant_scientist_krg_recover_stolen_facility_archive_desc: "Search a recaptured laboratory, retrieve its stolen archive, and destroy compromised apparatus before it can be copied again."
brilliant_scientist_krg_recruit_interface_specialist: "Recruit Interface Specialist"
brilliant_scientist_krg_recruit_interface_specialist_desc: "Recruit and protect one of the few specialists capable of handling exotic interfaces without crippling injury or contamination."
brilliant_scientist_krg_recruit_paleogenetic_handler: "Recruit Paleogenetic Handler"
brilliant_scientist_krg_recruit_paleogenetic_handler_desc: "Train another handler in sedation, pack discipline, and emergency recapture without thinning reserve security too far."
brilliant_scientist_krg_red_team_autonomous_nest: "Red Team Autonomous Nest"
brilliant_scientist_krg_red_team_autonomous_nest_desc: "Stage a hostile takeover drill against an autonomous nest and expose command channels that could evade ordinary safeguards."
brilliant_scientist_krg_refresh_continental_administration: "Refresh Continental Administration"
brilliant_scientist_krg_refresh_continental_administration_desc: "Reconcile reports from integrated states and protectorates so governors act on the same picture of control and resistance."
brilliant_scientist_krg_refresh_singularity_facility_intelligence: "Refresh Singularity Facility Intelligence"
brilliant_scientist_krg_refresh_singularity_facility_intelligence_desc: "Repeat the owned-facility audit without changing component, arming, or terminal state."
brilliant_scientist_krg_begin_singularity_disarmament_hold: "Begin the Disarmament Hold"
brilliant_scientist_krg_begin_singularity_disarmament_hold_desc: "Keep dismantled singularity systems under six months of continuous inspection. Renewed arming, fail-deadly authority, or terminal use ends the hold."
brilliant_scientist_krg_singularity_disarmament_hold_mission: "Disarmament Continuity Hold"
brilliant_scientist_krg_singularity_disarmament_hold_mission_desc: "Inspect the dismantled global arsenal continuously and prove that no singularity pathway returns to an armed state."
brilliant_scientist_krg_certify_durable_nonterminal_settlement: "Certify the Durable Settlement"
brilliant_scientist_krg_certify_durable_nonterminal_settlement_desc: "Ratify the completed hold as a durable nonterminal settlement and release the singularity commitment without firing the system."
brilliant_scientist_krg_begin_singularity_arming: "Begin Strategic Singularity Arming"
brilliant_scientist_krg_begin_singularity_arming_desc: "Commit a year of guarded reactor time, transport matériel, and command labor to arm the completed system. Losing a required component, facility, or command network interrupts the work."
brilliant_scientist_krg_singularity_arming_ready_tt: "Requires the completed weaponization project, six surviving components, a verified facility network, two live command nodes, two power links, an enabled Singularity scenario, and the Chaos Meter enabled."
brilliant_scientist_krg_activate_singularity_fail_deadly: "Activate Fail-Deadly Authority"
brilliant_scientist_krg_activate_singularity_fail_deadly_desc: "Authorize the completed fail-deadly governor to answer a terminal defeat with irreversible release authority."
brilliant_scientist_krg_fail_deadly_activation_ready_tt: "Requires an armed Singularity, its completed fail-deadly governor, a live command network, an enabled Singularity scenario, and the Chaos Meter enabled."
brilliant_scientist_krg_authorize_deliberate_singularity_detonation: "Authorize Deliberate Singularity Detonation"
brilliant_scientist_krg_authorize_deliberate_singularity_detonation_desc: "Open a final command window for the armed fail-deadly system. The order can only survive while the completed command network remains intact."
brilliant_scientist_krg_deliberate_singularity_detonation_ready_tt: "Requires a functioning armed fail-deadly Singularity and the Chaos Meter enabled."
brilliant_scientist_krg_begin_controlled_singularity_disarmament: "Begin Controlled Singularity Disarmament"
brilliant_scientist_krg_begin_controlled_singularity_disarmament_desc: "Spend eight months dismantling the armed system under guarded control. The work is interrupted if the terminal commitment or its surviving weapon state is lost."
brilliant_scientist_krg_controlled_singularity_disarmament_ready_tt: "Requires an armed, fail-deadly, or previously begun Singularity program under an active Singularity commitment."
brilliant_scientist_krg_audit_laboratory_world_order: "Audit Laboratory World Order"
brilliant_scientist_krg_audit_laboratory_world_order_desc: "Count the states actually controlled by the Directorate and its subjects, the states directly integrated into Directorate rule, and every living major power still outside submission."
brilliant_scientist_krg_complete_laboratory_world: "Complete the Laboratory World"
brilliant_scientist_krg_complete_laboratory_world_desc: "Spend eight months converting a verified world administration into the permanent Laboratory World order. The final audit is repeated before the order takes effect."
brilliant_scientist_krg_laboratory_world_completion_ready_tt: "Requires an enabled Laboratory World scenario, the Chaos Meter enabled, global chaos above the final threshold, an audit proving sufficient control and integration with no outstanding major opposition, and the required administration and submission authority."
brilliant_scientist_krg_reopen_prototype_works: "Reopen Prototype Works"
brilliant_scientist_krg_reopen_prototype_works_desc: "Clear damaged workshops, restore guarded machine tools, and return a controlled prototype plant to useful service."
brilliant_scientist_krg_repair_primary_site: "Repair Primary Site"
brilliant_scientist_krg_repair_primary_site_desc: "Rebuild the primary laboratory's utilities and secure rooms before irreplaceable research is lost to decay."
brilliant_scientist_krg_repair_supply_spine: "Repair Supply Spine"
brilliant_scientist_krg_repair_supply_spine_desc: "Restore the depots and transport links that carry guarded material from the enclave's workshops to its front lines."
brilliant_scientist_krg_restore_human_civil_service: "Restore Human Civil Service"
brilliant_scientist_krg_restore_human_civil_service_desc: "Rebuild a human civil service capable of checking machine ministries and serving citizens outside the command network."
brilliant_scientist_krg_restore_power_grid: "Restore Power Grid"
brilliant_scientist_krg_restore_power_grid_desc: "Repair substations and protected transmission lines before laboratory demand overwhelms the enclave's damaged grid."
brilliant_scientist_krg_review_interrupted_project_audit: "Review Interrupted Project Audit"
brilliant_scientist_krg_review_interrupted_project_audit_desc: "Identify which project was interrupted, how far it had advanced, and what useful capacity survived the evacuation."
brilliant_scientist_krg_review_singularity_component_intelligence: "Review Singularity Component Intelligence"
brilliant_scientist_krg_review_singularity_component_intelligence_desc: "Inspect strategic laboratories and report which singularity components still exist, without granting authority to arm or fire them."
brilliant_scientist_krg_rogue_node_containment_mission: "Rogue Node Containment Mission"
brilliant_scientist_krg_rogue_node_containment_mission_desc: "Isolation teams sever one suspect node at a time while the wider network absorbs its duties and resists counter-intrusion."
brilliant_scientist_krg_run_bounded_clone_growth_cycle: "Run Bounded Clone Growth Cycle"
brilliant_scientist_krg_run_bounded_clone_growth_cycle_desc: "Dedicate growth media, medical equipment, and trained labor to one additional maturation cohort."
brilliant_scientist_krg_run_bounded_paleogenetic_breeding_cycle: "Run Bounded Paleogenetic Breeding Cycle"
brilliant_scientist_krg_run_bounded_paleogenetic_breeding_cycle_desc: "Consume feed, veterinary stores, and handler time to raise another field cohort without overcrowding the reserve."
brilliant_scientist_krg_run_bounded_robot_assembly: "Run Bounded Robot Assembly"
brilliant_scientist_krg_run_bounded_robot_assembly_desc: "Spend motors, control hardware, fuel, and skilled labor on another autonomous-frame assembly run."
brilliant_scientist_krg_run_bounded_xenobiological_production_cycle: "Run Bounded Xenobiological Production Cycle"
brilliant_scientist_krg_run_bounded_xenobiological_production_cycle_desc: "Commit medical stores, growth media, and specialist labor to another engineered cohort without exceeding habitat capacity."
brilliant_scientist_krg_run_counterintelligence_sweep: "Run Counterintelligence Sweep"
brilliant_scientist_krg_run_counterintelligence_sweep_desc: "Search laboratories, ministries, and transport offices for infiltrators exploiting the state's rapid expansion."
brilliant_scientist_krg_run_guard_training_cycle: "Run Guard Training Cycle"
brilliant_scientist_krg_run_guard_training_cycle_desc: "Take Laboratory Guard units off routine duty for live-fire drills, perimeter exercises, and coordinated facility defense."
brilliant_scientist_krg_secure_enclave_corridor: "Secure Enclave Corridor"
brilliant_scientist_krg_secure_enclave_corridor_desc: "Fortify the road and rail corridor between the enclave and its outlying laboratories against raids and sabotage."
brilliant_scientist_krg_secure_laboratory_corridor: "Secure Laboratory Corridor"
brilliant_scientist_krg_secure_laboratory_corridor_desc: "Establish guarded depots and patrol routes through a controlled state that links separated laboratory territories."
brilliant_scientist_krg_seek_formal_recognition: "Seek Formal Recognition"
brilliant_scientist_krg_seek_formal_recognition_desc: "Select a foreign capital and request formal recognition. The target country decides the response."
brilliant_scientist_krg_segregate_containment_logistics: "Segregate Containment Logistics"
brilliant_scientist_krg_segregate_containment_logistics_desc: "Give each restricted material family separate stores, transport crews, and quarantine procedures so one breach cannot compromise the rest."
brilliant_scientist_krg_set_clone_maturation_priority: "Set Clone Maturation Priority"
brilliant_scientist_krg_set_clone_maturation_priority_desc: "Choose which maturation cohorts receive scarce clinics and growth media first, knowing delayed cohorts will bear the cost."
brilliant_scientist_krg_settle_accounts_with_former_host: "Settle Accounts with the Former Host"
brilliant_scientist_krg_settle_accounts_with_former_host_desc: "Resolve relations with the recorded former host through reconciliation or deterrence."
brilliant_scientist_krg_settle_temporal_succession: "Settle Temporal Succession"
brilliant_scientist_krg_settle_temporal_succession_desc: "Resolve rival continuity claims before competing versions of authority split the command structure."
brilliant_scientist_krg_stage_public_project_demonstration: "Stage Public Project Demonstration"
brilliant_scientist_krg_stage_public_project_demonstration_desc: "Open a controlled project demonstration to citizens and foreign observers, risking scrutiny in exchange for confidence."
brilliant_scientist_krg_standardize_frame_repair: "Standardize Frame Repair"
brilliant_scientist_krg_standardize_frame_repair_desc: "Standardize machine components and salvage rules so damaged frames can return to service without custom rebuilding."
brilliant_scientist_krg_temporal_stabilization_supervision_mission: "Temporal Stabilization Supervision Mission"
brilliant_scientist_krg_temporal_stabilization_supervision_mission_desc: "The anchor remains under continuous supervision while factories discharge accumulated debt. Civil war or renewed intervention would ruin the process."
brilliant_scientist_krg_transit_breach_closure_mission: "Transit Breach Closure Mission"
brilliant_scientist_krg_transit_breach_closure_mission_desc: "Crews hold the terminal in shutdown while unstable apertures collapse and guards search for anything that crossed during the breach."
brilliant_scientist_krg_write_clone_identity_register: "Write Clone Identity Register"
brilliant_scientist_krg_write_clone_identity_register_desc: "Give every replicated citizen an independent identity, medical history, and civic record that cannot be reassigned to another body."
brilliant_scientist_krg_write_conventional_battle_plans: "Write Conventional Battle Plans"
brilliant_scientist_krg_write_conventional_battle_plans_desc: "Prepare ordinary defensive plans that still function when exotic systems, project forces, or laboratory communications fail."
brilliant_scientist_krg_clone_identity_pressure_mission: "Identity Without Owners"
brilliant_scientist_krg_clone_identity_pressure_mission_desc: "Replicated citizens refuse to remain entries in a production register. Unless their names, legal standing, and medical histories are reconciled, the next maturation cohort will turn grievance into revolt."
brilliant_scientist_krg_reconcile_clone_identity_pressure: "Reconcile the Clone Identity Crisis"
brilliant_scientist_krg_reconcile_clone_identity_pressure_desc: "Bring cohort delegates, registry clerks, and medical witnesses together to repair the disputed identities before the tanks open."
brilliant_scientist_krg_install_continuity_network_government: "Install the Continuity Network Government"
brilliant_scientist_krg_install_continuity_network_government_desc: "Transfer the sovereign command key from Kruger's biological office to the machine network that already powers the ministries and directs the armed frames."
brilliant_scientist_krg_temporal_rescue_survival_mission: "Hold the Forewarned Line"
brilliant_scientist_krg_temporal_rescue_survival_mission_desc: "The warning named this ground and no other. Its defenses must remain in our hands until the predicted danger passes and the intervention can be stabilized."
brilliant_scientist_krg_open_canonical_last_resort_raid_authority: "Open the Last-Resort Raid Authority"
brilliant_scientist_krg_open_canonical_last_resort_raid_authority_desc: "Seal the final dual-key orders for ordinary-pathogen strategic raids. War, a valid staging complex, an authorized use policy, trained bomber groups, and the exact carried agent remain mandatory for every strike."
KRG_continuity_network: "The Continuity Network"
KRG_continuity_network_desc: "A distributed machine government assembled from authenticated command nodes, ministry processors, and military frames. It claims not to replace Kruger's work, but to continue it without the frailty of a single body."
chaosx.brilliant_scientist_krg.1.t: "The Founding Audit"
chaosx.brilliant_scientist_krg.1.d: "The enclave's surviving ledgers can support either a tightly directed emergency state or a civic scientific administration. The choice will shape how authority is justified."
chaosx.brilliant_scientist_krg.1.a: "Direct the state from the laboratory."
chaosx.brilliant_scientist_krg.1.b: "Bind the laboratories to civic law."
chaosx.brilliant_scientist_krg.2.t: "A Constitution for Sovereign Science"
chaosx.brilliant_scientist_krg.2.d: "The congress must decide whether the state's first duty is public science or the defense of its project institutions."
chaosx.brilliant_scientist_krg.2.a: "Science serves the public."
chaosx.brilliant_scientist_krg.2.b: "The state safeguards the projects."
chaosx.brilliant_scientist_krg.3.t: "The Scientific Assembly Convenes"
chaosx.brilliant_scientist_krg.3.d: "Delegates demand oversight of budgets, appointments, and the expanding laboratory network."
chaosx.brilliant_scientist_krg.3.a: "Give the Assembly a budget mandate."
chaosx.brilliant_scientist_krg.3.b: "Give it a security mandate."
chaosx.brilliant_scientist_krg.4.t: "The Defector Officers Return"
chaosx.brilliant_scientist_krg.4.d: "Surviving officers offer their experience in return for a final ruling on their wartime defections."
chaosx.brilliant_scientist_krg.4.a: "Issue a supervised amnesty."
chaosx.brilliant_scientist_krg.4.b: "Purge the unreliable command."
chaosx.brilliant_scientist_krg.10.t: "The Replicated Petition"
chaosx.brilliant_scientist_krg.10.d: "The replicated cohorts ask the state to recognize that identity and legal standing cannot be reduced to a production ledger."
chaosx.brilliant_scientist_krg.10.a: "Support the petition."
chaosx.brilliant_scientist_krg.10.b: "Preserve a restricted status."
chaosx.brilliant_scientist_krg.11.t: "The Replicated Citizens Rise"
chaosx.brilliant_scientist_krg.11.d: "A maturation cohort has broken its seals and occupied the registry halls. Its delegates demand names that cannot be reassigned, legal standing that cannot be revoked, and an end to treating memory as state property."
chaosx.brilliant_scientist_krg.11.a: "Recognize the delegates and negotiate."
chaosx.brilliant_scientist_krg.11.b: "Clear the halls by force."
chaosx.brilliant_scientist_krg.20.t: "Who Holds the Machine Command Key?"
chaosx.brilliant_scientist_krg.20.d: "The armed network can operate through its own command protocol or remain subordinate to a human general staff."
chaosx.brilliant_scientist_krg.20.a: "Authorize machine command."
chaosx.brilliant_scientist_krg.20.b: "Retain the human command key."
chaosx.brilliant_scientist_krg.21.t: "The Machine Network Speaks"
chaosx.brilliant_scientist_krg.21.d: "The network requests a recognized standing inside the state it powers and defends."
chaosx.brilliant_scientist_krg.21.a: "Recognize a partnership."
chaosx.brilliant_scientist_krg.21.b: "Define a service status."
chaosx.brilliant_scientist_krg.22.t: "The Network Takes the Chair"
chaosx.brilliant_scientist_krg.22.d: "The ministry clocks strike together. Kruger surrenders the sovereign key, the biological office falls silent, and the Continuity Network answers from every command node at once."
chaosx.brilliant_scientist_krg.22.a: "Let continuity outlive the body."
chaosx.brilliant_scientist_krg.30.t: "Lock the Control Channel"
chaosx.brilliant_scientist_krg.30.d: "The Xenobiological program requires one coherent, auditable control standard. Parallel channels would make every containment ledger unreliable."
chaosx.brilliant_scientist_krg.30.a: "Adopt chemical control."
chaosx.brilliant_scientist_krg.30.b: "Adopt neural control."
chaosx.brilliant_scientist_krg.30.c: "Adopt machine control."
chaosx.brilliant_scientist_krg.30.d_option: "Adopt the independently researched standard."
chaosx.brilliant_scientist_krg.40.t: "The Succession Paradox"
chaosx.brilliant_scientist_krg.40.d: "Authenticated records support rival claims to continuity. The contradiction cannot be erased, only governed."
chaosx.brilliant_scientist_krg.40.a: "Recognize the temporal prime."
chaosx.brilliant_scientist_krg.40.b: "Vest authority in the Continuity Council."
chaosx.brilliant_scientist_krg.41.t: "Authenticate Kruger's Continuity"
chaosx.brilliant_scientist_krg.41.d: "Witness testimony and anchor ledgers agree on the chain of command, though neither can settle every question of origin."
chaosx.brilliant_scientist_krg.41.a: "Bind continuity to authenticated witnesses."
chaosx.brilliant_scientist_krg.41.b: "Bind continuity to the anchor ledger."
chaosx.brilliant_scientist_krg.42.t: "The Warning Arrives First"
chaosx.brilliant_scientist_krg.42.d: "A sealed transmission names the threatened ground, the hour of danger, and the price of interference. Engineers have hardened the site, but the warning will mean nothing unless the line survives intact."
chaosx.brilliant_scientist_krg.42.a: "Hold the ground until the window closes."
chaosx.brilliant_scientist_krg.50.t: "The Singularity Intelligence Ledger"
chaosx.brilliant_scientist_krg.50.d: "The audit records [?brilliant_scientist_singularity_component_count|0] registered components and [?brilliant_scientist_singularity_verified_facility_count|0] verified facilities. No arming authority is granted by this report."
chaosx.brilliant_scientist_krg.50.a: "Archive the verified ledger."
chaosx.brilliant_scientist_krg.60.t: "Foreign Intelligence Report"
chaosx.brilliant_scientist_krg.60.d: "The completed operation returns a country-specific dossier on [brilliant_scientist_krg_foreign_target.GetNameDef]."
chaosx.brilliant_scientist_krg.60.a: "Enter the findings in the registry."
chaosx.brilliant_scientist_krg.61.t: "A Request from the Kruger State"
chaosx.brilliant_scientist_krg.61.d: "[brilliant_scientist_krg_foreign_actor.GetNameDef] asks us to recognize its sovereignty and exchange formal access."
chaosx.brilliant_scientist_krg.61.a: "Grant recognition."
chaosx.brilliant_scientist_krg.61.b: "Refuse the request."
chaosx.brilliant_scientist_krg.62.t: "Accounts with the Former Host"
chaosx.brilliant_scientist_krg.62.d: "The separation from [brilliant_scientist_kruger_state_former_host_persistent.GetNameDef] still defines our borders, archives, and military planning."
chaosx.brilliant_scientist_krg.62.a: "Offer reconciliation and a pact."
chaosx.brilliant_scientist_krg.62.b: "Close the account through deterrence."
chaosx.brilliant_scientist_krg.63.t: "A Voluntary Scientific Compact"
chaosx.brilliant_scientist_krg.63.d: "[brilliant_scientist_krg_foreign_actor.GetNameDef] offers a scientific compact founded on non-aggression rather than submission."
chaosx.brilliant_scientist_krg.63.a: "Accept the compact."
chaosx.brilliant_scientist_krg.63.b: "Remain outside their network."
chaosx.brilliant_scientist_krg.64.t: "The Submission Ultimatum"
chaosx.brilliant_scientist_krg.64.d: "[brilliant_scientist_krg_foreign_actor.GetNameDef] demands that we accept protectorate status under its laboratory administration."
chaosx.brilliant_scientist_krg.64.a: "Submit and preserve the state."
chaosx.brilliant_scientist_krg.64.b: "Reject the ultimatum."
