chaosx.fallout.887.t: "Mixed Settlement Petition"
chaosx.fallout.887.opening.d: "After the Congo Green Basin names itself in public, river households and altered survivors ask to share the same pump road. The old district ledger lists two kinds of resident, while a foreign witness waits for one answer. The Basin must decide whether common ground is a right, a boundary, a supervised promise, or a line that cannot be crossed."
chaosx.fallout.887.a: "Grant equal citizenship"
chaosx.fallout.887.a.tt: "Spend Food 2, Medicine 2, and Recognition 3 to extend the Basin charter to every resident and publish one shared district register."
chaosx.fallout.887.b: "Keep separate districts"
chaosx.fallout.887.b.tt: "Spend Scrap 3, Power 1, and Recognition 2 to protect separate assemblies while building a narrow corridor for water and winter supplies."
chaosx.fallout.887.c: "Supervise the integration"
chaosx.fallout.887.c.tt: "Spend Fuel 2 and Recognition 2, then accept a Cohesion cost, to appoint paired stewards for every mixed settlement road."
chaosx.fallout.887.d: "Refuse the settlement petition"
chaosx.fallout.887.d.tt: "Spend Food 3, Medicine 2, Fuel 1, and Recognition 1 to refuse permanent shared districts while issuing a recorded transit rule."
chaosx.fallout.888.t: "Mixed Settlement Petition"
chaosx.fallout.889.t: "The Basin Draws a Common Boundary"
chaosx.fallout.889.equal_citizenship.success.d: "The charter reaches the river school and the pump road at the same time. Resident names enter one register, food and medicine queues use the same slate, and the foreign witness can see where an appeal belongs."
chaosx.fallout.889.equal_citizenship.partial.d: "The central ward accepts one register, but the hill road keeps a second ledger for winter arrivals. The Basin has a shared right on paper and a practical boundary that still depends on which bridge is open."
chaosx.fallout.889.equal_citizenship.failure.d: "The charter is announced before the clerks agree on the names it protects. Two queues form beside the same pump, and every household is told to return with a different proof of residence."
chaosx.fallout.889.separate_districts.success.d: "Separate assemblies keep their own records and agree on one water corridor. The boundary is visible, the winter convoy knows which steward to call, and the foreign witness records a compact rather than a ban."
chaosx.fallout.889.separate_districts.partial.d: "The districts preserve their councils, but the corridor needs a checkpoint at every bend. Supplies move when both seals are present, leaving the Basin with a workable border and a costly delay."
chaosx.fallout.889.separate_districts.failure.d: "The district line becomes a wall without a gate. Residents wait on the wrong side of the pump road while clerks argue over which ledger can authorize a blanket, a crate, or a place to sleep."
chaosx.fallout.889.supervised_integration.success.d: "Paired stewards walk the river road together and settle disputes before they reach the pump. Each mixed settlement keeps its voice, each district keeps a witness, and the Basin can explain its rule without hiding behind a category."
chaosx.fallout.889.supervised_integration.partial.d: "The paired stewards hold the central road, while the hill settlement accepts only one appointed voice. The promise survives in the Basin's records, yet the next rain will test whether supervision is a bridge or a new gate."
chaosx.fallout.889.supervised_integration.failure.d: "Supervision becomes a chain of permits. One steward waits for the other, medicine sits in a locked cart, and residents learn that a shared settlement can be denied by a missing signature."
chaosx.fallout.889.refuse_settlement.success.d: "The Basin refuses permanent shared districts but publishes a transit rule that protects water, shelter, and medicine on the road. The foreign witness receives a copy, and every refusal carries a named reason instead of a silent order."
chaosx.fallout.889.refuse_settlement.partial.d: "The petition is refused at the council table, while river families make informal camps near the pump road. The Basin has a boundary rule, but winter movement now depends on favors that no register can audit."
chaosx.fallout.889.refuse_settlement.failure.d: "The refusal spreads faster than the rule that was meant to contain it. District clerks turn away residents without recording why, and the Basin's public name arrives at neighboring gates as a warning."
chaosx.fallout.889.a: "Enter the settlement rule"
chaosx.fallout.889.a.tt: "Apply the graded settlement result, record its mixed-community memory, and schedule the delayed first-year review."
chaosx.fallout.891.t: "The Shared Ground Faces Its First Rain"
chaosx.fallout.891.success.d: "The first cold rain closes the southern bridge, but the settlement rule still names who can cross, who receives shelter, and who may appeal. The Congo Green Basin has a common answer that does not erase the different voices that shaped it."
chaosx.fallout.891.partial.d: "The rule survives its first winter test with one clause disputed between the river and hill roads. Residents know where to petition, though every generation will have to decide whether the boundary is a promise or a habit."
chaosx.fallout.891.failure.d: "The delayed review finds separate ledgers, missing permits, and no steward willing to sign for the next convoy. The Basin remembers choosing a settlement rule, but the shared road has become another source of fear."
chaosx.fallout.891.a: "Close the settlement review"
chaosx.fallout.891.a.tt: "Apply the delayed first-year outcome, record the final mixed-community memory, and release the reserved state and witness rows."
