l_english:
utopia_manifesto_auxiliary_dependency: "Auxiliary Dependency"
utopia_manifesto_auxiliary_dependency_desc: "Foreign formations fill urgent military gaps, but their contracts carry equipment costs, political leverage, and obligations that narrow independent command."
utopia_manifesto_auxiliary_dependency_failure: "Contracts Without Command"
utopia_manifesto_auxiliary_dependency_failure_desc: "Unpaid obligations and divided loyalties have left auxiliary forces beyond reliable command and the state exposed to their patrons."
utopia_manifesto_auxiliary_dependency_mitigated: "Bounded Auxiliary Service"
utopia_manifesto_auxiliary_dependency_mitigated_desc: "Contracts are limited, accounts are current, and only vetted cadres remain under clear national command."
utopia_manifesto_charter_of_households: "Charter of Households"
utopia_manifesto_charter_of_households_desc: "Municipal votes, lawful exit, and public guarantees make the household a source of political authority as well as a unit of provision."
utopia_manifesto_charter_of_households_failure: "Charters Without Provision"
utopia_manifesto_charter_of_households_failure_desc: "Local promises multiply while stores and common rules fail, leaving municipalities free to refuse one another's burdens."
utopia_manifesto_charter_of_households_final: "Commonwealth by Consent"
utopia_manifesto_charter_of_households_final_desc: "Households and municipalities sustain a mature constitutional order through open stores, social guarantees, and voluntary association."
utopia_manifesto_charter_of_households_mitigated: "Working Municipal Charters"
utopia_manifesto_charter_of_households_mitigated_desc: "Local government and national provision are bound by published duties, appeals, and reliable contributions."
utopia_manifesto_closed_island_idea: "The Closed Island"
utopia_manifesto_closed_island_idea_desc: "Guarded stores, assigned service, and fortified boundaries promise abundance to insiders through a single compulsory order."
utopia_manifesto_closed_island_failure: "The Island Eats Its Own"
utopia_manifesto_closed_island_failure_desc: "Ration privilege, exhausted service households, and resistance have turned the sealed order against the society it claimed to protect."
utopia_manifesto_closed_island_final: "The Perfect Island"
utopia_manifesto_closed_island_final_desc: "Stores, service households, defenses, and dependent outposts answer to one completed system of command."
utopia_manifesto_closed_island_mitigated: "A Bounded Service State"
utopia_manifesto_closed_island_mitigated_desc: "The island remains strict, but stable reserves and limited review restrain its most destructive demands."
utopia_manifesto_common_store_network: "Common Store Network"
utopia_manifesto_common_store_network_desc: "Linked depots and public accounts carry grain, tools, medicine, and emergency stock from national reserve to local household."
utopia_manifesto_common_store_network_failure: "Empty Common Stores"
utopia_manifesto_common_store_network_failure_desc: "Guarantees remain posted while queues lengthen, inventories vanish, and the public account no longer matches the shelves."
utopia_manifesto_common_store_network_final: "Commonwealth in Plenty"
utopia_manifesto_common_store_network_final_desc: "Rotated reserves and productive abundance allow the stores to sustain domestic guarantees, aid, and regional obligations."
utopia_manifesto_common_store_network_mitigated: "Reliable Public Stores"
utopia_manifesto_common_store_network_mitigated_desc: "Regular rotation, secure transport, and open accounts have made the reserve dependable through ordinary shortages."
utopia_manifesto_common_table: "The Common Table"
utopia_manifesto_common_table_desc: "Worker councils and public distribution join production to a visible promise of equal provision."
utopia_manifesto_common_table_failure: "Councils at Deadlock"
utopia_manifesto_common_table_failure_desc: "Competing mandates have halted transfers, reserve releases, and production decisions while shortages deepen."
utopia_manifesto_common_table_final: "Union of Common Tables"
utopia_manifesto_common_table_final_desc: "Recallable delegates, federated workshops, and shared reserves form a mature order of common ownership."
utopia_manifesto_common_table_mitigated: "A Congress That Delivers"
utopia_manifesto_common_table_mitigated_desc: "Council autonomy survives within a congress capable of settling urgent production and provision disputes."
utopia_manifesto_found_manifesto: "The Found Manifesto"
utopia_manifesto_found_manifesto_desc: "A recovered book has become a national argument, filling halls and offices with proposals that the existing state cannot ignore."
utopia_manifesto_found_manifesto_failure: "The Book Made Doctrine"
utopia_manifesto_found_manifesto_failure_desc: "Official interpretation has replaced public reading, and disagreement with the text is treated as disloyalty to the state."
utopia_manifesto_found_manifesto_mitigated: "The Manifesto in Public Hands"
utopia_manifesto_found_manifesto_mitigated_desc: "Open editions, competing commentaries, and public institutions have turned the manuscript into a revisable civic language."
utopia_manifesto_garden_district_network: "Garden District Network"
utopia_manifesto_garden_district_network_desc: "Housing, work, gardens, clinics, schools, stores, and transport are linked in districts designed as complete places."
utopia_manifesto_garden_district_network_failure: "Districts Without a Life"
utopia_manifesto_garden_district_network_failure_desc: "Homes stand apart from work, routes fail, and residents reject plans drawn without their needs or assent."
utopia_manifesto_garden_district_network_final: "The Ring of Social Cities"
utopia_manifesto_garden_district_network_final_desc: "Specialized towns and municipal districts now sustain one another through transport, services, and common reserves."
utopia_manifesto_garden_district_network_mitigated: "Working Social Districts"
utopia_manifesto_garden_district_network_mitigated_desc: "Local charters and practical corrections have joined housing, employment, and services into viable neighborhoods."
utopia_manifesto_stewardship_obligation_state: "Stewardship Obligation"
utopia_manifesto_stewardship_obligation_state_desc: "Administration outruns provision while the territory waits for a settled status. Local Supplies fall by 5% and Resistance Target rises by 5% until the obligation is resolved."
utopia_manifesto_lease_administration_state: "Lease Administration"
utopia_manifesto_lease_administration_state_desc: "A paid lease keeps sovereignty with its owner while opening stores and extraction under public terms. Local Supplies rise by 10% and Local Resources by 5%."
utopia_manifesto_island_project_lease_state: "Island Project Lease"
utopia_manifesto_island_project_lease_state_desc: "This island supports the commonwealth project under a bounded lease rather than annexation. Local Supplies rise by 10% and Local Resources by 5% for the life of the agreement."
utopia_manifesto_joint_administration_state: "Joint Administration"
utopia_manifesto_joint_administration_state_desc: "Officials from both parties share accounts, works, and local obligations. Local Supplies rise by 5% and Building Construction Speed by 10%."
utopia_manifesto_settlement_agreement_state: "Settlement Agreement"
utopia_manifesto_settlement_agreement_state_desc: "A negotiated settlement joins residence, public works, and reciprocal guarantees. Local Supplies and Building Construction Speed rise by 10%."
utopia_manifesto_long_supply_contract_state: "Long Supply Contract"
utopia_manifesto_long_supply_contract_state_desc: "A renewable contract answers the stated deficit without changing sovereignty. Local Resources rise by 10% while the agreement remains in force."
utopia_manifesto_association_charter_state: "Association Charter"
utopia_manifesto_association_charter_state_desc: "Local institutions enter the commonwealth network through a negotiated charter. Local Resources rise by 5% and Resistance Target falls by 5%."
utopia_manifesto_provisioned_stewardship_state: "Provisioned Stewardship"
utopia_manifesto_provisioned_stewardship_state_desc: "Regular deliveries meet the first duty of administration. Local Supplies rise by 15% while the stewardship remains active."
utopia_manifesto_restored_stewardship_route_state: "Restored Stewardship Routes"
utopia_manifesto_restored_stewardship_route_state_desc: "Repaired roads, rail, and depots reconnect the territory to its stores. Building Construction Speed rises by 15%."
utopia_manifesto_local_charter_state: "Local Stewardship Charter"
utopia_manifesto_local_charter_state_desc: "A published charter gives local institutions resources, review, and a voice in the territory's future. Local Resources rise by 10% and Resistance Target falls by 5%."
utopia_manifesto_assigned_colony_state: "Assigned Colony"
utopia_manifesto_assigned_colony_state_desc: "Households and labor answer to a compulsory colonial schedule. Local Supplies rise by 10%, but Resistance Target also rises by 10%."
utopia_manifesto_integrated_commonwealth_state: "Integrated Commonwealth Territory"
utopia_manifesto_integrated_commonwealth_state_desc: "Long administration, local institutions, and a resolved status have joined the territory to the commonwealth. Local Resources and Building Construction Speed rise by 15%."
utopia_manifesto_incomplete_district_state: "Incomplete Garden District"
utopia_manifesto_incomplete_district_state_desc: "A housing, transport, or role-plan obligation failed at construction review. The unfinished works reduce Local Supplies by 5% and Building Construction Speed by 10% while raising Resistance Target by 5%."
utopia_manifesto_district_consent_charter_state: "Household Compact District Charter"
utopia_manifesto_district_consent_charter_state_desc: "Municipal appeals and household guarantees reduce Resistance Target by 5%, while the duties of local exit and review reduce Local Supplies by 1%."
utopia_manifesto_district_common_table_charter_state: "Common Table District Charter"
utopia_manifesto_district_common_table_charter_state_desc: "Council stores and shared production raise Local Supplies by 5% and Local Resources by 3%."
utopia_manifesto_district_guardians_charter_state: "Measured District Charter"
utopia_manifesto_district_guardians_charter_state_desc: "Survey offices and enforced standards raise Building Construction Speed by 10% while raising Resistance Target by 3%."
utopia_manifesto_district_closed_island_charter_state: "Assigned District Charter"
utopia_manifesto_district_closed_island_charter_state_desc: "Sealed stores raise Local Supplies by 10%. The assigned conduct code begins with Resistance Target +8%, which a funded appeal or permanent observers can reduce to +3%."
utopia_manifesto_district_humanist_charter_state: "Humanist Review District Charter"
utopia_manifesto_district_humanist_charter_state_desc: "A revisable charter raises Local Supplies by 3% and reduces Resistance Target by 3%."
utopia_manifesto_penal_works_active_state: "Penal Works Active"
utopia_manifesto_penal_works_active_state_desc: "Coercive labor raises Building Construction Speed by 25%, reduces Local Supplies by 10%, and raises Required Garrisons by 25%. Resistance Target begins at +12%. Supervision or inspection sets it to +8%, while a hardened timetable sets it to +18%. Penal works can stand in for the district's unfinished role plan. They end with district completion, failure, loss of ownership or control, loss of core status, revolt, route exit, or a halt. The coercion remains recorded."
utopia_manifesto_inherited_order: "The Inherited Order"
utopia_manifesto_inherited_order_desc: "Existing property, offices, and local privileges resist reform even as they provide the institutions through which it must begin."
utopia_manifesto_inherited_order_failure: "Property Without Settlement"
utopia_manifesto_inherited_order_failure_desc: "Dispossession, obstruction, and unresolved claims have left land and productive assets inside a continuing political conflict."
utopia_manifesto_inherited_order_mitigated: "A Registered Settlement"
utopia_manifesto_inherited_order_mitigated_desc: "Public registers and negotiated rules have made ownership legible enough for reform without administrative collapse."
utopia_manifesto_perfect_measure_failure: "The Survey Made Scripture"
utopia_manifesto_perfect_measure_failure_desc: "Corrections disappear, local evidence is rejected, and the measured country obeys accounts that no longer describe it."
utopia_manifesto_perfect_measure_final: "The Planned Commonwealth"
utopia_manifesto_perfect_measure_final_desc: "Linked cities, accurate reserves, and professional administration give technical planning a complete national form."
utopia_manifesto_perfect_measure_mitigated: "Measure with Appeals"
utopia_manifesto_perfect_measure_mitigated_desc: "Independent review and local evidence keep the national plan responsive without surrendering its coordinating power."
utopia_manifesto_practical_commonwealth_idea: "The Practical Commonwealth"
utopia_manifesto_practical_commonwealth_idea_desc: "Mixed institutions pursue a social floor while preserving criticism, lawful exit, and the power to abandon failed designs."
utopia_manifesto_practical_commonwealth_failure: "Reform Without Direction"
utopia_manifesto_practical_commonwealth_failure_desc: "Institutions remain plural, but shared guarantees and public purpose have weakened into disconnected local experiments."
utopia_manifesto_practical_commonwealth_final: "A Good Place with Limits"
utopia_manifesto_practical_commonwealth_final_desc: "A mature commonwealth secures provision and liberty while admitting that every law, office, and plan remains open to revision."
utopia_manifesto_practical_commonwealth_mitigated: "Institutions Under Review"
utopia_manifesto_practical_commonwealth_mitigated_desc: "Sunset clauses, public audit, and mixed provision allow the country to correct failure without discarding useful reforms."
utopia_manifesto_stewardship_burden: "The Burden of Stewardship"
utopia_manifesto_stewardship_burden_desc: "Administered ground creates immediate duties of supply, reconstruction, local government, and a credible future status."
utopia_manifesto_stewardship_burden_failure: "Stewardship Without Assent"
utopia_manifesto_stewardship_burden_failure_desc: "Rule has outlived provision and public justification, leaving resistance to answer promises the administration did not keep."
utopia_manifesto_stewardship_burden_final: "A Commonwealth of Places"
utopia_manifesto_stewardship_burden_final_desc: "Associates and municipalities share durable obligations through provision, charter, and local assent rather than indefinite occupation."
utopia_manifesto_stewardship_burden_mitigated: "Provision Before Status"
utopia_manifesto_stewardship_burden_mitigated_desc: "Food, repairs, local institutions, and public review are established before a permanent political settlement is demanded."
utopia_manifesto_unmeasured_country: "The Unmeasured Country"
utopia_manifesto_unmeasured_country_desc: "The state lacks a trustworthy account of households, callings, stores, transport, and the shortages joining them."
utopia_manifesto_unmeasured_country_failure: "Accounts No One Believes"
utopia_manifesto_unmeasured_country_failure_desc: "Suppressed corrections and contradictory registers have made every plan suspect and every guarantee difficult to verify."
utopia_manifesto_unmeasured_country_final: "A Country in Public Measure"
utopia_manifesto_unmeasured_country_final_desc: "Open accounts connect households, production, reserves, transport, and institutions in a mature public record."
utopia_manifesto_unmeasured_country_mitigated: "The First Honest Account"
utopia_manifesto_unmeasured_country_mitigated_desc: "Surveys and public corrections have made the country's most urgent strengths and shortages visible."
utopia_manifesto_common_ownership: "Common Ownership"
utopia_manifesto_common_ownership_desc: "Major land, infrastructure, and strategic production are held through public and council institutions for common necessity."
utopia_manifesto_household_land_trusts: "Household Land Trusts"
utopia_manifesto_household_land_trusts_desc: "Community trusts capture land value for housing and services while protecting homes, small farms, and lawful enterprise."
utopia_manifesto_measured_tenure: "Measured Tenure"
utopia_manifesto_measured_tenure_desc: "Use, capacity, and public obligations define tenure under a technical system of registration and review."
utopia_manifesto_mixed_property_order: "Mixed Property Order"
utopia_manifesto_mixed_property_order_desc: "Land trusts, cooperatives, public options, and regulated private enterprise share responsibility for provision."
utopia_manifesto_state_allotment: "State Allotment"
utopia_manifesto_state_allotment_desc: "Land, housing, and access to stores are assigned through service obligations determined by the central order."
