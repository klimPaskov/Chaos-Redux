l_english:
independence_wave_dsx_signature_l2_projects_complete_tt: "Complete the Oyo Mesi, Ibadan, horse guard and Yoruba towns work to open the final institutional choices."
independence_wave_dsx_signature_anchor_control_tt: "Oyo must own and control its capital state."
independence_wave_dsx_signature_fund_market_roads: "Fund the Oyo Market Road"
independence_wave_dsx_signature_fund_market_roads_desc: "Commit resources to a road and market circuit that connects Oyo's inland markets with its coastal trade. The works remain under Oyo's administration."
independence_wave_dsx_signature_fund_market_roads_effect_tt: "Adds [?constant:independence_wave_signature_project.infrastructure_level|.0] infrastructure level and [?constant:independence_wave_signature_project.building_slot|0] shared building slot in Oyo's capital state."
independence_wave_dsx_focus_table_the_power_centers: "Bring the Oyo Powers to the Table"
independence_wave_dsx_focus_table_the_power_centers_desc: "Oyo's restored council and crown must agree on the powers they will share. Ibadan and the Yoruba towns will judge the settlement by the terms they receive."
independence_wave_dsx_focus_table_the_power_centers_effect_tt: "Convene the Alaafin, Oyo Mesi and Yoruba towns to settle the powers they will share."
independence_wave_dsx_focus_renew_the_alaafins_charter: "Renew the Alaafin's Charter"
independence_wave_dsx_focus_renew_the_alaafins_charter_desc: "Restore the Alaafin's authority over appointments and mounted service while retaining the Oyo Mesi's place in government."
independence_wave_dsx_focus_renew_the_alaafins_charter_effect_tt: "The Alaafin and the Oyo Mesi settle on a royal charter for the state."
independence_wave_dsx_focus_empower_the_oyo_mesi: "Entrust the Oyo Mesi Council"
independence_wave_dsx_focus_empower_the_oyo_mesi_desc: "Give the Oyo Mesi a stronger voice over ministers and the town guard, with the Alaafin remaining the sovereign."
independence_wave_dsx_focus_empower_the_oyo_mesi_effect_tt: "The Oyo Mesi set the council mandate and direct the town guard."
independence_wave_dsx_focus_federate_the_yoruba_towns: "Federate the Yoruba Towns"
independence_wave_dsx_focus_federate_the_yoruba_towns_desc: "Keep the crown and Oyo Mesi in balance while giving the Yoruba towns a place in a voluntary political compact."
independence_wave_dsx_focus_federate_the_yoruba_towns_effect_tt: "A negotiated compact gives the crown, Oyo Mesi and Yoruba towns a shared place in government."
independence_wave_dsx_focus_bind_the_horse_guard_to_the_charter: "Bind the Horse Guard to the Charter"
independence_wave_dsx_focus_bind_the_horse_guard_to_the_charter_desc: "Place mounted service under the charter and define it as a duty of the restored Oyo government."
independence_wave_dsx_focus_bind_the_horse_guard_to_the_charter_effect_tt: "The charter strengthens Oyo's mounted service and its field organization."
independence_wave_dsx_focus_register_the_town_guard: "Register the Town Guard"
independence_wave_dsx_focus_register_the_town_guard_desc: "The Oyo Mesi directs the town guard and keeps local defense answerable to the council."
independence_wave_dsx_focus_register_the_town_guard_effect_tt: "The council directs the town guard and local defense."
independence_wave_dsx_focus_guarantee_ibadans_place: "Guarantee Ibadan's Place"
independence_wave_dsx_focus_guarantee_ibadans_place_desc: "Confirm Ibadan's negotiated place in the Yoruba compact after its local terms have been reconciled."
independence_wave_dsx_focus_guarantee_ibadans_place_effect_tt: "A voluntary city settlement gives Ibadan a place in Oyo's compact."
independence_wave_dsx_focus_survey_oyo_market_roads: "Survey Oyo's Market Roads"
independence_wave_dsx_focus_survey_oyo_market_roads_desc: "Prepare a costed road and market program for the capital state, where Oyo can maintain the route itself."
independence_wave_dsx_focus_survey_oyo_market_roads_effect_tt: "A paid road and market project becomes available for Oyo's capital state."
independence_wave_dsx_focus_authorize_the_yoruba_congress: "Authorize the Yoruba Congress"
independence_wave_dsx_focus_authorize_the_yoruba_congress_desc: "Give the regional congress authority to negotiate with willing Yoruba communities while leaving their sovereignty intact."
independence_wave_dsx_focus_authorize_the_yoruba_congress_effect_tt: "Unlocks Oyo's regional ambition and leadership decisions."
independence_wave_dsx_focus_publish_the_oyo_compact: "Publish the Oyo Compact"
independence_wave_dsx_focus_publish_the_oyo_compact_desc: "Publish the terms that join Oyo's institutions, Ibadan and the invited Yoruba towns in a shared political compact."
independence_wave_dsx_focus_publish_the_oyo_compact_effect_tt: "Raises legitimacy, recognition, administrative capacity and security. Regional ambition also raises internal instability."
independence_wave_dsx_alaafin_charter: "Alaafin's Charter"
independence_wave_dsx_alaafin_charter_desc: "The crown keeps authority over appointments and mounted service within Oyo's shared government."
independence_wave_dsx_mesi_mandate: "Oyo Mesi Mandate"
independence_wave_dsx_mesi_mandate_desc: "The Oyo Mesi directs the town guard and keeps local defense answerable to the council."
independence_wave_dsx_town_federation: "Oyo Town Federation"
independence_wave_dsx_town_federation_desc: "Ibadan and participating towns keep local authority under Oyo's negotiated compact."
independence_wave_atj_signature_l2_projects_complete_tt: "Complete the notables' council, madrasah and pepper-port projects to open Aceh's institutional choices."
independence_wave_atj_signature_anchor_control_tt: "Aceh must own and control its capital state."
independence_wave_atj_signature_form36_available_tt: "Extend Aceh's reform-school network and retire the Penang port credit. The maritime federation must remain available."
independence_wave_atj_signature_organize_pusa: "Convene the All-Aceh Ulama Council"
independence_wave_atj_signature_organize_pusa_desc: "Once the district settlement is complete and the school network stands, the ulama can organize Persatuan Ulama Seluruh Aceh (PUSA) to set shared standards for Aceh's reform schools and support practical industrial education."
independence_wave_atj_signature_organize_pusa_effect_tt: "PUSA organizes Aceh's reform-school network and grants a [?constant:independence_wave_focus_reward.technology_bonus|%0] industry research bonus for one technology."
independence_wave_atj_signature_secure_port_credit: "Secure Penang Port Credit"
independence_wave_atj_signature_secure_port_credit_desc: "With the pepper-port route open, accept a Penang merchant advance to expand Banda Aceh's harbor. Fees raise consumer-goods needs until Aceh repays the credit."
independence_wave_atj_signature_secure_port_credit_effect_tt: "Adds [?constant:independence_wave_signature_project.naval_base_level|.0] naval base level in Banda Aceh and replaces the pepper-port trade terms with Penang Merchant Credit."
independence_wave_atj_signature_retire_port_credit: "Retire the Penang Port Credit"
independence_wave_atj_signature_retire_port_credit_desc: "Commit resources to clear the port advance and bring the harbor under an Aceh Port Trust."
independence_wave_atj_signature_retire_port_credit_effect_tt: "Replaces the merchant-credit burden with the Aceh Port Trust."
independence_wave_atj_district_terms: "Uleebalang District Guarantees"
independence_wave_atj_district_terms_desc: "District chiefs retain a defined place in local courts and port administration under the council's charter."
independence_wave_atj_ulama_school_board: "Ulama School Board"
independence_wave_atj_ulama_school_board_desc: "The ulama guide school standards and religious education through a shared council."
independence_wave_atj_shared_council: "District and School Council"
independence_wave_atj_shared_council_desc: "Uleebalang, ulama and merchants share seats in Aceh's local council."
independence_wave_atj_school_network: "Aceh Reform-School Network"
independence_wave_atj_school_network_desc: "District schools coordinate curricula and teacher preparation across Aceh."
independence_wave_atj_pusa_school_network: "PUSA School Network"
independence_wave_atj_pusa_school_network_desc: "Persatuan Ulama Seluruh Aceh sets shared standards for reform schools and teacher preparation."
independence_wave_atj_penang_port_credit: "Penang Merchant Credit"
independence_wave_atj_penang_port_credit_desc: "An advance from Penang buyers keeps the port supplied. Interest and fees raise consumer-goods needs until Aceh repays the credit."
independence_wave_atj_aceh_port_trust: "Aceh Port Trust"
independence_wave_atj_aceh_port_trust_desc: "A locally governed port trust manages the harbor after the merchant credit has been cleared."
independence_wave_atj_focus_reconcile_district_and_school_authority: "Reconcile District and School Authority"
independence_wave_atj_focus_reconcile_district_and_school_authority_desc: "Uleebalang districts, ulama, merchants and school networks must agree on how Aceh will govern its ports and classrooms."
independence_wave_atj_focus_reconcile_district_and_school_authority_effect_tt: "Aceh's districts, ulama schools and port interests can settle the division of authority."
independence_wave_atj_focus_protect_uleebalang_districts: "Protect Uleebalang Districts"
independence_wave_atj_focus_protect_uleebalang_districts_desc: "Preserve the district chiefs' authority in local courts and port administration."
independence_wave_atj_focus_protect_uleebalang_districts_effect_tt: "Favors district authority and replaces the Council of Notables with district guarantees once they are confirmed."
independence_wave_atj_focus_give_ulama_a_school_board: "Give the Ulama a School Board"
independence_wave_atj_focus_give_ulama_a_school_board_desc: "Entrust school standards to the ulama while keeping the district chiefs and port merchants within the council."
independence_wave_atj_focus_give_ulama_a_school_board_effect_tt: "Favors the ulama and replaces the Council of Notables with a school board once it is seated."
independence_wave_atj_focus_keep_a_shared_council: "Keep a Shared Council"
independence_wave_atj_focus_keep_a_shared_council_desc: "Keep district chiefs, ulama and port merchants in a negotiated council with no single institution above the others."
independence_wave_atj_focus_keep_a_shared_council_effect_tt: "Balances district and school authority and replaces the Council of Notables with a shared council once it is ratified."
independence_wave_atj_focus_confirm_district_guarantees: "Confirm District Guarantees"
independence_wave_atj_focus_confirm_district_guarantees_desc: "District chiefs hold defined duties alongside the authority of Aceh's central council."
independence_wave_atj_focus_confirm_district_guarantees_effect_tt: "Confirms Uleebalang District Guarantees. Under a federal compact, those terms become part of the existing charter."
independence_wave_atj_focus_seat_the_school_board: "Seat the School Board"
independence_wave_atj_focus_seat_the_school_board_desc: "Let the ulama set common school standards while local institutions retain their voice."
independence_wave_atj_focus_seat_the_school_board_effect_tt: "Seats the Ulama School Board. Under a federal compact, its terms become part of the existing charter."
independence_wave_atj_focus_ratify_the_shared_council: "Ratify the Shared Council"
independence_wave_atj_focus_ratify_the_shared_council_desc: "Confirm the shared council's place in Aceh's district and port administration."
independence_wave_atj_focus_ratify_the_shared_council_effect_tt: "Ratifies the District and School Council. Under a federal compact, its terms become part of the existing charter."
independence_wave_atj_focus_extend_the_school_network: "Extend the Reform-School Network"
independence_wave_atj_focus_extend_the_school_network_desc: "Coordinate the schools and teacher networks that predate PUSA, giving reform education a province-wide footing."
independence_wave_atj_focus_extend_the_school_network_effect_tt: "The reform-school network improves research capacity."
independence_wave_atj_focus_charter_the_port_board: "Charter the Aceh Port Board"
independence_wave_atj_focus_charter_the_port_board_desc: "Put harbor administration under a local board and make the terms of outside credit visible to the council."
independence_wave_atj_focus_charter_the_port_board_effect_tt: "A paid port-credit project becomes available."
independence_wave_atj_focus_convene_the_maritime_congress: "Convene the Maritime Congress"
independence_wave_atj_focus_convene_the_maritime_congress_desc: "Invite willing maritime communities to negotiate a federation that leaves each member's government and territory in its own hands."
independence_wave_atj_focus_convene_the_maritime_congress_effect_tt: "Opens the maritime federation invitation and consent process."
independence_wave_iax_signature_l2_projects_complete_tt: "Complete the Moulmein council, school and port projects before opening Mon's federal and regional agreements."
independence_wave_iax_signature_anchor_control_tt: "Mon State must own and control its capital state."
independence_wave_iax_signature_form37_available_tt: "Publish Mon Federal Autonomy after completing the local charter, Salween transport works and Tenasserim border watch. The mainland federal compact must remain available."
independence_wave_iax_signature_build_salween_transport: "Fund Salween Transport Works"
independence_wave_iax_signature_build_salween_transport_desc: "Commit resources to a road and transport program that links Moulmein's markets with the Salween corridor."
independence_wave_iax_signature_build_salween_transport_effect_tt: "Adds [?constant:independence_wave_signature_project.infrastructure_level|.0] infrastructure level and [?constant:independence_wave_signature_project.building_slot|0] shared building slot in Mon State's capital state."
independence_wave_iax_signature_prepare_tenasserim_watch: "Prepare the Tenasserim Border Watch"
independence_wave_iax_signature_prepare_tenasserim_watch_desc: "Equip a local border watch and strengthen the approach to Mon State's capital."
independence_wave_iax_signature_prepare_tenasserim_watch_effect_tt: "Adds [?constant:independence_wave_signature_project.bunker_level|.0] land fort level on Tenasserim's Western Siam frontier."
independence_wave_iax_local_council_terms: "Mon Town and Monastery Council"
independence_wave_iax_local_council_terms_desc: "Town notables and monasteries hold a defined place in a federal council for Mon communities."
independence_wave_iax_river_office_terms: "Moulmein River Office"
independence_wave_iax_river_office_terms_desc: "A central office coordinates river administration, port revenues and transport works from Moulmein."
independence_wave_iax_mon_school_trust: "Mon Language School Trust"
independence_wave_iax_mon_school_trust_desc: "Monasteries and local schools coordinate language teaching and prepare new teachers."
independence_wave_iax_signature_cultural_exchange: "Mon School Delegation"
independence_wave_iax_focus_choose_the_mon_government: "Choose Mon's Governing Balance"
independence_wave_iax_focus_choose_the_mon_government_desc: "The provisional council must decide whether Mon's schools and towns answer first to local institutions or to a central river office."
independence_wave_iax_focus_choose_the_mon_government_effect_tt: "Mon councils and monasteries can settle authority with Moulmein's river administration."
independence_wave_iax_focus_trust_local_mon_councils: "Trust Local Mon Councils"
independence_wave_iax_focus_trust_local_mon_councils_desc: "Let town councils and monasteries guide local administration under a federal charter."
independence_wave_iax_focus_trust_local_mon_councils_effect_tt: "Entrusts local administration to Mon councils and monasteries."
independence_wave_iax_focus_direct_the_river_office: "Direct the River Office"
independence_wave_iax_focus_direct_the_river_office_desc: "Place transport, port revenue and river works under a central Moulmein administration."
independence_wave_iax_focus_direct_the_river_office_effect_tt: "Entrusts river administration to the central Moulmein office."
independence_wave_iax_focus_guarantee_the_local_charter: "Guarantee the Local Charter"
independence_wave_iax_focus_guarantee_the_local_charter_desc: "Protect the standing of Mon town councils and monasteries in the provisional federal government."
independence_wave_iax_focus_guarantee_the_local_charter_effect_tt: "The Mon town and monastery council gains a chartered role. Under a federal compact, its terms become part of that compact."
independence_wave_iax_focus_place_river_works_under_the_office: "Place River Works under the Office"
independence_wave_iax_focus_place_river_works_under_the_office_desc: "Give the Moulmein office authority to direct river and port administration. With the school trust, Salween works and frontier watch established, it can commission a paid river-services program."
independence_wave_iax_focus_place_river_works_under_the_office_effect_tt: "The Moulmein River Office gains authority to coordinate administration. Under a federal compact, its terms become part of that compact. An independent office can commission river services after the school, transport and frontier preparations are complete."
independence_wave_iax_focus_expand_mon_language_schools: "Expand Mon-Language Schools"
independence_wave_iax_focus_expand_mon_language_schools_desc: "Support Mon-language teaching through the schools and monasteries that sustain the community's written traditions."
independence_wave_iax_focus_expand_mon_language_schools_effect_tt: "The Mon Language School Trust improves research capacity."
independence_wave_iax_focus_authorize_salween_transport: "Authorize Salween Transport Works"
independence_wave_iax_focus_authorize_salween_transport_desc: "Prepare a costed route connecting Moulmein's port, market roads and the Salween corridor."
independence_wave_iax_focus_authorize_salween_transport_effect_tt: "A paid transport project becomes available in Mon State's capital."
independence_wave_iax_focus_prepare_tenasserim_border_watch: "Prepare the Tenasserim Border Watch"
independence_wave_iax_focus_prepare_tenasserim_border_watch_desc: "Organize a local defense along the approaches between Mon communities, Burma and Siam."
independence_wave_iax_focus_prepare_tenasserim_border_watch_effect_tt: "A paid border-watch project becomes available in Mon State's capital."
independence_wave_iax_focus_exchange_school_delegates: "Exchange School Delegates"
independence_wave_iax_focus_exchange_school_delegates_desc: "Prepare school visits to Burma and Siam to share teaching methods and strengthen ties with both neighbors."
independence_wave_iax_focus_exchange_school_delegates_effect_tt: "Unlocks the paid school delegation to Burma and Siam while both exist and neither is at war with Mon."
independence_wave_iax_focus_publish_mon_federal_autonomy: "Publish Mon Federal Autonomy"
independence_wave_iax_focus_publish_mon_federal_autonomy_desc: "Publish the local charter and protect the council's authority over Mon-language schools and community affairs."
independence_wave_iax_focus_publish_mon_federal_autonomy_effect_tt: "Raises legitimacy, recognition and administrative capacity, and reduces internal instability."
independence_wave_iax_focus_offer_the_mainland_federal_compact: "Offer the Mainland Federal Compact"
independence_wave_iax_focus_offer_the_mainland_federal_compact_desc: "Invite willing mainland partners to a compact that preserves each member's territory and government."
independence_wave_iax_focus_offer_the_mainland_federal_compact_effect_tt: "Opens the shared mainland-federation invitation and consent process."
independence_wave_dsx_signature_route_choice_tt: "Choose an institutional route before Oyo's power struggle is settled, or follow the crown, council or compromise settlement already reached."
independence_wave_dsx_signature_alaafin_route_tt: "Adopt the Alaafin's Charter to commission the horse guard."
independence_wave_dsx_signature_mesi_route_tt: "Adopt the Oyo Mesi mandate to register the town guard."
independence_wave_dsx_signature_town_route_tt: "Choose the Yoruba town federation and reconcile Ibadan's terms."
independence_wave_dsx_signature_settlement_complete_tt: "Complete one of the three institutional settlements first."
independence_wave_dsx_signature_congress_ready_tt: "Complete an institutional settlement and reach the conditions for regional ambition."
independence_wave_dsx_signature_compact_ready_tt: "Finish the market roads and authorize the Yoruba congress."
independence_wave_atj_signature_route_choice_tt: "Choose an institutional route before Aceh's power struggle is settled, or follow the district, ulama or compromise settlement already reached."
independence_wave_atj_signature_district_route_tt: "Choose Uleebalang district authority to confirm its guarantees."
independence_wave_atj_signature_school_route_tt: "Choose the ulama school board to seat it."
independence_wave_atj_signature_shared_route_tt: "Choose the shared district and school council to ratify it."
independence_wave_atj_signature_settlement_complete_tt: "Complete one of Aceh's institutional settlements first."
independence_wave_atj_signature_school_network_ready_tt: "Extend the Reform-School Network before chartering the port board."
independence_wave_iax_signature_route_choice_tt: "Choose a governing route before Mon's power struggle is settled. A central settlement requires the river office, while a local or compromise settlement allows the local councils."
independence_wave_iax_signature_local_route_required_tt: "Choose the local councils to guarantee their charter."
independence_wave_iax_signature_river_route_required_tt: "Choose the central Moulmein office to place river works under its authority."
independence_wave_iax_signature_settlement_complete_tt: "Complete either the local charter or the river office settlement first."
independence_wave_iax_signature_projects_ready_tt: "Complete the Mon-language school network before authorizing these projects."
independence_wave_iax_signature_delegates_ready_tt: "Mon must have the Mon Language School Trust. Burma and Siam must both exist, and neither may be at war with Mon."
independence_wave_iax_signature_autonomy_ready_tt: "Complete the local charter, transport works and border watch before publishing autonomy."
independence_wave_iax_signature_school_delegates: "Fund the Mon School Delegation"
independence_wave_iax_signature_school_delegates_desc: "Fund school visits to Burma and Siam while both countries exist and neither is at war with Mon."
independence_wave_iax_signature_school_delegates_effect_tt: "Improves relations in both directions between Mon and each of Burma and Siam for a limited time."
independence_wave_iax_signature_school_delegates_cancelled_tt: "The delegation stops if Mon loses its capital or governing settlement, its school trust closes, either neighbor disappears, or Mon goes to war with either. Resources already spent are not refunded."
independence_wave_dsx_signature_project_cancelled_tt: "The road project stops if Oyo loses its capital or governing settlement, or the state can no longer receive the infrastructure. Resources already spent are not refunded."
independence_wave_iax_signature_project_cancelled_tt: "The project stops if Mon loses its capital or governing settlement, or the works can no longer be built. Resources already spent are not refunded."
independence_wave_atj_signature_project_cancelled_tt: "The project stops if Aceh loses its capital or governing settlement, or its school or port requirements cease to hold. Resources already spent are not refunded."

# Compact signature-project prices and temporary factory commitments.
independence_wave_dsx_signature_roads_project_ready_tt: "Oyo must retain its capital and governing institutions. The market roads must be authorized, unfinished and able to add infrastructure in the capital state."
independence_wave_atj_signature_pusa_project_ready_tt: "Aceh must retain its capital and governing institutions, extend its reform-school network and reach 5 May 1939. PUSA must not already be organized."
independence_wave_atj_signature_port_project_ready_tt: "Aceh must retain its capital and pepper-port trade, complete an institutional settlement and charter the port board. It must control Banda Aceh, whose harbor can receive another naval-base level, and have neither an outstanding nor a repaid Penang advance."
independence_wave_atj_signature_retirement_project_ready_tt: "Aceh must retain its capital and governing institutions, with Penang Merchant Credit still active and the advance unpaid."
independence_wave_iax_signature_transport_project_ready_tt: "Mon must retain its capital and governing institutions. The Salween works must be authorized, unfinished and able to add infrastructure in the capital state."
independence_wave_iax_signature_border_project_ready_tt: "Mon must retain its capital and governing institutions, authorize the unfinished border watch and control its Tenasserim frontier province, where another land fort level can be built."
independence_wave_iax_signature_delegate_project_ready_tt: "Mon must retain its capital and school trust, complete either institutional charter and authorize its unfinished delegation. Burma and Siam must both exist and neither may be at war with Mon."
independence_wave_atj_signature_district_terms_ready_tt: "Aceh must own and control its capital and have completed the notables' council, madrasah and pepper-port projects. Uleebalang district guarantees must be chosen and still await confirmation."
independence_wave_atj_signature_school_board_ready_tt: "Aceh must own and control its capital and have completed the notables' council, madrasah and pepper-port projects. The ulama school board must be chosen and still await seating."
independence_wave_atj_signature_shared_council_ready_tt: "Aceh must own and control its capital and have completed the notables' council, madrasah and pepper-port projects. The shared district and school council must be chosen and still await ratification."
