# Paid river services and PUSA practical education.
independence_wave_iax_signature_commission_river_services: "Commission the Mon River Services"
independence_wave_iax_signature_commission_river_services_desc: "Bring the Mon school trust, Salween transport works and Tenasserim frontier staff into a domestic service administration. The Moulmein River Office must remain in place throughout the project."
independence_wave_iax_signature_river_services_ready_tt: "Mon must retain its own controlled capital, the Moulmein River Office and school trust, complete the river charter, Salween transport works and Tenasserim border watch, and have no commissioned river services in this period of independence."
independence_wave_iax_signature_commission_river_services_effect_tt: "Replaces the Moulmein River Office with the Mon River Service Administration. Legitimacy +[?constant:independence_wave_value.minor_gain|0], administrative capacity +[?constant:independence_wave_value.major_gain|0], internal instability [?constant:independence_wave_value.minor_loss|0]."
independence_wave_iax_signature_river_services_cancelled_tt: "The project stops if Mon loses its capital, river-office settlement or required institutions. A federal charter replacing the river office also ends the project. Resources already spent are not refunded."
independence_wave_iax_river_service_administration: "Mon River Service Administration"
independence_wave_iax_river_service_administration_desc: "Teachers, river communities, transport workers and frontier staff administer common services through Moulmein while preserving the communities they serve."
independence_wave_atj_pusa_education_bonus: "PUSA Practical Education"
