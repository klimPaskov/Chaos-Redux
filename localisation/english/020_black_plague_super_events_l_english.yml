l_english:
chaosx_super_event.85.t: "THE CROWN BENEATH"
chaosx_super_event.85.q: "\"And out of the houses the rats came tumbling.\"\n- Robert Browning"
chaosx_super_event.85.a: "Sic transit gloria mundi."
chaosx_super_event.85.d: "In the Royal Basin, the broods have learned to kneel. A single sentient sovereign now binds hunger, memory, and plague into one command."
chaosx_super_event.86.t: "THE KINGDOM OF TEETH"
chaosx_super_event.86.q: "\"And I looked, and behold a pale horse: and his name that sat on him was Death.\"\n- Revelation 6:8"
chaosx_super_event.86.a: "A plague o' both houses!"
chaosx_super_event.86.d: "The refuge nodes have fallen, the designated capitals are silent, and the last continental cordons have broken. The Rat King's dominion advances according to a single final design."
chaosx_super_event.87.t: "THE WOUNDS REMAIN"
chaosx_super_event.87.q: "\"In visions of the night, like dropping rain,\nDescend the many memories of pain\"\n- Aeschylus, Agamemnon (trans. E. D. A. Morshead)"
chaosx_super_event.87.a: "Lest we forget."
chaosx_super_event.87.d: "The Rat King's dominion has ended after a catastrophe that crossed continents. The Royal Basin is silent, but hospitals, railways, archives, and emptied towns still bear the plague's mark. Survivors begin the long work of sealing warrens, rebuilding what can be rebuilt, and preserving the memory that victory did not make the world safe."
