l_english:
# Southeast Asia, East Asia and Oceania framework packages.
independence_wave_fux_institution: "Council of the Nagari"
independence_wave_fux_institution_long: "Minangkabau Council of the Nagari"
independence_wave_fxx_institution: "Hadat Council"
independence_wave_fxx_institution_long: "Hadat Council of South Celebes"
independence_wave_gcx_institution: "Federal Council"
independence_wave_gcx_institution_long: "Federal Council of Shan Chiefs"
independence_wave_iax_institution: "Mon Federal Council"
independence_wave_iax_institution_long: "Provisional Mon Federal Council"
independence_wave_ibx_institution: "Duwas' Council"
independence_wave_ibx_institution_long: "Council of the Kachin Duwas"
independence_wave_gmx_institution: "Provisional Council"
independence_wave_gmx_institution_long: "Provisional Council of East Turkestan"

# Aceh
independence_wave_atj_aceh_category: "The Aceh Settlement"
independence_wave_atj_aceh_category_desc: "Aceh governs itself again. The uleebalang chiefs kept their lands by serving the Dutch, while the ulama who led the resistance now run the reform schools."
independence_wave_atj_convene_council_of_notables: "Convene the Council of Notables"
independence_wave_atj_convene_council_of_notables_desc: "Seat the uleebalang, the ulama, the merchants of the ports and the war veterans in one council at Kutaraja."
independence_wave_atj_convene_council_of_notables_tt: "Replaces §YThe Uleebalang and the Ulama§! with §YThe Council of Notables§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_atj_fund_madrasah_reform: "Fund the Madrasah Reform"
independence_wave_atj_fund_madrasah_reform_desc: "Pay for the reformed religious schools that teach arithmetic, geography and Malay beside the Quran, and open them to girls."
independence_wave_atj_fund_madrasah_reform_tt: "Raises §YLegitimacy§! and §YCapacity§!."
independence_wave_atj_reopen_pepper_ports: "Reopen the Pepper Ports"
independence_wave_atj_reopen_pepper_ports_desc: "Open the east coast pepper ports to direct trade with Penang and set Aceh's own export duty."
independence_wave_atj_reopen_pepper_ports_tt: "Adds §YThe Pepper Ports§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_atj_uleebalang_and_ulama: "The Uleebalang and the Ulama"
independence_wave_atj_uleebalang_and_ulama_desc: "The district chiefs and the religious scholars each claim to speak for Aceh, and neither accepts the other's authority."
independence_wave_atj_council_of_notables: "The Council of Notables"
independence_wave_atj_council_of_notables_desc: "Chiefs, scholars, merchants and veterans sit in one council and share the government."
independence_wave_atj_pepper_ports: "The Pepper Ports"
independence_wave_atj_pepper_ports_desc: "Aceh's pepper ports trade directly with Penang under their own duties."
independence_wave_atj_notables_convened: "The Council of Notables has been convened"

# Minangkabau
independence_wave_fux_minangkabau_category: "The Minangkabau Council"
independence_wave_fux_minangkabau_category_desc: "Minangkabau governs itself again. Adat chiefs and reforming scholars argue over custom and religion, and the Ombilin coal mines still belong to the old colonial state."
independence_wave_fux_join_adat_and_ulama: "Join Adat and Ulama"
independence_wave_fux_join_adat_and_ulama_desc: "Seat the adat chiefs and the religious scholars together in the council, each with a veto over matters of its own law."
independence_wave_fux_join_adat_and_ulama_tt: "Replaces §YAdat and the Reformers§! with §YThe Council of Adat and Ulama§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_fux_charter_thawalib_schools: "Charter the Thawalib Schools"
independence_wave_fux_charter_thawalib_schools_desc: "Give the Sumatra Thawalib schools of Padang Panjang a state charter and a grant for new branches in every district."
independence_wave_fux_charter_thawalib_schools_tt: "Adds §YThe Thawalib Schools§!, raises §YLegitimacy§! and raises §YCapacity§!."
independence_wave_fux_take_over_ombilin_mines: "Take Over the Ombilin Mines"
independence_wave_fux_take_over_ombilin_mines_desc: "Bring the coal mines at Sawahlunto and their railway to Emmahaven under the council's own management."
independence_wave_fux_take_over_ombilin_mines_tt: "Adds §YThe Ombilin Coal Mines§!, raises §YCapacity§! and lowers §YRecognition§!."
independence_wave_fux_adat_and_reformers: "Adat and the Reformers"
independence_wave_fux_adat_and_reformers_desc: "The adat chiefs defend the old matrilineal custom, and the young reformers demand that religion and schooling come first."
independence_wave_fux_adat_and_ulama_council: "The Council of Adat and Ulama"
independence_wave_fux_adat_and_ulama_council_desc: "Custom and religion each have their own voice in the council, and neither can overrule the other alone."
independence_wave_fux_thawalib_schools: "The Thawalib Schools"
independence_wave_fux_thawalib_schools_desc: "Chartered reform schools teach religion, science and languages in every district."
independence_wave_fux_ombilin_mines: "The Ombilin Coal Mines"
independence_wave_fux_ombilin_mines_desc: "The Sawahlunto coal mines fuel the railway and the workshops of the highlands."
independence_wave_fux_council_joined: "Adat and ulama sit in one council"

# Bali
independence_wave_bli_bali_category: "The Paruman Agung"
independence_wave_bli_bali_category_desc: "Bali governs itself under the Dewa Agung of Klungkung. Eight kingdoms keep their own rajas and courts, and the subak societies share out the irrigation water."
independence_wave_bli_convene_paruman_agung: "Convene the Paruman Agung"
independence_wave_bli_convene_paruman_agung_desc: "Call the rajas of the eight kingdoms to sit together as the Paruman Agung, the council of the island, under the Dewa Agung."
independence_wave_bli_convene_paruman_agung_tt: "Replaces §YThe Eight Kingdoms§! with §YThe Paruman Agung§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_bli_restore_subak_courts: "Restore the Subak Courts"
independence_wave_bli_restore_subak_courts_desc: "Let the subak irrigation societies judge their own water disputes again, with appeal to the Paruman Agung."
independence_wave_bli_restore_subak_courts_tt: "Adds §YThe Subak Courts§!, raises §YLegitimacy§! and raises §YCapacity§!."
independence_wave_bli_open_island_steamers: "Open the Island Steamers"
independence_wave_bli_open_island_steamers_desc: "License steamer services from Buleleng and Padang Bai to Java and Singapore under Bali's own harbor dues."
independence_wave_bli_open_island_steamers_tt: "Adds §YThe Island Steamers§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_bli_eight_kingdoms: "The Eight Kingdoms"
independence_wave_bli_eight_kingdoms_desc: "Each of Bali's eight kingdoms keeps its own raja, court and revenue."
independence_wave_bli_paruman_agung: "The Paruman Agung"
independence_wave_bli_paruman_agung_desc: "The rajas of the eight kingdoms sit together as the council of the island."
independence_wave_bli_subak_courts: "The Subak Courts"
independence_wave_bli_subak_courts_desc: "The irrigation societies share out the water and judge their own disputes."
independence_wave_bli_island_steamers: "The Island Steamers"
independence_wave_bli_island_steamers_desc: "Steamers link Bali's harbors to Java and Singapore under the island's own dues."
independence_wave_bli_paruman_convened: "The Paruman Agung has been convened"

# Shan federation
independence_wave_gcx_shan_category: "The Federated Shan States"
independence_wave_gcx_shan_category_desc: "The Shan States govern themselves again. Each sawbwa rules his own state, and the Federal Council has never managed more than a common budget."
independence_wave_gcx_bind_federal_council: "Bind the Federal Council"
independence_wave_gcx_bind_federal_council_desc: "Give the Federal Council of Shan Chiefs authority over roads, police and revenue in every state, with a seat for each sawbwa."
independence_wave_gcx_bind_federal_council_tt: "Replaces §YThe Sawbwa States§! with §YThe Federated Shan States§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_gcx_extend_lashio_railway: "Extend the Lashio Railway"
independence_wave_gcx_extend_lashio_railway_desc: "Carry the railway beyond Lashio toward the Salween crossings and the eastern states."
independence_wave_gcx_extend_lashio_railway_tt: "Raises §YCapacity§! and §YRecognition§!."
independence_wave_gcx_regulate_bawdwin_mines: "Regulate the Bawdwin Mines"
independence_wave_gcx_regulate_bawdwin_mines_desc: "Take a federal share of the silver, lead and zinc from the Bawdwin mines and the Namtu smelter."
independence_wave_gcx_regulate_bawdwin_mines_tt: "Adds §YThe Bawdwin Mines§!, raises §YCapacity§! and lowers §YRecognition§!."
independence_wave_gcx_sawbwa_states: "The Sawbwa States"
independence_wave_gcx_sawbwa_states_desc: "Each sawbwa rules his own state, and the federation has no police or revenue of its own."
independence_wave_gcx_federated_states: "The Federated Shan States"
independence_wave_gcx_federated_states_desc: "The Federal Council governs roads, police and revenue for every state, and each sawbwa holds a seat in it."
independence_wave_gcx_bawdwin_mines: "The Bawdwin Mines"
independence_wave_gcx_bawdwin_mines_desc: "The federation takes its share of the silver, lead and zinc of Bawdwin."
independence_wave_gcx_council_bound: "The Federal Council has been given authority over the states"

# Mon State
independence_wave_iax_mon_category: "The Mon Council"
independence_wave_iax_mon_category_desc: "The Mon country governs itself again. Monasteries keep the Mon language alive but few schools teach it, and Moulmein's timber and rice trade answers to outside firms."
independence_wave_iax_seat_council_at_moulmein: "Seat the Council at Moulmein"
independence_wave_iax_seat_council_at_moulmein_desc: "Seat the Provisional Mon Federal Council at Moulmein with members from the monasteries, the cultural associations and the towns of Tenasserim."
independence_wave_iax_seat_council_at_moulmein_tt: "Adds §YThe Mon Federal Council§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_iax_open_mon_schools: "Open Mon Language Schools"
independence_wave_iax_open_mon_schools_desc: "Fund schools that teach in Mon in every township, with the monastery teachers paid by the council."
independence_wave_iax_open_mon_schools_tt: "Replaces §YA Language Without Schools§! with §YThe Mon Schools§!, raises §YLegitimacy§! and raises §YCapacity§!."
independence_wave_iax_reopen_moulmein_port: "Reopen the Moulmein Port"
independence_wave_iax_reopen_moulmein_port_desc: "Set Moulmein's own harbor dues and timber royalties, and invite buyers from Penang and Calcutta."
independence_wave_iax_reopen_moulmein_port_tt: "Adds §YThe Moulmein Port§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_iax_language_without_schools: "A Language Without Schools"
independence_wave_iax_language_without_schools_desc: "Only the monasteries teach Mon, and most children learn in other languages."
independence_wave_iax_federal_council: "The Mon Federal Council"
independence_wave_iax_federal_council_desc: "Monks, cultural associations and town notables sit in one council at Moulmein."
independence_wave_iax_mon_schools: "The Mon Schools"
independence_wave_iax_mon_schools_desc: "Every township has a school that teaches in Mon."
independence_wave_iax_moulmein_port: "The Moulmein Port"
independence_wave_iax_moulmein_port_desc: "Moulmein exports its timber and rice under its own dues."
independence_wave_iax_council_seated: "The Mon Federal Council has been seated"

# Kachin state
independence_wave_ibx_kachin_category: "The Kachin Council"
independence_wave_ibx_kachin_category_desc: "The Kachin hills govern themselves again. The hereditary duwas have never answered to a government in the plains, and the Hpakant jade mines are the hills' main wealth."
independence_wave_ibx_convene_duwas_at_myitkyina: "Convene the Duwas at Myitkyina"
independence_wave_ibx_convene_duwas_at_myitkyina_desc: "Call the duwas of the hill tracts and the headmen of the plains villages to one council at Myitkyina."
independence_wave_ibx_convene_duwas_at_myitkyina_tt: "Replaces §YThe Hills and the Plains§! with §YThe Duwas' Council§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_ibx_raise_kachin_levies: "Raise the Kachin Levies"
independence_wave_ibx_raise_kachin_levies_desc: "Form hill companies from the Kachin veterans of the old Burma Rifles."
independence_wave_ibx_raise_kachin_levies_tt: "Adds §YThe Kachin Levies§! and raises §YSecurity§!."
independence_wave_ibx_open_jade_mines_road: "Open the Jade Mines Road"
independence_wave_ibx_open_jade_mines_road_desc: "Build a cart road from Mogaung to the jade mines at Hpakant and post the council's officers at the mines."
independence_wave_ibx_open_jade_mines_road_tt: "Raises §YCapacity§! and §YRecognition§!."
independence_wave_ibx_hills_and_plains: "The Hills and the Plains"
independence_wave_ibx_hills_and_plains_desc: "The hill villages follow their duwas and the plains villages their headmen, and neither accepts the other's rule."
independence_wave_ibx_duwas_council: "The Duwas' Council"
independence_wave_ibx_duwas_council_desc: "Hill chiefs and plains headmen sit together in one council at Myitkyina."
independence_wave_ibx_kachin_levies: "The Kachin Levies"
independence_wave_ibx_kachin_levies_desc: "Hill companies of Kachin veterans guard the passes and the jade roads."
independence_wave_ibx_duwas_convened: "The duwas have met at Myitkyina"

# Laos
independence_wave_lao_laos_category: "The Lao Kingdom"
independence_wave_lao_laos_category_desc: "Laos governs itself under the King of Luang Prabang. The north and the Champasak provinces have long been ruled apart, and the Mekong is the only highway."
independence_wave_lao_unite_provinces_under_crown: "Unite the Provinces under the Crown"
independence_wave_lao_unite_provinces_under_crown_desc: "Bring the central and southern provinces under the King of Luang Prabang, with a royal council that seats the house of Champasak."
independence_wave_lao_unite_provinces_under_crown_tt: "Replaces §YThe Kingdom and the South§! with §YThe Royal Council§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_lao_open_mekong_route: "Open the Mekong Route"
independence_wave_lao_open_mekong_route_desc: "Clear the Khone rapids portage, license river steamers and settle the Mekong duties with Siam."
independence_wave_lao_open_mekong_route_tt: "Adds §YThe Mekong Route§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_lao_fund_buddhist_institute: "Fund the Buddhist Institute"
independence_wave_lao_fund_buddhist_institute_desc: "Endow the Buddhist Institute in Vientiane and its Pali schools so that monks and officials learn to read and write Lao."
independence_wave_lao_fund_buddhist_institute_tt: "Raises §YLegitimacy§! and §YCapacity§!."
independence_wave_lao_kingdom_and_south: "The Kingdom and the South"
independence_wave_lao_kingdom_and_south_desc: "The royal court at Luang Prabang and the southern provinces have long been governed apart."
independence_wave_lao_royal_council: "The Royal Council"
independence_wave_lao_royal_council_desc: "A royal council seats the northern court and the house of Champasak together."
independence_wave_lao_mekong_route: "The Mekong Route"
independence_wave_lao_mekong_route_desc: "Steamers and portages carry Lao trade down the Mekong under Lao duties."
independence_wave_lao_provinces_united: "The provinces have been united under the crown"

# East Turkestan
independence_wave_gmx_turkestan_category: "The Oasis Assembly"
independence_wave_gmx_turkestan_category_desc: "East Turkestan governs itself again. Each oasis town has its own governor and notables, and the memory of the risings at Hami and Kashgar is recent."
independence_wave_gmx_convene_oasis_delegates: "Convene the Oasis Delegates"
independence_wave_gmx_convene_oasis_delegates_desc: "Call delegates from Kashgar, Yarkand, Khotan, Aksu, Turpan and Hami to one assembly with seats for every community."
independence_wave_gmx_convene_oasis_delegates_tt: "Replaces §YThe Oasis Governors§! with §YThe Oasis Assembly§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_gmx_reopen_caravan_roads: "Reopen the Caravan Roads"
independence_wave_gmx_reopen_caravan_roads_desc: "Post guards at the caravanserais and reopen the roads over the passes to Osh, Leh and Gilgit."
independence_wave_gmx_reopen_caravan_roads_tt: "Adds §YThe Caravan Roads§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_gmx_raise_oasis_guards: "Raise the Oasis Guards"
independence_wave_gmx_raise_oasis_guards_desc: "Form a guard in every oasis under officers answerable to the assembly."
independence_wave_gmx_raise_oasis_guards_tt: "Adds §YThe Oasis Guards§! and raises §YSecurity§!."
independence_wave_gmx_oasis_governors: "The Oasis Governors"
independence_wave_gmx_oasis_governors_desc: "Each oasis governor collects his own taxes and commands his own men."
independence_wave_gmx_oasis_assembly: "The Oasis Assembly"
independence_wave_gmx_oasis_assembly_desc: "Delegates from every oasis and community sit in one assembly."
independence_wave_gmx_caravan_roads: "The Caravan Roads"
independence_wave_gmx_caravan_roads_desc: "Guarded roads carry the caravans over the passes to the west and the south."
independence_wave_gmx_oasis_guards: "The Oasis Guards"
independence_wave_gmx_oasis_guards_desc: "Every oasis has a guard under officers answerable to the assembly."
independence_wave_gmx_delegates_convened: "The oasis delegates have been convened"

# Inner Mongolia
independence_wave_men_mongol_category: "The Mongol Autonomy Council"
independence_wave_men_mongol_category_desc: "Inner Mongolia governs itself again. The banner princes rule the pastures as before, but settlers from the south have plowed much of the grassland."
independence_wave_men_convene_autonomy_council: "Convene the Autonomy Council"
independence_wave_men_convene_autonomy_council_desc: "Call the princes of the leagues and banners to sit with elected members as the Mongol Autonomy Council."
independence_wave_men_convene_autonomy_council_tt: "Adds §YThe Mongol Autonomy Council§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_men_settle_banner_pastures: "Settle the Banner Pastures"
independence_wave_men_settle_banner_pastures_desc: "Mark the boundary between the farmland and the pastures, confirm the settled farmers' fields and close the remaining grassland to the plow."
independence_wave_men_settle_banner_pastures_tt: "Removes §YBanners and Settlers§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_men_raise_banner_cavalry: "Raise the Banner Cavalry"
independence_wave_men_raise_banner_cavalry_desc: "Call up a mounted regiment from every banner under the council's command."
independence_wave_men_raise_banner_cavalry_tt: "Adds §YThe Banner Cavalry§! and raises §YSecurity§!."
independence_wave_men_banners_and_settlers: "Banners and Settlers"
independence_wave_men_banners_and_settlers_desc: "Settled farmers keep plowing the banner pastures, and the herders have nowhere left to move their flocks."
independence_wave_men_autonomy_council: "The Mongol Autonomy Council"
independence_wave_men_autonomy_council_desc: "Princes and elected members govern the leagues and banners together."
independence_wave_men_banner_cavalry: "The Banner Cavalry"
independence_wave_men_banner_cavalry_desc: "Every banner sends a mounted regiment to the council's army."
independence_wave_men_council_convened: "The Mongol Autonomy Council has been convened"

# Ryukyu
independence_wave_okn_ryukyu_category: "The Ryukyu Assembly"
independence_wave_okn_ryukyu_category_desc: "The Ryukyu Islands govern themselves again. The sugar crash left families eating poisonous cycad to survive, and emigrants' remittances keep many villages alive."
independence_wave_okn_seat_assembly_at_shuri: "Seat the Assembly at Shuri"
independence_wave_okn_seat_assembly_at_shuri_desc: "Open an elected assembly at Shuri with members from every island, with the head of the House of Sho as its patron."
independence_wave_okn_seat_assembly_at_shuri_tt: "Adds §YThe Ryukyu Assembly§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_okn_relieve_sugar_debts: "Relieve the Sugar Debts"
independence_wave_okn_relieve_sugar_debts_desc: "Buy up the farmers' debts to the sugar merchants and set a guaranteed price for cane."
independence_wave_okn_relieve_sugar_debts_tt: "Removes §YThe Cycad Years§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_okn_open_emigrant_bank: "Open the Emigrant Bank"
independence_wave_okn_open_emigrant_bank_desc: "Found a bank at Naha that receives the emigrants' remittances from Hawaii, Brazil and Peru without the brokers' charges."
independence_wave_okn_open_emigrant_bank_tt: "Adds §YThe Emigrant Remittances§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_okn_cycad_hell: "The Cycad Years"
independence_wave_okn_cycad_hell_desc: "The sugar price has collapsed, the farmers are in debt, and in bad years families live on the cycad palm."
independence_wave_okn_ryukyu_assembly: "The Ryukyu Assembly"
independence_wave_okn_ryukyu_assembly_desc: "Members from every island sit in an elected assembly at Shuri."
independence_wave_okn_emigrant_remittances: "The Emigrant Remittances"
independence_wave_okn_emigrant_remittances_desc: "The emigrants' savings reach their families through the islands' own bank."
independence_wave_okn_assembly_seated: "The Ryukyu Assembly has been seated"

# Samoa
independence_wave_sam_samoa_category: "The Fono of Faipule"
independence_wave_sam_samoa_category_desc: "Samoa governs itself again. After years of peaceful Mau defiance, the matai hold the land and titles, and the old German plantations are still run as state estates."
independence_wave_sam_convene_fono_of_faipule: "Convene the Fono of Faipule"
independence_wave_sam_convene_fono_of_faipule_desc: "Call the district representatives chosen by the matai to sit as the Fono of Faipule, with the leaders of the Mau among them."
independence_wave_sam_convene_fono_of_faipule_tt: "Replaces §YThe Mau and the Administration§! with §YThe Fono of Faipule§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_sam_return_reparation_estates: "Return the Reparation Estates"
independence_wave_sam_return_reparation_estates_desc: "Hand the plantations taken from the German owners in the war to Samoan villages and cooperatives."
independence_wave_sam_return_reparation_estates_tt: "Raises §YLegitimacy§! and §YCapacity§!."
independence_wave_sam_open_apia_copra_market: "Open the Apia Copra Market"
independence_wave_sam_open_apia_copra_market_desc: "Let Samoan growers sell their copra and cocoa at an open market in Apia instead of through the trading firms."
independence_wave_sam_open_apia_copra_market_tt: "Adds §YThe Apia Copra Market§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_sam_mau_and_administration: "The Mau and the Administration"
independence_wave_sam_mau_and_administration_desc: "Many villages still follow the Mau and refuse to deal with officials they did not choose."
independence_wave_sam_fono_of_faipule: "The Fono of Faipule"
independence_wave_sam_fono_of_faipule_desc: "Representatives chosen by the matai advise the government, and the Mau sits among them."
independence_wave_sam_apia_copra_market: "The Apia Copra Market"
independence_wave_sam_apia_copra_market_desc: "Samoan growers sell their copra and cocoa at an open market in Apia."
independence_wave_sam_fono_convened: "The Fono of Faipule has been convened"

# Incidents
chaosx.nr6.250.t: "Veterans of the Long War"
chaosx.nr6.250.d: "Old fighters of the war against the Dutch, which lasted from 1873 into this century, ask for pensions and a place of honor. Some of their bands still keep their rifles."
chaosx.nr6.250.a: "Pension the veterans"
chaosx.nr6.250.b: "Disband the old bands"
chaosx.nr6.251.t: "The Penang Buyers"
chaosx.nr6.251.d: "The pepper buyers of Penang have cut their price. The ministry can force a sale through the state warehouses or hold the harvest and look for buyers elsewhere."
chaosx.nr6.251.a: "Sell through the state warehouses"
chaosx.nr6.251.b: "Hold the harvest for other buyers"
chaosx.nr6.252.t: "The Merantau"
chaosx.nr6.252.d: "Young men are leaving the villages on merantau, as custom expects, to trade and study in Java and Malaya. The council could keep them home with new schools or tax what they send back."
chaosx.nr6.252.a: "Build schools at home"
chaosx.nr6.252.b: "Tax the remittances"
chaosx.nr6.253.t: "The Inheritance Case"
chaosx.nr6.253.d: "A dispute over a dead merchant's property has reached the council. Under adat it passes to his sister's children, but under religious law it passes to his own."
chaosx.nr6.253.a: "Uphold the adat inheritance"
chaosx.nr6.253.b: "Let families choose the law"
chaosx.nr6.254.t: "The Royal Cremation"
chaosx.nr6.254.d: "A raja of one of the eight kingdoms has died. His court wants a great cremation with a tower of many tiers, as befits his rank."
chaosx.nr6.254.a: "Fund the royal cremation"
chaosx.nr6.254.b: "Hold a modest ceremony"
chaosx.nr6.255.t: "The Painters of Ubud"
chaosx.nr6.255.d: "The painters and carvers of Ubud have formed a cooperative to sell their work abroad at fair prices. The art dealers of Denpasar want the trade left to them."
chaosx.nr6.255.a: "Support the cooperative"
chaosx.nr6.255.b: "Tax the art dealers"
chaosx.nr6.256.t: "The Poppy Fields"
chaosx.nr6.256.d: "Several eastern states grow opium poppy, and their sawbwas want the trade licensed and taxed. Neighboring governments want it stopped."
chaosx.nr6.256.a: "License and tax the poppy"
chaosx.nr6.256.b: "Suppress the poppy trade"
chaosx.nr6.257.t: "A Disputed Succession"
chaosx.nr6.257.d: "Two kinsmen of a dead sawbwa both claim his state, and each has armed followers."
chaosx.nr6.257.a: "Let the Federal Council decide"
chaosx.nr6.257.b: "Back the senior claimant with troops"
chaosx.nr6.258.t: "The Monastery Lands"
chaosx.nr6.258.d: "The great monasteries hold rice land free of tax. The treasury wants a share of their harvest to pay for the new schools."
chaosx.nr6.258.a: "Confirm the monasteries' lands"
chaosx.nr6.258.b: "Tax the monastery estates"
chaosx.nr6.259.t: "The Tavoy Tin Mines"
chaosx.nr6.259.d: "The tin and wolfram mines south of Tavoy are worked under foreign leases. The council can take a state share or renew the leases."
chaosx.nr6.259.a: "Take a state share"
chaosx.nr6.259.b: "Renew the leases"
chaosx.nr6.260.t: "The Jade Traders"
chaosx.nr6.260.d: "Jade traders from Yunnan buy raw stones at the Hpakant mines. The council can tax the stones at Mogaung or keep the trade free."
chaosx.nr6.260.a: "Tax the jade at Mogaung"
chaosx.nr6.260.b: "Keep the jade trade free"
chaosx.nr6.261.t: "The Mission Schools"
chaosx.nr6.261.d: "The mission schools teach in Jinghpaw and run most of the hills' classrooms. Some duwas want the council to run the schools itself."
chaosx.nr6.261.a: "Bring the schools under the council"
chaosx.nr6.261.b: "Leave the schools to the missions"
chaosx.nr6.262.t: "The Clerks of the Administration"
chaosx.nr6.262.d: "Most of the clerks in the government offices were trained elsewhere in Indochina. Lao officials want the posts for Lao graduates."
chaosx.nr6.262.a: "Train Lao officials"
chaosx.nr6.262.b: "Keep the experienced clerks"
chaosx.nr6.263.t: "The That Luang Festival"
chaosx.nr6.263.d: "The November festival at the great stupa of That Luang draws pilgrims from every province. The court asks for funds to hold it on a royal scale."
chaosx.nr6.263.a: "Fund a royal festival"
chaosx.nr6.263.b: "Leave it to the monasteries"
chaosx.nr6.264.t: "The Soviet Trade Agreement"
chaosx.nr6.264.d: "The Soviet trade agency offers to buy the oases' wool, cotton and hides at fixed prices. The merchants who trade with India want the southern roads kept open instead."
chaosx.nr6.264.a: "Sign the trade agreement"
chaosx.nr6.264.b: "Keep trading with India"
chaosx.nr6.265.t: "The Hami Grievances"
chaosx.nr6.265.d: "The farmers of Hami say their land was taken and their taxes doubled when the old khanate was abolished. They ask the assembly to restore what was lost."
chaosx.nr6.265.a: "Restore the Hami lands"
chaosx.nr6.265.b: "Keep the new tax rolls"
chaosx.nr6.266.t: "The Wool Buyers of Kalgan"
chaosx.nr6.266.d: "The merchant houses of Kalgan pay the herders in goods at prices they set themselves. The council can set a fair price or keep the trade with the houses."
chaosx.nr6.266.a: "Set a fair wool price"
chaosx.nr6.266.b: "Sell through the Kalgan houses"
chaosx.nr6.267.t: "Envoys from Ulaanbaatar"
chaosx.nr6.267.d: "Envoys from the Mongolian People's Republic have arrived with offers of trade and friendship. Some princes fear they bring revolution with them."
chaosx.nr6.267.a: "Receive the envoys"
chaosx.nr6.267.b: "Close the border"
chaosx.nr6.268.t: "The Dialect Placards"
chaosx.nr6.268.d: "Schools still hang a placard on any child caught speaking the island languages. Parents and teachers ask the assembly to end the practice."
chaosx.nr6.268.a: "Abolish the placards"
chaosx.nr6.268.b: "Leave the schools as they are"
chaosx.nr6.269.t: "Shuri Castle"
chaosx.nr6.269.d: "The halls of Shuri Castle, seat of the old Ryukyu kings, need restoration. The assembly can pay for the work as a national monument."
chaosx.nr6.269.a: "Restore Shuri Castle"
chaosx.nr6.269.b: "Leave the work for later"
chaosx.nr6.270.t: "The Titles Court"
chaosx.nr6.270.d: "Disputes over matai titles fill the Land and Titles Court. The Fono asks to judge them itself under Samoan custom."
chaosx.nr6.270.a: "Let the Fono judge titles"
chaosx.nr6.270.b: "Keep the Land and Titles Court"
chaosx.nr6.271.t: "The Mau Procession"
chaosx.nr6.271.d: "The Mau plans its yearly procession in Apia to honor those killed when police fired on its march in December 1929."
chaosx.nr6.271.a: "Honor the fallen of 1929"
chaosx.nr6.271.b: "Ban the procession"
