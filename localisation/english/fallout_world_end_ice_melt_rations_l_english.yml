l_english:
  chaosx.fallout.492.t: "Ice Melt Rations"
  chaosx.fallout.492.intro: "The frozen lake above the highland settlement is dusted with ash, and the first thaw has not reached the intake trench. Crews have fuel for one controlled boil, a short stack of cloth and charcoal filters, and a clinic whose lamps must stay lit. The water board can boil and filter the ice, risk untreated meltwater, send a clean-ice expedition, or ration fuel for a guarded night run."
  chaosx.fallout.492.a: "Boil and filter the ice"
  chaosx.fallout.492.a.tt: "Spend Water, Fuel, public Filters, station filter stock, Medicine, and Cohesion to fill the clinic cistern and settlement tanks before the frost closes the trench."
  chaosx.fallout.492.b: "Use the first untreated meltwater"
  chaosx.fallout.492.b.tt: "Spend Water, Fuel, public Filters, station filter stock, Medicine, and Cohesion to bring water to the wards before the filter room is ready."
  chaosx.fallout.492.c: "Send a clean-ice expedition"
  chaosx.fallout.492.c.tt: "Spend Water, Fuel, public Filters, station filter stock, Medicine, and Cohesion to send a crew up the frozen watershed and return with cleaner ice."
  chaosx.fallout.492.d: "Ration fuel for a guarded boil"
  chaosx.fallout.492.d.tt: "Spend Water, Fuel, public Filters, station filter stock, Medicine, and Cohesion to protect the boiler crew and keep a smaller reserve for the next frost."

  chaosx.fallout.494.boil_and_filter.success.d: "The boiler held through the blue dark. Crews chipped ash from the intake, layered fresh charcoal into the filter drums, and filled the clinic cistern before the settlement tanks. The water board has a ledger for another frozen night."
  chaosx.fallout.494.boil_and_filter.partial.d: "The first kettles were clean, but the last filter cloth tore under the ash. The clinic received a measured reserve, while the upper wards queued beside tanks that will not last through another cold snap."
  chaosx.fallout.494.boil_and_filter.failure.d: "The boiler cracked when the frost reached the feed line. Ash entered the clinic cistern, the filter stock was spent, and the settlement began carrying water from a spring that no one has tested."
  chaosx.fallout.494.use_untreated_water.success.d: "The untreated meltwater reached the wards before dawn. The clinic kept its lamps and the water board marked every household that accepted the risk, leaving a public record for the next thaw."
  chaosx.fallout.494.use_untreated_water.partial.d: "The first meltwater kept the clinic open, but the upper wards received only half their allotment. Nurses have started a fever watch, and the board has tied the next ration to the remaining filter cloth."
  chaosx.fallout.494.use_untreated_water.failure.d: "The meltwater carried ash into the lower cistern. Patients were moved to the school shelter, the last clean cloth was cut into masks, and the settlement council blamed the water board for choosing speed."
  chaosx.fallout.494.send_clean_ice_expedition.success.d: "The expedition returned from a shaded ravine with clear ice packed beneath canvas. A fuel sled kept the clinic boiler warm, and the watershed crew now holds a written right to inspect the upper snowline."
  chaosx.fallout.494.send_clean_ice_expedition.partial.d: "The expedition found cleaner ice but lost a sled on the blue slope. The clinic has water for three days, while the board must decide whether the next crew carries medicine or another filter drum."
  chaosx.fallout.494.send_clean_ice_expedition.failure.d: "No clean ice came back from the ravine. The expedition left a broken radio and two empty fuel cans behind, and the settlement has to choose between the ash pond and a guarded well."
  chaosx.fallout.494.ration_fuel_for_boil.success.d: "The guarded boil ran slowly and stayed clean. Fuel was counted by lamp, filters were hung above the boiler, and the clinic received enough water to keep the frost ward open."
  chaosx.fallout.494.ration_fuel_for_boil.partial.d: "The gate guards protected the boiler, but the fuel ration ended before the upper tanks were filled. The central district has water, while outlying households trade shelter shifts for every bucket."
  chaosx.fallout.494.ration_fuel_for_boil.failure.d: "The fuel ration became a fight at the boiler gate. A filter drum was overturned, the clinic lost pressure, and the council has to repair trust before it can ask for another night shift."
  chaosx.fallout.494.a: "Queue the frost review"
  chaosx.fallout.494.a.tt: "Record the delayed ice-melt result and return for a later review of the water board's reserve."

  chaosx.fallout.496.t: "The Ice Ledger Review"
  chaosx.fallout.496.success.d: "The review arrives after the next winter turn. The clean-ice crew has marked a safer ravine, the filter room has a reserve again, and the clinic can train a second shift without emptying the settlement tanks."
  chaosx.fallout.496.partial.d: "The review restores the central tanks, but the upper wards still count every filter cloth. A thaw route is open for careful crews, and the water board must settle which households receive the first clear melt."
  chaosx.fallout.496.failure.d: "The review closes with the lake still sealed. The last boiler crew has left for the school shelter, the filter ledger is in dispute, and the next thaw will begin under a government that no longer trusts its own water marks."
  chaosx.fallout.496.a: "Close the ice ledger"
  chaosx.fallout.496.a.tt: "Close the delayed review and preserve its fuel, water, filter, expedition, and winter memory."

  fallout.event_log.ice_melt_rations.name: "Ice Melt Rations"
  fallout.event_log.ice_melt_rations.detail: "[GetFalloutEvent492EventLogDetail]"
  fallout.event_log.ice_melt_rations.boil_and_filter_success: "A controlled boil filled the clinic cistern and restored a frozen-night water ledger."
  fallout.event_log.ice_melt_rations.boil_and_filter_partial: "Clean kettles reached the clinic, but torn filter cloth left the upper wards waiting."
  fallout.event_log.ice_melt_rations.boil_and_filter_failure: "A cracked boiler sent ash into the cistern and spent the last clean filter stock."
  fallout.event_log.ice_melt_rations.use_untreated_water_success: "Untreated meltwater kept the wards open under a public risk ledger."
  fallout.event_log.ice_melt_rations.use_untreated_water_partial: "Untreated water held the clinic while the upper wards began a fever watch."
  fallout.event_log.ice_melt_rations.use_untreated_water_failure: "Ash entered the lower cistern and forced the clinic into the school shelter."
  fallout.event_log.ice_melt_rations.send_clean_ice_expedition_success: "A ravine expedition returned with clear ice and a guarded watershed right."
  fallout.event_log.ice_melt_rations.send_clean_ice_expedition_partial: "Cleaner ice arrived with a lost sled and only three days of clinic reserve."
  fallout.event_log.ice_melt_rations.send_clean_ice_expedition_failure: "The ravine crew returned without clean ice and left the settlement between an ash pond and a well."
  fallout.event_log.ice_melt_rations.ration_fuel_for_boil_success: "A guarded slow boil kept the frost ward supplied through the night."
  fallout.event_log.ice_melt_rations.ration_fuel_for_boil_partial: "The guarded boiler filled the central tanks while outlying households traded shelter shifts."
  fallout.event_log.ice_melt_rations.ration_fuel_for_boil_failure: "A fight at the boiler gate overturned a filter drum and broke the water council's trust."
  fallout.event_log.ice_melt_rations.callback_success: "The ice review marked a safer ravine and restored the filter room's reserve."
  fallout.event_log.ice_melt_rations.callback_partial: "The central tanks recovered, but upper wards still counted each filter cloth."
  fallout.event_log.ice_melt_rations.callback_failure: "The review closed with the lake sealed and the settlement's filter ledger in dispute."
