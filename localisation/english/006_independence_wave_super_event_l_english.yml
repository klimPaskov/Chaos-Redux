l_english:
chaosx_super_event.23.t: "The League of New States"
chaosx_super_event.23.d: "Delegates from the newest states have ratified a common charter and chosen the league's leadership. The signatories promise arbitration, mutual aid, and collective resistance to any former host or foreign patron that attempts to extinguish a member.\n\nThe league can speak for its members, bargain in their name, and coordinate shared aid or mobilization."
chaosx_super_event.23.a: "Small states, one covenant."
chaosx_super_event.23.q: "\"A general association of nations must be formed under specific covenants...\"\n §Y-Woodrow Wilson, Fourteen Points, Point XIV, 8 January 1918-§!"
chaosx_super_event.24.t: "Every Border a Casus Belli"
chaosx_super_event.24.d: "New-state governments coordinate claims, ultimatums, arms shipments, and mobilization schedules across several regions. Their border commands follow shared timetables, and governments pledge arms or troops to support one another's territorial demands.\n\nFormer hosts reinforce several fronts as they prepare for wars that may begin on the same day."
chaosx_super_event.24.a: "They have sown the wind."
chaosx_super_event.24.q: "\"For they have sown the wind, and they shall reap the whirlwind...\"\n §Y-Hosea 8:7, King James Version-§!"

independence_wave.history.danger_milestone.title: "Every Border a Casus Belli"
independence_wave.history.danger_milestone.description: "New-state governments have turned sudden sovereignty into coordinated pressure. Claims, military timetables, breakaway sponsorships, and common support now threaten several former hosts at once."
independence_wave.history.crisis.title: "The Host Authority Cracks"
independence_wave.history.crisis.description: "A host's authority has entered a liberation crisis. [GetIndependenceWaveCrisisHistoryCause] The request is recorded against the host before the ordinary synchronized wave can assemble its release."
independence_wave.history.crisis.cause.occupation: "Enemy occupation and severe resistance have made local authority impossible to sustain."
independence_wave.history.crisis.cause.stability: "Stability has fallen below the emergency threshold, and institutions are no longer carrying the old settlement."
independence_wave.history.crisis.cause.combined: "Enemy occupation, severe resistance, and failing stability have broken the old settlement at the same time."
independence_wave.history.crisis.cause.requester_lost: "The requesting host was annexed before its synchronized release could be built, so the queued crisis closed without changing ownership."
independence_wave.history.crisis.cause.unknown: "Occupation and institutional pressure have made the old settlement impossible to sustain."
independence_wave.history.crisis.outcome.title: "Pre-Wave Request Result"
independence_wave.history.crisis.outcome.description: "[GetIndependenceWaveCrisisResolution]"
independence_wave.history.crisis.outcome.queued: "The host's request is waiting for the next synchronized wave."
independence_wave.history.crisis.outcome.blocked: "The request could not be admitted while pre-wave pressure persisted. The host suffered the listed pressure and cooldown consequences, and no territory changed hands."
independence_wave.history.crisis.outcome.cancelled: "The pressure faded before the request could be admitted. Stability and cooldown consequences were applied, and no territory changed hands."
independence_wave.history.crisis.outcome.committed: "The synchronized wave was completed. The selected states changed hands, and the host kept part of its territory."
independence_wave.history.crisis.outcome.requester_lost: "The host disappeared before its request was resolved. The request was closed without changing territory."
independence_wave.history.crisis.outcome.unknown: "The request was recorded without changing territory."
