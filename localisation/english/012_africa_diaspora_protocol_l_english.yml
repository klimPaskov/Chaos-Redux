l_english:
  chaosx.nr12.310.t: "A Voluntary Return Must Be Chosen"
  chaosx.nr12.310.d: "The host has opened a voluntary diaspora programme for [ROOT.GetName]. Its passage, housing, service, and representation terms cannot begin without the target government's answer."
  chaosx.nr12.310.a: "Accept the voluntary programme"
  chaosx.nr12.310.a.tt: "Record [ROOT.GetName]'s consent and resume the quoted action. No population is moved by this answer."
  chaosx.nr12.310.b: "Ask for safeguards"
  chaosx.nr12.310.b.tt: "Pause the request while the host offers counterterms for local control, citizenship, and representation."
  chaosx.nr12.310.c: "Refuse the programme"
  chaosx.nr12.310.c.tt: "Record the target's refusal, lower host trust, and close the pending quote without creating an action record."

  chaosx.nr12.311.t: "Counterterms for Local Control"
  chaosx.nr12.311.d: "The target has asked for safeguards before it will answer. The host may offer bounded counterterms or withdraw the proposal."
  chaosx.nr12.311.a: "Offer the safeguards"
  chaosx.nr12.311.a.tt: "Send the terms back to the target for its final answer."
  chaosx.nr12.311.b: "Withdraw the proposal"
  chaosx.nr12.311.b.tt: "Close this request without changing the target's consent or status."

  chaosx.nr12.312.t: "The Target Reviews the Safeguards"
  chaosx.nr12.312.d: "The host has offered safeguards for local ownership, citizenship, and representation. The target still owns the final answer."
  chaosx.nr12.312.a: "Accept the safeguards"
  chaosx.nr12.312.a.tt: "Record target-owned consent and resume the quoted action."
  chaosx.nr12.312.b: "Decline the safeguards"
  chaosx.nr12.312.b.tt: "Record refusal and close the pending quote without forced relocation or coercion."

  chaosx.nr12.313.t: "Review the Active Diaspora Programme"
  chaosx.nr12.313.d: "The voluntary programme has reached its withdrawal review. The target may let the work continue or withdraw its consent and cancel the active action."
  chaosx.nr12.313.a: "Let the programme continue"
  chaosx.nr12.313.a.tt: "Close this review and leave the active, target-owned programme in place."
  chaosx.nr12.313.b: "Withdraw consent"
  chaosx.nr12.313.b.tt: "Cancel the active programme, clear consent, and return its bounded capacity without moving anyone by force."
