camp_admin_country_authorize_tt: "Authorize one eligible institution under the national spending ceiling. Each funded month costs [?constant:camp_admin_country.monthly_support|0] £support_equipment_text_icon and [?constant:camp_admin_country.monthly_pp|0] £pol_power. Work requires a coercive mandate, development spending and at least [?constant:camp_admin_country.minimum_support|%0] local support. A program needs [?constant:camp_admin_country.program_months|0] funded months, with slower progress while authority is contested. Completion grants one 50–100% single-use bonus for support, industry or engineering research. An existing bonus in the same category delays the award. At most two awards can be issued each calendar year."
camp_admin_country_halt_tt: "Suspend institutional work and its spending. Existing progress and records remain. The economic administration continues under its current mandate."
camp_admin_country_reform_tt: "End institutional programs, release surviving detainees and begin replacing forced labor with paid civilian employment. Completed infrastructure and records remain. Civilian losses cannot be reversed."
