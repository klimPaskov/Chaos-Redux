camp_admin_ger_economic_authority: "Place allocation under SS authority"
camp_admin_ger_establish_krakow_site: "Establish Auschwitz detention site"
camp_admin_ger_establish_krakow_site_desc: "SS administrators want a permanent camp near Kraków. Building it creates a site and a record of German responsibility. Turning it into a killing center needs a separate order."
camp_admin_ger_krakow_site_requirements_tt: "Requires a Nazi German government fighting a war of conquest, German control of Kraków, a mandate harsher than Custody and Review, a development spending ceiling, and no existing camp or responsible authority in the state."
camp_admin_ger_krakow_site_cost: "£pol_power [?global.black_friday_price_genocide_decision_cost_build_concentration|0]"
camp_admin_ger_krakow_site_cost_blocked: "£pol_power §R[?global.black_friday_price_genocide_decision_cost_build_concentration|0]§!"
camp_admin_ger_krakow_site_cost_tooltip: "Requires [?global.black_friday_price_genocide_decision_cost_build_concentration|0] Political Power. The full amount is paid when the site is established."
camp_admin_ger_krakow_site_effect_tt: "Establish a detention site in Kraków, record German responsibility, and add the order to Records. The camp retains a custody role until a separate, paid killing-center order is issued."
camp_admin_ger_economic_authority_desc: "The Camp Inspectorate and SS economic offices seek control over contracts, labor allocation and institutional records. Concentrating authority can settle an immediate dispute, while strengthening the officials responsible for imprisonment and abuse."
camp_admin_ger_ministerial_review: "Review SS control of camp contracts"
camp_admin_ger_ministerial_review_desc: "Ministerial accountants and military procurement offices contest SS control of industrial commitments. A funded review can reclaim administrative authority and document the camp system's conduct."
camp_admin_ger_preserve_archives: "Secure camp archives for investigators"
camp_admin_ger_preserve_archives_desc: "Keep the camp registers, contracts and correspondence for investigators, so that victims can be named and those responsible identified."
camp_admin_jap_kwantung_allocation: "Concentrate Kwantung allocation authority"
camp_admin_jap_kwantung_allocation_desc: "The Kwantung Army seeks authority over occupation transport and its institutional budgets. The central Army command must choose how far to concede control over personnel, records and expenditure."
camp_admin_jap_central_army_review: "Put Kwantung Camps under Central Army Review"
camp_admin_jap_central_army_review_desc: "A central Army review challenges the Kwantung command's autonomy and keeps records of its abuses. Other institutional programs stop while the review runs."
camp_admin_jap_preserve_occupation_records: "Secure occupation and institutional records"
camp_admin_jap_preserve_occupation_records_desc: "Keep occupation orders, labor registers and institutional files for investigators, so that victims and missing prisoners can be traced."
camp_admin_sov_commission_design_bureaux: "Commission detained engineering bureaux"
camp_admin_sov_commission_design_bureaux_desc: "The NKVD's special technical bureaux employ imprisoned engineers on state design work. Industrial ministries seek their expertise while security officials control confinement, movement and access to the resulting designs."
camp_admin_sov_review_engineer_detention: "Review engineer detention and release"
camp_admin_sov_review_engineer_detention_desc: "Examine the detention of technical personnel and the demands placed on their bureaux. A sustained review opens a release and reassignment program, while curbing the camp administration's control over industrial work."
camp_admin_sov_open_release_registers: "Open detention and release registers"
camp_admin_sov_open_release_registers_desc: "Open the records that identify former prisoners and support the families of the missing. Closing the camps does not erase what happened in them."
camp_admin_security_authority_tt: "Authorize institutional work and concentrate allocations under the security command. This settles some immediate allocation disputes. Its authority grows with continuing commitments and can eventually obstruct coordination. Programs still require monthly support, an operating institution and an affordable spending ceiling."
camp_admin_oversight_tt: "Reserve the institutional slot for a [?constant:camp_admin_country.oversight_months|0]-month funded review. Each funded month costs [?constant:camp_admin_country.monthly_support|0] £support_equipment_text_icon and [?constant:camp_admin_country.monthly_pp|0] £pol_power. Completion reduces disputes over authority and permits supervised institutional work. No institutional program advances while the review occupies the slot."
camp_admin_archives_tt: "Secure institutional records over [?constant:camp_admin_country.archive_months|0] funded months. Each month costs [?constant:camp_admin_country.archive_support|0] £support_equipment_text_icon and [?constant:camp_admin_country.archive_pp|0] £pol_power within the national spending ceiling. Completed records remain available for identification and investigation."
