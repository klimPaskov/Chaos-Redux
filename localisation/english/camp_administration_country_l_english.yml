camp_admin_bonus_sov_engineer_release: "Reassigned engineering personnel"
camp_admin_institution_inactive_tt: "No institutional payment or research award is due here. Existing custody, civilian employment and site maintenance remain subject to their current orders."
camp_admin_civil_action_1_blocked_general: "This civilian order requires eligible national authority and a free institutional slot. Releasing or converting existing custody also requires consistent site records. Authorization has no immediate cost. Monthly work is funded within the spending ceiling after maintenance and protected reserves."
camp_admin_civil_action_2_blocked_general: "Review requires a free institutional slot and consistent site custody records. Property claims require a democratic United States at peace, with incarceration authority ended and claims still unresolved. No immediate payment occurs. Monthly work uses the current costs within the spending ceiling."
