l_english:
chaosx.nr63.1.t: "Subject Independence"
chaosx.nr63.2.t: "[?ended_puppet.GetName] declares independence!"
chaosx.nr63.2.d: "One of our subjects has declared independence, removing its government from our control and opening a new front in the region."
chaosx.nr63.2.a: "What's this nonsense!"
chaosx.nr63.2.b: "Accept the declaration."

chaosx.news.57.t: "[?FROM.ended_puppet.GetName] declares independence"
chaosx.news.57.d: "[?FROM.ended_puppet.GetName], a subject of [FROM.GetName], has declared independence after years of demands for greater autonomy. The break has ended the old chain of command and created a new government."
chaosx.news.57.a: "Another subject has broken away."
