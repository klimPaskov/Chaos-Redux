l_english:
# Shared reform action
camp_rework_transfer_guard_transport_cost_tt: "A guarded prisoner transfer requires available manpower, command capacity, infantry equipment, support equipment, and trains."
camp_repression_close_dormant_legacy_site: "Close the Dormant Legacy Site in [FROM.GetName]"
camp_repression_close_dormant_legacy_site_desc: "Closure teams will dismantle the dormant inherited site in [FROM.GetName]. Manpower and support equipment will be committed, and the state must remain under our control until the work is finished."

# Germany
germany_route_prisoner_labor_to_war_construction: "Route Prisoner Labor to War Construction"
germany_route_prisoner_labor_to_war_construction_desc: "The SS camp administration will assign prisoners to military construction, accelerating the works while tightening the regime's hold over the labor network."
germany_redirect_prisoner_labor_to_eastern_fortifications: "Redirect Prisoner Labor in [FROM.GetName]"
germany_redirect_prisoner_labor_to_eastern_fortifications_desc: "Prisoner columns will be transferred to [FROM.GetName] to reinforce the eastern defensive line. The fortifications will rise quickly, but the transfer will deepen overextension and leave a larger trail of evidence."
germany_tighten_deportation_logistics: "Tighten Deportation Logistics"
germany_tighten_deportation_logistics_desc: "Rail schedules and regional police offices will be subordinated to a centralized deportation timetable. The camp system will receive more prisoners at the cost of greater strain and exposure."
germany_increase_guard_allocation_to_ss_sites: "Increase Guard Allocation to SS Sites"
germany_increase_guard_allocation_to_ss_sites_desc: "Additional guards and supplies will be diverted to the SS camp complex. Control will improve, but the wider war effort will bear the expense."
germany_build_ss_laboratory_annex_at_auschwitz: "Build the SS Laboratory Annex at Auschwitz"
germany_build_ss_laboratory_annex_at_auschwitz_desc: "An isolated laboratory annex will place the Auschwitz research staff under direct SS authority. Its records and victims will bind the camp complex more closely to the regime's medical crimes."
germany_destroy_auschwitz_evidence_before_retreat: "Destroy Auschwitz Evidence Before Retreat"
germany_destroy_auschwitz_evidence_before_retreat_desc: "With the front approaching, camp offices will burn registers and dismantle incriminating facilities. Some evidence may disappear, but the rushed operation will create further disorder and suspicion."
germany_dismantle_auschwitz_complex: "Dismantle the Auschwitz Complex"
germany_dismantle_auschwitz_complex_desc: "The camp complex will be closed, prisoners released from its administration, and the SS apparatus removed. The reckoning will be costly, but continued operation would deepen the country's guilt and instability."
