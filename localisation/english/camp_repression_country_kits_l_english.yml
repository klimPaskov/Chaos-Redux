germany_occupied_poland_pool_required_tt: "Requires a controlled, non-core European prisoner source in the strict occupied Poland pool."
germany_occupied_poland_priority_tt: "Occupied Poland sources take priority. Other occupied European states are valid only when that pool is empty, and German cores are available only as the final punitive fallback."
germany_core_transfer_fallback_penalty_tt: "Using a German core as the final prisoner-source fallback sharply reduces stability and war support, raises Mengele autonomy and evidence, and weakens the project's effective output."
germany_auschwitz_state_88_required_tt: "Requires responsible German control of state 88, no existing biowarfare facility there, and an undismantled Auschwitz complex."
germany_mengele_cloning_unlock_requirements_tt: "The cloning proposal requires full or bypass permission, at least 55 Mengele autonomy, a controlled biowarfare facility, a registered active experiment site, sufficient archive control or no military review, and at least 6 hidden project progress."
germany_mengele_cloning_unlock_pending_tt: "The cloning proposal remains pending. The recurring Directorate monitor will schedule it once every requirement is met, unless closure, purge, coup, or completion ends the route."
germany_auschwitz_dismantlement_effect_tt: "Begins the 270-day closure of Auschwitz. Responsible control of a valid dismantlement site must be maintained until completion. Surviving evidence remains available to discovery and reckoning."
camp_ledger_country_panel_germany: "Germany: Auschwitz and the Mengele Program"
camp_ledger_mengele_autonomy: "Mengele Autonomy"
camp_ledger_mengele_autonomy_tt: "Personal and institutional freedom held by Mengele's apparatus. At 55 it can support cloning, at 60 it enters the warning band, and at 85 it reaches the coup threshold."
camp_ledger_mengele_permission: "Mengele Permission"
camp_ledger_mengele_permission_tt: "The live permission enum: rejected, restricted, limited, full, or bypass. Full permission is the minimum ordinary cloning level."
camp_ledger_ss_archive_control: "SS Archive Control"
camp_ledger_ss_archive_control_tt: "Control of classified SS records used by the program, military review, and the cloning gate."
camp_ledger_poland_transfer_pressure: "Poland Transfer Pressure"
camp_ledger_poland_transfer_pressure_tt: "Administrative and logistical pressure created by prisoner transfers from occupied Poland."
camp_ledger_auschwitz_evidence_depth: "Auschwitz Evidence Depth"
camp_ledger_auschwitz_evidence_depth_tt: "The surviving documentary, witness, and facility evidence tied to the Auschwitz complex."
