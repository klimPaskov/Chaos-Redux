l_english:
# Shared reform action
camp_rework_colonial_dismantlement_readiness_tt: "Every remaining responsible site must be under our or a subject's control, with consistent custody records, before resources are committed."
camp_rework_france_legacy_custody_tt: "If active sites remain, their custody records must be consistent before this closure order is funded."
camp_rework_transfer_guard_transport_cost_tt: "Escort and transport require £manpower_texticon §Y[?global.black_friday_price_camp_rework_cost_expansion_manpower|0]§!, £support_equipment_text_icon §Y[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§!, and £GFX_train_texticon §Y[?global.black_friday_price_camp_rework_equipment_cost_trains|0]§!."
camp_repression_close_dormant_legacy_site: "Close the Dormant Legacy Site in [FROM.GetName]"
camp_repression_close_dormant_legacy_site_desc: "Closure teams will dismantle the dormant inherited site in [FROM.GetName]. Manpower and support equipment will be committed, and the state must remain under our control until the work is finished."

# Germany
germany_destroy_auschwitz_evidence_before_retreat: "Destroy Auschwitz Evidence Before Retreat"
germany_destroy_auschwitz_evidence_before_retreat_desc: "With the front approaching, camp offices will burn registers and dismantle incriminating facilities. Some evidence may disappear, but the rushed operation will create further disorder and suspicion."
germany_dismantle_auschwitz_complex: "Dismantle the Auschwitz Complex"
germany_dismantle_auschwitz_complex_desc: "The camp complex will be closed, prisoners released from its administration, and the SS apparatus removed. The reckoning will be costly, but continued operation would deepen the country's guilt and instability."
germany_dismantle_auschwitz_custody_tt: "Requires German control of the complex and consistent custody records. Survivors must be releasable before dismantlement begins."
germany_destroy_auschwitz_evidence_before_retreat_cost: "£manpower_texticon §Y[?global.black_friday_price_camp_rework_cost_activation_manpower|.1*]§!  £command_power §Y[?global.black_friday_price_camp_rework_cost_evidence_command|0]§!  £support_equipment_text_icon §Y[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§!"
germany_destroy_auschwitz_evidence_before_retreat_cost_blocked: "£manpower_texticon §R[?global.black_friday_price_camp_rework_cost_activation_manpower|.1*]§!  £command_power §R[?global.black_friday_price_camp_rework_cost_evidence_command|0]§!  £support_equipment_text_icon §R[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§!"
germany_dismantle_auschwitz_complex_cost: "£manpower_texticon §Y[?global.black_friday_price_camp_rework_cost_dismantle_manpower|.1*]§!  £support_equipment_text_icon §Y[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§!"
germany_dismantle_auschwitz_complex_cost_blocked: "£manpower_texticon §R[?global.black_friday_price_camp_rework_cost_dismantle_manpower|.1*]§!  £support_equipment_text_icon §R[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§!"
germany_occupied_poland_pool_required_tt: "Requires a controlled, non-core European prisoner source in the strict occupied Poland pool."
germany_occupied_poland_priority_tt: "Occupied Poland takes priority. Other occupied European states may be used only when no Polish territory is available, and German territory is reserved for a desperate final measure."
germany_core_transfer_fallback_penalty_tt: "Drawing prisoners from German territory sharply reduces stability and war support, raises Mengele's autonomy, leaves more evidence, and weakens the project's effective output."
germany_auschwitz_state_88_required_tt: "Requires responsible German control of state 88, no existing biowarfare facility there, and an undismantled Auschwitz complex."
germany_mengele_cloning_unlock_requirements_tt: "The cloning proposal requires full or bypass permission, at least 55 Mengele autonomy, a controlled biowarfare facility, an operating experiment site, sufficient archive control or no military review, and six stages of project preparation."
germany_mengele_cloning_unlock_pending_tt: "The cloning proposal remains pending until every requirement is met. Closure, purge, coup, or completion will end the route."
germany_auschwitz_dismantlement_effect_tt: "Begins the 270-day closure of Auschwitz. Responsible control of a valid dismantlement site must be maintained until completion. Surviving evidence remains available to discovery and reckoning."
camp_ledger_country_panel_germany: "SS Camp Administration"
camp_ledger_country_panel_germany_ss: "SS Camp Administration"
camp_ledger_mengele_autonomy: "Mengele Autonomy"
camp_ledger_mengele_autonomy_tt: "Personal and institutional freedom held by Mengele's apparatus. At 55 it can support cloning, at 60 it enters the warning band, and at 85 it reaches the coup threshold."
camp_ledger_mengele_permission: "Mengele Permission"
camp_ledger_mengele_permission_tt: "Authority granted to Mengele's program ranges from rejection and restriction to limited, full, or bypass authority. Ordinary cloning proposals require full authority."
camp_ledger_ss_archive_control: "SS Archive Control"
camp_ledger_ss_archive_control_tt: "Control of the classified SS records that sustain the program, shape military review, and support a cloning proposal."
camp_ledger_poland_transfer_pressure: "Poland Transfer Pressure"
camp_ledger_poland_transfer_pressure_tt: "Administrative and logistical pressure created by prisoner transfers from occupied Poland."
camp_ledger_auschwitz_evidence_depth: "Auschwitz Evidence Depth"
camp_ledger_auschwitz_evidence_depth_tt: "The surviving documentary, witness, and facility evidence tied to the Auschwitz complex."
camp_ledger_country_values_germany: "Auschwitz is [GetCampAuschwitzStatusName], with [?display_camp_experiment_sites|0] experiment sites in operation.\nMengele's authority is [GetCampMengeleAutonomyBandName]. Permission for experimentation is [GetCampMengelePermissionName].\nSurviving records are [GetCampEvidenceBandName]."
camp_mengele_autonomy_coup: "Coup Threshold"
camp_mengele_autonomy_warning: "Directorate Warning"
camp_mengele_autonomy_cloning: "Cloning-Capable"
camp_mengele_autonomy_contained: "Contained"
camp_mengele_autonomy_none: "No Independent Authority"
camp_mengele_permission_bypass: "Bypass Authority"
camp_mengele_permission_full: "Full Permission"
camp_mengele_permission_limited: "Limited Permission"
camp_mengele_permission_restricted: "Restricted Permission"
camp_mengele_permission_rejected: "Rejected"
camp_mengele_permission_closed: "Program Closed"
camp_auschwitz_status_dismantled: "Dismantled"
camp_auschwitz_status_discovered: "Discovered"
camp_auschwitz_status_laboratory: "SS Laboratory Complex"
camp_auschwitz_status_experiment: "Experiment Site"
camp_auschwitz_status_radicalized: "Radicalized Camp"
camp_auschwitz_status_active: "Active Camp"
camp_auschwitz_status_dormant: "Inactive"
germany_auschwitz_military_review_mission: "Military Review of Auschwitz"
germany_auschwitz_military_review_mission_desc: "Military offices are examining the camp administration, its labor claims, and the resources consumed by the SS. A seizure of power during the inquiry would end the review in chaos."
germany_auschwitz_military_review_mission_success: "The military review concludes before a coup can overwhelm the inquiry, reducing autonomy and radicalization while strengthening reform pressure."
germany_auschwitz_military_review_mission_failure: "A military overthrow interrupts the review and throws the camp chain of command into crisis."
germany_auschwitz_military_review_mission_cancelled: "Closure or rejection of the program ends the military review without a coup. The abandoned inquiry still contributes modestly to reform pressure."
germany_auschwitz_evidence_destruction_mission: "Auschwitz Evidence Destruction"
germany_auschwitz_evidence_destruction_mission_desc: "SS personnel are destroying camp registers and dismantling incriminating offices before the front arrives. The operation must finish before control of the area is lost."
germany_auschwitz_evidence_destruction_mission_success: "The destruction operation reaches its deadline while Germany retains the camp area, removing selected records while increasing future tribunal suspicion."
germany_auschwitz_evidence_destruction_mission_failure: "The camp area falls before the operation is complete, exposing the failed cover-up and deepening evidence and tribunal pressure."
germany_auschwitz_evidence_destruction_mission_cancelled: "Dismantlement of the Auschwitz complex ends the destruction order. Surviving administrative traces add a smaller evidence burden."
germany_auschwitz_dismantlement_mission: "Dismantlement of Auschwitz"
germany_auschwitz_dismantlement_mission_desc: "Officials are closing the Auschwitz complex and unwinding its administration. The reform course must survive until the dismantlement is complete."
germany_auschwitz_dismantlement_mission_success: "The Auschwitz complex is dismantled and removed from active administration."
germany_auschwitz_dismantlement_mission_failure: "A fascist reversal or loss of responsible control prevents lawful closure of the Auschwitz complex and increases evidence, hardliner, and legitimacy pressure."
germany_dormant_ss_camp_legacy: "Dormant SS Camp Legacy"
germany_dormant_ss_camp_legacy_desc: "The institutional memory of the SS camp system persists in state offices, burdening political authority even while the network remains inactive."
germany_ss_camp_administration: "SS Camp Administration"
germany_ss_camp_administration_desc: "The SS camp bureaucracy erodes stability and places growing demands on military supply."
germany_occupied_labor_network: "Occupied Labor Network"
germany_occupied_labor_network_desc: "The expanding camp and labor network deepens instability and increases the supply burden across occupied Europe."
germany_ss_camp_overextension: "SS Camp Overextension"
germany_ss_camp_overextension_desc: "The camp network has grown beyond its administrative capacity. Corruption, supply demands, and public unease now damage the war effort."
germany_auschwitz_evidence_pressure: "Auschwitz Evidence Pressure"
germany_auschwitz_evidence_pressure_desc: "Surviving registers, witnesses, and abandoned facilities undermine the regime's legitimacy and consume political attention."
germany_camp_reform_pressure: "Camp Reform Pressure"
germany_camp_reform_pressure_desc: "Closing the camp system requires resources and sustained political effort, but it offers a path toward restoring public stability."
germany_post_regime_camp_reckoning: "Post-Regime Camp Reckoning"
germany_post_regime_camp_reckoning_desc: "A successor government must confront the camp system's records, victims, and surviving administrators while rebuilding legitimate institutions."

# Japan
japan_open_epidemic_containment_office: "Open the Epidemic Containment Office"
japan_open_epidemic_containment_office_desc: "A dedicated office will coordinate quarantine, relief, and reporting where the secret program has created an outbreak emergency. Success depends on reducing the danger before public order collapses."
japan_destroy_pingfang_records: "Destroy the Pingfang Records"
japan_destroy_pingfang_records_desc: "As enemy forces approach, selected registers and command files will be destroyed. The operation may obstruct future investigators, but it will also disrupt the bureau and advertise the command's fear of exposure."
japan_evacuate_pingfang_research_staff: "Evacuate Pingfang Research Staff"
japan_evacuate_pingfang_research_staff_desc: "Trains and motor transport will remove staff and archives from Pingfang before the site is overrun. Retaining control during the evacuation is essential to prevent capture of the network's personnel and records."
japan_submit_to_army_review: "Submit Ishii's Unit to Army Review"
japan_submit_to_army_review_desc: "The program will accept formal army scrutiny. Inspectors will examine Ishii's authority, the bureau's records, and the occupation command's responsibility for its abuses."
japan_remove_ishii_from_program_control: "Remove Ishii from Program Control"
japan_remove_ishii_from_program_control_desc: "Army authorities will strip Ishii of direct control and disperse his personal chain of command. The decision weakens the program's most powerful patron and strengthens the reform course."
japan_shut_down_prisoner_experiments: "Shut Down Prisoner Experiments"
japan_shutdown_custody_tt: "Requires authority over every targeted institution and consistent custody records before the shutdown can be funded."
japan_shut_down_prisoner_experiments_desc: "The coercive research sites will be closed and their prisoners removed from the program. The shutdown will require resources and careful containment of the dangers left behind."
japan_open_epidemic_containment_office_cost: "£GFX_motorized_equipment_text_icon §Y[?global.black_friday_price_camp_rework_equipment_cost_motorized_equipment|0]§!  £GFX_train_texticon §Y[?global.black_friday_price_camp_rework_equipment_cost_trains|0]§!  £support_equipment_text_icon §Y[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§!"
