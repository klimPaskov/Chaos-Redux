sov_union_crisis_suppression_cap_tt: "Material repression always increases gulag memory, republic fear, and old-movement grievance. During an active Union Crisis, authority and obedience relief is limited to 8 total points and is granted only below 86 collapse threat."
sov_union_crisis_relief_stopped_tt: "Union Crisis relief is unavailable while the crisis is inactive, after terminal collapse, or once coercion can no longer restore obedience. Harmful repression memory and grievance still rise."
sov_famine_pressure_effect_tt: "This action increases or preserves famine pressure, republic fear, grievance, evidence, or tribunal exposure according to the live procurement and concealment state."
sov_famine_relief_effect_tt: "Commits transport and support stores to relief, reducing grain extraction and forced-labor burdens immediately and opening the timed route to lower famine pressure without erasing evidence."
sov_gulag_dismantlement_effect_tt: "Begins the 270-day closure of every responsible Soviet gulag site. All registered sites must remain under usable Soviet or subject control for network-wide dismantlement to succeed."
camp_ledger_country_panel_soviet: "Soviet Union: Gulag, Paranoia, and Famine"
camp_ledger_paranoia_pressure: "Paranoia Pressure"
camp_ledger_paranoia_pressure_tt: "Paranoia pressure reflects the active Soviet security climate and the fear surrounding central authority."
camp_ledger_nkvd_authority: "NKVD Authority"
camp_ledger_nkvd_authority_tt: "The security apparatus's authority over gulag administration, party review, and reform resistance."
camp_ledger_gulag_network_reach: "Gulag Network Reach"
camp_ledger_gulag_network_reach_tt: "The territorial and administrative reach of the registered Soviet gulag system."
camp_ledger_grain_extraction_burden: "Grain Extraction Burden"
camp_ledger_grain_extraction_burden_tt: "The accumulated procurement burden that drives local famine pressure and recurring crisis risk."
camp_ledger_famine_pressure: "Famine Pressure"
camp_ledger_famine_pressure_tt: "The country's current famine crisis pressure, refreshed from affected states and procurement policy."
camp_ledger_old_movement_grievance: "Old Movement Grievance"
camp_ledger_old_movement_grievance_tt: "Grievance carried by republics and opposition networks from confiscation, deportation, gulag repression, and famine."
camp_ledger_union_crisis_suppression_relief: "Union Crisis Suppression Relief"
camp_ledger_union_crisis_suppression_relief_tt: "The temporary authority and obedience already drawn from repression during the active Union Crisis."
camp_ledger_country_values_soviet: "$camp_ledger_paranoia_pressure$: [?display_paranoia_pressure|1] ([GetCampParanoiaBandName])\n$camp_ledger_nkvd_authority$: [?display_nkvd_authority|1]\n$camp_ledger_gulag_network_reach$: [?display_gulag_reach|1]\n$camp_ledger_grain_extraction_burden$: [?display_grain_extraction_burden|1]\n$camp_ledger_famine_pressure$: [?display_famine_pressure|1] ([GetCampFaminePressureBandName])\n$camp_ledger_old_movement_grievance$: [?display_old_movement_grievance|1]\n$camp_ledger_union_crisis_suppression_relief$: [?display_union_crisis_suppression_relief|1] / [?display_union_crisis_suppression_relief_cap|1] ([GetCampUnionCrisisRepressionReliefBandName])"
camp_union_relief_capped: "Exhausted: Further Repression Gives No Relief"
sov_gulag_quota_cycle: "Gulag Quota Cycle"
sov_gulag_quota_cycle_desc: "The camp administration must fulfill another production quota without entering reform or allowing overextension to become critical."
sov_gulag_quota_cycle_success: "The quota cycle concludes without reform or critical camp overextension."
sov_gulag_quota_cycle_failure: "Reform or critical camp overextension breaks the quota cycle and increases famine, corruption, overextension, and evidence pressure."
sov_gulag_quota_cycle_cancelled: "The quota order is withdrawn. Forced-labor demands ease while the unfinished allocations remain on record."
sov_famine_pressure_cycle: "Famine Pressure Cycle"
sov_famine_pressure_cycle_desc: "The procurement system is driving another famine cycle. Either famine pressure or the grain extraction burden must be eliminated before the deadline."
sov_famine_pressure_cycle_success: "Famine pressure or the grain extraction burden is eliminated before the cycle ends."
sov_famine_pressure_cycle_failure: "Both famine pressure and the grain extraction burden remain when the cycle ends, activating a wider famine crisis."
sov_famine_pressure_cycle_cancelled: "The procurement cycle is withdrawn before a final outcome. Current famine pressure must still be addressed through relief and procurement policy."
sov_emergency_famine_relief_mission: "Emergency Famine Relief"
sov_emergency_famine_relief_mission_desc: "Relief columns are moving into the afflicted districts. Famine pressure must fall below the medium threshold before their emergency mandate expires."
sov_emergency_famine_relief_mission_success: "Famine pressure falls below the medium threshold during the relief effort."
sov_emergency_famine_relief_mission_failure: "Famine pressure remains too high when the relief effort ends, renewing the crisis and worsening corruption and evidence pressure."
sov_emergency_famine_relief_mission_cancelled: "The relief mandate is withdrawn before resolution. The interruption adds famine pressure and leaves the affected districts without a settlement."
sov_camp_administrator_review_mission: "Review of Camp Administrators"
sov_camp_administrator_review_mission_desc: "The party commission is reviewing the camp administration. If state paranoia reaches a critical level, accusations and purges will overwhelm the inquiry."
sov_camp_administrator_review_mission_success: "The administrator review concludes before paranoia reaches a critical level."
sov_camp_administrator_review_mission_failure: "Critical paranoia consumes the administrator review and strengthens NKVD authority, corruption, grievance, and hardliner pressure."
sov_camp_administrator_review_mission_cancelled: "The party commission is dissolved before a verdict. Its incomplete work contributes modestly to reform pressure."
sov_overextended_gulag_dismantlement_mission: "Dismantlement of Overextended Gulags"
sov_overextended_gulag_dismantlement_mission_desc: "Closure teams are dismantling the most overextended camps. The operation will fail if the reform course is abandoned while NKVD authority remains severe."
sov_overextended_gulag_dismantlement_mission_success: "Every responsible gulag site remains under usable control and the designated network is dismantled without an NKVD reversal."
sov_overextended_gulag_dismantlement_mission_failure: "Severe NKVD authority, abandonment of reform, or loss of control over any registered gulag site defeats the dismantlement effort."
sov_overextended_gulag_dismantlement_mission_cancelled: "The closure mandate is withdrawn while all gulag sites remain closable. Active dismantlement ends and the unresolved sites remain under review."
sov_retreat_records_crisis_mission: "Retreat Records Crisis"
sov_retreat_records_crisis_mission_desc: "Camp and procurement records are being removed from a threatened state. Control of the designated records site must be maintained until the operation ends."
sov_retreat_records_crisis_mission_success: "The threatened records remain under Soviet control through the crisis and selected evidence is removed before retreat."
sov_retreat_records_crisis_mission_failure: "The designated records site is lost before the crisis ends, exposing the archive and deepening tribunal pressure."
sov_retreat_records_crisis_mission_cancelled: "The records order is withdrawn and its temporary target designation is cleared without claiming that the archive was captured."
sov_dormant_gulag_legacy: "Dormant Gulag Legacy"
sov_dormant_gulag_legacy_desc: "The gulag's former offices and political habits continue to burden state authority even while the network remains inactive."
sov_gulag_network_administration: "Gulag Network Administration"
sov_gulag_network_administration_desc: "The centralized camp network supports construction and industrial extraction, but its coercion erodes stability."
sov_nkvd_repression_authority: "NKVD Repression Authority"
sov_nkvd_repression_authority_desc: "Expanded NKVD authority strengthens political control while deepening fear and instability across the state."
sov_forced_labor_output: "Forced Labor Output"
sov_forced_labor_output_desc: "Camp labor accelerates construction and industrial extraction while destabilizing society and straining the supply system."
sov_gulag_corruption_and_overextension: "Gulag Corruption and Overextension"
sov_gulag_corruption_and_overextension_desc: "An overgrown camp bureaucracy diverts consumer resources, weakens stability and war support, and places heavy demands on supply."
sov_famine_pressure: "Famine Pressure"
sov_famine_pressure_desc: "Food shortages and administrative coercion undermine stability, burden transport, and reduce the population available for service."
sov_republic_fear_and_grievance: "Republic Fear and Grievance"
sov_republic_fear_and_grievance_desc: "Memories of confiscation, deportation, and repression weaken political legitimacy and the willingness of the republics to support the center."
sov_gulag_reform_pressure: "Gulag Reform Pressure"
sov_gulag_reform_pressure_desc: "Closing camps and reviewing their officials requires civilian resources and political effort, while offering a route toward renewed stability."
sov_post_collapse_repression_legacy: "Post-Collapse Repression Legacy"
sov_post_collapse_repression_legacy_desc: "Successor authorities must confront the records, victims, and regional grievances left by the gulag and famine administration."

# United Kingdom and British Raj
uk_survey_raj_emergency_detention: "Survey Emergency Detention in the Raj"
uk_survey_raj_emergency_detention_desc: "Imperial officials will survey police compounds, transport links, and detention capacity across the Raj. The inquiry will prepare a coercive security program while damaging colonial legitimacy."
uk_survey_raj_emergency_detention_effect_tt: "Completes the Raj detention survey, opens the imperial detention route, and increases colonial legitimacy damage."
uk_activate_raj_emergency_detention: "Activate Emergency Detention in the Raj"
uk_activate_raj_emergency_detention_desc: "The selected colonial state will be placed under an emergency detention regime. Britain will gain coercive control while India bears greater labor, autonomy, and population pressure."
uk_activate_raj_emergency_detention_effect_tt: "Consumes activation resources, reduces stability, activates a detention site in the selected colonial state, begins the Raj security mission, and increases local burden, resistance, evidence, and imperial control pressure."
uk_route_colonial_labor_to_military_construction: "Route Colonial Labor to Military Construction"
uk_route_colonial_labor_to_military_construction_desc: "Labor from an active detention site will be assigned to military works. The project will support imperial construction while increasing the burden on India and the colonial supply network."
uk_route_colonial_labor_to_military_construction_effect_tt: "Consumes construction supplies, assigns the selected active site to military works, begins the works mission, and increases labor and logistical burdens."
uk_expand_raj_detention_districts: "Expand Raj Detention Districts"
uk_expand_raj_detention_districts_desc: "The selected detention district will be enlarged and placed under tighter imperial administration. Its expanded reach will intensify evidence, overextension, and Indian resistance."
uk_expand_raj_detention_districts_effect_tt: "Consumes expansion resources, reduces stability, expands the selected detention site, and sharply increases local labor burden, autonomy pressure, evidence, coercive control, and overextension."
uk_demand_indian_manpower_levy: "Demand an Indian Manpower Levy"
uk_demand_indian_manpower_levy_desc: "The Raj administration will deliver another manpower levy to the imperial war effort. The demand will strengthen Britain's reserves while inflicting severe local harm and political resentment."
uk_demand_indian_manpower_levy_effect_tt: "Adds manpower but reduces war support, inflicts major harm in the selected site, and increases labor burden, autonomy resistance, and legitimacy damage."
uk_tighten_dominion_security_coordination: "Tighten Dominion Security Coordination"
uk_tighten_dominion_security_coordination_desc: "Imperial and dominion authorities will coordinate security orders and transport. The policy strengthens control while imposing convoy costs and further damaging colonial legitimacy."
uk_tighten_dominion_security_coordination_effect_tt: "Consumes coordination resources, strengthens dominion control, increases convoy and legitimacy burdens, and restarts the Raj security mission."
uk_allocate_additional_colonial_guards: "Allocate Additional Colonial Guards"
uk_allocate_additional_colonial_guards_desc: "More guards will be assigned to the selected detention site. The allocation can ease immediate administrative overextension, but it deepens manpower pressure and India's burden."
uk_allocate_additional_colonial_guards_effect_tt: "Consumes guard resources, relieves some guard and overextension pressure, and increases imperial manpower and local labor burdens."
uk_release_political_prisoners_for_negotiations: "Release Political Prisoners for Negotiations"
uk_release_political_prisoners_for_negotiations_desc: "Political prisoners will be released to open talks with Indian representatives. Expansion will halt while officials negotiate a wider settlement."
uk_release_political_prisoners_for_negotiations_effect_tt: "Reduces stability, opens the reform route, freezes expansion, begins inspections and release negotiations, and reduces detention burden and autonomy resistance."
uk_reform_colonial_labor_administration: "Reform Colonial Labor Administration"
uk_reform_colonial_labor_administration_desc: "Imperial labor offices will be placed under inspection and coercive expansion will cease. The reform requires political effort but can reduce the legacy of detention."
uk_reform_colonial_labor_administration_effect_tt: "Opens the reform route, freezes expansion, begins inspections and release negotiations, increases reform progress, and reduces evidence pressure."
uk_dismantle_raj_detention_network: "Dismantle the Raj Detention Network"
uk_dismantle_raj_detention_network_desc: "Britain will close the Raj detention network and begin a postwar review. The process will require equipment, stability, and continued commitment to reform."
uk_dismantle_raj_detention_network_effect_tt: "Consumes support equipment, reduces stability, begins dismantlement at every colonial detention site, freezes expansion, and starts the postwar Raj review."
uk_hold_raj_security_line: "Hold the Raj Security Line"
uk_hold_raj_security_line_desc: "The selected Raj detention state must remain active and responsible to Britain, stay under British or subject control, retain a British garrison with at least half strength and one-quarter organization, and keep camp supply burden below the high threshold."
uk_hold_raj_security_line_success_tt: "The responsible Raj site remains supplied and controlled behind an effective garrison. Resistance pressure falls and imperial control tightens."
uk_hold_raj_security_line_failure_tt: "Loss of the Raj site, its responsible control, its effective garrison, or its supply line breaks the security line, increasing Indian resistance, overextension, and instability."
uk_complete_raj_military_works: "Complete the Raj Military Works"
uk_complete_raj_military_works_desc: "Colonial labor is building military works in the assigned state. The responsible site must remain under British or subject control while train and support-equipment reserves and civilian project capacity are maintained."
uk_complete_raj_military_works_success_tt: "The responsible site, transport reserves, support stores, and civilian project capacity remain available. The works are completed, increasing labor output and imperial control."
uk_complete_raj_military_works_failure_tt: "Loss of the assigned site, its responsible control, train or support reserves, or civilian project capacity defeats the works and increases evidence, resistance, and the Raj labor burden."
uk_postwar_raj_review: "Postwar Raj Review"
uk_postwar_raj_review_desc: "A postwar commission is supervising the closure of the imperial detention network. Britain must be at peace and remain committed to reform when the review concludes."
uk_postwar_raj_review_success_tt: "Peace and reform allow the review to complete dismantlement. If every site closes, the Raj burdens are cleared and a reformed legacy is secured."
uk_postwar_raj_review_failure_tt: "War or abandonment of reform exposes the network and sharply increases colonial legitimacy damage."
uk_negotiate_indian_release_terms: "Negotiate Indian Release Terms"
uk_negotiate_indian_release_terms_desc: "British and Indian representatives are negotiating releases and the future of the detention system. Expansion must remain frozen, expanded sites must be gone, and autonomy resistance must stay below the high threshold."
uk_negotiate_indian_release_terms_success_tt: "The release settlement is concluded, reducing Raj labor burden and Indian autonomy resistance."
uk_negotiate_indian_release_terms_failure_tt: "Expansion, surviving enlarged sites, or high autonomy resistance defeats the talks and increases legitimacy damage."
uk_imperial_detention_legacy: "Imperial Detention Legacy"
uk_imperial_detention_legacy_desc: "The surviving legal and administrative legacy of imperial detention consumes political authority even after the active network has receded."
uk_imperial_detention_administration: "Imperial Detention Administration"
uk_imperial_detention_administration_desc: "A centralized colonial detention service supports construction while undermining stability and increasing supply consumption."
uk_overextended_imperial_detention: "Overextended Imperial Detention"
uk_overextended_imperial_detention_desc: "The imperial detention network has outgrown its resources, burdening consumer supply, political stability, war support, and logistics."
raj_colonial_labor_burden: "Colonial Labor Burden"
raj_colonial_labor_burden_desc: "India bears the social and demographic cost of coercive imperial labor demands, weakening stability, political authority, and available manpower."
uk_imperial_reform_credit: "Imperial Reform Credit"
uk_imperial_reform_credit_desc: "Credible releases and institutional reform have restored a measure of stability and political trust."
uk_colonial_reckoning_pressure: "Colonial Reckoning Pressure"
uk_colonial_reckoning_pressure_desc: "The unresolved record of imperial detention consumes civilian resources and damages stability and political legitimacy."
camp_rework_uk_raj_autonomy_pressure: "Imperial Detention Pressure"
camp_rework_uk_raj_autonomy_concession: "Indian Detention Reform Concession"

# United States
usa_authorize_emergency_relocation_zones: "Authorize Emergency Relocation Zones"
usa_authorize_emergency_relocation_zones_desc: "The federal government will invoke wartime security powers and open a relocation zone in the selected state. The order will reduce stability and war support while damaging civil liberties, democratic legitimacy, and displaced communities."
usa_authorize_emergency_relocation_zones_effect_tt: "Reduces stability and war support, activates federal relocation authority and a selected security site, begins the authority sunset mission, and increases civil liberties damage, court pressure, population disruption, and evidence."
usa_expand_interior_security_camps: "Expand Interior Security Camps"
usa_expand_interior_security_camps_desc: "A new interior security camp will extend federal relocation authority. The expansion will intensify legal challenges, population disruption, administrative overextension, and the surviving record of detention."
usa_expand_interior_security_camps_effect_tt: "Consumes expansion resources, opens a selected security site, and sharply increases civil liberties damage, court pressure, population disruption, overextension, and evidence."
usa_assign_detainee_labor_to_local_works: "Assign Detainee Labor to Local Works"
usa_assign_detainee_labor_to_local_works_desc: "Detainees at the selected camp will be assigned to local construction. The works will improve output while worsening displacement and democratic legitimacy."
usa_assign_detainee_labor_to_local_works_effect_tt: "Consumes project resources, reduces stability, completes minor local works at the selected site, and increases labor output, population disruption, and democratic legitimacy damage."
usa_strengthen_wartime_review_boards: "Strengthen Wartime Review Boards"
usa_strengthen_wartime_review_boards_desc: "Review boards will receive broader authority to examine detention orders. The measure advances limited reform and judicial scrutiny, though the underlying system continues to damage civil liberties."
usa_strengthen_wartime_review_boards_effect_tt: "Strengthens tribunal review and modest reform progress while adding a smaller civil liberties burden."
usa_allow_court_review: "Allow Court Review"
usa_allow_court_review_desc: "Federal courts will be permitted to examine relocation authority and individual detention orders. Camp expansion will halt while the constitutional review proceeds."
usa_allow_court_review_effect_tt: "Reduces stability in the short term, opens the reform route, freezes expansion, begins inspections, and starts the court review period."
usa_release_detainees_under_supervision: "Release Detainees Under Supervision"
usa_release_detainees_under_supervision_desc: "Detainees from the selected camp will be released under supervised arrangements. The measure reduces displacement and security reach while strengthening judicial scrutiny."
usa_release_detainees_under_supervision_effect_tt: "Consumes support equipment, marks the selected site for reform, reduces population disruption and security reach, and strengthens court review."
usa_terminate_relocation_authority: "Terminate Relocation Authority"
usa_terminate_relocation_authority_desc: "The executive relocation authority will be withdrawn and all active sites placed on a path to closure. The sunset process must survive war and political pressure until dismantlement is complete."
usa_terminate_relocation_authority_effect_tt: "Opens the reform route, freezes expansion, begins inspections and dismantlement at every relocation site, and restarts the security authority sunset."
usa_establish_redress_commission: "Establish a Redress Commission"
usa_establish_redress_commission_desc: "A national commission will document losses and prepare restitution for former detainees. Its work can restore trust only after relocation authority and all active sites have ended."
usa_establish_redress_commission_effect_tt: "Reduces stability in the short term, opens the redress process, and begins the redress commission mission."
usa_court_review_period: "Court Review Period"
usa_court_review_period_desc: "The courts are reviewing wartime relocation authority. Democracy must endure, expansion must remain frozen, and stability must stay above the low threshold until judgment is delivered."
usa_court_review_period_success_tt: "Democratic government, frozen expansion, and sufficient stability allow the courts to curb relocation authority and relieve legitimacy pressure."
usa_court_review_period_failure_tt: "The review fails and exposes the detention system, sharply increasing civil liberties damage and court pressure."
usa_security_authority_sunset: "Wartime Security Authority Sunset"
usa_security_authority_sunset_desc: "Emergency relocation authority is approaching its legal sunset. Expansion must be frozen and either peace restored or the court review completed before the deadline."
usa_security_authority_sunset_success_tt: "The sunset conditions are met. All sites enter final closure, and complete dismantlement ends emergency authority and opens redress."
usa_security_authority_sunset_failure_tt: "The authority survives its sunset conditions, exposing the system and increasing court and democratic legitimacy pressure."
usa_redress_commission_work: "Work of the Redress Commission"
usa_redress_commission_work_desc: "The commission is documenting claims and preparing restitution. Relocation authority must remain terminated and every active site must be closed before its work concludes."
usa_redress_commission_work_success_tt: "The terminated authority and complete site closure allow redress to finish, clearing the principal civil liberties and legitimacy burdens."
usa_redress_commission_work_failure_tt: "Surviving authority or active sites defeats redress and exposes the unresolved crisis."
usa_wartime_security_authority: "Wartime Security Authority"
usa_wartime_security_authority_desc: "Emergency federal powers strengthen wartime mobilization and political control while weakening domestic stability."
usa_contested_relocation_authority: "Contested Relocation Authority"
usa_contested_relocation_authority_desc: "Legal challenges and public opposition to relocation authority consume civilian resources and erode stability and political legitimacy."
usa_civil_liberties_damage: "Civil Liberties Damage"
usa_civil_liberties_damage_desc: "Mass detention has damaged constitutional confidence, weakening stability, war support, and political authority."
usa_relocation_population_disruption: "Relocation Population Disruption"
usa_relocation_population_disruption_desc: "Forced displacement disrupts communities, increases civilian costs, weakens stability, and strains supply."
usa_redress_pressure: "Redress Pressure"
usa_redress_pressure_desc: "Unresolved claims for restitution consume civilian resources and political attention."
usa_reform_credit: "Civil Liberties Reform Credit"
usa_reform_credit_desc: "Judicial review, closure, and redress have restored a measure of public trust and political stability."

# France, Vichy France, and North Africa
fr_inspect_camp_legacy: "Inspect the Camp Legacy"
fr_inspect_camp_legacy_desc: "A commission will inspect inherited camp sites, surviving records, and the condition of refugees. The inquiry opens a reform course while forcing the government to confront its institutional legacy."
fr_inspect_camp_legacy_effect_tt: "Reduces stability, opens inspections and reform, freezes expansion, increases attention to the camp legacy and refugee pressure, and begins the Gurs legacy review."
fr_close_camp_legacy_sites: "Close the Camp Legacy Sites"
fr_close_camp_legacy_sites_desc: "Inherited camp sites will enter supervised closure. The government must supply the dismantlement effort and accept exposure if active sites survive the process."
fr_close_camp_legacy_sites_effect_tt: "Consumes support equipment and begins closure of every inherited French camp site. Completion clears the legacy if no active site survives."
fr_expand_vichy_internment_administration: "Expand Vichy Internment Administration"
fr_expand_vichy_internment_administration_desc: "Vichy authorities will open an internment site in the selected metropolitan or colonial state. The administration will strengthen coercive control while deepening refugee, labor, evidence, and tribunal pressure."
fr_expand_vichy_internment_administration_effect_tt: "Consumes activation resources, opens a selected internment site, and sharply increases North African labor burden, refugee pressure, coercive control, evidence, and tribunal exposure."
fr_route_north_africa_labor_to_rail_projects: "Route North African Labor to Rail Projects"
fr_route_north_africa_labor_to_rail_projects_desc: "Labor from the selected North African site will be assigned to a rail project. The works demand overseas transport and will increase the burden on colonial communities."
fr_route_north_africa_labor_to_rail_projects_effect_tt: "Consumes overseas project resources, assigns the selected site to rail construction, increases labor and transport burdens, and begins the rail labor mission."
fr_collaboration_transfer_records: "Transfer Collaboration Records"
fr_collaboration_transfer_records_desc: "Records from the selected camp will be transferred into the German collaboration chain. The move shares responsibility while increasing evidence, visibility, and future tribunal exposure."
fr_collaboration_transfer_records_effect_tt: "Reduces stability, assigns Germany secondary responsibility for the selected site, and increases its evidence depth, government visibility, tribunal pressure, and refugee pressure."
fr_suppress_refugee_and_rescue_networks: "Suppress Refugee and Rescue Networks"
fr_suppress_refugee_and_rescue_networks_desc: "Security forces will strike refugee and rescue networks linked to the selected camp. Their public activity may recede, but severe local harm and a deeper evidentiary trail will follow."
fr_suppress_refugee_and_rescue_networks_effect_tt: "Selects the suppression response, consumes security resources, inflicts major harm at the response site, and increases refugee, resistance, visibility, and evidence pressure."
fr_support_refugee_and_rescue_networks: "Support Refugee and Rescue Networks"
fr_support_refugee_and_rescue_networks_desc: "Release civilian resources to relief committees and rescue networks responding to the camp crisis. The aid will reduce displacement pressure and strengthen reform at a short-term political cost."
fr_support_refugee_and_rescue_networks_effect_tt: "Selects the aid response, reduces refugee and public-exposure pressure, strengthens reform, and commits civilian resources for the duration of the response."
fr_open_colonial_labor_review: "Open a Colonial Labor Review"
fr_open_colonial_labor_review_desc: "A public review will examine camp labor, colonial transport projects, and collaboration records. Expansion will cease while the government prepares a post-liberation reckoning."
fr_open_colonial_labor_review_effect_tt: "Opens inspections and reform, freezes expansion, increases reform progress, reduces evidence pressure, and begins the post-liberation reckoning."
fr_dismantle_north_africa_labor_network: "Dismantle the North African Labor Network"
fr_dismantle_north_africa_labor_network_desc: "The colonial labor network will be closed under commission oversight. Support equipment and convoys will be committed to dismantlement before the final reckoning."
fr_dismantle_north_africa_labor_network_effect_tt: "Consumes support equipment and convoys, begins dismantlement at French inherited sites, freezes expansion, and starts the post-liberation reckoning."
fr_gurs_legacy_review: "Gurs Legacy Review"
fr_gurs_legacy_review_desc: "The commission is examining the Gurs camp legacy. Inspections must continue under a non-fascist government outside Vichy control until the review concludes."
fr_gurs_legacy_review_success_tt: "Inspection under a non-fascist government outside Vichy control strengthens reform credit and reduces refugee pressure."
fr_gurs_legacy_review_failure_tt: "Vichy rule, fascist government, or abandoned inspection deepens the camp legacy and exposes surviving evidence."
fr_north_africa_rail_labor_project: "North African Rail Labor Project"
fr_north_africa_rail_labor_project_desc: "A selected North African camp is supplying labor to railway construction. The responsible site must remain active and controlled while either train stock or overseas convoy capacity is maintained."
fr_north_africa_rail_labor_project_success_tt: "The responsible site and at least one transport reserve remain available. The rail project increases labor output."
fr_north_africa_rail_labor_project_failure_tt: "Loss of the responsible site or both rail and convoy reserves defeats the project, increasing labor burden, refugee pressure, and evidence."
fr_refugee_pressure_response: "Refugee Pressure Response"
fr_refugee_pressure_response_desc: "Growing displacement and surviving camp records demand a government response. France may support rescue networks, open reform and inspection, suppress the networks, or leave the crisis unanswered before the response period ends."
fr_refugee_pressure_response_success_tt: "Aid or supervised reform reduces refugee pressure and public exposure while strengthening the legal response."
fr_refugee_pressure_response_failure_tt: "Suppression or inaction deepens refugee, visibility, resistance, and evidentiary pressure. An unanswered crisis exposes inherited records."
fr_post_liberation_reckoning: "Post-Liberation Reckoning"
fr_post_liberation_reckoning_desc: "The government is confronting the records, victims, and institutions left by collaboration and colonial forced labor. The process consumes resources and political attention while a democratic reform course seeks closure."
fr_post_liberation_reckoning_success_tt: "Democratic reform completes inherited-site dismantlement. If every site closes, colonial burdens are cleared and reform credit rises."
fr_post_liberation_reckoning_failure_tt: "Abandonment of democracy or reform exposes the unresolved network and sharply increases refugee pressure."
fr_camp_legacy: "French Camp Legacy"
fr_camp_legacy_desc: "Inherited camp institutions and unresolved records continue to consume political authority."
vichy_collaboration_repression: "Vichy Collaboration Repression"
vichy_collaboration_repression_desc: "Vichy's collaboration apparatus supports coercive construction while damaging stability and binding the regime more closely to political repression."
fr_north_africa_labor_burden: "North African Labor Burden"
fr_north_africa_labor_burden_desc: "Colonial labor demands consume civilian resources, destabilize North Africa, and strain overseas supply."
fr_refugee_pressure: "Refugee Pressure"
fr_refugee_pressure_desc: "Displacement, internment, and blocked rescue routes increase civilian costs while eroding stability and political legitimacy."
fr_refugee_aid_commitment: "Refugee Aid Commitment"
fr_refugee_aid_commitment_desc: "Civilian factories and transport offices have been assigned to relief committees and rescue networks for the duration of the emergency response."
free_france_reform_credit: "Free French Reform Credit"
free_france_reform_credit_desc: "Inspection, relief, and institutional reform have strengthened political trust in the restored republic."
camp_rework_france_colonial_autonomy_pressure: "French Colonial Labor Pressure"
camp_rework_france_colonial_autonomy_concession: "French Colonial Reform Concession"

# Italy and Libya
ita_reopen_desert_camp_administration: "Reopen Desert Camp Administration"
ita_reopen_desert_camp_administration_desc: "Colonial officials will open a desert camp in the selected non-core state. The administration will strengthen coercive control while increasing local burden, resistance, and evidence."
ita_reopen_desert_camp_administration_effect_tt: "Consumes activation resources, opens a selected colonial camp, activates the desert administration, and increases local burden, Libyan resistance, coercive control, and evidence."
ita_authorize_homeland_emergency_detention: "Authorize Homeland Emergency Detention"
ita_authorize_homeland_emergency_detention_desc: "With overseas and occupied alternatives lost, the state will impose a desperate detention order in the selected Italian core. Its limited coercive value comes with severe domestic legitimacy, stability, resistance, and evidence costs."
ita_authorize_homeland_emergency_detention_effect_tt: "Consumes activation resources, opens the selected core emergency site, and applies the full homeland fallback penalties to stability, war support, legitimacy, resistance, and evidence."
ita_redirect_colonial_labor_to_roads_and_forts: "Redirect Colonial Labor to Roads and Forts"
ita_redirect_colonial_labor_to_roads_and_forts_desc: "Labor from the selected colonial camp will be assigned to roads and fortifications. The project will strain overseas transport and deepen the desert camp burden."
ita_redirect_colonial_labor_to_roads_and_forts_effect_tt: "Consumes overseas project resources, assigns the selected site to construction, increases desert, rail, convoy, and supply burdens, and begins the road labor mission."
ita_force_settlement_of_rebel_districts: "Force Settlement of Rebel Districts"
ita_force_settlement_of_rebel_districts_desc: "The selected colonial district will be subjected to forced settlement and expanded camp control. The operation will impose severe population harm and intensify Libyan resistance."
ita_force_settlement_of_rebel_districts_effect_tt: "Consumes settlement resources, sharply reduces stability, expands or inflicts major harm at the selected site, and increases population loss, desert burden, resistance, coercive control, and evidence."
ita_raise_colonial_security_battalions: "Raise Colonial Security Battalions"
ita_raise_colonial_security_battalions_desc: "A colonial security command will organize guards around the selected camp and begin a local sweep. The deployment will add guard demands and intensify local resistance."
ita_raise_colonial_security_battalions_effect_tt: "Consumes security resources, activates the colonial security administration, increases guard and resistance burdens, and begins a sweep at the selected site."
ita_expand_desert_transport_guard: "Expand the Desert Transport Guard"
ita_expand_desert_transport_guard_desc: "Additional guards and transport staff will protect colonial supply routes. Some convoy and overextension pressure will ease, while supply and desert camp burdens rise."
ita_expand_desert_transport_guard_effect_tt: "Consumes transport guard resources, relieves some convoy and overextension pressure, and increases supply and desert camp burdens."
ita_close_desert_camps: "Close the Desert Camps"
ita_close_desert_camps_desc: "Italy will freeze expansion, open the network to inspection, and begin dismantling every colonial camp. The reform course must survive until closure is complete."
ita_close_desert_camps_effect_tt: "Opens the reform route, freezes expansion, begins inspections and dismantlement at every colonial site, and starts the desert camp closure mission."
ita_compensate_local_communities: "Compensate Local Communities"
ita_compensate_local_communities_desc: "A compensation process will address losses inflicted by the desert camp system. Its success requires peace and the complete end of the colonial camp administration."
ita_compensate_local_communities_effect_tt: "Reduces stability in the short term, opens the colonial compensation process, increases pending redress, and begins the postwar compensation mission."
ita_desert_road_labor_project: "Desert Road Labor Project"
ita_desert_road_labor_project_desc: "A selected non-core colonial camp is supplying labor to road and fortification works. The responsible site, motorized and convoy reserves, and a camp supply burden below the high threshold must be maintained."
ita_desert_road_labor_project_success_tt: "The responsible site, motorized reserve, convoy capacity, and supply line remain intact. The project increases colonial logistics and labor output."
ita_desert_road_labor_project_failure_tt: "Loss of the site, motorized reserve, convoy capacity, or supply line defeats the project, sharply increasing desert burden, Libyan resistance, and evidence."
ita_colonial_security_sweep: "Colonial Security Sweep"
ita_colonial_security_sweep_desc: "The colonial security command is conducting a sweep around the assigned non-core camp. The responsible site must remain controlled, supply burden must stay below the high threshold, and an Italian garrison must retain half strength and one-quarter organization."
ita_colonial_security_sweep_success_tt: "The supplied responsible site remains behind an effective garrison. Immediate resistance pressure falls, though evidence and Libyan resistance still increase."
ita_colonial_security_sweep_failure_tt: "Loss of the site, responsible control, supply line, or effective garrison causes major local harm and a sharp rise in resistance and evidence."
ita_desert_camp_closure: "Desert Camp Closure"
ita_desert_camp_closure_desc: "Closure teams are dismantling the colonial camp network. Expansion must remain frozen and the reform course must stay open until the deadline."
ita_desert_camp_closure_success_tt: "Reform completes site dismantlement. If every camp closes, the desert administration and its active burdens end."
ita_desert_camp_closure_failure_tt: "Abandonment of reform exposes the network and increases colonial claims damage and Libyan resistance."
ita_postwar_colonial_compensation: "Postwar Colonial Compensation"
ita_postwar_colonial_compensation_desc: "Officials are assessing claims from communities harmed by colonial repression. Italy must be at peace, the desert camps must remain closed, and their administration must stay inactive."
ita_postwar_colonial_compensation_success_tt: "Peace and complete closure allow compensation to reduce colonial claims damage and Libyan resistance."
ita_postwar_colonial_compensation_failure_tt: "War or a surviving desert administration defeats compensation and exposes the unresolved crisis."
ita_colonial_repression_legacy: "Colonial Repression Legacy"
ita_colonial_repression_legacy_desc: "The administrative legacy of colonial repression continues to consume political authority."
ita_desert_camp_administration: "Desert Camp Administration"
ita_desert_camp_administration_desc: "The desert camp system supports construction while weakening stability and straining supply."
ita_libyan_resistance_pressure: "Libyan Resistance Pressure"
ita_libyan_resistance_pressure_desc: "Colonial violence and forced settlement fuel resistance, reducing stability and political authority while burdening supply."
ita_colonial_logistics_output: "Colonial Logistics Output"
ita_colonial_logistics_output_desc: "Road, fortification, and extraction projects improve construction and local resource output."
ita_postwar_colonial_claim_damage: "Postwar Colonial Claim Damage"
ita_postwar_colonial_claim_damage_desc: "Unresolved colonial claims consume civilian resources and undermine stability and political legitimacy."
ita_colonial_reform_credit: "Colonial Reform Credit"
ita_colonial_reform_credit_desc: "Camp closure and compensation have restored a measure of stability and political trust."

# Belgium and Congo
bel_expand_concession_labor_quotas: "Expand Concession Labor Quotas"
bel_expand_concession_labor_quotas_desc: "The selected Congolese concession state will receive a higher labor quota or a new coercive site. The order will deepen population damage, unrest, evidence, and the burden imposed on Congo."
bel_expand_concession_labor_quotas_effect_tt: "Consumes activation resources, opens or expands the selected concession site, increases Congolese autonomy pressure, and begins a resource quota cycle with burden scaled to the site's prior status."
bel_route_labor_to_rubber_and_minerals: "Route Labor to Rubber and Minerals"
bel_route_labor_to_rubber_and_minerals_desc: "Labor from the selected concession site will be directed toward rubber and mineral extraction. The quota will burden Congo and provoke unrest while feeding Belgium's colonial economy."
bel_route_labor_to_rubber_and_minerals_effect_tt: "Consumes overseas project resources, assigns the selected resource site to a quota cycle, and sharply increases concession labor burden, unrest, and autonomy pressure."
bel_build_congo_transport_corridors: "Build Congo Transport Corridors"
bel_build_congo_transport_corridors_desc: "A transport corridor will link the selected Congolese site to export routes. The project will strain rail and convoy capacity and increase the local labor burden."
bel_build_congo_transport_corridors_effect_tt: "Consumes overseas project resources, assigns the selected site to corridor construction, increases labor and transport burdens, and begins the corridor mission."
bel_suppress_colonial_strikes: "Suppress Colonial Strikes"
bel_suppress_colonial_strikes_desc: "Security forces will break strikes around the selected concession site. Extraction may recover, but severe local harm, unrest, population damage, and evidence will follow."
bel_suppress_colonial_strikes_effect_tt: "Selects the suppression response, consumes security resources, inflicts major harm at the strike site, and increases output, unrest, accountability pressure, and evidence."
bel_negotiate_colonial_strike_settlement: "Negotiate a Colonial Strike Settlement"
bel_negotiate_colonial_strike_settlement_desc: "Open talks with strike representatives and local administrators before the concession crisis hardens. A settlement will reduce unrest and extraction pressure while strengthening the reform course."
bel_negotiate_colonial_strike_settlement_effect_tt: "Selects the negotiated response, reduces colonial unrest and excessive resource pressure, strengthens reform, and commits civilian resources during the talks."
bel_open_international_inspection: "Open an International Inspection"
bel_open_international_inspection_desc: "International inspectors will receive access to the concession system. Expansion will halt while reformers examine labor practices, output records, and surviving evidence."
bel_open_international_inspection_effect_tt: "Opens inspection and reform, freezes expansion, reduces resource output and evidence pressure, and substantially increases reform progress."
bel_reform_concession_system: "Reform the Concession System"
bel_reform_concession_system_desc: "The concession labor system will be placed under a binding reform mandate. Active sites will enter dismantlement while expansion remains frozen."
bel_reform_concession_system_effect_tt: "Maintains international inspection, opens reform, freezes expansion, begins dismantlement at every colonial site, and starts the concession reform mandate."
bel_recognize_local_administration: "Recognize Local Administration"
bel_recognize_local_administration_desc: "Belgium will recognize a wider role for Congolese local authorities in the former concession districts. The settlement will ease labor, unrest, accountability, and autonomy pressure."
bel_recognize_local_administration_effect_tt: "Reduces stability in the short term, grants autonomy concessions across responsible Congolese sites, and substantially reduces labor burden, unrest, and postwar accountability pressure."
bel_congo_resource_quota_cycle: "Congo Resource Quota Cycle"
bel_congo_resource_quota_cycle_desc: "A selected concession site is working through another resource quota. It must remain active, responsible, resource-bearing, and controlled while motorized, train, and convoy reserves are maintained."
bel_congo_resource_quota_cycle_success_tt: "The responsible resource site and all three transport reserves remain available. Colonial resource and labor output increase."
bel_congo_resource_quota_cycle_failure_tt: "Loss of the site, its resource eligibility, responsible control, or any transport reserve increases unrest, accountability pressure, and evidence."
bel_congo_transport_corridor_project: "Congo Transport Corridor Project"
bel_congo_transport_corridor_project_desc: "A selected Congolese site is building a transport corridor. It must remain active, responsible, and controlled while motorized, train, convoy, and civilian project capacity are maintained."
bel_congo_transport_corridor_project_success_tt: "The responsible corridor site, all three transport reserves, and civilian project capacity remain available. Resource output rises and some overextension is relieved."
bel_congo_transport_corridor_project_failure_tt: "Loss of the site, responsible control, any transport reserve, or civilian project capacity sharply increases concession, rail, and convoy burdens."
bel_colonial_strike_response: "Colonial Strike Response"
bel_colonial_strike_response_desc: "A strike around the concession system demands a decision before the response period ends. Belgium may negotiate, place the system under reform, suppress the strike, or leave the crisis unanswered."
bel_colonial_strike_response_success_tt: "A chosen response resolves the immediate strike. Negotiation and reform relieve pressure. Suppression imposes harsher local and evidentiary consequences."
bel_colonial_strike_response_failure_tt: "Ignoring the strike lowers reliable output while unrest, accountability pressure, visibility, and preserved evidence deepen."
bel_concession_reform_mandate: "Concession Reform Mandate"
bel_concession_reform_mandate_desc: "The concession system is undergoing supervised reform. Expansion must stay frozen, reform must remain open, and Belgium or its subjects must retain a Congolese concession state."
bel_concession_reform_mandate_success_tt: "The mandate completes dismantlement. If every site closes, concession burden, resource pressure, and unrest are cleared."
bel_concession_reform_mandate_failure_tt: "Abandonment of reform or loss of the Congolese administrative basis exposes the system and sharply increases accountability pressure."
bel_congo_concession_labor_system: "Congo Concession Labor System"
bel_congo_concession_labor_system_desc: "The concession system raises local resource output while imposing a persistent stability cost."
bel_congo_extraction_pressure: "Congo Extraction Pressure"
bel_congo_extraction_pressure_desc: "Intensified extraction expands resources and construction while destabilizing the colonial administration."
congo_concession_labor_burden: "Concession Labor Burden"
congo_concession_labor_burden_desc: "Congo bears the political and demographic costs of coercive concession labor, weakening stability, authority, and available manpower."
bel_colonial_resource_output: "Colonial Resource Output"
bel_colonial_resource_output_desc: "Colonial transport and extraction programs increase local resources and construction capacity."
bel_postwar_accountability_pressure: "Postwar Accountability Pressure"
bel_postwar_accountability_pressure_desc: "Surviving concession records and unresolved claims consume civilian resources and undermine Belgian stability and legitimacy."
bel_strike_settlement_commitment: "Colonial Strike Settlement"
bel_strike_settlement_commitment_desc: "Civilian administrators, transport capacity, and public funds remain committed while the Congo settlement talks continue."
bel_congo_reform_credit: "Congo Reform Credit"
bel_congo_reform_credit_desc: "Inspection, concession reform, and recognition of local administration have strengthened political trust and stability."
camp_rework_bel_congo_autonomy_pressure: "Belgian Concession Labor Pressure"
camp_rework_bel_congo_autonomy_concession: "Congolese Administration Concession"
chaosx_genocide.50.t: "The Raj Detention Registers"
chaosx_genocide.50.d: "Inspectors have entered a detention compound in India and secured its surviving registers. Orders, labor assignments, and population records connect the local administration to a wider imperial system. The evidence is being copied before another office can close the files."
chaosx_genocide.51.t: "The Relocation Dockets"
chaosx_genocide.51.d: "Court files and administrative orders have opened the wartime relocation system to public review. Emergency authority displaced communities, assigned labor, and resisted legal scrutiny. Public debate now centers on the redress owed to those harmed by the system."
chaosx_genocide.52.t: "Registers from the Camps"
chaosx_genocide.52.d: "A liberated camp administration has yielded transport lists, guard rosters, and labor accounts. The documents link metropolitan authority, collaboration offices, and colonial projects across the same chain of command. Copies have reached investigators before the archive could be dispersed."
chaosx_genocide.53.t: "Files Beneath the Desert Sand"
chaosx_genocide.53.d: "A desert camp has fallen with its ledgers still intact. Road gangs, security sweeps, forced settlement orders, and missing population records now form a single account of colonial repression. The authorities responsible can no longer dismiss each entry as an isolated emergency."
chaosx_genocide.54.t: "The Congo Labor Ledgers"
chaosx_genocide.54.d: "Concession ledgers recovered in the Congo record quotas, transport assignments, resource deliveries, and the penalties imposed when districts fell behind. The entries connect local coercion to the government and companies that benefited from it. Investigators have secured the account books."
chaosx_genocide.55.t: "The Camp Registers"
chaosx_genocide.55.d: "Troops and investigators have entered a repression site with its records intact. Registers, physical traces, and witness statements identify a wider network and the administration that maintained it, establishing a documented case for foreign investigators."
chaosx_genocide.56.t: "The Auschwitz Registers"
chaosx_genocide.56.d: "Investigators at Auschwitz have secured laboratory files, transport records, and orders linking the complex to the German camp network. The archive traces authority beyond the guards at the gate and into the institutions that supplied prisoners, equipment, and protection. The evidence is already leaving the site."
chaosx_genocide.57.t: "The Pingfang Records"
chaosx_genocide.57.d: "Medical files and laboratory inventories recovered from the Japanese biological warfare network connect experiments in occupied territory to the officers who directed them. Whether the trail began at Pingfang or one of its linked facilities, it no longer ends behind an army seal."
chaosx_genocide.58.t: "The Gulag Archives"
chaosx_genocide.58.d: "Camp registers, deportation lists, grain orders, and local mortality reports have survived the retreat of Soviet authority. Together they connect the labor network to famine pressure and political repression across the periphery. Successor administrations and foreign investigators are reading the same record."
chaosx_genocide.60.t: "The Vichy Reckoning"
chaosx_genocide.60.d: "Liberated archives have joined Vichy internment records to collaboration transfers and colonial labor projects. The evidence crosses former administrative boundaries and names the authorities that preserved them. France now faces a reckoning that neither occupation nor regime change can erase."
chaosx_genocide.61.t: "The Congo Accounts"
chaosx_genocide.61.d: "The Congo concession system has become an international case. Quota ledgers, transport records, population losses, and testimony show how colonial extraction was enforced and who profited from it. Governments abroad are demanding inspection, reform, and accountability."
chaosx_genocide.62.t: "Colonial Records Reach the World"
chaosx_genocide.62.d: "Detention registers and coerced labor accounts from a colonial administration have passed beyond official control. Former subjects, investigators, and foreign governments can now compare the orders with their human cost. The empire's private files have become public evidence."
chaosx_genocide.63.t: "A Repression Network Exposed"
chaosx_genocide.63.d: "Evidence from a severe camp site has reached governments and newspapers abroad. Registers, physical traces, and testimony connect local violence to a responsible national administration, and an international response is forming around the preserved record."
