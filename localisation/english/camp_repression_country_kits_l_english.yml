japan_evacuate_pingfang_research_staff_cost: "£GFX_motorized_equipment_text_icon §Y[?global.black_friday_price_camp_rework_equipment_cost_motorized_equipment|0]§!  £GFX_train_texticon §Y[?global.black_friday_price_camp_rework_equipment_cost_trains|0]§!  £support_equipment_text_icon §Y[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§!"
