japan_china_manchuria_pool_required_tt: "Requires a responsible state under Japanese or subject control in the occupied China and Manchuria pool."
japan_colonial_pool_required_tt: "Colonial occupation states become valid only when no China or Manchuria pool state remains available."
japan_home_island_fallback_penalty_tt: "Home-island detention is available only after the occupation territories are exhausted during a desperate high-chaos war. It inflicts severe stability, obedience, review, and evidence costs for reduced research value."
japan_pingfang_anchor_required_tt: "Requires responsible Japanese or subject control of state 328, the fixed Pingfang anchor."
japan_ishii_project_gate_tt: "Each Ishii project requires the appropriate combination of Pingfang facilities, surviving records, influence, autonomy, experiment sites, outbreak pressure, or desperate wartime conditions."
japan_outbreak_risk_effect_tt: "Containment supplies and the emergency office reduce current outbreak accident risk, but surviving records and evidence remain."
japan_pingfang_records_choice_tt: "The selected Pingfang route starts a 45-day retreat operation. Destroying records and evacuating staff carry different evidence, tribunal, and outbreak consequences."
camp_ledger_country_panel_japan: "Army Detention and Research"
camp_ledger_ishii_influence: "Ishii Influence"
camp_ledger_ishii_influence_tt: "Shiro Ishii's personal influence over the occupation research program and its military patrons."
camp_ledger_kwantung_autonomy: "Kwantung Autonomy"
camp_ledger_kwantung_autonomy_tt: "The independence of the Kwantung Army's medical and occupation offices from central review."
camp_ledger_pingfang_facility_level: "Pingfang Facility Level"
camp_ledger_pingfang_facility_level_tt: "The stage of development reached by the Pingfang research complex."
camp_ledger_occupation_test_records: "Occupation Test Records"
camp_ledger_occupation_test_records_tt: "The accumulated coercive research archive drawn from occupied territory."
camp_ledger_outbreak_accident_risk: "Outbreak Accident Risk"
camp_ledger_outbreak_accident_risk_tt: "Current danger that the secret research network produces an uncontrolled occupied-territory outbreak."
camp_ledger_imperial_army_review_pressure: "Imperial Army Review Pressure"
camp_ledger_imperial_army_review_pressure_tt: "Pressure within the Imperial Army to investigate, subordinate, or close Ishii's program."
camp_ledger_country_values_japan: "Ishii's influence is [GetCampIshiiInfluenceBandName]. The Kwantung Army's freedom of action is [GetCampKwantungAutonomyBandName].\nThe Pingfang complex is [GetCampPingfangStatusName].\nThe danger of an uncontrolled outbreak is [GetCampOutbreakAccidentRiskBandName]."
japan_army_medical_review_mission: "Army Medical Review"
japan_army_medical_review_mission_desc: "Army inspectors are pressing the program's patrons to reduce Ishii's influence. His authority must fall below the high threshold before the review expires."
japan_army_medical_review_mission_success: "Ishii's influence is reduced enough for the army review to impose effective control."
japan_army_medical_review_mission_failure: "Ishii retains excessive influence when the army review concludes."
japan_army_medical_review_mission_cancelled: "The formal review is withdrawn before a verdict. Its unresolved files still increase army review pressure."
japan_epidemic_containment_mission: "Epidemic Containment Emergency"
japan_epidemic_containment_mission_desc: "The containment office is racing to restore order and reduce the outbreak danger. The risk must fall below the medium threshold before the emergency period ends."
japan_epidemic_containment_mission_success: "Containment measures reduce the outbreak danger below the medium threshold."
japan_epidemic_containment_mission_failure: "The outbreak danger remains too high when the containment period ends."
japan_epidemic_containment_mission_cancelled: "The containment mandate is withdrawn before resolution. The unanswered emergency increases army review pressure."
japan_pingfang_evacuation_mission: "Evacuation of Pingfang"
japan_pingfang_evacuation_mission_desc: "Staff and selected files are leaving Pingfang under wartime pressure. Japan or its subject must hold the site until the evacuation is complete."
japan_pingfang_evacuation_mission_success: "Staff and selected files leave Pingfang before control is lost."
japan_pingfang_evacuation_mission_failure: "Pingfang falls before staff and selected files can leave, exposing the site and increasing tribunal pressure."
japan_pingfang_evacuation_mission_cancelled: "The retreat order is withdrawn before the operation resolves. No route is completed and army review pressure rises."
japan_prisoner_experiment_shutdown_mission: "Shutdown of the Prisoner Experiment Network"
japan_prisoner_experiment_shutdown_mission_desc: "Authorities are closing the coercive research network and securing its hazardous legacy. A critical outbreak during the process would turn the shutdown into a disaster."
japan_prisoner_experiment_shutdown_mission_success: "Every responsible experiment site remains under usable control and the prisoner experiment network is shut down."
japan_prisoner_experiment_shutdown_mission_failure: "A critical outbreak or loss of control over any operating experiment site defeats the shutdown operation."
japan_prisoner_experiment_shutdown_mission_cancelled: "The shutdown mandate is withdrawn while all experiment sites remain closable. Active closure work ends and the unresolved sites remain under review."
japan_dormant_occupation_apparatus: "Dormant Occupation Apparatus"
japan_dormant_occupation_apparatus_desc: "The offices and patrons of the occupation research apparatus remain embedded in the state, burdening political authority even while the network is inactive."
japan_imperial_occupation_repression: "Imperial Occupation Repression"
japan_imperial_occupation_repression_desc: "Occupation detention and coercion deepen instability and place mounting demands on military supply."
japan_forced_labor_experiment_network: "Forced Labor Experiment Network"
japan_forced_labor_experiment_network_desc: "A secret network links forced-labor sites to coercive military institutions. Its abuses erode stability and strain supply."
japan_ishii_program_authority: "Ishii Program Authority"
japan_ishii_program_authority_desc: "Ishii's personal command shields the institution from oversight and steadily undermines confidence in the state."
japan_kwantung_medical_autonomy: "Kwantung Medical Autonomy"
japan_kwantung_medical_autonomy_desc: "The Kwantung Army's medical offices operate beyond ordinary oversight, consuming political authority and supplies while shielding the program from scrutiny."
japan_biowarfare_outbreak_pressure: "Outbreak Emergency Pressure"
japan_biowarfare_outbreak_pressure_desc: "A spreading public health emergency consumes civilian goods and transport while reducing stability and the population available for service."
japan_imperial_army_review: "Imperial Army Review"
japan_imperial_army_review_desc: "The army is investigating the program's command structure and records. The inquiry imposes political costs while offering a path to firmer oversight."
japan_pingfang_exposure_pressure: "Pingfang Exposure Pressure"
japan_pingfang_exposure_pressure_desc: "Witnesses and surviving records from Pingfang are damaging political legitimacy and forcing the government to answer for the program."
japan_biowarfare_program_overextension: "Secret Program Overextension"
japan_biowarfare_program_overextension_desc: "The research network has exceeded its administrative and logistical capacity, raising consumer costs and destabilizing the occupation system."
japan_reformed_biowarfare_legacy: "Reformed Research Legacy"
japan_reformed_biowarfare_legacy_desc: "Containment, documentation and institutional reform continue after the coercive program closes. The work consumes civilian resources while gradually restoring stability."

# Soviet Union
sov_release_prisoners_for_military_service: "Release Prisoners from Forced Labor"
sov_release_prisoners_for_military_service_desc: "Release surviving prisoners from Gulag labor into civilian life.\n[This.GetSovServiceReleaseConsequence]"
sov_release_prisoners_first_consequence: "The national order lowers forced-work quotas, eases famine pressure and old grievances, and strengthens demands for reform."
sov_release_prisoners_repeat_consequence: "The national policy settlement is already in force. This order releases recorded survivors without repeating quota, famine, grievance or reform relief."
sov_release_prisoners_for_military_service_rows_tt: "At least one operating Gulag under our authority must hold recorded living prisoners. Every operating Gulag under our authority must have complete, consistent custody records."
camp_rework_soviet_service_release_policy_enacted: "The national prisoner-release settlement is in force"
sov_dismantle_overextended_gulags: "Dismantle the Gulag Network"
sov_dismantle_overextended_gulags_desc: "The camps under this administration will be closed. Dismantlement consumes resources and provokes the NKVD, but can relieve the burden on the state and its prisoners."
sov_dismantle_gulag_custody_tt: "Requires an eligible Gulag site and authority over every targeted site. Custody records must be consistent before resources are committed."
sov_emergency_famine_relief: "Organize Emergency Famine Relief"
sov_emergency_famine_relief_desc: "Divert trains, trucks, and support equipment to the hungry districts and reduce grain extraction and forced-labor quotas. Relief succeeds when famine pressure falls below §Y[?constant:camp_rework_threshold.band_medium|0]§!."
sov_admit_local_administrative_collapse: "Admit Administrative Collapse in [FROM.GetName]"
sov_admit_local_administrative_collapse_desc: "The government will acknowledge the breakdown in [FROM.GetName] and permit relief officials to document the disaster. The admission will expose state failure while opening a path toward recovery."
sov_admit_local_administrative_collapse_effect_tt: "Documents this site's famine and preserves its evidence. Relief lowers famine pressure and administrative corruption, while NKVD authority weakens and public reform pressure rises."
sov_paranoia_medium_required_tt: "Requires paranoia pressure of at least 40."
sov_paranoia_high_required_tt: "Requires paranoia pressure of at least 65."
sov_paranoia_critical_required_tt: "Requires paranoia pressure of at least 85, an extreme Soviet focus, global chaos tier 4 or 5, or terminal Union Crisis pressure."
sov_gulag_periphery_pool_required_tt: "Requires a remote gulag, borderland, periphery, industrial prison-labor, or political-opposition state pool."
sov_dismantle_overextended_gulags_cost: "£manpower_texticon §Y[?global.black_friday_price_camp_rework_cost_dismantle_manpower|.1*]§!  £support_equipment_text_icon §Y[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§!"
sov_dismantle_overextended_gulags_cost_blocked: "£manpower_texticon §R[?global.black_friday_price_camp_rework_cost_dismantle_manpower|.1*]§!  £support_equipment_text_icon §R[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§!"
sov_emergency_famine_relief_cost: "£motorized_equipment_text_icon §Y[?global.black_friday_price_camp_rework_equipment_cost_motorized_equipment|0]§!  £train_texticon §Y[?global.black_friday_price_camp_rework_equipment_cost_trains|0]§!  £support_equipment_text_icon §Y[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§!"
sov_emergency_famine_relief_cost_blocked: "£motorized_equipment_text_icon §R[?global.black_friday_price_camp_rework_equipment_cost_motorized_equipment|0]§!  £train_texticon §R[?global.black_friday_price_camp_rework_equipment_cost_trains|0]§!  £support_equipment_text_icon §R[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§!"
sov_union_crisis_suppression_cap_tt: "Material repression always increases gulag memory, republic fear, and old-movement grievance. During an active Union Crisis, authority and obedience relief is limited to 8 total points and is granted only below 86 collapse threat."
sov_union_crisis_relief_stopped_tt: "Union Crisis relief is unavailable while the crisis is inactive, after terminal collapse, or once coercion can no longer restore obedience. Harmful repression memory and grievance still rise."
sov_famine_pressure_effect_tt: "This action increases or preserves famine pressure, republic fear, grievance, evidence, or tribunal exposure according to the current procurement and concealment policy."
sov_emergency_famine_relief_cost_tooltip: "£pol_power §Y[?global.black_friday_price_camp_rework_cost_labor_project_pp|0]§!\n$sov_emergency_famine_relief_cost$\nEvery listed resource must be available. Equipment is committed once when relief begins."
sov_famine_relief_effect_tt: "Reduces grain extraction and forced-labor quotas and begins the relief effort. Redistributing rations lowers stability (§R[?constant:camp_rework_soviet.emergency_relief_stability|%0]§!). Lower famine pressure below §Y[?constant:camp_rework_threshold.band_medium|0]§! before the relief mandate expires. Evidence of the deaths remains."
sov_gulag_dismantlement_effect_tt: "Begins the 270-day closure of every Soviet gulag under this administration. Every site must remain under Soviet or subject control for the dismantlement to succeed."
camp_ledger_country_panel_soviet: "Gulag Administration"
camp_ledger_paranoia_pressure: "Paranoia Pressure"
camp_ledger_paranoia_pressure_tt: "Paranoia pressure reflects the active Soviet security climate and the fear surrounding central authority."
camp_ledger_nkvd_authority: "NKVD Authority"
camp_ledger_nkvd_authority_tt: "The security apparatus's authority over gulag administration, party review, and reform resistance."
camp_ledger_gulag_network_reach: "Gulag Network Reach"
camp_ledger_gulag_network_reach_tt: "The territorial and administrative reach of the operating Soviet gulag system."
camp_ledger_grain_extraction_burden: "Grain Extraction Burden"
camp_ledger_grain_extraction_burden_tt: "The accumulated procurement burden that drives local famine pressure and recurring crisis risk."
camp_ledger_famine_pressure: "Famine Pressure"
camp_ledger_famine_pressure_tt: "The country's current famine crisis pressure, refreshed from affected states and procurement policy."
camp_ledger_old_movement_grievance: "Old Movement Grievance"
camp_ledger_old_movement_grievance_tt: "Grievance carried by republics and opposition networks from confiscation, deportation, gulag repression, and famine."
camp_ledger_union_crisis_suppression_relief: "Union Crisis Suppression Relief"
camp_ledger_union_crisis_suppression_relief_tt: "The temporary authority and obedience already drawn from repression during the active Union Crisis."
camp_ledger_country_values_soviet: "The Gulag extends across [?display_gulag_reach|0] sites under NKVD authority.\nState paranoia is [GetCampParanoiaBandName].\nThe continuing toll of grain seizures and famine is [GetCampFaminePressureBandName]."
camp_union_relief_capped: "Exhausted: Further Repression Gives No Relief"
sov_emergency_famine_relief_mission: "Emergency Famine Relief"
sov_emergency_famine_relief_mission_desc: "Relief columns are moving into the hungry districts. Reduce famine pressure below §Y[?constant:camp_rework_threshold.band_medium|0]§! before their mandate expires."
sov_emergency_famine_relief_mission_success: "Famine pressure falls below §Y[?constant:camp_rework_threshold.band_medium|0]§! during the relief effort."
sov_emergency_famine_relief_mission_failure: "Famine pressure remains too high when the relief effort ends, renewing the crisis and worsening corruption and evidence pressure."
sov_emergency_famine_relief_mission_cancelled: "The relief mandate is withdrawn before resolution. The interruption adds famine pressure and leaves the affected districts without a settlement."
sov_overextended_gulag_dismantlement_mission: "Gulag Network Dismantlement"
sov_overextended_gulag_dismantlement_mission_desc: "Closure teams are dismantling the Gulag network. The operation will fail if the reform course is abandoned while NKVD authority remains severe."
sov_overextended_gulag_dismantlement_mission_success: "Every responsible gulag site remains under usable control and the designated network is dismantled without an NKVD reversal."
sov_overextended_gulag_dismantlement_mission_failure: "Severe NKVD authority, abandonment of reform, or loss of control over any gulag site defeats the dismantlement effort."
sov_overextended_gulag_dismantlement_mission_cancelled: "The closure mandate is withdrawn while all gulag sites remain closable. Active dismantlement ends and the unresolved sites remain under review."
sov_dormant_gulag_legacy: "Dormant Gulag Legacy"
sov_dormant_gulag_legacy_desc: "The gulag's former offices and political habits continue to burden state authority even while the network remains inactive."
sov_gulag_network_administration: "Gulag Network Administration"
sov_gulag_network_administration_desc: "The centralized gulag administration erodes stability through confinement and coercion."
sov_nkvd_repression_authority: "NKVD Repression Authority"
sov_nkvd_repression_authority_desc: "Expanded NKVD authority strengthens political control while deepening fear and instability across the state."
sov_forced_labor_output: "Forced Labor Output"
sov_forced_labor_output_desc: "Forced-labor quotas destabilize society and place further demands on the supply system."
sov_gulag_corruption_and_overextension: "Gulag Corruption and Overextension"
sov_gulag_corruption_and_overextension_desc: "An overgrown camp bureaucracy diverts consumer resources, weakens stability and war support, and places heavy demands on supply."
sov_famine_pressure: "Famine Pressure"
sov_famine_pressure_desc: "Food shortages and administrative coercion undermine stability, burden transport, and reduce the population available for service."
sov_republic_fear_and_grievance: "Republic Fear and Grievance"
sov_republic_fear_and_grievance_desc: "Memories of confiscation, deportation, and repression weaken political legitimacy and the willingness of the republics to support the center."
sov_gulag_reform_pressure: "Gulag Reform Pressure"
sov_gulag_reform_pressure_desc: "Closing camps and reviewing their officials requires civilian resources and political effort, while offering a route toward renewed stability."
sov_post_collapse_repression_legacy: "Post-Collapse Repression Legacy"
sov_post_collapse_repression_legacy_desc: "Successor authorities must confront the records, victims, and regional grievances left by the gulag and famine administration."

# United Kingdom and British Raj
uk_imperial_detention_legacy: "Imperial Detention Legacy"
uk_imperial_detention_legacy_desc: "The surviving legal and administrative legacy of imperial detention consumes political authority even after the active network has receded."
uk_imperial_detention_administration: "Imperial Detention Administration"
uk_imperial_detention_administration_desc: "A centralized colonial detention service supports construction while undermining stability and increasing supply consumption."
uk_overextended_imperial_detention: "Overextended Imperial Detention"
uk_overextended_imperial_detention_desc: "The imperial detention network has outgrown its resources, burdening consumer supply, political stability, war support, and logistics."
raj_colonial_labor_burden: "Colonial Labor Burden"
raj_colonial_labor_burden_desc: "India bears the social and demographic cost of coercive imperial labor demands, weakening stability, political authority, and available manpower."
uk_imperial_reform_credit: "Imperial Reform Credit"
uk_imperial_reform_credit_desc: "Credible releases and institutional reform have restored a measure of stability and political trust."
uk_colonial_reckoning_pressure: "Colonial Reckoning Pressure"
uk_colonial_reckoning_pressure_desc: "The unresolved record of imperial detention consumes civilian resources and damages stability and political legitimacy."
camp_rework_uk_raj_autonomy_pressure: "Imperial Detention Pressure"
camp_rework_uk_raj_autonomy_concession: "Indian Detention Reform Concession"

# United States
usa_wartime_security_authority: "Wartime Security Authority"
usa_wartime_security_authority_desc: "Emergency federal powers strengthen wartime mobilization and political control while weakening domestic stability."
usa_contested_relocation_authority: "Contested Relocation Authority"
usa_contested_relocation_authority_desc: "Legal challenges and public opposition to relocation authority consume civilian resources and erode stability and political legitimacy."
usa_civil_liberties_damage: "Civil Liberties Damage"
usa_civil_liberties_damage_desc: "Mass detention has damaged constitutional confidence, weakening stability, war support, and political authority."
usa_relocation_population_disruption: "Relocation Population Disruption"
usa_relocation_population_disruption_desc: "Forced displacement disrupts communities, increases civilian costs, weakens stability, and strains supply."
usa_redress_pressure: "Redress Pressure"
usa_redress_pressure_desc: "Unresolved claims for restitution consume civilian resources and political attention."
usa_reform_credit: "Civil Liberties Reform Credit"
usa_reform_credit_desc: "Judicial review, closure, and redress have restored a measure of public trust and political stability."

# France, Vichy France, and North Africa
fr_collaboration_transfer_records: "Transfer Collaboration Records"
fr_collaboration_transfer_records_desc: "Records from the selected camp will be transferred into the German collaboration chain. The move shares responsibility while increasing evidence, visibility, and future tribunal exposure."
fr_collaboration_transfer_records_effect_tt: "Reduces stability, assigns Germany secondary responsibility for the selected site, and increases its evidence depth, government visibility, tribunal pressure, and refugee pressure."
fr_post_liberation_reckoning: "Post-Liberation Reckoning"
fr_post_liberation_reckoning_desc: "The government is confronting the records, victims, and institutions left by collaboration and colonial forced labor. The process consumes resources and political attention while a democratic reform course seeks closure."
fr_camp_legacy: "French Camp Legacy"
fr_camp_legacy_desc: "Inherited camp institutions and unresolved records continue to consume political authority."
vichy_collaboration_repression: "Vichy Collaboration Repression"
vichy_collaboration_repression_desc: "Vichy's collaboration apparatus supports coercive construction while damaging stability and binding the regime more closely to political repression."
fr_north_africa_labor_burden: "North African Labor Burden"
fr_north_africa_labor_burden_desc: "Colonial labor demands consume civilian resources, destabilize North Africa, and strain overseas supply."
fr_refugee_pressure: "Refugee Pressure"
fr_refugee_pressure_desc: "Displacement, internment, and blocked rescue routes increase civilian costs while eroding stability and political legitimacy."
fr_refugee_aid_commitment: "Refugee Aid Commitment"
fr_refugee_aid_commitment_desc: "Civilian factories and transport offices have been assigned to relief committees and rescue networks for the duration of the emergency response."
free_france_reform_credit: "Free French Reform Credit"
free_france_reform_credit_desc: "Inspection, relief, and institutional reform have strengthened political trust in the restored republic."
camp_rework_france_colonial_autonomy_pressure: "French Colonial Labor Pressure"
camp_rework_france_colonial_autonomy_concession: "French Colonial Reform Concession"

