l_english:
cbrn_hq_operations_section: "CBRN Operations Section"
cbrn_hq_operations_section_desc: "A theater staff for chemical planning, payload coordination, protected exploitation, and command-level CBRN logistics. Its instruments, masks, and signal stores are essential to maintaining an offensive fire plan while shortening chemical headquarters preparation."
cbrn_hq_intelligence_weather_cell: "Chemical Intelligence and Weather Cell"
cbrn_hq_intelligence_weather_cell_desc: "Forecast teams, reconnaissance analysts, and mobile sampling parties combine weather observations with enemy CBRN intelligence."
cbrn_hq_protective_logistics_section: "Protective Logistics Section"
cbrn_hq_protective_logistics_section_desc: "A theater reserve of masks, filters, transport, and issue records capable of sustaining a protective posture across an army."
cbrn_hq_mobile_decontamination_column: "Mobile Decontamination Column"
cbrn_hq_mobile_decontamination_column_desc: "Wash vehicles, decontaminants, protected crews, and route-control teams organized to support selected contaminated corridors."
cbrn_hq_medical_countermeasure_directorate: "Medical Countermeasure Directorate"
cbrn_hq_medical_countermeasure_directorate_desc: "Protected treatment stations, casualty transport, antidote control, and mass-casualty triage coordinated at theater level."
cbrn_hq_biological_security_section: "Biological Security Section"
cbrn_hq_biological_security_section_desc: "Epidemiological intelligence, laboratory sampling, disinfection, and cordon planning for suspected or confirmed biological threats."

CBRN_PREPARE_CHEMICAL_OFFENSIVE_NAME: "Prepare Chemical Offensive"
CBRN_PREPARE_CHEMICAL_OFFENSIVE_DESC: "Commit the headquarters to a readiness-scaled chemical fire plan. The order consumes masks, wears down military filters, draws on instruments and support stores, and costs §Y20 / 40 / 60§! £command_power by force band. Once prepared, the posture lasts §Y7 days§!. A separate authorized delivery order must select and expend the actual agent before any exposure occurs.\n\n$CBRN_HQ_FORCE_BANDS_TT$"
CBRN_PREPARE_CHEMICAL_OFFENSIVE_TRIGGER_TT: "Requires a deployed §YCBRN Operations Section§!, an army with assigned divisions, operational Chemical Readiness, a use policy permitting battlefield release, chemical payload reserves, and the full command-power and operating-stock package. No other CBRN headquarters posture may be committed."
CBRN_PREPARE_CHEMICAL_OFFENSIVE_EFFECT_TT: "Begins §Y7–21 days§! of readiness-scaled preparation and commits the selected force-band stores. High military respiratory protection shortens preparation. Active effect: §G+5% Planning Speed§!, §G+5% Maximum Planning§!, and §R+10% Supply Consumption§!. Cooldown: §Y90 days§!. This order prepares delivery; it does not release an agent."

CBRN_THEATER_PROTECTIVE_POSTURE_NAME: "Theater Protective Posture"
CBRN_THEATER_PROTECTIVE_POSTURE_DESC: "Order theater-wide mask issue, filter discipline, protected movement, and exposure reporting. The posture consumes masks and support stores at activation and weekly thereafter, wears down military filters while sustained, costs §Y10 / 22 / 35§! £command_power by force band, and remains active for §Y28 days§! while supplied.\n\n$CBRN_HQ_FORCE_BANDS_TT$"
CBRN_THEATER_PROTECTIVE_POSTURE_TRIGGER_TT: "Requires a deployed §YProtective Logistics Section§!, an active CBRN program, national mask reserves, the full command-power and operating-stock package, and no other committed CBRN headquarters posture."
CBRN_THEATER_PROTECTIVE_POSTURE_EFFECT_TT: "Begins §Y1–3 days§! of preparation, then sustains a §Y28-day§! protective posture. Active effect: §R-5% Army Speed§!, §R-3% Army Attack§!, §G-5% Organisation Loss While Moving§!, §G-10% Wounded Chance§!, and §R+8% Supply Consumption§!. Cooldown: §Y14 days§!. Unpaid weekly mask or support-equipment upkeep ends its benefits."

CBRN_DECONTAMINATION_CORRIDOR_NAME: "Establish Decontamination Corridor"
CBRN_DECONTAMINATION_CORRIDOR_DESC: "Commit wash columns and protected route crews to support selected contaminated-state operations. The order consumes decontamination equipment, trucks, masks, support stores, and fuel, costs §Y10 / 28 / 45§! £command_power by force band, and lasts §Y28 days§! while supplied.\n\n$CBRN_HQ_FORCE_BANDS_TT$"
CBRN_DECONTAMINATION_CORRIDOR_TRIGGER_TT: "Requires a deployed §YMobile Decontamination Column§!, controlled chemical contamination, the full command-power and operating-stock package, and no other committed CBRN headquarters posture."
CBRN_DECONTAMINATION_CORRIDOR_EFFECT_TT: "Begins §Y3–7 days§! of preparation, then sustains a §Y28-day§! corridor posture. Active penalty: §R-3% Army Speed§! and §R+5% Supply Consumption§!. Cooldown: §Y30 days§!. Selected-state cleanup remains tied to the corresponding decontamination operation. Unpaid weekly upkeep ends the posture."

CBRN_SEAL_OPERATIONAL_AREA_NAME: "Seal Operational Area"
CBRN_SEAL_OPERATIONAL_AREA_DESC: "Reserve troops and staff capacity for a controlled operational cordon around selected contaminated or infected ground. The order costs §Y10 / 22 / 35§! £command_power and temporarily commits §Y500 / 1,000 / 1,500§! manpower by force band.\n\n$CBRN_HQ_FORCE_BANDS_TT$"
CBRN_SEAL_OPERATIONAL_AREA_TRIGGER_TT: "Requires a deployed §YChemical Intelligence and Weather Cell§! or §YBiological Security Section§!, controlled contamination or an active outbreak, the full command-power, support-equipment, and manpower package, and no other committed CBRN headquarters posture."
CBRN_SEAL_OPERATIONAL_AREA_EFFECT_TT: "Begins §Y2–7 days§! of preparation, then sustains a §Y30-day§! cordon posture. Active penalty: §R-5% Army Speed§! and §R+5% Supply Consumption§!. Cooldown: §Y30 days§!. Reserved manpower returns at the planned end of the commitment. Selected-state effects require the matching cordon operation."

CBRN_MASS_ANTIDOTE_RESPONSE_NAME: "Mass Antidote and Casualty Response"
CBRN_MASS_ANTIDOTE_RESPONSE_DESC: "Open protected treatment stations and release theater antidote reserves. The response consumes masks and support equipment, commits §Y5 / 10 / 15§! Medical Capacity, costs §Y10 / 25 / 40§! £command_power by force band, and lasts §Y14 days§! while supplied.\n\n$CBRN_HQ_FORCE_BANDS_TT$"
CBRN_MASS_ANTIDOTE_RESPONSE_TRIGGER_TT: "Requires a deployed §YMedical Countermeasure Directorate§!, a chemical emergency, contamination, enemy chemical capability, or active outbreak, sufficient Medical Capacity, the full command-power and operating-stock package, and no other committed CBRN headquarters posture."
CBRN_MASS_ANTIDOTE_RESPONSE_EFFECT_TT: "Begins after §Y1 day§!, then sustains a §Y14-day§! medical response. Active effect: §G-20% Wounded Chance§!, §G-20% Sickness Chance§!, and §R+8% Supply Consumption§!. Cooldown: §Y30 days§!. Committed Medical Capacity returns at the planned end of the response; unpaid weekly stores end its active benefits."

CBRN_SEAL_INFECTION_CORRIDOR_NAME: "Seal Infection Corridor"
CBRN_SEAL_INFECTION_CORRIDOR_DESC: "Coordinate sampling, disinfection, protected cordons, and casualty surveillance for an active outbreak. The order consumes support stores, decontaminants, instruments, and masks; commits §Y5 / 10 / 15§! Medical Capacity and §Y500 / 1,000 / 1,500§! manpower; and costs §Y15 / 30 / 45§! £command_power by force band.\n\n$CBRN_HQ_FORCE_BANDS_TT$"
CBRN_SEAL_INFECTION_CORRIDOR_TRIGGER_TT: "Requires a deployed §YBiological Security Section§!, an active biological outbreak, sufficient Medical Capacity and manpower, the full command-power and operating-stock package, and no other committed CBRN headquarters posture."
CBRN_SEAL_INFECTION_CORRIDOR_EFFECT_TT: "Begins §Y2–5 days§! of preparation, then sustains a §Y60-day§! infection-control posture. Active effect: §R-5% Army Speed§!, §G-25% Sickness Chance§!, and §R+10% Supply Consumption§!. Cooldown: §Y45 days§!. Committed Medical Capacity and manpower return at the planned end. Selected-state containment remains tied to the matching containment operation. Unpaid weekly upkeep ends active benefits."

CBRN_COMBINED_OVERMATCH_NAME: "Combined CBRN Overmatch"
CBRN_COMBINED_OVERMATCH_DESC: "Integrate offensive planning, protection, and decontamination under one theater command. The capstone consumes a large package of masks, instruments, decontaminants, support stores, trucks, fuel, and Medical Capacity, wears down military filters while sustained, and costs §Y50 / 55 / 60§! £command_power by force band.\n\n$CBRN_HQ_FORCE_BANDS_TT$"
CBRN_COMBINED_OVERMATCH_TRIGGER_TT: "Requires §YTheater CBRN Headquarters§!, a deployed §YCBRN Operations Section§!, §YProtective Logistics Section§!, and §YMobile Decontamination Column§!, full Chemical Readiness, a use policy permitting battlefield release, chemical payload reserves, the full operating package, and no other committed CBRN headquarters posture."
CBRN_COMBINED_OVERMATCH_EFFECT_TT: "Begins §Y14–30 days§! of readiness-scaled preparation, then sustains a §Y10-day§! combined posture. Active effect: §G+8% Planning Speed§!, §G+5% Maximum Planning§!, §R-3% Army Speed§!, §G-15% Wounded Chance§!, §G-15% Sickness Chance§!, and §R+20% Supply Consumption§!. Cooldown: §Y180 days§!. High military respiratory protection shortens preparation. A separate authorized delivery order must select and expend the actual agent."

CBRN_HQ_FORCE_BANDS_TT: "§YForce bands§!: light—fewer than 100 affected battalions; standard—100 to 199; mass—200 or more."

cbrn_hq_preparing_operation: "Preparing CBRN Headquarters Operation"
cbrn_hq_preparing_operation_desc: "This command is assembling a paid CBRN operating package and cannot begin another CBRN headquarters posture until the commitment ends."
cbrn_hq_active_chemical_offensive: "Prepared Chemical Fire Plan"
cbrn_hq_active_chemical_offensive_desc: "The headquarters has completed protected chemical fire planning. Actual delivery still requires an authorized order that selects and expends a specific agent."
cbrn_hq_active_protective_posture: "Theater Protective Posture"
cbrn_hq_active_protective_posture_desc: "Masks, filters, reporting stations, and protected movement procedures are being sustained across the assigned command."
cbrn_hq_active_decontamination_corridor: "Decontamination Corridor Posture"
cbrn_hq_active_decontamination_corridor_desc: "Wash columns and protected route-control teams are committed to selected contaminated-state operations."
cbrn_hq_active_sealed_operational_area: "Sealed Operational Area Posture"
cbrn_hq_active_sealed_operational_area_desc: "Theater staff and reserved troops are maintaining a controlled cordon for selected contaminated or infected ground."
cbrn_hq_active_antidote_response: "Mass Antidote Response"
cbrn_hq_active_antidote_response_desc: "Protected treatment stations and antidote distribution are reducing sickness and wounded losses across the assigned command."
cbrn_hq_active_infection_corridor: "Sealed Infection Corridor Posture"
cbrn_hq_active_infection_corridor_desc: "Sampling, disinfection, casualty surveillance, and protected cordon procedures are being sustained for the outbreak response."
cbrn_hq_active_combined_overmatch: "Combined CBRN Overmatch"
cbrn_hq_active_combined_overmatch_desc: "Offensive planning, theater protection, medical support, and decontamination logistics are integrated under one headquarters commitment."

theater_cbrn_headquarters: "Theater CBRN Headquarters"
theater_cbrn_headquarters_desc: "A doctrine-certified command architecture capable of combining chemical planning, protective logistics, and mobile decontamination within one deployed Army Headquarters. It is granted by Theater Intelligence Overmatch and cannot be researched independently."

integrated_chemical_operations_hq_adoption_tt: "Unlocks §YCBRN Operations Section§! for Army Headquarters."
integrated_chemical_operations_countercontamination_routing_tt: "Unlocks §YMobile Decontamination Column§! for Army Headquarters."
