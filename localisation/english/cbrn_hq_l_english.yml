l_english:
cbrn_hq_operations_section: "CBRN Operations and Intelligence Section"
cbrn_hq_operations_section_desc: "Operations staff, weather analysts, and reconnaissance specialists coordinate protected chemical fire plans and operational cordons. Instruments, masks, support stores, and transport sustain the section."
cbrn_hq_protective_logistics_section: "CBRN Protection and Decontamination Section"
cbrn_hq_protective_logistics_section_desc: "Theater mask, filter, wash, and route-control crews sustain protective postures and decontamination corridors with equipment, support stores, and transport."
cbrn_hq_medical_countermeasure_directorate: "CBRN Medical and Biosecurity Section"
cbrn_hq_medical_countermeasure_directorate_desc: "Theater medical and biosecurity staff coordinate antidotes, protected treatment, laboratory sampling, disinfection, and infection cordons."


CBRN_THEATER_PROTECTIVE_POSTURE_NAME: "Theater Protective Posture"
CBRN_THEATER_PROTECTIVE_POSTURE_DESC: "Order theater-wide mask issue, filter discipline, protected movement, and exposure reporting. The posture consumes masks and support stores at activation and weekly thereafter, wears down military filters while sustained, costs §Y10 / 22 / 35§! £command_power by force band, and remains active for §Y28 days§! while supplied.\n\n$CBRN_HQ_FORCE_BANDS_TT$"
CBRN_THEATER_PROTECTIVE_POSTURE_TRIGGER_TT: "Requires a deployed §YCBRN Protection and Decontamination Section§!, an active CBRN program, national mask reserves, the full command-power and operating-stock package, and no other committed CBRN headquarters posture."
CBRN_THEATER_PROTECTIVE_POSTURE_EFFECT_TT: "Begins §Y1–3 days§! of preparation, then sustains a §Y28-day§! protective posture. Active effect: §R-15% Army Speed§!, §R-10% Army Attack§!, §G-15% Organisation Loss While Moving§!, §G-10% Wounded Chance§!, and §R+20% Supply Consumption§!. Cooldown: §Y14 days§!. Unpaid weekly mask or support-equipment upkeep ends its benefits."

CBRN_DECONTAMINATION_CORRIDOR_NAME: "Establish Decontamination Corridor"
CBRN_DECONTAMINATION_CORRIDOR_DESC: "Commit wash columns and protected route crews to support selected contaminated-state operations. The order consumes decontamination equipment, trucks, masks, support stores, and fuel, costs §Y10 / 28 / 45§! £command_power by force band, and lasts §Y28 days§! while supplied.\n\n$CBRN_HQ_FORCE_BANDS_TT$"
CBRN_DECONTAMINATION_CORRIDOR_TRIGGER_TT: "Requires a deployed §YCBRN Protection and Decontamination Section§!, controlled chemical contamination, the full command-power and operating-stock package, and no other committed CBRN headquarters posture."
CBRN_DECONTAMINATION_CORRIDOR_EFFECT_TT: "Begins §Y3–7 days§! of preparation, then sustains a §Y28-day§! corridor posture. Active penalty: §R-10% Army Speed§! and §R+15% Supply Consumption§!. Cooldown: §Y30 days§!. Selected-state cleanup remains tied to the corresponding decontamination operation. Unpaid weekly upkeep ends the posture."

CBRN_SEAL_OPERATIONAL_AREA_NAME: "Seal Operational Area"
CBRN_SEAL_OPERATIONAL_AREA_DESC: "Reserve troops and staff capacity for a controlled operational cordon around selected contaminated or infected ground. The order costs §Y10 / 22 / 35§! £command_power and temporarily commits §Y500 / 1,000 / 1,500§! manpower by force band.\n\n$CBRN_HQ_FORCE_BANDS_TT$"
CBRN_SEAL_OPERATIONAL_AREA_TRIGGER_TT: "Requires a deployed §YCBRN Operations and Intelligence Section§! or §YCBRN Medical and Biosecurity Section§!, controlled contamination or an active outbreak, the full command-power, support-equipment, and manpower package, and no other committed CBRN headquarters posture."
CBRN_SEAL_OPERATIONAL_AREA_EFFECT_TT: "Begins §Y2–7 days§! of preparation, then sustains a §Y30-day§! cordon posture. Active penalty: §R-15% Army Speed§! and §R+15% Supply Consumption§!. Cooldown: §Y30 days§!. Reserved manpower returns at the planned end of the commitment. Selected-state effects require the matching cordon operation."

CBRN_MASS_ANTIDOTE_RESPONSE_NAME: "Mass Antidote and Casualty Response"
CBRN_MASS_ANTIDOTE_RESPONSE_DESC: "Open protected treatment stations and release theater antidote reserves. The response consumes masks and support equipment, commits §Y5 / 10 / 15§! Medical Capacity, costs §Y10 / 25 / 40§! £command_power by force band, and lasts §Y14 days§! while supplied.\n\n$CBRN_HQ_FORCE_BANDS_TT$"
CBRN_MASS_ANTIDOTE_RESPONSE_TRIGGER_TT: "Requires a deployed §YCBRN Medical and Biosecurity Section§!, a chemical emergency, contamination, enemy chemical capability, or active outbreak, sufficient Medical Capacity, the full command-power and operating-stock package, and no other committed CBRN headquarters posture."
CBRN_MASS_ANTIDOTE_RESPONSE_EFFECT_TT: "Begins after §Y1 day§!, then sustains a §Y14-day§! medical response. Active effect: §G-20% Wounded Chance§!, §G-20% Sickness Chance§!, and §R+20% Supply Consumption§!. Cooldown: §Y30 days§!. Committed Medical Capacity returns at the planned end of the response, and unpaid weekly stores end its active benefits."

CBRN_SEAL_INFECTION_CORRIDOR_NAME: "Seal Infection Corridor"
CBRN_SEAL_INFECTION_CORRIDOR_DESC: "Coordinate sampling, disinfection, protected cordons, and casualty surveillance for an active outbreak. The order consumes support stores, decontaminants, instruments, and masks, commits §Y5 / 10 / 15§! Medical Capacity and §Y500 / 1,000 / 1,500§! manpower, and costs §Y15 / 30 / 45§! £command_power by force band.\n\n$CBRN_HQ_FORCE_BANDS_TT$"
CBRN_SEAL_INFECTION_CORRIDOR_TRIGGER_TT: "Requires a deployed §YCBRN Medical and Biosecurity Section§!, an active biological outbreak, sufficient Medical Capacity and manpower, the full command-power and operating-stock package, and no other committed CBRN headquarters posture."
CBRN_SEAL_INFECTION_CORRIDOR_EFFECT_TT: "Begins §Y2–5 days§! of preparation, then sustains a §Y60-day§! infection-control posture. Active effect: §R-15% Army Speed§!, §G-20% Sickness Chance§!, and §R+25% Supply Consumption§!. Cooldown: §Y45 days§!. Committed Medical Capacity and manpower return at the planned end. Selected-state containment remains tied to the matching containment operation. Unpaid weekly upkeep ends active benefits."


CBRN_HQ_FORCE_BANDS_TT: "§YForce bands§!: light (fewer than 100 affected battalions), standard (100 to 199), and mass (200 or more)."

cbrn_hq_preparing_operation: "Preparing CBRN Headquarters Operation"
cbrn_hq_preparing_operation_desc: "This command is assembling a protective CBRN operating package and cannot begin another headquarters response until the commitment ends."
cbrn_hq_active_protective_posture: "Theater Protective Posture"
cbrn_hq_active_protective_posture_desc: "Masks, filters, reporting stations, and protected movement procedures are being sustained across the assigned command."
cbrn_hq_active_low_resistance_protective_posture: "Low-Resistance Theater Protective Posture"
cbrn_hq_active_low_resistance_protective_posture_desc: "Low-resistance facepieces and sustained filter discipline preserve protection and reduce the movement, attack, organization, and supply penalties of the assigned command."
cbrn_hq_active_decontamination_corridor: "Decontamination Corridor Posture"
cbrn_hq_active_decontamination_corridor_desc: "Wash columns and protected route-control teams are committed to selected contaminated-state operations."
cbrn_hq_active_sealed_operational_area: "Sealed Operational Area Posture"
cbrn_hq_active_sealed_operational_area_desc: "Theater staff and reserved troops are maintaining a controlled cordon for selected contaminated or infected ground."
cbrn_hq_active_antidote_response: "Mass Antidote Response"
cbrn_hq_active_antidote_response_desc: "Protected treatment stations and antidote distribution are reducing sickness and wounded losses across the assigned command."
cbrn_hq_active_infection_corridor: "Sealed Infection Corridor Posture"
cbrn_hq_active_infection_corridor_desc: "Sampling, disinfection, casualty surveillance, and protected cordon procedures are being sustained for the outbreak response."

theater_cbrn_headquarters: "Theater CBRN Headquarters"
theater_cbrn_headquarters_desc: "Doctrine-certified headquarters training enables Operations and Intelligence, Protection and Decontamination, and Medical and Biosecurity sections in one Army Headquarters. Theater Intelligence Overmatch grants this certification."

integrated_chemical_operations_hq_adoption_tt: "Unlocks §YCBRN Operations and Intelligence Section§! for Army Headquarters."
integrated_chemical_operations_countercontamination_routing_tt: "Trains the §YCBRN Protection and Decontamination Section§! for selected decontamination corridors."
