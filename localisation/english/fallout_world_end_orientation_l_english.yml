fallout_orientation_cause_gradual_air_collapse: "The final air reports show contamination rising past the point where ordinary filtration and weather could clear it."
fallout_orientation_cause_final_silence: "The surviving radio log ends with stations falling silent while soot, cold, and failed services spread beyond their districts."
fallout_orientation_cause_chemical_saturation: "Chemical clouds and contaminated runoff exhausted filters, clinics, and clean-water stores before the national register was opened."
fallout_orientation_cause_biological_follow_through: "Disease followed the collapse of shelter, transport, and sanitation, leaving clinics to count losses without reliable supply."
fallout_orientation_cause_mixed_terminal: "Chemical exposure, disease, bombardment, and poisoned air overlapped until no single service could contain the losses."
fallout_orientation_cause_manual_thermonuclear: "The strike ledger records thermonuclear detonations across cities, fields, ports, and roads, followed by seven days of fire and falling ash."
fallout_orientation_cause_legacy_fallout: "The oldest surviving logs begin after the fires and contain no reliable account of the first attacks. The national archive can preserve only what the shelter clerks received."
fallout_orientation_cause_strategic_singularity: "The strategic singularity record ends with command networks, infrastructure, and population centers failing in the same terminal interval."
fallout_orientation_invalid_cause_memory: "The transition archive lacks a current typed cause receipt."

chaosx.fallout.62.t: "The First National Register"
chaosx.fallout.62.d: "[This.GetFalloutOrientationCauseMemoryText]\n\n[This.GetFalloutOrientationNationalRegionText]\n\nThe rewrite ledger counts [?fallout_orientation_frozen_country_population|0] living people under the authority of a [This.GetFalloutOrientationArchetypeName]. [This.GetFalloutOrientationGovernmentArchetypeText]\n\nThe strongest recorded survival value is [This.GetFalloutOrientationPrimaryResourceName] at [?fallout_orientation_frozen_primary_value|0]. The weakest is [This.GetFalloutOrientationWeakestResourceName] at [?fallout_orientation_frozen_weakest_value|0]. The first register must decide who is permitted to count homes, work crews, stores, and armed escorts across [This.GetFalloutOrientationRegionName]."
chaosx.fallout.62.a: "Count households and workplaces."
chaosx.fallout.62.a.tt: "Commit §Y[?constant:fallout_orientation_cost.national_household_food|0] Food§!, §Y[?constant:fallout_orientation_cost.national_household_water|0] Clean water§!, and §Y[?constant:fallout_orientation_cost.national_household_filters|0] Filters§!. A strong result raises Recognition by §Y[?constant:fallout_orientation_result.national_household_success_recognition|0]§! and Cohesion by §Y[?constant:fallout_orientation_result.national_household_success_cohesion|0]§!. A contested result raises Recognition by §Y[?constant:fallout_orientation_result.national_household_partial_recognition|0]§! and Cohesion by §Y[?constant:fallout_orientation_result.national_household_partial_cohesion|0]§!. Failure lowers Recognition by §R[?constant:fallout_orientation_result.national_household_failure_recognition|0]§!, Cohesion by §R[?constant:fallout_orientation_result.national_household_failure_cohesion|0]§!, and Food by §R[?constant:fallout_orientation_result.national_household_failure_food|0]§!. If Recognition began below §Y[?constant:fallout_orientation_deaths.national_authority_recognition_threshold|0]§!, the Deaths ledger records one person per thousand from the frozen post-rewrite population across the country's surviving states."
chaosx.fallout.62.b: "Recognize district and settlement compacts."
chaosx.fallout.62.b.tt: "Commit §Y[?constant:fallout_orientation_cost.national_district_food|0] Food§!, §Y[?constant:fallout_orientation_cost.national_district_shelter|0] Shelter capacity§!, and §Y[?constant:fallout_orientation_cost.national_district_scrap|0] Scrap§!. A strong result raises Recognition by §Y[?constant:fallout_orientation_result.national_district_success_recognition|0]§! and Cohesion by §Y[?constant:fallout_orientation_result.national_district_success_cohesion|0]§!. A contested result raises Recognition by §Y[?constant:fallout_orientation_result.national_district_partial_recognition|0]§! and Cohesion by §Y[?constant:fallout_orientation_result.national_district_partial_cohesion|0]§!. Failure lowers Recognition by §R[?constant:fallout_orientation_result.national_district_failure_recognition|0]§!, Cohesion by §R[?constant:fallout_orientation_result.national_district_failure_cohesion|0]§!, and Shelter capacity by §R[?constant:fallout_orientation_result.national_district_failure_shelter|0]§!."
chaosx.fallout.62.c: "Issue one emergency command register."
chaosx.fallout.62.c.tt: "Commit §Y[?constant:fallout_orientation_cost.national_command_fuel|0] Fuel§!, §Y[?constant:fallout_orientation_cost.national_command_filters|0] Filters§!, and §Y[?constant:fallout_orientation_cost.national_command_scrap|0] Scrap§!. A strong result raises Recognition by §Y[?constant:fallout_orientation_result.national_command_success_recognition|0]§! and Cohesion by §Y[?constant:fallout_orientation_result.national_command_success_cohesion|0]§!, then grants the Command Register for §Y[?constant:fallout_orientation_duration.command_authority_days|0] days§!. A contested result raises Recognition by §Y[?constant:fallout_orientation_result.national_command_partial_recognition|0]§! and Cohesion by §Y[?constant:fallout_orientation_result.national_command_partial_cohesion|0]§!, then imposes a Contested Command Register for §Y[?constant:fallout_orientation_duration.contested_command_days|0] days§!. Failure lowers Recognition by §R[?constant:fallout_orientation_result.national_command_failure_recognition|0]§! and Cohesion by §R[?constant:fallout_orientation_result.national_command_failure_cohesion|0]§!, then imposes Resistance to the Command Register for §R[?constant:fallout_orientation_duration.command_resistance_days|0] days§!."

chaosx.fallout.64.t: "The Register Returns"
chaosx.fallout.64.household.success.d: "Household clerks and workplace stewards returned compatible rolls. Names missing from one list were traced through the other, while ration counters accepted a common seal and published the first district totals. The count has given the emergency government both reach and credibility.[This.GetFalloutOrientationDeathsClause]"
chaosx.fallout.64.household.partial.d: "Household clerks completed the count, but workplace stewards withheld portions of their labor and supply rolls. The government has enough names to issue rations and notices, while several districts still keep private corrections behind locked doors.[This.GetFalloutOrientationDeathsClause]"
chaosx.fallout.64.household.failure.d: "Household lists arrived after work crews had moved, shelters had split, or entire streets had emptied. Competing clerks accused one another of inventing dependents and hiding stores. Food assigned through the failed register vanished between district tables and local counters.[This.GetFalloutOrientationDeathsClause]"
chaosx.fallout.64.district.success.d: "District councils and settlement delegates signed one compact that states what each office may count and what each depot must disclose. Local registers remain in local hands, yet their totals can be reconciled and their obligations can be enforced across the surviving territory.[This.GetFalloutOrientationDeathsClause]"
chaosx.fallout.64.district.partial.d: "Most districts accepted the compact after retaining separate rolls for guards, displaced families, and emergency stores. The national total is usable, but every revision still begins with negotiation among ward chairs, settlement delegates, and depot officers.[This.GetFalloutOrientationDeathsClause]"
chaosx.fallout.64.district.failure.d: "District councils signed incompatible compacts and sent duplicate claims for the same shelter rooms. Families reached doors that had already been promised to work crews or militia households. The national office has lost authority, and the shelter ledger has lost space it cannot replace.[This.GetFalloutOrientationDeathsClause]"
chaosx.fallout.64.command.success.d: "Depot officers, shelter wardens, and route guards accepted one command register with named responsibilities. Orders now travel beside the fuel and filters needed to carry them out, giving the government a credible chain of authority beyond its main offices.[This.GetFalloutOrientationDeathsClause]"
chaosx.fallout.64.command.partial.d: "The command register reached every major office, but several district officers annotated it with their own exceptions. Supply columns move again, though duplicate signatures and disputed escort orders continue to delay work beyond the capital.[This.GetFalloutOrientationDeathsClause]"
chaosx.fallout.64.command.failure.d: "Ward councils, depot guards, and displaced officials refused the command register or obeyed only the clauses that favored their own districts. Conflicting orders consumed scarce transport and left the government weaker than it appeared when the count began.[This.GetFalloutOrientationDeathsClause]"
chaosx.fallout.64.a: "File the national count."
chaosx.fallout.64.a.tt: "Later councils, officers, and settlements will remember which authority answered the first national count."

fallout_orientation_national_deaths_clause: " The Deaths ledger records [?fallout_orientation_deaths_applied|0] additional civilian deaths from the failed count."
fallout_orientation_no_deaths_clause: ""
