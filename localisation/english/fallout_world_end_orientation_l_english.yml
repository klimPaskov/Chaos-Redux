fallout_orientation_national_region_north_america: "Interstate shelters, county stores, rail depots, and damaged municipal offices have sent in separate rolls. Snow closes the northern roads while cold rain and ash darken the southern corridors."
fallout_orientation_national_region_europe: "Metro wards, river towns, tunnel shelters, and port offices still keep incompatible registers. Frost holds the inland rails while cold rain enters roofless civic buildings and soot lies across the old capitals."
fallout_orientation_national_region_eurasian_interior: "Rail settlements, mine towns, steppe wells, and remote radio posts report by uncertain intervals. Drifting snow covers the northern line while ash and cold dust close the southern roads."
fallout_orientation_national_region_east_asia: "River wards, factory shelters, fishing ports, and upland districts have preserved their own ration books. Cold rain strikes the coasts while ash settles over frozen gates, dead paddies, and darkened industrial belts."
fallout_orientation_national_region_south_asia: "Canal districts, mountain shelters, market towns, and railway colonies are counting survivors under a failed rain calendar. Cold rain reaches some coasts while frost and ash isolate the upland roads."
fallout_orientation_national_region_middle_east_north_africa: "Cistern wards, pipeline posts, oasis towns, and damaged ports have sent guarded tallies. Cold dust and ash fill the streets while frost splits exposed mains and dims the desert morning."
fallout_orientation_national_region_sub_saharan_africa: "River ports, highland clinics, rail towns, and food roads keep separate household lists. Cold rain reaches the uplands while ash from fires and eruptions fouls engines, roofs, and market stores."
fallout_orientation_national_region_latin_america_caribbean: "Andean passes, river towns, grain depots, and island harbors report through broken relay chains. Frost grips the heights while cold rain and ash cross the lowland roads."
fallout_orientation_national_region_oceania_remote_islands: "Harbor wards, airstrips, radio islands, and highland farms have counted whoever reached shelter before the sea routes failed. Cold rain drives across the anchorages while ash and frost reduce fresh water and food."

fallout_orientation_capital_region_north_america: "Snow has buried road markings outside the main offices. In lower districts, cold rain freezes inside damaged pipes and ash clings to dead roadside vegetation."
fallout_orientation_capital_region_europe: "Frost holds the rail points and cellar doors around the civic center. Cold rain enters shattered roofs while ash coats tram lines, dead parks, and frozen river steps."
fallout_orientation_capital_region_eurasian_interior: "Wind drives snow through the rail approaches and cold dust through broken windows. Frozen water lines and dim lamps divide the central offices from the outlying shelters."
fallout_orientation_capital_region_east_asia: "Cold rain runs through factory wards and freezes at the river gates. Ash lies on dead terraces while dim light forces clerks and shelter crews to work by covered lamps."
fallout_orientation_capital_region_south_asia: "Cold rain pools in the low districts while frost closes mountain approaches. Ash darkens the courtyards, damages stored seed, and turns the surviving wells into guarded queues."
fallout_orientation_capital_region_middle_east_north_africa: "Ash and cold dust fill the service streets around the main offices. Frost-split pipes empty into shaded alleys while the remaining cisterns are opened by a guarded bell schedule."
fallout_orientation_capital_region_sub_saharan_africa: "Cold rain has damaged highland roofs while dry ash fouls generators and clinic filters below. Dead roadside growth and dim mornings make every supply journey harder to time."
fallout_orientation_capital_region_latin_america_caribbean: "Frost seals the high roads and cold rain enters the lower wards. Ash coats hydro lines, dead orchards, and the river steps used by supply crews."
fallout_orientation_capital_region_oceania_remote_islands: "Cold rain drives through the harbor offices while ash fouls roof tanks and radio equipment. Highland frost reduces the island food belt and rough water delays every outer-district delivery."

fallout_orientation_tailored_resource_north_america: "Open an insulated rail and truck distribution ledger"
fallout_orientation_tailored_resource_europe: "Join cellar kitchens to the surviving river and tram depots"
fallout_orientation_tailored_resource_eurasian_interior: "Assign heated rail crews and well courts to the distribution line"
fallout_orientation_tailored_resource_east_asia: "Organize ward workshops and protected fishing or river routes"
fallout_orientation_tailored_resource_south_asia: "Place canal gates, cisterns, and cold-crop stores under one rota"
fallout_orientation_tailored_resource_middle_east_north_africa: "Link cistern guards, pipeline crews, and powered pumps"
fallout_orientation_tailored_resource_sub_saharan_africa: "Join river landings, clinic stores, and highland food roads"
fallout_orientation_tailored_resource_latin_america_caribbean: "Link pass convoys, hydro depots, and river distribution crews"
fallout_orientation_tailored_resource_oceania_remote_islands: "Open guarded fishing access and an island harbor ration pool"

