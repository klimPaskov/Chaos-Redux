l_english:
fallout_orientation_command_authority: "The Command Register"
fallout_orientation_command_authority_desc: "Named depot officers, shelter wardens, and route guards answer to one emergency register. Fuel and filters reach priority services faster, while the mobilization rolls remain under central command."
fallout_orientation_contested_command: "A Contested Command Register"
fallout_orientation_contested_command_desc: "District officers obey the emergency register unevenly. Duplicate orders consume fuel and delay the movement of repair crews and militia."
fallout_orientation_command_resistance: "Resistance to the Command Register"
fallout_orientation_command_resistance_desc: "Ward councils, depot guards, and displaced officials refuse portions of the emergency register. Supply columns wait for competing signatures and public confidence falls with every delay."
fallout_orientation_ration_unrest: "Ration Queue Unrest"
fallout_orientation_ration_unrest_desc: "Published ration lists do not match the food and medicine arriving at district counters. Families remain in line after dark while guards and clerks dispute the missing allotments."
fallout_orientation_consolidated_authority: "Emergency Authority Consolidated"
fallout_orientation_consolidated_authority_desc: "Shelter offices, route commands, and ration boards have accepted one chain of authority. Written orders now move with the same supply convoys that must carry them out."
fallout_orientation_contested_authority: "Authority Under Review"
fallout_orientation_contested_authority_desc: "The emergency government can issue orders, but district institutions retain separate claims over labor, stores, and armed escorts. Every mobilization begins with another negotiation."
fallout_orientation_legitimacy_crisis: "A Crisis of Legitimacy"
fallout_orientation_legitimacy_crisis_desc: "Rival councils reject the government's right to command food, shelter, and armed units. Supply staff protect their own districts first as public confidence drains away."
fallout_orientation_capacity_liability: "A Narrow Relief Mandate"
fallout_orientation_capacity_liability_desc: "The new relief office has public standing but too few trained clerks, engineers, and medical workers. Construction and repair schedules slow while its limited staff sorts urgent claims."
fallout_orientation_coercion_liability: "Coercive Supply Discipline"
fallout_orientation_coercion_liability_desc: "Armed collection teams keep depots moving through compulsory quotas. Units consume more supplies and suffer avoidable losses as civilian routes are treated like contested ground."

