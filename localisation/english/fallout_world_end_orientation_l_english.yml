fallout_orientation_government_continuity_government: "The surviving cabinet seal still opens archives and commands a few civil servants, yet district ration boards recognize only orders that arrive with food, filters, and named escorts."
fallout_orientation_government_bunker_authority: "Door commanders, filter crews, and level wardens hold the practical power. Surface districts demand a voice before another shelter protocol decides who receives air, heat, and entry."
fallout_orientation_government_warlord_command: "Store captains and armed columns obey the commander while supplies last. Protected settlements now demand fixed obligations in place of raids, tribute, and improvised promises."
fallout_orientation_government_food_compact: "Granary boards, seed keepers, and farm wards control the most reliable stores. Military officers and hungry towns dispute who may turn food custody into national authority."
fallout_orientation_government_maritime_remnant: "Harbor masters, naval crews, and fishing councils keep the surviving routes open. Inland shelters demand representation before the ports set every ration and landing rule."
fallout_orientation_government_quarantine_state: "Clinic boards, sanitation crews, and cordon guards decide who may move between districts. Families outside the medical perimeter challenge rules written without their testimony."
fallout_orientation_government_scavenger_syndicate: "Salvage captains and guild clerks issue ruin permits, divide recovered parts, and guard route maps. Municipal wards want public accounts before the guilds become the government."
fallout_orientation_government_nomad_convoy: "Convoy councils, well judges, and route commanders govern a population that moves with fuel, grazing, and safe water. Fixed settlements seek guarantees that can survive the next departure."
fallout_orientation_government_machine_protocol: "Operator committees still receive schedules from the surviving automated system. Human districts demand published rules, emergency exceptions, and a named authority responsible for every fatal instruction."
fallout_orientation_government_technate: "Grid engineers, pump operators, and repair chiefs control the systems that keep the shelters alive. Labor crews and district councils insist that technical necessity cannot settle every public question."
fallout_orientation_government_mutant_polity: "The altered community is governed by shelter councils, clinic envoys, and defense crews formed during the high-chaos years. Outside medical labels do not decide its citizenship or ordinary public life."
fallout_orientation_government_religious_refuge: "Sanctuary kitchens, burial custodians, and relief clergy sustain districts that the civil offices cannot reach. Armed guards and secular ward chairs dispute where mercy ends and public authority begins."

