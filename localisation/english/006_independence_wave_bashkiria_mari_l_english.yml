  mel_fragmented_forest_mandate: "Fragmented Forest Mandate"
  mel_fragmented_forest_mandate_desc: "Village councils, railway workers, forest settlements, and local guards recognize the provisional government without accepting one common authority."
  mel_mari_forest_compact: "Mari Forest Compact"
  mel_mari_forest_compact_desc: "A common congress and woodland administration bind Mari El's settlements, depots, railways, and guards under one government."
  mel_forest_congress_charter: "Forest Congress Charter"
  mel_forest_congress_charter_desc: "An elected congress protects local representation while directing the civic administration of Mari El."
  mel_woodland_councils: "Woodland Councils"
  mel_woodland_councils_desc: "Workers' councils coordinate the railways, workshops, forest industries, and public services of the republic."
  mel_mari_community_register: "Mari Community Register"
  mel_mari_community_register_desc: "The government records each settlement's representation, land rights, public duties, and access to local resources."
  mel_forest_land_compact: "Forest Land Compact"
  mel_forest_land_compact_desc: "Village delegates and cooperatives protect farmland, forest use, recruitment, and local administration."
  mel_forest_emergency_command: "Forest Emergency Command"
  mel_forest_emergency_command_desc: "A unified staff directs woodland guards and depot reserves while civil councils maintain supply and relief."

  independence_wave_mari_forest_compact_category: "Mari Forest Compact"
  independence_wave_mari_forest_compact_category_desc: "Congress Cohesion: §Y[?independence_wave_mel_congress_cohesion|0]§! / [?constant:independence_wave_mari_pressure.maximum|0]\nForest Readiness: §Y[?independence_wave_mel_forest_readiness|0]§! / [?constant:independence_wave_mari_pressure.maximum|0]\nRaise both values to [?constant:independence_wave_mari_pressure.stable|0] to stabilize the compact."
  independence_wave_mel_hold_forest_congress: "Hold the Mari Forest Congress Together"
  independence_wave_mel_hold_forest_congress_desc: "Within [?constant:independence_wave_mari_duration.founding_crisis|0] days, install a government, raise both compact values to [?constant:independence_wave_mari_pressure.stable|0], and keep Yoshkar-Ola owned and controlled."
  independence_wave_mel_secure_forest_depots: "Secure the Forest Depots"
  independence_wave_mel_secure_forest_depots_desc: "Place the capital's stores, railway registers, and depot guards under a civil authority that can supply the compact."
  independence_wave_mel_integrate_woodland_guards: "Integrate the Woodland Guards"
  independence_wave_mel_integrate_woodland_guards_desc: "Unify local guards under a forest command while preserving the community agreements that supply and recruit them."
  independence_wave_mel_register_mari_communities: "Register the Mari Communities"
  independence_wave_mel_register_mari_communities_desc: "Record each settlement's representation, land rights, public duties, and access to forest resources."
  independence_wave_mel_settle_former_host_ledgers: "Settle the Former Host Ledgers"
  independence_wave_mel_settle_former_host_ledgers_desc: "Resolve the property, border, population, and recognition claims inherited from the former administration. If negotiations collapse, Mari El will close the claims locally."
  independence_wave_mel_ratify_constitutional_autonomy: "Ratify Constitutional Autonomy"
  independence_wave_mel_ratify_constitutional_autonomy_desc: "Give the Forest Congress a binding charter, elected administration, and guarantees for Mari communities."
  independence_wave_mel_adopt_forest_land_compact: "Adopt the Forest Land Compact"
  independence_wave_mel_adopt_forest_land_compact_desc: "Entrust village delegates and cooperatives with farmland, forest use, recruitment, and local administration."
  independence_wave_mel_convene_woodland_councils: "Convene the Woodland Councils"
  independence_wave_mel_convene_woodland_councils_desc: "Place railways, workshops, forest industries, and municipal services under a congress of workers' councils."
  independence_wave_mel_establish_forest_emergency_command: "Establish the Forest Emergency Command"
  independence_wave_mel_establish_forest_emergency_command_desc: "Unify the woodland guards under an emergency staff and secure the river and railway approaches to the capital."
  independence_wave_mel_codify_durable_sovereignty: "Codify Durable Sovereignty"
  independence_wave_mel_codify_durable_sovereignty_desc: "Turn the settled founding compact, stable institutions, and route government into a durable Mari state."
  independence_wave_mel_open_volga_finnic_corridor: "Open the Volga-Finnic Corridor"
  independence_wave_mel_open_volga_finnic_corridor_desc: "Exchange supplies, officers, and diplomatic access with other network states along the middle Volga."

  independence_wave_mel_depots_effect_tt: "Congress Cohesion rises by §Y[?constant:independence_wave_mari_pressure.major_gain|0]§!. Forest Readiness rises by §Y[?constant:independence_wave_mari_pressure.minor_gain|0]§!. The compact also strengthens its civil administration."
  independence_wave_mel_guards_effect_tt: "Congress Cohesion rises by §Y[?constant:independence_wave_mari_pressure.minor_gain|0]§!. Forest Readiness rises by §Y[?constant:independence_wave_mari_pressure.major_gain|0]§!. The compact also strengthens its security administration."
  independence_wave_mel_communities_effect_tt: "Congress Cohesion rises by §Y[?constant:independence_wave_mari_pressure.major_gain|0]§!. Forest Readiness rises by §Y[?constant:independence_wave_mari_pressure.standard_gain|0]§!. The Mari Community Register is established."
  independence_wave_mel_host_ledgers_effect_tt: "Congress Cohesion and Forest Readiness each rise by §Y[?constant:independence_wave_mari_pressure.standard_gain|0]§!. Negotiations settle the outstanding claims with the former host."
  independence_wave_mel_host_loss_effect_tt: "The former-host claims close locally. Congress Cohesion and Forest Readiness each rise by §Y[?constant:independence_wave_mari_pressure.standard_gain|0]§!. No bilateral host values change."
  independence_wave_mel_constitutional_route_effect_tt: "The Mari Civic Congress takes office. Congress Cohesion rises by §Y[?constant:independence_wave_mari_pressure.major_gain|0]§! and Forest Readiness rises by §Y[?constant:independence_wave_mari_pressure.minor_gain|0]§!."
  independence_wave_mel_forest_land_route_effect_tt: "The Mari Land Compact takes office. Congress Cohesion rises by §Y[?constant:independence_wave_mari_pressure.major_gain|0]§! and Forest Readiness rises by §Y[?constant:independence_wave_mari_pressure.standard_gain|0]§!."
  independence_wave_mel_woodland_route_effect_tt: "The Mari Woodland Councils take office. Congress Cohesion rises by §Y[?constant:independence_wave_mari_pressure.minor_gain|0]§! and Forest Readiness rises by §Y[?constant:independence_wave_mari_pressure.major_gain|0]§!."
  independence_wave_mel_forest_emergency_route_effect_tt: "The Forest Security Directorate takes office. Forest Readiness rises by §Y[?constant:independence_wave_mari_pressure.decisive_gain|0]§! and Congress Cohesion falls by §R[?constant:independence_wave_mari_pressure.minor_gain|0]§!."
  independence_wave_mel_sovereignty_effect_tt: "Legitimacy, Recognition, and State Capacity rise. The compact also gains Security and reduces Instability."
  independence_wave_mel_network_effect_tt: "Congress Cohesion and Forest Readiness each rise by §Y[?constant:independence_wave_mari_pressure.standard_gain|0]§!. Network Standing, League Cohesion, Common Cause, Shared Reserve, and Member Confidence rise."
  independence_wave_mel_project_failure_effect_tt: "Congress Cohesion and Forest Readiness each fall by §R[?constant:independence_wave_mari_pressure.standard_gain|0]§!. Legitimacy, Recognition, State Capacity, and Security fall. Instability rises."

