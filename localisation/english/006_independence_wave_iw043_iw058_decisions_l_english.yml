# IW-043 decisions and missions
independence_wave_iw043_convene_delegation_roll_call: "Convene the Delegation Roll Call"
independence_wave_iw043_convene_delegation_roll_call_desc: "Assign clerks and a civilian office to verify municipal, national, religious, labor, and transport delegations. A completed roll call opens the congress clauses. Losing the Kazan mandate before the session closes causes an abstention and consumes the committed resources."
independence_wave_iw043_convene_delegation_roll_call_start_tt: "The roll call begins for §Y150 days§!. The political and material commitment is spent immediately."
independence_wave_iw043_convene_delegation_roll_call_success_tt: "The delegations take their seats and §YCongress Authority§! increases by §G15§!."
independence_wave_iw043_convene_delegation_roll_call_timeout_tt: "The roll call ends without a valid Kazan mandate. §YCongress Authority§! decreases by §R10§!, and the committed resources remain spent."
independence_wave_iw043_convene_delegation_roll_call_cancel_tt: "The session is cancelled. §YCongress Authority§! decreases by §R10§!, and the committed resources remain spent."

independence_wave_iw043_ratify_tatar_bashkir_representation: "Ratify Tatar and Bashkir Representation"
independence_wave_iw043_ratify_tatar_bashkir_representation_desc: "Bring the Tatar and Bashkir representation clause to a recorded vote. The congress chooses a seat formula with a federal or restoration balance, while rejection blocks both constitutional settlements until reconciliation."
independence_wave_iw043_ratify_chuvash_municipal_autonomy: "Ratify Chuvash Municipal Autonomy"
independence_wave_iw043_ratify_chuvash_municipal_autonomy_desc: "Bring a separate Chuvash municipal guarantee before the congress. Cheboksary may join through municipal consent or a treaty administration, while confrontation obstructs later integration."
independence_wave_iw043_ratify_mari_udmurt_language_rights: "Ratify Mari and Udmurt Language Rights"
independence_wave_iw043_ratify_mari_udmurt_language_rights_desc: "Fund the clerks and translators needed for a distinct Mari and Udmurt language-rights settlement. The congress must choose between a broad administrative guarantee and a local petition model."
independence_wave_iw043_ratify_resident_civic_and_religious_equality: "Ratify Resident Civic and Religious Equality"
independence_wave_iw043_ratify_resident_civic_and_religious_equality_desc: "Guarantee equal civic standing and freedom of religious practice for residents outside the principal national and religious institutions. Rejection strengthens emergency control and bars both constitutional settlements."

independence_wave_iw043_secure_kazan_cheboksary_navigation: "Secure Kazan-Cheboksary Navigation"
independence_wave_iw043_secure_kazan_cheboksary_navigation_desc: "Commit the river guard, trains, and equipment to keep the Kazan-Cheboksary route open. The formation remains bound to the mission until every exit path releases it."
independence_wave_iw043_secure_kazan_cheboksary_navigation_start_tt: "The river guard is committed for §Y120 days§!. The equipment and transport are spent immediately."
independence_wave_iw043_secure_kazan_cheboksary_navigation_success_tt: "Navigation is secured. §YRiver Control§! increases by §G20§! and §YCongress Authority§! increases by §G5§!."
independence_wave_iw043_secure_kazan_cheboksary_navigation_timeout_tt: "The route cannot be held. §YRiver Control§! and §YCongress Authority§! each decrease by §R10§!, and a navigation incident opens."
independence_wave_iw043_secure_kazan_cheboksary_navigation_cancel_tt: "The guard is released from the mission. §YRiver Control§! decreases by §R10§!, and the committed resources remain spent."

independence_wave_iw043_reopen_volga_customs_and_ferries: "Reopen Volga Customs and Ferries"
independence_wave_iw043_reopen_volga_customs_and_ferries_desc: "Assign clerks, workers, and trains to restore customs accounts and ferry schedules. Success replaces the disrupted river economy, while failure leaves the administrative burden in place."
independence_wave_iw043_reopen_volga_customs_and_ferries_start_tt: "Customs and ferry work begins for §Y150 days§!. The assigned resources are spent immediately."
independence_wave_iw043_reopen_volga_customs_and_ferries_success_tt: "The river economy reopens and §YRiver Control§! increases by §G15§!."
independence_wave_iw043_reopen_volga_customs_and_ferries_timeout_tt: "Navigation prevents a full reopening. §YRiver Control§! decreases by §R5§!, and the customs burden persists."
independence_wave_iw043_reopen_volga_customs_and_ferries_cancel_tt: "The reopening is cancelled. The customs burden persists, and the committed resources remain spent."

independence_wave_iw043_settle_muftiate_and_civic_courts: "Settle the Muftiate and Civic Courts"
independence_wave_iw043_settle_muftiate_and_civic_courts_desc: "Write a constitutional boundary between public civil jurisdiction and the Muftiate's delimited religious competence. The resident-equality clause must remain in force throughout the settlement."
independence_wave_iw043_settle_muftiate_and_civic_courts_start_tt: "The jurisdiction commission sits for §Y180 days§!. The administrative commitment is spent immediately."
independence_wave_iw043_settle_muftiate_and_civic_courts_success_tt: "The commission reaches a settlement, and its constitutional jurisdiction terms come before the congress."
independence_wave_iw043_settle_muftiate_and_civic_courts_timeout_tt: "The commission breaks into a clerical and civic dispute. §YCongress Authority§! decreases by §R10§!."
independence_wave_iw043_settle_muftiate_and_civic_courts_cancel_tt: "The jurisdiction commission is dissolved. The crisis remains unresolved, and the committed resources remain spent."

independence_wave_iw043_discipline_the_river_guard: "Discipline the River Guard"
independence_wave_iw043_discipline_the_river_guard_desc: "Convert the existing river guard under recorded civilian command. This action consumes manpower and equipment, never creates a replacement formation, and releases the binding on every exit."
independence_wave_iw043_discipline_the_river_guard_start_tt: "The existing river guard begins a §Y150 day§! conversion under civilian command."
independence_wave_iw043_discipline_the_river_guard_success_tt: "The guard returns under civilian law. §YCongress Authority§! and §YRiver Control§! each increase by §G10§!."
independence_wave_iw043_discipline_the_river_guard_timeout_tt: "Emergency influence spreads through the guard. §YCongress Authority§! decreases by §R10§!, and the emergency-authority incident opens."
independence_wave_iw043_discipline_the_river_guard_cancel_tt: "The conversion ends without a replacement unit. Emergency pressure rises, and the committed resources remain spent."

independence_wave_iw043_repair_cheboksary_workshops_start_tt: "The Cheboksary project begins for §Y180 days§!. The resources are spent immediately."
independence_wave_iw043_repair_cheboksary_workshops_success_tt: "The workshops return to service. §YRiver Control§! increases by §G10§! and §YCongress Authority§! increases by §G5§!."
independence_wave_iw043_repair_cheboksary_workshops_timeout_tt: "The project leaves partial wear, produces no usable industrial expansion, and decreases §YRiver Control§! by §R5§!."
independence_wave_iw043_repair_cheboksary_workshops_cancel_tt: "The project ends with workshop wear and no factory creation. The committed resources remain spent."

independence_wave_iw043_negotiate_former_host_transit: "Negotiate Former-Host Transit"
independence_wave_iw043_negotiate_former_host_transit_desc: "Negotiate directly with the former host over transit, ferry accounts, and property obligations. War with the former host, or its dissolution, ends the talks."
independence_wave_iw043_negotiate_former_host_transit_start_tt: "The transit talks continue for §Y150 days§!. The train and command commitment is spent immediately."
independence_wave_iw043_negotiate_former_host_transit_success_tt: "Transit and property accounts are settled. §YRiver Control§! increases by §G15§! and §YCongress Authority§! increases by §G5§!."
independence_wave_iw043_negotiate_former_host_transit_timeout_tt: "The talks fail. Host claim pressure rises, §YRiver Control§! decreases by §R10§!, and a navigation incident opens."
independence_wave_iw043_negotiate_former_host_transit_cancel_tt: "The talks end without settlement. Host claim pressure rises, and the committed resources remain spent."

independence_wave_iw043_dispatch_volga_trade_delegation: "Dispatch a Volga Trade Delegation to [FROM.GetNameDef]"
independence_wave_iw043_dispatch_volga_trade_delegation_desc: "Send a trade delegation to [FROM.GetNameDef] by rail. The transport commitment is lost if war interrupts the mission."
independence_wave_iw043_dispatch_volga_trade_delegation_start_tt: "The selected delegation travels for §Y150 days§!. The train and command commitment is spent immediately."
independence_wave_iw043_dispatch_volga_trade_delegation_success_tt: "The named partner grants market access under the trade agreement. §YRiver Control§! and §YCongress Authority§! each increase by §G10§!."
independence_wave_iw043_dispatch_volga_trade_delegation_timeout_tt: "The mission loses its transport commitment. §YRiver Control§! decreases by §R5§!."
independence_wave_iw043_dispatch_volga_trade_delegation_cancel_tt: "The trade mission is cancelled. The committed transport remains spent."

independence_wave_iw043_hold_form12_accession_congress: "Hold the Volga-Ural Accession Congress"
independence_wave_iw043_hold_form12_accession_congress_desc: "Invite the eligible Volga-Ural governments to a synchronized accession congress. The federation requires at least three consenting sovereign members with three unique controlled anchors. Its multilingual charter, river authority, autonomy guarantee, and civilian defense settlement are checked again before proclamation."
independence_wave_iw043_hold_form12_accession_congress_start_tt: "The accession congress sits for §Y180 days§!. The administrative commitment is spent immediately."
independence_wave_iw043_hold_form12_accession_congress_success_tt: "The accepted member consents remain valid, and the federal charter is presented."
independence_wave_iw043_hold_form12_accession_congress_timeout_tt: "The consent margin fails. §YCongress Authority§! decreases by §R15§!, and a congress cooldown is recorded."
independence_wave_iw043_hold_form12_accession_congress_cancel_tt: "The accession congress ends without formation. The committed resources remain spent."

independence_wave_iw043_hold_form13_compact_congress: "Hold the Idel-Ural Compact Congress"
independence_wave_iw043_hold_form13_compact_congress_desc: "Invite the eligible Volga-Ural governments to a synchronized compact congress. At least three sovereign members must consent from three unique controlled anchors. Religious-civic jurisdiction, cultural autonomy, member consent, and river defense are checked again before proclamation."
independence_wave_iw043_hold_form13_compact_congress_start_tt: "The compact congress sits for §Y180 days§!. The administrative commitment is spent immediately."
independence_wave_iw043_hold_form13_compact_congress_success_tt: "The accepted member consents remain valid, and the restoration charter is presented."
independence_wave_iw043_hold_form13_compact_congress_timeout_tt: "The consent margin fails. §YCongress Authority§! decreases by §R15§!, and religious opposition is recorded."
independence_wave_iw043_hold_form13_compact_congress_cancel_tt: "The compact congress ends without formation. The committed resources remain spent."

independence_wave_iw043_reopen_congress_clause: "Reopen a Congress Clause"
independence_wave_iw043_reopen_congress_clause_desc: "Reopen the first rejected clause whose single reconciliation attempt remains unused. The commission chooses the exact Tatar-Bashkir, Chuvash, Mari-Udmurt, or resident-equality settlement. The commitment is spent whether the vote succeeds or fails."
independence_wave_iw043_reopen_congress_clause_start_tt: "A clause reconciliation begins for §Y180 days§!. The full administrative commitment is spent immediately."
independence_wave_iw043_reopen_congress_clause_success_tt: "The selected clause returns to the congress for its own political settlement."
independence_wave_iw043_reopen_congress_clause_timeout_tt: "The reconciliation fails before a vote. This clause cannot be reopened again, and the committed resources remain spent."
independence_wave_iw043_reopen_congress_clause_cancel_tt: "The reconciliation is cancelled. This clause cannot be reopened again, and the committed resources remain spent."

