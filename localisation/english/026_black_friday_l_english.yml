chaosx.nr26.2.t: "Black Friday Reaches the Ministries"
chaosx.nr26.2.d: "Crowds fill the shops as quartermasters and ministry clerks hurry to place orders at the sale price. Intelligence officers have joined the queue with shopping lists of their own.\n\nEligible purchases worldwide are [?global.black_friday_discount_percent|0]% off until the next daily tick. Requirements and cooldowns still apply. Prices round up to the smallest payable unit, so a paid purchase cannot become free."
