026_black_friday_five_departments_NAME: "Five Departments, One Friday"
026_black_friday_five_departments_DESC: "During one naturally selected Black Friday, complete paid purchases in [?constant:black_friday_event.achievement_target_family_count|0] different categories. Include an institutional purchase, a purchase of supplies or factory capacity, and a payment using a resource other than political power."
026_black_friday_five_departments_tooltip: "$026_black_friday_five_departments_DESC$ Each purchase counts toward one category. Free or refunded purchases and repeated categories do not count. Manual or forced sales and AI purchases do not qualify."
