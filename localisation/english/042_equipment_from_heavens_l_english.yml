l_english:
chaosx.nr42.1.desc.colossal: "Each new report from around [efh_first_landing_state.GetName] pushed the edge of the drop further out. Rail sidings, orchards, and parade grounds across [Root.GetNameDef] are buried under military stores that arrived in the night without a sound of engines. [Root.GetEquipmentFromHeavensGroupClause]\n\nThe general staff has asked how many divisions this could equip. The honest answer from the depots is that nobody has finished walking the length of it. [Root.GetEquipmentFromHeavensStageClause]\n\n[Root.GetEquipmentFromHeavensSignatureClue]"
chaosx.nr42.1.desc.enormous: "Before dawn, sentries near [efh_first_landing_state.GetName] heard canvas snapping above the fields. By first light the roads were closed by crates, gun carriages, and parachutes large enough to cover a village square. [Root.GetEquipmentFromHeavensGroupClause]\n\nNo aircraft was heard and no ship is missing. Quartermasters have already stopped counting by the crate and started counting by the field. [Root.GetEquipmentFromHeavensStageClause]\n\n[Root.GetEquipmentFromHeavensSignatureClue]"
chaosx.nr42.1.desc.impossible: "Around [efh_first_landing_state.GetName] the sky kept falling for most of a night. Farmers woke to find their fields occupied by equipment in quantities that would strain the logistics of a great power, and the drops continued in other districts long after the first cordons went up. [Root.GetEquipmentFromHeavensGroupClause]\n\n[Root.GetNameDef] now holds more war material than its officers, roads, and warehouses can absorb. [Root.GetEquipmentFromHeavensStageClause]\n\n[Root.GetEquipmentFromHeavensSignatureClue]"
equipment_from_heavens.report.advanced_cargo.conventional: "Engineers in [efh_report_state.GetName] uncovered vehicles and guns of unfamiliar design, heavier and more finished than anything in the national arsenal. The instruction plates describe features the engineers cannot yet test."
equipment_from_heavens.report.advanced_cargo.nuclear: "A cordon near [efh_report_state.GetName] surrounds a set of heavy sealed casings, each packed with handling tools and custody instructions for a weapon the army has never owned. The officers on site speak quietly and have forbidden photographs."
equipment_from_heavens.report.advanced_cargo.special: "Near [efh_report_state.GetName] soldiers found long sealed containers resting apart from the other cargo. Frost gathers on them at noon, and the sentries insist something inside shifts its weight during the night."
equipment_from_heavens.report.cargo_recovery.air: "Mechanics in [efh_report_state.GetName] are towing aircraft off a flooded meadow one at a time. They report that every plane has full tanks and loaded guns, and that none of the cockpit gauges has been calibrated for local measures."
equipment_from_heavens.report.cargo_recovery.armor: "Recovery crews in [efh_report_state.GetName] are dragging armored vehicles out of drainage ditches with borrowed plough horses. Several engines started on the first try, which frightened the teams more than any breakdown would have."
equipment_from_heavens.report.cargo_recovery.general: "Work gangs in [efh_report_state.GetName] are prying open crates of rifles, shells, and field kit and carrying them to the railhead by cart, wheelbarrow, and hand."
equipment_from_heavens.report.cargo_recovery.logistics: "Army drivers in [efh_report_state.GetName] have been driving new trucks in convoy to the depot since dawn. The column has not yet shrunk at the landing site."
equipment_from_heavens.report.civilian_disruption.general: "Farmers in [efh_report_state.GetName] demand payment for crushed crops and broken fences. Children collect parachute cord, and the markets are selling tins of rations that nobody admits taking."
equipment_from_heavens.report.depot_congestion.general: "The depots around [efh_report_state.GetName] are full. Quartermasters have taken over warehouses, churches, and a football ground, and trains are waiting on the main line because the yards have no room to turn them."
equipment_from_heavens.report.final_reconciliation.general: "Recovery crews have brought the last loads from [efh_report_state.GetName] safely into storage. The army must decide what to do with an arsenal it never ordered."
equipment_from_heavens.report.first_discovery.air: "Police in [efh_report_state.GetName] reported aircraft parked in rows along a country road, wingtip to wingtip, with dew still on the canopies. The nearest airfield is more than a day's march away."
equipment_from_heavens.report.first_discovery.armor: "The garrison at [efh_report_state.GetName] found tank tracks cut into the wet fields and followed them to machines resting under torn canopies. Soldiers are stringing rope between the vehicles to keep farmers from climbing into the turrets."
equipment_from_heavens.report.first_discovery.general: "Soldiers from [efh_report_state.GetName] have ringed a stretch of farmland with rope and sentries. Inside the line, crates are stacked higher than the barns and parachute silk hangs from the telegraph wires."
equipment_from_heavens.report.first_discovery.logistics: "A stationmaster in [efh_report_state.GetName] telegraphed that his sidings, empty at midnight, now hold locomotives, wagons, and lines of trucks parked as neatly as a depot on inspection day."
equipment_from_heavens.report.provenance_anomaly.general: "Inspectors from the war ministry spent two days in [efh_report_state.GetName] comparing the equipment with every catalogue in the army's possession. They returned with longer questions than they took with them."
equipment_from_heavens.report.recovery_accident.nuclear: "A handling crew at [efh_report_state.GetName] lost control of a load while clearing the sealed casings. The fire that followed spread through the stacked cargo and wrecked the nearest roads before the site could be isolated."
equipment_from_heavens.report.recovery_accident.special: "At [efh_report_state.GetName] one of the sealed containers was opened too early. Whatever was inside broke through the cordon and tore up the depot before the guards regained the site."
