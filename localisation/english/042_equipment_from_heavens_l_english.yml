equipment_from_heavens.magnitude.enormous: "Enormous"
equipment_from_heavens.magnitude.colossal: "Colossal"
equipment_from_heavens.magnitude.impossible: "Impossible"

equipment_from_heavens.group.infantry: "Rifles, machine guns, mortars, and field kit fill the fields, enough to arm thousands."
equipment_from_heavens.group.guns: "Field guns, anti-tank weapons, and anti-aircraft batteries line the roads."
equipment_from_heavens.group.armor: "Armored vehicles lie nose-deep in ploughed fields, their engines still clean."
equipment_from_heavens.group.air: "Aircraft stand intact in meadows and on country roads, without ferry crews."
equipment_from_heavens.group.logistics: "Trucks, locomotives, and freight convoys crowd places with no room for them."
equipment_from_heavens.group.foreign_warehouse: "Rifles, tractors, aircraft, and spare parts from rival designs lie jumbled together."

equipment_from_heavens.stage.baseline: "Most pieces look familiar, though some are newer than anything in service."
equipment_from_heavens.stage.evolution_i: "Specialized machines suit terrain and tactics the army has never faced."
equipment_from_heavens.stage.evolution_ii: "Some designs appear years beyond anything any army has fielded."
equipment_from_heavens.stage.evolution_iii: "Sealed containers unsettle the engineers and the guards assigned to watch them."

equipment_from_heavens.signature.1: "Maker's marks are gone, but the metal shows no grinding or fresh paint."
equipment_from_heavens.signature.2: "Rifles, trucks, and guns share serial numbers despite having no common factory."
equipment_from_heavens.signature.3: "Factory plates name cities absent from every map the clerks can find."
equipment_from_heavens.signature.4: "Acceptance stamps show a production year that has not yet arrived."
equipment_from_heavens.signature.5: "Crates bear another country's markings on weapons its army has never fielded."
equipment_from_heavens.signature.6: "The engines bear fresh grease, but none of the toolkits fits a standard workshop."
equipment_from_heavens.signature.7: "Each crate holds the same inventory, handwritten in a different language."
equipment_from_heavens.signature.8: "Old and new equipment bears identical wear and matching scratches."
equipment_from_heavens.signature.9: "Spare parts fit models with no other match in the delivery."
equipment_from_heavens.signature.10: "The ammunition fits weapons used by armies preparing to fight each other."
equipment_from_heavens.signature.11: "The sealed instructions use military terms in combinations no staff college would write."

equipment_from_heavens.report.first_discovery.title: "The First Cordon"
equipment_from_heavens.report.cargo_recovery.title: "Recovery Work"
equipment_from_heavens.report.depot_congestion.title: "The Depots Overflow"
equipment_from_heavens.report.provenance_anomaly.title: "Nobody Made This"
equipment_from_heavens.report.civilian_disruption.title: "Villagers and Crates"
equipment_from_heavens.report.advanced_cargo.title: "Cargo Nobody Recognises"
equipment_from_heavens.report.final_reconciliation.title: "The Last Cargo"
equipment_from_heavens.report.recovery_accident.title: "Accident at the Recovery Site"

equipment_from_heavens.report.first_discovery.option: "Keep the roads open."
equipment_from_heavens.report.cargo_recovery.option: "Bring up every tractor we have."
equipment_from_heavens.report.depot_congestion.option: "Use the schoolhouses if we must."
equipment_from_heavens.report.provenance_anomaly.option: "File it with the rest."
equipment_from_heavens.report.civilian_disruption.option: "Pay for the fences and move on."
equipment_from_heavens.report.advanced_cargo.option: "Double the guard."
equipment_from_heavens.report.final_reconciliation.option: "Bring the last cargo into storage."
equipment_from_heavens.report.recovery_accident.option: "Seal the site and count the losses."

equipment_from_heavens.report.first_discovery.armor: "Tank tracks led the garrison to vehicles under torn parachutes in [efh_report_state.GetName]. Soldiers keep farmers away from the turrets."
equipment_from_heavens.report.first_discovery.air: "Aircraft stand wingtip to wingtip along a country road in [efh_report_state.GetName]. The nearest airfield is a day's march away."
equipment_from_heavens.report.first_discovery.logistics: "Locomotives, wagons, and trucks fill the sidings at [efh_report_state.GetName], though they stood empty at midnight."
equipment_from_heavens.report.first_discovery.general: "Sentries ring the fields at [efh_report_state.GetName], where crates tower above barns and parachutes snag telegraph wires."
equipment_from_heavens.report.cargo_recovery.armor: "Crews drag tanks from ditches in [efh_report_state.GetName]. Several engines start at once, startling the horses."
equipment_from_heavens.report.cargo_recovery.air: "Mechanics tow aircraft from a flooded meadow in [efh_report_state.GetName]. Their gauges use unfamiliar measures."
equipment_from_heavens.report.cargo_recovery.logistics: "Drivers carry trucks from [efh_report_state.GetName] toward the depot, but the line barely shrinks."
equipment_from_heavens.report.cargo_recovery.general: "Work gangs pry open crates in [efh_report_state.GetName] and haul rifles, shells, and field kit toward the railhead."
equipment_from_heavens.report.depot_congestion.general: "Every depot near [efh_report_state.GetName] is full. Warehouses and churches hold cargo while trains wait outside the yards."
equipment_from_heavens.report.provenance_anomaly.general: "Inspectors compared cargo in [efh_report_state.GetName] with every army catalogue. They returned with more questions than answers."
equipment_from_heavens.report.civilian_disruption.general: "Farmers in [efh_report_state.GetName] seek payment for ruined crops and fences. Parachute cord and stolen rations appear in local markets."
equipment_from_heavens.report.advanced_cargo.special: "Sealed containers sit apart from the cargo near [efh_report_state.GetName]. Frost forms at noon, and guards hear movement inside at night."
equipment_from_heavens.report.advanced_cargo.nuclear: "Heavy casings near [efh_report_state.GetName] contain tools and instructions for weapons the army has never owned."
equipment_from_heavens.report.advanced_cargo.conventional: "Engineers in [efh_report_state.GetName] found unfamiliar vehicles and guns with features they cannot yet test."
equipment_from_heavens.report.recovery_accident.nuclear: "A load slipped during recovery near [efh_report_state.GetName]. Fire consumed cargo and damaged nearby roads before crews contained it."
equipment_from_heavens.report.recovery_accident.special: "A sealed container broke open at [efh_report_state.GetName]. Its contents tore through the depot before guards retook the site."
equipment_from_heavens.report.final_reconciliation.general: "Crews brought the last loads from [efh_report_state.GetName] into storage. Roads and depots remain burdened by the cargo."

