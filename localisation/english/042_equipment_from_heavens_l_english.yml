equipment_from_heavens.evolution.type: "Skyfall Evolution"
equipment_from_heavens.evolution.summary: "The deliveries have changed in character."
equipment_from_heavens.evolution.stage_1.title: "Everything Falls"
equipment_from_heavens.evolution.stage_1.body: "The cargo ranges from amphibious vehicles to armor built for unfamiliar terrain."
equipment_from_heavens.evolution.stage_2.title: "Arsenal of the Future"
equipment_from_heavens.evolution.stage_2.body: "The designs surpass current armies, and some deliveries include sealed atomic stockpiles."
equipment_from_heavens.evolution.stage_3.title: "Chaos Arsenal"
equipment_from_heavens.evolution.stage_3.body: "Equipment from other strange upheavals now falls far from its origin."

equipment_from_heavens.event_details.description: "A random country wakes to find an enormous military arsenal scattered across its land, with no sender, flight path, or shipping record. The size of the country makes no difference to the size of the delivery. The recipient gains weapons it may be unable to crew, fuel, supply, or reproduce, and the deliveries grow stranger as the world slides further into chaos. Borrowed Nightmare requires a land battle victory by a commander whose army contains special equipment from a normal sky delivery, before its source event occurs and within 1095 days of receiving it. Forced deliveries do not qualify."
equipment_from_heavens.event_details.history: "Recipient: [efh_history_detail_recipient.GetName]\nDelivery: [This.GetEquipmentFromHeavensHistoryMagnitude], mostly [This.GetEquipmentFromHeavensHistoryGroup], across [?efh_history_detail_report_count|0] landing sites.\n[This.GetEquipmentFromHeavensHistoryCargo]\n\nAn enormous arsenal has appeared across the country with no known sender or route. Its size bears no relation to the size of the recipient."

chaosx.events_log.events.na_reason.equipment_from_heavens_recipient: "\n§RUnavailable: no ordinary country holds a state where the cargo could land.§!"

