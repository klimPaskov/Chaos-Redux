equipment_from_heavens_landing_zone_desc: "Fallen military cargo blocks the roads and fills every depot in this state."

equipment_from_heavens_achievement_eligible_tooltip: "Receive a normal delivery while under player control; forced deliveries do not qualify."
042_equipment_from_heavens_tiny_arsenal_state: "Tiny Arsenal State"
042_equipment_from_heavens_tiny_arsenal_state_desc: "Receive an arsenal from the sky as a country with fewer than ten factories, then turn it into an army that defeats a great power."
042_equipment_from_heavens_tiny_arsenal_state_NAME: "$042_equipment_from_heavens_tiny_arsenal_state$"
042_equipment_from_heavens_tiny_arsenal_state_DESC: "$042_equipment_from_heavens_tiny_arsenal_state_desc$"
042_equipment_from_heavens_tiny_arsenal_state_tooltip: "As a country with fewer than ten factories at the delivery, field fifty more divisions within a year while holding your capital, then make a major country capitulate or surrender to you within three years of the delivery."
042_equipment_from_heavens_nuclear_lottery: "Nuclear Lottery"
042_equipment_from_heavens_nuclear_lottery_desc: "Receive atomic bombs from the sky and use one before your own scientists could have built it."
042_equipment_from_heavens_nuclear_lottery_NAME: "$042_equipment_from_heavens_nuclear_lottery$"
042_equipment_from_heavens_nuclear_lottery_DESC: "$042_equipment_from_heavens_nuclear_lottery_desc$"
042_equipment_from_heavens_nuclear_lottery_tooltip: "Receive atomic bombs from the sky while holding none and lacking nuclear production, then carry out a nuclear strike before gaining nuclear production."
042_equipment_from_heavens_borrowed_nightmare: "Borrowed Nightmare"
042_equipment_from_heavens_borrowed_nightmare_desc: "Win a land battle with a commander whose army contains special equipment recovered from a normal sky delivery, before its source event occurs and within 1095 days of receiving it. Forced deliveries do not qualify."
042_equipment_from_heavens_borrowed_nightmare_NAME: "$042_equipment_from_heavens_borrowed_nightmare$"
042_equipment_from_heavens_borrowed_nightmare_DESC: "$042_equipment_from_heavens_borrowed_nightmare_desc$"
042_equipment_from_heavens_borrowed_nightmare_tooltip: "Receive special equipment from a normal sky delivery before its source event occurs. Within 1095 days, win a land battle with a commander whose army contains that equipment, while its source event is still absent. Remain under player control. Forced deliveries do not qualify."
chaosx.nr42.summary.d: "Recovery crews cleared [?efh_recovery_sites_cleared|0] sites. The last loads are in storage, but roads and depots remain burdened."
chaosx.nr42.summary.accident_d: "Recovery crews cleared [?efh_recovery_sites_cleared|0] sites. The last loads are in storage, but [?efh_accident_loss_amount|0] pieces were lost and local infrastructure was damaged."
chaosx.nr42.summary.zone_tt: "Recovery sites across the country burden local roads and depots, slowing supply, construction, and repairs."
chaosx.nr42.unavailable.t: "No Clear Landing Ground"
chaosx.nr42.unavailable.d: "The cargo cannot be delivered. No country has a clear landing ground under its own control, or those that do are still clearing an earlier delivery."
chaosx.nr42.unavailable.a: "Wait for the roads to clear."
# Retained for queued events using the former singular-file keys.
chaosx.nr42.2.t: "Equipment from heavens!"
chaosx.nr42.2.d: "Unfamiliar military equipment has fallen into our depots. Engineers are studying it and preparing it for our formations."
chaosx.nr42.2.a: "Study the equipment."
chaosx.news.47.t: "Equipment from heavens"
chaosx.news.47.d: "Military equipment has appeared in [From.GetName]'s depots without a known source. Engineers cannot explain how it arrived or who sent it."
chaosx.news.47.a: "The source is unknown."

chaosx.nr42.recovery_halted.t: "Recovery Halted"
chaosx.nr42.recovery_halted.d: "Our forces no longer hold a landing ground. Recovery teams have withdrawn, and the army cannot continue clearing the roads and depots."
chaosx.nr42.recovery_halted.a: "Withdraw the recovery teams."
