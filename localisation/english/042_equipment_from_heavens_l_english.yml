chaosx.nr42.1.t: "An Arsenal from an Empty Sky"
chaosx.nr42.1.desc.enormous: "Before dawn, crates, guns, and parachutes covered the fields near [efh_first_landing_state.GetName]. [Root.GetEquipmentFromHeavensGroupClause] The unfamiliar stores arrived without a sound of engines. [Root.GetEquipmentFromHeavensStageClause] [Root.GetEquipmentFromHeavensSignatureClue]"
chaosx.nr42.1.desc.colossal: "Military stores cover the rail sidings, orchards, and parade grounds around [efh_first_landing_state.GetName]. [Root.GetEquipmentFromHeavensGroupClause] The drop stretches beyond the horizon, and the army has not finished counting it. [Root.GetEquipmentFromHeavensStageClause] [Root.GetEquipmentFromHeavensSignatureClue]"
chaosx.nr42.1.desc.impossible: "Fields around [efh_first_landing_state.GetName] are buried beneath a vast arsenal, with more cargo scattered across [Root.GetNameDef]. [Root.GetEquipmentFromHeavensGroupClause] The roads and depots cannot absorb it all. [Root.GetEquipmentFromHeavensStageClause] [Root.GetEquipmentFromHeavensSignatureClue]"
chaosx.nr42.1.a: "Secure the cargo."
chaosx.nr42.1.magnitude_tt: "The delivery is §Y[Root.GetEquipmentFromHeavensMagnitudeName]§! and has already been added to the national stockpile:"
