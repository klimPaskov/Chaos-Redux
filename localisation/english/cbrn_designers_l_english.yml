l_english:
cbrn_chemical_munitions_combine: "Chemical Munitions Combine"
cbrn_chemical_munitions_combine_desc: "A national network of filling plants, munitions laboratories, storage depots, and front-distribution offices dedicated to chemical payload production."
cbrn_munitions_header_operations: "FORMULATION, FILLING, AND DISTRIBUTION"
cbrn_chemical_munitions_combine_initial_trait: "Shell Filling Lines"
cbrn_munitions_stable_choking_fill: "Stable Choking Fill"
cbrn_munitions_stable_choking_fill_tt: "Choking-agent conversion into filled shell lots retains §G5%§! more usable material, but stabilized choking artillery releases deliver §R5%§! less exposure dose."
cbrn_munitions_stable_choking_fill_requirement_tt: "Requires Chlorine Gas or Phosgene."
cbrn_munitions_persistent_agent_formulation: "Persistent Agent Formulation"
cbrn_munitions_persistent_agent_formulation_tt: "Blister-agent releases create §R5%§! more contamination, persist §R15%§! longer, and leave §R15%§! more evidence."
cbrn_munitions_persistent_agent_formulation_requirement_tt: "Requires Mustard Gas or Lewisite."
cbrn_munitions_rapid_front_distribution: "Rapid Front Distribution"
cbrn_munitions_rapid_front_distribution_tt: "Chemical shell-filling profile changes complete §G20%§! faster."
cbrn_munitions_standardized_fuzes: "Standardized Fuzes"
cbrn_munitions_standardized_fuzes_tt: "Chemical artillery releases leave §R15%§! more evidence through recognizable fuze and filling signatures."
cbrn_munitions_shell_route_requirement_tt: "Requires Chemical Artillery Shells."
cbrn_munitions_high_output_filling_complex: "High-Output Filling Complex"
cbrn_munitions_high_output_filling_complex_tt: "Concentrated throughput lowers cost and raises output at the expense of storage integrity and accident resilience."
cbrn_munitions_high_output_requirement_tt: "Requires Operational Chemical Readiness."

cbrn_aerosol_air_delivery_bureau: "Aerosol and Air Delivery Bureau"
cbrn_aerosol_air_delivery_bureau_desc: "A technical directorate coordinating sealed payload manufacture, aircraft handling interfaces, dispersal trials, and selected-state release planning."
cbrn_aerosol_header_airframe_interface: "PAYLOAD INTERFACE"
cbrn_aerosol_header_release_control: "RELEASE CONTROL"
cbrn_aerosol_air_delivery_bureau_initial_trait: "Sealed Aerosol Handling"
cbrn_aerosol_lightweight_payload_assemblies: "Lightweight Payload Assemblies"
cbrn_aerosol_lightweight_payload_assemblies_tt: "Unlocks agent-specific lightweight rack variants with §G25%§! less installation weight and agility loss, but §R20%§! lower payload volume."
cbrn_aerosol_sealed_bomb_bay_interfaces: "Sealed Bomb-Bay Interfaces"
cbrn_aerosol_sealed_bomb_bay_interfaces_tt: "Chemical air releases carry §G20%§! less friendly-exposure risk."
cbrn_aerosol_controlled_dispersal: "Controlled Dispersal"
cbrn_aerosol_controlled_dispersal_tt: "Partial releases deliver §Y45-60%§! dose and catastrophic releases §Y115-130%§! dose, narrowing both result bands. Air payload profile changes take §R15%§! longer."
cbrn_aerosol_long_range_payload: "Long-Range Payload"
cbrn_aerosol_long_range_payload_tt: "Unlocks agent-specific long-range rack variants with §G20%§! more aircraft range and §R25%§! greater agility loss than the corresponding standard or lightweight rack. This trait does not authorize strategic-bomber delivery."
cbrn_aerosol_long_range_payload_requirement_tt: "Requires Strategic Release Authority."
cbrn_aerosol_precision_release: "Precision Release"
cbrn_aerosol_precision_release_tt: "Chemical air releases expose §G25%§! fewer civilians and create §G15%§! less area contamination, at the cost of slower payload output."

cbrn_protective_equipment_consortium: "Protective Equipment Consortium"
cbrn_protective_equipment_consortium_desc: "A national network of respirator manufacturers, filter laboratories, fitting offices, and protective-clothing workshops."
cbrn_protection_header_military: "MILITARY PROTECTION"
cbrn_protection_header_civil: "CIVIL PROTECTION"
cbrn_protective_equipment_consortium_initial_trait: "Standardized Respirator Production"
cbrn_protection_durable_filter_canisters: "Durable Filter Canisters"
cbrn_protection_durable_filter_canisters_tt: "Filters and issued masks suffer §G15%§! less condition loss. Gas masks gain §G15%§! reliability but cost §R3%§! more."
cbrn_protection_mass_civilian_pattern: "Mass Civilian Pattern"
cbrn_protection_mass_civilian_pattern_tt: "Civilian mask distribution is §G15%§! more efficient, but military mask protection is §R5%§! less effective."
cbrn_protection_protective_clothing_sets: "Protective Clothing Sets"
cbrn_protection_protective_clothing_sets_tt: "Advanced and sealed sets provide stronger blister-agent skin protection, but cost §R10%§! more."
cbrn_protection_low_resistance_facepiece: "Low-Resistance Facepiece"
cbrn_protection_low_resistance_facepiece_tt: "The movement, attack, organization, and supply penalties of an active Theater Protective Posture are §G30%§! lower. Additional material work raises mask cost by §R5%§!."
cbrn_protection_sealed_assault_ensemble: "Sealed Assault Ensemble"
cbrn_protection_sealed_assault_ensemble_tt: "Issued sealed assault sets provide additional nerve-agent and vehicle protection. Their production cost rises by §R15%§!."
cbrn_protection_sealed_assault_ensemble_requirement_tt: "Requires Sealed Assault Protection."

cbrn_mobile_decontamination_works: "Mobile Decontamination Works"
cbrn_mobile_decontamination_works_desc: "A national manufacturer of wash columns, field neutralization sets, contaminated-vehicle recovery gear, and route-clearance equipment."
cbrn_decon_header_field_systems: "FIELD DECONTAMINATION SYSTEMS"
cbrn_mobile_decontamination_works_initial_trait: "Standard Mobile Plant"
cbrn_decon_truck_mounted_wash_systems: "Truck-Mounted Wash Systems"
cbrn_decon_truck_mounted_wash_systems_tt: "Decontamination equipment costs §G8%§! less, while supported decontamination preparations consume §G15%§! less equipment and take §G20%§! less time."
cbrn_decon_low_water_process: "Low-Water Process"
cbrn_decon_low_water_process_tt: "Cleanup in verified arid or low-infrastructure states is §G25%§! stronger."
cbrn_decon_vehicle_recovery_teams: "Vehicle Recovery Teams"
cbrn_decon_vehicle_recovery_teams_tt: "Vehicle attrition caused by controlled chemical contamination is §G20%§! lower. Decontamination equipment gains §G10%§! reliability."
cbrn_decon_rapid_route_clearance: "Rapid Route Clearance"
cbrn_decon_rapid_route_clearance_tt: "Theater decontamination assignments remove §G25%§! more contamination."

cbrn_biological_security_directorate: "Biological Security Directorate"
cbrn_biological_security_directorate_desc: "A national directorate coordinating pathogen custody, distributed surveillance, containment teams, and weapon-delivery safety."
cbrn_biosecurity_header_defensive: "BIOLOGICAL SECURITY"
cbrn_biosecurity_header_offensive: "WEAPONIZATION"
cbrn_biological_security_directorate_initial_trait: "Controlled Pathogen Program"
cbrn_biosecurity_sealed_sample_chain: "Sealed Sample Chain"
cbrn_biosecurity_sealed_sample_chain_tt: "Biological stockpile safety rises by §G10§!, and exact facility-capture release risk is reduced by §G25%§!."
cbrn_biosecurity_distributed_surveillance: "Distributed Surveillance"
cbrn_biosecurity_distributed_surveillance_tt: "Ordinary biological outbreaks are detected §G25%§! more effectively."
cbrn_biosecurity_mobile_containment_team: "Mobile Containment Team"
cbrn_biosecurity_mobile_containment_team_tt: "Spread from an exact captured-facility release is §G25%§! lower."
cbrn_biosecurity_stable_weaponization: "Stable Weaponization"
cbrn_biosecurity_stable_weaponization_tt: "All four ordinary biological agents gain the same §G5§! success chance in covert and supply-chain operations, while failed strategic delivery is §G25%§! less likely to become an attacker-side accident. Released or recovered material leaves §R25%§! more evidence. Agent identity never changes raid success odds."
cbrn_biosecurity_accelerated_cultivation: "Accelerated Cultivation"
cbrn_biosecurity_accelerated_cultivation_tt: "Biological payload output rises by §G15%§!, but ordinary stockpile accident risk rises by §R15§!."
cbrn_biosecurity_fail_safe_facilities: "Fail-Safe Facilities"
cbrn_biosecurity_fail_safe_facilities_tt: "Prevents ordinary biological stockpile accidents when the exact arsenal is otherwise secure. Sabotage, bombing, capture releases, and doomsday releases remain possible."
cbrn_biosecurity_fail_safe_facilities_requirement_tt: "Requires Sealed Containment Laboratories."
cbrn_biosecurity_strategic_dissemination_program: "Strategic Dissemination Program"
cbrn_biosecurity_strategic_dissemination_program_tt: "Every ordinary biological release gains §R20%§! physical potency regardless of agent. Evidence and Condemnation rise by §R50%§!, and ordinary stockpile accident risk rises by §R25§!. Raid success odds remain agent-neutral."

cbrn_medical_countermeasure_directorate: "Medical Countermeasure Directorate"
cbrn_medical_countermeasure_directorate_desc: "A national medical institution coordinating respiratory care, burn treatment, antidote readiness, vaccination, and mobile casualty sorting."
cbrn_medical_header_treatment: "EXPOSURE MEDICINE"
cbrn_medical_header_public_health: "PUBLIC HEALTH"
cbrn_medical_countermeasure_directorate_initial_trait: "Countermeasure Instrument Standardization"
cbrn_medical_respiratory_care: "Respiratory Care"
cbrn_medical_respiratory_care_tt: "Choking-agent deaths are §G20%§! lower when the exposed state is controlled by this country."
cbrn_medical_burn_treatment: "Burn Treatment"
cbrn_medical_burn_treatment_tt: "Continuing deaths from blister agents are §G20%§! lower when the exposed state is controlled by this country."
cbrn_medical_antidote_production: "Antidote Production"
cbrn_medical_antidote_production_tt: "Nerve-agent deaths are §G20%§! lower when the exposed state is controlled by this country."
cbrn_medical_vaccine_scale: "Vaccine Scale"
cbrn_medical_vaccine_scale_tt: "Smallpox outbreak harm is §G25%§! lower when the affected state is controlled by this country."
cbrn_medical_mobile_casualty_sorting: "Mobile Casualty Sorting"
cbrn_medical_mobile_casualty_sorting_tt: "Chemical and biological incidents create §G25%§! less medical saturation. CBRN instrument output rises by §G8%§!."
cbrn_medical_international_medical_mission: "International Medical Mission"
cbrn_medical_international_medical_mission_tt: "International medical aid is §G25%§! stronger and verified sanctions-compliance credibility is §G15%§! more effective."
