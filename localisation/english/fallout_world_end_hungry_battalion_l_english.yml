fallout_hungry_battalion_equal_measure: "One Ration Measure"
fallout_hungry_battalion_equal_measure_desc: "Soldiers and households share the same ration scale at the cost of immediate military readiness."
fallout_hungry_battalion_field_requisition: "Field Requisition Columns"
fallout_hungry_battalion_field_requisition_desc: "Patrols collect food along their routes while farm districts record the coercion."
fallout_hungry_battalion_rear_echelon_stand_down: "Rear-Echelon Stand-Down"
fallout_hungry_battalion_rear_echelon_stand_down_desc: "Depot staff and labor companies work the harvest while army organization and combat strength contract."
fallout_hungry_battalion_grievance: "The Granary Grievance"
fallout_hungry_battalion_grievance_desc: "Separate military and civilian ration lists have turned every missing sack into a threat."
