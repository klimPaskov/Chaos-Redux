chaosx.fallout.677.t: "The Battalion's Bread List"
chaosx.fallout.677.d: "The quartermaster at [?fallout_event_dispatch_issued_target.GetName] has placed the battalion's ration list beside the household ledger. Field kitchens are thinning their soup, yet the granary still carries the marks left by Work for Rations. [GetFalloutEvent677RationAuthority] must decide whether a rifle earns a heavier measure, whether every bowl meets the same scale, whether patrols may collect food in the field, or whether rear personnel return to the harvest."
chaosx.fallout.677.a: "Seal a protected military issue"
chaosx.fallout.677.b: "Use one measure for every bowl"
chaosx.fallout.677.c: "Let the patrols collect their supper"
chaosx.fallout.677.d: "Stand down the rear echelon"
chaosx.fallout.677.a.tt: "Spend Food 5, Fuel 1, Recognition 2, and 6 Command Power. The battalion gains a protected issue. Civilian hunger and distrust can rise."
chaosx.fallout.677.b.tt: "Spend Food 4, Recognition 1, and 3 Command Power. Soldiers and households use the same ration measure. Cohesion improves while military readiness falls."
chaosx.fallout.677.c.tt: "Spend Fuel 2, Medicine 1, Recognition 2, and 8 Command Power. Patrols seek food beyond the granary. Failure carries the greatest civilian loss and can damage a civilian factory."
chaosx.fallout.677.d.tt: "Spend Food 2, Medicine 1, and 8 Army Experience. Rear personnel return to the harvest for 240 days. No division or equipment is removed."

chaosx.fallout.679.t: "The Granary Gate Answers"
chaosx.fallout.679.protected.success.d: "The quartermaster's sealed bins in [?fallout_event_dispatch_issued_target.GetName] kept the field kitchens open. Battalion watches stayed at their posts, but household measures shrank and the food council recorded the privilege in red ink."
chaosx.fallout.679.protected.partial.d: "The protected issue reached the front companies in [?fallout_event_dispatch_issued_target.GetName], then failed at the depot line. Soldiers kept enough strength for guard duty while the civilian queue learned which bowls came first."
chaosx.fallout.679.protected.failure.d: "The sealed bins in [?fallout_event_dispatch_issued_target.GetName] were opened by a hungry crowd before the battalion received its share. The granary road broke into fighting and the Deaths register records the lost households."
chaosx.fallout.679.equal.success.d: "The same iron measure passed from mess tin to household bowl in [?fallout_event_dispatch_issued_target.GetName]. The battalion accepted the rule, the granary queue held, and the food council gained an agreement that both sides can defend."
chaosx.fallout.679.equal.partial.d: "The common measure held at the granary in [?fallout_event_dispatch_issued_target.GetName], but several companies kept private stores. The public ration survived with weaker watches and a grievance inside the barracks."
chaosx.fallout.679.equal.failure.d: "Officers in [?fallout_event_dispatch_issued_target.GetName] rejected the common measure and households refused the next levy. The food council lost control of both lists and the Deaths register records the shortage."
chaosx.fallout.679.requisition.success.d: "Patrols returned to [?fallout_event_dispatch_issued_target.GetName] with grain, roots, and penned animals. The field kitchens filled quickly. Farm doors now carry chalk marks that the owners will remember."
chaosx.fallout.679.requisition.partial.d: "The patrols reached the granary at [?fallout_event_dispatch_issued_target.GetName] with half their carts full. They also brought injured farmers, damaged seed stores, and a requisition ledger that no village accepts as settled."
chaosx.fallout.679.requisition.failure.d: "The requisition columns outside [?fallout_event_dispatch_issued_target.GetName] met armed households and empty barns. A civilian workshop burned during the retreat, the granary lost more than it gained, and the Deaths register carries the names."
chaosx.fallout.679.stand_down.success.d: "Depot clerks, labor companies, and recovering soldiers reported to the fields of [?fallout_event_dispatch_issued_target.GetName]. The granary reserve rose while battalion drills stopped and the road watches thinned."
chaosx.fallout.679.stand_down.partial.d: "Only part of the rear echelon reached the fields of [?fallout_event_dispatch_issued_target.GetName]. The harvest gained hands, but the battalion lost more readiness than the granary recovered."
chaosx.fallout.679.stand_down.failure.d: "The stand-down order emptied depots in [?fallout_event_dispatch_issued_target.GetName] without filling the harvest crews. Stores went unguarded, the ration line failed, and the Deaths register records the shortage."
chaosx.fallout.679.a: "Enter the issue in both ledgers"
chaosx.fallout.679.a.tt: "Apply the ration policy to Food Compact resources, military readiness, the selected state's Air Winter conditions, and the civil-military ledgers. The second measure is taken after 210 days."

chaosx.fallout.681.t: "The Second Measure"
chaosx.fallout.681.success.d: "The second measure at [?fallout_event_dispatch_issued_target.GetName] finds the battalion and the households still using an accepted ration rule. The granary has enough reserve for the next cold season and neither list needs armed guards."
chaosx.fallout.681.partial.d: "The second measure at [?fallout_event_dispatch_issued_target.GetName] finds a ration rule that survives through exceptions. The field kitchens and household queue remain open, but every missing sack starts the same accusation."
chaosx.fallout.681.failure.d: "The second measure at [?fallout_event_dispatch_issued_target.GetName] cannot be taken. Soldiers and households arrive with separate lists, the granary doors close under guard, and the Deaths register records the renewed shortage."
chaosx.fallout.681.a: "Close the ration books"
chaosx.fallout.681.a.tt: "Preserve the chosen military-food memory, record the review, and close the authenticated granary receipt."

fallout.event_log.hungry_battalion.name: "The Battalion's Bread List"
fallout.event_log.hungry_battalion.detail: "[GetFalloutEvent677EventLogDetail]"
fallout.event_log.hungry_battalion.detail.choice_protected_issue: "The country reserved a protected granary issue for the battalion."
fallout.event_log.hungry_battalion.detail.choice_equal_measure: "The country placed soldiers and households under one ration measure."
fallout.event_log.hungry_battalion.detail.choice_field_requisition: "The country authorized patrols to collect food along their field routes."
fallout.event_log.hungry_battalion.detail.choice_rear_echelon_stand_down: "The country returned rear-echelon personnel to the harvest."
fallout.event_log.hungry_battalion.detail.protected_issue_success: "The protected military issue kept the field kitchens open while civilian hunger rose."
fallout.event_log.hungry_battalion.detail.protected_issue_partial: "The protected issue reached the front companies but deepened the granary grievance."
fallout.event_log.hungry_battalion.detail.protected_issue_failure: "The protected bins were breached and the Deaths register recorded fighting at the granary."
fallout.event_log.hungry_battalion.detail.equal_measure_success: "The battalion and the households accepted one durable ration measure."
fallout.event_log.hungry_battalion.detail.equal_measure_partial: "The common measure survived beside private company stores."
fallout.event_log.hungry_battalion.detail.equal_measure_failure: "Officers and households rejected the common measure and the ration lists broke apart."
fallout.event_log.hungry_battalion.detail.field_requisition_success: "Patrols filled the field kitchens and left a durable coercion memory in the farm districts."
fallout.event_log.hungry_battalion.detail.field_requisition_partial: "The patrols returned with food, injuries, and an unsettled village grievance."
fallout.event_log.hungry_battalion.detail.field_requisition_failure: "The requisition columns failed, damaged a civilian workshop, and caused the chain's largest bounded civilian loss."
fallout.event_log.hungry_battalion.detail.rear_echelon_stand_down_success: "Rear personnel restored the granary reserve while the battalion accepted a long readiness penalty."
fallout.event_log.hungry_battalion.detail.rear_echelon_stand_down_partial: "The stand-down added harvest labor but weakened the battalion more than planned."
fallout.event_log.hungry_battalion.detail.rear_echelon_stand_down_failure: "The stand-down emptied depots without saving the ration line."
fallout.event_log.hungry_battalion.detail.callback_success: "The second measure preserved a stable civil-military food compact."
fallout.event_log.hungry_battalion.detail.callback_partial: "The second measure preserved the ration rule with a continuing grievance."
fallout.event_log.hungry_battalion.detail.callback_failure: "The second measure ended in a military-food crisis and another bounded Deaths entry."
fallout.event_log.hungry_battalion.detail.cancelled: "The ration record was cancelled after its authenticated state, owner, or Fallout generation changed."
fallout.event_log.hungry_battalion.detail.unknown: "The ration record has no recognized branch or review result."

