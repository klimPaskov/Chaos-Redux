l_english:
raid_type_black_plague_weaponization_air_delivery: "Black Plague Air Strike"
raid_type_black_plague_weaponization_air_delivery_desc: "Assign bombers to deliver one Black Plague payload over an enemy state. A confirmed release can begin a weaponized outbreak; surveillance, containment, and treatment shape what follows."
black_plague_weaponization_native_raid_target_visible_tt: "Select an enemy-controlled state at war with us. Rat-controlled states and states already exposed by a weaponized Black Plague release are excluded."
black_plague_weaponization_native_raid_prepare_tt: "An offensive Black Plague programme, a valid enemy state, and authorization for strategic use against that country are required."
black_plague_weaponization_native_raid_launch_tt: "The enemy state must remain controlled by that country, the war must continue, and strategic-use authorization must remain in force."
black_plague_weaponization_native_raid_failure_actor_tt: "The delivery has failed. No Black Plague exposure is confirmed in the target state."
black_plague_weaponization_native_raid_failure_target_tt: "The attempted delivery has failed. No Black Plague exposure is confirmed here."
black_plague_weaponization_native_raid_limited_actor_tt: "The bombers report limited dispersal. A confirmed release in a still-valid target carries a smaller exposure."
black_plague_weaponization_native_raid_limited_target_tt: "The raid reports limited dispersal. A confirmed release may seed a smaller Black Plague exposure here."
black_plague_weaponization_native_raid_success_actor_tt: "The raid reports delivery. A confirmed release in a still-valid target enters the public record."
black_plague_weaponization_native_raid_success_target_tt: "The raid reports delivery. A confirmed release may begin incubation here under local surveillance and containment."
black_plague_weaponization_native_raid_critical_actor_tt: "The raid reports broad dispersal. A confirmed release in a still-valid target may spread rapidly."
black_plague_weaponization_native_raid_critical_target_tt: "The raid reports broad dispersal. A confirmed release may seed Black Plague here; detection and containment can limit its spread."
