l_english:
africa_world_package.300.t: "The Centres Gather"
africa_world_package.300.d: "Delegates from the eastern coasts, river basins, inland roads, and archipelago ports have arrived. The first session must decide whether the regional centres will share a constitutional table or compete for a single seat."
africa_world_package.300.a: "Open the congress"
africa_world_package.300.a.tt: "Record the opening of the distributed-centres congress and place the founding question before its delegates."
africa_world_package.301.t: "A Seat for Every Centre"
africa_world_package.301.d: "The opening agenda has exposed a fault line. Coastal, southern, inland, and island delegates agree that the package needs a common voice, but each fears that a central bureau will turn representation into ownership."
africa_world_package.301.a: "Commit to distributed centres"
africa_world_package.301.a.tt: "Give each regional centre a protected voice and strengthen the founding settlement."
africa_world_package.301.b: "Accept a negotiated centre compact"
africa_world_package.301.b.tt: "Keep the congress together through a compromise that gives the southern and inland delegations additional guarantees."
africa_world_package.301.c: "Defer the congress"
africa_world_package.301.c.tt: "Leave the founding dispute unresolved and weaken the package's authority while delegates return home."
africa_world_package.302.t: "The Regional Table Holds"
africa_world_package.302.d: "The delegates have accepted a distributed constitutional table. No centre inherits the continent, and the inland voice receives the resources needed to keep the arrangement credible."
africa_world_package.302.a: "Seat the delegates"
africa_world_package.302.a.tt: "The successful founding vote strengthens authority, legitimacy, and inland representation."
africa_world_package.303.t: "The Centre Compact"
africa_world_package.303.d: "The congress has chosen a careful compromise. The centre seats remain distinct, while the southern delegation receives a standing guarantee against being outvoted by the larger corridors."
africa_world_package.303.a: "Publish the compact"
africa_world_package.303.a.tt: "The compromise preserves the founding settlement with a smaller authority and legitimacy gain."
africa_world_package.304.t: "The Congress Adjourns"
africa_world_package.304.d: "The delegates could not agree on a durable order. The regional centres remain in contact, but the package must carry the cost of an unfinished founding settlement."
africa_world_package.304.a: "Keep the channels open"
africa_world_package.304.a.tt: "Record the failure without granting founding proof. Authority, legitimacy, and inland representation fall."
africa_world_package.305.t: "Food, Rivers, and Corridors"
africa_world_package.305.d: "The food board and the corridor board now meet under one constitutional roof. Their delegates must decide whether shared lanes will be binding obligations or a negotiated protocol that leaves more room for regional vetoes."
africa_world_package.305.a: "Ratify the shared lanes"
africa_world_package.305.a.tt: "Bind the food, river, rail, and maritime boards to a common ratification and strengthen legitimacy."
africa_world_package.305.b: "Ratify with regional reservations"
africa_world_package.305.b.tt: "Preserve the shared lanes while granting regional reservations and accepting a small authority cost."
africa_world_package.306.t: "The First Monsoon Season"
africa_world_package.306.d: "The first full season has tested the new boards. Flood warnings, grain ledgers, and port schedules have crossed the same desks, but every centre wants a say in the order of emergency action."
africa_world_package.306.a: "Stabilise the boards"
africa_world_package.306.a.tt: "Resolve the lifecycle crisis with a stronger corridor calendar and a modest authority gain."
africa_world_package.306.b: "Accept regional strain"
africa_world_package.306.b.tt: "Let each centre retain more emergency discretion while accepting lower authority and legitimacy."

africa_world_package.400.t: "The Continental Bargain Opens"
africa_world_package.400.d: "Representatives from the United States, Canada, Mexico, Central America, the Caribbean, island governments, and Indigenous nations have assembled. The first question is whether a continental bargain can protect sovereignty while sharing capacity."
africa_world_package.400.a: "Open the bargaining table"
africa_world_package.400.a.tt: "Record the opening of the continental bargain and place membership, jurisdiction, and mobility before its delegates."
africa_world_package.401.t: "Who Sits at the Table?"
africa_world_package.401.d: "The delegates agree that the continent needs common institutions, but they disagree over the meaning of membership. Caribbean and Central American governments demand a full voice, while Indigenous nations demand that no federal clause erase local jurisdiction."
africa_world_package.401.a: "Build a represented continental bargain"
africa_world_package.401.a.tt: "Protect federal representation and establish a successful founding bargain."
africa_world_package.401.b: "Sign a negotiated sovereignty compact"
africa_world_package.401.b.tt: "Balance Caribbean inclusion, Indigenous safeguards, and federal authority through a compromise."
africa_world_package.401.c: "Defer the continental bargain"
africa_world_package.401.c.tt: "Leave membership unresolved and weaken the package's authority while the delegations return to their capitals."
africa_world_package.402.t: "A Represented Continent"
africa_world_package.402.d: "The bargain now recognises a continental table without granting one state a default claim over its neighbours. Federal representation receives a durable mandate, and the founding institutions can proceed."
africa_world_package.402.a: "Sign the represented bargain"
africa_world_package.402.a.tt: "The successful founding vote strengthens authority, legitimacy, and federal representation."
africa_world_package.403.t: "The Sovereignty Compact"
africa_world_package.403.d: "The delegates have agreed on a compact that gives Caribbean and Central American members a defined voice while preserving local jurisdiction. The arrangement is workable, but every clause carries a reservation."
africa_world_package.403.a: "Publish the compact"
africa_world_package.403.a.tt: "The compromise preserves the founding bargain with a smaller authority and legitimacy gain."
africa_world_package.404.t: "The Bargain Stalls"
africa_world_package.404.d: "The delegations could not agree on a continental membership formula. No government has surrendered its sovereignty, but the package must carry the cost of an unfinished founding bargain."
africa_world_package.404.a: "Keep the delegations in contact"
africa_world_package.404.a.tt: "Record the failure without granting founding proof. Authority, legitimacy, and federal representation fall."
africa_world_package.405.t: "The Shared Continental Lanes"
africa_world_package.405.d: "Resources, two-ocean defence, island settlements, and the Africa diaspora treaty now meet in one ratification session. The delegates must decide whether the lanes will bind the continent or remain a negotiated set of reservations."
africa_world_package.405.a: "Ratify the continental lanes"
africa_world_package.405.a.tt: "Bind the four shared lanes and strengthen federal representation, Caribbean inclusion, and legitimacy."
africa_world_package.405.b: "Ratify with local reservations"
africa_world_package.405.b.tt: "Preserve the shared lanes while giving local governments more discretion and accepting a small authority cost."
africa_world_package.406.t: "The First Continental Test"
africa_world_package.406.d: "The first full season has tested the bargain. Industry, mobility, island obligations, and the two-ocean command must now work together without turning voluntary citizenship into a compulsory movement of people."
africa_world_package.406.a: "Stabilise the bargain"
africa_world_package.406.a.tt: "Resolve the lifecycle crisis with a stronger industrial calendar and a modest authority gain."
africa_world_package.406.b: "Accept regional strain"
africa_world_package.406.b.tt: "Leave more discretion with regional governments while accepting lower authority and legitimacy."

africa_asia_seat_the_regional_centres: "Seat the regional centres"
africa_asia_seat_the_regional_centres_desc: "Give eastern, southern, inland, and archipelago centres a protected place in the constitutional table. The weakest ledger receives the largest adjustment."
africa_asia_seat_the_regional_centres_tt: "Raises the weakest regional-centre ledger and records the distributed-centres decision."
africa_asia_coordinate_food_river_and_monsoon_security: "Coordinate food, rivers, and monsoons"
africa_asia_coordinate_food_river_and_monsoon_security_desc: "Create a consent-based emergency board for grain, rivers, and monsoon warnings. No board receives ownership of a regional centre."
africa_asia_coordinate_food_river_and_monsoon_security_tt: "Raises food and river security, strengthens the southern and inland centres, and records the food-lane proof."
africa_asia_open_rail_and_maritime_corridors: "Open rail and maritime corridors"
africa_asia_open_rail_and_maritime_corridors_desc: "Open rail and port access through a shared schedule that leaves each centre free to negotiate its own contribution."
africa_asia_open_rail_and_maritime_corridors_tt: "Raises corridor coordination and the weaker eastern or archipelago centre, then records the rail-lane proof."

africa_north_america_negotiate_caribbean_and_central_membership: "Negotiate Caribbean and Central membership"
africa_north_america_negotiate_caribbean_and_central_membership_desc: "Give Caribbean and Central American governments a defined federal voice while preserving national sovereignty and local consent."
africa_north_america_negotiate_caribbean_and_central_membership_tt: "Raises Caribbean inclusion, federal representation, and national sovereignty."
africa_north_america_settle_indigenous_land_and_representation: "Settle Indigenous land and representation"
africa_north_america_settle_indigenous_land_and_representation_desc: "Recognise Indigenous land, jurisdiction, and representation safeguards before the continental bargain assigns shared powers."
africa_north_america_settle_indigenous_land_and_representation_tt: "Raises Indigenous settlement, federal representation, and migration safeguards without changing ownership of any state."
africa_north_america_balance_industry_mobility_and_command: "Balance industry, mobility, and command"
africa_north_america_balance_industry_mobility_and_command_desc: "Coordinate industrial capacity, voluntary mobility, and two-ocean command while leaving citizenship choices with the people and communities involved."
africa_north_america_balance_industry_mobility_and_command_tt: "Raises industrial balance, migration compact, and command integration."
