chaosx.fallout.838.t: "Laboratory Citizenship"
chaosx.fallout.838.opening.d: "After the failed calculation, the Manchurian Reactor Keeps must decide who may enter the laboratories that keep its winter grid alive. Repair crews want a route into technical service, registered households want equal standing, and the old reactor families want citizenship to remain a reward for obedience. The Technate can open the doors, ration the service ladder, train apprentices, or place every civic right under the senior engineers."
chaosx.fallout.838.a: "Open citizenship to every repair household"
chaosx.fallout.838.a.tt: "Spend Medicine 2, Scrap 1, and Recognition 2 to register repair households as full civic members. This strengthens legitimacy and education, but the Keeps must support a wider public roll."
chaosx.fallout.838.b: "Tie citizenship to service tiers"
chaosx.fallout.838.b.tt: "Spend Power 2, Scrap 2, and Recognition 1 to grant rights through measured reactor service. This keeps the grid orderly, but every household will watch the next allocation as a judgment."
chaosx.fallout.838.c: "Build an apprentice citizenship path"
chaosx.fallout.838.c.tt: "Spend Cohesion 2, Medicine 2, and Recognition 1 to train younger repair crews into civic membership. This creates a patient succession, but the first class will work under unequal protection."
chaosx.fallout.838.d: "Keep civic rights under the senior engineers"
chaosx.fallout.838.d.tt: "Spend Fuel 2, Power 2, and Scrap 2 to preserve a strict technocratic register. This protects immediate output, but eastern councils may treat the Keeps as a closed order."
chaosx.fallout.839.t: "Laboratory Citizenship"
chaosx.fallout.840.t: "The Civic Register Opens"
chaosx.fallout.840.universal_rights.success.d: "The Manchurian Reactor Keeps opened its civic register to every household that could show a repair, clinic, or shelter ledger. The wider roll gave eastern councils a reason to trust the Technate again, and the first laboratory class began with names rather than inherited access."
chaosx.fallout.840.universal_rights.partial.d: "The register opened across the main reactor district, but two damaged clinics could not verify their household books. Those families received provisional rights while the Keeps built a second intake desk beside the cold-season stores."
chaosx.fallout.840.universal_rights.failure.d: "The open register met three incompatible household lists and a locked archive of old reactor families. The Technate promised equal standing, yet the first applicants left with stamped slips that no eastern council would accept."
chaosx.fallout.840.service_tiers.success.d: "The Technate published three service tiers and attached each civic right to a visible repair duty. The eastern councils accepted the ladder because every tier carried a route upward, while the Keeps kept enough skilled hands on the winter grid."
chaosx.fallout.840.service_tiers.partial.d: "The service ladder kept the grid staffed, but a failed relay erased one district's night hours. The Keeps restored the missing records and left that district on review status until its crews could prove their next season of work."
chaosx.fallout.840.service_tiers.failure.d: "The service tiers turned a citizenship register into a queue of disputed hours. Reactor families received the first certificates, repair households refused the second shift, and the eastern councils began to write their own civic lists."
chaosx.fallout.840.apprentice_path.success.d: "The Keeps opened an apprentice class beside the reactor school and paired each trainee with a named repair crew. The first cohort earned civic standing through measured work, giving the Technate a succession that did not depend on one family archive."
chaosx.fallout.840.apprentice_path.partial.d: "The apprentice class began, but medicine stores forced the school to close its clinic rotation. The trainees kept their provisional standing and learned the grid in the field while the Keeps searched for a safer teaching ward."
chaosx.fallout.840.apprentice_path.failure.d: "The first apprentice class lost its shelter roster during a cold outage. Senior engineers kept their certificates, while the trainees returned to unregistered repair work and the eastern councils stopped promising them a place in the next intake."
chaosx.fallout.840.strict_technocracy.success.d: "The senior engineers kept the register closed and made its standards legible to every district supervisor. Output held through the next frost, and the Keeps gained a hard technical order that neighboring councils could bargain with even when they disliked it."
chaosx.fallout.840.strict_technocracy.partial.d: "The strict register protected the main reactor line, but the outer workshops lost access to civic review. The Technate issued narrow exemptions for clinic crews and left the wider question to a later audit."
chaosx.fallout.840.strict_technocracy.failure.d: "The senior register protected its archive while three outer workshops went uncounted. Repair households stopped reporting injuries, eastern councils withheld recognition, and the Keeps discovered that a closed civic order cannot see its own missing hands."
chaosx.fallout.840.a: "Record the citizenship settlement"
chaosx.fallout.840.a.tt: "Record the delayed civic result, apply its state and country effects, and open the later citizenship review for the Manchurian Reactor Keeps."
chaosx.fallout.841.t: "Laboratory Citizenship"
chaosx.fallout.842.t: "The Citizenship Review"
chaosx.fallout.842.success.d: "The later review found a civic register that could survive a winter shift. The Keeps kept its repair school, eastern councils could verify its households, and the next citizenship class will inherit a rule rather than a private favor."
chaosx.fallout.842.partial.d: "The review found a workable register, but one district still keeps a separate list beside the Technate archive. The settlement can continue while the Keeps negotiates how much local proof a future citizen must carry."
chaosx.fallout.842.failure.d: "The review found that the citizenship settlement never reached the outer workshops. The Technate now rations civic trust alongside power, and every later reform will begin with a memory of households left outside the register."
chaosx.fallout.842.a: "Close the citizenship review"
chaosx.fallout.842.a.tt: "Apply the delayed review, write the durable citizenship memory, and release the reserved state and neighboring receipts."
