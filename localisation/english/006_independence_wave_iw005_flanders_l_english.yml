l_english:
independence_wave_iw005_flanders_category: "The Flemish Civic-Industrial Settlement"
independence_wave_iw005_flanders_category_desc: "Civic-Industrial Coordination: §Y[?independence_wave_iw005_civic_industrial_coordination|0]§! / [?constant:independence_wave_iw005_flanders_value.maximum|0]\nScheldt Security: §Y[?independence_wave_iw005_scheldt_security|0]§! / [?constant:independence_wave_iw005_flanders_value.maximum|0]\nContinuous Guard Duty: §Y[?independence_wave_iw005_guard_hold_days|0]§! / [?constant:independence_wave_iw005_flanders_value.guard_hold_required|0] days\nInstitution: §Y[This.GetIndependenceWaveIW005FlandersInstitutionStatus]§!\n\nFlemish municipalities, factories, railways, and the Scheldt ports answer to the Belgian state, but their chains of authority do not yet agree. Civilian coordination and territorial security must mature together before a lasting settlement can be chartered. A sovereign Flemish delegation may enter a Low Countries congress without surrendering Belgium's living institutions."

independence_wave_iw005_status_contested_command: "Contested Civic-Industrial Command"
independence_wave_iw005_status_coordinated_command: "Coordinated Civic-Industrial Command"
independence_wave_iw005_status_municipal_board: "Municipal-Industrial Board"
independence_wave_iw005_status_territorial_compact: "Scheldt Territorial Compact"

independence_wave_iw005_contested_civic_industrial_command: "Contested Civic-Industrial Command"
independence_wave_iw005_contested_civic_industrial_command_desc: "Municipal authorities, factory committees, railway administrators, and regular officers issue competing orders. Production moves unevenly, garrisons consume supplies without a common schedule, and every emergency becomes a constitutional dispute."
independence_wave_iw005_coordinated_civic_industrial_command: "Coordinated Civic-Industrial Command"
independence_wave_iw005_coordinated_civic_industrial_command_desc: "The municipal ledgers, depot schedules, and territorial command now share a single operating picture. The arrangement remains provisional, but civilian and military authorities can move equipment and manpower without fighting over every order."
independence_wave_iw005_municipal_industrial_board: "Municipal-Industrial Board"
independence_wave_iw005_municipal_industrial_board_desc: "Mayors, port administrators, railway managers, and factory delegates hold the decisive warrants. The board can coordinate production and public services efficiently, but military supply requests must pass through a demanding civilian review."
independence_wave_iw005_scheldt_territorial_compact: "Scheldt Territorial Compact"
independence_wave_iw005_scheldt_territorial_compact_desc: "The territorial command receives firm authority over depots, guard formations, and corridor schedules. Defence becomes faster and leaner, while factories and municipal councils bear the strain of military priority."

independence_wave_iw005_compile_municipal_factory_ledgers: "Compile the Municipal and Factory Ledgers"
independence_wave_iw005_compile_municipal_factory_ledgers_desc: "Assign clerks, inspectors, and local officials to reconcile municipal rolls with factory employment, railway allocations, and civil-defence obligations. The ledger will show who can be mobilized, what each workshop can supply, and which authority may issue the order."
independence_wave_iw005_ledger_cost: "£command_power §Y[?constant:independence_wave_iw005_flanders_cost.ledger_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw005_flanders_cost.ledger_manpower|0]§!"
independence_wave_iw005_ledger_cost_blocked: "£command_power §R[?constant:independence_wave_iw005_flanders_cost.ledger_command_power|0]§!  £manpower_texticon §R[?constant:independence_wave_iw005_flanders_cost.ledger_manpower|0]§!"
independence_wave_iw005_ledger_cost_tooltip: "Commit the displayed command authority and personnel to the municipal and factory census."
independence_wave_iw005_ledger_effect_tt: "Gain §G+[?constant:independence_wave_iw005_flanders_value.ledger_civic_gain|0] Civic-Industrial Coordination§! and §G+[?constant:independence_wave_iw005_flanders_value.ledger_security_gain|0] Scheldt Security§!."

independence_wave_iw005_secure_scheldt_rail_depots: "Secure the Scheldt Rail Depots"
independence_wave_iw005_secure_scheldt_rail_depots_desc: "Place the Antwerp yards, Flanders junctions, and their support stores under a shared custody schedule. Trains and repair stocks will be held back from routine traffic so that the corridor can survive sabotage, panic, or a sudden military demand. Belgium must own and control both Flanders and Antwerp."
independence_wave_iw005_depot_cost: "£command_power §Y[?constant:independence_wave_iw005_flanders_cost.depot_command_power|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw005_flanders_cost.depot_trains|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw005_flanders_cost.depot_support_equipment|0]§!"
independence_wave_iw005_depot_cost_blocked: "£command_power §R[?constant:independence_wave_iw005_flanders_cost.depot_command_power|0]§!  £GFX_train_texticon §R[?constant:independence_wave_iw005_flanders_cost.depot_trains|0]§!  £support_equipment_text_icon §R[?constant:independence_wave_iw005_flanders_cost.depot_support_equipment|0]§!"
independence_wave_iw005_depot_cost_tooltip: "Commit the displayed command authority, trains, and support stores to guarded Scheldt depots."
independence_wave_iw005_depot_effect_tt: "Gain §G+[?constant:independence_wave_iw005_flanders_value.depot_civic_gain|0] Civic-Industrial Coordination§! and §G+[?constant:independence_wave_iw005_flanders_value.depot_security_gain|0] Scheldt Security§!."

independence_wave_iw005_vet_defecting_regulars: "Vet the Defecting Regulars"
independence_wave_iw005_vet_defecting_regulars_desc: "Screen officers and specialists whose loyalties shifted with the Flemish settlement. Accepted personnel will retain professional duties under written civilian warrants. The army will gain experience and cohesion, while municipal leaders will resent the regulars' growing influence."
independence_wave_iw005_officer_cost: "£manpower_texticon §Y[?constant:independence_wave_iw005_flanders_cost.officer_manpower|0]§!  £army_experience §Y[?constant:independence_wave_iw005_flanders_cost.officer_army_experience|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw005_flanders_cost.officer_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw005_flanders_cost.officer_support_equipment|0]§!"
independence_wave_iw005_officer_cost_blocked: "£manpower_texticon §R[?constant:independence_wave_iw005_flanders_cost.officer_manpower|0]§!  £army_experience §R[?constant:independence_wave_iw005_flanders_cost.officer_army_experience|0]§!  £infantry_equipment_text_icon §R[?constant:independence_wave_iw005_flanders_cost.officer_infantry_equipment|0]§!  £support_equipment_text_icon §R[?constant:independence_wave_iw005_flanders_cost.officer_support_equipment|0]§!"
independence_wave_iw005_officer_cost_tooltip: "Commit the displayed personnel, staff experience, weapons, and support stores to the officer-screening boards."
independence_wave_iw005_officer_effect_tt: "Civic-Industrial Coordination changes by §R[?constant:independence_wave_iw005_flanders_value.officer_civic_loss|0]§!. Gain §G+[?constant:independence_wave_iw005_flanders_value.officer_security_gain|0] Scheldt Security§!."

independence_wave_iw005_raise_factory_railway_guard: "Raise the Factory and Railway Guard"
independence_wave_iw005_raise_factory_railway_guard_desc: "Equip a disciplined guard from factory watchmen, railway personnel, and screened reservists. The commitment begins a [?constant:independence_wave_iw005_flanders_duration.guard_mission_timeout|0]-day objective. One Belgian division must remain in both Flanders and Antwerp while Belgium owns and controls the two states. Any break resets the continuous-duty count."
independence_wave_iw005_guard_cost: "£command_power §Y[?constant:independence_wave_iw005_flanders_cost.guard_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw005_flanders_cost.guard_manpower|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw005_flanders_cost.guard_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw005_flanders_cost.guard_support_equipment|0]§!"
independence_wave_iw005_guard_cost_blocked: "£command_power §R[?constant:independence_wave_iw005_flanders_cost.guard_command_power|0]§!  £manpower_texticon §R[?constant:independence_wave_iw005_flanders_cost.guard_manpower|0]§!  £infantry_equipment_text_icon §R[?constant:independence_wave_iw005_flanders_cost.guard_infantry_equipment|0]§!  £support_equipment_text_icon §R[?constant:independence_wave_iw005_flanders_cost.guard_support_equipment|0]§!"
independence_wave_iw005_guard_cost_tooltip: "Commit the displayed command authority, personnel, weapons, and support stores to the factory and railway guard."
independence_wave_iw005_guard_start_effect_tt: "Activate §YHold the Scheldt Guard Line§!. The guard must maintain the full corridor objective for [?constant:independence_wave_iw005_flanders_value.guard_hold_required|0] continuous days."

independence_wave_iw005_hold_scheldt_guard_line: "Hold the Scheldt Guard Line"
independence_wave_iw005_hold_scheldt_guard_line_desc: "Maintain Belgian ownership and control of Flanders and Antwerp with at least one Belgian division stationed in each state. Continuous guard duty stands at §Y[?independence_wave_iw005_guard_hold_days|0]§! of [?constant:independence_wave_iw005_flanders_value.guard_hold_required|0] required days. Losing control or removing either garrison resets the count. If the Flemish settlement is suspended, this mission and its accumulated continuous-duty count will wait for the settlement's return."
independence_wave_iw005_guard_success_effect_tt: "Gain §G+[?constant:independence_wave_iw005_flanders_value.guard_civic_gain|0] Civic-Industrial Coordination§! and §G+[?constant:independence_wave_iw005_flanders_value.guard_security_gain|0] Scheldt Security§!."
independence_wave_iw005_guard_failure_effect_tt: "National Stability changes by §R[?constant:independence_wave_iw005_flanders_outcome.guard_failure_stability|%0]§!. The guard may be equipped and committed again."

independence_wave_iw005_charter_municipal_industrial_board: "Charter the Municipal-Industrial Board"
independence_wave_iw005_charter_municipal_industrial_board_desc: "Place the durable settlement under a board of municipalities, port authorities, railway administrators, and factory delegates. Civilian warrants will govern mobilization and industrial priorities, even when the territorial command argues for speed. Requires at least [?constant:independence_wave_iw005_flanders_value.civic_institution_primary_threshold|0] Civic-Industrial Coordination and [?constant:independence_wave_iw005_flanders_value.civic_institution_secondary_threshold|0] Scheldt Security."
independence_wave_iw005_civic_institution_cost: "£command_power §Y[?constant:independence_wave_iw005_flanders_cost.civic_institution_command_power|0]§!  £manpower_texticon §Y[?constant:independence_wave_iw005_flanders_cost.civic_institution_manpower|0]§!  £GFX_train_texticon §Y[?constant:independence_wave_iw005_flanders_cost.civic_institution_trains|0]§!"
independence_wave_iw005_civic_institution_cost_blocked: "£command_power §R[?constant:independence_wave_iw005_flanders_cost.civic_institution_command_power|0]§!  £manpower_texticon §R[?constant:independence_wave_iw005_flanders_cost.civic_institution_manpower|0]§!  £GFX_train_texticon §R[?constant:independence_wave_iw005_flanders_cost.civic_institution_trains|0]§!"
independence_wave_iw005_civic_institution_cost_tooltip: "Commit the displayed command authority, personnel, and railway stock to the permanent municipal board."
independence_wave_iw005_civic_institution_effect_tt: "Choose the §YMunicipal-Industrial Board§!. Gain §G+[?constant:independence_wave_iw005_flanders_value.civic_institution_civic_gain|0] Civic-Industrial Coordination§!. Scheldt Security changes by §R[?constant:independence_wave_iw005_flanders_value.civic_institution_security_loss|0]§!."

independence_wave_iw005_entrust_scheldt_territorial_compact: "Entrust the Scheldt Territorial Compact"
independence_wave_iw005_entrust_scheldt_territorial_compact_desc: "Give the territorial command final authority over corridor security, depot releases, and factory guards while preserving municipal administration outside the defence schedule. The settlement will defend the Scheldt efficiently, but civilian institutions will yield ground whenever the command declares an emergency. Requires at least [?constant:independence_wave_iw005_flanders_value.security_institution_primary_threshold|0] Scheldt Security and [?constant:independence_wave_iw005_flanders_value.security_institution_secondary_threshold|0] Civic-Industrial Coordination."
independence_wave_iw005_security_institution_cost: "£manpower_texticon §Y[?constant:independence_wave_iw005_flanders_cost.security_institution_manpower|0]§!  £army_experience §Y[?constant:independence_wave_iw005_flanders_cost.security_institution_army_experience|0]§!  £infantry_equipment_text_icon §Y[?constant:independence_wave_iw005_flanders_cost.security_institution_infantry_equipment|0]§!  £support_equipment_text_icon §Y[?constant:independence_wave_iw005_flanders_cost.security_institution_support_equipment|0]§!"
independence_wave_iw005_security_institution_cost_blocked: "£manpower_texticon §R[?constant:independence_wave_iw005_flanders_cost.security_institution_manpower|0]§!  £army_experience §R[?constant:independence_wave_iw005_flanders_cost.security_institution_army_experience|0]§!  £infantry_equipment_text_icon §R[?constant:independence_wave_iw005_flanders_cost.security_institution_infantry_equipment|0]§!  £support_equipment_text_icon §R[?constant:independence_wave_iw005_flanders_cost.security_institution_support_equipment|0]§!"
independence_wave_iw005_security_institution_cost_tooltip: "Commit the displayed personnel, staff experience, weapons, and support stores to the permanent territorial compact."
independence_wave_iw005_security_institution_effect_tt: "Choose the §YScheldt Territorial Compact§!. Civic-Industrial Coordination changes by §R[?constant:independence_wave_iw005_flanders_value.security_institution_civic_loss|0]§!. Gain §G+[?constant:independence_wave_iw005_flanders_value.security_institution_security_gain|0] Scheldt Security§!."
