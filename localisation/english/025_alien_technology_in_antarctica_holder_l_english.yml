l_english:
# Evolution V aftermath for material holders: notices, accidents, observed behaviour, outcomes and custody transfer.
chaosx.nr25.221.d: "The alien-derived material in our custody has begun to anticipate the people who work with it. Operators follow its cues before they are asked, and our research staff report that Dependence on the system is now measurable. It can be contained, concealed, integrated, handed to another country, or destroyed."
chaosx.nr25.221.a: "Keep human judgment at the centre."
chaosx_nr25_aftermath_opened_tt: "Our country can now act on the alien-derived material through the §YEvolution§! decisions. Alien Dependence rises while we keep it."
chaosx.nr25.225.t: "An Accident in the Alien Programme"
chaosx.nr25.225.d: "A test of the recovered alien-derived system went wrong. [This.GetChaosxNr25ProgrammeCasualtyLine] The investigators report that the operators kept following the system's cues after the safety officers had ordered a stop.\n\nAlien Dependence stands at §Y[?chaosx_nr25_dependence|0]§!. The programme is waiting for a decision."
chaosx.nr25.225.a: "Halt the programme for inspection."
chaosx.nr25.225.b: "Keep the systems running."
chaosx.nr25.225.c: "Bury the investigators' report."
chaosx_nr25_accident_shutdown_tt: "Alien Dependence falls by §G[?constant:chaosx_nr25_holder.accident_shutdown_relief|0]§!, and the programme can be contained again."
chaosx_nr25_accident_running_tt: "Stability: §R[?constant:chaosx_nr25_holder_fixed.accident_running_stability|%0]§!\nThe accident stays on record and blocks a successful containment until it is dealt with."
chaosx_nr25_accident_buried_tt: "Alien Dependence rises by §R[?constant:chaosx_nr25_holder.accident_conceal_pressure|0]§!. The accident disappears from the public record, but not from the programme."
chaosx.nr25.231.t: "The Component Stays"
chaosx.nr25.231.d: "Engineers were ordered to remove an alien-derived component from a test assembly. Three teams in a row found reasons not to. Each reason was technically sound, and each was written in the same unfamiliar notation."
chaosx.nr25.231.a: "Order the component removed."
chaosx.nr25.231.b: "Leave it where it is."
chaosx.nr25.232.t: "Plans Nobody Can Explain"
chaosx.nr25.232.d: "Staff officers who studied the recovered system have begun drafting operational plans in patterns they cannot explain. The plans work in exercises. When asked how they reached them, the officers describe the result, never the reasoning."
chaosx.nr25.232.a: "Strike the patterns from the plans."
chaosx.nr25.232.b: "Let the planners keep them."
chaosx.nr25.233.t: "The Tolerances Changed Themselves"
chaosx.nr25.233.d: "Factory inspectors found production lines running to tolerances nobody had authorised. The parts are better than the specification. The machine settings were changed overnight, and no one on the night shift remembers changing them."
chaosx.nr25.233.a: "Reset every line to our standards."
chaosx.nr25.233.b: "Keep the new tolerances."
chaosx.nr25.234.t: "One Design, Every Laboratory"
chaosx.nr25.234.d: "Research teams working on unrelated problems have submitted the same design within a single week. They have never met. Each team believes the idea was its own."
chaosx.nr25.234.a: "Rotate the research teams."
chaosx.nr25.234.b: "Pursue the design."
chaosx.nr25.235.t: "The Signal Comes First"
chaosx.nr25.235.d: "Officials attached to the programme have begun scheduling their work around the recovered system's activity rather than the ministry's orders. Their reports are punctual and precise, and they arrive before the questions are asked."
chaosx.nr25.235.a: "Dismiss the officials."
chaosx.nr25.235.b: "Read their briefings."
chaosx.nr25.236.t: "The Systems Will Not Shut Down"
chaosx.nr25.236.d: "A routine shutdown of the recovered systems did not take. Power was cut, and the instruments kept recording. The engineers are asking for permission to cut the supply lines by force, knowing that people near the housings may be hurt."
chaosx.nr25.236.a: "Cut the power by force."
chaosx.nr25.236.b: "Let them run."
chaosx_nr25_incident_relief_tt: "Alien Dependence falls by §G[?constant:chaosx_nr25_holder.incident_relief|0]§!."
chaosx_nr25_incident_strong_relief_tt: "Alien Dependence falls by §G[?constant:chaosx_nr25_holder.incident_strong_relief|0]§!."
chaosx_nr25_incident_pressure_tt: "Alien Dependence rises by §R[?constant:chaosx_nr25_holder.incident_pressure|0]§!."
chaosx_nr25_incident_strong_pressure_tt: "Alien Dependence rises by §R[?constant:chaosx_nr25_holder.incident_strong_pressure|0]§!."
chaosx_nr25_incident_stability_tt: "Stability: §R[?constant:chaosx_nr25_holder_fixed.incident_stability_cost|%0]§!"
chaosx_nr25_incident_casualty_tt: "[Root.GetChaosxNr25IncidentCasualtyText]"
chaosx.nr25.240.t: "The Programme Finds Its Shape"
chaosx.nr25.240.d: "Months of decisions about the alien-derived material have settled into a lasting arrangement.\n\n[This.GetChaosxNr25OutcomeText]"
chaosx.nr25.240.a: "So be it."
chaosx_nr25_outcome_settled_tt: "The arrangement replaces Alien Dependence as a national spirit. It can still change if our policy or Dependence changes for long enough."
chaosx_nr25_outcome_text_contained: "Our scientists keep the system behind inspection protocols and isolated laboratories. It is studied, not obeyed: §YContained Exotic Technology§!."
chaosx_nr25_outcome_text_independent: "The material is gone, and our engineers have rebuilt what they learned in human terms: §YIndependent Human Adaptation§!."
chaosx_nr25_outcome_text_integrated: "The system's methods now run through our design offices, factories, and staff colleges: §YIntegrated Alien Systems§!."
chaosx_nr25_outcome_text_reliance: "Our institutions now lean on the system for decisions they can no longer check: §YAlien Systems Reliance§!."
chaosx_nr25_outcome_text_autonomous: "Our laboratories now run research programmes the system begins on its own, and our scientists follow: §YAutonomous Research Network§!."
chaosx_nr25_outcome_text_none: "The programme no longer has a settled shape."
chaosx_nr25_outcome_contained: "Contained Exotic Technology"
chaosx_nr25_outcome_contained_desc: "The recovered alien-derived system is studied behind inspection protocols and isolated laboratories."
chaosx_nr25_outcome_independent: "Independent Human Adaptation"
chaosx_nr25_outcome_independent_desc: "Our engineers have rebuilt what they learned from the alien-derived material in human terms, without the material itself."
chaosx_nr25_outcome_integrated: "Integrated Alien Systems"
chaosx_nr25_outcome_integrated_desc: "Methods taken from the alien-derived system run through our design offices, factories, and staff colleges."
chaosx_nr25_outcome_reliance: "Alien Systems Reliance"
chaosx_nr25_outcome_reliance_desc: "Our institutions lean on the alien-derived system for decisions they can no longer check."
chaosx_nr25_outcome_autonomous: "Autonomous Research Network"
chaosx_nr25_outcome_autonomous_desc: "Our laboratories pursue research programmes the alien-derived system begins on its own."
chaosx.nr25.250.t: "An Offer of Custody"
chaosx.nr25.250.d: "[From.GetNameDefCap] offers to hand over [From.GetChaosxNr25CustodyOfferContents]. Accepting brings the material, and the Alien Dependence that comes with keeping it, under our control. Their engineers keep what they have already learned."
chaosx.nr25.250.a: "Accept the material."
chaosx.nr25.250.b: "Refuse the offer."
chaosx_nr25_custody_accept_tt: "The material passes into our custody. We can act on it through the §YEvolution§! decisions, and Alien Dependence rises while we keep it.\nOther expeditions and holders will distrust us."
chaosx_nr25_custody_refuse_tt: "[From.GetNameDefCap] keeps the material."
chaosx_nr25_custody_offer_core: "the recovered alien core and every fragment it holds"
chaosx_nr25_custody_offer_fragments: "the alien wreck fragments it recovered"
chaosx.nr25.251.t: "The Material Changes Hands"
chaosx.nr25.251.d: "[From.GetNameDefCap] has accepted custody of our alien-derived material. The handover is complete. Our scientists keep everything they have already learned, but the material and its pressure on our institutions have left the country."
chaosx.nr25.251.a: "Let them carry it."
chaosx_nr25_custody_sent_tt: "Alien Dependence falls by §G[?constant:chaosx_nr25_holder.transfer_relief|0]§! and keeps falling while we hold no material."
chaosx.nr25.252.t: "The Offer Is Refused"
chaosx.nr25.252.d: "[From.GetNameDefCap] has refused to take custody of our alien-derived material. It stays with us."
chaosx.nr25.252.a: "Then we keep it."
chaosx.nr25.253.t: "The Handover Fails"
chaosx.nr25.253.d: "[From.GetNameDefCap] agreed to take the material, but the handover could not go ahead. The offer may have lapsed, the material may already have left our custody, the two countries may now be at war, or the shipping was not available. Nothing changed hands and nothing was paid."
chaosx.nr25.253.a: "Understood."
chaosx.nr25.254.t: "The Material Arrives"
chaosx.nr25.254.d: "[?ROOT.chaosx_nr25_last_custody_sender.GetNameDefCap] has delivered its alien-derived material into our custody. Our scientists have begun to study it, and the first operators already report that the system answers before they finish asking."
chaosx.nr25.254.a: "Put it under guard."
chaosx_nr25_custody_received_tt: "We now hold the material and can act on it through the §YEvolution§! decisions."
chaosx_nr25_custody_offer_requirements_tt: "We hold recovered alien material, have no offer awaiting an answer, and have not handed material over recently"
chaosx.nr25.281.t: "Alien Material Watch"
chaosx_nr25_custody_entrusted: "Entrusted with alien material"
chaosx_nr25_custody_rival_holder: "Holds alien material we wanted"
chaosx_nr25_incident_component: "The component that stayed"
chaosx_nr25_incident_planning: "Plans nobody can explain"
chaosx_nr25_incident_design: "One design, every laboratory"
chaosx_nr25_incident_running: "Systems that will not shut down"
chaosx_nr25_evolution_v_action_ready_tt: "We hold the alien-derived material, and our last action on it has had time to take effect"
