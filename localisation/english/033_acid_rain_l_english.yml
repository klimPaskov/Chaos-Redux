acid_rain.evolution.type: "The Corrosive Weather Changes"
acid_rain.evolution.stage_1.title: "Severe Storm Cells"
acid_rain.evolution.stage_1.body: "Concentrated cells form inside the moving front, giving threatened states nine days to prepare for heavier corrosion and lethal exposure."
acid_rain.evolution.stage_2.title: "Multiple Weather Fronts"
acid_rain.evolution.stage_2.body: "The atmospheric mass divides into independent fronts with separate routes, warnings, intensity, and severe cells."
acid_rain.evolution.stage_3.title: "Global Acid Rain"
acid_rain.evolution.stage_3.body: "The fronts merge into a worldwide layer that exposes every inhabited state in its path and produces regional superstorms with nine-day forecasts."
acid_rain.event_details.description: "A lethal acid-rain system moves between regions, exposing the inhabited states in its path to corrosion, poisoned runoff, infrastructure damage, and direct civilian loss. Countries can build shelters, protect water and food, expand emergency medicine, harden transport, evacuate states ahead of storm forecasts, and repair the aftermath. The rain ordinarily disperses only after it has crossed every state in its path.[This.GetAcidRainEventDetailsStatus][This.GetAcidRainEventDetailsAchievements]"
acid_rain_event_details_active: "\n\nAcid Rain formed on [?global.acid_rain_runtime_start_day.GetDateStringNoHourLong]. Phase: [This.GetAcidRainGuiPhase].\nWorld coverage: [?global.acid_rain_gui_coverage_percent|0]%, [?global.acid_rain_total_touched_states|0] of [?global.acid_rain_total_valid_states|0] states reached\nDeaths worldwide: [?global.acid_rain_total_deaths|0]\nAir Contamination added: [?global.acid_rain_gui_lifetime_air_added_percent|.2]%\nOur Preparedness: [?acid_rain_preparedness|0]%"
acid_rain_event_details_closed: "\n\nThe rain dispersed after [?global.acid_rain_report_duration_days|0] days.\nDeaths: [?global.acid_rain_total_deaths|0]\nStates reached: [?global.acid_rain_total_touched_states|0] of [?global.acid_rain_total_valid_states|0]\nAir Contamination added: [?global.acid_rain_report_air_added_percent|.2]%\nSevere storm cells: [?global.acid_rain_severe_cell_count|0], superstorms: [?global.acid_rain_superstorm_total_episodes|0]\nStates still under aftermath: [?global.acid_rain_report_unresolved_aftermath_states|0]"
acid_rain_event_details_closed_early: "\n\nThe rain ended early after [?global.acid_rain_report_duration_days|0] days, before it had run its course.\nDeaths: [?global.acid_rain_total_deaths|0]\nStates reached: [?global.acid_rain_total_touched_states|0] of [?global.acid_rain_total_valid_states|0]\nAir Contamination added: [?global.acid_rain_report_air_added_percent|.2]%\nSevere storm cells: [?global.acid_rain_severe_cell_count|0], superstorms: [?global.acid_rain_superstorm_total_episodes|0]\nStates still under aftermath: [?global.acid_rain_report_unresolved_aftermath_states|0]"
