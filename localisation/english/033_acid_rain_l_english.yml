acid_rain_urgent_action_available_tt: "A current Acid Rain response record exists, an action slot is free, and a warning, exposure, or severe forecast is active."
acid_rain_evacuation_available_tt: "The evacuation limit has not been reached: 2 for fragile or limited countries, 4 for established countries, and 8 for great powers."
acid_rain_recovery_action_available_tt: "An action slot is free and no Acid Rain warning, exposure, or severe forecast is active."
acid_rain_demobilize_available_tt: "Acid Rain is no longer active, an action slot is free, no warning, exposure, or severe forecast is active, and no project or evacuation remains open."
acid_rain_evacuation_target_tt: "Select a fully controlled, current Event 33 state under a severe-cell or superstorm forecast that is not already assigned to another action."
acid_rain_recovery_target_tt: "Select a fully controlled, current Event 33 state with unresolved aftermath that is not already assigned to another action."

acid_rain_state_ordinary: "Ordinary Acid Rain"
acid_rain_state_ordinary_desc: "Corrosive rain slows movement and organization, damages exposed production and resources, strains supply, and increases equipment attrition and repair pressure."
acid_rain_state_strong: "Strong Acid Rain"
acid_rain_state_strong_desc: "Heavy corrosive rain sharply reduces local production, resources, supply, movement, and organization while increasing attrition and repair pressure."
acid_rain_state_severe: "Severe Acid-Rain Cell"
acid_rain_state_severe_desc: "A concentrated cell causes the strongest regional disruption to movement, organization, production, supply, equipment, construction, and repairs."
acid_rain_state_global: "Global Acid Rain"
acid_rain_state_global_desc: "The global acid layer disrupts movement, organization, production, resources, supply, equipment, construction, and repairs across every exposed state."
acid_rain_state_superstorm: "Acid Superstorm"
acid_rain_state_superstorm_desc: "A global-layer superstorm inflicts extreme corrosion and supply disruption and prevents strategic redeployment through the affected state."
acid_rain_aftermath_1: "Acid Rain Aftermath I"
acid_rain_aftermath_1_desc: "Lingering corrosion and contaminated runoff continue to reduce production, resources, supply, construction, and transport repair."
acid_rain_aftermath_2: "Acid Rain Aftermath II"
acid_rain_aftermath_2_desc: "Serious corrosion and contamination obstruct production, resources, supply, construction, transport, and factory repair."
acid_rain_aftermath_3: "Acid Rain Aftermath III"
acid_rain_aftermath_3_desc: "Severe corrosion and poisoned runoff cripple production, resources, supply, construction, transport, factory repair, and air-base repair."
acid_rain_recovery_transport: "Acid Rain Transport Recovery"
acid_rain_recovery_transport_desc: "Dedicated crews improve local supply and accelerate infrastructure and railway repair."
acid_rain_recovery_decontamination: "Acid Rain Decontamination"
acid_rain_recovery_decontamination_desc: "Water and soil cleanup improves local resources and supply while easing construction pressure."
acid_rain_recovery_industry: "Acid Rain Industrial Recovery"
acid_rain_recovery_industry_desc: "Protected repair crews restore local production and accelerate civilian and military factory repairs."
acid_rain_action_commitment_one: "Acid Rain Emergency Commitment"
acid_rain_action_commitment_one_desc: "One civilian factory is committed to the current Acid Rain response operation."
