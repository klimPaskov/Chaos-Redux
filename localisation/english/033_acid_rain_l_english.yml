acid_rain.evolution.type: "The Corrosive Weather Changes"
acid_rain.evolution.stage_1.title: "Severe Storm Cells"
acid_rain.evolution.stage_1.body: "Concentrated cells form inside the moving front, giving threatened states nine days to prepare for heavier corrosion and lethal exposure."
acid_rain.evolution.stage_2.title: "Multiple Weather Fronts"
acid_rain.evolution.stage_2.body: "The atmospheric mass divides into independent fronts with separate routes, warnings, intensity, and severe cells."
acid_rain.evolution.stage_3.title: "Global Acid Rain"
acid_rain.evolution.stage_3.body: "The fronts merge into a worldwide layer that exposes every inhabited state in its path and produces regional superstorms with nine-day forecasts."
acid_rain.event_details.description: "A lethal acid-rain system moves between regions, exposing the inhabited states in its path to corrosion, poisoned runoff, infrastructure damage, and direct civilian loss. Countries can build shelters, protect water and food, expand emergency medicine, harden transport, evacuate states ahead of storm forecasts, and repair the aftermath. The rain ordinarily disperses only after it has crossed every state in its path."

chaosx_super_event.117.t: "Acid Rain"
chaosx_super_event.117.q: "“I was led to attribute this effect to the slow, but constant, action of the acid rain.” — Robert Angus Smith, Air and Rain (1872), p.444"
chaosx_super_event.117.a: "“For the rain it raineth every day.” — Shakespeare, Twelfth Night"
chaosx_super_event.117.d: "A corrosive atmospheric system has formed above the inhabited world. Its rain burns exposed skin, poisons runoff, strips paint and metal, and drives civilians toward shelters as the first weather front begins to move."
