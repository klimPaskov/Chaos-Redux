l_english:
chaosx.nr33.1.t: "Acid Rain"
chaosx.nr33.report_close: "Return to the response"
chaosx.nr33.news_close: "The rain reaches farther"

chaosx.nr33.101.t: "The Rain Reaches [acid_rain_report_state.GetName]"
chaosx.nr33.101.d: "Corrosive rain has entered [acid_rain_report_state.GetName]. Exposed water, crops, roads, and rail equipment are deteriorating, and people caught outside risk burns and respiratory injury.\n\nRain over us: [ROOT.GetAcidRainReportArrivalSource], [ROOT.GetAcidRainReportArrivalBand] intensity\nNational Preparedness: [?acid_rain_preparedness|0]%\n\n[ROOT.GetAcidRainReportUrgentMeasures]"
chaosx.nr33.102.t: "Acid Rain Approaches [ROOT.GetAcidRainReportRegion]"
chaosx.nr33.102.d: "A moving acid-rain front is expected to reach [ROOT.GetAcidRainReportRegion] in about [?acid_rain_report_arrival_days|0] days. Which of its states the rain will cover remains uncertain until it arrives.\n\nOur controlled states in [ROOT.GetAcidRainReportRegion]: [?acid_rain_report_warned_state_count|0]\nNational Preparedness: [?acid_rain_preparedness|0]%\n[ROOT.GetAcidRainReportWeakestComponent]\n\nShelter, water, medical and transport work can still be ordered through the Acid Rain Response decisions before the rain arrives."
chaosx.nr33.103.t: "A Severe Cell Forms over [?acid_rain_report_forecast_state.GetName]"
chaosx.nr33.103.d: "A concentrated storm cell is gathering inside the moving front. In about [?acid_rain_report_forecast_lead_days|0] days it will strike part of our territory with heavier corrosion and lethal exposure.\n\nOur controlled states under the forecast: [?acid_rain_report_forecast_state_count|0]\nMost populous of them: [?acid_rain_report_forecast_state.GetName]\n\nAn evacuation that finishes before the first severe pulse gives full protection, and one complete day of movement already gives partial protection. Evacuations are ordered state by state through the Acid Rain Response decisions."
chaosx.nr33.103.t_superstorm: "A Superstorm Forms over [?acid_rain_report_forecast_state.GetName]"
chaosx.nr33.103.d_superstorm: "A superstorm is gathering inside the global acid layer. In about [?acid_rain_report_forecast_lead_days|0] days it will strike part of our territory with the most corrosive rain yet recorded.\n\nOur controlled states under the forecast: [?acid_rain_report_forecast_state_count|0]\nMost populous of them: [?acid_rain_report_forecast_state.GetName]\n\nAn evacuation that finishes before the storm strikes gives full protection, and one complete day of movement already gives partial protection. Evacuations are ordered state by state through the Acid Rain Response decisions."
chaosx.nr33.104.t: "The Severe Rain Falls"
chaosx.nr33.104.d: "The storm's first deadly pulse has crossed [acid_rain_report_state.GetName]. [ROOT.GetAcidRainReportEvacuation]\n\nDeaths in our territory so far: [?acid_rain_event_deaths|0]\nDeaths prevented by our preparations, estimated: [?acid_rain_prevented_deaths|0]\nSevere weather expected to continue: about [?acid_rain_report_episode_remaining_days|0] more days\n\nShelter, evacuation and medical preparations decide how much of the remaining episode the population can endure."
chaosx.nr33.104.t_superstorm: "The Superstorm Strikes"
chaosx.nr33.105.t: "The National Toll Rises"
chaosx.nr33.105.d: "Acid Rain has killed [?acid_rain_event_deaths|0] people in our territory. [?acid_rain_active_exposed_states|0] controlled states remain exposed, and Preparedness stands at [?acid_rain_preparedness|0]%.\n\n[ROOT.GetAcidRainReportWeakestComponent][ROOT.GetAcidRainReportOccupiedExposure]\n\n[ROOT.GetAcidRainReportCasualtyAdvice]"
chaosx.nr33.106.t: "Preparation Saves Lives"
chaosx.nr33.106.d: "Shelters, protected supplies, medical teams, and evacuation work have prevented an estimated [?acid_rain_prevented_deaths|0] deaths. The estimate compares the recorded outcome with the same exposure without those protections. It does not claim certainty about any individual life.\n\n[ROOT.GetAcidRainReportStrongestComponent]"
chaosx.nr33.107.t: "The Front Leaves Our Territory"
chaosx.nr33.107.d: "No controlled state remains under acute Acid Rain.\n\nThis exposure lasted: [?acid_rain_report_exposure_days|0] days\nDeaths in our territory: [?acid_rain_event_deaths|0]\nDeaths prevented by our preparations, estimated: [?acid_rain_prevented_deaths|0]\n[ROOT.GetAcidRainReportDepartureAftermath]\n\nCorrosion and contaminated runoff remain where recovery is unfinished. Recovery decisions can restore transport, decontaminate water and soil, and repair damaged industry in states clear of warnings and forecasts."
chaosx.nr33.107.t_temporary: "A Temporary Respite"
chaosx.nr33.107.d_temporary: "The rain has left our last exposed state, but a front is already approaching another part of our territory, so this respite will not last. Urgent shelter, water, medical and transport measures remain available.\n\nThis exposure lasted: [?acid_rain_report_exposure_days|0] days\nDeaths in our territory: [?acid_rain_event_deaths|0]\nDeaths prevented by our preparations, estimated: [?acid_rain_prevented_deaths|0]\n[ROOT.GetAcidRainReportDepartureAftermath]"
chaosx.nr33.108.t: "Severe Storm Cells"
chaosx.nr33.108.d: "Concentrated cells are forming inside the broader rain front. Their nine-day forecasts mark several states for heavier corrosion, supply disruption, and lethal exposure. Shelters, medical capacity, and early evacuation can reduce the losses before a cell strikes."
chaosx.nr33.109.t: "The Acute Rain Ends"
chaosx.nr33.109.d: "The corrosive clouds have dispersed and acute Acid Rain has stopped worldwide.\n\nDuration: [?global.acid_rain_report_duration_days|0] days\nDeaths: [?global.acid_rain_total_deaths|0]\nStates reached: [?global.acid_rain_total_touched_states|0] of [?global.acid_rain_total_valid_states|0]\nAir Contamination added: [?global.acid_rain_report_air_added_percent|.2]%\nSevere storm cells: [?global.acid_rain_severe_cell_count|0]\nSuperstorms: [?global.acid_rain_superstorm_total_episodes|0]\nStates still carrying aftermath: [?global.acid_rain_report_unresolved_aftermath_states|0]\n\nDamaged railways, poisoned runoff, and stripped machinery remain. National recovery continues until every affected state is repaired or decontaminated and all temporary commitments are closed."
chaosx.nr33.110.t: "Recovery Work Completed in [acid_rain_report_state.GetName]"
chaosx.nr33.110.d: "Crews in [acid_rain_report_state.GetName] have completed the selected recovery operation. Transport repairs, decontamination, or industrial work have reduced the state's recorded aftermath without restoring more damage than the rain caused."
chaosx.nr33.111.t: "A Global Acid Layer Forms"
chaosx.nr33.111.d: "The regional fronts are merging into one atmospheric layer. In three days, corrosive rain will reach every inhabited state in its path at once. Existing preparations remain effective, and countries can still complete urgent work before later pulses."
chaosx.nr33.112.t: "Global Acid Rain"
chaosx.nr33.112.d: "Corrosive rain now covers every inhabited state in its path. Regional superstorms can form inside the global layer, each giving its threatened states nine days of warning. The layer will last at least forty-five days before it can begin to break up."
chaosx.nr33.113.t: "The Front Divides"
chaosx.nr33.113.d: "The atmospheric mass is separating into independent weather fronts. A second front will stabilize in seven days and begin its own regional passage, warnings, intensity changes, and severe-cell cycle."
chaosx.nr33.114.t: "The Rain Concentrates"
chaosx.nr33.114.d: "In three days, the strongest parts of the moving front may begin producing severe storm cells. Each cell will name its threatened states nine days before impact, leaving time for shelter work, medical preparation, and evacuation."
