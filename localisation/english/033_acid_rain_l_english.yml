acid_rain_gui_contamination_tt: "Air Contamination is shared worldwide. Acid Rain can add at most 15% over its whole course and never raises global contamination above 50%. The panel shows the current level, the amount Acid Rain has added, the amount it can still add, and the deaths it has caused worldwide."
acid_rain_gui_front_timer_tt: "The countdown estimates the next regional passage. A warning reveals its destination, while the exact state footprint remains uncertain until arrival."
acid_rain_gui_severe_cell_tt: "States assigned to a forecast or active severe cell in this front. Forecasts give nine days before impact, enough for an early evacuation to finish."
acid_rain_gui_global_card_tt: "The global layer exposes every inhabited state in the rain's path. It can begin to break up after forty-five days."
acid_rain_gui_coverage_tt: "Coverage counts the states in the rain's path that it has reached at least once. The percentage rounds down and reaches 100% only when every one of them has been reached. Preparedness protects people while the fronts continue moving."
acid_rain_gui_preparedness_tt: "Preparedness combines Shelter Network at 30 percent, Protected Water and Food at 25 percent, Medical and Protective Capacity at 25 percent, and Transport and Infrastructure Resilience at 20 percent. Each component has four tiers."
acid_rain_gui_refresh_tt: "Update the display from the latest weather, exposure, and recovery records. Response orders remain available through decisions."
