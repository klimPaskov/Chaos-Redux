l_english:
chaosx.nr33.1.t: "Acid Rain"
chaosx.nr33.report_close: "Return to the response"
chaosx.nr33.news_close: "The rain reaches farther"

chaosx.nr33.101.t: "The Rain Reaches [acid_rain_report_state.GetName]"
chaosx.nr33.101.d: "Corrosive rain has entered [acid_rain_report_state.GetName]. Exposed water, crops, roads, and rail equipment are deteriorating, and people caught outside risk burns and respiratory injury. National Preparedness stands at [?acid_rain_preparedness|1]. Emergency measures are available for the states under the cloud."
chaosx.nr33.102.t: "Acid Rain Approaches"
chaosx.nr33.102.d: "The moving front is expected to reach our controlled territory after its current regional passage. The exact footprint remains uncertain. Civil-defense offices have opened shelters, reservoir crews are covering intakes, and transport authorities are moving exposed equipment while there is still time."
chaosx.nr33.103.t: "A Severe Cell Forms over [acid_rain_report_state.GetName]"
chaosx.nr33.103.d: "A concentrated cell will strike [acid_rain_report_state.GetName] in nine days. An evacuation that finishes before the first severe pulse gives full protection, and one complete day of movement already gives partial protection."
chaosx.nr33.104.t: "The Severe Rain Falls"
chaosx.nr33.104.d: "The first severe pulse has crossed [acid_rain_report_state.GetName]. So far [?acid_rain_event_deaths|0] people have died in our territory, and our preparations have prevented an estimated [?acid_rain_prevented_deaths|0] deaths. Shelter, evacuation, and medical preparations determine how much of the remaining episode the population can endure."
chaosx.nr33.105.t: "The National Toll Rises"
chaosx.nr33.105.d: "Acid Rain has killed [?acid_rain_event_deaths|0] people in our territory. [?acid_rain_active_exposed_states|0] controlled states remain exposed, and Preparedness stands at [?acid_rain_preparedness|1]. Shelter, water, medical, and transport weaknesses will shape each later pulse."
chaosx.nr33.106.t: "Preparation Saves Lives"
chaosx.nr33.106.d: "Shelters, protected supplies, medical teams, and evacuation work have prevented an estimated [?acid_rain_prevented_deaths|0] deaths. The estimate compares the recorded outcome with the same exposure without those protections. It does not claim certainty about any individual life."
chaosx.nr33.107.t: "The Front Leaves Our Territory"
chaosx.nr33.107.d: "No controlled state remains under acute Acid Rain. It killed [?acid_rain_event_deaths|0] people in our territory, and our preparations prevented an estimated [?acid_rain_prevented_deaths|0] deaths. Corrosion and contaminated runoff remain in states that have not completed recovery."
chaosx.nr33.108.t: "Severe Storm Cells"
chaosx.nr33.108.d: "Concentrated cells are forming inside the broader rain front. Their nine-day forecasts mark several states for heavier corrosion, supply disruption, and lethal exposure. Shelters, medical capacity, and early evacuation can reduce the losses before a cell strikes."
chaosx.nr33.109.t: "The Acute Rain Ends"
chaosx.nr33.109.d: "The corrosive clouds have dispersed, but damaged railways, poisoned runoff, and stripped machinery remain. National recovery will continue until every affected state is repaired or decontaminated and all temporary commitments are closed."
chaosx.nr33.110.t: "Recovery Work Completed in [acid_rain_report_state.GetName]"
chaosx.nr33.110.d: "Crews in [acid_rain_report_state.GetName] have completed the selected recovery operation. Transport repairs, decontamination, or industrial work have reduced the state's recorded aftermath without restoring more damage than the rain caused."
chaosx.nr33.111.t: "A Global Acid Layer Forms"
chaosx.nr33.111.d: "The regional fronts are merging into one atmospheric layer. In three days, corrosive rain will reach every inhabited state in its path at once. Existing preparations remain effective, and countries can still complete urgent work before later pulses."
chaosx.nr33.112.t: "Global Acid Rain"
chaosx.nr33.112.d: "Corrosive rain now covers every inhabited state in its path. Regional superstorms can form inside the global layer, each giving its threatened states nine days of warning. The layer will last at least forty-five days before it can begin to break up."
chaosx.nr33.113.t: "The Front Divides"
chaosx.nr33.113.d: "The atmospheric mass is separating into independent weather fronts. A second front will stabilize in seven days and begin its own regional passage, warnings, intensity changes, and severe-cell cycle."
chaosx.nr33.114.t: "The Rain Concentrates"
chaosx.nr33.114.d: "In three days, the strongest parts of the moving front may begin producing severe storm cells. Each cell will name its threatened states nine days before impact, leaving time for shelter work, medical preparation, and evacuation."
chaosx.nr33.201.t: "Acid Rain Forms"
chaosx.nr33.201.d: "A lethal corrosive rain system has formed and begun moving between regions. Water supplies, crops, roads, railways, and exposed machinery lie in its path. Governments are opening civil-defense stores and preparing for a cloud whose origin remains unknown."
chaosx.nr33.202.t: "A Second Acid-Rain Front"
chaosx.nr33.202.d: "The corrosive weather has divided into two stable fronts. Each mass now moves independently, carrying its own warnings and severe cells into regions that may have believed the danger had passed."
chaosx.nr33.203.t: "A Third Front Stabilizes"
chaosx.nr33.203.d: "A third acid-rain front has stabilized. Separate cloud systems now cross the world on their own schedules, widening the territory exposed to poisoned runoff, corrosion, and respiratory injury."
chaosx.nr33.204.t: "Acid Rain Covers the World"
chaosx.nr33.204.d: "The fronts have merged into a global atmospheric layer. Corrosive rain is falling across every inhabited state in its path, and concentrated superstorms are forming inside the wider cloud."
chaosx.nr33.205.t: "The Corrosive Clouds Disperse"
chaosx.nr33.205.d: "The last acute Acid Rain has stopped. Corroded infrastructure and contaminated water remain across the states it touched, and national recovery work will continue after the clouds disperse."

chaosx_acid_rain_decision_category: "Acid Rain Response"
chaosx_acid_rain_decision_category_desc: "Moving fronts expose states to lethal rain, corrosion, supply disruption, and contaminated runoff. Permanent projects raise national Preparedness. Urgent actions protect people during warnings and exposure, while recovery actions repair the aftermath. Equipment and fuel are consumed. Reserved manpower and committed civilian factories return when the work completes or is called off."
chaosx_acid_rain_project_shelter: "Expand the Shelter Network"
chaosx_acid_rain_project_shelter_desc: "Raise the Shelter Network by one tier, up to tier 4. Each completed tier adds §G7.5 Preparedness§! and improves protection from opening shocks and severe cells. Support equipment is consumed. Manpower is reserved and civilian factories remain committed until the work completes or is cancelled."
chaosx_acid_rain_project_water: "Protect Water and Food"
chaosx_acid_rain_project_water_desc: "Raise Protected Water and Food by one tier, up to tier 4. Each completed tier adds §G6.25 Preparedness§!, reduces sustained losses, and limits contaminated runoff and aftermath. The work uses trains for land supply or convoys for island and overseas supply, never both."
chaosx_acid_rain_project_medical: "Expand Medical and Protective Capacity"
chaosx_acid_rain_project_medical_desc: "Raise Medical and Protective Capacity by one tier, up to tier 4. Each completed tier adds §G6.25 Preparedness§!, reduces sustained and severe-cell losses, and improves recovery. Support equipment and fuel are consumed. Manpower is reserved until the work closes."
chaosx_acid_rain_project_transport: "Harden Transport and Infrastructure"
chaosx_acid_rain_project_transport_desc: "Raise Transport and Infrastructure Resilience by one tier, up to tier 4. Each completed tier adds §G5 Preparedness§!, reduces building-damage pressure, strengthens evacuation, and limits acute supply and movement disruption. Trains, trucks, and fuel are consumed."

chaosx_acid_rain_urgent_shelter: "Activate Shelter Protocols"
chaosx_acid_rain_urgent_shelter_desc: "A fourteen-day national action that reduces opening and sustained losses for twenty-one days or until exposure ends. Shelter tiers strengthen the result. Political power and support equipment are spent, while manpower is reserved until the commitment closes."
chaosx_acid_rain_urgent_water: "Secure Emergency Water and Food"
chaosx_acid_rain_urgent_water_desc: "A twenty-one-day national action that reduces sustained losses and aftermath growth for thirty days. The land route consumes trains, while the island and overseas route consumes convoys. Both routes consume support equipment and reserve manpower."
chaosx_acid_rain_urgent_medical: "Open an Emergency Medical Surge"
chaosx_acid_rain_urgent_medical_desc: "A fourteen-day national action that reduces sustained losses and severe-cell casualty pressure for twenty-one days. Support equipment and fuel are consumed, manpower is reserved, and medical fatigue follows the operation."
chaosx_acid_rain_urgent_transport: "Reroute Transport and Repair Crews"
chaosx_acid_rain_urgent_transport_desc: "A fourteen-day national action that limits acute supply disruption and building-damage pressure for twenty-one days. It consumes trains, trucks, and fuel and needs a transport stockpile."
chaosx_acid_rain_urgent_evacuate: "Evacuate [FROM.GetName]"
chaosx_acid_rain_urgent_evacuate_desc: "Move civilians out of [FROM.GetName] under a severe-cell or superstorm forecast. The evacuation takes seven days. After one complete day it gives partial protection against severe pulses, and finishing before the first severe pulse gives full protection. Production, construction, and supply efficiency fall in [FROM.GetName] until the severe weather has passed."
chaosx_acid_rain_recovery_transport: "Restore Transport in [FROM.GetName]"
chaosx_acid_rain_recovery_transport_desc: "Commit crews for twenty-eight days to repair railways and infrastructure in [FROM.GetName]. The work consumes trains, trucks, and fuel, commits one civilian factory, reduces transport aftermath, and repairs only damage recorded from the rain."
chaosx_acid_rain_recovery_decontaminate: "Decontaminate [FROM.GetName]"
chaosx_acid_rain_recovery_decontaminate_desc: "Commit crews for thirty-five days to clean water and soil in [FROM.GetName]. The work consumes support equipment and either trains or convoys, reserves manpower, commits one civilian factory, and lowers environmental aftermath and contaminated-water pressure."
chaosx_acid_rain_recovery_industry: "Repair Industry in [FROM.GetName]"
chaosx_acid_rain_recovery_industry_desc: "Commit crews for thirty-five days to repair exposed industry in [FROM.GetName]. The work consumes support equipment, reserves manpower, commits one civilian factory, and cannot restore more factory levels than the rain damaged."
chaosx_acid_rain_recovery_demobilize: "Demobilize the Emergency Apparatus"
chaosx_acid_rain_recovery_demobilize_desc: "Spend seven days closing the emergency organization once no acid rain warning, exposure or forecast covers our territory. Unfinished projects are cancelled, reserved manpower returns, committed civilian factories are released, and medical fatigue is cleared. The released crews speed up repairs and construction for sixty days. Consumed equipment, fuel, trains, convoys, trucks, and political power are not refunded."

