acid_rain_gui_front_timer_tt: "The timer counts down to the front's next move. Its destination region is known, but the exact state footprint remains uncertain until arrival."
acid_rain_gui_severe_cell_tt: "Counts states under a severe-cell or superstorm forecast for this front. Forecasts provide three days of warning."
acid_rain_gui_global_card_tt: "The global layer exposes every valid inhabited state. Its first dissipation check can occur after forty-five days."
acid_rain_gui_coverage_tt: "World Coverage is the share of frozen eligible states touched by Acid Rain. Ordinary dissipation requires complete coverage."
acid_rain_gui_preparedness_tt: "Preparedness combines Shelter Network at 30 percent, Protected Water and Food at 25 percent, Medical and Protective Capacity at 25 percent, and Transport and Infrastructure Resilience at 20 percent. Each component has four tiers."
acid_rain_gui_refresh_tt: "Update the display from the latest weather, exposure, and recovery records. Response orders remain available through decisions."
