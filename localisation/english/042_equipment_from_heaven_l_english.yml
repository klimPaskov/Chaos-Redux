l_english:
chaosx.nr42.1.t: "Equipment from heavens"

chaosx.nr42.2.t: "Equipment from heavens!"
chaosx.nr42.2.d: "Crates of unfamiliar military equipment have fallen from the sky into our depots. Engineers are studying the devices and preparing them for use in our formations."
chaosx.nr42.2.a: "Study the equipment."

chaosx.news.47.t: "Equipment from heavens"
chaosx.news.47.d: "Military equipment has appeared in the depots of [From.GetName] without a known source. Engineers cannot explain how the crates arrived or who sent them."
chaosx.news.47.a: "The source is unknown."
