l_english:
  chaosx.fallout.380.t: "The Market Under the Viaduct"
  chaosx.fallout.380.d: "An ash-darkened viaduct still carries a rail spur into [ROOT.GetName]. Under its arches, ration stalls trade tins, clean water, salvaged wire, and news from the next settlement. The market can be licensed as a public exchange, taxed for stores, policed for hoarding, or left to barter while the country watches its prices and food lines."
  chaosx.fallout.380.a: "License the market"
  chaosx.fallout.380.a.tt: "Spend Food, Scrap, Medicine, and Recognition to issue stall licenses and a common price board. Food, supplies, ration trust, and civic cohesion improve if the route holds."
  chaosx.fallout.380.b: "Tax the stalls for public stores"
  chaosx.fallout.380.b.tt: "Spend Food, Scrap, and Cohesion to collect a measured levy for depots. The rail market feeds the state store, but traders may hide stock when the levy feels like seizure."
  chaosx.fallout.380.c: "Police the exchange"
  chaosx.fallout.380.c.tt: "Spend Scrap, Medicine, and Recognition to put wardens at the scales and ration gate. Hoarding falls when the watch is trusted, though every checkpoint risks driving merchants away."
  chaosx.fallout.380.d: "Tolerate barter"
  chaosx.fallout.380.d.tt: "Spend a small Scrap, Food, and Recognition reserve to leave the arches open. Bargain networks grow quickly, but the country keeps less control over prices and ration queues."

  chaosx.fallout.382.t: "The viaduct writes its first price board"
  chaosx.fallout.382.license_market.success.d: "Licensed stalls agreed on a price board and a ration mark that every depot could read. Merchant caravans brought food through the rail cut, the clinic received its medicine share, and the viaduct became a civic exchange rather than a private tollgate."
  chaosx.fallout.382.license_market.partial.d: "Most stalls accepted licenses, but two night crews kept their own scales. The public board made food lines legible and brought some scrap to the depots, while the market still carried a quiet second price."
  chaosx.fallout.382.license_market.failure.d: "The license clerks arrived with forms but no guards for the queue. Traders packed their wire and tins before the board was finished, leaving the rail hub short of food and the viaduct full of whispered prices."
  chaosx.fallout.382.tax_market.success.d: "The levy crews measured each stall against the depot ledger and returned receipts before dusk. Public stores gained food and rail scrap, and traders kept their routes because the tax was predictable."
  chaosx.fallout.382.tax_market.partial.d: "The levy filled one storehouse and emptied another. The market paid enough to keep the ration bell running, but caravans began declaring only half their loads at the viaduct gate."
  chaosx.fallout.382.tax_market.failure.d: "The tax boxes were opened before the scales were trusted. A fight cut the queue, a medicine cart turned back, and the rail hub lost the stock that the levy was meant to secure."
  chaosx.fallout.382.police_market.success.d: "Wardens posted the ration rule beside the scales and let merchants appeal a seizure to the clinic steward. Hoarding fell, medicine reached the sick rooms, and the market kept moving under a watch that people could name."
  chaosx.fallout.382.police_market.partial.d: "The wardens stopped the largest hoard but closed three small stalls while they searched for false weights. The exchange survived, though every caravan now counts the cost of another inspection."
  chaosx.fallout.382.police_market.failure.d: "The watch treated every trader as a thief. Medicine disappeared into evidence crates, the night caravans chose another crossing, and the ration gate stood clean while the depots went empty."
  chaosx.fallout.382.tolerate_barter.success.d: "The arches stayed open and the traders built their own marks for clean water, food, and wire. Bargain routes multiplied through the rail cut, and the country gained supplies without pretending that one office could price every tin."
  chaosx.fallout.382.tolerate_barter.partial.d: "Barter kept the stalls alive, but each settlement used a different ration mark. Food and scrap reached the depots in small lots, while the country lost a clear measure of what the viaduct could provide."
  chaosx.fallout.382.tolerate_barter.failure.d: "The open arches became a cover for three hoards. Prices rose after the last clean water cart was hidden, the rail spur lost its schedule, and the market's freedom became another name for hunger."
  chaosx.fallout.382.a: "Post the review date"
  chaosx.fallout.382.a.tt: "Resolve the market decision and schedule a civic review after 270 days."

  chaosx.fallout.384.t: "The viaduct review"
  chaosx.fallout.384.success.d: "The civic review found a working route, a readable ration mark, and merchants who still answered the depot bell. The market's memory now includes the policy that kept it open and the state that made room for it."
  chaosx.fallout.384.partial.d: "The review found trade under the arches, but the price board and ration ledger no longer agreed. The route can continue with a second measure at every depot and less faith in a single market voice."
  chaosx.fallout.384.failure.d: "The review found broken scales, a damaged supply node, and no merchant willing to sign the old ledger. The viaduct remains a road, but its market memory closes with the last ration mark."
  chaosx.fallout.384.a: "Close the market ledger"
  chaosx.fallout.384.a.tt: "Record the civic review, release delayed cleanup, and close the viaduct market memory."

  fallout.event_log.market_under_viaduct.name: "The Market Under the Viaduct"
  fallout.event_log.market_under_viaduct.detail: "[This.GetName] chose how an ash-covered rail market would price food, ration stock, and salvage. The decision changed the viaduct's supply route, merchant trust, and place in the country's recovery."
  fallout.event_log.market_under_viaduct.license_market_success: "Licensed a working public exchange"
  fallout.event_log.market_under_viaduct.license_market_partial: "Licensed a market that kept a second price"
  fallout.event_log.market_under_viaduct.license_market_failure: "Lost the market to a failed licensing queue"
  fallout.event_log.market_under_viaduct.tax_market_success: "Collected a predictable levy for public stores"
  fallout.event_log.market_under_viaduct.tax_market_partial: "Filled one store while traders hid their loads"
  fallout.event_log.market_under_viaduct.tax_market_failure: "Lost depot stock during a broken levy"
  fallout.event_log.market_under_viaduct.police_market_success: "Protected the exchange with a trusted watch"
  fallout.event_log.market_under_viaduct.police_market_partial: "Kept trade open after a harsh inspection"
  fallout.event_log.market_under_viaduct.police_market_failure: "Drove merchants away with the market watch"
  fallout.event_log.market_under_viaduct.tolerate_barter_success: "Kept barter open through the rail cut"
  fallout.event_log.market_under_viaduct.tolerate_barter_partial: "Kept barter alive without one ration mark"
  fallout.event_log.market_under_viaduct.tolerate_barter_failure: "Let open barter hide the last food hoards"
  fallout.event_log.market_under_viaduct.callback_success: "Received a complete viaduct market review"
  fallout.event_log.market_under_viaduct.callback_partial: "Received a divided market review"
  fallout.event_log.market_under_viaduct.callback_failure: "Closed the viaduct market after a failed review"
