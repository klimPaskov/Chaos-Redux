l_english:
chaosx.fallout.282.t: "The First Safe Birth"
chaosx.fallout.282.d: "The shelter clinic has recorded a birth with a living mother, a trained attendant, and enough heat to keep the child breathing. [ROOT.GetAirWinterGovernmentAuthority] must decide what this child will mean for the households that have survived the first winter. The choice spends a small reserve and leaves a memory for the next generation."
chaosx.fallout.282.a: "Celebrate it in the public hall"
chaosx.fallout.282.b: "Protect the family behind the inner door"
chaosx.fallout.282.c: "Make the birth a civic campaign"
chaosx.fallout.282.d_option: "Let the elders name the rite"
chaosx.fallout.282.a.tt: "Spend [?constant:fallout_event_282_cost.public_food|0] Food, [?constant:fallout_event_282_cost.public_medicine|0] Medicine, and [?constant:fallout_event_282_cost.public_recognition|0] Recognition. The delayed result measures Cohesion, Medicine, Shelter, and the Deaths ledger after [?constant:fallout_event_282_timing.result_delay_days|0] days."
chaosx.fallout.282.b.tt: "Spend [?constant:fallout_event_282_cost.private_medicine|0] Medicine, [?constant:fallout_event_282_cost.private_shelter|0] Shelter, and [?constant:fallout_event_282_cost.private_scrap|0] Scrap. A private protection memory will be checked after [?constant:fallout_event_282_timing.result_delay_days|0] days."
chaosx.fallout.282.c.tt: "Spend [?constant:fallout_event_282_cost.campaign_food|0] Food, [?constant:fallout_event_282_cost.campaign_power|0] Power, and [?constant:fallout_event_282_cost.campaign_recognition|0] Recognition. The civic campaign can raise manpower while exposing the shelter to a public test."
chaosx.fallout.282.d_option.tt: "Spend [?constant:fallout_event_282_cost.elders_food|0] Food, [?constant:fallout_event_282_cost.elders_medicine|0] Medicine, and [?constant:fallout_event_282_cost.elders_recognition|0] Recognition. The elders preserve a naming rite whose result will return after [?constant:fallout_event_282_timing.result_delay_days|0] days."

chaosx.fallout.284.t: "A Child for the Next Winter"
chaosx.fallout.284.public.success.d: "The public hall kept its lamps burning while [ROOT.GetAirWinterGovernmentOfficial] read the clinic record. Families brought food tickets and names for the newborn register, and the Deaths ledger gained a living countermark."
chaosx.fallout.284.public.partial.d: "The public hall opened before every ration card was checked. The birth is known across the capital, yet the outer shelters argue over who must provide the next blanket and medicine dose."
chaosx.fallout.284.public.failure.d: "The public hall lost heat during the reading. The clinic record survived, but the queue broke apart, the medicine shelf emptied, and the Deaths ledger records another night of preventable loss."
chaosx.fallout.284.private.success.d: "The inner door held. A medic, two relatives, and one lamp kept the newborn away from the draft while the shelter board marked a protected household for the next supply issue."
chaosx.fallout.284.private.partial.d: "The family reached the inner door, but the medicine reserve could not follow them. The newborn is alive, while the clinic must ration follow-up care between two crowded rooms."
chaosx.fallout.284.private.failure.d: "The inner door became a dispute over access. The family received no stable care plan, the shelter lost medicine to a hurried transfer, and the clinic recorded a dangerous delay."
chaosx.fallout.284.campaign.success.d: "The civic campaign turned one clinic record into a promise that the country can staff. Food stewards, power crews, and new volunteers joined the ledger, giving the next generation a visible place in the work."
chaosx.fallout.284.campaign.partial.d: "The civic campaign reached the capital and a few rail shelters. The birth is a public promise, yet the crews outside the lit corridor still lack food, power, and a safe register."
chaosx.fallout.284.campaign.failure.d: "The campaign consumed the last reliable lamp before the district reports arrived. The newborn record became a political accusation, while the shelter lost food, power, and confidence in its public count."
chaosx.fallout.284.elders.success.d: "The elders named the child beside the old water ledger. Their rite gave the shelter a patient calendar, a shared witness list, and a reason to carry the next winter's work beyond a single household."
chaosx.fallout.284.elders.partial.d: "The elders completed the naming rite, but the medicine table could not serve every witness. The child has a name and a place in memory, while the clinic keeps a shorter list of who can be treated."
chaosx.fallout.284.elders.failure.d: "The naming rite outlasted the lamp and the medicine tray. The elders preserved the words, yet the shelter lost its common schedule and the Deaths ledger records the cost of an unheated night."
chaosx.fallout.284.a: "Record the birth and wait for the follow-up"
chaosx.fallout.284.a.tt: "Apply the selected generation-change result, write one Event Log memory, and schedule a callback after [?constant:fallout_event_282_timing.callback_delay_days|0] days. Failure uses the Deaths contract."

chaosx.fallout.286.t: "The Child Returns to the Ledger"
chaosx.fallout.286.success.d: "The follow-up found a country that can carry one living child into its next generation. The clinic has a supply route, the household has a witness, and [ROOT.GetAirWinterGovernmentOfficial] can answer the next family without reopening the entire register."
chaosx.fallout.286.partial.d: "The follow-up found a working clinic in the capital and an uncertain route beyond it. The child's name remains in the ledger, while medicine and shelter still decide which families can receive the same promise."
chaosx.fallout.286.failure.d: "The follow-up found the clinic without a stable supply route. The name remains on paper, but medicine failed, the shelter lost confidence in its count, and the Deaths ledger has opened again."
chaosx.fallout.286.a: "Close the generation-change record"
chaosx.fallout.286.a.tt: "Apply the callback result, record the durable memory, and release both delayed Fallout receipts. Failure uses the callback Deaths contract."

fallout.event_log.first_safe_birth.name: "The First Safe Birth"
fallout.event_log.first_safe_birth.detail: "[GetFalloutEvent282EventLogDetail]"
fallout.event_log.first_safe_birth.detail.public_success: "The public hall kept the clinic record visible and linked a living child to the Deaths ledger."
fallout.event_log.first_safe_birth.detail.public_partial: "The public hall recorded the birth while outer shelters disputed the next medicine and blanket issue."
fallout.event_log.first_safe_birth.detail.public_failure: "The public reading lost heat and medicine, leaving the clinic record exposed to another night of loss."
fallout.event_log.first_safe_birth.detail.private_success: "The inner door protected the household and gave the clinic a stable supply route."
fallout.event_log.first_safe_birth.detail.private_partial: "The household reached the inner room, but the medicine reserve could not cover follow-up care."
fallout.event_log.first_safe_birth.detail.private_failure: "The private protection plan became an access dispute and left the clinic without a stable care schedule."
fallout.event_log.first_safe_birth.detail.campaign_success: "The civic campaign turned the birth record into staffed work for food, power, and the next generation."
fallout.event_log.first_safe_birth.detail.campaign_partial: "The campaign reached the capital and a few rail shelters while the outer route remained uncertain."
fallout.event_log.first_safe_birth.detail.campaign_failure: "The campaign consumed the district lamp and left the public count without food, power, or confidence."
fallout.event_log.first_safe_birth.detail.elders_success: "The elders' rite gave the shelter a shared calendar and a witness list for the next generation."
fallout.event_log.first_safe_birth.detail.elders_partial: "The rite preserved the child's name while medicine limited the witnesses who could be treated."
fallout.event_log.first_safe_birth.detail.elders_failure: "The rite preserved its words, but the shelter lost its common schedule during an unheated night."
fallout.event_log.first_safe_birth.detail.callback_success: "The follow-up left a supply route and a durable witness for the child's place in the next generation."
fallout.event_log.first_safe_birth.detail.callback_partial: "The follow-up kept the child's name in the capital ledger while medicine and shelter remained uneven."
fallout.event_log.first_safe_birth.detail.callback_failure: "The follow-up reopened the Deaths ledger after the clinic lost its stable supply route."

fallout_first_safe_birth_public: "Public Birth Register"
fallout_first_safe_birth_public_desc: "A public birth register links a living child to food tickets, clinic witnesses, and the country's Deaths ledger."
fallout_first_safe_birth_private: "Protected First Household"
fallout_first_safe_birth_private_desc: "An inner shelter door protects the first household while medicine and shelter staff build a repeatable care route."
fallout_first_safe_birth_campaign: "Generation Campaign"
fallout_first_safe_birth_campaign_desc: "A public generation campaign turns one clinic record into staffed work for food, power, and the next cohort."
fallout_first_safe_birth_elders: "Elders' Naming Rite"
fallout_first_safe_birth_elders_desc: "An elders' naming rite keeps a witness list and a shared calendar beside the winter water ledger."
fallout_first_safe_birth_maintained: "Maintained Birth Ledger"
fallout_first_safe_birth_maintained_desc: "A maintained birth ledger keeps clinic supplies, witnesses, and the next generation's first household aligned."
fallout_first_safe_birth_failed: "Birth Ledger Strain"
fallout_first_safe_birth_failed_desc: "A strained birth ledger leaves medicine, shelter access, and the Deaths record exposed to the next shortage."
