bio_antibiotic_research_slowdown_anthrax: "[GetBioValueAnthraxResearchSlowdown]"
bio_antibiotic_research_slowdown_tularemia: "[GetBioValueTularemiaResearchSlowdown]"
bio_antibiotic_consumer_goods_plague: "[GetBioValuePlagueConsumerGoods]"
bio_antibiotic_consumer_goods_anthrax: "[GetBioValueAnthraxConsumerGoods]"
bio_antibiotic_consumer_goods_tularemia: "[GetBioValueTularemiaConsumerGoods]"
bio_value_antibiotic_development_days: "[?bio_loc_antibiotic_development_days|0]"
bio_value_antibiotic_production_days: "[?bio_loc_antibiotic_production_days|0]"
bio_distribute_antibiotics_cost: "£pol_power §Y[GetBioValueAntibioticDistributionPp]§!  £support_equipment_text_icon §Y[GetBioValueAntibioticDistributionSupport]§!  £GFX_motorized_equipment_text_icon §Y[GetBioValueAntibioticDistributionTrucks]§!"
bio_distribute_antibiotics_cost_blocked: "£pol_power §R[GetBioValueAntibioticDistributionPp]§!  £support_equipment_text_icon §R[GetBioValueAntibioticDistributionSupport]§!  £GFX_motorized_equipment_text_icon §R[GetBioValueAntibioticDistributionTrucks]§!"
smallpox_vaccination_mass_program: "Smallpox Vaccination"
smallpox_vaccination_mass_program_desc: "Undertake broad vaccination against Smallpox, the most severe ordinary biological weapon. The long program consumes equipment, commits national Medical Capacity, and imposes a major continuing civilian burden."
smallpox_vaccination_mass_program_cost: "£pol_power §Y[GetBioValueVaccinationPp]§!  £cbrn_instruments_texticon §Y[GetBioValueVaccinationInstruments]§!  £support_equipment_text_icon §Y[GetBioValueVaccinationSupport]§!"
smallpox_vaccination_mass_program_cost_blocked: "£pol_power §R[GetBioValueVaccinationPp]§!  £cbrn_instruments_texticon §R[GetBioValueVaccinationInstruments]§!  £support_equipment_text_icon §R[GetBioValueVaccinationSupport]§!"
smallpox_vaccination_mass_program_available_tt: "Requires Integrated Epidemic Control, a Smallpox threat, an inactive national program, and £GFX_motorized_equipment_text_icon §Y[GetBioValueVaccinationTrucks]§! trucks on hand. The trucks remain in the stockpile."
smallpox_vaccination_mass_program_effect_tt: "After §Y[GetBioValueVaccinationDays] days§!, national vaccination sharply reduces Smallpox growth, spread, and deaths. The continuing program adds §R[GetBioValueVaccinationConsumerGoods] Consumer Goods§! and applies §R[GetBioValueVaccinationPoliticalPower] Political Power Gain§!."
revoke_smallpox_vaccination_mass_program: "End Smallpox Vaccination"
revoke_smallpox_vaccination_mass_program_desc: "End the continuing vaccination program and return its medical teams to the national reserve. The population will lose its strongest protection against Smallpox."
revoke_smallpox_vaccination_mass_program_available_tt: "Requires an active National Smallpox Vaccination Program."
revoke_smallpox_vaccination_mass_program_effect_tt: "After §Y[GetBioValueVaccinationShutdownDays] days§!, remove national Smallpox vaccination and restore its committed §G[GetBioValueVaccinationCapacity] Medical Capacity§!."
bio_request_international_medical_mission: "Medical Mission: [FROM.GetName]"
bio_request_international_medical_mission_desc: "Invite foreign medical observers and relief teams into §Y[FROM.GetName]§!. A mission improves surveillance, containment, and treatment while creating a transparent evidence record. A government hiding biological stockpiles risks exposing its own program."
bio_request_international_medical_mission_cost: "£pol_power §Y[GetBioValueInternationalMissionPp]§!  £support_equipment_text_icon §Y[GetBioValueInternationalMissionSupport]§!  £GFX_motorized_equipment_text_icon §Y[GetBioValueInternationalMissionTrucks]§!"
bio_request_international_medical_mission_cost_blocked: "£pol_power §R[GetBioValueInternationalMissionPp]§!  £support_equipment_text_icon §R[GetBioValueInternationalMissionSupport]§!  £GFX_motorized_equipment_text_icon §R[GetBioValueInternationalMissionTrucks]§!"
bio_request_international_medical_mission_available_tt: "Requires a controlled state with a detected outbreak, a cooperative Condemnation route and qualifying international access, no mission underway, and £cbrn_instruments_texticon §Y[GetBioValueInternationalMissionInstruments]§! instruments on hand. The instruments are not consumed."
bio_request_international_medical_mission_effect_tt: "After §Y[GetBioValueInternationalMissionDays] days§!, a successful mission adds §G[GetBioValueInternationalMissionSurveillance] Surveillance§!, §G[GetBioValueInternationalMissionContainment] Containment§!, and §G[GetBioValueInternationalMissionMedical] Medical Response§! in §Y[FROM.GetName]§!. It strengthens outbreak evidence, weakens concealment, improves Condemnation cooperation, and may expose a hidden biological stockpile. Medical teams return if the deployment cannot proceed."
bio_sustain_containment: "Sustain Containment in [FROM.GetName]"
bio_sustain_containment_desc: "Maintain the quarantine, medical deployment, national Medical Capacity, and supply flow around §Y[FROM.GetName]§!. Full success requires the outbreak's maximum intensity to fall without any new outbound spread while quarantine and a field hospital or international mission remain active. A weaker cordon can produce partial success if spread is stopped and intensity does not rise. Loss of control, exhausted reserves, new spread, or higher intensity produces failure and worsens the local outbreak."
bio_sustain_containment_isolated: "$bio_sustain_containment$"
bio_sustain_containment_isolated_desc: "$bio_sustain_containment_desc$"
bio_sustain_containment_local: "$bio_sustain_containment$"
bio_sustain_containment_local_desc: "$bio_sustain_containment_desc$"
bio_sustain_containment_regional: "$bio_sustain_containment$"
bio_sustain_containment_regional_desc: "$bio_sustain_containment_desc$"
bio_sustain_containment_severe: "$bio_sustain_containment$"
bio_sustain_containment_severe_desc: "$bio_sustain_containment_desc$"
bio_sustain_containment_cost: "£pol_power §Y[GetBioValueContainmentPp]§!  £command_power §Y[GetBioValueContainmentCommandPower]§!  £support_equipment_text_icon §Y[GetBioValueContainmentSupport]§!"
bio_sustain_containment_cost_blocked: "£pol_power §R[GetBioValueContainmentPp]§!  £command_power §R[GetBioValueContainmentCommandPower]§!  £support_equipment_text_icon §R[GetBioValueContainmentSupport]§!"
bio_sustain_containment_available_tt: "Requires a controlled state with a detected outbreak in this intensity band, active quarantine, a field hospital or international mission, no containment mission underway, £GFX_motorized_equipment_text_icon §Y[GetBioValueContainmentTrucks]§! trucks and £cbrn_instruments_texticon §Y[GetBioValueContainmentInstruments]§! instruments on hand. Neither stock is consumed on selection."
bio_sustain_containment_isolated_effect_tt: "Run a §Y[GetBioValueContainmentIsolatedDays]-day§! containment mission. Continued success or partial success consumes an additional support shipment only while transport and instruments remain available. Loss of control or a supply shortage causes failure. Keep £medical_capacity_texticon §Y[GetBioValueContainmentRemainingCapacity]§! uncommitted at resolution for success or partial success."
bio_sustain_containment_local_effect_tt: "Run a §Y[GetBioValueContainmentLocalDays]-day§! containment mission. Continued success or partial success consumes an additional support shipment only while transport and instruments remain available. Loss of control or a supply shortage causes failure. Keep £medical_capacity_texticon §Y[GetBioValueContainmentRemainingCapacity]§! uncommitted at resolution for success or partial success."
bio_sustain_containment_regional_effect_tt: "Run a §Y[GetBioValueContainmentRegionalDays]-day§! containment mission. Continued success or partial success consumes an additional support shipment only while transport and instruments remain available. Loss of control or a supply shortage causes failure. Keep £medical_capacity_texticon §Y[GetBioValueContainmentRemainingCapacity]§! uncommitted at resolution for success or partial success."
bio_sustain_containment_severe_effect_tt: "Run a §Y[GetBioValueContainmentSevereDays]-day§! containment mission. Continued success or partial success consumes an additional support shipment only while transport and instruments remain available. Loss of control or a supply shortage causes failure. Keep £medical_capacity_texticon §Y[GetBioValueContainmentRemainingCapacity]§! uncommitted at resolution for success or partial success."

# Camps and Genocide Crisis
genocide_crisis_category: "Camps and Genocide"
genocide_crisis_category_desc: "Manage camp infrastructure, internal security policy, forced labor logistics, detention networks, transport priorities, record custody, and wartime administrative measures."
imperial_occupation_crisis: "Imperial Occupation Crisis"
imperial_occupation_crisis_desc: "Japan can expand forced labor networks, anti-partisan terror, and prisoner experimentation in occupied Chinese and Manchurian regions. Biowarfare-linked actions connect to the existing contamination system."
gulag_and_mass_repression_system: "Gulag and Mass Repression"
gulag_and_mass_repression_system_desc: "The Soviet security state can expand gulag networks, deport suspected opposition groups, and use food confiscation against disloyal regions. Discovery creates the same condemnation path as other camp evidence."
genocide_foreign_response_category: "Atrocity Response"
genocide_foreign_response_category_desc: "Foreign states can publicize testimony, impose sanctions, support resistance networks, and prepare tribunal records once camp evidence has been discovered."

genocide_build_extermination_camp: "Expand Existing Camp in [FROM.GetName]"
genocide_build_extermination_camp_desc: "Convert one concentration-camp level in [FROM.GetName] into one extermination-camp level. The conversion preserves the state's five-level camp capacity, prevents further concentration-camp construction there, and sharply escalates deaths, resistance pressure, and later condemnation if the site is discovered."
germany_wartime_camp_administration: "Centralize Wartime Camp Administration"
germany_wartime_camp_administration_desc: "Place the camp offices in occupied Poland under tighter wartime authority, binding transport, guards, and local administration to the same chain of command."
germany_expand_occupied_poland_camp_system: "Expand Occupied Poland Camp System in [FROM.GetName]"
germany_expand_occupied_poland_camp_system_desc: "Expand camp infrastructure in occupied Polish territory under wartime German administration."
germany_expand_extermination_site_network: "Expand Extermination Site Network in [FROM.GetName]"
germany_expand_extermination_site_network_desc: "Convert one concentration-camp level at an occupied Polish site into one extermination-camp level once the Auschwitz area is under German control."
germany_intensify_extermination_policy: "Intensify Extermination Policy"
germany_intensify_extermination_policy_desc: "Order active extermination sites to increase their killing tempo under central direction."
germany_transfer_prisoners_to_experiment_site: "Order Transfer to Auschwitz"
germany_transfer_prisoners_to_experiment_site_desc: "Current source: [This.GetCampOccManualSourceName]. Move a documented group of living people from that occupied district into the supported killing center at Auschwitz. Transport itself causes no recorded death; any loss on arrival or later is counted there under the original authority."
genocide_restricted_chemical_site_escalation: "Escalate Restricted Chemical Site in [FROM.GetName]"
genocide_restricted_chemical_site_escalation_desc: "Use restricted nerve-agent stockpiles inside an existing camp or experimental site, leaving contaminated ground and severe evidence if the site is discovered."
genocide_requires_restricted_chemical_stockpile_tt: "Requires a matching sarin or soman program and enough payload cylinders."
cbrn_camp_requires_operational_readiness_tt: "Requires operational Chemical Readiness and positive CBRN command integration for the exact selected site."
germany_wartime_camp_administration_cost: "£pol_power §Y25§! £command_power §Y20§!"
germany_wartime_camp_administration_cost_blocked: "£pol_power §R25§! £command_power §R20§!"
