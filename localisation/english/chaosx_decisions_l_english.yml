bio_expand_biosecurity_capacity: "Expand Biological Security Capacity"
bio_expand_biosecurity_capacity_desc: "Issue detection instruments and support stores to laboratory security and epidemiological teams. The investment takes §Y[GetBioValueCapacityInvestmentDays] days§! and adds §G[GetBioValueBiosecurityInvestmentGain] Biological Security§! on completion."
