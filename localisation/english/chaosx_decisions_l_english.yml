quarantine_measures_available_tt: "Requires a controlled state with a detected outbreak, no quarantine deployment underway, £support_equipment_text_icon §Y[GetBioValueQuarantineSupport]§! support equipment and £infantry_equipment_text_icon §Y[GetBioValueQuarantineInfantry]§! infantry equipment on hand. Those stocks are not consumed."
quarantine_measures_effect_tt: "After §Y[GetBioValueQuarantineDays] days§!, establish quarantine in §Y[FROM.GetName]§! if the outbreak remains active. The local cordon strains production and raises resistance while slowing infection and spread."
close_border_to_infected_neighbor: "Close Border: [FROM.GetNameDef]"
close_border_to_infected_neighbor_desc: "Seal the border with §Y[FROM.GetNameDef]§! while disease is active near the frontier. The closure blocks market access and volunteer deployment across this exact relationship and reduces, but cannot eliminate, cross-border spread."
close_border_to_infected_neighbor_available_tt: "Requires an open border with the selected neighboring country and an active outbreak near that exact frontier."
close_border_to_infected_neighbor_effect_tt: "Record an exact bilateral disease-control closure with §Y[FROM.GetNameDef]§!, block market access and volunteer deployment, and reduce outbreak spread across that border."
reopen_border_to_infected_neighbor: "Reopen Border: [FROM.GetNameDef]"
reopen_border_to_infected_neighbor_desc: "Withdraw our exact disease-control closure with §Y[FROM.GetNameDef]§!. Any closure retained by the other government remains in force."
reopen_border_to_infected_neighbor_available_tt: "Requires an existing national disease-control closure with the selected neighboring country."
reopen_border_to_infected_neighbor_effect_tt: "Remove our recorded disease-control closure with §Y[FROM.GetNameDef]§!. When no other national closure remains, unregister our market and volunteer restrictions."
bio_border_closure_usage_desc: "Border closed for biological containment"
develop_anthrax_antibiotics_retroactively: "Emergency Anthrax Antibiotics Program"
develop_anthrax_antibiotics_retroactively_desc: "Divert research teams to identify reliable anthrax treatment protocols. The emergency effort slows other research for §Y[GetBioValueAnthraxDevelopmentDays] days§! before production can begin."
develop_anthrax_antibiotics_retroactively_available_tt: "Requires a detected domestic Anthrax outbreak, publicly confirmed Anthrax use, or a known domestic Anthrax capability, with no Anthrax-antibiotic research already completed or underway."
develop_anthrax_antibiotics_retroactively_effect_tt: "Begin a §Y[GetBioValueAnthraxDevelopmentDays]-day§! emergency program that changes Research Speed by §R[GetBioValueAnthraxResearchSlowdown]§! and unlocks anthrax-antibiotic mass production when complete."
anthrax_antibiotics_mass_production: "Anthrax Antibiotics Mass Production"
anthrax_antibiotics_mass_production_desc: "Maintain national industrial stores of anthrax antibiotics. Production imposes a consumer-goods burden and enables exact-state courses against detected Anthrax outbreaks."
anthrax_antibiotics_mass_production_available_tt: "Requires completed Anthrax-antibiotic research with no active or developing Anthrax production program."
anthrax_antibiotics_mass_production_effect_tt: "After §Y[GetBioValueAnthraxProductionDays] days§!, activate Anthrax Antibiotics Mass Production at a §R[GetBioValueAnthraxConsumerGoods] Consumer Goods§! burden."
revoke_anthrax_antibiotics_mass_production: "End Anthrax Antibiotics Mass Production"
revoke_anthrax_antibiotics_mass_production_desc: "Wind down the anthrax production lines. Courses already in transit and active treatment services continue under their existing commitments, but no new courses can be dispatched."
revoke_anthrax_antibiotics_mass_production_available_tt: "Requires active Anthrax Antibiotics Mass Production."
revoke_anthrax_antibiotics_mass_production_effect_tt: "After §Y[GetBioValueAntibioticShutdownDays] days§!, remove the Anthrax Antibiotics Mass Production program."
bio_distribute_anthrax_antibiotics: "Distribute Anthrax Antibiotics in [FROM.GetName]"
bio_distribute_anthrax_antibiotics_desc: "Dispatch a treatment course to the detected Anthrax outbreak in §Y[FROM.GetName]§!. Repeated emergency courses during the same episode have diminishing effectiveness."
bio_distribute_anthrax_antibiotics_available_tt: "Requires Anthrax-antibiotic production, a controlled state with a detected Anthrax episode, no course in transit or on cooldown, fewer than §Y[GetBioValueAntibioticMaximumCourses]§! prior courses this episode, and room for a medical team if the state has none."
bio_distribute_anthrax_antibiotics_effect_tt: "After §Y[GetBioValueAntibioticDistributionDays] days§!, deliver an Anthrax treatment course and begin a §Y[GetBioValueAntibioticCooldownDays]-day§! cooldown if the outbreak remains eligible. Medical teams return when no supported course remains."
