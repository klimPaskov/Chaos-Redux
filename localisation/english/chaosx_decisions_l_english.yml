# Camps and Genocide Crisis
genocide_crisis_category: "Camps and Genocide"
genocide_crisis_category_desc: "Manage camp infrastructure, internal security policy, forced labor logistics, detention networks, transport priorities, record custody, and wartime administrative measures."
imperial_occupation_crisis: "Imperial Occupation Crisis"
imperial_occupation_crisis_desc: "Japan can expand forced labor networks, anti-partisan terror, and prisoner experimentation in occupied Chinese and Manchurian regions. Biowarfare-linked actions connect to the existing contamination system."
gulag_and_mass_repression_system: "Gulag and Mass Repression"
gulag_and_mass_repression_system_desc: "The Soviet security state can expand gulag networks, deport suspected opposition groups, and use food confiscation against disloyal regions. Discovery creates the same condemnation path as other camp evidence."
genocide_foreign_response_category: "Atrocity Response"
genocide_foreign_response_category_desc: "Foreign states can publicize testimony, impose sanctions, support resistance networks, and prepare tribunal records once camp evidence has been discovered."

genocide_show_hidden_decisions: "Show Camp Administration Decisions"
genocide_show_hidden_decisions_desc: "Reveal eligible escalation actions for existing camp infrastructure."
genocide_hide_hidden_decisions: "Hide Camp Administration Decisions"
genocide_hide_hidden_decisions_desc: "Hide eligible escalation actions so the decision list stays focused on ordinary administration."
sov_show_gulag_decisions: "Show Gulag Decisions"
sov_show_gulag_decisions_desc: "Reveal eligible gulag and mass-repression actions."
sov_hide_gulag_decisions: "Hide Gulag Decisions"
sov_hide_gulag_decisions_desc: "Hide eligible gulag and mass-repression actions so the decision list stays focused."
genocide_build_extermination_camp: "Expand Existing Camp in [FROM.GetName]"
genocide_build_extermination_camp_desc: "Convert one concentration-camp level in [FROM.GetName] into one extermination-camp level. The conversion preserves the state's five-level camp capacity, prevents further concentration-camp construction there, and sharply escalates deaths, resistance pressure, and later condemnation if the site is discovered."
germany_wartime_camp_administration: "Centralize Wartime Camp Administration"
germany_wartime_camp_administration_desc: "Place the camp offices in occupied Poland under tighter wartime authority, binding transport, guards, and local administration to the same chain of command."
germany_expand_occupied_poland_camp_system: "Expand Occupied Poland Camp System in [FROM.GetName]"
germany_expand_occupied_poland_camp_system_desc: "Expand camp infrastructure in occupied Polish territory under wartime German administration."
germany_expand_extermination_site_network: "Expand Extermination Site Network in [FROM.GetName]"
germany_expand_extermination_site_network_desc: "Convert one concentration-camp level at an occupied Polish site into one extermination-camp level once the Auschwitz area is under German control."
germany_intensify_extermination_policy: "Intensify Extermination Policy"
germany_intensify_extermination_policy_desc: "Order active extermination sites to increase their killing tempo under central direction."
germany_transfer_prisoners_to_experiment_site: "Transfer Prisoners to Experimental Site in [FROM.GetName]"
germany_transfer_prisoners_to_experiment_site_desc: "Move prisoners from [FROM.GetName] into an experimental site connected to the Mengele program."
genocide_restricted_chemical_site_escalation: "Escalate Restricted Chemical Site in [FROM.GetName]"
genocide_restricted_chemical_site_escalation_desc: "Use restricted nerve-agent stockpiles inside an existing camp or experimental site, leaving contaminated ground and severe evidence if the site is discovered."
genocide_requires_restricted_chemical_stockpile_tt: "Requires a matching sarin or soman program and enough payload cylinders."
cbrn_camp_requires_operational_readiness_tt: "Requires operational Chemical Readiness and positive CBRN command integration for the exact selected site."
