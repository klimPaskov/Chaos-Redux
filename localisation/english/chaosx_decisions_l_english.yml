bio_sustain_containment_available_tt: "Requires a controlled selected state with a detected ordinary outbreak in this intensity band, active quarantine, a field hospital or international mission, no containment mission already active there, §Y[?constant:bio_countermeasure_capacity.containment_mission_medical_commitment|0] uncommitted Medical Capacity§!, and the listed resources."
