find_cure_tier_0_desc: "Develop a cure for the current outbreak. League membership and investment can shorten the research period."
find_cure_tier_1: "Search for the cure"
find_cure_tier_1_desc: "Develop a cure for the evolved horde. League membership and investment can shorten the research period."
find_cure_tier_2: "Search for the cure"
