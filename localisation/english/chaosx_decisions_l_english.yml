bio_expand_medical_capacity.cost.evolution: "£pol_power §Y[?black_friday_bio_expand_medical_pp_cost|.0]§!  £support_equipment_text_icon §Y[?black_friday_bio_expand_medical_support_cost|.0]§!  £GFX_motorized_equipment_text_icon §Y[?black_friday_bio_expand_medical_truck_cost|.0]§!"
