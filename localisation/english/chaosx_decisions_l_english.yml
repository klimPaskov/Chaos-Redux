# Outbreak Prevention Measures
chaosx_outbreak_prevention_category: "Zombie Outbreak Prevention"
chaosx_outbreak_prevention_category_desc: "With the zombie outbreak spreading globally, preventive measures can protect our nation. Each measure offers protection and carries a manageable cost."
enforce_hygiene_measures: "Enforce Strict Hygiene Measures"
enforce_hygiene_measures_desc: "Implement nationwide hygiene protocols including mandatory hand washing, sanitization stations, and health inspections. This basic measure provides some protection against zombie contagion and modestly improves wider disease containment, but causes minor social disruption and costs."
restrict_migration: "Restrict Migration and Travel"
restrict_migration_desc: "Severely limit domestic and international travel, implement strict border controls, and require health certificates for all movement. This measure significantly reduces outbreak risk and slightly improves broader disease containment, but causes economic disruption and social unrest."
quarantine_protocols: "Implement Quarantine Protocols"
quarantine_protocols_desc: "Establish mandatory quarantine facilities for all travelers and suspected cases, with strict isolation procedures. This comprehensive measure provides strong protection and noticeably improves broader disease containment, but requires substantial resources and causes significant social strain."
close_borders_completely: "Close All Borders"
close_borders_completely_desc: "Completely seal our borders to all non-essential traffic, allowing only critical supplies under strict supervision. This extreme measure provides excellent protection and sharply reduces external disease exposure, but severely damages our economy and international relations."
extreme_martial_law: "Declare Extreme Martial Law"
extreme_martial_law_desc: "Implement the ultimate protective measure: complete martial law with military control of all movement, mandatory curfews, and shoot-on-sight orders for suspected infected. This provides total immunity from zombie outbreaks and the strongest general disease containment boost, but destroys our society's fabric. Requires all other measures to be in place first."
revoke_hygiene_measures: "Revoke Hygiene Measures"
revoke_hygiene_measures_desc: "Implement nationwide hygiene protocols including mandatory hand washing, sanitization stations, and health inspections. This basic measure provides some protection against zombie contagion but causes minor social disruption and costs."
revoke_migration_restrictions: "Allow Migration and Travel"
revoke_migration_restrictions_desc: "Severely limit domestic and international travel, implement strict border controls, and require health certificates for all movement. This measure significantly reduces outbreak risk but causes economic disruption and social unrest."
revoke_quarantine_protocols: "Revoke Quarantine Protocols"
revoke_quarantine_protocols_desc: "Establish mandatory quarantine facilities for all travelers and suspected cases, with strict isolation procedures. This comprehensive measure provides strong protection but requires substantial resources and causes significant social strain."
reopen_borders: "Reopen Borders"
reopen_borders_desc: "Completely seal our borders to all non-essential traffic, allowing only critical supplies under strict supervision. This extreme measure provides excellent protection but severely damages our economy and international relations."
revoke_extreme_martial_law: "Revoke Extreme Martial Law"
revoke_extreme_martial_law_desc: "Implement the ultimate protective measure: complete martial law with military control of all movement, mandatory curfews, and shoot-on-sight orders for suspected infected. This provides total immunity from zombie outbreaks but destroys our society's fabric. Requires all other measures to be in place first."

disease_enforce_hygiene_measures: "Enforce Strict Hygiene Measures"
disease_enforce_hygiene_measures_desc: "Implement nationwide hygiene protocols including mandatory hand washing, sanitization stations, and health inspections. This basic measure provides some protection against zombie contagion and modestly improves wider disease containment, but causes minor social disruption and costs."
disease_restrict_migration: "Restrict Migration and Travel"
disease_restrict_migration_desc: "Severely limit domestic and international travel, implement strict border controls, and require health certificates for all movement. This measure significantly reduces outbreak risk and slightly improves broader disease containment, but causes economic disruption and social unrest."
disease_quarantine_protocols: "Implement Quarantine Protocols"
disease_quarantine_protocols_desc: "Establish mandatory quarantine facilities for all travelers and suspected cases, with strict isolation procedures. This comprehensive measure provides strong protection and noticeably improves broader disease containment, but requires substantial resources and causes significant social strain."
disease_close_borders_completely: "Close All Borders"
disease_close_borders_completely_desc: "Completely seal our borders to all non-essential traffic, allowing only critical supplies under strict supervision. This extreme measure provides excellent protection and sharply reduces external disease exposure, but severely damages our economy and international relations."
disease_extreme_martial_law: "Declare Extreme Martial Law"
disease_extreme_martial_law_desc: "Implement the ultimate protective measure: complete martial law with military control of all movement, mandatory curfews, and shoot-on-sight orders for suspected infected. This provides total immunity from zombie outbreaks and the strongest general disease containment boost, but destroys our society's fabric. Requires all other measures to be in place first."
disease_revoke_hygiene_measures: "Revoke Hygiene Measures"
disease_revoke_hygiene_measures_desc: "Lift the nationwide hygiene emergency protocols. This removes the broader disease-containment benefit and returns social life and industry toward normal."
disease_revoke_migration_restrictions: "Allow Migration and Travel"
disease_revoke_migration_restrictions_desc: "Lift the emergency migration and travel restrictions. This reduces disruption, but also removes the extra disease-containment protection tied to reduced movement."
disease_revoke_quarantine_protocols: "Revoke Quarantine Protocols"
disease_revoke_quarantine_protocols_desc: "Stand down the national quarantine regime. This eases internal strain, but also removes the stronger disease-containment protection it provided."
disease_reopen_borders: "Reopen Borders"
disease_reopen_borders_desc: "Reopen the country's borders and return to normal movement controls. This reduces the economic burden, but also removes the external infection protection from full closure."
disease_revoke_extreme_martial_law: "Revoke Extreme Martial Law"
disease_revoke_extreme_martial_law_desc: "End the emergency military containment regime. This restores normal civic life, but also removes the strongest country-level disease-containment bonus."


# Anti-Zombie League decisions
chaosx_anti_zombie_league_category: "Anti-Zombie League"
chaosx_anti_zombie_league_category_desc: "Coordinate governments willing to contain the zombie outbreak, share the military burden, and preserve a common front against infected expansion."
leave_anti_zombie_league: "Leave Anti-Zombie League"
leave_anti_zombie_league_desc: "With the zombie threat diminished, some question whether the league's restrictions and resource commitments are still necessary. Leaving will remove our combat bonuses but also end our obligations to the alliance."
disband_anti_zombie_league: "Disband Anti-Zombie League"
disband_anti_zombie_league_desc: "With zombies reduced to a minimal threat, the Anti-Zombie League has served its purpose. The time has come to formally dissolve the alliance and allow member nations to return to their normal affairs."
form_anti_zombie_league: "Form the Anti Zombie League"
form_anti_zombie_league_desc: "The zombie threat has grown beyond what any single nation can handle. It's time to unite the world in a grand alliance to coordinate our efforts against the undead menace."
join_anti_zombie_league: "Join the Anti Zombie League"
join_anti_zombie_league_desc: "The zombie threat has grown beyond what any single nation can handle. It's time to unite the world in a grand alliance to coordinate our efforts against the undead menace."
invest_in_league_research: "Invest in League Research"
invest_in_league_research_desc: "Dedicate additional resources to the Anti Zombie League's research programs. This will impose temporary penalties on our research and production as resources are diverted, but will strengthen the League's overall combat effectiveness against zombies. Major powers contribute 3 investment points while minor powers contribute 1 point. Every 10 points increases the League's combat bonus by 5%, starting from 15% and capping at 100%. Our current investment is §G[?global.azl_global_investment|.0G]§! points."

# Air Cleanliness Treaty Decisions
air_cleanliness_treaty_category: "Air Cleanliness Treaty"
air_cleanliness_treaty_category_desc: "Member atmospheric offices exchange readings, maintain relief depots, receive secretariat verification missions, and enforce the prohibition on unconventional weapons. Using a prohibited weapon or refusing a secretariat inspection expels the member, closes treaty relief access, and opens sanctions from the remaining signatories."
air_cleanliness_global_cleaning_day: "Ratify a Global Cleaning Day"
air_cleanliness_global_cleaning_day_desc: "Release filters and convoy capacity to a synchronized maintenance charter. Member rail yards, ports, and municipal stations will replace cartridges and seal ash traps during a forty-five-day project. The sponsor loses committed equipment if the treaty quorum fails, less than one percentage point of contamination remains, or the atmosphere becomes irreversible before completion."
air_cleanliness_global_cleaning_day_effect_tt: "Commits §Y500§! support equipment and §Y50§! convoys when work begins, while §Y4§! civilian factories remain assigned for §Y45 days§!. Completion lowers global Air Contamination by §G1 percentage point§! and begins a §Y180-day§! treaty cooldown. The charter cancels without a refund if its quorum fails, less than §Y1 percentage point§! remains, or the atmosphere becomes irreversible."
air_cleanliness_joint_filter_convoy: "Send a Joint Filter Convoy to [FROM.GetNameDef]"
air_cleanliness_joint_filter_convoy_desc: "Dispatch sealed filters, replacement cartridges, and convoy escorts to the recipient's designated priority state. The state must remain at Phase 3 or worse under the recipient's ownership and control until the convoy arrives. Equipment committed to a broken route is lost."
air_cleanliness_joint_filter_convoy_effect_tt: "Commits §Y120§! support equipment and §Y20§! convoys at dispatch, while §Y2§! civilian factories remain assigned for §Y21 days§!. Dispatch begins a §Y90-day§! donor cooldown even if the route fails. Arrival lowers exposure and disease pressure, improves shelter, recovery, and adaptation, and opens a relief route for up to §Y180 days§! while its conditions hold."
air_cleanliness_treaty_verification_mission: "Dispatch a Verification Mission to [FROM.GetNameDef]"
air_cleanliness_treaty_verification_mission_desc: "Send the treaty secretariat's calibration teams to compare a member's atmospheric readings, filter inventories, and depot records. The subject may open its facilities, release certified records without admitting technicians, or refuse entry. The mission closes if either country leaves the treaty, enters a war with the other, or the secretariat changes before the report returns."
air_cleanliness_treaty_verification_mission_effect_tt: "Commits §Y60 support equipment§! and §Y5 convoys§! when the mission departs, while §Y1 civilian factory§! remains assigned for §Y14 days§!. Dispatch begins a §Y90-day§! secretariat cooldown. The inspected member receives the request after arrival, then its signed result returns after exactly §Y7 days§!. Equipment committed to a cancelled mission is not recovered."

# Japan Chemical Campaign Decisions
japan_chemical_campaign_category: "China Theater Chemical Campaign"
japan_chemical_campaign_category_desc: "The Imperial Army can execute targeted cylinder operations against Chinese core regions in Asia. Select the prepared chemical agent, then launch a state attack that spends command power, consumes cylinders, and contaminates the area. Using these decisions might increase international condemnation."
japan_chemical_campaign_cycle_agent: "Selected agent: [GetJapanChemicalCampaignSelectedAgentName]"
japan_chemical_campaign_cycle_agent_desc: "Rotate the prepared chemical agent for the next targeted attack. Switching agents is free."
japan_chemical_campaign_attack: "Chemical attack in [FROM.GetName]"
japan_chemical_campaign_attack_desc: "Execute a targeted cylinder release in the selected enemy Chinese core state. This spends command power, consumes the selected cylinder stockpile, applies state contamination, and increases international condemnation."
japan_chemical_campaign_exact_adapter_unavailable_tt: "This operation is unavailable until the selected-state release can verify weather, terrain, payload, protection, and consequence inputs through the shared chemical exposure system."
japan_chemical_campaign_attack_cost: "£command_power  §Y20§!"
japan_chemical_campaign_attack_cost_blocked: "£command_power  §R20§!"
japan_chemical_campaign_attack_stockpile_tt: "Requires at least §Y120§! units of the currently selected chemical cylinder."
japan_chemical_campaign.agent.chlorine: "Chlorine gas"
japan_chemical_campaign.agent.phosgene: "Phosgene gas"
japan_chemical_campaign.agent.mustard: "Mustard gas"
japan_chemical_campaign.agent.lewisite: "Lewisite"

# Disease Containment Decisions
chaosx_disease_containment_category: "Biological Outbreak Response"
chaosx_disease_containment_category_desc: "Build national medical and biosecurity capacity, detect ordinary-pathogen outbreaks, and commit real personnel, instruments, vehicles, and medical stores to exact affected states."
black_plague_select_response_state_available_tt: "Requires the Black Plague response board and a controlled selected state eligible for local plague measures."
bio_expand_medical_capacity: "Expand Medical Countermeasure Stores"
bio_expand_medical_capacity_desc: "Convert support equipment and trucks into organized medical stores and trained response capacity. The investment takes §Y[?constant:bio_countermeasure_timing.capacity_investment_days|0] days§! and adds §G[?constant:bio_countermeasure_capacity.medical_investment_gain|0] Medical Capacity§! on completion."
bio_expand_medical_capacity_cost: "£support_equipment_text_icon §Y[?constant:bio_countermeasure_cost.expand_medical_support|0]§! £GFX_motorized_equipment_text_icon §Y[?constant:bio_countermeasure_cost.expand_medical_trucks|0]§!"
bio_expand_medical_capacity_cost_blocked: "Requires £support_equipment_text_icon §R[?constant:bio_countermeasure_cost.expand_medical_support|0]§! and £GFX_motorized_equipment_text_icon §R[?constant:bio_countermeasure_cost.expand_medical_trucks|0]§!."
bio_expand_medical_capacity_available_tt: "Requires Field Hospital training, room for another national Medical Capacity expansion, and the listed stores."
bio_expand_medical_capacity_effect_tt: "Consume §Y[?constant:bio_countermeasure_cost.expand_medical_support|0] Support Equipment§! and §Y[?constant:bio_countermeasure_cost.expand_medical_trucks|0] Trucks§! now. After §Y[?constant:bio_countermeasure_timing.capacity_investment_days|0] days§!, gain §G[?constant:bio_countermeasure_capacity.medical_investment_gain|0] Medical Capacity§!."
bio_expand_biosecurity_capacity: "Expand Biological Security Capacity"
bio_expand_biosecurity_capacity_desc: "Issue detection instruments and support stores to laboratory-security and epidemiological teams. The investment takes §Y[?constant:bio_countermeasure_timing.capacity_investment_days|0] days§! and adds §G[?constant:bio_countermeasure_capacity.biosecurity_investment_gain|0] Biological Security§! on completion."
bio_expand_biosecurity_capacity_cost: "§Y[?constant:bio_countermeasure_cost.expand_biosecurity_instruments|0] CBRN Instruments§! £support_equipment_text_icon §Y[?constant:bio_countermeasure_cost.expand_biosecurity_support|0]§!"
bio_expand_biosecurity_capacity_cost_blocked: "Requires §R[?constant:bio_countermeasure_cost.expand_biosecurity_instruments|0] CBRN Instruments§! and £support_equipment_text_icon §R[?constant:bio_countermeasure_cost.expand_biosecurity_support|0]§!."
bio_expand_biosecurity_capacity_available_tt: "Requires Chemical Detection Paper, either Biological Surveillance Networks or Pathogen Handling Protocols, room for another Biological Security expansion, and the listed stores."
bio_expand_biosecurity_capacity_effect_tt: "Consume §Y[?constant:bio_countermeasure_cost.expand_biosecurity_instruments|0] CBRN Instruments§! and §Y[?constant:bio_countermeasure_cost.expand_biosecurity_support|0] Support Equipment§! now. After §Y[?constant:bio_countermeasure_timing.capacity_investment_days|0] days§!, gain §G[?constant:bio_countermeasure_capacity.biosecurity_investment_gain|0] Biological Security§!."
bio_activate_surveillance_network: "Activate Biological Surveillance Network"
bio_activate_surveillance_network_desc: "Link laboratories, hospitals, field epidemiologists, and military reporting offices into a standing warning network. Earlier detection improves containment and preserves stronger evidence of the agent and its source."
bio_activate_surveillance_network_cost: "§Y[?constant:bio_countermeasure_cost.surveillance_instruments|0] CBRN Instruments§! £support_equipment_text_icon §Y[?constant:bio_countermeasure_cost.surveillance_support|0]§! £GFX_motorized_equipment_text_icon §Y[?constant:bio_countermeasure_cost.surveillance_trucks|0]§! §Y[?constant:bio_countermeasure_capacity.surveillance_medical_commitment|0] Medical Capacity§!"
bio_activate_surveillance_network_cost_blocked: "Requires §R[?constant:bio_countermeasure_cost.surveillance_instruments|0] CBRN Instruments§!, £support_equipment_text_icon §R[?constant:bio_countermeasure_cost.surveillance_support|0]§!, £GFX_motorized_equipment_text_icon §R[?constant:bio_countermeasure_cost.surveillance_trucks|0]§!, and §R[?constant:bio_countermeasure_capacity.surveillance_medical_commitment|0] Medical Capacity§!."
bio_activate_surveillance_network_available_tt: "Requires Biological Surveillance Networks, an inactive national network, §Y[?constant:bio_countermeasure_capacity.surveillance_medical_commitment|0] uncommitted Medical Capacity§!, and the listed stores."
bio_activate_surveillance_network_effect_tt: "Consume the listed equipment and commit §Y[?constant:bio_countermeasure_capacity.surveillance_medical_commitment|0] Medical Capacity§!. After §Y[?constant:bio_countermeasure_timing.surveillance_activation_days|0] days§!, activate a network that adds §G[?constant:bio_countermeasure_response.surveillance_network_add|0] Surveillance§! and strengthens evidence recovered when an agent is detected."
bio_stand_down_surveillance_network: "Stand Down Biological Surveillance Network"
bio_stand_down_surveillance_network_desc: "Dismantle the permanent warning network and return its committed medical teams to the national reserve. Detection will become slower and the evidence trail weaker."
bio_stand_down_surveillance_network_available_tt: "Requires an active Biological Surveillance Network."
bio_stand_down_surveillance_network_effect_tt: "After §Y[?constant:bio_countermeasure_timing.surveillance_stand_down_days|0] days§!, remove the surveillance network and restore its committed §G[?constant:bio_countermeasure_capacity.surveillance_medical_commitment|0] Medical Capacity§!."
deploy_field_hospitals: "Deploy Field Hospitals in [FROM.GetName]"
deploy_field_hospitals_desc: "Send mobile hospitals, laboratories, and transport columns to the detected outbreak in §Y[FROM.GetName]§!. Deployment consumes equipment and reserves Medical Capacity immediately so concurrent responses cannot spend the same teams twice."
deploy_field_hospitals_cost: "£command_power §Y[?constant:bio_countermeasure_cost.field_hospital_command_power|0]§! £support_equipment_text_icon §Y[?constant:bio_countermeasure_cost.field_hospital_support|0]§! £GFX_motorized_equipment_text_icon §Y[?constant:bio_countermeasure_cost.field_hospital_trucks|0]§! §Y[?constant:bio_countermeasure_cost.field_hospital_instruments|0] CBRN Instruments§! §Y[?constant:bio_countermeasure_capacity.field_hospital_medical_commitment|0] Medical Capacity§!"
deploy_field_hospitals_cost_blocked: "Requires £command_power §R[?constant:bio_countermeasure_cost.field_hospital_command_power|0]§!, £support_equipment_text_icon §R[?constant:bio_countermeasure_cost.field_hospital_support|0]§!, £GFX_motorized_equipment_text_icon §R[?constant:bio_countermeasure_cost.field_hospital_trucks|0]§!, §R[?constant:bio_countermeasure_cost.field_hospital_instruments|0] CBRN Instruments§!, and §R[?constant:bio_countermeasure_capacity.field_hospital_medical_commitment|0] Medical Capacity§!."
deploy_field_hospitals_available_tt: "Requires Field Hospital training, a controlled selected state with a detected ordinary outbreak and no hospital deployment underway, §Y[?constant:bio_countermeasure_capacity.field_hospital_medical_commitment|0] uncommitted Medical Capacity§!, and the listed resources."
deploy_field_hospitals_effect_tt: "Consume the listed resources and commit §Y[?constant:bio_countermeasure_capacity.field_hospital_medical_commitment|0] Medical Capacity§! now. After §Y[?constant:bio_countermeasure_timing.field_hospital_deployment_days|0] days§!, deploy the hospitals in §Y[FROM.GetName]§! if the outbreak remains eligible. A failed deployment restores the reserved Medical Capacity, but Political Power, Command Power, equipment, and supplies already spent are not refunded."
quarantine_measures: "Quarantine [FROM.GetName]"
quarantine_measures_desc: "Seal roads, police population movement, and divert local production in §Y[FROM.GetName]§!. Quarantine slows local growth and cross-state spread, improves detection, and creates immediate hardship, resistance pressure, and economic disruption."
quarantine_measures_cost: "£command_power §Y[?constant:bio_countermeasure_cost.quarantine_command_power|0]§! £support_equipment_text_icon §Y[?constant:bio_countermeasure_cost.quarantine_support|0]§! £GFX_motorized_equipment_text_icon §Y[?constant:bio_countermeasure_cost.quarantine_trucks|0]§! £infantry_equipment_text_icon §Y[?constant:bio_countermeasure_cost.quarantine_infantry|0]§! £manpower_texticon §Y[?constant:bio_countermeasure_cost.quarantine_manpower|0]§!"
quarantine_measures_cost_blocked: "Requires £command_power §R[?constant:bio_countermeasure_cost.quarantine_command_power|0]§!, £support_equipment_text_icon §R[?constant:bio_countermeasure_cost.quarantine_support|0]§!, £GFX_motorized_equipment_text_icon §R[?constant:bio_countermeasure_cost.quarantine_trucks|0]§!, £infantry_equipment_text_icon §R[?constant:bio_countermeasure_cost.quarantine_infantry|0]§!, and £manpower_texticon §R[?constant:bio_countermeasure_cost.quarantine_manpower|0]§!."
quarantine_measures_available_tt: "Requires a controlled selected state with a detected ordinary outbreak and no quarantine deployment underway, plus the listed command, equipment, and manpower resources."
quarantine_measures_effect_tt: "Consume the listed resources, change Stability by §R[?constant:bio_countermeasure_cost.quarantine_stability|%0]§!, and establish quarantine after §Y[?constant:bio_countermeasure_timing.quarantine_deployment_days|0] days§! if §Y[FROM.GetName]§! still contains an ordinary outbreak. Political Power, Command Power, equipment, manpower, and the Stability loss are not refunded if the cordon cannot be established."
close_border_to_infected_neighbor: "Close Border: [FROM.GetNameDef]"
close_border_to_infected_neighbor_desc: "Seal the border with §Y[FROM.GetNameDef]§! while disease is active near the frontier. The closure blocks market access and volunteer deployment across this exact relationship and reduces, but cannot eliminate, cross-border spread."
close_border_to_infected_neighbor_available_tt: "Requires an open border with the selected neighboring country and an active outbreak near that exact frontier."
close_border_to_infected_neighbor_effect_tt: "Record an exact bilateral disease-control closure with §Y[FROM.GetNameDef]§!, block market access and volunteer deployment, and reduce outbreak spread across that border."
reopen_border_to_infected_neighbor: "Reopen Border: [FROM.GetNameDef]"
reopen_border_to_infected_neighbor_desc: "Withdraw our exact disease-control closure with §Y[FROM.GetNameDef]§!. Any closure retained by the other government remains in force."
reopen_border_to_infected_neighbor_available_tt: "Requires an existing national disease-control closure with the selected neighboring country."
reopen_border_to_infected_neighbor_effect_tt: "Remove our recorded disease-control closure with §Y[FROM.GetNameDef]§!. When no other national closure remains, unregister our market and volunteer restrictions."
bio_border_closure_usage_desc: "Border closed for biological containment"
develop_anthrax_antibiotics_retroactively: "Emergency Anthrax Antibiotics Program"
develop_anthrax_antibiotics_retroactively_desc: "Divert research teams to identify reliable anthrax treatment protocols. The emergency effort slows other research for §Y[?constant:bio_countermeasure_timing.anthrax_development_days|0] days§! before production can begin."
develop_anthrax_antibiotics_retroactively_available_tt: "Requires a detected domestic Anthrax outbreak, publicly confirmed Anthrax use, or a known domestic Anthrax capability, with no Anthrax-antibiotic research already completed or underway."
develop_anthrax_antibiotics_retroactively_effect_tt: "Begin a §Y[?constant:bio_countermeasure_timing.anthrax_development_days|0]-day§! emergency program that changes Research Speed by §R[?constant:bio_countermeasure_idea.anthrax_research_slowdown|%0]§! and unlocks anthrax-antibiotic mass production when complete."
anthrax_antibiotics_mass_production: "Anthrax Antibiotics Mass Production"
anthrax_antibiotics_mass_production_desc: "Maintain national industrial stores of anthrax antibiotics. Production imposes a consumer-goods burden and enables exact-state courses against detected Anthrax outbreaks."
anthrax_antibiotics_mass_production_available_tt: "Requires completed Anthrax-antibiotic research with no active or developing Anthrax production program."
anthrax_antibiotics_mass_production_effect_tt: "After §Y[?constant:bio_countermeasure_timing.anthrax_production_days|0] days§!, activate Anthrax Antibiotics Mass Production at a §R[?constant:bio_countermeasure_idea.anthrax_consumer_goods|%0] Consumer Goods§! burden."
revoke_anthrax_antibiotics_mass_production: "End Anthrax Antibiotics Mass Production"
revoke_anthrax_antibiotics_mass_production_desc: "Wind down the anthrax production lines. Courses already in transit and active treatment services continue under their existing commitments, but no new courses can be dispatched."
revoke_anthrax_antibiotics_mass_production_available_tt: "Requires active Anthrax Antibiotics Mass Production."
revoke_anthrax_antibiotics_mass_production_effect_tt: "After §Y[?constant:bio_countermeasure_timing.antibiotic_shutdown_days|0] days§!, remove the Anthrax Antibiotics Mass Production program."
bio_distribute_anthrax_antibiotics: "Distribute Anthrax Antibiotics in [FROM.GetName]"
bio_distribute_anthrax_antibiotics_desc: "Dispatch a treatment course to the detected Anthrax outbreak in §Y[FROM.GetName]§!. Repeated emergency courses during the same episode have diminishing effectiveness."
bio_distribute_anthrax_antibiotics_available_tt: "Requires active Anthrax-antibiotic production, a controlled selected state with a detected Anthrax episode, no course in transit or on cooldown, fewer than §Y[?constant:bio_countermeasure_treatment.maximum_courses_per_episode|0]§! prior courses in this episode, the listed stores, and a state service committed by this country or §Y[?constant:bio_countermeasure_capacity.antibiotic_service_medical_commitment|0] uncommitted Medical Capacity§!."
bio_distribute_anthrax_antibiotics_effect_tt: "Consume equipment now. The first supported course in the state immediately commits §Y[?constant:bio_countermeasure_capacity.antibiotic_service_medical_commitment|0] Medical Capacity§! while any Anthrax, Plague, or Tularemia course there is active or in transit. After §Y[?constant:bio_countermeasure_timing.antibiotic_distribution_days|0] days§!, apply an Anthrax treatment course and a §Y[?constant:bio_countermeasure_timing.antibiotic_course_cooldown_days|0]-day§! cooldown if the outbreak remains eligible. A failed arrival returns otherwise unused capacity, but Political Power and equipment already spent are not refunded."
