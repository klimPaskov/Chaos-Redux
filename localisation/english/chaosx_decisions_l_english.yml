join_cure_sharing_tt: "We have §G[?zzz_cure]%§! of the cure completed.\nOur score is added to the global score if we join the cure sharing."
join_cure_sharing_desc: "Joining cure sharing pools our contribution with the group and speeds the shared cure.\nIf the cure is found, every member receives anti-Zombie bonuses, but faster adaptation shortens their duration.\nDecide carefully because a rival country could gain access to the cure."
zzz_cure_global_tt: "Your country will add §G[?cure_research_value]%§! progress to the global cure. We currently have §G[?global.zzz_cure]%§! The cure is automatically activated when it reaches 100%. More evolved zombies require more research effort."
zzz_cure_tt: "Your country will add §G[?cure_research_value]%§! progress to the global cure. We currently have §G[?zzz_cure]%§! More evolved zombies require more research effort."
leave_cure_sharing: "Leave cure sharing"
leave_cure_sharing_desc: "Withdraw our laboratories from the international cure-sharing network. Our national work will continue independently, but pooled progress and the network's shared protection will no longer apply to us."
activate_the_cure: "Activate the cure"
activate_the_cure_desc: "Deploy our completed national cure programme against the active zombie outbreak before the pathogen adapts further."

