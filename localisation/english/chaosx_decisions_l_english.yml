communism_threat_status_revolutionary_crisis: "§RRevolutionary Crisis§!"
communism_threat_status_collapse_imminent: "§RCollapse Imminent§!"
communism_threat_status_rebel_war_imminent: "§RRebel War Imminent§!"
communism_threat_meter_tt: "§YRevolutionary Threat Meter§!\nShows the national revolutionary threat from §Y0%§! to §R100%§!. Threat combines communist party support, controlled states, active escalation, and open rebel war.\n\nAt §R100%§!, a war against organized communist rebels is imminent."
communism_controlled_states_tt: "§YCommunist-Controlled States§!\nControlled states add daily communist support and increase local disruption.\n\nCurrent daily communist support from controlled states: §R+[?communism_control_daily_drift|.2]§!"
communism_control_level_1_tt: "§YAgitation Zones§!\nControlled states at this level: §Y[?communism_control_level_1_states|.0]§!\nLocal intervention can clear these states, but partial operations may only suppress penalties and build progress."
communism_control_level_2_tt: "§OInsurgent Strongholds§!\nControlled states at this level: §O[?communism_control_level_2_states|.0]§!\nLocal intervention usually needs repeated operations and reduces control to an Agitation Zone before the state can be cleared."
communism_control_level_3_tt: "§RCommunist Lockdowns§!\nControlled states at this level: §R[?communism_control_level_3_states|.0]§!\nLocal intervention can only suppress the worst penalties. Emergency intervention is needed to break lockdown control."
communism_control_state_mapicon_tt: "§YCommunist-Controlled State§!\nThis state is under communist control. Use the Communist Insurgency decisions to inspect control level and available intervention."
communism_state_control_level_agitation: "§YCommunist Agitation Zone§!"
communism_state_control_level_stronghold: "§OCommunist Insurgent Stronghold§!"
communism_state_control_level_lockdown: "§RCommunist Lockdown§!"
communism_state_control_level_unknown: "§YCommunist Control§!"
communism_local_military_intervention: "[FROM.GetCommunismStateControlLevelName] in §Y[FROM.GetName]§!"
communism_local_military_intervention_desc: "Deploy army and internal security units into this state. Cost scales with control level.\n\nCurrent level: [FROM.GetCommunismStateControlLevelName]\nIntervention progress: §Y[?FROM.communist_intervention_progress|.0]§!/§Y3§!\n\nAgitation Zones can be cleared, Insurgent Strongholds need repeated pressure, and Communist Lockdowns can only be temporarily suppressed."
communism_local_military_intervention_level_2: "[FROM.GetCommunismStateControlLevelName] in §Y[FROM.GetName]§!"
communism_local_military_intervention_level_2_desc: "$communism_local_military_intervention_desc$"
communism_local_military_intervention_level_3: "[FROM.GetCommunismStateControlLevelName] in §Y[FROM.GetName]§!"
communism_local_military_intervention_level_3_desc: "$communism_local_military_intervention_desc$"
communism_emergency_intervention: "Emergency National Intervention"
communism_emergency_intervention_desc: "Invoke emergency powers across all communist-controlled states. Cost scales with controlled and lockdown states. The operation reduces communist support in every controlled state, can clear or reduce state control, and may trigger a custom communist uprising from controlled states."

