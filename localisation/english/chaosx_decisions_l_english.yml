bio_distribute_antibiotics_cost_blocked: "£pol_power §R[GetBioValueAntibioticDistributionPp]§!  £support_equipment_text_icon §R[GetBioValueAntibioticDistributionSupport]§!  £GFX_motorized_equipment_text_icon §R[GetBioValueAntibioticDistributionTrucks]§!"
smallpox_vaccination_mass_program: "Smallpox Vaccination"
smallpox_vaccination_mass_program_desc: "Undertake broad vaccination against Smallpox, the most severe ordinary biological weapon. The long program consumes equipment, commits national Medical Capacity, and imposes a major continuing civilian burden."
smallpox_vaccination_mass_program_cost: "£pol_power §Y[GetBioValueVaccinationPp]§!  £cbrn_instruments_texticon §Y[GetBioValueVaccinationInstruments]§!  £support_equipment_text_icon §Y[GetBioValueVaccinationSupport]§!"
smallpox_vaccination_mass_program_cost_blocked: "£pol_power §R[GetBioValueVaccinationPp]§!  £cbrn_instruments_texticon §R[GetBioValueVaccinationInstruments]§!  £support_equipment_text_icon §R[GetBioValueVaccinationSupport]§!"
smallpox_vaccination_mass_program_available_tt: "Requires Integrated Epidemic Control, a Smallpox threat, an inactive national program, and £GFX_motorized_equipment_text_icon §Y[GetBioValueVaccinationTrucks]§! trucks on hand. The trucks remain in the stockpile."
smallpox_vaccination_mass_program_effect_tt: "After §Y[GetBioValueVaccinationDays] days§!, national vaccination sharply reduces Smallpox growth, spread, and deaths. The continuing program adds §R[GetBioValueVaccinationConsumerGoods] Consumer Goods§! and applies §R[GetBioValueVaccinationPoliticalPower] Political Power Gain§!."
revoke_smallpox_vaccination_mass_program: "End Smallpox Vaccination"
revoke_smallpox_vaccination_mass_program_desc: "End the continuing vaccination program and return its medical teams to the national reserve. The population will lose its strongest protection against Smallpox."
revoke_smallpox_vaccination_mass_program_available_tt: "Requires an active National Smallpox Vaccination Program."
revoke_smallpox_vaccination_mass_program_effect_tt: "After §Y[GetBioValueVaccinationShutdownDays] days§!, remove national Smallpox vaccination and restore its committed §G[GetBioValueVaccinationCapacity] Medical Capacity§!."
bio_request_international_medical_mission: "Medical Mission: [FROM.GetName]"
bio_request_international_medical_mission_desc: "Invite foreign medical observers and relief teams into §Y[FROM.GetName]§!. A mission improves surveillance, containment, and treatment while creating a transparent evidence record. A government hiding biological stockpiles risks exposing its own program."
bio_request_international_medical_mission_cost: "£pol_power §Y[GetBioValueInternationalMissionPp]§!  £support_equipment_text_icon §Y[GetBioValueInternationalMissionSupport]§!  £GFX_motorized_equipment_text_icon §Y[GetBioValueInternationalMissionTrucks]§!"
bio_request_international_medical_mission_cost_blocked: "£pol_power §R[GetBioValueInternationalMissionPp]§!  £support_equipment_text_icon §R[GetBioValueInternationalMissionSupport]§!  £GFX_motorized_equipment_text_icon §R[GetBioValueInternationalMissionTrucks]§!"
bio_request_international_medical_mission_available_tt: "Requires a controlled state with a detected outbreak, a cooperative Condemnation route and qualifying international access, no mission underway, and £cbrn_instruments_texticon §Y[GetBioValueInternationalMissionInstruments]§! instruments on hand. The instruments are not consumed."
bio_request_international_medical_mission_effect_tt: "After §Y[GetBioValueInternationalMissionDays] days§!, a successful mission adds §G[GetBioValueInternationalMissionSurveillance] Surveillance§!, §G[GetBioValueInternationalMissionContainment] Containment§!, and §G[GetBioValueInternationalMissionMedical] Medical Response§! in §Y[FROM.GetName]§!. It strengthens outbreak evidence, weakens concealment, improves Condemnation cooperation, and may expose a hidden biological stockpile. Medical teams return if the deployment cannot proceed."
bio_sustain_containment: "Sustain Containment in [FROM.GetName]"
bio_sustain_containment_desc: "Maintain the quarantine, medical deployment, national Medical Capacity, and supply flow around §Y[FROM.GetName]§!. Full success requires the outbreak's maximum intensity to fall without any new outbound spread while quarantine and a field hospital or international mission remain active. A weaker cordon can produce partial success if spread is stopped and intensity does not rise. Loss of control, exhausted reserves, new spread, or higher intensity produces failure and worsens the local outbreak."
bio_sustain_containment_isolated: "$bio_sustain_containment$"
bio_sustain_containment_isolated_desc: "$bio_sustain_containment_desc$"
bio_sustain_containment_local: "$bio_sustain_containment$"
bio_sustain_containment_local_desc: "$bio_sustain_containment_desc$"
bio_sustain_containment_regional: "$bio_sustain_containment$"
bio_sustain_containment_regional_desc: "$bio_sustain_containment_desc$"
bio_sustain_containment_severe: "$bio_sustain_containment$"
bio_sustain_containment_severe_desc: "$bio_sustain_containment_desc$"
bio_sustain_containment_cost: "£pol_power §Y[GetBioValueContainmentPp]§!  £command_power §Y[GetBioValueContainmentCommandPower]§!  £support_equipment_text_icon §Y[GetBioValueContainmentSupport]§!"
bio_sustain_containment_cost_blocked: "£pol_power §R[GetBioValueContainmentPp]§!  £command_power §R[GetBioValueContainmentCommandPower]§!  £support_equipment_text_icon §R[GetBioValueContainmentSupport]§!"
bio_sustain_containment_available_tt: "Requires a controlled state with a detected outbreak in this intensity band, active quarantine, a field hospital or international mission, no containment mission underway, £GFX_motorized_equipment_text_icon §Y[GetBioValueContainmentTrucks]§! trucks and £cbrn_instruments_texticon §Y[GetBioValueContainmentInstruments]§! instruments on hand. Neither stock is consumed on selection."
bio_sustain_containment_isolated_effect_tt: "Run a §Y[GetBioValueContainmentIsolatedDays]-day§! containment mission. Continued success or partial success consumes an additional support shipment only while transport and instruments remain available. Loss of control or a supply shortage causes failure. Keep £medical_capacity_texticon §Y[GetBioValueContainmentRemainingCapacity]§! uncommitted at resolution for success or partial success."
bio_sustain_containment_local_effect_tt: "Run a §Y[GetBioValueContainmentLocalDays]-day§! containment mission. Continued success or partial success consumes an additional support shipment only while transport and instruments remain available. Loss of control or a supply shortage causes failure. Keep £medical_capacity_texticon §Y[GetBioValueContainmentRemainingCapacity]§! uncommitted at resolution for success or partial success."
bio_sustain_containment_regional_effect_tt: "Run a §Y[GetBioValueContainmentRegionalDays]-day§! containment mission. Continued success or partial success consumes an additional support shipment only while transport and instruments remain available. Loss of control or a supply shortage causes failure. Keep £medical_capacity_texticon §Y[GetBioValueContainmentRemainingCapacity]§! uncommitted at resolution for success or partial success."
bio_sustain_containment_severe_effect_tt: "Run a §Y[GetBioValueContainmentSevereDays]-day§! containment mission. Continued success or partial success consumes an additional support shipment only while transport and instruments remain available. Loss of control or a supply shortage causes failure. Keep £medical_capacity_texticon §Y[GetBioValueContainmentRemainingCapacity]§! uncommitted at resolution for success or partial success."

# Camps and Genocide Crisis
genocide_crisis_category: "Camps and Genocide"
genocide_crisis_category_desc: "Manage camp infrastructure, internal security policy, forced labor logistics, detention networks, transport priorities, record custody, and wartime administrative measures."
imperial_occupation_crisis: "Imperial Occupation Crisis"
imperial_occupation_crisis_desc: "Japan can expand forced labor networks, anti-partisan terror, and prisoner experimentation in occupied Chinese and Manchurian regions. Biowarfare-linked actions connect to the existing contamination system."
gulag_and_mass_repression_system: "Gulag and Mass Repression"
gulag_and_mass_repression_system_desc: "The Soviet security state can expand gulag networks, deport suspected opposition groups, and use food confiscation against disloyal regions. Discovery creates the same condemnation path as other camp evidence."
genocide_foreign_response_category: "Atrocity Response"
genocide_foreign_response_category_desc: "Foreign states can publicize testimony, impose sanctions, support resistance networks, and prepare tribunal records once camp evidence has been discovered."

genocide_build_extermination_camp: "Expand Existing Camp in [FROM.GetName]"
genocide_build_extermination_camp_desc: "Convert one concentration-camp level in [FROM.GetName] into one extermination-camp level. The conversion preserves the state's five-level camp capacity, prevents further concentration-camp construction there, and sharply escalates deaths, resistance pressure, and later condemnation if the site is discovered."
germany_wartime_camp_administration: "Centralize Wartime Camp Administration"
germany_wartime_camp_administration_desc: "Place the camp offices in occupied Poland under tighter wartime authority, binding transport, guards, and local administration to the same chain of command."
germany_expand_occupied_poland_camp_system: "Expand Occupied Poland Camp System in [FROM.GetName]"
germany_expand_occupied_poland_camp_system_desc: "Expand camp infrastructure in occupied Polish territory under wartime German administration."
germany_expand_extermination_site_network: "Expand Extermination Site Network in [FROM.GetName]"
germany_expand_extermination_site_network_desc: "Convert one concentration-camp level at an occupied Polish site into one extermination-camp level once the Auschwitz area is under German control."
germany_intensify_extermination_policy: "Intensify Extermination Policy"
germany_intensify_extermination_policy_desc: "Order active extermination sites to increase their killing tempo under central direction."
germany_transfer_prisoners_to_experiment_site: "Order Transfer to Auschwitz"
germany_transfer_prisoners_to_experiment_site_desc: "Current source: [This.GetCampOccManualSourceName]. Move a documented group of living people from that occupied district into the supported killing center at Auschwitz. Transport itself causes no recorded death; any loss on arrival or later is counted there under the original authority."
genocide_restricted_chemical_site_escalation: "Escalate Restricted Chemical Site in [FROM.GetName]"
genocide_restricted_chemical_site_escalation_desc: "Use restricted nerve-agent stockpiles inside an existing camp or experimental site, leaving contaminated ground and severe evidence if the site is discovered."
genocide_requires_restricted_chemical_stockpile_tt: "Requires a matching sarin or soman program and enough payload cylinders."
cbrn_camp_requires_operational_readiness_tt: "Requires operational Chemical Readiness and positive CBRN command integration for the exact selected site."
germany_wartime_camp_administration_cost: "£pol_power §Y25§! £command_power §Y20§!"
germany_wartime_camp_administration_cost_blocked: "£pol_power §R25§! £command_power §R20§!"
germany_expand_extermination_site_network_cost: "£pol_power §Y55§! £army_experience §Y10§! £command_power §Y20§!"
germany_expand_extermination_site_network_cost_blocked: "£pol_power §R55§! £army_experience §R10§! £command_power §R20§!"
germany_intensify_extermination_policy_cost: "£pol_power §Y35§! £command_power §Y15§!"
germany_intensify_extermination_policy_cost_blocked: "£pol_power §R35§! £command_power §R15§!"
germany_transfer_prisoners_to_experiment_site_cost: "£pol_power §Y[?global.black_friday_price_genocide_decision_cost_german_experiment_transfer|0]§! £army_experience §Y[?global.black_friday_price_genocide_decision_cost_german_experiment_transfer_army_xp|0]§! £support_equipment_text_icon §Y[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§! £GFX_train_texticon §Y[?global.black_friday_price_camp_rework_equipment_cost_trains|0]§!"
germany_transfer_prisoners_to_experiment_site_cost_blocked: "[This.GetCampOccManualTransferCostStatus]"
germany_transfer_prisoners_to_experiment_site_cost_tooltip: "The order costs £pol_power §Y[?global.black_friday_price_genocide_decision_cost_german_experiment_transfer|0]§!, £army_experience §Y[?global.black_friday_price_genocide_decision_cost_german_experiment_transfer_army_xp|0]§!, £support_equipment_text_icon §Y[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§!, and £GFX_train_texticon §Y[?global.black_friday_price_camp_rework_equipment_cost_trains|0]§!.\n[This.GetCampOccManualTransferCostStatus] The administration pays only after a living group is received."
camp_occ_manual_transfer_short_pp: "Requires £pol_power §R[?global.black_friday_price_genocide_decision_cost_german_experiment_transfer|0]§!."
camp_occ_manual_transfer_short_xp: "Requires £army_experience §R[?global.black_friday_price_genocide_decision_cost_german_experiment_transfer_army_xp|0]§!."
camp_occ_manual_transfer_short_support: "Requires £support_equipment_text_icon §R[?global.black_friday_price_camp_rework_equipment_cost_support_equipment|0]§!."
camp_occ_manual_transfer_short_trains: "Requires £GFX_train_texticon §R[?global.black_friday_price_camp_rework_equipment_cost_trains|0]§!."
camp_occ_manual_transfer_cost_ready: "All listed resources are available."
germany_transfer_prisoners_to_experiment_site_requirements_tt: "Requires wartime Nazi authority, a radical mandate, and an authorized Mengele program."
germany_transfer_prisoners_to_experiment_site_source_tt: "The administration takes people from the occupied district that has been held longest. Current source: [This.GetCampOccManualSourceName]. A district with too few people left for a transport, or with unresolved transfer records, cannot be used. People from France cannot be taken before late March 1942, from the Netherlands before mid-July 1942, from Belgium before early August 1942, from Norway before late October 1942, from Greece before mid-March 1943, or from Denmark before October 1943."
germany_transfer_prisoners_to_experiment_site_destination_tt: "Auschwitz must be controlled, operating as a supported killing center, and able to receive at least one transport order under its capacity, population and custody records."
camp_occ_manual_no_source: "No eligible occupied source"
germany_transfer_prisoners_to_experiment_site_effect_tt: "When the transport arrives, the listed costs are paid and evidence for future tribunals grows. Deaths on arrival are recorded at Auschwitz against the original authority; the transport itself records no death."
genocide_requires_security_command_power_tt: "Requires £command_power §Y[?global.black_friday_price_genocide_decision_cost_security_command_power|0]§!."
genocide_requires_deportation_command_power_tt: "Requires £command_power §Y[?global.black_friday_price_genocide_decision_cost_deportation_command_power|0]§!."
genocide_requires_extermination_resources_tt: "Requires £army_experience §Y[?global.black_friday_price_genocide_decision_cost_extermination_army_experience|0]§! and £command_power §Y[?global.black_friday_price_genocide_decision_cost_extermination_command_power|0]§!."
genocide_requires_rail_army_xp_tt: "Requires £army_experience §Y[?global.black_friday_price_genocide_decision_cost_rail_army_experience|0]§!."
genocide_requires_records_command_power_tt: "Requires £command_power §Y[?global.black_friday_price_genocide_decision_cost_records_command_power|0]§!."
genocide_requires_gulag_resources_tt: "Requires £pol_power §Y[?global.black_friday_price_genocide_decision_cost_build_gulag|0]§! and £command_power §Y[?global.black_friday_price_genocide_decision_cost_gulag_command_power|0]§!."
genocide_requires_gulag_army_xp_tt: "Requires £army_experience §Y[?global.black_friday_price_genocide_decision_cost_gulag_army_experience|0]§!."
genocide_intensify_deportations: "Intensify Deportations"
genocide_intensify_deportations_desc: "Increase deportation sweeps feeding the camp system. This raises escalation, visibility, resistance pressure, and hidden deaths."
genocide_hide_evidence_from_foreign_observers: "Hide Evidence from Foreign Observers"
genocide_hide_evidence_from_foreign_observers_desc: "Reduce visible traces through record control, restricted inspections, and diplomatic denial. This slows exposure but does not erase state responsibility."
genocide_suppress_internal_reports: "Suppress Internal Reports"
genocide_suppress_internal_reports_desc: "Seal internal death counts, transfer files, and military objections before they become testimony."
genocide_redirect_trains_and_supplies: "Redirect Trains and Supplies"
genocide_redirect_trains_and_supplies_desc: "Give the camp system rail priority and extract more forced labor output from an active camp state, damaging the wider war economy."
genocide_deal_with_resistance_sabotage: "Crush Camp Sabotage"
genocide_deal_with_resistance_sabotage_desc: "Use security forces against resistance cells targeting the camp system. This restores control at the cost of deaths, resistance pressure, and additional hidden atrocity records."
genocide_handle_refugee_waves: "Handle Refugee Waves"
genocide_handle_refugee_waves_desc: "Push border offices and occupation authorities to contain refugee movement created by camp rumors and forced transfers."
genocide_manage_military_objections: "Manage Military Objections"
genocide_manage_military_objections_desc: "Silence staff officers objecting to rail diversions, guard detachments, and paperwork that could become evidence."
genocide_destroy_camp_evidence: "Destroy Camp Evidence in [FROM.GetName]"
genocide_destroy_camp_evidence_desc: "Attempt to destroy records, infrastructure, and witnesses in [FROM.GetName] before enemy forces arrive. Success reduces later condemnation but creates additional deaths. Failure makes discovery worse."
genocide_cover_up_liberated_camps: "Contest Liberated Camp Records"
genocide_cover_up_liberated_camps_desc: "Use embassies, surviving archives, and friendly newspapers to dispute discovered records after a camp site has been liberated."

japan_expand_forced_labor_camps: "Expand Forced Labor Camps in [FROM.GetName]"
japan_expand_forced_labor_camps_desc: "Expand Japanese forced labor infrastructure in [FROM.GetName], tying the site to the same discovery and condemnation system as other camp networks."
japan_conduct_anti_partisan_reprisals: "Conduct Anti-Partisan Reprisals in [FROM.GetName]"
japan_conduct_anti_partisan_reprisals_desc: "Use occupation forces for reprisals in [FROM.GetName]. The action creates hidden deaths and leaves discoverable evidence even when no formal camp building exists."
japan_transfer_prisoners_to_experimental_facilities: "Transfer Prisoners to Experimental Facilities"
japan_transfer_prisoners_to_experimental_facilities_desc: "Move prisoners from [FROM.GetName] into experimental chains connected to Japan's biological warfare capacity. The action creates deaths and can trigger a local contamination outbreak."
japan_destroy_occupation_records: "Destroy Occupation Records in [FROM.GetName]"
japan_destroy_occupation_records_desc: "Attempt to destroy occupation atrocity records and camp evidence in [FROM.GetName] before the state is lost."

sov_expand_gulag_network: "Expand Gulag Network in [FROM.GetName]"
sov_expand_gulag_network_desc: "Create or expand a gulag labor camp network in [FROM.GetName], adding hidden deaths, resistance pressure, and discoverable state evidence."
sov_expand_gulag_network_effect_tt: "Creates a gulag network in [FROM.GetName], adding hidden deaths, resistance pressure, and discoverable state evidence."
sov_gulag_network_cost: "£pol_power §Y[?global.black_friday_price_genocide_decision_cost_build_gulag|0]§! £command_power §Y[?global.black_friday_price_genocide_decision_cost_gulag_command_power|0]§!"
sov_gulag_network_cost_blocked: "£pol_power §R10§! £command_power §R5§!"
sov_gulag_network_cost_tooltip: "£pol_power §Y10§! £command_power §Y5§!"
sov_deport_suspected_opposition_groups: "Deport Suspected Opposition Groups"
sov_deport_suspected_opposition_groups_desc: "Use security organs to deport suspected opposition groups from [FROM.GetName] into the camp system."
sov_deport_suspected_opposition_groups_effect_tt: "Creates hidden deaths and repression evidence in [FROM.GetName]."
sov_confiscate_food_from_disloyal_regions: "Confiscate Food from Disloyal Regions"
sov_confiscate_food_from_disloyal_regions_desc: "Strip supplies from [FROM.GetName] in the name of political control, creating famine pressure and discoverable repression evidence."
sov_confiscate_food_from_disloyal_regions_effect_tt: "Creates famine pressure, hidden deaths, and discoverable repression evidence in [FROM.GetName]."
sov_purge_camp_administrators: "Purge Camp Administrators in [FROM.GetName]"
sov_purge_camp_administrators_desc: "Use security organs against local camp administrators and suspected nationalist organizers in [FROM.GetName]."
sov_purge_camp_administrators_effect_tt: "Creates hidden deaths, sabotage pressure, and discoverable repression evidence in [FROM.GetName]."
sov_raise_forced_labor_quotas: "Raise Forced Labor Quotas in [FROM.GetName]"
sov_raise_forced_labor_quotas_desc: "Increase labor quotas around [FROM.GetName]'s gulag system, binding local industry and security offices more tightly to Moscow's demands."
sov_raise_forced_labor_quotas_effect_tt: "Raises forced-labor exploitation and hidden deaths in [FROM.GetName]."
sov_destroy_gulag_records: "Destroy Gulag Records in [FROM.GetName]"
sov_destroy_gulag_records_desc: "Attempt to destroy gulag records and infrastructure in [FROM.GetName] before hostile forces uncover them."
sov_destroy_gulag_records_effect_tt: "Attempts to destroy gulag records and infrastructure in [FROM.GetName]."

genocide_publicize_survivor_testimony: "Publicize Survivor Testimony Against [FROM.GetNameDef]"
genocide_publicize_survivor_testimony_desc: "Publish survivor testimony and recovered evidence from [FROM.GetNameDef]'s camp system, increasing diplomatic pressure and war support."
genocide_support_resistance_networks: "Support Resistance Networks in [FROM.GetNameDef]"
genocide_support_resistance_networks_desc: "Support resistance groups targeting [FROM.GetNameDef]'s camp infrastructure and occupation records."
genocide_prepare_tribunal_records: "Prepare Tribunal Records Against [FROM.GetNameDef]"
genocide_prepare_tribunal_records_desc: "Organize survivor statements, captured documents, and diplomatic files for a future tribunal against [FROM.GetNameDef]."

bio_activate_surveillance_network_cost_tooltip: "Spend £pol_power §Y[GetBioValueSurveillancePp]§!, £cbrn_instruments_texticon §Y[GetBioValueSurveillanceInstruments]§!, and £support_equipment_text_icon §Y[GetBioValueSurveillanceSupport]§!. Commit £medical_capacity_texticon §Y[GetBioValueSurveillanceCapacity]§! until the network stands down. Requires £GFX_motorized_equipment_text_icon §Y[GetBioValueSurveillanceTrucks]§! on hand; trucks are not consumed."

