# Chaos Redux Decisions
chaosx_decision_category: "Chaos Redux"

chaosx_cbw_doom_category: "Doomsday Protocols"
chaosx_cbw_doom_category_desc: "Last-resort releases of chemical and biological stockpiles, intended for desperate situations."

chem_unleash_stockpiled_cylinders: "Unleash Stockpiled Cylinders"
chem_unleash_stockpiled_cylinders_desc: "In desperation, we can release our remaining chemical stockpiles across every eligible controlled state. The shared CBRN response accounts for protection and exposure conditions, then records disruption, deaths, contamination, medical saturation, evidence, attribution, and Condemnation.\n\n§RThis consumes all chemical cylinders in our stockpile.§!"
chem_unleash_stockpiled_cylinders_tt: "Uses the shared CBRN action pipeline to resolve protection-adjusted §Yorganisation§! and §Ystrength§! damage, deaths, §YChemical Contamination§!, medical saturation, evidence, attribution, and Condemnation in every eligible controlled state.\n\n§RAll chemical cylinder stockpiles are consumed.§!"
cbrn_chemical_doomsday_policy_tt: "Requires the §YUnrestricted Chaos Warfare§! use policy. The release still records evidence, attribution, deaths, contamination, medical saturation, confirmed use, and Condemnation."
cbrn_chemical_doomsday_target_tt: "Requires at least one controlled state with a positive native population value."

bio_unleash_stockpiled_pathogens: "Unleash Stockpiled Pathogens"
bio_unleash_stockpiled_pathogens_desc: "In the final collapse of state authority, the arsenal can be opened across our own territory and the enemy-held border. Anthrax, plague, tularemia, and smallpox will incubate as distinct outbreaks before their full human and military cost becomes visible.\n\nThe release is public, impossible to contain within political borders, and certain to expose our responsibility. Allied territory and our own population remain at extreme risk.\n\n§RThis consumes every biological payload in the national stockpile.§!"
bio_unleash_stockpiled_pathogens_tt: "Consumes the complete national reserve of §YAnthrax§!, §YPlague§!, §YTularemia§!, and §YSmallpox§! payloads. Every payload unit is assigned to an eligible controlled state or adjacent enemy-held border state. Each affected state records its own incubation, detection, spread, deaths, contamination, medical strain, evidence, and attribution.\n\nEvidence begins at its maximum and responsibility is confirmed. The release causes an extreme public §RCondemnation§! consequence, treaty breach, and domestic war-support loss.\n\n§RThere is no payload refund, safe domestic zone, or protection for allied populations reached by subsequent spread.§!"
bio_doomsday_route_or_policy_tt: "Has an §Yexplicit unrestricted CBRN route§! or the §YUnrestricted Chaos Warfare§! use policy"
bio_doomsday_last_resort_tt: "Is near capitulation or the world has entered a terminal collapse condition"
bio_doomsday_arsenal_tt: "Has at least one §YAnthrax§!, §YPlague§!, §YTularemia§!, or §YSmallpox§! payload"
bio_doomsday_target_tt: "Has at least one eligible controlled state or adjacent enemy-held border state"
bio_doomsday_domestic_warning_header_tt: "§RThe following controlled states are inside the domestic release zone:§!"
bio_doomsday_domestic_state_at_risk_tt: "§R[THIS.GetName]§!"
bio_doomsday_no_domestic_states_tt: "§YNo eligible controlled state is currently inside the domestic release zone.§!"
bio_doomsday_front_and_allied_spread_warning_tt: "§RAll eligible adjacent enemy-held border states are also targeted. Connected spread can cross into allied territory and back into the releasing country's population.§!"

chaosx_zzz_cure_category: "Fighting the Zombie Outbreak"
