smallpox_vaccination_mass_program: "National Smallpox Vaccination Program"
smallpox_vaccination_mass_program_desc: "Undertake broad vaccination against Smallpox, the only severe ordinary biological weapon. The long program consumes equipment, commits national Medical Capacity, and imposes a major continuing civilian burden."
smallpox_vaccination_mass_program_cost: "£support_equipment_text_icon §Y[?constant:bio_countermeasure_cost.vaccination_support|0]§! £GFX_motorized_equipment_text_icon §Y[?constant:bio_countermeasure_cost.vaccination_trucks|0]§! §Y[?constant:bio_countermeasure_cost.vaccination_instruments|0] CBRN Instruments§! §Y[?constant:bio_countermeasure_capacity.vaccination_medical_commitment|0] Medical Capacity§!"
smallpox_vaccination_mass_program_cost_blocked: "Requires £support_equipment_text_icon §R[?constant:bio_countermeasure_cost.vaccination_support|0]§!, £GFX_motorized_equipment_text_icon §R[?constant:bio_countermeasure_cost.vaccination_trucks|0]§!, §R[?constant:bio_countermeasure_cost.vaccination_instruments|0] CBRN Instruments§!, and §R[?constant:bio_countermeasure_capacity.vaccination_medical_commitment|0] Medical Capacity§!."
smallpox_vaccination_mass_program_available_tt: "Requires Integrated Epidemic Control, a detected domestic outbreak, publicly confirmed Smallpox use, or a known domestic Smallpox capability, an inactive vaccination program, §Y[?constant:bio_countermeasure_capacity.vaccination_medical_commitment|0] uncommitted Medical Capacity§!, and the listed stores."
smallpox_vaccination_mass_program_effect_tt: "Consume the listed equipment and commit §Y[?constant:bio_countermeasure_capacity.vaccination_medical_commitment|0] Medical Capacity§!. After §Y[?constant:bio_countermeasure_timing.vaccination_activation_days|0] days§!, activate national Smallpox vaccination, sharply reducing Smallpox growth, spread, and deaths at a §R[?constant:bio_countermeasure_idea.smallpox_consumer_goods|%0] Consumer Goods§! and §R[?constant:bio_countermeasure_idea.smallpox_political_power|%0] Political Power Gain§! burden."
revoke_smallpox_vaccination_mass_program: "End National Smallpox Vaccination"
revoke_smallpox_vaccination_mass_program_desc: "End the continuing vaccination program and return its medical teams to the national reserve. The population will lose its strongest protection against Smallpox."
revoke_smallpox_vaccination_mass_program_available_tt: "Requires an active National Smallpox Vaccination Program."
revoke_smallpox_vaccination_mass_program_effect_tt: "After §Y[?constant:bio_countermeasure_timing.vaccination_shutdown_days|0] days§!, remove national Smallpox vaccination and restore its committed §G[?constant:bio_countermeasure_capacity.vaccination_medical_commitment|0] Medical Capacity§!."
bio_request_international_medical_mission: "Request International Mission for [FROM.GetName]"
bio_request_international_medical_mission_desc: "Invite foreign medical observers and relief teams into §Y[FROM.GetName]§!. A mission improves surveillance, containment, and treatment while creating a transparent evidence record. A government hiding biological stockpiles risks exposing its own program."
bio_request_international_medical_mission_cost: "£support_equipment_text_icon §Y[?constant:bio_countermeasure_cost.international_mission_support|0]§! £GFX_motorized_equipment_text_icon §Y[?constant:bio_countermeasure_cost.international_mission_trucks|0]§! §Y[?constant:bio_countermeasure_cost.international_mission_instruments|0] CBRN Instruments§! §Y[?constant:bio_countermeasure_capacity.international_mission_medical_commitment|0] Medical Capacity§!"
bio_request_international_medical_mission_cost_blocked: "Requires active inspection or observer access, an allied relationship, or an outward guarantee connection, plus £support_equipment_text_icon §R[?constant:bio_countermeasure_cost.international_mission_support|0]§!, £GFX_motorized_equipment_text_icon §R[?constant:bio_countermeasure_cost.international_mission_trucks|0]§!, §R[?constant:bio_countermeasure_cost.international_mission_instruments|0] CBRN Instruments§!, and §R[?constant:bio_countermeasure_capacity.international_mission_medical_commitment|0] Medical Capacity§!."
bio_request_international_medical_mission_available_tt: "Requires a controlled selected state with a detected ordinary outbreak and no international mission underway, qualifying inspection, observer, allied, or outward-guarantee access, a cooperative Condemnation route, §Y[?constant:bio_countermeasure_capacity.international_mission_medical_commitment|0] uncommitted Medical Capacity§!, and the listed stores."
bio_request_international_medical_mission_effect_tt: "Consume the listed equipment and commit §Y[?constant:bio_countermeasure_capacity.international_mission_medical_commitment|0] Medical Capacity§! now. After §Y[?constant:bio_countermeasure_timing.international_mission_deployment_days|0] days§!, add §G[?constant:bio_countermeasure_response.international_surveillance_add|0] Surveillance§!, §G[?constant:bio_countermeasure_response.international_containment_add|0] Containment§!, and §G[?constant:bio_countermeasure_response.international_medical_add|0] Medical Response§! in §Y[FROM.GetName]§! if the outbreak remains active. A failed deployment restores the reserved capacity, but Political Power, equipment, and supplies already spent are not refunded. A successful mission strengthens outbreak evidence, weakens concealment, grants Condemnation compliance credit, and may expose a real hidden biological stockpile."
bio_sustain_containment: "Sustain Containment in [FROM.GetName]"
bio_sustain_containment_desc: "Maintain the quarantine, medical deployment, national Medical Capacity, and supply flow around §Y[FROM.GetName]§!. Full success requires the outbreak's maximum intensity to fall without any new outbound spread while quarantine and a field hospital or international mission remain active. A weaker cordon can produce partial success if spread is stopped and intensity does not rise. Loss of control, exhausted reserves, new spread, or higher intensity produces failure and worsens the local outbreak."
