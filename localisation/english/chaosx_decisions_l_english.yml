	# Fighting Communism Spread Decisions
chaosx_communism_fight_category: "Communist Insurgency"
chaosx_communism_fight_category_desc: "Communist influence is spreading through controlled states. Each controlled state strengthens daily communist support, while higher control levels create stronger local disruption, worsen the longer they persist, and increase the risk of open revolt."
