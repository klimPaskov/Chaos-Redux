bio_expand_medical_capacity.cost.sale_blocked: "£pol_power §R[?black_friday_bio_expand_medical_pp_cost|.0]§!  £support_equipment_text_icon §R[?black_friday_bio_expand_medical_support_cost|.0]§!  £GFX_motorized_equipment_text_icon §R[?black_friday_bio_expand_medical_truck_cost|.0]§!"
bio_expand_medical_capacity.cost.evolution_blocked: "£pol_power §R[?black_friday_bio_expand_medical_pp_cost|.0]§!  £support_equipment_text_icon §R[?black_friday_bio_expand_medical_support_cost|.0]§!  £GFX_motorized_equipment_text_icon §R[?black_friday_bio_expand_medical_truck_cost|.0]§!"
bio_expand_medical_capacity_cost_blocked: "[GetBlackFridayBioExpandMedicalCapacityCostBlocked]"
bio_expand_medical_capacity_cost_tooltip: "Pay [GetBlackFridayBioExpandMedicalCapacityCost] when selected. An incomplete payment returns the resources already spent."
bio_expand_medical_capacity_available_tt: "Requires Field Hospital training and room for another national Medical Capacity expansion."
bio_expand_medical_capacity_effect_tt: "After §Y[GetBioValueCapacityInvestmentDays] days§!, gain §G[GetBioValueMedicalInvestmentGain] Medical Capacity§!."
bio_expand_biosecurity_capacity: "Expand Biological Security Capacity"
bio_expand_biosecurity_capacity_desc: "Issue detection instruments and support stores to laboratory security and epidemiological teams. The investment takes §Y[GetBioValueCapacityInvestmentDays] days§! and adds §G[GetBioValueBiosecurityInvestmentGain] Biological Security§! on completion."
bio_expand_biosecurity_capacity_cost: "£pol_power §Y[GetBioValueBiosecurityInvestmentPp]§!  £cbrn_instruments_texticon §Y[GetBioValueBiosecurityInvestmentInstruments]§!  £support_equipment_text_icon §Y[GetBioValueBiosecurityInvestmentSupport]§!"
bio_expand_biosecurity_capacity_cost_blocked: "£pol_power §R[GetBioValueBiosecurityInvestmentPp]§!  £cbrn_instruments_texticon §R[GetBioValueBiosecurityInvestmentInstruments]§!  £support_equipment_text_icon §R[GetBioValueBiosecurityInvestmentSupport]§!"
bio_expand_biosecurity_capacity_available_tt: "Requires Chemical Detection Paper, either Biological Surveillance Networks or Pathogen Handling Protocols, room for another Biological Security expansion, and the listed stores."
bio_expand_biosecurity_capacity_effect_tt: "After §Y[GetBioValueCapacityInvestmentDays] days§!, gain §G[GetBioValueBiosecurityInvestmentGain] Biological Security§!."
bio_activate_surveillance_network: "Activate Bio Surveillance"
bio_activate_surveillance_network_desc: "Link laboratories, hospitals, field epidemiologists, and military reporting offices into a standing warning network. Earlier detection improves containment and preserves stronger evidence of the agent and its source."
bio_activate_surveillance_network_cost: "£pol_power §Y[GetBioValueSurveillancePp]§!  £cbrn_instruments_texticon §Y[GetBioValueSurveillanceInstruments]§!  £support_equipment_text_icon §Y[GetBioValueSurveillanceSupport]§!"
bio_activate_surveillance_network_cost_blocked: "£pol_power §R[GetBioValueSurveillancePp]§!  £cbrn_instruments_texticon §R[GetBioValueSurveillanceInstruments]§!  £support_equipment_text_icon §R[GetBioValueSurveillanceSupport]§!"
bio_activate_surveillance_network_available_tt: "Requires Biological Surveillance Networks, an inactive national network, and £GFX_motorized_equipment_text_icon §Y[GetBioValueSurveillanceTrucks]§! trucks on hand. The trucks remain in the stockpile."
bio_activate_surveillance_network_effect_tt: "After §Y[GetBioValueSurveillanceDays] days§!, the network adds §G[GetBioValueSurveillanceResponse] Surveillance§! and strengthens evidence recovered when an agent is detected."
bio_stand_down_surveillance_network: "Stand Down Bio Surveillance"
bio_stand_down_surveillance_network_desc: "Dismantle the permanent warning network and return its committed medical teams to the national reserve. Detection will become slower and the evidence trail weaker."
bio_stand_down_surveillance_network_available_tt: "Requires an active Biological Surveillance Network."
bio_stand_down_surveillance_network_effect_tt: "After §Y[GetBioValueSurveillanceStandDownDays] days§!, remove the surveillance network and restore its committed §G[GetBioValueSurveillanceCapacity] Medical Capacity§!."
deploy_field_hospitals: "Field Hospitals: [FROM.GetName]"
deploy_field_hospitals_desc: "Send mobile hospitals, laboratories, and transport columns to the detected outbreak in §Y[FROM.GetName]§!. Deployment consumes equipment and reserves Medical Capacity immediately so concurrent responses cannot spend the same teams twice."
deploy_field_hospitals_cost: "£pol_power §Y[GetBioValueFieldHospitalPp]§!  £support_equipment_text_icon §Y[GetBioValueFieldHospitalSupport]§!  £GFX_motorized_equipment_text_icon §Y[GetBioValueFieldHospitalTrucks]§!"
deploy_field_hospitals_cost_blocked: "£pol_power §R[GetBioValueFieldHospitalPp]§!  £support_equipment_text_icon §R[GetBioValueFieldHospitalSupport]§!  £GFX_motorized_equipment_text_icon §R[GetBioValueFieldHospitalTrucks]§!"
deploy_field_hospitals_available_tt: "Requires Field Hospital training, a controlled state with a detected outbreak, no deployment underway, and £cbrn_instruments_texticon §Y[GetBioValueFieldHospitalInstruments]§! instruments on hand. The instruments are not consumed."
deploy_field_hospitals_effect_tt: "After §Y[GetBioValueFieldHospitalDays] days§!, deploy hospitals in §Y[FROM.GetName]§! if the outbreak remains eligible. Otherwise, the committed medical teams return to the national reserve."
quarantine_measures: "Quarantine [FROM.GetName]"
quarantine_measures_desc: "Seal roads, police population movement, and divert local production in §Y[FROM.GetName]§!. Quarantine slows local growth and cross-state spread, improves detection, and creates hardship, resistance pressure, and economic disruption."
quarantine_measures_cost: "£pol_power §Y[GetBioValueQuarantinePp]§!  £command_power §Y[GetBioValueQuarantineCommandPower]§!  £manpower_texticon §Y[GetBioValueQuarantineManpower]§!"
quarantine_measures_cost_blocked: "£pol_power §R[GetBioValueQuarantinePp]§!  £command_power §R[GetBioValueQuarantineCommandPower]§!  £manpower_texticon §R[GetBioValueQuarantineManpower]§!"
quarantine_measures_available_tt: "Requires a controlled state with a detected outbreak, no quarantine deployment underway, £support_equipment_text_icon §Y[GetBioValueQuarantineSupport]§! support equipment and £infantry_equipment_text_icon §Y[GetBioValueQuarantineInfantry]§! infantry equipment on hand. Those stocks are not consumed."
quarantine_measures_effect_tt: "After §Y[GetBioValueQuarantineDays] days§!, establish quarantine in §Y[FROM.GetName]§! if the outbreak remains active. The local cordon strains production and raises resistance while slowing infection and spread."
close_border_to_infected_neighbor: "Close Border: [FROM.GetNameDef]"
close_border_to_infected_neighbor_desc: "Seal the border with §Y[FROM.GetNameDef]§! while disease is active near the frontier. The closure blocks market access and volunteer deployment across this exact relationship and reduces, but cannot eliminate, cross-border spread."
close_border_to_infected_neighbor_available_tt: "Requires an open border with the selected neighboring country and an active outbreak near that exact frontier."
close_border_to_infected_neighbor_effect_tt: "Record an exact bilateral disease-control closure with §Y[FROM.GetNameDef]§!, block market access and volunteer deployment, and reduce outbreak spread across that border."
reopen_border_to_infected_neighbor: "Reopen Border: [FROM.GetNameDef]"
reopen_border_to_infected_neighbor_desc: "Withdraw our exact disease-control closure with §Y[FROM.GetNameDef]§!. Any closure retained by the other government remains in force."
reopen_border_to_infected_neighbor_available_tt: "Requires an existing national disease-control closure with the selected neighboring country."
reopen_border_to_infected_neighbor_effect_tt: "Remove our recorded disease-control closure with §Y[FROM.GetNameDef]§!. When no other national closure remains, unregister our market and volunteer restrictions."
bio_border_closure_usage_desc: "Border closed for biological containment"
develop_antibiotics_retroactively: "Emergency Antibiotics: [GetBioAntibioticResearchAgent]"
develop_antibiotics_retroactively_desc: "Divert research teams to find a reliable [GetBioAntibioticResearchAgent] treatment protocol. The effort slows other research for §Y[GetBioValueAntibioticDevelopmentDays] days§! before production can begin. Other threats follow one at a time."
develop_antibiotics_retroactively_available_tt: "Requires a pathogen with a detected domestic outbreak, publicly confirmed use, or a known domestic capability, and no antibiotic research completed or underway for it."
develop_antibiotics_retroactively_effect_tt: "Begin a §Y[GetBioValueAntibioticDevelopmentDays]-day§! emergency program that changes Research Speed by §R[GetBioAntibioticResearchSlowdown]§! and unlocks [GetBioAntibioticResearchAgent] antibiotics production when complete."
antibiotics_mass_production: "Antibiotics Production: [GetBioAntibioticProductionAgent]"
antibiotics_mass_production_desc: "Maintain national industrial stores of [GetBioAntibioticProductionAgent] antibiotics. Production imposes a consumer-goods burden and enables exact-state courses against detected outbreaks."
antibiotics_mass_production_available_tt: "Requires completed antibiotic research for a pathogen that still threatens the country and has no production line running or being set up."
antibiotics_mass_production_effect_tt: "After §Y[GetBioValueAntibioticProductionDays] days§!, open a [GetBioAntibioticProductionAgent] antibiotics line at a §R[GetBioAntibioticConsumerGoods] Consumer Goods§! burden."
revoke_antibiotics_mass_production: "End Antibiotics Production"
revoke_antibiotics_mass_production_desc: "Wind down production lines for pathogens with no detected outbreak. Courses already in transit and active treatment services continue under their existing commitments, but no new courses can be dispatched."
revoke_antibiotics_mass_production_available_tt: "Requires an antibiotics line for a pathogen with no detected domestic outbreak."
revoke_antibiotics_mass_production_effect_tt: "After §Y[GetBioValueAntibioticShutdownDays] days§!, close every antibiotics line whose pathogen has no detected outbreak."
bio_distribute_antibiotics: "Antibiotics for [FROM.GetName]"
bio_distribute_antibiotics_desc: "Dispatch a treatment course for every detected outbreak in §Y[FROM.GetName]§! that has an antibiotics line. Repeated emergency courses during the same episode have diminishing effectiveness."
bio_distribute_antibiotics_available_tt: "Requires an antibiotics line for a detected outbreak in a controlled state, no course in transit or on cooldown, fewer than §Y[GetBioValueAntibioticMaximumCourses]§! prior courses this episode, and room for a medical team if the state has none."
bio_distribute_antibiotics_effect_tt: "After §Y[GetBioValueAntibioticDistributionDays] days§!, deliver a treatment course for each covered outbreak and begin a §Y[GetBioValueAntibioticCooldownDays]-day§! cooldown if it remains eligible. Medical teams return when no supported course remains."
bio_antibiotic_agent_plague: "Plague"
bio_antibiotic_agent_anthrax: "Anthrax"
bio_antibiotic_agent_tularemia: "Tularemia"
bio_antibiotic_agent_none: "Pathogen"
bio_antibiotic_value_none: "0"
