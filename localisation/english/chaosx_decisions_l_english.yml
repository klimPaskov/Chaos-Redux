bio_activate_surveillance_network_available_tt: "Requires Biological Surveillance Networks, an inactive national network, and £GFX_motorized_equipment_text_icon §Y[GetBioValueSurveillanceTrucks]§! trucks on hand. The trucks remain in the stockpile."
bio_activate_surveillance_network_effect_tt: "After §Y[GetBioValueSurveillanceDays] days§!, the network adds §G[GetBioValueSurveillanceResponse] Surveillance§! and strengthens evidence recovered when an agent is detected."
bio_stand_down_surveillance_network: "Stand Down Bio Surveillance"
bio_stand_down_surveillance_network_desc: "Dismantle the permanent warning network and return its committed medical teams to the national reserve. Detection will become slower and the evidence trail weaker."
bio_stand_down_surveillance_network_available_tt: "Requires an active Biological Surveillance Network."
bio_stand_down_surveillance_network_effect_tt: "After §Y[GetBioValueSurveillanceStandDownDays] days§!, remove the surveillance network and restore its committed §G[GetBioValueSurveillanceCapacity] Medical Capacity§!."
deploy_field_hospitals: "Field Hospitals: [FROM.GetName]"
deploy_field_hospitals_desc: "Send mobile hospitals, laboratories, and transport columns to the detected outbreak in §Y[FROM.GetName]§!. Deployment consumes equipment and reserves Medical Capacity immediately so concurrent responses cannot spend the same teams twice."
deploy_field_hospitals_cost: "£pol_power §Y[GetBioValueFieldHospitalPp]§!  £support_equipment_text_icon §Y[GetBioValueFieldHospitalSupport]§!  £GFX_motorized_equipment_text_icon §Y[GetBioValueFieldHospitalTrucks]§!"
