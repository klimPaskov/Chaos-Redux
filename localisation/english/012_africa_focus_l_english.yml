l_english:
# Event 12 continental focus tree
africa_continental_focus_tree: "The African Continental Charter"
africa_continental_focus_tree_desc: "A protection-first continental programme turns a proven host mandate into shared institutions, regional settlements, and a constitutional order that must earn the consent of its members."

# Charter federalism
africa_federal_representation_before_merger: "Representation Before Union"
africa_federal_representation_before_merger_desc: "Member governments must receive a protected voice before any deeper union. This federal commitment strengthens consent and makes representation the price of continental authority."
africa_federal_equal_member_chamber: "A Chamber of Equal Members"
africa_federal_equal_member_chamber_desc: "Every member receives an equal seat in one federal chamber. Smaller governments gain protection, while populous members must accept limits on their influence."
africa_federal_population_chamber: "Representation by Population"
africa_federal_population_chamber_desc: "A population chamber gives larger societies greater influence over federal policy. Its authority will be balanced by safeguards for members that cannot prevail through numbers alone."
africa_federal_balanced_two_chambers: "Two Chambers, One Federation"
africa_federal_balanced_two_chambers_desc: "An equal-member chamber and a population chamber will share federal lawmaking. The arrangement demands more administration, but gives the centre a durable constitutional base."
africa_federal_reconcile_the_chambers: "Reconcile the Chambers"
africa_federal_reconcile_the_chambers_desc: "The two chambers need rules for budgets, defence, and disputed bills. A negotiated procedure protects member consent when their majorities disagree."
africa_federal_protected_member_rights: "Rights of the Protected Member"
africa_federal_protected_member_rights_desc: "Local law, education, security, and revenue shares will receive federal protection. These guarantees restrain the centre and make later membership offers more credible."
africa_federal_prove_member_rights: "Make the Rights Enforceable"
africa_federal_prove_member_rights_desc: "Written guarantees need a remedy when federal institutions break them. Appeals and public enforcement give the Charter authority without erasing member autonomy."
africa_federal_design_the_executive: "Design the Federal Executive"
africa_federal_design_the_executive_desc: "The federation needs an executive able to coordinate diplomacy and emergencies under defined limits. Clear responsibilities strengthen central capacity without granting unchecked rule."
africa_federal_contribution_and_equalisation: "Contribution and Equalisation"
africa_federal_contribution_and_equalisation_desc: "Members will contribute according to an agreed public settlement, while poorer and landlocked regions receive a fair claim on common projects."
africa_federal_deliver_equalisation: "Deliver the Equalisation Promise"
africa_federal_deliver_equalisation_desc: "Federal funds must reach regions that supplied neither the capital nor the largest revenues. Visible delivery raises regional equality and proves that the budget serves the whole union."
africa_federal_court_or_arbitration: "Court or Political Arbitration"
africa_federal_court_or_arbitration_desc: "Border, debt, and constitutional disputes need a recognised venue. Judicial review and negotiated arbitration give the federation authority without making force the ordinary answer."
africa_federal_common_command_under_law: "Common Command Under Law"
africa_federal_common_command_under_law_desc: "Member forces will coordinate through a federal command subject to civilian law. Supply and planning become stronger, while national armies retain protected obligations."
africa_federal_prove_civilian_command: "Prove Civilian Command"
africa_federal_prove_civilian_command_desc: "Officers and regional commands must obey the same civilian settlement they defend. Demonstrated restraint strengthens consent for deeper military cooperation."
africa_federal_conversion: "A Lawful Federal Conversion"
africa_federal_conversion_desc: "Protected and chartered members may be offered federal statehood, autonomous status, or continued association. Conversion must follow consent and administrative proof."
africa_federal_empower_regional_chambers: "Empower the Regional Chambers"
africa_federal_empower_regional_chambers_desc: "Regional chambers will review development, representation, and membership changes. Their authority checks domination by the host and gives distant regions a practical voice."
africa_federal_bind_host_to_charter: "Bind the Host to the Charter"
africa_federal_bind_host_to_charter_desc: "The founding government will submit its own administration and executive to federal law. The centre gains capacity because its rules apply at home as well as abroad."
africa_federal_deadlock_conference: "Convene the Deadlock Conference"
africa_federal_deadlock_conference_desc: "A blocked budget or constitutional measure cannot be settled by decree alone. The conference opens a public choice between compromise and institutional reconstruction."
africa_federal_accept_deadlock_compromise: "Accept the Federal Compromise"
africa_federal_accept_deadlock_compromise_desc: "Concessions to the chambers preserve the settlement and restore regional confidence. The federation accepts slower action in exchange for lawful agreement."
africa_federal_rewrite_deadlocked_institutions: "Rewrite the Deadlocked Institutions"
africa_federal_rewrite_deadlocked_institutions_desc: "A failed or partial conference requires revised procedures, representation, and executive limits. Institutional reconstruction restores authority at a greater political cost."
africa_federal_close_the_deadlock: "Close the Constitutional Deadlock"
africa_federal_close_the_deadlock_desc: "The host will carry the settlement into its own administration and end the remaining procedural dispute. Federal institutions can govern again without an indefinite emergency."
africa_federal_enforceable_limits: "A Federation With Enforceable Limits"
africa_federal_enforceable_limits_desc: "Rights, representation, command, and amendment rules bind every level of government. The federation gains lasting authority because its members can see and enforce the limits of the centre."

# Continental republic
africa_republic_civic_status_and_accession: "Citizenship and Accession"
africa_republic_civic_status_and_accession_desc: "The republic will connect membership to a public civic status rather than conquest. Common rights strengthen consent, while staged administration prevents citizenship from becoming an empty promise."
africa_republic_choose_political_vehicle: "Choose the Civic Vehicle"
africa_republic_choose_political_vehicle_desc: "A continental party, a coalition of parties, or a constitutional convention must carry the republican campaign beyond the host. Each offers a different balance of organisation and pluralism."
africa_republic_build_continental_party: "Build a Continental Party"
africa_republic_build_continental_party_desc: "A single organisation can campaign across borders and coordinate policy quickly. Regional representation must remain strong enough to keep the party from swallowing the republic."
africa_republic_coalition_of_parties: "A Coalition of Parties"
africa_republic_coalition_of_parties_desc: "Existing parties and liberation movements will form a continental coalition. Negotiation is slower, but the government gains capacity from institutions that already command local support."
africa_republic_nonpartisan_constitutional_convention: "A Nonpartisan Convention"
africa_republic_nonpartisan_constitutional_convention_desc: "Delegates will write the civic settlement outside any single party machine. The convention protects consent, though it must build public organisation before elections begin."
africa_republic_unite_the_civic_campaign: "Unite the Civic Campaign"
africa_republic_unite_the_civic_campaign_desc: "The chosen political vehicle will carry one campaign through towns, ports, and regional capitals. Its growing reach prepares the electorate without erasing local organisations."
africa_republic_design_the_franchise: "Design the Continental Franchise"
africa_republic_design_the_franchise_desc: "Voting rights and regional representation must reach populations far from the capital. A credible franchise strengthens equality and reduces the danger of boycotts."
africa_republic_design_the_executive: "Design the Republican Executive"
africa_republic_design_the_executive_desc: "Executive power will be organised for accountable government, succession, and wartime continuity. Clear limits improve capacity without surrendering the republic to personal rule."
africa_republic_build_public_service: "Build the Public Service"
africa_republic_build_public_service_desc: "Regional recruitment, election administration, translation, and public inspection will carry civic rights into daily government. The service earns consent by reaching beyond the host bureaucracy."
africa_republic_register_the_regions: "Register Every Region"
africa_republic_register_the_regions_desc: "Electoral and civil records will be built through regional institutions rather than copied from the capital. The republic gains reach where roads, languages, and local authority differ."
africa_republic_prove_public_service_reach: "Prove the Service Reaches"
africa_republic_prove_public_service_reach_desc: "Registration, courts, and public offices must function in several regions before the civic promise is credible. Successful delivery strengthens regional equality."
africa_republic_first_continental_election: "The First Continental Election"
africa_republic_first_continental_election_desc: "The electorate will judge the competing republican organisations. Regional access, confidence, and wartime conditions shape the result, which must be accepted or corrected through public procedure."
africa_republic_certify_contested_election: "Certify the Contested Election"
africa_republic_certify_contested_election_desc: "Observers, recounts, and constitutional review will settle a disputed result without transferring power by force. Certification restores consent when the evidence can sustain it."
africa_republic_call_regional_runoff: "Call a Regional Runoff"
africa_republic_call_regional_runoff_desc: "A partial or failed election will return disputed regions to the polls under stronger safeguards. The delay costs time but rebuilds a mandate beyond the capital."
africa_republic_seat_the_elected_government: "Seat the Elected Government"
africa_republic_seat_the_elected_government_desc: "The certified victors will form a government under the continental constitution. Regional offices receive a place in the transition instead of becoming prizes for the host."
africa_republic_settle_royal_institutions: "Settle the Place of the Crowns"
africa_republic_settle_royal_institutions_desc: "Kings, courts, and traditional authorities may retain cultural or protected local roles under civic law. Their settlement strengthens government while preventing hereditary privilege over citizens."
africa_republic_guard_under_law: "A Republican Guard Under Law"
africa_republic_guard_under_law_desc: "A defensive guard will protect elections and constitutional institutions under civilian command. Its loyalty belongs to the law rather than a party or president."
africa_republic_secure_peaceful_transfer: "Secure a Peaceful Transfer"
africa_republic_secure_peaceful_transfer_desc: "The republic must show that an elected government can leave office without civil conflict. A lawful transfer extends civic trust across the continent."
africa_republic_distribute_the_capital: "Distribute the Capital"
africa_republic_distribute_the_capital_desc: "Executive, judicial, military, and economic institutions will be shared among regions. Dispersal reduces host dominance and gives the republic a presence beyond one city."
africa_republic_submit_host_to_common_law: "Submit the Host to Common Law"
africa_republic_submit_host_to_common_law_desc: "The founding country will place its own executive and officials under the continental constitution. Equal application gives the republic stronger and more credible institutions."
africa_republic_accepted_beyond_capital: "A Republic Beyond the Capital"
africa_republic_accepted_beyond_capital_desc: "Elections, public service, regional acceptance, and peaceful transfer make the republic a continental government rather than a host project. Its mandate can endure a change of leaders."

# Council of Crowns
africa_crowns_recognise_living_crowns: "Recognise the Living Crowns"
africa_crowns_recognise_living_crowns_desc: "Recognition will follow functioning institutions, territory, and local support. Historical names alone cannot create a throne or claim authority over an unwilling population."
africa_crowns_precedence_without_supremacy: "Precedence Without Supremacy"
africa_crowns_precedence_without_supremacy_desc: "The recognised crowns need an order for ceremony and diplomacy that grants no house permanent rule over the others. Regional equality gives the council legitimacy."
africa_crowns_rotating_chair: "A Rotating Royal Chair"
africa_crowns_rotating_chair_desc: "The chair will pass among recognised houses and regions. Rotation slows command, but assures each crown that precedence cannot become annexation."
africa_crowns_first_among_equals: "First Among Equals"
africa_crowns_first_among_equals_desc: "One senior crown will chair diplomacy and urgent council business under strict limits. The arrangement strengthens authority while leaving every member sovereign."
africa_crowns_council_without_singular_crown: "No Singular Continental Crown"
africa_crowns_council_without_singular_crown_desc: "The council will govern collectively and leave administration to chartered institutions. Royal legitimacy survives without inventing one dynasty above Africa."
africa_crowns_settle_council_precedence: "Settle the Order of the Council"
africa_crowns_settle_council_precedence_desc: "The chosen precedence rules will define chairmanship, ceremony, and dispute procedure. A public settlement prevents seniority from becoming a permanent regional grievance."
africa_crowns_build_dual_chambers: "Build the Dual Chambers"
africa_crowns_build_dual_chambers_desc: "A chamber of crowns will sit beside civic, regional, and republican delegates. Neither body can claim the Charter without the consent of the other."
africa_crowns_prove_living_institutions: "Prove the Crowns Still Govern"
africa_crowns_prove_living_institutions_desc: "Recognised courts must administer real communities, obligations, and succession rules. Demonstrated public service gives the council authority that pageantry alone cannot supply."
africa_crowns_write_succession_law: "Write the Succession Law"
africa_crowns_write_succession_law_desc: "Regency, abdication, disputed succession, and removal under the Charter require a public settlement. The council will open a continental succession arbitration."
africa_crowns_accept_local_succession: "Respect Local Succession"
africa_crowns_accept_local_succession_desc: "Where a living institution can settle its own succession lawfully, the council will accept the result. Local authority strengthens regional equality and limits central interference."
africa_crowns_impose_continental_arbitration: "Impose Continental Arbitration"
africa_crowns_impose_continental_arbitration_desc: "A failed or disputed succession will be returned to a continental tribunal. The stronger remedy restores legitimacy, but asks local institutions to accept a wider judgment."
africa_crowns_close_succession_crisis: "Close the Succession Crisis"
africa_crowns_close_succession_crisis_desc: "The accepted succession settlement will enter the Charter and bind rival claimants. A settled order restores the council's ability to act."
africa_crowns_settle_land_court_community: "Land, Court, and Community"
africa_crowns_settle_land_court_community_desc: "Royal recognition will be separated from unchecked land and judicial privilege. Local consent and enforceable rights determine what each court may retain."
africa_crowns_define_royal_service: "Define Royal Service"
africa_crowns_define_royal_service_desc: "Crowns may contribute guards, envoys, schools, and regional mediation under common obligations. Service strengthens the regions without creating private continental armies."
africa_crowns_seat_the_republics: "Seat the Republics"
africa_crowns_seat_the_republics_desc: "Republican members will receive equal external standing and a protected civic voice. The council cannot become a monarchy-only bloc without breaking its own Charter."
africa_crowns_prove_republican_equality: "Prove Republican Equality"
africa_crowns_prove_republican_equality_desc: "A republic must be able to win a council dispute and keep its form of government. That proof gives the mixed order genuine authority."
africa_crowns_restore_without_coercion: "Restoration Without Coercion"
africa_crowns_restore_without_coercion_desc: "A viable crown may return through local institutions, consent, and a settled claim. Unsupported claimants receive cultural recognition or review rather than a throne imposed by force."
africa_crowns_prove_local_restoration_consent: "Prove Local Restoration Consent"
africa_crowns_prove_local_restoration_consent_desc: "Public support, functioning institutions, and accepted borders must sustain each restoration. The council will not treat foreign enthusiasm as local consent."
africa_crowns_seat_regional_crown_councils: "Seat Regional Crown Councils"
africa_crowns_seat_regional_crown_councils_desc: "Regional councils will group crowns, civic institutions, and neighbouring governments around local disputes. Their consent keeps royal politics from concentrating in the host court."
africa_crowns_subject_host_crown_to_charter: "The Host Crown Under Charter"
africa_crowns_subject_host_crown_to_charter_desc: "The founding crown or traditional authority must accept the same limits imposed on every recognised house. Equal restraint gives the council continental credibility."
africa_crowns_bound_by_charter: "Crowns Bound by the Charter"
africa_crowns_bound_by_charter_desc: "Succession boundaries, civic representation, and equal external obligations bind a plural council of crowns. Royal institutions survive because no single house owns the continental order."

# People's Union
africa_union_coalition_of_revolution: "A Coalition of Revolution"
africa_union_coalition_of_revolution_desc: "Workers, farmers, soldiers, liberation movements, and community councils will form the governing coalition. Its breadth raises consent and defines whose needs the Union must answer."
africa_union_settle_the_land: "Settle the Land"
africa_union_settle_the_land_desc: "Communal tenure, cooperatives, public farms, and protected smallholders require a settlement that keeps food moving. Central direction grows, but production and local consent remain binding tests."
africa_union_settle_resource_ownership: "Settle Resource Ownership"
africa_union_settle_resource_ownership_desc: "Mines, plantations, railways, and ports will pass into public, cooperative, or regional control through a declared settlement. Revenue must return to producing communities."
africa_union_choose_planning_scale: "Choose the Scale of Planning"
africa_union_choose_planning_scale_desc: "Continental priorities, regional plans, or sector compacts can direct production. The choice opens a public test between industrial mobilisation and food security."
africa_union_central_plan: "A Continental Plan"
africa_union_central_plan_desc: "One plan will coordinate transport, food, mining, and industry across the Union. Its reach depends on members accepting common priorities rather than receiving quotas without a voice."
africa_union_regional_plans: "Plans From the Regions"
africa_union_regional_plans_desc: "Regional congresses will set projects and negotiate their contributions to continental goals. Local knowledge strengthens capacity, though coordination demands persistent bargaining."
africa_union_sector_compacts: "Sector Compacts"
africa_union_sector_compacts_desc: "Workers, producers, and public services will organise separate compacts for transport, food, power, and resources. Shared rules protect regional equality across unequal economies."
africa_union_ratify_the_plan: "Ratify the Union Plan"
africa_union_ratify_the_plan_desc: "The chosen planning model will receive public targets, review procedures, and regional obligations. Ratification extends the Union's practical reach beyond declarations."
africa_union_party_and_councils: "Party and Councils"
africa_union_party_and_councils_desc: "Parties and local councils need rules for leadership, recall, audit, and dissent. The settlement protects mass participation from both bureaucratic monopoly and permanent fragmentation."
africa_union_prove_council_consent: "Prove Council Consent"
africa_union_prove_council_consent_desc: "Regional and workplace councils must approve a real common programme before central planners can speak for them. That proof strengthens the administration behind the Union."
africa_union_liberation_or_consolidation: "Liberation or Consolidation"
africa_union_liberation_or_consolidation_desc: "External liberation aid will be weighed against food, equipment, and reconstruction at home. The Union can keep both commitments only by respecting regional capacity."
africa_union_build_peoples_defence: "Build the People's Defence"
africa_union_build_peoples_defence_desc: "Territorial formations, trained cadres, and liberation veterans will defend the Union under its political settlement. Readiness grows through supply and organisation rather than mass recruitment alone."
africa_union_train_the_new_administration: "Train the New Administration"
africa_union_train_the_new_administration_desc: "Planners, engineers, teachers, and inspectors will be trained across the regions. Professional capacity must answer to the coalition instead of becoming a new privileged caste."
africa_union_prove_trained_administration: "Prove the Administration Works"
africa_union_prove_trained_administration_desc: "The new service must deliver a common programme outside the host before it can direct wider reforms. Practical success strengthens central capacity."
africa_union_prove_food_continuity: "Keep Food Moving"
africa_union_prove_food_continuity_desc: "Land reform and industrial mobilisation must preserve harvests, transport, and distribution. Food continuity protects regional confidence and prevents the plan from consuming its own base."
africa_union_prioritise_food_outcome: "Put Food First"
africa_union_prioritise_food_outcome_desc: "The planning settlement will protect agriculture and distribution before accelerating industry. The choice closes the immediate crisis through a delivered food programme."
africa_union_slow_industrial_targets: "Slow the Industrial Targets"
africa_union_slow_industrial_targets_desc: "A failed or partial plan will be corrected by reducing industrial demands and restoring essential supply. The retreat costs momentum but rebuilds governing consent."
africa_union_restore_food_industry_balance: "Restore the Food and Industry Balance"
africa_union_restore_food_industry_balance_desc: "Revised targets will connect farms, transport, workshops, and regional reserves. The administration gains capacity from a plan that can sustain both workers and producers."
africa_union_devolve_regional_plans: "Devolve the Regional Plans"
africa_union_devolve_regional_plans_desc: "Regional congresses will receive authority over local delivery within common social guarantees. Devolution corrects host concentration and strengthens equality."
africa_union_end_host_privilege: "End the Host's Privilege"
africa_union_end_host_privilege_desc: "Factories, offices, and planning authority will be distributed beyond the founding country. The Union gains reach by serving regions that did not write its first programme."
africa_union_through_social_institutions: "Union Through Social Institutions"
africa_union_through_social_institutions_desc: "Land, labour, resources, food, and representation rest on functioning continental institutions. The People's Union gains authority through reliable public delivery."

# Military continentalism
africa_command_define_the_mandate: "Define the Continental Mandate"
africa_command_define_the_mandate_desc: "Military authority will receive a public purpose, legal source, and expected end. Clear obligations raise readiness, while permanent command carries a political price."
africa_command_general_staff_or_regions: "Staff or Regional Commands"
africa_command_general_staff_or_regions_desc: "The armies need a central staff, autonomous regional commands, or a dual structure. The settlement determines how quickly orders move and how much local authority survives."
africa_command_central_general_staff: "A Central General Staff"
africa_command_central_general_staff_desc: "One staff will direct operations, procurement, and strategic reserves. Its authority improves coordination but must answer charges that the host controls every army."
africa_command_regional_commands: "Empower Regional Commands"
africa_command_regional_commands_desc: "Regional headquarters will retain operational authority over familiar terrain and supply. Their reach limits host domination, though common orders require stronger liaison."
africa_command_dual_command: "Adopt Dual Command"
africa_command_dual_command_desc: "Continental command will direct common campaigns while regional staffs retain home defence. The division improves readiness when both levels share plans and supplies."
africa_command_unify_the_architecture: "Unify the Command Architecture"
africa_command_unify_the_architecture_desc: "The chosen staffs will receive clear jurisdictions, liaison duties, and emergency procedures. A settled chain of command strengthens the centre without dissolving every regional headquarters."
africa_command_integrate_the_armies: "Integrate the Armies"
africa_command_integrate_the_armies_desc: "Member forces will share plans, standards, and designated formations before any complete transfer. Integration raises common authority through service rather than disarmament."
africa_command_prove_common_logistics: "Prove Common Logistics"
africa_command_prove_common_logistics_desc: "A common army must move fuel, equipment, and replacements through real corridors. Successful supply gives continental command practical reach."
africa_command_define_protectorates: "Define the Protectorate Doctrine"
africa_command_define_protectorates_desc: "Military protection will carry written limits, local government, and a path out of emergency administration. Security obligations raise readiness without disguising annexation."
africa_command_logistics_first: "Logistics Before Advance"
africa_command_logistics_first_desc: "Rail, road, port, airlift, and depot work will precede wider campaigns. The command gains capacity by supplying the fronts it already promises to defend."
africa_command_settle_the_officer_corps: "Settle the Officer Corps"
africa_command_settle_the_officer_corps_desc: "Retention, vetting, training, and regional promotion will bind officers to the continental mandate. A credible settlement strengthens authority and lowers the danger of a host monopoly."
africa_command_the_victorious_commander: "The Victorious Commander"
africa_command_the_victorious_commander_desc: "A successful commander has become a political centre in their own right. A formal loyalty review must decide whether prestige serves the Charter or challenges it."
africa_command_rotate_the_commander: "Rotate the Commander"
africa_command_rotate_the_commander_desc: "The victorious commander will leave the regional post under an orderly transfer. Rotation preserves readiness while preventing military fame from becoming personal rule."
africa_command_constitutionalise_the_commander: "Constitutionalise the Command"
africa_command_constitutionalise_the_commander_desc: "A partial or failed loyalty settlement will place the commander inside stricter civilian and regional institutions. Political authority replaces an unreliable personal bargain."
africa_command_settle_commander_crisis: "Settle the Commander Crisis"
africa_command_settle_commander_crisis_desc: "The revised appointment, command limits, and succession rules will bind the officer corps. Continental authority can recover without rewarding defiance."
africa_command_handover_or_permanence: "Handover or Permanent Command"
africa_command_handover_or_permanence_desc: "The command must declare whether civilian institutions will inherit power or military rule will endure. Retaining emergency authority increases the constitutional debt carried into unification."
africa_command_prove_officer_loyalty: "Prove Officer Loyalty"
africa_command_prove_officer_loyalty_desc: "Regional and central officers must obey the settled command order through a real obligation. Demonstrated loyalty raises readiness more reliably than another purge."
africa_command_prove_civilian_mandate: "Prove the Civilian Mandate"
africa_command_prove_civilian_mandate_desc: "Civilian institutions must show that they can direct defence without breaking the common army. Their success strengthens the government needed for any lawful handover."
africa_command_empower_regional_staffs: "Empower the Regional Staffs"
africa_command_empower_regional_staffs_desc: "Regional staffs will receive representation in planning, promotion, and supply. Their authority reduces host dominance while keeping continental obligations intact."
africa_command_limit_host_general_staff: "Limit the Host General Staff"
africa_command_limit_host_general_staff_desc: "The founding country's officers will submit to common appointment and audit rules. Restraint extends command beyond the host and lowers the risk of a continental garrison state."
africa_command_of_africa: "Command of Africa"
africa_command_of_africa_desc: "Supply, integrated forces, loyal officers, and a declared political mandate sustain a continental command. Its power rests on obligations the armies can actually fulfil."

# Confederation of African States
africa_confederation_reserve_sovereignty: "Reserve the Powers of the States"
africa_confederation_reserve_sovereignty_desc: "Members retain domestic government, armies, citizenship, and other named powers. The confederation begins by limiting itself and earning sovereign consent."
africa_confederation_write_voting_rule: "Write the Voting Rule"
africa_confederation_write_voting_rule_desc: "War, sanctions, projects, and treaties need a rule that protects members without making action impossible. The choice will balance equality against speed."
africa_confederation_unanimity: "Require Unanimity"
africa_confederation_unanimity_desc: "Every government will hold a veto over the confederation's gravest acts. The rule protects sovereignty, though one refusal can halt common action."
africa_confederation_qualified_majority: "A Qualified Majority"
africa_confederation_qualified_majority_desc: "A broad majority may act when dissenting members receive defined protections and opt-outs. This gives the confederation authority at the cost of harder safeguards."
africa_confederation_regional_concurrence: "Require Regional Concurrence"
africa_confederation_regional_concurrence_desc: "A proposal must win support across several regions rather than one bloc of large states. The rule strengthens consent and checks host domination."
africa_confederation_ratify_voting_compact: "Ratify the Voting Compact"
africa_confederation_ratify_voting_compact_desc: "The chosen rule will govern contributions, emergencies, and foreign policy. Ratification gives each member a known voice and a lawful means of objection."
africa_confederation_build_secretariat: "Build a Limited Secretariat"
africa_confederation_build_secretariat_desc: "A technical secretariat will coordinate records, projects, and meetings without assuming powers reserved to members. Its usefulness extends the confederation's reach."
africa_confederation_common_defence: "A Common Defence Agreement"
africa_confederation_common_defence_desc: "Members will state what forces, access, and aid they owe during an attack. The agreement strengthens authority only to the extent that governments accept the obligations."
africa_confederation_prove_collective_defence: "Prove Collective Defence"
africa_confederation_prove_collective_defence_desc: "At least one common obligation must be honoured without seizing a member's army. Practical cooperation turns treaty language into consent."
africa_confederation_markets_and_corridors: "Markets and Corridors"
africa_confederation_markets_and_corridors_desc: "Common standards and negotiated access will connect sovereign economies. Regional safeguards prevent the host from collecting every benefit of open corridors."
africa_confederation_prove_corridor_treaty: "Prove the Corridor Treaty"
africa_confederation_prove_corridor_treaty_desc: "A real cross-border route must carry goods or aid under the agreed terms. Successful passage gives the confederation reach without imposing a unitary market."
africa_confederation_coordinate_foreign_policy: "Coordinate Foreign Policy"
africa_confederation_coordinate_foreign_policy_desc: "Members will define when they consult, sanction, recognise, or negotiate together. Common positions gain authority while ordinary diplomacy remains sovereign."
africa_confederation_write_withdrawal_rules: "Write the Right to Withdraw"
africa_confederation_write_withdrawal_rules_desc: "Notice, debt, borders, minorities, and military property will receive a lawful exit procedure. The right to leave makes continued membership more credible."
africa_confederation_free_rider_crisis: "The Free-Rider Crisis"
africa_confederation_free_rider_crisis_desc: "A member has taken common benefits while refusing its obligations, and others disagree over the response. An emergency vote must test the confederal settlement."
africa_confederation_ratify_bounded_emergency: "Ratify a Bounded Emergency"
africa_confederation_ratify_bounded_emergency_desc: "Members will authorise a narrow common response with a stated end. The agreement preserves collective reach without creating permanent central power."
africa_confederation_honour_lawful_refusal: "Honour a Lawful Refusal"
africa_confederation_honour_lawful_refusal_desc: "A member that followed the voting compact may abstain without punishment. Respecting the refusal strengthens authority and consent even when common action becomes smaller."
africa_confederation_settle_divergent_war: "Settle the Divergent War"
africa_confederation_settle_divergent_war_desc: "Willing members may act under a bounded coalition while others remain outside the war. The settlement repairs a failed emergency vote without forcing universal mobilisation."
africa_confederation_resolve_disagreement_without_force: "Resolve Disagreement Without Force"
africa_confederation_resolve_disagreement_without_force_desc: "Negotiation, narrower obligations, and lawful opt-outs will end the crisis. Regional equality grows when dissent does not invite occupation."
africa_confederation_empower_regional_compacts: "Empower Regional Compacts"
africa_confederation_empower_regional_compacts_desc: "Neighbouring members may coordinate projects and defence below the continental level. These compacts extend cooperation while keeping distant governments from bearing impossible commitments."
africa_confederation_audit_host_secretariat: "Audit the Host Secretariat"
africa_confederation_audit_host_secretariat_desc: "Member inspectors will review offices and resources supplied by the founding country. Public limits keep technical coordination from becoming hidden host government."
africa_confederation_in_concert: "Africa in Concert"
africa_confederation_in_concert_desc: "Sovereign states maintain defence, corridors, consultation, and lawful disagreement through a durable compact. Continental influence grows without requiring one capital or one government."

# Covenant with the Land and Nonhuman Congress
africa_covenant_recognise_the_impossible: "Recognise the Impossible"
africa_covenant_recognise_the_impossible_desc: "A revealed nonhuman or ecological power can no longer be governed as an ordinary province or threat. The Charter must define a political relationship under public safeguards."
africa_covenant_recognise_sovereign_actor: "Recognise a Sovereign Actor"
africa_covenant_recognise_sovereign_actor_desc: "The impossible actor will receive a bounded sovereign standing and reciprocal duties. Human communities retain representation where its territory and power affect them."
africa_covenant_create_protected_territory: "Create a Protected Territory"
africa_covenant_create_protected_territory_desc: "A defined ecological or anomalous zone will receive protection from settlement, extraction, and military abuse. Continental authority will enforce the boundary."
africa_covenant_treat_actor_as_bounded_power: "A Treaty-Bound Power"
africa_covenant_treat_actor_as_bounded_power_desc: "The actor will enter a limited treaty without ordinary citizenship or unrestricted jurisdiction. Clear obligations extend cooperation while containing its reach."
africa_covenant_mixed_consent_tribunal: "A Mixed Consent Tribunal"
africa_covenant_mixed_consent_tribunal_desc: "Local councils, observers, regional governments, and visible emissaries will judge whether any bargain has genuine consent. No single court may speak for every affected community."
africa_covenant_define_consent: "Define Consent Across Worlds"
africa_covenant_define_consent_desc: "The Covenant will state who may agree, refuse, review, and withdraw when human and nonhuman interests collide. Regional equality depends on these public rules."
africa_covenant_favour_and_wrath: "Favour and Wrath"
africa_covenant_favour_and_wrath_desc: "Benefits from the Covenant will follow honoured obligations and bounded demands. Keeping the bargain restrains ecological wrath and gives the Charter greater authority."
africa_covenant_draw_boundaries: "Draw the Covenant Boundaries"
africa_covenant_draw_boundaries_desc: "Protected habitat, sovereign anomaly, migration route, and containment perimeter require exact jurisdiction. Clear limits extend continental reach without granting the actor every contested place."
africa_covenant_write_warfare_doctrine: "Write the Covenant Warfare Doctrine"
africa_covenant_write_warfare_doctrine_desc: "Defensive, retaliatory, and controlled uses of impossible force will receive public limits. Readiness rises, but human consent remains part of every lawful deployment."
africa_covenant_define_nonhuman_forces: "Define the Nonhuman Forces"
africa_covenant_define_nonhuman_forces_desc: "Strange formations need command, supply, territorial limits, and a right to refuse unlawful orders. Their service improves defence while adding a serious burden of control."
africa_covenant_preserve_human_government: "Preserve Human Government"
africa_covenant_preserve_human_government_desc: "Elections, councils, courts, and member governments will remain accountable beside the Covenant. Impossible power cannot silently replace ordinary political authority."
africa_covenant_prove_reciprocal_obligation: "Prove Reciprocal Obligation"
africa_covenant_prove_reciprocal_obligation_desc: "Both the Charter and the impossible actor must fulfil a bounded public promise. A working exchange gives the Covenant reach beyond fear and appeasement."
africa_covenant_containment_or_revolt: "Containment or Member Revolt"
africa_covenant_containment_or_revolt_desc: "A breach or political revolt has exposed the cost of the bargain. A formal review must choose containment, renegotiation, or protected withdrawal."
africa_covenant_contain_the_breach: "Contain the Breach"
africa_covenant_contain_the_breach_desc: "Regional authorities will restore the agreed perimeter and suspend dangerous access. Firm containment protects neighbouring members and re-establishes the Covenant's limits."
africa_covenant_renegotiate_the_bargain: "Renegotiate the Bargain"
africa_covenant_renegotiate_the_bargain_desc: "The parties will narrow demands, duties, and access under renewed observation. A harder bargain can restore authority and consent after partial failure."
africa_covenant_protect_member_withdrawal: "Protect Member Withdrawal"
africa_covenant_protect_member_withdrawal_desc: "A member that cannot accept the Covenant may leave its obligations under protection. Respecting that choice preserves human consent and prevents punishment from defining the route."
africa_covenant_restore_bounded_coexistence: "Restore Bounded Coexistence"
africa_covenant_restore_bounded_coexistence_desc: "The crisis settlement will bind territory, force, government, and review into one workable order. Coexistence survives because neither side receives unlimited authority."
africa_covenant_include_the_impossible: "A Charter That Includes the Impossible"
africa_covenant_include_the_impossible_desc: "Recognised status, reciprocal duties, protected boundaries, and human government establish a rare constitutional order. Its authority depends on coexistence rather than surrender."

# Route-sensitive support lanes
africa_support_choose_corridor_philosophy: "Choose a Corridor Philosophy"
africa_support_choose_corridor_philosophy_desc: "Public need, member ownership, common strategy, or regulated commerce will guide future routes. The active constitution determines who benefits and who carries the obligation."
africa_support_corridor_local_guarantees: "Guarantee Local Access"
africa_support_corridor_local_guarantees_desc: "Communities and member governments along each route will receive access, maintenance, and protection guarantees. Public obligations give corridor policy political authority."
africa_support_corridor_continental_standards: "Continental Corridor Standards"
africa_support_corridor_continental_standards_desc: "Rail, road, river, port, air, and convoy projects will share practical standards. Common administration makes separate regional routes work as one network."
africa_support_prove_common_passage: "Prove Common Passage"
africa_support_prove_common_passage_desc: "A working corridor must carry people, aid, or goods across a real boundary under the agreed guarantees. Successful passage proves that distant regions share the network."
africa_support_settle_resources: "Settle the Resource Question"
africa_support_settle_resources_desc: "Ownership, processing, revenue, labour, and foreign access will follow a constitutional settlement. The policy must earn consent from producing regions as well as the centre."
africa_support_resource_contracts: "Rewrite the Resource Contracts"
africa_support_resource_contracts_desc: "Concessions and public agreements will receive clear terms for access, expertise, labour, and termination. Fair contracts extend continental control without sudden technical collapse."
africa_support_resource_revenue_shares: "Share the Resource Revenues"
africa_support_resource_revenue_shares_desc: "Producing communities, member governments, and common institutions will receive declared shares. Transparent distribution gives the Charter authority over extraction disputes."
africa_support_anti_extraction_court: "An Anti-Extraction Court"
africa_support_anti_extraction_court_desc: "A continental court will hear abuses of labour, land, revenue, and concession law. Its jurisdiction gives the centre capacity to enforce the settlement."
africa_support_food_water_health: "Food, Water, and Health"
africa_support_food_water_health_desc: "Regional vulnerability will guide shared investment in food, water, and public health. The active constitution shapes delivery, while neglected regions receive a stronger claim on common resources."
africa_support_food_network: "Build the Food Network"
africa_support_food_network_desc: "Storage, transport, seed, veterinary support, and emergency distribution will connect producing and vulnerable regions. Reliable supply strengthens public consent."
africa_support_water_compact: "Write the Water Compact"
africa_support_water_compact_desc: "River, lake, irrigation, and drought obligations will be negotiated across borders. Shared access extends the continental network without granting one state every upstream right."
africa_support_continental_health_service: "A Continental Health Service"
africa_support_continental_health_service_desc: "Hospitals, surveillance, laboratories, and emergency teams will coordinate through regional services. Visible care gives the Charter authority during outbreaks and disasters."
africa_support_survival_proof: "Prove the Survival Network"
africa_support_survival_proof_desc: "A real food, water, or health delivery must reach a vulnerable region. Successful service proves that common administration can protect life beyond the host."
africa_support_define_military_purpose: "Define the Military Purpose"
africa_support_define_military_purpose_desc: "Territorial defence, member rescue, liberation support, and internal security require different limits. The constitution will determine what common force may lawfully do."
africa_support_command_relationship: "Settle the Command Relationship"
africa_support_command_relationship_desc: "Member armies, regional commands, and continental staff will receive named duties and refusal procedures. The settlement makes defence cooperation compatible with political consent."
africa_support_common_logistics: "Build Common Logistics"
africa_support_common_logistics_desc: "Depots, transport, supply standards, and corridor access will support agreed operations. The common force gains reach only where its obligations can be supplied."
africa_support_civilian_oversight: "Civilian Oversight of Common Defence"
africa_support_civilian_oversight_desc: "Councils, courts, or member governments will review deployments and emergency powers according to the constitution. Civilian authority keeps readiness from becoming permanent military rule."
africa_support_open_diaspora_programme: "Open the Diaspora Programme"
africa_support_open_diaspora_programme_desc: "Voluntary return, skills exchange, investment, service, and cultural work will be offered under the active constitution. Capacity must precede promises of settlement."
africa_support_diaspora_right_of_return: "A Protected Right of Return"
africa_support_diaspora_right_of_return_desc: "Voluntary return will receive legal passage and equal protection without privileged claims to land. Regional institutions will share responsibility for the right."
africa_support_diaspora_skills_and_capital: "Skills and Capital Across the Atlantic"
africa_support_diaspora_skills_and_capital_desc: "Teachers, doctors, engineers, veterans, cooperatives, and investors may join defined public programmes. Their contribution must answer local needs and labour rights."
africa_support_diaspora_local_consent: "Local Consent for Settlement"
africa_support_diaspora_local_consent_desc: "Housing, work, services, and representation will be negotiated with receiving communities. Consent extends the programme's reach without creating a privileged estate."
africa_support_define_intelligence_purpose: "Define the Intelligence Purpose"
africa_support_define_intelligence_purpose_desc: "Counter-intervention, corridor protection, foreign influence, and constitutional defence will receive separate mandates. The active constitution sets the boundary between security and political policing."
africa_support_intelligence_charter: "Write the Intelligence Charter"
africa_support_intelligence_charter_desc: "Targets, warrants, oversight, and cooperation with members will be written into a public security settlement. Clear authority gives intelligence work durable capacity."
africa_support_regional_intelligence_bureaux: "Regional Intelligence Bureaux"
africa_support_regional_intelligence_bureaux_desc: "Regional bureaux will share foreign and security information without placing every file in the host capital. Distributed responsibility protects equality and local knowledge."
africa_support_restore_by_consent: "Restore by Consent"
africa_support_restore_by_consent_desc: "Historical institutions may return through local support, viable territory, and a constitutional settlement. Restoration must serve living communities rather than outside nostalgia."
africa_support_restoration_claims: "Review the Restoration Claims"
africa_support_restoration_claims_desc: "Claimants, institutions, borders, and overlapping identities will receive a public review. Careful surveys extend the Charter's reach without promising the same land twice."
africa_support_restoration_proof: "Require Restoration Proof"
africa_support_restoration_proof_desc: "A proposed polity must demonstrate local support, functioning institutions, and a distinct role before promotion. The Charter will authorise only packages that survive that test."
africa_support_answer_the_scramble: "Answer the Scramble"
africa_support_answer_the_scramble_desc: "Outside demands, sanctions, bases, and expedition plans will meet a response shaped by the constitution. The government must preserve sovereignty without hollowing out its own settlement."
africa_support_scramble_diplomatic_front: "Build the Diplomatic Front"
africa_support_scramble_diplomatic_front_desc: "Member governments will coordinate recognition, sanctions, negotiation, and coalition division. Regional participation keeps the response from becoming a private host war."
africa_support_anti_partition_guarantees: "Guarantees Against Partition"
africa_support_anti_partition_guarantees_desc: "Members will publish what territory, access, and sovereignty they will defend together. Clear guarantees strengthen consent before an outside coalition tests them."
africa_support_postwar_constitutional_review: "Open the Postwar Review"
africa_support_postwar_constitutional_review_desc: "Emergency institutions, military powers, and wartime obligations will face a formal constitutional review. The outcome may confirm, amend, or force repair of the settlement."
africa_support_review_convention: "Convene the Constitutional Review"
africa_support_review_convention_desc: "Delegates will turn the review result into a public correction, including recovery after a failed settlement. The convention restores authority through declared procedure."
africa_support_review_settlement: "Settle the Postwar Constitution"
africa_support_review_settlement_desc: "The accepted corrections will bind the executive, members, and common institutions after war. Durable administration replaces temporary power."
africa_support_sponsor_another_continent: "Sponsor Another Continent"
africa_support_sponsor_another_continent_desc: "A stable African order may support another continental project with aid, recognition, mediation, or pressure. The constitution determines the burden and political terms."
africa_support_choose_external_partner: "Choose an External Partner"
africa_support_choose_external_partner_desc: "The government will select a viable foreign continental partner whose public aims can coexist with African sovereignty. Consent comes before material commitment."
africa_support_external_sponsorship_mandate: "Write the Sponsorship Mandate"
africa_support_external_sponsorship_mandate_desc: "The chosen partnership will receive limits, resources, review, and an end condition. A bounded mandate extends African influence without surrendering domestic capacity."

# Charter League formation and settlement
africa_charter_league_declared: "Declare the Charter League"
africa_charter_league_declared_desc: "Proven passage, survival services, and civilian defence allow the provisional Charter to become a permanent League. Its institutions take the form promised by the chosen constitution."
africa_seat_the_first_member_council: "Seat the First Member Council"
africa_seat_the_first_member_council_desc: "Member governments will take formal seats beside the host. Representation becomes part of League government rather than a courtesy offered by the founding country."
africa_write_accession_law: "Write the Law of Accession"
africa_write_accession_law_desc: "Protection, association, chartered membership, autonomy, and integration will receive distinct consent requirements. A government can see what it accepts before its status changes."
africa_build_the_continental_secretariat: "Build the Continental Secretariat"
africa_build_the_continental_secretariat_desc: "A permanent service will keep records, administer obligations, and coordinate councils across the regions. Its capacity remains subject to the constitutional settlement."
africa_fund_the_common_budget: "Fund the Common Budget"
africa_fund_the_common_budget_desc: "Members will finance shared institutions and projects under the active constitution. A common budget extends continental reach while exposing how fairly burdens are distributed."
africa_open_the_charter_court: "Open the Charter Court"
africa_open_the_charter_court_desc: "Members may bring disputes over accession, withdrawal, borders, and obligations before a common court. Enforceable review gives the League authority beyond negotiation alone."
africa_ratify_common_defence: "Ratify Common Defence"
africa_ratify_common_defence_desc: "The League will adopt declared obligations for aid, deployment, supply, and command. Member representation determines how those obligations become collective action."
africa_launch_continental_infrastructure: "Launch Continental Infrastructure"
africa_launch_continental_infrastructure_desc: "The common budget will carry corridor standards into a wider programme of transport and public works. Projects must serve members as well as the host."
africa_balance_host_and_regions: "Balance Host and Regions"
africa_balance_host_and_regions_desc: "Offices, projects, and representation will be redistributed where the founding country has accumulated too much weight. The constitution determines how that balance is enforced."
africa_convert_protected_members: "Invite One Protected Partner"
africa_convert_protected_members_desc: "Send an association compact to one selected protected government. Its leaders may accept written duties, return a counterproposal, or keep protection without joining."
africa_admit_the_first_chartered_member: "Offer a Chartered Seat"
africa_admit_the_first_chartered_member_desc: "Offer one selected associate formal representation and accession clauses. The government may sign, renegotiate, or retain its associate compact."
africa_create_autonomous_federal_regions: "Offer an Autonomy Statute"
africa_create_autonomous_federal_regions_desc: "Place a negotiated division of local and common powers before one eligible chartered member. The statute takes effect only if that government ratifies it."
africa_integrate_a_proven_region: "Hold a Final Integration Ballot"
africa_integrate_a_proven_region_desc: "Offer full constitutional integration to one region that has completed every relationship and public-proof requirement. The region may consent, seek another timetable, or refuse."
africa_answer_a_leaving_member: "Settle a Member's Departure"
africa_answer_a_leaving_member_desc: "Offer one departing government a looser associate compact alongside its lawful exit. The member may rejoin, leave, or keep the dispute unresolved."
africa_break_a_rival_bloc: "Confront a Rival Bloc"
africa_break_a_rival_bloc_desc: "Offer one rival government a voluntary associate merger or an equal-status coexistence treaty. Rejection leaves the rival institution intact and raises the cost of continental competition."
africa_publish_the_continental_record: "Publish the Continental Record"
africa_publish_the_continental_record_desc: "The League will publish its infrastructure, regional balance, defence obligations, and institutional settlements. The record lets every member judge what continental government has delivered."
africa_call_the_postwar_convention: "Call the Postwar Convention"
africa_call_the_postwar_convention_desc: "The completed review and public record will guide a convention on emergency power, representation, and long-term government. Each constitution receives its own settlement."
africa_settle_the_second_generation: "Settle the Second Generation"
africa_settle_the_second_generation_desc: "Citizens and institutions formed under the League need durable rights beyond the founding crisis. The settlement renews consent for a generation that did not write the first Charter."
africa_open_the_african_century: "Open the African Century"
africa_open_the_african_century_desc: "With the continental settlement in force, Africa can pursue long programmes, answer the foreign Scramble, and conduct world diplomacy on its own constitutional terms."
africa_one_continent_many_peoples: "One Continent, Many Peoples"
africa_one_continent_many_peoples_desc: "Conclude the state-by-state continental settlement. Direct host land, consent-bound federal regions, confederal members, accepted restored polities, and time-limited peace exemptions must account for every African state without erasing the governments that joined."
