chaosx.nr23.1.t: "Soviet Nuclear Bombs"

chaosx.nr23.2.t: "Nuclear Bombs"
chaosx.nr23.2.d: "Our scientists have completed one hundred nuclear weapons. The arsenal gives the Soviet Union a new power over its enemies and places every capital within reach."
chaosx.nr23.2.a: "The arsenal is ready."

chaosx.news.23.t: "Soviet Might"
chaosx.news.23.d: "The Soviet Union has announced the production of one hundred nuclear weapons. Governments are revising their defenses as the arsenal places every major city under the shadow of nuclear attack."
chaosx.news.23.a: "The scale is alarming."
