sov_nuclear_bombs_action_reservation_disputed: "The device reservation must be reconciled."
sov_nuclear_bombs_target_state_requirements_tt: "Select a usable state that is not impassable, missing, or dismantled and is Soviet-owned or controlled, or owned or controlled by a country at war with the Soviet Union. It need not be a registered depot. Soviet command must be able to act, and no other nuclear project may be in progress."
sov_nuclear_bombs_custody_target_requirements_tt: "Select a registered depot with a pending custody transfer or one no longer owned or controlled by the Soviet Union. Dismantled and missing sites are excluded."
sov_nuclear_bombs_registered_site_requirements_tt: "Select a Soviet-owned and controlled registered site. Hardening requires an intact site with usable infrastructure. Dismantlement requires at least one assigned device."
sov_nuclear_bombs_reserve_destination_requirements_tt: "Select a distinct valid destination while a recorded reserve remains available for movement."
sov_nuclear_bombs_reactor_site_requirements_tt: "Select an intact non-capital Soviet site with infrastructure, construction capacity, and room for the next reactor level."
sov_nuclear_bombs_assembly_site_requirements_tt: "Select a registered storage depot owned and controlled by the Soviet Union, with usable infrastructure and at least one civilian or military factory. The depot must not be missing, dismantled, technically restricted, or awaiting custody reconciliation. The reactor program, production capacity, and atomic technologies must be ready."
sov_nuclear_bombs_assembly_receipt_clear_tt: "The previous assembly run has a consistent site and batch record."
sov_nuclear_bombs_production_quote_value: "[?sov_nuclear_bombs_production_quote|0]"
sov_nuclear_bombs_test_site_requirements_tt: "Select a registered non-capital Soviet test site with infrastructure, no transfer denial, and no active project."
sov_nuclear_bombs_coercion_target_requirements_tt: "Select a valid command state whose owner or controller is non-Soviet, independent, and not capitulated. Its controller cannot be a major power. This selector does not test delivery reach."
sov_nuclear_bombs_retaliation_target_requirements_tt: "During a confirmed exchange, select a state held by a nuclear major at war with the Union. Outside an exchange, only the Evolution IV emergency allows a selection: a lower-consequence military or logistics state of a nuclear major at war with the Union, never a capital or populous state unless the enemy has already struck a populated Soviet state."
sov_nuclear_bombs_retaliation_authorization_requirements_tt: "A confirmed exchange, reachable major-power target, reserved device, verified delivery route, and intact command chain are required."
sov_nuclear_bombs_breakaway_return_requirements_tt: "Select a physically held registered site whose breakaway custody record can support a monitored return request."
sov_nuclear_bombs_breakaway_custody_requirements_tt: "Select an intact depot in this authority's physical custody when no other depot is awaiting work. A completed or lost depot permits another selection. Joint custody prevents unilateral access."
sov_nuclear_bombs_public_ultimatum_requirements_tt: "Requires a valid independent minor or eligible breakaway target, Evolution II, one reserved device, a selected reachable state, and no active nuclear project."
sov_nuclear_bombs_wartime_demonstration_requirements_tt: "Requires a valid minor or breakaway target, a selected surveyed test site, one assigned device, a certified delivery route, and no active nuclear project."
sov_nuclear_bombs_limited_strike_requirements_tt: "Requires a valid selected target, one unreserved device, a reachable non-major state, and no active nuclear project."
sov_nuclear_bombs_first_use_emergency_requirements_tt: "The Evolution IV emergency must hold: extreme world chaos, an active war with severe strategic losses, a threatened capital, a collapsed front, an exhausted reserve, and verified enemy nuclear use or launch preparation. Delivery crews must be certified, a strategic bomber route must be ready, and readiness and command integrity must meet the release standard. No moratorium or earlier Soviet first use may stand.\nWar situation: [GetSovietNuclearBombsWarSituation]."
sov_nuclear_bombs_first_use_authority_requirements_tt: "Release authority must be centralized or delegated, release orders must not be suspended, no verified stand-down may be in force, and one unreserved device must remain."
sov_nuclear_bombs_first_use_target_requirements_tt: "The marked state must still be a reachable lower-consequence military or logistics state of a nuclear major at war with the Union, with no other nuclear project in progress and no open coercion dossier."
sov_nuclear_bombs_delivery_route_requirements_tt: "Requires atomic weapons, strategic bomber technology, at least ten deployed strategic or intercontinental bombers, a Soviet-controlled air base, and fuel reserves for the bomber force."
sov_nuclear_bombs_test_delivery_route_requirements_tt: "The surveyed test site must be within bomber range of a Soviet-controlled air base, with certified delivery crews, at least ten deployed strategic or intercontinental bombers, and fuel reserves."
sov_nuclear_bombs_breakaway_technical_requirements_tt: "Requires physical custody of the selected transferred depot, atomic technology, the installed nuclear capability, and no other active project."
sov_nuclear_bombs_breakaway_command_requirements_tt: "Requires the selected depot to remain in physical custody with technical access complete and no other active project."
sov_nuclear_bombs_breakaway_delivery_requirements_tt: "Requires the selected depot to remain in custody with technical access and command formation complete, plus a verified local delivery route."
sov_nuclear_bombs_technical_certification_requirements_tt: "The prepared strike must have a valid device reservation, target, delivery route, command chain, and technical safety record."
sov_nuclear_bombs_safety_overrule_requirements_tt: "A scientific safety veto may be overruled only during an active war when command remains coherent and the Union faces an extreme strategic emergency."
sov_nuclear_bombs_final_authorization_requirements_tt: "The selected strike must remain valid, technically certified, fully prepared, and backed by one reserved device before release."
sov_nuclear_bombs_prepared_strike_valid_tt: "The prepared strike must still be valid: the selected state is within bomber reach and held by an enemy at war with the Union, and Arsenal Readiness and Command Integrity meet the release standard (now [?sov_nuclear_bombs_readiness|0] and [?sov_nuclear_bombs_integrity|0]). A nuclear major's state also needs a confirmed exchange or the Evolution IV emergency."
sov_nuclear_bombs_test_site_valid_tt: "The surveyed test site must remain usable: Soviet-owned and controlled, not the capital, free of border fighting and resistance, with infrastructure and fewer than [?constant:sov_nuclear_bombs_tuning.test_site_max_population_k|0] thousand people"
sov_nuclear_bombs_test_site_assigned_device_tt: "The surveyed test site must hold at least one assigned device and remain usable: Soviet-owned and controlled, not the capital, free of border fighting and resistance, with infrastructure and fewer than [?constant:sov_nuclear_bombs_tuning.test_site_max_population_k|0] thousand people"
sov_nuclear_bombs_test_readiness_tt: "Arsenal Readiness is at least [?constant:sov_nuclear_bombs_tuning.minimum_test_readiness|0] (now [?sov_nuclear_bombs_readiness|0])"
sov_nuclear_bombs_coercion_target_not_cooling_down_tt: "The government named by this state has not faced a Soviet ultimatum recently"
sov_nuclear_bombs_dossier_no_threat_made_tt: "No threat has been made through this channel yet"
sov_nuclear_bombs_coercion_target_valid_tt: "The selected state must remain a valid coercion target, held by an independent government other than the Union that has not capitulated"
sov_nuclear_bombs_demand_can_narrow_tt:"The demand stands at level [?sov_nuclear_bombs_target_demand|0] of [?constant:sov_nuclear_bombs_target_demand.maximum|0] and can still be narrowed"
sov_nuclear_bombs_demand_can_raise_tt: "The demand stands at level [?sov_nuclear_bombs_target_demand|0] of [?constant:sov_nuclear_bombs_target_demand.maximum|0] and can still be raised"
sov_nuclear_bombs_selected_depot_valid_tt: "The selected depot must be intact and either outside Soviet control or still holding transferred devices"
sov_nuclear_bombs_selected_depot_rail_route_tt: "A rail line and usable infrastructure reach the selected depot"
sov_nuclear_bombs_selected_depot_transferred_tt: "The selected depot still holds at least one transferred device"
sov_nuclear_bombs_selected_depot_assigned_device_tt: "The selected depot must be an intact Soviet-held storage site with infrastructure and at least one assigned device"
sov_nuclear_bombs_selected_depot_return_requested_tt: "The selected depot's return has been requested, it is back in Soviet hands, and it still holds its transferred devices"
sov_nuclear_bombs_devices_reconciled_tt: "Every registered device is accounted for"
sov_nuclear_bombs_operational_device_available_tt: "At least one device is operational (now [?global.sov_nuclear_bombs_ledger_operational|0])"

sov_nuclear_bombs_custody_party: "Choose Party Custody"
sov_nuclear_bombs_custody_party_desc: "Put codes, storage appointments, and release authority under political leadership. This raises integrity while slowing emergency release."
sov_nuclear_bombs_custody_military: "Choose Military Custody"
sov_nuclear_bombs_custody_military_desc: "Put the General Staff and delivery commands in primary control. This raises readiness while increasing refusal and unauthorized-order risk."
sov_nuclear_bombs_custody_scientific_safety: "Choose Scientific Safety Custody"
sov_nuclear_bombs_custody_scientific_safety_desc: "Let the laboratory chain control testing, safeguards, and technical certification. This protects integrity while making release deliberately slower."
sov_nuclear_bombs_custody_dispersed_commands: "Choose Dispersed Commands"
sov_nuclear_bombs_custody_dispersed_commands_desc: "Spread custody across hardened commands and depots. This improves survivability and readiness while making authentication harder."
sov_nuclear_bombs_operational_command: "Open Operational Command"
sov_nuclear_bombs_operational_command_desc: "Assign the arsenal's next task, from guarding depots and training crews to testing devices or preparing a demand."
sov_nuclear_bombs_reform_custody_doctrine: "Reform the Custody Doctrine"
sov_nuclear_bombs_reform_custody_doctrine_desc: "Reorganize who certifies, guards, and authorizes the arsenal over the scheduled reform period. The transition reduces readiness and command integrity and can be completed only once."
sov_nuclear_bombs_doctrine_reform_requirements_tt: "Requires an investigated test failure, test accident, confirmed enemy nuclear use, a threat to the capital, or war after Evolution I. No atomic moratorium or active operation."
sov_nuclear_bombs_collapse_command: "Open Collapse Command"
sov_nuclear_bombs_collapse_command_desc: "Identify depots lost during the Soviet collapse and choose how to recover, secure, or dismantle their devices."
sov_nuclear_bombs_audit_stockpile: "Audit the Stockpile"
sov_nuclear_bombs_audit_stockpile_desc: "Count every device in storage against the arsenal records and close uncertain opening entries. If the records disagree with the stockpile, a completed audit settles the dispute once every device is accounted for, including weapons already used in bombing raids."
sov_nuclear_bombs_counterintelligence_sweep: "Order a Counterintelligence Sweep"
sov_nuclear_bombs_counterintelligence_sweep_desc: "Send the security services through the reactor sites, depots, rail yards and test grounds to arrest informers and seal the leaks foreign services are using. Program security: [GetSovietNuclearBombsSecurityName]. A finished sweep removes a large part of what foreign services have learned; if they only suspect the program, the suspicion can fade. It cannot undo proof a foreign government already holds."
sov_nuclear_bombs_counterintelligence_sweep_tt: "Foreign services are watching the program, and the arsenal is not yet public"
sov_nuclear_bombs_harden_storage_site: "Harden a Storage Site"
sov_nuclear_bombs_harden_storage_site_desc: "Fortify the selected registered depot against sabotage, seizure, and command disruption."
sov_nuclear_bombs_disperse_reserve_package: "Disperse a Reserve Package"
sov_nuclear_bombs_disperse_reserve_package_desc: "Move an assigned reserve from its source depot to the selected Soviet site, improving survivability while weakening central control. The operation keeps its original source. If that depot becomes unusable, the transfer ends without drawing devices from another depot."
sov_nuclear_bombs_centralize_release_authority: "Centralize Release Authority"
sov_nuclear_bombs_centralize_release_authority_desc: "Concentrate release authentication in the central command board, improving integrity and making the chain easier to verify."
sov_nuclear_bombs_delegate_emergency_retaliation: "Delegate Emergency Retaliation"
sov_nuclear_bombs_delegate_emergency_retaliation_desc: "Authorize a survivable emergency chain for a confirmed nuclear crisis. Readiness improves, but disputed-order risk rises."
sov_nuclear_bombs_expand_fissile_production: "Expand Fissile Production"
sov_nuclear_bombs_expand_fissile_production_desc: "Select an intact Soviet-controlled site with room for another reactor. If construction cannot begin there, the approved reactor remains available for another site."
sov_nuclear_bombs_assemble_device_batch: "Assemble a Device Batch"
sov_nuclear_bombs_assemble_device_batch_desc: "Assemble [GetSovietNuclearBombsProductionQuote] devices at the selected Soviet storage depot using the reactor program and local factories. Production stays at that site. Losing ownership or control cancels the run without moving it to another depot. Upfront security costs remain spent if the run is cancelled."
sov_nuclear_bombs_prepare_delivery_crews: "Prepare Delivery Crews"
sov_nuclear_bombs_prepare_delivery_crews_desc: "Train and equip strategic bomber crews to carry atomic weapons."
sov_nuclear_bombs_delivery_crews_mission: "Delivery Crews in Training"
sov_nuclear_bombs_delivery_crews_mission_desc: "Bomber crews and relay teams are training to deliver atomic weapons under authenticated orders."
sov_nuclear_bombs_conduct_command_exercise: "Conduct a Command Exercise"
sov_nuclear_bombs_conduct_command_exercise_desc: "Exercise authentication, relay, and release procedures without detonating a device."
sov_nuclear_bombs_command_exercise_mission: "Command Exercise Underway"
sov_nuclear_bombs_command_exercise_mission_desc: "Command, authentication, and relay teams are rehearsing release procedures without expending a device."
sov_nuclear_bombs_install_stronger_authentication: "Strengthen Authentication"
sov_nuclear_bombs_install_stronger_authentication_desc: "Add redundant codes and verification officers to reduce the chance of a disputed or unauthorized order."
sov_nuclear_bombs_survey_remote_test_state: "Survey a Remote Test State"
sov_nuclear_bombs_survey_remote_test_state_desc: "Select and instrument a remote Soviet test site before assigning a device to a proof or concealed field test."
sov_nuclear_bombs_prepare_instrumented_proof_test: "Prepare an Instrumented Proof Test"
sov_nuclear_bombs_prepare_instrumented_proof_test_desc: "Reserve one assigned device for an instrumented test. Arsenal Readiness changes by [?constant:sov_nuclear_bombs_tuning.test_success_instrumented_readiness|+=0] after a clean result, [?constant:sov_nuclear_bombs_tuning.test_partial_readiness|+=0] after a partial yield and [?constant:sov_nuclear_bombs_tuning.test_failure_readiness|+=0] after a failure; gains are halved for tests beyond the first [?constant:sov_nuclear_bombs_tuning.test_purpose_count|0] at the current stage. Low Command Integrity increases accident risk. An accident consumes the device and can produce an atomic yield when Integrity is [?constant:sov_nuclear_bombs_tuning.test_accident_catastrophic_integrity_threshold|0] or lower."
sov_nuclear_bombs_prepare_concealed_field_test: "Prepare a Concealed Field Test"
sov_nuclear_bombs_prepare_concealed_field_test_desc: "Test an assigned device under guard while limiting public exposure. The poorer instruments teach less: Arsenal Readiness changes by [?constant:sov_nuclear_bombs_tuning.test_success_concealed_readiness|+=0] after a clean result, [?constant:sov_nuclear_bombs_tuning.test_partial_readiness|+=0] after a partial yield and [?constant:sov_nuclear_bombs_tuning.test_failure_readiness|+=0] after a failure; gains are halved for tests beyond the first [?constant:sov_nuclear_bombs_tuning.test_purpose_count|0] at the current stage. Low Command Integrity increases accident risk. An accident consumes the device and can produce an atomic yield when Integrity is [?constant:sov_nuclear_bombs_tuning.test_accident_catastrophic_integrity_threshold|0] or lower."
sov_nuclear_bombs_prepare_public_test: "Prepare a Public Demonstration"
sov_nuclear_bombs_prepare_public_test_desc: "Prepare a visible atomic demonstration. The test will reveal the arsenal and invite foreign reactions without becoming a combat strike. A successful demonstration raises Arsenal Readiness by [?constant:sov_nuclear_bombs_tuning.demonstration_readiness|0], halved beyond the first test at the current stage, and makes Soviet threats more credible."
sov_nuclear_bombs_strengthen_test_evacuation: "Strengthen Test Evacuation"
sov_nuclear_bombs_strengthen_test_evacuation_desc: "Expand the selected site's evacuation and instrumentation perimeter before the test mission completes."
sov_nuclear_bombs_cancel_prepared_test: "Cancel the Prepared Test"
sov_nuclear_bombs_cancel_prepared_test_desc: "Cancel the selected test and return its reserved device to its recorded depot if custody remains valid."
sov_nuclear_bombs_investigate_test_failure: "Investigate the Test Failure"
sov_nuclear_bombs_investigate_test_failure_desc: "Investigate the failed test and repair the command procedures that allowed it. The spent device remains accounted for."
sov_nuclear_bombs_select_coercion_target: "Select a Coercion Target"
sov_nuclear_bombs_select_coercion_target_desc: "Choose an independent minor or eligible breakaway with a live dispute, custody link, or reachable strategic target."
sov_nuclear_bombs_close_coercion_target: "Close the Coercion Channel"
sov_nuclear_bombs_close_coercion_target_desc: "End the selected coercive channel before any threat has been made, without authorizing a strike or erasing the physical arsenal record."
sov_nuclear_bombs_send_private_signal: "Send a Private Signal"
sov_nuclear_bombs_send_private_signal_desc: "Warn the selected government through a private channel. The warning makes Soviet threats a little more credible and reveals the arsenal to that government alone, without a public ultimatum. From then on this channel can only be settled, enforced or withdrawn."
sov_nuclear_bombs_issue_public_ultimatum: "Issue a Public Ultimatum"
sov_nuclear_bombs_issue_public_ultimatum_desc: "Give the selected government a public deadline to answer a demand backed by the atomic arsenal. A threat against a state the delivery force cannot reach is seen as empty and costs credibility. A refused demand must then be enforced, backed by a demonstration, or withdrawn.\n\nCredibility: [GetSovietNuclearBombsCredibilityName]"
sov_nuclear_bombs_stage_wartime_demonstration: "Stage a Wartime Demonstration"
sov_nuclear_bombs_stage_wartime_demonstration_desc: "Prepare a controlled demonstration during an active war to show resolve without selecting a populated or major-power target. A successful demonstration makes Soviet threats more credible, and after a refused demand it lets the Union renew the demand."
sov_nuclear_bombs_prepare_limited_strike: "Prepare a Limited Strike"
sov_nuclear_bombs_prepare_limited_strike_desc: "Prepare a military or logistics strike against an eligible nonnuclear target, or against the marked state of a nuclear major during the Evolution IV emergency. Technical certification and a final authorization are required before a device can be released. A strike on a government that refused the demand enforces it and makes later threats more credible; aborting or redirecting the strike after a public ultimatum makes them less credible."
sov_nuclear_bombs_accept_partial_settlement: "Accept a Partial Settlement"
sov_nuclear_bombs_accept_partial_settlement_desc: "Accept the selected government's limited concession and keep negotiations open over the remaining demand."
sov_nuclear_bombs_adjust_demand: "Narrow the Demand"
sov_nuclear_bombs_adjust_demand_desc: "Reduce the selected demand by one step while the partial settlement remains open."
sov_nuclear_bombs_raise_demand: "Raise the Demand"
sov_nuclear_bombs_raise_demand_desc: "Increase the selected demand by one step while the partial settlement remains open."
sov_nuclear_bombs_back_down: "Back Down from the Demand"
sov_nuclear_bombs_back_down_desc: "Withdraw the demand without a strike or a settlement. Credibility and Command Integrity fall, each withdrawal makes later threats look emptier, and the named government is spared new Soviet demands for a while.\n\nCredibility: [GetSovietNuclearBombsCredibilityName]"
sov_nuclear_bombs_complete_technical_certification: "Complete Technical Certification"
sov_nuclear_bombs_complete_technical_certification_desc: "Certify the selected weapon, route, and site for the prepared strike. Certification alone never detonates a device."
sov_nuclear_bombs_overrule_safety_veto: "Overrule the Safety Veto"
sov_nuclear_bombs_overrule_safety_veto_desc: "Override a scientific safety veto in a severe crisis, damaging integrity while leaving the final release safeguards in force."
sov_nuclear_bombs_give_final_authorization: "Give Final Authorization"
sov_nuclear_bombs_give_final_authorization_desc: "Authorize the selected strike only after custody, target, delivery, command, and reservation checks are satisfied."
sov_nuclear_bombs_hold_strike: "Hold the Strike"
sov_nuclear_bombs_hold_strike_desc: "Keep the authorization unresolved while the selected target, reserve, and command state are reviewed."
sov_nuclear_bombs_redirect_strike_state: "Redirect the Strike"
sov_nuclear_bombs_redirect_strike_state_desc: "Replace the selected strike state with another eligible military or logistics target before final authorization."
sov_nuclear_bombs_reduce_to_remote_demonstration: "Reduce to a Remote Demonstration"
sov_nuclear_bombs_reduce_to_remote_demonstration_desc: "Cancel the combat profile and prepare a remote demonstration that keeps the action below a populated or major-power strike."
sov_nuclear_bombs_abort_and_recover_device: "Abort and Recover the Device"
sov_nuclear_bombs_abort_and_recover_device_desc: "Cancel a prepared release and return the reserved device to its recorded source custody."
sov_nuclear_bombs_establish_emergency_hotline: "Establish an Emergency Hotline"
sov_nuclear_bombs_establish_emergency_hotline_desc: "Open a direct channel with an opposing nuclear major to extend the decision window and test warning evidence.\n\nExchange stage: [GetSovietNuclearBombsExchangeStageName]."
sov_nuclear_bombs_propose_reciprocal_standdown: "Propose a Reciprocal Stand-Down"
sov_nuclear_bombs_propose_reciprocal_standdown_desc: "Offer a temporary pause in new authorizations while preserving every consequence of strikes already delivered. A stand-down verified before the exchange turns general keeps the crisis contained.\n\nExchange stage: [GetSovietNuclearBombsExchangeStageName]."
sov_nuclear_bombs_limit_retaliation_profile: "Limit the Retaliation Profile"
sov_nuclear_bombs_limit_retaliation_profile_desc: "Restrict the next retaliation window to a military or logistics profile."
sov_nuclear_bombs_preserve_reserve: "Preserve the Reserve"
sov_nuclear_bombs_preserve_reserve_desc: "Move part of the arsenal away from immediate release status so a first strike cannot remove every Soviet device."
sov_nuclear_bombs_select_retaliation_target: "Select a Retaliation Target"
sov_nuclear_bombs_select_retaliation_target_desc: "Choose a nuclear-major target for a confirmed retaliation window. When the Union faces collapse under Evolution IV and verified enemy nuclear preparation, the General Staff may instead mark a lower-consequence military or logistics state for a separately authorized first strike."
sov_nuclear_bombs_authorize_retaliation: "Authorize Retaliation"
sov_nuclear_bombs_authorize_retaliation_desc: "Authorize a confirmed response after the target, delivery route, reserved device, and retaliation order are verified."
sov_nuclear_bombs_suspend_release_orders: "Suspend Release Orders"
sov_nuclear_bombs_suspend_release_orders_desc: "Freeze new nuclear release authorizations while communication and verification continue."
sov_nuclear_bombs_enter_atomic_moratorium: "Enter Atomic Moratorium"
sov_nuclear_bombs_enter_atomic_moratorium_desc: "End ordinary nuclear targeting and exchange planning after the ledger and current reservations are reconciled."
sov_nuclear_bombs_select_disputed_depot: "Select a Disputed Depot"
sov_nuclear_bombs_select_disputed_depot_desc: "Choose a registered depot held outside the Soviet command chain for a limited custody operation."
sov_nuclear_bombs_recall_devices: "Recall Devices"
sov_nuclear_bombs_recall_devices_desc: "Order a registered depot to return its intact devices to Soviet assigned custody where current control permits."
sov_nuclear_bombs_secure_rail_corridor: "Secure the Rail Corridor"
sov_nuclear_bombs_secure_rail_corridor_desc: "Protect the rail route needed to move devices, staff, and custody records between the selected depot and the Soviet command chain."
sov_nuclear_bombs_negotiate_joint_custody: "Negotiate Joint Custody"
sov_nuclear_bombs_negotiate_joint_custody_desc: "Create a monitored joint-custody arrangement without granting the breakaway immediate technical or delivery access."
sov_nuclear_bombs_conduct_recovery_raid: "Conduct a Recovery Raid"
sov_nuclear_bombs_conduct_recovery_raid_desc: "Attempt an armed recovery of a disputed depot when negotiation and rail security cannot recover the devices."
sov_nuclear_bombs_disable_devices: "Disable the Devices"
sov_nuclear_bombs_disable_devices_desc: "Render the selected devices unusable under demolition supervision and account for their remains."
sov_nuclear_bombs_destroy_compromised_site: "Destroy a Compromised Site"
sov_nuclear_bombs_destroy_compromised_site_desc: "A last resort when a breakaway holder is close to making the selected depot operational and the devices cannot be recovered. Demolish the site and account for every device that was still physically present."
sov_nuclear_bombs_breakaway_recovery_impossible_tt: "The devices cannot be recovered: no rail route reaches the depot's state, or no Soviet force holds it"
sov_nuclear_bombs_restore_the_ledger: "Restore the Ledger"
sov_nuclear_bombs_restore_the_ledger_desc: "Reconcile custody after a transfer, return, disabling action, or missing-device review."
sov_nuclear_bombs_seal_reserve_batch: "Seal a Reserve Batch"
sov_nuclear_bombs_seal_reserve_batch_desc: "Close a reserve batch against emergency release while preserving its physical custody record."
sov_nuclear_bombs_select_dismantlement_site: "Select a Dismantlement Site"
sov_nuclear_bombs_select_dismantlement_site_desc: "Choose a Soviet-controlled registered site whose assigned devices can be dismantled under inspection."
sov_nuclear_bombs_dismantle_batch: "Dismantle a Batch"
sov_nuclear_bombs_dismantle_batch_desc: "Inspectors dismantle one device at the selected site without detonating it, remove it from the operational arsenal, and close its custody record."
sov_nuclear_bombs_invite_observers: "Invite Observers"
sov_nuclear_bombs_invite_observers_desc: "Invite neutral observers to verify the Soviet ledger, a test site, or a moratorium without granting access to release codes."
sov_nuclear_bombs_record_reciprocal_restraint: "Record Reciprocal Restraint"
sov_nuclear_bombs_record_reciprocal_restraint_desc: "Record a verified reciprocal stand-down during the exchange and preserve a path away from general nuclear war."
sov_nuclear_bombs_reactivate_arsenal: "Reactivate the Arsenal"
sov_nuclear_bombs_reactivate_arsenal_desc: "End the Soviet atomic moratorium only after the ledger, delivery route, and current command authority have been verified."
sov_nuclear_bombs_breakaway_secure_custody: "Secure Breakaway Custody"
sov_nuclear_bombs_breakaway_secure_custody_desc: "Secure the selected depot and check which technicians and commanders remain responsible for its devices. Each depot retains its own access record. Another depot can be secured after this one becomes operational or leaves our custody."
sov_nuclear_bombs_breakaway_attempt_technical_access: "Attempt Technical Access"
sov_nuclear_bombs_breakaway_attempt_technical_access_desc: "Begin a timed effort to understand and service the devices. Technical access is not command authorization or delivery integration."
sov_nuclear_bombs_breakaway_form_command: "Form a Breakaway Command"
sov_nuclear_bombs_breakaway_form_command_desc: "Begin a separate command-formation stage for a breakaway holding registered devices."
sov_nuclear_bombs_breakaway_integrate_delivery: "Integrate Breakaway Delivery"
sov_nuclear_bombs_breakaway_integrate_delivery_desc: "Begin the separate delivery-integration stage. A breakaway authority must build its own command and delivery capability before it can launch the devices independently."
sov_nuclear_bombs_breakaway_request_return: "Request a Return to Soviet Custody"
sov_nuclear_bombs_breakaway_request_return_desc: "Open a diplomatic return request for physically held devices and preserve the local custody record while talks continue."

sov_nuclear_bombs_device_assembly_mission: "Device Assembly Window"
sov_nuclear_bombs_device_assembly_mission_desc: "Technicians are assembling [?sov_nuclear_bombs_production_amount|0] devices at [sov_nuclear_bombs_assembly_state.GetName]. Losing Soviet ownership or control, industrial facilities, or reactor support cancels the run. Work cannot move to another depot, and upfront security costs remain spent."
sov_nuclear_bombs_proof_test_mission: "Proof Test Window"
sov_nuclear_bombs_proof_test_mission_desc: "The selected proof or public-test package remains active until the test concludes, is cancelled, or reaches its deadline."
sov_nuclear_bombs_ultimatum_response_mission: "Ultimatum Response Window"
sov_nuclear_bombs_ultimatum_response_mission_desc: "The selected government has a limited response window. Its answer is recorded as compliance, partial settlement, delay, or refusal."
sov_nuclear_bombs_enforcement_window_mission: "Refused Demand"
sov_nuclear_bombs_enforcement_window_mission_desc: "[sov_nuclear_bombs_coercion_target.GetName] has refused the Soviet demand. Before this window closes the Union must enforce it with a limited strike, back it with a demonstration and renew it, or withdraw it. If nothing is done, the demand lapses and counts as a withdrawal."
sov_nuclear_bombs_strike_preparation_mission: "Strike Preparation Window"
sov_nuclear_bombs_strike_preparation_mission_desc: "The selected strike remains in preparation while certification, target validity, reserve custody, and command authorization are checked."
sov_nuclear_bombs_retaliation_window_mission: "Retaliation Window"
sov_nuclear_bombs_retaliation_window_mission_desc: "A confirmed nuclear crisis gives the command board time to preserve the reserve, limit the profile, open a hotline, or authorize a verified response."
sov_nuclear_bombs_rail_corridor_security_mission: "Rail Corridor Security"
sov_nuclear_bombs_rail_corridor_security_mission_desc: "The selected route remains under armed guard while custody records and physical devices are moved or recovered."
sov_nuclear_bombs_breakaway_operationalization_mission: "Preparing the Breakaway Arsenal"
sov_nuclear_bombs_breakaway_operationalization_mission_desc: "The breakaway must train technicians at [?sov_nuclear_bombs_local_custody_state.GetName], establish its own release command, and prepare delivery crews in separate stages. Access belongs to this depot and its current custodian. Joint custody or a change of holder interrupts the work. Soviet release authority remains unavailable to it."
sov_nuclear_bombs_joint_custody_transfer_mission: "Joint Custody Transfer"
sov_nuclear_bombs_joint_custody_transfer_mission_desc: "Soviet and local authorities are negotiating a monitored custody arrangement for a registered device group."
sov_nuclear_bombs_dismantlement_inspection_mission: "Dismantlement Inspection"
sov_nuclear_bombs_dismantlement_inspection_mission_desc: "Inspectors verify that the selected device group is dismantled without detonation and remains reconciled."

sov_nuclear_bombs.event_log.evolution_type: "Nuclear Escalation"
sov_nuclear_bombs.event_log.detail: "Soviet bombers, guarded depots, and reactor crews support a growing atomic arsenal. Moscow can use it to threaten another government. Custody disputes and a foreign nuclear response could strain its command chain."
sov_nuclear_bombs.evolution.i.title: "The Wider Nuclear Race"
sov_nuclear_bombs.evolution.i.stage: "Evolution I: Wider Nuclear Race"
sov_nuclear_bombs.evolution.i.body: "The Soviet breakthrough has become an international race. Reactor compounds, production batches, observers, and bomber patrols turn the hidden arsenal into a permanent state program."
sov_nuclear_bombs.evolution.ii.title: "Coercive Doctrine"
sov_nuclear_bombs.evolution.ii.stage: "Evolution II: Coercive Doctrine"
sov_nuclear_bombs.evolution.ii.body: "Moscow has begun sending nuclear-backed demands to independent minor governments and eligible breakaways. Their leaders can comply, seek foreign support, or face a strike while Soviet crews prepare the delivery route."
sov_nuclear_bombs.evolution.iii.title: "Nuclear War Becomes Possible"
sov_nuclear_bombs.evolution.iii.stage: "Evolution III: Nuclear War Becomes Possible"
sov_nuclear_bombs.evolution.iii.body: "Another nuclear major can answer a Soviet strike. Hotline crews and bomber commands work through short retaliation windows while both governments decide whether to limit the response or widen the exchange."
sov_nuclear_bombs.evolution.iv.title: "Unrestrained Release"
sov_nuclear_bombs.evolution.iv.stage: "Evolution IV: Unrestrained Release"
sov_nuclear_bombs.evolution.iv.body: "The Soviet command can prepare its widest response profiles only during an extreme strategic emergency. A verified stand-down can still halt the order."
sov_nuclear_bombs.evolution.summary: "The Soviet nuclear escalation begins with one hundred guarded devices. As the crisis deepens, the arsenal and reactor network can expand, but custody, command authority, and verified delivery govern every physical action."

chaosx_super_event.108.t: "The Exchange Has Begun"
chaosx_super_event.108.q: "The first blow or series of first blows may be the last."
chaosx_super_event.108.a: "The exchange has begun."
chaosx_super_event.108.d: "Confirmed detonations have crossed between nuclear powers. Telephone lines fail under competing orders, evacuation trains leave the cities, and retaliation staffs prepare further strikes. Commanders can still restrict the response or accept a reciprocal stand-down. Each launch shortens that interval, and fallout follows every blast."

sov_nuclear_bombs.event_details.description: "The Soviet atomic arsenal is governed through production, testing, coercion, and disputed custody. Every weapon remains tied to a physical depot, a command authority, trained delivery crews, and a release order. A Soviet collapse may scatter the stockpile among successor authorities, but possession alone does not provide the knowledge or command structure needed to launch it. Any confirmed detonation can bring fallout, condemnation, and retaliation far beyond its target."
sov_nuclear_bombs.event_details.status.exchange: "\nStatus: An exchange between nuclear powers is active. Retaliation and a reciprocal stand-down remain possible."
sov_nuclear_bombs.event_details.status.moratorium: "\nStatus: Atomic Moratorium. Release orders are sealed pending verified accounting."
sov_nuclear_bombs.event_details.status.collapse: "\nStatus: Soviet collapse has opened a custody crisis. Disputed depots remain physically held but not operational to a breakaway authority."
sov_nuclear_bombs.event_details.status.active: "\nStatus: Soviet atomic command is active. The current phase is recorded in the event ledger."
sov_nuclear_bombs.event_details.status.custody: "\nStatus: A custody transfer has been recorded. The devices await reconciliation."
sov_nuclear_bombs.event_details.status.recorded: "\nStatus: The Soviet atomic arsenal has entered the historical record."
sov_nuclear_bombs.event_details.status.none: ""

023_sov_nuclear_bombs_achievement_eligible_tooltip: "Available to the Soviet Union while its atomic command remains active, before terminal nuclear collapse or the loss of normal command authority."
023_sov_nuclear_bombs_a_hundred_suns_NAME: "A Hundred Suns"
023_sov_nuclear_bombs_a_hundred_suns_DESC: "Keep a hundred usable devices accounted for while the Soviet command reaches peak readiness."
023_sov_nuclear_bombs_a_hundred_suns_tooltip: "Maintain at least [?constant:sov_nuclear_bombs_achievement.min_usable_devices|0] accounted operational or assigned Soviet devices, reach [?constant:sov_nuclear_bombs_achievement.min_readiness|0] Readiness, and leave no device unaccounted for."
023_sov_nuclear_bombs_a_hundred_suns_locked: "The arsenal has not reached a hundred accounted devices at peak readiness."

023_sov_nuclear_bombs_the_bomb_never_fell_NAME: "The Bomb Never Fell"
023_sov_nuclear_bombs_the_bomb_never_fell_DESC: "Make deterrence visible, survive a serious crisis, and let the arsenal fall silent."
023_sov_nuclear_bombs_the_bomb_never_fell_tooltip: "Reach Evolution II, complete a public demonstration, survive a serious nuclear crisis, and verify an Atomic Moratorium with complete accounting and no Soviet combat detonations."
023_sov_nuclear_bombs_the_bomb_never_fell_locked: "Deterrence has not endured a serious crisis without a combat detonation."

023_sov_nuclear_bombs_ultimatum_without_ash_NAME: "Ultimatum Without Ash"
023_sov_nuclear_bombs_ultimatum_without_ash_DESC: "Force an independent government to settle without burning the target."
023_sov_nuclear_bombs_ultimatum_without_ash_tooltip: "Issue a meaningful ultimatum to an independent non-subject, record full or partial compliance through the response window, verify the settlement, and never detonate against that target."
023_sov_nuclear_bombs_ultimatum_without_ash_locked: "The ultimatum has not produced a durable settlement without fire."

023_sov_nuclear_bombs_scattered_arsenal_NAME: "Scattered Arsenal"
023_sov_nuclear_bombs_scattered_arsenal_DESC: "Recover a scattered arsenal and bring every custody record back into the books."
023_sov_nuclear_bombs_scattered_arsenal_tooltip: "Resolve custody crises across at least [?constant:sov_nuclear_bombs_achievement.min_breakaway_actors|0] breakaway authorities, including a negotiated or monitored resolution. Recover or dismantle every disputed device, keep all devices accounted for, restore Command Integrity to [?constant:sov_nuclear_bombs_achievement.min_integrity_scattered|0], and leave no breakaway arsenal operational."
023_sov_nuclear_bombs_scattered_arsenal_locked: "Custody, negotiated recovery, or restored command still needs verification."

023_sov_nuclear_bombs_firebreak_NAME: "Firebreak"
023_sov_nuclear_bombs_firebreak_DESC: "Stop a major exchange at the telephone before it becomes a general nuclear exchange."
023_sov_nuclear_bombs_firebreak_tooltip: "After a confirmed exchange between nuclear majors, verify a reciprocal stand-down involving at least [?constant:sov_nuclear_bombs_achievement.min_nuclear_majors|0] nuclear majors without a violation, before General Exchange or terminal Fallout begins."
023_sov_nuclear_bombs_firebreak_locked: "The exchange has not been stopped before the firebreak failed."

023_sov_nuclear_bombs_first_and_last_NAME: "First and Last"
