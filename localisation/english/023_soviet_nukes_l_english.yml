sov_nuclear_bombs_hidden_arsenal: "Hidden Atomic Arsenal"
sov_nuclear_bombs_hidden_arsenal_desc: "A secret reserve keeps the arsenal under close political and scientific custody while its delivery network remains limited. Current readiness: [?sov_nuclear_bombs_readiness|0]. Command integrity: [?sov_nuclear_bombs_integrity|0]."
sov_nuclear_bombs_demonstrative_deterrence: "Demonstrative Deterrence"
sov_nuclear_bombs_demonstrative_deterrence_desc: "A confirmed demonstration gives the arsenal public credibility and makes every later test or demand a diplomatic act. Current readiness: [?sov_nuclear_bombs_readiness|0]. Command integrity: [?sov_nuclear_bombs_integrity|0]."
sov_nuclear_bombs_coercive_posture: "Coercive Nuclear Posture"
sov_nuclear_bombs_coercive_posture_desc: "Moscow backs its demands with the atomic arsenal. The threatened government can concede, resist, or seek a foreign guarantee. Current readiness: [?sov_nuclear_bombs_readiness|0]. Command integrity: [?sov_nuclear_bombs_integrity|0]."
sov_nuclear_bombs_retaliatory_posture: "Retaliatory Release Command"
sov_nuclear_bombs_retaliatory_posture_desc: "Survivable command, warning channels, and limited response profiles keep retaliation possible without making every warning a general exchange. Current readiness: [?sov_nuclear_bombs_readiness|0]. Command integrity: [?sov_nuclear_bombs_integrity|0]."
sov_nuclear_bombs_unrestrained_posture: "Unrestrained Release"
sov_nuclear_bombs_unrestrained_posture_desc: "The arsenal is prepared for the most dangerous release decisions, but a valid target and a completed authorization remain necessary. Current readiness: [?sov_nuclear_bombs_readiness|0]. Command integrity: [?sov_nuclear_bombs_integrity|0]."
sov_nuclear_bombs_atomic_moratorium: "Atomic Moratorium"
sov_nuclear_bombs_atomic_moratorium_desc: "Release orders are suspended while the Soviet ledger, custody chain, and any reciprocal stand-down are verified. Current readiness: [?sov_nuclear_bombs_readiness|0]. Command integrity: [?sov_nuclear_bombs_integrity|0]."
sov_nuclear_bombs_broken_chain: "Broken Nuclear Chain"
sov_nuclear_bombs_broken_chain_desc: "Registered devices are divided among damaged command channels and contested depots. Physical custody does not grant immediate technical or delivery access. Current readiness: [?sov_nuclear_bombs_readiness|0]. Command integrity: [?sov_nuclear_bombs_integrity|0]."

