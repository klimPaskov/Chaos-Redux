FER_independence_wave_constitutional_party: "Far Eastern Civic Congress"
FER_independence_wave_constitutional_party_long: "Constitutional Congress of the Far Eastern Railway Compact"
FER_independence_wave_socialist_party: "Far Eastern Coastal Councils"
FER_independence_wave_socialist_party_long: "Congress of Far Eastern Coastal and Workers' Councils"
FER_independence_wave_railway_charter_party: "Far Eastern Railway Compact"
FER_independence_wave_railway_charter_party_long: "Railway and Village Compact of the Far Eastern Republic"
FER_independence_wave_emergency_party: "Railway Security Directorate"
FER_independence_wave_emergency_party_long: "Railway Security Directorate of the Far Eastern Republic"
FER_democratic_party: "Democratic Party of the Far Eastern Republic"
FER_democratic_party_long: "Democratic Party of the Far Eastern Republic"
FER_communism_party: "Communist Party of the Far Eastern Republic"
FER_communism_party_long: "Communist Party of the Far Eastern Republic"
FER_neutrality_party: "Neutral Railway Charter Party"
FER_neutrality_party_long: "Neutral Railway Charter Party of the Far Eastern Republic"
FER_fascism_party: "Emergency Security Directorate"
FER_fascism_party_long: "Emergency Security Directorate of the Far Eastern Republic"


fer_fragmented_railway_mandate: "Fragmented Railway Mandate"
fer_fragmented_railway_mandate_desc: "Village councils, railway workers, railway settlements, and local guards recognize the provisional government without accepting one common authority."
fer_railway_compact: "Far Eastern Railway Compact"
fer_railway_compact_desc: "A common congress and coastal administration bind the Far Eastern Republic's settlements, depots, railways, and guards under one government."
fer_railway_council_charter: "Railway Congress Charter"
fer_railway_council_charter_desc: "An elected congress protects local representation while directing the civic administration of the Far Eastern Republic."
fer_coastal_councils: "Coastal Councils"
fer_coastal_councils_desc: "Workers' councils coordinate the railways, workshops, railway industries, and public services of the republic."
fer_community_register: "Far Eastern Community Register"
fer_community_register_desc: "The government records each settlement's representation, land rights, public duties, and access to local resources."
fer_railway_charter_compact: "Railway Land Compact"
fer_railway_charter_compact_desc: "Village delegates and cooperatives protect farmland, railway use, recruitment, and local administration."
fer_coastal_emergency_command: "Railway Emergency Command"
fer_coastal_emergency_command_desc: "A unified staff directs coastal guards and depot reserves while civil councils maintain supply and relief."

independence_wave_fer_railway_compact_category: "Far Eastern Railway Compact"
independence_wave_fer_railway_compact_category_desc: "Congress Cohesion: §Y[?independence_wave_fer_congress_cohesion|0]§! / [?constant:independence_wave_fer_pressure.maximum|0]\nRail Security: §Y[?independence_wave_fer_rail_security|0]§! / [?constant:independence_wave_fer_pressure.maximum|0]\nRaise both values to [?constant:independence_wave_fer_pressure.stable|0] to stabilize the compact."
independence_wave_fer_hold_railway_council: "Hold the Far Eastern Railway Congress Together"
independence_wave_fer_hold_railway_council_desc: "Within [?constant:independence_wave_fer_duration.founding_crisis|0] days, install a government, raise both compact values to [?constant:independence_wave_fer_pressure.stable|0], and keep the selected FER anchor owned and controlled."
independence_wave_fer_secure_railway_ports: "Secure the Railway Depots"
independence_wave_fer_secure_railway_ports_desc: "Place the capital's stores, railway registers, and depot guards under a civil authority that can supply the compact."
independence_wave_fer_integrate_coastal_guards: "Integrate the Coastal Guards"
independence_wave_fer_integrate_coastal_guards_desc: "Unify local guards under a railway command while preserving the community agreements that supply and recruit them."
independence_wave_fer_register_fer_communities: "Register the Far Eastern Communities"
independence_wave_fer_register_fer_communities_desc: "Record each settlement's representation, land rights, public duties, and access to railway resources."
independence_wave_fer_settle_former_host_ledgers: "Settle the Former Host Ledgers"
independence_wave_fer_settle_former_host_ledgers_desc: "Resolve the property, border, population, and recognition claims inherited from the former administration. If negotiations collapse, the Far Eastern Republic will close the claims locally."
independence_wave_fer_ratify_constitutional_autonomy: "Ratify Constitutional Autonomy"
independence_wave_fer_ratify_constitutional_autonomy_desc: "Give the Railway Congress a binding charter, elected administration, and guarantees for Far Eastern communities."
independence_wave_fer_adopt_railway_charter_compact: "Adopt the Railway Land Compact"
independence_wave_fer_adopt_railway_charter_compact_desc: "Entrust village delegates and cooperatives with farmland, railway use, recruitment, and local administration."
independence_wave_fer_convene_coastal_councils: "Convene the Coastal Councils"
independence_wave_fer_convene_coastal_councils_desc: "Place railways, workshops, railway industries, and municipal services under a congress of workers' councils."
independence_wave_fer_establish_coastal_emergency_command: "Establish the Railway Emergency Command"
independence_wave_fer_establish_coastal_emergency_command_desc: "Unify the coastal guards under an emergency staff and secure the river and railway approaches to the capital."
independence_wave_fer_codify_durable_sovereignty: "Codify Durable Sovereignty"
independence_wave_fer_codify_durable_sovereignty_desc: "Turn the settled founding compact, stable institutions, and route government into a durable Far Eastern state."
independence_wave_fer_open_pacific_corridor: "Open the Pacific Corridor"
independence_wave_fer_open_pacific_corridor_desc: "Exchange supplies, officers, and diplomatic access with other network states along the Pacific railway."

independence_wave_fer_ports_effect_tt: "Congress Cohesion rises by §Y[?constant:independence_wave_fer_pressure.major_gain|0]§!. Railway Readiness rises by §Y[?constant:independence_wave_fer_pressure.minor_gain|0]§!. The compact also strengthens its civil administration."
independence_wave_fer_coastal_guards_effect_tt: "Congress Cohesion rises by §Y[?constant:independence_wave_fer_pressure.minor_gain|0]§!. Railway Readiness rises by §Y[?constant:independence_wave_fer_pressure.major_gain|0]§!. The compact also strengthens its security administration."
independence_wave_fer_communities_effect_tt: "Congress Cohesion rises by §Y[?constant:independence_wave_fer_pressure.major_gain|0]§!. Railway Readiness rises by §Y[?constant:independence_wave_fer_pressure.standard_gain|0]§!. The Far Eastern Community Register is established."
independence_wave_fer_host_ledgers_effect_tt: "Congress Cohesion and Railway Readiness each rise by §Y[?constant:independence_wave_fer_pressure.standard_gain|0]§!. Negotiations settle the outstanding claims with the former host."
independence_wave_fer_host_loss_effect_tt: "The former-host claims close locally. Congress Cohesion and Railway Readiness each rise by §Y[?constant:independence_wave_fer_pressure.standard_gain|0]§!. No bilateral host values change."
independence_wave_fer_constitutional_route_effect_tt: "The Far Eastern Civic Congress takes office. Congress Cohesion rises by §Y[?constant:independence_wave_fer_pressure.major_gain|0]§! and Railway Readiness rises by §Y[?constant:independence_wave_fer_pressure.minor_gain|0]§!."
independence_wave_fer_railway_charter_route_effect_tt: "The Far Eastern Railway Compact takes office. Congress Cohesion rises by §Y[?constant:independence_wave_fer_pressure.major_gain|0]§! and Railway Readiness rises by §Y[?constant:independence_wave_fer_pressure.standard_gain|0]§!."
independence_wave_fer_coastal_council_route_effect_tt: "The Far Eastern Coastal Councils take office. Congress Cohesion rises by §Y[?constant:independence_wave_fer_pressure.minor_gain|0]§! and Railway Readiness rises by §Y[?constant:independence_wave_fer_pressure.major_gain|0]§!."
independence_wave_fer_coastal_emergency_route_effect_tt: "The Railway Security Directorate takes office. Railway Readiness rises by §Y[?constant:independence_wave_fer_pressure.decisive_gain|0]§! and Congress Cohesion falls by §R[?constant:independence_wave_fer_pressure.minor_gain|0]§!."
independence_wave_fer_sovereignty_effect_tt: "Legitimacy, Recognition, and State Capacity rise. The compact also gains Security and reduces Instability."
independence_wave_fer_network_effect_tt: "Congress Cohesion and Railway Readiness each rise by §Y[?constant:independence_wave_fer_pressure.standard_gain|0]§!. Network Standing, League Cohesion, Common Cause, Shared Reserve, and Member Confidence rise."
independence_wave_fer_project_failure_effect_tt: "Congress Cohesion and Railway Readiness each fall by §R[?constant:independence_wave_fer_pressure.standard_gain|0]§!. Legitimacy, Recognition, State Capacity, and Security fall. Instability rises."

