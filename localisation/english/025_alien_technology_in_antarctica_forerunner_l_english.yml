chaosx.nr25.260.t: "Forerunner Craft"
chaosx.nr25.261.t: "The Forerunner Craft"
chaosx.nr25.261.d: "While the expeditions fight the ice, a smaller craft has come down far from Antarctica. Air force crews reached it before anyone else and towed the hull into a closed hangar at one of our airbases. It carries no markings, its occupants never answered a signal, and the engineers who opened its engine bay say the airframe does things our designers have only drawn on paper."
chaosx.nr25.261.a: "Put our best aircraft designers on it."
chaosx.nr25.261.b: "Match the craft against what we already recovered."
chaosx.nr25.261.c: "Seal the hangar until the readings make sense."
chaosx.news.41.t: "A Craft Nobody Built"
chaosx.news.41.d: "An aircraft of unknown design has been recovered by [From.GetName]. Its crew never answered a signal, and the hangar where it now stands is guarded day and night. Engineers abroad are already asking how much of it can be copied."
chaosx.news.41.a: "Someone will build one soon."
