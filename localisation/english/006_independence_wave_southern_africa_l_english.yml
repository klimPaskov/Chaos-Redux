# Southern Africa and Indian Ocean framework packages.
independence_wave_fax_institution: "Sultanates' Council"
independence_wave_fax_institution_long: "Council of the Comoro Sultanates"
independence_wave_fbx_institution: "Council of Government"
independence_wave_fbx_institution_long: "Mauritian Council of Government"

# Barotseland
independence_wave_bar_kuta_category: "The Barotse Kuta"
independence_wave_bar_kuta_category_desc: "Barotseland governs itself under its Litunga. The Kuta, the Lozi national council, sits divided between the old capital and the provincial courts."
independence_wave_bar_convene_national_kuta: "Convene the National Kuta"
independence_wave_bar_convene_national_kuta_desc: "Call the councillors of the Saa-Sikalo Kuta and the provincial courts to Lealui to sit as one national council under the Litunga."
independence_wave_bar_convene_national_kuta_tt: "Replaces §YThe Divided Kuta§! with §YThe National Kuta§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_bar_restore_floodplain_canals: "Restore the Floodplain Canals"
independence_wave_bar_restore_floodplain_canals_desc: "Clear and extend the drainage canals that Lewanika's labor gangs dug across the Zambezi floodplain."
independence_wave_bar_restore_floodplain_canals_tt: "Adds §YThe Floodplain Canals§! and raises §YCapacity§!."
independence_wave_bar_regulate_mine_contracts: "Regulate the Mine Labor Contracts"
independence_wave_bar_regulate_mine_contracts_desc: "Require every recruiter to register with the Kuta, pay a deposit and bring the men home at the end of their contracts."
independence_wave_bar_regulate_mine_contracts_tt: "Raises §YRecognition§! and §YLegitimacy§!."
independence_wave_bar_divided_kuta: "The Divided Kuta"
independence_wave_bar_divided_kuta_desc: "The national council and the provincial courts each claim the last word, and the floods cut the plain off from the capital for half the year."
independence_wave_bar_national_kuta: "The National Kuta"
independence_wave_bar_national_kuta_desc: "The Kuta sits as one national council under the Litunga and its decisions bind the provincial courts."
independence_wave_bar_floodplain_canals: "The Floodplain Canals"
independence_wave_bar_floodplain_canals_desc: "Restored canals drain the gardens of the Zambezi floodplain and carry the barges between the villages."
independence_wave_bar_kuta_convened: "The National Kuta has been convened"

# Madagascar
independence_wave_mad_island_category: "The Malagasy Settlement"
independence_wave_mad_island_category_desc: "Madagascar governs itself again. The Antananarivo highlands and the coastal peoples distrust each other's leaders, and the island's trade rides on one railway to the sea."
independence_wave_mad_convene_malagasy_assembly: "Convene the Malagasy Assembly"
independence_wave_mad_convene_malagasy_assembly_desc: "Seat elected members from the highland and coastal provinces in one assembly at Antananarivo, with seats balanced between them."
independence_wave_mad_convene_malagasy_assembly_tt: "Replaces §YThe Highlands and the Coast§! with §YThe Malagasy Assembly§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_mad_open_tamatave_line: "Open the Tamatave Line"
independence_wave_mad_open_tamatave_line_desc: "Run the railway from Antananarivo to the port of Tamatave under the island's own management and customs."
independence_wave_mad_open_tamatave_line_tt: "Adds §YThe Tamatave Line§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_mad_recall_vvs_exiles: "Recall the VVS Exiles"
independence_wave_mad_recall_vvs_exiles_desc: "Pardon and recall the members of the Vy Vato Sakelika, the nationalist society suppressed in 1915, and give them places in the new institutions."
independence_wave_mad_recall_vvs_exiles_tt: "Greatly raises §YLegitimacy§!, lowers §YRecognition§! abroad and raises §YInstability§!."
independence_wave_mad_highlands_and_coast: "The Highlands and the Coast"
independence_wave_mad_highlands_and_coast_desc: "The highland provinces and the coastal peoples each fear that the other will govern the island alone."
independence_wave_mad_malagasy_assembly: "The Malagasy Assembly"
independence_wave_mad_malagasy_assembly_desc: "Members from the highlands and the coast sit in one assembly with seats balanced between them."
independence_wave_mad_tamatave_line: "The Tamatave Line"
independence_wave_mad_tamatave_line_desc: "The railway from Antananarivo to Tamatave runs under the island's own management."
independence_wave_mad_assembly_convened: "The Malagasy Assembly has been convened"

# Incidents
chaosx.nr6.226.t: "The Kuomboka"
chaosx.nr6.226.d: "The floods are rising, and the court must move from Lealui to the high ground at Limulunga. The royal barge Nalikwanda needs new paddles, drums and crews."
chaosx.nr6.226.a: "Fund the royal barge"
chaosx.nr6.226.b: "Hold a smaller crossing"
chaosx.nr6.227.t: "Cattle Sickness on the Plain"
chaosx.nr6.227.d: "Lung sickness has broken out among the herds of the plain. Quarantine would stop the cattle trade for a season, but selling now would spread the disease."
chaosx.nr6.227.a: "Quarantine the herds"
chaosx.nr6.227.b: "Sell the herds before the ban"
chaosx.nr6.228.t: "The Vanilla Planters"
chaosx.nr6.228.d: "The vanilla planters of the north-east sell to whoever pays first, and buyers abroad complain of green, badly cured pods. The cabinet proposes export grades."
chaosx.nr6.228.a: "Set export grades"
chaosx.nr6.228.b: "Let the planters sell freely"
chaosx.nr6.229.t: "The Rova Question"
chaosx.nr6.229.d: "Highland notables want the royal palace at Antananarivo restored as a national monument. Coastal members of the assembly see it as a claim to rule the whole island."
chaosx.nr6.229.a: "Restore the Rova"
chaosx.nr6.229.b: "Keep the palace closed"
