l_english:
utopia_manifesto_tree: "The Utopia Manifesto"
utopia_manifesto_tree_desc: "A recovered book becomes a national argument about provision, local assent, useful work, and the terms on which one place may call another necessary."

utopia_manifesto_recover_the_manuscript: "Recover the Manuscript"
utopia_manifesto_recover_the_manuscript_desc: "Archivists, printers, and surveyors will turn a recovered book into a public undertaking, opening the Ledger and the first national inquiries."
utopia_manifesto_a_public_edition: "A Public Edition"
utopia_manifesto_a_public_edition_desc: "A common translation will pass through reading rooms and workshops, allowing the country to argue over its promises in daylight."
utopia_manifesto_count_houses_and_hands: "Count Houses and Hands"
utopia_manifesto_count_houses_and_hands_desc: "The survey will count homes, hands, skills, roads, and stores, giving every public promise a visible starting measure."
utopia_manifesto_the_first_common_store: "The First Common Store"
utopia_manifesto_the_first_common_store_desc: "A capital depot with open books will test whether common provision can reach the household before shortage becomes a habit."
utopia_manifesto_agriculture_for_all: "Agriculture for All"
utopia_manifesto_agriculture_for_all_desc: "Basic cultivation and civil-response training will let every household reinforce the food supply when harvests or transport fail."
utopia_manifesto_convene_the_interpretive_congress: "Convene the Interpretive Congress"
utopia_manifesto_convene_the_interpretive_congress_desc: "Households, councils, planners, and disciplinarians will defend their readings before the country chooses how provision should be governed."
utopia_manifesto_an_interim_charter: "An Interim Charter"
utopia_manifesto_an_interim_charter_desc: "Temporary rules for property, rationing, local authority, and emergency service will keep the founding argument within a public legal order."
utopia_manifesto_the_country_as_a_question: "The Country as a Question"
utopia_manifesto_the_country_as_a_question_desc: "The survey has made the country's contradictions visible. The congress must decide what kind of commonwealth can answer them."
utopia_manifesto_household_gives_consent: "The Household Gives Consent"
utopia_manifesto_household_gives_consent_desc: "Reform will require local assent, protect lawful exit, and treat the household as the first author of public obligation."
utopia_manifesto_free_callings: "Free Callings"
utopia_manifesto_free_callings_desc: "Open recruitment, paid training, and the right to change trades will answer shortages without making an occupation hereditary."
utopia_manifesto_municipal_charters: "Municipal Charters"
utopia_manifesto_municipal_charters_desc: "Elected municipalities will govern local stores and works under charters that protect minorities, worship, and public objection."
utopia_manifesto_paid_public_lectures: "Paid Public Lectures"
utopia_manifesto_paid_public_lectures_desc: "Evening lectures will pay workers for the time spent learning new callings and studying the institutions that govern them."
utopia_manifesto_transparent_store_accounts: "Transparent Store Accounts"
utopia_manifesto_transparent_store_accounts_desc: "Storekeepers will publish receipts, losses, queues, and reserves so every guarantee can be tested against the shelves."
utopia_manifesto_independent_need_review: "Independent Need Review"
utopia_manifesto_independent_need_review_desc: "An independent chamber will judge whether a territorial or rationing claim answers real need and whether peaceful alternatives remain."
utopia_manifesto_cooperative_land_trusts: "Cooperative Land Trusts"
utopia_manifesto_cooperative_land_trusts_desc: "Community trusts will hold land for housing and services while protecting homes, small farms, and lawful enterprise."
utopia_manifesto_constitution_of_provision: "A Constitution of Provision"
utopia_manifesto_constitution_of_provision_desc: "Minimum provision, lawful rationing, local appeal, and the right to leave will become constitutional guarantees."
utopia_manifesto_voluntary_commonwealth_league: "A Voluntary Commonwealth League"
utopia_manifesto_voluntary_commonwealth_league_desc: "Small states and municipalities may pool stores and aid through a compact that preserves every member's sovereignty and vote."
utopia_manifesto_commonwealth_by_consent: "Commonwealth by Consent"
utopia_manifesto_commonwealth_by_consent_desc: "A commonwealth of households will bind social guarantees to local assent, making public provision answerable to those who receive and sustain it."
utopia_manifesto_nothing_private_in_necessity: "Nothing Private in Necessity"
utopia_manifesto_nothing_private_in_necessity_desc: "Land, transport, and strategic industry that sustain common necessity will pass into collective stewardship through an ordered transition."
utopia_manifesto_councils_of_callings: "Councils of Callings"
utopia_manifesto_councils_of_callings_desc: "Each calling will elect delegates to negotiate shortages, training, production, and the demands placed on its members."
utopia_manifesto_the_common_table: "The Common Table"
utopia_manifesto_the_common_table_desc: "Public kitchens and common stores will make equal provision visible in the daily meal, even as privileged consumption resists."
utopia_manifesto_social_workshops: "Social Workshops"
utopia_manifesto_social_workshops_desc: "Federated workshops will share tools, repairs, and designs under worker management, turning scattered production into a common capacity."
utopia_manifesto_council_property_transition: "The Council Property Transition"
utopia_manifesto_council_property_transition_desc: "Registers, compensation, and council administration will carry major property into common ownership without leaving fields or machines idle."
utopia_manifesto_delegates_under_recall: "Delegates Under Recall"
utopia_manifesto_delegates_under_recall_desc: "Delegates will carry written mandates, face recall, and rotate before public office becomes another permanent calling."
utopia_manifesto_congress_of_communes: "Congress of Communes"
utopia_manifesto_congress_of_communes_desc: "Communes and calling councils will meet in a national congress whose authority rises from their recorded mandates."
utopia_manifesto_council_autonomy: "Council Autonomy"
utopia_manifesto_council_autonomy_desc: "Local councils will retain control of production and stores, accepting slower coordination to preserve worker judgment."
utopia_manifesto_emergency_central_plan: "The Emergency Central Plan"
utopia_manifesto_emergency_central_plan_desc: "A temporary central plan will direct reserves and output through the crisis, placing speed above council discretion."
utopia_manifesto_union_of_tables: "The Union of Tables"
utopia_manifesto_union_of_tables_desc: "The tables, councils, workshops, and reserve trains will form a union governed through common ownership and recallable authority."
utopia_manifesto_country_measured: "The Country Measured"
utopia_manifesto_country_measured_desc: "Surveyors and planners will receive authority to map need, capacity, housing, and transport into one national account."
utopia_manifesto_standard_houses: "Standard Houses"
utopia_manifesto_standard_houses_desc: "Modular homes with water, heat, and public services will shorten construction, provided local life is not designed out."
utopia_manifesto_tables_of_need: "Tables of Need"
utopia_manifesto_tables_of_need_desc: "National input and output tables will connect household demand to stores, workshops, transport, and labor."
utopia_manifesto_board_of_measure: "The Board of Measure"
utopia_manifesto_board_of_measure_desc: "A Board of Measure will appoint specialists, publish standards, and carry responsibility for the plans made in its name."
utopia_manifesto_shortage_forecasting: "Shortage Forecasting"
utopia_manifesto_shortage_forecasting_desc: "Forecast offices will watch harvests, inventories, rail traffic, and callings so shortages can be answered before queues form."
utopia_manifesto_cities_in_series: "Cities in Series"
utopia_manifesto_cities_in_series_desc: "Linked towns will specialize without isolation, joining housing, clinics, workshops, gardens, and railways under common standards."
utopia_manifesto_useful_freedom: "Useful Freedom"
utopia_manifesto_useful_freedom_desc: "Appeals, professional independence, and protected private life will set humane limits on the planners' reach."
utopia_manifesto_exact_obedience: "Exact Obedience"
utopia_manifesto_exact_obedience_desc: "Central quotas and compulsory placement will force the plan through delay, giving every shortage an answer and every worker an assignment."
utopia_manifesto_technical_missions: "Technical Missions"
utopia_manifesto_technical_missions_desc: "Surveyors, engineers, and physicians will carry planning methods abroad, offering practical partnership before political allegiance."
utopia_manifesto_perfect_measure: "The Perfect Measure"
utopia_manifesto_perfect_measure_desc: "A measured commonwealth aligns reserves, cities, and callings under a technical order whose legitimacy rests on accurate accounts."
utopia_manifesto_one_island_one_measure: "One Island, One Measure"
utopia_manifesto_one_island_one_measure_desc: "The state will declare unity, service, and obedience the price of provision within a sealed national household."
utopia_manifesto_households_of_service: "Households of Service"
utopia_manifesto_households_of_service_desc: "Housing, training, and ration priority will follow assigned service, binding each household to an official calling."
utopia_manifesto_the_closed_store: "The Closed Store"
utopia_manifesto_the_closed_store_desc: "Ration cards and guarded depots will reserve the common stock for insiders and harden the country against blockade."
utopia_manifesto_penal_works: "Penal Works"
utopia_manifesto_penal_works_desc: "The state will establish penal-work bureaus able to attach guarded labor columns to active district construction. Each use must still be ordered, supplied, and entered in the public record."
utopia_manifesto_auxiliary_contracts: "Auxiliary Contracts"
utopia_manifesto_auxiliary_contracts_desc: "Foreign auxiliaries will bear campaigns the citizen army cannot, at the price of equipment, leverage, and doubtful loyalty."
utopia_manifesto_natural_right_of_need: "The Natural Right of Need"
utopia_manifesto_natural_right_of_need_desc: "Need will be declared a natural title over underused ground, shortening the road from survey to demand."
utopia_manifesto_assigned_colonies: "Assigned Colonies"
utopia_manifesto_assigned_colonies_desc: "Dependent territories will be organized for service, supplied enough to function and denied the right to choose their future."
utopia_manifesto_cut_the_channel: "Cut the Channel"
utopia_manifesto_cut_the_channel_desc: "Fortifications, controlled transport, and waterworks will manufacture a political island even where geography offers no channel."
utopia_manifesto_perfect_island: "The Perfect Island"
utopia_manifesto_perfect_island_desc: "The bounded state will complete its stores, service households, outposts, and defenses under a single compulsory measure."
utopia_manifesto_read_island_as_a_mirror: "Read the Island as a Mirror"
utopia_manifesto_read_island_as_a_mirror_desc: "The island will be read as a mirror for bad institutions, leaving every useful reform open to criticism and revision."
utopia_manifesto_institutions_that_can_be_left: "Institutions That Can Be Left"
utopia_manifesto_institutions_that_can_be_left_desc: "Lawful exit, municipal experiments, and independent review will ensure that a failed institution can be abandoned without treason."
utopia_manifesto_a_mixed_commonwealth: "A Mixed Commonwealth"
utopia_manifesto_a_mixed_commonwealth_desc: "Land trusts, cooperatives, public options, and regulated enterprise will share responsibility for a secure social floor."
utopia_manifesto_sunset_clauses: "Sunset Clauses"
utopia_manifesto_sunset_clauses_desc: "Emergency rules and experimental bodies will expire unless public review can justify their renewal."
utopia_manifesto_satire_in_government: "Satire in Government"
utopia_manifesto_satire_in_government_desc: "Critics will be protected as civic witnesses who expose vanity, contradiction, and the dangerous worship of plans."
utopia_manifesto_public_audit: "Public Audit"
utopia_manifesto_public_audit_desc: "Independent auditors will trace claims from public promise to storehouse, district, contract, and consequence."
utopia_manifesto_reform_without_paradise: "Reform Without Paradise"
utopia_manifesto_reform_without_paradise_desc: "The country will pursue housing, care, education, and provision without claiming that one perfect design can end political judgment."
utopia_manifesto_good_place_that_admits_its_limits: "A Good Place That Admits Its Limits"
utopia_manifesto_good_place_that_admits_its_limits_desc: "A practical commonwealth will secure a social floor, preserve plural institutions, and admit that every settlement remains revisable."
utopia_manifesto_every_hand_knows_the_soil: "Every Hand Knows the Soil"
utopia_manifesto_every_hand_knows_the_soil_desc: "Universal agricultural and emergency training will give every citizen a practical skill for harvest, shortage, and disaster."
utopia_manifesto_schools_of_calling: "Schools of Calling"
utopia_manifesto_schools_of_calling_desc: "Vocational schools will join workshop practice to public learning, preparing transfers before necessity becomes an order."
utopia_manifesto_work_where_needed: "Work Where Needed"
utopia_manifesto_work_where_needed_desc: "Guaranteed placement will match vacancies with trained hands while each route decides how much refusal it can tolerate."
utopia_manifesto_learn_a_second_trade: "Learn a Second Trade"
utopia_manifesto_learn_a_second_trade_desc: "Workers will learn a second calling so mobilization, reconstruction, or harvest failure cannot empty an essential service."
utopia_manifesto_emergency_calling_review: "Emergency Calling Review"
utopia_manifesto_emergency_calling_review_desc: "A public review will test urgent placements against real shortages, available volunteers, and the rights promised by the route."
utopia_manifesto_six_hours_and_the_evening_lecture: "Six Hours and the Evening Lecture"
utopia_manifesto_six_hours_and_the_evening_lecture_desc: "A shorter day will leave room for paid education, civic work, and family life once the common stores can bear it."
utopia_manifesto_a_nation_of_many_skills: "A Nation of Many Skills"
utopia_manifesto_a_nation_of_many_skills_desc: "The six callings will share enough trained people to absorb shocks without making emergency assignment permanent."
utopia_manifesto_the_capital_store: "The Capital Store"
utopia_manifesto_the_capital_store_desc: "A central depot with public accounts will anchor the first reserve and make every shortage visible at the capital."
utopia_manifesto_regional_storehouses: "Regional Storehouses"
utopia_manifesto_regional_storehouses_desc: "Regional storehouses will place grain, tools, medicine, and repair stock within reach of districts beyond the capital."
utopia_manifesto_useful_industry: "Useful Industry"
utopia_manifesto_useful_industry_desc: "Factories will balance tools, repairs, household goods, and defense needs around what the common stores can actually sustain."
utopia_manifesto_rotate_old_stores: "Rotate Old Stores"
utopia_manifesto_rotate_old_stores_desc: "Old stock will be issued, replaced, and recorded before neglect turns a reserve into waste."
utopia_manifesto_release_emergency_stores: "Release the Emergency Stores"
utopia_manifesto_release_emergency_stores_desc: "Emergency stores will open under public rules that protect the most urgent households and record every withdrawal."
utopia_manifesto_two_years_against_hunger: "Two Years Against Hunger"
utopia_manifesto_two_years_against_hunger_desc: "Production, rail capacity, and disciplined rotation will build a reserve able to carry the country through two hard years."
utopia_manifesto_surplus_beyond_the_shore: "Full Stores Beyond the Shore"
utopia_manifesto_surplus_beyond_the_shore_desc: "Only full depots can support aid, exchange, and associates beyond the shore without betraying domestic guarantees."
utopia_manifesto_homes_near_work: "Homes Near Work"
utopia_manifesto_homes_near_work_desc: "Housing and workplaces will be planned together so neither empty suburbs nor barracks at the factory gate define the new districts."
utopia_manifesto_rail_road_and_common_ground: "Rail, Road, and Common Ground"
utopia_manifesto_rail_road_and_common_ground_desc: "Transport, utilities, and public land will join scattered projects into districts people can reach and sustain."
utopia_manifesto_a_ring_of_social_cities: "A Ring of Social Cities"
utopia_manifesto_a_ring_of_social_cities_desc: "A ring of towns will combine gardens, clinics, schools, workshops, stores, and stations around the national center."
utopia_manifesto_choose_the_island: "Choose the Island"
utopia_manifesto_choose_the_island_desc: "The survey opens five explicit plans for a bounded center: an existing island capital, a three-island archipelago network, a negotiated foreign lease, a coastal refuge, or an inland capital ring. Only geographically possible plans will remain available."
utopia_manifesto_the_existing_island: "The Existing Island"
utopia_manifesto_the_existing_island_desc: "The existing island center will receive the stores, links, housing, and defenses needed to carry a national institution."
utopia_manifesto_the_archipelago_network: "The Archipelago Network"
utopia_manifesto_the_archipelago_network_desc: "Three distinct island cores will divide stores, harbor work, housing, and defense across a linked national center. Every island must remain owned, controlled, and supplied for the network to count as proof."
utopia_manifesto_the_leased_island: "The Leased Island"
utopia_manifesto_the_leased_island_desc: "A real maritime deficit can be answered by negotiating a fixed-term lease over one foreign island. Control is temporary, ownership never changes, and the shore returns when the term expires unless both governments renew it."
utopia_manifesto_the_coastal_refuge: "The Coastal Refuge"
utopia_manifesto_the_coastal_refuge_desc: "A protected coastal center will unite harbor, reserve, housing, and evacuation capacity without pretending to alter the map."
utopia_manifesto_the_inland_island: "The Inland Island"
utopia_manifesto_the_inland_island_desc: "Railways, depots, fortifications, and planned districts will turn the capital region into a defensible inland center."
utopia_manifesto_build_the_island: "Build the Island"
utopia_manifesto_build_the_island_desc: "Workers, materials, transport, and reserves will be committed to the chosen center. An archipelago must prepare all three sites. A leased island remains subject to its foreign term throughout construction."
utopia_manifesto_the_island_made_real: "The Island Made Real"
utopia_manifesto_the_island_made_real_desc: "The bounded center will be judged by full stores, working districts, secure routes, and the political order within its gates. The center remains recognized only while its required ground is held. Lost sites or an expired lease can strand the project without erasing work already built."
utopia_manifesto_the_citizen_watch: "The Citizen Watch"
utopia_manifesto_the_citizen_watch_desc: "Local watches will protect depots, railways, shelters, and neighborhoods while keeping arms close to civic responsibility."
utopia_manifesto_engineers_before_generals: "Engineers Before Generals"
utopia_manifesto_engineers_before_generals_desc: "Engineer formations will repair routes, fortify crossings, and keep supplies moving before grand commands ask for more divisions."
utopia_manifesto_a_small_army_well_housed: "A Small Army Well Housed"
utopia_manifesto_a_small_army_well_housed_desc: "A compact professional army with secure quarters and support services will defend the country without consuming every calling."
utopia_manifesto_no_glory_in_the_field: "No Glory in the Field"
utopia_manifesto_no_glory_in_the_field_desc: "Doctrine will favor shelter, supply, and the preservation of citizens over costly offensives pursued for prestige."
utopia_manifesto_foreign_hands_in_our_wars: "Foreign Hands in Our Wars"
utopia_manifesto_foreign_hands_in_our_wars_desc: "Auxiliary formations can spare citizens from selected campaigns, though contracts make foreign lives and loyalties part of the bill."
utopia_manifesto_necessary_victory: "Necessary Victory"
utopia_manifesto_necessary_victory_desc: "Offensive action will require a defensible case of necessity and a plan for the ground after victory."
utopia_manifesto_end_the_auxiliary_contract: "End the Auxiliary Contract"
utopia_manifesto_end_the_auxiliary_contract_desc: "The state will settle its contracts, disarm or integrate limited cadres, and end dependence before it becomes command."
utopia_manifesto_commonwealth_defense_compact: "Commonwealth Defense Compact"
utopia_manifesto_commonwealth_defense_compact_desc: "Partners will share warnings, routes, stores, and guarantees through a defense compact that grants no member mastery."
utopia_manifesto_show_the_stores: "Show the Stores"
utopia_manifesto_show_the_stores_desc: "Foreign visitors will see open ledgers, working depots, and ordinary queues before hearing the commonwealth's promises."
utopia_manifesto_offer_the_first_surplus: "Offer from the Full Stores"
utopia_manifesto_offer_the_first_surplus_desc: "A measured portion of the full stores will answer a neighbor's shortage and test whether generosity can survive cost."
utopia_manifesto_houses_across_borders: "Houses Across Borders"
utopia_manifesto_houses_across_borders_desc: "Municipalities will exchange students, workers, families, and technical missions through agreements that preserve lawful return."
utopia_manifesto_a_league_of_small_places: "A League of Small Places"
utopia_manifesto_a_league_of_small_places_desc: "Independent small states will form a compact for reserves, reconstruction, arbitration, and mutual survival."
utopia_manifesto_common_reserve_council: "Common Reserve Council"
utopia_manifesto_common_reserve_council_desc: "Member delegates will publish contributions and direct shared reserves toward blockade, harvest failure, and reconstruction."
utopia_manifesto_mutual_defense_without_mastery: "Mutual Defense Without Mastery"
utopia_manifesto_mutual_defense_without_mastery_desc: "A common guarantee will answer aggression while protecting member votes, local government, and the right to leave."
utopia_manifesto_the_regional_commonwealth: "The Regional Commonwealth"
utopia_manifesto_the_regional_commonwealth_desc: "A network of stores, municipalities, associates, and defenses will give the commonwealth a durable regional presence."
utopia_manifesto_survey_what_we_lack: "Survey What We Lack"
utopia_manifesto_survey_what_we_lack_desc: "The country will state the exact resource, route, harbor, or settlement it lacks before naming any foreign ground necessary."
utopia_manifesto_survey_domestic_alternatives: "Survey Domestic Alternatives"
utopia_manifesto_survey_domestic_alternatives_desc: "Surveyors will test conservation, substitution, new construction, migration, and trade before a border becomes the answer."
utopia_manifesto_ask_before_we_demand: "Ask Before We Demand"
utopia_manifesto_ask_before_we_demand_desc: "Purchase, lease, treaty, and joint administration will be offered before necessity speaks in the language of command."
utopia_manifesto_ground_held_in_trust: "Ground Held in Trust"
utopia_manifesto_ground_held_in_trust_desc: "Any administered ground will carry duties of provision, reconstruction, local charter, and future status."
utopia_manifesto_the_limit_of_need: "The Limit of Need"
utopia_manifesto_the_limit_of_need_desc: "When the material deficit ends, the claim must narrow, expire, or be renounced before appetite inherits its language."
utopia_manifesto_the_natural_right: "The Natural Right"
utopia_manifesto_the_natural_right_desc: "The state will treat unmet need as a superior title and prepare ultimata against those who refuse its settlement."
utopia_manifesto_the_first_associate: "The First Associate"
utopia_manifesto_the_first_associate_desc: "One partner or administered place will receive a durable status defined by provision, local assent, and public obligations."
utopia_manifesto_a_commonwealth_of_places: "A Commonwealth of Places"
utopia_manifesto_a_commonwealth_of_places_desc: "Associates, municipalities, and partners will form a commonwealth whose geography rests on agreements as well as borders."
utopia_manifesto_stewardship_obligations: "Stewardship Obligations"
utopia_manifesto_stewardship_obligations_desc: "Administration will begin with food, repairs, public order, and a written account of what the steward owes the population."
utopia_manifesto_emergency_provision: "Emergency Provision"
utopia_manifesto_emergency_provision_desc: "Stores and transport will be diverted to prevent hunger and collapse in the administered territory."
utopia_manifesto_restore_the_route: "Restore the Route"
utopia_manifesto_restore_the_route_desc: "Rail, road, harbor, and supply links will be rebuilt before political status is settled."
utopia_manifesto_convene_the_local_charter: "Convene the Local Charter"
utopia_manifesto_convene_the_local_charter_desc: "Local delegates will draft institutions for stores, services, property, and public objection."
utopia_manifesto_the_charter_period: "The Charter Period"
utopia_manifesto_the_charter_period_desc: "The charter will operate under review long enough for residents to judge its promises by daily life."
utopia_manifesto_status_by_consent: "Status by Consent"
utopia_manifesto_status_by_consent_desc: "A public decision will choose integration, association, autonomy, or return only after provision and local institutions are established."
utopia_manifesto_the_founding_crisis: "The Founding Crisis"
utopia_manifesto_the_founding_crisis_desc: "Empty stores and divided institutions have broken the interim settlement. The country must choose who receives emergency authority."
utopia_manifesto_restore_consent: "Restore Consent"
utopia_manifesto_restore_consent_desc: "Local votes, relief, and release from failed quotas will rebuild legitimacy at the price of slower command."
utopia_manifesto_empower_the_councils: "Empower the Councils"
utopia_manifesto_empower_the_councils_desc: "Calling councils will take control of stores and production so those doing the work can settle the emergency."
utopia_manifesto_give_the_surveyors_authority: "Give the Surveyors Authority"
utopia_manifesto_give_the_surveyors_authority_desc: "An emergency board will direct inventories, transport, and placements until provision is restored."
utopia_manifesto_seal_the_island: "Seal the Island"
utopia_manifesto_seal_the_island_desc: "Rationing, compulsory service, and guarded boundaries will turn the crisis into a closed national order."
utopia_manifesto_admit_the_book_was_a_question: "Admit the Book Was a Question"
utopia_manifesto_admit_the_book_was_a_question_desc: "Public criticism and revision will rescue useful institutions from a literal reading that has failed them."
utopia_manifesto_a_settled_interim_charter: "A Settled Interim Charter"
utopia_manifesto_a_settled_interim_charter_desc: "A revised charter will end emergency improvisation and reconnect the founding institutions to a stable political route."
utopia_manifesto_proof_of_the_commonwealth: "Proof of the Commonwealth"
utopia_manifesto_proof_of_the_commonwealth_desc: "The chosen interpretation must show working stores, either a materially proven island project or a completed capital-ring district network, a resolved external case, and institutions that survive public scrutiny."
utopia_manifesto_the_regional_proclamation: "The Regional Proclamation"
utopia_manifesto_the_regional_proclamation_desc: "Partners, associates, and reserve commitments have made the commonwealth regional. Its members can proclaim that order before the world."
utopia_manifesto_integrate_the_ring: "Integrate the Ring"
utopia_manifesto_integrate_the_ring_desc: "Districts and associates will link their stores, transport, charters, and services without erasing the local forms that made them viable."
utopia_manifesto_the_second_generation: "The Second Generation"
utopia_manifesto_the_second_generation_desc: "Founding offices will pass to trained successors and permanent institutions able to outlive the first interpreters. The Practical Commonwealth will reopen the ballot and hold its constitutional succession."
utopia_manifesto_a_rule_for_need: "A Rule for Need"
utopia_manifesto_a_rule_for_need_desc: "Law will define what constitutes necessity, what evidence supports a claim, and when the claim must end."
utopia_manifesto_beyond_the_founders_island: "Beyond the Founder's Island"
utopia_manifesto_beyond_the_founders_island_desc: "The mature commonwealth will choose whether to teach, aid, associate, withdraw, or impose beyond its first bounded center."
utopia_manifesto_the_commonwealth_at_war: "The Commonwealth at War"
utopia_manifesto_the_commonwealth_at_war_desc: "Mobilization rules will protect stores, callings, districts, and constitutional limits while the commonwealth fights for survival."
utopia_manifesto_plenty_in_an_age_of_chaos: "Plenty in an Age of Chaos"
utopia_manifesto_plenty_in_an_age_of_chaos_desc: "Reserves, reconstruction, migration, and regional obligations will be joined into a policy for an age of collapsing order."

# Focus availability and constitutional correction requirements
utopia_manifesto_the_first_common_store_available_tt: "The country must be able to commit the manpower, support equipment, and political authority needed to open the First Common Store."
utopia_manifesto_household_gives_consent_bypass_tt: "The founding crisis has already restored government through Consent of Households."
utopia_manifesto_free_callings_available_tt: "Consent of Households must guide the charter before occupations can be opened to voluntary calling."
