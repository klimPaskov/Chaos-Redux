chaosx.fallout.1044.t: "The Cohort's First Ballot"
chaosx.fallout.1044.opening.d: "Five years after the river and hill wards opened their first shared classroom, the children who crossed the pump road are old enough to choose representatives. The lower ward keeps a ferry canopy for public meetings, while the hill ward keeps the only dry archive of attendance, medicine, and shelter duty. The Basin must decide whether the cohort receives a youth council, guardian seats, a mixed assembly, or a service year before voting. Their altered society is fictional. The choice does not prove ordinary radiation biology."
chaosx.fallout.1044.a: "Seat a youth council"
chaosx.fallout.1044.a.tt: "Spend Food 2, Medicine 2, and Recognition 2 to give the first cohort a witnessed council with its own attendance and shelter ledger. A ballot held under the ferry canopy can make civic confidence visible, but it gives an inexperienced council authority during cold rain."
chaosx.fallout.1044.b: "Reserve guardian seats"
chaosx.fallout.1044.b.tt: "Spend Scrap 1, Power 1, and Recognition 2 to reserve half the seats for named guardians from both wards. The arrangement protects records and routes, but older ward keepers may keep the first cohort from setting its own priorities."
chaosx.fallout.1044.c: "Constitute a mixed ward assembly"
chaosx.fallout.1044.c.tt: "Spend Fuel 1, Recognition 2, and Cohesion 2 to join cohort delegates, teachers, guardians, and the foreign witness in one assembly. A broad table can settle crossing disputes, though every meeting uses fuel and time."
chaosx.fallout.1044.d: "Require a service year before voting"
chaosx.fallout.1044.d.tt: "Spend Food 1, Medicine 1, Fuel 1, and Recognition 1 to require one wet season of ferry, clinic, or shelter service before a ballot. The service year can build practical trust, but it may turn citizenship into a test the poorest children cannot pass."
chaosx.fallout.1046.t: "Who Speaks for the First Class"
chaosx.fallout.1046.youth_council.success.d: "The first cohort holds a ballot beneath the ferry canopy and elects two delegates from each ward. Their register records the same names in river and hill hands, and the foreign witness accepts the council as a public authority for shelter duty and school repair."
chaosx.fallout.1046.youth_council.partial.d: "The youth council opens beneath the ferry canopy, but cold rain strands the hill delegates before the count is complete. The river ward keeps a provisional ballot while both teachers ask for a second count after the road dries."
chaosx.fallout.1046.youth_council.failure.d: "The first ballot loses its seal when the ferry shelter floods. A guardian carries the hill list uphill, the river list names different delegates, and the cohort learns that a vote without a dry record can become another border."
chaosx.fallout.1046.guardian_seats.success.d: "Both wards reserve seats for named guardians and leave the remaining places to the cohort. The guardians keep the medicine, shelter, and attendance books together, while the elected delegates win a written right to question every ration decision."
chaosx.fallout.1046.guardian_seats.partial.d: "Reserved guardian seats protect the records, but the hill ward cannot send a second keeper through the ash road. The cohort receives a partial voice and agrees to review the balance when the power cell is repaired."
chaosx.fallout.1046.guardian_seats.failure.d: "Guardian seats become a permanent lock on the assembly. The old ward lists decide who may speak, the cohort stops attending the ferry meetings, and the foreign witness records a council that has preserved order by refusing succession."
chaosx.fallout.1046.mixed_assembly.success.d: "The mixed assembly meets in the lower ward with one teacher, one guardian, two cohort delegates, and the foreign witness at the same table. It settles a ferry rota, a clinic queue, and a public rule that no ward may move a child without a named return date."
chaosx.fallout.1046.mixed_assembly.partial.d: "The mixed assembly agrees on a ferry rota, but the hill guardian leaves before the clinic queue is signed. The wards keep one shared rule and two unfinished registers while the next meeting waits for fuel."
chaosx.fallout.1046.mixed_assembly.failure.d: "The mixed assembly spends its first meetings on who may sit near the ledger. The river delegates leave, the hill guardian seals the archive, and the foreign witness finds that a wide table can still have no public authority."
chaosx.fallout.1046.service_year.success.d: "A service year sends cohort members through ferry repair, clinic errands, and shelter checks under named guardians. At the first ballot, each ward can point to the same work register, and service becomes a route into citizenship rather than a private favor."
chaosx.fallout.1046.service_year.partial.d: "The service year repairs the ferry and carries medicine uphill, but the clinic register misses several wet-season shifts. The cohort receives a delayed ballot and the foreign witness asks the wards to separate service from family privilege."
chaosx.fallout.1046.service_year.failure.d: "The service year turns into unpaid labor for the strongest households. The hill storehouse keeps the work register, the river ward refuses the next shift, and the first ballot is postponed until the wards can name a fairer path."
chaosx.fallout.1046.a: "Record the first civic mandate"
chaosx.fallout.1046.a.tt: "Apply the graded civic result, register its branch memory, notify the foreign witness ward, and schedule a delayed review after the next election season."
chaosx.fallout.1048.t: "The First Election Review"
chaosx.fallout.1048.success.d: "After the next wet season, the Basin's first civic register matches the river and hill copies. The cohort keeps its chosen mandate, the guardians accept a public audit, and the foreign witness recognizes the first ballot as a durable rule."
chaosx.fallout.1048.partial.d: "The review finds a working mandate but two copies of the service and shelter ledger. The cohort can still meet beneath the ferry canopy, yet the wards postpone a final balance of guardian and delegate seats until the stores recover."
chaosx.fallout.1048.failure.d: "The review finds a missing seal, an unpaid service register, and a hill archive that no longer names the river delegates. The foreign witness withdraws recognition, and the next cohort inherits a government whose first ballot never settled."
chaosx.fallout.1048.a: "Close the first ballot record"
chaosx.fallout.1048.a.tt: "Apply the delayed civic result, record the final cause memory, release the ward and witness reservations, and close The Cohort's First Ballot."
fallout.event_log.cohorts_first_ballot.name: "The Cohort's First Ballot"
fallout.event_log.cohorts_first_ballot.detail: "[GetFalloutEvent922EventLogDetail]"
fallout.event_log.cohorts_first_ballot.detail.choice_youth_council: "The Congo Green Basin seated a witnessed council chosen by the first cohort."
fallout.event_log.cohorts_first_ballot.detail.choice_guardian_seats: "The Congo Green Basin reserved civic seats for named guardians from both wards."
fallout.event_log.cohorts_first_ballot.detail.choice_mixed_assembly: "The Congo Green Basin formed a mixed assembly for cohort, ward, and witness delegates."
fallout.event_log.cohorts_first_ballot.detail.choice_service_year: "The Congo Green Basin required a wet-season service year before the first ballot."
fallout.event_log.cohorts_first_ballot.detail.youth_council_success: "A ferry-canopy ballot gave the first cohort a public council with matching ward records."
fallout.event_log.cohorts_first_ballot.detail.youth_council_partial: "The youth council opened, but the hill count waited for a second wet-season tally."
fallout.event_log.cohorts_first_ballot.detail.youth_council_failure: "A flooded ferry shelter split the delegate lists and left the first ballot without a common seal."
fallout.event_log.cohorts_first_ballot.detail.guardian_seats_success: "Guardian seats protected the records while cohort delegates gained a written ration question."
fallout.event_log.cohorts_first_ballot.detail.guardian_seats_partial: "Guardian seats preserved the archive, but one ward could not send its second keeper."
fallout.event_log.cohorts_first_ballot.detail.guardian_seats_failure: "Guardian seats became a lock on succession and the cohort stopped attending the ferry meetings."
fallout.event_log.cohorts_first_ballot.detail.mixed_assembly_success: "A mixed assembly settled ferry, clinic, and return-date rules for both wards."
fallout.event_log.cohorts_first_ballot.detail.mixed_assembly_partial: "The mixed assembly agreed on a ferry rota while the clinic register remained unsigned."
fallout.event_log.cohorts_first_ballot.detail.mixed_assembly_failure: "The mixed assembly lost public authority while the river and hill archives stayed sealed."
fallout.event_log.cohorts_first_ballot.detail.service_year_success: "A named service year led to a ballot grounded in ferry, clinic, and shelter work."
fallout.event_log.cohorts_first_ballot.detail.service_year_partial: "The service year repaired the route but left the clinic register incomplete."
fallout.event_log.cohorts_first_ballot.detail.service_year_failure: "The service year became unpaid labor and postponed the cohort's first ballot."
fallout.event_log.cohorts_first_ballot.detail.callback_success: "The next wet season confirmed the first civic register and a durable ballot rule."
fallout.event_log.cohorts_first_ballot.detail.callback_partial: "The mandate held while the wards kept separate service and shelter ledger copies."
fallout.event_log.cohorts_first_ballot.detail.callback_failure: "A missing seal and unpaid register left the first ballot without recognized succession."
fallout.event_log.cohorts_first_ballot.detail.cancelled: "The Cohort's First Ballot closed after its ward, witness, owner, or Fallout generation changed."
