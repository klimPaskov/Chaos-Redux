l_english:
chaosx.nr15.97.t: "The Utopia Manifesto Abroad"
chaosx.nr15.97.d: "The manuscript has reached [utopia_manifesto_prefire_actor.GetNameDef]. Its readers are asking their government to put its plan for common provision into practice.\n\nThe proposal concerns that country alone, and our own government and policy are unchanged."
chaosx.nr15.97.a: "Follow their experiment."
chaosx.nr15.98.t: "The Manifesto Remains in the Archives"
chaosx.nr15.98.d: "No suitable government can take up the manifesto. The proposal calls for a small country with a secure capital and institutions still open to change. Major powers, governments fighting for survival, and countries already undergoing another political transformation cannot undertake it.\n\nThe manuscript remains in the archives."
chaosx.nr15.98.already.d: "The manifesto has already been put before a government and its decision belongs to that country. Circulating another copy cannot begin a second national experiment."
chaosx.nr15.98.a: "Leave the manuscript there."
