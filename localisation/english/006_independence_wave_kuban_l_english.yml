kub_fragmented_mounted_mandate: "Fragmented Mounted Mandate"
kub_fragmented_mounted_mandate_desc: "Village councils, railway officials, church communities, and border guards recognize the provisional state without yet accepting a common settlement."
kub_kuban_host_compact: "Kuban Host Compact"
kub_kuban_host_compact_desc: "Written community guarantees and a common mounted defence bind the Kuban Cossack Host's valleys, towns, and guarded passes to one civil authority."
kub_rada_charter: "Rada Charter"
kub_rada_charter_desc: "An elected assembly protects Kuban self-government while keeping the civil service and mounted communities represented."
kub_guard_soviets: "Guard Soviets"
kub_guard_soviets_desc: "Railway workers, forestry crews, and town committees coordinate production and transport through a common workers' council."
kub_stanitsa_land_compact: "Stanitsa Land Compact"
kub_stanitsa_land_compact_desc: "Village delegates, cooperatives, and parish communities share responsibility for food, recruitment, and local administration."
kub_mounted_emergency_command: "Mounted Emergency Command"
kub_mounted_emergency_command_desc: "A unified territorial staff directs the border guards and mounted reserves while civil councils preserve local supply and relief."

independence_wave_kub_mounted_compact_category: "Kuban Host Compact"
independence_wave_kub_mounted_compact_category_desc: "Civic Concord: §Y[?independence_wave_kub_rada_cohesion|0]§! / [?constant:independence_wave_kuban_pressure.maximum|0]\nMounted Readiness: §Y[?independence_wave_kub_mounted_readiness|0]§! / [?constant:independence_wave_kuban_pressure.maximum|0]\nReach [?constant:independence_wave_kuban_pressure.stable|0] in both values to stabilize the compact."
independence_wave_kub_hold_mounted_compact_together: "Hold the Kuban Host Compact Together"
independence_wave_kub_hold_mounted_compact_together_desc: "Within [?constant:independence_wave_kuban_duration.founding_crisis|0] days, install a government, raise both compact values to [?constant:independence_wave_kuban_pressure.stable|0], and secure ownership and control of $STATE_234$."
independence_wave_kub_secure_mounted_depots: "Secure the Mounted Depots"
independence_wave_kub_secure_mounted_depots_desc: "Place the upland stores, road registers, and railway depots under a civil authority able to supply the compact."
independence_wave_kub_integrate_border_guards: "Integrate the Border Guards"
independence_wave_kub_integrate_border_guards_desc: "Unify the local detachments under a mounted defence staff while preserving the community guarantees that sustain them."
independence_wave_kub_register_community_compacts: "Register the Community Compacts"
independence_wave_kub_register_community_compacts_desc: "Record the rights, obligations, and representation of every valley, town, parish, and recognized community."
independence_wave_kub_settle_former_host_ledgers: "Settle the Former Host Ledgers"
independence_wave_kub_settle_former_host_ledgers_desc: "Close the property, border, population, and recognition claims inherited from the former administration. If talks fail, the Kuban Host compact will settle them locally."
independence_wave_kub_ratify_constitutional_autonomy: "Ratify Constitutional Autonomy"
independence_wave_kub_ratify_constitutional_autonomy_desc: "Give the provisional assembly a binding charter of self-government and explicit protections for the mounted communities."
independence_wave_kub_adopt_agrarian_compact: "Adopt the Agrarian Compact"
independence_wave_kub_adopt_agrarian_compact_desc: "Entrust village delegates, cooperatives, and parish communities with food, recruitment, and local administration."
independence_wave_kub_convene_socialist_councils: "Convene the Socialist Councils"
independence_wave_kub_convene_socialist_councils_desc: "Place the railway, forestry districts, workshops, and municipal services under a common workers' council."
independence_wave_kub_establish_mounted_emergency_command: "Establish the Mounted Emergency Command"
independence_wave_kub_establish_mounted_emergency_command_desc: "Put the border guards under one emergency staff and secure the passes before neighboring armies test the compact."
independence_wave_kub_codify_durable_sovereignty: "Codify Durable Sovereignty"
independence_wave_kub_codify_durable_sovereignty_desc: "A resolved founding crisis, stable ledgers, and a functioning government can turn liberation into a durable Kuban state."
independence_wave_kub_open_black_sea_steppe_network_corridor: "Open the Black Sea Steppe Network Corridor"
independence_wave_kub_open_black_sea_steppe_network_corridor_desc: "After the founding settlement, exchange supplies, officers, and diplomatic access with the other states that survived the wave."

independence_wave_kub_project_failure_effect_tt: "Civic Concord and Mounted Readiness each change by [?constant:independence_wave_kuban_pressure.standard_loss|0]. Legitimacy, Recognition, State Capacity, and Security fall. Instability rises."
independence_wave_kub_depots_effect_tt: "Civic Concord and Mounted Readiness improve, while Legitimacy and State Capacity rise."
independence_wave_kub_guards_effect_tt: "Mounted Readiness improves sharply and the security administration gains Legitimacy and Security."
independence_wave_kub_communities_effect_tt: "Civic Concord improves sharply, Recognition and State Capacity rise, and the compact absorbs a measured instability cost."
independence_wave_kub_host_ledgers_effect_tt: "Civic Concord and Mounted Readiness improve. The former-host property, border, population, and recognition ledgers are settled through negotiation."
independence_wave_kub_host_loss_effect_tt: "The former-host ledger closes locally. Civic Concord and Mounted Readiness improve, and no bilateral host values change."
independence_wave_kub_constitutional_route_effect_tt: "The Kuban Civic Assembly takes office under the constitutional standard. Civic Concord and Mounted Readiness improve, with gains to Legitimacy and State Capacity."
independence_wave_kub_agrarian_route_effect_tt: "The Kuban Village Compact takes office under the agrarian standard. Civic Concord and Mounted Readiness improve, with gains to Legitimacy and Recognition."
independence_wave_kub_socialist_route_effect_tt: "The Kuban Workers' Council takes office under the socialist standard. Mounted Readiness improves sharply while the railway and municipal economy are reorganized."
independence_wave_kub_emergency_route_effect_tt: "The Mounted Defence Directorate takes office under the emergency standard. Mounted Readiness rises sharply while Civic Concord pays the cost of emergency rule."
independence_wave_kub_sovereignty_effect_tt: "Legitimacy, Recognition, and State Capacity rise, and the compact gains Security."
independence_wave_kub_network_effect_tt: "Civic Concord and Mounted Readiness improve. Network Standing, League Cohesion, Common Cause, Shared Reserve, and Member Confidence rise."

