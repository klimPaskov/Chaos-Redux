fallout.event_log.pirate_amnesty.detail.public_trial_partial: "The court established some cargo claims while witnesses disappeared."
fallout.event_log.pirate_amnesty.detail.public_trial_failure: "The hearing failed and the captured cargo spoiled on the quay."
fallout.event_log.pirate_amnesty.detail.exile_success: "The raiders left with a signed ban from the sea road and the public charts."
fallout.event_log.pirate_amnesty.detail.exile_partial: "Two crews departed while two slipped back through the fog."
fallout.event_log.pirate_amnesty.detail.exile_failure: "The escort broke apart and the raiders kept their ships."
