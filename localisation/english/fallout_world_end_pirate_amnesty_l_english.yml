chaosx.fallout.789.t: "The Pirate Amnesty"
chaosx.fallout.789.opening.d: "Four raider crews have entered the old sea road under white cloth. They claim the same ash storms that starved the coast made them pirates, and they offer charts, fuel, and captured stores in exchange for a legal berth. The West African Port Confederacies must decide whether to pardon them, commission them, try them, or send them beyond the reef."
chaosx.fallout.789.a: "Grant a conditional amnesty"
chaosx.fallout.789.a.tt: "Spend Food 2, Medicine 2, and Recognition 2 to register the crews, return named cargo, and bind them to the harbor's rescue code."
chaosx.fallout.789.b: "Commission them as privateers"
chaosx.fallout.789.b.tt: "Spend Fuel 2, Recognition 3, and Cohesion 2 to give the crews a lawful patrol charter with a strict prize ledger."
chaosx.fallout.789.c: "Hold a public trial"
chaosx.fallout.789.c.tt: "Spend Scrap 2, Power 2, and Medicine 2 to secure witnesses, inspect the holds, and let the quay judge the raiders' claims."
chaosx.fallout.789.d: "Exile the crews beyond the reef"
chaosx.fallout.789.d.tt: "Spend Food 2, Fuel 2, and Recognition 2 to escort the crews out of the sea road before their old raids become a new law."
chaosx.fallout.790.t: "The Pirate Amnesty"
chaosx.fallout.791.t: "The Sea Road Must Choose a Law"
chaosx.fallout.791.amnesty.success.d: "The crews surrendered their captured cargo and accepted a rescue oath. The harbor council grants them berths under named captains, and every future prize must enter the public ledger before it can feed a family."
chaosx.fallout.791.amnesty.partial.d: "Two crews returned their cargo while the third hid a sealed hold. Amnesty holds for the crews who opened their books, but the harbor keeps a live accusation against the missing captain."
chaosx.fallout.791.amnesty.failure.d: "The pardon meeting ended when a raider refused the oath and fired across the customs pier. The harbor now has a public list of crimes and a crew that claims the white cloth was a trap."
chaosx.fallout.791.privateer_service.success.d: "The council issued patrol charters with fixed waters, rescue duties, and a prize court. The former raiders now escort grain and medicine, while the sea road records every seizure under a named seal."
chaosx.fallout.791.privateer_service.partial.d: "The charters kept the worst raids away, yet the crews still interpret the prize rule at sea. A patrol boat brings food home while two captains argue over which court can judge them."
chaosx.fallout.791.privateer_service.failure.d: "The charter crews treated the sea road as a private market. Their first patrol returned with fuel and no witnesses, leaving the harbor to choose between revoking the flag or accepting a piracy state."
chaosx.fallout.791.public_trial.success.d: "Witnesses, cargo marks, and the clinic's missing ledger survived the hearing. The court convicts one captain, releases the others under watch, and turns the prize fund into a public rescue account."
chaosx.fallout.791.public_trial.partial.d: "The trial established which cargo came from the old raids, but two witnesses vanished before the final count. The court keeps the crews under guard while the sea road waits for a clearer law."
chaosx.fallout.791.public_trial.failure.d: "The hearing lost its power and the captured cargo spoiled on the quay. The crews leave with a grievance, the victims receive no restitution, and every neighboring port hears that the court can be bought."
chaosx.fallout.791.exile.success.d: "The harbor escorted the raiders beyond the reef with fuel, water, and a signed ban from the sea road. Their charts remain in the public archive, while the coast prepares for the raids that may follow them elsewhere."
chaosx.fallout.791.exile.partial.d: "Two crews departed and two slipped back through a fog bank. The old sea road is quieter, but the harbor has spent its stores without ending the question of who owns the next patrol."
chaosx.fallout.791.exile.failure.d: "Ash and crosswinds broke the escort formation. The raiders kept their ships and the harbor lost its fuel reserve, so every empty berth now looks like an invitation."
chaosx.fallout.791.a: "Close the sea-law record"
chaosx.fallout.791.a.tt: "Apply the delayed sea-law outcome, record the chosen crew settlement, and release the reserved harbor and partner rows."
chaosx.fallout.793.t: "A Law for the Sea Road"
chaosx.fallout.793.success.d: "The sea road now has a named court, a rescue oath, and captains who know which ledger follows every prize. The harbor's authority reaches the water without pretending the old coast guard survived."
chaosx.fallout.793.partial.d: "The crews accepted a common register, but one captain still keeps a private chart. Patrols can sail and cargo can move while the harbor decides whether trust is earned by law or by fear."
chaosx.fallout.793.failure.d: "The review found empty berths, missing witnesses, and a prize fund claimed by three captains. The harbor still has ships, but no sea law that its neighbors will recognize."
chaosx.fallout.793.a: "Close the sea-law review"
chaosx.fallout.793.a.tt: "Apply the delayed sea-law review, write the final crew memory, and release the reserved harbor and partner rows."
