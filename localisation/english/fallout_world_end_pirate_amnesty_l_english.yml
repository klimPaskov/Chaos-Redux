fallout.event_log.pirate_amnesty.detail.callback_partial: "The crews share a register while one captain keeps a private chart."
fallout.event_log.pirate_amnesty.detail.callback_failure: "The review found missing witnesses and a prize fund claimed by three captains."
fallout.event_log.pirate_amnesty.detail.cancelled: "The sea-law record was cancelled after its state, partner, owner, controller, or generation changed."
