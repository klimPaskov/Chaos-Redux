# Government and characters
NZL_fallout_lifeboat_parliament: "Lifeboat Parliament"
NZL_fallout_relief_speaker: "Mereana Hale"
NZL_fallout_harbor_constable: "Thomas Raukawa"
NZL_fallout_dairy_relief_commissioner: "Elsie Marwick"
NZL_fallout_storm_port_engineer: "James Te Aho"
NZL_fallout_radio_service_coordinator: "Ruth Calder"
NZL_fallout_lifeboat_parliament_party: "Lifeboat Parliament"
NZL_fallout_lifeboat_parliament_party_long: "Emergency Lifeboat Parliament of New Zealand"
NZL_fallout_open_berth_caucus: "Open Berth Caucus"
NZL_fallout_open_berth_caucus_long: "Open Berth Relief and Reconstruction Caucus"
NZL_fallout_port_wardens: "Port Wardens"
NZL_fallout_port_wardens_long: "Southern Port Warden Assembly"
fallout_nzl_lifeboat_parliament_trait: "Council of the Surviving Quays"
fallout_nzl_lifeboat_parliament_trait_desc: "A measured emergency council keeps the two principal ports under one public ration law, though every disputed berth slows ordinary politics."
fallout_nzl_relief_speaker_trait: "Keeper of the Open Ledger"
fallout_nzl_relief_speaker_trait_desc: "The relief speaker publishes harbour obligations and uses verified passages to rebuild trust with other living shores."
fallout_nzl_harbor_constable_trait: "Warden of the Last Berths"
fallout_nzl_harbor_constable_trait_desc: "The harbour constable concentrates defence at the registered anchorages and accepts foreign resentment as the price of the cordon."
fallout_nzl_dairy_relief_commissioner_trait: "Dairy Relief Commissioner"
fallout_nzl_dairy_relief_commissioner_trait_desc: "Sealed stores, scheduled railcars, and island quotas reduce waste while keeping the dairy districts tied to the ports."
fallout_nzl_storm_port_engineer_trait: "Storm-Port Engineer"
fallout_nzl_storm_port_engineer_trait_desc: "Breakwaters and docks are rebuilt for cold swells, ash-laden rain, and the repair needs of the surviving escort craft."
fallout_nzl_radio_service_coordinator_trait: "Radio Service Coordinator"
fallout_nzl_radio_service_coordinator_trait_desc: "Weather rooms and coastal watches share bearings that improve detection and keep isolated operators on one coded schedule."

# Ideas
fallout_nzl_empty_harbors: "Empty Harbours"
fallout_nzl_empty_harbors_desc: "Cranes stand without crews while broken quays choke the remaining coastal supply. Every convoy entering New Zealand competes for one of the few sound berths."
fallout_nzl_broken_breakwaters: "Broken Breakwaters"
fallout_nzl_broken_breakwaters_desc: "A failed repair season has opened the quays to southern storms. Salt water reaches stores that once stood behind concrete and timber."
fallout_nzl_storm_ports: "Storm Ports"
fallout_nzl_storm_ports_desc: "Rebuilt breakwaters, weather watches, and repair gangs keep the principal harbours working through rough seasons."
fallout_nzl_lifeboat_morality: "Lifeboat Morality"
fallout_nzl_lifeboat_morality_desc: "Every vessel on the horizon raises the same question. The islands can save people, but each berth given away changes the rations of those already ashore."
fallout_nzl_open_berth_covenant: "Open Berth Covenant"
fallout_nzl_open_berth_covenant_desc: "Admission rules, ration duties, and harbour records are public. Rescue is treated as a binding civic obligation."
fallout_nzl_last_berth_doctrine: "Last Berth Doctrine"
fallout_nzl_last_berth_doctrine_desc: "No vessel enters without a licence, a cargo declaration, and an assigned quay. The sea road is defended as tightly as the shoreline."
fallout_nzl_berth_riots: "Berth Riots"
fallout_nzl_berth_riots_desc: "Families have learned that harbour lists can decide who eats and who remains offshore. Crowds now gather wherever a ledger is opened."
fallout_nzl_dairy_rations: "Dairy Rations"
fallout_nzl_dairy_rations_desc: "Milk powder, cheese, preserved butter, and ration trains keep towns alive. The system consumes labour and rolling stock that the damaged economy can scarcely spare."
fallout_nzl_dairy_relief_fleet_idea: "Dairy Relief Fleet"
fallout_nzl_dairy_relief_fleet_idea_desc: "Coastal craft carry sealed food lots between railheads, fishing ports, and relief anchorages under published manifests."
fallout_nzl_spoiled_stores: "Spoiled Stores"
fallout_nzl_spoiled_stores_desc: "Wet warehouses and broken refrigeration have turned a counted reserve into a public scandal."
fallout_nzl_improvised_sea_guard: "Improvised Sea Guard"
fallout_nzl_improvised_sea_guard_desc: "Fishermen, harbour police, and naval survivors share patrol charts without a common command."
fallout_nzl_splintered_patrols: "Splintered Patrols"
fallout_nzl_splintered_patrols_desc: "Competing harbour authorities hoard fuel and signals. Convoys pass through blind water while cutters argue over jurisdiction."
fallout_nzl_lifeboat_navy_idea: "Lifeboat Navy"
fallout_nzl_lifeboat_navy_idea_desc: "Patrol rooms, rescue cutters, dock crews, and coastal batteries answer one maritime command."
fallout_nzl_two_island_supply_ring_idea: "Two-Island Supply Ring"
fallout_nzl_two_island_supply_ring_idea_desc: "Rail depots, dairy stores, weather stations, and both principal ports operate as one measured circuit."

# Decision category and actions
fallout_nzl_lifeboat_category: "The Lifeboat Ledger"
fallout_nzl_lifeboat_category_desc: "Harbour Capacity: [?fallout_nzl_harbor_capacity|0] / 100\nFood Security: [?fallout_nzl_food_security|0] / 100\nParliament Trust: [?fallout_nzl_parliament_trust|0] / 100\nSea-Lane Security: [?fallout_nzl_sea_lane_security|0] / 100\n\nEvery berth, ration train, and patrol changes what the islands can carry."
fallout_nzl_wellington_breakwater_works: "Repair Wellington Breakwater"
fallout_nzl_wellington_breakwater_works_desc: "Commit trucks and convoy hulls to the storm-battered entrance works. Losing Wellington before completion abandons the crews and their cargo."
fallout_nzl_auckland_storm_port_works: "Rebuild the Auckland Storm Port"
fallout_nzl_auckland_storm_port_works_desc: "Auckland can recover a naval basin and one working dockyard if engineers receive labour, support equipment, and uninterrupted control of the harbour."
fallout_nzl_milk_rail_assignments: "Assign the Milk Rail"
fallout_nzl_milk_rail_assignments_desc: "Reserve trucks and trains for sealed dairy lots moving from the South Island to the northern ports."
fallout_nzl_fishery_quota_compact: "Sign a Fishery Quota Compact"
fallout_nzl_fishery_quota_compact_desc: "Release fishing crews from other duties under a quota system that feeds the towns while thinning coastal patrols."
fallout_nzl_weather_station_chain: "Maintain the Weather Station Chain"
fallout_nzl_weather_station_chain_desc: "Fund radio watches from Northland to the southern approaches. Their warning remains useful for ninety days and can protect one major harbour project from the worst losses of a broken work season."
fallout_nzl_port_militia_training_mission: "Drill the Port Militia"
fallout_nzl_port_militia_training_mission_desc: "Spend rifles, manpower, and army experience on a sustained training cycle for the improvised harbour formations."
fallout_nzl_convoy_volunteer_corps_mission: "Raise the Convoy Volunteer Corps"
fallout_nzl_convoy_volunteer_corps_mission_desc: "Commit scarce convoys, support equipment, and volunteers to one additional escort formation. This action cannot be repeated."
fallout_nzl_arm_rescue_cutters_action: "Arm the Rescue Cutters"
fallout_nzl_arm_rescue_cutters_action_desc: "Convert working convoy craft into patrol tenders. Harbour throughput falls during the conversion."
fallout_nzl_refugee_fleet_admission: "Admit the First Rescue Fleet"
fallout_nzl_refugee_fleet_admission_desc: "Open berths and food stores for a fleet carrying exhausted civilians. A failed reception will deepen every argument about admission."
fallout_nzl_last_berth_closure: "Close the Last Unlicensed Berths"
fallout_nzl_last_berth_closure_desc: "Seal unregistered anchorages and protect the ration stores at the cost of public trust and foreign access."
fallout_nzl_offer_rescue_passage: "Offer a Rescue Passage"
fallout_nzl_offer_rescue_passage_desc: "Send convoy escorts and food toward the next recorded coastal partner. The offer ends if that exact partner is no longer valid, and a completed passage writes a reciprocal relief receipt."
fallout_nzl_anti_piracy_bearing: "Force a Pirate Settlement"
fallout_nzl_anti_piracy_bearing_desc: "Once the recorded aggressor is close to defeat, the patrol command can spend its remaining leverage on a verified white peace. No unrelated country can inherit the target."
fallout_nzl_mobilize_home_guard_state: "Muster the Home Guard"
fallout_nzl_mobilize_home_guard_state_desc: "Commit rifles, trained volunteers, and local labour to one controlled lifeboat district. That state remains on the mobilisation roll for the current Fallout generation."
fallout_nzl_dispatch_dairy_relief_convoy: "Dispatch a Dairy Relief Convoy"
fallout_nzl_dispatch_dairy_relief_convoy_desc: "Assign convoy hulls and trucks to one sealed dairy sailing between the stores and the ports. The emergency cargo can stabilize the ration ledgers, but the transport does not return to the pool."
fallout_nzl_rebuild_partner_relief_port: "Rebuild a Partner Relief Port"
fallout_nzl_rebuild_partner_relief_port_desc: "Send a bounded reconstruction shipment to the controlled coastal capital of one exact relief partner. Completion restores one naval base without creating a claim, core, or permanent control."
fallout_nzl_guarantee_relief_partner: "Guarantee a Relief Partner"
fallout_nzl_guarantee_relief_partner_desc: "Extend New Zealand's only current relief guarantee to one exact partner. The commitment is released if that partner is annexed or the Lifeboat package ends."
fallout_nzl_revoke_raider_access: "Revoke Raider Access"
fallout_nzl_revoke_raider_access_desc: "Withdraw military passage and docking rights from the recorded pirate aggressor in both directions. The cordon gains security but the decision will cost public trust."
fallout_nzl_quiet_seas_patrol: "Run the Quiet-Seas Patrol"
fallout_nzl_quiet_seas_patrol_desc: "Commit a wartime convoy surge against the recorded pirate war. Under the numbered licence regime, §Y[?constant:fallout_nzl_cost.convoy_medium|0]§! convoy hulls and the naval staff can secure a §Y[?constant:fallout_nzl_duration.cooldown|0]-day§! patrol window with a larger Sea-Lane Security return."
fallout_nzl_quiet_seas_patrol_window: "Quiet-Seas Patrol Window"
fallout_nzl_quiet_seas_patrol_window_desc: "Assigned cutters and convoy escorts are following a numbered schedule across the licensed approaches. The current window strengthens detection and escort work for §Y[?constant:fallout_nzl_duration.cooldown|0] days§!."
fallout_nzl_open_numbered_sea_roads_tt: "Open the numbered licence regime and the §YFishery Quota Compact§!. Licensed fishery and wartime patrol cycles spend convoy hulls to maintain ninety-day patrol windows."
fallout_nzl_issue_sea_road_patrol_window_tt: "Issue or renew the §YQuiet-Seas Patrol Window§! for §Y[?constant:fallout_nzl_duration.cooldown|0] days§!."
