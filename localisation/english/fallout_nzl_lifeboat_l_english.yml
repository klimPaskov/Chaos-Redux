# National focuses
fallout_nzl_count_the_living: "Count the Living"
fallout_nzl_count_the_living_desc: "Census boats and parish radios will identify the people still drawing rations on both islands. The first count will decide how the quays are governed."
fallout_nzl_seat_the_lifeboat_parliament: "Seat the Lifeboat Parliament"
fallout_nzl_seat_the_lifeboat_parliament_desc: "Harbour delegates, farm boards, radio operators, and relief officers will meet in one emergency chamber."
fallout_nzl_open_wellington_quays: "Open Wellington Quays"
fallout_nzl_open_wellington_quays_desc: "Survey the entrance channel and place the breakwater crews under one repair command."
fallout_nzl_relay_auckland_radio: "Relay Auckland Radio"
fallout_nzl_relay_auckland_radio_desc: "Auckland's surviving transmitters can bind the weather stations and harbour patrols into one listening net."
fallout_nzl_measure_the_dairy_stores: "Measure the Dairy Stores"
fallout_nzl_measure_the_dairy_stores_desc: "Every sealed tin and chilled room must enter a public ration account before winter and salt water take their share."
fallout_nzl_bind_the_two_islands: "Bind the Two Islands"
fallout_nzl_bind_the_two_islands_desc: "Wellington, Auckland, and the South Island stores must operate as one lifeboat before the country chooses who may board."
fallout_nzl_keep_the_harbor_lights: "Keep the Harbour Lights"
fallout_nzl_keep_the_harbor_lights_desc: "Lit approaches will announce that vessels in distress can still request a berth under New Zealand law."
fallout_nzl_admit_the_first_rescue_fleet: "Admit the First Rescue Fleet"
fallout_nzl_admit_the_first_rescue_fleet_desc: "The parliament will test its promises against the first crowded decks to reach the approaches."
fallout_nzl_publish_the_berth_ledger: "Publish the Berth Ledger"
fallout_nzl_publish_the_berth_ledger_desc: "Names, cargoes, refusals, and ration costs will be visible to every harbour district."
fallout_nzl_elect_the_relief_speaker: "Elect the Relief Speaker"
fallout_nzl_elect_the_relief_speaker_desc: "The open-berth delegates have asked Mereana Hale to submit the emergency chamber to an election."
fallout_nzl_guarantee_lifeboat_rights: "Guarantee Lifeboat Rights"
fallout_nzl_guarantee_lifeboat_rights_desc: "Admission carries duties, but no harbour official may deny food, hearing, or a recorded decision."
fallout_nzl_pacific_relief_republic: "The Pacific Relief Republic"
fallout_nzl_pacific_relief_republic_desc: "The islands will govern themselves through an elected relief republic whose authority begins at the open quays."
fallout_nzl_draw_the_southern_cordon: "Draw the Southern Cordon"
fallout_nzl_draw_the_southern_cordon_desc: "Patrol lines and licensed approaches will place distance between the islands and every unrecorded vessel."
fallout_nzl_close_unregistered_anchorages: "Close Unregistered Anchorages"
fallout_nzl_close_unregistered_anchorages_desc: "Small coves cannot remain private doors into the ration system."
fallout_nzl_license_every_sea_road: "License Every Sea Road"
fallout_nzl_license_every_sea_road_desc: "Cargo routes, fishing grounds, and refuge approaches will receive numbered licences tied to declared patrol windows. Licensed fishery cycles spend §Y[?constant:fallout_nzl_cost.convoy_low|0]§! convoy hulls in peacetime, while a wartime surge spends §Y[?constant:fallout_nzl_cost.convoy_medium|0]§! and returns a larger security gain."
fallout_nzl_appoint_the_harbor_constable: "Appoint the Harbour Constable"
fallout_nzl_appoint_the_harbor_constable_desc: "Thomas Raukawa will hold the wardens to one chain of command and one closed register."
fallout_nzl_reserve_the_last_berths: "Reserve the Last Berths"
fallout_nzl_reserve_the_last_berths_desc: "The remaining sound quays will be held for patrols, ration craft, and vessels already licensed."
fallout_nzl_southern_refuge: "The Southern Refuge"
fallout_nzl_southern_refuge_desc: "The islands will endure as a guarded refuge whose gates open only by recorded necessity."
fallout_nzl_dairy_relief_fleet: "The Dairy Relief Fleet"
fallout_nzl_dairy_relief_fleet_desc: "Seal coastal food lots and give them protected sailings between the dairy districts and northern ports."
fallout_nzl_repair_the_milk_rail: "Repair the Milk Rail"
fallout_nzl_repair_the_milk_rail_desc: "A working rail connection from the southern stores can turn counted food into delivered food."
fallout_nzl_fishery_quota_compacts: "Fishery Quota Compacts"
fallout_nzl_fishery_quota_compacts_desc: "Fishing towns will receive labour guarantees in exchange for measured catches and patrol reports."
fallout_nzl_weatherproof_the_grain_sheds: "Weatherproof the Grain Sheds"
fallout_nzl_weatherproof_the_grain_sheds_desc: "Raised floors, sealed roofs, and guarded ventilation will protect reserve grain from cold rain and ash."
fallout_nzl_rebuild_devonport: "Rebuild Devonport"
fallout_nzl_rebuild_devonport_desc: "Survey the ruined naval base and prepare the long repair mission that can restore Auckland's basin."
fallout_nzl_storm_port_engineers: "Storm-Port Engineers"
fallout_nzl_storm_port_engineers_desc: "Permanent harbour crews will design for southern swells instead of rebuilding the same weak wall each year."
fallout_nzl_radio_weather_chain: "The Radio Weather Chain"
fallout_nzl_radio_weather_chain_desc: "Linked forecasts will give repair crews, patrols, and ration sailings time to reach shelter."
fallout_nzl_two_island_supply_ring: "The Two-Island Supply Ring"
fallout_nzl_two_island_supply_ring_desc: "Ports, railheads, stores, and weather stations will operate as one circuit with measured reserves at every handoff."
fallout_nzl_home_guard_rolls: "Home Guard Rolls"
fallout_nzl_home_guard_rolls_desc: "Each district will record trained defenders, issued rifles, and the state where they may be called."
fallout_nzl_port_militia_drill: "Port Militia Drill"
fallout_nzl_port_militia_drill_desc: "The harbour formations must learn to defend quays without consuming the equipment of a full field army."
fallout_nzl_convoy_volunteer_corps: "Convoy Volunteer Corps"
fallout_nzl_convoy_volunteer_corps_desc: "One escort formation can be raised from sailors and shore crews if the country pays its full equipment cost."
fallout_nzl_southern_cross_patrols: "Southern Cross Patrols"
fallout_nzl_southern_cross_patrols_desc: "Common bearings and recognition signals will let scattered craft cover the approaches together."
fallout_nzl_pirate_bearing_rooms: "Pirate Bearing Rooms"
fallout_nzl_pirate_bearing_rooms_desc: "Radio logs and coastal observers will distinguish a proven aggressor from a frightened stranger."
fallout_nzl_armed_rescue_cutters: "Armed Rescue Cutters"
fallout_nzl_armed_rescue_cutters_desc: "A limited convoy reserve will become patrol tenders that can escort rescues and challenge raiders."
fallout_nzl_coastal_denial_batteries: "Coastal Denial Batteries"
fallout_nzl_coastal_denial_batteries_desc: "Wellington and Auckland will receive fixed defences tied to the patrol rooms, not an unlimited fortification programme."
fallout_nzl_lifeboat_navy: "The Lifeboat Navy"
fallout_nzl_lifeboat_navy_desc: "The sea guard will become one service built for escort, rescue, repair, and denial in home waters."
fallout_nzl_call_the_island_radios: "Call the Island Radios"
fallout_nzl_call_the_island_radios_desc: "Search the current coastal successor ledger and contact one exact government that still commands a living shore."
fallout_nzl_offer_rescue_passages: "Offer Rescue Passages"
fallout_nzl_offer_rescue_passages_desc: "A partner that accepts our charts may use escorted passages without surrendering its ports or sovereignty."
fallout_nzl_pacific_rescue_mandate: "Pacific Rescue Mandate"
fallout_nzl_pacific_rescue_mandate_desc: "Two living partners can turn isolated passages into a standing relief compact."
fallout_nzl_relief_ports_without_annexation: "Relief Ports Without Annexation"
fallout_nzl_relief_ports_without_annexation_desc: "Postwar aid will repair local quays without claims, cores, or permanent New Zealand rule."
fallout_nzl_demand_quiet_seas: "Demand Quiet Seas"
fallout_nzl_demand_quiet_seas_desc: "Coastal governments will be told which waters the patrols consider closed to raiding."
fallout_nzl_punitive_anti_piracy_patrols: "Punitive Anti-Piracy Patrols"
fallout_nzl_punitive_anti_piracy_patrols_desc: "Only a recorded aggressor may face the bounded patrol campaign authorised by the wardens."
fallout_nzl_southern_sea_exclusion_zone: "Southern Sea Exclusion Zone"
fallout_nzl_southern_sea_exclusion_zone_desc: "The final cordon joins patrol bearings, licensed roads, and closed anchorages into one defended perimeter."
fallout_nzl_exclusion_zone_defeat_tt: "A recorded defeat leaves the exclusion zone weaker. Sea-Lane Security rises by §Y4§! and Parliament Trust falls by §R7§!."
fallout_nzl_exclusion_zone_secure_tt: "A verified settlement, or the absence of a proven aggressor, raises Sea-Lane Security by §Y12§!."
fallout_nzl_year_ten_order: "The Year Ten Order"
fallout_nzl_year_ten_order_desc: "A decade of ledgers, storms, rations, and patrols has created institutions that must outlive their emergency founders."

# Event chains
chaosx.fallout.127.t: "Names at the Harbour Door"
chaosx.fallout.127.d: "The first complete census reaches Wellington in damp folders carried by patrol launch. Harbour clerks have listed inland families beside sailors still waiting offshore, and the totals exceed the sound berths. The parliament must decide which record carries the force of law."
chaosx.fallout.127.a: "Publish every name and berth"
chaosx.fallout.127.b: "Give the wardens a guarded register"
chaosx.fallout.127.c: "Let each district bargain for its own places"
chaosx.fallout.129.t: "The First Berth List"
chaosx.fallout.129.d: "[GetFalloutNZLOpeningResultText]"
chaosx.fallout.129.a: "Carry the list to every quay"
chaosx.fallout.131.t: "A Parliament with a Shoreline"
chaosx.fallout.131.d: "Harbour delegates arrive knowing which decisions the districts accepted and which names were left outside. The chamber has acquired authority, but it can no longer pretend that admission is an abstract question."
chaosx.fallout.131.a: "Seat the delegates"
fallout_nzl_opening_result_success_text: "The published count survives inspection from both islands. Repair crews receive clear priorities, families can challenge errors, and the harbour masters begin work without rival lists."
fallout_nzl_opening_result_partial_text: "Most districts accept the count, though several keep private additions beside the official pages. Work begins while parliament sends clerks to settle the disputed berths."
fallout_nzl_opening_result_failure_text: "Two incompatible lists reach the quay on the same morning. Crowds force the gates, repair gangs abandon their tools, and the breakwater season opens under public suspicion."

chaosx.fallout.133.t: "The Milk Powder Rooms"
chaosx.fallout.133.d: "Inspectors in Canterbury find dry stores behind one sealed door and spoiled tins behind the next. The dairy boards want strict priority for working families. Harbour delegates demand a reserve for rescue vessels. Local ration committees insist that distant officials cannot know who is hungry."
chaosx.fallout.133.a: "Open the store books and ration hearings"
chaosx.fallout.133.b: "Protect the working reserve first"
chaosx.fallout.133.c: "Trust the local ration committees"
chaosx.fallout.135.t: "Rations Across Cook Strait"
chaosx.fallout.135.d: "[GetFalloutNZLDomesticResultText]"
chaosx.fallout.135.a: "Enter the outcome in the dairy ledger"
chaosx.fallout.137.t: "The Meaning of a Lifeboat"
chaosx.fallout.137.d: "The ration dispute has given the parliament its first durable factions. Open-berth delegates speak of a shared duty across the sea. Port wardens answer that a lifeboat without limits becomes another wreck."
chaosx.fallout.137.a: "Bring the dispute to a vote"
fallout_nzl_domestic_result_success_text: "Food trains reach the quays with sealed manifests and enough reserve to quiet the worst rumours. Dairy workers, harbour clerks, and district committees accept one ration calendar."
fallout_nzl_domestic_result_partial_text: "The principal towns receive their lots, but remote districts continue to trade outside the ledger. The reserve holds while the parliament negotiates another season."
fallout_nzl_domestic_result_failure_text: "Wet stores and competing orders leave whole consignments unusable. The smell from the opened warehouses reaches the road before the official explanation."

chaosx.fallout.139.t: "A Voice Beyond the Weather Band"
chaosx.fallout.139.d: "[GetFalloutNZLExternalOpeningText]"
chaosx.fallout.139.a: "Send charts and convoy escorts"
chaosx.fallout.139.b: "Offer a licensed passage under our patrols"
chaosx.fallout.139.c: "Begin with food and weather reports"
chaosx.fallout.139.e: "Log the silent coast and keep listening"
fallout_nzl_external_opening_partner_text: "A coastal transmitter answers Auckland with a current government name, a working tide table, and a request for terms. Its operators need a safe passage, but they will not surrender command of their own shore."
fallout_nzl_external_opening_no_partner_text: "Auckland Radio calls every bearing listed in the surviving coast books. Static fills the scheduled hours, and the operators can verify no government that is both coastal and able to answer. Food ships wait at anchor while the listening watch repeats the call."
chaosx.fallout.141.t: "New Zealand Calls the Passage"
chaosx.fallout.141.d: "New Zealand's radio operators have sent weather charts, approach bearings, and a proposal for one recorded sea road. The offer carries help, but accepting it will also place our vessels inside another government's harbour law."
chaosx.fallout.141.a: "Accept the passage and its public terms"
chaosx.fallout.141.b: "Accept only a restricted weather route"
chaosx.fallout.141.c: "Keep our vessels outside their ledger"
chaosx.fallout.143.t: "The First Pacific Passage"
chaosx.fallout.143.d: "[GetFalloutNZLExternalResultText]"
chaosx.fallout.143.a: "Record the answer at Auckland Radio"
chaosx.fallout.143.b: "Trade one guarded berth for patrol cover"
chaosx.fallout.143.b.tt: "The recorded partner receives military access and docking rights. Sea-Lane Security rises while Harbour Capacity and Parliament Trust fall. This concession permanently disqualifies No Raider Crossed the Cordon."
chaosx.fallout.145.t: "Two Shores on One Frequency"
chaosx.fallout.145.d: "The exchange has left both radio rooms with names, times, and obligations that can be checked. Whatever follows will concern two governments that have heard one another clearly."
chaosx.fallout.145.a: "Close the first contact ledger"
fallout_nzl_external_result_success_text: "The partner accepts a shared route and sends its own harbour marks for the return passage. The first escorted vessels cross with cargoes intact and no claim of ownership on either shore."
fallout_nzl_external_result_partial_text: "A narrow weather route opens under strict limits. It carries little cargo, but both sides keep the same frequency and a verified time for the next call."
fallout_nzl_external_result_failure_text: "The answering station rejects the proposed passage after its patrols question our terms. Fuel and food spent on the attempt do not return with the final transmission."

chaosx.fallout.147.t: "Ten Years of Harbour Books"
chaosx.fallout.147.d: "The earliest census pages have faded at their folds. Children who were carried ashore now work the signal rooms, and the emergency delegates are asked what law should remain when their seats are empty."
chaosx.fallout.147.a: "Make the open ledger a permanent constitution"
chaosx.fallout.147.b: "Entrust the guarded sea roads to permanent wardens"
chaosx.fallout.147.c: "Bind the districts through a two-island covenant"
chaosx.fallout.149.t: "The Order after the Emergency"
chaosx.fallout.149.d: "[GetFalloutNZLLateResultText]"
chaosx.fallout.149.a: "Sign beneath the four-star mark"
chaosx.fallout.151.t: "The Children of the Quays"
chaosx.fallout.151.d: "The new order is read at Wellington, Auckland, and the southern rail depots. Its first witnesses remember the sirens. Its youngest witnesses know only the institutions built afterward."
chaosx.fallout.151.a: "Leave them working harbours"
fallout_nzl_late_result_success_text: "Every principal harbour and ration district sends a lawful delegation. The final charter joins the sea roads, food circuit, public authority, and patrol command without reopening the founding fracture."
fallout_nzl_late_result_partial_text: "The charter passes with reservations from several districts and patrol stations. It preserves the country while leaving a difficult revision to the next elected or appointed chamber."
fallout_nzl_late_result_failure_text: "The delegates sign separate statements and return home without a common charter. The emergency offices remain, but their authority is narrower and more brittle than the founders intended."

# Achievements
chaosx_fallout_nzl_open_harbors_NAME: "Every Harbour Light"
chaosx_fallout_nzl_open_harbors_DESC: "Carry the Pacific Relief Republic through ten years of open passages without closing the last berths."
chaosx_fallout_nzl_closed_seas_NAME: "No Raider Crossed the Cordon"
chaosx_fallout_nzl_closed_seas_DESC: "Complete the Southern Refuge order with every assigned state secure and a proven aggressor defeated or settled."
chaosx_fallout_nzl_two_islands_one_lifeboat_NAME: "Two Islands, One Lifeboat"
chaosx_fallout_nzl_two_islands_one_lifeboat_DESC: "Complete the supply ring and lifeboat navy without losing a major mission or creating a second free escort force."
chaosx_fallout_nzl_achievement_eligible_tooltip: "This achievement becomes available to the current New Zealand Lifeboat State package during a Fallout campaign."
chaosx_fallout_nzl_open_harbors_tooltip: "Finish the humanitarian Year 10 order with two living relief partners, all four lifeboat values at 70 or more, full independence, and no Last Berth Closure."
chaosx_fallout_nzl_closed_seas_tooltip: "Finish the isolation Year 10 order with all five assigned states, Sea-Lane Security at 85, Food Security at 65, no foreign basing concession, and any recorded pirate aggressor defeated or forced into settlement."
chaosx_fallout_nzl_two_islands_one_lifeboat_tooltip: "Finish Year 10 with the Two-Island Supply Ring, Lifeboat Navy, both principal naval bases, full state control, no failed major mission, and no more than one extra escort formation."
