l_english:
mengele_event016_construct_singularity_command_node: "Construct a Singularity Command Node"
mengele_event016_construct_singularity_command_node_desc: "Bind the Directorate's command architecture to a controlled research facility. Its node will serve the completed Singularity while the site and its command channels remain intact."
mengele_event016_construct_singularity_power_link: "Construct a Singularity Power Link"
mengele_event016_construct_singularity_power_link_desc: "Run a dedicated power link through a controlled research facility. The link remains available to the Singularity only while the installation can be held and operated."
mengele_event016_singularity_command_node_requirements_tt: "Requires the Command Core component, or the paid Singularity Prototype without Gotterdammerung, at least [?constant:brilliant_scientist_singularity.minimum_facilities|0] controlled qualifying facilities, one owned and controlled construction site, and no other Singularity construction in progress."
mengele_event016_singularity_power_link_requirements_tt: "Requires the Power Link component, or the paid Singularity Prototype without Gotterdammerung, at least [?constant:brilliant_scientist_singularity.minimum_facilities|0] controlled qualifying facilities, one owned and controlled construction site, and no other Singularity construction in progress."
mengele_event016_singularity_command_node_started_tt: "Begins construction of one command node at the selected facility. It will count toward the Singularity network while the site remains intact and controlled."
mengele_event016_singularity_power_link_started_tt: "Begins construction of one power link at the selected facility. It will count toward the Singularity network while the site remains intact and controlled."
