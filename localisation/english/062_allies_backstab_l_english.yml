chaosx.nr62.1.t: "Allies backstab"

chaosx.nr62.2.t: "The Allies backstab us!"
chaosx.nr62.2.d: "The Allies have turned their weapons against us. Their armies are leaving our positions exposed, and our government is preparing to fight former partners."
chaosx.nr62.2.a: "We'll fight back!"

chaosx.nr62.3.t: "Our allies have backstabbed us!"
chaosx.nr62.3.d: "Our allies have turned against us. Their forces are moving into attack positions, and our government is preparing to fight former partners."
chaosx.nr62.3.a: "We'll fight back!"
