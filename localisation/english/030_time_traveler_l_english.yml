time_traveler_cause_opening_handling: "The first meeting set the tone. "
time_traveler_cause_consultation_success: "A consultation was carried out. "
time_traveler_cause_consultation_partial: "A consultation was only half carried out. "
time_traveler_cause_failed_timeline: "A forecast failed because the timeline moved. "
time_traveler_cause_failed_forgery: "A consultation failed after forged advice. "
time_traveler_cause_failed_ignored: "A consultation was left undone. "
time_traveler_cause_forgery_exposed: "A forgery was exposed. "
time_traveler_cause_forgery_acted: "The government acted on forged advice. "
time_traveler_cause_rival_belief: "A foreign move showed that others believe him. "
time_traveler_cause_leak: "Word of him leaked. "
time_traveler_cause_relocation: "He was moved to another site. "
time_traveler_cause_guard: "A guard detail drew attention. "
time_traveler_cause_sting: "A sting set foreign services back. "
time_traveler_cause_staff_copy: "Staff copied his teaching. "
time_traveler_cause_shared_forecast: "A forecast was shared with an ally. "
time_traveler_cause_arrangement: "The terms of access changed. "
time_traveler_cause_public_floor: "He was recognised in public. "
time_traveler_cause_theft: "His archive was copied. "
time_traveler_cause_rumor_scientists: "Scientists asked for access. "
time_traveler_cause_rumor_officers: "Officers began to plan around him. "
time_traveler_cause_rumor_press: "Journalists noticed the guards. "
time_traveler_cause_rumor_diplomats: "Diplomats asked questions. "
time_traveler_cause_rumor_industry: "Industrialists bid for contracts. "
time_traveler_cause_rumor_opposition: "The opposition raised the matter. "
time_traveler_cause_transfer: "Custody changed. "
time_traveler_cause_remembered_war: "A remembered war was acted on. "
time_traveler_cause_refusal: "The visitor was turned away. "
time_traveler_cause_secret_breach: "The secret program was breached. "
time_traveler_cause_counterintelligence: "Counterintelligence turned a foreign cell. "
