time_traveler_offer_cost_line: "Cost: [GetTimeTravelerPlainCost_xp][GetTimeTravelerPlainCost_command][GetTimeTravelerPlainCost_support][GetTimeTravelerPlainCost_fuel][GetTimeTravelerPlainCost_trains][GetTimeTravelerPlainCost_political][GetTimeTravelerAffordability]"
time_traveler_afford_no: "The government cannot cover this cost at present."
time_traveler_success_military: "With the divisions in place at [?time_traveler_c_state.GetName], the staff worked through the plan the visitor described and found three weaknesses in its own dispositions that no exercise had shown. The corrected orders are now in every headquarters and several officers have asked to read the visitor's notes."
time_traveler_success_industrial: "The works at [?time_traveler_c_state.GetName] now carry a heavier load. The visitor's note about a failing link in the supply chain was right to the week, and the repair finished a month before the shortage would have stopped the lines. The engineers kept the schedule he drew and use it as their own."
time_traveler_success_scientific: "The laboratories completed [GetTimeTravelerTechName] ahead of the schedule the visitor said was possible. The director reports that the method he described saved a year of dead ends, and the next projects of the same field are already being planned around it."
time_traveler_success_diplomatic: "The talks with [?time_traveler_c_target.GetName] ended on terms that the foreign ministry had not thought possible a season ago. The visitor had warned which clause would decide it, and he named the right one."
time_traveler_success_counterintelligence: "A clerk with a second set of keys to the records office at [?time_traveler_c_state.GetName] was found copying files on the night the guards arrived. The agency traced the keys to a foreign embassy and has closed the office to everyone but its own staff."
time_traveler_success_domestic: "The plot the visitor described had a name, a date and a list of officers. With the garrison in [?time_traveler_c_state.GetName] the arrests were made without a shot, and the government has published none of the details."
time_traveler_partial_garrison: "Some of the divisions reached [?time_traveler_c_state.GetName] in time and the rest arrived after the deadline."
time_traveler_partial_build: "The work on [?time_traveler_c_state.GetName] is half complete and the supply chain still has its weak link."
time_traveler_partial_research: "The laboratory is working on [GetTimeTravelerTechName] and the work is not finished."
time_traveler_partial_pact: "The Soviet Union refused the pact, and the visitor says that the refusal changes the history he remembers."
time_traveler_partial_relation: "Relations with [?time_traveler_c_target.GetName] have improved without reaching the goal."
chaosx.nr30.24.d_timeline: "The forecast did not hold. Several things the visitor remembered have already changed, and he says that the dates he gave are no longer reliable. The deadline passed without the objective."
chaosx.nr30.24.d_forgery: "The advice that the staff acted on did not come from the visitor. An investigation was opened into who placed it in the files, and the ministry that acted on it has lost standing."
chaosx.nr30.24.d_ignored: "The deadline passed with the objective unmet. The visitor said nothing during the review, and the officials who urged action have gone quiet."
time_traveler_op_infiltrate_fail: "The operation against the program found nothing and drew no attention."
time_traveler_op_infiltrate_exposed: "The operation was noticed. A cell was caught and our network in the program has been set back."
time_traveler_op_infiltrate_1: "Our people obtained the schedule of the visitor's consultations and the names of the staff who attend them."
time_traveler_op_infiltrate_2: "A staff member now works for us, and we hold a first copy of the visitor's knowledge."
time_traveler_op_infiltrate_3: "Our people copied the archive of the program page by page. The copy is complete."
time_traveler_op_forge_ok: "The forged memorandum reached the cabinet under the visitor's initials."
time_traveler_op_forge_fail: "The forgery was caught on its way and our network lost a courier."
time_traveler_op_forge_exposed: "The forgery was caught and traced to us. The program knows our name."
time_traveler_op_asylum_ok: "The visitor accepted our offer and is now in our country. The officials who took him in are asking how he will be kept."
time_traveler_op_asylum_fail: "The visitor refused. His answer will be read in every foreign ministry as proof that he is believed."
time_traveler_op_seize_failed: "The attempt failed. The guards drove our men off and none of them was captured."
time_traveler_op_seize_double: "We hold a man in the visitor's coat who does not know the future. He was placed there for us."
time_traveler_op_seize_wounded: "The attempt failed and the visitor was wounded in the struggle."
time_traveler_op_seize_transferred: "The visitor is in our hands. He was taken at night and arrived under guard."
time_traveler_op_seize_exposed: "The attempt failed and our service was named."
time_traveler_op_seize_vanished: "The visitor disappeared before either side arrived. Our men found an empty room."
time_traveler_op_seize_assassinated: "The visitor is dead. The decision to kill him was taken by our service."
