l_english:
chaosx.nr30.1.t: "Time Traveler"
chaosx.nr30.2.t: "Time Traveler"
chaosx.nr30.2.d: "A mysterious individual claiming to be a time traveler has appeared inside our borders with predictions about future wars. Military planners are comparing the claims with their own intelligence and revising contingency plans."
chaosx.nr30.2.a: "Test the claims."

chaosx.nr30.3.t: "Time Traveler talked"
chaosx.nr30.3.d: "Our country has proposed an alliance with the USSR after a time traveler described the likely outcome of a war against the Soviet Union. The proposed Berlin-Moscow Axis would redirect our strategy toward shared security and a negotiated peace in Europe."
chaosx.nr30.3.a: "Ally Moscow"
chaosx.nr30.3.b: "Our Fatherland must be bigger!"

chaosx.nr30.4.t: "[From.GetName] proposes alliance"
chaosx.nr30.4.d: ""
chaosx.nr30.4.a: "Ally Berlin"
chaosx.nr30.4.b: "Nazi dogs!"

chaosx.nr30.5.t: "Unholy Alliance"
chaosx.nr30.5.d: ""
chaosx.nr30.5.a: "Form Berlin-Moscow Axis"

chaosx.nr30.6.t: "[From.GetName] denies us!"
chaosx.nr30.6.d: ""
chaosx.nr30.6.a: "Whores!"

chaosx.nr30.7.t: "Time Traveler talked"
chaosx.nr30.7.d: "A time traveler has given us intelligence on Japan's military plans. The information reveals likely operations and preparations, giving our commanders time to protect the Pacific and prepare their own forces."
chaosx.nr30.7.a: "Capture the visitor."

chaosx.news.33.t: "Time Traveler"
chaosx.news.33.d: "A mysterious individual claiming to be a time traveler has appeared in [From.GetName] with intelligence about future security threats and covert operations. The visitor's precise predictions have helped officials disrupt attacks and revise their plans, while the visitor's origins remain unknown. [From.GetName] is now studying what the encounter means for intelligence work and defense."
chaosx.news.33.a: "The evidence warrants investigation."

chaosx.news.34.t: "The Berlin-Moscow Axis"
chaosx.news.34.d: "The time traveler's forecast of a German defeat in the Soviet Union has driven German intelligence to open diplomatic talks. Germany has proposed the Berlin-Moscow Axis, tying the two powers together before the predicted invasion."
chaosx.news.34.a: "The alliance is unexpected."

chaosx.news.35.t: "USA Intelligence"
chaosx.news.35.d: "The United States has received the time traveler's account of Japan's operations. American commanders now know the plans behind several surprise attacks and are changing Pacific defenses before those operations begin."
chaosx.news.35.a: "Japan is exposed."
