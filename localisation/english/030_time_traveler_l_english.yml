time_traveler_recent_line: "Recent: [GetTimeTravelerRecent0][GetTimeTravelerRecent1][GetTimeTravelerRecent2]"
time_traveler_category: "The Visitor"
time_traveler_category_desc: "Credibility §Y[?time_traveler_credibility|0]§!: [GetTimeTravelerCredibilityBand]. [GetTimeTravelerCredibilityEffect]\nExposure §Y[?time_traveler_exposure|0]§!: [GetTimeTravelerExposureBand]. [GetTimeTravelerExposureEffect]\nTimeline Divergence §Y[?global.time_traveler_divergence|0]§!: [GetTimeTravelerDivergenceBand]. [GetTimeTravelerDivergenceEffect]\n$time_traveler_arrangement_line$ [GetTimeTravelerStatusLine]\n$time_traveler_recent_line$"
time_traveler_foreign_category: "The Visitor Abroad"
time_traveler_foreign_category_desc: "A man who remembers a later time is held by [GetTimeTravelerCustodianName]. Infiltration is always open to us. Forged advice and offers of asylum need a program that is suspected, and an attempt to seize him needs a program that is public and a network of our own that is mature."
time_traveler_custodian_none: "a foreign government"
time_traveler_custodian_named: "[?global.time_traveler_custodian.GetName]"
time_traveler_family_military: "Military forecast"
time_traveler_family_industrial: "Industrial bottleneck"
time_traveler_family_scientific: "Scientific shortcut"
time_traveler_family_diplomatic: "Diplomatic forecast"
time_traveler_family_counterintelligence: "Counterintelligence map"
time_traveler_family_domestic: "Domestic threat assessment"
time_traveler_intro_military: "The visitor has marked a place on the map where he remembers a line giving way."
time_traveler_intro_industrial: "The visitor remembers a failure in the supply system that stopped a whole season of production."
time_traveler_intro_scientific: "The visitor knows which line of research succeeds and which wastes years."
time_traveler_intro_diplomatic: "The visitor remembers a negotiation that decided how a coalition held together."
time_traveler_intro_counterintelligence: "The visitor remembers how a foreign service reached the records of a program like this one."
time_traveler_intro_domestic: "The visitor remembers a plot against the government that nobody saw coming."
time_traveler_intro_pact: "The visitor remembers how the war against the Soviet Union ended and says that a pact between the two governments would prevent it."
time_traveler_intro_pacific: "The visitor remembers the Pacific war and the place where its first blow fell."
time_traveler_objective_military: "Place at least [?time_traveler_c_required|0] divisions in [?time_traveler_c_state.GetName]."
time_traveler_objective_counterintelligence: "Guard the records office at [?time_traveler_c_state.GetName] with at least [?time_traveler_c_required|0] divisions."
time_traveler_objective_domestic: "Garrison [?time_traveler_c_state.GetName] with at least [?time_traveler_c_required|0] divisions so that arrests can be made quietly."
time_traveler_objective_pacific: "Hold [?time_traveler_c_state.GetName] with at least [?time_traveler_c_required|0] divisions before the first blow."
time_traveler_objective_build: "Raise the infrastructure of [?time_traveler_c_state.GetName] by two levels."
time_traveler_objective_research: "Complete [GetTimeTravelerTechName]."
time_traveler_objective_pact: "Bring [?time_traveler_c_target.GetName] into a pact with us."
time_traveler_objective_relation: "Raise the opinion that [?time_traveler_c_target.GetName] holds of us above [?time_traveler_c_goal|0]."
time_traveler_tech_fuel_silos: "fuel silos"
time_traveler_tech_improved_machine_tools: "improved machine tools"
time_traveler_tech_advanced_machine_tools: "advanced machine tools"
time_traveler_tech_computing_machine: "the computing machine"
time_traveler_tech_radio: "radio"
time_traveler_deadline_text: "The deadline is [?time_traveler_c_days|0] days away."
time_traveler_reward_military: "Success gives army experience and a period of faster planning with stronger attack, defence and entrenchment."
time_traveler_reward_industrial: "Success adds a level of infrastructure to the state and keeps factory efficiency higher for a long time."
time_traveler_reward_scientific: "Success gives a research bonus that applies to the next technologies of the same field."
time_traveler_reward_counterintelligence: "Success lowers Exposure, sets back one foreign network and makes the next sting more likely to succeed."
time_traveler_reward_domestic: "Success restores stability and weakens resistance in the country for a time."
time_traveler_reward_pact: "Success forms a faction with [?time_traveler_c_target.GetName] and changes the opinion of every other power."
time_traveler_reward_relation: "Success earns lasting goodwill and, where possible, a non-aggression pact with [?time_traveler_c_target.GetName]."
time_traveler_precision_recognizable: "The timeline still matches his memory, so he gives dates and names."
time_traveler_precision_altered: "The timeline has moved from his memory, so he gives ranges of dates and the conditions that matter."
time_traveler_precision_broken: "The timeline has broken from his memory, so he can only warn of weak structures."
time_traveler_spread_yes: "Many people work with him, so the advice is known beyond the visitor himself."
time_traveler_spread_no: "Nobody but the visitor knows the advice."
