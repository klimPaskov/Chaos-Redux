time_traveler_quote_suppress_political_blocked: "£pol_power §R[?time_traveler_cost_suppress_political|0]§!"
time_traveler_cost_suppress: "[GetTimeTravelerQuote_suppress_political]"
time_traveler_cost_suppress_blocked: "$time_traveler_cost_suppress$"
time_traveler_cost_suppress_tooltip: "$time_traveler_cost_suppress$"
time_traveler_consult: "Consult the visitor"
time_traveler_consult_desc: "Put one question to the visitor. You choose the field, read the objective, the deadline and the cost, and commit before anything is paid."
time_traveler_consult_requirements_tt: "No consultation is running, the shared cooldown has ended and the visitor can be reached."
time_traveler_consult_tt: "Opens the list of questions for the visitor."
time_traveler_revise: "Revise the terms of access"
time_traveler_revise_desc: "Change who may see the visitor and how widely his advice is known. The payment is returned if the terms stay as they are."
time_traveler_revise_requirements_tt: "No revision in the last four months and no consultation running."
time_traveler_revise_tt: "Opens the terms of access for review."
time_traveler_relocate: "Move the visitor"
time_traveler_relocate_desc: "Take the visitor to another secure state. He cannot be consulted for ten days, foreign services lose their present trail and the move may leak."
time_traveler_relocate_requirements_tt: "No consultation is running and the visitor was not moved in the last two months."
time_traveler_relocate_tt: "The visitor moves to another secure state and consultations pause for ten days. Foreign networks lose ground and Exposure usually falls."
time_traveler_guard: "Assign a guard detail"
time_traveler_guard_desc: "Surround the visitor with guards and a security detail. Seizure and infiltration become harder, and more people learn that something is guarded."
time_traveler_guard_requirements_tt: "No guard detail is in place and the last one ended at least five months ago."
time_traveler_guard_tt: "A guard detail protects the visitor for five months and Exposure rises."
time_traveler_sting: "Run a sting against [FROM.GetName]"
time_traveler_sting_desc: "Decoy meetings and false schedules aimed at one foreign service. A success sets its network back and may leave a decoy for a later seizure. The sting can end with an offer to use the visitor as bait."
time_traveler_sting_requirements_tt: "No sting in the last two and a half months."
time_traveler_sting_tt: "A sting is run against [FROM.GetName]. Success lowers Exposure and sets its network back, failure tells it more about the visitor's route."
time_traveler_share: "Share a forecast with [FROM.GetName]"
time_traveler_share_desc: "Give an ally one verified forecast. The ally gains a Future Fragment and its network pressure ends, and the timeline moves further from the one the visitor remembers. A remembered war follows if the ally has one."
time_traveler_share_requirements_tt: "A completed consultation has not been shared yet and the last share was at least four months ago."
time_traveler_share_tt: "[FROM.GetName] receives a forecast and a Future Fragment. Timeline Divergence rises."
time_traveler_infiltrate: "Infiltrate the program"
time_traveler_infiltrate_desc: "Send people into the visitor's program. Each success moves the network a step: first the schedules, then a recruited staff member and a Future Fragment, then the archive."
time_traveler_infiltrate_tt: "Our network in the program advances by one step if the operation succeeds."
time_traveler_forge: "Plant forged advice"
time_traveler_forge_desc: "Place a memorandum in the program's files under the visitor's initials. If the government acts on it we gain and it pays. If it is checked in time our network collapses."
time_traveler_forge_tt: "A forged memorandum reaches the program's cabinet."
time_traveler_asylum: "Offer asylum to the visitor"
time_traveler_asylum_desc: "Offer the visitor a house, a salary and safe passage. He weighs how he is treated, how stable his host is and how far he trusts us."
time_traveler_asylum_tt: "The visitor may accept and move to our country, or refuse in public."
time_traveler_seize: "Seize the visitor"
time_traveler_seize_desc: "Take the visitor by force with a team that is already in place. The attempt can leave a captured double, a wounded visitor, an exposed service or a visitor in our hands."
time_traveler_seize_tt: "The visitor may be taken, wounded or lost, and our service may be named."
time_traveler_operation_requirements_tt: "The last operation ended at least forty-five days ago."
time_traveler_mission_garrison: "[GetTimeTravelerFamilyName]"
time_traveler_mission_garrison_desc: "[GetTimeTravelerObjectiveText] [GetTimeTravelerDeadlineLine]"
time_traveler_mission_build: "[GetTimeTravelerFamilyName]"
time_traveler_mission_build_desc: "[GetTimeTravelerObjectiveText] [GetTimeTravelerDeadlineLine]"
time_traveler_mission_research: "[GetTimeTravelerFamilyName]"
time_traveler_mission_research_desc: "[GetTimeTravelerObjectiveText] [GetTimeTravelerDeadlineLine]"
time_traveler_mission_relation: "[GetTimeTravelerFamilyName]"
time_traveler_mission_relation_desc: "[GetTimeTravelerObjectiveText] [GetTimeTravelerDeadlineLine]"
time_traveler_deadline_line: "The advice earns its reward only when this is done by the deadline."
time_traveler_mission_garrison_objective_tt: "[GetTimeTravelerObjectiveText]"
time_traveler_mission_build_objective_tt: "[GetTimeTravelerObjectiveText]"
time_traveler_mission_research_objective_tt: "[GetTimeTravelerObjectiveText]"
time_traveler_mission_relation_objective_tt: "[GetTimeTravelerObjectiveText]"
time_traveler_mission_complete_tt: "The advice has been carried out. The reward is paid and Credibility rises."
time_traveler_mission_timeout_tt: "The deadline passes. Part of the objective earns a reduced reward, otherwise the advice fails."
time_traveler_unverified_forecasts: "Unverified Forecasts"
time_traveler_unverified_forecasts_desc: "Officials have heard a stranger's forecasts and have not yet been told whether to trust them. Some plan around them and some lose time arguing."
time_traveler_directed_analyst: "Directed Foreknowledge"
time_traveler_directed_analyst_desc: "The staff has been briefed by a man who remembers how fronts gave way. Plans are made faster and officers learn from the failures he describes."
time_traveler_directed_engineer: "Directed Foreknowledge"
time_traveler_directed_engineer_desc: "Engineers and managers have been briefed by a man who remembers how factories and laboratories were run. Work is organised better and research moves faster."
time_traveler_directed_historian: "Directed Foreknowledge"
time_traveler_directed_historian_desc: "Ministers have been briefed by a man who remembers which institutions held and which broke. The government steadies itself and decides sooner."
time_traveler_distributed_analyst: "Distributed Future Knowledge"
time_traveler_distributed_analyst_desc: "Three consultations have been carried out and the general staff has copied the method into its own planning. Orders are drawn up quickly and units are trained to hold."
time_traveler_distributed_engineer: "Distributed Future Knowledge"
time_traveler_distributed_engineer_desc: "Three consultations have been carried out and the ministries have copied the method into factories and laboratories. Construction, efficiency and research all gain."
time_traveler_distributed_historian: "Distributed Future Knowledge"
time_traveler_distributed_historian_desc: "Three consultations have been carried out and the ministries have copied the method into their daily work. The state holds together better and resistance finds less to feed on."
time_traveler_scattered_forecasts: "Scattered Forecasts"
time_traveler_scattered_forecasts_desc: "The visitor is gone and his forecasts survive as notes, memories and habits in a few offices. They still save some time."
time_traveler_scattered_forecasts_deep: "Scattered Forecasts"
time_traveler_scattered_forecasts_deep_desc: "The visitor is gone and the staff has kept three consultations of his advice in its procedures. The habits survive him and still save time."
time_traveler_future_fragment: "Future Fragment"
time_traveler_future_fragment_desc: "A copy of part of the visitor's knowledge reached this country and its staff has begun to use it."
time_traveler_operational_window: "Operational Window"
time_traveler_operational_window_desc: "The staff has redrawn its plans on the visitor's forecast and has room to act on them."
time_traveler_retained_efficiency: "Retained Efficiency"
time_traveler_retained_efficiency_desc: "The factories keep the schedule that the visitor drew and lose less to delay."
time_traveler_secured_order: "Secured Order"
time_traveler_secured_order_desc: "A plot was stopped before it began and the country is quieter for it."
time_traveler_sting_ready: "Counterintelligence Habits"
time_traveler_sting_ready_desc: "The agency has learned from the last operation and plans the next one more carefully."
chaosx.nr30.1.t: "Time Traveler"
chaosx.nr30.2.t: "A Visitor Without a Past"
chaosx.nr30.2.d_analyst: "A man in a coat that no tailor in [ROOT.GetName] would recognise walked into a staff office in [?time_traveler_arrival_state.GetName] and asked for the duty officer by name. He gave the postings of three officers who have not yet been told of them, drew the next season's front lines from memory and offered to prove the rest on any terms the government liked. He says he comes from a later time and that the war he remembers is the one now being prepared."
chaosx.nr30.2.d_engineer: "A man with a notebook full of neat, unfamiliar shorthand asked at the gate of a works near [?time_traveler_arrival_state.GetName] to see the chief engineer. He described a flaw in a gearbox that the works has kept secret for a year and sketched the fix on the back of a delivery slip. He says he comes from a later time, that the machines he learned on do not exist yet and that he will work for anyone who listens."
chaosx.nr30.2.d_historian: "A quiet man with a clerk's hands went to the state archive in [?time_traveler_arrival_state.GetName] and asked the keeper for the file of a minister who has not yet been appointed. He recited, in order, the cabinets of the next ten years and the reasons each of them fell. He says he comes from a later time and that he has read the history of this country as it was written there."
chaosx.nr30.2.a: "Hear him out."
chaosx.nr30.2.a_tt: "The visitor speaks to the officials who can test him, and more people hear of him."
chaosx.nr30.2.b: "Detain him until the claim is checked."
chaosx.nr30.2.b_tt: "The visitor is held under guard. He trusts the government less and few people hear of him."
chaosx.nr30.2.c: "Keep him away from the staff."
chaosx.nr30.2.c_tt: "The visitor sees only two officials and almost nobody hears of him."
chaosx.nr30.2.d: "Have him tested quietly."
chaosx.nr30.2.d_tt: "The agency tests him against the records and the government trusts his answers more."
chaosx.nr30.2.e: "Send him away."
chaosx.nr30.2.e_tt: "The visitor leaves and direct access ends. Rumors spread in the capital and the timeline begins to move."
chaosx.nr30.3.t: "A Pact With Moscow"
chaosx.nr30.3.d: "The visitor describes the war against the Soviet Union as it ended in the history he remembers, a campaign that began in confidence and was lost in the second winter at a cost the country never recovered from. He says that the same war can be avoided if Berlin and Moscow bind themselves before the armies are ready. The foreign ministry has drafted a pact on that basis, and the decision belongs to the cabinet."
chaosx.nr30.3.a: "Propose the Berlin-Moscow pact."
chaosx.nr30.3.a_tt: "[SOV.GetName] receives the proposal and may accept or refuse it. The timeline moves further from the one the visitor remembers."
chaosx.nr30.3.b: "Press the claim in the east."
chaosx.nr30.4.t: "[From.GetName] Proposes a Pact"
chaosx.nr30.4.d: "[From.GetName] has sent an envoy with the draft of a pact between the two governments and a reference to intelligence it will not name. The draft promises consultation on every border question and a joint faction, and the men who carried it say that [From.GetName] is prepared to wait for an answer."
chaosx.nr30.4.a: "Accept the pact."
chaosx.nr30.4.a_tt: "[From.GetName] forms a faction with us."
chaosx.nr30.4.b: "Refuse."
chaosx.nr30.4.b_tt: "[From.GetName] is told that the proposal is declined."
chaosx.nr30.5.t: "The Berlin-Moscow Axis"
chaosx.nr30.5.d: "[From.GetName] has accepted the pact. The two governments announce a faction that evening, and the foreign press spends the following week trying to decide what the announcement means."
chaosx.nr30.5.a: "Form the Berlin-Moscow Axis."
chaosx.nr30.6.t: "[From.GetName] Refuses"
chaosx.nr30.6.d: "[From.GetName] returned the draft with a courteous note and no counterproposal. The visitor's account of the war that followed the pact in his own history now has nothing to stand on, and the cabinet must decide what to make of it."
chaosx.nr30.6.a: "Accept the refusal."
chaosx.nr30.7.t: "The Pacific War, Remembered"
chaosx.nr30.7.d: "The visitor was shown the Pacific charts and wrote beside each of them the date of the operation that Japan will plan for it. The navy's own intelligence section checked three of the dates against intercepted signals and found the same dates. Commanders now have time to protect the Pacific and prepare their own forces."
chaosx.nr30.7.a: "Study the plans."
chaosx.nr30.7.a_tt: "[JAP.GetName] is exposed to our intelligence services. The timeline moves further from the one the visitor remembers."
chaosx.nr30.10.t: "The Sealed Page"
chaosx.nr30.10.d_agency: "The visitor asked for paper and wrote one page. It describes a counterintelligence file that the agency of [ROOT.GetName] opened three weeks ago, with the cover name of the officer who runs it and the reason the file was never copied. The agency's chief read the page twice and asked who had spoken to him. Nobody had."
chaosx.nr30.10.d_industry: "The visitor asked for paper and wrote one page. It names a supplier, a delivery date and the reason a shipment of machine tools has been held at the border for a month. Only three men in the ministry knew all of it, and none of them had been near him."
chaosx.nr30.10.d_research: "The visitor asked for paper and wrote one page. It describes a problem that the best laboratory in [ROOT.GetName] has failed to solve for a year and names the researcher who found the flaw last week and has not yet reported it. The laboratory director confirmed every line."
chaosx.nr30.10.a: "Check the page against the records."
chaosx.nr30.10.a_tt: "The first proof is counted and Credibility rises."
chaosx.nr30.11.t: "A Closed Room"
chaosx.nr30.11.d: "Late in the week the visitor was asked about a meeting of which no record exists. He described a conversation between [ROOT.GetLeader] and one adviser in a room with the door shut, down to the argument over whether to delay a decision and the unfinished sentence that ended it. [ROOT.GetLeader] confirmed the room, the hour and the argument and asked that nobody repeat it. The visitor gives his name as Jonas Calder."
chaosx.nr30.11.a: "The government accepts him as genuine."
chaosx.nr30.11.a_tt: "The second proof is counted and Credibility rises. The visitor is verified and the government chooses how he will work with the state."
chaosx.nr30.12.t: "The Forecast Is Checked"
chaosx.nr30.12.d_correct: "Forty days ago the visitor wrote that the disorder among the powers would be worse by the end of the season. The reports on the minister's desk bear him out, and several staff members have asked why they were not told earlier."
chaosx.nr30.12.d_missed: "Forty days ago the visitor wrote that the disorder among the powers would be worse by the end of the season. The reports show a calmer world than he described. He accepted this without argument and asked the staff to treat his later dates with more caution."
chaosx.nr30.12.a: "The forecast is entered in the file."
chaosx.nr30.13.t: "Terms of Access"
chaosx.nr30.13.d: "Two proofs have held, and the visitor, who gives his name as Jonas Calder, waits to learn how the government will use him. He answers any question put to him and asks that the answers be acted on and not filed. The cabinet must decide who may see him, who may question him and how widely his advice is known."
chaosx.nr30.13.d_transferred: "The visitor, Jonas Calder, has arrived in [ROOT.GetName] after a change of custody and asks under what terms he will be kept. The officials who received him have read the earlier record. He answers every question put to him and says nothing of the country he left."
chaosx.nr30.13.cabinet: "Make him an adviser to the cabinet."
chaosx.nr30.13.cabinet_tt: "Every kind of consultation opens and the visitor becomes an adviser of the government. Exposure grows fastest."
chaosx.nr30.13.secret: "Keep him in a secret program."
chaosx.nr30.13.secret_tt: "Only the two strongest kinds of consultation and counterintelligence open. Exposure grows slowest, and a breach costs the most."
chaosx.nr30.13.confinement: "Keep him in confinement."
chaosx.nr30.13.confinement_tt: "Every kind of consultation opens, Credibility rises at half the rate and Exposure stays low. Foreign offers of asylum succeed more often."
chaosx.nr30.13.public: "Recognise him publicly."
chaosx.nr30.13.public_tt: "Exposure is fixed in the Public band and the government gains prestige. The staff coordinates faster and rivals may act openly."
chaosx.nr30.14.t: "Revising the Terms"
chaosx.nr30.14.d: "The terms under which the visitor works are open for review. The staff has drafted the alternatives and the payment for the review has been made."
chaosx.nr30.14.keep: "Leave the terms as they are."
chaosx.nr30.14.keep_tt: "The payment is returned."
chaosx.nr30.14.end: "Release him by agreement."
chaosx.nr30.14.end_tt: "Direct access ends by agreement. The institution keeps what it has learned and nothing is taken by force."
chaosx.nr30.15.t: "The Visitor Leaves"
chaosx.nr30.15.d: "The visitor accepted the refusal, collected his notebook and left the building. By morning he could not be found at any station, inn or border post. A clerk who had copied the first page of his proof has already shown it to two ministries, and the story is told in the cafes of the capital."
chaosx.nr30.15.a: "The file is closed."
chaosx.nr30.16.t: "A Page From [From.GetName]"
chaosx.nr30.16.d: "An envoy of [From.GetName] has brought the cabinet one page of forecasts and a request that its source stay unnamed. The page is specific enough that the general staff has started to compare it with its own plans. The copy carries no authority of its own, and other governments may have received the same page."
chaosx.nr30.16.a: "Study the page."
chaosx.nr30.16.a_tt: "The country gains a Future Fragment."
chaosx.nr30.20.t: "Questions for the Visitor"
chaosx.nr30.20.d: "The visitor is ready to answer. [GetTimeTravelerPrecisionLine] Each question commits the government to act on the answer before a deadline, and only one commitment can run at a time."
chaosx.nr30.20.close: "Not now."
chaosx.nr30.20.military: "Ask about the front."
chaosx.nr30.20.military_tt: "The visitor names a place for the army to hold. The objective, the deadline and the cost are shown before anything is paid."
chaosx.nr30.20.industrial: "Ask about the factories and railways."
chaosx.nr30.20.industrial_tt: "The visitor names a state whose infrastructure will fail. The objective, the deadline and the cost are shown before anything is paid."
chaosx.nr30.20.scientific: "Ask about research."
chaosx.nr30.20.scientific_tt: "The visitor names a technology worth finishing. The objective, the deadline and the cost are shown before anything is paid."
chaosx.nr30.20.diplomatic: "Ask about our neighbors."
chaosx.nr30.20.diplomatic_tt: "The visitor names a government to win over. The objective, the deadline and the cost are shown before anything is paid."
chaosx.nr30.20.counterintelligence: "Ask who is watching us."
chaosx.nr30.20.counterintelligence_tt: "The visitor names the place foreign services will reach for. The objective, the deadline and the cost are shown before anything is paid."
chaosx.nr30.20.domestic: "Ask about threats at home."
chaosx.nr30.20.domestic_tt: "The visitor names a place where a plot is forming. The objective, the deadline and the cost are shown before anything is paid."
chaosx.nr30.21.t: "The Visitor's Forecast: [GetTimeTravelerFamilyName]"
chaosx.nr30.21.d: "[GetTimeTravelerOfferIntro]\n\n[GetTimeTravelerObjectiveText] [GetTimeTravelerDeadlineLineOffer]\n\n[GetTimeTravelerOfferReward]\n\n[GetTimeTravelerPrecisionLine] [GetTimeTravelerSpreadLine]\n\n$time_traveler_offer_cost_line$"
time_traveler_deadline_line_offer: "The deadline is [?time_traveler_c_days|0] days away."
chaosx.nr30.21.withdraw: "Withdraw the question."
chaosx.nr30.21.commit: "Commit the government to the objective."
chaosx.nr30.21.commit_tt: "The cost is paid and a mission starts. The advice earns its full reward only when the objective is carried out."
chaosx.nr30.22.t: "The Advice Is Carried Out"
chaosx.nr30.22.d: "[GetTimeTravelerSuccessBody]"
chaosx.nr30.22.a: "The result is entered in the file."
chaosx.nr30.23.t: "Part of the Objective Is Met"
chaosx.nr30.23.d: "The deadline has passed with part of the objective achieved. [GetTimeTravelerPartialBody] The visitor says that the rest is still within reach if the government is willing to press on for another two months."
chaosx.nr30.23.take: "Take what has been achieved."
chaosx.nr30.23.take_tt: "A reduced reward is paid."
chaosx.nr30.23.press: "Press on for sixty more days."
chaosx.nr30.23.press_tt: "The objective stays the same and the mission runs again once."
chaosx.nr30.24.t: "The Advice Fails"
chaosx.nr30.24.a: "Understood."
chaosx.nr30.30.t: "Foreign Interest"
chaosx.nr30.31.t: "A Staff Member Is Compromised"
chaosx.nr30.31.d: "A clerk in the visitor's office has been seen with a stranger twice this month, and his accounts of the two meetings do not agree. The agency believes that a foreign service has recruited him and copied the schedule of the visitor's consultations. It does not know which service."
chaosx.nr30.31.dismiss: "Dismiss him."
chaosx.nr30.31.dismiss_tt: "The foreign service that recruited him loses part of its network."
chaosx.nr30.31.turn: "Turn him against the service."
chaosx.nr30.31.turn_tt: "The service may lose its network and the government gains credit, or the attempt fails and draws attention to the program."
chaosx.nr30.31.watch: "Watch him and say nothing."
chaosx.nr30.31.watch_tt: "The service's next operation is much more likely to fail."
chaosx.nr30.32.t: "Advice Under the Visitor's Name"
chaosx.nr30.32.d: "A memorandum has reached the cabinet over the visitor's initials. It recommends a specific decision for the coming month and gives reasons that sound like his. The agency cannot say where it was written, and the visitor, shown the page, says that he does not remember writing it."
chaosx.nr30.32.verify: "Check it with the visitor before acting."
chaosx.nr30.32.verify_tt: "The advice may be exposed as a forgery, which ends the network behind it and raises Credibility."
chaosx.nr30.32.act: "Act on the memorandum."
chaosx.nr30.32.act_tt: "The recommended decision is carried out. If the memorandum is forged the government pays for it and the service behind it gains."
chaosx.nr30.33.t: "An Offer to the Visitor"
chaosx.nr30.33.d: "A foreign government has offered the visitor asylum, a house and a salary. He declined, and told the officials who carried the offer that he was content with the terms he has. The foreign ministry reads the refusal as proof that other governments believe he is genuine."
chaosx.nr30.33.a: "Note the offer."
chaosx.nr30.34.t: "An Attempt on the Visitor"
chaosx.nr30.34.d_failed: "A group of armed men tried to take the visitor from his quarters at night. The guards drove them off, and the men left no papers. The visitor was shaken and unharmed."
chaosx.nr30.34.d_double: "Armed men took a man from the visitor's quarters at night and drove away with him. He was an employee of the program in the visitor's coat, placed there for such a night. The visitor slept in another building."
chaosx.nr30.34.d_wounded: "Armed men entered the visitor's quarters at night. The guards drove them off, but the visitor was wounded in the struggle. His doctors say that he will not be able to answer questions for two months."
chaosx.nr30.34.d_exposed: "A group tried to take the visitor at night and was caught by the guards. Two of the men carried papers that name the service behind the attempt, and the story is already known in the capital."
chaosx.nr30.34.a: "Record the attempt."
chaosx.nr30.35.t: "The Archive Is Copied"
chaosx.nr30.35.d: "An audit of the program's records found that the archive of consultations has been copied page by page over several weeks. The copy is complete and its destination is not known. Every consultation the government has commissioned is now in foreign hands."
chaosx.nr30.35.a: "Tighten the archive."
chaosx.nr30.35.a_tt: "Exposure rises."
chaosx.nr30.36.t: "A Foreign Cell Is Caught"
chaosx.nr30.36.d: "[From.GetName] has run a cell inside the program for months. The agency found its safe house, its schedules and the cipher it used to report to the embassy of [From.GetName]. The material is complete enough to publish."
chaosx.nr30.36.a: "Make the evidence known."
chaosx.nr30.36.a_tt: "Credibility rises and relations with [From.GetName] worsen."
chaosx.nr30.37.t: "Report From the Operation"
chaosx.nr30.37.d: "[GetTimeTravelerOpReportBody]"
chaosx.nr30.37.a: "The report is filed."
chaosx.nr30.38.t: "A Prisoner Who Is Not the Visitor"
chaosx.nr30.38.d: "The man taken from [GetTimeTravelerCustodianName] speaks the visitor's phrases, carries his notebook and knows details of the program. He cannot answer any question that the intelligence service asks about the future. The service believes it holds a prepared double and must decide what to make of him."
chaosx.nr30.38.expose: "Expose the deception."
chaosx.nr30.38.expose_tt: "Our network in the program falls and the decoy has done its work."
chaosx.nr30.38.trade: "Return him in exchange for goodwill."
chaosx.nr30.38.trade_tt: "Relations with [GetTimeTravelerCustodianName] improve."
chaosx.nr30.38.publish: "Publish a false claim built on him."
chaosx.nr30.38.publish_tt: "The program draws more attention and we gain political power."
chaosx.nr30.38.believe: "Build policy on what he said."
chaosx.nr30.38.believe_tt: "The government acts on fabricated knowledge and pays for it in stability and war support."
chaosx.nr30.39.t: "The Sting"
chaosx.nr30.39.d_success: "The decoy meetings and false schedules reached their target. The agency now holds the names of two couriers and the record of a hotel room, and the foreign service has pulled back. The visitor could be used to draw it out further, at some risk."
chaosx.nr30.39.d_failure: "The decoy meetings were noticed and the false schedules were checked against the real ones. The service has not been caught, and the leak told it more about the visitor's route than it knew before."
chaosx.nr30.39.close: "End the operation."
chaosx.nr30.39.bait: "Use the visitor as bait."
chaosx.nr30.39.bait_tt: "Several foreign networks may be exposed. A failure risks injury, abduction or a public scandal."
chaosx.nr30.54.t: "The Bait"
chaosx.nr30.54.d_success: "The visitor appeared at a meeting that the foreign services had been told about. Four of them sent people, and the agency recorded every one. The networks behind them are compromised, and the visitor was back in his quarters before dawn."
chaosx.nr30.54.d_injury: "The visitor appeared at a meeting that the foreign services had been told about. A shot was fired from a doorway and he was hit in the arm. His doctors say that he will need two months before he can answer questions."
chaosx.nr30.54.d_abduction: "The meeting went wrong. A foreign service took the visitor out through a side street as the agency's men watched another door. The country no longer holds him."
chaosx.nr30.54.d_scandal: "The meeting drew a crowd and a photographer. The visitor was recognised in the street, the newspapers have his picture and the opposition asks how long the government kept a man from the future in its cellars."
chaosx.nr30.54.a: "The operation is closed."
chaosx.nr30.50.t: "Rumors of a Visitor"
chaosx.nr30.50.d: "[GetTimeTravelerCustodianName] is believed to hold a man who knows the future. Our services have heard enough to open a file and ask what part of it the government wants to pursue."
chaosx.nr30.50.a: "Open the file."
chaosx.nr30.50.a_tt: "The operations against the visitor's program become available."
chaosx.nr30.51.t: "The Visitor Is Gone"
chaosx.nr30.51.d_asylum: "The visitor accepted an offer of asylum from [GetTimeTravelerCustodianName] and left [ROOT.GetName] by train. The officials who worked with him have been asked to keep the records and say nothing."
chaosx.nr30.51.d_abduction: "The visitor was taken from [ROOT.GetName] in the night by [GetTimeTravelerCustodianName]. The guards found an empty room and a torn page."
chaosx.nr30.51.a: "Keep what has been learned."
chaosx.nr30.51.a_tt: "Direct access ends. The country keeps a reduced spirit."
chaosx.nr30.52.t: "The Visitor Is Dead"
chaosx.nr30.52.d: "The visitor was killed. His records survive, and every consultation that the government completed remains in the files. Who gave the order has not been settled."
chaosx.nr30.52.a: "The records are secured."
chaosx.nr30.52.a_tt: "Direct access ends for good. The copied knowledge and the changes already made to the timeline remain."
chaosx.nr30.53.t: "The Visitor Has Vanished"
chaosx.nr30.53.d: "The visitor left his quarters one evening and was not seen again. His room was in order and the guards report nothing unusual. The officials who worked with him say that he spoke of a day when he might be needed elsewhere."
chaosx.nr30.53.a: "The search continues."
chaosx.nr30.53.a_tt: "Direct access is suspended. The country keeps a reduced spirit."
chaosx.nr30.55.t: "The Visitor Departs"
chaosx.nr30.55.d: "The visitor and the government agreed that his work is done. He gave the cabinet a final memorandum, shook hands with the staff who had worked with him and left the country by an ordinary train. Nothing was taken from him and nothing was demanded."
chaosx.nr30.55.a: "The memorandum is filed."
chaosx.nr30.55.a_tt: "Direct access ends by agreement. The institution keeps what it has learned."
chaosx.nr30.40.t: "Rumors"
chaosx.nr30.41.t: "Scientists Ask for Access"
chaosx.nr30.41.d: "The scientists attached to the program say that the visitor's answers are too good to be left with two ministries. They ask that the laboratories be allowed to put questions to him directly and warn that some of them will take their work elsewhere if they are refused."
chaosx.nr30.41.d_known: "The scientists attached to the program say what the cafes already say, that the visitor's answers are too good to be left with two ministries. They ask that the laboratories be allowed to put questions to him directly."
chaosx.nr30.41.a: "Open the laboratories to him."
chaosx.nr30.41.a_tt: "A research bonus is gained and Exposure rises."
chaosx.nr30.41.b: "Refuse."
chaosx.nr30.41.b_tt: "Stability falls."
chaosx.nr30.42.t: "Officers Alter Their Plans"
chaosx.nr30.42.d: "Staff officers have started to rewrite their plans around the visitor's forecasts without being told to. Three corps commanders have asked the general staff whether an order given on that basis should be recorded as an order."
chaosx.nr30.42.d_known: "Staff officers rewrite their plans around the visitor's forecasts without being told to, and the talk in the officers' mess is that the plans come from a prophet. Three corps commanders have asked whether such an order should be recorded as an order."
chaosx.nr30.42.a: "Brief the officers."
chaosx.nr30.42.a_tt: "Army experience is gained and Exposure rises."
chaosx.nr30.42.b: "Forbid it."
chaosx.nr30.42.b_tt: "War support falls."
chaosx.nr30.43.t: "Journalists Notice the Guards"
chaosx.nr30.43.d: "A reporter has asked why an ordinary house in [?time_traveler_arrival_state.GetName] has a guard on every corner and a steady stream of ministers through its front door. His paper has not printed the story, and its editor is willing to be told what to print instead."
chaosx.nr30.43.d_known: "A paper has printed a paragraph about a house in [?time_traveler_arrival_state.GetName] that is guarded like a ministry and visited like one. The editor is ready to print more."
chaosx.nr30.43.a: "Provide a cover story."
chaosx.nr30.43.a_tt: "Exposure falls and political power is spent."
chaosx.nr30.43.b: "Say nothing."
chaosx.nr30.43.b_tt: "Exposure rises."
chaosx.nr30.44.t: "Diplomats Ask Questions"
chaosx.nr30.44.d: "Two foreign ambassadors have asked the foreign ministry, politely, whether the government's recent decisions rest on information that nobody could have had. Both used the same words."
chaosx.nr30.44.d_known: "Several foreign ambassadors have asked the foreign ministry whether the government's decisions rest on information that nobody could have had, and one of them named the visitor."
chaosx.nr30.44.a: "Give assurances."
chaosx.nr30.44.a_tt: "Political power is spent and Exposure rises."
chaosx.nr30.44.b: "Evade the question."
chaosx.nr30.44.b_tt: "Credibility falls."
chaosx.nr30.45.t: "Industrialists Compete for Contracts"
chaosx.nr30.45.d: "Several industrialists have begun to bid for contracts that have not yet been announced. They say that a man in the ministry gave them the figures, and each of them names a different man."
chaosx.nr30.45.d_known: "Industrialists bid for contracts that have not been announced and say that the figures came from the visitor himself."
chaosx.nr30.45.a: "Allocate the contracts."
chaosx.nr30.45.a_tt: "Factory efficiency stays higher for a long time and Exposure rises."
chaosx.nr30.45.b: "Refuse them."
chaosx.nr30.45.b_tt: "Stability falls."
chaosx.nr30.46.t: "The Opposition Asks"
chaosx.nr30.46.d: "The leader of the opposition has said in the assembly that the government keeps a prophet or a fraud in a house in the capital and spends public money on him. The speech was long and carefully worded and did not name the house."
chaosx.nr30.46.d_known: "The leader of the opposition has named the house, the visitor and the ministers who see him, and asks whether the government keeps a prophet or a fraud."
chaosx.nr30.46.a: "Open the files to the assembly."
chaosx.nr30.46.a_tt: "Stability improves and Exposure rises sharply."
chaosx.nr30.46.b: "Dismiss the charge."
chaosx.nr30.46.b_tt: "Stability falls."
time_traveler_open_laboratories: "Open Laboratories"
time_traveler_scientific_shortcut: "The Visitor's Shortcut"
time_traveler_stolen_archive: "Stolen Archive"
chaosx.news.300.t: "A Man From the Future?"
chaosx.news.300.d: "[From.GetName] has confirmed that it holds a man who claims to come from a later time and whose forecasts have proved correct. The visitor gives his name as Jonas Calder. The government of [From.GetName] says it is studying his statements, and foreign ministries are asking what it intends to do with them."
chaosx.news.300.a: "The evidence will be examined."
chaosx.news.301.t: "The Berlin-Moscow Axis"
chaosx.news.301.d: "A forecast of a German defeat in the Soviet Union has driven Berlin to open talks with Moscow. [From.GetName] has announced the Berlin-Moscow Axis, tying the two powers together before the war that the forecast predicted could begin."
chaosx.news.301.a: "The alliance is unexpected."
chaosx.news.302.t: "American Intelligence on Japan"
chaosx.news.302.d: "The United States has received an account of Japan's operations from a man who says he knows how the Pacific war ends. American commanders are changing the defenses of the Pacific before any of those operations begin."
chaosx.news.302.a: "Japan is exposed."
time_traveler.event_details.description: "A man who remembers a later time appears in one country and proves it with a page of secrets and a forecast that comes true. The government chooses how he works with the state, and each piece of advice he gives must be carried out before its reward is paid. Foreign services copy his records, plant forgeries, offer him asylum and try to take him. The more the world acts on what he says, the less his memory of the future still describes it. Officials who depend on him begin to fight over him and the country that holds him may split, and as the order of the world loosens people from earlier centuries start to arrive."
chaosx.events_log.events.na_reason.time_traveler_host: "\n§RUnavailable: no major country or player country can host the visitor, or the visitor has already appeared.§!"
chaos_meter.history.reason.special.time_traveler_revelation: "The visitor is revealed"
chaos_meter.history.reason.special.time_traveler_theft: "The visitor's archive is stolen"
chaos_redux_030_the_future_refused_NAME: "The Future Refused"
chaos_redux_030_the_future_refused_DESC: "Complete three consultations with a trusted visitor and let him leave by agreement before the timeline stops matching his memory."
chaos_redux_030_the_future_refused_tooltip: "End direct access by agreement after three completed consultations at Trusted Credibility or higher, when Timeline Divergence is still in the Recognizable band."
chaos_redux_030_no_one_owns_tomorrow_NAME: "No One Owns Tomorrow"
chaos_redux_030_no_one_owns_tomorrow_DESC: "Keep the visitor secret for two years."
chaos_redux_030_no_one_owns_tomorrow_tooltip: "Keep the visitor alive and in your own custody for two years, with Exposure never reaching the Public band and no foreign country holding a Future Fragment."
time_traveler.evolution.type: "Temporal Disturbance"
time_traveler.evolution.1.title: "The Traveler's Ambition"
time_traveler.evolution.1.body: "What the visitor knows about the careers and failures of the people around him becomes a political force. The government decides whether he stays an adviser, receives emergency authority, takes office, is arrested, leaves or disappears, and the ministries, the officers and the experts choose their sides."
time_traveler.evolution.1.summary: "The visitor's knowledge becomes a claim on the government."
time_traveler.evolution.2.summary: "Figures from earlier centuries reach the modern world."
time_traveler.evolution.2.title: "The Door to the Past"
time_traveler.evolution.2.body: "People from earlier centuries begin to appear in the modern world. Each one has a name that millions still know, a claim on the loyalty of some and the fear of others, and no knowledge of the century they have arrived in. Governments must decide what to make of them before others do."
time_traveler_prevention_threat: "Preventive Measures"
chaosx.nr30.100.t: "The Traveler's Ambition"
chaosx.nr30.101.t: "The Visitor Asks for a Status"
chaosx.nr30.101.d_cabinet: "The visitor has written to every minister. His memorandum lists the offices that will fall, the appointments that will fail and the order in which a government like this one stops working, and it ends with a request for a formal status and the authority to make his proposals binding. Ministers who have read it ask each other which of them are named."
chaosx.nr30.101.d_secret: "The services that guard the program have started to take their orders from the visitor's calendar. The head of the security service has told the cabinet that the visitor asks for formal authority over the security of the state, and that the officers will follow whichever way the cabinet decides."
chaosx.nr30.101.d_confinement: "A petition has reached the cabinet over the signatures of the few officials who are allowed to see the visitor. It asks that he be released from confinement and given a formal status, and it names three ministers who have read the visitor's account of their own deaths."
chaosx.nr30.101.d_public: "The visitor was invited to speak in a public hall and filled it. He did not ask for office, and the crowd asked on his behalf. Several parties have sent men to learn what he wants, and the cabinet must say what he is."
chaosx.nr30.101.charter: "Draw up a written charter."
chaosx.nr30.101.charter_tt: "The visitor stays an adviser under written terms. The ministries gain and the security services lose ground."
chaosx.nr30.101.emergency: "Give him emergency authority over one crisis."
chaosx.nr30.101.emergency_tt: "He receives strong temporary authority for six months. It ends with a report on whether it worked."
chaosx.nr30.101.appoint: "Appoint him head of government."
chaosx.nr30.101.appoint_tt: "The cabinet votes on the appointment. It passes only if the ministries and one more group back him."
chaosx.nr30.101.contest: "Make him contest the office openly."
chaosx.nr30.101.contest_tt: "He must win public support. The result follows the ministries and the experts."
chaosx.nr30.101.arrest: "Arrest him and investigate his contacts."
chaosx.nr30.101.arrest_tt: "A clean arrest needs the security services to stay away. Otherwise a rescue attempt follows."
chaosx.nr30.101.exile: "Send him into exile."
chaosx.nr30.101.exile_tt: "He leaves the country and might return."
chaosx.nr30.101.transfer: "Transfer him to an ally."
chaosx.nr30.101.transfer_tt: "An allied government takes him under a monitored agreement."
chaosx.nr30.101.remove: "Make him disappear."
chaosx.nr30.101.remove_tt: "A covert removal. A failure is a public scandal and the officers who backed him answer it."
chaosx.nr30.102.t: "The Crisis Is Settled"
chaosx.nr30.102.d_charter: "The cabinet and the visitor signed a charter. It limits him to written advice, requires every consultation to be recorded and forbids him to give orders. The military and scientific supporters call it a waste of unique knowledge, and the ministers who feared him have stopped talking about it."
chaosx.nr30.102.d_emergency: "The six months of emergency authority ended with the crisis he was given under control. The staff has kept his methods and the cabinet has written them into the standing rules of the ministries."
chaosx.nr30.102.d_appointed: "The cabinet appointed the visitor head of government after a vote that the ministries and the officers both backed. He took office the same week and kept the existing ministers in their posts."
chaosx.nr30.102.d_contest: "The visitor won the contest for office in a vote that his critics called honest and his friends called overdue. He formed a government from the ministries and the experts who had backed him."
chaosx.nr30.102.d_arrested: "The visitor was arrested without resistance. His supporters in the ministries and the services were dismissed or reassigned, and he is held under guard while the investigation continues."
chaosx.nr30.102.d_exiled: "The visitor left the country by an ordinary train under escort. His papers stayed behind in the archive, and nobody says where he went."
chaosx.nr30.102.d_transferred: "The visitor was handed to an allied government under a monitored agreement. The officials who worked with him kept their notes."
chaosx.nr30.102.d_conceded: "The cabinet gave way and the visitor took office. He asked that the ministers stay and thanked by name the ones who had opposed him."
chaosx.nr30.102.d_amnesty: "The cabinet declared an amnesty for the officials who had followed him and kept the visitor at his post as an adviser under stricter terms. The movement dissolved within a month."
chaosx.nr30.102.a: "The matter is closed."
chaosx.nr30.106.t: "The Mandate Ends"
chaosx.nr30.106.d_success: "The six months have ended. The crisis he was given is under control, the staff has kept his methods and the cabinet has made them permanent."
chaosx.nr30.106.d_failure: "The six months have ended without result. The officers who opposed the authority say the cabinet wasted half a year, and several of them have begun to talk to one another."
chaosx.nr30.106.a: "The mandate is closed."
chaosx.nr30.106.a_tt: "A success makes his methods a permanent institution. A failure costs Credibility and strengthens the officers who opposed him."
chaosx.nr30.110.t: "An Attempt to Remove Him"
chaosx.nr30.110.d_refused: "The cabinet refused to appoint him and his supporters did not accept the refusal. They have told the ministers that he will be removed from every role by the end of the month unless the cabinet gives way."
chaosx.nr30.110.d_failed: "The authority he was given ended badly, and the officers who backed it demand that the cabinet either give him office or arrest him."
chaosx.nr30.110.concede: "Give way and appoint him."
chaosx.nr30.110.concede_tt: "The visitor becomes head of government."
chaosx.nr30.110.arrest: "Arrest him now."
chaosx.nr30.110.charter: "Offer a written charter instead."
chaosx.nr30.111.t: "The Officers Act"
chaosx.nr30.111.d_civil_war: "Units loyal to the visitor seized the garrisons of [?time_traveler_arrival_state.GetName] and several other cities in one night. The cabinet has fled and the country is split between two governments, each with its own army."
chaosx.nr30.111.d_won: "Officers loyal to the visitor took the ministries, the radio station and the cabinet in a single night with little firing. He was released and took charge before dawn."
chaosx.nr30.111.d_failed: "Officers loyal to the visitor moved against the ministries and failed. Loyal units retook the garrisons within hours, the leaders of the attempt were arrested and the visitor is held under guard."
chaosx.nr30.111.a: "The night is over."
chaosx.nr30.121.t: "After the Defeat"
chaosx.nr30.121.d: "The visitor's bid for power has failed. His supporters in the ministries are quiet, and the cabinet must decide what is to become of him."
chaosx.nr30.121.imprison: "Hold him under guard."
chaosx.nr30.121.imprison_tt: "The network around him is dismantled and the investigation may name a foreign sponsor."
chaosx.nr30.121.advisory: "Keep him as an adviser under written terms."
chaosx.nr30.121.exile: "Send him away."
chaosx.nr30.121.amnesty: "Declare an amnesty and keep him at his post."
chaosx.nr30.121.amnesty_tt: "The movement is reintegrated and tension eases. He stays as an adviser under stricter terms."
chaosx.nr30.121.remove: "Remove him."
chaosx.nr30.130.t: "Changing the Remembered War"
chaosx.nr30.130.d: "The visitor's account of the war that the country lost in his history is specific about its first year. The staff can build an early deterrent along the borders or call up the reserves ahead of the crisis he describes. Neighbouring governments will notice either."
chaosx.nr30.130.cancel: "Not now."
chaosx.nr30.130.deterrent: "Build the deterrent."
chaosx.nr30.130.deterrent_tt: "The army defends better and digs in faster for six months. World tension rises and the timeline moves."
chaosx.nr30.130.mobilize: "Mobilize early."
chaosx.nr30.130.mobilize_tt: "War support rises, training is faster and more recruits arrive for six months. World tension rises and the timeline moves."
chaosx.nr30.150.t: "A Man Is Seen Again"
chaosx.nr30.151.t: "The Visitor Returns"
chaosx.nr30.151.d_portal: "The visitor reappeared in [?time_traveler_arrival_state.GetName] and says that he escaped through a gap in time that has not closed. His notebook has pages that were not there when he left."
chaosx.nr30.151.d_service: "The visitor came back to [ROOT.GetName] with a foreign passport and an account of eight months in the custody of a service that never gave its name. It has now let him go."
chaosx.nr30.151.d_staged: "The visitor walked into the ministry as if nothing had happened and said that he had arranged his own disappearance to see which of the officials who had spoken for him would speak against him. He has a list."
chaosx.nr30.151.a: "Receive him."
time_traveler_government_category: "The Traveler's Government"
time_traveler_government_category_desc: "The country is led by a man who remembers a later time. He coordinates better than any minister before him and he trusts officials less. The measures below are the ones his memory recommends."
time_traveler_watch: "Watch the predicted threat"
time_traveler_watch_desc: "Place a person, a faction or a region under surveillance before the plot that the leader remembers can form. The agency's attention is limited and the surveillance can become public."
time_traveler_watch_requirements_tt: "Surveillance has not been run in the last four months."
time_traveler_watch_tt: "Intelligence and command power improve for six months. The surveillance may become public."
time_traveler_restrict: "Restrict future offenders"
time_traveler_restrict_desc: "Remove an official, a commander or an agitator before the offense the leader remembers. The strategic risk falls and stability pays for it. A program that becomes public joins the shared record of condemnation. The detainees are held in ordinary custody."
time_traveler_restrict_requirements_tt: "No restriction in the last six months."
time_traveler_restrict_tt: "Resistance eases and stability suffers. The program may become public."
time_traveler_change_war: "Change the remembered war"
time_traveler_change_war_desc: "Prepare against the war that the leader remembers: an early deterrent along the borders or a mobilization of the reserves. Neighbours will notice either."
time_traveler_change_war_requirements_tt: "No preparation of this kind in the last five months."
time_traveler_change_war_tt: "Opens the choice between a deterrent and a mobilization."
time_traveler_build_institution: "Build the successful institution"
time_traveler_build_institution_desc: "Import one institution that held in the leader's history into planning, logistics, industry and science. It takes staff and material and it stays."
time_traveler_build_requirements_tt: "The leader must be trusted by the staff."
time_traveler_build_tt: "A permanent state institution is established and the timeline moves."
time_traveler_suppress_institution: "Suppress the failed institution"
time_traveler_suppress_institution_desc: "Reform an institution that later failed or was captured. The country becomes more resilient and the officials who depend on the institution resist."
time_traveler_suppress_requirements_tt: "No reform in the last five months."
time_traveler_suppress_tt: "Factory efficiency stays higher for six months. Stability falls and the security services lose ground."
time_traveler_bound_charter: "Bound Charter"
time_traveler_bound_charter_desc: "A written charter limits the visitor to advice, requires every consultation to be recorded and forbids him to give orders."
time_traveler_traveler_government: "Traveler Government"
time_traveler_traveler_government_desc: "The country is led by a man who remembers a later time. Planning and intelligence are stronger, and the public feels the distance from a government that acts on futures it has not seen."
time_traveler_state_institution: "Institution From a Later Time"
time_traveler_state_institution_desc: "A model remembered from another history has become part of the state's planning and its laboratories."
time_traveler_emergency_authority: "Emergency Authority"
time_traveler_emergency_authority_desc: "The visitor holds temporary authority over one crisis with a public deadline. Planning is fast and the cabinet is uneasy."
time_traveler_watch_posture: "Surveillance Posture"
time_traveler_watch_posture_desc: "The agency watches a predicted threat and has less room for anything else."
time_traveler_preventive_order: "Preventive Order"
time_traveler_preventive_order_desc: "People who were expected to offend have been removed from public life. The country is quieter and its war effort is less willing."
time_traveler_deterrent_posture: "Early Deterrent"
time_traveler_deterrent_posture_desc: "The borders carry the defences that the leader remembers wishing for."
time_traveler_mobilization_posture: "Early Mobilization"
time_traveler_mobilization_posture_desc: "The reserves were called up a year before the crisis the leader remembers."
time_traveler_trait_leader: "Remembered Statecraft"
time_traveler_trait_leader_desc: "He knows how this country's institutions failed in another history and what each of them needed. He coordinates, plans and gathers intelligence better than anyone before him, and he is less trusted by the people he governs."
time_traveler_ideology_conservatism: "conservatism"
time_traveler_ideology_liberalism: "liberalism"
time_traveler_ideology_socialism: "socialism"
time_traveler_ideology_populism: "populism"
time_traveler_ideology_marxism: "marxism"
time_traveler_ideology_leninism: "leninism"
time_traveler_ideology_stalinism: "stalinism"
time_traveler_ideology_anti_revisionism: "anti_revisionism"
time_traveler_ideology_anarchist_communism: "anarchist_communism"
time_traveler_ideology_nazism: "nazism"
time_traveler_ideology_fascism_ideology: "fascism_ideology"
time_traveler_ideology_falangism: "falangism"
time_traveler_ideology_rexism: "rexism"
time_traveler_ideology_despotism: "despotism"
time_traveler_ideology_oligarchism: "oligarchism"
time_traveler_ideology_anarchism: "anarchism"
time_traveler_ideology_moderatism: "moderatism"
time_traveler_ideology_centrism: "centrism"
chaos_redux_030_i_have_seen_this_office_before_NAME: "I Have Seen This Office Before"
chaos_redux_030_i_have_seen_this_office_before_DESC: "Put the visitor in charge of the country without a coup or a civil war."
chaos_redux_030_i_have_seen_this_office_before_tooltip: "Make the original traveler head of your government through an appointment, an open contest or a cabinet that gives way, and never let a coup or a civil war bring him to power anywhere in the campaign."
chaosx.nr30.200.t: "The Door to the Past"
chaosx.nr30.211.t: "A Man at the Invalides"
chaosx.nr30.212.t: "The Prefect and the Veterans"
chaosx.nr30.213.t: "The Army Waits for Him"
chaosx.nr30.214.t: "Napoleon Bonaparte"
chaosx.nr30.211.d: "A short man in a grey greatcoat was found at dawn outside the Invalides, asking in fluent but old-fashioned French for the Emperor's tomb and for a map of the roads to the east. He speaks of campaigns that no living officer fought and gives their dates and the names of the marshals without hesitation. The guards took him for a madman until an archivist from the military museum recognised the handwriting in his notebook."
chaosx.nr30.211.test1: "Question him in the French of his own century."
chaosx.nr30.211.test1_tt: "Scholars of the language put questions to him. The learned and the cautious come to believe him."
chaosx.nr30.211.test2: "Compare his handwriting with the archive of the Empire."
chaosx.nr30.211.test2_tt: "The archive confirms his hand. The civil service and the lawyers come to believe him."
chaosx.nr30.211.test3: "Show him to the army's historians and old regimental officers."
chaosx.nr30.211.test3_tt: "The officers who know the campaigns test him. The army comes to believe him and the story spreads."
chaosx.nr30.212.d: "He accepts that he is in a country that did not exist in his time and asks where the army is. The ministry of war wants him examined, the prefect of police wants him watched, and a deputation of regimental veterans stands at the door and demands that he be received."
chaosx.nr30.212.custody1: "Give him an apartment and a guard."
chaosx.nr30.212.custody1_tt: "He is protected and his supporters grow quietly."
chaosx.nr30.212.custody2: "Present him to the nation."
chaosx.nr30.212.custody2_tt: "Crowds gather and his support grows quickly. The government's stability suffers and the traveler's secret is harder to keep."
chaosx.nr30.212.custody3: "Hold him until the ministries agree."
chaosx.nr30.212.custody3_tt: "His supporters resent the detention and his support shrinks."
chaosx.nr30.212.custody4: "Ask him to study the army's plans."
chaosx.nr30.212.custody4_tt: "The officers who work with him come to follow him."
chaosx.nr30.213.d_low: "He has few supporters. A handful of retired officers and a newspaper editor visit him, and he spends his days over maps and the army's manuals, asking about railways and radios with growing impatience."
chaosx.nr30.213.d_mid: "Officers, lawyers and veterans gather around him. They talk of a firm hand, a single code of laws and a general staff that decides in a day what the assembly debates for a year. Several newspapers have printed his portrait."
chaosx.nr30.213.d_high: "Half the officer corps and a large part of the civil service have declared for him. Crowds gather wherever he appears, and the cabinet's own ministers no longer speak against him in public."
chaosx.nr30.213.adviser: "Make him a field marshal under civilian authority."
chaosx.nr30.213.adviser_tt: "He commands as a marshal with the weak logistics of his own century. The government keeps its authority."
chaosx.nr30.213.symbol: "Keep him as a national symbol."
chaosx.nr30.213.symbol_tt: "He has no office and a great name. A national spirit supports war support and planning."
chaosx.nr30.213.office: "Offer him the head of government."
chaosx.nr30.213.office_tt: "He governs in the ruling ideology. The timeline moves and the world takes note."
chaosx.nr30.213.suppress: "Arrest him and break the movement."
chaosx.nr30.213.suppress_tt: "His supporters lose heart. A strong movement may answer with arms, and he may die in custody."
chaosx.nr30.213.exile: "Send him abroad."
chaosx.nr30.213.exile_tt: "His movement outlives him and stays dangerous for a year."
chaosx.nr30.213.claim: "Refuse him any office."
chaosx.nr30.213.claim_tt: "He will not accept refusal. A movement with enough support takes up arms."
chaosx.nr30.214.d_integrated: "Napoleon Bonaparte holds the rank of marshal in the army of [ROOT.GetName]. He drafts orders for a century that is not his, and the staff officers say that he learns the radio faster than the colonels learn his tactics."
chaosx.nr30.214.d_symbol: "Napoleon has become a national symbol. His portrait hangs in the barracks, schoolchildren recite his campaigns and he appears at parades. He holds no office and says that he needs none."
chaosx.nr30.214.d_office: "Napoleon Bonaparte has taken office in [ROOT.GetName]. He governs through the existing ministries, rewrites the legal code over one winter and appoints officers by examination. His enemies call him an emperor without a crown."
chaosx.nr30.214.d_imprisoned: "Napoleon was arrested and is held in a fortress. The newspapers print his letters, the veterans stand outside the walls, and the government has found that a prisoner can be more dangerous than a claimant."
chaosx.nr30.214.d_exiled: "Napoleon was put on a ship and sent abroad. His supporters meet in cafes and keep his coat, and the government of [ROOT.GetName] has learned that distance does not end a movement."
chaosx.nr30.214.d_revolt: "Napoleon's supporters in the army took a garrison and raised his standard. He appeared at the gate on a grey horse, and the government now fights a revolt led by a man who the history books say never left his island."
chaosx.nr30.214.d_civil_war: "Napoleon has raised half the army against the government of [ROOT.GetName]. The country has two capitals and two governments, and each of them says it is the true France."
chaosx.nr30.214.d_died: "Napoleon died in custody. The doctors found no injury and the veterans do not believe them. His portrait is carried at every demonstration, and the movement has no one left to restrain it."
chaosx.nr30.214.a: "The matter is entered in the record."
chaosx.nr30.221.t: "A Soldier at the Cathedral Door"
chaosx.nr30.222.t: "Between the Convent and the Crowd"
chaosx.nr30.223.t: "The Voices Are Heard"
chaosx.nr30.224.t: "Joan of Arc"
chaosx.nr30.221.d: "A young woman in a soldier's tunic stood before the cathedral door in the capital and asked, in the French of the fifteenth century, for the way to the king's army. A priest who edits medieval manuscripts understood her. She speaks of voices that told her to come, of a country defeated and of a siege that the history she remembers says was lifted. The crowd that gathered did not need her to say more."
chaosx.nr30.221.test1: "Have scholars of medieval French question her."
chaosx.nr30.221.test1_tt: "Scholars test her language and her memory. The learned come to believe her."
chaosx.nr30.221.test2: "Compare her answers with the records of her trial."
chaosx.nr30.221.test2_tt: "The archives confirm what she says about herself. The clergy and the lawyers come to believe her."
chaosx.nr30.221.test3: "Let the soldiers and the clergy hear her."
chaosx.nr30.221.test3_tt: "Soldiers and priests hear her speak. The army and the parishes come to believe her and the story spreads."
chaosx.nr30.222.d: "She asks for nothing for herself and wants to know where the fighting is. The church wants her in a convent, the ministry of war wants her seen by the troops, and the police want to know who among the crowd outside is armed."
chaosx.nr30.222.custody1: "Shelter her in a convent under guard."
chaosx.nr30.222.custody1_tt: "She is protected and her supporters grow quietly."
chaosx.nr30.222.custody2: "Show her to the people."
chaosx.nr30.222.custody2_tt: "Crowds gather and her support grows quickly. The government's stability suffers and the traveler's secret is harder to keep."
chaosx.nr30.222.custody3: "Hold her until the church and the ministries agree."
chaosx.nr30.222.custody3_tt: "Her supporters resent the detention and her support shrinks."
chaosx.nr30.222.custody4: "Ask her to speak to the army."
chaosx.nr30.222.custody4_tt: "The soldiers who hear her come to follow her."
chaosx.nr30.223.d_low: "She prays in the convent chapel and the crowds outside are small. A few women from the neighborhood bring her food and ask what she wants."
chaosx.nr30.223.d_mid: "Soldiers, parish priests and refugees from the occupied provinces gather to hear her. She speaks of liberation and not of crowns, and the newspapers do not know what to call her."
chaosx.nr30.223.d_high: "Whole villages walk to see her. Deserters ask to rejoin their regiments in her name, and the prefects report that the occupied provinces repeat her sentences."
chaosx.nr30.223.adviser: "Give her a command in the army."
chaosx.nr30.223.adviser_tt: "She commands as a corps commander and inspires her troops. The government keeps its authority."
chaosx.nr30.223.symbol: "Protect her as a national symbol."
chaosx.nr30.223.symbol_tt: "She holds no office and the nation rallies to her. A national spirit supports stability and war support."
chaosx.nr30.223.office: "Put her at the head of the national resistance."
chaosx.nr30.223.office_tt: "She leads the resistance in the ruling ideology. The timeline moves and the world takes note."
chaosx.nr30.223.suppress: "Arrest her and try her."
chaosx.nr30.223.suppress_tt: "Her supporters lose heart. A strong movement may answer with arms, and she may die in custody."
chaosx.nr30.223.exile: "Send her abroad."
chaosx.nr30.223.exile_tt: "Her movement outlives her and stays dangerous for a year."
chaosx.nr30.223.claim: "Refuse her any role."
chaosx.nr30.223.claim_tt: "She will not obey a refusal. A movement with enough support takes up arms, and hers needs more than a ruler's."
chaosx.nr30.224.d_integrated: "Joan holds a command in the army of [ROOT.GetName]. Her soldiers sleep in the same fields as she does, and the staff officers admit that her orders are short and that her units do not break."
chaosx.nr30.224.d_symbol: "Joan has become a national symbol. Her banner is carried at the head of parades and the villages light candles on the day she arrived. She holds no office and asks for none."
chaosx.nr30.224.d_office: "Joan leads the national resistance of [ROOT.GetName]. She sits at the head of the council in a soldier's tunic, listens to everyone and answers only the question that was asked. The ministers who feared her have learned to bring her their problems."
chaosx.nr30.224.d_imprisoned: "Joan was arrested and is held in a convent prison. The priests who guard her pray with her, the villages walk to the walls and the government has begun to ask what a trial would prove."
chaosx.nr30.224.d_exiled: "Joan was sent abroad on a ship at night. The villages say she will come back with the spring, and the government of [ROOT.GetName] has not been able to stop them saying it."
chaosx.nr30.224.d_revolt: "Joan's supporters took a garrison and raised her banner over it. She appeared at the gate in armor, and the government now fights a revolt led by a woman who will not say that she wants anything for herself."
chaosx.nr30.224.d_civil_war: "Joan has called the army and the provinces to her. [ROOT.GetName] is split between two governments and one of them is led by a woman in armor."
chaosx.nr30.224.d_died: "Joan died in custody. The guards say that she was praying and the villages do not believe them. Her banner is now carried at every demonstration, and the movement has no one left to restrain it."
chaosx.nr30.224.a: "The matter is entered in the record."
chaosx.nr30.231.t: "A Man With a Flute Case"
chaosx.nr30.232.t: "The Palace and the Ministries"
chaosx.nr30.233.t: "The Staff Remembers a King"
chaosx.nr30.234.t: "Frederick the Great"
chaosx.nr30.231.d: "A man in a worn blue coat with a cane and a flute case was brought to the war ministry from a railway station where he had demanded to be taken to the king. He speaks the German of another century, asks after the state of the treasury before the state of the army and corrects the ministry's map of Silesia from memory. He says that he has come to learn whether the state he built still stands."
chaosx.nr30.231.test1: "Question him in the German of his own century."
chaosx.nr30.231.test1_tt: "Scholars of the language put questions to him. The learned and the cautious come to believe him."
chaosx.nr30.231.test2: "Compare his hand with the archive of the Prussian court."
chaosx.nr30.231.test2_tt: "The archive confirms his hand. The civil service and the lawyers come to believe him."
chaosx.nr30.231.test3: "Have the general staff question him on the army."
chaosx.nr30.231.test3_tt: "The general staff tests him on the campaigns. The army comes to believe him and the story spreads."
chaosx.nr30.232.d: "He accepts the ministry's rooms and asks for the accounts of the state. The cabinet wants him housed in a palace, the party wants him kept away from the officers, and the officers want to dine with him."
chaosx.nr30.232.custody1: "Quarter him in a palace under guard."
chaosx.nr30.232.custody1_tt: "He is protected and his supporters grow quietly."
chaosx.nr30.232.custody2: "Present him to the nation."
chaosx.nr30.232.custody2_tt: "Crowds gather and his support grows quickly. The government's stability suffers and the traveler's secret is harder to keep."
chaosx.nr30.232.custody3: "Hold him until the ministries agree."
chaosx.nr30.232.custody3_tt: "His supporters resent the detention and his support shrinks."
chaosx.nr30.232.custody4: "Ask him to review the army."
chaosx.nr30.232.custody4_tt: "The officers who work with him come to follow him."
chaosx.nr30.233.d_low: "He plays the flute in the evenings and reads the army's regulations in the day, and the few officers who visit him leave quieter than they came."
chaosx.nr30.233.d_mid: "Staff officers, civil servants and a circle of monarchists gather around him. They talk of discipline, of a treasury that balances and of a state that serves instead of shouting."
chaosx.nr30.233.d_high: "Most of the general staff and a large part of the administration say that they would follow him. The party newspapers have fallen silent, which the cabinet reads as fear."
chaosx.nr30.233.adviser: "Make him a field marshal under the government."
chaosx.nr30.233.adviser_tt: "He commands as a marshal with the weak logistics of his own century. The government keeps its authority."
chaosx.nr30.233.symbol: "Keep him as a symbol of the old state."
chaosx.nr30.233.symbol_tt: "He holds no office and the officers revere him. A national spirit supports planning and entrenchment."
chaosx.nr30.233.office: "Restore him as head of state."
chaosx.nr30.233.office_tt: "He governs in the ruling ideology. The timeline moves and the world takes note."
chaosx.nr30.233.suppress: "Arrest him."
chaosx.nr30.233.suppress_tt: "His supporters lose heart. A strong movement may answer with arms, and he may die in custody."
chaosx.nr30.233.exile: "Send him abroad."
chaosx.nr30.233.exile_tt: "His movement outlives him and stays dangerous for a year."
chaosx.nr30.233.claim: "Refuse him any role."
chaosx.nr30.233.claim_tt: "He will not accept refusal. A movement with enough support takes up arms."
chaosx.nr30.234.d_integrated: "Frederick holds the rank of marshal in the army of [ROOT.GetName]. He has reorganised the staff's reports, cut three departments and asks every colonel the same question about the cost of a march."
chaosx.nr30.234.d_symbol: "Frederick has become a symbol of the old state. His portrait hangs in the officers' messes, the museum has opened his rooms and he appears at reviews. He holds no office and says that a king needs none to be obeyed."
chaosx.nr30.234.d_office: "Frederick governs [ROOT.GetName]. He rises at four, reads every report and writes his answers in the margins. The administration works harder than it has in a generation, and the people have learned to fear the margins."
chaosx.nr30.234.d_imprisoned: "Frederick was arrested and is held in a fortress. He asked for books and a flute and has been writing a memorandum on the cost of the war that the government is afraid to publish."
chaosx.nr30.234.d_exiled: "Frederick was sent abroad by train. The officers who dined with him keep his letters, and the government of [ROOT.GetName] has learned that distance does not end a following."
chaosx.nr30.234.d_revolt: "Frederick's supporters in the staff took a garrison and raised the old colours over it. He appeared in a blue coat with a cane, and the government now fights a revolt led by a man who the textbooks say died in his chair."
chaosx.nr30.234.d_civil_war: "Frederick has called the officers and the provinces to him. [ROOT.GetName] is split between two governments and one of them is run from the margins of a king's reports."
chaosx.nr30.234.d_died: "Frederick died in custody. The doctors say that his heart failed, and the officers say that he was never ill a day. His portrait is carried at every demonstration, and the movement has no one left to restrain it."
chaosx.nr30.234.a: "The matter is entered in the record."
time_traveler_figure_key_napoleon: "napoleon"
time_traveler_figure_key_joan: "joan"
time_traveler_figure_key_frederick: "frederick"
time_traveler_napoleon_name: "Napoleon Bonaparte"
time_traveler_trait_napoleon: "Napoleon Bonaparte"
time_traveler_joan_name: "Joan of Arc"
time_traveler_trait_joan: "Joan of Arc"
time_traveler_frederick_name: "Frederick the Great"
time_traveler_trait_frederick: "Frederick the Great"
time_traveler_trait_napoleon_desc: "A general who concentrated force and a ruler who centralised the state, who has never seen a radio, a truck or an air raid. His administration is fast and his instinct for the decisive point is sound."
time_traveler_trait_joan_desc: "A soldier and a symbol who commands loyalty without office, who has never seen modern artillery or a modern press. Her authority rests on belief and her armies hold."
time_traveler_trait_frederick_desc: "A king who made a poor state a power by discipline, accounts and daring, who has never seen mass politics or a motorised column. Everything he runs is orderly and slow to adapt."
time_traveler_symbol_napoleon: "The Emperor Returned"
time_traveler_symbol_napoleon_desc: "A national symbol who holds no office. His name steadies planners and fills the barracks."
time_traveler_symbol_joan: "The Maid Returned"
time_traveler_symbol_joan_desc: "A national symbol who holds no office. Villages and regiments rally to her name."
time_traveler_symbol_frederick: "The King Returned"
time_traveler_symbol_frederick_desc: "A symbol of the old state who holds no office. The officers revere him and plan as he would."
time_traveler_restoration_napoleon: "Bonapartist Government"
time_traveler_restoration_napoleon_desc: "The country is governed by a man who ruled once before. The administration is centralised and the army is promoted by examination."
time_traveler_restoration_joan: "National Resistance"
time_traveler_restoration_joan_desc: "The country is led by a woman whom soldiers and villagers follow without orders. Morale holds and the government listens."
time_traveler_restoration_frederick: "Restored Crown"
time_traveler_restoration_frederick_desc: "The country is governed by a king who reads every report. The administration is disciplined and the army is drilled."
time_traveler_claimant_movement: "Claimant Movement"
time_traveler_claimant_movement_desc: "The supporters of a returned figure remain and organise. They are loud, they are armed in the hearts of some, and they will not disperse."
chaos_redux_030_nine_lives_of_history_NAME: "Nine Lives of History"
chaos_redux_030_nine_lives_of_history_DESC: "See three returned figures through their crises without a death or a civil war."
chaos_redux_030_nine_lives_of_history_tooltip: "Take part as a host or a custodian while three returned historical figures are resolved without any of them dying and without any of them starting a full civil war."
