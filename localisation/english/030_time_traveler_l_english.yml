l_english:
time_traveler_visitor_name: "Jonas Calder"
time_traveler_visitor_advisor: "Jonas Calder"
time_traveler_visitor_advisor_desc: "A man who remembers the history of this country as it was written in a later time. His advice is worth only as much as the government's willingness to act on it."
time_traveler_trait_analyst: "Strategic Analyst"
time_traveler_trait_analyst_desc: "He remembers how staffs failed, which fronts gave way and which warnings were ignored. Advice on the army, on diplomacy and on foreign services comes easily to him. Advice on science depends on institutions that already exist."
time_traveler_trait_engineer: "Systems Engineer"
time_traveler_trait_engineer_desc: "He remembers how factories, railways and laboratories were organised and where they failed. Advice on industry and science comes easily to him. His forecasts about politics are less exact."
time_traveler_trait_historian: "Institutional Historian"
time_traveler_trait_historian_desc: "He remembers which ministries survived, which coalitions broke and who rose through them. Advice on domestic threats and on diplomacy comes easily to him. His account of battlefields is less detailed."
time_traveler_profile_token_analyst: "analyst"
time_traveler_profile_token_engineer: "engineer"
time_traveler_profile_token_historian: "historian"
