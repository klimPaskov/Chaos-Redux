time_traveler_credibility_effect_doubted: "The staff trusts him with little and only the simplest advice is offered."
time_traveler_credibility_effect_trusted: "Every kind of advice that the terms allow is open and the staff can copy what he teaches."
time_traveler_credibility_effect_indispensable: "The strongest rewards are open and the staff acts on his words quickly."
time_traveler_exposure_effect_secret: "At most two foreign services take an interest and they can only infiltrate."
time_traveler_exposure_effect_suspected: "Up to four foreign services take an interest and they can plant forgeries and offer asylum."
time_traveler_exposure_effect_public: "Up to six foreign services take an interest and they can act openly or try to seize him."
time_traveler_divergence_effect_recognizable: "His forecasts still name dates and people."
time_traveler_divergence_effect_altered: "His forecasts give ranges of dates and the conditions that matter."
time_traveler_divergence_effect_broken: "His forecasts warn only of weak structures, and later events come sooner."
time_traveler_status_wounded: "He is recovering from an attack and cannot be consulted."
time_traveler_status_relocating: "He is being moved to another site and cannot be consulted."
time_traveler_status_guarded: "A guard detail surrounds him."
time_traveler_status_choosing: "He waits for the government to decide the terms of his access."
