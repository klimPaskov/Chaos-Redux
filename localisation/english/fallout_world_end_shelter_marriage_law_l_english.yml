 chaosx.fallout.303.t: "The Shelter Marriage Law"
 chaosx.fallout.303.d: "Families who shared a vent room now share a legal question. The shelter registry lists partners, guardians, and dependents, but it does not say who may make a household when the old courts are gone. Every answer will set a precedent for citizenship and inheritance."
 chaosx.fallout.303.a: "Write a civil law for every household"
 chaosx.fallout.303.a.tt: "Use the registry office to recognize civil marriages and grant a common household status. Costs Food, Medicine, and Recognition."
 chaosx.fallout.303.b: "Let the communities bind themselves"
 chaosx.fallout.303.b.tt: "Authorize communal contracts written by neighborhood councils. Costs Food, Shelter, and Scrap."
 chaosx.fallout.303.c: "Give the rite to the congregations"
 chaosx.fallout.303.c.tt: "Let recognized congregations keep marriage records and settle family disputes. Costs Food, Medicine, and Recognition."
 chaosx.fallout.303.d_option: "Keep the state out of the home"
 chaosx.fallout.303.d_option.tt: "Leave households to private agreement and protect only the shelter register. Costs Food, Scrap, and Power."
 chaosx.fallout.305.t: "A law written in shared rooms"
 chaosx.fallout.305.civil.success.d: "The civil code survives its first winter. Registry clerks can settle names, guardianship, and ration inheritance without asking which corridor a family came from. Couples who arrived as strangers now have a public way to become a household."
 chaosx.fallout.305.civil.partial.d: "The civil code is accepted in the capital and ignored in several outer shelters. Its forms give families a path, but every dispute still needs a local compromise."
 chaosx.fallout.305.civil.failure.d: "The first hearings turn into a contest over who owns the old names. Clerks destroy the disputed pages rather than choose between families, and several households leave the register entirely."
 chaosx.fallout.305.communal.success.d: "Neighborhood councils write contracts that fit the lives people actually lead. A household can name several guardians, share a ration allotment, and transfer care without waiting for a distant office."
 chaosx.fallout.305.communal.partial.d: "The councils agree on a common form, but each shelter adds a different exception. Families gain recognition in their own rooms and uncertainty at every checkpoint."
 chaosx.fallout.305.communal.failure.d: "The councils divide over whose witness counts. Several contracts are signed twice, and ration officers begin treating household membership as a favor rather than a right."
 chaosx.fallout.305.religious.success.d: "Congregations open their books and accept witnesses from outside their own doors. Their marriage rites become a careful bridge between old faiths, new shelters, and families who kept no record."
 chaosx.fallout.305.religious.partial.d: "The congregations keep reliable records for their members, yet families without a congregation must wait for a special hearing. The rite brings comfort and a new boundary."
 chaosx.fallout.305.religious.failure.d: "The congregations cannot agree on a shared register. Rival books name different heirs, and the government must spend scarce authority calming a dispute it promised not to own."
 chaosx.fallout.305.leave.success.d: "The state publishes one narrow protection and steps back. Families choose their own witnesses, while the shelter register guards children and ration shares without deciding which custom is correct."
 chaosx.fallout.305.leave.partial.d: "The state keeps its promise to intervene rarely, but the private agreements are uneven. Some families find room to breathe, while others discover that silence is not the same as protection."
 chaosx.fallout.305.leave.failure.d: "No common rule emerges. Ration officers refuse to arbitrate household claims, and several families lose access to names, medicine allotments, and the relatives who could speak for them."
 chaosx.fallout.305.a: "Accept the first register"
 chaosx.fallout.305.a.tt: "Record the delayed result and begin the one-year household follow-up."
 chaosx.fallout.307.t: "The second winter of the register"
 chaosx.fallout.307.success.d: "After a year, the first household records have become ordinary work. Children can name more than one guardian, widows can retain their ration shares, and a family may cross a shelter line without losing its legal identity."
 chaosx.fallout.307.partial.d: "The register has not settled every dispute, but it has made the disputes legible. Local witnesses now know which pages to bring when a family arrives from another shelter."
 chaosx.fallout.307.failure.d: "The follow-up exposes missing pages and promises that no office can keep. Families return to private marks and spoken testimony, carrying a lasting distrust of the law."
 chaosx.fallout.307.a: "Close the first household cycle"
 chaosx.fallout.307.a.tt: "Resolve the callback, record its memory, and release the Shelter Marriage Law transaction."
 fallout.event_log.shelter_marriage_law.name: "Shelter Marriage Law"
 fallout.event_log.shelter_marriage_law.detail: "A Fallout family-law chain recorded a policy, a delayed result, and a household follow-up."
 fallout.event_log.shelter_marriage_law.civil_success: "Civil household law took root in the shelter registry."
 fallout.event_log.shelter_marriage_law.civil_partial: "Civil household law spread unevenly between shelters."
 fallout.event_log.shelter_marriage_law.civil_failure: "Civil household law failed during its first hearings."
 fallout.event_log.shelter_marriage_law.communal_success: "Communal household contracts became accepted shelter practice."
 fallout.event_log.shelter_marriage_law.communal_partial: "Communal contracts gained witnesses but not a common exception code."
 fallout.event_log.shelter_marriage_law.communal_failure: "Communal household witnesses split over competing contracts."
 fallout.event_log.shelter_marriage_law.religious_success: "Congregations opened a reliable shared marriage register."
 fallout.event_log.shelter_marriage_law.religious_partial: "Congregations kept records while unaligned families waited."
 fallout.event_log.shelter_marriage_law.religious_failure: "Congregational registers named competing heirs."
 fallout.event_log.shelter_marriage_law.leave_success: "Private household agreements gained a narrow state protection."
 fallout.event_log.shelter_marriage_law.leave_partial: "Private household agreements remained uneven but usable."
 fallout.event_log.shelter_marriage_law.leave_failure: "Private household agreements left families without a common rule."
 fallout.event_log.shelter_marriage_law.callback_success: "The first household cycle made cross-shelter identity ordinary."
 fallout.event_log.shelter_marriage_law.callback_partial: "The first household cycle made disputes legible."
 fallout.event_log.shelter_marriage_law.callback_failure: "The first household cycle ended in distrust of the register."
 fallout_shelter_marriage_civil: "Civil Household Code"
 fallout_shelter_marriage_civil_desc: "Civil clerks protect household names, guardianship, and ration inheritance."
 fallout_shelter_marriage_communal: "Communal Household Contracts"
 fallout_shelter_marriage_communal_desc: "Neighborhood councils keep household agreements close to the people who witness them."
 fallout_shelter_marriage_religious: "Congregational Family Register"
 fallout_shelter_marriage_religious_desc: "Congregations preserve family records while shelters rebuild their public rites."
 fallout_shelter_marriage_leave: "Private Household Protection"
 fallout_shelter_marriage_leave_desc: "A narrow state rule protects household identity without choosing a private custom."
 fallout_shelter_marriage_maintained: "Maintained Household Register"
 fallout_shelter_marriage_maintained_desc: "A completed household cycle gives families a durable way to carry identity between shelters."
 fallout_shelter_marriage_failed: "Household Register Dispute"
 fallout_shelter_marriage_failed_desc: "Conflicting records make ration inheritance and guardianship harder to settle."
