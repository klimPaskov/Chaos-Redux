l_english:
raid_category_biological_battlefield_raids: "Battlefield Biological Raids"
raid_category_header_biological_battlefield_raids: "Battlefield Biological Raids"
tooltip_raid_category_biological_battlefield_raids: "§YBattlefield Biological Raids§!\nArmy-led biological raids against an exact enemy-held state containing a supply node or concentrated formations. Every agent uses the same operational delivery profile; their potency differs after a release. Each raid reserves the full matching payload before final assembly, and the payload is lost if the raid fails or loses authorization. A successful release can affect one adjacent friendly state and increases exposure when the enemy occupies territory belonging to us, our faction, or our subjects. Doctrine may increase biological harm and refund a limited amount of Command Power, but it can reduce only Condemnation."
biological_battlefield_raid_available_tooltip: "Requires an ongoing war, Theater CBRN Headquarters technology, full Chemical Readiness, a policy permitting battlefield biological use, any national last-resort safeguards, at least one ordinary biological-agent project, and a valid active §YCombined CBRN Overmatch§! authorization. Each raid still requires its matching project, full payload, exact target state, and eligible delivery formation."

raid_type_anthrax_battlefield_dissemination: "Anthrax Battlefield Dissemination"
raid_type_anthrax_battlefield_dissemination_desc: "Send a protected delivery detachment across the front to disperse a moderate-severity anthrax payload around enemy troops or a supply area. Anthrax creates persistent local lethality and is difficult to decontaminate, but it is less likely to spread far than other agents."
raid_type_plague_battlefield_dissemination: "Plague Battlefield Dissemination"
raid_type_plague_battlefield_dissemination_desc: "Attempt a battlefield release of serious weaponized plague. If delivery succeeds, the agent can escape the target state and produce a dangerous regional outbreak."
raid_type_tularemia_battlefield_dissemination: "Tularemia Battlefield Dissemination"
raid_type_tularemia_battlefield_dissemination_desc: "Disperse low-severity tularemia against a concentrated army or supply area. It is the least potent ordinary agent overall, but remains effective at creating frontline sickness, organisation loss, recovery pressure, and medical saturation."
raid_type_smallpox_battlefield_dissemination: "Smallpox Battlefield Dissemination"
raid_type_smallpox_battlefield_dissemination_desc: "Risk a battlefield release of severe weaponized smallpox. It is the most potent ordinary agent and can create a long-incubation outbreak among soldiers and civilians beyond the target state."

raid_target_name_biological_battlefield_state: "Battlefield biological raid in $LOCATION$"
bio_battlefield_target_available_tt: "Select one inhabited, passable state controlled by an enemy country at war with us. The selected state must border a state controlled by us that contains one of our divisions, and it must contain either a supply node or at least three enemy divisions. Enemy-held territory belonging to us, our faction, or our subjects remains eligible; in that case, the exposed population share is higher."
bio_battlefield_preparation_available_tt: "Requires the matching agent project, full Chemical Readiness, a policy permitting battlefield biological use, and a valid active §YCombined CBRN Overmatch§! authorization. Assign an infantry, motorized, or mechanized division with at least three matching battalions. The raid reserves the full matching payload before its one-day final release assembly; the payload is not returned if the raid fails or the authorization is lost."
bio_battlefield_launch_available_tt: "The exact selected state must remain enemy-controlled and connected to our front. §YCombined CBRN Overmatch§!, full Chemical Readiness, and battlefield-use authority must remain active through launch. If authorization or target context is lost, the reserved payload is lost, no biological release is recorded, and no Command Power is refunded."

bio_battlefield_failure_actor_tt: "The delivery team failed to release the agent. The full reserved payload was lost. Recovered material left forensic evidence in the selected state; the attempt may be attributed and raise Condemnation, but no outbreak seed was established."
bio_battlefield_failure_target_tt: "The raid failed before a biological release reached the selected state. No outbreak seed was established, but recovered material provides evidence of an attempted biological release."
bio_battlefield_limited_actor_tt: "A limited release reached the selected state. The full payload was consumed. The ordinary biological response may cause sickness, supply disruption, contamination, and spread; one adjacent friendly state containing our divisions may also be affected."
bio_battlefield_limited_target_tt: "A limited biological release reached the selected state. Local surveillance, protection, medical response, and containment may still limit sickness, contamination, supply disruption, and spread beyond the target."
bio_battlefield_success_actor_tt: "The release reached the selected state at effective strength. The full payload was consumed. The ordinary biological response may cause sickness, deaths, contamination, supply disruption, and medical saturation; one adjacent friendly state containing our divisions may also be affected, and Condemnation may rise."
bio_battlefield_success_target_tt: "A biological release reached the selected state's troops, supply system, and population. Sickness, deaths, contamination, supply disruption, and medical saturation may follow; containment may limit spread beyond the target. If the enemy occupies territory belonging to us, our faction, or our subjects, the exposed population share is higher."
bio_battlefield_critical_actor_tt: "The release reached the selected state at critical strength. The full payload was consumed. Intense sickness, deaths, contamination, supply disruption, medical saturation, and Condemnation may follow; one adjacent friendly state containing our divisions may also be affected."
bio_battlefield_critical_target_tt: "A high-intensity biological release reached the selected state. Military sickness, supply disruption, deaths, and spread beyond the target may follow unless rapid containment succeeds. If the enemy occupies territory belonging to us, our faction, or our subjects, the exposed population share is higher."
bio_battlefield_context_rejected_actor_tt: "The raid could not confirm its authorization and exact target context at resolution. The full reserved payload was lost, but no biological release occurred and no Command Power was refunded."
bio_battlefield_context_rejected_target_tt: "The raid could not confirm its authorization and exact target context at resolution. No biological release reached this state."
