l_english:
biological_battlefield_raid_available_tooltip: "Requires an ongoing war, Pathogen Handling Protocols, strong field protection from issued masks, maintained filters, decontamination, and training, battlefield biological-use authority, any national last-resort safeguards, and an ordinary biological-agent project. Each raid requires its matching project, full payload, exact target state, and eligible delivery formation."

raid_type_anthrax_battlefield_dissemination: "Anthrax Battlefield Dissemination"
raid_type_anthrax_battlefield_dissemination_desc: "Send a protected delivery detachment across the front to disperse a moderately potent anthrax payload around enemy troops or a supply area. Anthrax creates persistent local lethality, resists decontamination, and is less likely to spread far than other agents."
raid_type_plague_battlefield_dissemination: "Plague Battlefield Dissemination"
raid_type_plague_battlefield_dissemination_desc: "Attempt a battlefield release of serious weaponized plague. If delivery succeeds, the agent can escape the target state and produce a dangerous regional outbreak."
raid_type_tularemia_battlefield_dissemination: "Tularemia Battlefield Dissemination"
raid_type_tularemia_battlefield_dissemination_desc: "Disperse low-potency tularemia against a concentrated army or supply area. As the least potent ordinary agent overall, it remains effective at creating frontline sickness, organisation loss, recovery pressure, and medical saturation."
raid_type_smallpox_battlefield_dissemination: "Smallpox Battlefield Dissemination"
raid_type_smallpox_battlefield_dissemination_desc: "Risk a battlefield release of severe weaponized smallpox. It is the most potent ordinary agent and can create a long-incubation outbreak among soldiers and civilians beyond the target state."

raid_target_name_biological_battlefield_state: "Battlefield biological raid in $LOCATION$"
bio_battlefield_target_available_tt: "Select one inhabited, passable state controlled by an enemy country at war with us. The selected state must border a state controlled by us that contains one of our divisions, and it must contain either a supply node or at least three enemy divisions. Enemy-held territory belonging to us, our faction, or our subjects remains eligible and carries a higher exposed population share."
bio_battlefield_preparation_available_tt: "Requires the matching agent project, Pathogen Handling Protocols, strong field protection from masks, filters, decontamination, and training, and battlefield biological-use authority. Assign an infantry, motorized, or mechanized division with at least three matching battalions. The required payload is collected when the raid is created."
bio_battlefield_launch_available_tt: "The selected state must remain enemy-controlled and on our front. Field protection, Pathogen Handling Protocols and battlefield-use authority must remain sufficient until launch. If the target or authority becomes invalid before completion, no biological agent is released."

bio_battlefield_failure_actor_tt: "The delivery team fails to release the agent. Material recovered in the selected state may identify us and raise Condemnation. This attempt causes no outbreak."
bio_battlefield_failure_target_tt: "The raid failed before a biological release reached the selected state. Recovered material provides evidence of an attempted biological release without establishing an outbreak seed."
bio_battlefield_limited_actor_tt: "A limited release reaches the selected state. It may cause sickness, supply disruption, contamination, and spread. One adjacent friendly state containing our divisions may also be affected."
bio_battlefield_limited_target_tt: "A limited biological release reached the selected state. Local surveillance, protection, medical response, and containment may still limit sickness, contamination, supply disruption, and spread beyond the target."
bio_battlefield_success_actor_tt: "The release reaches the selected state at effective strength. It may cause sickness, deaths, contamination, supply disruption, and medical strain. One adjacent friendly state containing our divisions may also be affected, and Condemnation may rise."
bio_battlefield_success_target_tt: "A biological release reached the selected state's troops, supply system, and population. Sickness, deaths, contamination, supply disruption, and medical saturation may follow, while containment may limit spread beyond the target. The exposed population share is higher if the enemy occupies territory belonging to us, our faction, or our subjects."
bio_battlefield_critical_actor_tt: "The release reaches the selected state at critical strength. Severe illness, deaths, contamination, supply disruption, medical strain, and Condemnation may follow. One adjacent friendly state containing our divisions may also be affected."
bio_battlefield_critical_target_tt: "A high-intensity biological release reached the selected state. Military sickness, supply disruption, deaths, and spread beyond the target may follow unless rapid containment succeeds. If the enemy occupies territory belonging to us, our faction, or our subjects, the exposed population share is higher."
bio_battlefield_context_rejected_actor_tt: "The raid ends without a biological release because battlefield-use authority or the selected target is no longer valid."
bio_battlefield_context_rejected_target_tt: "The raiders cannot release an agent because their authority or target is no longer valid. This state is unaffected."
