africa_integration_rail_operation_target: "Integration rail operation target"
africa_regional_authority_spirit: "Regional Charter Seat"
africa_regional_authority_spirit_desc: "This Charter subject holds a regional seat, supports League defense, and can move toward integration, protectorate status, federation, or resistance."
africa_high_chaos_actor_spirit: "Bestiary Charter Seat"
africa_high_chaos_actor_spirit_desc: "This impossible nonhuman or supernatural actor is recognized under the Bestiary Clause and bound to the Charter through negotiated limits."
africa_west_african_congress_seat: "West African Congress"
africa_west_african_congress_seat_desc: "The West African Congress enters the Charter as a liberation corridor and infantry reserve for Atlantic and Sahel routes."
africa_sahel_caravan_seat: "Sahel Caravan"
africa_sahel_caravan_seat_desc: "The Sahel Caravan keeps mobile columns, rail stores, and interior routes moving between old seats and League fronts."
africa_maghreb_coast_seat: "Maghreb Coast"
africa_maghreb_coast_seat_desc: "The Maghreb Coast secures ports, dockyards, and coastal recognition for the northern Charter line."
africa_nile_horn_league_seat: "Nile-Horn League"
africa_nile_horn_league_seat_desc: "The Nile-Horn League guards Red Sea papers, archive warrants, and the eastern authority route."
africa_east_african_railway_seat: "East African Railway Congress"
africa_east_african_railway_seat_desc: "The East African Railway Congress binds the Charter to rail logistics, train stockpiles, and practical integration."
africa_great_lakes_council_seat: "Great Lakes Council"
africa_great_lakes_council_seat_desc: "The Great Lakes Council turns lake crossings, local manpower, and regional trust into a durable defensive seat."
africa_congo_basin_charter_seat: "Congo Basin Charter"
africa_congo_basin_charter_seat_desc: "The Congo Basin Charter protects river approaches, resources, and interior guard lines."
africa_zambezi_stone_cities_seat: "Zambezi-Stone Cities"
africa_zambezi_stone_cities_seat_desc: "The Zambezi-Stone Cities connect old-seat legitimacy with workshops and southern authority."
africa_south_african_liberation_congress_seat: "South African Liberation Congress"
africa_south_african_liberation_congress_seat_desc: "The South African Liberation Congress carries emergency manpower, liberation claims, and military industry for the southern route."
africa_indian_ocean_congress_seat: "Indian Ocean Congress"
africa_indian_ocean_congress_seat_desc: "The Indian Ocean Congress keeps island ports, convoy lines, and maritime League aid within the Charter."
africa_gorilla_highlands_seat: "Gorilla Highlands"
africa_gorilla_highlands_seat_desc: "The nonhuman Gorilla Highlands hold a Bestiary seat around habitat trust, forest defense, and negotiated limits."
africa_baobab_senate_seat: "Baobab Senate"
africa_baobab_senate_seat_desc: "The Baobab Senate speaks through old roots, archive memory, and a slow supernatural claim on the Charter."
africa_tidemark_dominion_seat: "Tidemark Dominion"
africa_tidemark_dominion_seat_desc: "The Tidemark Dominion binds supernatural shorelines to convoys, ports, and warning routes."
africa_ananse_web_seat: "Ananse Web"
africa_ananse_web_seat_desc: "The Ananse Web treats archive signals, command relays, and rumor lines as a Bestiary obligation."
africa_orisha_vodun_nature_courts_seat: "Orisha/Vodun Nature Courts"
africa_orisha_vodun_nature_courts_seat_desc: "The Orisha/Vodun Nature Courts negotiate habitat, covenant pressure, and supernatural restraint under explicit Bestiary terms."
africa_crocodile_rivers_seat: "Crocodile Rivers"
africa_crocodile_rivers_seat_desc: "The Crocodile Rivers patrol river mouths, relief crossings, and hard territorial limits inside the Bestiary Clause."
africa_chimpanzee_telegraph_league_seat: "Chimpanzee Telegraph League"
africa_chimpanzee_telegraph_league_seat_desc: "The nonhuman Chimpanzee Telegraph League carries marsh scout lines, sabotage warnings, and forest coordination under Bestiary terms."
africa_okapi_court_seat: "Okapi Court"
africa_okapi_court_seat_desc: "The nonhuman Okapi Court keeps hidden courier law, quiet vetoes, and forest witness records inside the Charter."
africa_termite_citadel_engineers_seat: "Termite Citadel Engineers"
africa_termite_citadel_engineers_seat_desc: "The nonhuman Termite Citadel Engineers bind mounds, depots, and rail repairs to a cautious Citadel Treaty."
africa_honeyguide_commons_seat: "Honeyguide Commons"
africa_honeyguide_commons_seat_desc: "The nonhuman Honeyguide Commons marks guide routes, depots, and omen trails for Charter logistics."
africa_great_herds_compact_seat: "Great Herds"
africa_great_herds_compact_seat_desc: "The nonhuman Great Herds carry migration corridors, supply movement, and anti-ivory clauses into continental law."
africa_bonobo_kinship_congress_seat: "Bonobo Kinship Congress"
africa_bonobo_kinship_congress_seat_desc: "The nonhuman Bonobo Kinship Congress protects boundary consent, kinship mediation, and gentle vetoes inside the Bestiary Clause."
africa_hyena_radio_dominion_seat: "Hyena Radio Dominion"
africa_hyena_radio_dominion_seat_desc: "The nonhuman Hyena Radio Dominion turns night signals, false trails, and guarded broadcasts into a Bestiary warning route."
africa_bird_of_the_walls_seat: "Bird of the Walls"
africa_bird_of_the_walls_seat_desc: "The nonhuman Bird of the Walls watches old courtyards, broken fort lines, and verified omens before panic can become policy."
africa_sao_terracotta_host_seat: "Sao Terracotta Host"
africa_sao_terracotta_host_seat_desc: "The supernatural Sao Terracotta Host guards kiln memory, old-seat clay markers, and fixed defensive lines under explicit Charter limits."
africa_rsa_continental_emergency_spirit: "Continental Emergency"
africa_rsa_continental_emergency_spirit_desc: "The continental side fights a civil war under the Charter while old alliance ties try to hold South Africa in place."

chaosx.events_log.window.event_details.africa: "A valid African-capital country proclaims Africa is One, adopts the continental identity, and opens the Charter League. Paper claims cover the continent, but integration requires state control, League authority, regional trust, dossiers, and living-core work. South Africa follows a civil-war branch when Allied ties divide the mandate."
chaosx.events_log.evolution.type.africa: "Africa Is One"
chaosx.events_log.window.evolution_details.africa.title.stage_1: "Evolution I: The Charter Opens"
chaosx.events_log.window.evolution_details.africa.body.stage_1: "The first Charter seals are recorded. Africa holds paper claims, visible values, and a League structure that can invite, aid, protect, influence, integrate, or confront other African countries."
chaosx.events_log.window.evolution_details.africa.title.stage_2: "Evolution II: The League Survives War"
chaosx.events_log.window.evolution_details.africa.body.stage_2: "The mandate has endured a civil-war or liberation test. Allied peace, League reinforcement, and regional authority records make the Charter more than a proclamation."
chaosx.events_log.window.evolution_details.africa.title.stage_3: "Evolution III: The Archive Opens"
chaosx.events_log.window.evolution_details.africa.body.stage_3: "The Authority Atlas and Archive of Old Seats turn historical dossiers into playable routes, regional authority cases, and old-seat legitimacy."
chaosx.events_log.window.evolution_details.africa.title.stage_4: "Evolution IV: High Chaos Has a Seat"
chaosx.events_log.window.evolution_details.africa.body.stage_4: "The Bestiary Clause recognizes impossible nonhuman and supernatural packages while keeping human historical polities human."
chaosx.events_log.window.evolution_details.africa.title.stage_5: "World Is One Gate"
chaosx.events_log.window.evolution_details.africa.body.stage_5: "Africa can support the terminal world-order route only after every continental-unifier prerequisite is complete."
chaosx.events_log.window.evolution_details.africa.body.event_detail: "Africa's evolution entries track the Charter League, regional authority, historical dossiers, high-chaos packages, and the final continental-unifier gate."

