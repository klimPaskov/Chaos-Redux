l_english:
chaosx.nr12.1.t: "A Charter from [ROOT.GetNameDef]"
chaosx.nr12.1.d: "From [ROOT.Capital.GetName], [ROOT.GetNameDef] has announced a continental project whose first promise is protection. Its government will defend African states, move aid through threatened corridors, recognise viable liberation governments, and invite willing governments to negotiate a Charter League. No state is promised away, and no opinion score can turn a country into a province.\n\nOpening problem: [ROOT.GetAfricaHostProblem]\n\nFirst proof: [ROOT.GetAfricaHostProofMission]\n\nStrategic leverage: [ROOT.GetAfricaHostLeverage]\n\nRival pressure: [ROOT.GetAfricaHostRivalRisk]"
chaosx.nr12.1.a: "Protection must come before union."

chaosx.nr12.230.t: "The Charter League Has Lost Its Host"
chaosx.nr12.230.d: "The government that carried the Charter League has been annexed. Its ledgers, obligations, and surviving constitutional record were staged before the country disappeared. The League will not invent a replacement or treat a former opinion as consent. A recorded member may accept the burden through an explicit congress, or the whole docket can remain suspended until a lawful answer exists."
chaosx.nr12.230.a: "Recognise the sole recorded successor."
chaosx.nr12.230.a.tt: "The surviving member accepts the League's recorded obligations and becomes the new Charter host. No land, cores, or sovereignty are transferred."
chaosx.nr12.230.b: "Open the successor congress."
chaosx.nr12.230.b.tt: "Open the succession congress to surviving chartered, autonomous-federal, and integrated members that can lawfully carry the League."
chaosx.nr12.230.c: "Suspend the Charter docket."
chaosx.nr12.230.c.tt: "No government is selected. The staged ledger and obligations remain recorded while the League is without a host."
chaosx.nr12.230.e: "Leave the succession unresolved."
chaosx.nr12.230.e.tt: "The League enters an explicit suspended-host crisis. No tag, core, annexation, or generic successor is created."
chaosx.nr12.231.t: "A Charter Without a Seat"
chaosx.nr12.231.d: "No recorded Charter member can lawfully carry the League's mandate. The host ledger, unresolved obligations, and surviving relationship docket remain preserved as a suspended constitutional crisis. The project is not dissolved, and no country is selected by convenience."
chaosx.nr12.231.a: "Keep the ledgers open."
chaosx.nr12.232.t: "A New Government Carries the Charter"
chaosx.nr12.232.d: "[ROOT.GetNameDef] has accepted the League mandate after the former host was removed. The new host inherits the constitution, regional obligations, active projects, and public records. The original government's history remains in the event log. The Charter League continues under a new seat."
chaosx.nr12.232.a: "The Charter survives by consent."
chaosx.nr12.233.t: "The Charter Seat Is Extinguished"
chaosx.nr12.233.d: "The successor government that carried the Charter League has also been removed. The one-use continuity mandate is exhausted, its active records are closed, and no second host may be chosen. The African project ends without transferring land or sovereignty to another government."
chaosx.nr12.233.a: "Record the end of the League."

chaosx.nr12.2.t: "The First Delegations"
chaosx.nr12.2.d: "The declaration has drawn governments, organisers, and regional rivals toward [ROOT.Capital.GetName]. The first commitment will shape who believes the Charter and who prepares to oppose it. [ROOT.GetNameDef] can choose a priority, but it cannot answer every request at once."
chaosx.nr12.2.slot_1: "Place [africa_first_contact_slot_1.GetNameDef]'s delegation first."
chaosx.nr12.2.slot_2: "Place [africa_first_contact_slot_2.GetNameDef]'s delegation first."
chaosx.nr12.2.slot_3: "Place [africa_first_contact_slot_3.GetNameDef]'s delegation first."
chaosx.nr12.2.slot_4: "Place [africa_first_contact_slot_4.GetNameDef]'s delegation first."
chaosx.nr12.2.slot_5: "Place [africa_first_contact_slot_5.GetNameDef]'s delegation first."
chaosx.nr12.2.no_contact: "The delegations are gone. Record the failed opening and seek a real partner again."

chaosx.events_log.window.event_details.africa: "An African government has started pulling the continent together with aid, guarantees, liberation deals, and a common Charter. Other countries can join, bargain, walk away, or build a rival camp. If the project keeps its promises, regional congresses and constitutional settlements can turn the idea into roads, armies, laws, and a fierce argument over who carries the cost."
# Event 12 action council
africa_charter_council_category: "The Charter League Court"
africa_charter_council_category_desc: "Select one eligible target, open the court docket, inspect its quoted commitment, and launch only as much work as the Charter can administer.\n\nConstitutional rules include Representation: §Y[?africa_constitutional_representation|0]§!, Executive power: §Y[?africa_constitutional_executive_power|0]§!, Resource governance: §Y[?africa_constitutional_resource_governance|0]§!, Common command: §Y[?africa_constitutional_command_integration|0]§!, Withdrawal protection: §Y[?africa_constitutional_withdrawal_protection|0]§!, Crisis resilience: §Y[?africa_constitutional_crisis_resilience|0]§!, Post-unification rule: §Y[?africa_constitutional_post_unification_rule|0]§!. These values alter quoted costs and outcome risk for the corresponding Charter actions."
africa_host_transfer_actions_category: "Host Succession Congress"
africa_host_transfer_actions_category_desc: "Only the government that removed the old host may convene the succession. A candidate must remain an active Charter member, accept the constitution, qualify to lead the continental project, and retain a functioning government."
africa_host_transfer_designate_successor: "Designate a Constitutional Successor"
africa_host_transfer_designate_successor_desc: "Name one chartered, autonomous-federal, or integrated member as the government's successor before the host is removed. This transfers no land, cores, or sovereignty. It authorises one succession if the host later falls."
africa_host_transfer_commit_successor: "Commit [FROM.GetNameDef] as Charter Host"
africa_host_transfer_commit_successor_desc: "Transfer the Charter mandate to [FROM.GetNameDef] after the succession congress selects it. The new host inherits the League's members and obligations, but not the former government's land or cores."
africa_host_transfer_suspend_empty_congress: "Suspend the empty successor congress"
africa_host_transfer_suspend_empty_congress_desc: "All recorded candidates have become invalid. Close the congress into the visible suspended-host crisis rather than leaving a pending docket with no lawful target."
africa_ai_run_profiled_late_action_cycle: "Convene the Strategic Court"
africa_ai_run_profiled_late_action_cycle_desc: "Court staff compare the active constitutional, regional, foreign, and crisis policies before committing capacity to one valid operation."
