africa_high_chaos_actor_focus_tree_desc: "Shared Bestiary focus tree for supernatural or nonhuman Charter actors recognized under explicit Bestiary terms."

AFR_the_charter_mandate: "The Charter Mandate"
AFR_the_charter_mandate_desc: "Name the continental mandate and bind it to legitimacy, authority, defense, aid, and integration obligations the Congress can enforce."
AFR_continental_congress: "Continental Congress"
AFR_continental_congress_desc: "Gather League delegates around recognition, legitimacy, and the first Charter agenda."
AFR_liberation_war_office: "Liberation War Office"
AFR_liberation_war_office_desc: "Turn liberation momentum into equipment routes, manpower registers, and map objectives."
AFR_authority_atlas: "Authority Atlas"
AFR_authority_atlas_desc: "Open the Atlas that tracks dossiers, old seats, and the legitimacy of restored authorities."
AFR_industrial_convergence: "Industrial Convergence"
AFR_industrial_convergence_desc: "Tie workshops, ports, rail, and supply corridors to the Charter instead of a single capital."
AFR_regional_authority_charters: "Regional Authority Charters"
AFR_regional_authority_charters_desc: "Create regional authority language for protected members, integration offices, and resistant capitals."
AFR_charter_courts: "Charter Courts"
AFR_charter_courts_desc: "Make the League's legal claims visible before they become administrative facts."
AFR_archive_of_old_seats: "Archive of Old Seats"
AFR_archive_of_old_seats_desc: "Move historical dossiers into a political archive where old capitals, kingdoms, courts, and congresses can be argued before the Charter."
AFR_lake_and_rail_agreements: "Lake and Rail Agreements"
AFR_lake_and_rail_agreements_desc: "Build practical corridors through the mandate so integration is not only ceremonial."
AFR_mandate_foundries: "Mandate Foundries"
AFR_mandate_foundries_desc: "Fund military industry tied to League defense and liberation needs."
AFR_return_offices: "Return Offices"
AFR_return_offices_desc: "Open the diaspora return route through ports, housing, industry, stability, and consent."
AFR_afro_american_delegations: "Afro-American Delegations"
AFR_afro_american_delegations_desc: "Receive organizers, doctors, engineers, soldiers, and teachers without reducing returnees to manpower."
AFR_caribbean_atlantic_networks: "Caribbean and Atlantic Networks"
AFR_caribbean_atlantic_networks_desc: "Use convoy routes, cultural links, and Atlantic organizing networks to support the Charter."
AFR_exile_professors_engineers: "Exile Professors and Engineers"
AFR_exile_professors_engineers_desc: "Tie return expertise to universities, workshops, construction offices, and technical missions."
AFR_returnee_settlement_councils: "Returnee Settlement Councils"
AFR_returnee_settlement_councils_desc: "Build settlement councils so return politics does not become a shock imposed on local communities."
AFR_citizenship_without_erasure: "Citizenship Without Erasure"
AFR_citizenship_without_erasure_desc: "Give returnees legal citizenship while protecting local seats, languages, and political memory."
AFR_diaspora_guard_cadres: "Diaspora Guard Cadres"
AFR_diaspora_guard_cadres_desc: "Prepare volunteer cadres through training and equipment channels that later decisions must pay for."
AFR_pan_atlantic_congress: "Pan-Atlantic Congress"
AFR_pan_atlantic_congress_desc: "Turn return offices into a wider Atlantic recognition network and a post-unification diplomatic route."
AFR_charter_general_staff: "Charter General Staff"
AFR_charter_general_staff_desc: "Create the staff structure for League wars, defensive intervention, and reinforcement."
AFR_liberation_columns: "Liberation Columns"
AFR_liberation_columns_desc: "Raise columns that can reinforce protected capitals and push map objectives."
AFR_dossier_kush_to_kilwa: "Kush to Kilwa Dossiers"
AFR_dossier_kush_to_kilwa_desc: "Open northeast and coastal dossiers for the Authority Atlas."
AFR_dossier_manden_to_benin: "Manden to Benin Dossiers"
AFR_dossier_manden_to_benin_desc: "Open western dossiers for the Archive of Old Seats."
AFR_dossier_kongo_to_merina: "Kongo to Merina Dossiers"
AFR_dossier_kongo_to_merina_desc: "Open central, southern, and island dossiers for the Authority Atlas."
AFR_scramble_reverse_claims: "Reverse the Scramble"
AFR_scramble_reverse_claims_desc: "Turn colonial alarm into objectives and claims rather than instant annexation."
AFR_federal_charter_path: "Federal Charter"
AFR_federal_charter_path_desc: "Favor cohesion, central authority, and living integration."
AFR_charter_assembly_votes: "Charter Assembly Votes"
AFR_charter_assembly_votes_desc: "Give members and regional authorities public votes before integration dockets harden into settled law."
AFR_regional_autonomy_statutes: "Regional Autonomy Statutes"
AFR_regional_autonomy_statutes_desc: "Bind regional authority subjects to written autonomy statutes, slower integration, and safer living-core work."
AFR_federal_high_court: "Federal High Court"
AFR_federal_high_court_desc: "Arbitrate border, member, and authority cases before old claims become League crises."
AFR_continental_citizenship: "Continental Citizenship"
AFR_continental_citizenship_desc: "Recognize citizenship through the Charter while protecting local seats, return communities, and older obligations."
AFR_congress_of_capitals: "Congress of Capitals"
AFR_congress_of_capitals_desc: "Let protected capitals remain visible inside the federation and begin the long proof that paper claims can become governed territory."
AFR_sovereign_seats_path: "Sovereign Seats"
AFR_sovereign_seats_path_desc: "Favor local sovereignty, protected seats, and regional trust."
AFR_high_chaos_door: "The High-Chaos Door"
AFR_high_chaos_door_desc: "Let the Archive identify impossible nonhuman and supernatural packages."
AFR_integrated_regions: "Integrated Regions"
AFR_integrated_regions_desc: "Reduce paper-core burden and prepare living cores through state control."
AFR_autonomous_regions: "Autonomous Regions"
AFR_autonomous_regions_desc: "Keep regional authority visible without erasing local seats."
AFR_peoples_liberation_front: "People's Liberation Front"
AFR_peoples_liberation_front_desc: "Organize ports, mines, exiles, and colonial soldiers into a continental anti-colonial route. Momentum rises quickly, and so does foreign alarm."
AFR_port_unions_and_mine_cells: "Port Unions and Mine Cells"
AFR_port_unions_and_mine_cells_desc: "Give labour networks a military-logistics role in ports, mines, rail yards, and supply corridors."
AFR_exile_radios: "Exile Radios"
AFR_exile_radios_desc: "Use broadcasts and return networks to reach occupied territories, Charter members, and diaspora organizers."
AFR_people_continental_army: "People's Continental Army"
AFR_people_continental_army_desc: "Turn liberation committees into an equipment-hungry army that can reinforce member capitals and colonial fronts."
AFR_general_staff_above_parliament: "General Staff Above Parliament"
AFR_general_staff_above_parliament_desc: "Let the war office outrank the congress. Authority and readiness rise while cohesion and regional trust suffer."
AFR_railway_war_offices: "Railway War Offices"
AFR_railway_war_offices_desc: "Bind rail repair, supply hubs, depots, and military works to the General Staff route."
AFR_askari_veteran_bureaus: "Askari and Veteran Bureaus"
AFR_askari_veteran_bureaus_desc: "Recruit colonial-era African soldiers through a Charter bureau instead of leaving them to every foreign garrison."
AFR_continental_war_plan: "Continental War Plan"
AFR_continental_war_plan_desc: "Prepare coordinated ultimatums, liberation fronts, and Scramble counter-dockets under military command."
AFR_crown_congress: "Crown Congress"
AFR_crown_congress_desc: "Invite old crowns, seats, regalia, councils, and ceremonial authorities into a modern continental congress."
AFR_regalia_verification_chambers: "Regalia Verification Chambers"
AFR_regalia_verification_chambers_desc: "Check title claims through the Archive before old-seat legitimacy turns into counterfeit authority."
AFR_crown_without_one_crown: "Crown Without One Crown"
AFR_crown_without_one_crown_desc: "Reject a single invented throne for Africa and preserve several living seats under one Charter."
AFR_royal_roads_and_drums: "Royal Roads and Drums"
AFR_royal_roads_and_drums_desc: "Make ceremony move through roads, ports, drums, escorts, and local supply instead of only proclamations."
AFR_crowns_beneath_the_charter: "Crowns Beneath the Charter"
AFR_crowns_beneath_the_charter_desc: "Settle the crown route inside Charter law, with old-seat legitimacy and local sovereignty kept visible."
AFR_forest_parliament: "Forest Parliament"
AFR_forest_parliament_desc: "Recognize habitat trust and nonhuman sovereignty through the high-chaos route."
AFR_archive_bestiary_clause: "Archive Bestiary Clause"
AFR_archive_bestiary_clause_desc: "Record nonhuman seats in the Archive with alarm, mandate, and limits."
AFR_continent_sponsor_office: "Continent Sponsor Office"
AFR_continent_sponsor_office_desc: "Open the office that will prepare sponsor missions once Africa Is One is proven."
AFR_africa_is_one: "Africa Is One"
AFR_africa_is_one_desc: "Mark the continental pole ready after the Continental Register, regional authorities, living cores, and historical dossier coverage prove the Charter can govern more than paper claims. The World Root and Bestiary thresholds remain part of the terminal World Is One path."
AFR_continental_export_office: "The Continental Export Office"
AFR_continental_export_office_desc: "Turn Africa's completed mandate and sponsor-ready office into a staffed desk for continent-unifier charters, proof missions, and foreign recognition fights."
AFR_middle_east_charter_staff: "Nile-to-Euphrates Charter Staff"
AFR_middle_east_charter_staff_desc: "Assign liaison staff, convoy ledgers, and congress envoys to the Middle East charter route before material sponsorship begins."
AFR_asia_charter_liaison_columns: "Afro-Asian Liaison Columns"
AFR_asia_charter_liaison_columns_desc: "Prepare ports, equipment corridors, and political translators for a wider Asian charter route."
AFR_europe_charter_observers: "European Charter Observers"
AFR_europe_charter_observers_desc: "Send observers into the most dangerous charter theater, where any African backing can become a major-power crisis."
AFR_south_atlantic_return_mandate: "South Atlantic Return Mandate"
AFR_south_atlantic_return_mandate_desc: "Use the Pan-Atlantic Congress, return networks, and convoy law to prepare the South Atlantic charter route."
AFR_congress_of_continents: "Congress of Continents"
AFR_congress_of_continents_desc: "Bring sponsored charter routes into one congress before Africa proclaims a dynamic cross-continent union identity."
AFR_unifier_proof_ledger: "Unifier Proof Ledger"
AFR_unifier_proof_ledger_desc: "Open a ledger for external continent-unifier proofs after the cross-continent union identity exists."
AFR_last_borders_are_administrative: "The Last Borders Are Administrative"
AFR_last_borders_are_administrative_desc: "Treat the last continental borders as records to be certified only after all external unifier proofs are visible."
AFR_one_charter_above_nations: "One Charter Above Nations"
AFR_one_charter_above_nations_desc: "Put the certified Congress of Continents under a single terminal charter before the World Is One gate can open."
AFR_the_world_is_one: "The World Is One"
AFR_the_world_is_one_desc: "Start Africa's terminal world-end scenario only after Africa Is One, the Congress of Continents, every required external unifier proof, certification, living-core, dossier, Bestiary, and sponsor threshold are all complete."
AFR_authority_register: "Authority Register"
AFR_authority_register_desc: "Turn the Atlas from a shelf of names into a register of active cases, limits, and local obligations."
AFR_dossier_selection_office: "Dossier Selection Office"
AFR_dossier_selection_office_desc: "Assign clerks and envoys to the next old-seat dossier before any settlement claim is made."
AFR_integration_temperature_board: "Integration Temperature Board"
AFR_integration_temperature_board_desc: "Track where authority, local sovereignty, and paper-core pressure are pulling against one another."
AFR_old_seat_mission_calendar: "Old-Seat Mission Calendar"
AFR_old_seat_mission_calendar_desc: "Put surveys, guards, monuments, roads, and hearings on a visible calendar."
AFR_local_sovereignty_hearings: "Local Sovereignty Hearings"
AFR_local_sovereignty_hearings_desc: "Give local seats a formal hearing before the Charter chooses protection, federation, or integration."
AFR_nile_stelae_and_red_sea_gates: "Nile Stelae and Red Sea Gates"
AFR_nile_stelae_and_red_sea_gates_desc: "Open the Nile, Aksumite, Red Sea, and Horn dossier lane."
AFR_cataract_registers: "Cataract Registers"
AFR_cataract_registers_desc: "Record Kush, Meroe, Aksum, and river monuments as guarded political cases."
AFR_horn_well_laws: "Horn Well Laws"
AFR_horn_well_laws_desc: "Tie Horn dossiers to wells, inland trade gates, highland roads, and Red Sea pressure."
AFR_western_rivers_and_crowns: "Western Rivers and Crowns"
AFR_western_rivers_and_crowns_desc: "Open the West African river, forest, Atlantic, and old-crown dossier lane."
AFR_sahel_lake_chad_ledger: "Sahel Lake Chad Ledger"
AFR_sahel_lake_chad_ledger_desc: "Make caravan roads, Lake Chad, and desert logistics part of the old-seat calendar."
AFR_gold_forest_stools: "Gold-Forest Stools"
AFR_gold_forest_stools_desc: "Handle forest regalia and old confederacy claims with consent and guarded records."
AFR_kongo_memory_rings: "Kongo Memory Rings"
AFR_kongo_memory_rings_desc: "Open the Central African river, memory-board, and forest-court dossier lane."
AFR_copperbelt_title_roads: "Copperbelt Title Roads"
AFR_copperbelt_title_roads_desc: "Connect title roads, copper routes, and regional authority supply."
AFR_forest_court_settlements: "Forest-Court Settlements"
AFR_forest_court_settlements_desc: "Keep forest and river settlements from becoming extraction charters."
AFR_swahili_monsoon_ledgers: "Swahili Monsoon Ledgers"
AFR_swahili_monsoon_ledgers_desc: "Open the Swahili Coast, Kilwa, Comorian, and island passage dossier lane."
AFR_island_diwan_office: "Island Diwan Office"
AFR_island_diwan_office_desc: "Put island seats and sea gates into the Charter without isolating them from the continent."
AFR_coralline_port_charters: "Coralline Port Charters"
AFR_coralline_port_charters_desc: "Fund the port and convoy records that make coast and island dossiers playable."
AFR_lake_kingdom_hearings: "Lake Kingdom Hearings"
AFR_lake_kingdom_hearings_desc: "Open Great Lakes dossiers through arbitration, lake roads, and local legitimacy."
AFR_kabaka_and_omukama_arbitration: "Kabaka and Omukama Arbitration"
AFR_kabaka_and_omukama_arbitration_desc: "Keep Buganda and Bunyoro-Kitara dossiers distinct instead of flattening lake history into one claim."
AFR_stone_city_registers: "Stone-City Registers"
AFR_stone_city_registers_desc: "Open the southern, Zambezi, floodplain, and Madagascar dossier lane."
AFR_floodplain_calendar_office: "Floodplain Calendar Office"
AFR_floodplain_calendar_office_desc: "Treat floodplain authority as logistics and law, not decoration."
AFR_red_earth_rova_files: "Red Earth Rova Files"
AFR_red_earth_rova_files_desc: "Bring Madagascar and highland bureaucracy into the Archive without erasing island politics."
AFR_rsa_congress_underground: "RSA Congress Underground"
AFR_rsa_congress_underground_desc: "Give the continental side a political underground before the civil war becomes only a battlefield."
AFR_rsa_mine_and_port_strikes: "RSA Mine and Port Strikes"
AFR_rsa_mine_and_port_strikes_desc: "Use mines, docks, and rail yards to keep the continental side supplied and visible."
AFR_rsa_defecting_units: "RSA Defecting Units"
AFR_rsa_defecting_units_desc: "Organize defectors into Charter-aligned formations instead of letting loyalist command absorb them."
AFR_rsa_allied_pressure: "RSA Allied Pressure"
AFR_rsa_allied_pressure_desc: "Make the Allies face the Charter claim while the civil war is still being fought."
AFR_rsa_pretoria_test: "Pretoria Test"
AFR_rsa_pretoria_test_desc: "Prove that the continental side can hold command, supply, and political authority under civil-war pressure."
AFR_rsa_victory_settlement: "RSA Victory Settlement"
AFR_rsa_victory_settlement_desc: "After continental victory, settle South Africa inside the Charter and confirm the Allied peace result."
AFR_respect_the_old_seats: "Respect the Old Seats"
AFR_respect_the_old_seats_desc: "Choose a slower settlement route that raises trust and old-seat legitimacy."
AFR_documents_before_consent: "Documents Before Consent"
AFR_documents_before_consent_desc: "Accelerate the register with paperwork while accepting the risk of debt and dispute."
AFR_seal_them_under_one_archive: "Seal Them Under One Archive"
AFR_seal_them_under_one_archive_desc: "Centralize old-seat claims into the Archive at the cost of resistance risk."
AFR_the_league_must_not_become_a_museum: "The League Must Not Become a Museum"
AFR_the_league_must_not_become_a_museum_desc: "Keep restoration politics tied to living defense, aid, and integration."
AFR_the_museum_must_not_become_a_prison: "The Museum Must Not Become a Prison"
AFR_the_museum_must_not_become_a_prison_desc: "Prevent the Archive from becoming a tool for forced erasure."
AFR_guard_the_old_capitals: "Guard the Old Capitals"
AFR_guard_the_old_capitals_desc: "Turn old-seat dossiers into defensive missions for capitals, monuments, ports, and roads."
AFR_charter_roads_to_the_seats: "Charter Roads to the Seats"
AFR_charter_roads_to_the_seats_desc: "Build the roads and rail links needed for the Archive to matter on the map."
AFR_regional_guard_schools: "Regional Guard Schools"
AFR_regional_guard_schools_desc: "Train local guards that can defend seats without becoming a free army exploit."
AFR_foreign_holder_case_files: "Foreign-Holder Case Files"
AFR_foreign_holder_case_files_desc: "Mark dossiers blocked by foreign or resistant holders for objectives rather than instant annexation."
AFR_scramble_counter_dockets: "Scramble Counter-Dockets"
AFR_scramble_counter_dockets_desc: "Turn colonial alarm into timed claims, legal cases, and war plans."
AFR_continental_register: "Continental Register"
AFR_continental_register_desc: "Close the first register only after the Archive has opened enough historical dossiers and settled every macro-region line."
AFR_no_seats_for_caricature: "No Seats for Caricature"
AFR_no_seats_for_caricature_desc: "Set the Bestiary rule: impossible nonhuman and supernatural seats must never become masks for human polities."
AFR_first_nonhuman_envoys: "First Nonhuman Envoys"
AFR_first_nonhuman_envoys_desc: "Allow Bestiary envoys only after the historical Archive has enough weight to keep categories separate."
AFR_habitat_trust_board: "Habitat Trust Board"
AFR_habitat_trust_board_desc: "Bind Bestiary seats to habitat, rivers, coasts, forests, and negotiated limits."
AFR_omen_reliability_office: "Omen Reliability Office"
AFR_omen_reliability_office_desc: "Separate warnings, tricks, and disasters from forged dossiers."
AFR_treaty_of_teeth_and_roots: "Treaty of Teeth and Roots"
AFR_treaty_of_teeth_and_roots_desc: "Give explicit high-chaos actors a treaty framework before they receive wider authority."
AFR_court_of_thunder_and_tides: "Court of Thunder and Tides"
AFR_court_of_thunder_and_tides_desc: "Recognize storm, river, and coast packages without confusing them with human coastal societies."
AFR_spider_at_the_signature_table: "Spider at the Signature Table"
AFR_spider_at_the_signature_table_desc: "Let the trickster ledger intercept forged claims and expose false paperwork."
AFR_world_root_mandate: "World Root Mandate"
AFR_world_root_mandate_desc: "Record six Bestiary packages and make high chaos accountable to continental law."
AFR_AUTH_charter_seat: "Charter Seat"
AFR_AUTH_charter_seat_desc: "Confirm the authority's place inside the Charter League."
AFR_AUTH_local_council: "Local Council"
AFR_AUTH_local_council_desc: "Give local leaders a visible forum before integration or protectorate talks move forward."
AFR_AUTH_supply_road: "Supply Road"
AFR_AUTH_supply_road_desc: "Repair the first road, port, rail, or caravan route that lets the authority support itself."
AFR_AUTH_defense_column: "Defense Column"
AFR_AUTH_defense_column_desc: "Raise a small column for local security and League reinforcement."
AFR_AUTH_west_sahel_mobility: "Caravan-Motor Columns"
AFR_AUTH_west_sahel_mobility_desc: "West African and Sahel seats turn caravan corridors and motor columns into a shared line of movement."
AFR_AUTH_coastal_rail_links: "Coast and Rail Links"
AFR_AUTH_coastal_rail_links_desc: "Coastal and rail authorities bind ports, trains, and charter shipping into one working supply net."
AFR_AUTH_interior_guard_posts: "Interior Guard Posts"
AFR_AUTH_interior_guard_posts_desc: "Nile-Horn, Great Lakes, and Congo seats anchor internal guard posts for river, lake, and highland routes."
AFR_AUTH_southern_workshops: "Southern Workshops"
AFR_AUTH_southern_workshops_desc: "Southern seats convert stone-city yards, mines, and liberation workshops into local military industry."
AFR_AUTH_protectorate_line: "Protectorate Line"
AFR_AUTH_protectorate_line_desc: "Keep the seat protected while preserving local political room."
AFR_AUTH_integration_line: "Integration Line"
AFR_AUTH_integration_line_desc: "Prepare the seat for deeper Charter integration."
AFR_AUTH_league_reinforcement: "League Reinforcement"
AFR_AUTH_league_reinforcement_desc: "Make the authority useful in Charter wars instead of a passive map color."
AFR_AUTH_charter_future: "Charter Future"
AFR_AUTH_charter_future_desc: "Settle whether this authority moves toward federation, protectorate status, or later integration."
AFR_AUTH_wac_port_union: "West African Congress Port Union"
AFR_AUTH_wac_port_union_desc: "Bind West African Congress ports, railheads, and inland seats to the Charter economy."
AFR_AUTH_sah_oasis_routes: "Sahel Caravan Oasis Routes"
AFR_AUTH_sah_oasis_routes_desc: "Turn Sahel Caravan wells, depots, and truck paths into a mobile reinforcement line."
AFR_AUTH_mag_harbor_compact: "Maghreb Coast Harbor Compact"
AFR_AUTH_mag_harbor_compact_desc: "Use Maghreb Coast harbors to keep Charter shipping, patrol craft, and dock work under one timetable."
AFR_AUTH_nhr_highland_survey: "Nile-Horn League Highland Survey"
AFR_AUTH_nhr_highland_survey_desc: "Survey Nile-Horn League passes and highland seats before the Charter marks them as secure."
AFR_AUTH_eac_railway_board: "East African Railway Congress Rails"
AFR_AUTH_eac_railway_board_desc: "Give the East African Railway Congress trains, workshops, and through-routes that make integration real."
AFR_AUTH_glk_lake_muster: "Great Lakes Council Lake Muster"
AFR_AUTH_glk_lake_muster_desc: "Raise Great Lakes Council local columns around the lakes, roads, and border posts."
AFR_AUTH_cbc_river_quartermasters: "Congo Basin Charter Quartermasters"
AFR_AUTH_cbc_river_quartermasters_desc: "Put Congo Basin Charter depots on the river network so local defense has supplies before orders arrive."
AFR_AUTH_zsc_stone_city_yards: "Zambezi-Stone Cities Yards"
AFR_AUTH_zsc_stone_city_yards_desc: "Convert Zambezi-Stone Cities yards, foundries, and old-seat claims into usable industry."
AFR_AUTH_slc_mine_port_liberation: "South African Liberation Congress Mine-Ports"
AFR_AUTH_slc_mine_port_liberation_desc: "Tie South African Liberation Congress mines, ports, and workshops to the continental liberation line."
AFR_AUTH_ioc_monsoon_passages: "Indian Ocean Congress Monsoon Passages"
AFR_AUTH_ioc_monsoon_passages_desc: "Use Indian Ocean Congress harbors and island routes to move convoys through the monsoon lanes."
AFR_BEST_bestiary_seat: "Bestiary Seat"
AFR_BEST_bestiary_seat_desc: "Confirm this explicit high-chaos actor under the Charter's Bestiary Clause."
AFR_BEST_habitat_terms: "Habitat Terms"
AFR_BEST_habitat_terms_desc: "Mark the land, river, coast, or forest conditions that make the seat legible to the League."
AFR_BEST_charter_limits: "Charter Limits"
AFR_BEST_charter_limits_desc: "Negotiate what the Bestiary seat can demand, defend, and refuse."
AFR_BEST_warning_network: "Warning Network"
AFR_BEST_warning_network_desc: "Turn the strange seat into an early-warning and sabotage network."
AFR_BEST_forest_covenant: "Forest Covenant"
AFR_BEST_forest_covenant_desc: "Forest, court, citadel, guide, herd, and covenant seats secure habitat rules outside ordinary provincial law."
AFR_BEST_river_tide_compacts: "River-Tide Compacts"
AFR_BEST_river_tide_compacts_desc: "River and coast actors bind ferries, tides, and littoral warnings to Charter defense."
AFR_BEST_ananse_signal_lines: "Ananse Signal Lines"
AFR_BEST_ananse_signal_lines_desc: "The web seat turns forged charters, warning knots, and messenger lines into a counter-intelligence net."
AFR_BEST_mutual_defense: "Mutual Defense"
AFR_BEST_mutual_defense_desc: "Bind the actor to Charter defense through Bestiary limits, separate liaison posts, and guarded obligations."
AFR_BEST_world_witness: "World Witness"
AFR_BEST_world_witness_desc: "Record the seat as evidence that high chaos has entered continental law."
AFR_BEST_ghp_sanctuary_watch: "Gorilla Highlands Sanctuary Watch"
AFR_BEST_ghp_sanctuary_watch_desc: "Keep Gorilla Highlands sanctuaries defended while the Charter learns where ordinary law must stop."
AFR_BEST_bbs_memory_speakers: "Baobab Senate Memory Speakers"
AFR_BEST_bbs_memory_speakers_desc: "Let the Baobab Senate answer old-seat disputes with memory testimony instead of forged papers."
AFR_BEST_tdm_tidemark_harbors: "Tidemark Dominion Harbors"
AFR_BEST_tdm_tidemark_harbors_desc: "Turn the Tidemark Dominion's warning tides and harbors into a Charter coastal watch."
AFR_BEST_anw_counterfeit_threads: "Ananse Web Counterfeit Threads"
AFR_BEST_anw_counterfeit_threads_desc: "Let Ananse Web trace counterfeit charters, false signatures, and treaty traps before they reach the table."
AFR_BEST_ovn_omen_groves: "Orisha-Vodun Nature Courts Omen Groves"
AFR_BEST_ovn_omen_groves_desc: "Bind Orisha-Vodun Nature Courts omen groves to habitat rules that can be checked and refused."
AFR_BEST_crr_ferry_toll_law: "Crocodile Rivers Ferry Toll Law"
AFR_BEST_crr_ferry_toll_law_desc: "Make Crocodile Rivers ferry tolls, crossings, and warnings legible to Charter quartermasters."
AFR_BEST_ctl_canopy_relays: "Chimpanzee Telegraph League Canopy Relays"
AFR_BEST_ctl_canopy_relays_desc: "Use Chimpanzee Telegraph League relays as a nonhuman warning chain across canopy routes."
AFR_BEST_okp_shadow_paths: "Okapi Court Shadow Paths"
AFR_BEST_okp_shadow_paths_desc: "Let the Okapi Court secure hidden paths without turning forest sovereignty into a human office."
AFR_BEST_trm_citadel_surveyors: "Termite Citadel Engineers Surveyors"
AFR_BEST_trm_citadel_surveyors_desc: "Send Termite Citadel Engineers surveyors through mound roads, depots, and fragile soil before the Charter builds."
AFR_BEST_hgd_route_hives: "Honeyguide Commons Route Hives"
AFR_BEST_hgd_route_hives_desc: "Tie Honeyguide Commons route hives to aid paths, convoys, and warnings that humans can follow."
AFR_BEST_ghc_migration_corridors: "Great Herds Migration Corridors"
AFR_BEST_ghc_migration_corridors_desc: "Recognize Great Herds corridors as defended movement routes, not vacant land."

