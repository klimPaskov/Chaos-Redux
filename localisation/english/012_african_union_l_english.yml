africa_unity_federal_union: "The Charter Federation"
africa_unity_federal_union_desc: "Member governments share continental institutions through balanced representation and enforceable withdrawal clauses. The federal bargain strengthens political coordination and legitimacy, but maintaining equal institutions carries a visible civilian cost."
africa_unity_continental_republic: "The Continental Republic"
africa_unity_continental_republic_desc: "A continental electorate and public administration turn representation into executive legitimacy. Elections, research, and civic stability reinforce one another without erasing the member governments beneath the republic."
africa_unity_council_of_crowns: "The Council of Crowns"
africa_unity_council_of_crowns_desc: "Recognised crowns and restored institutions arbitrate succession through a continental council. Dynastic continuity strengthens internal stability and foreign trade, while the negotiated executive moves more deliberately."
africa_unity_peoples_union: "The People's Union"
africa_unity_peoples_union_desc: "Mass congresses direct continental resources toward food, housing, and industry. The common plan frees civilian capacity and expands production, but its demanding assemblies slow the central political calendar."
africa_unity_continental_command: "The Continental Command"
africa_unity_continental_command_desc: "A common command unifies defence planning and wartime mobilisation under a reviewed emergency constitution. Military readiness is formidable, but command integration imposes civilian costs and tests constitutional stability."
africa_unity_continental_confederation: "The African Confederation"
africa_unity_continental_confederation_desc: "Sovereign member governments coordinate trade, infrastructure, and crisis policy while retaining strong withdrawal protections. Regional initiative accelerates construction and exchange, but the common executive remains intentionally limited."
africa_unity_ancestral_covenant: "The Continental Covenant"
africa_unity_ancestral_covenant_desc: "Human governments bind ecological obligations, local custodianship, and high-chaos containment into one constitutional covenant. Resilient construction and supply networks reward consent without turning African identities into supernatural caricatures."

africa_continental_settlement_all_states_tt: "Every African state must be owned and controlled under the constitutional settlement: as a direct host core or locally completed settlement, an accepted federal or integrated member, a recognised confederal member, an allied restored polity, or a temporary peace exemption with a live completion mission. Enemy occupation, unresolved civil war, withdrawal, resistance, and rival blocs do not qualify."
africa_continental_milestone_effect_tt: "Africa adopts its route-specific public identity and constitutional spirit while member countries retain their accepted autonomy. The continental milestone is recorded, early settlement work closes, and the foreign Scramble response begins after a short public interval."
mission_africa_complete_continental_peace_exemption: "Complete the Peace Settlement with [FROM.GetNameDef]"
mission_africa_complete_continental_peace_exemption_desc: "[FROM.GetNameDefCap] accepted a temporary congress exemption for the selected states. Before the term expires, its government must enter a recognised federal, confederal, or allied-restored settlement. Losing control, reopening war, entering civil war, withdrawing, or joining a rival bloc breaks the accord."
chaosx.nr12.308.t: "Africa Is One"
chaosx.nr12.308.d: "The continental congress has certified every African state under one of the Charter's constitutional settlements. The result is neither a sudden annexation nor a map of indiscriminate cores: federal regions, confederal governments, restored polities, and direct institutions retain the rights their delegates accepted. Foreign chancelleries must decide whether to recognise the settlement or answer it with sanctions, ultimatums, and expedition plans."
chaosx.nr12.308.a: "The settlement enters the world record."
chaosx.nr12.309.t: "The Scramble Answers"
chaosx.nr12.309.d: "Letters from abroad arrive in every mood, carrying recognition offers, sanctions threats, military warnings, and demands for bases or privileged contracts. The Charter councils must decide which governments can be trusted, which can be bargained with, and which are preparing to attack the continental settlement."
chaosx.nr12.309.a: "Let's see what the outside world wants."
chaosx.nr12.309.a.tt: "The §YScramble§! action family and a bounded roster of external governments become available. World-order actions remain locked until every other continent has its own unique settlement package."
