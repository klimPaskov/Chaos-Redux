africa_charter_council_category_desc: "Select one bounded target, open a council, inspect a quoted commitment, and launch no more work than the Charter can administer.\n\nConstitutional rules — Representation: §Y[?africa_constitutional_representation|0]§!, Executive power: §Y[?africa_constitutional_executive_power|0]§!, Resource governance: §Y[?africa_constitutional_resource_governance|0]§!, Common command: §Y[?africa_constitutional_command_integration|0]§!, Withdrawal protection: §Y[?africa_constitutional_withdrawal_protection|0]§!, Crisis resilience: §Y[?africa_constitutional_crisis_resilience|0]§!, Post-unification rule: §Y[?africa_constitutional_post_unification_rule|0]§!. These values alter quoted costs and outcome risk for the corresponding Charter actions."
