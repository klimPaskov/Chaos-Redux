africa_action_name_guarantee_sovereignty: "Guarantee Sovereignty"
africa_select_guarantee_sovereignty: "Guarantee Sovereignty"
africa_select_guarantee_sovereignty_desc: "Requirements: shared border or access, target not hostile, capacity available. Commitment: command attention plus infantry equipment and diplomatic exposure scaled by target size. Full result: target becomes protected partner and gains confidence. Partial result: limited guarantee with lower confidence when access is weak. Failure: authority loss if guarantee is later broken. The operation closes when remove if target annexed, joins hostile bloc, or guarantee converted to membership."
africa_action_name_open_aid_corridor: "Open Aid Corridor"
africa_select_open_aid_corridor: "Open Aid Corridor"
africa_select_open_aid_corridor_desc: "Requirements: route access, convoy or train capacity, equipment stockpile. Commitment: convoys or trains plus equipment and temporary civilian capacity scaled by distance. Full result: supply and confidence improve, corridor becomes active. Partial result: reduced aid arrives with attrition and smaller confidence gain. Failure: equipment lost, authority falls, corridor exposure rises. The operation closes when close on peace, route loss, target defeat, or manual cancellation."
africa_action_name_dispatch_charter_mission: "Dispatch Charter Mission"
africa_select_dispatch_charter_mission: "Dispatch Charter Mission"
africa_select_dispatch_charter_mission_desc: "Requirements: diplomatic staff, political attention, transport, local security. Commitment: political power plus support equipment and local access scaled by hostility. Full result: reveals accession preferences and raises confidence. Partial result: reveals only some clauses and creates local opposition. Failure: mission expelled, confidence falls, rival influence rises. The operation closes when clear mission flags and selected envoys on completion or invalid target."
africa_action_name_deploy_volunteers: "Deploy Volunteers"
africa_select_deploy_volunteers: "Deploy Volunteers"
africa_select_deploy_volunteers_desc: "Requirements: volunteer access, units available, target accepts help. Commitment: trained divisions, equipment, command power, supply burden. Full result: target survives, confidence rises, League invitation unlocks. Partial result: front stabilises without decisive victory. Failure: volunteers destroyed or target capitulates, authority loss. The operation closes when return units, clear access, and close mission after war or target invalidation."
africa_action_name_intervene_against_coloniser: "Intervene Against Coloniser"
africa_select_intervene_against_coloniser: "Intervene Against Coloniser"
africa_select_intervene_against_coloniser_desc: "Requirements: authority threshold, readiness threshold, and valid war access. Commitment: equipment, fuel, trains, manpower, diplomatic cost. Full result: war or forced settlement begins with target protected. Partial result: limited intervention through volunteers and sanctions. Failure: unprepared escalation lowers authority and raises burden. The operation closes when clear preparation if peace, target destroyed, or war already begins elsewhere."
africa_action_name_evacuate_leaders_archives: "Evacuate Leaders Archives"
africa_select_evacuate_leaders_archives: "Evacuate Leaders Archives"
africa_select_evacuate_leaders_archives_desc: "Requirements: route exists and leaders consent. Commitment: air transport or convoys, intelligence capacity, command power. Full result: government in exile, leaders, archives, and legitimacy preserved. Partial result: partial evacuation preserves either leaders or archives. Failure: route closes and confidence collapses. The operation closes when remove rescue targets, return transports, create exile state if successful."
africa_action_name_recognise_provisional_government: "Recognise Provisional Government"
africa_select_recognise_provisional_government: "Recognise Provisional Government"
africa_select_recognise_provisional_government_desc: "Requirements: diplomatic credibility, relations cost with colonial holder. Commitment: political power plus equipment or funds scaled by legitimacy. Full result: movement gains legitimacy and League access. Partial result: symbolic recognition without material aid. Failure: false partner scandal lowers authority. The operation closes when clear when government becomes state, collapses, or joins rival bloc."
africa_action_name_secure_border_sanctuary: "Secure Border Sanctuary"
africa_select_secure_border_sanctuary: "Secure Border Sanctuary"
africa_select_secure_border_sanctuary_desc: "Requirements: garrison divisions, supply, local support. Commitment: infantry equipment, trains, tied divisions, stability risk. Full result: movement gains safe base and recruitment. Partial result: base remains hidden but weak. Failure: foreign raid or local backlash damages host. The operation closes when remove sanctuary after independence, exposure, or target destruction."
africa_action_name_break_blockade: "Break Blockade"
africa_select_break_blockade: "Break Blockade"
africa_select_break_blockade_desc: "Requirements: naval access, fuel, convoys, aircraft or ships. Commitment: fuel, convoys, naval or air XP, repair risk. Full result: port corridor opens and confidence rises. Partial result: limited deliveries pass. Failure: ships or aircraft lost, colonial pressure rises. The operation closes when close if blockade ends, port lost, or member leaves."
africa_action_name_emergency_relief_column: "Emergency Relief Column"
africa_select_emergency_relief_column: "Emergency Relief Column"
africa_select_emergency_relief_column_desc: "Requirements: route access and relief stockpile. Commitment: trucks, trains, support equipment, manpower, civilian factories. Full result: deaths and local damage fall, confidence rises. Partial result: some relief reaches target. Failure: relief fails or spreads disease, trust falls. The operation closes when clear relief teams and temporary access on completion."
africa_action_name_offer_defence_charter: "Offer Defence Charter"
africa_select_offer_defence_charter: "Offer Defence Charter"
africa_select_offer_defence_charter_desc: "Requirements: defence commitment and common reserve capacity. Commitment: equipment pledge, command capacity, future defence obligation. Full result: target becomes associate or chartered member. Partial result: target accepts only guarantee and observers. Failure: target refuses and may seek rival patron. The operation closes when clear offer flags after response."
africa_action_name_offer_development_charter: "Offer Development Charter"
africa_select_offer_development_charter: "Offer Development Charter"
africa_select_offer_development_charter_desc: "Requirements: project capacity and target consent. Commitment: civilian factories, trains, convoys, engineers. Full result: target joins with development clauses. Partial result: target accepts bilateral project only. Failure: project scandal or debt concern lowers trust. The operation closes when convert to project chain or clear on refusal."
africa_action_name_offer_federal_charter: "Offer Federal Charter"
africa_select_offer_federal_charter: "Offer Federal Charter"
africa_select_offer_federal_charter_desc: "Requirements: constitutional capacity and regional congress support. Commitment: authority commitment, seats, autonomy guarantees, integration capacity. Full result: target becomes autonomous federal member. Partial result: target requests extra autonomy and delay. Failure: target refuses and confidence falls. The operation closes when clear draft and lock duplicate offers after settlement."
africa_action_name_offer_crown_charter: "Offer Crown Charter"
africa_select_offer_crown_charter: "Offer Crown Charter"
africa_select_offer_crown_charter_desc: "Requirements: recognised ruler, succession rules, representation. Commitment: court recognition, ceremonial costs, guard commitment. Full result: monarchy joins with preserved crown. Partial result: joins as associate pending succession settlement. Failure: dynastic dispute creates rival claimant. The operation closes when clear claimant flags after settlement or civil conflict."
africa_action_name_offer_peoples_charter: "Offer Peoples Charter"
africa_select_offer_peoples_charter: "Offer Peoples Charter"
africa_select_offer_peoples_charter_desc: "Requirements: worker, peasant, or party congress support. Commitment: equipment aid, organisers, factory burden, ideological exposure. Full result: target joins people’s union structure. Partial result: coalition joins with autonomy protections. Failure: internal opposition starts crisis. The operation closes when remove temporary organisers and resolve opposition flags."
africa_action_name_offer_security_charter: "Offer Security Charter"
africa_select_offer_security_charter: "Offer Security Charter"
africa_select_offer_security_charter_desc: "Requirements: common command access and host readiness. Commitment: officer teams, equipment, tied divisions, legitimacy cost. Full result: target joins under security obligations. Partial result: temporary command mission only. Failure: accusations of occupation damage confidence. The operation closes when end command mission when crisis resolves or member leaves."
africa_action_name_offer_sacred_ecological_compact: "Offer Sacred Ecological Compact"
africa_select_offer_sacred_ecological_compact: "Offer Sacred Ecological Compact"
africa_select_offer_sacred_ecological_compact_desc: "Requirements: ritual or ecological bargain capacity. Commitment: ecological concessions, restricted development, offerings or relief work. Full result: actor joins or cooperates under special clauses. Partial result: temporary truce or disaster restraint. Failure: wrath rises and actor becomes hostile. The operation closes when clear bargain on betrayal, route closure, or actor destruction."
africa_action_name_renegotiate_accession_clauses: "Renegotiate Accession Clauses"
africa_select_renegotiate_accession_clauses: "Renegotiate Accession Clauses"
africa_select_renegotiate_accession_clauses_desc: "Requirements: representation capacity and no active secession war. Commitment: political attention plus concessions selected by route. Full result: confidence recovers and obligations update. Partial result: temporary freeze on departure. Failure: talks fail and departure mission starts. The operation closes when replace old clauses and clear negotiation flags."
africa_action_name_hold_accession_referendum: "Hold Accession Referendum"
africa_select_hold_accession_referendum: "Hold Accession Referendum"
africa_select_hold_accession_referendum_desc: "Requirements: local institutions function with security, ballot administration, and free access. Commitment: civilian capacity, security units, political risk. Full result: result determines membership with legitimacy bonus. Partial result: narrow or disputed result delays settlement. Failure: violence or fraud causes confidence and authority loss. The operation closes when clear campaign flags and lock repeat vote unless major constitutional change."
africa_action_name_admit_member_in_emergency: "Admit Member In Emergency"
africa_select_admit_member_in_emergency: "Admit Member In Emergency"
africa_select_admit_member_in_emergency_desc: "Requirements: minimum confidence and contact exists. Commitment: equipment, guarantee, emergency authority, burden spike. Full result: target becomes emergency member and receives defence. Partial result: protected partner status only. Failure: emergency accession becomes dependency scandal. The operation closes when start mandatory postwar constitutional review."
africa_action_name_convene_regional_congress: "Convene Regional Congress"
africa_select_convene_regional_congress: "Convene Regional Congress"
africa_select_convene_regional_congress_desc: "Requirements: authority threshold, safe venue, delegate access. Commitment: political power, trains or convoys, security, civilian capacity. Full result: congress opens with proposal choices. Partial result: limited conference handles only one dispute. Failure: boycott lowers authority and empowers rival bloc. The operation closes when close congress UI and clear delegates after outcome."
africa_action_name_settle_overlapping_claims: "Settle Overlapping Claims"
africa_select_settle_overlapping_claims: "Settle Overlapping Claims"
africa_select_settle_overlapping_claims_desc: "Requirements: mediation, maps, local consultation, enforcement capacity. Commitment: political attention, survey teams, security, possible compensation. Full result: border or federal settlement accepted. Partial result: temporary condominium or autonomy zone. Failure: one claimant leaves or fights. The operation closes when apply final state groups and clear obsolete claims."
africa_action_name_create_regional_charter: "Create Regional Charter"
africa_select_create_regional_charter: "Create Regional Charter"
africa_select_create_regional_charter_desc: "Requirements: minimum members and administrative readiness. Commitment: representation seats, bureaucracy, development commitment. Full result: regional charter government created. Partial result: loose council created with limited powers. Failure: charter collapses into rival blocs. The operation closes when replace provisional congress flags with regional government."
africa_action_name_form_regional_federation: "Form Regional Federation"
africa_select_form_regional_federation: "Form Regional Federation"
africa_select_form_regional_federation_desc: "Requirements: federal constitution and integration capacity. Commitment: administrative manpower, equipment for common security, civilian factories. Full result: federated region created with autonomy. Partial result: partial federation excludes dissenters. Failure: civil conflict or departure crisis. The operation closes when integrate members, preserve opt-outs, clear congress missions."
africa_action_name_restore_historical_polity: "Restore Historical Polity"
africa_select_restore_historical_polity: "Restore Historical Polity"
africa_select_restore_historical_polity_desc: "Requirements: candidate source review and viable territory. Commitment: administrative capacity, guard force, symbolic and economic costs. Full result: restored polity becomes member or autonomous subject. Partial result: symbolic cultural authority without sovereignty. Failure: rival claim or legitimacy crisis. The operation closes when create package once, clear incompatible restoration decisions."
africa_action_name_approve_direct_integration_schedule: "Approve Direct Integration Schedule"
africa_select_approve_direct_integration_schedule: "Approve Direct Integration Schedule"
africa_select_approve_direct_integration_schedule_desc: "Requirements: administrative capacity, representation, local security. Commitment: bureaucracy, equipment, civilian capacity, integration burden. Full result: staged integration begins. Partial result: autonomous federal status extends. Failure: resistance rises and schedule pauses. The operation closes when convert to integration projects and clear congress state."
africa_action_name_guarantee_regional_representation: "Guarantee Regional Representation"
africa_select_guarantee_regional_representation: "Guarantee Regional Representation"
africa_select_guarantee_regional_representation_desc: "Requirements: available seats and constitutional route. Commitment: political concession and limits on central appointments. Full result: confidence rises and secession risk falls. Partial result: temporary observer seats. Failure: other regions demand equal treatment. The operation closes when update seat allocation and clear demand flags."
africa_action_name_fund_congress_security: "Fund Congress Security"
africa_select_fund_congress_security: "Fund Congress Security"
africa_select_fund_congress_security_desc: "Requirements: security units and local consent. Commitment: support equipment, tied divisions, intelligence exposure. Full result: congress continues safely. Partial result: minor incidents delay votes. Failure: crackdown scandal or attack ends congress. The operation closes when release units and remove security modifier after congress."
africa_action_name_invite_diaspora_delegates: "Invite Diaspora Delegates"
africa_select_invite_diaspora_delegates: "Invite Diaspora Delegates"
africa_select_invite_diaspora_delegates_desc: "Requirements: delegate representation rules. Commitment: convoys, travel funds, security, political controversy. Full result: diaspora trust and expertise improve proposals. Partial result: observer role only. Failure: delegates excluded or attacked, trust falls. The operation closes when clear delegate flags after congress."
africa_action_name_enforce_congress_settlement: "Enforce Congress Settlement"
africa_select_enforce_congress_settlement: "Enforce Congress Settlement"
africa_select_enforce_congress_settlement_desc: "Requirements: enforcement capacity and route permission. Commitment: sanctions, equipment, tied forces, authority risk. Full result: compliance restored. Partial result: partial compliance and renewed talks. Failure: war or rival bloc expansion. The operation closes when end enforcement after compliance, war, or settlement replacement."
africa_action_name_build_administrative_bridge: "Build Administrative Bridge"
africa_select_build_administrative_bridge: "Build Administrative Bridge"
africa_select_build_administrative_bridge_desc: "Requirements: local officials, language support, representation. Commitment: administrative manpower, civilian factories, support equipment. Full result: administration compatibility improves. Partial result: limited offices open with delay. Failure: corruption or boycott increases burden. The operation closes when remove project modifiers and advance integration stage."
africa_action_name_connect_member_capitals: "Connect Member Capitals"
africa_select_connect_member_capitals: "Connect Member Capitals"
africa_select_connect_member_capitals_desc: "Requirements: rail, road, river, air, or sea link possible. Commitment: trains, convoys, civilian factories, fuel, local labour. Full result: reach rises and integration costs fall. Partial result: partial link improves supply only. Failure: project stalls, burden and local frustration rise. The operation closes when complete or cancel construction and release capacity."
africa_action_name_standardise_customs: "Standardise Customs"
africa_select_standardise_customs: "Standardise Customs"
africa_select_standardise_customs_desc: "Requirements: member consent and administrative capacity. Commitment: short-term revenue loss, political effort, inspection staff. Full result: trade improves and regional market opens. Partial result: limited customs corridor. Failure: smuggling and elite resistance rise. The operation closes when replace bilateral customs flags with common system."
africa_action_name_integrate_security_services: "Integrate Security Services"
africa_select_integrate_security_services: "Integrate Security Services"
africa_select_integrate_security_services_desc: "Requirements: shared intelligence rules and oversight. Commitment: intelligence capacity, equipment, legitimacy risk. Full result: counter-subversion improves and rival pressure falls. Partial result: liaison office only. Failure: abuse scandal lowers confidence. The operation closes when remove temporary agents and preserve route-specific oversight."
africa_action_name_harmonise_officer_corps: "Harmonise Officer Corps"
africa_select_harmonise_officer_corps: "Harmonise Officer Corps"
africa_select_harmonise_officer_corps_desc: "Requirements: training access, language teams, doctrine compatibility. Commitment: army XP, equipment, training time, command slots. Full result: joint command and templates improve. Partial result: shared exercises only. Failure: officer resistance or coup pressure. The operation closes when apply final officer integration and clear training mission."
africa_action_name_negotiate_autonomy_statute: "Negotiate Autonomy Statute"
africa_select_negotiate_autonomy_statute: "Negotiate Autonomy Statute"
africa_select_negotiate_autonomy_statute_desc: "Requirements: representation, fiscal terms, security clauses. Commitment: political concession and reduced central revenue. Full result: member becomes stable autonomous federal member. Partial result: temporary autonomy delays departure. Failure: talks fail and rival bloc gains support. The operation closes when record statute and hide incompatible integration actions."
africa_action_name_launch_local_settlement_programme: "Launch Local Settlement Programme"
africa_select_launch_local_settlement_programme: "Launch Local Settlement Programme"
africa_select_launch_local_settlement_programme_desc: "Requirements: local consultation and security. Commitment: civilian factories, administrative manpower, compensation. Full result: local support improves and resistance falls. Partial result: one district settles while others remain disputed. Failure: forced settlement raises resistance. The operation closes when clear district targets when settled or abandoned."
africa_action_name_grant_core_recognition: "Grant Core Recognition"
africa_select_grant_core_recognition: "Grant Core Recognition"
africa_select_grant_core_recognition_desc: "Requirements: stable control, low resistance, representation, route condition. Commitment: administrative commitment and permanent constitutional obligation. Full result: claims become cores or equivalent integrated status. Partial result: limited core group while disputed areas remain claims. Failure: premature grant causes rebellion or overextension. The operation closes when remove obsolete integration decisions and retain minority protections."
africa_action_name_impose_emergency_administration: "Impose Emergency Administration"
africa_select_impose_emergency_administration: "Impose Emergency Administration"
africa_select_impose_emergency_administration_desc: "Requirements: military access and central authority. Commitment: tied divisions, equipment, stability, legitimacy, colonial pressure. Full result: order restored and review mission starts. Partial result: capital secured but countryside resists. Failure: occupation war and mass departure. The operation closes when mandatory sunset, review, or conversion to occupation state."
africa_action_name_federalise_restored_polities: "Federalise Restored Polities"
africa_select_federalise_restored_polities: "Federalise Restored Polities"
africa_select_federalise_restored_polities_desc: "Requirements: member consent and shared institutions. Commitment: representation seats, administrative capacity, treasury contribution. Full result: restored states form durable federal chamber. Partial result: consultative chamber only. Failure: dynastic rivalry breaks federation. The operation closes when create chamber and clear duplicate court negotiations."
africa_action_name_survey_continental_resources: "Survey Continental Resources"
africa_select_survey_continental_resources: "Survey Continental Resources"
africa_select_survey_continental_resources_desc: "Requirements: engineers, geological teams, security. Commitment: civilian factories, trucks, fuel, survey equipment. Full result: resource projects and processing routes unlock. Partial result: partial survey reveals one project. Failure: teams expelled or lost. The operation closes when clear survey teams and store discovered projects."
africa_action_name_build_regional_rail_spine: "Build Regional Rail Spine"
africa_select_build_regional_rail_spine: "Build Regional Rail Spine"
africa_select_build_regional_rail_spine_desc: "Requirements: route survey, supply need, construction access. Commitment: civilian factories, trains, steel, local labour. Full result: rail, supply, reach, and confidence improve. Partial result: partial line opens. Failure: cost overrun and local opposition. The operation closes when release construction capacity and register completed corridor."
africa_action_name_expand_river_transport: "Expand River Transport"
africa_select_expand_river_transport: "Expand River Transport"
africa_select_expand_river_transport_desc: "Requirements: boats, docks, local agreements. Commitment: convoys, civilian factories, fuel, engineering. Full result: river supply and trade network opens. Partial result: seasonal route only. Failure: flood, sabotage, or local refusal. The operation closes when close temporary works and preserve ecological clauses."
africa_action_name_modernise_continental_port: "Modernise Continental Port"
africa_select_modernise_continental_port: "Modernise Continental Port"
africa_select_modernise_continental_port_desc: "Requirements: dock capacity and local consent. Commitment: civilian factories, convoys, steel, coastal security. Full result: port capacity, navy, trade, and diaspora access improve. Partial result: commercial expansion without military facilities. Failure: foreign sabotage or debt crisis. The operation closes when complete port tier and clear project flags."
africa_action_name_create_local_processing_chain: "Create Local Processing Chain"
africa_select_create_local_processing_chain: "Create Local Processing Chain"
africa_select_create_local_processing_chain_desc: "Requirements: energy, labour, transport, member consent. Commitment: civilian and military factories, machine tools, temporary output loss. Full result: local value-added industry and confidence rise. Partial result: small processing plant only. Failure: elite capture or shortage increases burden. The operation closes when replace raw-export modifier and close duplicate project."
africa_action_name_continental_procurement_contract: "Continental Procurement Contract"
africa_select_continental_procurement_contract: "Continental Procurement Contract"
africa_select_continental_procurement_contract_desc: "Requirements: standard specifications and payment system. Commitment: treasury, civilian capacity, transport. Full result: equipment production and member industry improve. Partial result: limited contract for one equipment class. Failure: corruption scandal and delivery failure. The operation closes when end contract on route change or renew through later tier."
africa_action_name_food_security_reserve: "Food Security Reserve"
africa_select_food_security_reserve: "Food Security Reserve"
africa_select_food_security_reserve_desc: "Requirements: storage, transport, purchase agreements. Commitment: civilian factories, trains, convoys, political price. Full result: famine resilience and relief capacity improve. Partial result: regional reserve only. Failure: spoilage or seizure damages trust. The operation closes when consume reserve during crisis and rebuild after use."
africa_action_name_resource_sovereignty_review: "Resource Sovereignty Review"
africa_select_resource_sovereignty_review: "Resource Sovereignty Review"
africa_select_resource_sovereignty_review_desc: "Requirements: member support, investment alternatives. Commitment: political capital, compensation, possible sanctions. Full result: contracts renegotiated or nationalised with local benefit. Partial result: mixed ownership settlement. Failure: capital flight, sanctions, or sabotage. The operation closes when replace concession flags and start dispute cooldown."
africa_action_name_charter_development_fund: "Charter Development Fund"
africa_select_charter_development_fund: "Charter Development Fund"
africa_select_charter_development_fund_desc: "Requirements: transparent rules and a credible project pipeline. Commitment: civilian factories, treasury share, member contributions. Full result: projects become cheaper and confidence rises. Partial result: fund remains small and regional. Failure: fraud or unequal distribution creates rival pressure. The operation closes when annual review, suspend during collapse, close if League dissolves."
africa_action_name_continental_industrial_plan: "Continental Industrial Plan"
africa_select_continental_industrial_plan: "Continental Industrial Plan"
africa_select_continental_industrial_plan_desc: "Requirements: resource, labour, energy, and transport balance. Commitment: large staged civilian capacity and regional contributions. Full result: major distributed industrial growth and route payoff. Partial result: one or two regional plans complete. Failure: overcentralisation creates shortage and secession pressure. The operation closes when complete regional phases, release capacity, retain maintenance decisions."
africa_action_name_open_voluntary_return_registry: "Open Voluntary Return Registry"
africa_select_open_voluntary_return_registry: "Open Voluntary Return Registry"
africa_select_open_voluntary_return_registry_desc: "Requirements: safe ports, consular access, voluntary pledge. Commitment: political power, administrative staff, travel fund. Full result: applications and trust begin. Partial result: limited technical mission registry. Failure: fraud or coercion damages trust. The operation closes when close or pause when safety or consent standards fail."
africa_action_name_charter_passage_programme: "Charter Passage Programme"
africa_select_charter_passage_programme: "Charter Passage Programme"
africa_select_charter_passage_programme_desc: "Requirements: ships, convoys, rail, screening and medical support. Commitment: convoys, fuel, civilian factories, escorts. Full result: safe arrivals increase population, skills, and trust. Partial result: reduced group arrives. Failure: transport disaster or detention scandal. The operation closes when clear passenger pools and release transport after arrival."
africa_action_name_build_returnee_housing: "Build Returnee Housing"
africa_select_build_returnee_housing: "Build Returnee Housing"
africa_select_build_returnee_housing_desc: "Requirements: land, utilities, anti-discrimination safeguards. Commitment: civilian factories, steel, local labour. Full result: housing capacity and trust rise. Partial result: temporary housing only. Failure: segregation, eviction, or shortage lowers trust. The operation closes when convert temporary camps and end project on completion."
africa_action_name_invite_afro_american_technical_mission: "Invite Afro American Technical Mission"
africa_select_invite_afro_american_technical_mission: "Invite Afro American Technical Mission"
africa_select_invite_afro_american_technical_mission_desc: "Requirements: visas, transport, host institutions. Commitment: convoys or air transport, funding, political exposure. Full result: engineers, doctors, teachers, organisers, or officers contribute. Partial result: small advisory team arrives. Failure: hostile interference or discrimination scandal. The operation closes when end mission, retain trained institutions, clear foreign access."
africa_action_name_veterans_and_volunteers_programme: "Veterans and Volunteers Programme"
africa_select_veterans_and_volunteers_programme: "Veterans and Volunteers Programme"
africa_select_veterans_and_volunteers_programme_desc: "Requirements: screening, training, citizenship, equipment. Commitment: manpower, equipment, training time, transport. Full result: special volunteer formations and officer experience. Partial result: training cadres only. Failure: political backlash or mutiny risk. The operation closes when assign units once, prevent repeat farming, discharge or integrate later."
africa_action_name_diaspora_investment_bonds: "Diaspora Investment Bonds"
africa_select_diaspora_investment_bonds: "Diaspora Investment Bonds"
africa_select_diaspora_investment_bonds_desc: "Requirements: stable currency or guarantees. Commitment: consumer-goods burden, repayment obligation, administration. Full result: corridor or industry projects gain funding and trust. Partial result: limited subscription. Failure: default or corruption damages trust. The operation closes when mature bonds, repay, refinance, or default with consequences."
africa_action_name_citizenship_and_representation_convention: "Citizenship and Representation Convention"
africa_select_citizenship_and_representation_convention: "Citizenship and Representation Convention"
africa_select_citizenship_and_representation_convention_desc: "Requirements: member and diaspora delegates. Commitment: political concession, administrative effort, possible opposition. Full result: citizenship rights and representation stabilise trust. Partial result: limited residency rights. Failure: exclusion or unequal law creates radical opposition. The operation closes when apply law, clear provisional status, close duplicate reforms."
africa_action_name_diaspora_emergency_evacuation: "Diaspora Emergency Evacuation"
africa_select_diaspora_emergency_evacuation: "Diaspora Emergency Evacuation"
africa_select_diaspora_emergency_evacuation_desc: "Requirements: transport access and receiving capacity. Commitment: convoys, aircraft, escorts, housing, medical staff. Full result: people evacuated and trust rises. Partial result: partial evacuation. Failure: losses or abandonment severely reduce trust. The operation closes when clear manifests and temporary camps after settlement."
africa_action_name_monitor_rival_bloc: "Monitor Rival Bloc"
africa_select_monitor_rival_bloc: "Monitor Rival Bloc"
africa_select_monitor_rival_bloc_desc: "Requirements: intelligence network and access. Commitment: intelligence assets, political exposure, funds. Full result: reveals plans and target members. Partial result: partial network reveals one action. Failure: network exposed and rival confidence rises. The operation closes when clear network on exposure, alliance, or target destruction."
africa_action_name_offer_rival_arbitration: "Offer Rival Arbitration"
africa_select_offer_rival_arbitration: "Offer Rival Arbitration"
africa_select_offer_rival_arbitration_desc: "Requirements: neutral venue and confidence among intermediaries. Commitment: concessions, travel, security, political risk. Full result: settlement or coexistence agreement. Partial result: ceasefire and limited talks. Failure: talks collapse and mobilisation rises. The operation closes when clear negotiation flags and apply treaty cooldown."
africa_action_name_support_rival_member_defection: "Support Rival Member Defection"
africa_select_support_rival_member_defection: "Support Rival Member Defection"
africa_select_support_rival_member_defection_desc: "Requirements: intelligence, aid channel, credible membership offer. Commitment: equipment, funds, intelligence exposure, diplomatic cost. Full result: target defects or becomes neutral. Partial result: target withholds support from rival. Failure: operation exposed and rival gains unity. The operation closes when clear covert network and lock repeated attempts."
africa_action_name_counter_foreign_patronage: "Counter Foreign Patronage"
africa_select_counter_foreign_patronage: "Counter Foreign Patronage"
africa_select_counter_foreign_patronage_desc: "Requirements: alternative aid, evidence, local partners. Commitment: equipment, development funds, intelligence, diplomatic cost. Full result: foreign dependency falls and confidence in Charter rises. Partial result: patronage growth slows. Failure: target becomes client and rival bloc hardens. The operation closes when remove temporary campaign and update patron state."
africa_action_name_prepare_member_exit_terms: "Prepare Member Exit Terms"
africa_select_prepare_member_exit_terms: "Prepare Member Exit Terms"
africa_select_prepare_member_exit_terms_desc: "Requirements: debt, units, borders, citizens, and bases require settlement. Commitment: administrative capacity, concessions, security. Full result: peaceful exit with limited damage. Partial result: extended transition. Failure: border or asset dispute becomes conflict. The operation closes when transfer assets, clear membership, preserve treaty terms."
africa_action_name_suspend_disloyal_member: "Suspend Disloyal Member"
africa_select_suspend_disloyal_member: "Suspend Disloyal Member"
africa_select_suspend_disloyal_member_desc: "Requirements: evidence, votes or military authority. Commitment: authority cost, possible confidence loss across League. Full result: member suspended and compliance mission begins. Partial result: limited sanctions. Failure: collective backlash and rival bloc growth. The operation closes when restore, expel, or convert to war state after review."
africa_action_name_emergency_leadership_vote: "Emergency Leadership Vote"
africa_select_emergency_leadership_vote: "Emergency Leadership Vote"
africa_select_emergency_leadership_vote_desc: "Requirements: charter rules and delegate access. Commitment: political risk, security, concessions. Full result: leadership confirmed or transferred peacefully. Partial result: shared leadership compromise. Failure: vote contested and League splits. The operation closes when apply result, clear challenger flags, start succession cooldown."
africa_action_name_contain_regional_secession_war: "Contain Regional Secession War"
africa_select_contain_regional_secession_war: "Contain Regional Secession War"
africa_select_contain_regional_secession_war_desc: "Requirements: forces, local support, route stance. Commitment: equipment, manpower, trains, stability, authority. Full result: settlement, autonomy, or military victory. Partial result: ceasefire and frozen dispute. Failure: region escapes or war expands. The operation closes when end war missions, apply settlement, clear obsolete member state."
africa_action_name_consult_oracle_network: "Consult Oracle Network"
africa_select_consult_oracle_network: "Consult Oracle Network"
africa_select_consult_oracle_network_desc: "Requirements: trust, tribute or scientific liaison. Commitment: supplies, political credibility, ecological concession. Full result: disaster forecast accuracy improves. Partial result: ambiguous forecast. Failure: false forecast or manipulation. The operation closes when expire forecast and close contact on hostility."
africa_action_name_bargain_with_the_green: "Bargain With The Green"
africa_select_bargain_with_the_green: "Bargain With The Green"
africa_select_bargain_with_the_green_desc: "Requirements: route allows an ecological compact. Commitment: protected forest, halted extraction, relief work, development opportunity cost, and local settlement concessions. Full result: wrath falls and forest cooperation begins. Partial result: temporary truce. Failure: wrath rises and disasters intensify. The operation closes when record protected zones and reopen review only after major breach."
africa_action_name_petition_the_rain: "Petition The Rain"
africa_select_petition_the_rain: "Petition The Rain"
africa_select_petition_the_rain_desc: "Requirements: contact and offering route. Commitment: food reserves, ritual access, political risk. In war, the selected enemy can face a random natural calamity after the additional ritual payment; it begins at severe intensity, rises to regional intensity for a fully promoted sovereign package or warfare doctrine, and becomes catastrophic under the covenant capstone. The call can be refused by the enemy's geography and has a long recovery interval with a risk of backfire. Full result: rainfall relief or agricultural bonus. Partial result: local rain only. Failure: flood or humiliation outcome. The operation closes when clear petition and apply weather outcome."
africa_action_name_defy_the_drought: "Defy The Drought"
africa_select_defy_the_drought: "Defy The Drought"
africa_select_defy_the_drought_desc: "Requirements: water, logistics, engineers, protected wells. Commitment: trains, trucks, fuel, manpower, civilian factories. In war, the selected enemy can face a random natural calamity after the additional ritual payment; it begins at regional severity, stronger covenant authority can make it catastrophic, the call can be refused by the enemy's geography, and it has a long recovery interval with a risk of backfire. Full result: water network resists drought warfare. Partial result: one corridor survives. Failure: supply collapse and regional revolt. The operation closes when remove temporary rationing and retain built infrastructure."
africa_action_name_contain_emergent_disease: "Contain Emergent Disease"
africa_select_contain_emergent_disease: "Contain Emergent Disease"
africa_select_contain_emergent_disease_desc: "Requirements: medical capacity and access. Commitment: support equipment, manpower, civilian factories, transport, medicine. Full result: spread falls and deaths reduced. Partial result: disease contained to current region. Failure: spread accelerates or mutates. The operation closes when clear teams, outbreak flags, and quarantine after resolution."
africa_action_name_research_disease_countermeasure: "Research Disease Countermeasure"
africa_select_research_disease_countermeasure: "Research Disease Countermeasure"
africa_select_research_disease_countermeasure_desc: "Requirements: scientists, samples, safety. Commitment: research slot or special project capacity, factories, time. Full result: countermeasure or vaccine unlocks. Partial result: treatment reduces severity. Failure: laboratory accident creates local outbreak. The operation closes when close lab risk flags, retain countermeasure tech."
africa_action_name_weaponise_fictional_pathogen: "Weaponise Fictional Pathogen"
africa_select_weaponise_fictional_pathogen: "Weaponise Fictional Pathogen"
africa_select_weaponise_fictional_pathogen_desc: "Requirements: delivery means and target access. Commitment: special stockpile, aircraft or agents, condemnation, accident risk. Full result: target outbreak begins with severe diplomatic cost. Partial result: limited contamination. Failure: backfire outbreak at home or global spread. The operation closes when consume stockpile, clear delivery teams, register source and aftermath."
africa_action_name_awaken_stone_cohort: "Awaken Stone Cohort"
africa_select_awaken_stone_cohort: "Awaken Stone Cohort"
africa_select_awaken_stone_cohort_desc: "Requirements: site control, ritual or engineering capacity. Commitment: rare materials, manpower or offerings, time. Full result: limited stone cohort created. Partial result: static defence unit only. Failure: site collapses or wrath rises. The operation closes when one-time site use or long cooldown, no free unit loop."
africa_action_name_train_gorilla_heavy_infantry: "Train Gorilla Heavy Infantry"
africa_select_train_gorilla_heavy_infantry: "Train Gorilla Heavy Infantry"
africa_select_train_gorilla_heavy_infantry_desc: "Requirements: food, equipment, command structure. Commitment: special equipment, supply, training time. Full result: heavy infantry formation created. Partial result: defensive cadre only. Failure: discipline or supply crisis. The operation closes when lock repeated creation until losses and cooldown justify replacement."
africa_action_name_organise_pan_sappers: "Organise Pan Sappers"
africa_select_organise_pan_sappers: "Organise Pan Sappers"
africa_select_organise_pan_sappers_desc: "Requirements: workshops, explosives, command. Commitment: support equipment, engineering tools, time. Full result: sapper unit or sabotage network created. Partial result: repair team only. Failure: workshop accident or theft. The operation closes when cap units and remove workshop mission on region loss."
africa_action_name_seek_international_recognition: "Seek International Recognition"
africa_select_seek_international_recognition: "Seek International Recognition"
africa_select_seek_international_recognition_desc: "Requirements: embassy access and acceptable relations. Commitment: political capital, trade concessions, security guarantees. Full result: recognition and pressure reduction. Partial result: conditional recognition. Failure: rejection strengthens intervention coalition. The operation closes when clear mission after recognition, rejection, or war."
africa_action_name_prepare_anti_sanctions_network: "Prepare Anti Sanctions Network"
africa_select_prepare_anti_sanctions_network: "Prepare Anti Sanctions Network"
africa_select_prepare_anti_sanctions_network_desc: "Requirements: alternative trade partners and ports. Commitment: convoys, stockpiles, civilian factories, diplomacy. Full result: sanction damage reduced and partners secured. Partial result: partial substitution. Failure: shortages and member confidence loss. The operation closes when end emergency network when sanctions lift or war changes system."
africa_action_name_answer_foreign_ultimatum: "Answer Foreign Ultimatum"
africa_select_answer_foreign_ultimatum: "Answer Foreign Ultimatum"
africa_select_answer_foreign_ultimatum_desc: "Requirements: leadership and member consultation. Commitment: route-specific concessions, mobilisation, or refusal cost. Full result: settlement, delay, or prepared refusal. Partial result: limited concession buys time. Failure: unprepared refusal triggers war and authority loss. The operation closes when clear ultimatum, start treaty or war branch."
africa_action_name_mobilise_continental_defence: "Mobilise Continental Defence"
africa_select_mobilise_continental_defence: "Mobilise Continental Defence"
africa_select_mobilise_continental_defence_desc: "Requirements: common reserve and transport network. Commitment: equipment, manpower, fuel, trains, civilian output. Full result: regional commands ready and members gain confidence. Partial result: partial mobilisation protects key coasts. Failure: mobilisation strains economy and raises burden. The operation closes when demobilise or convert to war economy after crisis."
africa_action_name_disrupt_expedition_planning: "Disrupt Expedition Planning"
africa_select_disrupt_expedition_planning: "Disrupt Expedition Planning"
africa_select_disrupt_expedition_planning_desc: "Requirements: agents, access, naval intelligence. Commitment: intelligence assets, funds, exposure risk. Full result: expedition delayed or split. Partial result: one member withdraws support. Failure: operation exposed and coalition unity rises. The operation closes when clear network and apply cooldown."
africa_action_name_offer_base_withdrawal_treaty: "Offer Base Withdrawal Treaty"
africa_select_offer_base_withdrawal_treaty: "Offer Base Withdrawal Treaty"
africa_select_offer_base_withdrawal_treaty_desc: "Requirements: negotiable access and no active total war. Commitment: lease compensation, transit rights, monitoring. Full result: base withdrawn or converted to limited treaty access. Partial result: long transition. Failure: talks fail and fortification expands. The operation closes when transfer base, record treaty, clear claim dispute."
africa_action_name_call_global_anti_colonial_conference: "Call Global Anti Colonial Conference"
africa_select_call_global_anti_colonial_conference: "Call Global Anti Colonial Conference"
africa_select_call_global_anti_colonial_conference_desc: "Requirements: safe venue and global contacts. Commitment: political capital, transport, security, aid commitments. Full result: recognition network and foreign movements strengthen. Partial result: symbolic conference. Failure: repression or boycott reduces effect. The operation closes when close conference, spawn follow-up missions, clear delegates."
africa_action_name_break_intervention_coalition: "Break Intervention Coalition"
africa_select_break_intervention_coalition: "Break Intervention Coalition"
africa_select_break_intervention_coalition_desc: "Requirements: diplomacy, intelligence, trade, military deterrence. Commitment: varied costs per target and limited simultaneous campaigns. Full result: coalition loses enough members to cancel war. Partial result: intervention delayed. Failure: coalition hardens and launches expedition. The operation closes when clear campaign when coalition dissolves or war begins."
africa_action_name_sponsor_continent_unifier: "Sponsor Continent Unifier"
africa_select_sponsor_continent_unifier: "Sponsor Continent Unifier"
africa_select_sponsor_continent_unifier_desc: "Requirements: route selected and global chaos high enough. Commitment: equipment, advisers, industry, convoys, diplomatic exposure. Full result: target receives unique unifier package and alliance link. Partial result: movement gains limited regional power. Failure: sponsorship fails or creates hostile client. The operation closes when end sponsorship on success, collapse, betrayal, or target world-end conflict."
africa_action_name_mediate_continent_union: "Mediate Continent Union"
africa_select_mediate_continent_union: "Mediate Continent Union"
africa_select_mediate_continent_union_desc: "Requirements: compatible routes, border and representation settlement. Commitment: major political concessions, shared command, economic transition. Full result: dynamic two-continent union forms. Partial result: confederation or alliance only. Failure: talks fail and rivalry intensifies. The operation closes when replace tags or cosmetic identity, reconcile factions, clear old treaties."
africa_action_name_prepare_continental_war: "Prepare Continental War"
africa_select_prepare_continental_war: "Prepare Continental War"
africa_select_prepare_continental_war_desc: "Requirements: world chaos threshold, logistics, strategic access. Commitment: massive equipment, fuel, convoys, trains, manpower, stability. Full result: war goal and campaign plan unlock. Partial result: limited proxy conflict. Failure: preparation exposed, rival strikes first. The operation closes when clear plan on alliance, union, target collapse, or war start."
africa_action_name_force_continent_submission: "Force Continent Submission"
africa_select_force_continent_submission: "Force Continent Submission"
africa_select_force_continent_submission_desc: "Requirements: occupation, legitimacy, union route. Commitment: garrison, reconstruction, political settlement, equipment. Full result: rival integrated, federated, or annexed according to route. Partial result: puppet continent or armistice. Failure: resistance and renewed continental war. The operation closes when remove obsolete rival identity only after settlement completion."
africa_action_name_form_dynamic_two_continent_union: "Form Dynamic Two Continent Union"
africa_select_form_dynamic_two_continent_union: "Form Dynamic Two Continent Union"
africa_select_form_dynamic_two_continent_union_desc: "Requirements: no terminal war between partners and union plan complete. Commitment: constitutional capacity, integration burden, shared defence, member votes. Full result: new readable union name and joint package. Partial result: loose dual federation. Failure: member revolt or leadership crisis. The operation closes when switch identity, preserve regional systems, close duplicate sponsor routes."
africa_action_name_declare_the_world_is_one: "Declare The World Is One"
africa_select_declare_the_world_is_one: "Declare The World Is One"
africa_select_declare_the_world_is_one_desc: "Requirements: world_end not already set and all rivals resolved. Commitment: campaign-ending political and administrative commitment. Full result: The World terminal identity forms and super-event fires. Partial result: not applicable. Failure: invalid state blocks decision rather than using fallback. The operation closes when set terminal flags, stop incompatible systems, close all continent-war decisions."
africa_action_name_administer_world_regions: "Administer World Regions"
africa_select_administer_world_regions: "Administer World Regions"
africa_select_administer_world_regions_desc: "Requirements: regional settlement packages available. Commitment: garrisons, reconstruction, representation, transport. Full result: route-specific epilogue and stability. Partial result: some regions remain autonomous. Failure: global revolt if burden ignored. The operation closes when close after epilogue or campaign end."
africa_action_name_contain_terminal_high_chaos: "Contain Terminal High Chaos"
africa_select_contain_terminal_high_chaos: "Contain Terminal High Chaos"
africa_select_contain_terminal_high_chaos_desc: "Requirements: special countermeasures and access. Commitment: massive resources, research, ecological concessions, armies. Full result: actors integrated, contained, or defeated. Partial result: regional truce. Failure: disaster chain continues after world victory. The operation closes when clear actors only through defined outcomes, never silent deletion."
africa_action_name_convene_federal_deadlock_conference: "Convene Federal Deadlock Conference"
africa_select_convene_federal_deadlock_conference: "Convene Federal Deadlock Conference"
africa_select_convene_federal_deadlock_conference_desc: "Requirements: two or more represented regions, no active conference, sufficient authority, affected members still valid. Commitment: civilian administrative capacity plus political attention scaled by represented regions and the number of disputed clauses. Full result: a compromise formula, executive adjustment, or bounded exception restores congress function. Partial result: one disputed action proceeds under a temporary rule while deadlock pressure remains. Failure: emergency rule debt rises, one strong member gains withdrawal support, and the blocked agenda remains closed. The operation closes when close when route changes, congress dissolves, dispute members disappear, or a settlement flag is recorded."
africa_action_name_conduct_first_continental_election: "Conduct First Continental Election"
africa_select_conduct_first_continental_election: "Conduct First Continental Election"
africa_select_conduct_first_continental_election_desc: "Requirements: minimum regional participation, accessible capitals or polling centres, election legitimacy above collapse level, no terminal civil war. Commitment: civilian administrative capacity, trains or convoys for remote polling, and temporary security commitment scaled by population and access. Full result: a recognised government takes office and regional acceptance is recorded. Partial result: the government is elected but one or more regions require a rerun, autonomy settlement, or observer mission. Failure: boycott, fraud, or insecurity creates an emergency republic and raises coup and secession pressure. The operation closes when remove after valid transfer, route collapse, government overthrow, or world_end."
africa_action_name_arbitrate_continental_succession: "Arbitrate Continental Succession"
africa_select_arbitrate_continental_succession: "Arbitrate Continental Succession"
africa_select_arbitrate_continental_succession_desc: "Requirements: claimant evidence or local institutions exist, target not annexed, at least one neutral crown or civic observer available. Commitment: authority, diplomatic staff, and temporary guard or convoy support scaled by distance, claimant count, and violence risk. Full result: a locally accepted ruler, regency, civic settlement, or constitutional conversion resolves the dispute. Partial result: a temporary regency prevents war but claimant legitimacy remains contested. Failure: rival claimants mobilise, royal-bloc cohesion falls, and the target may leave or form a rival council. The operation closes when cancel if the target government changes, the throne is abolished by a valid settlement, or civil war makes arbitration impossible."
africa_action_name_balance_food_and_industrial_plan: "Balance Food and Industrial Plan"
africa_select_balance_food_and_industrial_plan: "Balance Food and Industrial Plan"
africa_select_balance_food_and_industrial_plan_desc: "Requirements: at least one agricultural region and one industrial or mining region, functioning corridor, no duplicate plan. Commitment: trains, trucks, civilian capacity, food reserve, and administrative labour scaled by distance and current shortages. Full result: food supply stabilises while the selected industrial programme remains functional. Partial result: food or industry is preserved, while the other side loses output and demands a new settlement. Failure: shortages, strikes, rural resistance, or coercive requisition raise bureaucratic pressure and regional distrust. The operation closes when close on route change, resolved shortage, lost target regions, or replacement by a later planning system."
africa_action_name_review_victorious_commander_loyalty: "Review Victorious Commander Loyalty"
africa_select_review_victorious_commander_loyalty: "Review Victorious Commander Loyalty"
africa_select_review_victorious_commander_loyalty_desc: "Requirements: commander and assigned forces exist, no current review, central command can contact the formation. Commitment: command attention, officer replacements, and temporary readiness loss scaled by the commander’s force share. Full result: the commander accepts rotation, constitutional subordination, retirement, or a defined lawful office. Partial result: the commander remains in place under monitoring and reduced independent access. Failure: loyalty crisis, rogue command, coup pressure, or regional mutiny begins. The operation closes when remove if commander dies, force dissolves, route hands over to civilian rule, or the loyalty crisis becomes open war."
africa_action_name_ratify_confederal_emergency_action: "Ratify Confederal Emergency Action"
africa_select_ratify_confederal_emergency_action: "Ratify Confederal Emergency Action"
africa_select_ratify_confederal_emergency_action_desc: "Requirements: emergency is still active, affected members exist, no duplicate ratification, action was not a terminal world-end measure. Commitment: diplomatic staff, member concessions, and shared material compensation scaled by the number of affected members and sovereignty concern. Full result: enough members ratify the action and define its limits. Partial result: a smaller coalition keeps the action while dissenting members receive an opt-out. Failure: the action lapses, exit contagion rises, and one member may challenge League leadership. The operation closes when close when the emergency ends, action expires, affected members leave, or the route changes."
africa_action_name_review_covenant_obligation: "Review Covenant Obligation"
africa_select_review_covenant_obligation: "Review Covenant Obligation"
africa_select_review_covenant_obligation_desc: "Requirements: valid actor or territory, known obligation, mediator or containment capacity, no active review. Commitment: local supplies, evacuation capacity, research or ritual resources, and member confidence scaled by wrath and affected population. Full result: the obligation is renewed with limits, safely ended, or replaced by a contained settlement. Partial result: temporary calm is restored while a follow-up boundary or evacuation mission remains. Failure: wrath rises, the actor breaches containment, or human members revolt against the arrangement. The operation closes when close if actor is defeated, territory is lost, covenant route ends, or a breach event replaces the review."
africa_action_name_hold_postwar_constitutional_review: "Hold Postwar Constitutional Review"
africa_select_hold_postwar_constitutional_review: "Hold Postwar Constitutional Review"
africa_select_hold_postwar_constitutional_review_desc: "Requirements: no active terminal war, at least four functioning regional councils, no duplicate review. Commitment: civilian administrative capacity, regional delegates, transport support, and demobilisation burden scaled by war length and unresolved regions. Full result: the chosen constitution absorbs or dismantles wartime powers and opens its post-unification programme. Partial result: some emergency institutions end while one major issue becomes a dedicated crisis branch. Failure: coup, secession, election boycott, succession dispute, or confederal exit crisis emerges according to route. The operation closes when remove after completed review, renewed terminal war, route overthrow, or world_end."
africa_action_name_recover_failed_host_proof: "Recover Failed Host Proof"
africa_select_recover_failed_host_proof: "Recover Failed Host Proof"
africa_select_recover_failed_host_proof_desc: "Requirements: host still controls a viable capital, at least one valid corridor or partner exists, no terminal defeat. Commitment: equipment, trains or convoys, civilian capacity, and political concessions scaled by the original failure and host size. Full result: the host restores enough authority and confidence to convene the League without erasing the remembered failure. Partial result: the League opens with reduced authority and a mandatory oversight or autonomy clause. Failure: the host loses the normal early mandate and must rebuild through a regional coalition or crisis route. The operation closes when close after League formation, host replacement, route collapse, or a second failure."
africa_action_name_promote_priority_member_package: "Promote Priority Member Package"
africa_select_promote_priority_member_package: "Promote Priority Member Package"
africa_select_promote_priority_member_package_desc: "Requirements: viable compact territory or autonomy, local support, functioning institution, distinct economic or strategic role, unresolved relationship question. Commitment: regional authority, administrative capacity, equipment for starting security, and development commitment scaled by candidate size and overlap. Full result: the full country package activates with its starting problem, force identity, focus modules, and League relationship. Partial result: the candidate gains autonomy or association and can qualify again after one missing condition is solved. Failure: overlap dispute, access failure, or local refusal returns it to compact status and raises regional tension. The operation closes when remove when candidate becomes invalid, another settlement supersedes it, full package activates, or the region is annexed."
africa_host_problem_ethiopia: "A sovereign empire under foreign threat with contested central authority, regional obligations, uneven roads, and a diplomatic system that may fail it"
africa_host_proof_ethiopia: "Keep one threatened Horn partner independent through a supply corridor, volunteer commitment, or negotiated ceasefire"
africa_host_leverage_ethiopia: "imperial constitutional settlement; regional representation; highland and lowland logistics; Red Sea access; officer reform"
africa_host_rival_ethiopia: "Eritrean and Somali distrust, Italian return, regional resentment, claimant or succession crisis"
africa_host_problem_egypt: "Formal independence constrained by British military presence, treaty obligations, the Suez corridor, royal and parliamentary rivalry, and Sudan"
africa_host_proof_egypt: "Protect a Nile or Red Sea partner without surrendering canal control or allowing one foreign patron to dominate"
africa_host_leverage_egypt: "treaty revision; palace and parliament; Suez security; Nile representation; Egyptian and Sudanese settlement"
africa_host_rival_egypt: "British intervention, Sudanese refusal, canal seizure, North African competition"
africa_host_problem_sudan: "Condominium rule, regional distance, Nile dependence, competing urban, religious, pastoral, and local authorities"
africa_host_proof_sudan: "Hold a Nile or trans-Sahel corridor while winning recognition from more than one Sudanese region"
africa_host_leverage_sudan: "dual-rule dismantling; regional congress; Nile transport; pastoral and agrarian settlement; officer and civic coalition"
africa_host_rival_sudan: "Egyptian claims, British return, southern withdrawal, Nile disputes"
africa_host_problem_morocco: "A divided protectorate and international zone with a sultan, reformist nationalism, rural resistance, and competing foreign authorities"
africa_host_proof_morocco: "Unify one administrative zone through negotiation or coordinated liberation while preserving local confidence"
africa_host_leverage_morocco: "protectorate dismantling; sultan and nationalist settlement; Tangier question; Rif reconstruction; Saharan access"
africa_host_rival_morocco: "Spanish and French intervention, Algerian leadership competition, Saharan claims"
africa_host_problem_algeria: "Settler political dominance, unequal citizenship, land dispossession, divided nationalist currents, and a large colonial army presence"
africa_host_proof_algeria: "Create a cross-community independence institution or win a defended inland corridor without mass coercion"
africa_host_leverage_algeria: "citizenship settlement; land commission; nationalist coalition; urban and rural organisation; Sahara governance"
africa_host_rival_algeria: "French intervention, settler insurgency, Moroccan and Tunisian competition, Sahara burden"
africa_host_problem_tunisia: "A protectorate with a bey, mass nationalist organisation, urban labour, rural inequality, and nearby European military power"
africa_host_proof_tunisia: "Secure a legal and logistical space for an independence congress while keeping the coast supplied"
africa_host_leverage_tunisia: "bey and movement settlement; urban labour; rural reform; port defence; Maghreb congress"
africa_host_rival_tunisia: "French repression, Italian pressure, elite movement split, coastal blockade"
africa_host_problem_libya: "Italian occupation, pacification damage, regional division among Cyrenaica, Tripolitania, and Fezzan, and weak national infrastructure"
africa_host_proof_libya: "Liberate or protect one regional capital while keeping a desert supply chain functional"
africa_host_leverage_libya: "regional compact; resistance integration; desert logistics; land recovery; Mediterranean defence"
africa_host_rival_libya: "Italian return, regional secession, Egyptian influence, Saharan isolation"
africa_host_problem_liberia: "Formal sovereignty weakened by concession power, forced-labour scandal, settler and indigenous political inequality, and fragile public finance"
africa_host_proof_liberia: "Renegotiate one concession and use the recovered revenue to protect a neighbouring African partner"
africa_host_leverage_liberia: "citizenship reform; concession audit; labour settlement; port and hinterland roads; sovereign diplomacy"
africa_host_rival_liberia: "foreign receivership, concession retaliation, interior refusal, elite coup"
africa_host_problem_nigeria: "A large amalgamated colony with deep regional differences, indirect rule, Lagos politics, transport inequality, and emerging national organisation"
africa_host_proof_nigeria: "Complete a cross-regional rail or river project while forming a coalition that includes at least three political regions"
africa_host_leverage_nigeria: "federal bargain; Lagos and interior balance; emirate and civic representation; rail and river integration; national movement"
africa_host_rival_nigeria: "regional withdrawal, elite capture, labour unrest, neighbouring bloc competition"
africa_host_problem_gold_coast: "A prosperous export colony with cocoa producers, mining, chiefly institutions, educated urban politics, and unequal representation"
africa_host_proof_gold_coast: "Protect producer income and complete a public port to inland development project"
africa_host_leverage_gold_coast: "producer settlement; chiefs and elected bodies; mining revenue; Accra and inland balance; West African diplomacy"
africa_host_rival_gold_coast: "colonial fiscal control, producer revolt, Asante autonomy, Nigerian competition"
africa_host_problem_senegal_fwa: "A coastal administrative centre governing a vast and uneven federation with citizen communes, subjects, rail corridors, and inland scepticism"
africa_host_proof_senegal_fwa: "Transfer resources and representation to an inland partner while maintaining the Dakar corridor"
africa_host_leverage_senegal_fwa: "federal reconstitution; commune and subject citizenship; Dakar and inland balance; rail network; Sahel congress"
africa_host_rival_senegal_fwa: "inland secession, Dakar dominance, French military return, Manden or Songhai restoration"
africa_host_problem_sierra_leone: "A colony and protectorate divide, Freetown institutions, hinterland authority, mining and labour disputes, and maritime vulnerability"
africa_host_proof_sierra_leone: "Create a colony-protectorate settlement and keep an aid convoy open to a neighbour"
africa_host_leverage_sierra_leone: "Freetown and protectorate bargain; mining revenue; labour rights; port defence; education and diaspora exchange"
africa_host_rival_sierra_leone: "hinterland rejection, company control, blockade, Liberian and Gold Coast competition"
africa_host_problem_belgian_congo: "A vast concessionary colony with extreme administrative coercion, mining enclaves, mission and company power, weak national institutions, and difficult transport"
africa_host_proof_belgian_congo: "Secure one river and rail corridor under African civil control while protecting a neighbouring territory"
africa_host_leverage_belgian_congo: "administrative transfer; mining and labour settlement; river network; regional congress; army and police reform"
africa_host_rival_belgian_congo: "Katanga or regional secession, Belgian return, concession armies, Kongo or Luba-Lunda claims"
africa_host_problem_angola: "Portuguese colonial control, forced labour and concession systems, disconnected coastal and interior economies, and several regional political traditions"
africa_host_proof_angola: "Open a paid-labour public corridor from an inland region to a port"
africa_host_leverage_angola: "labour abolition; concession review; port and rail integration; regional representation; Kongo and southern settlement"
africa_host_rival_angola: "Portuguese intervention, regional fragmentation, Kongo overlap, company retaliation"
africa_host_problem_french_equatorial_africa: "A thin administrative federation with concession legacies, difficult transport, forest and savanna distance, and Brazzaville dominance"
africa_host_proof_french_equatorial_africa: "Complete a river or rail relief route while granting an inland regional council real budget authority"
africa_host_leverage_french_equatorial_africa: "federal reconstitution; concession review; Brazzaville and interior balance; river network; Chad and Cameroon links"
africa_host_rival_french_equatorial_africa: "inland secession, French return, Belgian Congo competition, Chad autonomy"
africa_host_problem_kenya: "Settler land power, African political exclusion, labour and tax pressure, railway dependence, and strong regional and pastoral differences"
africa_host_proof_kenya: "Complete a land or labour settlement in one region and use the railway to protect an East African partner"
africa_host_leverage_kenya: "land commission; settler and African constitutional settlement; railway authority; pastoral access; East African federation"
africa_host_rival_kenya: "settler revolt, land war, Ugandan and Tanganyikan mistrust, British intervention"
africa_host_problem_uganda: "A protectorate built around Buganda privilege, other kingdoms and districts, cotton revenue, lake transport, and unresolved territorial grievances"
africa_host_proof_uganda: "Arbitrate one kingdom or district dispute and complete a lake or rail development project with shared benefits"
africa_host_leverage_uganda: "federal settlement; Buganda and other regions; cotton revenue; lake transport; kingdom and civic representation"
africa_host_rival_uganda: "Buganda dominance, Bunyoro grievance, East African competition, British return"
africa_host_problem_tanganyika: "A former German colony under mandate rule with weak national institutions, plantation and labour systems, long transport corridors, and a Zanzibar relationship"
africa_host_proof_tanganyika: "Open a port to inland aid corridor with paid labour and local council consent"
africa_host_leverage_tanganyika: "mandate transition; labour and plantation reform; central railway; Zanzibar settlement; East African federation"
africa_host_rival_tanganyika: "Zanzibar split, settler and plantation resistance, Kenyan competition, British intervention"
africa_host_problem_somali_territories: "A people divided among several colonial administrations with pastoral mobility, port dependence, clan and local authority, and memories of anti-colonial resistance"
africa_host_proof_somali_territories: "Secure voluntary association between two territories while keeping a pastoral and port corridor open"
africa_host_leverage_somali_territories: "territorial congress; pastoral mobility; port and customs settlement; local authority representation; Horn diplomacy"
africa_host_rival_somali_territories: "Ethiopian conflict, Italian and British return, territorial refusal, port rivalry"
africa_host_problem_madagascar: "Colonial rule over a large island with highland and coastal political differences, Merina memory, labour and land questions, and weak transport"
africa_host_proof_madagascar: "Create a highland-coastal settlement and maintain an interregional supply route"
africa_host_leverage_madagascar: "island constitutional congress; Merina and coastal representation; labour and land reform; road and port integration; Indian Ocean diplomacy"
africa_host_rival_madagascar: "coastal withdrawal, royal restoration conflict, French intervention, maritime isolation"
africa_host_problem_south_africa: "A powerful dominion shaped by racial exclusion, African dispossession, labour conflict, Afrikaner and imperial rivalry, and regional protectorates"
africa_host_proof_south_africa: "Resolve the Allied civil-war branch or build a constitutional anti-colonial coalition before claiming continental leadership"
africa_host_leverage_south_africa: "civil-war coalition; African convention and representation; land and labour settlement; protectorate guarantees; industrial and military transformation"
africa_host_rival_south_africa: "Allied intervention, settler counterrevolution, African coalition refusal, protectorate revolt"
africa_host_problem_southern_rhodesia: "Settler self-government, racial land division, company and mining power, African political exclusion, and pressure for a wider Rhodesian federation"
