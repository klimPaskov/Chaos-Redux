l_english:
chaosx.nr12.1.t: "Africa"
chaosx.nr12.0.t: "Africa Has No Seat"
chaosx.nr12.0.d: "The Charter office has found no eligible African-capital country able to carry the continental mandate. Capitulated states, broken shells, existing continental formables, special chaos countries, actual nonhuman countries, and capitals outside Africa are rejected by the register."
chaosx.nr12.0.a: "The Charter remains sealed."
chaosx.nr12.2.t: "Africa Is One"
chaosx.nr12.2.d: "The capital has received the first sealed Charter: a continental mandate that names Africa as one political horizon without pretending the continent is already administratively whole. The proclamation carries claims, obligations, and a League charter. Every African state can seek defense, aid, influence, regional authority, integration, resistance, or open confrontation."
chaosx.nr12.2.a: "Open the Charter League."

chaosx.nr12.3.t: "The Charter League Invitation"
chaosx.nr12.3.d: "[From.GetName] has delivered the Charter to [Root.GetName]. It offers a seat in the League, protection for vulnerable capitals, and a staged path through paper claims, regional authorities, and living cores. The invitation also warns that rejection will be recorded in the Archive of Old Seats."
chaosx.nr12.3.a: "Take a Charter seat."
chaosx.nr12.3.b: "Accept protection without surrendering the seat."
chaosx.nr12.3.c: "Resist the Charter."

chaosx.nr12.4.t: "[From.GetName] Answers the Charter"
chaosx.nr12.4.d: "[From.GetName] has accepted a Charter relationship. The League register marks another capital as defended, aided, and subject to the next round of regional authority talks."
chaosx.nr12.4.a: "Add the seal."

chaosx.nr12.5.t: "[From.GetName] Resists the Charter"
chaosx.nr12.5.d: "[From.GetName] has rejected the Charter. The response strengthens local sovereignty claims and raises colonial alarm across the League offices."
chaosx.nr12.5.a: "Record the resistance."

chaosx.nr12.20.t: "The Continental Side"
chaosx.nr12.20.d: "South Africa's Allied alignment has split under the Charter. The continental side carries the Africa is One mandate through civil war, while the loyalist side remains tied to the old alliance. The League begins under fire."
chaosx.nr12.20.a: "Carry the Charter through the war."

chaosx.nr12.21.t: "The Allies Make Peace"
chaosx.nr12.21.d: "The continental side has won the South African civil war. Allied governments still at war with the Charter side accept peace, leaving the African mandate to settle its own continent."
chaosx.nr12.21.a: "The Charter survives."

chaosx.nr12.30.t: "A Bestiary Warning Arrives"
chaosx.nr12.30.d: "[From.GetName] has sent a warning through the Bestiary network: old routes, river mouths, strange scouts, and Archive clerks all name [Root.GetName] as the next outside holder whose African claims must be answered. Compliance will be recorded as treaty withdrawal. Defiance will turn the warning into a live Scramble case."
chaosx.nr12.30.a: "Comply before the warning becomes proof."
chaosx.nr12.30.b: "Ignore the omen and hold the claim."

chaosx.nr12.31.t: "[From.GetName] Complies"
chaosx.nr12.31.d: "[From.GetName] has answered the Bestiary warning with withdrawal terms. The Scramble docket marks the holder settled, while the Charter records the warning as a working instrument rather than a panic."
chaosx.nr12.31.a: "File the compliance."

chaosx.nr12.32.t: "[From.GetName] Defies the Warning"
chaosx.nr12.32.d: "[From.GetName] has ignored the Bestiary warning. Colonial offices dismiss the omen as theater, but the Charter registers the refusal as another live threat to African territory and another test of the high-chaos network."
chaosx.nr12.32.a: "Prepare the counter-docket."

chaosx.nr12.33.t: "A Bestiary Warning Names [africa_bestiary_warning_state.GetName]"
chaosx.nr12.33.d: "[From.GetName] has sent a state warning through the Bestiary network. The notice names [africa_bestiary_warning_state.GetName] as an African place where old claims, current control, and strange testimony have become a single docket. Compliance records a local restraint mark. Defiance records a live state-level Scramble refusal."
chaosx.nr12.33.a: "Comply at the named state."
chaosx.nr12.33.b: "Deny the warning and hold the position."

chaosx.nr12.34.t: "[From.GetName] Complies at a Warning State"
chaosx.nr12.34.d: "[From.GetName] has answered the state warning with local restraint terms. The Scramble case remains open at the holder level, but the marked state records compliance and the Charter treats the warning network as disciplined rather than panicked."
chaosx.nr12.34.a: "Record the state compliance."

chaosx.nr12.35.t: "[From.GetName] Defies a State Warning"
chaosx.nr12.35.d: "[From.GetName] has rejected the state warning. The selected state is marked as defiant, and the Charter records the refusal as proof that high-chaos warnings can expose danger without replacing the ordinary Scramble docket."
chaosx.nr12.35.a: "Keep the state on the counter-docket."

chaosx.nr12.40.t: "Telegraph Relays Take the Marsh Line"
chaosx.nr12.40.d: "[africa_bestiary_actor_target.GetName] has taken Charter equipment into its relay posts. Reports no longer move as a single office memorandum: they pass through guarded drums, copied marks, scouts, interpreters, and watchers who know which riverbank warnings are real."
chaosx.nr12.40.a: "Keep the signals accountable."

chaosx.nr12.41.t: "Shadow Dossiers Reach the Court"
chaosx.nr12.41.d: "[africa_bestiary_actor_target.GetName] has accepted the quiet mandate. Its witnesses will not be displayed as trophies. The Court sends sealed forest notes back to the Archive, naming exploitation routes without turning the hidden seat into a public spectacle."
chaosx.nr12.41.a: "File the sealed notes."

chaosx.nr12.42.t: "The Citadel Engineers Take Their Commission"
chaosx.nr12.42.d: "[africa_bestiary_actor_target.GetName] has opened the repair commission under Charter limits. The capital works are reinforced first: roads, mound galleries, field stores, and a hard legal line around where the engineers may dig."
chaosx.nr12.42.a: "Mark the repair boundary."

chaosx.nr12.43.t: "Honeyguide Aid Routes Open"
chaosx.nr12.43.d: "[africa_bestiary_actor_target.GetName] has accepted convoys and support stores for its guide routes. The Commons does not become a ministry; it becomes a visible way through the map for aid, Archive couriers, and habitat messengers."
chaosx.nr12.43.a: "Keep the route visible."

chaosx.nr12.44.t: "Great Herds Relief Columns Muster"
chaosx.nr12.44.d: "[africa_bestiary_actor_target.GetName] has gathered relief columns under the Compact. The movement is impossible to hide, and that is part of the price: threatened Charter corridors can see help coming, and so can everyone else."
chaosx.nr12.44.a: "Let the corridors see them."
chaosx.nr12.45.t: "The Gentle Veto Is Heard"
chaosx.nr12.45.d: "[africa_bestiary_actor_target.GetName] has used the kinship veto under Charter record. The decision is not a command. It is a visible refusal to turn protected habitat, testimony, or local consent into another sealed office order."
chaosx.nr12.45.a: "Record the refusal."
chaosx.nr12.46.t: "Night Radio Misleads the Hunter"
chaosx.nr12.46.d: "[africa_bestiary_actor_target.GetName] has opened the night band. False convoy times, reversed road gossip, and carefully marked decoy warnings move through the air while Charter clerks keep the real relief route on a separate ledger."
chaosx.nr12.46.a: "Keep the real route guarded."
chaosx.nr12.47.t: "The Wall Bird Was Right"
chaosx.nr12.47.d: "[africa_bestiary_actor_target.GetName] has confirmed a warning before the Archive could dismiss it as theater. The walls, old wells, and broken courtyards speak in fragments, but the verified omen gives the Charter time to move."
chaosx.nr12.47.a: "Trust the verified warning."
chaosx.nr12.48.t: "The Terracotta Line Stands"
chaosx.nr12.48.d: "[africa_bestiary_actor_target.GetName] has formed the Terracotta line at the old seat. Kiln stores, field markers, and hard red-clay positions give the Charter a defensive promise that cannot be folded into ordinary infantry orders."
chaosx.nr12.48.a: "Let the line harden."

chaosx.news.10.t: "Africa Is One"
chaosx.news.10.d: "[From.GetName] has proclaimed the Charter League and adopted the name Africa. The proclamation grants paper claims across the continent, but real integration must move through regional authority, state control, local consent, and war. Foreign capitals read the Charter as a promise, a threat, and a map."
chaosx.news.10.a: "The map has changed."

africa_charter_league: "Charter League"

africa_is_one_spirit: "Africa Is One"
africa_is_one_spirit_desc: "The Charter names a continental horizon and binds it to practical obligations: defense, aid, recognition, claims, and integration."
africa_paper_core_mandate: "Paper-Core Mandate"
africa_paper_core_mandate_desc: "Africa's continental claims exist on paper before they exist in administration. Each state must pass through authority tracking and living integration before the claim becomes a core."
africa_charter_league_spirit: "Charter League"
africa_charter_league_spirit_desc: "The League is a diplomatic and military framework for African defense, aid, influence, protected membership, regional authority, resistance, and exit."
africa_federal_charter_spirit: "Federal Charter"
africa_federal_charter_spirit_desc: "The Federal Charter keeps member votes, protected regional seats, courts, and citizenship law inside the continental mandate so unity does not become annexation by another name."
africa_authority_atlas_spirit: "Authority Atlas"
africa_authority_atlas_spirit_desc: "The Authority Atlas links dossiers, old seats, local legitimacy, and regional integration into a living register."
africa_liberation_war_office_spirit: "Liberation War Office"
africa_liberation_war_office_spirit_desc: "The Liberation War Office coordinates equipment, manpower, volunteers, state-control objectives, and League war plans."
africa_high_chaos_bestiary_spirit: "Bestiary Clause"
africa_high_chaos_bestiary_spirit_desc: "The Charter can recognize impossible nonhuman and supernatural seats when chaos opens the door to them."
