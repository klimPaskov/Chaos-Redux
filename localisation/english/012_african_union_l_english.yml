africa_priority_member_natural_disaster_actions_category: "Priority Member Nature Arsenal"
africa_priority_member_natural_disaster_actions_category_desc: "A completed priority package may petition rain or defy drought against an enemy through the host's Charter ledger. Sovereign invocation: §Y[ROOT.GetAfricaPriorityMemberNatureInvocationName]§!. Recorded nature authority: §Y[ROOT.GetAfricaPriorityMemberNaturePowerName]§!. Greater authority can unlock stronger calamities."
africa_priority_member_refresh_natural_disaster_targets: "Refresh Enemy Nature Targets"
africa_priority_member_refresh_natural_disaster_targets_desc: "Survey the current enemy roster for a priority member's nature action. This refresh is explicit and grants no claim, core, or membership."
africa_priority_member_petition_the_rain: "Priority Member: Petition The Rain"
africa_priority_member_petition_the_rain_desc: "[ROOT.GetAfricaPriorityMemberNatureInvocationName] directs the rite. The priority member pays the caller reserve and asks the League host to direct a random severe natural calamity at the selected enemy. Recorded authority: §Y[ROOT.GetAfricaPriorityMemberNaturePowerName]§!. The package's authority shapes the impact."
africa_priority_member_defy_the_drought: "Priority Member: Defy The Drought"
africa_priority_member_defy_the_drought_desc: "[ROOT.GetAfricaPriorityMemberNatureInvocationName] breaks the season. The priority member pays the caller reserve and asks the League host to direct a random regional natural calamity at the selected enemy. Recorded authority: §Y[ROOT.GetAfricaPriorityMemberNaturePowerName]§!. Stronger packages can make the result catastrophic."
africa_priority_member_natural_disaster_ai_cycle: "Priority Member Nature Action"
africa_priority_member_natural_disaster_ai_cycle_desc: "The priority member's court refreshes its enemy roster, selects a random rain or drought action, and enters it through the shared Charter ledger."
africa_priority_member_natural_disaster_dynamic_cost: "Caller reserve: £pol_power [?constant:africa_natural_disaster.caller_pp_cost|0]  £command_power [?constant:africa_natural_disaster.caller_cp_cost|0]. The priority member pays this reserve. The League host pays the quoted Charter commitment and records one action."
africa_priority_member_natural_disaster_dynamic_cost_blocked: "Caller reserve: £pol_power §R[?constant:africa_natural_disaster.caller_pp_cost|0]§!  £command_power §R[?constant:africa_natural_disaster.caller_cp_cost|0]§!. The priority member must be able to pay this reserve. The League host also needs the quoted Charter commitment."
africa_priority_member_natural_disaster_launch_tt: "§Y[ROOT.GetAfricaPriorityMemberNatureInvocationName]§! sends one random natural calamity against the selected enemy. Its strength reflects the member's §Y[ROOT.GetAfricaPriorityMemberNaturePowerName]§! authority and the host's progress. The rite then enters a [?constant:africa_natural_disaster.cooldown_days|0]-day recovery period and carries a [?constant:africa_natural_disaster.backfire_chance|0]% risk of backfire."
