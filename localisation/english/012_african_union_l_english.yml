africa_high_chaos_category: "High-Chaos Reports"
africa_high_chaos_category_desc: "Mythic Pressure: §Y[?africa_mythic_pressure|0]§!  Nonhuman Sovereignty: §Y[?africa_nonhuman_sovereignty|0]§!  Bestiary Alarm: §Y[?africa_bestiary_alarm|0]§!\nHabitat Trust: §Y[?africa_habitat_trust|0]§!  Mythic Volatility: §Y[?africa_mythic_volatility|0]§!  Covenant Pressure: §Y[?africa_covenant_pressure|0]§!\nCurrent Bestiary Package: §Y[GetAfricaSelectedHighChaosPackageName]§!  Catalog: §Y[?africa_unlocked_high_chaos_package_count|0]§!/§Y[?global.africa_authority_atlas_high_chaos_package_count|0]§!  World Is One readiness: §Y[?global.africa_authority_atlas_minimum_high_chaos_packages|0]§!\nActive Bestiary Operation: §Y[GetAfricaBestiaryStateOperationStatus]§!\nSecured Habitat Seats: §Y[?africa_bestiary_habitat_seat_count|0]§!/§Y[?global.africa_mission_required_bestiary_secured_habitats|0]§!  Bestiary Actions: §Y[?africa_bestiary_package_action_count|0]§!/§Y[?global.africa_mission_required_bestiary_package_actions|0]§!\nBestiary Warnings: §Y[?africa_bestiary_warning_count|0]§!  Complied: §Y[?africa_bestiary_warning_compliance_count|0]§!  Defied: §Y[?africa_bestiary_warning_defiance_count|0]§!  Overuse: §Y[?global.africa_bestiary_warning_overuse_threshold|0]§!  Omen Review: §Y[GetAfricaOmenReliabilityStatus]§!"
africa_continent_sponsor_category: "Continental Sponsorship"
africa_continent_sponsor_category_desc: "Africa can sponsor other continental unions only after the continental mandate is complete and the world-order route is prepared.\nSponsor Readiness: §Y[GetAfricaSponsorReadinessStatus]§!  Prepared Union Frame: §Y[GetAfricaDynamicCrossContinentUnionName]§!\nExternal Proofs: §Y[?africa_external_continent_unifier_proof_count|0]§!/§Y[?global.africa_world_is_one_required_external_continent_unifier_proofs|0]§!  Proof Audit: §Y[GetAfricaExternalProofStatus]§!  World Gate: §Y[GetAfricaWorldGateStatus]§!"
africa_rsa_civil_war_emergency_category: "RSA Civil-War Emergency"
africa_rsa_civil_war_emergency_category_desc: "The continental side must survive before Allied peace can be forced."

africa_convene_continental_congress: "Convene the Continental Congress"
africa_convene_continental_congress_desc: "A congress session raises legitimacy and League cohesion."
africa_publish_charter_register: "Publish the Charter Register"
africa_publish_charter_register_desc: "Refresh visible Charter candidates and integration targets."
africa_offer_charter_seat: "Offer a Charter Seat"
africa_offer_charter_seat_desc: "Send the target a Charter League invitation with membership, protection, or resistance choices."
africa_send_league_aid: "Send League Aid"
africa_send_league_aid_desc: "Send manpower, rifles, and support equipment to a warring Charter member or protected member, then prove the member can survive the war."
africa_send_protected_league_aid: "Send Protected League Aid"
africa_send_protected_league_aid_desc: "Send manpower, rifles, and support equipment to a warring protected Charter member, then prove the member can survive the war."
africa_open_member_aid_corridor: "Open Member Aid Corridor"
africa_open_member_aid_corridor_desc: "Commit staff, trains, convoys, and support equipment to keep a warring Charter member supplied until the fighting ends."
africa_open_protected_aid_corridor: "Open Protected Aid Corridor"
africa_open_protected_aid_corridor_desc: "Commit staff, trains, convoys, and support equipment to keep a protected Charter member supplied until the fighting ends."
africa_member_confidence_mission: "Member Confidence Mission"
africa_member_confidence_mission_desc: "Prove that the aided Charter member can survive the war without leaving the League or collapsing under pressure."
africa_aid_corridor_mission: "Aid Corridor Deadline"
africa_aid_corridor_mission_desc: "Keep the active aid corridor open until the target survives its war without leaving the Charter relationship or capitulating."
africa_influence_charter_member: "Influence Charter Member"
africa_influence_charter_member_desc: "Spend diplomatic effort to raise League cohesion and regional trust with a Charter member."
africa_hold_federal_member_vote: "Hold Federal Member Vote"
africa_hold_federal_member_vote_desc: "Spend clerks, escorts, and Congress time to give a Charter member or regional authority subject a recorded federal vote."
africa_ratify_regional_autonomy_statute: "Ratify Autonomy Statute"
africa_ratify_regional_autonomy_statute_desc: "Commit manpower to a regional authority statute that protects the seat while reducing paper-core pressure."
africa_arbitrate_federal_high_court_case: "Arbitrate High Court Case"
africa_arbitrate_federal_high_court_case_desc: "Send court staff and security to settle a Charter case before it becomes a League rupture."
africa_docket_authority_integration: "Docket Authority Integration"
africa_docket_authority_integration_desc: "Mark a regional authority for later integration talks. This creates resistance risk instead of annexing the subject."
africa_member_request_league_aid: "Request League Aid"
africa_member_request_league_aid_desc: "Ask the Charter League leader for manpower and rifles while fighting a war."
africa_member_petition_to_leave_charter: "Petition to Leave the Charter"
africa_member_petition_to_leave_charter_desc: "Leave the Charter if no integration docket or active war prevents departure."
africa_member_prepare_resistance_war: "Prepare Resistance War"
africa_member_prepare_resistance_war_desc: "Raise emergency forces and fight the Charter League leader."
africa_prepare_liberation_operation: "Prepare a Liberation Operation"
africa_prepare_liberation_operation_desc: "Commit equipment and manpower to a liberation objective."
africa_raise_border_liberation_columns: "Raise Border Liberation Columns"
africa_raise_border_liberation_columns_desc: "Spend rifles, support equipment, and manpower to form limited Charter columns for the liberation front."
africa_secure_liberation_rail_belt: "Secure the Liberation Rail Belt"
africa_secure_liberation_rail_belt_desc: "Commit support equipment to a rail and depot objective that improves Liberation Momentum and Authority."
africa_secure_liberation_objective_state: "Secure Liberation Front: [FROM.GetName]"
africa_secure_liberation_objective_state_desc: "Commit support teams, manpower, and command authority to one controlled African front state. The objective counts only if the selected state stays valid through the operation window."
africa_liberation_front_deadline_mission: "Liberation Front Deadline"
africa_liberation_front_deadline_mission_desc: "Complete the border-column, rail-belt, and front-state objectives while the Charter is at war. A stalled liberation front raises colonial confidence and weakens League cohesion."
africa_update_scramble_case_files: "Update Foreign-Holder Case Files"
africa_update_scramble_case_files_desc: "Refresh the Scramble docket for outside powers that still own or control African territory."
africa_press_scramble_treaty_settlement: "Press Scramble Treaty: [FROM.GetName]"
africa_press_scramble_treaty_settlement_desc: "Commit convoys, liaison teams, manpower, and command authority to force the targeted outside holder into a withdrawal or treaty settlement."
africa_scramble_treaty_deadline_mission: "Scramble Treaty Deadline"
africa_scramble_treaty_deadline_mission_desc: "Settle every registered outside holder in the Scramble docket while the African capital remains under Charter control."
africa_survey_paper_claim_state: "Survey Paper Claim: [FROM.GetName]"
africa_survey_paper_claim_state_desc: "Commit the integration office to a selected paper-claim state. Only one regional state operation can be active at a time."
africa_complete_living_core_state: "Complete Living Core: [FROM.GetName]"
africa_complete_living_core_state_desc: "Commit local administration and security to an owned and controlled integration state. The core is added only when the timed operation finishes."
africa_secure_integration_rail_belt: "Secure Integration Rail Belt: [FROM.GetName]"
africa_secure_integration_rail_belt_desc: "Commit rail guards and authority offices to one controlled integration state. The rail region counts only when the timed operation finishes."
africa_review_integration_temperature: "Review Integration Temperature"
africa_review_integration_temperature_desc: "Use the Integration Temperature Board to reconcile authority demands, local sovereignty, and paper-core pressure before the next integration wave."
africa_regional_integration_deadline_mission: "Regional Integration Deadline"
africa_regional_integration_deadline_mission_desc: "Turn paper claims into living cores, seat regional authorities, and secure rail belts across authority-seat regions before the campaign stalls."
africa_invite_return_cadres: "Invite Return Cadres"
africa_invite_return_cadres_desc: "Use convoys and support equipment to bring diaspora organizers, technicians, doctors, teachers, and volunteers into the Charter network."
africa_build_return_settlement: "Build Return Settlement: [FROM.GetName]"
africa_build_return_settlement_desc: "Commit settlement staff to one owned and controlled African state. The settlement is created only if the state remains held through the operation."
africa_form_diaspora_officer_schools: "Form Diaspora Officer Schools"
africa_form_diaspora_officer_schools_desc: "Turn return cadres into officer schools through support equipment, training, and Charter oversight."
africa_hold_pan_atlantic_congress: "Hold the Pan-Atlantic Congress"
africa_hold_pan_atlantic_congress_desc: "Convert the diaspora route into wider recognition, League cohesion, and sponsor preparation."
africa_open_next_historical_dossier: "Open Dossier: [GetAfricaSelectedDossierName]"
africa_open_next_historical_dossier_desc: "Fund the selected Authority Atlas survey. The dossier enters the Archive only if the survey mission is completed while its seat is secured."
africa_selected_dossier_survey_mission: "Survey Dossier: [GetAfricaSelectedDossierName]"
africa_selected_dossier_survey_mission_desc: "Complete the active old-seat survey before the record becomes another debt claim in the Archive."
africa_charter_local_dossier_office: "Charter Local Office: [GetAfricaSelectedDossierName]"
africa_charter_local_dossier_office_desc: "Create a local office for the active dossier before choosing a settlement."
africa_raise_old_seat_guard: "Raise Old-Seat Guard"
africa_raise_old_seat_guard_desc: "Commit manpower and equipment to guard the active dossier's seat, route, monument, or archive."
africa_settle_selected_dossier_observer: "Settle Dossier as Observer Seat"
africa_settle_selected_dossier_observer_desc: "Resolve the active dossier through a low-coercion observer settlement, then move to the next dossier."
africa_settle_selected_dossier_direct_archive: "Seal Dossier Under the Archive"
africa_settle_selected_dossier_direct_archive_desc: "Resolve the active dossier through central Archive authority, accepting restoration debt and resistance risk."
africa_direct_archive_seal_mission: "Prove the Direct Archive Seal"
africa_direct_archive_seal_mission_desc: "Keep the central Archive settlement believable before old-seat witnesses turn it into a public counterfeit case."
africa_archive_guard_deadline_mission: "Old-Seat Guard Deadline"
africa_archive_guard_deadline_mission_desc: "Complete a local dossier office, raise an old-seat guard, and settle the dossier before the register becomes a source of restoration debt."
africa_unlock_bestiary_package: "Bestiary Clause: [GetAfricaSelectedHighChaosPackageName]"
africa_unlock_bestiary_package_desc: "Recognize the selected impossible nonhuman or supernatural high-chaos package."
africa_negotiate_bestiary_habitat_terms: "Negotiate Bestiary Habitat Terms"
africa_negotiate_bestiary_habitat_terms_desc: "Reduce Bestiary alarm by tying high-chaos actors to specific habitat, river, coast, or forest obligations."
africa_secure_bestiary_habitat_seat: "Secure Bestiary Habitat Seat"
africa_secure_bestiary_habitat_seat_desc: "Target a Bestiary seat state and make the habitat obligation visible on the map."
africa_verify_omen_reliability: "Verify Omen Reliability"
africa_verify_omen_reliability_desc: "Commission a review of strange reports before they become forged dossiers or disaster panics."
africa_omen_reliability_review_mission: "Review Omen Reliability"
africa_omen_reliability_review_mission_desc: "Keep the Bestiary network legible while the Archive tests whether its warnings are lawful signals or volatile theater."
africa_issue_bestiary_warning_to_holder: "Issue Bestiary Warning: [FROM.GetName]"
africa_issue_bestiary_warning_to_holder_desc: "Send a verified high-chaos warning to an unsettled outside holder in the Scramble docket."
africa_issue_bestiary_warning_to_state_holder: "Warn State Holder: [FROM.GetName]"
africa_issue_bestiary_warning_to_state_holder_desc: "Send a verified high-chaos warning about an African state held by a registered outside holder."
africa_bind_bestiary_actor_to_charter: "Bind Bestiary Actor to the Charter"
africa_bind_bestiary_actor_to_charter_desc: "Target an explicit Bestiary actor and bind it to Charter limits."
africa_open_chimpanzee_marsh_scout_lines: "Open Chimpanzee Marsh Scout Lines"
africa_open_chimpanzee_marsh_scout_lines_desc: "Support the Chimpanzee Marshes as an explicit nonhuman scout assembly with field stores, interpreters, and guarded riverbank routes."
africa_seat_okapi_court_observers: "Seat Okapi Court Observers"
africa_seat_okapi_court_observers_desc: "Give the Okapi Court a quiet observer seat while Bestiary alarm is still low enough for hidden forest diplomacy."
africa_sign_termite_citadel_treaty: "Sign the Termite Citadel Treaty"
africa_sign_termite_citadel_treaty_desc: "Mark a controlled or protected state for Termite Surveyor repair crews and bind the tunnels to a hard Charter cap."
africa_open_honeyguide_route_commons: "Open Honeyguide Route Commons"
africa_open_honeyguide_route_commons_desc: "Fund Honeyguide route offices that connect habitat guides, archive messengers, and convoy clerks under Bestiary liaison rules."
africa_mark_great_herds_migration_corridor: "Mark a Great Herds Migration Corridor"
africa_mark_great_herds_migration_corridor_desc: "Protect a controlled or Charter-held corridor for the Great Herds. The route helps movement and trust but makes the impossible more visible."
africa_task_chimpanzee_telegraph_relays: "Task Chimpanzee Telegraph League Relays"
africa_task_chimpanzee_telegraph_relays_desc: "Equip the Chimpanzee Telegraph League to carry guarded front signals and scout reports through its own explicit nonhuman relay system."
africa_request_okapi_court_shadow_dossiers: "Request Okapi Shadow Dossiers"
africa_request_okapi_court_shadow_dossiers_desc: "Ask the Okapi Court for quiet forest dossiers that can expose outside exploitation without turning every witness into public theater."
africa_commission_termite_citadel_engineers: "Commission Termite Citadel Engineers"
africa_commission_termite_citadel_engineers_desc: "Fund the Termite Citadel Engineers to reinforce their capital works and bind the engineering colony to the Charter repair mandate."
africa_open_honeyguide_commons_aid_routes: "Open Honeyguide Aid Routes"
africa_open_honeyguide_commons_aid_routes_desc: "Give the Honeyguide Commons convoys and field stores for routes that connect aid, archive couriers, and habitat messengers."
africa_muster_great_herds_relief_columns: "Muster Great Herds Relief Columns"
africa_muster_great_herds_relief_columns_desc: "Support the Great Herds as it gathers visible relief columns for threatened Charter corridors."
africa_invoke_bonobo_kinship_gentle_veto: "Invoke the Bonobo Kinship Gentle Veto"
africa_invoke_bonobo_kinship_gentle_veto_desc: "Let the Bonobo Kinship Congress exercise a recorded veto against forced Bestiary handling while the Charter still has the trust to honor it."
africa_broadcast_hyena_radio_misdirection: "Broadcast Hyena Radio Misdirection"
africa_broadcast_hyena_radio_misdirection_desc: "Fund guarded night broadcasts that mislead outside hunters and counterfeit observers without cutting the Charter off from its real routes."
africa_confirm_bird_of_the_walls_warning: "Confirm the Bird of the Walls Warning"
africa_confirm_bird_of_the_walls_warning_desc: "Use a verified omen network to act on the Bird of the Walls before the warning becomes another dismissed superstition."
africa_field_sao_terracotta_line: "Field the Sao Terracotta Line"
africa_field_sao_terracotta_line_desc: "Equip the Sao Terracotta Host to hold a visible old-seat line with kilns, stores, and Charter limits."
africa_call_gorilla_highlands_forest_guard: "Call the Gorilla Highlands Forest Guard"
africa_call_gorilla_highlands_forest_guard_desc: "Send rifles, interpreters, and field stores to the Gorilla Highlands so its seat can defend forest corridors under Charter limits."
africa_ask_crocodile_rivers_to_hold_crossings: "Ask the Crocodile Rivers to Hold Crossings"
africa_ask_crocodile_rivers_to_hold_crossings_desc: "Commit boats, river clerks, and command liaisons so the Crocodile Rivers can watch hostile ferries and crossings."
africa_convene_baobab_memory_arbitration: "Convene Baobab Memory Arbitration"
africa_convene_baobab_memory_arbitration_desc: "Bring archivists and officers before the Baobab Senate to settle old-seat testimony without handing the roots a blank mandate."
africa_keep_tidemark_convoy_watch: "Keep the Tidemark Dominion Convoy Watch"
africa_keep_tidemark_convoy_watch_desc: "Assign convoys and coastal interpreters to the Tidemark Dominion before port warnings become another panic."
africa_audit_ananse_counterfeit_treaties: "Audit Ananse Counterfeit Treaties"
africa_audit_ananse_counterfeit_treaties_desc: "Give the Ananse Web a supervised treaty audit, exposing false signatures before they travel as real diplomatic paper."
africa_call_orisha_vodun_nature_court: "Call the Orisha/Vodun Nature Court"
africa_call_orisha_vodun_nature_court_desc: "Invite the Nature Courts to judge a Covenant case. The ruling strengthens authority, but no one mistakes it for ordinary politics."
africa_bestiary_containment_deadline_mission: "Bestiary Containment Deadline"
africa_bestiary_containment_deadline_mission_desc: "Negotiate habitat terms, secure Bestiary habitat seats, verify omen reliability, complete Bestiary actions, and bind at least one Bestiary actor before mythic volatility spreads through the Charter."
africa_prepare_continent_sponsor_mission: "Prepare a Sponsor Mission"
africa_prepare_continent_sponsor_mission_desc: "Open the proof mission that makes Africa's own continental mandate readable enough to sponsor another union."
africa_continent_sponsor_readiness_mission: "Sponsor Readiness Mission"
africa_continent_sponsor_readiness_mission_desc: "Prove that Africa has a continental register, enough regional authorities, living cores, and historical dossier coverage before the sponsor office overreaches."
africa_sponsor_middle_east_charter: "Sponsor a Middle East Charter"
africa_sponsor_middle_east_charter_desc: "Send convoys, liaison staff, and congress organizers toward a Nile-to-Euphrates charter route."
africa_sponsor_asia_charter: "Sponsor an Asia Charter"
africa_sponsor_asia_charter_desc: "Commit ports, equipment, manpower, and command staff to a wider Afro-Asian congress route."
africa_sponsor_europe_charter: "Sponsor a Europe Charter"
africa_sponsor_europe_charter_desc: "Back a dangerous European congress route after the World Root mandate makes Africa a world-chaos pole."
africa_sponsor_south_atlantic_charter: "Sponsor a South Atlantic Charter"
africa_sponsor_south_atlantic_charter_desc: "Use the Pan-Atlantic Congress, return networks, ports, and convoys to prepare an Afro-Atlantic union route."
africa_proclaim_dynamic_cross_continent_union: "Proclaim [GetAfricaDynamicCrossContinentUnionName]"
africa_proclaim_dynamic_cross_continent_union_desc: "Bind prepared sponsor routes into a cross-continent union identity below the terminal World Is One threshold."
africa_verify_middle_east_unifier_proof: "Verify the Middle East Charter Proof"
africa_verify_middle_east_unifier_proof_desc: "Audit Nile-to-Euphrates charter papers, rail manifests, and liaison records before they enter the Congress of Continents ledger."
africa_verify_asia_unifier_proof: "Verify the Asia Charter Proof"
africa_verify_asia_unifier_proof_desc: "Hold the Afro-Asian congress route under review through port lists, arms ledgers, and liberation delegates."
africa_verify_europe_unifier_proof: "Verify the Europe Charter Proof"
africa_verify_europe_unifier_proof_desc: "Keep the European charter route under military-record, political-witness, and World Root treaty scrutiny."
africa_verify_south_atlantic_unifier_proof: "Verify the South Atlantic Charter Proof"
africa_verify_south_atlantic_unifier_proof_desc: "Hold the Atlantic return route against convoy manifests, port offices, and the Pan-Atlantic Congress."
africa_certify_continent_unifiers_for_world_is_one: "Certify the Congress of Continents"
africa_certify_continent_unifiers_for_world_is_one_desc: "Place the verified continent mandates, the cross-continent union, the settled Bestiary terms, and Africa's own final thresholds before the Congress of Continents."
africa_prepare_world_is_one_gate: "Prepare the World Is One Gate"
africa_prepare_world_is_one_gate_desc: "Seat the last Charter gate before the final focus names the world under one mandate."
africa_rsa_secure_charter_supply: "Secure Charter Supply"
africa_rsa_secure_charter_supply_desc: "Strengthen the continental side during the RSA civil war."
africa_rsa_hold_mine_port_belt: "Hold the Mine-Port Belt"
africa_rsa_hold_mine_port_belt_desc: "Commit manpower and rifles to hold the mines, ports, and rail yards that keep the continental side alive."
africa_rsa_force_allied_negotiators: "Force Allied Negotiators"
africa_rsa_force_allied_negotiators_desc: "Use political pressure and battlefield proof to make Allied negotiators recognize the continental side."
africa_rsa_prepare_victory_settlement: "Prepare the Victory Settlement"
africa_rsa_prepare_victory_settlement_desc: "After continental victory and Allied peace, settle South Africa inside the Charter framework."
africa_rsa_pretoria_deadline_mission: "Pretoria Deadline"
africa_rsa_pretoria_deadline_mission_desc: "Hold the mine-port belt, force Allied negotiators, win the continental civil-war settlement, and secure Allied peace before the branch loses momentum."

africa_convene_continental_congress_req_tt: "Africa must be the active Charter country."
africa_convene_continental_congress_effect_tt: "Raises §YLegitimacy§! and §YLeague Cohesion§!."
africa_publish_charter_register_req_tt: "Africa must be the active Charter country."
africa_publish_charter_register_effect_tt: "Refreshes Charter invitation and paper-core target lists."
africa_offer_charter_seat_root_req_tt: "Requires the Charter mandate focus."
africa_offer_charter_seat_target_req_tt: "The target must be an eligible African Charter candidate."
africa_offer_charter_seat_effect_tt: "Sends the target the Charter League event."
africa_send_league_aid_root_req_tt: "Requires the Charter General Staff and no active member confidence mission."
africa_send_league_aid_target_req_tt: "The target must be a warring Charter-side country that has not capitulated."
africa_send_league_aid_cost_tt: "£pol_power §Y35§!  £infantry_equipment_text_icon §Y450§!  £support_equipment_text_icon §Y60§!"
africa_send_league_aid_cost_tt_blocked: "£pol_power §R35§!  £infantry_equipment_text_icon §R450§!  £support_equipment_text_icon §R60§!"
africa_send_league_aid_cost_tt_tooltip: "Spends £pol_power §Y35§!, then transfers £infantry_equipment_text_icon §Y450§! and £support_equipment_text_icon §Y60§! from the League leader to the target."
africa_send_league_aid_effect_tt: "Transfers manpower, rifles, and support equipment to the target and starts a member confidence mission."
africa_open_aid_corridor_root_req_tt: "Requires the Charter General Staff and no active aid corridor."
africa_open_aid_corridor_target_req_tt: "The target must be at war, not capitulated, and inside the Charter relationship."
africa_open_aid_corridor_cost_tt: "£pol_power §Y50§!  £command_power §Y15§!  £support_equipment_text_icon §Y90§!  £convoy_texticon §Y8§!  £GFX_train_texticon §Y2§!"
africa_open_aid_corridor_cost_tt_blocked: "£pol_power §R50§!  £command_power §R15§!  £support_equipment_text_icon §R90§!  £convoy_texticon §R8§!  £GFX_train_texticon §R2§!"
africa_open_aid_corridor_cost_tt_tooltip: "Spends £pol_power §Y50§! and £command_power §Y15§!, then transfers £support_equipment_text_icon §Y90§!, £convoy_texticon §Y8§!, and £GFX_train_texticon §Y2§! from the League leader to the target."
africa_open_aid_corridor_effect_tt: "Opens a target-bound aid corridor, gives the target manpower and logistics equipment, raises Liberation Momentum, and starts the Aid Corridor Deadline."
africa_member_confidence_mission_available_tt: "The active aid target must still exist, remain in the Charter relationship, avoid capitulation, and finish its war."
africa_member_confidence_mission_success_tt: "The aided Charter member survives its war without breaking from the League. Cohesion and Regional Trust rise."
africa_member_confidence_mission_failure_tt: "The aided Charter member fails to turn League aid into a durable settlement before the deadline. Colonial Alarm rises and League Cohesion falls."
africa_aid_corridor_mission_available_tt: "The active corridor target must still exist, remain in the Charter relationship, avoid capitulation, and finish its war."
africa_aid_corridor_mission_success_tt: "The corridor proves that the League can defend a member through logistics instead of annexation. League Cohesion and Regional Trust rise."
africa_aid_corridor_mission_failure_tt: "The corridor fails to produce a durable settlement before the deadline. Colonial Alarm rises and League Cohesion falls."
africa_aid_corridor_status.none: "No active route"
africa_aid_corridor_status.active: "Corridor open"
africa_aid_corridor_status.kept: "Route proven"
africa_aid_corridor_status.broken: "Route broken"
