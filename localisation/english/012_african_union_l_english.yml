africa_action_result_disrupt_expedition_planning_partial: "One member withdraws support."
africa_action_result_disrupt_expedition_planning_failure: "Operation exposed and coalition unity rises."
africa_action_result_offer_base_withdrawal_treaty_full: "Base withdrawn or converted to limited treaty access."
africa_action_result_offer_base_withdrawal_treaty_partial: "Long transition."
africa_action_result_offer_base_withdrawal_treaty_failure: "Talks fail and fortification expands."
africa_action_result_call_global_anti_colonial_conference_full: "Recognition network and foreign movements strengthen."
africa_action_result_call_global_anti_colonial_conference_partial: "Symbolic conference."
africa_action_result_call_global_anti_colonial_conference_failure: "Repression or boycott reduces effect."
africa_action_result_break_intervention_coalition_full: "Coalition loses enough members to cancel war."
africa_action_result_break_intervention_coalition_partial: "Intervention delayed."
africa_action_result_break_intervention_coalition_failure: "Coalition hardens and launches expedition."
africa_action_result_sponsor_continent_unifier_full: "The target receives a full unification settlement and an alliance link."
africa_action_result_sponsor_continent_unifier_partial: "The movement gains a limited regional role."
africa_action_result_sponsor_continent_unifier_failure: "The sponsorship fails or creates a hostile client."
africa_action_result_mediate_continent_union_full: "A two-continent union forms."
africa_action_result_mediate_continent_union_partial: "The partners settle for a confederation or alliance."
africa_action_result_mediate_continent_union_failure: "Talks fail and rivalry intensifies."
africa_action_result_prepare_continental_war_full: "A war goal and campaign plan are prepared."
africa_action_result_prepare_continental_war_partial: "A limited proxy conflict begins."
africa_action_result_prepare_continental_war_failure: "The preparation is exposed and the rival strikes first."
africa_action_result_force_continent_submission_full: "The rival is integrated, federated, or annexed under the chosen settlement."
africa_action_result_force_continent_submission_partial: "A temporary armistice leaves the continent unsettled."
africa_action_result_force_continent_submission_failure: "Resistance returns and continental war resumes."
africa_action_result_form_dynamic_two_continent_union_full: "A public convention opens. Constituent ballots and the constitutional, defence, resource, withdrawal, and faction clauses will decide whether the union forms."
africa_action_result_form_dynamic_two_continent_union_partial: "A loose dual federation holds."
africa_action_result_form_dynamic_two_continent_union_failure: "Member revolt or leadership crisis."
africa_action_result_declare_the_world_is_one_full: "The World settlement is proclaimed and the final ceremony begins."
africa_action_result_declare_the_world_is_one_partial: "No partial settlement is available."
africa_action_result_declare_the_world_is_one_failure: "The declaration cannot proceed until all required conditions are satisfied."
africa_action_result_administer_world_regions_full: "The settled regions enter the chosen administration and a public epilogue follows."
africa_action_result_administer_world_regions_partial: "Some regions retain autonomy."
africa_action_result_administer_world_regions_failure: "Global revolt follows if the burden is ignored."
africa_action_result_contain_terminal_high_chaos_full: "The remaining actors are integrated, contained, or defeated."
africa_action_result_contain_terminal_high_chaos_partial: "A regional truce holds."
africa_action_result_contain_terminal_high_chaos_failure: "The disaster continues after the world settlement."
africa_action_result_convene_federal_deadlock_conference_full: "A compromise formula, executive adjustment, or bounded exception restores congress function."
africa_action_result_convene_federal_deadlock_conference_partial: "One disputed action proceeds under a temporary rule while deadlock pressure remains."
africa_action_result_convene_federal_deadlock_conference_failure: "Emergency rule debt rises, one strong member gains withdrawal support, and the blocked agenda remains closed."
africa_action_result_conduct_first_continental_election_full: "A recognised government takes office and regional acceptance is recorded."
africa_action_result_conduct_first_continental_election_partial: "The government is elected but one or more regions require a rerun, autonomy settlement, or observer mission."
africa_action_result_conduct_first_continental_election_failure: "Boycott, fraud, or insecurity creates an emergency republic and raises coup and secession pressure."
africa_action_result_arbitrate_continental_succession_full: "A locally accepted ruler, regency, civic settlement, or constitutional conversion resolves the dispute."
africa_action_result_arbitrate_continental_succession_partial: "A temporary regency prevents war but claimant legitimacy remains contested."
africa_action_result_arbitrate_continental_succession_failure: "Rival claimants mobilise, royal-bloc cohesion falls, and the target may leave or form a rival court."
africa_action_result_balance_food_and_industrial_plan_full: "Food supply stabilises while the selected industrial programme remains functional."
africa_action_result_balance_food_and_industrial_plan_partial: "Food or industry is preserved, while the other side loses output and demands a new settlement."
africa_action_result_balance_food_and_industrial_plan_failure: "Shortages, strikes, rural resistance, or coercive requisition raise bureaucratic pressure and regional distrust."
africa_action_result_review_victorious_commander_loyalty_full: "The commander accepts rotation, constitutional subordination, retirement, or a defined lawful office."
africa_action_result_review_victorious_commander_loyalty_partial: "The commander remains in place under monitoring and reduced independent access."
africa_action_result_review_victorious_commander_loyalty_failure: "Loyalty crisis, rogue command, coup pressure, or regional mutiny begins."
africa_action_result_ratify_confederal_emergency_action_full: "Enough members ratify the action and define its limits."
africa_action_result_ratify_confederal_emergency_action_partial: "A smaller coalition keeps the action while dissenting members receive an opt-out."
africa_action_result_ratify_confederal_emergency_action_failure: "The action lapses, exit contagion rises, and one member may challenge League leadership."
africa_action_result_review_covenant_obligation_full: "The obligation is renewed with limits, safely ended, or replaced by a contained settlement."
africa_action_result_review_covenant_obligation_partial: "Temporary calm is restored while a follow-up boundary or evacuation mission remains."
africa_action_result_review_covenant_obligation_failure: "Wrath rises, the actor breaches containment, or human members revolt against the arrangement."
africa_action_result_hold_postwar_constitutional_review_full: "The chosen constitution absorbs or dismantles wartime powers and opens its post-unification programme."
africa_action_result_hold_postwar_constitutional_review_partial: "Some emergency institutions end while one major issue becomes a dedicated crisis branch."
africa_action_result_hold_postwar_constitutional_review_failure: "Coup, secession, election boycott, succession dispute, or confederal exit crisis emerges according to route."
africa_action_result_recover_failed_host_proof_full: "The host restores enough authority and confidence to convene the League without erasing the remembered failure."
africa_action_result_recover_failed_host_proof_partial: "The League opens with reduced authority and a mandatory oversight or autonomy clause."
africa_action_result_recover_failed_host_proof_failure: "The host loses its founding mandate and must rebuild through a regional coalition or crisis route."
africa_action_result_promote_priority_member_package_full: "The country receives its recognised role, armed forces, political programme, and League relationship."
africa_action_result_promote_priority_member_package_partial: "The candidate gains autonomy or association and can qualify again after one missing condition is solved."
africa_action_result_promote_priority_member_package_failure: "Overlap dispute, access failure, or local refusal returns it to compact status and raises regional tension."
africa_action_result_cancelled: "The court closed the operation before its obligations could be completed."
africa_action_result_pending: "The court has not yet entered a final disposition."
africa_action_name_guarantee_sovereignty: "Guarantee Sovereignty"
africa_select_guarantee_sovereignty: "Guarantee Sovereignty"
africa_select_guarantee_sovereignty_desc: "This action requires shared border or access, target not hostile, capacity available. It commits command attention plus infantry equipment and diplomatic exposure scaled by target size. Full success means target becomes protected partner and gains confidence. Partial success means limited guarantee with lower confidence when access is weak. Failure means authority loss if guarantee is later broken. The guarantee ends if the target is annexed, joins a hostile bloc, or enters the Charter as a member."
africa_action_name_open_aid_corridor: "Open Aid Corridor"
africa_select_open_aid_corridor: "Open Aid Corridor"
africa_select_open_aid_corridor_desc: "This action requires route access, convoy or train capacity, equipment stockpile. It commits convoys or trains plus equipment and temporary civilian capacity scaled by distance. Full success means supply and confidence improve, corridor becomes active. Partial success means reduced aid arrives with attrition and smaller confidence gain. Failure means equipment lost, authority falls, corridor exposure rises. The corridor closes after peace, route loss, target defeat, or a decision to cancel it."
africa_action_name_dispatch_charter_mission: "Dispatch Charter Mission"
africa_select_dispatch_charter_mission: "Dispatch Charter Mission"
africa_select_dispatch_charter_mission_desc: "This action requires diplomatic staff, political attention, transport, and local security. It commits political power, support equipment, and local access scaled by hostility. Full success reveals the target's accession preferences and raises confidence. Partial success reveals only some clauses and creates local opposition. Failure expels the mission, lowers confidence, and strengthens rival influence. The mission ends after its work is complete or its target can no longer receive it."
africa_action_name_deploy_volunteers: "Deploy Volunteers"
africa_select_deploy_volunteers: "Deploy Volunteers"
africa_select_deploy_volunteers_desc: "This action requires volunteer access, units available, target accepts help. It commits trained divisions, equipment, command power, supply burden. Full success means target survives, confidence rises, League invitation unlocks. Partial success means front stabilises without decisive victory. Failure means volunteers destroyed or target capitulates, authority loss. The mission ends when the volunteers return, access closes, or the war and target's fate settle the operation."
africa_action_name_intervene_against_coloniser: "Intervene Against Coloniser"
africa_select_intervene_against_coloniser: "Intervene Against Coloniser"
africa_select_intervene_against_coloniser_desc: "This action requires authority threshold, readiness threshold, and valid war access. It commits equipment, fuel, trains, manpower, diplomatic cost. Full success means war or forced settlement begins with target protected. Partial success means limited intervention through volunteers and sanctions. Failure means unprepared escalation lowers authority and raises burden. The intervention ends if peace returns, the target is destroyed, or another war takes over the crisis."
africa_action_name_evacuate_leaders_archives: "Evacuate Leaders Archives"
africa_select_evacuate_leaders_archives: "Evacuate Leaders Archives"
africa_select_evacuate_leaders_archives_desc: "This action requires route exists and leaders consent. It commits air transport or convoys, intelligence capacity, command power. Full success means government in exile, leaders, archives, and legitimacy preserved. Partial success means partial evacuation preserves either leaders or archives. Failure means route closes and confidence collapses. The evacuation ends when the people at risk are safe, the transports return, or an exile government is established."
africa_action_name_recognise_provisional_government: "Recognise Provisional Government"
africa_select_recognise_provisional_government: "Recognise Provisional Government"
africa_select_recognise_provisional_government_desc: "This action requires diplomatic credibility, relations cost with colonial holder. It commits political power plus equipment or funds scaled by legitimacy. Full success means movement gains legitimacy and League access. Partial success means symbolic recognition without material aid. Failure means false partner scandal lowers authority. Recognition ends when the government becomes a state, collapses, or joins a rival bloc."
africa_action_name_secure_border_sanctuary: "Secure Border Sanctuary"
africa_select_secure_border_sanctuary: "Secure Border Sanctuary"
africa_select_secure_border_sanctuary_desc: "This action requires garrison divisions, supply, local support. It commits infantry equipment, trains, tied divisions, stability risk. Full success means movement gains safe base and recruitment. Partial success means base remains hidden but weak. Failure means foreign raid or local backlash damages host. The sanctuary closes after independence, exposure, or destruction of the protected movement."
africa_action_name_break_blockade: "Break Blockade"
africa_select_break_blockade: "Break Blockade"
africa_select_break_blockade_desc: "This action requires naval access, fuel, convoys, aircraft or ships. It commits fuel, convoys, naval or air XP, repair risk. Full success means port corridor opens and confidence rises. Partial success means limited deliveries pass. Failure means ships or aircraft lost, colonial pressure rises. The effort ends when the blockade ends, the port is lost, or the member leaves."
africa_action_name_emergency_relief_column: "Emergency Relief Column"
africa_select_emergency_relief_column: "Emergency Relief Column"
africa_select_emergency_relief_column_desc: "This action requires route access and relief stockpile. It commits trucks, trains, support equipment, manpower, civilian factories. Full success means deaths and local damage fall, confidence rises. Partial success means some relief reaches target. Failure means relief fails or spreads disease, trust falls. The relief effort ends when the teams finish their work and temporary access is withdrawn."
africa_action_name_offer_defence_charter: "Offer Defence Charter"
africa_select_offer_defence_charter: "Offer Defence Charter"
africa_select_offer_defence_charter_desc: "This action requires defence commitment and common reserve capacity. It commits equipment pledge, command capacity, future defence obligation. Full success means target becomes associate or chartered member. Partial success means target accepts only guarantee and observers. Failure means target refuses and may seek rival patron. The offer ends after the government gives its answer."
africa_action_name_offer_development_charter: "Offer Development Charter"
africa_select_offer_development_charter: "Offer Development Charter"
africa_select_offer_development_charter_desc: "This action requires project capacity and target consent. It commits civilian factories, trains, convoys, engineers. Full success means target joins with development clauses. Partial success means target accepts bilateral project only. Failure means project scandal or debt concern lowers trust. The offer ends when it becomes a project or the target refuses it."
africa_action_name_offer_federal_charter: "Offer Federal Charter"
africa_select_offer_federal_charter: "Offer Federal Charter"
africa_select_offer_federal_charter_desc: "This action requires constitutional capacity and regional congress support. It commits authority commitment, seats, autonomy guarantees, integration capacity. Full success means target becomes autonomous federal member. Partial success means target requests extra autonomy and delay. Failure means target refuses and confidence falls. The offer ends when the settlement is accepted, revised, or refused."
africa_action_name_offer_crown_charter: "Offer Crown Charter"
africa_select_offer_crown_charter: "Offer Crown Charter"
africa_select_offer_crown_charter_desc: "This action requires a recognised ruler, succession rules, and representation. It commits court recognition, ceremonial costs, and a guard commitment. Full success brings the monarchy into the Charter while preserving its crown. Partial success grants associate status until the succession is settled. Failure creates a rival claimant through dynastic dispute. The offer ends after the succession settlement or any civil conflict."
africa_action_name_offer_peoples_charter: "Offer Peoples Charter"
africa_select_offer_peoples_charter: "Offer Peoples Charter"
africa_select_offer_peoples_charter_desc: "This action requires worker, peasant, or party congress support. It commits equipment aid, organisers, factory burden, ideological exposure. Full success means target joins people’s union structure. Partial success means coalition joins with autonomy protections. Failure means internal opposition starts crisis. The offer ends when the organisers leave and the opposition is settled."
africa_action_name_offer_security_charter: "Offer Security Charter"
africa_select_offer_security_charter: "Offer Security Charter"
africa_select_offer_security_charter_desc: "This action requires common command access and host readiness. It commits officer teams, equipment, tied divisions, legitimacy cost. Full success means target joins under security obligations. Partial success means temporary command mission only. Failure means accusations of occupation damage confidence. The command mission ends when the crisis resolves or the member leaves."
africa_action_name_offer_sacred_ecological_compact: "Offer Sacred Ecological Compact"
africa_select_offer_sacred_ecological_compact: "Offer Sacred Ecological Compact"
africa_select_offer_sacred_ecological_compact_desc: "This action requires ritual or ecological bargaining authority. It commits ecological concessions, restricted development, offerings, or relief work. Full success means the selected government joins or cooperates under special ecological clauses. Partial success means a temporary truce or disaster restraint. Failure means ecological wrath rises and the selected government becomes hostile. The compact ends after betrayal, withdrawal, the closing of the covenant route, or the government's destruction."
africa_action_name_renegotiate_accession_clauses: "Renegotiate Accession Clauses"
africa_select_renegotiate_accession_clauses: "Renegotiate Accession Clauses"
africa_select_renegotiate_accession_clauses_desc: "This action requires representation capacity and no active secession war. It commits political attention plus concessions selected by route. Full success means confidence recovers and obligations update. Partial success means temporary freeze on departure. Failure means talks fail and departure mission starts. The negotiation ends when the revised clauses replace the old terms."
africa_action_name_hold_accession_referendum: "Hold Accession Referendum"
africa_select_hold_accession_referendum: "Hold Accession Referendum"
africa_select_hold_accession_referendum_desc: "This action requires local institutions function with security, ballot administration, and free access. It commits civilian capacity, security units, political risk. Full success means result determines membership with legitimacy bonus. Partial success means narrow or disputed result delays settlement. Failure means violence or fraud causes confidence and authority loss. The referendum ends after the vote, and another ballot requires a new constitutional settlement."
africa_action_name_admit_member_in_emergency: "Admit Member In Emergency"
africa_select_admit_member_in_emergency: "Admit Member In Emergency"
africa_select_admit_member_in_emergency_desc: "This action requires minimum confidence and contact exists. It commits equipment, guarantee, emergency authority, burden spike. Full success means target becomes emergency member and receives defence. Partial success means protected partner status only. Failure means emergency accession becomes dependency scandal. The emergency settlement ends when the mandatory postwar constitutional review begins."
africa_action_name_convene_regional_congress: "Convene Regional Congress"
africa_select_convene_regional_congress: "Convene Regional Congress"
africa_select_convene_regional_congress_desc: "This action requires authority threshold, safe venue, delegate access. It commits political power, trains or convoys, security, civilian capacity. Full success means congress opens with proposal choices. Partial success means limited conference handles only one dispute. Failure means boycott lowers authority and empowers rival bloc. The congress ends after its public decision and the delegates return home."
africa_action_name_settle_overlapping_claims: "Settle Overlapping Claims"
africa_select_settle_overlapping_claims: "Settle Overlapping Claims"
africa_select_settle_overlapping_claims_desc: "This action requires mediation, maps, local consultation, enforcement capacity. It commits political attention, survey teams, security, possible compensation. Full success means border or federal settlement accepted. Partial success means temporary condominium or autonomy zone. Failure means one claimant leaves or fights. The settlement ends when the final boundaries are accepted and the old dispute is laid aside."
africa_action_name_create_regional_charter: "Create Regional Charter"
africa_select_create_regional_charter: "Create Regional Charter"
africa_select_create_regional_charter_desc: "This action requires minimum members and administrative readiness. It commits representation seats, bureaucracy, development commitment. Full success means regional charter government created. Partial success means loose court created with limited powers. Failure means charter collapses into rival blocs. The congress ends when the regional government takes its place."
africa_action_name_form_regional_federation: "Form Regional Federation"
africa_select_form_regional_federation: "Form Regional Federation"
africa_select_form_regional_federation_desc: "This action requires federal constitution and integration capacity. It commits administrative manpower, equipment for common security, civilian factories. Full success means federated region created with autonomy. Partial success means partial federation excludes dissenters. Failure means civil conflict or departure crisis. The federation settles when its members are integrated, opt-outs are protected, and the congress finishes its work."
africa_action_name_restore_historical_polity: "Restore Historical Polity"
africa_select_restore_historical_polity: "Restore Historical Polity"
africa_select_restore_historical_polity_desc: "This action requires candidate source review and viable territory. It commits administrative capacity, guard force, symbolic and economic costs. Full success means restored polity becomes member or autonomous subject. Partial success means symbolic cultural authority without sovereignty. Failure means rival claim or legitimacy crisis. The restoration ends once the polity is established and incompatible claims are settled."
africa_action_name_approve_direct_integration_schedule: "Approve Direct Integration Schedule"
africa_select_approve_direct_integration_schedule: "Approve Direct Integration Schedule"
africa_select_approve_direct_integration_schedule_desc: "This action requires administrative capacity, representation, local security. It commits bureaucracy, equipment, civilian capacity, integration burden. Full success means staged integration begins. Partial success means autonomous federal status extends. Failure means resistance rises and schedule pauses. The schedule becomes a set of integration projects after the congress reaches its decision."
africa_action_name_guarantee_regional_representation: "Guarantee Regional Representation"
africa_select_guarantee_regional_representation: "Guarantee Regional Representation"
africa_select_guarantee_regional_representation_desc: "This action requires available seats and constitutional route. It commits political concession and limits on central appointments. Full success means confidence rises and secession risk falls. Partial success means temporary observer seats. Failure means other regions demand equal treatment. The representation settlement ends when seats are allocated and the regional demand is answered."
africa_action_name_fund_congress_security: "Fund Congress Security"
africa_select_fund_congress_security: "Fund Congress Security"
africa_select_fund_congress_security_desc: "This action requires security units and local consent. It commits support equipment, tied divisions, intelligence exposure. Full success means congress continues safely. Partial success means minor incidents delay votes. Failure means crackdown scandal or attack ends congress. The security detail stands down after the congress concludes."
africa_action_name_invite_diaspora_delegates: "Invite Diaspora Delegates"
africa_select_invite_diaspora_delegates: "Invite Diaspora Delegates"
africa_select_invite_diaspora_delegates_desc: "This action requires delegate representation rules. It commits convoys, travel funds, security, political controversy. Full success means diaspora trust and expertise improve proposals. Partial success means observer role only. Failure means delegates excluded or attacked, trust falls. The invitation ends after the congress and the delegates' return."
africa_action_name_enforce_congress_settlement: "Enforce Congress Settlement"
africa_select_enforce_congress_settlement: "Enforce Congress Settlement"
africa_select_enforce_congress_settlement_desc: "This action requires enforcement capacity and route permission. It commits sanctions, equipment, tied forces, authority risk. Full success means compliance restored. Partial success means partial compliance and renewed talks. Failure means war or rival bloc expansion. Enforcement ends after compliance, war, or replacement of the settlement."
africa_action_name_build_administrative_bridge: "Build Administrative Bridge"
africa_select_build_administrative_bridge: "Build Administrative Bridge"
africa_select_build_administrative_bridge_desc: "This action requires local officials, language support, representation. It commits administrative manpower, civilian factories, support equipment. Full success means administration compatibility improves. Partial success means limited offices open with delay. Failure means corruption or boycott increases burden. The bridge project ends when the offices are established and integration advances."
africa_action_name_connect_member_capitals: "Connect Member Capitals"
africa_select_connect_member_capitals: "Connect Member Capitals"
africa_select_connect_member_capitals_desc: "This action requires rail, road, river, air, or sea link possible. It commits trains, convoys, civilian factories, fuel, local labour. Full success means reach rises and integration costs fall. Partial success means partial link improves supply only. Failure means project stalls, burden and local frustration rise. The connection ends when construction is complete or cancelled and capacity is released."
africa_action_name_standardise_customs: "Standardise Customs"
africa_select_standardise_customs: "Standardise Customs"
africa_select_standardise_customs_desc: "This action requires member consent and administrative capacity. It commits short-term revenue loss, political effort, inspection staff. Full success means trade improves and regional market opens. Partial success means limited customs corridor. Failure means smuggling and elite resistance rise. The customs settlement ends when the common system replaces bilateral arrangements."
africa_action_name_integrate_security_services: "Integrate Security Services"
africa_select_integrate_security_services: "Integrate Security Services"
africa_select_integrate_security_services_desc: "This action requires shared intelligence rules and oversight. It commits intelligence capacity, equipment, legitimacy risk. Full success means counter-subversion improves and rival pressure falls. Partial success means liaison office only. Failure means abuse scandal lowers confidence. The integration ends when the temporary agents leave and route-specific oversight remains."
africa_action_name_harmonise_officer_corps: "Harmonise Officer Corps"
africa_select_harmonise_officer_corps: "Harmonise Officer Corps"
africa_select_harmonise_officer_corps_desc: "This action requires training access, language teams, doctrine compatibility. It commits army XP, equipment, training time, command slots. Full success means joint command and templates improve. Partial success means shared exercises only. Failure means officer resistance or coup pressure. The training mission ends when officer integration is complete."
africa_action_name_negotiate_autonomy_statute: "Negotiate Autonomy Statute"
africa_select_negotiate_autonomy_statute: "Negotiate Autonomy Statute"
africa_select_negotiate_autonomy_statute_desc: "This action requires representation, fiscal terms, security clauses. It commits political concession and reduced central revenue. Full success means member becomes stable autonomous federal member. Partial success means temporary autonomy delays departure. Failure means talks fail and rival bloc gains support. The talks end when the statute is agreed and incompatible integration plans are set aside."
africa_action_name_launch_local_settlement_programme: "Launch Local Settlement Programme"
africa_select_launch_local_settlement_programme: "Launch Local Settlement Programme"
africa_select_launch_local_settlement_programme_desc: "This action requires local consultation and security. It commits civilian factories, administrative manpower, compensation. Full success means local support improves and resistance falls. Partial success means one district settles while others remain disputed. Failure means forced settlement raises resistance. The programme ends when each district is settled or the effort is abandoned."
africa_action_name_grant_core_recognition: "Grant Core Recognition"
africa_select_grant_core_recognition: "Grant Core Recognition"
africa_select_grant_core_recognition_desc: "This action requires stable control, low resistance, representation, route condition. It commits administrative commitment and permanent constitutional obligation. Full success means claims become cores or equivalent integrated status. Partial success means limited core group while disputed areas remain claims. Failure means premature grant causes rebellion or overextension. The settlement ends when obsolete integration plans are set aside and minority protections remain."
africa_action_name_impose_emergency_administration: "Impose Emergency Administration"
africa_select_impose_emergency_administration: "Impose Emergency Administration"
africa_select_impose_emergency_administration_desc: "This action requires military access and central authority. It commits tied divisions, equipment, stability, legitimacy, colonial pressure. Full success means order restored and review mission starts. Partial success means capital secured but countryside resists. Failure means occupation war and mass departure. The administration ends at its mandatory sunset, after review, or when it becomes an occupation government."
africa_action_name_federalise_restored_polities: "Federalise Restored Polities"
africa_select_federalise_restored_polities: "Federalise Restored Polities"
africa_select_federalise_restored_polities_desc: "This action requires member consent and shared institutions. It commits representation seats, administrative capacity, treasury contribution. Full success means restored states form durable federal chamber. Partial success means consultative chamber only. Failure means dynastic rivalry breaks federation. The federation begins when the chamber is formed and duplicate court negotiations end."
africa_action_name_survey_continental_resources: "Survey Continental Resources"
africa_select_survey_continental_resources: "Survey Continental Resources"
africa_select_survey_continental_resources_desc: "This action requires engineers, geological teams, security. It commits civilian factories, trucks, fuel, survey equipment. Full success means resource projects and processing routes unlock. Partial success means partial survey reveals one project. Failure means teams expelled or lost. The survey ends when the teams return and the discoveries are ready for development."
africa_action_name_build_regional_rail_spine: "Build Regional Rail Spine"
africa_select_build_regional_rail_spine: "Build Regional Rail Spine"
africa_select_build_regional_rail_spine_desc: "This action requires route survey, supply need, construction access. It commits civilian factories, trains, steel, local labour. Full success means rail, supply, reach, and confidence improve. Partial success means partial line opens. Failure means cost overrun and local opposition. The rail project ends when construction capacity is released and the corridor opens."
africa_action_name_expand_river_transport: "Expand River Transport"
africa_select_expand_river_transport: "Expand River Transport"
africa_select_expand_river_transport_desc: "This action requires boats, docks, local agreements. It commits convoys, civilian factories, fuel, engineering. Full success means river supply and trade network opens. Partial success means seasonal route only. Failure means flood, sabotage, or local refusal. The river project ends when temporary works close and ecological clauses remain in force."
africa_action_name_modernise_continental_port: "Modernise Continental Port"
africa_select_modernise_continental_port: "Modernise Continental Port"
africa_select_modernise_continental_port_desc: "This action requires dock capacity and local consent. It commits civilian factories, convoys, steel, coastal security. Full success means port capacity, navy, trade, and diaspora access improve. Partial success means commercial expansion without military facilities. Failure means foreign sabotage or debt crisis. The port project ends when the planned capacity is complete."
africa_action_name_create_local_processing_chain: "Create Local Processing Chain"
africa_select_create_local_processing_chain: "Create Local Processing Chain"
africa_select_create_local_processing_chain_desc: "This action requires energy, labour, transport, member consent, and a completed resource survey. It commits civilian and military factories, machine tools, temporary output loss. Full success means local value-added industry and confidence rise. Partial success means small processing plant only. Failure means elite capture or shortage leaves the surveyed resource dependent on raw exports and increases burden. The processing chain ends when local industry replaces raw exports and duplicate projects are closed."
africa_action_name_continental_procurement_contract: "Continental Procurement Contract"
africa_select_continental_procurement_contract: "Continental Procurement Contract"
africa_select_continental_procurement_contract_desc: "This action requires standard specifications and payment system. It commits treasury, civilian capacity, transport. Full success means equipment production and member industry improve. Partial success means limited contract for one equipment class. Failure means corruption scandal and delivery failure. The contract ends after a route change or renewal through a later tier."
africa_action_name_food_security_reserve: "Food Security Reserve"
africa_select_food_security_reserve: "Food Security Reserve"
africa_select_food_security_reserve_desc: "This action requires storage, transport, purchase agreements. It commits civilian factories, trains, convoys, political price. Full success means famine resilience and relief capacity improve. Partial success means regional reserve only. Failure means spoilage or seizure damages trust. The reserve is consumed during a crisis and rebuilt after use."
africa_action_name_resource_sovereignty_review: "Resource Sovereignty Review"
africa_select_resource_sovereignty_review: "Resource Sovereignty Review"
africa_select_resource_sovereignty_review_desc: "This action requires member support, investment alternatives. It commits political capital, compensation, possible sanctions. Full success means contracts renegotiated or nationalised with local benefit. Partial success means mixed ownership settlement. Failure means capital flight, sanctions, or sabotage. The review ends when the concession terms change and the dispute enters a cooling-off period."
africa_action_name_charter_development_fund: "Charter Development Fund"
africa_select_charter_development_fund: "Charter Development Fund"
africa_select_charter_development_fund_desc: "This action requires transparent rules and a credible project pipeline. It commits civilian factories, treasury share, member contributions. Full success means projects become cheaper and confidence rises. Partial success means fund remains small and regional. Failure means fraud or unequal distribution turns development into exploitation and creates rival pressure. The fund is reviewed annually, suspended during collapse, and closed if the League dissolves."
africa_action_name_continental_industrial_plan: "Continental Industrial Plan"
africa_select_continental_industrial_plan: "Continental Industrial Plan"
africa_select_continental_industrial_plan_desc: "This action requires resource, labour, energy, and transport balance. It commits large staged civilian capacity and regional contributions. Full success means major distributed industrial growth and route payoff. Partial success means one or two regional plans complete. Failure means overcentralisation creates shortage and secession pressure. The plan matures as regional phases finish, capacity is released, and maintenance decisions continue."
africa_action_name_open_voluntary_return_registry: "Open Voluntary Return Registry"
africa_select_open_voluntary_return_registry: "Open Voluntary Return Registry"
africa_select_open_voluntary_return_registry_desc: "This action requires safe ports, consular access, voluntary pledge. It commits political power, administrative staff, travel fund. Full success means applications and trust begin. Partial success means limited technical mission registry. Failure means fraud or coercion damages trust. The registry closes or pauses if safety or consent standards fail."
africa_action_name_charter_passage_programme: "Charter Passage Programme"
africa_select_charter_passage_programme: "Charter Passage Programme"
africa_select_charter_passage_programme_desc: "This action requires ships, convoys, rail, screening and medical support. It commits convoys, fuel, civilian factories, escorts. Full success means safe arrivals increase population, skills, and trust. Partial success means reduced group arrives. Failure means transport disaster or detention scandal. The passage ends when the passengers arrive and the transport is released."
africa_action_name_build_returnee_housing: "Build Returnee Housing"
africa_select_build_returnee_housing: "Build Returnee Housing"
africa_select_build_returnee_housing_desc: "This action requires local consent, land, utilities, anti-discrimination safeguards, and a receiving country with jobs or education already available. It commits civilian factories, steel, local labour. Full success means permanent housing, livelihoods, capacity, and trust rise. Partial success means temporary housing and limited livelihoods. Failure means segregation, eviction, unemployment, or shortage lowers trust. The housing project ends when temporary camps become permanent homes."
africa_action_name_invite_afro_american_technical_mission: "Invite Afro American Technical Mission"
africa_select_invite_afro_american_technical_mission: "Invite Afro American Technical Mission"
africa_select_invite_afro_american_technical_mission_desc: "This action requires visas, transport, host institutions. It commits convoys or air transport, funding, political exposure. Full success means engineers, doctors, teachers, organisers, or officers contribute. Partial success means small advisory team arrives. Failure means hostile interference or discrimination scandal. The mission ends after the team departs, leaving trained institutions and lawful access behind."
africa_action_name_veterans_and_volunteers_programme: "Veterans and Volunteers Programme"
africa_select_veterans_and_volunteers_programme: "Veterans and Volunteers Programme"
africa_select_veterans_and_volunteers_programme_desc: "This action requires screening, training, citizenship, equipment. It commits manpower, equipment, training time, transport. Full success means special volunteer formations and officer experience. Partial success means training cadres only. Failure means political backlash or mutiny risk. The programme assigns each formation once, then discharges or integrates it as the campaign develops."
africa_action_name_diaspora_investment_bonds: "Diaspora Investment Bonds"
africa_select_diaspora_investment_bonds: "Diaspora Investment Bonds"
africa_select_diaspora_investment_bonds_desc: "This action requires stable currency or guarantees. It commits consumer-goods burden, repayment obligation, administration. Full success means corridor or industry projects gain funding and trust. Partial success means limited subscription. Failure means default or corruption damages trust. The bond programme concludes when the bonds mature, are repaid, refinanced, or default with consequences."
africa_action_name_citizenship_and_representation_convention: "Citizenship and Representation Convention"
africa_select_citizenship_and_representation_convention: "Citizenship and Representation Convention"
africa_select_citizenship_and_representation_convention_desc: "This action requires member and diaspora delegates. It commits political concession, administrative effort, possible opposition. Full success means citizenship rights and representation stabilise trust. Partial success means limited residency rights. Failure means exclusion or unequal law creates radical opposition. The convention ends when the law takes effect, provisional status is resolved, and duplicate reforms are abandoned."
africa_action_name_diaspora_emergency_evacuation: "Diaspora Emergency Evacuation"
africa_select_diaspora_emergency_evacuation: "Diaspora Emergency Evacuation"
africa_select_diaspora_emergency_evacuation_desc: "This action requires transport access and receiving capacity. It commits convoys, aircraft, escorts, housing, medical staff. Full success means people evacuated and trust rises. Partial success means partial evacuation. Failure means losses or abandonment severely reduce trust. The evacuation ends when the people are safe and temporary camps are settled."
africa_action_name_monitor_rival_bloc: "Monitor Rival Bloc"
africa_select_monitor_rival_bloc: "Monitor Rival Bloc"
africa_select_monitor_rival_bloc_desc: "This action requires an intelligence network and access. It commits intelligence assets, political exposure, and funds. Full success reveals the bloc's plans and target members. Partial success reveals only one action. Failure exposes the network and raises rival confidence. Monitoring ends after exposure, alliance, or destruction of the target."
africa_action_name_offer_rival_arbitration: "Offer Rival Arbitration"
africa_select_offer_rival_arbitration: "Offer Rival Arbitration"
africa_select_offer_rival_arbitration_desc: "This action requires neutral venue and confidence among intermediaries. It commits concessions, travel, security, political risk. Full success means settlement or coexistence agreement. Partial success means ceasefire and limited talks. Failure means talks collapse and mobilisation rises. The talks end when a settlement is reached and the treaty's cooling-off period begins."
africa_action_name_support_rival_member_defection: "Support Rival Member Defection"
africa_select_support_rival_member_defection: "Support Rival Member Defection"
africa_select_support_rival_member_defection_desc: "This action requires intelligence, aid channel, credible membership offer. It commits equipment, funds, intelligence exposure, diplomatic cost. Full success means target defects or becomes neutral. Partial success means target withholds support from rival. Failure means operation exposed and rival gains unity. The effort ends when the covert network is exposed or the target chooses a side."
africa_action_name_counter_foreign_patronage: "Counter Foreign Patronage"
africa_select_counter_foreign_patronage: "Counter Foreign Patronage"
africa_select_counter_foreign_patronage_desc: "This action requires alternative aid, evidence, local partners. It commits equipment, development funds, intelligence, diplomatic cost. Full success means foreign dependency falls and confidence in Charter rises. Partial success means patronage growth slows. Failure means target becomes client and rival bloc hardens. The campaign ends when the temporary pressure fades and the patron's influence is settled."
africa_action_name_prepare_member_exit_terms: "Prepare Member Exit Terms"
africa_select_prepare_member_exit_terms: "Prepare Member Exit Terms"
africa_select_prepare_member_exit_terms_desc: "This action requires debt, units, borders, citizens, and bases require settlement. It commits administrative capacity, concessions, security. Full success means peaceful exit with limited damage. Partial success means extended transition. Failure means border or asset dispute becomes conflict. The exit ends when assets transfer, membership ends, and treaty terms are preserved."
africa_action_name_suspend_disloyal_member: "Suspend Disloyal Member"
africa_select_suspend_disloyal_member: "Suspend Disloyal Member"
africa_select_suspend_disloyal_member_desc: "This action requires evidence, votes or military authority. It commits authority cost, possible confidence loss across League. Full success means member suspended and compliance mission begins. Partial success means limited sanctions. Failure means collective backlash and rival bloc growth. The suspension ends when the member is restored, expelled, or placed under wartime rule after review."
africa_action_name_emergency_leadership_vote: "Emergency Leadership Vote"
africa_select_emergency_leadership_vote: "Emergency Leadership Vote"
africa_select_emergency_leadership_vote_desc: "This action requires charter rules and delegate access. It commits political risk, security, concessions. Full success means leadership confirmed or transferred peacefully. Partial success means shared leadership compromise. Failure means vote contested and League splits. The vote concludes when its result is applied and the succession period begins."
africa_action_name_contain_regional_secession_war: "Contain Regional Secession War"
africa_select_contain_regional_secession_war: "Contain Regional Secession War"
africa_select_contain_regional_secession_war_desc: "This action requires forces, local support, route stance. It commits equipment, manpower, trains, stability, authority. Full success means settlement, autonomy, or military victory. Partial success means ceasefire and frozen dispute. Failure means region escapes or war expands. The war effort ends when the settlement is applied and the obsolete dispute is laid aside."
africa_action_name_consult_oracle_network: "Consult Oracle Network"
africa_select_consult_oracle_network: "Consult Oracle Network"
africa_select_consult_oracle_network_desc: "This action requires trust, tribute or scientific liaison. It commits supplies, political credibility, ecological concession. Full success means disaster forecast accuracy improves. Partial success means ambiguous forecast. Failure means false forecast or manipulation. The consultation ends when the forecast expires or hostility closes the contact."
africa_action_name_bargain_with_the_green: "Bargain With The Green"
africa_select_bargain_with_the_green: "Bargain With The Green"
africa_select_bargain_with_the_green_desc: "This action requires route allows an ecological compact. It commits protected forest, halted extraction, relief work, development opportunity cost, and local settlement concessions. Full success means wrath falls and forest cooperation begins. Partial success means temporary truce. Failure means wrath rises and disasters intensify. The compact keeps its protected zones until a major breach permits a new review."
africa_action_name_petition_the_rain: "Petition The Rain"
africa_select_petition_the_rain: "Petition The Rain"
africa_select_petition_the_rain_desc: "This action requires contact and offering route. It commits food reserves, ritual access, political risk. In war, the selected enemy can face a random natural calamity after the additional ritual payment. A completed priority package may use the same action against its own enemy and pays the caller reserve from its own stockpile while the host records the Charter action. It begins at severe intensity, rises to regional intensity for a fully promoted sovereign package or warfare doctrine, and becomes catastrophic under the covenant capstone. Its losses and disruption grow with nature authority, ecological wrath, and continental war readiness. The call can be refused by the enemy's geography and has a long recovery interval with a risk of backfire. Full success means rainfall relief or agricultural bonus. Partial success means local rain only. Failure means flood or humiliation outcome. The petition ends when the weather's effect is settled."
africa_action_name_defy_the_drought: "Defy The Drought"
africa_select_defy_the_drought: "Defy The Drought"
africa_select_defy_the_drought_desc: "This action requires water, logistics, engineers, protected wells. It commits trains, trucks, fuel, manpower, civilian factories. In war, the selected enemy can face a random natural calamity after the additional ritual payment. A completed priority package may use the same action against its own enemy and pays the caller reserve from its own stockpile while the host records the Charter action. It begins at regional severity. Stronger covenant authority or stronger package nature authority can make it catastrophic, while ecological wrath and continental war readiness deepen its losses and disruption. The call can be refused by the enemy's geography and has a long recovery interval with a risk of backfire. Full success means water network resists drought warfare. Partial success means one corridor survives. Failure means supply collapse and regional revolt. The drought response ends when temporary rationing lifts and the built infrastructure remains."
africa_authorize_fictional_pathogen_review: "Authorize Fictional Pathogen Review"
africa_authorize_fictional_pathogen_review_desc: "Evolution III has brought unfamiliar fevers into the League's wars. Charter physicians ask for an isolated research station where they can identify the fictional agent, prepare countermeasures, and hold a strictly limited sample reserve."
africa_disease_review_command_power_tt: "10 <command_power_texticon>"
africa_disease_review_effect_tt: "Establish an isolated research station and prepare two controlled sample units. No outbreak begins from this decision."
africa_action_name_contain_emergent_disease: "Contain Emergent Disease"
africa_select_contain_emergent_disease: "Contain Emergent Disease"
africa_select_contain_emergent_disease_desc: "This action requires explicit review authorization and a live native outbreak in a controlled state. It commits support equipment, manpower, civilian factories, transport, medicine. Full success means spread falls and deaths reduced. Partial success means disease contained to current region. Failure means spread accelerates or mutates. The response ends when the teams finish their work and the quarantine is lifted after resolution."
africa_action_name_research_disease_countermeasure: "Research Disease Countermeasure"
africa_select_research_disease_countermeasure: "Research Disease Countermeasure"
africa_select_research_disease_countermeasure_desc: "This action requires explicit review authorization, an unfinished countermeasure, and a live host, crisis, or research-site target. It commits research slot or special project capacity, factories, time. Full success means countermeasure or vaccine unlocks. Partial success means treatment reduces severity. Failure means laboratory accident creates a native local outbreak only when the lifecycle accepts the dispatch. The research ends when laboratory safeguards are restored and the countermeasure is retained."
africa_action_name_weaponise_fictional_pathogen: "Weaponise Fictional Pathogen"
africa_select_weaponise_fictional_pathogen: "Weaponise Fictional Pathogen"
africa_select_weaponise_fictional_pathogen_desc: "This action requires reviewed countermeasure, one payload unit, a valid wartime target, and no weapon cooldown. It commits special stockpile, aircraft or agents, condemnation, accident risk. Full success means the native lifecycle accepts a target outbreak with severe diplomatic cost. Partial success means limited contamination. Failure means payload is spent only as a recorded backfire attempt, and a native laboratory accident is attempted. The operation ends after the stockpile is spent, the delivery teams withdraw, and the aftermath is contained."
africa_action_name_awaken_stone_cohort: "Awaken Stone Cohort"
africa_select_awaken_stone_cohort: "Awaken Stone Cohort"
africa_select_awaken_stone_cohort_desc: "This action requires an available formation slot and an owned, controlled state. It commits rare materials, manpower or offerings, and time. Full success means one limited stone cohort assembles in the selected state. Partial success means the cohort remains a static defence formation. Failure means the awakening site collapses or ecological wrath rises. This action can succeed only once."
africa_action_name_train_gorilla_heavy_infantry: "Train Gorilla Heavy Infantry"
africa_select_train_gorilla_heavy_infantry: "Train Gorilla Heavy Infantry"
africa_select_train_gorilla_heavy_infantry_desc: "This action requires an available formation slot and an owned, controlled state. It commits specialised equipment, supplies, and training time. Full success means one gorilla heavy infantry formation deploys in the selected state. Partial success means only a defensive cadre forms. Failure means discipline breaks down or the supply effort fails. This action can succeed only once."
africa_action_name_organise_pan_sappers: "Organise Pan Sappers"
africa_select_organise_pan_sappers: "Organise Pan Sappers"
africa_select_organise_pan_sappers_desc: "This action requires an available formation slot and an owned, controlled state. It commits support equipment, engineering tools, and time. Full success means one Pan sapper formation deploys in the selected state. Partial success means only a repair team forms. Failure means a workshop accident or theft ends the effort. This action can succeed only once."
africa_action_name_seek_international_recognition: "Seek International Recognition"
africa_select_seek_international_recognition: "Seek International Recognition"
africa_select_seek_international_recognition_desc: "This action requires embassy access and acceptable relations. It commits political capital, trade concessions, security guarantees. Full success means recognition and pressure reduction. Partial success means conditional recognition. Failure means rejection strengthens intervention coalition. The diplomatic effort ends after recognition, rejection, or war."
africa_action_name_prepare_anti_sanctions_network: "Prepare Anti Sanctions Network"
africa_select_prepare_anti_sanctions_network: "Prepare Anti Sanctions Network"
africa_select_prepare_anti_sanctions_network_desc: "This action requires alternative trade partners and ports. It commits convoys, stockpiles, civilian factories, diplomacy. Full success means sanction damage reduced and partners secured. Partial success means partial substitution. Failure means shortages and member confidence loss. The emergency network ends when sanctions lift or the war changes the trading system."
africa_action_name_answer_foreign_ultimatum: "Answer Foreign Ultimatum"
africa_select_answer_foreign_ultimatum: "Answer Foreign Ultimatum"
africa_select_answer_foreign_ultimatum_desc: "This action requires leadership and member consultation. It commits route-specific concessions, mobilisation, or refusal cost. Full success means settlement, delay, or prepared refusal. Partial success means limited concession buys time. Failure means unprepared refusal triggers war and authority loss. The ultimatum is resolved by a treaty, delay, or war."
africa_action_name_mobilise_continental_defence: "Mobilise Continental Defence"
africa_select_mobilise_continental_defence: "Mobilise Continental Defence"
africa_select_mobilise_continental_defence_desc: "This action requires the existing common reserve must hold at least [?constant:africa_common_reserve.minimum_stockpile|0] stockpile and the host must prove a transport network. It commits equipment, manpower, fuel, trains, civilian output. Full success means regional commands ready, the reserve posture opens, and members gain confidence. While active, each protected partner's defensive war may receive one stockpile-backed deployment costing [?constant:africa_common_reserve.deployment_cost|0], with a [?constant:africa_common_reserve.deployment_window_days|0]-day settlement window. Offensive wars receive no reserve and record misuse. Partial success means partial mobilisation protects key coasts. Failure means mobilisation strains economy and raises burden. The defence posture ends with demobilisation or conversion to a war economy after the crisis."
africa_action_name_disrupt_expedition_planning: "Disrupt Expedition Planning"
africa_select_disrupt_expedition_planning: "Disrupt Expedition Planning"
africa_select_disrupt_expedition_planning_desc: "This action requires agents, access, naval intelligence. It commits intelligence assets, funds, exposure risk. Full success means expedition delayed or split. Partial success means one member withdraws support. Failure means operation exposed and coalition unity rises. The disruption effort ends when the network is exposed or its recovery period begins."
africa_action_name_offer_base_withdrawal_treaty: "Offer Base Withdrawal Treaty"
africa_select_offer_base_withdrawal_treaty: "Offer Base Withdrawal Treaty"
africa_select_offer_base_withdrawal_treaty_desc: "This action requires negotiable access and no active total war. It commits lease compensation, transit rights, monitoring. Full success means base withdrawn or converted to limited treaty access. Partial success means long transition. Failure means talks fail and fortification expands. The treaty takes effect when the base transfer and claim settlement are complete."
africa_action_name_call_global_anti_colonial_conference: "Call Global Anti Colonial Conference"
africa_select_call_global_anti_colonial_conference: "Call Global Anti Colonial Conference"
africa_select_call_global_anti_colonial_conference_desc: "This action requires safe venue and global contacts. It commits political capital, transport, security, aid commitments. Full success means recognition network and foreign movements strengthen. Partial success means symbolic conference. Failure means repression or boycott reduces effect. The conference ends after its delegates return and follow-up missions begin."
africa_action_name_break_intervention_coalition: "Break Intervention Coalition"
africa_select_break_intervention_coalition: "Break Intervention Coalition"
africa_select_break_intervention_coalition_desc: "This action requires diplomacy, intelligence, trade, military deterrence. It commits varied costs per target and limited simultaneous campaigns. Full success means coalition loses enough members to cancel war. Partial success means intervention delayed. Failure means coalition hardens and launches expedition. The campaign ends when the coalition dissolves or war begins."
africa_action_name_sponsor_continent_unifier: "Sponsor Continent Unifier"
africa_select_sponsor_continent_unifier: "Sponsor Continent Unifier"
africa_select_sponsor_continent_unifier_desc: "This action requires route selected and global chaos high enough. It commits equipment, advisers, industry, convoys, diplomatic exposure. Full success means the target receives a full unification settlement and an alliance link. Partial success means the movement gains a limited regional role. Failure means the sponsorship fails or creates a hostile client. Sponsorship ends after success, collapse, betrayal, or the target's final global settlement."
africa_action_name_mediate_continent_union: "Mediate Continent Union"
africa_select_mediate_continent_union: "Mediate Continent Union"
africa_select_mediate_continent_union_desc: "This action requires compatible routes, border and representation settlement. It commits major political concessions, shared command, economic transition. Full success means a two-continent union forms. Partial success means the partners settle for a confederation or alliance. Failure means talks fail and rivalry intensifies. The settlement takes effect when the union's public identity, factions, and old treaties are reconciled."
africa_action_name_prepare_continental_war: "Prepare Continental War"
africa_select_prepare_continental_war: "Prepare Continental War"
africa_select_prepare_continental_war_desc: "This action requires world chaos threshold, logistics, strategic access. It commits massive equipment, fuel, convoys, trains, manpower, stability. Full success means a war goal and campaign plan are prepared. Partial success means a limited proxy conflict begins. Failure means the preparation is exposed and the rival strikes first. The war plan ends when an alliance or union is formed, the target collapses, or war begins."
africa_action_name_force_continent_submission: "Force Continent Submission"
africa_select_force_continent_submission: "Force Continent Submission"
africa_select_force_continent_submission_desc: "This action requires occupation, legitimacy, union route. It commits garrison, reconstruction, political settlement, equipment. Full success means the rival is integrated, federated, or annexed under the chosen settlement. Partial success means a temporary armistice leaves the continent unsettled. Failure means resistance returns and continental war resumes. Submission is complete only after the final political settlement is in place."
africa_action_name_form_dynamic_two_continent_union: "Form Two-Continent Union"
africa_select_form_dynamic_two_continent_union: "Form Two-Continent Union"
africa_select_form_dynamic_two_continent_union_desc: "This action requires no terminal war between partners and union plan complete. It commits constitutional capacity, integration burden, shared defence, member votes. Full success means a public union with joint institutions forms. Partial success means a loose dual federation holds. Failure means member revolt or leadership crisis. The union forms when its public identity and regional systems are reconciled and duplicate sponsorships end."
africa_action_name_declare_the_world_is_one: "Declare The World Is One"
africa_select_declare_the_world_is_one: "Declare The World Is One"
africa_select_declare_the_world_is_one_desc: "This action requires the final world settlement has not been declared and all rivals are resolved. It commits campaign-ending political and administrative commitment. Full success means The World settlement is proclaimed and the final ceremony begins. Partial success means no partial settlement is available. Failure means the declaration cannot proceed until all required conditions are satisfied. The settlement is complete once the final order is declared, incompatible institutions are ended, and all continent wars are closed."
africa_action_name_administer_world_regions: "Administer World Regions"
africa_select_administer_world_regions: "Administer World Regions"
africa_select_administer_world_regions_desc: "This action requires regional settlement packages available. It commits garrisons, reconstruction, representation, transport. Full success means the settled regions enter the chosen administration and a public epilogue follows. Partial success means some regions retain autonomy. Failure means global revolt follows if the burden is ignored. Administration ends after the epilogue or the campaign's conclusion."
africa_action_name_contain_terminal_high_chaos: "Contain Terminal High Chaos"
africa_select_contain_terminal_high_chaos: "Contain Terminal High Chaos"
africa_select_contain_terminal_high_chaos_desc: "This action requires special countermeasures and access. It commits massive resources, research, ecological concessions, armies. Full success means the remaining actors are integrated, contained, or defeated. Partial success means a regional truce holds. Failure means the disaster continues after the world settlement. The crisis ends only through a defined integration, containment, or defeat."
africa_action_name_convene_federal_deadlock_conference: "Convene Federal Deadlock Conference"
africa_select_convene_federal_deadlock_conference: "Convene Federal Deadlock Conference"
africa_select_convene_federal_deadlock_conference_desc: "This action requires two or more represented regions, no active conference, sufficient authority, affected members still valid. It commits civilian administrative capacity plus political attention scaled by represented regions and the number of disputed clauses. Full success means a compromise formula, executive adjustment, or bounded exception restores congress function. Partial success means one disputed action proceeds under a temporary rule while deadlock pressure remains. Failure means emergency rule debt rises, one strong member gains withdrawal support, and the blocked agenda remains closed. The conference ends when the route changes, the congress dissolves, the disputing members disappear, or a settlement is reached."
africa_action_name_conduct_first_continental_election: "Conduct First Continental Election"
africa_select_conduct_first_continental_election: "Conduct First Continental Election"
africa_select_conduct_first_continental_election_desc: "This action requires minimum regional participation, accessible capitals or polling centres, election legitimacy above collapse level, no terminal civil war. It commits civilian administrative capacity, trains or convoys for remote polling, and temporary security commitment scaled by population and access. Full success means a recognised government takes office and regional acceptance is recorded. Partial success means the government is elected but one or more regions require a rerun, autonomy settlement, or observer mission. Failure means boycott, fraud, or insecurity creates an emergency republic and raises coup and secession pressure. The election concludes after a valid transfer, route collapse, government overthrow, or declaration of the final world settlement."
africa_action_name_arbitrate_continental_succession: "Arbitrate Continental Succession"
africa_select_arbitrate_continental_succession: "Arbitrate Continental Succession"
africa_select_arbitrate_continental_succession_desc: "This action requires claimant evidence or local institutions exist, target not annexed, at least one neutral crown or civic observer available. It commits authority, diplomatic staff, and temporary guard or convoy support scaled by distance, claimant count, and violence risk. Full success means a locally accepted ruler, regency, civic settlement, or constitutional conversion resolves the dispute. Partial success means a temporary regency prevents war but claimant legitimacy remains contested. Failure means rival claimants mobilise, royal-bloc cohesion falls, and the target may leave or form a rival court. Arbitration ends if the target government changes, the throne is abolished by a valid settlement, or civil war makes mediation impossible."
africa_action_name_balance_food_and_industrial_plan: "Balance Food and Industrial Plan"
africa_select_balance_food_and_industrial_plan: "Balance Food and Industrial Plan"
africa_select_balance_food_and_industrial_plan_desc: "This action requires at least one agricultural region and one industrial or mining region, functioning corridor, no duplicate plan. It commits trains, trucks, civilian capacity, food reserve, and administrative labour scaled by distance and current shortages. Full success means food supply stabilises while the selected industrial programme remains functional. Partial success means food or industry is preserved, while the other side loses output and demands a new settlement. Failure means shortages, strikes, rural resistance, or coercive requisition raise bureaucratic pressure and regional distrust. The plan ends after a route change, a resolved shortage, loss of the target regions, or replacement by a later system."
africa_action_name_review_victorious_commander_loyalty: "Review Victorious Commander Loyalty"
africa_select_review_victorious_commander_loyalty: "Review Victorious Commander Loyalty"
africa_select_review_victorious_commander_loyalty_desc: "This action requires commander and assigned forces exist, no current review, central command can contact the formation. It commits command attention, officer replacements, and temporary readiness loss scaled by the commander’s force share. Full success means the commander accepts rotation, constitutional subordination, retirement, or a defined lawful office. Partial success means the commander remains in place under monitoring and reduced independent access. Failure means loyalty crisis, rogue command, coup pressure, or regional mutiny begins. The review ends if the commander dies, the force dissolves, civilian rule takes over, or the loyalty crisis becomes open war."
africa_action_name_ratify_confederal_emergency_action: "Ratify Confederal Emergency Action"
africa_select_ratify_confederal_emergency_action: "Ratify Confederal Emergency Action"
africa_select_ratify_confederal_emergency_action_desc: "This action requires emergency is still active, affected members exist, no duplicate ratification, action is not a campaign-ending measure. It commits diplomatic staff, member concessions, and shared material compensation scaled by the number of affected members and sovereignty concern. Full success means enough members ratify the action and define its limits. Partial success means a smaller coalition keeps the action while dissenting members receive an opt-out. Failure means the action lapses, exit contagion rises, and one member may challenge League leadership. Ratification ends when the emergency ends, the action expires, affected members leave, or the route changes."
africa_action_name_review_covenant_obligation: "Review Covenant Obligation"
africa_select_review_covenant_obligation: "Review Covenant Obligation"
africa_select_review_covenant_obligation_desc: "This action requires valid actor or territory, known obligation, mediator or containment capacity, no active review. It commits local supplies, evacuation capacity, research or ritual resources, and member confidence scaled by wrath and affected population. Full success means the obligation is renewed with limits, safely ended, or replaced by a contained settlement. Partial success means temporary calm is restored while a follow-up boundary or evacuation mission remains. Failure means wrath rises, the actor breaches containment, or human members revolt against the arrangement. The review ends if the actor is defeated, the territory is lost, the covenant route ends, or a breach replaces the settlement."
africa_action_name_hold_postwar_constitutional_review: "Hold Postwar Constitutional Review"
africa_select_hold_postwar_constitutional_review: "Hold Postwar Constitutional Review"
africa_select_hold_postwar_constitutional_review_desc: "This action requires no active terminal war, at least four functioning regional courts, no duplicate review. It commits civilian administrative capacity, regional delegates, transport support, and demobilisation burden scaled by war length and unresolved regions. Full success means the chosen constitution absorbs or dismantles wartime powers and opens its post-unification programme. Partial success means some emergency institutions end while one major issue becomes a dedicated crisis branch. Failure means coup, secession, election boycott, succession dispute, or confederal exit crisis emerges according to route. The review ends after completion, renewed terminal war, route overthrow, or declaration of the final world settlement."
africa_action_name_recover_failed_host_proof: "Recover Failed Host Proof"
africa_select_recover_failed_host_proof: "Recover Failed Host Proof"
africa_select_recover_failed_host_proof_desc: "This action requires the host still controls a viable capital, at least one valid corridor or partner remains, and no terminal defeat has occurred. It commits equipment, trains or convoys, civilian capacity, and political concessions scaled by the original failure and the host's size. Full success means the host restores enough authority and confidence to convene the League without erasing the remembered failure. Partial success means the League opens with reduced authority and a mandatory oversight or autonomy clause. Failure means the host loses its founding mandate and must rebuild through a regional coalition or crisis route. The recovery effort ends after League formation, host replacement, route collapse, or a second failure."
africa_action_name_promote_priority_member_package: "Promote a Priority Member"
africa_select_promote_priority_member_package: "Promote a Priority Member"
africa_select_promote_priority_member_package_desc: "This action requires viable compact territory or autonomy, local support, a functioning institution, a distinct economic or strategic role, and an unresolved relationship question. It commits regional authority, administrative capacity, security equipment, and development support scaled by the candidate's size and overlapping claims. Full success means the country receives its recognised role, armed forces, political programme, and League relationship. Partial success means the candidate gains autonomy or association and may qualify again after resolving one missing condition. Failure means an overlap dispute, access failure, or local refusal returns it to compact status and raises regional tension. Promotion ends if the candidate becomes invalid, another settlement supersedes it, the country gains full recognition, or the region is annexed."
