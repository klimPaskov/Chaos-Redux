l_english:
chaosx.nr12.1.t: "A Charter from [ROOT.GetNameDef]"
chaosx.nr12.1.d: "From [ROOT.Capital.GetName], [ROOT.GetNameDef] has announced a continental project whose first promise is protection. Its government will defend African states, move aid through threatened corridors, recognise viable liberation governments, and invite willing governments to negotiate a Charter League. No state is promised away, and no opinion score can turn a country into a province. The declaration will mean little until [ROOT.GetNameDef] proves that it can protect another African government without swallowing it."
chaosx.nr12.1.a: "Protection must come before union."

chaosx.nr12.2.t: "The First Delegations"
chaosx.nr12.2.d: "The declaration has drawn governments, organisers, and regional rivals toward [ROOT.Capital.GetName]. The first commitment will shape who believes the Charter and who prepares to oppose it. [ROOT.GetNameDef] can choose a priority, but it cannot answer every request at once."
chaosx.nr12.2.a: "Hear [africa_first_contact_threatened.GetNameDef]'s request for protection."
chaosx.nr12.2.b: "Recognise the case brought by [africa_first_contact_subject.GetNameDef]."
chaosx.nr12.2.c: "Accept [africa_first_contact_regional_power.GetNameDef]'s demand for proof."
chaosx.nr12.2.no_contact: "Stage the first proof from an African state already under our protection."

chaosx.events_log.window.event_details.africa: "One African-capital country has announced a continent-scale project beginning with defence, aid, recognition, and diplomatic mobilisation. African governments can join, bargain, refuse, depart, form rival blocs, or fight. Colonial possessions and foreign bases are becoming points of crisis, while unity still requires political, military, economic, and constitutional work."
+
