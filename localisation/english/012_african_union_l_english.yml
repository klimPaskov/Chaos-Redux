africa_action_name_guarantee_sovereignty: "Guarantee Sovereignty"
africa_select_guarantee_sovereignty: "Guarantee Sovereignty"
africa_select_guarantee_sovereignty_desc: "Requirements: shared border or access, target not hostile, capacity available. Commitment: command attention plus infantry equipment and diplomatic exposure scaled by target size. Full result: target becomes protected partner and gains confidence. Partial result: limited guarantee with lower confidence when access is weak. Failure: authority loss if guarantee is later broken. The guarantee ends if the target is annexed, joins a hostile bloc, or enters the Charter as a member."
africa_action_name_open_aid_corridor: "Open Aid Corridor"
africa_select_open_aid_corridor: "Open Aid Corridor"
africa_select_open_aid_corridor_desc: "Requirements: route access, convoy or train capacity, equipment stockpile. Commitment: convoys or trains plus equipment and temporary civilian capacity scaled by distance. Full result: supply and confidence improve, corridor becomes active. Partial result: reduced aid arrives with attrition and smaller confidence gain. Failure: equipment lost, authority falls, corridor exposure rises. The corridor closes after peace, route loss, target defeat, or a decision to cancel it."
africa_action_name_dispatch_charter_mission: "Dispatch Charter Mission"
africa_select_dispatch_charter_mission: "Dispatch Charter Mission"
africa_select_dispatch_charter_mission_desc: "Requirements: diplomatic staff, political attention, transport, local security. Commitment: political power plus support equipment and local access scaled by hostility. Full result: reveals accession preferences and raises confidence. Partial result: reveals only some clauses and creates local opposition. Failure: mission expelled, confidence falls, rival influence rises. The mission ends after its work is complete or its target can no longer receive it."
africa_action_name_deploy_volunteers: "Deploy Volunteers"
africa_select_deploy_volunteers: "Deploy Volunteers"
africa_select_deploy_volunteers_desc: "Requirements: volunteer access, units available, target accepts help. Commitment: trained divisions, equipment, command power, supply burden. Full result: target survives, confidence rises, League invitation unlocks. Partial result: front stabilises without decisive victory. Failure: volunteers destroyed or target capitulates, authority loss. The mission ends when the volunteers return, access closes, or the war and target's fate settle the operation."
africa_action_name_intervene_against_coloniser: "Intervene Against Coloniser"
africa_select_intervene_against_coloniser: "Intervene Against Coloniser"
africa_select_intervene_against_coloniser_desc: "Requirements: authority threshold, readiness threshold, and valid war access. Commitment: equipment, fuel, trains, manpower, diplomatic cost. Full result: war or forced settlement begins with target protected. Partial result: limited intervention through volunteers and sanctions. Failure: unprepared escalation lowers authority and raises burden. The intervention ends if peace returns, the target is destroyed, or another war takes over the crisis."
africa_action_name_evacuate_leaders_archives: "Evacuate Leaders Archives"
africa_select_evacuate_leaders_archives: "Evacuate Leaders Archives"
africa_select_evacuate_leaders_archives_desc: "Requirements: route exists and leaders consent. Commitment: air transport or convoys, intelligence capacity, command power. Full result: government in exile, leaders, archives, and legitimacy preserved. Partial result: partial evacuation preserves either leaders or archives. Failure: route closes and confidence collapses. The evacuation ends when the people at risk are safe, the transports return, or an exile government is established."
africa_action_name_recognise_provisional_government: "Recognise Provisional Government"
africa_select_recognise_provisional_government: "Recognise Provisional Government"
africa_select_recognise_provisional_government_desc: "Requirements: diplomatic credibility, relations cost with colonial holder. Commitment: political power plus equipment or funds scaled by legitimacy. Full result: movement gains legitimacy and League access. Partial result: symbolic recognition without material aid. Failure: false partner scandal lowers authority. Recognition ends when the government becomes a state, collapses, or joins a rival bloc."
africa_action_name_secure_border_sanctuary: "Secure Border Sanctuary"
africa_select_secure_border_sanctuary: "Secure Border Sanctuary"
africa_select_secure_border_sanctuary_desc: "Requirements: garrison divisions, supply, local support. Commitment: infantry equipment, trains, tied divisions, stability risk. Full result: movement gains safe base and recruitment. Partial result: base remains hidden but weak. Failure: foreign raid or local backlash damages host. The sanctuary closes after independence, exposure, or destruction of the protected movement."
africa_action_name_break_blockade: "Break Blockade"
africa_select_break_blockade: "Break Blockade"
africa_select_break_blockade_desc: "Requirements: naval access, fuel, convoys, aircraft or ships. Commitment: fuel, convoys, naval or air XP, repair risk. Full result: port corridor opens and confidence rises. Partial result: limited deliveries pass. Failure: ships or aircraft lost, colonial pressure rises. The effort ends when the blockade ends, the port is lost, or the member leaves."
africa_action_name_emergency_relief_column: "Emergency Relief Column"
africa_select_emergency_relief_column: "Emergency Relief Column"
africa_select_emergency_relief_column_desc: "Requirements: route access and relief stockpile. Commitment: trucks, trains, support equipment, manpower, civilian factories. Full result: deaths and local damage fall, confidence rises. Partial result: some relief reaches target. Failure: relief fails or spreads disease, trust falls. The relief effort ends when the teams finish their work and temporary access is withdrawn."
africa_action_name_offer_defence_charter: "Offer Defence Charter"
africa_select_offer_defence_charter: "Offer Defence Charter"
africa_select_offer_defence_charter_desc: "Requirements: defence commitment and common reserve capacity. Commitment: equipment pledge, command capacity, future defence obligation. Full result: target becomes associate or chartered member. Partial result: target accepts only guarantee and observers. Failure: target refuses and may seek rival patron. The offer ends after the government gives its answer."
africa_action_name_offer_development_charter: "Offer Development Charter"
africa_select_offer_development_charter: "Offer Development Charter"
africa_select_offer_development_charter_desc: "Requirements: project capacity and target consent. Commitment: civilian factories, trains, convoys, engineers. Full result: target joins with development clauses. Partial result: target accepts bilateral project only. Failure: project scandal or debt concern lowers trust. The offer ends when it becomes a project or the target refuses it."
africa_action_name_offer_federal_charter: "Offer Federal Charter"
africa_select_offer_federal_charter: "Offer Federal Charter"
africa_select_offer_federal_charter_desc: "Requirements: constitutional capacity and regional congress support. Commitment: authority commitment, seats, autonomy guarantees, integration capacity. Full result: target becomes autonomous federal member. Partial result: target requests extra autonomy and delay. Failure: target refuses and confidence falls. The offer ends when the settlement is accepted, revised, or refused."
africa_action_name_offer_crown_charter: "Offer Crown Charter"
africa_select_offer_crown_charter: "Offer Crown Charter"
africa_select_offer_crown_charter_desc: "Requirements: recognised ruler, succession rules, representation. Commitment: court recognition, ceremonial costs, guard commitment. Full result: monarchy joins with preserved crown. Partial result: joins as associate pending succession settlement. Failure: dynastic dispute creates rival claimant. The offer ends after the succession settlement or any civil conflict."
africa_action_name_offer_peoples_charter: "Offer Peoples Charter"
africa_select_offer_peoples_charter: "Offer Peoples Charter"
africa_select_offer_peoples_charter_desc: "Requirements: worker, peasant, or party congress support. Commitment: equipment aid, organisers, factory burden, ideological exposure. Full result: target joins people’s union structure. Partial result: coalition joins with autonomy protections. Failure: internal opposition starts crisis. The offer ends when the organisers leave and the opposition is settled."
africa_action_name_offer_security_charter: "Offer Security Charter"
africa_select_offer_security_charter: "Offer Security Charter"
africa_select_offer_security_charter_desc: "Requirements: common command access and host readiness. Commitment: officer teams, equipment, tied divisions, legitimacy cost. Full result: target joins under security obligations. Partial result: temporary command mission only. Failure: accusations of occupation damage confidence. The command mission ends when the crisis resolves or the member leaves."
africa_action_name_offer_sacred_ecological_compact: "Offer Sacred Ecological Compact"
africa_select_offer_sacred_ecological_compact: "Offer Sacred Ecological Compact"
africa_select_offer_sacred_ecological_compact_desc: "Requirements: ritual or ecological bargain capacity. Commitment: ecological concessions, restricted development, offerings or relief work. Full result: actor joins or cooperates under special clauses. Partial result: temporary truce or disaster restraint. Failure: wrath rises and actor becomes hostile. The compact ends after betrayal, route closure, or the actor's destruction."
africa_action_name_renegotiate_accession_clauses: "Renegotiate Accession Clauses"
africa_select_renegotiate_accession_clauses: "Renegotiate Accession Clauses"
africa_select_renegotiate_accession_clauses_desc: "Requirements: representation capacity and no active secession war. Commitment: political attention plus concessions selected by route. Full result: confidence recovers and obligations update. Partial result: temporary freeze on departure. Failure: talks fail and departure mission starts. The negotiation ends when the revised clauses replace the old terms."
africa_action_name_hold_accession_referendum: "Hold Accession Referendum"
africa_select_hold_accession_referendum: "Hold Accession Referendum"
africa_select_hold_accession_referendum_desc: "Requirements: local institutions function with security, ballot administration, and free access. Commitment: civilian capacity, security units, political risk. Full result: result determines membership with legitimacy bonus. Partial result: narrow or disputed result delays settlement. Failure: violence or fraud causes confidence and authority loss. The referendum ends after the vote, and another ballot requires a new constitutional settlement."
africa_action_name_admit_member_in_emergency: "Admit Member In Emergency"
africa_select_admit_member_in_emergency: "Admit Member In Emergency"
africa_select_admit_member_in_emergency_desc: "Requirements: minimum confidence and contact exists. Commitment: equipment, guarantee, emergency authority, burden spike. Full result: target becomes emergency member and receives defence. Partial result: protected partner status only. Failure: emergency accession becomes dependency scandal. The emergency settlement ends when the mandatory postwar constitutional review begins."
africa_action_name_convene_regional_congress: "Convene Regional Congress"
africa_select_convene_regional_congress: "Convene Regional Congress"
africa_select_convene_regional_congress_desc: "Requirements: authority threshold, safe venue, delegate access. Commitment: political power, trains or convoys, security, civilian capacity. Full result: congress opens with proposal choices. Partial result: limited conference handles only one dispute. Failure: boycott lowers authority and empowers rival bloc. The congress ends after its public decision and the delegates return home."
africa_action_name_settle_overlapping_claims: "Settle Overlapping Claims"
africa_select_settle_overlapping_claims: "Settle Overlapping Claims"
africa_select_settle_overlapping_claims_desc: "Requirements: mediation, maps, local consultation, enforcement capacity. Commitment: political attention, survey teams, security, possible compensation. Full result: border or federal settlement accepted. Partial result: temporary condominium or autonomy zone. Failure: one claimant leaves or fights. The settlement ends when the final boundaries are accepted and the old dispute is laid aside."
africa_action_name_create_regional_charter: "Create Regional Charter"
africa_select_create_regional_charter: "Create Regional Charter"
africa_select_create_regional_charter_desc: "Requirements: minimum members and administrative readiness. Commitment: representation seats, bureaucracy, development commitment. Full result: regional charter government created. Partial result: loose council created with limited powers. Failure: charter collapses into rival blocs. The congress ends when the regional government takes its place."
africa_action_name_form_regional_federation: "Form Regional Federation"
africa_select_form_regional_federation: "Form Regional Federation"
africa_select_form_regional_federation_desc: "Requirements: federal constitution and integration capacity. Commitment: administrative manpower, equipment for common security, civilian factories. Full result: federated region created with autonomy. Partial result: partial federation excludes dissenters. Failure: civil conflict or departure crisis. The federation settles when its members are integrated, opt-outs are protected, and the congress finishes its work."
africa_action_name_restore_historical_polity: "Restore Historical Polity"
africa_select_restore_historical_polity: "Restore Historical Polity"
africa_select_restore_historical_polity_desc: "Requirements: candidate source review and viable territory. Commitment: administrative capacity, guard force, symbolic and economic costs. Full result: restored polity becomes member or autonomous subject. Partial result: symbolic cultural authority without sovereignty. Failure: rival claim or legitimacy crisis. The restoration ends once the polity is established and incompatible claims are settled."
africa_action_name_approve_direct_integration_schedule: "Approve Direct Integration Schedule"
africa_select_approve_direct_integration_schedule: "Approve Direct Integration Schedule"
africa_select_approve_direct_integration_schedule_desc: "Requirements: administrative capacity, representation, local security. Commitment: bureaucracy, equipment, civilian capacity, integration burden. Full result: staged integration begins. Partial result: autonomous federal status extends. Failure: resistance rises and schedule pauses. The schedule becomes a set of integration projects after the congress reaches its decision."
africa_action_name_guarantee_regional_representation: "Guarantee Regional Representation"
africa_select_guarantee_regional_representation: "Guarantee Regional Representation"
africa_select_guarantee_regional_representation_desc: "Requirements: available seats and constitutional route. Commitment: political concession and limits on central appointments. Full result: confidence rises and secession risk falls. Partial result: temporary observer seats. Failure: other regions demand equal treatment. The representation settlement ends when seats are allocated and the regional demand is answered."
africa_action_name_fund_congress_security: "Fund Congress Security"
africa_select_fund_congress_security: "Fund Congress Security"
africa_select_fund_congress_security_desc: "Requirements: security units and local consent. Commitment: support equipment, tied divisions, intelligence exposure. Full result: congress continues safely. Partial result: minor incidents delay votes. Failure: crackdown scandal or attack ends congress. The security detail stands down after the congress concludes."
africa_action_name_invite_diaspora_delegates: "Invite Diaspora Delegates"
africa_select_invite_diaspora_delegates: "Invite Diaspora Delegates"
africa_select_invite_diaspora_delegates_desc: "Requirements: delegate representation rules. Commitment: convoys, travel funds, security, political controversy. Full result: diaspora trust and expertise improve proposals. Partial result: observer role only. Failure: delegates excluded or attacked, trust falls. The invitation ends after the congress and the delegates' return."
africa_action_name_enforce_congress_settlement: "Enforce Congress Settlement"
africa_select_enforce_congress_settlement: "Enforce Congress Settlement"
africa_select_enforce_congress_settlement_desc: "Requirements: enforcement capacity and route permission. Commitment: sanctions, equipment, tied forces, authority risk. Full result: compliance restored. Partial result: partial compliance and renewed talks. Failure: war or rival bloc expansion. Enforcement ends after compliance, war, or replacement of the settlement."
africa_action_name_build_administrative_bridge: "Build Administrative Bridge"
africa_select_build_administrative_bridge: "Build Administrative Bridge"
africa_select_build_administrative_bridge_desc: "Requirements: local officials, language support, representation. Commitment: administrative manpower, civilian factories, support equipment. Full result: administration compatibility improves. Partial result: limited offices open with delay. Failure: corruption or boycott increases burden. The bridge project ends when the offices are established and integration advances."
africa_action_name_connect_member_capitals: "Connect Member Capitals"
africa_select_connect_member_capitals: "Connect Member Capitals"
africa_select_connect_member_capitals_desc: "Requirements: rail, road, river, air, or sea link possible. Commitment: trains, convoys, civilian factories, fuel, local labour. Full result: reach rises and integration costs fall. Partial result: partial link improves supply only. Failure: project stalls, burden and local frustration rise. The connection ends when construction is complete or cancelled and capacity is released."
africa_action_name_standardise_customs: "Standardise Customs"
africa_select_standardise_customs: "Standardise Customs"
africa_select_standardise_customs_desc: "Requirements: member consent and administrative capacity. Commitment: short-term revenue loss, political effort, inspection staff. Full result: trade improves and regional market opens. Partial result: limited customs corridor. Failure: smuggling and elite resistance rise. The customs settlement ends when the common system replaces bilateral arrangements."
africa_action_name_integrate_security_services: "Integrate Security Services"
africa_select_integrate_security_services: "Integrate Security Services"
africa_select_integrate_security_services_desc: "Requirements: shared intelligence rules and oversight. Commitment: intelligence capacity, equipment, legitimacy risk. Full result: counter-subversion improves and rival pressure falls. Partial result: liaison office only. Failure: abuse scandal lowers confidence. The integration ends when the temporary agents leave and route-specific oversight remains."
africa_action_name_harmonise_officer_corps: "Harmonise Officer Corps"
africa_select_harmonise_officer_corps: "Harmonise Officer Corps"
africa_select_harmonise_officer_corps_desc: "Requirements: training access, language teams, doctrine compatibility. Commitment: army XP, equipment, training time, command slots. Full result: joint command and templates improve. Partial result: shared exercises only. Failure: officer resistance or coup pressure. The training mission ends when officer integration is complete."
africa_action_name_negotiate_autonomy_statute: "Negotiate Autonomy Statute"
africa_select_negotiate_autonomy_statute: "Negotiate Autonomy Statute"
africa_select_negotiate_autonomy_statute_desc: "Requirements: representation, fiscal terms, security clauses. Commitment: political concession and reduced central revenue. Full result: member becomes stable autonomous federal member. Partial result: temporary autonomy delays departure. Failure: talks fail and rival bloc gains support. The talks end when the statute is agreed and incompatible integration plans are set aside."
africa_action_name_launch_local_settlement_programme: "Launch Local Settlement Programme"
africa_select_launch_local_settlement_programme: "Launch Local Settlement Programme"
africa_select_launch_local_settlement_programme_desc: "Requirements: local consultation and security. Commitment: civilian factories, administrative manpower, compensation. Full result: local support improves and resistance falls. Partial result: one district settles while others remain disputed. Failure: forced settlement raises resistance. The programme ends when each district is settled or the effort is abandoned."
africa_action_name_grant_core_recognition: "Grant Core Recognition"
africa_select_grant_core_recognition: "Grant Core Recognition"
africa_select_grant_core_recognition_desc: "Requirements: stable control, low resistance, representation, route condition. Commitment: administrative commitment and permanent constitutional obligation. Full result: claims become cores or equivalent integrated status. Partial result: limited core group while disputed areas remain claims. Failure: premature grant causes rebellion or overextension. The settlement ends when obsolete integration plans are set aside and minority protections remain."
africa_action_name_impose_emergency_administration: "Impose Emergency Administration"
africa_select_impose_emergency_administration: "Impose Emergency Administration"
africa_select_impose_emergency_administration_desc: "Requirements: military access and central authority. Commitment: tied divisions, equipment, stability, legitimacy, colonial pressure. Full result: order restored and review mission starts. Partial result: capital secured but countryside resists. Failure: occupation war and mass departure. The administration ends at its mandatory sunset, after review, or when it becomes an occupation government."
africa_action_name_federalise_restored_polities: "Federalise Restored Polities"
africa_select_federalise_restored_polities: "Federalise Restored Polities"
africa_select_federalise_restored_polities_desc: "Requirements: member consent and shared institutions. Commitment: representation seats, administrative capacity, treasury contribution. Full result: restored states form durable federal chamber. Partial result: consultative chamber only. Failure: dynastic rivalry breaks federation. The federation begins when the chamber is formed and duplicate court negotiations end."
africa_action_name_survey_continental_resources: "Survey Continental Resources"
africa_select_survey_continental_resources: "Survey Continental Resources"
africa_select_survey_continental_resources_desc: "Requirements: engineers, geological teams, security. Commitment: civilian factories, trucks, fuel, survey equipment. Full result: resource projects and processing routes unlock. Partial result: partial survey reveals one project. Failure: teams expelled or lost. The survey ends when the teams return and the discoveries are ready for development."
africa_action_name_build_regional_rail_spine: "Build Regional Rail Spine"
africa_select_build_regional_rail_spine: "Build Regional Rail Spine"
africa_select_build_regional_rail_spine_desc: "Requirements: route survey, supply need, construction access. Commitment: civilian factories, trains, steel, local labour. Full result: rail, supply, reach, and confidence improve. Partial result: partial line opens. Failure: cost overrun and local opposition. The rail project ends when construction capacity is released and the corridor opens."
africa_action_name_expand_river_transport: "Expand River Transport"
africa_select_expand_river_transport: "Expand River Transport"
africa_select_expand_river_transport_desc: "Requirements: boats, docks, local agreements. Commitment: convoys, civilian factories, fuel, engineering. Full result: river supply and trade network opens. Partial result: seasonal route only. Failure: flood, sabotage, or local refusal. The river project ends when temporary works close and ecological clauses remain in force."
africa_action_name_modernise_continental_port: "Modernise Continental Port"
africa_select_modernise_continental_port: "Modernise Continental Port"
africa_select_modernise_continental_port_desc: "Requirements: dock capacity and local consent. Commitment: civilian factories, convoys, steel, coastal security. Full result: port capacity, navy, trade, and diaspora access improve. Partial result: commercial expansion without military facilities. Failure: foreign sabotage or debt crisis. The port project ends when the planned capacity is complete."
africa_action_name_create_local_processing_chain: "Create Local Processing Chain"
africa_select_create_local_processing_chain: "Create Local Processing Chain"
africa_select_create_local_processing_chain_desc: "Requirements: energy, labour, transport, member consent, and a completed resource survey. Commitment: civilian and military factories, machine tools, temporary output loss. Full result: local value-added industry and confidence rise. Partial result: small processing plant only. Failure: elite capture or shortage leaves the surveyed resource dependent on raw exports and increases burden. The processing chain ends when local industry replaces raw exports and duplicate projects are closed."
africa_action_name_continental_procurement_contract: "Continental Procurement Contract"
africa_select_continental_procurement_contract: "Continental Procurement Contract"
africa_select_continental_procurement_contract_desc: "Requirements: standard specifications and payment system. Commitment: treasury, civilian capacity, transport. Full result: equipment production and member industry improve. Partial result: limited contract for one equipment class. Failure: corruption scandal and delivery failure. The contract ends after a route change or renewal through a later tier."
africa_action_name_food_security_reserve: "Food Security Reserve"
africa_select_food_security_reserve: "Food Security Reserve"
africa_select_food_security_reserve_desc: "Requirements: storage, transport, purchase agreements. Commitment: civilian factories, trains, convoys, political price. Full result: famine resilience and relief capacity improve. Partial result: regional reserve only. Failure: spoilage or seizure damages trust. The reserve is consumed during a crisis and rebuilt after use."
africa_action_name_resource_sovereignty_review: "Resource Sovereignty Review"
africa_select_resource_sovereignty_review: "Resource Sovereignty Review"
africa_select_resource_sovereignty_review_desc: "Requirements: member support, investment alternatives. Commitment: political capital, compensation, possible sanctions. Full result: contracts renegotiated or nationalised with local benefit. Partial result: mixed ownership settlement. Failure: capital flight, sanctions, or sabotage. The review ends when the concession terms change and the dispute enters a cooling-off period."
africa_action_name_charter_development_fund: "Charter Development Fund"
africa_select_charter_development_fund: "Charter Development Fund"
africa_select_charter_development_fund_desc: "Requirements: transparent rules and a credible project pipeline. Commitment: civilian factories, treasury share, member contributions. Full result: projects become cheaper and confidence rises. Partial result: fund remains small and regional. Failure: fraud or unequal distribution turns development into exploitation and creates rival pressure. The fund is reviewed annually, suspended during collapse, and closed if the League dissolves."
africa_action_name_continental_industrial_plan: "Continental Industrial Plan"
africa_select_continental_industrial_plan: "Continental Industrial Plan"
africa_select_continental_industrial_plan_desc: "Requirements: resource, labour, energy, and transport balance. Commitment: large staged civilian capacity and regional contributions. Full result: major distributed industrial growth and route payoff. Partial result: one or two regional plans complete. Failure: overcentralisation creates shortage and secession pressure. The plan matures as regional phases finish, capacity is released, and maintenance decisions continue."
africa_action_name_open_voluntary_return_registry: "Open Voluntary Return Registry"
africa_select_open_voluntary_return_registry: "Open Voluntary Return Registry"
africa_select_open_voluntary_return_registry_desc: "Requirements: safe ports, consular access, voluntary pledge. Commitment: political power, administrative staff, travel fund. Full result: applications and trust begin. Partial result: limited technical mission registry. Failure: fraud or coercion damages trust. The registry closes or pauses if safety or consent standards fail."
africa_action_name_charter_passage_programme: "Charter Passage Programme"
africa_select_charter_passage_programme: "Charter Passage Programme"
africa_select_charter_passage_programme_desc: "Requirements: ships, convoys, rail, screening and medical support. Commitment: convoys, fuel, civilian factories, escorts. Full result: safe arrivals increase population, skills, and trust. Partial result: reduced group arrives. Failure: transport disaster or detention scandal. The passage ends when the passengers arrive and the transport is released."
africa_action_name_build_returnee_housing: "Build Returnee Housing"
africa_select_build_returnee_housing: "Build Returnee Housing"
africa_select_build_returnee_housing_desc: "Requirements: land, utilities, anti-discrimination safeguards. Commitment: civilian factories, steel, local labour. Full result: housing capacity and trust rise. Partial result: temporary housing only. Failure: segregation, eviction, or shortage lowers trust. The housing project ends when temporary camps become permanent homes."
africa_action_name_invite_afro_american_technical_mission: "Invite Afro American Technical Mission"
africa_select_invite_afro_american_technical_mission: "Invite Afro American Technical Mission"
africa_select_invite_afro_american_technical_mission_desc: "Requirements: visas, transport, host institutions. Commitment: convoys or air transport, funding, political exposure. Full result: engineers, doctors, teachers, organisers, or officers contribute. Partial result: small advisory team arrives. Failure: hostile interference or discrimination scandal. The mission ends after the team departs, leaving trained institutions and lawful access behind."
africa_action_name_veterans_and_volunteers_programme: "Veterans and Volunteers Programme"
africa_select_veterans_and_volunteers_programme: "Veterans and Volunteers Programme"
africa_select_veterans_and_volunteers_programme_desc: "Requirements: screening, training, citizenship, equipment. Commitment: manpower, equipment, training time, transport. Full result: special volunteer formations and officer experience. Partial result: training cadres only. Failure: political backlash or mutiny risk. The programme assigns each formation once, then discharges or integrates it as the campaign develops."
africa_action_name_diaspora_investment_bonds: "Diaspora Investment Bonds"
africa_select_diaspora_investment_bonds: "Diaspora Investment Bonds"
africa_select_diaspora_investment_bonds_desc: "Requirements: stable currency or guarantees. Commitment: consumer-goods burden, repayment obligation, administration. Full result: corridor or industry projects gain funding and trust. Partial result: limited subscription. Failure: default or corruption damages trust. The bond programme concludes when the bonds mature, are repaid, refinanced, or default with consequences."
africa_action_name_citizenship_and_representation_convention: "Citizenship and Representation Convention"
africa_select_citizenship_and_representation_convention: "Citizenship and Representation Convention"
africa_select_citizenship_and_representation_convention_desc: "Requirements: member and diaspora delegates. Commitment: political concession, administrative effort, possible opposition. Full result: citizenship rights and representation stabilise trust. Partial result: limited residency rights. Failure: exclusion or unequal law creates radical opposition. The convention ends when the law takes effect, provisional status is resolved, and duplicate reforms are abandoned."
africa_action_name_diaspora_emergency_evacuation: "Diaspora Emergency Evacuation"
africa_select_diaspora_emergency_evacuation: "Diaspora Emergency Evacuation"
africa_select_diaspora_emergency_evacuation_desc: "Requirements: transport access and receiving capacity. Commitment: convoys, aircraft, escorts, housing, medical staff. Full result: people evacuated and trust rises. Partial result: partial evacuation. Failure: losses or abandonment severely reduce trust. The evacuation ends when the people are safe and temporary camps are settled."
africa_action_name_monitor_rival_bloc: "Monitor Rival Bloc"
africa_select_monitor_rival_bloc: "Monitor Rival Bloc"
africa_select_monitor_rival_bloc_desc: "Requirements: intelligence network and access. Commitment: intelligence assets, political exposure, funds. Full result: reveals plans and target members. Partial result: partial network reveals one action. Failure: network exposed and rival confidence rises. Monitoring ends after exposure, alliance, or destruction of the target."
africa_action_name_offer_rival_arbitration: "Offer Rival Arbitration"
africa_select_offer_rival_arbitration: "Offer Rival Arbitration"
africa_select_offer_rival_arbitration_desc: "Requirements: neutral venue and confidence among intermediaries. Commitment: concessions, travel, security, political risk. Full result: settlement or coexistence agreement. Partial result: ceasefire and limited talks. Failure: talks collapse and mobilisation rises. The talks end when a settlement is reached and the treaty's cooling-off period begins."
africa_action_name_support_rival_member_defection: "Support Rival Member Defection"
africa_select_support_rival_member_defection: "Support Rival Member Defection"
africa_select_support_rival_member_defection_desc: "Requirements: intelligence, aid channel, credible membership offer. Commitment: equipment, funds, intelligence exposure, diplomatic cost. Full result: target defects or becomes neutral. Partial result: target withholds support from rival. Failure: operation exposed and rival gains unity. The effort ends when the covert network is exposed or the target chooses a side."
africa_action_name_counter_foreign_patronage: "Counter Foreign Patronage"
africa_select_counter_foreign_patronage: "Counter Foreign Patronage"
africa_select_counter_foreign_patronage_desc: "Requirements: alternative aid, evidence, local partners. Commitment: equipment, development funds, intelligence, diplomatic cost. Full result: foreign dependency falls and confidence in Charter rises. Partial result: patronage growth slows. Failure: target becomes client and rival bloc hardens. The campaign ends when the temporary pressure fades and the patron's influence is settled."
africa_action_name_prepare_member_exit_terms: "Prepare Member Exit Terms"
africa_select_prepare_member_exit_terms: "Prepare Member Exit Terms"
africa_select_prepare_member_exit_terms_desc: "Requirements: debt, units, borders, citizens, and bases require settlement. Commitment: administrative capacity, concessions, security. Full result: peaceful exit with limited damage. Partial result: extended transition. Failure: border or asset dispute becomes conflict. The exit ends when assets transfer, membership ends, and treaty terms are preserved."
africa_action_name_suspend_disloyal_member: "Suspend Disloyal Member"
africa_select_suspend_disloyal_member: "Suspend Disloyal Member"
africa_select_suspend_disloyal_member_desc: "Requirements: evidence, votes or military authority. Commitment: authority cost, possible confidence loss across League. Full result: member suspended and compliance mission begins. Partial result: limited sanctions. Failure: collective backlash and rival bloc growth. The suspension ends when the member is restored, expelled, or placed under wartime rule after review."
africa_action_name_emergency_leadership_vote: "Emergency Leadership Vote"
africa_select_emergency_leadership_vote: "Emergency Leadership Vote"
africa_select_emergency_leadership_vote_desc: "Requirements: charter rules and delegate access. Commitment: political risk, security, concessions. Full result: leadership confirmed or transferred peacefully. Partial result: shared leadership compromise. Failure: vote contested and League splits. The vote concludes when its result is applied and the succession period begins."
africa_action_name_contain_regional_secession_war: "Contain Regional Secession War"
africa_select_contain_regional_secession_war: "Contain Regional Secession War"
africa_select_contain_regional_secession_war_desc: "Requirements: forces, local support, route stance. Commitment: equipment, manpower, trains, stability, authority. Full result: settlement, autonomy, or military victory. Partial result: ceasefire and frozen dispute. Failure: region escapes or war expands. The war effort ends when the settlement is applied and the obsolete dispute is laid aside."
africa_action_name_consult_oracle_network: "Consult Oracle Network"
africa_select_consult_oracle_network: "Consult Oracle Network"
africa_select_consult_oracle_network_desc: "Requirements: trust, tribute or scientific liaison. Commitment: supplies, political credibility, ecological concession. Full result: disaster forecast accuracy improves. Partial result: ambiguous forecast. Failure: false forecast or manipulation. The consultation ends when the forecast expires or hostility closes the contact."
africa_action_name_bargain_with_the_green: "Bargain With The Green"
africa_select_bargain_with_the_green: "Bargain With The Green"
africa_select_bargain_with_the_green_desc: "Requirements: route allows an ecological compact. Commitment: protected forest, halted extraction, relief work, development opportunity cost, and local settlement concessions. Full result: wrath falls and forest cooperation begins. Partial result: temporary truce. Failure: wrath rises and disasters intensify. The compact keeps its protected zones until a major breach permits a new review."
africa_action_name_petition_the_rain: "Petition The Rain"
africa_select_petition_the_rain: "Petition The Rain"
africa_select_petition_the_rain_desc: "Requirements: contact and offering route. Commitment: food reserves, ritual access, political risk. In war, the selected enemy can face a random natural calamity after the additional ritual payment. A completed priority package may use the same action against its own enemy and pays the caller reserve from its own stockpile while the host records the Charter action. It begins at severe intensity, rises to regional intensity for a fully promoted sovereign package or warfare doctrine, and becomes catastrophic under the covenant capstone. Its losses and disruption grow with nature authority, ecological wrath, and continental war readiness. The call can be refused by the enemy's geography and has a long recovery interval with a risk of backfire. Full result: rainfall relief or agricultural bonus. Partial result: local rain only. Failure: flood or humiliation outcome. The petition ends when the weather's effect is settled."
africa_action_name_defy_the_drought: "Defy The Drought"
africa_select_defy_the_drought: "Defy The Drought"
africa_select_defy_the_drought_desc: "Requirements: water, logistics, engineers, protected wells. Commitment: trains, trucks, fuel, manpower, civilian factories. In war, the selected enemy can face a random natural calamity after the additional ritual payment. A completed priority package may use the same action against its own enemy and pays the caller reserve from its own stockpile while the host records the Charter action. It begins at regional severity. Stronger covenant authority or stronger package nature authority can make it catastrophic, while ecological wrath and continental war readiness deepen its losses and disruption. The call can be refused by the enemy's geography and has a long recovery interval with a risk of backfire. Full result: water network resists drought warfare. Partial result: one corridor survives. Failure: supply collapse and regional revolt. The drought response ends when temporary rationing lifts and the built infrastructure remains."
africa_action_name_contain_emergent_disease: "Contain Emergent Disease"
africa_select_contain_emergent_disease: "Contain Emergent Disease"
africa_select_contain_emergent_disease_desc: "Requirements: medical capacity and access. Commitment: support equipment, manpower, civilian factories, transport, medicine. Full result: spread falls and deaths reduced. Partial result: disease contained to current region. Failure: spread accelerates or mutates. The response ends when the teams finish their work and the quarantine is lifted after resolution."
africa_action_name_research_disease_countermeasure: "Research Disease Countermeasure"
africa_select_research_disease_countermeasure: "Research Disease Countermeasure"
africa_select_research_disease_countermeasure_desc: "Requirements: scientists, samples, safety. Commitment: research slot or special project capacity, factories, time. Full result: countermeasure or vaccine unlocks. Partial result: treatment reduces severity. Failure: laboratory accident creates local outbreak. The research ends when laboratory safeguards are restored and the countermeasure is retained."
africa_action_name_weaponise_fictional_pathogen: "Weaponise Fictional Pathogen"
africa_select_weaponise_fictional_pathogen: "Weaponise Fictional Pathogen"
africa_select_weaponise_fictional_pathogen_desc: "Requirements: delivery means and target access. Commitment: special stockpile, aircraft or agents, condemnation, accident risk. Full result: target outbreak begins with severe diplomatic cost. Partial result: limited contamination. Failure: backfire outbreak at home or global spread. The operation ends after the stockpile is spent, the delivery teams withdraw, and the aftermath is contained."
africa_action_name_awaken_stone_cohort: "Awaken Stone Cohort"
africa_select_awaken_stone_cohort: "Awaken Stone Cohort"
africa_select_awaken_stone_cohort_desc: "Requirements: site control, ritual or engineering capacity. Commitment: rare materials, manpower or offerings, time. Full result: limited stone cohort created. Partial result: static defence unit only. Failure: site collapses or wrath rises. The site can be used once, then remains dormant through a long recovery period."
africa_action_name_train_gorilla_heavy_infantry: "Train Gorilla Heavy Infantry"
africa_select_train_gorilla_heavy_infantry: "Train Gorilla Heavy Infantry"
africa_select_train_gorilla_heavy_infantry_desc: "Requirements: food, equipment, command structure. Commitment: special equipment, supply, training time. Full result: heavy infantry formation created. Partial result: defensive cadre only. Failure: discipline or supply crisis. Further formations require losses to be replaced and the recovery period to pass."
africa_action_name_organise_pan_sappers: "Organise Pan Sappers"
africa_select_organise_pan_sappers: "Organise Pan Sappers"
africa_select_organise_pan_sappers_desc: "Requirements: workshops, explosives, command. Commitment: support equipment, engineering tools, time. Full result: sapper unit or sabotage network created. Partial result: repair team only. Failure: workshop accident or theft. Additional teams require available workshops and a secure operating region."
africa_action_name_seek_international_recognition: "Seek International Recognition"
africa_select_seek_international_recognition: "Seek International Recognition"
africa_select_seek_international_recognition_desc: "Requirements: embassy access and acceptable relations. Commitment: political capital, trade concessions, security guarantees. Full result: recognition and pressure reduction. Partial result: conditional recognition. Failure: rejection strengthens intervention coalition. The diplomatic effort ends after recognition, rejection, or war."
africa_action_name_prepare_anti_sanctions_network: "Prepare Anti Sanctions Network"
africa_select_prepare_anti_sanctions_network: "Prepare Anti Sanctions Network"
africa_select_prepare_anti_sanctions_network_desc: "Requirements: alternative trade partners and ports. Commitment: convoys, stockpiles, civilian factories, diplomacy. Full result: sanction damage reduced and partners secured. Partial result: partial substitution. Failure: shortages and member confidence loss. The emergency network ends when sanctions lift or the war changes the trading system."
africa_action_name_answer_foreign_ultimatum: "Answer Foreign Ultimatum"
africa_select_answer_foreign_ultimatum: "Answer Foreign Ultimatum"
africa_select_answer_foreign_ultimatum_desc: "Requirements: leadership and member consultation. Commitment: route-specific concessions, mobilisation, or refusal cost. Full result: settlement, delay, or prepared refusal. Partial result: limited concession buys time. Failure: unprepared refusal triggers war and authority loss. The ultimatum is resolved by a treaty, delay, or war."
africa_action_name_mobilise_continental_defence: "Mobilise Continental Defence"
africa_select_mobilise_continental_defence: "Mobilise Continental Defence"
africa_select_mobilise_continental_defence_desc: "Requirements: the existing common reserve must hold at least [?constant:africa_common_reserve.minimum_stockpile|0] stockpile and the host must prove a transport network. Commitment: equipment, manpower, fuel, trains, civilian output. Full result: regional commands ready, the reserve posture opens, and members gain confidence. While active, each protected partner's defensive war may receive one stockpile-backed deployment costing [?constant:africa_common_reserve.deployment_cost|0], with a [?constant:africa_common_reserve.deployment_window_days|0]-day settlement window. Offensive wars receive no reserve and record misuse. Partial result: partial mobilisation protects key coasts. Failure: mobilisation strains economy and raises burden. The defence posture ends with demobilisation or conversion to a war economy after the crisis."
africa_action_name_disrupt_expedition_planning: "Disrupt Expedition Planning"
africa_select_disrupt_expedition_planning: "Disrupt Expedition Planning"
africa_select_disrupt_expedition_planning_desc: "Requirements: agents, access, naval intelligence. Commitment: intelligence assets, funds, exposure risk. Full result: expedition delayed or split. Partial result: one member withdraws support. Failure: operation exposed and coalition unity rises. The disruption effort ends when the network is exposed or its recovery period begins."
africa_action_name_offer_base_withdrawal_treaty: "Offer Base Withdrawal Treaty"
africa_select_offer_base_withdrawal_treaty: "Offer Base Withdrawal Treaty"
africa_select_offer_base_withdrawal_treaty_desc: "Requirements: negotiable access and no active total war. Commitment: lease compensation, transit rights, monitoring. Full result: base withdrawn or converted to limited treaty access. Partial result: long transition. Failure: talks fail and fortification expands. The treaty takes effect when the base transfer and claim settlement are complete."
africa_action_name_call_global_anti_colonial_conference: "Call Global Anti Colonial Conference"
africa_select_call_global_anti_colonial_conference: "Call Global Anti Colonial Conference"
africa_select_call_global_anti_colonial_conference_desc: "Requirements: safe venue and global contacts. Commitment: political capital, transport, security, aid commitments. Full result: recognition network and foreign movements strengthen. Partial result: symbolic conference. Failure: repression or boycott reduces effect. The conference ends after its delegates return and follow-up missions begin."
africa_action_name_break_intervention_coalition: "Break Intervention Coalition"
africa_select_break_intervention_coalition: "Break Intervention Coalition"
africa_select_break_intervention_coalition_desc: "Requirements: diplomacy, intelligence, trade, military deterrence. Commitment: varied costs per target and limited simultaneous campaigns. Full result: coalition loses enough members to cancel war. Partial result: intervention delayed. Failure: coalition hardens and launches expedition. The campaign ends when the coalition dissolves or war begins."
africa_action_name_sponsor_continent_unifier: "Sponsor Continent Unifier"
africa_select_sponsor_continent_unifier: "Sponsor Continent Unifier"
africa_select_sponsor_continent_unifier_desc: "Requirements: route selected and global chaos high enough. Commitment: equipment, advisers, industry, convoys, diplomatic exposure. Full result: target receives unique unifier package and alliance link. Partial result: movement gains limited regional power. Failure: sponsorship fails or creates hostile client. Sponsorship ends after success, collapse, betrayal, or the target's final global settlement."
africa_action_name_mediate_continent_union: "Mediate Continent Union"
africa_select_mediate_continent_union: "Mediate Continent Union"
africa_select_mediate_continent_union_desc: "Requirements: compatible routes, border and representation settlement. Commitment: major political concessions, shared command, economic transition. Full result: a two-continent union forms. Partial result: confederation or alliance only. Failure: talks fail and rivalry intensifies. The settlement takes effect when the union's public identity, factions, and old treaties are reconciled."
africa_action_name_prepare_continental_war: "Prepare Continental War"
africa_select_prepare_continental_war: "Prepare Continental War"
africa_select_prepare_continental_war_desc: "Requirements: world chaos threshold, logistics, strategic access. Commitment: massive equipment, fuel, convoys, trains, manpower, stability. Full result: war goal and campaign plan unlock. Partial result: limited proxy conflict. Failure: preparation exposed, rival strikes first. The war plan ends when an alliance or union is formed, the target collapses, or war begins."
africa_action_name_force_continent_submission: "Force Continent Submission"
africa_select_force_continent_submission: "Force Continent Submission"
africa_select_force_continent_submission_desc: "Requirements: occupation, legitimacy, union route. Commitment: garrison, reconstruction, political settlement, equipment. Full result: rival integrated, federated, or annexed according to route. Partial result: puppet continent or armistice. Failure: resistance and renewed continental war. Submission is complete only after the final political settlement is in place."
africa_action_name_form_dynamic_two_continent_union: "Form Two-Continent Union"
africa_select_form_dynamic_two_continent_union: "Form Two-Continent Union"
africa_select_form_dynamic_two_continent_union_desc: "Requirements: no terminal war between partners and union plan complete. Commitment: constitutional capacity, integration burden, shared defence, member votes. Full result: a new public union and joint institutions form. Partial result: loose dual federation. Failure: member revolt or leadership crisis. The union forms when its public identity and regional systems are reconciled and duplicate sponsorships end."
africa_action_name_declare_the_world_is_one: "Declare The World Is One"
africa_select_declare_the_world_is_one: "Declare The World Is One"
africa_select_declare_the_world_is_one_desc: "Requirements: the final world settlement has not been declared and all rivals are resolved. Commitment: campaign-ending political and administrative commitment. Full result: The World settlement is proclaimed and the super-event fires. Partial result: not applicable. Failure: the declaration cannot proceed until all required conditions are satisfied. The settlement is complete once the final order is declared, incompatible institutions are ended, and all continent wars are closed."
africa_action_name_administer_world_regions: "Administer World Regions"
africa_select_administer_world_regions: "Administer World Regions"
africa_select_administer_world_regions_desc: "Requirements: regional settlement packages available. Commitment: garrisons, reconstruction, representation, transport. Full result: route-specific epilogue and stability. Partial result: some regions remain autonomous. Failure: global revolt if burden ignored. Administration ends after the epilogue or the campaign's conclusion."
africa_action_name_contain_terminal_high_chaos: "Contain Terminal High Chaos"
africa_select_contain_terminal_high_chaos: "Contain Terminal High Chaos"
africa_select_contain_terminal_high_chaos_desc: "Requirements: special countermeasures and access. Commitment: massive resources, research, ecological concessions, armies. Full result: actors integrated, contained, or defeated. Partial result: regional truce. Failure: disaster chain continues after world victory. The crisis ends only through a defined integration, containment, or defeat."
africa_action_name_convene_federal_deadlock_conference: "Convene Federal Deadlock Conference"
africa_select_convene_federal_deadlock_conference: "Convene Federal Deadlock Conference"
africa_select_convene_federal_deadlock_conference_desc: "Requirements: two or more represented regions, no active conference, sufficient authority, affected members still valid. Commitment: civilian administrative capacity plus political attention scaled by represented regions and the number of disputed clauses. Full result: a compromise formula, executive adjustment, or bounded exception restores congress function. Partial result: one disputed action proceeds under a temporary rule while deadlock pressure remains. Failure: emergency rule debt rises, one strong member gains withdrawal support, and the blocked agenda remains closed. The conference ends when the route changes, the congress dissolves, the disputing members disappear, or a settlement is reached."
africa_action_name_conduct_first_continental_election: "Conduct First Continental Election"
africa_select_conduct_first_continental_election: "Conduct First Continental Election"
africa_select_conduct_first_continental_election_desc: "Requirements: minimum regional participation, accessible capitals or polling centres, election legitimacy above collapse level, no terminal civil war. Commitment: civilian administrative capacity, trains or convoys for remote polling, and temporary security commitment scaled by population and access. Full result: a recognised government takes office and regional acceptance is recorded. Partial result: the government is elected but one or more regions require a rerun, autonomy settlement, or observer mission. Failure: boycott, fraud, or insecurity creates an emergency republic and raises coup and secession pressure. The election concludes after a valid transfer, route collapse, government overthrow, or declaration of the final world settlement."
africa_action_name_arbitrate_continental_succession: "Arbitrate Continental Succession"
africa_select_arbitrate_continental_succession: "Arbitrate Continental Succession"
africa_select_arbitrate_continental_succession_desc: "Requirements: claimant evidence or local institutions exist, target not annexed, at least one neutral crown or civic observer available. Commitment: authority, diplomatic staff, and temporary guard or convoy support scaled by distance, claimant count, and violence risk. Full result: a locally accepted ruler, regency, civic settlement, or constitutional conversion resolves the dispute. Partial result: a temporary regency prevents war but claimant legitimacy remains contested. Failure: rival claimants mobilise, royal-bloc cohesion falls, and the target may leave or form a rival council. Arbitration ends if the target government changes, the throne is abolished by a valid settlement, or civil war makes mediation impossible."
africa_action_name_balance_food_and_industrial_plan: "Balance Food and Industrial Plan"
africa_select_balance_food_and_industrial_plan: "Balance Food and Industrial Plan"
africa_select_balance_food_and_industrial_plan_desc: "Requirements: at least one agricultural region and one industrial or mining region, functioning corridor, no duplicate plan. Commitment: trains, trucks, civilian capacity, food reserve, and administrative labour scaled by distance and current shortages. Full result: food supply stabilises while the selected industrial programme remains functional. Partial result: food or industry is preserved, while the other side loses output and demands a new settlement. Failure: shortages, strikes, rural resistance, or coercive requisition raise bureaucratic pressure and regional distrust. The plan ends after a route change, a resolved shortage, loss of the target regions, or replacement by a later system."
africa_action_name_review_victorious_commander_loyalty: "Review Victorious Commander Loyalty"
africa_select_review_victorious_commander_loyalty: "Review Victorious Commander Loyalty"
africa_select_review_victorious_commander_loyalty_desc: "Requirements: commander and assigned forces exist, no current review, central command can contact the formation. Commitment: command attention, officer replacements, and temporary readiness loss scaled by the commander’s force share. Full result: the commander accepts rotation, constitutional subordination, retirement, or a defined lawful office. Partial result: the commander remains in place under monitoring and reduced independent access. Failure: loyalty crisis, rogue command, coup pressure, or regional mutiny begins. The review ends if the commander dies, the force dissolves, civilian rule takes over, or the loyalty crisis becomes open war."
africa_action_name_ratify_confederal_emergency_action: "Ratify Confederal Emergency Action"
africa_select_ratify_confederal_emergency_action: "Ratify Confederal Emergency Action"
africa_select_ratify_confederal_emergency_action_desc: "Requirements: emergency is still active, affected members exist, no duplicate ratification, action is not a campaign-ending measure. Commitment: diplomatic staff, member concessions, and shared material compensation scaled by the number of affected members and sovereignty concern. Full result: enough members ratify the action and define its limits. Partial result: a smaller coalition keeps the action while dissenting members receive an opt-out. Failure: the action lapses, exit contagion rises, and one member may challenge League leadership. Ratification ends when the emergency ends, the action expires, affected members leave, or the route changes."
africa_action_name_review_covenant_obligation: "Review Covenant Obligation"
africa_select_review_covenant_obligation: "Review Covenant Obligation"
africa_select_review_covenant_obligation_desc: "Requirements: valid actor or territory, known obligation, mediator or containment capacity, no active review. Commitment: local supplies, evacuation capacity, research or ritual resources, and member confidence scaled by wrath and affected population. Full result: the obligation is renewed with limits, safely ended, or replaced by a contained settlement. Partial result: temporary calm is restored while a follow-up boundary or evacuation mission remains. Failure: wrath rises, the actor breaches containment, or human members revolt against the arrangement. The review ends if the actor is defeated, the territory is lost, the covenant route ends, or a breach replaces the settlement."
africa_action_name_hold_postwar_constitutional_review: "Hold Postwar Constitutional Review"
africa_select_hold_postwar_constitutional_review: "Hold Postwar Constitutional Review"
africa_select_hold_postwar_constitutional_review_desc: "Requirements: no active terminal war, at least four functioning regional councils, no duplicate review. Commitment: civilian administrative capacity, regional delegates, transport support, and demobilisation burden scaled by war length and unresolved regions. Full result: the chosen constitution absorbs or dismantles wartime powers and opens its post-unification programme. Partial result: some emergency institutions end while one major issue becomes a dedicated crisis branch. Failure: coup, secession, election boycott, succession dispute, or confederal exit crisis emerges according to route. The review ends after completion, renewed terminal war, route overthrow, or declaration of the final world settlement."
africa_action_name_recover_failed_host_proof: "Recover Failed Host Proof"
africa_select_recover_failed_host_proof: "Recover Failed Host Proof"
africa_select_recover_failed_host_proof_desc: "Requirements: host still controls a viable capital, at least one valid corridor or partner exists, no terminal defeat. Commitment: equipment, trains or convoys, civilian capacity, and political concessions scaled by the original failure and host size. Full result: the host restores enough authority and confidence to convene the League without erasing the remembered failure. Partial result: the League opens with reduced authority and a mandatory oversight or autonomy clause. Failure: the host loses the normal early mandate and must rebuild through a regional coalition or crisis route. The recovery effort ends after League formation, host replacement, route collapse, or a second failure."
africa_action_name_promote_priority_member_package: "Promote Priority Member Package"
africa_select_promote_priority_member_package: "Promote Priority Member Package"
africa_select_promote_priority_member_package_desc: "Requirements: viable compact territory or autonomy, local support, functioning institution, distinct economic or strategic role, unresolved relationship question. Commitment: regional authority, administrative capacity, equipment for starting security, and development commitment scaled by candidate size and overlap. Full result: the full country package activates with its starting problem, force identity, focus modules, and League relationship. Partial result: the candidate gains autonomy or association and can qualify again after one missing condition is solved. Failure: overlap dispute, access failure, or local refusal returns it to compact status and raises regional tension. The promotion ends when the candidate becomes invalid, another settlement supersedes it, the full package activates, or the region is annexed."
africa_host_problem_ethiopia: "A sovereign empire under foreign threat with contested central authority, regional obligations, uneven roads, and a diplomatic system that may fail it"
africa_host_proof_ethiopia: "Keep one threatened Horn partner independent through a supply corridor, volunteer commitment, or negotiated ceasefire"
africa_host_leverage_ethiopia: "imperial constitutional settlement, regional representation, highland and lowland logistics, Red Sea access, officer reform"
africa_host_rival_ethiopia: "Eritrean and Somali distrust, Italian return, regional resentment, claimant or succession crisis"
africa_host_problem_egypt: "Formal independence constrained by British military presence, treaty obligations, the Suez corridor, royal and parliamentary rivalry, and Sudan"
africa_host_proof_egypt: "Protect a Nile or Red Sea partner without surrendering canal control or allowing one foreign patron to dominate"
africa_host_leverage_egypt: "treaty revision, palace and parliament, Suez security, Nile representation, Egyptian and Sudanese settlement"
africa_host_rival_egypt: "British intervention, Sudanese refusal, canal seizure, North African competition"
africa_host_problem_sudan: "Condominium rule, regional distance, Nile dependence, competing urban, religious, pastoral, and local authorities"
africa_host_proof_sudan: "Hold a Nile or trans-Sahel corridor while winning recognition from more than one Sudanese region"
africa_host_leverage_sudan: "dual-rule dismantling, regional congress, Nile transport, pastoral and agrarian settlement, officer and civic coalition"
africa_host_rival_sudan: "Egyptian claims, British return, southern withdrawal, Nile disputes"
africa_host_problem_morocco: "A divided protectorate and international zone with a sultan, reformist nationalism, rural resistance, and competing foreign authorities"
africa_host_proof_morocco: "Unify one administrative zone through negotiation or coordinated liberation while preserving local confidence"
africa_host_leverage_morocco: "protectorate dismantling, sultan and nationalist settlement, Tangier question, Rif reconstruction, Saharan access"
africa_host_rival_morocco: "Spanish and French intervention, Algerian leadership competition, Saharan claims"
africa_host_problem_algeria: "Settler political dominance, unequal citizenship, land dispossession, divided nationalist currents, and a large colonial army presence"
africa_host_proof_algeria: "Create a cross-community independence institution or win a defended inland corridor without mass coercion"
africa_host_leverage_algeria: "citizenship settlement, land commission, nationalist coalition, urban and rural organisation, Sahara governance"
africa_host_rival_algeria: "French intervention, settler insurgency, Moroccan and Tunisian competition, Sahara burden"
africa_host_problem_tunisia: "A protectorate with a bey, mass nationalist organisation, urban labour, rural inequality, and nearby European military power"
africa_host_proof_tunisia: "Secure a legal and logistical space for an independence congress while keeping the coast supplied"
africa_host_leverage_tunisia: "bey and movement settlement, urban labour, rural reform, port defence, Maghreb congress"
africa_host_rival_tunisia: "French repression, Italian pressure, elite movement split, coastal blockade"
africa_host_problem_libya: "Italian occupation, pacification damage, regional division among Cyrenaica, Tripolitania, and Fezzan, and weak national infrastructure"
africa_host_proof_libya: "Liberate or protect one regional capital while keeping a desert supply chain functional"
africa_host_leverage_libya: "regional compact, resistance integration, desert logistics, land recovery, Mediterranean defence"
africa_host_rival_libya: "Italian return, regional secession, Egyptian influence, Saharan isolation"
africa_host_problem_liberia: "Formal sovereignty weakened by concession power, forced-labour scandal, settler and indigenous political inequality, and fragile public finance"
africa_host_proof_liberia: "Renegotiate one concession and use the recovered revenue to protect a neighbouring African partner"
africa_host_leverage_liberia: "citizenship reform, concession audit, labour settlement, port and hinterland roads, sovereign diplomacy"
africa_host_rival_liberia: "foreign receivership, concession retaliation, interior refusal, elite coup"
africa_host_problem_nigeria: "A large amalgamated colony with deep regional differences, indirect rule, Lagos politics, transport inequality, and emerging national organisation"
africa_host_proof_nigeria: "Complete a cross-regional rail or river project while forming a coalition that includes at least three political regions"
africa_host_leverage_nigeria: "federal bargain, Lagos and interior balance, emirate and civic representation, rail and river integration, national movement"
africa_host_rival_nigeria: "regional withdrawal, elite capture, labour unrest, neighbouring bloc competition"
africa_host_problem_gold_coast: "A prosperous export colony with cocoa producers, mining, chiefly institutions, educated urban politics, and unequal representation"
africa_host_proof_gold_coast: "Protect producer income and complete a public port to inland development project"
africa_host_leverage_gold_coast: "producer settlement, chiefs and elected bodies, mining revenue, Accra and inland balance, West African diplomacy"
africa_host_rival_gold_coast: "colonial fiscal control, producer revolt, Asante autonomy, Nigerian competition"
africa_host_problem_senegal_fwa: "A coastal administrative centre governing a vast and uneven federation with citizen communes, subjects, rail corridors, and inland scepticism"
africa_host_proof_senegal_fwa: "Transfer resources and representation to an inland partner while maintaining the Dakar corridor"
africa_host_leverage_senegal_fwa: "federal reconstitution, commune and subject citizenship, Dakar and inland balance, rail network, Sahel congress"
africa_host_rival_senegal_fwa: "inland secession, Dakar dominance, French military return, Manden or Songhai restoration"
africa_host_problem_sierra_leone: "A colony and protectorate divide, Freetown institutions, hinterland authority, mining and labour disputes, and maritime vulnerability"
africa_host_proof_sierra_leone: "Create a colony-protectorate settlement and keep an aid convoy open to a neighbour"
africa_host_leverage_sierra_leone: "Freetown and protectorate bargain, mining revenue, labour rights, port defence, education and diaspora exchange"
africa_host_rival_sierra_leone: "hinterland rejection, company control, blockade, Liberian and Gold Coast competition"
africa_host_problem_belgian_congo: "A vast concessionary colony with extreme administrative coercion, mining enclaves, mission and company power, weak national institutions, and difficult transport"
africa_host_proof_belgian_congo: "Secure one river and rail corridor under African civil control while protecting a neighbouring territory"
africa_host_leverage_belgian_congo: "administrative transfer, mining and labour settlement, river network, regional congress, army and police reform"
africa_host_rival_belgian_congo: "Katanga or regional secession, Belgian return, concession armies, Kongo or Luba-Lunda claims"
africa_host_problem_angola: "Portuguese colonial control, forced labour and concession systems, disconnected coastal and interior economies, and several regional political traditions"
africa_host_proof_angola: "Open a paid-labour public corridor from an inland region to a port"
africa_host_leverage_angola: "labour abolition, concession review, port and rail integration, regional representation, Kongo and southern settlement"
africa_host_rival_angola: "Portuguese intervention, regional fragmentation, Kongo overlap, company retaliation"
africa_host_problem_french_equatorial_africa: "A thin administrative federation with concession legacies, difficult transport, forest and savanna distance, and Brazzaville dominance"
africa_host_proof_french_equatorial_africa: "Complete a river or rail relief route while granting an inland regional council real budget authority"
africa_host_leverage_french_equatorial_africa: "federal reconstitution, concession review, Brazzaville and interior balance, river network, Chad and Cameroon links"
africa_host_rival_french_equatorial_africa: "inland secession, French return, Belgian Congo competition, Chad autonomy"
