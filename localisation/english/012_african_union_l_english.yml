africa_identify_host_problem: "Identify the Host Problem"
africa_identify_host_problem_desc: "The continental project begins by publishing the host dossier. Opening problem: [ROOT.GetAfricaHostProblem] Strategic leverage: [ROOT.GetAfricaHostLeverage] Rival pressure: [ROOT.GetAfricaHostRivalRisk]"
africa_repair_host_administration: "Repair the Host Administration"
africa_repair_host_administration_desc: "Repair the administrative capacity needed to track obligations, negotiate clauses, and support a partner. The work reduces early integration burden without granting authority over another government."
africa_build_host_coalition: "Build the Host Coalition"
africa_build_host_coalition_desc: "Bring civic institutions, regional authorities, labour, officers, and recognised local bodies into the host coalition. Wider consent improves representation but does not predetermine a constitution."
africa_prepare_host_security: "Prepare Host Security"
africa_prepare_host_security_desc: "Separate protection from conquest by preparing a bounded common reserve, corridor guards, and civilian oversight. Readiness rises while the first partner retains its own government."
africa_choose_first_corridor: "Choose the First Corridor"
africa_choose_first_corridor_desc: "Choose the rail, road, river, port, air, or convoy line that can reach the selected partner. The choice records an obligation and a construction priority rather than creating free access."
africa_build_first_corridor: "Build the First Corridor"
africa_build_first_corridor_desc: "Commit scarce transport and administrative capacity to the first corridor. Continental reach improves, but the host must carry the resulting maintenance burden."
africa_secure_first_corridor: "Secure the First Corridor"
africa_secure_first_corridor_desc: "Secure the built corridor against blockade, sabotage, and political obstruction. This authorises the matching proof mission, it does not declare that aid arrived or that a partner survived."
africa_select_first_partner: "Select the First Partner"
africa_select_first_partner_desc: "Bind the real government selected during the first delegations as the opening partner. Its relationship, consent, and security remain separate from opinion and from later integration."
africa_write_first_guarantee: "Write the First Guarantee"
africa_write_first_guarantee_desc: "Write the first visible obligation: what the host promises, what the partner can refuse, and when the commitment ends. The obligation enters the League ledger without annexation or cores."
africa_protect_first_partner: "Protect the First Partner"
africa_protect_first_partner_desc: "Open the mapped host proof after the corridor and obligation are ready. First proof: [ROOT.GetAfricaHostProofMission] Success must come from the live mission evidence, not focus completion."
africa_prove_the_first_obligation: "Prove the First Obligation"
africa_prove_the_first_obligation_desc: "Recognise the completed proof only after its target, corridor, consent, survival, and host-specific conditions have been met. A failed or lost proof must use the bounded recovery route."
africa_publish_the_first_obligation: "Publish the First Obligation"
africa_publish_the_first_obligation_desc: "Publish the cost, outcome, and remaining clauses of the first obligation so future members can judge the Charter by an inspectable record."
africa_invite_regional_delegates: "Invite Regional Delegates"
africa_invite_regional_delegates_desc: "Invite governments and accepted movements from the selected overlay. Delegates enter as negotiators with refusal rights, not as territories waiting to be absorbed."
africa_convene_provisional_congress: "Convene the Provisional Congress"
africa_convene_provisional_congress_desc: "Convene a provisional congress only after the regional mandate and first public obligation exist. The congress opens clauses, councils, and compact-host promotion evidence."
africa_write_provisional_charter: "Write the Provisional Charter"
africa_write_provisional_charter_desc: "Write the provisional rules for representation, defence, resources, withdrawal, and dispute settlement. The Charter raises consent while preserving member choice."
africa_choose_constitutional_principle: "Choose a Constitutional Principle"
africa_choose_constitutional_principle_desc: "Expose the six grounded constitutional routes after real proof, regional mandate, and host mandate are complete. The hidden Covenant remains a later high-chaos transformation."
africa_maghreb_sahara_face_divided_sovereignty: "Face Divided Sovereignty"
africa_maghreb_sahara_face_divided_sovereignty_desc: "Define who can exercise authority across Maghreb and Sahara, which local institutions must consent, and which exclusionary or colonial arrangements must be dismantled. The settlement changes the live consent ledger without merging governments."
africa_maghreb_sahara_join_coast_and_caravan: "Join Coast and Caravan"
africa_maghreb_sahara_join_coast_and_caravan_desc: "Authorise the Maghreb and Sahara rail corridor and its maintenance obligations. The mandate remains locked until a selected state project produces a real, connected railway."
africa_maghreb_sahara_prepare_the_first_guarantee: "Prepare the First Guarantee"
africa_maghreb_sahara_prepare_the_first_guarantee_desc: "Bind a real Maghreb and Sahara partner to the protection-first opening. The government keeps refusal and withdrawal rights while the host prepares the exact guarantee, aid, or recognition proof."
africa_maghreb_sahara_reconcile_port_and_interior: "Reconcile Port and Interior"
africa_maghreb_sahara_reconcile_port_and_interior_desc: "Settle the Maghreb and Sahara land, labour, resource, customs, or representation dispute named by this focus. The result strengthens regional equality and supplies evidence for later congress clauses."
africa_maghreb_sahara_seat_the_desert_council: "Seat the Desert Council"
africa_maghreb_sahara_seat_the_desert_council_desc: "Seat the Maghreb and Sahara council with delegates from functioning governments and accepted institutions. It creates a venue for claims and clauses, not a passive opinion bonus."
africa_maghreb_sahara_prove_a_northern_mandate: "Prove a Northern Mandate"
africa_maghreb_sahara_prove_a_northern_mandate_desc: "Prove a Maghreb and Sahara regional mandate only after both the corridor and political-settlement lanes converge. This mandate is required for the provisional congress and does not substitute for the host's live first proof."
africa_west_atlantic_a_mandate_from_ports_and_hinterlands: "A Mandate From Ports and Hinterlands"
africa_west_atlantic_a_mandate_from_ports_and_hinterlands_desc: "Define who can exercise authority across West Atlantic, which local institutions must consent, and which exclusionary or colonial arrangements must be dismantled. The settlement changes the live consent ledger without merging governments."
africa_west_atlantic_open_port_and_inland_route: "Open Port and Inland Route"
africa_west_atlantic_open_port_and_inland_route_desc: "Authorise the West Atlantic port corridor and its inland obligations. The mandate remains locked until a selected coastal state completes a real port modernisation."
africa_west_atlantic_protect_the_first_neighbour: "Protect the First Neighbour"
africa_west_atlantic_protect_the_first_neighbour_desc: "Bind a real West Atlantic partner to the protection-first opening. The government keeps refusal and withdrawal rights while the host prepares the exact guarantee, aid, or recognition proof."
africa_west_atlantic_make_export_wealth_public: "Make Export Wealth Public"
africa_west_atlantic_make_export_wealth_public_desc: "Settle the West Atlantic land, labour, resource, customs, or representation dispute named by this focus. The result strengthens regional equality and supplies evidence for later congress clauses."
africa_west_atlantic_seat_coasts_and_interior: "Seat Coasts and Interior"
africa_west_atlantic_seat_coasts_and_interior_desc: "Seat the West Atlantic council with delegates from functioning governments and accepted institutions. It creates a venue for claims and clauses, not a passive opinion bonus."
africa_west_atlantic_prove_the_atlantic_mandate: "Prove the Atlantic Mandate"
africa_west_atlantic_prove_the_atlantic_mandate_desc: "Prove a West Atlantic regional mandate only after both the corridor and political-settlement lanes converge. This mandate is required for the provisional congress and does not substitute for the host's live first proof."
africa_sahel_lake_chad_secure_food_and_water: "Secure Food and Water"
africa_sahel_lake_chad_secure_food_and_water_desc: "Define who can exercise authority across Sahel and Lake Chad, which local institutions must consent, and which exclusionary or colonial arrangements must be dismantled. The settlement changes the live consent ledger without merging governments."
africa_sahel_lake_chad_open_the_mobile_corridor: "Open the Mobile Corridor"
africa_sahel_lake_chad_open_the_mobile_corridor_desc: "Authorise the Sahel and Lake Chad river-and-lake transport project. The mandate remains locked until a selected registered basin state records full physical transport evidence."
africa_sahel_lake_chad_guard_the_first_partner: "Guard the First Partner"
africa_sahel_lake_chad_guard_the_first_partner_desc: "Bind a real Sahel and Lake Chad partner to the protection-first opening. The government keeps refusal and withdrawal rights while the host prepares the exact guarantee, aid, or recognition proof."
africa_sahel_lake_chad_settle_pasture_and_market: "Settle Pasture and Market"
africa_sahel_lake_chad_settle_pasture_and_market_desc: "Settle the Sahel and Lake Chad land, labour, resource, customs, or representation dispute named by this focus. The result strengthens regional equality and supplies evidence for later congress clauses."
africa_sahel_lake_chad_convene_the_lake_council: "Convene the Lake Council"
africa_sahel_lake_chad_convene_the_lake_council_desc: "Seat the Sahel and Lake Chad council with delegates from functioning governments and accepted institutions. It creates a venue for claims and clauses, not a passive opinion bonus."
africa_sahel_lake_chad_prove_the_inland_mandate: "Prove the Inland Mandate"
africa_sahel_lake_chad_prove_the_inland_mandate_desc: "Prove a Sahel and Lake Chad regional mandate only after both the corridor and political-settlement lanes converge. This mandate is required for the provisional congress and does not substitute for the host's live first proof."
