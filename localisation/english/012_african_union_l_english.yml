africa_priority_member_natural_disaster_actions_category: "Priority Member Nature Arsenal"
africa_priority_member_natural_disaster_actions_category_desc: "A completed priority package may petition rain or defy drought against an enemy through the host's Charter ledger. Recorded nature authority: §Y[ROOT.GetAfricaPriorityMemberNaturePowerName]§!. Greater authority can unlock stronger calamities."
africa_priority_member_refresh_natural_disaster_targets: "Refresh Enemy Nature Targets"
africa_priority_member_refresh_natural_disaster_targets_desc: "Survey the current enemy roster for a priority member's bounded nature action. This refresh is explicit and grants no claim, core, or membership."
africa_priority_member_petition_the_rain: "Priority Member: Petition The Rain"
africa_priority_member_petition_the_rain_desc: "[ROOT.GetAfricaPriorityMemberNatureInvocationName] directs the rite. The priority member pays the caller reserve and asks the League host to direct a random severe natural calamity at the selected enemy. Recorded authority: §Y[ROOT.GetAfricaPriorityMemberNaturePowerName]§!. The package's authority shapes the impact."
africa_priority_member_defy_the_drought: "Priority Member: Defy The Drought"
africa_priority_member_defy_the_drought_desc: "[ROOT.GetAfricaPriorityMemberNatureInvocationName] breaks the season. The priority member pays the caller reserve and asks the League host to direct a random regional natural calamity at the selected enemy. Recorded authority: §Y[ROOT.GetAfricaPriorityMemberNaturePowerName]§!. Stronger packages can make the result catastrophic."
africa_priority_member_natural_disaster_ai_cycle: "Priority Member Nature Action"
africa_priority_member_natural_disaster_ai_cycle_desc: "The package AI refreshes its enemy roster, selects a random rain or drought action, and enters it through the shared Charter ledger."
africa_priority_member_natural_disaster_dynamic_cost: "Caller reserve: political power and command power. The priority member pays this reserve; the League host pays the quoted Charter commitment and records one action."
africa_priority_member_natural_disaster_launch_tt: "The selected enemy receives one random natural calamity through Event 013. The action uses the member's §Y[ROOT.GetAfricaPriorityMemberNaturePowerName]§! package authority, the host's progression, and the existing cooldown and backfire rules."
