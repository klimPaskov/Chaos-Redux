l_english:
chaosx.nr12.1.t: "A Charter from [ROOT.GetNameDef]"
chaosx.nr12.1.d: "From [ROOT.Capital.GetName], [ROOT.GetNameDef] has announced a continental project whose first promise is protection. Its government will defend African states, move aid through threatened corridors, recognise viable liberation governments, and invite willing governments to negotiate a Charter League. No state is promised away, and no opinion score can turn a country into a province.\n\nOpening problem: [ROOT.GetAfricaHostProblem]\n\nFirst proof: [ROOT.GetAfricaHostProofMission]\n\nStrategic leverage: [ROOT.GetAfricaHostLeverage]\n\nRival pressure: [ROOT.GetAfricaHostRivalRisk]"
chaosx.nr12.1.a: "Protection must come before union."

chaosx.nr12.2.t: "The First Delegations"
chaosx.nr12.2.d: "The declaration has drawn governments, organisers, and regional rivals toward [ROOT.Capital.GetName]. The first commitment will shape who believes the Charter and who prepares to oppose it. [ROOT.GetNameDef] can choose a priority, but it cannot answer every request at once."
chaosx.nr12.2.slot_1: "Place [africa_first_contact_slot_1.GetNameDef]'s delegation first."
chaosx.nr12.2.slot_2: "Place [africa_first_contact_slot_2.GetNameDef]'s delegation first."
chaosx.nr12.2.slot_3: "Place [africa_first_contact_slot_3.GetNameDef]'s delegation first."
chaosx.nr12.2.slot_4: "Place [africa_first_contact_slot_4.GetNameDef]'s delegation first."
chaosx.nr12.2.slot_5: "Place [africa_first_contact_slot_5.GetNameDef]'s delegation first."
chaosx.nr12.2.no_contact: "The delegations are gone. Record the failed opening and seek a real partner again."

chaosx.events_log.window.event_details.africa: "An African government has started pulling the continent together with aid, guarantees, liberation deals, and a common Charter. Other countries can join, bargain, walk away, or build a rival camp. If the project keeps its promises, regional congresses and constitutional settlements can turn the idea into roads, armies, laws, and a fierce argument over who carries the cost."
# Event 12 action council
africa_charter_council_category: "The Charter League Councils"
africa_charter_council_category_desc: "Select one eligible target, open a council, inspect its quoted commitment, and launch only as much work as the Charter can administer.\n\nConstitutional rules include Representation: §Y[?africa_constitutional_representation|0]§!, Executive power: §Y[?africa_constitutional_executive_power|0]§!, Resource governance: §Y[?africa_constitutional_resource_governance|0]§!, Common command: §Y[?africa_constitutional_command_integration|0]§!, Withdrawal protection: §Y[?africa_constitutional_withdrawal_protection|0]§!, Crisis resilience: §Y[?africa_constitutional_crisis_resilience|0]§!, Post-unification rule: §Y[?africa_constitutional_post_unification_rule|0]§!. These values alter quoted costs and outcome risk for the corresponding Charter actions."
