africa_swahili_indian_ocean_settle_port_and_mainland_authority: "Settle Port and Mainland Authority"
africa_swahili_indian_ocean_settle_port_and_mainland_authority_desc: "Define who can exercise authority across Swahili and Indian Ocean, which local institutions must consent, and which exclusionary or colonial arrangements must be dismantled. The settlement changes the live consent ledger without merging governments."
africa_swahili_indian_ocean_open_the_maritime_corridor: "Open the Maritime Corridor"
africa_swahili_indian_ocean_open_the_maritime_corridor_desc: "Authorise the Swahili and Indian Ocean maritime corridor. The mandate remains locked until a selected coastal state completes a real port modernisation."
africa_swahili_indian_ocean_guard_the_first_convoy_partner: "Guard the First Convoy Partner"
africa_swahili_indian_ocean_guard_the_first_convoy_partner_desc: "Bind a real Swahili and Indian Ocean partner to the protection-first opening. The government keeps refusal and withdrawal rights while the host prepares the exact guarantee, aid, or recognition proof."
africa_swahili_indian_ocean_write_common_customs: "Write Common Customs"
africa_swahili_indian_ocean_write_common_customs_desc: "Settle the Swahili and Indian Ocean land, labour, resource, customs, or representation dispute named by this focus. The result strengthens regional equality and supplies evidence for later congress clauses."
africa_swahili_indian_ocean_convene_coast_and_islands: "Convene Coast and Islands"
africa_swahili_indian_ocean_convene_coast_and_islands_desc: "Seat the Swahili and Indian Ocean council with delegates from functioning governments and accepted institutions. It creates a venue for claims and clauses, not a passive opinion bonus."
africa_swahili_indian_ocean_prove_the_maritime_mandate: "Prove the Maritime Mandate"
africa_swahili_indian_ocean_prove_the_maritime_mandate_desc: "Prove a Swahili and Indian Ocean regional mandate only after both the corridor and political-settlement lanes converge. This mandate is required for the provisional congress and does not substitute for the host's live first proof."
africa_southern_africa_break_the_exclusionary_order: "Break the Exclusionary Order"
africa_southern_africa_break_the_exclusionary_order_desc: "Define who can exercise authority across Southern Africa, which local institutions must consent, and which exclusionary or colonial arrangements must be dismantled. The settlement changes the live consent ledger without merging governments."
africa_southern_africa_secure_rail_port_and_mine: "Secure Rail Port and Mine"
africa_southern_africa_secure_rail_port_and_mine_desc: "Authorise the Southern African rail spine linking production and an accessible port. The mandate remains locked until a selected state project produces a real, connected railway."
africa_southern_africa_guarantee_the_first_neighbour: "Guarantee the First Neighbour"
africa_southern_africa_guarantee_the_first_neighbour_desc: "Bind a real Southern Africa partner to the protection-first opening. The government keeps refusal and withdrawal rights while the host prepares the exact guarantee, aid, or recognition proof."
africa_southern_africa_settle_land_and_labour: "Settle Land and Labour"
africa_southern_africa_settle_land_and_labour_desc: "Settle the Southern Africa land, labour, resource, customs, or representation dispute named by this focus. The result strengthens regional equality and supplies evidence for later congress clauses."
africa_southern_africa_convene_the_southern_council: "Convene the Southern Council"
africa_southern_africa_convene_the_southern_council_desc: "Seat the Southern Africa council with delegates from functioning governments and accepted institutions. It creates a venue for claims and clauses, not a passive opinion bonus."
africa_southern_africa_prove_the_reconstruction_mandate: "Prove the Reconstruction Mandate"
africa_southern_africa_prove_the_reconstruction_mandate_desc: "Prove a Southern Africa regional mandate only after both the corridor and political-settlement lanes converge. This mandate is required for the provisional congress and does not substitute for the host's live first proof."
africa_madagascar_islands_settle_island_authority: "Settle Island Authority"
africa_madagascar_islands_settle_island_authority_desc: "Define who can exercise authority across Madagascar and Islands, which local institutions must consent, and which exclusionary or colonial arrangements must be dismantled. The settlement changes the live consent ledger without merging governments."
africa_madagascar_islands_open_the_convoy_network: "Open the Convoy Network"
africa_madagascar_islands_open_the_convoy_network_desc: "Authorise the Madagascar and Islands convoy network. The mandate remains locked until a selected coastal state completes a real port modernisation."

africa_focus_overlay_partner_requirement_tt: "A living §YProtected§!, §YAssociate§!, §YChartered§!, §YAutonomous Federal§!, or §YIntegrated§! partner must exist in the host's regional overlay."
africa_focus_overlay_corridor_requirement_tt: "The overlay's authorised rail, river, lake, or port action must finish with §YFull physical evidence§!."
africa_madagascar_islands_protect_the_first_island_partner: "Protect the First Island Partner"
africa_madagascar_islands_protect_the_first_island_partner_desc: "Bind a real Madagascar and Islands partner to the protection-first opening. The government keeps refusal and withdrawal rights while the host prepares the exact guarantee, aid, or recognition proof."
africa_madagascar_islands_join_highland_and_coast: "Join Highland and Coast"
africa_madagascar_islands_join_highland_and_coast_desc: "Settle the Madagascar and Islands land, labour, resource, customs, or representation dispute named by this focus. The result strengthens regional equality and supplies evidence for later congress clauses."
africa_madagascar_islands_convene_the_islands_council: "Convene the Islands Council"
africa_madagascar_islands_convene_the_islands_council_desc: "Seat the Madagascar and Islands council with delegates from functioning governments and accepted institutions. It creates a venue for claims and clauses, not a passive opinion bonus."
africa_madagascar_islands_prove_the_ocean_mandate: "Prove the Ocean Mandate"
africa_madagascar_islands_prove_the_ocean_mandate_desc: "Prove a Madagascar and Islands regional mandate only after both the corridor and political-settlement lanes converge. This mandate is required for the provisional congress and does not substitute for the host's live first proof."
africa_host_signature_confront_origin_crisis: "Confront the Origin Crisis"
africa_host_signature_confront_origin_crisis_desc: "The full host dossier confronts its accepted opening weakness: [ROOT.GetAfricaHostProblem] The settlement records a real political liability rather than hiding it beneath a generic bonus."
africa_host_signature_use_origin_leverage: "Use the Origin Leverage"
africa_host_signature_use_origin_leverage_desc: "Mobilise the host's accepted leverage without concentrating every benefit in the capital: [ROOT.GetAfricaHostLeverage]"
africa_host_signature_contain_origin_rival: "Contain the Origin Rival"
africa_host_signature_contain_origin_rival_desc: "Answer the host's mapped rival risk through a visible settlement, deterrent, or negotiated limit: [ROOT.GetAfricaHostRivalRisk]"
africa_host_signature_prove_origin_mandate: "Prove the Origin Mandate"
africa_host_signature_prove_origin_mandate_desc: "Convert the completed live proof into a host mandate only after the accepted mission has succeeded: [ROOT.GetAfricaHostProofMission]"
africa_compact_signature_secure_distinct_role: "Secure a Distinct Compact Role"
africa_compact_signature_secure_distinct_role_desc: "Define the compact host's corridor, island, council, restoration, or sovereign role. This establishes a recognisable campaign identity without pretending the compact opening is already a full dossier."
africa_compact_signature_prove_viable_host: "Prove a Viable Compact Host"
africa_compact_signature_prove_viable_host_desc: "Prove viable territory, local support, a functioning institution, and the mapped opening obligation. Promotion remains locked until its additional documented campaign conditions are met."
africa_select_next_mapped_first_proof_action: "Review the Next Proof Obligation"
africa_select_next_mapped_first_proof_action_desc: "Cycle to the next action admitted by this host's public proof dossier. The selected obligation still needs its exact government, state or corridor target and quoted resources. A partial or failed result closes the first mandate and opens its bounded recovery path."
africa_clear_selected_action_states: "Clear the Selected State Roster"
africa_clear_selected_action_states_desc: "Clear the current state or regional map selection before quoting another project. This changes no government relationship and spends no resources."

# Charter League constitutional relationships
autonomy_africa_federal_member: "Charter Federal Member"
autonomy_africa_integrated_region: "Integrated Charter Region"
autonomy_africa_federal_member_desc: "A self-governing Charter League member whose accepted federal statute preserves its public institutions, country identity, and right to decline a continental call to arms. Its current settlement term is revised or ended only through the Charter withdrawal process."
autonomy_africa_integrated_region_desc: "A self-governing country joined to the continental executive and common command by a final public integration ballot. Local institutions and country identity remain protected under the living-core settlement."

