africa_host_signature_prove_origin_mandate: "Prove the Origin Mandate"
africa_host_signature_prove_origin_mandate_desc: "Convert the completed live proof into a host mandate only after the accepted mission has succeeded: [ROOT.GetAfricaHostProofMission]"
africa_compact_signature_secure_distinct_role: "Secure a Distinct Compact Role"
