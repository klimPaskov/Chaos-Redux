africa_host_signature_use_origin_leverage: "Use the Origin Leverage"
africa_host_signature_use_origin_leverage_desc: "Mobilise the host's accepted leverage without concentrating every benefit in the capital: [ROOT.GetAfricaHostLeverage]"
africa_host_signature_contain_origin_rival: "Contain the Origin Rival"
