africa_record_compact_promotion_proof: "Submit the Compact Host Evidence Dossier"
africa_record_compact_promotion_proof_desc: "Submit a congress dossier only after the mapped host weakness has been confronted by a successful first proof, the public obligation has been fulfilled, the provisional congress is seated, the compact role is proven, the capital remains controlled, and stability and war support remain above the Charter floor. This records two campaign criteria. Opinion alone cannot qualify a host."
africa_record_compact_promotion_proof_tt: "Costs £pol_power §Y[?constant:africa_compact_promotion.proof_pp_cost|0]§! and records the country's survival, fulfilled obligation, seated congress, controlled capital, public support, stability, and war support. It transfers no territory and changes no relationship."
africa_compact_promotion_proof_requirement_tt: "Requires the published mapped weakness, a succeeded or recovered first proof, the public obligation, a provisional congress, both compact signature focuses, controlled capital, regional phase, resilience floors, and no active dispute, damaged access, refusal, or prior proof receipt."
africa_promote_compact_host: "Promote the Compact Host Dossier"
africa_promote_compact_host_desc: "The evidence docket contains at least two documented criteria. Pay the final administrative cost to recognise this compact host as a full continental host. The country retains its identity and must still meet the capital, overlap, access, and refusal requirements."
africa_promote_compact_host_tt: "Costs £pol_power §Y[?constant:africa_compact_promotion.promotion_pp_cost|0]§!. Recognition requires a controlled capital, viable territory, local support, a functioning institution, a distinct role, two recorded criteria, and no active dispute, damaged access, or refusal."
africa_compact_promotion_requirement_tt: "Requires the current compact host, controlled capital, viable territory, local support, a functioning institution, a distinct role, two recorded criteria, and no active dispute, damaged access, refusal, or prior promotion."
africa_decline_compact_promotion: "Decline the Compact Dossier"
africa_decline_compact_promotion_desc: "Keep the country as a compact host and refuse full continental recognition. This constitutional choice does not annex members, remove rights, or change opinion."
africa_decline_compact_promotion_tt: "Sets a refusal receipt that blocks automatic or opinion-based promotion. The docket can be reopened later through a paid congress reconsideration."
africa_reopen_compact_promotion_docket: "Reopen the Compact Dossier"
africa_reopen_compact_promotion_docket_desc: "Pay the congress reconsideration cost to clear the compact host's refusal receipt. Existing evidence remains recorded, but promotion must still pass every live gate."
africa_reopen_compact_promotion_docket_tt: "Costs £pol_power §Y[?constant:africa_compact_promotion.reopen_pp_cost|0]§! and withdraws the recorded refusal. It grants no promotion criteria, relationship, core, territory, or opinion change."
africa_refresh_african_contacts: "Refresh Regional Contacts"
africa_refresh_african_contacts_desc: "Update the League's regional contacts with reachable African governments known to the host. The survey is conducted once so the court can work from an established diplomatic picture."
africa_refresh_external_crisis_targets: "Refresh External Crisis Parties"
africa_refresh_external_crisis_targets_desc: "Update the court's crisis contacts with colonial holders, intervention-coalition members, continental partners, and other actors already known to the League."
africa_select_charter_target: "Select [FROM.GetNameDef]"
africa_select_charter_target_desc: "Make [FROM.GetNameDef] the sole country shown on the Charter action card. Selection grants no membership, consent, or territorial right."
africa_select_host_charter_target: "Select the Host Administration"
africa_select_host_charter_target_desc: "Bind the Charter action card to [ROOT.GetNameDef] for a home-region audit, settlement, or project. This changes no relationship state."
africa_select_action_state_target: "Select [FROM.GetName] for the Project"
africa_select_action_state_target_desc: "Tie this exact state to the quoted state project. The action cannot begin until one eligible state is selected, and the project remains tied to that choice."
africa_execute_selected_country_action: "Launch [ROOT.GetAfricaSelectedActionName] for [FROM.GetNameDef]"
africa_execute_selected_country_action_desc: "Carry out [ROOT.GetAfricaSelectedActionName] for [FROM.GetNameDef]. The quoted commitment is paid once, and the Charter records the resulting outcome."
africa_execute_selected_host_action: "Launch [ROOT.GetAfricaSelectedActionName]"
africa_execute_selected_host_action_desc: "Carry out [ROOT.GetAfricaSelectedActionName] through the host ledger. The quoted commitment is paid once, and the Charter records the resulting outcome."
africa_selected_action_dynamic_cost: "Quoted commitment: £pol_power [?africa_quote_cost_pp|0], £command_power [?africa_quote_cost_cp|0], [?africa_quote_cost_manpower|0] manpower, [?africa_quote_cost_infantry|0] infantry equipment, [?africa_quote_cost_support|0] support equipment, [?africa_quote_cost_motorized|0] trucks, [?africa_quote_cost_trains|0] trains, [?africa_quote_cost_convoys|0] convoys, [?africa_quote_cost_fuel|0] fuel, [?africa_quote_cost_civilian|0] administrative capacity, [?africa_quote_cost_intelligence|0] intelligence capacity, [?africa_quote_cost_stability|%] stability, and [?africa_quote_cost_war_support|%] war support.[ROOT.GetAfricaSelectedActionAdditionalCost]"
