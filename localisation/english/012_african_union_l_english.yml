chaosx.nr12.210.t: "A Charter Offer from [africa_host.GetNameDef]"
chaosx.nr12.210.d: "[africa_host.GetNameDef] has placed [ROOT.GetAfricaActiveActionName] before our government. Acceptance writes the offered clauses; negotiation preserves a limited settlement; refusal leaves our sovereignty intact and records the political consequence."
chaosx.nr12.210.a: "Accept the written terms."
chaosx.nr12.210.b: "Negotiate a narrower settlement."
chaosx.nr12.210.c: "Refuse the offer."
chaosx.nr12.220.t: "[africa_action_result_target.GetAfricaLastActionName]: [africa_action_result_target.GetAfricaLastActionOutcomeName]"
chaosx.nr12.220.d: "[africa_action_result_target.GetAfricaLastActionResultDescription]\n\nThe Charter Council has entered the settlement with [africa_action_result_target.GetNameDef] and its immediate obligations in the public ledger."
chaosx.nr12.220.a: "Enter the result in the council ledger."
chaosx.nr12.221.t: "Charter Action Cannot Begin"
chaosx.nr12.221.d: "[ROOT.GetAfricaSelectedActionName] cannot begin because its final target, route, or programme requirements are no longer met. No commitment has been spent, and the current quotation remains available for review."
chaosx.nr12.221.a: "Review the Charter Council record."

chaosx.nr12.300.t: "An Invitation to Association"
chaosx.nr12.300.d: "[africa_host.GetNameDef] has invited [ROOT.GetNameDef] to become an associate of the Charter League. Association would preserve our government while adding written duties and a formal voice. We may accept, return different terms, or remain under protection without joining."
chaosx.nr12.300.a: "Accept associate standing."
chaosx.nr12.300.a.tt: "[ROOT.GetNameDef] accepts the written association terms and enters the Charter League as an §YAssociate§!."
chaosx.nr12.300.b: "Return a counterproposal."
chaosx.nr12.300.b.tt: "[ROOT.GetNameDef] remains §YProtected§! while its government seeks narrower duties and stronger safeguards."
chaosx.nr12.300.c: "Decline association."
chaosx.nr12.300.c.tt: "[ROOT.GetNameDef] remains §YProtected§! and records its refusal in the public Charter ledger."

chaosx.nr12.301.t: "The Charter Clauses"
chaosx.nr12.301.d: "The member council has offered [ROOT.GetNameDef] a chartered seat with representation, accession clauses, and reciprocal obligations. Our associate compact remains valid if we refuse; no office in [africa_host.GetNameDef] can sign on our behalf."
chaosx.nr12.301.a: "Sign the Charter clauses."
chaosx.nr12.301.a.tt: "[ROOT.GetNameDef] accepts representation and accession obligations and becomes a §YChartered Member§!."
chaosx.nr12.301.b: "Renegotiate the clauses."
chaosx.nr12.301.b.tt: "[ROOT.GetNameDef] remains an §YAssociate§! while its delegates return a clause-by-clause counterproposal."
chaosx.nr12.301.c: "Keep the associate compact."
chaosx.nr12.301.c.tt: "[ROOT.GetNameDef] refuses chartered admission and retains its §YAssociate§! relationship."

chaosx.nr12.302.t: "An Autonomous Federal Statute"
chaosx.nr12.302.d: "The Charter Congress has completed an autonomy statute for [ROOT.GetNameDef]. It defines the powers held locally, the powers exercised jointly, and the representation attached to each. The statute takes effect only with our government's consent."
chaosx.nr12.302.a: "Ratify the autonomy statute."
chaosx.nr12.302.a.tt: "[ROOT.GetNameDef] enters the federation as an §YAutonomous Federal Region§! under the negotiated statute."
chaosx.nr12.302.b: "Amend the division of powers."
chaosx.nr12.302.b.tt: "[ROOT.GetNameDef] remains a §YChartered Member§! and returns a counterproposal on powers and representation."
chaosx.nr12.302.c: "Refuse the statute."
chaosx.nr12.302.c.tt: "[ROOT.GetNameDef] remains a §YChartered Member§! and rejects this autonomy offer."

chaosx.nr12.303.t: "The Final Integration Ballot"
chaosx.nr12.303.d: "[ROOT.GetNameDef] has completed the required relationship, administrative, representation, and public-consent proofs. The Charter now offers full constitutional integration. The proofs make the ballot possible; they do not decide it."
chaosx.nr12.303.a: "Approve constitutional integration."
chaosx.nr12.303.a.tt: "[ROOT.GetNameDef] gives final consent and becomes an §YIntegrated Region§! under its proven settlement."
chaosx.nr12.303.b: "Negotiate a later timetable."
chaosx.nr12.303.b.tt: "[ROOT.GetNameDef] keeps its present relationship and proposes a different timetable for another public decision."
chaosx.nr12.303.c: "Reject integration."
chaosx.nr12.303.c.tt: "[ROOT.GetNameDef] keeps its present constitutional relationship and records a final refusal."

chaosx.nr12.304.t: "Terms of Departure"
chaosx.nr12.304.d: "[ROOT.GetNameDef] has invoked its withdrawal rights. The Charter offers a looser associate compact, a completed lawful exit, or the continuation of an unresolved dispute. The departing government retains the final choice."
chaosx.nr12.304.a: "Rejoin as an associate."
chaosx.nr12.304.a.tt: "[ROOT.GetNameDef] accepts a looser settlement and returns as an §YAssociate§!."
chaosx.nr12.304.b: "Complete the lawful exit."
chaosx.nr12.304.b.tt: "[ROOT.GetNameDef] completes its withdrawal and becomes §YOutside§! the Charter relationship system."
chaosx.nr12.304.c: "Leave the dispute unresolved."
chaosx.nr12.304.c.tt: "[ROOT.GetNameDef] remains §YLeaving§! while negotiations break down."

chaosx.nr12.305.t: "A Settlement with the Rival Bloc"
chaosx.nr12.305.d: "The Charter Congress has offered [ROOT.GetNameDef] three public outcomes: a voluntary associate merger, equal-status coexistence between rival institutions, or rejection. Our government and identity remain intact unless we accept the merger ourselves."
chaosx.nr12.305.a: "Enter as an associate."
chaosx.nr12.305.a.tt: "[ROOT.GetNameDef] voluntarily dissolves the rival compact and enters the Charter League as an §YAssociate§!."
chaosx.nr12.305.b: "Sign an equal-status coexistence treaty."
chaosx.nr12.305.b.tt: "[ROOT.GetNameDef] remains a §YRival Bloc§! under a treaty recognising both institutions."
chaosx.nr12.305.c: "Reject the settlement."
chaosx.nr12.305.c.tt: "[ROOT.GetNameDef] remains a §YRival Bloc§! and increases the external pressure facing the Charter."

chaosx.nr12.306.t: "[africa_focus_negotiation_target.GetNameDef] Answers the Congress"
chaosx.nr12.306.accepted.d: "[africa_focus_negotiation_target.GetNameDef] has accepted the proposed constitutional relationship. Its government's decision and the resulting obligations enter the public Charter ledger."
chaosx.nr12.306.countered.d: "[africa_focus_negotiation_target.GetNameDef] has returned a counterproposal. Its existing relationship remains in force while the disputed clauses, timetable, or terms of coexistence remain open."
chaosx.nr12.306.refused.d: "[africa_focus_negotiation_target.GetNameDef] has refused the proposed settlement. Its existing government and relationship remain intact, and the refusal enters the public Charter ledger."
chaosx.nr12.306.a: "Respect the recorded decision."
