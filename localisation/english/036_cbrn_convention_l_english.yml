cbrn_convention_seek_accession_desc: "Ask the convention for a seat. A review follows, and we choose our posture when it ends."
cbrn_convention_seek_accession_tt: "Starts an §Y[?constant:cbrn_convention_timing.accession_review_days|0]§!-day Accession Review."
cbrn_convention_accession_cooling_tt: "§Y[?constant:cbrn_convention_timing.accession_cooling_days|0]§! days have passed since our last change of posture."
cbrn_convention_covert_program: "A covert program is running"
cbrn_convention_declaration_filed: "Our declarations are on file"
cbrn_convention_assistance_delivered: "The protective equipment has been delivered"
cbrn_convention_no_covert_tt: "We have no covert program running."
cbrn_convention_accession_review_mission: "Accession Review"
cbrn_convention_accession_review_mission_desc: "The convention is reviewing our application for a seat."
cbrn_convention_accession_review_timeout_tt: "The review ends and we choose how to join the convention."
cbrn_convention_revise_posture_decision: "Revise Posture"
cbrn_convention_revise_posture_decision_desc: "Change what we have promised the convention. The change binds us for a year."
cbrn_convention_revise_posture_tt: "Opens a choice among the postures we may move to. Stability falls a little, and the posture cannot change again for §Y[?constant:cbrn_convention_timing.revision_lock_days|0]§! days."
cbrn_convention_revision_lock_tt: "§Y[?constant:cbrn_convention_timing.revision_lock_days|0]§! days have passed since our last change of posture."
cbrn_convention_not_suspended_tt: "Our vote is not suspended."
cbrn_convention_begin_withdrawal: "Begin Withdrawal"
cbrn_convention_begin_withdrawal_desc: "Give notice that we are leaving the convention."
cbrn_convention_begin_withdrawal_tt: "Starts a §Y[?constant:cbrn_convention_timing.withdrawal_notice_days|0]§!-day Withdrawal Notice. We keep our obligations until it ends."
cbrn_convention_no_open_guarantee_tt: "We owe no Assistance Guarantee."
cbrn_convention_withdrawal_notice_mission: "Withdrawal Notice"
cbrn_convention_withdrawal_notice_mission_desc: "Our notice of withdrawal from the convention is running."
cbrn_convention_withdrawal_timeout_tt: "We leave the convention. Our ratifications and treaty benefits end."
cbrn_convention_begin_covert_program_decision: "Begin Covert Program"
cbrn_convention_begin_covert_program_decision_desc: "Prepare weapons in secret while rejecting the convention in public."
cbrn_convention_begin_covert_tt: "Starts a covert program in one weapon family and ties up a civilian factory for §Y[?constant:cbrn_convention_timing.covert_setup_days|0]§! days. Other governments cannot see it unless it is exposed."
cbrn_convention_not_exposed_tt: "Our earlier covert program was not exposed."
cbrn_convention_expand_covert_program: "Expand Covert Program"
cbrn_convention_expand_covert_program_desc: "Direct more of our research and production into the secret program."
cbrn_convention_expand_covert_tt: "Ties up a civilian factory for §Y[?constant:cbrn_convention_timing.covert_expansion_days|0]§! days and leaves more hidden evidence. When the order is complete, research in the program's family advances."
cbrn_convention_end_covert_program_decision: "End Covert Program"
cbrn_convention_end_covert_program_decision_desc: "Close the secret program. Completed research and recorded evidence remain."
cbrn_convention_end_covert_tt: "The covert program ends without exposure."
cbrn_convention_sponsor_agenda: "Sponsor the Agenda"
cbrn_convention_sponsor_agenda_desc: "Put our name on the proposal under negotiation."
cbrn_convention_sponsor_tt: "We become the sponsor. Our ratification is automatic and our lobbying counts double."
cbrn_convention_sponsor_cooldown_tt: "We have not sponsored an agenda in the last year."
cbrn_convention_sponsor_taken_tt: "No other human government sponsors the agenda."
cbrn_convention_lobby_ratification: "Lobby for Ratification"
cbrn_convention_lobby_ratification_desc: "Press the other delegations to ratify this round."
cbrn_convention_lobby_tt: "Raises the chance that other governments ratify this round."
cbrn_convention_organize_opposition_decision: "Organize Opposition"
cbrn_convention_organize_opposition_decision_desc: "Press the other delegations to refuse this round."
cbrn_convention_opposition_tt: "Lowers the chance that other governments ratify this round and angers the sponsor. The opposition's leader counts double."
cbrn_convention_file_declarations: "File Declarations"
cbrn_convention_file_declarations_desc: "Report what our chemical works and laboratories hold and produce."
cbrn_convention_file_declarations_tt: "Our declarations go on file before the deadline."
cbrn_convention_declaration_mission: "Declaration Deadline"
cbrn_convention_declaration_mission_desc: "Our yearly declarations are due, and a missed deadline suspends our vote."
