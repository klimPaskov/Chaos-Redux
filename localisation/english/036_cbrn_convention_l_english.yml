cbrn_convention.family.3.dispute: "The proposal would put every military laboratory that works with pathogens on a register, with containment standards and a yearly declaration."
cbrn_convention.family.4.dispute: "The proposal would let members send inspectors into one another's laboratories and depots, and suspend any member that turns them away."
cbrn_convention.family.5.dispute: "The proposal would let members authorize the first use of gas, and separately of disease, as an ordinary decision of the high command."
cbrn_convention.family.6.dispute: "The proposal would open joint work on rockets, missiles and aircraft able to carry the weapons the convention already regulates."
cbrn_convention.family.7.dispute: "The proposal would bind members to plan chemical, biological, nuclear and missile forces together, with shared reserves and protection."
cbrn_convention.family.8.dispute: "The proposal would extend the convention to atomic research and name the targets a member may strike, from depots and rail junctions to factory districts."
cbrn_convention.family.9.dispute: "The proposal would drop the remaining limits on stockpiles and use between members and end the sanctions they once placed on one another."
cbrn_convention.family.10.dispute: "The proposal would pool the research of the members into weapons that no government has built yet."
