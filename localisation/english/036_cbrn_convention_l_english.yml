l_english:

# Opening
chaosx.nr36.1.t: "Chemical and Biological Weapons Convention"
chaosx.nr36.2.t: "The Convention Is Open for Signature"
chaosx.nr36.2.desc: "The chemical works at the edge of the capital have asked the War Ministry for leave to triple their night shifts, and the Health Ministry wants to know how many masks each school should keep. Governments abroad have put their names to a convention that makes gas shells, laboratory cultures and the cylinders that carry them subjects of open policy, defended in public instead of denied. Generals ask for stockpile figures, hospital boards ask for filters, and the foreign ministry has been told that every embassy will be asked where we stand."
chaosx.nr36.2.a: "Ratify the convention in full."
chaosx.nr36.2.b: "Accept the gas articles and refuse the disease weapons."
chaosx.nr36.2.c: "Join for protection and keep the right to answer."
chaosx.nr36.2.d: "Reject the convention before the world."
chaosx.nr36.2.e: "Reject it in public and prepare in secret."
cbrn_convention_opening_full_tt: "We become a §YFull Ratification§! member and may ratify every treaty family. Chemical, biological and nuclear weapon use costs less Condemnation, and the chemical and biological Condemnation we already hold falls once."
cbrn_convention_opening_full_tier_tt: "Public standing after the opening: [GetCbrnConventionProjectedTierFull]"
cbrn_convention_opening_chemical_tt: "We become a §YChemical Accession§! member and sign the gas articles and nothing on disease. Chemical and nuclear weapon use costs less Condemnation, biological use costs the same, and the chemical Condemnation we already hold falls once."
cbrn_convention_opening_chemical_tier_tt: "Public standing after the opening: [GetCbrnConventionProjectedTierChemical]"
cbrn_convention_opening_reservation_tt: "We become a §YRetaliation Reservation§! member. We join the protection, inspection and guarantee treaties and publicly refuse first use. Weapons used in answer to an attack cost less Condemnation, and a first strike breaks the reservation. The chemical and biological Condemnation we already hold falls a little."
cbrn_convention_opening_reservation_tier_tt: "Public standing after the opening: [GetCbrnConventionProjectedTierReservation]"
cbrn_convention_opening_rejection_tt: "We keep the old prohibition and receive no benefit from the convention. We can organize opposition against its agendas and seek accession later."
cbrn_convention_opening_covert_tt: "We reject the convention in public and begin a §Ycovert program§! in one weapon family. The program stays hidden from other governments until it is exposed."
chaosx.nr36.3.t: "Governments Sign the Convention on Gas and Disease Weapons"
chaosx.nr36.3.d: "A convention on chemical and biological weapons has been opened for signature, and a first group of governments has signed. Its articles treat the manufacture, storage and defence against gas and disease weapons as matters for declaration and inspection instead of prohibition. Several governments refused to sign and call the text permission written in the language of regulation."
chaosx.nr36.3.a: "The text is public."

# Agendas
chaosx.nr36.10.t: "The Conference Takes Up the [GetCbrnConventionFamilyName]"
chaosx.nr36.10.d: "The next round of the convention has an agenda. [GetCbrnConventionFamilyDispute] [GetCbrnConventionSponsorLine] Delegations are lobbying in the corridors, and the governments outside the convention are doing the same against it."
chaosx.nr36.10.a: "We will follow the negotiations."
chaosx.nr36.11.t: "Our Answer on the [GetCbrnConventionFamilyName]"
chaosx.nr36.11.d: "The delegates are waiting for our reply. [GetCbrnConventionFamilyDispute] Silence will be recorded as a refusal."
chaosx.nr36.11.a: "Ratify."
chaosx.nr36.11.b: "Ratify with the reservation clause."
chaosx.nr36.11.c: "Decline to ratify."
cbrn_convention_response_ratify_tt: "We ratify the treaty, take on its obligations and receive its benefits."
cbrn_convention_response_reserve_tt: "We ratify with the reservation clause. The treaty binds us only in the part its text allows."
cbrn_convention_response_decline_tt: "We do not ratify and remain free of the treaty's obligations."
chaosx.nr36.12.t: "The Conference Closes on the [GetCbrnConventionFamilyName]"
chaosx.nr36.12.d_ok: "The conference has closed its round on the [GetCbrnConventionFamilyName]. Enough governments ratified for the treaty to take effect, and each of them is now carrying its articles into the ministries. [GetCbrnConventionOurRatificationLine]"
chaosx.nr36.12.d_failed: "The conference has closed its round on the [GetCbrnConventionFamilyName]. The ratifications it needed did not come, the sponsors have gone home with an unfinished text, and the proposal cannot return for months. [GetCbrnConventionOurRatificationLine]"
chaosx.nr36.12.a: "Noted."
chaosx.nr36.13.t: "Conference Resolution"
cbrn_convention.resolution.ours_ratified: "We were among the governments that ratified."
cbrn_convention.resolution.ours_opponent: "We stand outside the convention and outside the treaty."
cbrn_convention.resolution.ours_outside: "We did not ratify and stand outside the treaty."

# Evolutions
chaosx.nr36.20.t1: "First Use Becomes a Matter of Policy"
chaosx.nr36.20.d1: "Governments that signed the convention no longer ask whether gas and disease may be prepared. They ask who may order the first release and under what conditions. Chemical works are running double shifts on army contracts, laboratories under military guard are drawing up field trials, and the staff colleges have added a course on contamination to their syllabus. The conference will soon take up a revision of its rules on first use."
chaosx.nr36.20.a: "Read the revised policy papers."
chaosx.nr36.20.t2: "Planning for the Whole Arsenal"
chaosx.nr36.20.d2: "Armies that signed the convention have begun to plan chemical, biological, nuclear and missile forces as one arsenal. Stocks of masks, filters and decontamination crews are counted beside stocks of shells, and rocket units have been told which depots and junctions their warheads are meant for. The staffs treat joint doctrine as settled and ask their governments for treaties to make it binding."
chaosx.nr36.20.b: "Study the joint plans."
chaosx.nr36.20.t3: "The Arsenal Without Limits"
chaosx.nr36.20.d3: "Governments inside the convention have stopped arguing about limits. Stockpiles are measured in trainloads, delivery crews drill with live cylinders at night, and sanctions between members have been dropped from every agenda. In the laboratories there is talk of pooling the work of several countries to build weapons that no army has fielded yet."
chaosx.nr36.20.c: "Note the new order."

# Program
chaosx.nr36.40.t: "The Program Opens a Project"
chaosx.nr36.40.d: "The program has chosen its project: [GetCbrnConventionProjectName]. The work needs factories, laboratories, specialist equipment and guarded test sites from the member governments, and every contribution is entered in the program's books. Governments that contribute will be able to begin the project when the shared work is finished."
chaosx.nr36.40.a: "Read the project plan."
chaosx.nr36.41.t: "[GetCbrnConventionProjectName]: [GetCbrnConventionProjectStageName]"
chaosx.nr36.41.d: "[GetCbrnConventionStageReport]"
chaosx.nr36.41.a: "Review the progress."
chaosx.nr36.42.t: "Shared Work Finished: [GetCbrnConventionCompletedProjectName]"
chaosx.nr36.42.d: "The shared work on [GetCbrnConventionCompletedProjectName] is finished. Governments that contributed may now begin the project in their own laboratories. They must still research it, pay for it and answer for its use."
chaosx.nr36.42.a: "Assemble the project team."
chaosx.nr36.43.t: "The Work on [GetCbrnConventionCancelledProjectName] Is Abandoned"
chaosx.nr36.43.d: "The weapon the program was building has appeared through another route, and the program's engineers have been sent back to their ministries. What the member governments spent on the work is not returned."
chaosx.nr36.43.a: "Close the file."
chaosx.nr36.44.t: "No Weapon Within Reach"
chaosx.nr36.44.d: "The program has no unclaimed weapon left to pursue. Its committee has adjourned and will meet again when a new line of research opens."
chaosx.nr36.44.a: "Adjourn the committee."
cbrn_convention.stage_report.2: "The shared work on [GetCbrnConventionProjectName] has passed its first quarter. The program's charter is sealed and the first experimental runs are under way in guarded laboratories."
cbrn_convention.stage_report.3: "Half of the shared work on [GetCbrnConventionProjectName] is done. Prototype material has reached the member laboratories, and the engineers have begun to argue about handling procedures."
cbrn_convention.stage_report.4: "The shared work on [GetCbrnConventionProjectName] is in final validation. The last test series is being scheduled, and the governments that contributed are preparing their own project teams."

# Exposure, breach, suspension
chaosx.nr36.50.t: "The Secret Program Is Exposed"
chaosx.nr36.50.d: "Newspapers abroad have printed what our laboratories were doing under the cover of our public rejection. Ambassadors have been summoned, the governments that admired our stand have gone silent, and foreign ministries are asking for inspectors in every depot we own."
chaosx.nr36.50.a: "Answer the ambassadors."
chaosx.nr36.51.t: "The Reservation Is Broken"
chaosx.nr36.51.d: "We told the convention that our weapons would answer an attack and never begin one. The order we have just given breaks that promise. The governments that stood beside us in the reservation have recalled their delegates, and the conference has suspended our vote."
chaosx.nr36.51.a: "Face the delegates."
chaosx.nr36.52.t: "Our Vote Is Suspended"
chaosx.nr36.52.d: "The conference has suspended our vote for failing an obligation we took on. Our delegates may sit in the hall and listen, and our contributions to joint work are refused until the suspension lapses. A second failure within two years will end our membership."
chaosx.nr36.52.a: "Take our seat."
chaosx.nr36.53.t: "We Are Struck From the Convention"
chaosx.nr36.53.d: "The conference has removed us for a second failure of our obligations. Our ratifications are void, our delegates have been sent home, and the old prohibition is again the only rule that governs us before the world."
chaosx.nr36.53.a: "Recall the delegation."
cbrn_convention_suspension_tt: "Our vote in the conference is suspended for a time. A second suspension within two years ends our membership."

# Covert program choice
chaosx.nr36.55.t: "A Quiet Program"
chaosx.nr36.55.d: "Our public stand against the convention is unchanged. In private the army wants its research and production directed at one family of weapons, and the defence ministry asks which."
chaosx.nr36.55.a: "Chemical weapons."
chaosx.nr36.55.b: "Biological weapons."
cbrn_convention_covert_chemical_tt: "The covert program serves chemical weapons. Its work stays hidden until it is exposed."
cbrn_convention_covert_biological_tt: "The covert program serves biological weapons. Its work stays hidden until it is exposed."

# Membership
chaosx.nr36.60.t: "Our Application Is Accepted"
chaosx.nr36.60.d: "The review of our application is complete, and the convention is willing to seat our delegation. We must choose what we sign."
chaosx.nr36.60.a: "Join in full."
chaosx.nr36.60.b: "Join for the gas articles only."
chaosx.nr36.60.c: "Join with a retaliation reservation."
chaosx.nr36.61.t: "We Leave the Convention"
chaosx.nr36.61.d: "The notice has run its course. Our delegates have left the hall, our ratifications are withdrawn and our treaty benefits end with them. What we did under the convention stays on the record."
chaosx.nr36.61.a: "Close the delegation."
chaosx.nr36.62.t: "Revising Our Posture"
chaosx.nr36.62.desc: "The foreign ministry has drafted amendments to our standing in the convention. Any change binds us for a year."
chaosx.nr36.62.a: "Move to Full Ratification."
chaosx.nr36.62.b: "Move to Chemical Accession Only."
chaosx.nr36.62.c: "Move to a Retaliation Reservation."
chaosx.nr36.62.d: "Keep our posture as it is."
cbrn_convention_posture_full_tt: "Our posture becomes §YFull Ratification§!."
cbrn_convention_posture_chemical_tt: "Our posture becomes §YChemical Accession Only§!. Biological ratifications are withdrawn."
cbrn_convention_posture_reservation_tt: "Our posture becomes §YRetaliation Reservation§!. Treaties the reservation cannot hold are withdrawn."

# News
chaosx.nr36.71.t: "A Clause on Biological First Use Takes Effect"
chaosx.nr36.71.d: "A group of governments has ratified a clause that lets their high commands order the first use of biological weapons. Laboratories are being asked how fast cultures can be filled into shells and bombs, and governments outside the convention have recalled their ambassadors from the signatories' capitals."
chaosx.nr36.71.a: "The clause is in force."
chaosx.nr36.72.t: "A Clause on Chemical First Use Takes Effect"
chaosx.nr36.72.d: "A group of governments has ratified a clause that lets their high commands order the first use of gas. Chemical works are receiving army contracts for the quantities the clause makes lawful, and governments outside the convention call the text a licence to poison."
chaosx.nr36.72.a: "The clause is in force."
chaosx.nr36.73.t: "Strategic Doctrine Is Ratified"
chaosx.nr36.73.d: "The Strategic WMD Doctrine Charter has taken effect. Its signatories will plan gas, disease, atomic and missile forces together, and their staffs have begun to exchange reserve figures and target lists. Governments outside the convention call it a joint plan of war against whole populations."
chaosx.nr36.73.a: "The charter is in force."
chaosx.nr36.74.t: "The Arsenal Without Limits Is Signed"
chaosx.nr36.74.d: "The Arsenal Without Limits Articles have taken effect. Their signatories have set aside the remaining ceilings on stockpiles and use among themselves, and the sanctions they once placed on one another have been dropped. Governments outside the convention say the last written limit is gone."
chaosx.nr36.74.a: "The articles are in force."
chaosx.nr36.75.t: "A Joint Research Program Is Launched"
chaosx.nr36.75.d: "The International Chaos Weapons Program Charter has taken effect. Its members will pool factories, laboratories and test sites in one research program aimed at weapons that no government has built yet. Observers abroad are asking what the first project will be."
chaosx.nr36.75.a: "The charter is in force."
chaosx.nr36.76.t: "The Convention Falls Apart"
chaosx.nr36.76.d: "So many governments have left the convention that it can no longer fill its conference hall. The treaties already in force remain on paper, the delegates have gone home, and the governments that led the opposition are being congratulated in their capitals."
chaosx.nr36.76.a: "The hall is empty."
chaosx.nr36.77.t: "A Secret Weapons Program Is Exposed"
chaosx.nr36.77.d: "Documents published abroad show that [From.GetNameDef], which rejected the convention in public, has been running chemical and biological work in secret. Governments that praised its stand are asking for inspectors."
chaosx.nr36.77.a: "The documents are authentic."
chaosx.nr36.78.t: "The Shared Work on [GetCbrnConventionCompletedProjectName] Is Finished"
chaosx.nr36.78.d: "The members of the weapons program have completed their shared work on [GetCbrnConventionCompletedProjectName]. The governments that contributed may begin the project at home, and those that did not are asking for a place in the next one."
chaosx.nr36.78.a: "The program moves on."
chaosx.nr36.80.t: "Coordinator Pulse"

