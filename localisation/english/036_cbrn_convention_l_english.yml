# Event log and details
cbrn_convention.evolution.type: "Convention Doctrine"
cbrn_convention.evolution.stage_1.title: "First Use Becomes Acceptable"
cbrn_convention.evolution.stage_2.title: "Strategic WMD Doctrine"
cbrn_convention.evolution.stage_3.title: "The Arsenal Without Limits"
cbrn_convention.evolution.stage_1.body: "Governments inside the convention no longer ask whether gas and disease may be prepared. They ask who may order the first release."
cbrn_convention.evolution.stage_2.body: "Armies plan chemical, biological, nuclear and missile forces as one arsenal, with shared reserves, delivery crews and protection."
cbrn_convention.evolution.stage_3.body: "Member governments accept unrestricted arsenals and pool their research to recreate weapons the world has not yet seen."
cbrn_convention.evolution.summary: "The convention moves from preparation to first use, then to joint doctrine, then to arsenals with no stated limit."
cbrn_convention.event_details.description: "Governments sign a convention that treats chemical and biological warfare as ordinary state policy. Each country answers with ratification, a reservation, rejection or a secret program, and the conference returns again and again to widen what its members may do. The world divides between the governments inside the order and those that fight it."

# Achievements
036_the_reservation_holds_NAME: "The Reservation Holds"
036_the_reservation_holds_DESC: "Keep a Retaliation Reservation to the end without ever starting a war of gas or plague."
036_the_reservation_holds_tooltip: "Hold a Retaliation Reservation from before the First-Use Revision until the Arsenal Without Limits is recorded, with the Protection and Assistance Compact and the Inspection and Verification Protocol ratified. Never break the reservation or run a covert program."
036_the_reservation_holds_eligible_tooltip: "A Retaliation Reservation can still be held from before the First-Use Revision."
036_a_convention_against_the_convention_NAME: "A Convention Against the Convention"
036_a_convention_against_the_convention_DESC: "Lead the opposition and break the permissive order through diplomacy."
036_a_convention_against_the_convention_tooltip: "Reject the convention at its opening, never join it and never run a covert program. As the opposition's leader after the Strategic WMD Doctrine Charter, see an Arsenal Without Limits agenda fail or the convention fall to Provisional Standing, while your Condemnation stays below Formal Censure."
036_a_convention_against_the_convention_eligible_tooltip: "The convention can still be rejected without joining or running a covert program."
036_small_state_large_ledger_NAME: "Small State, Large Ledger"
036_small_state_large_ledger_DESC: "Make a small country indispensable to a shared weapons program."
036_small_state_large_ledger_tooltip: "When a program project is selected, be a minor country with at most 15 factories. Contribute in at least three different ways, supply at least 8% of the final progress and receive the project at completion."
