# Category, ideas, opinion
cbrn_convention_category: "Chemical and Biological Weapons Convention"
cbrn_convention_category_desc: "Posture: §Y[GetCbrnConventionPostureName]§!. [GetCbrnConventionPermissionLine][GetCbrnConventionSuspensionNote]\nStanding: §Y[GetCbrnConventionStandingName]§!.\n[GetCbrnConventionAgendaLine]"
cbrn_convention_full_ratification: "Full Ratification"
cbrn_convention_full_ratification_desc: "We ratified the convention in full and answer for its articles."
cbrn_convention_full_ratification_tt: "Chemical, biological and nuclear weapon use costs less Condemnation, and every treaty family is open to us."
cbrn_convention_chemical_accession: "Chemical Accession"
cbrn_convention_chemical_accession_desc: "We accepted the gas articles and refused the disease weapons."
cbrn_convention_chemical_accession_tt: "Chemical and nuclear weapon use costs less Condemnation. Biological treaties and clauses are closed to us."
cbrn_convention_retaliation_reservation: "Retaliation Reservation"
cbrn_convention_retaliation_reservation_desc: "We joined the protective treaties and kept the right to answer an attack."
cbrn_convention_retaliation_reservation_tt: "Weapons used in retaliation cost less Condemnation. A first strike breaks the reservation."
cbrn_convention_integrated_doctrine: "Integrated Doctrine"
cbrn_convention_integrated_doctrine_desc: "Our staffs plan chemical, biological, nuclear and missile forces as one arsenal."
cbrn_convention_integrated_doctrine_tt: "Chemical and biological weapon use costs still less Condemnation, and CBRN research and protective equipment production improve."
cbrn_convention_opposed_our_agenda: "Opposed our agenda"
chaos_meter.history.reason.special.cbrn_convention: "The convention reorders the rules of gas and disease warfare"

# Decisions and missions
