tensions_rising_cautious_alignment: "Cautious Alignment"
tensions_rising_cautious_alignment_desc: "Foreign offices are watching rival blocs and guarantees more closely after the latest diplomatic incident."
tensions_rising_alarmist_rearmament: "Alarmist Rearmament"
tensions_rising_alarmist_rearmament_desc: "Staff rooms, newspapers, and ministries are pressing for visible readiness before any government admits why."
tensions_rising_general_staff_fever: "General Staff Fever"
tensions_rising_general_staff_fever_desc: "Military offices are preparing around rumours that diplomats still deny."
tensions_rising_permanent_alert_desc: "The state has learned to treat every denial as a possible warning order."
chaos_meter.history.reason.special.tensions_rising: "Tensions Rising"
chaosx.events_log.evolution.type.tensions_rising: "§YTensions Rising Milestone§!"
chaosx.events_log.window.event_details.tensions_rising: "Tensions Rising is a repeatable diplomatic-pressure incident. In calm conditions it adds world tension and stops once world tension is full. At higher chaos levels it can still fire at maximum world tension, adding pressure through timer pacing, timed opinion penalties, AI readiness ideas, delayed incidents, achievement tracking, and rare safe border wars.\n\nIt does not create war goals, countries, cores, focus trees, formables, or a world-end scenario. High-chaos follow-up incidents can start non-transfer border wars between safe adjacent rivals."
chaosx.events_log.window.evolution_details.tensions_rising.title.stage_1: "Cable Traffic Increase"
chaosx.events_log.window.evolution_details.tensions_rising.title.stage_2: "Competing Accusations"
chaosx.events_log.window.evolution_details.tensions_rising.title.stage_3: "Staff Readiness"
chaosx.events_log.window.evolution_details.tensions_rising.title.stage_4: "Extended Alert"
chaosx.events_log.window.evolution_details.tensions_rising.body.event_detail: "Tensions Rising milestones record how this repeatable incident scales with the Chaos Meter. The stages add pressure through world tension, chaos, opinion damage, readiness postures, timed follow-up incidents, and rare safe border clashes."
chaosx.events_log.window.evolution_details.tensions_rising.body.stage_1: "The first evolved stage moves the incident beyond a simple world-tension increase. Relation shocks begin, and later incidents can add smaller aftershocks."
chaosx.events_log.window.evolution_details.tensions_rising.body.stage_2: "The second stage reaches more capitals. Timed relation damage can affect additional pairs, delayed incidents become more likely, and some governments take short-lived readiness postures."
chaosx.events_log.window.evolution_details.tensions_rising.body.stage_3: "The third stage treats the pattern as a planning concern. Relation shocks last longer, border incidents can become non-transfer clashes, and peaceful players can begin the Thin Wire watch while world tension remains full."
chaosx.events_log.window.evolution_details.tensions_rising.body.stage_4: "The fourth stage is the strongest non-terminal form of the incident. Follow-up incidents can apply heavier diplomatic damage and have the best chance to ignite safe non-transfer border wars."
