chaosx.events_log.evolution.type.tensions_rising: "§YTensions Rising Milestone§!"
chaosx.events_log.window.event_details.tensions_rising: "Public accusations and leaked military cables spread rumours of war. Embassies guard their entrances, shipping grows dearer, and frontier commanders put their patrols on alert."
chaosx.events_log.window.evolution_details.tensions_rising.title.stage_1: "Cable Traffic Increase"
chaosx.events_log.window.evolution_details.tensions_rising.title.stage_2: "Competing Accusations"
chaosx.events_log.window.evolution_details.tensions_rising.title.stage_3: "Staff Readiness"
chaosx.events_log.window.evolution_details.tensions_rising.title.stage_4: "Extended Alert"
chaosx.events_log.window.evolution_details.tensions_rising.body.event_detail: "Rumours of mobilisation spread from embassies to newspapers and frontier posts. General staffs work through the night, troops remain on alert, and exhausted patrols grow quicker to challenge movements across the border."
chaosx.events_log.window.evolution_details.tensions_rising.body.stage_1: "Embassy telegraph rooms work through the night as leaked cables fill the papers. Rumours of mobilisation deepen distrust between neighbouring capitals."
chaosx.events_log.window.evolution_details.tensions_rising.body.stage_2: "Rival governments accuse their neighbours of preparing for war. Newspapers repeat the accusations, and border commanders tighten their patrols."
chaosx.events_log.window.evolution_details.tensions_rising.body.stage_3: "General staffs work through the night preparing troops for mobilisation. Exhausted officers weigh fresh rumours, and frontier patrols grow quicker to challenge unfamiliar movements."
chaosx.events_log.window.evolution_details.tensions_rising.body.stage_4: "Troops remain on alert along the frontier as commanders delay leave. Fresh accusations deepen distrust, and exhausted patrols risk turning a confrontation into a clash."
chaosx.nr8.terminal.d: "The crisis has moved beyond diplomatic restraint."
chaosx.nr8.terminal.a: "Diplomacy cannot contain this."
chaosx.nr8.terminal.effect: "This report adds no world tension or chaos."
chaosx.nr8.baseline.full_wt.effect: "World tension is already at its limit. This report adds no tension."
