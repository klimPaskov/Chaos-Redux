chaosx.nr8.1.t: "Tensions Rising"
chaosx.nr8.1.d: "[GetTensionsRisingMainDesc]"
chaosx.nr8.1.a: "[GetTensionsRisingOption]"
chaosx.nr8.1.a.tt: "[GetTensionsRisingEffectText]"
chaosx.nr8.baseline.d: "Public accusations and leaked military cables have strained relations between capitals. Newspapers carry rumours of war, and border commanders put their patrols on alert."
chaosx.nr8.baseline.a: "Certainly not good for the heart."
chaosx.nr8.baseline.effect: "World tension increases by [?tensions_rising_display_world_tension|0]."
chaosx.nr8.stage_1.d: "Embassy telegraph rooms work through the night. Leaked military cables fill the morning papers, spreading rumours of mobilisation across the border."
chaosx.nr8.stage_1.a: "The wires hum all night."
chaosx.nr8.stage_1.effect: "World tension increases by [?tensions_rising_display_world_tension|0]. Chaos increases by [?tensions_rising_display_chaos|0]."
chaosx.nr8.stage_2.d: "Newspapers sell rumours of mobilisation, and rival governments use them to accuse their neighbours. Border officers tighten patrols as each accusation spreads."
chaosx.nr8.stage_2.a: "Everyone has a source."
chaosx.nr8.stage_2.effect: "World tension increases by [?tensions_rising_display_world_tension|0]. Chaos increases by [?tensions_rising_display_chaos|0]."
chaosx.nr8.stage_3.d: "Commanders keep their staffs at work through the night, checking railway timetables and preparing troops for mobilisation. Exhausted officers face another day of rumours along the frontier."
chaosx.nr8.stage_3.a: "Keep the offices staffed."
chaosx.nr8.stage_3.effect: "World tension increases by [?tensions_rising_display_world_tension|0]. Chaos increases by [?tensions_rising_display_chaos|0]."
chaosx.nr8.stage_4.d: "Troops remain on alert along the frontier. Commanders delay leave, patrols challenge unfamiliar movements, and fresh accusations deepen distrust between neighbouring capitals."
chaosx.nr8.stage_4.a: "Keep the patrols on alert."
chaosx.nr8.stage_4.effect: "World tension increases by [?tensions_rising_display_world_tension|0]. Chaos increases by [?tensions_rising_display_chaos|0]."
chaosx.nr8.aggregate.effect: "World tension increases by [?tensions_rising_display_world_tension|0]. Chaos increases by [?tensions_rising_display_chaos|0]."
chaosx.nr8.report.a: "A troubling development."
chaosx.nr8.2.t: "The Telegram Nobody Signed"
chaosx.nr8.2.d: "An unsigned telegram accusing several governments of secret mobilisation has reached foreign ministries. Its circulation has provoked angry exchanges between the capitals named in it."
chaosx.nr8.2.a.tt: "World tension and chaos increase. Diplomatic relations temporarily worsen."
chaosx.nr8.3.t: "Embassy Side Doors"
chaosx.nr8.3.d: "Embassy staff use side entrances under armed guard. Reporters gather at the deserted front gates, and rumours of an imminent rupture spread through the surrounding streets."
chaosx.nr8.3.a.tt: "World tension and chaos increase. Diplomatic relations temporarily worsen, and some foreign governments adopt a more guarded military posture."
chaosx.nr8.4.t: "Unease Along the Frontier"
chaosx.nr8.4.d: "Patrols challenge travellers along the frontier, and commanders demand clearer orders. Newspapers carry fresh accusations each morning, deepening the fear of war."
chaosx.nr8.4.a.tt: "World tension and chaos increase. Diplomatic relations temporarily worsen."
chaosx.nr8.5.t: "Insurance Rates Jump in Neutral Ports"
chaosx.nr8.5.d: "Insurers in neutral ports have raised their premiums against the risk of war. Merchants face dearer voyages, and the increases have stirred fresh distrust between trading partners."
chaosx.nr8.5.a.tt: "World tension and chaos increase. Diplomatic relations temporarily worsen."
chaosx.nr8.6.t: "The Rumour That Arrived Twice"
chaosx.nr8.6.d: "Two capitals received the same rumour of mobilisation through separate channels. The identical wording and missing signature have cast suspicion on the embassies that passed it along."
chaosx.nr8.6.a.tt: "World tension and chaos increase. Diplomatic relations temporarily worsen between several countries."
chaosx.nr8.7.t: "Staff Cars After Midnight"
chaosx.nr8.7.d: "Military staff cars line the streets outside several ministries after midnight. Armed guards keep passers-by away from the shuttered buildings, and rumours of mobilisation spread across the capital."
chaosx.nr8.7.a.tt: "World tension and chaos increase. Diplomatic relations temporarily worsen, and some foreign governments adopt a more guarded military posture."
chaosx.nr8.8.t: "Fleets Keep Radio Silence"
chaosx.nr8.8.d: "Warships left harbour under radio silence. The secrecy has alarmed neighbouring naval commands, which are drawing up plans for a possible confrontation at sea."
chaosx.nr8.8.a.tt: "World tension and chaos increase. Diplomatic relations temporarily worsen, and some foreign governments adopt a more guarded military posture."
chaosx.nr8.9.t: "Border Lamps"
chaosx.nr8.9.d: "Lamps burned through the night at frontier posts. Reinforced patrols challenge traffic on the border roads, and nearby residents fear that a mistaken shot could start a clash."
chaosx.nr8.9.a.tt: "World tension and chaos increase. Diplomatic relations temporarily worsen between several countries. At higher chaos levels, neighbouring countries may fight a border clash without exchanging territory."
chaosx.nr8.10.t: "One Denial Too Many"
chaosx.nr8.10.d: "A third denial of mobilisation has reached the morning papers. Foreign editors call it evidence of concealed preparations, and commanders in neighbouring countries put their troops on alert."
chaosx.nr8.10.a.tt: "World tension and chaos increase. Diplomatic relations temporarily worsen between several countries. At higher chaos levels, neighbouring countries may fight a border clash without exchanging territory."
chaosx.nr8.12.t: "The Last Normal Briefing"
chaosx.nr8.12.d: "Several frontier districts received mobilisation instructions after the morning briefing. Officers hesitate over the unsigned orders, and troops wait beside the roads for word to move."
chaosx.nr8.12.a.tt: "World tension and chaos increase. Diplomatic relations temporarily worsen between several countries, and some foreign governments adopt a more guarded military posture. At higher chaos levels, the risk of a border clash is greater. No territory changes hands."
