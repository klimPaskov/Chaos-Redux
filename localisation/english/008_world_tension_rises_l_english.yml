tensions_rising_cautious_alignment: "Cautious Alignment"
tensions_rising_cautious_alignment_desc: "Foreign offices are watching rival blocs and guarantees more closely after the latest diplomatic incident."
tensions_rising_alarmist_rearmament: "Alarmist Rearmament"
tensions_rising_alarmist_rearmament_desc: "Staff rooms, newspapers, and ministries are pressing for visible readiness as the reason for it becomes harder to hide."
tensions_rising_general_staff_fever: "General Staff Fever"
tensions_rising_general_staff_fever_desc: "Military offices are preparing around rumours that circulate through every diplomatic channel."
tensions_rising_permanent_alert_desc: "The state treats every denial as a possible order to prepare."
chaos_meter.history.reason.special.tensions_rising: "Tensions Rising"
chaosx.events_log.evolution.type.tensions_rising: "§YTensions Rising Milestone§!"
chaosx.events_log.window.event_details.tensions_rising: "Public accusations, leaked cables, and military bulletins unsettle foreign offices. Rumours travel faster, relations sour, and frontier commands prepare for a clash that no capital can explain away."
chaosx.events_log.window.evolution_details.tensions_rising.title.stage_1: "Cable Traffic Increase"
chaosx.events_log.window.evolution_details.tensions_rising.title.stage_2: "Competing Accusations"
chaosx.events_log.window.evolution_details.tensions_rising.title.stage_3: "Staff Readiness"
chaosx.events_log.window.evolution_details.tensions_rising.title.stage_4: "Extended Alert"
chaosx.events_log.window.evolution_details.tensions_rising.body.event_detail: "Diplomatic Fever marks the world learning to panic faster. Each milestone carries the same alarming headline farther: from crowded cable rooms and public accusations to sleepless general staffs, permanent alert, and the risk of a limited frontier clash."
chaosx.events_log.window.evolution_details.tensions_rising.body.stage_1: "Cable traffic swells as embassies answer rumours with denials. Relations begin to fray, and each new dispatch makes the next alarm easier to believe."
chaosx.events_log.window.evolution_details.tensions_rising.body.stage_2: "Competing accusations spread through more capitals. Delayed reports keep old suspicions alive, while cautious governments quietly raise their readiness."
chaosx.events_log.window.evolution_details.tensions_rising.body.stage_3: "General staffs begin treating rumour as operational guidance. Diplomatic shocks linger, frontier incidents become harder to contain, and governments watch the Thin Wire with growing unease."
chaosx.events_log.window.evolution_details.tensions_rising.body.stage_4: "Extended alert becomes the normal condition. Heavier accusations and exhausted border commands make a limited frontier clash more likely as the border grows harder to control."
