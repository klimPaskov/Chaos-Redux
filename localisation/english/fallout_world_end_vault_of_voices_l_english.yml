l_english:
  chaosx.fallout.359.t: "The Vault of Voices"
  chaosx.fallout.359.d: "A frost sealed relay room has yielded a stack of reels, copied shelter notices, and a working transmitter. The archive names people who vanished from the first winter and records promises made before the ash settled. The room can become a public memory, a disciplined civic record, a weapon for the information war, or a currency for cautious partners."
  chaosx.fallout.359.a: "Preserve every recording"
  chaosx.fallout.359.a.tt: "Spend Power, Medicine, and Recognition to keep the archive unedited. This favors shared memory, research, and local supply."
  chaosx.fallout.359.b: "Curate a civic archive"
  chaosx.fallout.359.b.tt: "Spend Shelter, Medicine, and Cohesion to verify names and dates before publication. This favors legitimacy and public order."
  chaosx.fallout.359.c: "Weaponize the broadcasts"
  chaosx.fallout.359.c.tt: "Spend Power, Scrap, and Recognition to edit the broadcasts into a campaign of exposure. This favors political leverage while risking trust."
  chaosx.fallout.359.d_option: "Trade verified copies"
  chaosx.fallout.359.d_option.tt: "Spend Scrap, Power, and Recognition to exchange copies with foreign partners. This favors trade and diplomatic access."
  chaosx.fallout.361.t: "The archive answers back"
  chaosx.fallout.361.preserve.success.d: "The reels survived the cold room. Names, weather notes, and the last ordinary jokes of the old world are now duplicated in three shelters. The archive gives our people a language for loss without asking them to surrender their future."
  chaosx.fallout.361.preserve.partial.d: "Some reels cracked during the transfer. The surviving voices still carry dates and names, but several final minutes are gone. The archive helps the living recognize one another, though its gaps invite arguments."
  chaosx.fallout.361.preserve.failure.d: "The transmitter drew too much power and the reels fused in their cases. A few fragments remain, but the room is now a dark shell. The loss leaves our public memory poorer and the archive state exposed."
  chaosx.fallout.361.curate.success.d: "A council of teachers, clerks, and station engineers checked every date they could. The first civic catalogue is open in the shelter hall. Its careful order gives our government a new measure of legitimacy and makes cooperation less dangerous."
  chaosx.fallout.361.curate.partial.d: "The catalogue opened with half its entries marked for later review. The people accept the work because the names are visible, yet every omission becomes a new petition. Cohesion rises slowly while the archive remains unfinished."
  chaosx.fallout.361.curate.failure.d: "The reviewers fought over which voices deserved a place. The catalogue never opened, and the arguments reached the ration desks. A civic archive without a trusted method has become another damaged institution."
  chaosx.fallout.361.weaponize.success.d: "The edited broadcasts reached every listening post before rival transmitters could answer. They expose the bargains that abandoned our region and turn old testimony into present leverage. The campaign is effective, but every listener now asks who cut the tape."
  chaosx.fallout.361.weaponize.partial.d: "The first broadcast escaped with two contradictory edits. It still shook the rival council, yet our own clerks cannot agree which version is safe to repeat. Power grows beside a fresh wound in public trust."
  chaosx.fallout.361.weaponize.failure.d: "The propaganda reels collapsed into static during the first transmission. Rivals copied the raw fragments and called the failure proof of our deceit. The archive room is damaged and the government must answer for the noise."
  chaosx.fallout.361.trade.success.d: "Foreign listeners accepted the verified copies and returned medicine, wire, and a promise of radio silence around our relay. The exchange gives both sides a usable memory of the old world and a reason to keep the border open."
  chaosx.fallout.361.trade.partial.d: "The first partners received clean copies, while two bundles were lost in the snow. The trade route survives, but every future shipment will need an escort and a witness from the archive council."
  chaosx.fallout.361.trade.failure.d: "The buyers demanded edits we could not certify and left with rumors instead of reels. Our stockpiles are thinner, the transmitter is quiet, and the archive now looks like a promise we could not keep."
  chaosx.fallout.361.a: "Wait for the callback"
  chaosx.fallout.361.a.tt: "Keep the archive chain open until the scheduled partner response arrives."
  chaosx.fallout.363.t: "The second copy arrives"
  chaosx.fallout.363.success.d: "The callback brought a clean duplicate, a list of surviving voices beyond our frontier, and a request for one more exchange. The archive has become a living bridge. Its history now changes how our government speaks to neighbors."
  chaosx.fallout.363.partial.d: "The callback brought a damaged duplicate and a partial list of names. The relay can continue, but every new copy will need a human witness and a quiet room. The archive is useful because it is no longer trusted blindly."
  chaosx.fallout.363.failure.d: "The callback carried a forged reel and a threat hidden under the carrier label. The relay is closed while guards inspect the shelves. People who heard the first broadcasts must now decide whether memory can still be shared safely."
  chaosx.fallout.363.a: "Close the archive ledger"
  chaosx.fallout.363.a.tt: "Resolve the callback, record its result, and release every delayed receipt."
  fallout.event_log.vault_of_voices.name: "The Vault of Voices"
  fallout.event_log.vault_of_voices.detail: "[This.GetName] opened a recovered archive and radio relay. The chosen branch shaped memory, legitimacy, intelligence, and diplomacy."
  fallout.event_log.vault_of_voices.preserve_success: "Preserved the Vault of Voices without edits"
  fallout.event_log.vault_of_voices.preserve_partial: "Preserved a damaged Vault of Voices"
  fallout.event_log.vault_of_voices.preserve_failure: "Lost the unedited Vault of Voices archive"
  fallout.event_log.vault_of_voices.curate_success: "Opened a verified civic archive"
  fallout.event_log.vault_of_voices.curate_partial: "Opened an incomplete civic archive"
  fallout.event_log.vault_of_voices.curate_failure: "Failed to establish a trusted archive council"
  fallout.event_log.vault_of_voices.weaponize_success: "Turned verified recordings into a successful broadcast campaign"
  fallout.event_log.vault_of_voices.weaponize_partial: "Broadcast a divided propaganda archive"
  fallout.event_log.vault_of_voices.weaponize_failure: "Lost control of the propaganda archive"
  fallout.event_log.vault_of_voices.trade_success: "Exchanged verified copies with foreign partners"
  fallout.event_log.vault_of_voices.trade_partial: "Completed a partial archive exchange"
  fallout.event_log.vault_of_voices.trade_failure: "Failed to trade the archive safely"
  fallout.event_log.vault_of_voices.callback_success: "Received a trusted second copy"
  fallout.event_log.vault_of_voices.callback_partial: "Received a damaged second copy"
  fallout.event_log.vault_of_voices.callback_failure: "Closed the relay after a forged callback"
