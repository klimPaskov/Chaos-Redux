chaosx.fallout.1030.t: "The Adaptation Rite"
chaosx.fallout.1030.opening.d: "When the Old Doctor's Trial memory closes in the Congo Green Basin, ward keepers bring reed bundles, river stones, ash cloth, and a cracked solar mirror to the council shelter. The practice was built during cold rain and frozen channels so each household could mark shelter, food, and safe work. The council must decide whether it becomes a civic rite, a river rite, a field-school certificate, or only a set of practical rules. This is a fictional altered society. Its customs do not prove ordinary radiation biology."
chaosx.fallout.1030.a: "Hold a civic rite"
chaosx.fallout.1030.a.tt: "Spend Food 2, Medicine 2, and Recognition 2 to let river and hill wards write the practice into a public shelter charter. The charter can build cohesion when witnesses agree on its duties."
chaosx.fallout.1030.b: "Entrust it to the river shrine"
chaosx.fallout.1030.b.tt: "Spend Scrap 1, Power 1, and Recognition 2 to place the rite under the river shrine's custody. The shrine can keep the practice together across cold rain, but outside wards may fear its authority."
chaosx.fallout.1030.c: "Certify it through the field school"
chaosx.fallout.1030.c.tt: "Spend Fuel 1, Recognition 2, and Cohesion 2 to test the practice at the field school and issue a shared certificate. The certificate can improve adaptation when the school and wards keep matching records."
chaosx.fallout.1030.d: "Reject the rite and keep practical rules"
chaosx.fallout.1030.d.tt: "Spend Food 1, Medicine 1, Fuel 1, and Recognition 1 to reject ceremonial authority while retaining the shelter and work rules. The Basin keeps flexibility, but a later generation may lack a shared account."
chaosx.fallout.1032.t: "The Basin Chooses Its Practice"
chaosx.fallout.1032.civic_rite.success.d: "The civic rite binds the river and hill wards to one shelter charter. Each reed bundle marks a duty, the solar mirror is checked at the school, and the council can suspend a rule in a public meeting when a channel freezes or food stores fail."
chaosx.fallout.1032.civic_rite.partial.d: "The civic rite reaches the river wards, but the hill road loses two witnesses in cold rain. The charter covers shelter and food, while the hill council keeps a separate book for work rotations until the next thaw."
chaosx.fallout.1032.civic_rite.failure.d: "The civic rite collapses when an ash storm spoils the council's copies. Ward guards argue over the solar mirror, the charter loses its seal, and households return to local rules that the foreign witness cannot compare."
chaosx.fallout.1032.religious_rite.success.d: "The river shrine accepts custody of the rite and places the reed bundles beside the water stones. Shrine keepers publish a fasting day before each cold-rain crossing, and the hill wards accept the practice after two independent witnesses repeat the rule."
chaosx.fallout.1032.religious_rite.partial.d: "The river shrine keeps the rite alive in the lower wards, but the hill road refuses its fasting calendar. The Basin gains a trusted river custom and a second set of work rules that the shrine must reconcile after the next thaw."
chaosx.fallout.1032.religious_rite.failure.d: "The shrine's custody turns into a contest over the key to the storehouse. A ward captain hides the river stones, the hill delegates leave before the reading, and outside settlements treat the rite as a claim on their food."
chaosx.fallout.1032.scientific_certification.success.d: "The field school certifies the practice with matching shelter marks from both roads. Teachers record the river level, food stores, and work rotations without calling the rite a biological test, and the Basin gains a method that can be taught to new ward keepers."
chaosx.fallout.1032.scientific_certification.partial.d: "The field school verifies the shelter and work marks, but fuel runs out before the river record is copied. The certificate is accepted in the school ward while river keepers continue using their older stone count."
chaosx.fallout.1032.scientific_certification.failure.d: "The certification fails when a cracked mirror gives different readings to the two roads. Teachers burn the disputed forms to protect the students, the wards lose confidence in the school, and the rite returns to private practice."
chaosx.fallout.1032.reject_ritual.success.d: "The council rejects ceremonial authority and keeps a short rule card for shelter, food, and safe work. The card is copied in every ward, the foreign witness sees no invented claim of biology, and households can change a rule when the river moves."
chaosx.fallout.1032.reject_ritual.partial.d: "The council keeps practical rules in the river wards, but the hill road refuses to copy the card. The Basin avoids a new authority and still lacks a shared way to explain which work rotations saved the stores."
chaosx.fallout.1032.reject_ritual.failure.d: "The rejection leaves no common record. Ward leaders take the useful parts of the practice for themselves, food and medicine are counted by separate hands, and the next cold rain finds the Basin arguing over rules no one can date."
chaosx.fallout.1032.a: "Record the Basin's chosen practice"
chaosx.fallout.1032.a.tt: "Apply the graded rite result, register its branch memory, notify the foreign witness ward, and schedule a review after the next cold-rain season."
chaosx.fallout.1034.t: "The Rite Faces Its First Thaw"
chaosx.fallout.1034.success.d: "After the next cold-rain season, the river and hill wards bring matching practice records to the field school. The chosen rule survives a thaw, the foreign witness accepts the account, and elders can teach it without claiming that the Basin follows ordinary biology."
chaosx.fallout.1034.partial.d: "The delayed review finds one ward following the chosen practice while the other keeps its own work book. The Basin has a working rule for the river road, but the hill council will reopen the question when it has enough medicine and fuel for another meeting."
chaosx.fallout.1034.failure.d: "The delayed review finds a missing witness, a broken storehouse key, and three dates for the same cold-rain crossing. The practice survives only as household advice, while the foreign ward withdraws its recognition from the Basin's record."
chaosx.fallout.1034.a: "Close the adaptation record"
chaosx.fallout.1034.a.tt: "Apply the delayed review result, record the final cause memory, release the ward and witness reservations, and close The Adaptation Rite chain."
fallout.event_log.adaptation_rite.name: "The Adaptation Rite"
fallout.event_log.adaptation_rite.detail: "[GetFalloutEvent908EventLogDetail]"
fallout.event_log.adaptation_rite.detail.choice_civic_rite: "The Congo Green Basin held a civic rite and wrote the practice into a public shelter charter."
fallout.event_log.adaptation_rite.detail.choice_religious_rite: "The Congo Green Basin entrusted the practice to the river shrine."
fallout.event_log.adaptation_rite.detail.choice_scientific_certification: "The Congo Green Basin sent the practice to the field school for certification."
fallout.event_log.adaptation_rite.detail.choice_reject_ritual: "The Congo Green Basin rejected ceremonial authority and kept practical rules."
fallout.event_log.adaptation_rite.detail.civic_rite_success: "A public shelter charter joined the river and hill wards under a teachable civic practice."
fallout.event_log.adaptation_rite.detail.civic_rite_partial: "A civic charter reached the river wards while the hill road kept a separate work book."
fallout.event_log.adaptation_rite.detail.civic_rite_failure: "An ash storm spoiled the civic copies and left the wards without a shared practice record."
fallout.event_log.adaptation_rite.detail.religious_rite_success: "The river shrine kept the rite and won acceptance from both roads through independent witnesses."
fallout.event_log.adaptation_rite.detail.religious_rite_partial: "The shrine preserved a river custom while the hill wards refused its calendar."
fallout.event_log.adaptation_rite.detail.religious_rite_failure: "A storehouse key dispute turned the shrine's custody into a claim on outside food."
fallout.event_log.adaptation_rite.detail.scientific_certification_success: "The field school certified matching shelter, food, and work marks without claiming ordinary biology."
fallout.event_log.adaptation_rite.detail.scientific_certification_partial: "The field school verified the shelter marks before fuel ran out for the river record."
fallout.event_log.adaptation_rite.detail.scientific_certification_failure: "A cracked mirror split the records and broke confidence in the field school."
fallout.event_log.adaptation_rite.detail.reject_ritual_success: "A short rule card gave every ward practical shelter, food, and safe-work instructions."
fallout.event_log.adaptation_rite.detail.reject_ritual_partial: "Practical rules held in the river wards while the hill road refused the common card."
fallout.event_log.adaptation_rite.detail.reject_ritual_failure: "The rejection left household advice without a dated record for the next cold rain."
fallout.event_log.adaptation_rite.detail.callback_success: "The next thaw confirmed matching practice records and a rule the elders could teach without a biological claim."
fallout.event_log.adaptation_rite.detail.callback_partial: "The river road kept the chosen practice while the hill council postponed its own review."
fallout.event_log.adaptation_rite.detail.callback_failure: "A missing witness and broken storehouse key left the practice as private household advice."
fallout.event_log.adaptation_rite.detail.cancelled: "The Adaptation Rite closed after its ward, witness, owner, or Fallout generation changed."
