l_english:
chaosx.nr6.60.t: "The Border Cannot Wait"
chaosx.nr6.60.d: "The Independence Wave has taken [?independence_wave_host_response_event6_loss_count|0] of [ROOT.GetNameDef]'s [?independence_wave_host_response_pre_release_state_count|0] states. The government must decide whether to negotiate, pressure the new frontier, or prepare to reclaim the lost territory."
chaosx.nr6.60.a: "Seek a border conference"
chaosx.nr6.60.a.tt: "Withdraw claims on the transferred states and ease hostility and outstanding obligations with the breakaway governments."
chaosx.nr6.60.b: "Keep the new frontier under pressure"
chaosx.nr6.60.b.tt: "Keep claims on the new state capitals and raise pressure along the frontier. Hostility with the breakaway governments will grow."
chaosx.nr6.60.c: "Prepare a reclamation campaign"
chaosx.nr6.60.c.tt: "Claim the transferred states and prepare the army for a reclamation campaign. The preparations will strain the budget and increase hostility with the breakaway governments."
chaosx.nr6.61.t: "The Partition Emergency"
chaosx.nr6.61.d: "The Independence Wave has taken [?independence_wave_host_response_event6_loss_count|0] of [ROOT.GetNameDef]'s [?independence_wave_host_response_pre_release_state_count|0] states. Displaced residents need relief, debts remain unsettled, and the army has lost parts of its command network. The government must choose its first priority."
chaosx.nr6.61.a: "Put army command first"
chaosx.nr6.61.a.tt: "Keep claims on the new state capitals and raise military pressure on the breakaway governments. The partition emergency will disrupt the army and civilian economy."
chaosx.nr6.61.b: "Put relief and debt settlement first"
chaosx.nr6.61.b.tt: "Ease claims, hostility, and outstanding obligations with the breakaway governments. The partition emergency will still disrupt the army and civilian economy."
chaosx.nr6.61.c: "Recognize the new borders"
chaosx.nr6.61.c.tt: "Withdraw claims on the transferred states and recognize the breakaway governments. The partition emergency will still disrupt the army and civilian economy."
chaosx.nr6.62.t: "The Last Council"
chaosx.nr6.62.d: "[ROOT.GetNameDef] holds only a remnant of its former territory. [GetIndependenceWaveHostResponseCapitalStatus] The remaining council must choose whether to preserve the old government's claims or build a regional administration."
chaosx.nr6.62.a: "Preserve legal continuity"
chaosx.nr6.62.a.tt: "Preserve the existing government and its claims on the new state capitals. Form an emergency administration and leave open the possibility of seeking foreign guarantees."
chaosx.nr6.62.b: "Adopt a regional charter"
chaosx.nr6.62.b.tt: "Adopt a regional charter and withdraw claims on the transferred states. Form an emergency administration and leave open the possibility of seeking foreign guarantees."
independence_wave_host_partition_crisis: "Partition Emergency"
independence_wave_host_partition_crisis_desc: "The loss of territory has broken parts of the army's command network, displaced residents, and left public debts unsettled. The remaining government struggles to supply its forces and keep factories running."
independence_wave_host_remnant_emergency_government: "Emergency Remnant Government"
independence_wave_host_remnant_emergency_government_desc: "The remaining government has gathered its officials in the territory it still controls. Emergency powers steady public support, but factories struggle to keep working."
independence_wave_host_reclamation_burden: "Reclamation Commitments"
independence_wave_host_reclamation_burden_desc: "The government is preparing to reclaim the transferred states. The army gains momentum, but the campaign preparations strain household budgets and public confidence."
independence_wave_host_response_capital_lost: "The original capital is no longer part of the government's territory."
independence_wave_host_response_capital_retained: "The original capital remains under the government's authority."
independence_wave_host_response_capital_unknown: "The government cannot confirm who holds its original capital."
