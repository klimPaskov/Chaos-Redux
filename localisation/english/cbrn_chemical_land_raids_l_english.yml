raid_chemical_land_cylinder_target_tt: "Select an enemy-held state with a supply node or enemy divisions."
raid_chemical_land_cylinder_available_tt: "Requires war, an operational CBRN program, battlefield-use authorization, the agent's technology, Basic Service Respirators, Field Decontamination Kits, enough Chemical Readiness, and a valid target, plus the listed payload and support stores."
raid_chemical_land_cylinder_launch_tt: "The target must still be a valid enemy-held state, and you must still be at war with battlefield-use authorization and enough Chemical Readiness."
raid_chemical_land_cylinder_failure_actor_tt: "The cylinder release fails before any chemical is released. The assigned division suffers heavy losses of organization and strength."
raid_chemical_land_cylinder_failure_target_tt: "The selected state is spared the chemical release."
raid_chemical_land_cylinder_limited_actor_tt: "The cylinder release delivers a limited release to the selected state, causing limited exposure and disruption. The assigned division suffers moderate losses of organization and strength."
raid_chemical_land_cylinder_limited_target_tt: "The selected state suffers a limited chemical release."
raid_chemical_land_cylinder_success_actor_tt: "The cylinder release delivers its planned release to the selected state, causing casualties, contamination, and possible Condemnation. The assigned division suffers light losses of organization and strength."
raid_chemical_land_cylinder_success_target_tt: "The selected state suffers a chemical release."
raid_chemical_land_cylinder_critical_actor_tt: "The cylinder release delivers a severe release to the selected state, causing the heaviest casualties and contamination of any outcome. The assigned division suffers minor losses of organization and strength."
raid_chemical_land_cylinder_critical_target_tt: "The selected state suffers a severe chemical release."

