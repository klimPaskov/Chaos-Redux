l_english:
black_plague_rat_brood_category: "Brood Commands"
black_plague_rat_brood_category_desc: "[GetBlackPlagueRatBroodCategoryDescription]"
black_plague_rat_brood_category_desc_rta: "Direct the burrows, conserve Brood Mass, and raise non-human formations without drawing on human manpower.\n\nBrood Mass: §Y[?black_plague_rat_brood_mass|0]§! / §Y[GetBlackPlagueRatValueBlackPlagueRatPoolBroodMassCap]§!   Hunger: §R[?black_plague_rat_hunger|0]§! / §Y[GetBlackPlagueRatValueBlackPlagueValueMaximum]§!   Coherence: §Y[?black_plague_rat_coherence|0]§! / §Y[GetBlackPlagueRatValueBlackPlagueValueMaximum]§!\nDisease Dominion: §G[?black_plague_rat_disease_dominion|0]§! / §Y[GetBlackPlagueRatValueBlackPlagueValueMaximum]§!   Controlled states: §Y[?black_plague_rat_dominion_states|0]§!\n\nHunger drives expansion and can force destructive feeding. Coherence governs the reliability of pulses and rival absorption."
black_plague_rat_brood_category_desc_king: "The royal court uses Dominion, Sentience, Cohesion, and Hunger. Brood Mass remains a finite reserve for raising absorbed royal formations.\n\nDominion: §Y[?black_plague_rat_king_dominion|0]§!   Sentience: §Y[?black_plague_rat_king_sentience|0]§!   Cohesion: §Y[?black_plague_rat_king_cohesion|0]§!   Hunger: §R[?black_plague_rat_king_hunger|0]§!"
black_plague_rat_call_a_brood_pulse: "Call a Brood Pulse"
black_plague_rat_call_a_brood_pulse_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatPoolBroodMassRaiseCost] Brood Mass to raise one non-human brood unit. The pulse requires room below the current force ceiling."
black_plague_rat_call_a_brood_pulse_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatPoolBroodMassRaiseCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days"
black_plague_rat_call_a_brood_pulse_cost_blocked: "§RRequires enough Brood Mass, an expired growth cooldown, and room below the force ceiling.§!"
black_plague_rat_absorb_a_weaker_brood: "Absorb a Weaker Brood"
black_plague_rat_absorb_a_weaker_brood_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionMergerMassCost] Brood Mass to let a stronger adjacent brood absorb one weaker warren and inherit its surviving units."
black_plague_rat_absorb_a_weaker_brood_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionMergerMassCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days"
black_plague_rat_absorb_a_weaker_brood_cost_blocked: "§RThe carrier needs an adjacent weaker brood, enough Brood Mass, and an open merger cooldown.§!"
black_plague_rat_map_the_burrows: "Map the Burrows"
black_plague_rat_map_the_burrows_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionBroodMassCost] Brood Mass to map hidden approaches and expand the division cap by [GetBlackPlagueRatValueBlackPlagueRatDecisionDivisionCapGain]."
black_plague_rat_map_the_burrows_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionBroodMassCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days"
black_plague_rat_map_the_burrows_cost_blocked: "§RThe burrow map is already active or the carrier lacks the required Brood Mass.§!"
black_plague_rat_strip_outer_districts: "Strip the Outer Districts"
black_plague_rat_strip_outer_districts_desc: "When Hunger is high, feed the carrier from one rat-held district. This relieves Hunger by [GetBlackPlagueRatValueBlackPlagueRatDecisionFeedingHungerRelief], adds [GetBlackPlagueRatValueBlackPlagueRatDecisionFeedingBroodMassGain] Brood Mass, and scars the chosen state with [GetBlackPlagueRatValueBlackPlagueRatDecisionFeedingStateInfestationGain] Rat Infestation for [GetBlackPlagueRatValueBlackPlagueRatDecisionFeedingCooldownDays] days."
black_plague_rat_establish_burrow_node: "Establish a Burrow Node"
black_plague_rat_establish_burrow_node_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionBurrowNodeMassCost] Brood Mass to establish a timed node in the selected rat-held state. Each active node returns [GetBlackPlagueRatValueBlackPlagueRatDecisionBurrowNodePulseMassGain] Brood Mass and [GetBlackPlagueRatValueBlackPlagueRatDecisionBurrowNodeCoherenceGain] Coherence every rat pulse for [GetBlackPlagueRatValueBlackPlagueRatDecisionBurrowNodeDurationDays] days."
black_plague_rat_establish_burrow_node_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionBurrowNodeMassCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days"
black_plague_rat_establish_burrow_node_cost_blocked: "§RSelect an eligible rat-held state with no active node and provide the required Brood Mass.§!"
black_plague_rat_follow_refugee_road: "Follow the Refugee Road"
black_plague_rat_follow_refugee_road_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionRefugeeRoadMassCost] Brood Mass to carry the plague along a real refugee route into the selected human enemy state. The route applies [GetBlackPlagueRatValueBlackPlagueRatDecisionRefugeeRoadExposure] exposure and cannot retarget that state for [GetBlackPlagueRatValueBlackPlagueRatDecisionRefugeeRoadCooldownDays] days."
black_plague_rat_follow_refugee_road_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionRefugeeRoadMassCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionRefugeeRoadDurationDays] days"
black_plague_rat_follow_refugee_road_cost_blocked: "§RThe carrier needs a valid human enemy refugee route, enough Brood Mass, and an open state cooldown.§!"
black_plague_rat_concentrate_brood: "Concentrate Brood"
black_plague_rat_concentrate_brood_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionConcentrateBroodMassCost] Brood Mass to delay the next growth pulse by [GetBlackPlagueRatValueBlackPlagueRatDecisionConcentrateBroodPulseDelayDays] days. The stored pressure raises the force ceiling by [GetBlackPlagueRatValueBlackPlagueRatDecisionConcentrateBroodDivisionCapGain] and restores [GetBlackPlagueRatValueBlackPlagueRatDecisionConcentrateBroodCoherenceGain] Coherence."
black_plague_rat_concentrate_brood_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionConcentrateBroodMassCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionConcentrateBroodDurationDays] days"
black_plague_rat_concentrate_brood_cost_blocked: "§RThe carrier needs enough Brood Mass, a valid pulse, and no active concentration cooldown.§!"
black_plague_rat_scatter_brood: "Scatter Brood"
black_plague_rat_scatter_brood_desc: "When Coherence is below [GetBlackPlagueRatValueBlackPlagueRatDecisionScatterBroodCoherenceThreshold], spend [GetBlackPlagueRatValueBlackPlagueRatDecisionScatterBroodMassCost] Brood Mass to throw out up to [GetBlackPlagueRatValueBlackPlagueRatDecisionScatterBroodBatch] weak swarms. The burst raises Hunger by [GetBlackPlagueRatValueBlackPlagueRatDecisionScatterBroodHungerGain] and lowers Coherence by [GetBlackPlagueRatValueBlackPlagueRatDecisionScatterBroodCoherenceLoss]."
black_plague_rat_scatter_brood_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionScatterBroodMassCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionScatterBroodDurationDays] days"
black_plague_rat_scatter_brood_cost_blocked: "§RRequires low Coherence, enough Brood Mass, and room below the force ceiling.§!"
black_plague_rat_devour_rival: "Devour Rival"
black_plague_rat_devour_rival_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionDevourRivalMassCost] Brood Mass to force an immediate dominance attempt against an adjacent weaker brood marker. Success folds its surviving units into the Rat Nation. Failure costs Coherence."
black_plague_rat_devour_rival_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionDevourRivalMassCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDevourRivalDurationDays] days"
black_plague_rat_devour_rival_cost_blocked: "§RThe carrier needs an adjacent weaker brood, enough Brood Mass, and an open merger cooldown.§!"
black_plague_rat_distribute_the_nests: "Distribute the Nest Signals"
black_plague_rat_distribute_the_nests_desc: "The Distributed Instinct route spends [GetBlackPlagueRatValueBlackPlagueRatDecisionDistributedNestsMassCost] Brood Mass over [GetBlackPlagueRatValueBlackPlagueRatDecisionDistributedNestsDurationDays] days to align separated warrens. It restores [GetBlackPlagueRatValueBlackPlagueRatDecisionDistributedNestsCoherenceGain] Coherence and raises the force ceiling by [GetBlackPlagueRatValueBlackPlagueRatDecisionDistributedNestsDivisionCapGain], then remains unavailable for [GetBlackPlagueRatValueBlackPlagueRatDecisionDistributedNestsCooldownDays] days."
black_plague_rat_distribute_the_nests_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionDistributedNestsMassCost]§!  Requires more than one controlled state  Cooldown [GetBlackPlagueRatValueBlackPlagueRatDecisionDistributedNestsCooldownDays] days"
black_plague_rat_distribute_the_nests_cost_blocked: "§RDistributed Instinct needs more than one rat-controlled state, enough Brood Mass, and no active signal cooldown.§!"
black_plague_rat_seat_the_alpha: "Seat the Alpha"
black_plague_rat_seat_the_alpha_desc: "The Dominant Beast route spends [GetBlackPlagueRatValueBlackPlagueRatDecisionDominantAlphaMassCost] Brood Mass over [GetBlackPlagueRatValueBlackPlagueRatDecisionDominantAlphaDurationDays] days to seat one command pattern. It adds [GetBlackPlagueRatValueBlackPlagueRatDecisionDominantAlphaSentienceGain] Sentience and raises the force ceiling by [GetBlackPlagueRatValueBlackPlagueRatDecisionDominantAlphaDivisionCapGain], but raises Hunger by [GetBlackPlagueRatValueBlackPlagueRatDecisionDominantAlphaHungerGain] and remains unavailable for [GetBlackPlagueRatValueBlackPlagueRatDecisionDominantAlphaCooldownDays] days."
black_plague_rat_seat_the_alpha_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionDominantAlphaMassCost]§!  Coherence at least §Y[GetBlackPlagueRatValueBlackPlagueRatPoolCoherenceLowThreshold]§!  Cooldown [GetBlackPlagueRatValueBlackPlagueRatDecisionDominantAlphaCooldownDays] days"
black_plague_rat_seat_the_alpha_cost_blocked: "§RThe Dominant Beast route needs enough Brood Mass, Coherence, and an open command cooldown.§!"
black_plague_rat_decode_route_memory: "Decode the Route Memory"
black_plague_rat_decode_route_memory_desc: "The Emergent Cunning route spends [GetBlackPlagueRatValueBlackPlagueRatDecisionEmergentRouteMemoryMassCost] Brood Mass to read a rail, supply, or capital target beside a rat-held state. The selected human enemy receives [GetBlackPlagueRatValueBlackPlagueRatDecisionEmergentRouteMemoryExposure] transport exposure and the carrier gains [GetBlackPlagueRatValueBlackPlagueRatDecisionEmergentRouteMemorySentienceGain] Sentience. The target cannot be read again for [GetBlackPlagueRatValueBlackPlagueRatDecisionEmergentRouteMemoryCooldownDays] days."
black_plague_rat_decode_route_memory_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionEmergentRouteMemoryMassCost]§!  Target a human enemy logistics state  Cooldown [GetBlackPlagueRatValueBlackPlagueRatDecisionEmergentRouteMemoryCooldownDays] days"
black_plague_rat_decode_route_memory_cost_blocked: "§RThe Emergent Cunning route needs a human enemy at war, a logistics target beside rat-held ground, enough Brood Mass, and no active memory cooldown.§!"
black_plague_rat_resist_absorption: "Resist Absorption"
black_plague_rat_resist_absorption_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionResistAbsorptionMassCost] Brood Mass in the selected weaker basin to add [GetBlackPlagueRatValueBlackPlagueRatDecisionResistAbsorptionStrengthGain] Brood Strength and delay absorption for [GetBlackPlagueRatValueBlackPlagueRatDecisionResistAbsorptionStateDurationDays] days."
black_plague_rat_resist_absorption_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionResistAbsorptionMassCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionResistAbsorptionDurationDays] days"
black_plague_rat_resist_absorption_cost_blocked: "§RSelect an eligible weaker basin and provide the required Brood Mass before the merger pulse.§!"
black_plague_rat_citadel_stockpile: "Open the Citadel Stockpile"
black_plague_rat_citadel_stockpile_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionRouteOperationMassCost] Brood Mass to reserve food and shoring timber in the urban relays. The route gains [GetBlackPlagueRatValueBlackPlagueRatDecisionRouteOperationDivisionCapGain] division cap and pushes city-borne exposure for [GetBlackPlagueRatValueBlackPlagueRatDecisionRouteOperationDurationDays] days."
black_plague_rat_route_operation_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionRouteOperationMassCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days"
black_plague_rat_route_operation_cost_blocked: "§RThe route needs its matching focus lane, enough Brood Mass, and no active operation cooldown.§!"
black_plague_rat_open_migration_lanes: "Open Migration Lanes"
black_plague_rat_open_migration_lanes_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionRouteOperationMassCost] Brood Mass to move broods through grain tunnels. The operation returns [GetBlackPlagueRatValueBlackPlagueRatDecisionRouteOperationBroodMassGain] mass and strengthens refugee and transport routes for [GetBlackPlagueRatValueBlackPlagueRatDecisionRouteOperationDurationDays] days."
black_plague_rat_tide_manifest: "Issue the Tide Manifest"
black_plague_rat_tide_manifest_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionRouteOperationMassCost] Brood Mass to mark cargo holds and dock burrows. The manifest returns [GetBlackPlagueRatValueBlackPlagueRatDecisionRouteOperationBroodMassGain] mass and increases port exposure for [GetBlackPlagueRatValueBlackPlagueRatDecisionRouteOperationDurationDays] days without bypassing the overseas-spread gate."
black_plague_rat_rail_breach_order: "Order a Rail Breach"
black_plague_rat_rail_breach_order_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionRouteOperationMassCost] Brood Mass during war to force a railway breach. The operation adds [GetBlackPlagueRatValueBlackPlagueRatDecisionRouteOperationDivisionCapGain] division cap and increases troop and transport exposure for [GetBlackPlagueRatValueBlackPlagueRatDecisionRouteOperationDurationDays] days."
black_plague_rat_infect_the_occupation_line: "Infect the Occupation Line"
black_plague_rat_infect_the_occupation_line_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionBroodMassCost] Brood Mass to intensify occupied-line exposure for [GetBlackPlagueRatValueBlackPlagueRatDecisionOccupationInfectionDriveDays] days."
black_plague_rat_infect_the_occupation_line_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionBroodMassCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days"
black_plague_rat_infect_the_occupation_line_cost_blocked: "§RThe carrier needs a war, enough Brood Mass, and no active occupation-drive cooldown.§!"
black_plague_rat_harden_the_immune_blood: "Harden the Immune Blood"
black_plague_rat_harden_the_immune_blood_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionBroodMassCost] Brood Mass to harden the immune blood into a permanent defense and unlock the Dominion reserve."
black_plague_rat_harden_the_immune_blood_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionBroodMassCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days"
black_plague_rat_harden_the_immune_blood_cost_blocked: "§RThe immune-blood rite is one-time and requires enough Brood Mass.§!"
black_plague_rat_resolve_brood_succession: "Resolve Brood Succession"
black_plague_rat_resolve_brood_succession_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionBroodMassCost] Brood Mass to end a succession crisis and increase hierarchy by [GetBlackPlagueRatValueBlackPlagueRatDecisionHierarchyGain]."
black_plague_rat_resolve_brood_succession_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionBroodMassCost]§!"
black_plague_rat_resolve_brood_succession_cost_blocked: "§RResolve the active succession crisis with enough Brood Mass.§!"
black_plague_rat_restore_the_crown: "Restore the Crown"
black_plague_rat_restore_the_crown_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionKingRestorationMassCost] Brood Mass and commit the carrier to a [GetBlackPlagueRatValueBlackPlagueRatDecisionKingRestorationDurationDays]-day restoration. The route requires the old court's memory, a coherent surviving carrier, and an established human basin for the new Royal Basin. It can succeed once after a defeat and never creates another rat country."
black_plague_rat_restore_the_crown_cost: "Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionKingRestorationMassCost]§!  Sentience §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionKingRestorationSentienceGate]§!  Coherence §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionKingRestorationCohesionGate]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionKingRestorationDurationDays] days"
black_plague_rat_restore_the_crown_cost_blocked: "§RThe defeated crown can be rebuilt only once. The Rat King needs the required Brood Mass, Sentience, Coherence, and a free established human basin. His final conquest must not have begun, and the broods must have recovered from the last restoration attempt.§!"
black_plague_rat_king_court_category: "Royal Court"
black_plague_rat_king_court_category_desc: "Rule the Rat Nation through hunger courts, royal stores, succession settlements, and the slow cultivation of collective sentience."
black_plague_rat_king_hold_a_hunger_court: "Hold a Hunger Court"
black_plague_rat_king_hold_a_hunger_court_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionKingDominionCost] Hunger to gain the same amount of Cohesion and end a hunger crisis."
black_plague_rat_king_hold_a_hunger_court_cost: "Hunger §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionKingDominionCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days"
black_plague_rat_king_hold_a_hunger_court_cost_blocked: "§RThe royal court needs the stated Hunger reserve to convene and close the crisis.§!"
black_plague_rat_king_convene_the_council: "Convene the Council"
black_plague_rat_king_convene_the_council_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionKingDominionCost] Cohesion to gain the same amount of Sentience and convene the council."
black_plague_rat_king_convene_the_council_cost: "Cohesion §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionKingDominionCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days"
black_plague_rat_king_convene_the_council_cost_blocked: "§RThe royal court needs the stated Cohesion reserve to convene the council.§!"
black_plague_rat_king_send_the_royal_strike: "Send the Royal Strike"
black_plague_rat_king_send_the_royal_strike_desc: "Select a state controlled by a human enemy. Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionRoyalStrikeDominionCost] Dominion and [GetBlackPlagueRatValueBlackPlagueRatDecisionRoyalStrikeBroodMassCost] Brood Mass to seed a royal plague strike. The operation uses [GetBlackPlagueRatValueBlackPlagueRatDecisionRoyalStrikeCivilianFactories] civilian factory for [GetBlackPlagueRatValueBlackPlagueRatDecisionRoyalStrikeDurationDays] days and cannot retarget the same state during the [GetBlackPlagueRatValueBlackPlagueRatDecisionRoyalStrikeCooldownDays]-day royal cooldown. The Royal Node mark identifies the strike's route through the shared disease map."
black_plague_rat_king_send_the_royal_strike_cost: "Dominion §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionRoyalStrikeDominionCost]§!  Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionRoyalStrikeBroodMassCost]§!  £civ_factory §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionRoyalStrikeCivilianFactories]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionRoyalStrikeDurationDays] days. Same-state cooldown: [GetBlackPlagueRatValueBlackPlagueRatDecisionRoyalStrikeCooldownDays] days."
black_plague_rat_king_send_the_royal_strike_cost_blocked: "§RThe Royal Strike requires enough Dominion and Brood Mass, a valid wartime human target, and an open factory slot.§!"
black_plague_rat_king_record_the_dead: "Record the Dead"
black_plague_rat_king_record_the_dead_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionKingDominionCost] Sentience to add [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalPreparationGain] Terminal Preparation once per reign."
black_plague_rat_king_record_the_dead_cost: "Sentience §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionKingDominionCost]§!"
black_plague_rat_king_record_the_dead_cost_blocked: "§RThe dead record is one-time and requires the stated Sentience reserve.§!"
black_plague_rat_king_mark_terminal_preparation: "Mark Terminal Preparation"
black_plague_rat_king_mark_terminal_preparation_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalSentienceCost] Sentience and [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCohesionCost] Cohesion to add [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalPreparationGain] Terminal Preparation."
black_plague_rat_king_mark_terminal_preparation_cost: "Sentience §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalSentienceCost]§!  Cohesion §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCohesionCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days"
black_plague_rat_king_mark_terminal_preparation_cost_blocked: "§RThe court needs the stated Sentience and Cohesion reserves and an unopened final campaign.§!"
black_plague_rat_king_crown_tithe: "Collect the Crown Tithe"
black_plague_rat_king_crown_tithe_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionKingPolicyOperationMeterCost] Dominion to collect a timed royal tithe. The levy adds [GetBlackPlagueRatValueBlackPlagueRatDecisionKingPolicyOperationDominionGain] Brood Mass and keeps the Crown route's court active for [GetBlackPlagueRatValueBlackPlagueRatDecisionKingPolicyOperationDurationDays] days."
black_plague_rat_king_crown_tithe_cost: "Dominion §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionKingPolicyOperationMeterCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days"
black_plague_rat_king_crown_tithe_cost_blocked: "§RThe Absolute Crown route needs enough Dominion and an open tithe operation slot.§!"
black_plague_rat_king_council_audit: "Audit the Burrow Charters"
black_plague_rat_king_council_audit_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionKingPolicyOperationMeterCost] Cohesion to audit every charter. The work adds [GetBlackPlagueRatValueBlackPlagueRatDecisionKingPolicyOperationSentienceGain] Sentience and restores [GetBlackPlagueRatValueBlackPlagueRatDecisionKingPolicyOperationCohesionGain] Cohesion after the audit interval."
black_plague_rat_king_council_audit_cost: "Cohesion §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionKingPolicyOperationMeterCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days"
black_plague_rat_king_council_audit_cost_blocked: "§RThe Brood Council route needs enough Cohesion and an open charter-audit slot.§!"
black_plague_rat_king_hierophant_broadcast: "Broadcast the Ash Liturgy"
black_plague_rat_king_hierophant_broadcast_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionKingPolicyOperationMeterCost] Sentience to broadcast a royal ash liturgy. It adds [GetBlackPlagueRatValueBlackPlagueRatDecisionKingPolicyOperationTerminalGain] Terminal Preparation and holds the rite for [GetBlackPlagueRatValueBlackPlagueRatDecisionKingPolicyOperationDurationDays] days."
black_plague_rat_king_hierophant_broadcast_cost: "Sentience §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionKingPolicyOperationMeterCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days"
black_plague_rat_king_hierophant_broadcast_cost_blocked: "§RThe Black-Breath Hierophancy needs enough Sentience and an open broadcast slot.§!"
black_plague_rat_king_preserve_feeding_province: "Preserve a Feeding Province"
black_plague_rat_king_preserve_feeding_province_desc: "Select one rat-controlled state and spend Dominion, Brood Mass, military allocation, and a factory slot to preserve its population for [GetBlackPlagueRatValueBlackPlagueRatPopulationPolicyPreserveDurationDays] days. The completed province gains containment and treatment coverage while mortality, spread, and Rat Infestation fall. The operation leaves a visible preserved-policy mark and cannot retarget the state for [GetBlackPlagueRatValueBlackPlagueRatPopulationPolicyPreserveCooldownDays] days."
black_plague_rat_king_preserve_feeding_province_cost: "Dominion §Y[GetBlackPlagueRatValueBlackPlagueRatPopulationPolicyPreserveDominionCost]§!  Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatPopulationPolicyPreserveBroodMassCost]§!  Military allocation §Y[GetBlackPlagueRatValueBlackPlagueRatPopulationPolicyPreserveDivisionCapCost]§!  £civ_factory §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCivilianFactories]§!  [GetBlackPlagueRatValueBlackPlagueRatPopulationPolicyPreserveDurationDays] days"
black_plague_rat_king_preserve_feeding_province_cost_blocked: "§RThe Preserve and Rule route needs a rat-controlled state without a policy cooldown, the stated Dominion, Brood Mass, military allocation, and factory slot.§!"
black_plague_rat_king_empty_the_city: "Empty the City"
black_plague_rat_king_empty_the_city_desc: "Select one rat-controlled state and spend Dominion, Brood Mass, military allocation, and a factory slot to empty it over [GetBlackPlagueRatValueBlackPlagueRatPopulationPolicyEmptyDurationDays] days. The completed operation devastates the state, raises mortality and spread, deepens Rat Infestation, and returns Brood Mass while relieving royal Hunger. The state cannot be retargeted for [GetBlackPlagueRatValueBlackPlagueRatPopulationPolicyEmptyCooldownDays] days."
black_plague_rat_king_empty_the_city_cost: "Dominion §Y[GetBlackPlagueRatValueBlackPlagueRatPopulationPolicyEmptyDominionCost]§!  Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatPopulationPolicyEmptyBroodMassCost]§!  Military allocation §Y[GetBlackPlagueRatValueBlackPlagueRatPopulationPolicyEmptyDivisionCapCost]§!  £civ_factory §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCivilianFactories]§!  [GetBlackPlagueRatValueBlackPlagueRatPopulationPolicyEmptyDurationDays] days"
black_plague_rat_king_empty_the_city_cost_blocked: "The Empty the Cities route needs a rat-controlled state without a policy cooldown, the stated Dominion, Brood Mass, military allocation, and factory slot."
black_plague_rat_king_selective_harvest: "Selective Harvest"
black_plague_rat_king_selective_harvest_desc: "Select a strategic rat-controlled logistics state and spend Dominion, Brood Mass, Sentience, military allocation, and a factory slot to harvest it over [GetBlackPlagueRatValueBlackPlagueRatPopulationPolicySelectiveDurationDays] days. The target suffers higher mortality, spread, and Rat Infestation while other royal states gain containment and lower pressure. The state cannot be retargeted for [GetBlackPlagueRatValueBlackPlagueRatPopulationPolicySelectiveCooldownDays] days."
black_plague_rat_king_selective_harvest_cost: "Dominion §Y[GetBlackPlagueRatValueBlackPlagueRatPopulationPolicySelectiveDominionCost]§!  Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatPopulationPolicySelectiveBroodMassCost]§!  Sentience §Y[GetBlackPlagueRatValueBlackPlagueRatPopulationPolicySelectiveSentienceCost]§!  Military allocation §Y[GetBlackPlagueRatValueBlackPlagueRatPopulationPolicySelectiveDivisionCapCost]§!  £civ_factory §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCivilianFactories]§!  [GetBlackPlagueRatValueBlackPlagueRatPopulationPolicySelectiveDurationDays] days"
black_plague_rat_king_selective_harvest_cost_blocked: "The Selective Harvest route needs a strategic logistics state without a policy cooldown, the stated Dominion, Brood Mass, Sentience, military allocation, and factory slot."
black_plague_rat_king_select_target_continent: "Select the Target Continent"
black_plague_rat_king_select_target_continent_desc: "Spend Dom. [GetBlackPlagueRatValueBlackPlagueRatDecisionTargetContinentDominionCost] + Sent. [GetBlackPlagueRatValueBlackPlagueRatDecisionTargetContinentSentienceCost] to mark one continent for the final campaign after royal preparations. Choice cannot change."
black_plague_rat_king_select_target_continent_cost: "Dominion §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTargetContinentDominionCost]§!  Sentience §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTargetContinentSentienceCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionTargetContinentSelectionDays] days"
black_plague_rat_king_select_target_continent_cost_blocked: "§RThe court needs royal preparations, a valid continent, and the stated Dominion and Sentience reserves.§!"
black_plague_rat_king_close_the_harbors: "Close the Harbors"
black_plague_rat_king_close_the_harbors_desc: "Select a marked coastal port on [GetBlackPlagueRatKingTargetContinentName]. Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignHarborDominionCost] Dominion, [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignHarborBroodMassCost] Brood Mass, and [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignHarborDivisionCapCost] military allocation to close the harbor after [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignDurationDays] days. The sealed port becomes a plague pressure point and raises Terminal Preparation."
black_plague_rat_king_close_the_harbors_cost: "Dominion §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignHarborDominionCost]§!  Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignHarborBroodMassCost]§!  Military allocation §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignHarborDivisionCapCost]§!  £civ_factory §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCivilianFactories]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignDurationDays] days"
black_plague_rat_king_close_the_harbors_cost_blocked: "§RThe marked harbor must be a human wartime target, and the Royal Basin needs the stated Dominion, Brood Mass, military allocation, and factory slot.§!"
black_plague_rat_king_silence_the_capitals: "Silence the Capitals"
black_plague_rat_king_silence_the_capitals_desc: "Select a designated capital on [GetBlackPlagueRatKingTargetContinentName]. Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCapitalDominionCost] Dominion, [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCapitalBroodMassCost] Brood Mass, and [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCapitalDivisionCapCost] military allocation to silence it after [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignDurationDays] days. The assault spreads the plague and advances Terminal Preparation."
black_plague_rat_king_silence_the_capitals_cost: "Dominion §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCapitalDominionCost]§!  Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCapitalBroodMassCost]§!  Military allocation §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCapitalDivisionCapCost]§!  £civ_factory §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCivilianFactories]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignDurationDays] days"
black_plague_rat_king_silence_the_capitals_cost_blocked: "§RThe designated capital must remain a human wartime target, and the Royal Basin needs the stated Dominion, Brood Mass, military allocation, and factory slot.§!"
black_plague_rat_king_break_human_coordination: "Break Human Coordination"
black_plague_rat_king_break_human_coordination_desc: "Select a marked logistics state on [GetBlackPlagueRatKingTargetContinentName]. Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCoordinationDominionCost] Dominion, [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCoordinationBroodMassCost] Brood Mass, military allocation, and a factory slot to fracture its coordination after [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignDurationDays] days. The completed operation raises mortality and spread, lowers containment, and leaves a visible coordination break that human last-response missions can clear."
black_plague_rat_king_break_human_coordination_cost: "Dominion §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCoordinationDominionCost]§!  Brood Mass §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCoordinationBroodMassCost]§!  Military allocation §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCoordinationDivisionCapCost]§!  £civ_factory §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignCivilianFactories]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignDurationDays] days"
black_plague_rat_king_break_human_coordination_cost_blocked: "§RThe marked logistics state must remain a human wartime target, and the Royal Basin needs the stated Dominion, Brood Mass, military allocation, and factory slot.§!"
black_plague_rat_king_crown_the_continent: "Crown the Continent"
black_plague_rat_king_crown_the_continent_desc: "Spend [GetBlackPlagueRatValueBlackPlagueRatDecisionTargetContinentCrownDominionCost] Dominion, [GetBlackPlagueRatValueBlackPlagueRatDecisionTargetContinentCrownSentienceCost] Sentience, and [GetBlackPlagueRatValueBlackPlagueRatDecisionTargetContinentCrownCohesionCost] Cohesion to begin the [GetBlackPlagueRatValueBlackPlagueRatDecisionTargetContinentCrownDurationDays]-day crown campaign for [GetBlackPlagueRatKingTargetContinentName]. Losing the selected ratio, capitals, or refuge nodes cancels the operation."
black_plague_rat_king_crown_the_continent_cost: "Dominion §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTargetContinentCrownDominionCost]§!  Sentience §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTargetContinentCrownSentienceCost]§!  Cohesion §Y[GetBlackPlagueRatValueBlackPlagueRatDecisionTargetContinentCrownCohesionCost]§!  [GetBlackPlagueRatValueBlackPlagueRatDecisionDurationDays] days. Hold for [GetBlackPlagueRatValueBlackPlagueRatDecisionTargetContinentCrownDurationDays] days."
black_plague_rat_king_crown_the_continent_cost_blocked: "§RThe selected continent must meet the 90 percent, capital, and refuge gates, crown preparations must be complete, and the royal court cannot be in a Hunger crisis.§!"
black_plague_rat_king_crown_the_continent_mission: "Crown Campaign: [GetBlackPlagueRatKingTargetContinentName]"
black_plague_rat_king_crown_the_continent_mission_desc: "Hold the selected continent's control ratio, designated capitals, and refuge nodes until the crown window closes. Any geographic loss cancels the campaign. A timeout costs Dominion, Hunger, and Terminal Preparation."
black_plague_rat_king_execute_terminal_takeover: "Issue the Final Order"
black_plague_rat_king_close_the_harbors_terminal_desc: "Close a marked wartime port after a [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignDurationDays]-day operation. Port inspections, sealed transport, and air reconnaissance can break it. Sea Brood carries the plague into one overseas region."
black_plague_rat_king_silence_the_capitals_terminal_desc: "Silence a designated capital or refuge after a [GetBlackPlagueRatValueBlackPlagueRatDecisionTerminalCampaignDurationDays]-day operation. Anti-rat cordons and air reconnaissance can break the command assault."
black_plague_rat_king_execute_terminal_takeover_desc: "The royal preparations are complete. Issue the final order and send the crown across the marked continent."
black_plague_rat_king_execute_terminal_takeover_cost: "Requires a marked continent, completed crown preparations, and a stable royal court."
black_plague_rat_king_execute_terminal_takeover_cost_blocked: "The court lacks a marked continent, the required preparations, or a stable command. Recheck deaths, Chaos, Dominion, Sentience, Cohesion, and royal crises."

