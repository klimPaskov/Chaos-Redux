l_english:
black_plague_rat_brood_category: "Brood Commands"
black_plague_rat_brood_category_desc: "[GetBlackPlagueRatBroodCategoryDescription]"
black_plague_rat_brood_category_desc_rta: "Direct the burrows, conserve Brood Mass, and raise capped non-human formations without drawing on human manpower.\n\nBrood Mass: §Y[?black_plague_rat_brood_mass|0]§! / §Y[?constant:black_plague_rat_pool.brood_mass_cap|0]§!   Hunger: §R[?black_plague_rat_hunger|0]§! / §Y[?constant:black_plague_value.maximum|0]§!   Coherence: §Y[?black_plague_rat_coherence|0]§! / §Y[?constant:black_plague_value.maximum|0]§!\nDisease Dominion: §G[?black_plague_rat_disease_dominion|0]§! / §Y[?constant:black_plague_value.maximum|0]§!   Controlled states: §Y[?black_plague_rat_dominion_states|0]§!\n\nHunger drives expansion and can force destructive feeding. Coherence governs the reliability of pulses and rival absorption."
black_plague_rat_brood_category_desc_king: "The royal court uses Dominion, Sentience, Cohesion, and Hunger. Brood Mass remains a bounded pulse reserve for absorbed royal formations.\n\nDominion: §Y[?black_plague_rat_king_dominion|0]§!   Sentience: §Y[?black_plague_rat_king_sentience|0]§!   Cohesion: §Y[?black_plague_rat_king_cohesion|0]§!   Hunger: §R[?black_plague_rat_king_hunger|0]§!"
black_plague_rat_call_a_brood_pulse: "Call a Brood Pulse"
black_plague_rat_call_a_brood_pulse_desc: "Spend [?constant:black_plague_rat_decision.brood_mass_cost|0] Brood Mass to raise one capped, non-human brood unit. The pulse cannot exceed the current brood cap."
black_plague_rat_absorb_a_weaker_brood: "Absorb a Weaker Brood"
black_plague_rat_absorb_a_weaker_brood_desc: "Spend [?constant:black_plague_rat_decision.merger_mass_cost|0] Brood Mass to let a stronger adjacent brood absorb one weaker warren and inherit its surviving units."
black_plague_rat_map_the_burrows: "Map the Burrows"
black_plague_rat_map_the_burrows_desc: "Spend [?constant:black_plague_rat_decision.brood_mass_cost|0] Brood Mass to map hidden approaches and expand the division cap by [?constant:black_plague_rat_decision.division_cap_gain|0]."
black_plague_rat_citadel_stockpile: "Open the Citadel Stockpile"
black_plague_rat_citadel_stockpile_desc: "Spend [?constant:black_plague_rat_decision.route_operation_mass_cost|0] Brood Mass to reserve food and shoring timber in the urban relays. The route gains [?constant:black_plague_rat_decision.route_operation_division_cap_gain|0] division cap and pushes city-borne exposure for [?constant:black_plague_rat_decision.route_operation_duration_days|0] days."
black_plague_rat_open_migration_lanes: "Open Migration Lanes"
black_plague_rat_open_migration_lanes_desc: "Spend [?constant:black_plague_rat_decision.route_operation_mass_cost|0] Brood Mass to move broods through grain tunnels. The operation returns [?constant:black_plague_rat_decision.route_operation_brood_mass_gain|0] mass and strengthens refugee and transport routes for [?constant:black_plague_rat_decision.route_operation_duration_days|0] days."
black_plague_rat_tide_manifest: "Issue the Tide Manifest"
black_plague_rat_tide_manifest_desc: "Spend [?constant:black_plague_rat_decision.route_operation_mass_cost|0] Brood Mass to mark cargo holds and dock burrows. The manifest returns [?constant:black_plague_rat_decision.route_operation_brood_mass_gain|0] mass and increases port exposure for [?constant:black_plague_rat_decision.route_operation_duration_days|0] days without bypassing the overseas-spread gate."
black_plague_rat_rail_breach_order: "Order a Rail Breach"
black_plague_rat_rail_breach_order_desc: "Spend [?constant:black_plague_rat_decision.route_operation_mass_cost|0] Brood Mass during war to force a railway breach. The operation adds [?constant:black_plague_rat_decision.route_operation_division_cap_gain|0] division cap and increases troop and transport exposure for [?constant:black_plague_rat_decision.route_operation_duration_days|0] days."
black_plague_rat_infect_the_occupation_line: "Infect the Occupation Line"
black_plague_rat_infect_the_occupation_line_desc: "Spend [?constant:black_plague_rat_decision.brood_mass_cost|0] Brood Mass to intensify occupied-line exposure for [?constant:black_plague_rat_decision.occupation_infection_drive_days|0] days."
black_plague_rat_harden_the_immune_blood: "Harden the Immune Blood"
black_plague_rat_harden_the_immune_blood_desc: "Spend [?constant:black_plague_rat_decision.brood_mass_cost|0] Brood Mass to harden the immune blood into a permanent defense and unlock the Dominion reserve."
black_plague_rat_resolve_brood_succession: "Resolve Brood Succession"
black_plague_rat_resolve_brood_succession_desc: "Spend [?constant:black_plague_rat_decision.brood_mass_cost|0] Brood Mass to end a succession crisis and increase hierarchy by [?constant:black_plague_rat_decision.hierarchy_gain|0]."
black_plague_rat_king_court_category: "Royal Court"
black_plague_rat_king_court_category_desc: "Rule the Rat Nation through hunger courts, royal stores, succession settlements, and the slow cultivation of collective sentience."
black_plague_rat_king_hold_a_hunger_court: "Hold a Hunger Court"
black_plague_rat_king_hold_a_hunger_court_desc: "Spend [?constant:black_plague_rat_decision.king_dominion_cost|0] Hunger to gain the same amount of Cohesion and end a hunger crisis."
black_plague_rat_king_convene_the_council: "Convene the Council"
black_plague_rat_king_convene_the_council_desc: "Spend [?constant:black_plague_rat_decision.king_dominion_cost|0] Cohesion to gain the same amount of Sentience and convene the council."
black_plague_rat_king_send_the_royal_strike: "Send the Royal Strike"
black_plague_rat_king_send_the_royal_strike_desc: "Spend [?constant:black_plague_rat_decision.king_dominion_cost|0] Dominion during a war to recover [?constant:black_plague_rat_decision.brood_mass_cost|0] Brood Mass from the breach."
black_plague_rat_king_record_the_dead: "Record the Dead"
black_plague_rat_king_record_the_dead_desc: "Spend [?constant:black_plague_rat_decision.king_dominion_cost|0] Sentience to add [?constant:black_plague_rat_decision.terminal_preparation_gain|0] Terminal Preparation once per reign."
black_plague_rat_king_mark_terminal_preparation: "Mark Terminal Preparation"
black_plague_rat_king_mark_terminal_preparation_desc: "Spend [?constant:black_plague_rat_decision.terminal_sentience_cost|0] Sentience and [?constant:black_plague_rat_decision.terminal_cohesion_cost|0] Cohesion to add [?constant:black_plague_rat_decision.terminal_preparation_gain|0] Terminal Preparation."
black_plague_rat_king_crown_tithe: "Collect the Crown Tithe"
black_plague_rat_king_crown_tithe_desc: "Spend [?constant:black_plague_rat_decision.king_policy_operation_meter_cost|0] Dominion to collect a timed royal tithe. The levy adds [?constant:black_plague_rat_decision.king_policy_operation_dominion_gain|0] Brood Mass and keeps the Crown route's court active for [?constant:black_plague_rat_decision.king_policy_operation_duration_days|0] days."
black_plague_rat_king_council_audit: "Audit the Burrow Charters"
black_plague_rat_king_council_audit_desc: "Spend [?constant:black_plague_rat_decision.king_policy_operation_meter_cost|0] Cohesion to audit every charter. The work adds [?constant:black_plague_rat_decision.king_policy_operation_sentience_gain|0] Sentience and restores [?constant:black_plague_rat_decision.king_policy_operation_cohesion_gain|0] Cohesion after the audit interval."
black_plague_rat_king_hierophant_broadcast: "Broadcast the Ash Liturgy"
black_plague_rat_king_hierophant_broadcast_desc: "Spend [?constant:black_plague_rat_decision.king_policy_operation_meter_cost|0] Sentience to broadcast a royal ash liturgy. It adds [?constant:black_plague_rat_decision.king_policy_operation_terminal_gain|0] Terminal Preparation and holds the rite for [?constant:black_plague_rat_decision.king_policy_operation_duration_days|0] days."
black_plague_rat_king_execute_terminal_takeover: "Issue the Final Order"
black_plague_rat_king_execute_terminal_takeover_desc: "Evolution V has opened the earned terminal route. Issue the final order to begin the deterministic takeover and world-end sequence."
black_plague_rat_king_execute_terminal_takeover_cost: "Requires the earned Evolution V route, the selected continent gates, and a stable royal court."
black_plague_rat_king_execute_terminal_takeover_cost_blocked: "The final route is not ready: recheck the continent, capitals, refuge nodes, deaths, Chaos, Dominion, Sentience, Cohesion, and royal crises."
