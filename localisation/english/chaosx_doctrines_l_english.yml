l_english:
GRAND_DOCTRINE_CHAOS_WARFARE: "Chaos Warfare"
GRAND_DOCTRINE_CHAOS_WARFARE_DESC: "A conditional CBRN doctrine built on protected formations, controlled payload logistics, Army Headquarters preparation, and explicit national release policy. Adoption begins a [?constant:cbrn_doctrine_timing.establishment_mission_days|.0]-day establishment test, then makes authorized CBRN deployments faster, more destructive, and politically easier to sustain. Every release still requires its own paid operation."
tactic_gas_mask_defense: "Gas-Mask Defence"
tactic_chemical_shelling: "Chemical Shelling"
tactic_chemical_barrage: "Prepared Chemical Barrage"

SUBDOCTRINE_EXTERMINATION_COLUMNS: "Hazard Assault Formations"
SUBDOCTRINE_EXTERMINATION_COLUMNS_DESC: "Protected infantry, hazard pioneers, and assault battalions train to seize and hold contaminated terrain at a pace conventional formations cannot match. Dedicated exercises consume respirators and Army Experience, while every live release still consumes payload and records its consequences."

extermination_columns_contagion_assault_drills: "Mask Discipline and Assault Drills"
extermination_columns_contagion_assault_drills_desc: "Repeated fit checks, filter discipline, and movement drills improve the reliability of primary protection and unlock a division-command posture focused on organisation retention."
extermination_columns_sacrificial_march_columns: "Contaminated Terrain Movement"
extermination_columns_sacrificial_march_columns_desc: "Marked lanes, casualty collection points, and engineer-led movement reduce the supply burden of hazard-support formations and qualify the army for Hazard Pioneer formations."
extermination_columns_unlock_chaos_battalion: "Chaos Assault Battalion"
extermination_columns_unlock_chaos_battalion_desc: "Protected special forces are organized for breaching fortified and contaminated approaches. The formation carries no chemical or biological payload by default and requires the Theater Exploitation institution before its technology is issued."
extermination_columns_ruinwave_battlecells: "Shock Exploitation"
extermination_columns_ruinwave_battlecells_desc: "Protected assault groups convert prepared routes and fire plans into a narrow breakthrough advantage without removing friendly-exposure risk."
extermination_columns_terminal_contagion_offensive: "Terminal Hazard Offensive"
extermination_columns_terminal_contagion_offensive_desc: "Capstone assault equipment and rehearsed corridor handoffs improve the Chaos Assault Battalion. Any escalation still consumes payload and records deaths, contamination, medical burden, evidence, and Condemnation."
extermination_columns_chaos_battalion_unlocked_tt: "Qualifies §YChaos Assault Battalion§! technology for issue once §YTheater Exploitation§! is established."
extermination_columns_terminal_contagion_unlocked_tt: "Qualifies §YImproved Chaos Assault Equipment§! once §YTheater Exploitation§! and the base battalion technology are present."

SUBDOCTRINE_CHEMICAL_SUPPRESSION: "Toxic Armored Warfare"
SUBDOCTRINE_CHEMICAL_SUPPRESSION_DESC: "Sealed crews, armored delivery detachments, and protected breakthrough logistics support repeated, aggressive battlefield release. Its deeper mastery extends nerve-agent methods into extermination infrastructure, increasing killing efficiency while reducing payload waste and forensic exposure."

chemical_suppression_adamsite_emission_cells: "Sealed Crew Compartments"
chemical_suppression_adamsite_emission_cells_desc: "Improved seals, overpressure drills, and crew decontamination increase chemical-tank support reliability and qualify Sealed Tank Crews for a dedicated commission."
chemical_suppression_armored_chemical_support_liaison: "Armored Agent Delivery"
chemical_suppression_armored_chemical_support_liaison_desc: "Delivery detachments coordinate with protected infantry and unlock the Armored Agent Delivery technology without granting a free chemical attack."
chemical_suppression_zyklon_b_saturation_drills: "Gas-Chamber Saturation Drills"
chemical_suppression_zyklon_b_saturation_drills_desc: "Extermination staffs standardize sealed chambers, timed saturation, and cylinder handling. Once any nerve agent has been researched, camps can adopt the strongest stocked nerve agent with devastating killing efficiency, far lower payload use, stronger resistance suppression, and reduced forensic exposure."
chemical_suppression_sealed_pressure_logistics: "Protected Breakthrough Logistics"
chemical_suppression_sealed_pressure_logistics_desc: "Sealed transfer points and mobile washdown teams reduce the supply burden of chemical-tank support formations."
chemical_suppression_catastrophic_shock_breakthrough: "Catastrophic Shock Breakthrough"
chemical_suppression_catastrophic_shock_breakthrough_desc: "Armored CBRN command links improve coordination for a prepared breakthrough while retaining payload, protection, and consequence requirements."
chemical_suppression_nerve_operations_unlocked_tt: "Unlocks §YNerve-Agent Camp Methods§! once a nerve agent has been researched and sufficient cylinders are available."
chemical_suppression_camp_nerve_methods_unlocked_tt: "Unlocks §YNerve-Agent Camp Methods§!. A researched nerve agent and sufficient cylinders are the only additional requirements. Nerve-agent camp killing rises to §G[?constant:camp_rework_chemical_factor.nerve_mastery_deaths|%0]§! of baseline while payload use falls to §G[?constant:camp_rework_chemical_factor.nerve_mastery_payload_cost|%0]§! and evidence generation falls to §G[?constant:camp_rework_chemical_factor.nerve_mastery_evidence|%0]§!. Deaths, contamination, resistance trauma, evidence, attribution, and Condemnation remain recorded."

SUBDOCTRINE_CONTAMINANT_FIREBASES: "Contaminant Fire Support"
SUBDOCTRINE_CONTAMINANT_FIREBASES_DESC: "Projector batteries and chemical ammunition trains turn prepared fire plans into larger, more frequent contamination attacks. Every delivery route draws real payload and records the resulting exposure. Idle units and idle aircraft create no contamination."

contaminant_firebases_livens_fire_control_cells: "Projector Fire-Control Cells"
contaminant_firebases_livens_fire_control_cells_desc: "Surveyed firing tables and protected line crews improve the reliability of chemical projector batteries."
contaminant_firebases_counterbattery_gas_synchronization: "Counterbattery Chemical Synchronization"
contaminant_firebases_counterbattery_gas_synchronization_desc: "Counterbattery staffs coordinate conventional and chemical support windows, improving army coordination without creating a passive release."
contaminant_firebases_raid_targeting_teams: "Chemical Shell Logistics"
contaminant_firebases_raid_targeting_teams_desc: "Dedicated shell accounting and protected ammunition trains unlock Chemical Artillery Shells and the equipment-backed delivery formation."
contaminant_firebases_persistent_agent_distribution: "Persistent-Agent Shell Filling"
contaminant_firebases_persistent_agent_distribution_desc: "Improved filling discipline raises ammunition reliability and enables a commission for persistent-agent shells when a persistent agent is available."
contaminant_firebases_deep_contamination_fireplans: "Deep Contamination Fireplans"
contaminant_firebases_deep_contamination_fireplans_desc: "Theater staffs may prepare deep contamination plans, but execution still requires an eligible target, an explicit delivery hook, and a paid payload before any state is affected."
contaminant_firebases_raid_targeting_teams_tt: "Grants §YChemical Artillery Shells§!, unlocks the §YChemical Ammunition Train§!, and raises the potency of every accepted chemical release to §G[?constant:chem_contaminant_firebases.raid_damage_mult.raid_targeting_teams|%0]§! of baseline."
contaminant_firebases_persistent_agent_distribution_tt: "Enables the §YCommission Persistent-Agent Shell Filling§! decision when Mustard Gas or Lewisite is available and raises contamination from every accepted chemical release to §G[?constant:chem_contaminant_firebases.contamination_mult.persistent_agent_distribution|%0]§! of baseline."
contaminant_firebases_deep_contamination_fireplans_tt: "Raises accepted chemical-release potency to §G[?constant:chem_contaminant_firebases.raid_damage_mult.deep_contamination_fireplans|%0]§! and contamination to §G[?constant:chem_contaminant_firebases.contamination_mult.deep_contamination_fireplans|%0]§! of baseline. Payload debit and the shared consequence pipeline remain mandatory."

SUBDOCTRINE_INTEGRATED_CHEMICAL_OPERATIONS: "Integrated CBRN Command"
SUBDOCTRINE_INTEGRATED_CHEMICAL_OPERATIONS_DESC: "Army Headquarters intelligence, protection, decontamination, medical, and biological-security sections coordinate the theater layer. Mastery makes CBRN deployment faster, more aggressive, more potent, and more persistent while reducing Condemnation impact; it never removes evidence, attribution, deaths, contamination, medical saturation, or confirmed-use history."

integrated_chemical_operations_operational_recon_grids: "Operational Reconnaissance Grids"
integrated_chemical_operations_operational_recon_grids_desc: "Forecasting and route reconnaissance improve army reconnaissance and begin doctrine-based Condemnation mitigation without changing evidence, attribution, deaths, contamination, medical saturation, or confirmed-use history."
integrated_chemical_operations_signal_intelligence_fusion: "Signal-Intelligence Fusion"
integrated_chemical_operations_signal_intelligence_fusion_desc: "Signals, liaison nets, and protective logistics improve reinforcement coordination, unlock the Headquarters Protective Logistics Section, and make every accepted chemical or biological release substantially more potent and persistent."
integrated_chemical_operations_countercontamination_routing: "Counter-Contamination Routing"
integrated_chemical_operations_countercontamination_routing_desc: "Dedicated movement corridors reduce Headquarters supply consumption by §G[?constant:cbrn_doctrine_modifier.operations_m3_hq_supply|%0]§!, qualify §YMobile Decontamination Columns§! technology, and raise national decontamination capacity to at least §Y[?constant:cbrn_doctrine_capacity.operations_mastery_three_decontamination_minimum|.0]§!."
integrated_chemical_operations_air_surface_chemical_link: "Air-Surface CBRN Link"
integrated_chemical_operations_air_surface_chemical_link_desc: "Air and ground staffs share target, weather, protection, and medical reporting. Every accepted chemical or biological release becomes more potent and persistent, with a further bonus for exact-state chemical air raids. Ordinary air activity never contaminates an air region."
integrated_chemical_operations_theater_intelligence_overmatch: "Theater Intelligence Overmatch"
integrated_chemical_operations_theater_intelligence_overmatch_desc: "A complete CBRN Headquarters architecture greatly increases chemical and biological potency and persistence while applying the maximum doctrine-based Condemnation mitigation. Public-harm floors and every underlying consequence remain."
integrated_chemical_operations_operational_recon_grids_tt: "Unlocks §YChemical Intelligence and Weather Cell§! for Army Headquarters.\n§YDoctrine Condemnation impact§!: §G[?constant:chem_integrated_operations.condemnation_mult.operational_recon_grids|%0] of baseline§!\n§YEvidence, attribution, deaths, contamination, medical saturation, and confirmed-use history§!: unchanged"
integrated_chemical_operations_signal_intelligence_fusion_tt: "Unlocks §YProtective Logistics Section§! for Army Headquarters.\n§YLand reinforcement rate bonus§!: §G[?constant:cbrn_doctrine_modifier.operations_m2_reinforce|%0]§!\n§YAccepted chemical-release potency and contamination§!: §G[?constant:chem_integrated_operations.raid_effect_mult.signal_intelligence_fusion|%0] of baseline§!\n§YAccepted biological-release potency§!: §G[?constant:bio_integrated_operations.outbreak_potency_mult.signal_intelligence_fusion|%0] of baseline§!\n§YBiological outbreak persistence§!: §G[?constant:bio_integrated_operations.outbreak_duration_mult.signal_intelligence_fusion|%0] of baseline§!\n§YCommand power recovered after accepted biological deployment§!: §G[?constant:bio_integrated_operations.outbreak_command_power_refund.signal_intelligence_fusion|.0]§!"
integrated_chemical_operations_air_surface_chemical_link_tt: "Grants §YChemical Air Interdiction§! technology and unlocks §YBiological Security Section§! for Army Headquarters.\n§YAccepted chemical-release potency and contamination§!: §G[?constant:chem_integrated_operations.raid_effect_mult.air_surface_chemical_link|%0] of baseline§!\n§YExact-state chemical air-raid dose§!: a further §G[?constant:chem_integrated_operations.air_bomb_dose_mult.air_surface_chemical_link|%0]§!\n§YExact-state chemical air-raid duration§!: a further §G[?constant:chem_integrated_operations.air_bomb_duration_mult.air_surface_chemical_link|%0]§!\n§YAccepted biological-release potency§!: §G[?constant:bio_integrated_operations.outbreak_potency_mult.air_surface_chemical_link|%0] of baseline§!\n§YBiological outbreak persistence§!: §G[?constant:bio_integrated_operations.outbreak_duration_mult.air_surface_chemical_link|%0] of baseline§!\n§YCommand power recovered after accepted biological deployment§!: §G[?constant:bio_integrated_operations.outbreak_command_power_refund.air_surface_chemical_link|.0]§!\n§YDoctrine Condemnation impact§!: §G[?constant:chem_integrated_operations.condemnation_mult.air_surface_chemical_link|%0] of baseline§!\nEvidence, attribution, deaths, contamination, medical saturation, and confirmed-use history remain recorded. Ordinary air activity creates no contamination."
integrated_chemical_operations_theater_intelligence_overmatch_tt: "Qualifies §YTheater CBRN Headquarters§! technology.\n§YAccepted chemical-release potency and contamination§!: §G[?constant:chem_integrated_operations.raid_effect_mult.theater_intelligence_overmatch|%0] of baseline§!\n§YExact-state chemical air-raid dose§!: a further §G[?constant:chem_integrated_operations.air_bomb_dose_mult.theater_intelligence_overmatch|%0]§!\n§YExact-state chemical air-raid duration§!: a further §G[?constant:chem_integrated_operations.air_bomb_duration_mult.theater_intelligence_overmatch|%0]§!\n§YAccepted biological-release potency§!: §G[?constant:bio_integrated_operations.outbreak_potency_mult.theater_intelligence_overmatch|%0] of baseline§!\n§YBiological outbreak persistence§!: §G[?constant:bio_integrated_operations.outbreak_duration_mult.theater_intelligence_overmatch|%0] of baseline§!\n§YCommand power recovered after accepted biological deployment§!: §G[?constant:bio_integrated_operations.outbreak_command_power_refund.theater_intelligence_overmatch|.0]§!\n§YDoctrine Condemnation impact§!: §G[?constant:chem_integrated_operations.condemnation_mult.theater_intelligence_overmatch|%0] of baseline§!\nPublic-harm floors, evidence, attribution, deaths, contamination, medical saturation, and confirmed-use history remain recorded."
