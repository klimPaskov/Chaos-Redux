chaosx.nr36.1.t: "Alien Spacecraft"

chaosx.nr36.2.t: "Alien Spacecraft"
chaosx.nr36.2.d: "Unexplained spacecraft have appeared at our airbases. Military teams cannot contact the occupants or identify the craft, and the government must decide how to approach the visitors."
chaosx.nr36.2.a: "Treat the visitors cautiously."

chaosx.news.41.t: "Alien Spacecraft"
chaosx.news.41.d: "A spacecraft of unknown design has appeared at several airbases in [From.GetName]. Messages sent to the occupants receive no answer, and investigators have found no clue to the craft's origin."
chaosx.news.41.a: "The craft remains unexplained."
