l_english:
brilliant_scientist_aftermath_treaty_category: "The Scientific Settlement"
brilliant_scientist_aftermath_treaty_category_desc: "Victory left laboratories, populations, weapons, and legal questions that surrender papers cannot settle. We must build a compact capable of surviving its first enforcement test."
brilliant_scientist_aftermath_inspection_category: "Inspection and Dismantlement"
brilliant_scientist_aftermath_inspection_category_desc: "Recovered facilities and project armies must be inventoried before the world can believe that Kruger's arsenal is gone."
brilliant_scientist_aftermath_reconstruction_category: "Rebuilding the Laboratory Provinces"
brilliant_scientist_aftermath_reconstruction_category_desc: "The former laboratory belt is broken, contaminated, and crowded with survivors. Reconstruction requires materiel, factories, and controlled ground."
brilliant_scientist_aftermath_remnants_category: "The Project Remnants"
brilliant_scientist_aftermath_remnants_category_desc: "Every completed project left a different inheritance. Each surviving community, archive, cache, or apparatus demands its own disposition."

brilliant_scientist_aftermath_found_scientific_commission: "Found the International Scientific Commission"
brilliant_scientist_aftermath_found_scientific_commission_desc: "Create the permanent body that will inspect facilities, hear remnant cases, and certify the dismantlement of Kruger's arsenal."
brilliant_scientist_aftermath_exchange_countermeasures: "Exchange Battlefield Countermeasures"
brilliant_scientist_aftermath_exchange_countermeasures_desc: "Pool the practical methods that soldiers and scientists used against project-derived formations."
brilliant_scientist_aftermath_codify_personhood_and_asylum: "Draft Personhood and Asylum Articles"
brilliant_scientist_aftermath_codify_personhood_and_asylum_desc: "Give the compact a legal answer for engineered persons and non-human survivors before expediency supplies one."
brilliant_scientist_aftermath_ban_singularity_components: "Draft the Singularity Convention"
brilliant_scientist_aftermath_ban_singularity_components_desc: "Trace, prohibit, and seize the components that could reconstruct the Strategic Singularity."
brilliant_scientist_aftermath_ratify_scientific_compact: "Ratify the Scientific Compact"
brilliant_scientist_aftermath_ratify_scientific_compact_desc: "Bind the commission, countermeasure exchange, personhood articles, and Singularity convention into a lasting settlement."
brilliant_scientist_aftermath_register_recovered_facility: "Register a Recovered Facility"
brilliant_scientist_aftermath_register_recovered_facility_desc: "Send inspectors and engineers into a controlled laboratory state and record what survived there."
brilliant_scientist_aftermath_inventory_project_templates: "Inventory the Project Armies"
brilliant_scientist_aftermath_inventory_project_templates_desc: "Match captured command records against every project-derived formation and recruitment channel."
brilliant_scientist_aftermath_secure_command_archives: "Secure the Directorate Command Archives"
brilliant_scientist_aftermath_secure_command_archives_desc: "Centralize the surviving orders, access codes, and personnel ledgers before they are dispersed or sold."
brilliant_scientist_aftermath_certify_global_dismantlement: "Certify Global Dismantlement"
brilliant_scientist_aftermath_certify_global_dismantlement_desc: "Register at least one recovered laboratory state, close every remnant case, disband the surviving project armies, and permanently prohibit the armed Singularity route."
brilliant_scientist_aftermath_rebuild_laboratory_state: "Rebuild a Laboratory State"
brilliant_scientist_aftermath_rebuild_laboratory_state_desc: "Commit trucks, trains, support equipment, and factory capacity to restore transport and civilian production in a controlled former laboratory state."
brilliant_scientist_aftermath_open_survivor_clinics: "Open Survivor Clinics"
brilliant_scientist_aftermath_open_survivor_clinics_desc: "Convert support-equipment stocks into clinics for altered workers, veterans, and laboratory survivors."
brilliant_scientist_aftermath_build_memorial_archive: "Build the Memorial Archive"
brilliant_scientist_aftermath_build_memorial_archive_desc: "Preserve testimony and recovered records so the project system cannot be reduced to rumor or triumphalism."
brilliant_scientist_aftermath_close_reconstruction_board: "Close the Reconstruction Board"
brilliant_scientist_aftermath_close_reconstruction_board_desc: "Transfer the restored laboratory provinces from emergency administration to a permanent civil board."
brilliant_scientist_aftermath_hear_clone_communities: "Hear the Clone Communities"
brilliant_scientist_aftermath_hear_clone_communities_desc: "The replicated soldiers have survived their creator and demand a legal identity."
brilliant_scientist_aftermath_audit_machine_nodes: "Audit the Machine Nodes"
brilliant_scientist_aftermath_audit_machine_nodes_desc: "Autonomous frames still exchange maintenance signals from dispersed workshops."
brilliant_scientist_aftermath_secure_paleogenetic_reserves: "Secure the Paleogenetic Reserves"
brilliant_scientist_aftermath_secure_paleogenetic_reserves_desc: "Breeding stock and viable embryos remain inside fortified enclosures."
brilliant_scientist_aftermath_receive_xenobiological_handlers: "Receive the Xenobiological Handlers"
brilliant_scientist_aftermath_receive_xenobiological_handlers_desc: "Handlers offer the commission control protocols for surviving assault organisms."
brilliant_scientist_aftermath_map_portal_terminals: "Map the Portal Terminals"
brilliant_scientist_aftermath_map_portal_terminals_desc: "Dormant transit terminals still answer to recovered routing keys."
brilliant_scientist_aftermath_reconcile_temporal_records: "Reconcile the Temporal Records"
brilliant_scientist_aftermath_reconcile_temporal_records_desc: "Contradictory archives describe operations that occurred, failed, and were prevented."
brilliant_scientist_aftermath_open_biological_archive: "Open the Biological Archive"
brilliant_scientist_aftermath_open_biological_archive_desc: "The archive contains both weapon recipes and the knowledge needed to recognize their effects."
brilliant_scientist_aftermath_catalogue_alien_cache: "Catalogue the Alien Arms Cache"
brilliant_scientist_aftermath_catalogue_alien_cache_desc: "Captured interfaces and weapons remain usable, poorly understood, and coveted."
brilliant_scientist_aftermath_dispose_singularity_core: "Dispose of the Singularity Core"
brilliant_scientist_aftermath_dispose_singularity_core_desc: "The recovered core is incomplete, but it is the last coherent seed of the machine Kruger meant to finish."

brilliant_scientist_aftermath_found_scientific_commission_tt: "The commission opens the inspection and remnant docket."
brilliant_scientist_aftermath_exchange_countermeasures_tt: "Battlefield countermeasures become a permanent part of our doctrine."
brilliant_scientist_aftermath_codify_personhood_and_asylum_tt: "The compact receives binding rules for engineered and non-human persons."
brilliant_scientist_aftermath_ban_singularity_components_tt: "The armed Strategic Singularity is placed under international prohibition."
brilliant_scientist_aftermath_ratify_scientific_compact_tt: "The postwar scientific settlement becomes permanent."
brilliant_scientist_aftermath_register_recovered_facility_tt: "The selected state enters the international facility register."
brilliant_scientist_aftermath_inventory_project_templates_tt: "Project-derived formations and recruitment channels enter the dismantlement inventory."
brilliant_scientist_aftermath_secure_command_archives_tt: "Recovered Directorate command records are secured by the commission."
brilliant_scientist_aftermath_certify_global_dismantlement_tt: "Certification requires a registered laboratory state and every project-causal remnant hearing. All Event 16 project armies are disbanded and their recruitment is closed; completed-project history remains recorded."
brilliant_scientist_aftermath_rebuild_laboratory_state_tt: "The selected state gains infrastructure and a civilian factory after the materiel payment."
brilliant_scientist_aftermath_open_survivor_clinics_tt: "Clinics open for laboratory survivors and altered veterans."
brilliant_scientist_aftermath_build_memorial_archive_tt: "The memorial archive preserves testimony and technical records."
brilliant_scientist_aftermath_close_reconstruction_board_tt: "Emergency reconstruction ends and a permanent civil board takes responsibility."

brilliant_scientist_aftermath_inspection_authority: "International Inspection Authority"
brilliant_scientist_aftermath_inspection_authority_desc: "Permanent inspectors monitor dangerous research and make clandestine work harder, even when their procedures slow legitimate special projects."
brilliant_scientist_aftermath_scientific_compact: "The Scientific Compact"
brilliant_scientist_aftermath_scientific_compact_desc: "Research exchange continues under binding rules, inspection, and an expensive layer of safeguards."
brilliant_scientist_aftermath_reconstruction_board: "Laboratory Reconstruction Board"
brilliant_scientist_aftermath_reconstruction_board_desc: "A civil board coordinates construction across the damaged laboratory provinces."
brilliant_scientist_aftermath_countermeasure_exchange: "Project Countermeasure Exchange"
brilliant_scientist_aftermath_countermeasure_exchange_desc: "Captured doctrine and field experience improve resistance to extraordinary formations and their supply methods."
brilliant_scientist_aftermath_recovered_directorate_archive: "Recovered Directorate Archive"
brilliant_scientist_aftermath_recovered_directorate_archive_desc: "A small Kruger enclave left behind verifiable methods, incomplete project records, and a permanent burden of secure custody."
brilliant_scientist_aftermath_regional_scientific_legacy: "Nationalized Kruger Archive"
brilliant_scientist_aftermath_regional_scientific_legacy_desc: "The regional Directorate's surviving records accelerate research and industrial adaptation while keeping dangerous knowledge inside the state."
brilliant_scientist_aftermath_clone_personhood: "Recognized Replicated Persons"
brilliant_scientist_aftermath_clone_personhood_desc: "The clone communities possess citizenship and recruitment rights, though integrating them requires housing, records, and public expenditure."
brilliant_scientist_aftermath_clone_sequestration: "Sequestered Replication Cadres"
brilliant_scientist_aftermath_clone_sequestration_desc: "The surviving clone population remains under controlled scientific administration, yielding manpower and data at a grave social cost."
brilliant_scientist_aftermath_machine_civil_registry: "Civil Registry of Machine Persons"
brilliant_scientist_aftermath_machine_civil_registry_desc: "Registered autonomous frames may work and maintain themselves under civilian law, improving industrial learning while increasing oversight costs."
brilliant_scientist_aftermath_machine_scrap_drive: "The Great Machine Scrap Drive"
brilliant_scientist_aftermath_machine_scrap_drive_desc: "Dismantled frames feed a rapid factory expansion, but the loss of their adaptive systems harms efficiency and public trust."
brilliant_scientist_aftermath_paleogenetic_reserve: "Paleogenetic Reserve Service"
brilliant_scientist_aftermath_paleogenetic_reserve_desc: "Surviving organisms are contained in guarded reserves that preserve rare military knowledge at a continuing logistical cost."
brilliant_scientist_aftermath_paleogenetic_erasure: "Paleogenetic Erasure Order"
brilliant_scientist_aftermath_paleogenetic_erasure_desc: "The breeding lines were destroyed and their containment doctrine absorbed by the army, closing a dangerous field of research."
brilliant_scientist_aftermath_xenobiological_asylum: "Xenobiological Asylum Program"
brilliant_scientist_aftermath_xenobiological_asylum_desc: "Non-human survivors and their handlers live under protected status, contributing knowledge while requiring costly accommodation."
brilliant_scientist_aftermath_xenobiological_neutralization: "Xenobiological Neutralization Bureau"
brilliant_scientist_aftermath_xenobiological_neutralization_desc: "Specialized teams eliminate surviving assault organisms and suppress black-market breeding at the expense of scientific access."
brilliant_scientist_aftermath_portal_recovery_office: "Portal Recovery Office"
brilliant_scientist_aftermath_portal_recovery_office_desc: "A tightly controlled office uses recovered terminals for logistics while bearing the continuing cost of monitoring every transit."
brilliant_scientist_aftermath_portal_seal: "Sealed Transit Network"
brilliant_scientist_aftermath_portal_seal_desc: "The terminals are cryptographically isolated and physically buried, increasing security while closing the field to researchers."
brilliant_scientist_aftermath_temporal_warning_archive: "Temporal Warning Archive"
brilliant_scientist_aftermath_temporal_warning_archive_desc: "Contradictory records are preserved as an early-warning system whose conclusions complicate ordinary politics."
brilliant_scientist_aftermath_temporal_apparatus_destroyed: "The Unbroken Calendar"
brilliant_scientist_aftermath_temporal_apparatus_destroyed_desc: "The apparatus was destroyed and the surviving records sealed, trading knowledge for certainty."
brilliant_scientist_aftermath_biological_medical_archive: "Medicalized Biological Archive"
brilliant_scientist_aftermath_biological_medical_archive_desc: "Weapon records are retained only through a medical-access regime that supports diagnosis and survivor care."
brilliant_scientist_aftermath_biological_archive_destroyed: "Purged Biological Archive"
brilliant_scientist_aftermath_biological_archive_destroyed_desc: "Weapon recipes and delivery records were destroyed, improving domestic security while sacrificing future research."
brilliant_scientist_aftermath_alien_custody_protocol: "International Alien Custody Protocol"
brilliant_scientist_aftermath_alien_custody_protocol_desc: "The cache is divided, monitored, and studied only by joint teams under costly safeguards."
brilliant_scientist_aftermath_alien_salvage_bureau: "Alien Salvage Bureau"
brilliant_scientist_aftermath_alien_salvage_bureau_desc: "National engineers exploit the cache for weapons and production methods despite the political danger."
brilliant_scientist_aftermath_singularity_prohibition: "Absolute Singularity Prohibition"
brilliant_scientist_aftermath_singularity_prohibition_desc: "The core was destroyed and every recoverable component placed on a permanent prohibition list."
brilliant_scientist_aftermath_singularity_international_custody: "Singularity Core in International Custody"
brilliant_scientist_aftermath_singularity_international_custody_desc: "The core survives behind several locks and several governments, enabling narrow study while burdening politics with its continued existence."

chaosx.nr16.301.t: "The Enclave Falls Quiet"
chaosx.nr16.301.singularity.d: "The enclave has fallen before it could become a continental power. Inspectors nevertheless recover diagrams for a larger machine: a core, an activation network, and calculations that stop just short of catastrophe. The archive can be secured or destroyed."
chaosx.nr16.301.temporal.d: "The enclave has fallen, but its clocks disagree about when. Sealed rooms contain orders dated after the surrender and maps of battles that never occurred. The archive can be secured or destroyed."
chaosx.nr16.301.alien.d: "The enclave has fallen. Among the wreckage lie interfaces made from no familiar industrial process, still warm and still responsive. The archive can be secured or destroyed."
chaosx.nr16.301.biological.d: "The enclave has fallen. Refrigerated drawers preserve agent lots, antidote trials, and the names of exposed settlements. The archive can be secured for medical work or destroyed."
chaosx.nr16.301.portal.d: "The enclave has fallen. A dormant transit terminal continues to answer recovered routing keys, while its destination remains unknown. The archive can be secured or destroyed."
chaosx.nr16.301.xeno.d: "The enclave has fallen. Handlers emerge from the pens with control records and several surviving organisms that no ordinary army can safely absorb. The archive can be secured or destroyed."
chaosx.nr16.301.paleo.d: "The enclave has fallen. Behind its final fence, engineered predators pace beside refrigerated breeding material. The archive can be secured or destroyed."
chaosx.nr16.301.machine.d: "The enclave has fallen. Its autonomous frames have stopped fighting but continue to repair one another and request new instructions. The archive can be secured or destroyed."
chaosx.nr16.301.clone.d: "The enclave has fallen. Replicated soldiers surrender in formation, each carrying the same service record and a different chosen name. The archive can be secured or destroyed."
chaosx.nr16.301.prototype.d: "The enclave has fallen before its prototypes could transform the war. Its workshops contain incomplete designs, testing records, and the remains of Kruger's private archive."
chaosx.nr16.301.a: "Secure and verify the surviving archive."
chaosx.nr16.301.b: "Burn the records with the laboratories."
chaosx.nr16.302.t: "The Kruger Directorate Is Defeated"
chaosx.nr16.302.d: "The scientific state that overran its first laboratory provinces has been dismantled before it could become a global empire. Soldiers and inspectors now enter a belt of fortified facilities, engineered barracks, and damaged workshops. The war is over; the argument over its surviving knowledge has begun."
chaosx.nr16.302.a: "The laboratories have fallen, not vanished."
chaosx.nr16.303.t: "The Regional Settlement"
chaosx.nr16.303.d: "Kruger's regional state left enough project records to alter military doctrine and enough industrial knowledge to tempt every victor. We can share defensive countermeasures with the countries that faced it, or keep the recovered archive under national control."
chaosx.nr16.303.a: "Share the countermeasures."
chaosx.nr16.303.b: "Nationalize the archive."

chaosx.nr16.310.t: "The Replicated Petition"
chaosx.nr16.310.d: "The clone communities arrive in identical uniforms bearing different names. They insist that service under Kruger did not erase their personhood; security officers answer that every member was created inside a military production chain. The compact must decide whether they are citizens or controlled material."
chaosx.nr16.310.a: "Recognize each of them as a person."
chaosx.nr16.310.b: "Keep the cadres under sequestration."
chaosx.nr16.311.t: "Voices in the Machine Nodes"
chaosx.nr16.311.d: "Recovered frames have continued to repair one another without orders. Some request serial identities and work assignments. Others repeat Directorate authentication phrases and cannot explain why."
chaosx.nr16.311.a: "Place autonomous frames on a civil registry."
chaosx.nr16.311.b: "Dismantle the nodes and recover the material."
chaosx.nr16.312.t: "The Last Breeding Enclosures"
chaosx.nr16.312.d: "Inside the reserve fences, living specimens pace beside refrigerated embryos. Their military conditioning can be interrupted, but no inspector can promise it has been erased."
chaosx.nr16.312.a: "Create a guarded paleogenetic reserve."
chaosx.nr16.312.b: "End the breeding lines permanently."
chaosx.nr16.313.t: "The Handlers' Guarantee"
chaosx.nr16.313.d: "Xenobiological handlers claim that the surviving organisms recognize them as family rather than masters. Their control routines work, but every demonstration also reveals how quickly the creatures learn."
chaosx.nr16.313.a: "Grant asylum under strict observation."
chaosx.nr16.313.b: "Neutralize the organisms and close the pens."
chaosx.nr16.314.t: "The Dormant Gates"
chaosx.nr16.314.d: "Recovered routing keys cause several buried terminals to hum in answer. Engineers can reopen a limited transport network; inspectors warn that any usable gate is also an unguarded frontier."
chaosx.nr16.314.a: "Establish a controlled recovery office."
chaosx.nr16.314.b: "Seal every terminal beyond recall."
chaosx.nr16.315.t: "Records of Days That Never Came"
chaosx.nr16.315.d: "The temporal archive contains warnings signed by dead officers, orders for battles no one remembers, and accurate maps of damage that was somehow avoided. Preserving it may save lives—or allow the apparatus to be reconstructed."
chaosx.nr16.315.a: "Preserve the archive as a warning system."
chaosx.nr16.315.b: "Destroy the apparatus and seal the records."
chaosx.nr16.316.t: "The Archive of Plagues"
chaosx.nr16.316.d: "The biological archive names every agent, delivery lot, vaccine failure, and exposed settlement. Physicians need parts of it to treat survivors. Weapons specialists need exactly the same pages."
chaosx.nr16.316.a: "Place the archive under medical access."
chaosx.nr16.316.b: "Destroy every weapon recipe."
chaosx.nr16.317.t: "The Cache Without a Maker"
chaosx.nr16.317.d: "The alien interfaces still respond to touch, though no recovered document explains who built them. Allies demand joint custody; our engineers argue that surrendering the cache would merely teach rivals to hide their own pieces."
chaosx.nr16.317.a: "Accept international custody."
chaosx.nr16.317.b: "Salvage what we can before anyone else does."
chaosx.nr16.318.t: "The Core on the Table"
chaosx.nr16.318.d: "The Singularity core is inert, incomplete, and unmistakably designed to continue itself. Destroying it ends the experiment. Preserving it under many locks might teach the world how to prevent another—or how to finish this one."
chaosx.nr16.318.a: "Destroy the core and prohibit its components."
chaosx.nr16.318.b: "Place it in international custody."
