clone_maturation_requirements_tt: "Maintain active cloning operations in the Kruger State, with clone-production technology and an owned and controlled clone growth site. The state must not have capitulated, and no other maturation cycle may be running."
clone_maturation_started_tt: "Mature §Y[?brilliant_scientist_krg_clone_maturation_paid_output|0] Clone Equipment§! over §Y[?constant:clone_maturation.duration_days|0] days§!. The assigned civilian factories remain committed until the cycle ends."
clone_maturation_completed_tt: "Add §Y[?brilliant_scientist_krg_clone_maturation_output|0] Clone Equipment§! to the stockpile. Each stored unit contributes §Y[?constant:clone_system.weekly_manpower_per_equipment|0] weekly manpower§! while it remains in reserve; equipment assigned to divisions no longer contributes. No divisions or immediate manpower are granted."
clone_maturation_cancel_trigger_tt: "Cloning operations cease, no controlled growth site remains, or the maturation order cannot continue."
clone_maturation_cancelled_tt: "Cancel maturation. Any complete recorded payment of Political Power, Support Equipment and fuel is returned once. The assigned civilian factories are released without producing clone equipment."
