l_english:
resources_found_cycle_selected_field: "Cycle Selected Field"
resources_found_cycle_selected_field_desc: "Move the management panel to the next owned and controlled resource field. Invalid, closed, and lost fields are skipped."
resources_found_cycle_selected_field_tt: "Selects another active field immediately. This action has no material cost or project time."
resources_found_refresh_evolution_clocks: "Refresh Field Assessments"
resources_found_refresh_evolution_clocks_desc: "Order every resource-field office to reassess when the next geological or subsurface development may surface."
resources_found_refresh_evolution_clocks_tt: "Rebuilds the assessment schedule for every eligible owned field. Existing valid assessments remain assigned to their current field."
resources_found_establish_national_authority: "Establish National Authority"
resources_found_establish_national_authority_desc: "Place §Y[?resources_found_selected_field.GetName]§! under direct state administration and reduce foreign leverage over its output."
resources_found_establish_national_authority_tt: "Starts an administrative project. On completion, the field adopts National Authority and Foreign Pressure falls."
resources_found_charter_domestic_operators: "Charter Domestic Operators"
resources_found_charter_domestic_operators_desc: "Entrust §Y[?resources_found_selected_field.GetName]§! to licensed domestic firms able to expand output quickly under national oversight."
resources_found_charter_domestic_operators_tt: "Starts an administrative project. On completion, Developed Yield rises while Foreign Pressure also increases."
resources_found_place_field_in_strategic_reserve: "Place Field in Strategic Reserve"
resources_found_place_field_in_strategic_reserve_desc: "Suspend extraction at §Y[?resources_found_selected_field.GetName]§! and preserve the site as a guarded national reserve."
resources_found_place_field_in_strategic_reserve_tt: "Starts a security project. Completion suspends the field, lowers active risk, and may force contract review."
resources_found_commission_geological_appraisal: "Commission Geological Appraisal"
resources_found_commission_geological_appraisal_desc: "Survey the deposits and access routes beneath §Y[?resources_found_selected_field.GetName]§! before committing to deeper works."
resources_found_commission_geological_appraisal_tt: "Starts a survey project. Completion improves Developed Yield, maps closure access, and produces a formal appraisal."
resources_found_drill_deeper_test: "Drill a Deeper Test"
resources_found_drill_deeper_test_desc: "Drive a controlled test bore below the known seam in search of another recoverable deposit."
resources_found_drill_deeper_test_tt: "Starts a hazardous survey project. Completion can add another strategic resource, but increases Excavation Depth."
resources_found_map_surrounding_basin: "Map the Surrounding Basin"
resources_found_map_surrounding_basin_desc: "Chart the basin, transport approaches, and closure routes around §Y[?resources_found_selected_field.GetName]§!."
resources_found_map_surrounding_basin_tt: "Starts a survey project. Completion maps the corridor and the access network needed for later containment."
resources_found_open_primary_works: "Open the Primary Works"
resources_found_open_primary_works_desc: "Commit construction crews and machinery to turn the surveyed field into a sustained industrial operation."
resources_found_open_primary_works_tt: "Starts a major industrial project. Completion raises Developed Yield and Excavation Depth and opens full operations."
resources_found_extend_rail_road_corridor: "Extend the Transport Corridor"
resources_found_extend_rail_road_corridor_desc: "Connect §Y[?resources_found_selected_field.GetName]§! to the national road and rail network before its traffic overwhelms local routes."
resources_found_extend_rail_road_corridor_tt: "Starts a transport project. Completion adds infrastructure and secures the field corridor."
resources_found_install_heavy_machinery: "Install Heavy Machinery"
resources_found_install_heavy_machinery_desc: "Replace improvised workings with heavy extraction plant capable of reaching richer, more dangerous layers."
resources_found_install_heavy_machinery_tt: "Starts an industrial project. Completion raises Developed Yield and Excavation Depth at a cost to Workforce Safety."
resources_found_build_local_processing: "Build Local Processing"
resources_found_build_local_processing_desc: "Process part of the field's output beside the workings instead of hauling every raw load across the country."
resources_found_build_local_processing_tt: "Starts an industrial project. Completion adds civilian industry and improves the field's industrial output."
resources_found_expand_worker_settlement: "Expand the Worker Settlement"
resources_found_expand_worker_settlement_desc: "Build housing, sanitation, and guarded services for the population supporting §Y[?resources_found_selected_field.GetName]§!."
resources_found_expand_worker_settlement_tt: "Starts a labor project. Completion raises Workforce Safety and secures the field population for evacuation planning."
resources_found_build_integrated_processing_corridor: "Build an Integrated Processing Corridor"
resources_found_build_integrated_processing_corridor_desc: "Bind the compound field's roads, railheads, and processing plants into one high-capacity industrial corridor."
resources_found_build_integrated_processing_corridor_tt: "Starts a major transport project. Completion adds infrastructure and industry and unlocks the compound-field payoff."
resources_found_unify_compound_authority: "Unify Compound Authority"
resources_found_unify_compound_authority_desc: "Place every deposit in the compound field under one command structure and one closure plan."
resources_found_unify_compound_authority_tt: "Starts an administrative project. Completion lowers Foreign Pressure and replaces divided concession management."
resources_found_split_resource_concessions: "Split Resource Concessions"
resources_found_split_resource_concessions_desc: "Divide access among several partners so no single foreign power controls the compound field."
resources_found_split_resource_concessions_tt: "Starts a diplomatic project. Completion diversifies access but increases the pressure created by competing interests."
resources_found_recruit_regional_labor: "Recruit Regional Labor"
resources_found_recruit_regional_labor_desc: "Draw workers from the surrounding region to accelerate development at §Y[?resources_found_selected_field.GetName]§!."
resources_found_recruit_regional_labor_tt: "Starts a labor project. Completion raises Developed Yield but reduces Workforce Safety."
resources_found_shorten_shifts_rotate_crews: "Shorten Shifts and Rotate Crews"
resources_found_shorten_shifts_rotate_crews_desc: "Reduce exposure underground by shortening shifts and rotating experienced crews through the most dangerous workings."
resources_found_shorten_shifts_rotate_crews_tt: "Starts a labor project. Completion sacrifices some Developed Yield for a substantial Workforce Safety gain."
resources_found_reinforce_shafts_ventilation: "Reinforce Shafts and Ventilation"
resources_found_reinforce_shafts_ventilation_desc: "Shore the deep galleries and install forced ventilation before further extraction destabilizes the workings."
resources_found_reinforce_shafts_ventilation_tt: "Starts an industrial safety project. Completion raises Workforce Safety and prepares the engineering required for a full seal."
resources_found_establish_field_hospital: "Establish a Field Hospital"
resources_found_establish_field_hospital_desc: "Build a staffed hospital and inspection office close enough to detect injuries and unexplained sickness early."
resources_found_establish_field_hospital_tt: "Starts a labor and medical project. Completion raises Workforce Safety and establishes continuous medical inspection."
resources_found_compensate_affected_families: "Compensate Affected Families"
resources_found_compensate_affected_families_desc: "Recognize the field's casualties, support their families, and restore confidence in the administration."
resources_found_compensate_affected_families_tt: "Starts an administrative project. Completion ends casualty concealment and reduces Foreign Pressure."
resources_found_conceal_casualty_reports: "Conceal Casualty Reports"
resources_found_conceal_casualty_reports_desc: "Suppress reports from the workings to preserve production and prevent outsiders from exploiting the deaths."
resources_found_conceal_casualty_reports_tt: "Starts a security project. Completion hides the casualties, but marks the field as using coercive labor practices."
resources_found_regulated_output: "Adopt Regulated Output"
resources_found_regulated_output_desc: "Return §Y[?resources_found_selected_field.GetName]§! to a controlled extraction rate that balances production and safety."
resources_found_regulated_output_tt: "Starts an administrative project. Completion ends maximum shifts and wartime requisition and restores normal operations."
resources_found_maximum_shifts: "Order Maximum Shifts"
resources_found_maximum_shifts_desc: "Run the field without pause to force a rapid increase in output despite exhaustion and subsurface instability."
resources_found_maximum_shifts_tt: "Starts an intensive labor project. Completion raises yield, depth, and disturbance while sharply reducing safety."
resources_found_wartime_requisition: "Impose Wartime Requisition"
resources_found_wartime_requisition_desc: "Place the field under military allocation and divert its output to the war effort."
resources_found_wartime_requisition_tt: "Starts a security project. Completion raises Developed Yield and Foreign Pressure and records military exploitation."
resources_found_emergency_suspension: "Order an Emergency Suspension"
resources_found_emergency_suspension_desc: "Stop extraction at §Y[?resources_found_selected_field.GetName]§! when safety, operating conditions, or foreign pressure make continued work untenable."
resources_found_emergency_suspension_tt: "Starts a security project. Completion suspends the field and lowers accumulated operating risk. Active contracts may be breached."
resources_found_reactivate_suspended_field: "Reactivate the Suspended Field"
resources_found_reactivate_suspended_field_desc: "Return crews and equipment to §Y[?resources_found_selected_field.GetName]§! after the conditions for safe operation have been restored."
resources_found_reactivate_suspended_field_tt: "Pays a dynamically scaled industrial commitment and resumes the field immediately if every requirement still holds."
resources_found_field_project_mission: "Field Project Underway"
resources_found_field_project_mission_desc: "A field administration, development, labor, or extraction project is consuming national capacity at the selected site."
resources_found_field_project_mission_tt: "The project completes at its calculated deadline. Loss of the field, permanent closure, or the destruction of its administration cancels it."
resources_found_grant_foreign_concession: "Grant a Concession to [FROM.GetNameDef]"
resources_found_grant_foreign_concession_desc: "Offer [FROM.GetNameDef] development rights and resource access at §Y[?resources_found_selected_field.GetName]§!."
resources_found_grant_foreign_concession_tt: "Starts the exact-duration diplomatic project shown above. Completion grants resource rights, establishes a foreign concession, and begins a £clock_texticon §Y[?resources_found_contract_term_preview_days|0]-day§! contract term."
resources_found_invite_strategic_bids: "Invite Strategic Bids"
resources_found_invite_strategic_bids_desc: "Open the field to a bounded shortlist of foreign buyers and development partners."
resources_found_invite_strategic_bids_tt: "Starts a diplomatic project. Completion creates foreign interest, raises attention around the field, and selects one valid actor."
resources_found_sign_long_term_export_contract: "Sign an Export Contract with [FROM.GetNameDef]"
resources_found_sign_long_term_export_contract_desc: "Guarantee [FROM.GetNameDef] long-term access to output from §Y[?resources_found_selected_field.GetName]§!."
resources_found_sign_long_term_export_contract_tt: "Starts the exact-duration diplomatic project shown above. Completion grants resource rights and activates a £clock_texticon §Y[?resources_found_contract_term_preview_days|0]-day§! contract term."
resources_found_balance_competing_buyers: "Balance Competing Buyers"
resources_found_balance_competing_buyers_desc: "Divide export access among several interested states before any one buyer can dominate the field."
resources_found_balance_competing_buyers_tt: "Starts a diplomatic project. Completion diversifies access and lowers immediate Foreign Pressure."
resources_found_reserve_output_domestic: "Reserve Output for Domestic Use"
resources_found_reserve_output_domestic_desc: "Suspend export priority and redirect the selected field's production to the national war economy."
resources_found_reserve_output_domestic_tt: "Starts an administrative project. Completion reserves output at home and breaches any active foreign contract."
resources_found_renegotiate_concession: "Renegotiate the Concession"
resources_found_renegotiate_concession_desc: "Use the contract review to demand updated terms from the field's surviving partner."
resources_found_renegotiate_concession_tt: "Starts a diplomatic project. Completion settles the review and restores valid resource rights to the existing partner."
resources_found_concession_surge: "Authorize a Concession Surge"
resources_found_concession_surge_desc: "Allow the foreign operator to rush machinery and crews into the field for a sharp short-term expansion."
resources_found_concession_surge_tt: "Starts an industrial project. Completion raises yield and depth while increasing Foreign Pressure."
resources_found_nationalize_field: "Nationalize the Field"
resources_found_nationalize_field_desc: "Remove foreign resource rights and bring §Y[?resources_found_selected_field.GetName]§! under direct national control."
resources_found_nationalize_field_tt: "Starts a security project. Completion ends the concession, raises Foreign Pressure, and creates an unresolved compensation claim."
resources_found_settle_compensation: "Settle the Compensation Claim"
resources_found_settle_compensation_desc: "Pay the field's outstanding claim and close the dispute created by expropriation or transfer."
resources_found_settle_compensation_tt: "Starts a diplomatic project. Completion settles the claim, lowers Foreign Pressure, and clears a closure obstacle. If this ends a Crisis-level armed field dispute, a 180-day settlement-stability period begins."
resources_found_organize_field_guards: "Organize Field Guards"
resources_found_organize_field_guards_desc: "Raise a permanent guard force to protect the workings, stores, and transport approaches from foreign interference."
resources_found_organize_field_guards_tt: "Starts a security project. Completion establishes owner military readiness and lowers Foreign Pressure."
resources_found_counter_foreign_survey_teams: "Counter Foreign Survey Teams"
resources_found_counter_foreign_survey_teams_desc: "Track, expose, and expel unauthorized teams mapping the field and its access routes."
resources_found_counter_foreign_survey_teams_tt: "Starts a security project. Completion records the counter-survey and relieves Foreign Pressure."
resources_found_break_smuggling_network: "Break the Smuggling Network"
resources_found_break_smuggling_network_desc: "Raid the routes, brokers, and depots diverting resource output beyond national control."
resources_found_break_smuggling_network_tt: "Starts a security project. Completion dismantles the network and produces a settlement event."
resources_found_prepare_controlled_demolition: "Prepare Controlled Demolition"
resources_found_prepare_controlled_demolition_desc: "Place denial charges at critical workings so an invader cannot take the field intact."
resources_found_prepare_controlled_demolition_tt: "Starts a containment project. Completion prepares resource denial but reduces Workforce Safety."
resources_found_review_transferred_field: "Review the Transferred Field"
resources_found_review_transferred_field_desc: "Audit inherited contracts and claims before the new owner resumes normal administration."
resources_found_review_transferred_field_tt: "Starts an administrative project. Existing resource rights are removed while the transfer review is pending."
resources_found_complete_contract_review: "Complete the Contract Review"
resources_found_complete_contract_review_desc: "Confirm the surviving partner and restore a valid contract after expiry, occupation, or ownership change."
resources_found_complete_contract_review_tt: "Starts a diplomatic project. Completion clears the review and regrants resource rights only to a still-valid partner."
resources_found_name_border_claimant: "Recognize [FROM.GetNameDef] as the Claimant"
resources_found_name_border_claimant_desc: "Record [FROM.GetNameDef]'s adjacent claim so the dispute can advance through surveys, patrols, arbitration, or force."
resources_found_name_border_claimant_tt: "Pays a dynamically scaled diplomatic commitment, stores the exact claimant and border states, and opens the staged crisis."
resources_found_invite_border_arbitration: "Invite Border Arbitration"
resources_found_invite_border_arbitration_desc: "Pause the confrontation and submit the field claim to a negotiated settlement."
resources_found_invite_border_arbitration_tt: "Starts a diplomatic project. Early arbitration opens negotiations. After a Crisis-level armed or frontier confrontation, completion records an agreement and begins a 180-day settlement-stability period."
resources_found_reinforce_field_administration: "Reinforce Field Administration"
resources_found_reinforce_field_administration_desc: "Move officials, guards, and supplies into the disputed field to demonstrate practical control."
resources_found_reinforce_field_administration_tt: "Starts a security project. Completion strengthens owner leverage but raises border pressure."
resources_found_secure_frontier_corridor: "Secure the Frontier Corridor"
resources_found_secure_frontier_corridor_desc: "Commit supplied forces to both named border states and keep the field's corridor under control."
resources_found_secure_frontier_corridor_tt: "Pays the security commitment and starts an active-objective mission across the highlighted owner and claimant states for the exact duration shown above."
resources_found_create_international_commission: "Create an International Commission"
resources_found_create_international_commission_desc: "Place the disputed field under inspected quotas and a demilitarized international settlement."
resources_found_create_international_commission_tt: "Starts a diplomatic project. Completion activates the commission, dismantles forts, demilitarizes the field, and lowers Foreign Pressure. A qualifying severe border dispute then enters a 180-day stability period."
resources_found_negotiate_demilitarized_field: "Negotiate a Demilitarized Field"
resources_found_negotiate_demilitarized_field_desc: "Formalize a troop-free settlement around §Y[?resources_found_selected_field.GetName]§!."
resources_found_negotiate_demilitarized_field_tt: "Pays the diplomatic commitment, removes land and coastal forts, demilitarizes the field, and brings the settlement before both parties. A qualifying severe border dispute then enters a 180-day stability period."
resources_found_observe_commission_troop_limits: "Observe Commission Troop Limits"
resources_found_observe_commission_troop_limits_desc: "Keep the locked field demilitarized, fort-free, and below the agreed division limit for £clock_texticon §Y[?resources_found_commission_observation_preview_days|0] days§!."
resources_found_observe_commission_troop_limits_tt: "Starts a £clock_texticon §Y[?resources_found_commission_observation_preview_days|0]-day§! compliance mission bound to the current field. Violating the DMZ, fort, or troop conditions triggers the commission crisis."
resources_found_restore_commission_compliance: "Restore Commission Compliance"
resources_found_restore_commission_compliance_desc: "Withdraw excess troops, remove forbidden works, and accept renewed inspection before the commission dissolves."
resources_found_restore_commission_compliance_tt: "Starts a diplomatic project. Completion restores demilitarization and active commission inspections."
resources_found_dissolve_international_commission: "Dissolve the International Commission"
resources_found_dissolve_international_commission_desc: "End a failed commission and return the field to ordinary national administration."
resources_found_dissolve_international_commission_tt: "Pays the diplomatic commitment, ends demilitarization, and presents the commission's final dissolution terms."
resources_found_start_limited_border_war: "Start a Limited Border War"
resources_found_start_limited_border_war_desc: "Contest the exact owner and claimant states without converting the clash into a normal war."
resources_found_start_limited_border_war_tt: "Pays the containment commitment immediately and starts a limited border conflict with no automatic state transfer. The conflict must conclude within £clock_texticon §Y[?resources_found_border_war_limit_preview_days|0] days§!."
resources_found_escalate_limited_border_war: "Escalate the Limited Border War"
resources_found_escalate_limited_border_war_desc: "Widen the field clash and commit stronger forces without abandoning its limited-war rules."
resources_found_escalate_limited_border_war_tt: "Pays an additional containment commitment and increases both sides' border-war combat parameters."
resources_found_cancel_limited_border_war: "Cancel the Limited Border War"
resources_found_cancel_limited_border_war_desc: "Order a halt to the field clash and force the dispute back to settlement."
resources_found_cancel_limited_border_war_tt: "Ends the limited border conflict and returns the field dispute to a stalemate settlement."
resources_found_foreign_press_field: "Apply Commercial Pressure"
resources_found_foreign_press_field_desc: "Use our buyer position to increase leverage over the foreign field and its owner."
resources_found_foreign_press_field_tt: "Pays a diplomatic commitment and raises Foreign Pressure at the exact field stored for this actor."
resources_found_foreign_open_smuggling: "Open a Smuggling Route"
resources_found_foreign_open_smuggling_desc: "Finance brokers and hidden routes to draw output from the foreign field outside its owner's contracts."
resources_found_foreign_open_smuggling_tt: "Pays a security commitment and creates a sponsored smuggling network at the stored foreign field."
resources_found_foreign_sabotage: "Sabotage the Foreign Field"
resources_found_foreign_sabotage_desc: "Damage the workings and undermine safety to force the owner back to the negotiating table."
resources_found_foreign_sabotage_tt: "Pays a security commitment, reduces the foreign field's yield and safety, and alerts its owner."
resources_found_foreign_withdraw_interest: "Withdraw Field Interest"
resources_found_foreign_withdraw_interest_desc: "End our active commercial campaign and remove our offers from the owner's shortlist."
resources_found_foreign_withdraw_interest_tt: "Clears this country's bounded field target, offer flags, and stored commercial interest immediately."
resources_found_trade_project_mission: "Commercial Project Underway"
resources_found_trade_project_mission_desc: "A contract, security, border, or commission project is consuming national capacity at the selected field."
resources_found_trade_project_mission_tt: "The project completes at its calculated deadline. Loss, closure, invalid partners, or the end of field administration cancels it."
resources_found_contract_term_mission: "Export Contract Review Cycle"
resources_found_contract_term_mission_desc: "The selected field must remain owned, controlled, open, and connected to its living contract partner until review."
resources_found_contract_term_mission_tt: "Successful expiry records a fulfilled term and opens review. Occupation, suspension, closure, transfer, or partner loss breaches it."
resources_found_frontier_corridor_mission: "Secure the Frontier Corridor"
resources_found_frontier_corridor_mission_desc: "Hold the named owner state, maintain the claimant-side objective, and keep supplied forces committed to the dispute."
resources_found_frontier_corridor_mission_tt: "Meeting every active objective grants owner leverage. Losing the field, claimant, route, or required forces produces the failure settlement."
resources_found_commission_observation_mission: "Commission Inspection Period"
resources_found_commission_observation_mission_desc: "Keep the field demilitarized, fort-free, and below the commission troop ceiling."
resources_found_commission_observation_mission_tt: "Completion confirms stable compliance. A violation fires the commission crisis and records the broken condition."
resources_found_dispute_settlement_stability_mission: "Prove the Field Settlement"
resources_found_dispute_settlement_stability_mission_desc: "Retain the exact field and keep its negotiated agreement functioning with the original claimant for 180 days."
resources_found_dispute_settlement_stability_mission_tt: "Transfer, occupation, renewed confrontation, claimant annexation, border war, suspension, closure, public breach, or commission collapse invalidates this settlement."
resources_found_border_war_limit_mission: "Border War Time Limit"
resources_found_border_war_limit_mission_desc: "Resolve the limited clash before its settlement window closes."
resources_found_border_war_limit_mission_tt: "If the border war is still active when time expires, it is cancelled and the stalemate settlement is invoked."
resources_found_test_air_water: "Test the Air and Water"
resources_found_test_air_water_desc: "Sample the workings after the sickness reports and rule out ordinary contamination."
resources_found_test_air_water_tt: "Starts a containment survey. Completion reveals Subsurface Disturbance and advances the incident investigation."
resources_found_evacuate_lower_workings: "Evacuate the Lower Workings"
resources_found_evacuate_lower_workings_desc: "Pull crews out of the deepest galleries before the unexplained activity traps them below."
resources_found_evacuate_lower_workings_tt: "Starts a containment project. Completion lowers disturbance and yield and places the deepest workings under restriction."
resources_found_armed_underground_sweep: "Conduct an Armed Underground Sweep"
resources_found_armed_underground_sweep_desc: "Send supplied troops with infantry and support equipment into the attacked galleries."
resources_found_armed_underground_sweep_tt: "Starts a containment operation. Completion secures physical evidence, advances countermeasure research, and lowers disturbance."
resources_found_scientific_military_survey: "Launch a Scientific-Military Survey"
resources_found_scientific_military_survey_desc: "Combine specialists and armed escorts to study the evidence and design a viable countermeasure."
resources_found_scientific_military_survey_tt: "Starts a containment project. Completion advances countermeasure research and full-seal engineering."
resources_found_stabilize_restricted_workings: "Stabilize the Restricted Workings"
resources_found_stabilize_restricted_workings_desc: "Shore the sealed galleries and establish a controlled boundary beneath the active field."
resources_found_stabilize_restricted_workings_tt: "Starts a containment project. Completion stabilizes the restricted field, lowers Subsurface Disturbance, and ends the current incident sequence."
resources_found_reinforce_perimeter: "Reinforce the Perimeter"
resources_found_reinforce_perimeter_desc: "Fortify the surface cordon around §Y[?resources_found_selected_field.GetName]§! before another pack reaches open ground."
resources_found_reinforce_perimeter_tt: "Starts a containment project. Completion strengthens the perimeter and lowers Breach Pressure."
resources_found_hunt_surface_packs: "Hunt the Surface Packs"
resources_found_hunt_surface_packs_desc: "Commit supplied hard-attack capable forces to destroy the creatures operating beyond the workings."
resources_found_hunt_surface_packs_tt: "Starts a combat containment project. Success lowers Breach Pressure. Inadequate preparation produces the failed-hunt event."
resources_found_clear_urban_district: "Clear the Urban District"
resources_found_clear_urban_district_desc: "Drive the intruders out of the occupied district before they spread through the state center."
resources_found_clear_urban_district_tt: "Starts an urban containment project. Success clears the intrusion and lowers Breach Pressure. Failure produces severe losses."
resources_found_evacuate_field_settlements: "Evacuate the Field Settlements"
resources_found_evacuate_field_settlements_desc: "Move exposed workers and families along the secured corridor before surface attacks cut the route."
resources_found_evacuate_field_settlements_tt: "Starts a transport-heavy evacuation. Success secures the field population. Loss of control or the corridor causes an evacuation failure."
resources_found_evacuate_state_center: "Evacuate the State Center"
resources_found_evacuate_state_center_desc: "Move the threatened urban population through the field corridor while there is still time."
resources_found_evacuate_state_center_tt: "Starts a major evacuation. Success secures the population. Loss of the state or corridor triggers the failed-evacuation event."
resources_found_request_foreign_hard_attack_aid: "Request Foreign Hard-Attack Aid"
resources_found_request_foreign_hard_attack_aid_desc: "Ask an eligible partner for anti-tank weapons and technical support against the subsurface threat."
resources_found_request_foreign_hard_attack_aid_tt: "Starts a containment diplomacy project. Completion adds anti-tank equipment and advances countermeasure research."
resources_found_seal_access_network: "Seal One Access Network"
resources_found_seal_access_network_desc: "Collapse and reinforce one mapped route linking the deep workings to the surface."
resources_found_seal_access_network_tt: "Starts an engineering project. Completion lowers Breach Pressure and Excavation Depth and prepares full-seal engineering."
resources_found_begin_partial_closure_decision: "Begin a Partial Closure"
resources_found_begin_partial_closure_decision_desc: "Abandon the deepest workings and sacrifice part of the field to reduce the immediate danger."
resources_found_begin_partial_closure_decision_tt: "Starts a long containment project. Completion reduces the field through a partial seal. Deeper workings remain active until a full seal is completed."
resources_found_begin_full_sealing: "Begin Full Sealing"
resources_found_begin_full_sealing_desc: "Suspend extraction, secure civilians and the surface, and prepare to remove every registered discovery deposit from the state."
resources_found_begin_full_sealing_tt: "Starts a major closure project. Success permanently closes the selected field and prevents an emergence from it. Any failed requirement leads to a failed sealing attempt."
resources_found_last_emergency_seal: "Attempt the Last Emergency Seal"
resources_found_last_emergency_seal_desc: "Commit every remaining engineer, train, truck, weapon, and held route to close the field before the final breach."
resources_found_last_emergency_seal_tt: "Starts a short emergency closure project. It succeeds only if every full-seal requirement still holds at completion."
resources_found_close_ordinary_field_exactly: "Close the Ordinary Field"
resources_found_close_ordinary_field_exactly_desc: "Dismantle the safe field and reverse its complete discovery ledger while the workings remain stable."
resources_found_close_ordinary_field_exactly_tt: "Starts a closure project. Completion removes only the registered discovery deposits and permanently closes the field."
resources_found_containment_project_mission: "Containment Project Underway"
resources_found_containment_project_mission_desc: "A subsurface investigation, evacuation, hunt, or closure project is consuming national capacity at the selected field."
resources_found_containment_project_mission_tt: "The project completes at its calculated deadline. Loss of ownership, control, the field, or required closure conditions can cancel or fail it."
resources_found_cave_mark_rich_state: "Mark a Rich Resource State"
resources_found_cave_mark_rich_state_desc: "Direct the brood network toward the richest reachable human-held resource state."
resources_found_cave_mark_rich_state_tt: "Starts an Oth-Kesh command project. Completion marks the best reachable resource target for strategic priority."
resources_found_cave_activate_resource_anchor: "Activate a Resource Anchor"
resources_found_cave_activate_resource_anchor_desc: "Digest a continuously held resource state into a new feeding and brood-capacity anchor."
resources_found_cave_activate_resource_anchor_tt: "Starts an anchor project in the targeted state. Human recapture interrupts activation before the deadline."
resources_found_cave_accelerate_critical_anchor: "Accelerate the Critical Anchor"
resources_found_cave_accelerate_critical_anchor_desc: "Drive the broods harder to complete an activating anchor before defenders can retake it."
resources_found_cave_accelerate_critical_anchor_tt: "Starts a short Oth-Kesh project. Completion shortens the exact anchor deadline and imposes an acceleration cooldown."
resources_found_cave_guard_feeding_chamber: "Guard the Feeding Chamber"
resources_found_cave_guard_feeding_chamber_desc: "Commit brood strength to defend a mature anchor and its recovery chambers."
resources_found_cave_guard_feeding_chamber_tt: "Starts a defensive project at the targeted anchor. Completion adds a fort level and the fortified-anchor modifier."
resources_found_cave_choose_stone_spawn: "Favor Stone Phalanx Broods"
resources_found_cave_choose_stone_spawn_desc: "Set the protected spawn preference to heavy Stone Phalanx formations."
resources_found_cave_choose_stone_spawn_tt: "Sets Stone Phalanx as the next legal brood preference. Spawning still requires available capacity and a valid emergence state."
resources_found_cave_choose_burrow_spawn: "Favor Burrow War Broods"
resources_found_cave_choose_burrow_spawn_desc: "Set the protected spawn preference to infiltration-focused Burrow War formations."
resources_found_cave_choose_burrow_spawn_tt: "Sets Burrow Columns as the next legal brood preference. Spawning still requires available capacity and a valid emergence state."
resources_found_cave_choose_scree_spawn: "Favor Scree Tide Broods"
resources_found_cave_choose_scree_spawn_desc: "Set the protected spawn preference to fast Scree Tide raiders."
resources_found_cave_choose_scree_spawn_tt: "Sets Scree Packs as the next legal brood preference. Spawning still requires available capacity and a valid emergence state."
resources_found_cave_replace_origin_brood: "Replace an Origin Brood"
resources_found_cave_replace_origin_brood_desc: "Regrow one destroyed protected formation while the origin remains held and fed."
resources_found_cave_replace_origin_brood_tt: "Starts a brood project. Completion spawns one war brood at the origin and restores one protected allocation."
resources_found_cave_consolidate_unfed_broods: "Consolidate Unfed Broods"
resources_found_cave_consolidate_unfed_broods_desc: "Cannibalize strength across over-capacity formations to reduce the weakness caused by an unfed host."
resources_found_cave_consolidate_unfed_broods_tt: "Starts a crisis project. Completion damages controlled-state formations but refreshes the Host's unfed status."
resources_found_cave_deepen_tunnel_link: "Deepen an Anchor Link"
resources_found_cave_deepen_tunnel_link_desc: "Excavate a bounded tunnel link between a viable pair of mature resource anchors."
resources_found_cave_deepen_tunnel_link_tt: "Starts a long Oth-Kesh infrastructure project. Completion marks up to two mature anchors as linked endpoints, which future automatic broods prioritize as emergence sites."
resources_found_cave_prepare_phalanx_assault: "Prepare a Phalanx Assault"
resources_found_cave_prepare_phalanx_assault_desc: "Mass Stone Phalanx broods against the strongest reachable surface position."
resources_found_cave_prepare_phalanx_assault_tt: "Starts a doctrine project. Completion opens a timed assault window and marks a strongpoint target."
resources_found_cave_prepare_burrow_approach: "Prepare a Burrow Approach"
resources_found_cave_prepare_burrow_approach_desc: "Excavate from a functioning anchor toward a defended enemy capital, supply hub, or heavily fortified state."
resources_found_cave_prepare_burrow_approach_tt: "When the works finish, the exact defended objective is marked for §Y90 days§!. Capture it before the underground approach collapses."
resources_found_cave_release_raiding_broods: "Release Raiding Broods"
resources_found_cave_release_raiding_broods_desc: "Spawn a Scree Pack and, after the Hills Begin to Move capstone, open a short window for rapid territorial exploitation once three such formations can be sustained."
resources_found_cave_release_raiding_broods_tt: "Completion creates one Scree Pack. After §YThe Hills Begin to Move§!, a qualifying §Y180-day§! surge begins only with at least §Y3 active Scree Packs§!, legal brood capacity, and an open continental campaign."
resources_found_cave_convert_industrial_district: "Convert an Industrial District"
resources_found_cave_convert_industrial_district_desc: "Digest secure captured industry into brood-supporting chambers and adaptation works."
resources_found_cave_convert_industrial_district_tt: "Starts an Oth-Kesh industry project. Completion converts a secure district and records the industrial adaptation."
resources_found_cave_refresh_brood_queue: "Refresh the Brood Queue"
resources_found_cave_refresh_brood_queue_desc: "Recalculate anchor capacity and fill one legal vacancy from the current spawn preference."
resources_found_cave_refresh_brood_queue_tt: "Starts a short brood project. Completion recalculates capacity and spawns at most one valid formation."
resources_found_cave_fortify_origin: "Fortify the Origin"
resources_found_cave_fortify_origin_desc: "Reinforce the first breach state as the protected heart of the Oth-Kesh Host."
resources_found_cave_fortify_origin_tt: "Starts a defensive project. Completion applies the origin fortification and records prepared origin defense."
resources_found_cave_refresh_continent_objectives: "Refresh Continent Objectives"
resources_found_cave_refresh_continent_objectives_desc: "Mark the remaining eligible states on the origin continent and update conquest progress."
resources_found_cave_refresh_continent_objectives_tt: "Starts a command project. Completion refreshes bounded continent objectives and the current progress ledger."
resources_found_cave_begin_continent_verification: "Begin Continent Verification"
resources_found_cave_begin_continent_verification_desc: "Hold every eligible state on the origin continent through the verification period."
resources_found_cave_begin_continent_verification_tt: "Begins the continent objective once every eligible state is owned and controlled by the Host."
resources_found_cave_prepare_world_end_ruptures: "Prepare Cross-Continent Ruptures"
resources_found_cave_prepare_world_end_ruptures_desc: "Survey resource-rich footholds beyond the consumed continent for the Host's global expansion."
resources_found_cave_prepare_world_end_ruptures_tt: "Starts a distant-rupture project. Completion prepares a bounded set of resource-rich footholds for the Host's next continental campaign. The footholds remain dormant until the present continent is secured."
resources_found_burrow_objective_window_mission: "The Road Has a Floor"
resources_found_burrow_objective_window_mission_desc: "The approach chambers remain open beneath the marked defended objective. If the Host does not take the state before the galleries fail, the route is lost."
resources_found_burrow_objective_window_mission_tt: "Capture the exact marked capital, supply hub, or heavily fortified state while this §Y90-day§! mission remains active."
resources_found_cave_project_mission: "Oth-Kesh Operation Underway"
resources_found_cave_project_mission_desc: "A brood, anchor, doctrine, continent, or rupture project is consuming the Host's command capacity."
resources_found_cave_project_mission_tt: "The operation completes at its calculated deadline. Invalid targets, lost anchors, loss of the origin, or the opening of the World Below cancel it."
resources_found_issue_emergency_anti_armor_contracts: "Issue Emergency Anti-Armor Contracts"
resources_found_issue_emergency_anti_armor_contracts_desc: "Redirect factories and army experience toward weapons capable of piercing Oth-Kesh formations."
resources_found_issue_emergency_anti_armor_contracts_tt: "Starts a national counter-invasion project. Completion grants an anti-tank research bonus and the Emergency Anti-Armor Contracts idea."
resources_found_deny_resource_state: "Deny a Threatened Resource State"
resources_found_deny_resource_state_desc: "Prepare controlled demolition in a resource state likely to fall to the Oth-Kesh."
resources_found_deny_resource_state_tt: "Starts a targeted denial project. If the state is later captured, the prepared penalty delays its anchor activation."
resources_found_liberate_activating_anchor: "Retake the Activating Anchor"
resources_found_liberate_activating_anchor_desc: "Commit supplied divisions to recapture the targeted resource state before its feeding chamber matures."
resources_found_liberate_activating_anchor_tt: "Starts the exact-duration preparation shown above, followed by a £clock_texticon §Y[?resources_found_anchor_recapture_preview_days|0]-day§! recapture mission bound to the named state."
resources_found_clear_mature_anchor: "Clear a Mature Anchor"
resources_found_clear_mature_anchor_desc: "Purge the residual chambers and restore control after retaking a mature Oth-Kesh resource anchor."
resources_found_clear_mature_anchor_tt: "Starts a targeted cleanup project. Completion removes the mature anchor contribution and its surviving cave modifiers."
resources_found_share_hard_attack_intelligence: "Share Hard-Attack Intelligence"
resources_found_share_hard_attack_intelligence_desc: "Distribute battlefield analysis of Oth-Kesh armor to countries organizing the common defense."
resources_found_share_hard_attack_intelligence_tt: "Starts a national cooperation project. Completion grants a one-use anti-tank research bonus and threat-cooperation support."
resources_found_open_anti_cave_evacuation_corridor: "Open a Regional Evacuation Corridor"
resources_found_open_anti_cave_evacuation_corridor_desc: "Commit trains, trucks, and security forces to move civilians away from the advancing Oth-Kesh front."
resources_found_open_anti_cave_evacuation_corridor_tt: "Starts a transport-heavy counter-invasion project. Completion opens the corridor and records active evacuation support."
resources_found_form_threat_cooperation: "Form a Threat Cooperation Command"
resources_found_form_threat_cooperation_desc: "Coordinate doctrine, intelligence, and procurement among states resisting the Oth-Kesh."
resources_found_form_threat_cooperation_tt: "Starts a national cooperation project. Completion activates the shared threat-cooperation idea."
resources_found_send_anti_cave_aid: "Send Hard-Attack Aid to [FROM.GetNameDef]"
resources_found_send_anti_cave_aid_desc: "Transfer anti-tank and support equipment to [FROM.GetNameDef]'s active defense against the Oth-Kesh."
resources_found_send_anti_cave_aid_tt: "Starts a targeted aid project. Completion equips the recipient and records this country as an aid contributor."
resources_found_join_reconstruction_compact: "Fulfill the Reconstruction Commitment"
resources_found_join_reconstruction_compact_desc: "Fund the cleanup, shared records, and rapid-aid institutions promised by our choice in the Reconstruction Compact negotiations."
resources_found_join_reconstruction_compact_tt: "Starts the final reconstruction project. Completion grants membership, or membership and leadership for a qualifying leadership commitment, and closes the compact negotiations."
resources_found_anti_cave_project_mission: "Counter-Invasion Project Underway"
resources_found_anti_cave_project_mission_desc: "An anti-armor, denial, aid, evacuation, cleanup, or reconstruction project is consuming national capacity."
resources_found_anti_cave_project_mission_tt: "The project completes at its calculated deadline. Target loss, invalid war state, cave defeat, or completed cleanup can cancel it."
resources_found_liberate_activating_anchor_mission: "Retake the Activating Anchor"
resources_found_liberate_activating_anchor_mission_desc: "Recapture and hold the exact resource state before the Oth-Kesh anchor activation window closes."
resources_found_liberate_activating_anchor_mission_tt: "Success interrupts the anchor and records liberation. Failure allows the feeding chamber to mature and add cave capacity."
resources_found_foreign_request_purchase_agreement: "Request a Purchase Agreement"
resources_found_foreign_request_purchase_agreement_desc: "Submit a formal purchase request to the foreign field owner and enter its bounded buyer shortlist."
resources_found_foreign_request_purchase_agreement_tt: "Pays a diplomatic commitment and records this country as the requester at the exact stored foreign field."
resources_found_foreign_offer_development_assistance: "Offer Development Assistance"
resources_found_foreign_offer_development_assistance_desc: "Offer engineering and commercial backing in exchange for a stronger position in future field negotiations."
resources_found_foreign_offer_development_assistance_tt: "Pays a diplomatic commitment and places this country's development package before the exact field owner."
resources_found_foreign_request_exclusive_rights: "Seek Exclusive Resource Rights"
resources_found_foreign_request_exclusive_rights_desc: "Ask the field owner to reject rival bidders and name this country as the exclusive concession partner."
resources_found_foreign_request_exclusive_rights_tt: "Pays a diplomatic commitment and records an exclusive-rights request. Rights are granted only by the owner."
resources_found_foreign_offer_access_guarantee: "Guarantee Access to the Field"
resources_found_foreign_offer_access_guarantee_desc: "Offer security backing and equipment support in exchange for continued access to the foreign field."
resources_found_foreign_offer_access_guarantee_tt: "Pays a security commitment and records this country as the field's proposed access guarantor."
resources_found_secure_transport_corridor: "Secure the Transport Corridor"
resources_found_secure_transport_corridor_desc: "Hold and reinforce the roads and rail approaches needed for evacuation, aid, and containment traffic."
resources_found_secure_transport_corridor_tt: "Starts a containment transport project. Completion establishes a held corridor and lowers Breach Pressure."
resources_found_restore_liberated_resource_state: "Restore a Liberated Resource State"
resources_found_restore_liberated_resource_state_desc: "Rebuild infrastructure and remove the extraction scar after a mature Oth-Kesh anchor has been cleared."
resources_found_restore_liberated_resource_state_tt: "Starts a targeted reconstruction project. Completion restores one infrastructure level and records a reconstruction contribution."
resources_found_refresh_field_project_estimates: "Refresh Field Project Estimates"
resources_found_refresh_field_project_estimates_desc: "Recalculate the exact payment, capacity, and duration commitments for projects tied to the selected resource field."
resources_found_refresh_trade_project_estimates: "Refresh Trade Project Estimates"
resources_found_refresh_trade_project_estimates_desc: "Recalculate the exact payment, capacity, and duration commitments for field contracts, security work, and foreign actions."
resources_found_refresh_containment_project_estimates: "Refresh Containment Project Estimates"
resources_found_refresh_containment_project_estimates_desc: "Recalculate the exact payment, capacity, and duration commitments for containment work at the selected field."
resources_found_refresh_cave_project_estimates: "Refresh Brood Project Estimates"
resources_found_refresh_cave_project_estimates_desc: "Recalculate the exact payment and duration commitments for brood-network orders."
resources_found_refresh_anti_cave_project_estimates: "Refresh Anti-Cave Project Estimates"
resources_found_refresh_anti_cave_project_estimates_desc: "Recalculate the exact payment, capacity, and duration commitments for the response to the cave threat."
resources_found_refresh_project_estimates_tt: "Rebuilds every exact project estimate from the current national scale, war status, selected-field conditions, infrastructure, safety, and valid contract context."
