black_plague_weaponization_deliver_payload: "Deliver the Black Plague Payload"
black_plague_weaponization_deliver_payload_desc: "Use one native plague-bomb payload against a selected enemy state. The shared Event 020 lifecycle records the strike, deaths, spread, and attribution."
