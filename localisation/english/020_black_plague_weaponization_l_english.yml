chaosx_nr20_weaponization.1.t: "The Programme Has Breached Its Bounds"
chaosx_nr20_weaponization.1.d: "A project accident has escaped the facility's safeguards. Reports are already moving through the response board, and the shared disease ledger has marked the source."
chaosx_nr20_weaponization.1.a: "Record the breach"
chaosx_nr20_weaponization.2.t: "A Weaponized Stockpile Stands Ready"
chaosx_nr20_weaponization.2.d: "The long programme has produced a native plague-bomb payload. Its existence is now part of the international record, and every future delivery will carry a clear attribution."
chaosx_nr20_weaponization.2.a: "Open the delivery board"
chaosx_nr20_weaponization.3.t: "The Payload Has Been Delivered"
chaosx_nr20_weaponization.3.d: "The selected state has entered the weaponized branch of the Black Plague lifecycle. Mortality, spread, and condemnation will continue through the shared systems."
chaosx_nr20_weaponization.3.a: "Return to the crisis board"
chaosx_nr20_weaponization.4.t: "The Stockpile Is Expanded"
chaosx_nr20_weaponization.4.d: "A guarded production run has added another native payload to the Black Plague stockpile. The delivery route is larger, but every stored payload keeps the accident risk and international condemnation ledger alive."
chaosx_nr20_weaponization.4.a: "Keep the safeguards staffed"
chaosx_nr20_weaponization.5.t: "The Stockpile Is Destroyed"
chaosx_nr20_weaponization.5.d: "The stored native payloads have been dismantled and the accident scheduler has been closed. The programme's findings, delivery history, and condemnation remain part of the record, but no payload can be delivered until the stockpile is rebuilt."
chaosx_nr20_weaponization.5.a: "Seal the facility"
