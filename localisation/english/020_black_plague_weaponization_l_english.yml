l_english:
black_plague_weaponization_program: "Black Plague Weaponization Programme"
black_plague_weaponization_program_desc: "A classified biowarfare programme testing plague surveillance, clinical samples, transport controls, military delivery, and containment through six prototype phases."
black_plague_weaponization_safety_first: "Safety-First Oversight"
black_plague_weaponization_safety_first_desc: "Put the programme under strict clinical review. The countermeasure board gains ground, and accidents become less likely as progress proceeds."
black_plague_weaponization_safety_first_effect: "The programme adopts Safety-First oversight."
black_plague_weaponization_military_acceleration: "Military Acceleration"
black_plague_weaponization_military_acceleration_desc: "Give the programme to the war office. Delivery readiness arrives sooner, at the cost of greater risk and reduced civilian countermeasure progress."
black_plague_weaponization_military_acceleration_effect: "The war office accelerates the programme."
black_plague_weaponization_dual_use: "Dual-Use Charter"
black_plague_weaponization_dual_use_desc: "Require every military finding to carry a treatment counterpart. Both lines remain active, and the project faces greater political pressure."
black_plague_weaponization_dual_use_effect: "The programme is placed under a Dual-Use Charter."
black_plague_weaponization_defensive_conversion: "Defensive Conversion"
black_plague_weaponization_defensive_conversion_desc: "Abandon offensive delivery and redirect the facility toward countermeasures. Earlier accidents and exposure remain part of the record."
black_plague_weaponization_defensive_conversion_effect: "The facility is converted to defensive countermeasure work."
black_plague_weaponization_approach_cost: "£support_equipment_text_icon §Y[GetBlackPlagueWeaponizationValueApproachSupportEquipment]§!  £command_power §Y[GetBlackPlagueWeaponizationValueApproachCommandPower]§!  £civ_factory §Y[GetBlackPlagueWeaponizationValueApproachCivilianFactories]§!"
black_plague_weaponization_approach_cost_blocked: "£support_equipment_text_icon §R[GetBlackPlagueWeaponizationValueApproachSupportEquipment]§!  £command_power §R[GetBlackPlagueWeaponizationValueApproachCommandPower]§!  £civ_factory §R[GetBlackPlagueWeaponizationValueApproachCivilianFactories]§!"
black_plague_weaponization_approach_cost_tooltip: "The factory remains committed for §Y[GetBlackPlagueWeaponizationValueApproachDurationDays] days§!. Materials spent when this posture is chosen are not returned if work ends early."
black_plague_weaponization_expand_stockpile: "Expand Payload Stockpile"
black_plague_weaponization_expand_stockpile_desc: "A guarded production run adds one plague-bomb payload to the stockpile. The accident watch remains active and programme risk rises."
black_plague_weaponization_expand_stockpile_cost: "£support_equipment_text_icon §Y[GetBlackPlagueWeaponizationValueStockpileExpansionSupportEquipment]§!  £GFX_fuel_texticon §Y[GetBlackPlagueWeaponizationValueStockpileExpansionFuel]§!  £civ_factory §Y[GetBlackPlagueWeaponizationValueStockpileExpansionCivilianFactories]§!"
black_plague_weaponization_expand_stockpile_cost_blocked: "£support_equipment_text_icon §R[GetBlackPlagueWeaponizationValueStockpileExpansionSupportEquipment]§!  £GFX_fuel_texticon §R[GetBlackPlagueWeaponizationValueStockpileExpansionFuel]§!  £civ_factory §R[GetBlackPlagueWeaponizationValueStockpileExpansionCivilianFactories]§!"
black_plague_weaponization_expand_stockpile_effect: "One plague-bomb payload is added to the stockpile, the accident watch remains active, and project risk rises."
black_plague_weaponization_destroy_stockpile: "Destroy Payload Stockpile"
black_plague_weaponization_destroy_stockpile_desc: "Dismantle every stored plague-bomb payload under a guarded safety operation. The project and its delivery history remain. The accident watch closes until another expansion is completed."
black_plague_weaponization_destroy_stockpile_cost: "£support_equipment_text_icon §Y[GetBlackPlagueWeaponizationValueStockpileDestroySupportEquipment]§!  £command_power §Y[GetBlackPlagueWeaponizationValueStockpileDestroyCommandPower]§!  £civ_factory §Y[GetBlackPlagueWeaponizationValueStockpileDestroyCivilianFactories]§!"
black_plague_weaponization_destroy_stockpile_cost_blocked: "£support_equipment_text_icon §R[GetBlackPlagueWeaponizationValueStockpileDestroySupportEquipment]§!  £command_power §R[GetBlackPlagueWeaponizationValueStockpileDestroyCommandPower]§!  £civ_factory §R[GetBlackPlagueWeaponizationValueStockpileDestroyCivilianFactories]§!"
black_plague_weaponization_destroy_stockpile_effect: "Every stored plague-bomb payload is destroyed and project risk falls."
