chaosx_nr20_weaponization.1.t: "The Programme Has Breached Its Bounds"
chaosx_nr20_weaponization.1.d: "A project accident has escaped the facility's safeguards. The source is spreading beyond the compound, and hospitals are preparing for the first cases."
chaosx_nr20_weaponization.1.a: "Record the breach"
chaosx_nr20_weaponization.2.t: "A Weaponized Stockpile Stands Ready"
chaosx_nr20_weaponization.2.d: "The long programme has produced a native plague-bomb payload. Its existence is now part of the international record, and every future delivery will carry a clear attribution."
chaosx_nr20_weaponization.2.d.safety_first: "Strict clinical oversight has completed the programme without surrendering the delivery reserve. The native payload is ready, the countermeasure board retains the benefit of the safety route, and every future delivery will still carry a clear attribution."
chaosx_nr20_weaponization.2.d.military_acceleration: "The war office has completed the programme at speed. A native payload is ready for delivery. The accelerated route leaves less countermeasure margin and a higher accident record for every command that follows."
chaosx_nr20_weaponization.2.d.dual_use: "The Dual-Use Charter has produced a native payload and preserved a treatment counterpart. The reserve can be delivered. The same files that authorize it expose the programme to every hospital, parliament, and foreign inspector reading the record."
chaosx_nr20_weaponization.2.a: "Open the delivery board"
chaosx_nr20_weaponization.3.t: "The Payload Has Been Delivered"
chaosx_nr20_weaponization.3.d: "A plague-bomb strike has entered the selected state. Mortality, spread, and condemnation will continue as the exposure moves through the population."
chaosx_nr20_weaponization.3.d.selected: "The payload has entered [black_plague_weaponization_delivery_state.GetName]. The state now carries a publicly attributed weaponized exposure, and mortality, spread, and condemnation will continue through the shared Black Plague systems."
chaosx_nr20_weaponization.3.d.crisis: "The payload has entered [black_plague_weaponization_delivery_state.GetName] during a severe crisis. The weaponized exposure has pushed an active basin into the shared mortality, spread, and condemnation ledgers. Hospitals and containment teams must now work against the strain and the attribution record."
chaosx_nr20_weaponization.3.a: "Return to the crisis board"
chaosx_nr20_weaponization.4.t: "The Stockpile Is Expanded"
chaosx_nr20_weaponization.4.d: "A guarded production run has added another native payload to the Black Plague stockpile. The larger reserve keeps accident risk and the international condemnation ledger active."
chaosx_nr20_weaponization.4.a: "Keep the safeguards staffed"
chaosx_nr20_weaponization.5.t: "The Stockpile Is Destroyed"
chaosx_nr20_weaponization.5.d: "The stored native payloads have been dismantled and the accident scheduler has been closed. The programme's findings, delivery history, and condemnation remain part of the record. No payload can be delivered until the stockpile is rebuilt."
chaosx_nr20_weaponization.5.a: "Seal the facility"
chaosx_nr20_weaponization.6.t: "The Programme Turns to Countermeasures"
chaosx_nr20_weaponization.6.d: "The facility has completed Defensive Conversion. No offensive payload has entered the stockpile. The programme's equipment, research record, and earlier accidents now serve the countermeasure board. Its progress rises, and the history of the work remains."
chaosx_nr20_weaponization.6.a: "Keep the defensive line staffed"
