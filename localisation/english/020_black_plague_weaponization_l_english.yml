black_plague_weaponization_expand_stockpile: "Expand the Payload Stockpile"
black_plague_weaponization_expand_stockpile_desc: "Spend support equipment, motorized transport, command power, fuel, and two civilian factories to produce one additional native plague-bomb payload. The accident scheduler remains active and the programme's risk rises."
black_plague_weaponization_expand_stockpile_cost: "£support_equipment_text_icon §Y[?constant:black_plague_weaponization_program.stockpile_expansion_support_equipment|0]§!  £motorized_equipment_text_icon §Y[?constant:black_plague_weaponization_program.stockpile_expansion_motorized_equipment|0]§!  £command_power §Y[?constant:black_plague_weaponization_program.stockpile_expansion_command_power|0]§!  £GFX_fuel_texticon §Y[?constant:black_plague_weaponization_program.stockpile_expansion_fuel|0]§!"
black_plague_weaponization_expand_stockpile_cost_blocked: "§RThe expansion reserve cannot be paid with the current support, transport, command-power, fuel, or factory capacity.§!"
black_plague_weaponization_expand_stockpile_effect: "One native payload is added to the stockpile, the accident scheduler remains active, and project risk rises."
black_plague_weaponization_destroy_stockpile: "Destroy the Payload Stockpile"
black_plague_weaponization_destroy_stockpile_desc: "Dismantle every stored native payload under a guarded safety operation. The project and its delivery history remain. The accident scheduler closes until another expansion is completed."
black_plague_weaponization_destroy_stockpile_cost: "£support_equipment_text_icon §Y[?constant:black_plague_weaponization_program.stockpile_destroy_support_equipment|0]§!  £command_power §Y[?constant:black_plague_weaponization_program.stockpile_destroy_command_power|0]§!  £GFX_fuel_texticon §Y[?constant:black_plague_weaponization_program.stockpile_destroy_fuel|0]§!"
black_plague_weaponization_destroy_stockpile_cost_blocked: "§RThe reserve cannot be destroyed until the required support equipment, command power, and fuel are available.§!"
black_plague_weaponization_destroy_stockpile_effect: "Every stored native payload is destroyed and project risk falls."
