l_english:
chaosx.nr76.1.t: "USA tests weapons!"

chaosx.nr76.1.d: "A USA weapons test inside our borders has killed civilians and destroyed buildings and infrastructure. The survivors are demanding retaliation, and the government must decide whether to go to war."
chaosx.nr76.1.a: "Nothing we can do"
chaosx.nr76.1.b: "They asked for it"
