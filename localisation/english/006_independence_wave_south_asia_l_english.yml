l_english:
# South Asia and Himalaya framework packages.
independence_wave_fdx_institution: "Legislative Assembly"
independence_wave_fdx_institution_long: "Punjab Legislative Assembly"
independence_wave_fox_institution: "Legislative Assembly"
independence_wave_fox_institution_long: "Assam Legislative Assembly"

# Punjab
independence_wave_fdx_punjab_category: "The Punjab Assembly"
independence_wave_fdx_punjab_category_desc: "Punjab governs itself again. The canal colonies quarrel over water, the regiments await orders, and the assembly must speak for Muslim, Hindu, and Sikh members alike."
independence_wave_fdx_seat_punjab_assembly: "Seat the Punjab Assembly"
independence_wave_fdx_seat_punjab_assembly_desc: "Open the Legislative Assembly at Lahore with members elected from the districts and the canal colonies, and form the first ministry from its benches."
independence_wave_fdx_seat_punjab_assembly_tt: "Adds §YThe Punjab Legislative Assembly§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_fdx_settle_canal_water_shares: "Settle the Canal Water Shares"
independence_wave_fdx_settle_canal_water_shares_desc: "Fix each colony's share of the Sutlej and Chenab canals by law and appoint a commission to hear the colonists' claims to their grants."
independence_wave_fdx_settle_canal_water_shares_tt: "Removes §YThe Canal Colony Disputes§!, raises §YCapacity§! and lowers §YInstability§!."
independence_wave_fdx_charter_punjab_regiments: "Charter the Punjab Regiments"
independence_wave_fdx_charter_punjab_regiments_desc: "Take the Punjabi battalions and their depots into the province's own service, with their pensions and colony land grants guaranteed."
independence_wave_fdx_charter_punjab_regiments_tt: "Adds §YThe Punjab Regiments§! and raises §YSecurity§!."
independence_wave_fdx_canal_colony_disputes: "The Canal Colony Disputes"
independence_wave_fdx_canal_colony_disputes_desc: "The colonists of Lyallpur and Montgomery dispute their water shares, and every quarrel over a canal outlet reaches the ministry."
independence_wave_fdx_punjab_assembly: "The Punjab Legislative Assembly"
independence_wave_fdx_punjab_assembly_desc: "The assembly at Lahore seats members of every community, and the ministry depends on a majority across them."
independence_wave_fdx_punjab_regiments: "The Punjab Regiments"
independence_wave_fdx_punjab_regiments_desc: "The Punjabi battalions serve the province with their old depots, pensions and land grants intact."
independence_wave_fdx_assembly_seated: "The Punjab Legislative Assembly has been seated"

# Sindh
independence_wave_sin_sindh_category: "The Sind Settlement"
independence_wave_sin_sindh_category_desc: "Sindh governs itself again. The Sukkur Barrage has opened new Indus land that every landlord wants, and Karachi's port still answers to the old customs rules."
independence_wave_sin_seat_sind_assembly: "Seat the Sind Assembly"
independence_wave_sin_seat_sind_assembly_desc: "Open the provincial assembly at Karachi with members from the districts, the landholders and the city."
independence_wave_sin_seat_sind_assembly_tt: "Adds §YThe Sind Assembly§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_sin_allot_barrage_lands: "Allot the Barrage Lands"
independence_wave_sin_allot_barrage_lands_desc: "Survey the land watered by the Sukkur Barrage canals and sell or grant it in fixed lots, with a share kept for the cultivators who till it."
independence_wave_sin_allot_barrage_lands_tt: "Removes §YThe Barrage Lands§!, raises §YCapacity§! and §YLegitimacy§! and lowers §YInstability§!."
independence_wave_sin_open_karachi_trade: "Open the Karachi Trade"
independence_wave_sin_open_karachi_trade_desc: "Set Karachi's own tariff, lease new wharves on the Kiamari side and invite the Gulf and Bombay merchants to trade through the port."
independence_wave_sin_open_karachi_trade_tt: "Adds §YThe Karachi Wharves§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_sin_barrage_lands: "The Barrage Lands"
independence_wave_sin_barrage_lands_desc: "Land newly watered by the barrage canals lies unallotted, and landlords and cultivators already contest it."
independence_wave_sin_sind_assembly: "The Sind Assembly"
independence_wave_sin_sind_assembly_desc: "The provincial assembly sits at Karachi and the ministry answers to it."
independence_wave_sin_karachi_wharves: "The Karachi Wharves"
independence_wave_sin_karachi_wharves_desc: "Karachi trades under its own tariff, and the Gulf dhows and the steamers share its new wharves."
independence_wave_sin_assembly_seated: "The Sind Assembly has been seated"

# Balochistan
independence_wave_blc_kalat_category: "The Kalat Settlement"
independence_wave_blc_kalat_category_desc: "Balochistan governs itself again. The Sarawan and Jhalawan sardars answer to their own councils first, and the Bolan Pass is the only easy road to the plains."
independence_wave_blc_convene_kalat_assemblies: "Convene the Kalat Assemblies"
independence_wave_blc_convene_kalat_assemblies_desc: "Call an upper house of the sardars and a lower house of elected members to Kalat, so that the tribes and the towns are both bound by the state's laws."
independence_wave_blc_convene_kalat_assemblies_tt: "Replaces §YThe Government and the Sardars§! with §YThe Kalat Assemblies§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_blc_secure_bolan_pass: "Secure the Bolan Pass"
independence_wave_blc_secure_bolan_pass_desc: "Post levies at the pass forts and along the railway from Sibi to Quetta."
independence_wave_blc_secure_bolan_pass_tt: "Adds §YThe Bolan Guard§! and raises §YSecurity§!."
independence_wave_blc_open_makran_road: "Open the Makran Road"
independence_wave_blc_open_makran_road_desc: "Build a road from Kalat to the Makran ports at Pasni and Gwadar and settle the coastal tolls with Muscat."
independence_wave_blc_open_makran_road_tt: "Raises §YCapacity§! and §YRecognition§!."
independence_wave_blc_khan_and_sardars: "The Government and the Sardars"
independence_wave_blc_khan_and_sardars_desc: "The great sardars treat with the government as equals, and their levies follow their own chiefs first."
independence_wave_blc_kalat_assemblies: "The Kalat Assemblies"
independence_wave_blc_kalat_assemblies_desc: "The sardars sit in an upper house and elected members in a lower one, and both pass the laws of the state."
independence_wave_blc_bolan_guard: "The Bolan Guard"
independence_wave_blc_bolan_guard_desc: "Levies hold the forts of the Bolan Pass and the railway into the plains."
independence_wave_blc_assemblies_convened: "The Kalat assemblies have been convened"

# Pashtunistan
independence_wave_psh_frontier_category: "The Frontier Settlement"
independence_wave_psh_frontier_category_desc: "Pashtunistan governs itself again. The Peshawar districts have their own politics, the hill agencies reject outside rule, and the Khyber is trade route and front door."
independence_wave_psh_convene_grand_jirga: "Convene a Grand Jirga"
independence_wave_psh_convene_grand_jirga_desc: "Summon the maliks and elders of the tribal agencies and the members for the settled districts to one jirga at Peshawar to agree the terms of a common government."
independence_wave_psh_convene_grand_jirga_tt: "Replaces §YThe Tribal Agencies§! with §YThe Grand Jirga§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_psh_recognize_khudai_khidmatgar: "Recognise the Khudai Khidmatgar"
independence_wave_psh_recognize_khudai_khidmatgar_desc: "Lift the bans on the nonviolent Servants of God movement, free its imprisoned members and give its leaders seats in the government."
independence_wave_psh_recognize_khudai_khidmatgar_tt: "Greatly raises §YLegitimacy§!, raises §YRecognition§! and raises §YInstability§!."
independence_wave_psh_garrison_khyber: "Garrison the Khyber"
independence_wave_psh_garrison_khyber_desc: "Take over the forts at Jamrud and Landi Kotal and raise a frontier force from the Afridi and Shinwari tribes that live along the pass."
independence_wave_psh_garrison_khyber_tt: "Adds §YThe Khyber Garrison§! and raises §YSecurity§!."
independence_wave_psh_tribal_agencies: "The Tribal Agencies"
independence_wave_psh_tribal_agencies_desc: "The hill tribes govern themselves under their own jirgas and accept no officials from Peshawar."
independence_wave_psh_grand_jirga: "The Grand Jirga"
independence_wave_psh_grand_jirga_desc: "The tribes and the settled districts send members to one jirga, and its decisions bind both."
independence_wave_psh_khyber_garrison: "The Khyber Garrison"
independence_wave_psh_khyber_garrison_desc: "A frontier force drawn from the pass tribes holds the forts of the Khyber."
independence_wave_psh_jirga_convened: "The Grand Jirga has been convened"

# Kashmir
independence_wave_kas_kashmir_category: "The Kashmir Durbar"
independence_wave_kas_kashmir_category_desc: "Kashmir governs itself under its Maharaja. The Jammu court and the people of the Valley distrust each other, and the Banihal road is the one winter link to the plains."
independence_wave_kas_expand_praja_sabha: "Widen the Praja Sabha"
independence_wave_kas_expand_praja_sabha_desc: "Give the Praja Sabha an elected majority, with seats for the Valley in proportion to its people, and make the ministers answer to it."
independence_wave_kas_expand_praja_sabha_tt: "Replaces §YThe Durbar and the Valley§! with §YThe Praja Sabha§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_kas_open_banihal_road: "Open the Banihal Road"
independence_wave_kas_open_banihal_road_desc: "Keep the Jammu to Srinagar road over the Banihal Pass open through the winter and abolish the tolls on Valley goods."
independence_wave_kas_open_banihal_road_tt: "Adds §YThe Banihal Road§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_kas_settle_weavers_wages: "Settle the Weavers' Wages"
independence_wave_kas_settle_weavers_wages_desc: "Set a wage board for the shawl weavers and the silk factory hands of Srinagar and abolish the tax on their looms."
independence_wave_kas_settle_weavers_wages_tt: "Raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_kas_durbar_and_valley: "The Durbar and the Valley"
independence_wave_kas_durbar_and_valley_desc: "The court at Jammu holds the offices, and the people of the Valley demand a share of them."
independence_wave_kas_praja_sabha: "The Praja Sabha"
independence_wave_kas_praja_sabha_desc: "The state assembly has an elected majority and the ministers answer to it."
independence_wave_kas_banihal_road: "The Banihal Road"
independence_wave_kas_banihal_road_desc: "The road over the Banihal Pass stays open in winter and Valley goods reach the plains free of tolls."
independence_wave_kas_praja_sabha_expanded: "The Praja Sabha has been widened"

# Hyderabad
independence_wave_hyd_deccan_category: "The Hyderabad Settlement"
independence_wave_hyd_deccan_category_desc: "Hyderabad governs itself under its Nizam. Jagirdars collect their own revenue across much of the state, and the Legislative Council is appointed, not elected."
independence_wave_hyd_reform_legislative_council: "Reform the Legislative Council"
independence_wave_hyd_reform_legislative_council_desc: "Enlarge the Legislative Council and fill most of its seats by election from the districts and the city."
independence_wave_hyd_reform_legislative_council_tt: "Adds §YThe Reformed Council§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_hyd_abolish_jagir_levies: "Abolish the Jagir Levies"
independence_wave_hyd_abolish_jagir_levies_desc: "Bring the jagir estates under the state revenue officers, end the holders' private levies and pay them fixed pensions instead."
independence_wave_hyd_abolish_jagir_levies_tt: "Removes §YThe Jagir Estates§!, greatly raises §YLegitimacy§!, raises §YCapacity§! and raises §YInstability§!."
independence_wave_hyd_expand_osmania_university: "Expand Osmania University"
independence_wave_hyd_expand_osmania_university_desc: "Fund new colleges of engineering and medicine at Osmania University and its translation bureau."
independence_wave_hyd_expand_osmania_university_tt: "Adds §YOsmania University§! and raises §YRecognition§! and §YCapacity§!."
independence_wave_hyd_jagir_estates: "The Jagir Estates"
independence_wave_hyd_jagir_estates_desc: "Jagirdars collect the revenue of their estates themselves, and the state sees little of it."
independence_wave_hyd_reformed_council: "The Reformed Council"
independence_wave_hyd_reformed_council_desc: "Most members of the Legislative Council are elected, and the ministers explain their budgets to it."
independence_wave_hyd_osmania_university: "Osmania University"
independence_wave_hyd_osmania_university_desc: "The university teaches in Urdu and trains the state's engineers, doctors and officials."
independence_wave_hyd_council_reformed: "The Legislative Council has been reformed"

# Mysore
independence_wave_mys_mysore_category: "The Mysore Settlement"
independence_wave_mys_mysore_category_desc: "Mysore governs itself under its Maharaja. The Dewan's ministry runs dams, iron works, and power lines, but the Mysore Congress wants it to answer to elected members."
independence_wave_mys_seat_representative_assembly: "Seat the Representative Assembly"
independence_wave_mys_seat_representative_assembly_desc: "Give the Representative Assembly a vote on the budget and appoint ministers from among its elected members."
independence_wave_mys_seat_representative_assembly_tt: "Replaces §YThe Dewan and the Congress§! with §YThe Representative Assembly§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_mys_expand_bhadravati_works: "Expand the Bhadravati Works"
independence_wave_mys_expand_bhadravati_works_desc: "Add a steel plant and a cement works to the state iron works at Bhadravati."
independence_wave_mys_expand_bhadravati_works_tt: "Adds §YThe Bhadravati Works§! and raises §YCapacity§!."
independence_wave_mys_open_krishnaraja_sagara_canals: "Open the Irwin Canal Lands"
independence_wave_mys_open_krishnaraja_sagara_canals_desc: "Extend the Irwin Canal from the Krishnaraja Sagara dam into the Mandya plain and settle cultivators on the new land."
independence_wave_mys_open_krishnaraja_sagara_canals_tt: "Raises §YCapacity§! and §YLegitimacy§!."
independence_wave_mys_dewan_and_congress: "The Dewan and the Congress"
independence_wave_mys_dewan_and_congress_desc: "The Dewan's officials govern well but alone, and the Mysore Congress holds rallies for a responsible ministry."
independence_wave_mys_representative_assembly: "The Representative Assembly"
independence_wave_mys_representative_assembly_desc: "The assembly votes the budget and the ministers are drawn from its elected members."
independence_wave_mys_bhadravati_works: "The Bhadravati Works"
independence_wave_mys_bhadravati_works_desc: "The state iron and steel works at Bhadravati supply the state's railways, dams and factories."
independence_wave_mys_assembly_seated: "The Representative Assembly has been seated"

# Madras States
independence_wave_ras_south_category: "The Southern States"
independence_wave_ras_south_category_desc: "The southern princely states govern themselves together under the Maharaja of Travancore. Temple entry for every Hindu divides the court, and the assembly is unfinished."
independence_wave_ras_proclaim_temple_entry: "Proclaim Temple Entry"
independence_wave_ras_proclaim_temple_entry_desc: "Proclaim that no Hindu may be refused entry to the temples under the government's control because of caste."
independence_wave_ras_proclaim_temple_entry_tt: "Replaces §YThe Temple Entry Question§! with §YThe Temple Entry Proclamation§!, greatly raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_ras_seat_sree_mulam_assembly: "Seat the Sree Mulam Assembly"
independence_wave_ras_seat_sree_mulam_assembly_desc: "Widen the franchise for the Sree Mulam Assembly so that every community is represented, and give it the right to question ministers."
independence_wave_ras_seat_sree_mulam_assembly_tt: "Raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_ras_expand_cochin_harbour: "Expand the Cochin Harbour"
independence_wave_ras_expand_cochin_harbour_desc: "Finish the deep-water berths at Willingdon Island and bring the harbour under the states' own port trust."
independence_wave_ras_expand_cochin_harbour_tt: "Adds §YThe Cochin Harbour§! and raises §YCapacity§! and §YRecognition§!."
independence_wave_ras_temple_entry_question: "The Temple Entry Question"
independence_wave_ras_temple_entry_question_desc: "Reformers demand that every Hindu may enter the state temples, and the orthodox priests and families refuse."
independence_wave_ras_temple_entry_proclamation: "The Temple Entry Proclamation"
independence_wave_ras_temple_entry_proclamation_desc: "The state temples are open to every Hindu, whatever their caste."
independence_wave_ras_cochin_harbour: "The Cochin Harbour"
independence_wave_ras_cochin_harbour_desc: "Deep-water berths at Willingdon Island take ocean steamers under the states' own port trust."

# Assam
independence_wave_fox_assam_category: "The Assam Assembly"
independence_wave_fox_assam_category_desc: "Assam governs itself again. Tea gardens rely on contract labour, outside firms run the oil and steamers, and hills and valley send different members to Shillong."
independence_wave_fox_seat_assam_assembly: "Seat the Assam Assembly"
independence_wave_fox_seat_assam_assembly_desc: "Open the Legislative Assembly at Shillong with members from the Brahmaputra and Surma valleys, the tea gardens and the hills."
independence_wave_fox_seat_assam_assembly_tt: "Adds §YThe Assam Legislative Assembly§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_fox_reform_tea_garden_contracts: "Reform the Garden Contracts"
independence_wave_fox_reform_tea_garden_contracts_desc: "Set a minimum wage for the tea gardens, guarantee every labourer the right to leave and a paid passage home, and send inspectors to the garden lines."
independence_wave_fox_reform_tea_garden_contracts_tt: "Replaces §YThe Tea Garden Labour§! with §YThe Tea Garden Charter§!, raises §YLegitimacy§! and lowers §YCapacity§!."
independence_wave_fox_open_brahmaputra_steamers: "Open the Brahmaputra Steamers"
independence_wave_fox_open_brahmaputra_steamers_desc: "License new steamer services on the Brahmaputra and set the freight rates for tea, oil and rice."
independence_wave_fox_open_brahmaputra_steamers_tt: "Raises §YCapacity§! and §YRecognition§!."
independence_wave_fox_tea_garden_labour: "The Tea Garden Labour"
independence_wave_fox_tea_garden_labour_desc: "Labourers on the tea gardens work under long contracts at low wages and cannot easily leave."
independence_wave_fox_assam_assembly: "The Assam Legislative Assembly"
independence_wave_fox_assam_assembly_desc: "The assembly at Shillong seats members from the valleys, the gardens and the hills."
independence_wave_fox_tea_garden_charter: "The Tea Garden Charter"
independence_wave_fox_tea_garden_charter_desc: "Garden labourers have a minimum wage, inspectors and the right to leave."
independence_wave_fox_assembly_seated: "The Assam Legislative Assembly has been seated"

# Manipur
independence_wave_mpu_manipur_category: "The Manipur Durbar"
independence_wave_mpu_manipur_category_desc: "Manipur governs itself under its Maharaja. The Imphal valley and the hills have long been governed apart, and the only road to the railway runs to Dimapur."
independence_wave_mpu_convene_durbar_with_hill_chiefs: "Convene Durbar with Hill Chiefs"
independence_wave_mpu_convene_durbar_with_hill_chiefs_desc: "Seat the chiefs of the Naga and Kuki hill villages beside the valley members of the State Durbar."
independence_wave_mpu_convene_durbar_with_hill_chiefs_tt: "Replaces §YThe Valley and the Hills§! with §YThe Manipur Durbar§!, raises §YLegitimacy§! and lowers §YInstability§!."
independence_wave_mpu_open_imphal_dimapur_road: "Open the Imphal Road"
independence_wave_mpu_open_imphal_dimapur_road_desc: "Metal the cart road from Imphal to the railhead at Dimapur and keep it open through the monsoon."
independence_wave_mpu_open_imphal_dimapur_road_tt: "Raises §YCapacity§! and §YRecognition§!."
independence_wave_mpu_fund_hill_schools: "Fund the Hill Schools"
independence_wave_mpu_fund_hill_schools_desc: "Open state schools in the hill villages, with teachers who speak the village languages."
independence_wave_mpu_fund_hill_schools_tt: "Adds §YThe Hill Schools§!, raises §YLegitimacy§! and raises §YCapacity§!."
independence_wave_mpu_valley_and_hills: "The Valley and the Hills"
independence_wave_mpu_valley_and_hills_desc: "The valley is governed by the Durbar and the hills by separate officers, and neither trusts the other's rule."
independence_wave_mpu_manipur_durbar: "The Manipur Durbar"
independence_wave_mpu_manipur_durbar_desc: "Valley members and hill chiefs sit together in the State Durbar."
independence_wave_mpu_hill_schools: "The Hill Schools"
independence_wave_mpu_hill_schools_desc: "State schools teach in the hill villages in their own languages."
independence_wave_mpu_durbar_convened: "The Durbar has met with the hill chiefs"

# Incidents
chaosx.nr6.230.t: "The Moneylenders' Bills"
chaosx.nr6.230.d: "The ministry's agrarian members have tabled bills to cancel debts that have been repaid twice over in interest and to stop moneylenders from taking cultivators' land. The market towns warn that credit will dry up."
chaosx.nr6.230.a: "Pass the debt relief bills"
chaosx.nr6.230.b: "Protect the market towns' credit"
chaosx.nr6.231.t: "The Returning Soldiers"
chaosx.nr6.231.d: "Discharged Punjabi soldiers are coming home with their pay spent and ask for the colony land they were promised. Some officers propose a provincial guard to employ them."
chaosx.nr6.231.a: "Raise a provincial guard"
chaosx.nr6.231.b: "Grant them colony land"
chaosx.nr6.232.t: "The Haris and the Zamindars"
chaosx.nr6.232.d: "The haris who till the landlords' fields for half the crop ask the assembly for security of tenure. The zamindars say the custom of batai is none of the government's business."
chaosx.nr6.232.a: "Protect the haris' tenancy"
chaosx.nr6.232.b: "Leave the batai to custom"
chaosx.nr6.233.t: "Silt in the Barrage Canals"
chaosx.nr6.233.d: "The Indus floods have left the barrage canals choked with silt, and the tail-end villages are getting no water."
chaosx.nr6.233.a: "Fund the canal clearance"
chaosx.nr6.233.b: "Leave the canals for next season"
chaosx.nr6.234.t: "Raiders on the Western Border"
chaosx.nr6.234.d: "Raiders from across the Persian border have driven off herds near Panjgur. The local sardar asks the government to act before he settles the matter himself."
chaosx.nr6.234.a: "Send the levies"
chaosx.nr6.234.b: "Let the sardars settle it in jirga"
chaosx.nr6.235.t: "The Gwadar Dhows"
chaosx.nr6.235.d: "The dhows that carry dates, fish and wool from the Makran coast to Muscat and Karachi have always paid little at Gwadar. The government could levy its own customs at Pasni."
chaosx.nr6.235.a: "Let the dhows trade untaxed"
chaosx.nr6.235.b: "Levy customs at Pasni"
chaosx.nr6.236.t: "Tolls on the Khyber Railway"
chaosx.nr6.236.d: "The railway through the Khyber carries the Kabul trade, and the government could charge tolls on every caravan's goods. The Afghan merchants would carry their goods by the old roads instead."
chaosx.nr6.236.a: "Charge tolls on the railway"
chaosx.nr6.236.b: "Keep the pass free"
chaosx.nr6.237.t: "A Feud at Bannu"
chaosx.nr6.237.d: "A land feud between two families near Bannu has drawn in their villages. The elders offer to judge it in jirga; the frontier constabulary offers to end it by force."
chaosx.nr6.237.a: "Let the jirga judge it"
chaosx.nr6.237.b: "Send the frontier constabulary"
chaosx.nr6.238.t: "The Grievances Report"
chaosx.nr6.238.d: "A commission has reported on the Valley's grievances: few posts for its people, too few schools, and shrines held by the state. Carrying out its recommendations would anger the officials who hold those posts."
chaosx.nr6.238.a: "Carry out the recommendations"
chaosx.nr6.238.b: "Postpone them"
chaosx.nr6.239.t: "The Leh Caravans"
chaosx.nr6.239.d: "The caravans from Lhasa and Yarkand reach Leh with wool, salt and tea. The treasury wants duties on them; the Ladakhi merchants want the trade kept free."
chaosx.nr6.239.a: "Tax the caravans at Leh"
chaosx.nr6.239.b: "Keep the caravan trade free"
chaosx.nr6.240.t: "The Telangana Villages"
chaosx.nr6.240.d: "Villagers in Telangana petition against vetti, the unpaid labour that the village landlords still demand of them."
chaosx.nr6.240.a: "Abolish vetti labour"
chaosx.nr6.240.b: "Leave the villages to the landlords"
chaosx.nr6.241.t: "The State Railway"
chaosx.nr6.241.d: "The Nizam's State Railway wants new lines to the cotton districts. The state can build them from its own revenue or sell bonds abroad."
chaosx.nr6.241.a: "Build from the treasury"
chaosx.nr6.241.b: "Sell bonds abroad"
chaosx.nr6.242.t: "Strike at the Kolar Gold Fields"
chaosx.nr6.242.d: "The miners at Kolar have stopped work for higher pay and safer shafts. The mining company asks the state to protect the mines."
chaosx.nr6.242.a: "Mediate a wage award"
chaosx.nr6.242.b: "Back the mining company"
chaosx.nr6.243.t: "The Sandalwood Monopoly"
chaosx.nr6.243.d: "The state holds the monopoly on Mysore sandalwood and its oil. Foreign buyers offer high prices for licences to cut and distil it themselves."
chaosx.nr6.243.a: "Keep the state monopoly"
chaosx.nr6.243.b: "Sell licences to foreign buyers"
chaosx.nr6.244.t: "The Abstention Movement"
chaosx.nr6.244.d: "The Ezhava, Christian and Muslim communities refuse to vote in elections held on the property franchise. Their leaders ask for seats in proportion to their numbers."
chaosx.nr6.244.a: "Reserve seats for every community"
chaosx.nr6.244.b: "Keep the property franchise"
chaosx.nr6.245.t: "The Coir Workers' Strike"
chaosx.nr6.245.d: "The coir factory workers of Alleppey have struck for higher wages and a recognised union. The factory owners threaten to move their work to the villages."
chaosx.nr6.245.a: "Recognise the coir workers' union"
chaosx.nr6.245.b: "Break the strike"
chaosx.nr6.246.t: "The Digboi Lease"
chaosx.nr6.246.d: "The oil company's lease at Digboi is up for renewal. The ministry can raise the royalties or renew the lease on the old terms."
chaosx.nr6.246.a: "Raise the oil royalties"
chaosx.nr6.246.b: "Renew the lease on the old terms"
chaosx.nr6.247.t: "Settlers on the Char Lands"
chaosx.nr6.247.d: "Families from the crowded districts downriver are clearing the char islands and riverbanks of the Brahmaputra. Some members want the settlement restricted to marked lines; others want the land opened."
chaosx.nr6.247.a: "Keep settlement within the lines"
chaosx.nr6.247.b: "Open the wastelands to settlement"
chaosx.nr6.248.t: "The Women of the Bazaar"
chaosx.nr6.248.d: "The women traders of the Imphal bazaar have surrounded the Durbar office in protest against rice exports while the price of rice climbs."
chaosx.nr6.248.a: "Ban the rice exports"
chaosx.nr6.248.b: "Let the rice mills keep exporting"
chaosx.nr6.249.t: "The Hill Porterage"
chaosx.nr6.249.d: "The hill chiefs complain that their villages must still carry officials' loads without pay. They ask the Durbar to abolish the duty."
chaosx.nr6.249.a: "Abolish the porterage duty"
chaosx.nr6.249.b: "Refer it to a commission"
