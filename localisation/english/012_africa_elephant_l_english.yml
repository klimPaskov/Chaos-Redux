l_english:
 chaosx_elephant: "Armoured War Elephant"
 chaosx_elephant_desc: "A monumental elephant formation carrying trained riders beneath layered hide and metal armour. It requires more time and supplies than ordinary cavalry, but its weight and protection let it break fortified lines."
 chaosx_elephant_equipment: "Armoured War Elephant Equipment"
 chaosx_elephant_equipment_desc: "Harness, armour, weapons, and field stores for the Charter League's armoured war elephants."
 chaosx_elephant_equipment_1: "Armoured War Elephant Equipment"
 chaosx_elephant_equipment_1_desc: "A standardised harness of fitted armour, weapons, and field stores for the Charter League's largest trained elephants."
 chaosx_africa_elephant_warfare_tech: "Charter Elephant Warfare"
 chaosx_africa_elephant_warfare_tech_desc: "The protection charter establishes armoured elephant formations and extends their training and equipment standards to accepted members."
