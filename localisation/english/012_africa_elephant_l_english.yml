l_english:
chaosx_elephant: "Armoured War Elephant"
chaosx_elephant_desc: "A monumental elephant formation carrying trained riders beneath layered hide and metal armour. It requires more time and supplies than ordinary cavalry, but its weight and protection let it break fortified lines."
chaosx_elephant_equipment: "Armoured War Elephant Equipment"
chaosx_elephant_equipment_desc: "Harness, armour, weapons, and field stores for the Charter League's armoured war elephants."
chaosx_elephant_equipment_1: "Armoured War Elephant Equipment"
chaosx_elephant_equipment_1_desc: "A standardised harness of fitted armour, weapons, and field stores for the Charter League's largest trained elephants."
chaosx_africa_elephant_warfare_tech: "Charter Elephant Warfare"
chaosx_africa_elephant_warfare_tech_desc: "The protection charter establishes armoured elephant formations and extends their training and equipment standards to accepted members."

gorilla_heavy_infantry: "Gorilla Heavy Infantry"
gorilla_heavy_infantry_desc: "Armoured gorilla formations trained to break fortified positions and hold rough ground."
africa_gorilla_heavy_infantry_equipment: "Gorilla Heavy Infantry Equipment"
africa_gorilla_heavy_infantry_equipment_desc: "Armour, heavy weapons, field harnesses, and supplies for gorilla heavy infantry."
africa_gorilla_heavy_infantry_equipment_1: "Gorilla Heavy Infantry Equipment"
africa_gorilla_heavy_infantry_equipment_1_desc: "Standard equipment for an armoured gorilla heavy infantry formation."
africa_gorilla_heavy_infantry_tech: "Gorilla Heavy Infantry"
africa_gorilla_heavy_infantry_tech_desc: "Establishes the training, armour, and supply standards needed to field gorilla heavy infantry."

pan_sappers: "Pan Sappers"
pan_sappers_desc: "Small engineering teams trained for reconnaissance, demolition, and rapid repairs in difficult terrain."
africa_pan_sappers_equipment: "Pan Sapper Equipment"
africa_pan_sappers_equipment_desc: "Compact explosives, engineering tools, harnesses, and field supplies for Pan sappers."
africa_pan_sappers_equipment_1: "Pan Sapper Equipment"
africa_pan_sappers_equipment_1_desc: "Standard equipment for a Pan sapper team."
africa_pan_sappers_tech: "Pan Sappers"
africa_pan_sappers_tech_desc: "Organises Pan engineering teams for reconnaissance, demolition, and battlefield repair."

stone_cohorts: "Stone Cohorts"
stone_cohorts_desc: "Slow, heavily protected formations built to absorb fire and anchor a defensive line."
africa_stone_cohorts_equipment: "Stone Cohort Equipment"
africa_stone_cohorts_equipment_desc: "Reinforced fittings, heavy weapons, and field stores for the stone cohorts."
africa_stone_cohorts_equipment_1: "Stone Cohort Equipment"
africa_stone_cohorts_equipment_1_desc: "Standard equipment for a stone cohort."
africa_stone_cohorts_tech: "Stone Cohorts"
africa_stone_cohorts_tech_desc: "Creates the command and supply system needed to deploy stone cohorts."

riverborn: "Riverborn"
riverborn_desc: "Amphibious formations trained to cross rivers, marshes, and flooded ground at speed."
africa_riverborn_equipment: "Riverborn Equipment"
africa_riverborn_equipment_desc: "Waterproof weapons, flotation gear, and field stores for Riverborn formations."
africa_riverborn_equipment_1: "Riverborn Equipment"
africa_riverborn_equipment_1_desc: "Standard equipment for a Riverborn formation."
africa_riverborn_tech: "Riverborn Formations"
africa_riverborn_tech_desc: "Establishes amphibious training and supply standards for Riverborn formations."

forest_giants: "Forest Giants"
forest_giants_desc: "Massive infantry formations suited to jungle fighting, entrenchment, and close assault."
africa_forest_giants_equipment: "Forest Giant Equipment"
africa_forest_giants_equipment_desc: "Heavy weapons, armour, tools, and field stores for Forest Giant formations."
africa_forest_giants_equipment_1: "Forest Giant Equipment"
africa_forest_giants_equipment_1_desc: "Standard equipment for a Forest Giant formation."
africa_forest_giants_tech: "Forest Giant Formations"
africa_forest_giants_tech_desc: "Develops the command, protection, and supply methods needed to field Forest Giants."

oracle_recon: "Oracle Reconnaissance"
oracle_recon_desc: "Reconnaissance teams that combine field observation with supernatural warning."
africa_oracle_recon_equipment: "Oracle Reconnaissance Equipment"
africa_oracle_recon_equipment_desc: "Optics, radios, protective gear, and ritual instruments for oracle reconnaissance teams."
africa_oracle_recon_equipment_1: "Oracle Reconnaissance Equipment"
africa_oracle_recon_equipment_1_desc: "Standard equipment for an oracle reconnaissance team."
africa_oracle_recon_tech: "Oracle Reconnaissance"
africa_oracle_recon_tech_desc: "Integrates supernatural warning with conventional scouting and battlefield communications."

disaster_wardens: "Disaster Wardens"
disaster_wardens_desc: "Specialist formations trained to fight through storms, fires, floods, and shattered infrastructure."
africa_disaster_wardens_equipment: "Disaster Warden Equipment"
africa_disaster_wardens_equipment_desc: "Protective clothing, rescue tools, communications gear, and weapons for Disaster Wardens."
africa_disaster_wardens_equipment_1: "Disaster Warden Equipment"
africa_disaster_wardens_equipment_1_desc: "Standard equipment for a Disaster Warden formation."
africa_disaster_wardens_tech: "Disaster Wardens"
africa_disaster_wardens_tech_desc: "Creates specialist units able to operate during natural and supernatural disasters."

plague_carriers: "Plague Carriers"
plague_carriers_desc: "Contained biological assault formations whose deployment threatens soldiers and civilians alike."
africa_plague_carriers_equipment: "Plague Carrier Equipment"
africa_plague_carriers_equipment_desc: "Sealed containers, protective gear, and delivery equipment for Plague Carrier formations."
africa_plague_carriers_equipment_1: "Plague Carrier Equipment"
africa_plague_carriers_equipment_1_desc: "Standard containment and delivery equipment for a Plague Carrier formation."
africa_plague_carriers_tech: "Plague Carrier Formations"
africa_plague_carriers_tech_desc: "Establishes the containment, command, and delivery procedures used by Plague Carrier formations."
