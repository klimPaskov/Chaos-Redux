# Institutional leaders and advisors
utopia_manifesto_household_assembly: "Household Assembly"
utopia_manifesto_household_assembly_desc: "Delegates from municipalities and households govern through recorded consent, public guarantees, and the right of local petition."
utopia_manifesto_commonwealth_council: "Commonwealth Council"
utopia_manifesto_commonwealth_council_desc: "A second generation of municipal delegates carries the constitutional stores and voluntary compact beyond the founding assembly."
utopia_manifesto_council_of_callings: "Council of Callings"
utopia_manifesto_council_of_callings_desc: "Recallable delegates from farms, workshops, services, transport, learning, and defense govern through common mandates."
utopia_manifesto_rotating_congress: "Rotating Congress"
utopia_manifesto_rotating_congress_desc: "Successive council delegations share national authority through fixed mandates, public accounts, and regular recall."
utopia_manifesto_college_of_measure: "College of Measure"
utopia_manifesto_college_of_measure_desc: "A trained successor body preserves technical coordination while accepting responsibility for correction, appeal, and local evidence."
utopia_manifesto_stewardship_council: "Stewardship Council"
utopia_manifesto_stewardship_council_desc: "Guardians of stores, service, boundaries, and dependent places command the founding order of the Closed Island."
utopia_manifesto_directorate_of_service: "Directorate of Service"
utopia_manifesto_directorate_of_service_desc: "A permanent directorate assigns callings, protects the stores, and carries compulsory service into the second generation."
utopia_manifesto_interpreter: "Public Interpreter"
utopia_manifesto_interpreter_desc: "The Public Interpreter keeps rival readings before the country and translates doctrine into questions ordinary assemblies can judge."
utopia_manifesto_general_provisioner: "General Provisioner"
utopia_manifesto_general_provisioner_desc: "The General Provisioner joins production, transport, and reserve policy to the guarantees printed above every storehouse door."
utopia_manifesto_secretary_of_callings: "Secretary of Callings"
utopia_manifesto_secretary_of_callings_desc: "The Secretary records shortages, funds training, and negotiates the movement of skilled hands among the six callings."
utopia_manifesto_surveyor_of_shores: "Surveyor of Shores"
utopia_manifesto_surveyor_of_shores_desc: "The Surveyor tests ports, routes, settlements, and external cases against the country's real needs and available alternatives."
utopia_manifesto_civic_engineer: "Civic Engineer"
utopia_manifesto_civic_engineer_desc: "The Civic Engineer links housing, industry, transport, utilities, and defense works into districts that can survive practical strain."
utopia_manifesto_keeper_of_stores: "Keeper of Stores"
utopia_manifesto_keeper_of_stores_desc: "The Keeper maintains public inventories, rotation schedules, emergency releases, and the confidence carried by an honest reserve."
utopia_manifesto_league_envoy: "League Envoy"
utopia_manifesto_league_envoy_desc: "The League Envoy turns surplus, reconstruction, arbitration, and mutual defense into agreements among independent small places."
utopia_manifesto_advocate_of_limits: "Advocate of Limits"
utopia_manifesto_advocate_of_limits_desc: "The Advocate defends lawful exit, local consent, claim expiry, and the principle that public necessity must remain bounded."
utopia_manifesto_public_auditor: "Public Auditor"
utopia_manifesto_public_auditor_desc: "The Auditor follows promises into accounts, districts, contracts, and administered ground, publishing where the record fails."
utopia_manifesto_constitutional_jurist: "Constitutional Jurist"
utopia_manifesto_constitutional_jurist_desc: "The Jurist writes sunset clauses, appeals, and plural guarantees that keep useful institutions open to revision."
utopia_manifesto_council_organizer: "Council Organizer"
utopia_manifesto_council_organizer_desc: "The Organizer builds recallable representation across callings and keeps local mandates present in the national congress."
utopia_manifesto_social_workshop_planner: "Social Workshop Planner"
utopia_manifesto_social_workshop_planner_desc: "The Planner federates worker-run factories, repair halls, and equipment exchanges around common production needs."
utopia_manifesto_chief_surveyor: "Chief Surveyor"
utopia_manifesto_chief_surveyor_desc: "The Chief Surveyor turns household records, inventories, and transport flows into the national account used by the planners."
utopia_manifesto_standards_engineer: "Standards Engineer"
utopia_manifesto_standards_engineer_desc: "The Standards Engineer coordinates housing, rail, industry, and reserve works through designs that can be repeated and inspected."
utopia_manifesto_steward_of_service: "Steward of Service"
utopia_manifesto_steward_of_service_desc: "The Steward binds housing, rations, labor, and loyalty to compulsory service within the Closed Island."
utopia_manifesto_contract_broker: "Contract Broker"
utopia_manifesto_contract_broker_desc: "The Broker raises foreign auxiliaries, settles their equipment accounts, and manages the dangerous leverage carried by every contract."

# Achievements
utopia_manifesto_no_place_but_home_NAME: "No Place but Home"
utopia_manifesto_no_place_but_home_DESC: "Build a voluntary commonwealth whose bounded center rests on consent rather than conquest."
achievement_utopia_manifesto_no_place_but_home_tooltip: "Form the Voluntary Commonwealth and complete its island or city ring without an offensive war, an ultimatum, a coercive Necessary Ground case, or an Assigned Colony."
utopia_manifesto_need_not_greed_NAME: "Need, Not Greed"
utopia_manifesto_need_not_greed_DESC: "Prove that necessity can end a claim as surely as it begins one."
achievement_utopia_manifesto_need_not_greed_tooltip: "Complete the peaceful Necessary Ground proofs, renounce an obsolete case, and annex no territory unrelated to the stated need."
utopia_manifesto_every_calling_chosen_NAME: "Every Calling Chosen"
utopia_manifesto_every_calling_chosen_DESC: "Sustain every calling through choice, training, and trusted public institutions."
achievement_utopia_manifesto_every_calling_chosen_tooltip: "As the consent or practical route, sustain all six callings without shortages, keep Assignment low, maintain strong Concord and Plenty, and avoid assignment overreach."
utopia_manifesto_two_year_table_NAME: "The Two-Year Table"
utopia_manifesto_two_year_table_DESC: "Carry the common table through a severe challenge without emptying its long reserve."
achievement_utopia_manifesto_two_year_table_tooltip: "Establish two-year security, survive the severe reserve challenge, retain at least a two-year reserve, and never reset the reserve proof."
utopia_manifesto_archipelago_of_small_places_NAME: "An Archipelago of Small Places"
utopia_manifesto_archipelago_of_small_places_DESC: "Let five independent places carry common obligations without becoming possessions."
achievement_utopia_manifesto_archipelago_of_small_places_tooltip: "Form a nonclosed commonwealth as an independent country, prove a five-member league, and neither annex nor coerce a member."
utopia_manifesto_inland_island_NAME: "The Inland Island"
utopia_manifesto_inland_island_DESC: "Make a bounded center far from any coast and keep its stores open through the trial."
achievement_utopia_manifesto_inland_island_tooltip: "Begin landlocked, complete the Inland Island path and its supply challenge, form the commonwealth, and gain no early coast."
utopia_manifesto_gold_for_common_use_NAME: "Gold for Common Use"
utopia_manifesto_gold_for_common_use_DESC: "Make luxury stock pay for real provision while the common stores remain abundant."
achievement_utopia_manifesto_gold_for_common_use_tooltip: "Use luxury stock to finance common provision, reach high Plenty and lower Need, and leave Provisioning and Agriculture without a shortage."
utopia_manifesto_the_joke_understood_NAME: "The Joke Understood"
utopia_manifesto_the_joke_understood_DESC: "Build a practical commonwealth that keeps the right to laugh at its own perfection."
achievement_utopia_manifesto_the_joke_understood_tooltip: "Form the Practical Commonwealth, preserve public debate, prove a consensual partner and final district network, and use no penal labor, Assigned Colonies, censorship, or official dogma."
utopia_manifesto_consent_of_the_governed_NAME: "Consent of the Governed"
utopia_manifesto_consent_of_the_governed_DESC: "Settle the status of administered people through a vote that does not need repeating."
achievement_utopia_manifesto_consent_of_the_governed_tooltip: "As the consent or practical route, prove the status votes and form the commonwealth without repeated voting, Assigned Colonies, or colonial repression."
utopia_manifesto_the_perfect_measure_NAME: "The Perfect Measure"
utopia_manifesto_the_perfect_measure_DESC: "Join five kinds of planned district to abundance without allowing the survey to become scripture."
achievement_utopia_manifesto_the_perfect_measure_tooltip: "Form the Commonwealth of Measure, prove five district roles, maintain strong Plenty and Concord, and avoid both a data scandal and an assignment revolt."
utopia_manifesto_closed_circle_NAME: "The Closed Circle"
utopia_manifesto_closed_circle_DESC: "Complete the island at the end of ordinary order and survive what presses against its gates."
achievement_utopia_manifesto_closed_circle_tooltip: "Form the Closed Island, complete its capstone and separation project, survive a major war at final chaos, hold surplus reserves and high Assignment, and neither reopen nor collapse."
utopia_manifesto_no_foreign_hands_NAME: "No Foreign Hands"
utopia_manifesto_no_foreign_hands_DESC: "Defeat the stronger attacker without passing the cost to contracted soldiers."
achievement_utopia_manifesto_no_foreign_hands_tooltip: "Defeat a stronger attacker without hiring auxiliaries, carrying an active auxiliary dependency, using auxiliary forces, or abusing their service."
utopia_manifesto_the_stores_remain_NAME: "The Stores Remain"
utopia_manifesto_the_stores_remain_DESC: "Let a commonwealth fail, recover, and prove that its public institutions can outlive the crisis."
achievement_utopia_manifesto_the_stores_remain_tooltip: "Enter the founding crisis, prove recovery, form the commonwealth with adequate Plenty and Concord, retain the store network, and neither abandon the institutions nor repeal them entirely."
utopia_manifesto_no_one_in_chains_NAME: "No One in Chains"
utopia_manifesto_no_one_in_chains_DESC: "Form a commonwealth whose associates, households, and workers retain a path out."
achievement_utopia_manifesto_no_one_in_chains_tooltip: "As the consent, common table, or practical route, form the commonwealth and prove an associate or protected autonomy without penal labor, Assigned Colonies, confinement, forced households, forced relocation, or colonial repression."

