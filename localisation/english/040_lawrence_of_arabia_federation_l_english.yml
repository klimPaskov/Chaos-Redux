chaos_redux_040_desert_conference_tooltip: "As an independent player government in a counter-bloc of at least §Y[?constant:lawrence_system.bloc_minimum|0]§! members that Britain recognises, end the regional campaign by negotiated settlement."
chaos_redux_040_rails_ports_promises_tooltip: "As Britain, finish a settlement with a sea route open, the rail link repaired and the Desert Air Route established, after at least one target has been resolved."
chaos_redux_040_gold_without_chains_NAME: "Gold Without Chains"
chaos_redux_040_gold_without_chains_DESC: "Take British money and arms, then help found the Arab Federation without becoming a British subject."
chaos_redux_040_gold_without_chains_tooltip: "As an Arabian government under a player, receive at least §Y[?constant:lawrence_fed.gold_receipts|0]§! British shipments, then ratify or lead the Arab Federation while not a subject of Britain."
chaos_redux_040_uncrowned_kingdom_NAME: "The Uncrowned Kingdom"
chaos_redux_040_uncrowned_kingdom_DESC: "Host Lawrence, call the congress of the founding houses and lead the Arabian Union without a British overlord."
chaos_redux_040_uncrowned_kingdom_tooltip: "As the player government that hosts Lawrence after his defection, call the congress of the founding houses and form the Arabian Union while not a subject of Britain."
