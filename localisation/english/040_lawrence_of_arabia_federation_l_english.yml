lawrence_fed_offices_tt: "One level of infrastructure is built in the capital state and in one founding state. Federal Authority rises by §Y[?constant:lawrence_fed.offices_authority|0]§!. Available again after §Y[?constant:lawrence_fed.offices_cooldown_days|0]§! days."
