l_english:
# ---------------------------------------------------------------------------
# News
# ---------------------------------------------------------------------------
chaosx.nr40.41.t: "Britain's Clients Sign a Charter"
chaosx.nr40.41.d: "Delegates of [?global.lawrence_fed_core.GetNameDef] and the neighbouring governments that depend on Britain have signed a federal charter in a hall lent by the British High Commission. The federation has its own ministries and its own army, and London's fleet, loans and officers stay close. Newspapers in Cairo, Baghdad and Jerusalem cannot agree whether it is a union or an arrangement."
chaosx.nr40.41.a: "The region reads on."
chaosx.nr40.42.t: "An Arab Federation Is Proclaimed"
chaosx.nr40.42.d: "Delegates of [?global.lawrence_fed_core.GetNameDef] and the governments that joined its congress have proclaimed a federation under a charter they wrote themselves. The charter names no foreign adviser, guarantees every member its courts and asks Britain for a treaty and nothing more. London has sent a polite telegram."
chaosx.nr40.42.a: "The charter is read aloud."
chaosx.nr40.43.t: "The Arabian Union"
chaosx.nr40.43.d: "A union has been proclaimed in [?global.lawrence_fed_core.GetNameDef], chaired by T. E. Lawrence beside the founding houses of its members. The charter lists the houses, the army and the council, in that order. Foreign ministries are asking whether it is a state, a mandate or an experiment."
chaosx.nr40.43.a: "The region reads on."

# ---------------------------------------------------------------------------
# Britain's stance and the congress
# ---------------------------------------------------------------------------
chaosx.nr40.130.t: "A Federation of Britain's Friends?"
chaosx.nr40.130.d: "The Foreign Office reports that the governments touched by the mission now talk of a single federation. Clients, allies and independent ministers have all asked what London will do. A federation under British sponsorship would be stable and expensive, a free federation would owe London nothing and an open refusal would be remembered."
chaosx.nr40.130.a: "Sponsor a federation."
chaosx.nr40.130.a_tt: "Britain can call a congress of its clients and allies in the §YThe Arabian Federation§! category. The federation that follows is a British dominion. Britain's credibility rises by §Y[?constant:lawrence_fed.stance_credibility|0]§!."
chaosx.nr40.130.b: "Stand aside."
chaosx.nr40.130.b_tt: "Britain calls no congress. Other congresses owe it nothing and British subjects may join them. Britain's credibility rises by §Y[?constant:lawrence_fed.stance_credibility|0]§!."
chaosx.nr40.130.c: "Oppose any federation."
chaosx.nr40.130.c_tt: "British subjects cannot join a congress that Britain does not call. Britain's credibility falls by §Y[?constant:lawrence_fed.stance_oppose_credibility|0]§!."
chaosx.nr40.132.t: "A Congress Is Called"
chaosx.nr40.132.d: "A congress of governments of the region has been called without London's invitation. The Foreign Office has the invitation list and the draft charter. The charter gives the members a seat in an assembly and names no British adviser."
chaosx.nr40.132.a: "Note the list."
chaosx.nr40.120.t: "An Invitation to Ratify the Charter"
chaosx.nr40.120.d_british: "A congress called by Britain asks [Root.GetNameDef] to ratify a federal charter. The charter would join the clients and allies of London in one federation with a seat in an assembly and a share of the revenue. British officers promise equipment and a guarantee. The cabinet is divided on what the promise will cost."
chaosx.nr40.120.d_sovereign: "A congress of governments that resisted British missions asks [Root.GetNameDef] to ratify a federal charter. No foreign adviser sits in the hall and the charter promises every member its laws, courts and army. The risk is that a federation led by a stronger neighbour leaves the members with fewer rights than the charter promises."
chaosx.nr40.120.d_kingdom: "The government that hosts T. E. Lawrence has called a congress and asks [Root.GetNameDef] to ratify a charter. The founding houses keep their seats, a council chairs the federation and Lawrence has written in public that the charter binds him first. Several ministers doubt that a union can rest on one man."
chaosx.nr40.120.a: "Ratify the charter."
chaosx.nr40.120.a_tt: "[Root.GetNameDef] is counted among the founding members. If the congress succeeds, an AI member joins the new state and a player member becomes an autonomous dominion of it."
chaosx.nr40.120.b: "Decline to ratify."
chaosx.nr40.120.b_tt: "The government stays outside the federation and keeps its independence."
chaosx.nr40.121.t: "Judgement of the Congress"
chaosx.nr40.133.t: "The Congress Closes Without a Charter"
chaosx.nr40.133.d_few: "Fewer than [?constant:lawrence_fed.minimum_members|0] governments ratified the charter, and a federation that small has no assembly to speak of. The delegates have gone home. The caller may try again after the season."
chaosx.nr40.133.d_britain: "London can no longer act as the sponsor it promised to be, and the delegates would not sign a charter whose guarantor cannot keep its word. The congress has closed without a federation."
chaosx.nr40.133.d_subject: "The strongest ratifying government is still a subject of another power, and the delegates would not accept a sovereign federation led from a dependency. The congress has closed without a federation."
chaosx.nr40.133.d_lawrence: "The host could not show that Lawrence was free to serve, and the houses declined to sign beside a man whose standing was in doubt. The congress has closed without a union."
chaosx.nr40.133.d_war: "Two of the ratifying governments are at war with each other and refused to sit under one flag. The congress has closed without a federation."
chaosx.nr40.133.d_core: "No ratifying government was strong enough to carry the federation's government. The congress has closed without a federation."
chaosx.nr40.133.a: "The delegates go home."
chaosx.nr40.133.a_tt: "No state, army or border has changed. The caller cannot call another congress for §Y[?constant:lawrence_fed.cooldown_days|0]§! days. After a failed sovereign or personal congress the delegates keep a looser league and its members gain a modest bonus for a year."

# ---------------------------------------------------------------------------
# After formation
# ---------------------------------------------------------------------------
chaosx.nr40.135.t: "The Federation Exists"
chaosx.nr40.135.d_british: "The federation is a British dominion. [Root.GetNameDef] chairs its council, London's fleet guards its ports and the ministries of the founding members sit in rooms that still smell of fresh paint. The administration is uneven, the commands are rival and the promises made in the congress are debts that must now be paid."
chaosx.nr40.135.d_sovereign: "The federation is sovereign. [Root.GetNameDef] chairs its council and the founding members hold seats in an assembly of their own choosing. The administration is uneven, the commands are rival and every member watches the centre for a sign that the charter is a mask for domination."
chaosx.nr40.135.d_kingdom: "The union is proclaimed. [Root.GetNameDef] chairs its council and T. E. Lawrence sits in it beside the founding houses. The administration is uneven, the commands are rival and every house wants to know what the union will do when its chairman is gone."
chaosx.nr40.135.a: "Open the federal charter."
chaosx.nr40.135.a_tt: "Federal Authority is §Y[?lawrence_federal_authority|0]§!. The §YThe Arabian Federation§! decision category opens and the federation focus tree is loaded."
chaosx.nr40.136.t: "The Federation Is Formed"
chaosx.nr40.136.d_british: "The federation of Britain's clients now exists as a dominion. It will pay what it owes and ask for what it is owed."
chaosx.nr40.136.d_sovereign: "The federation is sovereign. It has not asked London's leave and it has not refused London's friendship. The Foreign Office is considering what a neighbour that owes it nothing will want."
chaosx.nr40.136.d_kingdom: "A union of the founding houses with T. E. Lawrence as chairman has been proclaimed. The Foreign Office has not decided whether to claim him, disown him or let the newspapers decide."
chaosx.nr40.136.a: "Take note."
chaosx.nr40.140.t: "The Federal Tick"
chaosx.nr40.141.t: "Administrative Secession"
chaosx.nr40.141.d: "Members have stopped sending revenue and have begun to reject federal orders. The cabinet calls it an administrative secession and asks whether the centre can still govern. Months of weak authority led here."
chaosx.nr40.141.a: "Hold the federation together."
chaosx.nr40.141.a_tt: "The administration worsens into §YAdministrative Secession§!. Federal Authority falls faster until it recovers to the working band, and then the administration is restored."
chaosx.nr40.150.t: "An Invitation to Join the Federation"
chaosx.nr40.150.d: "The federation asks [Root.GetNameDef] to accept its charter. The government would keep its army, its courts and a seat in the assembly as an autonomous dominion. The cabinet is divided."
chaosx.nr40.150.a: "Accept membership."
chaosx.nr40.150.a_tt: "[Root.GetNameDef] becomes an autonomous dominion of the federation and Federal Authority rises by §Y[?constant:lawrence_fed.member_authority|0]§!."
chaosx.nr40.150.b: "Decline."
chaosx.nr40.150.b_tt: "Nothing changes."

# ---------------------------------------------------------------------------
# Super events 140 to 142 (title, text and button; no quote exists yet)
# ---------------------------------------------------------------------------
chaosx_super_event.140.t: "British Arabia"
chaosx_super_event.140.d: "The congress called by London has closed. [?global.lawrence_fed_core.GetNameDef], with the governments that ratified the charter, is now one federation under British sponsorship. Its ministries share a hall, its officers share a staff list and its debts share a creditor."
chaosx_super_event.140.a: "Read the charter."
chaosx_super_event.141.t: "The Arab Federation"
chaosx_super_event.141.d: "The congress has closed. [?global.lawrence_fed_core.GetNameDef], with the governments that ratified the charter, is now a sovereign federation under a document its members wrote themselves. The flags of the delegations are lowered in the hall and one flag is raised. Its first act is to ask each member what it will keep."
chaosx_super_event.141.a: "Read the charter."
chaosx_super_event.142.t: "The Arabian Union"
chaosx_super_event.142.d: "The congress has closed. [?global.lawrence_fed_core.GetNameDef], with the governments that ratified the charter, is now a union under a council of the founding houses with T. E. Lawrence in the chair. Officers, headmen and ministers have sworn the same oath, and the council has not yet agreed who will chair it after him."
chaosx_super_event.142.a: "Read the charter."

