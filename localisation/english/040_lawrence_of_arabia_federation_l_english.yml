# National spirits
# ---------------------------------------------------------------------------
lawrence_uneven_administration: "Uneven Administration"
lawrence_uneven_administration_desc: "Laws, ministries, customs, records and currencies differ from member to member. A federal census, a customs line, regional offices and a revenue agreement will replace it."
lawrence_administrative_secession: "Administrative Secession"
lawrence_administrative_secession_desc: "Members refuse revenue and law. Authority must recover to the working band before the administration can be restored."
lawrence_rival_commands: "Rival Commands"
lawrence_rival_commands_desc: "British-trained units, member armies and irregular leaders each answer to their own chiefs. A federal staff, a war council or a seniority settlement will replace it."
lawrence_promise_debt: "Promise Debt"
lawrence_promise_debt_desc: "The guarantees made by London are wider than the clients' confidence in them. The compact or a demand for equal partnership will settle it."
lawrence_federal_mistrust: "Federal Mistrust"
lawrence_federal_mistrust_desc: "Members doubt that the centre will respect the charter. Guarantees, a cabinet and recognition abroad will settle it."
lawrence_personal_settlement: "Personal Settlement"
lawrence_personal_settlement_desc: "The union depends on one chairman and on the goodwill of the founding houses. A succession will settle it."
lawrence_central_administration: "Central Federal Administration"
lawrence_central_administration_desc: "Ministries answer to the capital and courts apply one code."
lawrence_charter_administration: "Charter Administration"
lawrence_charter_administration_desc: "Members keep their courts and revenue offices under the charter, and nobody leaves."
lawrence_imperial_liaison_administration: "Imperial Liaison Administration"
lawrence_imperial_liaison_administration_desc: "British advisers sit in federal offices and the budget is audited by experts."
lawrence_unified_arab_general_staff: "Unified Arab General Staff"
lawrence_unified_arab_general_staff_desc: "One staff plans for every member army."
lawrence_federal_war_council: "Federal War Council"
lawrence_federal_war_council_desc: "Member chiefs decide plans by vote and keep their regional commands."
lawrence_british_arabian_command: "British Arabian Command"
lawrence_british_arabian_command_desc: "British-trained staff run the federal army with weapons and doctrine from London."
lawrence_field_household: "Lawrence's Field Household"
lawrence_field_household_desc: "A small staff of liaison officers and signal men carries orders between the commands."
lawrence_imperial_compact: "Imperial Compact"
lawrence_imperial_compact_desc: "The compact sets out what Britain lends and what the federation pays, in writing."
lawrence_equal_partnership: "Equal Partnership"
lawrence_equal_partnership_desc: "The federation sits as an equal at British tables and answers to its own assembly."
lawrence_charter_trust: "Charter Trust"
lawrence_charter_trust_desc: "Members trust the centre to respect the charter because it has done so."
lawrence_succession_settlement: "Succession Settlement"
lawrence_succession_settlement_desc: "The charter names who follows the chairman and the houses have accepted the rule."
lawrence_authority_fragile: "Fragile Authority"
lawrence_authority_fragile_desc: "The centre cannot collect revenue, enforce the charter or speak for the members."
lawrence_authority_weak: "Weak Authority"
lawrence_authority_weak_desc: "The centre carries out some decisions and bargains over the rest."
lawrence_authority_working: "Working Authority"
lawrence_authority_working_desc: "The centre collects revenue, coordinates defence and enforces the charter."
lawrence_authority_strong: "Strong Authority"
lawrence_authority_strong_desc: "The centre can carry out a decision against the wishes of a member."
lawrence_arab_league: "Arab League"
lawrence_arab_league_desc: "The delegates of a failed congress keep a looser league with shared embassies and visa rules."
lawrence_pillar_of_british_strategy: "Pillar of British Strategy"
lawrence_pillar_of_british_strategy_desc: "British air routes, bunkers and fuel depots are run under federal flags."
lawrence_sovereign_arab_order: "Sovereign Arab Order"
lawrence_sovereign_arab_order_desc: "The federation sits at the head of a recognised order of Arab states."
lawrence_kingdom_after_lawrence: "The Union After Lawrence"
lawrence_kingdom_after_lawrence_desc: "The council of the founding houses holds the office and Lawrence returns to the field."
lawrence_federation_of_members: "Federation of Members"
lawrence_federation_of_members_desc: "Members keep their armies in reserve and share a treasury, a foreign service and a charter."
lawrence_one_federal_state: "One Federal State"
lawrence_one_federal_state_desc: "The members' governments have merged into the federation over the objection of their own politicians."

