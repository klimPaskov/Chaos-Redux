lawrence_fed_staff_tt: "Counts as one step towards resolving §YRival Commands§!. Federal Authority rises by §Y[?constant:lawrence_fed.staff_authority|0]§!. Available again after §Y[?constant:lawrence_fed.staff_cooldown_days|0]§! days, up to §Y[?constant:lawrence_fed.command_progress_max|0]§! times."
lawrence_open_regional_offices: "Open Regional Offices"
