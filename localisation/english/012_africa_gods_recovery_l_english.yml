l_english:
gods_of_africa_restore_original_mandate: "Reconvene the Continental Mandate"
gods_of_africa_restore_original_mandate_desc: "Africa's original government has survived its defeat, but its right to command tribute needs the consent of its continental members. Reconvene the congress and invite the countries that still uphold the Charter."
gods_of_africa_invite_original_mandate_member: "Invite [From.GetName] to Renew the Mandate"
gods_of_africa_invite_original_mandate_member_desc: "Ask [From.GetName] to support Africa's return to tribute authority. Each member can accept or refuse, and can change its answer until consolidation ends. Current approvals: [Root.GetGodsOfAfricaRecoveryApprovedCount] of [Root.GetGodsOfAfricaRecoveryEligibleCount] eligible members."
gods_of_africa_finish_original_mandate: "Ratify the Restored Mandate"
gods_of_africa_finish_original_mandate_desc: "The congress must support renewed authority through a strict majority of its current eligible members, with at least [Root.GetGodsOfAfricaRecoveryMinimumApprovals] approvals. Current approvals: [Root.GetGodsOfAfricaRecoveryApprovedCount] of [Root.GetGodsOfAfricaRecoveryEligibleCount]. Ratification begins [Root.GetGodsOfAfricaRecoveryConsolidationDays] days of consolidation."
gods_of_africa_resume_original_mandate: "Resume continental obligations"
gods_of_africa_resume_original_mandate_desc: "Resume the current compact's due obligations once Africa is not capitulated, owns and controls its capital, and has satisfied its first proof. A restored mandate must retain enough current member support for consolidation to conclude."
gods_of_africa_approve_original_mandate: "Support Africa's Restored Mandate"
gods_of_africa_approve_original_mandate_desc: "[africa_host.GetName] asks us to support the return of its continental tribute authority. Our consent counts while our current Charter relationship remains cooperative and we remain at peace with Africa. We may withdraw support until consolidation ends."
gods_of_africa_decline_original_mandate: "Refuse Africa's Restored Mandate"
gods_of_africa_decline_original_mandate_desc: "Withhold our support for Africa's renewed tribute authority. We may reconsider while the congress or its consolidation remains open."
gods_of_africa_recovery_member_category_desc: "[africa_host.GetName] has invited us to renew its continental mandate. Our response determines whether Africa has the current consent needed to restore its tribute authority."
gods_of_africa_recovery_start_requirement_tt: "Africa's surviving original government leads the continental union, is not capitulated, owns and controls its capital, and has satisfied its first proof. Its tribute mandate remains unsettled, and at least [Root.GetGodsOfAfricaRecoveryMinimumApprovals] current Charter, autonomous federal, or integrated members are eligible to support its renewal."
gods_of_africa_recovery_invite_requirement_tt: "The original host's current congress or consolidation is open, and [From.GetName] is an existing, uncapitulated current Charter, autonomous-federal, or integrated member at peace with Africa. A country exempt after defeating Africa cannot supply this mandate."
gods_of_africa_recovery_finish_requirement_tt: "The surviving original government is not capitulated, owns and controls its capital, and has satisfied its first proof. At least [Root.GetGodsOfAfricaRecoveryMinimumApprovals] eligible members must approve, with more than half of all current eligible members in favour. Current approvals: [Root.GetGodsOfAfricaRecoveryApprovedCount] of [Root.GetGodsOfAfricaRecoveryEligibleCount]."
gods_of_africa_recovery_resume_requirement_tt: "The current mandate is valid and a continental obligation is due."
gods_of_africa_recovery_member_requirement_tt: "Our invitation concerns the surviving original government's current mandate. We remain an eligible cooperative member at peace with Africa and have no tribute response, negotiation, or reconciliation to resolve."
gods_of_africa_recovery_start_effect_tt: "Reconvene the congress and invite current members to support renewed tribute authority. Tribute remains suspended until ratification and consolidation are complete."
gods_of_africa_recovery_invite_effect_tt: "Invite [From.GetName] to approve or refuse renewed tribute authority. Its answer supplies consent only while its current relationship remains eligible."
gods_of_africa_recovery_finish_effect_tt: "Ratify the restored mandate and begin [Root.GetGodsOfAfricaRecoveryConsolidationDays] days of consolidation. Current member consent will be checked again when consolidation ends. Africa retains its established doctrine, and countries exempt after defeating Africa retain their exemption."
gods_of_africa_recovery_resume_effect_tt: "Resume the current compact's due obligations. Its authority and existing completion dates remain in force."
gods_of_africa_recovery_approve_effect_tt: "Support the current continental mandate. Consent may be withdrawn until consolidation ends and remains valid only while our current relationship is eligible."
gods_of_africa_recovery_decline_effect_tt: "Withhold consent and withdraw any approval of the current mandate. Africa cannot count our country toward its required majority."
gods_of_africa_recovery_eligible_display: "[?gods_of_africa_recovery_eligible_count|0]"
gods_of_africa_recovery_approved_display: "[?gods_of_africa_recovery_approved_count|0]"
gods_of_africa_recovery_days_display: "[?gods_of_africa_recovery_display_days|0]"
gods_of_africa_recovery_minimum_display: "[?gods_of_africa_recovery_display_minimum|0]"

gods_of_africa_recovery_host_category_desc: "The surviving African unifier must renew its continental mandate before tribute returns. Invite current members and secure their consent. Physical recovery alone does not restore the compact."
gods_of_africa_recovery_consolidation_category_desc: "The continental congress has renewed the mandate. The compact must complete [Root.GetGodsOfAfricaRecoveryConsolidationDays] days of consolidation with current member consent intact."

africa.event_log.gods.original_host_recovery.title: "Africa's restored mandate ratified"
africa.event_log.gods.original_host_recovery.detail: "Current continental members have renewed the surviving African unifier's mandate. Tribute authority awaits consolidation and continued consent. Countries exempt after defeating Africa retain their exemption until they request and receive separate recognition."
