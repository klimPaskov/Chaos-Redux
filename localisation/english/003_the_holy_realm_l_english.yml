holy_realm_chaos_value_final: "§R[?global.chaos_meter_value|.0]§!"
THR_status_value_row_tt: "These measures show the Realm's strength and restraint."
THR_status_spiritual_legitimacy: "§GSpiritual Legitimacy§!: §Y[?spiritual_legitimacy|.0]§!"
THR_status_spiritual_legitimacy_desc: "The Realm earns trust through mercy, peaceful unity, and missions that keep their promises. Broken vows and failed doctrine weaken that trust."
THR_status_compassion_drift: "§OCompassion Drift§!: §Y[?compassion_drift|.0]§!"
THR_status_compassion_drift_desc: "Harsh vows, forced pacification, and sealed doctrine deepen Compassion Drift. Relief, mercy councils, and honest inquiry ease it."
THR_status_mandala_reach: "§CMandala Reach§!: §Y[?mandala_reach|.0]§!"
THR_status_mandala_reach_desc: "Peace letters, pilgrim roads, successful missions, and peaceful submissions carry the Realm's influence abroad. Wider ties let the Mandala approach more distant courts.\n\n[GetHolyRealmMandalaReachSourceLine]"
holy_realm_mandala_reach_source_refuge: "Reach comes mostly from refuge administration, pass roads, and early Bodhisattva missions."
holy_realm_mandala_reach_source_himalayan: "Reach comes from Himalayan consolidation, refuge law, and regional administration."
holy_realm_mandala_reach_source_letters: "Reach comes from peace letters, submitted border states, pilgrim roads, and Mandala envoys."
holy_realm_mandala_reach_source_faction: "Reach comes from Mandala of Nations members, relief offices, development missions, and peacekeeping work."
holy_realm_mandala_reach_source_world: "Distant courts hear the Realm's demands, and nearby governments weigh its growing power."
THR_status_sealed_ledger: "[GetHolyRealmFinalPressureLine]"
THR_status_sealed_ledger_desc: "Nuclear preparation, coercive doctrine, and Divine Sovereignty raise Final Silence Pressure. Mercy, renunciation, and the Vow against Annihilation lower it. At §Y45§!, §Y55§!, §Y65§!, and §Y75§!, the Realm can prepare another part of the rite."
holy_realm_mandala_final_pressure_locked: "Final Silence Pressure: §glocked§!"
holy_realm_mandala_final_pressure_veiled: "Final Silence Pressure: §Y[?final_silence_pressure|.0]§!"
holy_realm_mandala_final_pressure_revealed: "Final Silence Pressure: §R[?final_silence_pressure|.0]§!"
holy_realm_mandala_warning_calm: "Final Silence Pressure is quiet, and the late doctrine decisions remain closed."
holy_realm_mandala_warning_quiet: "No final order has left the mountain. Guarded doors and sealed launches have unsettled the valleys."
holy_realm_mandala_warning_open: "Final notices have gone out. Final Silence Pressure is high."
holy_realm_mandala_warning_active: "Final Silence has begun."
