holy_realm_panel_tab_warnings_short: "Alert"
holy_realm_panel_tab_refuge_tt: "Shelter, relief, and pass actions. Shows Spiritual Legitimacy and global Chaos."
holy_realm_panel_tab_arhats_tt: "Arhat oversight and civil administration. Shows Compassion Drift."
holy_realm_panel_tab_diplomacy_tt: "Envoys, mediation, aid, and compact actions. Shows Mandala Reach."
holy_realm_panel_tab_doctrine_tt: "Doctrine choices and pressure actions. Shows Final Silence Pressure and the doctrine balance."
holy_realm_panel_tab_warnings_tt: "Foreign notices, final preparations, and launch actions. Shows Final Silence Pressure and Chaos."
holy_realm_panel_tab_refuge_text: "Families cross the passes seeking safety. The Realm can shelter them, count them, or close the roads and preserve its stores."
holy_realm_panel_tab_arhats_text: "The Arhats govern the civil service. Their inquiries can restrain abuses, while sealed doctrine gives oath-bound officials more power over food, roads, and village petitions."
holy_realm_panel_tab_diplomacy_text: "Pilgrims, envoys, and peacekeepers carry the Realm's influence beyond the passes. Neighboring governments may welcome its courts or defend their borders.\n[GetHolyRealmPanelConquestLine]"
holy_realm_panel_tab_doctrine_text: "[GetHolyRealmPanelDoctrineLine]"
holy_realm_panel_tab_warnings_text: "[GetHolyRealmWarningLine]"
holy_realm_foreign_response_category: "Holy Realm Containment"
holy_realm_foreign_response_category_desc: "Foreign governments can answer the Holy Realm once sealed notices have gone out or Final Silence has begun."
holy_realm_expansion_category: "Letters of Peace and Authority"
holy_realm_expansion_category_desc: "Envoys ask the border courts to join the Realm. Peaceful acceptance brings protection and integration. A refusal may push the Arhats toward force."
holy_realm_doctrine_balance_category: "Vow and Final Silence"
holy_realm_doctrine_balance_category_desc: "The late Realm pulls between the Vow against Annihilation and Final Silence. Each decision here costs Political Power and moves the balance toward one side."
holy_realm_final_doctrine_balance: "Vow and Final Silence"
holy_realm_vow_against_annihilation_side: "Vow against Annihilation"
holy_realm_final_silence_side: "Final Silence"
holy_realm_balance_middle_path_range: "Unsettled Doctrine"
holy_realm_vow_influence_range: "Vow Influence"
holy_realm_vow_dominant_range: "Vow Dominant"
holy_realm_final_silence_influence_range: "Final Silence Influence"
holy_realm_final_silence_dominant_range: "Final Silence Dominant"
holy_realm_balance_middle_path_range_tt: "The doctrine is still contested. Stability and Political Power gain rise modestly."
holy_realm_vow_influence_range_tt: "The Vow shapes policy. Stability and Political Power gain rise. Final Silence Pressure falls slowly each day, and offensive wars cost extra stability."
holy_realm_vow_dominant_range_tt: "The Vow rules late doctrine. Stability and Political Power gain rise sharply. Final Silence Pressure and Compassion Drift fall each day, defensive wars are easier to bear, and offensive wars cost heavy stability."
holy_realm_final_silence_influence_range_tt: "Final Silence shapes policy. Political Power gain, War Support, and nuclear production rise. Final Silence Pressure and Compassion Drift climb slowly each day."
holy_realm_final_silence_dominant_range_tt: "Final Silence rules late doctrine. Political Power gain, War Support, nuclear production, and reactor construction speed rise sharply. Final Silence Pressure and Compassion Drift climb each day, and the darkest final focuses become available."
THR_bop_mercy_council: "Convene a Mercy Council"
THR_bop_mercy_council_desc: "Give mercy doctrine a standing council. Moves the balance toward the Vow, lowers Final Silence Pressure and Compassion Drift, raises Spiritual Legitimacy, and slightly improves stability. The first council also lowers Chaos."
THR_bop_mercy_council_effect_tt: "Moves the doctrine balance toward the Vow. Lowers Final Silence Pressure and Compassion Drift, raises Spiritual Legitimacy, and slightly improves stability. The first council also lowers Chaos."
THR_bop_open_lotus_audit: "Open the Lotus Audit"
THR_bop_open_lotus_audit_desc: "Audit the Arhats and the outer monasteries so mercy outlasts the sealed doctrine. Requires Final Silence Pressure above §Y15§! or Mandala Reach above §Y20§!. Moves the balance toward the Vow, lowers Final Silence Pressure, and returns §Y16§! Political Power.\n\nMandala Reach above §Y20§! also raises Mandala Reach and lowers Compassion Drift and Chaos. With the final path open and the doctrine unarmed, Pressure above §Y35§! publishes the names of the lost: Spiritual Legitimacy rises, War Support falls, and the balance moves further. Pressure above §Y55§! turns the audit into the White Mandala Oath, a sharp move toward the Vow that lowers Compassion Drift and restores stability. Spiritual Legitimacy above §Y45§! on the final path puts the Vow-keepers on the checkpoints, which adds Command Power and a little stability."
THR_bop_open_lotus_audit_effect_tt: "Moves the doctrine balance toward the Vow and lowers Final Silence Pressure. Returns §Y16§! Political Power. Higher tiers add Mandala Reach, Spiritual Legitimacy, stability, Command Power, and a sharper move toward the Vow, as the description lists."
THR_bop_open_lotus_audit_gate_tt: "Requires Final Silence Pressure above §Y15§! or Mandala Reach above §Y20§!."
THR_bop_last_resort_clause: "Adopt the Last-Resort Clause"
THR_bop_last_resort_clause_desc: "Write an emergency doctrine into law without arming Final Silence. Moves the balance toward Final Silence and raises Final Silence Pressure and Compassion Drift. Chaos above §Y250§!, Mandala Reach above §Y15§!, or Compassion Drift above §Y15§! grants Command Power. During Arhat Administration, secret inquiries (Spiritual Legitimacy above §Y30§! or Compassion Drift above §Y25§!) grant more.\n\nWith the Buddha Mandate, Mandala Reach above §Y35§! opens border silence offices that raise Mandala Reach and War Support, and Chaos above §Y500§! treats force as a lawful extension of mercy: the balance moves further and Chaos rises. Unavailable once Final Silence is renounced."
THR_bop_last_resort_clause_effect_tt: "Moves the doctrine balance toward Final Silence. Raises Final Silence Pressure and Compassion Drift and grants Command Power. Higher tiers add Mandala Reach, War Support, Chaos, and a sharper move toward Final Silence, as the description lists."
THR_bop_final_command_drills: "Final Command Drills"
THR_bop_final_command_drills_desc: "Train the launch crews and ministries for the final order. Requires the final path. Moves the balance toward Final Silence, raises Final Silence Pressure, and grants Command Power.\n\nPressure above §Y30§! brings in the Nuclear Sutra Committee, which moves the balance further, raises Chaos, and grants more Command Power. Pressure above §Y55§! with Mandala Reach above §Y50§! adds silence cells for the strongest move. Mandala Reach above §Y35§! also sends silent transit codes to the doctrine offices, which raise Mandala Reach and War Support. Unavailable once Final Silence is renounced."
THR_bop_final_command_drills_effect_tt: "Moves the doctrine balance toward Final Silence. Raises Final Silence Pressure and grants Command Power. Higher tiers add Chaos, Mandala Reach, War Support, and a sharper move toward Final Silence, as the description lists."
THR_bop_seal_the_ledger: "Seal the Ledger"
THR_bop_seal_the_ledger_desc: "Argue in council that the last weapon must stay ready. Requires the final path. Moves the balance toward Final Silence and raises Final Silence Pressure.\n\nPressure above §Y40§! authorizes the launch crews: the balance moves further, and Compassion Drift and Chaos rise. Pressure above §Y70§! with the balance already leaning toward Final Silence holds the Empty Mandala Session, the sharpest move of all. Unavailable once Final Silence is renounced."
THR_bop_seal_the_ledger_effect_tt: "Moves the doctrine balance toward Final Silence and raises Final Silence Pressure. Higher tiers raise Compassion Drift and Chaos and move the balance further, as the description lists."
THR_enter_empty_seat: "Take the Empty Seat"
THR_enter_empty_seat_desc: "The Awakened One passes beyond worldly action and the world goes on. Requires the Extinction of Defilements, a Buddha power shown against chaos, Defilements below §Y10§!, a secured capital, and no False Buddha Schism. The Vow against Annihilation does not close this road. The Empty Seat leads the Realm, the armed doctrine and its warnings end, Chaos falls, and the Buddha powers fall silent."
THR_enter_empty_seat_ready_tt: "Requires Buddhahood, a Buddha power shown against chaos, the Extinction of Defilements rite, Defilements below §Y10§!, a secured capital sanctuary, and no False Buddha Schism."
THR_enter_empty_seat_effect_tt: "The Empty Seat leads the Realm. Chaos falls, the armed doctrine and its warnings end, and the Buddha powers fall silent."
THR_bop_send_bodhisattva_to_council: "Send the Bodhisattva to Council"
THR_bop_send_bodhisattva_to_council_desc: "Requires the fourth bhumi. The Bodhisattva appears before the council once, advancing the bhumi, moving the balance toward the Vow, and lowering Final Silence Pressure."
THR_repair_high_pass_storehouses: "Repair High-Pass Storehouses"
THR_repair_high_pass_storehouses_desc: "Commit officials and labor to the pass roads, storehouses, and shelter routes. Adds infrastructure to a controlled state, raises Spiritual Legitimacy, and extends Mandala Reach."
THR_white_scarf_relief_caravans: "White-Scarf Relief Caravans"
THR_white_scarf_relief_caravans_desc: "Send guarded relief caravans through war and chaos to repair one strained state under the Realm's control. Requires a war or Chaos above §Y200§!. Raises Spiritual Legitimacy and lowers Final Silence Pressure. The roads need time to recover before the next convoy."
THR_mandala_ledger_scribes: "Mandala Court Scribes"
THR_mandala_ledger_scribes_desc: "Appoint clerks to the Realm's civil courts. Their work extends Mandala Reach, grants §Y12§! Political Power, and slightly increases Compassion Drift."
THR_snow_line_signal_posts: "Snow-Line Signal Posts"
THR_snow_line_signal_posts_desc: "Build high-altitude signal posts and defensive watches. Grants Command Power, adds local air defense, and extends Mandala Reach."
THR_second_refuge_register: "A Second Refuge"
THR_second_refuge_register_desc: "Open new shelters for families and displaced workers. Requires Spiritual Legitimacy above §Y30§!. Raises Spiritual Legitimacy and lowers Compassion Drift."
THR_arhat_road_audit: "Arhat Road Audit"
THR_arhat_road_audit_desc: "Send Arhats through the outer valleys to enforce the Realm's law. Requires Mandala Reach above §Y20§!. Improves compliance in non-core holdings, grants Command Power, raises Mandala Reach, and increases Compassion Drift."
THR_mandala_border_courts: "Mandala Border Courts"
THR_mandala_border_courts_desc: "Open courts for border disputes and foreign envoys. Requires Mandala Reach above §Y45§!, improves foreign opinion, grants §Y22§! Political Power, and extends the Realm's influence."
THR_bodhisattva_mission_white_scarf_envoys: "Bodhisattva Mission: White-Scarf Envoys"
THR_bodhisattva_mission_white_scarf_envoys_desc: "Send the Bodhisattva with quiet envoys. Advances the bhumi, strengthens the leader trait, raises Mandala Reach, lowers Compassion Drift, and improves foreign opinion. This mission can be undertaken once."
THR_bodhisattva_mission_wounded_border: "Bodhisattva Mission: Wounded Border"
THR_bodhisattva_mission_wounded_border_desc: "Send the Bodhisattva to a tense border during war or a serious chaos threat. Requires Mandala Reach above §Y35§!. Advances the bhumi and raises Mandala Reach. A doctrine leaning toward Final Silence raises Compassion Drift. Any other doctrine lowers Final Silence Pressure. This mission can be undertaken once."
THR_bodhisattva_bhumi_advancement_required_tt: "The Bodhisattva must not yet have reached the tenth bhumi."
THR_focus: "Holy Realm Focus Tree"
THR_focus_desc: "The Holy Realm grows from a mountain refuge through teaching, meditation, governance, Mandala diplomacy, powers against chaos, and the question of Final Silence."
THR_open_refuge_roads: "Open Refuge Roads"
THR_open_refuge_roads_desc: "Let more refugees into the high valleys and bind them to the shelter seal. Opens the Realm's reception to every arrival, so the people who settle ease Compassion Drift and raise Spiritual Legitimacy. Costs a little stability, raises Spiritual Legitimacy, and eases Compassion Drift. The first opening slightly lowers global Chaos."
THR_register_refugee_lineages: "Learn the Refugee Families"
THR_register_refugee_lineages_desc: "Learn each family's name and give them a place to settle. The effort extends Mandala Reach and slightly lowers global Chaos."
THR_close_refuge_roads: "Close Refuge Roads"
THR_close_refuge_roads_desc: "Shut the high passes before the camps become a second country. Closes the Realm's reception to new arrivals. Raises stability, lowers Spiritual Legitimacy, and raises Final Silence Pressure and Chaos."
THR_open_refuge_roads_closed_policy_tt: "The Realm's reception must not already be open to every refugee."
THR_close_refuge_roads_open_policy_tt: "The Realm's reception must not be open to every refugee."
THR_mandala_open_refuge_corridors: "Open Mandala Refuge Corridors"
THR_mandala_open_refuge_corridors_desc: "Open refugee corridors across the Mandala of Nations. Raises stability, Spiritual Legitimacy, and Sangha Cohesion, and lowers global Chaos."
THR_mandala_white_flag_congress: "White-Flag Congress"
THR_mandala_white_flag_congress_desc: "Convene Mandala members while the Realm is at peace. Their shared pledge strengthens the compact and lowers global Chaos."
THR_mandala_open_granaries: "Open the Faction Granaries"
THR_mandala_open_granaries_desc: "Open the granaries of the Mandala of Nations for relief and road repair. Members in Africa, South America, and Asia receive local recovery work where bad roads, war, or rural poverty make the aid useful."
THR_mandala_demand_anti_puppet_clauses: "Demand Anti-Puppet Clauses"
THR_mandala_demand_anti_puppet_clauses_desc: "Demand guarantees that Mandala members remain independent. The compact gains cohesion and bars puppet governments from its council."
THR_mandala_joint_defense_of_passes: "Joint Defense of the Passes"
THR_mandala_joint_defense_of_passes_desc: "When a true chaos threat reaches the Realm, its neighbors, or the compact, spend §Y30§! Command Power and §Y220§! Support Equipment to organize a shared defense."
THR_mandala_joint_defense_of_passes_effect_tt: "Strengthens faction initiative and power projection, raises Sangha Cohesion, and sends defensive support to eligible compact members."
THR_mandala_joint_defense_cost_required_tt: "Requires at least §Y30§! Command Power and §Y220§! Support Equipment."
THR_mandala_peacekeeping_cost_required_tt: "Requires at least §Y6,000§! manpower, §Y800§! infantry equipment, and §Y80§! support equipment."
THR_form_great_mandala: "Form the Great Mandala"
THR_form_great_mandala_desc: "Declare a wider Mandala identity. Requires Buddhahood, the Refusal of Empires, Defilements below §Y20§!, no offensive war, and either a stable compact or a protected sanctuary corridor."
THR_form_great_mandala_effect_tt: "Renames the country to §YThe Great Mandala§!, raises Spiritual Legitimacy and Mandala Reach, and opens decisions to steady the union."
THR_form_silent_mandala: "Form the Silent Mandala"
THR_form_silent_mandala_desc: "After Final Silence leaves the Empty Seat behind, the surviving compact takes a new name for the quiet that remains. Requires the Empty Seat focus and a Mandala of Nations led by the Realm."
THR_form_silent_mandala_effect_tt: "Renames the country to §YThe Silent Mandala§!, strengthens Sangha Cohesion, reduces Chaos, and opens decisions to rebuild after Final Silence."
THR_great_mandala_stabilize_registers: "Steady the Outer Valleys"
THR_great_mandala_stabilize_registers_desc: "Repair roads and restore order in protected non-core valleys. Resistance falls and compliance rises as the Mandala's influence grows."
THR_great_mandala_refresh_compact_vows: "Refresh Compact Vows"
THR_great_mandala_refresh_compact_vows_desc: "Review the compact after formation, remove invalid Mandala members, and strengthen Sangha Cohesion."
THR_mandala_arbitration_letters: "Letters Carried Past the Guns"
THR_mandala_arbitration_letters_desc: "Choose a country at war and ask it to accept Mandala arbitration. A white peace is signed only if that country and one of its enemies both accept."
THR_mandala_observer_mission: "Mandala Observer Mission"
THR_mandala_observer_mission_desc: "Send white-flag observers to a country at war. Raises Mandala Reach, grants Command Power, and improves the country's opinion of the Realm. The same country cannot host another observer mission for half a year."
THR_mandala_development_mission: "Mandala Development Mission"
THR_mandala_development_mission_desc: "Send wells, clinics, road crews, and storehouse officers to a poor or war-torn African, South American, or Asian state. One of its states receives new infrastructure and, where the roads already allow it, industry. The country cannot receive another mission for some months."
THR_assign_arhat_overseers: "Assign Arhat Overseers"
THR_assign_arhat_overseers_desc: "Send oath-bound administrators to settle petitions and ration stores. Requires Spiritual Legitimacy above §Y35§!. Raises stability, Command Power, and Mandala Reach, reduces resistance in the non-core states you control, and raises Compassion Drift and Chaos."
THR_assign_arhat_to_province: "Assign Arhat to a Province"
THR_assign_arhat_to_province_desc: "Let an Arhat rebuild one controlled state with roads, civil industry, and local administration. Requires Spiritual Legitimacy above §Y32§!. Non-core states gain compliance and lower resistance."
THR_assign_arhat_to_army: "Assign Arhat to the Army"
THR_assign_arhat_to_army_desc: "Attach vow-keepers to the regiments guarding the passes and raise a new group of elite Vow-Keeper Mountaineers. Grants army experience, Command Power, and War Support, and raises Compassion Drift and Chaos. This can be done once."
THR_hold_dharma_teaching: "Hold Dharma Teaching"
THR_hold_dharma_teaching_desc: "Hold a public teaching on one ground of the Bodhisattva path. Each teaching advances the bhumi and occupies an open teaching seat, and the Realm then chooses how to interpret it. The choice can shift the Mandala's values or doctrine, raise troops, lower Chaos, or raise Final Silence Pressure."
THR_question_false_attainment: "Question False Attainment"
THR_question_false_attainment_desc: "Investigate whether an Arhat office has mistaken silence for peace."
THR_investigate_arhat_abuses: "Investigate Arhat Abuses"
THR_investigate_arhat_abuses_desc: "Discipline officials whose detachment has become cruelty. Lowers Compassion Drift, raises Spiritual Legitimacy, and costs a little stability. The first investigation slightly lowers global Chaos."
THR_send_quiet_envoys: "Send Quiet Envoys"
THR_send_quiet_envoys_desc: "Approach foreign governments through relief, pilgrimage, and private notice. Improves their opinion of the Realm, raises Mandala Reach, and slightly lowers Chaos once."
THR_offer_mediation_to_war_torn_state: "Offer Mediation to a War-Torn State"
THR_offer_mediation_to_war_torn_state_desc: "Send envoys to governments that cannot end their wars. Raises Mandala Reach and lowers Final Silence Pressure. The first mediation effort slightly lowers global Chaos."
THR_stand_between_armies: "Stand Between Armies"
THR_stand_between_armies_desc: "Send one Mandala Peacekeeping Brigade to a threatened minor democracy. Requires §Y6,000§! manpower, §Y800§! infantry equipment, and §Y80§! support equipment. The recipient cannot receive another brigade for a year."
THR_demand_pacification_settlement: "Demand a Pacification Settlement"
THR_demand_pacification_settlement_desc: "Tell a belligerent state that the Realm can place peace under administration. Requires the doctrine of coercive pacification. Raises War Support, Final Silence Pressure, and Chaos."
THR_audit_foreign_target_ledgers: "Identify Foreign Targets"
THR_audit_foreign_target_ledgers_desc: "Study foreign casualties, refused peace terms, and military threats. The Buddha sees each capital as another place where suffering may return. Moves the balance toward Final Silence, raises Final Silence Pressure, and grants §Y30§! Political Power."
THR_prepare_realm_shelters_for_nonreturn: "Prepare Shelters of Nonreturn"
THR_prepare_realm_shelters_for_nonreturn_desc: "Harden one prepared Realm state with anti-air and bunkers for the doctrine of nonreturn. Raises stability slightly and raises Final Silence Pressure."
THR_send_global_final_warning: "Send a Final Notice"
THR_send_global_final_warning_desc: "Send one formal notice to a foreign government. Each target can receive this notice only once. Raises Final Silence Pressure, moves the balance toward Final Silence, and sours the government's opinion of the Realm."
THR_secure_outer_pass_roads: "Secure Outer Pass Roads"
THR_secure_outer_pass_roads_desc: "Turn the border roads into protected administrative routes. Adds infrastructure to every controlled state and marks it protected. Raises Mandala Reach and Compassion Drift."
THR_register_outer_valleys: "Govern the Outer Valleys"
THR_register_outer_valleys_desc: "Send Arhat officials through held valleys to reduce resistance, raise compliance, and bind the roads to the Mandala."
THR_pressure_border_courts: "Pressure Border Courts"
THR_pressure_border_courts_desc: "Use Mandala Reach to lean on neighboring courts. Raises Mandala Reach and Compassion Drift, sours neighboring opinion of the Realm, and adds a little Chaos."
THR_choose_restraint_doctrine: "Doctrine of Restraint"
THR_choose_restraint_doctrine_desc: "Keep the Mandate inside the limits of refusal. Adds the Peacekeeping Mandate national spirit, lowers Final Silence Pressure and Chaos, and raises Spiritual Legitimacy."
THR_choose_peacekeeping_doctrine: "Doctrine of Peacekeeping"
THR_choose_peacekeeping_doctrine_desc: "Use the Mandate to send protectors across borders. Adds the Peacekeeping Mandate national spirit and raises Mandala Reach."
THR_choose_coercive_pacification: "Doctrine of Coercive Pacification"
THR_choose_coercive_pacification_desc: "Accept force as preventive mercy. Adds the Coercive Pacification national spirit and raises Final Silence Pressure and Chaos."
THR_renounce_final_silence: "Renounce the Sealed Doctrine"
THR_renounce_final_silence_desc: "Close the sealed doctrine before the state forgets how to refuse it. Requires a doctrine balance leaning toward the Vow. The first renunciation significantly lowers global Chaos."
THR_arm_final_silence: "Arm the Final Doctrine"
THR_arm_final_silence_desc: "Arm the final doctrine. Starts the sequence of final notices and raises Final Silence Pressure and Chaos."
THR_launch_final_silence: "Begin Final Silence"
THR_launch_final_silence_desc: "Requires Buddhahood, the armed doctrine, a Buddha power shown against chaos, and the Extinction of Defilements. If Chaos exceeds §Y1000§! and a world-ending outcome is available, the last order calls Fallout upon the world. Otherwise the Realm enters the Empty Seat and the world goes on."
THR_send_peace_letter: "Send a Letter of Peace"
THR_send_peace_letter_desc: "Send a formal offer to an eligible neighboring country. Acceptance is rare. Major powers and faction members cannot accept. A country that refuses is not asked again for a year."
THR_prepare_forced_integration: "Prepare Forced Integration"
THR_prepare_forced_integration_desc: "A refused letter gives the Realm grounds for war. This grants a war goal against the refusing country, and the armies still have to take the field. The world condemns the Realm for the coercion."
THR_administer_submitted_territory: "Administer Submitted Territory"
THR_administer_submitted_territory_desc: "Send Arhat officials through peacefully submitted or integrated states to raise compliance and reduce resistance."
THR_integrate_himalayan_mandala_state: "Integrate a Himalayan Mandala State"
THR_integrate_himalayan_mandala_state_desc: "Core a held Himalayan or peacefully submitted state after Mandala administration."
THR_mandate_kneeling_province: "Mandate the Kneeling Province"
THR_mandate_kneeling_province_desc: "Make a held state claimed through The World Is Asked to Kneel a core of the Realm. The state resists the mandate, Compassion Drift rises, and the world condemns the Realm for the coercion."
THR_integrate_northern_indian_register_state: "Integrate a Northern Indian State"
THR_integrate_northern_indian_register_state_desc: "Integrate a held Raj-core state after the Realm establishes its northern Indian authority."
THR_integrate_eastern_mandala_state: "Core an Eastern Mandala State"
THR_integrate_eastern_mandala_state_desc: "Core a held Chinese-core state after the Eastern Mandala, high Mandala Reach, and Arhat administration."
THR_condemn_buddha_mandate: "Condemn the Buddha Mandate"
THR_condemn_buddha_mandate_desc: "Publicly reject the Realm's right to administer foreign suffering."
THR_build_mountain_containment: "Prepare Mountain Containment"
THR_build_mountain_containment_desc: "Prepare the borders, intelligence service, and coalition partners for a crisis with the Holy Realm. War Support rises and stability falls slightly, but the Realm reads the ring as a threat and its Final Silence Pressure rises. A later disruption of the final network strikes harder. Each country can do this once."
THR_build_mountain_containment_unprepared_tt: "Mountain Containment must not already be prepared."
THR_build_mountain_containment_effect_tt: "War Support rises and stability falls slightly. The Realm's doctrine balance leans toward Final Silence and its Final Silence Pressure rises."
THR_disrupt_final_silence_network: "Disrupt the Final Network"
THR_disrupt_final_silence_network_desc: "Strike at the final doctrine network before it can launch. If the launch has begun, the network is interrupted. Otherwise it lowers the Realm's Final Silence Pressure, and lowers it further after Mountain Containment. Each country can do this once."

THR_mountain_refuge: "Mountain Refuge"
THR_mountain_refuge_desc: "Turn the high valleys into a defensible refuge with roads, stores, and legal shelter seals."
THR_shelter_border_villages: "Shelter the Border Villages"
THR_shelter_border_villages_desc: "Take the villages nearest the passes into the refuge."
THR_guard_high_passes: "Guard the High Passes"
THR_guard_high_passes_desc: "Fortify the approaches before the lowlands push their wars upward."
THR_bodhisattva_accepts_seal: "The Bodhisattva Accepts the Seal"
THR_bodhisattva_accepts_seal_desc: "Transform the refuge into a Bodhisattva-led state."
THR_first_doctrine_suffering: "The First Doctrine of Suffering"
THR_first_doctrine_suffering_desc: "Make relief, judgment, and policy answer to the language of suffering."
THR_sit_beneath_prayer_flags: "Sit Beneath Prayer Flags"
THR_sit_beneath_prayer_flags_desc: "Give the concentration vows a public place in the Realm. Meditation turns from private practice into a duty of the state."
THR_first_quiet: "The First Quiet"
THR_first_quiet_desc: "The first Dhyana offers attendants a calm discipline at the Bodhisattva's side."
THR_second_quiet: "The Second Quiet"
THR_second_quiet_desc: "Carry the second Dhyana through the offices and the roads that feed them."
THR_third_quiet: "The Third Quiet"
THR_third_quiet_desc: "Require every bureau near the seat to reckon with the stillness it claims to serve."
THR_fourth_quiet: "The Fourth Quiet"
THR_fourth_quiet_desc: "Let the final Dhyana milestone stand as a visible gate before the Unshaken Seat."
THR_council_of_abbots: "Council of Abbots"
THR_council_of_abbots_desc: "Let senior abbots bind doctrine, teaching, and refuge law before the Arhat offices harden around them."
THR_name_protector_regent: "Name a Protector Regent"
THR_name_protector_regent_desc: "Give the refuge a wartime guardian who can command roads and garrisons while the seat remains under vow."
THR_seat_pilgrim_assembly: "Seat the Pilgrim Assembly"
THR_seat_pilgrim_assembly_desc: "Let pilgrims, guides, and witnesses hold a chamber that keeps foreign teaching and compact work close to the state."
THR_abbot_examiners: "Abbot Examiners"
THR_abbot_examiners_desc: "Let senior teachers test every public mission before it leaves the mountains, turning governance into clearer doctrine abroad."
THR_regent_pass_watch: "Regent's Pass Watch"
THR_regent_pass_watch_desc: "Place the Protector Regent's officers at the roads where panic, supplies, and anti-chaos defense meet."
THR_pilgrim_refuge_courts: "Pilgrim Refuge Courts"
THR_pilgrim_refuge_courts_desc: "Let the Pilgrim Assembly judge appeals from unstable neighbors before the compact decides whether refuge can become obligation."
THR_send_first_envoys: "Send the First Envoys"
THR_send_first_envoys_desc: "Send teachers and interpreters beyond the mountain roads. Dharma Teaching decisions become a public arm of the Realm."
THR_translation_houses: "Translation Houses"
THR_translation_houses_desc: "Build houses where vows, petitions, and foreign reports can be carried between languages without becoming ordinary propaganda."
THR_teach_under_bombardment: "Teach under Bombardment"
THR_teach_under_bombardment_desc: "Keep the teaching going while chaos, a world on the edge of ending, or a war against a chaos country makes every sermon a crisis."
THR_many_lamps_one_flame: "Many Lamps, One Flame"
THR_many_lamps_one_flame_desc: "Prove the teaching network through twelve successful teachings, at least one of them given during major chaos."
THR_four_teaching_seats: "Four Teaching Seats"
THR_four_teaching_seats_desc: "Open a fourth public teaching seat so envoys, translators, refugee teachers, and foreign witnesses can work without drowning each other out."
THR_rewrite_civil_register: "Reform Civil Administration"
THR_rewrite_civil_register_desc: "Replace emergency rule with courts that assign rights and duties. Core lands gain infrastructure and civil industry, while administered non-core lands gain compliance and lower resistance."
THR_mandala_bureau: "The Mandala Bureau"
THR_mandala_bureau_desc: "Build the administrative center that turns refuge work into state capacity."
THR_arhat_examinations: "Arhat Examinations"
THR_arhat_examinations_desc: "Select officials who claim detachment from fear, faction, and personal gain."
THR_arhats_take_office: "The Arhats Take Office"
THR_arhats_take_office_desc: "Create the Arhat Administration and give oath-bound officials authority over the Realm's daily needs."
THR_labs_snow_line: "Laboratories at the Snow Line"
THR_labs_snow_line_desc: "Tie high-altitude research to the doctrine of prevention. The snow-line laboratories add three research slots and a large nuclear research program."
THR_refuge_foundries: "Refuge Foundries"
THR_refuge_foundries_desc: "Arm the passes without admitting that the refuge has become a fortress. Every controlled state receives new military and civilian industry."
THR_vow_keeper_regiments: "Vow-Keeper Regiments"
THR_vow_keeper_regiments_desc: "Organize troops whose oaths bind them to protection before conquest. The focus creates an elite Vow-Keeper Mountaineer template, spawns six equipped mountain divisions, and adds major manpower, army experience, and doctrine discounts."
THR_quiet_envoys: "Quiet Envoys"
THR_quiet_envoys_desc: "Send letters and relief missions before the mandate becomes an ultimatum."
THR_buddha_mandate: "The Unshaken Seat"
THR_buddha_mandate_sanctuary_required_tt: "Requires control of the current capital. The Bodhisattva cannot take the Unshaken Seat within 180 days of the capital sanctuary falling."
THR_buddha_mandate_desc: "The Bodhisattva can become Buddha with §Y108§! Bodhi, §YFourth Dhyana§!, Defilements below §Y20§!, twelve successful teachings, and one teaching success during a major chaos crisis."
THR_the_awakened_one: "The Awakened One"
THR_the_awakened_one_desc: "Let the Realm arrange its offices around the Buddha who no longer fits the shape of a ruler."
THR_return_to_the_seat: "Return to the Seat"
THR_return_to_the_seat_desc: "Keep the fourth Dhyana alive after awakening, so practice continues to renew the Buddha's powers."
THR_show_the_powers: "Show the Powers"
THR_show_the_powers_desc: "Reveal the Buddha's first awakened power against a true chaos enemy. The world sees that the Awakened One has not yet reached release."
THR_powers_are_not_toys: "Discipline of the Powers"
THR_powers_are_not_toys_desc: "Bind the awakened powers to a single purpose: standing against chaos."
THR_one_becomes_many_focus: "One Becomes Many"
THR_one_becomes_many_focus_desc: "Turn simultaneous teaching presence into a planned anti-chaos doctrine, expanding relief and mission coordination after the power is shown."
THR_path_through_walls: "Path through Walls"
THR_path_through_walls_desc: "Prepare the Realm to cross walls, passes, rivers, and broken front lines only where chaos has made ordinary roads meaningless."
THR_lotus_bridge_focus: "Lotus Bridge"
THR_lotus_bridge_focus_desc: "Make impossible relief routes serve the Sangha Compact, threatened allies, and crisis corridors."
THR_read_pattern_suffering: "Read the Pattern of Suffering"
THR_read_pattern_suffering_desc: "The Bodhisattva compares what the students have learned, what the armies have seen, and what the awakened eye reveals about suffering."
THR_vanishing_from_sight_focus: "Vanishing from Sight"
THR_vanishing_from_sight_focus_desc: "Train relief columns to move unseen among chaos enemies, leaving ordinary countries beyond the power's reach."
THR_seated_in_sky_focus: "Seated in the Sky"
THR_seated_in_sky_focus_desc: "Prepare the sky-seated display for capitals and sanctuaries threatened by chaos. It is held back from ordinary wars."
THR_touch_sun_moon_focus: "Touch the Sun and Moon"
THR_touch_sun_moon_focus_desc: "Keep the strongest public sign for a world-collapse crisis or a proven awakened display against chaos."
THR_lamps_remain_lit: "The Lamps Remain Lit"
THR_lamps_remain_lit_desc: "Choose restraint while peace still holds. A sharp rise in global Chaos closes this path."
THR_white_flags_foreign_roads: "White Flags on Foreign Roads"
THR_white_flags_foreign_roads_desc: "Send peacekeepers and relief columns where state failure keeps the wheel turning."
THR_vow_against_annihilation: "Vow Against Annihilation"
THR_vow_against_annihilation_desc: "Bind the Mandate against world-ending doctrine."
THR_pacification_mandate: "Pacification Mandate"
THR_pacification_mandate_desc: "Treat force as the sharp instrument of mercy."
THR_release_through_administration: "Release Through Administration"
THR_release_through_administration_desc: "Pacify territory through Arhat rule, relief, and imposed order. No celebration follows the rite."
THR_throne_without_body: "The Throne Without a Body"
THR_throne_without_body_desc: "Let doctrine govern beyond any single human hesitation."
THR_doctrine_last_war: "The Last Wheel"
THR_doctrine_last_war_desc: "Open the way to the final rite after Buddhahood and the first awakened power displayed. This alone does not authorize Final Silence."
THR_witnesses_gather: "Witnesses Gather"
THR_witnesses_gather_desc: "Ask taught countries and Mandala members to stand with the Realm as it approaches its final doctrine."
THR_reactors_prayer_wheels: "Reactors and Prayer Wheels"
THR_reactors_prayer_wheels_desc: "Bind nuclear and thermonuclear research to the final doctrine. The focus builds reactors and a nuclear facility, then grants major nuclear research bonuses. The arsenal must still be produced."
THR_all_roads_end_silence: "Seal the Remote Roads"
THR_all_roads_end_silence_desc: "Survey sacred roads, close remote sites, and let foreign observers guess at the purpose."
THR_no_one_leaves_mandala: "No One Leaves the Mandala"
THR_no_one_leaves_mandala_desc: "Close the moral circle around every road, border, and launch cell. The Realm expands its reactor network, receives nuclear research acceleration, and raises Final Silence Pressure."
THR_extinction_of_defilements_focus: "Extinction of Defilements"
THR_extinction_of_defilements_focus_desc: "Complete the inner rite with full Meditation Charge and end the last defilements before the final order."
THR_final_silence: "The Last Authorization"
THR_final_silence_desc: "Authorize the sealed doctrine. Every final condition must be met."
THR_empty_seat: "The Empty Seat"
THR_empty_seat_desc: "Stabilize the Empty Seat aftermath in which the Buddha has passed beyond worldly action and the Realm remains to guard the wheel."
THR_witnesses_keep_the_record: "Witnesses Guard the Memory"
THR_witnesses_keep_the_record_desc: "Ask taught countries, compact members, and Mandala offices to preserve what remained after Final Silence."
THR_convene_mountain_assembly: "Convene Mountain Assembly"
THR_convene_mountain_assembly_desc: "Give the refuge a chamber before the chamber becomes a ministry. The assembly unlocks Dharma Teaching decisions, advances the Bodhisattva bhumi, grants major Political Power, and slightly reduces Chaos."
THR_seal_of_refuge: "The Seal of Refuge"
THR_seal_of_refuge_desc: "Turn shelter seals into state law. Protected communities provide manpower, stability, infrastructure, civil industry, Spiritual Legitimacy, Mandala Reach, and a small Chaos reduction."
THR_ministry_of_vows: "Ministry of Vows"
THR_ministry_of_vows_desc: "The Ministry of Vows binds every pledge and public duty to the Last Wheel."
THR_silent_offices: "Silent Offices"
THR_silent_offices_desc: "Build offices that process petitions without political theater."
THR_village_without_petitions: "A Village without Petitions"
THR_village_without_petitions_desc: "Review the first district where silence may mean peace or fear."
THR_question_false_attainment_focus: "The Question of False Attainment"
THR_question_false_attainment_focus_desc: "Test whether Arhat office credentials still carry a burden."
THR_count_mountain_roads: "Pilgrimage Roads"
THR_count_mountain_roads_desc: "Map the roads used by grain, pilgrims, troops, and refugees. Each controlled state gains major infrastructure and a listening post, while the Realm gains Political Power and Mandala Reach."
THR_monastic_labor_vows: "Monastery Workshops"
THR_monastic_labor_vows_desc: "Bind construction, repair, and relief work to monastic labor vows. Controlled states receive civilian workshops and infrastructure."
THR_mountain_granaries: "Mountain Granaries"
THR_mountain_granaries_desc: "Build high-valley granaries and a supply hub so refugee roads, winter shelters, and defensive detachments can endure pressure."
THR_snowline_clinics: "Snowline Clinics"
THR_snowline_clinics_desc: "Turn support stores and mountain clinics toward field relief, stability, and compassion."
THR_storehouses_for_world: "Storehouses for the World"
THR_storehouses_for_world_desc: "Build a supply depot inside the Realm and train the staff needed to move relief across the mountain roads."
THR_shelters_under_stone: "Fortress Without Hatred"
THR_shelters_under_stone_desc: "Prepare bunkers, anti-air, and winter shelters to protect lives under a defensive vow."
THR_quiet_mobilization: "Mountain Pass Detachments"
THR_quiet_mobilization_desc: "Raise reserve detachments for road watches, avalanche lines, and narrow passes."
THR_mountain_artillery_mandalas: "The Bell and Rifle"
THR_mountain_artillery_mandalas_desc: "Issue artillery and rifle discipline to the guardians who hold the passes, with doctrine written around refusal and defense."
THR_unbroken_pass: "The Unbroken Pass"
THR_unbroken_pass_desc: "Bind shelters, detachments, and guardian fire into a last-pass defense against chaos pressure."
THR_permit_foreign_pilgrimage: "Permit Foreign Pilgrimage"
THR_permit_foreign_pilgrimage_desc: "Let foreign witnesses enter the Realm under an oath of protection."
THR_letters_to_war_tired: "Letters to the War-Tired"
THR_letters_to_war_tired_desc: "Write to governments whose people have forgotten why the war continues."
THR_shelter_exiles: "Shelter the Exiles"
THR_shelter_exiles_desc: "Give foreign exiles a legal place beneath the seal. Exile communities provide manpower, civil construction in every controlled state, Political Power, Spiritual Legitimacy, and a small Chaos reduction."
THR_mandala_of_nations: "Mandala of Nations"
THR_mandala_of_nations_desc: "Offer a coalition of refusal, mediation, and witnessed peace. Members take a peace vow, cannot declare offensive wars, and pursue acts of kindness that lower global Chaos."
THR_refusal_of_empires: "Refusal of Empires"
THR_refusal_of_empires_desc: "Reject imperial claims over suffering outside the mountains."
THR_no_victory_parades: "No Victory Parades"
THR_no_victory_parades_desc: "Pacification must not become conquest in ceremonial dress. The Realm gains Political Power and Command Power while Final Silence Pressure and Chaos fall."
THR_last_border_is_wound: "The Last Border Is a Wound"
THR_last_border_is_wound_desc: "Treat every uncontrolled frontier as evidence that suffering remains unadministered. The Realm gains Political Power and War Support, and both Final Silence Pressure and Chaos rise."
THR_last_human_signature: "The Last Human Signature"
THR_last_human_signature_desc: "Remove the final personal countersignature from doctrine."
THR_sermon_without_translation: "A Sermon without Translation"
THR_sermon_without_translation_desc: "Issue doctrine that foreign ministries cannot render into normal state language."
THR_compassion_of_non_return: "Compassion of Non-Return"
THR_compassion_of_non_return_desc: "Define mercy as the prevention of every possible return."
THR_ministry_of_release: "Ministry of Silence"
THR_ministry_of_release_desc: "Give the final doctrine an office and force the authorization chamber to decide whether it can still be refused. The ministry expands nuclear facilities, prepares a limited thermonuclear payload set if the technology exists, and convenes the chamber."
THR_refuse_final_debate: "Refuse Final Debate"
THR_refuse_final_debate_desc: "Refuse to let apocalypse become a legitimate subject of policy."
THR_peace_without_ownership: "Peace without Ownership"
THR_peace_without_ownership_desc: "Keep peacekeeping separate from possession."
THR_world_still_burns: "The World Still Burns"
THR_world_still_burns_desc: "Continue aid and mediation without claiming the world can be solved."
THR_second_refuge: "The Second Refuge"
THR_second_refuge_desc: "Turn renunciation into new shelters for those fleeing the wider collapse."
THR_lamps_entered_register: "The Lamps Along the Road"
THR_lamps_entered_register_desc: "Lamps burn along the mountain roads through the night. Arhat guards watch the valleys as the world beyond the passes falls silent."
THR_seal_roads_from_panic: "Seal the Roads from Panic"
THR_seal_roads_from_panic_desc: "Keep safe roads open through the valleys while Arhat guards guide families away from panicked armies."
THR_no_more_peace_delegations: "No More Peace Delegations"
THR_no_more_peace_delegations_desc: "Foreign envoys may still arrive. The Realm no longer accepts ordinary pleas as policy."
THR_sort_worthy_broken: "Sort the Worthy from the Broken"
THR_sort_worthy_broken_desc: "The refugee lines continue as the Arhats separate useful labor, protected families, and cases the Realm says cannot be saved by open shelter alone."
THR_world_marked_as_wound_focus: "The World Is Marked as a Wound"
THR_world_marked_as_wound_focus_desc: "The Realm sees foreign suffering as one wound. Its envoys carry this teaching abroad while the Arhats prepare a harsher answer to war."
THR_complete_himalayan_mandala: "Secure the High Passes"
THR_complete_himalayan_mandala_desc: "War and disorder threaten the mountain roads. The Realm may authorize force against the courts that remain outside its protection."
THR_guardians_outer_passes: "Guardians of the Pilgrim Passes"
THR_guardians_outer_passes_desc: "Train the border guard to hold narrow roads, carry winter supply, and defend the shelter seal beyond the first valleys. Every controlled state receives forts and infrastructure, while the Realm gains Political Power, Command Power, army experience, and Mandala Reach."
THR_letters_beyond_passes: "Letters beyond the Passes"
THR_letters_beyond_passes_desc: "Open the pilgrim road and send protection letters to nearby courts. If they refuse, the Arhats may take a darker road through the pass."
THR_mandala_receives_borderlands: "Borderlands Petition the Mandala"
THR_mandala_receives_borderlands_desc: "Expand the letters to nearby borderlands and prepare staged protection for states that enter by vow, occupation, or Arhat administration."
THR_high_pass_states_enter_mandala: "High Pass Pilgrimage Oaths"
THR_high_pass_states_enter_mandala_desc: "Bring Tibet, Bhutan, Nepal, and Kham into one pilgrimage circuit when the Realm controls each of their mountain states."
THR_roads_must_be_quiet: "Safe Roads for Pilgrims"
THR_roads_must_be_quiet_desc: "Roads that carry grain, refugees, envoys, and patrols must stop carrying rumor. The focus unlocks border-control decisions, adds the Border Quiet national spirit, and grants Political Power, Command Power, Mandala Reach, and Compassion Drift."
THR_pacification_without_triumph: "Pacification without Triumph"
THR_pacification_without_triumph_desc: "If force is used, it must not become a parade. The focus unlocks pacification tools, adds the Pacification without Triumph national spirit, grants major Command Power and army experience, and raises Compassion Drift and Chaos."
THR_outer_valleys_register: "Outer Valley Courts"
THR_outer_valleys_register_desc: "Send Arhats into held valleys to judge local loyalty, guard storehouses, and restore order before resistance grows into war."
THR_mandala_borders: "Border Courts of Mercy"
THR_mandala_borders_desc: "The Mandala Bureau pressures nearby courts with relief, pilgrim roads, foreign observers, and limited protection claims."
THR_peace_by_submission: "Protection by Petition"
THR_peace_by_submission_desc: "Make the letters more persuasive when the Realm is stronger. Entry without war eases Chaos, and coercive authority strains the vow."
THR_northern_indian_register: "Northern Indian Frontier"
THR_northern_indian_register_desc: "The Realm claims the northern Indian valleys and gives the Arhats authority to protect them."
THR_northern_indian_state_registers: "Northern Indian Petition Courts"
THR_northern_indian_state_registers_desc: "Northern Indian states can enter the Mandala after the Realm takes control. Full integration requires a costly decision for each state."
THR_eastern_mandala: "The Eastern Pilgrimage Mandala"
THR_eastern_mandala_desc: "Extend the Mandala toward western China. Greater influence abroad gives the Realm a way into Chinese affairs."
THR_western_chinese_registers: "Western Chinese Frontier"
THR_western_chinese_registers_desc: "The Realm extends protection claims into Sichuan, Qinghai, Gansu, Yunnan, Ningxia, Suiyuan, Shaanbei, and Urumqi."
THR_eastern_chinese_registers: "Eastern China in Crisis"
THR_eastern_chinese_registers_desc: "Only extreme disorder draws the Realm into eastern China. War aims open against the region, and each state must still be taken and integrated."
THR_world_is_a_border: "The World Is Asked to Kneel"
THR_world_is_a_border_desc: "Only under extreme chaos does the Realm ask larger frontiers to submit. This conquest doctrine is separate from Final Silence."
THR_peace_chaos_focus_tt: "Requires Chaos Meter below §Y400§!. Patient diplomacy needs a world that still has room for it."
THR_mercy_chaos_focus_tt: "Requires Chaos Meter below §Y600§!. The mercy window is closing."
THR_mid_chaos_focus_tt: "Requires Chaos Meter above §Y400§!. The Realm justifies this measure once global Chaos has risen that far."
THR_chaos_tier_focus_tt: "Requires §RChaos Tier§! or worse. At this level the Realm starts turning toward the sealed final doctrine."
THR_high_chaos_focus_tt: "Requires Chaos Meter above §Y600§!. This belongs to the harsher measures a violent world calls for."
THR_extreme_chaos_focus_tt: "Requires Chaos Meter above §Y800§!. The Realm must believe the world has passed beyond ordinary repair."
THR_final_ritual_ready_tt: "Requires Buddhahood, the Ministry of Silence, the armed Final Silence doctrine, a Buddha power shown against chaos, the Extinction of Defilements rite, a controlled capital, and no active False Buddha Schism."
THR_final_silence_stockpile_required_tt: "Requires at least §Y80§! nuclear weapons in stock, and nuclear technology or a prepared Final Silence network."
THR_final_signature_pressure_tt: "Requires §Y45§! Final Silence Pressure. It can be built before Chaos reaches §Y1000§! through focus rewards, doctrine decisions, and late choices."
THR_final_sermon_pressure_tt: "Requires §Y55§! Final Silence Pressure. The final doctrine must be more than a rumor before this focus can be taken."
THR_final_non_return_pressure_tt: "Requires §Y65§! Final Silence Pressure. The doctrine must be close to irreversible before this focus can be taken."
THR_final_ministry_pressure_tt: "Requires §Y75§! Final Silence Pressure. The Ministry of Silence prepares the way, and the launch has conditions of its own."
THR_final_ministry_reach_tt: "Requires §Y60§! Mandala Reach. The Realm must have enough diplomatic, administrative, or expansionist reach to build a global final network."
THR_final_bop_leans_final_tt: "Requires the doctrine balance to favor §RFinal Silence§!."
THR_final_bop_dominant_tt: "Requires §RFinal Silence§! to dominate the doctrine balance."
THR_mandala_compact_candidate_required_tt: "Requires at least one independent minor country that is not a chaos country and has a crisis, a teaching history, Mandala contact, or a need for refuge under the Pilgrim Assembly."
THR_vow_bop_required_tt: "Requires the doctrine balance to lean toward the §GVow against Annihilation§!. Vow influence must pull doctrine away from Final Silence first."
THR_arm_final_bop_required_tt: "Requires the doctrine balance to lean toward §RFinal Silence§!. Final Silence can be prepared before Chaos reaches §Y1000§!. The Realm must first choose that doctrine politically."
THR_vow_keeper_mandala_reach_required_tt: "Requires Mandala Reach above §Y18§!. Large Vow-Keeper formations need an administrative and territorial base."
THR_complete_himalayan_mandala_available_tt: "Bhutan, Nepal, or Sikkim still stands outside the Holy Realm and can be attacked."
THR_complete_himalayan_mandala_bypass_tt: "Bhutan, Nepal, and Sikkim are already part of the Realm, bound to it as subjects, gone, or beyond reach of a declared war."
THR_complete_himalayan_mandala_effect_tt: "Grants annexation war goals against the Bhutanese, Nepali, and Sikkimese courts outside the Realm while Chaos stays above [?constant:holy_realm_chaos.coercive_floor|.0]."
THR_high_pass_states_enter_mandala_effect_tt: "Unlocks high-pass integration decisions and directly integrates owned Sikkim if it is already under Realm control. The remaining Himalayan cores come from expensive state decisions."
THR_no_victory_parades_effect_tt: "Adds §Y250§! Political Power, §Y75§! Command Power, stability, lowers Final Silence Pressure, and reduces Chaos slightly."
THR_last_border_is_wound_effect_tt: "Adds §Y300§! Political Power, war support, Final Silence Pressure, and coercive Chaos."
THR_northern_indian_register_effect_tt: "Opens claims, protection letters, and integration decisions against nearby northern Indian states."
THR_northern_indian_state_registers_effect_tt: "Adds claims in northern India. Each state can be fully integrated through a decision after control is secured."
THR_eastern_mandala_effect_tt: "Extends Mandala influence toward western China and strengthens the Realm's position in neighboring courts."
THR_western_chinese_registers_effect_tt: "Adds claims and pressure against western Chinese states. Full integration requires control and a separate decision."
THR_eastern_chinese_registers_effect_tt: "Adds claims and war aims in eastern China during extreme chaos. The states must still be taken and integrated."
THR_reactors_prayer_wheels_effect_tt: "Builds nuclear reactors in controlled states, adds a nuclear facility in the capital, and grants a strong nuclear research bonus. Raises Final Silence Pressure and Chaos. The arsenal must still be produced."
THR_no_one_leaves_mandala_effect_tt: "Expands the reactor network, adds nuclear research acceleration, and raises Final Silence Pressure and Chaos."
THR_ministry_of_release_effect_tt: "Adds the Final Silence Network national spirit, expands nuclear facilities, prepares §Y24§! thermonuclear payloads if the technology exists, and convenes the authorization chamber."
THR_mandala_bureau_agency_tt: "Creates or expands the Mandala Bureau intelligence agency with cryptology, passive defense, invisible ink, diplomatic training, and radio operations upgrades."
THR_last_human_signature_effect_tt: "Unlocks target-list audit decisions, raises Final Silence Pressure, and moves the doctrine balance toward Final Silence."
THR_sermon_without_translation_effect_tt: "Unlocks once-per-target final notice actions, raises war support, and moves the doctrine balance toward Final Silence."
THR_compassion_of_non_return_effect_tt: "Unlocks internal shelter preparation decisions for Realm states, steadies the country, and marks controlled states for protection work."
THR_sit_beneath_prayer_flags_effect_tt: "Adds Bodhi Progress, Meditation Charge, and Detachment, and opens the concentration vow."
THR_first_quiet_ready_tt: "Requires Dhyana Depth to have reached at least §Y1§! through the concentration vow sequence."
THR_second_quiet_ready_tt: "Requires Dhyana Depth to have reached at least §Y2§! through the concentration vow sequence."
THR_third_quiet_ready_tt: "Requires Dhyana Depth to have reached at least §Y3§! through the concentration vow sequence."
THR_fourth_quiet_ready_tt: "Requires Dhyana Depth to have reached §Y4§! through the concentration vow sequence."
THR_quiet_focus_effect_tt: "Adds Meditation Charge and Detachment, and lowers Defilements."
THR_fourth_quiet_effect_tt: "Adds a larger Meditation Charge gain, Detachment, and Defilement reduction."
THR_council_of_abbots_effect_tt: "Chooses abbot governance. Adds Spiritual Legitimacy and eases Compassion Drift."
THR_name_protector_regent_effect_tt: "Names a Protector Regent, adding War Support and Command Power while coercive guardianship raises Defilements."
THR_seat_pilgrim_assembly_effect_tt: "Chooses pilgrim-assembly governance. Expands Mandala Reach and eases Compassion Drift."
THR_abbot_examiners_effect_tt: "Opens a fourth active teaching seat under Council governance, ahead of the wider teaching network. Adds Political Power and Bodhi Progress and eases Compassion Drift."
THR_regent_pass_watch_effect_tt: "Fortifies the capital with a bunker and anti-air, adds Command Power and support equipment, and slightly raises Defilements."
THR_pilgrim_refuge_courts_effect_tt: "Widens compact eligibility to unstable countries in need of refuge. Adds refugee manpower, Mandala Reach, and Sangha Cohesion."
THR_send_first_envoys_effect_tt: "Unlocks Dharma Teaching decisions, adds Bodhi Progress, and eases Compassion Drift."
THR_translation_houses_effect_tt: "Adds Mandala Reach, Bodhi Progress, and one civilian factory in the capital state."
THR_teach_under_bombardment_ready_tt: "Requires Chaos Tier or worse, a world that is ending, or a current war against a chaos country."
THR_teach_under_bombardment_effect_tt: "Teaches the Dharma during a crisis, adding Bodhi Progress and easing Compassion Drift while lowering Defilements."
THR_many_lamps_teaching_ready_tt: "Requires §Y12§! successful teaching missions and at least §Y1§! teaching success during major chaos."
THR_many_lamps_one_flame_effect_tt: "Successful lessons add Bodhi Progress and ease Compassion Drift while lowering Defilements, bringing the Bodhisattva closer to the Unshaken Seat."
THR_four_teaching_seats_effect_tt: "Expands active teaching mission capacity from §Y3§! to §Y4§! and reveals late foreign teaching tools. Buddhahood or One Becomes Many raises capacity to §Y5§!."
THR_the_awakened_one_effect_tt: "Adds Meditation Charge and Detachment after Buddhahood has been realized."
THR_return_to_the_seat_effect_tt: "Unlocks §YRenew the Vow Under Fire§!, adds Meditation Charge and Detachment, and reduces Defilements."
THR_show_the_powers_ready_tt: "Requires at least one Buddha power to have been shown against a true chaos country."
THR_show_the_powers_effect_tt: "Restores Meditation Charge and lowers Chaos after an anti-chaos Buddha power has been revealed."
THR_powers_are_not_toys_ready_tt: "Requires §Y20§! Detachment."
THR_powers_are_not_toys_effect_tt: "Buddha powers stay limited to true chaos countries, and each has its own Meditation Charge cost and cooldown."
THR_one_becomes_many_focus_effect_tt: "Strengthens One Becomes Many, easing Compassion Drift and adding Meditation Charge."
THR_path_through_walls_effect_tt: "Prepares awakened movement against chaos fronts and adds Meditation Charge."
THR_lotus_bridge_focus_effect_tt: "Strengthens Lotus Bridge relief logic through Sangha Cohesion and Meditation Charge."
THR_read_pattern_suffering_effect_tt: "Makes the Pattern of Suffering a working teaching, adding Detachment and Meditation Charge once the Realm has enough proof."
THR_vanishing_from_sight_focus_effect_tt: "Uses awakened rescue work against chaos fronts, adding Detachment and Meditation Charge."
THR_seated_in_sky_focus_effect_tt: "Uses the Seated in the Sky power for disciplined emergency response, adding Command Power and Meditation Charge while lowering Defilements."
THR_touch_sun_moon_focus_effect_tt: "The Buddha reaches for the Sun and Moon during World Collapse, restoring Meditation Charge and lowering Defilements."
THR_debate_the_pretender_focus_effect_tt: "Resolves the Schism through public teaching. Defilements fall and Compassion Drift eases."
THR_exile_the_echo_effect_tt: "Drives the pretender's followers beyond the passes and ends the Schism at home. Compassion Drift rises slightly. The echo survives abroad and stains the path to Buddhahood."
THR_break_false_mandala_effect_tt: "Breaks the Schism by force. Defilements, Compassion Drift, and Chaos rise."
THR_false_buddha_response_unresolved_tt: "Choose one response to the False Buddha."
THR_absorb_the_shadow_ready_tt: "Requires Total Chaos or worse. Absorbing the shadow is a shortcut that corrupts the awakening."
THR_absorb_the_shadow_effect_tt: "Absorbs the Schism into the Realm's own doctrine. Meditation Charge, Final Silence Pressure, Compassion Drift, and Chaos rise, Defilements deepen, and the corrupted doctrine takes root."
THR_doctrine_last_war_effect_tt: "Opens the Last Wheel, commits the Realm to preparing Final Silence, and raises Chaos. Final Silence still needs witnesses, the Extinction rite, an armed doctrine, a dominant Final Silence side in the doctrine balance, and final authorization."
THR_witnesses_gather_ready_tt: "Requires the Mandala of Nations, twelve successful teachings, or Total Chaos."
THR_witnesses_gather_effect_tt: "Gathers the witnesses for the final doctrine, raising Final Silence Pressure and Sangha Cohesion."
THR_extinction_focus_ready_tt: "Requires the Extinction of Defilements Buddha-power rite to be completed first."
THR_extinction_of_defilements_focus_effect_tt: "The completed Extinction rite raises Final Silence Pressure and lowers Defilements."
THR_empty_seat_effect_tt: "Stabilizes the Empty Seat aftermath through Sangha Cohesion and Chaos reduction."
THR_witnesses_keep_the_record_effect_tt: "Countries taught or aided by the Realm and its compact members become witnesses of the Empty Seat. They gain opinion and stability. Compact members also gain war support, and the Sangha grows closer if at least three answer."
THR_convene_mountain_assembly_effect_tt: "Unlocks Dharma Teaching decisions, advances the Bodhisattva bhumi, adds §Y300§! Political Power, §Y50§! Command Power, Spiritual Legitimacy, and a small Chaos reduction."
THR_seal_of_refuge_effect_tt: "Codifies refuge law, marks controlled states as protected, adds manpower, stability, infrastructure, civil industry, Spiritual Legitimacy, Mandala Reach, and a small Chaos reduction."
THR_rewrite_civil_register_effect_tt: "Arhat administration improves compliance and lowers resistance in controlled non-core states. Controlled core states gain infrastructure and civil industry."
THR_vow_keeper_regiments_effect_tt: "Creates an elite Vow-Keeper Mountaineer template, equips it, spawns §Y6§! strong mountain divisions in the capital state, and unlocks pilgrimage escort missions."
THR_storehouses_for_world_effect_tt: "Builds a supply hub in a controlled Realm state, adds [?constant:holy_realm_focus_reward.sanctuary_storehouse_command_power|.0] Command Power and increases Mandala Reach. If the Mandala of Nations exists, Sangha Cohesion also rises."
THR_unbroken_pass_effect_tt: "Adds the Last-Pass Mobilization national spirit, Command Power, Spiritual Legitimacy, and a small Chaos reduction."
THR_world_marked_as_wound_effect_tt: "The Realm's doctrine raises Mandala Reach and Final Silence Pressure. It also increases Chaos and calls the Bodhisattva to teach about the suffering of foreign lands."
holy_realm_teaching_slot_available_tt: "An active teaching seat is open."
THR_conquest_mandala_reach_required_tt: "Requires Mandala diplomacy, the Quiet Envoys, or enough Mandala Reach to pressure border courts."
THR_conquest_high_doctrine_required_tt: "Requires the Buddha Mandate, Divine Sovereignty, or coercive pacification doctrine."
THR_labs_snow_line_bonus: "Laboratories at the Snow Line"
THR_vow_keeper_regiments_bonus: "Vow-Keeper Regiments"
THR_final_silence_bonus: "Doctrine of the Last War"

chaosx_super_event.7.t: "The Awakened One"
chaosx_super_event.7.q: "he stands, dispelling the hosts of Mara, like the sun that illuminates the sky. \n §Y-Vinaya Texts, Mahavagga I.1.7-§!"
chaosx_super_event.7.a: "The wheel turns."
chaosx_super_event.7.d: "At the Unshaken Seat, the Bodhisattva has awakened. The monks proclaim that craving has been extinguished and the Dharma seen directly. Pilgrims bow along the mountain roads as the temple bells announce the Buddha.\n\nThe Holy Realm now follows him as its teacher and ruler. His first teaching calls every subject to discipline the mind, practice compassion, and abandon the causes of suffering."
chaosx_super_event.8.t: "The Final Silence"
chaosx_super_event.8.q: "Where is it that both name and form die out, leaving no trace behind? \n §Y-Kevaddha Sutta, DN 11-§!"
chaosx_super_event.8.a: "The seat is empty."
chaosx_super_event.8.d: "The Buddha has entered final Nirvana and left the seat empty. His last instruction releases the armies from war and closes the rites that summoned his powers.\n\nMonasteries ring the passing bell as soldiers lay down their weapons. The Holy Realm remains under the Empty Seat, guarded by disciples who preserve the teachings and refuse to name another Buddha."
chaosx_super_event.9.t: "Fallout After Final Silence"
chaosx_super_event.9.q: "As the extinction of a flame, even so was his mind's release. \n §Y-The Death of Buddha-§!"
chaosx_super_event.9.a: "Nothing answered."
chaosx_super_event.9.d: "Final Silence has called Fallout as the last order leaves the mountains. The Empty Seat remains above the passes while the world faces its final calamity.\n\nThe Mandala's vow passes beyond the old borders with the last teaching."
chaosx_super_event.10.t: "The Mandala Breaks"
chaosx_super_event.10.q: "Victory breeds hatred, for the conquered is unhappy. \n §Y-Dhammapada 201-§!"
chaosx_super_event.10.a: "The circle fails to close."
chaosx_super_event.10.d: "The rite of Final Silence has been broken. Foreign attacks, rebellion, and failed launch control have shattered the Holy Realm's command network before the passage could be completed.\n\nMonasteries close their gates, frightened disciples scatter, and surviving custodians guard the unfinished doctrine. The Realm must restore discipline and confront the suffering caused by its failed rite."
chaosx_super_event.11.t: "Divine Sovereignty"
chaosx_super_event.11.q: "A man is not just if he carries a matter by violence. \n §Y-Dhammapada 256-§!"
chaosx_super_event.11.a: "Office and altar share a seal."
chaosx_super_event.11.d: "The ruler has joined the Wheel of Dharma to the seal of state and declared his command sacred law. Monasteries administer public oaths, officials enforce religious discipline, and every ministry answers to his personal mandate.\n\nThe Holy Realm now teaches that obedience to the sovereign preserves right order. Law, ritual, and government proceed from the same throne."
chaosx_super_event.61.t: "Powers of the Awakened"
chaosx_super_event.61.q: "Get rid of this disposition, train yourself, and remain in that. \n §Y-Kevaddha Sutta, DN 11-§!"
chaosx_super_event.61.a: "The armies stopped speaking."
chaosx_super_event.61.d: "Through disciplined concentration, the Buddha has displayed the higher powers before the armies of chaos. He crosses guarded ground without obstruction and appears beyond lines that no traveler could pass. Soldiers abandon positions they can no longer defend against him.\n\nThe monks teach that these powers arise from meditation and remain inferior to liberation. They are used to restrain cruelty, protect living beings, and clear a path for the Dharma."
chaosx_super_event.51.t: "Mandala of Nations"
chaosx_super_event.51.q: "Hatred is never appeased by hatred in this world. \n §Y-Dhammapada 5-§!"
chaosx_super_event.51.a: "The white flags answer each other."
chaosx_super_event.51.d: "The Holy Realm has gathered its allies into the Mandala of Nations. Each member vows to shelter refugees, submit disputes to witnessed mediation, and defend communities threatened by chaos.\n\nThe compact applies Buddhist compassion through shared roads, granaries, hospitals, and protected white flags. Its members seek peace through restraint, mutual aid, and patient settlement of conflict."

holy_realm_bodhisattva_category: "Bodhisattva Missions"
holy_realm_bodhisattva_category_desc: "The Bodhisattva travels, teaches, and visits foreign courts to spread the Holy Realm's influence. Stronger missions need Spiritual Legitimacy and Mandala Reach."
holy_realm_buddha_powers_category: "Powers of the Awakened"
holy_realm_buddha_powers_category_desc: "Buddha powers spend Meditation Charge, mostly against true chaos enemies, and each use lowers Chaos and Defilements. Lotus Bridge opens a relief route to a compact member or recently aided friend.\n\nMeditation Charge: §Y[?meditation_charge|.0]§!"
holy_realm_false_buddha_category: "False Buddha Schism"
holy_realm_false_buddha_category_desc: "The Mandala has split around a pretender. Debate can return the schism to teaching, and suppression ends the challenge at a cost to the Bodhisattva's path."
holy_realm_last_pass_mobilization: "Last-Pass Mobilization"
holy_realm_last_pass_mobilization_desc: "The Realm formed under immediate threat. Refuge officers, monks, and mountaineer cadres are committed to holding the last roads long enough for the new order to survive."
holy_realm_one_mandala_state: "One Mandala State"
holy_realm_one_mandala_state_desc: "The refuge, Bodhisattva, Arhats, and Buddha Mandate share one public identity. Every road, court, and shelter belongs to the same vow."
holy_realm_mandala_protectorate: "Mandala Protectorate"
holy_realm_mandala_protectorate_DEF: "the Mandala Protectorate"
holy_realm_mandala_protectorate_ADJ: "Mandala"

THR_bodhisattva_refuge_circuit: "Walk the Refuge Circuit"
THR_bodhisattva_refuge_circuit_desc: "Walk the refugee roads and high-valley shelters with the Bodhisattva. Requires Spiritual Legitimacy above §Y32§! and an open teaching seat. Advances the bhumi, raises Spiritual Legitimacy, and lowers Final Silence Pressure."
THR_bodhisattva_visit_neighboring_country: "Visit a Neighboring Court"
THR_bodhisattva_visit_neighboring_country_desc: "Send the Bodhisattva to a neighboring country. Requires Spiritual Legitimacy above §Y42§! and an open teaching seat. The visit can improve relations and extend Mandala Reach."
THR_bodhisattva_visit_distant_unstable_country: "Visit a Distant Unstable Country"
THR_bodhisattva_visit_distant_unstable_country_desc: "A long and costly mission to a weak or unstable foreign state. Requires Spiritual Legitimacy above §Y50§!, Mandala Reach above §Y35§!, and the Translation Houses focus."
THR_bodhisattva_visit_collapsing_capital: "Visit a War-Torn Capital"
THR_bodhisattva_visit_collapsing_capital_desc: "Send the Bodhisattva to a capital close to collapse. Requires Spiritual Legitimacy above §Y60§!, Mandala Reach above §Y45§!, and the Teach under Bombardment focus. The visit costs more Political Power and raises Spiritual Legitimacy."
THR_bodhisattva_hold_teachings_for_refugees: "Hold Teachings for Refugees"
THR_bodhisattva_hold_teachings_for_refugees_desc: "Hold a teaching circuit among the refugees. Requires Spiritual Legitimacy above §Y38§!. Advances the bhumi, raises stability and Spiritual Legitimacy, and lowers Compassion Drift."
THR_bodhisattva_teach_foreign_officers: "Teach Foreign Officers"
THR_bodhisattva_teach_foreign_officers_desc: "Turn visiting officers into disciplined witnesses. Requires Mandala Reach above §Y30§! and the Translation Houses focus. Advances the bhumi and grants army experience, Command Power, and Mandala Reach."
THR_bodhisattva_send_letters_after_visit: "Send Letters After a Visit"
THR_bodhisattva_send_letters_after_visit_desc: "Follow a foreign visit with letters of names, shelters, and open roads. The country must already have received the Bodhisattva. Requires the Four Teaching Seats focus."
THR_bodhisattva_establish_mandala_mission: "Establish a Mandala Mission"
THR_bodhisattva_establish_mandala_mission_desc: "Create a small spiritual mission in a country the Bodhisattva has visited. Requires Spiritual Legitimacy above §Y62§!, Mandala Reach above §Y48§!, and the Four Teaching Seats focus. Improves its opinion of the Realm and raises Mandala Reach."
THR_bodhisattva_invite_foreign_pilgrims: "Invite Foreign Pilgrims"
THR_bodhisattva_invite_foreign_pilgrims_desc: "Bring foreign pilgrims into the Realm. Requires Spiritual Legitimacy above §Y45§! and the Four Teaching Seats focus. Raises stability, Spiritual Legitimacy, and Mandala Reach."
THR_bodhisattva_guard_pilgrimage_route: "Guard the Pilgrimage Route"
THR_bodhisattva_guard_pilgrimage_route_desc: "Keep two divisions in a controlled pass or protected road throughout the §Y60-day§! escort. Losing the units or the state cancels the order, refunds Political Power, Command Power, and Support Equipment, raises Defilements, and lowers Sangha Cohesion."
THR_bodhisattva_guard_pilgrimage_route_divisions_tt: "At least §Y2§! divisions must be present in the selected state."
THR_bodhisattva_guard_pilgrimage_route_busy_tt: "Only one pilgrimage escort can be active at a time."
THR_bodhisattva_guard_pilgrimage_route_cost_tt: "Requires at least §Y20§! Command Power and §Y120§! Support Equipment."
THR_bodhisattva_guard_pilgrimage_route_success_tt: "The escorted route holds. The state gains infrastructure and is marked as guarded. The Realm gains Bodhi, Sangha Cohesion, Mandala Reach, and Army Experience, and Compassion Drift eases."
THR_bodhisattva_guard_pilgrimage_route_failure_tt: "The route is not secure when the escort ends. Defilements rise and Sangha Cohesion falls."
THR_bodhisattva_support_sympathetic_government: "Support a Sympathetic Government"
THR_bodhisattva_support_sympathetic_government_desc: "A rare conversion attempt. Requires Spiritual Legitimacy above §Y72§!, Mandala Reach above §Y58§!, the Four Teaching Seats focus, a weak visited target, and no major-power protection."
THR_begin_concentration_sequence: "Begin the Concentration Vow"
THR_begin_concentration_sequence_desc: "Begin the formal concentration sequence. Hold its four beats in order, Intention, Energy, Mind, and Investigation, before the vow expires to gain Meditation Charge, Bodhi, Detachment, and progress toward the next Dhyana."
THR_hold_intention: "Hold Intention"
THR_hold_intention_desc: "Hold the first beat of concentration. It takes several days, advances the sequence, and builds Meditation Charge."
THR_hold_energy: "Hold Energy"
THR_hold_energy_desc: "Hold the second beat of concentration. It takes several days, advances the sequence, and builds Meditation Charge."
THR_hold_mind: "Hold Mind"
THR_hold_mind_desc: "Hold the third beat of concentration. It takes several days, advances the sequence, and builds Meditation Charge."
THR_hold_investigation: "Hold Investigation"
THR_hold_investigation_desc: "Hold the final beat of concentration. The sequence grants Bodhi, Detachment, and Meditation Charge, and the next Dhyana if enough charge has gathered."
THR_renew_vow_under_fire: "Renew the Vow Under Fire"
THR_renew_vow_under_fire_desc: "When a true chaos threat reaches the Realm, its neighbors, or the compact, spend §Y35§! Command Power and §Y150§! Support Equipment to protect the Awakened One's return to stillness."
THR_renew_vow_under_fire_effect_tt: "Slightly lowers Stability, adds Meditation Charge and Detachment, reduces Defilements, and prepares Wrathful Protection."
THR_renew_vow_under_fire_cost_required_tt: "Requires at least §Y35§! Command Power and §Y150§! Support Equipment. This vow also costs §Y1%§! Stability."
THR_realize_buddhahood_beneath_seat: "Realize Buddhahood Beneath the Seat"
THR_realize_buddhahood_beneath_seat_desc: "Under the Unshaken Seat, the Bodhisattva accepts the Buddha Mandate after years of teaching and meditation."
THR_debate_false_buddha_pretender: "Debate the Pretender"
THR_debate_false_buddha_pretender_desc: "Convene the monasteries and let the pretender answer the teachings. Requires Spiritual Legitimacy above §Y40§! and Detachment above §Y20§!. Lowers Defilements, eases Compassion Drift, and ends the schism through teaching."
THR_suppress_false_buddha_pretender: "Suppress the Pretender"
THR_suppress_false_buddha_pretender_desc: "Send officials and guards to end the schism by force. Defilements, Compassion Drift, and War Support rise, and stability falls."
THR_answer_false_buddha_echo_abroad: "Answer the Echo Abroad"
THR_answer_false_buddha_echo_abroad_desc: "Send teachers to the foreign country where the exiled echo has found an audience. Its government may contain the false circle or shelter it."
THR_debate_the_pretender_focus: "Debate the Pretender"
THR_debate_the_pretender_focus_desc: "The pretender is brought before abbots, refugees, soldiers, and witnesses. The Realm answers the counterfeit mandala through teaching."
THR_exile_the_echo: "Exile the Echo"
THR_exile_the_echo_desc: "The false circle can be broken without blood by pushing its teachers beyond the passes. The danger leaves the capital and remains abroad."
THR_break_false_mandala: "Break the False Mandala"
THR_break_false_mandala_desc: "The Realm's officials and guards dismantle the rival shrine. Defilements rise, and its monasteries lose their freedom to oppose the Buddha."
THR_absorb_the_shadow: "Absorb the Shadow"
THR_absorb_the_shadow_desc: "Under extreme chaos, the Realm can fold the false claim into its own doctrine. The power is real, and so is the corruption."
THR_buddha_power_resource_gate_tt: "Requires Buddhahood, enough Meditation Charge, and a power that is not cooling down."
THR_buddha_power_one_becomes_many_gate_tt: "Requires enough Meditation Charge. One Becomes Many must not already be active or cooling down."
THR_buddha_power_extinction_gate_tt: "Requires a sovereign Buddha, Dhyana Depth 4, Defilements below 10, full Meditation Charge, and a prior power shown against a chaos enemy. No false schism can remain."
THR_buddha_power_one_becomes_many: "Power: One Becomes Many"
THR_buddha_power_one_becomes_many_desc: "Spend §Y35§! Meditation Charge to project the Buddha's presence against a true chaos enemy. The target loses stability and war support, and the Realm gains a fifth teaching seat for §Y180 days§!."
THR_buddha_power_passing_through_walls: "Power: Passing Through Walls"
THR_buddha_power_passing_through_walls_desc: "Spend §Y45§! Meditation Charge against a true chaos enemy. Its forces lose organization and recover more slowly."
THR_buddha_power_walking_on_water: "Power: Walking on Water"
THR_buddha_power_walking_on_water_desc: "Spend §Y40§! Meditation Charge against a true chaos enemy. Its supply falters as the Realm's envoys cross rivers without roads."
THR_buddha_power_lotus_bridge: "Power: Lotus Bridge"
THR_buddha_power_lotus_bridge_desc: "Spend §Y40§! Meditation Charge to open a relief route across impossible water to a Mandala member or recently aided friend. Keep its capital for §Y180 days§! to preserve the crossing."
THR_buddha_power_vanishing_from_sight: "Power: Vanishing from Sight"
THR_buddha_power_vanishing_from_sight_desc: "Spend §Y35§! Meditation Charge against a true chaos enemy. Its ministries lose track of the Realm, and its Political Power gain and stability suffer."
THR_buddha_power_seated_in_sky: "Power: Seated in the Sky"
THR_buddha_power_seated_in_sky_desc: "Spend §Y60§! Meditation Charge against a true chaos enemy. Its air strength, war support, and recovery falter beneath the seated figure."
THR_buddha_power_touching_sun_moon: "Power: Touching the Sun and Moon"
THR_buddha_power_touching_sun_moon_desc: "Spend §Y80§! Meditation Charge against a true chaos enemy. Its industry and public confidence falter beneath a sign no ministry can explain."
THR_buddha_power_extinction_defilements: "Power: Extinction of Defilements"
THR_buddha_power_extinction_defilements_desc: "Spend §Y100§! Meditation Charge to complete the inner rite required for Final Silence. Requires Dhyana Depth 4, Defilements below 10, Buddhahood, and a prior Buddha power shown against a true chaos enemy."
holy_realm_power_walls_unsealed: "Walls Unsealed"
holy_realm_power_walls_unsealed_desc: "The country's boundaries of command and shelter have failed under a Buddha power."
holy_realm_power_waters_crossed: "Waters Crossed"
holy_realm_power_waters_crossed_desc: "The country's supply officers report crossings and interruptions where no ordinary route should exist."
holy_realm_power_vanished_sight: "Vanished from Sight"
holy_realm_power_vanished_sight_desc: "The country's ministries cannot keep the Realm's presence fixed in reports or maps."
holy_realm_power_sky_seated: "Seated in the Sky"
holy_realm_power_sky_seated_desc: "People at the front see an impossible seated figure suspended above the battlefield."
holy_realm_power_sun_moon_touched: "Sun and Moon Touched"
holy_realm_power_sun_moon_touched_desc: "The country's factories and offices slow under a celestial sign associated with the awakened Realm."
holy_realm_power_defilements_extinguished: "Defilements Extinguished"
holy_realm_power_defilements_extinguished_desc: "The country's chaos doctrine has been struck at its motive force, leaving officials unable to explain why zeal has become fear."
THR_send_regional_peace_letter: "Send Regional Letter of Peace"
THR_send_regional_peace_letter_desc: "Send a peace offer to a regional government beyond the Realm's immediate neighbors. Requires Spiritual Legitimacy above §Y52§! and Mandala Reach above §Y45§!. Acceptance can bring peaceful submission, protectorate status, or later integration. A country that refuses is not asked again for a year."
THR_integrate_mandala_protectorate_state: "Integrate a Protectorate State"
THR_integrate_mandala_protectorate_state_desc: "Draw one eligible state from a Mandala protectorate into direct Realm administration. Requires Mandala Reach above §Y45§!. Other land stays under the protectorate."

chaosx.nr3.120.t: "The Bodhisattva at the Border Court"
chaosx.nr3.120.d: "The visitor arrived without a treaty draft and spoke to the court about refuge, restraint, and the cost of closing roads to the desperate."
chaosx.nr3.120.a: "Receive the visitor."
chaosx_nr3_120_a_tt: "Receives the visitor. Stability rises slightly and the country thinks better of the Realm. The Realm gains Spiritual Legitimacy."
chaosx.nr3.121.t: "A Distant Teaching Mission"
chaosx.nr3.121.d: "Foreign officials argued over the meaning of the Bodhisattva's arrival. The crowd outside had already learned the name of the Realm before the argument ended."
chaosx.nr3.121.a: "Let the mission speak."
chaosx.nr3.121.b: "Turn the mission away."
chaosx_nr3_121_a_tt: "Lets the mission speak. Stability rises and War Support falls slightly, and the country thinks better of the Realm. The Realm gains Mandala Reach."
chaosx_nr3_121_b_tt: "Turns the mission away. The country thinks worse of the Realm, and the Realm loses Spiritual Legitimacy."
chaosx.nr3.122.t: "The Bodhisattva Enters the War-Torn Capital"
chaosx.nr3.122.d: "The capital's shelters opened before the ministries did. The Bodhisattva spoke to officers, widows, and clerks in the same hall, as if rank had become another form of injury."
chaosx.nr3.122.a: "Thank them for hearing the Bodhisattva."
chaosx_nr3_122_a_tt: "Thanks the Bodhisattva. Stability and War Support rise. The Realm gains Spiritual Legitimacy and Mandala Reach."
chaosx.nr3.123.t: "Letters After the Visit"
chaosx.nr3.123.d: "The letters listed names, shelters, debts, and the roads left open after the Bodhisattva departed, and they asked for nothing in return."
chaosx.nr3.123.a: "Deliver the letters."
chaosx_nr3_123_a_tt: "Delivers the letters. The country thinks better of the Realm, and the Realm gains Spiritual Legitimacy."
chaosx.nr3.124.t: "A Government Looks to the Mandala"
chaosx.nr3.124.d: "The state is weak, isolated, and recently visited. Ministers weigh protectorate vows against another month of collapse."
chaosx.nr3.124.a: "Enter the Mandala."
chaosx.nr3.124.b: "Remain outside."
chaosx_nr3_124_a_tt: "The country becomes a Mandala protectorate or peacefully submits eligible territory."
chaosx_nr3_124_b_tt: "Refuses the Mandala. The Holy Realm gains Mandala Reach and Compassion Drift."
chaosx.nr3.125.t: "Letters Carried Past the Guns"
chaosx.nr3.125.d: "Mandala envoys ask this government to name one active enemy and accept arbitration. A white flag will be raised for both sides at the hearing, and the envoys promise nothing about the war itself."
chaosx.nr3.125.a: "Hear the other side."
chaosx.nr3.125.b: "Return the letter unopened."
chaosx_nr3_125_a_tt: "The other belligerent receives a matching offer. Peace follows only if both sides accept."
chaosx_nr3_125_b_tt: "Refuses Mandala arbitration. The Realm still gains Mandala Reach from the offer."
chaosx.nr3.126.t: "The Second Letter Arrives"
chaosx.nr3.126.d: "The enemy has allowed Mandala witnesses to carry a second letter across the line. It proposes a white peace, signed before foreign witnesses who will remember who accepted it."
chaosx.nr3.126.a: "Sign under the white flag."
chaosx.nr3.126.b: "Keep the front open."
chaosx_nr3_126_a_tt: "If the first side is still at war with this country, both sides sign a white peace."
chaosx_nr3_126_b_tt: "Refuses the second letter. The Realm still gains Mandala Reach from the offer."
chaosx.nr3.127.t: "The White Flags Hold"
chaosx.nr3.127.d: "The Mandala letters brought two exhausted governments to the same table, and the war ended. The mountain envoys leave carrying the signed pages."
chaosx.nr3.127.a: "Enter the signatures."
chaosx_nr3_127_a_tt: "Ends the war through Mandala arbitration, raises Mandala Reach and Spiritual Legitimacy, and lowers Chaos."
chaosx.nr3.128.t: "The Mandala Declines the Request"
chaosx.nr3.128.d: "The Mandala of Nations admits only governments that respect each other's sovereignty, share refuge law, and stand together against chaos. This country's foreign obligations and wars no longer fit those terms."
chaosx.nr3.128.a: "The compact no longer has a place for us."
chaosx_nr3_128_a_tt: "This country leaves the Mandala of Nations because it does not meet compact membership rules."
chaosx.nr3.129.t: "A Name Is Turned Away"
chaosx.nr3.129.d: "[holy_realm_compact_rejected_country.GetName] sought entry into the Mandala of Nations without the standing to protect its members. The Realm turned the request away, and the compact's cohesion suffered for the dispute."
chaosx.nr3.129.a: "Keep the circle small."
chaosx_nr3_129_a_tt: "The invalid entrant is removed from the Mandala of Nations, and Sangha Cohesion falls."
chaosx.nr3.130.t: "A Member Leaves the Mandala"
chaosx.nr3.130.d: "[holy_realm_compact_departing_country.GetName] has left the Mandala of Nations and is no longer bound by its Peace Vow. The remaining members renew their pledge to protect those who seek refuge."
chaosx.nr3.130.a: "The remaining members keep the vow."
chaosx_nr3_130_a_tt: "The remaining members keep the Mandala of Nations together after a departure."
chaosx.nr3.131.t: "The Echo at the Foreign Gate"
chaosx.nr3.131.d: "The exiled teachers have arrived as translators, witnesses, orphan committees, and men who insist that the Holy Realm sent away its own reflection because it feared the answer.\n\nThe ministry sees a theological quarrel tangled up with refugee camps and foreign agents, and it must decide whether the exiles are guests or a threat."
chaosx.nr3.131.a: "Seal the counterfeit circle."
chaosx.nr3.131.b: "Let the rival teachers speak."
chaosx_nr3_131_a_tt: "Contains the exiled teachers. Stability rises slightly. The Holy Realm gains Detachment and Mandala Reach, and its Defilements fall."
chaosx_nr3_131_b_tt: "Shelters the exiled teachers. Stability falls. The Holy Realm's Defilements and Final Silence Pressure rise."

chaosx.events_log.evolution.type.holy_realm: "§YHoly Realm Evolution§!"
chaosx.events_log.window.event_details.holy_realm: "The Holy Realm begins in the Himalayan passes, where a Bodhisattva leads monks and refugees toward a guarded refuge. Its vows shape how the Arhats govern and how envoys approach distant courts.\n\nAs suffering spreads, the Realm's promise of mercy hardens into military doctrine. The Mandala reaches beyond the mountains, and its members must decide whether their vows can survive the pressure of the world around them.\n\nThe Realm can end in two ways. If Final Silence is armed and Chaos exceeds 1000, the last order calls Fallout upon the world. Otherwise the Buddha takes the Empty Seat, whether the Realm kept its Vow or not, and the world continues."
chaosx.events_log.window.evolution_details.holy_realm.title.stage_1: "Pattern of Suffering"
chaosx.events_log.window.evolution_details.holy_realm.title.stage_2: "Relic Mandala"
chaosx.events_log.window.evolution_details.holy_realm.title.stage_3: "False Buddha Schism"
chaosx.events_log.window.evolution_details.holy_realm.title.stage_4: "Wrathful Protection"
chaosx.events_log.window.evolution_details.holy_realm.body.generic: "A crisis or transformation has changed the Holy Realm's course, and the surviving vows still bind it."
chaosx.events_log.window.evolution_details.holy_realm.body.stage_1: "Repeated teachings under chaos pressure make suffering itself the Realm's central proof. Ruined roads, frightened capitals, and broken armies are treated as evidence that mercy must answer the crisis directly."
chaosx.events_log.window.evolution_details.holy_realm.body.stage_2: "The Relic Mandala carries the Realm's vows beyond its own mountains. Pilgrim routes, foreign seats, and guarded relic lines turn distant states into a sacred network."
chaosx.events_log.window.evolution_details.holy_realm.body.stage_3: "A schism appears when high Defilements corrupt the path toward Buddhahood. Teaching can heal the rupture, while force and exile leave a lasting stain on the path."
chaosx.events_log.window.evolution_details.holy_realm.body.stage_4: "Awakened protection answered the Sun and Moon crisis. The Realm remembers it as the strongest public proof that its powers can turn against chaos."

