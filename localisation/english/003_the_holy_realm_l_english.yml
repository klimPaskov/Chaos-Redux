l_english:
chaosx.nr3.1.t: "The Holy Realm"
chaosx.nr3.5.t: "The Mountains Cannot Receive the Call"
chaosx.nr3.5.d: "No eligible mountain government can shelter the figure. Tibet has first claim to the refuge. Bhutan or Nepal can receive the call only if Tibet is gone and a suitable host remains. No invitation has been sent."
chaosx.nr3.5.a: "Let the call rest."
chaosx.nr3.5.formed.d: "The Holy Realm has already been founded. No second founding can take place."
chaosx.nr3.2.t: "The Figure at the High Monastery"
chaosx.nr3.2.d: "Refugees, monks, deserters, and frightened officials have begun climbing into the high valleys. They are converging on a monastery where lamps stay lit through the night and clerks issue shelter seals in the name of a Bodhisattva who refuses a throne and accepts responsibility for suffering.\n\nFood is counted without panic, children are sent to warm rooms, and soldiers leave their rifles outside the kitchens. The state can treat the mountain refuge as a passing crisis or let the seal become law."
chaosx.nr3.2.a: "Let the monasteries handle it."
chaosx.nr3.2.b: "Invite the figure into government."
chaosx.nr3.2.c: "Restrict the gatherings."
chaosx.nr3.2.e: "Proclaim the new mandate."
chaosx_nr3_2_a_tt: "Keeps the refuge outside government, gains minor stability, and blocks Holy Realm formation here."
chaosx_nr3_2_b_tt: "Forms the Holy Realm, loads the Holy Realm focus tree, creates the Mountain Refuge, and invites Bhutan and Nepal to enter the Mandala."
chaosx_nr3_2_c_tt: "Suppresses the gathering, harms stability, and blocks Holy Realm formation here."
chaosx_nr3_2_e_tt: "Forms the Holy Realm at once. The Bodhisattva begins under stricter vows."
chaosx.nr3.3.t: "A Seal from [From.GetName]"
chaosx.nr3.3.d: "[From.GetName] has sent white-clothed clerks through the passes with an unusual offer of shared refuge. The text speaks of protected roads, monastery stores, and administrative continuity under a new seal. Its language carries religious, political, and military weight."
chaosx.nr3.3.a: "Accept the seal."
chaosx.nr3.3.b: "The pass remains ours."
chaosx_nr3_3_a_tt: "Joins the Holy Realm peacefully. The Realm annexes the country, cores Himalayan states, and gains Mandala Reach and Spiritual Legitimacy."
chaosx_nr3_3_b_tt: "Refuses the seal and remains independent. The Realm gains Mandala Reach and can still bring the mountain courts together."
chaosx.nr3.4.t: "The Roads Climb Toward Silence"
chaosx.nr3.4.d: "Refugees arrived before the snow melted, followed by deserters, widows, monks, wounded soldiers, foreign children, and men who claimed to have forgotten their country.\n\nThe camps are quiet by the standards of the age. Fires are rationed, bread is counted, and patrols guard the border villages. Officers count how many people can be admitted. The Bodhisattva asks what the Realm becomes when it turns people away."
chaosx.nr3.4.a: "Open the refuge roads."
chaosx.nr3.4.b: "Register every name."
chaosx.nr3.4.c: "Close the passes until order returns."
chaosx_nr3_4_a_tt: "Accepts large refugee movement: gains manpower, Spiritual Legitimacy, small Compassion Drift, and slightly reduces Chaos."
chaosx_nr3_4_b_tt: "Counts each arrival, gaining §Y150§! Political Power and Mandala Reach while slightly reducing Chaos."
chaosx_nr3_4_c_tt: "Closes the passes: gains small stability, loses Spiritual Legitimacy, raises Final Silence Pressure, and increases Chaos."
chaosx.nr3.10.t: "The Bodhisattva Accepts the Seal"
chaosx.nr3.10.d: "The Bodhisattva refuses coronation rites. That refusal becomes the constitution. Refuge officials kneel before an empty seat, then rise with authority to feed, shelter, judge, and conscript in the name of mercy."
chaosx.nr3.10.a: "Compassion must govern."
chaosx_nr3_10_a_tt: "Establishes the Bodhisattva-Led State in place of the Mountain Refuge and slightly lowers Chaos."
chaosx.nr3.20.t: "The Arhat Administration"
chaosx.nr3.20.d: "Crowds fill the high valleys, and hungry villages wait for grain. The Arhats offer to feed every settlement and guard its roads, then cast out anyone they call weak in spirit. Their order could hold the refuge together, but it would put daily life in their hands."
chaosx.nr3.20.a: "Let the Arhats take office."
chaosx.nr3.20.b: "Give them rules, not souls."
chaosx_nr3_20_a_tt: "Places the Arhats in charge of civil government and increases Chaos."
chaosx_nr3_20_b_tt: "Keeps the Arhats under review, lowers Compassion Drift, and slightly reduces Chaos."
chaosx.nr3.21.t: "A Village without Petitions"
chaosx.nr3.21.d: "The district office reports that no petitions were filed for ninety days. The Arhat overseer calls it proof of peace. The local clerk has asked to be reassigned.\n\nThe petition box remains in the square. Its slot has been polished smooth by weather, not by use."
chaosx.nr3.21.a: "Praise the overseer."
chaosx.nr3.21.b: "Send an inquiry."
chaosx.nr3.21.c: "Remove the Arhat quietly."
chaosx.nr3.21.e: "Expand the method."
chaosx_nr3_21_a_tt: "Praises the overseer: gains stability, raises Compassion Drift, and increases doctrinal Chaos."
chaosx_nr3_21_b_tt: "Investigates the district: gains Spiritual Legitimacy and slightly reduces Chaos."
chaosx_nr3_21_c_tt: "Removes the overseer: lowers Compassion Drift and slightly reduces Chaos."
chaosx_nr3_21_e_tt: "Expands the silent method: gains Political Power, raises Final Silence Pressure, and significantly increases doctrinal Chaos."
chaosx.nr3.22.t: "The Question of False Attainment"
chaosx.nr3.22.d: "The examinations have produced officials whose vows read correctly and whose districts have become silent too quickly. The Mandala Bureau must decide what the silent districts reveal about the Arhat office and the people who serve it."
chaosx.nr3.22.a: "Expose the false attainment."
chaosx.nr3.22.b: "Seal the record."
chaosx.nr3.22.c: "Review the office, not the man."
chaosx_nr3_22_a_tt: "Exposes false attainment: loses stability, gains Spiritual Legitimacy, and slightly reduces Chaos."
chaosx_nr3_22_b_tt: "Keeps the inquiry from exposing the Arhats, gaining Political Power while raising Compassion Drift and Chaos."
chaosx_nr3_22_c_tt: "Reviews the office: lowers Final Silence Pressure and slightly reduces Chaos."
chaosx.nr3.30.t: "The Unshaken Seat"
chaosx.nr3.30.d: "The Holy Realm has grown beyond a mountain refuge. The Unshaken Seat is prepared, and the Bodhisattva's teachings, meditation, and remaining defilements must answer the ministries' challenge."
chaosx.nr3.30.a: "Let the seat be tested."
chaosx_nr3_30_a_tt: "Marks §YThe Unshaken Seat§! and adds Bodhi. Buddhahood requires §Y108 Bodhi§!, the §YFourth Dhyana§!, Defilements below §Y20§!, twelve successful teachings, and one crisis teaching success."
chaosx.nr3.31.t: "The Question of Compassionate Force"
chaosx.nr3.31.d: "The Mandate has crossed the border in every ministry before it crosses one on the map. The Quietists demand refusal. The envoys ask for white-flag authority. The Arhats argue that mercy which cannot compel has already chosen delay."
chaosx.nr3.31.a: "The witness must remain able to refuse."
chaosx.nr3.31.b: "Stand between armies."
chaosx.nr3.31.c: "Compel peace before suffering grows."
chaosx_nr3_31_a_tt: "Chooses restraint doctrine, lowers Final Silence Pressure, and reduces Chaos."
chaosx_nr3_31_b_tt: "Chooses peacekeeping doctrine, adds the Peacekeeping Mandate idea, raises Mandala Reach, and slightly reduces Chaos."
chaosx_nr3_31_c_tt: "Chooses coercive pacification, adds the Coercive Pacification idea, raises Final Silence Pressure, and increases doctrinal Chaos."
chaosx.nr3.40.t: "The Throne Without a Body"
chaosx.nr3.40.d: "The Arhats argue that a Bodhisattva-led state still depends on human hesitation. A state built to carry sacred responsibility must be able to continue when ordinary signatures fail. The proposal has no crown, only decrees that no one may countersign."
chaosx.nr3.40.a: "Sovereignty must be divine."
chaosx_nr3_40_a_tt: "Enters Divine Sovereignty, replaces the Buddha Mandate idea, raises Final Silence Pressure, and heavily increases Chaos."
chaosx.nr3.70.t: "The Authorization Chamber"
chaosx.nr3.70.d: "The Mandala Bureau has completed sealed routes, restricted ledgers, and messages prepared for governments that may never receive them. Ministers study the doctrine and the roads it names, knowing that every seal narrows the space left for refusal."
chaosx.nr3.70.a: "Arm the final doctrine."
chaosx.nr3.70.b: "Renounce it before the seal hardens."
chaosx_nr3_70_a_tt: "Arms the final doctrine, begins the final notice sequence, raises Final Silence Pressure and global chaos, and notifies other human players."
chaosx_nr3_70_b_tt: "Renounces the final doctrine, lowers Final Silence Pressure, and renews the vow against annihilation."
chaosx.nr3.74.t: "The Ledgers Are Sealed"
chaosx.nr3.74.d: "The target ledgers have been moved beneath stone and guarded by officials who no longer sign their own names. The first notice has passed from doctrine into procedure."
chaosx.nr3.74.a: "Seal the first ledger."
chaosx.nr3.74.b: "Reopen the chamber."
chaosx_nr3_74_a_tt: "Begins the visible Final Silence notice sequence, marks foreign states, raises Final Silence Pressure, and increases Chaos."
chaosx_nr3_74_b_tt: "Renounces Final Silence before launch and records the refusal as a late Vow against Annihilation."
chaosx.nr3.75.t: "No More Peace Delegations"
chaosx.nr3.75.d: "The Foreign Office has stopped accepting delegations that ask the Realm to explain the sealed doctrine. The reply is brief and procedural: the chamber has no further translation to provide."
chaosx.nr3.75.a: "Close the outer road."
chaosx_nr3_75_a_tt: "Closes the outer road. Chaos rises, and the major governments are sent word."
chaosx.nr3.76.t: "Reports from the High Passes"
chaosx.nr3.76.d: "The embassy cable breaks up between sealed airfields, missing ministers, and silent radio towers. One line survives: Final Silence reaches beyond border policy, and the cities must prepare to leave."
chaosx.nr3.76.a: "Prepare containment."
chaosx.nr3.76.b: "Send one final envoy."
chaosx.nr3.76.c: "Evacuate marked cities."
chaosx_nr3_76_a_tt: "Prepares containment. War Support rises and stability falls slightly. The Realm reads the ring around its passes as a threat: its doctrine balance leans toward Final Silence and its Final Silence Pressure rises. A later disruption of the final network strikes harder."
chaosx_nr3_76_b_tt: "Sends one final envoy. Stability falls slightly. The Realm's council hears the plea: its doctrine balance moves toward the Vow, its Final Silence Pressure falls, and its opinion of you improves."
chaosx_nr3_76_c_tt: "Evacuates the capital and the largest cities. War Support rises and stability falls. A share of each city's people flees, which adds Displacement Load that your reception must absorb."
chaosx.nr3.77.t: "The Sky Is Entered into the Register"
chaosx.nr3.77.d: "The Ministry of Silence has begun treating the sky as an administrative route. Airfields report sealed orders. Reactor officers receive prayer slips folded into technical memoranda. The purpose remains unspoken."
chaosx.nr3.77.a: "Record the sky."
chaosx_nr3_77_a_tt: "Tells the people what was seen. Final Silence Pressure and Chaos rise."
chaosx.nr3.78.t: "The Last Debate Is Cancelled"
chaosx.nr3.78.d: "The Quietists arrived before dawn and found the chamber locked. No arrests were made. Their petitions were accepted, stamped, and placed in a cabinet marked for later review."
chaosx.nr3.78.a: "There will be no later debate."
chaosx_nr3_78_a_tt: "Cancels the last debate. Final Silence Pressure and Chaos rise."
chaosx.nr3.79.t: "The World Is Marked as a Wound"
chaosx.nr3.79.d: "The final map does not use enemy colors. It marks cities, ports, rail hubs, farms, and hospitals with the same black ink. The Arhats call this a complete register."
chaosx.nr3.79.a: "The register is complete."
chaosx_nr3_79_a_tt: "Marks the whole world as a wound. Final Silence Pressure and Chaos rise."
chaosx.nr3.71.t: "Foreign Offices Study the Mandate"
chaosx.nr3.71.d: "The Holy Realm has announced a Buddha Mandate that reaches beyond the Himalayas. Its language mixes relief, mediation, and disciplined administration. Nearby governments worry about influence and legitimacy more than war."
chaosx.nr3.71.a: "Open an observation file."
chaosx.nr3.72.t: "Unconfirmed Reports from the Holy Realm"
chaosx.nr3.72.d: "Diplomatic cables from the mountains mention sealed archives, unfamiliar ministry names, and councils that meet without ordinary minutes. No cable can identify what the Realm is preparing."
chaosx.nr3.72.a: "Keep the file open."
chaosx.nr3.73.t: "Final Silence Begins"
chaosx.nr3.73.d: "The Holy Realm has begun Final Silence. Foreign ministries receive no demand, no ultimatum, and no list of enemies. The announcement says only that the last register has closed."
chaosx.nr3.73.a: "The last register closes."
chaosx.nr3.80.t: "The Final Silence"
chaosx.nr3.80.d: "The last order names every land from which suffering might return. In the mountains, the Awakened One approaches the empty seat. Beyond the passes, missile crews wait beneath a sky without prayer.\n\n[GetHolyRealmFinalMemory]\n\nThe Realm holds its breath as the last command reaches Lhasa."
chaosx.nr3.80.a: "Turn the page."
chaosx_nr3_80_a_tt: "Completes Final Silence. If Chaos exceeds 1000, the Realm strikes beyond its borders and devastates the remaining world. Otherwise, the Awakened One departs and the Empty Seat leads the Realm's reconstruction."
chaosx.nr3.81.t: "The Empty Seat"
chaosx.nr3.81.d: "The former leader's name fades from the mountain temples, and the seat remains empty under the guard of witnesses who saw Final Silence. The Sangha Compact keeps its roads open while the surviving towns begin to rebuild."
chaosx.nr3.81.a: "Leave the seat empty."
chaosx.nr3.82.t: "Final Silence Strike Wave"
chaosx.nr3.84.t: "Final Silence Strike"
chaosx.nr3.83.t: "The Mandala Breaks"
chaosx.nr3.83.d: "The missile crews have lost their signal. Flooded roads and foreign aircraft have cut the last routes through the passes. The Awakened One orders the remaining launch sites silent, and the mountain villages are still standing."
chaosx.nr3.83.a: "Keep the roads open."
chaosx.nr3.90.t: "Fallout After Final Silence"
chaosx.nr3.90.d: "The Realm's final order has called in Fallout. The Empty Seat remains above the mountains as the last calamity overtakes the world."
chaosx.nr3.90.a: "There is no answer."
chaosx.nr3.100.t: "A Letter of Peace and Authority"
chaosx.nr3.100.d: "A formal letter has arrived from the Holy Realm. It offers protection, Arhat administration, and entry into the Mandala without war. The last page describes the road that follows a refusal if the Realm decides the pass must be quiet.\n\nAcceptance chance: [GetHolyRealmPeaceLetterAcceptanceChance]\n[GetHolyRealmPeaceLetterAcceptanceReason]"
chaosx.nr3.100.a: "Enter the Mandala without war."
chaosx.nr3.100.b: "Refuse the letter."
chaosx_nr3_100_a_tt: "If accepted, eligible core territory enters the Mandala peacefully. Other land becomes a Mandala protectorate before integration. Mandala Reach and Spiritual Legitimacy rise, and chaos falls slightly."
chaosx_nr3_100_b_tt: "Refuses the letter, increasing Mandala Reach and Compassion Drift and preparing the Realm to force entry."
chaosx.nr3.101.t: "A Letter Is Accepted"
chaosx.nr3.101.d: "[holy_realm_peace_letter_target.GetName] has entered the Mandala without war. The Foreign Office records the submission as a protection compact, and the Arhats begin sorting roads, stores, and local offices under the submitted seal."
chaosx.nr3.101.a: "Record peaceful submission."
chaosx.nr3.102.t: "A Letter Is Refused"
chaosx.nr3.102.d: "[holy_realm_peace_letter_target.GetName] has refused the letter of peace and authority. The Mandala Bureau opens a refusal page, assigns road clerks, and measures the roads that lead beyond the letter."
chaosx.nr3.102.a: "Record refusal."
chaosx.nr3.110.t: "Pramudita, the Joyful Ground"
chaosx.nr3.110.d: "A public teaching explains the first bhumi of the Bodhisattva path: Pramudita, the joy that arises when compassion becomes action. Refuge clerks repeat the phrase while stamping food seals. Soldiers hear it as an order to protect without triumph."
chaosx.nr3.110.a: "Joy belongs to the protected."
chaosx.nr3.110.b: "Joy belongs to disciplined service."
chaosx_nr3_110_a_tt: "Advances the Bodhisattva bhumi, raises Spiritual Legitimacy, and slightly reduces Chaos."
chaosx_nr3_110_b_tt: "Advances the Bodhisattva's training, strengthens the leader, gains §Y5§! Political Power, and raises Mandala Reach."
chaosx.nr3.111.t: "Vimala, the Stainless Ground"
chaosx.nr3.111.d: "The Arhats teach Vimala as stainless conduct. Purity means conduct that leaves no hidden harm in the ledger. Junior officials ask how a perfect register can protect every village without becoming cruel."
chaosx.nr3.111.a: "Audit the office before the village."
chaosx.nr3.111.b: "Let the law face the same questions."
chaosx_nr3_111_a_tt: "Advances the Bodhisattva bhumi, strengthens the leader trait, lowers Compassion Drift, and raises Spiritual Legitimacy."
chaosx_nr3_111_b_tt: "Advances the Bodhisattva's training, strengthens the leader, gains §Y5§! Political Power and Mandala Reach, and gives the Arhats a stricter rule."
chaosx.nr3.112.t: "Acala, the Immovable Ground"
chaosx.nr3.112.d: "The Bodhisattva path names Acala as the immovable ground. The army hears the teaching as steadiness under fire. Quietists warn that immovable compassion can become an immovable command."
chaosx.nr3.112.a: "The vow protects."
chaosx.nr3.112.b: "The vow compels."
chaosx_nr3_112_a_tt: "Advances the Bodhisattva bhumi, strengthens the leader trait, spawns Vow-Keeper Mountaineers, and raises Spiritual Legitimacy."
chaosx_nr3_112_b_tt: "Advances the Bodhisattva bhumi, strengthens the leader trait, gains army experience, and raises Compassion Drift."
chaosx.nr3.113.t: "Dharmamegha, the Cloud of Doctrine"
chaosx.nr3.113.d: "The tenth bhumi, Dharmamegha, is described as a cloud of doctrine that gives rain to all beings. In the late registers the metaphor becomes difficult: rain, order, release, and silence can all be written in the same hand."
chaosx.nr3.113.a: "Let the cloud remain mercy."
chaosx.nr3.113.b: "Let doctrine finish the rain."
chaosx_nr3_113_a_tt: "Advances the Bodhisattva bhumi, strengthens the leader trait, pushes the doctrine balance toward the Vow against Annihilation, and lowers Final Silence Pressure."
chaosx_nr3_113_b_tt: "Advances the Bodhisattva bhumi, strengthens the leader trait, pushes the doctrine balance toward Final Silence, raises Final Silence Pressure, and increases doctrinal Chaos."
holy_realm_peace_letter_reason_major: "Major powers will read the letter as a threat to sovereignty and always refuse."
holy_realm_peace_letter_reason_faction: "Faction members will not submit while bound to another alliance."
holy_realm_peace_letter_reason_mandala_reach: "High Mandala Reach, Holy Realm strength, low target stability, and ongoing war make acceptance barely possible."
holy_realm_peace_letter_reason_possible: "Acceptance is rare and depends on weakness, instability, war pressure, and the Holy Realm's reach."
holy_realm_peace_letter_reason_none: "The target is not desperate enough to treat submission as protection."
