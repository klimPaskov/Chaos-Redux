l_english:
chaosx.nr3.1.t: "The Holy Realm"
chaosx.nr3.5.t: "The Mountains Cannot Receive the Call"
chaosx.nr3.5.d: "No mountain government is able to shelter the figure. Tibet has the first claim to the refuge, and Bhutan or Nepal can receive the call only if Tibet is gone and a suitable host remains. No invitation has been sent."
chaosx.nr3.5.a: "Let the call rest."
chaosx.nr3.5.formed.d: "The Holy Realm already stands and cannot be founded a second time."
chaosx.nr3.2.t: "The Figure at the High Monastery"
chaosx.nr3.2.d: "Refugees, monks, deserters, and frightened officials have begun climbing into the high valleys. They are converging on a monastery where lamps stay lit through the night and clerks issue shelter seals in the name of a Bodhisattva who refuses a throne and accepts responsibility for suffering.\n\nFood is counted without panic, children are sent to warm rooms, and soldiers leave their rifles outside the kitchens. The state can treat the mountain refuge as a passing crisis or let the seal become law."
chaosx.nr3.2.a: "Let the monasteries handle it."
chaosx.nr3.2.b: "Invite the figure into government."
chaosx.nr3.2.c: "Restrict the gatherings."
chaosx.nr3.2.e: "Proclaim the new mandate."
chaosx_nr3_2_a_tt: "Leaves the refuge to the monasteries and raises stability slightly. The Holy Realm cannot form in this country."
chaosx_nr3_2_b_tt: "Founds the Holy Realm, gives it the Holy Realm focus tree and the Mountain Refuge, and invites the neighboring mountain governments to join the Mandala."
chaosx_nr3_2_c_tt: "Breaks up the gatherings. Stability falls and War Support rises slightly. The Holy Realm cannot form in this country."
chaosx_nr3_2_e_tt: "Founds the Holy Realm at once, without inviting the neighboring mountain governments. Raises Spiritual Legitimacy, Final Silence Pressure, and Chaos."
chaosx.nr3.3.t: "A Seal from [From.GetName]"
chaosx.nr3.3.d: "[From.GetName] has sent white-clothed clerks through the passes with an offer of shared refuge. The letter promises protected roads, monastery stores, and continued administration under a new seal, and its signatories include abbots and army officers."
chaosx.nr3.3.a: "Join the Holy Realm."
chaosx.nr3.3.b: "Keep the mountain pass."
chaosx_nr3_3_a_tt: "Joins the Holy Realm without a fight. The Realm annexes this country, takes its core states as its own, and gains Mandala Reach, Spiritual Legitimacy, and Himalayan Unity."
chaosx_nr3_3_b_tt: "Refuses the seal and stays independent. Stability falls slightly. The Realm gains Mandala Reach and can still bring the mountain courts together."
chaosx.nr3.4.t: "The Roads Climb Toward Silence"
chaosx.nr3.4.d: "Refugees arrived before the snow melted, followed by deserters, widows, monks, wounded soldiers, foreign children, and men who claimed to have forgotten their country.\n\nThe camps are quiet. Fires are rationed, bread is counted by the loaf, and patrols guard the border villages. Officers argue over how many more people the valleys can feed. The Bodhisattva asks what the Realm becomes if it turns them away."
chaosx.nr3.4.a: "Open the refuge roads."
chaosx.nr3.4.b: "Learn every family's name."
chaosx.nr3.4.c: "Close the passes until order returns."
chaosx_nr3_4_a_tt: "Admits a large wave of refugees and opens the Realm's reception to every arrival. Adds manpower and Spiritual Legitimacy, eases Compassion Drift slightly, costs a little stability, and slightly lowers Chaos."
chaosx_nr3_4_b_tt: "Registers every arrival and admits refugees under controlled reception. Adds §Y150§! Political Power and Mandala Reach and slightly lowers Chaos."
chaosx_nr3_4_c_tt: "Closes the passes and shuts the Realm's reception. Raises stability slightly, lowers Spiritual Legitimacy, and raises Final Silence Pressure and Chaos."
chaosx.nr3.10.t: "The Bodhisattva Accepts the Seal"
chaosx.nr3.10.d: "The Bodhisattva refuses coronation rites, and that refusal becomes the constitution. Refuge officials kneel before an empty seat, then rise with authority to feed, shelter, judge, and conscript in the name of mercy."
chaosx.nr3.10.a: "Compassion must govern."
chaosx_nr3_10_a_tt: "Establishes the Bodhisattva-Led State in place of the Mountain Refuge and slightly lowers Chaos."
chaosx.nr3.20.t: "The Arhat Administration"
chaosx.nr3.20.d: "Crowds fill the high valleys, and hungry villages wait for grain. The Arhats offer to feed every settlement and guard its roads, on the condition that they may cast out anyone they judge weak in spirit. Their order could hold the refuge together, but it would put daily life in their hands."
chaosx.nr3.20.a: "Let the Arhats take office."
chaosx.nr3.20.b: "Bind the Arhats to written rules."
chaosx_nr3_20_a_tt: "Puts the Arhats in charge of civil government and raises Chaos."
chaosx_nr3_20_b_tt: "Puts the Arhats in office under written rules, lowers Compassion Drift, and slightly lowers Chaos."
chaosx.nr3.21.t: "A Village without Petitions"
chaosx.nr3.21.d: "For ninety days, no villager has come to the district office with a complaint. The Arhat overseer calls the silence a sign of peace. A tired clerk asks to leave the valley, and the petition box stands empty beneath the rain."
chaosx.nr3.21.a: "Praise the overseer."
chaosx.nr3.21.b: "Send an inquiry."
chaosx.nr3.21.c: "Remove the Arhat quietly."
chaosx.nr3.21.e: "Expand the method."
chaosx_nr3_21_a_tt: "Praises the overseer. Raises stability and Compassion Drift, and raises Chaos."
chaosx_nr3_21_b_tt: "Investigates the district. Adds Spiritual Legitimacy, costs a little stability, and slightly lowers Chaos."
chaosx_nr3_21_c_tt: "Removes the overseer. Lowers Compassion Drift and slightly lowers Chaos."
chaosx_nr3_21_e_tt: "Spreads the silent method to more districts. Adds Political Power, raises Final Silence Pressure, and raises Chaos considerably."
chaosx.nr3.22.t: "The Question of False Attainment"
chaosx.nr3.22.d: "The examinations have produced officials whose vows read correctly and whose districts have become silent too quickly. The Mandala Bureau must decide what the silent districts reveal about the Arhat office and the people who serve it."
chaosx.nr3.22.a: "Expose the false attainment."
chaosx.nr3.22.b: "Keep the inquiry closed."
chaosx.nr3.22.c: "Review the office itself."
chaosx_nr3_22_a_tt: "Exposes the false attainment. Costs stability, adds Spiritual Legitimacy, and slightly lowers Chaos."
chaosx_nr3_22_b_tt: "Seals the inquiry. Adds Political Power and raises Compassion Drift and Chaos."
chaosx_nr3_22_c_tt: "Reviews the Arhat office. Lowers Final Silence Pressure and slightly lowers Chaos."
chaosx.nr3.30.t: "The Unshaken Seat"
chaosx.nr3.30.d: "The Holy Realm has grown past a mountain refuge. The Unshaken Seat stands ready, and the Bodhisattva's teaching, meditation, and remaining defilements must answer the ministries' challenge."
chaosx.nr3.30.a: "Ask whether the Bodhisattva is ready."
chaosx_nr3_30_a_tt: "Takes the §YUnshaken Seat§! and adds Bodhi. Buddhahood requires §Y108 Bodhi§!, the §YFourth Dhyana§!, Defilements below §Y20§!, twelve successful teachings, and one teaching success during a major chaos crisis."
chaosx.nr3.31.t: "The Question of Compassionate Force"
chaosx.nr3.31.d: "The Bodhisattva's envoys return from the border with white flags torn by rifle fire. The Quietists demand that every court remain free to refuse the Mandala. The Arhats warn that the passes will fill with refugees if the Realm waits."
chaosx.nr3.31.a: "The witness must remain able to refuse."
chaosx.nr3.31.b: "Stand between armies."
chaosx.nr3.31.c: "Compel peace before suffering grows."
chaosx_nr3_31_a_tt: "Chooses the doctrine of restraint. Grants the Peacekeeping Mandate and lowers Final Silence Pressure and Chaos."
chaosx_nr3_31_b_tt: "Chooses the doctrine of peacekeeping. Adds the Peacekeeping Mandate national spirit, raises Mandala Reach, and slightly lowers Chaos."
chaosx_nr3_31_c_tt: "Chooses coercive pacification. Adds the Coercive Pacification national spirit and raises Final Silence Pressure and Chaos."
chaosx.nr3.40.t: "The Throne Without a Body"
chaosx.nr3.40.d: "The Arhats argue that a Bodhisattva-led state still depends on human hesitation. A state built to carry sacred responsibility must be able to continue when ordinary signatures fail. The proposal has no crown, only decrees that no one may countersign."
chaosx.nr3.40.a: "Sovereignty must be divine."
chaosx_nr3_40_a_tt: "Enters Divine Sovereignty and replaces the Buddha Mandate. Raises Final Silence Pressure and raises Chaos sharply."
chaosx.nr3.70.t: "The Authorization Chamber"
chaosx.nr3.70.d: "Mountain roads close around the missile depots, and envoys carry letters that foreign governments may never answer. Ministers call the plan a necessary mercy. Each new vow leaves less room for refusal."
chaosx.nr3.70.a: "Arm the final doctrine."
chaosx.nr3.70.b: "Renounce it before the seal hardens."
chaosx_nr3_70_a_tt: "Arms the final doctrine and starts the sequence of final notices. Raises Final Silence Pressure and Chaos, and warns every other government."
chaosx_nr3_70_b_tt: "Renounces the final doctrine. Lowers Final Silence Pressure and Chaos, and renews the Vow against Annihilation."
chaosx.nr3.74.t: "The Last Orders Leave the Mountain"
chaosx.nr3.74.d: "Missile crews move through the guarded passes with orders that no longer carry the Bodhisattva's name. Each team knows its target and waits for the signal from Lhasa."
chaosx.nr3.74.a: "Send the orders."
chaosx.nr3.74.b: "Reopen the chamber."
chaosx_nr3_74_a_tt: "Sends the orders. Foreign states are marked for Final Silence, and Final Silence Pressure and Chaos rise."
chaosx_nr3_74_b_tt: "Renounces Final Silence before launch and renews the Vow against Annihilation."
chaosx.nr3.75.t: "No More Peace Delegations"
chaosx.nr3.75.d: "The Foreign Office no longer receives delegations that ask the Realm to explain its sealed doctrine. The printed reply says the chamber has no further translation to give."
chaosx.nr3.75.a: "Close the outer road."
chaosx_nr3_75_a_tt: "Closes the outer road. Chaos rises, and the major governments are sent word."
chaosx.nr3.76.t: "Reports from the High Passes"
chaosx.nr3.76.d: "The embassy cable breaks up between sealed airfields, missing ministers, and silent radio towers. One line survives: Final Silence is aimed at the cities, and they must prepare to leave."
chaosx.nr3.76.a: "Prepare containment."
chaosx.nr3.76.b: "Send one final envoy."
chaosx.nr3.76.c: "Evacuate marked cities."
chaosx_nr3_76_a_tt: "Prepares containment. War Support rises and stability falls slightly. The Realm reads the ring around its passes as a threat: its doctrine balance leans toward Final Silence and its Final Silence Pressure rises. A later disruption of the final network strikes harder."
chaosx_nr3_76_b_tt: "Sends one final envoy. Stability falls slightly. The Realm's council hears the plea: its doctrine balance moves toward the Vow, its Final Silence Pressure falls, and its opinion of you improves."
chaosx_nr3_76_c_tt: "Evacuates the capital and the largest cities. War Support rises and stability falls. A share of each city's people flees, which adds Displacement Load that your reception must absorb."
chaosx.nr3.77.t: "Orders Above the Passes"
chaosx.nr3.77.d: "The Ministry of Silence treats the sky as another road. Airfields seal their hangars, while reactor crews find prayers beside the locked controls. The Buddha gives no answer when they ask what must be carried."
chaosx.nr3.77.a: "Tell the people what we saw."
chaosx_nr3_77_a_tt: "Tells the people what was seen. Final Silence Pressure and Chaos rise."
chaosx.nr3.78.t: "The Last Debate Is Cancelled"
chaosx.nr3.78.d: "The Quietists arrived before dawn and found the chamber locked. Nobody arrested them. A clerk took their petitions, stamped each one, and filed them in a cabinet marked for later review."
chaosx.nr3.78.a: "There will be no later debate."
chaosx_nr3_78_a_tt: "Cancels the last debate. Final Silence Pressure and Chaos rise."
chaosx.nr3.79.t: "The World Is Marked as a Wound"
chaosx.nr3.79.d: "The final map marks cities, ports, rail hubs, farms, and hospitals with the same black ink. The Arhats say the wound has no border."
chaosx.nr3.79.a: "There is no distinction."
chaosx_nr3_79_a_tt: "Marks the whole world as a wound. Final Silence Pressure and Chaos rise."
chaosx.nr3.71.t: "Foreign Offices Study the Mandate"
chaosx.nr3.71.d: "The Holy Realm has announced a Buddha Mandate that reaches beyond the Himalayas. Its language mixes relief, mediation, and disciplined administration. Nearby governments worry about influence and legitimacy more than war."
chaosx.nr3.71.a: "Watch the high passes."
chaosx.nr3.72.t: "Unconfirmed Reports from the Holy Realm"
chaosx.nr3.72.d: "Diplomats returning from the mountains speak of closed monasteries and officials who avoid the words Final Silence. Neighboring governments have begun watching the passes for movement."
chaosx.nr3.72.a: "Keep watching the passes."
chaosx.nr3.73.t: "Final Silence Begins"
chaosx.nr3.73.d: "The Holy Realm has begun Final Silence. Across the mountains, missile crews wait for the command that will decide which countries will survive. The last order is about to leave Lhasa."
chaosx.nr3.73.a: "Send the final order."
chaosx.nr3.80.t: "The Final Silence"
chaosx.nr3.80.d: "The last order names every land from which suffering might return. In the mountains, the Awakened One approaches the empty seat. Beyond the passes, missile crews wait beneath a sky without prayer.\n\n[GetHolyRealmFinalMemory]\n\nThe Realm holds its breath as the last command reaches Lhasa."
chaosx.nr3.80.a: "Carry out the final order."
chaosx_nr3_80_a_tt: "Completes Final Silence. If Chaos exceeds §Y1000§!, the last order calls Fallout upon the world. Otherwise the Awakened One departs and the Empty Seat leads the Realm's reconstruction."
chaosx.nr3.81.t: "The Empty Seat"
chaosx.nr3.81.d: "The former leader's name fades from the mountain temples, and the seat remains empty under the guard of witnesses who saw Final Silence. The Sangha Compact keeps its roads open while the surviving towns begin to rebuild."
chaosx.nr3.81.a: "Leave the seat empty."
chaosx.nr3.82.t: "Final Silence Strike Wave"
chaosx.nr3.84.t: "Final Silence Strike"
chaosx.nr3.83.t: "The Mandala Breaks"
chaosx.nr3.83.d: "The missile crews have lost their signal. Flooded roads and foreign aircraft have cut the last routes through the passes. The Awakened One orders the remaining launch sites silent, and the mountain villages are still standing."
chaosx.nr3.83.a: "Keep the roads open."
chaosx.nr3.90.t: "Fallout After Final Silence"
chaosx.nr3.90.d: "The Realm's final order has called in Fallout. The Empty Seat remains above the mountains as the last calamity overtakes the world."
chaosx.nr3.90.a: "There is no answer."
chaosx.nr3.100.t: "A Letter of Peace and Authority"
chaosx.nr3.100.d: "A formal letter has arrived from the Holy Realm. It offers protection, Arhat administration, and entry into the Mandala without war. The last page describes the road that follows a refusal if the Realm decides the pass must be quiet.\n\n[GetHolyRealmPeaceLetterAcceptanceReason]"
chaosx.nr3.100.a: "Enter the Mandala without war."
chaosx.nr3.100.b: "Refuse the letter."
chaosx_nr3_100_a_tt: "Submits to the Holy Realm without war. Eligible core territory enters the Mandala peacefully and other land becomes a Mandala protectorate before integration. The Realm gains Mandala Reach and Spiritual Legitimacy, and Chaos falls slightly."
chaosx_nr3_100_b_tt: "Refuses the letter. The Realm gains Mandala Reach and Compassion Drift and may prepare to force entry."
chaosx.nr3.101.t: "A Letter Is Accepted"
chaosx.nr3.101.d: "[holy_realm_peace_letter_target.GetName] has entered the Mandala without war. Its roads open to pilgrims and refugees under the Realm's protection, and the Arhats promise to keep its storehouses supplied."
chaosx.nr3.101.a: "Welcome them under the Mandala's protection."
chaosx.nr3.102.t: "A Letter Is Refused"
chaosx.nr3.102.d: "[holy_realm_peace_letter_target.GetName] has refused the letter of peace and authority. The Mandala Bureau files the refusal, assigns road clerks to the border, and begins measuring the roads that lead into that country."
chaosx.nr3.102.a: "Keep the border closed."
chaosx.nr3.110.t: "Pramudita, the Joyful Ground"
chaosx.nr3.110.d: "A public teaching explains the first bhumi of the Bodhisattva path: Pramudita, the joy that arises when compassion becomes action. Refuge clerks repeat the phrase while stamping food seals. Soldiers hear it as an order to protect without triumph."
chaosx.nr3.110.a: "Joy belongs to the protected."
chaosx.nr3.110.b: "Joy belongs to disciplined service."
chaosx_nr3_110_a_tt: "Advances the Bodhisattva's bhumi, raises Spiritual Legitimacy, and slightly lowers Chaos."
chaosx_nr3_110_b_tt: "Advances the Bodhisattva's bhumi, strengthens the leader, adds §Y5§! Political Power, and raises Mandala Reach."
chaosx.nr3.111.t: "Vimala, the Stainless Ground"
chaosx.nr3.111.d: "The Arhats teach Vimala as stainless conduct, a law that leaves no harm unexamined. Junior officials ask how perfect discipline can protect every village without becoming cruel."
chaosx.nr3.111.a: "Audit the office before the village."
chaosx.nr3.111.b: "Let the law face the same questions."
chaosx_nr3_111_a_tt: "Advances the Bodhisattva bhumi, strengthens the leader trait, lowers Compassion Drift, and raises Spiritual Legitimacy."
chaosx_nr3_111_b_tt: "Advances the Bodhisattva's bhumi, strengthens the leader, adds §Y5§! Political Power, and raises Mandala Reach."
chaosx.nr3.112.t: "Acala, the Immovable Ground"
chaosx.nr3.112.d: "The Bodhisattva path names Acala as the immovable ground. The army hears the teaching as steadiness under fire. Quietists warn that immovable compassion can become an immovable command."
chaosx.nr3.112.a: "The vow protects."
chaosx.nr3.112.b: "The vow compels."
chaosx_nr3_112_a_tt: "Advances the Bodhisattva bhumi, strengthens the leader trait, spawns Vow-Keeper Mountaineers, and raises Spiritual Legitimacy."
chaosx_nr3_112_b_tt: "Advances the Bodhisattva bhumi, strengthens the leader trait, gains army experience, and raises Compassion Drift."
chaosx.nr3.113.t: "Dharmamegha, the Cloud of Doctrine"
chaosx.nr3.113.d: "The tenth bhumi, Dharmamegha, is a cloud of doctrine that gives rain to all beings. At Lhasa, the Arhats ask whether the same rain can bring order, release, and silence."
chaosx.nr3.113.a: "Let the cloud remain mercy."
chaosx.nr3.113.b: "Let doctrine finish the rain."
chaosx_nr3_113_a_tt: "Advances the Bodhisattva's bhumi, strengthens the leader trait, moves the doctrine balance toward the Vow against Annihilation, and lowers Final Silence Pressure."
chaosx_nr3_113_b_tt: "Advances the Bodhisattva's bhumi, strengthens the leader trait, moves the doctrine balance toward Final Silence, and raises Final Silence Pressure and Chaos."
holy_realm_peace_letter_reason_major: "A major power cannot accept such a letter without surrendering its sovereignty."
holy_realm_peace_letter_reason_faction: "A member of an alliance cannot answer for itself while the alliance holds it."
holy_realm_peace_letter_reason_mandala_reach: "The Realm's reach and strength, the government's weak footing, and the war around it make acceptance barely possible."
holy_realm_peace_letter_reason_possible: "War, disorder, or the Realm's reach make acceptance possible, though few governments take it."
holy_realm_peace_letter_reason_none: "The government does not feel desperate enough to take submission for protection."
