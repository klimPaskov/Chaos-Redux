chaosx.news.9.t: "A Mountain Refuge Takes Shape"
chaosx.news.9.d: "Reports from the Himalayan passes describe monks, refugees, and local officials gathering around a new shelter seal. The movement calls itself the Holy Realm and presents peace, protection, and orderly reception as its governing purpose.\n\nRefugees are reaching safe mountain roads, local fighting has slowed near protected corridors, and relief offices are operating with unusual calm. Foreign governments are watching the movement take shape."
chaosx.news.9.a: "The mountains keep their own records."
chaosx.news.82.t: "The Mandate beyond the Passes"
chaosx.news.82.d: "Foreign delegations visiting the Holy Realm report strict ritual protocol, unusually efficient refugee corridors, and officials who speak of suffering as an administrative category. Nearby states are watching the Realm's envoys more carefully as its government seeks order and gathers influence."
chaosx.news.82.a: "The reports remain cautious."
chaosx.news.83.t: "Rumors from the Sealed Roads"
chaosx.news.83.d: "Unconfirmed intelligence from remote mountain routes describes closed sacred sites, unusual military transport, and periods of radio silence from Holy Realm bureaus. Several diplomats mention a phrase translated as Final Silence. Its meaning remains unknown."
chaosx.news.83.a: "No one agrees on the meaning."
holy_realm_final_memory_arhats_checked: "The Arhats enter the final chamber under watch, carrying the questions once asked about their rule."
holy_realm_final_memory_arhats_empowered: "The Arhats enter the final chamber without apology. They have governed every mercy that led here."
holy_realm_final_memory_coercive_force: "The doctrine of coercive pacification has already taught the Realm to call force a form of release."
holy_realm_final_memory_open_refuge_roads: "The refuge began with open roads that carried families to safety in the high valleys."
holy_realm_final_memory_closed_roads: "The Arhats sealed the passes and called exclusion a form of mercy."
holy_realm_final_memory_non_return: "The Realm has learned to call release the end of every victory and punishment."
holy_realm_final_memory_world_wound: "The Holy Realm now sees the world as a wound it was meant to close."
holy_realm_final_memory_default: "The Mandala's path runs from a mountain refuge to the last order."

holy_realm_quiet_envoys_opinion: "Quiet Envoys"
holy_realm_condemned_opinion: "Condemned the Mandate"
holy_realm_empty_seat_witness_opinion: "Witnessed the Empty Seat"

holy_realm_mountain_refuge: "Mountain Refuge"
holy_realm_mountain_refuge_desc: "The state is organized around protected valleys, refugee seals, emergency stores, and defended high passes."
holy_realm_bodhisattva_state: "Bodhisattva-Led State"
holy_realm_bodhisattva_state_desc: "The head of state refuses kingship and accepts authority over relief, law, and moral obligation."
holy_realm_bodhisattva_pramudita: "Pramudita Bodhisattva"
holy_realm_bodhisattva_pramudita_desc: "The leader has entered the Joyful Ground. Refuge work becomes easier to justify, the state gains Political Power, and the early Holy Realm feels sincere."
holy_realm_bodhisattva_vimala: "Vimala Bodhisattva"
holy_realm_bodhisattva_vimala_desc: "The leader has entered the Stainless Ground. Civil administration, compliance, and moral authority strengthen as offices are asked to prove their purity."
holy_realm_bodhisattva_acala: "Acala Bodhisattva"
holy_realm_bodhisattva_acala_desc: "The leader has entered the Immovable Ground. The Realm gains stronger mountain defense, special forces capacity, and political discipline."
holy_realm_bodhisattva_dharmamegha: "Dharmamegha Bodhisattva"
holy_realm_bodhisattva_dharmamegha_desc: "The leader has entered the Cloud of Doctrine. At the tenth bhumi the Bodhisattva becomes a major state engine, granting very strong Political Power, research, manpower, organization, and stability bonuses."
holy_realm_arhat_administration: "Arhat Administration"
holy_realm_arhat_administration_desc: "Oath-bound officials administer shelter, registers, factories, and discipline through the Mandala Bureau."
holy_realm_buddha_mandate: "Buddha Mandate"
holy_realm_buddha_mandate_desc: "The Realm claims a duty to prevent suffering beyond its borders through envoys, peacekeepers, and administration."
holy_realm_himalayan_unity: "Himalayan Unity"
holy_realm_himalayan_unity_desc: "Bhutanese, Nepali, and Tibetan routes have entered the same shelter seal. Guides, stores, and local defenders move through the mountain circle with fewer petitions."
holy_realm_outer_pass_guardians: "Guardians of the Outer Passes"
holy_realm_outer_pass_guardians_desc: "The border guard is trained to defend narrow roads, ration altitude supply, and hold the Mandala without triumphal language."
holy_realm_border_quiet: "The Roads Must Be Quiet"
holy_realm_border_quiet_desc: "Outer roads are patrolled as administrative arteries. Travel continues under a seal for every movement."
holy_realm_pacification_without_triumph: "Pacification without Triumph"
holy_realm_pacification_without_triumph_desc: "The army learns to limit its force, but officers still call each blow necessary to protect the valley."
holy_realm_arhat_outer_register: "Outer Valley Courts"
holy_realm_arhat_outer_register_desc: "Arhat registrars classify conquered or integrated valleys by road, vow, storehouse, and petition risk."
holy_realm_mandala_borders: "Mandala Borders"
holy_realm_mandala_borders_desc: "The Mandala Bureau treats nearby courts as pressure points. Its envoys map influence through roads, relief, and sealed petitions."
holy_realm_world_border_doctrine: "The World Is a Border"
holy_realm_world_border_doctrine_desc: "Under extreme chaos, every frontier is treated as a wound where doctrine may be applied by force."
holy_realm_peacekeeping_mandate: "Peacekeeping Mandate"
holy_realm_peacekeeping_mandate_desc: "The Realm sends white-flag formations and relief officers where the world cannot stop the wheel by itself."
holy_realm_coercive_pacification: "Coercive Pacification"
holy_realm_coercive_pacification_desc: "Mercy is interpreted as force applied before suffering grows larger."
holy_realm_divine_sovereignty: "Divine Sovereignty"
holy_realm_divine_sovereignty_desc: "The state claims final authority over the use, refusal, and escalation of all doctrine."
holy_realm_final_silence_network: "Final Silence Network"
holy_realm_final_silence_network_desc: "Missile crews stand ready in guarded mountain sites. Only the central command can release them."
holy_realm_mandala_peace_vow: "Mandala Peace Vow"
holy_realm_mandala_peace_vow_desc: "Members of the Mandala of Nations are bound to refuge, mediation, and defensive aid. The vow blocks offensive war declarations while the country remains inside the faction."
holy_realm_vow_against_annihilation_crusade: "Vow against Annihilation Crusade"
holy_realm_vow_against_annihilation_crusade_desc: "The Realm renounces the final doctrine after coming close enough to know its shape. The vow becomes militant: no totalizing state may be allowed to inherit the world-ending temptation."
holy_realm_vow_against_annihilation_faction_name: "Vow against Annihilation"

holy_realm_mandala_category: "Holy Mandala"
holy_realm_mandala_category_desc: "The Mandala guides refugee relief, authority at home, and the Realm's conduct abroad. Its leaders must decide whether the monasteries protect those who reach them or demand obedience."
holy_realm_mandala_gui_values: "§GSpiritual Legitimacy§!: §Y[?spiritual_legitimacy|.0]§!  §CBodhi§!: §Y[?bodhi_progress|.0]/108§!  §WDhyana§!: §Y[?dhyana_depth|.0]/4§!"
holy_realm_mandala_gui_secondary: "§YTeachings§!: §Y[?teaching_successes|.0]/12§!  §OMeditation Charge§!: §Y[?meditation_charge|.0]§!  §RDefilements§!: §Y[?defilements|.0]§!"
holy_realm_mandala_gui_chaos: "Chaos: [GetHolyRealmColoredChaosValue]  [GetHolyRealmFinalPressureLine]"

holy_realm_mandala_core_tt: "The Mandala changes with teaching, meditation, Buddhahood, wrathful protection, Final Silence, and the Empty Seat."
holy_realm_chaos_value_low: "§G[?global.chaos_meter_value|.0]§!"
holy_realm_chaos_value_rising: "§Y[?global.chaos_meter_value|.0]§!"
holy_realm_chaos_value_high: "§O[?global.chaos_meter_value|.0]§!"
holy_realm_chaos_value_final: "§R[?global.chaos_meter_value|.0]§!"
THR_status_value_row_tt: "These measures show the Realm's strength and restraint."
THR_status_spiritual_legitimacy: "§GSpiritual Legitimacy§!: §Y[?spiritual_legitimacy|.0]§!"
THR_status_spiritual_legitimacy_desc: "Spiritual Legitimacy measures the confidence of subjects, refugees, Arhats, and foreign observers in the Realm as a sincere refuge. It rises from peaceful unification, mercy, Bodhisattva missions, successful protection, low scandal pressure, and nonviolent diplomacy. It falls when doctrine fails or the Realm humiliates its own vows. Positive gains are reduced above §Y55§! and again above §Y80§!, so the last points require major milestones."
THR_status_compassion_drift: "§OCompassion Drift§!: §Y[?compassion_drift|.0]§!"
THR_status_compassion_drift_desc: "Harsh vows, forced pacification, and sealed doctrine deepen Compassion Drift. Relief, open refuge, and honest inquiry ease it."
THR_status_mandala_reach: "§CMandala Reach§!: §Y[?mandala_reach|.0]§!"
THR_status_mandala_reach_desc: "Mandala Reach is the Realm's external religious, diplomatic, administrative, and expansionist reach. It rises from integrated states, protectorates, peace letters, pilgrim routes, accepted submissions, Bodhisattva visits, and major Mandala decisions. Mandala Reach controls diplomacy and expansion decisions, including border integration, northern Indian registers, Chinese registers, peace-letter acceptance modifiers, and late Final Silence preparation requiring at least §Y60§! reach for Ministry-level authorization. Positive gains slow above §Y55§! and again above §Y80§!, so actual regional power is needed for the highest tiers.\n\nCurrent source pattern: [GetHolyRealmMandalaReachSourceLine]"
holy_realm_mandala_reach_source_refuge: "mostly refuge administration, pass roads, and early Bodhisattva missions."
holy_realm_mandala_reach_source_himalayan: "Himalayan consolidation, refuge law, and regional administration."
holy_realm_mandala_reach_source_letters: "peaceful offers from foreign courts, submitted border states, pilgrim roads, and Mandala envoys."
holy_realm_mandala_reach_source_faction: "Mandala of Nations members, relief offices, development missions, and peacekeeping work."
holy_realm_mandala_reach_source_world: "Distant courts hear the Realm's demands, and nearby governments weigh its growing power."
THR_status_sealed_ledger: "[GetHolyRealmFinalPressureLine]"
THR_status_sealed_ledger_desc: "Final Silence Pressure rises from restricted doctrine readings, nuclear preparation, Divine Sovereignty, coercive doctrine, and the Final Silence side of the doctrine balance. It falls from mercy councils, Bodhisattva vow missions, renunciation, and the Vow against Annihilation. It gates Final Silence preparation focuses at §Y45§!, §Y55§!, §Y65§!, and §Y75§! pressure. Gains slow above §Y55§! and again above §Y80§!. The final route still requires Buddhahood, armed doctrine, Final Silence dominance, an anti-chaos Buddha power display, the Extinction of Defilements rite, controlled sanctuary, no active False Buddha Schism, sovereignty, world-end settings, and enough global Chaos for the terminal branch."
holy_realm_mandala_final_pressure_locked: "Final Silence Pressure: §glocked§!"
holy_realm_mandala_final_pressure_veiled: "Final Silence Pressure: §Y[?final_silence_pressure|.0]§!"
holy_realm_mandala_final_pressure_revealed: "Final Silence Pressure: §R[?final_silence_pressure|.0]§!"
holy_realm_mandala_warning_calm: "Final Silence Pressure is quiet. Later doctrine slots remain closed."
holy_realm_mandala_warning_quiet: "No final order has left the mountain. Guarded doors and sealed launches have unsettled the valleys."
holy_realm_mandala_warning_open: "Final Silence Pressure is active."
holy_realm_mandala_warning_active: "Final Silence is active."
holy_realm_panel_stage_mandala_broken: "Mandala Broken"
holy_realm_panel_stage_final_active: "Final Silence Active"
holy_realm_panel_stage_final: "Final Doctrine"
holy_realm_panel_stage_divine: "Divine Sovereignty"
holy_realm_panel_stage_buddha: "Buddha Mandate"
holy_realm_panel_stage_arhat: "Arhat Administration"
holy_realm_panel_stage_bodhisattva: "Bodhisattva State"
holy_realm_panel_stage_refuge: "Mountain Refuge"
holy_realm_panel_doctrine_renounced: "Doctrine: Vow against Annihilation"
holy_realm_panel_doctrine_armed: "Doctrine: Final Silence Armed"
holy_realm_panel_doctrine_divine: "Doctrine: Divine Sovereignty"
holy_realm_panel_doctrine_coercive: "Doctrine: Holy Pacification"
holy_realm_panel_doctrine_peacekeeping: "Doctrine: Peacekeeping Mandate"
holy_realm_panel_doctrine_restraint: "Doctrine: Restraint"
holy_realm_panel_doctrine_open: "Doctrine: Unsettled"
holy_realm_panel_conquest_quiet: "Borders: the mountain circle is not the center of policy."
holy_realm_panel_conquest_open: "Borders: Bhutan or Nepal remain outside the Mandala. The Realm can still pursue the conquest route."
holy_realm_panel_conquest_vow: "Borders: the mountain circle has been completed by vow."
holy_realm_panel_conquest_force: "Borders: the mountain circle is being completed by authority."
holy_realm_panel_conquest_letters: "Borders: letters of peace and authority can be sent to eligible neighbors."
holy_realm_panel_conquest_submission: "Borders: a foreign court has entered the Mandala without war."
holy_realm_panel_conquest_refusal: "Borders: a refusal can push the Realm closer to force."
holy_realm_panel_conquest_roads: "Borders: outer pass controls can turn roads into administration."
holy_realm_panel_conquest_borders: "Borders: the Mandala Bureau can pressure border courts."
holy_realm_panel_conquest_northern_india: "Borders: the Realm may integrate held Raj-core states under Northern Indian protection."
holy_realm_panel_conquest_eastern: "Borders: the Eastern Mandala can integrate held Chinese-core states after Arhat administration."
holy_realm_panel_conquest_world: "Borders: the world has been asked to kneel. This remains expansionist doctrine, separate from Final Silence."
holy_realm_panel_tab_refuge: "Refuge"
holy_realm_panel_tab_arhats: "Arhats"
holy_realm_panel_tab_diplomacy: "Diplomacy"
holy_realm_panel_tab_doctrine: "Doctrine"
holy_realm_panel_tab_warnings_short: "Ledger"
holy_realm_panel_tab_refuge_tt: "Filter to shelter, relief, and pass actions; review Spiritual Legitimacy and global Chaos."
holy_realm_panel_tab_arhats_tt: "Filter to Arhat oversight and civil administration; review Compassion Drift."
holy_realm_panel_tab_diplomacy_tt: "Filter to envoys, mediation, aid, and compact actions; review Mandala Reach."
holy_realm_panel_tab_doctrine_tt: "Filter to doctrine choices and pressure actions; review Final Silence Pressure and doctrine balance."
holy_realm_panel_tab_warnings_tt: "Filter to foreign notices, final preparations, and launch actions; review Final Silence Pressure and Chaos."
holy_realm_panel_tab_refuge_text: "Families cross the passes seeking safety. The Realm can shelter them, count them, or close the roads and preserve its stores."
holy_realm_panel_tab_arhats_text: "The Arhats govern the civil service. Their inquiries can restrain abuses, while sealed doctrine gives oath-bound officials more power over food, roads, and village petitions."
holy_realm_panel_tab_diplomacy_text: "Pilgrims, envoys, and peacekeepers carry the Realm's influence beyond the passes. Neighboring governments may welcome its courts or defend their borders.\n[GetHolyRealmPanelConquestLine]"
holy_realm_panel_tab_doctrine_text: "[GetHolyRealmPanelDoctrineLine]"
holy_realm_panel_tab_warnings_text: "[GetHolyRealmWarningLine]"
holy_realm_foreign_response_category: "Holy Realm Containment"
holy_realm_foreign_response_category_desc: "Foreign observation and response tools become urgent after sealed Holy Realm notices or active world-end behavior."
holy_realm_expansion_category: "Letters of Peace and Authority"
holy_realm_expansion_category_desc: "Expansionist Mandala tools. The Realm sends formal letters to eligible border states, records acceptance or refusal, prepares forced integration after refusal, and cores submitted or administered territory through successive stages."
holy_realm_doctrine_balance_category: "Vow and Final Silence"
holy_realm_doctrine_balance_category_desc: "The doctrine balance moves late Holy Realm politics toward §Gthe Vow against Annihilation§! or §RFinal Silence§!. Decisions here cost Political Power and move the balance directly. Final Silence influence makes Final Silence Pressure tick upward each day. Vow influence makes pressure fall slowly."
holy_realm_final_doctrine_balance: "Vow and Final Silence"
holy_realm_vow_against_annihilation_side: "Vow against Annihilation"
holy_realm_final_silence_side: "Final Silence"
holy_realm_balance_middle_path_range: "Unsettled Doctrine"
holy_realm_vow_influence_range: "Vow Influence"
holy_realm_vow_dominant_range: "Vow Dominant"
holy_realm_final_silence_influence_range: "Final Silence Influence"
holy_realm_final_silence_dominant_range: "Final Silence Dominant"
holy_realm_balance_middle_path_range_tt: "Doctrine is contested. The Realm receives modest stability and Political Power until annihilation or renunciation gains control."
holy_realm_vow_influence_range_tt: "The Vow is shaping policy. Final Silence Pressure falls slowly each day and offensive war becomes politically costly."
holy_realm_vow_dominant_range_tt: "The Vow dominates late doctrine. Final Silence Pressure and Compassion Drift fall daily. Defensive strength and civilian confidence rise."
holy_realm_final_silence_influence_range_tt: "Final Silence Pressure is shaping policy. Pressure and Compassion Drift rise slowly each day, and nuclear production improves."
holy_realm_final_silence_dominant_range_tt: "Final Silence dominates late doctrine. Final Silence Pressure and Compassion Drift rise daily, nuclear preparation accelerates, and the darkest final focuses become available."
THR_bop_mercy_council: "Convene a Mercy Council"
THR_bop_mercy_council_desc: "Spend Political Power to give mercy doctrine institutional weight. Moves the balance toward the Vow, lowers Final Silence Pressure, raises Spiritual Legitimacy, and lowers Chaos once."
THR_bop_mercy_council_effect_tt: "Moves the doctrine balance toward the Vow. Lowers Final Silence Pressure and Compassion Drift, raises Spiritual Legitimacy, and slightly improves stability. The first council also lowers Chaos."
THR_bop_open_lotus_audit: "Open the Lotus Audit"
THR_bop_open_lotus_audit_desc: "Investigate Arhat abuses under mercy doctrine. Requires more than §Y15§! Final Silence Pressure, moves the balance toward the Vow, lowers pressure, and grants §Y16§! Political Power."
THR_bop_open_lotus_audit_effect_tt: "Moves the doctrine balance toward the Vow and lowers Final Silence Pressure. Returns §Y16§! Political Power. Higher tiers add Mandala Reach, Spiritual Legitimacy, stability, Command Power, and a sharper move toward the Vow, as the description lists."
THR_bop_open_lotus_audit_gate_tt: "Requires Final Silence Pressure above §Y15§! or Mandala Reach above §Y20§!."
THR_bop_last_resort_clause: "Adopt the Last-Resort Clause"
THR_bop_last_resort_clause_desc: "Write an emergency doctrine into law without arming Final Silence. Moves the balance toward Final Silence and raises Final Silence Pressure and Compassion Drift. Chaos above §Y250§!, Mandala Reach above §Y15§!, or Compassion Drift above §Y15§! grants Command Power. During Arhat Administration, secret inquiries (Spiritual Legitimacy above §Y30§! or Compassion Drift above §Y25§!) grant more.\n\nWith the Buddha Mandate, Mandala Reach above §Y35§! opens border silence offices that raise Mandala Reach and War Support, and Chaos above §Y500§! treats force as a lawful extension of mercy: the balance moves further and Chaos rises. Unavailable once Final Silence is renounced."
THR_bop_last_resort_clause_effect_tt: "Moves the doctrine balance toward Final Silence. Raises Final Silence Pressure and Compassion Drift and grants Command Power. Higher tiers add Mandala Reach, War Support, Chaos, and a sharper move toward Final Silence, as the description lists."
THR_bop_final_command_drills: "Final Command Drills"
THR_bop_final_command_drills_desc: "Train the launch crews and ministries for the final order. Requires the final path. Moves the balance toward Final Silence, raises Final Silence Pressure, and grants Command Power.\n\nPressure above §Y30§! brings in the Nuclear Sutra Committee, which moves the balance further, raises Chaos, and grants more Command Power. Pressure above §Y55§! with Mandala Reach above §Y50§! adds silence cells for the strongest move. Mandala Reach above §Y35§! also sends silent transit codes to the doctrine offices, which raise Mandala Reach and War Support. Unavailable once Final Silence is renounced."
THR_bop_final_command_drills_effect_tt: "Moves the doctrine balance toward Final Silence. Raises Final Silence Pressure and grants Command Power. Higher tiers add Chaos, Mandala Reach, War Support, and a sharper move toward Final Silence, as the description lists."
THR_bop_seal_the_ledger: "Seal the Ledger"
THR_bop_seal_the_ledger_desc: "Argue in council that the last weapon must stay ready. Requires the final path. Moves the balance toward Final Silence and raises Final Silence Pressure.\n\nPressure above §Y40§! authorizes the launch crews: the balance moves further, and Compassion Drift and Chaos rise. Pressure above §Y70§! with the balance already leaning toward Final Silence holds the Empty Mandala Session, the sharpest move of all. Unavailable once Final Silence is renounced."
THR_bop_seal_the_ledger_effect_tt: "Moves the doctrine balance toward Final Silence and raises Final Silence Pressure. Higher tiers raise Compassion Drift and Chaos and move the balance further, as the description lists."
THR_enter_empty_seat: "Take the Empty Seat"
THR_enter_empty_seat_desc: "The Awakened One passes beyond worldly action and the world goes on. Requires the Extinction of Defilements, a Buddha power shown against chaos, Defilements below §Y10§!, a secured capital, and no False Buddha Schism. The Vow against Annihilation does not close this road. The Empty Seat leads the Realm, the armed doctrine and its warnings end, Chaos falls, and the Buddha powers fall silent."
THR_enter_empty_seat_ready_tt: "Requires Buddhahood, a Buddha power shown against chaos, the Extinction of Defilements rite, Defilements below §Y10§!, a secured capital sanctuary, and no False Buddha Schism."
THR_enter_empty_seat_effect_tt: "The Empty Seat leads the Realm. Chaos falls, the armed doctrine and its warnings end, and the Buddha powers fall silent."
THR_bop_send_bodhisattva_to_council: "Send the Bodhisattva to Council"
THR_bop_send_bodhisattva_to_council_desc: "Once the Bodhisattva has advanced beyond the early teachings, one council appearance moves doctrine toward the Vow and lowers Final Silence Pressure."
THR_repair_high_pass_storehouses: "Repair High-Pass Storehouses"
THR_repair_high_pass_storehouses_desc: "Commit officials and labor to pass roads, storehouses, and shelter routes. Improves a controlled state, raises Spiritual Legitimacy, and extends Mandala Reach."
THR_white_scarf_relief_caravans: "White-Scarf Relief Caravans"
THR_white_scarf_relief_caravans_desc: "Send guarded relief caravans through war and chaos. They can repair one strained state under the Realm's control, but the roads need time to recover."
THR_mandala_ledger_scribes: "Mandala Court Scribes"
THR_mandala_ledger_scribes_desc: "Appoint clerks to the Realm's civil courts. Their work extends Mandala Reach, grants §Y12§! Political Power, and slightly increases Compassion Drift."
THR_snow_line_signal_posts: "Snow-Line Signal Posts"
THR_snow_line_signal_posts_desc: "Build high-altitude signal posts and defensive watches. Grants Command Power, adds local air defense, and extends Mandala Reach."
THR_second_refuge_register: "A Second Refuge"
THR_second_refuge_register_desc: "Open new shelters for families and displaced workers. Requires Spiritual Legitimacy, strengthens the Realm's authority, and reduces Compassion Drift."
THR_arhat_road_audit: "Arhat Road Audit"
THR_arhat_road_audit_desc: "Send Arhats through the outer valleys to enforce the Realm's law. Improves compliance in non-core holdings, grants Command Power, raises Mandala Reach, and increases Compassion Drift."
THR_mandala_border_courts: "Mandala Border Courts"
THR_mandala_border_courts_desc: "Open courts for border disputes and foreign envoys. Requires Mandala Reach above §Y45§!, improves foreign opinion, grants §Y22§! Political Power, and extends the Realm's influence."
THR_bodhisattva_mission_white_scarf_envoys: "Bodhisattva Mission: White-Scarf Envoys"
THR_bodhisattva_mission_white_scarf_envoys_desc: "Send the Bodhisattva with quiet envoys. Advances the bhumi, strengthens the leader trait, raises Mandala Reach, lowers Compassion Drift, and improves foreign opinion. This mission can be undertaken once."
THR_bodhisattva_mission_wounded_border: "Bodhisattva Mission: Wounded Border"
THR_bodhisattva_mission_wounded_border_desc: "Send the Bodhisattva to a tense border during war or a serious chaos threat. Requires Mandala Reach above 35 and advances the bhumi. Final Silence raises Compassion Drift; other doctrines lower its pressure. This mission can be undertaken once."
THR_bodhisattva_bhumi_advancement_required_tt: "The Bodhisattva must still be progressing toward the tenth bhumi."
THR_focus: "Holy Realm Focus Tree"
THR_focus_desc: "The Holy Realm path develops the mountain refuge through teaching, meditation, governance, Mandala diplomacy, anti-chaos powers, and the Final Silence question."
THR_open_refuge_roads: "Open Refuge Roads"
THR_open_refuge_roads_desc: "Let more refugees enter the high valleys and bind them to the shelter seal. The first major opening of the roads slightly lowers global chaos."
THR_register_refugee_lineages: "Learn the Refugee Families"
THR_register_refugee_lineages_desc: "Convert refugee memory into administrative reach. The first full registry slightly lowers global chaos by calming the camps."
THR_close_refuge_roads: "Close Refuge Roads"
THR_close_refuge_roads_desc: "Shut the high passes before the camps become a second country."
THR_open_refuge_roads_closed_policy_tt: "The Realm's reception must not already be open to every refugee."
THR_close_refuge_roads_open_policy_tt: "The Realm's reception must not be open to every refugee."
THR_mandala_open_refuge_corridors: "Open Mandala Refuge Corridors"
THR_mandala_open_refuge_corridors_desc: "Coordinate faction refugee corridors. This act of kindness strengthens the Mandala of Nations and lowers global chaos."
THR_mandala_white_flag_congress: "White-Flag Congress"
THR_mandala_white_flag_congress_desc: "Convene a congress of members while the Realm is at peace. The act records peace as a faction duty and lowers global chaos."
THR_mandala_open_granaries: "Open the Faction Granaries"
THR_mandala_open_granaries_desc: "Open stores across the Mandala of Nations for relief and road repair. Faction members in Africa, South America, and Asia can receive local recovery work where roads, war pressure, or rural conditions make the aid useful."
THR_mandala_demand_anti_puppet_clauses: "Demand Anti-Puppet Clauses"
THR_mandala_demand_anti_puppet_clauses_desc: "Record independence guarantees for the Mandala of Nations. The clauses strengthen Sangha Cohesion, refresh member validity, and make puppet dependence incompatible with the compact's witness role."
THR_mandala_joint_defense_of_passes: "Joint Defense of the Passes"
THR_mandala_joint_defense_of_passes_desc: "When a true chaos threat reaches the Realm, its neighbors, or the compact, spend §Y30§! Command Power and §Y220§! Support Equipment to organize a shared defense."
THR_mandala_joint_defense_of_passes_effect_tt: "Strengthens faction initiative and power projection, raises Sangha Cohesion, and sends defensive support to eligible compact members."
THR_mandala_joint_defense_cost_required_tt: "Requires at least §Y30§! Command Power and §Y220§! Support Equipment."
THR_mandala_peacekeeping_cost_required_tt: "Requires at least §Y6,000§! manpower, §Y800§! infantry equipment, and §Y80§! support equipment."
THR_form_great_mandala: "Form the Great Mandala"
THR_form_great_mandala_desc: "Declare a wider non-imperial Mandala identity after Buddhahood, the Refusal of Empires, low Defilements, and either a stable compact or protected sanctuary corridor."
THR_form_great_mandala_effect_tt: "Renames the country to §YThe Great Mandala§!, raises Spiritual Legitimacy and Mandala Reach, and opens decisions to steady the union."
THR_form_silent_mandala: "Form the Silent Mandala"
THR_form_silent_mandala_desc: "After the non-terminal Final Silence and Empty Seat aftermath, let the surviving compact name the quiet identity that remains."
THR_form_silent_mandala_effect_tt: "Renames the country to §YThe Silent Mandala§!, strengthens Sangha Cohesion, reduces Chaos, and opens decisions to rebuild after Final Silence."
THR_great_mandala_stabilize_registers: "Steady the Outer Valleys"
THR_great_mandala_stabilize_registers_desc: "Repair roads and restore order in protected non-core valleys. Resistance falls and compliance rises as the Mandala's influence grows."
THR_great_mandala_refresh_compact_vows: "Refresh Compact Vows"
THR_great_mandala_refresh_compact_vows_desc: "Review the compact after formation, remove invalid Mandala members, and strengthen Sangha Cohesion."
THR_mandala_arbitration_letters: "Letters Carried Past the Guns"
THR_mandala_arbitration_letters_desc: "Target a country at war and ask both sides to accept Mandala arbitration. A white peace is signed only if the first side and one active enemy both accept."
THR_mandala_observer_mission: "Mandala Observer Mission"
THR_mandala_observer_mission_desc: "Send white-flag observers to a country at war. The mission builds diplomatic reach, improves relations, and creates a cooldown before the same target can host another observer mission."
THR_mandala_development_mission: "Mandala Development Mission"
THR_mandala_development_mission_desc: "Send wells, clinics, road crews, and storehouse officers to a poor or war-torn African, South American, or Asian state. The target receives real local recovery work and a cooldown."
THR_assign_arhat_overseers: "Assign Arhat Overseers"
THR_assign_arhat_overseers_desc: "Send oath-bound administrators to settle petitions, ration stores, reduce resistance in non-core administered territory, and expand Mandala Reach at the cost of Compassion Drift."
THR_assign_arhat_to_province: "Assign Arhat to a Province"
THR_assign_arhat_to_province_desc: "Let an Arhat rebuild one controlled state with roads, civil industry, and local administration. Non-core states gain compliance and lower resistance."
THR_assign_arhat_to_army: "Assign Arhat to the Army"
THR_assign_arhat_to_army_desc: "Attach vow-keepers to the regiments guarding the passes and raise a new group of elite Vow-Keeper Mountaineers."
THR_hold_dharma_teaching: "Hold Dharma Teaching"
THR_hold_dharma_teaching_desc: "Teach one ground of the Bodhisattva path to the state. Each teaching can advance the Bodhisattva bhumi, strengthen the leader trait, alter Mandala values, shift the doctrine balance, spawn units, reduce Chaos, or raise Final Silence Pressure according to the chosen interpretation."
THR_question_false_attainment: "Question False Attainment"
THR_question_false_attainment_desc: "Investigate whether an Arhat office has mistaken silence for peace."
THR_investigate_arhat_abuses: "Investigate Arhat Abuses"
THR_investigate_arhat_abuses_desc: "Discipline officials whose detachment has become cruelty. The first investigation slightly lowers global chaos."
THR_send_quiet_envoys: "Send Quiet Envoys"
THR_send_quiet_envoys_desc: "Approach foreign governments through relief, pilgrimage, and private notice."
THR_offer_mediation_to_war_torn_state: "Offer Mediation to a War-Torn State"
THR_offer_mediation_to_war_torn_state_desc: "Send envoys to governments that cannot end their wars. The first mediation effort slightly lowers global chaos."
THR_stand_between_armies: "Stand Between Armies"
THR_stand_between_armies_desc: "Send one Mandala Peacekeeping Brigade to a threatened minor democracy. Requires §Y6,000§! manpower, §Y800§! infantry equipment, and §Y80§! support equipment. The recipient cannot receive another brigade for a year."
THR_demand_pacification_settlement: "Demand a Pacification Settlement"
THR_demand_pacification_settlement_desc: "Tell a belligerent state that the Realm can place peace under administration."
THR_audit_foreign_target_ledgers: "Identify Foreign Targets"
THR_audit_foreign_target_ledgers_desc: "Study foreign casualties, refused peace terms, and military threats. The Buddha sees each capital as another place where suffering may return."
THR_prepare_realm_shelters_for_nonreturn: "Prepare Shelters of Nonreturn"
THR_prepare_realm_shelters_for_nonreturn_desc: "Harden a protected Realm state for the doctrine of nonreturn."
THR_send_global_final_warning: "Send a Final Notice"
THR_send_global_final_warning_desc: "Send one formal notice to a foreign government. Each target can receive this notice only once."
THR_secure_outer_pass_roads: "Secure Outer Pass Roads"
THR_secure_outer_pass_roads_desc: "Turn border roads into protected administrative routes. The decision strengthens the conquest branch without opening Final Silence pressure."
THR_register_outer_valleys: "Govern the Outer Valleys"
THR_register_outer_valleys_desc: "Send Arhat registrars through held valleys to reduce resistance, raise compliance, and bind the roads to the Mandala."
THR_pressure_border_courts: "Pressure Border Courts"
THR_pressure_border_courts_desc: "Use Mandala Reach to pressure neighboring courts. This raises control, suspicion, and a small amount of chaos."
THR_choose_restraint_doctrine: "Doctrine of Restraint"
THR_choose_restraint_doctrine_desc: "Keep the Mandate inside the limits of refusal."
THR_choose_peacekeeping_doctrine: "Doctrine of Peacekeeping"
THR_choose_peacekeeping_doctrine_desc: "Use the Mandate to send protectors across borders."
THR_choose_coercive_pacification: "Doctrine of Coercive Pacification"
THR_choose_coercive_pacification_desc: "Accept force as preventive mercy. This raises global chaos."
THR_renounce_final_silence: "Renounce the Sealed Doctrine"
THR_renounce_final_silence_desc: "Close the sealed doctrine before the state forgets how to refuse it. The first renunciation significantly lowers global chaos."
THR_arm_final_silence: "Arm the Final Doctrine"
THR_arm_final_silence_desc: "Prepare the notice sequence and final strike network."
THR_launch_final_silence: "Begin Final Silence"
THR_launch_final_silence_desc: "Enter Final Silence after Buddhahood, the last doctrine, an anti-chaos power display, and the Extinction of Defilements rite. Chaos above 1000 makes the route terminal when world-end rules allow it. Otherwise the Empty Seat remains."
THR_send_peace_letter: "Send a Letter of Peace"
THR_send_peace_letter_desc: "Send a formal offer to an eligible neighboring country. Acceptance is rare. Major powers and faction members cannot accept. A country that refuses is not asked again for a year."
THR_prepare_forced_integration: "Prepare Forced Integration"
THR_prepare_forced_integration_desc: "A refused letter gives the Realm grounds to declare war. This decision grants a war goal, but armies still have to take the field."
THR_administer_submitted_territory: "Administer Submitted Territory"
THR_administer_submitted_territory_desc: "Send Arhat officials through peacefully submitted or integrated states to raise compliance and reduce resistance."
THR_integrate_himalayan_mandala_state: "Integrate a Himalayan Mandala State"
THR_integrate_himalayan_mandala_state_desc: "Core a held Himalayan or peacefully submitted state after Mandala administration."
THR_mandate_kneeling_province: "Mandate the Kneeling Province"
THR_mandate_kneeling_province_desc: "Integrate an owned and controlled province claimed through The World Is Asked to Kneel without adding it to the normal Mandala core pools."
THR_integrate_northern_indian_register_state: "Integrate a Northern Indian State"
THR_integrate_northern_indian_register_state_desc: "Integrate a held Raj-core state after the Realm establishes its northern Indian authority."
THR_integrate_eastern_mandala_state: "Core an Eastern Mandala State"
THR_integrate_eastern_mandala_state_desc: "Core a held Chinese-core state after the Eastern Mandala, high Mandala Reach, and Arhat administration."
THR_condemn_buddha_mandate: "Condemn the Buddha Mandate"
THR_condemn_buddha_mandate_desc: "Publicly reject the Realm's right to administer foreign suffering."
THR_build_mountain_containment: "Prepare Mountain Containment"
THR_build_mountain_containment_desc: "Prepare borders, intelligence files, and coalition channels for a Holy Realm crisis."
THR_build_mountain_containment_unprepared_tt: "Mountain Containment must not already be prepared."
THR_build_mountain_containment_effect_tt: "War Support rises and stability falls slightly. The Realm's doctrine balance leans toward Final Silence and its Final Silence Pressure rises."
THR_disrupt_final_silence_network: "Disrupt the Final Network"
THR_disrupt_final_silence_network_desc: "Pressure the final doctrine network before it launches."

THR_mountain_refuge: "Mountain Refuge"
THR_mountain_refuge_desc: "Turn the high valleys into a defensible refuge with roads, stores, and legal shelter seals."
THR_shelter_border_villages: "Shelter the Border Villages"
THR_shelter_border_villages_desc: "Accept the villages nearest the passes into the refuge system."
THR_guard_high_passes: "Guard the High Passes"
THR_guard_high_passes_desc: "Fortify the approaches before the lowlands push their wars upward."
THR_bodhisattva_accepts_seal: "The Bodhisattva Accepts the Seal"
THR_bodhisattva_accepts_seal_desc: "Transform the refuge into a Bodhisattva-led state."
THR_first_doctrine_suffering: "The First Doctrine of Suffering"
THR_first_doctrine_suffering_desc: "Make relief, judgement, and policy answer to the language of suffering."
THR_sit_beneath_prayer_flags: "Sit Beneath Prayer Flags"
THR_sit_beneath_prayer_flags_desc: "Give the concentration vows a public place in the focus route. The Realm begins turning meditation from private practice into a state requirement."
THR_first_quiet: "The First Quiet"
THR_first_quiet_desc: "Record the first Dhyana as a public discipline among attendants."
THR_second_quiet: "The Second Quiet"
THR_second_quiet_desc: "Carry the second Dhyana through the offices and the roads that feed them."
THR_third_quiet: "The Third Quiet"
THR_third_quiet_desc: "Require every bureau near the seat to reckon with the stillness it claims to serve."
THR_fourth_quiet: "The Fourth Quiet"
THR_fourth_quiet_desc: "Let the final Dhyana milestone stand as a visible gate before the Unshaken Seat."
THR_council_of_abbots: "Council of Abbots"
THR_council_of_abbots_desc: "Let senior abbots bind doctrine, teaching, and refuge law before the Arhat offices harden around them."
THR_name_protector_regent: "Name a Protector Regent"
THR_name_protector_regent_desc: "Give the refuge a wartime guardian who can command roads and garrisons while the seat remains under vow."
THR_seat_pilgrim_assembly: "Seat the Pilgrim Assembly"
THR_seat_pilgrim_assembly_desc: "Let pilgrims, guides, and witnesses hold a chamber that keeps foreign teaching and compact work close to the state."
THR_abbot_examiners: "Abbot Examiners"
THR_abbot_examiners_desc: "Let senior teachers test every public mission before it leaves the mountains, turning governance into clearer doctrine abroad."
THR_regent_pass_watch: "Regent's Pass Watch"
THR_regent_pass_watch_desc: "Place the Protector Regent's officers at the roads where panic, supplies, and anti-chaos defense meet."
THR_pilgrim_refuge_courts: "Pilgrim Refuge Courts"
THR_pilgrim_refuge_courts_desc: "Let the Pilgrim Assembly judge appeals from unstable neighbors before the compact decides whether refuge can become obligation."
THR_send_first_envoys: "Send the First Envoys"
THR_send_first_envoys_desc: "Send teachers and interpreters beyond the mountain roads. Dharma Teaching decisions become a public arm of the Realm."
THR_translation_houses: "Translation Houses"
THR_translation_houses_desc: "Build houses where vows, petitions, and foreign reports can be carried between languages without becoming ordinary propaganda."
THR_teach_under_bombardment: "Teach under Bombardment"
THR_teach_under_bombardment_desc: "Keep the teaching route open while chaos, world-end pressure, or a chaos war makes every sermon a crisis act."
THR_many_lamps_one_flame: "Many Lamps, One Flame"
THR_many_lamps_one_flame_desc: "Bind the teaching route to proven missions: twelve successful teachings, with at least one success during major chaos."
THR_four_teaching_seats: "Four Teaching Seats"
THR_four_teaching_seats_desc: "Open a fourth public teaching seat so envoys, translators, refugee teachers, and foreign witnesses can work without drowning each other out."
THR_rewrite_civil_register: "Reform Civil Administration"
THR_rewrite_civil_register_desc: "Replace emergency lists with a state register of villages, households, vows, and duties. Core lands receive infrastructure and civil industry. Non-core administered lands receive compliance and lower resistance."
THR_mandala_bureau: "The Mandala Bureau"
THR_mandala_bureau_desc: "Build the administrative center that turns refuge work into state capacity."
THR_arhat_examinations: "Arhat Examinations"
THR_arhat_examinations_desc: "Select officials who claim detachment from fear, faction, and personal gain."
THR_arhats_take_office: "The Arhats Take Office"
THR_arhats_take_office_desc: "Create the Arhat Administration and let its ledgers govern the Realm."
THR_labs_snow_line: "Laboratories at the Snow Line"
THR_labs_snow_line_desc: "Tie high-altitude research to the doctrine of prevention. The snow-line laboratories add three research slots and a large nuclear research program."
THR_refuge_foundries: "Refuge Foundries"
THR_refuge_foundries_desc: "Arm the passes without admitting that the refuge has become a fortress. Every controlled state receives new military and civilian industry."
THR_vow_keeper_regiments: "Vow-Keeper Regiments"
THR_vow_keeper_regiments_desc: "Organize troops whose oaths bind them to protection before conquest. The focus creates an elite Vow-Keeper Mountaineer template, spawns six equipped mountain divisions, and adds major manpower, army experience, and doctrine discounts."
THR_quiet_envoys: "Quiet Envoys"
THR_quiet_envoys_desc: "Send letters and relief missions before the mandate becomes an ultimatum."
THR_buddha_mandate: "The Unshaken Seat"
THR_buddha_mandate_sanctuary_required_tt: "Requires control of the current capital. The Bodhisattva cannot take the Unshaken Seat while the 180-day warning from its fall remains."
THR_buddha_mandate_desc: "The Bodhisattva can become Buddha with §Y108§! Bodhi, §YFourth Dhyana§!, Defilements below §Y20§!, twelve successful teachings, and one teaching success during a major chaos crisis."
THR_the_awakened_one: "The Awakened One"
THR_the_awakened_one_desc: "Let the Realm arrange its offices around the Buddha who no longer fits the shape of a ruler."
THR_return_to_the_seat: "Return to the Seat"
THR_return_to_the_seat_desc: "Keep the fourth Dhyana alive after awakening, so practice continues to renew the Buddha's powers."
THR_show_the_powers: "Show the Powers"
THR_show_the_powers_desc: "Record the first awakened power shown against a true chaos country. The powers remain lesser than release. The world must understand what it has seen."
THR_powers_are_not_toys: "Powers Are Not Toys"
THR_powers_are_not_toys_desc: "Discipline the awakened powers so they remain instruments against chaos, not another language for ordinary war."
THR_one_becomes_many_focus: "One Becomes Many"
THR_one_becomes_many_focus_desc: "Turn simultaneous teaching presence into a planned anti-chaos doctrine, expanding relief and mission coordination after the power is shown."
THR_path_through_walls: "Path through Walls"
THR_path_through_walls_desc: "Prepare the Realm to cross walls, passes, rivers, and broken front lines only where chaos has made ordinary roads meaningless."
THR_lotus_bridge_focus: "Lotus Bridge"
THR_lotus_bridge_focus_desc: "Make impossible relief routes serve the Sangha Compact, threatened allies, and crisis corridors."
THR_read_pattern_suffering: "Read the Pattern of Suffering"
THR_read_pattern_suffering_desc: "Turn teaching reports, chaos-front records, and awakened sight into a discipline for finding the real source of suffering."
THR_vanishing_from_sight_focus: "Vanishing from Sight"
THR_vanishing_from_sight_focus_desc: "Train the Realm's relief columns and guardians to disappear from chaos ledgers without using the power against ordinary states."
THR_seated_in_sky_focus: "Seated in the Sky"
THR_seated_in_sky_focus_desc: "Prepare the emergency sky-seated display for capitals and sanctuaries threatened by chaos, never as an ordinary invasion tool."
THR_touch_sun_moon_focus: "Touch the Sun and Moon"
THR_touch_sun_moon_focus_desc: "Keep the strongest public sign for a world-collapse crisis or a proven awakened display against chaos."
THR_lamps_remain_lit: "The Lamps Remain Lit"
THR_lamps_remain_lit_desc: "Choose restraint during ordinary peace. A sharp rise in global chaos closes this hopeful path."
THR_white_flags_foreign_roads: "White Flags on Foreign Roads"
THR_white_flags_foreign_roads_desc: "Send peacekeepers and relief columns where state failure keeps the wheel turning."
THR_vow_against_annihilation: "Vow Against Annihilation"
THR_vow_against_annihilation_desc: "Bind the Mandate against world-ending doctrine."
THR_pacification_mandate: "Pacification Mandate"
THR_pacification_mandate_desc: "Treat force as the sharp instrument of mercy."
THR_release_through_administration: "Release Through Administration"
THR_release_through_administration_desc: "Pacify territory through registers, relief, and imposed order. The rite leaves no room for celebration."
THR_throne_without_body: "The Throne Without a Body"
THR_throne_without_body_desc: "Let doctrine govern beyond any single human hesitation."
THR_doctrine_last_war: "The Last Wheel"
THR_doctrine_last_war_desc: "Open the final ritual path only after Buddhahood and the first awakened power display. This does not authorize Final Silence by itself."
THR_witnesses_gather: "Witnesses Gather"
THR_witnesses_gather_desc: "Bring taught countries, compact members, or a world in obvious crisis into the final record before the last doctrine can proceed."
THR_reactors_prayer_wheels: "Reactors and Prayer Wheels"
THR_reactors_prayer_wheels_desc: "Bind nuclear and thermonuclear research to the final doctrine. The focus builds reactors and a nuclear facility, then grants major nuclear research bonuses. The arsenal must still be produced."
THR_all_roads_end_silence: "Seal the Remote Roads"
THR_all_roads_end_silence_desc: "Survey sacred roads, close remote sites, and let foreign observers guess at the purpose."
THR_no_one_leaves_mandala: "No One Leaves the Mandala"
THR_no_one_leaves_mandala_desc: "Close the moral circle around every road, border, and launch cell. The Realm expands its reactor network, receives nuclear research acceleration, and raises Final Silence Pressure."
THR_extinction_of_defilements_focus: "Extinction of Defilements"
THR_extinction_of_defilements_focus_desc: "Confirm that the inner rite has been completed with full Meditation Charge before the final authorization can be taken."
THR_final_silence: "The Last Authorization"
THR_final_silence_desc: "Authorize the sealed doctrine only if every strict final condition has been met."
THR_empty_seat: "The Empty Seat"
THR_empty_seat_desc: "Stabilize the non-terminal aftermath in which the Buddha has passed beyond worldly action and the Realm remains to guard the wheel."
THR_witnesses_keep_the_record: "Witnesses Guard the Memory"
THR_witnesses_keep_the_record_desc: "Ask taught countries, compact members, and Mandala offices to keep the non-terminal Final Silence in public memory."
THR_convene_mountain_assembly: "Convene Mountain Assembly"
THR_convene_mountain_assembly_desc: "Give the refuge a chamber before the chamber becomes a ministry. The assembly unlocks Dharma Teaching decisions, advances the Bodhisattva bhumi, grants major Political Power, and slightly reduces Chaos."
THR_seal_of_refuge: "The Seal of Refuge"
THR_seal_of_refuge_desc: "Turn shelter seals into state law. Protected communities provide manpower, stability, infrastructure, civil industry, Spiritual Legitimacy, Mandala Reach, and a small Chaos reduction."
THR_ministry_of_vows: "Ministry of Vows"
THR_ministry_of_vows_desc: "Centralize vows, registers, and duties under a single office."
THR_silent_offices: "Silent Offices"
THR_silent_offices_desc: "Build offices that process petitions without political theatre."
THR_village_without_petitions: "A Village without Petitions"
THR_village_without_petitions_desc: "Review the first district where silence may mean peace or fear."
THR_question_false_attainment_focus: "The Question of False Attainment"
THR_question_false_attainment_focus_desc: "Test whether Arhat office credentials still carry a burden."
THR_count_mountain_roads: "Pilgrimage Roads"
THR_count_mountain_roads_desc: "Record every road that can carry grain, pilgrims, troops, or refugees. Every controlled state receives major infrastructure and a listening post, and the Realm gains Political Power and Mandala Reach."
THR_monastic_labor_vows: "Monastery Workshops"
THR_monastic_labor_vows_desc: "Bind construction, repair, and relief work to monastic labor vows. Controlled states receive civilian workshops and infrastructure."
THR_mountain_granaries: "Mountain Granaries"
THR_mountain_granaries_desc: "Build high-valley granaries and a supply hub so refugee roads, winter shelters, and defensive detachments can endure pressure."
THR_snowline_clinics: "Snowline Clinics"
THR_snowline_clinics_desc: "Turn support stores and mountain clinics toward field relief, stability, and compassion, with no ordinary militarization."
THR_storehouses_for_world: "Storehouses for the World"
THR_storehouses_for_world_desc: "Build a supply depot inside the Realm and train the staff needed to move relief across the mountain roads."
THR_shelters_under_stone: "Fortress Without Hatred"
THR_shelters_under_stone_desc: "Prepare bunkers, anti-air, and winter shelters to protect lives under a defensive vow."
THR_quiet_mobilization: "Mountain Pass Detachments"
THR_quiet_mobilization_desc: "Raise reserve detachments for road watches, avalanche lines, and narrow passes without turning protection into parade mobilization."
THR_mountain_artillery_mandalas: "The Bell and Rifle"
THR_mountain_artillery_mandalas_desc: "Issue artillery and rifle discipline to the guardians who hold the passes, with doctrine written around refusal and defense."
THR_unbroken_pass: "The Unbroken Pass"
THR_unbroken_pass_desc: "Bind shelters, detachments, and guardian fire into a last-pass defense against chaos pressure."
THR_permit_foreign_pilgrimage: "Permit Foreign Pilgrimage"
THR_permit_foreign_pilgrimage_desc: "Let foreign witnesses enter the Realm under vow and register."
THR_letters_to_war_tired: "Letters to the War-Tired"
THR_letters_to_war_tired_desc: "Write to governments whose people have forgotten why the war continues."
THR_shelter_exiles: "Shelter the Exiles"
THR_shelter_exiles_desc: "Give foreign exiles a legal place beneath the seal. Exile communities provide manpower, civil construction in every controlled state, Political Power, Spiritual Legitimacy, and a small Chaos reduction."
THR_mandala_of_nations: "Mandala of Nations"
THR_mandala_of_nations_desc: "Offer a coalition of refusal, mediation, and witnessed peace. Members take a peace vow, cannot declare offensive wars, and pursue acts of kindness that lower global chaos."
THR_refusal_of_empires: "Refusal of Empires"
THR_refusal_of_empires_desc: "Reject imperial claims over suffering outside the mountains."
THR_no_victory_parades: "No Victory Parades"
THR_no_victory_parades_desc: "Pacification cannot be permitted to become conquest in ceremonial dress. The Realm gains political power and command authority while lowering Final Silence Pressure and chaos."
THR_last_border_is_wound: "The Last Border Is a Wound"
THR_last_border_is_wound_desc: "Treat every uncontrolled frontier as evidence that suffering remains unadministered. The Realm gains political power, war support, Final Silence Pressure, and coercive chaos."
THR_last_human_signature: "The Last Human Signature"
THR_last_human_signature_desc: "Remove the final personal countersignature from doctrine."
THR_sermon_without_translation: "A Sermon without Translation"
THR_sermon_without_translation_desc: "Issue doctrine that foreign ministries cannot render into normal state language."
THR_compassion_of_non_return: "Compassion of Non-Return"
THR_compassion_of_non_return_desc: "Define mercy as the prevention of every possible return."
THR_ministry_of_release: "Ministry of Silence"
THR_ministry_of_release_desc: "Give the final doctrine an office and force the authorization chamber to decide whether it can still be refused. The ministry expands nuclear facilities, prepares a limited thermonuclear payload set if the technology exists, and opens the authorization event."
THR_refuse_final_debate: "Refuse Final Debate"
THR_refuse_final_debate_desc: "Refuse to let apocalypse become a legitimate subject of policy."
THR_peace_without_ownership: "Peace without Ownership"
THR_peace_without_ownership_desc: "Keep peacekeeping separate from possession."
THR_world_still_burns: "The World Still Burns"
THR_world_still_burns_desc: "Continue aid and mediation without claiming the world can be solved."
THR_second_refuge: "The Second Refuge"
THR_second_refuge_desc: "Turn renunciation into a new shelter system for those fleeing the wider collapse."
THR_lamps_entered_register: "The Lamps Along the Road"
THR_lamps_entered_register_desc: "The lamps remain under a register. Clerks count, assign, and watch them because ordinary mercy no longer survives the wider world."
THR_seal_roads_from_panic: "Seal the Roads from Panic"
THR_seal_roads_from_panic_desc: "Keep the roads open only where the registers can protect them from panic, armies, and uncontrolled flight."
THR_no_more_peace_delegations: "No More Peace Delegations"
THR_no_more_peace_delegations_desc: "Foreign envoys may still arrive. The Realm no longer accepts ordinary pleas as policy."
THR_sort_worthy_broken: "Sort the Worthy from the Broken"
THR_sort_worthy_broken_desc: "The refugee lines continue as the Arhats separate useful labor, protected families, and cases the Realm says cannot be saved by open shelter alone."
THR_world_marked_as_wound_focus: "The World Is Marked as a Wound"
THR_world_marked_as_wound_focus_desc: "Foreign capitals enter the same register that once counted refugees. The focus raises Mandala Reach and Final Silence Pressure, updates world-threat state, and fires a late doctrine teaching event."
THR_complete_himalayan_mandala: "Secure the High Passes"
THR_complete_himalayan_mandala_desc: "Some courts beyond the passes did not enter the Mandala when invited. The Realm records the omission without anger. If the mountain circuit cannot be completed by vow, it can still be secured as a pilgrimage road."
THR_guardians_outer_passes: "Guardians of the Pilgrim Passes"
THR_guardians_outer_passes_desc: "Train the border guard to hold narrow roads, carry winter supply, and defend the shelter seal beyond the first valleys. Every controlled state receives forts and infrastructure, while the Realm gains Political Power, Command Power, army experience, and Mandala Reach."
THR_letters_beyond_passes: "Letters beyond the Passes"
THR_letters_beyond_passes_desc: "Open the pilgrimage route and send protection letters to nearby courts. If they refuse, the Arhats may seek a darker path through the pass."
THR_mandala_receives_borderlands: "Borderlands Petition the Mandala"
THR_mandala_receives_borderlands_desc: "Expand the letters to nearby borderlands and prepare staged protection for states that enter by vow, occupation, or Arhat administration."
THR_high_pass_states_enter_mandala: "High Pass Pilgrimage Oaths"
THR_high_pass_states_enter_mandala_desc: "Bring Tibet, Bhutan, Nepal, and Kham into one pilgrimage circuit when the Realm controls each of their mountain states."
THR_roads_must_be_quiet: "Safe Roads for Pilgrims"
THR_roads_must_be_quiet_desc: "Roads that carry grain, refugees, envoys, and patrols must stop carrying rumor. The focus unlocks border-control decisions, adds the Border Quiet idea, and grants Political Power, Command Power, Mandala Reach, and Compassion Drift."
THR_pacification_without_triumph: "Pacification without Triumph"
THR_pacification_without_triumph_desc: "If force is used, it must not become a parade. The focus unlocks pacification tools, adds the Pacification without Triumph idea, grants major Command Power and army experience, and raises Compassion Drift and Chaos."
THR_outer_valleys_register: "Outer Valley Courts"
THR_outer_valleys_register_desc: "Send Arhat registrars into held valleys to classify vows, petitions, stores, and risks before resistance grows into another war."
THR_mandala_borders: "Border Courts of Mercy"
THR_mandala_borders_desc: "The Mandala Bureau learns to pressure border courts through roads, relief, observation files, and carefully limited protection claims."
THR_peace_by_submission: "Protection by Petition"
THR_peace_by_submission_desc: "Make the letters more persuasive when the Realm is stronger. Entry without war can ease Chaos, but coercive authority strains the vow."
THR_northern_indian_register: "Northern Indian Frontier"
THR_northern_indian_register_desc: "Prepare claims and Arhat authority for the first northern Indian protection ledger. The ledger names the region before the Realm can claim to guard it."
THR_northern_indian_state_registers: "Northern Indian Petition Courts"
THR_northern_indian_state_registers_desc: "The northern Indian protection ledger becomes legal doctrine. The focus adds claims and a direct pressure path. State cores require expensive integration decisions after control is secured."
THR_eastern_mandala: "The Eastern Pilgrimage Mandala"
THR_eastern_mandala_desc: "Extend the Mandala toward western China. Greater influence abroad gives the Realm a path into Chinese affairs."
THR_western_chinese_registers: "Western Chinese Frontier"
THR_western_chinese_registers_desc: "Sichuan, Qinghai, Gansu, Yunnan, Ningxia, Suiyuan, Shaanbei, and Urumqi are entered into the Mandala as contested protection claims."
THR_eastern_chinese_registers: "Eastern China in Crisis"
THR_eastern_chinese_registers_desc: "Only extreme disorder draws the Realm into eastern China. War aims open against the region, but each state must still be taken and integrated."
THR_world_is_a_border: "The World Is Asked to Kneel"
THR_world_is_a_border_desc: "Only under extreme chaos does the Realm ask larger frontiers to submit. This is imperial Mandala logic. Final Silence is a separate nuclear doctrine."
THR_peace_chaos_focus_tt: "Requires Chaos Meter below §Y400§!. This path depends on a world where patient diplomacy still has room."
THR_mercy_chaos_focus_tt: "Requires Chaos Meter below §Y600§!. The mercy window is closing."
THR_mid_chaos_focus_tt: "Requires Chaos Meter above §Y400§!. The Realm justifies this measure once global chaos reaches a comparable level."
THR_chaos_tier_focus_tt: "Requires §RChaos Tier§! or worse. At this level the Realm starts turning toward the sealed final doctrine."
THR_high_chaos_focus_tt: "Requires Chaos Meter above §Y600§!. This belongs to the harsher route opened by a violent world."
THR_extreme_chaos_focus_tt: "Requires Chaos Meter above §Y800§!. The Realm must believe the world has passed beyond ordinary repair."
THR_final_ritual_ready_tt: "Requires Buddhahood, the armed Final Silence doctrine, an anti-chaos Buddha power display, the Extinction of Defilements rite, a controlled capital, and no active False Buddha Schism."
THR_final_silence_stockpile_required_tt: "Requires at least §Y80§! nuclear weapons produced by the Realm. The 1947 thermonuclear variant also requires thermonuclear doctrine or technology, at least §Y120§! nuclear weapons, and §Y24§! prepared thermonuclear payloads."
THR_final_signature_pressure_tt: "Requires §Y45§! Final Silence Pressure. This can be built before Chaos reaches §Y1000§! through focus rewards, BoP decisions, and late doctrine choices."
THR_final_sermon_pressure_tt: "Requires §Y55§! Final Silence Pressure. The final doctrine must be more than a rumor before this focus can be taken."
THR_final_non_return_pressure_tt: "Requires §Y65§! Final Silence Pressure. The doctrine must be close to irreversible before this focus can be taken."
THR_final_ministry_pressure_tt: "Requires §Y75§! Final Silence Pressure. The Ministry of Silence prepares the route. The launch condition remains separate."
THR_final_ministry_reach_tt: "Requires §Y60§! Mandala Reach. The Realm must have enough diplomatic, administrative, or expansionist reach to build a global final network."
THR_final_bop_leans_final_tt: "Requires the §RFinal Silence§! side to have influence in the Vow and Final Silence Balance of Power."
THR_final_bop_dominant_tt: "Requires §RFinal Silence§! to dominate the Vow and Final Silence Balance of Power."
THR_mandala_compact_candidate_required_tt: "Requires at least one valid non-chaos, non-puppet minor country with a crisis, teaching history, Mandala contact, or Pilgrim Assembly refuge need."
THR_vow_bop_required_tt: "Requires the doctrine balance to lean toward the §GVow against Annihilation§!. Vow influence must pull doctrine away from Final Silence first."
THR_arm_final_bop_required_tt: "Requires the doctrine balance to lean toward §RFinal Silence§!. Final Silence can be prepared before Chaos reaches §Y1000§!. The Realm must first choose that doctrine politically."
THR_vow_keeper_mandala_reach_required_tt: "Requires more than §Y18§! Mandala Reach. Large Vow-Keeper formations need a real administrative and territorial base."
THR_complete_himalayan_mandala_available_tt: "Bhutan, Nepal or Sikkim exists outside the Holy Realm and can legally be attacked."
THR_complete_himalayan_mandala_bypass_tt: "The high passes are already unified, integrated, subject-bound, absent, or not legal war targets."
THR_complete_himalayan_mandala_effect_tt: "Authorizes annexation war goals against eligible Bhutanese, Nepali and Sikkimese courts outside the Realm while Chaos stays above [?constant:holy_realm_chaos.coercive_floor|.0]."
THR_high_pass_states_enter_mandala_effect_tt: "Unlocks high-pass integration decisions and directly integrates owned Sikkim if it is already under Realm control. The remaining Himalayan cores come from expensive state decisions."
THR_no_victory_parades_effect_tt: "Adds §Y250§! Political Power, §Y75§! Command Power, stability, lowers Final Silence Pressure, and reduces Chaos slightly."
THR_last_border_is_wound_effect_tt: "Adds §Y300§! Political Power, war support, Final Silence Pressure, and coercive Chaos."
THR_northern_indian_register_effect_tt: "Opens claims, protection letters, and integration decisions against nearby northern Indian states."
THR_northern_indian_state_registers_effect_tt: "Adds claims in northern India. Each state can be fully integrated through a decision after control is secured."
THR_eastern_mandala_effect_tt: "Extends Mandala influence toward western China and strengthens the Realm's position in neighboring courts."
THR_western_chinese_registers_effect_tt: "Adds claims and pressure against western Chinese states. Full integration requires control and a separate decision."
THR_eastern_chinese_registers_effect_tt: "Adds claims and war aims in eastern China during extreme chaos. The states must still be taken and integrated."
THR_reactors_prayer_wheels_effect_tt: "Builds nuclear reactors in controlled states, adds a nuclear facility in the capital, and grants a strong nuclear research bonus. The arsenal must still be produced."
THR_no_one_leaves_mandala_effect_tt: "Expands the reactor network, adds nuclear research acceleration, and raises Final Silence Pressure."
THR_ministry_of_release_effect_tt: "Adds the Final Silence Network idea, expands nuclear facilities, prepares §Y24§! thermonuclear payloads if the technology exists, and opens the authorization chamber event."
THR_mandala_bureau_agency_tt: "Creates or expands the Mandala Bureau intelligence agency with cryptology, passive defense, invisible ink, diplomatic training, and radio operations upgrades."
THR_last_human_signature_effect_tt: "Unlocks target-list audit decisions, raises Final Silence Pressure, and moves the doctrine balance toward Final Silence."
THR_sermon_without_translation_effect_tt: "Unlocks once-per-target final notice actions, raises war support, and moves the doctrine balance toward Final Silence."
THR_compassion_of_non_return_effect_tt: "Unlocks internal shelter preparation decisions for Realm states, steadies the country, and marks controlled states for protection work."
THR_sit_beneath_prayer_flags_effect_tt: "Adds Bodhi Progress, Meditation Charge, and Detachment, and marks the meditation focus path as active."
THR_first_quiet_ready_tt: "Requires Dhyana Depth to have reached at least §Y1§! through the concentration vow sequence."
THR_second_quiet_ready_tt: "Requires Dhyana Depth to have reached at least §Y2§! through the concentration vow sequence."
THR_third_quiet_ready_tt: "Requires Dhyana Depth to have reached at least §Y3§! through the concentration vow sequence."
THR_fourth_quiet_ready_tt: "Requires Dhyana Depth to have reached §Y4§! through the concentration vow sequence."
THR_quiet_focus_effect_tt: "Adds Meditation Charge and Detachment, and lowers Defilements."
THR_fourth_quiet_effect_tt: "Adds a larger Meditation Charge gain, Detachment, and Defilement reduction."
THR_council_of_abbots_effect_tt: "Chooses the abbot governance route, strengthens Spiritual Legitimacy, and improves Compassion."
THR_name_protector_regent_effect_tt: "Names a Protector Regent, adding War Support and Command Power while coercive guardianship raises Defilements."
THR_seat_pilgrim_assembly_effect_tt: "Chooses the pilgrim-assembly governance route, expands Mandala Reach, and improves Compassion."
THR_abbot_examiners_effect_tt: "Lets Council governance open a fourth active teaching seat before the wider teaching network, adds Political Power, Bodhi Progress, and Compassion."
THR_regent_pass_watch_effect_tt: "Fortifies the capital passes with a land fort and anti-air, adds Command Power and support equipment, and slightly raises Defilements."
THR_pilgrim_refuge_courts_effect_tt: "Lets Pilgrim Assembly governance widen low-stability humanitarian compact eligibility, adds refugee manpower, Mandala Reach, and Sangha Cohesion."
THR_send_first_envoys_effect_tt: "Unlocks Dharma Teaching decisions, adds Bodhi Progress, and eases Compassion Drift."
THR_translation_houses_effect_tt: "Adds Mandala Reach, Bodhi Progress, and one civilian factory in the capital state."
THR_teach_under_bombardment_ready_tt: "Requires Chaos Tier pressure, world-end pressure, or a current war against a special chaos country."
THR_teach_under_bombardment_effect_tt: "Teaches the Dharma during a crisis, adding Bodhi Progress and easing Compassion Drift while lowering Defilements."
THR_many_lamps_teaching_ready_tt: "Requires §Y12§! successful teaching missions and at least §Y1§! teaching success during major chaos."
THR_many_lamps_one_flame_effect_tt: "Successful lessons add Bodhi Progress and ease Compassion Drift while lowering Defilements, bringing the Bodhisattva closer to the Unshaken Seat."
THR_four_teaching_seats_effect_tt: "Expands active teaching mission capacity from §Y3§! to §Y4§! and reveals late foreign teaching tools. Buddhahood or One Becomes Many raises capacity to §Y5§!."
THR_the_awakened_one_effect_tt: "Adds Meditation Charge and Detachment after Buddhahood has been realized."
THR_return_to_the_seat_effect_tt: "Unlocks §YRenew the Vow Under Fire§!, adds Meditation Charge and Detachment, and reduces Defilements."
THR_show_the_powers_ready_tt: "Requires at least one Buddha power to have been shown against a true chaos country."
THR_show_the_powers_effect_tt: "Restores Meditation Charge and lowers Chaos after an anti-chaos Buddha power has been revealed."
THR_powers_are_not_toys_ready_tt: "Requires enough Detachment to discipline the awakened powers."
THR_powers_are_not_toys_effect_tt: "Sets the disciplined-power doctrine. Buddha powers remain restricted to true chaos countries, and their use is tracked through distinct Meditation Charge costs and cooldowns."
THR_one_becomes_many_focus_effect_tt: "Improves the One Becomes Many route with Compassion and Meditation Charge for active teaching coordination."
THR_path_through_walls_effect_tt: "Prepares awakened movement against chaos fronts and adds Meditation Charge."
THR_lotus_bridge_focus_effect_tt: "Strengthens Lotus Bridge relief logic through Sangha Cohesion and Meditation Charge."
THR_read_pattern_suffering_effect_tt: "Turns the Pattern of Suffering into an active teaching route, adding Detachment and Meditation Charge when the Realm has enough proof."
THR_vanishing_from_sight_focus_effect_tt: "Uses awakened rescue work against chaos fronts, adding Detachment and Meditation Charge."
THR_seated_in_sky_focus_effect_tt: "Uses the Seated in the Sky power for disciplined emergency response, adding Command Power and Meditation Charge while lowering Defilements."
THR_touch_sun_moon_focus_effect_tt: "The Buddha reaches for the Sun and Moon during World Collapse, restoring Meditation Charge and lowering Defilements."
THR_debate_the_pretender_focus_effect_tt: "Resolves the Schism through public teaching. Defilements fall and Compassion Drift eases."
THR_exile_the_echo_effect_tt: "Drives the pretender network beyond the passes. The immediate Schism ends. The echo remains abroad, and the clean route is stained."
THR_break_false_mandala_effect_tt: "Breaks the Schism by force. Defilements, Compassion Drift, and Chaos rise."
THR_false_buddha_response_unresolved_tt: "Choose one response to the False Buddha."
THR_absorb_the_shadow_ready_tt: "Requires Total Chaos or worse. Absorbing the shadow is a high-chaos shortcut, not a clean awakening."
THR_absorb_the_shadow_effect_tt: "Absorbs the Schism into the Realm's own doctrine. Meditation Charge and Final Silence Pressure rise, Defilements deepen, and the corrupted doctrine takes root."
THR_doctrine_last_war_effect_tt: "Opens the Last Wheel route and commits the Realm to Final Silence preparation. Final Silence still requires witnesses, the Extinction rite, an armed doctrine, doctrine dominance, and final authorization."
THR_witnesses_gather_ready_tt: "Requires the Mandala of Nations, a completed teaching network, or Total Chaos pressure."
THR_witnesses_gather_effect_tt: "Gathers the witnesses for the final doctrine, raising Final Silence Pressure and Sangha Cohesion."
THR_extinction_focus_ready_tt: "Requires the Extinction of Defilements Buddha-power rite to be completed first."
THR_extinction_of_defilements_focus_effect_tt: "The completed Extinction rite raises Final Silence Pressure and lowers Defilements."
THR_empty_seat_effect_tt: "Stabilizes the non-terminal Empty Seat aftermath through Sangha Cohesion and Chaos reduction."
THR_witnesses_keep_the_record_effect_tt: "Countries taught or aided by the Realm and its compact members become witnesses of the Empty Seat. They gain opinion and stability. Compact members also gain war support, and the Sangha grows closer if at least three answer."
THR_convene_mountain_assembly_effect_tt: "Unlocks Dharma Teaching decisions, advances the Bodhisattva bhumi, adds §Y300§! Political Power, §Y50§! Command Power, Spiritual Legitimacy, and a small Chaos reduction."
THR_seal_of_refuge_effect_tt: "Codifies refuge law, marks controlled states as protected, adds manpower, stability, infrastructure, civil industry, Spiritual Legitimacy, Mandala Reach, and a small Chaos reduction."
THR_rewrite_civil_register_effect_tt: "Arhat administration improves compliance and lowers resistance in controlled non-core states. Controlled core states gain infrastructure and civil industry."
THR_vow_keeper_regiments_effect_tt: "Creates an elite Vow-Keeper Mountaineer template, equips it, spawns §Y6§! strong mountain divisions in the capital state, and unlocks pilgrimage route escort missions."
THR_storehouses_for_world_effect_tt: "Builds a supply hub in a controlled Realm state, adds [?constant:holy_realm_focus_reward.sanctuary_storehouse_command_power|.0] Command Power and increases Mandala Reach. If the Mandala of Nations exists, Sangha Cohesion also rises."
THR_unbroken_pass_effect_tt: "Adds the Last-Pass Mobilization idea, Command Power, Spiritual Legitimacy, and a small Chaos reduction."
THR_world_marked_as_wound_effect_tt: "The Realm's doctrine raises Mandala Reach and Final Silence Pressure. It also increases Chaos and calls the Bodhisattva to teach about the suffering of foreign lands."
holy_realm_teaching_slot_available_tt: "An active teaching seat is open."
THR_conquest_mandala_reach_required_tt: "Requires Mandala diplomacy, quiet-envoy memory, or enough Mandala Reach to pressure border courts."
THR_conquest_high_doctrine_required_tt: "Requires the Buddha Mandate, Divine Sovereignty, or coercive pacification doctrine."
THR_labs_snow_line_bonus: "Laboratories at the Snow Line"
THR_vow_keeper_regiments_bonus: "Vow-Keeper Regiments"
THR_final_silence_bonus: "Doctrine of the Last War"

chaosx_super_event.7.t: "The Awakened One"
chaosx_super_event.7.q: "he stands, dispelling the hosts of Mara, like the sun that illuminates the sky. \n §Y-Vinaya Texts, Mahavagga I.1.7-§!"
chaosx_super_event.7.a: "The wheel turns."
chaosx_super_event.7.d: "At the Unshaken Seat, the Bodhisattva has awakened. The monks proclaim that craving has been extinguished and the Dharma seen directly. Pilgrims bow along the mountain roads as the temple bells announce the Buddha.\n\nThe Holy Realm now follows him as its teacher and ruler. His first teaching calls every subject to discipline the mind, practice compassion, and abandon the causes of suffering."
chaosx_super_event.8.t: "The Final Silence"
chaosx_super_event.8.q: "Where is it that both name and form die out, leaving no trace behind? \n §Y-Kevaddha Sutta, DN 11-§!"
chaosx_super_event.8.a: "The seat is empty."
chaosx_super_event.8.d: "The Buddha has entered final Nirvana and left the seat empty. His last instruction releases the armies from war and closes the rites that summoned his powers.\n\nMonasteries ring the passing bell as soldiers lay down their weapons. The Holy Realm remains under the Empty Seat, guarded by disciples who preserve the teachings and refuse to name another Buddha."
chaosx_super_event.9.t: "The Final Silence"
chaosx_super_event.9.q: "As the extinction of a flame, even so was his mind's release. \n §Y-The Death of Buddha-§!"
chaosx_super_event.9.a: "Nothing answered."
chaosx_super_event.9.d: "Final Silence has called Fallout as the last order leaves the mountains. The Empty Seat remains above the passes while the world faces its final calamity.\n\nThe Mandala's vow passes beyond the old borders with the last teaching."
chaosx_super_event.9.manual.d: "The Final Silence has passed its last threshold. Commands, radio traffic, and the rhythm of battle fall away at once, not as surrender and not as victory, but as if the machinery of conflict has forgotten what it was built to repeat.\n\nNo second sun receives a speech. No proclamation claims triumph. The world hears the end of orders."
chaosx_super_event.10.t: "The Mandala Breaks"
chaosx_super_event.10.q: "Victory breeds hatred, for the conquered is unhappy. \n §Y-Dhammapada 201-§!"
chaosx_super_event.10.a: "The circle fails to close."
chaosx_super_event.10.d: "The rite of Final Silence has been broken. Foreign attacks, rebellion, and failed launch control have shattered the Holy Realm's command network before the passage could be completed.\n\nMonasteries close their gates, frightened disciples scatter, and surviving custodians guard the unfinished doctrine. The Realm must restore discipline and confront the suffering caused by its failed rite."
chaosx_super_event.11.t: "Divine Sovereignty"
chaosx_super_event.11.q: "A man is not just if he carries a matter by violence. \n §Y-Dhammapada 256-§!"
chaosx_super_event.11.a: "Office and altar share a seal."
chaosx_super_event.11.d: "The ruler has joined the Wheel of Dharma to the seal of state and declared his command sacred law. Monasteries administer public oaths, officials enforce religious discipline, and every ministry answers to his personal mandate.\n\nThe Holy Realm now teaches that obedience to the sovereign preserves right order. Law, ritual, and government proceed from the same throne."
chaosx_super_event.61.t: "Powers of the Awakened"
chaosx_super_event.61.q: "Get rid of this disposition, train yourself, and remain in that. \n §Y-Kevaddha Sutta, DN 11-§!"
chaosx_super_event.61.a: "The armies stopped speaking."
chaosx_super_event.61.d: "Through disciplined concentration, the Buddha has displayed the higher powers before the armies of chaos. He crosses guarded ground without obstruction and appears beyond lines that no traveler could pass. Soldiers abandon positions they can no longer defend against him.\n\nThe monks teach that these powers arise from meditation and remain inferior to liberation. They are used to restrain cruelty, protect living beings, and clear a path for the Dharma."
chaosx_super_event.51.t: "Mandala of Nations"
chaosx_super_event.51.q: "Hatred is never appeased by hatred in this world. \n §Y-Dhammapada 5-§!"
chaosx_super_event.51.a: "The white flags answer each other."
chaosx_super_event.51.d: "The Holy Realm has gathered its allies into the Mandala of Nations. Each member vows to shelter refugees, submit disputes to witnessed mediation, and defend communities threatened by chaos.\n\nThe compact applies Buddhist compassion through shared roads, granaries, hospitals, and protected white flags. Its members seek peace through restraint, mutual aid, and patient settlement of conflict."

holy_realm_bodhisattva_category: "Bodhisattva Missions"
holy_realm_bodhisattva_category_desc: "The Bodhisattva travels, teaches, visits foreign courts, and quietly spreads the Holy Realm's influence. Stronger missions require Spiritual Legitimacy and Mandala Reach."
holy_realm_buddha_powers_category: "Powers of the Awakened"
holy_realm_buddha_powers_category_desc: "Buddha powers spend Meditation Charge. Most are directed at true chaos enemies: outbreak realms, weaponized zombie countries, revolutionary chaos states, alien or nonhuman chaos polities, and countries explicitly flagged as chaos threats. Lotus Bridge opens a protected relief route to a compact member or recently aided friendly country."
holy_realm_false_buddha_category: "False Buddha Schism"
holy_realm_false_buddha_category_desc: "The Mandala has split around a pretender claim. Debate can return the schism to teaching. Suppression can end the challenge and stain the route."
holy_realm_last_pass_mobilization: "Last-Pass Mobilization"
holy_realm_last_pass_mobilization_desc: "The Realm formed under immediate threat. Refuge officers, monks, and mountaineer cadres are committed to holding the last roads long enough for the new order to survive."
holy_realm_one_mandala_state: "One Mandala State"
holy_realm_one_mandala_state_desc: "The refuge, Bodhisattva, Arhats, and Buddha Mandate now share one public identity. Every road, court, and shelter belongs to the same vow."
holy_realm_mandala_protectorate: "Mandala Protectorate"
holy_realm_mandala_protectorate_DEF: "the Mandala Protectorate"
holy_realm_mandala_protectorate_ADJ: "Mandala"

THR_bodhisattva_refuge_circuit: "Walk the Refuge Circuit"
THR_bodhisattva_refuge_circuit_desc: "Send the Bodhisattva through refugee roads and high-valley shelters. Requires Spiritual Legitimacy, advances the bhumi, lowers Final Silence Pressure, and strengthens the public vow."
THR_bodhisattva_visit_neighboring_country: "Visit a Neighboring Court"
THR_bodhisattva_visit_neighboring_country_desc: "Send the Bodhisattva to a neighboring or unstable country. The visit can improve relations and extend Mandala Reach."
THR_bodhisattva_visit_distant_unstable_country: "Visit a Distant Unstable Country"
THR_bodhisattva_visit_distant_unstable_country_desc: "A costly long-distance mission. Requires higher Spiritual Legitimacy and Mandala Reach, and targets weak or unstable foreign states."
THR_bodhisattva_visit_collapsing_capital: "Visit a War-Torn Capital"
THR_bodhisattva_visit_collapsing_capital_desc: "Send the Bodhisattva to a capital close to collapse or deep wartime instability. The visit costs more Political Power and can greatly extend Mandala Reach."
THR_bodhisattva_hold_teachings_for_refugees: "Hold Teachings for Refugees"
THR_bodhisattva_hold_teachings_for_refugees_desc: "Spend Political Power on a domestic teaching circuit. Advances the bhumi, raises Spiritual Legitimacy, and lowers Compassion Drift."
THR_bodhisattva_teach_foreign_officers: "Teach Foreign Officers"
THR_bodhisattva_teach_foreign_officers_desc: "Turn visiting officers into disciplined witnesses. Requires Mandala Reach, advances the bhumi, and gives limited military experience."
THR_bodhisattva_send_letters_after_visit: "Send Letters After a Visit"
THR_bodhisattva_send_letters_after_visit_desc: "Follow up after a foreign visit. The target must already have received the Bodhisattva."
THR_bodhisattva_establish_mandala_mission: "Establish a Mandala Mission"
THR_bodhisattva_establish_mandala_mission_desc: "Create a small spiritual mission in a previously visited unstable country. It improves influence and can help later conversion."
THR_bodhisattva_invite_foreign_pilgrims: "Invite Foreign Pilgrims"
THR_bodhisattva_invite_foreign_pilgrims_desc: "Spend Political Power to bring pilgrims into the Realm, raising Spiritual Legitimacy and Mandala Reach."
THR_bodhisattva_guard_pilgrimage_route: "Guard the Pilgrimage Route"
THR_bodhisattva_guard_pilgrimage_route_desc: "Keep two divisions in a controlled pass or protected road throughout the §Y60-day§! escort. Losing the units or state cancels the order and refunds Political Power, Command Power, and Support Equipment; Defilements rise and Sangha Cohesion falls."
THR_bodhisattva_guard_pilgrimage_route_divisions_tt: "At least §Y2§! divisions must be present in the selected state."
THR_bodhisattva_guard_pilgrimage_route_busy_tt: "Only one pilgrimage escort can be active at a time."
THR_bodhisattva_guard_pilgrimage_route_cost_tt: "Requires at least §Y20§! Command Power and §Y120§! Support Equipment."
THR_bodhisattva_guard_pilgrimage_route_success_tt: "The escorted route holds. The state gains infrastructure and is marked as guarded. The Realm gains Bodhi, Sangha Cohesion, Mandala Reach, and Army Experience, and Compassion Drift eases."
THR_bodhisattva_guard_pilgrimage_route_failure_tt: "The route is not secure when the escort ends. Defilements rise and Sangha Cohesion falls."
THR_bodhisattva_support_sympathetic_government: "Support a Sympathetic Government"
THR_bodhisattva_support_sympathetic_government_desc: "A rare conversion attempt. Requires high Spiritual Legitimacy, high Mandala Reach, a weak visited target, and no major-power protection."
THR_begin_concentration_sequence: "Begin the Concentration Vow"
THR_begin_concentration_sequence_desc: "Begin the formal concentration sequence for deep meditation. Complete the four timed beats, Intention, Energy, Mind, and Investigation, before the vow expires to gain Meditation Charge, Bodhi, Detachment, and progress toward the next Dhyana."
THR_hold_intention: "Hold Intention"
THR_hold_intention_desc: "Hold the first beat of concentration. This takes time, draws political attention, advances the sequence, and builds Meditation Charge."
THR_hold_energy: "Hold Energy"
THR_hold_energy_desc: "Hold the second beat of concentration. This takes time, draws political attention, advances the sequence, and builds Meditation Charge."
THR_hold_mind: "Hold Mind"
THR_hold_mind_desc: "Hold the third beat of concentration. This takes time, draws political attention, advances the sequence, and builds Meditation Charge."
THR_hold_investigation: "Hold Investigation"
THR_hold_investigation_desc: "Complete the fourth timed beat of concentration. The sequence grants Bodhi, Detachment, Meditation Charge, and, if enough charge has gathered, the next Dhyana."
THR_renew_vow_under_fire: "Renew the Vow Under Fire"
THR_renew_vow_under_fire_desc: "When a true chaos threat reaches the Realm, its neighbors, or the compact, spend §Y35§! Command Power and §Y150§! Support Equipment to protect the Awakened One's return to stillness."
THR_renew_vow_under_fire_effect_tt: "Slightly lowers Stability, adds Meditation Charge and Detachment, reduces Defilements, and prepares Wrathful Protection."
THR_renew_vow_under_fire_cost_required_tt: "Requires at least §Y35§! Command Power and §Y150§! Support Equipment. This vow also costs §Y1%§! Stability."
THR_realize_buddhahood_beneath_seat: "Realize Buddhahood Beneath the Seat"
THR_realize_buddhahood_beneath_seat_desc: "The Unshaken Seat has been prepared and all required teaching and meditation conditions are met. The Bodhisattva realizes Buddhahood, changes the Realm's stage, and reveals the super-event."
THR_debate_false_buddha_pretender: "Debate the Pretender"
THR_debate_false_buddha_pretender_desc: "Convene the monasteries and let the pretender answer the teachings. Requires spiritual authority and detachment. Lowers Defilements, restores compassion, and resolves the schism through teaching."
THR_suppress_false_buddha_pretender: "Suppress the Pretender"
THR_suppress_false_buddha_pretender_desc: "Send officials and guards to end the schism by force. Defilements rise, and the Bodhisattva's path is stained by suppression."
THR_answer_false_buddha_echo_abroad: "Answer the Echo Abroad"
THR_answer_false_buddha_echo_abroad_desc: "Send witnesses and doctrine records to a foreign host where the exiled echo has found an audience. The host may contain the counterfeit circle or shelter it."
THR_debate_the_pretender_focus: "Debate the Pretender"
THR_debate_the_pretender_focus_desc: "The pretender is brought before abbots, refugees, soldiers, and witnesses. The Realm answers the counterfeit mandala through teaching."
THR_exile_the_echo: "Exile the Echo"
THR_exile_the_echo_desc: "The false circle can be broken without blood by pushing its teachers beyond the passes. The danger leaves the capital and remains abroad."
THR_break_false_mandala: "Break the False Mandala"
THR_break_false_mandala_desc: "Officials, guards, and loyal monasteries tear down the rival seal. The route is fast, visible, and stained."
THR_absorb_the_shadow: "Absorb the Shadow"
THR_absorb_the_shadow_desc: "Under extreme chaos, the Realm can fold the false claim into its own doctrine. The power is real, and so is the corruption."
THR_buddha_power_resource_gate_tt: "Requires a Buddha Mandate, sufficient Meditation Charge, and a power whose cooldown has ended."
THR_buddha_power_one_becomes_many_gate_tt: "Requires sufficient Meditation Charge. The power must be inactive and its cooldown complete."
THR_buddha_power_extinction_gate_tt: "Requires a sovereign Buddha, Dhyana Depth 4, Defilements below 20, full Meditation Charge, and a prior power shown against a chaos enemy. No false schism can remain."
THR_buddha_power_one_becomes_many: "Power: One Becomes Many"
THR_buddha_power_one_becomes_many_desc: "Spend §Y35§! Meditation Charge to project the Buddha's presence against a true chaos enemy. The target loses stability and war support."
THR_buddha_power_passing_through_walls: "Power: Passing Through Walls"
THR_buddha_power_passing_through_walls_desc: "Spend §Y45§! Meditation Charge against a true chaos enemy. Its forces lose organization and recover more slowly."
THR_buddha_power_walking_on_water: "Power: Walking on Water"
THR_buddha_power_walking_on_water_desc: "Spend §Y40§! Meditation Charge against a true chaos enemy. Its supply falters as the Realm's envoys cross rivers without roads."
THR_buddha_power_lotus_bridge: "Power: Lotus Bridge"
THR_buddha_power_lotus_bridge_desc: "Spend §Y40§! Meditation Charge to open a relief route across impossible water to a Mandala member or recently aided friend. Keep its capital for §Y180 days§! to preserve the crossing."
THR_buddha_power_vanishing_from_sight: "Power: Vanishing from Sight"
THR_buddha_power_vanishing_from_sight_desc: "Spend §Y35§! Meditation Charge against a true chaos enemy. Its officers lose track of the Realm's presence."
THR_buddha_power_seated_in_sky: "Power: Seated in the Sky"
THR_buddha_power_seated_in_sky_desc: "Spend §Y60§! Meditation Charge against a true chaos enemy. Its air strength, war support, and recovery falter beneath the seated figure."
THR_buddha_power_touching_sun_moon: "Power: Touching the Sun and Moon"
THR_buddha_power_touching_sun_moon_desc: "Spend §Y80§! Meditation Charge against a true chaos enemy. Its industry and public confidence falter beneath a sign no ministry can explain."
THR_buddha_power_extinction_defilements: "Power: Extinction of Defilements"
THR_buddha_power_extinction_defilements_desc: "Spend §Y100§! Meditation Charge to complete the inner rite required for Final Silence. Requires Dhyana Depth 4, low Defilements, Buddhahood, and a prior Buddha power shown against a true chaos enemy."
holy_realm_power_walls_unsealed: "Walls Unsealed"
holy_realm_power_walls_unsealed_desc: "The country's boundaries of command and shelter have failed under a Buddha power."
holy_realm_power_waters_crossed: "Waters Crossed"
holy_realm_power_waters_crossed_desc: "The country's supply officers report crossings and interruptions where no ordinary route should exist."
holy_realm_power_vanished_sight: "Vanished from Sight"
holy_realm_power_vanished_sight_desc: "The country's ministries cannot keep the Realm's presence fixed in reports or maps."
holy_realm_power_sky_seated: "Seated in the Sky"
holy_realm_power_sky_seated_desc: "The country's soldiers and pilots carry the sight of an impossible seated figure above the front."
holy_realm_power_sun_moon_touched: "Sun and Moon Touched"
holy_realm_power_sun_moon_touched_desc: "The country's factories and offices slow under a celestial sign associated with the awakened Realm."
holy_realm_power_defilements_extinguished: "Defilements Extinguished"
holy_realm_power_defilements_extinguished_desc: "The country's chaos doctrine has been struck at its motive force, leaving officials unable to explain why zeal has become fear."
THR_send_regional_peace_letter: "Send Regional Letter of Peace"
THR_send_regional_peace_letter_desc: "Send a peace offer to a regional government beyond the Realm's immediate neighbors. Acceptance can bring peaceful submission, protectorate status, or later integration."
THR_integrate_mandala_protectorate_state: "Integrate a Protectorate State"
THR_integrate_mandala_protectorate_state_desc: "Spend Political Power to draw one eligible state from a Mandala protectorate into direct Realm administration. Non-eligible land remains under the protectorate."

chaosx.nr3.120.t: "The Bodhisattva at the Border Court"
chaosx.nr3.120.d: "The visitor arrived without a treaty draft. The court expected demands and heard teachings on refuge, restraint, and the cost of refusing roads to the desperate."
chaosx.nr3.120.a: "Receive the visitor."
chaosx_nr3_120_a_tt: "Receives the visitor. Stability rises slightly and the country thinks better of the Realm. The Realm gains Spiritual Legitimacy."
chaosx.nr3.121.t: "A Distant Teaching Mission"
chaosx.nr3.121.d: "Foreign officials argued over the meaning of the Bodhisattva's arrival. The crowd outside had already learned the name of the Realm before the argument ended."
chaosx.nr3.121.a: "Let the mission speak."
chaosx.nr3.121.b: "Turn the mission away."
chaosx_nr3_121_a_tt: "Lets the mission speak. Stability rises and War Support falls slightly, and the country thinks better of the Realm. The Realm gains Mandala Reach."
chaosx_nr3_121_b_tt: "Turns the mission away. The country thinks worse of the Realm, and the Realm loses Spiritual Legitimacy."
chaosx.nr3.122.t: "The Bodhisattva Enters the War-Torn Capital"
chaosx.nr3.122.d: "The capital's shelters opened before the ministries did. The Bodhisattva spoke to officers, widows, and clerks in the same hall, as if rank had become another form of injury."
chaosx.nr3.122.a: "Record the visit."
chaosx_nr3_122_a_tt: "Thanks the Bodhisattva. Stability and War Support rise. The Realm gains Spiritual Legitimacy and Mandala Reach."
chaosx.nr3.123.t: "Letters After the Visit"
chaosx.nr3.123.d: "The letters did not demand submission. They listed names, shelters, debts, and roads left open after the Bodhisattva departed."
chaosx.nr3.123.a: "File the letters."
chaosx_nr3_123_a_tt: "Delivers the letters. The country thinks better of the Realm, and the Realm gains Spiritual Legitimacy."
chaosx.nr3.124.t: "A Government Looks to the Mandala"
chaosx.nr3.124.d: "The state is weak, isolated, and recently visited. Ministers now weigh protectorate vows against another month of collapse."
chaosx.nr3.124.a: "Enter the Mandala."
chaosx.nr3.124.b: "Remain outside."
chaosx_nr3_124_a_tt: "The country becomes a Mandala protectorate or peacefully submits eligible territory."
chaosx_nr3_124_b_tt: "The target refuses conversion. The Holy Realm gains Mandala Reach and Compassion Drift."
chaosx.nr3.125.t: "Letters Carried Past the Guns"
chaosx.nr3.125.d: "Mandala envoys ask this government to name one active enemy and accept arbitration. The white flag offers both sides a hearing, but neither a victory nor protection from the war."
chaosx.nr3.125.a: "Hear the other side."
chaosx.nr3.125.b: "Return the letter unopened."
chaosx_nr3_125_a_tt: "The other belligerent receives a matching arbitration offer. Peace only follows if both sides accept."
chaosx_nr3_125_b_tt: "Refuses Mandala arbitration. The Realm's influence abroad grows as the offer is rejected."
chaosx.nr3.126.t: "The Second Letter Arrives"
chaosx.nr3.126.d: "The enemy has allowed Mandala witnesses to carry a second letter across the line. This offer is narrower than surrender and weaker than victory: a white peace under the eyes of a foreign institution that will remember who accepted it."
chaosx.nr3.126.a: "Sign under the white flag."
chaosx.nr3.126.b: "Keep the front open."
chaosx_nr3_126_a_tt: "If the first side is still at war with this country, both sides sign a white peace."
chaosx_nr3_126_b_tt: "Refuses Mandala arbitration. The Realm's influence abroad grows as the offer is rejected."
chaosx.nr3.127.t: "The White Flags Hold"
chaosx.nr3.127.d: "The Mandala letters brought two exhausted governments to the same table, and the war ended at last. Mountain envoys leave with proof that peace can outlast the fighting."
chaosx.nr3.127.a: "Enter the signatures."
chaosx_nr3_127_a_tt: "Ends the war through Mandala arbitration, raises Mandala Reach and Spiritual Legitimacy, and lowers Chaos."
chaosx.nr3.128.t: "The Compact Refuses the File"
chaosx.nr3.128.d: "The Mandala of Nations is offered to governments willing to respect each other's sovereignty, share refuge law, and stand together against chaos. Foreign obligations and the wars members wage will test whether the compact can endure."
chaosx.nr3.128.a: "The vow does not accept us."
chaosx_nr3_128_a_tt: "This country leaves the Mandala of Nations because it does not meet compact membership rules."
chaosx.nr3.129.t: "A Name Is Turned Away"
chaosx.nr3.129.d: "[holy_realm_compact_rejected_country.GetName] sought entry into the Mandala of Nations without the support needed to protect its members. The Realm turned away the request, and Sangha Cohesion weakened."
chaosx.nr3.129.a: "Keep the ledger narrow."
chaosx_nr3_129_a_tt: "The invalid entrant is removed from the Mandala of Nations, and Sangha Cohesion falls."
chaosx.nr3.130.t: "A White Flag Leaves the Ledger"
chaosx.nr3.130.d: "[holy_realm_compact_departing_country.GetName] no longer stands inside the Mandala of Nations. The Peace Vow is cleared, the faction record is refreshed, and the compact counts only the witnesses still bound to refuge law."
chaosx.nr3.130.a: "Refresh the witness list."
chaosx_nr3_130_a_tt: "The remaining members keep the Mandala of Nations together after a departure."
chaosx.nr3.131.t: "The Echo at the Foreign Gate"
chaosx.nr3.131.d: "The exiled teachers have arrived as translators, witnesses, orphan committees, and men who insist that the Holy Realm sent away its own reflection because it feared the answer.\n\nThe embassy sees a theological dispute entangled with refugees and foreign operations. The next gate will decide which face of the crisis appears."
chaosx.nr3.131.a: "Seal the counterfeit circle."
chaosx.nr3.131.b: "Let the rival teachers speak."
chaosx_nr3_131_a_tt: "The foreign host contains the exiled echo. The Holy Realm clears the abroad echo, gains Detachment and Mandala Reach, and lowers Defilements."
chaosx_nr3_131_b_tt: "The foreign host shelters the exiled echo, deepening the schism and raising Defilements and Final Silence Pressure."

chaosx.events_log.evolution.type.holy_realm: "§YHoly Realm Evolution§!"
chaosx.events_log.window.event_details.holy_realm: "The Holy Realm begins in the Himalayan passes, where a Bodhisattva leads monks and refugees toward a guarded refuge. Its vows shape how the Arhats govern and how envoys approach distant courts.\n\nAs suffering spreads, the Realm's promise of mercy hardens into military doctrine. The Mandala reaches beyond the mountains, and its members must decide whether their vows can survive pressure from the world around them.\n\nFinal Silence has two endings. If Chaos exceeds 1000 and no other ending has begun, the last doctrine calls Fallout and ends the world. Otherwise the Empty Seat follows, and the world continues."
chaosx.events_log.window.evolution_details.holy_realm.title.stage_1: "Pattern of Suffering"
chaosx.events_log.window.evolution_details.holy_realm.title.stage_2: "Relic Mandala"
chaosx.events_log.window.evolution_details.holy_realm.title.stage_3: "False Buddha Schism"
chaosx.events_log.window.evolution_details.holy_realm.title.stage_4: "Wrathful Protection"
chaosx.events_log.window.evolution_details.holy_realm.body.generic: "A special Holy Realm crisis or transformation has changed the path. The surviving vows still bind the Realm."
chaosx.events_log.window.evolution_details.holy_realm.body.stage_1: "Repeated teachings under chaos pressure make suffering itself the Realm's central proof. Ruined roads, frightened capitals, and broken armies are treated as evidence that mercy must answer the crisis directly."
chaosx.events_log.window.evolution_details.holy_realm.body.stage_2: "The Relic Mandala carries the Realm's vows beyond its own mountains. Pilgrim routes, foreign seats, and guarded relic lines turn distant states into a sacred network."
chaosx.events_log.window.evolution_details.holy_realm.body.stage_3: "A schism appears when high Defilements corrupt the path toward Buddhahood. Teaching can purify the rupture. Suppression can turn the wound into another source of power."
chaosx.events_log.window.evolution_details.holy_realm.body.stage_4: "Awakened protection answered the Sun and Moon crisis. The Realm remembers it as the strongest public proof that its powers can turn against chaos."

