holy_realm_panel_conquest_quiet: "Borders: the Realm has no designs beyond the mountain circle."
holy_realm_panel_conquest_open: "Borders: Bhutan, Nepal, or Sikkim still stands outside the Mandala, and the Realm may yet complete the circle by force."
holy_realm_panel_conquest_vow: "Borders: the mountain circle has been completed by vow."
holy_realm_panel_conquest_force: "Borders: the mountain circle is being completed by authority."
holy_realm_panel_conquest_letters: "Borders: letters of peace and authority can be sent to eligible neighbors."
holy_realm_panel_conquest_submission: "Borders: a foreign court has entered the Mandala without war."
holy_realm_panel_conquest_refusal: "Borders: a refusal can push the Realm closer to force."
holy_realm_panel_conquest_roads: "Borders: outer pass controls can turn roads into administration."
holy_realm_panel_conquest_borders: "Borders: the Mandala Bureau can pressure border courts."
holy_realm_panel_conquest_northern_india: "Borders: the Realm may integrate held Raj-core states under Northern Indian protection."
holy_realm_panel_conquest_eastern: "Borders: the Eastern Mandala can integrate held Chinese-core states after Arhat administration."
holy_realm_panel_conquest_world: "Borders: the world has been asked to kneel. This conquest doctrine stands apart from Final Silence."
