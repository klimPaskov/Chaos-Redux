holy_realm_mandala_core_tt: "The Mandala changes with teaching, meditation, Buddhahood, wrathful protection, Final Silence, and the Empty Seat."
holy_realm_chaos_value_low: "§G[?global.chaos_meter_value|.0]§!"
holy_realm_chaos_value_rising: "§Y[?global.chaos_meter_value|.0]§!"
