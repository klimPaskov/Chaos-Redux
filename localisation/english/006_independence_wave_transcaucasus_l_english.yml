independence_wave_form16_confirm_yerevan_capital_effect_tt: "Command capacity and political power are committed. The federal capital moves to Yerevan, and the congress action is recorded."
independence_wave_form16_confirm_tbilisi_capital_effect_tt: "Command capacity and political power are committed. The federal capital moves to Tbilisi, and the congress action is recorded."
independence_wave_form16_confirm_baku_capital_effect_tt: "Command capacity and political power are committed. The federal capital moves to Baku, and the congress action is recorded."
independence_wave_form16_convene_language_commission_effect_tt: "Command capacity is committed. The federal language commission is established, cohesion rises, and the congress action is recorded."
independence_wave_form16_unify_transcaucasian_rail_command_effect_tt: "Command capacity is committed. Federal rail coordination rises, and the congress action is recorded."
independence_wave_form16_settle_baku_oil_revenue_effect_tt: "Command capacity is committed. Federal revenue settlement rises, and the congress action is recorded."
independence_wave_form16_standardize_federal_army_effect_tt: "Command capacity is committed. Federal cohesion rises, and the congress action is recorded."

independence_wave_arm_mountain_republic_under_siege: "Mountain Republic Under Siege"
independence_wave_arm_mountain_republic_under_siege_desc: "The Armenian anchor is holding, but supply and civic authority remain below the level required for a durable founding settlement."
independence_wave_arm_mountain_republic_settled: "Settled Mountain Republic"
independence_wave_arm_mountain_republic_settled_desc: "Yerevan and the mountain approaches are supplied, the civic mandate is credible, and the new republic can arbitrate from a position of survival."
independence_wave_geo_black_sea_corridor_under_strain: "Black Sea Corridor Under Strain"
independence_wave_geo_black_sea_corridor_under_strain_desc: "Georgia's corridor is open only by improvisation. Rail, port customs, and federal mediation remain vulnerable to another crisis."
independence_wave_geo_black_sea_corridor_secured: "Black Sea Corridor Secured"
independence_wave_geo_black_sea_corridor_secured_desc: "Tbilisi, the rail line, and the Black Sea customs system now form a corridor the Georgian state can defend and negotiate."
independence_wave_azr_baku_oil_security_crisis: "Baku Oil Security Crisis"
independence_wave_azr_baku_oil_security_crisis_desc: "The oil belt is sovereign in name but vulnerable in practice. Guards, rail, fuel, and export guarantees have not yet made Baku secure."
independence_wave_azr_baku_oil_security_settled: "Baku Oil Security Settled"
independence_wave_azr_baku_oil_security_settled_desc: "The oil fields, Caspian rail, and export regime now sustain the Azerbaijani settlement without surrendering its decision-making authority."
independence_wave_form16_federal_charter_provisional: "Transcaucasian Federal Charter: Provisional"
independence_wave_form16_federal_charter_provisional_desc: "The three members have a charter, but its institutions are still provisional. A ledger reaching the coordinated line will unlock a functioning common administration."
independence_wave_form16_federal_charter_coordinated: "Transcaucasian Federal Charter: Coordinated"
independence_wave_form16_federal_charter_coordinated_desc: "At least one federal ledger has reached the coordinated line. The members can now turn shared language, rail, revenue, and army institutions into a settled compact."
independence_wave_form16_federal_charter_settled: "Transcaucasian Federal Charter: Settled"
independence_wave_form16_federal_charter_settled_desc: "Cohesion, transport, and revenue all meet the settled line. The federal administration can pursue common projects without reopening the founding bargain."

independence_wave_transcaucasus_founding_success_tt: "The founding mission succeeds: both local ledgers rise by [?constant:independence_wave_transcaucasus_value.mission_progress_gain|0], and the republic publishes its founding receipt."
independence_wave_transcaucasus_founding_failure_tt: "The founding mission fails: both local ledgers fall by [?constant:independence_wave_transcaucasus_value.mission_failure_loss_display|0], and the republic remains in crisis."
independence_wave_transcaucasus_project_complete_tt: "The project resolves successfully, applying its configured minor, standard, or major ledger gain and updating Recognition, Security, and Network standing."
independence_wave_transcaucasus_project_cancel_tt: "The project is abandoned: both local ledgers fall by [?constant:independence_wave_transcaucasus_value.mission_failure_loss_display|0]."
independence_wave_transcaucasus_arbitration_complete_tt: "The arbitration succeeds: both local ledgers rise by [?constant:independence_wave_transcaucasus_value.action_standard_gain|0], and the federation receipt is published."
independence_wave_transcaucasus_arbitration_cancel_tt: "The arbitration is abandoned: both local ledgers fall by [?constant:independence_wave_transcaucasus_value.mission_failure_loss_display|0]."

chaosx.nr006.6816.t: "A Transcaucasian Charter Is Proposed"
chaosx.nr006.6816.desc: "The government that holds the other anchor has invited us to a voluntary Transcaucasian charter. Consent preserves our voice in the founding negotiations while opening a common settlement for Yerevan, Tbilisi, and Baku. Refusal keeps our republic outside the proposed federation."
chaosx.nr006.6816.a: "Join the charter negotiations"
chaosx.nr006.6816.a.tt: "Accept the invitation and record a generation-bound consent for the Transcaucasian Federation."
chaosx.nr006.6816.b: "Remain sovereign"
chaosx.nr006.6816.b.tt: "Refuse the invitation. The republic remains sovereign and cannot be counted as a consenting federal member in this proposal."

