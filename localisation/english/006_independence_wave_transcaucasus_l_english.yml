l_english:
independence_wave_transcaucasus_reconstruction_category: "Transcaucasian Reconstruction"
independence_wave_transcaucasus_reconstruction_category_desc: "Keep the three new republics alive while their founding work is unfinished. Current ledgers: Armenia [?iw070_mountain_supply|0]/[?iw070_civic_legitimacy|0], Georgia [?iw071_corridor_access|0]/[?iw071_federal_mediation|0], Azerbaijan [?iw072_oil_security|0]/[?iw072_export_legitimacy|0]. Each ledger pair must reach [?constant:independence_wave_transcaucasus_value.stable_threshold|0]. A failed or cancelled founding action reduces each affected ledger by [?constant:independence_wave_transcaucasus_value.mission_failure_loss_display|0]."
independence_wave_form16_integration_category: "The Transcaucasian Charter"
independence_wave_form16_integration_category_desc: "The federal charter is at tier [?independence_wave_form16_charter_tier|0]. Cohesion [?form16_federal_cohesion|0], transport [?form16_transport_integration|0], and revenue [?form16_revenue_settlement|0] advance from provisional to coordinated when any ledger reaches [?constant:independence_wave_transcaucasus_value.form16_coordinated_threshold|0], and to settled when all three reach [?constant:independence_wave_transcaucasus_value.form16_settled_threshold|0]. Formation requires living Armenian, Georgian, and Azerbaijani members, completed founding and arbitration work, peace, and a constitutional or league route. Keep Yerevan, Tbilisi, and Baku under federal control to continue the charter."

independence_wave_arm_secure_yerevan_approaches: "Secure the Yerevan Approaches"
independence_wave_arm_secure_yerevan_approaches_desc: "The mountain republic cannot call its settlement durable while the approaches to Yerevan remain exposed. Hold Yerevan, organize the command, and bring both civic ledgers above the settlement line before the founding mission expires."
independence_wave_arm_reopen_yerevan_depots: "Reopen the Yerevan Depots"
independence_wave_arm_reopen_yerevan_depots_desc: "Restore the depot chain around the capital with command attention and two trains. The work improves mountain supply and public authority, but the trains cannot be used elsewhere while the project is underway."
independence_wave_arm_integrate_mountain_garrisons: "Integrate the Mountain Garrisons"
independence_wave_arm_integrate_mountain_garrisons_desc: "Bring local garrisons into one frontier command. Infantry and support equipment, manpower, and command attention are committed to the integration."
independence_wave_arm_assemble_civic_mandate: "Assemble a Civic Mandate"
independence_wave_arm_assemble_civic_mandate_desc: "Spend political authority and a reserve of manpower to make the capital's orders credible beyond the mountain districts. The mandate strengthens civic legitimacy while the work consumes the state's scarce administrative reserve."
independence_wave_arm_arbitrate_transcaucasian_frontier: "Arbitrate the Transcaucasian Frontier"
independence_wave_arm_arbitrate_transcaucasian_frontier_desc: "With the mountain settlement stable and the neighboring members at peace, submit the three-way frontier to binding arbitration. The receipt is required before Armenia can sponsor the Transcaucasian Federation."

independence_wave_geo_keep_tbilisi_black_sea_corridor_open: "Keep Tbilisi and the Black Sea Corridor Open"
independence_wave_geo_keep_tbilisi_black_sea_corridor_open_desc: "Georgia's settlement depends on a corridor from Tbilisi to the Black Sea. Hold Tbilisi, keep access moving, and bring corridor access and federal mediation above the settlement line before the mission expires."
independence_wave_geo_restore_transcaucasian_rail: "Restore the Transcaucasian Rail"
independence_wave_geo_restore_transcaucasian_rail_desc: "Commit four trains, labor, and command attention to reopen the rail route through Tbilisi. The project improves corridor access and public mediation."
independence_wave_geo_organize_mountain_command: "Organize the Mountain Command"
independence_wave_geo_organize_mountain_command_desc: "Build a Georgian mountain staff from defectors and local officers. Infantry, support equipment, manpower, and command attention turn the corridor into a defensible route."
independence_wave_geo_balance_port_customs: "Balance the Port Customs"
independence_wave_geo_balance_port_customs_desc: "Use political authority and a civilian factory allocation to reconcile port customs with the interior administration. The settlement raises mediation and corridor access while tying up the port's construction capacity."
independence_wave_geo_host_border_conference: "Host a Border Conference"
independence_wave_geo_host_border_conference_desc: "When Armenia and Azerbaijan are at peace, bring all three delegations to a binding border conference. Its arbitration receipt is the Georgian contribution to the federation's founding ledger."

independence_wave_azr_secure_baku_oil_belt: "Secure the Baku Oil Belt"
independence_wave_azr_secure_baku_oil_belt_desc: "Azerbaijan's first settlement is an oil-security crisis. Hold Baku, protect the fields, and raise both oil security and export legitimacy above the settlement line before the mission expires."
independence_wave_azr_guard_baku_oil_fields: "Guard the Baku Oil Fields"
independence_wave_azr_guard_baku_oil_fields_desc: "Commit infantry, support equipment, manpower, and command attention to a professional oil-field guard. The work protects production while concentrating the new state's military power around Baku."
independence_wave_azr_restore_caspian_rail: "Restore the Caspian Rail"
independence_wave_azr_restore_caspian_rail_desc: "Use four trains, labor, and command attention to reconnect Baku with the Caspian corridor. Oil security improves only while the railway reserve remains available."
independence_wave_azr_negotiate_export_recognition: "Negotiate Export Recognition"
independence_wave_azr_negotiate_export_recognition_desc: "Spend political authority, command attention, and fuel to make the oil trade credible to foreign buyers. The bargain improves export legitimacy but consumes the fuel that would otherwise support the army."
independence_wave_azr_submit_corridor_guarantees: "Submit Corridor Guarantees"
independence_wave_azr_submit_corridor_guarantees_desc: "With Armenia and Georgia at peace, offer binding guarantees for the Caspian corridors. The arbitration receipt completes Azerbaijan's federation obligation."

independence_wave_form16_confirm_yerevan_capital: "Seat the Federal Capital in Yerevan"
independence_wave_form16_confirm_yerevan_capital_desc: "Once the federation is established and while Yerevan, Tbilisi, and Baku remain under federal control, transfer the capital to Yerevan and make the mountain frontier the federation's first administrative priority."
independence_wave_form16_confirm_tbilisi_capital: "Seat the Federal Capital in Tbilisi"
independence_wave_form16_confirm_tbilisi_capital_desc: "Once the federation is established and while Yerevan, Tbilisi, and Baku remain under federal control, transfer the capital to Tbilisi and make the Black Sea corridor the federation's first administrative priority."
independence_wave_form16_confirm_baku_capital: "Seat the Federal Capital in Baku"
independence_wave_form16_confirm_baku_capital_desc: "Once the federation is established and while Yerevan, Tbilisi, and Baku remain under federal control, transfer the capital to Baku and make the Caspian and oil economy the federation's first administrative priority."
independence_wave_form16_convene_language_commission: "Convene the Language Commission"
independence_wave_form16_convene_language_commission_desc: "Spend command capacity to establish a federal language commission. The commission strengthens cohesion by making plural administration a charter obligation."
independence_wave_form16_unify_transcaucasian_rail_command: "Unify the Transcaucasian Rail Command"
independence_wave_form16_unify_transcaucasian_rail_command_desc: "Spend command capacity to place the three anchor rail systems under one timetable and emergency authority."
independence_wave_form16_settle_baku_oil_revenue: "Settle the Baku Oil Revenue"
independence_wave_form16_settle_baku_oil_revenue_desc: "Spend command capacity to turn Baku's oil receipts into a federal revenue settlement accepted by all three members."
independence_wave_form16_standardize_federal_army: "Standardize the Federal Army"
independence_wave_form16_standardize_federal_army_desc: "Spend command capacity to align the mountain guards, corridor command, and oil-field formations under one federal standard."

