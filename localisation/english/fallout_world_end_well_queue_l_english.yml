l_english:
chaosx.fallout.153.t: "The Well Queue"
chaosx.fallout.153.d: "The public well in [?fallout_event_153_well_state_id.GetName] is producing less clean water as ash settles in the catchment and frost closes the smaller pumps. [ROOT.GetAirWinterGovernmentAuthority] can publish one queue, issue ration cards through the filter room, or put the intake under guard. The order will be judged against the records kept by [ROOT.GetAirWinterGovernmentOfficial]."
chaosx.fallout.153.a: "Publish one water queue"
chaosx.fallout.153.a.tt: "Spend §Y[?constant:fallout_event_153_cost.public_water|0]§! Clean Water Security and review the public queue after §Y[?constant:fallout_event_153_timing.result_delay_days|0] days§!. A strong result raises national water security, recognition, cohesion, stability, and the water security of §Y[?fallout_event_153_well_state_id.GetName]§!. A failure records civilian deaths through the Deaths ledger."
chaosx.fallout.153.b: "Issue ration cards for filtered water"
chaosx.fallout.153.b.tt: "Spend §Y[?constant:fallout_event_153_cost.ration_filters|0]§! Filter Stock and review the ration cards after §Y[?constant:fallout_event_153_timing.result_delay_days|0] days§!. A strong result protects filtered distribution, while a failure leaves a water grievance and records civilian deaths through the Deaths ledger."
chaosx.fallout.153.c: "Put the well under guard"
chaosx.fallout.153.c.tt: "Spend §Y[?constant:fallout_event_153_cost.guard_command_power_cost|0]§! Command Power and review the guarded intake after §Y[?constant:fallout_event_153_timing.result_delay_days|0] days§!. The order favors governments that can hold a checkpoint or are already at war, but a failure records civilian deaths through the Deaths ledger."

chaosx.fallout.155.t: "The Public Queue Review"
chaosx.fallout.155.success.d: "The public queue in [?fallout_event_153_well_state_id.GetName] held through four days of frost. [ROOT.GetAirWinterGovernmentOfficial] published the draw times, clinic priority, and inspection marks, and [ROOT.GetAirWinterGovernmentAuthority] could answer each district with the same ledger. A follow-up review will test whether the arrangement survives ordinary distrust."
chaosx.fallout.155.partial.d: "The public queue in [?fallout_event_153_well_state_id.GetName] kept water moving, but the first cold night separated the clinic line from the market line. [ROOT.GetAirWinterGovernmentOfficial] can show the numbers, though several wards now claim that their draw time was shortened."
chaosx.fallout.155.failure.d: "The public queue in [?fallout_event_153_well_state_id.GetName] broke when the intake froze before the second inspection. Water clerks could not reconcile the household marks, and [ROOT.GetAirWinterGovernmentAuthority] must carry the deaths and missing containers into the next register."
chaosx.fallout.155.a: "Send the public result to every ward."
chaosx.fallout.155.a.tt: "Resolve the public queue review, record its result in Fallout memory, and schedule a five-day follow-up review."

chaosx.fallout.156.t: "The Filter Room Review"
chaosx.fallout.156.success.d: "The filter room in [?fallout_event_153_well_state_id.GetName] kept its cards, seals, and replacement cloth in one custody book. Clinic crews received their allotment before the market queues opened, and [ROOT.GetAirWinterGovernmentAuthority] can point to a named clerk for every transfer. The follow-up review will test the cost of that discipline."
chaosx.fallout.156.partial.d: "The filter room in [?fallout_event_153_well_state_id.GetName] caught the worst ash, but replacement cloth arrived unevenly. The ration cards kept clinics ahead of the market, while outer wards learned that a clean stamp did not always mean a full measure."
chaosx.fallout.156.failure.d: "The filter room in [?fallout_event_153_well_state_id.GetName] ran out of usable cloth before the night shift. [ROOT.GetAirWinterGovernmentOfficial] has a list of spoiled barrels and late clinics, while [ROOT.GetAirWinterGovernmentAuthority] faces the deaths that followed the empty racks."
chaosx.fallout.156.a: "Carry the filter result into the next review."
chaosx.fallout.156.a.tt: "Resolve the ration card review, record its result in Fallout memory, and schedule a five-day follow-up review."

chaosx.fallout.157.t: "The Guarded Intake Review"
chaosx.fallout.157.success.d: "The guarded intake in [?fallout_event_153_well_state_id.GetName] stayed open because the checkpoint and the pump crews shared one watch bill. [ROOT.GetAirWinterGovernmentAuthority] kept the water route under direct order, and [ROOT.GetAirWinterGovernmentOfficial] recorded the first convoy without a missing seal. The follow-up review will decide whether the guard can become a civil service."
chaosx.fallout.157.partial.d: "The guarded intake in [?fallout_event_153_well_state_id.GetName] opened for the central wards, but the checkpoint could not watch every feeder pipe. The order protected the first convoy and left a grievance in the streets beyond the guard post."
chaosx.fallout.157.failure.d: "The guarded intake in [?fallout_event_153_well_state_id.GetName] failed when the watch changed before the pump crews arrived. The checkpoint spent its authority without securing clean water, and [ROOT.GetAirWinterGovernmentAuthority] must answer for the deaths entered in the district book."
chaosx.fallout.157.a: "Carry the guard report into the next review."
chaosx.fallout.157.a.tt: "Resolve the guarded intake review, record its result in Fallout memory, and schedule a five-day follow-up review."

chaosx.fallout.161.t: "The Well Ledger Comes Due"
chaosx.fallout.161.success.d: "The follow-up review in [?fallout_event_153_well_state_id.GetName] found a shared cistern schedule that outlasted the first order. [ROOT.GetAirWinterGovernmentOfficial] can now publish the reserve, the clinics can plan around it, and [ROOT.GetAirWinterGovernmentAuthority] has a water compact that local councils recognize."
chaosx.fallout.161.partial.d: "The follow-up review in [?fallout_event_153_well_state_id.GetName] kept the intake alive, but the queue still depends on exceptions known only to a few clerks. The reserve is real, while the compact remains a promise between [ROOT.GetNameDef] and the ward councils."
chaosx.fallout.161.failure.d: "The follow-up review in [?fallout_event_153_well_state_id.GetName] closed with a disputed queue and another cold-water loss. The Deaths ledger carries the cost, and [ROOT.GetAirWinterGovernmentAuthority] will meet every later request for a public measure with this failed book in hand."
chaosx.fallout.161.a: "Seal the follow-up result in the water books."
chaosx.fallout.161.a.tt: "Resolve the follow-up review, record the final Fallout memory, and release both delayed cleanup receipts."

fallout.event_log.well_queue.name: "The Well Queue"
fallout.event_log.well_queue.detail: "[GetFalloutEvent153EventLogDetail]"
fallout.event_log.well_queue.detail.public_success: "A published water queue held through frost, giving clinics and wards one inspected measure from the same well."
fallout.event_log.well_queue.detail.public_partial: "A public queue kept water moving, but the first cold nights turned draw times into a dispute between wards."
fallout.event_log.well_queue.detail.public_failure: "The intake froze before the public queue could be reconciled, and deaths followed the missing containers."
fallout.event_log.well_queue.detail.ration_success: "Filter cards kept clinic allotments ahead of the market and gave the intake a named chain of custody."
fallout.event_log.well_queue.detail.ration_partial: "Filter cards caught the worst ash, but uneven cloth deliveries left outer wards with unequal measures."
fallout.event_log.well_queue.detail.ration_failure: "The filter room ran dry during the night shift, leaving spoiled barrels, late clinics, and deaths in its ledger."
fallout.event_log.well_queue.detail.guard_success: "A shared checkpoint and pump watch kept the guarded intake open and turned the first convoy into a public record."
fallout.event_log.well_queue.detail.guard_partial: "The guard protected the central convoy, but feeder pipes and outer wards remained outside the watch bill."
fallout.event_log.well_queue.detail.guard_failure: "The watch changed before the pump crews arrived, and the guarded intake spent authority without securing clean water."
fallout.event_log.well_queue.detail.callback_success: "The follow-up review closed around a shared cistern schedule and a water compact recognized by local councils."
fallout.event_log.well_queue.detail.callback_partial: "The follow-up review kept the intake alive, but its reserve still depended on exceptions held by a few clerks."
fallout.event_log.well_queue.detail.callback_failure: "The follow-up review closed with a disputed queue, another cold-water loss, and deaths preserved in government memory."
