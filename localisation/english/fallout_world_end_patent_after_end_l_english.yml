chaosx.fallout.817.t: "The Patent After the End"
chaosx.fallout.817.opening.d: "The Reactor Shift left one district with a working archive of filters, pump parts, radio circuits, and repair drawings. The inventors want every design copied. Workshop guilds want credit for the hands that made them useful. The Technate can publish the register, protect each inventor, lock the designs behind state custody, or license them to nearby settlements."
chaosx.fallout.817.a: "Publish the designs"
chaosx.fallout.817.a.tt: "Spend Food 2, Medicine 2, and Recognition 2 to place the district's repair designs in a public register. This improves research capacity and reduces market pressure while the delayed result is checked."
chaosx.fallout.817.b: "Protect inventor rights"
chaosx.fallout.817.b.tt: "Spend Fuel 2, Recognition 3, and Cohesion 2 to give the people who made the designs a durable claim. This raises inventor trust but can leave production and trade dependent on a few workshops."
chaosx.fallout.817.c: "Keep the archive secret"
chaosx.fallout.817.c.tt: "Spend Scrap 2, Power 2, and Medicine 2 to restrict the archive to state custodians. This strengthens production security and legitimacy while increasing the cost of outside cooperation."
chaosx.fallout.817.d: "License the region"
chaosx.fallout.817.d.tt: "Spend Food 2, Fuel 2, and Recognition 2 to issue time-limited licenses to nearby settlements. This opens trade and lowers pressure on one workshop, but the register can be copied or contested."
chaosx.fallout.818.t: "The Patent After the End"
chaosx.fallout.819.t: "The Register Has Four Owners"
chaosx.fallout.819.public_domain.success.d: "The public register opened with the names of the surviving makers and the conditions under which a design could be copied. Clinics received filter drawings, workshops received pump measurements, and the Technate gained research capacity without turning one guild into a gatekeeper."
chaosx.fallout.819.public_domain.partial.d: "Most of the archive was copied, but the best circuit diagrams stayed in one locked drawer. Repairs moved faster in the host district while other workshops argued that the public register had become another kind of monopoly."
chaosx.fallout.819.public_domain.failure.d: "The register opened during a power cut and several plates were lost before they could be checked. The district kept its old repairs, but the public promise now carries a market grievance and less trust in the Technate's ledgers."
chaosx.fallout.819.inventor_rights.success.d: "The workshop crews received signed claims, apprenticeships, and a share of every approved copy. Their trust made the designs clearer and safer, though production now moves at the pace of people who can refuse a rushed order."
chaosx.fallout.819.inventor_rights.partial.d: "The makers secured a voice and a modest claim, but the register still depends on two exhausted workshops. The district can improve its own tools while neighboring settlements wait for a price and a promise."
chaosx.fallout.819.inventor_rights.failure.d: "The rights council broke over who counted as a maker. A damaged workshop lost its drawings, the archive gained no reliable copy, and the surviving crews now treat every request as a demand for unpaid labor."
chaosx.fallout.819.state_secrecy.success.d: "State custodians sealed the archive, audited every copy, and assigned protected production runs to the host district. The system improves reliability and legitimacy, but every neighbor now sees the Technate as a guarded source of useful knowledge."
chaosx.fallout.819.state_secrecy.partial.d: "The archive stayed closed and the main workshops received enough material to keep working. Production held, yet the shortage of outside copies leaves trade brittle whenever a machine fails beyond the state perimeter."
chaosx.fallout.819.state_secrecy.failure.d: "The custody roster consumed the last spare plates and treated a repair request as an espionage attempt. A factory line stopped, the archive gained a secrecy grievance, and the state must rebuild trust before it can ask for help."
chaosx.fallout.819.regional_licensing.success.d: "The Technate issued short licenses with clear safety notes, copying limits, and a return date. Nearby settlements paid in fuel and parts, the host workshops gained new apprentices, and the register became a regional trade instrument rather than a private hoard."
chaosx.fallout.819.regional_licensing.partial.d: "Licenses reached two settlements, but a third copied a circuit without the safety plate. Trade improved around the host district while the Technate now has to decide whether a broken promise should end the whole licensing compact."
chaosx.fallout.819.regional_licensing.failure.d: "The license seals were copied before the first shipment left. The archive has no reliable list of authorized designs, the nearest workshops refuse new orders, and every neighbor suspects that the register was built to control trade."
chaosx.fallout.819.a: "Record the patent result"
chaosx.fallout.819.a.tt: "Apply the delayed research, production, trade, legitimacy, and espionage result, update Air Winter ledgers, and schedule the year-two patent review."
chaosx.fallout.821.t: "The Second-Year Patent Review"
chaosx.fallout.821.success.d: "A second winter found the register in use beyond the host district. The Technate has a durable patent memory, clearer production expectations, and enough trust to let research and trade reinforce each other without surrendering safety checks."
chaosx.fallout.821.partial.d: "The register survived, but its value still depends on one tired clerk, two trusted makers, and a small stock of plates. The Technate can continue the route, though each new copy must settle the old argument between public knowledge and private credit."
chaosx.fallout.821.failure.d: "The review found a patent system that could no longer tell a safe copy from a stolen one. Production slowed, espionage pressure rose, and the host district returned to local repairs while it decides whether the archive deserves another chance."
chaosx.fallout.821.a: "Close the patent review"
chaosx.fallout.821.a.tt: "Apply the delayed review, write the final Patent After the End memory, and release the reserved district and neighbor records."
