fallout_nzl.event_log.card: "New Zealand Lifeboat State\n\nThe five holdings are Wellington, Auckland, Canterbury, Marlborough, and Otago. The current or final course is the [GetFalloutNZLEventLogCardRouteLabel] course. Harbour Capacity stands at [?fallout_nzl_event_log_card_harbor|0], Food Security at [?fallout_nzl_event_log_card_food|0], Parliament Trust at [?fallout_nzl_event_log_card_trust|0], and Sea-Lane Security at [?fallout_nzl_event_log_card_security|0].\n\nHarbour Law ended in [GetFalloutNZLEventLogCardOpeningResult] on [GetFalloutNZLEventLogCardOpeningDate]. The ration settlement ended in [GetFalloutNZLEventLogCardDomesticResult] on [GetFalloutNZLEventLogCardDomesticDate]. The Pacific passage ended in [GetFalloutNZLEventLogCardExternalResult] on [GetFalloutNZLEventLogCardExternalDate]. The Year 10 order ended in [GetFalloutNZLEventLogCardLateResult] on [GetFalloutNZLEventLogCardLateDate].\n\nThe humanitarian course keeps food, berths, and named relief partners before Parliament. The isolation course denies foreign basing, pays for patrol control, and answers proven raiders by name.\n[GetFalloutNZLEventLogCardPartnerClause]\n[GetFalloutNZLEventLogCardAggressorClause]"
fallout_nzl.event_log.card.composite: "$fallout_nzl.event_log.card$"

fallout_nzl.event_log.detail.opening: "Harbour Law set the terms by which Wellington, Auckland, Canterbury, Marlborough, and Otago would carry those who reached the islands alive.\n\nThe council chose [GetFalloutNZLEventLogChoiceLabel]. The [GetFalloutNZLEventLogRouteLabel] route guided the decision, which ended in [GetFalloutNZLEventLogResultLabel].\n\nThe entry is dated [?fallout_nzl_event_log_detail_date.GetDateStringNoHour] and bears the authority of [?fallout_nzl_event_log_detail_actor.GetNameDef]. At that point, Harbour Capacity stood at [?fallout_nzl_event_log_detail_harbor|0], Food Security at [?fallout_nzl_event_log_detail_food|0], Parliament Trust at [?fallout_nzl_event_log_detail_trust|0], and Sea-Lane Security at [?fallout_nzl_event_log_detail_security|0]."
fallout_nzl.event_log.detail.domestic: "Ration delegates and harbour wardens decided how Wellington, Auckland, Canterbury, Marlborough, and Otago would share milk powder, rail space, and open berths. Harbour Law had ended in [GetFalloutNZLEventLogPriorOpeningResultLabel].\n\nThe council chose [GetFalloutNZLEventLogChoiceLabel]. The [GetFalloutNZLEventLogRouteLabel] route guided the decision, which ended in [GetFalloutNZLEventLogResultLabel].\n\nThe entry is dated [?fallout_nzl_event_log_detail_date.GetDateStringNoHour] and bears the authority of [?fallout_nzl_event_log_detail_actor.GetNameDef]. At that point, Harbour Capacity stood at [?fallout_nzl_event_log_detail_harbor|0], Food Security at [?fallout_nzl_event_log_detail_food|0], Parliament Trust at [?fallout_nzl_event_log_detail_trust|0], and Sea-Lane Security at [?fallout_nzl_event_log_detail_security|0]."
fallout_nzl.event_log.detail.external_partner: "Wireless operators copied an answer from [?fallout_nzl_event_log_detail_partner.GetNameDef] into the harbour books and fixed the terms of a Pacific passage.\n\nThe council chose [GetFalloutNZLEventLogChoiceLabel]. The [GetFalloutNZLEventLogRouteLabel] route guided the decision, which ended in [GetFalloutNZLEventLogResultLabel].\n\nThe entry is dated [?fallout_nzl_event_log_detail_date.GetDateStringNoHour] and bears the authority of [?fallout_nzl_event_log_detail_actor.GetNameDef] and [?fallout_nzl_event_log_detail_partner.GetNameDef]. At that point, Harbour Capacity stood at [?fallout_nzl_event_log_detail_harbor|0], Food Security at [?fallout_nzl_event_log_detail_food|0], Parliament Trust at [?fallout_nzl_event_log_detail_trust|0], and Sea-Lane Security at [?fallout_nzl_event_log_detail_security|0]."
fallout_nzl.event_log.detail.external_no_partner: "Wireless operators searched the Pacific weather band, but no eligible coastal government signed the proposed passage. Wellington, Auckland, Canterbury, Marlborough, and Otago kept their own shores.\n\nThe council chose [GetFalloutNZLEventLogChoiceLabel]. The [GetFalloutNZLEventLogRouteLabel] route guided the decision, which ended in [GetFalloutNZLEventLogResultLabel].\n\nThe entry is dated [?fallout_nzl_event_log_detail_date.GetDateStringNoHour] and bears the authority of [?fallout_nzl_event_log_detail_actor.GetNameDef]. At that point, Harbour Capacity stood at [?fallout_nzl_event_log_detail_harbor|0], Food Security at [?fallout_nzl_event_log_detail_food|0], Parliament Trust at [?fallout_nzl_event_log_detail_trust|0], and Sea-Lane Security at [?fallout_nzl_event_log_detail_security|0]."
fallout_nzl.event_log.detail.late: "After ten years, the harbour books closed on a final order for Wellington, Auckland, Canterbury, Marlborough, and Otago.\n\nThe council chose [GetFalloutNZLEventLogChoiceLabel]. The [GetFalloutNZLEventLogRouteLabel] route guided the decision, which ended in [GetFalloutNZLEventLogResultLabel].\n\nThe entry is dated [?fallout_nzl_event_log_detail_date.GetDateStringNoHour] and bears the authority of [?fallout_nzl_event_log_detail_actor.GetNameDef]. At that point, Harbour Capacity stood at [?fallout_nzl_event_log_detail_harbor|0], Food Security at [?fallout_nzl_event_log_detail_food|0], Parliament Trust at [?fallout_nzl_event_log_detail_trust|0], and Sea-Lane Security at [?fallout_nzl_event_log_detail_security|0]."
fallout_nzl.event_log.detail.unresolved: "The harbour books carry no surviving entry for this decision, so its outcome and signatories remain unknown."
