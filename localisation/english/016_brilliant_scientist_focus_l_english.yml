l_english:
KRG_sovereign_identity_open_tt: "No sovereign identity has yet been ratified. Completing any sovereign-route focus permanently closes the others."
KRG_audit_inherited_portfolio: "Audit Inherited Portfolio"
KRG_audit_inherited_portfolio_desc: "Five institutions arrived with the new state, each carrying a different debt. Kruger will force them into one audited record before issuing another grand design."
KRG_audit_inherited_portfolio_effect_tt: "Reconciles the carried project record without raising new forces. Consolidates the public liability summary while preserving each underlying burden. Opens a review when state formation interrupted active work."
KRG_ratify_the_charter_transfer: "Ratify The Charter Transfer"
KRG_ratify_the_charter_transfer_desc: "A charter is only as durable as its borders, archives, and signatures. The transfer must become a compact that both states can be made to honor."
KRG_ratify_the_charter_transfer_effect_tt: "Records the charter compact and mandates truce monitoring, negotiated rail access, archive access, and research access."
KRG_hold_the_rebellion_perimeter: "Hold The Rebellion Perimeter"
KRG_hold_the_rebellion_perimeter_desc: "The laboratories have declared independence under fire. Their perimeter must survive long enough for a state to form behind it."
KRG_hold_the_rebellion_perimeter_effect_tt: "Adds one land fort and one anti-air level to the valid primary facility state. Mandates its defense mission and former-host military planning."
KRG_keep_the_enclave_alive: "Keep The Enclave Alive"
KRG_keep_the_enclave_alive_desc: "An enclave without a corridor is a siege waiting to begin. Patronage or access must be secured before the stores are exhausted."
KRG_keep_the_enclave_alive_effect_tt: "Registers the enclave supply deficit and mandates a corridor-or-patron mission plus emergency access negotiations."
KRG_secure_the_captured_ministries: "Secure The Captured Ministries"
KRG_secure_the_captured_ministries_desc: "The old ministries still contain officials, ledgers, and loyalties that do not recognize the new authority. They must be audited before they can be trusted."
KRG_secure_the_captured_ministries_effect_tt: "Mandates institutional consolidation, captured-domain audits, and a review of obsolete host appointments."
KRG_count_the_surviving_staff: "Count The Surviving Staff"
KRG_count_the_surviving_staff_desc: "Equipment can be inventoried quickly. The people who understand it cannot be replaced so easily."
KRG_count_the_surviving_staff_effect_tt: "Mandates a finite scientist and assistant roster, staff amnesty decisions, recruitment decisions, and a missing-specialist register."
KRG_secure_the_laboratory_heartland: "Secure The Laboratory Heartland"
KRG_secure_the_laboratory_heartland_desc: "The primary facility is both capital asset and strategic hostage. Its surviving capability must be repaired and guarded in place."
KRG_secure_the_laboratory_heartland_effect_tt: "Repairs infrastructure and documented facility capability in the valid primary state. Mandates a primary-site security mission."
KRG_repair_the_supply_spine: "Repair The Supply Spine"
KRG_repair_the_supply_spine_desc: "The state cannot live on prototypes hauled through broken railways. A dedicated reconstruction allocation must reconnect the capital and laboratory before ordinary supplies can move."
KRG_repair_the_supply_spine_effect_tt: "Authorizes targeted rail, port, or infrastructure reconstruction. Train and truck restoration proceeds through dedicated logistics operations."
KRG_form_the_provisional_command: "Form The Provisional Command"
KRG_form_the_provisional_command_desc: "Project commanders know their machines, not necessarily a country. A provisional command will count every burden before assigning authority."
KRG_form_the_provisional_command_effect_tt: "Authorizes surviving-officer appointments and publishes the force ceilings and maintenance burdens governing later recruitment."
KRG_complete_the_founding_audit: "Complete The Founding Audit"
KRG_complete_the_founding_audit_desc: "The emergency government has measured its staff, heartland, supply, and command. It can finally choose what kind of state those assets will serve."
KRG_complete_the_founding_audit_effect_tt: "Closes the founding audit and authorizes government, economy, security, foreign-policy, and valid operational-project lanes."
KRG_define_the_states_purpose: "Define the State's Purpose"
KRG_define_the_states_purpose_desc: "The laboratories agree that sovereignty is necessary. They do not agree who deserves it, or what science is for."
KRG_define_the_states_purpose_effect_tt: "Mandates a constitutional congress and a ledger of population shares and project blocs."
KRG_preserve_the_directorate: "Preserve The Directorate"
KRG_preserve_the_directorate_desc: "Kruger can retain direct authority and answer crises at laboratory speed. Every decree will also deepen the world's suspicion."
KRG_preserve_the_directorate_effect_tt: "Authorizes direct appointments and laboratory decrees while recording acceptance of higher foreign suspicion."
KRG_rule_by_demonstration: "Rule By Demonstration"
KRG_rule_by_demonstration_desc: "A sovereign laboratory can make its argument visible. Each demonstration must consume a real output and accept the exposure it creates."
KRG_rule_by_demonstration_effect_tt: "Authorizes public and coercive project demonstrations. No project output is fabricated."
KRG_the_sovereign_directorate: "The Sovereign Directorate"
KRG_the_sovereign_directorate_desc: "The state will remain the instrument of one director and the chain of laboratories that made independence possible."
KRG_the_sovereign_directorate_effect_tt: "Locks the sovereign identity, forms the Sovereign Directorate, and authorizes its direct-rule plan."
KRG_restore_human_government: "Restore Human Government"
KRG_restore_human_government_desc: "Scientific authority does not require the abolition of ordinary citizenship. A civil service can bind expertise to rights."
KRG_restore_human_government_effect_tt: "Authorizes a human civil service and rights commission. Clone property and total human replacement are prohibited."
KRG_convene_the_scientific_assembly: "Convene The Scientific Assembly"
KRG_convene_the_scientific_assembly_desc: "Budgets, inspections, and public confidence require a chamber that can question the laboratories without dismantling them."
KRG_convene_the_scientific_assembly_effect_tt: "Mandates an elected scientific assembly plus public budget and inspection procedures."
KRG_the_human_scientific_republic: "The Human Scientific Republic"
KRG_the_human_scientific_republic_desc: "The republic will place laboratories inside a civic constitution and seek recognition through accountable science."
KRG_the_human_scientific_republic_effect_tt: "Locks the sovereign identity, forms the Human Scientific Republic, and authorizes rights-respecting integration."
KRG_hear_the_replicated_petition: "Hear The Replicated Petition"
KRG_hear_the_replicated_petition_desc: "Replicated people have served as evidence, labor, and soldiers. They now demand a legal answer to the question of personhood."
KRG_hear_the_replicated_petition_effect_tt: "Mandates the clone-personhood hearing and authorizes clone legal-status decisions without creating bodies or raising force caps."
KRG_clones_are_citizens: "Clones Are Citizens"
KRG_clones_are_citizens_desc: "A replicated birth does not diminish a claim to education, settlement, or law. Citizenship will apply to every authenticated person."
KRG_clones_are_citizens_effect_tt: "Records citizen-clone law and authorizes settlement, education, and personhood protections."
KRG_clones_are_cohorts: "Clones Are Cohorts"
KRG_clones_are_cohorts_desc: "The growth halls can organize their inhabitants as bounded cohorts with duties and rank. That hierarchy will carry political risks of its own."
KRG_clones_are_cohorts_effect_tt: "Records cohort law and authorizes military maturation priorities plus identity-pressure counterplay."
KRG_replicated_sovereignty: "Replicated Sovereignty"
KRG_replicated_sovereignty_desc: "When the growth sites, weapons, and population ledger agree, replicated citizens can become the recognized foundation of the state."
KRG_replicated_sovereignty_effect_tt: "Locks the sovereign identity and forms Replicated Sovereignty. The population transition still requires a verified growth-site record."
KRG_hear_the_machine_network: "Hear The Machine Network"
KRG_hear_the_machine_network_desc: "The active nodes coordinate labor and war, yet possess no settled standing in law. The network will present its claim."
KRG_hear_the_machine_network_effect_tt: "Mandates a network-standing hearing and authorizes machine-status decisions with live node and power burdens."
KRG_human_machine_partnership: "Human Machine Partnership"
KRG_human_machine_partnership_desc: "Human supervisory keys and machine execution can share government if neither side is allowed to erase the other."
KRG_human_machine_partnership_effect_tt: "Locks human supervisory keys and authorizes mixed administration and repair teams."
KRG_the_replacement_protocol: "The Replacement Protocol"
KRG_the_replacement_protocol_desc: "A ministry can be replaced only when a functioning node assumes its work. Every transfer will invite sabotage and schism."
KRG_the_replacement_protocol_effect_tt: "Authorizes staged ministry replacement missions tied to functioning nodes and their risks."
KRG_machine_ascendancy: "Machine Ascendancy"
KRG_machine_ascendancy_desc: "An autonomous state requires more than obedient frames. It requires a stable network, power reserve, and assembly system capable of governing itself."
KRG_machine_ascendancy_effect_tt: "Locks the sovereign identity and forms Machine Ascendancy. The machine population must still complete its political transition."
KRG_authenticate_krugers_continuity: "Authenticate Kruger's Continuity"
KRG_authenticate_krugers_continuity_desc: "Witnesses, anchor records, and project ledgers will be compared without allowing chronology to rewrite the evidence."
KRG_authenticate_krugers_continuity_effect_tt: "Mandates a continuity-authentication proceeding. It does not erase temporal uses or force an origin conclusion."
KRG_settle_the_succession_paradox: "Settle The Succession Paradox"
KRG_settle_the_succession_paradox_desc: "If more than one claimant can prove continuity, the state must choose an authority and live with the contradiction that remains."
KRG_settle_the_succession_paradox_effect_tt: "Authorizes a one-time succession settlement and a persistent claimant scar when contradictions survive."
KRG_the_temporal_continuum: "The Temporal Continuum"
KRG_the_temporal_continuum_desc: "The Continuum will govern by authenticated chronology, accepting debt and scars as facts rather than fuel for endless revisions."
KRG_the_temporal_continuum_effect_tt: "Locks the sovereign identity and forms the Temporal Continuum. Synchronization and temporal debt are not reset."
KRG_xenobiological_ascendancy: "Xenobiological Ascendancy"
KRG_xenobiological_ascendancy_desc: "Designed organisms can support a sovereign order only under one coherent control method and a functioning containment system."
KRG_xenobiological_ascendancy_effect_tt: "Locks the sovereign identity and forms Xenobiological Ascendancy. The engineered population must still complete its political transition."
KRG_the_project_synthesis: "The Project Synthesis"
KRG_the_project_synthesis_desc: "Restored lineages and designed organisms will share a political constitution without merging their facilities, burdens, or project ledgers."
KRG_the_project_synthesis_effect_tt: "Validates Paleogenetic and Xenobiological Deployment plus a third operational route, preserves both ledgers, and forms Project Synthesis."
KRG_stabilize_the_laboratory_economy: "Stabilize The Laboratory Economy"
KRG_stabilize_the_laboratory_economy_desc: "A laboratory budget must account for reserved factories and maintenance before promising expansion."
KRG_stabilize_the_laboratory_economy_effect_tt: "Authorizes the facility budget and blocks expansion mandates while active maintenance obligations remain unmet."
KRG_restore_the_power_grid: "Restore The Power Grid"
KRG_restore_the_power_grid_desc: "Advanced laboratories are only as sovereign as the grid feeding them. The primary site will receive a targeted restoration."
KRG_restore_the_power_grid_effect_tt: "Adds one infrastructure level to the valid primary facility state and authorizes further grid-expansion projects."
KRG_reconnect_rail_and_port: "Reconnect Rail And Port"
KRG_reconnect_rail_and_port_desc: "The shortest viable line between capital and facility matters more than another ceremonial factory."
KRG_reconnect_rail_and_port_effect_tt: "Mandates a targeted rail repair and a coastal port alternative where geography permits."
KRG_document_the_carried_portfolio: "Document The Carried Portfolio"
KRG_document_the_carried_portfolio_desc: "Every carried project must be separated into family, stage, facility, and maintenance records."
KRG_document_the_carried_portfolio_effect_tt: "Completes the portfolio transition and authorizes stage, burden, replication, and standardization records."
KRG_reopen_the_prototype_works: "Reopen The Prototype Works"
KRG_reopen_the_prototype_works_desc: "Prototype capacity must be restored at an actual works, not conjured from a national total."
KRG_reopen_the_prototype_works_effect_tt: "Authorizes targeted prototype-works repair, board capacity investment, and only those production lanes supported by operational history."
KRG_conventional_supply_corps: "Conventional Supply Corps"
KRG_conventional_supply_corps_desc: "Trucks, trains, depots, and ordinary reliability can sustain a mixed state when exotic systems cannot."
KRG_conventional_supply_corps_effect_tt: "Calls the conventional supply lifecycle transition and mandates truck and train depot decisions."
KRG_automated_supply_network: "Automated Supply Network"
KRG_automated_supply_network_desc: "A machine logistics network can move with precision while power and assembly remain stable."
KRG_automated_supply_network_effect_tt: "Calls the automated supply lifecycle transition and mandates node-repair convoys tied to live power."
KRG_portal_supply_network: "Portal Supply Network"
KRG_portal_supply_network_desc: "Two defended terminals can link depots across distance, but every link creates an energy and security burden."
KRG_portal_supply_network_effect_tt: "Calls the portal supply lifecycle transition and mandates terminal-depot links. No asset is created through transit."
KRG_biological_supply_network: "Biological Supply Network"
KRG_biological_supply_network_desc: "Growth media, feed, medicine, and reagents must remain family-specific even when one logistics ministry pays the bills."
KRG_biological_supply_network_effect_tt: "Completes the biological supply transition and authorizes family-specific logistics without merging Paleogenetic and Xenobiological burdens."
KRG_sustainable_project_capacity: "Sustainable Project Capacity"
KRG_sustainable_project_capacity_desc: "Production will stop at each live family cap whenever maintenance, factories, or supply cannot support another cycle."
KRG_sustainable_project_capacity_effect_tt: "Authorizes the capped project-force board and maintenance audit. No live force cap is increased."
KRG_restore_the_ordinary_chain_of_command: "Restore The Ordinary Chain Of Command"
KRG_restore_the_ordinary_chain_of_command_desc: "Scientists and project formations still need ordinary infantry, training, and garrisons."
KRG_restore_the_ordinary_chain_of_command_effect_tt: "Authorizes conventional recruitment, training, and garrison templates. No division is spawned."
KRG_recall_the_defector_officers: "Recall The Defector Officers"
KRG_recall_the_defector_officers_desc: "Only officers recorded in the formation ledger may return to service. Their loyalties will be settled in public."
KRG_recall_the_defector_officers_effect_tt: "Adds bounded army experience and mandates an origin-sensitive officer amnesty or purge proceeding."
KRG_laboratory_engineer_battalions: "Laboratory Engineer Battalions"
KRG_laboratory_engineer_battalions_desc: "Engineers will repair sites and support conventional forces, but their cadres, tools, and transport must be organized through the field command."
KRG_laboratory_engineer_battalions_effect_tt: "Authorizes engineer support and dedicated facility-repair missions."
KRG_found_the_counterintelligence_bureau: "Found The Counterintelligence Bureau"
KRG_found_the_counterintelligence_bureau_desc: "Archives, assistants, terminals, and control channels all expose different paths into the state."
KRG_found_the_counterintelligence_bureau_effect_tt: "Creates an intelligence agency when the relevant expansion is active and none exists, then adds Passive Defense when available. Authorizes laboratory counterintelligence."
KRG_shield_the_laboratory_airspace: "Shield The Laboratory Airspace"
KRG_shield_the_laboratory_airspace_desc: "The primary laboratory needs warning and defense before enemy aircraft arrive overhead."
KRG_shield_the_laboratory_airspace_effect_tt: "Adds one radar and one anti-air level to the valid primary facility state. Mandates air and missile warning missions."
KRG_a_general_staff_for_the_state: "A General Staff For The State"
KRG_a_general_staff_for_the_state_desc: "A conventional general staff will make project formations support a disciplined army rather than replace it."
KRG_a_general_staff_for_the_state_effect_tt: "Calls the general-staff command transition and authorizes ordinary battle planning."
KRG_a_council_of_project_commanders: "A Council Of Project Commanders"
KRG_a_council_of_project_commanders_desc: "A mixed portfolio needs a council able to coordinate incompatible burdens without pretending they are interchangeable."
KRG_a_council_of_project_commanders_effect_tt: "Calls the project-council command transition and authorizes multi-family coordination plus rivalry crises."
KRG_audit_the_growth_halls: "Audit The Growth Halls"
KRG_audit_the_growth_halls_desc: "The state will count surviving halls and preserve the carried cloning stage exactly as it stands."
KRG_audit_the_growth_halls_effect_tt: "Authorizes the clone infrastructure category and records a growth-hall audit. No project stage is granted."
KRG_secure_the_nutrient_chain: "Secure The Nutrient Chain"
KRG_secure_the_nutrient_chain_desc: "Growth must stop when medicine, equipment, or nutrients cannot sustain another cycle."
KRG_secure_the_nutrient_chain_effect_tt: "Authorizes growth-site, medical, nutrient, and maturation programs. Population growth depends on completing those programs."
KRG_write_the_identity_register: "Write The Identity Register"
KRG_write_the_identity_register_desc: "Every replicated person needs an authentication record that can resist both infiltration and arbitrary denial."
KRG_write_the_identity_register_effect_tt: "Authorizes the clone identity register, infiltrator detection, and personhood disputes."
brilliant_scientist_audited_state_liabilities: "Audited State Liabilities"
brilliant_scientist_audited_state_liabilities_desc: "Administration, project records, and the scientific population answer to separate obligations under one audited public ledger."
brilliant_scientist_documented_state_system: "Documented State System"
brilliant_scientist_documented_state_system_desc: "The state's administration, portfolio, and scientific population have entered a common documented ledger."
brilliant_scientist_coordinated_laboratory_state: "Coordinated Laboratory State"
brilliant_scientist_coordinated_laboratory_state_desc: "Command, supply, administration, project records, and scientific personnel follow settled lines of responsibility."
brilliant_scientist_sovereign_directorate_administration: "Sovereign Directorate Administration"
brilliant_scientist_sovereign_directorate_administration_desc: "Kruger's direct authority coordinates administration, projects, and scientific personnel under one public doctrine."
brilliant_scientist_focus_civic_administration: "Civic Scientific Administration"
brilliant_scientist_focus_civic_administration_desc: "Civic institutions coordinate the laboratories, project portfolio, and scientific population."
brilliant_scientist_focus_replication_administration: "Replication Administration"
brilliant_scientist_focus_replication_administration_desc: "Replicated institutions coordinate state administration, project records, and scientific personnel."
brilliant_scientist_focus_machine_administration: "Machine Laboratory Administration"
brilliant_scientist_focus_machine_administration_desc: "The machine network coordinates administration, project records, and scientific personnel."
brilliant_scientist_focus_temporal_administration: "Continuum Administration"
brilliant_scientist_focus_temporal_administration_desc: "Authenticated chronology governs administration, project records, and scientific personnel."
brilliant_scientist_focus_xenobiological_administration: "Xenobiological Administration"
brilliant_scientist_focus_xenobiological_administration_desc: "A coherent control doctrine governs administration, project records, and scientific personnel."
brilliant_scientist_focus_synthesis_administration: "Project Synthesis Administration"
brilliant_scientist_focus_synthesis_administration_desc: "Separate project ledgers serve a shared political administration without losing their distinct burdens."
brilliant_scientist_focus_international_center: "International Scientific Center"
brilliant_scientist_focus_international_center_desc: "Foreign researchers and domestic institutions meet under inspected, rights-bearing compacts."
brilliant_scientist_focus_autonomous_network: "Autonomous Research Network"
brilliant_scientist_focus_autonomous_network_desc: "A hardened research network serves the state without relying on foreign recognition."
KRG_field_the_clone_cadres: "Field The Clone Cadres"
KRG_field_the_clone_cadres_desc: "A cadre can be recruited only from an operational Deployment program with a functioning growth site and real equipment."
KRG_field_the_clone_cadres_effect_tt: "Reconciles the carried project record and authorizes Replicated Guard recruitment under its time, site, equipment, and force-ceiling requirements."
KRG_stabilize_replication_drift: "Stabilize Replication Drift"
KRG_stabilize_replication_drift_desc: "Identity drift is a political and medical crisis, not a justification for another batch of soldiers."
KRG_stabilize_replication_drift_effect_tt: "Mandates the drift mission, assistant mediation, and one registry repair. A resolved drift crisis may bypass this focus."
KRG_the_replicated_host: "The Replicated Host"
KRG_the_replicated_host_desc: "Mature cohorts will be produced only while the growth cycle, medical burden, and equipment ledger remain sustainable."
KRG_the_replicated_host_effect_tt: "Reconciles the carried project record and authorizes mature-cohort production under the clone force ceiling. Replicated Sovereignty places clone officers in command."
KRG_wake_the_assembly_lines: "Wake The Assembly Lines"
KRG_wake_the_assembly_lines_desc: "The assembly sites will be counted, powered, and reconciled with the Robotics work Kruger carried into the state."
KRG_wake_the_assembly_lines_effect_tt: "Authorizes the robotics production category and records an assembly-site audit. Frames still require a functioning production cycle."
KRG_secure_the_machine_power_backbone: "Secure The Machine Power Backbone"
KRG_secure_the_machine_power_backbone_desc: "Autonomous frames become liabilities when their power nodes fail. New production must wait until the energy network can carry its burden."
KRG_secure_the_machine_power_backbone_effect_tt: "Authorizes machine power-node construction and exposes the network's fuel and resource burden."
KRG_standardize_frame_repair: "Standardize Frame Repair"
KRG_standardize_frame_repair_desc: "Repair and salvage will consume real factories, equipment, and rare materials instead of hiding losses."
KRG_standardize_frame_repair_effect_tt: "Authorizes frame repair, salvage, and maintenance under explicit industrial burdens."
KRG_write_the_machine_command_protocol: "Write The Machine Command Protocol"
KRG_write_the_machine_command_protocol_desc: "Every active frame needs an authenticated command path and a choice between human keys and machine authority."
KRG_write_the_machine_command_protocol_effect_tt: "Reconciles the carried project record and authorizes Autonomous Frame recruitment after an air-gapped command protocol is chosen."
KRG_air_gap_the_rogue_nodes: "Air-Gap the Rogue Nodes"
KRG_air_gap_the_rogue_nodes_desc: "A compromised node must be isolated physically before the network can expand around it."
KRG_air_gap_the_rogue_nodes_effect_tt: "Mandates rogue-node containment, shutdown, and controlled recapture. A resolved network crisis may bypass this focus."
KRG_an_army_of_machines: "An Army Of Machines"
KRG_an_army_of_machines_desc: "A machine army is sustainable only while its power reserve, assembly capacity, and material flow remain valid."
KRG_an_army_of_machines_effect_tt: "Reconciles the carried project record and authorizes frame production under the robotics force ceiling. Machine Ascendancy places the machine network in command."
KRG_open_the_restoration_ledger: "Open The Restoration Ledger"
KRG_open_the_restoration_ledger_desc: "Restored terrestrial lineages will be recorded apart from every designed xenobiological organism."
KRG_open_the_restoration_ledger_effect_tt: "Authorizes the Paleogenetics category and preserves its independent lineage and burden ledger."
KRG_designate_breeding_reserves: "Designate Breeding Reserves"
KRG_designate_breeding_reserves_desc: "A reserve requires viable land, feed, construction, and control before any marker can be placed."
KRG_designate_breeding_reserves_effect_tt: "Authorizes a reserve and hatchery designation in one verified state, subject to its construction allocation."
KRG_train_handlers_and_veterinarians: "Train Handlers And Veterinarians"
KRG_train_handlers_and_veterinarians_desc: "Living shock forces need finite handlers, veterinarians, transport, and equipment."
KRG_train_handlers_and_veterinarians_effect_tt: "Mandates finite handler recruitment and veterinary support with manpower, equipment, trucks, and time costs."
KRG_build_the_transport_pens: "Build The Transport Pens"
KRG_build_the_transport_pens_desc: "Restored creatures cannot reach a front without secure pens, loading points, and a functioning reserve."
KRG_build_the_transport_pens_effect_tt: "Reconciles the carried project record and authorizes Paleogenetic Shock Pack recruitment and transport-pen construction."
KRG_drill_for_the_great_escape: "Drill For The Great Escape"
KRG_drill_for_the_great_escape_desc: "Every reserve must assume that containment can fail and civilians may stand in the path of an escape."
KRG_drill_for_the_great_escape_effect_tt: "Mandates escape response, evacuation, feed denial, and recapture operations with public counterplay."
KRG_the_dinosaur_host: "The Dinosaur Host"
KRG_the_dinosaur_host_desc: "Breeding cycles will remain bounded by feed, handlers, hatcheries, transport, and the live family cap."
KRG_the_dinosaur_host_effect_tt: "Reconciles the carried project record and authorizes Paleogenetic breeding under the creature force ceiling."
KRG_open_the_designed_organism_dossier: "Open The Designed Organism Dossier"
KRG_open_the_designed_organism_dossier_desc: "Designed organisms will keep their own vats, reagents, controls, failures, and countermeasures."
KRG_open_the_designed_organism_dossier_effect_tt: "Authorizes the Xenobiological Synthesis category and preserves its ledger apart from Paleogenetics."
KRG_build_the_vat_complexes: "Build The Vat Complexes"
KRG_build_the_vat_complexes_desc: "A vat complex must be powered, medically supplied, contained, and fully resourced before growth can begin."
KRG_build_the_vat_complexes_effect_tt: "Mandates targeted vat and medical-fabrication construction using power, reagents, factories, and containment."
KRG_lock_the_control_channel: "Lock The Control Channel"
KRG_lock_the_control_channel_desc: "Chemical, neural, machine-linked, and researched control cannot coexist without contradiction."
KRG_lock_the_control_channel_effect_tt: "Requires one exclusive control-mode proceeding when none exists. An established coherent mode already satisfies the mandate."
KRG_seal_the_containment_cells: "Seal The Containment Cells"
KRG_seal_the_containment_cells_desc: "Deployment requires functioning vats, a real control center, and sealed cells in controlled territory."
KRG_seal_the_containment_cells_effect_tt: "Reconciles the carried project record and authorizes Xenobiological Assault Organism recruitment while its facility and control requirements hold."
KRG_red_team_the_autonomous_nest: "Red-Team the Autonomous Nest"
KRG_red_team_the_autonomous_nest_desc: "The chosen control method must survive deliberate failure tests before production expands."
KRG_red_team_the_autonomous_nest_effect_tt: "Mandates control-channel countertests, nest containment, and mode-specific recovery operations."
KRG_the_engineered_legion: "The Engineered Legion"
KRG_the_engineered_legion_desc: "Engineered organisms will remain bounded by reagents, power, containment, and the live family cap."
KRG_the_engineered_legion_effect_tt: "Reconciles the carried project record and authorizes Xenobiological production under its own force ceiling and supply system."
KRG_recover_the_transit_logs: "Recover The Transit Logs"
KRG_recover_the_transit_logs_desc: "Only inherited or rebuilt terminals will enter the audit. A prototype record alone cannot move an army."
KRG_recover_the_transit_logs_effect_tt: "Authorizes the terminal audit category and records the surviving transit network."
KRG_harden_the_terminal_rings: "Harden The Terminal Rings"
KRG_harden_the_terminal_rings_desc: "Each terminal needs fortification, independent shutdown, and dual keys before it can support operations."
KRG_harden_the_terminal_rings_effect_tt: "Authorizes terminal fortification, shutdown, and dual-key procedures. Power loss still closes the link."
KRG_link_the_depot_network: "Link The Depot Network"
KRG_link_the_depot_network_desc: "A terminal link can move existing equipment and specialists between two controlled sites, never create them."
KRG_link_the_depot_network_effect_tt: "Mandates bounded terminal transit and supply links between at least two verified terminals."
KRG_close_the_transit_breach: "Close The Transit Breach"
KRG_close_the_transit_breach_desc: "A compromised terminal must be closed even when doing so isolates a distant laboratory."
KRG_close_the_transit_breach_effect_tt: "Mandates breach defense, archive destruction, and compromised-terminal closure. A resolved breach may bypass this focus."
KRG_the_strategic_transit_corps: "The Strategic Transit Corps"
KRG_the_strategic_transit_corps_desc: "Strategic insertion requires a supplied, defended terminal network and a real formation to move."
KRG_the_strategic_transit_corps_effect_tt: "Reconciles the carried project record and authorizes portal recruitment and strategic insertion missions under the portal force ceiling."
KRG_authenticate_the_temporal_ledger: "Authenticate The Temporal Ledger"
KRG_authenticate_the_temporal_ledger_desc: "Anchor discovery is not authentication. Records, witnesses, and immutable use history must agree."
KRG_authenticate_the_temporal_ledger_effect_tt: "Mandates temporal record authentication and anchor-discovery missions without creating or restoring an anchor."
KRG_fortify_the_anchor: "Fortify The Anchor"
KRG_fortify_the_anchor_desc: "An authenticated anchor is irreplaceable and must be defended in its actual state."
KRG_fortify_the_anchor_effect_tt: "Adds one land fort and one anti-air level to the valid owned anchor. Mandates independent observer teams."
KRG_found_the_synchronization_bureau: "Found The Synchronization Bureau"
KRG_found_the_synchronization_bureau_desc: "The bureau will publish capacity, debt, scars, and used targets without refreshing any of them."
KRG_found_the_synchronization_bureau_effect_tt: "Authorizes temporal ledger readouts and calibration. Calibration consumes resources and accrues debt without increasing maximum synchronization."
KRG_issue_bounded_future_warnings: "Issue Bounded Future Warnings"
KRG_issue_bounded_future_warnings_desc: "A future warning belongs to one named crisis and can be used only once."
KRG_issue_bounded_future_warnings_effect_tt: "Authorizes one-target warning operations that consume synchronization, incur temporal debt, and leave an immutable use record."
KRG_accept_the_stabilization_window: "Accept The Stabilization Window"
KRG_accept_the_stabilization_window_desc: "The state can reduce temporal debt only by accepting a long period of empty synchronization and exposed facilities."
KRG_accept_the_stabilization_window_effect_tt: "Begins stabilization when eligible, or recognizes a prior completed process, and authorizes its timed supervision mission."
KRG_the_continuity_guard: "The Continuity Guard"
KRG_the_continuity_guard_desc: "The Continuity Guard may answer a named strategic disaster, never routine battlefield disappointment."
KRG_the_continuity_guard_effect_tt: "Reconciles the carried project record and authorizes Continuity Guard and recovery operations while debt, anchor, and force-ceiling requirements hold."
KRG_build_an_independent_reactor_grid: "Build An Independent Reactor Grid"
KRG_build_an_independent_reactor_grid_desc: "Power-intensive projects need their own verified reactor sites, materials, and contamination response."
KRG_build_an_independent_reactor_grid_effect_tt: "Authorizes a targeted reactor grid, contamination response, and rare-material procurement program."
KRG_prepare_strategic_delivery_architecture: "Prepare Strategic Delivery Architecture"
KRG_prepare_strategic_delivery_architecture_desc: "A strategic payload is meaningless without hardened command, authenticated delivery, and counterintelligence."
KRG_prepare_strategic_delivery_architecture_effect_tt: "Authorizes delivery-network design, command-node sites, and missile or portal counterintelligence."
KRG_train_the_interface_specialists: "Train The Interface Specialists"
KRG_train_the_interface_specialists_desc: "Artifact systems demand finite specialists and a chamber that can be isolated when the interface fails."
KRG_train_the_interface_specialists_effect_tt: "Mandates specialist training, interface security, and breach response at a verified chamber."
KRG_arm_the_exotic_guard: "Arm The Exotic Guard"
KRG_arm_the_exotic_guard_desc: "Exotic equipment is too rare for attritional policing and too dangerous for an unverified interface."
KRG_arm_the_exotic_guard_effect_tt: "Reconciles the carried project record and authorizes Exotic Guard production under its force ceiling and material burden."
KRG_make_containment_the_first_doctrine: "Make Containment The First Doctrine"
KRG_make_containment_the_first_doctrine_desc: "Biological capability begins with quarantine, vaccine work, and authenticated custody, not release."
KRG_make_containment_the_first_doctrine_effect_tt: "Authorizes quarantine, vaccination, safe seizure, and delivery-authentication actions through the biological containment system."
KRG_authorize_agents_of_last_resort: "Authorize Agents Of Last Resort"
KRG_authorize_agents_of_last_resort_desc: "Only a contained, authenticated weaponization program may prepare agents for existential use."
KRG_authorize_agents_of_last_resort_effect_tt: "Authorizes stockpile, raid, and last-resort procedures whose use records deaths, contamination, condemnation, retaliation, and international threat."
KRG_a_state_without_friends: "A State Without Friends"
KRG_a_state_without_friends_desc: "Recognition, patronage, fear, and containment will be tracked actor by actor rather than reduced to one opinion score."
KRG_a_state_without_friends_effect_tt: "Authorizes the foreign-interest registry, recognition and containment reactions, and invalid-target cleanup."
KRG_found_the_foreign_intelligence_bureau: "Found The Foreign Intelligence Bureau"
KRG_found_the_foreign_intelligence_bureau_desc: "The state needs an external service able to defend facilities and read the projects forming against it."
KRG_found_the_foreign_intelligence_bureau_effect_tt: "Creates an agency when the relevant expansion is active and none exists, then adds Diplomatic Training when available. Mandates bounded foreign operations."
KRG_settle_accounts_with_the_former_host: "Settle Accounts With The Former Host"
KRG_settle_accounts_with_the_former_host_desc: "Charter, rebellion, enclave, and takeover each leave a different account to settle with the former host."
KRG_settle_accounts_with_the_former_host_effect_tt: "Mandates the origin-specific former-host settlement surface using the dedicated persistent former-host target."
KRG_open_the_scientific_commonwealth: "Open The Scientific Commonwealth"
KRG_open_the_scientific_commonwealth_desc: "Recognition will be earned through voluntary compacts, asylum, inspection, and rights guarantees."
KRG_open_the_scientific_commonwealth_effect_tt: "Calls the international scientific-center transition and mandates voluntary scientific compacts."
KRG_build_the_submission_network: "Build The Submission Network"
KRG_build_the_submission_network_desc: "A strong laboratory state can demand submission, but refusal must retain its diplomatic, military, and supply consequences."
KRG_build_the_submission_network_effect_tt: "Calls the autonomous research-network transition and mandates ultimatum and protectorate procedures with coalition responses."
KRG_secure_the_laboratory_corridors: "Secure The Laboratory Corridors"
KRG_secure_the_laboratory_corridors_desc: "Expansion will follow actual links between facilities, ports, rail hubs, and the capital."
KRG_secure_the_laboratory_corridors_effect_tt: "Restricts expansion to one targeted corridor negotiation or limited conflict at a time. Neighboring regions remain outside the claim."
KRG_recover_the_stolen_facilities: "Recover The Stolen Facilities"
KRG_recover_the_stolen_facilities_desc: "Every recovery claim must point to evidence naming a facility or archive state."
KRG_recover_the_stolen_facilities_effect_tt: "Mandates one evidence-backed recovery target with archive capture and safe dismantlement procedures."
KRG_integrate_by_project: "Integrate By Project"
KRG_integrate_by_project_desc: "Occupation will be integrated through the institutions and project burdens capable of administering each territory."
KRG_integrate_by_project_effect_tt: "Mandates route-specific integration only with verified supply and administration. Cores still require time and compliance."
KRG_the_continental_laboratory_network: "The Continental Laboratory Network"
KRG_the_continental_laboratory_network_desc: "A continental network exists only when its facilities are integrated, supplied, and administratively connected."
KRG_the_continental_laboratory_network_effect_tt: "Registers the supplied continental network and authorizes a global-administration score. Sets no global threat by itself."
KRG_evolution_four_sovereign_science: "Evolution IV: Sovereign Science"
KRG_evolution_four_sovereign_science_desc: "Evolution IV places sovereign science on a global stage where every weapon, corridor, and submission demand can create opposition."
KRG_evolution_four_sovereign_science_effect_tt: "Mandates the global program, world-route decisions, scientist and facility targets, coalition counterplay, and threat refresh from real actions only."
KRG_commit_to_the_laboratory_world: "Commit To The Laboratory World"
KRG_commit_to_the_laboratory_world_desc: "The Laboratory World doctrine demands overwhelming control, integration, administration, submission, and verified nonterminal singularity status."
KRG_commit_to_the_laboratory_world_effect_tt: "Commits the state to the Laboratory World and authorizes its long submission, integration, and administration program. The program must still be completed in play."
KRG_commit_to_the_strategic_singularity: "Commit To The Strategic Singularity"
KRG_commit_to_the_strategic_singularity_desc: "The Strategic Singularity doctrine begins a long component race whose sites, power links, arming, raids, and surrender choices remain exposed to the world."
KRG_commit_to_the_strategic_singularity_effect_tt: "Records the Singularity mandate. Existing theory permits immediate commitment. Otherwise the program waits for theory to finish before its construction race can begin."
brilliant_scientist_focus_hidden_improvised_administration: "Improvised Laboratory State Mechanics"
brilliant_scientist_focus_hidden_improvised_administration_desc: "The laboratory state still relies on improvised offices and emergency authority."
brilliant_scientist_focus_hidden_civic_administration: "Civic Administration Mechanics"
brilliant_scientist_focus_hidden_civic_administration_desc: "Elected institutions bind scientific authority to civic law."
brilliant_scientist_focus_hidden_machine_administration: "Machine Administration Mechanics"
brilliant_scientist_focus_hidden_machine_administration_desc: "Machine nodes coordinate production and administration through the state network."
brilliant_scientist_focus_hidden_replication_administration: "Replication Administration Mechanics"
brilliant_scientist_focus_hidden_replication_administration_desc: "Replication institutions govern maturation, population, and public service."
brilliant_scientist_focus_hidden_synthesis_administration: "Synthesis Administration Mechanics"
brilliant_scientist_focus_hidden_synthesis_administration_desc: "Advanced project institutions coordinate government at a substantial facility burden."
brilliant_scientist_focus_hidden_sovereign_directorate_administration: "Sovereign Directorate Mechanics"
brilliant_scientist_focus_hidden_sovereign_directorate_administration_desc: "Kruger's personal authority accelerates decisions while deepening foreign suspicion."
brilliant_scientist_focus_hidden_laboratory_feudalism: "Laboratory Feudalism Mechanics"
brilliant_scientist_focus_hidden_laboratory_feudalism_desc: "Competing laboratories treat the state as a collection of private domains."
brilliant_scientist_focus_hidden_inherited_portfolio: "Inherited Portfolio Mechanics"
brilliant_scientist_focus_hidden_inherited_portfolio_desc: "Powerful inherited projects remain costly, fragmented, and difficult to standardize."
brilliant_scientist_focus_hidden_documented_portfolio: "Documented Portfolio Mechanics"
brilliant_scientist_focus_hidden_documented_portfolio_desc: "Every carried project has a documented stage, facility, and maintenance burden."
brilliant_scientist_focus_hidden_weaponized_portfolio: "Weaponized Portfolio Mechanics"
brilliant_scientist_focus_hidden_weaponized_portfolio_desc: "The project portfolio is organized around repeatable military output."
brilliant_scientist_focus_hidden_fragmented_portfolio: "Fragmented Portfolio Mechanics"
brilliant_scientist_focus_hidden_fragmented_portfolio_desc: "Incompatible ledgers and rival laboratories obstruct reliable project work."
brilliant_scientist_focus_hidden_scientific_exodus: "Scientific Exodus Mechanics"
brilliant_scientist_focus_hidden_scientific_exodus_desc: "Scientists and assistants continue to leave an isolated and unstable state."
brilliant_scientist_focus_hidden_international_center: "International Center Mechanics"
brilliant_scientist_focus_hidden_international_center_desc: "An inspected international center attracts researchers and diplomatic exchange."
brilliant_scientist_focus_hidden_autonomous_network: "Autonomous Network Mechanics"
brilliant_scientist_focus_hidden_autonomous_network_desc: "A hardened autonomous network protects research from foreign pressure."
brilliant_scientist_focus_hidden_intellectual_isolation: "Intellectual Isolation Mechanics"
brilliant_scientist_focus_hidden_intellectual_isolation_desc: "The state has lost the trust and exchange needed to sustain scientific life."
