rhi_divided_river_authority: "Divided River Authority"
rhi_divided_river_authority_desc: "Rail dispatchers, municipal offices, factory guards, and bridge commands issue competing orders along the same river."
rhi_rhine_civic_industrial_compact: "Rhine Civic-Industrial Compact"
rhi_rhine_civic_industrial_compact_desc: "A common civil service coordinates the corridor's factories, railways, ports, and river crossings."
rhi_constitutional_river_compact: "Constitutional River Compact"
rhi_constitutional_river_compact_desc: "Municipal delegates and industrial districts govern the Rhine through a public charter and elected assembly."
rhi_workers_rhine_charter: "Workers' Rhine Charter"
rhi_workers_rhine_charter_desc: "Factory councils bind production, transport, and social provision into a common workers' settlement."
rhi_emergency_corridor_command: "Emergency Corridor Command"
rhi_emergency_corridor_command_desc: "The river command can secure the arteries quickly, but every emergency requisition burdens civilian life."
rhi_patron_transit_mandate: "Patron Transit Mandate"
rhi_patron_transit_mandate_desc: "Foreign credit and protected transit accelerate recovery while narrowing the government's freedom of action."

bay_disputed_state_inheritance: "Disputed State Inheritance"
bay_disputed_state_inheritance_desc: "District treasuries, court property, municipal police, and mountain commands all claim a different part of the Bavarian state."
bay_estates_and_districts_settlement: "Estates and Districts Settlement"
bay_estates_and_districts_settlement_desc: "The districts, estates, and security commands accept one treasury and one chain of authority."
bay_constitutional_state_compact: "Constitutional State Compact"
bay_constitutional_state_compact_desc: "A restored Landtag reconciles regional liberties with a durable Bavarian administration."
bay_workers_district_charter: "Workers' District Charter"
bay_workers_district_charter_desc: "District councils mobilize workshops and municipalities, even as the mountain commands distrust their reach."
bay_restoration_court_settlement: "Restoration Court Settlement"
bay_restoration_court_settlement_desc: "The crown, estates, and districts share a conservative settlement rooted in Bavarian legitimacy."
bay_emergency_mountain_guardians: "Emergency Mountain Guardians"
bay_emergency_mountain_guardians_desc: "The guardians secure passes and depots, but military administration consumes civilian resources."

independence_wave_rhi_keep_rhine_arteries_open: "Keep the Rhine Arteries Open"
independence_wave_rhi_keep_rhine_arteries_open_desc: "The founding government has 420 days to raise Corridor Authority to 65. Failure will deepen instability and weaken the state's administrative, diplomatic, and military position."
independence_wave_rhi_restore_bridge_dispatch: "Restore Bridge and Rail Dispatch"
independence_wave_rhi_restore_bridge_dispatch_desc: "Reopen the central dispatch office and place bridge schedules under civil authority. Raises Corridor Authority by 20 and improves administrative capacity."
independence_wave_rhi_integrate_factory_rail_guards: "Integrate the Factory and Rail Guards"
independence_wave_rhi_integrate_factory_rail_guards_desc: "Fold industrial guards and defecting railway security units into a common chain of command. Raises Corridor Authority by 20 and improves security."
independence_wave_rhi_settle_host_customs_ledgers: "Settle the Customs and Property Ledgers"
independence_wave_rhi_settle_host_customs_ledgers_desc: "Negotiate the inherited customs accounts, transport debts, and disputed property with our former host. Raises Corridor Authority by 10 and lowers bilateral claims and hostility."
independence_wave_rhi_secure_river_crossings: "Secure the River Crossings"
independence_wave_rhi_secure_river_crossings_desc: "Establish guarded crossing schedules and reserve posts around the capital corridor. Raises Corridor Authority by 15 and improves security."
independence_wave_rhi_ratify_constitutional_charter: "Ratify the Constitutional River Charter"
independence_wave_rhi_ratify_constitutional_charter_desc: "Give municipalities and industrial districts an elected assembly. The settlement strengthens legitimacy and administration."
independence_wave_rhi_entrust_workers_councils: "Entrust the Workers' Councils"
independence_wave_rhi_entrust_workers_councils_desc: "Place production and transport under a workers' charter. Josef Friedrich Matthes will lead if he remains in Rhenish service; otherwise the institutional directorate carries the charter."
independence_wave_rhi_establish_corridor_command: "Establish the Corridor Command"
independence_wave_rhi_establish_corridor_command_desc: "Give the river commandant emergency authority over depots, crossings, and defecting formations."
independence_wave_rhi_accept_patron_transit_mandate: "Accept a Patron Transit Mandate"
independence_wave_rhi_accept_patron_transit_mandate_desc: "Trade autonomy over transit policy for credit, protection, and access to foreign markets."
independence_wave_rhi_codify_durable_independence: "Codify Durable Rhenish Independence"
independence_wave_rhi_codify_durable_independence_desc: "Turn the founding settlement into permanent institutions capable of surviving beyond the emergency."
independence_wave_rhi_survey_rhine_federation_corridor: "Survey the Rhine Federation Corridor"
independence_wave_rhi_survey_rhine_federation_corridor_desc: "Map the municipal, industrial, and transport commitments required for a Rhine Federation."
independence_wave_rhi_convene_rhine_congress: "Convene the Rhine Congress"
independence_wave_rhi_convene_rhine_congress_desc: "Bring Rhenish municipal, industrial, and security delegates together to reconcile the corridor charter before any federation negotiations begin."
independence_wave_rhi_charter_network_transit: "Charter Network Transit"
independence_wave_rhi_charter_network_transit_desc: "Guarantee rail and river access to fellow independence states, gaining network standing and strengthening the common diplomatic position."
independence_wave_rhi_seize_corridor_authorities: "Seize the Corridor Authorities"
independence_wave_rhi_seize_corridor_authorities_desc: "Invoke the regional high-chaos mandate to absorb local river administrations by force without overturning the settled government. Security and Corridor Authority rise sharply, while legitimacy, recognition, and stability suffer."

independence_wave_bay_hold_the_state_together: "Hold the Bavarian State Together"
independence_wave_bay_hold_the_state_together_desc: "The founding government has 480 days to raise both Civic Settlement and Mountain Security to 60. Failure will deepen the contest between court, districts, and guardians."
independence_wave_bay_reconcile_district_treasuries: "Reconcile the District Treasuries"
independence_wave_bay_reconcile_district_treasuries_desc: "Unify municipal accounts and place district revenues under a common treasury. Raises Civic Settlement by 20 and improves administrative capacity."
independence_wave_bay_organize_mountain_passes: "Organize the Mountain Passes"
independence_wave_bay_organize_mountain_passes_desc: "Assign pass guards, supply depots, and frontier patrols to one command. Raises Mountain Security by 20."
independence_wave_bay_settle_wittelsbach_host_ledgers: "Settle the Crown and State Ledgers"
independence_wave_bay_settle_wittelsbach_host_ledgers_desc: "Negotiate court property, state debts, and district obligations with our former host. Raises Civic Settlement by 15 and lowers bilateral claims and hostility."
independence_wave_bay_integrate_mountain_companies: "Integrate the Mountain Companies"
independence_wave_bay_integrate_mountain_companies_desc: "Fold defectors and local companies into a professional Bavarian command. Raises Civic Settlement by 20 and Mountain Security by 20."
independence_wave_bay_ratify_constitutional_compact: "Ratify the Constitutional State Compact"
independence_wave_bay_ratify_constitutional_compact_desc: "Reopen representative government and balance district liberties with a central civil service. Raises Civic Settlement by 15 and Mountain Security by 10."
independence_wave_bay_entrust_workers_districts: "Entrust the Workers' Districts"
independence_wave_bay_entrust_workers_districts_desc: "Let workers' councils coordinate municipalities and production. Civic Settlement rises by 20, but Mountain Security falls by 10."
independence_wave_bay_restore_the_crown: "Restore the Bavarian Crown"
independence_wave_bay_restore_the_crown_desc: "Reconcile the court, estates, and districts. Rupprecht leads only while he remains in Bavarian service and has not entered German service; in his absence, the State Council retains the regency. Civic Settlement rises by 15 while Mountain Security falls by 10."
independence_wave_bay_establish_mountain_guardians: "Establish the Mountain Guardians"
independence_wave_bay_establish_mountain_guardians_desc: "Give the mountain commandant emergency authority over passes and depots. Mountain Security rises by 20 while Civic Settlement falls by 10."
independence_wave_bay_codify_durable_independence: "Codify Durable Bavarian Independence"
independence_wave_bay_codify_durable_independence_desc: "Bind the districts, estates, and guardians into permanent institutions capable of surviving beyond the founding emergency."
independence_wave_bay_choose_south_german_restoration: "Choose a South German Restoration"
independence_wave_bay_choose_south_german_restoration_desc: "Define Bavarian ambition around a South German restoration and renounce the claim to reunify every German land under one state."
independence_wave_bay_convene_south_german_estates: "Convene the South German Estates"
independence_wave_bay_convene_south_german_estates_desc: "Invite southern courts, districts, and municipal delegates to recognize a Bavarian-led restoration settlement without claiming every German land."
independence_wave_bay_negotiate_alpine_supply_accord: "Negotiate an Alpine Supply Accord"
independence_wave_bay_negotiate_alpine_supply_accord_desc: "Guarantee pass and rail access to fellow independence states, gaining network standing and strengthening the common diplomatic position."
independence_wave_bay_seize_south_german_protectorates: "Seize South German Protectorates"
independence_wave_bay_seize_south_german_protectorates_desc: "Invoke the regional high-chaos mandate to impose Bavarian security networks beyond the passes without overturning the settled government. Mountain Security rises sharply, while Civic Settlement, legitimacy, recognition, and stability suffer."

independence_wave_rhi_corridor_project_effect_tt: "The project strengthens Corridor Authority and advances the relevant administrative or security ledger."
independence_wave_bay_state_project_effect_tt: "The project changes Civic Settlement and Mountain Security and advances the relevant state ledger."
independence_wave_rhine_bavaria_project_failure_effect_tt: "The unresolved project weakens the founding settlement and raises instability."
independence_wave_rhine_bavaria_host_settlement_effect_tt: "Inherited property, obligation, border, and hostility ledgers with the former host are reduced."
independence_wave_rhi_route_government_effect_tt: "The selected Rhenish government takes office and its route settlement replaces any other package route spirit."
independence_wave_bay_route_government_effect_tt: "The selected Bavarian government takes office and its route settlement replaces any other package route spirit."
independence_wave_rhi_rhine_congress_effect_tt: "If the Rhenish package and capital remain secure, the congress records an agreed corridor charter, advances network standing, and opens the delegation mandate. A Rhine Federation still requires the separate shared formation congress and every member's consent."
independence_wave_rhi_durable_independence_effect_tt: "Rhineland gains a major legitimacy, recognition, capacity, and security settlement while instability falls."
independence_wave_rhi_corridor_survey_effect_tt: "The Rhine Federation corridor survey is completed and the diplomatic ledger advances."
independence_wave_rhi_high_chaos_effect_tt: "Corridor Authority and security rise decisively; legitimacy, recognition, and stability deteriorate. The existing government settlement remains in force."
independence_wave_bay_durable_independence_effect_tt: "Bavaria gains a major legitimacy, recognition, capacity, and security settlement while instability falls."
independence_wave_bay_high_chaos_effect_tt: "Mountain Security rises decisively; Civic Settlement, legitimacy, recognition, and stability deteriorate. The existing government settlement remains in force."
independence_wave_rhine_bavaria_network_project_effect_tt: "Network standing rises and the country gains a broad diplomatic, administrative, and security settlement."
independence_wave_bay_south_german_choice_effect_tt: "South German restoration becomes the state ambition and the wider German reunification claim is renounced."
independence_wave_bay_south_german_estates_effect_tt: "The South German estates settlement strengthens Civic Settlement, Mountain Security, and Independence Wave network standing."

independence_wave_rhi_establish_corridor_authority_focus: "Charter the Corridor Authority"
independence_wave_rhi_establish_corridor_authority_focus_desc: "The river cannot be governed by a contest of municipal warrants, bridge orders, and factory passes. A public Corridor Authority will bind those offices to one accountable charter."
independence_wave_rhi_establish_corridor_authority_tt: "Raises Corridor Authority by §G10§!. Founding legitimacy, administrative capacity, and security improve while instability falls."
independence_wave_rhi_unify_rail_dispatch_focus: "Unify Rhine Rail Dispatch"
independence_wave_rhi_unify_rail_dispatch_focus_desc: "A single dispatch board will coordinate freight priority, bridge clearance, repair gangs, and passenger traffic from the Ruhr approaches to the river crossings."
independence_wave_rhi_unify_rail_dispatch_tt: "Raises Corridor Authority by §G10§!, adds §G1 Infrastructure§! to the anchor state, and grants one §G50%§! Industry research bonus. Administrative capacity improves and instability falls."
independence_wave_rhi_arm_customs_guard_focus: "Arm the River Customs Guard"
independence_wave_rhi_arm_customs_guard_focus_desc: "Customs inspectors need disciplined escorts that can distinguish smugglers from commuters and saboteurs from factory guards. The new corps will answer to civil warrants and corridor law."
independence_wave_rhi_arm_customs_guard_tt: "Raises Corridor Authority by §G10§!, grants §G15 Army Experience§! and §G15 Command Power§!, and improves the security ledger."
independence_wave_rhi_secure_industrial_belt_focus: "Secure the Rhine Industrial Belt"
independence_wave_rhi_secure_industrial_belt_focus_desc: "Rail schedules, power contracts, and plant security must serve one industrial plan. The corridor will protect productive work without surrendering its factories to private militias."
independence_wave_rhi_secure_industrial_belt_tt: "Raises Corridor Authority by §G10§! and adds §G1 Civilian Factory§! with a matching building slot to the anchor state. Administrative capacity improves and instability falls."
independence_wave_rhi_ratify_host_transit_compact_focus: "Ratify the Former Host Transit Compact"
independence_wave_rhi_ratify_host_transit_compact_focus_desc: "The former host still holds ledgers, creditors, and routes tied to our river economy. A transit compact can settle those obligations, though demobilized checkpoints will narrow our immediate security margin."
independence_wave_rhi_ratify_host_transit_compact_tt: "Raises Corridor Authority by §G10§! and settles former-host property, obligation, border, and hostility ledgers. Legitimacy, recognition, and capacity improve. Security falls by §R5§! and War Support falls by §R5%§!."
independence_wave_rhi_proclaim_neutral_corridor_focus: "Proclaim the Neutral Rhine Corridor"
independence_wave_rhi_proclaim_neutral_corridor_focus_desc: "The corridor can refuse every patron's military timetable and guarantee passage under its own guarded neutrality. Domestic confidence will rise even if foreign chancelleries doubt the pledge."
independence_wave_rhi_proclaim_neutral_corridor_tt: "Raises Corridor Authority by §G10§!, Stability by §G5%§!, and security by §G10§!. Recognition falls by §R5§! while legitimacy, capacity, and domestic order improve."
independence_wave_rhi_charter_network_transit_office_focus: "Charter the Network Transit Office"
independence_wave_rhi_charter_network_transit_office_focus_desc: "Fellow independence states need reliable freight windows, neutral arbitration, and a corridor desk that will answer their telegrams before the next border closes."
independence_wave_rhi_charter_network_transit_office_tt: "Raises Corridor Authority by §G5§! and improves network standing, league cooperation, recognition, and administrative capacity."
independence_wave_rhi_authorize_form04_delegation_focus: "Authorize the Rhine Federation Delegation"
independence_wave_rhi_authorize_form04_delegation_focus_desc: "With the Rhine Congress concluded, the Corridor Authority can send an instructed delegation to carry its municipal, customs, and security terms into the Rhine Federation negotiations."
independence_wave_rhi_authorize_form04_delegation_tt: "Requires a completed Rhine Congress. Raises Corridor Authority by §G5§!, records Rhenish delegation readiness, opens Rhine Federation discovery, and improves network and ambition ledgers."

independence_wave_bay_broker_civic_settlement_focus: "Broker the Civic Settlement"
independence_wave_bay_broker_civic_settlement_focus_desc: "District mayors, civil servants, estates, and veterans will recognize a Bavarian state only if each sees a lawful place within it. The first settlement must join civic consent to defensible authority."
independence_wave_bay_broker_civic_settlement_tt: "Raises Civic Settlement by §G10§! and Mountain Security by §G5§!. Founding legitimacy, capacity, and security improve while instability falls."
independence_wave_bay_reconcile_landesbank_accounts_focus: "Reconcile the Landesbank Accounts"
independence_wave_bay_reconcile_landesbank_accounts_focus_desc: "District notes, court deposits, railway bonds, and municipal arrears must pass through one audited settlement. The Landesbank will finance reconstruction under public rules."
independence_wave_bay_reconcile_landesbank_accounts_tt: "Raises Civic Settlement by §G15§!, adds §G1 Civilian Factory§! with a matching building slot to the anchor state, and grants one §G50%§! Industry research bonus."
independence_wave_bay_bind_rail_and_pass_authorities_focus: "Bind Rail and Pass Authorities"
independence_wave_bay_bind_rail_and_pass_authorities_focus_desc: "Munich's timetables and the mountain commands cannot keep separate maps. A joint authority will coordinate rail repair, pass patrols, reserve depots, and winter supply."
independence_wave_bay_bind_rail_and_pass_authorities_tt: "Raises Mountain Security by §G15§!, adds §G1 Infrastructure§! to the anchor state, and grants §G15 Army Experience§! and §G15 Command Power§!."
independence_wave_bay_seat_landtag_and_court_focus: "Seat the Landtag and Court"
independence_wave_bay_seat_landtag_and_court_focus_desc: "A public compact between the Landtag, districts, and court can anchor civil legitimacy. The guardians will yield some emergency discretion in return for lawful appropriations and review."
independence_wave_bay_seat_landtag_and_court_tt: "Raises Civic Settlement by §G15§! and Stability by §G5%§!. Mountain Security falls by §R10§! and War Support falls by §R5%§!."
independence_wave_bay_entrust_mountain_guardians_focus: "Entrust the Mountain Guardians"
independence_wave_bay_entrust_mountain_guardians_focus_desc: "The pass commanders argue that no constitution can survive an undefended railway or an open mountain depot. Their mandate will harden the frontier at a visible civic cost."
independence_wave_bay_entrust_mountain_guardians_tt: "Raises Mountain Security by §G15§! and War Support by §G5%§!. Civic Settlement falls by §R10§! and Stability falls by §R5%§!."
independence_wave_bay_open_alpine_network_office_focus: "Open the Alpine Network Office"
independence_wave_bay_open_alpine_network_office_focus_desc: "A permanent office will coordinate freight guarantees, pass clearances, emergency stores, and arbitration with the other states born from the independence wave."
independence_wave_bay_open_alpine_network_office_tt: "Raises Civic Settlement and Mountain Security by §G5§! each and improves network standing, league cooperation, recognition, and capacity."
independence_wave_bay_convene_south_german_settlement_focus: "Convene the South German Settlement"
independence_wave_bay_convene_south_german_settlement_focus_desc: "Southern courts, districts, and cities can join a Bavarian-led settlement without reviving a claim over every German land. Their compact will rest on consent, pass access, and shared administration."
independence_wave_bay_convene_south_german_settlement_tt: "Requires the South German estates settlement. Raises Civic Settlement and Mountain Security by §G10§! each and strengthens network and regional-ambition ledgers."
independence_wave_bay_ratify_german_host_compact_focus: "Ratify the German Host Compact"
independence_wave_bay_ratify_german_host_compact_focus_desc: "Bavaria can preserve the German host by recognizing a negotiated frontier, settling inherited accounts, and limiting its external program to sovereign cooperation rather than a competing German state."
independence_wave_bay_ratify_german_host_compact_tt: "Requires a living former host and no competing German claim. Raises Civic Settlement by §G10§! and Mountain Security by §G5§!, settles former-host ledgers, and improves legitimacy, recognition, and capacity."

chaosx.nr6.11.t: "Warrants at the River Gates"
chaosx.nr6.11.d: "Before the Corridor Authority can print a common customs schedule, municipal officers arrive at the bridges carrying old seals, factory passes, and contradictory orders. Some fear that surrendering those warrants will turn a public charter into another remote command. Rail dispatchers answer that a river divided by local vetoes will stop moving before the week is out."
chaosx.nr6.11.a: "Let the municipal seals stand until the charter is signed."
chaosx.nr6.11.a.tt: "Corridor Authority rises by 10. Legitimacy rises by 10. Recognition and Capacity rise by 5. Security and Instability fall by 5."
chaosx.nr6.11.b: "Put every gate under the Corridor Authority."
chaosx.nr6.11.b.tt: "Corridor Authority rises by 15. Capacity and Security rise by 10. Legitimacy and Recognition fall by 5. Instability rises by 5."

chaosx.nr6.12.t: "The First Statute of the Corridor"
chaosx.nr6.12.d: "The new government inherits a corridor already ruled by timetables, emergency warrants, and armed checkpoints. Its ministers demand enough discretion to prevent another stoppage. Municipal delegates and workers' representatives insist that every decree be published and reviewable before temporary powers become permanent habits."
chaosx.nr6.12.a: "Bind the ministry to published review."
chaosx.nr6.12.a.tt: "Corridor Authority falls by 10. Legitimacy and Recognition rise by 10. Capacity rises by 5. Security and Instability fall by 5."
chaosx.nr6.12.b: "Grant the cabinet emergency decree authority."
chaosx.nr6.12.b.tt: "Corridor Authority rises by 15. Capacity and Security rise by 10. Legitimacy and Recognition fall by 5. Instability rises by 5."

chaosx.nr6.13.t: "The Mandate Carried Downriver"
chaosx.nr6.13.d: "The Rhine Congress has agreed that federation negotiations may begin, but not what its delegates may bind. City representatives demand a municipal veto over taxation, garrisons, and industrial directives. Transit officials warn that a delegation unable to guarantee a bridge schedule or freight corridor will carry the same old quarrels into every future congress."
chaosx.nr6.13.a: "Preserve a municipal veto over common mandates."
chaosx.nr6.13.a.tt: "Corridor Authority falls by 10. Legitimacy and Recognition rise by 10. Capacity, Security, and Instability fall by 5."
chaosx.nr6.13.b: "Give the delegates binding transit powers."
chaosx.nr6.13.b.tt: "Corridor Authority rises by 15. Recognition rises by 5. Capacity and Security rise by 10. Legitimacy falls by 5. Instability rises by 5."

chaosx.nr6.14.t: "Who Holds the District Seals?"
chaosx.nr6.14.d: "District treasurers, municipal police, estate clerks, and mountain officers all claim a lawful fragment of Bavaria's authority. The seals can be inventoried by the districts and reconciled in public, but the guardians warn that hostile agents will exploit every delay. Their alternative places clerks under armed supervision and turns the settlement into an emergency security operation."
chaosx.nr6.14.a: "Let each district inventory its own seals."
chaosx.nr6.14.a.tt: "Civic Settlement rises by 15 and Mountain Security falls by 10. Legitimacy rises by 10. Recognition and Capacity rise by 5. Security and Instability fall by 5."
chaosx.nr6.14.b: "Send the guardians with the treasury clerks."
chaosx.nr6.14.b.tt: "Civic Settlement falls by 10 and Mountain Security rises by 15. Capacity rises by 5. Security rises by 10. Legitimacy and Recognition fall by 5. Instability rises by 5."

chaosx.nr6.15.t: "The Government Takes Possession"
chaosx.nr6.15.d: "The route settlement has named a government, but the ministries still share rooms with district delegations and emergency commands. A published compact would define appropriations, review, and local jurisdiction. Centralizers argue that the founding crisis will outpace any arrangement that permits each district to delay a railway order or depot inspection."
chaosx.nr6.15.a: "Publish the district compact."
chaosx.nr6.15.a.tt: "Civic Settlement rises by 15 and Mountain Security falls by 10. Legitimacy and Recognition rise by 10. Capacity rises by 5. Security and Instability fall by 5."
chaosx.nr6.15.b: "Centralize the emergency apparatus."
chaosx.nr6.15.b.tt: "Civic Settlement falls by 10 and Mountain Security rises by 15. Capacity and Security rise by 10. Legitimacy and Recognition fall by 5. Instability rises by 5."

chaosx.nr6.16.t: "Terms Before the Southern Estates"
chaosx.nr6.16.d: "The southern delegates will sign a settlement only after Bavaria defines what leadership means. Courts and districts favor a compact that preserves consent and local administration. Security officers prefer executive guarantees over the railways, passes, and depots that would make the agreement defensible in a crisis."
chaosx.nr6.16.a: "Build the settlement from consenting estates."
chaosx.nr6.16.a.tt: "Civic Settlement rises by 15 and Mountain Security falls by 10. Legitimacy and Recognition rise by 10. Capacity rises by 5. Security and Instability fall by 5."
chaosx.nr6.16.b: "Issue Bavarian executive guarantees."
chaosx.nr6.16.b.tt: "Civic Settlement falls by 10 and Mountain Security rises by 15. Recognition rises by 5. Capacity and Security rise by 10. Legitimacy falls by 5. Instability rises by 5."

chaosx.nr6.17.t: "The Offices Left on Either Side"
chaosx.nr6.17.d: "The host compact has drawn a sovereign frontier without dissolving the accounts that cross it. District officials propose reciprocal offices for pensions, rail debts, property records, and municipal appeals. The guardians would keep only a narrow military liaison, accepting unresolved civilian disputes in exchange for a harder and more easily defended line."
chaosx.nr6.17.a: "Open reciprocal district offices."
chaosx.nr6.17.a.tt: "Civic Settlement rises by 10. Legitimacy and Recognition rise by 10. Capacity rises by 5. Security and Instability fall by 5. If the former host still exists, claims fall by 10, hostility and obligations fall by 15, property disputes fall by 25, border settlement rises by 15, and host pressure and reconquest fear fall by 10."
chaosx.nr6.17.b: "Keep only a military liaison."
chaosx.nr6.17.b.tt: "Civic Settlement falls by 10 and Mountain Security rises by 15. Capacity rises by 5. Security rises by 10. Legitimacy and Recognition fall by 5. Instability rises by 5."
