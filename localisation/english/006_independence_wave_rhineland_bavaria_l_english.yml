l_english:
independence_wave_rhi_corridor_category: "The Rhine Corridor Authority"
independence_wave_rhi_corridor_category_desc: "Corridor Authority: [?independence_wave_rhi_corridor_authority|0]/100\n\nThe river crossings, rail dispatch offices, factory guards, and customs ledgers must answer to one state. A value of 65 secures the founding settlement."
independence_wave_bay_state_category: "The Bavarian State Settlement"
independence_wave_bay_state_category_desc: "Civic Settlement: [?independence_wave_bay_civic_settlement|0]/100\nMountain Security: [?independence_wave_bay_mountain_security|0]/100\n\nBoth values must reach 60. Court, districts, and guardians will not accept a settlement that ignores either civil legitimacy or territorial defense."

