l_english:
chaosx.nr29.1.t: "Riches Found"

chaosx.nr29.2.t: "Riches Found!"
chaosx.nr29.2.d: "Survey crews have found vast gold reserves within our borders. The discovery will reshape our treasury and draw prospectors toward the new deposits."
chaosx.nr29.2.a: "Luck is ours!"

chaosx.news.31.t: "Vast Gold Reserves"
chaosx.news.31.d: "[FROM.GetName] has announced vast gold reserves inside its borders. Geological surveys and drilling confirm a deposit large enough to alter the country's place in the world gold market."
chaosx.news.31.a: "The reserves are enormous."
