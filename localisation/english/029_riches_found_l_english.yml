chaosx.nr29.1.t: "Riches Found"
chaosx.nr29.1.desc: "Surveyors in [riches_found_mine_state.GetName] have uncovered a deposit rich enough to draw miners, merchants, claimants, and thieves within days. Roads are filling with wagons, and the first camps already spread beyond the marked ground. We must decide who may work the find and who will answer for the settlement growing around it.\n\nThe surveyors report §Y[riches_found_mine_state.GetRichesFoundDepositProfile]§!: [riches_found_mine_state.GetRichesFoundDepositProfileNote]"
chaosx.nr29.1.desc.evolution_i: "Surveyors in [riches_found_mine_state.GetName] have uncovered a deposit rich enough to reshape the national budget. Ministries issue overlapping permits, party agents promise jobs, and intermediaries approach local officials as crews weigh the first shipment. We must decide who may work the find and who will answer for the settlement growing around it.\n\nThe surveyors report §Y[riches_found_mine_state.GetRichesFoundDepositProfile]§!: [riches_found_mine_state.GetRichesFoundDepositProfileNote]"
chaosx.nr29.1.desc.evolution_ii: "Surveyors in [riches_found_mine_state.GetName] have uncovered a deposit whose first specimens already pass from hand to hidden pocket. Guards search the survey crews, officials refuse to release the assay, and families follow the sample wagons as if ordinary stone carried a private claim upon them. We must decide who may work the find and who will answer for the settlement growing around it.\n\nThe surveyors report §Y[riches_found_mine_state.GetRichesFoundDepositProfile]§!: [riches_found_mine_state.GetRichesFoundDepositProfileNote]"
chaosx.nr29.1.desc.evolution_iii: "Surveyors in [riches_found_mine_state.GetName] have uncovered a deposit beneath workings absent from every map. Knocks answer the number of people underground, a sealed sample returns after removal, and the first ledger balances against no recorded sale. We must decide who may work the find and who will answer for the settlement growing around it.\n\nThe surveyors report §Y[riches_found_mine_state.GetRichesFoundDepositProfile]§!: [riches_found_mine_state.GetRichesFoundDepositProfileNote]"
chaosx.nr29.1.a: "Build a public fortune."
chaosx.nr29.1.a.tt: "Mine Development: §G+[?constant:riches_found_value.two|0]§!  Local Order: §G+[?constant:riches_found_value.two|0]§!  Revenue Legitimacy: §G+[?constant:riches_found_value.four|0]§!  Extraction Pressure: §G[?constant:riches_found_value.negative_one|0]§!"
chaosx.nr29.1.b: "Make the mine an instrument of state."
chaosx.nr29.1.b.tt: "Mine Development: §G+[?constant:riches_found_value.two|0]§!  Local Order: §G+[?constant:riches_found_value.one|0]§!  Revenue Legitimacy: §R[?constant:riches_found_value.negative_one|0]§!  Extraction Pressure: §R+[?constant:riches_found_value.four|0]§!"
chaosx.nr29.1.c: "Invite foreign investment."
chaosx.nr29.1.c.tt: "Mine Development: §G+[?constant:riches_found_value.four|0]§!  Local Order: §R[?constant:riches_found_value.negative_one|0]§!  Revenue Legitimacy: §G+[?constant:riches_found_value.one|0]§!  Extraction Pressure: §R+[?constant:riches_found_value.two|0]§!"
chaosx.nr29.1.d: "Place the mine under armed authority."
chaosx.nr29.1.d.tt: "Mine Development: §G+[?constant:riches_found_value.one|0]§!  Local Order: §G+[?constant:riches_found_value.four|0]§!  Revenue Legitimacy: §R[?constant:riches_found_value.negative_one|0]§!  Extraction Pressure: §R+[?constant:riches_found_value.four|0]§!"
chaosx.nr29.1.e: "Take everything the mountain will yield."
chaosx.nr29.1.e.tt: "Mine Development: §G+[?constant:riches_found_value.four|0]§!  Local Order: §R[?constant:riches_found_value.negative_one|0]§!  Revenue Legitimacy: §R[?constant:riches_found_value.negative_one|0]§!  Extraction Pressure: §R+[?constant:riches_found_value.four|0]§!"

chaosx.nr29.10.t: "The Rush Begins"
chaosx.nr29.10.d: "Prospectors have covered [This.GetName] with tents, timber sheds, and shallow pits. Merchants follow the pay wagons, and every new strike sends another crowd toward the workings."
chaosx.nr29.10.a: "The camp must be governed."
chaosx.nr29.20.t: "A Concession Takes Shape"
chaosx.nr29.20.d: "Survey stakes and guarded storehouses now mark the concession in [This.GetName]. Its managers promise deeper shafts and regular shipments, but local claimants fear that the richest ground is passing beyond their reach."
chaosx.nr29.20.a: "The contract will face scrutiny."
chaosx.nr29.30.t: "Raid on the Mine Road"
chaosx.nr29.30.d: "Armed raiders have struck the road from [This.GetName], scattering guards and carrying off part of a shipment. Pay crews refuse to travel until the route is protected."
chaosx.nr29.30.a: "Secure the road."
chaosx.nr29.40.t: "The Workings Collapse"
chaosx.nr29.40.d: "Timbers have failed beneath [This.GetName], burying galleries and cutting off crews underground. Rescue teams are entering unstable shafts as production stops across the district."
chaosx.nr29.40.a: "Recover the trapped crews and shore the mine."
chaosx.nr29.101.t: "The Resource Curse"
chaosx.nr29.101.d: "The mine's wealth has become the measure of every office, contract, and loyalty in [This.GetName]. Concession holders buy protection, officials trade access, and public revenue disappears before it reaches the treasury."
chaosx.nr29.101.a: "Break the hold of private fortunes."
chaosx.nr29.102.t: "Gold Disease"
chaosx.nr29.102.d: "A compulsive hunger for the mine's gold is consuming [This.GetName]. Workers hide fragments in their clothes, guards search one another, and families abandon food and wages to bargain for glittering scraps."
chaosx.nr29.102.a: "End the frenzy without feeding it."
chaosx.nr29.103.t: "Demons Beneath the Mine"
chaosx.nr29.103.d: "Deep crews in [This.GetName] have broken into chambers cut with black seams and scorched marks. Armed figures emerge from the opened depths to demand payment in labor, metal, and obedience, and they answer resistance with fire."
chaosx.nr29.103.a: "Seal the depths or confront what came through."
chaosx.nr29.111.t: "Gilded Sovereignty"
chaosx.nr29.111.d: "The concession now governs the mine district through its own guards, courts, stores, and pay offices. State orders reach [This.GetName] only when the chartered board chooses to obey them."
chaosx.nr29.111.a: "Recover public authority."
chaosx.nr29.112.t: "The Bottomless Account"
chaosx.nr29.112.d: "The agreement beneath [This.GetName] has become a ledger with no final payment. Each shipment settles one demand and opens another, binding officials and crews to obligations that grow with every profitable descent."
chaosx.nr29.112.a: "Close the account before it consumes the district."
chaosx.nr29.121.t: "The Curse Is Broken"
chaosx.nr29.121.d: "Audits, published terms, and a revenue settlement that reached the district have broken the hold of private fortunes over [This.GetName]. The mine still pays, but its wealth now passes through public hands."
chaosx.nr29.121.a: "Keep the reforms in place."
chaosx.nr29.122.t: "The Gold Fever Breaks"
chaosx.nr29.122.d: "Screened crews, rationed shifts, and a share of the revenue paid in the open have calmed the frenzy in [This.GetName]. The hidden hoards are gone and the shafts work again, but the district has not forgotten. Heavy extraction could wake the hunger again."
chaosx.nr29.122.a: "Watch the shafts."
chaosx.nr29.123.t: "The Depths Fall Silent"
chaosx.nr29.123.d.strict_limits: "Crews in [This.GetName] work only the upper galleries now, on short shifts behind guarded gates. Below the seals the chambers have fallen silent. No one can say whether what lived there was defeated or is only waiting."
chaosx.nr29.123.d.guarded_district: "The district around [This.GetName] stands empty behind a guarded cordon. Since the last families left, the knocking below has stopped. The guards are ordered never to go beneath the surface."
chaosx.nr29.123.d.monitored_closure: "Instruments watch the closed workings of [This.GetName] day and night. The readings have settled for the first time since the chambers opened, though the engineers still cannot explain what they measured before."
chaosx.nr29.123.d.protected_closure: "The entrances to [This.GetName] are closed, blessed, and kept by rites performed on schedule. The disturbances have ceased. Whether the rites did it, no one will say aloud."
chaosx.nr29.123.a: "Keep the watch."

