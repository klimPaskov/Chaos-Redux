riches_found.event_details.history: "Mine: [This.GetRichesFoundHistoryTargetName]\n\nA valuable deposit can transform an isolated district into a crowded mining settlement. Its controller must regulate claims, build transport and housing, settle the revenue, resist foreign capture, and keep extraction from outrunning public authority."
riches_found.event_details.description: "A valuable deposit can transform an isolated district into a crowded mining settlement. Its controller must regulate claims, build transport and housing, settle the revenue, resist foreign capture, and keep extraction from outrunning public authority."
riches_found.evolution.type: "Mine Evolution"
riches_found.evolution.unrecorded.summary: "No mine evolution has been recorded."
riches_found.evolution.summary: "The mine has crossed into a lasting crisis."
riches_found.evolution.unrecorded_1.title: "The Resource Curse"
riches_found.evolution.unrecorded_2.title: "Gold Disease"
riches_found.evolution.unrecorded_3.title: "Demons Beneath the Mine"
riches_found.evolution.stage_1.title: "The Resource Curse"
riches_found.evolution.stage_1.body: "Private fortunes capture the mine's contracts, guards, and public offices until the state depends on wealth it can no longer govern."
riches_found.evolution.stage_2.title: "Gold Disease"
riches_found.evolution.stage_2.body: "Compulsive desire for the mine's gold tears through the settlement, driving theft, hoarding, violence, and ruinous bargains."
riches_found.evolution.stage_3.title: "Demons Beneath the Mine"
riches_found.evolution.stage_3.body: "Deep excavation opens sealed chambers occupied by hostile infernal forces that demand tribute and control of the workings."

riches_found_idea_windfall_receipts: "Windfall Receipts"
riches_found_idea_windfall_receipts_desc: "The treasury records the mine as a promising but unsettled source of national revenue."
riches_found_idea_managed_revenue: "Managed Mineral Revenue"
riches_found_idea_managed_revenue_desc: "Audits, public accounts, and accepted settlement rules keep mine receipts inside the state budget."
riches_found_idea_resource_dependence: "Resource-Dependent Treasury"
riches_found_idea_resource_dependence_desc: "Public spending and political promises increasingly depend on the mine remaining open and profitable."
riches_found_idea_captured_revenue_state: "Captured Revenue State"
riches_found_idea_captured_revenue_state_desc: "Concession holders, private guards, and local patrons divert the mine's authority as readily as its wealth."
riches_found_idea_gold_sick_administration: "Gold-Sick Administration"
riches_found_idea_gold_sick_administration_desc: "Officials, guards, and crews treat every shipment as a private claim, feeding theft and coercion across the district."
riches_found_idea_infernal_accounts: "Infernal Accounts"
riches_found_idea_infernal_accounts_desc: "The administration measures mine receipts against demands from below that cannot be settled by ordinary accounts."
riches_found_idea_reformed_settlement: "Reformed Resource Settlement"
riches_found_idea_reformed_settlement_desc: "A durable public settlement binds mine revenue to accountable administration, local order, and enforceable limits."
riches_found_state_new: "Newly Discovered Riches"
riches_found_state_new_desc: "A new mine district is taking shape around unresolved claims and temporary workings."
riches_found_state_developed: "Established Riches District"
riches_found_state_developed_desc: "Permanent workings, transport, and settlement institutions support sustained extraction."
riches_found_state_contested: "Contested Mine District"
riches_found_state_contested_desc: "Rival authorities, armed interests, or an occupying power dispute control of the workings and their revenue."
riches_found_state_closed: "Closed Mine District"
riches_found_state_closed_desc: "Extraction has halted while the controller restores order, repairs the workings, or contains a crisis."
riches_found_state_ruined: "Ruined Workings"
riches_found_state_ruined_desc: "Collapse, exhaustion, or irreversible damage has ended ordinary operation of the mine."
riches_found_state_sealed: "Permanently Sealed Workings"
riches_found_state_sealed_desc: "The deepest workings have been closed behind a permanent barrier and removed from ordinary extraction."
riches_found_state_corrupted: "Corrupted Mine District"
riches_found_state_corrupted_desc: "Mine wealth has captured permits, accounts, security, and public spending across the settlement."
riches_found_state_gold_sick: "Gold-Sick Mine District"
riches_found_state_gold_sick_desc: "Compulsive possession, theft, and barricaded claims disrupt work and administration throughout the district."
riches_found_state_opened_depths: "Opened Depths"
riches_found_state_opened_depths_desc: "Deep excavation has exposed sealed workings occupied by a hostile force separate from every known underground actor."
riches_found_controller_aggregate: "Mine Revenue Administration"
riches_found_controller_aggregate_desc: "Controlled mines: [?riches_found_controller_mine_count|0]. The first mine contributes most. Each additional mine contributes less than the previous one to national revenue, construction, and industry."

029_riches_found_achievement_eligible_tooltip: "Available to player-controlled countries."
029_public_fortune: "Public Fortune"
029_public_fortune_desc: "Develop the original mine as a stable public settlement for two years without allowing the Resource Curse to take hold."
029_public_fortune_tooltip: "Control the original mature mine for two years with high Local Order and Revenue Legitimacy, low Extraction Pressure, a completed public project, and no Resource Curse."
029_claim_jumper: "Claim Jumper"
029_claim_jumper_desc: "Take control of another country's mine and establish a durable settlement there."
029_claim_jumper_tooltip: "Control a mine discovered by another country, settle its administration, and keep it operational after the transfer."
029_the_pay_train_runs: "The Pay Train Runs"
029_the_pay_train_runs_desc: "Protect three threatened mine shipments without losing one to robbery."
029_the_pay_train_runs_tooltip: "Complete three distinct Pay Train protection missions begun under real route danger, with no successful robbery between them."
029_all_that_glitters: "All That Glitters"
029_all_that_glitters_desc: "Control several safe, legitimate mines without Gold Disease or demons in their depths."
029_all_that_glitters_tooltip: "Maintain at least [?constant:riches_found_threshold.aggregate_third_mine|0] controlled mines with safe Local Order and Revenue Legitimacy and without Gold Disease or Demons Beneath the Mine."
029_no_man_owns_the_mountain: "No Man Owns the Mountain"
029_no_man_owns_the_mountain_desc: "Dismantle Gilded Sovereignty and restore legitimate public rule over the mine district."
029_no_man_owns_the_mountain_tooltip: "Reverse the chartered enclave through reform, restore high Revenue Legitimacy, and avoid foreign military intervention."
029_close_the_account: "Close the Account"
029_close_the_account_desc: "End the Bottomless Account and free the mine from every outstanding infernal obligation."
029_close_the_account_tooltip: "Close the Bottomless Account through its dedicated settlement route without accepting predatory prosperity."
029_the_last_shift: "The Last Shift"
029_the_last_shift_desc: "Evacuate the mine district and seal the opened depths after the demons appear."
029_the_last_shift_tooltip: "Complete the workforce evacuation, then permanently seal the mine without a mass-death outcome."

chaosx.nr29.120.t: "Gold-Sick Reports"
chaosx.nr29.130.t: "Reports from the Opened Depths"
chaosx.nr29.incident.d: "[This.GetRichesFoundIncidentReportText]"
chaosx.nr29.incident.a: "Record the report and answer it."
riches_found.report_acknowledged: "The report is entered into the mine administration's permanent record."
riches_found.incident.fallback: "A new report from [This.GetName] requires the mine administration's attention."
riches_found.incident.claims_rich_strike: "A registered crew has opened a genuinely rich pocket, drawing more workers and sharper scrutiny to the claim."
riches_found.incident.claims_fraudulent_assay: "A speculator's promoted assay has proved false, leaving forged certificates and angry investors behind."
riches_found.incident.claims_duplicate_documents: "Two offices have issued valid-looking papers for the same ground, and neither claimant will yield."
riches_found.incident.claims_jumpers: "Claim jumpers have occupied a prepared shaft and are refusing the surveyors access."
riches_found.incident.claims_landowner_refusal: "A landowner has barred the road to a confirmed seam until ownership terms are settled."
riches_found.incident.claims_local_recognition: "A local community has presented an organized claim and demanded recognition before work continues."
riches_found.incident.claims_boundary_crossing: "Prospectors have crossed an administrative boundary and carried their dispute into a neighboring jurisdiction."
riches_found.incident.claims_soldier_stakes: "Soldiers assigned to guard the workings have begun staking claims of their own."
riches_found.incident.claims_old_foreign_rights: "Foreign nationals have produced old exploration papers and demanded a place in the claim register."
riches_found.incident.claims_bribed_court: "Evidence shows that the local court accepted payment while deciding which documents to honor."
riches_found.incident.claims_miners_assembly: "A miners' assembly has written camp rules and is enforcing them at the shaft entrances."
riches_found.incident.claims_violent_eviction: "An eviction at a disputed shaft has turned violent, leaving the district under armed guard."
riches_found.incident.claims_easement_dispute: "A dispute over water and transport access has blocked the mine road."
riches_found.incident.claims_false_discovery: "A crowd has abandoned the main camp for a false secondary strike, straining order across the district."
riches_found.incident.claims_missing_specimen: "A valuable survey specimen has disappeared from the assay office before its findings could be certified."
riches_found.incident.rush_housing_inflation: "Rents and lodging prices have risen beyond ordinary wages as new arrivals crowd the mine settlement."
riches_found.incident.rush_food_shortage: "Food deliveries cannot keep pace with the camp, and merchants are withholding supplies for higher prices."
riches_found.incident.rush_sanitation_failure: "Drainage and waste collection have failed in the largest camps, forcing the administration to close crowded streets."
riches_found.incident.rush_fire: "Fire has crossed a row of timber lodgings and damaged stores near the workings."
riches_found.incident.rush_theft: "Theft from tents, lockers, and pay offices has become routine as the settlement expands."
riches_found.incident.rush_labor_exploitation: "Recruiters are binding workers to abusive advances and deductions that leave wages permanently in arrears."
riches_found.incident.rush_displacement: "Families near the workings are being pushed from homes and grazing land by the expanding camp."
riches_found.incident.rush_wage_dispute: "A wage dispute has stopped shifts and gathered workers at the main gate."
riches_found.incident.rush_gambling_debt: "Gambling houses and lenders now hold much of the camp's pay before workers return to their lodgings."
riches_found.incident.rush_gang_violence: "Competing gangs have fought openly over protection, transport, and stolen ore."
riches_found.incident.rush_price_gouging: "Licensed traders are coordinating prices for food, tools, and lodging across the camp."
riches_found.incident.rush_outsider_resentment: "Residents accuse incoming crews of taking land, water, and public services without sharing the mine's returns."
riches_found.incident.rush_police_corruption: "Camp police are selling protection and directing seizures toward merchants who refuse to pay."
riches_found.incident.rush_smuggling: "Smugglers have opened an unrecorded route for specimens, payroll cash, and portable ore."
riches_found.incident.development_route_washout: "Floodwater has cut the main access route and stranded construction material outside the district."
riches_found.incident.development_pump_failure: "A drainage pump has failed, flooding lower workings and halting reinforcement crews."
riches_found.incident.development_ventilation_failure: "The ventilation system has stopped in a deep section, forcing crews back to the surface."
riches_found.incident.development_magazine_fire: "A fire at the explosives magazine has damaged nearby works and exposed unsafe storage."
riches_found.incident.development_sabotage: "Saboteurs have damaged transport equipment and left the route unsafe for construction crews."
riches_found.incident.development_material_shortage: "Timber, pumps, and replacement parts have arrived late, slowing the current project."
riches_found.incident.development_engineer_strike: "Engineers and skilled crews have stopped work over safety rules and unpaid allowances."
riches_found.incident.development_false_invoice: "An invoice names equipment that never reached the mine, leaving the project short of both material and funds."
riches_found.incident.corruption_missing_shipments: "An audit cannot reconcile recorded output with the shipments that reached the treasury."
riches_found.incident.corruption_local_share_demand: "Local officials have demanded a fixed share of receipts before approving further extraction."
riches_found.incident.corruption_royalty_change: "A ministry has rewritten the royalty formula, reopening every argument over who receives the windfall."
riches_found.incident.corruption_bonus_strike: "Workers have struck after promised shipment bonuses vanished from the payroll."
riches_found.incident.corruption_false_dividend_names: "The public dividend list contains false names and repeated households."
riches_found.incident.corruption_visible_public_work: "The development fund has completed a visible local project, strengthening confidence in the settlement."
riches_found.incident.corruption_diverted_central_fund: "Receipts assigned to the mine district have been diverted to unrelated central spending."
riches_found.incident.corruption_theft_accusation: "Local leaders have publicly accused the government of taking the mine's revenue without accounting for it."
riches_found.incident.corruption_missing_official: "A treasury official and the latest shipment ledger have disappeared together."
riches_found.incident.corruption_assay_substitution: "The assay office has found substituted material and deliberate undercounting in sealed consignments."
riches_found.incident.corruption_party_machine: "A political organization is distributing mine contracts, jobs, and housing as instruments of loyalty."
riches_found.incident.corruption_payroll_dependence: "Shops, transport, and public offices now depend on the mine payroll arriving without interruption."
riches_found.incident.corruption_worker_drain: "Ordinary farms and factories are losing skilled workers to the mine district."
riches_found.incident.foreign_fund_claimant: "Foreign money is reaching rival claimants through local brokers and unregistered accounts."
riches_found.incident.foreign_bribe_officials: "Mine officials have received foreign payments tied to permits, inspections, and shipment records."
riches_found.incident.foreign_steal_survey: "Copies of the survey have vanished and appeared in a foreign commercial office."
riches_found.incident.foreign_recruit_engineers: "A foreign concern is recruiting the mine's engineers and offering passage for their families."
riches_found.incident.foreign_sabotage_transport: "A deliberate attack has damaged the mine's transport route. Surviving evidence points beyond the district."
riches_found.incident.foreign_support_armed_group: "Weapons and funds from abroad are sustaining an armed group around the mine."
riches_found.incident.foreign_expose_contract: "Foreign documents have exposed hidden ownership and payments inside the current contract."
riches_found.incident.foreign_demand_inspection: "A foreign government has demanded inspection rights over the mine's books and workings."
riches_found.incident.foreign_threaten_sanctions: "Foreign representatives are threatening sanctions over uncompensated nationalization and lost contract rights."
riches_found.incident.foreign_prepare_seizure: "A hostile neighbor is assembling the access, local contacts, and forces needed to seize the mine during war."
riches_found.incident.foreign_recognize_local_claim: "A foreign government has recognized a local revenue claim and offered its representatives diplomatic support."
riches_found.incident.foreign_offer_assistance: "A friendly neighbor has offered engineers, transport access, and policing cooperation for the mine district."
riches_found.incident.raid_assay_office: "[This.GetRichesFoundRaidActorText] struck the assay office, taking specimens and scattering its records."
riches_found.incident.raid_payroll: "[This.GetRichesFoundRaidActorText] attacked the payroll route before the wages reached the mine settlement."
riches_found.incident.raid_rail_route: "[This.GetRichesFoundRaidActorText] damaged the rail approach and halted trains bound for the mine."
riches_found.incident.raid_port_route: "[This.GetRichesFoundRaidActorText] struck the port and convoy route serving the mine."
riches_found.incident.raid_processing_works: "[This.GetRichesFoundRaidActorText] entered the processing works and wrecked machinery before withdrawing."
riches_found.incident.raid_storage_compound: "[This.GetRichesFoundRaidActorText] broke into the storage compound and carried off secured material."
riches_found.incident.raid_contract_records: "[This.GetRichesFoundRaidActorText] raided the contract archive and destroyed evidence of ownership and obligations."
riches_found.incident.raid_shaft_entrance: "[This.GetRichesFoundRaidActorText] seized the shaft entrance and stopped crews from entering the workings."
riches_found.incident.collapse_warning_shift: "A dangerous shift has been halted after supports moved and water entered the lower galleries."
riches_found.incident.collapse_local_cave_in: "A local cave-in has buried equipment and closed part of the workings."
riches_found.incident.collapse_major_failure: "A major structural failure has damaged several shafts and forced a district-wide rescue effort."
riches_found.incident.collapse_catastrophic: "The mine has suffered a catastrophic collapse, destroying workings and trapping crews underground."
riches_found.incident.gold_hidden_samples: "Workers are hiding samples in clothing, walls, and food stores rather than surrendering them to the assay office."
riches_found.incident.gold_altered_records: "Shipment records have been rewritten repeatedly so that no one can agree how much material exists."
riches_found.incident.gold_endless_shift: "Crews are refusing to leave the workings, searching and counting long after their shifts end."
riches_found.incident.gold_guard_theft: "Guards are searching one another and stealing seized fragments from the lockers they protect."
riches_found.incident.gold_gang_control: "An organized group has taken control of a shaft and established its own buying and permit system."
riches_found.incident.gold_false_permits: "Officials are issuing false access permits in exchange for concealed pieces of ore."
riches_found.incident.gold_shipment_fight: "A fight over a guarded shipment has spread through the camp and left bodies beside the pay wagons."
riches_found.incident.gold_unsafe_digging: "Crews have removed supports and blocked drainage to reach visible material in an unsafe section."
riches_found.incident.supernatural_answering_knocks: "Knocks from a sealed gallery repeat questions in the exact number of people standing nearby."
riches_found.incident.supernatural_counting_voices: "Voices beneath the workings are naming hidden amounts that do not appear in any public ledger."
riches_found.incident.supernatural_returned_tools: "Tools removed from the deep section have returned to impossible places behind locked barriers."
riches_found.incident.supernatural_patterned_lamps: "Lamps across the lower galleries are extinguishing in a deliberate numerical pattern."
riches_found.incident.supernatural_balanced_payroll: "Missing teams remain on the payroll, and the ledger balances despite no recorded shipment."
riches_found.incident.supernatural_ore_after_violence: "Fresh ore has appeared where violence occurred, strengthening the force beneath the mine."
riches_found.incident.supernatural_accounting_marks: "Support timbers carry unfamiliar accounting marks that change after every inspection."
riches_found.incident.supernatural_open_sealed_tunnel: "A tunnel sealed under guard has been found open from the inside."
riches_found.incident.contract_clean_renewal: "The partner has accepted a documented review and offered renewal without changing the public terms."
riches_found.incident.contract_larger_share: "The partner is demanding a larger share and threatening to suspend work until the contract changes."
riches_found.incident.contract_infrastructure_offer: "The partner has offered new transport and processing works in exchange for longer access."
riches_found.incident.contract_security_rights: "The partner wants armed security rights around its personnel, stores, and shipment route."
riches_found.incident.contract_local_intermediary: "A local intermediary has appeared between the partner and the administration, obscuring payments and ownership."
riches_found.incident.contract_withdrawal: "The partner has issued a withdrawal notice and begun removing staff and equipment."
riches_found.incident.contract_rival_claimant: "The partner is secretly backing a rival claimant to improve its bargaining position."
riches_found.incident.contract_breach_pressure: "After a breach, the partner is demanding settlement under threat of sanctions and disruption."
