riches_found.event_details.history: "Mine: [This.GetRichesFoundHistoryTargetName]\n\n$riches_found.event_details.description$"
riches_found.event_details.description: "A random country receives a major political windfall when a valuable deposit is found in one eligible state. The discovery can transform an isolated district into a crowded mining settlement, and the mine remains tied to that state, with persistent income and industrial value following whoever controls it. Its controller must regulate claims, build transport and housing, settle the revenue, manage concessions and security, resist foreign capture, and keep extraction from outrunning public authority as workers, companies, guards, officials, criminals, and foreign interests struggle over access and control."
riches_found.evolution.type: "Mine Evolution"
riches_found.evolution.unrecorded.summary: "No mine evolution has been recorded."
riches_found.evolution.summary: "The mine has crossed into a lasting crisis."
riches_found.evolution.unrecorded_1.title: "The Resource Curse"
riches_found.evolution.unrecorded_2.title: "Gold Disease"
riches_found.evolution.unrecorded_3.title: "Demons Beneath the Mine"
riches_found.evolution.stage_1.title: "The Resource Curse"
riches_found.evolution.stage_1.body: "The mine's wealth begins capturing the state, government, companies, security services, and public spending. Concession holders buy protection, officials trade access, and public revenue disappears before it reaches the treasury. Choose public revenue, national control, private domination, concession dependence, or tolerated corruption; harder extraction improves the mine while worsening dependence and capture."
riches_found.evolution.stage_2.title: "Gold Disease"
riches_found.evolution.stage_2.body: "Gold Disease spreads an obsessive hunger for the mine's gold among workers, officials, guards, soldiers, and administrators. Theft, hoarding, barricaded workings, and violent disputes threaten the district; choose revenue sharing, workforce replacement, military intervention, quarantine, temporary closure, or sealing deeper sections. Continued extraction raises output while driving the crisis higher."
riches_found.evolution.stage_3.title: "Demons Beneath the Mine"
riches_found.evolution.stage_3.body: "Deep excavation opens sealed chambers occupied by a corrupting underground force. Disappearances, altered workers, impossible accidents, mass violence, military breakdown, and severe state pressure follow as armed figures demand payment in labor, metal, and obedience. Choose to seal the depths, evacuate, seek religious or occult assistance, exploit the mine under control, purge the threat, or make an agreement."

riches_found_idea_windfall_receipts: "Windfall Receipts"
riches_found_idea_windfall_receipts_desc: "The treasury records the mine as a promising but unsettled source of national revenue."
riches_found_idea_managed_revenue: "Managed Mineral Revenue"
riches_found_idea_managed_revenue_desc: "Audits, public accounts, and accepted settlement rules keep mine receipts inside the state budget."
riches_found_idea_resource_dependence: "Resource-Dependent Treasury"
riches_found_idea_resource_dependence_desc: "Public spending and political promises increasingly depend on the mine remaining open and profitable."
riches_found_idea_captured_revenue_state: "Captured Revenue State"
riches_found_idea_captured_revenue_state_desc: "Concession holders, private guards, and local patrons divert the mine's authority as readily as its wealth."
riches_found_idea_gold_sick_administration: "Gold-Sick Administration"
riches_found_idea_gold_sick_administration_desc: "Officials, guards, and crews treat every shipment as a private claim, feeding theft and coercion across the district."
riches_found_idea_infernal_accounts: "Infernal Accounts"
riches_found_idea_infernal_accounts_desc: "The administration measures mine receipts against demands from below that cannot be settled by ordinary accounts."
riches_found_idea_reformed_settlement: "Reformed Resource Settlement"
riches_found_idea_reformed_settlement_desc: "A durable public settlement binds mine revenue to accountable administration, local order, and enforceable limits."
riches_found_state_new: "Newly Discovered Riches"
riches_found_state_new_desc: "A new mine district is taking shape around unresolved claims and temporary workings."
riches_found_state_developed: "Established Riches District"
riches_found_state_developed_desc: "Permanent workings, transport, and settlement institutions support sustained extraction."
riches_found_state_contested: "Contested Mine District"
riches_found_state_contested_desc: "Rival authorities, armed interests, or an occupying power dispute control of the workings and their revenue."
riches_found_state_closed: "Closed Mine District"
riches_found_state_closed_desc: "Extraction has halted while the controller restores order, repairs the workings, or contains a crisis."
riches_found_state_ruined: "Ruined Workings"
riches_found_state_ruined_desc: "Collapse, exhaustion, or irreversible damage has ended ordinary operation of the mine."
riches_found_state_sealed: "Permanently Sealed Workings"
riches_found_state_sealed_desc: "The deepest workings have been closed behind a permanent barrier and removed from ordinary extraction."
riches_found_state_corrupted: "Corrupted Mine District"
riches_found_state_corrupted_desc: "Mine wealth has captured permits, accounts, security, and public spending across the settlement."
riches_found_state_gold_sick: "Gold-Sick Mine District"
riches_found_state_gold_sick_desc: "Compulsive possession, theft, and barricaded claims disrupt work and administration throughout the district."
riches_found_state_gold_susceptible: "Gold Fever Memory"
riches_found_state_gold_susceptible_desc: "The gold sickness has been contained here, but the district remembers it. Part of its labour still drifts into private searching, and heavy extraction lets the hunger return quickly."
riches_found_country_gold_fever: "Gold Fever"
riches_found_country_gold_fever_desc: "Crews and material from a gold-sick mine have brought the hunger home. Officials and workers hoard fragments and quarrel over them."
riches_found_country_gold_fever_army: "Gold Fever in the Ranks"
riches_found_country_gold_fever_army_desc: "Soldiers rotated out of a gold-sick mine search one another and quarrel over seized fragments."
riches_found_country_concession_share: "Mine Concession Share"
riches_found_country_concession_share_desc: "Our companies hold a concession in a foreign gold mine and bring part of its revenue home."
riches_found_concession_partner: "Mine concession partner"
riches_found_concession_settled: "Mine concession settled fairly"
riches_found_concession_expropriated: "Mine concession expropriated"
riches_found_state_opened_depths: "Opened Depths"
riches_found_state_opened_depths_desc: "Deep excavation has opened sealed workings where a hostile force demands labor, metal, and obedience."
riches_found_controller_aggregate: "Mine Revenue Administration"
riches_found_controller_aggregate_desc: "Controlled mines: [?riches_found_controller_registered_mine_count|0]; producing: [?riches_found_controller_mine_count|0].\nSelected: [This.GetRichesFoundSelectedMineName] — [This.GetRichesFoundSelectedMineOperatingCondition].\nPolitical power: [?riches_found_controller_pp_gain|=+2]/day; construction: [?riches_found_controller_construction|=+%1]; factory output: [?riches_found_controller_factory_output|=+%1].\nThe first mine contributes most, with smaller returns from later mines. National revenue cannot exceed [?constant:riches_found_scaling.controller_pp_cap|.2]/day and construction cannot exceed [?constant:riches_found_scaling.controller_construction_cap|%0]. Closed workings, unrest and broken terms reduce receipts."
riches_found.account.none: ""
riches_found.account.live: "§OAccount:§! [This.GetRichesFoundAccountObligation] — [This.GetRichesFoundAccountDeadlineBand]. Receipts: [?riches_found_selected_mine.riches_found_mine_receipt_pp_component|.2] political power/day. Broken promises suspend receipts."
