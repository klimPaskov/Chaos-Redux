029_all_that_glitters_DESC: "$029_all_that_glitters_desc$"
029_no_man_owns_the_mountain_NAME: "$029_no_man_owns_the_mountain$"
029_no_man_owns_the_mountain_DESC: "$029_no_man_owns_the_mountain_desc$"
