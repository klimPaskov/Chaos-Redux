civilian_policies: "Civilian Policies"
unconventional_warfare: "Unconventional Warfare"
refugee_reception: "Refugee Reception"
civilian_departure: "Civilian Departure"
chemical_use_policy: "Chemical Use"
biological_use_policy: "Biological Use"
nuclear_use_policy: "Nuclear Use"
national_policy_civilian_eligible_tt: "This country uses ordinary civilian reception and departure rules."
national_policy_warfare_eligible_tt: "This country can set national warfare policy."
national_policy_reception_humanitarian: "Humanitarian Admission"
national_policy_reception_humanitarian_desc: "Admit displaced civilians through humanitarian reception routes."
national_policy_reception_controlled: "Controlled Admission"
national_policy_reception_controlled_desc: "Admit arrivals through controlled reception and capacity checks."
national_policy_reception_transit: "Transit Only"
national_policy_reception_transit_desc: "Permit onward transit without committing to permanent reception."
national_policy_reception_quarantine: "Medical Quarantine"
national_policy_reception_quarantine_desc: "Receive arrivals through medical screening and quarantine."
national_policy_reception_closed: "Closed Admission"
national_policy_reception_closed_desc: "Refuse new refugee admission. Closing admission while people await reception reduces stability and war support. Existing arrivals still need shelter and onward routes."
national_policy_reception_violent: "Violent Rejection"
national_policy_reception_violent_desc: "Use force against unauthorized crossings, with civilian and diplomatic consequences."
national_policy_reception_forced_return: "Forced Return"
national_policy_reception_forced_return_desc: "Authorize forced repatriation of sheltered civilians. An unsafe origin or route can cause deaths, renewed flight and foreign condemnation."
national_policy_departure_free: "Free Departure"
national_policy_departure_free_desc: "Permit civilian departure and evacuation through valid routes."
national_policy_departure_permit: "Departure Permits"
national_policy_departure_permit_desc: "Require permission for civilian departure. Emergency movements still require their own route proof."
national_policy_departure_prohibited: "Departure Prohibited"
national_policy_departure_prohibited_desc: "Prohibit ordinary civilian departure. Humanitarian operations retain their own exact requirements."
national_policy_chemical_retaliation: "Retaliation Only"
national_policy_chemical_retaliation_desc: "Authorize chemical retaliation against a country that attacked us with an unconventional weapon within the last [?constant:cbrn_diplomacy_duration.retaliation_window_days|0] days. We must still be at war with that country."
national_policy_chemical_battlefield: "Battlefield Authorization"
national_policy_chemical_battlefield_desc: "Authorize chemical battlefield use. Delivery, payload, readiness and target requirements still apply."
national_policy_chemical_unrestricted: "Unrestricted Authorization"
national_policy_chemical_unrestricted_desc: "Authorize all chemical operations. Operation requirements and treaty consequences still apply."
national_policy_biological_retaliation: "Retaliation Only"
national_policy_biological_retaliation_desc: "Authorize biological retaliation against a country that attacked us with an unconventional weapon within the last [?constant:cbrn_diplomacy_duration.retaliation_window_days|0] days. We must still be at war with that country."
national_policy_biological_battlefield: "Battlefield Authorization"
national_policy_biological_battlefield_desc: "Authorize biological battlefield use. Agent capability, containment, delivery and target requirements still apply."
national_policy_biological_unrestricted: "Unrestricted Authorization"
national_policy_biological_unrestricted_desc: "Authorize all biological operations. Operation requirements and treaty consequences still apply."
national_policy_nuclear_none: "No Standing Authorization"
national_policy_nuclear_none_desc: "Issue no standing nuclear-use authorization. Possession and research do not authorize a strike."
national_policy_nuclear_retaliation: "Retaliation Only"
national_policy_nuclear_retaliation_desc: "Authorize nuclear retaliation against a country that attacked us with an unconventional weapon within the last [?constant:cbrn_diplomacy_duration.retaliation_window_days|0] days. We must still be at war with that country."
national_policy_nuclear_unrestricted: "Unrestricted Authorization"
national_policy_nuclear_unrestricted_desc: "Authorize nuclear use subject to custody, delivery and target requirements."
