l_english:
chaosx.fallout.642.t: "The Mine Generator"
chaosx.fallout.642.d: "In the authenticated Sub-Saharan state of [?fallout_event_dispatch_issued_target.GetName], a generator shed now decides whether the works can feed the settlements around it. A continuity cabinet wants a clean trade ledger, a garrison authority wants a labor shift, an engineer council wants control of the machinery, and a convoy administration wants to evacuate the most exposed workers. The native coal and metal deposits are known, but the people, stores, and roads that reach them are not."
chaosx.fallout.642.a: "Trade mineral shares"
chaosx.fallout.642.a.tt: "Spend Power 3, Scrap 2, and Recognition 2. In [?fallout_event_dispatch_issued_target.GetName], the trade ledger risks foreign concession pressure. After 42 days, the mine works will be judged by food reserves, supply access, reclamation, disease pressure, and the selected native resource class."
chaosx.fallout.642.b: "Conscript the labor shift"
chaosx.fallout.642.b.tt: "Spend Food 3, Fuel 2, and Command Power 10. In [?fallout_event_dispatch_issued_target.GetName], the labor shift risks worker trust, food debt, and guarded unrest. After 42 days, the works will be judged by the ration ledger, war conditions, worker trust, and the authority of the labor roster."
chaosx.fallout.642.c: "Establish engineer rule"
chaosx.fallout.642.c.tt: "Spend Power 4, Scrap 3, and Recognition 2. In [?fallout_event_dispatch_issued_target.GetName], engineer rule risks coercion if the maintenance board cannot protect the stores. After 42 days, the machinery will be judged by engineer authority, reclamation, cohesion, and whether the guarded plant can keep its stores moving."
chaosx.fallout.642.e: "Evacuate the works"
chaosx.fallout.642.e.tt: "Spend Fuel 4, Shelter Capacity 3, and Medicine 2. In [?fallout_event_dispatch_issued_target.GetName], evacuation risks lost extraction continuity if the outer rooms cannot hold the workers. After 42 days, evacuation readiness will be judged against exposure, disease pressure, shelter capacity, and the food left in the mining district."
chaosx.fallout.644.t: "The Generator Ledger"
chaosx.fallout.644.trade.success.d: "The continuity cabinet traded mineral shares without surrendering the local ration book. The generator shed runs on a counted schedule, food deliveries reach the work camp, and the Sub-Saharan district can use its native resource evidence without changing the deposits beneath the state."
chaosx.fallout.644.trade.partial.d: "The trade ledger brought fuel and tools to the generator shed, but outside claims still press against the local stores. The works continue at a reduced rhythm while food debt and foreign concession pressure remain visible in the district memory."
chaosx.fallout.644.trade.failure.d: "The trade ledger failed at the generator gate. Stores were divided before a schedule could be agreed, the plant lost part of its local supply, and the first recorded losses entered the district death ledger."
chaosx.fallout.644.labor.success.d: "The labor shift reached the generator before the ration line broke. The garrison authority has a counted roster, the works have fuel for the next run, and the continuity cabinet can see which households are carrying the cost of extraction."
chaosx.fallout.644.labor.partial.d: "The labor roster restarted the generator, but it did so by borrowing trust from the workers and food from the settlements. The plant is active, yet coercion and ration debt remain in the memory of the mining district."
chaosx.fallout.644.labor.failure.d: "The labor shift consumed food and fuel without stabilizing the generator shed. The roster broke into guarded queues, the works lost infrastructure, and the state recorded deaths from a failed mineral schedule."
chaosx.fallout.644.engineer.success.d: "The engineer council secured the machinery and wrote a maintenance order the settlements can read. Scrap became repairs, the generator shed regained a reliable rhythm, and the native resource evidence remains untouched while the plant serves the district."
chaosx.fallout.644.engineer.partial.d: "The engineer council kept the machinery from going silent, but its rule did not settle the stores or the households around the works. Repairs continue while cohesion and food reserves carry the cost of a narrow technical victory."
chaosx.fallout.644.engineer.failure.d: "The engineer council claimed the plant before it could secure the stores. Repairs failed, the industrial works lost infrastructure, and disease and exposure rose around a generator that no longer answers to a common ledger."
chaosx.fallout.644.evacuation.success.d: "The evacuation authority moved exposed workers into counted shelter before the next ash-laden wind. Medicine reached the outer rooms, the district retained a smaller but trusted works crew, and the generator can be restarted without erasing those who left."
chaosx.fallout.644.evacuation.partial.d: "The evacuation authority moved some workers and protected the clinic stores, but the mining district could not carry every household to shelter. The generator survives in a reduced role while food and reclamation remain contested."
chaosx.fallout.644.evacuation.failure.d: "The evacuation order spent fuel and medicine without producing a safe route from the works. Shelter capacity failed at the outer rooms, the generator district lost infrastructure, and the delayed loss record now follows the remaining roster."
chaosx.fallout.644.a: "Record the generator ledger"
chaosx.fallout.644.a.tt: "Apply the authenticated 42-day Mine Generator result, preserve the selected native resource class as evidence, and continue to the delayed review."
chaosx.fallout.646.t: "The Works After the Rains"
chaosx.fallout.646.success.d: "Two hundred and seventy days later, rain has reached the Sub-Saharan works and the generator ledger can still be read. The district has a working answer for food, stores, and machine authority, while the native deposit record remains a witness rather than a target of the chain."
chaosx.fallout.646.partial.d: "The delayed review finds a plant that works in intervals. Some ration and repair marks survived the wet season, but food debt, worker trust, and reclamation still pull the district in different directions."
chaosx.fallout.646.failure.d: "The delayed review finds a mining district with no common works order. Disease and exposure have narrowed the settlement, the generator has lost another piece of infrastructure, and the remaining stores cannot support the old roster."
chaosx.fallout.646.a: "Close the works review"
chaosx.fallout.646.a.tt: "Apply the authenticated delayed review, record the Sub-Saharan works memory, and close the Mine Generator transaction without changing the native resource deposits."
