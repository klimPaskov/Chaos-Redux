fallout.event_log.mine_generator.name: "The Mine Generator"
fallout.event_log.mine_generator.detail: "[GetFalloutEvent642EventLogDetail]"
fallout.event_log.mine_generator.choice_trade: "The country traded mineral shares through a counted generator schedule in the Sub-Saharan mining district."
fallout.event_log.mine_generator.choice_labor: "The country imposed a labor shift and a guarded ration roster around the generator shed."
fallout.event_log.mine_generator.choice_engineer: "The country placed the generator works under an engineer council and a maintenance order."
fallout.event_log.mine_generator.choice_evacuation: "The country used fuel, shelter, and medicine to evacuate exposed workers from the mining district."
fallout.event_log.mine_generator.trade_success: "The trade ledger kept the generator running while local stores and native resource evidence stayed distinct."
fallout.event_log.mine_generator.trade_partial: "The trade ledger kept part of the works active while food debt and concession pressure remained."
fallout.event_log.mine_generator.trade_failure: "The trade ledger failed and the district recorded infrastructure damage and winter loss."
fallout.event_log.mine_generator.labor_success: "The labor roster restarted the works with fuel and a counted garrison schedule."
fallout.event_log.mine_generator.labor_partial: "The labor roster restarted the works while worker trust and food stores weakened."
fallout.event_log.mine_generator.labor_failure: "The labor roster failed at the generator and the district recorded a delayed loss."
fallout.event_log.mine_generator.engineer_success: "The engineer council secured machinery and kept the works readable to the settlements."
fallout.event_log.mine_generator.engineer_partial: "The engineer council preserved a reduced plant while cohesion and food remained contested."
fallout.event_log.mine_generator.engineer_failure: "The engineer council failed to secure the plant and the works lost infrastructure."
fallout.event_log.mine_generator.evacuation_success: "The evacuation route protected exposed workers and preserved a smaller trusted works crew."
fallout.event_log.mine_generator.evacuation_partial: "The evacuation route protected some workers while shelter and reclamation remained contested."
fallout.event_log.mine_generator.evacuation_failure: "The evacuation order failed to move the outer rooms and the district recorded a delayed loss."
fallout.event_log.mine_generator.callback_success: "The delayed review found a readable generator ledger after the rains."
fallout.event_log.mine_generator.callback_partial: "The delayed review found working intervals and several unresolved district ledgers."
fallout.event_log.mine_generator.callback_failure: "The delayed review found broken works, rising disease, and no common roster."
fallout.event_log.mine_generator.cancelled: "The Mine Generator transaction was cancelled after its host, owner, target, or generation changed."
