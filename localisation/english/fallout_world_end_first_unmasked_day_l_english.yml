 chaosx.fallout.471.t: "The First Unmasked Day"
 chaosx.fallout.471.intro: "The air monitors have fallen below the severe winter line, but the thaw has not made the open ground safe. Outside [This.GetName], a clinic has marked one schoolyard lane for a measured hour without respirators. Your government must decide whether to let families step into the light, require masked work shifts, let the clinic test the air at dawn, or keep the shelter sealed until the records clear."
 chaosx.fallout.471.a: "Open the schoolyard for one hour"
 chaosx.fallout.471.a.tt: "Spend food, medicine, and recognition to let families test the open air under a clinic watch."
 chaosx.fallout.471.b: "Require masked work shifts"
 chaosx.fallout.471.b.tt: "Spend stores to reopen work without allowing the first unmasked crowd to set the rule."
 chaosx.fallout.471.c: "Let the clinic test daylight"
 chaosx.fallout.471.c.tt: "Spend medicine and recognition to measure the dawn air before the public opening."
 chaosx.fallout.471.d: "Keep the shelter sealed until clear"
 chaosx.fallout.471.d.tt: "Spend a small reserve to protect children and preserve the shelter record until the monitors hold."
 chaosx.fallout.473.t: "The Measured Hour"
 chaosx.fallout.473.open_schoolyard.success.d: "The schoolyard lane held for the full hour. Families touched the frost without rushing, the clinic logged every cough, and the settlement learned that an opening could be measured rather than declared."
 chaosx.fallout.473.open_schoolyard.partial.d: "The lane opened, but two children crossed the marker before the nurse could call them back. The public saw daylight, while the clinic lost confidence in the promises written on the board."
 chaosx.fallout.473.open_schoolyard.failure.d: "The monitor was read too late. The first crowd came back coughing, the schoolyard was closed again, and families now treat every government air report as a warning to distrust."
 chaosx.fallout.473.masked_work_shift.success.d: "Masked crews returned to the workshops and kept the schoolyard empty. The settlement has work, masks, and a rota that protects the first children who will eventually go outside."
 chaosx.fallout.473.masked_work_shift.partial.d: "The work shifts held until the filters ran short. The workshops reopened in fragments, but the shelter has no agreement on who may remove a mask first."
 chaosx.fallout.473.masked_work_shift.failure.d: "A foreman turned the shift into an order to strip masks. The clinic closed its door, the work crews scattered, and the shelter memory now carries the cost of a rushed opening."
 chaosx.fallout.473.daylight_medical_trial.success.d: "The clinic tested the dawn air with three independent samples. The opening remains narrow, but the settlement has a record it can read and a nurse willing to sign the next page."
 chaosx.fallout.473.daylight_medical_trial.partial.d: "The samples disagreed after the sun reached the roofs. The clinic permits a short daylight trial, while families wait for a result that cannot be shouted down by a guard."
 chaosx.fallout.473.daylight_medical_trial.failure.d: "The test kits failed before the first reading. The clinic used its reserve on repairs, the air remained a rumour, and the next shift will work under a cloud of doubt."
 chaosx.fallout.473.sealed_until_clear.success.d: "The shelter stayed sealed while the monitors held a clean interval. Children kept their names and lessons in one record, and the first unmasked day will belong to a community that remembers why it waited."
 chaosx.fallout.473.sealed_until_clear.partial.d: "The seal protected the youngest shelters, but workers began opening side doors at night. The records remain intact, although the next public rule will have to answer for those quiet exceptions."
 chaosx.fallout.473.sealed_until_clear.failure.d: "The seal became a punishment without a trusted reading. Families moved through hidden exits, the clinic lost its witnesses, and the shelter no longer agrees on what safe means."
 chaosx.fallout.473.a: "Record the measured hour"
 chaosx.fallout.473.a.tt: "Resolve the exposure decision and schedule a later review of mask stock, clinic confidence, shelter memory, and the next public opening."
 chaosx.fallout.475.t: "The Second Monitor"
 chaosx.fallout.475.success.d: "The second monitor confirms that the settlement can plan daylight in measured intervals. [This.GetName] will keep the masks, the clinic book, and the schoolyard rule together."
 chaosx.fallout.475.partial.d: "The air holds for one route and fails along another. The settlement can attempt another opening, but the children remember which promise was kept."
 chaosx.fallout.475.failure.d: "The second monitor returns a warning and a broken seal. The first unmasked day has become a cautionary memory, with every supply delay now argued through the clinic door."
 chaosx.fallout.475.a: "Archive the exposure record"
 chaosx.fallout.475.a.tt: "Record the delayed result, keep the shelter and clinic effects, and release every scheduler receipt."
 fallout.event_log.first_unmasked_day.name: "The First Unmasked Day"
 fallout.event_log.first_unmasked_day.detail: "[This.GetName] decided how survivors would meet the first measured opening after Air Winter."
 fallout.event_log.first_unmasked_day.open_schoolyard_success: "A schoolyard lane held for one measured hour."
 fallout.event_log.first_unmasked_day.open_schoolyard_partial: "The lane opened, but a child crossed the clinic marker."
 fallout.event_log.first_unmasked_day.open_schoolyard_failure: "A late monitor reading sent the first crowd back coughing."
 fallout.event_log.first_unmasked_day.masked_work_shift_success: "Masked work shifts reopened workshops while children stayed sheltered."
 fallout.event_log.first_unmasked_day.masked_work_shift_partial: "Filters ran short before the work rota could settle."
 fallout.event_log.first_unmasked_day.masked_work_shift_failure: "A rushed order turned a work shift into an unsafe opening."
 fallout.event_log.first_unmasked_day.daylight_medical_trial_success: "Three clinic samples made a narrow daylight opening credible."
 fallout.event_log.first_unmasked_day.daylight_medical_trial_partial: "The dawn samples disagreed after the sun reached the roofs."
 fallout.event_log.first_unmasked_day.daylight_medical_trial_failure: "The test kits failed before the first public reading."
 fallout.event_log.first_unmasked_day.sealed_until_clear_success: "A sealed shelter preserved the record until a clean interval held."
 fallout.event_log.first_unmasked_day.sealed_until_clear_partial: "The seal protected children while workers used hidden night exits."
 fallout.event_log.first_unmasked_day.sealed_until_clear_failure: "An untrusted seal turned waiting into a dispute over safety."
 fallout.event_log.first_unmasked_day.callback_success: "A second monitor made measured daylight a public rule."
 fallout.event_log.first_unmasked_day.callback_partial: "One route held while the children remembered a broken promise."
 fallout.event_log.first_unmasked_day.callback_failure: "A warning and broken seal made exposure a cautionary memory."
