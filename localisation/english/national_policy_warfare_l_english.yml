l_english:
national_policy_nuclear_use_against_from_tt: "We are at war with [FROM.GetName], and our nuclear law permits a strike against them. Retaliation Only requires their confirmed unconventional attack within the last [?constant:cbrn_diplomacy_duration.retaliation_window_days|0] days. No Standing Authorization permits no strikes."
national_policy_biological_allows_battlefield_use: "Current biological policy permits battlefield use."
national_policy_biological_allows_strategic_use: "Current biological policy permits strategic use."
national_policy_biological_allows_extreme_use: "Biological policy permits unrestricted use."
national_policy_biological_allows_battlefield_use_against_from: "Current biological policy permits battlefield use against [FROM.GetName]."
national_policy_biological_allows_strategic_use_against_from: "Current biological policy permits strategic use against [FROM.GetName]."
national_policy_biological_allows_battlefield_use_against_target_id: "Current biological policy permits battlefield use against the selected opponent."
national_policy_biological_allows_strategic_use_against_target_id: "Current biological policy permits strategic use against the selected opponent."
national_policy_nuclear_allows_use_against_target_id: "Our nuclear law permits a strike against the selected opponent. Retaliation Only requires that opponent to have attacked us with an unconventional weapon within the last [?constant:cbrn_diplomacy_duration.retaliation_window_days|0] days. No Standing Authorization permits no strikes."
national_policy_nuclear_event_action_policy_is_valid: "Our nuclear law permits the planned strike against the selected opponent. Retaliation Only requires war with that opponent and their confirmed unconventional attack within the last [?constant:cbrn_diplomacy_duration.retaliation_window_days|0] days. No Standing Authorization permits no strikes."
