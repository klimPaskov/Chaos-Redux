# ---------------------------------------------------------------------------
# Decisions, missions, spirits and tooltips
# ---------------------------------------------------------------------------
malta_accept_demand: "Grant the Order Its Request"
malta_accept_demand_desc: "The council gives the order everything it asked for. The brothers go back to their posts satisfied, and the other orders take note of whom the council listens to."
malta_accept_demand_tt: "Pays the full price of the request. Order Cohesion rises, the order's grievance falls and its voice in the council grows."
malta_demand_unaffordable_tt: "The council cannot pay this price now."
malta_demand_accept_cost: "[GetMaltaDemandAcceptCost]"
malta_demand_accept_cost_blocked: "[GetMaltaDemandAcceptCostBlocked]"
malta_compromise_demand: "Offer Half of the Request"
malta_compromise_demand_desc: "The council offers half of what the order asked for and promises the rest when the campaign allows. An order accepts this kind of bargain only once."
malta_compromise_demand_tt: "Pays half the price. Order Cohesion rises by a smaller amount and the order's grievance stays where it is. The same order will not take a second compromise until it has been granted a full request."
malta_demand_compromise_cost: "[GetMaltaDemandCompromiseCost]"
malta_demand_compromise_cost_blocked: "[GetMaltaDemandCompromiseCostBlocked]"
malta_refuse_demand: "Refuse the Request"
malta_refuse_demand_desc: "The council keeps its treasury, its commands and its territory. The order is told that the crusade cannot afford it."
malta_refuse_demand_tt: "Costs nothing. Order Cohesion falls and the order's grievance rises. At the highest grievance the order opens an incident in the council."
malta_convene_joint_command: "Convene Joint Command"
malta_convene_joint_command_desc: "Marshals of several orders sit at one map table and agree on a front, a supply line and who relieves whom. It works when the orders trust one another."
malta_joint_command_requirement_tt: "Order Cohesion must be at the Working band or better, at least two orders must hold a seat, and no demand or incident may be open."
malta_convene_joint_command_tt: "Pays the cost. Usually the orders agree: Cohesion rises and the army fights with better planning and organization for a time. If the conference fails the rivalry is exposed, every order's grievance rises, Cohesion falls and the command loses a step of standing for a time."
malta_joint_command_success_tt: "The orders agree on one front."
malta_joint_command_failure_tt: "The conference breaks up in open quarrel."
malta_arbitrate_jerusalem: "Arbitrate the Custody of Jerusalem"
malta_arbitrate_jerusalem_desc: "The orders have held the city long enough to quarrel over it. The council can place Jerusalem under one authority and tell the others to accept it. The cost is paid when the council decides."
malta_arbitrate_requirement_tt: "The command must be Functional or better, Jerusalem must have been held for four months, and no demand or incident may be open."
malta_arbitrate_jerusalem_tt: "Convenes the council on the custody of Jerusalem. The decision can be made once."
malta_seize_order_treasury: "Seize an Order Treasury"
malta_seize_order_treasury_desc: "The war has outrun the funds, and some orders keep strong rooms in Valletta that no one has opened. The council can open one by order of the Grand Master."
malta_seize_requirement_tt: "The command must be Functional or better, and no demand or incident may be open."
malta_seize_order_treasury_tt: "Pays the cost and brings in political power, rifles and support equipment. Order Cohesion and Sacred Legitimacy fall sharply and every order's grievance rises. This can be done once."
malta_escort_sea_road: "Escort the Sea Road"
malta_escort_sea_road_desc: "The galleys and the escort vessels run in pairs between the Grand Harbour and the Holy Land coast for half a year, and the convoy masters are told to sail only in company."
malta_escort_sea_road_tt: "Pays the cost and opens a mission to keep the sea road open for five months."
malta_repair_holy_land_rail: "Repair the Holy Land Rail"
malta_repair_holy_land_rail_desc: "The sappers go out along the line from the coast to the inland towns with locomotives, rails and ballast, and the garrisons guard the cuttings behind them."
malta_repair_rail_tt: "Pays the cost and opens a mission to hold the Holy Land states while the work goes on."
malta_repair_rail_done_tt: "The line is repaired. Infrastructure improves in the Holy Land states that are still held."
malta_fortify_port: "Fortify a Port"
malta_fortify_port_desc: "Engineers raise a quay wall, widen the slips and set up workshops and billets for a headquarters. The work takes most of a year and the garrison must stay."
malta_fortify_port_tt: "Pays the cost and starts the works. Fortifying the Grand Harbour of Malta also opens a mission to protect it."
malta_fortify_port_done_tt: "The port works are finished. The state gains a building slot, better roads and a dockyard if it has a coast."
malta_emergency_air_bridge: "Open the Emergency Air Bridge"
malta_emergency_air_bridge_desc: "Transport aircraft carry ammunition and medical stores to the Holy Land and bring back the wounded while the sea road is closed."
malta_air_bridge_tt: "Pays the cost. Supply consumption falls for two months."
malta_issue_ultimatum: "Issue a Crusader Ultimatum"
malta_issue_ultimatum_desc: "An envoy carries a note under the eight-pointed cross to a government that holds towns and harbours the Order claims. The government may yield, pay for peace or refuse."
malta_issue_ultimatum_tt: "Pays the cost and sends the ultimatum. The government may cede the contested towns, pay tribute or refuse. A refusal leaves the regional crusade open."
malta_launch_regional_crusade: "Launch a Regional Crusade"
malta_launch_regional_crusade_desc: "Banners move against one government at a time. The Order claims the towns it means to take and declares war for those claims alone."
malta_launch_regional_crusade_tt: "Pays the cost, claims the registered towns of the target and declares war on it."
malta_settle_direct_commandery: "Establish a Direct Commandery"
malta_settle_direct_commandery_desc: "The state is governed by a commander of the Order with a small garrison, a tax office and an infirmary. It gives the council direct control and costs the Order its goodwill with local notables."
malta_settle_direct_tt: "Pays the cost. Compliance in the state rises and it gains a building slot. Order Cohesion falls slightly."
malta_settle_order_grant: "Grant a State to an Order"
malta_settle_order_grant_desc: "One order receives the state with the right to garrison it and collect its dues. The orders left out remember it."
malta_settle_order_grant_tt: "Opens the choice of the order. The order that receives the state gains a stronger voice and loses a grievance. The other orders resent it."
malta_charter_order_tt: "Pays the cost. Compliance and roads in the state improve, the chosen order gains influence and loses a grievance, and the other seated orders gain a grievance. The state cannot be settled again."
malta_settle_return_under_treaty: "Return the State under Treaty"
malta_settle_return_under_treaty_desc: "The council gives the state back to the government it was taken from in exchange for peace. The crusade loses ground and gains a hearing in the courts of Europe."
malta_settle_return_tt: "Pays the cost. The state returns to its former owner. Sacred Legitimacy rises and the command loses a step of standing for three months."
malta_hold_four_anchors_mission: "Hold the Four Anchors"
malta_hold_four_anchors_mission_desc: "Malta, Jerusalem, the sea road and a Holy Land port must stay in the same hands long enough for the command to be recognized."
malta_four_anchors_tt: "The command must be recognized: all four anchors held together for four months."
malta_four_anchors_success_tt: "Order Cohesion and Sacred Legitimacy rise. The command has shown that it can hold what it took."
malta_four_anchors_failure_tt: "Order Cohesion and Sacred Legitimacy fall. The opening crisis has not been mastered."
malta_keep_sea_road_open_mission: "Keep the Sea Road Open"
malta_keep_sea_road_open_mission_desc: "The convoys must reach the Holy Land for five months without a break in the chain of held islands and harbours."
malta_sea_road_hold_tt: "Malta and at least one bridge state must stay in Maltese hands for five months."
malta_sea_road_success_tt: "Supply consumption falls and the escorts work better for six months. Order Cohesion rises."
malta_sea_road_failure_tt: "Convoys are lost, and the command loses a step of standing for two months."
malta_guard_jordan_corridor_mission: "Guard the Jordan Corridor"
malta_guard_jordan_corridor_mission_desc: "The rail repair crews work along the line between the coast and the Jordan valley, and the garrisons must hold both ends while they do."
malta_corridor_hold_tt: "Both Holy Land states must stay in Maltese hands for four months."
malta_corridor_success_tt: "Sacred Legitimacy and command power rise."
malta_corridor_failure_tt: "Order Cohesion falls and the Jordan state becomes harder to govern."
malta_protect_grand_harbour_mission: "Protect the Grand Harbour"
malta_protect_grand_harbour_mission_desc: "Fort St Angelo and the quays must keep a garrison while the new works go up."
malta_harbor_hold_tt: "Malta must be held, with at least one division on the island, for four months."
malta_harbor_success_tt: "Order Cohesion and command power rise."
malta_harbor_failure_tt: "The harbour is damaged and the command loses a step of standing for two months."
malta_raise_armored_knights: "Raise an Armored Knight Banner"
malta_raise_armored_knights_desc: "Plate armour made in the order workshops goes on the best infantry of the garrison, and they train to hold the front line under fire."
malta_raise_armored_knights_tt: "Pays the cost and starts the training. A division of armored knights joins the army when it is finished."
malta_banner_done_tt: "The banner finishes training and joins the army."
malta_raise_mounted_column: "Raise a Mounted Crusader Column"
malta_raise_mounted_column_desc: "Horsemen from the Holy Land estates and the Cyprus stables ride under the order banners as scouts and as a mobile reserve."
malta_raise_mounted_column_tt: "Pays the cost and starts the training. A cavalry column joins the army when it is finished."
malta_raise_ranged_company: "Raise a Crossbow Levy"
malta_raise_ranged_company_desc: "Crossbowmen and light guns are drawn from the garrisons and drilled to defend a line the knights cannot be everywhere to hold."
malta_raise_ranged_company_tt: "Pays the cost and starts the training. An infantry division with guns joins the army when it is finished."
malta_raise_siege_host: "Raise a Siege Host"
malta_raise_siege_host_desc: "The siege brotherhoods bring their engines, their sappers and their carts to the front, and the host moves slowly behind the army."
malta_raise_siege_host_tt: "Pays the cost and starts the training. An artillery division joins the army when it is finished."
malta_train_crusader_engineers: "Train Crusader Engineers"
malta_train_crusader_engineers_desc: "The master of the siege works trains a company of sappers who build bridges, mend roads and dig out the fortified towns."
malta_train_engineers_tt: "Pays the cost and starts the training. A small engineer division joins the army when it is finished."
malta_evacuate_exposed_orders: "Evacuate the Exposed Orders"
malta_evacuate_exposed_orders_desc: "The convoys go back to the last held harbours for the wounded, the chaplains and the brothers who would be cut off."
malta_evacuate_tt: "Pays the cost and opens a mission to bring the survivors home."
malta_evacuation_mission: "The Evacuation"
malta_evacuation_mission_desc: "The ships must reach Malta with the survivors, and the island must be held until they land."
malta_evacuation_hold_tt: "Malta must be held for two months while the ships come in."
malta_evacuation_success_tt: "Order Cohesion and army experience rise. The survivors are home."
malta_evacuation_failure_tt: "Sacred Legitimacy falls. Many cadres did not come back."
malta_fortify_malta: "Fortify Malta"
malta_fortify_malta_desc: "Every bastion of Valletta and the Three Cities is manned, and the new stores are dug into the rock."
malta_fortify_malta_tt: "Pays the cost. Malta gains a building slot and better roads, and the island garrison defends better for eight months."
malta_call_for_volunteers: "Call for Volunteers"
malta_call_for_volunteers_desc: "Priests in a dozen countries read the Grand Master's letter from the pulpit, and ships bring young men who want to go on crusade."
malta_volunteers_tt: "Pays the cost. Manpower and army experience rise, and Sacred Legitimacy rises. The campaign has used foreign help."
malta_rebuild_transports_and_workshops: "Rebuild the Transports and Workshops"
malta_rebuild_transports_and_workshops_desc: "The dockyards and the order workshops turn out new transports and repair the old ones for the next landing."
malta_rebuild_tt: "Pays the cost. Convoys and fuel return, and a mission opens to gather a force for the landing."
malta_rebuild_eleventh_force_mission: "Gather the Landing Force"
malta_rebuild_eleventh_force_mission_desc: "The command needs enough divisions, convoys and rifles to land and to stay."
malta_rebuild_force_tt: "Enough divisions, convoys and rifles must be in hand."
malta_rebuild_force_success_tt: "The landing force is ready."
malta_rebuild_force_failure_tt: "Sacred Legitimacy falls. The landing can still go ahead with the force at hand, and it will be weaker."
malta_select_new_landing: "Choose a New Landing"
malta_select_new_landing_desc: "The council marks a coast for the Eleventh Crusade on the chart. Everything the army needs will be planned around it."
malta_select_landing_tt: "Chooses the government and the coast to land on."
malta_launch_eleventh_crusade: "Launch the Eleventh Crusade"
malta_launch_eleventh_crusade_desc: "The fleet sails with the landing force. Knights go ashore on the chosen coast, and the brothers dig in to hold it."
malta_launch_eleventh_tt: "Pays the cost, declares war on the chosen government and lands banners on its coast. A mission opens to hold the landing for four months."
malta_hold_new_foothold_mission: "Hold the New Foothold"
malta_hold_new_foothold_mission_desc: "The landing must be held long enough for pilgrims and supplies to follow."
malta_foothold_hold_tt: "The state of the landing must be held for four months."
malta_foothold_success_tt: "Sacred Legitimacy rises. The Eleventh Crusade has a foothold."
malta_foothold_failure_tt: "The landing fails. Sacred Legitimacy falls, the next attempt costs more, and after enough failures only the island settlement remains."
malta_restore_holy_land_command: "Restore the Holy Land Command"
malta_restore_holy_land_command_desc: "Jerusalem has been held long enough for the survivors to be sent home and the council to meet there again."
malta_restore_requirement_tt: "Jerusalem must be held for two months."
malta_restore_command_tt: "Ends the Eleventh Crusade and returns the expedition to its ordinary course. Order Cohesion and Sacred Legitimacy rise."
malta_accept_fortress_malta: "Accept a Fortress Malta Settlement"
malta_accept_fortress_malta_desc: "The council gives up the Holy Land and settles into a defensible island. The galleys keep their harbours and the pilgrims keep the road to Valletta."
malta_fortress_requirement_tt: "Malta must be fortified."
malta_accept_fortress_tt: "Ends the Eleventh Crusade and the expedition. Order Cohesion settles at a steady level and stability rises."
malta_incident_concede_tt: "Gives the order what it demands. Its grievance is cleared, its voice in the council grows, and Cohesion rises. Political power is spent."
malta_incident_arbitrate_tt: "Sends the dispute to the council. Cohesion rises a little and the grievance falls to a low level. Command power is spent."
malta_incident_suppress_tt: "The order obeys by force. Cohesion falls, the command loses a step of standing for three months and command power gains slow."
malta_posture_central_tt: "One command under the Grand Master. Command power rises and Order Cohesion falls."
malta_posture_balanced_tt: "The orders share the command. Order Cohesion rises."
malta_posture_civilian_tt: "The civil courts keep their say. Sacred Legitimacy and stability rise."
malta_owner_counterattack_tt: "War support rises and the border garrisons defend better for four months."
malta_owner_appeal_tt: "Political power rises."
malta_owner_hold_tt: "Stability and command power rise."
malta_catholic_support_tt: "Costs political power. Malta gains volunteers and Sacred Legitimacy."
malta_catholic_words_tt: "Malta gains a little Sacred Legitimacy."
malta_catholic_refusal_tt: "Malta loses a little Sacred Legitimacy."
malta_neighbour_conference_tt: "War support and stability rise."
malta_neighbour_resistance_tt: "Costs political power. Compliance falls in the Maltese-held states."
malta_neighbour_ports_tt: "Malta's supply consumption rises for four months."
malta_jerusalem_adjourn_tt: "Nothing is decided and nothing is paid."
malta_jerusalem_central_tt: "The council administers the city directly. Sacred Legitimacy rises and Order Cohesion falls."
malta_jerusalem_hospitallers_tt: "The Hospitallers keep the city. Their voice grows and Cohesion and Legitimacy rise. The Templars resent it."
malta_jerusalem_templars_tt: "The Templars keep the city. Their voice grows and Cohesion rises, Legitimacy rises a little. The Hospitallers resent it."
malta_jerusalem_compact_tt: "The Church of the Holy Sepulchre keeps the shrines under a compact with the council. Sacred Legitimacy rises greatly and the Templars resent it."
malta_ultimatum_accept_tt: "Cedes the contested towns to Malta."
malta_ultimatum_tribute_tt: "Pays Malta in political power."
malta_ultimatum_refuse_tt: "Malta is refused. The regional crusade stays open."
malta_fortress_without_a_hinterland: "Fortress Without a Hinterland"
malta_fortress_without_a_hinterland_desc: "Malta has bastions, a harbour and no fields, no coal and no space to build. Everything the army uses crosses the sea."
malta_fortified_network: "Fortified Network"
malta_fortified_network_desc: "The ports and forts of the Holy Land, Cyprus and Malta support one another now, and a convoy that cannot reach one harbour can reach the next."
malta_orders_recalled: "The Orders Recalled"
malta_orders_recalled_desc: "Several orders have returned under one council without agreeing on command, land or money."
malta_orders_united: "The Orders United"
malta_orders_united_desc: "The orders have found they can trust one another with a front, and the staff works from one set of orders."
malta_army_out_of_time: "An Army Out of Time"
malta_army_out_of_time_desc: "Knights in plate fight beside infantry in field grey. They break lines in the first hour and are hard to feed, to carry and to reinforce."
malta_banners_standardized: "Banners Standardized"
malta_banners_standardized_desc: "The workshops turn out armour, bows and carts to a common pattern, and every banner trains by the same book."
malta_joint_command: "Joint Command"
malta_joint_command_desc: "Marshals of several orders plan from one map."
malta_command_disarray: "Command in Disarray"
malta_command_disarray_desc: "An order has been forced to obey and the staff knows it."
malta_front_alarm: "Front Alarm"
malta_front_alarm_desc: "The border garrisons have been ordered forward and are watching the roads."
malta_seat_hospitallers: "Seat of the Hospitallers"
malta_seat_hospitallers_desc: "The Hospitallers staff the infirmaries and the relief columns, and the wounded return to the ranks sooner."
malta_seat_templars: "Seat of the Templar Revival"
malta_seat_templars_desc: "The Templar treasurers finance the workshops and the army's first assaults."
malta_seat_naval: "Seat of the Naval Orders"
malta_seat_naval_desc: "The Naval Orders run the harbours and the escorts that connect the held islands."
malta_seat_teutonic: "Seat of the Teutonic Chapter"
malta_seat_teutonic_desc: "The Teutonic Chapter trains the heavy infantry and holds the line."
malta_seat_lazarus: "Seat of the Order of Saint Lazarus"
malta_seat_lazarus_desc: "The brothers of Saint Lazarus nurse the sick that other orders send away, and fewer men die of fever in camp."
malta_seat_siege: "Seat of the Siege Brotherhoods"
malta_seat_siege_desc: "The siege brotherhoods build and mend bridges, fortifications and the engines of the army."
malta_sea_road_protected: "Sea Road Protected"
malta_sea_road_protected_desc: "The convoys sail in company and the escorts know the route."
malta_air_bridge: "Emergency Air Bridge"
malta_air_bridge_desc: "Transport aircraft carry stores to the Holy Land while the sea road is closed."
malta_island_garrison: "Island Garrison"
malta_island_garrison_desc: "Every bastion of Valletta and the Three Cities is manned."
malta_ports_closed: "Ports Closed to Malta"
malta_ports_closed_desc: "The neighbouring ports no longer take Maltese ships, and the convoys must sail farther for coal and water."
malta_compromise_used_tt: "The order has already taken a compromise since its last full grant."
malta_ultimatum_cooldown_tt: "The last ultimatum was sent less than a month and a half ago."
malta_one_crusade_tt: "No other regional crusade may be running."
malta_council_quiet_tt: "No demand or incident may be open in the council."
malta_return_cooldown_tt: "The council has returned a state less than two months ago."
malta_banner_cap_tt: "The council has no free banner slot. More slots come with a larger footprint."
malta_volunteers_credit_tt: "Sacred Legitimacy must not be discredited."
malta_launch_ready_tt: "The transports must be rebuilt and the landing force ready, and fewer than three landings may have failed."
malta_primacy_hospitallers: "Primacy of the Hospitallers"
malta_primacy_hospitallers_desc: "The Hospitallers set the tone of the Crusade. Hospitals and supply depots follow the army, and the knights spend lives more carefully than they spend ground."
malta_primacy_templars: "Primacy of the Templars"
malta_primacy_templars_desc: "The Templars set the tone of the Crusade. The banks, the workshops and the charge come first, and the council dislikes how fast they want to go."
malta_primacy_naval: "Primacy of the Naval Order"
malta_primacy_naval_desc: "The sea knights set the tone of the Crusade. Slips, escorts and harbour discipline come before the land campaign, and the yards take a larger share of the budget."
malta_primacy_teutonic: "Primacy of the Teutonic Knights"
malta_primacy_teutonic_desc: "The Teutonic Knights set the tone of the Crusade. Drill, discipline and staff work hold the line, and little is left to improvise at the Grand Master's table."
malta_primacy_lazarus: "Primacy of the Order of Saint Lazarus"
malta_primacy_lazarus_desc: "The Lazarites set the tone of the Crusade. Lazarettes and quarantine camps keep the army healthy, and the crusade is slower to ask its people for a second war."
malta_primacy_siege: "Primacy of the Siege Order"
malta_primacy_siege_desc: "The engineers set the tone of the Crusade. Fortress building and gun trains go first, and the columns move at the speed of their heaviest piece."
malta_assembly_of_langues: "Assembly of the Langues"
malta_assembly_of_langues_desc: "Every language of the Order sits at the table and no order can be passed over. The levy is broad and the council is quiet, but the Assembly is slow to agree on a plan."
malta_civil_constitution: "Civil Constitution"
malta_civil_constitution_desc: "The realm is governed by a written constitution and a civil service. Order and building are steady, and the knights have a smaller voice in the command."
malta_papal_administration: "Papal Administration"
malta_papal_administration_desc: "The Holy See names the officials of the realm. The people trust the Church to be just, and the army is asked to be careful in whose name it fights."
malta_kingdom_of_god: "Kingdom of God"
malta_kingdom_of_god_desc: "The whole realm is held to be one body under Heaven. The army fights with a certainty that no one else shares, and the people under it are watched closely."
malta_banners_unleashed: "Banners Unleashed"
malta_banners_unleashed_desc: "The knight banners have been told to attack. They hit harder and eat more than the staff planned for."
malta_holy_land_fortified: "Holy Land Fortified"
malta_holy_land_fortified_desc: "The garrisons in the Holy Land dig in faster and the forts around the shrines hold the ground."
malta_pilgrim_routes_open: "Pilgrim Routes Open"
malta_pilgrim_routes_open_desc: "Pilgrims travel the safe roads in groups under the knights' escort. The people are calmer and the garrisons hear more news."
malta_seat_hospitallers_senior: "Senior Seat of the Hospitallers"
malta_seat_hospitallers_senior_desc: "The Hospitallers have completed their path and serve the council with more weight."
malta_seat_templars_senior: "Senior Seat of the Templars"
malta_seat_templars_senior_desc: "The Templars have completed their path and serve the council with more weight."
malta_seat_naval_senior: "Senior Seat of the Naval Order"
malta_seat_naval_senior_desc: "The Naval Order have completed their path and serve the council with more weight."
malta_seat_teutonic_senior: "Senior Seat of the Teutonic Knights"
malta_seat_teutonic_senior_desc: "The Teutonic Knights have completed their path and serve the council with more weight."
malta_seat_lazarus_senior: "Senior Seat of the Lazarites"
malta_seat_lazarus_senior_desc: "The Lazarites have completed their path and serve the council with more weight."
malta_seat_siege_senior: "Senior Seat of the Siege Order"
malta_seat_siege_senior_desc: "The Siege Order have completed their path and serve the council with more weight."
malta_pr_key_1: "jerusalem"
malta_pr_key_2: "antioch"
malta_pr_key_3: "cyprus"
malta_pr_key_4: "tripoli"
malta_pr_key_5: "aegean"
malta_pr_key_6: "anatolia"
malta_pr_key_7: "africa"
malta_pr_status_5: "Loyal"
malta_pr_status_4: "Cooperative"
malta_pr_status_3: "Guarded"
malta_pr_status_2: "Defiant"
malta_pr_status_1: "Rebellious"
malta_pr_form_name_1: "a crown under Malta"
malta_pr_form_name_2: "an order state"
malta_pr_form_name_3: "a local Christian council"
malta_pr_form_name_4: "a Papal administration"
malta_pr_tribute_name_1: "light"
malta_pr_tribute_name_2: "standard"
malta_pr_tribute_name_3: "heavy"
malta_pr_duty_name_1: "soldiers"
malta_pr_duty_name_2: "rifles"
malta_pr_duty_name_3: "convoy hulls"
malta_pr_duty_name_4: "fuel"
malta_pr_duty_name_5: "taxes"
malta_charter_jerusalem: "Charter the Kingdom of Jerusalem"
malta_charter_jerusalem_desc: "A crown for Jerusalem is drafted under the protection of the Order. The kingdom holds the holiest city and the most exposed capital of the Holy Land."
malta_charter_jerusalem_tt: "Creates the Kingdom of Jerusalem from the held states of its region and makes it a subject of the realm. The realm keeps no direct output from the chartered states."
malta_pr_region_jerusalem_tt: "Jerusalem must be held by the Order."
malta_charter_antioch: "Charter the Principality of Antioch"
malta_charter_antioch_desc: "A frontier principality of fortresses, mountain roads and mixed churches is drafted for the northern Levant."
malta_charter_antioch_tt: "Creates the Principality of Antioch from the held states of its region and makes it a subject of the realm. The realm keeps no direct output from the chartered states."
malta_pr_region_antioch_tt: "Hatay, the city of Antioch, must be held by the Order."
malta_charter_cyprus: "Charter the Crusader Cyprus"
malta_charter_cyprus_desc: "Cyprus receives a court, a harbour board and a seat among the sea princes. The island stays the bridge between Malta and the Holy Land."
malta_charter_cyprus_tt: "Creates the Crusader Cyprus from the held states of its region and makes it a subject of the realm. The realm keeps no direct output from the chartered states."
malta_pr_region_cyprus_tt: "Cyprus must be held by the Order."
malta_charter_tripoli: "Charter the County of Tripoli"
malta_charter_tripoli_desc: "A maritime county is drafted for the Lebanese coast, with a regency council and a short list of duties. It keeps the harbours between Antioch and Jerusalem open."
malta_charter_tripoli_tt: "Creates the County of Tripoli from the held states of its region and makes it a subject of the realm. The realm keeps no direct output from the chartered states."
malta_pr_region_tripoli_tt: "Lebanon, the coast of Tripoli, must be held by the Order."
malta_charter_aegean: "Charter the Aegean Crusader State"
malta_charter_aegean_desc: "The island chapters of the Aegean are drafted into one league of fortified islands under a council of admirals."
malta_charter_aegean_tt: "Creates the Aegean Crusader State from the held states of its region and makes it a subject of the realm. The realm keeps no direct output from the chartered states."
malta_pr_region_aegean_tt: "Rhodes and one more island group of the Dodecanese, the Aegean Islands or Crete must be held by the Order."
malta_charter_anatolia: "Charter the Anatolian Order State"
malta_charter_anatolia_desc: "The southern Anatolian coast is given to a march led by an order, with a short land border and a port at its back."
malta_charter_anatolia_tt: "Creates the Anatolian Order State from the held states of its region and makes it a subject of the realm. The realm keeps no direct output from the chartered states."
malta_pr_region_anatolia_tt: "Mersin and one more of Antalya and Adana must be held by the Order."
malta_charter_africa: "Charter the North African March"
malta_charter_africa_desc: "The Libyan coast is drafted as a defensive port march that protects the western end of the sea road."
malta_charter_africa_tt: "Creates the North African March from the held states of its region and makes it a subject of the realm. The realm keeps no direct output from the chartered states."
malta_pr_region_africa_tt: "Tripolitania must be held by the Order."
malta_pr_standing_tt: "The command must be Recognized."
malta_pr_room_tt: "Four principalities may exist at once."
malta_pr_room_march_tt: "Four principalities may exist at once, and no more than two of them marches."
malta_pr_request_levy: "Request Levy from [FROM.GetName]"
malta_pr_request_levy_desc: "The charter obliges the principality to raise soldiers for the realm. A levy takes men and rifles from a land that needs both."
malta_pr_request_levy_tt: "Pays the cost. The principality sends manpower and rifles to the realm, its loyalty falls and it cannot be asked again for three months."
malta_pr_levy_cooldown_tt: "The principality met a levy less than three months ago."
malta_pr_guarded_tt: "The principality must be at least Guarded."
malta_pr_send_relief: "Send Relief to [FROM.GetName]"
malta_pr_send_relief_desc: "Rifles, fuel and convoy escorts reach a land under pressure. Princes remember who sent the ships."
malta_pr_send_relief_tt: "Pays the cost. The principality receives rifles and fuel, its loyalty rises and its stability improves for four months."
malta_pr_relief_cooldown_tt: "Relief was sent less than four months ago."
malta_pr_relief_need_tt: "The principality must be at war, occupied or below Cooperative."
malta_pr_enforce_charter: "Enforce the Charter in [FROM.GetName]"
malta_pr_enforce_charter_desc: "Banners and a notary arrive together. The charter is read aloud in the market and the defiant officials are replaced."
malta_pr_enforce_charter_tt: "Pays the cost. Loyalty rises, the principality cannot break away for four months and Sacred Legitimacy falls."
malta_pr_enforce_cooldown_tt: "The charter was enforced less than two months ago."
malta_pr_below_guarded_tt: "The principality must be below Guarded."
malta_pr_lighten_tribute: "Lighten the Tribute of [FROM.GetName]"
malta_pr_lighten_tribute_desc: "The duty of the charter is cut by half a step. The prince keeps more of what his land produces."
malta_pr_lighten_tribute_tt: "Pays the cost. The duty falls by one step and loyalty rises. The charter cannot be revised again for four months."
malta_pr_revise_cooldown_tt: "The charter was revised less than four months ago."
malta_pr_tribute_above_light_tt: "The tribute must be above the light level."
malta_pr_burden_tribute: "Burden the Tribute of [FROM.GetName]"
malta_pr_burden_tribute_desc: "The duty of the charter is raised by half a step. The realm takes more, and the prince notices."
malta_pr_burden_tribute_tt: "Pays the cost. The duty rises by one step and loyalty falls. The charter cannot be revised again for four months."
malta_pr_cooperative_tt: "The principality must be at least Cooperative."
malta_pr_burden_cooldown_tt: "The charter was revised less than four months ago."
malta_pr_tribute_below_heavy_tt: "The tribute must be below the heavy level."
malta_pr_arbitrate_heir: "Confirm the Heir of [FROM.GetName]"
malta_pr_arbitrate_heir_desc: "The council confirms the heir of the dead prince and the charter stays as it was written."
malta_pr_arbitrate_heir_tt: "Pays the cost. The succession is settled and the charter is unchanged."
malta_pr_crisis_tt: "The principality must be in a succession dispute."
malta_pr_arbitrate_order: "Back the Order Candidate of [FROM.GetName]"
malta_pr_arbitrate_order_desc: "A knight of the leading order is named as the next prince. The order gains a fortress, and the locals lose a voice."
malta_pr_arbitrate_order_tt: "Pays the cost. The principality becomes an order state, its loyalty falls and Order Cohesion rises."
malta_pr_arbitrate_local: "Back the Local Candidate of [FROM.GetName]"
malta_pr_arbitrate_local_desc: "A notable of the land receives the seal. The principality is calmer, and the council has fewer friends among the knights."
malta_pr_arbitrate_local_tt: "Pays the cost. The principality becomes a local Christian council, its loyalty rises and Sacred Legitimacy rises."
malta_pr_arbitrate_papal: "Appoint the Papal Candidate for [FROM.GetName]"
malta_pr_arbitrate_papal_desc: "The Holy See names the next prince. The clergy approve, and the lay lords wait to see what it costs them."
malta_pr_arbitrate_papal_tt: "Pays the cost. The principality becomes a Papal administration, its loyalty falls slightly and Sacred Legitimacy rises."
malta_pr_pope_tt: "The Holy See must have its seat in the realm."
malta_pr_begin_integration: "Begin Integration of [FROM.GetName]"
malta_pr_begin_integration_desc: "Clerks, engineers and a garrison move into the principality to bring its law and its taxes under the council. The work takes most of a year."
malta_pr_begin_integration_tt: "Pays the cost. The principality starts a staged integration. Its loyalty falls at the start. When the work is done its states become cores of the realm and the country ends."
malta_pr_integration_ready_tt: "The principality must be Cooperative, at least half a year old, free of a succession dispute and in control of all its land."
malta_pr_recognized_tt: "The command must be Recognized."
malta_pr_dissolve: "Dissolve the Charter of [FROM.GetName]"
malta_pr_dissolve_desc: "The principality has lost its land or its loyalty. The council takes back what remains and closes the charter."
malta_pr_dissolve_tt: "Pays the cost. The realm takes back the states the principality still controls, the charter ends and Sacred Legitimacy falls."
malta_pr_failed_tt: "The principality must be Defiant or worse, or hold no land under its own control."
malta_pr_federate_members: "Form the Principality Federation"
malta_pr_federate_members_desc: "The princes sit in one council with the Grand Master. The principalities share a court of arbitration, a common reserve and a single pilgrim road."
malta_pr_federate_members_tt: "Pays the cost. Every principality joins the federation, its loyalty rises and it gains a lasting bonus to stability and organisation. Order Cohesion and Sacred Legitimacy rise."
malta_pr_federation_members_tt: "At least two principalities must exist and every one must be Cooperative or better."
malta_pr_federation_cohesion_tt: "Order Cohesion must be Working or better."
malta_pr_party_crown: "The Royal Court"
malta_pr_party_crown_short: "Royal Court"
malta_pr_party_order: "The Chapter of the Order"
malta_pr_party_order_short: "Order Chapter"
malta_pr_party_local: "The Council of the Faithful"
malta_pr_party_local_short: "Faithful Council"
malta_pr_party_papal: "The Papal Vicariate"
malta_pr_party_papal_short: "Vicariate"
malta_pr_chartered_realm: "Chartered Realm"
malta_pr_chartered_realm_desc: "The land keeps its own court and its own law under a charter of the Order. The charter binds the prince as much as it protects him."
malta_pr_form_crown: "A Crown under Malta"
malta_pr_form_crown_desc: "A prince rules by a charter and a crown. The court is orderly and slow, and it answers to the realm in matters of war."
malta_pr_form_order: "An Order State"
malta_pr_form_order_desc: "The knights of a patron order hold the castles and the high offices. The army is strong and the town councils are afraid of it."
malta_pr_form_local: "A Council of the Faithful"
malta_pr_form_local_desc: "Local Christians govern their own affairs through a council of notables. The people are calm and the council raises fewer soldiers."
malta_pr_form_papal: "A Papal Vicariate"
malta_pr_form_papal_desc: "The Holy See names the officials of the land. The clergy keep the peace, and the lay lords do not welcome a war that is not their own."
malta_pr_pressure_jerusalem: "Prestige beyond Capacity"
malta_pr_pressure_jerusalem_desc: "The holiest city in the world is a poor capital. Every claim to it is heard and every administrator is stretched."
malta_pr_pressure_antioch: "An Exposed Northern Frontier"
malta_pr_pressure_antioch_desc: "Fortresses, mountain roads and long supply lines hold the frontier. The soldiers eat more than the land can grow."
malta_pr_pressure_cyprus: "Overburdened Ports"
malta_pr_pressure_cyprus_desc: "The ports of the island carry the trade and the troops of the whole eastern Mediterranean. The harbour board cannot build as fast as the quays fill."
malta_pr_pressure_tripoli: "A Narrow Coastline"
malta_pr_pressure_tripoli_desc: "The county is a strip of harbours between the mountains and the sea. It cannot raise many soldiers, and its yards are busy."
malta_pr_pressure_aegean: "Scattered Islands"
malta_pr_pressure_aegean_desc: "Every island has its own chapter, its own harbour and its own grievance. Supplies reach them by escort or not at all."
malta_pr_pressure_anatolia: "A Hostile Frontier"
malta_pr_pressure_anatolia_desc: "The march has a short land border and no friends behind it. Its garrisons hold the passes and its farmers wait for the next raid."
malta_pr_pressure_africa: "A Long Supply Road"
malta_pr_pressure_africa_desc: "The coast has ports and wells but no inland road. Convoys keep the march alive, and the desert wears down both men and trucks."
malta_pr_relief_received: "Relief from the Realm"
malta_pr_relief_received_desc: "Rifles, fuel and convoy escorts have arrived from the realm. The garrisons are fed and the people remember who sent the ships."
malta_pr_federation_member: "Member of the Federation"
malta_pr_federation_member_desc: "The principality sits in the common council of the princes and shares its reserve of grain and rifles. Its captains train with the others."
malta_pr_charters_open_tt: "The charters of the principalities can be drawn."
