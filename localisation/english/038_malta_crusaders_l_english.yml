# ---------------------------------------------------------------------------
# Events
# ---------------------------------------------------------------------------
chaosx.nr38.1.t: "Malta Crusaders"
chaosx.nr38.5.t: "Crusade Council Pulse"
chaosx.nr38.2.t: "The Crusade Is Underway"
chaosx.nr38.2.d: "The eight-pointed cross flies over Fort St Angelo again, and the same flag flies over Jerusalem and [GetMaltaBridgePhrase]. Knights in plate ride out beside infantry in field grey, volunteers have crossed from half a dozen Catholic countries, and the hospital galleys sail with the fleet.\n\nThe Hospitallers hold the infirmaries and the walls, the Templar revival holds the money, and the naval chapters hold the harbours that join them all. Each order expects its own way to be the one followed, so the council must now decide who gives the orders."
chaosx.nr38.2.a: "One command under the Grand Master."
chaosx.nr38.2.b: "A balanced council of the orders."
chaosx.nr38.2.c: "The civil courts keep their say."
chaosx.nr38.3.t: "Crusaders on Our Soil"
chaosx.nr38.3.d: "Armed men under the eight-pointed cross, supplied from Malta, have taken fortified towns and harbours that belonged to us. Their columns carry field hospitals and offer terms to the local clergy, and the villages have opened their gates faster than the garrisons expected.\n\nThe ministry of war asks how the frontier should be held."
chaosx.nr38.3.a: "Order the garrisons forward."
chaosx.nr38.3.b: "Appeal to the Great Powers."
chaosx.nr38.3.c: "Hold the frontier and wait for the invaders' supply to fail."
chaosx.nr38.4.t: "An Appeal from Valletta"
chaosx.nr38.4.d: "A chaplain of the Order of Saint John has come to our ministry with a letter from the Grand Master. It asks for volunteers, chaplains and money for a crusade that already holds Jerusalem. The cardinals are watching how the government answers, and the newspapers have printed photographs of knights kneeling in the Church of the Holy Sepulchre."
chaosx.nr38.4.a: "Open a collection and allow volunteers to sail."
chaosx.nr38.4.b: "Send a letter of goodwill and nothing more."
chaosx.nr38.4.c: "Refuse the request and say so in public."
chaosx.nr38.6.t: "Banners in the Levant"
chaosx.nr38.6.d: "Merchants arriving from the coast describe knights in white surcoats holding the harbours and the roads inland, with field hospitals set up in the churches. The ministry has asked the border commanders how long they could hold if the crusaders turned this way."
chaosx.nr38.6.a: "Call a regional defence conference."
chaosx.nr38.6.b: "Pay agents to organise resistance in the seized towns."
chaosx.nr38.6.c: "Close our ports to Maltese ships."
chaosx.nr38.7.t: "Crusaders Hold Jerusalem"
chaosx.nr38.7.d: "Maltese banners fly over Jerusalem, and the Order of Saint John announces that its Grand Master has taken command of the expedition. Correspondents in Haifa report columns of horsemen and infantry moving inland behind hospital trains, and the foreign ministries concerned have summoned the Maltese envoys."
chaosx.nr38.7.a: "The world takes note."
chaosx.nr38.8.t: "A Request from [GetMaltaDemandOrderName]"
chaosx.nr38.8.d: "[GetMaltaDemandIntro] [GetMaltaDemandRequest] The council must answer before the deadline, and a silence will be taken for a refusal."
chaosx.nr38.8.a: "Grant it in full."
chaosx.nr38.8.b: "Offer half."
chaosx.nr38.8.c: "Refuse."
chaosx.nr38.8.later: "The council will think it over."
chaosx.nr38.9.t: "A Rift in the Council"
chaosx.nr38.9.d: "[GetMaltaIncidentText] The council must decide whether to give way, to send the matter to arbitration or to bring the order to heel."
chaosx.nr38.9.a: "Give the order what it asks."
chaosx.nr38.9.b: "Send the matter to the council's arbitrators."
chaosx.nr38.9.c: "Bring the order to heel."
chaosx.nr38.10.t: "The Request Goes Unanswered"
chaosx.nr38.10.d: "The order waited out the council's deadline and took the silence for a refusal. Its representatives have left the chamber without a word."
chaosx.nr38.10.a: "The council notes it."
chaosx.nr38.14.t: "The Holy Land Is Lost"
chaosx.nr38.14.d: "The last columns of the expedition have fallen back on their ships, and the cross no longer flies over the Holy Land. In Valletta the bells ring for the dead, and the chaplains count the survivors on the quay. The orders blame one another, and the island council turns to the work of holding Malta while the transports are rebuilt."
chaosx.nr38.14.a: "Count the survivors."
chaosx.nr38.15.t: "The Cross Returns"
chaosx.nr38.15.d: "The standards of the Eleventh Crusade stand over the gates of Jerusalem, and the city has been held long enough for pilgrims to return. The orders have opened their books to the council again, and the quartermasters are planning the next harvest."
chaosx.nr38.15.a: "The expedition goes on."
chaosx.nr38.16.t: "Malta Closes Its Gates"
chaosx.nr38.16.d: "The council has resolved to keep what it can feed and defend. The galleys will carry the wounded home, the garrisons will man the bastions of Valletta, and pilgrim ships will still be welcome in the Grand Harbour."
chaosx.nr38.16.a: "The island endures."
chaosx.nr38.20.t: "Who Keeps Jerusalem"
chaosx.nr38.20.d: "The orders have held the city long enough to quarrel over it. The Hospitallers want the hospital quarter and the pilgrim roads, the Templars want the citadel and its revenues, and the clergy of the Holy Sepulchre want a say in both. The Grand Master has called them to the council table to settle the custody of the city."
chaosx.nr38.20.a: "The council adjourns without a decision."
chaosx.nr38.20.central: "The council administers the city directly."
chaosx.nr38.20.hospitallers: "The Hospitallers keep the city."
chaosx.nr38.20.templars: "The Templars keep the city."
chaosx.nr38.20.compact: "The shrines go under a compact with the Church."
chaosx.nr38.21.t: "A Charter for the Province"
chaosx.nr38.21.d: "The council will give [malta_grant_state.GetName] into the keeping of one order. Whichever order receives it will garrison it, collect its dues and name its bailiffs, and the others will remember who was passed over."
chaosx.nr38.21.a: "The council defers the grant."
chaosx.nr38.21.hospitallers: "Give it to the Hospitallers."
chaosx.nr38.21.templars: "Give it to the Templar Revival."
chaosx.nr38.21.naval: "Give it to the Naval Orders."
chaosx.nr38.21.teutonic: "Give it to the Teutonic Chapter."
chaosx.nr38.21.lazarus: "Give it to the Order of Saint Lazarus."
chaosx.nr38.21.siege: "Give it to the Siege Brotherhoods."
chaosx.nr38.30.t: "A Demand from Valletta"
chaosx.nr38.30.d: "A Maltese envoy has delivered a note under the eight-pointed cross. It asks for the cession of fortified towns and harbours that the Order claims for the Latin East, and it asks for an answer within the week."
chaosx.nr38.30.a: "Cede the towns."
chaosx.nr38.30.b: "Offer tribute for peace."
chaosx.nr38.30.c: "Refuse."
chaosx.nr38.31.t: "The Answer to the Ultimatum"
chaosx.nr38.31.accepted: "The government has yielded the contested towns. Our banners ride in without a shot, and the garrisons hand over their keys in the presence of a bishop."
chaosx.nr38.31.bargained: "The government has sent a sum of money and a promise of good conduct, and asks that the Order consider the matter closed."
chaosx.nr38.31.refused: "The government has refused our note and sent the envoy home under escort. The Order's claim stands and the way to a regional crusade is open."
chaosx.nr38.31.a: "The council takes note."
chaosx.nr38.40.t: "A Charter from the Grand Master"
chaosx.nr38.40.d: "The envoys of the Grand Master have read the charter in the great hall of [This.GetName]. The land keeps its own court, its own church and its own captains. In return it owes the realm [This.GetMaltaPrDutyName] every season and it stands under the protection of the Order. The prince signs, and the herald rides on."
chaosx.nr38.40.a: "The charter is sealed."
chaosx.nr38.41.t: "A Dispute over the Succession of [FROM.GetName]"
chaosx.nr38.41.d: "The prince of [FROM.GetName] is dead. Three candidates press their claims at the council: the heir, a knight of the leading order and a notable of the land. The Holy See has sent word that it would also like a say. The dispute must be settled within two months, or the local elite will settle it without the council."
chaosx.nr38.41.a: "The council will decide."
chaosx.nr38.42.t: "[FROM.GetName] Defies the Charter"
chaosx.nr38.42.d: "The officials of [FROM.GetName] have stopped answering the letters of the council, and the tax collectors return empty-handed. The prince says that the charter was written for a different year. The principality is [FROM.GetMaltaPrStatus] and will pay its duty only when something changes."
chaosx.nr38.42.a: "The council has noted it."
chaosx.nr38.43.t: "[FROM.GetName] Leaves the Charter"
chaosx.nr38.43.d: "The prince of [FROM.GetName] has torn up the charter. The banners of the principality have been recalled from the garrisons, and the envoys of the council have been sent home. The Order has lost a subject and the lands it held."
chaosx.nr38.43.a: "The loss is entered in the register."
chaosx.nr38.44.t: "[FROM.GetName] Joins the Realm"
chaosx.nr38.44.d: "The last clerk has signed the register. The land of [FROM.GetName] is governed from the council now. Its soldiers wear the cross of the Order and its taxes go to the common treasury."
chaosx.nr38.44.a: "A long work is done."
chaosx.nr38.45.t: "The End of [FROM.GetName]"
chaosx.nr38.45.d: "[FROM.GetName] holds no land. Its court has scattered and its charter means nothing. The council strikes the name from its rolls."
chaosx.nr38.45.a: "The charter is closed."
chaosx.nr38.46.t: "The Succession of [FROM.GetName] Is Settled without the Council"
chaosx.nr38.46.d: "The council did not answer in time, and the local elite named the next prince on its own. The principality remembers that the council was silent."
chaosx.nr38.46.a: "The council has lost a friend."
chaosx.nr38.47.t: "The Princes Sit Together"
chaosx.nr38.47.d: "The princes of the chartered lands, the Grand Master and the masters of the orders meet in one hall and sign the articles of the federation. The principalities will arbitrate their own disputes, share a reserve of grain and rifles and ride under one banner when the realm is attacked."
chaosx.nr38.47.a: "The federation is proclaimed."

# ---------------------------------------------------------------------------
# Event Details and event list
# ---------------------------------------------------------------------------
malta_crusaders.event_details.description: "The Order of Saint John rises as a crusader state. It holds Malta, Jerusalem and a chain of harbours and fortified towns in between, and the governments it took them from are at war with it from the first day. Knights in plate march beside infantry in field grey, the military orders quarrel over who commands them, and the Pope and the Catholic world watch the Grand Master. A defeat in the Holy Land leads to a second crusade to win it back, and a world at higher Chaos draws more orders, more territory and more relics into the war."
chaosx.events_log.events.na_reason.malta_crusaders_target: "Malta cannot rise as a crusader state because the island, the Holy Land or a sea bridge to it cannot be taken from their present owners."

# ---------------------------------------------------------------------------
# Achievements
# ---------------------------------------------------------------------------
chaos_redux_038_deus_vult_logistically_NAME: "Deus Vult, Logistically"
chaos_redux_038_deus_vult_logistically_DESC: "Hold Malta, Jerusalem, Cyprus and a supplied rail line together."
chaos_redux_038_deus_vult_logistically_tooltip: "As the Maltese player, prove the command by holding the four anchors, keep Cyprus and finish the Holy Land rail repair."
chaos_redux_038_the_eleventh_time_is_the_charm_NAME: "The Eleventh Time Is the Charm"
chaos_redux_038_the_eleventh_time_is_the_charm_DESC: "Lose the Holy Land, land again and keep a foothold."
chaos_redux_038_the_eleventh_time_is_the_charm_tooltip: "As the Maltese player, open the Eleventh Crusade after a sustained collapse, hold the new landing for four months and then restore the Holy Land command."
chaos_redux_038_malta_stands_alone_NAME: "Malta Stands Alone"
chaos_redux_038_malta_stands_alone_DESC: "Hold Jerusalem for a year and a half without a foreign sponsor."
chaos_redux_038_malta_stands_alone_tooltip: "As the Maltese player, reach a recognized command and hold Jerusalem eighteen months after the opening, without calling foreign volunteers or losing the expedition."

