# ---------------------------------------------------------------------------
# Header, demands, incidents and names read by scripted localisation
# ---------------------------------------------------------------------------
malta_order_the_1: "the Hospitallers"
malta_order_cap_1: "The Hospitallers"
malta_demand_intro_1: "The Grand Hospitaller comes from the infirmary of Valletta with his sleeves still rolled up. His brothers have carried the wounded of three fronts."
malta_incident_text_1: "The Hospitallers have stopped sending field hospitals to the front until their grievances are heard."
malta_order_the_2: "the Templar Revival"
malta_order_cap_2: "The Templar Revival"
malta_demand_intro_2: "The Preceptor of the Templar Revival lays a ledger on the council table and leaves it closed. His order has paid for the ships and the grain, and every man in the room knows it."
malta_incident_text_2: "The Templar treasurers have stopped paying out for the common stores, and the quartermasters report empty ledgers."
malta_order_the_3: "the Naval Orders"
malta_order_cap_3: "The Naval Orders"
malta_demand_intro_3: "The Admiral of the Galleys arrives in salt-stained boots, straight from the quay. His captains have kept the sea road open with a handful of hulls."
malta_incident_text_3: "The Naval Orders have kept their galleys in harbour and told the convoy masters to wait for new orders."
malta_order_the_4: "the Teutonic Chapter"
malta_order_cap_4: "The Teutonic Chapter"
malta_demand_intro_4: "The Komtur of the Teutonic Chapter stands at attention in his white mantle and black cross. His knights have drilled the new levies until they march in step."
malta_incident_text_4: "The Teutonic Chapter has withdrawn its officers from the joint staff and put its banners under its own marshal."
malta_order_the_5: "the Order of Saint Lazarus"
malta_order_cap_5: "The Order of Saint Lazarus"
malta_demand_intro_5: "The Master of the Order of Saint Lazarus speaks softly, because his brothers tend the sick that other orders send away. They have worked in every field hospital between Haifa and Valletta."
malta_incident_text_5: "The Order of Saint Lazarus has closed its lazarets to everyone who is not of its own brotherhood."
malta_order_the_6: "the Siege Brotherhoods"
malta_order_cap_6: "The Siege Brotherhoods"
malta_demand_intro_6: "The Master of the Siege Brotherhoods smells of lime and smoke. His engineers have rebuilt the engines and the walls, and they did it standing in the rain."
malta_incident_text_6: "The Siege Brotherhoods have taken their engines out of the line and placed them under guard."
malta_demand_request_1: "They ask for a share of the war chest to pay their own men and suppliers."
malta_demand_short_1: "a share of the war chest"
malta_demand_request_2: "They ask for a command of their own on the front, with orders that come from their master and not from the council."
malta_demand_short_2: "a command of their own"
malta_demand_request_3: "They ask for the right to recruit in the local parishes for a banner under their own colours."
malta_demand_short_3: "a banner of their own"
malta_demand_request_4: "They ask for a headquarters in [malta_demand_state.GetName], with its own garrison and its own storehouses."
malta_demand_short_4: "a headquarters in [malta_demand_state.GetName]"
malta_standing_name_1: "Fractured"
malta_standing_name_2: "Disputed"
malta_standing_name_3: "Functional"
malta_standing_name_4: "Recognized"
malta_standing_name_5: "Supreme"
malta_standing_next_1: "Hold at least two anchors to bring the command out of crisis."
malta_standing_next_2: "Hold a third anchor to open the regional campaigns."
malta_standing_next_3_partial: "Hold Malta, Jerusalem, the sea road and a Holy Land port together to be recognized."
malta_standing_next_3_all: "Hold all four anchors for §Y[?global.malta_pub_recognition_days|0]§! more days to be recognized."
malta_standing_next_4: "A completed settlement of the council would make the command supreme."
malta_standing_next_5: "The command has nothing left to prove to the council."
malta_cohesion_band_1: "Open Rivalry"
malta_cohesion_band_2: "Strained"
malta_cohesion_band_3: "Working"
malta_cohesion_band_4: "United"
malta_cohesion_next_1: "Settle the open grievance and reach 30 to end the rivalry."
malta_cohesion_next_2: "Reaching 50 opens Joint Command."
malta_cohesion_next_3: "Reaching 75 unites the orders."
malta_cohesion_next_4: "The orders stand together."
malta_legitimacy_band_1: "Discredited"
malta_legitimacy_band_2: "Contested"
malta_legitimacy_band_3: "Recognized"
malta_legitimacy_band_4: "Sacred Mandate"
malta_legitimacy_band_5: "Universal Claim"
malta_legitimacy_next_1: "Reaching 20 wins back the donors."
malta_legitimacy_next_2: "Reaching 40 opens ordinary religious diplomacy."
malta_legitimacy_next_3: "Reaching 65 gives the cause a sacred mandate."
malta_legitimacy_next_4: "Reaching 80 makes the claim universal."
malta_legitimacy_next_5: "The Church and the pilgrims believe in the cause."
malta_council_line_incident: "An incident is open: [GetMaltaIncidentText]"
malta_council_line_demand: "[GetMaltaDemandOrderNameCap] ask for [GetMaltaDemandShort]. The deadline is in §Y[?global.malta_pub_deadline_days|0]§! days."
malta_council_line_quiet: "No order has a request before the council."
malta_eleventh_line_1: "The expedition is lost and Malta must be held. Evacuate the survivors and fortify the island."
malta_eleventh_line_2: "The island is secure. Rebuild the transports, call for volunteers and choose a coast to land on."
malta_eleventh_line_chosen: "A coast is chosen. Gather the landing force and launch the crusade."
malta_eleventh_line_launched: "The landing is on the coast. Hold it to finish the crusade."
malta_eleventh_line_closed: "Too many landings have failed. Only the island settlement remains."
malta_eleventh_line_none: "The Eleventh Crusade is not needed."
