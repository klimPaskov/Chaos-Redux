l_english:
# Event 006 statehood incidents
chaosx.nr6.151.t: "Notes Without a Treasury"
chaosx.nr6.151.d: "Market stalls in [ROOT.Capital.GetName] refuse the old banknotes, and bakers chalk their prices in eggs and tobacco. The provisional treasury cannot open its vault: the last governor took the keys. The finance committee proposes printing a national currency or keeping the old notes for another season."
chaosx.nr6.151.a: "Print our own notes"
chaosx.nr6.151.a.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.151.b: "Let the old notes circulate"
chaosx.nr6.151.b.tt: "Legitimacy §R[?constant:independence_wave_value.standard_loss|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!.\nWhile the former host survives: Hostility §G[?constant:independence_wave_decision_effect.bilateral_minor_loss|0]§!, Host Obligations §R+[?constant:independence_wave_decision_effect.bilateral_minor|0]§!."
chaosx.nr6.151.c: "Back the new notes with customs revenue"
chaosx.nr6.151.c.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.152.t: "The Clerks Who Stayed Home"
chaosx.nr6.152.d: "Half the clerks in the district offices have not come to work since the proclamation. Many of them still draw pensions from [?independence_wave_former_host.GetNameDef], and they are waiting to learn whether serving us will cost them that money. The tax rolls and land registers sit in locked cabinets that nobody else knows how to read."
chaosx.nr6.152.a: "Promote local clerks into the empty posts"
chaosx.nr6.152.a.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §R[?constant:independence_wave_value.standard_loss|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.152.b: "Guarantee their pensions and rank"
chaosx.nr6.152.b.tt: "Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!.\nHostility with [?independence_wave_former_host.GetNameDef] §G[?constant:independence_wave_decision_effect.bilateral_minor_loss|0]§!."
chaosx.nr6.153.t: "Who Runs the Junction"
chaosx.nr6.153.d: "The railway junction and telegraph office on our side of the frontier are still staffed by employees of [?independence_wave_former_host.GetNameDef], who route every message through their old head office. Grain trains bound for our towns stand in the sidings until the dispatchers hear from across the border."
chaosx.nr6.153.a: "Take the junction with the militia"
chaosx.nr6.153.a.tt: "State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!, Security §G+[?constant:independence_wave_value.minor_gain|0]§!.\nHostility with [?independence_wave_former_host.GetNameDef] §R+[?constant:independence_wave_decision_effect.bilateral_standard|0]§!, Border Settlement §R[?constant:independence_wave_decision_effect.bilateral_minor_loss|0]§!."
chaosx.nr6.153.b: "Run the line under a joint commission"
chaosx.nr6.153.b.tt: "Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!.\nHostility with [?independence_wave_former_host.GetNameDef] §G[?constant:independence_wave_decision_effect.bilateral_minor_loss|0]§!, Host Obligations §R+[?constant:independence_wave_decision_effect.bilateral_minor|0]§!, Border Settlement §G+[?constant:independence_wave_decision_effect.bilateral_minor|0]§!."
chaosx.nr6.154.t: "Carts at the Border Posts"
chaosx.nr6.154.d: "Families from [?independence_wave_former_host.GetNameDef] are arriving at our border posts with carts, livestock and whatever else they could carry, and more come every night. Some fled conscription and some fled the arrests that followed our proclamation. A few carry papers that nobody at the posts can verify."
chaosx.nr6.154.a: "Open the posts and register them"
chaosx.nr6.154.a.tt: "Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!.\nHostility with [?independence_wave_former_host.GetNameDef] §R+[?constant:independence_wave_decision_effect.bilateral_minor|0]§!, Population Pressure §R+[?constant:independence_wave_decision_effect.bilateral_minor|0]§!."
chaosx.nr6.154.b: "Close the border posts"
chaosx.nr6.154.b.tt: "Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, Security §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.155.t: "A Legation Above the Pharmacy"
chaosx.nr6.155.d: "A foreign envoy has taken rooms above a pharmacy near the government offices in [ROOT.Capital.GetName]. His instructions allow him to open a legation only if our ministers receive him as the representative of a sovereign state, and he has asked for an audience before the end of the week."
chaosx.nr6.155.a: "Receive him with full honours"
chaosx.nr6.155.a.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Recognition §G+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.155.b: "Offer him a trade office instead"
chaosx.nr6.155.b.tt: "Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.156.t: "Recognition at a Price"
chaosx.nr6.156.d: "Several foreign ministries have let it be known that they would recognize [ROOT.GetNameDef] if we pledged to keep the army below a fixed number of battalions and to leave the frontier forts unmanned. Our officers have read the draft and want it sent back unsigned."
chaosx.nr6.156.a: "Sign the pledge"
chaosx.nr6.156.a.tt: "Recognition §G+[?constant:independence_wave_value.standard_gain|0]§!, Security §R[?constant:independence_wave_value.standard_loss|0]§!.\nWhile the former host survives: Hostility §G[?constant:independence_wave_decision_effect.bilateral_minor_loss|0]§!, Reconquest Fear §R+[?constant:independence_wave_decision_effect.bilateral_minor|0]§!."
chaosx.nr6.156.b: "Refuse to bargain over the army"
chaosx.nr6.156.b.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, Security §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.157.t: "Short by Three Votes"
chaosx.nr6.157.d: "A motion to recognize [ROOT.GetNameDef] failed by three votes at an international conference after two delegations abstained on instructions from home. Our delegates want to stay on and work on the abstainers, and the newspapers at home want them recalled."
chaosx.nr6.157.a: "Keep the delegation in session"
chaosx.nr6.157.a.tt: "Recognition §G+[?constant:independence_wave_value.standard_gain|0]§!, Network Standing §G+[?constant:independence_wave_decision_effect.network_minor|0]§!."
chaosx.nr6.157.b: "Recall the delegates in protest"
chaosx.nr6.157.b.tt: "Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, Recognition §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.158.t: "The Militia Keeps Its Rifles"
chaosx.nr6.158.d: "The volunteer companies that seized the town halls on the first night still answer to their own captains. They man checkpoints, collect tolls on the main roads and refuse to hand their rifles to the new general staff."
chaosx.nr6.158.a: "Disband them by decree"
chaosx.nr6.158.a.tt: "Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Security §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.158.b: "Enlist them as territorial battalions"
chaosx.nr6.158.b.tt: "Security §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.159.t: "Guards Across the River"
chaosx.nr6.159.d: "A company of frontier guards from [?independence_wave_former_host.GetNameDef] crossed the river at dawn with their rifles and a machine gun. Their lieutenant asks to serve [ROOT.GetNameDef] and says that more of his men will follow if this company is welcomed."
chaosx.nr6.159.a: "Enlist the company"
chaosx.nr6.159.a.tt: "Security §G+[?constant:independence_wave_value.standard_gain|0]§!.\nHostility with [?independence_wave_former_host.GetNameDef] §R+[?constant:independence_wave_decision_effect.bilateral_standard|0]§!, Host Pressure §R+[?constant:independence_wave_decision_effect.bilateral_minor|0]§!."
chaosx.nr6.159.b: "Return them under escort"
chaosx.nr6.159.b.tt: "Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!.\nHostility with [?independence_wave_former_host.GetNameDef] §G[?constant:independence_wave_decision_effect.bilateral_minor_loss|0]§!."
chaosx.nr6.160.t: "Captains Without Companies"
chaosx.nr6.160.d: "Our battalions have recruits and rifles but very few trained officers. Most of the experienced soldiers in the country learned their trade in the old army, and many of them still keep its medals in a drawer at home."
chaosx.nr6.160.a: "Recall the officers of the old army"
chaosx.nr6.160.a.tt: "Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Security §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.160.b: "Commission sergeants and students"
chaosx.nr6.160.b.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!, Security §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.161.t: "The Assembly in the School Hall"
chaosx.nr6.161.d: "Deputies chosen in the first weeks of independence have gathered in a school hall in [ROOT.Capital.GetName] and declared themselves a constituent assembly. They want the provisional ministers to answer to them and a full census taken before any further vote."
chaosx.nr6.161.a: "Seat the assembly and accept its authority"
chaosx.nr6.161.a.tt: "Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.161.b: "Postpone it until the borders are safe"
chaosx.nr6.161.b.tt: "Legitimacy §R[?constant:independence_wave_value.standard_loss|0]§!, Security §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.162.t: "Six More Months"
chaosx.nr6.162.d: "The army council that governs under the emergency decrees has asked to extend them for six more months, pointing to the frontier. The newspapers those decrees closed have started printing again from cellars and back rooms."
chaosx.nr6.162.a: "Extend the emergency decrees"
chaosx.nr6.162.a.tt: "Legitimacy §R[?constant:independence_wave_value.standard_loss|0]§!, Security §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.162.b: "Return the officers to their barracks"
chaosx.nr6.162.b.tt: "Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, Security §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.163.t: "The Provincial Councils"
chaosx.nr6.163.d: "Councils in the outlying provinces have stopped sending tax revenues to [ROOT.Capital.GetName] and keep their own police. Their leaders say they fought for independence too and will not exchange one distant government for another."
chaosx.nr6.163.a: "Give the provinces their own councils"
chaosx.nr6.163.a.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §G[?constant:independence_wave_value.standard_loss|0]§!."
chaosx.nr6.163.b: "Send commissioners from the capital"
chaosx.nr6.163.b.tt: "State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability §R+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.163.c: "Fund public works in the provinces"
chaosx.nr6.163.c.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.164.t: "Ministers Chosen Abroad"
chaosx.nr6.164.d: "Our most generous foreign backer has sent a list of men it would like to see in the cabinet, together with a statement of the credit it has already extended. Two of the names already sit on the provisional council."
chaosx.nr6.164.a: "Accept the backer's ministers"
chaosx.nr6.164.a.tt: "Legitimacy §R[?constant:independence_wave_value.standard_loss|0]§!, Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.164.b: "Dismiss the backer's men"
chaosx.nr6.164.b.tt: "Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.165.t: "A Member Asks for Rifles"
chaosx.nr6.165.d: "[independence_wave_statehood_member.GetNameDefCap] is at war and has asked every member of the League for rifles and field equipment. Its delegate reminds the League that its charter speaks of mutual aid, and that any member may one day need the same help."
chaosx.nr6.165.a: "Ship rifles from our depots"
chaosx.nr6.165.a.tt: "[independence_wave_statehood_member.GetNameDefCap] receives §Y[?constant:independence_wave_decision_cost.infantry_light|0]§! infantry equipment and §Y[?constant:independence_wave_decision_cost.support_light|0]§! support equipment.\nLeague Cohesion §G+[?constant:independence_wave_decision_effect.league_minor|0]§!, Member Confidence §G+[?constant:independence_wave_decision_effect.league_minor|0]§!, Network Standing §G+[?constant:independence_wave_decision_effect.network_minor|0]§!."
chaosx.nr6.165.b: "Send our regrets"
chaosx.nr6.165.b.tt: "Member Confidence §R[?constant:independence_wave_decision_effect.league_minor_loss|0]§!, Network Standing §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.166.t: "A Motion for Collective War"
chaosx.nr6.166.d: "Radical delegates have moved that the League declare a common war on any former host that still holds land claimed by a member. The motion has friends in the public gallery and in several war ministries, and the vote is set for tomorrow."
chaosx.nr6.166.a: "Vote for the motion"
chaosx.nr6.166.a.tt: "Common Cause §G+[?constant:independence_wave_decision_effect.league_standard|0]§!, League Cohesion §R[?constant:independence_wave_decision_effect.league_minor_loss|0]§!.\nWhile our former host survives, its Hostility §R+[?constant:independence_wave_decision_effect.bilateral_minor|0]§!."
chaosx.nr6.166.b: "Vote it down"
chaosx.nr6.166.b.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!.\nLeague Cohesion §G+[?constant:independence_wave_decision_effect.league_minor|0]§!, Common Cause §R[?constant:independence_wave_decision_effect.league_minor_loss|0]§!."
chaosx.nr6.167.t: "Rights Before Rifles"
chaosx.nr6.167.d: "Jurists from several member states have tabled a charter of civil rights that would bind every member of the League, including free elections within three years of independence. Our delegation must say whether [ROOT.GetNameDef] will sign it."
chaosx.nr6.167.a: "Sign the charter"
chaosx.nr6.167.a.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, League Cohesion §G+[?constant:independence_wave_decision_effect.league_minor|0]§!.\nUnder emergency military rule, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.167.b: "Refuse to bind our courts"
chaosx.nr6.167.b.tt: "Instability §G[?constant:independence_wave_value.minor_loss|0]§!.\nMember Confidence §R[?constant:independence_wave_decision_effect.league_minor_loss|0]§!, Network Standing §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.168.t: "Whose Flag for the Union"
chaosx.nr6.168.d: "Since talk of a wider union began, rival committees have printed their own flags for it. Veterans carry one design in their parades, the students carry another, and our partners abroad have sent a third with a request that we adopt it."
chaosx.nr6.168.a: "Keep our own colours at the centre"
chaosx.nr6.168.a.tt: "Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, Network Standing §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.168.b: "Adopt a neutral design"
chaosx.nr6.168.b.tt: "Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, Network Standing §G+[?constant:independence_wave_decision_effect.network_standard|0]§!."
chaosx.nr6.169.t: "Seats at the Founding Congress"
chaosx.nr6.169.d: "Delegates preparing the founding congress of the union cannot agree how its seats should be shared. The smaller members want one vote each, and the larger ones want seats in proportion to their population."
chaosx.nr6.169.a: "Seats by population"
chaosx.nr6.169.a.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!, Network Standing §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.169.b: "One member, one vote"
chaosx.nr6.169.b.tt: "Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Network Standing §G+[?constant:independence_wave_decision_effect.network_standard|0]§!."
chaosx.nr6.169.c: "Host the delegates at our expense"
chaosx.nr6.169.c.tt: "Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, Network Standing §G+[?constant:independence_wave_decision_effect.network_standard|0]§!."
chaosx.nr6.170.t: "The Army Wants One Command"
chaosx.nr6.170.d: "The union exists in law, and each member's battalions still answer to their own ministers and wear their own badges. The general staff asks for a single command now, before the first crisis tests the arrangement."
chaosx.nr6.170.a: "Merge the commands at once"
chaosx.nr6.170.a.tt: "Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, Security §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability §R+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.170.b: "Keep the member commands for now"
chaosx.nr6.170.b.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Security §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.171.t: "Clerks from Another New State"
chaosx.nr6.171.d: "A train has brought forty clerks, surveyors and teachers from another country born in the same wave. They offer to staff our ministries for a year, and they have brought their own forms, stamps and habits with them."
chaosx.nr6.171.a: "Accept the volunteers"
chaosx.nr6.171.a.tt: "Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, State Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!, Network Standing §G+[?constant:independence_wave_decision_effect.network_minor|0]§!."
chaosx.nr6.171.b: "Thank them and train our own people"
chaosx.nr6.171.b.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.172.t: "The Old Capitals Compare Files"
chaosx.nr6.172.d: "[?independence_wave_former_host.GetNameDefCap] and other governments that lost provinces in the wave have begun exchanging police files on separatist committees. Our people abroad report that their letters are opened and their relatives questioned."
chaosx.nr6.172.a: "Protect our committees abroad"
chaosx.nr6.172.a.tt: "Security §G+[?constant:independence_wave_value.minor_gain|0]§!, Network Standing §G+[?constant:independence_wave_decision_effect.network_minor|0]§!.\nHostility with [?independence_wave_former_host.GetNameDef] §R+[?constant:independence_wave_decision_effect.bilateral_minor|0]§!."
chaosx.nr6.172.b: "Disown the exile committees"
chaosx.nr6.172.b.tt: "Legitimacy §R[?constant:independence_wave_value.standard_loss|0]§!, Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!.\nHostility with [?independence_wave_former_host.GetNameDef] §G[?constant:independence_wave_decision_effect.bilateral_standard_loss|0]§!."
chaosx.nr6.173.t: "The Claimant at the Station"
chaosx.nr6.173.d: "A descendant of the old ruling house has stepped off the train with a trunk of family papers and a crowd of followers. He asks for no office, only a place at the independence celebrations, and the crowds already cheer his name louder than any minister's."
chaosx.nr6.173.a: "Give him a place of honour"
chaosx.nr6.173.a.tt: "Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.173.b: "Keep him away from the ceremonies"
chaosx.nr6.173.b.tt: "Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.174.t: "The Language of the Schoolroom"
chaosx.nr6.174.d: "Teachers returning after the summer do not know which language they are to teach in. Parents' committees have occupied two schools, and the old textbooks still open with a map of the former borders."
chaosx.nr6.174.a: "One national language in every school"
chaosx.nr6.174.a.tt: "Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.174.b: "Let each district choose"
chaosx.nr6.174.b.tt: "Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!, State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.175.t: "Colonels in the Ministry Corridors"
chaosx.nr6.175.d: "Officers from the units that won our independence have begun attending cabinet meetings without an invitation. Their spokesman, a colonel with his arm in a sling, says the army will not wait for the ministers to finish their arguments."
chaosx.nr6.175.a: "Give the army seats in the cabinet"
chaosx.nr6.175.a.tt: "Legitimacy §R[?constant:independence_wave_value.standard_loss|0]§!, Security §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.175.b: "Post the colonels to the frontier"
chaosx.nr6.175.b.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Security §R[?constant:independence_wave_value.standard_loss|0]§!, Instability §R+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.176.t: "Rifles Without Cartridges"
chaosx.nr6.176.d: "The depots seized in the first days held rifles of four different makes and cartridges for only two of them. Units in the field trade ammunition among themselves, and the quartermasters cannot say how much is left."
chaosx.nr6.176.a: "Standardise on one rifle and buy cartridges abroad"
chaosx.nr6.176.a.tt: "State Capacity §G+[?constant:independence_wave_value.minor_gain|0]§!, Security §G+[?constant:independence_wave_value.standard_gain|0]§!."
chaosx.nr6.176.b: "Strip the rear units to supply the front"
chaosx.nr6.176.b.tt: "State Capacity §R[?constant:independence_wave_value.minor_loss|0]§!, Security §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.177.t: "The Common Defence Clause"
chaosx.nr6.177.d: "The draft League charter binds every member to aid any member attacked by its former host. Delegates of the smaller members fear being drawn into wars far from home, and delegates of the members still facing their old rulers call the clause the only reason to belong."
chaosx.nr6.177.a: "Support a binding clause"
chaosx.nr6.177.a.tt: "Security §G+[?constant:independence_wave_value.minor_gain|0]§!, Common Cause §G+[?constant:independence_wave_decision_effect.league_standard|0]§!.\nWhile our former host survives, its Hostility §R+[?constant:independence_wave_decision_effect.bilateral_minor|0]§!."
chaosx.nr6.177.b: "Propose consultation instead of obligation"
chaosx.nr6.177.b.tt: "Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, League Cohesion §G+[?constant:independence_wave_decision_effect.league_minor|0]§!, Common Cause §R[?constant:independence_wave_decision_effect.league_minor_loss|0]§!."
chaosx.nr6.178.t: "Envelopes at the Secretariat"
chaosx.nr6.178.d: "A clerk at the League secretariat has handed a newspaper copies of payments from a foreign legation to three delegates. One of the three represents [ROOT.GetNameDef]."
chaosx.nr6.178.a: "Recall and try our delegate"
chaosx.nr6.178.a.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, Patron Capture §G[?constant:independence_wave_decision_effect.league_minor_loss|0]§!."
chaosx.nr6.178.b: "Stand by our delegate"
chaosx.nr6.178.b.tt: "Legitimacy §R[?constant:independence_wave_value.standard_loss|0]§!, League Cohesion §R[?constant:independence_wave_decision_effect.league_minor_loss|0]§!, Patron Capture §R+[?constant:independence_wave_decision_effect.league_minor|0]§!."
chaosx.nr6.179.t: "When a Member Is Invaded"
chaosx.nr6.179.d: "[independence_wave_statehood_member.GetNameDefCap] is at war with the state it left, and its government asks the League for a common answer. Three proposals are before the delegates: a joint ultimatum, a corps of volunteers, or an appeal for mediation."
chaosx.nr6.179.a: "Join a League ultimatum"
chaosx.nr6.179.a.tt: "Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, Security §R[?constant:independence_wave_value.minor_loss|0]§!, Common Cause §G+[?constant:independence_wave_decision_effect.league_standard|0]§!."
chaosx.nr6.179.b: "Raise a volunteer corps"
chaosx.nr6.179.b.tt: "[independence_wave_statehood_member.GetNameDefCap] receives §Y[?constant:independence_wave_decision_cost.infantry_light|0]§! infantry equipment and §Y[?constant:independence_wave_decision_cost.support_light|0]§! support equipment.\nShared Reserve §G+[?constant:independence_wave_decision_effect.league_minor|0]§!, Network Standing §G+[?constant:independence_wave_decision_effect.network_standard|0]§!."
chaosx.nr6.179.c: "Appeal for mediation"
chaosx.nr6.179.c.tt: "Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, League Cohesion §G+[?constant:independence_wave_decision_effect.league_minor|0]§!, Common Cause §R[?constant:independence_wave_decision_effect.league_minor_loss|0]§!."
chaosx.nr6.180.t: "A Constitution Written in the Streets"
chaosx.nr6.180.d: "Councils of workers, soldiers and students have begun drafting their own constitution in the public squares, reading each article aloud and voting by a show of hands. Their draft abolishes the provisional ministries and hands government to elected commissions."
chaosx.nr6.180.a: "Adopt the street constitution"
chaosx.nr6.180.a.tt: "Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, State Capacity §R[?constant:independence_wave_value.standard_loss|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.180.b: "Disperse the councils"
chaosx.nr6.180.b.tt: "Legitimacy §R[?constant:independence_wave_value.standard_loss|0]§!, Security §G+[?constant:independence_wave_value.minor_gain|0]§!, Instability §G[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.181.t: "Plans Against the Old Capitals"
chaosx.nr6.181.d: "Envoys from other new states have proposed a common plan for the day their former hosts move against them, with shared maps, a signal code and a promise to open second fronts. Our general staff has been asked to send a liaison officer."
chaosx.nr6.181.a: "Send the liaison officer"
chaosx.nr6.181.a.tt: "Recognition §R[?constant:independence_wave_value.minor_loss|0]§!, Security §G+[?constant:independence_wave_value.standard_gain|0]§!, Network Standing §G+[?constant:independence_wave_decision_effect.network_minor|0]§!.\nWhile our former host survives, its Hostility §R+[?constant:independence_wave_decision_effect.bilateral_standard|0]§!."
chaosx.nr6.181.b: "Stay out of the planning"
chaosx.nr6.181.b.tt: "Recognition §G+[?constant:independence_wave_value.minor_gain|0]§!, Network Standing §R[?constant:independence_wave_value.minor_loss|0]§!.\nWhile our former host survives, its Hostility §G[?constant:independence_wave_decision_effect.bilateral_minor_loss|0]§!."
