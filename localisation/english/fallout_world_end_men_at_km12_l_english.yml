l_english:
 chaosx.fallout.506.t: "The Men at Kilometer Twelve"
 chaosx.fallout.506.intro: "The road out of [This.GetName] narrows beside an ash-choked ravine. Twelve kilometers from the settlement, a checkpoint crew has placed a water barrel across the only pass. They claim to protect the route from raiders, yet every traveler sees the same rifles trained on the shelter carts. Their captain will accept food, a promise, a fight, or a contract."
 chaosx.fallout.506.a: "Pay for passage and keep the road open"
 chaosx.fallout.506.a.tt: "Send food, water, and recognition to the checkpoint. A delayed report will measure whether the tribute bought a safe corridor."
 chaosx.fallout.506.b: "Negotiate a water pass with the sentries"
 chaosx.fallout.506.b.tt: "Trade water and public recognition for a written passage. The result will depend on trust and the state's supply position."
 chaosx.fallout.506.c: "Take the checkpoint by force"
 chaosx.fallout.506.c.tt: "Spend fuel and power to attack the roadblock. Success gives the army a route, while failure damages the state and kills civilians through the Deaths system."
 chaosx.fallout.506.d: "Hire the guard band and bind them to the route"
 chaosx.fallout.506.d.tt: "Give food, scrap, and recognition to the local guards. They may become a useful militia or turn the road into a private toll."
 chaosx.fallout.508.pay_checkpoint.success.d: "The tribute reaches the checkpoint before dusk. The sentries lower their rifles and mark the barrel with our seal. Food carts pass under escort, and the road receives a short season of reliable supply."
 chaosx.fallout.508.pay_checkpoint.partial.d: "The tribute buys a narrow opening. The sentries still search every cart, but the road remains usable and the captain records our name. The arrangement will need a second payment."
 chaosx.fallout.508.pay_checkpoint.failure.d: "The tribute disappears into the ash. The checkpoint crew demands more, then fires over the carts when the answer is no. The road loses its rhythm and the shelter pays for the confusion."
 chaosx.fallout.508.negotiate_water_pass.success.d: "The water pass is written on a strip of treated metal. The sentries keep their rifles pointed outward, and travelers from the ravine are allowed through without a new toll. A small agreement becomes a corridor memory."
 chaosx.fallout.508.negotiate_water_pass.partial.d: "The captain accepts a verbal promise but refuses to sign. Two carts pass before the sentries close the road again. The bargain survives as a rumor, not a guarantee."
 chaosx.fallout.508.negotiate_water_pass.failure.d: "The negotiations collapse when a sentry accuses our messengers of hiding a second route. Water is spilled into the dust, the checkpoint shutters itself, and every nearby settlement hears that our word is weak."
 chaosx.fallout.508.attack_checkpoint.success.d: "The assault reaches the roadblock before the sentries can call their allies. The barrel is recovered, the rifles are stacked under guard, and the army learns that the route can be held without tribute."
 chaosx.fallout.508.attack_checkpoint.partial.d: "The checkpoint breaks but the pass is scarred by fire. Several sentries flee into the ravine, and the road is open only to vehicles with escorts. Victory has created a second border."
 chaosx.fallout.508.attack_checkpoint.failure.d: "The attack fails in the frost. A fuel truck burns beside the barrier, and the sentries answer with shots into the shelter queue. The route becomes a raider road, and the dead are entered in the local Deaths ledger."
 chaosx.fallout.508.hire_guard_band.success.d: "The guard band signs the route contract with names and thumbprints. They escort water carts, patrol the culverts, and accept a council's inspection. A private checkpoint becomes the first armed service of the corridor."
 chaosx.fallout.508.hire_guard_band.partial.d: "The guards take the supplies and protect one convoy. After that they begin charging travelers by household, and the captain refuses to explain where the scrap went. The road is safer, but trust is now rented."
 chaosx.fallout.508.hire_guard_band.failure.d: "The guard band takes the payment, removes the barrel, and vanishes into the snow. Their rifles appear at three smaller crossings before the week is over. A contract has taught the raiders how to organize."
 chaosx.fallout.510.t: "The Kilometer Twelve Ledger"
 chaosx.fallout.510.success.d: "The delayed patrol report confirms that the route has held. The checkpoint crew honors the chosen arrangement, and the settlements on both sides begin planning deliveries around a road that can be trusted."
 chaosx.fallout.510.partial.d: "The delayed report is mixed. The route exists, but every convoy still carries a second plan and a spare guard. The checkpoint has become a fact of life rather than a solved problem."
 chaosx.fallout.510.failure.d: "The delayed report finds the barrel overturned and the route empty. Raiders have copied the checkpoint's signs farther down the road. The corridor memory closes as a warning to every future convoy."
 chaosx.fallout.510.a: "File the route report and close the ledger"
 chaosx.fallout.510.a.tt: "Resolve the checkpoint callback and release the Fallout scheduler receipt."
 fallout.event_log.men_at_km12.name: "The Men at Kilometer Twelve"
 fallout.event_log.men_at_km12.detail: "[GetFalloutEvent506EventLogDetail]"
 fallout.event_log.men_at_km12.pay_checkpoint_success: "Tribute opened the checkpoint and kept the road supplied."
 fallout.event_log.men_at_km12.pay_checkpoint_partial: "Tribute bought a narrow opening with another payment due."
 fallout.event_log.men_at_km12.pay_checkpoint_failure: "Tribute failed and the checkpoint made the road less safe."
 fallout.event_log.men_at_km12.negotiate_water_pass_success: "A written water pass created a durable corridor memory."
 fallout.event_log.men_at_km12.negotiate_water_pass_partial: "A verbal water pass opened the road for only a short time."
 fallout.event_log.men_at_km12.negotiate_water_pass_failure: "The water negotiation collapsed and the road closed."
 fallout.event_log.men_at_km12.attack_checkpoint_success: "The army took the checkpoint and held the route."
 fallout.event_log.men_at_km12.attack_checkpoint_partial: "The army broke the checkpoint but left a scarred pass."
 fallout.event_log.men_at_km12.attack_checkpoint_failure: "The attack failed and civilians died beside the barrier."
 fallout.event_log.men_at_km12.hire_guard_band_success: "A hired guard band became a supervised corridor militia."
 fallout.event_log.men_at_km12.hire_guard_band_partial: "A hired guard band protected the road while charging private tolls."
 fallout.event_log.men_at_km12.hire_guard_band_failure: "A hired guard band became a mobile raider problem."
 fallout.event_log.men_at_km12.callback_success: "The delayed patrol confirmed a route that could be trusted."
 fallout.event_log.men_at_km12.callback_partial: "The delayed patrol found a route that remained conditional."
 fallout.event_log.men_at_km12.callback_failure: "The delayed patrol found the checkpoint memory had failed."
