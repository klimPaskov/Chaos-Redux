l_english:
chaosx.fallout.733.t: "Children of the Cordon"
chaosx.fallout.733.d: "The children raised behind the quarantine gates have learned every route by its lock, its lamp, and the name on the permit. They have also learned that a movement law can outlive the emergency that created it. The North Gate council must decide whether the next cohort will reform the rules, earn travel through public service, keep the cordon strict, or let each ward govern its own crossings."
chaosx.fallout.733.a: "Rewrite the movement law"
chaosx.fallout.733.b: "Open service travel"
chaosx.fallout.733.c: "Continue the strict cordon"
chaosx.fallout.733.d_option: "Give the wards their own boards"
chaosx.fallout.733.a.tt: "Spend [?constant:fallout_event_733_cost.reform_food|0] Food, [?constant:fallout_event_733_cost.reform_power|0] Power, and [?constant:fallout_event_733_cost.reform_scrap|0] Scrap. The delayed result tests the cohort's trust and the country's shelter, Food, Cohesion, and movement law."
chaosx.fallout.733.b.tt: "Spend [?constant:fallout_event_733_cost.service_travel_food|0] Food, [?constant:fallout_event_733_cost.service_travel_scrap|0] Scrap, and [?constant:fallout_event_733_cost.service_travel_recognition|0] Recognition. Service permits can widen travel while creating a future pool of route leaders."
chaosx.fallout.733.c.tt: "Spend [?constant:fallout_event_733_cost.strict_continuation_food|0] Food, [?constant:fallout_event_733_cost.strict_continuation_medicine|0] Medicine, and [?constant:fallout_event_733_cost.strict_continuation_recognition|0] Recognition. The strict route protects the old gates but asks the next cohort to accept their burden."
chaosx.fallout.733.d_option.tt: "Spend [?constant:fallout_event_733_cost.local_food|0] Food, [?constant:fallout_event_733_cost.local_medicine|0] Medicine, and [?constant:fallout_event_733_cost.local_recognition|0] Recognition. Ward boards can build local legitimacy while weakening one central rule."

chaosx.fallout.735.t: "A Generation at the Gate"
chaosx.fallout.735.reform.success.d: "The young registrars opened the old movement law line by line. A permit now records the route, the shelter receiving its traveller, and the public duty that made the crossing possible. The first cohort has turned protest into a civic apprenticeship."
chaosx.fallout.735.reform.partial.d: "The council accepted a narrower reform. The children can challenge a denial and carry a stamped route card, yet the outer shelters still wait for a rule that reaches them without a sponsor."
chaosx.fallout.735.reform.failure.d: "The reform meeting ended with the gates closed and the youth ledger marked as a warning. The next cohort now knows that an appeal can become another checkpoint when Food and trust run short."
chaosx.fallout.735.service_travel.success.d: "Service crews crossed the cordon with clinic kits, rail tools, and names that every ward could verify. Travel is no longer a favour from one gatehouse. It is a public route that trains the people who will lead it."
chaosx.fallout.735.service_travel.partial.d: "The service route reached the central shelters and one damaged outpost. The first permits work, but a missing fuel ledger leaves the outer wards unsure whether travel belongs to everyone or only to the most useful crew."
chaosx.fallout.735.service_travel.failure.d: "A permit convoy arrived without the medicine and recognition promised to the gate crews. The children saw the service seal become another privilege, and the movement law tightened around the broken promise."
chaosx.fallout.735.strict_continuation.success.d: "The council kept every gate, but it gave the next cohort a clear duty roster, protected shelter places, and a voice in the inspection room. The cordon remains severe, yet it is no longer allowed to pretend that young people are only subjects."
chaosx.fallout.735.strict_continuation.partial.d: "The strict route held the checkpoints together while the youth delegates received a place behind the ledger desk. They can report abuse, but the movement law still treats an unsponsored journey as a threat."
chaosx.fallout.735.strict_continuation.failure.d: "The strict continuation made the gates orderly and the streets quiet. It also made the second generation a single grievance with no legal route outward. The cordon has secured obedience without securing a future."
chaosx.fallout.735.local.success.d: "Each ward elected a crossing board from the families who know its shelters. The boards share a common registry, yet they may grant local passage without waiting for the North Gate to decide every journey."
chaosx.fallout.735.local.partial.d: "The ward boards opened a handful of local routes and wrote their first appeals. The central registry still overrules distant shelters, but the second generation has a government route that begins at home."
chaosx.fallout.735.local.failure.d: "The ward boards split over medicine, recognition, and whose children count as local. The central office kept the final seal, while every ward learned that autonomy without a shared ledger can create smaller cordons."
chaosx.fallout.735.a: "Publish the cohort route"
chaosx.fallout.735.a.tt: "Apply the chosen movement-law result, record one Fallout memory, and schedule a delayed cohort callback after [?constant:fallout_event_733_timing.callback_delay_days|0] days. A failure uses the Deaths contract."

chaosx.fallout.737.t: "The Permit Children Return"
chaosx.fallout.737.success.d: "The cohort returned from its first season of crossings with route leaders of its own. Youth trust has become a public resource, and the government route now remembers who opened it."
chaosx.fallout.737.partial.d: "The cohort kept the route alive, though the far shelters still depend on old gatekeepers. The movement law has shifted enough for a second generation to measure its future against it."
chaosx.fallout.737.failure.d: "The callback found the cohort split between a locked registry and an empty service ledger. The route survives as a memory of promises that the cordon could not keep."
chaosx.fallout.737.a: "Close the generation record"
chaosx.fallout.737.a.tt: "Apply the cohort callback, close the government-route memory, and release both delayed Fallout receipts. A failed callback uses the callback Deaths contract."

fallout.event_log.children_of_cordon.name: "Children of the Cordon"
fallout.event_log.children_of_cordon.detail: "[GetFalloutEvent733EventLogDetail]"
fallout.event_log.children_of_cordon.detail.reform_success: "The second generation rewrote the movement law and turned its appeal ledger into civic apprenticeship."
fallout.event_log.children_of_cordon.detail.reform_partial: "The second generation won a narrow appeal route while the outer shelters remained behind the old rule."
fallout.event_log.children_of_cordon.detail.reform_failure: "The reform meeting closed the gate and left the youth ledger as a warning."
fallout.event_log.children_of_cordon.detail.service_travel_success: "Service crews made travel a public route and trained the people who would lead it."
fallout.event_log.children_of_cordon.detail.service_travel_partial: "Service permits reached the central shelters while distant wards waited for fuel and trust."
fallout.event_log.children_of_cordon.detail.service_travel_failure: "A failed service convoy turned its seal into another privilege and tightened the movement law."
fallout.event_log.children_of_cordon.detail.strict_continuation_success: "The cordon stayed severe but gave its children a protected duty and a voice in the inspection room."
fallout.event_log.children_of_cordon.detail.strict_continuation_partial: "Strict gates held while youth delegates gained only a narrow right to report abuse."
fallout.event_log.children_of_cordon.detail.strict_continuation_failure: "The strict route secured obedience and left the second generation with one shared grievance."
fallout.event_log.children_of_cordon.detail.local_success: "Ward crossing boards opened local passage under one shared registry."
fallout.event_log.children_of_cordon.detail.local_partial: "Ward boards opened a few routes and gave the second generation a government route that began at home."
fallout.event_log.children_of_cordon.detail.local_failure: "Ward boards split over recognition and made smaller cordons before the central seal returned."
fallout.event_log.children_of_cordon.detail.callback_success: "The permit children returned as route leaders with a durable government-route memory."
fallout.event_log.children_of_cordon.detail.callback_partial: "The cohort kept the route alive while far shelters still depended on old gatekeepers."
fallout.event_log.children_of_cordon.detail.callback_failure: "The cohort callback found a locked registry and an empty service ledger."

