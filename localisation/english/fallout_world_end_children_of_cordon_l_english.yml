fallout_children_of_cordon_service_travel: "Service Travel Registry"
fallout_children_of_cordon_service_travel_desc: "Verified public work opens travel and trains future route leaders."
fallout_children_of_cordon_strict_continuation: "Strict Cordon Continuation"
fallout_children_of_cordon_strict_continuation_desc: "The gates stay severe while youth delegates gain a narrow civic duty."
fallout_children_of_cordon_local_autonomy: "Ward Crossing Boards"
fallout_children_of_cordon_local_autonomy_desc: "Local boards grant passage under a shared registry."
fallout_children_of_cordon_maintained: "Cordon Route Maintained"
fallout_children_of_cordon_maintained_desc: "The second generation keeps a functioning government route after its first season."
fallout_children_of_cordon_failed: "Cordon Generation Strain"
fallout_children_of_cordon_failed_desc: "A broken route leaves youth trust and shelter coordination under pressure."
