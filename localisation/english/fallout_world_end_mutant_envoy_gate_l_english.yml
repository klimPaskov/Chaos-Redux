chaosx.fallout.761.t: "The Envoy at the Gate"
chaosx.fallout.761.opening.d: "At the lowest river gate in the Congo Green Basin, a delegation arrives with sealed papers, trade samples, and a request to speak as a government. The council will not turn altered bodies into a diagnosis. It must decide whether recognition begins with a public charter, a voluntary inspection, a symbolic meeting, or a closed gate."
chaosx.fallout.761.a: "Open recognition"
chaosx.fallout.761.a.tt: "Spend Food 3, Medicine 1, and Recognition 3 to recognize the envoy publicly and begin a reciprocal rights charter."
chaosx.fallout.761.b: "Offer a voluntary inspection"
chaosx.fallout.761.b.tt: "Spend Scrap 2, Power 3, and Recognition 3 to offer a consent-based inspection with the same terms on both sides."
chaosx.fallout.761.c: "Hold a symbolic meeting"
chaosx.fallout.761.c.tt: "Spend Fuel 4 and Recognition 2, then accept a Cohesion cost, to meet at the bridge without opening settlement access."
chaosx.fallout.761.d: "Refuse contact"
chaosx.fallout.761.d.tt: "Spend Food 2, Medicine 3, Fuel 2, and Recognition 2 to close the gate and return the envoy under a recorded refusal."
chaosx.fallout.762.t: "The Envoy at the Gate"
chaosx.fallout.763.t: "A River Gate Answers"
chaosx.fallout.763.open_recognition.success.d: "The council read the charter aloud beside the river. The envoy received a public seat, the neighboring government accepted the same rights for Basin travelers, and the first trade list names people rather than bodies."
chaosx.fallout.763.open_recognition.partial.d: "The charter reached the gatehouse and one neighboring clerk signed it. The Basin council has a recognized interlocutor, but the road crews still wait for a promise that reaches beyond the river post."
chaosx.fallout.763.open_recognition.failure.d: "The public charter broke over the question of who could speak for the altered districts. The envoy left with a copy bearing no seal, while both governments kept their border officers in place."
chaosx.fallout.763.medical_inspection.success.d: "The inspection took place by consent, with Basin physicians and the envoy's own observers reading the same ledger. No one was detained, and both governments agreed that travel papers describe obligations rather than an imagined cure."
chaosx.fallout.763.medical_inspection.partial.d: "The inspection teams agreed on clean consent forms and a shared list of medicines. They did not agree on who stores the records, so the river gate opens only for named visits."
chaosx.fallout.763.medical_inspection.failure.d: "The inspection table became an interrogation table. The envoy's observers withdrew, the Basin council locked the sample crates, and the neighboring government now treats every request for a record as a demand for control."
chaosx.fallout.763.symbolic_meeting.success.d: "The two delegations met on the bridge and exchanged river seals. No settlement changed hands, yet the new marks let ferrymen identify a government that will answer when a crossing goes wrong."
chaosx.fallout.763.symbolic_meeting.partial.d: "The bridge meeting produced a shared flag and a list of names for the next crossing. The councils kept their gates closed after dusk, leaving the gesture useful but still fragile."
chaosx.fallout.763.symbolic_meeting.failure.d: "The meeting ended when the bridge guards argued over which seal could be displayed. The envoy returned home without a public insult, but the next delegation will arrive with armed escorts."
chaosx.fallout.763.refuse_contact.success.d: "The Basin council closed the gate, recorded the refusal, and returned the envoy with food for the road. The border is quiet for now, while the neighboring government knows exactly which office must be approached again."
chaosx.fallout.763.refuse_contact.partial.d: "The refusal kept the gatehouse secure but sent unlicensed traders toward the marsh crossing. The council saved its stores and lost the chance to set the first terms of contact."
chaosx.fallout.763.refuse_contact.failure.d: "The gate closed without a receipt or a safe route home. The envoy's government withdrew its liaison, and the Basin council now has to explain why a recorded border became an unrecorded threat."
chaosx.fallout.763.a: "Record the envoy's answer"
chaosx.fallout.763.a.tt: "Apply the graded first-contact result, preserve the bilateral memory, and schedule the delayed gate review."
chaosx.fallout.765.t: "The Gate Remembers"
chaosx.fallout.765.success.d: "The delayed review finds a relationship that can carry names, medicine, and a reply across the river. The envoy's government keeps its seat, and the Congo Green Basin has a first-contact rule that does not depend on fear."
chaosx.fallout.765.partial.d: "The delayed review keeps the relationship alive, though the bridge seals and medicine lists still require a clerk from both governments. The first envoy has become a precedent, not yet a routine."
chaosx.fallout.765.failure.d: "The delayed review finds a gate guarded by old suspicions. The envoy's government has withdrawn its liaison, and the Basin council must decide whether the next contact will be a negotiation or a test of the border."
chaosx.fallout.765.a: "Close the envoy record"
chaosx.fallout.765.a.tt: "Apply the delayed bilateral outcome, record the final memory, and release the reserved state and neighbor rows."
fallout.event_log.mutant_envoy_gate.name: "The Envoy at the Gate"
fallout.event_log.mutant_envoy_gate.detail: "[GetFalloutEvent761EventLogDetail]"
fallout.event_log.mutant_envoy_gate.detail.choice_open_recognition: "The Congo Green Basin council opened the river gate and offered a public rights charter."
fallout.event_log.mutant_envoy_gate.detail.choice_medical_inspection: "The two delegations offered a voluntary, reciprocal inspection at the river gate."
fallout.event_log.mutant_envoy_gate.detail.choice_symbolic_meeting: "The governments met on the bridge and exchanged seals without opening settlement access."
fallout.event_log.mutant_envoy_gate.detail.choice_refuse_contact: "The Congo Green Basin council recorded a refusal and returned the envoy from the closed gate."
fallout.event_log.mutant_envoy_gate.detail.open_recognition_success: "The public charter won recognition for Basin travelers and a signed place for the envoy."
fallout.event_log.mutant_envoy_gate.detail.open_recognition_partial: "The charter reached one neighboring clerk while the river road remained unsettled."
fallout.event_log.mutant_envoy_gate.detail.open_recognition_failure: "The charter broke over representation, leaving both governments behind their border officers."
fallout.event_log.mutant_envoy_gate.detail.medical_inspection_success: "The consent-based inspection shared records without detention and set reciprocal travel terms."
fallout.event_log.mutant_envoy_gate.detail.medical_inspection_partial: "The inspection teams agreed on consent and medicine but not on custody of the records."
fallout.event_log.mutant_envoy_gate.detail.medical_inspection_failure: "The inspection became an interrogation and the envoy's observers withdrew."
fallout.event_log.mutant_envoy_gate.detail.symbolic_meeting_success: "The bridge meeting exchanged river seals and gave ferrymen a government that would answer."
fallout.event_log.mutant_envoy_gate.detail.symbolic_meeting_partial: "The bridge meeting produced shared marks while the gates still closed after dusk."
fallout.event_log.mutant_envoy_gate.detail.symbolic_meeting_failure: "The delegations left the bridge after guards disputed which seal could be displayed."
fallout.event_log.mutant_envoy_gate.detail.refuse_contact_success: "The refusal kept the gate quiet and returned the envoy with a recorded route home."
fallout.event_log.mutant_envoy_gate.detail.refuse_contact_partial: "The closed gate protected stores but pushed unlicensed traders toward the marsh crossing."
fallout.event_log.mutant_envoy_gate.detail.refuse_contact_failure: "The gate closed without a receipt and the neighboring liaison withdrew."
fallout.event_log.mutant_envoy_gate.detail.callback_success: "The delayed review kept names, medicine, and a reply moving across the river."
fallout.event_log.mutant_envoy_gate.detail.callback_partial: "The delayed review kept first contact alive while bridge seals and medicine lists lagged."
fallout.event_log.mutant_envoy_gate.detail.callback_failure: "The delayed review found old suspicions at the gate and no active liaison."
fallout.event_log.mutant_envoy_gate.detail.cancelled: "The envoy record was cancelled after its state, neighbor, owner, or generation changed."

