l_english:
# North Africa and Sahara framework packages: the Rif.
independence_wave_rif_republic_category: "The Rif Republic"
independence_wave_rif_republic_category_desc: "The Rif governs itself again from Ajdir. The tribes of Anual answer first to their own leaders, and the roads and telephone lines of the first republic lie in ruins."
independence_wave_rif_convene_national_assembly: "Convene the Rif National Assembly"
independence_wave_rif_convene_national_assembly_desc: "Call the representatives of the Rif tribes to Ajdir, as the first republic did in 1923, to swear to one constitution and one government."
independence_wave_rif_convene_national_assembly_tt: "Raises §YLegitimacy§! and lowers §YInstability§!. The assembly can then unify the levies and restore the Ajdir network."
independence_wave_rif_unify_tribal_levies: "Unify the Tribal Levies"
independence_wave_rif_unify_tribal_levies_desc: "Bring the clan levies under one command with regular pay, ranks and drill, as Abd el-Krim's regular army once had."
independence_wave_rif_unify_tribal_levies_tt: "Replaces §YThe Tribal Levies§! with §YThe Rif Regular Army§!, greatly raises §YSecurity§! and raises §YInstability§!."
independence_wave_rif_fortify_mountain_redoubts: "Fortify the Mountain Redoubts"
independence_wave_rif_fortify_mountain_redoubts_desc: "Dig trenches, caves and artillery positions along the passes, where the Rif fought its war against two empires."
independence_wave_rif_fortify_mountain_redoubts_tt: "Adds §YThe Mountain Redoubts§! and raises §YSecurity§!."
independence_wave_rif_restore_ajdir_network: "Restore the Ajdir Network"
independence_wave_rif_restore_ajdir_network_desc: "Rebuild the mule roads and telephone lines that once tied every tribe of the Rif to the government at Ajdir."
independence_wave_rif_restore_ajdir_network_tt: "Raises §YCapacity§! and §YRecognition§!."
independence_wave_rif_tribal_levies: "The Tribal Levies"
independence_wave_rif_tribal_levies_desc: "Every tribe sends its own men under its own leaders. They fight bravely in their own valleys and reluctantly anywhere else."
independence_wave_rif_regular_army: "The Rif Regular Army"
independence_wave_rif_regular_army_desc: "The levies serve under one command with pay, ranks and a shared drill. The tribes still remember whose sons they sent."
independence_wave_rif_mountain_redoubts: "The Mountain Redoubts"
independence_wave_rif_mountain_redoubts_desc: "Trenches, caves and gun positions guard every pass into the Rif."
independence_wave_rif_assembly_convened: "The Rif National Assembly has been convened"

# Incidents
chaosx.nr6.208.t: "Veterans of Anual"
chaosx.nr6.208.d: "Men who fought at Anual in 1921 and in the war that followed have come home from prisons and exile. They want commands in the new army, or the land they were promised."
chaosx.nr6.208.a: "Give them commands in the army"
chaosx.nr6.208.b: "Settle them on the plain of Nekor"
chaosx.nr6.209.t: "The Mines of Uixan"
chaosx.nr6.209.d: "The foreign company that ran the iron mines of Uixan asks the government to honour its concession. The miners and the assembly want the mines for the republic."
chaosx.nr6.209.a: "Honour the mining concession"
chaosx.nr6.209.b: "Take the mines for the republic"
chaosx.nr6.208.a.tt: "Security §G+[?constant:independence_wave_value.standard_gain|0]§!, Instability §R+[?constant:independence_wave_value.minor_gain|0]§!."
chaosx.nr6.208.b.tt: "Legitimacy §G+[?constant:independence_wave_value.standard_gain|0]§!, Capacity §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.209.a.tt: "Recognition §G+[?constant:independence_wave_value.standard_gain|0]§!, Legitimacy §R[?constant:independence_wave_value.minor_loss|0]§!."
chaosx.nr6.209.b.tt: "Legitimacy §G+[?constant:independence_wave_value.minor_gain|0]§!, Capacity §G+[?constant:independence_wave_value.standard_gain|0]§!. Our former host grows more hostile."
