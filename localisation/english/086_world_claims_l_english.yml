chaosx.nr86.1.t: "World Claims"

chaosx.nr86.2.t: "Claim the world?"
chaosx.nr86.2.d: "Our nation is considering a claim to global rule. Spreading our ideology would require armies, administrators, and a willingness to impose our beliefs on every other country."
chaosx.nr86.2.a: "Claim the world!"
chaosx.nr86.2.b: "We shouldn't announce such claims"

chaosx.news.72.t: "[FROM.GetName] claims the world"
chaosx.news.72.d: "[FROM.GetName] has claimed sovereignty over the entire world through official declarations. Other governments are deciding whether to recognize the claim or resist it."
chaosx.news.72.a: "Permanent struggle is the law of life"
