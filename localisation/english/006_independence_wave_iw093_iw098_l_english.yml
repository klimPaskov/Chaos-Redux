# IW-093/IW-098 country and party localisation
DOX_prempeh_ii: "Prempeh II"
DOX_prempeh_ii_desc: "Restored as Asantehene in 1935, Prempeh II presides over a confederacy in which the Golden Stool, the divisional chiefs, Kumasi's clans, and a modern civil administration must learn to govern together."
DOX_kwame_frimpong: "Kwame Frimpong"
DOX_kwame_frimpong_desc: "An experienced colonial-service veteran, Frimpong turns scattered guards and returned soldiers into a defensive command built around patient planning, reliable supply, and the protection of Kumasi."
DOX_kwaku_ntim: "Kwaku Ntim"
DOX_kwaku_ntim_desc: "Ntim draws on forest guides, district messengers, and local guard companies. His command favors concealment, dispersed movement, and rapid reinforcement along the approaches to the confederacy."
DOX_independence_wave_neutrality_party: "Confederacy Council"
DOX_independence_wave_neutrality_party_long: "Ashanti Confederacy Council"
DOX_independence_wave_democratic_party: "Civic Delegation"
DOX_independence_wave_democratic_party_long: "Kumasi Civic and Market Delegation"
DOX_independence_wave_communism_party: "Workers' Congress"
DOX_independence_wave_communism_party_long: "Railway and Mine Workers' Congress"
DOX_independence_wave_fascism_party: "Veterans' Committee"
DOX_independence_wave_fascism_party_long: "Confederacy Veterans' Emergency Committee"
SOK_independence_wave_neutrality_party: "Native Authority"
SOK_independence_wave_neutrality_party_long: "Sokoto Native Authority"
SOK_independence_wave_democratic_party: "Council Reformers"
SOK_independence_wave_democratic_party_long: "Emirate-in-Council Reform Delegation"
SOK_independence_wave_communism_party: "Northern Workers"
SOK_independence_wave_communism_party_long: "Northern Workers' and Caravan League"
SOK_independence_wave_fascism_party: "Frontier Command"
SOK_independence_wave_fascism_party_long: "Sokoto Frontier Emergency Command"
SOK_muhammad_dikko: "Muhammadu Dikko"
SOK_muhammad_dikko_desc: "As Emir of Katsina, Dikko brings decades of experience coordinating district authorities, mounted retainers, caravan routes, and the northern pilgrimage roads."
SOK_bello_rabah: "Bello Rabah"
SOK_bello_rabah_desc: "Rabah combines caravan security with a methodical defensive staff. His patrols protect markets and livestock routes while keeping reserves ready for threats emerging from the borderlands."

# IW-093/IW-098 idea localisation
independence_wave_iw093_unsettled_restoration_idea: "Unsettled Asante Restoration"
independence_wave_iw093_unsettled_restoration_idea_desc: "Kumasi's cocoa stores and railway links remain impaired while the restoration must still prove that it can administer a shared economic spine."
independence_wave_iw093_cocoa_rail_compact_idea: "Cocoa and Rail Compact"
independence_wave_iw093_cocoa_rail_compact_idea_desc: "Restored depots and the Kumasi railway bind local producers, merchants, and the restoration administration to a visible material settlement."
independence_wave_iw098_disputed_emirate_compact_idea: "Disputed Emirate Compact"
independence_wave_iw098_disputed_emirate_compact_idea_desc: "Caravan routes, market obligations, and frontier authority remain contested while the emirate establishes its own administrative record."
independence_wave_iw098_caravan_network_compact_idea: "Caravan and Livestock Network"
independence_wave_iw098_caravan_network_compact_idea_desc: "Secured wells and a working livestock market connect settlement, revenue, and frontier protection through a common public network."

# IW-093/IW-098 decision-category localisation
independence_wave_iw093_asante_compact_category: "The Asante Restoration Compact"
independence_wave_iw093_asante_compact_category_desc: "Rebuild the Kumasi economic spine, settle obligations with the former host, and choose whether court authority, cabinet law, or emergency command defines the restoration.\n\n§YConfederated Authority§!: §Y[?iw093_confederated_authority|0]§!\n§YCourt-Cabinet Balance§!: §Y[?iw093_court_cabinet_balance|0]§!\n§YCocoa and Rail Throughput§!: §Y[?iw093_cocoa_rail_throughput|0]§!\n§YHost Settlement§!: §Y[?iw093_host_settlement|0]§!"
independence_wave_iw098_sokoto_compact_category: "The Sokoto Emirate Compact"
independence_wave_iw098_sokoto_compact_category_desc: "Secure caravan wells and livestock markets, record the frontier administration, and decide whether the emirate rests on sultanic, constitutional, or emergency command authority.\n\n§YEmirate Compact§!: §Y[?iw098_emirate_compact|0]§!\n§YCourt-Civic Balance§!: §Y[?iw098_court_civic_balance|0]§!\n§YCaravan and Livestock Network§!: §Y[?iw098_caravan_livestock_network|0]§!\n§YFrontier Security§!: §Y[?iw098_frontier_security|0]§!"
