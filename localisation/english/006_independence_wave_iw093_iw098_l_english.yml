# IW-098 decisions and missions
independence_wave_iw098_reorganize_cavalry_screen: "Reorganize the Cavalry Screen"
independence_wave_iw098_reorganize_cavalry_screen_desc: "Refit and reorganize the existing frontier cavalry screen. The receipt records an upgrade to the established force and never creates a free division."
independence_wave_iw098_reorganize_cavalry_screen_start_tt: "The existing cavalry screen enters a §Y90 day§! reorganization. The command and equipment commitments are spent immediately."
independence_wave_iw098_reorganize_cavalry_screen_success_tt: "The cavalry-screen reorganization is recorded. §YFrontier Security§! increases by §G10§!."
independence_wave_iw098_reorganize_cavalry_screen_failure_tt: "The screen cannot be reorganized while Sokoto is unsecured. §YFrontier Security§! decreases by §R5§!, and no replacement unit is created."
independence_wave_iw098_reorganize_cavalry_screen_cancel_tt: "The reorganization is cancelled after loss of the Sokoto anchor. §YFrontier Security§! decreases by §R5§!, and the equipment remains spent."

independence_wave_iw098_sultanic_federal_compact: "Convene a Sultanic Federal Compact"
independence_wave_iw098_sultanic_federal_compact_desc: "Spend political capital on a seventy-day compact that preserves a sultanic federal balance while keeping the founding-congress route available."
independence_wave_iw098_sultanic_federal_compact_start_tt: "The sultanic compact sits for §Y70 days§!. Its political-power cost is committed when the session opens."
independence_wave_iw098_sultanic_federal_compact_success_tt: "The sultanic federal compact is recorded. §YCourt-Civic Balance§! shifts toward the court and §YEmirate Compact§! increases by §G10§!."
independence_wave_iw098_sultanic_federal_compact_failure_tt: "The compact cannot bind a government route that has already been closed. Its political commitment is not returned."
independence_wave_iw098_sultanic_federal_compact_cancel_tt: "The compact conference is cancelled. Its political commitment is not returned."

independence_wave_iw098_northern_constitution_compact: "Convene a Northern Constitutional Compact"
independence_wave_iw098_northern_constitution_compact_desc: "Spend political capital on a seventy-day constitutional compact that strengthens civic administration while keeping the founding-congress route available."
independence_wave_iw098_northern_constitution_compact_start_tt: "The constitutional compact sits for §Y70 days§!. Its political-power cost is committed when the session opens."
independence_wave_iw098_northern_constitution_compact_success_tt: "The northern constitutional compact is recorded. §YCourt-Civic Balance§! shifts toward civic authority and §YEmirate Compact§! increases by §G10§!."
independence_wave_iw098_northern_constitution_compact_failure_tt: "The compact cannot bind a government route that has already been closed. Its political commitment is not returned."
independence_wave_iw098_northern_constitution_compact_cancel_tt: "The compact conference is cancelled. Its political commitment is not returned."

independence_wave_iw098_frontier_command_compact: "Convene a Frontier Command Compact"
independence_wave_iw098_frontier_command_compact_desc: "Under severe host pressure, spend political capital on an emergency command compact. This sovereign frontier settlement locks the founding-congress route."
independence_wave_iw098_frontier_command_compact_start_tt: "The frontier-command compact sits for §Y70 days§!. Its political-power cost is committed when the session opens."
independence_wave_iw098_frontier_command_compact_success_tt: "Frontier command is recorded. §YFrontier Security§! increases by §G15§!, while the founding-congress route is locked."
independence_wave_iw098_frontier_command_compact_failure_tt: "The emergency compact lost its threat basis before ratification. Its political commitment remains spent."
independence_wave_iw098_frontier_command_compact_cancel_tt: "The emergency compact is cancelled after the threat condition ends. Its political commitment is not returned."

independence_wave_iw098_secure_caravan_wells: "Secure the Caravan Wells"
independence_wave_iw098_secure_caravan_wells_desc: "Commit rifles and civilian capacity to restore secure water points along the caravan network. The well stage is required before the livestock market can reopen."
independence_wave_iw098_secure_caravan_wells_start_tt: "Well security work begins for §Y90 days§!. The equipment is spent immediately and civilian capacity remains committed."
independence_wave_iw098_secure_caravan_wells_success_tt: "The caravan wells are secured. §YCaravan and Livestock Network§! increases by §G10§!, §YFrontier Security§! increases by §G5§!, and Sokoto gains infrastructure."
independence_wave_iw098_secure_caravan_wells_failure_tt: "The well project fails or loses its Sokoto mandate. §YFrontier Security§! decreases by §R5§!, and no infrastructure is constructed."
independence_wave_iw098_secure_caravan_wells_cancel_tt: "The well project is cancelled after the Sokoto anchor is lost. §YFrontier Security§! decreases by §R5§!, and the equipment remains spent."

independence_wave_iw098_open_livestock_market: "Open the Livestock Market"
independence_wave_iw098_open_livestock_market_desc: "Use the secured wells as a base for a second material commitment to open the Sokoto livestock market and its accounts."
independence_wave_iw098_open_livestock_market_start_tt: "Market work begins for §Y120 days§!. The support equipment is spent immediately and civilian capacity remains committed."
independence_wave_iw098_open_livestock_market_success_tt: "The livestock market opens. §YCaravan and Livestock Network§! increases by §G15§!, §YEmirate Compact§! increases by §G10§!, and Sokoto receives one civilian factory."
independence_wave_iw098_open_livestock_market_failure_tt: "The market project fails or loses its Sokoto mandate. §YCaravan and Livestock Network§! decreases by §R10§! and §YEmirate Compact§! decreases by §R5§!."
independence_wave_iw098_open_livestock_market_cancel_tt: "The market project is cancelled after the Sokoto anchor is lost. §YCaravan and Livestock Network§! decreases by §R10§!, and the equipment remains spent."

independence_wave_iw098_negotiate_native_administration: "Negotiate Native Administration and Frontier Terms"
independence_wave_iw098_negotiate_native_administration_desc: "Record native administration, customs, rail access, livestock-market accounts, and frontier policing with the former host. The talks cannot continue while severe host pressure makes a reciprocal settlement impossible."
independence_wave_iw098_negotiate_native_administration_start_tt: "Administration talks continue for §Y90 days§!. The command and train commitments are spent immediately."
independence_wave_iw098_negotiate_native_administration_success_tt: "The Sokoto protocol is delivered to the former host. A settlement receipt will be written only if its government accepts the terms."
independence_wave_iw098_negotiate_native_administration_failure_tt: "The administration talks fail under renewed host pressure. §YEmirate Compact§! decreases by §R10§! and §YFrontier Security§! decreases by §R5§!."
independence_wave_iw098_negotiate_native_administration_cancel_tt: "The talks are cancelled by severe host pressure. §YFrontier Security§! decreases by §R10§!, and the transport commitment remains spent."

independence_wave_iw098_ratify_post_crisis_settlement: "Ratify the Post-Crisis Frontier Settlement"
independence_wave_iw098_ratify_post_crisis_settlement_desc: "Once the reclamation crisis has ended, reconcile native administration, railway customs, livestock accounts, and frontier policing into a final settlement. This paid ratification replaces the missing former-host signature with a documented post-crisis settlement."
independence_wave_iw098_ratify_post_crisis_settlement_start_tt: "The post-crisis settlement is audited for §Y75 days§!. The command and train commitments are spent immediately."
independence_wave_iw098_ratify_post_crisis_settlement_success_tt: "The frontier settlement is ratified. §YFrontier Security§! increases by §G20§!, country recognition rises, and the unresolved host crisis is closed."
independence_wave_iw098_ratify_post_crisis_settlement_failure_tt: "War, renewed host claims, or loss of the Sokoto package invalidated the settlement before ratification. The committed resources are not returned."

independence_wave_iw098_prepare_form25_congress: "Prepare the Sokoto Founding Congress"
independence_wave_iw098_prepare_form25_congress_desc: "Prepare a Sokoto founding congress only after a sultanic or constitutional compact, adequate compact, network, and security values, and a recorded administration settlement. This action prepares the route without proclaiming a formable."
independence_wave_iw098_prepare_form25_congress_start_tt: "The founding-congress preparations run for §Y90 days§!. The command and convoy commitments are spent immediately."
independence_wave_iw098_prepare_form25_congress_success_tt: "The Sokoto founding-congress preparation is complete."
independence_wave_iw098_prepare_form25_congress_failure_tt: "The route, capacity, security, or administration proof failed before the preparations closed. §YEmirate Compact§! decreases by §R5§!."
independence_wave_iw098_prepare_form25_congress_cancel_tt: "The founding-congress preparation is cancelled after its requirements cease to hold. §YEmirate Compact§! decreases by §R5§!, and the commitments remain spent."

# IW-093 former-host events
chaosx.nr006.9301.t: "The Kumasi Settlement Delegation"
chaosx.nr006.9301.d: "[independence_wave_iw093_negotiating_country.GetNameDefCap] has submitted a single protocol covering railway rolling stock, cocoa customs, public debt, private property, citizenship, and border policing. Its delegates demand an answer from the government that once administered Kumasi. Recognition would close the reclamation account. Association would preserve our guarantees and access. Rejection would turn the disputed ledgers into instruments of pressure."
chaosx.nr006.9301.a: "Recognize the separation and close the accounts"
chaosx.nr006.9301.b: "Retain an association through guarantees and access"
chaosx.nr006.9301.c: "Reject the protocol and press the reclamation claim"
chaosx.nr006.9302.t: "The Kumasi Protocol Is Recognized"
chaosx.nr006.9302.d: "[independence_wave_iw093_answering_host.GetNameDefCap] has accepted the railway, customs, debt, property, citizenship, and border-policing settlement. The former host has renounced immediate reclamation and entered a non-aggression pact with our confederacy. The signed protocol gives Kumasi the recognition it needs to act beyond emergency administration."
chaosx.nr006.9302.a: "File the signed protocol with the confederated council"
chaosx.nr006.9303.t: "An Association Settlement Is Accepted"
chaosx.nr006.9303.d: "[independence_wave_iw093_answering_host.GetNameDefCap] will recognize the settlement inside a guarded association. Its guarantee and military-access terms preserve a host role, while Kumasi keeps its own government, accounts, and command. The agreement limits immediate conflict but leaves the confederacy bound to a negotiated external relationship."
chaosx.nr006.9303.a: "Record the association and its obligations"
chaosx.nr006.9304.t: "The Kumasi Protocol Is Rejected"
chaosx.nr006.9304.d: "[independence_wave_iw093_answering_host.GetNameDefCap] has rejected the settlement, imposed an embargo, and prepared a reclamation claim. Railway stock, property accounts, and the frontier ledger are again instruments of coercion. Kumasi must survive the crisis before any postwar or post-collapse settlement can be ratified."
chaosx.nr006.9304.a: "Prepare the forest approaches"

# IW-098 former-host events
chaosx.nr006.9801.t: "The Sokoto Administration Protocol"
chaosx.nr006.9801.d: "[independence_wave_iw098_negotiating_country.GetNameDefCap] has submitted terms for native administration, railway customs, livestock-market accounts, and frontier policing. Its delegates ask us to recognize an emirate-civic government beyond our direct authority. Recognition would close the reclamation account. Association would retain guarantees and access. Rejection would turn the frontier ledger into an open claim."
chaosx.nr006.9801.a: "Recognize the settlement and close the frontier account"
chaosx.nr006.9801.b: "Preserve an association through guarantees and access"
chaosx.nr006.9801.c: "Reject the protocol and assert the reclamation claim"
chaosx.nr006.9802.t: "The Sokoto Protocol Is Recognized"
chaosx.nr006.9802.d: "[independence_wave_iw098_answering_host.GetNameDefCap] has accepted Sokoto's native-administration, railway, customs, livestock, and frontier settlement. The former host has renounced immediate reclamation and entered a non-aggression pact with the sultanate. The signed record strengthens both the emirate compact and the frontier command."
chaosx.nr006.9802.a: "Enter the protocol in the emirate register"
chaosx.nr006.9803.t: "A Guarded Association Is Accepted"
chaosx.nr006.9803.d: "[independence_wave_iw098_answering_host.GetNameDefCap] will recognize the Sokoto administration inside a guarded association. Its guarantee and military-access terms preserve a host role, while the emirate council keeps its own accounts and command. The settlement reduces immediate danger at the price of continuing obligations."
chaosx.nr006.9803.a: "Record the association and its limits"
chaosx.nr006.9804.t: "The Sokoto Protocol Is Rejected"
chaosx.nr006.9804.d: "[independence_wave_iw098_answering_host.GetNameDefCap] has rejected the settlement, imposed an embargo, and prepared a reclamation claim. Customs posts, livestock accounts, and frontier patrols are again exposed to coercion. Sokoto must survive the crisis before a postwar or post-collapse settlement can be ratified."
chaosx.nr006.9804.a: "Call the frontier staff to readiness"
