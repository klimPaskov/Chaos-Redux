# IW-093 decisions and missions
independence_wave_iw093_train_forest_guard: "Train the Forest Guard"
independence_wave_iw093_train_forest_guard_desc: "Refit and train an existing Asante formation for the forest approaches. The established force gains the upgrade without adding a new division."
independence_wave_iw093_train_forest_guard_start_tt: "The existing formation begins a §Y90 day§! training cycle. The command authority and rifles are spent immediately."
independence_wave_iw093_train_forest_guard_success_tt: "The Forest Guard upgrade is recorded. §YConfederated Authority§! increases by §G10§!."
independence_wave_iw093_train_forest_guard_failure_tt: "Kumasi could not sustain the training cycle. §YConfederated Authority§! decreases by §R5§!, and the committed resources remain spent."
independence_wave_iw093_train_forest_guard_cancel_tt: "The training cycle is cancelled after loss of the Kumasi anchor. §YConfederated Authority§! decreases by §R5§!, and no replacement formation is created."

independence_wave_iw093_royal_confederacy_conference: "Convene a Royal Confederacy Conference"
independence_wave_iw093_royal_confederacy_conference_desc: "Spend political capital on a seventy-day conference that gives the court a confederated mandate. The settlement favors court authority and closes the constitutional cabinet route."
independence_wave_iw093_royal_confederacy_conference_start_tt: "The royal conference sits for §Y70 days§!. Its political-power cost is committed when the session opens."
independence_wave_iw093_royal_confederacy_conference_success_tt: "The royal confederacy is recorded. §YCourt-Cabinet Balance§! shifts toward the court and §YConfederated Authority§! increases by §G10§!."
independence_wave_iw093_royal_confederacy_conference_failure_tt: "The conference cannot bind a government route that has already been closed. Its political commitment is not returned."
independence_wave_iw093_royal_confederacy_conference_cancel_tt: "The conference is cancelled. Its political commitment is not returned."

independence_wave_iw093_constitutional_cabinet_conference: "Convene a Constitutional Cabinet Conference"
independence_wave_iw093_constitutional_cabinet_conference_desc: "Spend political capital on a seventy-day cabinet conference. A constitutional mandate is required before an Asante founding congress can be prepared."
independence_wave_iw093_constitutional_cabinet_conference_start_tt: "The cabinet conference sits for §Y70 days§!. Its political-power cost is committed when the session opens."
independence_wave_iw093_constitutional_cabinet_conference_success_tt: "The constitutional cabinet is recorded. §YCourt-Cabinet Balance§! shifts toward the cabinet and §YConfederated Authority§! increases by §G10§!."
independence_wave_iw093_constitutional_cabinet_conference_failure_tt: "The conference cannot bind a government route that has already been closed. Its political commitment is not returned."
independence_wave_iw093_constitutional_cabinet_conference_cancel_tt: "The conference is cancelled. Its political commitment is not returned."

independence_wave_iw093_veterans_emergency_conference: "Convene a Veterans' Emergency Conference"
independence_wave_iw093_veterans_emergency_conference_desc: "Under severe host pressure, spend political capital and command authority to establish emergency veterans' rule. This sovereign emergency settlement locks the founding congress route."
independence_wave_iw093_veterans_emergency_conference_start_tt: "The emergency conference sits for §Y70 days§!. Its political-power and command commitments are spent immediately."
independence_wave_iw093_veterans_emergency_conference_success_tt: "Veterans' emergency authority is recorded. §YConfederated Authority§! increases by §G15§!, while the founding-congress route is locked."
independence_wave_iw093_veterans_emergency_conference_failure_tt: "The emergency mandate lost its threat basis before ratification. The command commitment remains spent."
independence_wave_iw093_veterans_emergency_conference_cancel_tt: "The emergency conference is cancelled after the threat condition ends. Its commitments are not returned."

independence_wave_iw093_rebuild_cocoa_depots: "Rebuild the Cocoa Depots"
independence_wave_iw093_rebuild_cocoa_depots_desc: "Commit rifles and civilian capacity to secure and reopen the Kumasi cocoa depots. A functioning depot stage is required before the railway can be relaid."
independence_wave_iw093_rebuild_cocoa_depots_start_tt: "Depot reconstruction begins for §Y120 days§!. The equipment is spent immediately and civilian capacity remains committed."
independence_wave_iw093_rebuild_cocoa_depots_success_tt: "The cocoa depots reopen. §YCocoa and Rail Throughput§! increases by §G10§!, §YConfederated Authority§! increases by §G5§!, and Kumasi receives one civilian factory."
independence_wave_iw093_rebuild_cocoa_depots_failure_tt: "The depot project fails or loses its Kumasi mandate. §YCocoa and Rail Throughput§! decreases by §R5§!, and no factory is constructed."
independence_wave_iw093_rebuild_cocoa_depots_cancel_tt: "The depot project is cancelled after the Kumasi anchor is lost. §YCocoa and Rail Throughput§! decreases by §R5§!, and the equipment remains spent."

independence_wave_iw093_relay_kumasi_railway: "Relay the Kumasi Railway"
independence_wave_iw093_relay_kumasi_railway_desc: "Use the reopened depots as a base for a second, longer material commitment to relay the Kumasi railway."
independence_wave_iw093_relay_kumasi_railway_start_tt: "Railway work begins for §Y120 days§!. The equipment is spent immediately and civilian capacity remains committed."
independence_wave_iw093_relay_kumasi_railway_success_tt: "The railway is relaid. §YCocoa and Rail Throughput§! increases by §G15§!, §YConfederated Authority§! increases by §G10§!, and Kumasi gains infrastructure."
independence_wave_iw093_relay_kumasi_railway_failure_tt: "The rail project fails or loses its Kumasi mandate. §YCocoa and Rail Throughput§! decreases by §R10§! and §YConfederated Authority§! decreases by §R5§!."
independence_wave_iw093_relay_kumasi_railway_cancel_tt: "The rail project is cancelled after the Kumasi anchor is lost. §YCocoa and Rail Throughput§! decreases by §R10§!, and the equipment remains spent."

independence_wave_iw093_negotiate_host_settlement: "Negotiate Railway, Debt, and Customs Settlement"
independence_wave_iw093_negotiate_host_settlement_desc: "Record railway access, debt accounts, customs practice, and border policing with the former host. The talks cannot continue while severe host pressure makes a reciprocal settlement impossible."
independence_wave_iw093_negotiate_host_settlement_start_tt: "Settlement talks continue for §Y90 days§!. The command and train commitments are spent immediately."
independence_wave_iw093_negotiate_host_settlement_success_tt: "The Kumasi protocol is delivered to the former host. A settlement receipt will be written only if its government accepts the terms."
independence_wave_iw093_negotiate_host_settlement_failure_tt: "The settlement fails under renewed host pressure. §YHost Settlement§! decreases by §R10§! and §YConfederated Authority§! decreases by §R5§!."
independence_wave_iw093_negotiate_host_settlement_cancel_tt: "The talks are cancelled by severe host pressure. §YHost Settlement§! decreases by §R10§!, and the transport commitment remains spent."

independence_wave_iw093_ratify_post_crisis_settlement: "Ratify the Post-Crisis Railway Settlement"
independence_wave_iw093_ratify_post_crisis_settlement_desc: "Once the reclamation crisis has ended, reconcile railway custody, customs enforcement, private claims, and border patrol records into a final settlement. This paid ratification replaces the missing former-host signature with a documented post-crisis settlement."
independence_wave_iw093_ratify_post_crisis_settlement_start_tt: "The post-crisis settlement is audited for §Y75 days§!. The command and train commitments are spent immediately."
independence_wave_iw093_ratify_post_crisis_settlement_success_tt: "The railway settlement is ratified. §YHost Settlement§! increases by §G30§!, country recognition rises, and the unresolved host crisis is closed."
independence_wave_iw093_ratify_post_crisis_settlement_failure_tt: "War, renewed host claims, or loss of the Asante package invalidated the settlement before ratification. The committed resources are not returned."

independence_wave_iw093_prepare_form24_congress: "Prepare the Asante Founding Congress"
independence_wave_iw093_prepare_form24_congress_desc: "Prepare a constitutional founding congress only after a cabinet mandate, adequate authority and cocoa-rail capacity, and a recorded host settlement. This action prepares the route without proclaiming a formable."
independence_wave_iw093_prepare_form24_congress_start_tt: "The founding congress preparations run for §Y90 days§!. The command and train commitments are spent immediately."
independence_wave_iw093_prepare_form24_congress_success_tt: "The constitutional Asante founding-congress preparation is complete."
independence_wave_iw093_prepare_form24_congress_failure_tt: "The constitutional, capacity, or settlement proof failed before the preparations closed. §YConfederated Authority§! decreases by §R5§!."
independence_wave_iw093_prepare_form24_congress_cancel_tt: "The founding-congress preparation is cancelled after its requirements cease to hold. §YConfederated Authority§! decreases by §R5§!, and the commitments remain spent."

