l_english:
  chaosx.fallout.485.t: "The Desalination Night Shift"
  chaosx.fallout.485.intro: "At the Middle Eastern coast, the intake pipes still reach salt water, but the plant has one night of power and a clinic that cannot spare its lamps. Ash sits in the filters, the port road is watched, and the town must decide who receives the first clean tanks. A full run can keep the plant alive, a clinic reserve can protect patients, desert technicians can bind a neighbor to the work, or a locked gate can ration the shoreline."
  chaosx.fallout.485.a: "Run the plant at full strain"
  chaosx.fallout.485.a.tt: "Spend Water, Power, and Medicine to fill the town tanks before dawn. Democratic and neutral governments can authorize the public shift."
  chaosx.fallout.485.b: "Call the desert technicians"
  chaosx.fallout.485.b.tt: "Spend Water, Power, and Medicine to invite a neighboring technical crew and record a bilateral credit."
  chaosx.fallout.485.c: "Reserve power for the clinic"
  chaosx.fallout.485.c.tt: "Keep the clinic lit while the plant runs slowly. Communist, democratic, and neutral governments can set this priority."
  chaosx.fallout.485.d: "Lock the gates and ration the shore"
  chaosx.fallout.485.d.tt: "Use a guarded ration line to protect the intake crew and preserve a smaller public water reserve. Fascist and communist governments can impose the lock."

  chaosx.fallout.487.run_full_shift.success.d: "The full shift held through the ash tide. Tankers rolled from the intake yard to the clinic and the town cisterns, while the port guard marked a safe route for the next convoy."
  chaosx.fallout.487.run_full_shift.partial.d: "The plant ran, but two filters split before dawn. The clinic received clean water and the harbor quarter received the remainder under a ration schedule."
  chaosx.fallout.487.run_full_shift.failure.d: "The pumps seized when the ash reached the second bank. The intake crew lost the night, the clinic returned to boiled stores, and the first water dispute moved toward the breakwater."
  chaosx.fallout.487.call_desert_technicians.success.d: "The desert technicians arrived with ceramic membranes and a signed maintenance credit. Their crew reopened the clean-water line without placing the clinic under foreign command."
  chaosx.fallout.487.call_desert_technicians.partial.d: "Only half the technical crew reached the coast. They restored the clinic line, but the unfinished plant leaves the harbor quarter dependent on the next convoy."
  chaosx.fallout.487.call_desert_technicians.failure.d: "The convoy was stopped beyond the salt flats. Its credit remains on the ledger, while the plant loses another filter and the neighboring government calls the delay a breach."
  chaosx.fallout.487.reserve_clinic_power.success.d: "The clinic lamps stayed on while the plant filled a measured set of tanks. Nurses, mechanics, and port wardens now share one night roster and one water ledger."
  chaosx.fallout.487.reserve_clinic_power.partial.d: "The clinic kept its power, but the slow intake could not fill every tank. The old town received water first and the harbor quarter waits for the next shift."
  chaosx.fallout.487.reserve_clinic_power.failure.d: "The reserve protected the lamps but left the membranes idle. Patients survived the night, yet the shoreline ration line broke when the dry tanks were counted."
  chaosx.fallout.487.lock_and_ration.success.d: "The locked shore held long enough to protect the plant crew. Guards measured each canister, the clinic received its share, and the town accepted a smaller but reliable reserve."
  chaosx.fallout.487.lock_and_ration.partial.d: "The ration line held near the intake and failed at the outer road. The plant survives, but the first water ledger now names the districts that were left waiting."
  chaosx.fallout.487.lock_and_ration.failure.d: "The gate became the crisis. A fight at the outer road damaged the pump house, medicine stores ran low, and the plant lost the confidence it needed for another shift."
  chaosx.fallout.487.a: "Queue the next shift"
  chaosx.fallout.487.a.tt: "Record the delayed result and return for the second-shift review."

  chaosx.fallout.489.t: "The Second Shift"
  chaosx.fallout.489.success.d: "Three hundred days later, the intake crew meets under a quieter sky. The membranes are washed, the clinic credit is still honored, and the shore route can support a second generation of operators."
  chaosx.fallout.489.partial.d: "The second shift works in the central district but not at the harbor edge. Water remains available, though each tanker now carries the memory of which road was repaired first."
  chaosx.fallout.489.failure.d: "The plant falls silent before the review is complete. The clinic keeps a boiled reserve, the port loses another maintenance crew, and the coast must decide whether to reopen the gate."
  chaosx.fallout.489.a: "Record the second shift"
  chaosx.fallout.489.a.tt: "Close the desalination review and preserve its water, power, and technical-credit memory."

  fallout.event_log.desalination_night_shift.name: "The Desalination Night Shift"
  fallout.event_log.desalination_night_shift.detail: "[GetFalloutEvent485EventLogDetail]"
  fallout.event_log.desalination_night_shift.run_full_shift_success: "A full coastal shift filled the clinic tanks and reopened a safe port route."
  fallout.event_log.desalination_night_shift.run_full_shift_partial: "A full coastal shift restored water unevenly after two filters split."
  fallout.event_log.desalination_night_shift.run_full_shift_failure: "The ash tide seized the pumps and pushed the water dispute toward the breakwater."
  fallout.event_log.desalination_night_shift.call_desert_technicians_success: "Desert technicians restored the clinic line under a written maintenance credit."
  fallout.event_log.desalination_night_shift.call_desert_technicians_partial: "Half the technical crew arrived and left the harbor quarter dependent on the next convoy."
  fallout.event_log.desalination_night_shift.call_desert_technicians_failure: "A stopped convoy left its credit unpaid while another filter failed."
  fallout.event_log.desalination_night_shift.reserve_clinic_power_success: "The clinic stayed lit while a measured tank reserve was filled."
  fallout.event_log.desalination_night_shift.reserve_clinic_power_partial: "The clinic kept power, but the harbor quarter waited for the next shift."
  fallout.event_log.desalination_night_shift.reserve_clinic_power_failure: "The clinic reserve survived while the dry tanks broke the shoreline ration line."
  fallout.event_log.desalination_night_shift.lock_and_ration_success: "A guarded shoreline ration preserved a smaller reliable reserve."
  fallout.event_log.desalination_night_shift.lock_and_ration_partial: "The intake gate held near the plant and failed along the outer road."
  fallout.event_log.desalination_night_shift.lock_and_ration_failure: "A gate fight damaged the pump house and ended confidence in the next shift."
  fallout.event_log.desalination_night_shift.callback_success: "The second shift reopened the coastal plant with its clinic credit intact."
  fallout.event_log.desalination_night_shift.callback_partial: "The second shift restored the center while the harbor edge remained uneven."
  fallout.event_log.desalination_night_shift.callback_failure: "The coastal plant fell silent before its second-shift review closed."
