l_english:
chaosx.nr94.1.t: "Half gone"

chaosx.nr94.2.t: "Half gone!"
chaosx.nr94.2.d: "Nearly half of our military equipment has vanished without a trace. Depots are empty, and commanders are reporting shortages across the armed forces."
chaosx.nr94.2.a: "A huge loss for us!"

chaosx.news.75.t: "Half gone"
chaosx.news.75.d: "Half of [FROM.GetName]'s military equipment has vanished without explanation. Investigators are searching depots and transport records, while the armed forces struggle to cover the gaps left by the missing stock."
chaosx.news.75.a: "Unfortunate"
