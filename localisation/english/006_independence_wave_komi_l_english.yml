l_english:
KOM_independence_wave_constitutional_party: "Komi Civic Congress"
KOM_independence_wave_constitutional_party_long: "Constitutional Congress of the Northern Komi Republic"
KOM_independence_wave_socialist_party: "Rail and Forestry Councils"
KOM_independence_wave_socialist_party_long: "Congress of Komi Rail, Mine, and Forestry Councils"
KOM_independence_wave_taiga_party: "Komi Land Compact"
KOM_independence_wave_taiga_party_long: "Council of the Komi Taiga Land Compact"
KOM_independence_wave_emergency_party: "Northern Security Directorate"
KOM_independence_wave_emergency_party_long: "Emergency Security Directorate of the Northern Komi Republic"

komi_fragmented_taiga_mandate: "Fragmented Taiga Mandate"
komi_fragmented_taiga_mandate_desc: "Syktyvkar's municipal offices, railway guards, forest settlements, and mine committees obey the provisional authority, but they have not accepted a common government."
komi_northern_republic_compact: "Northern Republic Compact"
komi_northern_republic_compact_desc: "The Northern Congress binds Komi communities, rail depots, forest districts, and local guards to one republic."
komi_taiga_congress_charter: "Taiga Congress Charter"
komi_taiga_congress_charter_desc: "An elected congress protects local representation while directing the republic's civil service and public works."
komi_rail_councils: "Rail and Forestry Councils"
komi_rail_councils_desc: "Rail crews, mine workers, forestry collectives, and municipal committees coordinate production and transport through a common council."
komi_community_register: "Komi Community Register"
komi_community_register_desc: "The government records each settlement's representation, land rights, public duties, and access to forests and rivers."
komi_taiga_land_compact: "Taiga Land Compact"
komi_taiga_land_compact_desc: "Village delegates and cooperatives protect hunting grounds, forest use, recruitment, food supply, and local administration."
komi_taiga_emergency_command: "Taiga Emergency Command"
komi_taiga_emergency_command_desc: "A unified staff directs railway guards and northern reserves while civil offices maintain supply and relief."

independence_wave_komi_congress_cohesion: "Congress Cohesion"
independence_wave_komi_taiga_readiness: "Taiga Readiness"
independence_wave_komi_northern_compact_category: "Northern Komi Compact"
independence_wave_komi_northern_compact_category_desc: "Congress Cohesion: §Y[?independence_wave_komi_congress_cohesion|0]§! / [?constant:independence_wave_komi_pressure.maximum|0]\nTaiga Readiness: §Y[?independence_wave_komi_taiga_readiness|0]§! / [?constant:independence_wave_komi_pressure.maximum|0]\nRaise both values to [?constant:independence_wave_komi_pressure.stable|0], install a route government, and keep Syktyvkar secure to stabilize the compact."

independence_wave_komi_hold_northern_council: "Hold the Northern Council Together"
independence_wave_komi_hold_northern_council_desc: "Within [?constant:independence_wave_komi_duration.founding_crisis|0] days, install a government, raise Congress Cohesion and Taiga Readiness to [?constant:independence_wave_komi_pressure.stable|0], and keep Syktyvkar owned and controlled."
independence_wave_komi_secure_taiga_depots: "Secure the Taiga Depots"
independence_wave_komi_secure_taiga_depots_desc: "Place Syktyvkar's stores, railway registers, and depot guards under a civil authority that can supply the compact."
independence_wave_komi_integrate_rail_guards: "Integrate the Rail Guards"
independence_wave_komi_integrate_rail_guards_desc: "Unify railway guards and local detachments under a northern defence staff while preserving the community agreements that sustain them."
independence_wave_komi_register_komi_communities: "Register the Komi Communities"
independence_wave_komi_register_komi_communities_desc: "Record each settlement's representation, land rights, public duties, and access to forests and rivers."
independence_wave_komi_settle_former_host_ledgers: "Settle the Former Host Ledgers"
independence_wave_komi_settle_former_host_ledgers_desc: "Negotiate a settlement of the property, border, population, and recognition claims inherited from the former administration."
independence_wave_komi_ratify_constitutional_autonomy: "Ratify Constitutional Autonomy"
independence_wave_komi_ratify_constitutional_autonomy_desc: "Give the Komi Civic Congress a binding charter, elected government, and guarantees for northern communities."
independence_wave_komi_adopt_taiga_land_compact: "Adopt the Taiga Land Compact"
independence_wave_komi_adopt_taiga_land_compact_desc: "Entrust village delegates and cooperatives with forest use, food supply, recruitment, and local administration."
independence_wave_komi_convene_rail_councils: "Convene the Rail and Forestry Councils"
independence_wave_komi_convene_rail_councils_desc: "Place the railways, mines, forest industries, and municipal services under a congress of workers' councils."
independence_wave_komi_establish_taiga_emergency_command: "Establish the Taiga Emergency Command"
independence_wave_komi_establish_taiga_emergency_command_desc: "Unify railway guards and northern reserves under an emergency staff, then secure the approaches to Syktyvkar."
independence_wave_komi_codify_durable_sovereignty: "Codify Durable Sovereignty"
independence_wave_komi_codify_durable_sovereignty_desc: "Turn the settled compact and functioning government into durable Komi sovereignty."
independence_wave_komi_open_northern_ural_corridor: "Open the Northern Ural Corridor"
independence_wave_komi_open_northern_ural_corridor_desc: "Exchange supplies, officers, and diplomatic access with other network states along the Pechora and Northern Ural routes."

independence_wave_komi_project_failure_effect_tt: "Congress Cohesion and Taiga Readiness each fall by §R[?constant:independence_wave_komi_pressure.standard_gain|0]§!. Legitimacy, Recognition, State Capacity, and Security fall. Instability rises."
