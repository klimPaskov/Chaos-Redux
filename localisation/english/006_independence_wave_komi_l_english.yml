independence_wave_komi_depots_effect_tt: "Congress Cohesion rises by §Y[?constant:independence_wave_komi_pressure.major_gain|0]§!. Taiga Readiness rises by §Y[?constant:independence_wave_komi_pressure.minor_gain|0]§!. The compact also strengthens its civil administration."
independence_wave_komi_guards_effect_tt: "Congress Cohesion rises by §Y[?constant:independence_wave_komi_pressure.minor_gain|0]§!. Taiga Readiness rises by §Y[?constant:independence_wave_komi_pressure.major_gain|0]§!. The compact also strengthens its security administration."
independence_wave_komi_communities_effect_tt: "Congress Cohesion rises by §Y[?constant:independence_wave_komi_pressure.major_gain|0]§!. Taiga Readiness rises by §Y[?constant:independence_wave_komi_pressure.standard_gain|0]§!. The Komi Community Register is established."
independence_wave_komi_host_ledgers_effect_tt: "Congress Cohesion and Taiga Readiness each rise by §Y[?constant:independence_wave_komi_pressure.standard_gain|0]§!. Negotiations settle the outstanding claims with the former host."
independence_wave_komi_constitutional_effect_tt: "The Komi Civic Congress takes office. Congress Cohesion rises by §Y[?constant:independence_wave_komi_pressure.major_gain|0]§! and Taiga Readiness rises by §Y[?constant:independence_wave_komi_pressure.minor_gain|0]§!."
independence_wave_komi_taiga_effect_tt: "The Komi Land Compact takes office. Congress Cohesion rises by §Y[?constant:independence_wave_komi_pressure.major_gain|0]§! and Taiga Readiness rises by §Y[?constant:independence_wave_komi_pressure.standard_gain|0]§!."
independence_wave_komi_rail_councils_effect_tt: "The Rail and Forestry Councils take office. Congress Cohesion rises by §Y[?constant:independence_wave_komi_pressure.minor_gain|0]§! and Taiga Readiness rises by §Y[?constant:independence_wave_komi_pressure.major_gain|0]§!."
independence_wave_komi_emergency_effect_tt: "The Northern Security Directorate takes office. Taiga Readiness rises by §Y[?constant:independence_wave_komi_pressure.decisive_gain|0]§! and Congress Cohesion falls by §R[?constant:independence_wave_komi_pressure.minor_gain|0]§!."
independence_wave_komi_sovereignty_effect_tt: "Legitimacy, Recognition, and State Capacity rise. The settled Komi compact is given a durable sovereignty settlement."
independence_wave_komi_corridor_effect_tt: "Congress Cohesion and Taiga Readiness each rise by §Y[?constant:independence_wave_komi_pressure.standard_gain|0]§!. Network Standing, League Cohesion, Common Cause, Shared Reserve, and Member Confidence rise."
