 chaosx.fallout.443.t: "The Empty Village Offer"
 chaosx.fallout.443.d: "The village still has a public well, a field ledger, and roofs that can be made to hold. The last census names families who are gone, while the road brings people who need a room and a reason to stay. The registrar asks whether this place will become a home, a garrison, a shared council, or a line no one crosses."
 chaosx.fallout.443.a: "Resettle refugee families"
 chaosx.fallout.443.b: "Grant veteran allotments"
 chaosx.fallout.443.c: "Charter a mixed village"
chaosx.fallout.443.e: "Keep the village as a border buffer"
 chaosx.fallout.443.a.tt: "Spend food, medicine, recognition, and cohesion to restore family houses and record property claims."
 chaosx.fallout.443.b.tt: "Spend food, medicine, recognition, and cohesion to grant veterans land, patrol duties, and a guarded road."
 chaosx.fallout.443.c.tt: "Spend food, medicine, recognition, and cohesion to place refugees, local survivors, and returning workers under one water council."
 chaosx.fallout.443.d.tt: "Spend food, medicine, recognition, and cohesion to keep the village lightly settled as an early-warning frontier reserve."
 chaosx.fallout.445.t: "Names on the Village Gate"
 chaosx.fallout.445.resettle_refugee_families.success.d: "The first families repair the rooms around the well and pin old names beside new addresses. A school bench arrives with the ration cart, and the field ledger gains owners who can argue in public without being treated as trespassers."
 chaosx.fallout.445.resettle_refugee_families.partial.d: "Some families move into sound rooms, but the field still has more claims than hands. The village keeps a register while the road camps wait for timber, medicine, and a promise that the next winter will not erase them."
 chaosx.fallout.445.resettle_refugee_families.failure.d: "The houses are assigned before the well is secure. Families leave in the first ash wind, and the ledger becomes a list of promises that the village could not keep."
 chaosx.fallout.445.grant_veteran_allotments.success.d: "Veterans clear the road, mark the patrol line, and turn the empty storehouse into a guarded common room. Their allotments carry duties as well as keys, and the village learns that a watch can be an institution instead of a private threat."
 chaosx.fallout.445.grant_veteran_allotments.partial.d: "The veterans hold the road and repair several roofs, but their allotments leave families outside the council. The village has a patrol memory and a land dispute that will return with the next convoy."
 chaosx.fallout.445.grant_veteran_allotments.failure.d: "The allotment board becomes another armed checkpoint. Veterans guard the keys, families stop bringing food, and the road remembers the village as a place that takes before it listens."
 chaosx.fallout.445.charter_mixed_village.success.d: "The water council gives each household a rota and lets old field names stand beside new claims. Refugees, local survivors, and returning workers disagree loudly, then repair the same pump before dusk."
 chaosx.fallout.445.charter_mixed_village.partial.d: "The mixed council keeps the well open, but three languages compete on every notice. The village has a shared key and separate memories of who first owned the fields."
 chaosx.fallout.445.charter_mixed_village.failure.d: "The council promises one village before it has one water line. Families retreat to separate rooms, the pump fails in the cold, and the empty houses become evidence against every compromise."
 chaosx.fallout.445.keep_border_buffer.success.d: "The village keeps a watch fire, a radio post, and a narrow list of people allowed to sleep inside the gate. The reserve is not prosperous, but the road is visible and the country has bought time without pretending it has built a home."
 chaosx.fallout.445.keep_border_buffer.partial.d: "The watch post works on clear days and the well serves a few patrol families. Beyond the gate, the old fields remain quiet, waiting for a settlement the border budget keeps postponing."
 chaosx.fallout.445.keep_border_buffer.failure.d: "The buffer consumes medicine and timber without making the road safer. The watch fire goes dark, the remaining households leave, and the empty village becomes a gap in the country's warning line."
 chaosx.fallout.445.a: "Record the settlement and await the village review"
 chaosx.fallout.445.a.tt: "Apply the settlement result, preserve migration and border memory, and schedule a 540-day review."
 chaosx.fallout.447.t: "The Village Has a Second Winter"
 chaosx.fallout.447.success.d: "The review finds a place with arguments, repaired roofs, and a water rota that names people instead of categories. The village has become part of the country without forgetting why the road brought it together."
 chaosx.fallout.447.partial.d: "The review finds a working road and a divided council. Some families call the village home, some call it a posting, and the land ledger still leaves one question open."
 chaosx.fallout.447.failure.d: "The review finds empty rooms, a cold pump, and a patrol book no one trusts. The village remains on the map, but its memory is now a warning about settlement without a public promise."
 chaosx.fallout.447.a: "Close the village review"
 chaosx.fallout.447.a.tt: "Resolve the settlement review, retain its migration memory, and release scheduler cleanup."
 fallout.event_log.empty_village_offer.name: "The Empty Village Offer"
 fallout.event_log.empty_village_offer.detail: "[This.GetName] decided whether an empty village would become a home, a garrison, a shared council, or a border buffer."
 fallout.event_log.empty_village_offer.resettle_refugee_families_success: "Refugee families repaired the village and received recorded homes around its well."
 fallout.event_log.empty_village_offer.resettle_refugee_families_partial: "Some families entered the village while field claims and winter repairs remained unsettled."
 fallout.event_log.empty_village_offer.resettle_refugee_families_failure: "Families left after the houses were assigned before the village well was secure."
 fallout.event_log.empty_village_offer.grant_veteran_allotments_success: "Veterans turned the village road and storehouse into a guarded public institution."
 fallout.event_log.empty_village_offer.grant_veteran_allotments_partial: "Veterans held the road while families remained outside the village council."
 fallout.event_log.empty_village_offer.grant_veteran_allotments_failure: "The allotment board became an armed checkpoint and emptied the village again."
 fallout.event_log.empty_village_offer.charter_mixed_village_success: "A shared water council joined refugees, local survivors, and returning workers."
 fallout.event_log.empty_village_offer.charter_mixed_village_partial: "The mixed council kept the well open while languages and land memories remained divided."
 fallout.event_log.empty_village_offer.charter_mixed_village_failure: "The mixed council failed before its water line and the empty rooms divided again."
 fallout.event_log.empty_village_offer.keep_border_buffer_success: "A lightly settled reserve kept a watch fire and early warning on the frontier road."
 fallout.event_log.empty_village_offer.keep_border_buffer_partial: "The watch post worked while the old fields remained outside the settlement."
 fallout.event_log.empty_village_offer.keep_border_buffer_failure: "The border reserve consumed supplies without keeping the road safe."
 fallout.event_log.empty_village_offer.callback_success: "The village survived a second winter with repaired roofs and a public water rota."
 fallout.event_log.empty_village_offer.callback_partial: "The village kept its road and rooms while its council remained divided."
 fallout.event_log.empty_village_offer.callback_failure: "The village review left empty rooms and a warning in the country's border ledger."
