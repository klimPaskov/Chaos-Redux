africa_promoted_pan_starting: "Stolen Machinery"
africa_promoted_pan_starting_desc: "Borrowed engines and contested clearings strain the forest workshops."
africa_promoted_gorilla_starting: "Mountain Supply Burden"
africa_promoted_gorilla_starting_desc: "A strong kingdom cannot eat stone. Every porter and path matters."
africa_promoted_green_starting: "Unsettled Canopy"
africa_promoted_green_starting_desc: "The new collective must balance growth against the land it protects."
africa_promoted_rivers_starting: "Broken Water Bargains"
africa_promoted_rivers_starting_desc: "Dams, crossings, and droughts have made every bank a negotiation."
africa_promoted_stoneborn_starting: "Unfinished Cairns"
africa_promoted_stoneborn_starting_desc: "Animated monuments awaken slowly while modern armies surround their ruins."
africa_promoted_ancient_starting: "Fractured Memory"
africa_promoted_ancient_starting_desc: "The restored host remembers too many eras and too few reliable orders."
africa_promoted_pan_route: "Forest Intelligence"
africa_promoted_pan_route_desc: "Toolmakers turn observation and ambush into a common doctrine."
africa_promoted_gorilla_route: "Guardian Oath"
africa_promoted_gorilla_route_desc: "The mountain council binds strength to defence and porter discipline."
africa_promoted_green_route: "Protected Biomes"
africa_promoted_green_route_desc: "Every province is a living covenant with a cost for extraction."
africa_promoted_rivers_route: "Flood Bargaining"
africa_promoted_rivers_route_desc: "Seasonal water law turns currents and crossings into strategic arms."
africa_promoted_stoneborn_route: "Stone Resonance"
africa_promoted_stoneborn_route_desc: "Cairn networks lend defence and patient siege power to the host."
africa_promoted_ancient_route: "Relic Network"
africa_promoted_ancient_route_desc: "Recovered memories restore command links between distant monuments."
africa_promoted_pan_mature: "Toolmaker Expansion"
africa_promoted_pan_mature_desc: "The Pan compact exports engineering, reconnaissance, and forest craft."
africa_promoted_gorilla_mature: "Kingdom of Guardians"
africa_promoted_gorilla_mature_desc: "A disciplined mountain host holds its sanctuary against heavier foes."
africa_promoted_green_mature: "Mature Canopy"
africa_promoted_green_mature_desc: "A stable living frontier absorbs attrition while punishing extraction."
africa_promoted_rivers_mature: "Basin Works"
africa_promoted_rivers_mature_desc: "Managed crossings and waterworks sustain a mobile river defence."
africa_promoted_stoneborn_mature: "Restored Monuments"
africa_promoted_stoneborn_mature_desc: "Repaired ruins anchor an army that is slow to raise and difficult to break."
africa_promoted_ancient_mature: "Unbroken Legend"
africa_promoted_ancient_mature_desc: "A remembered court coordinates relic sites and modern campaigns."

africa_promoted_tiera_reveal_package: "Reveal the Strange Sovereign"
africa_promoted_tiera_reveal_package_desc: "A consented high-chaos carrier may reveal its identity only from its surveyed state."
africa_promoted_tiera_reveal_package_tt: "Reveal the country's recognised identity and seat its sovereign."
africa_promoted_tiera_convene_politics: "Convene the Impossible Polity"
africa_promoted_tiera_convene_politics_desc: "Choose the institution that will translate the strange force into government."
africa_promoted_tiera_convene_politics_tt: "Open the package-specific politics settlement."
africa_promoted_tiera_advance_mechanic: "Develop the Strange Mechanism"
africa_promoted_tiera_advance_mechanic_desc: "Advance the package's distinct machinery, ecological, river, stone, or memory mechanic."
africa_promoted_tiera_advance_mechanic_tt: "Advance the country's institution by one stage. Four stages complete its development."
africa_promoted_tiera_negotiate_league: "Negotiate the League Role"
africa_promoted_tiera_negotiate_league_desc: "Set the relationship between this impossible polity and the African League."
africa_promoted_tiera_negotiate_league_tt: "Accept, counter, or refuse the League charter."
africa_promoted_tiera_settle_overlap: "Settle the Overlap Question"
africa_promoted_tiera_settle_overlap_desc: "Resolve claims through congress, local consent, autonomy, or an explicit rival bloc."
africa_promoted_tiera_settle_overlap_tt: "Record a consented overlap settlement."
africa_promoted_tiera_rival_bloc: "Raise a Rival Bloc"
africa_promoted_tiera_rival_bloc_desc: "A refusal can harden into an explicit rival relationship."
africa_promoted_tiera_rival_bloc_tt: "Enter the rival-bloc relationship and raise host pressure."
africa_promoted_tiera_post_settlement: "Write the Post-Settlement Programme"
africa_promoted_tiera_post_settlement_desc: "Turn the settled high-chaos identity into a durable national programme."
africa_promoted_tiera_post_settlement_tt: "Complete package-specific post-settlement play."
africa_promoted_tiera_call_pan_sappers: "Deploy Pan Sappers"
africa_promoted_tiera_call_pan_sappers_desc: "Muster Pan's sappers to breach obstacles and prepare difficult ground."
africa_promoted_tiera_call_pan_sappers_tt: "Deploys a Pan Sappers formation."
africa_promoted_tiera_call_oracle_recon: "Consult the Oracle Recon"
africa_promoted_tiera_call_oracle_recon_desc: "Gather the oracles and scouts serving Pan or the Ancient Hosts into a reconnaissance force."
africa_promoted_tiera_call_oracle_recon_tt: "Deploys an Oracle Recon formation."
africa_promoted_tiera_call_gorilla_heavy: "Summon Gorilla Heavy Infantry"
africa_promoted_tiera_call_gorilla_heavy_desc: "Muster armoured gorilla companies for close assault and defensive fighting."
africa_promoted_tiera_call_gorilla_heavy_tt: "Deploys a Gorilla Heavy Infantry formation."
africa_promoted_tiera_call_forest_giants: "Grow Forest Giants"
africa_promoted_tiera_call_forest_giants_desc: "Call the forest's tallest guardians into a formation serving Pan or The Green."
africa_promoted_tiera_call_forest_giants_tt: "Deploys a Forest Giants formation."
africa_promoted_tiera_call_riverborn: "Unleash the Riverborn"
africa_promoted_tiera_call_riverborn_desc: "Gather the Riverborn into a mobile force trained for wetlands and crossings."
africa_promoted_tiera_call_riverborn_tt: "Deploys a Riverborn formation."
africa_promoted_tiera_call_disaster_wardens: "Appoint Disaster Wardens"
africa_promoted_tiera_call_disaster_wardens_desc: "Organise The Green's wardens to contain fire, flood, and ruined ground."
africa_promoted_tiera_call_disaster_wardens_tt: "Deploys a Disaster Wardens formation."
africa_promoted_tiera_call_stone_cohorts: "Awaken Stone Cohorts"
africa_promoted_tiera_call_stone_cohorts_desc: "Awaken disciplined Stoneborn ranks for the continental army."
africa_promoted_tiera_call_stone_cohorts_tt: "Deploys a Stone Cohorts formation."
africa_promoted_tiera_call_plague_carriers: "Recover Plague Carriers"
africa_promoted_tiera_call_plague_carriers_desc: "Recover an Ancient Hosts formation prepared to carry sickness through hostile lines."
africa_promoted_tiera_call_plague_carriers_tt: "Deploys a Plague Carriers formation."

africa_promoted_tiera_nonhuman_rampage: "Order a Nonhuman Rampage"
africa_promoted_tiera_nonhuman_rampage_desc: "The Pan, Gorilla Kingdom, Living Rivers, or Ancient Hosts can turn a settled member's territory into a proving ground. The selected member has already granted representation and consent. A full or partial rampage breaks that compact and ends the covenant's peace."
africa_promoted_tiera_nonhuman_rampage_tt: "Orders one rampage against the selected consenting human member. A full or partial rampage harms the member and breaks the constitutional compact. Failure leaves the member unharmed."
africa_promoted_tiera_nonhuman_rampage_cost: "£command_power [?constant:africa_promoted_tiera_cost.nonhuman_rampage_cp|0] before maturation, or [?constant:africa_promoted_tiera_cost.nonhuman_rampage_mature_cp|0] afterward"
africa_promoted_tiera_nonhuman_rampage_cost_blocked: "£command_power §R[?constant:africa_promoted_tiera_cost.nonhuman_rampage_cp|0]§! before maturation, or £command_power §R[?constant:africa_promoted_tiera_cost.nonhuman_rampage_mature_cp|0]§! afterward"
africa_promoted_tiera_nonhuman_rampage_cost_tooltip: "Requires the command-power reserve for the polity's current stage. This operation can be attempted once, and the selected target remains locked until it concludes."

africa_promoted_tiera_forest_actor_rampage: "Unbind the Forest Actor"
africa_promoted_tiera_forest_actor_rampage_desc: "The Green can unleash a natural disaster against a represented human member. Its severity, course, aftermath, and civilian harm will determine the consequences."
africa_promoted_tiera_forest_actor_rampage_tt: "Attempts to unleash one hostile natural disaster against the selected member. Rejection ends the attempt. Acceptance disqualifies achievements that require the Forest to preserve its compact."
africa_promoted_tiera_forest_actor_rampage_cost: "£command_power [?constant:africa_promoted_tiera_cost.forest_rampage_cp|0] before maturation, or [?constant:africa_promoted_tiera_cost.forest_rampage_mature_cp|0] afterward"
africa_promoted_tiera_forest_actor_rampage_cost_blocked: "£command_power §R[?constant:africa_promoted_tiera_cost.forest_rampage_cp|0]§! before maturation, or £command_power §R[?constant:africa_promoted_tiera_cost.forest_rampage_mature_cp|0]§! afterward"
africa_promoted_tiera_forest_actor_rampage_cost_tooltip: "Requires the command-power reserve for The Green's current stage. The disaster and any later civilian harm are assessed separately."

africa_promoted_tiera_stoneborn_rights_violation: "Withdraw Stoneborn Rights"
africa_promoted_tiera_stoneborn_rights_violation_desc: "The Stoneborn can revoke the representation and consent it previously recognised. The adjudication may fully or partially strip the member's standing. Only a failed adjudication leaves those rights intact."
africa_promoted_tiera_stoneborn_rights_violation_tt: "Adjudicates one withdrawal of rights from the selected consenting human member. A full or partial violation disqualifies achievements that require the Stoneborn to preserve those rights."
africa_promoted_tiera_stoneborn_rights_violation_cost: "£command_power [?constant:africa_promoted_tiera_cost.stoneborn_rights_cp|0] before maturation, or [?constant:africa_promoted_tiera_cost.stoneborn_rights_mature_cp|0] afterward"
africa_promoted_tiera_stoneborn_rights_violation_cost_blocked: "£command_power §R[?constant:africa_promoted_tiera_cost.stoneborn_rights_cp|0]§! before maturation, or £command_power §R[?constant:africa_promoted_tiera_cost.stoneborn_rights_mature_cp|0]§! afterward"
africa_promoted_tiera_stoneborn_rights_violation_cost_tooltip: "Requires the command-power reserve for the Stoneborn's current stage. Representation and consent are withdrawn only if the adjudication confirms a violation."

africa_promoted_tiera_stoneborn_human_member_war: "Stoneborn War Against a Human Member"
africa_promoted_tiera_stoneborn_human_member_war_desc: "The Stoneborn can abandon the constitutional compact and declare an annexation war on a represented human member."
africa_promoted_tiera_stoneborn_human_member_war_tt: "Declares an annexation war on the selected human member. Once war begins, achievements that require peace with human members are disqualified."
africa_promoted_tiera_stoneborn_human_member_war_cost: "£command_power [?constant:africa_promoted_tiera_cost.stoneborn_war_cp|0] before maturation, or [?constant:africa_promoted_tiera_cost.stoneborn_war_mature_cp|0] afterward"
africa_promoted_tiera_stoneborn_human_member_war_cost_blocked: "£command_power §R[?constant:africa_promoted_tiera_cost.stoneborn_war_cp|0]§! before maturation, or £command_power §R[?constant:africa_promoted_tiera_cost.stoneborn_war_mature_cp|0]§! afterward"
africa_promoted_tiera_stoneborn_human_member_war_cost_tooltip: "Requires the command-power reserve for the Stoneborn's current stage. The target must be a current consenting human member that is not already at war with the Stoneborn."

africa_promoted_tiera_host_great_power_war: "Open the Great-Power War"
africa_promoted_tiera_host_great_power_war_desc: "The current host can declare a separate war against a major enemy. Victory will count only if that enemy is a major power when war begins."
africa_promoted_tiera_host_great_power_war_tt: "Declares an annexation war on the selected major enemy and records its major-power status when the war begins."
africa_promoted_tiera_host_great_power_war_cost: "£command_power [?constant:africa_promoted_tiera_cost.great_power_war_cp|0] (or [?constant:africa_promoted_tiera_cost.great_power_war_mature_cp|0] after the host matures)"
africa_promoted_tiera_host_great_power_war_cost_blocked: "£command_power §R[?constant:africa_promoted_tiera_cost.great_power_war_cp|0]§! (mature hosts require £command_power §R[?constant:africa_promoted_tiera_cost.great_power_war_mature_cp|0]§!)"
africa_promoted_tiera_host_great_power_war_cost_tooltip: "Requires the host's command-power reserve and a major enemy that is not an existing human member or nonhuman actor."

africa_promoted_tiera_record_nonhuman_great_power_war_victory: "Record the Nonhuman Great-Power Victory"
africa_promoted_tiera_record_nonhuman_great_power_war_victory_desc: "The current host has defeated the enemy that was a major power when the host's great-power war began, and every core of the capitulated enemy is under host control. Four genuine formation families and preserved constitutional rights complete the victory."
africa_promoted_tiera_record_nonhuman_great_power_war_victory_tt: "Confirms victory after the former major enemy has capitulated and the host controls all of its core states. Merely revealing or declaring the war cannot satisfy this requirement."

chaosx.nr12.500.t: "A Polity Without Precedent"
chaosx.nr12.500.d: "The Pan workshops ask whether tools make a council, a republic, or a war troop."
chaosx.nr12.500.d.gorilla: "The mountain guardians must decide whether one silverback, a council, or a sanctuary commands."
chaosx.nr12.500.d.green: "The canopy speaks in three voices: biomandate, collective, or covenant."
chaosx.nr12.500.d.rivers: "The confluences demand a basin council, flood law, or guardianship."
chaosx.nr12.500.d.stoneborn: "The cairns awaken beneath a crown, a guardian compact, or silent conquest."
chaosx.nr12.500.d.ancient: "Relic court, memory council, or oath host will give the returned army a name."
chaosx.nr12.500.a: "Seat the first institution"
chaosx.nr12.500.b: "Open a second path"
chaosx.nr12.500.c: "Choose the hard path"
chaosx.nr12.501.t: "A Place in the League"
chaosx.nr12.501.d: "The League offers the Pan compact a protected forest charter."
chaosx.nr12.501.d.gorilla: "The League offers the Gorilla Kingdom a guarded charter."
chaosx.nr12.501.d.green: "The League offers The Green a covenant that can limit extraction."
chaosx.nr12.501.d.rivers: "The League offers Living Rivers a protected waterway role."
chaosx.nr12.501.d.stoneborn: "The League offers Stoneborn an association for heritage defence."
chaosx.nr12.501.d.ancient: "The League offers Ancient Hosts a charter for relic sites."
chaosx.nr12.501.a: "Accept the charter"
chaosx.nr12.501.b: "Counter with our terms"
chaosx.nr12.501.c: "Refuse the League"
chaosx.nr12.502.t: "The Overlap Question"
chaosx.nr12.502.d: "The Pan forest borders a compact already claimed by another African actor."
chaosx.nr12.502.d.gorilla: "The Gorilla sanctuary touches a frontier claimed by another African actor."
chaosx.nr12.502.d.green: "The Green's roots cross a frontier where consent is not automatic."
chaosx.nr12.502.d.rivers: "The living channel crosses jurisdictions that demand a settlement."
chaosx.nr12.502.d.stoneborn: "The restored cairns stand inside a contested historical landscape."
chaosx.nr12.502.d.ancient: "The relic corridor overlaps a living polity's claims."
chaosx.nr12.502.a: "Convene a League congress"
chaosx.nr12.502.b: "Seek local consent"
chaosx.nr12.502.c: "Request autonomous terms"
chaosx.nr12.502.rival: "Raise a rival bloc"
