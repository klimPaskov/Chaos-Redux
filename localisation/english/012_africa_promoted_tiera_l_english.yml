africa_promoted_pan_starting: "Stolen Machinery"
africa_promoted_pan_starting_desc: "Borrowed engines and contested clearings strain the forest workshops."
africa_promoted_gorilla_starting: "Mountain Supply Burden"
africa_promoted_gorilla_starting_desc: "A strong kingdom cannot eat stone; every porter and path matters."
africa_promoted_green_starting: "Unsettled Canopy"
africa_promoted_green_starting_desc: "The new collective must balance growth against the land it protects."
africa_promoted_rivers_starting: "Broken Water Bargains"
africa_promoted_rivers_starting_desc: "Dams, crossings, and droughts have made every bank a negotiation."
africa_promoted_stoneborn_starting: "Unfinished Cairns"
africa_promoted_stoneborn_starting_desc: "Animated monuments awaken slowly while modern armies surround their ruins."
africa_promoted_ancient_starting: "Fractured Memory"
africa_promoted_ancient_starting_desc: "The restored host remembers too many eras and too few reliable orders."
africa_promoted_pan_route: "Forest Intelligence"
africa_promoted_pan_route_desc: "Toolmakers turn observation and ambush into a common doctrine."
africa_promoted_gorilla_route: "Guardian Oath"
africa_promoted_gorilla_route_desc: "The mountain council binds strength to defence and porter discipline."
africa_promoted_green_route: "Protected Biomes"
africa_promoted_green_route_desc: "Every province is a living covenant with a cost for extraction."
africa_promoted_rivers_route: "Flood Bargaining"
africa_promoted_rivers_route_desc: "Seasonal water law turns currents and crossings into strategic arms."
africa_promoted_stoneborn_route: "Stone Resonance"
africa_promoted_stoneborn_route_desc: "Cairn networks lend defence and patient siege power to the host."
africa_promoted_ancient_route: "Relic Network"
africa_promoted_ancient_route_desc: "Recovered memories restore command links between distant monuments."
africa_promoted_pan_mature: "Toolmaker Expansion"
africa_promoted_pan_mature_desc: "The Pan compact exports engineering, reconnaissance, and forest craft."
africa_promoted_gorilla_mature: "Kingdom of Guardians"
africa_promoted_gorilla_mature_desc: "A disciplined mountain host holds its sanctuary against heavier foes."
africa_promoted_green_mature: "Mature Canopy"
africa_promoted_green_mature_desc: "A stable living frontier absorbs attrition while punishing extraction."
africa_promoted_rivers_mature: "Basin Works"
africa_promoted_rivers_mature_desc: "Managed crossings and waterworks sustain a mobile river defence."
africa_promoted_stoneborn_mature: "Restored Monuments"
africa_promoted_stoneborn_mature_desc: "Repaired ruins anchor an army that is slow to raise and difficult to break."
africa_promoted_ancient_mature: "Unbroken Legend"
africa_promoted_ancient_mature_desc: "A remembered court coordinates relic sites and modern campaigns."

africa_promoted_tiera_reveal_package: "Reveal the Strange Sovereign"
africa_promoted_tiera_reveal_package_desc: "A consented high-chaos carrier may reveal its identity only from its surveyed state."
africa_promoted_tiera_reveal_package_tt: "Reveal the promoted Tier A identity and install its dormant sovereign."
africa_promoted_tiera_convene_politics: "Convene the Impossible Polity"
africa_promoted_tiera_convene_politics_desc: "Choose the institution that will translate the strange force into government."
africa_promoted_tiera_convene_politics_tt: "Open the package-specific politics settlement."
africa_promoted_tiera_advance_mechanic: "Develop the Strange Mechanism"
africa_promoted_tiera_advance_mechanic_desc: "Advance the package's distinct machinery, ecological, river, stone, or memory mechanic."
africa_promoted_tiera_advance_mechanic_tt: "Advance one mechanic stage; four stages mature the package."
africa_promoted_tiera_negotiate_league: "Negotiate the League Role"
africa_promoted_tiera_negotiate_league_desc: "Set the relationship between this impossible polity and the African League."
africa_promoted_tiera_negotiate_league_tt: "Accept, counter, or refuse the League charter."
africa_promoted_tiera_settle_overlap: "Settle the Overlap Question"
africa_promoted_tiera_settle_overlap_desc: "Resolve claims through congress, local consent, autonomy, or an explicit rival bloc."
africa_promoted_tiera_settle_overlap_tt: "Record a consented overlap settlement."
africa_promoted_tiera_rival_bloc: "Raise a Rival Bloc"
africa_promoted_tiera_rival_bloc_desc: "A refusal can harden into an explicit rival relationship."
africa_promoted_tiera_rival_bloc_tt: "Enter the rival-bloc relationship and raise host pressure."
africa_promoted_tiera_post_settlement: "Write the Post-Settlement Programme"
africa_promoted_tiera_post_settlement_desc: "Turn the settled high-chaos identity into a durable national programme."
africa_promoted_tiera_post_settlement_tt: "Complete package-specific post-settlement play."
africa_promoted_tiera_call_pan_sappers: "Deploy Pan Sappers"
africa_promoted_tiera_call_pan_sappers_desc: "Raise the exact Pan sapper consumer after the strange-force package is ready."
africa_promoted_tiera_call_pan_sappers_tt: "Call pan_sappers through its manifest wrapper."
africa_promoted_tiera_call_oracle_recon: "Consult the Oracle Recon"
africa_promoted_tiera_call_oracle_recon_desc: "Raise the exact oracle recon consumer for Pan or Ancient Hosts."
africa_promoted_tiera_call_oracle_recon_tt: "Call oracle_recon through its manifest wrapper."
africa_promoted_tiera_call_gorilla_heavy: "Summon Gorilla Heavy Infantry"
africa_promoted_tiera_call_gorilla_heavy_desc: "Raise the exact gorilla heavy infantry consumer."
africa_promoted_tiera_call_gorilla_heavy_tt: "Call gorilla_heavy_infantry through its manifest wrapper."
africa_promoted_tiera_call_forest_giants: "Grow Forest Giants"
africa_promoted_tiera_call_forest_giants_desc: "Raise the exact forest giants consumer for Pan or The Green."
africa_promoted_tiera_call_forest_giants_tt: "Call forest_giants through its manifest wrapper."
africa_promoted_tiera_call_riverborn: "Unleash the Riverborn"
africa_promoted_tiera_call_riverborn_desc: "Raise the exact riverborn consumer."
africa_promoted_tiera_call_riverborn_tt: "Call riverborn through its manifest wrapper."
africa_promoted_tiera_call_disaster_wardens: "Appoint Disaster Wardens"
africa_promoted_tiera_call_disaster_wardens_desc: "Raise the exact disaster wardens consumer for The Green."
africa_promoted_tiera_call_disaster_wardens_tt: "Call disaster_wardens through its manifest wrapper."
africa_promoted_tiera_call_stone_cohorts: "Awaken Stone Cohorts"
africa_promoted_tiera_call_stone_cohorts_desc: "Raise the exact stone cohorts consumer."
africa_promoted_tiera_call_stone_cohorts_tt: "Call stone_cohorts through its manifest wrapper."
africa_promoted_tiera_call_plague_carriers: "Recover Plague Carriers"
africa_promoted_tiera_call_plague_carriers_desc: "Raise the exact plague carriers consumer for Ancient Hosts."
africa_promoted_tiera_call_plague_carriers_tt: "Call plague_carriers through its manifest wrapper."

chaosx.nr12.500.t: "A Polity Without Precedent"
chaosx.nr12.500.d: "The Pan workshops ask whether tools make a council, a republic, or a war troop."
chaosx.nr12.500.d.gorilla: "The mountain guardians must decide whether one silverback, a council, or a sanctuary commands."
chaosx.nr12.500.d.green: "The canopy speaks in three voices: biomandate, collective, or covenant."
chaosx.nr12.500.d.rivers: "The confluences demand a basin council, flood law, or guardianship."
chaosx.nr12.500.d.stoneborn: "The cairns awaken beneath a crown, a guardian compact, or silent conquest."
chaosx.nr12.500.d.ancient: "Relic court, memory council, or oath host will give the returned army a name."
chaosx.nr12.500.a: "Seat the first institution"
chaosx.nr12.500.b: "Open a second path"
chaosx.nr12.500.c: "Choose the hard path"
chaosx.nr12.501.t: "A Place in the League"
chaosx.nr12.501.d: "The League offers the Pan compact a protected forest charter."
chaosx.nr12.501.d.gorilla: "The League offers the Gorilla Kingdom a guarded charter."
chaosx.nr12.501.d.green: "The League offers The Green a covenant that can limit extraction."
chaosx.nr12.501.d.rivers: "The League offers Living Rivers a protected waterway role."
chaosx.nr12.501.d.stoneborn: "The League offers Stoneborn an association for heritage defence."
chaosx.nr12.501.d.ancient: "The League offers Ancient Hosts a charter for relic sites."
chaosx.nr12.501.a: "Accept the charter"
chaosx.nr12.501.b: "Counter with our terms"
chaosx.nr12.501.c: "Refuse the League"
chaosx.nr12.502.t: "The Overlap Question"
chaosx.nr12.502.d: "The Pan forest borders a compact already claimed by another African actor."
chaosx.nr12.502.d.gorilla: "The Gorilla sanctuary touches a frontier claimed by another African actor."
chaosx.nr12.502.d.green: "The Green's roots cross a frontier where consent is not automatic."
chaosx.nr12.502.d.rivers: "The living channel crosses jurisdictions that demand a settlement."
chaosx.nr12.502.d.stoneborn: "The restored cairns stand inside a contested historical landscape."
chaosx.nr12.502.d.ancient: "The relic corridor overlaps a living polity's claims."
chaosx.nr12.502.a: "Convene a League congress"
chaosx.nr12.502.b: "Seek local consent"
chaosx.nr12.502.c: "Request autonomous terms"
chaosx.nr12.502.rival: "Raise a rival bloc"
