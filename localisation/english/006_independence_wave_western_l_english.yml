l_english:
  # SOURCE: 006_independence_wave_brittany_l_english.yml
  BRI_independence_wave_civic_delegate: "Régis de l'Estourbeillon"
  BRI_independence_wave_civic_delegate_desc: "A founder and long-serving president of the Breton Regionalist Union and a former Morbihan deputy, de l'Estourbeillon brings an established conservative regionalist network to the provisional government."
  BRI_independence_wave_coastal_commandant: "Henri-Léon Devin"
  BRI_independence_wave_coastal_commandant_desc: "A French naval officer who commanded the École navale at Brest from 1930, Devin brings professional staff discipline to the difficult union of port crews, sailors, and inland territorial guards."

  BRI_independence_wave_democratic_party: "Federal Assembly"
  BRI_independence_wave_democratic_party_long: "Breton Federal Assembly"
  BRI_independence_wave_communism_party: "Workers' Councils"
  BRI_independence_wave_communism_party_long: "Dock, Rail and Fisheries Councils"
  BRI_independence_wave_neutrality_party: "Regionalist Union"
  BRI_independence_wave_neutrality_party_long: "Breton Regionalist Union"
  BRI_independence_wave_fascism_party: "National Breton Party"
  BRI_independence_wave_fascism_party_long: "National Breton Party"
  BRI_independence_wave_constitutional_party: "Federal Civic Compact"
  BRI_independence_wave_constitutional_party_long: "Federal Civic Compact of Brittany"
  BRI_independence_wave_labor_party: "Maritime Councils"
  BRI_independence_wave_labor_party_long: "Dock, Rail and Fisheries Councils"
  BRI_independence_wave_traditional_party: "Cultural Communities"
  BRI_independence_wave_traditional_party_long: "Regionalist Union and Cultural Communities"
  BRI_independence_wave_emergency_party: "Coastal Command"
  BRI_independence_wave_emergency_party_long: "Joint Breton Coastal Command"
  BRI_independence_wave_patron_party: "Ports Commission"
  BRI_independence_wave_patron_party_long: "Protected Ports Commission"

  independence_wave_bri_brittany_category: "The Breton Maritime Settlement"
  independence_wave_bri_brittany_category_desc: "The ports can sustain the country only if Breton and Gallo communities accept the same public settlement and the sailors answer to a single command.\n\nBreton and Gallo Public Compact: §Y[?independence_wave_bri_language_compact|0]§! / [?constant:independence_wave_brittany_pressure.maximum|0]\nCoastal Command: §Y[?independence_wave_bri_coastal_command|0]§! / [?constant:independence_wave_brittany_pressure.maximum|0]\n\nBoth values must reach §Y[?constant:independence_wave_brittany_pressure.stable|0]§! to secure the compact."

  independence_wave_bri_hold_breton_settlement_together: "Hold the Breton Settlement Together"
  independence_wave_bri_hold_breton_settlement_together_desc: "The sudden separation of Brittany has left port crews, railway officials, farmers, Breton-speaking districts, and Gallo communities under one improvised authority. The settlement must become credible before competing institutions pull it apart."
  independence_wave_bri_project_failure_effect_tt: "The bilingual compact and coastal command each change by §R[?constant:independence_wave_brittany_pressure.standard_loss|0]§!. Legitimacy, recognition, capacity, and security suffer while founding instability rises."

  independence_wave_bri_charter_breton_gallo_services: "Charter Breton and Gallo Public Services"
  independence_wave_bri_charter_breton_gallo_services_desc: "Local offices must be able to serve both cultural communities without turning every form, schoolroom, and court notice into a contest over the state itself."
  independence_wave_bri_language_project_effect_tt: "Breton and Gallo Public Compact gains §G[?constant:independence_wave_brittany_pressure.decisive_gain|0]§!. Coastal Command gains §G[?constant:independence_wave_brittany_pressure.minor_gain|0]§!, and the civil administration becomes more capable."

  independence_wave_bri_reopen_ports_fisheries_board: "Reopen the Ports and Fisheries Board"
  independence_wave_bri_reopen_ports_fisheries_board_desc: "Harbor pilots, fishermen, customs clerks, and rail dispatchers need one board that can keep catches, coal, and coastal cargo moving through the same ledgers."
  independence_wave_bri_port_project_effect_tt: "Coastal Command gains §G[?constant:independence_wave_brittany_pressure.decisive_gain|0]§!. Breton and Gallo Public Compact gains §G[?constant:independence_wave_brittany_pressure.minor_gain|0]§!, and state capacity improves."

  independence_wave_bri_integrate_sailors_territorial_guards: "Integrate Sailors and Territorial Guards"
  independence_wave_bri_integrate_sailors_territorial_guards_desc: "Port detachments know the coast while local companies know the roads inland. A single command must define where naval duties end and territorial defense begins."
  independence_wave_bri_security_project_effect_tt: "Coastal Command gains §G[?constant:independence_wave_brittany_pressure.decisive_gain|0]§!. Breton and Gallo Public Compact gains §G[?constant:independence_wave_brittany_pressure.minor_gain|0]§!, and national security improves."

  independence_wave_bri_settle_french_asset_ledgers: "Settle the French Asset Ledgers"
  independence_wave_bri_settle_french_asset_ledgers_desc: "Ships, depots, pensions, rail stock, and public property still carry French accounts. A negotiated ledger can protect Breton use without pretending that every inherited obligation vanished at the border."
  independence_wave_bri_host_settlement_effect_tt: "Both compact values gain §G[?constant:independence_wave_brittany_pressure.standard_gain|0]§!. Property and obligation disputes with the former host ease, and diplomatic standing improves."

  independence_wave_bri_prioritize_inherited_flotilla: "Prioritize the Inherited Flotilla"
  independence_wave_bri_prioritize_inherited_flotilla_desc: "Keep the best crews, fuel, and workshops with the vessels assigned to coastal patrols. The ports will be harder to isolate, but inland administration and reserves will carry the burden."
  independence_wave_bri_flotilla_priority_effect_tt: "Coastal Command gains §G[?constant:independence_wave_brittany_pressure.major_gain|0]§!. Security improves slightly, but capacity falls and founding instability rises. This excludes the inland reserve plan."

  independence_wave_bri_hold_inland_mobile_reserve: "Hold an Inland Mobile Reserve"
  independence_wave_bri_hold_inland_mobile_reserve_desc: "Release crews and fuel from secondary patrol duties to form a mobile reserve around the rail junctions. The interior will be steadier, but foreign observers may doubt the reach of the new coastal state."
  independence_wave_bri_inland_reserve_effect_tt: "Coastal Command gains §G[?constant:independence_wave_brittany_pressure.standard_gain|0]§!. Capacity and security improve while recognition falls slightly. This excludes flotilla priority."

  independence_wave_bri_ratify_federalist_compact: "Ratify the Federalist Compact"
  independence_wave_bri_ratify_federalist_compact_desc: "Bind the municipalities, cultural communities, and ports to an elected federal assembly with limited emergency powers."
  independence_wave_bri_charter_dock_rail_fisheries_councils: "Charter the Maritime Councils"
  independence_wave_bri_charter_dock_rail_fisheries_councils_desc: "Place the economic arteries of Brittany under councils drawn from dockworkers, railwaymen, fishermen, and cooperative delegates."
  independence_wave_bri_entrust_regionalist_union: "Entrust the Regionalist Union"
  independence_wave_bri_entrust_regionalist_union_desc: "Let cultural associations, municipalities, and the regionalist union guard Breton institutions without surrendering the Gallo-speaking east to an imposed identity."
  independence_wave_bri_establish_joint_coastal_command: "Establish the Joint Coastal Command"
  independence_wave_bri_establish_joint_coastal_command_desc: "Give the territorial commandant temporary authority over port defense, fuel distribution, and the inland approaches until the crisis has passed."
  independence_wave_bri_accept_protected_ports_mandate: "Accept a Protected Ports Mandate"
  independence_wave_bri_accept_protected_ports_mandate_desc: "Exchange part of Brittany's freedom of action for guarantees that keep the harbors supplied and the former host at the negotiating table."
  independence_wave_bri_route_government_effect_tt: "The selected Breton government takes office and establishes its lasting route spirit."

  independence_wave_bri_codify_durable_independence: "Codify Durable Breton Independence"
  independence_wave_bri_codify_durable_independence_desc: "Join the bilingual settlement, coastal command, elected or appointed authority, and foreign obligations into one durable constitutional order."
  independence_wave_bri_durable_independence_effect_tt: "The Breton settlement becomes durable. Legitimacy, recognition, capacity, and security improve while founding instability falls."

  independence_wave_bri_open_celtic_port_corridor: "Open a Celtic Port Corridor"
  independence_wave_bri_open_celtic_port_corridor_desc: "Coordinate pilotage, mail, relief cargoes, and harbor schedules with the other Celtic delegations without placing any port under foreign rule."
  independence_wave_bri_network_project_effect_tt: "Network standing rises and the Breton maritime settlement gains broad institutional support."

  independence_wave_bri_convene_celtic_delegation: "Convene the Breton Celtic Delegation"
  independence_wave_bri_convene_celtic_delegation_desc: "Invite the participating Celtic governments to a congress of equal delegations. The proposed union joins sovereign members through consent and shared institutions."
  independence_wave_bri_celtic_congress_effect_tt: "The Breton delegation prepares the §YCeltic Congress§! ledgers and submits them to the shared congress vote. A successful vote leaves the Celtic compact ready for the final proclamation. No rival union charter is opened."

  bri_divided_ports_and_language_state: "Divided Ports and Language State"
  bri_divided_ports_and_language_state_desc: "Brittany has a coastline, a flag, and public offices, but its harbor chains and cultural settlements still answer to overlapping authorities. Until both are reconciled, every shortage can become a constitutional crisis."
  bri_bilingual_maritime_compact: "Bilingual Maritime Compact"
  bri_bilingual_maritime_compact_desc: "Breton and Gallo public services share a settled charter while the ports, convoy crews, and territorial guards work through a common coastal command."
  bri_federalist_civic_charter: "Federalist Civic Charter"
  bri_federalist_civic_charter_desc: "An elected assembly balances municipal autonomy, cultural guarantees, and the practical authority needed to run a small Atlantic state."
  bri_dock_rail_fisheries_councils: "Dock, Rail and Fisheries Councils"
  bri_dock_rail_fisheries_councils_desc: "Workers' delegates coordinate the ports and inland railways through a cooperative maritime administration."
  bri_regionalist_cultural_compact: "Regionalist Cultural Compact"
  bri_regionalist_cultural_compact_desc: "Cultural communities and municipalities sustain the state through local obligation, public language guarantees, and a guarded regional identity."
  bri_joint_coastal_command: "Joint Coastal Command"
  bri_joint_coastal_command_desc: "Port officers and territorial commanders hold emergency authority over the coastline and inland approaches, at a cost to ordinary political initiative."
  bri_protected_ports_mandate: "Protected Ports Mandate"
  bri_protected_ports_mandate_desc: "External guarantees keep the docks supplied and convoy lanes open, but contractual obligations narrow the government's freedom of action."

  independence_wave_bri_charter_ports_fisheries_focus: "Charter the Ports and Fisheries"
  independence_wave_bri_charter_ports_fisheries_focus_desc: "A unified maritime board can reconnect the harbor offices, fishing cooperatives, customs posts, and rail dispatchers that sustain the Breton coast."
  independence_wave_bri_charter_ports_fisheries_tt: "Breton and Gallo Public Compact gains §G[?constant:independence_wave_brittany_pressure.minor_gain|0]§!. Coastal Command gains §G[?constant:independence_wave_brittany_pressure.major_gain|0]§!, and administration improves."
  independence_wave_bri_establish_breton_gallo_services_focus: "Establish Breton and Gallo Services"
  independence_wave_bri_establish_breton_gallo_services_focus_desc: "The republic must speak to its citizens in the languages of their districts while maintaining one intelligible public service."
  independence_wave_bri_establish_breton_gallo_services_tt: "Breton and Gallo Public Compact gains §G[?constant:independence_wave_brittany_pressure.decisive_gain|0]§!. Coastal Command gains §G[?constant:independence_wave_brittany_pressure.minor_gain|0]§!, and the public settlement advances."
  independence_wave_bri_integrate_sailors_guards_focus: "Integrate Sailors and Guards"
  independence_wave_bri_integrate_sailors_guards_focus_desc: "The ports cannot consume every trained man and every barrel of fuel. A joint service plan will bind maritime crews to the territorial defense of the peninsula."
  independence_wave_bri_integrate_sailors_guards_tt: "Breton and Gallo Public Compact gains §G[?constant:independence_wave_brittany_pressure.minor_gain|0]§!. Coastal Command gains §G[?constant:independence_wave_brittany_pressure.decisive_gain|0]§!, and security improves."
  independence_wave_bri_settle_french_accounts_focus: "Settle the French Accounts"
  independence_wave_bri_settle_french_accounts_focus_desc: "A sober settlement over naval property, pensions, rolling stock, and public obligations will turn the former host from a disputed inheritance into a negotiable neighbor."
  independence_wave_bri_settle_french_accounts_tt: "Both compact values gain §G[?constant:independence_wave_brittany_pressure.standard_gain|0]§!. The former-host ledger and public settlement improve."
  independence_wave_bri_convene_celtic_delegation_focus: "Convene the Celtic Delegation"
  independence_wave_bri_convene_celtic_delegation_focus_desc: "Brittany will present a program of equal delegations, voluntary consent, and coordinated Atlantic ports to the Celtic Congress."
  independence_wave_bri_convene_celtic_delegation_tt: "Registers the Celtic charter, strengthens network cooperation, and authorizes the Breton delegation to convene the congress."

  # SOURCE: 006_independence_wave_catalonia_l_english.yml
  independence_wave_cat_industrial_compact_category: "Catalan Independence Wave"
  independence_wave_cat_industrial_compact_category_desc: "A standing set of civic, industrial, and security decisions for keeping Catalonia's provisional authority intact.\n\nIndustrial Cohesion: [?independence_wave_cat_industrial_cohesion|0]/100\nAssembly Legitimacy: [?independence_wave_cat_assembly_legitimacy|0]/100"
  independence_wave_cat_hold_industrial_compact_together: "Hold the Industrial Compact Together"
  independence_wave_cat_hold_industrial_compact_together_desc: "Barcelona's factories and assemblies must survive as one civic bargain. Secure the ledgers before the founding crisis breaks the provisional authority."
  independence_wave_cat_reopen_barcelona_depots: "Reopen the Barcelona Depots"
  independence_wave_cat_reopen_barcelona_depots_desc: "Bring port warehouses, rail stores, and municipal depots back under a single accountable office."
  independence_wave_cat_integrate_factory_guards: "Integrate the Factory Guards"
  independence_wave_cat_integrate_factory_guards_desc: "Fold industrial guards into a trained territorial command without stripping the workshops of their own voice."
  independence_wave_cat_reconcile_assembly_and_union: "Reconcile Assembly and Union"
  independence_wave_cat_reconcile_assembly_and_union_desc: "Give the civic assembly and the workers' delegates a common procedure for rationing, contracts, and public order."
  independence_wave_cat_settle_former_host_ledgers: "Settle the Former Host Ledgers"
  independence_wave_cat_settle_former_host_ledgers_desc: "Negotiate property, citizenship, borders, and recognition with the former host while the frontier remains quiet."
  independence_wave_cat_ratify_constitutional_charter: "Ratify the Constitutional Charter"
  independence_wave_cat_ratify_constitutional_charter_desc: "Turn the provisional assembly into a constitutional government with a public mandate."
  independence_wave_cat_convene_workers_board: "Convene the Workers' Board"
  independence_wave_cat_convene_workers_board_desc: "Place factories, unions, and the supply office under a workers' board that can keep production moving."
  independence_wave_cat_confirm_municipal_covenant: "Confirm the Municipal Covenant"
  independence_wave_cat_confirm_municipal_covenant_desc: "Bind the comarques to a municipal covenant that preserves local authority while sharing the burdens of defence."
  independence_wave_cat_establish_pyrenean_command: "Establish the Pyrenean Command"
  independence_wave_cat_establish_pyrenean_command_desc: "Create an emergency command for the mountain approaches, depots, and rail junctions."
  independence_wave_cat_codify_durable_sovereignty: "Codify Durable Sovereignty"
  independence_wave_cat_codify_durable_sovereignty_desc: "With the compact stable and a route government in place, record sovereignty as a durable state settlement."
  independence_wave_cat_open_mediterranean_network: "Open the Mediterranean Network"
  independence_wave_cat_open_mediterranean_network_desc: "Join the maritime network and turn Barcelona's harbour into a practical corridor for the league."

  independence_wave_cat_project_failure_effect_tt: "The compact loses industrial cohesion and assembly legitimacy."
  independence_wave_cat_depots_effect_tt: "The Barcelona depots reopen: industrial cohesion rises and administration improves."
  independence_wave_cat_guards_effect_tt: "Factory guards join the territorial command: security and industrial cohesion rise."
  independence_wave_cat_assembly_effect_tt: "Assembly and union procedures are reconciled: legitimacy rises."
  independence_wave_cat_host_ledgers_effect_tt: "Former-host ledgers are settled: bilateral pressure falls and recognition improves."
  independence_wave_cat_route_effect_tt: "A Catalan route government is installed and its institutions begin to shape the state."
  independence_wave_cat_patron_route_effect_tt: "A protected customs mandate trades recognition and supplies for a patron's influence."
  independence_wave_cat_sovereignty_effect_tt: "Durable sovereignty is codified across the Catalan state."
  independence_wave_cat_network_effect_tt: "The Mediterranean network opens and the league gains a reliable corridor."

  CAT_independence_wave_civic_assembly: "Civic Assembly"
  CAT_independence_wave_civic_assembly_long: "Catalan Civic Assembly"
  CAT_independence_wave_workers_union: "Workers' Union"
  CAT_independence_wave_workers_union_long: "Catalan Workers' Union"
  CAT_independence_wave_municipal_covenant: "Municipal Covenant"
  CAT_independence_wave_municipal_covenant_long: "Catalan Municipal Covenant"
  CAT_independence_wave_emergency_directorate: "Emergency Directorate"
  CAT_independence_wave_emergency_directorate_long: "Catalan Emergency Directorate"
  CAT_independence_wave_constitutional_charter: "Constitutional Charter"
  CAT_independence_wave_constitutional_charter_long: "Catalan Constitutional Charter"
  CAT_independence_wave_workers_charter: "Workers' Charter"
  CAT_independence_wave_workers_charter_long: "Catalan Workers' Charter"
  CAT_independence_wave_protected_charter: "Protected Charter"
  CAT_independence_wave_protected_charter_long: "Catalan Protected Charter"

  independence_wave_cat_accept_protected_customs_mandate: "Accept the Protected Customs Mandate"
  independence_wave_cat_accept_protected_customs_mandate_desc: "Secure recognition, supplies, and a guarded trade channel by accepting a patron's customs mandate without surrendering the Catalan assembly."

  cat_contested_assembly: "Contested Assembly"
  cat_contested_assembly_desc: "The provisional assembly must balance industrial survival against competing civic mandates."
  cat_industrial_compact: "Industrial Compact"
  cat_industrial_compact_desc: "Barcelona's workshops, rail offices, and civic assembly now share a stable industrial compact."
  cat_constitutional_charter: "Constitutional Charter"
  cat_constitutional_charter_desc: "A constitutional route gives the provisional state a public legal foundation and a clearer mandate."
  cat_workers_board: "Workers' Board"
  cat_workers_board_desc: "Workers' delegates coordinate production, supply, and public order through the board."
  cat_municipal_covenant: "Municipal Covenant"
  cat_municipal_covenant_desc: "Municipal authority is protected by a covenant that still binds the comarques to common defence."
  cat_security_command: "Pyrenean Security Command"
  cat_security_command_desc: "An emergency command holds the mountain approaches and the industrial rail spine."
  cat_patron_trade_mission: "Protected Trade Mission"
  cat_patron_trade_mission_desc: "A patron-backed trade mission turns recognition into supplies, contracts, and diplomatic leverage."

  independence_wave_cat_secure_barcelona_port_focus: "Secure the Barcelona Port"
  independence_wave_cat_secure_barcelona_port_focus_desc: "The port is the hinge between factory survival and maritime recognition."
  independence_wave_cat_secure_barcelona_port_tt: "Reopen the port offices and raise Catalan industrial cohesion."
  independence_wave_cat_integrate_factory_workers_focus: "Integrate Factory Workers"
  independence_wave_cat_integrate_factory_workers_focus_desc: "A single command can protect the factories without erasing their civic committees."
  independence_wave_cat_integrate_factory_workers_tt: "Integrate the factory guards and strengthen the industrial compact."
  independence_wave_cat_reconcile_assembly_focus: "Reconcile the Assembly"
  independence_wave_cat_reconcile_assembly_focus_desc: "A common assembly procedure can keep the civic and workers' mandates from splitting the state."
  independence_wave_cat_reconcile_assembly_tt: "Reconcile assembly procedure and raise assembly legitimacy."
  independence_wave_cat_settle_iberian_charter_focus: "Settle the Iberian Charter"
  independence_wave_cat_settle_iberian_charter_focus_desc: "The former host must see a negotiated settlement as safer than a reconquest."
  independence_wave_cat_settle_iberian_charter_tt: "Settle former-host ledgers and improve the founding compact."
  independence_wave_cat_open_mediterranean_corridor_focus: "Open the Mediterranean Corridor"
  independence_wave_cat_open_mediterranean_corridor_focus_desc: "Barcelona can turn the league's maritime promise into a working corridor."
  independence_wave_cat_open_mediterranean_corridor_tt: "Open the Mediterranean network and increase league cooperation."
  independence_wave_cat_ratify_catalan_sovereignty_focus: "Ratify Catalan Sovereignty"
  independence_wave_cat_ratify_catalan_sovereignty_focus_desc: "A stable compact and a chosen government can make sovereignty durable."
  independence_wave_cat_ratify_catalan_sovereignty_tt: "Codify durable sovereignty and complete the Catalan settlement."

  # SOURCE: 006_independence_wave_ice_l_english.yml
  independence_wave_ice_hold_the_harbour: "Hold the Harbour Together"
  independence_wave_ice_hold_the_harbour_desc: "Iceland's first winter as an emergency republic is a contest between a fragile port authority, a short coastline, and a former host that still has a claim to the island's future. Keep Reykjavík and the harbour in our hands while the emergency republic builds a serviceable state."
  independence_wave_ice_reconcile_shipping_registers: "Reconcile the Shipping Registers"
  independence_wave_ice_reconcile_shipping_registers_desc: "Merge municipal lists, merchant manifests, and customs seals into one working register. The port will carry the republic only if its ledgers agree."
  independence_wave_ice_charter_municipal_council: "Charter the Municipal Council"
  independence_wave_ice_charter_municipal_council_desc: "Give fishing towns, harbour officials, and the provisional cabinet a common charter. The charter costs factories and administrative labour and makes the emergency government legible to its own citizens."
  independence_wave_ice_expand_coastwatch: "Expand the Coastwatch"
  independence_wave_ice_expand_coastwatch_desc: "Put patrol craft, local guards, and signal stations under one coastwatch command. The island cannot deter a landing with speeches alone."
  independence_wave_ice_negotiate_north_atlantic_compact: "Negotiate the North Atlantic Compact"
  independence_wave_ice_negotiate_north_atlantic_compact_desc: "Use the informal network to turn shared shipping, patrol, and recognition into a chartered North Atlantic Compact. The agreement sets specific obligations and leaves its members sovereign."
  independence_wave_ice_settle_former_host_charter: "Settle the Former Host Charter"
  independence_wave_ice_settle_former_host_charter_desc: "Settle property, citizens' rights, border claims, and future shipping access with the surviving former host. Recognition is cheaper than a permanent war, but it requires a credible ledger."
  independence_wave_ice_declare_armed_neutrality: "Declare Armed Neutrality"
  independence_wave_ice_declare_armed_neutrality_desc: "Bind the emergency republic to armed neutrality: no patron receives a blank cheque, and no fleet approaches the island without an answer."
  independence_wave_ice_shipping_registers_effect_tt: "Port Authority, Civic Cohesion, Coastwatch Readiness, Shipping Security, and Compact Support improve as the island's registers are reconciled."
  independence_wave_ice_municipal_charter_effect_tt: "The municipal shipping council is established. Port Authority and Civic Cohesion improve, recognition and institutional capacity rise, and founding instability falls."
  independence_wave_ice_coastwatch_effect_tt: "Coastwatch readiness and shipping security improve, and the emergency command becomes visible."
  independence_wave_ice_compact_effect_tt: "Network standing and league cohesion improve. Discovery of the North Atlantic Compact is open, but formation still requires consent and ratification."
  independence_wave_ice_host_charter_effect_tt: "The former-host ledger is settled as recognized separation, reducing claim, hostility, property, population, pressure, and reconquest fear while recording obligations and border progress."
  independence_wave_ice_armed_neutrality_effect_tt: "Coastwatch readiness and shipping security rise at the cost of civic cohesion. The emergency military route is now materially supported, while the formal government choice remains available through the route focuses."
  independence_wave_ice_project_failure_effect_tt: "The harbour project failed or was abandoned. Iceland's public statehood and separation ledgers deteriorate."
  ice_exposed_north_atlantic_charter: "Exposed North Atlantic Charter"
  ice_exposed_north_atlantic_charter_desc: "The emergency republic has a working port and an unfinished state."
  ice_north_atlantic_service_compact: "North Atlantic Service Compact"
  ice_north_atlantic_service_compact_desc: "Municipal shipping, customs, and coastwatch institutions now reinforce one another."
  ice_municipal_shipping_council: "Municipal Shipping Council"
  ice_municipal_shipping_council_desc: "A chartered council joins harbour officials, fishing towns, and the provisional cabinet."
  ice_coastwatch_emergency_command: "Coastwatch Emergency Command"
  ice_coastwatch_emergency_command_desc: "Patrol craft and local guards share signals, stores, and a common emergency chain of command."
  ice_north_atlantic_patron_mandate: "North Atlantic Patron Mandate"
  ice_north_atlantic_patron_mandate_desc: "A patron's shipping and security support comes with an influence ledger that the republic must eventually balance."
  independence_wave_ice_north_atlantic_category: "North Atlantic Republic"
