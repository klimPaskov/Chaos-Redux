 chaosx.fallout.436.t: "The Children From Elsewhere"
 chaosx.fallout.436.d: "A year after the rail families arrived, the children know the shelter routes better than the adults who first carried them through the ash. Their schoolroom has three alphabets, two songs for the dead, and a question that no ration clerk can answer: are they guests, citizens, or a promise to a country they may never see?"
 chaosx.fallout.436.a: "Grant them citizenship"
 chaosx.fallout.436.b: "Foster them through local communities"
 chaosx.fallout.436.c: "Build a school quarter"
chaosx.fallout.436.e: "Keep the return claim"
 chaosx.fallout.436.a.tt: "Spend food, medicine, recognition, and cohesion to put the children in the country's public ledger."
 chaosx.fallout.436.b.tt: "Spend food, medicine, recognition, and cohesion to place children with local households while preserving family names."
 chaosx.fallout.436.c.tt: "Spend food, medicine, recognition, and cohesion to build a school quarter where the cohort keeps its languages and records."
 chaosx.fallout.436.d.tt: "Spend food, medicine, recognition, and cohesion to keep a legal return claim for families who may find a road home."
 chaosx.fallout.438.t: "A Place in the Lesson"
 chaosx.fallout.438.grant_citizenship.success.d: "The clerk reads the names beside the ration roll and asks each child to choose the spelling used in the new ledger. The town gives them work papers, school benches, and the right to mourn in public. They are no longer guests waiting for a border that may never open."
 chaosx.fallout.438.grant_citizenship.partial.d: "The town records the children, but several offices keep the old family names in a separate drawer. The cohort can draw rations and attend lessons, though a border guard still asks where they belong."
 chaosx.fallout.438.grant_citizenship.failure.d: "The citizenship ledger becomes a quarrel over which old country owns the children. The clerk closes the book, households stop sharing names, and the schoolroom learns that a legal promise can make a child more visible and less safe."
 chaosx.fallout.438.foster_communities.success.d: "Local households open rooms without erasing the children's family names. A baker keeps the language of one rail camp, a mechanic teaches another child to read a gauge, and the shelter council records every foster promise."
 chaosx.fallout.438.foster_communities.partial.d: "Most children find a household, but the smallest settlements cannot keep the siblings together. The foster ledger protects names and letters, while daily life teaches the cohort different loyalties."
 chaosx.fallout.438.foster_communities.failure.d: "Foster promises become a market for labour. The council finds children moved between houses without records, and families who arrived together begin to lose one another in the new town."
 chaosx.fallout.438.build_school_quarter.success.d: "The school quarter opens in the old freight depot. Children learn the host country's map beside the routes their families remember, and teachers keep a public archive of names, songs, and practical skills that survived the journey."
 chaosx.fallout.438.build_school_quarter.partial.d: "The depot becomes a school, but medicine and roof timber run short. Lessons continue in two rooms while the older children teach one another outside, preserving a cohort that the country has not yet learned to house."
 chaosx.fallout.438.build_school_quarter.failure.d: "The school quarter is built before its water line is secured. Fever closes the lessons, the archive is carried to private homes, and the children return to the general shelter with no clear answer about who will teach them."
 chaosx.fallout.438.keep_return_claim.success.d: "The council keeps a sealed copy of every family name and the last known route beyond the border. The children can build a life here without surrendering the possibility that someone is still waiting for them."
 chaosx.fallout.438.keep_return_claim.partial.d: "The return claim survives in the archive, but roads, maps, and surviving relatives remain uncertain. The children learn the old route as a story that may become a duty or may remain a line on paper."
 chaosx.fallout.438.keep_return_claim.failure.d: "The return claim consumes clerks and medicine while the children wait for a road that never opens. Families accuse the council of preserving an absence instead of building a home."
 chaosx.fallout.438.a: "Record the cohort and await the generation review"
 chaosx.fallout.438.a.tt: "Apply the identity result, preserve cohort memory, and schedule a 365-day generation review."
 chaosx.fallout.440.t: "The First Home Year"
 chaosx.fallout.440.success.d: "The review finds children who know where the water line begins, which names belong on the memorial wall, and how to correct an adult who misreads the old rail map. The cohort has made a home without becoming a blank page."
 chaosx.fallout.440.partial.d: "The review finds useful lessons and unsettled households. Some children claim the town, some keep the road in their notebooks, and the country must make room for both truths."
 chaosx.fallout.440.failure.d: "The review finds a cohort divided by missing records, closed classrooms, and promises that were never kept. The children remember the shelter, but they no longer agree on what should follow it."
 chaosx.fallout.440.a: "Close the generation record"
 chaosx.fallout.440.a.tt: "Resolve the generation review, retain cohort memory, and release scheduler cleanup."
 fallout.event_log.children_from_elsewhere.name: "The Children From Elsewhere"
 fallout.event_log.children_from_elsewhere.detail: "[This.GetName] decided whether refugee children would become citizens, wards, classmates, or a return claim."
 fallout.event_log.children_from_elsewhere.grant_citizenship_success: "The children entered the public ledger and received a durable place in the new country."
 fallout.event_log.children_from_elsewhere.grant_citizenship_partial: "The children received papers while several offices kept their old names apart."
 fallout.event_log.children_from_elsewhere.grant_citizenship_failure: "A citizenship dispute made the children more visible without making them safer."
 fallout.event_log.children_from_elsewhere.foster_communities_success: "Households opened rooms while preserving the children's family names and letters."
 fallout.event_log.children_from_elsewhere.foster_communities_partial: "Most children found homes, but some siblings were separated by settlement capacity."
 fallout.event_log.children_from_elsewhere.foster_communities_failure: "Foster promises became a labour market and family records were lost."
 fallout.event_log.children_from_elsewhere.build_school_quarter_success: "A school quarter preserved languages, names, and practical records in the old freight depot."
 fallout.event_log.children_from_elsewhere.build_school_quarter_partial: "Lessons continued in a cramped depot while medicine and roof timber ran short."
 fallout.event_log.children_from_elsewhere.build_school_quarter_failure: "The school closed after its water line failed and the archive scattered."
 fallout.event_log.children_from_elsewhere.keep_return_claim_success: "The council kept a legal route home without asking the children to stop living here."
 fallout.event_log.children_from_elsewhere.keep_return_claim_partial: "The return claim survived as an uncertain map and a lesson in memory."
 fallout.event_log.children_from_elsewhere.keep_return_claim_failure: "A return claim consumed resources while the road home never opened."
 fallout.event_log.children_from_elsewhere.callback_success: "The first home year made the cohort a durable part of public life."
 fallout.event_log.children_from_elsewhere.callback_partial: "The first home year kept lessons alive while households remained unsettled."
 fallout.event_log.children_from_elsewhere.callback_failure: "The first home year left the cohort divided by missing records and closed classrooms."
