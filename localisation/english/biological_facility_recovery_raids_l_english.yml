l_english:
raid_category_biological_facility_recovery_raids: "Captured Biological Facilities"
raid_category_header_biological_facility_recovery_raids: "Captured Biological Facilities"
tooltip_raid_category_biological_facility_recovery_raids: "§YCaptured Biological Facilities§!\nArmy-led containment raids against an exact biological arsenal under our control. A selected division must include a §YBiosecurity Assault Detachment§!, be assigned to an Army Headquarters with a §YBiological Security Section§!, and carry the listed protective, decontamination, detection, transport, and support stores. A formation without that assigned headquarters section cannot succeed. A failed operation can release part of the captured stockpile into the state."
biological_facility_recovery_raid_available_tooltip: "Requires control of an unresolved captured biological arsenal. Each recovery operation also requires §YBiological Security Assault Formation§! technology and an eligible Biosecurity Assault Detachment. The selected formation conducts the operation on land."

raid_type_bio_facility_secure_preserve_raid: "Secure and Preserve the Biological Facility"
raid_type_bio_facility_secure_preserve_raid_desc: "Enter the captured arsenal under full containment, take custody of its surviving payloads, and preserve program records for attribution. This slower operation yields the strongest intelligence value, but a failed entry can breach the stockpile."
raid_type_bio_facility_destroy_safely_raid: "Destroy the Biological Facility Safely"
raid_type_bio_facility_destroy_safely_raid_desc: "Send a protected biosecurity formation to neutralize the captured payloads and demolish the arsenal chamber under containment. The operation is faster than preservation, but destroying the site sacrifices material and some forensic value."

raid_target_name_biological_captured_facility_state: "Captured biological facility in $LOCATION$"
bio_facility_capture_target_available_tt: "Select the exact unresolved biological arsenal currently controlled by us. Its captured payload ledger, original custodian, and hazard schedule remain attached to this state through later control changes."
bio_facility_capture_secure_available_tt: "Requires the exact captured facility to remain under our control and a division containing at least one §YBiosecurity Assault Detachment§!. The recovery force must reserve 80 gas masks, 50 decontamination sets, 40 CBRN instrument sets, 60 support equipment, and 30 trucks."
bio_facility_capture_secure_launchable_tt: "The exact facility must remain unresolved and under our control at launch. The selected Biosecurity Assault Detachment conducts the entry and must be assigned to an Army Headquarters with a Biological Security Section; without that exact section, the operation cannot succeed."
bio_facility_capture_destroy_available_tt: "Requires the exact captured facility to remain under our control and a division containing at least one §YBiosecurity Assault Detachment§!. The neutralization force must reserve 80 gas masks, 70 decontamination sets, 30 CBRN instrument sets, 70 support equipment, and 30 trucks."
bio_facility_capture_destroy_launchable_tt: "The exact facility must remain unresolved and under our control at launch. The selected Biosecurity Assault Detachment conducts the neutralization and must be assigned to an Army Headquarters with a Biological Security Section; without that exact section, the operation cannot succeed."

success_modifier_bio_facility_secure_hq_requirement: "§HAssigned HQ Biological Security Requirement§!"
success_modifier_bio_facility_secure_hq_requirement_negative: "§RMissing Assigned HQ Biological Security Section§!"
