success_modifier_bio_facility_secure_high_hazard_negative: "§HExceptional Captured Stockpile Hazard§!"
success_modifier_bio_facility_destroy_hq_requirement: "§HAssigned HQ Biological Security Requirement§!"
success_modifier_bio_facility_destroy_hq_requirement_negative: "§RMissing Assigned HQ Biological Security Section§!"
success_modifier_bio_facility_destroy_hq_requirement_improvement: "- Assign the participating division to an Army Headquarters with a §YBiological Security Section§!"
success_modifier_bio_facility_destroy_hq_security: "§HAssigned HQ Biological Security Section§!"
success_modifier_bio_facility_destroy_hq_security_improvement: "- Assign the participating division to an Army Headquarters with a §YBiological Security Section§!"
success_modifier_bio_facility_destroy_high_hazard: "§HExceptional Captured Stockpile Hazard§!"
success_modifier_bio_facility_destroy_high_hazard_negative: "§HExceptional Captured Stockpile Hazard§!"

bio_facility_capture_secure_failure_tt: "Containment failed during entry. A bounded share of one surviving agent stock was lost from the exact facility and released into this state. The ordinary biological lifecycle records the accidental outbreak, evidence, deaths, contamination, and medical saturation. If surviving custodian proof is available, it can also establish attribution and raise Condemnation. The remaining payload stays unresolved."
bio_facility_capture_secure_limited_tt: "The detachment secured 40 percent of each surviving captured payload and transferred it to our national reserve. The remaining stockpile and its exact-state hazard schedule remain active. Program records were preserved for attribution."
bio_facility_capture_secure_success_tt: "The detachment secured every surviving captured payload and transferred the complete stockpile to our national reserve. The exact facility hazard was resolved and program evidence was preserved."
bio_facility_capture_secure_critical_tt: "The detachment secured every surviving captured payload without loss, resolved the exact facility hazard, and preserved an exceptionally complete program archive for attribution."
bio_facility_capture_destroy_failure_tt: "Containment failed during neutralization. A bounded share of one surviving agent stock was lost from the exact facility and released into this state. The ordinary biological lifecycle records the accidental outbreak, deaths, contamination, medical saturation, and surviving evidence. If surviving custodian proof is available, it can establish attribution and raise Condemnation. The remaining payload stays unresolved."
bio_facility_capture_destroy_limited_tt: "The detachment destroyed 50 percent of each surviving captured payload under containment. The remaining stockpile and its exact-state hazard schedule stay active; some program evidence survived the operation."
bio_facility_capture_destroy_success_tt: "The detachment destroyed every surviving captured payload under containment and demolished one level of the biological facility. The exact hazard was resolved."
bio_facility_capture_destroy_critical_tt: "The detachment destroyed every surviving captured payload, demolished one level of the biological facility without a release, and recovered decisive program evidence before neutralization."

cbrn_bio_facility.2.t: "A Biological Arsenal Falls into Our Hands"
cbrn_bio_facility.2.desc: "Our forces have taken control of the designated biological arsenal in [bio_facility_notice_state.GetName]. Every unallocated agent payload held by its former custodian has been isolated in an exact facility ledger. The site remains unstable until a Biosecurity Assault Detachment secures the material or destroys it under containment."
cbrn_bio_facility.2.a: "Acknowledge the capture."
cbrn_bio_facility.3.t: "Our Biological Arsenal Has Been Captured"
cbrn_bio_facility.3.desc: "Enemy forces control our designated biological arsenal in [bio_facility_notice_state.GetName]. The unallocated Anthrax, Plague, Tularemia, and Smallpox reserves held there have been removed from national custody. The stockpile remains attached to the captured site and can be restored only by retaking it before the occupier resolves the facility."
cbrn_bio_facility.3.a: "Acknowledge the loss."
cbrn_bio_facility.4.t: "Containment Breach at a Captured Facility"
cbrn_bio_facility.4.desc: "One agent stock at the captured arsenal in [bio_facility_notice_state.GetName] has breached containment. The exact released amount has been removed from the facility ledger. Incubation, detection, spread risk, treatment pressure, deaths, contamination, and evidence will proceed through the ordinary biological response. If surviving custodian proof is available, it may establish attribution and raise Condemnation."
cbrn_bio_facility.4.a: "Acknowledge the breach."
cbrn_bio_facility.5.t: "A Captured Arsenal Has Released Our Material"
cbrn_bio_facility.5.desc: "Biological material originating from our former arsenal in [bio_facility_notice_state.GetName] has escaped while under foreign control. The episode is recorded as a captured-facility accident rather than deliberate use, but surviving records and agent signatures can still establish our responsibility and raise Condemnation."
cbrn_bio_facility.5.a: "Acknowledge the release."
cbrn_bio_facility.6.t: "The Biological Arsenal Is Back Under Our Control"
cbrn_bio_facility.6.desc: "Our forces have retaken the biological arsenal in [bio_facility_notice_state.GetName]. Every payload remaining in the exact captured-facility ledger has returned to the national reserve. If no replacement arsenal was designated during the occupation, this site's original designation and safety monitor resume; otherwise the replacement remains the sole active arsenal."
cbrn_bio_facility.6.a: "Acknowledge the recovery."
