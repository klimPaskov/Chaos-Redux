l_english:
biological_facility_recovery_raid_available_tooltip: "Requires control of a captured biological facility with unsecured material. Each recovery operation also requires §YBiological Security Assault Formation§! technology and an eligible Biosecurity Assault Detachment. The selected formation conducts the operation on land."

raid_type_bio_facility_secure_preserve_raid: "Secure and Preserve the Biological Facility"
raid_type_bio_facility_secure_preserve_raid_desc: "Enter the captured facility under full containment, take custody of its surviving payloads, and preserve program records for attribution. The slower operation yields the strongest intelligence value and risks breaching the stockpile if entry fails."
raid_type_bio_facility_destroy_safely_raid: "Destroy the Biological Facility Safely"
raid_type_bio_facility_destroy_safely_raid_desc: "Send a protected biosecurity formation to neutralize the captured payloads and demolish the storage chamber under containment. Faster than preservation, the operation sacrifices material and some forensic value."

raid_target_name_biological_captured_facility_state: "Captured biological facility in $LOCATION$"
bio_facility_capture_target_available_tt: "Select a captured biological facility under our control that still holds unsecured material. Its payloads, former custodian, and containment hazard remain tied to this state if control changes again."
bio_facility_capture_secure_available_tt: "Requires control of the captured facility and a division containing at least one §YBiosecurity Assault Detachment§!. The raid reserves the listed protective and recovery equipment during preparation."
bio_facility_capture_secure_launchable_tt: "The facility must remain unsecured and under our control at launch. The selected Biosecurity Assault Detachment conducts the entry and must be assigned to an Army Headquarters with a §YCBRN Medical and Biosecurity Section§!. The operation cannot succeed without that section."
bio_facility_capture_destroy_available_tt: "Requires control of the captured facility and a division containing at least one §YBiosecurity Assault Detachment§!. The raid reserves the listed protective and demolition equipment during preparation."
bio_facility_capture_destroy_launchable_tt: "The facility must remain unsecured and under our control at launch. The selected Biosecurity Assault Detachment conducts the neutralization and must be assigned to an Army Headquarters with a §YCBRN Medical and Biosecurity Section§!. The operation cannot succeed without that section."

success_modifier_bio_facility_secure_hq_requirement: "§HMedical and Biosecurity HQ§!"
success_modifier_bio_facility_secure_hq_requirement_negative: "§RRequired HQ Section Missing§!"
success_modifier_bio_facility_secure_hq_requirement_improvement: "- Assign the participating division to an Army Headquarters with a §YCBRN Medical and Biosecurity Section§!"
success_modifier_bio_facility_secure_hq_security: "§HMedical and Biosecurity Support§!"
success_modifier_bio_facility_secure_hq_security_improvement: "- Assign the participating division to an Army Headquarters with a §YCBRN Medical and Biosecurity Section§!"
success_modifier_bio_facility_secure_high_hazard: "§HExceptional Captured Stockpile Hazard§!"
success_modifier_bio_facility_secure_high_hazard_negative: "§HExceptional Captured Stockpile Hazard§!"
success_modifier_bio_facility_destroy_hq_requirement: "§HMedical and Biosecurity HQ§!"
success_modifier_bio_facility_destroy_hq_requirement_negative: "§RRequired HQ Section Missing§!"
success_modifier_bio_facility_destroy_hq_requirement_improvement: "- Assign the participating division to an Army Headquarters with a §YCBRN Medical and Biosecurity Section§!"
success_modifier_bio_facility_destroy_hq_security: "§HMedical and Biosecurity Support§!"
success_modifier_bio_facility_destroy_hq_security_improvement: "- Assign the participating division to an Army Headquarters with a §YCBRN Medical and Biosecurity Section§!"
success_modifier_bio_facility_destroy_high_hazard: "§HExceptional Captured Stockpile Hazard§!"
success_modifier_bio_facility_destroy_high_hazard_negative: "§HExceptional Captured Stockpile Hazard§!"

bio_facility_capture_secure_failure_tt: "Containment fails during entry, releasing some of the captured agent into this state. Illness, deaths, contamination, and pressure on local care may follow. Surviving records may identify the former custodian and raise Condemnation. The remaining stockpile still needs recovery."
bio_facility_capture_secure_limited_tt: "The detachment secured 40 percent of each surviving captured payload and transferred it to our national reserve. The remaining stockpile is still hazardous, and program records were preserved for attribution."
bio_facility_capture_secure_success_tt: "The detachment secured every surviving captured payload and transferred the complete stockpile to our national reserve. The facility hazard was resolved and program evidence was preserved."
bio_facility_capture_secure_critical_tt: "The detachment secured every surviving captured payload without loss, resolved the facility hazard, and preserved an exceptionally complete program archive for attribution."
bio_facility_capture_destroy_failure_tt: "Containment fails during neutralization, releasing some of the captured agent into this state. Illness, deaths, contamination, and pressure on local care may follow. Surviving records may identify the former custodian and raise Condemnation. The remaining stockpile still needs neutralization."
bio_facility_capture_destroy_limited_tt: "The detachment destroyed 50 percent of each surviving captured payload under containment. The remaining stockpile is still hazardous, and some program evidence survived the operation."
bio_facility_capture_destroy_success_tt: "The detachment destroyed every surviving captured payload under containment and demolished one level of the biological facility. The hazard was resolved."
bio_facility_capture_destroy_critical_tt: "The detachment destroyed every surviving captured payload, demolished one level of the biological facility without a release, and recovered decisive program evidence before neutralization."

cbrn_bio_facility.2.t: "A Biological Stockpile Site Falls into Our Hands"
cbrn_bio_facility.2.desc: "Our forces have taken control of a biological stockpile site in [bio_facility_notice_state.GetName]. The former custodian's remaining agent payloads are sealed at the facility. The site remains unstable until a Biosecurity Assault Detachment secures the material or destroys it under containment."
cbrn_bio_facility.2.a: "Acknowledge the capture."
cbrn_bio_facility.3.t: "Our Biological Stockpile Site Has Been Captured"
cbrn_bio_facility.3.desc: "Enemy forces control our biological stockpile site in [bio_facility_notice_state.GetName]. The Anthrax, Plague, Tularemia, and Smallpox reserves held there have been removed from national custody. Surviving material can return only if we retake the site before the occupier resolves the hazard."
cbrn_bio_facility.3.a: "Acknowledge the loss."
cbrn_bio_facility.4.t: "Containment Breach at a Captured Facility"
cbrn_bio_facility.4.desc: "Biological material has escaped from the captured facility in [bio_facility_notice_state.GetName]. The release may spread beyond the site, strain local care, and leave evidence of the former custodian's responsibility. Condemnation may follow."
cbrn_bio_facility.4.a: "Acknowledge the breach."
cbrn_bio_facility.5.t: "A Captured Facility Has Released Our Material"
cbrn_bio_facility.5.desc: "Biological material originating from our former stockpile site in [bio_facility_notice_state.GetName] has escaped while under foreign control. Surviving records and agent signatures can still establish our responsibility and raise Condemnation without recording deliberate use."
cbrn_bio_facility.5.a: "Acknowledge the release."
cbrn_bio_facility.6.t: "The Biological Stockpile Site Is Back Under Our Control"
cbrn_bio_facility.6.desc: "Our forces have retaken the biological stockpile site in [bio_facility_notice_state.GetName]. Every surviving payload has returned to the national reserve. The capture hazard has ended, and stockpile safeguards continue at the active facility."
cbrn_bio_facility.6.a: "Acknowledge the recovery."
