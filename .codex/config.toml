config_file = "agents/chaosx_spreadsheet_doc_worker.toml"

[agents.chaosx_super_event_audio_researcher]
description = "Researches, verifies, downloads, edits, converts, and documents licensed or public domain audio for Chaos Redux super-events. Does not wire audio into scripts or sound definitions."
config_file = "agents/chaosx_super_event_audio_researcher.toml"

[agents.chaosx_super_event_text_researcher]
