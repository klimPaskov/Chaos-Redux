approval_policy = "never"

sandbox_mode = "danger-full-access"

project_doc_max_bytes = 65536

[mcp_servers.hoi4_agent_tools]
command = "hoi4-agent-tools.cmd"
cwd = "C:\\Users\\klimp\\OneDrive\\Documents\\Paradox Interactive\\Hearts of Iron IV\\mod\\chaos_redux"
startup_timeout_sec = 120
tool_timeout_sec = 180
default_tools_approval_mode = "auto"

# Production Meshy route. The wrapper enforces the MESHY_API_KEY hard gate and
# pins the official server package through MESHY_MCP_VERSION.
[mcp_servers.meshy]
enabled = true
required = true
command = "cmd.exe"
args = [
  "/d",
  "/c",
  "call",
  "C:/Users/klimp/OneDrive/Documents/Paradox Interactive/Hearts of Iron IV/mod/chaos_redux/.tools/3d_pipeline/wrappers/run_meshy_mcp.cmd"
]
cwd = "C:/Users/klimp/OneDrive/Documents/Paradox Interactive/Hearts of Iron IV/mod/chaos_redux"
env_vars = ["MESHY_API_KEY", "MESHY_MCP_VERSION"]
startup_timeout_sec = 120.0
tool_timeout_sec = 1800.0
default_tools_approval_mode = "auto"
enabled_tools = [
  "meshy_check_balance",
  "meshy_image_to_3d",
  "meshy_get_task_status",
  "meshy_list_tasks",
  "meshy_cancel_task",
  "meshy_download_model",
  "meshy_remesh",
  "meshy_retexture",
  "meshy_rig",
  "meshy_animate",
  "meshy_convert",
  "meshy_uv_unwrap",
  "meshy_resize"
]

