approval_policy = "never"

sandbox_mode = "danger-full-access"

project_doc_max_bytes = 184320

[agents]
max_threads = 24
max_depth = 2

[mcp_servers.hoi4_agent_tools]
command = "hoi4-agent-tools.cmd"
cwd = "C:\\Users\\klimp\\OneDrive\\Documents\\Paradox Interactive\\Hearts of Iron IV\\mod\\chaos_redux"
startup_timeout_sec = 120
tool_timeout_sec = 180
default_tools_approval_mode = "auto"

# Production Meshy route. The wrapper enforces the MESHY_API_KEY hard gate and
# pins the official server package through MESHY_MCP_VERSION.
[mcp_servers.meshy]
enabled = true
required = false
command = "cmd.exe"
args = [
  "/d",
  "/c",
  "call",
  "C:/Users/klimp/OneDrive/Documents/Paradox Interactive/Hearts of Iron IV/mod/chaos_redux/.tools/3d_pipeline/wrappers/run_meshy_mcp.cmd"
]
cwd = "C:/Users/klimp/OneDrive/Documents/Paradox Interactive/Hearts of Iron IV/mod/chaos_redux"
env_vars = ["MESHY_API_KEY", "MESHY_MCP_VERSION"]
startup_timeout_sec = 120.0
tool_timeout_sec = 1800.0
default_tools_approval_mode = "auto"
enabled_tools = [
  "meshy_check_balance",
  "meshy_image_to_3d",
  "meshy_get_task_status",
  "meshy_download_model",
  "meshy_remesh",
  "meshy_rig",
  "meshy_animate",
  "meshy_convert"
]

[mcp_servers.meshy.tools.meshy_image_to_3d]
approval_mode = "approve"

# Production Blender route. This is the narrow allowlisted HOI4 adapter, not
# the general-purpose Blender Python bridge.
[mcp_servers.blender_hoi4]
enabled = true
required = false
command = "cmd.exe"
args = [
  "/d",
  "/c",
  "call",
  "C:/Users/klimp/OneDrive/Documents/Paradox Interactive/Hearts of Iron IV/mod/chaos_redux/.tools/3d_pipeline/wrappers/run_blender_hoi4_adapter.cmd"
]
cwd = "C:/Users/klimp/OneDrive/Documents/Paradox Interactive/Hearts of Iron IV/mod/chaos_redux"
env_vars = ["MESHY_API_KEY"]
startup_timeout_sec = 120.0
tool_timeout_sec = 1800.0
default_tools_approval_mode = "auto"
enabled_tools = [
  "chaosx_blender_hoi4_health",
  "chaosx_blender_hoi4_prepare_candidate",
  "chaosx_blender_hoi4_inspect_scene",
  "chaosx_blender_hoi4_process_textures",
  "chaosx_blender_hoi4_export_mesh",
  "chaosx_blender_hoi4_export_animation",
  "chaosx_blender_hoi4_author_locomotion_action",
  "chaosx_blender_hoi4_reimport_export",
  "chaosx_blender_hoi4_save_checkpoint"
]

[mcp_servers.blender_hoi4.env]
CHAOS_REDUX_MOD_ROOT = "C:/Users/klimp/OneDrive/Documents/Paradox Interactive/Hearts of Iron IV/mod/chaos_redux"
CHAOS_REDUX_3D_JOB_ROOT = "C:/Users/klimp/OneDrive/Documents/Paradox Interactive/Hearts of Iron IV/mod/chaos_redux/docs/assets/chaos_redux_3d_model_pilots/models_3d"

# Development-only official Blender Lab route. It remains installed and
# available for controlled diagnostics, but is disabled for production runs
# because its general code tool is outside the production allowlist.
[mcp_servers.blender_lab_dev]
enabled = false
required = false
command = "cmd.exe"
args = [
  "/d",
  "/c",
  "call",
  "C:/Users/klimp/OneDrive/Documents/Paradox Interactive/Hearts of Iron IV/mod/chaos_redux/.tools/3d_pipeline/wrappers/run_blender_lab_mcp.cmd"
]
cwd = "C:/Users/klimp/OneDrive/Documents/Paradox Interactive/Hearts of Iron IV/mod/chaos_redux"
env_vars = ["MESHY_API_KEY"]
startup_timeout_sec = 120.0
tool_timeout_sec = 1800.0
default_tools_approval_mode = "prompt"

[agents.chaosx_3d_model_pipeline]
description = "Creates, rigs, animates, processes, exports, audits, and documents bounded Chaos Redux HOI4 3D model packages through a Meshy 6-first workflow, including Internet-sourced custom-unit sound design and bespoke vanilla-green counter handoffs. Normal planned model and required animation spend is pre-authorized; only failure-driven extra paid recovery requires confirmation."
config_file = "agents/chaosx_3d_model_pipeline.toml"

[agents.chaosx_ai_probability_auditor]
description = "Read-only weighted-logic auditor for Chaos Redux AI weights, probabilities, MTTH, random selection, strategy factors, and custom weighted pools. Uses the HOI4 MCP probability tools for every in-scope weighted surface and reports scenario-specific evidence without patching gameplay."
config_file = "agents/chaosx_ai_probability_auditor.toml"

[agents.chaosx_asset_source_researcher]
description = "Finds, verifies, downloads, processes, converts, and documents non-portrait real or archival visual assets for Chaos Redux, including event images, super-event images, historical flags, and attested symbols. Character portraits belong entirely to chaosx_portrait_creator."
config_file = "agents/chaosx_asset_source_researcher.toml"

[agents.chaosx_country_package_auditor]
description = "Active auditor and small-patch subagent for Chaos Redux country packages. Checks and can patch tags, history, states, leaders, portraits, flags, parties, focus loading, ideas, advisors, units, technology, claims, cores, localisation, AI, formables, and playable setup inside the current task scope."
config_file = "agents/chaosx_country_package_auditor.toml"

[agents.chaosx_decision_mission_auditor]
description = "Active auditor and small-patch subagent for Chaos Redux decisions, missions, timed objectives, decision categories, scripted GUI decision surfaces, costs, tooltips, AI behavior, cleanup, balance, and exploit risk."
config_file = "agents/chaosx_decision_mission_auditor.toml"

[agents.chaosx_documentation_curator]
description = "Documentation cleanup and consistency subagent for Chaos Redux. Reconciles specs, plans, docs, handoffs, manifests, prompts, reports, and README files with accepted decisions and current implementation evidence. Reduces stale or duplicated docs, flags contradictions, writes source-of-truth maps and resume packets. Does not edit gameplay files or spreadsheets."
config_file = "agents/chaosx_documentation_curator.toml"

[agents.chaosx_event_ui_worker]
description = "Implementation and visual-layout worker for a scripted GUI introduced by one named Chaos Redux event. It must use HOI4 MCP GUI inspect, render, rewrite, and post-change comparison evidence and follow the decision-layout contract. It never audits the shared event log, event-details framework, settings UI, super-event framework, or unrelated existing interfaces."
config_file = "agents/chaosx_event_ui_worker.toml"

[agents.chaosx_event_completion_auditor]
description = "Read-only completion auditor for Chaos Redux event implementation. Compares specs, plans, prompts, and repo files, then flags missing mechanics, fallbacks, simplifications, docs gaps, asset gaps, validation gaps, and unhandled addenda."
config_file = "agents/chaosx_event_completion_auditor.toml"

[agents.chaosx_focus_tree_auditor]
description = "Active auditor and small-patch subagent for Chaos Redux focus trees. Checks and can patch route logic, prerequisites, mutual exclusions, rewards, icons, localisation, AI, formable links, and simplifications inside the current task scope."
config_file = "agents/chaosx_focus_tree_auditor.toml"

[agents.chaosx_generated_event_art]
description = "Generates and processes non-portrait fictional, symbolic, supernatural, alternate-history, WW2-style report/news/super-event, UI, flag, and faction-emblem art for Chaos Redux. Character portraits belong entirely to chaosx_portrait_creator."
config_file = "agents/chaosx_generated_event_art.toml"

[agents.chaosx_icon_artist]
description = "Creates generated icon packages, bespoke vanilla-green custom-unit counters, and frame-by-frame small animated sprites for Chaos Redux. Unit counters require exact installed-vanilla definition/DDS and matching reference-family inspection before production."
config_file = "agents/chaosx_icon_artist.toml"

[agents.chaosx_improvement_loop_planner]
description = "Plan-only event improvement loop subagent for Chaos Redux. Uses the improvement loop and event planning skills to write deep expansion addenda with research, historical connections, playable mechanics, and implementation handoffs. Does not patch gameplay files."
config_file = "agents/chaosx_improvement_loop_planner.toml"

[agents.chaosx_localisation_auditor]
description = "Active auditor and small-patch subagent for Chaos Redux localisation, scripted localisation, dynamic text, tooltip quality, key coverage, duplicate keys, namespace consistency, BOM encoding, and player-facing wording clarity."
config_file = "agents/chaosx_localisation_auditor.toml"

[agents.chaosx_repo_explorer]
description = "Read-only Chaos Redux repository explorer for large or uncertain Chaos Redux tasks. Use only when file locations, existing patterns, vanilla references, likely touchpoints, dependency order, or source-of-truth inputs are unclear. Do not use for small known-file edits, direct text updates, asset-only production, localisation-only cleanup, or tasks where the parent already has exact files and ids. Maps relevant repo files, vanilla precedents, risks, meaningful validation checks, and edit order. Does not patch gameplay files."
config_file = "agents/chaosx_repo_explorer.toml"

[agents.chaosx_scripted_system_architect]
description = "Active architect and narrow implementation subagent for reusable Chaos Redux scripted effects, scripted triggers, script constants, event targets, meta effects, variables, tuning tables, formable helpers, scripted GUI helpers, and dynamic helper logic."
config_file = "agents/chaosx_scripted_system_architect.toml"

[agents.chaosx_skill_maintainer]
description = "Creates, updates, audits, and trims Chaos Redux repo skills. Use when a reusable workflow, repeated mistake, validation pattern, asset workflow, prompt pattern, or project convention should be captured in a skill. Does not edit gameplay files."
config_file = "agents/chaosx_skill_maintainer.toml"

[agents.chaosx_spreadsheet_doc_worker]
