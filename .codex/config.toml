  "/d",
  "/c",
  "call",
  "C:/Users/klimp/OneDrive/Documents/Paradox Interactive/Hearts of Iron IV/mod/chaos_redux/.tools/3d_pipeline/wrappers/run_blender_hoi4_adapter.cmd"
]
cwd = "C:/Users/klimp/OneDrive/Documents/Paradox Interactive/Hearts of Iron IV/mod/chaos_redux"
env_vars = ["MESHY_API_KEY"]
startup_timeout_sec = 120.0
tool_timeout_sec = 1800.0
default_tools_approval_mode = "auto"
enabled_tools = [
  "chaosx_blender_hoi4_health",
  "chaosx_blender_hoi4_prepare_candidate",
  "chaosx_blender_hoi4_inspect_scene",
  "chaosx_blender_hoi4_process_textures",
